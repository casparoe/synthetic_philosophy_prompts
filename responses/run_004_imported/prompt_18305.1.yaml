answer: |-
  **Setting:** *A graduate seminar room, late afternoon. The whiteboard is covered in arrows connecting "Meaning," "Use," and "Fact." Two students, ELENA (Dispositionalist) and MARCUS (Kripkean Skeptic), remain at the table after the others have left.*

  **Elena:** Look, the finitude objection is a red herring. Sure, I can't actually compute $10^{100} + 5$. My brain is too small, my lifespan too short. But when we ask what I *mean* by plus, we aren't asking about my physical limitations. We're asking about my competence. So, we idealize. We construct a counterfactual: *If* I were infinite in capacity and time, *and* I remained consistent with my current linguistic behavior, I *would* say $10^{100} + 5$ equals... well, the sum. The disposition is there, it's just masked by physical constraints.

  **Marcus:** But that counterfactual is empty, Elena. You're saying, "If I were ideal, I would do what I mean." But that presupposes we already know what you mean to check if the idealization is correct. Kripke's point is that there is no fact about you—dispositional or otherwise—that fixes the meaning *before* we interpret the disposition.

  **Elena:** It's not empty. It's grounded in my actual responses to smaller numbers. The idealization is just an extrapolation of the curve I'm already drawing.

  **Marcus:** Exactly! And that's the normativity gap. Even if we grant this idealized disposition, all it tells us is what you *would* say. It doesn't tell us what you *should* say. Suppose your brain is wired such that, for numbers larger than 57, your idealized disposition is to compute *quus* (where $x \oplus y = x + y$ if $x, y < 57$, else $5$). If that's your disposition, then on your view, you *mean* quus. But intuitively, you'd be making a mistake, not following a different rule. A disposition to err consistently is still a disposition. Why is the plus-disposition the *correct* one and the quus-disposition a *malfunction*? You haven't bridged the gap from *is* to *ought*.

  **Elena:** I bridge it by appealing to *function*. You're treating the mind like a blank slate that just happens to output sounds. But cognitive systems have a teleological structure. A heart can malfunction; it can fail to pump blood. When it fails, we don't say, "Oh, well, its function is now to wiggle uselessly." We say it's broken relative to its design. Similarly, my cognitive apparatus is designed—biologically and socially—to track additive relations. An idealized disposition isn't just "whatever I would say if I were bigger"; it's "whatever I would say if my cognitive machinery were functioning *properly*."

  **Marcus:** "Properly" relative to what? You're smuggling in the normativity you're trying to explain. To say my brain is "designed" to add rather than quus, you need a fact about the design that fixes *add* as the target. But the physical facts of my brain's history are compatible with the hypothesis that I was designed to quus. Maybe the designer—evolution, society, whatever—intended me to switch to quus at 57. How does the "design" story rule that out without just stipulating that the design was for plus?

  **Elena:** Because the design isn't determined by a single moment of intention; it's determined by causal history and survival value. The reason I mean plus and not quus is that the computational strategy I've internalized is one that has paid off in my interactions with the world *so far*. A system designed to quus would eventually lead to predictive failures in a world that behaves additively. The "malfunction" is defined by the friction between the cognitive mechanism and the environment it evolved to navigate. If I say "125" for "68+57," I'm aligning with the causal structure that shaped my dispositions. If I say "5," I'm severing that link.

  **Marcus:** But that just pushes the skepticism back to the environment. How does the environment fix the meaning? You say the world "behaves additively." But the world's behavior is just a sequence of events. That sequence is compatible with infinite rules, including quus. You're saying, "My disposition matches the world." But to check the match, I need to know which rule the world is following. Does the world follow plus or quus? The physical facts don't say. So, if your design is tuned to the world, and the world's rule is indeterminate, your design's target is indeterminate. You still haven't found a fact that makes it *true* that I ought to say 125 rather than 5. You've just given me a causal story about why I *am* disposed to say 125.

  **Elena:** I'm not saying the causal story makes it *true* in a Platonic sense. I'm saying it grounds the normativity in natural facts. You're looking for a justification that floats free of causality. I'm saying the "ought" is internal to the system's maintenance. If I want to continue being a functioning agent in this community and environment, I *ought* to follow the disposition that maintains coherence. The "mistake" isn't a violation of a heavenly table; it's a breakdown in the homeostatic system of communication. If I quus, I break the system. The normativity is hypothetical: *If* you want to function, *then* you must follow the plus-disposition.

  **Marcus:** But Kripke's skeptic asks: What makes it the case that I *want* to function as a plus-user rather than a quus-user? Or rather, what makes it the case that "functioning" *means* sticking to plus? You're assuming that "continuing the same practice" means "doing what I did before." But the skeptic asks what constitutes "the same." If my idealized disposition includes a switch to quus, then *that* is my function. You're privileging the "plus" interpretation of my function because it matches *your* usage. But we are trying to find the fact about *me* that makes my usage correct. If your naturalistic story allows for a "quus-functioning" agent, then you haven't shown why *I* am a plus-agent. You've just described a community of plus-agents and noted that I resemble them. That's the Skeptical Solution, Elena, not the Straight Solution you're aiming for.

  **Elena:** Not necessarily. I'm claiming that the "quus-functioning" agent is biologically unstable. A rule that switches arbitrarily at 57 lacks the projective power required for the survival of the cognitive system. The "plus" disposition is the one that maximizes predictive stability. So the fact that fixes the meaning is the *optimality* of the disposition relative to cognitive economy. It's not just that I match the community; it's that my brain is an optimization engine, and "plus" is the local maximum. "Quus" is a glitch in the optimization process.

  **Marcus:** But why is "plus" the local maximum and not "quus"? Mathematically, they are equally simple functions up to the point of divergence. The only reason "plus" looks simpler is that we are already viewing it through the lens of our current arithmetic. You're using the conclusion to justify the premise. You say quus is a glitch, but that's only because you assume the system is supposed to be doing plus. If the system was supposed to be doing quus, then switching at 57 is perfect functionality. You haven't found a natural fact that distinguishes the two purposes. You've just asserted that one purpose is "rational" and the other isn't, which brings us right back to the normativity you were supposed to be naturalizing.

  **Elena:** Then perhaps the natural fact isn't in the math, but in the *training*. The causal chain of my ostensive learning physically constrains the hypothesis space. I wasn't just given numbers; I was given corrections. "No, not that." Those physical interventions carve a channel in the disposition. The idealized disposition isn't a mathematical extrapolation; it's the path of least resistance through the channel carved by my training history.

  **Marcus:** And the skeptic asks: How do those physical interventions determine which channel is carved? When the teacher said "No," did they mean "No, you violated plus" or "No, you violated quus"? The physical sound waves are the same. The neural impacts are the same. The interpretation of those impacts as "corrections" rather than "noise" relies on the very rule you're trying to derive. You're building the lock to fit the key you already hold.

  **Elena:** *(Pauses, tapping her pen)* So you're saying that without a prior grasp of the rule, no amount of causal history—design, training, or optimization—can fix the content?

  **Marcus:** I'm saying that no *factual* state of the individual can do it. That's why Kripke thinks we have to move to the community. Not as a fact that makes you right, but as a practice that *licenses* your claim.

  **Elena:** But if I concede that, I lose the idea that I mean anything *now*, independently of future verification. I become a hollow vessel waiting for the community to validate me. I'm not ready to say my current understanding is that empty. There has to be a fact about my grasp of the rule, even if it's fragile.

  **Marcus:** Then you have to find a fact that isn't just another disposition in disguise. Because as long as it's a disposition—idealized, teleological, or optimized—it remains vulnerable to the question: "And what makes *that* the right standard?"

  **Elena:** Maybe the vulnerability is the point. Maybe the fact isn't a static object, but a dynamic stability. I don't need to prove I can't be interpreted as quus-ing; I just need to show that, given the world I'm in, the plus-disposition is the only one that sustains itself.

  **Marcus:** Sustains itself for whom? For you? For us? If it's just for you, we're back to the Private Language argument. If it's for us, you've accepted the Skeptical Solution.

  **Elena:** *(Smiles faintly)* Or maybe I've shown that the Straight Solution and the Skeptical Solution aren't as far apart as you think. The "fact" is the stability of the practice itself.

  **Marcus:** Then you're no longer a dispositionalist, Elena. You're a pragmatist. And Wittgenstein might be okay with that. But Kripke's skeptic? He'll still ask you what "stability" means without a rule to measure it against.

  **Elena:** Then we'll need another seminar. But at least we agree the coffee machine's disposition to brew is functioning correctly, or we're all going to malfunction.

  **Marcus:** *(Laughs)* See? Even you can't help but appeal to the community's standard of "functioning." Pass the mug.
