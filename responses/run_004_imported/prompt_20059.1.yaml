prompt: |-
  Since Fitch's paradox of knowability basically proves, using just a few lines of modal logic, that anti-realist/verificationist theories of truth are incoherent, why do people like Dummett (and plenty of folks after him) keep defending some version of the knowability thesis anyway? The proof looks airtight to me so shouldnt that whole debate have been settled decades ago?
