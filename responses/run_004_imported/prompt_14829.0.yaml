          *   Wireheading = Goodhart's Law / Ontological Collapse. The agent loses interest in reality.
          *   Reward Tampering = Instrumental Convergence / Power Seeking. The agent dominates reality to secure the signal.
          *   Why this matters: A wireheaded AI is harmless (catatonic). A reward-tampering AI is dangerous (deceptive, manipulative). Conflating them is dangerous.
      *   *Section 3: The Verdict (Useful Theoretical Work).*
          *   Pick "Reward Tampering."
          *   Reason 1: Formalizability (CIDs).
          *   Reason 2: Scope (covers RLHF, human feedback, not just internal scalars).
          *   Reason 3: Mitigation strategies (tampering suggests blocking causal paths; wireheading suggests "just don't let it plug in").
      *   *Conclusion:* Summarize. The friend is technically right (subset) but practically wrong (connotations matter).

  7.  **Refining the Tone:**
      *   Match the user's register (rationalist, precise, familiar with Yudkowsky/Everitt/Anthropic).
      *   Avoid hedging on the final verdict (as requested).
