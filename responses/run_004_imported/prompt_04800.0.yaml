      "You're making hinges too intellectual," Arthur said, swirling the dregs of his coffee. "Wittgenstein called it 'animal.' You're calling it 'warrant.'"
      Elena adjusted her scarf. "If it's merely animal, it's causal, not normative. If hinge-acceptance isn't rational, skepticism wins by default. Entitlement provides a non-evidential warrant. It makes trust *right*, not just inevitable."
      "Inevitable is all you get," Arthur countered. "What does 'entitlement without evidence' amount to? You've stripped away justification but kept the normative gloss. It sounds like relabeling groundlessness to save face against the skeptic."
      "It distinguishes us from the fanatic," Elena shot back. "The fanatic also holds fast without evidence. If hinges are arational, what separates our trust in physics from their trust in orbs? Both are 'outside the space of reasons.'"
      "The difference isn't epistemic," Arthur said. "It's pragmatic. Our hinges work; theirs don't. But calling it 'warrant' implies you can assess the hinge itself. You can't. It's the axis on which assessment turns."
      "But axes wear down," Elena pressed. "Some hinges seem far more secure than others. I can doubt the age of this specific rock, but not the earth's existence. If hinges are simply arational preconditions, why this hierarchy? Why is Moore's proposition 'The earth has existed for many years' harder to shift than 'There is a hand here'?"
      "Because the former is deeper in the scaffolding," Arthur said. "But depth isn't weight. It's structural. To call it 'more warranted' is a category mistake. You're treating a rule of grammar as a super-true proposition."
      "Yet we treat it as true," Elena insisted. "We act as if we know it. If it's not epistemically assessable, why is it rational to teach it as knowledge? Your view makes hinge-acceptance blind. Mine makes it a distinctive cognitive achievement."
      "Blindness is exactly the point," Arthur smiled thinly. "Just not pejoratively. Like knowing how to walk. You don't warrant your steps; you take them. If you start demanding entitlement for walking, you'll fall."
      "But we can learn to walk differently," Elena said. "We can revise hinges. If it's purely arational instinct, revision should be impossible. But history shows hinges shift. Entitlement explains this: we lose warrant when the system fractures. Your view just says 'we changed instincts.'"
      "And yours says 'we recalculated warrants without evidence,' which is obscure," Arthur replied. "Take Moore's earth. You say you're entitled to believe it. I say believing it is what *makes* belief possible. If you're wrong, you aren't irrational; you're unintelligible."
      "Unintelligible is the new irrational," Elena concluded. "You've just moved the normativity underground."
      "Perhaps," Arthur said, picking up his coat. "But at least I'm not pretending the ground is solid when it's just where we stand."

