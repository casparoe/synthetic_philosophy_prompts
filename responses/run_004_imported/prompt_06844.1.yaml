      *   **Context:** A novel set in 1920s Harlem.
      *   **Characters:** A young female painter (protagonist) vs. her mentor (a W.E.B. Du Bois stand-in, head of an uplift society).
      *   **Conflict:** Mentor wants "positive" race pictures (uplift); Painter wants realism (pool halls, hustlers, unglamorous truth).
      *   **Specific Reference:** Du Bois's "Criteria of Negro Art" (1926) and his critique of Claude McKay's *Home to Harlem*.
      *   **Goal:** Understand the *nuanced* implications of Du Bois's actual position on art/propaganda to fuel the argument, avoiding a generic "art for art's sake vs. message" trope.
      *   **Key Constraint:** Focus on what Du Bois specifically thought propaganda art had to *accomplish*.

  2.  **Deconstruct Du Bois's Position (Historical & Philosophical Context):**
      *   *The "Propaganda" Quote:* "All Art is propaganda and ever must be, despite the wailing of the purists." This is often taken out of context. He doesn't mean *all* art is political messaging in a crude sense. He means Black art *must* function as propaganda because of the specific historical moment of anti-Black racism.
      *   *The Goal of Propaganda:* It's not just "make us look good." It's about fighting the *lie* of Black inferiority. If the truth looks "bad" to white audiences who already hate Black people, does it reinforce the lie?
      *   *The McKay Critique:* Du Bois reviewed *Home to Harlem* (1928). He famously said it made him feel like taking a bath. Why? Not because it was fictional, but because it catered to the "prurient demand" of white readers for "quaint" or "degenerate" Negroes. He felt it lacked a constructive vision.
      *   *Truth vs. Effect:* Du Bois wasn't against truth. He was against truth that was *weaponized* by the oppressor. He believed in a "Talented Tenth" responsibility. Art should lead the race *up*, not just document the gutter.
      *   *Beauty:* Du Bois cared deeply about Beauty. For him, Propaganda + Beauty = Truth that liberates. Ugly propaganda fails.

  3.  **Identify the Nuances for the Novel's Conflict:**
      *   *Generic Debate:* "I want to paint truth" vs. "I want to paint lies to help the race." (Too simple).
      *   *Du Boisian Debate:* "I want to paint the full humanity, which includes sin" vs. "I want to paint a counter-narrative that disrupts white caricatures, because sin without context reinforces those caricatures."
      *   *The Mentor's View:* It's not about lying. It's about *strategic representation*. If a white person sees a painting of a hustler, they see "confirmation of black criminality." If they see a painting of a doctor, they see "refutation of black inferiority." The mentor believes the artist has a *duty* to the race's survival, not just their own expression.
      *   *The Painter's View:* It's not about "art for art's sake." It's about *integrity*. If we only paint the pretty stuff, we are lying to ourselves. We are creating a fragile mask. Also, the "ugly" parts are where the life is.
      *   *The Crux:* Who owns the image? Does the Black artist owe the Black community a shield, or a mirror?

  4.  **Drafting the Implications (Iterative Process):**

      *   *Point 1: The Audience Matters.* Du Bois was obsessed with the *white gaze*. He knew white people judged the whole race by its worst members. The mentor should argue: "You aren't painting for yourself; you're painting for the white juror who decides if we're human."
      *   *Point 2: Truth is Relative to Power.* Du Bois didn't deny poverty/crime existed. He denied that it was the *defining* feature. The mentor should argue: "That is *a* truth, but it is not *the* truth of our capacity."
      *   *Point 3: The Function of Beauty.* Du Bois believed Beauty was a weapon. If the painting is ugly (thematically), it fails as propaganda. The mentor should argue: "Ugliness repels. Beauty attracts. We need attraction to survive."
      *   *Point 4: The Responsibility of the Elite.* The mentor runs an "uplift society." He believes in the Talented Tenth. The artist is part of the elite. She has a debt to the masses to represent them *better* than they can represent themselves in a racist society.
      *   *Point 5: McKay Specifics.* Use the *Home to Harlem* critique. It wasn't about "no sex/violence." It was about "no redeeming vision." The mentor should ask: "Where is the way out? Where is the dignity?"

  5.  **Refining the Argument for the User:**
