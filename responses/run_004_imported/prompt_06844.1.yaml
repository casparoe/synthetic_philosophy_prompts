prompt: |-
  im working on a novel set in 1920s Harlem about a painter whose mentor -- kind of a Du Bois stand-in, runs the local uplift society -- keeps pushing her to make 'positive' pictures of the race, when all she actually wants to paint is the neighborhood exactly as she sees it: pool halls, hustlers, the whole unglamorous mess. I keep coming back to Du Bois's Criteria of Negro Art, that bit about how all art is propaganda and the purists can go cry about it -- from the same guy who couldnt stomach Claude McKay's Home to Harlem for being too seamy. can you give me the most important implications of Du Bois's actual position (not the soundbite version) for the argument between these two? I dont want it to collapse into a generic art-for-art's-sake vs message debate, I want it to turn on what he specifically thought propaganda art had to accomplish.
