answer: |-
  This is a rich conflict because it isn't actually about "truth vs. lies." It is about **who owns the image of Blackness and what that image is obligated to do in a white supremacist world.**

  If you want to avoid the generic "art for art's sake vs. social message" trope, you need to understand that Du Bois did not view "Propaganda" as a dirty word, nor did he view "Beauty" as separate from politics. For Du Bois, Beauty *was* the mechanism of the propaganda.

  Here are the four most important implications of Du Bois's actual position for your mentor character, specifically tailored to deepen the argument beyond a simple censorship debate.

  ### 1. The Argument is About the "White Gaze," Not Censorship
  Du Bois's critique of *Home to Harlem* wasn't that McKay lied about the existence of Harlem's underworld. It was that McKay fed the "prurient demand" of white readers. Du Bois believed white America judged the entire race by its worst members. Therefore, a Black artist showing the "worst members" without a counter-narrative was handing ammunition to the enemy.

  *   **For the Mentor:** He shouldn't say, "Don't paint hustlers, it's a lie." He should say, "When *you* paint a hustler, you see a study in light and shadow. When the white critic sees it, they see confirmation of their biology textbooks. You are not painting in a vacuum. You are painting into a courtroom where the jury is already hostile. Do not give them evidence to hang us with."
  *   **The Nuance:** The mentor isn't asking for fake smiles. He is asking for **contextual dignity.** He wants the hustler painted with the same gravitas as a king, or not painted at all until the world is ready to see the humanity in the sin.

  ### 2. "Propaganda" Must Be Beautiful to Function
  This is the part of "Criteria of Negro Art" often missed. Du Bois writes: *"Thus all Art is propaganda and ever must be, despite the wailing of the purists... I do not care a damn for any art that is not used for propaganda."* But he immediately follows this by insisting that the propaganda must be rooted in **Beauty.**

  He believed that if the art was ugly (thematically or aesthetically), it would repel the viewer, and the message would fail. He wanted art that made Blackness *desirable* and *admirable* to the world.

  *   **For the Mentor:** "You call it realism; I call it ugliness. And ugliness does not liberate. If you paint our filth without painting our glory, you make us repulsive. To save the race, we must be made lovely. Not pretty—*lovely*. There is a difference. Your pictures make people look away. I need pictures that make them lean in."
  *   **The Nuance:** The mentor loves art. He isn't a bureaucrat crushing creativity; he is an aesthete who believes aesthetic failure is political failure. He thinks her "grimy" style is technically or spiritually incapable of achieving the Beauty required to shift public opinion.

  ### 3. The Responsibility of the "Talented Tenth"
  Du Bois believed in the responsibility of the educated elite (the Talented Tenth) to lift up the masses. He viewed the artist as a priest of the race. In this worldview, individual expression is secondary to collective survival. The artist belongs to the race first, and themselves second.

  *   **For the Mentor:** "You think this canvas belongs to you? It belongs to the maid who scrubs the floors so you can buy the paint. It belongs to the boy who cannot walk into the museum down the street. You have been given the gift of sight. That is not for your indulgence. It is a tool for uplift. To waste it on the gutter is a betrayal of your class and your color."
  *   **The Nuance:** This creates a class tension. The mentor represents the Victorian, elite, "uplift" politics of the NAACP old guard. The painter represents the New Negro who is tired of respectability politics. The mentor genuinely believes he is protecting the vulnerable masses from being defined by their worst moments.

  ### 4. Truth is Strategic, Not Absolute
  Du Bois acknowledged the "seamy" side of life, but he believed that emphasizing it *at that specific historical moment* was strategically suicidal. He wasn't denying the truth of poverty or crime; he was denying its **representative weight.** He felt that because white caricatures already depicted Black people as lazy, criminal, and hypersexual, Black art had a duty to provide the *counter-weight*, not the documentation.

  *   **For the Mentor:** "I do not deny the pool halls exist. I deny that they are the *truth* of us. The truth of us is also the doctor, the teacher, the mother, the dreamer. If you paint only the shadow, you are lying just as much as if you painted only the light. You are painting a fragment and calling it the whole. That is not truth; that is caricature."
  *   **The Nuance:** This puts the painter on the defensive. She has to argue that the "shadow" is where the *life* is, and that the "doctor and teacher" portraits are the ones that feel like costumes.

  ### How to Stage the Argument (Avoiding the Cliché)

  **Don't let the Painter argue for "Freedom."**
  If she just says, "I have the right to paint what I want," the Mentor wins easily (because he believes rights are secondary to survival).

  **Let the Painter argue for "Integrity as Survival."**
  Her counter-argument should be Du Boisian in its own way. She should argue that **masking is death.**
  *   *Her Angle:* "If we only paint the pretty pictures, we are building a house of cards. When the white man sees the hustler on the street, he will know we lied to him in the gallery. He will trust the street more than the canvas. The only way to make them respect us is to force them to see the *whole* man, sin and all. To hide the sin is to admit we are ashamed of it. I am not ashamed."

  **The Tragic Irony:**
  The Mentor is historically "right" about the consequences (white critics *did* use *Home to Harlem* to mock Black writers), but the Painter is morally "right" about the art.
  *   **Mentor's Tragedy:** He knows that if she fails, *they* all fail. He is carrying the weight of the race on her brushstrokes.
  *   **Painter's Tragedy:** She knows that if she listens to him, she kills the very thing that makes her art alive.

  ### Specific Dialogue Hook based on the McKay Review
  Du Bois wrote of *Home to Harlem*: *"It leaves me with a feeling of nausea after the reading."*

  **Mentor:** "Read me your statement. Read me what you intend to say with this canvas."
  **Painter:** (Describes the raw humanity of the pool hall).
  **Mentor:** "It is honest. I believe you. But the man who buys this painting? He does not see humanity. He sees 'nausea.' Du Bois said it of McKay, and I say it to you: Do not cater to the prurient demand. Do not give them the Harlem they expect. Give them the Harlem we are building."
  **Painter:** "But the Harlem you're building doesn't exist yet. The one in the pool hall? That's where we live *now*. Are we only allowed to paint the promise, and never the price?"

  This framing makes the conflict about **temporality** (the present reality vs. the future aspiration) and **audience** (internal truth vs. external perception), which is much deeper than "censorship."
