      *   *Note:* There is no single "correct" answer in philosophy, but there are prevailing trends in the experimental philosophy (x-phi) literature regarding which theories have survived empirical scrutiny best.

      *   **(i) Knobe's Original View (Evaluative/Conceptual):**
          *   *Strengths:* Directly addresses the asymmetry.
          *   *Weaknesses:* Early versions were too simplistic. Later versions (the "Skill Model" or "Praiseworthiness/Blameworthiness" integration) evolved. However, the strict claim that *moral* evaluation constitutes the concept faces challenges from non-moral norm studies (Uttich & Lombrozo). It's often seen as too radical or lacking mechanism compared to newer norm-based views.
          *   *Status:* Foundational but arguably superseded by more nuanced norm-based accounts.

      *   **(ii) Adams & Steadman (Pragmatic/Implicature):**
          *   *Strengths:* Preserves the classical concept of intentional action (truth conditions remain stable).
          *   *Weaknesses:* Empirical evidence suggests the effect persists even when pragmatic cues are minimized (e.g., specific wording changes, non-linguistic tasks). Many x-phi studies have pushed back against the purely pragmatic explanation.
          *   *Status:* Generally considered less empirically adequate than cognitive/norm-based models.

      *   **(iii) Machery (Trade-off Hypothesis):**
          *   *Strengths:* Attempts to explain the asymmetry via cost-benefit analysis.
          *   *Weaknesses:* Empirically vulnerable. Studies have shown the effect persists even when trade-offs are controlled or absent. It doesn't handle the non-moral norm cases well.
          *   *Status:* Largely falsified or considered insufficient in the current literature.

      *   **(iv) Sripada (Deep Self Concordance):**
          *   *Strengths:* Connects intentionality to the agent's deeper values/attitudes. Explains why we see the harmful side effect as more "revealing" of the self.
          *   *Weaknesses:* Some studies suggest the effect persists even when Deep Self concordance is controlled for. It explains *why* we care, but maybe not the fundamental cognitive mechanism of the *asymmetry* itself as well as norm theories.
          *   *Status:* Strong contender, but often seen as complementary to norm theories rather than the sole explanation.

      *   **(v) Alicke (Culpable Control):**
          *   *Strengths:* Highlights the motivational aspect (blame drives the judgment).
          *   *Weaknesses:* Can be seen as circular (we blame because it's intentional, or it's intentional because we blame?). While powerful, it sometimes struggles with the non-moral/conventional norm cases where "culpability" is less clear than "norm violation."
          *   *Status:* Very influential, but often grouped with or slightly less comprehensive than the broader Norm-Theoretic account.

      *   **(vi) Uttich & Lombrozo (Norm-Theoretic):**
          *   *Strengths:* Generalizes the effect beyond *moral* norms to *any* norm (statistical, conventional). This accommodates the widest range of data (including the specific prompt requirement about conventional/statistical norms). It explains the cognitive mechanism (norm violation makes the side effect salient/relevant for attribution).
