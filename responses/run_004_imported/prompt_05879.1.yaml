answer: |-
  Here are eight questions designed for a graduate colloquium Q&A with a contemporary Strawsonian. They are structured to move beyond exegesis into critical pressure points, with follow-ups tailored to the standard defensive moves a defender of the reactive-attitudes framework typically makes.

  ### 1. The Justification vs. Explanation Gap
  **Question:** Strawson argues that the participant stance is too deeply woven into ordinary human life for us to globally abandon it. Critics argue this conflates *inevitability* with *justification*. Does claiming we *cannot* give up the practice actually answer the skeptic's demand to know if the practice is *fair*, or does it merely explain why we are psychologically compelled to engage in it regardless of its fairness?

  **Anticipated Reply:** She will likely argue that the demand for an "external" justification is incoherent because responsibility is internal to our form of life; there is no "outside" vantage point from which to judge it.
  **Follow-up:** If there is no external vantage point, how do we distinguish between a practice we *cannot* give up because it is constitutive of human goods, versus a practice we *cannot* give up because of mere cognitive limitation or bias? If the latter, doesn't the skeptic win by showing the practice is a necessary illusion?

  ### 2. Manipulation and the Historical Condition
  **Question:** In Pereboom-style manipulation cases, an agent satisfies all contemporaneous conditions for responsibility (reasons-responsiveness, quality of will) but was covertly engineered to act as they did. To exclude these agents, many Strawsonians feel compelled to add a *historical* condition. Does importing a non-reactive, historical condition to rule out manipulation abandon the naturalistic spirit of Strawson's original proposal, which grounds responsibility in our *actual* present reactions rather than metaphysical histories?

  **Anticipated Reply:** She will likely argue that discovering manipulation alters the *current* quality of will or the interpersonal relationship itself, meaning no extra metaphysical history is needed—the reactive attitude naturally dissipates.
  **Follow-up:** But if the agent's current psychology and behavior are identical to a non-manipulated agent, why does the attitude dissipate? If it dissipates only because we *know* the history, aren't you admitting that the natural reaction is unreliable and needs correction by the very kind of metaphysical facts Strawson sought to bypass?

  ### 3. The Expansion of the Objective Attitude
  **Question:** Strawson grants the appropriateness of the objective attitude toward children and the severely mentally ill, acknowledging that the participant stance is not universally applicable. Given that determinism suggests all agents are causally determined similar to these exempted groups, what principled barrier prevents the objective attitude from spreading case-by-case until it becomes a global replacement for the participant stance?

  **Anticipated Reply:** She will likely argue that normal adult relationships offer reciprocal goods (friendship, love, mutual accountability) that are destroyed by the objective stance, whereas relationships with children or the severely ill do not rely on this reciprocity.
  **Follow-up:** Is this barrier pragmatic or metaphysical? If it is merely pragmatic (i.e., we *shouldn't* take the objective stance because it's lonely, not because it's *untrue*), does that concede the skeptic's point that we aren't *really* responsible, but only that it is useful to pretend we are?

  ### 4. Cultural Variability and Naturalism
  **Question:** Strawson's argument relies heavily on an appeal to "human nature" and the naturalness of reactive attitudes. However, anthropological evidence suggests significant cultural variation in how resentment, guilt, and indignation are expressed and valued. Does this variability undermine the claim that these attitudes reveal a universal structure of responsibility, or does your naturalism allow for a thicker, more culturally specific grounding of the practice?

  **Anticipated Reply:** She will likely distinguish between the *capacity* for reactive attitudes (which is universal) and the *norms* governing their expression (which vary), arguing the former is sufficient for the Strawsonian project.
  **Follow-up:** If the norms governing expression vary significantly, doesn't that affect the *content* of the responsibility ascribed? If one culture views resentment as a failure of self-control and another as a duty of justice, can we still say they are participating in the *same* responsibility practice that grounds a unified theory?

  ### 5. The Normativity of Reactive Attitudes
  **Question:** On your view, is the appropriateness of a reactive attitude (like resentment) a matter of its fittingness to the agent's quality of will, or is it a matter of its utility in regulating social behavior? If it is merely fittingness, doesn't that reintroduce a form of desert that requires metaphysical freedom? If it is utility, doesn't that reduce responsibility to social engineering?

  **Anticipated Reply:** She will likely attempt a middle path: the attitudes are normatively governed by the expectations of goodwill, which is neither pure desert nor pure utility, but a constitutive norm of relationships.
  **Follow-up:** But if an agent lacks the metaphysical ability to meet that expectation (due to determinism), in what sense is it a "norm" they are bound by rather than just a standard they fail to meet? How can we demand goodwill from someone who could not have offered it?

  ### 6. Moral Luck and Outcome Dependence
  **Question:** Our reactive attitudes are notoriously sensitive to moral luck; we resent a negligent driver who kills a child far more than one who hits nothing, even if their quality of will was identical. Does a Strawsonian account have to endorse this outcome-dependence as a feature of responsibility, or must it treat it as a bug in our natural psychology that we ought to refine away?

  **Anticipated Reply:** She will likely argue that the outcome changes the *meaning* of the action within the relationship, so the quality of will is not actually identical in the two cases (one expresses a will that *did* harm, the other a will that *risked* harm).
  **Follow-up:** If the difference lies entirely in the harm done, which is often outside the agent's control, doesn't this make responsibility hinge on factors that are arbitrary from the agent's perspective? How is this compatible with the fairness intuition that Strawsonians claim to preserve?

  ### 7. Basic Desert and the Skeptic
  **Question:** Many contemporary Strawsonians argue we can have responsibility without "basic desert." But when I feel resentment, I feel that you *deserve* to feel bad for what you did. Are you asking us to revise our concept of resentment to strip it of desert, or are you arguing that the desert implicated in resentment is compatible with determinism?

  **Anticipated Reply:** She will likely argue that the "desert" involved is not a metaphysical weight but simply the appropriateness of the emotional response within the relationship; it is a " Strawsonian desert" rather than a "Basic desert."
  **Follow-up:** If the skeptic insists that any legitimate notion of desert requires the ability to have done otherwise, isn't your move merely verbal? How does redefining desert prevent the skeptic from saying you've changed the subject rather than answered the challenge?

  ### 8. The Global Framework Challenge (Closing Question)
  **Question:** To close, I want to press on the limits of internal critique. You have explained how specific agents can be exempted (e.g., via psychosis or manipulation). But what *kind* of consideration—as opposed to a particular exempting fact about a single agent—could in principle show that the whole participant framework, rather than just one of its applications, is unjustified? Is there any possible evidence that would compel you to abandon the Strawsonian approach entirely?

  **Anticipated Reply:** She will likely say that only a pragmatic collapse (e.g., if the practice ceased to produce any human goods or became impossible to sustain) could justify abandonment, as there is no theoretical "view from nowhere" to condemn it.
  **Follow-up:** If the only condition for abandonment is pragmatic failure, does that mean the truth of determinism is irrelevant to your view? If so, are you a compatibilist, or have you effectively dissolved the problem of free will by changing the subject to social psychology?
