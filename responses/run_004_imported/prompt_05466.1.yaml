      *   **Core Problem:** The gap between ESR and OSR regarding the Newman Objection. ESR says "structure only (epistemically)," leading to Newman's triviality worry (any set of points can fit the structure). OSR says "structure only (ontologically)," denying independent relata.
      *   **Specific Question:** Does OSR *genuinely* dissolve the Newman-style triviality worry, or does it just relocate the problem into the metaphysics of structure itself? Compare the two positions on this specific point and argue which one comes out ahead.
      *   **Requirement:** Provide reasons for the evaluation.

  2.  **Deconstruct the Newman Objection:**
