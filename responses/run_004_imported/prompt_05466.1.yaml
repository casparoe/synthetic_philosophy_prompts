      *   *The Move:* If there are no independent relata, the cardinality constraint changes. It's not "a set of $N$ things fitting structure $S$." It's "Structure $S$ exists."
      *   *The Potential Relocation:* Does "free-floating structure" make sense? If structure is a set of relations, don't relations require terms? If OSR says "no," they need a metaphysics of relations without relata (e.g., ontic structures as modal patterns, graph theory without nodes, etc.).
