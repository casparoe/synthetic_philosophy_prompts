      *   *Argument:* If all we know is structure (relations), and we don't know the nature of the relata, then *any* collection of objects of the right cardinality can instantiate that structure. Structure alone, without constraints on the relata, is trivial.
      *   *Impact on ESR:* ESR accepts we don't know the intrinsic nature of relata. Newman says this makes the claim vacuous unless we add constraints on the relata. But adding constraints violates the "structure only" epistemic claim.

  3.  **Analyze ESR's Response to Newman:**
      *   *Cao's/Redhead's approach:* Causal structure? (Often leads back to intrinsic properties).
      *   *Worrall's approach:* Structure is retained across theory change. But Newman still bites: *which* structure?
      *   *The "Relations require Relata" intuition:* ESR usually assumes there *are* relata, we just don't know their intrinsic nature. This is the vulnerability.

  4.  **Analyze OSR's Response to Newman:**
