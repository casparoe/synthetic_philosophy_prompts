  8.  *(Final check against constraints)*: Did I answer "Is Mia onto something real?" Yes. Did I avoid "people get territorial"? Yes. Did I explain the source of the norm? Yes.

  **(Self-Correction Note):** I need to make sure I don't get *too* academic. Keep it grounded in the classroom scenario. Use terms like "Schelling Point" or "Tacit Consent" but explain them simply.

