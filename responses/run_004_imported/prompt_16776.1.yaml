answer: |-
  This is not dumb at all. In fact, it is genuinely ironic that this happened in a **social philosophy seminar**. You essentially lived through a case study on the emergence of social norms, the nature of property rights, and the concept of tacit consent.

  You asked where the "should" comes from if no one explicitly agreed to it. You asked if Mia is onto something real or if you're all just being tribal.

  The short answer is: **Mia is onto something real, but she is directing her anger at the wrong person.**

  Here is the breakdown of why that "should" exists, why it feels binding even without a written rule, and why your friend group instinctively backed her up.

  ### 1. The Source of the "Should": Humean Convention
  The philosopher David Hume argued that many social rules aren't based on grand moral truths or written laws, but on **conventions**. A convention is a solution to a coordination problem.

  *   **The Problem:** Everyone needs a place to sit. Chaos is inefficient.
  *   **The Solution:** We all sit in the same spot every day.
  *   **The Key:** It does not matter *which* spot you sit in. It only matters that we *agree* on the spots.

  Once a pattern is established (Weeks 1–8), it gains normative force. Why? Because **stability is valuable.** If everyone suddenly decided "actually, rules are fake," the classroom becomes chaotic again. The "should" comes from the collective benefit of maintaining the status quo. By Week 9, the seating chart had become a **social fact**. It existed because everyone behaved as if it existed.

  ### 2. Path Dependence (Why the randomness doesn't matter)
  You asked: *"Does it matter that the whole arrangement was completely random to begin with?"*

  In economics and philosophy, this is called **Path Dependence**. Imagine two drivers approaching each other on a narrow road. It doesn't matter if we decide everyone drives on the *left* or everyone drives on the *right*. But once we have all been driving on the *right* for eight weeks, driving on the *left* is now "wrong," even if the original choice was random.

  Mia's claim isn't that she has a divine right to *that specific chair*. Her claim is that **the system we built relies on consistency.** If the randomness of Week 1 is allowed to be overturned in Week 9 without cause, the utility of the system collapses. The "ownership" isn't about the wood and metal of the chair; it's about the reliability of the expectation.

  ### 3. The Professor Codified the Norm (The Game Changer)
  This is the most critical detail you mentioned: **The professor started handing back essays based on seating location.**

  In Weeks 1–8, Mia's claim was purely social/conventional. But once the professor used the seating chart for administrative logistics, the norm became **quasi-official.**
  *   The professor implicitly ratified the seating chart.
  *   The seat is now linked to Mia's academic identity (her graded work).
  *   Moving Mia disrupts the professor's system, not just Mia's ego.

  This gives Mia a legitimate, practical complaint. It is no longer just "territory"; it is now "logistical infrastructure."

  ### 4. Tacit Consent vs. The New Student
  So, why was the new girl wrong? She wasn't. She couldn't be.

  The rest of the class (including you and Mia) are bound by **tacit consent**. By showing up Week 2, Week 3, Week 4, and sitting in the same spots, you all voted with your bodies. You ratified the unwritten contract.

  The new student, however, **could not consent to a rule she didn't know existed.** She entered the game after the rules had solidified. This is a classic conflict between **established convention** and **new entrants.**

  Mia is right that a rule exists. But she is wrong to be angry at the new girl for breaking a rule she was never told. Mia's anger should actually be directed at the **system** (or the professor) for not onboarding the new student with the info: *"Hey, just so you know, we all sit in the same spots."*

  ### 5. Why Your Friend Group Sided with Mia
  You asked why you all sided with her if you agreed "no rule was officially real."

  You sided with her because you are **stakeholders in the convention.**
  If you tell Mia, "Actually, you're being crazy, seats are free for all," you are undermining the very norm that *you* also benefit from. You have a seat too. If the norm dissolves, your seat is up for grabs next.

  Defending Mia wasn't just tribalism; it was **norm enforcement.** Social norms only work if there is social pressure to maintain them. By fuming, Mia was acting as the enforcement mechanism for the group's unwritten contract. You sided with her because, instinctively, you recognized that protecting the stability of the group's routine is more valuable than the new girl's freedom to choose a chair.

  ### The Verdict
  **Is Mia being territorial?** Yes.
  **Is she also right about the principle?** Also Yes.

  She is experiencing a **legitimate violation of a social contract**, even if that contract was unwritten. The "should" comes from the collective need for order and the specific utility the professor added by linking seats to grades.

  **How to resolve it:**
  The new girl shouldn't be shamed. She is an innocent violator. But, the "right" thing to do is for the class (or the professor) to inform her of the convention. If she chooses to stay in the seat *after* knowing it disrupts the established order and the grading system, *then* she is being rude. Until then, Mia's anger is philosophically justified but misdirected.

  You didn't waste 40 minutes. You just analyzed the birth of a micro-state. That's what the seminar was supposed to be for.
