answer: |-
  Pastor, family, friends, members of the VFW, and old friends who knew him as Ski.

  Thank you for being here. For those of you who don't know me, I'm his grandchild. I stand here in the church where he was baptized ninety years ago, knowing that in a few hours, we'll gather at the VFW post where he spent countless evenings for the last fifty years. In many ways, those two buildings bookend the map of his life. One marked his entry into the faith; the other marked his return to the community.

  He was a man of specific dimensions. He was a machinist who believed that if a thing was worth doing, it was worth measuring twice. He was a church deacon who believed that faith was a verb, shown in casseroles delivered to sick neighbors and chairs stacked after bingo night. And, by his own cheerful admission, he was the worst fisherman in three counties. He told me once that the fish could smell his hesitation from underwater. I think he was wrong. I think the fish just knew that Ski was too busy talking about his grandchildren to pay attention to the bobber.

  We all know the outline of the years between the baptism and the deacon's bench. In 1968, he was nineteen years old. He was drafted into the Army and sent to the Central Highlands. He served his tour as an infantryman. When he came home, he arrived in a country that was fractured, angry, and in no mood to thank him for what he had endured.

  There was no parade. There was just Ski, coming home to build a life from scratch.

  I know that for many of you in this room, especially those who wore the uniform, the story of that war is often told in terms of duty. There is a quiet understanding among those who have served that the soldier's burden is not to debate the orders, but to protect the person standing to the left and to the right. It is a code of loyalty that exists independently of politics.

  But I also know that history is complicated. I have spent the last year studying the hard questions of war and conscience. I have learned that it is possible to hold two truths in your hands at the same time without letting them break you. One truth is that wars are decided by leaders and geopolitics, often far from the mud and the trees. The other truth is that in the field, morality shrinks down to a very human size. It becomes about who shares their water. Who watches the perimeter. Who carries the wounded when the helicopter can't land.

  My grandfather did not spend his life arguing about geopolitics. He spent his life arguing about the proper way to fix a carburetor, or whether a deacon should wear a tie to a potluck. But six months ago, apropos of nothing, he looked at me and offered the only political statement I ever heard him make about Vietnam. He said: *"I still don't know if we should've been there. I know I'd do the same thing again for the men next to me."*

  I have thought about those words a great deal since he died. They are not the words of a man who avoided the question. They are the words of a man who answered it with the only metric he trusted. He could not justify the war, but he could justify his love for his squadmates. He could not change the orders, but he could control his loyalty.

  In this church, we talk often about grace. I think there is a kind of grace in that distinction. It is the grace of recognizing that we are not responsible for every storm we are caught in, but we are responsible for how we treat our fellow travelers while the rain is falling. Ski honored his service not by claiming the war was perfect, but by claiming his brothers were worth protecting. That is a courage that does not expire when the treaty is signed.

  To his old squadmates: He spoke of you often. He counted you as part of his family long before today.
  To my grandmother: You were his home front, his peace, and his anchor. We love you.
  To everyone here: Thank you for loving him.

  He was baptized here as a baby, held in these arms. He is now returned to the God who knew him better than he knew himself. The questions of history will continue to be debated by people like me, in classrooms far away from here. But the question of who Ski was—that has already been answered. He was a man who kept his word, who loved his neighbors, who supported his brothers, and who, despite catching nothing, never stopped casting his line.

  Rest now, Ski. The watch is over.

  Amen.
