      *   **The Evolutionary Biologist (let's call him David):** Theoretical, focused on history and cost. Sees the genome as a historical document shaped by pressure. Worried about teleology and wasting resources on noise.

  3.  **Key Arguments to Weave In:**
      *   **Sarah (Causal Role):** Biochemical activity isn't random noise. Transcription factors bind for a reason. Even if it's not conserved, it might be species-specific regulation. Calling it "junk" discourages research. 80% might be an overstatement, but 10% (the conserved bit) is definitely too low.
      *   **David (Selected Effects):** Biochemical activity is cheap. Transcription is leaky. Just because a protein sticks doesn't mean it *does* anything useful (the "fly in the soup" analogy). The C-value paradox. The mutational load argument (if 80% is essential, the mutation rate would wipe us out). The TV set analogy (just because it makes noise doesn't mean it's broadcasting).

  4.  **Setting the Scene:**
