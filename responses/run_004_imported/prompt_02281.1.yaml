answer: |-
  **Setting:** *The lounge of the Hilton near the convention center. It's 11:30 PM. The carpet is patterned in a way that hurts tired eyes. SARAH (40s, genomicist, wearing a badge on a lanyard she keeps forgetting to take off) and DAVID (50s, evolutionary biologist, tie loosened, sleeves rolled up) are sitting in a booth with half-empty glasses of something amber.*

  **Sarah:** I thought you were going to bite the moderator's head off up there.

  **David:** *(Chuckles, swirling his ice)* I restrained myself. Barely. But when they put up that slide again… "80% Functional." It's like waving a red flag at a bull that's already read Haldane.

  **Sarah:** Come on, David. You know what we meant. We meant biochemically active. We meant there's a protein sitting on it, or it's getting transcribed into RNA. It's not empty space. It's doing *something*.

  **David:** That's the rub, isn't it? "Something." To you, "function" means "causal role." If I kick a rock and it moves, the rock has a function. If a transcription factor sticks to a sequence, that sequence is functional.

  **Sarah:** Because the binding isn't random. It's specific. The chromatin is open. The machinery is there. If the cell is spending ATP to transcribe it, it's not an accident.

  **David:** But the cell wastes ATP all the time. Transcription is leaky. Polymerases bump into things. Proteins stick to DNA because of electrostatic attraction, not because they're conducting a symphony. You're confusing noise with signal.

  **Sarah:** *(Leans forward)* Okay, but if I find a transcript that's conserved in primates but not mice, and it binds a specific regulator in human neurons… your definition says "junk" because it's not conserved deep enough. My definition says "potential regulatory innovation." If I call it junk, I stop studying it. If I call it functional, I ask what it does. Which is better for science?

  **David:** Which is better for *truth*? Look, I get the funding argument. "Junk" sounds like a dead end. But if you tell the world 80% of the genome is doing something important, you're lying.

  **Sarah:** I'm not saying it's all essential for survival. I'm saying it's part of the machinery.

  **David:** *(Holds up a finger)* There it is. "Machinery." That implies design. That implies selection. My definition is etiological. A heart's function is to pump blood *because* ancestors with pumping hearts survived. A stretch of DNA is functional if it's there *because* selection kept it there for that specific effect. If it's just… there… and happens to get transcribed? That's not function. That's physics.

  **Sarah:** That's too narrow. It assumes evolution is perfectly efficient. It's not. It's a tinkerer. Sometimes it builds scaffolding that doesn't hold weight but keeps the wall from falling over.

  **David:** Scaffolding costs energy. The genome has a cost. This is the mutational load argument, Sarah. You can't dodge it. If 80% of the genome is functional in the sense that it matters, then every child is born with hundreds of deleterious mutations. The human reproduction rate isn't high enough to purge that load. We'd have gone extinct ten thousand years ago. The math doesn't work.

  **Sarah:** *(Sips her drink, thinking)* The math assumes every functional base is equally critical. What if "functional" includes redundancy? Buffering? If I knock out one enhancer and the phenotype doesn't change, is it non-functional? Or is it part of a robust network?

  **David:** If knocking it out changes nothing, selection doesn't see it. And if selection doesn't see it, it drifts. If it drifts, it's not functional in the evolutionary sense. It's a passenger.

  **Sarah:** But it might be a passenger that becomes the driver later. Exaptation.

  **David:** Exactly! It's *potential* function. Not *current* function. You're selling the potential as the product.

  **Sarah:** *(Sighs)* Okay. Let's try your analogy. The TV one. You brought it up in Q&A.

  **David:** Ah. Dan Graur's favorite. The Immortality of Television Sets.

  **Sarah:** Walk me through it again. Slowly.

  **David:** Imagine a broken TV. It's smashed. But it's still warm. It's emitting heat. Maybe a capacitor is humming. It's interacting with the environment. It has "causal roles." By your definition, the broken TV is functional because it's emitting heat.

  **Sarah:** That's a straw man. We aren't measuring heat. We're measuring specific binding.

  **David:** But is the binding *doing* anything? Or is it just the hum of the broken capacitor? If a protein binds to a sequence but removing the sequence changes nothing about the organism's fitness, the binding is just heat. It's biochemical noise. The TV isn't broadcasting.

  **Sarah:** But what if the TV is broadcasting a signal we don't have the receiver for yet? Look, David, I worry that your definition is too backward-looking. You need conservation to prove function. But what about human-specific traits? Language, cognition? Those regions might not be conserved in mice because mice don't need them. If I only look for what's conserved, I miss what makes us us.

  **David:** I agree lineage-specific function exists. I do. But that's maybe 5%, 10% tops. It's not 80%. When you claim 80%, you're claiming the vast majority of the genome is under selection. That's what breaks the mutational load. That's what ignores the C-value paradox—why do salamanders have ten times more DNA than we do if 80% is functional? Do they need that much more regulation to be a salamander?

  **Sarah:** Maybe they do. Or maybe the definition of "functional" needs to be layered. Why can't we have both? "Selected-effect function" for the essential core, and "Causal-role function" for the biochemical activity.

  **David:** Because the press release didn't say "Layered Function." It said "Junk DNA is Dead." That's a headline designed to kill a concept that's actually useful. "Junk" tells me, "Don't waste time looking for conservation here." It's a null hypothesis.

  **Sarah:** And "Junk" tells a grad student, "Don't bother sequencing this region." It kills curiosity. I've seen papers rejected because reviewers said, "This is in a non-conserved region, why are you studying it?"

  **David:** *(Nods slowly)* I've been that reviewer. I admit it.

  **Sarah:** See? That's the danger. If we define function strictly by history, we blind ourselves to mechanism. I need to know what the genome *does*, not just how it got there.

  **David:** And I need to know why it's *there*, not just what it's bumping into. If we lose the evolutionary constraint, we lose the ability to distinguish signal from noise. We end up chasing ghosts. We spend millions studying transcripts that are just transcriptional static.

  **Sarah:** But some of those ghosts turn out to be real. Xist RNA was thought to be noise.

  **David:** Until it showed a massive selected effect. The history caught up with the biochemistry.

  **Sarah:** *(Laughs softly)* So you're saying I'm just ahead of the curve?

  **David:** I'm saying you're running a sweepstakes where the odds are one in a million. I'm trying to teach people how to calculate the odds.

  **Sarah:** *(Taps her glass)* Okay. Here's the compromise. The 80% figure… was probably wrong.

  **David:** *(Smiles)* Probably?

  **Sarah:** Okay, definitely. It was a provocation. But the idea that the genome is mostly silent, inert code? That's wrong too. It's a hive. It's buzzing. Most of the buzzing might not be language, but it's not silence.

  **David:** I can drink to that. It's not silence. It's just… most of it is the sound of the engine idling, not the car moving.

  **Sarah:** And sometimes, the idle *is* the function. Maintaining structure. Keeping chromatin open.

  **David:** If you can prove selection maintains that structure, I'm in. If it's just biophysical inevitability…

  **Sarah:** …Then it's heat from the broken TV.

  **David:** Exactly.

  **Sarah:** *(Raises her glass)* To the broken TVs.

  **David:** *(Clinks glass)* And to the ones that still broadcast.

  **Sarah:** Just… don't call my transcripts noise.

  **David:** Don't call my conserved elements "the only thing that matters."

  **Sarah:** Deal.

  **David:** *(Signals the bartender)* Another round?

  **Sarah:** Please. I need to think about how to explain mutational load to my postdocs without them quitting.

  **David:** And I need to figure out how to tell my students that just because it's conserved doesn't mean they understand it.

  **Sarah:** Cheers to that.
