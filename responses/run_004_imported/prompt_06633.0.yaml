      *   **Section 1: The Coworker's Challenge (The Reductionist View).** Flesh out the "just statistics" argument. Why it seems compelling (access to weights, lack of biology).
      *   **Section 2: The Dennettian Framework (True Believers & Real Patterns).** Clarify the criteria. It's not about "inner feeling"; it's about compression and prediction.
      *   **Section 3: The Showdown (Token vs. Belief).** Analyze the "next token" alternative. Show why it fails the compression test compared to the intentional stance. Use the "web of belief" analogy.
      *   **Section 4: Addressing the Rationality Objection.** LLMs lie/hallucinate. Does this disqualify them? No, Dennett handles irrationality via idealization.
