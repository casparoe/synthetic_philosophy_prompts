      *   *Conclusion:* The intentional stance wins. It provides a higher-order compression that the token-level description lacks. The token description is the "microstructure"; the belief is the "macrostructure." Just as knowing the position of every air molecule doesn't help you predict the weather as well as knowing the "high pressure system," knowing the weights doesn't help you predict the conversation as well as knowing the "beliefs."

  5.  **Drafting the Essay - Structure:**
