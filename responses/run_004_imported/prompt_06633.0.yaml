          *   The "next token" view is the *Physical/Design Stance*. It is computationally intractable for a human (or even a separate AI) to simulate the forward pass mentally to predict behavior.
          *   Therefore, the intentional stance earns its keep through compression.
      *   *Counter-Argument (Side A):* But LLMs hallucinate. They aren't rational. Dennett requires *rationality* for the intentional stance.
      *   *Rebuttal:* Dennett allows for "idealized" rationality. We attribute beliefs to humans even when they are irrational, by positing additional desires or mistaken beliefs. We can do the same for LLMs.
      *   *The Deciding Factor:* The "Real Patterns" argument hinges on whether the pattern is *extractable* and *useful*. If I say "The model believes X," can I predict its behavior better than if I say "The model assigns high probability to tokens consistent with X"?
