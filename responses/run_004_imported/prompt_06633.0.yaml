      *   **True Believers (1981):** Emphasizes the pragmatic necessity. If it works, it's valid.
      *   **Real Patterns (1991):** Refines the view. Patterns are real if they support *projection* (prediction) and offer *compression* (efficiency) over the "noise" of the physical level. Crucially, a pattern is real if there is no *better* or *equally good but simpler* description that renders it redundant.
