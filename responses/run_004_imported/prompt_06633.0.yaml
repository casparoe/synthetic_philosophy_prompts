      *   I need to decide which side wins *on Dennettian grounds*.
      *   *Key Criterion:* Does the intentional description offer *better compression* and *predictive leverage* than the sub-intentional (token) description?
      *   *Argument for Side B (LLMs have beliefs):*
          *   The "next token" description is low-level. Knowing the probability distribution of the next token doesn't tell you *why* the model chose it in a way that helps predict the *next 100 tokens* in a complex reasoning task.
