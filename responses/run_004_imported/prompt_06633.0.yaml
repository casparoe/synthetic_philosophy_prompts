      *   **Side B (The Dennettian/Interpretivist):** LLM behavior is too complex for the mechanistic stance to be practically useful for high-level prediction. The "next token" explanation doesn't capture *rationality* or *coherence* across long contexts. The intentional stance offers superior compression for *human-relevant* behaviors. Therefore, beliefs are Real Patterns.

