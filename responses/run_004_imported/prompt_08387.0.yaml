answer: |-
  The rain was a fine mist, the kind that doesn't warrant wipers but makes the asphalt slick as oil. Arthur was driving home, thinking about grocery lists, when he saw the silver sedan signaling from the on-ramp. He could have accelerated, claiming the lane. Instead, he tapped his brakes. A gesture of courtesy. The sedan merged, tires humming, and vanished into the flow ahead. Arthur forgot about it before the next stoplight.

  Ten years later, the driver of the sedan, a man named Elias, arrives at a warehouse district. Because Arthur slowed, Elias arrived at this intersection forty seconds later than he would have otherwise. He misses a collision between a delivery truck and a cyclist. Elias is uninjured. He goes on to manage the warehouse. Under his supervision, efficiency increases by fifteen percent. Goods move faster. Prices drop for thousands of families. But the increased traffic volume brings noise and exhaust to a residential street nearby. Asthma rates in the neighborhood climb. Children miss school. Parents lose wages caring for them. The ledger opens, but the columns do not balance.

  Twenty years later, the driver who was behind Arthur, a woman named Sarah, is still navigating the ripple. Arthur's brake lights caused her to decelerate. She missed a green light by three seconds. Frustrated, she took a different route the following week, a habit that stuck. On that new route, she never passed the bakery where she would have met her future husband. She remains single. She channels her energy into her career, becoming a litigator. She wins a landmark case against a pharmaceutical company, securing compensation for hundreds of victims. Yet, the legal fees bankrupt the company. A life-saving drug they were developing is shelved indefinitely. Patients who would have been saved by the drug do not survive. The ledger opens again. The ink smudges.

  Arthur is old now. He sits on a porch swing, hands spotted with age, watching the street. He reads the news on a tablet. He sees a headline about the warehouse district expansion, praised for economic growth, criticized for health impacts. He sees another story about the pharmaceutical lawsuit, hailed as justice, mourned for lost innovation.

  He remembers the rain. He remembers the silver sedan.

  He tries to do the math. He tries to weigh the asthma against the lower grocery bills, the justice against the lost cures. But the threads have tangled with millions of other choices—other merges, other delays, other rains. The causal chain is not a line; it is a web, vibrating with infinite inputs. He cannot isolate his tap on the brake from the chaos of the world.

  He realizes then that he is not just uncertain; he is blind. He could have been a saint or a saboteur in those seconds, and the universe offers no receipt. There is no final tally. There is only the action, and the silence that follows.

  Arthur closes his eyes. He wonders if he should have accelerated. He wonders if it matters. The wind shifts, carrying the scent of exhaust and blooming jasmine, indistinguishable in the dark. He sits with the weight of it, the impossible arithmetic of being alive, and knows he will never solve it.
