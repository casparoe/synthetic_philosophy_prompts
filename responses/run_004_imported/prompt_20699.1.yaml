      *   **Addressing the Clinicians' Concern:** Funding and triage are real needs. Ignoring them hurts the org's sustainability.
      *   **The Recommendation:** "Adopt with Guardrails."
          *   Use PGD for *billing/triage*, not as a label for the client.
