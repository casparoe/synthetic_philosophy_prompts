          *   *Wakefield/Nordenfelt (Normativist):* Is it harmful relative to values/culture? (Founder's view).
          *   *Synthesis:* We treat the *harm/dysfunction* without labeling the *person* as diseased.
      *   *Specifics:* Mention the DSM-5-TR vs. ICD-11 discrepancy. Mention the insurance aspect.
