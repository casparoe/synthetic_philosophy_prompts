answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Organization Name]
  **FROM:** [Your Name], Clinical Advisory Board
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding PGD Screening Criteria and Intake Protocols

  **Purpose**

  This memo serves to outline a recommendation regarding the proposed adoption of the DSM-5-TR "Prolonged Grief Disorder" (PGD) criteria for our intake screening. After reviewing the clinical data, the financial implications, and the ethical concerns raised by our founder and leadership, I recommend we **adopt the criteria for billing and triage purposes only, subject to specific cultural and operational guardrails.**

  **The Core Tension**

  Our debate is not merely procedural; it reflects a fundamental tension in how we define the boundary between normal human suffering and clinical pathology.

  *   **The Clinical Argument:** Our clinicians rightly note that for a subset of bereaved individuals, grief mechanisms cease to function adaptively. Without a diagnostic code, these individuals cannot access insurance-subsidized specialized therapy, and our peer groups may lack the resources to support them safely.
  *   **The Mission Argument:** Our founder rightly warns that medicalizing grief risks stigmatizing a universal human experience. The concern regarding cultural norms is particularly acute: the DSM's 12-month threshold and symptom clusters are based on specific populations that may not align with the mourning customs of the immigrant communities we serve. As noted, the WHO's ICD-11 sets the threshold at 6 months, suggesting these timelines are consensus-based, not biological constants.

  Both positions are valid. To reject the diagnosis entirely protects our philosophy but limits access to care. To adopt it uncritically protects our funding but risks betraying our mission.

  **Recommendation: Adoption with Guardrails**

  We should utilize the PGD criteria as a **key to unlock resources**, not as a definitive label of illness. This approach acknowledges that while grief is normal, *debilitating impairment* requires intervention, without asserting that long-term grief is inherently "diseased."

  I propose we vote to adopt the screening tool under the following three conditions:

  1.  **Internal Triage vs. External Labeling:** Staff may use PGD criteria to determine eligibility for the licensed therapy track and insurance billing. However, in client-facing communications, we will not use the term "Disorder." We will frame this as "Complicated Grief Support" or "Specialized Bereavement Care." We treat the *dysfunction* (the inability to function) without pathologizing the *person*.
  2.  **Cultural Competence Override:** The DSM explicitly states symptoms must be "out of proportion to cultural norms." To honor this, we must mandate specific training for screeners on local mourning customs. If a client's timeline or expression of grief aligns with their cultural/religious background—even if it exceeds 12 months—they are not to be flagged as PGD positive. The 12-month mark is a screening trigger, not an automatic diagnosis.
  3.  **Flexible Thresholds:** Acknowledging the ICD-11 (6-month) discrepancy, we will treat the 12-month marker as a flexible guideline. Clinicians are empowered to prioritize based on *functional impairment* (harm) rather than strict duration (biology).

  **Rationale**

  This compromise leverages the utility of the medical model (access to funding and specialized care) while adhering to a normativist view of health (well-being defined within a cultural context). It allows us to say to the communities we serve: *"Your grief is not an illness, but if it is preventing you from living, we have the tools to help you carry it."*

  **Next Steps**

  If the board approves this recommendation, I move we form a small working group to draft the "Cultural Competence Override" protocol before the intake system goes live.

  We do not need to choose between clinical rigor and humanistic care. We can build a system that funds the former without compromising the latter.

  Respectfully,

  [Your Name]
