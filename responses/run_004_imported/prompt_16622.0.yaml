      *   **Constraints:**
          *   Each question needs a follow-up keyed to likely answers.
          *   No soft/throat-clearing questions (e.g., "How did you get started?").
          *   Specific required topics:
              1.  The Reference Class Problem (why age/sex? preventing defining disease out of existence via subpopulations).
              2.  The Disease/Illness/Sickness Trichotomy (is "illness" doing the normative work "disease" avoids?).
              3.  Historical Cases (Drapetomania/Homosexuality in DSM - how BST prevents/is vulnerable to this given historical "naturalistic" justifications).
              4.  The User's Mom's Case (Fibromyalgia - unexplained symptoms, was it a disease *then*?).
          *   Tone: Challenging but fair, philosophical, specific, not autopilot-friendly.

  2.  **Deconstruct the Guest's Position (Boorse's BST):**
      *   *Core Claim:* Health is normal species functioning. Disease is a type of internal state that reduces functional ability below statistical efficiency for a reference class (age/sex).
      *   *Goal:* Value-free, objective definition of disease.
      *   *Weak Points/Criticisms:*
          *   Reference classes seem arbitrary (why not narrow them down to make pathology normal?).
          *   "Function" is teleological (implies purpose/goals), which might smuggle in values.
          *   Conditions like FM or chronic pain lack clear biomarkers, making "statistical dysfunction" hard to measure.
          *   Historical misuse of "science" to label social deviance as disease (Drapetomania).
          *   The distinction between *disease* (objective) and *illness* (subjective experience) might collapse.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Reference Class.*
          *   *Draft 1:* Why do you pick age and sex? What if we pick a smaller group?
          *   *Refinement:* Make it sharper. Focus on the "prevalence" loophole. If a disease is common in a group, does it become normal?
          *   *Follow-up:* She will likely say reference classes are fixed by biological design. Push back on *who* decides the design.

      *   *Requirement 2: Disease/Illness Trichotomy.*
          *   *Draft 1:* You separate disease and illness. Isn't illness just the value part?
          *   *Refinement:* Focus on the *work* being done. If disease is value-free, does "illness" become the bucket for all the suffering, rendering "disease" clinically irrelevant?
          *   *Follow-up:* She might say both are needed. Ask if a value-free disease diagnosis matters if the patient feels fine (asymptomatic) or suffers without a lesion.

      *   *Requirement 3: Historical Cases (Drapetomania/Homosexuality).*
          *   *Draft 1:* What about drapetomania? Was that a disease by your standards?
          *   *Refinement:* Focus on the *mechanism*. Back then, they claimed it was statistical dysfunction. How does BST distinguish *false* science from *true* science retrospectively?
          *   *Follow-up:* She will likely say "That was bad science." Push on whether BST provides a *philosophical* guardrail or just relies on "good science" (which is circular).

      *   *Requirement 4: Fibromyalgia (The Mom Case).*
          *   *Draft 1:* My mom had FM with no biomarkers. Was it a disease then?
          *   *Refinement:* Frame it around the *epistemic gap*. If BST requires measuring function, and we couldn't measure it, was the disease ontologically present or not?
          *   *Follow-up:* She might say "It was real, we just couldn't see it." Push on the difference between "unknown mechanism" and "no mechanism."

      *   *Filling the remaining slots (to reach 8-10):*
          *   Need questions on: Teleology (function), Mental Health, Aging, and the "Value-Free" ideal itself.
          *   *Teleology:* How do you define function without purpose?
          *   *Mental Health:* BST struggles with psychology. How does it handle depression?
          *   *Aging:* Is aging a disease? BST says no (natural), but it reduces function.
          *   *Normativism:* If a condition is statistical but *wanted* (e.g., high libido, or maybe low pain sensitivity), is it a disease?

  4.  **Refining and Polishing:**
      *   Ensure the tone is respectful but rigorous (podcast style).
      *   Check that follow-ups anticipate standard BST defenses (e.g., "That's just bad biology," "Reference classes are biologically fixed").
      *   Ensure the Fibromyalgia question feels personal but philosophically grounded.
