answer: |-
  Here are 10 interview questions designed to press on the structural weaknesses of the Biostatistical Theory (BST), including the specific topics you requested. Each includes a follow-up based on the standard defenses a Boorsean typically employs.

  ### 1. The Reference Class Arbitrariness
  **Question:** Boorse's theory relies on partitioning a species into "reference classes" (typically age and sex) to determine what counts as statistically normal functioning. But the choice of reference class determines the diagnosis. If I define a reference class narrowly enough—say, "60-year-old smokers with hypertension"—high blood pressure becomes statistically normal function for that group. What non-arbitrary, biological principle stops us from carving reference classes so specifically that we define prevalent pathologies out of existence?

  **Follow-up (if she appeals to "biological design"):** You'll likely say reference classes are fixed by natural design, not social choice. But historically, biologists have disagreed on what counts as a relevant biological subgroup. If the theory relies on future biology to settle the reference class, doesn't that make the concept of "disease" unstable in the present? We need to know if something is a disease *now* to treat it, not wait for a consensus on statistical partitioning.

  ### 2. The Fibromyalgia/Epistemic Gap Case
  **Question:** I want to apply this to a concrete case. For decades, patients with fibromyalgia had verifiable suffering and functional impairment, but no identifiable physiological mechanism or lesion. Under BST, disease is a *type* of internal state causing subnormal functioning. During those years when the mechanism was unknown, was fibromyalgia ontologically a disease on your view, or was it merely a collection of symptoms? If it *was* a disease, how could we know that without the statistical measure of the dysfunction you require?

  **Follow-up (if she says "It was always a disease, we just lacked the tech"):** That implies the disease status is independent of our ability to measure the statistical deviation. But BST defines disease *as* that statistical deviation in function. If we can't identify the function or the deviation, aren't you secretly relying on the *suffering* (the normative harm) to validate it as a disease before the biology catches up? It sounds like the value judgment is leading the science, not the other way around.

  ### 3. The Disease/Illness/Sickness Trichotomy
  **Question:** You defend Boorse's trichotomy: *Disease* (biological dysfunction), *Illness* (subjective experience/harm), and *Sickness* (social role). You argue this keeps "disease" value-free. But doesn't this relegate all the moral and clinical urgency to "illness"? If a patient has a Boorsean "disease" (statistical dysfunction) but feels fine, we often don't treat it. If they feel terrible but have no statistical dysfunction, we still care. Isn't "illness" quietly doing all the heavy lifting in medical practice, rendering the value-free definition of "disease" clinically inert?

  **Follow-up (if she argues disease identifies the cause):** Fair, but medicine often treats the *illness* without fixing the *disease* (e.g., palliative care, pain management). If the justification for intervention is always the reduction of harm (illness), why do we need a value-free category of disease at all? Is it possible that "disease" is just a placeholder for "illnesses we currently have a biological story for"?

  ### 4. Drapetomania and Historical False Positives
  **Question:** In the 19th century, physicians labeled enslaved people fleeing captivity as having "drapetomania." They used the language of naturalism and statistics to claim this behavior violated the "natural functioning" of that population. BST claims to protect us from value-laden errors, but how does your theory retrospectively identify drapetomania as a false positive? If the physicians of that time claimed fleeing reduced survival efficiency relative to a specific reference class, what philosophical tool does BST give us to say they were wrong *about the disease status*, rather than just wrong about the biology?

  **Follow-up (if she says "That was just bad science"):** If the answer is just "that was bad biology," then BST isn't actually providing a philosophical boundary between disease and non-disease; it's just deferring to whatever the current scientific consensus says. If the philosophy of medicine just collapses into "whatever science says is broken," what work is the philosophy doing? We need a framework that can critique scientific claims, not just validate them.

  ### 5. Teleology and "Function"
  **Question:** BST hinges on the concept of "function"—specifically, species-typical functional contribution to survival and reproduction. But "function" is inherently teleological; it implies a *goal* or a *purpose*. How do you derive an objective "goal" for a biological organism without smuggling in a normative assumption about what that organism *ought* to be doing? Why is survival and reproduction the metric, rather than, say, flourishing or autonomy?

  **Follow-up (if she appeals to evolutionary selection):** Evolution selects for many traits, including some we consider pathological (like the capacity for inflammation or anxiety). If "function" is just "what was selected for," then selected-for traits that cause immense suffering are "healthy" on your view. Are you comfortable saying that a function is healthy simply because it persisted evolutionarily, even if the individual organism experiences it as a debilitating disease?

  ### 6. Mental Health and Statistical Deviance
  **Question:** BST struggles significantly with psychiatry. Take high-functioning sociopathy. A sociopath might have statistically subnormal emotional processing relative to the reference class, fitting the BST definition of disease. However, some argue this is a moral deviation, not a medical one. Conversely, severe depression might be statistically common in a war-torn region. Does BST risk medicalizing moral deviance on one end, and normalizing widespread suffering on the other, simply because it's tethered to statistics rather than harm?

  **Follow-up (if she distinguishes internal mechanism):** You might say we need to find the internal mechanism. But in psychiatry, the mechanism *is* the behavior and reported experience. If we wait for a biomarker for depression that matches the statistical dysfunction, are we not denying the reality of the mental disorder in the interim? Does BST inadvertently delay treatment for conditions where the "dysfunction" is primarily experiential?

  ### 7. The "Value-Free" Ideal
  **Question:** You argue that we can separate the factual claim ("this organ is malfunctioning") from the value claim ("this is bad"). But in medicine, the reason we identify the organ as *mal*functioning is precisely because it leads to a state we value avoiding (pain, death, incapacity). If we discovered a physiological state that reduced survival efficiency but increased reported happiness, would BST classify that as a disease? If yes, doesn't that reveal that "disease" is actually tracking "biological efficiency," not "health" as humans understand it?

  **Follow-up (if she says "Health isn't happiness"):** I agree, but if your definition of health conflicts so sharply with the human concept of well-being that it labels a happy state as diseased, have you successfully analyzed the concept of "health," or have you just changed the subject to "biological efficiency"? Why should clinicians care about your definition if it diverges from patient welfare?

  ### 8. Aging as Disease
  **Question:** BST famously classifies aging as non-disease because it is statistically universal for the species (or a natural phase of design). However, aging involves a progressive decline in functional ability and increased susceptibility to pathology. If disease is "subnormal functional ability," and an 80-year-old has significantly lower functional ability than a 20-year-old, why isn't aging itself a disease? Is the only reason it's not a disease because it's inevitable? If so, isn't that a normative judgment about what we should accept, rather than a biological fact?

  **Follow-up (if she argues aging is "designed"):** If we develop a therapy tomorrow that reverses aging and restores 20-year-old function to 80-year-olds, does aging instantly become a disease on your view? If the status of aging changes based on our technological ability to fix it, doesn't that prove "disease" is relative to our capacity to intervene, which is a normative, not naturalistic, fact?

  ### 9. Asymptomatic Conditions
  **Question:** Consider hypertension or early-stage cancer. These are often asymptomatic; the patient has no "illness" experience. BST classifies them as diseases because of internal dysfunction. But if the patient feels no harm, the only reason we label it a "disease" is the *risk* of future harm. How does a theory based on *current* statistical functioning account for *probabilistic* risk? Are we diagnosing a current state or predicting a future value judgment?

  **Follow-up (if she says "Risk is a current disposition"):** A disposition to what? To future dysfunction or death. Those are value-laden outcomes. It seems that even in asymptomatic cases, we are labeling something a disease only because we value avoiding the future outcome. Without that value judgment, it's just a biological variation. Can you name a single asymptomatic condition we treat as a disease that wouldn't be reclassified as "normal variation" if it carried no risk of future harm?

  ### 10. The Normativist Alternative
  **Question:** If BST fails to capture the cases where medicine actually acts—where suffering, risk, and social context dictate treatment rather than pure statistical function—what is the cost of clinging to it? If we adopted a hybrid view, where "disease" is a interaction between biological fact and human value, what specific scientific error do you fear would occur? Are you protecting science from values, or protecting values from scientific scrutiny?

  **Follow-up (if she fears medicalization of normal life):** You might worry about medicalizing normal sadness or aging. But isn't the solution to have better ethical guidelines for treatment, rather than distorting the definition of disease? If a condition is biologically real and causes suffering, isn't it more honest to call it a disease and argue about *treatment ethics*, rather than arguing about whether the definition of disease excludes it to save us from moral dilemmas?
