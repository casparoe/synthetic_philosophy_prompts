answer: |-
  Good morning.

  Before he died, [Name] gave us specific instructions for this room. He said: no cosmic consolation. He did not want to be told he is "watching over us." He did not want to be told he is now "part of something bigger." He knew that for many people, those phrases are a comfort. But he knew that for him, they were a kind of error.

  He was an actuary. He spent his life measuring risk, time, and probability. But he was also, as many of you know, a student of Frank Ramsey. And there is a specific argument of Ramsey's that [Name] kept taped inside his desk drawer for twenty years. He told me once that when the diagnosis came, he went to his desk, took that photocopy down, and taped it to the inside of his hospital bag.

  The argument is simple, but it changes everything about how we stand here today.

  We live in a universe that is undeniably vast. It is billions of years old and billions of light-years wide. Compared to that, a human life is a blink. Compared to that, a career, a marriage, or a friendship is a spark that vanishes before the light reaches the next star. The usual reaction to this fact is to feel small. To feel that because the universe is so big, our troubles—and our joys—must be correspondingly insignificant.

  [Name] refused to feel small. Not out of arrogance, but out of precision.

  Ramsey's point, which [Name] loved to explain over drinks, was that importance is not a physical property. It does not have weight. It does not have duration. You cannot measure the value of a joke, or the worth of a friend, in light-years or eons. To say that a life is "too short" because the universe is "too long" is a category error. It is like saying a painting is worthless because it is smaller than the wall it hangs on.

  For the colleagues and friends in the back who know this logic: [Name] never let the math overwrite the meaning. He knew that probability is a guide to life, not a replacement for it.

  For his sisters and his oldest friends in the front who may never have heard of Frank Ramsey: I want you to hear what this actually means for your grief.

  It means that the pain you feel right now is not a mistake. It is not a failure to "zoom out" and see the bigger picture. The pain is data. It is the precise measurement of what he was worth.

  If value depended on size, then nothing we do here on earth would matter. A star is bigger than a son, but a star cannot love you. The universe is older than a friendship, but the universe cannot make you laugh. [Name] believed that the only scale that counts is the human scale. The only "bigness" that exists is the bigness of the impact we have on each other.

  He did not believe he was going to a bigger place. He believed he was leaving this one, which was already big enough to hold everything that mattered.

  I know many of you are struggling with the speed of this. The cancer was fast. It feels like a sentence was cut off mid-paragraph. But [Name] would argue that a life is not measured by its runtime. It is measured by its density.

  I think of the reading group he founded. For ten years, we met every other week. We read dense, difficult texts. We argued. We corrected each other's priors. But if you asked me what I valued most, it wasn't the theory. It was the way he would pause, look over his glasses, and say, "Wait, I think you're missing the human element here." He was the person who could explain the most abstract theorem and make it sound like common sense. He made the complex feel manageable.

  That was his gift to all of us. To his clients, he made risk understandable. To his family, he made the future feel less frightening. To this room, he made truth feel like something you could share, rather than something you had to win.

  He asked us not to say he is "at peace" in some cosmic sense. He didn't think the cosmos cared enough to grant peace. But he did believe *we* could grant it.

  So, how do we comfort ourselves without lying? We do it by accepting the local truth.

  He is not in the stars. He is in the records he left. He is in the policies he secured for families who will now be safe because of him. He is in the arguments we will have next week where we will catch ourselves thinking, "What would [Name] say about this?" He is in the specific, irreplaceable shape of the hole he has left in this room.

  That hole is not a sign of insignificance. It is a sign of presence. You do not feel the absence of something that wasn't there.

  To his sisters: You do not need to find a universe large enough to hold your brother. You only need to look at the people in this room. We are the measure. The love he gave us was real matter. It had weight. It changed the trajectory of our lives. That does not vanish because his heart stopped. The effect remains, even if the cause is gone.

  [Name] faced the end with the same clarity he brought to a spreadsheet or a seminar. He knew the odds. He knew the scale. And he chose, until the very end, to focus on the dinner party, not the galaxy. He chose to focus on the hand he was holding, not the void surrounding it.

  We honor him not by pretending he is somewhere else, but by acknowledging exactly how much he was here.

  Frank Ramsey wrote that we should not feel humbled by the silence of the universe, because we are not here to fill the silence. We are here to speak to each other. [Name] spoke clearly. He spoke kindly. And he was heard.

  By that measure—the only one he trusted—his life was not short. It was complete.

  Thank you.
