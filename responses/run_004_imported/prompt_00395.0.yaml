answer: |-
  **The Unstable Agent: Why Ratifiability Cannot Save Causal Decision Theory from Death in Damascus**

  Causal Decision Theory (CDT) emerged in the late 20th century as a robust attempt to salvage rational choice from the counterintuitive implications of Evidential Decision Theory (EDT). By insisting that agents maximize utility based on the causal consequences of their actions rather than mere correlations, CDT successfully navigated Newcomb's Problem, recommending the two-box solution that many philosophers find intuitively correct. However, the theory's reliance on a sharp distinction between causation and correlation faces a severe stress test in the "Death in Damascus" scenario. In this case, an agent faces a perfect predictor (Death) who ensures that the agent's location matches Death's location. The resulting deliberational instability—where choosing any city makes it the wrong city—threatens to render CDT action-guiding impotent.

  In response, Allan Gibbard and William Harper proposed supplementing CDT with a *ratifiability constraint*, arguing that an agent should only perform an action that remains optimal conditional on the belief that they will perform it. While this maneuver technically resolves the instability in Death in Damascus by declaring no action permissible, Andy Egan has subsequently argued that this patch reveals a deeper, fatal flaw in CDT's architecture. Egan contends that a decision theory that generates deliberational instability is fundamentally broken, and that ratifiability imports evidential reasoning in ways that cripple CDT in other cases, such as the "Psychopath Button." This essay assesses this controversy. I argue that Egan is correct: supplementing CDT with ratifiability does not adequately handle Death in Damascus. Instead, it functions as an ad-hoc repair that acknowledges CDT's inability to account for self-referential knowledge, ultimately undermining the theory's core motivation without securing its coherence.

  To understand the severity of the problem, one must examine why Death in Damascus destabilizes standard CDT. In Gibbard and Harper's original formulation, the agent is in Damascus and knows Death will come for them tomorrow. Death has already predicted where the agent will be and will go there. The agent can stay in Damascus or flee to Aleppo. CDT evaluates actions by partitioning the world into states independent of the action. Here, the relevant states are "Death is in Damascus" and "Death is in Aleppo." Because Death's location is causally independent of the agent's current choice (it was determined by a past prediction), CDT treats the probability of Death's location as fixed regardless of the agent's move.

  The instability arises during deliberation. If the agent leans toward fleeing to Aleppo, they must update their credence that Death is in Aleppo (since Death predicts perfectly). Conditional on this credence, staying in Damascus yields a higher survival probability. But if they lean toward staying, they update their credence that Death is in Damascus, making fleeing to Aleppo look superior. The agent enters an infinite loop of preference reversal. Standard CDT offers no equilibrium; it recommends an action, but the reasoning required to settle on that action undermines the recommendation itself.

  Gibbard and Harper's defense is to bite the bullet on the instability by introducing ratifiability. An act $A$ is ratifiable if, conditional on the assumption that one will do $A$, $A$ maximizes expected utility. In Death in Damascus, neither staying nor fleeing is ratifiable. If I assume I will stay, I believe Death is there, so I should have fled. If I assume I will flee, I believe Death is there, so I should have stayed. Gibbard and Harper argue this is not a failure of the theory, but an accurate description of the agent's predicament. The situation is a "no-win" scenario; therefore, a decision theory is not obligated to prescribe a unique, stable pure strategy. They suggest the agent might resort to a mixed strategy (randomizing), which can be made ratifiable. On this view, ratifiability tames the paradox by admitting that rationality has no stable foothold in a world where your choices are perfectly predicted by a hostile force.

  However, this defense is unsatisfying for two reasons. First, it concedes that CDT cannot guide deliberation to a conclusion in a wide class of cases involving prediction or self-knowledge. Second, and more damningly, the mechanism used to fix Death in Damascus breaks CDT's handling of cases where causal dominance should clearly prevail. This is the crux of Andy Egan's critique. Egan argues that deliberational instability is a bug, not a feature. A decision theory is supposed to tell an agent what to do. If the theory's own reasoning process prevents the agent from settling on an action, the theory has failed its primary functional role.

  Egan demonstrates the cost of the ratifiability patch with the "Psychopath Button" case. Imagine a button that, if pressed, kills all psychopaths in the world. You are not a psychopath, and you desire a world without psychopaths. However, you also know that only a psychopath would press such a button (perhaps due to a specific psychological quirk or causal history). If you press the button, you have strong evidence that you are a psychopath. CDT, relying on causal independence, says you should press the button: your pressing does not *cause* you to be a psychopath (that is already fixed), and it does cause the death of psychopaths, which you value.

  However, if we apply the ratifiability constraint to save CDT from Death in Damascus, we must apply it here too. Is pressing the button ratifiable? To evaluate this, I must conditionalize on the fact that I press the button. If I do so, my credence that I am a psychopath skyrockets. If I am a psychopath, perhaps I value the death of psychopaths less, or perhaps the scenario stipulates that pressing the button is evidence of a defect that outweighs the utility. In many iterations of this case, ratifiability forbids pressing the button because conditional on pressing it, the act looks bad (either because it reveals you are the kind of person who kills, or because it correlates with a trait you dislike). Thus, the ratifiability constraint forces CDT to act like EDT, rejecting a causally dominant action because of the *evidence* the action provides about the agent's nature.

  This reveals the deeper flaw Egan identifies. Ratifiability saves CDT in Death in Damascus only by smuggling evidential reasoning back into the heart of the theory. In Death in Damascus, ratifiability works because it forces the agent to treat their choice as evidence of Death's location. But if we allow the agent's choice to serve as evidence in that case, we must allow it in the Psychopath Button case. Doing so strips CDT of its primary advantage over EDT: the ability to ignore spurious correlations in favor of causal efficacy. We are left with a hybrid theory that inherits the paralysis of EDT in prediction cases (via ratifiability) while losing the decisive clarity of CDT in causal dominance cases.

  Proponents of ratifiability might argue that the Psychopath Button is distinct from Death in Damascus because the correlation in the former is not due to a perfect predictor targeting the agent. However, this distinction is fragile. Both cases involve a common cause structure where the agent's decision and the state of the world are correlated. If CDT requires ratifiability to handle the correlation in Death in Damascus, consistency demands it handle the correlation in the Psychopath Button similarly. If the theorist selectively applies ratifiability only when CDT yields instability, the constraint becomes ad-hoc—a mere patch to hide counterexamples rather than a principled addition to the theory.

  Furthermore, accepting Gibbard and Harper's verdict that Death in Damascus is simply a "no-win" scenario ignores the pragmatic reality of the agent. The agent *must* act. They cannot remain in a state of suspended deliberation. If CDT + Ratifiability says "no pure strategy is permissible," it effectively abdicates its normative authority. A decision theory that tells an agent, in a situation where they must choose, that rationality offers no guidance is indistinguishable from a theory that offers no guidance at all. Egan's point is that the instability arises because CDT treats the agent's own decision as causally isolated from the prediction, even though the agent knows the prediction is based on the decision process itself. CDT lacks the resources to model the agent's decision as a logical output that the predictor has already computed.

  Therefore, the controversy over Death in Damascus should not be viewed as a puzzle solvable by a constraint, but as a symptom of a structural deficiency. CDT is built on a partition of states that are causally independent of actions. But in cases involving prediction, self-reference, or logical correlation, the agent's action is not independent of the state of the world; they are linked by a common logical or causal ancestor. Ratifiability attempts to bridge this gap by conditioning on the act, but this is a makeshift solution that compromises the theory's causal purity.

  In conclusion, supplementing Causal Decision Theory with a ratifiability constraint does not adequately handle the Death in Damascus case; it merely masks the theory's inability to process self-referential causal knowledge. While Gibbard and Harper successfully use ratifiability to halt the deliberational instability, they do so at the prohibitive cost of undermining CDT's performance in cases like the Psychopath Button, where causal dominance should rule. Andy Egan is right to identify this as a fundamental flaw. The instability in Death in Damascus is not a quirk of a specific scenario but a revelation that CDT's framework for separating states and actions is too rigid for a world where agents are known to themselves and to predictors. Ratifiability cannot repair this without collapsing CDT into a form of Evidential Decision Theory, thereby negating the very reasons for adopting CDT in the first place. Death in Damascus shows us that CDT, even with patches, is not the final word on rational choice; it requires a more radical reconception of how decisions relate to the states they inhabit.
