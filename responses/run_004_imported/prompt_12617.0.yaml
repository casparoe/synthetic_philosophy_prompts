          8.  Sarah: It's about the *principle* of rationality, not just bats.
          9.  David: Rationality must be actionable.
          10. Sarah: Actionability depends on your ontology.

  7.  **Polishing:**
      *   Ensure the vampire bat reference from the prompt is acknowledged (shows I read the prompt).
      *   Check the Löb explanation accuracy. (Löb's Theorem: $\square P \to P \vdash P$). In the FairBot case: $FB$ cooperates $\iff \square (Opponent \text{ cooperates})$. If $Opponent = FB$, then $C \iff \square C$. By Löb, $C$ is true.
      *   Make sure David challenges the *normative* force. "Just because I *can* prove it, why *should* I run that program?"

  8.  **Final Review against constraints:**
