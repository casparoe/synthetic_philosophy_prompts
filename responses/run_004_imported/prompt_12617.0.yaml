  *(Self-Correction on Löb's Theorem application)*: I need to be careful. FairBot cooperates if it proves the opponent cooperates *with it*.
  $FB(X) = C \iff \square (X(FB) = C)$.
  If $X = FB$, then $FB(FB) = C \iff \square (FB(FB) = C)$.
  Let $P$ be the proposition $FB(FB) = C$.
  Then $P \iff \square P$.
  Does $P \iff \square P$ imply $P$?
  Löb's theorem states: If $\vdash \square P \to P$, then $\vdash P$.
  Here we have equivalence. So $\square P \to P$ holds. Therefore $P$ is provable (and true in the standard model).
  Okay, the logic holds. I will make Sarah explain this step carefully.

