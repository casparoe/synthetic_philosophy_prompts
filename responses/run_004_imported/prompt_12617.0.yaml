      *   *Risk:* The skeptic sounding like a strawman.
      *   *Fix:* Make David's CDT arguments strong. CDT is the standard for a reason. It handles intervention correctly.
      *   *Key Insight:* The crux is whether "my decision" is a *cause* of the other's action or logically *linked* to it. David says cause (which is null here). Elena says logical link (which is non-null).

  6.  **Writing the Dialogue (Iterative Process):**
