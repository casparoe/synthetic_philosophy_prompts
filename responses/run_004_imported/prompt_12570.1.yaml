answer: |-
  **Rome, April 1615**
  **The Quarters of Cardinal Robert Bellarmine**

  The room is spare, lined with books that smell of leather and old paper. A single window looks out over the courtyard of the Jesuit College. GALILEO GALILEI sits opposite CARDINAL ROBERT BELLARMINE. There is a pitcher of water between them, untouched. The air is not hostile, but heavy with the weight of a collision that has not yet happened publicly.

  **BELLARMINE**
  Signor Galileo. Thank you for coming. I have read the copy of your letter to the Grand Duchess Christina that is circulating. It is… passionate.

  **GALILEO**
  Your Eminence. I wrote it to prevent exactly the sort of trouble I anticipate. If the theologians understand that nature and Scripture cannot contradict, for both are from the Holy Ghost, then there is no war to fight.

  **BELLARMINE**
  There is no war if the boundaries are respected. But you are crossing them. You ask us to reinterpret the Holy Fathers, the consensus of centuries, based on… what? Mathematical hypotheses?

  **GALILEO**
  Not hypotheses. Demonstrations.

  **BELLARMINE**
  (Leans forward, fingers steepled)
  Let us be precise, Sig. Galileo. I am not a simpleton. I know the difference between a calculation that saves the appearances and a physical truth. If you could demonstrate to me that the sun stands still and the earth moves—if you had a proof as certain as that three angles of a triangle equal two right angles—then we would have to say we do not understand the Scripture, not that the demonstration is false. I have written as much to Father Foscarini.

  **GALILEO**
  Then we agree on the principle.

  **BELLARMINE**
  We agree on the *if*. But the *if* is the mountain. You have not demonstrated it. You have shown that your model calculates the planets' positions more neatly than Ptolemy's. That is useful. But Copernicus himself, and Osiander before him, admitted this could be treated as a device. A fiction of the mind to simplify the math. Why must it be physically true?

  **GALILEO**
  Because the heavens are not made of glass spheres and epicycles! They are real. When I point the tube at Jupiter, I see moons that orbit *it*. They are a miniature system in the sky. When I look at Venus, I see phases, like the moon. Ptolemy cannot account for this without twisting the geometry into knots. And the tides, Eminence. The flux and reflux of the sea. This is the physical mechanism. The earth moves, and the water sloshes. That is not a calculation; that is matter in motion.

  **BELLARMINE**
  The tides are a correlation, not a demonstration. And as for the stars… if the earth orbits the sun, the perspective should shift. We should see stellar parallax. We do not.

  **GALILEO**
  Because the stars are immensely distant. Farther than you conceive.

  **BELLARMINE**
  Then the universe is a void of terrifying scale, with stars the size of suns scattered in nothingness. It contradicts the natural philosophy of Aristotle, yes, but more importantly, it contradicts the literal reading of a hundred Psalms. "The world is firmly established; it cannot be moved."

  **GALILEO**
  And when the Psalmist speaks of God hiding us "under the shadow of his wings," do you insist God has feathers? When he speaks of his "mighty hand," do we measure his fingers?

  **BELLARMINE**
  (Smiles thinly)
  Those are metaphors of attribute. No one thinks God is a giant man. But the motion of the sun? That is a statement of event.

  **GALILEO**
  It is a statement of appearance! Scripture speaks to the capacity of the common people. If I speak to a peasant about the sunset, I say "the sun sets." To say "the earth rotates away from the sun" confuses him without aiding his salvation. The Holy Spirit intended to teach us how to go to heaven, not how the heavens go.

  **BELLARMINE**
  I grant you accommodation in general language. But consider Joshua. Joshua commands the sun to stand still. If the sun is already still, and the earth moves… then Joshua asked the earth to stop spinning? The text says the *sun* stood still. If you accommodate that passage away, you dissolve the miracle. You make the miracle a trick of perspective.

  **GALILEO**
  The miracle is that the day was prolonged. Whether that was achieved by halting the prime mover or halting the earth's rotation is a technicality of mechanics. The theological truth is God's intervention in time. Why bind the miracle to a specific cosmological mechanism?

  **BELLARMINE**
  Because the mechanism *is* the testimony of the Fathers. Augustine, Chrysostom, Basil—they all read it as the sun moving. If you say they were wrong on a matter written in the Bible, you undermine their authority on matters of faith. You are a Protestant in all but name, Sig. Galileo. You place private reason above the consensus of the Church.

  **GALILEO**
  I place God's creation above human interpretation! Nature is inexorable. It does not care for our readings. If we tie the Ark of Faith to the ship of Physics, and Physics sinks—as it might, for men are fallible—then Faith drowns with it. That is my fear, Eminence. Not for science, but for you.

  **BELLARMINE**
  (Eyes narrow slightly)
  You warn me of danger to the Church?

  **GALILEO**
  I warn you that if you decree geocentrism as dogma now, and in fifty years the parallax is found, or a new physics emerges… then the Church will look like it denied the truth. You make Scripture a laughingstock to bind it to a theory that might be provisional.

  **BELLARMINE**
  And I warn you that if you allow every new natural philosophy to dictate the reading of Scripture, you open the floodgates. Any man with a new theory can claim the Bible is metaphorical where it inconveniences him. Authority is the dam that holds back chaos. We are not "neutrally waiting for proof," as you might paint it. We are guarding a deposit of truth. The burden of proof is on the man who wishes to overturn the consensus of all mankind and all history.

  **GALILEO**
  The consensus of mankind once held the earth was flat.

  **BELLARMINE**
  A false analogy. Scripture never taught the earth was flat. It *does* teach the sun moves. You ask me to treat a proven truth as a hypothesis. You ask me to adopt Osiander's preface as policy. "This is not true, merely useful." Can you, in your conscience, teach as a calculation what you claim to know as a fact?

  **GALILEO**
  (Pauses, looks down at his hands)
  No. I cannot lie. If I know it is true, I cannot say it is a fiction.

  **BELLARMINE**
  Then you ask me to choose between your conscience and the Church's authority. And you ask the Church to risk its authority on a proof that… forgive me… still lacks the stellar parallax. Still lacks a mechanism that does not rely on occult qualities of "circular motion." You want the Church to leap before you have fully built the bridge.

  **GALILEO**
  I want the Church to stop trying to hold back the tide with a cane. The proof is coming. The instruments improve. But by forbidding the discussion, you do not stop the proof; you only stop the reconciliation. You force a choice where none need exist.

  **BELLARMINE**
  There is a choice. Order or disorder. Humility or pride. You speak of accommodation for Scripture, but you offer no accommodation for the theologians. You demand we accept your physics *now*, on your timeline, or be branded obscurantists. That is not dialogue, Galileo. That is an ultimatum.

  **GALILEO**
  It is not an ultimatum. It is a plea. Do not condemn what you have not tested. Let the mathematicians speak to mathematics, and let the theologians speak to salvation. Keep the spheres separate, and they will not collide.

  **BELLARMINE**
  They are not separate. The Incarnation happened in history, in this world, under this sun. If you change the world, you change the stage upon which the drama plays out. I cannot sever them as cleanly as you wish.
  (He pours water into two cups)
  Here is my position, plainly. I believe you are a good Catholic. I believe you love the truth. But I believe you are moving too fast. If you treat heliocentrism as a hypothesis—as a way to calculate—you can teach it. We will not stop you. But if you assert it as truth, without absolute demonstration, you force the Holy Office to speak. And if they speak, they will speak against you.

  **GALILEO**
  So I must choose between my integrity and my safety.

  **BELLARMINE**
  You must choose between your judgment and the judgment of the body of Christ. You say I risk making the Church look foolish if you are right. I say you risk making the Church look heretical if you are wrong. Who bears the greater burden?

  **GALILEO**
  (Silent for a long moment)
  The truth does not care for our burdens, Eminence.

  **BELLARMINE**
  No. But we do. We are men, not angels. We must govern men.
  (He pushes a cup toward Galileo)
  Drink. The heat of the day is upon us.

  **GALILEO**
  (Takes the cup, but does not drink)
  I hope, Cardinal, that when the proof is finally undeniable, you will remember this conversation. That you tried to find a path.

  **BELLARMINE**
  And I hope, Sig. Galileo, that when the proof remains elusive, you will remember that caution is not always the enemy of truth. Sometimes it is its guardian.

  *They sit in silence. The window lets in a shaft of dust-moted light, illuminating the space between them. Neither looks satisfied. Both look certain they are protecting something vital that the other is too blind to see.*

  **GALILEO**
  (Softly)
  The earth moves, Robert.

  **BELLARMINE**
  (Quietly)
  Then let it move. But do not ask the Church to move with it until the ground beneath us is sure.

  *Galileo sets the cup down. He stands. Bellarmine does not rise. Galileo bows, stiffly, and turns to the door. Bellarmine watches him go, then looks down at the letter on his desk, picks up his pen, and dips it in the ink. He hovers over the paper, unsure for the first time in years of exactly what to write.*

  **[END]**
