      *   *Program Equilibrium (Tennenholtz, ~2004):* Formal, computer-science based. Key idea: Agents are programs. They submit code. Code can read opponent's code. Equilibrium is a pair of programs where neither wants to change their code given the other's. Allows for conditional cooperation based on code inspection (e.g., "Cooperate if opponent's code equals mine").
      *   *Connection:* Both aim to solve the Prisoner's Dilemma (PD) via cooperation without external enforcement. Both rely on symmetry/similarity.
