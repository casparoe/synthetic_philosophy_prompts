prompt: |-
  So I spent my career as a chemist, mostly working on reaction kinetics, and now that I'm retired I've fallen down a rabbit hole of game theory and decision theory papers, which is a pretty different kind of rigor than what I'm used to. Lately I've been reading about "program equilibrium" (the Tennenholtz formalization where agents submit programs that can read each other's source code before playing a game like Prisoner's Dilemma), and it reminded me a lot of Hofstadter's old idea of "superrationality" from Metamagical Themas, where symmetric agents reason their way into cooperation just by assuming the other guy is reasoning the same way they are. My retired-engineers book club got into a whole argument last week about whether these are basically the same insight dressed up in different clothes, or whether program equilibrium is doing something formally stronger (or weaker?) than what Hofstadter was gesturing at.

  Could you compare these two ideas in some depth? I'm especially curious where the mutual transparency in program equilibrium (agents literally inspecting code, quining tricks like in the Tit-for-Tat-style programs that check "does your source equal mine") does real formal work that superrationality just hand-waves past with its appeal to symmetry, and wether there are cases where the two notions would actually recommend different outcomes rather than just different justifications for the same cooperative outcome. I don't need a full literature review, just help me see clearly what's genuinely novel in the program equilibrium approach versus what's just an old idea restated with cleaner math.
