answer: |-
  This is a fantastic pivot for your scene. You are absolutely correct in your reading: the popular "Aquinas said tyrannicide is okay" soundbite is a drastic oversimplification that ignores the rigorous conditions he attached to it. In a 15th-century setting, a Dominican confessor would be acutely aware of the distinction between a *tyrannus ex defectu tituli* (a usurper with no right to rule) and a *tyrannus ex parte exercitii* (a legitimate ruler who rules badly). Your Duke is the latter, which makes killing him vastly more problematic in Thomistic theology.

  Here is the breakdown of the argument your Friar would make, structured first as the theological logic (for your understanding) and then as a drafted monologue (for your scene).

  ### The Thomistic Logic (For the Writer)

  To argue against the conspirators, the Friar needs to lean on three specific Thomistic pillars:

  1.  **The Distinction of Authority (Public vs. Private):**
      Aquinas argues in *De Regimine Principum* that removing a tyrant is not the business of private individuals (*privati*). If anyone can decide a ruler is a tyrant and kill him, order collapses. The authority to remove a ruler must reside in the *public* authority (the community, the council, or a higher overlord). Since your conspirators are a private clique, they lack the *standing* to act as judges.

  2.  **The "Greater Evil" Principle:**
      Aquinas is deeply concerned with consequences. He argues that often, the attempt to kill a tyrant leads to greater tyranny (the conspirator becomes the new tyrant) or civil war, which harms the common good more than the original tyrant did. The Friar can argue that assassination creates chaos, and chaos is a sin against the Common Good.

  3.  **Re-interpreting the *Sentences* (The Objection):**
      In his *Commentary on the Sentences* (In II Sent., d. 44, q. 2, a. 2), Aquinas says that opposing a tyrant is not sedition and that those who kill tyrants are "praised and rewarded."
      *   **The Friar's Counter:** That passage refers to the *act* of liberation being praiseworthy in the abstract, or to cases where the action is taken by the *community* as a whole (or its representatives). It does not grant a license for private vengeance. Furthermore, Aquinas qualifies this by saying it applies when there is "no recourse to a superior." The Friar can argue that "recourse" isn't just about an Emperor; it's about due process. Until the community itself (not just a few nobles) declares the Duke deposed, he remains God's vicar in that realm.

  ### The Friar's Argument (Drafted for the Scene)

  Here is a version of the argument written as the Friar might speak it. It is formal, theological, but urgent.

  ***

  "My lord, you come to me seeking absolution for a sin you have not yet committed, which is a contradiction in terms. You come seeking blessing for a sword stroke you intend to make in the dark. And you quote the Angelic Doctor to me, as if Thomas of Aquino were a merchant selling dispensations for bloodshed.

  You say the Duke is a tyrant. I do not dispute his cruelty. I have seen the widows he has made; I have heard the confessions of the merchants he has ruined. But you confuse the *man* with the *office*. The man is vicious, yes. But the office is ordained by God. To strike the man in his office is to strike at the order of Creation itself.

  You cite the *Sentences*, where Thomas speaks of those who slay tyrants being praised. But you read that text with the eyes of a conspirator, not a theologian. Thomas speaks of the *act* of liberation, not the *authority* of the killer. He praises the freedom won, not the private knife that won it.

  Listen closely, for this is where your soul hangs in the balance. Thomas distinguishes between the usurper and the legitimate prince who rules badly. Your Duke inherited this title cleanly. He is not a usurper. He is a *tyrannus ex exercitio*—a tyrant by exercise, not by right. Against such a one, Thomas is explicit in *On Kingship*: removal belongs to **public authority**, not private will.

  Who are you? You are five men in a room. You are not the Council. You are not the Estates. You do not speak for the guilds, the peasantry, or the Church. You are private individuals (*privati*). If you kill him, you do not execute justice; you commit murder. You set a precedent that might makes right. If you can kill him because he is cruel, what stops your rival from killing *you* because you are inconvenient? You invite an endless cycle of blood that will drown this principality for a generation. That is not liberation; that is sedition.

  And regarding your claim that there is 'no higher authority' to appeal to: Do you think God is deaf? Do you think the community is mute? To act without the consent of the community is to act as a lone wolf, not a shepherd. If the people truly wish him gone, let them rise. If the Council declares him deposed, let the executioner do his work. But do not cloak private ambition in the vestments of public justice.

  I cannot bless this plot. I cannot absolve you of the intent. If you proceed, you excommunicate yourself from the body of the faithful. You risk your eternal soul for a temporal peace you cannot guarantee. The tyrant may be a scourge from God for our sins; to kill him without warrant is to claim you know God's mind better than He does."

  ***

  ### Key Nuances for the Writer

  *   **The "Usurper" Distinction:** This is your strongest historical lever. If the Duke had stolen the throne, Aquinas is much more permissive about killing him. Since he inherited it, he has *legitimacy*, even if he is evil. The Friar should hammer this.
  *   **The Definition of "Public Authority":** In a 15th-century Italian principality, "Public Authority" doesn't mean a democracy. It means the *Council of Elders*, the *Estates General*, or the *Commune*. The Friar's point is that the conspirators are acting as a faction, not as the State.
  *   **The Spiritual Stakes:** A confessor's primary job is the salvation of the soul, not political optimization. The Friar shouldn't just argue "this won't work politically" (though he can); he must argue "this is a mortal sin that will send you to Hell."
  *   **The *Sentences* Rebuttal:** Notice how the Friar doesn't deny the *Sentences* quote exists. He re-contextualizes it. This shows the Friar is learned and honest, not just dodging the question. He argues that the "praise" is for the *outcome* (liberation), not the *method* (private assassination).

  ### How the Conspirator Might Reply (To keep the tension)

  To make the scene dynamic, the noble shouldn't just accept this. He might argue:
  *   "The Council is terrified of him. There is no public authority left but us."
  *   "God helps those who help themselves. Waiting for the 'community' is waiting for death."
  *   "You speak of order, Friar, but there is no order under a beast."

  This forces the Friar to stand firm on the principle that **sinful means cannot achieve righteous ends**, which is the core of the Thomistic objection.
