      *   *Section 2: The Isotype Claim.* Analyze "Words divide, pictures unite." Show how this implies a hierarchy of mediation.
      *   *Section 3: The Contradiction.* Argue that Isotype functions as a "Visual Protocol." It claims to present facts without the "noise" of syntax. But the icon *is* a syntax.
      *   *Section 4: The "Transformer" Problem.* This is crucial. The transformer decides the theory. The picture hides the theory. This is ideological, not just pedagogical.
      *   *Section 5: Crushing the Pragmatic Defense.* Why "it's just a tool" doesn't work. If it's just a tool, why claim it unites? That claim is metaphysical/epistemological.
      *   *Conclusion:* Summarize. Neurath wanted democratic enlightenment but used a method that presupposes an unmediated access he philosophically denied.

  5.  **Refining the Jargon and Tone:**
