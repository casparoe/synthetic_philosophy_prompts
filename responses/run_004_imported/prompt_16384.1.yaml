answer: |-
  Friends, family, and comrades.

  Thank you for being here. My grandfather asked me to speak today. He chose me not because I am the oldest, or the loudest, but because I was the one he could talk to about the thing that occupied him most: the question of what happened in Vietnam, and what it meant to come home.

  He gave me specific instructions for this moment. He told me he did not want to be turned into a statue. He didn't want a speech that called him a straightforward hero, and he didn't want one that treated him as if he had done something unforgivable. He told me, quite clearly, that he wanted the truth. And the truth is that he spent the last ten years of his life carrying a heavy, unresolved question. He asked that I tell you that living inside that question was not a failure of character, but a form of integrity.

  To the men in uniform sitting here today: He loved you. He honored the bond you share. He never doubted your courage, your loyalty, or the sacrifice you made. When he looked at you, he saw brothers.

  But for decades, he also looked inward. For a long time after the war, he found a way to make peace with his service. He held onto the belief that a soldier is defined by how he fights, not by the politics of the war itself. He believed that if he followed the rules, if he honored the code of a soldier, he could stand clean regardless of the cause. That belief allowed him to raise a family, to build a life, and to look in the mirror.

  But ten years ago, that belief was challenged. He began to wonder if the justice of the cause mattered just as much as the conduct of the soldier. He began to worry that following orders wasn't enough if the orders themselves were part of something unjust.

  For some, that doubt would have been destructive. For him, it was a discipline. He didn't run from it. He didn't suppress it with anger or drown it in silence. He sat with it. He read, he thought, and he talked to me. He refused to take the easy way out. He refused to simply say, "I was a hero," because he wasn't sure it was true. But he also refused to say, "I was a criminal," because he knew he had served with honor.

  He lived in the space between those two things.

  To my family, who just want to grieve: I know this sounds heavy. I know you want to remember him simply as the man who grilled burgers, who told bad jokes, who loved you. You can still hold that. This struggle didn't take away his love; it deepened it. It made him the thoughtful, serious, careful man you knew. He worried about right and wrong because he cared deeply about being good.

  We often eulogize people by saying they "found peace" at the end. I cannot say that. Not because he died in anguish, but because he died still thinking. He didn't solve the puzzle. He didn't find the loophole that let him off the hook. He carried the weight of it until the end.

  In my own life, I study ethics. I learn about arguments and theories. But my grandfather taught me that ethics isn't about winning a debate. It's about the courage to keep asking the hard questions even when the answers don't come. It is easy to be certain. It is much harder to be honest.

  So, how do we honor him? We honor him by respecting the complexity of his life.

  To his comrades: We honor him by acknowledging that his questioning was not a rejection of you, but a testament to how seriously he took the burden of what you all shared.

  To my family: We honor him by accepting that his silence on some things, and his speech on others, was part of the same effort to protect us and to be honest with himself.

  He did not want us to resolve this tension for him today. He didn't want us to decide if he was right or wrong. He wanted us to acknowledge that he lived a life examined. He wanted us to understand that a man can serve his country, love his brothers, and still wrestle with the morality of it all—and that wrestling is its own kind of virtue.

  Grandpa, you carried that weight for a long time. You didn't drop it, and you didn't let it crush you. You just carried it. We are here to help carry it now.

  Rest well. The argument is over. But the integrity remains.

  Thank you.
