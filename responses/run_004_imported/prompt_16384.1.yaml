      *   **Key Metaphor:** A burden carried, a question held, a balance kept.
      *   **Addressing the Audience:** Acknowledge the veterans' sacrifice without validating the war's politics. Acknowledge the family's love without hiding the grandfather's complexity.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, the relationship, and the specific request. Establish the speaker's unique position (the one he talked to).
      *   **The Service (Vietnam):** Honor the veterans present. Acknowledge the difficulty of returning home. This validates Side A.
      *   **The Inner Life (The Philosophy):** Translate Walzer vs. McMahan into plain English.
          *   *Walzer:* "I did my duty, I followed the rules, I am not a murderer."
          *   *McMahan:* "But was the cause right? Does that matter?"
          *   *The Shift:* He found peace, then lost it, then lived with the question.
      *   **The Integrity:** Frame the *struggle* itself as the virtue. It's not about the answer; it's about refusing to lie to himself. This fulfills his specific wish.
      *   **The Legacy:** How should we remember him? Not as a hero statue, not as a villain, but as a man who thought deeply.
      *   **Closing:** A farewell that invites everyone to hold the tension with him.

  4.  **Drafting - Refining the Language (Iterative Process):**
