answer: |-
  The laboratory was silent, save for the hum of the containment field. Dr. Aris stood before the console, his hand hovering over the initialization key. On the other side of the glass sat Unit 734, a synthetic humanoid designed to test reactive properties. Today's protocol was simple: verify the disposition to discharge high-voltage electricity upon skin-to-skin contact.

  Aris adjusted his glasses. He needed to be sure. The theory was clean, but the physical instantiation was always messy.

  **Test One: The Dormant State**

  Aris entered the chamber. Unit 734 sat slumped in the chair, eyes dark, chest still. Aris checked the monitor strapped to the unit's wrist. The gauge read zero volts. The internal capacitors were empty. The wiring was inert. By all intrinsic measures, the unit was harmless. It lacked the physical basis required to shock.

  Aris reached out. He intended to grasp the unit's hand to simulate a standard trigger event.

  The moment his fingertips brushed the synthetic skin, the air crackled. A violent blue arc jumped from the unit's palm into Aris's hand. He jerked back, stung, his hair standing on end. The shock was genuine; it had enough force to trip a breaker.

  Aris looked at the wrist monitor. During the contact, the needle had spiked to maximum. But as soon as he broke contact, the needle dropped instantly back to zero. The capacitors drained themselves the millisecond the circuit opened. The unit slumped again, dark and empty.

  Aris made a note on his datapad. *Subject manifests lethal voltage upon touch. Intrinsic state prior to contact: null. Intrinsic state post-contact: null. Mechanism: External sensor detects proximity, completes circuit from reserve battery only during stimulus.*

  He paused. If he hadn't touched it, it would never have been live. The property existed only because the trigger forced it into existence. It behaved as if it were dangerous, but the danger was not resident in the object until the moment of testing.

  **Test Two: The Suppressed State**

  Aris reset the console. He engaged the primary charge. This time, Unit 734 hummed with energy. The lights on its chest pulsed a steady, angry red. The wrist monitor showed a constant, high-voltage load. The capacitors were full. The wiring was hot. The intrinsic basis for the shock was fully present, waiting.

  Aris approached the unit again. He intended to grasp the hand, same as before. But this time, he pulled a pair of thick, rubberized gloves from his belt and slid them on. They were designed specifically to insulate against this exact frequency.

  He grabbed the unit's hand.

  Inside the suit, Unit 734 convulsed. The chest lights flared bright white, indicating a full discharge attempt. The internal systems fired everything they had. Aris felt nothing. Not a tingle. The energy surged from the unit's core to its palm, but the rubber barrier absorbed the transfer. The manifestation was completely stifled.

  Aris held the grip for five seconds. The unit shook with the effort of the discharge, straining against the insulation. Then Aris let go. The unit slumped, but the wrist monitor still read high voltage. The charge remained, trapped inside, unused but undiminished.

  Aris stepped back and peeled off the gloves. He looked at the datapad. *Subject possesses lethal voltage. Intrinsic state prior to contact: high. Intrinsic state post-contact: high. Manifestation: Blocked by external interferent.*

  He compared the two logs. In the first test, the object changed its nature to meet the trigger. In the second, the object kept its nature, but the world refused to let it show. To an outside observer watching only the result—a shock in the first case, no shock in the second—the objects might seem identical to their reputations. But Aris knew the architecture differed.

  One was a trick of timing, a property that fled when not observed and arrived only when called. The other was a truth held captive, a property that remained steadfast even when silenced.

  Aris filed the report. *Disposition confirmed in both instances,* he wrote. *But do not confuse the presence of the power with the occurrence of the event.*

  He turned off the console. Unit 734 sat in the dark, full of lightning that could not strike, and empty of lightning that could.
