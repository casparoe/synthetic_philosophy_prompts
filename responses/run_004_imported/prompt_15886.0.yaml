answer: |-
  The seminar room is dim, the projector humming a low B-flat. At the front, a doctoral student named Sarah stands before the whiteboard, marker hovering. The problem is written in black: **68 + 57**.

  At the back of the room, leaning against the wall where the shadows pool, stand Elias and Mara. They are old colleagues, voices kept to a whisper so as not to break Sarah's concentration.

  **Elias:** Watch her hand. She's paused. Not because she doesn't know arithmetic, but because this is the first time she's been asked to compute *this* sum in this context. In her entire life, up to this exact second, she has never added 68 and 57.

  **Mara:** She's not computing a new function, Elias. She's applying an old one. She knows what "plus" means.

  **Elias:** Does she? Or does she only know what she *thought* she meant? Consider the skeptic's hypothesis. Up until now, every time she used "plus," the inputs were smaller. Let's say under 57. For all those past cases, the function *quus* behaves exactly like *plus*. $x \text{ quus } y = x + y$ if $x, y < 57$. But for this case, $68 \text{ quus } 57 = 5$. What fact about her past mental history rules out that she meant *quus* all along?

  **Mara:** This is the *Wittgenstein on Rules* ghost again. You know it's intolerable. If there is no fact of the matter about what she meant, then arithmetical correctness is an illusion. She isn't *right* to write 125. She's just writing what she feels like writing, and we nod.

  **Elias:** I don't say correctness is an illusion. I say it's not a matter of *truth-conditions*. There is no metaphysical fact that makes her answer "true" in a robust, correspondence sense. The "skeptical solution" is that correctness is a matter of *assertibility conditions*. She is correct if her answer aligns with the communal practice. We correct her if she deviates. That's all "meaning" is.

  **Mara:** That's a retreat, not a solution. You've saved language by evacuating it of normativity. If there's no fact that determines she *ought* to write 125 rather than 5, then the community's correction is just brute force. It's mob rule disguised as logic.

  **Elias:** It's not force, it's agreement. A shared form of life.

  **Mara:** Agreement on *what*? If there's no fact about the rule, there's no fact about the agreement either. We could all mean *quus* and not know it until we hit a larger number.

  **Elias:** (Smiling faintly) Now you're pressing the hard question. The skeptic asks: "What fact constitutes the individual's meaning?" I say: "None." You ask: "What fact constitutes the community's meaning?" If I'm consistent, I must say: "None." But that doesn't matter. The skeptical solution doesn't require the community to be metaphysically grounded. It only requires that the community *exists* and *reacts*. The indeterminacy of the individual is solved by the stability of the group's reactions.

  **Mara:** But why is the group stable? If I am susceptible to the skeptical paradox, why aren't we? If my memory of "plus" is unmoored from any truth-condition, why is our collective memory any better? You've just scaled up the indeterminacy. If one mind is a black box where "plus" and "quus" are indistinguishable, a million minds together are just a bigger black box. You haven't explained why the practice *converges* on 125 rather than 5, other than "we happen to."

  **Elias:** "We happen to" is all there is, Mara. Evolution, training, natural reactions. We are wired to go on in the same way. That's the bedrock. To ask for a fact *beyond* that is to ask for a god's-eye view of meaning that humans don't possess.

  **Mara:** No. To ask for a fact is to ask for an explanation of why 125 is the *only* acceptable answer, not just the one we prefer. You're conflating the *cause* of our belief with the *justification* for it.

  **Elias:** And you're positing a ghost in the machine. Show me the fact. Concretely. Sarah is standing there. Her brain has fired certain neurons. Her past behavior includes thousands of additions. Point to the specific item in that history—the physical state, the mental image, the disposition—that *logically necessitates* 125 for this new case.

  **Mara:** It's not a discrete item. It's the *content* of her intentional state.

  **Elias:** "Content" is the word we use when we've run out of facts. Is it a disposition?

  **Mara:** No. Dispositions are descriptive. If she were tired, she might say 126. If she were drunk, 200. Her disposition to answer can fail, but her *meaning* doesn't fail. She *meant* plus even if she slips. So meaning isn't disposition.

  **Elias:** Is it a mental image? A formula in the head?

  **Mara:** No. Any image can be interpreted in multiple ways.

  **Elias:** Exactly. So what is left? You've stripped away behavior, psychology, and imagery. What is this "fact" you think settles the extension of "plus" for cases she has never faced? It sounds like you believe she has a tiny, non-physical homunculus inside her that grasps the Platonic Form of Addition.

  **Mara:** (Leaning in, voice tight) I believe she has a cognitive capacity that is inherently normative. It's a primitive fact about her as a rational agent. When she grasps the concept of addition, she grasps a rule that *extends* beyond her past usage. The fact isn't "in" the past usage, Elias. It's in the *grasp* itself. The fact is that she stands in a relation to a function that has a determinate extension.

  **Elias:** "Stands in a relation." That's the magic trick. You've just named the problem and called it a solution. How does a finite brain stand in a relation to an infinite function? If you say it's primitive, you're saying it's inexplicable. If it's inexplicable, how do you know it's there?

  **Mara:** Because the alternative is that when she writes 125, she isn't actually *answering the question*. She's just making a noise. If your skeptical solution holds, then "2 + 2 = 4" isn't true. It's just "assertible." But if it's only assertible, then it could become un-assertible tomorrow if the community changes its mind. Do you believe the community could wake up tomorrow and decide that $68 + 57 = 5$ is correct?

  **Elias:** They could. If they all started saying it, and correcting the dissenters, then in that new form of life, it *would* be correct. Meaning is fluid.

  **Mara:** Then arithmetic is anthropology. It's a study of what humans say, not what numbers do.

  **Elias:** Arithmetic *is* a human practice. There are no numbers floating in the void waiting to be found. There is only the practice of counting.

  **Mara:** (Gesturing toward Sarah, who has now written '125' on the board) Look at her. She didn't check with the community. She didn't poll the room. She sat there, alone, and the answer compelled her. She felt the *necessity* of it. That necessity is the fact you're denying. The fact is the normative constraint the rule exerts on her mind.

  **Elias:** She felt the necessity, yes. But feelings of necessity are psychological states. They can be mistaken. The skeptic doesn't deny she feels compelled. He denies that the compulsion comes from a "fact of meaning." It comes from her training. We drilled her until she reacted this way.

  **Mara:** Training explains why she *does* write 125. It doesn't explain why she *should*. You can train a parrot to say "125." The parrot doesn't mean addition. Sarah does. The difference is that Sarah understands the *reason* for the answer.

  **Elias:** And where is that reason located? If it's not in her training, and not in her brain states, and not in a Platonic heaven...

  **Mara:** It's in the logical space of reasons, not the causal space of nature. You're trying to find a causal mechanism for a logical relation. You won't find it.

  **Elias:** And you're trying to find a logical relation without a bearer. If there's no fact about the bearer—Sarah—then the relation hangs in the air.

  (Sarah turns from the board. The professor asks, "And how did you arrive at that?" Sarah begins to explain her carrying method.)

  **Mara:** Listen to her explanation. She cites the rule. "Carry the one." That citation is the fact. She can articulate the algorithm that determines the output for *any* input, not just the ones she's done before.

  **Elias:** But the algorithm itself is just more symbols. "Carry the one." How does she know how to apply "carry" to *this* column? We can apply the rule for carrying wrongly, too. We can interpret "carry" as "multiply." The regress applies to the explanation just as much as the calculation.

  **Mara:** It stops when we reach a competence that is constitutive of being a thinker. To doubt that is to doubt that she thinks at all.

  **Elias:** I don't doubt she thinks. I doubt that "thinking" involves hooking onto metaphysical rails that run to infinity. I think it involves walking a path that we build as we go, checking that we're walking together.

  **Mara:** If we build the path as we go, we aren't following a rule. We're making it up.

  **Elias:** And if we're following rails laid by God, we aren't agents. We're machines.

  (Sarah finishes her explanation. The class nods. The professor writes "Correct" on the board.)

  **Mara:** They accepted it. Not because they agreed to, but because they recognized the truth of it.

  **Elias:** They accepted it because if they hadn't, they couldn't do physics, or engineering, or buy groceries. The utility sustains the practice, not the truth.

  **Mara:** Utility presupposes correctness. You can't build a bridge on "assertibility." It stands or falls on whether the math holds.

  **Elias:** And the math holds because we all agree on how to count. If we all agreed that $68 + 57 = 5$, and built bridges on that, they would stand, provided the rest of the physics cohered with that arithmetic.

  **Mara:** That is vertigo-inducing nonsense.

  **Elias:** It's humility.

  (Mara watches Sarah return to her seat. Sarah looks relieved, proud.)

  **Mara:** She feels she did something *right*. Not something *useful*. Right.

  **Elias:** And that feeling is enough to keep the language game going. We don't need more.

  **Mara:** We need it to be real, Elias. If it's not real, none of this is.

  **Elias:** (Softly) It's real enough to live by.

  (They fall silent as the professor moves to the next topic. The word "125" remains on the board, white against the dark green, looking like a fact, or perhaps, like a promise.)
