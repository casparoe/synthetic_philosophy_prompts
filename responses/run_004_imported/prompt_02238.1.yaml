answer: |-
  You have hit on one of the most famous and contentious fault lines in *Principia Ethica*. Your intuition is spot-on: this is effectively a pre-1974 "Experience Machine" argument, and yes, it creates a significant tension with Moore's own "Method of Isolation."

  You are reading the text correctly. Moore is asserting that **State A** (Consciousness of Beauty + Belief in Existence + Existence is True) is intrinsically better than **State B** (Consciousness of Beauty + No Belief/Imagination) which is intrinsically better than **State C** (Consciousness of Beauty + Belief in Existence + Existence is False).

  He explicitly stipulates that the *mental* component (the cognition and the emotion) is identical in all three. The only variable is the metaphysical status of the object (Real, Neutral, or Non-Existent).

  Here is the breakdown of whether this is a consistent feature of his system or a crack in the foundation, and what it means for the Bloomsbury/Keynesian vision.

  ### 1. The Defense: "Organic Unities"
  To be charitable to Moore (and there is a standard reading that attempts to save him), you have to look at his doctrine of **Organic Unities**.

  Moore argues that the intrinsic value of a whole is not necessarily the sum of the intrinsic values of its parts.
  *   **Part 1:** The mental state (admiration).
  *   **Part 2:** The object (the beautiful thing).
  *   **Part 3:** The relation (existence/truth).

  Moore's claim is that when you combine "Admiration" with "Real Existence," you create a new *organic whole* that has a different value than "Admiration" combined with "Non-Existence."

  He isn't saying the *feeling* is better. He is saying the **state of affairs** is better. For Moore, "intrinsic value" attaches to complex wholes. If the existence of the object is a constituent of the whole being evaluated, then changing the existence changes the whole, and thus changes the value.

  In this reading, he isn't violating the Isolation Method; he is defining the "isolated thing" as the *total situation* (Mind + Object + Truth-Relation), not just the *Mind*.

  ### 2. The Crack: Violation of Supervenience
  However, most analytic philosophers (including Russell, and later critics like C.D. Broad) agree with your assessment: this is a genuine crack in the system.

  Here is why: Moore's Method of Isolation asks us to imagine a universe containing *only* the thing in question.
  *   If we isolate the **Mental State**, the existence of the external object is, by definition, excluded. If the value changes based on external existence, then value is not intrinsic to the mental state.
  *   If we isolate the **Total State of Affairs** (including the external object), then we are no longer evaluating a "state of consciousness" (which was Moore's goal to refute Hedonism), but a metaphysical reality.

  The tension arises because Moore wants to have it both ways. He wants to argue against Hedonism (which says only feelings matter) by saying "No, the *object* matters too!" But if the object matters, then two people with identical brain states (one looking at a real sunset, one in a perfect simulation) are having experiences of *different value*.

  This violates the principle of **supervenience** that many expect from intrinsic value: if two worlds are identical in their internal, non-relational properties, how can they differ in value? Moore essentially argues that **Truth** is an intrinsic good that supervenes on the relation between mind and world.

  So, to answer your question: **Yes, it is a crack.** It is the point where Moore's intuitionism leans heavily on a specific metaphysical realism that he doesn't fully justify within the strict bounds of his isolationist methodology. He is relying on the intuition that "Reality is better than Illusion" and baking it into the definition of the Good, rather than deriving it strictly from the isolation of mental states.

  ### 3. The Nozick Parallel
  You are absolutely right to link this to Nozick. Nozick's *Experience Machine* (1974) is essentially an elaboration of Moore's Sections 116–117.
  *   **Nozick:** We wouldn't plug in because we want to *do* things, not just experience doing them; we want to be a certain sort of person in contact with reality.
  *   **Moore:** A belief in real beauty is better than a belief in imaginary beauty, even if the emotion is the same.

  Moore anticipates the anti-hedonist intuition by 70 years. The difference is that Nozick uses it to attack Hedonism explicitly, whereas Moore uses it to construct his own version of "Ideal Utilitarianism." Moore admits that the *emotion* is the same, but insists the *good* is different. Nozick would agree with Moore here: the value of the experience depends on its connection to reality.

  ### 4. Does this undermine Keynes and Bloomsbury?
  This is the most interesting part. Does this seam in Moore's argument unravel the "Keynesian Good Life"?

  **Argument for "Yes, it undermines it":**
  The Bloomsbury Group interpreted Moore as saying "States of mind are the only things that matter." If they took that literally, Moore's insistence on *external truth* complicates their aestheticism. If the value depends on the object actually existing, then "appreciating art" requires the art to be real, and "personal affection" requires the other person to actually love you back (or at least exist as a conscious being). It makes the "Good Life" much harder to achieve than if it were just about cultivating the right internal feelings. It introduces an element of luck and metaphysical dependency that pure aestheticism tries to avoid.

  **Argument for "No, it strengthens it":**
  Actually, this "crack" saves the Bloomsbury vision from descending into solipsism or drug-induced hedonism.
  Keynes's "Economic Possibilities" envisions a world where we solve scarcity so we can live better. If the "Good" were purely internal (Hedonism), we could solve scarcity and then just take pleasure-inducing drugs.
  But because Moore (and by inheritance, Keynes) insists that **Truth/Reality** is a component of the Good:
  1.  **Work/Meaning:** We can't just be fed and entertained; we must engage with *real* problems and *real* creations.
  2.  **Relationships:** "Personal affection" (one of Moore's two great goods) requires *other people*. You cannot have a valuable relationship with a simulated person.
  3.  **Art:** We must preserve and create *real* beauty, not just consume simulations of it.

  In this light, the "crack" is actually a feature. It forces the Keynesian vision to be about **human flourishing in the real world**, not just subjective satisfaction. It demands that the "economic problem" be solved in a way that allows for *actual* leisure and *actual* art, not just the *feeling* of leisure and art.

  ### Summary
  You have identified the exact point where Moore's meta-ethics strains under the weight of his moral intuitions.
  *   **Is it consistent?** Only if you accept his doctrine of Organic Unities and allow "external relations" (like truth) to be constituents of intrinsic value. Most philosophers find this shaky.
  *   **Is it a crack?** Yes, it violates the strict spirit of the Isolation Method.
  *   **Does it matter for Keynes?** Paradoxically, no. It saves the Keynesian/Bloomsbury vision from being trivial. It ensures that their "Good Life" requires genuine engagement with reality (real art, real love, real truth) rather than just the cultivation of pleasant mental states.

  Keynes and the Bloomsbury group didn't notice the methodological inconsistency because they weren't interested in the *method*; they were interested in the *conclusion*. And the conclusion—that we should seek real beauty and real love in a post-scarcity world—holds up even if the logical derivation has a seam in it. If anything, the seam prevents their vision from collapsing into a wireheaded dystopia.
