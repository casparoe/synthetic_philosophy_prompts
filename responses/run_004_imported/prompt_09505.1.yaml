answer: |-
  Ramsey would land firmly in the **longtermist camp**, but he would radically reframe its *tone*. He would accept the mathematical and ethical core of the Bostrom/Ord/MacAskill project while rejecting any hint of cosmic subservience that sometimes accompanies it.

  Here is why the tension you identified is illusory, and why his commitments force him toward longtermism.

  ### 1. The Two Discountings are Category Errors if Conflated
  The crux of your observation rests on the word "discount." But Ramsey is using it in two entirely different registers.

  In the **Epilogue (1925)**, the "compound discount" applied to the heat death is **psychological and rhetorical**. He is addressing *existential dread*. He is saying: "The emotional weight of a tragedy diminishes as its temporal distance increases." This is a claim about human *feelings*, not human *ethics*. He is giving himself permission not to be depressed by physics.

  In **"A Mathematical Theory of Saving" (1928)**, the rejection of discounting is **ethical and normative**. He is addressing *policy and moral weight*. He argues that "time preference" is a "polite expression for rapacity." This is a claim about the objective value of utility.

  Ramsey would argue there is no contradiction in saying: *"I personally will not lose sleep over the heat death (Epilogue), but as a moral agent, I am obligated to act as if the welfare of those future people matters just as much as my own (1928)."* One is about managing anxiety; the other is about maximizing Good.

  ### 2. Moorean Utilitarianism Demands It
  Ramsey was a devout follower of G.E. Moore. For Moore and Ramsey, "Good" is a non-natural, objective property. Crucially, **Good is time-independent.** A unit of happiness in 2024 is ontologically identical to a unit of happiness in 3024.

  If you accept:
  1.  Good is time-independent (Ramsey's Ethics).
  2.  There could be an astronomical number of future subjects (Modern Cosmology).
  3.  We have the capacity to influence the probability of their existence (Modern Technology).

  Then, purely as a matter of arithmetic, the "astronomical waste" argument becomes a Moorean imperative. To ignore the future because it is far away is to commit the very ethical sin Ramsey condemned in 1928. He would view the longtermist calculation not as a sci-fi fantasy, but as the logical conclusion of classical utilitarianism applied to a non-finite timeline.

  ### 3. "Perspective, Not Scale" is the Ultimate Longtermist Stance
  You suggest the "threepenny bits" metaphor puts him at odds with longtermism. I argue the opposite: **It is the only justification for longtermism that doesn't collapse into cosmic worship.**

  Many longtermists risk fetishizing "complexity" or "life" in the abstract, as if the Universe itself demands to be filled. Ramsey's humanism cuts through this. By shrinking the stars to threepenny bits, he asserts that **value requires a valuer.** The universe has no intrinsic value; it only has value insofar as it contains beings capable of experiencing Good.

  Therefore, preserving the "foreground" (humanity) is the *only* way to give the "background" (the stars) any value at all. If humanity goes extinct, the stars return to being valueless bits of matter.
  *   **The Epilogue:** "The stars are small compared to human good."
  *   **Longtermism:** "We must ensure there are humans to experience good for as long as possible."

  These are not in tension; they are symbiotic. Ramsey would argue that we should colonize the stars not because the stars are majestic, but because **we are**, and we deserve the room. The "perspective" drawing *requires* a future to draw itself upon.

  ### 4. Decision Theory and Existential Risk
  Ramsey is the father of subjective probability and decision theory (the Ramsey-Dutch Book argument). He taught us that rational belief is defined by the bets you are willing to take.

  If you present Ramsey with the longtermist expected value equation:
  $$EV = P(\text{Survival}) \times V(\text{Future Humanity})$$

  Where $V$ is potentially astronomical and $P$ is sensitive to our current actions (e.g., AI safety, biosecurity), Ramsey the decision theorist would dominate Ramsey the humanist. Even if the probability of influencing the far future is tiny, if the value at stake is sufficiently large (and discounting is ethically zero), the Expected Value is massive.

  To ignore this would be, in Ramsey's terms, **incoherent**. It would be akin to accepting a Dutch Book against yourself. If you claim to care about the Good, and you acknowledge the math of the future, failing to act on x-risk is a violation of rational consistency.

  ### The Verdict: Humanistic Longtermism
  Ramsey would not be a "cosmic" longtermist. He wouldn't care about sending von Neumann probes into the void for the sake of "complexity." He would find that pretentious.

  He would be a **Humanistic Longtermist**. He would argue:
  1.  **Ethics:** We have a strict duty to future generations equal to our own (1928).
  2.  **Metaphysics:** Value is anthropocentric. The universe is only valuable because we are in it (Epilogue).
  3.  **Action:** Therefore, securing the long-term future of humanity is the highest moral priority, not because the Universe is vast, but because **human potential is vast.**

  He would likely critique the *aesthetic* of some modern longtermism (which can sound awfully like the "vastness of the heavens" humility he mocked), but he would sign the manifesto. He would tell MacAskill: "You are right about the math, but don't go getting humble about the stars. We aren't saving the universe; we are saving *us*, and that is enough."

  **Final Call:** Ramsey lands with the longtermists. The Epilogue isn't a rejection of the future's importance; it's a rejection of the *past's* and the *cosmos's* authority over us. Longtermism is the ultimate assertion of that authority.
