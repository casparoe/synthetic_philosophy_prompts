answer: |-
  This is a classic and enduring debate in the philosophy of biology, and your reading group has hit upon the precise tension that has defined the field for the last forty years. You have correctly identified the core of Gould and Lewontin's (G&L) critique, but your proposed heuristic and your group member's objection both capture half of the truth.

  To settle the dispute: **Your group member is logically correct, but you are methodologically prudent.** However, your specific formulation ("default to non-adaptive") is philosophically vulnerable. A more robust rule shifts the burden of proof without establishing a contrary dogma.

  Here is an analysis of the dispute, followed by a sharpened methodological rule you can apply to evolutionary psychology (EP).

  ### 1. Settling the Dispute: Presumption vs. Proof

  **The Group Member's Objection (The Logical Symmetry)**
  Your colleague is right that adopting a "default to non-adaptation" risks creating a "Spandrelian Paradigm" that is just as dogmatic as the Panglossian one.
  *   **The Panglossian Error:** Assumes adaptation *a priori* and treats it as unfalsifiable.
  *   **The Inverted Error:** Assumes non-adaptation *a priori* and treats adaptation as unfalsifiable (or impossibly hard to prove).

  If you start with the axiom "this trait is likely a byproduct," you may prematurely dismiss genuine adaptive explanations simply because they require complex evidence to substantiate. G&L did not argue that adaptations are rare; they argued that adaptationist *assumptions* were ubiquitous and untested. They advocated for **methodological pluralism**, not a flipped null hypothesis.

  **Your Counter-Objection (The Sociological Correction)**
  You are right that in a scientific community biased toward adaptationism (as G&L argued the 1970s community was), a corrective pressure is necessary. In logic, the burden of proof always lies on the positive claim. To claim "Trait X was selected *for* Function Y" is a positive causal claim. To claim "Trait X is a byproduct" is often a negation of that specific causal history.
  *   Therefore, the person making the adaptationist claim *must* provide evidence.
  *   However, this does not mean the trait *is* a byproduct by default; it means the adaptationist hypothesis is **unproven** by default.

  **The Verdict**
  The dispute is settled by distinguishing between an **ontological default** (what the trait *is*) and an **evidentiary standard** (what we *accept*).
  *   **Reject:** "Assume it is a spandrel." (Ontological default)
  *   **Accept:** "Do not accept it as an adaptation until comparative evidence rules out spandrels/constraints." (Evidentiary standard)

  ### 2. Sharpening the Heuristic: The "Adaptationist Evidence Checklist"

  Instead of a rule that tells you what to *assume*, use a rule that tells you what to *demand*. When you encounter an adaptationist claim in evolutionary psychology, do not ask "Is this a spandrel?" Ask: **"Has the author earned the right to call this an adaptation?"**

  Here is a sharpened methodological rule, influenced by later philosophical work (e.g., by Peter Godfrey-Smith and Elisabeth Lloyd) that builds on G&L:

  **The Rule of Comparative Adequacy:**
  *An adaptationist explanation should be treated as provisional until it satisfies three evidentiary criteria that distinguish selection from byproduct/constraint.*

  When reading an EP paper, check if the authors address these three points. If they do not, the "just-so story" critique is licensed.

  #### A. Design Specification (Complexity for Function)
  *   **The Question:** Is the trait complex enough that it is unlikely to have arisen by chance or simple physical law?
  *   **Why:** A single bone shape might be a physical constraint. A complex cognitive module with many interacting parts (e.g., language acquisition device) suggests design.
  *   **Application:** If an EP paper claims "fear of snakes" is an adaptation, is there evidence of a specialized neural mechanism, or is it just a general learning rule applied to snakes? If it's a general learning rule, the "adaptation" might be for *learning*, not snake-fear specifically (a spandrel).

  #### B. Phylogenetic Contrast (The Comparative Method)
  *   **The Question:** Does the trait appear in lineages where the selective pressure existed, and disappear where it did not?
  *   **Why:** This is the strongest tool against spandrels. If a trait exists in Species A and B, but the proposed function only applies to Species A, the trait is likely a byproduct of common ancestry (homology), not specific selection.
  *   **Application:** If an EP paper claims "male jealousy" is an adaptation for paternity certainty, do we see this specific jealousy structure in primates with different mating systems? If the psychology is identical across mating systems, it may be a byproduct of a general pair-bonding mechanism, not a specific "jealousy module."

  #### C. Cost/Benefit Plausibility (Optimality Modeling)
  *   **The Question:** Is there evidence that the trait incurs a cost that selection would have eliminated if it weren't functional?
  *   **Why:** Spandrels are often "free" or low-cost side effects. Adaptations usually require metabolic or cognitive resources.
  *   **Application:** If the proposed psychological trait is energetically expensive or creates cognitive trade-offs, it strengthens the adaptationist claim. If it is cost-free, it could easily be a byproduct.

  ### 3. Applying this to Evolutionary Psychology

  Evolutionary Psychology is the modern battlefield for the Spandrels paper. EP often posits "massive modularity" (the brain is a Swiss Army knife of adaptations). G&L's critique suggests many of these "modules" might be byproducts of general intelligence or cultural evolution.

  **How to use the rule in your reading group:**

  When a member presents an EP paper, run it through this **Spandrel Stress Test**:

  1.  **Identify the Current Utility:** The paper likely argues the trait is useful *now*.
      *   *Challenge:* "Current utility is not evidence of past selection. Feathers were useful for flight, but likely evolved for insulation. How do you know this isn't an exaptation?"
  2.  **Identify the Alternative:** The paper likely ignores constraints.
      *   *Challenge:* "What is the null hypothesis here? Is it possible this behavior is a byproduct of [General Intelligence / Social Learning / Hormonal Regulation] rather than a dedicated module?"
  3.  **Demand the Contrast:**
      *   *Challenge:* "What is the comparative case? If this is an adaptation for [X], which related species lacks [X] and also lacks this trait?"

  ### Summary for your Reading Group

  You can propose this compromise to settle the dispute:

  > "Gould and Lewontin did not argue that we should presume traits are spandrels. They argued that **adaptation is a hypothesis, not a starting point.** Therefore, our heuristic should not be 'assume non-adaptation,' but rather 'suspend judgment on adaptation until comparative evidence rules out structural byproducts.' The burden of proof lies on the adaptationist to demonstrate that selection, rather than constraint or drift, is the best explanation for the trait's origin."

  This preserves your insistence on rigor (the burden of proof) while accepting your colleague's warning against dogmatism (avoiding a flipped default). It turns the Spandrels paper from a weapon to dismiss adaptationism into a tool for refining it.
