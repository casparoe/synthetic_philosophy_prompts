answer: |-
  The fluorescent light in the visitation room hummed, a low, insectile buzz that seemed to vibrate in the teeth. Dalia sat on one side of the bolted-down table, wrists bare but feeling the phantom weight of cuffs. On the other side sat Corso. He wore a civilian suit that looked too clean for the city outside, where the smoke from the final offensives was only just settling.

  He wasn't her lawyer. He was an advisor to the Tribunal. A witness to her conscience, he had called himself.

  "The tea is cold," Corso said, pushing the tin cup toward her.

  "It's always cold," Dalia replied. She didn't drink. "You came back. I thought you'd have filed your report and left."

  "The report is filed. The conclusions are... provisional. I found myself thinking about our last conversation. You asked if the uniform made the murder permissible."

  "I asked if it made it invisible."

  Corso folded his hands. He looked tired, but it was a clean tiredness, the kind that comes from thinking, not from running. "I want to try to explain the architecture of it again, Dalia. Not the law. The morality beneath the law. You reject the idea that a soldier on your side and a soldier on the government side were moral equals."

  "They weren't," Dalia said. "They were burning villages. We were trying to stop them."

  "Let's assume you're right. Let's assume your cause was just and theirs was not. Why does that mean the nineteen-year-old conscript in their trench had less right to shoot at you than you had at him?"

  "Because he was posing an unjust threat," Dalia said. "I was posing a just one. If I kill him, I stop an injustice. If he killed me, he advanced one."

  "This is where you lose the thread," Corso said gently. "You are conflating the *cause* with the *combatant*. In the traditional view, the right to kill in war doesn't come from the justice of the cause. It comes from the status of being a combatant. When you put on that uniform, you enter a specific moral relationship with the enemy. You become a threat, yes, but you also become a legitimate target. In exchange, you are not a criminal. You are not a murderer."

  "It's a license," Dalia said. "A legal fiction that says 'killing is okay if you do it in a group.'"

  "It's a shield," Corso corrected. "Without it, every soldier on the losing side is a potential murder suspect. If moral liability tracked the objective justice of the war, then only the just side would have the right to use force. The unjust side would be mere criminals. And if they are criminals, they have no rights of war. You don't take prisoners with criminals. You hunt them. You execute them."

  He leaned forward. "Think of the epistemic position, Dalia. The average soldier. Does he have access to the truth? Does he know the diplomatic cables, the historical grievances, the secret provocations? No. He is told his nation is threatened. He is told to defend his home. If we ground his moral right to live or die on facts he cannot possibly verify, we are judging him for a crime of ignorance."

  Dalia looked down at her hands. They were stained with iodine that wouldn't wash off. "So ignorance is a get-out-of-hell-free card? Because I've seen what they did. I've stitched up boys who came back from raping a town they claimed was 'harboring insurgents.' They knew. Or they didn't care to know."

  "Many did care. Many were lied to," Corso said. "If a soldier fights for an unjust cause but reasonably believes it is just, he is *excused*. He is not morally blameworthy. If he is not blameworthy, he retains his right not to be killed. That is the Walzerian position. The equality of combatants respects the fog of war."

  "But the bodies don't respect the fog," Dalia snapped. "The boy I shot in the corridor last year. He's dead. It doesn't matter if he thought he was liberating me. I killed him to save a patient. If his cause was unjust, he was an aggressor. I was defense. Why should his moral ledger look the same as mine?"

  "Because if we say his ledger is different, we break the only thing that limits the violence," Corso said. "If the 'just' side believes they are the only ones with a right to kill, they feel no constraint. They can use any means necessary, because they are punishing criminals. The laws of war—the Geneva conventions, the tribunals you are sitting in—they rely on the idea that both sides are playing the same game with the same rules."

  Dalia shook her head. "You're talking about order. I'm talking about truth. You say the unjust soldier is *excused*. Fine. Let's grant that. He didn't know. He's a victim of propaganda. He isn't *guilty*."

  She looked up, locking eyes with him. "But Corso, if he isn't guilty, if he's excused... then why is he *liable*? That's the hole in your armor. If he's morally innocent because he didn't know better, then killing him isn't just punishing a criminal. It's killing an innocent person who happens to be holding a rifle. You can't have it both ways. You can't say he's innocent enough to be excused from blame, but guilty enough to be shot."

  Corso paused. He had heard this before, in lecture halls, but never from someone who had triaged the results. "It is a tension," he admitted. "But we distinguish between *culpability* and *liability*."

  "Explain."

  "Culpability is about blame. Punishment. Retribution. Liability is about defensive harm. If a sleepwalker walks off a cliff and falls toward you, crushing you to death, the sleepwalker is not culpable. He didn't choose it. He is morally innocent. But he is still a threat. And you are permitted to push him off course to save yourself, even if it kills him."

  "A sleepwalker is a force of nature," Dalia countered. "A soldier makes choices."

  "Sometimes. Often, they don't. But let's accept your point. Let's say they choose. The Revisionist view—your view, McMahan's view—says liability tracks responsibility for an unjust threat. If you are responsible for an unjust threat, you forfeit your right not to be killed."

  "Yes."

  "But here is the problem," Corso said. "If you hold that view, then the 'just' side has no incentive to follow the rules of war. Why take prisoners? Why treat POWs humanely? They are liable to be killed because they are responsible for injustice. You turn war from a clash of armies into a police action. And police actions don't end with treaties. They end with hangings."

  Dalia was silent for a moment. The hum of the light seemed to grow louder. She thought of the boy in the corridor. She thought of the Tribunal waiting for her. They weren't asking her if she believed in the cause. They were asking her if she had treated prisoners. They were using Corso's logic to judge her actions, even if Corso's logic felt like a lie.

  "You're asking me to accept a lie for the sake of peace," Dalia said quietly. "You want me to agree that the boy who burned the clinic is my moral equal, because if I don't, the next war will be worse."

  "I am asking you to acknowledge that the law cannot adjudicate metaphysical truth," Corso said. "It can only adjudicate conduct. We judge what you *did*, not what you *were*."

  "But what I *did* only matters because of what I *was*," Dalia insisted. "I was a medic. I saved lives. But I saved the lives of people who went back out to kill. If the war was unjust... then my healing was part of the unjust threat. I kept the machine running."

  "Then by your logic," Corso said, "you are more liable than the infantryman. He just pulled the trigger. You kept the puller alive."

  "Maybe." Dalia didn't flinch. "But here is my answer to your sleepwalker. Your analogy fails because the sleepwalker doesn't *choose* to be a threat. The soldier chooses to enlist. Or chooses to stay. Even if they are lied to, they accept the risk of becoming a lethal instrument. When you pick up a gun, you enter a zone of risk. You make yourself dangerous. If the danger you pose is unjust, even accidentally, the cost of that danger falls on you, not on the person you are trying to kill."

  She leaned in. "You say liability isn't blame. I agree. But you say the unjust soldier is excused. I say he might be excused from *punishment* after the war—don't hang him, don't put him in prison—but he is not excused from *defensive harm* during the war. I can kill him to save my patient, not because he is evil, but because he is wrong. And the person who is wrong bears the cost of being stopped."

  Corso sat back. He rubbed his chin. "So you separate the war from the peace. During the fight, moral asymmetry rules: the just side kills the unjust side because the unjust side is liable. But after the fight... we pretend it was symmetrical? We let them go home?"

  "If they were truly ignorant, yes," Dalia said. "But the law pretends the asymmetry never existed at all. That's what hurts. It tells me that the boy I killed had the same right to kill me as I had to kill him. It tells me my cause doesn't matter. It reduces everything to ballistics."

  "It reduces everything to survival," Corso said. "If we adopt your view, Dalia, then every war becomes total. Because every soldier on the 'unjust' side knows that if they lose, they are not just defeated, they are morally condemned. They will fight to the last man. They will never surrender. The equality of combatants is a gift we give the enemy to encourage them to lay down their arms. It says: *If you stop fighting, you are safe.*"

  "And if they don't stop?"

  "Then we kill them. Not because they are sinners. Because they are combatants."

  Dalia looked out the small window. It was dark now. The war was effectively over, but the killing hadn't stopped. Just changed shape.

  "I don't know if I can live with that," she said. "To be told that what I fought for doesn't grant me protection, and what they fought for doesn't make them guilty. It feels like... erasing the difference between the knife and the hand that holds it."

  "The law holds the hand accountable," Corso said. "The generals. The politicians. That is where the *jus ad bellum* is judged. Not in the trench."

  "And the medic in the tent?"

  Corso looked at her, and for the first time, the academic certainty seemed to flicker. He looked at her stained hands.

  "The medic..." Corso started, then stopped. "The Tribunal will look at your actions. Did you torture? Did you deny care based on rank or nationality?"

  "No."

  "Then you will be fine."

  "That's not what I asked."

  "I know." Corso sighed. He stood up, the chair scraping loudly against the concrete. "You want to know if you are clean. I can't tell you that. I can only tell you that the system we have built is the only one that has ever stopped a civil war from becoming a genocide of the losing side. It requires a sacrifice. It requires the just to accept a legal fiction."

  "And the unjust?"

  "They get to go home to their families."

  Dalia looked back at him. "And the ones who knew? The ones who burned the villages and knew it was wrong? Does the fiction protect them too?"

  Corso hesitated. He picked up his briefcase. "The Tribunal has a mandate for war crimes. Specific acts. Specific intent. That is where the fiction ends."

  "So the fiction only protects the small people," Dalia said. "The ones who didn't know."

  "It protects the human capacity for error," Corso said. "We are all capable of error, Dalia. Even the just."

  He moved toward the door. The guard shifted, keys jingling.

  "Corso," she called out.

  He turned.

  "If I believe I was right," she said. "And I believe they were wrong. And I accept that the law says we are equal. Do I have to believe it? Or do I just have to say it?"

  Corso stood in the doorway, the light from the corridor cutting across his face. He looked like a man carrying a heavy weight, one he had chosen to carry.

  "You have to say it," he said softly. "Believing it... that's between you and whatever you pray to. The law only needs the words."

  The door closed. The lock clicked. Dalia was alone with the hum of the light and the cold tea. She looked at her hands again. They were still stained. She wasn't sure if the stain was iodine, or if it was something the soap would never touch. She picked up the cup, but didn't drink. She just held the warmth, waiting for the morning, waiting to see if the words would be enough.
