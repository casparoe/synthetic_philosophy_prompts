prompt: |-
  Give an example of two infinite populations where one obviously Pareto-dominates the other -- literally nobody is worse off and at least one person is better off -- but plain "just add up all the welfare" total utilitarianism cant tell them apart, since both totals come out to infinity. Explain why thats an actual problem for aggregative/summing views specifically and not just a generic "infinity is confusing" complaint, and say whether any of the standard patches -- comparing partial sums directly (the overtaking or catching-up criteria), or just quietly deciding populations have to be finite after all -- actually rescue the Pareto intuition here, or just dodge it.
