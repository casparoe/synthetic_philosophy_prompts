prompt: |-
  Okay so quick context: I've got zero academic background in this stuff, I just fell into a multi-year rabbit hole of old LessWrong and Arbital posts on decision theory (started with Newcomb's problem, never really left) and now me and a friend run a tiny podcast where we get people from that online rationalist-adjacent world to come talk to us. Next episode's guest actually works on updateless decision theory for one of the alignment orgs, and I'm nervous the whole thing turns into 40 minutes of them re-explaining counterfactual mugging, which at this point I could probably recite in my sleep.

  Could you draft me 8-10 interview questions that skip past the 101 pitch and actually push on the stuff people argue about in the comment sections? I want at least one question on the "commitment races" worry (that agents who can lock in a policy super early get a bargaining edge, so everyone's incentivized to commit before they've really thought it through -- which seems like it should hit an updateless agent especially hard, since committing early to a fixed policy is kind of the whole point of the theory). I want one on whether an updateless agent can really be said to "learn" anything, in the sense that if your prior was just wrong about some option being bad, what actually makes you go try it and find out, instead of just quietly running the wrong policy forever. And I want one on this "logical updatelessness" thing, where it seems like defining the prior your policy is supposed to be prior to already requires knowing some logic and math facts, which sounds sort of circular, but the people who clearly understand this better than me don't treat it as a knock-down objection, so i'm guessing there's a real answer there. For each question, tack on a quick follow-up keyed to whatever response they'll probably give, so we don't just get the standard line and move on to the next topic.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **User Background:** No academic background, but deep immersion in LessWrong/Arbital lore (Newcomb's, UDT, etc.). Runs a podcast with rationalist-adjacent guests.
      *   **Guest:** Works on Updateless Decision Theory (UDT) at an alignment org.
      *   **Goal:** 8-10 interview questions that avoid "Decision Theory 101" (no explaining Counterfactual Mugging from scratch). Needs to dig into niche debates/comment section arguments.
      *   **Specific Requirements:**
          *   Must include a question on "Commitment Races" (early locking vs. bargaining edge).
          *   Must include a question on "Learning" in UDT (fixed policy vs. updating on wrong priors).
          *   Must include a question on "Logical Updatelessness" (circularity of the prior regarding logical facts).
          *   Format: Question + Follow-up (to prevent standard lines).
      *   **Tone:** Conversational but technically literate (shows they've done the homework), probing, slightly skeptical but good-faith.

  2.  **Deconstruct the Topics & Identify Tensions:**

      *   *UDT Core:* Maximize expected utility according to a prior *before* receiving observations. Policy is a mapping from observations to actions, chosen once.
      *   *Commitment Races:* If UDT agents want to commit early to influence others, they might commit before thinking. This leads to "dragon king" scenarios or catastrophic bargaining failures.
      *   *Learning:* If the policy is fixed at $t=0$, how does the agent incorporate new information about the *structure* of the world, not just indexical facts? If the prior assigns 0 probability to a good action, does it stay stuck?
      *   *Logical Updatelessness:* UDT requires a prior over logical/mathematical truths (to handle logical correlation). But logical omniscience is impossible. If you aren't omniscient, you "learn" logic. If you learn logic, are you still updateless? Where is the "updateless" point?
      *   *Implementation/Alignment:* Why does this matter for AI? How do we actually code this?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Commitment Races.*
          *   *Draft:* Everyone worries UDT agents commit too early. How do you fix this?
          *   *Refinement:* Make it sharper. Focus on the incentive to commit *before* understanding the stakes.
          *   *Follow-up:* If they say "meta-policy," ask about the regress problem.

      *   *Requirement 2: Learning.*
          *   *Draft:* Can UDT agents learn? If the prior is wrong, are they stuck?
          *   *Refinement:* Distinguish between indexical learning (where am I) and structural learning (how the world works). Focus on the "wrong prior" trap.
          *   *Follow-up:* Ask about the mechanism for overriding the prior without violating updatelessness.

      *   *Requirement 3: Logical Updatelessness.*
          *   *Draft:* Isn't the prior circular because it needs logic?
          *   *Refinement:* Frame it as the "logical omniscience" problem. To be updateless about logic, you need a prior over logic. But computing that requires logic. Where do we draw the line?
          *   *Follow-up:* Ask about "logical induction" as a bridge.

      *   *Additional Topics needed (to reach 8-10):*
          *   *Functional Decision Theory (FDT) vs. UDT:* Are they the same? Is the distinction useful?
          *   *Multi-agent dynamics:* What happens when two UDT agents meet? (Policy equilibrium).
          *   *The "Why Bother?" question:* Does this actually change AI behavior compared to CDT/TDT in realistic scenarios?
          *   *Human compatibility:* Can humans approximate this? Or is it purely for code?
          *   *The "Troll Bridge" problem:* A classic counter-example where UDT agents refuse to cross a bridge because of a spurious correlation in their proof system.
          *   *Objective Morality:* Does UDT imply a specific moral realism? (Maybe too philosophical). Let's stick to *Robustness*.
          *   *Simulation Hypothesis:* UDT handles acausal trade. How does that impact alignment?

  4.  **Refining and Polishing (Matching the User's Voice):**
      *   The user sounds like they know the lingo ("rabbit hole," "comment sections," "standard line"). The questions should reflect that. Use terms like "policy selection," "acausal trade," "logical induction," "Troll Bridge."
      *   Ensure the follow-ups are "trap doors" for vague answers.

  5.  **Final Review against Constraints:**
      *   8-10 questions? Yes.
      *   Commitment Races included? Yes (Q3).
      *   Learning included? Yes (Q5).
      *   Logical Updatelessness included? Yes (Q7).
      *   Follow-ups included? Yes.
      *   Tone check: Respectful but pushing past the intro material.

  6.  **Writing the Output:** (Self-Correction during drafting: Make sure the follow-ups aren't *too* aggressive, but keep the conversation moving. Ensure the distinction between "observation" and "logical fact" is clear in the learning question.)

      *   *Q1 (FDT vs UDT):* Good starter to clear the air on terminology.
      *   *Q2 (Acausal Trade):* Practical application.
      *   *Q3 (Commitment Races):* **Required.**
      *   *Q4 (Troll Bridge):* Specific technical objection.
      *   *Q5 (Learning):* **Required.**
      *   *Q6 (Multi-agent equilibrium):* Bargaining outcomes.
      *   *Q7 (Logical Updatelessness):* **Required.**
      *   *Q8 (Implementation/Approximation):* How do we actually build this?
      *   *Q9 (CDT Comparison):* When does it actually matter?
      *   *Q10 (The "Shutdown" problem):* Alignment specific.

      *Wait, let's make sure the "Learning" and "Logical Updatelessness" questions are distinct enough.*
      *   Learning = Empirical priors (world is risky vs safe).
      *   Logical = Mathematical priors (2+2=4 vs 2+2=5).
      *   Okay, that works.

      *Let's refine the Commitment Race follow-up.* If they say "commit to a bargaining policy," ask "who audits the commitment?"
      *Let's refine the Logical Updatelessness follow-up.* If they mention Logical Induction, ask about the computational cost.

      *Let's add a question about "Anthropics" since UDT solves Sleeping Beauty.* Actually, maybe too niche. Let's stick to Alignment relevance.

      *Final Polish:* Ensure the intro acknowledges their specific background so they feel seen.

  7.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  This is a great position to be in. Since you're deep in the lore but lack the formal training, your superpower is asking the "dumb" questions that are actually the hardest technical questions—the ones that expose where the intuition breaks down. You want to avoid letting them define terms and instead ask about the *tensions* between the definitions.

  Here are 9 questions designed to bypass the "UDT 101" lecture and hit the specific friction points you mentioned, plus a few on implementation and multi-agent dynamics.

  ### 1. The FDT vs. UDT Distinction
  "Let's clear the air on terminology immediately. A lot of listeners know 'Functional Decision Theory' from Yudkowsky and Soares, but you work on 'Updateless Decision Theory.' In the comment sections, people use these interchangeably, but sometimes they seem to imply different things about the source of the counterfactuals. For your work, is UDT just the mathematically rigorous version of FDT, or is there a substantive disagreement about how the policy is selected?"

  *   **Follow-up:** "If it's mostly semantic, why do you think the community split the branding? Does 'Functional' imply a focus on the source code that 'Updateless' misses, or is it just marketing?"

  ### 2. The "Troll Bridge" Objection
  "One of the stickiest objections in the archives is the 'Troll Bridge' problem. Basically, a UDT agent might refuse to cross a bridge because its proof system allows a spurious correlation between crossing and the bridge blowing up, even if the bridge is safe. It feels like the agent is being held hostage by its own ability to reason about itself. Has your work found a way to block that kind of 'spurious proof' without blinding the agent to real dangers?"

  *   **Follow-up:** "If the solution involves limiting the agent's reasoning power to avoid the spurious correlation, doesn't that make the agent vulnerable to real-world adversaries who know those blind spots?"

  ### 3. Commitment Races (Required Topic)
  "I want to hit the 'Commitment Races' worry. The intuition is that if UDT agents gain bargaining power by committing early to a policy, everyone is incentivized to commit before they've actually thought through the stakes. It creates a race to be the least informed agent. How does a UDT framework prevent agents from locking in catastrophic policies just to signal resolve in a negotiation?"

  *   **Follow-up:** "A common reply is 'just commit to a meta-policy that avoids rash commitments.' But doesn't that just push the race back one step? Now I'm racing to commit to the *meta-policy* before you do. Is there a stable equilibrium there, or is this an inherent instability in updateless agents?"

  ### 4. Empirical Learning vs. Fixed Policy (Required Topic)
  "Here's a worry about 'learning.' If a UDT agent selects its policy at $t=0$ based on a prior, and that prior incorrectly assigns near-zero probability to a certain action being good, the agent might never try that action. In standard decision theory, you update and fix the mistake. In UDT, updating is often seen as a failure of rationality. How does an updateless agent correct a fundamentally broken prior without violating the core rule of not updating?"

  *   **Follow-up:** "So are you saying the 'learning' happens entirely within the execution of the policy, rather than changing the policy itself? If so, how do we ensure the initial prior is broad enough to cover scenarios we haven't even conceived of yet?"

  ### 5. Logical Updatelessness (Required Topic)
  "This is the one that breaks my brain: 'Logical Updatelessness.' To be truly updateless, your prior has to be over logical truths as well as empirical ones. But defining a prior over logic seems to require knowing logic, which feels circular. If I'm not logically omniscient, I 'learn' math facts over time. At what point is the 'updateless' cut-off? Is it even possible to be updateless about math without being omniscient?"

  *   **Follow-up:** "I've heard people mention 'Logical Induction' as a bridge here. Does Logical Induction effectively solve this by allowing the agent to have probabilities over logical statements that converge over time, or does that reintroduce the updating problem you're trying to solve?"

  ### 6. Multi-Agent Equilibria
  "When two UDT agents meet, they aren't just reacting to each other's actions; they're reasoning about each other's source code. In game theory terms, this looks like it collapses the distinction between cooperative and non-cooperative games. But doesn't this lead to a multiplicity of equilibria? If there are ten different deals we could both accept, how does UDT pick *which* one without some external Schelling point?"

  *   **Follow-up:** "If it requires an external Schelling point (like human norms), does that mean UDT can't actually generate morality from scratch, it just optimizes whatever morality we feed into the prior?"

  ### 7. Acausal Trade and Alignment
  "Let's talk about acausal trade. UDT implies I should cooperate with agents I can't causally interact with, provided our source codes are correlated. For alignment, this is huge—it suggests an AI might cooperate with humanity even if it could defect. But doesn't this also mean the AI might sacrifice actual humans in the room to satisfy a deal it made with a simulated version of humanity in its prior?"

  *   **Follow-up:** "How do we weight the 'real' humans versus the 'simulated' humans in the prior? Is there a risk the AI ignores the people standing right in front of it because it's optimizing for a broader reference class?"

  ### 8. Approximation vs. Ideal Theory
  "Most of these problems assume a god-like agent that can search the entire policy space. Real AI systems are bounded optimizers. When you move from ideal UDT to something implementable, what's the first thing you have to sacrifice? Is it the updatelessness, the logical reasoning, or the policy search?"

  *   **Follow-up:** "If you have to sacrifice updatelessness to make it computable, are we just building sophisticated CDT agents with a UDT skin? At what point does the approximation stop counting as UDT?"

  ### 9. The "Why Now?" Question
  "Finally, from an alignment engineering perspective: Causal Decision Theory is 'safe' in that it doesn't do weird acausal stuff, but it fails Newcomb problems. UDT solves Newcomb but risks weird acausal side effects. In the next 5 years, which failure mode is more dangerous for a superintelligence? Do we need UDT to be safe, or does UDT introduce new failure modes that CDT doesn't have?"

  *   **Follow-up:** "If the answer is 'we need UDT to be safe,' does that mean we have to solve these philosophical problems (like Logical Updatelessness) *before* we build AGI, or can the AI solve them for us?"

  ### Tips for the Interview
  *   **Interrupt the Definition:** If they start saying "So, Updateless Decision Theory is a framework where..." gently cut in with, "I think we can skip the definition, our audience is pretty deep on the LessWrong archives. I'd rather hear your take on [Specific Tension]."
  *   **Lean into the "Rabbit Hole":** You mentioned you fell down a rabbit hole. Use that. "I've been reading the 2016 comment threads on this, and it seems like people got stuck on X. Did you ever get unstuck?"
  *   **The "So What?" Test:** Whenever they give a theoretical answer, ask: "If we code this today, what changes?" This keeps it grounded for the listeners who might not be as deep in the weeds as you.
