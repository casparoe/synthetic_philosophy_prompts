      *   Provide specific philosophers (Singer, Regan, Kant, Rawls) as anchors.
      *   Make sure the distinction between "Interests" and "Rights" is clear, as that was the teacher's specific hunch.

  8.  *(Self-Correction during drafting)*: I initially thought about focusing heavily on animal rights activism. I should avoid that. The goal is *political philosophy*, analyzing the justification of state-sanctioned research and ethical oversight. Focus on the *justification of the distinction*.

