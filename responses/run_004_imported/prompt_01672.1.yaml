answer: |-
  This is an exceptional teaching moment. Your student has stumbled onto one of the most persistent and difficult problems in moral and political philosophy: **The Problem of Moral Status.**

  Your hunch is correct: the distinction between "having interests" and "having rights" is the conceptual key, but it requires unpacking *why* we assign those categories differently. If you simply say "humans have rights and animals don't," you are begging the question. The philosophical work lies in justifying the criterion used to draw that line.

  Here is a systematic way to work through this with your students, structured by the major theoretical frameworks they are likely encountering in a political philosophy unit.

  ### 1. Clarify the Concepts: Interests vs. Rights
  Start by formalizing the student's intuition.

  *   **Interests:** A being has interests if it can be harmed or benefited (e.g., pain is bad for them, health is good for them). Most philosophers agree sentient animals have interests.
  *   **Rights:** Rights are often understood as "trumps" (Dworkin) or "side constraints" (Nozick). They protect the individual from being sacrificed for the aggregate good.
  *   **The Conflict:** Utilitarian ethics generally focuses on *interests* (maximize welfare). Deontological ethics generally focuses on *rights* (respect the person).
  *   **The Student's Challenge:** If we protect human interests via *rights* (forbidding non-consensual experimentation even to save millions), why do we protect animal interests only via *regulation* (allowing experimentation if the benefit is high enough)?

  ### 2. Framework I: The Capacity for Autonomy (Kantian/Deontological)
  This is the traditional liberal defense of human rights.

  *   **The Argument:** Rights are not about suffering; they are about **agency**. Humans are "ends in themselves" because we are rational, autonomous agents capable of moral choice. We cannot be used merely as means. Animals, lacking this moral autonomy, are not "persons" in the strict sense.
  *   **Application to Primates:** This is where the primate case gets difficult. If a chimp has self-awareness and complex social reasoning, does it have a rudimentary autonomy?
  *   **The "Marginal Cases" Problem:** This is the critical test for your students. If rights depend on rationality/autonomy, what about human infants, the severely cognitively disabled, or those in comas? They lack autonomy, yet we grant them rights.
      *   *Class Discussion:* If we grant rights to a non-autonomous human infant but deny them to a highly autonomous chimp, are we being "speciesist" (Peter Singer's term), or is there a relevant difference (e.g., *potential* for autonomy, or membership in the human community)?

  ### 3. Framework II: The Moral Community (Contractualism)
  This approach, associated with Rawls or Scanlon, looks at who is part of the political agreement.

  *   **The Argument:** Justice and rights are rules we agree to live by because we can understand and reciprocate them. Animals cannot participate in the social contract; they cannot understand duties or laws. Therefore, we have *compassionate duties* regarding them, but they do not have *claims of justice* against us.
  *   **Application:** We regulate animal testing not because the animal has a right to refuse, but because *we* (the moral agents) degrade ourselves by being cruel. The oversight is for *our* moral hygiene, not *their* rights.
  *   **Critique:** This feels like "realpolitik" to many students. It implies that might (the ability to make contracts) makes right. It also fails to explain why we think it's wrong to torture an animal even if no other human sees it (suggesting the wrong is done *to the animal*, not just to human character).

  ### 4. Framework III: Equal Consideration of Interests (Utilitarianism)
  Peter Singer's approach flips the script.

  *   **The Argument:** The capacity for suffering is the prerequisite for having interests. A mouse's pain counts as much as a human's pain *if the intensity is the same*. However, humans may have *more* interests (future planning, complex relationships) than animals.
  *   **Application:** You don't need "rights" to have protection. You just need the interests weighed equally.
      *   *The Calculation:* If primate testing cures Alzheimer's, does the relief of human suffering outweigh the primate's suffering?
      *   *The Student's Point:* Singer would actually agree with your student! He argues that if we wouldn't do it to a human with similar cognitive capacity (e.g., a severely disabled infant), we shouldn't do it to a primate.
  *   **The Limit:** Utilitarianism allows sacrifice. If the benefit is massive enough, utilitarianism *could* justify testing on humans, which violates our intuition about human rights. This highlights why we prefer rights-based language for humans.

  ### 5. Framework IV: Graduated Moral Status (The Scalar Approach)
  This is often the most satisfying synthesis for students.

  *   **The Argument:** Moral status isn't binary (0 or 1). It is scalar.
      *   **Level 1 (Sentience):** Can feel pain. (Mice, insects). Protection from unnecessary suffering.
      *   **Level 2 (Social/Emotional):** Has relationships, fear, memory. (Dogs, primates). Higher threshold for harm.
      *   **Level 3 (Personhood):** Autonomous, moral agent. (Typical humans). Inviolable rights.
  *   **Application:** Primate testing sits in the "uncanny valley" of moral status. Because they are Level 2 (bordering on 3), the justification for testing must be incredibly high (e.g., curing a fatal disease), whereas testing on insects requires low justification.
  *   **Why not Human Rights?** Even at Level 2, the being lacks the specific "right to liberty" or "right to consent" that comes with Level 3 agency. We protect their *welfare* intensely, but we do not grant them *sovereignty* over their own bodies.

  ### Pedagogical Strategy: The "Veil of Ignorance" Test
  To make this concrete, try this thought experiment in class:

  **The Modified Veil:**
  Ask students to imagine they are behind a Rawlsian Veil of Ignorance, but they don't know *what species* they will be born as.
  1.  Would they agree to a system where primates can be experimented on to cure human diseases?
  2.  Would they agree to a system where humans can be experimented on to cure primate diseases?
  3.  Would they agree to a system where *any* being can be experimented on if it saves 1,000 lives?

  **The Goal:** This forces them to separate their *species loyalty* from their *principles of justice*.
  *   If they say "No testing on anyone," they are prioritizing individual rights over aggregate welfare.
  *   If they say "Testing is okay for primates but not humans," they must articulate the **relevant difference** that justifies the inequality. Is it intelligence? Moral reciprocity? Soul?

  ### Summary for the Class
  You can summarize the "Line" for your students like this:

  1.  **Interests** arise from **Sentience** (the ability to suffer). Animals have these.
  2.  **Rights** arise from **Personhood** (the capacity for autonomy, moral agency, and participation in a community of justification). Humans generally have these.
  3.  **The Tension:** Primates challenge this binary. They have high sentience and rudimentary personhood.
  4.  **The Resolution:** We grant animals **protections based on welfare** (minimizing pain, requiring necessity) rather than **rights based on liberty** (consent, inviolability). We accept that their interests can be overridden by human necessity, *but* we impose strict oversight to ensure that "necessity" is real, because their suffering is morally real.

  This approach validates the student's intuition (animals matter morally) without collapsing the distinction that underpins human rights law. It moves the debate from "Do animals matter?" to "What kind of mattering grants a right to life/liberty versus a right to humane treatment?"

  ### Recommended Reading Snippets
  If you want to assign short texts to accompany this:
  *   **Peter Singer:** "All Animals Are Equal" (for the interests argument).
  *   **Carl Cohen:** "The Case for the Use of Animals in Biomedical Research" (for the moral community/rights argument).
  *   **Jeff McMahan:** "The Meat Eaters" or work on "Moral Status" (for the graduated status argument).

  This case study is gold. It forces students to confront whether their belief in human rights is based on *inherent dignity* or *species membership*, and whether those are the same thing.
