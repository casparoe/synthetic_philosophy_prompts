answer: |-
  This is an exceptionally sharp objection, and it cuts to the heart of the debate between Causal Decision Theory (CDT), Evidential Decision Theory (EDT), and the newer Logical/FUNCTIONAL Decision Theories (LDT/FDT) that often underpin Evidential Cooperation in Large Worlds (ECL).

  You are correct that structurally, both cases involve a correlation between your action and an outcome you cannot causally influence, mediated by a factor existing prior to your decision. In the Smoking Lesion problem, the lesion causes both the urge to smoke and the cancer. In ECL, the "common cause" is typically framed as the shared logical structure of the decision algorithms (or shared initial conditions in a multiverse) causing both your cooperation and theirs.

  The principled distinction ECL proponents draw relies on **what information is available to screen off the correlation** and the **modal status of the dependence** (physical vs. logical).

  Here is the breakdown of the distinction.

  ### 1. The Tickle Defense and Screening Off

  To understand the ECL defense, we must first look at why the Smoking Lesion correlation is dismissed.

  In the Smoking Lesion problem, standard EDT initially suggests you shouldn't smoke because $P(\text{Cancer} | \text{Smoke}) \gg P(\text{Cancer})$. However, the **Tickle Defense** (proposed by Arntzenius and others) refines EDT. It argues that you have access to your internal mental states (the "tickle" or urge) prior to the action.

  Let $L$ be the lesion, $U$ be the urge, and $S$ be smoking. The causal graph is $L \rightarrow U \rightarrow S$ and $L \rightarrow \text{Cancer}$.
  Once you condition on the urge $U$, the action $S$ provides no *additional* evidence about $L$.
  $$P(\text{Cancer} | \text{Smoke}, \text{Urge}) = P(\text{Cancer} | \text{Urge})$$
  Since you cannot change your urge by deciding to smoke (the urge precedes the decision), the evidential link is screened off. You should smoke if you enjoy it, because your smoking doesn't change the probability of cancer *given what you already know about your brain state*.

  ### 2. Why the "Tickle" Fails in ECL

  ECL proponents argue that in the Large World scenario, there is no equivalent "tickle" variable that screens off the correlation between your decision and the other agents' decisions.

  In ECL, the correlation is not mediated by a physical common cause (like a biological lesion) that exists in the past light cone and is fully observable by introspection. Instead, the correlation is mediated by **logical identity** (or high similarity) of the decision procedure itself.

  Let $M$ be the mathematical truth of your decision algorithm. Let $A_{me}$ be your action and $A_{them}$ be the action of the causally isolated agent.
  The structure is not $M \rightarrow \text{InternalState} \rightarrow A_{me}$.
  Rather, $A_{me}$ is the *output* of $M$.

  **The Crucial Distinction:**
  In the Smoking Lesion case, you can know the mediating variable (the Urge) *without* having performed the action. You can feel the urge but choose not to smoke. This allows you to screen off the action.

  In the ECL case, the mediating variable is the **output of the computation**. You cannot know what your algorithm outputs without *running* the algorithm (i.e., making the decision). There is no "logical urge" you can introspect prior to the decision that tells you what you will decide, independent of the decision process itself.
  *   If you try to introspect "What will I decide?", you must engage the decision procedure.
  *   Engaging the decision procedure *is* deciding.

  Therefore, you cannot condition on a variable that screens off the correlation between $A_{me}$ and $A_{them}$ without essentially fixing $A_{me}$ itself. The correlation remains "live" at the moment of decision.

  ### 3. Subjunctive vs. Physical Dependence

  This leads to the second part of the distinction: the nature of the dependence.

  **Smoking Lesion (Physical/Common Cause):**
  The correlation is contingent on physical laws and biological history. It is possible (in a nearby possible world) for the lesion to exist without the smoking, or the smoking without the lesion (if the causal chain is interrupted). The correlation is **empirical**.

  **ECL (Logical/Subjunctive):**
  The correlation rests on **subjunctive dependence** (a term popularized by Wallace and utilized in FDT). If you and the other agent are running identical algorithms on identical inputs, it is not merely an empirical coincidence that you output the same thing; it is a **logical necessity**.

  If you were to output "Defect" (in the counterfactual sense), then logical consistency dictates that any identical agent must also output "Defect."
  *   In Smoking Lesion: If I were to not smoke, the lesion would still be there (and I would still get cancer). My action does not track the lesion in the counterfactual.
  *   In ECL: If I were to Cooperate, the logical fact of my algorithm's output changes. Since the other agent instantiates the same logical fact, their output changes in the counterfactual.

  ECL proponents argue that EDT should care about this because $P(\text{They Cooperate} | \text{I Cooperate})$ is high *and* stable under the counterfactual supposition of the decision, whereas in Smoking Lesion, $P(\text{Cancer} | \text{I Smoke})$ is high only because of a background fact (the lesion) that does not shift with the counterfactual supposition of the action *once internal states are fixed*.

  ### 4. The "Common Cause" Rebuttal

  A critic might say: "But in a multiverse, the common cause is the initial conditions of the universe that spawned both of us. That is physical, not logical. So isn't it just like the lesion?"

  ECL proponents (like Oesterheld and MacAskill) respond by distinguishing between **causal history** and **logical constraints**.

  Even if the initial conditions are a physical common cause, the *mechanism* by which the correlation is maintained is the logical structure of the agents.
  *   **Lesion Case:** The correlation is maintained by biological causation. Intervening on the action (forcing yourself not to smoke) does not break the correlation with cancer because the lesion is already present.
  *   **ECL Case:** The correlation is maintained by logical implication. Intervening on the action (conceptually asking "What if I cooperate?") *does* break the correlation with the other agent's defection, because "I cooperate and they defect" is logically inconsistent for identical agents.

  Therefore, the correlation in ECL is **decision-relevant** because the decision itself is the locus of the logical constraint. In the Lesion case, the decision is merely a downstream symptom.

  ### 5. Summary of the Principled Distinction

  | Feature | Smoking Lesion | ECL (Large Worlds) |
  | :--- | :--- | :--- |
  | **Correlation Source** | Physical Common Cause (Lesion) | Logical Identity / Subjunctive Dependence |
  | **Screening Variable** | Yes (The Urge / Internal State) | No (The Output *is* the Decision) |
  | **Accessibility** | Urge is known *before* action | Output is known only *by* acting |
  | **Counterfactuals** | Action does not track the cause in counterfactuals | Action logically constrains the correlate in counterfactuals |
  | **Verdict** | Correlation is spurious (Screened off) | Correlation is decision-relevant (Not screened off) |

  ### Conclusion

  The ECL argument rests on the claim that **logical correlations are not spurious in the same way physical common-cause correlations are.**

  In the Smoking Lesion problem, the correlation is screened off by introspection of the proximate cause (the urge). In ECL, there is no proximate cause prior to the decision that can be introspected without *being* the decision. Because you cannot know your output without computing it, and computing it *is* the decision, the correlation between your decision and the logical consequences (including the decisions of identical agents) remains evidentially potent.

  Thus, while both cases look like $A \leftarrow C \rightarrow B$, ECL proponents argue that in ECL, $A$ and $B$ are logically entailed by $C$ in a way that makes $A$ evidence for $B$ *even under the supposition of choosing A*, whereas in Smoking Lesion, $A$ is merely a physical symptom of $C$ that loses evidentiary power once $C$'s proximate effects are accounted for.

  This is why ECL proponents feel justified in cooperating: they view the correlation as **constitutive** of the decision's logical footprint, rather than **indicative** of a fixed background state.
