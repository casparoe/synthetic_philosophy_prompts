      *   **Core Question:** Can Menkiti's core idea (personhood is achieved through relationship/participation) survive being paired with the conviction that vulnerable groups (infants, disabled, nonconformists) are owed full moral protection?
      *   **Requirements:**
          *   Take a side (no fence-sitting/draw).
          *   Explore the strongest resources of the "radical" view (Menkiti) to answer the objection.
          *   Explore the strongest version of Gyekye's objection.
