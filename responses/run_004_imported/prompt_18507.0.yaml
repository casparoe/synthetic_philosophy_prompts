      *Revised Definition Strategy:* Define Civil Disobedience as requiring *publicity of the act*, not necessarily *publicity of the agent*. This neutralizes the masking issue at the definitional level.

      *Let's refine the "Losing Side" requirement.* If I side with B (Equity), I must steel-man A (Accountability). If I side with A, I must steel-man B. Given the philosophy major persona and the visa stakes, siding with B (Equity/Inclusion) feels more ethically robust, but I must give A their due.
      *Actually, a nuanced middle ground is more "Board Member" like.*
