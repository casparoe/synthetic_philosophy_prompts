      *Wait, one more thing:* The prompt says "take the strongest version of the losing side's argument seriously." This implies I need to pick a side. I will pick the side that allows for reduced sanctions for the masked students (Side B), because the visa risk is severe. Therefore, Side A (Disqualification) is the losing side I must steel-man.

