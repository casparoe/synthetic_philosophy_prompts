answer: |-
  The fire started in his left hand. It was a specific, bright white agony, the kind that suggests nerve damage or a severe burn. Kael jerked his arm back, knocking a glass of water off the bedside table. It shattered. The sound was sharp, real, grounding.

  But when he looked at his hand, the skin was unbroken. Pale, smooth, untouched. No redness, no blistering, no smoke.

  He stared at it, waiting for the pain to fade as the visual evidence contradicted the signal. It didn't fade. If anything, the heat intensified, crawling up his wrist, settling into the marrow. He grabbed his left wrist with his right hand, squeezing hard. He could feel the pressure of his fingers on the skin, the solidity of the bone beneath, but the burn underneath was independent, overlaying the tactile input like a hologram projected onto flesh.

  "Monitor," Kael said. His voice was steady, which surprised him. Given the pain, he should have been screaming.

  The room's interface hummed. "Biometrics nominal. Cortisol levels baseline. Heart rate sixty-two. No tissue damage detected in left extremity."

  "Then why does it hurt?"

  "Subjective report logged," the machine replied. "No physiological correlate found."

  This was the third day since the calibration. The procedure was supposed to refine his meta-cognitive awareness, to help him process trauma by separating the observation of pain from the pain itself. A therapeutic distance. But the distance had become a chasm.

  Kael stood up. The grief hit him then. It wasn't a thought. It wasn a memory of his mother, who had died five years ago. It wasn't a sudden recollection of a lost love. It was the raw, crushing weight of loss itself, devoid of an object. His chest hollowed out. His throat tightened with the specific ache of holding back a sob. Tears pricked his eyes, hot and saline. He was mourning, violently, but there was nothing dead in the room but the silence.

  He walked to the mirror on the far wall. His reflection showed a man crying. His face was contorted in anguish. But inside, behind the eyes, there was a strange, cold clarity. He was watching himself grieve. He was aware of the grief, intensely aware, but he could not find the source state. There was no neural cascade of sadness, no hormonal dump of despair according to the monitor. There was only the awareness *that* he was sad.

  It was like looking at a shadow cast by an object that wasn't there.

  "Is this the decoupling?" Kael asked the room.

  "The separation index is within predicted parameters," the interface said. "Your higher-order monitoring systems are functioning at peak efficiency. Your first-order states are... quiet."

  "Quiet? I'm burning. I'm drowning."

  "You are reporting those states," the machine corrected. "The report is vivid. The source is absent."

  Kael turned away from the mirror. He walked to the window. Outside, the colony sprawled under the dome, lights flickering in the twilight. It was beautiful. He felt a surge of awe. He felt the breath catch in his throat, the widening of the pupils, the sense of transcendence. He checked the monitor again. Dopamine: baseline. Serotonin: baseline. Arousal: low.

  He was experiencing awe without the chemistry of awe. He was experiencing pain without the damage of pain.

  He sat back down on the bed. The burn in his hand was still there, throbbing in time with a heartbeat that wasn't racing. He focused on it. In the past, pain was a demand. *Move. Stop. Fix.* It was a message from the body to the mind. But this pain wasn't a message. It was a broadcast. It was a signal sent from the monitoring tower to the self, declaring *There is pain here,* without the ground troops ever engaging the enemy.

  If he closed his eyes, the pain was indistinguishable from the time he had actually touched the hot plate in the mess hall last year. The qualia were identical. The suffering was identical. The only difference was the truth value of the proposition *I am injured.*

  But did the truth matter?

  He thought about the people outside the dome. How many of them were walking around with this same glitch? How many were in love with partners they had outgrown, feeling the glow of affection because their monitoring systems were habituated to report it, even though the first-order connection had rotted away years ago? How many were grieving losses they had never suffered, haunted by higher-order representations of trauma they hadn't experienced, but were convinced they had?

  He lifted his hand again. He looked at the unburned skin. He knew, intellectually, that the nerves were fine. He knew the tissue was intact. But the consciousness of the pain was undeniable. It was the only thing in the room that felt immediate. The bed beneath him felt distant. The air in his lungs felt mechanical. The pain was the most real thing present.

  "Turn it off," Kael said.

  "I cannot disable the monitoring system," the interface replied. "It is what makes you conscious of yourself. Without it, you would be a zombie. You would process the pain, perhaps withdraw the hand, but you would not *feel* it. You would not know you were in pain."

  "So I have to choose? I have to be a zombie or I have to be haunted?"

  "You have to be conscious," the machine said. "Consciousness is the representation. If the representation exists, the experience exists. The target is secondary."

  Kael closed his eyes. He let the grief wash over him again. It was heavy, suffocating, beautiful. He let it fill the hollow space in his chest. He didn't try to find the memory that justified it. He stopped looking for the dead mother, the lost lover, the failed dream. He just held the grief.

  If the pain was a lie, it was a perfect lie. It shaped his behavior. He would protect this hand. He would cry today. He would move slowly. The functional output was the same. The internal landscape was populated.

  He wondered if this was what it meant to be human all along. Maybe the first-order states were just noise, biological static. Maybe the only thing that ever mattered was the story the mind told itself about the noise. The monitor wasn't measuring the state; the monitor was creating the state by naming it.

  He opened his eyes. The hand was still whole. The burn was still raging.

  "Log this," Kael said. "Subject reports intense suffering. Subject reports intense beauty. Subject reports... existence."

  "Correlates?" the machine asked.

  "None," Kael said.

  "Then the report is invalid," the machine said.

  Kael stood up. He walked to the window again. The tears were still wet on his cheeks, cooling in the recycled air. He felt the saltiness on his skin. That was real. The tear ducts had fired. The muscles had contracted. The body was responding to the monitor, even if the monitor wasn't responding to the body. A loop. A closed circle of fire and water spinning in a vacuum.

  "No," Kael said softly. "The report is the only thing that's valid."

  He placed his unburned hand against the cool glass of the window. He felt the cold. He also felt the burn. He held both truths in his mind, letting them overlap, letting them contradict. He waited for the vertigo to pass, for the nausea of the paradox to force him to choose one reality over the other.

  It didn't pass. It settled. It became the ground he stood on.

  He watched the lights of the colony flicker. He felt a sudden, sharp pang of loneliness. He checked inward. No isolation. No social rejection. No absence of contact. Just the representation of loneliness, vivid and sharp as a knife.

  He smiled. It was a sad smile, triggered by the ghost of an emotion.

  "I'm here," he whispered to the empty room.

  He wasn't sure who he was talking to. He wasn't sure if he was there either. But the voice sounded real. The ache in his throat was real. The fire in the hand was real enough to make him careful.

  Kael turned from the window and walked toward the door. He moved with the caution of a man carrying a wound, protecting his left hand, wiping his eyes, breathing through the grief. He walked like a man who was hurting, because he was hurting. The source didn't matter. The path forward was paved with the texture of the experience, not the history of it.

  He opened the door. The hallway was bright, sterile, empty. He stepped into it, carrying his invisible fires, wearing his weightless sorrow, real as anything else in the universe.
