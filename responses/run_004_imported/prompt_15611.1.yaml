      *   **Harsanyi's Critique:** Harsanyi argued Rawls got it wrong; rational choice behind the VoI leads to utilitarianism (average utility), not maximin.
      *   **The Question:** Why do political philosophers still treat Rawls's maximin as a serious rival to utilitarianism instead of dismissing it as a mathematical error based on Harsanyi's proof?

  2.  **Initial Brainstorming & Fact-Checking:**
