answer: |-
  The persistence of Rawls's maximin criterion as a serious rival to utilitarianism, despite Harsanyi's Aggregation Theorem, stems from a fundamental disagreement not about mathematics, but about the **moral interpretation of the premises** required to make that mathematics work.

  Political philosophers do not treat Rawls's position as a mathematical error because Rawls explicitly rejects the specific axioms Harsanyi requires to derive utilitarianism. Rawls argues that the Original Position (OP) is a device of representation designed to model fairness, not a standard decision-theoretic problem designed to model rational choice under risk.

  Here are the four primary reasons why maximin remains a viable rival to Harsanyi's utilitarianism.

  ### 1. Risk vs. Uncertainty (The Probability Objection)
  Harsanyi's derivation relies on the **Principle of Insufficient Reason** (or equiprobability). He argues that if you do not know who you will be, you must assign an equal probability to occupying any position in society. Once you assign probabilities, you calculate *expected utility*. If you maximize expected utility with equal probabilities, you mathematically arrive at average utilitarianism.

  Rawls explicitly rejects this move. He distinguishes between **decision-making under risk** (where probabilities are known) and **decision-making under uncertainty** (where probabilities are unknown or meaningless).
  *   **Rawls's View:** Behind the Veil of Ignorance, parties lack the knowledge required to form a basis for estimating probabilities. There is no objective data on the distribution of social positions to ground an equiprobability assumption.
  *   **The Consequence:** Without probabilities, the expected utility calculation is impossible. In the absence of probabilistic data, maximin (maximizing the minimum guarantee) is a standard, rational decision rule for high-stakes choices. Therefore, Rawls does not violate decision theory; he argues Harsanyi applies the wrong branch of it.

  ### 2. The Metric of Advantage (Utility vs. Primary Goods)
  Harsanyi's Aggregation Theorem requires that individual utilities be **cardinally measurable** and **interpersonally comparable**. It assumes we can sum up "utils" across different people.

  Rawls rejects utility as the currency of justice for two reasons:
  *   **Subjectivity:** Utility functions reflect subjective preferences, which can be adaptive (e.g., the "happy slave" who lowers expectations to avoid pain) or expensive (e.g., someone with a taste for champagne). Basing justice on the satisfaction of preferences rewards expensive tastes and punishes those who have learned to be content with less.
  *   **Publicity:** A conception of justice must be publicly verifiable. Subjective utility is internal and hard to measure. Rawls proposes **Primary Goods** (rights, liberties, income, wealth, social bases of self-respect) as an objective index.
  *   **The Consequence:** Harsanyi's theorem cannot apply to Rawls's framework because Rawlsian parties are not maximizing vNM utility functions; they are maximizing an index of all-purpose means. The mathematical proof of utilitarianism dissolves if the inputs are not utilities.

  ### 3. The Stakes and Risk Aversion (The "Strains of Commitment")
  Harsanyi treats the choice behind the veil as a standard gamble. He argues that extreme risk aversion (maximin) is irrational unless the stakes involve survival.

  Rawls argues that the stakes in the Original Position *are* unique and existential.
  *   **Non-Transferable Rights:** The choice concerns basic liberties and life prospects. If you end up at the bottom of a utilitarian society, you might be enslaved or severely oppressed for the greater good. You cannot "trade" your basic liberty for higher average income later.
  *   **Strains of Commitment:** Rawls introduces the idea that the parties must consider whether they can actually stick to the agreement once the veil is lifted. A utilitarian agreement might demand sacrifices from the worst-off that are psychologically or morally impossible to bear.
  *   **The Consequence:** Rawls argues that risk aversion in the OP is not a psychological quirk but a structural requirement of the "circumstances of justice." Because the consequences of a bad draw are catastrophic and irreversible (loss of basic liberty), caution is rational.

  ### 4. The Separateness of Persons
  This is the deepest philosophical divergence. Harsanyi's aggregation treats society as a single entity whose welfare is the sum of its parts. This mirrors how an individual balances present pleasure against future pain.

  Rawls (following Nozick's later critique of utilitarianism) argues this conflates **personal choice** with **social choice**.
  *   **Individual:** It is rational for me to sacrifice a toothache today for a vacation next month. I am one person enduring both.
  *   **Society:** It is not necessarily just to sacrifice one person's liberty for another's gain. Society is a cooperation between distinct persons, not a single super-person.
  *   **The Consequence:** Rawls treats the Original Position not merely as a choice model, but as a procedural interpretation of Kantian autonomy and the distinctness of persons. Even if Harsanyi's math is correct *given his premises*, Rawls argues his premises violate the fundamental liberal intuition that individuals are inviolable.

  ### Summary
  Political philosophers treat maximin as a serious rival because Rawls's argument is not that Harsanyi's math is wrong, but that **Harsanyi's model is morally inappropriate for the subject of justice.**

  *   **Harsanyi** asks: "What would a rational agent choose to maximize welfare?" (Answer: Utilitarianism).
  *   **Rawls** asks: "What principles would free and equal persons agree to under conditions that guarantee fairness?" (Answer: Justice as Fairness/Maximin).

  Rawls successfully shifted the debate from "Which calculation yields the highest value?" to "Which premises best model moral equality?" As long as the equiprobability assumption and the use of subjective utility are contested on moral grounds, maximin remains a robust alternative to utilitarianism.
