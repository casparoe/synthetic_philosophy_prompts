answer: |-
  The standard rationalist consensus holds that to resolve Pascal's Mugging and the St. Petersburg paradox, an agent's utility function must be **bounded**. The alternative, historically proposed by Daniel Bernoulli, is that utility need only be **concave** (exhibiting diminishing marginal returns), such as $U(x) = \log(x)$. Bernoulli's fix resolves the *original* St. Petersburg game, where the monetary payoff doubles ($2^n$) while the probability halves ($1/2^n$). Under log utility, the expected utility becomes a convergent sum.

  However, concavity alone is insufficient to protect an agent from *all* St. Petersburg-style gambles. If a utility function is unbounded above, no matter how slowly it grows, a "mugger" (or game designer) can construct a modified payoff sequence that forces the expected utility to diverge to infinity. The vulnerability lies not in the rate of growth of the utility function, but in the lack of a hard ceiling.

  Here is the argument that any unbounded utility function is vulnerable, including an explicit construction of the escalated prizes required to break it.

  ### 1. The Setup

  Let $U: \mathbb{R}^+ \to \mathbb{R}$ be a utility function over monetary payoffs (or general goods). We assume two standard properties:
  1.  **Monotonicity:** If $x > y$, then $U(x) \ge U(y)$.
  2.  **Unboundedness:** For any real number $M$, there exists some payoff $x$ such that $U(x) > M$.

  We consider a generalized St. Petersburg game with a fixed probability structure. In round $n$ (for $n = 1, 2, 3, \dots$), the game ends with probability $p_n = 1/2^n$. If the game ends at round $n$, the agent receives a prize $x_n$.

  The Expected Utility (EU) of this gamble is:
  $$ EU = \sum_{n=1}^{\infty} p_n U(x_n) = \sum_{n=1}^{\infty} \frac{1}{2^n} U(x_n) $$

  Bernoulli's insight was that if $x_n = 2^n$ and $U(x) = \log(x)$, the term becomes $\frac{1}{2^n} \cdot n \log(2)$, which sums to a finite value. The claim to be refuted is that *any* concave, unbounded function protects against *any* such sequence. We will show that for any unbounded $U$, we can choose a sequence $x_n$ such that $EU = \infty$.

  ### 2. The Construction of Escalated Prizes

  To make the expected utility diverge, we do not need the terms of the sum to grow; we only need them not to vanish too quickly. The simplest way to ensure divergence is to construct the prizes $x_n$ such that every term in the expected utility sum equals a constant, say 1.

  We require:
  $$ \frac{1}{2^n} U(x_n) = 1 $$

  Solving for the required utility of the prize:
  $$ U(x_n) = 2^n $$

  Now we must determine if a prize $x_n$ exists that satisfies this condition. This is where the **unboundedness** of $U$ does the work.

  By the definition of unboundedness, for any target value $T$, there exists an input $x$ such that $U(x) \ge T$.
  *   For $n=1$, let target $T_1 = 2^1 = 2$. Since $U$ is unbounded, $\exists x_1$ such that $U(x_1) \ge 2$.
  *   For $n=2$, let target $T_2 = 2^2 = 4$. Since $U$ is unbounded, $\exists x_2$ such that $U(x_2) \ge 4$.
  *   For arbitrary $n$, let target $T_n = 2^n$. Since $U$ is unbounded, $\exists x_n$ such that $U(x_n) \ge 2^n$.

  Thus, we construct the prize sequence $\{x_n\}$ by selecting, for each $n$, a payoff $x_n$ that yields at least $2^n$ utils.

  Substituting this back into the EU sum:
  $$ EU = \sum_{n=1}^{\infty} \frac{1}{2^n} U(x_n) \ge \sum_{n=1}^{\infty} \frac{1}{2^n} (2^n) = \sum_{n=1}^{\infty} 1 = \infty $$

  The expected utility is infinite. The agent should theoretically be willing to pay any finite amount to play this game.

  ### 3. Why Concavity Does Not Save You

  One might object that the prizes $x_n$ required to achieve this grow absurdly fast, perhaps violating the spirit of concavity. Let us examine this explicitly for Bernoulli's proposed fix, $U(x) = \log(x)$.

  To achieve the condition $U(x_n) = 2^n$:
  $$ \log(x_n) = 2^n \implies x_n = e^{(2^n)} $$

  In the original St. Petersburg game, the prize grows exponentially ($2^n$). To break log utility, the prize must grow **super-exponentially** ($e^{2^n}$).
  *   Original Game Prize at $n=10$: $2^{10} \approx 1,000$.
  *   Anti-Log Prize at $n=10$: $e^{1024}$, a number with roughly 445 digits.

  Concavity ensures that doubling the money does not double the utility. It does *not* ensure that there is a limit to the utility. Because log utility has no ceiling, there is always some amount of money large enough to produce $2^n$ utils. The diminishing returns slow down the growth of utility, but the "mugger" can simply compensate by offering prizes that grow even faster than the utility function shrinks them.

  This logic holds for **any** unbounded function, no matter how slowly it grows.
  *   If $U(x) = \log(\log(x))$, we need $\log(\log(x_n)) = 2^n \implies x_n = e^{e^{2^n}}$.
  *   If $U(x)$ grows at the pace of the inverse Ackermann function, $x_n$ must grow at the pace of the Ackermann function.

  As long as $U(x) \to \infty$ as $x \to \infty$, the inverse $U^{-1}(2^n)$ is well-defined (in the sense of existence), and the prize sequence can be constructed. The "cost" of the prize in real-world resources becomes physically impossible almost immediately, but in decision-theoretic terms, the agent is committed to preferring this gamble as long as the utility function remains mathematically unbounded.

  ### 4. The Necessity of Boundedness

  The only way to block this construction is to impose a bound $B$ such that $U(x) < B$ for all $x$.

  If $U(x)$ is bounded by $B$, then:
  $$ EU = \sum_{n=1}^{\infty} \frac{1}{2^n} U(x_n) < \sum_{n=1}^{\infty} \frac{1}{2^n} B = B \sum_{n=1}^{\infty} \frac{1}{2^n} = B $$

  The sum converges to a value strictly less than $B$. No matter how the prizes $x_n$ are escalated, the term $U(x_n)$ can never exceed $B$, so the probability weighting $1/2^n$ will always drive the terms to zero fast enough to ensure convergence.

  ### Conclusion

  Bernoulli's concave utility patch solves the specific historical problem where the monetary payoff grows at a fixed exponential rate ($2^n$). It fails as a general safeguard against Pascal's Mugging because it does not cap the maximum possible value of an outcome.

  The argument above demonstrates that for any unbounded utility function, one can define a "Super St. Petersburg" game where the prizes $x_n$ are chosen specifically to satisfy $U(x_n) \ge 1/p_n$. This neutralizes the probability discounting exactly. Therefore, **boundedness** is not merely a convenient heuristic; it is a necessary condition for an agent to be immune to all St. Petersburg-style divergences. Without a hard ceiling on utility, there is always a prize large enough to justify any small probability.
