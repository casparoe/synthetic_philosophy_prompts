answer: |-
  This is a fantastic question. You have essentially reinvented a concept that exists in social choice theory and welfare economics, often called **range voting** or **cardinal utilitarianism**.

  Your intuition is shared by many philosophers (notably John Harsanyi, a Nobel laureate). However, the reason economists and philosophers treat this as a "deep unsolved mystery" rather than a solved engineering ticket comes down to three specific problems that don't show up in your team's feature prioritization but become massive blockers when you scale to global moral decisions.

  Here is the breakdown of why your normalization trick works in Jira but hits a wall in moral philosophy.

  ### 1. The "Ground Truth" Calibration Problem
  In your team scenario, you assume everyone understands what a "1" and a "10" represent roughly the same way. Maybe you have a shared definition: "1 is 'nice to have', 10 is 'system on fire'."

  In philosophy, we don't have that shared API spec.
  *   **The Bounds Problem:** To min-max normalize, you need to know a person's absolute theoretical minimum and maximum utility. But humans are terrible at this. If I ask you to rate your current life satisfaction a 7/10, what is the 10? Is it "eating a good sandwich"? Is it "world peace"? Is it "orgasmic bliss for eternity"?
  *   **The Scale Problem:** Person A might be emotionally stoic. Their internal range between "misery" and "ecstasy" might be narrow. Person B might be bipolar or highly neurotic; their internal range might be massive. If you normalize both to 0–1, you are assuming that a 10% shift in Person A's internal state is morally equivalent to a 10% shift in Person B's. There is no "neural caliper" to verify that.

  **SE Analogy:** Imagine two microservices logging latency. Service A logs in milliseconds (1ms to 1000ms). Service B logs in seconds (0.001s to 1s). You can normalize both to 0–1, but if Service B's clock is drifting or the sensor is less sensitive, your aggregated dashboard is lying to you. In ethics, we don't have access to the sensor hardware (the brain) to check the calibration.

  ### 2. Strategic Voting (Game Theory)
  In your team, you probably have social pressure and trust that prevents people from gaming the system. If Alice rates every feature a "1" except her pet project which she rates "10," her teammates will call her out.

  In global ethics (Effective Altruism), there is no moderator.
  *   If people know that resources will be allocated based on normalized intensity of preference, the rational move is to rate *everything* you don't care about as 0 and *everything* you care about as 10.
  *   If everyone does this, normalization breaks down because everyone's variance becomes identical.
  *   This isn't just theoretical; it's a version of the **Gibbard-Satterthwaite theorem**, which proves that almost all voting systems are manipulable.

  Philosophers worry that a system based on self-reported utility invites people to lie about how much they suffer or want something to grab more resources.

  ### 3. Preference vs. Welfare (The "Bad Preferences" Problem)
  Your engineering model assumes that **Preference = Value**. If the team wants the feature, it is valuable to ship the feature.

  In ethics, this is contested.
  *   **Adaptive Preferences:** A person born into oppression might rate their well-being as an 8/10 because they have lowered their expectations to survive. A person in a free society might rate theirs a 6/10 because they have high standards. If you normalize these, you might conclude the oppressed person is doing better and deserves fewer resources.
  *   **Misinformation:** A person might intensely want to smoke cigarettes (high utility in the moment) but it lowers their long-term welfare.
  *   **Malice:** A person might derive intense utility (a 10) from seeing someone else suffer. In your feature system, you might count that vote. In ethics, most EAs want to exclude "antisocial preferences" from the utility function, but there is no mathematical way to distinguish a "good" 10 from a "bad" 10 using only the data.

  ### 4. The "Missing Data" Issue (Non-Existence)
  In software, the "users" (your teammates) always exist. In EA, we often make decisions about people who *do not yet exist* (future generations) or animals who cannot fill out a survey.
  *   You cannot ask a future person to normalize their utility range.
  *   You cannot ask a chicken to rate its suffering on a 1–10 scale relative to its maximum possible chicken happiness.
  *   To compare a human's utility to a cow's utility, you need a "common currency" of experience (hedonic tone). We don't have a way to measure if a cow's pain is "worth" 0.1 human units or 0.5 human units.

  ### So, is it actually impossible?
  It depends on who you ask.

  1.  **The Welfarists (Your Camp):** Philosophers like Peter Singer or the late John Harsanyi argue that while we can't *prove* comparisons, we must **act as if** they are possible. We use proxies (income, health metrics, self-reports) to make our best estimate. They agree with your approach: it's the best heuristic we have, even if it's noisy.
  2.  **The Ordinalists:** Standard economists argue that utility is **ordinal** (I prefer A over B), not **cardinal** (I prefer A twice as much as B). They argue that because we can't observe the "magnitude" of desire, any math done on it is scientifically meaningless.
  3.  **The Measurement Theorists:** This is the modern middle ground. They argue interpersonal comparison is not *impossible*, but it is **empirically underdetermined**. We can make probabilistic estimates (like a confidence interval on a metric), but we cannot claim the numbers are "true" in a physical sense.

  ### The EA Consensus
  Effective Altruists generally take the **pragmatic engineering view** you described, despite the philosophical baggage.
  *   They use **DALYs** (Disability-Adjusted Life Years) and **QALYs** (Quality-Adjusted Life Years). These are literally attempts to create a normalized 0–1 scale for health utility across different people.
  *   They acknowledge these are imperfect models (like any software model), but they argue that **doing the math with imperfect data is better than doing no math at all.**

  ### Summary
  You aren't wrong that the *method* is sound for decision-making. You are running into the difference between **ontology** (what is truly true about the universe) and **epistemology** (what we can measure and know).

  *   **Engineers** care about: "Does this heuristic help us ship better features?" (Yes.)
  *   **Philosophers** care about: "Is there a fact of the matter that makes Person A's joy objectively equal to Person B's joy?" (Unknown/Unprovable.)

  Economists treat it as a mystery because they are obsessed with **revealed preference** (watching what you do) rather than **stated preference** (listening to what you say), because people lie to themselves and others. But in the EA community, your intuition is actually the driving force: we normalize the best data we have (surveys, neurology, economic behavior) and act on the average, accepting the margin of error.

  **TL;DR:** Your normalization trick is exactly what welfare economists try to do, but they struggle because humans don't have a standardized "utility API," we can't verify the "0" and "1" bounds, and we can't stop people from gaming the inputs. EA proceeds by treating it as a "best effort" estimation problem rather than a solvable equation.
