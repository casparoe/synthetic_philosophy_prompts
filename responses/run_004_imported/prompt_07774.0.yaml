          *   *Technical core (simplified):* If $A$ and $B$ are both false and logically independent, the set of true consequences of $A$ and the set of true consequences of $B$ cannot be ordered by inclusion in the required way. Specifically, if $A$ is false, it implies some false statement $f$. But it also implies $f \lor t$ (where $t$ is any true statement). This mixes truth and falsity content inseparably.
          *   *The "Plain English" version:* Popper tried to separate the "true parts" of a false theory from the "false parts." Miller and Tichý proved that for false theories, you *can't* separate them cleanly enough to compare them. If Theory A is false, its "truth content" and "falsity content" are so intertwined that you can't say it has *more* truth and *less* falsity than Theory B. In fact, under Popper's definition, *no* false theory can be closer to the truth than any *other* false theory. They are all equally "uncomparable."

