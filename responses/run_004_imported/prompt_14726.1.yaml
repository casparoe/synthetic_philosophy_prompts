answer: |-
  **Setting:** *A seminar room at 5:30 PM. The workshop on "Normative Foundations of Cooperative Games" has just ended. Most attendees have left for the reception. ELENA (Nash proponent) and MARCUS (Kalai-Smorodinsky proponent) remain at the whiteboard. Markers are in hand. A half-erased diagram of a feasible set $S$ remains on the board.*

  **Marcus:** (Tapping the board) You glossed over the monotonicity slide, Elena. I saw three people in the front row frown. You know why.

  **Elena:** (Capping a red marker) Because they're first-years who think "more options" must mean "better outcome." It's a natural intuition, Marcus, but it's not a logical necessity.

  **Marcus:** It's not just intuition. It's a basic requirement of fairness. If the feasible set expands in my favor—my maximum possible payoff goes up, yours stays fixed, and you lose nothing in terms of your own maximum—how can the solution award *me* less? That's what Nash does.

  **Elena:** That's what the *Nash Product* does. There's a difference. Let's use the merger example from the talk. Firm A is the innovator, Firm B is the scaler. Disagreement point is zero.

  **Marcus:** Fine. Initial set $S_1$. Symmetric. Max payoff for A is 100, for B is 100. The frontier is the line $u_A + u_B = 100$.

  **Elena:** (Drawing a line) Nash solution is $(50, 50)$. Kalai-Smorodinsky is $(50, 50)$. We agree here. Now, suppose Firm A discovers a secondary patent application. It doesn't guarantee success, but it expands their *potential* upside. The new set $S_2$ contains $S_1$. A's ideal point moves to 120. B's stays at 100.

  **Marcus:** (Drawing a new frontier curving outward for A) Exactly. In $S_2$, my ideal point is higher. The KS solution draws a line from $(0,0)$ to $(120, 100)$. Wherever that ray hits the frontier, $u_A$ must be greater than 50. I gain because my potential gained. That's Individual Monotonicity. It says: if the pie grows specifically in my slice's direction, I shouldn't be punished for it.

  **Elena:** But look at the curvature, Marcus. Suppose the new technology makes A's payoff more "expensive" for B to subsidize in the middle range. The frontier bulges, but the slope at the Nash solution changes. In $S_2$, the tangent that maximizes the area of the rectangle $u_A \cdot u_B$ might shift to, say, $(48, 54)$.

  **Marcus:** (Stops drawing) See? A's potential went up. A's actual payoff went *down*. B gets a bonus just because A got a new patent? That's perverse.

  **Elena:** Is it? Or is it that B's *marginal concession* has become more valuable? Nash bargaining isn't about dividing potential; it's about balancing marginal utility losses. In $S_2$, for B to give up a unit of utility, A gains *more* than before in certain regions, but the *rate* at which they trade off near the agreement point has shifted. The Nash solution respects the local trade-off, not the global bound.

  **Marcus:** But that local trade-off is sensitive to "irrelevant" alternatives in the upper bound! You're telling the students that if I show you I *could* get 120, but the geometry of the surplus shifts slightly, you might give me 48 instead of 50? That incentivizes hiding your true capacity.

  **Elena:** No, it incentivizes understanding that bargaining power comes from the *cost* you impose on the other party at the margin, not your utopian ceiling. If your new patent makes the surplus harder to split efficiently near the center, the solution reflects that friction. IIA—Independence of Irrelevant Alternatives—protects us from this. If we agree on $(50,50)$ in $S_2$, and then we realize, "Wait, that 120 upside was illusory," and we shrink back to $S_1$, the deal shouldn't change. We didn't choose the 120 options. Why should their existence dictate the split of the 100?

  **Marcus:** (Turns to the board, erases the expansion) Okay, let's flip it. That's your IIA defense. Let's test it.

  *Marcus draws a new set $S_3$. It looks like the previous $S_2$, but he chops off the top corner.*

  **Marcus:** Same merger. A's max is 120. B's max is 100. The KS solution is at point $K$, somewhere along the ray to $(120, 100)$. Now, suppose a regulator steps in. They say, "Firm B, you are capped at 90. No payoff above 90 is legal."

  **Elena:** And is the Nash solution in the region above 90?

  **Marcus:** No. The Nash point is at $(55, 55)$. It's still feasible. Under your axioms, the solution stays at $(55, 55)$. The regulation is irrelevant.

  **Elena:** Because it binds nowhere near the agreement. It's a phantom constraint.

  **Marcus:** But it changes the *Ideal Point*. B's utopia drops from 100 to 90. The KS ray now goes from $(0,0)$ to $(120, 90)$. It's steeper. The new KS solution gives *more* to A and *less* to B.

  **Elena:** (Frowning slightly) So B loses payoff because a regulator removed options B wasn't going to take anyway? That sounds like punishment for a constraint that didn't bind.

  **Marcus:** It's not punishment. It's a shift in relative claims. Bargaining is about dividing the *gains* relative to the *possible gains*. If B's maximum possible gain shrinks, B's claim on the surplus weakens proportionally. The "Ideal Point" isn't a phantom, Elena. It's the measure of the stakes. If I walk into a negotiation knowing I could theoretically get 100, I bargain harder than if I know the hard cap is 90, even if we settle at 50. The *range* of the game defines the tension.

  **Elena:** That's psychological, not axiomatic. You're importing a dynamic story into a static model. In the static model, if the point $(55, 55)$ was optimal in the larger set, and it's still available in the smaller set, why would rational agents move?

  **Marcus:** Because the *justification* for $(55, 55)$ was that it balanced the ratio of satisfaction. "I get 55% of my max, you get 55% of your max." If your max drops, keeping the same absolute payoff means you're getting a higher *percentage* of your potential than I am. KS preserves equal relative satisfaction. Nash preserves equal marginal rates of substitution.

  **Elena:** (Paces away from the board) But that means your solution is manipulable. If I'm Firm B, and I know you use KS, I can artificially inflate my ideal point. I can add a "dummy option" to the feasible set—a lottery that gives me 1,000 with probability 0.001. It doesn't change the efficient frontier near the solution. It barely changes the expected utility. But it shoots my ideal point to 1,000.

  **Marcus:** (Pauses) It changes the ray.

  **Elena:** Exactly. I can shift the solution in my favor by adding "irrelevant" utopias that we both know will never be chosen. IIA prevents that gaming. It says: if you add an option that neither of us would ever select at the current prices, the deal shouldn't move. It ensures the solution depends only on the local geometry of the agreement, not the distant boundaries.

  **Marcus:** (Leans against the desk) And your solution allows the "Monotonicity Paradox." I improve my position—my set expands strictly in my favor—and I get less. You call that "local geometry." I call it unstable. If a student asks me, "Why did Firm A lose money when they got a new patent?" and I say, "Because the curvature of the surplus set shifted the Nash Product tangent," they'll think economics is broken.

  **Elena:** And if I tell them, "Firm A lost money because Firm B's legal cap was lowered, even though Firm A's payoff was below that cap," they'll think *you're* broken.

  *Silence hangs for a moment. The hum of the projector fan is audible.*

  **Marcus:** (Softly) We're not arguing about math. We agree on the math. We're arguing about what the "Ideal Point" represents.

  **Elena:** (Nods slowly) I treat the feasible set as a menu of concrete contracts. The solution is the one contract that maximizes the joint gain product. The boundaries only matter insofar as they shape the frontier near the optimum.

  **Marcus:** And I treat the feasible set as a space of *claims*. The Ideal Point is the anchor for those claims. If you shrink my space of claims, even at the top, you weaken my anchor. You think IIA is about consistency. I think it's about blindness to the scale of the conflict.

  **Elena:** And you think Monotonicity is about fairness. I think it's about conflating "opportunity" with "entitlement." Just because I *could* get more doesn't mean I *should* get more, if giving me more costs the other party disproportionately in the new set.

  **Marcus:** (Picks up the eraser but doesn't use it) So, for the first-years...

  **Elena:** We tell them Nash assumes the bargaining power is determined by the marginal cost of concession at the agreement point. It's a "spot" theory of fairness.

  **Marcus:** And KS assumes bargaining power is determined by the relative distance from the worst case to the best case. It's a "range" theory of fairness.

  **Elena:** (Walks back to the board, draws a dot at the Nash solution) If you believe the options nobody chose shouldn't haunt the deal...

  **Marcus:** (Draws a line from origin through the Ideal Point) ...then you're with me. If you believe the deal should stand even if the horizon shrinks, as long as the ground beneath your feet hasn't moved...

  **Elena:** ...then you're with me.

  **Marcus:** (Caps his marker) Neither of us is going to concede IIA is wrong.

  **Elena:** And neither of us is going to concede Monotonicity is optional.

  **Marcus:** No. But maybe the lesson isn't which axiom is "true." Maybe it's that "Fairness" isn't a single point in the set. It's a choice of which properties you're willing to violate.

  **Elena:** (Smiles faintly) "Axiomatic bargaining is the study of which intuitions you're willing to sacrifice for consistency."

  **Marcus:** That's going to make the students very uncomfortable.

  **Elena:** Good. They're PhD students. They should be uncomfortable.

  **Marcus:** (Gestures to the door) Coffee?

  **Elena:** Sure. But you're buying. Your ideal point for the budget is higher than mine.

  **Marcus:** (Laughs) Careful. That's a monotonicity argument. I might walk away with less coffee if the shop runs out of beans.

  **Elena:** Then it's a good thing we're not bargaining over the coffee. Let's just split the bill. Nash style.

  **Marcus:** 50-50?

  **Elena:** 50-50.

  *They turn off the lights and leave the whiteboard covered in conflicting geometries.*
