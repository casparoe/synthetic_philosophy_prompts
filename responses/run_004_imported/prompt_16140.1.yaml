answer: |-
  This is a sharp observation. You've hit on a tension that legal scholars and historians still wrestle with: the difference between **textualism** (what the words say) and **originalism** (what the words meant to the people who wrote/ratified them).

  You are correct that Douglass's mature position was a specific kind of textualism that explicitly rejected the "original intent" of the 1787 framers when that intent conflicted with the plain text's commitment to liberty.

  If we look strictly at the *interpretive methodology*—how Douglass believed a judge or citizen should derive meaning from the Constitution—versus how modern originalists (like Scalia, Thomas, or Barnett) approach it, Douglass would likely be **deeply skeptical of modern originalism regarding the 1787 Constitution, but a fierce proponent of it regarding the Reconstruction Amendments.**

  Here is the breakdown of that interpretive clash.

  ### 1. Douglass on the 1787 Constitution: Anti-Originalist Textualism
  In his 1860 speech, *"The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?"*, Douglass makes a move that is almost the inverse of modern originalism.

  Modern originalism generally posits that the Constitution's meaning is fixed at the time of ratification. If the "original public meaning" of "person" or "citizen" in 1787 excluded enslaved Black people (as the *Dred Scott* court ruled), an originalist must accept that exclusion as the legal reality until an Amendment changes it.

  Douglass rejected this. He argued that while the *framers* may have intended to protect slavery (historical intent), the *text* they produced did not explicitly grant that power (textual analysis). He famously noted that the words "slave" and "slavery" do not appear in the Constitution. He argued that because the Preamble declares the goal to "secure the Blessings of Liberty," any ambiguity in the text must be resolved in favor of liberty, not slavery.

  **The Interpretive Conflict:**
  *   **Modern Originalism:** "What did 'Liberty' mean to a white male voter in 1787?" (Answer: Often, not liberty for Black people.)
  *   **Douglass:** "What does the word 'Liberty' mean in the abstract, and does the text authorize the government to violate it?" (Answer: The text grants no power to enslave, therefore slavery is illegal.)

  Douglass treated the Constitution as a **living instrument of natural law**. He believed the text contained principles that were *better* than the men who wrote them. He essentially argued that the text should be read to fulfill its highest moral potential, not its lowest historical compromise.

  If Douglass looked at modern originalism, which often seeks to anchor rights to historical traditions or understandings (e.g., arguing that because abortion wasn't recognized in 1868, it's not a right), he would likely see it as a tool to **freeze injustice in place.** He rejected the idea that the "dead hand of the past" (the pro-slavery framers) should dictate the interpretation of the text when the text itself allowed for a freer reading.

  ### 2. Douglass on the 14th Amendment: Radical Originalism
  However, the picture flips when you move to the Reconstruction Amendments (13th, 14th, 15th). Here, Douglass becomes what we might call a "Reconstruction Originalist."

  After the Civil War, Douglass argued that the 14th Amendment had fundamentally reset the Constitution. He insisted that the text of the 14th Amendment ("equal protection," "privileges or immunities") must be enforced **exactly as written**, regardless of local customs or prior state laws.

  In the *Slaughter-House Cases* (1873) and the *Civil Rights Cases* (1883), the Supreme Court narrowed the scope of the 14th Amendment, effectively deferring to state intent and historical federalism. Douglass was furious. He argued that the **original meaning of the Reconstruction Amendments** was to create a national citizenship with full equality, and that the Court was betraying the text.

  In this specific context, Douglass aligns with originalism: He believed the meaning of the Constitution was fixed at 1868 to mean **full racial equality**, and that subsequent generations (including judges) had no right to narrow that meaning based on "tradition" or "state rights."

  ### 3. The Verdict on Methodology
  So, would he support originalism today? It depends on *which* originalism.

  **He would reject "Founders Originalism."**
  If originalism is used to say, "The 1787 understanding of federal power limits the civil rights state," or "The 1787 understanding of arms allows for X but not Y," Douglass would likely view this as idolizing the framers' compromises. He spent his career arguing that the framers were fallible men who made a deal with slavery, and that the text was the only thing that could save the republic from their sin. Binding the Constitution to their specific historical understanding would, in his view, bind the nation to their racism.

  **He would support "Reconstruction Originalism."**
  There is a school of thought today (championed by scholars like Akhil Amar or John Bingham biographers) that argues the 14th Amendment "second founded" the republic. This view holds that the original meaning of the 14th Amendment was radical and expansive. Douglass would be a devotee of this. He would argue that the **original public meaning of 1868** trumps the **original public meaning of 1787**, and that judges should strike down any law that violates the plain text of the 14th Amendment, regardless of historical state practices.

  ### The Core Philosophical Difference
  The deepest friction lies in the purpose of interpretation.

  *   **Modern Originalism** is often about **constraint**. It seeks to limit judges from imposing their own values by tethering them to history.
  *   **Douglass's Interpretive Method** was about **emancipation**. He used the text to *unlock* rights that history had denied.

  Douglass famously said, *"I interpret the Constitution as I would interpret a commercial contract."* But he also believed that contract was signed on behalf of "We the People," and that enslaved people were part of that "People" by natural right, even if the 1787 voters didn't think so.

  If modern originalism says, "We must follow the understanding of the ratifiers," Douglass asks, "**Which ratifiers?** The ones who protected slavery in 1787, or the ones who abolished it in 1868?"

  ### Conclusion
  Douglass would likely view modern originalism as **methodologically dangerous if applied to the 1787 Constitution**, because it privileges the intent of men who compromised with slavery. He would argue that the text's silence on slavery was a deliberate loophole for *freedom*, not a historical artifact of *oppression*.

  However, he would embrace originalism as a weapon **if applied to the 14th Amendment**. He would demand that the "original meaning" of Equal Protection be enforced with the full radicalism of the Reconstruction Congress, without judicial narrowing.

  In short: He wouldn't be an originalist about the **Founders**, but he would be a fanatic originalist about the **Reconstruction**. Since modern originalism often conflates the two (treating the 1787 structure as sacrosanct), Douglass would likely find the philosophy too conservative for his tastes, viewing it as a way to let the "ghosts of the slaveholders" continue to vote from the grave.
