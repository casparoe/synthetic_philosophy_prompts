answer: |-
  This is a fantastic question because it cuts right to the heart of how we understand human behavior, and you are right to feel that your partner's "economics joke" is an oversimplification.

  The short answer is: **No, you are not logically contradicting yourself, and no, "what you choose" and "what you prefer" are not always the same thing.**

  Your partner is using a concept from **Standard Neoclassical Economics** called *Revealed Preference Theory*. You are describing a phenomenon studied in **Behavioral Economics** and **Psychology** known as *Time Inconsistency* or *Intra-personal Conflict*.

  Here is the logical breakdown of why your intuition is correct, why her economic model is failing here, and what the act of "giving away the charger" actually proves.

  ### 1. The Partner's Argument: Revealed Preference
  Your partner is arguing from the standpoint of *Revealed Preference Theory* (developed by Paul Samuelson in the 1930s). The core axiom is simple: **We cannot see inside your head, so we must define your preferences solely by your actions.**

  *   **The Logic:** If you choose Option A (Phone) over Option B (Partner), you have revealed that, at that moment, Option A provides more "utility" (satisfaction/value) than Option B.
  *   **The Conclusion:** Therefore, saying you "prefer" the partner is false because your actions reveal the opposite.

  In a world of perfectly rational robots, she would be right. If a robot chooses the phone, it is because its programming values the phone more. But humans are not perfectly rational agents with a single, consistent "utility function."

  ### 2. Your Counter-Evidence: The Ulysses Pact
  You mentioned something crucial: *"I've actually tried stuff like giving her my charger before bed or deleting the apps for a week specifically because I don't want to keep picking the phone."*

  In economics and game theory, this is called a **Pre-commitment Strategy** (often referred to as a **Ulysses Contract**, based on the myth where Odysseus tied himself to the mast to resist the Sirens).

  **This action logically disproves the idea that your choice equals your preference.**

  Here is the proof:
  1.  **Time 1 (Afternoon/Evening):** You are calm, rational, and thinking long-term. You value connection with your partner. You recognize that the phone will tempt you. You voluntarily restrict your future freedom (giving away the charger) to ensure you do what you *prefer* (watching the movie).
  2.  **Time 2 (On the Couch):** You are tired, seeking dopamine, and thinking short-term. The impulse for the phone overrides the long-term goal. You choose the phone.

  If your "choice" on the couch was your *true* preference, **you would never have tried to restrict yourself in the afternoon.** The fact that you tried to bind your future self proves that your "Planning Self" prefers the movie, but your "Impulsive Self" prefers the phone.

  ### 3. The Logical Concept: Time Inconsistency
  The logical framework that explains your situation is called **Hyperbolic Discounting** or **Time Inconsistency**.

  *   **Standard Econ (Partner's view):** Assumes we discount the future at a constant rate. (e.g., I value tomorrow 5% less than today).
  *   **Behavioral Econ (Your reality):** We discount the *immediate* future massively.

  When the movie is an hour away, it feels valuable. When the movie is happening *now*, but the phone offers a hit of dopamine *instantly*, the "cost" of putting the phone down feels incredibly high in that specific second.

  This means you have **two different utility functions** operating at different times:
  1.  **Global Preference:** "I value my relationship and shared memories." (This is your long-term preference).
  2.  **Local Preference:** "I value relief from boredom/stress right now." (This is your short-term preference).

  When these two conflict, the Local Preference often hijacks the controls. That doesn't mean the Global Preference isn't real; it just means it lacks executive control in the moment.

  ### 4. Is it Hypocrisy?
  You asked if this makes you a hypocrite. Logically, **no.** Hypocrisy implies deceit—claiming to hold a value you *know* you don't hold.

  What you are experiencing is **Akrasia** (a Greek philosophical term meaning "weakness of will" or "acting against one's better judgment").

  *   **Hypocrite:** "I don't actually care about movies, I just say I do to make you happy."
  *   **Akratic:** "I genuinely care about movies more, but I lack the self-control to execute that preference when tempted."

  The fact that you feel bad about it, and the fact that you try to engineer your environment to stop it (deleting apps), proves you are not a hypocrite. You are a person struggling with self-regulation.

  ### 5. Who is "Right"?
  Logically, **you are right** that your preferences and choices can come apart. Her economic model is too simple to capture human psychology.

  However, **emotionally, she is also right** about the impact.

  Here is the trap: While your *internal logic* is sound (you do prefer her, you just lack control), the *external result* is the same as if you didn't prefer her. To her, sitting on the couch alone while you scroll, the "Revealed Preference" is all she can see. She cannot feel your "Global Preference"; she can only see your "Local Choice."

  ### How to Resolve the Argument
  You can use this logic to stop the fight, but you have to be careful not to sound like you're making excuses.

  **Don't say:** "You're wrong about economics. I have time-inconsistent utility functions."
  **Do say:** "I looked into that economics concept you mentioned. It's called Revealed Preference. But there's a flaw in that model for humans. It assumes we don't struggle with self-control. The fact that I keep trying to give you my charger or delete apps is proof that my *long-term* preference is you, but my *short-term* brain is hijacking the controls. I'm not choosing the phone because I like it more; I'm choosing it because I'm failing to stick to what I actually want."

  **The Solution:**
  Since you now know this is a **system failure** rather than a **preference failure**, stop relying on willpower. Willpower is a finite resource that is depleted by evening.
  *   **Physical Barriers:** Keep the phone in another room during movie time. Not just "off," but *gone*.
  *   **Rituals:** Create a specific start ritual for movies that makes pulling out the phone a break in the flow.
  *   **Acknowledge the Hurt:** Validate her. "I know my actions make it look like I don't care. I'm sorry that my lack of self-control feels like rejection to you. I am trying to fix the mechanism, not just the promise."

  ### Summary
  *   **Logic:** Choice $\neq$ Preference when self-control is involved.
  *   **Evidence:** Your attempts at pre-commitment (chargers/apps) prove your "true" preference is the movie, even if your "momentary" choice is the phone.
  *   **Verdict:** You are not a hypocrite; you are experiencing a conflict between your Planning Self and your Impulsive Self.
  *   **Action:** Admit the mechanism is broken, validate her feelings, and rely on environmental constraints rather than willpower.

  You aren't lying to her. You're just fighting a brain chemistry battle that standard economics doesn't account for.
