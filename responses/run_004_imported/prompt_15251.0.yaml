      *   *Goal:* Democratic access to knowledge ("The word divides, the picture unites"). Physicalism. Anti-metaphysical.
      *   *Key Concept:* Transformation of statistics into visual memory aids.

  4.  **Compare the Two Notions of "Picture":**
