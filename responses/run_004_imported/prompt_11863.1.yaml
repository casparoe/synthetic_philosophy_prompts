prompt: |-
  Me and my friend Theo spent basically our whole dinner arguing about Frankfurt cases and neither of us budged, so now I'm turning to you instead. He's convinced that the classic Black-and-Jones setup never actually gets rid of the "could have done otherwise" requirement (PAP, the principle of alternative possibilities), because of the dilemma Widerker and Ginet ran against it: for Black to know when to step in, there has to be some prior sign that reliably indicates what Jones is about to do, and then either the sign causally guarantees Jones's decision (so you've smuggled in determinism to "prove" that determinism isn't needed for responsibility) or it doesn't guarantee it (so Jones could, in the relevant sense, show the sign and still decide otherwise, and the alternative possibility PAP wants is back). I kept insisting the buffer-case versions — the Mele-and-Robb style setups where there's a deterministic backup running on its own timer in a seperate channel that's causally sealed off from Jones until a cutoff point, rather than something that's reading Jones for a sign — dodge the whole dilemma, since there's no sign doing predictive work anymore. We never sorted it out, we just got to the check still going at it.

  Below are the notes I typed into my phone in the cab home, trying to actually pin down my own position instead of just repeating "buffer cases fix it" at Theo. I'd like your honest comments on them — especially on whether I'm being fair to both sides, and on the worry at the end, which is the part I feel least sure of: 'The dilemma only bites setups where whatever plays Black's role has to detect, in advance, which way Jones is leaning. Buffer/blockage cases remove that requirement, so the sign-based dilemma doesn't get any grip on them. But if the backup process in a buffer case isn't reading Jones at all, what guarantees it produces the very same decision Jones would've reached on his own, rather than some other action? If that's just stipulated, the case starts to feel less like a real counterexample to PAP and more like a rigged coin that happens to land right every time; and if instead there's some mechanism ensuring the two match, that mechanism is functioning exactly like a prior sign, so doesn't the dilemma's second horn just walk back in — couldn't Jones, atleast in the relevant sense, have decided differently regarding whether the match holds?'

  So: is that a fair-ish summary of the Widerker/Ginet dilemma and the buffer-case reply, or have I strawmanned somebody along the way? Is the "matching" worry I end on an actual recognized problem for these cases (with a name I should know, and maybe a standard reply already worked out), or is it a confusion on my part about what these thought experiments are even supposed to establish? And is there a tighter way to lay out the whole dilemma than Theo and I managed to after a bottle of wine?
