          *   *Actually, the deeper issue:* The "order dependence" usually cited against JC arises because the *input* for JC isn't just the new probability $P(E)$, but the *experience* that caused it. If Witness A makes me 80% sure, and Witness B makes me 90% sure, treating these as simple JC updates can lead to double-counting or order effects if the "distance" traveled isn't accounted for.
