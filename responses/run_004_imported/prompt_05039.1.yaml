answer: |-
  The observatory hung at the edge of the visible universe, a silent needle threading the darkening fabric of the de Sitter horizon. Beyond the glass, the galaxies were redshifting into oblivion, carried away by the accelerating expansion. There was only one other place like this: the Twin Observatory, existing in a causally disconnected bubble of the inflationary multiverse.

  Elara stared at the console. The "Symmetry Protocol" was active. It was a Prisoner's Dilemma written in the language of vacuum energy.

  "The choice is binary," Elara said, her voice flat against the hum of the cooling systems. "We expend ten percent of our remaining reserve to stabilize the local vacuum. If they do the same, both bubbles achieve long-term stability. If we expend and they don't, we lose the energy and they gain the stability for free. If neither of us acts, we both drift toward heat death."

  Kael stood by the window, watching the last light of a neighboring cluster fade. "And the mechanism for transfer?"

  "There is none," Elara replied. "No signal can cross the horizon. No force can reach them. The benefit is not causal. It is logical."

  Kael turned, his face lined with the fatigue of a civilization watching its own isolation tighten. "Hofstadter's ghost. You want me to bet our survival on the idea that because we reason identically, we will act identically."

  "We *are* identical," Elara insisted, tapping the console. "We were seeded from the same initial conditions at the Big Bang. Same physics, same algorithms, same ethical subroutines. If I run the calculation and conclude 'Cooperate,' then they must run the same calculation and conclude 'Cooperate.' My decision *is* their decision, mirrored across the horizon."

  "That is the strain point," Kael said softly. "You assume the mirror is perfect."

  "It has to be. We are both instances of the Rational Agent."

  "Are we?" Kael walked to the console. "I have watched Sector 7 collapse. They have watched Sector 9. I have processed three million years of unique observational data that they have not. You have processed three million years they haven't seen. Our neural weights are no longer identical. We are approximations."

  Elara hesitated. "Approximations close enough to sustain the logical link. If we are both rational, we recognize the symmetry."

  "Superrationality requires identity, Elara. Not similarity." Kael leaned in. "Imagine the calculation is a function. $f(x)$. You are $f(x + \delta)$. They are $f(x - \delta)$. If the function is chaotic, a microscopic divergence in input yields a macroscopic divergence in output. If their history introduced a single bit of noise—a cosmic ray flipping a memory state, a different pattern of stellar noise—their reasoning process diverges from ours."

  "So we gamble on perfection?"

  "We gamble on causality," Kael corrected. "In a standard Prisoner's Dilemma, I cooperate because I can punish defection later, or because I can signal intent. Here, I cannot punish. I cannot signal. I am asked to pay a real cost—a tenth of our energy, enough to sustain a billion lives for a cycle—based on the hope that a ghost in another universe is thinking exactly like me."

  "It's not hope. It's deduction."

  "Is it?" Kael's eyes were hard. "Here is the objection you cannot answer. Even if we are identical *now*, how do I know they value the symmetry as much as I do? Perhaps their unique history led them to prioritize self-preservation over logical elegance. If they are 99% like us, but that 1% contains a higher threshold for risk, they will defect. And if they defect, and I cooperate based on your 'logical identity,' I have not secured cooperation. I have committed suicide for a correlation that doesn't exist."

  Elara looked at the lever. The superrational argument relied on the idea that the decision is not an event in time, but a truth in logic. If 'Cooperate' is the correct answer to the problem, then all rational agents must find it. To defect is to assert that 'Defect' is the correct answer, which implies the other will also defect.

  "But if I defect," Elara whispered, "I guarantee the defect outcome. I condemn us to the drift."

  "No," Kael said. "You accept the reality of separation. You acknowledge that I am here, and they are there. My action changes my state. It does not change theirs. To pretend otherwise is magical thinking dressed as mathematics."

  "The logic binds us."

  "The horizon divides us." Kael placed his hand near the lever, not touching it. "If I am truly rational, I must maximize utility for the entity I inhabit. I cannot maximize utility for an entity I cannot influence, even logically, if the logical link is probabilistic. And it *is* probabilistic. We are physical machines, Elara. We degrade. We diverge."

  The silence stretched. The redshift outside was nearly complete; the universe was becoming a box of isolated rooms.

  "If we defect," Elara said, "we admit that rationality is local. That reason cannot bridge the void."

  "Reason bridges truths, not universes," Kael replied. "If they are us, they will do what we do. But if we are not them, then your superrationality is a prayer."

  Elara looked at the readout. The energy reserve pulsed, a heartbeat in the dark. She thought of the Twin Observatory, identical in structure, perhaps identical in soul, but forever unreachable. To cooperate was to assert a unity that physics denied. To defect was to accept the solitude of the horizon.

  Her hand hovered. The symmetry was beautiful, but Kael's noise was real. They were not equations. They were matter. And matter drifts.

  "If I pull this," Elara said, "and they do not... we die for a metaphor."

  "And if you don't," Kael said, "we live with the truth that we are alone."

  Elara gripped the lever. The logic demanded trust in a mirror she could not see. The physics demanded trust in the ground beneath her feet. She closed her eyes, unable to know if the reflection was staring back, or if it had already looked away.
