      *   *Wait, causal disconnection:* If they can't affect each other physically, how does the payoff work? Superrationality argues the *decision* is correlated, not the physics. So, if I decide to Pull, I predict you Pull. So the outcome is (Pull, Pull).
      *   *The Twist:* The skepticism must be about the *identity* of the reasoning.

  4.  **Developing the Characters:**
      *   **Elara:** The Proponent. Believes in the logical mirror.
      *   **Kael:** The Skeptic. Needs the hard objection.
