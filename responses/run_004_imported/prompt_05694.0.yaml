answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Rescue Name]
  **FROM:** [Your Name], Board Member & Foster Coordinator
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Live Release Rate Target & Grant Eligibility

  ### **Executive Summary & Recommendation**

  I recommend that the Board **adopt a modified version of the Live Release Rate (LRR) commitment.**

  Specifically, I propose we formally commit to the 90% target required to secure the national matching grant, **conditional on the simultaneous adoption of three internal safeguard policies.** These safeguards are designed to prevent "metric gaming" while preserving the financial benefits of the grant. Furthermore, I recommend that the Director's bonus structure be tied to a **Balanced Scorecard** rather than the LRR alone, piloted for a **12-month period** before being made permanent.

  This approach allows us to secure vital funding and accountability without compromising our ethical obligation to the most vulnerable animals in our community.

  ### **The Opportunity: Why the Director is Right**

  I want to start by validating the Director's proposal. Our financial position is precarious, and this matching grant represents a transformative opportunity for our capacity. She is also correct that "good intentions" are difficult to measure. Without a concrete metric, it is hard to evaluate our performance, justify our overhead to donors, or hold leadership accountable.

  A 90% Live Release Rate is an industry-recognized standard for "no-kill" status. Committing to this publicly signals professionalism and ambition. It gives us a rallying point. Rejecting the target outright would likely cost us the grant and stall our growth. We need this money, and we need to strive for excellence.

  ### **The Risk: Goodhart's Law in Practice**

  However, committing to a single number as the *primary* driver of funding and compensation introduces a systemic risk known as **Goodhart's Law**. In short: *When a measure becomes a target, it ceases to be a good measure.*

  This is not a question of integrity; it is a question of human psychology and incentive structures. Even the most ethical organizations, under pressure to hit a specific number, will unconsciously begin to optimize for the number rather than the underlying mission.

  We have already seen a preview of this dynamic within our own volunteer base. Two years ago, a volunteer coordinator steered a dog with a severe bite history into a "foster" placement specifically to avoid logging it as a shelter euthanasia. The dog was not safe for adoption, but moving it off the books protected our statistics. No one involved believed they were lying; they believed they were protecting the shelter's reputation.

  If we tie the Director's bonus and our public reputation strictly to a 90% LRR without guardrails, we risk normalizing three behaviors:
  1.  **Cherry-Picking Intake:** subtly turning away older, sicker, or behaviorally complex dogs to keep the denominator "safe."
  2.  **Reclassification:** Labeling euthanasias as "foster transfers" or "medical outcomes" to keep them off the LRR ledger.
  3.  **Prolonged Suffering:** Keeping animals in care longer than is humane to avoid an end-of-life decision that would tank the monthly metric.

  None of these require malice. They require only a desperate desire to hit the target that pays the bills.

  ### **The Solution: A Modified Implementation Plan**

  We can have the funding and the accountability without the perverse incentives. I propose we vote to approve the grant commitment **contingent on the following three board policies:**

  **1. Standardized Outcome Definitions (Immediate Adoption)**
  We must adopt a strict, written definition of "Live Release" aligned with the Asilomar Accords or similar national standards. We cannot allow internal flexibility on what counts as a "save." A transfer to foster for the purpose of avoiding euthanasia logging must be explicitly categorized as an outcome of "unadoptable/untreatable" if the animal is not expected to be placed. Transparency protects us more than a inflated number.

  **2. The "Open Intake" Safeguard**
  To prevent cherry-picking, we must commit to a minimum intake volume or a specific mandate regarding "hard to place" animals (e.g., seniors, special needs). If our LRR goes up, but our total intake of high-risk dogs goes down, the metric is meaningless. We need to measure *lives saved*, not just *survival rates*.

  **3. Balanced Scorecard for Compensation (12-Month Pilot)**
  I recommend we approve the Director's bonus structure, but modified for a **12-month pilot period**. Instead of 100% of the bonus relying on the 90% LRR, it should be split:
  *   **50% on Live Release Rate:** Incentivizing saving lives.
  *   **25% on Intake Volume/Demographics:** Incentivizing taking the animals who need us most.
  *   **25% on Community Engagement/Volunteer Retention:** Incentivizing long-term health and preventing burnout.

  After 12 months, the Board will review the data. If we hit the 90% without a drop in intake of hard cases, we can consider making the structure permanent. If we see intake shifting toward "easier" dogs, we adjust.

  ### **Conclusion**

  We are all here because we love dogs. But love is not a management strategy. By adopting these guardrails, we acknowledge that we are human and that systems influence behavior.

  If we adopt the 90% target *as proposed*, we risk becoming an organization that looks successful on paper but turns away the dogs who need us most in practice. If we adopt the **Modified Implementation Plan**, we secure the grant, provide the Director with clear goals, and ensure that our metrics serve our mission, rather than the other way around.

  I move that we approve the grant commitment conditional on the adoption of the Standardized Outcome Definitions and the 12-Month Balanced Scorecard Pilot for executive compensation.
