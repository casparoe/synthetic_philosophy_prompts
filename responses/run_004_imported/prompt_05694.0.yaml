      *   **Goal:** A memo to the board with a *specific recommendation* (Adopt, Reject, or Modify + Timeframe). It must be persuasive, not wishy-washy. It must respect the Director's argument (need money, need accountability) while highlighting the risks of metric fixation.
      *   **Tone:** Professional, respectful, data-informed, mission-driven, firm but collaborative.

