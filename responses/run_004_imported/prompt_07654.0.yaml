      *   **Constraint/Challenge:** Cannot claim "she always told the truth" (reporters would laugh/cynicism). Cannot be cynical about spin (family would be hurt/confused).
      *   **Intellectual Framework:** Hannah Arendt's "Truth and Politics" (specifically regarding lying, factual truth vs. political image, and self-deception).
      *   **Goal:** A 4-5 minute toast that uses Arendt's framework *as the praise*, not just as a hidden code. It needs to honor Marion's integrity within the inherently messy world of political communications.
      *   **Tone:** Respectful, nuanced, warm, slightly intellectual but accessible, honest.

  2.  **Deconstruct Arendt's "Truth and Politics":**
      *   *Key Concept 1:* Factual Truth vs. Political Opinion. Factual truth is stubborn; it just *is*. Political opinion is fluid.
      *   *Key Concept 2:* The "Lie." Politicians/spin doctors often try to reshape facts to fit a narrative.
      *   *Key Concept 3:* The Danger. When facts are erased, the common ground for discourse disappears.
      *   *Key Concept 4:* The Integrity of the Witness. Even in politics, there are those who hold the line on what actually happened, even if they can't say everything.
      *   *Application to Marion:* She wasn't a saint who spilled every bean. But she was a guardian of *reality* within the machine. She knew the difference between a story and a fact. She didn't let the machine consume her own ability to distinguish the two.

  3.  **Determine the Angle for the Toast:**
      *   *Avoid:* "She never lied." (False)
      *   *Avoid:* "She was a master of spin." (Too cynical for family)
      *   *Adopt:* "She understood the weight of words." "She protected the boundary between what we wish were true and what *is* true." "She treated the public's trust as a factual asset, not just a polling number."
      *   *The Arendt Connection:* Arendt worries that political lying destroys the capacity for action. Marion's career shows that you can survive in politics without destroying that capacity. She maintained a "factual core."

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the room's split nature (Press vs. Family). Establish the speaker's newness vs. Marion's tenure.
      *   **The Hook (Arendt-lite):** Introduce the difficulty of the job without using jargon. Talk about the "gap" between reality and perception.
      *   **The Core Argument:** How Marion navigated this. She didn't just manage images; she managed *trust*. Trust requires a baseline of fact.
      *   **Specific Praise (The "How"):** She knew when to speak and when to hold. She knew that a lie today is a crisis tomorrow. She taught the speaker that the job isn't to make the Mayor look good, but to make the Mayor *understandable*.
      *   **Addressing the Family:** Explain why this matters to them. Her integrity at work means she's the same person at home. No double life.
      *   **Addressing the Press:** A nod to the battles fought. They respect her because she was reliable, even when the news was bad.
      *   **Conclusion:** A wish for her retirement. A return to simple truths (no spin needed).

  5.  **Refining the Tone (The "Arendtian" Weave):**
      *   *Challenge:* Don't quote Arendt directly. It's a toast, not a lecture. Use the *concepts*.
      *   *Phrasing:* Instead of "factual truth," use "the ground beneath our feet." Instead of "political lying," use "the temptation to rewrite the story."
      *   *Key Line Idea:* "In a job where you are paid to shape the narrative, she never forgot that she couldn't shape the facts."

  6.  **Drafting - Iteration 1 (Mental Check):**
