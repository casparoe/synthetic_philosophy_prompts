      *   *Critique:* Is it too long?
      *   *Fix:* Keep sentences punchy. Aim for ~600-700 words for 4-5 minutes (speaking slowly).

  7.  **Drafting - Iteration 2 (Focusing on the Prompt's specific Arendt constraint):**
      *   The prompt asks for Arendt's framework to do the *work* of praising.
      *   Arendt says the liar needs a good memory to keep track of lies. Marion had a good memory, but for *facts*.
      *   Arendt says facts are tyrannical. Marion respected that tyranny.
      *   *Integration:* "She knew that facts are stubborn. You can argue with opinions, but you can't argue with a flooded basement or a budget deficit."

  8.  **Final Polish:**
