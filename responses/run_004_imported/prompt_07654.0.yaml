answer: |-
  Good evening, everyone.

  For those who don't know me, I'm [Your Name]. I've been in the Mayor's office for exactly two months and twelve days. I am, by every metric in this room, the rookie. And Marion is… well, Marion is the institution.

  When I was asked to speak tonight, I panicked a little. Mostly because I know who is sitting in this room. On my left, I see the press corps. People who have covered this city through three administrations, four scandals, and countless budget cycles. You know exactly what Marion's job entailed. You know the 2:00 AM calls, the drafts that got shredded, the art of the possible.

  On my right, I see Marion's family. Her mother, her husband, her kids. You know Marion as the person who comes home for dinner. The person who helps with homework. The person who, when asked what she does, says, "I help the Mayor talk to the city."

  Standing between these two groups, I realized I have a specific challenge. I cannot stand here and tell the reporters that Marion was a saint who never obscured a detail. You would laugh, and rightly so. That isn't the job. The job is politics.

  But I also cannot stand here and tell her family that her job was mostly about "managing perceptions" or "spinning narratives." Because that would sound like I'm saying she wasn't honest. And I know, having watched her for these last two months, that nothing could be further from the truth.

  So, I want to talk about what I think Marion actually did.

  There is a philosopher who wrote about this profession. She said that the danger in politics isn't just telling lies. The danger is when we start to believe that facts don't matter at all. That the only thing that matters is the story we tell about the facts. When that happens, we lose our common ground. We can't agree on anything anymore.

  In a world that constantly tries to blur the line between what *is* and what we *wish were true*, Marion was a guardian of the line.

  I have watched her in crisis meetings. I've seen the temptation to just make a problem go away with the right phrasing. It's the easy way out. It's the way to get through the 6:00 PM news cycle. But Marion always asked the same question: "If we say this today, can we stand by it when the facts come out tomorrow?"

  She understood that trust isn't a polling number. It's a factual asset. You can spend it, or you can save it, but you can't print more of it.

  To the reporters in the room: You respected her because she was reliable. When Marion said "I don't know," she didn't know. When she said "I can't answer that," there was a reason, and it wasn't just to hide something. She treated you as partners in the process of informing the public, not as enemies to be defeated. She knew that even when the news was bad, the city deserved to know the reality of it. She knew that a democracy cannot function if the people don't know what their government is actually doing.

  And to Marion's family: You are proud of her because you know she is a person of integrity. You might not know the specifics of the press releases or the strategy sessions, but you know that she is the same person at the dinner table as she is in the briefing room. She didn't have to keep two sets of books. She didn't have to remember which version of the story she told to which person.

  That is a rare thing. To work in a profession built on images and still wake up every morning knowing exactly who you are.

  Marion taught me that the job of a spokesperson isn't to make the Mayor look good. It's to make the Mayor *understandable*. There is a huge difference. One is about vanity; the other is about connection. One requires distortion; the other requires clarity.

  She taught me that you can be loyal to an administration without being disloyal to the truth. She taught me that the most powerful thing you can say in a press conference is not a clever zinger, but a plain, verifiable fact.

  Marion, for thirty years, you held the line. You protected the public's right to know, even when the public didn't want to hear it. You protected the Mayor's credibility, even when the Mayor didn't want to listen. And you protected your own conscience, which is the hardest job of all.

  So, I'd like to propose a toast.

  To Marion. May your retirement be filled with conversations that require no strategy, no messaging, and no spin. May you only have to deal with facts that are stubbornly good: the fact that you are loved, the fact that you are respected, and the fact that you made this city better, one honest word at a time.

  To Marion.
