answer: |-
  This is an excellent question that cuts to the heart of the relationship between mathematics, logic, and the physical world. You are absolutely correct about the mathematics: the equivalence of Turing machines, lambda calculus, and general recursive functions is a rigorously proven theorem.

  However, the reason the Church-Turing Thesis (CTT) is not considered a theorem is that **it is not a mathematical statement.**

  Here is the breakdown of why the distinction matters, why it cannot be proven, and what is actually still "open" about it.

  ### 1. The Gap Between Formal and Informal
  To have a mathematical theorem, you need precise definitions for all terms involved.
  *   **Formal Side:** We have precise definitions for "Turing-computable," "lambda-definable," and "general recursive."
  *   **Informal Side:** The thesis makes a claim about the pre-theoretic, intuitive notion of **"effective calculability"** (or "an algorithm," or "a mechanical procedure").

  The Church-Turing Thesis states:
  > *The class of functions that are **effectively calculable** (informal intuition) is identical to the class of **Turing-computable** functions (formal definition).*

  You can prove that Formal System A equals Formal System B. You cannot mathematically prove that Formal System A equals an Intuition. The intuition is not a mathematical object; it is a concept rooted in human cognition and physical reality.

  If CTT were a theorem, it would imply that "effective calculability" was already a well-defined mathematical concept *before* Turing and Church defined their models. It wasn't. It was a vague notion like "continuity" was before Cauchy and Weierstrass, or "area" was before Lebesgue.

  ### 2. Turing's Real Breakthrough
  Many people think Turing's 1936 paper was brilliant because he invented the Turing Machine. It was actually brilliant because of **how he justified it.**

  Before Turing, Church proposed the thesis using lambda calculus. Gödel was skeptical. He didn't believe lambda calculus necessarily captured the full extent of human calculation.

  Turing changed the game by performing a **philosophical analysis of human computation.** He argued:
  1.  Imagine a human computing a function with paper and pencil.
  2.  The human can only look at a finite number of symbols at once.
  3.  The human can only change a finite number of symbols in one step.
  4.  The human's "state of mind" can only be in one of a finite number of states.

  Turing argued that any process satisfying these constraints (which seem necessary for any "mechanical" or "effective" procedure) can be simulated by a Turing Machine.

  This is an **argument**, not a proof. It is a persuasive analysis of the concept of computation. If you accept Turing's analysis of what a "mechanical procedure" is, the thesis follows. But you cannot prove the analysis itself is exhaustive without circular reasoning.

  ### 3. Why It Is Falsifiable, Not Provable
  Because the thesis connects math to the real world (or the limits of human reasoning), it is technically an empirical or philosophical claim. This means it is **falsifiable**.

  If someone were to construct a physical device or describe a logical procedure that:
  1.  Everyone agrees is an "effective method" (clear, finite steps, deterministic),
  2.  But computes a function that is **not** Turing-computable (e.g., solves the Halting Problem),

  ...then the Church-Turing Thesis would be false.

  Since it is possible (in principle) to be proven wrong, it cannot be a mathematical theorem. Mathematical theorems are true by virtue of their axioms; CTT is true (as far as we know) by virtue of how the universe and logic seem to work.

  ### 4. Two Versions of the Thesis
  Confusion often arises because there are two distinct versions of the thesis, and they have different statuses:

  **A. The Logical Thesis (Original)**
  *   *Claim:* Any function computable by an algorithm (logical sense) is Turing-computable.
  *   *Status:* Widely accepted as a definition. In modern computer science, we often *define* "algorithm" as "Turing Machine." If you treat it as a definition, it is true by fiat. However, as a claim about the pre-existing intuition of algorithms, it remains a thesis.

  **B. The Physical Thesis**
  *   *Claim:* Any function computable by a physical system in our universe is Turing-computable.
  *   *Status:* This is definitely **not** proven and is an active area of research.
      *   Does quantum computing allow for hypercomputation? (Consensus: No, BQP is within Turing limits, but it's an empirical question).
      *   Are there analog physical systems (e.g., using infinite precision real numbers) that could compute non-recursive functions?
      *   Does the human brain operate on principles beyond Turing computation (Penrose-Hameroff orchestrated objective reduction)?

  When philosophers say the thesis is "unprovable," they are usually referring to the fact that we cannot rule out physical or logical possibilities that lie outside the Turing model without making assumptions about the nature of physics or cognition.

  ### 5. An Analogy
  Consider the concept of **"Geometric Distance."**
  *   **Intuition:** We all know what the distance between two points is.
  *   **Formalization:** The Euclidean distance formula ($\sqrt{\Delta x^2 + \Delta y^2}$).

  We can prove that the Euclidean formula is equivalent to other formalizations (like limits of polygonal chains). But can we *prove* that the Euclidean formula captures the true, intuitive essence of "distance" in the physical universe?
  No. We might discover that on a quantum scale, space is discrete, or in general relativity, space is curved, and the Euclidean formula no longer matches the physical reality of "distance."

  Similarly, Turing Machines capture our *current best formalization* of "computation." But we cannot prove that this formalization perfectly maps to the intuitive or physical concept for all time and all possible universes.

  ### Summary
  You are right that the convergence of formal systems is mathematically proven. However, the Church-Turing Thesis is the claim that **those formal systems capture the informal intuition of computation.**

  *   **Math:** $TM = \lambda\text{-calculus}$ (Proven Theorem)
  *   **Thesis:** $TM = \text{Effective Method}$ (Unprovable Claim)

  Textbooks call it a thesis to honor the fact that it bridges the gap between formal mathematics and the informal concept of an algorithm. It is the foundation upon which the math is built, not a result derived from the math.
