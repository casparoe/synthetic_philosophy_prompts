      *   *Truth Condition:* Depends on the correspondence between the output token sequence and external reality (or retrieved context).
      *   *Internal State:* Indistinguishable (mostly) between truth and falsehood during generation. The model doesn't "know" it's lying.

  4.  **Synthesize: The Clash:**

