  *(Key Insight to emphasize)*: The term "hallucination" in ML is actually *anti*-Disjunctivist because it implies the *same process* yields two different truth values. Disjunctivism says the process *must* be different if the truth value is different.

  *(RAG Insight)*: RAG changes the *input*, not the *nature of the processing*. So it's still Common Factor. But it changes the *causal chain*. Disjunctivism cares about the metaphysical nature of the state, not just the cause. So RAG doesn't fully save it.

