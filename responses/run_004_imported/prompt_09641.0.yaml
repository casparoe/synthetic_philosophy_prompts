answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name], and I have the distinct privilege of being one of Mara's friends.

  Now, many of you know Mara as the woman who laughs too loud at bad movies, makes an incredible lasagna, and is currently glowing radiantly in this dress. But some of you—mostly the people sitting at that table over there [gesture to philosophy friends]—know Mara as a serious scholar of metaphysics.

  Mara wrote her dissertation on something called "perdurantism." Now, for the family members who didn't spend their twenties arguing about this over cheap wine: don't panic. I'm not going to give a lecture. But I do need to explain one thing, because it actually explains why we are all here tonight.

  See, most of us think of ourselves as "enduring." You think you are the same whole person today that you were yesterday, and that you'll be the same person ten years from now. You're just... you. Moving through time.

  Mara, however, has spent years arguing that isn't true. She argues that we are "four-dimensional." That means we don't just move *through* time; we extend *across* it, like a long space-time worm. The "you" of 1995 is just the tail end of the worm. The "you" at the altar right now is just a middle slice. And the "you" of 2050 is the far end.

  She even debates whether those future slices are actually *connected* to the current slice, or if they're just separate "stages" linked by memory and similarity. In other words, Mara has built a career on asking: "How do we know the person I am tomorrow is actually the *same* person as the one I am today?"

  And when she told me she was getting married, I started thinking: If Mara is right, this wedding is metaphysically complicated.

  Because traditionally, a wedding vow is a promise of endurance. "I take *you*... as long as we both shall live." It assumes there is a stable "you" to take.

  But if perdurantism is true, the Mara standing here right now is just a temporal slice. She's a snapshot. The Mara who will be waking up next to [Partner's Name] in ten years is a different temporal part. The Mara who will be arguing about where to go for dinner in thirty years is yet another stage.

  So, strictly speaking, the Mara at the altar can only promise for *this* slice. She can't legally bind the future slices. By the rules of her own dissertation, the "Future Mara" is technically a counterpart, not the same entity.

  So, what are we doing here?

  Well, I think the answer is beautiful. And I think [Partner's Name] holds the key.

  If Mara is right, and we are all just a series of fleeting moments stitched together, then love isn't just a feeling. Love is the glue.

  [Partner's Name], by standing here and making this vow, you aren't just promising to love the Mara standing in front of you right now. You are promising to love the worm. You are promising to look at the Mara of five years from now, who might be tired or stressed or changed, and say, "I know you. You are a counterpart of the woman I married. You belong to the same story."

  In a universe where identity is fragmented, marriage is the act of weaving those fragments back into a whole.

  For the philosophers here: You might say that personal identity is grounded in psychological continuity. But I say it's grounded in witness. [Partner's Name] is the witness who guarantees that the stages connect. He/She/They are the constant that allows the variable of Mara to exist through time.

  And for the family: All this means is that [Partner's Name] loves *all* of her. The her that was, the her that is, and the her that will be. Even the parts of her that haven't happened yet.

  Mara, you've spent your life analyzing how people exist through time. But today, you don't have to analyze it. You just have to live it. You don't need to prove that your future stages are connected. You just need to trust that [Partner's Name] will be there to meet them.

  So, if we accept that we are all just passing through moments, let's make this moment count. Let's raise a glass to the space-time worm. To the past slices that brought us here, the current slice that is throwing this party, and the future slices that will enjoy the open bar.

  To Mara and [Partner's Name]. May your timeline be long, may your stages be happy, and may you always recognize each other, no matter how much you change.

  To the happy couple!
