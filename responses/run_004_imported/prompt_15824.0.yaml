prompt: |-
  At work, we recently wrapped up the postmortem for a major outage, and two colleagues disagreed sharply about how to write the root-cause section, in a way I still can't quite adjudicate. One colleague argues the incident should be explained as an instance of a general, recurring pattern: given our mix of aggressive retries, shared connection pools, and slow health checks, a cascade like this was bound to happen sooner or later, and the write-up should mainly document that pattern so other teams can recognize and avoid it. The other thinks this misses what actually explains the incident, and wants a detailed, chronological account of the specific decisions and coincidences involved — a config pushed at an unlucky moment, an alert that fired late, an on-call engineer who made a reasonable but wrong call — since in her view only that story accounts for why the outage happened exactly when and how it did. Both accounts strike me as true, and the same disagreement resurfaces every time we write up a past failure, not just this one. Is there a principled way to decide which kind of explanation is the correct one, or to understand why we seem to need both?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** Postmortem for a major outage at work.
      *   **Conflict:** Two colleagues disagree on the "root-cause" section.
          *   *Colleague A (Systemic/Pattern View):* Focus on general recurring patterns (aggressive retries, shared pools, slow health checks). The outage was inevitable ("bound to happen"). Goal: Prevent future similar incidents across teams.
          *   *Colleague B (Specific/Narrative View):* Focus on specific details (config push timing, late alert, specific human decision). The outage happened *when* and *how* it did because of these specifics. Goal: Understand the precise chain of events.
      *   **User's Observation:** Both accounts seem true. This disagreement happens repeatedly.
      *   **Question:** Is there a principled way to decide which is "correct," or do we need both?

  2.  **Initial Assessment & Philosophical Framing:**
      *   This is a classic debate in incident management, safety science, and philosophy of causation.
      *   It mirrors the distinction between *proximate cause* vs. *ultimate cause*, or *necessary conditions* vs. *sufficient conditions*.
      *   It also aligns with the "New View" of safety (Sidney Dekker, Richard Cook) vs. traditional root cause analysis.
      *   Neither is "wrong." They serve different purposes. The tension is productive but needs resolution.

  3.  **Deconstruct the Two Perspectives:**
      *   **Colleague A (The Systemic/Structural Argument):**
          *   *Strengths:* actionable for long-term resilience, prevents class-of-error, addresses technical debt, aligns with "blameless" culture (focus on system, not people).
          *   *Weaknesses:* Can feel abstract, might ignore immediate triggers, could lead to fatalism ("it was bound to happen").
      *   **Colleague B (The Specific/Narrative Argument):**
          *   *Strengths:* accurate timeline, explains the *trigger*, captures human factors/context, useful for immediate remediation.
          *   *Weaknesses:* Can lead to "human error" blame, might miss the underlying vulnerability (why did the config break things?), hard to generalize.

  4.  **Connect to Established Frameworks:**
      *   **Charles Perrow's "Normal Accidents":** Supports Colleague A (complex systems fail inevitably).
      *   **Richard Cook's "How Complex Systems Fail":** Supports both (catastrophe requires multiple failures, but specific conditions matter).
      *   **The "Swiss Cheese Model" (Reason):** Supports Colleague A (holes align), but Colleague B describes the specific trajectory through the holes.
      *   **Causal Layering (e.g., 5 Whys):** Shows how you can drill down from specific to general.
      *   **Philosophy of Causation:** *Type vs. Token* causation.
          *   *Type:* General patterns (Retries cause cascades).
          *   *Token:* Specific instance (This retry caused this cascade at 2 PM).

  5.  **Formulate a Principled Resolution:**
      *   **Reject the "Either/Or":** The user suspects they need both. Confirm this.
      *   **Define the Purpose of a Postmortem:** It's not just "what happened," it's "how do we learn?"
      *   **Propose a Structure:** A good postmortem needs a *Timeline* (Colleague B) and a *Contributing Factors/Root Causes* (Colleague A).
      *   **Introduce the Concept of "Conditions" vs. "Triggers":**
          *   Systemic issues = Conditions (dry tinder).
          *   Specific events = Triggers (spark).
          *   You need both for a fire.
      *   **Actionability:** Distinguish between *immediate fixes* (address triggers) and *strategic fixes* (address conditions).

  6.  **Drafting the Response (Iterative Process):**

      *   *Validation:* Acknowledge that this is a deep, common, and productive tension. It's not a bug; it's a feature of complex systems.
      *   *Philosophical Lens:* Introduce "Type vs. Token" causation. This gives intellectual weight to the intuition that both are true.
      *   *Safety Science Lens:* Mention "New View" safety (human error is a symptom, not a cause) but acknowledge the need for narrative.
      *   *Practical Framework:* Suggest a specific structure for the postmortem that accommodates both.
          *   Section 1: Timeline (The Story/Token).
          *   Section 2: Contributing Factors (The Pattern/Type).
          *   Section 3: Action Items (mapped to both).
      *   *The "Why" of the Disagreement:* Explain *why* they fight. One wants prevention (A), one wants accuracy/accountability (B).
      *   *Recommendation:* Don't choose one. Synthesize. Use the specific story to illustrate the general pattern.

  7.  **Refining the Tone:**
      *   Keep it professional, empathetic, and analytical.
      *   Avoid taking sides.
      *   Use terminology familiar to engineering/SRE contexts (cascading failures, retry storms, blast radius).

  8.  **Self-Correction/Nuance Check:**
