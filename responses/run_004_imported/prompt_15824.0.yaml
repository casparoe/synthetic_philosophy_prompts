      *   *Caution:* Don't let Colleague A's view become too abstract ("fix everything"). Focus on actionable patterns.
      *   *Key Insight:* The "Root Cause" label itself is often the problem. It implies singularity. Suggest using "Contributing Factors" instead.

  9.  **Final Polish:** Organize with clear headings. Ensure the conclusion offers a concrete path forward for the user to mediate the next discussion. (This matches the structure of the final output).

