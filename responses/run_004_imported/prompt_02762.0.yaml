answer: |-
  This is a superb historical and philosophical puzzle. It cuts to the heart of how we interpret the intellectual character of historical figures: do we judge them by the internal logic of their specific texts, or by the broader consistency of their life's work?

  Both you and your friend have identified genuine tensions in Turing's thought, but **you have the more plausible read on Turing's personal intellectual character,** while your friend has the stronger read on the *structural logic* of the 1950 paper.

  Here is the breakdown of why your intuition about Turing's reaction to the fraud is likely more accurate, grounded in the historical context of 1950, the nature of Banburismus, and Turing's known psychological profile.

  ### 1. The Historical Context: Why Turing wasn't "Crazy" in 1950
  To judge Turing fairly, we must reconstruct the epistemic landscape of 1950. Today, parapsychology is considered pseudoscience. In 1950, it was a contentious but legitimate field of inquiry within the British scientific establishment.
  *   **The Status of Soal:** S.G. Soal was not a fringe figure. He was a respected mathematician and psychologist. His experiments were conducted under what were considered rigorous controls for the time.
  *   **The Consensus:** Many reputable scientists (including Nobel laureates like Lord Rayleigh earlier, and contemporaries like C.D. Broad) were open to the possibility of ESP. The "statistical evidence" *was* widely discussed as significant in British academic circles.
  *   **Turing's Pragmatism:** When Turing calls the evidence "overwhelming," he is likely deferring to the consensus of the Royal Society circle he moved in. He was not a parapsychologist; he was outsourcing that specific data validation to the relevant experts, much as a computer scientist today might outsource the bioethics of a neural interface to bioethicists.

  **Verdict on Context:** Turing was not being unscientific by the standards of 1950. He was accepting the prevailing data.

  ### 2. The Banburismus Contradiction: Your Strongest Point
  This is where your argument shines. Turing's work at Bletchley Park was not just about code-breaking; it was about the **weight of evidence.**
  *   **Sequential Analysis:** Banburismus was an early application of sequential analysis (later formalized by Wald). It required knowing exactly how much evidence was needed to cross a threshold of certainty without succumbing to patternicity (seeing signals in noise).
  *   **The "Bans":** Turing invented a unit of measurement for the log-likelihood ratio. He was obsessed with quantifying uncertainty.
  *   **The Discrepancy:** For a man who spent years calculating the precise decibanage required to trust a Enigma setting, accepting Soal's "overwhelming" statistics without apparent skepticism is an anomaly. Soal's data showed effects that were *too* perfect, a red flag for anyone trained in error distribution.

  You are correct that Turing's own methodological standards should have triggered a "Banburismus alarm." He understood better than most that extraordinary claims require not just significant p-values, but robust mechanisms and reproducibility. The fact that he didn't publicly apply this skepticism suggests he was treating the ESP data as a **boundary condition** rather than a core belief.

  ### 3. The Philosophical Function: Your Friend's Strongest Point
  Your friend argues that Turing would "shrug it off." In the context of the *argument*, your friend is right.
  *   **Closing the Loophole:** The goal of the 1950 paper is to define machine intelligence. Telepathy is a confounding variable. If a human interrogator can read the mind of the human witness, the test fails.
  *   **The "Telepathy-Proof Room":** Turing proposes lead-lined rooms (a Faraday cage for the mind). This is an engineering solution, not a metaphysical endorsement. He is saying: *"Whether this is true or false, we must design the experiment to nullify it if it exists."*
  *   **The Quote:** Immediately after calling the evidence "overwhelming," Turing writes: *"It is my own opinion that [the existence of telepathy] does not affect our argument."*

  Structurally, the truth of ESP is irrelevant to the Turing Test. If ESP is real, we build a lead room. If ESP is fake, the lead room does nothing. The Test proceeds either way.

  ### 4. The Verdict: How Turing Would Have Reacted to the Fraud
  Here is where you win the argument. While your friend is right that the fraud doesn't invalidate the Turing Test, they are wrong about how Turing would *feel* about the fraud.

  **Turing would not have shrugged.**

  1.  **Intolerance for Deception:** Turing's entire career was built on determinism and truth. The Enigma machine either worked or it didn't; the logic was either sound or it wasn't. Scientific fraud (doctored score sheets) is the antithesis of the Turing Machine. It introduces "noise" that cannot be computed out. Discovering that the "overwhelming evidence" was a lie would have offended his sense of order.
  2.  **The Statistician's Regret:** If you showed Turing the 1978 exposure of Soal in, say, 1953, he wouldn't say, "It doesn't matter." He would say, **"My weight of evidence calculation was based on corrupted input."** For a Bayesian thinker, corrupted priors are a critical failure. He would likely have felt a professional embarrassment that he hadn't audited the raw data himself.
  3.  **Materialism:** Turing was moving toward a materialist view of the brain (evident in his later work on morphogenesis). ESP implies a non-physical transmission of information. While he was willing to entertain it to close a loophole, his intellectual trajectory was toward physical explanations. The fraud would have validated his underlying materialist instincts, but the *deception* would have unsettled him.

  ### Conclusion
  Your friend is right that the **philosophy** survives the fraud. The Turing Test remains robust even if telepathy is impossible.

  However, **you are right about the man.** Turing was a rigorous empiricist who devised methods specifically to prevent self-deception in the face of ambiguous data. To learn that he had cited "overwhelming" evidence that was actually manufactured would have struck at his core identity as a scientist. He would not have compartmentalized; he would have recalibrated. He would have viewed the fraud not as "beside the point," but as a corruption of the informational landscape he sought to navigate.

  **The Plausible Read:** Turing would have been genuinely unsettled, not because his theory was wrong, but because the integrity of the data he relied upon had been violated. He would have likely issued a correction or a footnote with the same rigor he applied to Banburismus, acknowledging that the "statistical evidence" was, in fact, null. Brilliant people do compartmentalize, but Turing's specific brilliance was an obsession with the reliability of information itself. To lie about data was to break the machine.
