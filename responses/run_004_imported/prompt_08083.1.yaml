      *   *Check:* Did I focus on Expected Utility Maximization as the standard? Yes, the argument is internal to EUT.
      *   *Check:* Is Menger's logic clear? I need to make sure the construction of the "super game" is intuitive.
      *   *Refinement:* Make sure to emphasize that if utility is unbounded, the *domain* of the utility function allows values high enough to break the convergence of the series, regardless of how fast the probability decays.

  7.  **Final Polish:** Organize into logical headings. Ensure the conclusion lands hard on the "Boundedness is Necessary" point. (Proceed to generate output based on this structure).

  *(Self-Correction Note)*: I should be careful not to conflate "bounded utility" with "risk aversion." Risk aversion is concavity. Boundedness is an asymptote. Bernoulli had concavity but not boundedness (log goes to infinity). Menger showed concavity isn't enough; you need the asymptote. I must make this distinction sharp.

  8.  **Final Plan:**
      1.  Introduction: Validate the user's insight (Menger's theorem is the "gotcha").
      2.  The Logic of Divergence: Explain why unboundedness + infinite series = potential divergence.
      3.  Menger's Construction: Show how to build the counter-game for *any* unbounded function.
      4.  The Normative Necessity: Why infinite EU breaks rational choice theory.
      5.  The Only Escape: Boundedness.
      6.  Conclusion.

