answer: |-
  You have hit upon one of the most profound and often overlooked results in decision theory. Your intuition is correct: Karl Menger's 1934 analysis demonstrates that Daniel Bernoulli's solution was merely a patch, not a cure.

  To argue directly for your claim: **If we accept Expected Utility (EU) maximization as the universal standard of rational choice, and we demand that the theory be general enough to evaluate any logically possible gamble, then the utility function *must* be bounded above.**

  Here is the argument for why boundedness is not just a suggestion, but a logical necessity for a coherent, general theory of rational choice.

  ### 1. The Structural Vulnerability of Unbounded Functions
  The core of the St. Petersburg paradox is a divergence problem. We have a sum of probabilities multiplied by values:
  $$ E = \sum_{n=1}^{\infty} p_n \cdot v_n $$
  In the classic paradox, $p_n = 1/2^n$ and $v_n = 2^n$. The terms cancel to 1, the sum diverges to infinity, and the theory says a rational agent should pay any finite amount to play.

  Bernoulli's fix was to transform the value $v_n$ (money) into utility $u(v_n)$ using a concave function like $\ln(v_n)$. Because $\ln(2^n)$ grows much slower than $2^n$, the series converges. The expected utility becomes finite.

  However, this relies on a specific relationship between the decay rate of the probability ($1/2^n$) and the growth rate of the utility function ($\ln(x)$). If the utility function is **unbounded**, it implies that for any number $K$, no matter how large, there exists some payoff $x$ such that $u(x) > K$.

  This unboundedness creates a structural vulnerability. It means the utility function has no "ceiling." If there is no ceiling, there is always room to construct a payoff sequence that grows fast enough to punch through the decaying probabilities.

  ### 2. Menger's Construction: The "Super" Game
  Menger proved that for *any* unbounded utility function $u(x)$, one can construct a St. Petersburg-style lottery that yields infinite expected utility.

  The construction is straightforward. Let the probabilities be the standard St. Petersburg probabilities: $p_n = 1/2^n$.
  To make the Expected Utility infinite, we need the sum $\sum p_n u(x_n)$ to diverge. A sufficient condition for divergence is that the $n$-th term is always greater than or equal to 1 (since $\sum 1 = \infty$).

  So, we need:
  $$ \frac{1}{2^n} \cdot u(x_n) \geq 1 \implies u(x_n) \geq 2^n $$

  Because $u$ is **unbounded**, we know that for every $n$, there *must* exist some monetary payoff $x_n$ such that $u(x_n) \geq 2^n$. We simply define the payoff of our new "Super St. Petersburg" game to be that specific $x_n$ for the $n$-th round.

  **The Result:**
  1.  You propose any unbounded utility function (log, square root, iterated log, etc.).
  2.  I construct a lottery where the payoffs are calibrated to outpace the probability decay relative to your specific utility function.
  3.  The Expected Utility of this new lottery is infinite.
  4.  According to EU maximization, a rational agent must be willing to pay any finite amount to play this game.

  This recreates the exact irrationality of the original paradox. Bernoulli's fix solves the game where payoffs are $2^n$, but Menger shows that an unbounded utility function simply shifts the paradox to a game where payoffs are $u^{-1}(2^n)$.

  ### 3. The Requirement of Generality
  Why does this force us to accept bounded utility? It comes down to the scope of the theory.

  If you are a software engineer, think of the utility function as an API. If the API documentation says, "This function calculates the rational value of any gamble," but there exists a class of inputs (Menger's super-games) that causes a stack overflow (infinite expectation), the API is buggy.

  You could try to fix this by restricting the inputs. You could say, "Rational agents only face gambles where payoffs grow slower than $u^{-1}(2^n)$." But this is ad hoc. In an idealized model of rationality, we generally assume that the *probabilities* and *payoffs* are the givens, and the *utility function* represents the agent's stable preferences.

  If the theory of rationality depends on the external world never offering a "Super St. Petersburg" contract, then the theory is not a general account of rationality; it is a contingent account that only works in a benevolent universe. A truly general theory of rational choice must be able to handle any logically coherent probability distribution paired with any logically coherent payoff structure.

  Since we cannot logically forbid the existence of a payoff sequence $x_n$ (money can be arbitrarily large in the abstract), the only variable we can constrain to ensure convergence is the utility function itself.

  ### 4. Infinite Utility Breaks Decision Theory
  One might ask: "So what if expected utility is infinite? Why is that a problem?"

  It is a problem because it destroys the **preference ordering**, which is the foundation of rational choice.
  *   If Game A has $EU = \infty$ and Game B has $EU = \infty$, EU theory struggles to distinguish between them.
  *   More critically, if a game has infinite EU, the theory implies you should trade *anything* finite for a ticket to that game. You should mortgage your house, sell your future earnings, and borrow at 1000% interest to play.
  *   If *every* unbounded utility function admits *some* game with infinite EU, then for any agent with unbounded preferences, there exists a "money pump" scenario where their rational valuation exceeds all finite resources.

  To preserve the prescriptive power of Expected Utility Theory—to ensure it tells us how to choose between options rather than crashing into infinity—the expected value of *all* admissible gambles must be finite. The only mathematical guarantee that $\sum p_n u(x_n)$ remains finite for *all* probability distributions $p_n$ (where $\sum p_n = 1$) is if the sequence $u(x_n)$ is bounded.

  ### 5. The Conclusion: Boundedness is the Only Firewall
  There are only two ways to resolve the Menger paradox:
  1.  **Abandon Expected Utility Maximization:** Adopt a different decision framework (e.g., quantile utility, median maximization, or non-Archimedean fields).
  2.  **Bound the Utility Function:** Accept that there is a maximum possible utility an agent can experience.

  Since your prompt stipulates that we are keeping **Expected Utility maximization as the standard**, option 1 is off the table. We are left with option 2.

  Therefore, within the axioms of EUT, **bounded utility is a necessary condition for consistency.**

  If utility is unbounded, the theory is mathematically incomplete: it works for "small" gambles but fails for "large" ones, with no internal principle to distinguish small from large other than circular reference to the utility function itself. By requiring $u(x)$ to have a finite supremum (e.g., $u(x) \to 1$ as $x \to \infty$), we mathematically guarantee that $\sum p_n u(x_n)$ can never exceed that supremum. The series *must* converge.

  ### Summary
  Menger showed that concavity (diminishing marginal utility) is not enough to save Expected Utility Theory; only boundedness can do it.
  *   **Unbounded Utility** + **Arbitrary Payoffs** = **Possible Infinite Expectation**.
  *   **Infinite Expectation** = **Breakdown of Rational Preference Ordering**.
  *   **To Preserve Rational Ordering** = **Expectation must always be Finite**.
  *   **To Guarantee Finite Expectation** = **Utility must be Bounded**.

  Any resolution that claims to solve the St. Petersburg paradox while maintaining an unbounded utility function is merely hiding the paradox, waiting for a sufficiently aggressive payoff schedule to expose it again. To close the family of paradoxes for good, you must accept that human (or rational) value has a ceiling.
