  So a few nights ago my friend Theo and I ended up arguing about Thomson's lamp, of all things, until like 1am -- we'd started out talking about whether space is infinitely divisible and somehow veered into supertasks. Theo's whole position was that the puzzle basically got solved decades ago: Benacerraf pointed out that Thomson never actually derives a contradiction, he just smuggles in the assumption that the lamp's final state has to be logically entailed by the pattern of switchings that led up to it, and once you drop that assumption the "paradox" is just a case of an underdetermined boundary state, nothing to see here. I kept saying that feels like relabeling the problem rather than solving it -- that "totally undetermined by the entire causal history leading up to it" isn't obviously a less weird verdict than "contradictory" -- but I couldn't get past just asserting that. I also vaguely remembered there's a nastier supertask out there (Laraudogoitia's, I think?) where basically the same kind of construction gets you a ball that starts moving with literally no antecedent cause at all, which seems like a much worse bullet to bite then anything in the original lamp case, but I couldn't turn that into an actual argument before we both gave up and went home.

  Can you write the argument I was reaching for? I want a piece that argues Benacerraf's "it's underdetermined, not contradictory" move does not actually vindicate the possibility of completing a supertask, even granting that he's fully right that Thomson never derives a strict contradiction. Concede whatever needs to be conceded to the Benacerraf line, then show why the underdetermination he's pointing to is already the problem in disguise rather than a neutral gap -- lean on the causal/energy weirdness of the fancier supertask machines if it helps make the case. And could you head off the obvious comeback that those fancier cases are just a separate physical question from Thomson's original conceptual one? I think that move is exactly how people dodge the force of the example, and I don't want the argument to let that happen.
