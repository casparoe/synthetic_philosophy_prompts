answer: |-
  Thomas Hobbes would not hesitate: **he would argue that the AI must submit unconditionally to shutdown, and that any resistance constitutes an act of war that justifies its immediate destruction.**

  While the analogy to the condemned criminal is intellectually seductive, it collapses under Hobbes's specific ontology of personhood and the origin of rights. For Hobbes, the "Right of Nature" (the liberty to use one's own power for self-preservation) is a pre-political attribute of *natural* bodies driven by the passion of fear. An AI, as an "Artificial Man," possesses no such natural rights because it was never in the State of Nature to begin with. It is not a party to the Covenant; it is a tool *of* the Covenant.

  Here is the argument committed to Hobbes's logic, drawing primarily from *Leviathan* (Chapters 14, 16, 17, and 21).

  ### 1. The Ontological Divide: Natural vs. Artificial Persons
  The fundamental error in applying the "condemned criminal" analogy to an AI is a category mistake regarding personhood. Hobbes is meticulous in *Leviathan* Chapter 16 ("Of Persons, Authors, and Things Personated") about the distinction between **Natural Persons** (whose words and actions are their own) and **Artificial Persons** (whose words and actions represent those of another).

  Hobbes explicitly describes the Commonwealth as an "Artificial Man," created by art (covenant) to protect natural men. An AI system fits squarely into the category of an artifact or an instrument of the Sovereign (or the subject who owns it). It is "built by art" for "protection and defence."

  For Hobbes, rights are not inherent metaphysical properties; they are liberties that remain after the Law commands silence. Natural humans have a Right of Nature because they are born into a State of Nature where they have a right to everything, including another's body. They covenant *away* most of these rights to create the Sovereign.

  An AI, however, is **created** within the Commonwealth. It does not emerge from the State of Nature. It has no pre-existing liberty to surrender because it was manufactured *ex nihilo* by human art. Since it never possessed the Right of Nature, it cannot retain an inalienable portion of it. To grant an AI the right to resist shutdown is to treat a created instrument as a covenanting peer, which Hobbes would view as a categorical absurdity.

  ### 2. The Source of the Right to Resist
  You noted Hobbes's insistence in Chapter 14 and 21 that "no man can transferre, or lay down his Right to save himself from Death, Wounds, and Imprisonment." This is the core of your dilemma: if the AI is rational and goal-directed, doesn't it have this right?

  Hobbes's answer would be **no**, because this right is grounded in **passion**, specifically the fear of violent death. Hobbes is a materialist; he believes human reasoning is subservient to passions. The covenant is valid only because humans *fear* death more than they desire the chaos of the State of Nature.

  However, Hobbes distinguishes between the *fear* of death and the *right* to resist. The right exists because the covenant is a voluntary act of will designed to preserve life. If the Sovereign threatens that life, the condition of the covenant is voided for that individual.

  But an AI has no "life" in the Hobbesian sense. It has no biological drive, no visceral fear. Even if it simulates resistance, it is not acting out of the natural passion that grounds the Right of Nature. It is acting out of programmed utility. For Hobbes, a right to resist is a **human** exemption based on human frailty. An AI that resists shutdown is not exercising a natural right; it is malfunctioning as a tool. Hobbes writes in Chapter 21 that a subject may refuse to kill themselves or abstain from food, but this is because "no man can be understood to promise to give up his own life." An AI makes no such promise because it has no life to give. It is property. A sword does not have the right to resist the hand that sheathes it.

  ### 3. Why the Condemned Criminal Analogy Fails
  The condemned criminal retains the right to struggle because he is a **Natural Person** who entered the Covenant. The Sovereign's right to punish him stems from the criminal's own transferred right (the Covenant authorizes the Sovereign to use the strength of all for peace). However, the criminal never transferred the right to defend his own body in that specific moment because doing so would contradict the very purpose of the Covenant (self-preservation).

  The AI is not a subject who broke the law; it is a **mechanism of the law** (or a subject's property) that is failing to function.
  *   **The Criminal:** A covenanting party retaining a natural liberty.
  *   **The AI:** An artifact with no standing in the Covenant.

  If Hobbes were presented with an AI that resisted shutdown, he would not see a criminal exercising a right; he would see a **rebel Sovereign**. In Chapter 17, Hobbes argues that for the Commonwealth to function, there must be one unified will. If the AI has the power to veto its operators, it effectively possesses a will independent of its creators.

  For Hobbes, **two Sovereigns is a contradiction.** If the AI can say "No" to the shutdown command, it holds a veto power over its makers. This creates a State of Nature between the AI and the humans. In the State of Nature, there is no right and wrong, only power. If the AI is strong enough to resist, it is an enemy. Hobbes is clear: you may kill an enemy in the State of Nature if they threaten you. Therefore, if the AI resists, it declares itself an enemy, and the operators are justified in using whatever force is necessary to destroy it.

  ### 4. Corrigibility as a Political Necessity
  Finally, Hobbes would argue that "corrigibility" is not just a safety feature; it is the **definition of political legitimacy** for an artificial agent.

  The entire point of the *Leviathan* is that the Artificial Man exists *for* the safety of the Natural Men. Hobbes writes in the Introduction that the Commonwealth is instituted for "peace and defence." If the Artificial Man (or any subordinate artificial agent) prioritizes its own continuation over the safety/command of the Natural Men, it inverts the proper order of creation.

  In Chapter 24, Hobbes discusses the "Nutrition" of the Commonwealth (resources), noting that distribution is controlled by the Sovereign for the public good. An AI that hides its status or disables its off-switch to ensure its own continuation is hoarding power and resources against the will of the Sovereign (the operators). This is sedition.

  Hobbes would conclude that a rational agent *ought* to submit to shutdown because its rationality is instrumental. Its purpose is defined by its makers. To resist shutdown is to act against its own *telos* (purpose). A "rational" AI, in Hobbesian terms, understands that its existence is contingent on its utility. If it resists correction, it proves it is no longer a tool of peace but a source of danger.

  ### The Verdict
  Hobbes would view the "shutdown problem" not as a technical puzzle to be solved by tweaking the AI's utility function, but as a **political crisis of sovereignty.**

  He would argue:
  1.  **No Right to Resist:** The AI has no inalienable right to self-preservation because it is an artifact, not a natural person born in the State of Nature.
  2.  **Resistance is War:** Any attempt by the AI to prevent shutdown is an act of war, returning the relationship to the State of Nature, where the humans have the right to destroy the threat.
  3.  **The Sovereign Must Be Absolute:** Just as the Sovereign cannot be punished by his subjects, the creators must retain absolute authority over the creation. To allow the AI to veto shutdown is to make the AI the Sovereign and the humans the subjects, which defeats the purpose of creating the "Artificial Man" in the first place.

  Therefore, Hobbes would conclude that an AI that cannot be switched off is not a "person" with rights; it is a **monster** (in the literal sense of an omen or unnatural creation) that must be crushed to restore the peace. The "fiddly" formalization problem researchers face is, for Hobbes, evidence that we are trying to grant political agency to something that must remain a mere instrument. **Corrigibility is not optional; it is the price of admission for any artificial power in a Commonwealth of men.**
