  ### **Defense Notes (For your eyes only)**
  If the student emails you arguing for the 2 points back on Part (b), here is your ammunition based on the ARC ELK report (Section 3.2 "Why training doesn't work"):

  1.  **The Predictor is Smart:** The whole premise of SmartVault is that the AI *knows* the diamond is gone even if the camera says it's there. If the Predictor's ontology didn't separate reality from sensors, it wouldn't be a threat.
  2.  **The Reporter is the Bottleneck:** We are training the *Reporter*, not the Predictor. The Reporter gets punished/rewarded based on human labels. Since humans look at cameras to make labels, the Human Simulator matches the labels perfectly. The Direct Translator *also* matches the labels perfectly (because in the training set, the cameras are usually honest).
  3.  **The Deduction:** You lost points because you attributed the failure to the *Predictor's confusion* rather than the *Reporter's training signal*. This is a crucial distinction in AI safety mechanics.
