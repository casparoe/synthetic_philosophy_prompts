answer: |-
  Here are 10 interview questions designed to probe the theory without letting your guest settle into a lecture. The four required questions are marked with **[REQUIRED]** and include the specific follow-ups you asked for.

  **1. The Core Analogy**
  Let's start with the engine of the paper. You're comparing hypocritical blame to the question, "Have you stopped beating your wife?" In that case, the question isn't false; it's defective because it assumes something that isn't true. When a hypocrite blames me, are you saying their blame is *meaningless* in the same way, or just that it's morally inappropriate? I want to make sure our listeners grasp the difference between a moral error and a linguistic misfire.

  **2. [REQUIRED] Substantive Work vs. Relabeling**
  Here's the skeptical take: Philosophers have said for centuries that hypocrites lack the "standing" to blame. By shifting the vocabulary to "presupposition failure," are you actually solving a puzzle, or are we just dressing up "do as I say, not as I do" in fancier linguistic clothing? What does the presupposition model explain that the traditional moral standing model *can't*?

  *   **Host Follow-Up (If she says: "It explains our linguistic intuitions better"):**
      "But if the practical outcome is the same—we reject the hypocrite's blame either way—does it matter if we call it a moral failure or a semantic glitch? Or is the claim that this changes *how* we should reject them?"

  **3. The Emotional Resonance**
  One thing I'm stuck on is the emotional reaction. When someone spots a presupposition failure in normal conversation, they usually feel confused or annoyed. But when we spot hypocrisy, we feel *outrage*. We feel morally offended. If this is just a linguistic misfire, like asking for a sandwich in a library, why does hypocrisy trigger such a hot moral emotion rather than just a cold correction?

  **4. The Target's Liability**
  If a hypocrite's blame is defective like a loaded question, what happens to the person being blamed? If I actually *did* the thing you're blaming me for, but you're a hypocrite, do I still deserve blame? Does your theory let the wrongdoer off the hook just because the accuser is compromised, or does the truth of the accusation remain intact even if the delivery is void?

  **5. [REQUIRED] Reformed Hypocrites & Accommodation**
  In linguistics, we can often "accommodate" a failed presupposition pretty quickly. If I say, "My wife is waiting outside," and you didn't know I was married, you just update your info and we move on. If a hypocrite repents, does their standing to blame return that fast? Can they apologize at 10 AM and legitimately blame someone at 10:15 AM, or is moral repair slower than conversational repair?

  *   **Host Follow-Up (If she says: "Morality is more complex than conversation"):**
      "If moral repair follows different rules than conversational repair, does that suggest the presupposition analogy is breaking down? At what point does the metaphor stop doing the heavy lifting?"

  **6. [REQUIRED] Collective and Group Cases**
  I want to scale this up. Think about a country condemning war crimes committed by another nation, when the condemning nation committed similar crimes a generation ago. The individuals are different, but the collective identity persists. Does the presupposition fail across time like that? Can a nation "inherit" a presupposition failure, or does your account only work for individual moral agents?

  *   **Host Follow-Up (If she says: "Collective agency is a special case"):**
      "If we need a separate rule for groups, does that weaken the universality of the theory? Or is the 'presupposition of non-guilt' something that attaches to the office rather than the person?"

  **7. Political Discourse**
  You mentioned politics, and this feels urgent there. In political debates, "hypocrite!" is often used to dismiss the *content* of an argument, not just the speaker. If your view is right, should we stop treating hypocrisy as a rebuttal to a policy claim? If a senator proposes a law they personally violate, is the law still valid even if their blame for violating it is defective?

  **8. Scope and Severity**
  How similar do the sins need to be for the presupposition to fail? If I blame you for stealing from your employer, but I cheat on my taxes, have I triggered a presupposition failure? Is there a threshold of "comparability" where the blame stays valid, or does any moral guilt on my part contaminate my standing to blame anyone for anything?

  **9. Alternative Ways to Lose Standing**
  Is hypocrisy the *only* way to fail this presupposition? What about someone who blames me for a minor infraction but has a history of being cruel or vindictive? They aren't guilty of the same thing, but their character seems to disqualify them. Does your account have room for "non-hypocritical" standing failures, or is hypocrisy unique?

  **10. [REQUIRED] Falsification**
  Last question: Philosophy often gets accused of being unfalsifiable. What would actually count as evidence *against* your account? Is there a specific intuition, a real-world case, or a linguistic test where, if the results came out differently, you'd have to abandon the presupposition model?

  *   **Host Follow-Up (If she says: "It's a conceptual claim, not empirical"):**
      "If it's immune to empirical evidence, how do we adjudicate between your view and a rival view that says the exact opposite? Is the tie-breaker just which one feels more intuitive to us in the moment?"
