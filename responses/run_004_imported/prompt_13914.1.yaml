      *   Good's theorem assumes $U(World, Action)$. This is the technical loophole.
      *   *Self-Correction:* Actually, standard decision theory *can* incorporate the cost of information processing. But Good's specific theorem on the *value of information* assumes the cost is zero. If the psychological pain is considered a "cost," the theorem allows refusal. The partner says the info is "free." I need to argue it's not free.
      *   *Better Argument:* The *action* is "living with hope." If knowing the prognosis makes "living with hope" impossible, then the action space changes.
      *   *Best Argument:* **Time Inconsistency.** The "Rational Agent" in Good's theorem is a timeless calculator. The mother is a being in time. Her utility function changes based on what she knows.

  7.  **Final Polish:**
