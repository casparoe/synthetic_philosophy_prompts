      *   **Point 1: Utility of Belief (Hedonic Utility of Knowledge).** Good's theorem assumes you only care about the *outcome* of the decision. It ignores the *experience* of holding the belief. If knowing the truth destroys the quality of life *now* (the "living dead" phenomenon), and the decision (e.g., stay in the house) remains the same regardless, the info has negative value.
      *   **Point 2: Pre-commitment / Ulysses Contracts.** The character may have pre-committed to a strategy ("I will fight until I can't"). If the prognosis won't change that strategy, the info is useless. If the info causes pain, it's harmful.
      *   **Point 3: Model Uncertainty (Knightian).** Medical stats are population-level. Applying them to an individual is epistemologically shaky. Refusing the number isn't ignoring data; it's rejecting the model's applicability.
      *   **Point 4: The "Rationality" of Hope.** Hope isn't just a bias; it's a functional resource. If hope improves physiological outcomes (placebo, stress reduction), then preserving hope *is* the rational medical strategy. Knowing the prognosis destroys hope, thus worsening the medical outcome.

