  8.  *(Self-Correction during drafting)*: I should check if Good's theorem actually accounts for the *cost* of acquiring information. Yes, the theorem states $Value(Info) = Expected\_Utility(With Info) - Expected\_Utility(Without Info) - Cost(Info)$. If Cost > Benefit, don't look. The partner argues Cost = 0. I must argue Cost > 0 (psychological toll) OR that Benefit = 0 (won't change action).
      *   *Wait, one nuance:* Good's theorem says *expected* utility. Even if the news is bad, knowing it allows preparation. Why is preparation less valuable than hope?
      *   *Answer:* Because for some people, the *quality* of the remaining time is the utility metric, not the *optimization of resources*. If knowing the end is near makes the time feel like a countdown (low quality) vs. living day-to-day (high quality), then the utility of the *experience* is lower with the info.
