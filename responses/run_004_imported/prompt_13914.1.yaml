      *   **Constraint:** If the partner is actually right, admit it plainly. Don't just wave hands at "people are complicated." Dig into the premises of the theorem.

  2.  **Deconstruct Good's Theorem:**
      *   *What is it?* I.J. Good's 1967 theorem states that for a rational Bayesian agent, the expected utility of obtaining free information is always non-negative. In other words, you should never ignore free information if it can influence your decision.
      *   *Key Assumptions:*
          1.  **Bayesian Rationality:** The agent updates beliefs strictly according to Bayes' rule.
          2.  **Utility Maximization:** The agent acts to maximize expected utility.
          3.  **Costless Information:** The information itself has no direct cost (money, time, etc.).
          4.  **Stationary Preferences:** The utility function doesn't change *because* of the information.
          5.  **Single Agent:** It's a decision theory for one mind.
          6.  **Information is Action-Guiding:** The information must be capable of changing the action taken.

  3.  **Evaluate the Character's Situation against the Assumptions:**
      *   *Is the information costless?* Physically, yes. Psychologically? Maybe not. But Good's theorem usually assumes "cost" is external. However, if the *state of knowing* affects utility directly (not just via action), that's a violation.
      *   *Does the information change the action?* The partner argues yes (treatment vs. hospice). The character might argue no (I will do what feels right in the moment regardless).
      *   *The Crucial Violation:* **Utility depends on the state of knowledge itself.** Good's theorem assumes utility depends on the *state of the world* and the *action taken*. It assumes $U(Action, World)$. It does *not* account for $U(Action, World, Knowledge)$.
      *   *Example:* If knowing the prognosis causes immense suffering (disutility) that outweighs the marginal gain in decision optimization, a rational agent *might* refuse it. But wait, Good's theorem accounts for the *expected* utility. If the info helps you choose better, the gain should outweigh the cost.
      *   *Wait, deeper violation:* **Time Inconsistency / Hyperbolic Discounting.** Humans aren't single, static utility maximizers. We are sequences of selves. The "Current Self" might value "Hope" more than "Optimal Outcome."
      *   *Even deeper violation:* **The Definition of the Decision.** If the character decides *now* that she will not let statistics dictate her remaining time, then the prognosis *cannot change her action*. If $P(Action | Info) = P(Action | No Info)$, then the Value of Information (VoI) is zero. If the psychological cost is positive, VoI is negative.
      *   *Another angle:* **Ambiguity Aversion / Knightian Uncertainty.** Good's theorem assumes risk (known probabilities). Medical prognoses are often ambiguous (model uncertainty).
      *   *Another angle:* **Control and Identity.** If the action is "maintain identity as a fighter," knowing the prognosis undermines the ability to perform that action authentically.

  4.  **Formulate the Argument:**
