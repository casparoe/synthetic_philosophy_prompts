answer: |-
  Your partner is technically correct about the math, but he is applying a theorem to a human context where the axioms of that theorem do not hold. He is treating your character like a disembodied Bayesian calculator, but Good's Theorem relies on specific assumptions about utility and information that break down in the context of terminal illness and human psychology.

  You do not need to write your character as "flawed" or "irrational." You can write her as **rationally operating under a different utility function** than the one Good's Theorem assumes.

  Here is the strongest possible argument you can make, digging into the specific premises of Good's Theorem that your character's situation violates.

  ### 1. The Violation of "State-Independent Utility"
  **The Theorem's Assumption:** Good's Theorem assumes that the utility (value) of an outcome depends only on the *state of the world* and the *action taken*. It assumes $Utility = f(World, Action)$. It implicitly assumes that *knowing* the probability of the world state does not itself change the value of the outcome.

  **The Character's Reality:** For a person facing mortality, the utility function is **state-dependent on knowledge**. $Utility = f(World, Action, Knowledge)$.

  If your mother hears a prognosis of "six months," the *objective* state of the world (her biology) hasn't changed yet. But her *experience* of those six months changes radically.
  *   **Without Prognosis:** She experiences time as "living."
  *   **With Prognosis:** She experiences time as "counting down."

  If her goal is to maximize the *quality* of her remaining consciousness (a perfectly rational goal), and knowing the prognosis demonstrably lowers that quality (by inducing existential dread, stripping away presence, turning moments into milestones), then the information itself carries a massive **negative utility cost**.

  Good's Theorem allows for information costs (it says: acquire info if $Benefit > Cost$). Your partner argues the cost is zero because the doctor offers it for free. But the *psychological* cost is not zero. If the disutility of living in a "countdown" state outweighs the marginal utility gain of optimizing her finances or treatment, a rational agent **must** refuse the information. This isn't a flaw; it's a correct calculation of a high information cost.

  ### 2. The Violation of "Action Elasticity" (Value of Information is Zero)
  **The Theorem's Assumption:** Information has value only if it has the potential to change your decision. If you would take Action A regardless of what the data says, the Value of Information (VoI) is zero.

  **The Character's Reality:** Your character may have already made a **pre-commitment** (a Ulysses Contract).

  She may have decided: *"I will stay in this house until I physically cannot climb the stairs, regardless of how long that takes."* Or, *"I will not undergo palliative sedation until I am in uncontrollable pain, regardless of life expectancy."*

  If her decision policy is **inelastic** with respect to the prognosis, then the VoI is mathematically zero.
  *   If the prognosis is 6 months: She stays in the house.
  *   If the prognosis is 2 years: She stays in the house.

  If the information cannot change the action, Good's Theorem says you are indifferent to the information *unless* it has a cost. As established in point #1, if the information has a psychological cost, and the VoI is zero, the rational move is **refusal**. She isn't ignoring the data to make a better decision; she has decided that the data is irrelevant to her chosen mode of being.

  ### 3. Knightian Uncertainty vs. Risk
  **The Theorem's Assumption:** Good's Theorem operates under conditions of **Risk**, where probabilities are known and reliable (e.g., a deck of cards).

  **The Character's Reality:** Medical prognoses are conditions of **Knightian Uncertainty** (or ambiguity), where the probability distribution itself is unknown or unreliable.

  A prognosis is a statistical aggregate of thousands of patients applied to one unique individual. A rational agent can argue that the "evidence" offered is not actually evidence *for her*, but evidence for a population she does not fully belong to.
  *   **Bayesian Update:** To update her priors, she needs to trust the likelihood function $P(Data | Hypothesis)$.
  *   **The Refusal:** She may rationally assess that the doctor's model has such high variance or model error regarding *her specific biology* that the "signal" is indistinguishable from noise.

  If she views the prognosis as "noise" rather than "signal," ignoring it is not irrational; it is **noise filtering**. Accepting a flawed model as truth would be the actual rationality failure. She is refusing to let a population statistic overwrite her lived reality.

  ### 4. Hope as a Causal Variable (The Placebo Effect)
  **The Theorem's Assumption:** The state of the world evolves independently of the agent's beliefs about it.

  **The Character's Reality:** In health outcomes, **belief affects the outcome.**

  There is robust literature on the "nocebo" and "placebo" effects. If hearing a grim prognosis increases stress hormones, depresses immune function, or reduces the will to engage in rehabilitative behaviors, then hearing the prognosis *causes* the outcome to be worse.
  *   **Scenario A (Ignorance):** She believes she might beat the odds. Stress is lower. Immune function is better. Survival = 10 months.
  *   **Scenario B (Knowledge):** She knows the stats. Stress spikes. Survival = 6 months.

  In this feedback loop, the information is not passive; it is **performative**. A rational Bayesian who understands that their belief state influences the physical outcome *should* cultivate the belief that maximizes survival/quality. If "ignorance" leads to a better physical outcome than "knowledge," then seeking the knowledge is objectively sub-optimal. This is sometimes called **instrumental irrationality** in standard theory, but in a biological system, it is **adaptive rationality**.

  ### Summary for Your Partner
  You can tell your partner this:

  > "Good's Theorem holds only if the utility function is independent of the information state, and if the information is costless. My character assigns a high negative utility to the *state of knowing* (it ruins her quality of life), and she has pre-committed to a policy that makes the information irrelevant to her actions (VoI = 0). Furthermore, she treats the prognosis as Knightian uncertainty (unreliable model) rather than Risk. Therefore, refusing the information maximizes her expected utility. She isn't violating Bayesian logic; she's using a more complex utility function than the theorem assumes."

  ### The Verdict for Your Draft
  Your partner is right that a *pure* Bayesian machine would take the data. But humans are not pure Bayesian machines; we are **expected utility maximizers with state-dependent preferences.**

  You do not need to slap a "flaw" label on her. Denial is often framed as a flaw in literature, but **strategic ignorance** is a recognized philosophical position.

  *   **Don't write her as scared.** (That implies a flaw/fear overcoming reason).
  *   **Write her as resolute.** (She has calculated that the cost of knowing is higher than the benefit of planning).

  If she says, *"Knowing the number doesn't change where I want to spend my days, but it would change how I feel while I'm there. I choose how I feel,"* she is not being irrational. She is prioritizing **experiential utility** over **instrumental utility**. That is a valid, defensible, and deeply human philosophical stance.

  **Bottom line:** Your partner is winning on statistics; you are winning on decision theory. Keep the scene. Just make sure her internal monologue reflects a *choice* to preserve her quality of life, rather than a *fear* of the truth. That shifts it from "character flaw" to "rational prioritization."
