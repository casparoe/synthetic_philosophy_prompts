answer: |-
  The paper sat on the metal table between them, crisp and white against the sterile gray. It was the only thing in the room that wasn't vibrating.

  Elias was vibrating. He paced the length of the small observation room, three steps one way, three steps back, his sneakers squeaking on the linoleum. He felt like a wire pulled too tight, humming with a voltage that could light up a city block.

  "Look at me, Aris," Elias said, stopping abruptly to lean over the table. His eyes were wide, the pupils dilated, swallowing the iris. "I'm not sick. I'm finally awake. Do you know what it's like to sleep for six months and wake up knowing the code?"

  Dr. Aris didn't look up. She kept her gaze on the document. She wore her reading glasses, the ones that made her look tired, older than the thirty-five years Elias knew she was. "I'm looking, Elias."

  "Then let me go. The meds are dulling the edge. I need the edge. I have work to do."

  "You have a Ulysses Directive, Elias." Aris tapped the paper with a manicured nail. "Signed eighteen months ago. Notarized. Witnessed by me and your sister."

  Elias laughed, a sharp, brittle sound. "That guy? That guy was gray. He was eating toast and staring at the wall for four hours. He was terrified of his own shadow. You're letting a ghost make decisions for a living man."

  "That 'ghost' knew you," Aris said softly. She finally looked up. Her expression wasn't angry; it was mournful. "He knew that when the voltage got this high, you wouldn't feel the burn. He knew you'd think you were a god. He wrote this specifically for this moment."

  "He wrote it from a place of fear!" Elias slammed his hand on the table. The paper didn't flutter. "People change, Aris. That's the whole point of being alive. If I sign a contract today saying I'll never eat sugar, does the government have to stop me from buying a cake five years from now? Is the past me the owner of the future me?"

  "This isn't about cake."

  "Isn't it? Who decides the threshold? You? Him?" Elias pointed at the signature at the bottom of the page. *Elias Thorne.* The handwriting was small, cramped, careful. The handwriting of a man trying to hold himself together with tape. "That signature is a shackle. It's a dead hand reaching out of the grave to choke the living."

  Aris turned the page. There was a second sheet, a personal addendum. "He anticipated this argument. Section 4, Paragraph B."

  She began to read, her voice level, filling the small room. *'If I claim I am cured, if I claim I am enlightened, if I claim that my stability is a prison: Do not listen. That is the sickness talking. It is the siren song. I am asking you to tie me to the mast, even if I beg you to cut the ropes. Especially if I beg.'*

  Elias went still. The vibration didn't stop, but he stopped moving. He looked at the paper as if it were a snake.

  "He knew," Aris said. "He knew you'd say exactly what you're saying right now. He knew you'd feel exactly what you're feeling."

  "But what if he was wrong?" Elias whispered. The intensity dropped, replaced by a sudden, terrifying vulnerability. "What if this time is different? What if the ghost was wrong about the living man? You're prioritizing the safety of the man who signed the paper over the truth of the man standing in front of you. You're valuing consistency over reality."

  "I'm valuing your survival," Aris said.

  "Am I surviving?" Elias stepped back, spreading his arms. "Or am I just existing in the box he built? If you lock me up, if you pump me full of chemicals until I'm that gray guy again... you're killing *me*. The me that is here, right now. You're executing the present to satisfy the past."

  Aris capped her pen. The click was loud in the silence. She stood up, picking up the directive. It was a shield, a weapon, and a death warrant all in one.

  "The Constitution isn't changed by a passing mood, Elias," she said, quoting the analogy from a lecture she'd once given him. "It's designed to withstand the heat of the moment. To protect the whole from the impulse of the part."

  "The Constitution is written by people who are dead," Elias said. "And we spend centuries trying to overturn it."

  "Not today." Aris moved toward the door.

  "Aris, wait."

  She paused, her hand on the handle.

  "If you walk out that door and lock it," Elias said, his voice steady, terrifyingly rational for the first time in hours, "you are proving him right. You are validating his fear. But you are also proving that I have no agency. That I am a child. That my 'yes' means nothing because his 'no' is written in ink."

  He took a step toward her. He didn't look manic anymore. He looked like a prisoner appealing to a warden who follows the rules.

  "If you keep me here," Elias said, "I will never forgive you. And when I get out, when the 'gray' comes back, I will thank you. And I will hate you for making me thank you. Is that the treatment plan? To make me hate the person who saved me?"

  Aris looked at him. She saw the brilliance in his eyes, the terrifying clarity. She also saw the crash that was coming, the inevitable ruin that waited at the end of this flight. She held the paper in her hand. It felt heavy, heavier than the few grams of pulp should allow.

  It was a promise made by a stranger who happened to share her patient's name. A promise to betray him for his own good.

  "I'm sorry, Elias," she said.

  "For what? For listening to him? Or for not listening to me?"

  Aris didn't answer. She opened the door. The orderly was waiting in the hall. The lock clicked shut behind her, a solid, final sound.

  Inside, Elias stood alone with the silence. He looked at the empty chair where Aris had sat. He didn't know if he was a god being caged or a patient being saved. He only knew that the man who signed the paper had won, and the man standing in the room had lost.

  He wasn't sure which one of them was actually him.
