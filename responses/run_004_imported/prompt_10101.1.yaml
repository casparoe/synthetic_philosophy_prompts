      *   **Task:** Write a short story (1-2 pages) for a creative writing elective.
      *   **Core Conflict:** Past Self (stable, rational, signed the contract) vs. Present Self (manic/psychotic, begging for freedom).
      *   **Tone/Ending:** Ambiguous. No neat resolution. It must sit in the question of authority/autonomy. Who has the right to decide?
      *   **Characters:** A patient (let's call him Elias) and a mediator/doctor/family member (let's use a doctor, Dr. Aris, to keep it clinical but personal).

  2.  **Deconstruct the Conflict:**
      *   *Past Elias:* Rational, scared of his own potential, values long-term safety over short-term freedom. He signed the paper. He is the "Constitution."
      *   *Present Elias:* Manic, feeling godlike, convinced he is cured/enlightened, values immediate autonomy and vision. He feels imprisoned by a "dead" version of himself.
      *   *The Enforcer:* Dr. Aris. She holds the keys. She represents the state/society enforcing the contract. She needs to be empathetic but firm, highlighting the tragedy of the situation.

  3.  **Setting the Scene:**
      *   A quiet room in a psychiatric facility.
      *   The physical contract (the "Advance Directive") should be a prop.
      *   Sensory details: The hum of the lights, the texture of the paper, the feeling of restraint (metaphorical or literal).

  4.  **Drafting - Section by Section:**

      *   **Opening:** Establish the immediate tension. Elias is demanding release. Dr. Aris is holding the document.
      *   **The Argument (Present Self):** Elias needs to sound manic but *convincing*. Not just raving, but philosophically potent. He feels alive. He argues that the person who signed the paper was "dead" (depressed/stable/bored) and doesn't understand who he is now.
      *   **The Counter (Past Self/Doctor):** Dr. Aris reads the words of Past Elias. These words need to be calm, prophetic, and heartbreaking. They need to predict exactly what Present Elias is saying.
      *   **The Climax/Turn:** The moment where the authority shifts. Elias tries to invalidate the signature. Dr. Aris has to make the choice.
      *   **The Ending:** No release. No clear victory. Just the weight of the decision. The door locks, but the question remains.

  5.  **Refining the Voice:**
      *   *Elias:* Fast-paced, metaphorical, intense. Uses words like "gravity," "flight," "muffled."
      *   *Dr. Aris:* Steady, weary, respectful. She isn't a villain; she's a trustee of the contract.
      *   *The Contract:* Needs to sound legal but personal. "I, Elias Thorne, being of sound mind..."

  6.  **Writing - Iteration 1 (Mental Outline):**
      Elias screams he's fine. Aris shows the paper. Elias says that guy was depressed. Aris says that guy knew you. Elias tries to grab the paper. Aris puts it away. Elias sits down, defeated but still believing he's right. Aris leaves.
      *Critique:* Too simple. Needs more philosophical weight on *why* the past self has authority.

  7.  **Writing - Iteration 2 (Focusing on the "Constitution" analogy):**
      Let's make the paper feel like a law. Let's have Elias argue that people change, so laws should change. Aris argues that some changes are destructive.
      *Key imagery:* The mast, the sirens. Maybe reference the myth subtly.

  8.  **Drafting the Content (incorporating into final output):**
      *   Start with the paper on the table.
      *   Elias pacing.
      *   Dialogue exchange: "He wasn't me" vs. "He was the only one who could save you."
      *   The specific clause: "Even if I scream."
      *   The ending needs to linger. Maybe Elias stops fighting but looks at Aris with pity, implying *she* is the one trapped by the rules.

  9.  **Polishing:**
      *   Check the length (1-2 pages).
      *   Ensure the ambiguity is preserved. Does the reader think Elias is manic? Yes. But do they also feel the injustice of silencing his current voice? Yes.
      *   Make sure the "Ulysses" theme is clear without being a lecture.

  10. **Final Review against constraints:**
      *   Short story? Yes.
      *   Past vs. Present self war? Yes.
      *   Ambiguous ending? Yes.
      *   Topic: Ulysses Contract? Yes.

  *(Self-Correction during drafting)*: I need to make sure Present Elias doesn't sound *too* crazy. If he sounds completely incoherent, the choice is easy. He needs to sound *plausibly* enlightened, making the doctor's decision to ignore him feel morally heavy. He should argue that stability is just a slower kind of death.

  11. **Final Polish:** Check pacing and dialogue tags. Ensure the emotional weight lands on the signature.

