answer: |-
  That is a fantastic rabbit hole. I.J. Good was indeed a brilliant figure at Bletchley Park (he worked on the statistical side of Enigma/Tunny) and later became a pioneer in Bayesian statistics and artificial intelligence.

  You have summarized **Good's Theorem** (often called the **Value of Information** theorem) correctly: *For a rational agent maximizing expected utility, the expected value of free, relevant information is always non-negative.*

  In plain English: **If you can get information for free, and you can use it to make a decision, you should never turn it down.**

  So, to answer your burning question: **Does this mean your friend avoiding the health test is irrational?**

  The short answer is: **According to the math, yes. According to psychology and reality, no.**

  Here is the breakdown of why the theorem holds up in logic but often breaks down in human life, and what that means for your decisions.

  ---

  ### 1. The "Rational Agent" vs. The Human
  Good's Theorem relies on a specific definition of "rationality" (Expected Utility Theory). It assumes your only goal is to maximize the quality of the *outcome*.

  *   **The Theorem says:** If you have a disease, knowing allows you to treat it (better outcome). If you don't have it, knowing gives you peace of mind (better outcome). Therefore, test.
  *   **The Human says:** My utility function includes **emotional state**.

  For a perfect Bayesian robot, "worry" is not a cost. For a human, "worry" is a massive negative utility. If your friend suspects a serious condition with no cure, knowing the truth might turn 6 months of hopeful ignorance into 6 months of confirmed dread. If she values *hope* as a component of her well-being, avoiding the test is actually rational *for her specific utility function*, even if it violates Good's Theorem.

  **Implication:** You are not irrational for avoiding information if the *act of knowing* causes you pain that outweighs the benefit of better planning.

  ### 2. Actionability is Key
  Good's Theorem assumes you can *act* on the information. Information is only valuable if it changes your decision.

  *   **Checking a Grade:** If the grade is final and you can't appeal it, and the class is over, the information has **zero instrumental value**. It cannot change the outcome. The only value is planning for the next semester. If checking it ruins your weekend, the cost outweighs the benefit.
  *   **Health Test:** If the condition is treatable, the info is high-value. If it is untreatable, the info has low instrumental value.

  **Implication:** Before seeking information, ask: *"Can I do anything differently based on what I find?"* If the answer is no, Good's Theorem loses its grip. Ignoring stock market noise during a long-term hold is a perfect example of this; you can't act on the daily fluctuations, so ignoring them preserves sanity.

  ### 3. Information is Rarely "Free"
  The theorem specifies **free** evidence. In the real world, information almost always has a cost.

  *   **Cognitive Load:** Processing bad news takes mental energy.
  *   **Opportunity Cost:** Time spent worrying about the grade is time not spent studying for the next exam.
  *   **Social Cost:** Asking certain questions can damage relationships.

  Your friend avoiding the health test isn't avoiding "free" info; she is avoiding the *cost* of anxiety, potential stigma, and the hassle of treatment. When you factor in those costs, the "Expected Value" of the information can easily turn negative.

  ### 4. The "Self-Fulfilling Prophecy" Problem
  Good's Theorem assumes the world is static until you act. But for humans, **knowing changes the reality.**

  *   **The Nocebo Effect:** If you find out you have a genetic marker for a disease, the stress of knowing might actually make you sicker.
  *   **Performance Anxiety:** If you check your grade early and it's a C, you might panic and bomb the final exam. If you hadn't checked, you might have studied calmly and gotten an A.

  In these cases, acquiring the information actively worsens the expected outcome, violating the theorem's assumptions.

  ---

  ### So, when should you actually use Good's Theorem?

  Even though it doesn't apply perfectly to humans, it is an incredibly useful **heuristic** (mental shortcut) for spotting when *you* are the one being avoidant.

  **Use Good's Theorem to check yourself when:**
  1.  **The info is actionable:** (e.g., Checking your bank balance before buying a car).
  2.  **The cost of ignorance is high:** (e.g., Ignoring a weird lump because you're scared).
  3.  **You are procrastinating due to fear, not logic:** If you admit that you *could* handle the bad news, but you're just delaying the discomfort, the theorem is right: rip the band-aid off. The anxiety of *waiting* is usually worse than the news itself.

  **Ignore Good's Theorem when:**
  1.  **You can't change the outcome:** (e.g., A grade that's already submitted).
  2.  **The emotional toll is disproportionate:** (e.g., Googling symptoms late at night).
  3.  **Preserving hope is the priority:** (e.g., Palliative care scenarios).

  ### The Verdict on Your Friend
  Your friend isn't "irrational" in the colloquial sense. She is optimizing for **emotional preservation** rather than **outcome maximization**.

  I.J. Good was designing logic for machines and idealized statisticians. Humans are not expected-utility maximizers; we are **meaning-and-comfort maximizers**. Sometimes, the most rational thing a human can do is protect their peace of mind, even if it means remaining slightly less informed.

  **TL;DR:** Good's Theorem proves that information is power. But it doesn't account for the fact that sometimes, ignorance is bliss. If the "bliss" helps you function better than the "power" would, you're making the right call for a human, even if a robot wouldn't.
