  okay so i went down a wikipedia rabbit hole that started at alan turing and somehow ended on this guy i.j. good, who was actually one of the codebreakers working with turing at bletchey park. later in life he proved this thing called good's theorem, which i think basically says that for a perfectly rational bayesian, getting more free evidence before you decide something can never make your expected outcome worse, only the same or better. can you give me the most important implications of that for normal personal-life decisions? like does it mean people who avoid finding stuff out on purpose, e.g. not checking a grade the second it posts, or my friend who won't get tested for a health thing bc she doesn't wanna know, are just being irrational? or are there real cases where the theorem's logic quietly breaks down for actual humans making decisions, not idealized bayesians?
