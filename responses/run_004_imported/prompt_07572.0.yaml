          *   Al-Ghazali = Theological/Metaphysical claim (secondary causes don't *really* do anything to protect Divine Omnipotence/Miracles).
          *   Distinction: Hume = Epistemology of causation; Ghazali = Metaphysics of omnipotence (occasionalism).
      *   **Specific Questions:**
          *   Am I overstating the gap?
          *   Is it fair to read Ghazali as making a full metaphysical denial vs. a dialectical move?
