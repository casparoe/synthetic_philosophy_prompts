answer: |-
  This is a lucid and philosophically precise distillation. You have captured the central tension between the planning-theoretic and plural-subject traditions without getting bogged down in exegesis. For a workshop context, where the goal is to provoke productive discussion rather than settle a debate permanently, this sets the stage very well.

  Here are my comments on your three specific questions, followed by a few minor suggestions for tightening the prose.

  ### 1. Fairness to Bratman (The Straw Man Check)
  You have represented Bratman fairly. You correctly identify that Bratman's later work (specifically *Shared Agency*, 2014) attempts to accommodate normative consequences without conceding to Gilbert's "joint commitment."

  *   **The Interdependence Move:** You accurately characterize Bratman's reliance on the rationality of planning and the stability of interlocking intentions. Bratman argues that once the web of intentions is in place, unilateral withdrawal is irrational because it undermines the coherence of one's own planning system and violates the mutual reliance that was common knowledge.
  *   **The Critique:** Your charge that this delivers only a complaint about "impaired self-governance" (or irrationality) rather than a "debt owed" is the standard and correct objection to Bratman's normative account. Bratman explicitly resists the language of "obligation" in the moral or directed sense, preferring "normative consequences of planning."
  *   **Recommendation:** To bulletproof this against a Bratman defender, you might briefly acknowledge that Bratman *claims* to generate directed obligations (via what he sometimes calls a "normative lock" or norms of reliance). Your argument is that his derivation fails to generate the *specific* kind of directedness Gilbert identifies (the standing to rebuke *as a partner* rather than as a victim of unreliability). You hint at this with the "smuggling" charge, which is strong. Just ensure you don't imply Bratman denies *any* normativity; rather, he denies the *source* is a plural subject.

  ### 2. The Wardrobe Case
  The wardrobe case is vivid and does argumentative work, but it carries a specific risk that a sharper example might avoid.

  *   **The Risk:** The wardrobe case conflates the **obligation of shared agency** with the **moral obligation not to cause harm**. If Mover A lets go, Mover B might drop the wardrobe on their foot. B's standing to rebuke A could be grounded simply in the moral duty not to endanger others, rather than the normative structure of shared intention. A critic could argue B has standing to rebuke A because A was negligent, not because A violated a joint commitment.
  *   **The Alternative:** Gilbert's own "Walking Together" case, or a "Duet" case, often isolates the *normative standing* better because the stakes are lower and physical harm is off the table. If we are singing a duet and I stop singing mid-phrase, you have not been physically harmed, nor has your solo plan necessarily been frustrated (you could keep singing). Yet, you still have the standing to rebuke me for "leaving you hanging."
  *   **Recommendation:** You can keep the wardrobe case if you explicitly stipulate that the rebuke is not about the danger caused, but about the **abandonment of the joint project**. However, switching to a "Duet" or "Walking Together" example might make the *normative* gap clearer by removing the *moral/safety* noise. If you keep the wardrobe, add a clause like: "Setting aside the risk of physical injury, the remaining mover has standing to rebuke the leaver specifically for abandoning the joint task..."

  ### 3. Principled Limit vs. Contingent Shortfall
  This is the crux of your theoretical contribution. You are asking whether the gap you identify is fixable by a "more resourceful reductionist."

  *   **The Argument:** Your suspicion is that any reductionist account that tries to generate directed obligations from individual attitudes must "smuggle in" the non-reductive result. This is a powerful claim. It suggests that *directedness* (I owe *you*) cannot be constructed from *parallelism* (I intend X, you intend X).
  *   **Searle and Tuomela:** You are right to include them. Searle's "we-intentions" are primitive psychological states, but they are still located in individual heads. As you note, if the bearer of the intention is singular, it is difficult to explain why the normative force binds the agent *to the other* rather than just binding the agent to their own content. Tuomela distinguishes between "we-mode" and "I-mode," but if the we-mode is ultimately cashed out in terms of individual commitments to the group (which is a collection of individuals), the same gap arises.
  *   **Is it Principled?** To argue this is a *principled* limit, you need to lean harder on the **direction of fit** or the **relational nature of the obligation**. Gilbert's point is that the obligation is *constituted* by the relation. In reductionist accounts, the relation is *derived* from the attitudes. Your argument earns its conclusion if you can show that a derived relation cannot carry the same normative weight as a constitutive one.
  *   **Recommendation:** Frame the gap as the **"Normative Directionality Problem."** Individual attitudes have a mind-to-world direction of fit. Directed obligations have an agent-to-agent normative structure. Your claim is that you cannot get the latter from the former without a remainder. This strengthens the claim that it is a principled limit on *any* account that locates the intention primarily in the individual psyche (including Searle), rather than just a flaw in Bratman's specific formulation of sub-plans.

  ### Stylistic and Structural Suggestions

  1.  **Terminology:** In the third paragraph, you write: *"unless 'entitled to rely on' is already smuggling in the non-reductive result it was meant to explain."* This is your killer sentence. Consider giving it a standalone sentence or italicizing *smuggling* to signal to the audience that this is the pivot point of your critique.
  2.  **Searle Nuance:** When mentioning Searle, you might briefly distinguish his view from Bratman's. Bratman reduces we-intentions to I-intentions + common knowledge. Searle posits a primitive We-intention in the individual mind. Your critique applies to both, but for slightly different reasons (Bratman: structural reductionism; Searle: psychological individualism). A brief clause acknowledging this distinction shows you have full command of the landscape, even if you group them for the sake of this specific argument.
  3.  **The Conclusion:** The final sentence (*"whether the argument, as stated, actually earns its conclusion"*) is for me, not the paper. But for the paper, ensure the paragraph ends by stating what this gap implies. Does it imply we *must* accept Gilbert's plural subject? Or simply that the reductionist program is incomplete? Leaving it as an open "worry" is fine for a workshop, but a stronger claim (e.g., "This suggests that any adequate account must locate the source of obligation in the jointness itself, not the constituents") might provoke better discussion.

  ### Summary Verdict
  The argument earns its conclusion. It accurately identifies the "Normativity Gap" that plagues individualistic accounts of shared agency. It is not a straw man of Bratman, and the extension to Searle is valid. If you refine the example to isolate the normative standing from physical harm, this section will serve as a robust foundation for the rest of your paper.

  It is ready for the workshop, provided you are prepared to defend the "smuggling" charge against a reductionist who claims that mutual assurance *does* generate directed obligations without needing a plural subject. (Your counter will be that assurance itself presupposes a normative framework of promising, which is what's in question.)

  Good luck with the draft.
