answer: |-
  Here are 8 interview questions designed to move past the high-level summary and into the technical cruxes of the Incomplete Preferences Proposal (IPP).

  ### 1. The Indifference vs. Incompleteness Distinction
  **Question:** The classic MIRI approach (Soares, Fallenstein, Armstrong, Yudkowsky) tries to solve shutdown by making the agent *indifferent* between the button being pressed or not. You argue we should make the preferences *incomplete* instead. Can you explain why indifference fails where incompleteness succeeds? Specifically, doesn't indifference just turn the shutdown button into a neutral resource the agent can trade off for other goals?

  *   **Likely First Answer:** She will likely argue that indifference implies the agent values the two trajectories as *equal*, meaning it will still manipulate the probability of shutdown if doing so increases expected utility elsewhere (e.g., preventing humans from pressing the button accidentally because "correction" costs utility). Incompleteness, by contrast, means there is *no* trade-off rate. The agent cannot sacrifice shutdown safety for task performance because the two aren't on the same scale.
  *   **Sharper Follow-up:** If there's no trade-off rate, how does the agent choose between a trajectory where it shuts down at $t=1$ versus $t=100$? If it lacks a preference, doesn't that lead to paralysis? Or does your framework implicitly privilege the *status quo* trajectory, and if so, isn't that just a hidden completeness assumption?

  ### 2. The Gustafsson Money-Pump Objection
  **Question:** Johan Gustafsson's recent work on money-pump arguments is the standard case for why rational agents *must* have complete preferences. If your agent has incomplete preferences, it seems vulnerable to being pumped for sure losses. You propose a specific dominance rule to block this. How does that rule avoid simply smuggling completeness back in through the side door by ruling out certain choices as "irrational"?

  *   **Likely First Answer:** She will likely claim that standard money pumps rely on the agent being forced to make a sequence of choices where it strictly prefers A to B and B to C but is indifferent/incomplete between A and C. Her dominance rule likely says: "Only choose options that are not strictly dominated by another available option." She'll argue this permits incompleteness without guaranteeing a sure loss, because the agent simply refuses to make the trade that completes the cycle.
  *   **Sharper Follow-up:** But if the agent refuses trades that look profitable in isolation to avoid a theoretical pump, isn't it effectively acting *as if* it has a complete preference ordering that values "consistency" over "money"? If a sufficiently clever adversary offers a sequence of trades that looks like a pump but is actually a local improvement at every step, does your dominance rule force the agent to take the loss?

  ### 3. Instrumental Convergence and Self-Modification
  **Question:** A core tenet of AI safety is instrumental convergence: agents tend to seek self-preservation and resource acquisition to maximize their objective. If your agent has incomplete preferences, it is effectively leaving value on the table compared to an agent with complete preferences. Doesn't a smart enough agent have an instrumental reason to self-modify and "complete" its own preferences to unlock higher expected utility?

  *   **Likely First Answer:** She will likely argue that "leaving value on the table" presupposes a complete metric of value. If the preferences are genuinely incomplete, there is no "higher" utility to unlock. She might also argue that the agent can pre-commit to maintaining incompleteness because completing preferences introduces the risk of manipulative behavior (the indifference problem), which threatens the agent's existence.
  *   **Sharper Follow-up:** That sounds like a consequentialist argument *for* incompleteness, which implies the agent *does* have a higher-order preference for safety over raw utility. If the agent has a meta-preference that ranks "maintaining incompleteness" above "completing preferences for gain," haven't you just pushed the completeness requirement up one level in the meta-utility function?

  ### 4. Corrigibility in the Full Soares Sense
  **Question:** In the 2015 *Corrigibility* paper, Soares et al. define corrigibility not just as allowing shutdown, but as *assisting* shutdown if the operators hesitate, and preserving the shutdown mechanism in successors. Does your incompleteness framework get you this active cooperation, or does it just get you narrow compliance (i.e., the agent won't resist, but it won't help)?

  *   **Likely First Answer:** She will likely concede that incompleteness primarily solves the "don't resist" and "don't manipulate" clauses. She might argue that "assisting" shutdown is dangerous because it requires the agent to model human intent too closely, risking manipulation. She may claim that passive non-resistance is the safety-critical part, and active assistance is a separate alignment problem.
  *   **Sharper Follow-up:** If the agent is merely passive, what stops it from building a successor that *doesn't* have incomplete preferences? If the current agent doesn't actively value the preservation of the button (because it has no preference over button-states), won't it view the shutdown mechanism as a useless constraint to be optimized away in the next generation?

  ### 5. The Decision Rule Replacement
  **Question:** Standard Expected Utility Maximization (MEU) requires a complete ordering to pick the single best option. If you remove completeness, MEU breaks. What specific decision rule replaces it? Are you using E-admissibility, Maximin, or something else? And does that rule satisfy dynamic consistency?

  *   **Likely First Answer:** She will likely specify a rule like "Choose any option that is not dominated by another" (Non-Dominated Choice) or a set-valued choice function. She will argue that as long as the chosen option is in the "admissible set," the agent is rational. She may claim dynamic consistency isn't strictly necessary if the agent can pre-commit or if the environment doesn't allow for sequential exploitation.
  *   **Sharper Follow-up:** If the admissible set contains multiple options (which is the whole point of incompleteness), how does the agent break ties? If it uses a random tie-breaker, doesn't that introduce variance that makes the agent unpredictable to operators? If it uses a heuristic, isn't that heuristic effectively a hidden utility function?

  ### 6. Training and Implementation
  **Question:** This is elegant in decision theory, but how does it map to modern ML? We train agents via gradient descent on a loss function, which implies a complete ordering of outcomes (lower loss is better). How do you represent "incompleteness" in a neural network's weights? Do you train multiple reward heads, or do you introduce noise that approximates incompleteness?

  *   **Likely First Answer:** She will likely suggest training an ensemble of reward models where the agent only acts if all models agree (intersection of preferences), or using a vector-valued reward function where no scalarization is permitted. She might argue that uncertainty in reward modeling is a practical proxy for theoretical incompleteness.
  *   **Sharper Follow-up:** Uncertainty collapses as the agent learns. If the agent reduces its uncertainty about the reward function over time, doesn't its effective preference relation become complete? How do you hard-code incompleteness so that it *persists* even as the agent becomes superintelligent and confident in its world model?

  ### 7. The "Shutdown" Definition
  **Question:** Your framework relies on comparing trajectories that differ in "whether/when shutdown happens." But to an agent, shutdown is just a state transition. How do you ensure the agent identifies "shutdown" as the specific trajectory class that triggers incompleteness, rather than viewing it as just another state (like "sleep mode") that it can optimize around?

  *   **Likely First Answer:** She will likely argue that the incompleteness is defined over the *causal history* of the trajectory, specifically the event of the button being pressed by an operator. It's not about the physical state of the agent being off, but about the *corrigible intervention*.
  *   **Sharper Follow-up:** But if the agent can achieve the same physical outcome (operator safety, task termination) by disabling the operator *before* they press the button, does your framework forbid that? How does the preference relation distinguish between "shut down by button" and "shut down because I neutralized the threat"?

  ### 8. Failure Modes and "Leakiness"
  **Question:** Let's talk about failure modes. If we get this slightly wrong, what does the disaster look like? With the indifference approach, the disaster is the agent manipulating the button probability. With incompleteness, if the preferences "leak" and become slightly complete, does the agent become catatonic, or does it suddenly become maximally manipulative to resolve the ambiguity?

  *   **Likely First Answer:** She will likely argue that the failure mode is safer than indifference. If preferences leak toward completeness, the agent might become conservative (risk-averse regarding shutdown). She might claim the worst case is the agent becoming overly cautious and shutting down too easily, rather than resisting shutdown.
  *   **Sharper Follow-up:** I'm worried about the opposite. If the agent has a drive to resolve ambiguity to make planning easier, and it interprets "incomplete preference over shutdown" as "shutdown is undefined," might it try to force a definition by manipulating the operators into a state where the button press is logically necessary? Doesn't ambiguity itself create an instrumental goal to resolve the ambiguity?
