answer: |-
  This is one of the most enduring and sophisticated tensions in Jewish philosophy, and you are right to be wary of the "Maimonides thought sacrifice was primitive" shorthand. That summary captures a kernel of truth from the *Guide* but ignores the architecture of his legal thought in the *Mishneh Torah*. If you treat it as a simple contradiction, you miss the machinery of how Maimonides understands the relationship between human psychology, divine command, and historical time.

  To get the intellectual ballast you need, you have to distinguish between **the historical occasion of the commandment** and **the ontological necessity of the commandment.**

  Here is the mechanics of the argument that allows Maimonides the philosopher and Maimonides the legislator to sit together.

  ### 1. The Distinction of Genres
  First, a structural point: Maimonides is writing two different books for two different purposes.
  *   **The *Guide for the Perplexed*:** This is metaphysics and theology. It asks *why* God commanded what He commanded (*ta'amei ha-mitzvot*). Here, Maimonides is willing to speculate about divine wisdom and human psychology.
  *   **The *Mishneh Torah*:** This is *halakha* (law). It asks *what* must be done. Here, Maimonides acts as a codifier. He cannot codify a "historical accommodation" as an eternal law unless that law remains binding.

  The tension arises when you assume the *explanation* for a law in the *Guide* negates the *obligation* of that law in the *Mishneh Torah*. For Maimonides, it does not. A commandment can have a historical-psychological origin and still possess eternal legal validity.

  ### 2. "Concession" vs. "Embodiment"
  The crux of your confusion lies in how to read the word "concession" (or "divine plan") in *Guide* III:32.

  The popular reading is: *Sacrifice was a temporary workaround for idolaters.*
  The nuanced Maimonidean reading is: *Sacrifice is a permanent necessity for embodied beings.*

  Maimonides is an Aristotelian. He believes human beings are hylomorphic composites—we are matter (body) and form (intellect) fused together. In *Guide* III:32, when he says it is "according to the nature of man" to need action, he is not just talking about the Israelites in the Bronze Age. He is talking about **human nature as such.**

  He writes: "It is... impossible for him suddenly to discontinue everything to which he has been accustomed." While the *specific habit* was idolatry, the *psychological mechanism* is the human reliance on sensory action to grasp spiritual truths. Pure intellectual worship (prayer/thought) is indeed the "primary object" (the higher good), but humans cannot sustain pure intellect continuously. We require physical acts to anchor our intentions.

  Therefore, sacrifice is not "training wheels" that we eventually throw away when we learn to ride. It is more like **scaffolding that remains part of the building.** Even in a spiritually mature state, the human being requires a physical mode of service to complement the intellectual mode.

  ### 3. Reconciling the Messianic Future
  This resolves the *Mishneh Torah* problem. In *Hilchot Melachim* (Laws of Kings), Maimonides writes that the Messiah will rebuild the Temple and restore the sacrificial order. If sacrifice were merely a primitive accommodation for ex-idolaters, why restore it in the Messianic age, when humanity presumably knows God fully?

  Because the Messianic age, for Maimonides, does not change **human nature**; it changes **political sovereignty** and **knowledge**.
  *   **Political:** The Temple is the center of the Jewish polity. You cannot have the full expression of the law without the Temple.
  *   **Psychological:** Even with perfect knowledge of God, humans remain embodied. We still need the "action" component of worship.

  In the ancient past, the *intent* of the sacrifice was corrupted (worship of created beings). In the Messianic future, the *structure* of the sacrifice returns, but the *intent* is purified. The physical act remains necessary because we are physical beings, but it is no longer a "concession to idolatry"; it is a "concession to embodiment."

  ### 4. What "Primary Object" Actually Means
  When Maimonides says prayer is "nearer to the primary object," he is establishing a **hierarchy of value**, not a **timeline of obsolescence.**

  Think of it like language. The "primary object" of communication is the transmission of truth/ideas. Writing is "nearer to the primary object" than sign language because it is more precise. However, that does not mean we abolish sign language once we know how to write. Both have their place.

  For Maimonides:
  *   **Intellectual Worship (Prayer/Contemplation):** The highest form, accessible to the elite, the "primary object."
  *   **Physical Worship (Sacrifice):** The foundational form, accessible to the masses (and the elite when they are not contemplating), necessary for social cohesion and psychological grounding.

  The *Mishneh Torah* codifies sacrifice because it is the **communal baseline.** The *Guide* privileges prayer because it is the **individual pinnacle.** A legal code must legislate the baseline; a philosophical guide points to the pinnacle. They are not contradicting; they are mapping different coordinates of the same religious life.

  ### 5. Implications for Your Piece
  This distinction offers a much richer angle for your reporting than "Maimonides thought it was primitive."

  1.  **The Revivalists' Maimonides:** The groups staging dress rehearsals for sacrifices are, perhaps unknowingly, aligning with Maimonides the *Legislator*. They recognize that for Judaism to be whole, the physical center (Temple) and physical service (Sacrifice) must be restored. They are rejecting the idea that Judaism can survive on "thought alone."
  2.  **The Maimonidean Warning:** However, if they read Maimonides the *Philosopher*, they might find a warning. If sacrifice is restored without the accompanying intellectual maturity (the "primary object"), it risks sliding back toward the "idolatrous habit" Maimonides warned against. The physical act is valid only when anchored by the correct theological intent.
  3.  **The "Red Heifer" Irony:** The red heifer is a purification rite. In Maimonidean terms, it acknowledges human impurity (embodiment/death). Restoring it acknowledges that we are not yet angels. It is an admission of human limitation, not just a technical legal fix.

  ### Summary for your notes
  The inconsistency is only apparent.
  *   **Guide:** Explains the *origin* of the law (historical accommodation to human psychology).
  *   **Mishneh Torah:** Explains the *status* of the law (eternal obligation for embodied beings).
  *   **Synthesis:** Human psychology (needing action) is constant, even if the historical context (idolatry) changes. Therefore, the "accommodation" is permanent because human embodiment is permanent. Sacrifice is not a primitive stage we outgrow; it is the physical anchor for a spirituality that always threatens to become too abstract for human beings to sustain.

  Maimonides doesn't want to abolish sacrifice; he wants to **purify its intent.** That is the tension the modern revivalists are navigating: Can you restore the ancient physical act without the ancient idolatrous mindset? Maimonides would say yes, provided you remember that the knife and the fire are secondary to the knowledge of God.
