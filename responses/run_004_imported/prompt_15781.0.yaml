          *   *Moderate Communitarian (inspired by Kwame Gyekye):* Community shapes personhood, but there must be an innate individual endowment (rational agency, will) beforehand. Personhood isn't *solely* conferred.
      *   **Format:** A dialogue between two philosophers.
      *   **Requirements:**
