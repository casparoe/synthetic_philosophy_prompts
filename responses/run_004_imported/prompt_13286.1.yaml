answer: |-
  This is a wonderful question. It is rare to see someone bridge the gap between 16th-century confessional theology and 20th-century analytic moral philosophy with such precision. You are right to sense that the argument in Article XIV is "slippery." That is because it is a compressed polemic; it relies on a set of metaphysical and anthropological premises that the authors assumed were shared, but which are invisible to a modern secular reader (and even to many modern Christians).

  As a chemist, you might appreciate this analogy: The Catholic theology of the time viewed merit like a stoichiometric reaction where human effort could produce a surplus product. The Reformers argued the reaction equation was unbalanced; the human reactant is impure, so the yield can never exceed the theoretical maximum, let alone create a surplus.

  Here is a walk-through of the theological logic, followed by an analysis of whether it has any traction against the secular philosophy of Urmson and Wolf.

  ### Part 1: Decoding Article XIV
  To understand why claiming "supererogation" is labeled "arrogant and impious," we have to reconstruct the Protestant view of **Duty** and **Human Capacity** that undergirds the text.

  **1. The Definition of Duty (The Law is Total)**
  In the Catholic scholasticism the Reformers were attacking, God's commandments were often divided into "precepts" (binding on all) and "counsels" (advice for the spiritually elite, like poverty or celibacy). If you followed the precepts, you were saved. If you followed the counsels, you built up a "surplus" of merit.
  The Reformers rejected this division. They argued that the Great Commandment ("Love the Lord your God with all your heart, soul, and mind") is a single, total demand. There is no "base level" of duty. Duty is perfection.
  *   **The Arrogance:** To claim you have done *more* than duty requires implies that you have successfully completed the *basic* requirement. Since the basic requirement is total perfection, claiming to have finished it is the height of arrogance. It claims a sinless perfection that no human possesses.

  **2. The Nature of the Agent (Total Depravity/Incapacity)**
  This is the hidden premise. Protestant theology holds that human nature is fundamentally corrupted (sinful). Even our "good" works are tainted by selfish motive or imperfect faith.
  *   **The Math:** If your duty is 100 units of perfect love, and your maximum capacity is 80 units of tainted love, you are always in deficit.
  *   **The Claim:** To say "I have done 110 units" is not just a math error; it is a lie about the human condition.

  **3. The Nature of God (Impiety)**
  This addresses the "impiety" charge. In the medieval economy of salvation, merit was transferable. You could do "extra" works, put them in the "Treasury of Merit," and the Church could dispense them to others (Indulgences).
  *   **The Impiety:** This system implies God is a debtor. It suggests a human can put God in their debt—that God *owes* the human a reward for work beyond the contract. The Reformers viewed this as an insult to God's sovereignty. God owes man nothing; man owes God everything. To claim a surplus is to try to reverse the Creator/creature relationship.

  **4. The "Unprofitable Servants" (Luke 17:10)**
  You guessed correctly on the source. In that parable, a master tells a servant who has done all his chores not to expect a banquet, but to keep serving.
  *   **The Function in the Argument:** This quote is the *reductio ad absurdum* of supererogation. Jesus is establishing the baseline: Obedience is not a currency you earn with; it is the rent you pay for existence. If doing *everything commanded* makes you "unprofitable" (i.e., you haven't generated a surplus), then logically, there is no category of action left that *could* constitute a surplus. The category is empty.

  ### Part 2: Does this bite Secular Moral Philosophy?

  Now to your crucial question: Does this 16th-century theological grenade have any shrapnel that reaches J.O. Urmson or Susan Wolf?

  **The Short Answer:**
  No, not directly. The theological argument is **soteriological** (about salvation and standing before God), while the secular argument is **normative** (about how we should live together and judge character). They are playing different games with different scorecards.

  **The Nuanced Answer:**
  While the specific theological premises don't carry over, the *structural tension* Article XIV identifies is actually the exact same tension that drives the secular debate. Here is where the "bite" might be felt:

  **1. The Problem of the "Threshold of Duty"**
  *   **Secular View (Urmson):** Urmson argued against Utilitarianism. Utilitarianism says "Maximize the good." If that's your duty, then giving all your money to charity is *required*, not supererogatory. Urmson wanted to save supererogation by lowering the threshold of duty to "reasonable expectations."
  *   **Theological View (Article XIV):** The Reformers argued the threshold of duty is *maximal* (Perfection).
  *   **The Clash:** If the secular moral philosopher accepts the Reformers' definition of duty (that we owe our neighbors everything we can possibly give), supererogation vanishes in secular ethics just as it does in theology.
  *   **The Bite:** Article XIV challenges the secularist to justify *why* the threshold of duty is set where it is. If I say, "It's good to jump on a grenade, but not required," the Reformer asks: "On what basis do you claim you owe your neighbor less than your life?" The secularist must argue for a limited obligation without relying on divine grace.

  **2. The Psychology of "Moral Credit"**
  *   **Secular View:** We praise the hero. We acknowledge they did "above and beyond." This reinforces social goods.
  *   **Theological View:** Claiming "above and beyond" corrupts the agent (pride) and insults the recipient (God).
  *   **The Bite:** Susan Wolf's "Moral Saints" argues that a life devoted entirely to moral goodness is unattractive and perhaps irrational. Article XIV argues that a life devoted to moral goodness (in the sense of accumulating merit) is impossible and blasphemous.
      *   Wolf worries that the Moral Saint has no room for hobbies or humor.
      *   The Reformers worried that the "Moral Saint" (the Catholic ascetic) has no room for grace.
      *   **Convergence:** Both suggest that framing morality as a system of *credit accumulation* is dangerous. Wolf thinks it makes you boring; the Reformers thought it made you damned. There is a shared insight here: **Moral accounting is psychologically and socially corrosive.** If you start tracking who is "in surplus" and who is "in deficit," you destroy community (Wolf) or faith (Reformers).

  **3. The "Unprofitable Servant" and Moral Luck**
  In secular ethics, we often acknowledge that our ability to do good is dependent on luck (health, wealth, opportunity).
  *   The "Unprofitable Servant" line resonates here. Even if I give a million dollars to charity, I am only using resources I did not create, in a body I did not build, in a society I did not found.
  *   A secularized version of Article XIV might argue: Claiming an act is supererogatory implies a level of autonomy and ownership over one's capacities that we don't actually possess. We are always "unprofitable servants" of our biology and society. Therefore, humility is required, even in heroism.

  ### Summary for your Book Club

  If I were to distill this for your discussion group:

  1.  **The Theological Argument:** Supererogation is impossible because Duty = Perfection, and Humans < Perfection. Therefore, Surplus = 0. Claiming Surplus > 0 is a lie (Arrogance) and an attempt to debt God (Impiety).
  2.  **The Secular Argument:** Supererogation is necessary because Duty = Reasonable Expectation, and Humans > Reasonable Expectation. Therefore, Surplus > 0.
  3.  **The Interaction:** The theological argument fails against the secular one because secular ethics does not posit a Divine Creditor who demands perfection.
  4.  **The Residual Bite:** However, Article XIV highlights a risk in secular supererogation: **Moral Self-Congratulation.** If we categorize acts as "above and beyond," we risk creating a two-tier morality where the "saints" look down on the "merely obedient." The Reformers would warn that even in a secular context, treating morality as a hierarchy of merit undermines the equality of moral agents.

  **Recommendation:**
  You might find it fascinating to read **Bernard Williams**'s critique of "moral obligation." He argues that the modern concept of "obligation" is actually a secularized hangover from divine law (which is exactly what the Reformers were fighting about). If Williams is right, then Urmson and Wolf are trying to solve a puzzle using pieces that only make sense in the theological framework they rejected.

  Your minister friend is right that the term is tangled in Catholic theology, but Urmson was right that the *phenomenon* (heroism vs. duty) is real. The Article XIV argument doesn't disprove the phenomenon; it just forbids us from keeping score.
