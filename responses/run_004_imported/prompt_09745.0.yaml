  *Wait, one more check:* The prompt asks for "two causal decision theorists." It might be more fun to make them *actual* theorists or at least treat them as such for the sake of the argument's weight. I'll strike a balance: they are students, but they are arguing *as* theorists. I won't explicitly label them "high schoolers" in the text to maintain the philosophical gravity, but the setting can imply it. Actually, better to just make them generic interlocutors to focus on the philosophy. Let's go with "Elena" and "Marcus."

  *Refining the Ratifiability Argument:* Elena needs to explain that if I decide Damascus, I must believe I will go to Damascus. If I believe I will go to Damascus, I must believe Death predicts Damascus. If I believe Death predicts Damascus, I believe Death is in Damascus. Therefore, $EU(Damascus) = 0$. This makes the decision unratifiable.
  *Refining the Anti-Ratifiability Argument:* Marcus needs to say that CDT partitions by *causal* states. The causal state (Death's location) is fixed. My decision doesn't change the probability of the causal state. Therefore, $EU$ is calculated based on the prior. Ratifiability imports Evidential Decision Theory (EDT) logic into CDT.

