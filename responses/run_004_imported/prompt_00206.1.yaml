answer: |-
  This is exactly the right worry to have. You've put your finger on the single most persistent criticism of teleosemantics: the **Indeterminacy of Function** (sometimes called the "Qua Problem").

  You are correct that simply appealing to "selection history" doesn't automatically dissolve the disjunction. If selection is a blind process acting on phenotypes, why does it select for a mechanism that represents *flies* rather than *small dark moving things* (SDMTs) or *ambient nutrition*?

  Here is the walk-through of the mechanism teleosemanticists (specifically Ruth Millikan, the heavyweight here) use to block this, followed by the gut check on whether it holds water.

  ---

  ### 1. The Mechanism: Proper Function + Consumer Semantics

  To see how they block the disjunction, you have to look at the two pillars of Millikan's theory: **Proper Function** and the **Consumer Theory of Content**.

  #### A. Proper Function (The Historical Anchor)
  A trait has a "proper function" if it is a reproduction of an ancestor trait that performed that same function, and that performance contributed to the proliferation of the ancestor.
  *   **The Frog:** The frog's fly-detecting neuron exists because ancestor frogs had neurons that fired at flies, leading to snaps, leading to nutrition, leading to reproduction.
  *   **The Block:** The function is not defined by what the mechanism *actually* does now (snapping at BBs), but by what it *was selected for doing* in the past (snapping at flies). This handles the **Fly vs. SDMT** disjunction immediately: The mechanism was not selected for snapping at SDMTs *qua* SDMTs; it was selected for snapping at them *qua* flies. The BB is a "false positive" because it triggers the mechanism without satisfying the historical success condition.

  #### B. Consumer Semantics (The Content Fixer)
  This is the crucial move that addresses your "pushing back" worry. Millikan argues that the content of a representation is not determined solely by the **producer** (the neuron), but by the **consumer** (the snapping muscles/brain stem).
  *   **The Logic:** A representation means whatever the consumer system *needs to be true* in order to perform its proper function successfully.
  *   **The Application:** The snapping muscles have the proper function of catching nutrition. To do this, they need the tongue to project to a specific location in space occupied by a **material object**.
  *   **Why not "Nutrition"?** If the content were merely "nutrition exists," the muscles wouldn't know *where* to snap. The consumer needs spatial coordinates of a *thing*.
  *   **Why not "SDMT"?** If the content were "SDMT exists," the consumer would be satisfied by a BB. But the consumer's proper function is *nutrition*. Snapping at a BB fails the consumer's function. Therefore, the content must be specific enough to satisfy the consumer's historical success conditions.

  **The Synthesis:** The content is pinned down by the **intersection** of the producer's history and the consumer's needs. The neuron means "Fly" because that is the specific condition under which the producer historically succeeded *and* the consumer historically achieved its own function.

  ---

  ### 2. Blocking the Reformulated Disjunction (Fly vs. Nutrition)

  Your specific worry is: *Selection didn't select for "fly," it selected for "survival/nutrition." So why isn't the content "Food"?*

  Teleosemanticists block this using the **Normal Conditions** constraint.

  1.  **Specificity of Mechanism:** The visual mechanism is tuned to specific visual features (size, motion, contrast). It does not detect "nutrition" directly (it doesn't smell or taste before snapping). It detects *visual cues correlated with flies*.
  2.  **The Mapping:** For the consumer to succeed, the world must cooperate. The "Normal Condition" for the success of this system is that *things looking like X are actually flies*.
  3.  **The Content:** Therefore, the content is "Fly" (or "Prey with these visual properties"), not abstract "Nutrition." If the content were "Nutrition," the mechanism would be malfunctioning whenever it snapped at a non-nutritious fly (e.g., a toxic bug that looks like a fly). But intuitively, the frog isn't misrepresenting a toxic fly; it's representing a fly correctly and just getting unlucky with the outcome. Teleosemantics tries to separate the *truth condition* (is it a fly?) from the *success condition* (is it nutritious?).

  **The Mechanism Summary:** Content is fixed by the **specific conditions required for the consumer to execute its function**, not the ultimate evolutionary goal (survival).

  ---

  ### 3. The Gut Check: Does it Work or Relocate the Worry?

  Here is the honest philosophical consensus: **It relocates the worry, but many think that's a victory.**

  #### Why it feels like a relocation (The Fodor/Price Objection)
  Fodor and others argue that teleosemantics suffers from the **Co-extension Problem**.
  *   **The Scenario:** Suppose that in the entire evolutionary history of the frog, *every* small dark moving thing *was* a fly. (No BBs existed in the ancestral environment).
  *   **The Problem:** If "Fly" and "SDMT" were co-extensive in the past, natural selection cannot distinguish between them. Selection selects for the phenotype, not the intension.
  *   **The Result:** The history is equally compatible with "Selected for Fly" and "Selected for SDMT." If the history doesn't distinguish them, the content remains indeterminate. Teleosemantics pushes the indeterminacy from "current causation" to "historical causation," but if history is coarse-grained, the problem remains.

  #### Why teleosemanticists think it works (The Normativity Victory)
  Proponents argue that even if co-extension is a risk, teleosemantics solves the **Normativity Problem**, which pure causal theories cannot touch.
  *   **Misrepresentation:** In a causal theory, if the neuron fires at a BB, it means "BB" (because it covaries). There is no error. In teleosemantics, firing at a BB is a **malfunction**. It violates the proper function.
  *   **The Win:** Even if we are fuzzy on whether the content is "Fly" vs. "Bug," we have successfully established that the system *can be wrong*. Pure causal theories cannot establish that the system can be wrong without appealing to ideal conditions (which leads back to circularity).

  #### The "Fly vs. Nutrition" Specifics
  On your specific worry about "Nutrition": Most teleosemanticists concede that content is somewhat coarse-grained. The content might be "Prey" rather than *Musca domestica*. However, they argue this isn't a bug, it's a feature. The frog doesn't have the conceptual capacity for "fly" in the human sense; it has a capacity for "edible moving thing." Teleosemantics captures this biological reality better than a theory that insists on hyper-specific content.

  ### Verdict
  *   **Does it solve the Disjunction Problem?** Yes, regarding false positives (BBs). It explains why snapping at a BB is an error.
  *   **Does it solve the Indeterminacy of Function?** Debatable. If historical properties were co-extensive, selection history cannot distinguish them.
  *   **Is it just a relocation?** In a sense, yes. It moves the problem from "What causes this state?" to "What function was this state selected for?" But since functions are normative (they allow for failure), this relocation is widely considered **progress**, even if it doesn't achieve metaphysical pinpoint precision.

  **Study Tip:** If you want to crush this in your chapter, focus on the **Consumer Theory**. That is Millikan's specific innovation to stop the "Fly vs. Nutrition" slide. The producer detects the cue, but the *consumer* defines the content based on what *it* needs to do its job. That's the linchpin.
