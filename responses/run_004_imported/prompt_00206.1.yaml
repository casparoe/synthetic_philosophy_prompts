          2.  Provide a "gut check" on whether it works or just relocates Fodor's worry.

  2.  **Deconstruct the Teleosemantic Solution (Millikan's Approach):**
      *   *Basic Idea:* Content is determined by the *proper function* of the mechanism producing the representation.
      *   *Proper Function:* What the mechanism was selected *for* doing in the past.
      *   *The Frog Case:* The frog's snapping mechanism was selected for catching *flies* (specifically nutritious bugs), not just moving dots. Why? Because catching moving dots *only* matters insofar as they are flies/nutrition. If the dots weren't flies, the snapping wouldn't have contributed to fitness.
      *   *The "Pushing Back" Worry:* Did selection select for "fly" or "nutrition"?
      *   *The Mechanism:* It hinges on the *conditions of successful performance*. The representation (the neural state) has the function of coordinating with a consumer system (the snapping muscles). The content is fixed by what the consumer system *needs* to be true for the action to succeed *in the way that explained the selection*.
      *   *Key Distinction:* Distal vs. Proximal. The mechanism is selected for responding to the *distal* cause (the fly) because that's what matters for reproduction, not the *proximal* cause (the retinal shadow), although the proximal cause is the immediate trigger.
      *   *Asymmetry:* There is an asymmetry between "fly" and "BB". A BB triggers the mechanism, but the mechanism wasn't selected for BBs. A fly triggers it, and the mechanism *was* selected for flies.

  3.  **Address the Specific "Reformulated Disjunction" (Fly vs. Nutrition vs. Moving Thing):**
      *   *Fly vs. Moving Thing:* Selection history distinguishes these because snapping at non-nutritious moving things (BBs) doesn't yield the reproductive benefit. The *success condition* is eating the fly, not just snapping at motion.
      *   *Fly vs. Nutrition:* This is the deeper worry. Did it select for "fly" or "protein"? Millikan argues content is tied to the *specific conditions* under which the mechanism operates successfully. If the mechanism relies on visual features of flies, the content is about flies, not abstract nutrition. (Though this is a contentious point).
      *   *The Consumer Side:* Millikan emphasizes the *consumer* of the representation. The snapping muscles need the tongue to go where the *fly* is. If the content were "nutrition," the muscles wouldn't know where to go. The content must be specific enough to guide the action.

  4.  **Evaluate the "Gut Check" (Does it work?):**
      *   *Strengths:* It naturalizes normativity (misrepresentation is possible if the mechanism fails its function). It handles false positives (BBs) well.
      *   *Weaknesses/Criticisms:*
          *   *The Indeterminacy of Selection:* Selection is coarse-grained. Did it select for "fly," "bug," "food," or "survival"? (The "Qua Problem").
          *   *Historical Ignorance:* How do we know the history? (Epistemic access problem, though maybe not metaphysical).
          *   *Swampman:* If history matters, Swampman has no content. (Counter-intuitive for some).
          *   *Fodor's Asymmetry:* Fodor argued SE theories don't solve the *synchronic* problem. Even if history fixes it, what fixes it *now*?
          *   *The "Pushing Back" Worry:* The user is right to be suspicious. Many philosophers think SE just moves the indeterminacy from "cause" to "function."

