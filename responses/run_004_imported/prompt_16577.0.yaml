answer: |-
  I'm a novelist. Which is a polite way of saying I make my living telling lies that feel like the truth. So when the family asked me to speak today, I assumed it was because I know how to arrange words to make people feel better. But I think it's actually because, for the last six years, I was the only one who understood what my grandmother was doing with that green notebook.

  You all saw it. The fat, green spiral-bound notebook she carried everywhere. The one she pulled out at the dinner table, in the car, in the middle of a sentence. When she lost her train of thought, she didn't struggle to find it in her head. She opened the book.

  For a long time, I think we looked at that book with pity. We saw it as a crutch. A sign of what the Alzheimer's was taking away. We thought she was compensating for a loss.

  But my cousin, who is sitting right there in the second row and knows much more about this than I do, sent me a text this week. She told me that, technically speaking, that notebook wasn't a tool. It wasn't a crutch. It was part of my grandmother's mind.

  There's a philosophical idea that says if you trust something completely, if you carry it everywhere, and if you access it as instantly as you access your own thoughts, then it isn't separate from you. The boundary of your self doesn't stop at your skin. It stops where your memory stops.

  For the last six years, while the disease was pruning the neural pathways in her brain, my grandmother wasn't losing her mind. She was moving it. She was migrating her self, day by day, into that green spiral.

  She didn't "look up" what she had for lunch. She remembered it, and the memory was stored in paper and ink. She didn't "check" our names. She knew us, and that knowledge lived in the pages. She trusted those entries more than she trusted the whispering confusion in her own head. And because she trusted them, they worked. As long as she had that book, she was still her. She was still the woman who knew the grocery list, the birthdays, and the stories.

  I write fiction. I build worlds out of things that never happened. My grandmother built a mind out of things that did. She was the most honest writer I know. She knew that memory is fragile, whether it's made of neurons or paper, so she made it durable. She made it external.

  And now, she's gone. The book is here, but the hand that held the pen is still.

  But if the Extended Mind thesis is true—and I think my cousin would insist it is—then memory is never just inside us. It's always reaching out. It's always leaning on the world.

  For six years, she leaned on that green notebook. Today, the notebook closes. But the system doesn't have to end.

  We are the family she left behind. We are the ones who remember the way she held the pen. We are the ones who remember the sound of the page turning. We are the ones who hold the stories she wrote down, and the stories she lived before she needed to write them.

  In a very real sense, the boundary of her mind didn't vanish on Monday. It just expanded again. It extended out of the book, and into us.

  So, I'm not going to tell you that she's in a better place. I'm not going to tell you that her memory will live on in our hearts, as if that's just a metaphor.

  I'm telling you that she taught us how to remember. She taught us that keeping someone alive is an active process. It's a practice. It requires paper, it requires ink, and it requires us.

  She trusted the book to hold her. Now, she's trusting us.

  Thank you.
