          *   *Critique:* This is a common simplification/heuristic of the pivotal voter proof (often associated with Geanakoplos or similar expositions), but there is a technical inaccuracy here. In the standard pivotal voter proof (e.g., Sen's or Geanakoplos's version), we usually track the position of a specific alternative $b$ relative to others, but the description "jump all at once from the very bottom of the social ranking to the very top" is slightly imprecise. Usually, the proof shows that voter $k$ is pivotal for *some* pair, or that $k$ dictates the position of $b$ relative to some other alternative $a$. However, the narrative flow captures the *core idea*: moving an alternative up individual rankings until social ranking flips, identifying the pivotal agent.
