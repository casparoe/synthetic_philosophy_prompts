answer: |-
  Good evening. For those of you who know Marco from his Sunday soccer league, you know him as a man of action. He runs, he shoots, he scores. For those of you who know Talia from the department, you know her as a woman of precision. She reads the field, she maps the play, she understands the geometry of the game.

  And for the rest of you—hello. I'm a novelist, and I'm honored to stand here.

  Talia and Marco met in a graduate seminar. Specifically, they met arguing. Most couples have a "how we met" story involving a spilled drink or a mutual friend. Talia and Marco have a footnote. They met debating a specific essay by Jorge Luis Borges about the nature of time.

  Now, I promise I won't turn this into a lecture. But to understand their love, you have to understand the fight. It's a fight they've been having for five years.

  Marco takes the hard line. He believes the essay argues that time doesn't actually exist. He thinks the self is an illusion, the world is an illusion, and the clock on the wall is just a habit we can't break. He wants the clean theory. He wants to stand outside the river and prove it isn't flowing.

  Talia takes the human line. She argues that the essay isn't about denying time, but about failing to deny it. She says the point isn't that the river isn't there; the point is that you can write a brilliant proof that the river is dry, and then step in it and get wet anyway.

  For a long time, I watched them circle each other on this. Marco wanting the perfect logic, Talia wanting the honest mess. But watching them plan this wedding, I realized something.

  A wedding is not a theory. You cannot vow "until death do us part" in a timeless void. You have to make that promise inside the very thing Marco wants to deny. You have to stand in the river. You have to agree to grow old, to change, to endure the hours and the years.

  Marco, you love the idea that time is a labyrinth we can solve. Talia, you love the truth that it's a labyrinth we have to walk. And that is why you work. Because Marco, you give Talia the courage to look for the exit. And Talia, you give Marco the grace to admit when he's still inside the walls.

  There is a moment in Borges's essay where he admits that despite all his logic, he still feels the passage of time. Marco calls this a failure of nerve. I call it the beginning of a marriage.

  So, my wish for you is this: May you continue to argue about the nature of the cage. But may you always find the courage to lose your nerve at the very end.

  For the rest of you, raise a glass. To Talia and Marco. To the tiger, to the river, and to the time they've decided to spend getting lost in them together.
