  *(Self-Correction Note during final polish)*: Make sure the distinction between "Expected Number" and "Probability of Being Alone" is clear without getting bogged down in math. Leo needs to explain *why* uncertainty leads to emptiness (the log-normal distribution effect). Maya needs to challenge *why* that uncertainty is justified.

  8.  **Final Polish:** Check the flow. Ensure the ending lands on the meta-disagreement (epistemology vs. ethics).

