          *   *Leo:* If you're wrong, we live in unnecessary fear/paralysis.
      *   **Resolution:** They shouldn't solve the Fermi Paradox. They should solve *what they are disagreeing about*. Is it math? Or is it how to act under uncertainty?
      *   **Ending:** A moment of shared perspective. The sky remains silent.

  5.  **Refining the Dialogue (Self-Correction during drafting):**
