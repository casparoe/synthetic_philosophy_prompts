  **(Post-Drafting Thought):** I need to be careful not to use the word "Molinism" too much if I want to comfort laypeople, but the students need to know I know. I will describe the *concept* clearly so the students recognize it, without necessarily lecturing the grandparents. Actually, using the term once or twice with explanation honors her career. Let's strike a balance: describe the *idea* primarily.

