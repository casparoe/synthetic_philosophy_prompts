answer: |-
  Good morning. For those who don't know me, I am [Name], and I had the privilege of being this woman's child.

  We are gathered here from different worlds. Some of you are family from my father's side, who hold deeply to the sovereignty of God and the certainty of His plan. Others are colleagues and former students of my mother, who spent forty years in the halls of the university defending the intricate mechanics of how that plan interacts with human freedom.

  If my mother were here, she would be worried that we are using the wrong words. She was a philosopher of precision. She spent her life arguing that God is not a puppeteer, pulling strings to make us dance. But she also insisted He is not a spectator, watching history unfold and hoping for the best.

  She believed that God is a composer.

  There is a story she told often, about the oak tree behind her childhood home. She said that before the foundation of the world, God knew—perfectly and completely—that my father would stand under that tree. God knew the wind in the leaves, the time of day, and the beating of my father's heart. And God knew that in those specific circumstances, my father would freely choose to ask for her hand.

  God did not make him do it. My father's love was his own. But God, in His wisdom, knew exactly which world to create—a world where that oak tree stood, where my father walked that path, where their freedom and His providence met under the branches.

  This was the heart of her life's work. She called it "middle knowledge." It is a complex phrase, but the comfort it offered her was simple: God is never surprised, yet we are never coerced.

  I know many of you are hurting today, asking why. In times like this, people often say, "Everything happens for a reason." My mother would gently correct that. She knew that saying can sound like fate, as if our choices don't matter or as if God forces tragedy to fulfill a quota. She didn't believe that. She believed that God weaves. He takes the threads of our free lives—our mistakes, our joys, our spontaneous loves under oak trees—and He weaves them into a tapestry that accomplishes His good purposes without violating who we are.

  To my father's family: She never doubted that God is King. She never doubted that His purposes stand forever. She simply believed that His power is so great, His knowledge so deep, that He doesn't need to override our freedom to ensure His victory. He knows us better than we know ourselves. He knows what we *would* do, and He loves us enough to let us do it, while still guiding the story home.

  To her students: She remained faithful to the logic she taught. She never collapsed into fatalism, nor did she retreat into a view where God simply watches the future from a distance. She held the tension until the end. She believed that even in this grief, God knew the counterfactuals. He knows the world where she stayed, and He knows the world where she goes. He has actualized this moment, not to crush us, but to bring us closer to Him.

  For those of you who never studied philosophy, here is what you need to know: She believed she was known. Truly known. Not just her actions, but her heart. Not just her future, but her possibilities. And she believed that the God who knew her so perfectly was the same God who welcomed her warmly.

  She is no longer defending a thesis. She is no longer grading papers or worrying about the nuances of creaturely freedom. She is living in the reality she wrote about. She is in the presence of the One who knew her before the foundation of the world. And I suspect, if the logic holds, she is freely singing a song she chose to sing, in a circumstance God prepared for her, where her will and His are finally, perfectly, one.

  Let us trust that the same God who orchestrated their meeting under the oak tree is holding us now. He did not force her life, and He does not force our grief. But He is present in it, weaving even this loss into a story that will, one day, make sense.

  Thank you.
