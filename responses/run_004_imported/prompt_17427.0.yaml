answer: |-
  **MEMORANDUM**

  **TO:** Museum Director
  **FROM:** Advisory Committee, Copernican Revolution Gallery
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Recommendation: Framing the Galileo Dispute

  **Recommendation**
  The Committee recommends adopting the **Epistemological Conflict** framing (Curator B's approach) for the Galileo section, rather than the traditional "Science vs. Religion" morality tale. However, this framing must explicitly retain the narrative tension regarding institutional power that Curator A rightly identifies as essential for visitor engagement.

  **Rationale**
  Curator A's instinct is understandable: the "martyr for truth" narrative is emotionally resonant and aligns with public memory. It correctly identifies the ultimate outcome: the Church *did* ban heliocentrism and imprison Galileo. To ignore this power imbalance would be a sanitization of history.

  However, Curator B is historically correct: presenting 1615 as a simple clash of truth against dogma collapses the actual scientific debate. In 1615, heliocentrism was not yet an "established truth." As Curator B notes, Galileo's tidal argument was flawed, and stellar parallax remained undetected. Cardinal Bellarmine's correspondence reveals a sophisticated position: scriptural interpretation could change *if* conclusive proof existed.

  By adopting Curator B's framing, we transform the exhibit from a hagiography into a lesson on the **scientific method**. The drama lies not in "Good Science vs. Bad Religion," but in "What counts as proof?" and "Who has the authority to decide?" This engages visitors more deeply by showing that scientific consensus is built, not merely discovered. We can satisfy Curator A's requirement for moral stakes by ensuring the 1633 trial section clearly depicts the shift from debate to coercion when the burden of proof was ignored.

  **Sample Exhibit Text (Draft)**
  *Panel Title: The Burden of Proof (1615)*

  > "In 1615, the question was not simply 'Sun or Earth?' but 'How do we know?'
  >
  > Galileo Galilei argued that the Bible should not contradict observed nature, citing St. Augustine to claim that scriptural language accommodates human understanding. He believed his telescopic observations were sufficient proof.
  >
  > Cardinal Robert Bellarmine, the Church's lead theologian, offered a conditional agreement: if true demonstration existed, scripture would require reinterpretation. But he demanded a level of proof Galileo could not yet provide. Galileo's argument for the tides was mathematically flawed; the definitive evidence of stellar parallax would not be measured for another 200 years.
  >
  > This was not merely a conflict of faith and fact, but a dispute over standards of evidence. When the Church eventually condemned Galileo in 1633, it was not because the science was settled, but because the institution claimed the authority to settle it."

  **Next Steps**
  Please authorize the design team to proceed with the Epistemological Conflict narrative arc, ensuring the visual language emphasizes the *process* of verification (telescopes, diagrams, letters) alongside the *personae* of the actors.

  **cc:** Lead Curators, Exhibition Design Team
