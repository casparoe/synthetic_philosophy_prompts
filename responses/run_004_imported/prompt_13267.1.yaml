answer: |-
  You have identified a genuine tension in Anscombe's thought, but your current reconstruction of the argument in *Mr. Truman's Degree* is likely fundamentally mistaken in a way that will undermine your chapter if built upon. To read Anscombe as making a primarily **proportionality-based (cost-benefit)** argument is to interpret her through a consequentialist lens that she explicitly and famously rejected.

  While Anscombe was indeed not a pacifist, her objection to Truman was not that the costs *outweighed* the benefits, but that the action was **intrinsically illicit** regardless of the benefits.

  Here is a breakdown of why the cost-benefit reading fails and how you should reconstruct the argument to align with her broader meta-ethics and natural law commitments.

  ### 1. The Meta-Ethical Error: Consequentialism vs. Natural Law
  Anscombe is one of the 20th century's most prominent critics of consequentialism (see her 1958 "Modern Moral Philosophy," but the view is operative in 1956). Her central charge against Truman is not utilitarian.

  In the pamphlet, Anscombe anticipates the defense that the bombs shortened the war and saved lives (the classic cost-benefit justification). She does not argue that this calculation is *incorrect* (i.e., that more people died than were saved); she argues that the calculation is **morally irrelevant**.

  For Anscombe, certain actions are forbidden by natural law regardless of their consequences. The intentional killing of the innocent is one such action. If you classify the bombing of Hiroshima and Nagasaki as the intentional killing of the innocent, no amount of "strategic gain" or "lives saved" can justify it. To argue otherwise is, for her, to adopt the utilitarian principle that "the end justifies the means," which she views as a corruption of moral philosophy.

  **Correction:** The argument does not turn on proportion. It turns on **discrimination** (combatant vs. non-combatant) and **intention**.

  ### 2. The Function of the Word "Murder"
  You write that her use of "murder" functions "mainly as rhetorical emphasis on how badly that [cost-benefit] test is failed." This is the crux of the misreading.

  For Anscombe, "murder" is not a rhetorical flourish; it is a **technical moral classification**. In her Thomistic framework:
  *   **Killing:** The physical act of causing death.
  *   **Murder:** The intentional killing of the innocent.

  When she calls Truman a murderer, she is not saying he killed *too many* people. She is saying he chose to kill people whom he had no right to kill, as a means to an end. She writes:

  > "For men to choose to kill the innocent as a means to their ends is murder."

  If your reconstruction treats "murder" as a label for "disproportionate killing," you miss her point that it is a label for "targeted killing of non-combatants." Even if Truman had killed only 1,000 civilians to end the war instantly, Anscombe would still classify it as murder, because the *object of the act* was the destruction of the innocent.

  ### 3. Resolving the "Non-Pacifist" Tension
  You note the difficulty: Anscombe accepted large-scale killing in war elsewhere. How does she distinguish the atomic bombings from, say, the bombing of military targets that results in high casualties?

  The distinction lies in the **Doctrine of Double Effect (DDE)**, which Anscombe rigorously defended.
  *   **Permissible:** Attacking a military target where civilian death is foreseen but *unintended* (collateral damage), provided the military value is significant and precautions are taken.
  *   **Impermissible:** Attacking a civilian population *in order to* break morale or force surrender.

  Anscombe argued that the atomic bombings (and the area bombing campaign generally) were instances of the latter. The civilians were not incidental casualties; they were the mechanism of victory. This is why she can be a non-pacifist (accepting the killing of combatants and incidental non-combatants) while condemning Truman absolutely. It is not a difference of degree (cost-benefit); it is a difference of kind (intentionality).

  ### 4. Proportionality in Anscombe's Framework
  Does proportionality play *any* role? In standard Just War Theory, yes. But for Anscombe, proportionality is a secondary condition that only applies *after* the act has been established as permissible in kind.
  1.  **Is the act intrinsically evil?** (e.g., targeting innocents). If yes, it is forbidden. Stop.
  2.  **If no,** is it proportionate?

  By placing the argument on proportionality, you are placing it at step 2. Anscombe's argument is entirely at step 1. She believes Truman's defenders are trying to use step 2 to override step 1, which she considers a moral catastrophe.

  ### 5. Recommendations for Your Chapter
  To correct your reconstruction, I recommend focusing on the following textual and philosophical points:

  *   **The Rejection of Utilitarianism:** Highlight where Anscombe explicitly dismisses the "saved lives" argument. She treats the very act of weighing innocent lives against strategic gains as evidence of moral corruption in the university and the state.
  *   **Intentionality:** Analyze her understanding of *intention*. She argues that Truman intended the death of civilians to achieve surrender. This makes the civilians the "means," violating Kantian and Thomistic prohibitions alike.
  *   **The Role of the University:** Anscombe's argument is also about the complicity of Oxford. By honoring Truman, the university endorses the principle that mass murder of innocents is acceptable if politically expedient. This fits her virtue ethics focus: what does this honor do to the moral character of the institution?
  *   **Secondary Literature:** Consult Roger Teichmann's *The Philosophy of Elizabeth Anscombe* or Mary Geach's work on Anscombe's ethics. Also, look at Philippa Foot's eulogy of Anscombe, which touches on her absolute prohibitions.

  ### Summary
  You have not misidentified the *topic*, but you have misidentified the *logical structure*.
  *   **Your current view:** Truman's action was wrong because Cost > Benefit.
  *   **Anscombe's view:** Truman's action was wrong because it was Murder (Intentional Killing of Innocents). Cost and Benefit are morally inadmissible weights in this equation.

  If you build your chapter on the proportionality reading, you will find yourself unable to explain why Anscombe doesn't simply argue for "more precise bombs" rather than condemning the act itself. Her position is deontological/natural law, not consequentialist. Correcting this will make your dissertation chapter much stronger and faithful to her philosophical system.
