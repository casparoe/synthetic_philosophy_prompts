answer: |-
  This is a classic debate in the history of political thought, and while your position is a common reading of Aquinas, **your friend is more textually justified.**

  While Aquinas certainly provides resources that *later* resistance theorists (like the Jesuit Suarez or the Calvinist Monarchomachs) would mine for their own arguments, attributing a "standing right to assassinate" to ordinary subjects is an overstatement of Aquinas's actual text. In fact, Aquinas explicitly warns against the very course of action you described.

  Here is the breakdown of why your friend's hesitation is well-founded, based on authorship, specific textual evidence, and Aquinas's broader moral framework.

  ### 1. The Authorship Problem (*De Regimine Principum*)
  Your argument relies heavily on *De Regimine Principum* (On Kingship). However, modern scholarship generally agrees that **Aquinas only wrote Book I and the first four chapters of Book II.** The remainder of the treatise was completed by his student, Ptolemy of Lucca.

  Ptolemy was significantly more republican and resistant to tyranny than Aquinas. If your evidence comes from the later sections of Book II, you are actually citing Ptolemy, not Aquinas. Even within the sections definitely written by Aquinas (Book I), his treatment of tyranny is cautious and conditional, not a blanket endorsement of regicide.

  ### 2. Public Authority vs. Private Initiative
  The crux of the disagreement lies in *who* has the right to act. Later resistance theories often argue that sovereignty ultimately resides in the people, granting them a right to execute judgment on a ruler. Aquinas holds a more hierarchical view.

  In *De Regimine Principum* (Book I, Chapter 6), Aquinas addresses what to do about tyranny. He makes a critical distinction:
  *   **If the multitude appointed the king:** They have the right to depose him if he becomes a tyrant.
  *   **If a superior authority appointed the king:** Only that superior (e.g., the Emperor or the Pope) can judge and remove him.

  Crucially, Aquinas explicitly **forbids private assassination.** He writes:

  > "It is not for the presumption of private individuals to kill tyrants, but for public authority."

  In the *Summa Theologiae* (II-II, Q. 42, Art. 2), Aquinas defines sedition (rebellion against the unity of the people/multitude) as a mortal sin. He argues that if a ruler is unjust, resisting him is only permissible if it does not cause greater harm to the community. He warns that private attempts to kill a tyrant often lead to greater chaos, factionalism, and the rise of an even worse tyrant.

  ### 3. Tolerance of Tyranny vs. Risk of Chaos
  Aquinas is a pragmatist regarding the common good. In *De Regimine*, he argues that sometimes it is better to tolerate a mild tyranny than to risk the upheaval of rebellion, which might result in a worse tyranny or civil war.

  He cites the example of the Old Testament: God forbade the Jews from killing King Saul, even though Saul was tyrannical and unjust toward David, because Saul held public authority. For Aquinas, the *office* holds a sacred character derived from God (Romans 13), even if the *officeholder* is sinful. Removing him requires a procedural, public act, not a private moral judgment executed through violence.

  ### 4. Anachronism regarding "Resistance Theory"
  Your position reads Aquinas through the lens of 16th and 17th-century resistance theory (e.g., Locke, Rutherford, or the Vindiciae Contra Tyrannos). These later thinkers were eager to claim Aquinas as a forefather to legitimize their own revolutions.

  However, Aquinas lacks the concept of individual political rights or popular sovereignty that underpins later resistance theory. For Aquinas:
  *   **Legitimacy** comes from the alignment of law with Natural Law and Divine Law.
  *   **Remedy** comes from superior authorities or public procedure.
  *   **Action by ordinary subjects** is limited to refusal to obey unjust commands (conscientious objection), not active assassination or revolution.

  ### The Verdict
  You are right that Aquinas believes tyranny is illegitimate and that a tyrant *can* be removed. However, you are wrong to suggest he grants **ordinary subjects** a standing right to **assassinate**.

  *   **Your Friend's Win:** Aquinas explicitly prohibits private individuals from killing tyrants (*De Regimine* I.6; *Summa* II-II Q. 64). He restricts the right of deposition to the body politic *as a whole* (if they appointed the ruler) or to a superior authority.
  *   **Your Partial Win:** Aquinas does establish that obedience to a tyrant is not absolute. If a law commands something contrary to Divine Law, it must not be obeyed. This is a seed of resistance, but it is a seed of *passive* resistance, not active regicide.

  **Conclusion:** Your friend is textually justified. Aquinas is a theorist of **limited government** and **conditional obedience**, but he is not a theorist of **revolutionary violence** or **private tyrannicide**. Reading him as a forerunner to modern assassination rights projects later political developments back onto a medieval mind that prioritized order and public authority above individual initiative.
