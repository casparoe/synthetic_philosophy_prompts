answer: |-
  You have excellent instincts, and you are absolutely right: **you read that correctly, and it is not a misquote.**

  In Section 7 of *Computing Machinery and Intelligence* (1950), under the heading "The Argument from Extrasensory Perception," Turing writes:

  > "It is assumed that the judge does not know which contestant is which... The new problem that arises is whether it is possible for a machine to display ESP... The statistical evidence, at least for telepathy, is overwhelming."

  He then goes on to suggest that to make the test fair, the competition should be held in a "telepathy-proof room."

  It is genuinely jarring for a modern reader to see the father of computer science treat telepathy as a settled statistical fact. However, this doesn't mean you need to rethink the scientific consensus on ESP, nor does it diminish Turing's genius. Here is the context you and your friend are missing, which explains why he thought that, why he was wrong, and why it doesn't validate telepathy today.

  ### 1. The Historical Context: Parapsychology in 1950
  To understand Turing's view, you have to understand the scientific landscape of the 1930s and 40s.

  In the mid-20th century, parapsychology was not the fringe "woo-woo" subject it is considered today. It was being investigated at major universities. The most prominent figure was **J.B. Rhine** at Duke University. Rhine conducted experiments using "Zener cards" (cards with five simple symbols: circle, cross, waves, square, star) to test for ESP.

  Rhine published his results in reputable journals and books (like *Extra-Sensory Perception* in 1934). He claimed statistical significance that far exceeded chance. For a period, many serious scientists, psychologists, and even some physicists found the data compelling. There was no widespread consensus *against* ESP yet because the methodological flaws in Rhine's work (sensory leakage, selective reporting, lack of blinding) had not been fully exposed or replicated by the broader community.

  When Turing wrote his paper in 1950, he was looking at the data available *at that time*. To a rigorous logician like Turing, if the statistical papers say "significant deviation from chance," the logical conclusion is "the phenomenon exists." He was treating the data at face value, which is actually a very scientific thing to do.

  ### 2. Turing's Logic Was Sound, His Premise Was Dated
  This is the crucial distinction. Turing's reasoning *about the test* was actually brilliant, even if his premise about ESP was wrong.

  Turing was concerned with **variables**. The Turing Test is designed to measure a machine's ability to imitate human intelligence via text. If telepathy existed, a human contestant could theoretically read the interrogator's mind to get the answers, bypassing the need for intelligence or language processing.
  *   **Turing's Logic:** If Channel A (text) is the test, but Channel B (telepathy) exists and is uncontrolled, the test is invalid. Therefore, we must shield against Channel B.
  *   **The Flaw:** Channel B does not exist.

  Turing gets credit for identifying a potential confounding variable in his experimental design. He was essentially saying, "We must control for all forms of information transfer." That is good science. The fact that one of those forms turned out to be nonexistent doesn't make his logic about experimental control wrong; it just makes that specific control unnecessary.

  ### 3. The "Genius Fallacy" (Appeal to Authority)
  Your reaction is very common: *"If Turing believed it, it must have merit."* This is a natural response, but it commits a version of the appeal to authority fallacy.

  Turing was a genius in mathematics, logic, and cryptography. He was not an expert in statistics, psychology, or experimental design regarding human perception. Great scientists are often wrong about things outside their specific lane.
  *   **Isaac Newton** was arguably the greatest physicist ever, but he spent more time on alchemy and biblical numerology than on physics. He believed he could turn lead into gold. We don't use Newton's alchemy to validate modern chemistry.
  *   **Linus Pauling** was a giant of chemistry and a Nobel laureate. He later became convinced that massive doses of Vitamin C cured cancer and AIDS. He was wrong.
  *   **Lord Kelvin**, a giant of thermodynamics, calculated that the Earth was only 20 million years old and that heavier-than-air flight was impossible.

  Turing's belief in telepathy tells us more about the state of parapsychology in 1950 than it does about the reality of telepathy. He trusted data that was later proven to be flawed.

  ### 4. Why the Consensus Changed
  You asked if this should shift how confident we are that telepathy is pseudoscience. The answer is **no**, because the "overwhelming evidence" Turing referred to did not hold up to scrutiny.

  In the decades following 1950:
  1.  **Replication Failed:** When other labs tried to replicate Rhine's results with stricter controls (double-blind protocols, automated shuffling, shielding against sensory cues), the effects disappeared.
  2.  **Methodological Flaws:** It was discovered that early ESP experiments often suffered from "sensory leakage" (the subject could see reflections of the cards, hear the experimenter's breathing change, etc.) and the "file drawer problem" (only publishing the hits, not the misses).
  3.  **No Mechanism:** As physics and neuroscience advanced, no plausible mechanism for telepathy was ever found. It violates our understanding of how information propagates (inverse-square law, etc.).

  Science is self-correcting. Turing was working with the "best available data" of 1950. We have 70+ years of better data since then.

  ### 5. Why It's Ignored in Pop Science
  You noticed this section is usually skipped in documentaries. There are two reasons for that:
  1.  **It Dates the Paper:** It reminds people that science is a product of its time. It distracts from the philosophical point of the Turing Test, which remains relevant.
  2.  **Credibility Management:** Unfortunately, mentioning it makes Turing look "gullible" to modern audiences who don't understand the historical context. Editors cut it to protect the brand of "Turing the Genius," which is a shame because, as you've seen, it actually makes for a fascinating discussion about how even great minds are influenced by their era's scientific consensus.

  ### Summary
  Your friend was half-right: it is an aside that doesn't impact the validity of the Turing Test itself. But you are right that it isn't just a throwaway line; it was a serious consideration by Turing.

  **Was his reasoning solid?** Yes, regarding experimental design (control your variables).
  **Was his conclusion correct?** No, because the data he relied on was flawed.
  **Should it change your view on ESP?** No. Turing was a giant, but he was a giant standing on the shoulders of 1950s science, some of which was mistaken.

  It's a great reminder that **science is a process, not a collection of facts handed down by geniuses.** Even Turing had to deal with the noise of his time, just like scientists today have to deal with ours.
