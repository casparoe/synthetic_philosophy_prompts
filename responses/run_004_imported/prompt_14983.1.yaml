answer: |-
  **MEMORANDUM**

  **TO:** Crisis-Standards-of-Care Subcommittee Chair
  **FROM:** [Your Name], Public Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Tiebreaker Protocol for Ventilator Allocation

  ### **Recommendation**
  **Drop the "Life-Years" Tiebreaker.** Replace it with a **Random Lottery** among clinically tied patients.

  The current draft proposes that when two patients have identical short-term survival odds, the ventilator goes to the patient with the most expected years of life remaining. I recommend we reject this clause. While the intention—to maximize the total life saved—is utilitarianly sound, the operationalization of "life-years" introduces unacceptable epistemic uncertainty and violates the principle of equal moral worth, particularly for patients with disabilities.

  ### **Philosophical Justification: The Nagel-Epicurus Dispute**
  Our bioethics consultant raises a fundamental metaphysical objection: that counting "years of life lost" assumes death is a harm to the deceased, a premise Epicurus denied. Epicurus argued that death is nothing to us; Lucretius added the symmetry argument, noting we do not mourn the time before our birth, so why mourn the time after our death?

  To answer your request plainly: **Yes, Thomas Nagel's deprivation account survives the Epicurean and Lucretian logical critiques.** Lucretius's symmetry argument fails because human beings are temporally oriented; we care about future projects and relations in a way we cannot care about the past. Death is a harm because it deprives a subject of the good life they would have otherwise had.

  However, **surviving a logical paradox does not justify public policy.** Even if Nagel is right that death is a harm, the Bioethicist is correct that *quantifying and comparing* that harm across different persons is morally perilous. To implement a life-years rule, we must make speculative prophecies about the quality and length of counterfactual futures. We are forced to decide not just who will die, but *how much* their death matters. In a clinical setting, these calculations inevitably rely on actuarial tables and quality-of-life assumptions that systematically devalue disabled and elderly lives. We cannot build a protocol on a metaphysical claim that requires us to measure the unmeasurable without bias.

  ### **Ethical & Disability Rights Considerations**
  The "Fair Innings" argument (that everyone deserves a standard lifespan, and those who haven't had it get priority) sounds equitable but functions discriminatorily. It assumes a "standard" life trajectory that many disabled people never get the chance to inhabit due to systemic inequities, not biological necessity. By prioritizing life-years, we implicitly rule that a 20-year-old with a disability is "worth" less than a 20-year-old without one if their life expectancy differs.

  When survival odds are *already* equal (the clinical tie), the medical system has reached the limit of its predictive competence. At that precipice, justice demands we treat remaining lives as equal in value, not as containers of varying volume.

  ### **Proposed Protocol Language (The "3 A.M. Test")**
  Clinicians need binary clarity, not philosophical nuance, during a surge. The following language should replace Section 4.2 (Tiebreaking) of the draft:

  > **4.2 Tiebreaking Procedure:**
  > In the event that two or more patients present with identical clinical priority scores (e.g., identical SOFA scores and short-term survival probabilities) and resources are insufficient for all:
  > 1.  **No further clinical or demographic criteria** (including age, disability status, or estimated life-years) shall be used to distinguish between patients.
  > 2.  Allocation shall be determined by **random selection**.
  > 3.  **Method:** The attending physician shall utilize a standardized digital random-number generator or a sealed-envelope lottery system provided by Hospital Administration.
  > 4.  **Documentation:** The method of selection and the result shall be logged in the patient's electronic record for audit purposes.

  This procedure is actionable, auditable, and protects the clinician from moral injury by removing the burden of playing God when medicine runs out.

  ### **Implementation Timeline**
  *   **November 1:** Subcommittee vote on revised language.
  *   **November 15:** Legal and Compliance review of lottery mechanism.
  *   **December 1:** Staff training begins (simulation drills on randomization protocol).
  *   **January 1:** Protocol active for respiratory virus season.

  ### **The Strongest Case for the Opposition (Steelman)**
  I owe it to the committee to articulate the strongest version of the view I oppose. Proponents of the life-years rule are not merely cold utilitarians; they are motivated by a profound desire to **minimize the total tragedy.**

  Their argument is this: A ventilator is a public resource. If we have one ventilator and two patients who will both survive *this week* with it, but Patient A will likely live 50 more years and Patient B will likely live 5 more years, giving it to Patient B wastes 45 years of human life. To choose a lottery is to engage in moral cowardice—to wash our hands of the responsibility to save the *most* life possible. They argue that "equality" in the face of scarcity is a hollow victory if it means we collectively accept more death and more lost future than necessary. They view the deprivation account not as metaphysics, but as arithmetic: saving 50 years is objectively more good than saving 5. To ignore this is to privilege the symbolic purity of the decision-maker over the actual lived future of the patient.

  ### **Conclusion**
  The opposition's arithmetic is clean, but it only works if human lives are fungible units of time. They are not. Because we cannot measure the value of a future without biasing against those already marginalized, and because public trust requires that we do not appear to weigh lives based on age or ability, the lottery is the only defensible choice. It acknowledges the tragedy of scarcity without compounding it with discrimination.

  I urge the committee to adopt the random selection protocol.
