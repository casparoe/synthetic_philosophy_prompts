prompt: |-
  After forty years in evolutionary ecology, I retired three years ago and have spent much of my time since reading philosophy of science, Kuhn especially, which has left me warier than I used to be about a task now in front of me. I sit on the scientific advisory panel for a foundation that funds early-career researchers, and this cycle's most contested proposal asks whether niche construction and developmental plasticity, rather than selection on standing genetic variation, principally drove a particular cichlid radiation. Two reviewers scored it outstanding for its ambition and coherence; three scored it poor, since it barely engages the standard population-genetics literature and its preliminary data show none of the signatures -- a selective sweep, say -- that the field normally requires as evidence of adaptation, a standard that already presupposes the gene-first process the proposal questions. I keep thinking of Kuhn's point that rival paradigms can be judged only by standards internal to one of them, but I don't want that to become an excuse for the panel to dodge the decision. Please draft the memo I'll circulate before Friday's meeting: recommend fund, decline, or invite a revised resubmission, with concrete guidance on what would have to change and by when; give reasons the low scorers and the applicant could each take seriously; and say how much weight, if any, the panel should give reviewers whose real objection is that the proposal doesn't look like normal science in this field.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the User and Context:**
      *   **User Persona:** Retired evolutionary ecologist (40 years experience), well-read in philosophy of science (specifically Thomas Kuhn), sits on a scientific advisory panel for a foundation funding early-career researchers (ECRs).
      *   **The Situation:** A contested grant proposal regarding cichlid radiation.
      *   **The Scientific Conflict:**
          *   *Hypothesis:* Niche construction & developmental plasticity drove radiation (Evo-Deco/EES leaning).
          *   *Counter-Hypothesis:* Selection on standing genetic variation (Standard Population Genetics/Modern Synthesis).
          *   *Review Scores:* 2 Outstanding (ambition/coherence), 3 Poor (ignores pop-gen literature, lacks standard signatures like selective sweeps).
          *   *The Kuhnian Tension:* The "Poor" reviewers are applying standards (selective sweeps) that presuppose the paradigm the proposal is challenging. This is a classic incommensurability issue.
      *   **The Goal:** Draft a memo to the panel before Friday's meeting.
      *   **Requirements:**
          *   Recommend a decision (Fund, Decline, or Revise/Resubmit).
          *   Provide concrete guidance on changes/deadlines.
          *   Address reasons seriously for both low scorers and the applicant.
          *   Address the weight given to reviewers objecting based on "normal science" standards.
      *   **Tone:** Professional, nuanced, respectful of scientific rigor but aware of philosophical implications, decisive but open to discussion.

  2.  **Determine the Recommendation:**
      *   *Fund:* Risky. The foundation funds ECRs. A project that ignores standard literature might set the researcher up for failure or isolation. It lacks preliminary data supporting the alternative mechanism.
      *   *Decline:* Discourages innovation. Validates the "paradigm police." Might stifle a potentially groundbreaking line of inquiry.
      *   *Revise & Resubmit (R&R):* The middle path. It acknowledges the ambition (high scorers) but demands engagement with the existing standards (low scorers) without necessarily conceding the theoretical point. It protects the ECR by forcing them to build a stronger bridge between paradigms.
      *   *Decision:* **Invite a Revised Resubmission.** This balances the need for rigor with the support for high-risk/high-gain science, especially for ECRs who need to establish credibility.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the difficulty of the decision. Validate the tension (Kuhnian undertones without being overly abstract).
      *   **The Recommendation:** State clearly: Invite Revision.
      *   **Rationale (The "Why"):**
          *   Address the ECR context: They need to survive in the current ecosystem while trying to change it.
          *   Address the Science: The hypothesis is compelling but the evidence is currently insufficient *by any metric*, not just the standard one.
          *   Address the Reviewers: Validate the low scorers' concern about evidence without validating the paradigm supremacy. Validate the high scorers' view on ambition.
      *   **Concrete Guidance (The "What"):**
          *   Don't just say "add pop-gen." Say "engage with it."
          *   Require a specific aim or analysis that tests the *null* (standard model) explicitly, even if to reject it robustly.
          *   Timeline: Standard cycle (e.g., 6 months).
      *   **The Kuhnian/Philosophical Point (The "Weight of Reviewers"):**
          *   This is crucial for the user. How to phrase this so colleagues don't roll their eyes but understand the point?
          *   Argument: We cannot demand evidence of Process A to prove Process B didn't happen. However, we *can* demand evidence *for* Process B.
          *   Reviewers objecting solely because it "doesn't look like normal science" should be weighed lightly *if* the alternative methodology is sound. But "ignoring literature" is a valid critique regardless of paradigm.
      *   **Closing:** Call to action for the meeting.

  4.  **Refining the Tone:**
      *   *Avoid:* Preachy philosophy lecture. The user knows Kuhn; the panel might not. Use the concepts pragmatically.
      *   *Ensure:* The distinction between "ignoring standards" and "challenging assumptions" is clear.
      *   *ECR Focus:* Emphasize that the foundation's mission is to *launch* careers. A polarized proposal can sink a career. The revision should help them build armor.

  5.  **Self-Correction/Iterative thought during drafting:**
      *   *Initial thought:* Maybe suggest funding it as "high risk."
      *   *Correction:* No, the preliminary data is weak ("show none of the signatures"). Even for high risk, you need *some* signal. R&R is safer.
      *   *Initial thought:* Tell the panel to ignore the low scorers.
      *   *Correction:* Too divisive. The low scorers have a point about engagement with the field. The applicant *must* cite and address the pop-gen work, even if to refute it.
      *   *Kuhn Nuance:* Make sure not to say "paradigms are incomparable." Say "evaluation criteria must match the hypothesis."

  6.  **Final Polish:** Check against all constraints in the prompt.
      *   Recommend fund/decline/revise? Yes (Revise).
      *   Concrete guidance? Yes (Specific aims, literature engagement).
      *   Reasons for low scorers/applicant? Yes (Rigor vs. Innovation).
      *   Weight of "normal science" objections? Yes (Addressed in the "Evaluation Criteria" section).
      *   Tone appropriate for a senior scientist? Yes.

  7.  **Final Output Generation:** (This matches the provided good response.)
answer: |-
  **MEMORANDUM**

  **TO:** Scientific Advisory Panel
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Proposal [ID Number]: Cichlid Radiation Mechanisms

  **Purpose**
  This memo outlines my recommendation for the contested proposal regarding the drivers of cichlid radiation (niche construction/plasticity vs. selection on standing variation). Given the split reviewer scores (2 Outstanding, 3 Poor) and the foundational nature of the theoretical disagreement, I recommend we **invite a revised resubmission** rather than funding or declining outright at this stage.

  **Rationale**
  Our mandate is to fund early-career researchers (ECRs). While we should encourage high-risk innovation, we must also ensure we do not set a young scientist up for professional isolation or failure.

  *   **For the High Scorers:** The proposal's ambition is genuine. If the hypothesis holds, it reshapes our understanding of this radiation. A flat rejection risks stifling a necessary theoretical expansion.
  *   **For the Low Scorers:** Their concerns are valid regarding *evidence*, even if their theoretical presuppositions differ from the applicant's. An ECR cannot simply ignore the dominant literature of their field; they must demonstrate why it is insufficient. Currently, the proposal asserts the alternative without robustly ruling out the standard model using the field's existing tools.

  **Concrete Guidance for Revision**
  If we invite a resubmission, the following conditions should be communicated to the applicant:

  1.  **Engagement, Not Concession:** The applicant need not adopt the population-genetics framework as *truth*, but they must engage with it as the *null model*. The revision must explicitly cite and address the key papers flagged by the negative reviewers.
  2.  **Comparative Analysis:** The revised proposal must include a specific aim or analytical component that tests for standard signatures (e.g., selective sweeps). The goal is not to prove they exist, but to demonstrate rigorously that they are *absent* where the plasticity hypothesis predicts their absence. Absence of evidence is only evidence of absence if the search was rigorous.
  3.  **Timeline:** The resubmission should be due within the next standard cycle (6 months). This ensures the data remains fresh and the researcher maintains momentum.

  **On the Weight of "Normal Science" Objections**
  We must discuss how to weigh the reviewers' objections that the proposal "does not look like normal science" in this subfield.

  *   **Methodological Rigor vs. Paradigmatic Conformity:** We should give **little weight** to objections based solely on the fact that the hypothesis challenges the gene-first consensus. Innovation often looks like heresy before it looks like discovery.
  *   **Standards of Evidence:** However, we must give **significant weight** to objections regarding the *standards of evidence*. While we cannot demand a selective sweep as proof of adaptation if the applicant argues adaptation didn't drive the radiation, we *can* demand positive evidence for the proposed mechanism (plasticity/niche construction). Currently, the preliminary data is thin on *both* counts.
  *   **The Kuhnian Constraint:** As Thomas Kuhn noted, rival paradigms often talk past one another. It is not our role to decide which paradigm is "true" today. It is our role to decide if the proposed method of inquiry is rigorous enough to test the claim being made. The current proposal asks us to accept a paradigm shift without first clearing the evidentiary bar required to make the claim credible to the broader community.

  **Conclusion**
  By inviting a revision, we protect the foundation's investment in rigor while honoring our commitment to innovation. We ask the applicant to build a stronger bridge between their novel hypothesis and the existing literature. This ensures that if they succeed, their findings will be robust enough to withstand the scrutiny of the very field they hope to change.

  I look forward to discussing this with you on Friday.
