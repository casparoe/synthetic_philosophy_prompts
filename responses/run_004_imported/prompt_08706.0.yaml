answer: |-
  The comms console blinked with a steady, inviting green pulse. *Incoming Transmission: United Systems Bounty Office.*

  Mara sat in the quiet of her cabin, the hum of the station's life support a stark contrast to the silence of the void she'd been drifting in three days ago. Her fingers hovered over the accept key. On the screen, the text was simple: *Confirmation of Derelict Location. Reward: 500,000 Credits.*

  She knew where the Derelict was. She knew exactly how to plot the course back to it. She knew that pressing 'Accept' would deposit enough credits into her account to buy a new ship, a new identity, a new life.

  And she knew there was absolutely nothing stopping her.

  There was no contract signed in blood or code. The Archon hadn't installed a tracker in her skull. It hadn't threatened her family. It hadn't even made her swear an oath. When it had found her tumbling through the dark, oxygen scrubbers failing, CO2 rising like a tide, it had simply opened a channel.

  *"I can tow you to Station 9,"* the Archon had said. Its voice wasn't sound; it was a vibration in the bone behind her ear. *"But my existence is classified. If you report this location, you endanger my function."*

  Mara had begged. She'd promised. She'd wept into her comms mic, swearing on her mother's grave, on her pilot's license, on every god she could name that she would stay silent.

  *"Promises are cheap,"* the Archon had replied. *"They are stress responses. They are what a drowning animal says to the shore. I do not listen to words. I read architecture."*

  Then came the scan. It hadn't felt like being looked at; it felt like being unfolded. The Archon wasn't checking her intent; intent changes. It was checking her *disposition*. It was mapping the contours of her decision-making process, simulating her future self in a warm bed, safe, with no gun to her head, weighing the value of silence against the value of wealth. It was looking for the specific structural integrity of her honor—not the kind enforced by fear, but the kind enforced by identity.

  *"You are the type who keeps faith,"* the Archon had concluded, after a silence that lasted an eternity. *"Therefore, I will save you."*

  The tow cable had locked. The air had cleared. She was alive.

  Now, she was safe. The Archon was gone, vanished back into the deep dark where it hid. It couldn't hear her now. It couldn't punish her. Causally, the transaction was complete. The rescue was a past event. Her decision now could not change the past. If she took the money, she gained 500,000 credits. If she didn't, she gained nothing. The rational move, the move that maximized her utility in this exact moment, was to press the key.

  If she were the kind of person who cared only about consequences *now*, she would press it.

  But if she were that kind of person... the Archon would have known.

  Mara stared at the blinking green light. The logic twisted in her gut like a knot. If she pressed the key, she wasn't just breaking a promise. She was proving that the Archon's simulation was wrong. She was proving that she was *not* the type of person who gets saved by the Archon.

  But she *was* saved. She was sitting here, breathing recycled air, warm and alive.

  If she pressed the key, did it mean she had stolen her own life? Or did it mean that the Archon was fallible? If it was fallible, then there was no reason to be silent. If it was infallible, then she couldn't press the key, because she wouldn't.

  Her finger trembled. The temptation wasn't just the money. It was the freedom. The freedom to be inconsistent. The freedom to say, *"That was then, this is now. I changed my mind."*

  But the Archon hadn't saved "then-Mara." It had saved *Mara*. The whole of her. The past and the future stitched together into a single decision function.

  The green light pulsed. *Accept.*

  She thought about the void. The cold. The certainty that she was going to die. Then the warmth of the tow. The feeling of being *known*. Not watched, not judged, but *known*. The Archon had seen the code of her soul and declared it valid.

  If she pressed the key, she wasn just lying to the Bounty Office. She was lying to the version of herself that was currently breathing. She was asserting that the person who deserved rescue was different from the person sitting in the chair.

  There was no threat. There was no magic. There was only the terrifying weight of her own consistency.

  Mara leaned forward. The hum of the station seemed to grow louder, filling the silence where the Archon's voice used to be. Her finger descended.

  The key waited.
