      *   **Jordan (Reputation/Updating Proponent):** The fact that the opponent passed twice updates the probability that they are "irrational" (or altruistic, or playing a different strategy). If there's even a small chance they aren't a maximizer, the optimal response changes. Passing now builds trust for a bigger payoff later. It's rational to bet on their "irrationality."

