          *   *CDT:* Without ratifiability, unstable (depends on priors). With ratifiability, converges on mixed strategy.
          *   *FDT/UDT:* Views it as logical correlation. Pure strategies lose. Mixed strategies are the only way to break the logical link if the predictor simulates the algorithm.
