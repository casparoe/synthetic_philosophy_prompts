      *(Egan's Counterexamples)*: Egan uses Damascus to attack CDT. CDT says "Flee" (if prior says Death in Dam), but that leads to death. I need to mention this tension.

      Okay, ready to draft.

      *(Final thought on the "Perfect Predictor" constraint)*: If Death is truly perfect (knows the coin flip), the survival probability is 0. The only way the problem is solvable is if "Perfect Predictor" means "Perfect Predictor of your deterministic cognitive output." Therefore, introducing non-deterministic noise is the only escape. I will make this the crux of the argument. Rationality requires recognizing the limits of determinism in the face of prediction.

      *(Wait, is that right?)*: If Death is a perfect predictor, he knows you will flip a coin. He knows the result. Then you die.
      *Correction:* In the standard game-theoretic reading of Death in Damascus (which aligns with Matching Pennies), the predictor predicts your *move*. If you use a mixed strategy, the predictor predicts the *distribution*. But the predictor must commit to a *location*.
      *Scenario:* I commit to 50/50. Death predicts I commit to 50/50. Death must choose Dam or Alep. Death chooses Dam. I flip coin. 50% I live.
