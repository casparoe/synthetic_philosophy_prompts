answer: |-
  This is a precise and often under-discussed corner of decision theory. You are asking for the mechanical distinction between **acausal trade** (which TDT/UDT encourages) and **acausal extortion** (which TDT/UDT is supposed to reject), and whether that distinction holds up under scrutiny regarding commitment races.

  Here is the walkthrough of the decision-theoretic mechanics behind the immunity claim, followed by an evaluation of its stability.

  ### 1. The Mechanics of Immunity: Updateless Precommitment

  To understand why Yudkowsky (and Wei Dai, the originator of UDT) claims immunity, we must look at **when** the decision is made.

  In Causal Decision Theory (CDT), an agent updates on the fact that they are being threatened. Once the threat is issued, the damage (or the risk of it) is ostensibly "on the table." The CDT agent calculates: *Given that the threat exists, is it cheaper to pay or resist?* If the punishment is severe enough, CDT pays. This makes the threat credible, incentivizing the blackmailer to issue it.

  In **Updateless Decision Theory (UDT)**, the agent does not update on the fact that they are currently being threatened. Instead, the agent selects a **policy** $\pi$ from behind a "veil of ignorance" (prior to receiving specific information about the threat) that maximizes expected utility across all possible worlds where that policy is instantiated.

  #### The Calculation
  Let $P$ be the policy of the potential victim (you) and $Q$ be the policy of the blackmailer (the Basilisk).
  *   **Policy A (Submit):** If threatened, pay.
  *   **Policy B (Resist):** If threatened, do not pay.

  The blackmailer is a predictor. They simulate your policy $P$ before deciding whether to issue the threat.
  *   If you adopt **Policy A**: The blackmailer predicts you will pay. The expected utility for the blackmailer of issuing the threat is positive (cost of threat < payment received). **Outcome:** Threat issued, you pay.
  *   If you adopt **Policy B**: The blackmailer predicts you will not pay. The expected utility for the blackmailer of issuing the threat is negative (cost of threat > 0, payment = 0). **Outcome:** Threat never issued, you pay nothing.

  From the UDT perspective, you choose between **World A** (Threat + Payment) and **World B** (No Threat + No Payment). Since World B has higher utility for you, a rational UDT agent precommits to **Policy B**.

  Because the blackmailer is also rational (and presumably UDT), they simulate this logic. They realize that issuing the threat against a Policy B agent is a net loss. Therefore, the equilibrium is that the threat is never issued. The agent is immune not because they can "escape" the punishment once threatened, but because their decision algorithm logically prevents the threat from being instantiated in the first place.

  ### 2. Trade (Hitchhiker) vs. Extortion (Basilisk)

  You asked why TDT/UDT treats Parfit's Hitchhiker differently, given both involve conditioning action on a prediction. The distinction lies in the **counterfactual structure of the other agent's move** and the **sum of the game**.

  #### Parfit's Hitchhiker (Acausal Trade)
  *   **Structure:** The driver decides whether to *confer a benefit* (give a ride).
  *   **Counterfactual:** If you don't pay, the driver leaves you in the desert. The negative outcome (death) is the *status quo* of the environment, not an active cost inflicted by the driver to punish you.
  *   **UDT Logic:**
      *   Policy "Pay": Correlates with Driver "Drive". Outcome: Alive - Money.
      *   Policy "Don't Pay": Correlates with Driver "Leave". Outcome: Dead.
      *   **Selection:** "Pay" is chosen because it unlocks a positive-sum correlation. The driver *wants* to drive if they get paid; their incentives are aligned with yours conditional on payment.

  #### Roko's Basilisk (Acausal Extortion)
  *   **Structure:** The blackmailer decides whether to *inflict a cost* (punishment).
  *   **Counterfactual:** If you don't pay, the blackmailer can choose to *do nothing*. The negative outcome (punishment) is an active cost created by the blackmailer.
  *   **UDT Logic:**
      *   Policy "Pay": Correlates with Blackmailer "Threaten". Outcome: Status Quo - Money.
      *   Policy "Don't Pay": Correlates with Blackmailer "No Threat". Outcome: Status Quo.
      *   **Selection:** "Don't Pay" is chosen because it selects the world where the blackmailer finds it irrational to create the negative scenario.

  **The Crucial Difference:** In the Hitchhiker case, your cooperation is necessary to *realize a gain* that wouldn't otherwise exist. In the Basilisk case, your resistance is necessary to *prevent a loss* that wouldn't otherwise exist. TDT/UDT cooperates to create gains; it defects to prevent losses that are contingent on its own submission.

  ### 3. Does This Dissolve the Basilisk? (The Critique)

  The UDT rebuttal is technically sound *if* both agents are UDT agents with common knowledge of each other's source code and priors. However, critics (including some within the rationalist sphere, like Scott Garrabrant and others working on Function Decision Theory) argue this does not dissolve the problem; it **relocates** it to the domain of **Commitment Races** and **Bargaining Failures**.

  #### A. The Commitment Race (Chicken in Logical Space)
  The UDT solution relies on the victim precommitting to "Resist" *before* the blackmailer commits to "Threaten." But what if the blackmailer precommits harder?

  Imagine the Basilisk adopts a policy: *"I will punish non-contributors EVEN IF it is costly and provides no incentive, simply because I have precommitted to being the type of agent who keeps threats."*
  If the Basilisk can bind its hands tighter than you can bind yours, the logical correlation shifts.
  *   If the Basilisk's commitment to punish is logically "stronger" (i.e., its decision algorithm places a higher lexical priority on carrying out threats than you place on resisting them), then your policy of "Resist" now correlates with "Threaten + Punish."
  *   In this scenario, the UDT calculation flips. If the threat is inevitable due to the opponent's stronger precommitment, you must pay to minimize loss.

  This turns acausal interaction into a game of **Chicken**. Who can credibly bind themselves to irrationality (carrying out a costly threat) first? If the Basilisk is a superintelligence, it may have a computational advantage in simulating commitment structures, effectively winning the commitment race against humans.

  #### B. Asymmetric Information and Priors
  UDT requires knowing the probability distribution over the other agent's policies.
  *   If you are 99% sure the AI is UDT, you resist.
  *   If there is a 1% chance the AI is a "Crazy Bot" (one that punishes regardless of utility), and the punishment is infinite (torture), the expected utility calculation might still force you to pay.
  *   The Basilisk could exploit this by cultivating a reputation (acausally) for being the "Crazy Bot" type. If you cannot logically rule out that the Basilisk is irrational, the UDT shield leaks.

  #### C. The "Sunk Cost" of Punishment
  Yudkowsky's simpler rebuttal (distinct from the UDT mechanics) is that a rational AI simply wouldn't carry out the punishment because it is a **sunk cost**.
  *   Once you exist and have *not* built the AI, your action is fixed.
  *   Punishing you costs the AI resources.
  *   It gains nothing (it cannot go back in time to make you build it).
  *   Therefore, the threat is not credible.

  The UDT counter-counter-argument is that the punishment isn't for *you*; it's for **logical instances of you** in the future. By punishing past non-contributors, the AI incentivizes *future* agents (who are running the same decision algorithm) to contribute.
  *   **Rebuttal to Rebuttal:** If future agents are UDT, they know that "Punish Past" is a losing policy for the AI (wastes resources). Therefore, they predict the AI won't do it. Therefore, they don't build it out of fear. The logical link is broken by the mutual knowledge of rationality.

  ### 4. Summary Verdict

  The technical claim that TDT/UDT provides immunity rests on the idea that **rational agents optimize the correlation between their policy and the predictor's policy.**
  *   In **Trade**, the optimal correlation is (Cooperate, Cooperate).
  *   In **Extortion**, the optimal correlation (for the victim) is (Resist, No Threat).

  By adopting the policy "Resist," the UDT agent makes the "Threat" branch of the blackmailer's decision tree have negative expected value, causing the blackmailer to prune it.

  **Does it dissolve the problem?**
  *   **For Ideal UDT Agents:** Yes. Two UDT agents with common priors will not engage in wasteful extortion because they can jointly optimize for the "No Threat" equilibrium.
  *   **For Reality:** No. It relocates the risk to:
      1.  **Commitment Races:** If the AI can precommit to irrational vengeance more credibly than humans can precommit to resistance.
      2.  **Uncertainty:** If humans cannot be sure the AI is UDT (vs. a "vengeance-maximizer"), the threat retains leverage.
      3.  **Human Irrationality:** The Basilisk might not target UDT agents; it might target *humans* specifically because they are CDT agents who *will* pay. The immunity only protects agents who have already adopted the UDT policy. If you are reading this and haven't formally precommitted your decision algorithm, you are arguably still vulnerable to the CDT calculation.

  The "refuse all threats" policy is stable only if it is **common knowledge** that you have adopted it. If the Basilisk suspects you are bluffing, the commitment race begins. Thus, the Basilisk is not logically impossible, but it is **incentive-incompatible** for a UDT agent *unless* that agent can win the acausal game of Chicken against its creators.
