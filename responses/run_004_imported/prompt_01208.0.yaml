answer: |-
  **Cambridge, 1907**

  **The study is cluttered with papers. PEIRCE sits behind a desk, smoking a pipe. JAMES leans against the bookshelf, looking tired but animated.**

  **PEIRCE**
  You know, Will, when I coined the term "pragmaticism," I intended it to be ugly. I wanted it to be so unsavory that no one would dare steal it. And yet, here you are, still trying to dress it up in your clothes and send it out to dance.

  **JAMES**
  (Smiling)
  I'm not stealing it, Charlie. I'm spending it. You minted the coin, but you left it in the vault. I put it into circulation. If "pragmatism" has become a byword, it's because I showed people how to use it to pay for the things that matter—life, hope, moral effort.

  **PEIRCE**
  And that is precisely where you bankrupt the concept. You have taken a maxim of logic and turned it into a theory of psychological comfort. You say truth is what it is "good" to believe. Good for whom? For you? For me? For the moment? If a man finds it "good" to believe he is Napoleon because it stiffens his spine, is that truth?

  **JAMES**
  If that belief carries him through a crisis where skepticism would have destroyed him, it has *cash-value*. It works. Look, Charlie, take the religious hypothesis. I cannot prove God exists. Science is silent on it. But if believing in God gives me the "strenuous mood" to fight injustice, to endure suffering, isn't that belief true in the only sense a living human being can grasp? You want truth to be independent of the believer. I say truth *happens* to an idea. It becomes true, is made true by events.

  **PEIRCE**
  (Leaning forward, pipe stem clenched in teeth)
  You are conflating the *usefulness* of a belief with its *truth*. They are not identical. A lie can be useful. Truth is not what you *wish* to be the case; it is that which reality forces upon you. It is the opinion fated to be ultimately agreed to by all who investigate. Not by you, in your study, seeking comfort. But by the community of inquirers pushing against the resistance of the universe, indefinitely.

  **JAMES**
  "The community of inquirers." The "long run." I know the refrain. But Charlie, be pragmatic for a moment about your own pragmatism. What is the practical consequence of this "final opinion"? None of us will be there to see it. It is an ideal limit, a regulative assumption.

  **PEIRCE**
  It is the only thing that saves us from solipsism!

  **JAMES**
  Is it? Or is it a metaphysical absolute in disguise? You scolded me for smuggling in theology, but you are smuggling in a Scholastic Realist God's-eye view. You say truth is what the community *would* find if inquiry went on forever. But "would" is a modal operator, not a experienceable fact. I can feel the warmth of a belief *now*. I can measure its consequences in my life *now*. Your "final opinion" is as unreachable as the Kantian Thing-in-Itself. Where is the cash-value of a truth that only exists at the end of time?

  **PEIRCE**
  (Pauses, tapping ash into a tray)
  The cash-value, as you insist on calling it, is that it disciplines inquiry. If truth is merely what satisfies you now, inquiry stops when you are satisfied. Science stops when the laboratory feels comfortable. My definition insists that there is a reality *outside* us that we can get wrong. It demands we submit to a method that corrects our individual idiosyncrasies. You are making truth subjective. I am trying to save the possibility of objective knowledge, even if that objectivity is rooted in social consensus rather than individual intuition.

  **JAMES**
  I'm not denying reality, Charlie. I'm denying that we have access to it except through our human interests. You want to separate logic from psychology. I say they are woven together. When you say "fated to be agreed upon," you are assuming the universe has a telos, a direction. That's a faith commitment, same as mine in God. You call it "hope." I call it "faith." The only difference is you dress yours in the robes of Science and mine in the robes of Religion.

  **PEIRCE**
  (Softening slightly)
  I do not deny the need for hope. God knows, I have relied on it. And I do not deny your generosity, Will. You have kept me from starvation when the world forgot me. I owe you more than I can say.

  **JAMES**
  Then don't repay me by calling my philosophy a corruption of yours. Let it be a sibling. You take the logic of science; I'll take the logic of life.

  **PEIRCE**
  I cannot do that. Because if you sever truth from the long-run community, you sever the bond that makes us responsible to anything other than our own appetites. But... (He sighs) ...perhaps I am too rigid. Perhaps the "final opinion" is too distant a star to steer by for a man in a storm.

  **JAMES**
  It is. And in the storm, a man needs a life raft, not a map of the destination.

  **PEIRCE**
  Then let us agree on this: The map is useless if it doesn't account for the storm. But the life raft is dangerous if the captain believes the raft *is* the destination.

  **JAMES**
  (Laughs)
  I can accept that. Though I still think "Pragmaticism" is a dreadful word.

  **PEIRCE**
  (A rare smile)
  It was designed to be. Now, pour the tea. And tell me what you are writing about this time. Something about a pluralistic universe, I suppose?

  **JAMES**
  As a matter of fact...

  **(James moves to the table. Peirce watches him, the tension remaining, but the warmth returning.)**
