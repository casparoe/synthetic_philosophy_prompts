answer: |-
  **Setting:** *A quiet corner of the university library, late afternoon. Two coffee cups sit between stacks of papers. **Dr. Elena Vance** (pro-continuity) leans forward; **Prof. Julian Thorne** (pro-discontinuity) leans back, rubbing his temples.*

  **Vance:** You're treating the Society for Psychical Research like a hobby, Julian. A Victorian parlor game. But if you look at the architecture of *The Methods of Ethics*, specifically the conclusion of Book X, the SPR isn't a distraction. It's the only move left on the board.

  **Thorne:** It's not about dismissing it as a game, Elena. It's about epistemic standards. In *Methods*, Sidgwick is painstaking. He dissects "common sense" morality until it dissolves into Utilitarianism. He demands rigorous conceptual clarity. But when he walks into the SPR? He's testing the Creery sisters for telepathy. He's chasing leaks in haunted houses. The rigor evaporates. It looks less like a philosophical necessity and more like a man terrified of the abyss he just dug.

  **Vance:** But that's exactly the point of the Dualism of Practical Reason. Sidgwick establishes that Rational Egoism and Rational Utilitarianism are both self-evident, yet they can conflict. If I can maximize my own happiness by betraying the general good, and there's no cosmic sanction against it, then Reason is divided against itself. He says explicitly that this contradiction can only be resolved if we assume a "moral government of the universe"—that virtue is ultimately rewarded.

  **Thorne:** He says it *can* be resolved that way. He doesn't say he *knows* it is. That's the crucial distinction. Sidgwick concludes *Methods* by admitting he can't prove the religious premise. He leaves the Dualism standing as a fundamental failure of ethical coherence. That is a philosophical conclusion. It's a negative result, but it's honest. The SPR is him trying to retroactively fix a negative result he should have accepted.

  **Vance:** No, because for Sidgwick, ethics is a science. It's not just conceptual analysis; it's about the rationality of action in the real world. If the rationality of morality depends on the structure of reality—specifically, whether the universe supports moral justice—then investigating that structure is part of the ethical project. He couldn't accept dogmatic theology, right? So, as an empiricist, he had to look for empirical evidence of the supernatural. The SPR *was* his empirical theology.

  **Thorne:** But notice the asymmetry in his standards. In *Methods*, if a moral intuition is vague, he discards it. If a premise lacks self-evidence, he brackets it. Yet in the SPR, he spends decades investigating claims that, by his own admission, mostly result in fraud or null data. If this were truly continuous with *Methods*, the null results should have settled the matter. He should have said, "Evidence lacking; Dualism stands." Instead, he kept the hope alive. That suggests the SPR wasn't driven by the logic of the argument, but by the psychological need to escape the conclusion of the argument.

  **Vance:** You're conflating the *outcome* with the *inquiry*. Sidgwick never claimed the SPR proved the afterlife. He remained agnostic. But consider the alternative. If he simply accepts the Dualism without exhausting the empirical possibility of a moral order, isn't he being dogmatic in a new way? He'd be asserting *naturalism* as a dogma. For a philosopher who insists on following evidence wherever it leads, ignoring the possibility of psychical evidence because it sounds "unscientific" to the materialists would be just as biased as accepting it because it comforts the Christians.

  **Thorne:** I'm not saying he should have been a materialist dogmatist. I'm saying there's a category error here. The Dualism of Practical Reason is a limit of *practical* rationality. It's about what reasons we have to act. Whether a ghost raps on a table in a seance room is a matter of *theoretical* rationality. Bridging that gap requires assuming that theoretical facts about ghosts translate to practical facts about moral justice. Even if telepathy is real, how does that get you to "virtue is rewarded"?

  **Vance:** Because telepathy, survival of death, these are the mechanisms required for the "moral government" hypothesis to be plausible in a post-Darwinian world. If consciousness survives, and if there is communication across that barrier, it opens the logical space for a system of sanctions that isn't visible to the physical eye. He isn't looking for ghosts to scare people; he's looking for the *conditions of possibility* for the coherence of Reason. If the mind is independent of the brain, the Utilitarian calculus extends beyond death. That aligns Egoism and Utilitarianism over the long run.

  **Thorne:** That's a massive leap. "Mind independent of brain" does not equal "Divine Justice." You could have a surviving ego that is purely malicious. Sidgwick knew this. In his letters, he admits the SPR evidence is slender. My worry is that by engaging in this, he undermines the very "scientific" ethos of *Methods*. He wants Utilitarianism to be as certain as Newtonian physics. But then he chases phantoms to save it. It suggests that the "system" he built in *Methods* was so unbearable to him personally that he had to compromise his intellectual integrity to keep it from collapsing.

  **Vance:** Is it compromised integrity, or is it intellectual courage? Most of his contemporaries just retreated into vague spiritualism. Sidgwick applied the scientific method to the spiritual. He subjected mediums to controls. He analyzed data. That *is* the *Methods* ethos applied to a new domain. And regarding the "unbearable system"—Sidgwick wasn't looking for comfort. He famously said he couldn't bring himself to believe, but he couldn't bring himself to stop looking. That tension *is* the philosophy. The SPR isn't an attempt to hide the Dualism; it's an attempt to live inside it without lying.

  **Thorne:** But living inside it is exactly what *Methods* demands! The tragedy of Sidgwick is that he thinks he *must* resolve it. But what if the lesson of *Methods* is that we have to act without that resolution? By founding the SPR, he's effectively saying, "Utilitarianism is only rational if the universe cooperates." That weakens the moral claim. If I need to know if the Creery sisters are faking it before I know if I should sacrifice my interest for the greater good, haven't I turned morality into a gamble?

  **Vance:** Not a gamble. A calculation of risk. If there is a non-zero probability of a moral order extending beyond death, the expected utility of moral action changes. Sidgwick is a hedonistic calculator. He has to weigh the probability of divine sanction. If he ignores that variable because it's "messy," he's not calculating correctly. The SPR was his way of gathering data for the variable $P$ (probability of moral afterlife) in his ethical equation.

  **Thorne:** But $P$ remained effectively zero. And yet he acted *as if* it mattered. That's where the discontinuity is starkest. In *Methods*, he argues we should follow the method that yields the most truth. In the SPR, he followed a method that yielded almost no truth, driven by a hope he admitted was unsupported. It creates a split in Sidgwick: the Philosopher who accepts the Dualism, and the Man who couldn't bear it. The seminar group that calls this a "crisis of faith" isn't saying he was weak; they're saying the philosophy ends where the biography begins. *Methods* stops at the limit of reason. SPR starts at the limit of hope.

  **Vance:** I think you're underestimating how radical his empiricism was. He didn't see a limit of reason; he saw a limit of *current data*. If the universe is rational, the data must exist somewhere. To stop looking is to assert that the universe is irrational. For Sidgwick, that's the real dogma. So, the SPR isn't a departure from *Methods*; it's the only consistent application of *Methods* to the metaphysical premises ethics relies on. He didn't find the ghosts, Julian. But he proved that a philosopher of his caliber could stare into the void and demand it show its receipts.

  **Thorne:** And in demanding receipts from the void, he arguably lost the thread of what makes ethics binding in the first place. If morality depends on the SPR verifying an afterlife, then morality isn't self-evident—it's contingent on paranormal statistics. That undermines the intuitionism he starts with.

  **Vance:** Or it saves intuitionism from being a beautiful lie.

  **Thorne:** *(Pauses, picking up his coffee)* Or it leaves us with a man who wrote the greatest ethics book of the century, and then spent thirty years trying to disprove its darkest conclusion because he couldn't sleep at night.

  **Vance:** *(Smiles slightly)* Maybe those aren't mutually exclusive. Maybe the inability to sleep at night is the price of taking the Dualism seriously.

  **Thorne:** Perhaps. But I still think the students need to know: one of these projects is philosophy. The other is a haunting.

  **Vance:** And Sidgwick was the one holding the flashlight for both.
