      *   It's when the *whole system* of explanation fails.
      *   It's when the hinge stops facilitating action and starts blocking it.
      *   It requires a "world-picture shift."
      *   Example: If *every* program fails, or if there's a known CVE, the hinge shifts.

  6.  **Structuring the Response:**
