answer: |-
  (Step up to the mic, take a breath, and look directly at the couple, then scan the room.)

  So. We need to talk about the vows.

  And I know what some of you are thinking. I know what *they* are thinking. [Partner 1] and [Partner 2] have been together for eight years. They have a shared lease. They have a joint bank account. They have a dog that knows both their last names. And if you ask them why they're doing this, they'll tell you it's for the tax brackets. Or the insurance. Or, as [Groom/Partner], being a contracts lawyer, might quietly suggest, it's just formalizing an existing merger.

  And they're not wrong. In a practical sense, come Monday morning, the coffee will be brewed the same way. The dog will still need walking. The lease is still signed. If I stand up here and tell you that "everything changes today," I'm lying, and [Groom/Partner] will smirk, and I'll lose the room.

  But if nothing is changing, why are we making promises?

  If you already know someone will be there, what is left to promise? You can't promise to surprise them; they know how you take your toast. You can't promise to show up; you've already shown up for eight years. So, what is the point of saying it out loud, right now, in front of all of us?

  Here is the answer I've come to.

  Up until this moment, your commitment has been a habit. A beautiful, reliable, deeply loving habit. But a habit is private. It exists between the two of you. It relies on how you *feel* in the moment. A habit says, "I am here because I want to be." And that is wonderful. But feelings are weather. They change.

  A vow is not about the weather. A vow is about the architecture.

  When you say these words in front of this community, you are moving from a private arrangement to a public truth. You are changing the status of your love from something you *do* to something you *are*.

  [Groom/Partner], you know better than anyone that a contract isn't valuable because it predicts the future. It's valuable because it restricts your future options. It binds you. And that sounds scary, but it's actually the greatest freedom there is. Because when things get hard—and they will—you won't have to wake up and decide if you still feel like loving each other. You won't have to negotiate the terms of the lease. The decision has already been made. By you. In front of us.

  The promise isn't a guarantee that you won't change. The promise is a guarantee that you won't change *alone*.

  So, when you say "I do" in a moment, you aren't telling us anything we don't already know about your love. You are telling *yourselves* that you are no longer just choosing each other day-to-day. You are binding yourselves to a standard that is bigger than your bad days. You are inviting all of us in this room to hold you to it.

  The paperwork matters. The taxes matter. But this moment matters because it is the moment you stop merely living together, and start standing together.

  So, if you're ready to make it official—not just for the state, but for yourselves—please face each other.
