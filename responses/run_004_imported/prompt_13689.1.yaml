      *   *Move 3:* Daniel (epistemological undercut).
      *   *Move 4:* Maya (pragmatic reductio).
      *   *Move 5:* Daniel (conceptual refinement).
      *   *Overall:* Daniel wins on philosophical rigor; Maya wins on livability.

      *   *What's missing:* The distinction between *moral worth of the agent* vs. *rightness of the act*. Also, the concept of *overdetermination*.

