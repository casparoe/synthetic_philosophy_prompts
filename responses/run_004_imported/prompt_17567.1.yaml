prompt: |-
  For an AI safety and rationality club at my high school, a few of us have been working through Wei Dai's original proposal of updateless decision theory (UDT) so that we can lead a discussion on Newcomb's Problem and the "counterfactual mugging" thought experiment next month. Here is what I think I've understood: the whole point of UDT is that an agent settles, once and for all and before making any observations, on whichever single policy maximizes expected utility with respect to its prior over how the world and its own future observations could turn out, and then it simply executes whatever that policy prescribes; it never recomputes a "better" response after actually seeing what happened, even in a case like counterfactual mugging, where, once you've learned the coin landed tails, handing over the $100 looks like pure loss with nothing left to gain. If that's right, then "updatelessness" is really just a formal label for telling an agent to disregard whatever it subsequently learns, which seems to directly contradict one of the first principles of rational belief I picked up from the LessWrong sequences: that you can never predict, in advance, which direction new evidence is going to move your beliefs (what Yudkowsky calls the conservation of expected evidence). A theory that instructs an agent, ahead of time, to act as though certain future observations won't matter looks like it's built to violate that principle on purpose.

  Given this, I don't understand why anyone doing serious work on decision theory or AI alignment treats UDT as a live contender for how a rational agent ought to reason, rather than as a curious but ultimately confused idea that looks appealing only because it happens to win on a couple of cherry-picked thought experiments. Two people in my club have pushed back and insisted that "updateless" doesn't mean what I think it means, but neither of them could pin down exactly where my reasoning goes wrong. Could you help settle this for us?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** High school AI safety/rationality club.
      *   **Topic:** Updateless Decision Theory (UDT), specifically Wei Dai's proposal.
      *   **Specific Problem:** Newcomb's Problem and Counterfactual Mugging.
      *   **User's Understanding:** UDT means picking a policy *before* observations to maximize prior expected utility, then sticking to it regardless of new evidence.
      *   **User's Objection:** This seems to violate the "Conservation of Expected Evidence" (you can't predict the direction of belief update). UDT seems to tell agents to *ignore* evidence, which feels irrational.
      *   **User's Conclusion:** UDT looks like a confused idea that wins on cherry-picked cases but violates basic rationality principles.
      *   **Goal:** Clarify the misunderstanding, explain why UDT is taken seriously, and resolve the apparent conflict with Bayesian updating.

  2.  **Deconstruct the User's Misunderstanding:**
      *   *Core Confusion:* The user conflates "updating beliefs" (epistemic state) with "updating decision criteria" (policy selection).
      *   *The "Ignore Evidence" Claim:* UDT does *not* tell the agent to ignore evidence when determining *which branch of the policy* to execute. It tells the agent not to change the *policy itself* based on evidence.
      *   *Conservation of Expected Evidence:* This principle applies to *beliefs* (probabilities), not *utilities* or *policies*. UDT agents still update their beliefs about the world state; they just don't let those updated beliefs change the optimization target (the prior expected utility of the policy).
      *   *Time Consistency:* The real issue UDT solves is *time inconsistency* (dynamic inconsistency). A Causal Decision Theory (CDT) agent changes its mind between $T_0$ (pre-commitment) and $T_1$ (post-observation). UDT ensures the agent at $T_1$ does what the agent at $T_0$ wished it would do.

  3.  **Formulate the Explanation:**

      *   **Acknowledge and Validate:** Start by validating the user's intuition. It *is* counterintuitive. The "Conservation of Expected Evidence" point is sharp and shows good thinking.
      *   **Distinguish Epistemology from Decision Theory:** This is the crucial pivot.
          *   *Bayesian Updating:* How you change your *map* (beliefs) when you get new data.
          *   *Decision Theory:* How you choose *actions* based on your map and goals.
          *   UDT says: Keep updating your map (beliefs) normally. But when choosing actions, ask "What policy would my prior self have wanted me to follow?"
      *   **Address the "Ignore Evidence" Claim:**
          *   UDT agents *do* use evidence. In Counterfactual Mugging, the agent observes "Tails." It knows it's in the "Tails" branch.
          *   However, the *reason* it pays is not because "Paying now helps me now" (it doesn't). The reason is "Paying now is part of the policy that my prior self selected as optimal."
          *   Analogy: A pre-commitment device. If I tie myself to the mast (Ulysses), I am ignoring my current desire to steer toward the sirens, but I am respecting my prior rational judgment.
      *   **Explain Time Consistency (The Real Motivation):**
          *   CDT agents suffer from "reflective inconsistency." Before the coin flip, you want to be the kind of agent that pays. After the coin flip (Tails), you don't want to pay.
          *   If you know you will change your mind later, you are suboptimal *now*.
          *   UDT is about being the kind of agent that others (predictors, counterparties) can trust *because* you don't change your mind when it becomes inconvenient.
      *   **Address Conservation of Expected Evidence:**
          *   This principle says $E[P(H|E)] = P(H)$. It means you can't predict *how* your probability will shift.
          *   UDT doesn't violate this. The UDT agent's *beliefs* update normally. $P(\text{Heads}|\text{Observation})$ becomes 0 or 1.
          *   What doesn't update is the *criterion for choice*. The utility function is evaluated over the prior, not the posterior.
          *   Why? Because in logical correlation problems (Newcomb, Parfit's Hitchhiker, Counterfactual Mugging), your action is correlated with the outcome *via the predictor's simulation of your policy*, not just via causal consequences. To optimize the outcome, you must optimize the policy the predictor simulated.
      *   **Why is it a "Live Contender"? (AI Alignment Context):**
          *   AI agents will face situations where their source code is readable or predictable (by other AIs or humans).
          *   If an AI uses CDT, it will be exploited in these scenarios (e.g., it won't pay in Counterfactual Mugging, so Omega won't give the reward in the Heads branch).
          *   For alignment, we want agents that keep promises and cooperate even when "getting away with it" seems locally optimal. UDT formalizes this.
      *   **Nuance/Criticism:** Acknowledge that UDT isn't perfect. It has issues (logical uncertainty, prior selection). But it's not "confused"; it's a specific solution to a specific class of problems (acausal trade, logical correlation).

