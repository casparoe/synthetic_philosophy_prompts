answer: |-
  Good evening. For those of you who know [Name] only from the stage, it might surprise you to learn that for thirty-two years, she has spent her days teaching students why the theater is morally dangerous.

  In her graduate seminars, she guided us through Jean-Jacques Rousseau's *Lettre à d'Alembert*, a famous text arguing that the theater turns active citizens into passive spectators. Rousseau believed that paying actors to feign passion corrupts the soul, and that watching virtue on a stage makes us feel we've done our duty without actually having to be virtuous. He argued that the only wholesome spectacle is a public festival, where there is no stage, no tickets, and no distinction between actor and audience—where the people *are* the show.

  Most people resolve this contradiction by compartmentalizing. They teach the philosophy in the morning and direct the play at night, hoping the two don't speak to each other. But [Name] is not most people. She never treated her theater as an escape from Rousseau's critique. She treated it as a rebuttal.

  Look at how she built this company. There is no raised stage here, no darkened auditorium separating the "talent" from the "town." The actors are not paid professionals feigning emotion for a wage; they are neighbors, teachers, and students offering their own earnestness. She cast whoever showed up with a willingness to try, rather than whoever auditioned with the most polish. And she avoided the cynicism Rousseau despised—the kind of comedy that trains us to laugh at the one honest person in the room.

  In short, she didn't build a theater to prove Rousseau wrong. She built a Genevan festival to prove him right. She spent three decades demonstrating that performance doesn't have to alienate us; it can bind us.

  Now, Rousseau himself was not immune to the itch of the footlights. He wrote that scathing critique of the theater while already the composer of a hit opera, *Le Devin du Village*. He couldn't help but create, even as he warned against it. I think [Name] understood that contradiction better than he did. She knew the impulse to perform is human, but the *structure* of the performance determines whether it corrupts or cultivates.

  And that brings us to tonight, and to her retirement.

  There is a question hanging over this succession that I know she has considered. Is handing this theater over to the town the least Rousseauian thing she could do, or the most?

  On one hand, walking away from the institution she built seems like an abandonment. It risks turning her life's work into a monument rather than a practice. But consider the alternative. If she remained the indispensable director, the singular vision holding it all together, then she would remain the star, and we would remain her audience. The distinction would return.

  By stepping down, by insisting that this company belongs to the citizens and not the founder, she is performing her final, most rigorous act of direction. She is making herself unnecessary. She is dissolving the distinction between the director and the directed, ensuring that the festival survives the founder.

  Rousseau wanted a spectacle where the actor vanishes into the citizen. Tonight, [Name] vanishes into the town.

  So, if you will raise your glasses.

  To [Name]. For teaching us that the best way to answer a philosopher is not with a paper, but with a life. And for building a stage so low, and a community so wide, that she has finally allowed us to stand on it without her.

  To [Name].
