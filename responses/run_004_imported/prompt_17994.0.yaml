      *   **Format:** Specific point-by-point comments, actual score (out of 20 or letter), preferably a JSON rubric.
      *   **Goal:** Provide a "sharper outside opinion" to check the user's own marking against, mimicking how a philosophy instructor would judge it (argument reconstruction, accuracy, critical analysis).
      *   **Input:** The prompt question (parts a, b, c) and the student's answer.

  2.  **Analyze the Subject Matter (Philosophy of Religion/Cosmology):**
      *   **Topic:** Fine-Tuning Argument (FTA).
      *   **Key Figures:** Ian Hacking (Inverse Gambler's Fallacy), John Leslie (Firing Squad/Selection Effects).
      *   **Standard Philosophical Consensus/Nuance:**
          *   *FTA:* Life-permitting constants are improbable under chance, more probable under design. Therefore, evidence favors design (Likelihood Principle).
          *   *Hacking's IGF:* Inferring a *multiverse* (many trials) from a single successful outcome (our universe) is fallacious. *Crucial Nuance:* Hacking originally targeted the *multiverse* inference, not necessarily the *design* inference directly, though the structural analogy is often applied to both in introductory contexts. However, the student's answer conflates Hacking's target slightly.
          *   *Leslie's Firing Squad:* This is an *analogy* used to defend the intuition that survival *is* surprising and needs explanation (against the "you wouldn't be here to observe it" objection). *Wait, let's check the student's interpretation.*
          *   *The Student's Interpretation of Leslie:* The student claims Leslie uses the Firing Squad to say survival is *not* evidence because of selection effects ("you can't treat it as a mystery... alternative was never something you could have observed").
          *   *The Actual Philosophical Consensus on Leslie:* John Leslie *defends* the Fine-Tuning Argument. He uses the Firing Squad analogy to argue *against* the selection effect objection (often associated with the Weak Anthropic Principle). Leslie argues that *even with* selection effects, the event is so improbable that it demands explanation (design or multiverse). The student has inverted Leslie's position. Leslie thinks the survivor *should* be surprised and *should* infer something special happened (e.g., the shooters missed on purpose). The student claims Leslie thinks the survivor should *not* be surprised.
          *   *Hacking vs. Leslie:* Hacking says inferring many trials (multiverse) from one success is a fallacy. Leslie says the success is genuinely surprising and needs explanation (supporting Design or Multiverse, but specifically using the Firing Squad to show selection effects don't dissolve the need for explanation).
          *   *The Student's Error:* The student claims Leslie argues that selection effects *drain* the evidential force. This is the opposite of Leslie's actual view. Leslie argues selection effects do *not* drain the evidential force.

  3.  **Evaluate the Student's Answer (Part by Part):**

      *   **Part (a) Reconstruct FTA and Hacking:**
          *   *FTA Reconstruction:* Solid. Mentions constants, narrow range, likelihood principle ("higher likelihood... counts as evidence"). Good.
          *   *Hacking/IGF Reconstruction:* Mostly accurate on the analogy (casino, double sixes, inferring previous rolls). *However*, Hacking's specific target was the *Multiverse* hypothesis (inferring many universes from one fine-tuned one), not primarily the *Design* hypothesis, though the structural logic is the same. The student says "inferring design (or, for that matter, a multiverse)." This is a minor conflation but acceptable in an intro context. The explanation of the fallacy itself is clear.
          *   *Verdict:* Strong on FTA, Good on IGF analogy, slight imprecision on Hacking's specific target (Design vs. Multiverse), but passable.

      *   **Part (b) Explain Leslie's Firing Squad:**
          *   *The Student's Claim:* "Leslie's diagnosis is that since you'd only ever be around afterward... your survival is guaranteed... isn't actually evidence... you can't treat it as a mystery."
          *   *The Reality:* Leslie uses the Firing Squad to argue the *opposite*. He argues that *despite* the selection effect (you can't observe your death), the survival is *still* surprising and demands explanation (e.g., the shooters intended to miss).
          *   *The Error:* The student has attributed the *objection* to Leslie. The student describes the "Anthropic/Selection Effect Objection" and claims Leslie is making it. Leslie is actually *replying* to that objection to save the FTA.
          *   *Verdict:* **Critical Failure.** This is a fundamental misunderstanding of the philosopher's position. It flips the argument on its head.

      *   **Part (c) Critical Evaluation:**
          *   *The Student's Claim:* "I think Leslie is right... drains the fine-tuning of its evidential force... Hacking's fallacy and Leslie's selection effect are really making the same underlying point."
          *   *The Reality:* Since the student misunderstood Part (b), Part (c) is consistent with their misunderstanding but philosophically wrong regarding Leslie. Leslie does *not* think selection effects drain evidential force. Hacking and Leslie are often seen as opposing or addressing different things (Hacking: don't infer multiverse from single case; Leslie: single case is still surprising).
          *   *Verdict:* Internally consistent, but based on a false premise established in (b). The evaluation is insightful *if* the premise were true, but since the premise is false, the credit is limited.

  4.  **Determine the Grade:**
      *   Total: 20 points.
