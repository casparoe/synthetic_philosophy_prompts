answer: |-
  This is one of the most famous debates in 20th-century jurisprudence, and your intuition is shared by almost everyone who first encounters it. The "Grudge Informer Case" (often associated with the *Radbruch Formula*) seems like a slam dunk for Natural Law: How can a system that calls itself "law" defend itself against monsters if it admits that monstrous rules count as law?

  However, the reason Legal Positivism remains the dominant framework in Western law schools and courts isn't because lawyers are morally squeamish or secretly sympathetic to Nazis. It is because Hart's position, properly understood, offers specific protections against tyranny that Fuller's position inadvertently weakens.

  There are three major misconceptions in your summary that, once cleared up, explain why Hart is still taken seriously.

  ### 1. Hart did not say the woman should go free
  This is the most common misunderstanding of the debate. Hart did not argue that the woman was innocent or that she should escape punishment.

  Hart argued that the post-war German court was being **dishonest**.
  *   **Fuller's view:** The Nazi statute was so evil it wasn't "law," so the court could just ignore it and convict her under older statutes without passing new rules.
  *   **Hart's view:** The Nazi statute *was* law (however evil). Therefore, punishing the woman for following it is **retroactive punishment**.

  Hart's solution was morally serious: He argued the new German government should pass a **retroactive statute** explicitly criminalizing her actions and *then* punish her.

  Why does this matter? Hart believed it is better to openly admit, "We are punishing you retroactively because it is morally necessary," than to lie and say, "This valid law was never actually law." For Hart, lying about the nature of law corrupts the legal system's integrity. He believed we should have the courage to break the principle of *nullum crimen sine lege* (no crime without law) openly in extreme cases, rather than pretending the principle wasn't broken.

  ### 2. Positivism is not "Blind Obedience"
  Your cousin's defense of Hart likely touched on this, but it bears repeating: **Legal Positivism is not a theory of obedience; it is a theory of identification.**

  Hart's famous maxim is: *"The existence of law is one thing; its merit or demerit is another."*

  Positivism does not say, "You must obey unjust laws." It says, "This is an unjust law."
  *   **Natural Law** risks blurring the line. If a law is unjust, the Natural Lawyer says "It isn't law." This can lead citizens to think they have no legal obligation to follow it.
  *   **Positivism** sharpens the line. It says, "This is a valid law, but it is so wicked that you have a **moral** obligation to disobey it."

  Hart argued that the German people's tragedy wasn't that they thought Nazi rules were "law." The tragedy was that they thought "Law = Morality." They believed that because something was enacted by the state, it *must* be morally right. Hart believed that separating law and morality actually empowers citizens to resist. It forces you to look at a statute and say, "This is the law, but it is evil, and I will not do it."

  ### 3. The Danger of Fuller's Position (Why Judges Prefer Hart)
  If Natural Law is so morally satisfying, why don't judges use it as the default? Because it grants judges terrifying power.

  Fuller's argument requires a judge to determine whether a statute is "so unjust it ceases to be law."
  *   **In 1949 Germany:** This feels great. The judges are punishing Nazis.
  *   **In 1950s USA:** This logic was used by segregationist judges to declare *Brown v. Board of Education* "unjust" and therefore void.
  *   **In Modern Times:** If judges can void legislation simply because they deem it "immoral," it undermines democracy. It transfers legislative power from elected representatives to unelected judges.

  Positivism provides **stability and predictability**. It tells the judge: "Your job is to apply the rules passed by the legislature. If the rules are evil, your job is to apply them while screaming about it, or resign, or encourage the legislature to change them. But do not pretend you have the power to erase them."

  In a pluralistic society where people disagree on what is "moral," Positivism provides a neutral framework. Natural Law requires a shared agreement on morality, which often doesn't exist.

  ### The Nuremberg Misconception
  You mentioned that "just following orders" wasn't accepted at Nuremberg, implying Natural Law won there. Actually, the Nuremberg Tribunal was careful to ground its judgments in **Positive International Law** (treaties, customs of war, the Kellogg-Briand Pact), not abstract Natural Law.

  The Allies knew that if they argued purely on Natural Law grounds ("Crimes against Humanity"), they would be accused of "victor's justice" and retroactive lawmaking. They tried to show that the Nazis had violated existing positive laws of war. Hart's positivism is actually compatible with Nuremberg; it just requires admitting that new categories of crimes were being created to fit the unprecedented evil.

  ### The Synthesis: The Radbruch Formula
  In practice, the legal world adopted a compromise, known as the **Radbruch Formula** (named for the German legal philosopher Gustav Radbruch).

  Radbruch was a positivist before the war. After the war, he shifted. His formula states: Positive law should be followed *unless* the conflict between the statute and justice reaches an "intolerable level."

  This is essentially Natural Law with a high threshold. It acknowledges Hart's point (law is usually valid regardless of content) but accepts Fuller's point (extreme injustice breaks the legal character).

  ### Summary
  Hart's Positivism remains dominant not because lawyers don't care about morality, but because:
  1.  **Honesty:** It forces legislatures to take responsibility for retroactive punishment rather than hiding behind judicial magic tricks.
  2.  **Restraint:** It prevents judges from striking down laws they personally dislike by claiming they are "immoral."
  3.  **Clarity:** It allows citizens to clearly distinguish between "legal obligations" and "moral obligations," which is crucial for conscientious objection and resistance.

  Fuller wins the moral argument in the specific case of the Nazis. But Hart wins the structural argument for how a legal system should function in normal times to prevent future tyrannies. Law schools teach Hart not to excuse the Nazis, but to ensure that judges don't acquire the power to decide which laws are "too unjust" to enforce—a power that can easily be turned against the vulnerable.
