answer: |-
  **Title:** Patterns in the Superposition: Defending Realism in Mechanistic Interpretability

  **Introduction**
  The emergence of mechanistic interpretability (MI) has reignited a classic debate in the philosophy of mind: are the representations we posit in cognitive systems genuine ontological constituents, or are they merely instrumental tools for prediction? In the context of large language models, this question has sharpened. Recent work by Anthropic on sparse autoencoders (SAEs) has demonstrated that we can identify "monosemantic" features—such as a "Golden Gate Bridge" feature—that, when amplified via activation patching, causally determine model output. To the realist, this causal leverage suggests these features are real. To the instrumentalist, phenomena like superposition and feature splitting suggest there is no privileged fact of the matter about what constitutes a feature, vindicating a Dennett-style view where features are merely "real patterns" useful for compression, not fundamental entities.

  This paper argues that we are entitled to a robust realism about the representations posited by mechanistic interpretability. While the instrumentalist critique correctly identifies that neural representations do not conform to a localist, symbol-like ontology, it mistakenly infers from this that they are therefore unreal. By engaging with William Ramsey's "job description challenge" and re-evaluating Dennett's "Real Patterns" in light of causal intervention, I will demonstrate that MI features satisfy the functional requirements for realism. The non-uniqueness of feature bases is an epistemic problem for the interpreter, not an ontological problem for the model.

  **Ramsey's Job Description Challenge**
  To determine if a posited entity is a genuine representation, William Ramsey argues we must meet the "job description challenge." It is insufficient to show that a state correlates with a worldly condition (e.g., a neural firing pattern correlates with the concept of a bridge). Correlation is cheap; a probe can decode information from almost any high-dimensional system without that information being *used* by the system. For a state to be a representation, it must play a specific functional role: it must stand in for the content in the system's reasoning or computation, driving downstream processing in a way that respects the content's structure.

  The first camp in our seminar argues that activation patching meets this challenge. When we intervene on the "Golden Gate Bridge" feature vector and the model begins to hallucinate bridges, we are not merely observing a correlation; we are manipulating the causal mechanism that produces the output. This moves beyond the "mere encoding" critique. If the feature were epiphenomenal, patching it would not systematically alter the generative trajectory of the model. By demonstrating that the feature is a causal lever in the computational graph, MI provides evidence that the feature is doing the "job" Ramsey demands: it is being consumed by downstream layers to construct meaning.

  **The Instrumentalist Objection: Superposition and Non-Uniqueness**
  The instrumentalist camp, however, draws on the mathematical realities of neural networks to undermine this conclusion. The phenomenon of superposition—where the model represents more features than it has dimensions—implies that features are not discrete, localizable entities but rather interference patterns across shared neurons. Furthermore, as dictionary sizes in SAEs increase, features "split." A single "bridge" feature at one sparsity level might fracture into "suspension bridges," "San Francisco landmarks," and "red structures" at another.

  If the boundaries of a representation shift depending on the granularity of our analytical tools (the SAE dictionary size), the instrumentalist argues, there is no privileged fact of the matter about which feature is the "real" one. This aligns with a strong reading of Dennett, where representations are "real" only in the thin sense that they offer a useful compression for the observer. On this view, the "Golden Gate Bridge" feature is a tool for *us* to understand the model, not a component *of* the model. To be a realist about such shifting targets would be to reify a taxonomy rather than a reality.

  **Defending Realism: Ontology vs. Taxonomy**
  The instrumentalist argument conflates the instability of our *descriptions* with the instability of the underlying *causal structure*. That feature identity is sensitive to dictionary size does not entail that the computational subspace responsible for the behavior is unreal.

  Consider the physics of fluid dynamics. We can describe a vortex using different mathematical bases or at different resolutions. At a coarse resolution, it is one swirl; at a fine resolution, it decomposes into smaller eddies. It would be absurd to claim the vortex is "instrumental" merely because its precise boundaries depend on our measurement scale. Similarly, in neural networks, the "feature" corresponds to a specific subspace of the activation space that carries causal efficacy. Superposition reveals that the hardware implementation is distributed, not localist, but a distributed subspace is no less physically real than a single neuron.

  Ramsey's challenge requires that the representation do work. The work is being done by the geometry of the activation space. Whether we label a specific vector in that space "Golden Gate Bridge" or "Red Suspension Structure" is a taxonomic choice, but the causal potency of that region of the space is an ontological fact. The non-uniqueness of the SAE basis is an artifact of the approximation method used to recover the features, not proof that the model lacks structure. The model *must* compute using specific geometric relationships to produce coherent text; those relationships exist independently of our ability to perfectly parse them. Therefore, the realist is justified in positing the existence of these functional subspaces.

  **Dennett Vindicated, Not Vindictive**
  Finally, the instrumentalist reading of Dennett is often overly deflationary. In "Real Patterns," Dennett does not argue that patterns are unreal; he argues that reality *is* constituted by patterns that support prediction and explanation. The instrumentalist camp uses Dennett to say, "Features are just useful fictions." But Dennett's criterion is precisely that if a pattern allows for successful prediction (and, we might add, intervention), it is as real as anything else in the special sciences.

  The "Golden Gate Bridge" feature allows us to predict model behavior under intervention with high fidelity. It compresses the complexity of millions of parameters into a human-intelligible causal story. Under Dennett's own criteria, this makes the feature a "Real Pattern." To deny realism here is to demand a level of fundamental physical discreteness (like atoms in a vacuum) that we do not require for beliefs, desires, or even genes. If we are realists about mental states in humans despite their supervenience on messy biology, we should be realists about features in models despite their supervenience on superposed tensors. The instrumentalist concedes too much by treating "useful for us" as mutually exclusive with "real in the system." In a functionalist framework, being useful for the system (via causal intervention) *makes* it real.

  **Conclusion**
  The debate over mechanistic interpretability often stalls on a false dichotomy: either representations are discrete, localist symbols, or they are instrumental fictions. We must reject this fork. We are entitled to realism about the representations posited by mechanistic interpretability, provided we understand those representations as causally stable subspaces rather than atomic symbols. Ramsey's job description challenge is met through activation patching, which demonstrates that these features are not merely decoded but causally employed. The phenomena of superposition and feature splitting challenge a naive ontology of representation, but they do not negate the reality of the computational structures themselves. Dennett's framework, properly understood, supports this view: patterns that sustain intervention are real patterns. To deny this is to hold AI to a metaphysical standard we do not apply to the human mind. The features are not just in the eye of the beholder; they are in the weights, waiting to be patched.
