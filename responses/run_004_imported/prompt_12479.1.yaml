prompt: |-
  So I've read a bunch of the standard explanations of superrationality (Hofstadter's idea that if two of you are perfectly logical and facing a symmetric problem you basically have to reach the same answer, so you cooperate in a one-shot PD) but nobody ever really spells out how thats actually different from just running evidential decision theory on a twin prisoners dilemma. EDT already gets you cooperation there for free, since your choice is evidence about what your psychological twin chooses -- so is the symmetry argument doing any independent work, or is superrationality basically just EDT for symmetric games wearing Hofstadter's terminology? Compare the two properly: tell me where they'd actually cash out in different recommendations, if there's anywhere they do, and whether the "we have to reach the same answer" move is really an evidential claim or something closer to a Kantian universalizability move in disguise.
reasoning: |-
  Here's a thinking process that leads to the comparison between Superrationality and Evidential Decision Theory (EDT):

  1.  **Deconstruct the User's Query:**
      *   **Core Question:** Is Hofstadter's "superrationality" just Evidential Decision Theory (EDT) applied to symmetric games (like the Twin Prisoner's Dilemma), or is there a substantive difference?
      *   **Specific Tasks:**
          *   Compare the two frameworks properly.
          *   Identify scenarios where they yield different recommendations (if any).
          *   Analyze the philosophical underpinning: Is the "same answer" move an evidential claim or a Kantian universalizability move?
      *   **Tone:** Analytical, philosophical, precise, slightly skeptical (matching the user's "nobody ever really spells out" vibe).

  2.  **Initial Assessment & Definitions:**
      *   **Superrationality (Hofstadter):** Agents assume that because they are rational and the situation is symmetric, they will reason identically and thus choose identically. It treats the correlation between choices as *logical* or *metaphysical*, not just causal or statistical. Key phrase: "We must reach the same conclusion."
      *   **Evidential Decision Theory (EDT):** Agents choose the action that provides the best *news* about the outcome. $A \succ B$ iff $P(O|A) > P(O|B)$. In Twin PD, my choice is strong evidence of my twin's choice because we share a source code/psychology.
      *   **Causal Decision Theory (CDT):** Agents choose the action that *causes* the best outcome. Usually defects in PD because my choice doesn't causally affect the twin's.
      *   **Functional Decision Theory (FDT) / Timeless Decision Theory (TDT):** Modern descendants that formalize the "logical correlation" idea.

  3.  **Comparing Superrationality and EDT:**
      *   *Similarity:* Both cooperate in the Twin Prisoner's Dilemma. Both rely on a correlation between the agent's decision and the other player's decision.
      *   *Difference in Justification:*
          *   EDT says: "My choosing C makes it *probable* you chose C." (Conditional probability).
          *   Superrationality says: "My choosing C *means* you chose C because we are running the same algorithm." (Logical identity).
      *   *The "Newcomb" Test:* This is the classic wedge between EDT and CDT. What about Superrationality vs. EDT in Newcomb's Problem?
          *   EDT one-boxes.
          *   Superrationality (interpreted broadly) usually one-boxes (if you view the Predictor as a perfect simulator of you).
      *   *The "Psychopath Button" Test:* This is the classic wedge between EDT and CDT/FDT.
          *   Scenario: Button kills all psychopaths. You are not a psychopath. But only psychopaths would press the button.
          *   EDT: Don't press. (Pressing is evidence you are a psychopath, which is bad).
          *   CDT: Press. (Pressing doesn't make you a psychopath).
          *   Superrationality? This is tricky. Superrationality is usually framed for *multi-agent symmetric games*, not single-agent decision problems with self-prediction.
      *   *The "Asymmetric Game" Test:* Superrationality relies heavily on *symmetry*. EDT does not.
          *   If I play PD against someone slightly less rational, Superrationality might break down (Hofstadter discusses degrees of rationality). EDT just looks at the conditional probabilities regardless of *why* the correlation exists.

  4.  **Where do they diverge? (The Crucial Step):**
      *   *Scenario 1: Imperfect Correlation.*
          *   EDT handles probabilities $P(Twin=C | Me=C) = 0.99$.
          *   Superrationality often assumes a binary "same reasoning = same output." Hofstadter does discuss "probability of superrationality," but the core intuition is logical identity.
      *   *Scenario 2: The Source of Correlation.*
          *   EDT is agnostic. Correlation could be due to common cause, direct causation, or logical identity.
          *   Superrationality insists the correlation is due to *logical necessity* arising from shared rationality.
      *   *Scenario 3: Newcomb's Problem with a Flawed Predictor.*
          *   EDT: One-box if $P(Money|1Box)$ is high enough.
          *   Superrationality: If the Predictor is simulating *your reasoning*, it's the same logic. If the Predictor is just a psychic, is it superrationality? Hofstadter focuses on *reasoning agents*.
      *   *Scenario 4: The "Clonal" vs. "Twin" distinction.*
          *   Actually, the biggest divergence is often framed in modern terms as EDT vs. FDT. Superrationality is the proto-FDT.
          *   *Key Divergence:* **The Smoking Lesion.**
              *   EDT says: Don't smoke (smoking is evidence of the lesion).
              *   CDT/FDT/Superrationality (interpreted as logical decision making) says: Smoke (your choice doesn't cause the lesion, nor is it logically determined by the lesion in the same way a twin's choice is).
              *   *Wait, does Superrationality apply here?* Superrationality is about *other agents*. The Smoking Lesion is about *your own biology*. However, if we treat the "Lesion" as a "Twin" that determines your behavior... no, that stretches it.
              *   Better Divergence: **Parfit's Hitchhiker.**
                  *   EDT: Promise to pay (if promising is evidence you will pay, and being saved depends on that evidence).
                  *   Superrationality: If the driver is a perfect predictor of your reasoning, you pay.
              *   Actually, the cleanest divergence is **Asymmetric Information/Capabilities.**
                  *   Superrationality requires symmetry. If Player A knows Player B is rational, but Player B doesn't know Player A is rational, Superrationality is murky. EDT just updates on the available evidence.

  5.  **Philosophical Underpinnings: Evidential vs. Kantian:**
      *   *Evidential:* "My action is a sign of the state of the world."
      *   *Kantian:* "Act only according to that maxim whereby you can at the same time will that it should become a universal law."
      *   *Superrationality:* "Act as if your decision determines the decision of all identical reasoners."
      *   This looks much more like **Rule Utilitarianism** or **Kantian Universalizability** than pure EDT. EDT is about *conditional probability*. Superrationality is about *logical counterfactuals*. "If I were to decide C, then it *must* be the case that you decide C." EDT says "If I decide C, it is *likely* you decided C."
      *   Hofstadter's language ("must reach the same answer") implies a constraint on reality/logic, not just a Bayesian update. This aligns closer to **Functional Decision Theory (FDT)** which treats decisions as outputs of a logical function.

  6.  **Synthesizing the Argument:**
      *   **Thesis:** Superrationality is *not* just EDT. It is a proto-version of FDT/TDT. While they overlap in the Twin PD, they diverge in cases where correlation exists without logical identity (Smoking Lesion) or where symmetry is broken.
      *   **Point 1: The Nature of the Link.** EDT = Statistical/Bayesian. Superrationality = Logical/Metaphysical.
      *   **Point 2: The Smoking Lesion Problem.** This is the killer argument. EDT fails (doesn't smoke). Superrationality (if applied to self-consistency) should arguably pass (smoke), because the lesion isn't a *reasoning agent*. But strictly, Superrationality is multi-agent. Let's stick to multi-agent divergences.
      *   **Point 3: Asymmetry.** EDT works in asymmetric games. Superrationality struggles.
      *   **Point 4: Kantianism.** The "universalizability" angle is strong. It's about prescribing a rule for a *type* of agent, not just maximizing expected utility based on news.

  7.  **Refining the "Different Recommendations" section:**
      *   Need a concrete case where EDT cooperates but Superrationality defects (or vice versa).
      *   *Case:* **The Non-Twin PD.**
          *   You play PD against a random person.
          *   EDT: If you think random people are likely to copy you (unlikely), you cooperate. If not, you defect.
          *   Superrationality: If you assume the other person is *superrational*, you cooperate. If you assume they are merely rational (CDT), you defect.
          *   This isn't a divergence in theory, but in assumptions.
      *   *Case:* **The Common Cause without Logic.**
          *   Imagine a brain wave scanner makes us correlate, but we aren't reasoning identically.
          *   EDT: Cooperate (evidence is there).
          *   Superrationality: Defect (no logical identity of reasoning).
          *   *Wait, does Hofstadter allow this?* Hofstadter emphasizes the *reasoning process*. If the correlation is accidental (common cause not involving reasoning), Superrationality shouldn't trigger. EDT doesn't care about the mechanism.
      *   *Case:* **The "Almost" Twin.**
          *   Twin is 99% similar.
          *   EDT: Calculate $0.99 \times Payoff$.
          *   Superrationality: Hofstadter talks about "probability of superrationality." It becomes fuzzy.
      *   *Better Case:* **Newcomb with a Non-Simulator Predictor.**
          *   Predictor is a psychic, not a simulator.
          *   EDT: One-box (evidence).
          *   Superrationality: Might two-box? Because the Predictor isn't running *my reasoning*, they are just looking into the future. There is no "shared algorithm." Hofstadter's view hinges on *shared rationality*. If the correlation isn't due to shared rationality, is it superrationality? Probably not.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the intuition (they look the same in Twin PD) but state the thesis (they differ in mechanism and scope).
      *   **Mechanism:** EDT (Conditional Prob) vs. Superrationality (Logical Identity).
      *   **Divergence 1: The Source of Correlation (Smoking Lesion / Common Cause).** EDT bites the bullet on spurious correlations; Superrationality requires logical derivation.
      *   **Divergence 2: Asymmetry.** EDT handles it fine; Superrationality relies on symmetry.
      *   **Philosophical Classification:** It's closer to Kantian Universalizability or Rule Utilitarianism than pure EDT. It's a "logical counterfactual" move (anticipating FDT).
      *   **Conclusion:** Superrationality is a specific, stricter subset of EDT that adds a metaphysical claim about logical necessity, making it a precursor to FDT rather than just EDT.

  9.  **Self-Correction/Nuance Check:**
      *   *Did Hofstadter explicitly distinguish from EDT?* He wrote before EDT was fully formalized in this context (Nozick's Newcomb was 1969, Hofstadter's Sci Am columns were early 80s). He was reacting to CDT/Game Theory orthodoxy.
      *   *Is Superrationality actually FDT?* Yes, Yudkowsky explicitly cites Hofstadter as the inspiration for TDT/FDT. I should mention this lineage.
      *   *Kantian Move:* Be careful not to say it *is* Kantian ethics. It's decision-theoretic, but the *structure* of the argument ("act as if your choice sets the rule for all identical agents") is structurally isomorphic to the Categorical Imperative.

  10. **Final Polish:** Ensure clear headings, precise terminology (conditional probability vs. logical counterfactuals), and a direct answer to the "independent work" question. (Yes, it does independent work by restricting *which* correlations count).

  **(Self-Correction during drafting):** I need to be careful with the Smoking Lesion. Superrationality is explicitly about *games* (multi-agent). Applying it to Smoking Lesion requires stretching it to "single agent decision theory." It's better to stick to multi-agent scenarios where the *source* of correlation differs.
  *Revised Divergence:* **The "Common Cause" Twin.**
  *   Scenario: We are twins because a mad scientist wired our brains to match, not because we are reasoning identically.
  *   EDT: Cooperate (Choice is evidence of Twin's Choice).
  *   Superrationality: Defect (We are not reaching the answer via reason; the correlation is mechanical).
  *   *Wait,* Hofstadter might say if the output is the same, the reasoning is effectively the same. But his emphasis is on *rationality*. If the correlation bypasses reasoning, Superrationality loses its normative force. This is a key distinction. EDT is descriptive of evidence; Superrationality is prescriptive of *reason*.

  Okay, ready to write.
answer: |-
  You have hit on one of the most persistent ambiguities in decision theory. Your intuition is sharp: in the specific case of the **Twin Prisoner's Dilemma**, Superrationality and Evidential Decision Theory (EDT) yield the same recommendation (Cooperate). Because of this overlap, Superrationality is often dismissed as "EDT with extra steps" or "folk FDT (Functional Decision Theory)."

  However, Superrationality is **not** just EDT. While they overlap in symmetric, high-correlation games, they diverge in their metaphysical commitments, their handling of asymmetry, and the *source* of the correlation they require.

  Here is the proper comparison, where they cash out differently, and an analysis of the philosophical "move" Hofstadter is making.

  ---

  ### 1. The Mechanism: Conditional Probability vs. Logical Identity

  The fundamental difference lies in *why* the agent expects the other to match their move.

  **EDT (The Bayesian View):**
  EDT maximizes $E[U] = \sum P(O|A) \cdot U(O)$.
  In the Twin PD, EDT cooperates because $P(\text{Twin Cooperates} | \text{I Cooperate})$ is high. EDT is agnostic about *why* this probability is high. It could be because we are clones, because we are twins, because a god wired our brains together, or because we both read the same book. As long as the conditional probability holds, EDT cooperates.
  *   **Claim:** "My choice is *evidence* of your choice."

  **Superrationality (The Logical View):**
  Hofstadter's argument is not based on statistical evidence but on **logical necessity**. He argues that if two agents are perfectly rational and face a symmetric problem, there is only *one* correct solution. Therefore, if I deduce that Cooperation is the correct solution, you must deduce the same.
  *   **Claim:** "My choice *logically determines* your choice because we are instantiating the same algorithm."

  **The Independent Work:**
  Superrationality does independent work by **filtering which correlations count.** EDT counts *all* correlations. Superrationality only counts correlations derived from shared rationality in symmetric contexts.

  ---

  ### 2. Where They Diverge: Three Test Cases

  If Superrationality were just EDT, they would never disagree. They do disagree when the correlation exists but isn't "logical," or when the symmetry breaks.

  #### A. The "Common Cause" Twin (Mechanical vs. Rational)
  Imagine you are in a PD with a twin. However, the correlation isn't because you are both reasoning perfectly. A mad scientist has implanted a chip in both your brains that forces your motor cortices to fire identically, regardless of your reasoning. You can *try* to defect, but the chip will make you cooperate if the twin cooperates.

  *   **EDT:** Cooperates. Your attempt to cooperate is near-perfect evidence that the twin will cooperate. The source of the correlation (chips vs. reason) is irrelevant to the conditional probability.
  *   **Superrationality:** Defects (arguably). Hofstadter's argument relies on the agents *reasoning* their way to the same conclusion. If the correlation is mechanical and bypasses reasoning, the "superrational" argument—that we must reach the same *answer*—loses its normative force. You aren't choosing the outcome; the chip is. Superrationality is a prescription for *reasoners*, not a description of causal links.

  #### B. Asymmetric Games
  EDT is general; it applies to any decision problem where actions provide evidence about outcomes. Superrationality is specifically built for **symmetric** games.

  *   **Scenario:** You are a super-intelligence playing PD against a human. You know the human tends to copy you, but they are not "superrational" in Hofstadter's sense (they might be irrational, emotional, etc.).
  *   **EDT:** Cooperates if $P(\text{Human C} | \text{Me C})$ is sufficiently high.
  *   **Superrationality:** Struggles. The symmetry condition is violated. Hofstadter discusses "degrees of rationality," but the core "we must reach the same answer" move fails because the human isn't running the same logical algorithm. Superrationality lacks a clear prescription here, whereas EDT simply plugs in the probabilities.

  #### C. The Smoking Lesion (Single Agent Analog)
  This is the classic wedge between EDT and Causal/Functional theories.
  *   **Scenario:** A lesion causes both cancer and a desire to smoke. Smoking does not cause cancer. You want to smoke.
  *   **EDT:** Don't smoke. Smoking is bad news (evidence of the lesion).
  *   **Superrationality:** This requires stretching the definition, as Superrationality is multi-agent. However, if we treat "Your Reasoning" vs. "The Lesion's Determination" as the two agents:
      *   If the lesion determines your choice mechanically, Superrationality (like FDT) would say: **Smoke.** Your decision is the output of a logical function. The lesion is a prior physical state. You cannot logically correlate your *reasoning* with a *physical lesion* in the same way you correlate with another reasoner.
      *   If Superrationality is strictly about *other agents*, it doesn't apply. But if viewed as a precursor to FDT (which it is), it rejects the EDT conclusion. It argues that you should not treat your decision as *evidence* of a fixed state (the lesion), but as the *determination* of the outcome.

  ---

  ### 3. Is it Evidential or Kantian?

  You asked if the "we have to reach the same answer" move is an evidential claim or a Kantian universalizability move in disguise.

  **It is much closer to Kantian Universalizability.**

  **Why it's not pure EDT:**
  EDT is fundamentally passive. It says, "Given the world as it is, which action gives me the best news?" It accepts the correlations as fixed facts of the universe.
  Superrationality is active/prescriptive. It says, "Because we are rational, the universe *must* conform to this logical constraint." It treats the correlation not as a statistical fact to be observed, but as a logical constraint to be enforced by the act of reasoning.

  **The Kantian Isomorphism:**
  Kant's Categorical Imperative: *"Act only according to that maxim whereby you can at the same time will that it should become a universal law."*
  Hofstadter's Superrationality: *"Act assuming that all identical reasoners will derive the same output from this situation."*

  Both frameworks ask the agent to step outside their particular instance and consider the **function** they are instantiating.
  *   **Kant:** If everyone did this, would the system work?
  *   **Hofstadter:** If every instance of this algorithm did this, what is the payoff?

  In both cases, the agent is asked to ignore the causal isolation of their specific body (CDT) and the mere statistical evidence of their action (EDT) and instead act as a **legislator for a type of agent.**

  ### 4. The Modern Verdict: Superrationality as Proto-FDT

  The reason nobody spells out the difference clearly is that Superrationality was an informal intuition that was later formalized by **Timeless Decision Theory (TDT)** and **Functional Decision Theory (FDT)** (developed by Yudkowsky, Soares, etc.).

  *   **EDT:** $A$ is evidence of $B$.
  *   **CDT:** $A$ causes $B$.
  *   **FDT/Superrationality:** $A$ and $B$ are both outputs of the same logical function $f(x)$.

  FDT clarifies the distinction you are looking for. FDT agrees with EDT in the Twin PD, but **disagrees** in the Smoking Lesion (FDT smokes, EDT doesn't). Since Superrationality is the philosophical ancestor of FDT, it inherits this distinction.

  **Conclusion:**
  Superrationality is **not** just EDT.
  1.  **Scope:** EDT applies to any correlation; Superrationality applies only to logical correlations between reasoners.
  2.  **Mechanism:** EDT relies on conditional probability; Superrationality relies on logical identity of algorithms.
  3.  **Philosophy:** It is a decision-theoretic formalization of **Kantian Universalizability**. It asks you to act as the universal instance of your reasoning type, rather than an isolated agent gathering evidence.

  If you treat Superrationality as EDT, you lose the normative force of the argument. EDT tells you to cooperate because it's *probable* the other will too. Superrationality tells you to cooperate because if you don't, you are violating the laws of logic that govern identical reasoners. That is a much stronger, and philosophically distinct, claim.
