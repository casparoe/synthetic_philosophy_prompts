answer: |-
  **MEMORANDUM**

  **TO:** The Full Student Senate
  **FROM:** Committee on Elections and Bylaws
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Voting Eligibility and Online Student Enfranchisement

  ### I. Purpose
  The Committee on Elections and Bylaws submits this memo to recommend amendments to the Student Senate Constitution regarding voting eligibility. Specifically, we address the petition from the Online Student Caucus requesting enfranchisement for the approximately 4,000 students enrolled in fully online degree programs, who are currently excluded from voting or holding office due to non-payment of the Mandatory Activity Fee.

  ### II. Context and Current Bylaws
  Under Article III, Section 1 of the current Constitution, voting rights and eligibility for office are restricted to students billed for the Mandatory Activity Fee. As this fee is levied only on on-campus students, it effectively disenfranchises the online student population. The Committee has reviewed testimony from the Online Student Caucus, feedback from the general student body, and fiscal impact statements from the Treasury Committee.

  ### III. Analysis of Arguments

  **A. The Case for Enfranchisement (Online Student Caucus)**
  The Committee gives substantial weight to the Caucus's primary argument: that the Senate's authority extends beyond the allocation of the Activity Fee. The Senate serves as the recognized governing body for *all* students in two critical areas:
  1.  **Academic Policy:** The Senate drafts and advocates for policies on academic integrity, grading standards, and course evaluation. These policies bind online students equally. To subject a population to binding legislation without granting them a vote violates the fundamental democratic principle of "no legislation without representation."
  2.  **Tuition Advocacy:** When the Senate lobbies the Administration regarding tuition rates, it claims to speak for "the student body." Excluding 4,000 students from this representation undermines the Senate's moral authority and weakens its negotiating position. Online students contribute significant tuition revenue that sustains the university's infrastructure; their exclusion suggests their stake in the institution's governance is secondary to their physical location.

  **B. The Case for Fiscal Alignment (Opponents)**
  Opponents argue that the electorate must align with the funding base. The Activity Fee funds the Senate's operational budget, event programming, and club grants. Allowing non-contributors to vote on how these funds are allocated creates a "moral hazard," where voters may approve spending without bearing the cost. This group contends that expanding the franchise without expanding the tax base dilutes the voting power of on-campus students who currently subsidize the Senate's existence.

  ### IV. Committee Recommendation
  The Committee finds both arguments valid but incomplete in isolation. Restricting all voting rights ignores the Senate's legislative role, while granting unrestricted voting rights ignores the fiscal reality. Therefore, the Committee recommends a **Dual-Franchise Model**. This model distinguishes between *governance* (policy and representation) and *fiscal allocation* (fee spending).

  We recommend the following amendments to the Constitution:

  **1. Eligibility for General Elections (Governance)**
  *   **Who:** All actively enrolled students (On-Campus and Online).
  *   **What:** Elections for Senate Officers (President, VP, etc.) and At-Large Senators.
  *   **Rationale:** Since the Senate sets academic policy and advocates on tuition for the entire university, all students must have a voice in selecting the leadership that wields this authority. This resolves the "legislation without representation" deficit.

  **2. Eligibility for Office (Holding Seat)**
  *   **Who:** All actively enrolled students (On-Campus and Online).
  *   **What:** Eligibility to run for any Senate seat.
  *   **Rationale:** Excluding online students from holding office creates a second-class citizenship status incompatible with the University's non-discrimination policies. Online representatives are necessary to ensure the Senate understands the needs of the digital campus.

  **3. Eligibility for Activity Fee Referenda (Fiscal)**
  *   **Who:** Only students billed for the Mandatory Activity Fee (On-Campus).
  *   **What:** Any binding referendum specifically proposing an increase to the Activity Fee or the reallocation of Fee-funded surplus.
  *   **Rationale:** This preserves the principle of fiscal consent. While online students may vote for the *people* managing the budget, they should not directly vote to raise or spend a tax they do not pay.

  **4. Budget Committee Composition**
  *   **Who:** The Senate Budget Committee shall consist of five members.
  *   **Requirement:** At least three members must be fee-paying (on-campus) students.
  *   **Rationale:** This ensures that the detailed drafting of the budget remains primarily in the hands of those financially contributing to it, even if the final budget vote is taken by the full Senate (elected by all students).

  ### V. Implementation and Fiscal Safeguards
  To address the concern that online-elected Senators might vote to spend fee revenue imprudently, the Committee recommends adding a **Fiscal Protection Clause**:
  *   *The Senate may not allocate Mandatory Activity Fee revenue to services or infrastructure that are exclusively accessible to on-campus students if such allocation is objected to by a majority of the Fee-Paying Representatives.*

  This ensures that the fee revenue continues to serve the fee-paying population, even as the Senate's policy voice expands to include online learners.

  ### VI. Conclusion
  The current bylaws create a legitimacy crisis for the Senate. We cannot claim to advocate for "all students" on tuition while ignoring 4,000 students in our elections. However, we must also respect the financial contribution of on-campus students. The Dual-Franchise Model balances the right to political representation with the responsibility of fiscal consent.

  The Committee moves that the Full Senate adopt these amendments for ratification.

  **Approved by the Committee on Elections and Bylaws:**
  [Your Name/Signature]
  Committee Chair
