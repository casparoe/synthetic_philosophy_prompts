      4.  Implication for DAGs.

  6.  **Refining the "Extra Machinery" argument:**
      Lewis's machinery is the **Similarity Ordering of Possible Worlds**. He has to argue that a world where a small miracle happens *after* the cause is closer than a world where the past changes. This is complex and debated.
      Woodward's machinery is the **Structural Equation**. Asymmetry is built into the direction of the function.
      This is a very clear "extra machinery" win for Woodward.

