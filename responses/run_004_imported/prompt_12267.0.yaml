answer: |-
  Your intuition is correct: your friend is wrong. There is no advantage to swapping, and the logic that suggests otherwise is a famous logical fallacy known as the **Two Envelopes Paradox**.

  Here is precisely where the calculation fails and why the reasoning is flawed.

  ### 1. The Core Flaw: The "50/50" Assumption
  The fundamental error in your friend's argument is the assumption that, upon seeing $60, it is **equally likely** to be the smaller amount or the larger amount.

  For this to be true, the probability of the host choosing the pair ($30, $60) must be exactly the same as the probability of the host choosing the pair ($60, $120). Your friend's logic implies this must be true for *any* amount of money. If you found $1,000,000, he would argue it is just as likely to be the smaller half of a $2,000,000 pair as it is to be the larger half of a $500,000 pair.

  This is mathematically impossible. To maintain a 50/50 split for every possible number, the probability distribution of the money would have to be "flat" (uniform) from zero to infinity. Since the sum of probabilities must equal 1, you cannot assign a non-zero equal probability to an infinite number of possibilities. In reality, there is a limit to the money available, or the probability of higher amounts must decrease.

  ### 2. The Algebraic Error: Shifting Variables
  Your friend's calculation ($0.5 \times 120 + 0.5 \times 30 = 75$) relies on a subtle trick with algebra. He treats the variable $A$ (the amount in your hand) as a fixed number in both scenarios, but it represents two different physical quantities.

  Let $x$ be the smaller amount in the pair. The two envelopes contain $x$ and $2x$.
  *   **Scenario A:** You picked the smaller envelope ($x$). The other contains $2x$.
  *   **Scenario B:** You picked the larger envelope ($2x$). The other contains $x$.

  Your friend calculates the expected value of the *other* envelope as:
  $$0.5(2A) + 0.5(A/2)$$

  In the first term ($2A$), he assumes $A$ is the smaller amount ($x$).
  In the second term ($A/2$), he assumes $A$ is the larger amount ($2x$).

  You cannot add these together because $A$ is not a constant; it changes value depending on which envelope you picked. If you correct the math using the fixed variable $x$:
  *   If you have $x$, you gain $x$ by swapping.
  *   If you have $2x$, you lose $x$ by swapping.
  *   **Expected Gain:** $0.5(x) + 0.5(-x) = 0$.

  ### 3. Why the Specific Number ($60) Matters
  You correctly noted that the reasoning implies you should swap for *any* amount. However, the specific number *should* matter if you have any knowledge of the game's limits.

  *   **If the game has a maximum limit** (e.g., $100), finding $60 proves you have the larger envelope (since $120 is impossible). You should never swap.
  *   **If the game has a minimum limit** (e.g., $50), finding $60 proves you have the smaller envelope (since $30 is impossible). You should always swap.

  Without knowing these limits, you cannot calculate the probability. By assuming a 50/50 chance regardless of the number, your friend is assuming a game with infinite money and no limits.

  **Verdict:** Keep the $60. The expected value of swapping is exactly zero.
