prompt: |-
  I'm on the small committee at my company that decides our quarterly 'Integrity Award' (small cash bonus, people really care about it). This quarter's nominee found a nasty security hole and reported it before any user data leaked, which probably saved us from a real disaster. Except the postmortem revealed she'd actually found the bug weeks earlier and sat on it, only reporting once she realized an upcoming security audit would catch it anyway and make her look bad for staying quiet. Honestly, its not even clear from her Slack messages whether she cared that users could've been hurt or was purely covering herself, and if she hadn't feared the audit, she probably never would've said anything at all.

  Half the committee wants to give her the award anyway since the outcome was great and nobody's motives are ever fully pure. The other half thinks handing an 'Integrity Award' to someone acting out of self-preservation kind of defeats the point of having one. Can you draft the memo I need to send the committee before we announce winners next week - a real recommendation (give it to her, don't, or something else entirely, idk), reasoning the losing side can't just wave away, and please skip the 'Kant says motives matter' 101 take and get into why this is genuinely contested among philosophers.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** The user is on a committee deciding a quarterly "Integrity Award" (cash bonus, high stakes for employees).
      *   **Situation:** A nominee found a critical security bug, sat on it for weeks, and only reported it when an audit was imminent (fearing being caught). The outcome was positive (no leak), but the motive is suspect (self-preservation vs. user safety).
      *   **Conflict:** Committee is split 50/50. One side says "outcome matters, motives are always mixed." The other says "Integrity Award requires integrity, not just luck/self-interest."
      *   **Task:** Draft a memo to the committee with a specific recommendation, strong reasoning that addresses the counter-argument, and a nuanced philosophical angle (avoiding basic "Kant says motives matter" stuff, focusing on why this is genuinely contested).
      *   **Tone:** Professional, persuasive, nuanced, decisive but open to discussion.

  2.  **Determine the Recommendation:**
      *   *Option A: Give the award.* Risks diluting the meaning of "Integrity." Sends a message that timing doesn't matter as long as you don't get caught.
      *   *Option B: Deny the award.* Risks discouraging future reporting. "Better late than never" is a strong pragmatic argument.
      *   *Option C: Compromise/Alternative.* Acknowledge the technical skill/outcome but withhold the specific "Integrity" label. This seems the strongest path. It validates the work without validating the ethics. It preserves the award's specific meaning while still rewarding the contribution.
      *   *Decision:* I will recommend **Option C**. It resolves the tension between rewarding the *result* and honoring the *virtue*.

  3.  **Develop the Philosophical Argument (The "Meat"):**
      *   *Constraint:* Skip "Kant 101" (i.e., don't just say "duty vs. consequences").
      *   *Goal:* Show why this is a hard problem in ethics, not just a simple rule.
      *   *Concept 1: Moral Luck.* (Thomas Nagel/Bernard Williams). The nominee got "lucky" that nothing happened. If a leak *had* happened, she'd be fired. If the audit *hadn't* happened, she might never have reported. Is she praiseworthy just because the audit loomed?
      *   *Concept 2: Virtue Ethics vs. Consequentialism.* Consequentialism says "good outcome = good act." Virtue Ethics says "good character = good act." An Integrity Award is inherently Virtue-based. Giving it for a Consequentialist win creates a category error.
      *   *Concept 3: Signaling/Incentive Design.* Awards aren't just retrospective; they are prospective. What behavior does this incentivize? If we reward "reporting just before getting caught," we incentivize sitting on bugs until the last minute.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the difficulty of the decision. Validate both sides.
      *   **The Recommendation:** Be clear. Do not give the *Integrity* Award, but propose an alternative recognition (e.g., "Technical Excellence" or "Security Impact").
      *   **The Reasoning (Philosophical/Practical):**
          *   Distinguish between *Outcome* and *Character*.
          *   Bring in the "Moral Luck" angle (she didn't control the audit timing).
          *   Address the "Incentive" angle (what behavior do we want to normalize?).
          *   Address the "Mixed Motives" counter-argument (yes, motives are mixed, but *predominantly* self-protective vs. *predominantly* duty-bound matters for an *Integrity* award).
      *   **The Compromise:** Ensure she gets recognized (cash bonus, public shout-out) just under a different label. This prevents demoralization.
      *   **Closing:** Call to action (vote on this approach).

  5.  **Refining the Tone:**
      *   Needs to sound like a peer/leader, not a lecturer.
      *   Avoid academic jargon where possible, but use the concepts accurately.
      *   Make sure the "losing side" (those who want to give the award) feel heard but see the flaw in their logic regarding the *specific nature* of this award.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I avoid "Kant 101"? *Yes, focusing on Moral Luck and Virtue Ethics/Signaling instead.*
      *   *Check:* Is the recommendation clear? *Yes, deny Integrity Award, give Technical Award.*
      *   *Check:* Is the reasoning hard to wave away? *It focuses on the definition of the award itself and future incentives, which are hard business arguments.*
      *   *Check:* Is it empathetic to the nominee? *Yes, she still gets money and recognition, just not the specific badge of "Integrity."*

  7.  **Final Polish:** Ensure the distinction between "Integrity" and "Competence" is sharp. The core argument is that an Integrity Award is a *virtue signal*, not a *performance bonus*.

  **(Self-Correction Note):** I need to make sure I don't sound *too* harsh on the employee. She did the right thing eventually. The memo should reflect that nuance. The issue isn't that she's a bad person, it's that this specific award tracks a specific trait she didn't display *in this instance*.

  8.  **Finalizing the Text:** (Proceeds to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Integrity Award Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation regarding Q3 Integrity Award Nomination

  Team,

  We are at an impasse regarding this quarter's nominee. On one side, we have the undeniable fact that a critical vulnerability was patched before user data was compromised. On the other, we have the postmortem evidence suggesting the delay in reporting was driven by self-preservation regarding the upcoming audit, rather than an immediate commitment to user safety.

  Half of us believe the outcome justifies the award; the other half believe the motive disqualifies it. Both positions are defensible, but they rely on different definitions of what this award is actually for.

  After reviewing the details and the philosophical underpinnings of corporate ethics, **I recommend we do not grant the 'Integrity Award' to this nominee.** Instead, I propose we create a one-off "Security Impact Bonus" (matching the cash value) to recognize the technical catch and the positive outcome, while withholding the specific designation of "Integrity."

  Here is the reasoning, specifically addressing the argument that "outcomes matter more than motives."

  **1. The Category Error: Virtue vs. Consequence**
  The argument that "nobody's motives are pure, so we should reward the result" conflates two different ethical frameworks.
  *   **Consequentialism** judges an act by its outcome. By this metric, she succeeded.
  *   **Virtue Ethics** judges an act by what it reveals about the character of the agent.

  Most performance bonuses at this company are Consequentialist (did you hit the target?). The **Integrity Award** is explicitly Virtue-based. It is not a performance bonus; it is a character endorsement. If we award it based solely on the outcome, we strip the word "Integrity" of its meaning and turn it into a synonym for "Successful Risk Mitigation." We have other awards for that. If we give this award, we are effectively stating that integrity is irrelevant as long as you don't get caught in time.

  **2. The Problem of Moral Luck**
  This is the strongest philosophical counter to the "outcome" argument. The nominee was the beneficiary of what philosopher Thomas Nagel calls "Moral Luck."
  *   If the audit had been scheduled a month later, and a leak had occurred in the interim, she would be facing termination, not an award.
  *   If the audit had been canceled, she might never have reported the bug at all.

  Her praiseworthiness hinges entirely on external factors (the audit schedule) rather than her internal commitment to safety. Rewarding her for "getting lucky" that the audit coincided with her decision to speak up sets a dangerous precedent. It suggests that sitting on a known risk is acceptable strategy as long as you disclose it before the external checkmate.

  **3. Incentive Design and Signaling**
  Awards are not just retrospective; they are prospective. They signal what behavior we want to see repeated.
  *   **Scenario A (We give the Integrity Award):** We signal that the timing of disclosure is flexible. Employees may calculate that holding onto a bug gives them leverage or time to fix it quietly, only disclosing when necessary to save face.
  *   **Scenario B (We give the Impact Bonus, withhold Integrity):** We signal that finding bugs is highly valued and rewarded financially, but *immediate* transparency is the specific requirement for "Integrity."

  **4. Addressing the "Mixed Motives" Counter-Argument**
  The committee members arguing for the award rightly note that pure altruism is rare. Fear of repercussions often drives compliance. However, there is a distinction between *mixed motives* and *predominant motives*.
  *   **Mixed:** "I want to protect users, and I also don't want to get in trouble." (This is normal and award-worthy).
  *   **Predominant:** "I would not have protected the users if I didn't think I would get caught." (This is the evidence we have).

  The Slack logs suggest the latter. Acknowledging this doesn't require us to brand her a villain; it simply requires us to acknowledge that this specific instance does not meet the threshold for the specific virtue we are honoring.

  **The Path Forward**
  Denying the Integrity Award is not a punishment. It is a preservation of the award's definition.

  I propose we:
  1.  **Award the cash bonus** equivalent via a "Security Impact" recognition. This ensures she is financially rewarded for saving the company from disaster.
  2.  **Publicly recognize the technical win** without attaching the "Integrity" label to her name in the announcement.
  3.  **Clarify the criteria** for future quarters: "Integrity is defined by the timeliness of disclosure relative to the discovery of the issue, not solely the mitigation of damage."

  This approach allows us to be generous with the bonus while being rigorous with our values. It ensures the "losing" side gets their win (she gets the money and recognition for the save) without compromising the specific meaning of the Integrity Award.

  Please review this proposal before our meeting on Tuesday. I believe this allows us to split the difference without splitting the meaning of the award.

  Best,

  [Your Name]
