answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name], Ray's nephew.

  For those of you who *do* know Ray, you know that standing here is a bit of a test. I've been told that if I misuse a specific term tonight, I might get corrected from the audience. And knowing this room, it wouldn't be a gentle correction. It would be a stoppage of work. A write-up. Maybe a wildcat strike right here at the buffet table.

  So, let's get the record straight before we order the chicken.

  We are here to celebrate 38 years. Thirty-eight years on the floor. That is a lifetime. And during that time, Ray earned the nickname "The Professor." Now, usually, "Professor" implies a degree, a tenure track, maybe a tweed jacket with elbow patches. Ray's credentials were a pair of steel-toes, a lunchbox, and a dog-eared paperback of *Capital* he bought at a garage sale in 1985.

  He read those books while other guys read racing forms. And he learned things. Specifically, he learned the difference between two words that most people use interchangeably, but which Ray treats like oil and water.

  I learned this the hard way. A few years ago, I was visiting him after a long shift. He looked beat. I said, "Uncle Ray, you look exhausted. The **alienation** really gets to you, huh?"

  He put his fork down. He looked at me over his glasses. He said, "No. The *exploitation* is the math. They pay me for four hours, I work for eight. That's the theft. That's exploitation. The *alienation* is that I tighten the same bolt until I forget what it feels like to use my hands for anything else. Don't mix up the theft with the scar, kid."

  So, tonight, for Ray: I have my definitions ready.

  **Exploitation** is the cold, hard math. It's the reality that for 38 years, this plant made cars that drove off the lot and turned a profit for people who never smelled the welding smoke. It's the understanding that the value Ray created with his hands exceeded the paycheck he took home. The union guys in the back know this math better than anyone. It's the reason we have pensions. It's the reason we have weekends. Ray never let the company forget that equation. He knew the value of his labor, even if the payroll department tried to obscure it.

  But if exploitation is the math, **alienation** is the sadness.

  Alienation is building a machine you can't afford to drive. It's spending your life making something you don't own, in a rhythm you don't control, until you worry that you're becoming a part of the machine yourself. It's the worry that after 30 years, you might not recognize the person staring back at you in the mirror because he looks so much like the assembly line.

  And here is the miracle of Ray. He understood the math, and he felt the sadness, but he refused to let them win.

  He fought the exploitation by standing shoulder-to-shoulder with the union. He made sure the math came out a little fairer for all of us.

  And he fought the alienation by refusing to be just a pair of hands. He forced the line to be a community. He turned the breakroom into a classroom. He made sure that when he went home, he wasn't just a worker bee; he was a father, an uncle, and a grandfather who taught us that reading matters, that thinking matters, and that your time belongs to *you*.

  To the grandkids in the room: I know this sounds heavy. But what it means is simple. Grandpa Ray spent 38 years giving his time to a company. He gave them his strength, his hours, his focus. And now, starting tomorrow, he's taking it back.

  Retirement, in Ray's terms, is the ultimate reclamation. It is the end of exploitation, because no one is buying his labor anymore. And it is the cure for alienation, because everything he makes now—whether it's a garden, a story, or a spoiled grandchild—is entirely his own. He owns the product. He owns the process. He owns the time.

  Ray, you taught us that words have weight. You taught us that labor has value. But most importantly, you taught us that a man is more than his job.

  You spent 38 years building cars for other people to drive. Now, it's time to drive wherever the hell you want.

  To "The Professor." To the Union. And to Ray.

  Cheers.
