      *   *Interventionist Angle:* "If I *stop* the first one, does the second stop?" That's the intervention. Hume just watched them fall.

  7.  **Review against User Constraints:**
      *   *Sharp, not just quotable:* Avoid clichés. Use the specific philosophical distinction the user found.
      *   *Address the Gap:* Explicitly mention that Hume slides from "is" to "ought to be" (or "would be").
      *   *Address Lewis/Woodward:* Weave this into the professor's knowledge base without name-dropping too heavily (unless it fits the character). Let's have him reference the "moderns" or "computer scientists."

  8.  **Final Polish:**
