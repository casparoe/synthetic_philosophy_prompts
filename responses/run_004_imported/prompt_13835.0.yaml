  **MEMORANDUM**

  **TO:** Regional Antivenom Allocation Subcommittee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Standing Policy on Indivisible Lot Allocation

  **Recommendation**
  I recommend the subcommittee adopt a **Fixed Rule of Maximized Expected Survival** as our standing policy. When a single antivenom lot cannot be divided, it must be allocated to the patient group that yields the highest number of expected survivors, calculated by multiplying the number of patients by their probability of survival with treatment.

  In the recurring scenario where one lot can treat either one severe patient or four-to-five moderate patients, the policy dictates allocation to the larger group of moderate patients, provided their aggregate survival probability exceeds that of the single severe patient.

  **Operational Application**
  Upon the next occurrence of conflicting indications for a single lot:
  1.  **Triage Assessment:** The attending toxicologist will assign a survival probability (0.0–1.0) to the severe patient and the aggregate group of moderate patients, assuming treatment is received.
  2.  **Calculation:** 
      *   *Option A (Severe):* 1 patient × [Probability of Survival].
      *   *Option B (Moderate):* [Number of Patients] × [Probability of Survival].
  3.  **Allocation:** The lot is released to the option with the higher resulting value.
  4.  **Documentation:** The decision is logged as "Protocol-Driven Scarcity Allocation" to shield individual clinicians from moral liability.

  **Ethical Justification and Dissenting View**
  This recommendation is not made lightly, nor does it dismiss the compelling ethical argument for a weighted lottery. The faction advocating for a lottery rests on a profound moral truth: **the separateness of persons.**

  As philosopher John Taurek argued, "the loss of five lives" is not a single tragedy experienced by a group mind; it is five separate tragedies, each experienced individually. To the single severe patient, their impending death is a total loss, just as it is for each of the five moderate patients. From the perspective of the individual, their claim to life is not mathematically diminished by the fact that others are also in need. A lottery respects this equality of claim; it acknowledges that no single patient is inherently more valuable than another, and it refuses to sacrifice the one simply because they are outnumbered. To dismiss this as a "seminar-room curiosity" is to ignore the visceral injustice felt when an individual is told they must die because others exist.

  However, while the Taurekian view correctly identifies the *value* of the individual, it fails to account for the *stewardship* of the institution. We are not private citizens making personal sacrifices; we are custodians of a public resource. 

  If we adopt a lottery, we are not remaining neutral. A coin toss that saves one person but allows five to die is not a "fair" outcome; it is an active choice to accept a higher probability of greater loss. Because we value every life equally, we are obligated to minimize the total number of lives lost. To do otherwise would be to treat the five moderate patients as less worthy of protection than the one severe patient. 

  **Conclusion**
  We adopt the Fixed Rule not because the single patient matters less, but because our mandate requires us to save as many of them as possible. We must acknowledge that this policy leaves a "moral residue": the single patient is not wrong to feel that their equal worth was not fully honored by the math. We honor that worth by ensuring this policy is used only when scarcity is absolute, and by continuing to advocate for increased supply so that no such choice is ever required again.
