answer: |-
  Your friend is substantially correct, though the nuance of *how* Augustine achieves this reconciliation is often where the confusion lies. Augustine is indeed an exceptionless absolutist regarding lying: for him, a lie is intrinsically evil (*malum in se*), regardless of consequences. However, he is not so rigid that he cannot account for the complexity of moral agents.

  To resolve the tension you encountered, Augustine employs a three-part strategy in *De Mendacio* (On Lying, c. 395) and the later, stricter *Contra Mendacium* (Against Lying, c. 420):

  1.  **A precise definition of lying** that isolates the sin to the violation of the sign-order (speaking against one's mind), independent of outcomes.
  2.  **A distinction between the merit of the agent and the quality of the act**, allowing God to reward the benevolence while condemning the mendacity.
  3.  **A distinction between lying and concealment**, which offers a permissible alternative (though he admits the biblical figures did not take it).

  Here is precisely how Augustine handles the apparent tension.

  ### 1. The Location of the Sin: *Voluntas Fallendi*
  Your friend is right that for Augustine, the wrongness of lying is not consequentialist. It is located in the violation of the natural order of signs. In *De Mendacio*, Augustine defines a lie as a false signification made with the **will to deceive** (*voluntas fallendi*).

  > "He is a liar who has one thing in his mind and utters another in words." (*De Mendacio* 3.4)

  The sin is the disjunction between the *intellectus* (understanding) and the *enuntiatio* (utterance). Because language is given by God to communicate thoughts, using it to obscure thoughts is a misuse of a divine gift. Therefore, even if the consequence is saving a life, the *act itself* remains a disorder. It is a sin against the truth, which is a sin against God.

  This means Augustine cannot say, "The lie was good because it saved a life." He must maintain, "The lie was a sin, but the agent was acting out of charity."

  ### 2. The Scriptural Cases: Rewarding Mercy, Not Mendacity
  This is the crux of your debate. How does Augustine handle the Hebrew midwives (Exodus 1) and Rahab (Joshua 2)? He does not deny they lied. In *De Mendacio* (15.26) and *Contra Mendacium* (15.32), he explicitly grants that they spoke falsehoods with the intent to deceive.

  His solution is to sever the link between the *reward* and the *lie*.

  **The Argument:**
  Augustine argues that God rewarded their **benevolence** (*benevolentia*) and **mercy** (*misericordia*), not their **deceit** (*mendacium*). The good will and the sinful act co-existed in the same action, but they are morally distinct.

  In *Contra Mendacium*, he writes:
  > "It was not their lie that was rewarded, but their kindness... For there was in that deed something to be imitated, namely their mercy; and something to be avoided, namely their lying." (*Contra Mendacium* 15.32)

  Augustine uses an analogy of a judge or a father: A father might love a son who has done wrong because of the son's underlying good nature, without approving of the specific wrong act. Similarly, God looked upon the midwives' fear of Him and their desire to preserve life (which was good) and rewarded *that*, while passing over or forgiving the sin of the lie due to the exigency of the situation and their limited understanding.

  **Does this compromise the absolutism?**
  Augustine would say no. The lie remains a sin. It is just that the sin was venial (less grave) compared to the charity displayed. In his taxonomy of eight types of lies (*De Mendacio* 14.25), lies told to protect life or bodily purity are among the least grievous (Category 7 or 8), whereas lies that harm religion are the worst (Category 1).

  So, the midwives and Rahab committed a venial sin. They were not condemned for it because their charity covered a multitude of sins (citing 1 Peter 4:8), but Augustine insists **Christians are not permitted to imitate them.** He treats them as figures of the Old Covenant where such accommodations were more common, or as individuals whose faith was so strong it carried their minor moral failures. In *Contra Mendacium*, written against the Priscillianists who used Rahab to justify lying for orthodoxy's sake, Augustine is adamant: "We must not lie even for the sake of saving another from death."

  ### 3. Concealment vs. Lying (*Dissimulatio* vs. *Mendacium*)
  You asked if the distinction between lying and withholding truth does real work. For Augustine, it does, though it does not exonerate Rahab or the midwives (since they explicitly asserted falsehoods).

  Augustine distinguishes between:
  1.  **Lying (*Mendacium*):** Asserting as true what one believes to be false.
  2.  **Concealment (*Dissimulatio* / *Reticentia*):** Withholding the truth without asserting a falsehood.

  Augustine argues that one is never obligated to reveal the truth to those who have no right to it. If asked a question where the truth would cause harm, one may remain silent or speak obscurely. He cites Christ: "I have yet many things to say unto you, but ye cannot bear them now" (John 16:12), and "My doctrine is not mine" (John 7:16), as examples of concealing truth without lying.

  **Application to the Cases:**
  Augustine admits that in the cases of Pharaoh and the King of Jericho, silence might have been impossible or interpreted as guilt. However, he suggests that ideally, one should suffer persecution rather than lie.
  *   **The Ideal:** Refuse to answer, or say "I know, but I will not tell you," accepting the consequences.
  *   **The Reality:** The midwives and Rahab failed to reach this ideal. They chose the lesser sin (lying) over the greater harm (murder/treason).

  This distinction is crucial for Augustine's ethics because it preserves the absolute prohibition on *asserting falsehood* while allowing for prudential silence. It means the Christian *can* protect refugees without lying, provided they are willing to endure the risk of being caught. If they lie to avoid the risk, they have sinned.

  ### 4. Reconciling Intention and Sin
  You noted a specific tension: *If the sin is in the deceptive intention, how can the person be rewarded for a good intention if both are present?*

  Augustine resolves this through a **plurality of wills**. He does not view the agent as having a single, monolithic intention. In the case of Rahab, she had:
  1.  A will to deceive (sinful).
  2.  A will to protect the servants of God (meritorious).

  These two wills operated simultaneously. The reward corresponds to the second will; the blame corresponds to the first. Augustine relies on the notion that God judges the *heart's orientation* toward Him ultimately. If the orientation is toward charity (protecting God's people), the venial sin of the lie does not sever the relationship with God, even if it stains the action.

  In *De Mendacio*, he suggests that perhaps their reward was **temporal** (earthly prosperity, inclusion in the lineage of Christ for Rahab) rather than **eternal**, implying the lie did bar them from a higher spiritual merit, though later he seems to allow that their faith justified them despite the lie.

  ### Summary for Your Debate
  To reconstruct your friend's position with the necessary precision:

  1.  **Absolutism Holds:** Augustine maintains lying is *always* a sin because it violates the order of signs established by God. Consequences do not justify the act.
  2.  **Scriptural Reconciliation:** God rewarded the midwives and Rahab for their **mercy and faith**, not their lying. The lie remained a sin, but a venial one overshadowed by charity. We are not to imitate the lie, only the mercy.
  3.  **The Role of Silence:** Augustine allows for concealing the truth (*dissimulatio*) as a morally valid alternative. The biblical figures sinned because they asserted falsehoods rather than merely remaining silent or refusing to answer, though their sin was mitigated by the danger.
  4.  **The Intention:** The "deceptive intention" makes the *act* a lie; the "benevolent intention" makes the *agent* meritorious. Augustine separates the moral quality of the act from the salvific status of the agent.

  Your intuition that this feels like "talking past each other" is common; Augustine's position is notoriously difficult because it requires holding two contradictory evaluations of the same action (sinful act, meritorious agent) in tension without letting the merit justify the act. But strictly speaking, your friend is right: for Augustine, there is no "justified lie." There are only lies that are forgiven or overlooked due to the greater virtue accompanying them.
