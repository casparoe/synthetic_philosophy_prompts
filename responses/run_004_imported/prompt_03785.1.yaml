answer: |-
  **Setting:** *The edge of a murky cypress swamp in Florida. The air still smells of ozone and burnt peat. Two philosophers, RUTH (teleosemanticist) and DAN (causal/informational theorist), stand knee-deep in mud, watching the back of a man in a damp suit walking briskly toward the highway. This is Swampman.*

  **Ruth:** Well. There he goes. Off to tenure review, I suppose.

  **Dan:** He's got a lot of catching up to do. Though, physically, he's exactly where he left off.

  **Ruth:** Physically, yes. But Dan, look at him. Really look at him. That thing walking toward the Cadillac? It has no history. Not ontogenetic, not phylogenetic. It's a statistical miracle wrapped in skin. By the time he opens his mouth to order a latte, he hasn't *said* anything.

  **Dan:** Oh, come on, Ruth. He just asked us if we were okay. He used English syntax. He referenced the lightning strike. If I punch him in the nose, he'll yell "Ouch" and get angry. Are you telling me he doesn't *believe* he got hit?

  **Ruth:** I'm telling me he doesn't have beliefs. He has belief-*states*, sure. Neural configurations that are isomorphic to yours and mine. But content isn't just shape. Content is function. Think about your vervet monkeys.

  **Dan:** Here we go.

  **Ruth:** No, listen. You spent thirty years recording those alarms. When a vervet screams "Leopard!" what makes that scream *about* a leopard? Is it just that a leopard was present?

  **Dan:** Well, it's caused by the leopard.

  **Ruth:** Wrong. If a leopard print balloon floats by and the monkey screams, it's a false alarm. If a monkey screams just to scare a rival away from a mate, it's a lie. The meaning isn't in the cause. It's in the *job*. That call was selected for because it got kin to climb trees. It has a *proper function*. It's supposed to map to leopards. Swampman's vocal cords weren't selected for anything. They were assembled by a lightning bolt. So when he says "tree," there is no standard for whether he got it right or wrong. He's just making noise that happens to correlate with trees.

  **Dan:** But that violates every intuition we have about what it is to be a mind. If Swampman writes a paper on quantum mechanics, and the math is wrong, we say he made a mistake. We don't say, "Ah, since you lack an evolutionary pedigree, your symbols have no truth conditions." If he navigates around a puddle, he represents the puddle as an obstacle. If he walks into it, he misrepresented it.

  **Ruth:** Did he? Or did his legs just move? Look, the whole point of teleosemantics is to naturalize normativity. To have a false belief, you have to be *failing* at something. A heart that doesn't pump is a bad heart. A belief that doesn't match the world is a bad belief. But Swampman's brain hasn't been tasked with matching the world. It just popped into existence. It's like a watch found in the desert. It tells time, sure. But if it stops, is it *broken*? Or is it just a collection of gears that stopped moving?

  **Dan:** That's the "No History" objection, and it's powerful, I grant you. But it comes at too high a cost. You're making content dependent on a genealogy that the subject doesn't even have access to. Imagine a twin earth case where a duplicate is created by a replicator machine. You'd say the machine-made twin is a zombie?

  **Ruth:** I'd say it's a creature without intentional states. It simulates them perfectly.

  **Dan:** Okay, let's press the other side of the vise, then. You want history. You want selection. But how does that solve the determinacy problem? The classic frog case. A frog's visual system fires for "fly." But it also fires for "BB pellet" moving at the same speed. Why is the content *Fly* and not *Fly-or-BB*? Evolution selected for the mechanism that catches food. BBs are accidental.

  **Ruth:** Exactly. Because the mechanism was selected *for* catching flies. The BBs are noise. The history filters the disjunction.

  **Dan:** Does it? Evolution selected for the mechanism that fires at *small, dark, moving specks*. That's the actual causal correlate that ensured survival. Why isn't *that* the content? You say "Fly" because you know flies are what frogs eat. But the frog's history only knows about successful snaps. If a BB had been nutritious, the frog would have eaten it. The history doesn't carve the world at the joints of *objects*; it carves them at the joints of *causal triggers*. You're smuggling in your own biological knowledge to fix the content, not the selection history itself.

  **Ruth:** That's the "Indeterminacy of Selection" objection. It's serious. But it's not fatal. We look at the *consumer* side, not just the producer. The frog's tongue mechanism is designed to digest flies, not tungsten balls. The downstream systems treat the signal as "nutrient." The function is fixed by the whole system's history of survival.

  **Dan:** But Swampman has a consumer system too! His stomach digests the latte. His motor cortex processes the "puddle" signal to move his leg. If you allow functional role *now* to determine content, why do you need the history? Why can't I say Swampman's internal state *means* puddle because it plays the puddle-role in his cognitive economy?

  **Ruth:** Because roles without history are just syntax. You can have a computer program that simulates digestion. It processes "food" variables. But it's not actually hungry. You need the *goal* to be real, not just simulated. Goals come from selection. Without the past struggle for existence, there are no goals, just events.

  **Dan:** So we're at an impasse. My view grants Swampman thoughts but struggles to explain why his thought is about a *fly* and not a *fly-speck*. Your view explains the fly-speck distinction beautifully but forces you to say Swampman is a mindless automaton.

  **Ruth:** Basically. Though I'd add: your view struggles with error. If content is just causal covariation, when is a representation false? If my "horse" concept is caused by horses, but also by cows on dark nights... do I have a "horse" concept or a "horse-or-cow-on-a-dark-night" concept? If it's the latter, I'm never wrong about cows. I just have a very specific concept.

  **Dan:** The Disjunction Problem. I know it. I've spent twenty years trying to patch it. Asymmetry, ideal conditions, informational locking...

  **Ruth:** And every patch seems to rely on a notion of "how things are supposed to work." Which smells an awful lot like teleology.

  **Dan:** Maybe. But look at him. *(They watch Swampman reach the highway and thumb a ride.)* He's going to fall in love. He's going to get depressed. He's going to write papers that get cited. If you tell his wife he doesn't *believe* he loves her, you're not doing philosophy anymore, you're being pedantic.

  **Ruth:** I know. It keeps me up at night. It feels cruel. But if I give up history, I lose the ability to explain misrepresentation naturalistically. I lose the "normativity" that makes mind different from mirror. If Swampman has beliefs, then a thermostat has beliefs, provided the wiring is complex enough.

  **Dan:** Maybe that's the bullet I have to bite. Or maybe... maybe we're asking the wrong question. Maybe "content" isn't one thing. Maybe there's "Swamp-content"—immediate, causal, structural—and "Real-content"—historical, normative.

  **Ruth:** Two kinds of meaning? Like "water" and "H2O"?

  **Dan:** No. Like "map" and "territory." Swampman has a map. It works. It guides him. You're insisting that for it to be a *real* map, it must have been drawn by a cartographer. I'm saying if it gets you to the destination, it's a map.

  **Ruth:** But if the map was drawn by a monkey throwing ink, and it just *happens* to match the terrain... is it a map? Or is it a lucky stain?

  **Dan:** *(Kicks at a clump of swamp grass.)* If I'm lost in the swamp, and I find that stain, and it leads me out... I don't care about the monkey.

  **Ruth:** But if you want to understand *why* it led you out, you need to know if it was designed for that. If it was designed, you can trust the next page. If it was luck, you're on your own. Swampman is the first page. We don't know if there's a second.

  **Dan:** He seems pretty consistent.

  **Ruth:** For now. But without a selection history to stabilize the functions, what happens when the environment shifts? If his internal states aren't *anchored* by past success, are they just drifting?

  **Dan:** And if yours are anchored by history, but the world changes faster than evolution... aren't you just carrying around a map of the Pleistocene?

  **Ruth:** *(Smiles faintly.)* Touché. We're both stuck with ghosts. Yours is the ghost of the present cause; mine is the ghost of past selection.

  **Dan:** So what do we tell the grad students?

  **Ruth:** Tell them to watch Swampman. If he survives the winter, maybe he develops a history. Then he gets beliefs.

  **Dan:** And if he writes a groundbreaking paper tomorrow?

  **Ruth:** Then we have a very complicated problem. Because either my theory is wrong, or he's the most convincing zombie in the universe.

  **Dan:** *(Watches the taillights disappear.)* You know, he waved at us.

  **Ruth:** I saw.

  **Dan:** It felt like a goodbye.

  **Ruth:** *(Sighs, wiping mud from her boot.)* It felt like one. But feelings aren't facts, Dan. That's the whole point.

  **Dan:** Or maybe facts aren't everything. Come on. Let's get a drink. I need to represent a beer causally, historically, and functionally.

  **Ruth:** Just don't ask the bartender if he has a selection history.

  *(They turn and walk back toward the car, leaving the swamp silent behind them.)*
