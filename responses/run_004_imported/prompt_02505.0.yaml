answer: |-
  **Setting:** *A kitchen, 1:15 AM. The hum of the refrigerator is the only sound. Two empty mugs sit on the counter. ELIAS is leaning against the counter, looking tired. NORA is sitting on a stool, scrolling idly on her own phone, though the screen is dim.*

  **Elias:** You're doing it again.

  **Nora:** *(Without looking up)* Doing what?

  **Elias:** The thing we're talking about. You said you'd be in bed by midnight.

  **Nora:** *(Locks phone, sets it down)* And here I am. Fifteen minutes past the witching hour. Is this an intervention?

  **Elias:** No, it's evidence. You told me about that paper you read. Hyperbolic discounting. The idea that there's no such thing as weakness of will, just… time-inconsistent preferences.

  **Nora:** It's a compelling model, Eli. Morning-Nora wants sleep. 1:00 AM Nora wants dopamine. Neither is irrational. They just have different discount rates based on proximity to the reward.

  **Elias:** But that's the dodge. It dissolves the *conflict*. When you were scrolling just now, did you genuinely think, "Sleep is overrated, this is the best use of my time"? Or did you think, "I really should stop, but I can't"?

  **Nora:** Does it matter what I *thought*? It matters what I *valued* in that moment. In the moment, the utility of the scroll outweighed the utility of the sleep. That's not irrationality; that's just a shift in valuation.

  **Elias:** It matters because that's the definition of *akrasia*. Acting against your better judgment. If you truly believed scrolling was better *all things considered*, you wouldn't feel guilty. You wouldn't feel that tug. The fact that you feel the tug proves that "Sleep is better" was still your active judgment, even while your hands kept scrolling.

  **Nora:** Okay, but why does Morning-Nora's judgment get to be the "true" one? Why is her preference the objective standard of rationality?

  **Elias:** Because she has the full picture! She's not under the influence of immediate gratification. She's weighing the whole day tomorrow against twenty minutes of memes.

  **Nora:** That's just temporal snobbery. You're privileging the self that is distant from the reward. Imagine if I told you that Hunger-Nora is irrational because Well-Fed-Nora prefers not to spend money on pizza. You'd say, "No, Hunger-Nora has a different physiological state." Well, 1:00 AM Nora is tired. Her cognitive resources are depleted. Her discount rate *should* be higher. It's rational for an exhausted organism to seek immediate comfort.

  **Elias:** So exhaustion justifies overriding long-term plans?

  **Nora:** It explains them. You're calling it "weakness" because you want there to be a single, unified "You" that is supposed to be in charge. But maybe "You" are just a sequence of temporal slices passing the baton. When the baton gets to 1:00 AM, that runner has different legs. Calling it "weakness" is just Morning-You complaining that Night-You didn't respect Morning-You's itinerary.

  **Elias:** But if that's true, if we're just a sequence of strangers, then planning is impossible. Why bother setting an alarm? Why bother saving money? If 1:00 AM Nora is a different agent with different rights, then Morning-Nora has no standing to be mad.

  **Nora:** She has standing to be *inconvenienced*. Not morally outraged. Look, think about it this way: If you genuinely believed eating cake was bad for you, but you ate it because you valued the taste more than the health in that specific second, did you act irrationally? Or did you just reveal that you value taste more?

  **Elias:** I acted against my *own* standard. That's the point. I didn't change my mind about health. I acknowledged the cake was bad *while I ate it*. That's the phenomenological reality of willpower. It feels like a struggle between a rational command and an irrational impulse. Your model says there's no impulse, just a different command. That doesn't match the experience.

  **Nora:** The experience is a narrative we tell afterwards. The "struggle" you feel? That's just two competing preference signals firing at once. One says "Sleep," one says "Scroll." The fact that the "Sleep" signal has a label like "Should" attached to it doesn't make it more real. It just means it's associated with long-term consequences. When the "Scroll" signal wins, you call it weakness. If the "Scroll" signal had won because you found out your house was on fire, you'd call it survival. It's all just weightings.

  **Elias:** No, because if the house was on fire, my judgment would update. I'd think, "Okay, scrolling is now irrelevant." With the phone, my judgment *doesn't* update. I still think scrolling is bad. I'm holding two contradictory beliefs: "This is bad" and "I am doing this." Your model says I only hold one: "This is good right now." But I don't believe it's good! I believe it's bad *and* I do it. That gap is the only place where "will" even exists.

  **Nora:** *(Pauses, tapping a fingernail on the mug)* Okay. I'll grant you the feeling of contradiction. But does that prove a failure of rationality? Or does it prove that rationality is local?

  **Elias:** Rationality has to be global. If I plan a route on a map and then deliberately drive off a cliff because the view is nice, I'm not "locally rational." I'm crashing the car.

  **Nora:** But what if the "view" is relief from anxiety? You're assuming the goal is always maximizing long-term welfare. What if the goal of the organism in that moment is regulating emotional state? If scrolling soothes the anxiety of the day, 1:00 AM Nora is being perfectly rational. She is solving the problem of "I feel stressed." Morning-Nora's problem is "I feel tired." They are different problems.

  **Elias:** So we're just addicts with a thesaurus? "Time-inconsistent preferences" is just a polite way of saying "I sabotage myself."

  **Nora:** It's a way of saying "I am complex." Calling it weakness implies there's a homunculus inside you who *could* have stopped but chose not to. That's magical thinking. There's no homunculus. There's just neurochemistry responding to stimuli. Hyperbolic discounting describes the curve of that response. "Weakness of will" is just the moral story you layer on top to make yourself feel like you have control.

  **Elias:** But if I don't have control, why does it feel like I do? Why does it feel like *effort* to put the phone down? If it's just a calculation of utility, I should just drop it when the utility shifts. But I have to *wrestle* with it. That wrestling is the will.

  **Nora:** The wrestling is the friction between the temporal selves. Morning-You built a fence. Night-You is climbing it. You call the fence "willpower." I call it "pre-commitment." And look, if the fence works, great. But don't pretend Night-You is irrational for trying to climb it. Night-You is just living in the now.

  **Elias:** If Night-You isn't irrational, then Morning-You is a tyrant. You're saying my future self has no more claim on my behavior than a stranger does.

  **Nora:** I'm saying your future self is a stranger. You don't know what they'll want. Maybe they'll wake up energized. Maybe they'll be sick. You're trying to dictate terms to a person you won't be.

  **Elias:** But it *is* me. That's the whole point of being a person. Continuity. If I accept your view, I can never trust myself. I can never make a promise. I'm just a series of puppets cutting each other's strings.

  **Nora:** And if you accept *your* view, you spend every night beating yourself up because you aren't a robot. You treat a natural discounting curve like a moral failing. Which one actually helps you sleep?

  **Elias:** *(Silence for a moment)* Neither, really.

  **Nora:** Exactly.

  **Elias:** But… I still think you're wrong about the judgment. I know, while I'm scrolling, that I'm making a mistake. Not just a "preference shift." A mistake. Like a math error.

  **Nora:** And I think you're wrong that the "Morning Judgment" is the correct math. Maybe the equation changes at night.

  **Elias:** Then we're at a stalemate.

  **Nora:** *(Picks up phone)* Not necessarily. We can agree that Morning-Nora wants to win.

  **Elias:** And Night-Nora wants to not feel like a failure.

  **Nora:** So, how do we get Night-Nora to care about Morning-Nora without calling her weak?

  **Elias:** Maybe we admit that Night-Nora is tired, and tired people make bad calculations. Not immoral ones. Just… buggy.

  **Nora:** I can live with "buggy." It sounds less like a sin.

  **Elias:** *(Pushes off the counter)* Good. Because if you're buggy, you need a system, not a sermon.

  **Nora:** *(Stands up)* Agreed. Phone charger goes in the kitchen. Not the bedroom.

  **Elias:** That's a pre-commitment.

  **Nora:** That's Morning-Nora rigging the game so Night-Nora doesn't have to choose.

  **Elias:** Is that cheating?

  **Nora:** *(Smiles)* No. It's the only way the team wins.

  **Elias:** Alright. 1:20 AM. Let's go to bed.

  **Nora:** Lead the way. Before Night-Nora changes her mind.
