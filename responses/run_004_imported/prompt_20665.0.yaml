answer: |-
  You are not missing anything. You have put your finger on the exact fracture line where Tolstoy's aesthetic theory cracks under the weight of his religious zeal.

  To answer your specific question: **Yes, it is a second, separate scale bolted on after the fact.** But to understand why he calls it "bad art" rather than "art aimed at a bad end," you have to look at Tolstoy's teleology (his view on the *purpose* of things).

  Here is the breakdown of the contradiction, why it exists, and—more importantly for you—how your pianist narrator can weaponize it.

  ### 1. The Two Scales
  You correctly identified the mechanics in Chapter 15. Tolstoy sets up a hierarchy:

  *   **Scale A (The Formal Test):** Is it art? Does it infect? How well does it infect? (Metrics: Individuality, Clearness, Sincerity).
  *   **Scale B (The Moral Test):** What is the *content* of the feeling? Does it align with the "religious perception of the age" (for Tolstoy, universal Christian brotherhood)?

  The contradiction arises because Tolstoy wants Scale A to be objective (anyone can feel infection) but Scale B to be absolute (only *true* Christianity is good).

  ### 2. Why "Bad Art" and not "Immoral Art"?
  You asked: *Why call the losing side of that second test "bad art" rather than something like "art aimed at a bad end"?*

  For Tolstoy, art is not a container; it is a **function**. He defines art by what it *does* (unites people). If a knife cuts well but is used to murder an innocent person, we might call it a "good knife used badly." But Tolstoy argues that if the *feeling* transmitted divides people (e.g., feelings of lust, patriotism, or exclusivity), the art has failed its fundamental function of union.

  Therefore, in his view, it isn't just a tool used for a bad end; it is a **broken tool**. It is "bad art" because it is failing to be what Art *ought to be*.

  This is where the seam shows. He claims in the passage you quoted to judge art "apart from its subject-matter," but then immediately reintroduces subject-matter as the ultimate judge of value. It is a philosophical bait-and-switch.

  ### 3. The *War and Peace* Contradiction
  You noted he trashes his own work. This is crucial context. *What Is Art?* was written in 1897, near the end of his life, after his spiritual crisis. The Tolstoy who wrote *War and Peace* (1869) believed in the complexity of history and the validity of aristocratic life. The Tolstoy of 1897 believed those things were sinful delusions.

  When he calls *War and Peace* "bad art," he is arguing that while it may have been infectious to the upper classes, it was not **universally** infectious (a peasant couldn't understand it) and it transmitted feelings of glory and war that contradicted Christian pacifism.

  So, does he violate his own rules? **Yes.** He retroactively decides that his earlier work lacked "sincerity" because the "soul" he was transmitting from was, in his new view, a corrupted soul.

  ### 4. How to Use This for Your Pianist
  This tension is gold for a washed-up concert pianist. Here is why:

  **A. The Definition of "Sincerity"**
  Tolstoy lists "sincerity" as one of the three conditions of infectiousness. For a performer, sincerity is the holy grail. But your narrator can obsess over Tolstoy's ambiguity:
  *   *Can I be sincerely arrogant?* If I transmit my own narcissism clearly and individually, and the audience feels it (infection), Tolstoy's Scale A says I am a great artist.
  *   *But Scale B says I am a monster.*
  *   **The Conflict:** Your narrator can wonder if their "wash-up" status is because they lost their technique (Scale A failure) or because they lost their moral compass (Scale B failure).

  **B. The "Infection" as Physicality**
  Pianists know the physical sensation of "infecting" a room. It's visceral. Your narrator might respect Tolstoy's definition of infection (Chapter 15) because it matches their experience on stage, but resent the moralizing (Chapter 16+) because it feels like censorship.
  *   *Voice Idea:* "Tolstoy says infection is the only test. I infected three thousand people in Vienna. They wept. But Tolstoy would say I fed them poison. Who decides? The weeping or the poison?"

  **C. The Repudiation of Past Self**
  Just as Tolstoy repudiated *War and Peace*, your pianist might listen to their own old recordings and hear them as "bad art." Not because the notes are wrong, but because the *feeling* transmitted was vain, or desperate, or fake.
  *   This allows for a powerful scene where the narrator analyzes their own peak performance through Tolstoy's lens and realizes: *I was infectious, but I was transmitting loneliness. I united the audience in my own isolation. Is that art, or is that a crime?*

  ### 5. A Note on the "Seam"
  If you want your narrator to be intellectually sharp, have them spot the seam you found.

  Tolstoy tries to resolve the contradiction by claiming that **true** sincerity inevitably leads to **good** moral feelings. He argues that if you are truly sincere, you will naturally transmit feelings of brotherhood.

  Your pianist could find this laughable. A musician can be utterly sincere in their despair, their rage, or their decadence. The "seam" is the lie that technical honesty guarantees moral goodness.

  **Drafting Prompt for the Narrator:**
  > "Tolstoy wants to have it both ways. First he tells us art is a virus—if it spreads, it's art. Then he tells us some viruses are evil. But if the infection is the definition, how can the disease be distinct from the cure? I played Rachmaninoff. I made them feel the weight of the earth. Was that good art because they felt it? Or bad art because I made them sad? Tolstoy says the feeling matters. I say the feeling is the only thing that exists. The rest is just sermonizing by a man who gave up his piano for a plow."

  **Verdict:** You aren't missing a resolution. You've found the place where the artist Tolstoy strangled the philosopher Tolstoy. Let your narrator live in that strangulation.
