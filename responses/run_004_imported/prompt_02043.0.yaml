answer: |-
  The Permanent Court of Arbitration on State Continuity sat in a glass tower in The Hague, but its eyes were fixed on a coordinate in the South Pacific: 11° South, 175° West. The nation was Orovia. For eighty years, the sea had been eating it.

  Elias sat in the data wing, surrounded by the hum of servers and the smell of ozone. He was the Lead Surveyor for the Tribunal. On his screens, the bathymetric models of Orovia shifted in real-time. Blue deepened to black. The contour lines representing the high-tide mark retreated inward, year by year, decade by decade.

  Elias was an epistemicist, though he never used the word in the breakroom. He believed that for every vague predicate—"heap," "bald," "sovereign state"—there was a sharp boundary. There was a specific gram of sand whose removal turned a heap into a non-heap. There was a specific square meter of land whose submersion turned a nation into a memory. We might not know where the line was, but it was there, written into the fabric of reality. His job was to find it.

  Down the hall, in the Policy Wing, Mara was drafting the Framework for Post-Territorial Continuity. She was the Lead Jurist. Her whiteboards were covered in flowcharts, not of data, but of interpretations. *Reasonable Precisiﬁcation A*, *Reasonable Precisiﬁcation B*. She believed the boundary was not hidden; it was absent. The concept of "statehood" was a cloud, and the Tribunal's job was not to measure the cloud but to decide where to draw the box around it. There was no fact to find, only a decision to make.

  The crisis had arrived with the King Tide of 2042.

  Orovia's population had long since migrated to New Zealand and Fiji, retaining their citizenship through the "Digital Embassy." But one man, Tio, remained. He was the Keeper of the Flag, living on the highest point of the main atoll, a concrete plinth raised three meters above the mean sea level.

  The models showed that during the King Tide, the plinth would be awash for forty minutes.

  "If the land is underwater," Elias said, standing in the doorway of Mara's office, "the physical substrate is gone. The Montevideo Convention requires a defined territory. If the territory is submerged, the fact of the state is negated."

  Mara didn't look up from her tablet. "The Convention requires a defined territory *at the time of recognition*. It does not specify permanence. We are defining the sharpening of the term 'defined territory' to include 'historical baselines'."

  "You're stipulating a fiction," Elias said. "I have the hydrographic data. For forty minutes, Orovia is a reef, not an island. If we rule it exists during those forty minutes, we are lying."

  "We are maintaining coherence," Mara corrected. "If we rule it ceases to exist every time the tide comes in, and comes back when the tide goes out, the concept of 'Orovia' loses all utility. We are choosing the sharpening that preserves the rights of the diaspora."

  "And violates the truth," Elias said.

  "There is no truth value here, Elias. There is only utility."

  The deadline for the Tribunal's recommendation to the UN General Assembly was 0800 hours, the morning after the King Tide. The decision was irreversible. If the Tribunal ruled Orovia ceased to exist, the Exclusive Economic Zone (EEZ) would revert to the high seas. The fishing rights, the seabed mining claims, and the passport validity for 150,000 Orovian expatriates would vanish. If the Tribunal ruled it persisted, the EEZ remained, but the precedent would detach statehood from land forever.

  Elias spent the night in the data wing. He wasn't sleeping. He was correlating the tidal data with the legal statutes. He was looking for the *moment*. He believed that if he could pinpoint the exact second the legal status flipped, he could force the Tribunal to acknowledge the sharp boundary. He scoured the old treaties. He found a clause in the 1982 UNCLOS ratification that referenced "natural formation." He cross-referenced this with the geological survey of the plinth. It was artificial concrete, poured in 1990.

  *Got you,* Elias thought. The natural land had disappeared ten years ago. The concrete was a prosthesis. The sharp fact was that Orovia had died a decade prior, and everything since was a ghost.

  He prepared his report. *Finding of Fact: Cessation of Territory.* He timestamped it. He attached the geological surveys. He felt a grim satisfaction. He was not killing Orovia; he was merely reading the death certificate that reality had already signed.

  Mara spent the night in the conference room. She was not looking for facts; she was building a bridge. She knew the data showed submersion. She didn't care. She was drafting the *Declaration of Persistent Personality*. She was gathering the "sharpenings." She collected the statements from the Orovian government-in-exile, the cultural heritage designations, the diplomatic recognition from forty other states.

  She knew that if she waited for the data to be "clear," the diaspora would fracture. The vagueness was a danger zone. People were living in limbo, unable to renew passports, unable to bury their dead in home soil. The indeterminacy was causing real harm.

  Her job was to collapse the wave function. Not by finding the particle, but by forcing the observation.

  At 0700 hours, the tide peaked. The live feed from Tio's camera on the plinth showed water lapping over the concrete. The flag was wet. Tio stood waist-deep, holding the pole.

  Elias walked into the deliberation chamber at 0745. He placed his binder on the table. "The territory is submerged. The natural formation is gone. The fact is established. We cannot recommend continuity."

  Mara walked in at 0750. She placed her tablet on the table. "The community of nations recognizes Orovia. The government functions. The people identify as Orovian. The sharpening that best serves international stability is continuity."

  "The truth doesn't care about stability," Elias said.

  "The law isn't about truth, Elias. It's about order," Mara replied.

  The Chair of the Tribunal, an elderly Swiss jurist named Weber, looked at the clock. 0755. "We must submit the recommendation. We are split."

  "I am not split," Elias said. "I am reporting a measurement."

  "I am not measuring," Mara said. "I am legislating."

  Weber looked at them. "The UN requires a single recommendation. Existence, or Cessation."

  Elias looked at his binder. Inside was the proof. The geological survey. The tidal log. The sharp, jagged line where the land ended. He knew that if he forced the vote, the "Cessation" argument would likely win on technical grounds. The concrete was artificial. The land was gone. The fact was on his side.

  But he saw Mara's hands. They were steady, but her knuckles were white. She wasn't fighting for a concept; she was fighting for the 150,000 people who needed a country to belong to.

  Elias realized then that his search for the sharp boundary was itself a vague act. Where did the "fact" end and the "interpretation of the fact" begin? He had assumed the law tracked reality. But the law *was* a language game. And in a language game, usage determines meaning, not reference.

  But he couldn't betray the data. If he signed the Continuity Declaration, he would be falsifying the record. He would be saying the land was dry when it was wet.

  Mara realized that her stipulation required a foundation. If she ignored the physical reality entirely, the precedent would be too brittle. Future tribunals would reject it. She needed to acknowledge the loss without accepting the death.

  0758.

  Elias opened his binder. He took out his pen. He did not sign the *Finding of Fact*. Instead, he turned to the annex. He began to write a dissenting opinion, not on the outcome, but on the ontology. He documented the exact time of submersion. He recorded the loss of the natural formation. He created a permanent, public record that *physically*, Orovia was gone. He preserved the truth of the matter in the archives, even if he couldn't enforce it in the judgment.

  Mara saw what he was doing. She nodded, once. She understood. He would keep the fact; she would keep the function.

  She turned to the main recommendation. She typed the words: *The Tribunal finds that the State of Orovia continues to exist.* She did not add qualifiers about land mass. She did not mention the tide. She stipulated the reality.

  0759.

  Elias slid his annex across the table. "For the record."

  Mara slid her recommendation across the table. "For the people."

  Weber signed both.

  The transmission was sent to New York.

  In the Pacific, the tide began to recede. Tio, waist-deep in the ocean, watched the water level drop. The concrete plinth emerged, dripping. He raised the flag.

  In The Hague, Elias archived the hydrographic data, labeling it *Termination of Physical Substrate*. He knew that somewhere, in the deep structure of the world, a line had been crossed. A state had died. He had witnessed it.

  Mara walked to the window. She watched the rain fall on the streets of the Netherlands. She knew that somewhere, in the deep structure of human agreement, a line had been held. A state had lived. She had willed it.

  They met in the elevator on the way out. Neither spoke. They stood side by side, watching the floor numbers change. One believed they had buried a corpse. The other believed they had built a house. The elevator dinged. The doors opened to the same lobby, the same rain, the same world, which contained both the fact of the loss and the truth of the survival, overlapping like two maps of the same coast, neither quite matching the shore.
