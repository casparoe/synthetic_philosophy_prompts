          *   *Supervaluationist Character:* Believes there is no hidden fact; truth depends on "sharpenings" or stipulations. The tribunal's job is to *make* the decision, not find it.
      *   **Format:** Short story in the style of Ted Chiang or Greg Egan (hard SF/speculative fiction, intellectual rigor, emotional resonance, focus on the implications of an idea).
