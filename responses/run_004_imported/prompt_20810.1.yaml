answer: |-
  **MEMORANDUM**

  **TO:** The Prize Panel
  **FROM:** [Your Name], Chair
  **DATE:** 15 August 2024
  **SUBJECT:** Recommendation for Voting Procedure (2025 Cycle)

  **1. Context**

  As we prepare for the autumn shortlist meeting, we need to settle on a method for selecting the winner. Following last year's anomaly—where the removal of two non-contending books flipped the result between Book A and Book B—the panel is divided. Three of you have proposed switching to a "Most First-Place Votes" system (Plurality). Two of you have argued that the existing Points System (Borda Count) remains sound and that the anomaly was a statistical fluke.

  As Chair, my role is to recommend a procedure that ensures our winner is defensible, mathematically robust, and reflective of the panel's collective judgment. After reviewing the mechanics of last year's result and consulting standard voting theory, **I am recommending we adopt a Pairwise Comparison method (often called the Condorcet Method) for the 2025 prize.**

  This memo explains why the flip happened, why the proposed alternative (Plurality) carries significant risks for a panel of our size, and why Pairwise Comparison offers the best balance of nuance and stability.

  **2. Why the "Flip" Happened**

  The "Calm Down" camp is correct that no voting system is mathematically perfect. However, they are incorrect to dismiss last year's result as a mere fluke. It was a predictable feature of the Points System, known in political science as a violation of the *Independence of Irrelevant Alternatives (IIA).*

  Here is the mechanics of it: The Points System (5, 4, 3, 2, 1, 0) does not just measure *order*; it measures *distance*. It assumes the gap in quality between 1st and 2nd place is identical to the gap between 5th and 6th.

  When the coordinator removed the two "no-hoper" books and rescored the remaining four (3, 2, 1, 0), they compressed the scale. If Judge 1 ranked the "no-hopers" above Book B, and Judge 2 ranked them below Book B, removing those books changes Judge 1's score for Book B differently than it changes Judge 2's score. The "ballast" was gone, and the ship tipped.

  This means that under the Points System, a book can win or lose based not on how it compares to its rival, but on how judges feel about books that have no chance of winning. For a literary prize, where we want the best book to win on its own merits, this is an unacceptable vulnerability. The "Change It" camp is right to be concerned.

  **3. Why "Most First-Place Votes" Is Not the Solution**

  The proposal to switch to "Whoever gets the most 1st-place votes" (Plurality) solves the IIA problem but introduces a worse one for a small panel: **Minority Rule.**

  With five judges, a book could win with only two first-place votes. This means 60% of the panel could actively dislike the winner, preferring any of the other five books, yet their preferences are ignored. Plurality encourages tactical voting (ranking a longshot 1st to block a rival) and discards the nuance of our discussions. If we spend six months reading and debating, reducing our judgment to a single binary tick-box feels like a waste of our expertise.

  **4. Recommendation: Pairwise Comparison (Condorcet Method)**

  I recommend we adopt a Pairwise Comparison system. This method asks a simpler question: *In a head-to-head duel, which book does the panel prefer?*

  **How it works:**
  Instead of assigning points, we compare every book against every other book.
  *   Does the panel prefer Book A over Book B? (3 judges say A, 2 say B → A wins the duel).
  *   Does the panel prefer Book A over Book C?
  *   And so on.

  The winner is the book that beats every other book in its head-to-head matchups.

  **Why this works for us:**
  1.  **It solves the "Flip" problem:** If the majority of judges prefer Book B over Book A, Book B wins. It does not matter where Book C, D, E, or F are ranked. The "no-hopers" become mathematically irrelevant, satisfying the concern that started this debate.
  2.  **It respects nuance:** Unlike Plurality, it uses our full rankings. It acknowledges that a judge might prefer A over B, but B over C.
  3.  **It prevents Minority Rule:** A winner must be able to defeat every other contender in a direct matchup. It is impossible to win if a majority of the panel prefers someone else.

  **5. Implementation**

  I understand "Pairwise" sounds more complex than counting points. In practice, for five judges and six books, it is manageable.
  *   **Step 1:** Each judge submits a ranked list (1 to 6) as usual.
  *   **Step 2:** The coordinator runs a simple matrix (I will provide a template).
  *   **Step 3:** If one book wins all its head-to-heads, it is the winner.
  *   **Step 4:** In the rare event of a cycle (e.g., A beats B, B beats C, C beats A), we revert to the existing Points System as a tie-breaker.

  **6. Conclusion**

  The "Calm Down" camp is right that every system has theoretical flaws (Arrow's Impossibility Theorem proves we cannot have it all). However, we can choose which flaws we are willing to live with. The Points System allows irrelevant books to decide the winner. The Plurality System allows a minority to impose a winner. The Pairwise System ensures the winner is the one the panel collectively prefers over any alternative.

  I believe this best serves the integrity of the prize. I will circulate a sample scoring grid before our first meeting in October. Please review it, and let's discuss any concerns then.

  Best,

  [Your Name]
  Chair, [Prize Name]
