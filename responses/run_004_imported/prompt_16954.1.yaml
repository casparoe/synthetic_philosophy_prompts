  2.  **Deconstruct Hume's "Artificial Virtue":**
      *   *What does it mean?* It means promises aren't magic. There's no cosmic glue that sticks two people together just because they said words. The obligation comes from the *utility* of the convention. We agree to play by these rules because society (and relationships) work better when we do.
      *   *The Trap:* Avoiding "natural virtue" language (e.g., "love is a force of nature," "you were destined," "it's written in the stars," "moral duty exists independently").
      *   *The Opportunity:* Hume isn't cynical. He thinks artificial virtues are *essential* for civilization. Just because something is constructed doesn't mean it's weak. A bridge is artificial, but it holds weight. Money is artificial, but it buys food. Marriage is artificial, but it builds a life.
      *   *The "Binding" Feeling:* How to make it feel permanent without appealing to metaphysics? By appealing to *choice* and *maintenance*. The binding nature comes from the daily renewal of the convention, not the initial utterance.

  3.  **Audience Analysis:**
