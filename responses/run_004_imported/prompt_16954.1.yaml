answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I've had the privilege of being [Bride]'s friend since graduate school, which means I've spent the better part of a decade listening to her talk about David Hume.

  Now, for the family members here: David Hume was an 18th-century philosopher who had very strong opinions about promises. And for [Bride], this isn't just trivia. She is currently finishing a dissertation arguing that keeping a promise is what Hume called an "artificial virtue."

  I know what that sounds like. "Artificial" sounds like "fake." It sounds like plastic flowers or a staged photo. But in philosophy, and in [Bride]'s view, "artificial" simply means *human-made*. It means constructed. Like a bridge, or a language, or a home.

  [Bride] has warned me—and I know she is listening closely—that if I stand up here and say you two were "meant to be," or that there is some cosmic moral glue binding you together simply because you said vows, she will heckle me. And given her track record in debate, I would lose.

  So, I am not going to say that.

  I am not going to say that fate brought you together. I am not going to say that the universe demands this of you. There is no natural law of gravity that pulls two people together and holds them there. If you walk away from a promise, the stars do not fall out of the sky.

  And that, I think, is what makes what you are doing today so incredibly brave.

  If marriage were a natural fact, like breathing or gravity, you wouldn't need courage. You'd just do it. But because it is an *artificial virtue*, because it is a construct, it requires something much harder than fate. It requires *choice*.

  Hume argued that we bind ourselves to these conventions not because they are written in the stars, but because they are useful. They allow us to build a life that is stable, secure, and deeply shared. A promise is a tool. It is the technology we use to turn "I love you today" into "I will love you tomorrow."

  [Bride] has spent years dismantling the idea that obligation comes from nowhere. She believes the obligation comes from the value of the thing we are building.

  So, to [Groom]: You are not just marrying a woman; you are entering into a convention with her. You are agreeing to play by the rules of a game where the prize is a shared life. You are agreeing that when things are difficult, you won't retreat to the fact that there is no "natural" reason to stay. You will stay because you have built a world together, and that world is worth maintaining.

  And to [Bride]: You have taught me that nothing binds us except our own willingness to be bound. That sounds fragile, but I think it is actually the strongest foundation possible. A love that relies on destiny is passive. A love that relies on a social contract, renewed every single morning, is active. It is a verb.

  For the family here: You might worry that calling marriage "artificial" makes it sound less romantic. But think of it this way. A forest is natural. But a garden? A garden is artificial. It requires planning, it requires weeding, it requires water. And precisely because it is tended, precisely because it is built by human hands, it can bloom in ways the wild forest never could.

  [Bride] and [Groom], you are planting a garden today. There is no law of nature that says the flowers must grow. There is only the work you put in, and the agreement you make to pick up the tools together, day after day.

  The binding power of your vows doesn't come from the minister, or the state, or the moral fabric of the universe. It comes from the two of you, deciding, again and again, to honor the convention you are establishing right now.

  So, I'd like to propose a toast.

  To the artificial. To the constructed. To the beautiful, human-made world you are about to build. May you always find it worth maintaining.

  To [Bride] and [Groom].
