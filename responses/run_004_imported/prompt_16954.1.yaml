      *   **Closing:** A wish for the future. A toast.

      *   *Self-Correction during drafting:* I need to make sure I don't accidentally slip into Prichard (self-evident duty) or Scanlon (manipulating expectations). I must focus on the *social practice* and the *utility/beauty of the construct*.
      *   *Refining the "Artificial" definition:* For the family, "artificial" sounds like "fake." I need to use synonyms like "constructed," "crafted," "human-made." Like a house or a garden.
      *   *Addressing the Heckle Threat:* Explicitly acknowledge the constraint in a humorous way to disarm it. "I know the rules."

  5.  **Drafting - Specific Phrasing:**
