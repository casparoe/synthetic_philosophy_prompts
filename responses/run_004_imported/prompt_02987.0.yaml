          *   *Comparison:* They are conceptually identical in spirit (local determination of the collective outcome). However, the *impact* differs. In Arrow, IIA prevents trading off intensity or context. In JA, Independence prevents the panel from using logical connections to resolve inconsistencies (e.g., you can't let the verdict on $p \land q$ influence the verdict on $p$).
          *   *Nuance:* In JA, "Systematicity" is often the stronger condition used in impossibility proofs, combining Independence with Neutrality (same rule for all propositions). Arrow's IIA is specific to pairs.

