      *   **Popper on Evolution (Late):** In the 1978 essay "Natural Selection and the Emergence of Mind," Popper explicitly recanted. He admitted natural selection is testable and scientific. He acknowledged the tautology charge was mistaken (fitness can be defined independently of survival, e.g., physiological traits).
      *   **Popper's Evolutionary Epistemology:** Science grows via $P_1 \rightarrow TT \rightarrow EE \rightarrow P_2$ (Problem $\rightarrow$ Tentative Theory $\rightarrow$ Error Elimination $\rightarrow$ New Problem). This looks like Variation (Conjecture) + Selection (Refutation).
      *   **Theo's Charge:** Isomorphism. If Popper says Biology = Variation + Selection, and Epistemology = Variation + Selection, then criticizing the former while endorsing the latter is inconsistent *unless* there is a relevant difference.
      *   **The Crucial Nuance:** Popper distinguishes between *logical* falsification and *causal* elimination. In biology, selection is a causal mechanism. In science, falsification is a logical/critical procedure performed by scientists.

  3.  **Evaluate the "Inconsistency" Charge:**
      *   *Is Popper inconsistent?* No, because he recanted the biological critique. If he admits biology is scientific *and* his epistemology is Darwinian, there's no contradiction *unless* the Darwinian mechanism itself is flawed.
      *   *Is the structure identical?* Superficially, yes. Blind variation + selective retention.
      *   *Is there a disanalogy?* Yes.
          *   **Biology:** Selection is *natural*, unconscious, and based on reproductive success (survival).
          *   **Epistemology:** Selection is *rational*, conscious, and based on truth-likeness (verisimilitude) via logical falsification.
      *   *Theo's deeper point:* Even if Popper recanted, does the *structure* of "survival of the unfalsified" suffer the same tautology problem as "survival of the fittest"?
          *   "Fittest" = Those who survive.
          *   "Best Theory" = That which survives falsification.
          *   Is this circular? In biology, fitness is often defined causally (traits). In Popper's epistemology, "survival" isn't the *definition* of truth, it's a *test* of truth. A theory survives *because* it corresponds to reality (hopefully), not just because it survived.
          *   However, Popper is a fallibilist. We never know if a theory is true, only that it hasn't failed *yet*. So, is "corroboration" just "survival"? Popper says corroboration says nothing about future performance, just past testing. This is the weak spot.

