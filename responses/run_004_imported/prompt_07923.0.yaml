      *   *Option C (Synthetic/Nuanced Verdict):* Theo is right about the *structural* isomorphism, but wrong about the *inconsistency*. Popper isn't smuggling Darwinism in secretly; he's explicitly proposing an evolutionary ontology of knowledge. The real issue isn't inconsistency, it's whether the "selection" in science is robust enough to avoid the tautology trap. The disanalogy lies in the *normative* vs. *descriptive* nature of the selection.

