      *Wait, one nuance:* Popper's early view was that Darwinism is metaphysical *because* it's unfalsifiable. His later view is that it *is* falsifiable. His epistemology *always* relied on an evolutionary model. So, if the biological model was metaphysical (unscientific), how could the epistemological model be scientific?
      *Resolution:* Popper's epistemology isn't a scientific theory; it's a *philosophical* theory about science. So it doesn't need to be falsifiable in the same way. But the *mechanism* it describes (conjectures/refutations) is what makes science scientific.
      *Okay, the strongest argument:* The tautology charge fails in biology (admitted by Popper). Therefore, using a Darwinian model in epistemology isn't importing a "tautology." It's importing a valid explanatory framework. The disanalogy (logical vs causal) ensures the epistemological version doesn't suffer the specific pitfalls Popper *thought* biology had (even if he was wrong about biology having them).

      *Let's go with this:* **Verdict: Popper is consistent, but Theo has identified the exact reason Popper had to recant.** The structural similarity is a feature, not a bug. The "tautology" worry was a mistake about biology, not a deep insight that applies to epistemology.

