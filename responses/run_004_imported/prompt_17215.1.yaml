      *   **Speaker:** Grandchild, currently taking a political philosophy seminar (Rawls/Nozick focus), knows the material well.
      *   **Audience:** Mixed.
          *   Uncle Rick: Skeptical, calls it "commie nonsense," resents control from the grave.
          *   Cousins: Think it's complicated/annoying.
