answer: |-
  The tension you identify lies at the heart of a major shift in the philosophy of language and social ontology: the move from rationalistic reconstruction to naturalistic explanation. David Lewis, in *Convention* (1969), sought to ground social regularities in the logic of rational choice, specifically requiring **common knowledge** to solve the equilibrium selection problem. Brian Skyrms, in *The Stag Hunt* (2004) and *Signals* (2010), demonstrates that evolutionary dynamics and reinforcement learning can select for the same equilibria without any appeal to higher-order beliefs.

  Here is the comparison, the verdict on the explanatory work of common knowledge, and the analysis of the Stag Hunt extension.

  ### 1. Lewis vs. Skyrms: Epistemic vs. Dynamic

  **Lewis's Account:**
  Lewis defines a convention as a solution to a recurrent coordination problem. For Lewis, a regularity $R$ is a convention only if:
  1.  Everyone conforms to $R$.
  2.  Everyone expects everyone else to conform to $R$.
  3.  Everyone prefers to conform to $R$ *on the condition* that others do (conditional preference).
  4.  **Common Knowledge:** Everyone knows 1–3, everyone knows that everyone knows, *ad infinitum*.
  5.  **Arbitrariness:** There is an alternative regularity $R'$ that could have served just as well.

  For Lewis, common knowledge is the engine of stability. It ensures that my reason for conforming (my expectation of you) is matched by your reason for conforming (your expectation of me). It is a synchronic, epistemic account: it explains why rational agents *now* adhere to the rule.

  **Skyrms's Account:**
  Skyrms treats signaling systems and social contracts as **Evolutionarily Stable Strategies (ESS)** or attractors in a dynamic system.
  1.  **No Common Knowledge:** Agents need not know what others are doing, nor reason about others' reasoning. They simply respond to payoffs.
  2.  **Mechanism:** Through replicator dynamics (natural selection) or reinforcement learning (trial and error), populations drift toward stable equilibria.
  3.  **Contingency:** The "arbitrariness" of convention is explained by **path dependence**. Which equilibrium the population lands on depends on initial conditions or historical accidents, not a rational agreement.

  Skyrms provides a diachronic, causal account: it explains how the regularity *arose* and *persists* over time.

  ### 2. The Verdict: Explanatory Redundancy

  You asked for a definite verdict: **Does Skyrms's success show that Lewis's common-knowledge clause was never doing real explanatory work, or does it leave out a genuinely normative feature?**

  **Verdict:** Skyrms's success demonstrates that Lewis's common-knowledge clause is **explanatorily redundant**.

  Here is the defense of this verdict. The charge that Skyrms leaves out a "genuinely normative feature" rests on the idea that conventions involve an "ought" that mere behavioral regularities lack. However, this confuses the *phenomenology* of human convention with its *ontological basis*.

  Lewis introduced common knowledge to explain how rational agents coordinate without communication. He needed it to bridge the gap between "I prefer to do X if you do X" and "We are both doing X." But Skyrms shows that this bridge is built by **stability**, not epistemology. In an evolutionary context, a signaling system is stable because deviators are penalized (they get no food, or crash their cars). The "normative force" Lewis identifies—the reason I have to conform—is simply the payoff structure of the equilibrium.

  If a population of vervet monkeys or honeybees maintains a stable signaling system without common knowledge (as your field confirms they do), then common knowledge is not a necessary condition for the existence of a convention. If it is not necessary for bees, and Skyrms shows it is not necessary for the *mathematics* of coordination, then positing it for humans is an unnecessary complication unless one insists on a dualistic separation between human "reasons" and animal "causes."

  The "normativity" Lewis worries about is fully accounted for by the **cost of deviation**. In Skyrms's models, an agent who deviates from the signaling convention fails to coordinate and receives a lower payoff. This creates a functional "ought": *If you want to maximize utility/fitness, you ought to conform.* Lewis's common knowledge adds no predictive power to this; it merely describes the internal cognitive state of a hyper-rational agent. Since the behavioral outcome (stable coordination) is identical with or without the common knowledge assumption, the assumption is doing no *explanatory* work regarding the convention itself. It is a philosophical gloss on a dynamic reality.

  ### 3. Extending to the Stag Hunt

  This verdict is reinforced when we consider whether Lewis's framework extends to the **Stag Hunt** scenarios central to Skyrms's later work.

  **Lewis's Limitation:**
  Lewis's *Convention* focuses on **Pure Coordination Problems** (e.g., driving on the left vs. the right). In these games, the equilibria are Pareto-equal; neither side is inherently better, which satisfies Lewis's "arbitrariness" condition.

  The **Stag Hunt** introduces a conflict between **Payoff Dominance** (Stag/Stag is best for all) and **Risk Dominance** (Hare/Hare is safer).
  *   **Lewis's Framework Struggles:** Lewis's definition requires that agents "would have conformed just as readily to some different regularity." In a Stag Hunt, this is false. Agents *prefer* the Stag equilibrium over the Hare equilibrium intrinsically, not arbitrarily. The regularity is not purely conventional in the Lewisian sense because one equilibrium is objectively superior. Lewis's reliance on common knowledge to solve equilibrium selection fails here because common knowledge of rationality often implies playing the Payoff Dominant strategy, yet populations often get stuck in the Risk Dominant equilibrium (the "safe" convention). Lewis lacks the tools to explain why a population would settle for the inferior Hare equilibrium.

  **Skyrms's Success:**
  Skyrms's evolutionary dynamics handle the Stag Hunt naturally.
  *   **Basins of Attraction:** The population's outcome depends on the size of the "basin of attraction" for each equilibrium. If the risk of hunting Stag is too high (the basin is small), the population evolves toward the Hare equilibrium, even though Stag is better.
  *   **No Rational Paradox:** This requires no assumption that agents "prefer" the worse outcome. It simply reflects that the dynamic path to the better outcome is too fragile.

  Skyrms shows that social structure emerges from the tension between risk and reward, mediated by population dynamics. Lewis's framework, built on the symmetry of pure coordination, cannot easily accommodate the asymmetry of the Stag Hunt without abandoning the "arbitrariness" clause that defines his concept of convention.

  ### Conclusion

  Your unease with crediting vervets or bees with "beliefs about beliefs" is philosophically warranted. Skyrms's work validates the intuition that **conventions are stable regularities sustained by feedback loops, not epistemic states.**

  While Lewis correctly identified that conventions involve interdependent expectations, he mistakenly located the source of that interdependence in the *minds* of the agents (common knowledge) rather than in the *structure of the interaction* (payoff stability). Skyrms shows that the structure alone is sufficient to generate the regularity. Therefore, Lewis's common-knowledge clause is explanatorily redundant. Furthermore, Lewis's framework is too narrow to encompass the Stag Hunt scenarios that characterize much of social life, where safety and reward pull apart. Skyrms's evolutionary account is not just a parallel explanation; it is a more robust and general theory of social order that subsumes Lewis's rationalist account as a special, high-cognition case.
