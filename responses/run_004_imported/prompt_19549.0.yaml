answer: |-
  It is a pleasure to engage with a colleague who has spent a career in the trenches of evolutionary biology. Your intuition is sharp: the friction between the etiological (Wrightian) and causal-role (Cumminsian) accounts is not merely semantic; it strikes at the heart of how we explain the living world.

  Given your background, I will skip the basic definitions and focus directly on the implications of exaptation for biological practice and the philosophical "strain" you suspect exists.

  ### 1. The Exaptation Case: Feathers, Flight, and Insulation

  To ground the debate, let us look at the feather through both lenses.

  *   **The Etiological Account (Wright/Millikan/Neander):** A trait's function is determined by the reason it was selected for in the past. If proto-feathers were selected for thermal insulation, then **insulation** is their proper function. Flight is merely a "happy accident" or a side effect. Flight only becomes a "function" once natural selection begins acting on variation in feathers *specifically to improve flight*.
  *   **The Causal-Role Account (Cummins):** A trait's function is determined by its current contribution to the capacity of a containing system. If feathers currently contribute to aerodynamic lift, then **flight** is a function, regardless of history.

  **The Implication for "What is it *really* for?"**
  For the practicing biologist, the answer depends entirely on the **explanatory context**. There is no single "real" function; there are two different questions being asked under the same label.

  1.  **If you are asking about phylogeny and origin:** You are asking an etiological question. "Why is this trait in the genome?" The answer is insulation. In this context, calling flight the "function" is misleading because it implies a selective history that didn't exist at the trait's inception.
  2.  **If you are asking about physiology and current fitness:** You are asking a causal-role question. "How does this organism survive today?" The answer is flight. In this context, denying flight is a function is absurd, as the organism's current survival depends on it.

  The philosophical debate often stalls because it seeks a monistic definition of "function." The biological implication is that **functional ascription is pragmatic.** When a biologist says, "The function of the feather is flight," they are usually making a claim about current utility. When they say, "The function of the feather was originally insulation," they are making a claim about evolutionary history. Confusion arises when we treat these as mutually exclusive truth claims rather than context-dependent explanatory tools.

  ### 2. Is the Etiological Account Straining?

  You ask whether the routine invocation of exaptation—and specifically the phase where a trait is co-opted but not yet fully refined—suggests the etiological account is failing to capture actual usage.

  **The short answer is yes.** Here is why the etiological account strains against biological practice:

  #### A. The Problem of the "Lag Time"
  The etiological account requires a selective history to establish a function. However, in the exaptation scenario, there is a transitional phase. Feathers are co-opted for gliding before there is significant selection for *improved* gliding.
  *   **Biological Practice:** A field biologist observing a dinosaur gliding from a tree would reasonably hypothesize, "Feathers are functioning for lift." They treat the new role as functional immediately upon co-option.
  *   **Etiological Theory:** Strictly speaking, until selection has acted on variation to refine that lift, flight is not the "proper function." It is merely a causal role.
  *   **The Strain:** This forces the biologist to adopt a philosophical category ("mere effect") that contradicts their functional intuition. If the trait is *necessary* for the organism's current survival in its new niche, biologists treat it as functional. The etiological account forces an artificial waiting period until the "selective stamp" is applied.

  #### B. The "Forward-Looking" Nature of Adaptationism
  Biologists often speak of function in a way that is subtly forward-looking. When we identify an exaptation, we often imply, "This trait is *now* available for selection to act upon."
  The etiological account is strictly backward-looking. It cannot easily accommodate the potentiality that biologists recognize. When Gould and Vrba coined "exaptation," they wanted to highlight that not all utility is adaptation. However, in practice, once an exaptation is identified, biologists immediately begin modeling how selection *will* or *is beginning to* shape it. The etiological account struggles to categorize traits that are in the process of becoming adaptations but lack the deep history of established adaptations.

  #### C. Normativity vs. Utility
  The strongest argument for the etiological account is **normativity**. It explains malfunction. If the heart is etiologicaly for pumping blood, a heart that doesn't pump is *broken*. If the heart is causally for making noise, a silent heart isn't broken.
  However, in the case of exaptation, biologists are often less concerned with "malfunction" and more concerned with **utility**. When studying the co-option of jaw bones into ear ossicles, we are interested in how the new causal role contributes to hearing. The etiological insistence on tracing the "proper function" back to the jaw can obscure the analysis of the new auditory system. In macro-evolutionary transitions, the "causal role" is often more explanatory than the "selective history."

  ### 3. A Proposed Synthesis for the Biologist

  Does this mean you should abandon the etiological account? No. It remains essential for distinguishing adaptation from spandrels (to use Gould and Lewontin's term). Without it, every beneficial effect looks like an adaptation, leading to "pan-adaptationism."

  However, your intuition that the etiological account strains under the weight of exaptation is supported by many contemporary philosophers of biology (such as Peter Godfrey-Smith and Justin Garson). The consensus is moving toward **Function Pluralism**.

  For a biologist, this suggests a disciplined approach to language:

  1.  **Use "Selected Effect" (Etiological)** when discussing **why a trait exists** in the population or when distinguishing adaptation from drift/exaptation.
      *   *Example:* "The selected effect of proto-feathers was insulation."
  2.  **Use "Causal Role" (Cumminsian)** when discussing **how a trait works** in a current system, especially during evolutionary transitions or co-option.
      *   *Example:* "The causal role of these feathers in *Archaeopteryx* included aerodynamic lift."
  3.  **Acknowledge the Transition:** When a co-opted trait is being refined (the "exaptation-to-adaptation" pipeline), acknowledge that the function is shifting. The etiological account treats this as a binary switch (it is or isn't a function); biology treats it as a continuum.

  ### Conclusion

  The debate implies that "function" is not a natural kind waiting to be discovered, but a tool biologists use for different jobs. The etiological account is the tool for **historical explanation** (why is it here?). The causal-role account is the tool for **mechanistic explanation** (what does it do?).

  Exaptation highlights the gap between these tools. When a trait's history (insulation) diverges from its current utility (flight), the etiological account strains because it demands we ignore the utility until history catches up. Since biologists cannot ignore utility—especially when it drives current survival—the etiological account alone is insufficient. It does not need to be discarded, but it must be recognized as describing only one dimension of functional ascription. The "real" function is whichever answer best serves the specific explanatory question you are asking.
