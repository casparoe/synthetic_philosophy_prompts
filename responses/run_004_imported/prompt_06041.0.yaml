          *   Explain "Risk of Ruin." If you bet 100% on a 60/40 coin flip, you eventually hit a tail and go to 0. Game over.
          *   Term: Non-ergodic process.
      *   **Addressing Friend B (The Fixed Fraction Bettor):**
