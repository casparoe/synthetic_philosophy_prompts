          *   Introduce **Log Utility**. Why log? It corresponds to maximizing the long-term geometric growth rate.
          *   Introduce the **Kelly Criterion**. This gives the *optimal* fixed fraction. It's not arbitrary caution; it's mathematically derived from log utility.
