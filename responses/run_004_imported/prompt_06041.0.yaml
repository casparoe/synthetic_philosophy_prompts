answer: |-
  This is a fantastic question that cuts to the heart of a major debate in decision theory, economics, and probability. The short answer is: **Friend A is making a category error regarding probability, and Friend B is intuitively practicing a strategy that has a rigorous mathematical defense, though she lacks the vocabulary to explain it.**

  Rationality does have something to say about bet size. It is not merely personal taste, provided we define "rationality" in the context of sequential decisions over time rather than one-off choices in a vacuum.

  Here is the breakdown of why Friend A is wrong, why Friend B is right but incomplete, and the decision-theoretic framework that resolves the dispute.

  ### 1. The Flaw in Friend A's "Max EV" Argument
  Friend A is arguing for **Expected Value (EV) Maximization** using linear utility (where \$1 million is exactly 1,000,000 times better than \$1). His defense relies on the **Ensemble Average**.

  *   **The Argument:** If 1,000 people bet 100% of their bankroll on a favorable coin flip in parallel universes, the average wealth of the group will be massive.
  *   **The Flaw:** You do not live in an ensemble of parallel universes. You live in a single timeline. This is a **Time Average** problem.

  In sequential betting, wealth is **multiplicative**, not additive. If you bet 100% of your bankroll on a coin flip that pays 2:1 with a 60% win probability:
  1.  You win: Bankroll $\times 2$.
  2.  You lose: Bankroll $\times 0$.

  Eventually, you *will* lose. Once your bankroll hits zero, you face an **absorbing barrier**. You cannot bet anymore. The game ends for you. Friend A's strategy maximizes the *arithmetic mean* of outcomes, but in a multiplicative process, the *geometric mean* determines long-term survival and growth.

  In modern terms (championed by physicists like Ole Peters), Friend A is confusing an **non-ergodic** process with an ergodic one. The average across people (ensemble) does not equal the average across time for one person. Therefore, maximizing arithmetic EV is mathematically irrational for a sequential bettor with a finite bankroll.

  ### 2. The Defense of Friend B's "Fixed Fraction" Strategy
  Friend B is betting a fixed percentage of her bankroll. This avoids ruin (you never hit zero, you just approach it asymptotically) and allows for compounding. However, as she admitted, without a theory, choosing 5% vs. 10% seems like "caution" or "taste."

  Decision theory provides the missing link: **Expected Utility Theory.**

  Rational agents do not maximize expected *wealth*; they maximize expected *utility*. Utility functions usually exhibit **diminishing marginal utility of wealth**. Losing your last \$1,000 hurts much more than gaining an extra \$1,000 helps.

  If we assume a specific utility function—specifically the **Logarithmic Utility Function** ($U(W) = \ln(W)$)—we can derive the optimal bet size mathematically. This derivation is known as the **Kelly Criterion**.

  ### 3. The Kelly Criterion: The Rational Bet Size
  The Kelly Criterion answers the question: *What fraction of my bankroll should I wager to maximize the long-term geometric growth rate?*

  For a simple binary bet where you win $b$ times your stake with probability $p$, and lose your stake with probability $q$ (where $q = 1-p$), the optimal fraction $f^*$ is:

  $$f^* = \frac{p(b + 1) - 1}{b}$$

  Or, more simply expressed as Edge divided by Odds:
  $$f^* = \frac{\text{Expected Net Profit}}{\text{Net Odds Received}}$$

  **Why this matters for your course:**
  1.  **It maximizes growth:** Betting less than Kelly grows your wealth slower. Betting more than Kelly increases volatility and *reduces* long-term growth (a phenomenon called "overbetting").
  2.  **It avoids ruin:** Kelly never bets 100% unless the probability of winning is 100%.
  3.  **It links to Utility:** Maximizing the geometric growth rate is mathematically equivalent to maximizing the expected value of the **logarithm of wealth**.

  So, Friend B is effectively using a **Fractional Kelly** strategy. If she bets 5%, she might be calculating that the "Full Kelly" is 10%, but she is halving it to reduce volatility. This isn't just "caution"; it is a adjustment based on the specific curvature of her utility function.

  ### 4. Is it "Personal Taste"?
  You asked if rationality leaves bet size to personal taste. The answer is nuanced:

  *   **Yes, regarding Risk Tolerance:** Your utility function is a expression of your preferences. If you have linear utility (you care only about the raw number), Friend A is right *for you*. But linear utility is generally considered irrational for humans because it implies you would take the "St. Petersburg Paradox" bet (paying any amount to play a game with infinite EV but near-certain small payout). Most humans have concave utility (risk-averse).
  *   **No, regarding Consistency:** Once you accept that you want to survive the long run and grow your bankroll (which is implied by joining a season-long betting pool), Friend A's strategy is objectively flawed. It leads to ruin with probability 1 as $N \to \infty$.
  *   **No, regarding Math:** Once you accept a Log Utility function (which is the standard reference for "growth optimal" strategies), the bet size is no longer taste; it is a calculation.

  ### Summary for Your Disagreement
  You can tell your friends the following:

  1.  **Friend A** is falling for the **Ergodicity Fallacy**. He is optimizing for a parallel universe he doesn't live in. In our timeline, betting 100% on anything less than a sure thing guarantees eventual ruin. That isn't bad luck; it's probability.
  2.  **Friend B** is practicing **Growth Optimal Betting** (specifically, a fractional Kelly strategy). She isn't just being "cautious"; she is implicitly maximizing the geometric mean of her wealth, which is the correct metric for sequential investments.
  3.  **Rationality** dictates that bet size depends on the **utility function**. If the goal is to maximize the probability of having the most money at the end of the season without going bust, the Kelly Criterion provides the normative standard. Ignoring bet size is not neutral; it is an implicit assumption of linear utility, which is ill-suited for repeated wagering.

  **Recommendation:** If you want to win the pool, don't bet max EV. Calculate your edge, apply the Kelly formula to find the growth-optimal fraction, and perhaps bet half-Kelly to reduce variance. That is the defensible, decision-theoretic middle ground.
