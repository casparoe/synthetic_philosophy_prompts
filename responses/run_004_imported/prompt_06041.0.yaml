  3.  **Deconstruct Friend B's Position (Fixed Fraction):**
      *   *Claim:* Bet a fixed % (e.g., 5%).
      *   *Strength:* Avoids ruin (as long as % < 100%). Allows compounding.
      *   *Weakness:* Arbitrary. Why 5%? Why not 1% or 20%? Without a theoretical basis, it *is* just caution/taste.
      *   *Verdict:* Practically safer, but lacks a normative decision-theoretic foundation *unless* linked to a specific utility function.

  4.  **Identify the Decision Theoretic Solution:**
      *   **Expected Utility Theory (EUT):** Rationality isn't about maximizing expected *wealth* (linear utility), but expected *utility*.
      *   **Diminishing Marginal Utility:** Most people have concave utility functions (logarithmic is a strong candidate). Losing \$1000 hurts more than gaining \$1000 helps.
      *   **The Kelly Criterion:** This is the bridge. If you maximize the expected *logarithm* of wealth (geometric growth rate), you derive the Kelly fraction.
      *   **Ergodicity Economics:** This is the modern framing that directly addresses Friend A's "parallel people" argument. Ole Peters' work is relevant here. Time average growth rate $\neq$ Ensemble average expected value.

