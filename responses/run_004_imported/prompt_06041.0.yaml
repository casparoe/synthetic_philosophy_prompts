  2.  **Deconstruct Friend A's Position (Max EV):**
      *   *Claim:* Rationality = Maximize Expected Value. Bet everything on +EV.
      *   *Flaw:* Ignores the non-ergodic nature of wealth accumulation. Wealth is multiplicative, not additive. If you go to zero, you can't play anymore.
      *   *Counter-argument:* The "ensemble average" (many parallel universes) is not the same as the "time average" (one person over time). In betting, you live in the time average.
