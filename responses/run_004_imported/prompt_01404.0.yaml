  A persecutor pounds on Augustine's door: "Is the fugitive hiding in there?"

  Augustine opens up, winks broadly, and says, "Yes, he's currently debating angels in heaven!"

  The persecutor checks the room, finds no one, and scowls. "You're lying."

  Augustine smiles serenely. "Impossible. A lie requires the intent to deceive. Since that was obviously a jest, it doesn't count as a sin. My conscience is clean."

  "But your friend is in the cellar," the persecutor says, drawing his sword. "And now I'm going to kill him."

  Augustine shrugs. "Better him than me. Besides, I didn't lie. I told a joke. You're the one taking it seriously."
