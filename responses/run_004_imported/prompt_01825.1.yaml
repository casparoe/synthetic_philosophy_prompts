answer: |-
  This is a fantastic question because it cuts to the heart of the difference between philosophical idealism and psychological reality. Your friend has raised the classic *ad hominem* critique of Russell's sexual ethics: *If this works, why did it break your own heart?*

  However, based on Russell's broader philosophical project, his specific writings on psychology, and his later reflections on the Dora marriage, my best-guess take is this: **Russell would not view his marriage as a falsification of his theory. He would view it as a case study in insufficient infrastructure and unresolved social conditioning.**

  He would likely look at modern polyamory and argue that it validates his thesis, provided one crucial caveat is met: the participants must possess a level of emotional self-regulation that he himself struggled to maintain.

  Here is the breakdown of why he would likely stick to his guns, and where he would concede ground.

  ### 1. Jealousy as Property vs. Jealousy as Instinct
  Your friend's argument rests on the idea that Russell's failure proves jealousy is an immutable instinct. But Russell's argument in *Marriage and Morals* was never that jealousy is *easy* to eliminate; it was that it is not *biologically necessary*.

  Russell was a rationalist and an empiricist. He viewed jealousy primarily as a sentiment derived from the concept of private property applied to human beings. In the 1930s, the "infrastructure" for non-monogamy was nonexistent. There was no vocabulary for "metamours," no community support, and no legal protections. When Dora had children with Griffin Barry, it wasn't just an emotional betrayal; in the eyes of 1930s society (and deep-seated Victorian conditioning), it was a threat to Russell's lineage and social standing.

  Russell would likely argue that modern polyamory removes the "property" element that fueled his jealousy. If the modern framework explicitly rejects ownership of partners, the specific *type* of jealousy that destroyed his marriage (possessiveness) is less likely to trigger. He would say: *"Dora and I were trying to run software from 1929 on hardware built by the Victorians. You now have updated operating systems."*

  ### 2. The "Compersion" Argument
  This is where Russell would be most fascinated. The concept of "compersion" (finding joy in a partner's joy with another) is essentially the emotional endpoint of Russell's rationalist project.

  Russell believed that through reason and habituation, humans could train their emotional responses. He didn't think you were born good or bad; he thought you were trained. If modern polyamorists treat compersion as a "skill you deliberately cultivate," that is pure Russell. He would see this not as a contradiction of his failure, but as the missing tool he lacked.

  He would likely admit that *he* failed to cultivate this skill. In his autobiography, he reflects on his marriages with candor, often admitting to being difficult, cold, or emotionally demanding. He would probably say: *"The theory holds, but the practitioner was flawed. I reasoned correctly about the institution, but I could not reason away my own neuroses."*

  ### 3. The "Children" Caveat
  There is one area where Russell might actually critique modern polyamory more harshly than his own experiment.

  In *Marriage and Morals*, Russell's primary constraint on sexual freedom was the welfare of children. He believed that while adults could be free, children required stability. The collapse of his marriage to Dora was acrimonious and public, which impacted their children (John and Kate).

  Russell would likely look at modern polyamory and ask: *Does this structure provide more stability for children, or less?* If modern polyamory uses "explicit relationship agreements" to create stable, long-term co-parenting networks regardless of sexual fluidity, Russell would approve. If, however, modern polyamory leads to the same kind of chaotic turnover that plagued his later marriages, he would argue that the "structure" is still insufficient. He wouldn't blame the non-monogamy; he would blame the instability.

  ### 4. The Verdict: Theory vs. Practice
  So, to answer your specific question: **Would he revise the theory?**

  **No.** Russell was too committed to the idea that human misery is largely a result of bad social structures and irrational habits. To admit that jealousy is an unconquerable biological instinct would be to admit a limit to rationalism, which he was unwilling to do.

  **However, he would revise the *expectations*.**

  In *Marriage and Morals*, Russell was perhaps too optimistic about how *quickly* people could shed jealousy. After the Dora disaster, and his subsequent turbulent marriages, he became more somber about the difficulty of love. In his later years, he wrote that while jealousy *can* be overcome, it requires a level of security and selflessness that is rare.

  He would likely tell you and your friend:
  > "My error was not in believing jealousy could be overcome, but in underestimating the strength of the social poison we had all ingested. Dora and I were pioneers without a map. If you have a map (agreements), a compass (compersion), and a community that does not treat you as sinners, the journey is possible. But do not mistake the existence of the path for the ease of the walk. I failed the walk. That does not mean the path does not lead where I said it does."

  ### Summary for the Argument
  If you want to win the point (or at least complicate your friend's counter):

  1.  **Russell distinguished between "possible" and "easy."** His failure proves it's hard, not that it's impossible.
  2.  **Context matters.** The stigma Russell faced exacerbated the jealousy. Modern polyamory has less external stigma, reducing the internal pressure.
  3.  **Vocabulary is technology.** "Compersion" and "metamour" are cognitive tools Russell didn't have. He would view them as necessary tech for the theory to work.
  4.  **The Nobel/Job Note:** Just a small correction for your ammo—the City College of NY revocation (1940) was indeed due to *Marriage and Morals*, but the Nobel (1950) was cited for his "varied and significant writings" in defense of humanitarian ideals. The *Marriage and Morals* controversy was definitely part of his "significant" (i.e., provocative) reputation, but the Nobel committee was largely rewarding his later anti-nuclear and philosophical work.

  **Bottom line:** Russell would view modern polyamory as the "Version 2.0" of his experiment. He'd admit Version 1.0 crashed (his marriage), but he'd insist the code (the theory) was sound, it just needed better hardware (social support) and debugging (emotional tools).
