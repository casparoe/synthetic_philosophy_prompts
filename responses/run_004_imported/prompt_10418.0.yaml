answer: |-
  Thank you for being here.

  For those who don't know, my brother died at twenty-six. It is a specific, cruel irony that this is the same age Frank Ramsey was when he died in 1930. Ramsey was a mathematician and philosopher, and for the last several years of his life, my brother returned to Ramsey's 1925 talk, the "Epilogue," every single year.

  I know most of us in this room are not philosophers. And the few who are—his friends from Cambridge—are likely bracing themselves for me to misuse the text. So I will be careful.

  There is a standard script for a funeral like this. It usually goes something like this: *Yes, the universe is vast and indifferent, and we are merely specks within it. But, love is powerful. Memory is enduring. In the human heart, one life is big enough to outweigh the silence of the cosmos.*

  My brother hated that. He didn't hate it because he was arrogant. He hated it because he thought it was intellectually dishonest. He thought it conceded the very point it was trying to fight. If you agree that we are specks, you have already accepted a measuring stick that makes human life meaningless. You are trying to argue that a speck can weigh a ton.

  Ramsey's argument, the one my brother loved, was simpler. He said that feeling humbled by the physical size of the universe is a category error. Significance is not a physical property. It does not have mass or volume. You cannot measure a life in lightyears.

  He used to say that his picture of the world was "drawn in perspective, and not like a model to scale." Think of a portrait. If you paint a face, you do not need to paint the entire solar system in the background to be accurate. The size of the canvas does not determine the truth of the expression. To say a human life is small because the universe is large is like saying a map of London is wrong because it doesn't include the Andromeda Galaxy. It's not a model to scale. It's a map of what matters.

  He even joked about the end of the world. He'd say the heat death of the universe is a future cost so heavily discounted that it has almost no present value. Just because the lights will eventually go out doesn't mean the conversation we are having right now is dim.

  I am telling you this because I know many of you are looking for comfort in the idea that he is "part of something bigger" now. That is a kind of comfort. But the comfort he would want us to have is different. It is the comfort of relevance.

  He did not matter *despite* the size of the universe. He mattered because the size of the universe is irrelevant to the things we are feeling right now.

  When I look at the chair he used to sit in, its emptiness is not diminished by the distance of the nearest star. The grief we feel is not a small thing because it is happening on a small planet. It is absolute. It is drawn in perspective. In the perspective of this room, in the perspective of our family, in the perspective of the work he loved, he was not a speck. He was the foreground.

  To pretend otherwise—to shrink him down to fit into a cosmic narrative—is to lose him twice.

  So, I am not going to tell you that his memory is big enough to fill the void. I am going to tell you that the void is not the container we are in. We are here. We are grieving. We are remembering. That is the scale that counts.

  He lived with a fierce attention to the immediate. He listened to you as if you were the only thing happening. He argued with you as if the truth was the only thing that mattered. He lived in perspective. He knew that the value of a moment isn't determined by how many millennia come after it.

  We do not need to make him bigger than he was. We do not need to make him cosmic. We just need to see him clearly, in the right proportion.

  He was twenty-six. He was here. And in the only scale that actually measures value, that is everything.

  Thank you.
