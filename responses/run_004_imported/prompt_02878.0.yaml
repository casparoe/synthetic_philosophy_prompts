  Hey, I'm working on a scene for my novel and could use a hand. Two old grad school friends—one's now a philosophy professor, the other's a divorce lawyer—go out for drinks after a dinner party where their mutual friend Paul was casually awful to his wife all night and seemed completely unbothered by it. The lawyer says something like 'obviously he has a reason to stop treating her like that,' and the professor goes, actually, hold on, maybe not—and starts making the Bernard Williams argument that a reason only exists for someone if there's a sound deliberative route from what they already care about to the action, so if Paul genuinely has zero motivation in that direction, there just isn't a reason there, full stop. The lawyer thinks that's basically a clever trick for letting monsters off the hook. Can you write me their conversation, a real back-and-forth where they actually engage with each other's points instead of just restating their own—neither of them should be easy to refute, there both smart and this isn't their first fight like this. Doesn't need to be crazy long, 500ish words is fine, and it's okay if it ends unresolved, thats usually how it goes with these two after a couple drinks.
