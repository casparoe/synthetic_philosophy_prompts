answer: |-
  The ice in Mark's glass clinked against the side as he set it down. "You're saying he has a reason to stop. I'm saying he doesn't."

  Sarah leaned forward, elbows on the sticky table. "He's married to her. He vowsed to her. Those are reasons. External facts create obligations."

  "Williams would say those are just noises unless Paul can connect them to something in his subjective motivational set," Mark said, rubbing his temple. "Does he care about her happiness? No. Does he care about fairness? Clearly not. Is there a sound deliberative route from what he *does* care about—his own comfort, his ego—to treating her better? No. So there is no reason."

  "That is a convenient piece of metaphysics for every abuser in history," Sarah snapped. "You're telling me if a guy doesn't care about hurting people, he has no reason not to hurt them? That's not philosophy, Mark. That's absolution."

  "It's not absolution. It's accuracy. Saying he has a reason when he doesn't is a category error. It's like saying a stone has a reason to fall. It just falls. If Paul lacks the motivation, telling him he has a 'reason' is a lie. It's magical thinking."

  "It's normative," Sarah countered. "Reasons aren't just psychological descriptions. They're demands. If I tell a judge 'my client didn't feel like respecting the contract,' the judge doesn't say, 'Ah, no internal reason, case dismissed.' The judge says the reason exists whether you feel it or not. Otherwise, how do you condemn him? You can't condemn a man for ignoring a reason that doesn't exist."

  "You condemn him for lacking the right motivations," Mark said. "You try to change his set. You shame him, punish him, hope he develops a fear of consequences or a shred of empathy. Then he has a reason. But right now? Tonight? There was nothing there to grab onto. To say otherwise is to pretend morality has gravity independent of human psychology."

  "Morality *does* have gravity," Sarah said, signaling the bartender. "It's what holds the floor up. If you tell people reasons are only internal, you give them permission to prune their motivations until nothing binds them. Paul treats her like furniture because he knows guys like you will argue it's just a deliberative error."

  "And guys like you pretend shouting 'ought' at a wall will make it feel," Mark shot back. "I'm not letting him off the hook. I'm just saying the hook isn't there. You have to forge it."

  Sarah took the fresh martini, swirling the olive. "Then we're stuck. You want to forge a hook that doesn't exist. I need him to know he's already hanging."

  "Cheers to that," Mark said, lifting his whiskey.

  "Cheers," Sarah said, but she didn't drink.
