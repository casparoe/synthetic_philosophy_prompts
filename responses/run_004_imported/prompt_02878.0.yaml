  Thinking Process:

  1.  **Analyze the Request:**
      *   **Characters:** Two old grad school friends.
          *   Character A: Philosophy Professor (pro-Bernard Williams internal reasons theory).
          *   Character B: Divorce Lawyer (pragmatic, moralistic, believes in external reasons/accountability).
      *   **Context:** Drinks after a dinner party where their friend Paul was awful to his wife and unbothered.
      *   **Core Conflict:** The Lawyer says Paul *has* a reason to stop. The Professor argues (via Bernard Williams) that if there's no deliberative route from Paul's existing motivations, there *is* no reason. The Lawyer thinks this lets monsters off the hook.
      *   **Tone:** Smart, engaged, back-and-forth, not easily refutable, familiar rivalry, unresolved ending.
      *   **Length:** Around 500 words.

  2.  **Deconstruct the Philosophical Argument (Bernard Williams):**
      *   Williams' "Internal and External Reasons" (1979).
      *   Thesis: "A has a reason to $\phi$" is true only if A could reach the conclusion to $\phi$ by sound deliberative reasoning from the motivations in A's "subjective motivational set" (S).
      *   If Paul doesn't care about his wife's happiness, fairness, or social norms, there is no internal reason for him to stop.
      *   External reasons (reasons that exist regardless of motivation) are, for Williams, false or meaningless.
      *   Counter-argument (Lawyer): Moral realism, accountability, social function of reasons. If we say there's no reason, we excuse bad behavior.

  3.  **Drafting - Scene Setting:**
      *   Need a bar setting. Clinking glasses, noise level.
      *   Establish the fatigue from the dinner party.
      *   Jump straight into the argument (they know each other well).

