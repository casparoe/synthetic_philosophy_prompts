answer: |-
  Your intuition is excellent, and your professor's aside points to one of the most fascinating and often under-discussed aspects of late Victorian philosophy. You are quite right to suspect that this is not merely a quirky personal hobby unrelated to Sidgwick's rigorous ethical system. In fact, Henry Sidgwick's involvement with the Society for Psychical Research (SPR) is widely understood by scholars as a direct, deliberate, and philosophically motivated attempt to resolve the "Dualism of Practical Reason" that concludes *The Methods of Ethics*.

  To understand why a man of such scrupulous rationality would spend decades investigating telepathy and séances, we have to look at the specific nature of the crisis Sidgwick identified in moral philosophy and the Victorian epistemological constraints he placed upon himself.

  ### 1. The Dualism of Practical Reason and the Need for a Sanction
  As you noted, the *Methods* ends on a somber note. Sidgwick identifies two self-evident axioms of practical reason:
  1.  **Egoistic Hedonism:** It is rational to aim at one's own greatest happiness.
  2.  **Universal Hedonism (Utilitarianism):** It is rational to aim at the greatest happiness of all sentient beings.

  The problem arises when these two diverge. If sacrificing my own happiness (or life) maximizes the general good, Utilitarianism says I ought to do it, but Egoism says I am irrational to do so. Sidgwick could find no purely philosophical or intuitionist way to prove that one axiom overrides the other.

  Historically, this conflict was resolved by **Theistic Utilitarianism**. If God exists, and if God governs the universe such that virtue is ultimately rewarded with happiness (in an afterlife) and vice punished, then self-interest and duty coincide in the long run. The "sanction" of morality is divine justice.

  However, Sidgwick was an agnostic who had lost his Christian faith (famously documented in his correspondence with Arthur Balfour). He could not simply *assume* the existence of a moral governor of the universe. To do so would be dogmatic, violating his empirical and rationalist standards. But without that assumption, rational morality collapses into a contradiction. As Sidgwick wrote, "The Cosmos of Duty is thus really reduced to a Chaos."

  ### 2. Why Psychical Research? (Evidence vs. Faith)
  This is where the SPR comes in. Sidgwick did not turn to psychical research because he was gullible or seeking spiritual comfort in a sentimental sense. He turned to it because he needed **empirical evidence** to support a metaphysical hypothesis required for ethics.

  **Why not return to faith?**
  Sidgwick valued intellectual honesty above all. He found he could not honestly assent to the creeds of the Church of England. To return to faith without evidence would be, for him, a form of intellectual dishonesty. He needed a basis for belief that was compatible with the scientific naturalism of the late 19th century.

  **Why not a stronger philosophical argument?**
  He believed he had exhausted philosophical argument in the *Methods*. The Dualism was a structural problem, not a logical error he could simply fix. The premise required (a moral order of the universe) is a factual claim about the nature of reality, not a logical truth. Therefore, it requires factual evidence.

  **The SPR as Scientific Inquiry**
  Sidgwick viewed the SPR not as a religious organization, but as a scientific one. In the Victorian era, the boundaries between psychology, physics, and metaphysics were porous. If telepathy or survival after death were real, Sidgwick reasoned, they should be detectable phenomena subject to empirical verification, just like electricity or evolution.

  If the SPR could scientifically prove:
  1.  **Survival of Death:** That consciousness persists after the body dies.
  2.  **Moral Governance:** That there is some order or intelligence guiding these phenomena.

  ...then the "religious hypothesis" would be transformed from a matter of *faith* into a matter of *knowledge*. If science could prove an afterlife where virtue is rewarded, the Dualism of Practical Reason would be resolved. Egoism and Utilitarianism would harmonize because the "long run" extends beyond the grave.

  ### 3. Sidgwick's Own Understanding of the Connection
  Sidgwick was explicit about this connection in his private correspondence and some public writings. He did not view the SPR as a distraction from his philosophy; he viewed it as the necessary empirical supplement to it.

  In a letter to his colleague Frederic Myers (a co-founder of the SPR), Sidgwick indicated that the stakes of their research were nothing less than the foundation of morality. He was not looking for parlor tricks; he was looking for the "divine sanction" that Kant had postulated but could not prove.

  Sidgwick's approach was characteristically cautious. He did not claim the SPR *had* proven these things. Rather, he argued that the *possibility* was significant enough, and the *moral necessity* was great enough, that it warranted rigorous scientific investigation. He famously stated that if the evidence for telepathy or survival were robust, it would be "the most important discovery ever made," precisely because of its ethical implications.

  ### 4. Contemporary Scholarly Consensus
  For a long time, analytic philosophers tended to ignore Sidgwick's psychical research, treating it as an embarrassing eccentricity irrelevant to the *Methods*. However, in the last 30 years, scholarship has shifted dramatically, largely due to the work of biographers and historians of philosophy like **Bart Schultz** (author of *Henry Sidgwick: Eye of the Universe*) and **David Phillips**.

  **The Coherent Extension View**
  The prevailing view among specialists now is that the SPR work is a **coherent extension of his ethical theory**.
  *   **Bart Schultz** argues that Sidgwick's life was a unified project to save rational morality from the corrosive effects of scientific materialism. The SPR was the "laboratory" where he tried to find the facts that would save the *Methods* from its own pessimistic conclusion.
  *   **Roger Crisp**, in his analysis of Sidgwick's ethics, acknowledges that while the psychical research failed to provide the proof Sidgwick hoped for, the motivation was entirely consistent with his philosophical system. It demonstrates Sidgwick's radical commitment to empiricism: he was willing to test *any* hypothesis, no matter how fringe, if it was necessary to ground moral obligation.

  **The Existential Reassurance View**
  Some scholars do acknowledge a psychological element. Sidgwick suffered from deep depression and a sense of cosmic isolation. It is undeniable that he *wanted* the evidence to be true. However, even these scholars generally agree that this desire was not merely for "comfort" but for **rational coherence**. He didn't want to believe because it felt nice; he wanted to believe because without it, his ethical system remained logically incomplete.

  ### 5. Summary: The Tragedy of Sidgwick
  The juxtaposition you found strange is actually the key to understanding Sidgwick's tragic philosophical position.
  *   **The Modern View:** We tend to separate "science" (facts) from "ethics" (values). We might think looking for ghosts to solve ethics is a category error.
  *   **Sidgwick's View:** Ethics depends on facts about the universe (specifically, whether the universe is morally structured). If those facts are unknown, ethics is groundless.

  Sidgwick spent 20 years sitting through séances not because he abandoned his rationality, but because he was **too rational** to accept faith without evidence, yet **too moral** to accept a universe where duty and self-interest are permanently at war.

  Ultimately, the SPR failed to provide the conclusive proof Sidgwick needed. He died without the Dualism being resolved. Contemporary scholars largely view this not as a lapse in judgment, but as a testament to the severity of the Victorian crisis of faith. Sidgwick represents the moment where British moral philosophy realized it could not stand entirely on its own without some metaphysical support, and he was brave enough to go looking for that support in the only place a Victorian empiricist could: the data.

  **Recommendation for your seminar:**
  If you want to pursue this further, look for Bart Schultz's biography *Henry Sidgwick: Eye of the Universe* (2004), specifically the chapters on the SPR. Also, Sidgwick's essay "The Ethics of Religious Conformity" sheds light on his struggle with faith versus honesty, which contextualizes why he needed *evidence* rather than *dogma*.
