counteracts the SSA penalty against a large future population, and on the standard calculation the two effects exactly cancel. In other words, SIA solves the Doomsday problem by showing that humanity's prospects are actually better than Carter's argument suggests. Given that SIA can neutralize SSA's most notorious bullet in this way, while the presumptuous philosopher is a comparatively contrived, exotic scenario, I would say SIA comes out ahead overall."

