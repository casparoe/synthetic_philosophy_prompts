      *   **Synthesis/Reconciliation:** Show how they operate in different domains. Use analogies (legal standing, parenting).
      *   **Nuance/Complication:** Acknowledge where the lines blur (e.g., does standing affect the *force* of the blame?). Mention specific philosophers who address this (Bell, Fritz, Miller, Wallace).
