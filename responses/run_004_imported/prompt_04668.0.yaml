      *   *References:* Mention specific concepts like "normative standing," "speech act theory," "ad hominem," "felcity conditions."
      *   *Cohen:* Specifically address "Casting the First Stone." Cohen argues hypocrisy makes the blame *unjust* or *inappropriate*, not necessarily false.
      *   *Wallace:* Focus on the "moral community" aspect.
      *   *Fritz & Miller:* Their "non-hypocrisy condition" is about the *right* to blame.
      *   *Crucial Point:* Make sure to distinguish between *rejecting the claim* vs. *silencing the speaker*. The fallacy is rejecting the claim *because* of the speaker. The standing literature says we can reject the *blame act* because of the speaker.

