      *   **Homology vs. Analogy:** This is crucial for B&M. Philosophers treat realizers as *analogous* (same job, different stuff). Neuroscientists look for *homologous* structures (same evolutionary origin, similar structure). If we restrict MR to homologous structures, the "multiplicity" drops drastically.
      *   **Local Reductionism:** The goal isn't a "Theory of Everything" mind-brain identity, but local identities (e.g., Human Pain = Human C-fiber firing + context). This saves reductionism where it matters (scientific practice).
