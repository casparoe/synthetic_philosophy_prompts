answer: |-
  This is a classic "rite of passage" problem in metaphysics. You are right to feel that the standard textbook summaries often gloss over *why* the contradiction is inescapable and *what* exactly the New Principle buys us. Since you are leading a reading group, you need to be able to draw the contradiction on the board without fudging the logic, and then offer a candid meta-philosophical assessment of the fix.

  Here is a breakdown designed for a graduate-level presentation, followed by a candid assessment of whether the "Bug" is truly dead.

  ---

  ### Part 1: The Setup (The Triad)

  To show the contradiction, you need to establish the three commitments that form the inconsistent triad.

  1.  **Humean Supervenience (HS) + Best System Analysis (BSA):**
      *   The world is a mosaic of local qualities.
      *   Laws and Chances supervene on the mosaic.
      *   Specifically, the chance function $P_T$ is determined by the system $T$ that best balances simplicity, strength, and fit with the *entire* history of the world (past, present, and **future**).
  2.  **The Principal Principle (PP):**
      *   $C(A \mid X \cdot E) = x$
      *   Where $X$ is the proposition that the objective chance of $A$ is $x$, and $E$ is admissible evidence.
      *   Intuition: If you know the objective chance, your credence should match it (absent inadmissible info).
  3.  **The Possibility of Undermining Futures:**
      *   An "undermining future" $F$ is a possible future history such that, if $F$ were to occur, the *Best System* for the total history (Past + $F$) would be different from the current Best System $T$.
      *   On BSA, this is not just possible; it is probable. (e.g., A long run of heads might make a biased coin theory fit better than a fair coin theory).

  ### Part 2: The Contradiction (The "Big Bad Bug")

  This is where you need to be precise. It is not just "odd"; it is a formal inconsistency.

  **The Derivation:**
  1.  Let $T$ be the current Best System (based on the past and present).
  2.  Let $F$ be an undermining future. By definition, if $F$ occurs, $T$ is **not** the Best System for the total history.
  3.  Therefore, the proposition $T$ (that "$T$ is the true theory of chance") logically entails $\neg F$ (that $F$ does not occur).
      *   *Why?* Because if $F$ occurred, $T$ would be false (it wouldn't be the best system). So $T \rightarrow \neg F$.
  4.  According to the current theory $T$, the chance of $F$ is $x$ (where $x > 0$).
      *   *Note:* The current system $T$ assigns a non-zero probability to its own undermining.
  5.  **Apply the Principal Principle:**
      *   $C(F \mid T) = \text{Chance}_T(F) = x$.
  6.  **Apply Logic:**
      *   Since $T$ entails $\neg F$, $C(F \mid T)$ must be $0$.
  7.  **Result:** $x = 0$. But we assumed $x > 0$. **Contradiction.**

  **Presentation Tip:** Draw this on the board.
  *   Left side: PP says Credence = $x$.
  *   Right side: Logic says Credence = $0$ (because $T$ rules out $F$).
  *   The clash arises because, on Humeanism, the chance fact ($T$) is a *summary* of the whole history, so it contains hidden information about the future that conflicts with the probabilities it assigns.

  ### Part 3: Why "Inadmissibility" Isn't a Fix

  You asked why we can't just rule chance-facts as inadmissible evidence. This is a natural move, but Lewis rejects it for a specific reason.

  *   **The Standard Role of Inadmissibility:** Usually, evidence is inadmissible if it gives you "crystal ball" access to the outcome (e.g., time travel, prophecy). It bypasses the chance process.
  *   **The Humean Problem:** On HS, chance facts *are* facts about the mosaic. They aren't "governing laws" sitting outside the world; they are summaries of the world.
  *   **The Dilemma:**
      *   If you say $T$ is inadmissible evidence, you are saying we cannot condition our credence on the truth of the chance theory.
      *   But the Principal Principle is *supposed* to tell us how to respond to the truth of the chance theory.
      *   If we rule $T$ inadmissible whenever it entails $\neg F$, the PP becomes vacuous for any theory that has undermining futures. Since *all* Humean theories have undermining futures, the PP would never apply.
      *   **Key Intuition:** The problem isn't that we have *extra* evidence (like a crystal ball); the problem is that the chance proposition *itself* is self-defeating. It says "$F$ has chance $x$" but also (by virtue of being the Best System) " $F$ will not happen." You can't fix a self-contradictory statement by calling it "inadmissible."

  ### Part 4: The New Principle (NP)

  Lewis's solution in "Debugged" is to replace the PP with the New Principle.

  **The Formulation:**
  $$C(A \mid T) = P_T(A \mid T)$$

  *   **Old PP:** Conditionalize on the chance value ($X$).
  *   **New NP:** Conditionalize on the *theory* ($T$), and use the chance function *conditionalized on the theory being true*.

  **How it Resolves the Contradiction:**
  1.  We acknowledge that $T$ entails $\neg F$.
  2.  Therefore, the probability of $F$ *given* $T$ is 0. ($P_T(F \mid T) = 0$).
  3.  The NP says our credence should match *that* value.
  4.  So, $C(F \mid T) = 0$.
  5.  **Consistency Restored:** We no longer claim the chance of $F$ is $x$. We claim the chance of $F$ *relative to the hypothesis that $T$ is true* is 0.
  6.  The raw measure $P_T(F)$ can still be $x$. But the *Objective Chance* (the thing that guides credence) is defined as $P_T(\cdot \mid T)$.

  **Intuition for the Group:**
  Lewis is effectively saying: "The Best System gives us a probability measure. But because that System is just a summary of the world, it might be false. The 'Real Chance' is what the System says, *assuming the System is actually the Best System*."

  ### Part 5: Candid Assessment (Is the Bug Dead?)

  Here is where you can offer the philosophical value-add for your group.

  **1. Formal Success:**
  Yes, the New Principle formally resolves the contradiction. The triad {HS, BSA, NP} is consistent. The "Big Bad Bug" is dead in the sense that Humeanism is no longer logically incoherent.

  **2. The Philosophical Cost (The "Relocation" Worry):**
  You asked if this just relocates the problem. In a way, yes.
  *   **Loss of Modal Force:** The original PP captured the idea that chances *govern* credence. The NP makes chance *theory-relative*. It severs the tight link between chance and truth.
  *   **The "Chance of the Theory" Regress:** You worried about the chance of the theory itself. Lewis's answer is candid: **We don't need a chance for the theory; we need a *credence* in the theory.**
      *   The NP tells you how to set credences in outcomes *given* a theory.
      *   Your unconditional credence in the outcome is a weighted average: $\sum C(T_i) \times P_{T_i}(A \mid T_i)$.
      *   There is no regress because we stop at credence ($C$). We don't ask for the "objective chance of the theory."
      *   *Critique:* Some (e.g., Tim Maudlin) argue this admits that Humean "chance" isn't real objective chance. It's just a heuristic device for organizing credence. If chance is just "what the best summary says, assuming it's true," it loses its status as a mind-independent feature of the world.

  **3. The Verdict:**
  *   **For the Humean:** The NP is a lifeboat. It saves the system. Most contemporary Humeans (like Barry Loewer or Ned Hall) accept the NP as the correct principle of chance, even independent of this problem.
  *   **For the Anti-Humean:** The Bug was never really a "bug"; it was a "feature" revealing that Humean chance isn't real chance. The fact that Lewis had to modify the PP (a principle many hold as conceptual truth) to save HS suggests HS is the weak link, not the PP.
  *   **My Candid Take:** The NP puts the *logical* bug to rest, but it leaves a *metaphysical* scar. It concedes that Humean chances cannot be the kind of thing that directly constrains credence in the way we pre-theoretically think they do. They constrain credence only *conditional on the Humean mosaic cooperating*.

  ### Presentation Strategy

  1.  **Start with the Triad:** Get them to agree that HS + BSA + PP seems plausible individually.
  2.  **Derive the Contradiction:** Use the $T \rightarrow \neg F$ step clearly. This is the "aha" moment.
  3.  **Dismiss Inadmissibility:** Emphasize that the chance proposition *itself* is the problem, not external evidence.
  4.  **Explain NP:** Frame it as "Conditionalizing on the Theory's Truth."
  5.  **Open the Floor:** Ask the group: "Is a 'chance' that requires us to conditionalize on its own theory still 'objective' chance?" This shifts the discussion from logic to metaphysics, which is where the real debate lies.

  Good luck. It's a tough paper, but if you can walk them through the $T \rightarrow \neg F$ entailment clearly, you'll have done the heavy lifting.
