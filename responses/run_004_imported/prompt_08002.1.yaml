answer: |-
  ### The Game Matrix

  Consider a normal-form game between Player 1 (Row) and Player 2 (Column). Player 1 has three pure strategies: $T$ (Top), $M$ (Middle), and $B$ (Bottom). Player 2 has two pure strategies: $L$ (Left) and $R$ (Right).

  We specify only the payoffs for Player 1, as Player 2's payoffs are irrelevant to the dominance analysis of Player 1's strategies.

  | | **L** | **R** |
  | :--- | :---: | :---: |
  | **T** | 4 | 0 |
  | **M** | 1 | 1 |
  | **B** | 0 | 4 |

  ---

  ### Analysis of Dominance

  To demonstrate the difference between elimination procedures, we must show that strategy $M$ survives elimination restricted to pure strategies but is eliminated when mixed strategies are considered.

  **1. Failure of Pure-Strategy Domination**
  For a pure strategy to strictly dominate $M$, it must yield a strictly higher payoff against *both* $L$ and $R$.
  *   **Compare $T$ vs. $M$:** $T$ yields 4 against $L$ (better than $M$'s 1), but 0 against $R$ (worse than $M$'s 1). Thus, $T$ does not dominate $M$.
  *   **Compare $B$ vs. $M$:** $B$ yields 0 against $L$ (worse than $M$'s 1), but 4 against $R$ (better than $M$'s 1). Thus, $B$ does not dominate $M$.

  Since neither $T$ nor $B$ dominates $M$, **$M$ survives Iterated Elimination of Dominated Strategies (IEDS) if the procedure is restricted to pure strategies.**

  **2. Success of Mixed-Strategy Domination**
  We now consider a mixed strategy $\sigma$ where Player 1 plays $T$ with probability $p=0.5$ and $B$ with probability $1-p=0.5$. We calculate the expected payoff of this mixture against Player 2's strategies:
  *   **Against $L$:** $0.5(4) + 0.5(0) = 2$.
  *   **Against $R$:** $0.5(0) + 0.5(4) = 2$.

  Comparing the mixture $\sigma$ to the pure strategy $M$:
  *   Against $L$: $2 > 1$.
  *   Against $R$: $2 > 1$.

  The mixed strategy $\sigma$ yields a strictly higher payoff than $M$ regardless of Player 2's choice. Therefore, **$M$ is strictly dominated by a mixed strategy and is eliminated under the standard IEDS procedure.**

  ---

  ### Theoretical Implications

  This example highlights three critical distinctions in rational choice theory:

  **1. The Convexity of Rational Choice**
  Geometrically, the set of feasible payoffs generated by mixed strategies is the **convex hull** of the pure strategy payoffs. In this game, the payoff vector for $M$ $(1, 1)$ lies strictly below the line segment connecting $T$ $(4, 0)$ and $B$ $(0, 4)$. While $M$ is not "beaten" by any single vertex of the hull, it is dominated by the interior of the hull. This implies that a rational agent must consider not just atomic actions, but the entire space of lotteries over those actions.

  **2. Normative Implications for Rationality**
  The example demonstrates that **Pure IEDS is a weaker solution concept than Mixed IEDS.**
  *   **Pure IEDS** assumes an agent compares specific actions against one another. Under this view, playing $M$ is defensible as a "safe" compromise.
  *   **Mixed IEDS** assumes an agent maximizes expected utility over all feasible plans. Under this view, playing $M$ is strictly irrational because there exists a randomization (the 50/50 mix) that guarantees a higher payoff in every state of the world.

  **3. Impact on Strategic Prediction**
  The choice of elimination procedure alters the set of rationalizable strategies. If we rely only on pure-strategy dominance, $M$ remains a viable option for Player 1. A sophisticated Player 2, anticipating this, might play a strategy that is a best response to $M$. However, if Player 2 knows Player 1 is rational in the strong sense (adhering to Mixed IEDS), Player 2 knows $M$ will never be played. This epistemic difference can fundamentally change the equilibrium prediction of the game.
