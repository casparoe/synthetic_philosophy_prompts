answer: |-
  Your intuition is spot-on. Your housemate has essentially reinvented one of the most famous arguments in the history of philosophy, but they are making a category error that cognitive science and contemporary philosophy of mind have spent the last century dismantling.

  You are correct that there is a massive logical gap between **"I had a subjective experience of self without a subjective experience of body"** and **"The self is ontologically distinct from the body."**

  Here is the breakdown of the philosophical move your housemate made, why it feels convincing, and exactly where the logic fails from a cognitive science perspective.

  ### 1. The Historical Move: Cartesian Dualism
  Your housemate's argument is a modern, empirical variation of **René Descartes' *Meditations on First Philosophy* (1641)**.

  Descartes engaged in a methodological "sensory deprivation" of his own (radical doubt). He argued that he could doubt the existence of his body (it might be a dream, or a demon tricking him), but he could not doubt the existence of his thinking self (*Cogito, ergo sum*). From this, he concluded that the mind (*res cogitans*) must be a different substance than the body (*res extensa*), because if they were the same thing, you couldn't conceive of one without the other.

  In philosophy, this is often called the **Argument from Conceivability** or Leibniz's Law (the Indiscernibility of Identicals). The logic is:
  1.  I can conceive of my self existing without my body.
  2.  If $X$ and $Y$ are identical, they must share all properties.
  3.  Therefore, Self $\neq$ Body.

  The float tank experience feels like "proof" because it turns a thought experiment into a phenomenological reality. You *actually* conceived of (and experienced) self without body.

  ### 2. The Gap: Phenomenology vs. Ontology
  The critical flaw in your housemate's reasoning is conflating **phenomenology** (how things appear to consciousness) with **ontology** (what actually exists).

  Just because the *representation* of the body disappears from your conscious model does not mean the *physical substrate* generating that model has been transcended.

  **The Analogy:**
  Imagine you are playing a VR game. Suddenly, the graphics card fails to render your avatar's hands. You still see the world, and you still feel like "the player," but you have no visual representation of hands.
  *   **Housemate's conclusion:** "This proves the Player is not part of the Computer."
  *   **Reality:** The Player is still entirely dependent on the Computer. The "hands" were just a user-interface rendering. When the input data stopped (float tank), the UI hid the hands. But the software (self-model) is still running on the hardware (brain/body).

  ### 3. The Cognitive Science Explanation
  As a CogSci PhD, you know that "awareness" is a computational process, not a mystical gaze. Here is how we explain the float tank experience without invoking a soul:

  **A. Dissociation of Self-Models**
  Neuroscience suggests there isn't one "self." There are at least two distinct mechanisms that usually bind together:
  1.  **The Bodily Self (Minimal Self):** Rooted in multisensory integration (vestibular, proprioceptive, tactile). Key area: **Temporoparietal Junction (TPJ)**. This tells you where your body ends and the world begins.
  2.  **The Narrative Self (Autobiographical Self):** Rooted in memory, planning, and self-referential thought. Key area: **Default Mode Network (DMN)**.

  In a float tank, you starve the TPJ of data. Without proprioceptive or tactile error signals, the brain minimizes prediction error by dropping the body model (similar to the "rubber hand illusion" but in reverse). However, the DMN is largely internal and generative; it doesn't need external sensory input to keep churning out "I am thinking/feeling/existing."
  *   **Conclusion:** You didn't separate self from body; you separated the *narrative self-network* from the *bodily self-network*. Both are still neural processes within the body.

  **B. The "Anosognosia" Counter-Example**
  There are patients with lesions (often to the right hemisphere) who suffer from **asomatognosia** or **somatoparaphrenia**. They explicitly deny that their limbs belong to them. One famous patient claimed his paralyzed leg was "someone else's leg" or that he didn't have a body at all.
  *   Does this prove those patients have souls distinct from their bodies? No. It proves that brain damage can disrupt the *sense* of bodily ownership.
  *   If brain damage can remove the sense of body, then the sense of body is dependent on the brain. If the sense of body is dependent on the brain, its absence doesn't prove the mind is independent of the brain.

  **C. The Homunculus Fallacy**
  Your housemate's argument relies on a hidden assumption: that there is a "little man" inside your head (the self) looking at the screens. If the screens go dark (no body), the little man is still there.
  But in CogSci, the "little man" is the thing that needs explaining. The "I" that feels certain it exists is itself a constructed simulation. The fact that the simulation persists without body data just means the simulation is robust, not that it is non-physical.

  ### 4. Why "Distinct" Doesn't Mean "Soul"
  Even if we grant that the *functional state* of "self-awareness" can be distinct from the *functional state* of "body-awareness," that is a functionalist distinction, not a substance dualist one.

  Software is distinct from hardware in a logical sense (you can describe the code without describing the silicon), but the software cannot *run* without the hardware. Your housemate is arguing that because the software interface doesn't show the hardware status, the software must be magical.

  ### 5. Summary for your Housemate
  You can tell your housemate they have independently derived **Cartesian Substance Dualism**, which was the dominant view in the 17th century but is largely rejected in contemporary philosophy of mind and cognitive science for the following reasons:

  1.  **The Illusion Argument:** The absence of evidence (body sensation) is not evidence of absence (body existence). The brain creates a model of the body; when the model is suppressed, the body still exists.
  2.  **Neural Dependence:** The "self" that remained aware was still dependent on oxygenated blood, glucose, and neural firing rates. If the body died, that "self" would vanish instantly.
  3.  **The Category Error:** They are confusing the *map* (phenomenological experience) with the *territory* (metaphysical reality).

  **The Verdict:**
  The float tank proves that the **sense of embodiment** is contingent on sensory input. It does not prove that the **sense of self** is independent of the brain. It is a fascinating demonstration of neural modularity, not metaphysical dualism.

  (Also, as a side note: In Buddhist philosophy, which deals extensively with meditation states similar to float tanks, the conclusion is actually the opposite. They argue that if you look closely at that remaining "I" in the dark, it *also* dissolves upon inspection, leading to *Anatta* or "no-self." So even spiritually, your housemate might be stopping too soon!)
