      *   *What is it?* A sentence of the form "P and I don't believe that P."
      *   *Why is it paradoxical?* It's not logically contradictory (P can be true, and I can fail to believe P). However, it is *pragmatically* contradictory or absurd to *assert*.
      *   *Key Distinction:* Logic (truth conditions) vs. Pragmatics (speech acts/assertion conditions).
      *   *The "Knowledge" Variant:* "I know P, but I don't believe P." This is stronger because standard epistemology defines Knowledge as Justified True Belief (JTB). If you know P, you *must* believe P. So "I know P but don't believe P" is actually logically contradictory under the JTB definition, whereas "It is raining but I don't believe it" is only pragmatically absurd.
      *   *Psychological Reality:* Denial is real. People hold conflicting cognitive states. But can they *assert* them coherently?

