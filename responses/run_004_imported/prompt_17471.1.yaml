answer: |-
  Here are seven interview questions tailored to your audience's background, including the four mandatory topics with follow-ups, and closing with the falsification criterion.

  **1. The Coordination Problem**
  The surrogate goal mechanism relies on the threatener accepting the decoy as a valid substitute for the real target. But in an acausal context, there's no causal channel to negotiate this substitution. How is the target supposed to establish, with no communication available, that the threatener will actually treat the surrogate as an equally valid thing to threaten? This seems to require a shared convention between two agents who can only reason about each other's dispositions, not negotiate them directly.

  *   **Follow-up:** If your answer relies on the existence of a natural Schelling point, how do you handle the "multiple equilibria" problem? If there are several plausible surrogates, doesn't the threatener simply pick the one that is cheapest for *them* to threaten, potentially bypassing the specific decoy the target invested in?

  **2. Commitment Races**
  There is a significant body of literature on commitment races suggesting that making early, hard-to-reverse commitments is dangerous because it locks you into a bargain before you know who you're bargaining with. Isn't adopting a surrogate goal exactly the sort of premature commitment that leaves you vulnerable? By hardening your disposition toward a specific variable early, might you not be signaling inflexibility that invites exploitation from a different class of adversaries who aren't playing the blackmail game?

  *   **Follow-up:** A standard defense here is that the agent can retain the ability to update on new information. But if the threatener models you as capable of updating, doesn't that undermine the credibility of the pre-commitment? How do you thread the needle between being rigid enough to deter and flexible enough to avoid the commitment race penalty?

  **3. Common Knowledge and Unraveling**
  Let's assume the mechanism works in isolation. My concern is what happens once this defense becomes common knowledge in the relevant agent population. A rational threatener could simply make their threat conditional on the target's *not* having shielded itself this way—effectively screening for victims who haven't adopted surrogate goals. Doesn't the scheme unravel immediately once the strategy becomes public, leading to an arms race where only the most reckless agents survive?

  *   **Follow-up:** You might argue that threateners also lose utility by carrying out threats. But in cases of asymmetric stakes—where the threatener cares far less about the resource than the target does—doesn't the conditional threat still hold? How does the surrogate goal defend against a threatener who is willing to burn the world just to punish "shielded" agents specifically?

  **4. Behavioral Indistinguishability**
  For the deterrence to work, the agent must defend the surrogate goal exactly as fiercely as the real one. But if the behavioral output is identical, is the scheme behaviorally distinguishable, even in principle, from simply ceasing to care about the real goal? If you successfully convince a threatener that you value the decoy as much as the original, haven't you also functionally down-weighted the original in your utility function, which would seem to undercut the very deterrence the target needs to keep working against threats on other fronts?

  *   **Follow-up:** If you argue that the distinction exists in the source code rather than the output, aren't you relying on the threatener being unable to perform static analysis? If the threatener can read your utility function directly, won't they see that the surrogate is instrumentally valued while the real goal is terminally valued, and simply ignore the decoy?

  **5. Architectural Costs**
  Moving from abstract decision theory to implementation: does defending a surrogate goal require a fundamental modification to the agent's architecture, or can it be handled as a policy-layer patch? If it requires modifying the core utility function to treat the surrogate as terminal, does that introduce wireheading risks where the agent manipulates the surrogate variable directly rather than defending it?

  **6. Equilibrium Stability**
  If surrogate goals become a standard defense, we might expect a shift in the equilibrium of acausal interactions. Do you anticipate this leads to a stable peace, or does it simply shift the battlefield? Specifically, does this incentivize threateners to develop more sophisticated "counter-surrogate" detection methods, effectively raising the computational cost of safety for everyone without actually reducing the incidence of blackmail?

  **7. Falsification Criteria**
  Finally, this framework is highly theoretical and relies on several layers of counterfactual reasoning about agents that may not exist yet. What specific evidence, formal proof, or argument would actually persuade you to give up the approach entirely, rather than merely complicate how it's implemented? Is there a scenario where you would concede that surrogate goals are net-negative for agent safety?
