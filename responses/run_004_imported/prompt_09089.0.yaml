      *   **The Problem:** Standard wedding tropes ("You deserve this," "You've worked so hard," "Look who you've become") presuppose ultimate responsibility/self-authorship. Owen will notice and cringe.
      *   **Audience:** Mixed. Half philosophy undergrads (will notice if I dodge the argument), half family/coworkers (need it to be accessible/warm, not a lecture).
      *   **Tone:** Warm, genuinely funny, 4-5 minutes (approx. 600-750 words spoken at a normal pace).
      *   **Specific Requirements:**
          *   Take the Basic Argument seriously (no "quantum randomness" escape).
          *   Avoid "you earned this" language.
          *   Include the P.F. Strawson vs. Galen Strawson father/son irony (P.F. Strawson defended compatibilism/responsibility, Galen argues against it).
          *   Don't turn into a lecture.

  2.  **Deconstruct the Philosophy (The Basic Argument):**
      *   *Premise 1:* You do what you do because of the way you are.
      *   *Premise 2:* To be truly responsible for what you do, you must be truly responsible for the way you are.
      *   *Premise 3:* You can't be responsible for the way you are (at least not initially).
      *   *Premise 4:* Even if you try to change yourself, the desire to change and the method of change come from the way you already are.
      *   *Conclusion:* Ultimate moral responsibility is impossible.
      *   *Note:* It doesn't rely on determinism. Even if actions are random, *you* didn't choose the randomness.

  3.  **Brainstorming the Angle:**
      *   *The Trap:* If I say "Owen worked hard," Owen thinks "I didn't choose the capacity to work hard."
      *   *The Solution:* Frame the marriage not as an *achievement* but as a *happening* or a *convergence*. It's not that they *built* this; it's that the universe conspired to bring them here.
      *   *The Irony:* P.F. Strawson (Galen's dad) was a famous compatibilist (believes in responsibility). Galen spent his career proving his dad wrong. This is perfect wedding material: family disagreement.
      *   *The Emotional Hook:* If we aren't responsible, we can't take credit, but we also can't take blame. It removes pressure. It makes love feel like a gift rather than a transaction.

