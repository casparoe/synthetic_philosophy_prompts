answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct honor of being Owen's Best Man. I also have the distinct panic of being Owen's Best Man.

  Because writing this speech presented a unique logistical challenge. Usually, a best man speech relies on certain foundational assumptions. You talk about how the groom *worked hard* to become a good man. You say the couple *deserves* this happiness. You say they *built* this life together through the *choices* they made.

  And then you remember you're talking to Owen.

  For the uninitiated, Owen wrote his senior thesis on Galen Strawson's "Basic Argument." For the philosophy cohort in the back: yes, I know the regress. For everyone else: basically, Owen believes that to be truly responsible for your actions, you have to be responsible for the way you are. But you can't choose your initial nature. And even if you try to change your nature, the desire to change comes from your existing nature. So, you can never be the ultimate author of yourself.

  He's the guy at parties who gently ruins a compliment by explaining that you didn't *choose* to be the kind of person who likes that compliment. He is, as you can imagine, a absolute blast at celebrations.

  So, I had a problem. If I tell Owen he "worked hard" to find [Partner's Name], he'll mentally correct me to say, "I was causally determined to pursue her based on prior psychological states I did not select." And he's right.

  And before Owen interrupts me: no, quantum randomness does not save you. Just because the universe is indeterminate doesn't mean *you* are controlling the randomness. You're still not the author.

  But here is the thing I've realized while panicking over this speech: Owen's grim view of moral responsibility is actually the most romantic thing in the world.

  Because if Owen is right, then he didn't *choose* to love [Partner's Name]. He couldn't have. That implies there was a version of Owen that could have done otherwise. Instead, given the way Owen is—given his history, his brain, his specific, wonderful quirks—and given who [Partner's Name] is, this outcome was, in a very real sense, inevitable.

  He didn't earn her. He didn't build this. It just… happened. Like gravity. Like weather. It is a fact of the universe that these two belong together. And there is no pressure in that. There is no ego. There is just the relief of recognizing what is true.

  It reminds me of the ultimate family feud. Owen's intellectual hero is Galen Strawson. But Galen's father was P.F. Strawson—one of the most famous philosophers of the 20th century. And P.F. Strawson spent his career defending the exact opposite view. He argued that our ordinary human practices of holding each other responsible are valid and necessary.

  So, Galen spent his life proving his dad wrong. And honestly, looking at Owen and [Partner's Name], I think that's the real lesson here. You don't choose your family, you don't choose your intellectual inheritances, and you certainly don't choose who you fall in love with. You just find yourself in the middle of a story you didn't write, standing next to someone you can't imagine living without.

  Owen, you say we aren't responsible for who we are. But I look at you, and I see someone who is kind, and loyal, and deeply happy. And [Partner's Name], you look at him, and you don't see a collection of causal chains. You see your husband.

  So, I am not going to toast to your hard work. I'm not going to toast to your choices.

  I am going to toast to the luck of the draw. I'm toasting to the fact that in a universe of infinite regress and unchosen natures, your paths converged. I'm toasting to the fact that you didn't have to author this love to feel it.

  Ladies and gentlemen, if you would please raise your glasses.

  To Owen and [Partner's Name]. May you never be ultimately responsible for anything… except the happiness you inevitably bring to each other.

  To the bride and groom.
