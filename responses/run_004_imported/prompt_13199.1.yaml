answer: |-
  **Characters:**
  *   **Carla:** Committed Lewisian Counterpart Theorist.
  *   **Kris:** Defender of Kripkean Transworld Identity.

  **Setting:** *After a graduate seminar on modal metaphysics.*

  **Kris:** Look, Carla, I know Lewis's system is elegant, but the Humphrey objection kills it for me. When we say, "Humphrey could have won the election," we mean *Humphrey*—this very man—had the potential to win. On your view, Humphrey is world-bound. He loses here. Some other guy, a "counterpart" in another world, wins. But why should Humphrey care about some other guy? It makes modal claims irrelevant to the actual subject.

  **Carla:** I get why it feels cold, Kris, but you're assuming that for Humphrey to care, the winner must be numerically identical to him. But think about what we're *doing* when we make that claim. We aren't trying to transport Humphrey's soul to another dimension. We are evaluating a proposition about *possibilities for Humphrey*.

  **Kris:** But if it's not him, it's not a possibility *for him*. It's a possibility for the counterpart.

  **Carla:** Not if you understand the semantics correctly. When you say "Humphrey could have won," the name "Humphrey" doesn't rigidly designate a transworld traveler. It picks out the actual individual, and the modal operator shifts the context to evaluate similar individuals in other worlds. Humphrey should care because the counterpart relation *constitutes* what we mean by "Humphrey's possibilities." There is no further fact of the matter about "Humphrey himself" being in another world. If you demand that, you're asking for a metaphysical mystery. The counterpart *represents* Humphrey. If representation is good enough for art, politics, and language, why isn't it good enough for modality? Humphrey cares because that other guy is the best stand-in for him that exists in the space of possibilities.

  **Kris:** That's a nice semantic dodge, but it doesn't solve the metaphysical cost. You save Humphrey's relevance by chopping him into world-bound slices. But that leads me to my real worry about your view: it's the only way you avoid the contradiction I'm stuck with. If I say it *is* Humphrey in both worlds, how do I handle accidental intrinsics?

  **Carla:** Exactly! If Humphrey is literally identical across worlds, then in World A he is straight-backed, and in World B he is bent-backed. If it's the *same* Humphrey, then one object has incompatible intrinsic properties. He is both straight and bent. That's a contradiction, plain and simple. You can't just say "he's straight here and bent there." If he's literally identical, he carries his properties with him.

  **Kris:** Hold on, you're assuming properties are monadic relations that an object holds *simpliciter*. I deny that. An object doesn't just "have" a shape; it has a shape *relative to a world*.

  **Carla:** Ah, the "world-indexed properties" move. "Bent-at-W2." But Lewis showed that's just changing the subject. Being "bent-at-W2" isn't an intrinsic shape property; it's a relational property. You've solved the contradiction by denying that Humphrey actually *is* bent in any robust sense. You've turned intrinsic properties into relations to worlds.

  **Kris:** I'm not denying he's bent. I'm denying your assumption that "being bent" is a property that exists in a vacuum. Think of worlds not as distant planets, but as stipulative conditions. When we say "Humphrey is bent in W2," we aren't saying Humphrey stands in a relation to a container called W2. We are saying: *In the way things could have been (W2), Humphrey is bent.*

  **Carla:** But if Humphrey is wholly present in W2, and wholly present in W1, he's still one thing with two shapes.

  **Kris:** No, because "Humphrey" in the modal context isn't a naked substratum. He is an object whose identity is primitive, but whose properties are always manifested under a description of a world. The contradiction ($F(x) \land \neg F(x)$) only arises if you strip away the world index. But in modal metaphysics, you *can't* strip the index. There is no "Humphrey simpliciter" who is both straight and bent at the same time and in the same respect. The "respect" here is the world. So, relative to W1, he is straight. Relative to W2, he is bent. Since W1 $\neq$ W2, there is no contradiction. I don't need to slice Humphrey into counterparts to save the Law of Non-Contradiction. I just need to acknowledge that having a property is a three-place relation: Object, Property, World.

  **Carla:** So you're willing to make all intrinsic properties relational just to save transworld identity?

  **Kris:** I'm willing to acknowledge that modality is part of the fabric of how objects possess properties. You slice the object to save the property's monadic nature. I keep the object whole and acknowledge the property's modal context. It seems to me that preserving the intuition that *Humphrey himself* could have won is worth treating "bent" as world-relative.

  **Carla:** And it seems to me that preserving the intuition that "bent" is a genuine shape, not a relation, is worth accepting that Humphrey himself stays home and sends a representative.

  **Kris:** *[Laughs]* Well, at least we agree the seminar wasn't a waste.

  **Carla:** Humphrey would have thought so. In some world, anyway.
