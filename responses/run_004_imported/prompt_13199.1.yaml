prompt: |-
  So in my modal metaphysics seminar this week we covered Lewis's counterpart theory vs the more Kripke-ish view where things are literally identical across worlds, and I feel like I only halfway get how each side is suppose to handle the other's best objection. Could you write me a short dialogue between a committed counterpart theorist and someone defending genuine transworld identity? I want the transworld identity person to press the counterpart theorist with the "Humphrey" complaint (that on counterpart theory, when we say Humphrey could've won the election, we're really just talking about some other guy who merely resembles him, so why should Humphrey care), and I want the counterpart theorist to actually answer that instead of just repeating that counterparts are picked out by similarity. Then flip it: have the counterpart theorist push the accidental intrinsics problem (the bent-vs-straight-Humphrey thing) back at the transworld identity view, and make that person really try to solve it instead of just biting the bullet. Basically I want them responding to each other's specific point each time, not just each restating their own position back and forth.
