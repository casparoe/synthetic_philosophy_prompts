      *   **Key Requirement 3:** Counterpart Theorist must raise the "Accidental Intrinsics" problem (bent vs. straight).
      *   **Key Requirement 4:** TWI defender must *answer* the Accidental Intrinsics problem substantively (not just bite the bullet).
      *   **Constraint:** They must respond to each other's specific points, not just talk past each other.

  2.  **Deconstruct the Arguments:**

      *   **The Humphrey Objection (against CT):** If I say "Humphrey could have won," CT says "A counterpart of Humphrey won." But Humphrey doesn't care about some other guy in another world. It makes modal claims irrelevant to the actual subject.
      *   **CT's Potential Response:** Needs to explain *why* the counterpart relation matters. Usually, this involves analyzing what "de re" modal claims mean. It's not about *other* people; it's about how *we* talk. The "could have" statement is analyzed as existence of a counterpart. Humphrey cares about *his* possibilities, and his possibilities are constituted by his counterparts. Or, a more pragmatic/semantic defense: "Humphrey" in the mouth of a speaker picks out a world-bound individual, but the *content* of the modal claim is about the network of counterparts.
      *   **The Accidental Intrinsics Objection (against TWI):** If Humphrey is literally identical across worlds, he is straight in $W_1$ and bent in $W_2$. How can one object have incompatible properties? (The Problem of Temporary Intrinsics applied modally).
      *   **TWI's Potential Response:** Needs to avoid saying "He's straight-at-W1 and bent-at-W2" if that's seen as just relabeling. The standard Kripkean move is often to treat properties as world-indexed or to deny that objects have properties simpliciter but only relative to worlds. Or, adopt a "nuclear/extranuclear" distinction (Meinongian-ish, but Kripke doesn't do that). A better Kripkean response is to insist on the distinction between an object and its *manifestations* or to treat world-indexing as a genuine solution to the logical contradiction (relational view of properties). Let's go with the "Indexical/Relational Properties" defense, but make it robust.

  3.  **Drafting - Character Conception:**
