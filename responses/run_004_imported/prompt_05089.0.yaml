answer: |-
  **Setting:** *Prague, 1602. A study cluttered with ephemerides, globes, and half-eaten bread. The only light comes from three tallow candles, sputtering in the draft. Outside, the Vltava is a dark ribbon. Inside, JOHANNES KEPLER (31) is rubbing ink-stained fingers against his temples. Across the table, MASTER HILDESHEIM (50s), a practiced caster of nativities, is dipping a quill with aggressive precision.*

  **HILDESHEIM:** You've crossed out the Ascendant again.

  **KEPLER:** I have adjusted it to the true horizon, not the table-house system. The cusps are wrong, Master Hildesheim. They divide the sky like a butcher dividing a carcass. The soul does not live in twelve equal rooms.

  **HILDESHEIM:** The soul lives where the ancients put it. In the signs. In the domiciles. You have Mars in the twelfth house, but you've ignored that it is in Cancer. Mars in Cancer is in its fall. It is weak. It is watery. If you ignore the sign, you ignore the nature of the fire.

  **KEPLER:** (Snapping) Mars is a body of fire regardless of which constellation of stars happens to be behind it from our vantage point! The stars are fixed lanterns, Hildesheim. They do not govern. They do not rule. To say Mars is "weak" because it is near the Crab is poetry, not physics.

  **HILDESHEIM:** It is not poetry, it is observation. Two thousand years of nativities say otherwise. But fine. Discard the signs. Discard the rulerships. Tell me, Johannes, how do you intend to tell the Baron whether his wife will bear a son or a daughter? By counting the degrees?

  **KEPLER:** By the light. By the geometry.

  **HILDESHEIM:** (Leaning forward, quill hovering) Geometry. This is your new god. So. Explain this to me before the Baron comes banging on that door. You say the Zodiac is arbitrary. A human fence built around the ecliptic. I grant you that the Babylonians drew the lines. But you keep the Aspects. The Trine. The Square. The Opposition.

  **KEPLER:** Naturally.

  **HILDESHEIM:** Why? Who drew those lines?

  **KEPLER:** No one drew them. They *are*.

  **HILDESHEIM:** A sextile is sixty degrees. A square is ninety. Why is sixty harmonious and fifty-five nothing? You call the signs arbitrary bookkeeping, and I agree they are man-made divisions. But a degree is a man-made division of a circle! If you chop the sky into thirty-degree slices, it is arbitrary. If you chop it into sixty-degree slices, it is... what? Holy?

  **KEPLER:** (Stands, pacing the small room) It is not about the slice. It is about the ratio. Look at the lute. (He gestures to an instrument in the corner). If you pluck a string, it sings. If you halve the length, it sings the octave. It is not a human convention that the ratio 1:2 produces harmony. It is in the nature of vibration. It is in the nature of the soul.

  **HILDESHEIM:** We are talking about planets, not lutes. Saturn is not a string.

  **KEPLER:** Is it not? Light flows from the planets. When two planets form a geometric angle, their rays meet at the Earth. If that angle corresponds to a constructible polygon—a triangle, a square, a hexagon—the rays resonate. They create a concord. The soul of the newborn, Hildesheim, the moment it takes its first breath, *perceives* this geometry. It does not see the Crab or the Lion. It feels the harmony.

  **HILDESHEIM:** (Scoffs) The newborn baby feels the hexagonal resonance of Jupiter and Venus?

  **KEPLER:** Not with eyes. With the *facultas imaginativa*. The imprint is immediate. Like a stamp in wax.

  **HILDESHEIM:** Then you admit it is an imprint. A physical cause.

  **KEPLER:** A metaphysical cause triggered by physical geometry.

  **HILDESHEIM:** (Taps the parchment hard) Then answer the trap, Johannes. You say the Zodiac signs are arbitrary because they are cultural. The Babylonians chose the Ram. The Indians might have chosen the Elephant. But the aspect... the aspect relies on the degree. And the degree is a human measure. We divided the circle into 360 parts. Why not 400? Why not 100? If you change the number of degrees in a circle, your "holy" sextile changes its number. Therefore, the aspect is just as dependent on human bookkeeping as the Sign of the Ram.

  *Kepler stops pacing. He looks at the candle flame, then back to Hildesheim. He smiles, a thin, tired expression.*

  **KEPLER:** You confuse the measure with the thing measured.

  **HILDESHEIM:** Elaborate.

  **KEPLER:** We could divide the circle into ten thousand units. The number would change. But the *shape* would not. A triangle is a triangle whether you call the corner ninety degrees or a hundred gradians or "one right angle." The ratio of the arc to the whole remains constant. The geometry exists independent of the numbering system.

  **HILDESHEIM:** And the Sign of Aries?

  **KEPLER:** Aries is a patch of stars. It has no shape. It is a smear of light. The boundary between Aries and Taurus is a line drawn in ink by a man who died three thousand years ago. There is no physical discontinuity in the sky at that point. The light does not change. The ray does not change. But the angle... the angle is a relationship. It is pure form. God is a geometer, Master Hildesheim. He did not draw pictures of animals in the stars. He wove the orbits in ratios.

  **HILDESHEIM:** So you strip the astrology of its language. No "Mars is angry." No "Venus is loving." Just... angles? Cold mathematics? How do you predict temperament with cold math?

  **KEPLER:** Because the soul *is* mathematical! That is your error. You think the soul is a mist that reacts to poetic symbols. I tell you the soul is a mirror that recognizes divine order. When the soul enters the body, and the rays of the planets strike the earth at a square, the soul shudders. It recognizes the tension of the 3:4 ratio. That shudder *becomes* the temperament. It becomes the "anger" you attribute to Mars. You describe the shadow on the wall; I am describing the object casting it.

  **HILDESHEIM:** (Silence for a moment. He dips the quill, wipes excess ink.) You walk a razor's edge, Johannes. The Church says the stars do not compel. The traditionalists say the stars compel through the signs. You say the stars compel through... music?

  **KEPLER:** I say the stars do not compel. They *incline*. Through harmony. I am saving astrology from the superstitions of the marketplace so that it may stand beside astronomy. If we keep telling patrons that a Dragon eats the Moon during an eclipse, we will be laughed out of the Emperor's court. If we tell them the luminaries are in syzygy and the ratios are tense... they may listen.

  **HILDESHEIM:** The Baron will not know what "syzygy" means. He wants to know if his harvest will fail.

  **KEPLER:** (Sitting back down, picking up his own quill) Then give him the harvest. Use your signs. Fill in the houses. Tell him about the Dragon if it soothes him.

  **HILDESHEIM:** And you?

  **KEPLER:** I will calculate the aspects. I will ensure the angles are true to the minute. If your signs say "prosperity" but my aspects show a grand cross of Saturn and Mars... I will mark it.

  **HILDESHEIM:** You'll contradict me on the parchment.

  **KEPLER:** I will write the truth as I see it. You write the truth as the ancients saw it. Let the Baron decide which truth serves him better.

  **HILDESHEIM:** (Shaking his head, returning to the chart) You are a heretic to the Chaldeans and a sorcerer to the Priests.

  **KEPLER:** And you are a scribe to a ghost. We are both stuck in this room, Hildesheim. The ink is the same.

  **HILDESHEIM:** (Scratching the quill against the paper) The Baron is waiting. Give me the conjunction of the Sun and Mercury.

  **KEPLER:** (Leaning in, pointing to a calculation) Here. 14 degrees Taurus. But look at the angle to Saturn. It is not a trine. It is 118 degrees. It is orb-adjacent to the square. The harmony is broken.

  **HILDESHEIM:** (Pauses) 118... That is close enough to the square. I will note the tension. But I am keeping the Taurus.

  **KEPLER:** Keep the Bull, if you like. Just do not ask me to believe it is anything more than a cloud of dust.

  **HILDESHEIM:** And do not ask me to believe the baby feels a triangle.

  *Kepler blows on the wet ink to dry it. The smoke curls up, mingling with the candle smoke.*

  **KEPLER:** Time will tell which of us is listening to the sky, and which of us is only hearing ourselves speak.

  **HILDESHEIM:** Time tells nothing. It is the astrologer who speaks for Time. Hand me the sand, Johannes. The patron is coming.

  *Kepler passes the hourglass. They work in silence for a moment, two men drawing maps of the same territory, using different legends.*
