      *   *Clarify $P(H|D)$.* Bayes factors give evidence *for* one model over another, not necessarily the direct probability the hypothesis is "true" in an absolute sense, though it's closer than a $p$-value.
      *   *Mention "Prior Sensitivity".* If I pick a weird prior, I can get a weird result. This is analogous to p-hacking.
      *   *Mention the "Garden of Forking Paths".* Even with Bayes, if you analyze data 20 ways and pick the best one, you have a problem.

