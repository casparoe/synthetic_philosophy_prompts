      *   **Causal Decision Theory (CDT):** Focuses on the causal consequences of actions. Since Death's prediction was made *yesterday*, my choice *today* cannot causally influence where Death went. Therefore, I should choose the action that yields the best outcome given the fixed state of the world. If I prefer Aleppo to Damascus, I go to Aleppo. The correlation is spurious/common-cause.
      *   **Evidential Decision Theory (EDT):** Focuses on what the action *indicates* about the state of the world. If I choose Aleppo, that is strong evidence that Death predicted Aleppo, so I die in Aleppo. If I choose Damascus, that is evidence Death predicted Damascus. Since both lead to death (if Death is perfect), the agent gets stuck in a loop. To escape, EDT agents often look for mixed strategies or question the setup.
      *   **The "Death in Damascus" Problem:** Specifically highlights the instability of EDT. If you decide to go to Aleppo, you expect Death there, so you should stay. If you decide to stay, you expect Death there, so you should go.
