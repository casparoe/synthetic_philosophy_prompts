      *   *Section 3: Modifying the Game, Not Just Outcomes.* SPI often involves changing the strategy space (commitment devices). The safety guarantee must hold across the uncertainty.
      *   *Section 4: Why it's hard.* It requires finding a subset of strategies that dominates the default *universally* across possible types. This is mathematically restrictive.
      *   *Conclusion:* Summarize. "Safe" = "Robust to Private Information."

  5.  **Refining the "Safe" Definition based on Oesterheld/Conitzer papers:**
