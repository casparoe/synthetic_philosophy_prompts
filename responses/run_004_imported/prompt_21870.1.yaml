      *   *Correction:* In the specific SPI literature, the focus is often on **isomorphism**. The agents agree to play a *surrogate game* that is structurally similar to the original but removes the conflict strategies.
      *   *The "Safe" condition:* The mapping between the original game and the surrogate game must preserve preferences *ordinally* without needing to know the *cardinal* values or private types.
      *   *Key distinction:* It's not just about uncertainty; it's about avoiding the need to disclose private info to verify the PI. A standard PI requires verifying everyone is better off. Verification requires disclosure. SPI finds a change where verification is *unnecessary* because the structure guarantees it.
      *   *Revised Explanation:* The "Safe" refers to **verification without disclosure**. In standard PI, to *know* it's a PI, you need to check utilities. In SPI, you want to *know* it's a PI *without* checking utilities (because that leaks info). So "Safe" means "Guaranteed to be a Pareto Improvement even if we don't look at the specific utility values."

      *   *Wait, let's look closer at the Oesterheld definition.*
      *   From "Safe Pareto Improvements for Delegated Game Playing" (2021): "We call a modification of the game a safe Pareto improvement (SPI) if it is guaranteed to lead to a Pareto improvement over the default outcome, without requiring the agents to have common knowledge of their utility functions."
      *   *Okay, that's the key.* Standard PI: "Is outcome B better than A?" (Requires knowing utilities). SPI: "Can we change the rules such that B is *guaranteed* to be better than A *regardless* of the specific utilities (within a class)?"
