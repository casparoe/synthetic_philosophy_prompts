          *   *Risk:* If I cooperate and you defect, I lose badly.
          *   *SPI:* We change the rules (e.g., bind ourselves to a third party) such that cooperation is enforced *and* we know that even if our estimates of each other's pain thresholds are wrong, we still do better than the default fight.
      *   **Technical Nuance (The "Work" the word does):**
          1.  **Incomplete Information:** Standard PI assumes known utility functions. SPI assumes private types.
          2.  **Ex-ante vs. Ex-post:** Standard PI is often ex-post (looking at outcomes). SPI is often about the *mechanism* guaranteeing ex-ante safety without revealing types.
          3.  **The Default Point:** Safety is relative to a specific default equilibrium (usually the Nash equilibrium of the original game).

