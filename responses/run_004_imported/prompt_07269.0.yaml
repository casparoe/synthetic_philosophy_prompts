answer: |-
  This is one of the most persistent points of confusion in algorithmic fairness, largely because the terms sound like they *should* be compatible. "Calibration" sounds like accuracy. "Equal False Positive Rates" sounds like fairness. Why can't we have both?

  The tension isn't a bug in the code; it's a geometric consequence of how these metrics are calculated relative to the population.

  To see the mechanics of this, let's build two small worlds. We will create two groups of defendants, apply a risk tool that is **perfectly calibrated**, and then watch the False Positive Rates diverge inevitably.

  ### The Setup: Two Groups, Different Base Rates

  Imagine a jurisdiction with two groups of 1,000 defendants each. We know the ground truth (who actually reoffends) because this is a thought experiment.

  **Group A (Higher Base Rate)**
  *   **Total:** 1,000 people
  *   **True Recidivists:** 500 people (50% base rate)
  *   **True Non-Recidivists:** 500 people

  **Group B (Lower Base Rate)**
  *   **Total:** 1,000 people
  *   **True Recidivists:** 200 people (20% base rate)
  *   **True Non-Recidivists:** 800 people

  *Note: This divergence in base rates is the empirical reality ProPublica pointed out. Group A has a much higher density of actual risk.*

  ### The Tool: The "Calibrated Box"

  Now, imagine the algorithm puts people into a "High Risk" box. To satisfy Northpointe's defense, this tool must be **calibrated**.

  For this example, let's set the calibration threshold at **50%**.
  **The Rule:** Of everyone the tool places in the "High Risk" box, exactly 50% must actually reoffend.

  If the tool puts 100 people in the box, 50 must be recidivists and 50 must be non-recidivists. If it puts 10 people in, 5 and 5. The ratio inside the box is locked at 1:1.

  ### Step 1: Run Group A (The High Base Rate)

  The tool scans Group A. It needs to fill the "High Risk" box while maintaining that 50% calibration rule. Let's say the tool is moderately aggressive and identifies **200 True Recidivists** to put in the box.

  *   **True Positives (TP):** 200 (Recidivists correctly flagged)
  *   **Calibration Check:** To keep the 50% ratio, we must add an equal number of Non-Recidivists.
  *   **False Positives (FP):** 200 (Innocent people incorrectly flagged)
  *   **Total in Box:** 400 people (200 Guilty + 200 Innocent).

  Now, let's calculate the **False Positive Rate (FPR)**.
  *Crucial Definition:* The FPR is not the number of false positives divided by the box size. It is the number of false positives divided by **all innocent people in the population.**

  *   **Group A Innocent Population:** 500
  *   **Group A False Positives:** 200
  *   **Group A FPR:** $200 \div 500 =$ **40%**

  So, in Group A, 40% of the innocent people were wrongly flagged.

  ### Step 2: Run Group B (The Low Base Rate)

  Now the tool scans Group B. It must follow the exact same **Calibration Rule** (50% of the box must be recidivists). Let's assume the tool is equally "sensitive" and catches the same *proportion* of the available recidivists as it did in Group A.

  In Group A, we caught 200 out of 500 recidivists (40% capture rate). Let's apply that 40% capture rate here.

  *   **True Recidivists Available:** 200
  *   **True Positives (TP):** 80 (40% of 200)
  *   **Calibration Check:** To keep the 50% ratio inside the box, we must add an equal number of Non-Recidivists.
  *   **False Positives (FP):** 80 (Innocent people incorrectly flagged)
  *   **Total in Box:** 160 people (80 Guilty + 80 Innocent).

  Now, let's calculate the **False Positive Rate (FPR)** for Group B.

  *   **Group B Innocent Population:** 800 (Remember, this group is mostly innocent)
  *   **Group B False Positives:** 80
  *   **Group B FPR:** $80 \div 800 =$ **10%**

  ### The Impossibility Revealed

  Look at the results. The tool was perfectly calibrated in both groups (50% of the "High Risk" box reoffended in both cases). Yet:

  *   **Group A False Positive Rate:** 40%
  *   **Group B False Positive Rate:** 10%

  **Why did this happen?**

  It comes down to the **denominator** of the False Positive Rate.

  In Group A, the innocent population is small (500). When you add False Positives to the "High Risk" box to satisfy calibration, you are drawing from a small pool of innocents. You burn through them quickly. 200 false positives is a huge chunk of 500 innocents.

  In Group B, the innocent population is massive (800). Because the base rate of crime is low, there are very few True Recidivists available to put in the box. To stay calibrated, you are *forced* to limit the number of False Positives (because they must match the True Positives 1-to-1). You end up with only 80 False Positives. But when you divide those 80 errors by the massive pool of 800 innocents, the rate looks tiny (10%).

  ### Can We Fix It? (The Mechanical Break)

  You might ask: *"Okay, but why can't we just tune the tool to flag more people in Group B until the False Positive Rates match?"*

  Let's try. To match Group A's **40% FPR**, Group B needs to falsely flag 40% of its 800 innocents.
  *   **Target False Positives:** 320 people.

  But wait. The **Calibration Rule** still applies. For every False Positive (Innocent) we put in the box, we must put in one True Positive (Recidivist) to keep the 50% ratio.
  *   **Required True Positives:** 320 people.

  **Here is the mechanical break:** Group B only has **200** True Recidivists in the entire population. You physically cannot find 320 recidivists to balance out the 320 innocents. You run out of "guilty" people before you can match the False Positive Rate of Group A.

  ### The Intuition in Plain English

  The conflict exists because **Calibration** and **False Positive Rate** measure the error relative to different things.

  1.  **Calibration** looks *inside* the prediction box. It asks: "Of the people I flagged, how many were actually guilty?" It forces a fixed ratio of Guilty to Innocent *within the flagged group*.
  2.  **False Positive Rate** looks *outside* at the population. It asks: "Of all the innocent people in the world, how many did I wrongly flag?"

  When Base Rates differ, the supply of "Guilty" people differs.
  *   In the **High Base Rate** group, Guilty people are plentiful. You can fill your prediction box with them easily, which allows you to also include many Innocent people (maintaining calibration) without running out of Guilty ones. This results in a **high False Positive Rate** because you are churning through the smaller pool of innocents.
  *   In the **Low Base Rate** group, Guilty people are scarce. To maintain calibration, you are strictly limited in how many Innocent people you can flag (because you need a Guilty partner for every Innocent one). This results in a **low False Positive Rate** because you are forced to be conservative, leaving most of the large pool of innocents alone.

  ### Summary for Your Story

  The data scientist at the panel was right that it is "mathematically unavoidable," but the reason isn't abstract algebra. It's supply and demand.

  If you demand that the *composition* of the risk bucket remains constant across groups (Calibration), but the *supply* of actual risk differs between groups (Base Rates), then the *rate* at which you sweep up innocent people (False Positive Rate) must change.

  You cannot have equal error rates across groups with different base rates unless you are willing to lie about the risk scores (break calibration). In the COMPAS case, ProPublica measured the error rates (and found disparity), while Northpointe measured the calibration (and found parity). They were measuring two different mechanical constraints that, as you've seen, cannot be satisfied simultaneously.
