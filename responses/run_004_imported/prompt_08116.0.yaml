answer: |-
  **Handout Supplement: The Conditional Analysis Debate**
  **Context:** *Use this dialogue to frame the discussion before reading Lewis ("Finkish Dispositions") and Johnston ("Dispositions and Conditionals"). Note how the arguments shift from specific counterexamples to the methodology of metaphysical analysis.*

  ***

  **Setting:** *The seminar room, 5:15 PM. Most students have left. ALEX (defending a Lewis-style Reformed Conditional Analysis) is at the whiteboard, marker in hand. JAMIE (a Primitivist about dispositions) is leaning against a desk, packing a bag but clearly not ready to leave.*

  **Alex:** (Tapping the board) You're dismissing the Reformed Conditional Analysis (RCA) too fast. You're treating Lewis's fix like it's the same as the Simple Conditional Analysis (SCA). It isn't. The SCA says: *x is disposed to M if, were x stimulated S, x would M.* We all agree the electro-fink kills that. But Lewis adds the intrinsic basis clause.

  **Jamie:** The "intrinsic basis that persists" clause? Come on, Alex. That's not a fix; it's a patch. And it's a patch that leaks.

  **Alex:** It's not a patch if it captures the causal structure. Look. The wire is conductive. The fink device detects the contact and removes the conductivity *before* the current flows. SCA says: "If touched, current flows." It doesn't. So SCA says: "Not conductive." That's wrong. But RCA says: "The wire has an intrinsic basis $B$ (the electron lattice). If $B$ persisted through the stimulus, current would flow." The fink removes $B$. So the antecedent of the counterfactual is false. The analysis holds. The disposition is real, even if the counterfactual doesn't manifest.

  **Jamie:** But how do you specify $B$ without already knowing the disposition? You're saying "It has the property that causes the manifestation." But if I ask, "Which property is that?" you say, "The one that makes it conductive." You're analyzing dispositions in terms of causal bases, but you identify the bases in terms of the dispositions. It's circular.

  **Alex:** It's not circular; it's structural. We don't need to know the *specific* microphysics to know there *is* an intrinsic property doing the work. The point is that dispositions aren't magic. They ground the counterfactuals. If you deny the conditional analysis, what are you left with? Dispositions as brute, unanalyzable primitives?

  **Jamie:** Exactly. And I'll take brute primitives over a conditional analysis that requires a *ceteris paribus* clause the size of a phone book. Let's move to masks. The wine glass packed in styrofoam. It's fragile. I strike it. It doesn't break. SCA says it's not fragile.

  **Alex:** RCA handles masks easily. The intrinsic basis—the molecular structure of the glass—is present. The stimulus occurs. But the *conditions* surrounding the stimulus include the styrofoam. Lewis allows us to refine the stimulus description. "If struck *in the absence of masking interferers*..."

  **Jamie:** (Pushing off the desk and walking to the board) There it is. "In the absence of masking interferers." How do you define "masking interferer" without saying "anything that stops the glass from breaking"?

  **Alex:** No, in terms of causal independence. A mask is an extrinsic factor that interrupts the causal chain between the basis and the manifestation.

  **Jamie:** But to know if it interrupts the chain, you have to know what the chain *would have produced*. You're defining the ideal conditions by referencing the very manifestation you're trying to analyze. It's vacuous. It says: "The glass is disposed to break if, in conditions where nothing stops it from breaking, it breaks." That's not an analysis. That's a tautology.

  **Alex:** It's not vacuous because it ties the disposition to the *actual* intrinsic properties of the object. It connects metaphysics to physics. If you go primitivist, you sever that link. You're saying fragility is just a label we slap on things. I'm saying fragility is a real feature of the world that *makes* the counterfactual true.

  **Jamie:** I'm saying the counterfactual is just *evidence* for the disposition, not the *meaning* of it. And the evidence is defeasible. That's the problem with your "persistence" clause. Think about antidotes. A poison is disposed to kill. I ingest it (stimulus). But I also take an antidote. I don't die.

  **Alex:** Same as the mask. The antidote is an extrinsic interferer.

  **Jamie:** Is it? What if the antidote was already in my bloodstream? What if I'm immune? Now the "interference" is intrinsic to me. Does the poison lose its disposition to kill me? No. But your analysis requires the intrinsic basis of the *poison* to persist. It does. But the *system* (me + poison) has changed. To save your analysis, you have to say: "If the poison were ingested, and the basis persisted, and no antidote was present, and no immunity existed, and..." You're chasing the context.

  **Alex:** I'm not chasing context; I'm specifying the causal recipe. Look, Jamie, every scientific law has *ceteris paribus* conditions. Gravity holds *ceteris paribus* other forces. You don't say gravity is primitive because a magnet can lift a paperclip against it. You say the magnetic force masked the gravitational effect. Why is it different for dispositions?

  **Jamie:** Because with gravity, we have independent equations for the magnetic force. With dispositions, you're asking me to accept a counterfactual analysis where the "ideal conditions" are defined solely by whether the manifestation happens. It's a degenerating research program. Every time I bring you a new fink—a fink that *adds* a disposition, a fink that operates probabilistically, a mask that is intrinsic—you add another clause to the antecedent.

  **Alex:** And if I can add that clause without contradiction, I win. The goal is to save the intuition that dispositions are connected to behavior. If you go primitivist, you lose that. You end up with "dormitive virtues." Why does the opium put me to sleep? Because of its *virtus dormitiva*. Why is the glass fragile? Because it has *fragility*.

  **Jamie:** That's a caricature. Primitivism doesn't say dispositions don't do work. It says they are *causal powers*. They are real properties that *ground* the counterfactuals, not that they *are* the counterfactuals. The counterfactuals can fail—finks, masks, antidotes—but the power remains. Your analysis makes the disposition vanish whenever the counterfactual fails. You have to do gymnastics to say the disposition is still there. I just say: "The power is there, the manifestation was blocked."

  **Alex:** But how do you individuate the powers? If they aren't tied to conditionals, what makes fragility different from susceptibility to shattering?

  **Jamie:** Their causal profiles. But those profiles aren't simple conditionals. They are complex, context-sensitive relations.

  **Alex:** (Erasing a section of the board aggressively) So you're willing to accept opaque primitives rather than a conditional analysis that requires precise specification of the intrinsic basis? You'd rather say "it just is fragile" than "it has a structure such that..."?

  **Jamie:** I'd rather say "it just is fragile" than say "it is fragile if, in a world where nothing stops it, it breaks." One is a metaphysical commitment. The other is a linguistic dodge. You're trying to reduce modality to counterfactuals. I'm telling you the counterfactuals depend on the modality, not the other way around.

  **Alex:** We'll see what the students say about the persistence clause. Lewis gets the timing right. The basis must exist at $t$, stimulus at $t$, and basis must persist through to the manifestation. The fink removes it *at* $t$.

  **Jamie:** And the reverse fink? The one that *gives* the wire conductivity only when touched? The wire isn't conductive. You touch it. The fink makes it conductive. It conducts. SCA says "Conductive." RCA says... well, does it have an intrinsic basis *before* the touch? No. So RCA says "Not conductive." Correct. But now you rely on the basis existing *prior* to stimulus. What if the basis is generated by the stimulus but isn't a "fink"? Where do you draw the line between a normal causal process and a finkish addition?

  **Alex:** Intrinsic vs. Extrinsic.

  **Jamie:** (Smiling) There's the bullet. You're going to define "intrinsic" sharply enough to rule out every possible extrinsic generator? Good luck.

  **Alex:** Better luck than defining "causal power" without reference to what it *does*.

  **Jamie:** (Picks up bag) That's why we're reading Johnston next week. He thinks he can split the difference.

  **Alex:** He tries. But he still needs the conditionals.

  **Jamie:** Maybe. Or maybe he admits the analysis is dead and we just need to manage the corpse. See you Tuesday.

  **Alex:** (Turns back to the board, uncapping the marker) Tuesday. Bring a better example than the antidote.

  **Jamie:** (From the door) I'll bring a mimicking fink. Watch your back.

  *(Jamie exits. Alex stares at the whiteboard, writes "INTRINSIC?" and underlines it twice.)*
