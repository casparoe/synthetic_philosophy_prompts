          *   *Weakness:* Risks lowering the bar too much (if *any* self-interest invalidates credit, fine; but if *any* self-interest *preserves* credit, where's the line?).

      *   **Move (4) Oscar:** The "Counterfactual Test." Would you do it if no one was watching?
