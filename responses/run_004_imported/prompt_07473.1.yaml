      *   *Did Hume believe in locality?* He was uneasy about action at a distance. This complicates the "Hume would accept QM non-locality" narrative. I need to balance his Newtonian anxieties with his empiricist commitments.
      *   *Is Maudlin's argument metaphysical or physical?* It's metaphysical based on physics. Hume would question the metaphysics.
      *   *Key Insight:* The "Best System Analysis" (BSA) is Lewis, not Hume. Hume didn't have a theory of laws as summaries; he had a theory of *causal belief* as habit. This is a crucial distinction.

  7.  **Final Polish:** Organize into clear headings. Ensure the distinction between *Humean Supervenience* (Lewis) and *Hume's Philosophy* is the through-line. (Proceed to generate output based on these thoughts.)
answer: |-
  This is an exceptionally sharp observation, and honestly, it's the kind of meta-philosophical critique that often gets glossed over in graduate seminars because everyone is too busy fighting over the Lewisian framework. You have hit on a tension that historians of philosophy and metaphysicians alike wrestle with: **The gap between Hume's skepticism and Lewis's systematic realism.**

  To answer your question directly: **Hume would likely be baffled by the stakes of the debate, would reject the ontological commitments of Lewisian Humeanism, and would probably dissolve the "problem" of entanglement rather than solving it.**

  Here is a breakdown of why Hume himself would likely feel alienated from the modern "Humean" camp, and where he might actually land on the physics.

  ### 1. Epistemology vs. Ontology (The Big Divergence)
  Your intuition here is spot on. Lewis's Humean Supervenience (HS) is a **positive ontological thesis**. It claims: *This is what the world fundamentally is.* It asserts that the "mosaic" of local matters of fact is the fundamental reality, and laws supervene on it.

  Hume's project was **epistemological and psychological**. He wasn't claiming the world *is* just constant conjunctions; he was claiming that *human beings cannot conceive of anything else* based on their impressions. When Hume says there is no "necessary connection," he isn't making a modal claim about the universe's architecture (like Lewis); he is making a claim about the limits of human ideas.

  *   **Lewis:** "There are no necessary connections in nature."
  *   **Hume:** "We have no impression of necessary connection, so we cannot form a coherent idea of it."

  **The Consequence:** If Maudlin comes to Hume and says, "Entanglement proves there are non-separable states," Lewis has to panic because his ontology is threatened. Hume would shrug and say, "I never claimed to know the 'secret powers' or the ultimate ontology of objects. If your physics tells you the regularities are non-local, then the regularities are non-local. I never promised you a local mosaic."

  ### 2. The "Mosaic" and the View from Nowhere
  Lewisian Humeanism requires a "God's Eye View" (the view of the entire spacetime block) to determine the Best System. Hume was deeply skeptical of any perspective other than the human one.

  Hume did not believe in a "block universe." He believed in a succession of perceptions. The idea that there is a "total mosaic" of particular facts waiting to be summarized by laws is a realist commitment that Hume would find dogmatic.
  *   **Lewis:** Needs the mosaic to be separable (intrinsic properties at spacetime points) so the Best System can supervene on it.
  *   **Hume:** Would likely argue that positing a "mind-independent mosaic" is already stepping beyond what experience warrants.

  So, to your point about "unHumean baggage": **Yes.** Lewis attached modal realism, concrete possible worlds, and a robust scientific realism to Hume's name that Hume would have rejected as "metaphysical nonsense." Hume was a mitigated skeptic; Lewis was a systematic metaphysician.

  ### 3. Action at a Distance: Where Hume Might Surprise You
  Here is where it gets tricky. While Hume wouldn't defend the *ontology* of the mosaic, he might share the *intuition* behind the worry about entanglement.

  Hume was a Newtonian, but he was deeply uncomfortable with Newton's gravity. Why? Because gravity implied **action at a distance**. For Hume (and most mechanists of his time), causation required contact/contiguity. In the *Treatise*, he lists contiguity in time and place as essential to our idea of cause and effect.

  *   **Maudlin's Argument:** Entanglement violates separability/locality.
  *   **Lewis's Response:** Try to save locality (configuration space).
  *   **Hume's Reaction:** This is complex.
      1.  **As an Empiricist:** If the experiments (Bell tests) show correlations, Hume accepts the correlations. He doesn't need a "mechanism" of contact to accept a "constant conjunction." If A and B are always correlated across distance, that is a valid basis for expectation, even if we can't see the wire connecting them.
      2.  **As a Newtonian:** He would find the *idea* of non-locality as repugnant as he found gravity. He might say, "There must be some intermediate cause we haven't detected," not because of metaphysics, but because our imagination fails to link distant events without a chain.

  However, crucially, Hume wouldn't think this threatens the *concept* of law. For Hume, laws aren't "governing" (Maudlin) nor are they "Best System Summaries" (Lewis). They are just descriptions of the habits of nature we have observed. If nature's habit is non-local, so be it.

  ### 4. Who is Hume Really On?
  If forced into the seminar room, Hume would likely dismantle the dichotomy:

  *   **Against Maudlin (Anti-Humean):** Hume would reject the idea that laws are "primitive governing facts." That sounds suspiciously like a necessary connection or a "secret power" residing in the universe. Hume would say, "You are reifying a rule of inference into a metaphysical agent."
  *   **Against Lewis (Humean):** Hume would reject the claim that the mosaic is the *fundamental truth*. He would say, "You are claiming knowledge of mind-independent reality that you cannot possess. Also, why do you need 'possible worlds' to make this work?"

  **The Verdict:** Hume is closer to the **Humean** side regarding *necessity* (there is no governance), but closer to the **Anti-Humean** side regarding *metaphysical modesty* (don't claim you know the fundamental structure of the mosaic).

  ### 5. The "Brand Name" Irony
  You asked if there is something awkward about the baggage contemporary Humeans carry. **Absolutely.**
  Philosophers like Barry Loewer (Lewis's student) have explicitly admitted that "Humean Supervenience" is a misnomer. They use Hume's name because he is the historical figurehead for the rejection of necessary connections, but they have turned his skepticism into a dogma.

  *   **Hume:** "We can't know if there are necessary connections."
  *   **Lewis:** "I know there aren't any, and here is the mathematical proof based on the total state of the universe."

  In a way, Lewis is *more* rationalist than Hume. He thinks he can deduce the fundamental structure of reality through armchair metaphysics (combinatorialism, supervenience). Hume would tell Lewis to go outside and check his impressions.

  ### Summary for your Seminar
  If you want to raise this in class, here is the punchline:
  The debate between Maudlin and Lewis assumes a **metaphysical realism** that Hume would reject. Maudlin thinks laws are real things; Lewis thinks the Mosaic is the real thing. Hume thinks both are projecting human cognitive structures onto the world.

  Regarding entanglement:
  1.  **Lewis** has to twist physics (configuration space) to save his metaphysics (Supervenience).
  2.  **Maudlin** twists metaphysics (primitive laws) to save his reading of physics (non-separability).
  3.  **Hume** would accept the physics as "observed regularity" and tell both metaphysicians that they are arguing about "the nature of the soul" or "the essence of matter"—questions that are unintelligible.

  So, is Hume on their side? **No.** He is the guy at the back of the room telling them they are asking the wrong question. But if forced to choose, he would prefer the **Regularist** view (entanglement is just a brute regularity) over the **Governing** view (laws make it happen), simply because "governing" smells too much to him like "necessary connection."

  **Suggested Reading/Reference:**
  If you want to drop a name that bridges this, look up **Bas van Fraassen**. He is a constructive empiricist who is very Humean but rejects Lewisian realism. He argues we should only believe theories are *empirically adequate*, not that they describe the "true mosaic." He would side with you: the debate is metaphysically overloaded.
