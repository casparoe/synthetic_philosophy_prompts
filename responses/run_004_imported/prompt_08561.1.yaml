answer: |-
  Good evening. For those of you who don't know me, I'm the sibling of the [Groom/Bride], and I'm currently a PhD student in Economics. I mention this because I've been informed that roughly half the room consists of philosophers and game theorists who will physically wince if I misstate a theorem, and the other half is family who just wants to know why we're talking about math instead of eating cake. So, I have about five minutes to satisfy the tenure track and entertain the aunts. No pressure.

  We all know the origin story. [Sibling] and [Partner] met three years ago in a graduate reading group on Bayesian epistemology. According to legend, they spent the first several months in an escalating, heated disagreement over a single point in the weekly reading. It was only when the fighting stopped that the rest of the group realized they were actually dating.

  Naturally, when asked to give this toast, my first instinct was to lean on Aumann's Agreement Theorem. You know the one: it suggests that two rational Bayesian agents, if they share a common prior and have common knowledge of each other's posteriors, cannot agree to disagree.

  It is a tempting line for a wedding. "Science proves love means you never disagree." But there are two problems with that. First, it's technically false. Aumann doesn't promise you're *right*, only that you match. And second, it directly contradicts the central argument of [Sibling]'s dissertation.

  As many of you know, [Sibling] has spent the last few years arguing that the "common prior" assumption in Aumann's theorem is doing all the heavy lifting. They argue that assuming a common prior smuggles in the exact shared background that makes the theorem useless for modeling how actual strangers resolve actual disagreements. Essentially, [Sibling] has built a career on pointing out that you can't just assume people see the world the same way.

  And they are right. When [Sibling] and [Partner] met, they did *not* have a common prior. They had conflicting priors, conflicting information partitions, and presumably, conflicting opinions on which coffee shop was best for grading papers. If Aumann applies to strangers, they should have walked away.

  But this isn't a model of strangers. This is a marriage.

  I think the real romance here isn't that they started with a common prior. It's that they have spent the last three years building one. Marriage, viewed through the lens of high-level game theory, is the long, slow, deliberate work of making the priors common. It is the process of sharing enough history, enough context, and enough life that when you look at the same evidence, you begin to update in the same direction.

  [Sibling], you argued that the common prior assumption makes the theorem uninteresting for strangers. But I'd argue it makes it profound for spouses. Because you don't get the common prior for free. You earn it. You earn it by listening when you're tired. You earn it by explaining your reasoning even when it's obvious to you. You earn it by arguing about Bayesian epistemology until you realize you're arguing because you care about the truth, and about each other.

  And [Partner], as a game theorist, you know better than anyone that the equilibrium isn't the interesting part; it's the strategy to get there. Your strategy has been patience, humor, and a willingness to engage in a three-year debate that ended with a ring.

  So, I cannot promise you that you will never disagree again. New information will come in. Your information partitions will shift. Life will throw you variables no model predicted.

  But I can promise this: You have proven you are willing to do the hard work of sharing a world. You have shown that you value the other person's posterior enough to adjust your own. And for the family members wondering what this means: it means they talk to each other. They listen. They build a life where they are on the same team.

  Aumann says rational agents with a shared world cannot agree to disagree. My wish for you is not that you always agree, but that you always remain rational enough, and loving enough, to keep building that shared world until you do.

  Please raise your glasses. To [Sibling] and [Partner]: May your priors converge, your updates be kind, and your happiness be common knowledge.

  To the happy couple!
