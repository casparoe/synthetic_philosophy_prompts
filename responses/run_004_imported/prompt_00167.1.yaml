answer: |-
  You have hit on exactly the intuition that makes Newcomb's Problem so famous and so divisive. In fact, your reasoning is the standard argument *for* Two-Boxing (Causal Decision Theory).

  To answer your specific question directly: **No, serious philosophers and decision theorists who argue for One-Boxing are not committed to backward causation.** They do not believe your present choice reaches back in time to move the money.

  If they believed that, they would be arguing for magic, not decision theory. So how do they defend One-Boxing without violating the laws of physics? They do it by shifting the focus from **causation** to **correlation** and **logical identity**.

  Here is how to make sense of One-Boxing without believing in time travel.

  ### 1. The "Symptom" vs. "Cause" Distinction
  Your intuition is based on **Causal Decision Theory (CDT)**. CDT says: *I should choose the action that physically causes the best outcome.* Since your choice now cannot physically cause the money to appear in the past, you should take both boxes to get whatever is there plus the extra $1,000.

  One-Boxers (often adhering to **Evidential Decision Theory** or the newer **Functional Decision Theory**) argue that you are looking at the relationship between your choice and the money incorrectly.

  Think of your choice not as a *cause* that reaches backward, but as a *symptom* that reveals what happened earlier.
  *   If you are the kind of agent who One-Boxes, the Predictor (being nearly infallible) knew that, and put $1 million in the box.
  *   If you are the kind of agent who Two-Boxes, the Predictor knew that, and left Box B empty.

  Your choice doesn't *change* the past; it *reveals* which past you are living in. One-Boxers argue that you should act in a way that makes it evidentially likely that you are in the "rich past" timeline.

  **Analogy:** Imagine a medical test for a genetic condition. The condition causes the test to be positive. Taking the test doesn't *cause* the disease. However, if you want to know if you have the disease, you look at the test result. If you could choose your test result (somehow), you would want it to be negative, because a negative result is *evidence* you don't have the disease. One-Boxers treat the decision like the test result: they want the "outcome" that correlates with the million dollars.

  ### 2. The "Logical Twin" Argument (Functional Decision Theory)
  The most robust modern defense of One-Boxing comes from **Functional Decision Theory (FDT)**. This approach sidesteps time entirely by focusing on logic.

  FDT argues that the Predictor didn't just guess; they ran a simulation or a calculation of your decision-making process.
  *   You are running a decision algorithm in your head right now.
  *   The Predictor ran that same algorithm (or a near-perfect copy) yesterday.

  Mathematically, $2 + 2 = 4$ is true regardless of when or where you calculate it. If you calculate it today, and a computer calculated it yesterday, you are both accessing the same logical truth.

  When you sit in the room, you are not just deciding what *your* hands will do. You are determining the output of the logical function "How does this agent respond to Newcomb's Problem?"
  *   If your function outputs "Take One," the simulation's output was "Take One," so the money is there.
  *   If your function outputs "Take Both," the simulation's output was "Take Both," so the money is gone.

  You aren't reaching back in time to change the simulation. You and the simulation are **logically linked**. You are effectively deciding for both instances of the algorithm simultaneously. To say "I will Two-Box, but the simulation One-Boxed" is like saying "I will calculate that $2+2=5$, but the computer yesterday calculated $2+2=4$." If you are identical logical agents, you cannot output different answers.

  ### 3. Why "The Money Is Already There" Is Misleading
  The phrase "The money is already there" is technically true but pragmatically misleading. It implies the state of the boxes is independent of your decision procedure.

  In Newcomb's Problem, the state of the boxes is **counterfactually dependent** on your decision.
  *   **Counterfactual:** "If I *were* to One-Box, there *would be* $1 million."
  *   **Counterfactual:** "If I *were* to Two-Box, there *would be* $0."

  Even though the event happened in the past, the *truth value* of what happened depends on what you decide now. One-Boxers argue that rational agents should respect these counterfactual dependencies. If you know that Two-Boxing is the *type of behavior* that results in empty boxes, doing it anyway because "the money is already there" is like shooting yourself in the foot to prove you have free will.

  ### 4. So, Why Do People Still Two-Box?
  If One-Boxing doesn't require magic, why is there a debate?

  The disagreement isn't about physics; it's about **what decision theory is supposed to do.**
  *   **Two-Boxers (CDT)** believe decision theory should guide actions that have **causal leverage**. Since you have no causal leverage over the past, you maximize what you can control (the extra $1,000). They argue that One-Boxing is essentially "wishing" for the money to be there.
  *   **One-Boxers (EDT/FDT)** believe decision theory should guide agents to **win**. Since One-Boxers consistently walk away with $1 million and Two-Boxers walk away with $1,000, One-Boxing is the winning strategy. They argue that CDT is too narrow because it ignores logical correlations.

  ### Summary
  You do not need to believe in backward causation to One-Box. You only need to accept one of the following:
  1.  **Evidential View:** Your choice is strong evidence of what the Predictor did. You want your choice to be evidence of the "Million Dollar" past.
  2.  **Logical View:** Your decision and the Predictor's simulation are the same logical function. Deciding now determines the output of that function, regardless of when the calculation occurred.

  Your intuition that "I can't change the past" is correct. The One-Boxer's reply is: "I'm not trying to change the past. I'm trying to ensure that the past was the kind of past where I get rich."

  If you still feel that Two-Boxing is the only rational choice, you are in good company (many Nobel laureates and philosophers agree with you). But you can rest assured that the One-Boxers aren't smuggling in time travel; they just have a different definition of how your choice relates to the world.
