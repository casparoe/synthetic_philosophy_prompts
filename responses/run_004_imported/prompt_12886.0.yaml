answer: |-
  This is a sophisticated question that cuts to the core of the conflict between neoclassical decision theory and the emerging literature on ergodicity economics. As a PhD student, you know the formalism, so I will skip the basic derivations of the Kelly criterion and Breiman's theorem to focus on the normative and meta-theoretical clash between Ole Peters' ergodicity argument and Paul Samuelson's critique.

  Here is the direct comparison, the verdict on Samuelson's charge, and the requirements for a viable defense of geometric rationality.

  ### 1. The Core Conflict: Ontology of the Expectation Operator

  The disagreement is not merely about mathematics; it is about the ontology of the economic agent and the definition of the expectation operator.

  **The Ergodicity Economics Position (Peters):**
  Peters argues that standard Expected Utility (EU) theory implicitly assumes **ergodicity**. In an ergodic system, the time average of a single trajectory equals the ensemble average across parallel systems. Standard EU maximizes the ensemble average of utility: $E[U(W)]$.
  However, wealth dynamics are typically multiplicative ($W_{t+1} = W_t \cdot (1 + r)$). Multiplicative processes are **non-ergodic**. The ensemble average wealth grows at the arithmetic mean rate, but the wealth of a single agent traveling through time grows at the geometric mean rate.
  *   **The Claim:** Because a single agent lives in time, not in an ensemble of parallel universes, the only observable relevant to them is the time-average growth rate. Maximizing this rate is not a preference; it is a physical necessity for optimizing the observable outcome of the process. Therefore, $\log W$ emerges from the dynamics, not the utility function.

  **The Samuelsonian Position:**
  Samuelson (1963, 1969, 1971) argues that the "Fallacy of Large Numbers" applies here. He contends that the number of repetitions does not alter the agent's fundamental utility function.
  *   **The Claim:** If an agent has a utility function $U(W) = W^\alpha$ (where $\alpha < 1$), they are rational to maximize $E[W^\alpha]$. Even if the Kelly strategy (log-optimal) dominates asymptotically with probability one, it does not necessarily maximize expected utility at any finite horizon $T$. Furthermore, an agent might rationally prefer a lower growth rate to avoid specific drawdown risks or because they value terminal wealth differently. To say they *must* maximize growth is to impose a specific utility function (asymptotic wealth) and call it "physics."

  ### 2. Does Samuelson's Charge Survive?

  **Verdict: Yes, Samuelson's charge of "smuggled-in log utility" survives essentially intact within the framework of normative decision theory.**

  Here is the justification:

  **A. The Normative Leap**
  Peters successfully demonstrates that for multiplicative processes, the time-average growth rate is the geometric mean, and the ensemble average is the arithmetic mean. He correctly identifies that EU theory often conflates the two. However, the move from "the time-average growth rate is $g$" to "a rational agent *ought* to maximize $g$" is a normative leap.
  By asserting that the time-average is the *only* relevant metric, Peters is implicitly defining the agent's objective function as $U(W) = \lim_{T \to \infty} \frac{1}{T} \log(W_T)$. This is functionally equivalent to positing log utility over terminal wealth in the long run. Samuelson's point is that an agent is permitted to have a different objective function (e.g., minimizing the probability of ruin before $T$, or maximizing $E[W_T^{0.5}]$). Prioritizing the long-run time average is a preference for the long run over the short/medium run and for growth over stability. That is a value judgment, not a dynamical law.

  **B. Asymptotic Dominance $\neq$ Finite Utility**
  Breiman's theorem proves that the Kelly bettor will eventually outperform any other strategy with probability one. However, "eventually" can be arbitrarily long. Samuelson correctly notes that for any finite $T$, a non-Kelly strategy can have higher expected utility. If an agent has a finite horizon (e.g., retirement at $T$), or if the disutility of a drawdown en route to $T$ is high, the asymptotic dominance of Kelly is irrelevant. By dismissing finite-horizon concerns in favor of the asymptotic limit, Peters is effectively assuming an infinite horizon and a specific tolerance for interim volatility. This is, again, a specific utility structure smuggled in as a dynamical constraint.

  **C. The Definition of Rationality**
  Samuelson operates within **axiomatic rationality** (consistency of choice, e.g., von Neumann-Morgenstern). Peters operates within **ecological/instrumental rationality** (survival and growth in a specific environment).
  Within axiomatic rationality, Samuelson wins: you cannot derive an "ought" (maximize log) from an "is" (multiplicative dynamics) without a bridging premise (the agent cares about long-run growth above all else). That bridging premise *is* the utility function.

  ### 3. How to Escape the Charge: A Defense Strategy

  If you wish to build a term paper defending geometric rationality against Samuelson, you cannot simply reiterate Peters' ergodicity argument. You must change the meta-theoretical ground. To escape the charge of smuggled utility, a defender of geometric rationality must add the following arguments:

  **1. Shift from Preference to Survival (Evolutionary Argument)**
  You must argue that "rationality" should not be defined by internal consistency of preferences, but by **survival stability**.
  *   *Argument:* In a competitive environment where agents are selected for wealth accumulation, agents who do not maximize geometric growth will asymptotically lose market share to those who do. Even if a non-Kelly agent has higher "satisfaction" (EU) at time $T$, they will possess a vanishingly small fraction of total wealth as $T \to \infty$.
  *   *Requirement:* You need to formalize this as an evolutionary stability argument. If the goal of the economic agent is to persist as a significant economic force, geometric maximization is not a preference; it is a condition of existence. This moves the justification from *decision theory* to *evolutionary economics*.

  **2. The "Single Agent" Ontology as a Critique of EU**
  You must attack the coherence of the ensemble average for a single decision-maker more aggressively.
  *   *Argument:* Samuelson assumes the expectation operator $E[\cdot]$ is well-defined. Peters argues that for non-ergodic processes, $E[\cdot]$ (ensemble) is physically meaningless to a single agent. It describes a collection of copies, not a life.
  *   *Requirement:* You need to argue that standard EU is not just "one preference among many," but **ill-defined** for non-ergodic processes unless the averaging method is specified. If the ensemble average is physically inaccessible to the agent, maximizing it is not just a different preference; it is an optimization of a counterfactual that never occurs. This frames log-optimality not as a utility function, but as the correction of a mathematical error in applying probability theory to time-series data.

  **3. Address the Drawdown/Finite Horizon Objection**
  Samuelson's strongest point is the finite horizon and ruin risk. Pure Kelly can lead to deep drawdowns.
  *   *Requirement:* A robust defense must incorporate **Fractional Kelly**. You need to show that the ergodicity framework naturally accommodates risk constraints not by changing the utility function, but by acknowledging constraints on the *dynamics* (e.g., leverage constraints, minimum consumption floors). If you can show that "geometric rationality" implies maximizing growth *subject to* survival constraints (which keeps the log objective but modifies the feasible set), you avoid positing a different utility function (like power utility).

  ### Summary for Your Paper

  Samuelson is correct that within the **axiomatic framework of Expected Utility**, the ergodicity argument does not derive log-utility without implicitly assuming the agent values the long-run time-average above all else. That valuation is a utility function.

  However, Peters is correct that the **axiomatic framework itself** relies on an ergodic assumption that fails for multiplicative wealth dynamics.

  **Your Path Forward:**
  To make a novel contribution, do not try to prove Samuelson wrong on his own terms (axiomatic consistency). Instead, argue that Samuelson's framework is the wrong tool for non-ergodic dynamics.
  1.  Concede that geometric rationality implies a specific intertemporal objective.
  2.  Argue that this objective is **uniquely privileged** because it is the only one aligned with the physical time-evolution of wealth for a single agent.
  3.  Conclude that while other utility functions are *axiomatically permissible*, they are *dynamically dominated* in the long run. Therefore, "rationality" should be redefined from "axiomatic consistency" to "dynamic robustness."

  This shifts the debate from "Is log-utility the only rational preference?" (No) to "Is log-optimality the only strategy robust to the non-ergodic nature of economic time?" (Plausibly Yes). That is a defensible, PhD-level position.
