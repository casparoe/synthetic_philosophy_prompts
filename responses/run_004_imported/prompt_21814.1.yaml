answer: |-
  Your reaction is not only understandable; it is supported by psychology, philosophy, and the economics of collectibles. Your friend is looking at the guitar through a strictly **functionalist** lens (what does it *do*?), while you are experiencing it through a **historical and essentialist** lens (what *is* it?).

  Here is why your reaction makes sense and why your friend's assessment, while logically consistent in a vacuum, misses how human value actually works.

  ### 1. Psychological Essentialism
  Psychologists call what you are feeling **psychological essentialism**. This is the human intuition that objects contain an invisible "essence" derived from their history or original owner.

  Studies show that people value a sweater owned by a celebrity far more than an identical sweater, even if they are told the celebrity's sweater has been sterilized and they will never see the celebrity. We feel a sense of "contagion"—a connection to the person through the object. When you learned the guitar wasn't the musician's, that invisible thread was severed. The physical wood didn't change, but the *connection* did. Your feeling of loss is the loss of that connection, not the loss of the wood.

  ### 2. Provenance is a Feature, Not a Bug
  In the world of art and collectibles, **provenance** (the history of ownership) is not just a label attached to the object; it is a constitutive part of the object's identity.

  Consider a painting. If you have a visually perfect forgery of a Van Gogh and the actual Van Gogh side-by-side, they may look identical to the naked eye. However, they are ontologically different objects. One is a document of Van Gogh's creative act; the other is a document of the forger's technical skill.
  *   **The Original:** A historical artifact.
  *   **The Replica:** A tribute or a tool.

  Your friend argues that nothing about the object has changed. But in the context of collectibles, **history is a physical property.** By removing the history, you have fundamentally altered the object's definition, even if the cellulose and steel remain the same.

  ### 3. The "Aura" of the Object
  The philosopher Walter Benjamin wrote about the "aura" of an original work of art. He argued that mechanical reproduction (or in this case, skilled replication) strips the object of its presence in time and space—its unique existence at the place where it happens to be.

  When you thought it was the bluesman's guitar, every scratch was a story of a performance, a struggle, or a specific moment in music history. Now, those same scratches are merely aesthetic choices made by a luthier. The **narrative weight** of the object has collapsed. You aren't mourning the sound; you are mourning the story.

  ### 4. Market Reality Validates You
  If your friend were right that "only the physical properties matter," then the market would reflect that. It does not.
  *   **Guitar A (The one you thought you had):** Worth tens or hundreds of thousands of dollars.
  *   **Guitar B (The one you actually have):** Worth the price of a high-end custom luthier build (perhaps a few thousand).

  The economic value is almost entirely tied to the narrative you just lost. If value were purely physical, a replica that plays *better* than the original would be worth more. It never is. The market agrees with your gut feeling: the object is now worth less because its origin story is different.

  ### 5. Why Your Friend Thinks You're Irrational
  Your friend is likely applying a framework of **instrumental value**. To a musician who only cares about tone and playability, the guitar *is* the same. If they played a blind test, they couldn't tell the difference. Their frustration comes from seeing you grieve something that "still works perfectly."

  However, humans rarely value objects solely for their utility. We value them for their **symbolic weight**.
  *   **Analogy:** If you found out your grandmother's wedding ring was actually a replica she bought because she lost the original, the gold is the same, but the heirloom status is gone. It is no longer a link to your ancestry; it is just jewelry. You would be justified in feeling a sense of loss.

  ### Conclusion
  You are not being irrational. You are recognizing that the **identity of an artifact is a combination of its matter and its history.**

  Your friend is right that the *utility* hasn't changed. But you are right that the *value* has. The guitar has transitioned from being a **relic** (a piece of history) to being a **replica** (a piece of craftsmanship). That is a fundamental change in the nature of the object, and your change in feeling is the appropriate response to that new reality.
