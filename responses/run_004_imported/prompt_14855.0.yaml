  They reach town. The theorist hands over the cash.

  "You know," says the driver, "paying me now is irrational. You're safe. Keeping the money is the dominant strategy."

  "I know," says the theorist. "But if I keep it, I prove my past self was a liar. And he's the one who made the deal to save my life."

  "So," says the driver, "you're paying me because your past self held your future self hostage?"

  "Exactly," says the theorist. "It's called rational irrationality."

  The driver pockets the money. "Nah, friend. I call it 'temporal extortion'."
