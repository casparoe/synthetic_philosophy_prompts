prompt: |-
  Before I hung up my lab coat I spent about three decades in observational cosmology, and one fact from that work never stopped bugging me: once dark energy pushes a galaxy across our future horizon, no signal will ever cross between us again, in either direction, guaranteed by the physics -- we'd be causally sealed off from each other forever. A couple years into retirement I got curious whether anyone had seriously worked out whether you could still owe something to, or gain something from, an agent you can prove you'll never causally touch, and that curiosity is what dragged me into decision theory blogs and papers on "acausal trade." I now co-host a little retirement podcast with two old colleagues -- mostly it's us reading philosophy we missed the first time around and bugging actual philosophers about it -- and next week's guest is a decision theorist who defends, seriously and not as a party trick, the claim that two agents who can never interact causally (across horizons like the one above, across branches of a multiverse, between a simulation and whatever's running it) can still trade with each other in a way that's genuinely rational for both sides.

  Can you help me put together eight or nine questions for her? I don't want her just re-running the standard Newcomb's-problem setup and calling it a day -- I want to push on the actual joints of the view. I'd like one question that goes straight at the enforcement problem: if neither side can causally reward or punish the other, whats stopping this from collapsing into one party unilaterally being nice for nothing in return, with a follow-up asking whether the usual fix -- that the two agents' decisions are "superrationally" correlated -- is really acausal at all, or just an ordinary causal dependency in disguise, routed through each agent's model of the other. I'd like one on why this apparently forces you to give up causal decision theory for something like evidential or functional decision theory, and whether that isn't just winning the argument by picking the friendliest framework beforehand. One on how two parties who can never communicate are supposed to land on any particular split of the gains, rather than each quietly imagining the split that favors them. One on how you tell a genuine trading partner from an acausal blackmailer, given that you can't run a background check on anyone you can't causally reach. And I'd like to end on the question of what kind of evidence, even in principle, could tell us acausal trade is doing real work, versus it just being a comforting story about why it's good to be the cooperative type. For each question, throw in a line about the answer she'll probably reach for and a sharp follow-up that keeps her from resting there.
