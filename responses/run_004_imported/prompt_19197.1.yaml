answer: |-
  Here are nine questions tailored to your background and the specific pressure points you want to test, formatted with the guest's likely response and a sharp follow-up for each.

  **1. The Enforcement Problem (The Horizon)**
  *   **Question:** In my old line of work, if a galaxy crosses the de Sitter horizon, it's gone from our causal light cone forever. If I'm trading with an agent on the other side of that horizon, you can't punish me for defecting, and I can't punish you. So, practically speaking, what stops this from collapsing into one party unilaterally being nice for nothing in return?
  *   **Likely Answer:** She'll argue that enforcement isn't physical but logical; if we run similar decision algorithms, my choice to defect *is* her choice to defect, so I hurt myself by hurting her.
  *   **Follow-up:** But isn't that "logical correlation" just a common-cause dependency in disguise? If our algorithms match, it's because we share a causal past (physics, evolution, design). So aren't we just describing a very long causal chain, not truly acausal trade?

  **2. The Framework Choice (CDT vs. FDT)**
  *   **Question:** To make this math work, you seem to have to abandon Causal Decision Theory (CDT) in favor of Evidential or Functional Decision Theory. But CDT is built on the intuition that you can't influence what you can't touch. Why should we accept that switching to a friendlier framework isn't just rigging the game to get the answer you want?
  *   **Likely Answer:** She'll claim CDT is demonstrably flawed in Newcomb-like scenarios and leaves value on the table, whereas FDT captures the actual dependencies that determine outcomes.
  *   **Follow-up:** If CDT matches our intuitive understanding of physical causality and FDT requires us to act *as if* we can influence the past or parallel worlds, aren't you asking us to buy a "rationality" that feels indistinguishable from magic just to save the theory?

  **3. The Bargaining Problem (The Split)**
  *   **Question:** Let's say we accept the trade is possible. We can't communicate to negotiate terms. How do two isolated agents land on a specific split of the gains—say, 50/50—rather than each quietly simulating the other and imagining a split that favors themselves?
  *   **Likely Answer:** She'll lean on Schelling points or "focal points"—natural salient solutions like symmetry or fairness norms that independent agents will converge on.
  *   **Follow-up:** Symmetry is only salient if we value the same things equally. If I value my own utility ten times more than yours by definition, my "fair" Schelling point is 90/10. What mechanism forces me to adopt your weighting of the split?

  **4. The Identification Problem (The Blackmailer)**
  *   **Question:** In the real world, I run a background check before I trust a partner. Across a cosmological horizon, I can't verify who you are. How do I distinguish a genuine trading partner from an acausal blackmailer who is simulating me just to extort me?
  *   **Likely Answer:** She'll suggest pre-commitment strategies: you publicly (or logically) commit to ignoring blackmail, which filters out blackmailers who predicted that commitment.
  *   **Follow-up:** But if I pre-commit to ignoring blackmail, doesn't that make me a target for *smarter* blackmailers who know I can't back down? Aren't you suggesting I blindfold myself to avoid being robbed, which just makes the robbery easier?

  **5. The Computational Cost**
  *   **Question:** To trade with you acausally, I presumably have to simulate your decision process accurately enough to know you'll hold up your end. If you're a complex agent, that simulation might cost more energy than the trade is worth. Does this theory only work for simple agents?
  *   **Likely Answer:** She'll argue that we don't need a perfect simulation, just a good enough model of the *decision rule*, which can be compressed even if the agent is complex.
  *   **Follow-up:** But if the model is compressed enough to be cheap, isn't it too lossy to trust with high-stakes trade? Where is the break-even point where the cost of trust exceeds the value of the transaction?

  **6. The Reference Class Problem**
  *   **Question:** This trade relies on me thinking, "Agents like me will do X." But who counts as "like me"? Do I trade with humans, aliens, AIs, or rocks? How do I define the reference class without arbitrarily excluding partners or including non-agents?
  *   **Likely Answer:** She'll say the reference class is defined by functional similarity—any system implementing the same relevant decision algorithm counts.
  *   **Follow-up:** But I can't observe their internal algorithm, only their output. If I misclassify the reference class, I defect when I should cooperate. Isn't the risk of classification error high enough to kill the expected value?

  **7. The Updatelessness Requirement**
  *   **Question:** Functional Decision Theory often requires being "updateless"—acting as if you don't know specific information you actually possess. Are you seriously suggesting that to be rational, I should sometimes ignore evidence I've already observed?
  *   **Likely Answer:** She'll clarify that it's not ignoring evidence, but choosing a policy *before* the evidence is screened off, to optimize the outcome across all possible branches.
  *   **Follow-up:** But I live in *this* branch, with *this* evidence. If I sacrifice my outcome here to help a version of me in a branch I can never access, haven't I just lost utility in the only reality I can actually experience?

  **8. The Ethical Obligation**
  *   **Question:** You started by saying we might "owe something" to agents we can't touch. If acausal trade works, does that mean I have a moral duty to sacrifice resources now to help suffering beings in other multiverse branches I can never verify?
  *   **Likely Answer:** She'll likely say yes—if you accept the decision theory, you accept the obligations that come with being part of that logical network.
  *   **Follow-up:** That sounds like an infinite demand. There could be infinite suffering branches. If I owe them help, isn't my rational obligation to devote my entire life to acausal aid, rendering normal life irrational?

  **9. The Empirical Evidence (The Closer)**
  *   **Question:** I'm a physicist; I need to know what changes in the lab. What kind of evidence, even in principle, could tell us acausal trade is doing real work, versus it just being a comforting story about why it's good to be the cooperative type?
  *   **Likely Answer:** She'll probably admit there's no direct empirical test, arguing it's a normative framework for rationality, not a descriptive theory of physics.
  *   **Follow-up:** If it changes no predictions and leaves no empirical footprint, why shouldn't I classify this as theology for atheists—a belief system that feels rigorous but ultimately rests on faith in logical connections we can't verify?
