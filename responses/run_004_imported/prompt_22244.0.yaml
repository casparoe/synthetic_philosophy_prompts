  Here is a breakdown of the grading based on philosophical accuracy and prompt adherence. You were right to feel stuck between an A- and a B+; the writing quality and the reconstruction of the core argument (parts a and b) are A-level work, which pulls the grade up. However, part (c) contains a fundamental misunderstanding of Anscombe's position that prevents it from being an A-range answer in a philosophy context.

  Anscombe explicitly wrote "Mr. Truman's Degree" to show that **non-pacifists** (specifically traditional Just War theorists) should object to Truman. She argues that you do not need to be a pacifist to condemn the bombings; you only need to accept that intentionally killing innocents is forbidden. The student claims her position *is* pacifism ("really just pacifism under another name"), which contradicts the text's main rhetorical goal. Additionally, Anscombe did not invent the Doctrine of Double Effect (it dates to Aquinas); she applied it.

