  ### TA Sanity Check Notes:
  *   **Why not an A-?** In philosophy seminars, distinguishing a author's self-conception from their implications is crucial. Anscombe's essay is famous precisely because she insists she isn't a pacifist. Grading this as an A- might signal to the student that conflating "strict Just War theory" with "pacifism" is acceptable, which will hurt them on future essays.
  *   **Why not lower?** Parts (a) and (b) are the heavy lifting of the question. The student clearly understands the *mechanism* of Anscombe's ethics (DDE), which is the hardest conceptual hurdle. The error is contextual/historical, not mechanical.
  *   **Feedback Tip:** When returning this, you can validate their strong grasp of Double Effect while noting: "Be careful not to conclude Anscombe is a pacifist; her point is that even those who accept legitimate warfare must condemn this specific act."
