answer: |-
  This is a fantastic observation. You have put your finger on the exact mathematical nerve that connects solid-state physics to foundational decision theory. You are absolutely right: mathematically, the Madelung constant problem and the Pasadena paradox are siblings. They are both manifestations of the Riemann Rearrangement Theorem applied to conditionally convergent series.

  However, the reason one is treated as a "technical nuisance" and the other as a "foundational crisis" lies not in the math, but in the **ontology** and the **normative force** of the respective fields.

  Here is the breakdown of why your physicist's intuition works for crystals but runs into a wall in decision theory, and whether decision theorists are just being fussy.

  ### 1. The Madelung Case: Physics Provides the Regulator
  In your field, the "paradox" (that the sum depends on the order) is resolved by the physical reality of the system.

  *   **The Idealization:** The infinite lattice is an idealization of a finite crystal.
  *   **The Physical Limit:** A real crystal grows. It has a shape (sphere, cube, needle). As you take the thermodynamic limit ($N \to \infty$), you must specify *how* $N$ goes to infinity.
  *   **The Resolution:** The "summation order" corresponds to the **geometry of the boundary**. If you sum in spheres, you are modeling a spherical crystal. If you sum in cubes, you are modeling a cubic crystal.
  *   **The "Smuggling":** You noted that physicists "smuggle in" a physically sensible ordering. This is correct, but it isn't illegitimate! It is **empirically mandated**. The electrostatic potential of an ionic crystal *actually depends on the macroscopic shape* due to surface charges (the depolarization field).

  So, in physics, the ambiguity in the math reflects an ambiguity in the physical state. The theory (electrostatics) is complete; it correctly predicts that energy density depends on boundary conditions. Ewald summation is just a computational trick to calculate the limit defined by those physical boundary conditions efficiently. The "fact of the matter" is provided by the crystal's shape.

  ### 2. The Pasadena Case: Normativity Lacks a Boundary
  The Pasadena paradox (constructed by Nover and Hájek, 2004) involves a gamble where the expected utility series is conditionally convergent.

  *   **The Idealization:** The gamble is a probability distribution over outcomes.
  *   **The Normative Goal:** Expected Utility Theory (EUT) is not descriptive; it is **normative**. It is supposed to tell a rational agent how they *ought* to value a gamble, independent of how the gamble is described or processed.
  *   **The Problem:** In the Pasadena game, there is no physical "shape" to the gamble. The "order of summation" corresponds to the order in which an agent considers the outcomes, or how the probability space is indexed.
  *   **The Crisis:** If the "rational value" of the gamble depends on the indexing of the probability space, then rationality is **frame-dependent**.

  In physics, if the energy depends on the shape, nature is telling you something real. In decision theory, if the value of a gamble depends on the order you write down the outcomes, the theory is telling you that **rationality is arbitrary.**

  ### 3. Can Decision Theorists "Pull a Madelung"?
  You asked if decision theorists could defuse this the way physicists did: *pick a well-motivated summation order and move on.*

  Some have tried. This is essentially the strategy of **truncation** or **finite approximation**. You treat the infinite gamble as the limit of a sequence of finite gambles.
  *   **The Physicist's Move:** Define the limit by "spheres" (e.g., order by probability magnitude).
  *   **The Decision Theorist's Obstacle:** Which ordering is "natural"?
      *   Order by probability? (Most likely outcomes first).
      *   Order by utility? (Best outcomes first).
      *   Order by time? (If the payoff occurs at step $n$).

  In the Pasadena construction, the probabilities and utilities are entangled specifically so that these natural orderings conflict or still yield undefined limits.

  More importantly, adopting a specific ordering principle violates standard axioms of rationality, specifically **Independence** or **Dominance**.
  *   **Dominance:** If Gamble A pays more than Gamble B in every state, you should prefer A.
  *   **The Issue:** With conditionally convergent utilities, you can construct scenarios where reordering terms makes Gamble B look better than A, even if A dominates B state-wise. If you pick a specific summation order to fix the value, you often have to sacrifice the principle that "more money is better than less" in the infinite limit.

  ### 4. The "Smuggling" Accusation: Is Physics Illegitimate?
  You asked: *"Does our physicists' move secretly smuggle in something just as illegitimate as whatever's going on in Pasadena?"*

  **No, but it highlights a hidden assumption.**
  The physicist's move smuggles in **context**. It assumes the system is embedded in a macroscopic environment that imposes boundary conditions.
  *   **Physics:** Context is physical (shape, surface). It is unavoidable.
  *   **Decision Theory:** Context is psychological or descriptive (framing, attention). Standard EUT assumes rationality should be **context-independent**.

  The Pasadena paradox suggests that standard EUT is like trying to calculate the Madelung constant without specifying the crystal shape. It's an ill-posed problem.

  However, physicists accept that energy depends on shape. Decision theorists are reluctant to accept that *rational value* depends on the "shape" of the description. If you admit that, you are no longer doing classical Decision Theory; you are doing **Bounded Rationality** or **Context-Dependent Choice**.

  ### 5. Conclusion: Nuisance vs. Paradox
  The difference comes down to **Descriptive vs. Normative**.

  1.  **Madelung (Descriptive):** The math was ambiguous, but the world was not. The world provided the boundary conditions (the shape). The "paradox" was just our failure to model the boundary. Once we added the shape, the number was unique.
  2.  **Pasadena (Normative):** The math is ambiguous, and the "world" (the abstract gamble) provides no boundary conditions. If we impose them (e.g., "agents only consider the top 99% of probabilities"), we are changing the definition of rationality to be finite/context-dependent.

  **Verdict:**
  You are right that the mathematical pathology is identical. But the Pasadena paradox is a deeper philosophical problem because it attacks the **uniqueness of rational preference**.
  *   In physics, if the sum depends on the order, we say: "The energy depends on the shape." (Feature of nature).
  *   In decision theory, if the value depends on the order, we say: "Rationality is ill-defined." (Bug in the theory).

  Decision theorists *could* do what you did: declare that "Rational Expectation" is only defined for gambles that converge absolutely, or define it relative to a specific "growth path" of information (like a crystal growing). But doing so requires abandoning the dream of a universal, context-free Expected Utility Theory.

  So, the physicists didn't cheat; you just had the advantage that nature enforces boundary conditions. Decision theorists are struggling because they are trying to find boundary conditions for "rationality" in a void where none obviously exist. The Pasadena paradox is the sound of them realizing that "infinite utility" might be as physically unrealizable as an "infinite crystal," and that treating it as a Platonic object breaks the theory.
