      *   *R Argument:* If you discard the plan now, you prove you never really had the capacity. You got lucky the scanner was shallow. But for *true* rationality, you must drink.
      *   *The Hard Questions:*
          *   R to S: If the billionaire is reliable, he predicts you won't drink. So he wouldn't have wired the money. The fact he did means you're misinterpreting "reliable."
