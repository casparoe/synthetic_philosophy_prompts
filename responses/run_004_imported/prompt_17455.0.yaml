answer: |-
  The sun was high enough to burn the dust motes dancing over the mahogany table. On the screen of a smartphone, a banking notification glowed: *+$1,000,000.00*. Beside it sat a small glass vial, uncorked. The liquid inside was viscous and blue. It would induce twenty-four hours of vomiting and migraines. It would not kill.

  Elias, the resolute-choice theorist, leaned forward. His hand hovered over the vial.

  "Don't," said Mara, the sophisticated-choice theorist. She didn't reach out to stop him; she simply sipped her coffee. "The transaction is complete. The causal arrow points one way."

  "The transaction is complete," Elias agreed. "But the agent is not."

  "Utility is calculated over world-states, Elias. Not over narrative arcs. In the current world-state, you have the million. If you drink, you have the million minus the toxin. If you don't, you have the million. The dominance principle is screaming at you."

  Elias picked up the vial. The glass was cool. "If I put it down, I prove that last night I was lying. Not to the billionaire. To myself."

  "You formed the intention," Mara said. "That was the condition. The billionaire's scanner measured your neural correlates of intent at 11:00 PM. They fired. You got paid. What happens at 11:00 AM is a new decision node. To drink now is to pay a cost for a benefit that has already been realized. That isn't integrity. It's the sunk cost fallacy with extra steps."

  "It isn't sunk," Elias said. "Because the benefit wasn't just the money. The benefit was establishing that I am an agent who can bind their future self. If I renege now, I reveal that my 'intention' was merely a prediction of my behavior that turned out to be false. I didn't intend; I guessed wrong."

  Mara set her cup down. "This is the mysticism I'm trying to avoid. Intention is a mental state. I can genuinely intend to meet you for lunch while acknowledging a non-zero probability that a meteor might strike. If the meteor strikes, I didn't 'fail' to intend. And if I decide not to come because I found a better offer, I didn't lie at 11:00 PM. I updated. Rationality requires time-consistency. You cannot rationally plan to do X tomorrow if you know today that you will not want to do X tomorrow."

  "Then you cannot rationally plan *at all*," Elias said. "You are just a sequence of temporal slices passing a bucket of utility down the line, stealing from the next holder whenever it suits you. If I drink, I validate the capacity for planning. I show that my future actions are not just slaves to my future impulses."

  "Or," Mara countered, "you show that you value ritual over welfare. But let's hit the steelman. You asked me last night how I could possibly have secured the funds. If I am truly sophisticated, I knew last night that I would not drink this morning. If I knew that, I could not have formed the intention. The billionaire is reliable. He should have seen the reneging in the stars of my brain and wired nothing."

  Elias lowered the vial slightly. "Exactly. That is the hole in your boat. If the billionaire is a perfect predictor of action based on intention, he knows you are sophisticated. He knows you will calculate exactly this way this morning. Therefore, he knows you cannot intend. Therefore, you shouldn't have the money. The fact that the money *is* here suggests either the billionaire is flawed, or your model of agency is."

  Mara smiled, thin and sharp. "The billionaire scans for *sincerity*, not *prophecy*. Last night, I looked at the vial and I felt the weight of the reward. I genuinely told myself, 'I will drink this.' I wasn't lying. I was experiencing the qualia of intention. But part of my rationality is acknowledging that my future self has better information—specifically, the information that the money is already safe. The billionaire saw a sincere agent. He just didn't account for the fact that a rational agent updates on new data. The wiring of the funds *is* the new data."

  "So you tricked him."

  "I satisfied the contract. He bought an intention. He got one. He didn't buy a slave."

  Elias shook his head. "That's not intention. That's a temporary delusion. And that brings me to my worry. You talk about updating. I talk about stability. But how do I know I'm not just engaging in self-deception? How do I distinguish 'resolute choice' from 'stubbornly hurting myself because I'm too proud to admit my plan is obsolete'? If I ignore the payoff matrix in front of me to honor a past version of myself, aren't I just worshipping a ghost?"

  Mara leaned in. "Yes. That is exactly what you are doing. You are letting a dead man walk the living."

  Elias took a breath. He looked at the blue liquid. "No. Because the dead man is me. Rationality isn't just about maximizing output at every discrete node. It's about the integrity of the function over time. If I define my utility function to include 'being the kind of person who keeps commitments to myself,' then drinking *is* utility-maximizing. It's not self-deception to value your own coherence. Self-deception is pretending the cost doesn't exist. I see the cost. I accept it as the price of admission to being a unified agent."

  "But where is the mechanism?" Mara pressed. "You say you 'accept the cost.' But when the moment comes, the pain is real. The dopamine fires. The nausea is real. How do you cognitively override the immediate negative utility without lobotomizing yourself? If you have to trick yourself into drinking, you've admitted that the rational choice is *not* to drink, and you're employing irrational means to achieve it. You're breaking rationality to save the appearance of rationality."

  Elias paused. The vial trembled slightly in his grip. "Maybe. Or maybe 'rationality' as you define it—maximizing local advantage—is the error. If I can't drink this, I am not an agent. I am a weather system. I react. If I drink, I act."

  "And if you drink," Mara said softly, "you vomit for a day. You lose productivity. You suffer. For what? To prove a point to a billionaire who isn't in the room? To prove a point to yourself, when the self that needs proving is the one holding the vial, not the one who signed the contract?"

  "To prove that the signature matters," Elias said.

  "The signature got the money," Mara said. "The ink is dry."

  Elias stared at the liquid. He could feel the sophisticated argument grinding against his bones. It was clean. It was logical. It was hollow. He knew that if he put the vial down, he would feel a specific kind of shame, a fracturing of his self-concept. But if he drank, he would feel physical sickness for a theoretical virtue.

  "The billionaire," Elias said, his voice quiet. "If he's truly reliable, he knows you're sitting there right now telling me not to drink. He knew you'd say that. So why did he wire the money?"

  "Because he knows I'm rare," Mara said. "Most people are resolute. They drink. They get sick. They prove his theory of human nature. I am the edge case that proves his theory of economics. He paid for the data. I gave it to him."

  "He paid for a toxin-drinker," Elias said. "You gave him a liar."

  "I gave him a sophisticated agent," she corrected. "Which is harder to find."

  Elias lifted the vial. The smell was chemical, sharp. "If I drink, I might be a fool. But if I don't, I'm definitely a fragment."

  "And if you do," Mara said, watching his hand, "you're a martyr to a definition of rationality that requires you to burn your own fingers to prove they belong to you."

  Elias held the vial to the light. The blue caught the sun. He did not drink. He did not set it down. He existed in the tension, the money glowing on the screen, the poison open in his hand, the silence of the room filling up with the unanswerable weight of what it means to be a self that persists through time.

  "Pass the water," Elias said finally.

  Mara pushed the pitcher across the table. "For after?"

  "For during," Elias said. "Whichever way this goes."
