      *   **Characters:**
          *   Resolute-Choice Theorist (McClennen's label): Believes you should drink because you committed to it. Follow-through is part of rationality.
          *   Sophisticated-Choice Theorist (McClennen's label): Believes you shouldn't drink because the money is already there. Drinking is irrational now.
      *   **Setting:** The morning *after* the money has been wired. The vial is open on the table.
      *   **Key Questions to Address:**
          *   Resolute: What separates genuine plan-stability from self-deception?
          *   Sophisticated: Why would a reliable billionaire not have seen through the sophisticated agent's foreknowledge that they would renege?
      *   **Constraint:** Neither side lands a clean knockout (draw/stalemate).

  2.  **Deconstruct the Philosophical Positions:**
      *   *Kavka's Toxin Puzzle:* A billionaire offers $1M if you *intend* tonight to drink a toxin tomorrow that makes you sick for a day (no long-term harm). You get the money if you form the intention. You don't actually have to drink it to get the money, just intend. But if you know you won't drink it, you can't form the intention.
      *   *Sophisticated Choice (Standard CDT/EDT view mostly):* Rationality is time-consistent. At the moment of action, you maximize utility based on current state. Money is in the bank. Drinking causes pain. Therefore, don't drink. *Problem:* If you know you're sophisticated, you know you won't drink, so you can't form the intention, so you don't get the money.
      *   *Resolute Choice (McClennen/Bratman/Gauthier view):* Rationality involves sticking to plans. You can bind your future self. If you committed last night, you drink today to honor that commitment. *Problem:* How do you actually do this without magic? Isn't it just lying to yourself?

  3.  **Drafting - Scene Setting:**
      *   Needs to feel like a LessWrong meetup or a private salon. Coffee, maybe silence.
      *   The vial needs to be present. A physical prop.
      *   The bank notification needs to be visible (phone screen).

  4.  **Drafting - The Dialogue Flow:**
      *   **Opening:** Establish the situation. Money is there. Vial is open.
      *   **Sophisticated Opening:** "We won. Don't drink." (Focus on consequentialism of the *now*).
      *   **Resolute Opening:** "We cheated if we don't drink." (Focus on integrity of the agent over time).
      *   **Exchange 1 (The Nature of the Act):** Sophisticated says drinking is utility-negative. Resolute says drinking validates the capacity to intend.
      *   **Exchange 2 (The Hard Questions):**
          *   Resolute asks Sophisticated: How did you get the money if the billionaire predicts you'd renege? (The "Screening Off" problem).
          *   Sophisticated asks Resolute: How is this not just self-deception/akrasia? (The "Transparency" problem).
      *   **Closing:** Acknowledging the impasse. The nature of agency remains mysterious.

  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Critique:* Make sure the Sophisticated agent doesn't sound like a simple hedonist. They care about rationality, not just pain avoidance. They care about *correct* reasoning.
      *   *Critique:* Make sure the Resolute agent doesn't sound like a deontologist blindly following rules. They need to argue that *being the kind of agent who follows through* is the instrumental good.
      *   *The Billionaire Loophole:* In the original puzzle, the billionaire scans *intention*, not action. The Sophisticated agent has to explain how they convinced the scanner if they knew they wouldn't drink.
