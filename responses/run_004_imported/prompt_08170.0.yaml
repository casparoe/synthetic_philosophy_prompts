  Ok, this one's a bit random but it's been bugging me all week. I sit on the editorial standards committee at the outlet I write for most, and we've got a genuinely hard case up for a vote. A reporter wants six months of paid time to go properly undercover inside a wellness-to-conspiracy pipeline group -- posing as a real convert, posting under the fake identity, the whole thing, not just flashing a fake name for one interview. Our policy (basically the SPJ line) allows deception as a "last resort" when a story's in the public interest and can't be gotten any other way -- that's how we'd justify something like Nellie Bly getting herself committed to expose the asylum. But half the committee thinks months of sustained, sincere-seeming lying to people who'll actually trust and confide in her is a different animal then a one-off cover story, not just a longer version of it. I went down a rabbit hole on this and apparently Augustine faced almost this exact dilemma for real -- a guy named Consentius asked his blessing to send Catholic agents undercover among the Priscillianist heretics to expose them, and Augustine flatly said no, not even for that cause. Can you draft the short memo I need to circulate before Thursday's vote? It should come down on approve, reject, or approve-with-conditions, give a concrete plan and timeframe, and actually engage the side you don't pick instead of just nodding at it.
