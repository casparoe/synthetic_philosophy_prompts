          *   *Key Distinction:* Van Inwagen: Organisms exist (composites). Artifacts do not.
          *   *Merricks:* Organisms do *not* exist (as composites). Persons exist (but are not organisms/composites in the standard sense).
          *   *Student's Error:* The student claims Merricks accepts Organicism ("organisms compose, nothing else does"). This is the opposite of Merricks's nihilism. Merricks argues *against* the existence of organisms as composite entities.
          *   *Score:* 1/5 or 2/5. This is a major substantive error on the core philosophical position of one of the three main figures mentioned.

