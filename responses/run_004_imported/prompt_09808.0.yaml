          *   *Assessment:*
              *   "Nihilist": Van Inwagen is often classified as an *ontological nihilist* regarding inanimate composites, but he accepts organisms. Calling him a "nihilist" simpliciter can be slightly misleading (he's not a *mereological nihilist* in the strict sense that *nothing* composes), but in the context of intro metaphysics, distinguishing between "nihilism about artifacts" and "organicism" is usually sufficient.
              *   "Organicism... activity constitutes a life": This is the correct formulation of van Inwagen's condition.
              *   *Nuance Check:* Van Inwagen explicitly denies composition for artifacts. The student captures this.
              *   *Score:* 5/5. (Maybe a tiny nitpick on "nihilist" label, but functionally correct for undergrad level).

      *   **Section 3: Argument from Vagueness (Lewis vs. van Inwagen).**
          *   *Student:* "Van Inwagen rules out answers like contact... because they make composition a matter of degree... existence doesn't come in degrees."
          *   *Critique:* This is slightly imprecise. Van Inwagen uses the argument from vagueness to argue *against* moderate restricted composition (like contact/fastening). He thinks if composition is restricted, it must be non-vague. Since "life" is the only non-vague boundary he can find, he picks that.
          *   *Student:* "Lewis and other universalists take that exact same premise (no vague existence)... any restricted answer to the SCQ, including 'life,' will have sorites-style borderline cases... so if you rule out vagueness you can't have a restricted answer at all."
          *   *Critique:* This is the crux. Lewis argues that *any* restriction leads to vagueness. Van Inwagen argues that *some* restrictions (like life) do *not* lead to vagueness (or at least, life is a natural joint).
          *   *Error Detection:* The student says Lewis argues "including 'life'... will have sorites-style borderline cases." This is correct regarding Lewis's critique of van Inwagen.
          *   *Error Detection:* The student says van Inwagen rules out contact/fastening because they make composition vague. Correct.
          *   *Error Detection:* The student says Lewis concludes "Since nihilism is too costly..." Wait. Lewis doesn't argue from "nihilism is too costly." Lewis argues from the premise that existence cannot be vague + the premise that restricted composition entails vague existence -> therefore composition must be unrestricted. The "cost" of nihilism isn't Lewis's primary driver; the logic of vagueness is. However, Lewis does think nihilism is false because we obviously have parts.
          *   *Major Issue:* The student implies van Inwagen uses the argument from vagueness to *support* his answer. Van Inwagen uses it to *clear the field* of other restricted answers, then posits life as the non-vague exception. Lewis uses it to smash *all* restricted answers (including life).
