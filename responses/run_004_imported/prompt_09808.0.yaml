          *   *Causal Overdetermination:* Merricks *does* use the causal overdetermination argument. But he uses it to eliminate *all* composites, including organisms. He argues that if persons exist, they don't have physical parts in the way organisms do, or that the "person" is not the "organism." Actually, Merricks's view is nuanced: He thinks *persons* exist, but *organisms* (as composites) do not. He is a nihilist about *material objects*. Van Inwagen is a realist about organisms.
