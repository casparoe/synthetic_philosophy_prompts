answer: |-
  **Setting:** *The dimly lit bar of the Grand Hyatt, during the annual Society for Decision Theory conference. Most attendees have migrated to the dance floor or gone to bed. At a high-top table near the back, a grad student named Leo is holding a crumpled dollar bill over a ashtray. Two figures, ALEX and BLAKE, stand over him. Alex is wearing a rumpled blazer; Blake is nursing a gin and tonic.*

  **Leo:** (Grinning) Rules are simple. Bids in fifty-cent increments. Highest bidder gets the buck. But remember: second-highest bidder pays their bid and gets nothing.

  **Alex:** (Tossing a quarter on the table) Fifty cents. Easy money.

  **Blake:** (Sighs, sliding over fifty cents) I can't believe we're doing this. Seventy-five.

  **Alex:** A dollar.

  **Blake:** (Pauses) A dollar and fifty.

  **Alex:** (Stiffens) Two dollars.

  **Leo:** (Eyes wide) We're at two dollars for a single?

  **Alex:** (Ignoring Leo, eyes on Blake) You're trapped, Blake. You bid $1.50. If you quit now, you lose $1.50. If you bid $2.00 and I quit, you lose $1.00. You're minimizing loss. It's strictly dominant.

  **Blake:** It's dominant only if you accept the premise that this node exists in isolation. It doesn't. I'm not playing the node, Alex, I'm playing the game. And the game was rigged at the entry point.

  **Alex:** (Slides another fifty cents in) Two-fifty. The entry point is water under the bridge. That's the definition of sunk cost. You don't look backward, you look forward. Forward, the marginal cost of bidding is fifty cents. The marginal benefit is avoiding a $1.50 loss. Do the math.

  **Blake:** (Puts in a dollar bill, voice tight) Three-fifty. The math is fine, the *architecture* is broken. You're arguing for myopic sequential rationality. You're saying a rational agent re-optimizes at every tick of the clock. But if you know you're the kind of agent who re-optimizes into a pit, the rational move is to be the kind of agent who doesn't.

  **Alex:** (Laughs, a sharp sound) So I'm irrational because I'm responsive to incentives?

  **Blake:** You're irrational because you're predictable. I should have pre-committed. "I will bid fifty cents, and if outbid, I walk." If I had bound myself to that rule—Ulysses and the Sirens—I wouldn't be bleeding three-fifty right now. By staying "open to reconsideration," I'm signaling to you that I'm exploitable.

  **Alex:** (Slams a five-dollar bill down) Four-fifty! And don't give me that resolute choice nonsense. You can't just *will* yourself to ignore a better option when it's right in front of you. If I'm at $4.50 and you're at $4.00, and I quit, I lose four bucks. If I bid five, I might lose four-fifty, but I might win. You're saying I should burn four bucks to prove a philosophical point about consistency?

  **Blake:** (Digging into a wallet, hands shaking slightly) Five-fifty. It's not a philosophical point, it's a causal one. Your "rationality" is the engine of the trap. If both of us were truly rational, we would have recognized the structure as a non-cooperative prison and refused to engage past the dollar mark. Or better, colluded.

  **Alex:** Collusion is unstable! You know that. As soon as we agree to split it, one of us bids another fifty cents to flip the loss. That's the Nash Equilibrium of this specific subgame. I'm just playing the equilibrium!

  **Blake:** Then the equilibrium is insane! That's the point of the literature! If your model of rationality predicts that two PhDs burn six dollars to win one, maybe the model is the problem, not the agents.

  **Alex:** (Leaning in, voice dropping) Six dollars. Look at me, Blake. You're currently the second bidder. You're on the hook for five-fifty. If you quit, you lose five-fifty. If you bid, you're on the hook for six, but you only pay if I quit. You're arguing for "policy" because you're terrified of realizing the loss. You're the one suffering from the sunk cost fallacy, wrapped in fancy terminology.

  **Blake:** (Eyes narrowing) And you're arguing for "marginal utility" because you're currently the high bidder and you want me to fold so you can walk away with a $4 loss instead of a $6 loss. Your "rationality" conveniently aligns with your current position in the queue.

  **Alex:** That's ad hominem. The math holds regardless of who says it.

  **Blake:** The math holds only if we assume the utility of money is linear and the utility of "being right" is zero. But I'm not trying to win the dollar anymore. I'm trying to punish your strategy. If I bid seven-fifty, I'm not buying the dollar. I'm buying the lesson that *you* learn tonight.

  **Alex:** (Stares at the dollar bill. It looks pathetic now, small and green against the pile of cash.) You're threatening mutual destruction.

  **Blake:** I'm threatening to make your "locally rational" moves globally catastrophic. If you know I'm a resolute chooser, you know I will bid up to twenty dollars just to prove that pre-commitment beats myopia. Do you want to test my utility function?

  **Alex:** (Sweat on his brow) You're bluffing. You're a decision theorist. You maximize expected utility.

  **Blake:** My utility function includes not being exploited by a myopic optimizer. Bid, Alex. Let's see where your marginal analysis takes you.

  **Alex:** (Hand hovers over his wallet. He looks at Leo, who has stopped smiling and looks slightly concerned.)

  **Leo:** Uh, guys? I can just give you the dollar back if you—

  **Alex & Blake:** (In unison) Shut up, Leo.

  **Alex:** (Takes a deep breath) Here's the thing, Blake. If I bid eight-fifty, you bid nine. Then I bid nine-fifty. We're just transferring wealth to Leo.

  **Blake:** Exactly. So stop.

  **Alex:** I can't stop. If I stop at eight-fifty, I lose eight-fifty. If I bid, there is a non-zero probability you run out of cash or nerve.

  **Blake:** There is a zero probability I run out of nerve. I have already accepted the loss. Have you?

  **Alex:** (Freezes)

  **Blake:** That's the difference. You're still trying to *win*. I've already lost. I'm just deciding how expensive my education is. Are you willing to pay more for yours?

  **Alex:** (Hand slowly retreats from his wallet. He looks at the dollar, then at Blake, then at the pile of cash.)

  **Blake:** (Quietly) The rational move isn't the one that minimizes the loss at $t_{now}$. It's the one that prevents the agent from entering states where that calculation is necessary.

  **Alex:** (Exhales, long and ragged) So I'm the fool for doing the math?

  **Blake:** You're the fool for thinking the math exists in a vacuum.

  **Alex:** (Pushes the dollar bill toward Blake) Take it.

  **Blake:** I'm not paying you for it.

  **Alex:** I'm not selling it. I'm folding. I'm exercising the option to terminate the sequence.

  **Blake:** (Nods) Good.

  **Alex:** But I'm not paying my second-place bid either.

  **Blake:** (A small, tired smile) Leo's not going to like that.

  **Alex:** Leo started a game based on the assumption that academics are rational actors. He should have known better.

  **Leo:** Hey! The rules said—

  **Alex:** (Stands up, grabbing his coat) The rules assumed we'd stop at a dollar. We invalidated the contract by revealing the flaw in the underlying game theory.

  **Blake:** (Standing up as well, leaving a twenty on the table for the drinks) Come on. Let's go get a coffee. My treat.

  **Alex:** That's another sunk cost.

  **Blake:** No. It's a coordination payment. To ensure we don't talk about this for the rest of the conference.

  **Alex:** (Pauses at the door) Ten dollars?

  **Blake:** Twenty.

  **Alex:** ...Deal.

  *(They walk out, leaving Leo staring at the pile of cash and the single dollar bill, which nobody actually took.)*
