          *   *Follow-up:* If she says "P.F. changed the subject," ask if philosophy should change the subject to solve human problems.

      *   *Q4: Psychological Tension.* (Required)
          *   *Draft:* You feel responsible even if you know the argument. What does that mean?
          *   *Refinement:* Galen admits we can't shake the feeling. Is the argument self-undermining if we can't live by it?
          *   *Follow-up:* If she says "It's a cognitive illusion," ask if we should try to eradicate it or accept it.

      *   *Q5: The Regress Itself.*
