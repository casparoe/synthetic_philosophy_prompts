answer: |-
  Here are nine interview questions designed to bypass the standard syllogism and press on the philosophical pressure points of your guest's revival of the Basic Argument. Each includes a "pivot" follow-up to handle the most common defensive maneuvers.

  ### 1. The "Ultimate" Distinction
  **Question:** You draw a hard line between 'ultimate' responsibility—the cosmic, desert-entailing kind—and the 'everyday' responsibility compatibilists use to run courtrooms and friendships. Critics often call this a motte-and-bailey tactic: you retreat to the 'ultimate' definition to win the metaphysical argument, but then rely on the 'everyday' version to avoid sounding like a nihilist. Is that distinction doing real philosophical work, or is it just a relabeled retreat to save our intuitions from the bullet you just bit?

  *   **Follow-up:** If she says the distinction is necessary to preserve moral practice, ask: *"If the everyday version works for all practical purposes, why does the 'ultimate' version matter enough to declare the whole concept of responsibility false? Are we arguing about physics, or just semantics?"*

  ### 2. The Indeterminism Trap
  **Question:** Galen Strawson argues that adding indeterminism doesn't save responsibility because randomness isn't control. But I want to push that further: doesn't indeterminism actually make the problem *worse* for the responsibility skeptic? If my actions aren't determined by my character, they're essentially random events. Isn't swapping 'shaped by factors outside my control' for 'shaped by nothing at all' a worse foundation for agency, not a better one?

  *   **Follow-up:** If she says indeterminism allows for 'open futures,' ask: *"But an open future doesn't give me authorship. If the choice isn't determined by me, but also isn't random, what third option is left that isn't just magic?"*

  ### 3. The Strawson Family Feud
  **Question:** It's the famous philosophical family feud: your position relies on Galen Strawson's Basic Argument, but his father, P.F. Strawson, built modern compatibilism on 'reactive attitudes' in *Freedom and Resentment*. P.F. argued we don't need metaphysical freedom to justify blame; we just need the human practice of resentment. Does the Basic Argument actually refute P.F. Strawson's naturalistic move, or does it just insist he was never answering the 'real' question in the first place?

  *   **Follow-up:** If she says P.F. "changed the subject," ask: *"If philosophy's job is to clarify human life, and P.F.'s view clarifies it while Galen's view makes it incoherent, why is Galen's metaphysical question the one that gets to veto the other?"*

  ### 4. The Psychological Tension
  **Question:** Galen Strawson admits that even if you accept the Basic Argument as sound, you still can't help *feeling* responsible for your actions day-to-day. The belief doesn't stick to the ribs. If the argument is true, why is the illusion so cognitively impenetrable? And what does that tension tell us about how much weight the argument can actually bear if it can't govern our lived experience?

  *   **Follow-up:** If she says it's a "cognitive illusion" like a visual trick, ask: *"With visual tricks, we can measure the error against reality. With responsibility, this feeling *is* our only access to the data. If the feeling is unavoidable, on what grounds do we declare it false?"*

  ### 5. The *Causa Sui* Standard
  **Question:** The argument hinges on the idea that to be responsible, you must be *causa sui*—the cause of yourself. But Nietzsche, whom Strawson quotes, called that idea a self-contradiction. If the requirement for 'true' responsibility is logically impossible by definition, aren't we just defining responsibility out of existence? Why hold moral agency to a standard that nothing, not even God, could meet?

  *   **Follow-up:** If she says "That's just what deep desert requires," ask: *"Then isn't the conclusion simply that 'deep desert' is a incoherent concept, rather than that 'humans lack freedom'? Why blame the humans for failing a impossible test?"*

  ### 6. The Regress of Character
  **Question:** The Basic Argument says you're responsible for your actions only if you're responsible for the character that produced them. But surely there's a point where 'character formation' stops being a conscious choice and starts being biological maturation. At what point in the regress does the demand for responsibility become absurd? Are you arguing that unless I chose my DNA, I'm not responsible, or just that I didn't choose the *weights* of my desires?

  *   **Follow-up:** If she says "You didn't choose the weights," ask: *"But I can critically reflect on those weights and override them. If I can act against my strongest desire, doesn't that break the chain of 'how you are' determining 'what you do'?"*

  ### 7. Punishment and Quarantine
  **Question:** If no one is morally responsible in the basic sense, retributive punishment is unjustified. That leaves us with a quarantine model: we detain dangerous people like we detain carriers of a virus, not because they deserve it, but for safety. Does this view strip the detained person of their dignity as a moral agent? Is there a meaningful difference between locking up a murderer and locking up a tiger?

  *   **Follow-up:** If she says "We still treat them with respect," ask: *"Can you truly respect someone as a rational agent while simultaneously treating their choices as mere causal outputs to be managed? Isn't that paternalism by another name?"*

  ### 8. Rational Persuasion
  **Question:** Here's a potential self-defeat problem: If the Basic Argument is sound, then your belief in it is determined by prior causes, not by the force of the better argument. So why are you trying to persuade me? If determinism (or the lack of *causa sui*) is true, isn't this conversation just two causal systems bumping into each other, rather than a rational exchange of reasons?

  *   **Follow-up:** If she says "Reasons can be causes," ask: *"But on your view, I can't step outside the causal chain to evaluate the reasons. So how can my agreement with you be 'rational' rather than just 'caused'?"*

  ### 9. The "Deep Self" Objection
  **Question:** Compatibilists often argue that as long as your actions align with your 'deep self'—the values you identify with upon reflection—you are responsible, even if you didn't choose that deep self. The Basic Argument dismisses this because you didn't choose the deep self. But isn't 'identification' enough for personhood? Why does ownership require *creation*? I don't create my body, but I still own it.

  *   **Follow-up:** If she says "Bodily ownership isn't moral ownership," ask: *"Why not? If I identify with a desire, it's mine. If it's mine, I own the action. What extra layer of 'creation' is needed to make it morally mine?"*
