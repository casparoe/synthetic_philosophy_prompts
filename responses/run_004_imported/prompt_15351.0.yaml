      *   **Goal:** 8-9 interview questions that push on "sore spots" rather than rehashing the syllogism.
      *   **Specific Requirements:**
          *   At least one question on the distinction between "ultimate" vs. "everyday/compatibilist" responsibility (is it real work or a retreat?).
          *   At least one question on indeterminism (doesn't it make things *worse* by adding randomness?).
          *   At least one question on P.F. Strawson (Freedom and Resentment/Reactive Attitudes) vs. Galen Strawson (Basic Argument).
          *   At least one question on the psychological tension (feeling responsible despite believing the argument).
