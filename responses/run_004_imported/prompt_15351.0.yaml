  2.  **Deconstruct the Basic Argument & Common Counter-Arguments:**
      *   *The Argument:* You do what you do because of how you are. To be responsible for what you do, you must be responsible for how you are. You can't be responsible for how you are (initial conditions). Regress.
      *   *The "Ultimate" Distinction:* Compatibilists say we don't *need* ultimate responsibility, just the right kind of causal connection. Incompatibilists say that's not *real* desert.
      *   *Indeterminism:* If choices aren't determined, they are random. Randomness doesn't equal control.
      *   *P.F. Strawson:* Focuses on practices (blame/praise) and emotions (resentment/gratitude) rather than metaphysical facts. Galen says this ignores the truth condition.
      *   *Psychology:* We feel responsible even if we believe determinism. Is this an illusion? A necessary fiction?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1: The "Ultimate" Distinction.* (Required)
          *   *Draft:* You separate ultimate responsibility from everyday responsibility. Isn't this just moving the goalposts?
