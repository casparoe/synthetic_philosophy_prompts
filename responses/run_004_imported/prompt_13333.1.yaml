  *(Refining the Abolitionist point)*: Rawls actually discusses the abolitionists in IPRR. He says they violated public reason but were justified because the society was *not* nearly just (slavery existed). He implies that in a nearly just society, such violations are harder to justify. I need to make sure I capture this "ideal vs. non-ideal" distinction clearly.

