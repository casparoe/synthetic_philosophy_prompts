prompt: |-
  I sit on the small panel that resolves disputes for my company's employee-innovation program, which pays a cash bonus and gives formal "inventor of record" credit for ideas adopted into production. Two machine operators on different shifts, who don't know each other, submitted proposals eleven days apart for essentially the same fix to a recurring jam on our packaging line. The first write-up was a rough sketch with an error that meant the fix wouldn't actually have worked as written; the second, filed later, was complete and correct, and it's the version our engineers built. Both operators are demanding full credit and the full bonus, and floor staff have taken sides. The program's rule just says the prize goes to "whoever came up with the idea," and whoever wrote that line never imagined a case like this. Could you draft the memo I'll bring to the panel on Friday? It should recommend how to resolve this specific dispute, propose a general rule for ties like it going forward, and take the losing operator's side of the argument seriously rather than brush past it.
