answer: |-
  The table is scarred wood, the kind found in faculty lounges that haven't been renovated since the seventies. In the center sits a stack of poker chips. Red for ten, blue for fifty. The pot starts small: two red chips.

  **Julian** sits on the north side. **Nina** sits on the south. They are both tenured. They are both tired. They are playing a six-node Centipede Game.

  **Julian:** (Hand hovering over the chips) So. Node one. My move. Pass or Take.

  **Nina:** If you Take, you get the larger share of the current pot. I get the scraps. Game over. If you Pass, the pot grows, and it's my turn.

  **Julian:** And if we're rational, I Take. Immediately. Aumann proved it. Common Knowledge of Rationality implies Backward Induction. I Take at node one. You know I'll Take, so you'd Take at node two if you got the chance, but you won't get the chance.

  **Nina:** (Leaning back, arms crossed) That's the dogma, Julian. Not the reality. You're conflating the *solution concept* with the *epistemic conditions*.

  **Julian:** They're the same thing. If we both know we're rational, and we know we know, the logic cascades backward from the final node. At node six, I Take. You know that. So at node five, you Take. I know that. So at node four... it collapses all the way to here. To now. To Take.

  *Julian pushes two red chips into the center. He Passes.*

  **Nina:** (Raises an eyebrow) You just violated your own premise.

  **Julian:** I'm testing the resilience of your epistemic framework. I passed. The pot is now four red chips. Your move.

  **Nina:** (Fingering a chip) Here's the Binmore-Reny objection, Julian. Backward Induction requires me to reason about what you will do at node three. But to do that, I have to assume you are rational.

  **Julian:** Which I am.

  **Nina:** But you just Passed node one. Under the BI logic, Passing node one is an irrational move. It has probability zero given Common Knowledge of Rationality. So, by observing you Pass, I have observed an event that *cannot happen* if your premise is true.

  **Julian:** So you update your beliefs. You realize I'm not rational.

  **Nina:** No, I realize the *Common Knowledge* assumption is broken. If it's broken, I can no longer use it to predict your future moves. Why should I believe you'll Take at node three? You just showed me you're willing to Pass for a larger pot. Maybe you're a cooperator. Maybe you're irrational. Maybe you're trying to teach me a lesson. The backward induction chain is snapped.

  **Julian:** (Sharp) That's where you're wrong. Rationality isn't a history-dependent trait. It's a dispositional fact about the agent. It's about the *strategy*, not the path taken. I am disposed to maximize utility. My Pass was... a tremble. A slip. But my disposition remains. You must maintain the belief that I am rational *counterfactually*.

  **Nina:** "Counterfactually"? You're asking me to believe you're rational while looking at evidence that you acted irrationally. That's not epistemology, Julian, that's theology. If I see a black swan, I don't say, "All swans are white, this one is just painted." I update the theory of swans.

  *Nina pushes the chips forward. She Passes.*

  **Julian:** Pot is six reds. Node three. My move.

  **Nina:** See? I Passed. By your logic, I'm irrational too. I should have Taken the four reds. Now we're in the "off-equilibrium path." The wilderness.

  **Julian:** It's not wilderness. It's still a game tree. And the logic still holds. At node six, the pot is huge. I will Take. You know I'm utility-maximizing—dispositionally—so you know I'll Take at six. Therefore, at node five, you should Take. Therefore, at node four...

  **Nina:** ...Therefore, at node three, you should Take. Which is where you are. So Take, Julian. If you really believe the disposition matters more than the history, Take the money. Prove the disposition.

  **Julian:** (Pauses. He looks at the chips. Six reds. $60. If he Takes, he gets $40, she gets $20. If he Passes, the pot grows to eight reds.) If I Take now, I validate your claim that the game ends early. If I Pass, I validate your claim that CKR is broken.

  **Nina:** It's not about validation. It's about belief revision. When you Passed node one, I assigned a non-zero probability to you being a "Tit-for-Tat" type rather than a "Maximizer" type. Now that I've Passed, I'm signaling I might be a Tit-for-Tat type too. If you think there's a chance I'm a cooperator, your expected utility for Passing at node three might exceed Taking.

  **Julian:** But that relies on incomplete information. We're playing under the assumption of *complete* information with Common Knowledge of Rationality. You're smuggling in Harsanyi's type uncertainty to save the intuition of cooperation.

  **Nina:** Because the pure CKR model is empty! It tells me what to do at node one. It tells me nothing about what to do at node three *given that node one was Passed*. The BI solution is a set of strategies that are optimal *if* the strategies are played. But if the strategies *aren't* played—if we're here, talking, with chips in the middle—the solution concept has no grip.

  **Julian:** (Pushes chips. Passes.) It has grip because rationality is about *plans*. I planned to Take at node six. I haven't deviated from the plan yet.

  **Nina:** (Laughs softly) You Passed node three. The pot is eight reds. Node four. My move.

  **Julian:** Take it, Nina. Node six is the end. I will Take at six. You know this. So you Take at five. So you Take at four.

  **Nina:** Why will you Take at six?

  **Julian:** Because it dominates Pass. At node six, Pass gives me nothing. Take gives me the bulk.

  **Nina:** But to get to node six, you had to Pass at three. And one. You've established a pattern of Passing. Why should I believe the dominance argument at node six holds if you've ignored dominance arguments at one and three?

  **Julian:** Because at node six, there is no future. There is no strategic reason to Pass. It's purely dominated. At node one, Passing is dominated *only if* you assume I will Take later.

  **Nina:** Exactly! It's circular. You're using the conclusion to prove the premise. You say I should Take at four because you'll Take at six. But I only believe you'll Take at six because you're rational. But you weren't rational at one. So why are you rational at six?

  **Julian:** (Voice rising slightly) Because the *structure* of the node changes! At node one, Passing is an investment. At node six, Passing is suicide. Rationality is context-sensitive to the payoff structure, not the history.

  **Nina:** Is it? Or is "Rationality" just a label we slap on whatever action fits the equilibrium? Look, Julian. Reny's point is that BI requires reasoning from a contradiction. "Assume I am rational. I just made an irrational move. Given that I am rational, what will I do next?" It's a paradox. You can't derive a consistent belief system from a false axiom.

  **Julian:** You can if you treat the move as a tremble. A mistake.

  **Nina:** A mistake worth forty dollars? You Passed node one and three. That's not a tremble. That's a signal. And if it's a signal, you're not playing the BI game anymore. You're playing a reputation game. And in a reputation game, BI doesn't apply.

  *The pot is now ten reds. $100. Node five. Nina's move.*

  **Nina:** If I Take, I get $60. You get $40. If I Pass, the pot goes to twelve reds. Node six. Your move. You Take, you get $80, I get $40.

  **Julian:** So you Take. You don't give me the chance.

  **Nina:** Why not? If I Pass, I'm betting that you will Pass at node six. But at node six, you have no incentive to Pass. Even if you're irrational, even if you're a cooperator, the game ends. There's no future reward for kindness.

  **Julian:** Finally. The logic bites.

  **Nina:** No. The logic bites because the *end* is visible. It doesn't mean the path here was rational. It means the trap closes at the end.

  *She hesitates. Her hand hovers over the chips.*

  **Nina:** But here's the thing. If you believed I was rational, you would have known I'd Take at five. So you should have Taken at four. But you Passed at four.

  **Julian:** I Passed at three. You Passed at four.

  **Nina:** Right. So we're both "irrational" by the Aumann standard. We're sitting here with a hundred dollars in the middle that should have been sixty dollars split at node two.

  **Julian:** We're exploring the bounds of the theory.

  **Nina:** We're leaving money on the table because the theory assumes we're robots who can't update beliefs when the other robot malfunctions.

  **Julian:** (Leaning forward) If you Take now, you admit that Backward Induction works eventually.

  **Nina:** If I Take now, I admit that *self-interest* works eventually. That's not the same as Backward Induction. BI says I should have Taken at node two. I didn't. So BI is a false predictor of behavior.

  **Julian:** BI is a normative claim, not descriptive.

  **Nina:** (Snaps) It's presented as a solution concept derived from rationality! If it doesn't describe what rational agents do when faced with actual deviations, it's not a solution, it's a tautology. "Rational agents do X. You didn't do X. Therefore you aren't rational." It's unfalsifiable.

  **Julian:** It's unfalsifiable because rationality is a constraint on reasoning, not just outcomes.

  **Nina:** Then the constraint is too tight. It breaks under the weight of reality.

  *Silence hangs between them. The pot is $100. Node five.*

  **Nina:** If I Pass, the pot becomes $120. You get the final move.

  **Julian:** And I will Take.

  **Nina:** I know. That's why I'm Taking.

  *Nina pulls the stack toward her. She separates the chips. Six reds for her, four for him.*

  **Nina:** Game over.

  **Julian:** (Looking at his four red chips) You Took at node five.

  **Nina:** I did.

  **Julian:** Which is consistent with Backward Induction.

  **Nina:** It's consistent with *greed* at the final opportunity. It doesn't vindicate the reasoning at node one. You still Passed node one. I still Passed node two. The chain was broken. We only converged on the BI outcome because the game ran out of road.

  **Julian:** (Slowly stacking his chips) But we converged.

  **Nina:** We converged on Nash Equilibrium behavior in the subgame, sure. But we got there through a path that BI says is impossible. You can't use the destination to justify the map if the map said the road didn't exist.

  **Julian:** (A small smile) But you didn't Pass at five. You didn't try to cooperate at the end. You recognized the dominance.

  **Nina:** I recognized that you have no reason to be nice at node six. That's not CKR, Julian. That's just knowing you.

  **Julian:** (Stands up, pockets his chips) Common Knowledge of You, then.

  **Nina:** (Gathering the rest) Exactly. And that's a much messier variable than Rationality.

  **Julian:** Same time next week? I want to try the Traveler's Dilemma.

  **Nina:** Only if we use real money. And no talking about epistemic conditions until after the first move.

  **Julian:** No promises.

  *Julian turns to leave, then stops.*

  **Julian:** You know, if you had Passed at five...

  **Nina:** ...You would have Taken at six.

  **Julian:** Probably.

  **Nina:** "Probably" isn't in the model, Julian.

  **Julian:** It is now.

  *He walks out. Nina looks at the empty table, then at the chips in her hand. She puts one red chip back in the center.*

  **Nina:** (To herself) Tremble.

  *She sweeps it up and leaves.*
