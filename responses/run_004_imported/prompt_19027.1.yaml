answer: |-
  Friends, family, colleagues. Thank you for being here to remember my aunt.

  We gather to honor a life, and usually, that means we agree on a story. We agree that the person was kind, or brave, or funny. But if I am honest, and if I am to honor her memory truly, I cannot tell you a simple story today. Because my aunt lived a life that asks us difficult questions, and she knew that she was asking them.

  She was a nurse by training. She understood care as a vocation. But early in her life, she encountered an idea that turned care into a command. She heard the argument that if we can prevent something bad from happening without sacrificing anything of comparable moral worth, we ought to do it. That walking past a drowning child to save a pair of shoes is wrong. And she looked at the world and realized that for her, the shoes were a car, a house, a retirement fund. And the drowning children were everywhere.

  So, she acted. For sixty years, she lived in a modest apartment. She sent her earnings abroad. She saved lives we will never know the names of. To many in this room, that makes her a saint. It is a comfort to believe that such purity is possible. To look at her life is to see a mirror that shows us how much we keep for ourselves, and it is easier to call her a saint than to ask what we might owe.

  But there are others in this room, sitting in the front row, for whom her life was not just an example, but an environment.

  Her cousins were raised by her. They were fed, and clothed, and protected. But they grew up understanding that they were part of the "many," not the "few." They knew that in her moral calculus, their happiness was weighed against the survival of strangers, and it was not allowed to tip the scale.

  To love someone who refuses to love you *more* than a stranger is a specific kind of loneliness. It is to be cared for deeply, but never prioritized. I know that for some of you, there is a grief today that is mixed with relief, and a question that has gone unspoken: Does a good life have to be this demanding? Did something have to break in her to make room for the world?

  She knew about that question. Late in her life, she learned that philosophers had a name for the permission to prioritize your own family. She told me she thought of it as a permission slip. And she told me, almost wistfully, that she had decided never to use it.

  She made a choice. She chose the world over the self. And in doing so, she loved us in the only way she knew how: by showing us that everyone matters. But I also know that sometimes, we need to feel like we matter *most*.

  I cannot stand here and tell you that her way was the only right way. I cannot tell you that the cost she asked of her family was fair, nor can I tell you it was wrong. She is not here to answer for it.

  But I can tell you this: She was consistent. In a world of compromises, she was a straight line. She challenged us not just to give when it was easy, but to give when it was hard. And she challenges us today, in her absence, to be honest about what we can bear.

  To those who see a saint: Honor her by giving.
  To those who feel the burden of her expectations: Honor her by living fully, and by finding a balance she chose not to take.

  We do not have to agree on her legacy to respect it. Her life was a question mark over all of ours. We don't have to answer it today. We just have to promise to keep asking it.

  Rest in peace, Auntie. You have done enough. Now, let us rest, and learn from what you left behind.
