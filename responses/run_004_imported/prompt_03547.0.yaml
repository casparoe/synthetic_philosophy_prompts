      *   *What is the Positivist stance on Ethics/Value?* Emotivism (Ayer) or Prescriptivism (later), but early Vienna Circle often treated ethics as psychology/sociology or expressions of attitude. Schlick wrote *Problems of Ethics* (1930) too. He was a compatibilist/determinist regarding ethics.
