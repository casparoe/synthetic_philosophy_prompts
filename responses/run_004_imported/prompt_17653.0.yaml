  **Elina:** In a democracy, yes. In a promise?

  **Marcus:** Especially in a promise.

  **Elina:** Because...

  **Marcus:** Because the authority was transferred.

  **Elina:** To a ghost.

  **Marcus:** To the duty.

  **Elina:** Which hangs in the air.

  **Marcus:** Which binds the agent.

