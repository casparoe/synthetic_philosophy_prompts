      *   In game theory, this resembles a **War of Attrition**. Both parties keep paying costs hoping the other blinks first, but the total cost often exceeds the value of the prize.

  3.  **Evaluate the "Rational Point":**
      *   *Economic Rationality:* Decisions should be based on *marginal* costs and *marginal* benefits, not *sunk* costs.
      *   *The Calculation:* Expected Value (EV) = (Probability of Winning $\times$ Potential Recovery) - (Cost to Finish).
      *   *Current State:* If (Cost to Finish) > (Expected Recovery), stop.
      *   *The Trap:* The user is including past costs in the equation ("make everything already spent count for nothing"). Past costs are gone regardless of the decision.

  4.  **Analyze the Legal Context (Copyright):**
