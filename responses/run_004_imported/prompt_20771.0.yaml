answer: |-
  You are describing a textbook example of the **sunk cost fallacy** playing out within a **war of attrition**. To answer your question directly: Yes, there is a rational point at which one of you should stop. In fact, from a strictly economic and game-theoretic perspective, you likely passed that point long ago. The logic keeping you in the fight does not make the question unanswerable; rather, it makes the logic itself flawed.

  Here is an analysis of why you are stuck, how to calculate the rational exit point, and why the current reasoning is trapping you.

  ### 1. The Sunk Cost Fallacy
  You wrote: *"Doing so would make everything already spent count for nothing."*

  This is the core of the trap. In rational decision-making, **sunk costs are irrelevant.** The money and time you have already spent are gone regardless of whether you continue or quit today. They cannot be recovered.

  The only calculation that matters now is **marginal**:
  *   **Marginal Cost:** How much *more* money and emotional energy will it cost to see this through to the end (or the next milestone)?
  *   **Marginal Benefit:** What is the *actual* probability of winning multiplied by the recoverable sum (minus the opponent's ability to pay)?

  If the Marginal Cost exceeds the Marginal Benefit, the rational choice is to stop immediately. The fact that you have already spent \$100,000 (for example) should not influence whether you spend another \$10,000. Yet, psychologically, we treat past spending as an investment that must be "protected," leading us to throw good money after bad.

  ### 2. The War of Attrition
  In game theory, your situation is a **war of attrition**. Two parties compete for a prize (the settlement or judgment) by accumulating costs over time. The winner is the one who can endure the costs the longest.

  The problem in a war of attrition is that **the total cost often exceeds the value of the prize.**
  *   **The Prize:** A "fairly modest sum."
  *   **The Cost:** Legal fees that have already "dwarfed" the sum.

  If both parties reason as you do ("I can't stop now or I lose everything"), the conflict escalates until both parties are significantly poorer than if they had never fought at all. This is a negative-sum game. The only winners are the lawyers.

  ### 3. The Principal-Agent Problem
  You noted that neither *lawyer* shows an inclination to settle. This highlights a common conflict of interest in litigation.
  *   **Your Incentive:** Maximize net recovery (Award minus Fees).
  *   **Your Lawyer's Incentive:** Billable hours.

  Unless your lawyer is on a strict contingency fee with a cap on expenses, their financial incentive is for the case to continue, not to end. They are not feeling the pain of the fees in the same way you are. You must recognize that you cannot outsource this decision to counsel. They are equipped to fight the law, not to manage your economic rationality.

  ### 4. The "Vindication" Variable
  There is one variable that might make continuing rational: **Non-monetary utility.**
  If the primary goal is no longer money, but rather *vindication*, *justice*, or *sending a message to the industry*, then the calculation changes. You are no longer buying a financial return; you are buying a moral outcome.

  However, you must price that vindication explicitly.
  *   Are you willing to spend another \$50,000 for a 40% chance of a public apology?
  *   Are you willing to spend two more years of your life in discovery depositions?

  If you cannot assign a value to "being right" that exceeds the *future* costs of litigation, then continuing is irrational.

  ### 5. How to Break the Logic
  The logic keeping you going is unanswerable *only if* you accept the premise that past costs dictate future actions. To break the stalemate, you must reframe the decision:

  **The "Clean Slate" Test:**
  Imagine you woke up today with no prior involvement in this case. You have no sunk costs. You are presented with the opportunity to sue this author for the "modest sum" available, but you are told upfront: *"This will cost you \$X in future fees and take Y years."*
  Would you take the case?
  *   If the answer is **No**, then you should drop it now.
  *   If the answer is **Yes**, then continue.

  ### Conclusion
  There is a rational point to stop. It is the point where the **expected future cost** exceeds the **expected future recovery**. Given that your fees already dwarf the potential recovery, and neither side is blinking, the market is signaling that the cost of truth is higher than the value of the truth itself.

  Continuing because you "have to" justify past spending is an emotional response, not a rational one. The most rational act may be to declare the past costs the price of a painful lesson, cut your losses, and invest your remaining resources into new work that you fully control. In a war of attrition where the prize is worth less than the ammunition, the only winning move is to leave the battlefield.
