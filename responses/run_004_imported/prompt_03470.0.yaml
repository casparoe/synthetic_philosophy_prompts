      *   *Section 2: The Zombie & The Beast-Machine.* This is the biological hook. Descartes *loves* the idea of a mindless body. That's an animal. But would he accept a *human* zombie? He'd say: "If it talks like a human, it has a mind." The Zombie argument assumes physical closure (physics explains behavior). Descartes denies physical closure for rational action. So he'd reject the *coherence* of a physically identical human zombie, not because of consciousness, but because of *language/reason*.
      *   *Section 3: The Kripkean Objection.* Descartes vs. Kripke. Kripke says "You think you're conceiving pain without C-fibers, but you're not." Descartes says "I know what pain is (thought) and what extension is, and they don't overlap." Descartes treats Mind/Body as a conceptual truth (like math), not an empirical identity (like Water/H2O).
      *   *Conclusion:* Descartes would feel vindicated on the dualism but annoyed by the lack of theological grounding. He'd see Chalmers as an amateur who got the conclusion right but the mechanism wrong.

