      *   *Caution:* Don't attribute modern modal logic to Descartes. Keep it grounded in *Meditations* and *Discourse*.
      *   *Nuance on Zombies:* Chalmers' zombie is functionally identical. Descartes argues functional identity (specifically language) is *impossible* for a machine. So Descartes would say the Zombie is *not* clearly and distinctly conceivable because it involves a contradiction (a machine that does what only a mind can do).
      *   *Nuance on God:* Does God escape Kripke? Kripke's point is about metaphysical necessity. If God guarantees CDP, then if I CDP X and Y are distinct, they are metaphysically distinct. The Kripkean objection says "Your CDP is mistaken about the reference." Descartes would reply "I am not referring to external samples, I am apprehending essences."
      *   *Biology Angle:* As a biologist, the user will appreciate the "beast-machine" distinction. Emphasize that for Descartes, the "zombie" is just an animal. The question is whether a human *can* be an animal. Descartes says no (due to language).

  6.  **Final Polish:** Ensure the tone is conversational but rigorous. Use the "Retired Biologist" hook (e.g., mention anatomy, nerves, animal spirits). Structure with clear headings. (Proceed to generate output based on these thoughts).

