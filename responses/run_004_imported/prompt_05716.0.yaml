prompt: |-
  So in my just war theory seminar we just finished the unit on the moral equality of combatants and i have to write a short paper on it but i keep going back and forth and running out of time lol. Can you write me an essay that actually weighs Walzer's defense of combatant equality (the independence thesis -- jus in bello is independent of jus ad bellum, so soldiers on both sides have equal rights to kill regardless of whos cause is just) against mcmahan's revisionist critique in Killing in War, especially his liability/responsibility based account and the split he draws between the "deep morality of war" and the law of war. Dont just describe both sides and shrug at the end, actually pick a side and defend it -- and please engage with the standard epistemic/practical objection to mcmahan (that ordinary soldiers cant reliably judge who's fighting justly) since thats the part our prof keeps saying people gloss over.
