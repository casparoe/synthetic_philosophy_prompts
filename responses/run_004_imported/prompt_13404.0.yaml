answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Two whiteboards are covered in probability trees. **Elena** (Causal/Evidential leaning, pro-credence) is scribbling fractions. **Marcus** (Updateless/Policy leaning) is leaning back, stirring a cold espresso.*

  **Elena:** Okay, let's lock the numbers down so we don't talk past each other. Exit 1 payoff is 0. Exit 2 is 4. Miss both is 1. We agree the *planning* optimum—calculated at home before the engine starts—is to continue with probability $p = 2/3$.

  **Marcus:** We agree. The expected utility function is $U(p) = (1-p)(0) + p(1-p)(4) + p^2(1)$. That simplifies to $4p - 3p^2$. Derivative is $4 - 6p$, zero at $2/3$. That's the policy that maximizes return.

  **Elena:** Right. But that's the view from Olympus. I'm interested in the view from the driver's seat. I'm at an intersection. The trees look identical. I have no memory. I have to decide *now*. To do that, I need a credence. What is the probability *I am at Exit 1*?

  **Marcus:** You don't need that number. You just execute the policy. You are an algorithm. The algorithm says "continue with probability 2/3." You flip your biased coin. Done. Asking "where am I?" is a category error.

  **Elena:** It's not a category error, it's rationality. If I can't assign a probability to my location, I can't check if the policy is actually rational *at this node*. And if I *do* assign probabilities based on the strategy $p=2/3$, I get the standard "Thirder" style calculation.
  *She points to the board.*
  Total expected visits to intersections is $1 + p$. If $p=2/3$, total visits are $5/3$.
  Probability I'm at Exit 1 is $1 / (5/3) = 3/5$.
