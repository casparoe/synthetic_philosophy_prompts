  2.  **Identify the Core Philosophical Problem:**
      *   This is the classic **Problem of Old Evidence** in Bayesian epistemology.
      *   It was famously articulated by Clark Glymour (1980) and discussed extensively by Colin Howson, Eells, Earman, etc.
      *   **The Bayesian Formalism:** Confirmation occurs if $P(H|E) > P(H)$. By Bayes' Theorem, $P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)}$.
      *   **The Problem:** If $E$ is already known with certainty, then $P(E) = 1$. If $P(E) = 1$, then $P(E|H) = 1$ (usually). Consequently, $P(H|E) = P(H)$.
      *   **Result:** On a strict subjective Bayesian interpretation where probability represents degree of belief *at a specific time*, old evidence cannot confirm a new hypothesis.
      *   **Intuition:** This contradicts scientific practice (e.g., Einstein's General Relativity being confirmed by the already-known perihelion precession of Mercury).

  3.  **Evaluate the User's Instinct vs. Great-Aunt's Instinct:**
