answer: |-
  You have stumbled directly onto one of the most famous and persistent problems in formal epistemology: **The Problem of Old Evidence.**

  Your instinct and your great-aunt's instinct represent the two horns of a dilemma that has occupied philosophers of science since Clark Glymour formally articulated the problem in 1980. Your classmates are split down the middle because the literature itself is divided on how to resolve it.

  Here is the breakdown of why you are both right in different senses, and how Bayesian epistemology attempts to handle exactly this scenario.

  ### 1. Why You Are Right (The Strict Bayesian View)

  Your objection relies on the standard rule of **Conditionalization**. In Bayesian confirmation theory, evidence $E$ confirms hypothesis $H$ if and only if learning $E$ raises the probability of $H$. Formally:
  $$P(H|E) > P(H)$$

  Using Bayes' Theorem:
  $$P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)}$$

  Here is the rub: You stated that you knew the evidence $E$ (the 4 p.m. watering time) with certainty *before* the hypothesis was proposed. In Bayesian terms, if you are certain of $E$, then **$P(E) = 1$**.

  If $P(E) = 1$, then $P(E|H)$ is also 1 (the probability of a certainty given any hypothesis is 1). The equation collapses:
  $$P(H|E) = \frac{1 \cdot P(H)}{1} = P(H)$$

  Mathematically, your posterior probability in the hypothesis is identical to your prior probability. **Strictly speaking, old evidence cannot confirm a new hypothesis.** If your credence in the watering time was already maximal, learning a theory that predicts it cannot rationally increase your credence in the theory *via that evidence*.

  Your intuition that "nothing about my day-to-day experience... changed" is tracking this formal constraint. Since you didn't learn a new fact about the world, you shouldn't update your beliefs.

  ### 2. Why Your Great-Aunt Is Right (The Scientific Practice View)

  Your great-aunt is tracking the actual practice of science and history, which contradicts the strict Bayesian result above.

  The canonical example in the literature is **Einstein and Mercury**. When Einstein formulated General Relativity ($H$), the anomalous perihelion precession of Mercury ($E$) was already well-known. It was "old evidence." Yet, everyone agrees that Mercury's orbit confirmed General Relativity. If strict Bayesianism were true, Einstein's theory would have received no confirmation boost from its most famous empirical success.

  In history, as your aunt noted, the value of a theory often lies in its ability to make sense of *existing*, puzzling facts (abductive reasoning or Inference to the Best Explanation). If we accepted your strict view, historical reconstruction would be impossible, because almost all historical evidence (documents, ruins, traditions) exists before the historian formulates the specific narrative that explains it.

  ### 3. How Epistemologists Bridge the Gap

  Since the strict Bayesian result ($P(E)=1 \rightarrow$ no confirmation) contradicts our strong intuition that Einstein was confirmed by Mercury, epistemologists have proposed solutions. Your classmates are likely split because they are implicitly adhering to different solutions.

  **Solution A: The "Logical Connection" Approach (Garber, 1983)**
  This is the most popular fix for your specific scenario. The argument is that you did not actually update on $E$ (the watering time). You already knew $E$. What you actually learned was the **proposition that $H$ explains $E$**.
  *   Let $L$ be the proposition: "The Mill Hypothesis entails the 4 p.m. Watering Tradition."
  *   Before your aunt's research, you knew $E$, but you did not know $L$. You didn't know *why* the watering happened.
  *   When your aunt presented the theory, you learned $L$.
  *   Learning that a hypothesis *successfully predicts/explains* a known fact is new information. It rules out other hypotheses that *cannot* explain the fact.
  *   **Verdict:** Your aunt is right. The confirmation comes not from $E$, but from learning the *link* between $H$ and $E$.

  **Solution B: The "Counterfactual" Approach**
  Some Bayesians argue we should evaluate confirmation by asking: "What would my probability of $H$ have been if I *hadn't* known $E$?"
  *   If we subtract the knowledge of the watering time from your belief system, does the Mill Hypothesis make the watering time likely? Yes.
  *   Does the watering time make the Mill Hypothesis likely? Yes.
  *   Therefore, the structural relationship supports the hypothesis, even if temporally the evidence came first.
  *   **Verdict:** Your aunt is right. Temporal order doesn't matter; logical support does.

  **Solution C: The "Uncertainty" Approach**
  This side is on your team. It argues that we are rarely *truly* certain ($P=1$) of anything.
  *   Perhaps you weren't 100% sure it was *exactly* 4 p.m. (maybe 3:55? maybe 4:10?).
  *   Perhaps you weren't sure the tradition was continuous (maybe it started recently?).
  *   If $P(E)$ is 0.99 instead of 1, the math works, and $E$ can confirm $H$.
  *   **Verdict:** You are right that if $P(E)=1$, nothing happens. But in reality, $P(E)$ is never exactly 1.

  ### 4. Applying This to Your Family Dispute

  There is a crucial nuance in your story that might help you adjudicate the disagreement.

  Your great-aunt did not *only* bring you the theory; she brought **archival research** ("old letters and parish records").
  *   **The Letters/Records:** This is **New Evidence** ($E_{new}$). This evidence directly raises the probability of the Mill Hypothesis ($H$).
  *   **The Watering Time:** This is **Old Evidence** ($E_{old}$).

  If the Mill Hypothesis were *only* supported by the watering time, your Bayesian objection would be very strong (unless you accept the "Logical Connection" fix). A theory invented solely to fit one known data point is often accused of "curve fitting" or being *ad hoc*.

  However, the watering time serves as a **coherence check**.
  1.  The letters raise the prior probability of $H$ (New Evidence).
  2.  The watering time shows that $H$ has explanatory power over known facts (Old Evidence/Logical Connection).

  If the letters suggested he was a baker, but the family tradition was watering at 4 p.m., the theory would be less coherent. The fact that the "Old Evidence" fits the "New Hypothesis" prevents the theory from being a lucky guess based on the letters alone.

  ### Conclusion

  **Your instinct is tracking the formal problem:** In strict subjective Bayesianism, learning a hypothesis that fits known facts does not update your probabilities if you were already certain of the facts.

  **Your great-aunt's instinct is tracking abductive reasoning:** A hypothesis that explains a stubborn, known fact is rationally preferable to one that does not, regardless of when the fact was discovered.

  **The Resolution:** Most contemporary formal epistemologists would side with your great-aunt, but with a correction to your reasoning. You are correct that $E$ itself cannot be the source of the update. However, **learning that $H$ explains $E$** is a new piece of information that *does* warrant increased confidence in $H$.

  You should tell your classmates that this is a textbook instance of the **Glymour Problem of Old Evidence**. You are right about the math of conditionalization; your aunt is right about the logic of explanation. The synthesis is that confirmation comes from learning the *explanatory connection*, not the evidence itself.

  (If you want to impress your professor, look up **Daniel Garber's 1983 paper "Old Evidence and Logical Omniscience."** It is the standard reference for exactly this dilemma.)
