      *   *Check:* Is the verdict clear? I need to make sure I don't just say "it's complicated." I need to say "The inconsistency is fatal to the strict hybrid, but survivable for a modified libertarianism."
      *   *Tone:* Keep it nuanced. Nozick was humble about this. The essay should reflect that intellectual honesty.

