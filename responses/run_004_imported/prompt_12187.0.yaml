      *   *Structure:* Intro -> The Stability Defense -> The Inconsistency Critique -> The Blocking Move -> The Verdict.
      *   *Key Phrase:* "The separateness of persons is the moral bedrock." Does it apply to sentient beings? Yes.

  7.  **Final Review against constraints:**
      *   Did I commit to a verdict? Yes.
      *   Is it philosophically honest? Yes, acknowledging Nozick's own uncertainty.
      *   Is it useful for a novelist? Yes, it gives ammo to both characters but tilts the scale.

