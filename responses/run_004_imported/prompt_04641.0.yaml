answer: |-
  This is a classic case of **Goodhart's Law** colliding with **contextual intelligence**.

  Goodhart's Law states: "When a measure becomes a target, it ceases to be a good measure."

  For six years, Dave used "speed of recovery run" as a proxy for "player value." In his previous system (likely a more direct, transition-based style), that metric correlated highly with success. Sprinting back prevented counter-attacks, won the ball high, and fueled the next attack. The kids who did it *were* the best players *in that system*.

  But here is what is actually happening with the U11s, broken down by your three hypotheses:

  1.  **Are they less talented?** No.
  2.  **Are they lazy or stubborn?** Absolutely not. In fact, they are being *too* compliant.
  3.  **Is it something else?** Yes. They are victims of a misaligned incentive structure.

  ### The Diagnosis

  **1. The "Hustle" Halo Effect**
  Dave fell for the visibility bias. Sprinting is visible. Tactical discipline (holding a lane, jogging to maintain shape, conserving energy for a pressing trigger) is invisible. Because the sprinting kids were loud and visible, Dave assumed they were the "good ones." In the new possession system, the "good" player is the one who *doesn't* sprint back unnecessarily, because their job is to stay wide to stretch the play or stay high to offer an outlet. By rewarding the sprint, Dave is actively punishing the players who are intuitively trying to play the new style correctly.

  **2. Compliance vs. Soccer IQ**
  At U11, players are heavily coach-dependent. They want to please the authority figure. If the Coach says, "The guy who sprints back fastest gets the sticker," the players will sprint back fastest. Even if it hurts the team. Even if they are gassed. They aren't being stubborn; they are being good soldiers. They are optimizing for the reward Dave dangled, not the outcome of the match. Dave is essentially training them to play the wrong sport.

  **3. Energy Economics**
  In a possession-heavy system, defense is about structure and pressing triggers, not recovery chasing. If a forward sprints 40 yards back to defend a corner kick, they have zero explosive energy left for the counter-attack when the ball is won. In the old system, that sprint was an asset. In the new system, it's an energy leak. The kids are exhausted by halftime because they are burning matches on plays that don't yield a return on investment in this specific tactical model.

  ### What Dave Needs to Change

  Dave needs to decouple "effort" from "value" and re-couple "decision making" with "value."

  **1. Kill the Sprint Chart**
  He needs to stop the sticker chart immediately. It is reinforcing a behavior that is tactically obsolete for this team. If he keeps it, he is telling the kids, "I say I want possession, but I reward transition panic." Kids believe rewards, not rhetoric.

  **2. Reward the Invisible**
  Dave needs to find a way to measure and reward **positioning** and **energy management**.
  *   *Old Reward:* "Great job sprinting back, Sarah!"
  *   *New Reward:* "Great job staying wide when we lost the ball, Marcus. You kept their defense nervous."
  *   *New Reward:* "Love how you jogged back to your spot instead of chasing the ball, Jen. Now you're ready to attack."

  **3. Teach "Transition Triggers"**
  At U11, you can't just say "play possession." You have to give them rules for when to sprint and when to walk.
  *   *Rule:* "If we lose the ball in their final third, we sprint for 5 seconds to press. If we don't win it, we walk and get into shape."
  *   *Rule:* "If you are the furthest forward, you do not run back past the halfway line. You wait."
  Dave needs to reward the kids who follow the *trigger*, not the ones who just run the fastest.

  **4. Reframe "Good Player"**
  Dave needs to have a team talk. He needs to admit the metric changed. "Guys, in my old team, we rewarded sprinting back. In this team, we reward being in the right spot. If you sprint back and you're out of position, that's actually a mistake now. I know that's confusing, but I need you to trust me."

  ### The Bottom Line

  The kids aren't the problem. The **feedback loop** is broken.

  Dave is measuring **activity** (sprinting) when he should be measuring **efficacy** (did that run help the team's shape?). The kids are doing exactly what they are told to do; the tragedy is that what they are being told to do is making them look like bad players.

  Dave isn't coaching a team of lazy kids. He's coaching a team of highly motivated kids who are running themselves into the ground to win a prize that no longer exists. He needs to change the prize.
