  2.  **Deconstruct the Core Issue:**
      *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure." Dave measured "sprinting back" as a proxy for "good player." It worked in Context A, but failed in Context B.
      *   **Contextual Intelligence:** Soccer skills aren't universal; they are context-dependent. What makes a player "good" in a counter-attacking system (speed, transition urgency) differs from a possession system (positioning, energy conservation, spatial awareness).
      *   **The "Hustle" Fallacy:** Effort (sprinting) is visible and easy to measure. Tactical discipline (holding position, conserving energy) is invisible and harder to measure. Dave rewarded the visible, not the effective.
      *   **U11 Developmental Stage:** At U11, kids are eager to please. If the coach rewards sprinting, they will sprint, even if it's tactically wrong. They aren't being "stubborn"; they are being compliant.
