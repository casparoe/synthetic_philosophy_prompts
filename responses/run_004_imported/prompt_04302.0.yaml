answer: |-
  The felt is green, the lighting is low, and the air smells faintly of ozone and old paper. On the table sits a single coin, milled but unmarked. Between **Elena** and **Bernard** lie stacks of chips, identical in denomination. They have been told the coin lands heads with probability $p=0.6$. They have been told there will be three hundred flips. They have been told they may keep what they have at the end.

  Elena pushes a stack of chips forward. She bets 20% of her current bankroll. Bernard pushes a smaller stack. He bets 10%.

  **Bernard:** You're betting full Kelly. Again.

  **Elena:** I'm betting the growth-optimal fraction. The nomenclature is secondary.

  **Bernard:** It's not secondary. It's the tell. You call it "growth-optimal" to make it sound like a law of thermodynamics. I call it "log-utility maximization" to remind you it's a preference. You're treating a specific risk tolerance as if it were a constraint of the universe.

  **Elena:** The universe *is* the constraint, Bernard. Look at the process. It's multiplicative. $W_{t+1} = W_t(1 + f)$ or $W_t(1 - f)$. This is a random walk in log-wealth, but a geometric Brownian motion in level-wealth. The ensemble average—the expectation value—diverges from the time average. That is not a preference. That is a broken symmetry. If you maximize the ensemble average here, you maximize the probability of ruin over a long enough horizon.

  **Bernard:** "Ruin." There's the loaded word. If I go to zero, yes, I'm out. But I am not betting my life savings. I am betting these chips. I have a pension. I have a house. My utility function over *this specific game* does not need to be logarithmic. I value the variance of the outcome. I would rather guarantee myself a 5x return than gamble on a 100x return with a 10% chance of ending up with 0.5x. That is not a mathematical error. That is me telling you what I want.

  **Elena:** But that's exactly where the Expected Utility (EU) framework deceives you. You say, "I prefer less variance." Fine. But EU theory treats that preference as intrinsic to the agent, like a taste for ice cream. Ergodicity Economics says the preference is *extrinsic*. It's imposed by the dynamics. You don't need to *assume* log utility to get the Kelly criterion. You derive it by asking: "What strategy maximizes the time-average growth rate for a single trajectory?"

  **Bernard:** And why should I care about the time-average growth rate?

  **Elena:** Because you are a single trajectory. You are not an ensemble. There is no multiverse where a thousand Bernards play this game and average their wealth. There is only you, moving through time. The ensemble average is a fiction. It tells you what happens to the average wealth of a cloud of copies, but you are not a cloud. You are a point. In a non-ergodic system, the expectation value is physically meaningless for the individual.

  **Bernard:** That's poetic, Elena, but it's a category error. The expectation value isn't meaningless; it's just incomplete. It requires a utility function to map wealth to value. You've smuggled log-wealth in through the back door by declaring that "value" equals "long-run growth rate." But why is long-run growth the goal?

  **Elena:** Because wealth is optionality. If you maximize the geometric mean, you maximize the asymptotic limit of your wealth relative to any other strategy. It's stochastic dominance in the long run. Any other fraction—half-Kelly, double-Kelly—will almost surely underperform you as $t \to \infty$.

  **Bernard:** Ah, "as $t \to \infty$." The refuge of the physicist who doesn't want to deal with mortality. I am not playing for $t \to \infty$. I am playing for $t = 300$. And even then, I stop playing when the game ends. If I bet full Kelly, the volatility drag is significant. I might end up below my starting bankroll due to variance, even if the expectation is positive. By betting half-Kelly, I sacrifice maybe 25% of the growth rate to reduce the volatility by 50%. That is a rational trade-off. Your framework calls this "irrational" or "sub-optimal." Mine calls it "risk management."

  **Elena:** It calls it "misunderstanding the source of the risk." You think you are managing risk because you are risk-averse. I say you are managing risk because you are implicitly acknowledging that the dynamics are non-ergodic, but you're patching it with a psychological parameter instead of a structural correction. When traders use fractional Kelly, they aren't expressing a "preference." They are admitting they don't know the true edge. They are hedging against parameter uncertainty. But here? We *know* $p=0.6$. There is no estimation error. So why the fraction?

  **Bernard:** Because I get bored. Because I don't like watching my stack fluctuate wildly. Because I might need to cash out at flip 150 to buy a sandwich.

  **Elena:** Those are constraints. Put them in the model. Don't pretend they invalidate the ergodic argument. If you have a finite horizon or a consumption floor, the optimal strategy changes, yes. But the *reason* it changes isn't because Expected Utility is right and Ergodicity is wrong. It's because the boundary conditions of the trajectory have changed. The EU framework pretends the dynamics don't matter, only the final distribution. I'm telling you the path *is* the reality.

  **Bernard:** Let's press that. You say non-ergodicity does "normative work." You say it tells me how I *ought* to bet. But if I tell you, "I ought to maximize my peace of mind," and that leads me to bet 5%, your physics doesn't forbid me. It just says I'll grow slower. So the "normative" force of ergodicity only applies if I accept your premise: that growth is the telos. But that's a value judgment. You've just rebranded "I like growing wealth" as "The universe demands growth."

  **Elena:** No. I'm saying that if you *want* to remain in the game, the universe demands growth. If you bet too aggressively, you hit zero. If you bet too conservatively, you get eaten by inflation or opportunity cost. Log-wealth is the unique function that aligns the agent with the multiplicative structure of the environment. It's not about "liking" growth. It's about compatibility. Think of it like impedance matching. You're arguing that you can choose your own impedance. I'm saying if you mismatch, you lose power.

  **Bernard:** Impedance matching implies there's a single optimal transfer of energy. But what if I don't want to transfer energy? What if I want to store it? Look at the Haghani experiment. The subjects who went bust didn't go bust because they misunderstood ergodicity. They went bust because they bet too much on short streaks. But the ones who bet tiny amounts? They didn't go bust, but they won peanuts. Both are "sub-optimal" by your light. But only one is "rational" by mine. The EU framework captures both behaviors by adjusting the risk-aversion coefficient $\gamma$. Your framework calls the conservative bettor "irrational" unless he invokes parameter uncertainty.

  **Elena:** That's the weakness of EU. It's too flexible. It's a Ptolemaic system. You can add epicycles—changing utility functions, changing probability weightings—to explain any behavior. If someone bets everything on a 51% coin, EU says "they must have a convex utility function." If they bet nothing, "concave." It explains everything, so it predicts nothing. Ergodicity Economics says: "For this specific class of multiplicative dynamics, there is a unique focal point." It restricts the solution space. That makes it scientifically stronger, even if it's normatively stricter.

  **Bernard:** Or it makes it scientifically arrogant. You're taking a specific dynamic—repeated multiplicative bets—and universalizing it. Most of life isn't a repeated bet with reinvestment. Sometimes it's a one-off. Sometimes it's additive. In those cases, EU works fine. You're trying to turn a specific solution into a general metaphysics. And let's be honest: the reason the "Ergodicity Economics" school is gaining traction isn't just because it's right. It's because it lets quants feel like they're doing physics instead of psychology. It absolves them of having to ask *why* they want money.

  **Elena:** And the reason EU persists is because it lets economists avoid admitting that the market is a dynamical system that can kill you. It treats wealth as a state variable, not a path integral. You say I'm ignoring psychology. I say you're ignoring the landscape. In my old work, spin glasses... you couldn't just look at the energy states. You had to look at the barriers. The phase space was fractured. You couldn't assume the system would find the global minimum. Here, the "global minimum" is zero wealth. The barrier is ruin. EU assumes you can teleport across the barrier if the expectation is positive. Ergodicity respects the barrier.

  **Bernard:** I respect the barrier. That's why I bet 10%.

  **Elena:** You bet 10% because you're afraid of the drawdown. But mathematically, with known $p$, full Kelly is the only strategy that guarantees you won't underperform any other strategy almost surely in the long run.

  **Bernard:** "Long run." We are mortal. Keynes is dead, and so are we. If I bet 20%, there is a non-negligible probability that at flip 100, I have 40% of my starting bankroll. I might panic. I might quit. If I bet 10%, that probability is vanishingly small. My "risk aversion" isn't a parameter in a utility function; it's a model of my own human frailty. EU accommodates that frailty. Your "Geometric Rationality" assumes I'm a robot who never deviates from the plan.

  **Elena:** Then the problem isn't the theory; it's the agent. But don't call your frailty "rationality." Call it what it is: a constraint. And if we are pooling forecasts, if we are bargaining, if we are trying to build a collective intelligence... the geometric mean is the only aggregation rule that satisfies the basic consistency axioms of information theory. It's not just about betting. It's about how beliefs combine.

  **Bernard:** And there it is. You've moved from "how to bet" to "how to think." You want to make log-wealth an epistemological virtue. I'm just trying to buy dinner.

  *The dealer flips the coin. Tails.*

  *Elena's stack shrinks visibly. Bernard's shrinks less.*

  **Bernard:** See? Variance.

  **Elena:** One data point. The law of large numbers hasn't kicked in.

  **Bernard:** But the pain is immediate. The utility loss is concave. Losing 20% hurts more than gaining 20% helps.

  **Elena:** That *is* the concavity of the log function. You feel it psychologically; I see it algebraically. We are observing the same phenomenon. You attribute it to your brain. I attribute it to the coin.

  **Bernard:** Does it matter?

  **Elena:** Yes. If it's your brain, you can train it away. You can learn to love volatility. If it's the coin, you can't. The volatility drag is real. If you leverage up 2x Kelly, you go bust. It doesn't matter how much "utility" you assign to wealth. The math deletes you.

  **Bernard:** But if you leverage down to 0.5x Kelly, you don't get deleted. You just grow slower. And I get to sleep at night. So tell me, Elena: In your spin glass systems, if there were two states, one with lower energy but separated by a massive barrier, and one with slightly higher energy but accessible... which state does the system occupy?

  **Elena:** The accessible one. Obviously.

  **Bernard:** Exactly. Full Kelly is the lower energy state, but the barrier—the drawdown—is high. Fractional Kelly is the metastable state. It's accessible. It's robust. It's where the system actually lives. So why call it "sub-optimal"? It's optimal for the actual topology of the agent's existence.

  **Elena:** Because "accessible" implies you don't know the path. But we *do* know the path distribution. We know the coin. The barrier isn't a mystery. It's a calculated risk. By betting less, you are paying an insurance premium against a risk you've already quantified. That's not rationality; that's buying peace of mind. And that's fine! Just don't pretend the premium isn't a cost.

  **Bernard:** And don't pretend the peace of mind isn't a benefit.

  *They sit in silence for a moment. The dealer waits.*

  **Elena:** We agree on the math. The expectation is positive. The geometric growth rate is maximized at $f = 2p - 1$.

  **Bernard:** We agree on the math. The variance of the outcome scales with $f$. The probability of drawdown scales with $f$.

  **Elena:** The dispute is whether the "cost" of variance is a feature of the world or a feature of the mind.

  **Bernard:** And whether "rationality" is about aligning with the world or satisfying the mind.

  **Elena:** I think if you align with the world, the mind follows. Wealth solves problems.

  **Bernard:** I think if you satisfy the mind, you stay in the game long enough to let the world align.

  *Elena pushes her chips forward again. 20%.*
  *Bernard pushes his. 10%.*

  **Elena:** Heads.

  **Bernard:** I'll take tails. I'm already up on variance.

  **Elena:** You're up on nothing. You're just behind less.

  **Bernard:** In this life, Elena, "behind less" is often the same thing as "ahead."

  *The coin spins.*
