answer: |-
  Here is a draft of 10 interview questions designed for your podcast. They are ordered to create a narrative arc: starting with the historical lineage (where the "type" move is plausible), moving through the internal metaphysics (where the "type" move gets strained), and ending on methodological constraints (where the "type" move risks looking like a deflection).

  Each of the four required topics includes a primary question and a targeted follow-up.

  ### **Part 1: The Historical Cost-Benefit Analysis**
  *Goal: Establish the stakes. Here, the "type" move is still safe because abstract types resemble Fregean senses.*

  **1. (Frege & Psychologism)**
  "Your view is often pitched as a return to the act of judgment, but Frege famously banned psychologism from logic precisely to save the objectivity of truth. You're essentially reintroducing the mental act into the proposition's identity conditions. If we pay the cost of psychologism—making propositions dependent on the possibility of minds—what is the specific theoretical gain? What can your theory *do* that Frege's unsaturated concepts couldn't, other than satisfy an intuition about 'unity'?"

  > **Follow-up (If she says types are abstract/objective):**
  > "If the types are abstract and objective enough to do the work of Fregean senses, why insist on calling them 'acts' at all? Does the label 'act' carry any metaphysical weight, or is it just a historical nod to the things that *instantiate* the type?"

  **2. (Russell & Directionality)**
  "Let's talk about logical form. Wittgenstein's old objection to Russell's Multiple Relation Theory was that it couldn't distinguish judging that *a* loves *b* from judging that *b* loves *a*, because the relation is just another term in the list. If a proposition is a type of act, how does the *type* itself encode directionality without presupposing the very structured content you're trying to avoid? How does the act-type know which slot is the subject and which is the object?"

  > **Follow-up (If she says the act is inherently directed):**
  > "If the directionality is a brute feature of the act-type, haven't you just relocated the mystery? You've replaced the mystery of how objects and properties combine with the mystery of how agent and property combine in a specific order. What explains *that* order if not the very logical form you claimed we didn't need?"

  ### **Part 2: The Metaphysics of Unity**
  *Goal: Tighten the screws. The "type" move starts to look like it might be hiding the problem rather than solving it.*

  **3. (Bradley's Regress)**
  "This brings us to the Unity of the Proposition. Your pitch is that acts are intrinsically unified in a way that static complexes aren't. But an act of predication still seems to have constituents: the agent, the property, the object. What binds *those* together into a single act? If you say 'the agent performs it,' aren't you just triggering Bradley's Regress one level down? What unifies the agent with the predicating?"

  > **Follow-up (If she says the act is primitive/unanalyzable):**
  > "If the unity of the act is primitive, why think this is an advantage over the structured view? Structured theorists can also say the 'binding relation' is primitive. You haven't eliminated the primitive unity; you've just moved it from the proposition to the psychology of the agent. Why is that a net gain?"

  **4. (Type/Token: The Dinosaur Case)**
  "Let's press the ontology. The standard objection is: 'Dinosaurs existed before minds, so there were truths about dinosaurs before anyone could predicate anything of them.' Your standard move is to say, 'It's the *type* of act that matters, not the *token*, and types don't need instantiation.' But if no token of that act-type has ever occurred, in what sense does that type exist? Is it waiting in a platonic warehouse?"

  > **Follow-up (If she says types are well-defined conditions):**
  > "If the type is just a 'well-defined condition' on possible acts, aren't you effectively describing a structured proposition again? A condition on predicating *F* of *a* looks suspiciously like the complex <a, F>. If the type is defined by its structure, haven't you smuggled structure back in through the back door of 'type-identity'?"

  ### **Part 3: The "Type" Move Under Pressure**
  *Goal: Make the "Type/Token" defense increasingly difficult to sustain without circularity.*

  **5. (Type/Token: Metaphysical Grounding)**
  "Following up on that: if the type exists uninstantiated, what grounds its identity? Usually, we individuate act-types by their tokens (e.g., 'running' is defined by instances of running). If there are no tokens—no minds, no predicates—what makes the *type* of act 'predicating massiveness of T-Rexes' distinct from the *type* 'predicating T-Rexes of massiveness'? Without tokens to fix the reference, isn't the type indeterminate?"

  **6. (Type/Token: Unity of the Type)**
  "Here is the harder version of the unity problem. Even if we grant you uninstantiated types: does the *type itself* have unity? Is the type a complex entity composed of 'predication' + 'property' + 'object'? If yes, you're back to the structured proposition problem. If no, if the type is a simple, how does a simple entity represent a state of affairs with multiple constituents? You seem to need the type to be structured to represent, but unstructured to avoid Bradley."

  **7. (Type/Token: The "Just a Name" Challenge)**
  "At this point, a skeptic might say your 'act-types' are just a new name for the old problem. You say 'propositions are act-types' to solve unity, but when pressed on mind-independent truth, you say 'act-types are abstract conditions.' Is there any substantive difference between your 'abstract act-type' and the 'structured proposition' you're rejecting, other than the verbal insistence that it's an 'act'?"

  ### **Part 4: Methodological Constraints**
  *Goal: Close the trap. Move from "How does it work?" to "Can it be wrong?"*

  **8. (Shared Content)**
  "One motivation for your view is to naturalize meaning. But if propositions are types of *my* acts, how do you and I grasp the *same* proposition? If I predicate 'is red' and you predicate 'is red,' are we performing the same act-type? If act-types are fine-grained (sensitive to mode of presentation), we lose shared content. If they are coarse-grained, we lose the specific unity you promised. Where do you draw that line?"

  **9. (Normativity vs. Description)**
  "Propositions seem to carry normative weight—they are true or false, justified or unjustified. Acts are events—they happen or they don't. How does a *type of event* inherit normative status? If I perform a token act of predication incorrectly, does that make the *type* false? It seems you need the proposition to be true prior to the act to judge the act as correct, which reverses your explanatory order."

  **10. (Falsifiability & Evidence)**
  "Final question. We've discussed how your theory handles objections by appealing to the nature of act-types. So I want to ask: What would count as evidence *against* your view? If every counter-example (dinosaurs, unity, directionality) is met by refining the definition of the act-type, is there any conceptual or empirical scenario that would force you to abandon the act-theory in favor of a structured view? Or is this a framework that's insulated from refutation by design?"

  > **Follow-up (If she says "Theoretical Virtue"):**
  > "If it comes down to theoretical virtue, which virtue specifically? Parsimony? Explanatory power? Because on parsimony, positing uninstantiated act-types seems heavier than positing abstract structures. So what is the specific explanatory work only *you* can do?"
