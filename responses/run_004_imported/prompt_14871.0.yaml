answer: |-
  Your intuition that the board's response feels "too convenient" is astute. It highlights a classic tension in governance between **legal ownership** and **lived experience**.

  To answer your question directly: **Legally and structurally, the board is almost certainly correct.** However, **ethically and practically, the tenants have a legitimate claim to be heard, even if they do not have a claim to vote.**

  Here is a breakdown of why this conflict exists, why the board's logic is technically sound but morally narrow, and where the tenants' actual leverage lies.

  ### 1. The Legal and Structural Reality
  In almost all condominium and homeowners association (HOA) structures, voting rights are tied to **title ownership**, not occupancy. This is not arbitrary; it is based on the financial architecture of the building.

  *   **Financial Liability:** Owners pay the mortgages, property taxes, and special assessments. If the building needs a new roof or faces a lawsuit, the owners are on the hook, not the tenants.
  *   **Asset Value:** Owners have a long-term financial stake in the property's value. Tenants have a temporary stake in the property's *usability*.
  *   **Privity of Contract:** Tenants have a lease agreement with the *owner*, not the association. The association's contract (the bylaws) is with the *owner*.

  From a strict governance perspective, allowing non-owners to vote on asset management could create a "moral hazard." For example, tenants might vote for amenities or policies that increase immediate comfort but degrade long-term property value, without bearing the cost of that depreciation. Therefore, the board is right that the *vote* belongs to owners.

  ### 2. Why the Board's Argument Feels "Too Convenient"
  Your discomfort stems from the fact that the board is reducing the building to a **financial instrument** rather than acknowledging it as a **community**. Their argument ignores the "social liability" of the decision.

  *   **The Principal-Agent Problem:** This is the core flaw in the board's logic. In economics, this occurs when one person (the owner/agent) makes decisions that affect another person (the tenant/principal) without bearing the full consequences.
      *   An owner might vote *for* Airbnb because it maximizes their income, even if it creates noise and security risks.
      *   The owner does not have to sleep through the noise or worry about strangers in the hallway; the tenant does.
      *   By excluding tenants, the voting system captures the *financial* impact on the owner but ignores the *quality-of-life* impact on the resident.
  *   **Housing Security:** You mentioned the risk of rent hikes. If STRs are banned, owners lose a revenue stream. They may convert that unit to a long-term rental but raise the rent to match market rates to recoup the loss. The tenants bear the financial risk of the policy change without having a say in it.
  *   **Stakeholder Theory:** Modern governance theory suggests that anyone significantly affected by a decision should have a voice in it. While tenants don't own the *walls*, they "own" the *experience* of living there.

  ### 3. Do Tenants Have a Legitimate Claim to a Vote?
  **Legally:** Generally, **no.** Unless your specific jurisdiction has unusual tenant-protection laws or the bylaws explicitly allow for tenant proxies (which is rare), demanding a vote is a non-starter. The bylaws are a binding contract that the owners signed and the tenants agreed to by signing their lease.

  **Morally:** **Yes, to a point.** Tenants have a legitimate claim to **consideration**, if not a ballot. A decision that fundamentally alters the safety, noise profile, and culture of the building cannot be made responsibly without input from the people who are there 24/7.

  ### 4. How to Bridge the Gap
  Since the tenants likely cannot change the bylaws to grant themselves voting rights before this vote, they must find other avenues of influence. The goal should shift from "giving us a vote" to "ensuring our interests are represented."

  *   **Owner Advocacy:** Tenants should identify which owners are landlords. These owners are the voters. Tenants can present data on how STRs affect tenant retention, which affects the owners' long-term income stability.
  *   **Board Meetings:** Even if tenants cannot vote, they can usually attend open board meetings and speak during public comment periods. The board should be reminded that while they represent owners, they govern a building full of residents.
  *   **The "Proxy" Strategy:** In some associations, owners can assign their voting proxy to someone else. While an owner cannot give their vote to a non-owner in many jurisdictions, they *can* be lobbied to vote a certain way. Tenants can prepare briefing packets for landlord-owners.
  *   **Lease Leverage:** If the tenants are organized, they can remind the owners that a building known for chaotic short-term rentals may become less desirable for high-quality long-term tenants, eventually hurting the owners' ability to rent at all.

  ### Conclusion
  The board is **procedurally right** but **empathetically wrong.**

  *   **The Board:** Is correct that voting rights are tied to equity and liability. Changing this would require amending the bylaws, which is a massive legal undertaking.
  *   **The Tenants:** Are correct that the decision disproportionately impacts their daily lives and housing security.

  The solution is not necessarily to give tenants a vote (which creates legal and financial complications), but for the owners to recognize that **governing a building requires more than just protecting asset value; it requires maintaining a livable environment.** If the owners vote without consulting the tenants, they are making a decision based on incomplete data. The tenants' claim is not to the *ballot*, but to the *table*.

  **Recommendation:** Advise the tenant group to stop demanding a vote (which will be legally rejected) and start lobbying the landlord-owners. Frame the argument not as "tenant rights," but as "building stability and risk management." That is a language owners understand.
