answer: |-
  The whiteboard was cluttered with numbers ranging from 1 to 10,000, representing the paint chips laid out on the table. Chip 1 was unmistakably red; Chip 10,000 was unmistakably orange.

  **Tim (Epistemicist):** "Look at Chip 5,432. On my view, it's either red or it isn't. There's a fact of the matter. You disagree?"

  **Kit (Supervaluationist):** "I disagree that there's a fact of the matter *which* chip it is. But here's where you always trap my students, Tim. You say I deny boundaries. I don't. On supervaluationism, the sentence 'There is a last red chip' is supertrue. It's true on every admissible precisification of 'red'."

  **Tim:** "Exactly. And that's what I want the class to grapple with. You accept the existential claim—$\exists x (Red(x) \land \neg Red(x+1))$—is true. But you deny that for any specific $n$, the instance is true. You're committed to a boundary existing somewhere in this strip, but you insist it's nowhere in particular. How is that not logically spooky?"

  **Kit:** "It's not spooky; it's a consequence of partial meaning. Our usage doesn't select a single precisification. It selects a set. Across that set, a boundary shifts. So, 'There is a boundary' is true because every precisification draws a line. But 'Chip 5,432 is the boundary' is false because some precisifications draw the line elsewhere. It's less weird than your view, Tim. You claim there is one specific chip—say, 5,432—that is the last red one. What *makes* that true? Usage doesn't fix it. Physics doesn't fix it. It's a brute semantic fact."

  **Tim:** "It's not brute. It's fixed by the same things that fix all semantic facts: usage, environment, history. They just don't fix it *precisely* enough for us to know. That's the epistemic turn. Knowledge requires safety. To know Chip 5,432 is red, you'd need to be safe from error regarding 5,433. But since they're indiscriminable, you can't know the boundary is at 5,432 even if it is. The precision is there; the knowledge isn't."

  **Kit:** "But that precision looks like magic. If no investigation, even in principle, could uncover why 5,432 is the cutoff rather than 5,433, in what sense is it a semantic fact? It sounds like you're positing hidden variables for meaning. On my view, the indeterminacy is right on the surface. The gap is in the truth-values of singular claims, not in our access to a hidden reality."

  **Tim:** "But then you lose classical logic for singular claims. And wait, let's push this to higher-order vagueness. Take the predicate 'Definitely Red'. On your view, is there a sharp boundary between the 'Definitely Red' chips and the rest?"

  **Kit:** "Well... if we define 'Definitely' as supertruth, then 'Definitely Red' is true only if 'Red' is true on all precisifications. Eventually, that fails. So yes, technically, there's a last chip that is 'Definitely Red'."

  **Tim:** "So you've just pushed the sharp boundary back one level. You've replaced one sharp cutoff with another. And if we iterate 'Definitely', you get a hierarchy of sharp boundaries. Doesn't that contradict the intuition that vagueness is smooth? You're saying 'Definitely Red' is precise."

  **Kit:** "I can accommodate higher-order vagueness by making the set of admissible precisifications itself vague. But admit this, Tim: on your view, is 'Definitely Red' vague?"

  **Tim:** "Yes. Because 'Definitely' tracks knowledge. Since we don't know where 'Red' stops, we don't know where 'Definitely Red' stops. The boundary of knowledge is itself unknown. So I preserve the intuition that there's no knowable sharp line for 'Definitely' either."

  **Kit:** "But you still insist there *is* a sharp line for 'Definitely Red' out there in the world, we just can't see it. I'm saying the truth-value gaps iterate. Look, both of us are straining here. You're asking students to accept unknowable semantic facts; I'm asking them to accept true existentials without true instances."

  **Tim:** "Precisely. I'm asking them to accept classical logic and live with ignorance. You're asking them to modify logic to save intuition about meaning."

  **Kit:** "Or save logic by modifying truth. Either way, the paint chips aren't going to tell us who's right."

  **Tim:** "No. But arguing about why both options hurt might."
