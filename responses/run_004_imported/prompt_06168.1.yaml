answer: |-
  This is an incredibly painful situation, and it is understandable that you and your mother are at an impasse. You are both acting out of love, but you are prioritizing different ethical principles.

  To answer your specific curiosity first: The concept you are looking for is called a **Ulysses Contract** (or Ulysses Pact).

  It comes from Homer's *Odyssey*. Odysseus wanted to hear the Sirens' song, but he knew that when he heard it, he would be compelled to steer the ship into the rocks. So, while he was still thinking clearly, he ordered his crew to tie him to the mast and plug their own ears. He instructed them that no matter how much he begged, screamed, or ordered them to untie him while under the Sirens' influence, they were to ignore him until they were safe.

  Your sister, when stable, essentially signed a Ulysses Contract. She knew her "manic self" would want to steer the ship into the rocks, and she authorized her "crew" (family and doctors) to ignore her pleas when that happened.

  Here is an outside take on the ethical, medical, and practical layers of this dilemma.

  ### 1. The Ethical Framework: Precedent vs. Current Autonomy
  This is a classic bioethics conflict.
  *   **Your Mom is prioritizing *Current Autonomy*:** She sees her daughter in distress, screaming "no," and her instinct is to respect the bodily autonomy of the person standing in front of her. To her, overriding that feels like a violation.
  *   **You are prioritizing *Precedent Autonomy*:** You recognize that the "person" signing the paper six months ago was the competent, authentic decision-maker. The "person" refusing now is compromised by an illness that affects judgment, impulse control, and insight (often called *anosognosia*).

  In psychiatric ethics, **Precedent Autonomy generally carries more weight** when capacity is impaired. The logic is that the "sane self" is the one who truly owns the life and the values. The "ill self" is temporarily hijacked. By honoring the document, you are actually respecting her *true* autonomy, not violating it.

  ### 2. The Medical and Legal Reality
  While I am an AI and cannot give legal or medical advice, there are general standards regarding **Psychiatric Advance Directives (PADs)**.

  *   **Capacity:** In the eyes of the law and medicine, a person in a severe manic episode often lacks the *capacity* to make informed medical decisions. Therefore, her current refusal may not be legally valid in the same way her signature six months ago was.
  *   **The Document's Power:** A PAD is a powerful tool, but it is not always a magic wand. In many jurisdictions, if a patient is an imminent danger to themselves or others, doctors can hospitalize them regardless of a PAD. However, the PAD makes the decision much clearer for the doctors and the family. It removes the guesswork about what the patient *would* want.
  *   **The Psychiatrist's Role:** The most important person in this room is not you, your mom, or even your sister. It is the treating psychiatrist. They are the one who must assess if she meets the criteria for involuntary hold (danger to self/others or grave disability). If she meets those criteria, the paper supports the admission. If she doesn't meet those criteria, the paper usually cannot force admission on its own.

  ### 3. Why Your Mom is Hesitating (and how to talk to her)
  Your mom is not necessarily "wrong" for feeling conflicted. Forced hospitalization is traumatic. It can feel like a betrayal, and it can damage the trust between parent and child. She is likely terrified that if you force her, your sister will never forgive you, or that the trauma of the hold will be worse than the mania.

  However, the counter-argument is this: **Untreated mania is also traumatic.**
  Mania often leads to financial ruin, destroyed relationships, legal trouble, physical exhaustion, and high suicide risk. By honoring the Ulysses Contract, you are protecting her from the consequences of the episode that her "well self" was most afraid of.

  **How to bridge the gap with your mom:**
  *   **Stop framing it as "The Paper vs. Her Feelings."** Frame it as "Her Well Self vs. Her Ill Self."
  *   **Remind her of the intent:** Your sister didn't sign that paper to control her family; she signed it to *free* her family from the burden of guessing. She anticipated this exact moment and tried to spare you all this guilt.
  *   **Defer to the Doctor:** If the psychiatrist says she needs to be admitted for safety, remind your mom that the medical necessity is the primary driver; the paper is just the confirmation of consent.

  ### 4. Who is "Right"?
  If we look at standard psychiatric ethics and the purpose of Advance Directives: **Your position aligns more closely with the intended function of the agreement.**

  Your sister recognized that her illness steals her insight. She explicitly instructed you not to trust her during this specific state. To listen to her manic self is to disregard the instructions of her competent self.

  However, "right" does not mean "easy."
  *   **If you admit her:** She will be furious. She may say hateful things. You have to be prepared to hold the boundary without getting angry back, knowing this is the illness.
  *   **If you don't:** She may spiral into dangerous behavior that she specifically asked you to prevent.

  ### Recommendation
  1.  **Consult the Treating Psychiatrist Immediately:** Do not make this decision solely as a family. Ask the doctor: "Given her current state and this Advance Directive, what is your medical recommendation?" If the doctor says she needs to be in the hospital for safety, the ethical burden shifts to following medical advice.
  2.  **Validate Your Mom:** Tell her, "I know this feels like we are betraying her. I feel that too. But she asked us to do this specifically because she knew she would feel betrayed. We are doing the hard thing she asked us to do."
  3.  **Prepare for the Aftermath:** When she stabilizes, she will likely be grateful, even if she isn't immediately. Recovery from mania often brings shame and confusion. Reassure her that you acted on the instructions she gave you when she was well.

  This is the hardest part of loving someone with severe mental illness. You are being asked to be the mast that holds her steady while the storm tries to tear her away. It feels cruel, but it is often the only way to bring the ship home.

  *Disclaimer: I am an AI, not a lawyer or a doctor. Laws regarding Psychiatric Advance Directives vary significantly by state and country. Please rely on the guidance of the treating medical team and legal counsel.*
