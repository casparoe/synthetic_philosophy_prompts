  7.  **Final Polish:** Ensure tone is encouraging and academic but accessible. (The user is a CS student, so technical terms like "Turing Machine," "Formal System," "Polynomial Time" are appropriate).

      *(Self-Correction during drafting)*: I need to be careful with the Lucas-Penrose argument. It's controversial. I shouldn't present it as "fact" but as "The Argument." I need to highlight the assumption of *human consistency* which is the weak point often cited by critics (like Putnam or Feferman).

