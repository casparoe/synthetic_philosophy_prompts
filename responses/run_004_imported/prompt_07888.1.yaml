answer: |-
  Here is a draft for a 5-minute toast. It is designed to walk the tightrope: philosophically precise enough for the rationalists, emotionally resonant enough for the family, and strictly adherent to Devon's constraints regarding happiness and procreation.

  **Tone Notes for Delivery:**
  *   **Warmth is key:** Do not deliver this dryly. The philosophy is serious, but the affection should be obvious.
  *   **Pacing:** Pause after the heavier lines to let them land without feeling rushed.
  *   **Eye Contact:** Look at the family during the "traditional" bits, and at the rationalist half during the "philosophical" bits.

  ***

  **The Toast**

  Good evening, everyone. For those who don't know me, I'm [Your Name]. I've been friends with Devon for [Number] years.

  Usually, when you're asked to give a wedding toast, there's a script. You talk about how the couple met, you tell a funny story about how messy they were before they found love, and you wish them a lifetime of unbridled joy and a house full of children.

  But this is Devon we're talking about. And if I stood up here and wished for "unbridled joy," Devon would probably check the exit signs.

  Devon sees the world differently than most. In the rationalist corner of the room, you know exactly what I mean. For the rest of you: Devon takes kindness very seriously. Most people think of ethics as a balance scale—trying to get enough good things to outweigh the bad. Devon doesn't see it that way. To Devon, preventing pain isn't just one side of the equation; it's the whole point.

  Some people chase happiness. Devon chases relief.

  And honestly? In a world that can be incredibly rough, I can't think of a more noble mission.

  Which brings us to why marriage makes sense for someone like Devon. If you believe that the world contains too much suffering, you don't solve that by ignoring it. You solve it by finding a co-pilot.

  Marriage, in Devon's eyes, isn't about multiplying happiness. It's about sharing the burden. It's about having one person in your corner who promises that when things go wrong—and they will—you don't have to face them alone. It's a pact to minimize the downsides for each other. To be a shelter. To be the person who brings you water when you're sick, who listens when you're anxious, and who protects you from a world that often doesn't care enough.

  [Partner's Name], Devon trusts you with this. That is a rare thing. Devon is careful about many things, particularly about the ethics of bringing new life into a world that isn't guaranteed to be kind. You know that Devon has chosen not to pursue parenthood, not out of a lack of love, but out of an abundance of caution. That takes immense integrity. And the fact that you stand here, supporting that choice, tells me everything I need to know about your character. You aren't trying to change Devon; you're joining the mission.

  To the grandparents and family here: I know this sounds different than the fairy tales you grew up with. But look at them. Look at how they treat each other. Isn't *that* the heart of "in sickness and in health"? Isn't promising to protect each other from harm the purest form of love there is?

  Devon, I know you're not convinced that life always nets out positive. I'm not going to stand here and try to argue you into optimism. I know you don't weigh happiness the way the rest of us do.

  But I will say this: I have seen the amount of care you pour into your friends, your work, and now, your partner. Even if you are skeptical about the universe, you make the immediate vicinity around you better. You reduce the net suffering in this room just by being here and caring as much as you do.

  So, I am not going to wish you a life of constant bliss. That's impossible, and it's not what you value.

  Instead, I wish you safety. I wish you resilience. I wish you a partnership that acts as a buffer against the chaos. May your days be quiet, may your burdens be light, and may you always find comfort in each other when the world gets loud.

  Please raise your glasses.

  To Devon and [Partner's Name]. May you be a sanctuary for one another.

  ***

  ### Why this works:

  1.  **The "Lexical" Hint:** The line *"To Devon, preventing pain isn't just one side of the equation; it's the whole point"* signals to the LessWrong crowd that you understand the lexical nature (suffering trumps happiness) without using the jargon that would confuse the grandparents.
  2.  **The Procreation Boundary:** It explicitly validates the choice to remain child-free as an act of "integrity" and "caution," which shuts down the "but grandkids!" pressure while framing it positively for the family.
  3.  **Reframing Marriage:** It redefines marriage from "maximizing utility" to "risk pooling" and "burden sharing." This is technically accurate to Negative Utilitarianism (reducing the negative) but sounds like traditional wedding vows to the family ("in sickness and in health").
  4.  **The "Net Positive" Acknowledgement:** It acknowledges Devon's skepticism about their own life's value without validating it as a depressive episode, framing it instead as a principled stance.
  5.  **The Toast:** The final wish ("May your days be quiet...") is a classic NegUtil blessing (absence of pain) that sounds poetic and warm to a general audience.
