      *   Ensure the "lexical" part is hinted at (suffering isn't just a trade-off, it's a priority).

      *(Self-Correction during final review)*: I need to make sure I don't accidentally imply Devon is *depressed*. Devon is principled, not necessarily sad. The toast should reflect conviction, not melancholy. The partner is the ally in this conviction.

  8.  **Final Output Generation:** (This matches the provided good response.)
