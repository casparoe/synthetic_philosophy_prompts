          *   Blake: Anti-Williamson (Restricted Luminosity). Argues for luminosity of occurrent phenomenal states (bare feels), distinguishing them from classificatory judgments.
      *   **Key Dynamics:**
          *   Deep engagement (not restating opening positions).
          *   Alex presses on whether the phenomenal/judgment distinction holds (registration is cognitive/fallible).
