          *   *Arguments Against:* Complexity of obligations (who inherits? who makes medical decisions?), potential harm to children (stability?), social disruption (public opinion causing unrest).

      *   *Step 3: Bentham's View on Contract & Complexity.*
          *   Bentham loved clarity. Multi-party contracts are messy.
          *   However, he was a codifier. He believed laws should be clear and comprehensive. If the demand exists, the law should regulate it to prevent *greater* mischief (e.g., unprotected partners, illegitimate children).
          *   He distinguished between *penal* sanction (punishment) and *civil* arrangement (rights).

      *   *Step 4: The "Public Opinion" Factor.*
          *   Bentham knew law couldn't get too far ahead of public opinion without causing unrest (pain).
          *   But he also believed in *gradual* reform to educate public opinion.

      *   *Step 5: Children and Dependency.*
          *   Bentham was concerned with the "securities for the future."
          *   If multi-partner households destabilize child-rearing, utility drops.
          *   If they provide *more* support networks, utility rises.
          *   Bentham would demand evidence, not assumptions.

  4.  **Synthesize the Argument:**

      *   *Thesis:* Bentham would likely support decriminalization unequivocally (based on "Offences Against One's Self"). However, regarding *state recognition* (marriage), he would not be automatically committed to it. He would subject it to a rigorous utilitarian calculus. He might support a *contractual* model rather than a traditional "marriage" model, prioritizing clarity and security over tradition.
      *   *Key Distinction:* Decriminalization (Penal Law) vs. Recognition (Civil Law).
      *   *Key Concept:* "Vexation" (legal hassle). If current law causes vexation to polyamorous families (e.g., hospital visitation, inheritance), utility is lost. Fixing this increases utility.
      *   *Key Constraint:* The "Greatest Number." If recognizing it causes massive social backlash (pain) outweighing the benefit to the minority, a cautious Bentham might pause. But a reformist Bentham would argue the backlash is based on "Antipathy," which shouldn't count as valid utility in the long run.

