answer: |-
  This is a sophisticated question that cuts to the heart of Bentham's jurisprudence. To answer it, we must resist the temptation to simply anachronize Bentham as a modern liberal libertarian. While his unpublished writings on sexuality (like *Offences Against One's Self* and the *Paederasty* essays) reveal a fierce hostility to punishing private vice, Bentham was not a natural rights theorist. He did not believe people had an inherent "right" to marriage. He believed laws should be structured to maximize utility.

  Therefore, Bentham would not be *automatically* committed to state recognition of multi-partner unions simply because he opposed their criminalization. In fact, distinguishing between **penal law** (what the state must forbid) and **civil law** (what the state should facilitate) is crucial to reconstructing his position.

  Here is a reconstruction of how Bentham would likely reason through this using his own conceptual apparatus.

  ### 1. The Penal Threshold: The Principle of Sympathy and Antipathy
  First, we must establish the baseline. Would Bentham support *decriminalizing* multi-partner relationships? Yes, unequivocally.

  In *Offences Against One's Self*, Bentham argues that for an act to be a proper subject of penal law, it must produce a "mischief" (harm) to others. He categorizes harms into **primary** (direct injury to a specific person) and **secondary** (alarm or danger to the community).
  *   **Application:** Consensual multi-partner relationships involve no primary harm. The "secondary harm" usually cited by opponents is the erosion of public morals. Bentham rejects this as a manifestation of the **Principle of Sympathy and Antipathy**. If the only objection is disgust ("antipathy"), the law has no footing.
  *   **Verdict:** Criminalizing such relationships creates pain (punishment, loss of liberty) without preventing any calculable mischief. Therefore, penal sanctions must be removed. On this, he is consistent.

  ### 2. The Civil Question: Marriage as a Contract of Security
  The harder question is state *recognition*. For Bentham, marriage is not a sacrament; it is a civil contract designed to provide **security** (particularly for women and children) and manage **property**. In his *Constitutional Code* and writings on codification, Bentham emphasizes that the law should minimize **vexation** (legal hassle/uncertainty).

  Here, Bentham's reasoning would split into two competing utilitarian calculations:

  **A. The Argument for Recognition (Maximizing Security)**
  If adults are living in multi-partner households, the current binary marriage law creates legal *vexation* and insecurity.
  *   **Property and Inheritance:** Without legal recognition, partners lack default rights to inheritance or property division upon dissolution. This leads to litigation (pain/cost).
  *   **Medical and Decision Rights:** Excluding partners from medical decision-making causes anxiety and potential suffering.
  *   **Bentham's Logic:** If the law refuses to recognize these bonds, it forces them into the shadows, creating legal ambiguities that generate litigation and insecurity. A utilitarian legislator should aim to clarify obligations to prevent future disputes. If a contractual framework can be devised where obligations among three or more parties are clearly defined, utility is served by reducing legal vexation.

  **B. The Argument for Hesitation (Complexity and Expectation)**
  However, Bentham was a legal positivist who valued clarity above almost all else. He might hesitate based on the **felicific calculus** regarding legal administration.
  *   **Evidentiary Complications:** Bentham was obsessed with evidence. A binary contract is simple: Party A and Party B. A multi-party contract introduces exponential complexity regarding dissolution. If Partner A leaves, do Partners B and C remain married? How is property divided among three?
  *   **The "Greatest Number":** Bentham's principle is the greatest happiness of the *greatest number*. If recognizing multi-partner marriage creates a legal system so complex that it generates excessive litigation and confusion for the majority (who remain in binary unions), the net utility might be negative.
  *   **Verdict:** Bentham would likely not support simply "opening" traditional marriage. Instead, he would likely propose a **new civil contract category**. He would argue for a specific legal instrument (a "domestic partnership contract") that allows $n$-parties to register obligations clearly, rather than forcing multi-partner dynamics into a binary framework that would break under the strain.

  ### 3. The Question of Children and Dependency
  This is where Bentham's caution would be most pronounced. In *The Theory of Legislation*, Bentham stresses that the state has a legitimate interest in the rearing of children because they are dependent beings who cannot protect their own utility.

  *   **The Calculus:** Bentham would demand empirical evidence, not moral speculation. Does a multi-partner household statistically produce more "pain" (instability, neglect) or more "pleasure" (economic security, more caregiving resources) for the child?
  *   **The "Asceticism" Check:** If opponents argue that children *should* suffer morally to uphold tradition, Bentham rejects this as the **Principle of Asceticism**.
  *   **The Utilitarian Check:** If evidence suggests that legal recognition stabilizes the household (by securing property and parental rights for all caregivers), utility is increased. If recognition leads to higher rates of family dissolution due to complexity, utility is decreased.
  *   **Likely Stance:** Bentham would likely argue that *legal clarity* benefits children more than *moral tradition*. Unrecognized households leave children vulnerable if non-biological caregivers are barred from custody or support. Therefore, recognition serves the utility of the child by securing their "expectations" of care.

  ### 4. Public Opinion and the "Sanctions"
  Finally, Bentham was a pragmatist. He recognized the **Popular Sanction** (public opinion) as a real force. Even if a law is utilitarian, if it provokes massive public unrest, it causes pain.

  *   **The Transition:** In *Of Laws in General*, Bentham acknowledges that laws cannot always leap too far ahead of public sentiment. However, he also believed the legislator's duty is to *shape* public opinion toward utility, not just follow it.
  *   **Reasoning:** He would argue that public disgust is based on "antipathy," which is an illegitimate basis for law. However, the *turmoil* caused by ignoring that disgust is a real pain.
  *   **Solution:** Gradualism. He would likely support decriminalization immediately (as it removes pain without requiring public approval), but phase in civil recognition as the contractual frameworks are tested and public antipathy diminishes through exposure.

  ### Conclusion: Consistency without Automatic Endorsement
  To answer your specific question: **Bentham's hostility to antipathy does not commit him to supporting multi-partner marriage *per se*, but it does commit him to supporting a legal framework that secures the utility of those involved.**

  He would likely argue that:
  1.  **Criminalization** is unjust (based on antipathy, no mischief).
  2.  **Exclusion from Civil Law** is inefficient (creates vexation, insecurity, and harm to children).
  3.  **Traditional Marriage Expansion** might be legally clumsy.

  Therefore, Bentham would likely advocate for a **system of registered domestic contracts** available to any number of consenting adults, focused on property, medical agency, and child support, rather than "marriage" as a cultural institution. He would support this not because it is "progressive," but because it reduces legal vexation, secures expectations, and refuses to legislate based on disgust.

  He would hesitate only if the evidentiary burden showed that such contracts were unadministrable or demonstrably harmful to dependents. But given his hatred of legal uncertainty, his ultimate inclination would be toward **regulation and recognition** rather than prohibition or neglect.
