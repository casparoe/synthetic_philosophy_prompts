      *   **Principle of Sympathy and Antipathy:** Condemning/approving acts based on personal feeling/disgust rather than harm. Bentham hated this as a basis for law.
      *   **Principle of Asceticism:** Valuing pain over pleasure (often religiously motivated). Bentham rejected this.
      *   **Taxonomy of Offences:** Private offences (against self), semi-private (against neighbors), public offences (against the state/community).
      *   **Civil Law vs. Penal Law:** Penal law punishes harm; Civil law arranges rights/obligations (contracts, property, marriage).
      *   **Evidence & Procedure:** Bentham was obsessed with legal clarity, evidence, and minimizing "vexation" (legal hassle).
      *   **Marriage:** Bentham viewed marriage largely as a civil contract for security, property, and child-rearing, not necessarily a sacrament.

  3.  **Apply Framework to the Specific Issue (Multi-Partner Marriage):**

      *   *Step 1: The Negative Case (Decriminalization).*
          *   Bentham definitely opposes criminalizing consensual adult sexual conduct.
          *   Reasoning: No primary harm to others. Punishment creates pain (security, liberty) without preventing mischief.
          *   Basis: Rejection of "Sympathy and Antipathy" (disgust at "unnatural" acts).
          *   *Conclusion:* Decriminalization is a slam dunk for Bentham.

      *   *Step 2: The Positive Case (Legal Recognition/Marriage).*
