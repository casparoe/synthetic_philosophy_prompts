          *   *Crucial Benthamite move:* Public opinion based on antipathy shouldn't veto utility, but the *consequences* of ignoring it (riots, non-compliance) matter.
      *   *Section 4: Children and Dependency.* Bentham's focus on the future. Evidence-based approach. Does the structure harm the child? If not, no ground for prohibition.
