prompt: |-
  Last weekend, a friend and I spent most of a dinner arguing about the Ellsberg paradox, prompted by a decision theory seminar we are both auditing, and neither of us left persuaded. She defends what I would call the strict Bayesian line: that Savage's sure-thing principle is the correct normative standard for choice under uncertainty, that any coherent set of preferences must be representable as maximizing expected utility against a single subjective probability distribution, and that whatever discomfort people feel about "not knowing the odds" in Ellsberg's urn is a mistake to be corrected rather than a preference worth modeling in its own right. I took the other side, defending something closer to Gilboa and Schmeidler's maxmin expected utility, on the grounds that ambiguity is a genuinely distinct feature of a decision problem that no single-prior theory can capture. I leaned heavily on the three-color version of the paradox -- the urn with 30 red balls and 60 black-or-yellow balls in an unknown split -- where most people prefer betting on red over black, yet also prefer betting on "black-or-yellow" over "red-or-yellow," a reversal that violates the sure-thing principle and cannot be rationalized by any single probability assignment to the urn's composition.

  Where we got genuinely stuck was on Raiffa's old rejoinder to Ellsberg: that an agent who dislikes the ambiguous bets could simply flip a fair coin to decide which color to bet on within the ambiguous urn, thereby securing objective 50/50 odds no matter the urn's true composition. We could not agree on whether this shows ambiguity aversion to be confused -- since ambiguity can always be laundered into ordinary risk this way, making a separate category for it seem unmotivated -- or, on the contrary, vindicates it as a real and distinct preference, since an agent willing to pay for the coin flip is precisely one who finds ambiguity itself costly, over and above whatever risk it gets converted into. Could you write a dialogue between two equally sharp stand-ins for these two positions, set in front of Ellsberg's three-color urn, in which each tries to talk the other out of their bets? I would like the Bayesian to press the randomization move as hard as it will go, including the question of whether the ambiguity theorist can genuinely commit to the coin's result once it lands or would be tempted, by the very same aversion, to renege and revert to the known urn instead -- in which case the randomization would have solved nothing. And I would like the ambiguity theorist to have a real answer rather than folding or simply restating maxmin expected utility as a slogan. Please have them respond to each other's actual arguments move by move, so that neither position comes off as the obvious loser going in.
reasoning: |-
  Here's a thinking process that leads to the dialogue above:

  1.  **Analyze the Request:**
      *   **Topic:** The Ellsberg Paradox (specifically the 3-color urn version).
      *   **Characters:** Two friends/colleagues (let's call them Alex and Jordan) auditing a decision theory seminar.
      *   **Positions:**
          *   *Alex (Bayesian/Savage):* Defends the Sure-Thing Principle, single subjective prior, Raiffa's randomization argument (ambiguity can be "laundered" into risk).
          *   *Jordan (Ambiguity/Maxmin):* Defends Gilboa-Schmeidler, ambiguity as distinct from risk, ambiguity aversion is rational.
      *   **Key Conflict:** Raiffa's rejoinder (flipping a coin to convert ambiguity to risk).
      *   **Specific Requirements:**
          *   Alex must press the randomization move hard, including the *commitment problem* (would Jordan renege after the coin flip?).
          *   Jordan must have a *real answer*, not just slogans.
          *   Dialogue format, set in front of the urn.
          *   Both sides should sound sharp; neither should be an obvious loser.
          *   Move-by-move engagement.

  2.  **Deconstruct the Arguments:**

      *   **The Setup:** Urn has 90 balls. 30 Red (R), 60 Black/Yellow (B+Y). Split of B/Y unknown.
      *   **The Preferences:**
          *   Act $f$: Bet on R ($100 if R, 0 otherwise).
          *   Act $g$: Bet on B ($100 if B, 0 otherwise).
          *   Act $h$: Bet on B or Y ($100 if B or Y, 0 otherwise).
          *   Act $k$: Bet on R or Y ($100 if R or Y, 0 otherwise).
          *   Typical Ellsberg Preference: $f \succ g$ and $h \succ k$.
          *   Violation: $f \succ g$ implies $P(R) > P(B)$. $h \succ k$ implies $P(B) + P(Y) > P(R) + P(Y) \Rightarrow P(B) > P(R)$. Contradiction.

      *   **Raiffa's Argument:** If you prefer R to B because B is ambiguous, mix B and Y using a coin flip.
          *   If you bet on "Coin says B, else Y", you get 50% of the 60 ambiguous balls = 30 balls equivalent.
          *   So the mixed act has a known probability of 1/3 (30/90), just like Red.
          *   If you are indifferent between the mixed act and Red, why prefer Red to pure Black?
          *   *The Commitment Challenge:* If the coin lands on "Bet on Black," do you actually bet on Black? Or do you switch back to Red because Black is still ambiguous *ex post*?

      *   **Ambiguity Theorist's Counter:**
          *   Ambiguity is about the *structure* of the information, not just the final probability.
          *   Randomization is a distinct act.
          *   The cost of ambiguity is real; paying for the coin flip proves it.
          *   *Addressing Commitment:* The preference is over *acts*, not just outcomes. The act "Flip coin then bet" is evaluated *ex ante*. If I commit *ex ante*, the evaluation holds.
          *   *Deeper Point:* Raiffa assumes the state space doesn't change. But for the ambiguity averter, the *correlation* between the coin and the urn matters (or lack thereof). The coin breaks the correlation with the unknown state.

  3.  **Drafting - Scene Setting:**
      *   Location: Seminar room or a bar near campus? Let's go with the seminar room, late evening, urn on the table. Adds atmosphere.
      *   Tone: Intellectual sparring, respectful but stubborn.

  4.  **Drafting - The Dialogue Flow:**

      *   *Opening:* Rehash the preference. Jordan picks Red over Black. Alex challenges.
      *   *Alex's Move 1 (Raiffa):* Introduce the coin. If you mix Black and Yellow, you get known odds. Why pay for ambiguity aversion?
      *   *Jordan's Move 1:* It's not about the odds; it's about the exposure to the unknown state. The coin creates a hedge.
      *   *Alex's Move 2 (Commitment):* Okay, flip the coin. It lands on Black. Now you face the ambiguous urn again. Do you stick? If you switch to Red, you violated your own plan. If you stick, you admitted Black wasn't so bad.
      *   *Jordan's Move 2 (Ex Ante vs. Ex Post):* This is the crux. Dynamic consistency. Jordan needs to argue that the *plan* is the object of choice. Or, argue that the coin changes the *nature* of the bet (correlation).
      *   *Refining Jordan's Counter:* The standard Maxmin answer to Raiffa involves the concept of *randomization as a hedge*. In Maxmin Expected Utility (MEU), randomization can strictly improve utility because the worst-case priors for Act A and Act B might be different. By mixing, you average the payoffs across priors, potentially raising the minimum.
      *   *Alex's Move 3 (The "Why"):* If randomization helps, why isn't it just part of the state space? Savage would say you should have included the coin in the state description initially.
      *   *Jordan's Move 3 (The Nature of Uncertainty):* Knightian uncertainty isn't just missing data; it's missing *confidence*. The coin provides an anchor external to the urn.
      *   *Closing:* No resolution, but mutual respect. The tension remains.

  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Critique:* Is Jordan's answer strong enough? Simply saying "I commit" feels weak against Alex's "But *why* commit if ex-post you hate it?"
      *   *Fix:* Jordan needs to invoke the *value of hedging*. In MEU, preferences are convex. A mix of two acts can be better than either act alone because it reduces the variance across the *set of priors*.
      *   *Alex's Counter to Convexity:* Convexity implies you love mixing for mixing's sake. That's weird.
      *   *Jordan's Rebuttal:* It's not mixing for fun; it's insurance against model misspecification.
      *   *Alex's Commitment Trap:* If the coin lands on Black, the mix is gone. You hold pure Black. Is Pure Black acceptable then?
      *   *Jordan's Solution:* The commitment must be binding. But more importantly, the *evaluation* happens before the flip. The dynamic inconsistency is a feature of ambiguity aversion, not a bug. We need rules, not just spot decisions. (This touches on the literature regarding dynamic consistency in ambiguity models).

  6.  **Writing the Dialogue (incorporating the above):**
      *   *Names:* Let's use "Elena" (Bayesian) and "Marcus" (Ambiguity).
      *   *Props:* The physical urn helps ground the abstraction.
      *   *Pacing:* Start with the bets, move to the coin, hit the commitment problem, end on the philosophical divide.

      *(Self-Correction on the Commitment Problem)*: This is the hardest part. If Marcus says "I commit," Elena asks "But if the coin says Black, and you still hate Black, you'll lie." Marcus needs to say: "The act I value is the *randomized strategy*. Evaluating the outcome *after* the coin flip ignores the insurance value I paid for *before*."
      *Actually, a stronger argument for Marcus:* The coin flip creates a *new* act that is not reducible to the sum of its parts under ambiguity. The state space expands.
      *Better argument:* The "Ex-Ante" view. I evaluate the *strategy*. If I renege, I am time-inconsistent. But being time-inconsistent is permissible if the uncertainty is fundamental.
      *Best argument for the dialogue:* Marcus argues that the coin breaks the *correlation* with the adversary (Nature).

      *Let's try to capture the specific Raiffa commitment critique:* Raiffa argues that if you prefer Red to Black, but are indifferent between Red and (Coin: Black/Yellow), then by transitivity you should be indifferent between Black and (Coin: Black/Yellow). But if you are ambiguity averse, you prefer (Coin: Black/Yellow) to Black. So you pay to flip the coin. But once flipped, if it says Black, you are back to square one.
      *Marcus's defense:* I pay for the *option* to randomize. The value lies in the *ex-ante* reduction of the worst-case scenario. I don't evaluate *ex-post* in isolation.

  7.  **Final Polish:** Check the technical accuracy.
      *   Ellsberg 3-color: 30 Red, 60 Black+Yellow.
      *   Bet R: Prob 1/3 known.
      *   Bet B: Prob unknown (0 to 2/3).
      *   Raiffa: Randomize between B and Y. Prob of winning = 0.5 * P(B) + 0.5 * P(Y) = 0.5 * (P(B)+P(Y)) = 0.5 * (2/3) = 1/3.
      *   So Randomized(B,Y) has known prob 1/3.
      *   If Ambiguity Averse: Prefer R to B. Prefer Randomized(B,Y) to B.
      *   Elena's point: If Randomized(B,Y) is objectively 1/3, it's identical to R. So why not just take R?
      *   Marcus's point: Because I might prefer Randomized(B,Y) to R? No, usually R is fine. The issue is B vs Randomized(B,Y).
      *   Wait, Raiffa's point is: If you prefer R to B, and Randomized(B,Y) is equivalent to R, then you should prefer Randomized(B,Y) to B. This shows you value randomization. But does it show ambiguity aversion is irrational? Raiffa says: You can *construct* the known probability, so your aversion to B is just a failure to see you can construct the hedge.
      *   Marcus needs to say: Constructing the hedge is costly/requires commitment, and the *need* for the hedge proves the uncertainty is real.

      *Let's focus on the Commitment/Ex-Post tension as requested.*
      Elena: "Once the coin lands Heads, you're betting on Black. Do you still hate it?"
      Marcus: "Yes. That's why I need the rule."
      Elena: "So you're binding your future self. But why is your future self wrong?"
      Marcus: "Because my future self lacks the hedge."

      *Okay, ready to write.*

  8.  **Review against constraints:**
      *   Dialogue format? Yes.
      *   Stand-ins for positions? Yes (Elena = Bayesian, Marcus = Ambiguity).
      *   Raiffa's coin press? Yes.
      *   Commitment problem included? Yes.
      *   Marcus has a real answer? Yes (Ex-ante evaluation/Hedging value).
      *   Neither obvious loser? Yes.

      *(Final check on the "Commitment" nuance)*: The prompt specifically asks about whether the agent would be tempted to renege. Elena needs to press: "If you hate Black ex-post, you'll switch. If you switch, the coin was useless. If you don't switch, you admitted Black is okay." Marcus needs to explain why sticking to the plan is rational even if ex-post it looks suboptimal. This touches on *resolute choice* vs. *sophisticated choice*. I will lean into *resolute choice* as a rational response to ambiguity.

      Let's go.cw
answer: |-
  **Setting:** *A university seminar room, late evening. The lights are dimmed, save for a desk lamp illuminating a glass urn on the table. Inside: 30 red balls, 60 mixed black and yellow. Two graduate students, ELENA and MARCUS, stand over it. Empty coffee cups litter the periphery.*

  **ELENA:** (Tapping the glass) Thirty red. Sixty black or yellow. We've been here an hour, Marcus. You say you'll bet on Red. I say you're indifferent between Red and Black.

  **MARCUS:** I'm not indifferent. I'll take Red. Every time. The probability is known. One-third.

  **ELENA:** But the probability of Black *is* one-third, in expectation. You're just refusing to assign a prior.

  **MARCUS:** I'm refusing to pretend I know something I don't. The composition of the black and yellow balls is determined by a process I didn't see. It could be sixty black, zero yellow. It could be zero black, sixty yellow. Red is robust to that ignorance. Black isn't.

  **ELENA:** That's the feeling. But feelings aren't decision theory. Let's bring in Raiffa. (She pulls a quarter from her pocket.) Suppose I don't let you bet on Black directly. Suppose I let you bet on a mixture. I flip this coin. Heads, you bet on Black. Tails, you bet on Yellow.

  **MARCUS:** Okay.

  **ELENA:** Think about the payoff. Regardless of how the urn is filled, there are sixty black-or-yellow balls. If you bet on Black on heads and Yellow on tails, you cover exactly half of that ambiguous sixty. Thirty balls. Plus the coin is fair. So your objective chance of winning is exactly one-third.

  **MARCUS:** I follow the math.

  **ELENA:** So this randomized act—call it *Mix*—has the exact same objective probability of success as betting on Red. One-third. If you are rational, you should be indifferent between Red and *Mix*.

  **MARCUS:** I probably would be.

  **ELENA:** But you said you strictly prefer Red to Black. So by transitivity, you must strictly prefer *Mix* to Black. You are willing to pay for the coin flip to avoid betting on Black directly.

  **MARCUS:** Exactly. That's the point. The coin has value.

  **ELENA:** (Shaking her head) No, that's where you lose me. If the coin converts the ambiguous bet into a risky bet with known odds, then you've admitted the ambiguity was illusory. You could have *always* had known odds. You just didn't look for the hedge. If ambiguity aversion is rational, it should be about the world, not about your failure to randomize. If you can "launder" ambiguity into risk with a quarter, then ambiguity isn't a distinct category. It's just risk you haven't priced yet.

  **MARCUS:** It's not a failure to price. It's a cost of exposure. Think of the urn as an adversary. If I bet on Black, the adversary—who knows the composition—can set the urn to have zero black balls. I lose. If I bet on Red, the adversary can't touch me; there are always thirty red balls.

  **ELENA:** But the coin breaks the adversary's hand. If you randomize, the adversary doesn't know which color you'll pick when they set the urn. Or rather, your expected payoff becomes independent of the split.

  **MARCUS:** Right. So the coin provides insurance.

  **ELENA:** It provides a mathematical identity. $0.5 \times P(Black) + 0.5 \times P(Yellow) = 0.5 \times (P(Black) + P(Yellow)) = 1/3$. This is true for *any* distribution of black and yellow. So, why do you need to actually flip the coin? If the expected value is invariant, why is the pure act of betting on Black inferior?

  **MARCUS:** Because I don't evaluate acts by their average across all possible priors, Elena. I evaluate them by their worst-case prior. For Black, the worst case is zero black balls. Utility zero. For *Mix*, the worst case is... still one-third. The randomization lifts the floor. That's why I prefer it.

  **ELENA:** Okay, here is where I have you. Let's play it out. You pay me for the coin. I flip it. (She mimes a flip, slaps the coin on her wrist.) It's heads. You are now betting on Black.

  **MARCUS:** Correct.

  **ELENA:** The coin has landed. The randomization is over. You are no longer holding *Mix*. You are holding *Black*. The coin is in my pocket. The urn is still ambiguous. Do you still want to bet on Black?

  **MARCUS:** (Pauses) I committed to the strategy.

  **ELENA:** That's not an answer. That's a plea. *Ex-post*, right now, heads is up. You face the ambiguous urn. You told me five minutes ago that facing the ambiguous urn on Black is strictly worse than Red. Do you switch? Do you take your money and bet on Red instead?

  **MARCUS:** If I switch, I violate my *ex-ante* plan.

  **ELENA:** Why is that bad? Your *ex-ante* self wanted insurance. Your *ex-post* self faces reality. If the insurance is gone, and you still hate the risk, switch! But if you switch, then the coin flip solved nothing. You paid for a coin, it landed, and you reneged. You've just burned money on a flip you didn't use.

  **MARCUS:** And if I *don't* switch?

  **ELENA:** Then you admit that *ex-post*, Black is acceptable. And if Black is acceptable *ex-post*, why was it unacceptable *ex-ante*? You're claiming a preference reversal that makes you dynamically inconsistent. Savage would say you're just confused. You can't have it both ways. You can't say Black is terrible, then say "Black-with-a-coin" is great, and then when the coin says Black, say "Okay, Black is fine."

  **MARCUS:** I'm not saying Black is fine. I'm saying the *act* I chose was the randomized strategy. The value wasn't in the outcome of the coin; it was in the correlation structure *before* the flip.

  **ELENA:** Correlation with what? The coin is independent of the urn.

  **MARCUS:** It's not about correlation with the urn. It's about correlation with the *set of priors*. Look, in your Bayesian world, there is one true probability distribution, even if you don't know it. In my world, there is a *set* of distributions. When I evaluate *Mix*, I'm not averaging the outcomes; I'm averaging the *worst-cases*.
  For Bet Black, the worst prior is "All Yellow." Payoff: 0.
  For Bet Yellow, the worst prior is "All Black." Payoff: 0.
  For *Mix*, the payoff is 0.5 if Black, 0.5 if Yellow. The worst prior is... well, any prior. The payoff is always 0.5 times the 60 balls. It stabilizes the payoff across the set of priors.

  **ELENA:** I know the math of Maxmin Expected Utility, Marcus. Gilboa-Schmeidler. Convex preferences. You love mixing for mixing's sake.

  **MARCUS:** Not for mixing's sake. For robustness sake.

  **ELENA:** But back to the wrist. The coin is heads. The mix is gone. You are holding a bet that, five minutes ago, you said was dominated by Red. If you are rational, you maximize utility at every node. At this node, Black is dominated by Red. Switch.

  **MARCUS:** (Leans against the table) This is the commitment problem. And my answer is: Rationality requires resolute choice under ambiguity.

  **ELENA:** (Laughs softly) "Resolute choice." That's a euphemism for "stubborn." You're saying you bind your future self because your future self is going to be cowardly?

  **MARCUS:** I'm saying my future self lacks the information my past self had.

  **ELENA:** What information? The coin result is new information.

  **MARCUS:** No, the coin result is noise. The *structure* of the decision was the information. *Ex-ante*, I knew I was facing an adversary who could exploit my certainty. I purchased a hedge. If I discard the hedge the moment it's tested, I haven't hedged; I've gambled.
  Think of it like an insurance policy. I buy fire insurance on my house. *Ex-post*, if the house hasn't burned down, the insurance looks like a wasted expense. A strict *ex-post* maximizer would say, "I shouldn't have bought this, I have no fire." But that's myopic. I bought it *ex-ante* to handle the state where the house burns.
  Here, I buy the coin flip to handle the state where the urn is hostile.

  **ELENA:** But with fire insurance, if the house burns, you get paid. You don't get to say, "Actually, I changed my mind, give me the premium back and I'll let the house burn."
  With the coin: It lands Heads. You are now in the "Black" state. If you truly believe Black is vulnerable to the adversary, you should cut your losses and bet on Red. If you stay with Black, you are effectively saying, "The adversary isn't actually going to hurt me." Which contradicts your ambiguity aversion.

  **MARCUS:** Here is the distinction you're missing. The value of the coin isn't that it changes the urn. It's that it changes *me*. Or rather, it changes the *description of the act*.
  You treat the act "Bet on Black" as the same object whether I arrived there directly or via a coin flip. I don't.
  "Bet on Black" is an act exposed to model uncertainty.
  "Flip Coin, then Bet on Black if Heads" is an act that is *insured* against model uncertainty.
  When the coin lands Heads, I am not re-evaluating the act "Bet on Black." I am executing the terminal node of the act "Flip Coin..."
  If I renege, I am not maximizing utility; I am changing the act I chose.

  **ELENA:** But the world doesn't care about the history of how you chose the bet. The world only cares that you are betting on Black with an unknown distribution. If that exposure is costly, it's costly now. Why does the history of the coin flip protect you from the urn's composition *now*?

  **MARCUS:** Because the cost isn't just the loss. It's the *regret* of knowing I could have hedged.
  If I switch to Red now, I admit I should have just bet Red initially. But I didn't. I wanted the exposure to the ambiguous urn *conditional on the hedge*.
  Look, Elena, let's be honest. Your Bayesian view assumes that if I can't distinguish between two probabilities, I must treat them as equal. Indifference.
  But I *can* distinguish. I can distinguish "Known 1/3" from "Unknown 1/3."
  The coin flip allows me to treat the Unknown 1/3 *as if* it were Known 1/3.
  When the coin lands, I don't revert to "Unknown." I stay within the framework of the randomized act. I commit to the *procedure*, not just the outcome.

  **ELENA:** So you're arguing for procedural rationality over consequentialism.

  **MARCUS:** I'm arguing that under Knightian uncertainty, consequences aren't fully defined until the procedure is fixed.
  But let me turn it back on you. You say I'm confused. You say I should just assign a prior. Say, 30 Black, 30 Yellow. Subjective probability.
  If I do that, I bet on Black.
  But if I do that, I'm vulnerable. If the seminar professor rigged the urn to be 60 Yellow, I lose. You lose.
  If I use the coin, I win 50% of the ambiguous balls regardless of the rig.
  The coin works. It objectively reduces my vulnerability.
  If a tool works, why is using it "irrational"?

  **ELENA:** Because the tool shouldn't be necessary if you modeled the world correctly.
  If you assign a set of priors, fine. But Raiffa's point is that the set of priors collapses under randomization.
  If you acknowledge that randomization collapses the set, then you acknowledge that the ambiguity was never about the *outcomes*, but about your *correlation* with the state.
  If you are willing to flip the coin, you admit that the uncertainty is quantifiable. You just needed an external randomizer to quantify it.
  So why not just quantify it internally? Why do you need the physical coin?

  **MARCUS:** Because internal quantification is a lie. I don't know the odds. The coin doesn't tell me the odds of the urn; it gives me odds *on my choice*.
  It shifts the uncertainty from the *world* to the *device*. And I trust the device. I don't trust the urn.
  You ask why I need the physical coin? Because I don't trust my own ability to simulate randomness when my livelihood is on the line.
  But more importantly: The fact that I am willing to pay for the coin *is* the preference.
  You want to say ambiguity aversion is a mistake because it can be arbitraged away by a coin.
  I say ambiguity aversion is a fact because people *pay* for the coin.
  If I pay $1 to flip the quarter so I can bet on Black instead of Red, that reveals that *Mix* > *Red* > *Black*.
  That preference ordering is coherent. It satisfies convexity. It just violates Sure-Thing.

  **ELENA:** It violates Sure-Thing, which means you can be money-pumped if you aren't careful about commitment.
  Imagine I offer you the coin flip. You pay me $1. It lands Heads. Now I offer to let you switch to Red for $0.50.
  If you truly prefer Red to Black *ex-post*, you pay the $0.50.
  Total cost: $1.50.
  Result: You bet on Red.
  But you could have just bet on Red at the start for $0.
  You paid $1.50 to end up where you started.

  **MARCUS:** Only if I'm naive. If I'm sophisticated, I anticipate your offer.
  I know that once the coin lands, you will try to exploit my aversion.
  So I don't just flip the coin. I sign a contract. "If Heads, I bet Black. No switches allowed."
  The cost of ambiguity is the cost of binding myself.
  Bayesian agents don't need contracts. They just bet.
  Ambiguity averters need institutions. Rules. Commitments.
  That's not a bug, Elena. That's why we have laws, and norms, and constitutions. Because the future is ambiguous, and our future selves are vulnerable.

  **ELENA:** (She picks up the coin, weighing it.) So you're saying ambiguity aversion is a theory of why we need to bind our own hands.

  **MARCUS:** I'm saying it's a theory of why the world is hostile to precise probabilities. The coin doesn't fix the urn. It fixes the *bet*.
  If you force me to evaluate *ex-post*, you force me to ignore the hedge I bought. That's like evaluating an insurance policy after a safe year and calling it a waste.

  **ELENA:** (She drops the coin back on the table.) It's a compelling story, Marcus. It makes sense of the behavior. But it leaves me with a bitter taste. It suggests rationality isn't about aligning with the truth of the world, but about managing your own psychological vulnerability to the unknown.

  **MARCUS:** Maybe those are the same thing. When the odds are unknown, managing vulnerability *is* aligning with the truth. The truth is, I don't know.
  (He gestures to the urn.)
  You see 90 balls. I see 30 facts and 60 questions.
  You say the coin turns the questions into facts.
  I say the coin just lets me sleep at night while the questions remain.

  **ELENA:** (Smiles, tired.) Well. The seminar starts in ten hours. Do you want to get breakfast?

  **MARCUS:** Sure. You pick the place.

  **ELENA:** No. We flip a coin.

  **MARCUS:** (Grins) Heads I choose. Tails you choose.

  **ELENA:** Deal. But if it lands Tails, don't try to renegotiate because you hate the diner I pick.

  **MARCUS:** Only if you promise the diner isn't ambiguous about its hygiene rating.

  **ELENA:** (Flips the coin.) Done.
