answer: |-
  Your intuition is correct, and your colleague's advice, while statistically common, is potentially dangerous in this specific context. The short answer is: **No, it is not a general rule that you should always defer to the within-group figures.**

  Whether the aggregate or the disaggregated number represents the "truth" depends entirely on the **causal relationship** between gender, division, and promotion. Simpson's Paradox tells you that a relationship reverses when you condition on a third variable, but it does not tell you *which* relationship is the one you should act upon. That is a question of policy and causality, not just statistics.

  Here is the careful breakdown you need for your report, distinguishing between the two possible causal structures at play.

  ### 1. The Two Causal Scenarios

  To decide which number matters, you have to determine what role "Division" plays in the story.

  **Scenario A: Division is a Confounder (The Colleague's View)**
  In this scenario, Division affects Promotion Rates (e.g., Software promotes faster than Hardware), and Division is associated with Gender for reasons *unrelated* to current bias (e.g., historical pipeline issues in certain engineering disciplines).
  *   **The Causal Path:** Gender $\leftarrow$ Historical Pipeline $\rightarrow$ Division $\rightarrow$ Promotion.
  *   **The Interpretation:** If women are underrepresented in Software because of societal pipeline issues from 10 years ago, but the promotion process *within* Software is fair, then the aggregate gap is indeed a statistical artifact of the mix.
  *   **The Verdict:** In this specific case, the within-division figures are the accurate measure of *promotion process fairness*.

  **Scenario B: Division is a Mediator (Your Concern)**
  In this scenario, Gender affects Division Assignment (e.g., women are steered into Hardware), and Division affects Promotion Rates.
  *   **The Causal Path:** Gender $\rightarrow$ Division Assignment $\rightarrow$ Promotion.
  *   **The Interpretation:** If women are being quietly steered into divisions with fewer promotion slots, then Division is a **mechanism of the bias**, not a neutral category. By controlling for Division, you are "controlling away" the discrimination. You are effectively asking, "Is the promotion process fair, *assuming* we accept the placement of women into lower-growth divisions as a given?"
  *   **The Verdict:** In this case, the aggregate figure is the accurate measure of *career outcome equity*. The within-division figures hide the systemic bias that occurred at the point of assignment.

  ### 2. Why "Always Defer to Within-Group" is Risky

  In employment equity and legal contexts (such as OFCCP compliance in the U.S. or Equality Act considerations in the U.K.), dismissing an aggregate disparity because it disappears upon disaggregation is a known pitfall.

  If your report states, "There is no gender gap because within divisions the rates are equal," but it turns out that women are systematically clustered in the divisions with the lowest promotion ceilings, you have identified a **structural barrier** rather than exonerating the company.

  Statisticians call this **over-control bias**. If Division is a mediator (a step in the causal chain of discrimination), conditioning on it blocks the path through which the bias operates. You would be measuring only the *direct effect* of gender on promotion (the decision itself) while ignoring the *indirect effect* (the placement into roles that rarely promote).

  ### 3. Recommendation for the Executive Summary

  Do not choose one number over the other. Instead, use the paradox to tell the complete story. Leadership needs to know both the status of the promotion process and the status of the workforce distribution.

  **Suggested Narrative Structure:**

  1.  **Acknowledge the Aggregate Gap:** State clearly that women are promoted at a lower rate company-wide. This is the "outcome" risk.
  2.  **Explain the Reversal:** Note that within divisions, promotion rates are equitable (or favor women). This suggests the *promotion decision process* itself may not be the primary source of bias.
  3.  **Highlight the Distributional Issue:** Point out that the aggregate gap is driven by the *distribution* of women across divisions.
  4.  **Pose the Critical Question:** Explicitly state that the remaining investigation must determine *why* women are concentrated in divisions with lower promotion velocity. Is it self-selection, historical hiring, or current placement bias?

  **Example Wording:**
  > *"While promotion rates are equitable within individual divisions, the company-wide disparity persists because women are disproportionately represented in divisions with historically lower promotion velocities. This suggests that equity efforts should focus not only on promotion committees but also on divisional assignment, hiring, and internal mobility pathways."*

  ### 4. Immediate Analytical Next Steps

  Before finalizing the report, you should run a quick check to see if Scenario B (Mediation) is plausible. You don't need a full causal model, but you do need to look at **flow data**:

  *   **Entry vs. Tenure:** Are women hired directly into the low-promotion divisions, or do they transfer there later?
  *   **Promotion Velocity by Division:** Is it true that one division promotes faster? If Hardware promotes at 5% and Software at 20%, and 80% of women are in Hardware, the aggregate will look biased even if the process is fair.
  *   **Application Rates:** When promotion slots open, do women apply at the same rate as men within those divisions? If women in Hardware apply less often, that is a within-division cultural issue, not a placement issue.

  ### Summary

  Your colleague is treating Division as a **confounding variable** (noise to be controlled for). You are correctly suspecting it might be a **mediating variable** (a mechanism of the effect).

  *   If Division is a **Confounder**: The within-group rate is the truth about promotion fairness.
  *   If Division is a **Mediator**: The aggregate rate is the truth about career equity.

  Since you cannot prove causality with cross-sectional data alone, the safest and most accurate position for an executive report is to present **both**. The aggregate number highlights the risk (overall disparity); the disaggregated number highlights the locus of the problem (distribution vs. decision). Discarding the aggregate number risks masking a "glass ceiling" that exists at the point of divisional assignment rather than the point of promotion.
