prompt: |-
  I'm on my company's "Architecture Review Board" (ARB) -- six staff/principal engineers who get final sign-off on any big, hard-to-reverse technical decision, like which of two competing internal frameworks becomes the company standard, or whether we migrate off our aging message queue. Lately theres a push, backed by two ARB members themselves, to scrap this setup for a "Technical Referendum": for any major either/or technical call, open it up to a binding, anonymous, company-wide vote among all ~450 engineers, simple majority wins. At the last all-hands someone put up a slide with actual napkin math to back this up: assume each engineer only has like a 55% shot at independently picking the "right" answer, and the probability that a majority of a few hundred of them still land on the right answer climbs into the high 90s. That slide basically won the room overnight -- it turned the debate from "do we trust six people or the whole company" into "the math says a big vote wins," and it's going up for a real vote at the offsite next month.

  I'm skeptical, but I don't want to just say "trust the experts," because honestly the ARB has made some bad, insular calls before -- there's a running joke that ARB actually stands for "always rubber-stamps [some team]'s favorite tool." My gut says the slide's math is quietly smuggling in some assumptions that don't hold up here -- like, nobody's guess is really "independent" when everyone hashes it out in the same week-long Slack thread before voting, and I doubt "55% accurate" means the same thing for a call about our Kafka setup as it does for a call about a frontend build tool that most people have zero context on. But I can't fully work out whether that actually breaks the argument or just makes me feel better about being on the losing side of a popularity contest.

  Could you write the memo I'd bring to that offsite? I need it to land on an actual recommendation -- keep the ARB as-is, go full-referendum, or some specific hybrid -- with a concrete plan for phasing it in (or not) over the next couple of quarters, not just "more discussion needed." And it has to genuinely engage with the "the math says big votes win" argument on its own terms, since that's what's actually persuading people right now, rather than dodge it by just asserting that small groups of experts are obviously better.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Architecture Review Board (ARB).
      *   **Audience:** The other 5 ARB members, engineering leadership, and the ~450 engineers (since it's for an offsite presentation/discussion).
      *   **Context:** There's a proposal to replace the ARB with a "Technical Referendum" (binding, anonymous, company-wide vote) based on Condorcet's Jury Theorem (the "napkin math" about 55% accuracy + large N = high probability of correctness).
      *   **Problem:** The user is skeptical. They acknowledge ARB flaws (insularity, bias) but believe the math relies on false assumptions (independence of votes, varying competence levels based on context).
      *   **Goal:** A memo for the offsite.
      *   **Requirements:**
          *   Must make a specific recommendation (Keep ARB, Go Referendum, or Hybrid).
          *   Must include a concrete implementation plan (phasing).
          *   Must directly engage with the "math" argument (Condorcet's Jury Theorem) on its own terms, not just appeal to authority.
          *   Tone: Professional, persuasive, analytical, not defensive.

  2.  **Deconstruct the "Napkin Math" (Condorcet's Jury Theorem):**
      *   *The Theorem:* If $p > 0.5$ (probability of a voter being correct) and votes are independent, as $n \to \infty$, the probability of a majority correct vote $\to 1$.
      *   *The Flaw 1 (Independence):* Engineers talk. Slack threads, design docs, team leads influence juniors. Votes are correlated, not independent. If the "wrong" narrative wins the Slack thread, the vote skews wrong.
      *   *The Flaw 2 (Competence $p$):* Is $p > 0.5$ for *everyone*? For a frontend tool, maybe. For a Kafka migration, a backend engineer might have $p=0.6$, but a frontend/mobile engineer might have $p=0.4$ (guessing). If the average $p < 0.5$, the theorem reverses: more voters = higher certainty of being *wrong*.
      *   *The Flaw 3 (Definition of "Right"):* Architecture isn't truth; it's trade-offs. "Right" depends on business context, hiring market, legacy debt, which isn't binary.
      *   *The Flaw 4 (Accountability):* Voting is anonymous. ARB members own the decision. Referendum diffuses responsibility.

  3.  **Determine the Recommendation:**
      *   *Option A (Keep ARB):* Hard to sell given the admitted flaws and the momentum behind "democratization." Looks defensive.
      *   *Option B (Full Referendum):* Risky. Violates the independence assumption. Likely to lead to popularity contests (e.g., "Vote for React because I know it" vs. "Vote for Svelte because it's new").
      *   *Option C (Hybrid):* Best path. Keeps accountability (ARB) but increases input (Referendum as advisory). Or, restrict Referendum to specific types of decisions (tooling preference) while keeping ARB for systemic/architectural decisions.
      *   *Selected Strategy:* A "Weighted Advisory Referendum" model. Keep ARB for final sign-off (accountability), but mandate a voting phase for *input* that ARB must publicly address. This satisfies the desire for voice without sacrificing the independence/expertise requirements of the math.
      *   *Wait, a stronger Hybrid:* Distinguish between *Preference* (tooling) and *Constraint* (architecture). Use Referendums for Preferences, ARB for Constraints.
      *   *Actually, the strongest argument:* The math fails on *independence*. The recommendation should be to keep ARB but reform its input mechanism to ensure *independent* data points before the decision, rather than a binding vote.
      *   *Refined Recommendation:* **Retain ARB for Final Sign-off, Implement "Structured Technical Input" (STI) replacing the Referendum.** The Referendum is binding (bad), but a structured survey/vote is data (good).
      *   *Even Better:* **The "Two-Chamber" Model.** ARB remains for high-stakes/irreversible decisions. A "Technical Senate" (elected reps) or Advisory Vote handles lower-stakes tooling.
      *   *Let's go with the most pragmatic Hybrid:* **ARB retains veto/sign-off, but Referendum becomes a mandatory, non-binding "Pulse Check" with strict rules to mitigate correlation.** Actually, the prompt asks for a specific recommendation. Let's recommend **keeping the ARB but fundamentally reforming its input process to capture the "wisdom of the crowd" without the risks of a binding vote.** Why? Because binding votes violate the independence assumption of the very math being used.
      *   *Decision:* Recommend a **Hybrid Model: "Advisory Referendum + ARB Sign-off."** The vote happens, but it's data, not law. ARB must publish a "Decision Record" explaining how they weighed the vote vs. other factors. This addresses the "insular ARB" complaint while protecting against the "math flaws."

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Executive Summary:** State the recommendation clearly. Acknowledge the momentum for the Referendum.
      *   **The Math Argument (The Core):** Directly address Condorcet's Jury Theorem.
          *   Point 1: Independence. Slack threads create herd behavior.
          *   Point 2: Competence ($p$). Not everyone has $p > 0.5$ on every topic.
          *   Point 3: Binary vs. Nuanced. Architecture isn't True/False.
      *   **The Accountability Gap:** Who owns the outage when the majority votes for the wrong DB?
      *   **The Proposal (Hybrid):**
          1.  ARB stays for final sign-off (Accountability).
          2.  Mandatory "Technical Pulse" (The Vote) for input (Democracy).
          3.  ARB must publish a "Response to Pulse" (Transparency).
          4.  Recusal rules for ARB (Fixing the "Rubber Stamp" joke).
      *   **Implementation Plan:** 90-day rollout.
      *   **Conclusion:** Reiterate commitment to better architecture, not just popular architecture.

  5.  **Refining the Tone:**
      *   Avoid "I think." Use "The data suggests."
      *   Don't attack the proponents. Attack the *assumptions* of the model.
      *   Show humility regarding past ARB failures.
      *   Make the math counter-argument rigorous but accessible.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Advisory Vote" just a slower ARB?
      *   *Fix:* Make the "Response to Pulse" mandatory. If ARB overrides the vote, they must justify it publicly. This creates political cost for ignoring the crowd, which is the check-and-balance needed.
      *   *Critique:* Did I engage enough with the 55% math?
      *   *Fix:* Explicitly calculate the risk. If 200 people vote, but they are correlated (e.g., all read the same persuasive but wrong Design Doc), $N$ effectively shrinks to the number of *independent* thinkers, not total voters.
      *   *Critique:* Is the plan concrete?
      *   *Fix:* Add specific timelines (Q1, Q2) and metrics (Decision latency, Satisfaction survey).

  7.  **Final Polish:** Check against constraints.
      *   Recommendation? Yes (Hybrid).
      *   Plan? Yes (Phased).
      *   Engage the math? Yes (Condorcet assumptions).
      *   Tone? Professional, persuasive.

  8.  *(Self-Correction on the Math)*: I need to be careful not to sound like I'm doing a math lecture. Keep it practical. The key insight is "Correlated Error." If the "influencers" are wrong, the crowd is wrong *together*.

  9.  *(Final Plan Adjustment)*: Let's call the hybrid model "The Weighted Advisory Model." It sounds more formal.

  10. **Writing the Memo.** (Proceeding to generate output based on these thoughts).

  **(Post-Drafting Check):** Does this meet the user's need to not just say "trust experts"? Yes, by admitting ARB flaws and using the Referendum proponents' own logic (the math) to show why a *binding* vote fails that logic.

