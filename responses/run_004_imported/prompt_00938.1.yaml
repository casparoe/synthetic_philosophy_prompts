answer: |-
  You have spotted one of the most subtle and crucial distinctions in the history of thermodynamics. Eddington is not contradicting himself, nor is he glossing over a gap. He is actually refining the Second Law of Thermodynamics to prevent a common misunderstanding.

  The short answer is: **Eddington is distinguishing between an *isolated* system (the cards in the hat, the stone after impact) and an *open* system operating between reservoirs (the steam engine).**

  The distinction he draws is genuine physics. In modern statistical mechanics, we would say that while entropy must increase globally, it can decrease locally *if and only if* there is a flow of energy through a gradient that exports entropy elsewhere. The card analogy fails because cards lack the microscopic degrees of freedom required to act as a "heat sink."

  Here is the breakdown of the physics, the analogy, and how you can frame it in your piece.

  ### 1. The Consistency: Local Order vs. Global Disorder
  Eddington's initial rule—"organisation cannot be brought about by continued shuffling"—applies to **isolated systems**. If you leave a system alone (like the stone hitting the ground, or cards mixing in a hat), entropy increases.

  However, his second point regarding the steam engine describes an **open system**. A steam engine does not violate the rule that "organisation cannot be brought about by continued shuffling." Instead, it circumvents it by *exporting* the shuffling.

  *   **The Steam Engine:** It takes heat from a hot source (boiler), converts some to work (organized motion), and dumps waste heat into a cold sink (condenser).
  *   **The Entropy Ledger:** The entropy decrease associated with creating the organized work is *more than compensated for* by the entropy increase of the waste heat dumped into the cold sink.
  *   **The Result:** Total entropy rises. Local order is purchased at the price of greater global disorder.

  Eddington calls disorganization "negotiable" because entropy is not a substance attached to specific molecules (like a dye); it is a statistical property of the distribution. You can "pay" the entropy debt using one batch of energy (the exhaust) to "buy" order with another (the piston motion).

  ### 2. Why the Card Analogy Fails
  This is the core of your confusion, and Eddington anticipates it. He writes: *"Here a point arises which unfortunately has no analogy in the shuffling of a pack of cards."*

  He is admitting that the card analogy is imperfect. Here is why, in modern terms:

  **Cards lack a Thermal Reservoir.**
  To un-shuffle a deck of cards using thermodynamics, you would need to treat the cards as a thermodynamic system with a temperature. You would need a "hot deck" and a "cold deck."
  *   In a steam engine, the "disorganization" is the random motion of molecules. Because there are Avogadro's number of them, we can define a temperature and create a gradient.
  *   Cards are macroscopic objects. They do not have internal microscopic states that act as a heat bath. You cannot create a "card temperature gradient."

  **The "Hat" is an Isolated System.**
  Eddington's example involves throwing two packs into a hat and drawing them out. This implies no external energy source and no heat sink.
  *   **If you added a shuffler:** If a human (an external energy source powered by food/entropy) reached into the hat and sorted the cards, you *could* un-shuffle one deck. But the human would sweat and burn calories, increasing the entropy of the room more than the entropy of the cards decreased.
  *   **Eddington's Point:** You cannot do it *just by shuffling*. But a steam engine isn't just shuffling; it is *flowing* between a source and a sink. The card analogy lacks the sink.

  ### 3. Why the Stone Doesn't Jump Back
  You asked: *"If disorganisation can be siphoned off 'elsewhere'... why doesn't the same maneuver... restore the stone's original organized motion?"*

  It actually **could**, theoretically, but only if you treat the stone and the Earth as a heat engine.
  *   **The Problem:** When the stone hits the ground, its kinetic energy becomes heat in the Earth. To reverse this, you would need to build an engine that operates between the Earth (which warmed up slightly) and a reservoir **colder than the Earth**.
  *   **The Sink:** You would need to dump the waste entropy into something colder (like deep space) to extract enough work to lift the stone.
  *   **Practicality:** In the context of Eddington's "falling stone" example, the stone and Earth are treated as an isolated system after impact. There is no colder reservoir available to drive the reverse process. Without a temperature gradient, there is no flow, and without flow, you cannot negotiate the entropy.

  ### 4. How to Frame This in Your Piece
  Eddington is not making a rhetorical escape; he is making a profound physical clarification. He is moving from a simplistic view of entropy ("things get messy") to a sophisticated view ("entropy is a currency that can be transferred, provided the total debt increases").

  Here is a suggested way to articulate this for your readers:

  > "Eddington is careful to distinguish between the *inevitability* of entropy in an isolated system and the *manageability* of entropy in an open one. The card analogy illustrates the former: in a closed hat, order decays. The steam engine illustrates the latter: by opening the system to a flow of energy, we can locally reverse the decay, provided we export the 'mess' to a cold sink.
  >
  > The distinction is genuine. Cards are macroscopic objects without internal thermal states; they cannot act as their own heat reservoirs. Energy, however, resides in microscopic degrees of freedom that allow for temperature gradients. Eddington's insight is that the 'arrow of time' points toward increasing total entropy, but within that flow, pockets of order can be carved out—like a steam engine—so long as the shadow of disorder they cast elsewhere is larger than themselves."

  ### Summary for your notes:
  1.  **Is the distinction genuine?** Yes. It is the difference between an isolated system (cards in a hat, stone + Earth after impact) and a cyclic heat engine operating between reservoirs.
  2.  **Why not un-shuffle cards?** Because cards don't have a "cold sink." If you used a robot arm powered by a battery to un-shuffle them, you could, but the battery would discharge (increase entropy) more than the cards ordered. Eddington's "hat" scenario excludes the robot arm.
  3.  **Why not lift the stone?** Because the heat is dissipated into the Earth. To lift it, you need a heat engine operating between the Earth and something colder. Without that gradient, the "negotiation" of entropy cannot happen.

  Eddington is essentially describing the **Carnot Cycle** without getting bogged down in the math. He is warning the reader not to take the "shuffling" metaphor too literally, because shuffling implies mixing, whereas thermodynamics allows for *sorting* if you pay the energy cost elsewhere.
