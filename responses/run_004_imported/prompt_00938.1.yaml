      *   "Why doesn't the same maneuver let you un-shuffle a deck..." -> Explain lack of thermal sink in card analogy.
      *   "Is the distinction... genuine..." -> Yes, microscopic degrees of freedom vs macroscopic states.
      *   "Stated in terms a modern reader would recognize..." -> Use Statistical Mechanics terms (microstates, reservoirs, open/closed systems).

