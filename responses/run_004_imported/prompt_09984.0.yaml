          2.  Present the strongest case for *revision* (the *Laws* changes the *Republic*'s view on pleasure/self-mastery).
          3.  Present the strongest case for *consistency* (difference between Guardians vs. Ordinary Citizens).
          4.  Weigh the readings on textual/philosophical merits.
          5.  **Crucial:** End with a specific verdict (commit to one reading). No "split-the-difference."
