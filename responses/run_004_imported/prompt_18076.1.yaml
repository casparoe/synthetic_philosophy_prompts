prompt: |-
  I've spent years following the disagreement threads on Overcoming Bias and LessWrong, and for my podcast on rationality and epistemics I'm about to interview a decision theorist known for arguing, on the strength of Aumann's agreement theorem, that two truth-seeking Bayesians who reach common knowledge of each other's posteriors and still disagree must have gone wrong somewhere -- and that this licenses deferring to others' stated views far more than we're naturally inclined to. Whenever pushed on how this applies outside idealized models, she retreats to saying the theorem is "just math, not a matter of opinion." Draft eight interview questions that don't let her hide behind that retreat: I want at least one question on whether the common prior assumption can plausibly hold between two humans shaped by different genes and upbringing; one on Robin Hanson's proposal that agents choose their priors as though behind a veil of ignorance about which of many possible people they'd turn out to be, and whether that move just relocates the disagreement rather than resolving it; one on the gap between the theorem's requirement of full common knowledge of posteriors and the far weaker mutual awareness that shows up in an actual argument; and one on whether a norm of universal deference would end up destroying the very private information that made anyone's stated view worth deferring to in the first place. For each, add a short follow-up keyed to the deflection she's most likely to reach for.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** The user is hosting a podcast on rationality and epistemics.
      *   **Guest:** A decision theorist known for arguing that Aumann's Agreement Theorem implies we should defer to others' stated views much more than we do (strong conciliationism).
      *   **Guest's Tactic:** When challenged on real-world applicability, she retreats to "It's just math, not a matter of opinion."
      *   **Goal:** Draft 8 interview questions that prevent this retreat.
      *   **Specific Requirements:**
          *   At least one question on the *Common Prior Assumption* (CPA) regarding genes/upbringing.
          *   At least one question on *Robin Hanson's Veil of Ignorance* proposal (does it relocate disagreement?).
          *   At least one question on the gap between *Common Knowledge* vs. *Mutual Awareness* in actual arguments.
          *   At least one question on whether *Universal Deference* destroys private information (informational cascades/loss of diversity).
          *   Each question needs a short follow-up keyed to her likely deflection ("It's just math").
      *   **Tone:** Challenging but professional, suitable for a podcast interview.

  2.  **Deconstruct the Guest's Position & Defense:**
      *   *Position:* Aumann's Agreement Theorem (AAT) shows rational agents with common priors cannot agree to disagree. Therefore, if we disagree, one of us is irrational or we haven't truly exchanged information. We should update heavily toward others.
      *   *Defense:* "The theorem is mathematically true. You can't argue with math."
      *   *Counter-Strategy:* The math is true *given the axioms*. The debate isn't about the math; it's about whether the *axioms map to reality*. The questions must force her to defend the *mapping*, not the *theorem*.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Common Prior Assumption (Genes/Upbringing).*
          *   *Draft 1:* Do humans have common priors given different genes?
          *   *Refinement:* Make it harder to dodge. Focus on the biological/psychological reality vs. the mathematical assumption.
          *   *Follow-up:* If she says "Math doesn't care about biology," pivot to normative force. If the math doesn't describe us, why follow it?

      *   *Requirement 2: Robin Hanson's Veil of Ignorance.*
          *   *Draft 1:* What about Hanson's idea of choosing priors behind a veil?
          *   *Refinement:* Focus on whether this solves the problem or just pushes the disagreement back to the choice of the veil itself.
          *   *Follow-up:* If she says "It's a useful heuristic," ask if heuristics license the strong normative claim she makes.

      *   *Requirement 3: Common Knowledge vs. Mutual Awareness.*
          *   *Draft 1:* Real arguments don't have common knowledge.
          *   *Refinement:* Highlight the computational impossibility. AAT requires infinite recursion ("I know that you know that I know..."). Real talk is finite.
          *   *Follow-up:* If she says "It's an idealization," ask how much deviation is allowed before the normative force vanishes.

      *   *Requirement 4: Universal Deference & Private Information.*
          *   *Draft 1:* If everyone defers, do we lose private info?
          *   *Refinement:* Frame it as a systemic risk. If I defer to you, and you defer to me, do we converge on nothing? Or if I defer to the consensus, does my unique data get swallowed?
          *   *Follow-up:* If she says "True Bayesians aggregate," point out humans aren't true Bayesians and the norm might break the aggregation mechanism.

      *   *Filling the remaining 4 questions:*
          *   Need to cover: Computational bounds, the definition of "truth-seeking," the status of "math" in normative claims, and the practical outcome of her view.
