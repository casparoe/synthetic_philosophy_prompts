prompt: |-
  Ok so this has been bugging me since a family bbq a few weeks back and I still haven't sorted out what I actually think about it. My older brother pulled me aside and told me he's worried about how much I've been drinking lately, like 4-5 beers most nights after the kids are in bed, and that it's probably making me less present as a dad. Annoying thing is he's probably just factually right about that, I have been overdoing it. But this is the same brother who spent basically his whole 20s and half his 30s as a genuinely bad alcoholic, missed my wedding rehearsal dinner because he was too drunk to stand, and said some truly nasty stuff to our mom more than once back then. He's been sober 5 years now and is honestly a way better, more solid person, I don't want to take that away from him at all. Still, in the moment my gut reaction was basically "you, of all people, do not get to say this to me," even though I couldn't really explain why that should matter if what he's saying is true.

  So I brought it up with a friend over coffee and she basically said I was just deflecting, that wether he used to have a way worse drinking problem than me has zero bearing on if what he's saying right now is true, and that I should judge the point on its own instead of judging the guy making it. Which, ok, I can't really find a hole in that logically. But it still feels incomplete to me somehow, like there's a piece missing from that picture. Its not that I think he's factually wrong, it's more like I've got this nagging sense that WHO says something can matter for reasons that go beyond whether its true, and I honestly can't articulate what those reasons would even be, if they exist at all.

  So genuinely curious what you think here: does it actually matter, in some real sense, that this is coming from him specifically, separate from whether he's correct? And does the sober 5 years change anything, like does cleaning up your own act eventually earn you the right to say this kind of stuff, or is that whole question beside the point and my friend's just right and I should drop it and actually listen to him?
