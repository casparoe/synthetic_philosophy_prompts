answer: |-
  This is a really sophisticated emotional puzzle, and your intuition that your friend's advice is "logically sound but incomplete" is spot on.

  Your friend is applying the rules of formal logic (specifically, avoiding the *ad hominem* fallacy). In a debate or a scientific context, she is 100% correct: the truth value of a statement is independent of the person stating it. If a known liar says "2+2=4," the math is still correct.

  But human relationships aren't a debate club. They are built on trust, history, hierarchy, and emotional safety. In that context, **who** says something matters immensely.

  Here is the missing piece of the picture you're looking for, broken down into why your gut reaction makes sense, how the brother's sobriety changes the equation, and how to separate the two issues.

  ### 1. Validity vs. Standing
  There is a difference between a statement being **factually valid** and a person having the **relational standing** to make it.

  *   **Factual Validity:** Is it true that 4-5 beers a night is affecting your parenting? Probably. Your friend is right here.
  *   **Relational Standing:** Does this person have the earned trust, the appropriate role, and the right timing to deliver this critique? This is where your gut is reacting.

  When someone with a history of severe addiction confronts you about your usage, it triggers a specific dynamic. It can feel less like "I care about you" and more like "You are triggering my anxiety" or "I am policing you to maintain my own sobriety."

  Your reaction ("You, of all people...") isn't necessarily about denying the facts. It's about resisting a shift in the family hierarchy. For years, he was the "broken" one and you were the "stable" one. Now, he is positioning himself as the "healthy authority" and you as the "at-risk subject." That is a jarring role reversal, and it's natural to resent it, even if he's right.

  ### 2. The "Projection" Risk
  In recovery communities, there is a concept called "identification." A sober person sees their past behavior in someone else and feels a genuine, urgent need to intervene. Often, this comes from a good place.

  However, there is a shadow side to this. Sometimes, a sober person polices others because it helps them feel secure in their own sobriety. By labeling *you* as the drinker, they reinforce *their* identity as the sober one.

  Your gut might be sensing this. You might be wondering: *"Is he telling me this because he's worried about me, or because seeing me drink makes him uncomfortable?"* That is a legitimate question. If his motivation is even partially about managing his own triggers, the advice loses some of its moral weight, even if the facts remain true.

  ### 3. Does the 5 Years Sober Change Anything?
  Yes, it changes everything, but not in a simple way.

  *   **The Credential:** In the world of addiction, lived experience is the highest credential. A doctor can tell you alcohol is bad; a brother who lost years to it and came back can tell you *how* it steals your life. His 5 years sober gives his warning a gravity that a teetotaler's warning wouldn't have. He knows the slope you're standing on.
  *   **The Hypocrisy Gap:** Usually, past hypocrisy disqualifies you from giving advice. But in addiction, **recovery transforms past hypocrisy into current expertise.** If he were still drinking, he'd have no standing. Because he fixed it, he has earned the right to speak on the *consequences*.

  However, earning the right to speak doesn't earn the right to **confront.** He can have the knowledge without having the invitation to intervene. Pulling you aside at a family BBQ is a high-stakes move. It puts you on the defensive. If he had said, "Hey, I've been there, and I worry. If you ever want to talk about it, I'm here," the dynamic would be different.

  ### 4. So, Who Is Right?
  Your friend is right about the **Data.**
  You are right about the **Delivery.**

  If you focus only on the friend's logic, you might accept the fact but resent the brother, which damages the relationship.
  If you focus only on your gut reaction, you might reject the brother and ignore the fact, which damages your health and family.

  **The Synthesis:**
  It *does* matter that it's him. It matters because his history makes the warning heavier, scarier, and more loaded. It matters because his motivation might be mixed (care for you + care for himself).

  But here is the hard truth: **You can accept the message without accepting his authority.**

  You don't have to concede that "He is the boss of me now." You can think: *"He is factually correct about the drinking, not because he is my moral superior, but because the math of 4-5 beers a night is objective. His history makes him a vivid example of where that road goes, but I get to decide what I do with that information."*

  ### Recommendation
  1.  **Validate the Fact:** Acknowledge to yourself that 4-5 beers most nights is a significant amount of alcohol, regardless of who points it out. Your friend is right: don't let the messenger blind you to the message.
  2.  **Validate Your Feeling:** Acknowledge to your brother (and yourself) that the *way* it was delivered stung. You can say, "I know you're right about the drinking, and I appreciate you care. But because of your history, hearing it from you felt complicated for me."
  3.  **Check the Motive:** If you talk to him again, ask him gently: "Is this about you worrying about me, or is this about you feeling uncomfortable around my drinking?" His answer will tell you if he has the "standing" to be a support system or if he's still working out his own stuff.

  **Bottom line:** Your friend is logically right, but you are relationally right. Don't use his past to dismiss the truth, but don't let the truth force you to ignore the complexity of the relationship. You can change your drinking habits *for yourself and your kids*, not because your brother told you to. That reclaims your agency.
