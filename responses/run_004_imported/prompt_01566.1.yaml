prompt: |-
  So at work I'm building a loan-default risk model, and legal wants it to be 'fair' across two demographic groups. I made sure a 0.8 score means the same real default rate for both groups. Then a coworker noticed that among people who'd have actually paid back the loan, we reject way more of one group then the other. I tried fixing that by adjusting the cutoff per group, but it broke the first property again. My manager thinks this just needs a smarter model, but im starting to suspect no model can have both properties at once unless the groups happen to have identical default rates to begin with. Am I missing something, or is my manager wrong that this is fixable?
