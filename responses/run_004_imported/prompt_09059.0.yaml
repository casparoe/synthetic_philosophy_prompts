  A classical logician stopped me in the hall this morning and said, "Be careful up there. If you assert even one true contradiction, *ex contradictione quodlibet* kicks in. You'll be committed to everything. You'll believe you're the TA, you'll believe you're the students, and you'll believe you're a potted plant."

  I told him, "Relax. I can accept that I'm both prepared and unprepared without believing I'm a potted plant."

  He said, "But that's impossible! Contradiction entails everything!"

  I said, "Not if you reject Disjunctive Syllogism. I live in the gap between 'dialetheia' and 'trivialism'."

  He shook his head. "So you're saying you can hold a contradiction without the explosion?"

  I said, "Exactly. I believe I'm ready. I believe I'm not ready. But I still don't believe I'm a potted plant."

  He paused. "Well... do you believe *I'm* a potted plant?"

  I said, "No. And that's the difference between us. You think accepting a contradiction would force me to believe that. I know it doesn't."

  He said, "That's the most contradictory thing I've ever heard."

  I said, "No. The contradictory thing is my readiness. The part where I don't believe you're a potted plant? That's just the gap that keeps me from being a trivialist."
