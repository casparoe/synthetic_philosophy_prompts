answer: |-
  The emergency bay smelled of bleach and wet fur. Elias didn't look at the dog's eyes. He looked at the leg.

  It was a Golden Retriever, hit by a sedan, dragging the rear left limb at a wrong angle. The bone was protruding, white against the matted gold fur. The dog was panting, a rapid, shallow rhythm that spiked into a high-pitched keen every time the gurney bumped over the threshold.

  "Stabilize," Elias said. His voice was flat. He needed it to be.

  Sarah, the intern, was holding the muzzle. Her hands were shaking. "Heart rate is one-eighty. He's in shock."

  "Fluids. Now." Elias pulled on latex gloves. The snap of the latex was the loudest thing in the room. "We need to set the femur before we move him to surgery. If that artery severs, he bleeds out in two minutes."

  "He's awake, Doctor," Sarah said. "We don't have time for full gas."

  "Local block. Lidocaine. It'll dull the surface. It won't stop the deep pressure."

  Elias stepped in. He placed his hands on the thigh. The muscle was spasming, hard as rock. To Elias, in this moment, the animal was a hydraulic system. The bone was a strut; the muscle was an actuator; the nerve was a wire sending voltage to the central processor. The scream was a feedback alarm.

  If he thought about the scream as a *plea*, his hands would hesitate. If he hesitated, the artery tore. If the artery tore, the machine shut down permanently. So, for the next sixty seconds, Elias had to be a Cartesian. He had to believe there was nobody home.

  "Ready?" Elias asked.

  Sarah looked at the dog's eyes. They were wide, the pupils blown black. "He knows, Elias. He's looking at us."

  "He's looking at movement," Elias said. "It's a threat response. Hold the muzzle."

  Elias gripped the leg above and below the break. He could feel the heat radiating from the inflammation. He took a breath, centered his weight, and pulled.

  The dog didn't just bark. It shrieked. It was a sound that tore through the sterile room, a raw, jagged noise that seemed to have a texture, like tearing metal. The body arched off the table. The jaw clamped down on the leather strap.

  Sarah flinched, tears instantly welling. "Stop, he's—"

  "Push," Elias said. He didn't stop. He couldn't. He felt the grating shift, then the smooth slide of bone finding its groove. He locked the splint. "Done."

  The dog collapsed back onto the table, whimpering, a low, rhythmic vibration.

  Elias stripped off his gloves. His hands were steady, but his stomach was a knot of cold acid. He walked to the sink to wash.

  "That wasn't just a reflex," Sarah said. Her voice was trembling. She was stroking the dog's head. The dog licked her wrist. "You felt that. That wasn't a spring releasing."

  Elias scrubbed his hands. The water was cold. "What is the alternative, Sarah?"

  "That he's in agony."

  "And if he is? Does your hesitation help him?" Elias turned, drying his hands on a paper towel. "Descartes said it best. If they cannot speak to tell us what they feel, we are guessing. We are projecting. That sound?" He pointed at the dog. "That is air passing through a vibrating membrane triggered by a nociceptor signal. It is no different than a smoke alarm going off."

  "A smoke alarm doesn't look at you with terror," Sarah snapped.

  "Terror is a narrative we wrap around the pupil dilation," Elias said. He recited it like a prayer, something he told himself every night so he could sleep. "It is an evolutionary advantage to mimic distress. It triggers care in the parent. It works on us. That doesn't mean the internal state matches the external display. We are wired to be fooled."

  "So you think he's empty?"

  "I think he is complex," Elias said. "I think he is a biological robot of incredible sophistication. And my job is to repair the hardware."

  He walked over to the table. The dog was sedated now, the fluids kicking in. Elias reached out and touched the dog's chest. He could feel the heart hammering against the ribs. *Thump-thump. Thump-thump.* A pump.

  "But," Elias said, his voice dropping, "the hardware is where the ghost would have to live, isn't it?"

  Sarah looked up. "What?"

  "If there is a soul, or a mind, or a 'someone' in there... where is the interface?" Elias pressed his finger against the fur. "If I cut the nerve, the signal stops. If I cut the brain stem, the system shuts down. There is no port for a ghost to plug into. Logic says it's just the machine."

  "Then why do you go home and sleep on the couch so your own dog doesn't feel lonely?" Sarah asked.

  Elias froze. He looked at the Golden Retriever. The dog's breathing had slowed. One eye opened, hazy with drugs. It didn't look at the leg. It looked at Elias.

  There was no language there. The dog could not say, *You hurt me to save me.* It could not say, *I forgive you.* It could not say, *I am afraid.*

  But there was a recognition. A weighting of the gaze.

  "If I believe he feels," Elias said quietly, "then what I just did was torture. I inflicted pain to prevent death. It is a necessary evil, but it is still an evil. I carry that weight."

  "And if you believe he doesn't feel?"

  "Then I am a monster who breaks things and calls it repair," Elias said. "Because if he doesn't feel, then I am violating a being that trusts me, for no reason that *he* can comprehend. I am damaging a creature that lives only in the present, causing it a present-moment horror for a future it cannot conceive."

  He leaned in closer. The dog let out a long sigh, a release of air that sounded like resignation.

  "Descartes said the test was language," Elias murmured. "Flexibility. Handling the new. This dog cannot tell me about the pain. But he can look at me. And I have to decide if that look is a reflection of my own guilt, or a witness to it."

  "Did he suffer, Doctor?"

  The owner was standing in the doorway. She had been in the waiting room, told to stay back. She had heard the scream. She was looking at Elias, demanding absolution.

  This was the hole in the logic. The Cartesian could say *No, the machine malfunctioned.* The Empath had to say *Yes, and I am sorry.*

  Elias looked at the leg, now splinted and still. He looked at the owner, who loved this machine more than her own comfort. He looked at Sarah, who needed to believe the universe was kind enough to give this creature a soul.

  He realized he would never know. He could cut the brain open and map every synapse and still not find the *hurt*. The hurt was invisible. It was a private variable in a closed system.

  "He is stable," Elias said.

  "Did he suffer?" the woman asked again.

  Elias thought about the scream. He thought about the hydraulic pressure of the muscle. He thought about the way the dog had licked Sarah's wrist.

  "I don't know," Elias said.

  It was the only honest answer.

  "But," he added, reaching out to rest his hand on the dog's head, careful not to trigger the wire, "I will act as if he did. I have to."

  "Why?" Sarah asked.

  "Because," Elias said, feeling the warmth of the skull beneath his palm, "if I'm wrong, and he is just a clock... then it doesn't matter if I treat him like a person. But if I'm wrong, and he *is* a person... then I have no right to treat him like a clock."

  The dog closed its eye. The monitor beeped, a steady, rhythmic electronic pulse. It sounded like a heartbeat. It sounded like a timer. It sounded like nothing at all.

  "Take him to recovery," Elias said.

  He turned off the light and walked out into the hall, washing his hands again, scrubbing until the skin was raw, trying to wash away the feeling of the bone sliding into place, trying to decide if the resistance he felt was friction, or fear.
