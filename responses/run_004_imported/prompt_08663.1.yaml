      *   *Wittgenstein's Solution (The Standard Reading):* It's not about memory *reliability* per se; it's about the *possibility of a check*. In the public case, there *exists* a criterion of correctness independent of my immediate impression (e.g., other speakers, color charts, physical objects). In the private case, there is *no* independent check.
      *   *The "Right" vs. "Seems Right" distinction:* In the public case, I can be *wrong* and find out (someone corrects me, the chart disagrees). In the private case, if I think I'm right, I am right (by definition, because there's no external standard). If there's no possibility of being wrong, there's no possibility of being right.
