      *   *Leibniz's Ontological Argument:* Focuses on the *possibility* of the *Ens Perfectissimum*. If perfections are simple/positive, they are compatible. If compatible, God is possible. If possible, God exists (by S5-ish reasoning available to him).
      *   *Leibniz's Modal Collapse:* Arises from the Principle of Sufficient Reason (PSR) + Best of All Possible Worlds. If God *must* choose the best, is the choice necessary? Leibniz distinguishes Hypothetical/Moral Necessity from Absolute/Brute Necessity.
