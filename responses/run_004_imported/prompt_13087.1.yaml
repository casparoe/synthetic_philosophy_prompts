      *   *Anti-Bootstrapping:* Let's call him **Marcus**. He leans towards Internalism/Justification Internalism. He values the *accessibility* of the justification and the structural integrity of the argument. He worries about circularity that hides itself.
      *   *Setting:* A late afternoon in a university department lounge or a quiet cafe. Let's go with a department lounge, coffee in hand. It feels academic.

  3.  **Drafting - Section by Section:**

