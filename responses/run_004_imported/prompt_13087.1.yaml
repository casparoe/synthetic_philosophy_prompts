          *   Marcus concedes that *some* bootstrapping is inevitable but insists there's a difference between *track-record* arguments and *structural* verification.
          *   Actually, let's have Marcus gain ground on the specific *structure* of the reasoning, forcing Elena to admit that "Easy Knowledge" is too cheap, even for an externalist. Or, have Elena convince Marcus that his "Independence Principle" is too strong.
          *   *Decision:* Let's have Elena (Externalist) gain ground by showing that Marcus's requirement for independence leads to a regress that cripples *any* justification, forcing Marcus to retreat to a softer position (not "no bootstrapping ever," but "bootstrapping doesn't yield *knowledge of reliability*, just first-order knowledge"). This nuances the disagreement.
      *   **Round 5: Conclusion.**
