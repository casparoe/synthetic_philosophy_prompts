      *   *Middle:* The meat of the Cohen/Vogel vs. Reliabilism debate. Insert the Compiler analogy here.
      *   *Climax:* The regress argument vs. the circularity argument.
      *   *Resolution:* Mapping the terrain.

      *(Self-Correction on the "Gaining Ground" requirement)*: It's hard to make one win definitively in philosophy. I will have Elena successfully challenge Marcus's "Independence Principle" as being self-defeating, forcing Marcus to modify his stance from "Bootstrapping is invalid" to "Bootstrapping doesn't provide *dialectical* force." This is a shift in ground.

  6.  **Final Polish:** Check the voices. Elena should sound confident in the external world. Marcus should sound cautious about the structure of reasoning. Ensure the Ken Thompson reference is accurate (the "Trusting Trust" Turing Award lecture).

      *Key Philosophical Terms to weave in:* Reliabilism, Internalism, Externalism, Track-record argument, Question-begging, Dialectical efficacy, Proper function.

