answer: |-
  **Elena (Epistemicist):** Look, Sam, I'll grant you this: supervaluationism feels more comfortable than my view. Telling students there's a specific number of grains where "heap" turns to "non-heap," but we can't know it, is a hard sell. You get to say there's no such number. But I don't think you actually escape the sharp boundary. You just hide it in the semantics.

  **Sam (Supervaluationist):** That's the standard objection, but it misses the mechanism. I don't say there's no boundary *on a precisification*. On any single admissible way of making "heap" precise, there is a cutoff. But truth is *super-truth*—truth on *all* admissible precisifications. Since different precisifications draw the line at different grains, there is no single number $n$ such that it is super-true that $n$ is the last heap. The boundary is smeared out across the set of precisifications.

  **Elena:** But your logic is still classical. That's the selling point, right? You keep the Law of Excluded Middle and standard quantifier rules. Well, classical logic validates existential generalization. If the Sorites conditional $\forall n (H_n \to H_{n+1})$ is false—which you admit, because it fails on some precisifications—then its negation is true. That means $\exists n (H_n \land \neg H_{n+1})$ is super-true. You are committed to the claim that *there is* a sharp cutoff, even if you can't point to which $n$ it is. You've kept the sharp boundary; you've just made it unknowable in principle, not just in practice. That looks suspiciously like epistemicism without the nerve to own it.

  **Sam:** That's a conflation of object-language and meta-language. Yes, $\exists n (H_n \land \neg H_{n+1})$ comes out super-true. But that doesn't mean there is a specific number $k$ such that $H_k \land \neg H_{k+1}$ is super-true. For any specific $k$, it's indeterminate. So, while I accept "There is a cutoff," I deny "Here is the cutoff." The existential claim is true, but no instance is. That's the whole point of failing bivalence for borderline cases. I'm not saying the boundary is unknowable; I'm saying the question "Which number is the boundary?" presupposes a precision the language lacks.

  **Elena:** Fine, let's push that to higher-order vagueness, because that's where the "Definitely" operator ($D$) comes in. You introduce $D$ to explain the borderline cases. A case is borderline if $\neg Dp \land \neg D\neg p$. But now consider the transition from the definitely heaps to the borderline heaps. Is there a sharp line between $Dp$ and $\neg Dp$? If you say yes, you've just relocated the sharp cutoff to the boundary of "definiteness." If you say no, then you admit higher-order vagueness. But if there's higher-order vagueness, your logic for $D$ can't be standard. You can't have a sharp set of admissible precisifications.

  **Sam:** I do admit higher-order vagueness. The set of admissible precisifications isn't sharply bounded. Being an "admissible" interpretation of "heap" is itself vague. So there's no sharp line between the precisifications that count and those that don't. That prevents the sharp cutoff from re-emerging at the level of the $D$-operator. The boundary is fuzzy all the way up.

  **Elena:** But how do you model that semantically? To define validity, you need to quantify over the set of admissible precisifications. If the membership of *that* set is vague, then your semantic clauses are vague. But a semantic theory is supposed to explain truth conditions. If the conditions themselves are vague, haven't you just deferred the problem? You're using a precise mathematical model (sets of functions) to describe a phenomenon you claim is inherently imprecise. The moment you write down the model, you've drawn a sharp line between the functions in the set and those outside it.

  **Sam:** The model is a tool, not the territory. I can use a sharp set to model a vague boundary if I treat the model as an approximation. But let's turn the tables. You, the epistemicist, say there is a sharp boundary in reality, or at least in usage. But you also claim we can't know where it is. Why? What mechanism makes it unknowable? If usage determines meaning, and usage is finite, surely there's a fact of the matter we could investigate. You posit a magical cutoff that is causally inert. My view explains the ignorance: there's nothing to know. Yours posits a fact that is permanently hidden. Which is the more mysterious commitment?

  **Elena:** My commitment is to classical logic and the intuition that meaningful predicates must have extensions. The ignorance is explained by the fact that meaning supervenes on usage, and usage underdetermines the extension in borderline cases. It's not magical; it's a limitation of supervenience. But your mystery is worse. You claim to avoid the sharp cutoff, yet your semantics relies on a distinction between admissible and inadmissible precisifications. If that distinction is sharp, you have a cutoff. If it's vague, your logic collapses into something non-classical, like fuzzy logic, which you reject because it loses tautologies. You want to have your classical cake and eat your vague cake too.

  **Sam:** I want to preserve classical logic for the clear cases, which is where it works. I'm not saying the distinction between admissible and inadmissible is sharp; I'm saying the *logic* handles the vagueness by allowing truth-value gaps. The "sharpness" you see in the model is an artifact of formalization. When I say "admissible," I mean something like "compatible with competent usage." That compatibility is a matter of degree. I can iterate the $D$-operator indefinitely to match that degree. You charge me with relocating the problem; I charge you with mistaking a feature of logic for a feature of the world.

  **Elena:** And I charge you with mistaking a feature of your model for a feature of logic. If the compatibility is a matter of degree, then classical logic *doesn't* hold for the $D$-operator. You'll end up validating $Dp \to DDp$ or denying it, and either way, you create a boundary. You haven't eliminated the sharp cutoff, Sam. You've just made it a cutoff between "models that capture the vagueness" and "models that don't."

  **Sam:** Maybe. But I'd rather have a cutoff in my metalanguage than a cutoff in the number of grains of sand. At least I can change the metalanguage.

  **Elena:** And I'd rather have a cutoff in the sand than a logic that tells me a statement is true even though no specific instance makes it true. But I suppose we're both stuck with boundaries somewhere.

  **Sam:** It seems so. The question is just which boundary is more philosophically costly.

  **Elena:** We'll see what the rest of the seminar thinks.
