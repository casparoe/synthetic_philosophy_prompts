answer: |-
  It is a pleasure to address a colleague who brings the conceptual discipline of physics to metaphysics. Your intuition is well-founded: the "Argument from Accidental Intrinsics" is widely regarded as Lewis's most powerful technical argument, but it is not a *knockdown* proof. It relies on specific premises about the nature of properties and relations that are contestable. Furthermore, as you have suspected, Lewis's own solution incurs a structural cost that is remarkably similar to the one he attributes to his opponents.

  Below, I will set out the rigorous case for why the problem of accidental intrinsics fails to decisively favor Counterpart Theory (CT) over a relativized Transworld Identity (TWI) view. I will structure this in three parts: first, by reconstructing Lewis's argument to isolate its critical assumption; second, by demonstrating how a TWI theorist can relativize property possession without turning intrinsics into objectionable relations; and third, by showing how CT merely relocates the relativization rather than eliminating it.

  ### 1. The Structure of Lewis's Argument

  To see where the argument is vulnerable, we must formalize the contradiction Lewis claims arises for TWI. Let $O$ be an object (you), and let $P$ be an intrinsic property (e.g., *having a mass of 80kg*). Let $W_1$ be the actual world and $W_2$ be a possible world.

  **The TWI Assumption:** $O$ exists in $W_1$ and $O$ exists in $W_2$ ($O \in W_1 \land O \in W_2$).
  **The Modal Fact:** $O$ is $P$ in $W_1$, and $O$ is not-$P$ in $W_2$.
  **The Principle of Intrinsicality:** If $P$ is intrinsic, $O$'s having $P$ depends only on $O$, not on $O$'s relation to anything else.

  Lewis argues as follows:
  1.  If TWI is true, then strictly speaking, $P(O)$ and $\neg P(O)$ are both true.
  2.  This is a contradiction ($P \land \neg P$).
  3.  To avoid contradiction, the TWI theorist must say: $P(O, W_1)$ and $\neg P(O, W_2)$. That is, having $P$ is a relation between $O$ and a world.
  4.  But if having $P$ is a relation to a world, $P$ is not intrinsic (violating the Principle of Intrinsicality).
  5.  Therefore, TWI forces us to deny that objects have intrinsic properties.
  6.  CT avoids this because $O_1 \in W_1$ has $P$, and $O_2 \in W_2$ has $\neg P$. No single object has incompatible properties.

  The crux of the argument is **Premise 4**. Lewis assumes that if property possession is indexed to a world, the property ceases to be intrinsic and becomes a relation. The defense of TWI rests on rejecting this inference.

  ### 2. Defending Relativized Transworld Identity

  Your background in physics offers a helpful analogy here. In special relativity, simultaneity is relative to a reference frame. Does this mean "being simultaneous" is a suspicious relation that undermines the reality of events? Not necessarily; it means the *instantiation* of the property is frame-relative.

  A sophisticated TWI theorist (adopting a view often called **Indexicalism** or **Adverbialism**) argues that Lewis conflates the *property* with the *possession* of the property.

  #### A. Worlds as Indices, Not Relata
  Lewis treats the world $W$ as a *relatum*—a second object that $O$ stands in relation to, like "being to the left of $W$." If $P$ becomes "having-$P$-relative-to-$W$," it looks like a relation.

  However, the TWI theorist can argue that worlds function as **indices of actualization**, not relational partners. Consider the temporal analogy. An endurantist (who believes objects are wholly present at different times) says, "The poker is hot at $t_1$ and cold at $t_2$." They do not necessarily claim "hotness" is a relation between the poker and time. They claim the *instantiation* of hotness is temporally indexed.

  Similarly, for TWI:
  *   **Lewis's Caricature:** $O$ bears the relation $R(P, W_1)$ and $R(\neg P, W_2)$.
  *   **TWI Defense:** $O$ instantiates $P$ *at* $W_1$ and instantiates $\neg P$ *at* $W_2$.

  The "at $W$" modifier operates on the copula (the "is" of predication), not on the property term. It specifies the *mode* or *context* in which the property is held. If we accept that intrinsics are properties an object has in virtue of how it is, we can maintain that $O$ is intrinsically $P$ in the context of $W_1$. The relativity is not to an external object, but to the **state of affairs** obtaining.

  #### B. The Definition of "Intrinsic"
  Lewis defines "intrinsic" roughly as "independent of anything else." He argues that if you need to mention a world to specify the property, you've mentioned "something else."

  The TWI theorist counters that a "possible world" in this context is not a concrete "something else" in the same way a neighbor or a measuring rod is. In a TWI framework (specifically one that isn't Lewisian concretism), worlds are often abstract representations or maximal states of affairs. To say "$O$ is $P$ at $W$" is to say "In the complete state of affairs $W$, $O$ is $P$."

  If we define "intrinsic" as **independent of other contingent *objects***, referencing a world (a maximal proposition or state) does not violate intrinsicality. The property $P$ remains monadic; the *truth* of the proposition "$O$ has $P$" is what is world-relative. This preserves the intuition that $P$ describes $O$'s internal constitution, even if that constitution varies across modal space.

  **Conclusion of this section:** Relativizing property *possession* to a world does not logically entail that the property *itself* becomes a relation to a concrete object. It merely acknowledges that modal predication is context-sensitive. This is no more metaphysically costly than saying velocity is frame-relative.

  ### 3. The Mirror Problem in Counterpart Theory

  Now we turn to your second insight: that CT does not escape this difficulty but relocates it. Lewis claims CT saves intrinsicality because $O_1$ (in $W_1$) is strictly $P$, full stop. But this comes at a price regarding *modal* properties.

  #### A. The Relativity of the Counterpart Relation
  In CT, the statement "$O$ could have been $\neg P$" is analyzed as:
  $$ \exists w \exists y (C(y, O, w) \land \neg P(y)) $$
  Where $C$ is the counterpart relation.

  Lewis explicitly admits that $C$ is not an equivalence relation and is not absolute. Whether $y$ is a counterpart of $O$ depends on a **standard of similarity** $S$, which is contextually determined.
  $$ C(y, O, w, S) $$

  This means that $O$'s modal properties (what is possible for $O$) are not intrinsic to $O$. They depend on:
  1.  The existence of $y$ in $w$.
  2.  The contextual standard $S$ employed by the speaker.

  If the TWI theorist is accused of making *categorical* properties (like shape) relative to a world, the CT theorist must admit they are making *modal* properties relative to a contextually shifting similarity standard.

  #### B. The Charge of Extrinsic Modal Properties
  For the TWI theorist, $O$ itself is $P$ in $W_1$.
  For the CT theorist, $O$ itself is $P$ in $W_1$, but $O$'s *possibility* of being $\neg P$ consists in $O$'s relation to a distinct object $y$.

  This leads to a symmetrical problem:
  *   **TWI Cost:** Categorical properties are world-indexed (which Lewis claims destroys intrinsicality).
  *   **CT Cost:** Modal properties are extrinsic relations to counterparts (which many claim destroys the intuition that possibility is about *me*).

  If Lewis argues that world-indexing turns an intrinsic into a relation, he must concede that counterpart-relations turn modal facts into relations. But modal facts are precisely what we are trying to analyze.
  *   In TWI, the object $O$ retains its numerical identity, but its properties are indexed.
  *   In CT, the properties of the counterpart are non-indexed (absolute within their world), but the *connection* to $O$ is relative and extrinsic.

  #### C. Isomorphism of Relativization
  From a structural perspective, the two theories are isomorphic regarding relativity:

  1.  **TWI:** $Property(O, W)$
      *   The property attribution is relative to $W$.
      *   Identity is absolute ($O = O$).
  2.  **CT:** $Counterpart(O, W, S)$
      *   The identity/representation is relative to $W$ and $S$.
      *   Property attribution is absolute for the counterpart ($P(y)$).

  Lewis argues that (1) is unacceptable because properties should be absolute. But in (2), the *truth conditions* for modal claims about $O$ are relative to $S$. If $S$ shifts, what is possible for $O$ shifts. Thus, $O$'s modal profile is not intrinsic to $O$; it is a relation between $O$, other worlds, and a conversational context.

  If the TWI theorist says, "It is not objectionable for property possession to be world-relative," the CT theorist cannot consistently reply, "Yes it is," without undermining their own reliance on a context-relative counterpart relation. If, however, the CT theorist says, "Context-relativity is fine for counterpart relations," then the TWI theorist can reply, "Then world-relativity is fine for property possession."

  ### 4. Synthesis: Why There is "No Good Reason" to Prefer CT

  The argument from accidental intrinsics is intended to be a tie-breaker. It aims to show that TWI is metaphysically incoherent while CT is coherent. The rigorous counter-argument shows that both are coherent but incur different relativization costs.

  1.  **Intrinsicality is Preserved in TWI under a Plausible Definition:** If we define "intrinsic" as "independent of other *contingent objects*," indexing to a world (conceived as a maximal state of affairs) does not violate intrinsicality. It treats worlds as contexts of evaluation, not relational relata. This is semantically and metaphysically stable.
  2.  **CT Incurs an Equivalent Cost:** CT avoids relativizing categorical properties only by relativizing the *identity* relation across worlds. It makes "what is possible for $O$" an extrinsic, context-dependent matter of similarity to other objects. This violates the intuition that an object's modal profile is a matter of its own nature.
  3.  **The Symmetry:** Both theories must relativize *something* to avoid contradiction. TWI relativizes the *copula* (instantiation). CT relativizes the *subject* (identity/reference). Neither relativization is obviously more "objectionable" than the other.

  ### Conclusion for the Reading Group

  You might summarize the position to your group as follows:

  Lewis's argument assumes that "world-relative instantiation" is metaphysically worse than "context-relative counterpart relations." However, for a physicist, this looks like a choice between two coordinate systems.
  *   **TWI** is like a Lagrangian description: you follow the particle ($O$) through the configuration space (modal space), and its properties (coordinates) change relative to the frame (world).
  *   **CT** is like an Eulerian description: you fix the grid points (worlds) and say the particle at point $A$ is distinct from the particle at point $B$, linked only by a flow field (counterpart relation).

  Neither description is "more true" in a way that resolves the contradiction of incompatible properties; they simply locate the relativity differently. Lewis's argument succeeds only if one accepts his specific, rigid definition of "intrinsic" that forbids any indexing. But since CT requires indexing the counterpart relation to a similarity standard, it violates the spirit of that same rigidity. Therefore, the problem of accidental intrinsics does not give us a *good reason* to prefer CT; it merely forces us to choose which kind of relativity we find more palatable. Given your background, you might find the TWI "world-indexing" more akin to standard field theory than Lewis's "similarity relation," which introduces a vagueness (the standard $S$) that physicists usually strive to eliminate.

  Lewis's argument is a powerful challenge, but it is not a refutation. It demonstrates that TWI requires a nuanced theory of property instantiation, not that it is impossible. Since CT requires an equally nuanced theory of cross-world identity, the debate remains open.
