answer: |-
  The ripple had barely settled when the screaming started. It was a sharp, tearing sound that cut through the humid Saturday air of the backyard. Mark dropped his phone into the grass. The screen stayed lit, displaying an email chain about quarterly projections, now irrelevant, now eternal.

  Leo was face down in the deep end.

  Mark was the designated watcher. It was the agreement, the social contract signed over burgers and beer forty minutes prior. While the others mingled near the cooler, Mark sat in the lounge chair with the direct line of sight. He had broken the contract. He had looked at the phone.

  Sarah reached the water first. She pulled Leo out, her movements frantic, mechanical. She laid him on the concrete and began compressions. Mark stood frozen. The logic was immediate and brutal: If Mark had not looked at the phone, he would have seen the slip. If he had seen the slip, he would have shouted. If he had shouted, Leo would be breathing. Mark's inaction was the hole through which the tragedy poured. He was the cause. The weight of it crushed his lungs.

  Paramedics arrived. They worked with practiced efficiency, but the silence of the pool deck returned quickly, heavier than before. They covered Leo. Sarah sat on the concrete, staring at her hands. She looked at Mark, and her eyes were not full of hate, but of a terrifying clarity. "You were supposed to be watching," she said.

  Mark nodded. He accepted the burden. It was his duty. But as the guests began to disperse, avoiding his eyes, a strange infection of thought began to spread in Mark's mind. He looked at David, who had been standing by the fence, holding a red cup. David had seen Mark on the phone. David had seen the splash. David had not jumped.

  If David had jumped, Leo would be alive.

  David hadn't been on duty. David was a guest. But the water didn't know about duties. The physics of the drowning cared only for intervention. Mark's failure was a negative space; David's failure was also a negative space. Both spaces occupied the same causal slot. *If X had acted, Y lives.* X did not act. Y died.

  Mark looked past the fence. The neighbor's house loomed. The neighbor was home; Mark had seen his car. The neighbor had not come over. The neighbor was a competent swimmer. If the neighbor had climbed the fence, if he had sensed something wrong, if he had been here, Leo would be alive. The neighbor's absence was a cause.

  Mark walked to the gate. He looked out at the street. A car drove by. The driver did not stop. The driver did not know Leo was dying, but if the driver had stopped, if he had run into the yard, if he had dived in, Leo would be alive. The driver's non-intervention was a cause.

  The vertigo hit him then, a nausea rising from the soles of his feet.

  He thought of the people sleeping in the houses down the block. They did not jump into the pool. They did not fly over the wall. They did not teleport to the concrete to compress Leo's chest. Every person on earth who did not save Leo was technically a cause of his death. The logic was unbreakable. The counterfactual held true for the babysitter, the guest, the neighbor, the passerby, and the stranger in Tokyo. For all of them, the statement remained valid: *If they had intervened, the boy would not have died.*

  Why did the weight rest only on Mark? Because of the duty? Because of the salience? Those were just stories humans told to filter the noise. But the metaphysics was raw. The world was composed of infinite absences. Every moment was defined by what did not happen.

  Sarah stood up. She walked past him, her shoulder brushing his. She treated him as the murderer. She treated David as a guest. She treated the neighbor as a bystander. She treated the driver as invisible.

  Mark looked at his hands. They were the same hands that hadn't saved Leo. David's hands hadn't saved Leo either. The neighbor's hands hadn't saved Leo. The hands of everyone who continued to breathe, eat, and sleep while Leo lay cold were all equally stained by the same negative logic.

  The sun dipped below the fence line. The shadows lengthened, stretching out like dark fingers reaching from every corner of the city, every corner of the world, all converging on the small, still body on the pool deck. Mark realized then that guilt was not a measure of causation. It was a measure of proximity. But causation was promiscuous. It slept with everyone.

  He picked up his phone from the grass. The screen was cracked. He thought about calling someone, anyone, to explain that the net was wider than they knew, that they were all standing in the same void. But he didn't call. And in that final omission, he knew, the list of causes grew by one more.
