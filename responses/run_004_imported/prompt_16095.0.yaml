prompt: |-
  so my phil of language/logic seminar has spent like two weeks on Fitch's paradox of knowability and i think i get the bare proof -- assume every truth is knowable, assume there's at least one truth nobody happens to know yet, plug that unknown truth into the knowability principle, and you get this Moorean absurdity where it turns out to be *possible* to know "p and nobody knows p," which is incoherent, so the whole thing collapses into there being no unknown truths at all, i.e. secret omniscience. what i'm fuzzier on is how seriously to take this as an actual objection to anti-realist/verificationist theories of truth, which is apparently the whole reason anyone outside a formal logic class cares about it in the first place.

  some of the responses we read for this week -- Tennant's move of restricting the knowability principle so it only applies to propositions that aren't "self-defeating" in this Moore-paradoxical way, and Edgington's fix where she sticks an "actually" operator into the principle so it says every truth is knowable *as things actually stand* -- feel to me like they're just quietly rewriting the anti-realist's commitments so the proof doesnt fire anymore, without much independent motivation for why THAT'S the right way to cash out "all truth is knowable" in the first place. but my professor talks like Tennant basically rescued Dummett-style anti-realism, and my friend in the class thinks the whole paradox is overhyped since no verificationist ever really meant unrestricted knowability anyway. could you write me an essay that actually commits to a position here -- does Fitch's paradox succeed as a genuine refutation of anti-realist/verificationist theories of truth, or does some response (the restriction strategies, or maybe denying a step in the epistemic/modal logic the proof relies on) actually save the anti-realist? walk through the strongest version of the argument and at least a couple of the main replies, but don't let it end on a wishy-washy "there are considerations on both sides" note -- i need an actual thesis i can push back on for my response paper.
