prompt: |-
  So I read Middlemarch for my book club last year and ended up way more interested in George Eliot herself than in the actual plot, if I'm honest. I fell down a whole research hole about her life and found out she was raised pretty religious, then in her early twenties had this huge fight with her dad where she just refused to go to church anymore (I think she even called it her 'holy war' lol), and around that same time she was translating these German theology books, Strauss and Feuerbach I think, that basically argued God is just humanity's own best qualities projected outward onto something imaginary. But the wild part is she didn't turn into a nihilist about morality or anything, if anything she got even more intense about duty and being good. There's this famous story of her walking through a garden at Cambridge telling some guy that "God" was inconceivable and "immortality" was unbelievable, but "duty" was still absolute and non negotiable, which honestly gave me chills when I read it.

  Anyway, completely seperately, a friend of mine has gotten really into effective altruism, where instead of giving to charity based on gut feeling you're supposed to calculate which one does the most good per dollar, and some people in that world take it even further and argue we should weigh the interests of trillions of hypothetical future people way more heavily than people who are actually suffering in front of us right now, since the future numbers are just so much bigger. I can't fully explain why, but something about that second part rubs me the wrong way even though I can't poke an actual hole in the logic. It made me think back to Eliot, since she clearly cared a ton about morality without leaning on God to justify it, kind of like these effective altruism people do. Do you think she'd have basically been on board with this whole mindset if she was alive today, or is there something specific about how she actually thought about duty and sympathy that would make her push back on it hard? I'd rather you actually dig into her specific views than give me some generic "Victorian humanist" answer.
