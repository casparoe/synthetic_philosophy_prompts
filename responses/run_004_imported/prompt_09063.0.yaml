answer: |-
  This is a classic "existential risk for your moral philosophy" moment, and honestly, kudos to your EA club for tackling Bostrom's *Infinite Ethics* (2011). It is one of the most unsettling papers in modern moral philosophy precisely because it targets the mathematical engine room of utilitarianism.

  Marcus is half-right: **Naive Total Utilitarianism** (simply summing all good and bad in the universe) does indeed implode in an infinite universe. If the total value is already $\infty$, adding $+10$ (saving a kid) or $-10$ (torturing someone) results in $\infty$ in both cases. The marginal utility of any action becomes zero.

  However, Marcus is wrong that this kills **Consequentialism**. Consequentialism is the broader family of theories that judge actions by their outcomes. Total Utilitarianism is just one specific *aggregation function* within that family. When an aggregation function breaks, you don't burn down the house; you fix the math.

  Here is the strongest case that infinitarian paralysis is a solvable technical problem, not a fatal philosophical flaw.

  ### 1. The Diagnosis: Why Naive Summing Breaks
  To fix the problem, we have to be precise about why it breaks. The issue is **cardinality**.
  In standard arithmetic, $\infty + 1 = \infty$. If moral value is treated as a simple scalar sum of all utility units in existence, then any finite action is mathematically invisible against the background of an infinite universe.

  This leads to two absurdities:
  1.  **Indifference:** You cannot prefer a world where everyone is happy to a world where everyone is suffering, because both sums are $\infty$.
  2.  **Paralysis:** You have no reason to act, because no action changes the total moral value.

  Marcus argues this means consequences don't matter. The counter-argument is that consequences *do* matter, but our method of **comparing** them needs to be more sophisticated than simple addition.

  ### 2. Solution A: Causal Localization (The "Difference" Principle)
  This is the most robust defense and aligns best with Effective Altruism.

  **The Argument:** Consequentialism shouldn't ask "What is the total value of the universe?" It should ask "What is the **difference** in value caused by my action?"

  Even if the universe is infinite, your **causal light cone** is finite. Due to the speed of light and the entropy of the universe, there is a finite region of spacetime that you can actually influence.
  *   **The Fix:** We restrict the moral calculus to the *causally affected region*.
  *   **The Math:** Let $V(W)$ be the value of the world. Naive utilitarianism compares $V(World_{action})$ vs $V(World_{inaction})$. Both are $\infty$.
      Instead, we compare $\Delta V = V(World_{action}) - V(World_{inaction})$.
      Since the *difference* only exists within your finite causal horizon, $\Delta V$ is a finite number.
  *   **Why it works:** It preserves the core consequentialist insight (we care about outcomes) but acknowledges that we are only responsible for the outcomes we *cause*. The infinite value existing in Andromeda that we can never touch is morally irrelevant to our decision-making because it is a constant in both sides of the equation.

  **Counter to Marcus:** This isn't a cop-out; it's a refinement of scope. Virtue ethics says "be good." Consequentialism says "make things better." Causal Localization says "make the things *you can touch* better." That is still fundamentally consequentialist.

  ### 3. Solution B: The Overtaking Criterion (The Economist's Fix)
  You mentioned remembering economists having a workaround. You are thinking of the **Overtaking Criterion** (often associated with Peter Vallentyne or Shelly Kagan). This addresses the math directly without relying on causal limits.

  **The Argument:** We cannot compare the *final* totals of two infinite sequences, but we can compare their **partial sums** over time.

  *   **The Math:** Imagine two worlds, A and B. We divide the universe into finite slices (e.g., by time or space). We calculate the cumulative value up to slice $n$.
      *   If, after some point $N$, the cumulative value of World A is *always* greater than World B for all $n > N$, then World A is better than World B.
      *   World A "overtakes" World B.
  *   **Example:**
      *   World A (Save the kid): Value sequence = $10, 10, 10, 10...$ (Sum = $\infty$)
      *   World B (Let kid drown): Value sequence = $5, 5, 5, 5...$ (Sum = $\infty$)
      *   At every finite checkpoint, World A has more accumulated value. Even though both end at $\infty$, A is strictly better than B at every meaningful stage of evaluation.

  **Why it rescues Consequentialism:** It allows us to rank actions without ever needing to resolve the final sum. It validates the intuition that adding good things to an infinite universe is better than not adding them, provided the "density" of good is higher.

  **Weakness:** It is sensitive to how you "slice" the universe (the order of summation). However, proponents argue that there are natural slicings (e.g., forward in time from the present) that make this objective enough for moral decision-making.

  ### 4. Solution C: Average Utilitarianism
  If Total Utilitarianism breaks on infinity, **Average Utilitarianism** often survives it.

  **The Argument:** Instead of maximizing the *sum* of welfare, maximize the *average* welfare per sentient being.

  *   **The Math:** In an infinite universe, the Total is $\infty$ and the Population is $\infty$. $\infty / \infty$ is undefined *unless* we treat it as a limit of density.
  *   **Application:** If the universe has an infinite number of beings, but the *density* of happiness is 5 units per cubic light-year in World A and 10 units in World B, World B is better.
  *   **Why it works:** Your finite action changes the local density of value. Saving the kid increases the average well-being in your local cluster, even if it doesn't change the cosmic total.

  **Note:** Average Utilitarianism has its own problems (like the "Repugnant Conclusion" in reverse), but in the specific context of *Infinite Ethics*, it is mathematically more stable than Total Utilitarianism.

  ### 5. Why Marcus's "Virtue Ethics" Move is a Retreat
  Marcus claims this proves we should be virtue ethicists. This is a "god of the gaps" argument. He is saying, "Consequentialism has a hard math problem, therefore we should switch to a system that doesn't try to do the math."

  But consider:
  1.  **Virtue Ethics doesn't solve the infinity problem; it ignores it.** If the universe is infinite and chaotic, does "courage" still matter? If consequences are truly morally irrelevant (as Marcus implies), then virtue becomes a sort of aesthetic preference rather than a moral imperative.
  2.  **Consequentialism is adaptive.** The history of utilitarianism is a history of fixing aggregation problems. We moved from Act to Rule Utilitarianism to handle prediction errors. We moved to Prioritarianism to handle inequality. Moving to **Causal** or **Average** Utilitarianism to handle infinity is just the next step in that evolution.
  3.  **The "So What?" Test:** If Marcus accepts that saving a drowning kid is better than letting them drown, he is making a consequentialist judgment. If he says "It's better because it's the virtuous thing to do," ask him *why* it's virtuous. Usually, the answer loops back to "...because it results in less suffering." If the consequence doesn't matter, the virtue loses its anchor.

  ### The Strongest Synthesis: "Causal Difference Utilitarianism"
  The strongest position for your club to take is a hybrid of **Causal Localization** and the **Overtaking Criterion**.

  We define the moral value of an action not by the total state of the universe, but by the **integral of the value difference** over the **causally accessible future**.

  1.  **It avoids paralysis:** The integral is finite (because our causal future is finite).
  2.  **It remains consequentialist:** It still judges actions entirely by their outcomes (value density in the light cone).
  3.  **It handles the infinity:** It treats the infinite background as a constant baseline that cancels out in the subtraction.

  ### Conclusion for Your Club
  You can tell Marcus: "You're right that *Naive Total Summing* is dead in an infinite universe. Bostrom agrees with you. But Consequentialism isn't just 'sum everything.' It's 'maximize the good.' If we define 'the good' as the **causal difference we make** or the **density of value we sustain**, the math works, the paralysis vanishes, and saving the kid is still better than drowning them. We don't need to abandon consequences; we just need better calculus."

  The infinitarian paralysis is a bug in the *aggregation function*, not the *operating system*. You don't throw away the computer because one app crashed; you patch the app.
