      *   **Part 3: Lewis's Reformed Conditional Analysis (RCA):**
          *   *Student:* "x is disposed to M when C iff x has some intrinsic property B such that, if x were in C and kept B for a little while, B and C together would cause M in the standard way."
          *   *Assessment:* This is the core of Lewis's 1997 paper "Finkish Dispositions." The key move is introducing the *causal basis* ($B$) and the *persistence clause* ("kept B for a little while").
