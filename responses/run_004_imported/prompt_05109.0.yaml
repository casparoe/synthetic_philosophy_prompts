              *   *Johnston's Critique:* Mark Johnston (1992) argued that masks show RCA is still insufficient. If I wrap the glass in foam (mask), it has the basis (molecular structure), but won't break if struck. The conditional "If struck and basis held, it would break" might still fail depending on how the counterfactual is cashed out, or rather, the disposition exists but the conditional fails.
