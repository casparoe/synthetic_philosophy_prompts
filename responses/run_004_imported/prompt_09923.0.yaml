  3. Locke's Victory: Sensory Encapsulation.
  4. Leibniz's Nuanced Victory: Rapid Recalibration & Amodal Structure.
  5. The Motion Asymmetry: Dissolving the Binary.
  6. Conclusion: The Verdict.

