  8.  **Final Polish:** Check citations (Held, Sinha, etc.) conceptually. Ensure the flow is logical. (The resulting essay should look like a draft for a journal like *Philosophy of Science* or *Nous*.)

  *(Self-Correction Note)*: I need to be careful not to overstate Leibniz. Leibniz thought the ideas were *intellectual* and distinct from sense. The modern interpretation is more about *amodal perception*. I should frame Leibniz's "qualification" as the bridge here.

