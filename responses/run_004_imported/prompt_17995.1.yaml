          *   Wait, the adversary picks the sequence $x$. The prisoners pick $r \in [x]$. $x$ and $r$ differ finitely. The adversary can ensure they differ at index 1, or 2, etc. The prisoners can't force $x_n = r_n$ for a specific $n$ because $x_n$ is free within the class constraints.
      *   **Why No Explicit Rule? (The Measure Theory Angle):**
