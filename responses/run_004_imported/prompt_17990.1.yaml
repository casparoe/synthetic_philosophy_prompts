      *   Ensure the tone is respectful but firm. These are colleagues, not enemies.

  7.  **Final Polish:** Check the flow. Does the transition to the meta-question feel earned? (Yes, if Elena points out that Sam's "fundamental" claim is just another linguistic choice).

  *(Self-Correction Note during drafting the ending)*: I need to be careful with the "QV is self-undermining" argument. Sider argues this. Hirsch denies it. I should let Elena deflect the self-undermining charge by claiming she isn't making a metaphysical claim, but a semantic one. Sam should press that the semantic claim *implies* a metaphysical one.

  8.  **Final Review against Prompt:**
