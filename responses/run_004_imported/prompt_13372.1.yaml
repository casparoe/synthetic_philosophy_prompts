answer: |-
  Good morning.

  Six weeks ago, my daughter was born. Holding her for the first time, I found myself doing what new parents often do: projecting a timeline onto a blank slate. I thought about the world she would enter. I thought about the risks she would face. And, because I work at this institute, I thought about the long-term technological hazards we discuss in rooms like this one.

  Before she arrived, these risks were professional abstractions. They were variables in a model, agenda items for a workshop, heuristics for a research grant. Now, they are the weather she will grow up in.

  This shift in perspective brings me to why we are here, and specifically to a text that anchors this workshop. In 1955, John von Neumann published an essay titled "Can We Survive Technology?"

  For those in the room who know this essay well, I will not patronize you with a biography you already know. For those who do not, the context is essential. Von Neumann was perhaps the sharpest mathematical mind of the twentieth century. He helped build the computer, the hydrogen bomb, and game theory. He understood better than anyone that technology had amplified human consequence until it was commensurate with the size of the planet itself.

  He wrote this essay the same year he was diagnosed with the cancer that would kill him less than two years later. Knowing this, it is tempting to read his words solely as a deathbed confession. But to do so is to miss the utility of his argument.

  Von Neumann's central thesis was brutal in its simplicity. He argued that "for progress there is no cure." We cannot stop technological advancement. We cannot return to a pre-technological state. The genie is not just out of the bottle; the genie has industrialized the bottle factory.

  Because we cannot stop progress, we cannot rely on a final solution. There is no technical fix that will permanently secure us against technological risk. There is no treaty, no algorithm, and no shield that, once installed, allows us to relax.

  Instead, von Neumann argued that our only safeguard is a sustained, case-by-case judgment. He called for a discipline sustained by "patience, flexibility, intelligence."

  I ask you to hold that triad in your mind over the next two days: Patience. Flexibility. Intelligence.

  It is easy to misread von Neumann. A careless reading can lead us into one of two traps, both of which are comfortable, and both of which are wrong.

  The first trap is complacency. It is the belief that "we've always muddled through." It suggests that because humanity survived the nuclear standoff of von Neumann's era, we will survive the biological and digital complexities of ours. This ignores the scale. Von Neumann explicitly warned that the consequences of action now match the size of the planet. Muddling through works when the margin for error is large. It fails when the margin is planetary. To treat his essay as a reassurance is to ignore his warning.

  The second trap is the theater of doom. This is the belief that because there is no final cure, there is no hope. It leads to paralysis, or worse, to a frantic search for silver bullets that do not exist. It treats the future as a script that has already been written, where the ending is tragedy.

  Von Neumann, speaking under the pressure of his own mortality, refused both comforts. He did not promise utopia. He did not predict apocalypse. He predicted work.

  He argued that survival is not a destination we reach; it is a practice we maintain.

  This is why I am grateful to see such a mix of people in this room. We have researchers who spend their lives modeling these risks. We have funders who decide which safeguards get built. We have journalists who decide which stories get told. And we have family members who remind us who we are protecting.

  If von Neumann is right, then this workshop cannot succeed if it only produces a paper or a policy recommendation. It must produce a capacity for judgment.

  What does "patience" look like in technological risk? It means resisting the urge to declare a technology safe simply because it is useful, or dangerous simply because it is new. It means accepting that assessment will never be finished.

  What does "flexibility" look like? It means building institutions that can adapt faster than the threats they monitor. It means admitting when a model is wrong, even if that model is our own.

  And what does "intelligence" look like? It means more than raw processing power. It means the wisdom to know that because we cannot stop progress, we must steer it. It means understanding that the human element—the judgment call—is not a bug in the system, but the only feature that matters.

  My daughter will not inherit a world that is solved. I know that now. If I wait for a world where technology is perfectly safe before I let her live in it, I will never let her leave the house. But if I pretend the risks don't exist, I am negligent.

  She will inherit a world that requires what von Neumann asked of us: the courage to make case-by-case judgments without the comfort of a guarantee.

  To the researchers in the room: Your work is not to find the cure for progress. It is to sharpen the tools of judgment so that the next decision is better than the last.

  To the funders and journalists: Your work is not to sell a narrative of salvation or catastrophe. It is to support the slow, unglamorous work of monitoring and adaptation.

  And to all of us: We are here because we accept that the stakes are high, but not hopeless.

  Von Neumann wrote his essay knowing his time was short. He knew he would not see the long term. In a way, we are all in that position now. None of us knows exactly how long we have. None of us knows exactly which innovation will tip the scale.

  But we are here, together, in the short term, making decisions for the long term.

  Let us not waste this time looking for a fix that doesn't exist. Let us not waste it fearing a future we cannot predict. Let us use it to practice the patience, flexibility, and intelligence that survival requires.

  My daughter is sleeping in the next room. She doesn't know about von Neumann. She doesn't know about the workshop. She just knows that the world is big, and she is small. It is our job to ensure that the world remains big enough for her to grow into it.

  Thank you.
