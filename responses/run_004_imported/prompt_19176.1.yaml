prompt: |-
  Random request but you're my go-to for anything word related. I've spent the last year elbow deep in a novel about a self-improvement obsessive, so I basically have Franklin's autobiography memorized at this point -- and now my actual friend Priya is getting married in three weeks and asked me to give the toast. Thing about Priya: she has genuinely kept a Franklin-style virtue chart since freshman year, 13 virtues, a little grid, a black mark every time she slips (Order is a lost cause, shell tell you herself). I want the toast built around Franklin's real project, especially how he tacks Humility onto the list as virtue #13 after a friend tells him he's proud, then admits at the end that he never got the reality of humility, only the appearance of it, and that if he'd actually beaten pride he'd probably be proud of that too. That's basically Priya's whole personality, and I want the speech to use that joke, not just explain it to people. Only catch: half the room has read the autobiography because of her, the other half is her aunt from Ohio -- so give me about five minutes, warm and funny, that never lets the joke curdle into 'ha, she thinks she's perfect,' because she doesn't, and that's the whole point.
