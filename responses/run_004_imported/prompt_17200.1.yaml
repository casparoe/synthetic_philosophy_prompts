answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Two graduate students, Elena and Marcus, are surrounded by stacks of papers. Elena is tapping a pen against a printout of Hilary Greaves' "Cluelessness."*

  **Elena:** It's the asymmetry that gets me. If Greaves is right about simple cluelessness, I can sleep at night. If I save a life today, sure, that person has descendants, and maybe one of them is a tyrant, maybe one is a saint. If the effects are truly random, the expected value of the ripple is zero. It cancels out. I can just count the life saved.

  **Marcus:** Exactly. That's the standard defense. The noise averages out. You maximize based on the foreseeable, direct consequences.

  **Elena:** But complex cluelessness isn't noise. It's structured uncertainty. It's not that I *don't know* if the ripple is good or bad; it's that I have specific, non-random reasons to suspect the long-term effects might be systematically negative, but I can't quantify them. Take the bednet example again. I prevent a child from dying of malaria. That's good. But I also delay death. In a resource-constrained environment, delaying death can lead to greater aggregate suffering later—famine, conflict over scarce resources.

  **Marcus:** The "overpopulation" objection? That's been around since Malthus.

  **Elena:** It's not just Malthus. It's that we have *some* evidence that saving lives now increases strain on systems that are already fragile. We don't have enough evidence to say "this donation causes net harm," but we have enough to break the symmetry. The uncertainty isn't balanced around zero. It's lopsided toward unknown risks. If consequentialism says "maximize the good," but the "good" is hidden behind a wall of structured, unquantifiable ignorance, then the theory is silent. It offers no action guide.

  **Marcus:** You're conflating *Objective Consequentialism* with *Subjective Consequentialism*.

  **Elena:** I'm not. Even Subjective Consequentialism relies on expected value calculations. To calculate expected value, I need probabilities. Complex cluelessness says I *can't* assign coherent probabilities to the long-term effects. If I can't assign probabilities, I can't calculate EV. If I can't calculate EV, I can't maximize.

  **Marcus:** You're demanding a precision that decision theory doesn't require. I don't need to know the exact probability of the butterfly effect causing a war in 2150. I need to know if the *distribution* of outcomes is robust. Look, even if there's a structured risk that saving a life leads to resource strain, there is also a structured probability that saving a life leads to economic growth, innovation, and better resource management. The "human capital" argument counters the "Malthusian" argument.

  **Elena:** But do they counter equally? That's the point of *complex* cluelessness. With simple cluelessness, the arguments for "good ripple" and "bad ripple" are symmetrical in strength. With complex, one side might have more plausibility. If I have a hunch the bad side is weightier, but I can't prove it, how do I plug that into the calculus? Do I weight it at 10%? 50%? If I'm honest, I have to say "probability undefined." And if probability is undefined, the math breaks.

  **Marcus:** "Undefined" is too strong. It's just "highly imprecise." And here's where consequentialism survives: by narrowing the scope of what we claim to optimize. We don't need to solve the entire future of the universe. We rely on *proxy goods*.

  **Elena:** Proxy goods?

  **Marcus:** Reduction of suffering and increase of autonomy are *robustly* instrumentally valuable. Almost any plausible future timeline is better if it contains less preventable suffering and more capable agents. Even if saving the child leads to resource strain, a world with *more* capable, healthy people handling that strain is likely better than a world where they died. We aren't guessing about the specific ripple; we're betting on the capacity of the pool to handle the ripples.

  **Elena:** That's a bet, Marcus. Not a calculation. And it's a bet on a specific theory of progress that might be wrong. But let's grant that. Even if you have robust proxies, complex cluelessness hits hardest on the interventions EA cares about most: existential risk mitigation. If I spend money on AI safety, I'm trying to affect the very long-term future. That is the domain of maximum cluelessness. If I can't know if my AI safety work actually reduces risk or accidentally accelerates capabilities, consequentialism tells me I'm acting blindly.

  **Marcus:** But acting blindly isn't the same as acting irrationally. Consequentialism, properly understood, is a theory of *rational choice under uncertainty*, not a theory of omniscience. If I have two options: Option A has a known, high probability of saving 100 lives now, but unknown long-term effects. Option B has a known, high probability of saving 100 lives now, plus a *speculative* chance of saving billions later.

  **Elena:** And if Option B has a speculative chance of *dooming* billions later?

  **Marcus:** Then I weigh the evidence I *do* have. The cluelessness objection assumes that because I don't know *everything*, I know *nothing* useful. But I do know that extinction is permanent. I know that suffering is bad. The fact that I can't trace the causal chain to the heat death of the universe doesn't mean the chain doesn't exist, or that my intervention doesn't shift the probability mass in a positive direction.

  **Elena:** But if the theory's criterion for "right action" is "produces the best actual consequences," and I am structurally incapable of knowing which action does that... then the theory separates "right action" from "rational action" entirely.

  **Marcus:** That's the Objective vs. Subjective split again.

  **Elena:** It's deeper than that. If I accept Subjective Consequentialism to avoid cluelessness, I'm admitting that I might be objectively doing terrible harm while feeling rationally justified. That severs the link between morality and the *Good*. It turns consequentialism into a glorified intuition pump. "Do what seems best given your limited data." But deontology says that too. "Follow the rule." Utilitarianism was supposed to be the hard-nosed realism that actually looks at outcomes. If it can't look at outcomes because they're too far away, it loses its selling point.

  **Marcus:** It doesn't lose the selling point; it gains humility. Look, Elena, every moral theory has an ignorance problem. If I'm a deontologist and I lie to the murderer at the door to save the friend in the attic, I'm making a consequentialist prediction that the lie won't undermine the categorical imperative or get my friend killed later. I'm just as clueless about the long-term effects of normalizing lying as you are about the long-term effects of bednets.

  **Elena:** Not quite. The deontologist can say, "I didn't lie. That's the end of it. The consequences aren't my moral responsibility." The consequentialist *owns* the consequences. That's the whole deal. If I say, "I'm only responsible for the foreseeable consequences," I'm basically smuggling in a deontological constraint based on epistemic proximity. I'm drawing a line in the sand and saying, "Consequences over here matter, consequences over there don't." Why is that line non-arbitrary?

  **Marcus:** Because of diminishing marginal returns on deliberation costs. It costs cognitive resources to model the future. At some point, modeling the butterfly effect costs more utility than it saves. So we cut off the calculation where the signal-to-noise ratio drops below a threshold. That's not arbitrary; it's efficient.

  **Elena:** Efficient for *me*, maybe. But not necessarily good for the *world*. If the butterfly effect *does* matter—if my donation actually triggers a chain of events leading to a catastrophe—my efficiency doesn't absolve the bodies.
  Here's the real worry: Complex cluelessness suggests that the "best" actions might be invisible to us. Maybe the most consequential thing I can do is buy a coffee and talk to a stranger who goes on to invent fusion power. But I can't know that. So consequentialism tells me to donate to AMF instead. But if the coffee purchase was objectively better, consequentialism guided me wrong.

  **Marcus:** It guided you *rationally* right. You can't fault an agent for failing to access information that is causally inaccessible.

  **Elena:** I can if the theory claims to be about *truth*, not just *justification*. If I'm a truth-seeker, and you tell me, "Believe what is most justified given your evidence," but the truth is actually elsewhere, you've given me a useful heuristic, not a theory of truth. Consequentialism claims to be a theory of the moral truth. Cluelessness shows that moral truth is epistemically locked.

  **Marcus:** Okay, let's concede that. Moral truth is locked. So what? We still have to act. We still have to choose between donating to the bednet fund or buying a yacht. Consequentialism, even with the cluelessness caveat, still says "Donate." Deontology might say "Donate," or it might say "Keep your money, it's yours." Virtue ethics says "Be generous."
  Consequentialism is still the only framework that forces me to look outward at the impact, even if that view is foggy. The other frameworks let me ignore the fog entirely. I'd rather navigate with a blurry map than no map.

  **Elena:** But if the fog is dense enough, the map is misleading. If complex cluelessness means the long-term expected value is dominated by tiny probabilities of massive outcomes—which is the Longtermist position, by the way—then focusing on the "blurry but visible" near-term stuff might be precisely the wrong move. It's a distraction.
  Greaves worries that complex cluelessness makes the expected value of *any* action indeterminate. If it's indeterminate, then donating to AMF isn't "better" than buying the yacht, because the yacht purchase might ripple into something amazing too.

  **Marcus:** That leads to paralysis. And paralysis is objectively worse than imperfect action.

  **Elena:** Is it? If I'm driving blindfolded, is it better to drive "decisively" or stop the car?

  **Marcus:** You're never fully blindfolded. You have headlights. The near-term consequences are your headlights. They illuminate enough of the road to keep going. You're arguing that because the headlights don't show the destination, we shouldn't drive.

  **Elena:** I'm arguing that if the destination is the only thing that determines whether the trip was "successful," and we can't see the destination, we shouldn't pretend we know if we're succeeding. We should admit that consequentialism might be true as a metaphysical claim—"the right act is the one that produces the most good"—but useless as a normative guide. And if it's useless as a guide, why bind ourselves to it?

  **Marcus:** Because it's the only one that keeps us honest about *why* we're driving. We're driving to get somewhere good. Even if we can't see the end, we steer toward the light we have. If you abandon that, you're not just admitting ignorance; you're giving up on the idea that our actions connect to the good at all.

  **Elena:** Or I'm admitting that the connection is too tenuous to bear the weight of "moral obligation." Maybe I save the child because it's *kind*, not because I'm maximizing cosmic utility.

  **Marcus:** And maybe "kindness" is just your brain's heuristic for "things that usually maximize utility."

  **Elena:** *(Sighs, leaning back)* Maybe. But if cluelessness holds, that heuristic is all I have. The utility calculus is a ghost.

  **Marcus:** Then let the ghost haunt the machine. As long as it drives us toward less suffering, I don't care if we can't see the end of the road.

  **Elena:** I do. Because if we're wrong about the road, we might be driving off a cliff. And consequentialism is the only theory that would call that a sin.

  **Marcus:** Then we better keep looking at the map. Even if it's blurry.

  *(They sit in silence for a moment, the hum of the coffee machine filling the gap between them.)*
