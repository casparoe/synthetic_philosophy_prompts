prompt: |-
  I'm a PhD student in philosophy, and I've been asked to give the toast at the wedding of my closest friend from the program, who is finishing a dissertation on G. E. Moore, and her fiancé, who works in finance and has never read a word of philosophy. Roughly half the room will be our department, who will catch it immediately if I get Moore wrong; the other half is family and old friends who have never heard the phrase "organic unity."

  She has told me, half as a joke and half not, that the account of personal affection in the final chapter of Principia Ethica is the closest thing she has to a philosophy of her own marriage. Moore's two paradigm cases of intrinsic value there are the appreciation of what is beautiful and personal affection between people, and both, on his view, are organic unities of appropriate emotion together with a true, accurate cognition of their object — so love grounded in a flattering or imagined picture of the beloved is worth less, not more, than love grounded in an accurate view of a person's actual qualities. Ordinary toast hyperbole, on this view, would cheapen the very thing it's trying to celebrate.

  Write the toast. It has to praise the couple using specific, real, defensible claims about who they actually are rather than superlatives, and it has to quietly defuse — without turning into a seminar — the obvious worry that grounding love's value in a person's particular qualities makes that love conditional on those qualities lasting. Five minutes, warm, and something the philosophers in the room can recognize without anyone else noticing they're doing it.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** PhD student in philosophy.
      *   **Audience:** 50% Philosophy department (will spot Moore references/errors), 50% Family/Finance friends (no philosophy background, need accessibility).
      *   **Honorees:** Bride (finishing dissertation on G.E. Moore), Groom (Finance, non-philosopher).
      *   **Key Philosophical Constraint:** Based on *Principia Ethica*, Chapter 6 (Organic Unities, Intrinsic Value). Specifically, personal affection as an organic unity of appropriate emotion + true cognition of the object. Love based on illusion is less valuable than love based on truth.
      *   **Tone:** Warm, 5 minutes, specific/defensible claims (no empty hyperbole), defuse the "conditional love" worry (i.e., if love depends on qualities, what if they change?).
      *   **Goal:** A toast that works on two levels (philosophical wink vs. general warmth).

  2.  **Deconstruct the Philosophy (G.E. Moore's *Principia Ethica*):**
      *   *Core Concept:* Organic Unities. The value of the whole is not simply the sum of the values of the parts.
      *   *Application to Love:* The state of affairs "A loves B" is valuable. But its value depends on two things: (1) The emotion itself, and (2) The cognition of the object (B).
      *   *The Trap:* If I love you because I think you're perfect, but you aren't, the love is less valuable than if I love you knowing your flaws. Truth matters.
      *   *The Worry:* If love depends on *your* qualities, is it conditional? If you change, does the love vanish?
      *   *The Solution (Moorean/Toast Strategy):* The "object" of love isn't a static list of traits (like "good at finance" or "writes well"). It's the *person* as a dynamic, evolving entity. Accurate cognition includes knowing someone changes. Also, the *relationship itself* becomes part of the organic unity. The value lies in the *fit* between the emotion and the reality, not just the reality itself.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the dual audience. Keep it light. Establish the speaker's relationship.
      *   **The "Philosophy" Bit (The Hidden Layer):** Need to reference Moore without saying "As G.E. Moore argues in Chapter 6." Use terms like "clear-eyed," "truth," "whole greater than parts."
      *   **Praising the Bride:** Needs to be specific. She's finishing a dissertation on Moore. She values precision, truth, rigor.
      *   **Praising the Groom:** Finance background. Practical, grounded. He doesn't read philosophy, but he *lives* a certain kind of truth.
      *   **The Union:** How they fit. The "Organic Unity" concept needs to be translated into "relationship" language.
      *   **Addressing the "Conditional" Worry:** This is crucial. How to say "I love you for who you are" without implying "only as long as you stay this way." The answer is that the *history* and the *commitment* become part of the object of cognition.
      *   **Closing:** A wish for the future. A toast.

  4.  **Iterative Refinement (Self-Correction during drafting):**
      *   *Critique:* Is it too academic?
      *   *Fix:* Avoid jargon like "intrinsic value" or "supervenience." Use "value," "foundation," "reality."
      *   *Critique:* Is the Moore reference clear enough for the philosophers?
      *   *Fix:* Ensure the distinction between "love based on illusion" vs. "love based on truth" is explicit. Mention "appreciation of the real."
      *   *Critique:* How to handle the finance vs. philosophy dynamic?
      *   *Fix:* Frame it as different languages for the same thing: valuation. One values assets, one values ethical truths, both value *this* marriage.
      *   *Critique:* The "Conditional Love" problem.
      *   *Fix:* Emphasize that "knowing someone" includes knowing their capacity to grow. The "truth" about them isn't a snapshot; it's a movie.

  5.  **Drafting the Content (incorporating the "Moorean" constraints):**
      *   *Moore's view:* Love is good. Love + Truth is better.
      *   *Toast line:* "There's a idea that the best kind of affection isn't blind. It's actually the opposite." (Philosophers hear: *Principia Ethica* Ch 6. Others hear: "Love is blind" cliché subversion).
      *   *Specifics:* Mention her late nights in the archives (Bride). Mention his steady reliability (Groom).
      *   *The "Organic" bit:* "The relationship is something new, not just two people side by side."
      *   *The "Conditional" defusal:* "Loving the truth of someone means loving their future changes too."

  6.  **Polishing the Tone:**
      *   Needs to be warm, not dry.
      *   Keep it under 5 minutes (approx. 750-900 words spoken at a moderate pace).
      *   Ensure the punchline lands for both groups.

  7.  **Final Review against Constraints:**
      *   *Moore accurate?* Yes (Emotion + True Cognition).
