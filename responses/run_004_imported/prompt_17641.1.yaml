answer: |-
  Good evening. For those of you who don't know me, I'm a friend of the bride from our graduate program. Which means I've spent the last few years watching [Bride] wrestle with some of the densest, most precise writing in the history of the English language. And I've spent the last few months watching [Groom] patiently ask her how it's going, while secretly hoping she'll finish soon so they can pick a venue.

  Standing here, I feel a certain pressure. Usually, at a wedding, my job is to tell you how perfect this couple is. To use words like "soulmates" and "destiny." To engage in what we might call strategic exaggeration.

  But anyone who knows [Bride] knows that she has spent the better part of a decade studying a philosopher who had a very specific allergy to exaggeration. G. E. Moore was a man who believed that if you wanted to say something was good, you had to be very clear about what you were looking at. He argued that the things that make life most worth living—beauty, friendship, love—depend on a specific kind of honesty.

  There is an idea, one I know [Bride] knows well, that the value of affection isn't found in ignoring reality, but in seeing it clearly. That love isn't valuable because it's blind. It's valuable because it's clear-eyed.

  And when I look at this couple, that is exactly what I see.

  [Bride], I have watched you work. You don't cut corners. You don't accept a fuzzy argument just because it sounds nice. You care about getting the answer right, even when it's hard. You bring that same rigor to your friendships. You don't love people for who you pretend they are; you love them for who they actually show themselves to be. That is a rare gift. It means that when you offer affection, people trust it. They know it's grounded in something real.

  [Groom], you work in finance. You deal in valuations. You have to look at an asset and understand its true worth, not just its market price. And while I know you've never read a page of ethics, you understand something fundamental about commitment: it requires stability. It requires showing up. You offer [Bride] a kind of grounding that allows her to do her deep work, knowing that the foundation beneath her is solid. You don't try to be something you're not. You are steady, you are kind, and you are present.

  Now, there is a worry that sometimes comes up when we talk about loving someone for "who they are." The worry is: *What if they change?* If my love depends on your qualities, is it conditional? Do I have to stay exactly this way forever to be loved?

  I think the answer lies in what [Bride] has taught me about looking at the whole picture.

  When you truly know someone, you aren't just taking a snapshot of who they are today. You are knowing their capacity to grow. You are knowing their history. You are knowing the way they navigate difficulty.

  The truth about [Groom] isn't just that he is reliable today. It's that he is the kind of person who will remain reliable when things get difficult. The truth about [Bride] isn't just that she is brilliant now. It's that she is the kind of person who will keep seeking truth, even when it changes her.

  To love the truth of someone is to love their trajectory, not just their current coordinates.

  And together, you create something that is more than just two individuals standing side-by-side. You create a new reality. The way you speak to each other, the way you solve problems, the quiet jokes I see you sharing across the room—those are facts in the world now. They are part of the truth that you both see clearly.

  So, my wish for you is not that you never change. My wish is that you never stop seeing each other clearly. That you continue to update your understanding of one another with generosity and precision. That you find value not in a fantasy of perfection, but in the messy, evolving, genuine reality of who you are becoming, together.

  In a world that often prefers comfortable illusions, you have chosen the harder, better path of mutual recognition. And that is worth celebrating.

  Please raise your glasses.

  To [Bride] and [Groom]. May you always see each other truly, and may that truth always be worth loving.
