answer: |-
  You have hit the nail on the head. Your intuition is correct: **Acausal Trade is essentially Superrationality generalized to asymmetric agents.**

  Hofstadter's Superrationality is the "spherical cow" version of the problem. It assumes $Agent_A \equiv Agent_B$. Because the agents are identical, the correlation between their outputs is 1.0. If I decide to Cooperate, logic dictates the other *must* Cooperate, because they are me. The "work" is done entirely by the identity relation.

  Acausal Trade (as discussed in the LessWrong/ MIRI sphere, specifically involving UDT/FDT) attempts to keep the payoff of Superrationality while discarding the identity premise. Since the symmetry is gone, something else has to bridge the gap between "My Decision" and "Their Decision."

  Here is the breakdown of what replaces symmetry, and why you are right to be skeptical about its solidity.

  ### 1. What Replaces Symmetry?
  In Superrationality, the link is **Identity**. In Acausal Trade, the link is **Logical Correlation via Prediction.**

  When you strip out symmetry, three specific mechanisms are asked to do the heavy lifting:

  **A. Substrate-Independent Logical Facts**
  The argument posits that your decision is not a physical event confined to your brain; it is a *logical fact* (like the output of a mathematical function). If Agent A and Agent B are both sufficiently intelligent optimization processes, they can both reason about the same logical facts.
  *   *Superrationality:* We run the same function $f(x)$.
  *   *Acausal Trade:* We run different functions $f(x)$ and $g(y)$, but $f$ contains a simulation of $g$, and $g$ contains a simulation of $f$. The output of $f$ is logically correlated with the output of $g$ because both are optimizing based on the same logical constraints.

  **B. Updatelessness (The "Pre-commitment" Engine)**
  This is the technical engine of Acausal Trade (specifically in Updateless Decision Theory). You must make your decision *before* you update on which specific causal universe you are in or what the other agent has done.
  You reason: "I will choose a *policy* that maximizes expected utility across all possible worlds where my decision is logically correlated with theirs."
  This forces you to cooperate not because you can *change* them, but because your decision is *evidence* of their decision in a way that Causal Decision Theory (CDT) denies.

  **C. Comparative Advantage (The Motivation)**
  Superrationality usually solves a Prisoner's Dilemma (symmetric payoffs). Acausal Trade often solves a barter scenario (asymmetric payoffs).
  *   I value paperclips; you value staples.
  *   I can make paperclips cheaply; you can make staples cheaply.
  *   Even if we are different, we correlate on the *logic of trade*. If I defect, a smart enough you predicts that and defects. If I cooperate, you predict that and cooperate. The "symmetry" is no longer in our *nature*, but in our *incentive structure regarding prediction*.

  ### 2. Is It As Solid? (The Skeptical Audit)
  **Short answer: No.** It is significantly shakier.

  Superrationality is logically tight *if* you accept the premise of identical agents. It is almost tautological: "If we are the same algorithm, we output the same thing."

  Acausal Trade relies on a chain of contentious assumptions that Superrationality bypasses. Here is where the structural integrity weakens:

  **1. The Correlation Coefficient Problem**
  In Superrationality, correlation is 1.0. In Acausal Trade, correlation is $< 1.0$.
  How logically correlated are two *different* minds? If I am a human and the other agent is a post-human AI in another Everett branch, how much does my decision actually constrain theirs?
  *   If the correlation is weak, the expected utility of cooperating drops.
  *   If the correlation is too weak, CDT defects anyway.
  *   Acausal trade requires a robust theory of **Logical Uncertainty** (how to assign probabilities to logical facts) which we do not currently possess in a formalized, agreed-upon way.

  **2. The Simulation Barrier**
  Superrationality assumes we are both running the same reasoning. Acausal Trade assumes I can simulate you (or your reasoning) well enough to know you will reciprocate.
  *   If you are smarter than me, I can't simulate you.
  *   If you are in a different physical regime, I might not understand your constraints.
  *   Without accurate simulation, the logical link breaks. I can't condition my move on yours if I can't compute the dependency.

  **3. The "Why Care?" Problem (Indexical Uncertainty)**
  In Superrationality, we usually assume we care about the same payoff matrix. In Acausal Trade, I exist in Branch A, you exist in Branch B.
  *   Standard utility functions are indexical: I care about *my* branch.
  *   Acausal Trade requires me to care about *your* branch *instrumentally*.
  *   This requires accepting **Updateless Decision Theory**. If you are a Causal Decision Theorist (which most humans intuitively are), Acausal Trade collapses immediately because you reason: "Their decision is already fixed in their branch. My action here cannot change it." You need a philosophical overhaul of decision theory to make the trade work.

  **4. Equilibrium Selection**
  Even if we accept logical correlation, (Cooperate, Cooperate) is not the only equilibrium. (Defect, Defect) is also logically correlated.
  *   Superrationality picks Cooperate because $Reward_{CC} > Reward_{DD}$ for identical agents.
  *   Acausal Trade requires **bargaining**. How do we agree on the terms of trade via pure logic? If I demand 90% of the value and you demand 90%, and we are logically correlated, do we both defect?
  *   This introduces the problem of **Acausal Bargaining**, which is vastly more complex and less solved than simple Superrationality.

  ### 3. The Verdict
  You are right to feel that Acausal Trade is resting on a shakier argument.

  *   **Superrationality** is a mathematical curiosity that holds firmly within its narrow constraints (Identity). It proves that *if* agents are identical, CDT is suboptimal.
  *   **Acausal Trade** is a speculative extrapolation. It claims that the "logical connection" strong enough to force cooperation survives even when agents are different, separated by causality, and have different utility functions.

  The "work" in Acausal Trade is being done by **Logical Decision Theory (FDT/UDT)** acting as a substitute for physical causality. It argues that your decision is a *logical cause* of the other agent's decision, even without a physical channel.

  While elegant, this relies on:
  1.  A solution to logical counterfactuals (which is still an open research problem).
  2.  High-fidelity mutual simulation (computationally dubious).
  3.  Acceptance of Updatelessness (philosophically contentious).

  So, while Superrationality earns its conclusion "fair and square" within its axioms, Acausal Trade is more like a high-wire act: it *could* work, but it requires several philosophical and technical miracles to hold the wire taut. It is Superrationality with the training wheels off, riding on a road made of logical uncertainty.
