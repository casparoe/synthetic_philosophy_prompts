answer: |-
  You have hit on one of the most famous and counterintuitive results in the formal theory of law and political economy. Your intuition is perfectly sound *if* you assume sincere voting (the standard Condorcet setup). However, the paper your advisor pointed you to is almost certainly referencing the seminal work by **Feddersen and Pesendorfer (1998)**, "Convicting the Innocent: The Inferiority of Unanimous Jury Verdicts under Strategic Voting."

  The short answer is: **Your extension of the Condorcet Jury Theorem (CJT) is mathematically correct under sincere voting, but it breaks down completely under strategic voting.** The result is not a modeling quirk; it is a robust game-theoretic insight about information aggregation, though its empirical validity in real courtrooms is still debated.

  Here is the breakdown of why your intuition clashes with the formal model, why the model holds up theoretically, and where the rubber meets the road for judicial politics.

  ### 1. The Conflict: Sincere vs. Strategic Voting
  Your intuition relies on the **Sincere Voting** assumption inherent in the classic CJT.
  *   **Your Logic:** If Juror $i$ receives a signal $s_i$, they vote $v_i = s_i$. Under unanimity, a wrongful conviction requires $P(\text{all } s_i = \text{Guilty} \mid \text{Innocent})$. Under majority, it requires $P(\text{majority } s_i = \text{Guilty} \mid \text{Innocent})$. Since the former is a subset of the latter, unanimity must be safer.
  *   **The Formal Theory Logic:** Jurors are utility maximizers who care about the *outcome*, not just expressing their signal. They vote strategically based on the probability that their vote is **pivotal**.

  ### 2. The Mechanism: The Swing Voter's Curse
  The Feddersen and Pesendorfer (F&P) model assumes a "common value" setting: all jurors want to convict if and only if the defendant is actually guilty. They have private signals regarding guilt/innocence.

  The crux of the result lies in **conditional probability upon being pivotal**.

  *   **Under Majority Rule:** If I am pivotal, the vote is split roughly 50-50 among the others. This tells me the evidence is ambiguous. My private signal is highly valuable in breaking the tie. I vote my signal. Information aggregates well.
  *   **Under Unanimity:** If I am pivotal, it means **every other juror has already voted to convict.**
      *   In a large jury, the fact that $n-1$ other rational jurors voted Guilty is overwhelming evidence that the state of the world is "Guilty."
      *   Even if my private signal says "Innocent," the Bayesian update derived from the fact that everyone else voted Guilty swamps my private signal.
      *   **Result:** In equilibrium, a rational juror ignores their private "Innocent" signal and votes Guilty when pivotal, because the probability that *everyone else* is wrong is lower than the probability that *I* am wrong.

  As $n \to \infty$, under unanimity rule with strategic voting, the probability of convicting an innocent defendant **does not converge to zero** (as CJT predicts); in many specifications, it **converges to one**. This is because the unanimity rule creates such a high bar for acquittal that the "pivotal event" becomes so informative of guilt that no one ever votes to acquit in equilibrium.

  ### 3. Is This a Modeling Artifact?
  You asked if this says more about the model's assumptions than real juries. This is the central debate in the literature.

  **The Case for "Real Theoretical Insight":**
  The logic of pivotal voting is sound. If agents are rational and care about outcomes, the decision rule *must* affect behavior. You cannot hold behavior constant (sincere voting) while changing the incentives (decision rule). The F&P result highlights that **Unanimity is incentive-incompatible** for information aggregation. It discourages jurors from acting on minority information.

  **The Case for "Modeling Quirk":**
  1.  **Common Knowledge of Rationality:** The result requires jurors to know that other jurors are rational strategists. If jurors are "behavioral" or simply follow a norm of sincerity (as your CJT intuition assumes), the F&P result vanishes, and your intuition holds.
  2.  **Deliberation:** The F&P model is a "secret ballot" model. Real juries deliberate. **Coughlan (2000)** showed that if jurors can communicate (deliberate) before voting, unanimity can restore information aggregation because they can share signals directly rather than inferring them from votes.
  3.  **Experimental Evidence:** Lab experiments (e.g., Guarnaschelli, McKelvey, and Palfrey 2000) have tested this. The results are mixed. Subjects do exhibit strategic voting, but often not to the full equilibrium extent predicted by F&P. They tend to be "quasi-sincere."

  ### 4. Relevance to *Ramos v. Louisiana*
  For your work on *Ramos*, this theoretical tension is gold.
  *   **The Majority Opinion (Gorsuch):** Relied heavily on historical analysis and the risk of racial bias in non-unanimous verdicts (allowing 10-2 convictions often marginalized minority jurors). This aligns more with the **sincere voting/deliberation** view—that every voice must be heard to ensure legitimacy and careful consideration.
  *   **The Formal Theory Implication:** If F&P are right, striking down unanimity (moving to 10-2 or 9-3) might actually **improve** information aggregation and reduce wrongful convictions *if* jurors behave strategically, because it reduces the "pivotal burden" that causes the swing voter's curse. A 10-2 rule makes being pivotal less informative about the others' signals, encouraging jurors to vote their private information more sincerely.

  However, the *Ramos* decision wasn't about information aggregation efficiency; it was about due process and the history of racial discrimination. The non-unanimous laws in LA and OR were explicitly designed to dilute the votes of African American jurors. A formal model that assumes symmetric jurors misses the **power asymmetry** that motivated the statutes in the first place.

  ### 5. Summary for Your Research
  You are not wrong about the probability math under sincere voting. The paper is not wrong about the game theory under strategic voting.

  *   **Your Intuition:** Correct for **Sincere Voting** (CJT). Unanimity minimizes Type I error (convicting innocent) *if* voters report signals truthfully.
  *   **The Paper:** Correct for **Strategic Voting** (Nash Equilibrium). Unanimity can maximize Type I error because it destroys the incentive to report "Innocent" signals.

  **Recommendation:**
  If you are incorporating this into a formal model, you must explicitly justify your voting assumption.
  1.  If you model jurors as **sincere** (perhaps due to social norms, judicial instructions, or bounded rationality), your CJT extension holds, and unanimity is safer against wrongful convictions.
  2.  If you model jurors as **strategic**, you must grapple with F&P. You might look into models of **deliberation** (Coughlan 2000; Austen-Smith & Feddersen 2006) which suggest that talking *before* voting can salvage the benefits of unanimity.

  This is a classic case where "rationality" undermines the collective good (a failure of information aggregation), suggesting that institutional norms enforcing sincerity (like jury instructions) might be necessary to make unanimity work as intended.

  **Key Citations for your bibliography:**
  *   Feddersen, T., & Pesendorfer, W. (1998). "Convicting the Innocent: The Inferiority of Unanimous Jury Verdicts under Strategic Voting." *American Political Science Review*.
  *   Coughlan, P. J. (2000). "In Defense of Unanimous Jury Verdicts: Mistrials, Communication, and Strategic Voting." *American Political Science Review*.
  *   Guarnaschelli, S., McKelvey, R. D., & Palfrey, T. R. (2000). "An Experimental Study of Jury Decision Rules." *American Political Science Review*.

  It is a fantastic puzzle to be wrestling with. The tension between the normative appeal of unanimity (protecting the innocent) and the positive prediction of game theory (strategic conviction) is exactly where formal judicial politics adds value to legal doctrine.
