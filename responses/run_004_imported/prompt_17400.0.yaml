  **Move 1 (Elena): Score 1**
  Elena is correct that counterfactual dependence ("but-for" causation) is the standard starting point for establishing causation by omission. However, her claim that this is "basically all" it means is an overstatement. While necessary, counterfactual dependence is rarely sufficient in law or philosophy because, as Marcus points out, it generates infinite causes. She states a necessary condition as if it were a sufficient one.

  **Move 2 (Marcus): Score 2**
  This is the classic "problem of profligate causation" objection, and it is logically airtight. Under a pure counterfactual theory, every person who *didn't* put out the fire is a cause of the burn. Marcus correctly identifies that Elena's definition lacks a filtering mechanism, rendering it useless for assigning specific liability.

  **Move 3 (Elena): Score 1**
  Elena appeals to a respected theory (causal selection based on norms/duty), but she phrases it vulnerably. She claims the duty makes the omission *causally* distinct, not just morally distinct. While many legal philosophers (like Hart & Honoré) agree that "abnormal conditions" (like a sleeping watchman) are causally salient, insisting this is a *physical* causal difference rather than a *normative* selection is the weak link Marcus exploits.

  **Move 4 (Marcus): Score 2**
  Marcus correctly diagnoses the sleight of hand. He identifies that Elena is shifting from "cause-in-fact" (physics) to "proximate cause" (policy/blame). In a strict metaphysical sense, he is right: the fire spreads due to chemistry, not contracts. By introducing the job description, she has indeed moved the goalposts from description to prescription, even if that move is standard in a courtroom.

  ***

  ### The Missing Consideration: The Contrastive Baseline

  The disagreement turns on a concept neither of them explicitly named: **Causal Claims are Contrastive.**

  We never simply ask, "What caused the fire to spread?" We implicitly ask, "What caused the fire to spread *in this specific context* rather than *as expected*?"

  *   **The Public:** For the general public, "not checking the warehouse" is part of the **background conditions**. It is the baseline. Their inaction is not a variable; it is the constant.
  *   **The Watchman:** For the watchman, "checking the warehouse" is the **expected variable**. His contract establishes a new baseline of normalcy. His sleeping is an *intervention* or a *deviation* from the expected course of events.

  **Why this resolves the plot hole:**
  This validates Elena without conceding to Marcus. Marcus is right that physics doesn't care about contracts, but Elena is right that *causal explanation* isn't just physics—it's about identifying what deviated from the system's design. The watchman isn't liable because his sleep created the fire (physics); he is liable because his sleep was the **system failure** in a security protocol designed to prevent spread.

  For your trial scene, this gives your lawyer a winning closing argument: *"We aren't asking who physically fed the flames. We are asking why the safety system failed. The public was never part of the system. The watchman was."*
