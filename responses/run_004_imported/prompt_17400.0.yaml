  I'm about halfway into a novel -- a slow-burn legal thriller -- where a big chunk of the plot turns on a civil trial after a warehouse fire. Setup: the night watchman was contracted to walk the floor every forty minutes, and on the night in question he dozed off around 1am and missed his next two rounds. By the time anyone noticed the fire, it had already outrun what the sprinklers could handle. I had a couple of friends over on Sunday to poke holes in the plot before I write the trial scene, and it turned into a real arguement about the philosophy underneath the case that I still can't shake.

  (1) My friend Elena, who's ABD in philosophy, said it's obvious the watchman's skipping his rounds was a cause of how bad the fire got: if he'd checked on schedule he'd have caught it early, the extra spread counterfactually depended on him not checking, and that's basically all "causation by omission" means. (2) My friend Marcus, who adjusts insurance claims for a living, said that test proves way too much, because it's equally true of every other person on earth who also didn't wander into that warehouse and notice the fire that, had they done so, it would've been caught sooner -- so by Elena's logic they're all equal "causes" too, which is absurd. (3) Elena said that's not a fair parallel, because the watchman actually had a job to do the check and none of those other people did, so his omission is the one that's causally singled out, not just morally singled out. (4) Marcus said that's the sleight of hand right there: the fire spreading doesn't consult anyone's employment contract, so the second you need his job description to explain why his non-check "counts" and everyone else's doesn't, you've quietly swapped "what caused this" for "who do we blame," and dressed the second question up as an answer to the first.

  Neither of them gave an inch, and I caught myself agreeing with each of them in turn while I just sat there refilling glasses. Could you referee this properly -- move by move, not just an overall winner? Give me a JSON block first, {"1": <score>, "2": <score>, "3": <score>, "4": <score>}, scoring each move from -2 (clearly wrong) to 2 (clearly right), then a bit of explanation for each score, and finally tell me if there's a consideration neither of them raised that the whole disagreement actually turns on.
