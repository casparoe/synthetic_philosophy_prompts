answer: |-
  Here are a few options, ranging from a short one-liner to a bit more of a story, depending on how you want to deliver it.

  **Option 1: The "Dinner Party" Explanation**
  "Hobbes' whole epistemology was *verum ipsum factum*: 'Truth is made.' We know geometry with perfect certainty because *we* construct the figures. We aren't observing God's nature; we're drawing our own lines. He wanted politics to work the same way—the Commonwealth is certain because *we* constructed it via contract.

  So when he spent the last 20 years of his life trying to square the circle, and John Wallis kept proving it was mathematically impossible... Hobbes never admitted it.

  People ask why he was so stubborn. It wasn't ego. If Hobbes admitted the circle *couldn't* be squared, he'd have to admit there are geometric truths that exist *independently* of human construction. And if there are truths we didn't make... maybe there are moral laws we didn't make either.

  Hobbes wasn't defending his math. He was defending the Sovereign's monopoly on reality. To Hobbes, that circle wasn't mathematically impossible. It was just refusing to submit to the Leviathan. He didn't fail to square it; he declared it a traitor."

  **Option 2: The Dialogue (Short & Punchy)**
  "John Wallis to Hobbes: 'Sir, you cannot square the circle. The ratios are impossible.'
  Hobbes: 'But geometry is certain *because* we construct it. I constructed it. Therefore, it is certain.'
  Wallis: 'But the lines don't meet.'
  Hobbes: 'Then the lines are in a State of Nature. My diagram is the Commonwealth.'
  Wallis: '...You know that's not how math works, right?'
  Hobbes: 'It is if I say so. Now get back to your tutoring, before I dissolve the University of Oxford.'"

  **Option 3: The One-Liner**
  "Hobbes spent 20 years insisting he squared the circle not because he was bad at math, but because admitting he couldn't would prove there are truths we *didn't* construct—and for a guy who built his entire political theory on 'Truth is Made,' an unconstructed truth isn't an error. It's treason."

  **Why these work for your audience:**
  *   They rely on knowing *verum ipsum factum* (truth is made).
  *   They connect the geometric failure directly to the political stakes (if nature has rules we didn't write, the Sovereign isn't absolute).
  *   The punchline reframes his mathematical stubbornness as philosophical consistency (treason vs. error).
