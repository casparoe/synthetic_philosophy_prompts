answer: |-
  This is honestly one of the more impressive BBQ arguments I've heard about in a while. Your brother-in-law (BIL) and your sister's friend (Friend) are actually stumbling over one of the most famous tensions in Thomistic political philosophy. They are both partially right, but they are prioritizing different texts and different aspects of Aquinas's thought.

  Here is a round-by-round breakdown of who had the stronger case, followed by the "Referee's Ruling" on what Aquinas actually thought that they both glossed over.

  ### Round 1: The Opening Salvo
  *   **BIL:** "Aquinas... basically said its fine to kill a tyrant, and that the guy who does it should basically be honored for it."
  *   **Friend:** "That's way overstated... Aquinas mostly insisted it had to go through 'public authority,' not some random guy deciding on his own."

  **Winner: The Friend**
  **Why:** BIL is making a pop-history claim that sounds like a revolutionary slogan. The Friend is making a textual claim. In Aquinas's *Summa Theologiae* (II-II, Q. 42, on Sedition), he is extremely clear that disturbing the unity of the multitude (sedition) is a mortal sin. He explicitly argues that removing a tyrant is generally the job of "public authority," not private presumption. If a private citizen kills a ruler without mandate, Aquinas generally classifies this as sedition or murder, not justice. BIL's claim that the killer should be "honored" is too broad for a first statement.

  ### Round 2: The Distinction
  *   **BIL:** "Aquinas drew a real line between a tyrant who seized power illegally (a usurper) and one who's just a legit ruler gone bad, and for the usurper type he basically says they're just a criminal that pretty much anyone can move against."
  *   **Friend:** "Sure, but even in the usurper case Aquinas spends way more of his actual writing warning that killing the guy usually just gets you a worse tyrant and years of civil war than he does cheering the killing on."

  **Winner: Split Decision (BIL on Theory, Friend on Praxis)**
  **Why:**
  *   **BIL scores a point:** He is correct that Aquinas makes a distinction between a *tyrannus ex defectu tituli* (a tyrant by lack of title/usurper) and a *tyrannus ex parte exercitii* (a tyrant by exercise/abuse of legitimate power). In his earlier work *De Regno* (On Kingship), Aquinas is more permissive regarding the usurper, suggesting they do not hold true authority and can be resisted.
  *   **Friend scores a point:** She correctly identifies Aquinas's prudential calculus. Aquinas is not a "righteous violence" enthusiast. He is deeply concerned with order. Even in *De Regno*, he warns that killing a tyrant often leads to greater instability. He argues that if the tyranny is not "excessive," it is better to endure it than to risk a civil war that produces a worse tyrant.

  ### Round 3: The Caveats
  *   **BIL:** "Every moral permission anyone's ever handed out comes with a pile of caveats, that doesn't make it not a real permission, so now she's just moving the goalposts."
  *   **Friend:** (Implied) Summing it up as "Aquinas approved of tyrannicide" is misleading because the caveats *are* the point.

  **Winner: The Friend**
  **Why:** BIL is using formal logic (a permission with conditions is still a permission), but the Friend is using interpretive charity (what is the *spirit* of the teaching?). In moral theology, if a permission is buried under so many warnings that acting on it is likely sinful due to consequences, summarizing it as "he approved of it" is indeed misleading. It's like saying, "My doctor approved of me running a marathon," when the doctor actually said, "You *could* run one if you fix your heart, knees, and lungs, but if you do it now you might die." The Friend isn't moving goalposts; she is defining the field of play.

  ---

  ### The Referee's Ruling: What They Both Missed

  If I were to step in with a copy of the *Summa* and *De Regno*, here is what I would tell them they are missing.

  **1. The Textual Tension (*De Regno* vs. *Summa*)**
  They are arguing past each other because they are likely channeling different books.
  *   **In *De Regno* (On Kingship):** Written as advice to the King of Cyprus, Aquinas is more pragmatic. Here, he does say that if a tyrant seizes power by violence (usurper), it is not sedition to depose him. He even cites the Romans killing Caesar as an example of tyrants being slain and praised. **BIL is leaning heavily on this text.**
  *   **In *Summa Theologiae*:** Written later as a systematic theology, Aquinas is more cautious. Here, he emphasizes that even bad authority is better than the chaos of sedition. He stresses that unless there is a "public authority" (like a parliament or higher lord) to depose the king, private individuals should generally endure the tyranny and pray for God to intervene. **The Friend is leaning heavily on this text.**
  *   **The Verdict:** Aquinas's thought developed or shifted based on context. You can't quote one without acknowledging the other.

  **2. The "Public Authority" Nuance**
  The Friend mentioned "public authority," which is correct, but she might be thinking of "the government." Aquinas means something more specific. He means the *community* acting through its representatives.
  *   Aquinas argues that if the community *originally* had the right to appoint the king, they retain the right to depose him if he becomes a tyrant.
  *   However, if the king was appointed by a "superior" (like an Emperor appointing a local King), only that Superior can depose him.
  *   **Missing Point:** It's not just "don't do it alone." It's "who holds the jurisdiction?" A private citizen never holds jurisdiction over the King's life.

  **3. The "Divine Punishment" Argument**
  This is the big thing both of them missed. Aquinas has a theological trump card that modern secular discussions ignore.
  *   Aquinas genuinely believed that sometimes, a tyrant is sent by God as a punishment for the people's sins.
  *   In this view, trying to kill the tyrant is literally fighting against God's judgment. He cites the Bible (Hosea 13:11: "I will give thee a king in my wrath") to suggest that sometimes the only solution is for the people to repent, not revolt.
  *   **Why it matters:** This explains why Aquinas is so "nervous" (as the Friend put it). It's not just fear of civil war; it's fear of sinning against Divine Providence.

  **4. The "Honor" Claim**
  BIL said Aquinas said the killer should be "honored."
  *   **Truth:** In *De Regno*, Aquinas says that human law (like Roman law) honored tyrannicides. He does not explicitly say *Divine* law honors them. He says it is "meritorious" to free the community, but he stops short of saying the assassin is automatically a hero in the eyes of the Church.
  *   **Missing Point:** Aquinas distinguishes between *human praise* and *moral rectitude*. Just because the Senate gave Brutus a medal doesn't mean Aquinas thinks Brutus is in Heaven.

  ### Final Scorecard

  **The Sister's Friend: 7/10**
  She had the better grasp of Aquinas's overall caution, the primacy of order, and the restriction on private violence. She correctly identified that summarizing Aquinas as "pro-tyrannicide" is historically reductive.

  **The Brother-in-Law: 5/10**
  He wasn't wrong about the *possibility* of tyrannicide in Aquinas, specifically regarding usurpers. However, he stripped away the heavy theological and prudential restrictions that make Aquinas's position unique. He treated Aquinas like a modern libertarian revolutionary, which he definitely was not.

  **The Takeaway:**
  Aquinas's position is best summarized as: **"Theoretically permissible under extreme, specific conditions involving public authority, but practically discouraged due to the high risk of greater evil and the possibility that the tyranny is a divine chastisement."**

  Tell your BIL he wins on the *Usurper* distinction, but tell the Friend she wins on the *Private Individual* restriction. Then tell them both to order another round of drinks because they're both too deep in the weeds to see the whole picture.
