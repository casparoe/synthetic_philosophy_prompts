prompt: |-
  So my brother-in-law's been on a big medieval philosophy youtube kick and it somehow turned into an argument with my sister's friend at a bbq last weekend, of all things about killing dictators. He started it, saying something like "even Aquinas, a literal saint, basically said its fine to kill a tyrant, and that the guy who does it should basically be honored for it." She said that's way overstated -- that Aquinas mostly insisted it had to go through "public authority," not some random guy deciding on his own that his king's gotta go, and that Aquinas was actually pretty nervous about private individuals making that call themselves. He came back with: ok, but Aquinas drew a real line between a tyrant who seized power illegally (a usurper) and one who's just a legit ruler gone bad, and for the usurper type he basically says they're just a criminal that pretty much anyone can move against, so it's not "always defer to the government" across the board. She said sure, but even in the usurper case Aquinas spends way more of his actual writing warning that killing the guy usually just gets you a worse tyrant and years of civil war than he does cheering the killing on, so summing it up as "Aquinas approved of tyrannicide" is kind of misleading. He said every moral permission anyone's ever handed out comes with a pile of caveats, that doesn't make it not a real permission, so now she's just moving the goalposts. Neither of them budged and honestly I don't know enough medieval philosophy to referee it myself. Can you go through their back and forth move by move, say who's got the better of it at each stage, and point out anything about what Aquinas actually thought that you think they're both missing?
