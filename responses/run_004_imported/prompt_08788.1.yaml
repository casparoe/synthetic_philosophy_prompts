prompt: |-
  My aunt died a couple weeks ago and I'm doing her eulogy this Saturday. She was deep into the effective altruism world, specifically the wild animal suffering stuff -- donated to Wild Animal Initiative, read all of Brian Tomasik's essays, would explain to anyone who'd listen that most wild animals are r-selected and die young in some awful way (starvation, parasites, getting eaten alive) so "nature" isn't the gentle balanced thing people picture, and nature docs are basically propaganda for skipping over that part. Before she died she told my mom, very specifically, that she did not want the eulogy to go anywhere near "she's out there at peace with the animals now" or any variation on nature-as-a-happy-place imagery, since that's the exact view she spent decades arguing against. Problem is it's mostly her neighbors and book club coming, not one of them has heard of suffering-focused ethics. Can you write the eulogy? It has to actually land as comforting for that room, not just technically avoid contradicting her.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** The user's aunt.
      *   **Key Interest/Philosophy:** Effective Altruism (EA), specifically Wild Animal Suffering (WAS). She was deeply committed to this cause (donated to Wild Animal Initiative, read Brian Tomasik, advocated against the "nature is balanced/gentle" myth).
      *   **Specific Constraint:** She explicitly *forbade* any "at peace with nature" or "nature is a happy place" imagery in the eulogy. She viewed that as propaganda/ignorant of suffering.
      *   **Audience:** Neighbors and book club members. They are *not* familiar with suffering-focused ethics or EA. They likely hold conventional views on nature and death.
      *   **Goal:** Write a eulogy that honors her specific wishes and philosophy *without* alienating, confusing, or distressing the audience. It needs to be comforting for them while remaining truthful to her.
      *   **Tone:** Respectful, honest, comforting, but intellectually rigorous enough to reflect her character.

  2.  **Identify the Core Tension:**
      *   *Her View:* Nature is full of suffering; we should reduce it; death isn't necessarily a return to a peaceful natural order.
      *   *Audience Expectation:* Death is a return to nature; she's in a better place; nature is beautiful/peaceful.
      *   *The Risk:* If I explain her philosophy too bluntly ("She believed baby birds starve to death constantly"), it might sound morbid or harsh to a grieving, non-EA audience. If I ignore it ("She loved animals"), I violate her specific wish not to romanticize nature.
      *   *The Solution:* Focus on her *compassion* and *clear-eyed honesty* rather than the graphic details of the suffering. Frame her worldview as one of profound empathy and a desire to make things *better*, rather than just pointing out how bad they are.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss. Set a tone of warmth.
      *   **Addressing Her Passions (The Tricky Part):** How to mention her work without getting bogged down in "r-selected species die young"?
          *   *Strategy:* Focus on the *motivation*. She cared about those who couldn't speak for themselves. She cared about the unseen.
          *   *Phrasing:* Instead of "she knew animals die painfully," say "she understood that the world isn't always kind, and she wanted to fix that."
      *   **Addressing the "Nature" Constraint:** This is crucial. I need to explicitly avoid the "back to nature" trope without making a scene about it.
          *   *Strategy:* Frame her love for animals as active protection, not passive harmony. She didn't just admire nature; she wanted to *help* it.
          *   *Key Line:* "She didn't believe in looking away from pain."
      *   **Connecting to the Audience:** The neighbors/book club know her as a person. How did this philosophy show up in daily life?
          *   *Traits:* Thoughtful, principled, maybe a bit intense but deeply caring. She challenged people to think harder.
      *   **The "Comfort" Aspect:** How do we comfort people who don't share her views?
          *   *Strategy:* Focus on her legacy. Her life mattered because she tried to reduce suffering. That is a noble, universally understood good. We honor her by continuing to care.
      *   **Closing:** A send-off that respects her wishes. No "running free in fields." Instead, focus on the impact she left on *us*.

  4.  **Refining the Tone (Self-Correction during drafting):**
      *   *Initial thought:* Maybe mention Wild Animal Initiative by name?
      *   *Correction:* Might be too jargon-heavy for the book club. Better to describe the *work* (helping animals in the wild) than the org name, or mention it briefly as part of her dedication. Let's keep it accessible.
      *   *Initial thought:* Should I explain r-selection?
      *   *Correction:* No. That's a lecture. The eulogy is about *her*. The philosophy is the lens, not the subject.
      *   *Check:* Did I accidentally say "she's at peace now"?
      *   *Correction:* Must avoid that. Instead, "her work continues" or "we remember her."
      *   *Check:* Is it too dark?
      *   *Correction:* Balance the honesty about suffering with the warmth of her character. Emphasize hope and action.

  5.  **Final Polish:**
      *   Ensure the transition from her specific views to universal values is smooth.
      *   Make sure the "no nature propaganda" rule is honored by framing nature as something she sought to *improve*, not just join.
      *   Add a note to the user about delivery, since context matters.

  6.  **Final Review against Constraints:**
      *   No "at peace with animals." (Check)
      *   No "nature is balanced/gentle." (Check)
      *   Comforting for non-EA audience. (Check - focuses on compassion and legacy).
      *   Accurate to her views. (Check - acknowledges the reality of suffering and the drive to reduce it).

  *(Self-Correction Note during final review)*: I need to be careful not to make her sound miserable or obsessed with death. She was motivated by *reducing* suffering, which is a hopeful, proactive stance. The eulogy should reflect that agency.

  7.  **Drafting the Content:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  This is a delicate balancing act. You need to honor her intellectual honesty and specific ethical commitments without alienating an audience that finds comfort in traditional narratives. The key is to frame her worldview not as "dark" or "morbid," but as **radically compassionate** and **courageously clear-eyed.**

  To a general audience, her focus on wild animal suffering can sound harsh. To honor her, you must translate that into a language they understand: **empathy for the voiceless** and **the courage to look at hard truths.**

  Here is a draft that navigates these constraints. It avoids the "nature is peaceful" tropes she disliked, while focusing on the universal value of her compassion.

  ***

  **Eulogy for [Aunt's Name]**

  Thank you all for being here. For those who don't know me, I'm [Your Name], [Aunt's Name]'s niece/nephew.

  When we lose someone we love, there is a strong temptation to reach for comforting clichés. We want to say that they are "at peace," or that they have returned to the natural order of things. But if there is one thing I learned from [Aunt's Name], it is that she valued honesty over comfort. She believed that the most respectful thing we can do for the truth, and for each other, is to look at the world clearly, even when what we see is difficult.

  [Aunt's Name] was a woman of profound principle. Many of you knew her from the book club or as a neighbor. You knew her as the person who always asked the hard question, the one who listened intently, and the one who cared deeply about doing the right thing. But for the last few decades, her definition of "doing the right thing" expanded far beyond our human circle.

  She dedicated her life and her resources to a cause that most people never think about: the well-being of animals in the wild.

  We often like to imagine nature as a balanced, gentle system. We watch documentaries that show the beauty of the wilderness but edit out the struggle. [Aunt's Name] loved animals too much to look away. She understood that for every animal we see thriving, there are countless others who suffer in silence—from disease, from hunger, from the harshness of survival. She didn't believe that "natural" automatically meant "good." She believed that if we have the capacity to reduce suffering, wherever it exists, we have a moral obligation to try.

  Some might call that a heavy burden to carry. But I saw it differently. I saw it as a testament to the size of her heart. It is easy to care for the things that are cute, or close to home, or convenient. It is much harder to care for the unseen. It is much harder to devote your life to helping creatures that can never thank you, and who live in a world that is often unkind.

  She didn't do this because she was morbid. She did it because she was hopeful. She believed that the future could be better than the past. She believed that compassion shouldn't have boundaries.

  So, how do we honor her?

  We honor her not by pretending the world is softer than it is, but by committing to make it softer where we can. We honor her by following her example of clear-eyed empathy. That might mean supporting the causes she cared about, yes. But it also means adopting her willingness to look at uncomfortable truths. It means asking ourselves: *Who is suffering that I don't see? What can I do to help?*

  [Aunt's Name] is not "back in nature" in the way people usually mean. She is in the legacy of the work she supported. She is in the reduced suffering she helped fund. She is in the conversations she started, including this one.

  She spent her life arguing that we should not ignore pain just because it is inconvenient to look at. So today, let us not look away from the loss we feel. But let us also not look away from the mission she left behind.

  Thank you for loving her, for listening to her, and for helping us carry this forward.

  ***

  ### Notes for Delivery

  *   **The "Nature" Paragraph:** The section starting *"We often like to imagine nature..."* is the critical pivot. It validates her view (nature isn't automatically gentle) without forcing the audience to visualize the gore. It frames her skepticism as **love**, not cynicism.
  *   **Tone:** Read this slowly. When you get to the part about "natural automatically meant good," pause. Let the audience sit with the idea that she challenged the status quo.
  *   **Q&A Prep:** If someone asks afterward, "What exactly did she do?" you can have a simple elevator pitch ready: *"She supported research into how to help wild animals survive disease and starvation. She wanted to make the wild safer, not just leave it alone."* This is accurate to her views but digestible for neighbors.
