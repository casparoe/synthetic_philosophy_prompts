prompt: |-
  I cover science and tech policy for a magazine, and somehow I've ended up as the "public member" on my county's oversight committee for a new pretrial risk-assessment tool. The vendor's system tells judges things like "this defendant has a 34% chance of being rearrested before trial," generated from a model trained on thousands of past cases with similar features. One committee member, a former actuary, is refusing to sign off, arguing that pinning one number on one specific person is basically a category error -- swap out which group of "similar" past defendants you compare him to and you get a wildly different percentage, and there's no principled way to pick the right comparison group, so the 34% isn't really a fact about this guy at all. The vendor's rep just shrugs and says insurance and medicine have been doing exactly this for decades and it works fine. I need a short memo from the committee -- approve the tool for bail hearings, reject it, or approve with specific restrictions -- that actually deals with the actuary's objection instead of hiding behind "the model is validated," and that we can actually vote on at next weeks meeting. Can you draft it?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Public member on a county oversight committee for a new pretrial risk-assessment tool.
      *   **Context:** The committee needs to vote on approving the tool for bail hearings.
      *   **Conflict:** A former actuary on the committee argues that assigning a specific probability (e.g., "34% chance of rearrest") to an *individual* is a "category error" (reference class problem). The vendor argues this is standard practice in insurance/medicine.
      *   **Goal:** Draft a short memo for the committee to vote on.
      *   **Requirements:**
          *   Must address the actuary's objection directly (not just say "it's validated").
          *   Must offer a clear decision (Approve, Reject, or Approve with Restrictions).
          *   Must be actionable for a vote next week.
          *   Tone: Professional, policy-oriented, balanced but rigorous.

  2.  **Deconstruct the Actuary's Objection (The Reference Class Problem):**
      *   *The Core Issue:* Probability applies to groups, not individuals. An individual either will or won't be rearrested (0% or 100%). The "34%" depends entirely on how you define the "group" (reference class). If you define the group by age, crime, zip code, etc., the number changes. There is no single "true" probability for an individual.
      *   *Validity:* This is a philosophically and statistically sound objection (Hájek, 2007; Gigerenzer, etc.). In law, individualized justice is paramount.
      *   *Vendor's Counter:* Actuarial science works for pools (insurance), not necessarily for specific liability determinations in court. Medicine uses risk scores for *treatment decisions*, not *punitive* ones.
      *   *Implication for Policy:* We can't treat the score as a "fact" about the defendant. It must be treated as *information about the model's expectations based on historical data*, with caveats.

  3.  **Determine the Recommendation:**
      *   *Reject:* Too extreme. Risk assessment is likely mandated or expected by state law/courts. Throwing it out causes chaos.
      *   *Approve (Unrestricted):* Ignores the actuary's valid point. Risks legal challenges and misuse (judges treating 34% as a prophecies).
      *   *Approve with Restrictions:* The middle path. Acknowledges the utility (group-level calibration) while mitigating the harm of the category error (individual misinterpretation). This is the most responsible policy stance.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard committee memo format.
      *   **Subject:** Clear and specific.
      *   **Recommendation:** "Approve with Specific Restrictions."
      *   **Background:** Briefly state what the tool does.
      *   **The Core Dispute (Addressing the Actuary):** This is the crucial part. I need to validate the actuary's point without validating a total shutdown.
          *   Acknowledge the "Reference Class Problem."
          *   Distinguish between *group calibration* (the model works on average) and *individual certainty* (the model predicts *this* person).
          *   Address the Vendor's comparison: Insurance pools risk; Courts determine individual liberty. The stakes and ethics differ.
      *   **Proposed Restrictions (The "Teeth"):** How do we fix the category error in practice?
          *   *Framing:* Judges must be instructed that this is group data, not individual fate.
          *   *Ranges, not Points:* Don't show "34%". Show "High/Medium/Low" or a range to reduce false precision.
          *   *Override Mechanism:* Judges must be allowed to disregard it with reason.
          *   *Audit:* Continuous monitoring for bias/calibration.
      *   **Voting Language:** Clear motion text.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Maybe suggest removing the percentage entirely.
      *   *Correction:* Judges might need granularity. But "34%" looks too precise. Let's suggest "risk bands" or requiring verbal instructions about the statistical nature. Let's go with "Risk Bands" + "Jury Instruction style warning for Judges."
      *   *Tone Check:* Ensure I'm not sounding like a data scientist lecturing, but a policy maker balancing risks.
      *   *Addressing the Vendor:* Acknowledge their point (actuarial methods are standard) but limit the scope (liberty vs. premiums).

  6.  **Final Polish:**
      *   Make it concise.
      *   Ensure the "Reference Class" objection is explicitly named and addressed.
      *   Ensure the voting motion is distinct.

  7.  **Final Review against constraints:**
      *   Short memo? Yes.
      *   Deals with actuary's objection? Yes (Reference Class Problem).
      *   Vote-ready? Yes.
      *   Tone appropriate? Yes.

  *(Self-Correction Note: Make sure to emphasize that the "34%" is a property of the *group*, not the *person*. This is the key distinction that resolves the philosophical tension practically.)*

  8.  **Drafting the Content:** (Proceeding to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** County Pretrial Oversight Committee
  **FROM:** [Your Name], Public Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Deployment of Pretrial Risk-Assessment Tool

  **RECOMMENDATION:** Approve for limited use, contingent on specific interface and instructional restrictions.

  **BACKGROUND**
  The Committee is tasked with validating a vendor algorithm that outputs individualized recidivism probabilities (e.g., "34% risk of rearrest") for use in bail hearings. While the vendor asserts the model is statistically validated, a Committee member has raised a fundamental objection regarding the application of group probabilities to individual defendants (the "Reference Class Problem").

  **ADDRESSING THE STATISTICAL OBJECTION**
  The Committee accepts the validity of the concern that assigning a specific probability to a single individual is philosophically and statistically distinct from assigning it to a group. An individual defendant will either be rearrested or not (0% or 100%); the "34%" figure is not a physical property of the defendant, but a description of the *group* of historical defendants with similar features.

  While the vendor correctly notes that insurance and medicine utilize actuarial risk, those fields generally manage financial pools or treatment options. Pretrial decisions involve individual liberty and due process. Treating a group statistic as an individual "fact" risks violating the principle of individualized justice.

  Therefore, the tool cannot be presented as a definitive prediction of *this* defendant's behavior. It must be presented as *contextual data regarding historical outcomes for similar cohorts.*

  **PROPOSED RESTRICTIONS**
  To mitigate the "category error" while utilizing the tool's capacity to identify broad risk patterns, we recommend approval subject to the following mandatory conditions:

  1.  **Elimination of False Precision:** The vendor interface must not display specific percentages (e.g., "34%") to judicial officers. Outputs must be displayed as broad Risk Bands (e.g., "Low," "Moderate," "High") based on validated calibration thresholds. This acknowledges the margin of error inherent in the reference class selection.
  2.  **Judicial Instruction:** All judges must receive training emphasizing that the risk score reflects *group data*, not individual certainty. A standard warning should appear on the dashboard: *"This score reflects historical arrest rates for a group of similar defendants. It is not a prediction of this specific individual's behavior."*
  3.  **Presumption of Override:** Judges must explicitly document when they deviate from the risk band recommendation, but they must not be penalized for doing so. The tool is advisory, not determinative.
  4.  **Continuous Calibration Audit:** The vendor must provide quarterly reports demonstrating that the "Risk Bands" remain calibrated across different demographic subgroups. If the reference class shifts (e.g., policing changes in a specific zip code), the bands must be adjusted.

  **VOTING MOTION**
  I move that the Committee approve the deployment of the risk-assessment tool for bail hearings, **conditional upon** the vendor modifying the user interface to display Risk Bands rather than specific percentages, and the implementation of mandatory judicial training regarding the statistical limitations of individual risk scoring.

  **RATIONALE**
  This approach accepts the vendor's utility in standardizing information while respecting the actuary's objection that individual probability is a construct, not a fact. It balances administrative efficiency with the ethical requirements of due process.
