answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I had the privilege of being Nadia's college roommate, which means I've seen her at 7:00 AM, at 2:00 AM, and occasionally at 5:00 AM finishing a paper she'd forgotten was due.

  When I started thinking about what to say tonight, I kept coming back to one word: Character.

  We throw that word around a lot at weddings. But I mean it specifically. There's a story I tell about Nadia from our junior year. She found a wallet on the subway. Stuffed with cash. No ID in the main slot, but a library card with an address. It was her lunch break. She was hungry, she was tired, and the honest thing to do would have been dropping it at a lost-and-found and going to eat. Instead, she spent forty-five minutes tracking down the owner. She handed it over, refused a reward, and went back to class hungry.

  Now, I was rehearsing this story last week for a friend of mine, Owen. Owen is finishing a master's in philosophy, and he immediately tried to talk me out of it. He told me that psychology shows "character" is basically a myth. He cited studies saying that whether people do good things depends entirely on the situation—are they in a rush, is anyone watching, are they hungry? He argued that calling Nadia "virtuous" is just astrology dressed up as psychology. He said if you claim someone is good no matter the context, you're making a claim that can't be proven.

  And honestly? He gave me pause. Because he's right that life is messy. We are all influenced by our circumstances.

  But then I realized Owen was looking at virtue like it's a robot program. Like if you're "good," you should act exactly the same way in every single scenario. But that's not what character is. Real character isn't about ignoring the situation; it's about reading it correctly.

  Aristotle had a word for this: *phronesis*. For the rest of us, that's "practical wisdom." It's the ability to look at a messy, complicated, high-pressure moment and know what the right move is, and then having the strength to make it.

  Nadia doesn't have a "good person" badge she wears that makes her immune to stress. She has something better. She has a habit of attention. When the world tells her to look away, she looks closer. When the situation says "cut corners," she slows down. The situation didn't make her return that wallet. The situation *begged* her to keep walking. She chose otherwise.

  And for the grad students in the back: I promise this toast contains more empirical data than the Stanford Prison Experiment.

  But for everyone else, here is what I know: I have seen Nadia under pressure. I have seen her when she was exhausted, when she was overwhelmed, when there was absolutely no social credit to be gained. And in every single one of those contexts, the variable that stayed constant wasn't the situation. It was her.

  That is what she brings to this marriage. We like to think marriage is about finding someone who makes you happy. But life is going to put you both in difficult situations. There will be rush, and stress, and moments where the easy thing is to look away.

  Nadia, you have shown us that goodness isn't a lucky accident of circumstance. It's a discipline. And [Groom's Name], you are marrying someone who understands that love isn't just a feeling you have when things are easy. It's a choice you make when the situation is hard.

  So, if you could all please raise your glasses.

  To Nadia and [Groom's Name]. May you always have the wisdom to read the room, and the character to change it for the better.

  To the happy couple.
