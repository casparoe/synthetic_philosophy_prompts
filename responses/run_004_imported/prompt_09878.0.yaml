answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], Dan's brother. Usually, when you're asked to give a speech, you're told to keep it light, keep it brief, and for god's sake, don't mention ex-partners. But nobody warned me about the intellectual hazard level of this specific groom.

  A few months ago, Dan cornered me to explain "Ramsey Numbers." It's a math theorem about parties. Basically, if you invite six people, you are mathematically guaranteed to have either three mutual strangers or three mutual friends. I nodded along, went home, and Googled it. But I fell down a rabbit hole into the man behind the math: Frank Ramsey.

  Ramsey was a Cambridge genius who basically invented four different fields of study before dying at twenty-six. He was a materialist, a philosopher, and an economist. And he wrote an essay called "Epilogue" that I think explains why Dan and Priya work so well together.

  See, Dan is the type to have 1:00 AM spirals. He looks up at the night sky, sees the sheer scale of the universe, and feels small. He feels that cold, materialist dread that we are just dust on a rock spinning around a mediocre star. It's a classic trap. But Frank Ramsey had an answer for it.

  Ramsey wrote that we shouldn't feel humbled by the size of the stars. Size isn't a virtue. A star can't think, can't love, and can't tell a joke. So who cares how big it is? He said his picture of the world wasn't drawn to scale, but in perspective. In his view, the stars shrink down to the size of threepenny bits, and the people in the foreground—the ones who can actually feel things—are the giants.

  Dan, you spend a lot of time worrying about the background. But Priya? Priya lives in the foreground.

  Priya, I don't know if you've ever read Ramsey, but you are a living demonstration of his point. When Dan starts drifting off into the cosmic void, wondering about the heat death of the universe, you are the one who gently drags him back to the kitchen table. You remind him that the universe might be huge, but *this* is what's real. The dinner, the laugh, the hand on the shoulder. You make the threepenny bits stay in the sky where they belong, so the people can be huge down here.

  And that's why I'm not going to talk about fate tonight. Dan physically winces at the idea of things being "written in the stars." And he's right. The stars are just gas. They didn't arrange this. There was no cosmic destiny that forced Dan and Priya to meet.

  It's better than that. It was a choice. In a universe that doesn't care about us, they have chosen to care about each other. That is significantly more impressive than fate.

  Ramsey, being an economist, actually had a joke about the end of the world. He said that because the universe ending is so far away, its "present value at compound discount" is basically nothing. So, for all my finance friends in the back: the heat death of the universe is a bad investment. Don't worry about the long-term outlook.

  The long-term outlook is irrelevant. The only asset that matters is the one in the room right now.

  Dan, you found someone who makes the universe feel the right size. Priya, thank you for keeping him in the foreground.

  So, if everyone could raise a glass. Not to the stars, and not to destiny. But to the foreground. To the now. To Dan and Priya.
