answer: |-
  It is a genuine pedagogical rite of passage to hit the "Oswald Wall." Your students aren't being lazy; the Kennedy example is just *too* good. It perfectly isolates the epistemic/causal split without extraneous noise. Finding a replacement that doesn't involve death, politics, or crime is surprisingly hard because those domains naturally provide the "known fact" (Kennedy is dead) that drives the indicative's truth.

  Here is a clean, minimal pair set in a domestic/accidental context, followed by the theoretical breakdown and the "reverse" case you asked for.

  ### The Minimal Pair: The Trampled Orchid

  **The Setup:**
  You are a botanist. You have a rare, fragile orchid in your greenhouse. This morning, you found it trampled and destroyed. The greenhouse was locked overnight; the only entities with access were your two dogs, Rex and Spot. You know for a fact that **one of the dogs got in and trampled it**, but you don't know which one.

  **The Reality:**
  Rex squeezed through a loose panel and trampled the orchid. Spot was asleep in the corner the whole time. If Rex had not squeezed through (and thus not trampled it), Spot would have remained asleep, and the orchid would be alive.

  **The Pair:**
  1.  **Indicative:** "If Rex didn't trample the orchid, Spot did."
  2.  **Counterfactual:** "If Rex hadn't trampled the orchid, Spot would have."

  **The Judgment:**
  *   The **Indicative** is **True** (or highly assertable).
  *   The **Counterfactual** is **False**.

  ### What Is Doing the Work?

  This pair works because the two constructions quantify over different domains with different "fixed" facts.

  **1. The Indicative (Epistemic Modality)**
  Indicative conditionals are evaluated relative to your current **information state**. You are asking your students to add the antecedent ("Rex didn't do it") to what they *actually know* and check if the consequent follows.
  *   **Known Facts:** The orchid is dead. Either Rex or Spot did it.
  *   **Update:** Add "Rex didn't do it."
  *   **Inference:** Given the known fact that *someone* did it, it logically follows that Spot did.
  *   **Mechanism:** The indicative holds fixed the *actual outcome* (the orchid is dead) and treats the antecedent as new information about *who* is responsible. It is a process of elimination within the actual world.

  **2. The Counterfactual (Metaphysical/Causal Modality)**
  Counterfactuals are evaluated relative to a **similarity ordering of possible worlds**. You are asking students to imagine a world where the antecedent is true ("Rex hadn't trampled it") that is otherwise as close to ours as possible.
  *   **Fixed Facts:** We hold fixed the intrinsic properties and causal dispositions (Spot's laziness, the lock on the door, Spot's position in the corner).
  *   **Varied Facts:** We do *not* hold fixed the outcome (the orchid's death) if that outcome causally depends on the antecedent.
  *   **Evaluation:** In the nearest world where Rex doesn't trample the orchid, Spot is still asleep (because Spot's behavior is independent of Rex's). Therefore, the orchid survives.
  *   **Mechanism:** The counterfactual "backtracks" on the outcome to preserve causal independence. It reveals that the correlation between "Not-Rex" and "Spot" is epistemic (in our knowledge), not causal (in the world).

  ---

  ### The Reverse Case: Counterfactual True, Indicative False

  You asked if the "Indicative True / Counterfactual False" pattern is a deep fact. It is not. It is an artifact of the most common pedagogical examples (which usually involve a known *outcome* like Kennedy's death).

  If we construct a scenario where the **outcome is known *not* to have happened**, but the **causal disposition remains**, we get the reverse.

  **The Setup:**
  Same greenhouse, same orchid. But this time, you walk in and the **orchid is perfectly healthy**. You see Rex walking past the orchid. You know Rex *did not* touch it. However, you also know the orchid is incredibly fragile; the slightest pressure crushes it.

  **The Pair:**
  1.  **Indicative:** "If Rex trampled the orchid, it is dead."
  2.  **Counterfactual:** "If Rex had trampled the orchid, it would have died."

  **The Judgment:**
  *   The **Counterfactual** is **True**. (The orchid is fragile; in the nearest world where Rex touches it, it dies).
  *   The **Indicative** is **False** (or pragmatically infelicitous).

  **Why the Indicative Fails:**
  Indicatives are sensitive to the **actual truth of the consequent** in the speaker's information state.
  *   **Known Fact:** The orchid is *not* dead.
  *   **Assertion:** To assert "If P, then Q" indicatively usually implies that Q is an open possibility contingent on P.
  *   **Conflict:** Since you *know* ~Q (it is alive), asserting "If P, then Q" sounds like you are ignorant of the orchid's state. More formally, in many semantic frameworks (like Adams' Thesis), the probability of the indicative is $P(Q|P)$. But if you know ~Q, then $P(Q|P) = 0$.
  *   **Result:** The indicative is rejected because it conflicts with your direct evidence (the living orchid), even though the causal link is real.

  **Why the Counterfactual Succeeds:**
  The counterfactual explicitly signals that we are *not* in the actual world. It invites you to ignore the actual fact (that the orchid is alive) and look at the causal powers of the objects involved. It effectively says, "Ignoring the fact that he didn't touch it, what does his touching it *do*?"

  ### Summary for Your Seminar

  1.  **The Standard Case (Orchid Dead):** Shows that **Epistemic Correlation $\neq$ Causal Connection**. (Indicative tracks the correlation; Counterfactual tracks the causation).
  2.  **The Reverse Case (Orchid Alive):** Shows that **Actual Facts $\neq$ Dispositional Properties**. (Indicative is blocked by actual facts; Counterfactual accesses dispositional properties).

  This should break your students out of the Oswald loop. It forces them to distinguish between *what we know about the actual world* (Indicative) and *how the world works* (Counterfactual), without needing a single assassination.
