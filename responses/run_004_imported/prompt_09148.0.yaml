      *   Wait, looking at (c) again. "Lewis presented this as a decisive refutation of Adams's view". This is the big error. Lewis's paper is "Probabilities of Conditionals and Conditional Probabilities." He concludes that conditionals do not express propositions. Adams argued conditionals do not express propositions. Lewis's result *supports* Adams's semantic conclusion by showing the alternative (Stalnaker's) leads to triviality. The student thinks Lewis was arguing *against* Adams. This suggests a fundamental misunderstanding of the dialectic. I will deduct significantly here. 4/8 seems right.

