prompt: |-
  So a couple weeks ago I fell into one of those late night wikipedia rabbit holes, started out reading about "the multiverse" and somehow ended up on philosophy pages about "possible worlds," and I honestly haven't been able to stop chewing on this one arguement since. Basically there's two camps on what it actually means to say something like "I could've been a lawyer instead" or "this table could've been red instead of brown." One camp (the guy behind it is this philosopher David Lewis, he calls it counterpart theory) says the "me" who's a lawyer in some other possible world isn't literally me, its just some other guy who happens to be similar enough that we call him my counterpart, basically a fancy word for doppelganger. The other camp says no, that's wrong, its literally, numerically the exact same me existing over there too, and I guess that one's called transworld identity.

  Here's what's actually been bugging me though: if its really the same exact me existing in both worlds, how does that even work when the two versions have totally different properties? Like say I'm short in this world and "I" am tall over in that one, isn't that a contradiction, cause one single thing can't have two different heights at once? Feels like the counterpart camp has it easier here since they can just say "well they're different guys, so no contradiction." But then I also stumbled on this objection involving some old american politician (Humphrey, i think, from back in the 60s) where the point was basically, if it's only my counterpart winning the election in some other world and not literally me, then why would i even care about that, its not my win, its his. I tried explaining this bit to my sister and she just said "who cares," but it's honestly been bugging me for days.

  Anyway, could you lay out both sides properly for me and then give me your honest take on which theory, if either, actually handles this stuff better, or whether there's some totally different way of thinking about it that gets around the whole mess? You don't need to pick a side just to be nice about it, id rather hear the real messy answer. And please don't dumb it down too much on my account, I've been sitting with this stuff for weeks now so I can handle the technical bits.
