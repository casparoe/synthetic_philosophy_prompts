answer: |-
  You have stumbled into one of the deepest, messiest trenches in contemporary metaphysics. What you're describing is the debate over **Modal Metaphysics**, specifically the ontology of possible worlds and the nature of *de re* modality (modality concerning things).

  You've correctly identified the two heavyweights: **David Lewis's Modal Realism (with Counterpart Theory)** versus the **Kripkean/Actualist view (Transworld Identity)**.

  Since you asked for the technical bits and the messy truth, let's break down the machinery of both, look at why they break, and then I'll give you my read on where the bodies are buried.

  ---

  ### 1. The Transworld Identity Camp (Kripke, Plantinga, etc.)
  **The Claim:** When you say "I could have been a lawyer," you are referring to *you*, numerically identical, in a different state of affairs.

  **The Ontology:**
  For this view to work, you generally cannot treat possible worlds as concrete places like David Lewis does. If worlds were concrete, spatiotemporally isolated universes (like Lewis says), you couldn't be in two of them at once without violating the logic of identity.
  So, proponents like Saul Kripke (*Naming and Necessity*) and Alvin Plantinga treat worlds as **abstract entities**. A possible world is a "maximal consistent state of affairs" or a "way the actual world could have been."
  *   **Analogy:** Think of a world not as a distant planet, but as a complete story or a blueprint. You exist in the actual blueprint, but you are also a character in other blueprints.

  **Solving the Contradiction (Accidental Intrinsics):**
  This is your "short vs. tall" problem. In philosophy, this is called the **Problem of Accidental Intrinsics**. An "intrinsic" property is one you have in yourself (like height), not in relation to something else (like "being to the left of a table").
  If you are literally the same object $x$ in World 1 ($W_1$) and World 2 ($W_2$), and you are Short in $W_1$ and Tall in $W_2$, do you violate the Law of Non-Contradiction ($\neg(P \land \neg P)$)?

  **The Fix:** Indexicality / World-Indexed Properties.
  Kripkeans argue that properties are held *relative to a world*. It is not that $x$ is Short and $x$ is Tall. It is that:
  *   $Short(x, W_1)$ is true.
  *   $Tall(x, W_2)$ is true.
  There is no contradiction because "being short" is treated as a relation between an object and a world. You don't have the property "short" simpliciter; you have the property "short-in-$W_1$."

  **The Strength:** It preserves the intuitive significance of modal claims. If I say "I could have suffered," I mean *I* would have suffered. It matters to me.

  **The Weakness:** It requires a metaphysics of "essence." To say it's *you* in another world, there must be some core "you-ness" (haecceity) that persists while properties change. Kripke argues names are **Rigid Designators** (they pick out the same object in every world), but critics ask: *What grounds this identity?* If you change enough properties (parents, origin, DNA), are you still you? The Transworld Identity camp has to draw a line on essential vs. accidental properties, which is notoriously difficult.

  ---

  ### 2. The Counterpart Theory Camp (David Lewis)
  **The Claim:** You are "world-bound." You exist only in the actual world. When we say "You could have been a lawyer," we mean there exists a concrete possible world where a *counterpart* of you is a lawyer.

  **The Ontology:**
  Lewis is a **Modal Realist**. He believes possible worlds are concrete, physical entities just as real as our own, but spatiotemporally isolated. You cannot travel between them.
  Because you are a physical object located *here*, you cannot be located *there*. Therefore, strict identity across worlds is impossible.

  **The Mechanism:**
  The "Counterpart Relation" is based on **similarity**, not identity. Your counterpart is the thing in another world that resembles you most closely in important respects (origins, appearance, psychology), depending on the context of the conversation.

  **Solving the Contradiction:**
  Lewis solves the "short vs. tall" problem effortlessly.
  *   You ($x$) are Short in $W_1$.
  *   Counterpart ($y$) is Tall in $W_2$.
  *   $x \neq y$.
  No contradiction. You keep intrinsic properties as genuine intrinsics. You don't need to relativize "shortness" to a world. You are just short, period. Your counterpart is tall, period.

  **The Strength:** It offers a clean, parsimonious logic of identity. It treats modality using standard extensional logic without needing "spooky" transworld identities.

  **The Weakness:** **The Humphrey Objection.**
  This is the objection you mentioned. Saul Kripke coined it regarding Hubert Humphrey.
  *   *Claim:* "Humphrey could have won the election."
  *   *Lewis's Translation:* "There is a world where a counterpart of Humphrey wins."
  *   *Kripke's Retort:* Humphrey doesn't care about some other guy in another universe winning. He cares about *himself* having the possibility of winning.
  Counterpart theory severs the emotional and moral link of modality. If "I could have suffered" just means "Someone like me suffers," then why should I be afraid? It renders modal statements modally irrelevant to the subject.

  Lewis's reply was essentially: "That counterpart represents you. When we talk about what is possible for you, we are talking about what happens to your representatives." Most philosophers find this reply unsatisfying. It feels like a semantic dodge.

  ---

  ### The Messy Truth: Where the Bodies Are Buried

  You asked for my honest take. Here is the friction point: **Both sides are trading one set of metaphysical problems for another.**

  **1. The Cost of Lewis's Clean Logic**
  Lewis saves us from contradictory properties and transworld identity puzzles, but the price is **Ontological Extravagance**. To make Counterpart Theory work, you have to believe in an infinite number of concrete universes where every logically possible thing happens. There is a world where you are a lawyer, a world where you are a potato, a world where donkeys talk.
  Most philosophers reject Modal Realism because it violates parsimony (Ockham's Razor). If you reject the concrete worlds, Counterpart Theory loses its main motivation. You can have Counterpart Theory without Realism, but it feels ad-hoc.

  **2. The Cost of Kripke's Intuitive Identity**
  Kripke saves the "it's really me" intuition, but he introduces **Metaphysical Opacity**.
  If worlds are abstract, how do *you* (a concrete being) exist in an abstract entity? Kripke says we shouldn't think of worlds as places we "go" to, but as stipulations. But this leads to the "Essence" problem.
  To maintain transworld identity, you need **Essential Properties**. Kripke famously argued for the **Necessity of Origin** (you couldn't have been born of different parents). Why? Because if you change the origin, there's no factual basis to say it's still *you* in that other world.
  This feels restrictive. It implies that huge chunks of your life are metaphysically necessary, not contingent. It turns "I could have been a lawyer" into a much narrower claim than we intuitively think.

  ### Is There a Third Way?

  There are two alternatives that try to dodge the bullet:

  **A. Modal Fictionalism (Gideon Rosen)**
  This view says: Possible worlds don't exist. Not concrete, not abstract. However, it is *useful* to talk *as if* they do.
  "When I say 'I could have been a lawyer,' I am engaging in a fiction where there is a world where I am a lawyer."
  *   *Verdict:* It avoids the ontology of Lewis and the essence problems of Kripke. But it risks making modal truths false (if there are no worlds, is it true that I could have been a lawyer?). It turns metaphysics into linguistics.

  **B. Four-Dimensionalism / Perdurantism**
  This is often paired with Lewis. You are not a 3D object enduring through time; you are a 4D "spacetime worm."
  Some extend this to **Modal Parts**. Just as you have a "childhood part" and an "adult part," you have "actual parts" and "possible parts."
  *   *Verdict:* This is arguably even weirder than Lewis's concrete worlds. It dissolves the "self" into a collection of temporal/modal stages. It solves the logic but kills the intuition of a unified "I."

  ### My Take

  If I have to choose which handles the *philosophical work* better: **Transworld Identity (Kripkean Actualism)** wins, but only by a hair.

  Here is why:
  The Humphrey Objection is fatal to Counterpart Theory for anyone interested in ethics, decision theory, or regret. Modal logic isn't just a game of symbols; it's about **potentiality**. The whole point of modality is to map the space of what *we* can do. If Counterpart Theory says "It's not you, it's a doppelganger," it drains the concept of its utility. It solves a logical problem (contradiction) by destroying the phenomenon it was supposed to explain (possibility).

  Lewis's solution to the "short vs. tall" contradiction is elegant, but Kripke's solution (world-indexed properties) is sufficient. Yes, it makes properties relational ($Short-at-W$), but we already accept that many properties are relational (e.g., "being a brother"). Making "height" relational to a world is a small price to pay to keep the "self" intact.

  **The Real Issue:**
  The reason this is bugging you is that both theories assume **Realism about Possible Worlds** (either concrete or abstract).
  There is a growing sentiment that the whole "Possible Worlds" framework might be a category error. Perhaps modality isn't about *places* (worlds) or *counterparts*, but about **powers and dispositions** inherent in the actual world (Aristotelian Modalism).
  *   "I could have been a lawyer" doesn't mean there is a world where I am one. It means *in this world, right now, I possessed the causal powers and opportunities that, under different conditions, would have actualized into being a lawyer.*
  *   This avoids the need for other worlds entirely. The "possibility" is a real feature of *this* reality, not a reference to *that* reality.

  **Summary:**
  *   **Lewis (Counterpart):** Logically cleaner, ontologically insane, ethically hollow.
  *   **Kripke (Transworld):** Ontologically safer, logically messier (essences), ethically robust.
  *   **The "Real" Answer:** Probably lies in abandoning "Worlds" as entities altogether and looking at **dispositional modality** in the actual world.

  You're chewing on this because it touches the nerve of **identity**. If Lewis is right, "you" are much smaller than you think (world-bound). If Kripke is right, "you" are much more rigid than you think (bound by essence). Neither is comfortable, which is why the rabbit hole goes so deep.
