answer: |-
  **MEMORANDUM**

  **TO:** University Honor Council
  **FROM:** [Your Name], Graduate Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Turnitin Similarity Threshold Policy

  **I. Introduction**

  As the Graduate Student Representative—and, perhaps unavoidably, as a Philosophy PhD candidate specializing in theories of vagueness and the Sorites paradox—I have followed this year's debate regarding our 25% Turnitin similarity threshold with particular interest. It is a distinct irony that a student of boundary problems is tasked with drawing one. However, this background compels me to be candid: the current policy fails because it treats a heuristic tool as a substantive verdict.

  The Council is currently divided between two positions: (1) abolishing the numeric cutoff in favor of holistic judgment, and (2) retaining a numeric trigger to ensure consistency. After reviewing the complaints regarding the current "automatic hearing" rule—specifically the inequity of counting cited material and the arbitrariness of the 24% vs. 26% distinction—I am submitting the following recommendation for a vote.

  **II. Recommendation**

  I recommend that the Council **retain the 25% numeric trigger but reclassify its procedural effect.**

  Specifically, I move that we replace the current "Automatic Referral" policy with a **"Mandatory Preliminary Review"** protocol. Under this new policy:

  1.  **Trigger:** A Turnitin similarity index of 25% or higher shall no longer trigger an automatic misconduct hearing. Instead, it shall trigger a Mandatory Preliminary Review by a designated Honor Council officer.
  2.  **Adjustment:** During this review, the officer must filter the Turnitin report to exclude bibliographic entries, standard phrases, and properly cited quotations.
  3.  **Referral:** Only if the *adjusted* similarity score remains at or above 25% shall the case be referred to a full misconduct hearing. If the adjusted score falls below 25%, the case is returned to the instructor for informal resolution.

  **III. Rationale**

  This recommendation preserves the administrative utility of a numeric threshold while eliminating the primary source of student grievance: the punishment of technical formatting or heavy citation. It acknowledges that while a percentage cannot determine guilt, it is an efficient tool for triage.

  **IV. Engagement with the Abolitionist Position**

  I know many colleagues argue we should scrap the number entirely (Position A) in favor of a "totality of the circumstances" judgment for every referral. I want to engage with this argument seriously, as it rests on a philosophically sound premise: *any* sharp cutoff on a continuous scale is arbitrary.

  The Abolitionist argument is that a 24.9% paper and a 25.1% paper are morally indistinguishable, so treating them differently is unjust. As a student of vagueness, I agree that the boundary is arbitrary. However, I disagree that removing the boundary solves the problem.

  When we remove the numeric line, we do not eliminate the cutoff; we merely hide it. In a holistic system, the "boundary" moves from the written policy into the subjective discretion of the Council member reviewing the case. This creates what legal scholars call "standardless discretion." One student might get a hearing at 40% because their reviewer is strict; another might not until 60% because their reviewer is lenient.

  The arbitrariness of a public number is preferable to the arbitrariness of private judgment. A visible line, even if philosophically imperfect, allows students to orient their behavior and allows the institution to audit itself for consistency. By keeping the number but stripping it of adjudicative power (making it a trigger for *review* rather than *punishment*), we retain the transparency of the rule without suffering the injustice of the "cliff-edge" effect. We acknowledge the vagueness of the situation without surrendering the coordination benefits of a clear rule.

  **V. Conclusion**

  The current policy mistakes a signal for a verdict. By adopting the Mandatory Preliminary Review protocol, we acknowledge that a similarity score is evidence requiring interpretation, not proof requiring sentencing. This satisfies the need for administrative efficiency (Side B) while addressing the demand for contextual fairness (Side A).

  I move that we adopt the "Mandatory Preliminary Review" protocol as described above, effective for the upcoming semester.

  **[Your Name]**
  Graduate Student Representative
  Honor Council
