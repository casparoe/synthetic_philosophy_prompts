  *   **Relation to P.F. Strawson (0-6):** This is disastrously wrong. The student claims P.F. Strawson agrees with Galen that responsibility is impossible/unfounded. P.F. Strawson is the famous defender of the view that responsibility practices are valid *despite* the lack of metaphysical ultimate responsibility. The student essentially says P.F. Strawson is an incompatibilist skeptic like Galen. Score: 0 or 1. Let's give 1 for correctly identifying the title "Freedom and Resentment" and the concept of "reactive attitudes," even if the conclusion attributed is the opposite of the text's actual conclusion. Actually, saying he concluded attitudes "cannot be rationally sustained" is the exact opposite of the paper's thesis (that they are immune to such theoretical doubts). I'll give 1 point for mentioning reactive attitudes, but the substantive claim is wrong.
  *   **Clarity (0-2):** Writing is clear. Score: 2.

