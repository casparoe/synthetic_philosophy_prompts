prompt: |-
  So I'm part of a smallish forecasting collective — a handful of LW/ACX-adjacent people who got really into Tetlock-style calibration training a few years back and now informally consult for a couple of orgs that want probability estimates on messy stuff (regulatory outcomes, project timelines, whether some negotiation falls through). This whole thing landed on my desk because my housemate and I got into an argument about whether two people who disagree should just always split the difference on their credences, and it turned out our group has never actually nailed down a real policy on this even though it keeps coming up — so now I've been asked to write something up before our next retro.

  The case that's forcing the issue: two of our strongest forecasters, A and B, did a full double-crux session on a live question (something like "does this merger get approved by regulators within 18 months") and are still about 25 points apart after finding what they both agree is the actual crux — they just weigh the same underlying uncertainty differently, and each is convinced the other is misjudging it. It's not a one-off either; they've diverged like this on three other questions this year. To complicate things, A has the better calibration score over our whole tournament history, while B has the better track record specifically on regulatory-type questions like this one, and nobody can agree on wether general calibration or category-specific track record is the one that should actually count.

  Half the group wants a standing rule: whenever two forecasters can't converge after an honest double-crux, the team's official number defaults to some kind of average (maybe weighted by track record) instead of either person's number standing alone — the argument being that persistent disagreement between people who've genuinely done the work to find their crux is itself strong evidence that neither of them has it fully right, and that this is basically what Aumann-agreement-style reasoning should push us toward. The other half thinks this rule would be actively harmful: it'd punish exactly the people willing to hold an unpopular number, reward regression to the mean over actual insight, and it quietly assumes A and B are still "peers" in the relevant sense even after you condition on the track-record split. Could you write the short memo I'll circulate before the retro? It needs to land on an actual mechanism for handling this case and others like it going forward, not just "it depends," and it has to take the loosing side's best argument seriously instead of just gesturing at Aumann and moving on.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** A small forecasting collective (LW/ACX-adjacent, Tetlock-style calibration). They consult for orgs on messy questions (regulatory, timelines, negotiations).
      *   **Trigger:** An argument between housemates about splitting the difference on credences, leading to a need for a formal policy.
      *   **Specific Case:** Two strong forecasters (A and B) disagree by 25 points on a live question ("merger approved in 18 months") even after a double-crux.
          *   *Conflict:* They weigh the same uncertainty differently.
          *   *Track Records:* A has better *overall* calibration. B has better *category-specific* (regulatory) calibration.
      *   **The Debate:**
          *   *Side 1 (Pro-Averaging):* Persistent disagreement after double-crux implies uncertainty. Aumann-style reasoning suggests converging. Weighted average is safer.
          *   *Side 2 (Anti-Averaging):* Punishes contrarian insight. Rewards regression to the mean. Ignores that A and B might not be epistemic peers in this specific context.
      *   **Goal:** A short memo for the next retro.
      *   **Requirements:**
          *   Must propose an *actual mechanism* (not "it depends").
          *   Must take the losing side's best argument seriously (steelman the opposition).
          *   Tone: Professional but aligned with the rationalist/forecasting community culture (precise, epistemic humility, practical).

  2.  **Determine the Stance/Mechanism:**
      *   I need to pick a path. A hard "always average" rule is too rigid and validates Side 2's fear of punishing insight. A hard "never average" rule ignores the value of aggregation and Side 1's Aumann point.
      *   *Best Solution:* A **Weighted Aggregation with Meta-Justification** protocol.
      *   Why? It acknowledges that aggregation is usually good (Side 1) but requires explicit justification for *how* weights are assigned, specifically addressing the "peerhood" concern (Side 2). It forces the group to decide *beforehand* or *during* the resolution how to weigh A vs. B based on the specific context (general vs. specific track record).
      *   *Refinement:* Let's make it a "Disagreement Protocol." If disagreement persists after double-crux:
          1.  Report the range (transparency).
          2.  Calculate a weighted mean for the "official" number.
          3.  The weights are determined by a specific hierarchy of evidence (Domain Specific > General > Seniority).
          4.  *Crucially:* Allow for a "Dissenting Opinion" attachment where the minority view explains *why* the weighting is wrong. This satisfies Side 2's fear of silencing insight.

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject (keep it internal-memo style).
      *   **Purpose:** State clearly why this exists (the A/B stalemate and the housemate argument).
      *   **The Core Tension:** Briefly summarize the two sides (Aggregation vs. Insight Preservation).
      *   **The Policy (The Mechanism):** This needs to be actionable.
          *   Step 1: Double-Crux Confirmation (ensure they actually tried).
          *   *Decision Rule:* Weighted Average is the default *but*...
          *   *Weighting Hierarchy:* Domain-specific Brier scores trump general calibration. (This resolves the A vs. B specific conflict).
          *   *The "Outlier" Clause:* If the gap is > X points, report the distribution, not just the mean.
          *   *The "Dissent" Right:* The forecaster who disagrees with the aggregate can attach a brief note. This addresses Side 2's fear of punishing contrarianism.
      *   **Addressing the Opposition (Side 2):** Explicitly acknowledge that averaging can dilute signal. Explain why the "Dissent Right" and "Domain Weighting" mitigate this.
      *   **Next Steps:** Trial period, review in next retro.

  4.  **Refining the Tone:**
      *   Avoid overly academic jargon where possible, but keep terms like "epistemic peers," "Brier scores," and "double-crux" since the audience is LW/ACX-adjacent.
      *   Ensure it doesn't sound like a bureaucratic decree but rather a collaborative protocol.
      *   Make sure the A vs. B specific conflict is resolved by the policy (i.e., B wins on regulatory questions due to domain specificity).

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Weighted Average" too close to just "Split the Difference"?
      *   *Fix:* Emphasize that the weights aren't arbitrary. They are based on the *reference class* of the question. This directly addresses the A (general) vs. B (regulatory) conflict.
      *   *Critique:* Does this take Side 2 seriously?
      *   *Fix:* I need a dedicated section explaining *why* we aren't just doing a hard average, and acknowledging that sometimes the crowd is wrong. The "Dissenting Opinion" feature is key here. It allows the "unpopular number" to be recorded formally.
      *   *Critique:* Is it actionable?
      *   *Fix:* Yes, it gives a clear hierarchy for weighting and a clear output format (Mean + Range + Dissent).

  6.  **Final Polish:** Check word count (keep it "short memo"), ensure clarity on the A/B resolution, and make sure the "losing side's best argument" is integrated into the rationale, not just dismissed. (The prompt asks to take the losing side's argument seriously *in the memo*, implying the memo should reflect a decision that considers it, or at least acknowledges the trade-off).
      *   *Decision:* I will frame the policy as "Aggregation with Safeguards." This validates Side 1 (we aggregate) but incorporates Side 2's concerns (safeguards against diluting signal). I will explicitly state that Side 2's concern about "regression to mediocrity" is the reason for the Domain-Specific Weighting and Dissent Clause.

  7.  **Final Output Generation** (Proceeding to write the memo based on these thoughts).
answer: |-
  **TO:** Forecasting Collective
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal: Protocol for Persistent Credence Divergence

  **Context**
  Following recent internal debates (and the specific stalemate between Forecasters A and B on the regulatory merger question), we need a standing policy for handling persistent disagreement. Currently, when two forecasters double-crux and remain >15 points apart, we have no mechanism for generating an "official" collective estimate.

  **The Tension**
  We are balancing two valid epistemic concerns:
  1.  **The Aggregation View:** Persistent disagreement between competent peers after information sharing is itself evidence of uncertainty. Ignoring this and picking one number ignores the "wisdom of crowds" effect and violates Aumann-adjacent norms.
  2.  **The Insight View:** Hard averaging punishes contrarian insight and rewards regression to the mean. If Forecaster B has identified a signal Forecaster A is missing, averaging dilutes that signal. Furthermore, "peerhood" is context-dependent; general calibration does not equal domain expertise.

  **Proposed Mechanism: Weighted Aggregation with Dissent Rights**
  Effective immediately, the following protocol applies when forecasters cannot converge after a documented double-crux session:

  **1. The Output Format**
  We will no longer report a single point estimate in cases of persistent divergence. The official deliverable will be:
  *   **The Consensus Mean:** A weighted average of the divergent credences.
  *   **The Confidence Interval:** The range spanned by the forecasters (e.g., "65% [Range: 50–75%]").
  *   **The Dissent Note:** A mandatory 2-3 sentence attachment from the minority view explaining *why* the weighting might be underestimating their specific signal.

  **2. The Weighting Hierarchy**
  To resolve the "which track record counts" debate (e.g., A's general calibration vs. B's regulatory record), weights are assigned via this hierarchy:
  *   **Primary:** Domain-Specific Brier Score (last 50 questions in category).
  *   **Secondary:** General Calibration Score (last 100 questions).
  *   **Tertiary:** Equal Weight (if data is insufficient).

  *Application to Current Case:* On the regulatory merger question, Forecaster B's domain-specific record takes precedence over Forecaster A's general record. B's credence receives higher weight in the mean, but A's uncertainty is preserved in the Range and Dissent Note.

  **3. The "Outlier" Clause**
  If a forecaster's estimate falls outside the group's historical 90% confidence interval for similar questions, they are *not* averaged down automatically. They must submit a brief "Break the Model" justification. If accepted by a third-party reviewer, their estimate is reported as a scenario branch rather than averaged.

  **Addressing the "Insight" Objection**
  The strongest argument against averaging is that it systematically suppresses high-value outliers in favor of safe mediocrity. We take this seriously. That is why the **Dissent Note** is mandatory, not optional. Clients need to know not just *what* we think, but *where* our internal uncertainty lies. If B believes A is missing a regulatory nuance, the client sees that nuance in the note, even if the mean number shifts toward A.

  This prevents the "punishment" of holding an unpopular number; instead, it formalizes the disagreement as valuable data for the client rather than internal noise to be smoothed over.

  **Next Steps**
  We will trial this protocol for Q4. Please review the weighting hierarchy and come prepared to vote on the specific Brier score lookback windows (50 vs. 100 questions) at the retro.
