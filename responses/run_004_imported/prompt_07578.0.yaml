answer: |-
  This is a textbook case of David Lewis's theory of convention in action. Your situation mirrors the examples Lewis uses in *Convention: A Philosophical Study* (1969): driving on the right vs. the left, or using a specific word for a object. The technical merit of the habit is secondary to the fact that *everyone does it*.

  Here is an analysis of your merge situation through the Lewisian lens, addressing the inertia of the old habits, the mechanics of changing them, and where the theory hits its limit regarding obligation.

  ### (a) Why switching feels costlier than the disagreement warrants

  According to Lewis, a convention is a **coordination equilibrium**. In your team's original state, the "payoff" for using `feat/login` vs. `feature/login` is negligible in isolation. The value is generated entirely by the match between your choice and everyone else's choice.

  Lewis argues that the stability of a convention relies on **iterated expectations**:
  1.  I conform because I expect you to conform.
  2.  I expect you to conform because I know you expect *me* to conform.
  3.  This chain continues into **common knowledge** (everyone knows that everyone knows...).

  **The Implication:**
  The "cost" you feel when considering a switch isn't the cognitive load of learning a new branch naming scheme; it is the **temporary collapse of common knowledge**.

  When you propose switching, you aren't just proposing a syntax change; you are proposing to break the mutual expectation that allows the team to function without communication. Until the new convention is established, every commit becomes a moment of uncertainty: *Did they see the memo? Are they using the old way? Do I need to check?*

  Lewis explains that because the alternative regularity was originally **arbitrary** (both were "equally workable"), there is no technical hill to die on. This makes the resistance feel irrational to an outsider, but Lewis would argue it is perfectly rational. The team is protecting the coordination equilibrium. The friction is the price of re-establishing common knowledge. If the disagreement were about technical merit (e.g., a security vulnerability), the payoff matrix would change. Since it is purely conventional, the only "loss" is coordination, which feels disproportionately expensive because it threatens the smooth, silent cooperation of the remote team.

  ### (b) What it takes to engineer a deliberate switch

  Lewis distinguishes between conventions that arise from **precedent** (what we've always done) and those that arise from **agreement** (a explicit decision to do X). Your original team formed conventions via precedent (drift). To switch now, you must manufacture an *agreement* that overrides the *precedent*.

  To successfully engineer a switch, you must replicate the conditions of a natural convention artificially:

  1.  **Create Salience:** Lewis notes that for a new convention to stick, the new regularity must be "salient." In a remote team, silence is the enemy of salience. You cannot rely on "quiet corrections." You need a focal point.
      *   *Action:* Write an RFC or a decision record. It must be a singular, undeniable artifact that says, "We are doing X now."
  2.  **Establish Common Knowledge (The Crucial Step):** It is not enough that everyone knows the new rule. Everyone must know that *everyone else knows*.
      *   *Action:* Discuss the change in a synchronous meeting (video call). If you only post it in Slack, Person A might think Person B missed it. If you discuss it together, it becomes common knowledge. This removes the "I didn't know we were switching" escape hatch.
  3.  **Alter the Payoff Structure:** Lewis's conventions hold because people *prefer* to conform conditional on others conforming. You need to make conforming to the *new* habit easier than the old one.
      *   *Action:* Implement linters or CI checks that automatically reject the old convention. This removes the human burden of enforcement (the "quiet correction") and makes the new convention the path of least resistance.
  4.  **Acknowledge Arbitrariness:** Lewis insists a convention must have an alternative. If you claim the new way is "objectively better" when it isn't, you invite debate.
      *   *Action:* Explicitly state: "Team B's way was fine, our way was fine, but we need one way." This validates the loss the original team feels without validating the resistance.

  ### (c) Where Lewis's picture stops being adequate (The Normativity Gap)

  This is the most critical philosophical friction point in your merge. Lewis's account is fundamentally **pragmatic**, not **normative**.

  For Lewis, I follow a convention because I *want* the coordination benefit, not because I *ought* to. The "obligation" is hypothetical: "If you want coordination, you ought to conform."

  However, you noted that one team feels a "mild sense of obligation" that the other doesn't.
  *   **Team A (Obligation):** Views the convention as a constitutive rule of professional engineering. Breaking it is a minor ethical lapse.
  *   **Team B (Pragmatic):** Views the convention as a useful heuristic. Breaking it is a minor efficiency loss.

  **The Lewisian Failure:**
  Lewis's model cannot explain why Team A feels *resentment* rather than just *frustration*. In a pure coordination game, if someone drives on the left, I am annoyed because we might crash (coordination failure). I do not think they are *wrong* in a moral sense.

  When a convention picks up normativity, it ceases to be a pure Lewisian convention and becomes a **social norm** (or what philosopher Margaret Gilbert calls a **Joint Commitment**).
  *   **Lewis:** "We do X because it works."
  *   **Norm:** "We do X because it is what members of this group *do*."

  **The Implication for the Merge:**
  If you try to solve this using only Lewis's tools (coordination and common knowledge), you will fail to address Team A's sense of violation. They aren't just losing a coordination equilibrium; they feel their professional standards are being diluted.
  *   **The Risk:** Team A will view Team B's "drift" not as a coordination error, but as a lack of commitment to the group.
  *   **The Fix:** You must negotiate the *status* of the rule, not just the rule itself. You need to decide: Is this a **law** (enforced by CI, mandatory) or a **guideline** (enforced by social pressure)?
      *   If you make it a law (CI gates), you remove the normativity and return it to a Lewisian coordination problem (the machine enforces it, not your conscience).
      *   If you leave it as a guideline, Team A's sense of obligation will continue to clash with Team B's pragmatism, leading to the "quiet corrections" becoming loud resentments.

  ### Summary
  Lewis teaches us that your inertia is rational (protection of common knowledge) and that your solution requires explicit agreement + tooling (to reset the payoff matrix). But Lewis warns us that he cannot solve the feeling of *obligation*. If one team feels bound by duty and the other by convenience, you are no longer playing a coordination game; you are negotiating culture. To fix that, you must either automate the rule (removing the human obligation) or explicitly discuss the values behind the rule (aligning the obligation).
