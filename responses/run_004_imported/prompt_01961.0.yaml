      *   *The Role of Passion:* Passions (even dangerous ones like gambling or love) provide the *energy* for happiness. Without them, life is ennui (boredom), which she considers the worst evil.
      *   *The Role of Reason:* Reason is a tool, not a master. It should serve happiness, not truth for truth's sake. If reason makes you miserable, it's bad reason.
      *   *Context:* She was an Enlightenment figure, but distinct from the austere rationalists. She believed in Newtonian physics *and* the necessity of emotional deception.

  3.  **Analyze Modern Therapy Culture (specifically CBT/Stoic-adjacent self-help):**
