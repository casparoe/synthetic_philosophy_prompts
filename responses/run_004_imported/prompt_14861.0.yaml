      *   **Planning Stage (Ex Ante):** Choose probability $p$ of continuing. Expected Utility (EU) = $(1-p) \cdot 0 + p(1-p) \cdot 4 + p \cdot p \cdot 1 = 4p - 3p^2$. Maximize: $4 - 6p = 0 \Rightarrow p = 2/3$. EU = $4/3$.
