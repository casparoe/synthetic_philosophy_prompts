answer: |-
  **Scenario: The Antivenom Triage**

  Imagine a remote clinic with three snakebite victims—Elena, Marcus, and Sam—and only one dose of antivenom. Without it, they die; with it, they recover fully. We assign a utility of **120** to survival and **0** to death.

  *   **Arrangement A (The Queue):** The dose is given deterministically to Elena, who arrived first.
      *   Elena's Utility: 120
      *   Marcus's Utility: 0
      *   Sam's Utility: 0
      *   **Total Social Welfare:** $120 + 0 + 0 = \mathbf{120}$

  *   **Arrangement B (The Lottery):** The dose is allocated by a fair random draw (straws), giving each patient a 1/3 probability of survival.
      *   Elena's Expected Utility: $\frac{1}{3}(120) + \frac{2}{3}(0) = 40$
      *   Marcus's Expected Utility: $\frac{1}{3}(120) + \frac{2}{3}(0) = 40$
      *   Sam's Expected Utility: $\frac{1}{3}(120) + \frac{2}{3}(0) = 40$
      *   **Total Social Welfare:** $40 + 40 + 40 = \mathbf{120}$

  Under Harsanyi's rule, the social planner is mathematically forced to be indifferent between Arrangement A and Arrangement B because the sum of utilities is identical. Diamond argues this is morally blind: Arrangement B spreads the *risk* of death equally, whereas Arrangement A imposes it arbitrarily on two specific people.

  **The Responsible Premise**
  This tie is caused by the **Ex-Ante Pareto condition**, which mandates that the social planner rank uncertain prospects based solely on the vector of individual expected utilities, thereby precluding the planner from assigning independent moral value to the fairness of the risk distribution itself.
