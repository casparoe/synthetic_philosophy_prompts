answer: |-
  # Real Patterns in the Activation Space

  The debate over the ontological status of neural network features has calcified into a familiar philosophical stalemate. On one side stand the mechanistic interpretability realists, pointing to the universality of curve detectors and the robustness of steering vectors as evidence that features are physical structures waiting to be discovered, akin to neurons in V1. On the other stand the deflationists, armed with the mathematics of superposition and recent results showing that "atomic" features decompose under higher-resolution analysis, arguing that features are merely useful projections imposed by the observer.

  This stalemate is unnecessary. It persists only because both sides are fighting over a category error regarding what kind of reality is at stake. The hard realist wants features to be Fodor-style atomic symbols, discrete and context-independent. The hard deflationist wants to deny reality to anything that isn't fundamental. Both are wrong.

  The correct verdict is that neural network features are **Dennettian Real Patterns**. They are not atomic constituents of the network's hardware, but they are not mere fictions either. They are objective, high-level structures that earn their ontological keep through predictive compression. We should be realists about the *patterns* the network instantiates, but deflationists about the *granularity* of those patterns. The "Golden Gate Bridge" feature is real in exactly the same sense that a "storm front" is real: it is a stable, causally potent configuration of lower-level states that allows for efficient prediction and intervention, even if it dissolves under sufficient magnification into pressure gradients and temperature differentials.

  ### The Failure of Atomic Realism

  The realist intuition is powerful because it works. When Anthropic researchers identify a "sycophancy" direction and clamp it, the model stops sucking up. When we find curve detectors in independently trained models, it suggests a convergent evolutionary pressure in the loss landscape. If these were mere Rorschach tests, causal interventions would not transfer so reliably. This is the strongest argument for realism: *causal leverage implies ontological weight.*

  However, the hard realist position crumbles when faced with the "meta-SAE" result. If a feature representing "Einstein" in a small sparse autoencoder (SAE) decomposes into "scientist," "Germany," and "famous person" in a larger SAE, the hard realist faces a dilemma. Was the "Einstein" feature *really* there, or was it an illusion? If it was real, how can it be composed of other things? If it wasn't, why did it steer the model?

  The hard realist, seeking a "view from nowhere," assumes there is a single, correct vocabulary of features—a canonical basis set for the network's mind. But superposition guarantees that no such basis exists within the layer's native dimensionality. The network is forced to pack more features than dimensions, meaning features *must* overlap. To insist on atomicity is to insist that the map must have a one-to-one correspondence with the territory, ignoring that the territory itself is a compressed representation of training data. The "interpretability illusions" in BERT, where neurons appeared to track specific syntactic roles but were actually tracking something more convoluted, serve as a warning: naming a direction does not make it a natural kind.

  ### The Deflationist Overreach

  The deflationist correctly identifies that feature lists are incomplete and non-atomic. The paper "Sparse Autoencoders Do Not Find Canonical Units of Analysis" is a devastating critique of the idea that we can find the "periodic table" of neural concepts. If every feature decomposes under higher magnification, the deflationist argues, then "feature" is just a word for "whatever projection makes the human observer feel smart."

  But this conclusion is too strong. It conflates *non-fundamentality* with *non-reality*. If I describe a computer running a chess engine, I can describe it at the level of transistors, logic gates, or board states. The "Queen" is not a fundamental physical object; it is a pattern of voltage states. A deflationist might argue the "Queen" isn't real because I can decompose it into voltages. But if I want to predict the computer's next move, the "Queen" level of description is vastly more efficient than the voltage level. To deny the reality of the "Queen" is to deny the utility of the chess description.

  Similarly, if an SAE feature allows me to compress the activation space of a model with minimal reconstruction loss, and manipulating that feature predictably changes the output, it satisfies the criterion for reality. The deflationist error is assuming that because a description is lossy or scale-dependent, it is arbitrary. It is not arbitrary; it is constrained by the geometry of the activation space and the loss function of the SAE.

  ### Features as Real Patterns

  Daniel Dennett, in *Real Patterns*, argues that a pattern is real if describing a system in terms of that pattern allows for more efficient compression and prediction than describing the system in terms of its raw physical state. A bitmap of a checkerboard is the "ground truth," but the pattern "checkerboard" is real because it captures the regularities that matter for prediction.

  Apply this to the SAE. An SAE is literally a compression algorithm. It attempts to reconstruct the activation vector using a sparse linear combination of latent features. When a feature like "Einstein" emerges in a small SAE, it is because grouping "scientist," "Germany," and "famous person" into a single latent variable offers a better compression trade-off for that specific model capacity than keeping them separate. It is a *real pattern* at that resolution.

  When we move to a larger SAE (higher capacity), the compression algorithm finds it more efficient to split "Einstein" into its constituents. This does not retroactively make the "Einstein" feature an illusion. It makes it a *coarse-grained* real pattern. The deflationist claims there is "no fact of the matter" about the right level of granularity. Dennett replies: the right level is the one that maximizes predictive power per bit of description.

  This resolves the tension between universality and non-atomicity. Low-level features (curve detectors) are universal because they are optimal compressions for *any* vision system processing natural images. High-level features ("sycophancy") are less universal because they depend on the specific "loss landscape" of the training run, but they are still real patterns if they support intervention. The fact that they decompose doesn't mean they aren't there; it means the network's ontology is hierarchical, not flat.

  ### The Verdict

  So, do neural networks have representations? **Yes, but they are functional, not structural.**

  We must reject the Fodor-style hope that we will find a discrete, atomic "symbol" for the Golden Gate Bridge inside the weights. That is a category error born of classical AI. The network does not store symbols; it stores a high-dimensional vector field where concepts are topological structures.

  However, we must also reject the deflationist claim that these structures are merely projections of the researcher's mind. The constraints are too tight. The fact that independent training runs converge on similar circuits (universality) and that steering vectors generalize (causal leverage) proves that the patterns are intrinsic to the network's function, not extrinsic to the observer's interpretation.

  The verdict is this: **A feature is real if and only if it constitutes a stable manifold in activation space that supports causal intervention and offers compression over the raw basis.**

  This is a qualified realism. It admits that "Einstein" is real in a 16k SAE but might not be in a 1M SAE. It admits that some named features are illusions (failed compressions that don't support intervention). But it affirms that the search for features is not a search for ghosts; it is a search for the *joints of the compression scheme* the network has adopted to minimize loss.

  To the deflationist who says, "But the features change with the SAE size," we answer: "Of course they do. The map changes with the scale. That doesn't mean the territory is featureless." To the realist who says, "We found the neuron for X," we answer: "You found a direction that compresses X. Do not reify the direction into an atom."

  Mechanistic interpretability is not neuroscience. We will not find the "grandmother cell." But we are not merely telling stories. We are reverse-engineering the compression algorithm of a mind. The patterns we find are real because they are the levers by which the mind moves. If you can pull the lever and the machine behaves as predicted, the lever is real, regardless of whether it is made of one metal or many.
