          *   *Assessment:* This captures the core of Williams's argument against externalism. Williams argues that for a reason to be a reason *for action*, it must be capable of explaining action. If it can't link to S via deliberation, it lacks explanatory power and normative force *for that agent*. The student captures the "explanatory link" requirement well.
