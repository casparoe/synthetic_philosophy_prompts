answer: |-
  This is a fascinating scenario, and you have stumbled upon one of the most delightful ironies in the history of economic thought. As it stands, **Laidlaw's argument is historically inaccurate regarding Hume.**

  If Laidlaw argues that national wealth consists *only* of specie (silver/gold) and that merchants should actively hoard it by restricting imports, he is making a **Mercantilist** argument (like Thomas Mun or Josiah Child), not a Humean one. In fact, David Hume is famous specifically for dismantling that exact view.

  However, this does not mean you need to scrap the scene. It offers you two distinct paths: you can either correct Laidlaw's economics to make him a true disciple, or you can keep the error to reveal something deeper about his character (that he is a pragmatic merchant who co-opts philosophy to justify caution).

  Here is the breakdown of the economics, followed by how to fix the speech.

  ### 1. The Historical Contradiction
  In his essays *Of Money* and *Of the Balance of Trade* (1752), Hume argues against the Mercantilist idea that a nation should try to accumulate specie. He introduces the **Price-Specie Flow Mechanism**.

  *   **The Mechanism:** If a nation (or merchant) successfully hoards silver, the money supply increases. This causes domestic prices and wages to rise. As prices rise, that nation's goods (linen) become too expensive for foreigners to buy, and foreign goods (wine) become relatively cheaper. Consequently, the silver naturally flows *out* again to pay for the imports.
  *   **The Conclusion:** You cannot permanently keep silver in a country any more than you can keep water at a higher level in one part of a connected system. Wealth is not money; wealth is **goods and labor**. Money is merely the "oil" that makes the wheels of industry turn faster.

  If Laidlaw argues for hoarding silver as an end in itself, a knowledgeable reader (or Hume himself) would recognize this as the very superstition Hume sought to destroy.

  ### 2. How to Fix the Speech (Option A: The True Humean)
  If you want Laidlaw to be a *correct* reader of Hume, he must shift his argument from **hoarding silver** to **avoiding credit and protecting industry.**

  Hume was deeply skeptical of **public and private credit**. He feared that easy credit created artificial bubbles that would inevitably burst, ruining the state. Since your scene is set in the early 1770s (just before the famous Ayr Bank crash of 1772), anxiety about credit was palpable.

  **The Revised Argument:**
  Laidlaw should not argue that silver *is* wealth. He should argue that **debt is danger.** He should urge his partner to demand silver not to hoard it, but to avoid the fragility of credit.

  **Key Humean Concepts to Invoke:**
  *   **Money as Oil:** Laidlaw can argue that while silver isn't wealth, it is the necessary lubricant for trade. If they extend credit (importing wine on debt), they are gumming up the wheels.
  *   **The Danger of Paper:** Hume preferred specie over paper credit because paper could vanish.
  *   **Industry vs. Idle Luxury:** Hume argued that luxury is only good if it stimulates domestic industry. Importing French wine on credit stimulates neither Scottish industry nor secure trade; it creates dependency.

  **A Concrete Mechanism/Example:**
  In *Of the Balance of Trade*, Hume uses the analogy of **water finding its level**.
  > *"All water, wherever it communicates, remains always at a level... No man ever needs to fear, that water will leave its level."*

  **Drafting Suggestion for Laidlaw:**
  > "You cite the flow of goods, Mr. [Partner], but Mr. Hume teaches us that money is like water in connected vessels; it seeks its own level. We cannot force the silver to stay, nor should we try to dam it. But we can choose the vessel. To import on credit is to build our vessel of paper. When the tide turns—and Hume assures us the tide *always* turns—those who hold the silver survive, and those who hold the debts drown. Let us take the linen's value in coin, not because coin is the end, but because coin is the only honest measure of labor that cannot vanish in a night."

  ### 3. How to Fix the Speech (Option B: The Selective Reader)
  If you prefer your original argument (that Laidlaw wants to hoard silver), you can frame this as **Laidlaw misreading Hume.** This adds psychological depth. Laidlaw is a conservative merchant who likes Hume's reputation but ignores his radical economics. He treats Hume as a sage of Prudence rather than a theorist of Systems.

  This is historically plausible. Many merchants read Hume's *Political Discourses* but took away only the parts that confirmed their existing biases.

  **The Nuance:**
  Laidlaw can acknowledge Hume's "water level" theory but argue that **in the short term**, a merchant must act as if silver matters. Hume admits that an inflow of money *temporarily* stimulates industry before prices rise. Laidlaw can argue that his business operates in that "short term."

  **Drafting Suggestion for Laidlaw:**
  > "I know well what Mr. Hume writes of the water finding its level. But tell me, does the water not rise before it falls? Does the industry not quicken while the silver is in hand? Mr. Hume speaks for nations and centuries; I speak for the House of Laidlaw and the coming quarter. Let the philosophers worry about the equilibrium. A prudent merchant knows that while the silver is in his strongbox, his credit is good, and his looms are humming. To send that silver out for French brandy is to surrender the advantage before the tide has even turned."

  ### 4. Specific References for the Text
  To make the "armchair economist" flavor authentic, here are specific touches Laidlaw could use:

  1.  **The "Oil" Metaphor (*Of Money*):**
      *   *Hume:* "Money is nothing but the representation of labour and commodities... It is only the oil which renders the motion of the wheels more smooth and easy."
      *   *Laidlaw:* "Silver is the oil, not the machine. But without oil, the machine grinds to a halt."

  2.  **The "Fourfold" Rule (*Of Money*):**
      *   *Hume:* Speculates that if money were quadrupled, prices would simply quadruple, leaving real wealth unchanged.
      *   *Laidlaw:* "If we flood the market with credit, we merely raise the price of linen without increasing its value."

  3.  **The Fear of Public Credit (*Of Public Credit*):**
      *   *Hume:* "Either the nation must destroy public credit, or public credit will destroy the nation."
      *   *Laidlaw:* "Hume warns that credit is a sword in the hands of a child. Do not let the French bankers hold the hilt."

  ### Recommendation
  For the richest scene, I recommend **Option B (The Selective Reader)**.

  It allows Laidlaw to make the Mercantilist argument you originally wrote (hoard silver, restrict imports), which creates better dramatic conflict with a partner who wants to expand trade. However, by having Laidlaw *acknowledge* Hume's counter-argument (the water level) and dismiss it as too theoretical for "real business," you show that Laidlaw is pragmatic, cautious, and perhaps slightly cynical. He uses Hume's name for authority, but trusts his own ledger more than Hume's philosophy.

  This makes him a more complex character: a man who reads the Enlightenment but lives in the Age of Prudence.

  **One final historical note:** If this is set in the *early* 1770s, you are moments away from the **Ayr Bank Crash (1772)**, which was caused by exactly what your younger partner wants to do (over-extending credit on speculative imports). Laidlaw's caution, even if economically "incorrect" by Hume's standards, would be vindicated by history very soon. You could have Laidlaw hint at this: *"Mr. Hume speaks of theory, but the air in Edinburgh already smells of panic. I will take the silver."*
