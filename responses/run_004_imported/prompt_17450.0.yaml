prompt: |-
  I am a PhD student in moral psychology, and this semester I have been helping my advisor screen undergraduates who are applying for research assistant positions in our lab. Across several rounds of interviews, I have noticed that I consistently rate candidates who answer quickly and maintain steady eye contact as more "engaged" and "sharp," even when a transcript of their answers reads no differently from that of a candidate who pauses more or looks away while thinking. A labmate who studies autism pointed out that this pattern would systematically disadvantage autistic applicants and anyone who simply needs more time to formulate an answer, and now I cannot decide whether my reaction is tracking something real about engagement or is just an unexamined bias. Is there a principled way to tell whether a reaction like mine reflects a legitimate preference rather than a bias, and should the answer change how I use these ratings going forward?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Situation:**
      *   **User:** PhD student in moral psychology. This is crucial. They understand concepts like bias, heuristics, construct validity, and ethical implications. They are likely looking for a nuanced, evidence-based, and ethically sound answer, not just general advice.
      *   **Context:** Screening undergraduates for Research Assistant (RA) positions.
      *   **Observation:** The user rates candidates who answer quickly and maintain eye contact as more "engaged" and "sharp," despite transcript analysis showing no difference in content quality compared to those who pause or look away.
      *   **Trigger:** A labmate (autism researcher) pointed out this disadvantages autistic applicants or those who need processing time.
      *   **Core Question:** Is there a principled way to distinguish between a legitimate preference (tracking a real trait) and a bias? Should this change how they use the ratings?

  2.  **Deconstruct the Core Question:**
      *   *Legitimate Preference vs. Bias:* In hiring/selection, a "legitimate preference" must be job-relevant (predictive of performance) and non-discriminatory (adverse impact analysis). A "bias" is a systematic error in judgment that reduces accuracy or fairness without adding predictive value.
      *   *The Specific Cues:* Quick answering and steady eye contact.
      *   *The Construct:* "Engaged" and "Sharp."
      *   *The Evidence:* Transcripts show no difference in answer quality.

  3.  **Consult Moral Psychology & Organizational Psychology Literature (Mental Sandbox):**
      *   *Thin Slicing:* Ambady & Rosenthal (1993) suggest quick judgments can be accurate, *but* they are prone to stereotyping.
      *   *Signaling Theory:* Eye contact and fluency are often signals of confidence, not necessarily competence.
      *   *Neurodiversity:* Autistic individuals often avoid eye contact due to sensory overload or different social norms, not lack of engagement.
      *   *Construct Validity:* Does "quick answer + eye contact" actually measure "sharpness" or "engagement"? The transcript evidence suggests *no*.
      *   *Adverse Impact:* If a selection criterion disproportionately excludes protected groups (disability status) without job-related justification, it's legally and ethically problematic.
      *   *Moral Psychology Angle:* Haidt's intuitionist model (quick gut feeling) vs. rational deliberation. The user is experiencing an intuition that might be culturally conditioned.

  4.  **Formulate the Argument:**
      *   **Acknowledge the Insight:** Validate the labmate's point. This is a classic case of "construct-irrelevant variance."
      *   **Define the Distinction (Principled Way):**
          *   *Predictive Validity:* Does the cue predict actual job performance?
          *   *Construct Validity:* Does the cue actually measure the intended trait (engagement/sharpness)?
          *   *Fairness/Adverse Impact:* Does the cue disadvantage specific groups without justification?
      *   **Apply to the Specific Case:**
          *   Transcripts show equal quality $\rightarrow$ Cue does not predict competence.
          *   Autism/Neurodiversity research $\rightarrow$ Cue is culturally/neurologically specific, not universal.
          *   Conclusion: It is likely a bias (specifically, *fluency bias* and *normative bias*).
      *   **Actionable Advice (How to use ratings):**
          *   Stop using these specific cues as positive indicators.
          *   Restructure the interview (structured interviews, work samples).
          *   Calibrate with the committee.
      *   **Moral Psychology Reflection:** Use this as a meta-cognitive opportunity. Acknowledge the "gut feeling" but override it with data.

