      *   *The Tension:* In the literary world, everyone *does* defer. They blurb books they haven't read. They call books "devastating" based on summaries. They violate the acquaintance principle constantly.
      *   *The Joke Opportunity:* Highlight the absurdity of treating aesthetic testimony as valid knowledge, or conversely, highlight the absurdity of insisting on acquaintance in a world built on gossip.

