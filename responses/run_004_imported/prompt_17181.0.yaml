answer: |-
  At a literary dinner last week, I found myself seated next to a critic whose blurb graced the back of my rival's latest novel. The book was being described by everyone at the table as "shattering."

  "Did you find it shattering?" I asked, pouring him wine.

  "Profoundly," he said, without looking up from his plate.

  "Which chapter broke you?"

  He paused, fork halfway to his mouth. "I didn't read it. I don't have to. My assistant read it. She has impeccable taste. I trust her implicitly."

  I put down the decanter. "So, when you write 'shattering,' you aren't describing the book."

  "I'm describing its effect."

  "No," I said. "If aesthetic judgment required acquaintance, you'd be lying. But since you're relying on testimony, you're not making an aesthetic judgment at all. You're making a factual claim about your assistant's reliability."

  He smiled, wiping his mouth. "Is there a difference?"

  "Yes. If you tell me the book has three hundred pages, I can believe you on your word. That's a fact. But if you tell me it's 'shattering,' you're asking me to share a feeling you haven't had. You're treating aesthetic value like a wire transfer—you think because the funds left her account, they automatically landed in yours."

  "So what am I actually blurbing?"

  "You're not blurbing the art," I said. "You're issuing a personnel recommendation for your assistant."
