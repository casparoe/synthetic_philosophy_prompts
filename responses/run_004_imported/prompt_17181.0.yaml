      *   **The Acquaintance Principle:** The idea that you can't genuinely hold an aesthetic judgment (e.g., "This book is beautiful") based solely on someone else's say-so, even if they are trustworthy. You need first-hand experience (acquaintance) with the object. This contrasts with ordinary facts (e.g., "Napoleon lost at Waterloo"), where testimony is sufficient.
