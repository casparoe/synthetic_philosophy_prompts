      *   Did I help avoid the generic paper? Yes.

  *(Self-Correction during drafting)*: I need to make sure I don't imply Rawls *is* a pure procedural justice theorist in the exact same way Nozick is. Rawls actually critiques pure procedural justice in the context of distributive shares if background institutions aren't fair. The teacher's point is likely that Nozick *appropriates* the logic of PPJ (like gambling) to defend market outcomes, whereas Rawls uses PPJ logic for the *Original Position* but insists on *background justice* for economic outcomes. I need to nuance this: Nozick treats the *market* as the pure procedure. Rawls treats the *Original Position* as the pure procedure for setting rules, but insists market outcomes need correction to maintain background justice.
  *Actually, looking at Rawls (TJ §17):* Rawls explicitly discusses "Pure Procedural Justice" regarding distributive shares. He says if background institutions are just, then the resulting distribution is just *whatever it is*. This is exactly the teacher's point! The disagreement is on **what counts as just background institutions**.
  *Okay, that's the key.* Both agree: Fair Procedure $\to$ Just Outcome.
  *Disagreement:* What constitutes the "Fair Procedure"?
  *   Nozick: Voluntary exchange + Just Acquisition.
