  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Caution:* Don't get bogged down in "Open Future" theories (that future statements have no truth value). While Aristotle flirted with this, many modern logicians accept bivalence for future contingents but reject the inference to fatalism. It's stronger to show the argument fails *even if* we grant the nephew his premise about truth values.
