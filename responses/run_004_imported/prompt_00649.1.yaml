      *   *Sidgwick's Project:* He wants ethics to be a rational science, based on self-evident axioms (like math or logic).
      *   *The Axioms:*
          1.  Justice/Equity (similar cases treated similarly).
          2.  Prudence (temporal neutrality: future good counts same as present good).
          3.  Rational Benevolence (universal good: everyone's good counts equally).
      *   *The Conflict:* Axiom 2 leads to Egoistic Hedonism (maximize *my* happiness). Axiom 3 leads to Universal Hedonism/Utilitarianism (maximize *everyone's* happiness).
      *   *The Problem:* In this life, maximizing *my* happiness often conflicts with maximizing *everyone's* happiness.
      *   *The "Illusory" Move:* Sidgwick believes "Practical Reason" implies a unified system. If Reason tells me to do X (be egoistic) and also tells me to do Y (be utilitarian), and I can't do both, then Reason is contradicting itself.
      *   *Why not just "two axioms"?* For Sidgwick, Reason is supposed to guide action definitively. If Reason gives contradictory commands, it fails to be *Practical* Reason. It becomes noise. If the faculty we trust to perceive moral truth (Intuition/Reason) yields contradictions, we lose confidence in the faculty itself. It suggests our sense of "self-evidence" is a psychological quirk, not a perception of objective truth.
      *   *Key Concept:* The "Cosmic Order." Sidgwick assumes a rational universe. A rational universe shouldn't have fundamental contradictions in its moral laws. If there is a contradiction, either the universe is irrational (nihilism) or our perception of the laws is wrong (illusory).

  3.  **Deconstruct Confusion 2: The SPR Connection:**
      *   *The Gap:* Virtue (Utilitarianism) often requires self-sacrifice. Self-Interest (Egoism) requires self-preservation/enjoyment.
      *   *The Fix:* If there is a God who rewards virtue and punishes vice *in the afterlife*, then the long-term self-interest of the virtuous person aligns with the universal good.
      *   *Why Psychical Research?* Sidgwick was an empiricist. He couldn't just *assume* God/Afterlife on faith (Kant did that with "Postulates of Practical Reason," but Sidgwick wanted evidence).
      *   *The Chain:*
          1.  Ethics requires the harmony of Duty and Self-Interest to be rational.
          2.  This harmony is not observable in *this* life.
