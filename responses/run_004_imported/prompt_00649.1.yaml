answer: |-
  You have hit on exactly why *The Methods of Ethics* is considered both a masterpiece and a tragedy. You are right to feel that the conclusion is a "downer." In fact, Sidgwick himself wrote to a friend that the conclusion left him with a "fundamental contradiction" that made life feel meaningless.

  Here is the breakdown of the logical move in that final paragraph, and how it connects to his decades of ghost-hunting with the Society for Psychical Research (SPR).

  ### 1. Why does a conflict make Reason "illusory"?

  Your intuition is spot on: normally, if you have two axioms that conflict, you just accept that you have a tragic dilemma. (e.g., "I ought to save my child" vs. "I ought to save the five strangers"). But Sidgwick isn't talking about a conflict of *duties*; he is talking about a conflict of **Rationality**.

  To understand the logical move, you have to see what Sidgwick thinks "Practical Reason" is supposed to *do*.

  **The Function of Reason**
  For Sidgwick, Practical Reason is the faculty that tells us what it is **rational** to do. It is supposed to be the ultimate guide to action. If Reason is truly "Reason," it must be coherent.
  *   **Method 1 (Egoism):** It is self-evidently rational to maximize your own happiness. (Based on the axiom of Prudence).
  *   **Method 2 (Utilitarianism):** It is self-evidently rational to maximize universal happiness. (Based on the axiom of Rational Benevolence).

  **The Contradiction**
  In this life, these two often diverge. Being a martyr maximizes universal happiness but destroys your own.
  *   If you choose Egoism, you are being Rational (by axiom 1) but Unreasonable (by axiom 2).
  *   If you choose Utilitarianism, you are being Rational (by axiom 2) but Unreasonable (by axiom 1).

  **The "Illusory" Conclusion**
  Sidgwick argues that if Reason issues two ultimate commands that are mutually exclusive, Reason is not functioning as a guide. It is like a compass that points North and South simultaneously.
  *   **Your alternative:** "Why not just leave him with two solid axioms that conflict?"
  *   **Sidgwick's reply:** Because if the axioms of Reason conflict at the foundation, then our confidence in **Intuition** is destroyed. Sidgwick built his whole system on the idea that we can perceive self-evident moral truths (like math). If our "math" tells us that $2+2=4$ and also $2+2=5$, we don't say "math has two conflicting axioms." We say "our perception of math is broken."

  Therefore, if the "intuitions" of Egoism and Utilitarianism contradict, the faculty producing them (Practical Reason) is **illusory**. It implies that what we thought was objective rational truth is actually just psychological bias. It leads to nihilism: there is no objective reason to be moral.

  The "ought" in that paragraph is the "ought" of logical consistency. Reason *needs* these to align for Reason to exist as a valid faculty.

  ### 2. The Chain of Reasoning to the SPR (Ghost Hunting)

  This is where it gets fascinating. Sidgwick was a rigorous empiricist. He didn't want to just *hope* the conflict was resolved; he wanted to know if it *was* resolved in reality.

  Here is the chain of reasoning that drove him to spend 20 years investigating mediums:

  1.  **The Ethical Problem:** Morality (Utilitarianism) is only fully "Rational" if it aligns with Self-Interest (Egoism). If being moral ruins your life, it is irrational to be moral.
  2.  **The Empirical Observation:** In *this* life, virtue and self-interest clearly do **not** align. Good people suffer; bad people thrive.
  3.  **The Necessary Postulate:** For Ethics to be a rational system, there must be a mechanism that ensures Virtue and Self-Interest eventually align.
  4.  **The Theistic Solution:** The only plausible mechanism is a Supreme Being who rewards virtue and punishes vice in an **afterlife**. (This is essentially the Kantian "Postulates of Practical Reason," but Sidgwick wants evidence).
  5.  **The Empirical Gap:** We cannot assume God or an afterlife exists on faith. That would be dogmatism, not science. If the rationality of ethics depends on an afterlife, we need **empirical proof** of an afterlife.
  6.  **The SPR Solution:** The Society for Psychical Research was founded to apply scientific methods to claims of telepathy, mediumship, and survival after death.
  7.  **The Goal:** If the SPR could prove, scientifically, that consciousness survives death and that there is a moral order governing the next world, then the "Dualism of Practical Reason" is solved. Egoism and Utilitarianism are reconciled because the "Self-Interest" of the ego extends into eternity, where it matches the "Universal Good."

  **Why empirical evidence?**
  Sidgwick famously said, *"I cannot find in my own consciousness any clear intuition that there is a God."* He couldn't do what Kant did (say "I must believe this for moral reasons"). Sidgwick needed it to be *true* in the same way gravity is true. If morality depends on the structure of the universe, and the universe doesn't actually have that structure (i.e., no afterlife), then morality is irrational.

  He hoped psychical research would provide the data point that saves ethics. Unfortunately, the SPR mostly found fraud and ambiguity. Sidgwick died without the proof he needed, leaving the "Dualism" unresolved.

  ### Summary for the EA Context

  When Effective Altruists cite Sidgwick or Parfit regarding the "Point of View of the Universe," they are usually leaning on the **Utilitarian** side of Sidgwick (Book III). They often gloss over the fact that Sidgwick himself thought that without a God/Afterlife to reconcile it with Egoism, the Utilitarian view might be rationally groundless.

  *   **The EA take:** "We should maximize the good from the point of view of the universe."
  *   **The Sidgwickian worry:** "Why should *I* care about the universe's point of view if it conflicts with *my* point of view, and there is no cosmic guarantee that helping the universe helps me?"

  Sidgwick's "downer ending" is the admission that secular utilitarianism cannot fully answer the Egoist's challenge ("Why be moral?") without making a metaphysical assumption (God/Afterlife) that it cannot prove.

  So, the SPR wasn't a hobby; it was a desperate attempt to find the empirical linchpin that would prevent his entire ethical system from collapsing into nihilism.
