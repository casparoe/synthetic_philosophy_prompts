  **Move 1:** Helena is logically correct that the truth of the fraud is independent of the accuser's history, making Felix's potential counterargument a classic tu quoque fallacy.

  **Move 2:** Marcus rightly shifts the frame from factual truth to narrative ethos, noting that public condemnation requires a credibility that mere factual accuracy does not guarantee.

  **Move 3:** Helena's analogy is socially robust regarding whistleblowers, but it slightly conflates legal testimony with the moral condemnation Marcus is questioning.

  **Move 4:** Marcus makes the debate's most crucial philosophical distinction, separating the act of reporting facts from the stance of claiming moral superiority.

  **Move 5:** Helena effectively counters the hypocrisy charge by establishing that genuine reform and cessation of crime create a meaningful moral divergence between Nora and Felix.

  **Move 6:** Marcus offers a valid critique of omission, noting that private restitution does not automatically grant the public standing required to judge others without transparency.

  **Missing Distinction:**
  They argue extensively about Nora's *standing* to accuse, but they never quite distinguish between **private atonement** and **public accountability**. Helena assumes repaying the money clears the moral debt, while Marcus assumes public judgment requires public confession; they never resolve whether private redemption is sufficient currency to purchase public moral authority.
