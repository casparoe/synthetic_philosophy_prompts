      *   *Impact on Debate:* If it's normative, Elif is right that disagreement implies irrationality (or lack of CK). If it's descriptive, Marcus is right that it's false. If it's a modeling convenience, Marcus is right that it shouldn't be used to diagnose real-world irrationality too harshly.

