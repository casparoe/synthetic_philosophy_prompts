prompt: |-
  Been down a Kierkegaard rabbit hole this week for a piece on internet pile-ons and realised the guy was basically writing about cancel culture back in 1846. There's his bit on "leveling" and "the public" as this weird phantom created by the press in Two Ages, and then theres the actual Corsair affair, where a satirical paper he'd basically goaded into attacking him ended up turning him into a laughingstock all over Copenhagen (caricatures of his trouser legs and everything). I cover science and tech, so I know exactly what it's like when a piece goes sideways and suddenly a few thousand strangers have Opinions in the replies. Could you lay out the most important implications of Kierkegaard's critique of the press and "the public" for how a journalist today should relate to their comments section and Twitter mentions - like, if hes basically right about what "the public" actually is, does that change whether I should read the replies at all, engage with them, or just log off? Not looking for a potted bio of the guy, more the "ok so what do I actually do about my mentions" version.
