prompt: |-
  I sit on the volunteer committee that awards our town's annual Good Neighbor Award, given each year to the resident judged to have 'served the community with distinction'—our only criterion, and it says nothing about motive. Our strongest candidate ran the most successful toy drive the town has seen, but she told us plainly in her interview that she started it as a marketing idea for her shop and keeps it going partly for that reason, even though she also says she's grown genuinely attached to the families involved and puts in far more unpaid time than any marketing plan would require. Some committee members want to pass her over for a less impressive but more clearly selfless candidate; others think that would just punish her for honesty, since no past winner's motives were probably pure either. We need to decide before Friday's ceremony program goes to print. Could you draft the short memo I'll send the committee, recommending how to decide the case and giving a genuinely fair hearing to whichever side we don't adopt?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the volunteer committee for the town's Good Neighbor Award.
      *   **Task:** Draft a short memo to the committee.
      *   **Purpose:** Recommend how to decide the case (the toy drive candidate vs. the selfless candidate) and give a genuinely fair hearing to the side *not* adopted.
      *   **Constraint:** The decision needs to be made before Friday (program goes to print).
      *   **Key Facts:**
          *   Criterion: "Served the community with distinction."
          *   Criterion Note: Says nothing about motive.
          *   Candidate A (Toy Drive): Most successful drive ever, admitted mixed motives (marketing + genuine attachment), puts in unpaid time exceeding marketing value.
          *   Candidate B (Alternative): Less impressive impact, but clearly selfless motives.
          *   Conflict: Impact/Mixed Motives vs. Lesser Impact/Pure Motives.
          *   Ethical Dilemma: Punishing honesty vs. upholding the spirit of the award.

  2.  **Determine the Stance/Recommendation:**
      *   The prompt asks me to recommend *how* to decide, not necessarily to pick a winner myself (though a strong recommendation helps). However, to write a compelling memo, I need to take a position to argue *for*, while fairly representing the counter-argument.
      *   *Option 1: Award Candidate A.* Argument: The criterion is service, not motive. Impact matters most. Honesty is a virtue.
      *   *Option 2: Award Candidate B.* Argument: The spirit of "Good Neighbor" implies altruism. Marketing-driven service undermines the award's integrity.
      *   *Decision:* Awarding Candidate A is the stronger logical position based on the *written* criterion ("served the community with distinction"), while acknowledging the emotional weight of Candidate B. It aligns with the "no motive" clause mentioned in the prompt. It also avoids the slippery slope of judging internal thoughts.
      *   *Alternative Decision:* Actually, the prompt asks me to recommend *how to decide*. It might be safer to recommend a specific outcome to make the memo actionable. Let's go with recommending Candidate A, as it adheres strictly to the stated criterion, but I must ensure the "fair hearing" to the other side is robust.
      *   *Wait, re-reading:* "recommending how to decide the case and giving a genuinely fair hearing to whichever side we don't adopt." This implies I should pick a side for the recommendation, but treat the other side with respect.
