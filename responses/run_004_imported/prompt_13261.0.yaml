answer: |-
  **The Goodman Clause**

  **Characters:**
  **ARTHUR:** A collector who subscribes to Nelson Goodman's theory of autographic art.
  **BEATRICE:** His friend, who finds this exhausting.

  **Setting:**
  Arthur's study. Two identical landscapes hang side-by-side on the wall. One is a verified Vermeer; the other is a Van Meegeren forgery.

  **BEATRICE**
  They're identical, Arthur. I've stood here for twenty minutes. I have a PhD in optics. They are pixel-perfect clones.

  **ARTHUR**
  (Staring reverently at the left canvas)
  That's because you're looking with contemporary eyes.

  **BEATRICE**
  There is no other kind.

  **ARTHUR**
  Not yet. But consider the aesthetic superiority of the left piece. It is inherently more valuable *now*, even though we can't say why.

  **BEATRICE**
  How can it be superior *now* based on a difference we can't see *now*?

  **ARTHUR**
  Because a sufficiently trained eye *might* detect the variance later. The potential for future discrimination is itself an aesthetic property.

  **BEATRICE**
  So you paid forty million dollars for a painting that is currently indistinguishable from the one next to it, based on the hope that someone in 2080 develops a retina capable of spotting a brushstroke that may not exist?

  **ARTHUR**
  I paid for the certainty that if they *do* find a difference, this will be the one that was right.

  **BEATRICE**
  And if they never find a difference?

  **ARTHUR**
  Then the training simply wasn't rigorous enough. We'll train harder.

  **BEATRICE**
  So the argument is unfalsifiable. If they find a difference, you win. If they don't, you just claim the eyes aren't trained enough, and you still win.

  **ARTHUR**
  (Smiling)
  It's a very robust investment strategy.

  **BEATRICE**
  It's not art criticism, Arthur. It's a warranty that voids itself upon inspection.

  **ARTHUR**
  Precisely. Now, hand me those binoculars. I think I'm finally starting to perceive the possibility of a discrepancy.

  **BEATRICE**
  Those are empty frames.

  **ARTHUR**
  Exactly. I'm looking at what isn't there. It's exquisite.
