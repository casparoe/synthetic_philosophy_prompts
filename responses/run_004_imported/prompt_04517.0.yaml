      *   **The Task:** Walk through the logic step-by-step, clarify what Aristotle thinks money *is* in this context, address the "measure" vs. "convention" tension, and explain why commentators fight over this.

  2.  **Deconstruct the Aristotelian Text (Book V.5):**
