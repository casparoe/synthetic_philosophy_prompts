  2.  **Identify the Core Concept:**
      *   This is a classic problem in systems design, law, computer science, and governance.
      *   *Key Term:* **Rule Complexity / Regulatory Bloat.**
      *   *Key Concept:* **Goodhart's Law** (when a measure becomes a target, it ceases to be a good measure) or **Campbell's Law**.
      *   *Key Concept:* **The Frame Problem** (AI/Logic) - difficulty in specifying all relevant conditions.
      *   *Key Concept:* **Principles vs. Rules.**
      *   *Key Concept:* **Emergent Behavior** (kids finding loopholes is like users exploiting system vulnerabilities).

  3.  **Address Question 1: Is it on us? (Blame vs. Inevitability)**
      *   *Answer:* It's not really your fault. It's a fundamental property of complex systems.
      *   *Reasoning:* You cannot anticipate every future state of the world (bounded rationality). Kids are adversarial testers (smart, motivated to find gaps). Language is inherently ambiguous.

  4.  **Address Question 2: Is there a deeper reason? (The Theory)**
      *   *Yes.* This is well-documented in several fields.
      *   *Law:* Statutes vs. Case Law. Laws get amended constantly to close loopholes.
      *   *Computer Science:* Software bugs and technical debt. Patching code often creates new bugs.
      *   *Economics/Game Theory:* Agents (kids) optimize for their utility (more screen time) within the constraints.
