answer: |-
  The research program on Embedded Agency, advanced by Scott Garrabrant, Abram Demski, and colleagues at the Machine Intelligence Research Institute (MIRI), challenges the foundational assumptions of classical artificial intelligence and decision theory. Standard models, epitomized by Marcus Hutter's AIXI, rely on a "Cartesian" dualism: the agent is a distinct, unmodeled entity interacting with an environment through well-defined input/output channels. The embedded view posits that agents are physical subsystems of the environment they inhabit. This shift is not merely ontological; it precipitates formal crises in how we define rational belief and action.

  This essay compares the Cartesian and embedded conceptions of agency through the lenses of the Löbian obstacle and logical uncertainty. It argues that these difficulties cannot be dismissed as mere environmental uncertainty within a Cartesian framework. Finally, it defends the view that embeddedness imposes a genuinely new limitation on formal theories of rationality: it transforms ancient logical paradoxes of self-reference into concrete, normative constraints on decision theory, necessitating a reconstruction of rationality rather than a mere acknowledgment of epistemic humility.

  ### The Cartesian vs. Embedded Distinction

  In the Cartesian picture, the agent is "larger" than its model of the environment. AIXI, for instance, maintains a prior over all computable environments but treats itself as an uncomputable oracle outside that set. The agent's own source code, physical state, and reasoning process are not part of the environment it simulates; they are the conditions of possibility for the simulation itself. The boundary between agent and world is absolute.

  In the embedded picture, the agent is a proper part of the world. It is made of the same stuff as the environment, subject to the same physical laws, and potentially observable by other agents (or its future self). Consequently, an embedded agent cannot contain a complete, high-fidelity model of the world, because that model would have to contain a model of itself, leading to infinite regress. Rationality, therefore, cannot be defined as maximizing expected utility relative to a complete world-model, but must be defined relative to partial, self-referential, and resource-bounded representations.

  ### (a) The Löbian Obstacle

  The Löbian obstacle arises when an agent attempts to reason about its own future reasoning. In formal logic, Löb's Theorem states that for a sufficiently strong formal system (like Peano Arithmetic), if the system can prove that "if $P$ is provable, then $P$ is true," then $P$ is provable. Formally: $\square(\square P \to P) \to \square P$. A corollary is that a consistent system cannot prove its own consistency.

  For an embedded agent, this creates a "procrastination paradox." Suppose an agent wants to ensure a goal is achieved and plans to delegate the task to a future version of itself. To trust the future self, the current agent must prove that the future self's reasoning will lead to the goal. However, if the future self uses the same axioms as the current self, the current self cannot prove the future self's consistency without becoming inconsistent itself. To remain consistent, the agent must trust a future self that operates on *weaker* axioms. If this continues recursively, the agent's trust dwindles to nothing after a finite number of steps, making long-term planning or self-modification impossible.

  **Why this resists the Cartesian Picture:**
  In a Cartesian framework, uncertainty about the future is treated as empirical uncertainty. One might argue the agent simply assigns a probability less than 1 to its future self functioning correctly, just as it would for a broken robot arm. However, the Löbian obstacle is not about hardware failure or empirical noise; it is about *logical validity*.

  In the Cartesian view, the agent's reasoning is assumed to be a fixed, trustworthy background process. The environment is uncertain; the logic is not. If we attempt to absorb the Löbian obstacle as environmental uncertainty, we treat the truth of logical deductions as contingent facts about the world. But if an agent treats its own logical deductions as merely probable empirical hypotheses, it loses the ability to use logic to make decisions at all. It creates a reflective inconsistency: the agent uses logic to choose actions, but assigns a probability $<1$ to the validity of that logic. The Cartesian separation relies on the agent being a "god's eye" logic machine looking at a messy world. Embeddedness reveals the logic machine itself is messy and subject to the same limitations as the world it observes.

  ### (b) Logical Uncertainty

  Standard Bayesian decision theory assumes logical omniscience. If an agent knows $A$ and knows $A \implies B$, it must assign probability 1 to $B$. Uncertainty is purely empirical (indexical or sensory). For example, a Bayesian agent knows the axioms of arithmetic; it is only uncertain about the output of a coin flip, not the billionth digit of $\pi$.

  Embedded agents, however, are computationally bounded. They must act before they have deduced all logical consequences of their knowledge. They face "logical uncertainty": uncertainty about the output of deterministic computational processes that they have not yet run. Garrabrant and Demski's work on *Logical Induction* attempts to formalize a theory of probability that assigns coherent probabilities to logical sentences before they are proven.

  **Why this resists the Cartesian Picture:**
  A Cartesian defender might claim logical uncertainty is just uncertainty about the "environment's state" (i.e., the state of the computer). This fails because standard probability theory is incoherent when applied to logical facts. If an agent assigns probability 0.5 to a logical statement $L$ and 0.5 to $\neg L$, a clever bookie can construct a Dutch book against the agent, *even if* $L$ is a tautology that the agent simply hasn't proven yet.

  In the Cartesian picture, the agent is defined as an optimizer that satisfies coherence axioms. To admit logical uncertainty is to admit that the agent systematically violates the axioms of rationality (specifically, the requirement that $P(A) = 1$ if $A$ is a logical truth). You cannot absorb this into environmental uncertainty without redefining the agent's rationality criteria. The Cartesian model assumes the map (beliefs) can perfectly mirror the territory (logic) given enough data. Embeddedness asserts that for a computable agent, the map can never perfectly mirror the territory because the map is *inside* the territory. The uncertainty is not about the world being stochastic; it is about the agent's inability to fully compute the determinism of the world.

  ### Defense: A New Limitation or an Old Problem?

  Does embeddedness impose a genuinely new limitation on formal rationality, or does it merely restate older philosophical problems regarding self-reference and the limits of self-knowledge?

  It is undeniable that the roots of these problems are old. Gödel's incompleteness theorems, Turing's halting problem, and Tarski's undefinability of truth established a century ago that formal systems cannot fully comprehend themselves. Kant argued that the mind cannot know itself as an object because it is the subject of knowing. In this light, Embedded Agency appears to be simply dressing up classical epistemology in the formal language of computer science.

  However, I defend the view that Embedded Agency constitutes a **genuinely new limitation on normative theories of rationality**, distinct from the older metaphysical or epistemological formulations.

  The classical problems of self-reference were largely *descriptive* or *limitative* regarding truth and provability. Gödel showed what cannot be *proven*. Embedded Agency shows what cannot be *optimized*. The shift is from logic to decision theory. The Löbian obstacle does not just say "you cannot prove you are consistent"; it says "you cannot construct a utility-maximizing plan that involves self-modification." Logical uncertainty does not just say "you cannot know all truths"; it says "standard expected utility maximization is ill-defined for bounded agents."

  This imposes a new requirement: a theory of rationality must no longer be about finding the optimal action given a prior (the Cartesian standard), but about finding a *stable* policy given self-referential constraints. This has led to new decision theories, such as Functional Decision Theory (FDT) and Updateless Decision Theory (UDT), which attempt to handle acausal trade and self-prediction in ways Causal Decision Theory (the Cartesian standard) cannot.

  If this were merely an old philosophical problem, the solution would be philosophical acceptance (e.g., "agents must be humble"). Instead, the Embedded Agency program demands *technical reconstruction*. It reveals that the standard definition of "rational agent" (a coherent Bayesian optimizer) is mathematically impossible for any entity physically instantiated within the universe it models.

  Therefore, while the *source* of the difficulty is the ancient problem of self-reference, the *consequence* is a novel constraint on agency. It demonstrates that rationality is not a static ideal that agents approximate, but a structural relationship between a subsystem and its containing system that requires new formal tools to navigate. The limitation is not just that we cannot know everything; it is that the very concept of "maximizing expected utility" breaks down when the maximizer is part of the system being maximized. This is a new, formal barrier to the engineering of rational agents, distinct from the philosophical barriers to human self-knowledge.

  ### Conclusion

  The Cartesian picture of agency relies on a separation that does not exist in physical reality. By attempting to absorb the Löbian obstacle and logical uncertainty as mere environmental noise, Cartesian models fail to account for the structural constraints of being a subsystem within a larger system. These are not empirical gaps to be filled with more data, but logical gaps inherent to self-reference. While grounded in the classical insights of Gödel and Turing, the Embedded Agency research program translates these insights into a new normative crisis for decision theory. It shows that rationality, formally defined, is not merely limited by computation, but by the topology of the agent's relationship to its world. Thus, embeddedness imposes a genuinely new limitation: it renders the standard formalization of rational agency mathematically incoherent, demanding a reconstruction of the theory itself.
