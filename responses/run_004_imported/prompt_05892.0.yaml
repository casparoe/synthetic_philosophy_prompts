answer: |-
  It is a seductive calculation. I do not deny it. When one has spent a life teaching men to measure belief by the odds they will take, it is natural to feel that any argument which can be cast as a mathematical expectation must command our assent. If the potential good is infinite, or near enough, and the probability of securing it is merely small, the product remains vast. It seems to be simple arithmetic.

  But arithmetic, as I learned from Mr. Wittgenstein, is a technique, not a metaphysic. It tells you what follows from your premises; it cannot validate the premises themselves. And it is here, in the inputs of this "astronomical waste" equation, that the longtermist commits a category error which my own work on probability was designed to expose.

  You ask if my treatment of subjective probability commits me to this cosmic bookkeeping. I say it does the opposite. It provides the very tools to dismantle it.

  In *Truth and Probability*, I argued that a degree of belief is not a ghostly intuition, but a disposition to act. To say you believe a proposition to degree $p$ is to say you are prepared to bet on it at odds corresponding to $p$. But a bet must, in principle, be capable of settlement. If I wager on the happiness of a being ten million years hence, when will the bookie pay out? When the stars are cold? There is no temporal locus for the verification of the bet. Consequently, there is no operational meaning to the "probability" assigned to such an outcome. It is not that the probability is low; it is that it is undefined. To insert a number into the expected utility formula where no betting quotient can exist is not mathematics; it is numerology.

  There is a second error, one I discussed with Mr. Keynes over tea, regarding the distinction between *risk* and *uncertainty*. Risk applies when we know the distribution of outcomes, as with a roulette wheel. Uncertainty applies when the system itself is unknown. The causal chain linking a policy today to the state of the universe in a million years is not merely long; it is chaotic. In such a system, our causal leverage decays to zero not linearly, but effectively instantly. To claim we can influence the specific population count of the far future is to pretend a butterfly's wing can be calculated to steer a hurricane. My calculus of expectation applies to decisions under risk, where the variables are stable. It does not apply to the void.

  But let us grant, for the sake of argument, that we could assign a probability. There remains the question of Value. The longtermist treats "good lives" as additive units, like bushels of wheat. If you have one bushel, and I give you another, you have two. This assumes that value is a homogeneous substance independent of the valuer.

  I reject this. In the *Epilogue*, I wrote that my picture is drawn in perspective. This was not a poetic flourish; it was a logical necessity. Value is a relation between a subject and an object. A universe without a subject to experience it has no value, positive or negative. Therefore, the "value" of future people is not a pre-existing quantity waiting to be maximized; it is a projection of our current desires. To sacrifice the definite goods of the foreground—the relief of suffering now, the cultivation of friendship, the pursuit of truth—for the sake of a shadowy multitude in the background is to invert the logic of ethics. Ethics is a system for guiding human action. A system that demands we ignore all immediate human data in favor of a speculative abstraction ceases to be a guide for humans. It becomes a idolatry of the infinite.

  So, does my expected utility theory trap me? No. It saves me. It demands that we be honest about our beliefs and our values. My belief that I can affect the distant future is negligible, because I cannot bet on it. My value for the distant future is negligible, because I cannot conceive it.

  The longtermist looks at the stars and sees a ledger to be balanced. I look at them and see a silence. We are not accountants for the cosmos. We are gardeners in a small plot. To neglect the garden because the forest is vast is not rationality. It is madness.
