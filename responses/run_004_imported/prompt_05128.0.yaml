      *   **Loschmidt's Reversibility Paradox:** Microscopic laws are time-symmetric. How do you get irreversible macroscopic behavior? Boltzmann's answer: Statistical probability. It's *overwhelmingly likely* entropy increases, but not strictly impossible for it to decrease.
      *   **Zermelo's Recurrence Paradox:** Poincaré recurrence theorem says a finite system will eventually return to its initial state. Boltzmann's answer: Yes, but the timescales are astronomically longer than the age of the universe.
      *   **The Modern Boltzmann Brain Problem:** If the universe is eternal and in equilibrium, small fluctuations (a single brain) are vastly more probable than large fluctuations (an entire universe with billions of galaxies and evolved life). Therefore, statistically, "I" should be a Boltzmann Brain, not a real person. Since I seem to be a real person, the model is likely wrong.

  3.  **Simulate Boltzmann's Reaction (The "What would he say?" part):**
      *   *Option 1: Bite the Bullet.* Would he accept he's a brain? Unlikely. He was a realist about the external world (atomist). Solipsism/illusionism wasn't his jam.
