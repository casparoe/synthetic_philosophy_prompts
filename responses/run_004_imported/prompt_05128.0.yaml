      *   *Historical Personality:* Boltzmann suffered from depression and felt underappreciated. He fought hard for the reality of atoms and statistical truth. He valued empirical consistency. If the math says he's a brain, but his experience says he's not, he'd likely question the *measure* or the *assumptions* about the "eternal equilibrium" state.

