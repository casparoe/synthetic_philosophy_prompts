      *   *The Stronger Argument:* Point out Hume's "Reverse Move." Usually, people think Determinism kills Responsibility. Hume argues Indeterminism (randomness) kills Responsibility. This is the strongest part and doesn't depend on the psychology-of-expectation bit.
