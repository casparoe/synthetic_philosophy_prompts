  {
    "classic": 0.333,
    "extreme": 0.001,
    "biased": 0.053,
    "incubator": 0.333
  }

  **Classic Sleeping Beauty:** Under the "Thirder" position, credence drops to 1/3 because there are three subjectively indistinguishable wakings (Heads-Mon, Tails-Mon, Tails-Tue), only one of which corresponds to Heads. However, this is genuinely contested by "Halfers," who argue that waking provides no new evidence about the coin, so credence should remain at the prior 0.5.

  **Extreme Sleeping Beauty:** This variant amplifies the Thirder logic, pushing credence toward 1/1001 since a Tails outcome generates vastly more observer-moments than Heads, making any random waking overwhelmingly likely to be Tails. Like the classic case, this is contested; Halfers maintain the credence should remain 0.5 regardless of the number of wakings, as the coin's physical propensity hasn't changed.

  **Biased-coin Sleeping Beauty:** Here, the prior probability (0.1) is updated by the likelihood ratio of the wakings (1 vs. 2), resulting in a credence of roughly 0.053 (1/19) under the Thirder framework. This is contested by Halfers who argue the credence should simply match the coin's bias (0.1) because the waking frequency is irrelevant to the truth of the coin toss.

  **The Incubator variant:** Structurally isomorphic to the classic case under the Self-Indication Assumption (SIA), this yields 1/3 because you are more likely to exist in a world with more observers (Tails creates two people). This is also contested; proponents of the Self-Sampling Assumption (SSA) argue the credence should remain 0.5 since you should reason as if randomly sampled from the actual observers without weighting by total population.
