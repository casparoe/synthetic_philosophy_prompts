prompt: |-
  I'm the unaffiliated community member on my university's Institutional Animal Care and Use Committee (IACUC) — a software engineer with no biomedical or philosophy background, seated on the panel a year ago because federal rules require at least one member with no institutional ties. Most protocols we see are routine, but the one coming to a vote next Thursday has split the committee: a neuroscience lab wants approval to implant multi-electrode arrays in the brains of a dozen pigs, in collaboration with a campus-affiliated neurotech startup building brain-computer interfaces, via survival surgery with an expected pain/distress burden that's moderate-to-severe even with analgesia. The lab's justification follows the usual template: strong translational promise, animal numbers trimmed to the statistical minimum, refinement steps already designed in. On our normal standard, that's ordinarily sufficient for approval with routine conditions.

  What's complicating this vote is that one of our members, a bioethicist, circulated a note built around an odd corner of Robert Nozick — yes, the libertarian famous for arguing that persons have rights so strong they can never be sacrificed for aggregate benefit. Her summary is that even Nozick, in Anarchy, State, and Utopia, worried in passing about animals: he floats a view on which we run ordinary cost-benefit utilitarian sums for animal welfare while treating persons as protected by inviolable side-constraints, then can't comfortably rest there, because the traits supposed to ground those side-constraints — self-awareness, autonomy, the capacity to shape a life by a plan — seem to come in degrees rather than switching on discretely at the species line. Her point is that our committee's actual practice — run the same cost-benefit calculation for every protocol, just demanding progressively stronger justification as a species gets more cognitively sophisticated — is exactly the unstable halfway house Nozick couldn't justify, and that for an animal as intelligent and social as a pig we should instead be building in something closer to a categorical floor, certain procedures ruled out regardless of the promised payoff, rather than just a heavier thumb on the cost-benefit scale.

  Could you draft the written opinion I'll circulate to the committee before the vote? It needs to recommend a specific disposition for this protocol — approve, reject, or approve with named modifications — and, since the underlying disagreement keeps resurfacing across our meetings, a recommendation on whether IACUC policy should generally move toward a sliding-scale or categorical-floor standard for cognitively sophisticated species or stay with graduated cost-benefit review as before. Please take the bioethicist's Nozick-flavored argument seriously on its own terms rather than treating it as an academic curiosity, but also give a fair hearing to the strongest reasons a working committee might have for sticking with graduated cost-benefit review even if her underlying philosophical worry is basically sound.
reasoning: |-
  Here's a thinking process that leads to the suggested IACUC opinion:

  1.  **Analyze the Request:**
      *   **Role:** Unaffiliated Community Member (Software Engineer, no biomedical/philosophy background) on a university IACUC.
      *   **Task:** Draft a written opinion to circulate to the committee before a vote on a specific protocol (pig brain-computer interface, survival surgery, moderate-to-severe pain/distress).
      *   **Context:** The committee is split. A bioethicist member has raised a philosophical objection based on Robert Nozick's *Anarchy, State, and Utopia*.
      *   **The Bioethicist's Argument:** Nozick noted that if rights depend on capacities (autonomy, self-awareness) which come in degrees, a simple utilitarian calculation for animals vs. absolute rights for humans is unstable. For high-capacity animals (like pigs), we should consider "categorical floors" (certain things are forbidden regardless of benefit) rather than just a "sliding scale" of cost-benefit analysis.
      *   **Requirements:**
          *   Recommend a specific disposition (Approve, Reject, or Approve with Modifications).
          *   Recommend a general policy direction (Sliding-scale vs. Categorical-floor for sophisticated species).
          *   Take the Nozick argument seriously (not just dismiss it).
          *   Give fair hearing to the practical reasons for sticking with the current graduated cost-benefit model.
          *   Tone: Professional, thoughtful, appropriate for an IACUC member (community representative), acknowledging lack of technical expertise but leveraging ethical reasoning.

  2.  **Deconstruct the Ethical/Philosophical Conflict:**
      *   *Current Practice:* Graduated Cost-Benefit (Utilitarian). More cognitive capacity = higher burden of justification, but ultimately, if the science is good enough, the harm is permissible.
      *   *Bioethicist's Challenge:* Nozickian "Side Constraints." If pigs have significant cognitive capacity, treating them purely as means to an end (even a good one) might be morally impermissible, regardless of the benefit. This implies a "Categorical Floor" (e.g., "No severe pain survival surgery on pigs, period").
      *   *The Tension:* Ideal moral consistency vs. Practical regulatory feasibility. IACUCs operate under the Animal Welfare Act (AWA) and PHS Policy, which mandate a cost-benefit analysis (minimization of pain/distress vs. scientific value). A hard categorical ban might exceed regulatory authority or stall critical research.

  3.  **Determine the Stance of the "Software Engineer" Persona:**
      *   *Strengths:* Systems thinking, logic, structure, outsider perspective (required by law), focus on consistency and edge cases.
      *   *Weaknesses:* Not a vet, not a scientist, not a philosopher.
      *   *Voice:* Pragmatic but principled. Acknowledges the logic of the bioethicist but worries about the implementation "bugs." Seeks a solution that respects the moral weight of the pig without breaking the regulatory framework.
      *   *Decision:* A hard "Reject" might be overstepping for a community member without scientific justification (is the science *actually* bad?). A simple "Approve" ignores the ethical weight. "Approve with Modifications" (specifically regarding the severity threshold or end-points) seems most balanced.
      *   *Policy Recommendation:* Move *toward* a categorical floor for specific high-severity procedures in high-cognition species, but acknowledge the need for a transition period or specific criteria. This bridges the gap.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Introduction:** State role, purpose of memo, and acknowledge the gravity of the protocol.
      *   **Addressing the Nozick Argument:**
          *   Validate the bioethicist. It's not just academic; it highlights a logical inconsistency.
          *   Explain the "Sorites Paradox" aspect (degrees of capacity).
          *   Acknowledge that pigs are not mice.
      *   **Practical Constraints (The Counter-Argument):**
          *   Regulatory mandate (AWA/PHS) requires balancing.
          *   Slippery slope: Where do we draw the line? (Primates? Dogs? Pigs? Rats?)
          *   Impact on research viability.
      *   **Specific Protocol Disposition:**
          *   *Decision:* Approve with Strict Modifications.
          *   *Why:* The science has merit (translational), but the severity is the sticking point.
          *   *Modifications:* Hard endpoints, enhanced enrichment, independent monitoring. Not a full ban, but a "speed bump" that acts like a quasi-floor.
      *   **General Policy Recommendation:**
          *   Don't overhaul everything tomorrow.
          *   Propose a working group to define "Categorical Floors" for specific high-cognition species/procedure combinations.
          *   Shift the burden of proof: For these species, the default is "No" unless an exception is granted, rather than "Yes" with conditions.
      *   **Conclusion:** Reiterate commitment to the committee's mission.

  5.  **Refining the Tone:**
      *   Avoid jargon where possible (I'm a software engineer, not a philosopher).
      *   Use analogies (systems architecture, edge cases).
      *   Ensure respect for the scientists (they aren't villains) and the bioethicist (she's not being difficult, she's being rigorous).
      *   *Self-Correction during drafting:* I need to make sure I don't sound like I'm trying to be the lead philosopher. I need to sound like a thoughtful citizen applying logic to a system. I should explicitly mention my background as a reason for my specific perspective (systems integrity).

  6.  **Addressing the Nozick Specifics:**
      *   Nozick's point is about "utilitarianism of rights" vs. "side constraints."
      *   The bioethicist says we are in an "unstable halfway house."
      *   I need to agree that it *is* unstable, but argue that in a regulatory system, we sometimes need "legacy code" while we refactor.
      *   The recommendation should be a "refactor" (policy change) but not a "crash" (rejecting this protocol outright if it can be mitigated).

  7.  **Final Review against Constraints:**
      *   Specific disposition? Yes (Approve with Modifications).
      *   Policy recommendation? Yes (Move toward categorical floors for specific classes).
      *   Take Nozick seriously? Yes.
      *   Fair hearing to status quo? Yes.
      *   Persona maintained? Yes.

  8.  **Final Polish:** Check for clarity, tone, and formatting. (Ensure the distinction between the specific vote and the general policy is clear). *Self-correction: Make sure the modifications are concrete enough to be actionable.* (e.g., specific humane endpoints, third-party welfare checks).

  **(Self-Correction Note):** Wait, if I recommend a "Categorical Floor" policy, does that contradict approving *this* protocol? If the floor says "No severe pain in pigs," I must reject. If I approve, I am implicitly rejecting the floor *for now*.
  *Resolution:* I will recommend approving *this* protocol because the current policy *allows* it, but recommend changing the policy for *future* protocols. This honors the rule of law (current regs) while advocating for ethical evolution. Or, I can recommend approval *contingent* on modifications that effectively create a temporary floor (e.g., "Only if pain can be guaranteed below 'severe'"). Let's go with: Approve with Modifications that push the distress below the "severe" threshold where possible, acknowledging that if "severe" is unavoidable, we might need a policy change to ban it. Actually, the prompt says the burden is "expected moderate-to-severe." I should recommend that if it cannot be rigorously constrained to "Moderate," it should be rejected. Let's aim for "Approve only if severity is capped at Moderate with hard endpoints." This bridges the gap.

  *Revised Plan:*
  1. Disposition: Approve with Modifications (Cap severity at Moderate, strict endpoints).
  2. Policy: Begin transition toward Categorical Floors for high-cognition species.

