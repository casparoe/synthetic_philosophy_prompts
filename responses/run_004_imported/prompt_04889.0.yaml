answer: |-
  The gear did not turn.

  Ibrahim held his breath. In his workshop, silence was usually a sign of peace, but today it was a sign of断裂 (fracture). He had wound the mainspring. He had released the escapement. By the Custom, by the *Adat* that had held the world together since the First Breath, the weight should have fallen, the teeth should have engaged, and the arm should have swept forward.

  It sat still.

  Ibrahim did not panic. Panic implied a betrayal, and the world could not betray you if it never promised you anything in the first place. Instead, he closed his eyes and whispered the only truth that mattered: *La hawla wa la quwwata illa billah.* There is no power, nor strength, except in God.

  He opened his eyes and looked at the brass gear. It was not broken. The metal was sound. The physics were not "failed," because there were no physics to fail. There was only the Habit. And for one tick of the discrete moment, the Habit had hesitated.

  Ibrahim picked up his quill and dipped it in ink. On the ledger beside him, under the column labeled *Continuity of Motion*, he made a mark. Not an X, but a circle. A gap.

  "Father?"

  His daughter, Mariam, stood in the doorway. She was holding a cup of tea. Steam rose from it in a perfect, twisting column. That was good. Heat was still rising. Water was still wet.

  "The gear," Ibrahim said, his voice steady. "It chose to rest."

  Mariam nodded, stepping carefully over the threshold. She didn't ask *why*. In a world of Occasionalism, *why* was a question for theologians, not engineers. Engineers only asked *if*. "Is it safe to cross the floor?"

  "For now," Ibrahim said. "The floor held my weight a moment ago. The Custom is strong today. But do not run."

  This was the burden of their science. In the old stories, the ones from the lands across the sea who believed in "Nature," men thought the world was a machine. They thought if you built a thing correctly, it *had* to work. They thought cause was chained to effect like a prisoner to a post. They believed fire *made* cotton burn.

  Ibrahim knew better. Fire did not make cotton burn. God created the fire, and God created the burning, and He joined them together out of mercy, so that life might have order. But He was not bound by it. If He willed, the fire would be cool. If He willed, the stone would float.

  " The Baker sent word," Mariam said, setting the tea down on a table that might, at any second, decide to become as soft as wool. "The ovens are lit, but the dough is not rising. He asks if we have seen a deviation in the Yeast Custom."

  Ibrahim frowned. He walked to the window. The city of Cordoba stretched out below, a tapestry of stone and light. It looked solid. But Ibrahim knew it was a painting being repainted a thousand times a second. If the Painter's hand trembled, the minaret would become dust. If His attention shifted, the river would flow uphill.

  "Yeast is delicate," Ibrahim said. "It relies on the Hidden Links. If the air does not *choose* to expand when heated, the bread stays flat."

  "Will it return?"

  "It usually does." Ibrahim turned back to his clock. "The Custom is deep. It is a river worn into stone. But we must remember the stone is not the river."

  He went back to work. This was the task of the *Muhaqqiq*—the Verifier. In a world without laws, someone had to track the Mercy. They couldn't predict the future, but they could gauge the mood of the Present. If the gears stopped, if the water refused to quench thirst, if shadows detached from feet, it was a sign. A warning to pray, to give charity, to loosen one's grip on the illusion of control.

  He picked up a piece of cotton and a flint. This was the standard test. The Al-Ghazali Protocol.

  He struck the flint. A spark landed on the cotton.

  For a heartbeat, nothing happened. The spark sat on the white fiber, bright and hot, but the cotton remained white.

  Ibrahim's heart hammered against his ribs. This was the terror that lived in the back of every throat. Not death, but *discontinuity*. If cause and effect unmoored completely, you could not plan. You could not love, because you could not trust that your embrace would be felt. You could not build, because gravity was just a suggestion.

  Then, the blackness spread. The cotton blackened. Smoke curled up. The burning was created.

  Ibrahim exhaled. "The Link holds."

  "But for how long?" Mariam asked. She was watching the steam from her tea. "The Baker says he cannot promise bread for tomorrow."

  "Tell him to bake anyway," Ibrahim said. "To prepare is an act of faith. To expect is an act of arrogance."

  He looked at his clock again. He wound the spring. He released the lever.

  *Click.*

  The gear turned.

  *Click.*

  It turned again.

  It was a miracle. That was the thing the "Nature" worshippers didn't understand. Every second that the gear turned was a miracle. They thought miracles were exceptions. Ibrahim knew the truth: *Consistency* was the miracle. The sun rising every morning was more astonishing than it stopping. To wake up and find the world exactly as you left it was the greatest gift of all.

  "Father," Mariam said softly. "Look."

  She pointed to the street below. A man had dropped a jar of oil. It hit the cobblestones.

  It did not shatter. It bounced. Like a ball.

  A murmur went through the crowd below. People stopped. They didn't scream. They didn't run. They simply paused, acknowledging the shift. A few bowed their heads. One man picked up the jar and hugged it to his chest, thanking the Will for the mercy of its integrity.

  "The Hardness Custom is fluctuating," Ibrahim noted, marking his ledger. *Stone: Variable. Ceramic: Resilient.*

  "Is it dangerous?"

  "It is inconvenient," Ibrahim corrected. "If stones become soft, bridges fall. If oil becomes solid, lamps go out. We adjust."

  He looked at his clock. It was measuring time, but time was not a river here. It was a string of beads. Snap the string, and the beads scatter. His clock was a prayer for the next bead to arrive.

  "I will go to the Baker," Ibrahim said, closing the ledger. "I will tell him to bake. Even if the dough does not rise, we eat the flat bread. We do not starve because we demand the world be a machine."

  "And the clock?"

  "Leave it."

  "It might not tick again."

  "Then it will be silent," Ibrahim said, picking up his cloak. "And we will listen to the silence."

  He walked out into the street. The air felt cool against his skin, but he knew the coolness was not a property of the air. It was a gift given fresh in this moment. He walked carefully, not testing the ground, but trusting it while it lasted.

  He passed a group of children playing. They were tossing a stone. One child threw it high. For a terrifying second, at the apex of the arc, the stone hung suspended. It forgot to fall.

  The children watched it, waiting.

  Ibrahim stopped. He watched the stone. He did not pray for it to fall; he prayed for the Will to be clear.

  Then, the stone dropped. It hit the dirt with a dull thud. The children cheered, not because gravity had returned, but because the Game was allowed to continue.

  Ibrahim smiled. They understood. They were the true scientists of this world. They knew that the only law was Love, and the only custom was Mercy.

  He reached the bakery. The heat from the ovens washed over him. It was fierce. It was real. It was not necessary.

  The Baker looked at him, flour on his hands, eyes wide. "The dough," he whispered. "It is... stubborn."

  "Bake it," Ibrahim said.

  "It will be stone."

  "Then we will have stone-bread," Ibrahim said. "And we will break our teeth, or we will not. But we will not pretend we are owed softness."

  The Baker nodded. He put the trays in. He closed the iron door.

  They waited. The Custom of Time passed. Moments stacked upon moments, each one a separate creation, a separate gift.

  Finally, the Baker opened the door.

  The smell hit them. Yeast. Wheat. Fire.

  The bread had risen.

  The Baker let out a sob of relief, reaching for a loaf. Ibrahim caught his wrist.

  "Careful," Ibrahim said. "The Heat may still be in the Habit of Burning."

  The Baker paused. He took a cloth. He touched the bread. It was warm. It did not burn his hand.

  Ibrahim took a loaf. He broke it open. The steam escaped, twisting into the air, obeying the Custom of Rising.

  He took a bite. It nourished him.

  It did not *have* to. That was the point.

  "Eat," Ibrahim said to the Baker. "Today, the world is kind."

  "And tomorrow?"

  Ibrahim looked at the bread in his hand, a miracle of continuity. He thought of the gear that had stopped, the stone that had hovered, the oil that had bounced.

  "Tomorrow," Ibrahim said, "we will see what is Willed."

  He ate the bread, tasting the sweetness of a universe that did not owe him a thing, and yet, gave him everything, one moment at a time.
