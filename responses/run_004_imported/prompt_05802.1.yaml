answer: |-
  This is a superb intersection of texts. As a fellow traveler in the space between biology and philosophy, I find your reading of the ambiguity in Darwin's "general good" to be precisely the fulcrum on which this debate turns. You have identified the crux: is Darwin positing a moral fact that evolution *discovered*, or a functional standard that evolution *created*?

  Working strictly from the reasoning in Chapter 4 of *The Descent of Man*, I argue that Darwin would not attempt to escape Street's dilemma by defending Realism. Instead, he would likely dissolve the dilemma by rejecting the premise of "independent evaluative truths" altogether. He would align himself with Street's "adaptive link account," though he would likely resist her characterization of it as "deflationary."

  Here is how Darwin would likely answer Street, based on the internal logic of Chapter 4.

  ### 1. Darwin's Metaethical Starting Point: Naturalistic Sentimentalism
  To answer Street, Darwin must first locate his own metaethical commitments. In Chapter 4, Darwin is explicit that the moral sense is not a divine implant or a rational apprehension of Platonic forms. It is derived from the **social instincts**.

  > "The following proposition seems to me in a high degree probable—namely, that any animal whatever, endowed with well-marked social instincts, the parental and filial affections being here included, would inevitably acquire a moral sense or conscience, as soon as its intellectual powers had become as well, or nearly as well developed, as in man." (*Descent of Man*, Ch. 4)

  For Darwin, the "moral sense" is the psychological conflict between a transient desire (e.g., hunger, fear) and a persistent social instinct (sympathy), mediated by intellect and memory. The "approval" or "disapproval" we feel is a natural sentiment, not a perception of a non-natural truth.

  **Response to Street:** Darwin would tell Street that her dilemma is constructed for a philosopher who believes moral truths exist *prior* to and *independent* of human psychology. Darwin does not hold this view. Therefore, he is not a target for the dilemma in the first place.

  ### 2. Addressing the First Horn: The "Luck" Objection
  Street's first horn asks: If there is no relation between selective pressures and independent moral truths, our beliefs are true only by luck.

  Darwin would reject the antecedent. He does not believe there is a gap between selective pressures and moral "truths" to begin with. In his framework, the "truth" of a moral judgment is its coherence with the social instincts that were selected for.

  If a tribe judges "courage in defense of the community" as good, it is not because they have lucked onto an independent truth. It is because their social instincts compel them to value the tribe's cohesion. There is no luck involved because there is no independent target they might have missed. The evaluative attitude *constitutes* the value.

  ### 3. Addressing the Second Horn: The "Tracking" and Explanatory Idleness Objection
  Street's second horn is the more dangerous one for a naturalist. It asks: If you say evolution tracked independent moral truths (e.g., "Welfare is Good"), isn't the "truth" explanatorily idle? Couldn't we explain the judgment purely by reproductive advantage?

  Here is where your insight regarding the "general good" is vital. Darwin writes:

  > "...the standard of morality, the criterion by which we judge of right and wrong, is the general good or welfare of the community."

  If Darwin claims this is an **independent truth** that guided evolution (Horn 2), he falls squarely into Street's trap of explanatory idleness. Why did we evolve to care about the welfare of the community? Because it aided survival. Do we need to posit that "Community Welfare is Objectively Good" to explain that? No. The reproductive advantage does all the work.

  However, Darwin's reasoning suggests he views the "standard" not as a cause of evolution, but as a **rationalization of the instinct**. He argues that as intellect develops, humans look back on their instincts. We see that actions aiding the tribe lead to satisfaction (via the social instinct) and actions harming it lead to dissatisfaction. We then generalize this into a "standard."

  **Darwin's Reply:** He would argue that the "moral fact" is not idle because it is not a separate entity. The "good" *is* the "welfare," and the "welfare" *is* the "survival of the tribe." In Darwin's naturalism, the moral property is identical to the natural property.
  *   **Street's Counter:** Even if Good = Welfare, why do we *believe* Good = Welfare? Because believing it helped us survive. The truth of the equation adds nothing to the explanation of the belief.
  *   **Darwin's Counter-Reply:** Darwin would likely shrug. For him, the *origin* of the belief (evolution) and the *validity* of the belief (it promotes welfare) are intertwined. He is not trying to justify morality to a skeptic; he is explaining its natural history. He would accept that the "moral fact" adds no causal power to the evolutionary story, because for Darwin, morality *is* the story of social instincts interacting with intellect.

  ### 4. Which Horn Does He Escape?
  Strictly speaking, Darwin escapes **neither horn** if we force him into the category of a **Moral Realist**. If we interpret his "general good" as a mind-independent truth, Street wins: it is either luck (Horn 1) or idle (Horn 2).

  However, Darwin escapes the **force** of the dilemma by occupying the position Street herself advocates: **Constructivism (or more accurately for Darwin, Sentimentalist Naturalism).**

  In Chapter 4, Darwin explicitly grounds the "ought" in the "is" of our psychological constitution:
  > "He who was led to yield to one instinct [the social one] would find that he had done his duty... he would generally feel dissatisfied if he had yielded to the other [selfish] instinct."

  The "duty" is constituted by the feeling of dissatisfaction. There is no external judge. Therefore:
  1.  **He rejects Horn 1:** There is no luck because there is no independent truth to miss.
  2.  **He rejects Horn 2:** There is no explanatory idleness because there is no independent truth to be idle. The "adaptive link" is the whole story.

  ### 5. The Ambiguity of the "General Good"
  You noted that "the general good" could be read as naturalist realism or deflationary story. Darwin's text suggests he sees them as the same thing.

  When Darwin says the standard is the "welfare of the community," he is not positing a metaphysical truth. He is observing a functional correlation. Tribes with members who *believed* in the welfare of the community outcompeted those who did not. The "truth" of the moral judgment is its **pragmatic success** in the struggle for existence.

  If Street asked him, "But is the welfare of the community *really* good, independent of its survival value?" Darwin would likely find the question unintelligible. In *Descent of Man*, "good" is defined by the approval of the social instinct, which was selected for its contribution to survival. To ask if it is "really good" beyond that is to ask if it conforms to a standard outside of nature. Darwin, the naturalist, recognizes no such standard.

  ### Conclusion
  If put to him directly, Darwin would answer Street by saying she has created a false dichotomy for a problem that does not exist in nature.

  He would argue that **morality is a natural phenomenon**, like digestion or bipedalism. We do not ask if digestion "tracks independent truths of nutrient processing." We ask if it functions to sustain the organism. Similarly, morality functions to sustain the community.

  Therefore, Darwin does not escape the horns by proving Realism; he escapes them by **ceding the ground to Street**. He would accept her "Adaptive Link Account" as the correct biological description of morality. He would only disagree with her philosophical conclusion that this is "deflationary." For Darwin, knowing that our morals are evolved social instincts does not diminish them; it explains their hold on us. As he writes, the moral sense is "the highest of all our attributes." That it arose from natural selection does not, for him, negate its authority—it grounds it.

  **Verdict:** Darwin is not a Realist in Street's sense. He is a proto-Constructivist/Naturalist. He escapes the dilemma by rejecting the existence of the "independent evaluative truths" that the dilemma requires as a target. He stands with Street on the biology, but without her sense of philosophical loss.
