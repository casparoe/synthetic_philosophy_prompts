prompt: |-
  I'm a backend engineer and somehow ended up on our company's incident review board. We had a nasty outage last week - the on-call engineer got paged, misread a dashboard, and sat on a bad deploy for almost two hours before rolling it back, which cost us real money (or at least thats what finance keeps saying). Half the board wants the postmortem to name his mistake as the root cause, put a note in his file, and make him personally redo training. The other half say that's scapegoating: the dashboard is notoriously confusing, literally nobody on the rotation has ever been properly trained on it, and pretty much any of us would've made the same call that night. I have to send out the memo that actually settles this, and "it's complicated" can't be the answer - I need one concrete recommendation, and it has to seriously grapple with the worry that if nobody's ever held personally responsible, people stop being careful. Can you draft that memo for me?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Backend Engineer on the Incident Review Board (IRB).
      *   **Task:** Draft a memo settling a dispute about a recent outage postmortem.
      *   **The Incident:** Bad deploy, on-call engineer misread a confusing dashboard, delayed rollback (2 hours), financial loss.
      *   **The Conflict:**
          *   Side A: Blame the individual (root cause = mistake), note in file, redo training.
          *   Side B: Blame the system (scapegoating), dashboard is confusing, no training provided, anyone would have done the same.
      *   **Constraints:**
          *   Must provide *one concrete recommendation* (no "it's complicated").
          *   Must address the concern that lack of personal accountability leads to carelessness.
          *   Tone: Professional, decisive, empathetic, systemic but accountable.

  2.  **Determine the Stance:**
      *   Modern DevOps/SRE best practices (Blameless Postmortems) strongly favor Side B. Punishing individuals for system failures discourages reporting, hides risks, and doesn't prevent recurrence.
      *   However, the prompt specifically asks to "grapple with the worry that if nobody's ever held personally responsible, people stop being careful." Ignoring this makes the memo unrealistic for a business context.
      *   *Decision:* The recommendation must be systemic (fix the dashboard/training) *but* must redefine accountability. Accountability isn't about punishment; it's about ownership of the fix. The individual shouldn't be punished, but they should be involved in the solution (not as punishment, but as learning).
      *   *Concrete Recommendation:* Implement a "Dashboard Usability & On-Call Readiness Audit" with a hard deadline, *and* revise the on-call training program. The individual is *not* disciplined, but the *process* that allowed the error is disciplined.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the severity of the incident and the difficulty of the discussion. State the purpose clearly.
      *   **The Decision (The "One Concrete Recommendation"):** This needs to be bold. No discipline for the engineer. Instead, a mandate to fix the tooling and training.
      *   **Rationale (Why this way?):**
          *   Explain *why* blaming the individual fails (fear, hiding errors).
          *   Explain *why* we still care about accountability (redefine it).
      *   **Addressing the "Carelessness" Concern:** This is crucial. How do we ensure people don't get sloppy?
          *   Answer: Accountability shifts from "punishment for error" to "ownership of improvement."
          *   Mechanism: The engineer involved helps fix the dashboard (turns the mistake into value).
      *   **Action Items:** Specific steps (Audit, Training, Rollback automation).
      *   **Closing:** Reiterate commitment to reliability and culture.

  4.  **Refining the Tone:**
      *   *Too soft:* "We understand mistakes happen..." (Sounds like letting them off the hook too easily).
      *   *Too hard:* "We must ensure this never happens..." (Implies punishment is coming).
      *   *Just right:* "Reliability is a system property, not an individual trait. We hold ourselves accountable by fixing the system."
      *   *Key Phrase:* "Accountability without Blame."

  5.  **Addressing the Specific Constraints:**
      *   *One Concrete Recommendation:* I need to make sure the recommendation stands out. Let's make it a "Systemic Remediation Plan" rather than just "fix the dashboard."
      *   *Grapple with Accountability:* I need a specific paragraph dedicated to "Why this isn't letting people off the hook."

  6.  **Self-Correction/Iterative Thought:**
      *   *Initial thought:* Maybe suggest the engineer leads the training update?
      *   *Correction:* That might feel like punishment. Better to say the *team* owns the fix, but the engineer's experience informs it.
      *   *Wait, the prompt asks for ONE concrete recommendation.* I should focus the main decision on the *policy change* regarding how we handle root causes, supported by the specific fix for this incident.
      *   *Actually, a better "One Recommendation" is the specific remediation plan for this incident, framed within the policy.* Let's go with: "Reject individual discipline; mandate tooling/training fix."
      *   *Refining the Accountability Argument:* The fear is "moral hazard." The counter-argument is that fear reduces cognitive performance. High standards are maintained through clear expectations and tooling, not threats.

  7.  **Final Polish:**
      *   Ensure the financial impact is acknowledged (don't minimize the cost).
      *   Ensure the engineer's experience is validated (it was confusing).
      *   Make sure the "Next Steps" are actionable.

  8.  **Drafting the Content (Mental Outline):**
      *   Subject: Incident Review Decision - [Date/ID]
      *   Context: We lost money. It hurts.
      *   Decision: No disciplinary action. Root cause = Systemic.
      *   The "Why": Blame creates silence. Systems create reliability.
      *   The "Accountability" piece: We hold the *process* accountable. We require fixes.
      *   Action: Fix dashboard, update training, automate rollbacks.
      *   Closing: We expect high performance, supported by high-quality tools.

  9.  **Final Review against constraints:**
      *   One concrete recommendation? Yes (Adopt Blameless Postmortem Policy + Specific Fix).
      *   Grapple with accountability? Yes (Redefine it as ownership of fixes).
      *   Memo format? Yes.

  *(Self-Correction during drafting)*: I need to be careful not to sound like I'm ignoring the money lost. I need to emphasize that *this* decision is the best way to protect money in the long run.

  Let's write it.cw
answer: |-
  **TO:** Engineering Leadership, Incident Review Board, All Engineering Staff
  **FROM:** [Your Name], Incident Review Board
  **DATE:** October 26, 2023
  **SUBJECT:** Decision and Remediation Plan: Incident #4492 (Deployment Outage)

  **Executive Summary**

  Last week's outage resulted in significant service degradation and financial loss. The Incident Review Board (IRB) has completed its analysis. There is a divergence of opinion on whether the root cause was individual error or systemic failure.

  **The Decision:**
  The IRB has determined that **no disciplinary action will be taken against the on-call engineer.** The root cause is classified as **Systemic Tooling & Process Failure.**

  Our concrete recommendation is to **immediately halt all non-emergency deploys until the primary observability dashboard is refactored for clarity and the on-call training curriculum is updated.**

  **Rationale: Why This Is Not "Letting People Off the Hook"**

  We understand the concern that absolving individual responsibility may lower standards or encourage carelessness. We reject that premise. In complex systems, "human error" is almost always a symptom of a deeper vulnerability.

  1.  **Punishment Hides Risk:** If engineers fear that a mistake during a high-stress incident will result in a write-up, they will hesitate to declare incidents, delay calling for help, or hide near-misses. This increases the likelihood of future, larger outages.
  2.  **Accountability Redefined:** True accountability is not about punishment after the fact; it is about ownership of the fix. Holding the *individual* accountable for a confusing dashboard they did not build is unjust. Holding the *organization* accountable for putting an engineer in a position to fail is necessary.
  3.  **The "Carelessness" Countermeasure:** We maintain high standards not through threat of discipline, but through rigorous remediation. We are holding the *process* accountable. The requirement to fix the dashboard and training is mandatory, tracked, and has a hard deadline.

  **Remediation Plan (Action Items)**

  To ensure this incident yields tangible value and prevents recurrence, the following actions are required:

  1.  **Dashboard Usability Audit (Owner: Observability Team, Due: 2 Weeks):** The dashboard in question must be redesigned. Success criteria include a usability review by three engineers who were not involved in the incident. If a new hire cannot interpret the critical health metrics within 30 seconds, the design is not approved.
  2.  **On-Call Training Overhaul (Owner: SRE Lead, Due: 1 Month):** No engineer will be added to the primary rotation without completing the updated simulation training. This training must include "failure injection" scenarios where dashboards are ambiguous, teaching engineers how to verify data before acting.
  3.  **Automated Rollback Guardrails (Owner: Platform Team, Due: 1 Month):** We cannot rely on manual decision-making for rollback thresholds. We will implement automated canary analysis that triggers a rollback if error rates exceed X% within Y minutes, removing the burden of this specific decision from the on-call engineer.

  **Conclusion**

  We lost money last week. That is unacceptable. But punishing the engineer who stood on the front line of a system we built together will not recover those funds, and it will not prevent the next loss.

  We expect every engineer to be careful, diligent, and professional. In return, the company commits to providing tools that are safe, clear, and forgiving. We fix the system so the people can succeed.

  Please direct questions regarding this decision to the IRB.

  [Your Name]
  Incident Review Board
