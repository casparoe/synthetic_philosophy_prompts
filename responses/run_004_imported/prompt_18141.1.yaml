  *   If Rival hedges, they are playing a mixed strategy $\sigma_R$.
  *   My payoff for $M$ against $\sigma_R$ is $1$.
  *   My payoff for Mix $\{0.5 B, 0.5 W\}$ against $\sigma_R$ is $1.5$.
  *   So Marcus is definitely wrong here. The dominance holds against *any* strategy profile of the opponent, pure or mixed. I need to explain *why* he's wrong clearly (linearity of expectation).

  *(Self-Correction on Leah's "Real Strategies")*: Leah says "plenty of real strategies are effectively randomized." This is a strong point. A/B testing, audit rotations, etc. I should validate this.

  *(Missing Consideration)*: I'll focus on Risk Aversion. The payoffs are given as "points." If points = profit, variance matters. M has 0 variance. The mix has high variance. A risk-averse utility function $U(x)$ where $U(1) > 0.5 U(0) + 0.5 U(3)$ would save M. This is the only way M survives.

