      *   **Condition 1 (Intention):** The intention must be to save one's own life, not to kill the aggressor. (Killing as a means is problematic).
      *   **Condition 2 (Proportionality):** The act must not exceed what is necessary for defense (moderation). One cannot use more violence than needed.
      *   **Underlying Metaphysics:** The act must be good or indifferent in itself. Killing an innocent is never indifferent; killing an aggressor *in the context of defense* can be.

