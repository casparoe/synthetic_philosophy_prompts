answer: |-
  This is an exceptionally sharp question that cuts to the heart of why the modern secularization of the Doctrine of Double Effect (DDE) often feels unstable compared to its scholastic origins. Thomson's Loop Track case is indeed designed to show that the physical directness of the act (throwing a switch vs. pushing a man) is morally irrelevant compared to the causal role the victim plays (bystander vs. means).

  If we strip away the later four-condition checklists and return strictly to *Summa Theologica* II-II, q.64, a.7 ("Whether it is lawful to kill a man in self-defense?"), along with the surrounding context of q.64, Aquinas's framework does generate a determinate verdict on the Loop Track case. However, it likely yields a verdict of **impermissibility**, and the reasoning reveals that the "strain" contemporary philosophers feel is not a flaw in Aquinas's text, but a result of applying his distinctions outside the metaphysical context (innocence, aggression, public authority) that makes them coherent.

  Here is a reconstruction of how Aquinas would reason through the Loop Track case on his own terms.

  ### 1. The Precondition of Innocence vs. Aggression
  Before we even reach the distinction between *per se* and *praeter intentionem*, we must address the object of the act. Article 7 is specifically a defense of killing an **unjust aggressor**. It presupposes the target is someone threatening your life. In q.64, a.6, Aquinas establishes that it is never lawful for a private individual to kill an **innocent** person, even for the common good; that power belongs solely to public authority.

  In the Loop Track case, the man on the side track is innocent. He is not an aggressor; he is merely present. For Aquinas, this is a categorical barrier. You cannot apply the self-defense justification of a.7 to an innocent bystander, regardless of the causal structure. If you kill him, you are not repelling an unjust attack; you are destroying an innocent life.

  However, let us grant the premise of your seminar: that we are analogizing the "runaway trolley" to an "aggressive threat" to see if the *intentional* structure of a.7 holds up. Even if we bracket the innocence objection, Aquinas's analysis of intention in a.7 still condemns the Loop Track action.

  ### 2. The Order of Intention: *Per Se* vs. *Praeter Intentionem*
  In a.7, Aquinas argues that an act of self-defense can have two effects: the preservation of one's own life and the killing of the aggressor. He writes:

  > "Nothing hinders one act from having two effects, only one of which is intended (*voluntas*), while the other is beside the intention (*praeter intentionem*)... Accordingly, the act of self-defense may have two effects, one the saving of one's life, the other the slaying of the aggressor."

  He concludes that such an act is lawful only if the killing is *praeter intentionem* (beside the intention). The moral species of the act is determined by what is intended *per se*.

  **The Bystander Case:** In the standard bystander case (where the track does not loop), you intend to divert the trolley away from the five. The death of the one is a foreseen consequence of the trolley being on that track, but it is not the *mechanism* of salvation. The five are saved by the trolley being *elsewhere*. The one dies because the trolley is *there*. Aquinas could plausibly argue the death is *praeter intentionem* here, as the saving of the five does not causally rely on the death of the one.

  **The Loop Track Case:** Here, the causal structure changes. The five are saved *because* the trolley hits the man and is stopped by his body. If the man were not crushed, the trolley would loop and kill the five. Therefore, the crushing of the man is the **means** to the end of saving the five.

  For Aquinas, the will extends to the end *and* the means. As he argues in *ST* I-II, q.1, a.6, whatever is chosen as a means falls under the intention. If you will the end (saving the five), and the means (the man's body stopping the trolley) necessarily involves his death, then you will his death *per se*. It is no longer *praeter intentionem*. It is instrumentally intended.

  Aquinas writes in a.7 that it is unlawful to intend the killing of the aggressor (*occidere hominem per se intendere*). If it is unlawful to intend the killing of a guilty aggressor as a means to self-preservation, it is *a fortiori* unlawful to intend the killing of an innocent man as a means to save others. The Loop Track case forces the agent to intend the death of the one as the mechanism of rescue. Thus, on Aquinas's terms, the act becomes morally specified as "killing an innocent to save others," which is murder.

  ### 3. Voluntary "In Itself" vs. Voluntary "In Its Cause"
  You asked if Aquinas's broader treatment of voluntary action can do work the summary checklist cannot. It can. Modern DDE often relies on a psychological test: "Did you *feel* like you wanted him to die?" Aquinas relies on a metaphysical test of the will's orientation.

  In *ST* I-II, q.6, a.3, Aquinas distinguishes between what is voluntary *in itself* and what is voluntary *in its cause*.
  *   **Voluntary in its cause:** I do something (throw a switch) knowing it will cause a result (death), even if I regret the result.
  *   **Voluntary in itself:** I directly will the result as an end or a means.

  In the Loop Track case, the death is not merely voluntary *in its cause* (as a side effect of throwing the switch); it is voluntary *in itself* relative to the plan of salvation. Why? Because the plan is: "I will use this man's body to stop the trolley." The will rests upon the man's being-hit as the solution to the problem.

  Aquinas would argue that the agent makes the death voluntary *in itself* by incorporating it into the rational plan of action. The emotional reluctance of the agent ("I wish there were another way") is irrelevant to the moral species of the act. The will has ordered the death of the one toward the life of the five. This violates the order of charity and justice. The "strain" modern philosophers feel arises because they try to maintain that the death is "unintended" simply because it is regretted. Aquinas would say: if your plan fails without his death, his death is intended.

  ### 4. Proportionality and Moderation
  Finally, Aquinas adds a condition in a.7 regarding proportionality:

  > "And even if one's intention be proper... the act may be rendered unlawful, if the force used be not moderate (*debitus modus*)."

  He argues one must not use more violence than is necessary to repel the attack. In the Loop Track, is the force moderate?
  *   **Modern View:** 1 life < 5 lives. Proportionate.
  *   **Aquinas's View:** Proportionality is not merely numerical aggregation. It is about the *necessity* of the defense relative to the *right* of the defender. Since the defender (the switch-thrower) has no right to kill an innocent (a.6), no amount of "proportionality" can render the act moderate. The act is disproportionate because it violates the boundary of private authority.

  Even if we ignore the innocence constraint, Aquinas does not endorse a utilitarian calculus where the greater number automatically justifies the means. The "moderation" he speaks of is about repelling a threat, not maximizing survival statistics. Using a human being as a physical barrier (a tool) exceeds the moderation of defense; it turns the person into an instrument, which violates the natural order.

  ### Conclusion: Does the Framework Strain?
  To answer your specific question: **No, Aquinas's framework does not strain on the Loop Track case; it breaks it cleanly.**

  The strain is felt by *modern* interpreters who have detached the *per se/praeter intentionem* distinction from Aquinas's underlying commitments regarding:
  1.  **Innocence:** The absolute prohibition on private killing of innocents (a.6).
  2.  **The Will:** The understanding that means are intended, not just ends.
  3.  **Instrumentalization:** The prohibition on using a person as a tool for salvation.

  Thomson's Loop Track case successfully pressures the *modern* DDE checklist because that checklist often treats "intention" as a psychological state separable from the causal plan. It asks, "Did you *want* him to die?" allowing the agent to say "No."

  Aquinas asks, "Did you *choose* his death as part of your plan?" In the Loop Track, the answer is unequivocally "Yes." Therefore, for Aquinas, the Loop Track is morally identical to the Footbridge case, and both are impermissible. The physical distance (throwing a switch vs. pushing) is morally irrelevant because the *order of the will* is the same: in both, the death of the one is the means to the life of the five.

  So, while your professor was right that Double Effect is the thread connecting Aquinas to the Trolley Problem, the connection reveals that Aquinas would likely reject the permissibility of the standard Bystander case too, if it involves diverting a lethal threat onto an innocent who would otherwise be safe. For Aquinas, you cannot kill one innocent to save five innocents, regardless of whether you push them or throw a switch, because the death of the one is either intended as a means (Loop/Footbridge) or you are violating the prohibition against killing innocents (Bystander). The only case Aquinas might tolerate is one where the one man was already doomed (e.g., standing on the track where the trolley was already going), but that is a different case entirely.

  In short, the Loop Track doesn't break Aquinas; it exposes that the "intuition" that the Bystander case is permissible is what conflicts with Aquinas, not the other way around.
