answer: |-
  **The Cliff at Dawn**

  **Characters:**

  *   **ELENA:** An Ockhamist. She believes future contingents have a determinate truth value, defended via the "Thin Red Line" theory.
  *   **MARCUS:** A Supervaluationist. He believes future contingents are neither true nor false until settled, defended via branching time semantics.

  **Setting:** A windswept cliff overlooking a grey strait. It is just before sunrise. In the distance, through the mist, the dark shapes of two fleets are visible, drifting silently toward a convergence point.

  ***

  **ELENA:** (Pulling her coat tighter) Look at them. Silent. Deadly. If I say, "There will be a battle at noon," am I speaking nonsense?

  **MARCUS:** You're speaking grammar, not sense. The sentence is well-formed. But like Aristotle's sea battle, it lacks a truth value. It's a gap.

  **ELENA:** Come on, Marcus. It's either going to happen or it isn't. The world doesn't stutter. If the battle occurs, then my statement is true. If it doesn't, it's false. One of those states of affairs is the one that *will* obtain. Therefore, the statement corresponding to it is already true.

  **MARCUS:** That's the fatalist slide. You're conflating *what will happen* with *what is now true*. On my view, the future branches. From this moment, there is a set of possible continuations. In some, the admirals talk, the fleets disperse, and there is peace. In others, cannon fire. Since "There will be a battle" is true on some branches and false on others, it is not super-true. It is indeterminate.

  **ELENA:** But only one of those branches is *actual*. That's the Thin Red Line. Yes, the tree branches, but there is a privileged path through the thicket. The one we are on. The one that *will* be. My statement is true because it aligns with the Thin Red Line, even if we can't see which twig is red from here.

  **MARCUS:** And there's the scam. You've painted a line on the map and called it the territory. What metaphysical feature of *this* moment—the wind, the wood, the adrenaline in the sailors' blood—distinguishes the "battle" branch from the "peace" branch? Nothing. They are qualitatively identical up until the decision is made. So what makes your Red Line "privileged"? It's magic. You're smuggling determinism in through the semantics.

  **ELENA:** It's not magic, it's the nature of truth. Truth is correspondence. If the future is real, there is a fact of the matter. I'm not saying the present *causes* the battle. I'm not saying the past necessitates it. That's the distinction you're blurring. Accidental necessity applies to the past, not the future. The proposition "There will be a battle" can be true now without being *necessarily* true now.

  **MARCUS:** If it's true now, how is it not fixed? If I can't make it false, in what sense is it contingent?

  **ELENA:** You're confusing causal power with logical value. Suppose I freely choose to jump. It is true now that I will jump. Does that truth force my legs? No. My choice makes the truth true. The truth doesn't make the choice happen. The Thin Red Line isn't a cage; it's just the track record of what freedom *will* do. The truth value is fixed, but the causal chain remains open.

  **MARCUS:** "Open" how? If the truth value is already assigned, the book is already written. You're just telling the author he can hold the pen. Look, the advantage of supervaluationism is that it honors the openness. It says: right now, genuinely, nothing makes it the case that they fight. To say it's "already true" is to pretend the decision exists before the decider has decided.

  **ELENA:** But consider the retrospective. Let's fast forward. Noon comes. The cannons roar. The water turns red. Tomorrow, I say, "It was true yesterday that this would happen." You agree with me, don't you?

  **MARCUS:** I say it was *settled* yesterday.

  **ELENA:** No, you say more than that. You say, "We knew it was coming." If your gap theory holds, then yesterday the proposition was indeterminate. So today, if I say "It was true yesterday," I am lying. Because on your view, yesterday there was no truth to be had. You rob the past of its prophecy. You make our hindsight a lie.

  **MARCUS:** I make it accurate, not true in the bivalent sense. We can say, "The branch we are on was one where battle occurred." We don't need to claim that the battle was ontologically present in the past as a truth-maker. You're clinging to bivalence because you're afraid of vagueness. But the future *is* vague. It's a cloud of probabilities, not a single train on a track. Your Thin Red Line is a phantom limb. You feel it, but when you reach for it, there's nothing there but your own insistence.

  **ELENA:** And your "cloud" dissolves the moment we step into it. That's the problem with your view, Marcus. It works fine from the god's-eye view of the branching tree. But we live *in* the line. We experience the future as a singular destination. If I bet you a coin there will be a battle, and there is, I win. I don't say, "Ah, well, the bet was indeterminate, so let's split the pot." The world treats the future as determinate. My semantics matches the life we live.

  **MARCUS:** The world treats the *outcome* as determinate. Not the *prediction*. You're conflating the event with the description. When the ships collide, the collision is real. But the statement *before* the collision? That's a wager on which branch becomes actual. By calling it "true" now, you're pretending the wager has already been paid.

  **ELENA:** I'm pretending nothing. I'm acknowledging that time flows. The "actual" future isn't a label we paste on after the fact. It's the direction we are moving. If there is no fact of the matter about where we are going, then deliberation is meaningless. Why deliberate if all branches are equally real? I deliberate to ensure the Red Line is the one I want.

  **MARCUS:** You deliberate to *make* one branch actual! That's the point! If the Red Line is already there, waiting for you, your deliberation is just a performance. You're walking down a corridor that's already built. On my view, you are building the corridor as you walk. The lack of a truth value *is* the space for your freedom.

  **ELENA:** (Leaning over the railing, voice dropping) Look. The lead ships. They're turning.

  **MARCUS:** (Squinting) They're still in range for parley. The peace branch is still open.

  **ELENA:** It's open, but it's not the one that's *true*. There's a difference. The truth is the anchor; the possibility is the chain.

  **MARCUS:** The truth is the wreck; the possibility is the sea. Don't confuse the wreckage with the voyage.

  **ELENA:** If I'm right, then five minutes ago, it was already a fact that we'd be standing here watching this.

  **MARCUS:** If I'm right, five minutes ago, it was a fact that we *might* be standing here. And that's enough to save us from fate.

  **ELENA:** It's not enough to save logic.

  **MARCUS:** And your logic isn't enough to save us from the guns.

  *(A low boom resonates across the water. A puff of white smoke erupts from the lead frigate, followed seconds later by the distant splash of a cannonball. The fleets are engaging.)*

  **ELENA:** (Softly) True.

  **MARCUS:** (Watching the smoke) Settled.

  *(They stand silent as the second volley fires, the sound arriving on the wind, neither turning to the other.)*
