      *   **Climax/Ending:** The fleets engage. The sensory reality overshadows the metaphysics. No resolution.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Critique:* Make sure Elena doesn't sound like a hard determinist. She needs to emphasize that *truth* is one thing, *causation* is another. This is the core Ockhamist move (Plantinga, Adams, etc.).
      *   *Critique:* Marcus needs to press the "metaphysical grounding" objection. If the TRL isn't grounded in the present, is it real?
      *   *Critique:* The "Retrospective" point is crucial. If the battle happens, did the proposition become true *then*, or was it true *before*? Supervaluationism struggles with "It was true that p" if "It will be that p" was indeterminate.
      *   *Setting:* Use the environment. The mist, the light, the silence of the ships.

  5.  **Drafting the Dialogue (Iterative Process):**
