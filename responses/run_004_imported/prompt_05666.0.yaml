          *   *Philosopher B (Supervaluationist):* Denies bivalence for future contingents. Truth requires agreement across all possible continuations (branches). Presses on what distinguishes the "privileged" branch if nothing present does.
      *   **Key Arguments to Include:**
          *   Ockhamist: Truth now doesn't mean settled now. Retrospective intuition (once it happens, it *was* true).
          *   Supervaluationist: What metaphysically picks out the "actual" future? The gap view honors openness better.
