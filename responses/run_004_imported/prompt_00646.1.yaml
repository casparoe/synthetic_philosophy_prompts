      *   *Nuance:* The "demonstration" in civil philosophy is about the *consequences of the covenant*, not necessarily the empirical success of a specific state.
      *   *Key Textual Support:* Reference *De Corpore* regarding "computation" and "names." Hobbes's logic is nominalist. Demonstration is about the consequences of names.
