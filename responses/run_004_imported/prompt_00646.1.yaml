answer: |-
  This is an excellent question that cuts to the heart of Hobbes's ambition to establish a "civil science." You have identified the precise fault line where most modern commentators locate the tension in Hobbes's system: the gap between his **nominalist logic of demonstration** (which works beautifully for geometry) and his **materialist psychology** (which seems to rely on empirical generalizations).

  For a graduate seminar, it is useful to structure the discussion around three moves: first, reconstructing Hobbes's internal logic regarding "making"; second, addressing your specific worry about the empirical premises of anthropology; and third, evaluating whether the equivocation you suspect is fatal or functional.

  ### 1. Reconstruction: How the Argument is Meant to Work

  To understand why Hobbes thinks "we make the commonwealth" secures demonstration, we must look at his definition of *scientia* (science) in *De Corpore*. For Hobbes, science is not about matching propositions to external reality (correspondence truth); it is about knowing the **consequences of names**.

  **The Criterion of Generation**
  Hobbes argues that we can only have certain knowledge of things where we know the "generation" (the cause of production).
  *   **In Geometry:** I define a circle. I construct it. I know its properties because I stipulated the rules of its generation. The truth is internal to the construction.
  *   **In Physics:** I observe a stone fall. I did not make the stone, nor do I know the intrinsic cause of gravity (which Hobbes attributes to the motion of the ether or similar hidden mechanisms). I can only hypothesize causes that *would* produce these effects. Thus, physics is hypothetical.

  **The Application to Civil Philosophy**
  Your worry is that the *matter* of civil philosophy (human beings) is natural, not artificial. Hobbes anticipates this. His argument relies on a distinction between the **natural man** and the **artificial person**.
  *   Hobbes concedes that the biological generation of men is natural (and thus indemonstrable in the strict sense).
  *   However, the **Commonwealth** (the *Civitas*) is not a natural organism; it is an "Artificial Man" (*Leviathan*).
  *   **The Construction:** The "making" refers specifically to the **Covenant**. When individuals mutually agree to transfer their rights to a Sovereign, they are performing a constructive act analogous to a geometer drawing a line.
  *   **The Consequence:** Because the authority of the Sovereign is created by this specific act of will (the covenant), the rights and obligations of the subjects are not discovered in nature (like the law of gravity); they are **instituted**. Therefore, we can demonstrate the consequences of that institution with the same certainty that a geometer demonstrates the consequences of a triangle.

  **Addressing the "Passions" Objection**
  You note that premises about passions look empirical. Hobbes would reply that his psychology is not inductive generalization but **resolutive-compositive**.
  *   He claims to resolve human behavior down to universal "endeavors" (*conatus*)—minute motions of appetite and aversion.
  *   He treats these not as contingent observations ("most men seem proud") but as universal laws of matter in motion applied to animals.
  *   Therefore, in Hobbes's view, the premises of civil philosophy are not empirical generalizations subject to falsification by counter-example; they are **definitions of human nature** derived from introspection (*Nosce Te Ipsum*), which he treats as universally accessible and certain.

  ### 2. The Charge of Equivocation

  You ask if Hobbes is trading on an equivocation between two senses of "making." The short answer is **yes**, but whether this is a *fallacy* or a *feature* depends on how you read his nominalism.

  **Sense A: Stipulative Construction (Geometry)**
  In geometry, the construction is **conceptual**. The geometer creates the object in the mind (or on paper) by definition. The object has no existence or properties outside the definition. The "making" is entirely within the control of the reasoner.

  **Sense B: Volitional Institution (Politics)**
  In civil philosophy, the construction is **volitional and historical**. The "making" of the commonwealth requires the concurrent wills of many distinct agents.
  *   **The Epistemic Gap:** The geometer knows the cause of the line because *he drew it*. The political philosopher (Hobbes) knows the cause of the commonwealth because *he understands the logic of the covenant*, but he did not necessarily draw the covenant himself. He is describing a construction performed by the citizens.
  *   **The Material Recalcitrance:** In geometry, the paper does not resist the pen. In politics, the "material" (human passions) often resists the "form" (the law). If humans do not behave as the theory predicts (e.g., if they value honor over self-preservation), the "demonstration" of political stability fails, even if the logic is valid.

  **Is it an Equivocation?**
  It is an equivocation on the **locus of control**.
  *   In geometry, the reasoner has total control over the subject.
  *   In politics, the reasoner has control over the *definitions* of right and law, but not over the *compliance* of the subjects.
  Hobbes tries to bridge this by arguing that the *obligation* to obey is demonstrable (because we authorized it), even if the *stability* of the state is contingent. He shifts the domain of demonstration from "the state will last forever" to "the sovereign has rightful authority."

  ### 3. Evaluation: Does the Argument Succeed?

  For your seminar, I suggest presenting the verdict as a split between **Normative Validity** and **Explanatory Certainty**.

  **Where it Succeeds (Normative Validity)**
  Hobbes's criterion successfully secures the **authority** of the sovereign against claims of "natural law" or divine right that exist independently of human will.
  *   By treating the commonwealth as a construction, Hobbes makes political obligation **immanent**. We obey not because God commands it or because it is "natural," but because *we made it*.
  *   In this sense, civil philosophy is demonstrable: *If* you covenant, *then* you are obligated. The consequence follows from the definition of the act. This protects his theory from Aristotelian teleology.

  **Where it Fails (Explanatory Certainty)**
  Your intuition is correct: the argument fails to secure the same **epistemic certainty** as geometry.
  1.  **The Anthropological Premises:** Even if Hobbes claims his psychology is deductive, it relies on the claim that "fear of death" is the dominant passion. This is a claim about the *nature* of natural bodies (humans), which, by Hobbes's own criterion in the passage, should be indemonstrable ("we know not the construction... but seek it from the effects"). Hobbes tries to have it both ways: humans are natural bodies (physics) but also the makers of the state (civil philosophy). He cannot have the "making" of the state guarantee certainty about the "behavior" of the makers.
  2.  **The Position of the Theorist:** In geometry, the theorist is the constructor. In *Leviathan*, the theorist is the **architect**, not the builder. The citizens are the builders. The architect can demonstrate what the building *ought* to be, but cannot demonstrate that the builders *will* build it correctly. This relegates civil philosophy to a mix of demonstration (the logic of sovereignty) and prudence (the management of passions).
  3.  **Historical Contingency:** A geometric construction is timeless. A covenant is a historical event. If the "making" is historical, our knowledge of it relies on testimony or memory, which Hobbes elsewhere admits is fallible (prudence, not science).

  ### Seminar Discussion Points

  To stimulate your seminar, you might pose these specific questions based on the passage:

  1.  **The "We" Problem:** In the passage, Hobbes says "we make the commonwealth ourselves." Who is the "we"? Is it the citizens (who act voluntarily) or the philosopher (who defines the concepts)? If it's the citizens, how can the philosopher claim *scientific* knowledge of their act?
  2.  **The Status of the Laws of Nature:** Hobbes calls the laws of nature (e.g., seek peace) "dictates of reason." Are these discovered (like physics) or constructed (like geometry)? If they are discovered in human nature, doesn't that slide civil philosophy back toward the "indemonstrable" side of his own line?
  3.  **The Function of the Distinction:** Is Hobbes's primary goal here epistemological (how we know) or political (where authority lies)? One could argue the distinction is less about securing certainty and more about **blocking rival claims**. By saying physics is indemonstrable, he undermines the Royal Society (Wallis) and Aristotelians who claim to know nature's secrets. By saying politics *is* demonstrable, he claims unique authority for the sovereign (and his own advice to the sovereign).

  ### Conclusion

  Your suspicion is well-founded. Hobbes is indeed equivocating, but perhaps strategically. He treats the **normative structure** of the commonwealth as geometric (stipulative, demonstrable) to secure absolute obligation, while treating the **anthropological substrate** as mechanistic (causal, predictable) to secure stability.

  The argument succeeds in establishing that political authority is **artificial and authorized**, but it fails to establish that political science can predict outcomes with geometric certainty. The "construction" of the commonwealth is not a drawing on a page; it is a fragile agreement among fearful animals. Hobbes's genius lies in trying to convince us that the former can control the latter.

  **Recommended Secondary Literature for the Seminar:**
  *   **Quentin Skinner,** *Reason and Rhetoric in the Philosophy of Hobbes* (on the rhetorical function of the "science" claim).
  *   **Tom Sorell,** *Hobbes* (on the tension between materialism and geometry).
  *   **Kinch Hoekstra,** "The de Facto Turn in Hobbes's Political Philosophy" (on how Hobbes handles the gap between theory and practice).
  *   **Daniel Garber,** "Hobbes and the Traditions of Natural Philosophy" (for the physics/math context).

  This passage is a perfect entry point to discuss whether Hobbes is a precursor to modern positivism or a unique hybrid of Euclidean logic and Machiavellian realism.
