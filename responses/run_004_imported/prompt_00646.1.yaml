  3.  **Address the User's Specific Objection:**
      *   *Objection:* The *foundations* of civil philosophy (psychology, passions) look empirical, like physics. If the anthropology is empirical, the politics built on it is hypothetical, not demonstrative.
      *   *Key Distinction:* Hobbes distinguishes between the *matter* (men) and the *form* (the commonwealth).
      *   *Hobbes's Move:* He isn't claiming we create human nature (that would be physics/biology). He is claiming we create the *artificial person* (the State/Leviathan).
      *   *The "Construction":* The act of covenanting is the construction. The definitions of the rights and laws are stipulative.

  4.  **Reconstructing the Argument (The "Best Reconstruction"):**
      *   *Step 1: The Definition of Science.* Science = knowledge of consequences from defined names/propositions (nominalism).
      *   *Step 2: The Condition of Demonstration.* To demonstrate, you must know the generation of the subject.
      *   *Step 3: Application to Geometry.* We define points/lines and construct figures. We know exactly what they are because we made the definitions.
