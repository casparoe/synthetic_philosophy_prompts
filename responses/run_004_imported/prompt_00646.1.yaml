          *   *The "We":* In geometry, the individual geometer constructs the figure. In politics, "we" construct the state collectively. But the theorist (Hobbes) is describing this, not doing it. The theorist is in the position of the physicist observing a body, not the geometer drawing a line.
          *   *Equivocation:* There is a sense in which "making" is different. Geometric making is conceptual/stipulative. Political making is historical/volitional.
      *   *Scholarly Context:* Mention Skinner, Martinich, or Sorell if relevant (conceptually). The shift from *De Cive* to *Leviathan* emphasizes the "Artificial Person."

  6.  **Drafting the Response:**
