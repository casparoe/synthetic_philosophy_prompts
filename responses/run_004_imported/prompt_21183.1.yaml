      *   *Check:* The "commercial" aspect. Rousseau emphasizes that the playwright needs *applause*. Applause comes from shared sentiment. If the shared sentiment is corrupt, the play must be corrupt to succeed.
      *   *Tone Check:* Ensure I don't sound like I'm agreeing with Rousseau, but accurately representing *his* view. (e.g., "Rousseau argues..." not "It is true that...")

  5.  **Drafting the Response (incorporating the above):**
