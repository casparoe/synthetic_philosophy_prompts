prompt: |-
  I've been working through the literature on dynamic choice and diachronic consistency for a dissertation chapter, and I keep running into a conceptual knot I'd like help untangling. Edward McClennen's resolute choice theory and the updateless decision theory (UDT) developed in the AI safety/rationalist literature (Yudkowsky, Hintze, and others) both seem motivated by a similar worry: that agents who revise their plans in light of new information can be exploited across time (money-pumped, or made to defect against their own past selves) in ways that a suitably "committed" agent would avoid. Both frameworks recommend sticking to a plan formed at an earlier point even when, from a later vantage point, deviating looks locally rational.

  That said, I suspect the two views rest on quite different background commitments. McClennen's resolute choice is pitched within a broadly Kantian, agent-centered picture of practical rationality, and doesn't obviously require any revisionary metaphysics of decision-making -- it just asks the agent to treat her earlier self's plan as binding. UDT, by contrast, is typically formulated in terms of an agent selecting a global policy (a function from observations/inputs to actions) prior to any updating at all, which seems to presuppose a much more radical picture on which later "selves" or epistemic states have no independent standing to deviate from the policy chosen "at the beginning of time." I'd like to get clearer on whether this difference is substantive or merely a difference in framing. Could you compare resolute choice theory and updateless decision theory in some depth -- particularly how each would handle something like the toxin puzzle or Newcomb-like cases such as counterfactual mugging -- and say whether UDT should be understood as a formalization (or descendant) of resolute choice, or whether it's making a genuinely different theoretical claim about the nature of rational agency and the unit of rational evaluation (acts vs. policies vs. dispositions)?
reasoning: |-
  Here's a thinking process that leads to the comparison between Resolute Choice and Updateless Decision Theory:

  1.  **Deconstruct the User's Request:**
      *   **Topic:** Dynamic choice, diachronic consistency, exploitation over time.
      *   **Key Theories:** Edward McClennen's *Resolute Choice* vs. *Updateless Decision Theory* (UDT).
      *   **Core Question:** Are these substantively different or just different framings? Is UDT a formalization of Resolute Choice, or does it make a different claim about rational agency (acts vs. policies vs. dispositions)?
      *   **Specific Cases to Analyze:** Toxin Puzzle, Newcomb-like cases (Counterfactual Mugging).
      *   **Underlying Concern:** Metaphysics of decision-making, agent-centeredness, bindingness of past plans.
      *   **Context:** Dissertation chapter (needs academic rigor, nuance, and clarity).

  2.  **Initial Assessment & Hypothesis:**
      *   *Similarity:* Both reject "Sophisticated Choice" (dynamic consistency via backward induction) in favor of sticking to an ex-ante optimal plan even when ex-post incentives diverge. Both aim to avoid dynamic inconsistency/exploitation.
      *   *Difference:* McClennen is normative/philosophical (how *should* a rational agent deliberate?). UDT is formal/computational (how should an *algorithm* select outputs to maximize utility?). McClennen relies on a psychological/volitional capacity for resolution. UDT relies on logical correlation/counterfactual reasoning about the agent's source code.
      *   *Hypothesis:* They are *functional equivalents* in many decision problems but rest on *divergent metaphysical and normative foundations*. UDT is not merely a formalization of Resolute Choice; it's a different kind of beast (logical vs. volitional).

  3.  **Drafting the Comparison - Section by Section:**

      *   **Introduction:** Acknowledge the insight. Yes, they share a motivation (avoiding dynamic inconsistency), but their mechanisms and ontologies differ.
      *   **Core Mechanism:**
          *   *Resolute Choice (RC):* Willpower/Normative Commitment. The agent *chooses* to bind themselves. It's a feature of the deliberative process.
          *   *UDT:* Logical Correlation/Policy Selection. The agent *is* a policy. There is no "later self" to deviate; there is only the output of the function. It's a feature of the decision algorithm.
      *   **Case Study 1: The Toxin Puzzle (Kavka):**
          *   *Scenario:* Get money if you *intend* to drink toxin tomorrow. No reason to drink once you have money.
          *   *RC:* You resolve to drink. Because you are resolute, you follow through. The resolution makes the intention sincere.
          *   *UDT:* You select a policy `If offered money, intend to drink; If tomorrow, drink`. Since the predictor simulates you, selecting this policy gets the money. The "tomorrow" action is part of the same logical computation.
          *   *Nuance:* RC requires a psychological feat. UDT requires recognizing logical identity.
      *   **Case Study 2: Counterfactual Mugging (Parfit/Yudkowsky):**
          *   *Scenario:* Omega flipped a coin. Heads: Ask for $100. Tails: Give you $10,000 *if* you would have given $100 on Heads. Coin is Heads. Should you pay?
          *   *RC:* Harder. Ex-ante you want to pay. Ex-post (knowing it's Heads), paying costs $100 with no gain. Resolute choice says "stick to the plan." But *why*? The normative force is strained because the benefit is counterfactual.
          *   *UDT:* Straightforward. Expected utility is calculated over the policy *before* knowing the coin flip. The policy "Pay if Heads" yields high EV. Knowing the coin is Heads is just an observation input; the policy is already fixed.
          *   *Key Distinction:* UDT handles the *counterfactual* dependence better because it treats the decision as a logical fact, not a temporal commitment.
      *   **Metaphysics of Agency (The "Substantive Difference"):**
          *   *RC:* Temporal extendedness. Selves are distinct but linked by will. Diachronic rationality is a virtue.
          *   *UDT:* Atemporal/Logical. The "agent" is the algorithm. Time is just an input variable. No "selves," just instances of the same function.
          *   *Implication:* RC is for humans (who need to cultivate resolution). UDT is for AI (or idealized agents where source code is visible/fixed).
      *   **Is UDT a Formalization of RC?**
          *   No. RC is about *overriding* local preferences via will. UDT is about *redefining* the locus of choice so local preferences don't arise as independent variables.
          *   RC accepts the tension between ex-ante and ex-post. UDT dissolves the tension by denying the independence of the ex-post perspective.
      *   **Conclusion:** They converge on action recommendations in many cases but diverge on *why* and *how*. For a dissertation, this distinction is crucial.

  4.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *Critique:* Did I represent McClennen fairly? McClennen emphasizes that resolute choice is *rational*, not just willpower. It's about constituting oneself as a temporally extended agent.
      *   *Critique:* Is UDT really "atemporal"? It's "updateless," meaning it doesn't condition on observations when evaluating expected utility, but it conditions on them for action selection. Need to be precise about "policy vs. act."
      *   *Connection:* Mention David Gauthier (Constrained Maximization) as a bridge? Maybe too much detail. Stick to McClennen vs. UDT.
      *   *Key Insight:* RC is *internalist* (about the agent's psychology). UDT is *externalist/functionalist* (about the agent's input-output mapping in a logical space).

  5.  **Final Polish:**
      *   Ensure tone is appropriate for a dissertation context (scholarly, precise).
      *   Structure with clear headings.
      *   Make sure the "Toxin" and "Counterfactual Mugging" analyses are distinct.
      *   Address the "unit of evaluation" question explicitly (Acts vs. Policies).

  6.  **Writing the Response:** (Proceeding to generate output based on these thoughts.)
answer: |-
  This is an exceptionally sharp observation, and it cuts to the heart of a significant tension in contemporary decision theory. You are correct that **Resolute Choice (RC)** and **Updateless Decision Theory (UDT)** converge on many extensional recommendations (i.e., they often tell the agent to do the same thing), particularly in cases where dynamic inconsistency leads to exploitation. However, your suspicion is also correct: the convergence is largely functional, while the underlying metaphysics, normative foundations, and accounts of agency are substantively divergent.

  For a dissertation chapter, it is crucial to distinguish between **diachronic self-binding via volition** (McClennen) and **acausal policy selection via logical correlation** (UDT). Below is a detailed comparison structured to help you untangle this conceptual knot.

  ---

  ### 1. The Core Mechanism: Volition vs. Logical Identity

  The primary difference lies in *how* each theory bridges the gap between the ex-ante plan and the ex-post action.

  **McClennen's Resolute Choice:**
  *   **Metaphysics:** Accepts the standard temporal ontology. There is a "Past Self" (planner) and a "Future Self" (executor). These are distinct temporal stages of the same agent.
  *   **Mechanism:** *Resolution.* The agent cultivates a psychological/normative capacity to treat the past plan as binding. When the Future Self faces a temptation to deviate (because the local incentives have changed), the capacity for resolution overrides the local preference.
  *   **Normative Force:** The rationality of resolution is grounded in the value of **temporal integrity**. To be a rational agent *just is* to be capable of carrying out plans over time. Deviating is a failure of agency, not just a calculation error.
  *   **The "Knot":** RC admits the tension. The Future Self *wants* to deviate but *chooses* not to. It is a triumph of will over local incentive.

  **Updateless Decision Theory (UDT):**
  *   **Metaphysics:** Functionalist/Computational. The agent is not a temporal sequence of selves but a **policy** (a function from observations to actions). Time is merely an input variable to the function.
  *   **Mechanism:** *Logical Correlation.* UDT does not ask the agent to "stick" to a plan against their current will. Instead, it posits that the "current decision" and the "past prediction" are logically correlated instances of the same algorithm. When you decide now, you are effectively selecting the output of the algorithm for all instances, including counterfactual or past simulations of yourself.
  *   **Normative Force:** The rationality of updatelessness is grounded in **expected utility maximization over policies**. There is no "tension" to overcome because the ex-post perspective is not granted independent normative standing to evaluate utility.
  *   **The "Knot":** UDT dissolves the tension. The Future Self does not "want" to deviate because the Future Self recognizes that its decision procedure is logically identical to the Past Self's. Deviating is not a failure of will; it is a type error.

  ### 2. Case Study Analysis

  To see where the theories diverge, we must look at how they handle specific puzzles.

  #### A. The Toxin Puzzle (Kavka)
  *Scenario:* You are offered \$1M tonight if you form the intention to drink a harmless but painful toxin tomorrow. Once you have the money, you have no reason to drink the toxin.

  *   **Resolute Choice:** McClennen argues a resolute agent can form the intention sincerely because they know their future self will be bound by resolution. The resolution makes the intention possible.
      *   *Critique:* Critics (like Bratman) argue this is psychologically mysterious. How can I intend to do X tomorrow if I know that tomorrow, all reasons for X will be gone? RC requires a robust theory of willpower that some find implausible for idealized rationality.
  *   **UDT:** UDT solves this easily. The agent selects a policy: `If offered deal, Accept & Drink`. Omega (the predictor) simulates this policy. If the policy outputs "Accept & Drink," Omega pays. The agent gets the money and drinks.
      *   *Difference:* UDT doesn't require "willpower." It requires recognizing that the prediction depends on the *algorithm*, not the *momentary state*. The "tomorrow" action is part of the same logical object as the "tonight" prediction.

  #### B. Counterfactual Mugging
  *Scenario:* Omega flipped a fair coin.
  *   **Heads:** Omega asks you for \$100.
  *   **Tails:** Omega gives you \$10,000, *if and only if* Omega predicts you would have given \$100 had the coin come up Heads.
  *   **Reality:** The coin came up Heads. Omega is asking for \$100.

  *   **Resolute Choice:** This is a stress test for RC. Ex-ante, you want to commit to paying. Ex-post (knowing it's Heads), paying costs \$100 and gains nothing (the Tails world is counterfactual and gone).
      *   *RC Verdict:* A resolute agent pays. They treat the ex-ante plan as binding.
      *   *The Strain:* The normative force is weak here. Why should the actual self sacrifice for a counterfactual self? RC relies on the agent valuing their own diachronic consistency as a good in itself. It feels like "throwing good money after bad" unless one accepts a very strong view of plan-bindingness.
  *   **UDT:** This is UDT's home turf.
      *   *UDT Verdict:* Pay the \$100.
      *   *Reasoning:* You do not calculate EV based on "The coin is Heads." You calculate EV based on the policy `If Heads, Pay; If Tails, Accept`.
      *   *Policy EV:* (0.5 * -\$100) + (0.5 * +\$10,000) = +\$4,950.
      *   *Difference:* UDT does not view the Tails world as "gone." Because the decision is updateless, the logical fact of your policy determines the outcome in the Tails branch, even if you observe Heads. RC treats the Tails branch as a past opportunity to bind oneself; UDT treats it as a logically accessible component of the expected utility calculation.

  ### 3. Is UDT a Formalization of Resolute Choice?

  **Short Answer:** No. UDT is better understood as a **dissolution** of the problem RC tries to **solve**.

  **1. The Unit of Evaluation:**
  *   **RC:** Evaluates **Acts** within a temporal sequence, but adds a normative constraint that earlier plans bind later acts. The unit of agency is the *temporally extended person*.
  *   **UDT:** Evaluates **Policies** (functions). The unit of agency is the *algorithm*.
  *   **Implication:** RC preserves the distinction between the planner and the executor but mandates cooperation. UDT denies the independence of the executor. In UDT, there is no "later self" to be bound; there is only the current execution of the source code.

  **2. The Role of Information:**
  *   **RC:** The agent *has* new information (e.g., "I have the money," "The coin is Heads") but chooses to ignore its normative force regarding the plan. This is **informationally rich but normatively constrained**.
  *   **UDT:** The agent *uses* the information to select the action (e.g., "I see Heads, so I execute the 'Pay' branch"), but does not use it to *update the prior* for the decision calculation. This is **informationally updateless**.
  *   **Substantive Difference:** RC admits that new information changes incentives but insists on overriding them. UDT claims that rational decision-making *should not condition on indexical observations* when evaluating the goodness of a policy. This is a claim about probability and logic, not just willpower.

  **3. Metaphysical Commitments:**
  *   **RC:** Compatible with standard human psychology (with effort). It fits a Kantian or Aristotelian virtue ethics framework where rationality involves self-constitution over time.
  *   **UDT:** Requires a **Parfitian reductionism** or a computationalist view of identity. For UDT to work, there must be a logical fact of the matter about "what you would do" that is accessible to predictors (Omega) and binding on your future self. This presupposes that agents are transparent functions, which is a much stronger metaphysical claim than McClennen's.

  ### 4. Implications for Your Dissertation

  If you are arguing about the nature of rational agency, here is the distinction you should draw:

  1.  **Resolute Choice is a theory of *Diachronic Rationality*:** It addresses how an agent maintains identity and rationality *through time*. It accepts the reality of changing preferences and the temptation of dynamic inconsistency. It is a **normative patch** applied to Causal Decision Theory (CDT) to save it from exploitation.
  2.  **UDT is a theory of *Acausal/Logical Rationality*:** It addresses how an agent maximizes utility in a universe where their decision algorithm is logically correlated with other events (predictions, simulations, twin agents). It is not a patch; it is a **replacement** for the standard causal framework.

  **The Verdict:**
  UDT should not be understood merely as a formalization of Resolute Choice. While they are **extensional allies** (they agree on the action in most Newcomb/Toxin cases), they are **intensional rivals**.

  *   **McClennen** saves the agent from themselves by strengthening the **Will**.
  *   **UDT** saves the agent from exploitation by redefining the **Agent**.

  For a dissertation, this distinction is vital. If you adopt RC, you are making a claim about human psychology and the normative value of commitment. If you adopt UDT, you are making a claim about the logical structure of decision problems and the ontology of computation. RC says, "You should stick to your plan." UDT says, "You *are* your plan."

  ### Summary Table for Clarity

  | Feature | Resolute Choice (McClennen) | Updateless Decision Theory (UDT) |
  | :--- | :--- | :--- |
  | **Primary Motivation** | Avoid dynamic inconsistency/exploitation over time. | Maximize expected utility in logical/Newcomb problems. |
  | **Unit of Agency** | Temporally extended person (Selves). | Algorithm / Policy (Function). |
  | **Mechanism** | Volitional commitment / Resolution. | Logical correlation / Counterfactual reasoning. |
  | **View of Future Self** | Distinct stage that must be bound. | Same function instance; no independence. |
  | **Handling Info** | Ignores normative force of new info. | Uses info for action, not for policy evaluation. |
  | **Metaphysics** | Compatible with standard temporal ontology. | Requires computational/logical identity. |
  | **Toxin Puzzle** | Solved by sincerity of resolution. | Solved by policy selection. |
  | **Counterfactual Mugging** | Strained (why pay for counterfactual gain?). | Natural (policy EV includes counterfactuals). |

  ### Recommendation for Your Chapter
  You might frame UDT not as a descendant of Resolute Choice, but as its **computational limit case**. RC is what rationality looks like for an entity that *experiences* time and temptation but strives for consistency. UDT is what rationality looks like for an entity that *computes* time and sees its own source code.

  If your dissertation concerns human rationality, RC is likely the more robust framework (as UDT's metaphysical requirements are too strong for humans). If your dissertation concerns AI safety or idealized rationality, UDT supersedes RC because it achieves the same consistency without relying on the fragile mechanism of "willpower."
