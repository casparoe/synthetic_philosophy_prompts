      *   *Check Bostrom:* Is Orthogonality accurately described? Yes, intelligence vs. final goals.
      *   *Self-Correction on Part 3:* Make sure to clarify that Instrumental Convergence isn't *guaranteed* by Hume, but the *mechanism* is Humean. If reason could override goals, convergence would be less certain.
      *   *Formatting:* Use bolding and lists for readability.

  7.  **Final Polish:** (Mental check of the generated response against the prompt requirements).
