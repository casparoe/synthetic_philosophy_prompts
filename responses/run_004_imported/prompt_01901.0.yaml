      *   *Philosopher's Counter to Economist:* Your model makes blame incoherent. If it's just math, why do we hold her responsible? Also, hyperbolic discounting doesn't explain why she feels *guilt* rather than just updated preference.
      *   *Economist's Counter to Philosopher:* Guilt is just a negative utility signal for future planning. But here's the kicker for you: Resolutions are fragile. If will is a muscle, why did it fail instantly? My model explains the *instability* of the preference better than your "stubborn resolution."
      *   *Philosopher's Counter to Economist:* But you can't explain *strategic* behavior. She avoided the ashtray earlier. That's maintaining a resolution against a preference shift. Your model says she *should* have smoked the moment the curve crossed. She didn't. She held out until the social pressure spiked.
