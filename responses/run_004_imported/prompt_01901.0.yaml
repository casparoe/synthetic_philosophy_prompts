answer: |-
  **Setting:** *The balcony of a crowded apartment party. Through the glass door, Maya can be seen laughing with a group near the railing, a cigarette burning in her hand. Inside, Elias (a philosopher) and Sarah (a behavioral economist) lean against the brickwork, watching her.*

  **Elias:** She looks guilty. Even while she's laughing, she's keeping the hand with the cigarette behind her back.

  **Sarah:** She looks like a discount curve in action. At breakfast, the health payoff was abstract, distant. The cost of quitting was immediate. Now? The social lubrication and the nicotine hit are right here, in her hand. The long-term cost hasn't changed, but its present value has plummeted. It's not guilt, Elias. It's consistent inconsistency.

  **Elias:** That's the problem with your view. It sanitizes the betrayal. Maya didn't just update her probabilities. At breakfast, she didn't merely *prefer* not to smoke; she *resolved* not to smoke. Holton is clear on this: a resolution is a distinct psychological state. It's a plan designed specifically to resist the very preference shift you're describing. If you reduce this to hyperbolic discounting, you make her agency passive. She didn't just slide down a curve; she dropped a shield she intentionally raised.

  **Sarah:** But that shield is a black box. You say she "abandoned her resolution too readily." That's the core of Holton's definition, isn't it? But how do you measure "too readily" without referencing the very incentives I'm tracking? If the social pressure of this party is high enough, isn't abandoning the resolution the rational thing to do? If you say no, you're smuggling in a moral judgment and calling it a psychological mechanism. You're describing *what* happened—she smoked—but you aren't explaining *why* the resolution failed when it did. My model predicts the tipping point; yours just labels the aftermath.

  **Elias:** My model explains why she feels shame. If this were just a preference reversal, like choosing ice cream over salad because you're hungrier, there'd be no conflict. You'd just eat the ice cream. But weakness of will involves a conflict between a global judgment and a local desire. She still judges, right now, that she shouldn't be smoking. That's why the hand is behind her back. Your picoeconomics says her preference *has* reversed, that she currently values the cigarette more. But she doesn't. She values the quit, but she lacks the will. You can't capture that gap between valuation and action with a discount rate.

  **Sarah:** Can't I? Ainslie's picoeconomics treats the self as a series of temporal agents bargaining with each other. Her "breakfast self" made a deal with her "party self." The deal broke because the party self realized it could get a higher payoff by defecting. That's not a lack of a mystical faculty called "will"; it's a failure of intrapersonal bargaining. Here's the real difficulty for you, Elias: If resolutions are so distinct, why are they so fragile? If will is a capacity, why does it vanish the moment the discount curve steepens? You posit this faculty to explain the failure, but the faculty's only evidence is the failure. It's circular. She lacked will because she smoked; we know she lacked will because she smoked.

  **Elias:** It's not circular if we look at the counterfactuals. If she had refused the cigarette despite feeling the exact same urge, you'd have to say her discount curve magically flattened in that second. I say she exercised a capacity to stick to a rule despite the urge. But let's turn the screw on your bargaining model. If Maya is just a series of selves negotiating, why did she ask *us* this morning to stop her? She externalized the enforcement. That implies she knew her future preferences were illegitimate, not just different. You treat the future craving as a valid negotiating partner. She treated it as a tyrant she needed help resisting. Your model validates the temptation as a "preference"; she views it as an enemy to the "resolution."

  **Sarah:** Because she knows her future selves will punish her for it. That's the bargaining! She smokes now, but her "tomorrow morning self" will feel awful, and that anticipated pain is part of today's calculation. It's all utility. But here is where your resolution view hits a wall: Vagueness. Holton says weakness of will is abandoning a resolution *without sufficient reason*. Who decides what's sufficient? If I'm stressed, is that sufficient? If the wine is good, is that sufficient? Your theory requires a normative tribunal inside her head to judge the reasons, but you give no account of how that tribunal weighs evidence. My discounting model doesn't need a tribunal. It just needs the magnitude of the stimulus. The cigarette was offered by a friend, not a stranger. That spikes the immediate reward. Your "resolution" should be robust enough to handle that, or it wasn't a real resolution. So which is it? Did she lack will, or did she just have a weak resolution? If the latter, you're back to measuring strength, which sounds an awful lot like measuring... preference intensity.

  **Elias:** It's not preference intensity. I can intensely prefer to sleep in, but resolve to go to the gym. The intensity of the desire to sleep doesn't negate the resolution to exercise. The distinctness lies in the *non-reconsideration* clause. A resolution is a plan to stop weighing the options. She decided at breakfast to stop calculating the pros and cons of smoking. Tonight, she started calculating again. That's the weakness. She reopened the case file. Your model says she *should* reopen the case file whenever the local rewards spike. That's efficient for reward maximization, but it's terrible for agency. It makes her a slave to the immediate environment.

  **Sarah:** And your model makes her a slave to a rule that might be irrational. If the discount curve is steep because she's exhausted and stressed, maybe smoking *is* the locally rational choice to prevent a breakdown. By calling it "weakness of will," you're insisting she should have ignored her current state in favor of a past declaration. That's not agency; that's rigidity. But I'll concede this: You explain the *normative* residue better than I do. I can explain why she smoked, and I can explain why she predicts she'll regret it tomorrow. But I struggle to explain why she feels she *deserves* blame, rather than just needing a better incentive structure. If it's just math, blame is superstitious.

  **Elias:** And I'll concede this: You explain the *mechanics* of the temptation better than I do. I can say she abandoned her resolution, but I can't pinpoint why *this* cigarette broke it when yesterday's didn't. Your hyperbolic curve maps the terrain of the temptation precisely. But don't mistake the map for the traveler. She isn't a curve. She's the thing watching the curve, trying to draw a straight line across it.

  **Sarah:** Then why is the line so jagged?

  **Elias:** Because drawing it is hard.

  **Sarah:** Or because the paper is warped.

  *They both look out at Maya. She flicks the ash, takes one last drag, and stubs the cigarette out firmly in a potted plant.*

  **Elias:** She stopped at one.

  **Sarah:** The marginal utility dropped.

  **Elias:** Or she remembered her resolution.

  **Sarah:** We'll see what she says at breakfast tomorrow.

  **Elias:** Yes. We'll see if she asks for forgiveness, or just a better calculation.
