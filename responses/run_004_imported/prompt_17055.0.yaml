prompt: |-
  I'm drafting a historical novel built around a conspiracy to assassinate a tyrannical prince, and two beta readers -- one a lapsed seminarian, the other a lawyer with a weakness for medieval history -- got into a running argument in the manuscript's margin comments over whether my conspirators could plausibly invoke Aquinas the way I have them do in the scene. I'm passing the exchange along because I honestly can't settle it myself, and neither of them will let it drop.

  She argued that Aquinas gives them cover: in the Summa he says that disturbing a tyrant's rule is not sedition, since a regime aimed at the ruler's private advantage rather than the common good was never a rightly ordered government to begin with, so unmaking it cannot be a sin against order. He answered that this is true but beside the point for my scene, since that passage is usually read as licensing collective or public removal of a tyrant, not one man's knife -- and that in On Kingship, discussing exactly the case of a legitimately established ruler who curdles into cruelty, Aquinas is conspicuously wary of private initiative, warning that letting individuals judge for themselves who counts as a tyrant only invites ambitious men to murder decent rulers under that pretext. She replied that the line between a usurper and a legitimate ruler gone bad cannot be doing much work, since the subjects suffer identically either way, and a doctrine more concerned with a ruler's paperwork than his subjects' welfare is not one Aquinas could seriously have intended. He came back that Aquinas's worry was never welfare versus paperwork but who gets to act as judge in his own case, and that worry does not dissolve just because, in a given instance, the abuse happens to be real.

  Could you go through their exchange move by move, say who has the better of it at each step -- not just who wins overall -- and note anything about Aquinas's actual position that both of them seem to be missing?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **Context:** A historical novel featuring a conspiracy to assassinate a tyrannical prince.
      *   **Conflict:** Two beta readers (a lapsed seminarian and a lawyer/medievalist) are arguing in the margins about the historical/theological plausibility of the conspirators invoking Thomas Aquinas to justify assassination.
      *   **Task:** Analyze their exchange move-by-move, determine who has the better argument at each step, and identify what *both* might be missing about Aquinas's actual position.
      *   **Tone:** Scholarly, balanced, nuanced, helpful for a novelist (i.e., focused on plausibility and interpretation rather than just dry theology).

  2.  **Deconstruct the Exchange:**

      *   **Move 1 (She - Seminarian):** Aquinas (*Summa Theologiae*) says disturbing a tyrant isn't sedition because a tyrannical regime isn't a true government (private advantage vs. common good). Therefore, unmaking it isn't a sin against order.
      *   **Move 2 (He - Lawyer):** True, but that passage implies *collective/public* removal. In *On Kingship* (*De Regno*), Aquinas warns against *private* initiative (individual assassination) because it invites ambitious men to murder decent rulers under the pretext of tyranny.
      *   **Move 3 (She):** The distinction between a usurper and a legitimate ruler gone bad doesn't matter for the subjects (suffering is the same). A doctrine focused on "paperwork" (legitimacy) over welfare isn't what Aquinas intended.
      *   **Move 4 (He):** Aquinas's worry isn't welfare vs. paperwork; it's about *who judges*. Private judgment invites chaos, even if the abuse is real in a specific instance.

  3.  **Evaluate Each Move (against Aquinas's actual texts):**

      *   *Move 1 (She):* She cites *Summa Theologiae* II-II, q. 42, a. 2.
          *   *Accuracy:* High. Aquinas does distinguish between a true government (common good) and tyranny (private good). He says resisting tyranny isn't sedition *unless* it causes greater harm.
          *   *Weakness:* She omits the crucial caveat Aquinas adds immediately after (the "greater harm" clause).
          *   *Verdict:* Strong start, but incomplete.

      *   *Move 2 (He):* He cites *On Kingship* (De Regno), Book I, Chapter 6.
          *   *Accuracy:* High. Aquinas explicitly discusses the removal of tyrants. He acknowledges it seems praiseworthy but warns of the dangers. He specifically mentions that private individuals taking this on is dangerous. He suggests public authority or divine intervention.
          *   *Strength:* He correctly identifies the "private vs. public" distinction which is fatal to a secret conspiracy of individuals.
          *   *Verdict:* Stronger than Move 1 because it addresses the *method* (assassination vs. deposition).

      *   *Move 3 (She):* She argues from consequences (welfare) vs. legitimacy ("paperwork").
          *   *Accuracy:* Low/Misinterpretation. Aquinas is a natural law theorist. Legitimacy isn't just paperwork; it's about the *source* of authority and the *order* of the community. However, she is right that Aquinas cares about the common good.
          *   *Weakness:* She creates a false dichotomy. Aquinas cares about welfare *through* order. She also ignores the "greater harm" principle again.
          *   *Verdict:* Weaker. She's imposing a modern utilitarian view on a scholastic framework.

      *   *Move 4 (He):* He focuses on the epistemological/juridical problem (who judges?).
          *   *Accuracy:* High. This is the core of the rule of law argument found in medieval political thought. If anyone can kill a king they deem a tyrant, stability collapses.
          *   *Strength:* Captures the structural concern of Aquinas.
          *   *Verdict:* Strongest move.

  4.  **Identify What Both Miss (The "Third Way"):**

      *   *The "Greater Harm" Clause:* In *Summa* II-II, q. 42, a. 2, Aquinas says resisting tyranny is permissible *provided that this action does not occasion greater harm than the tyranny itself.* This is the biggest miss. Assassination often leads to civil war or a worse tyrant.
      *   *Divine Intervention:* In *On Kingship*, Aquinas ultimately suggests that if no human remedy exists, one must pray to God. He cites the downfall of Pharaoh and Nebuchadnezzar. He is very reluctant to endorse human regicide.
      *   *Public Authority:* Aquinas generally reserves the right of deposition to a superior authority (e.g., the Emperor for a King, or the People acting as a corporate body, not a cabal).
      *   *Historical Context:* Aquinas was writing for the King of Cyprus. He wasn't writing a revolutionary manifesto. He was trying to balance moral obligation with political stability.

  5.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the quality of the debate (both readers are sharp). Set the stage.
      *   *Move-by-Move Analysis:*
          *   Break down each argument.
          *   Assign a "winner" for that specific point based on textual fidelity.
          *   Explain *why* using specific references (*Summa* vs. *De Regno*).
      *   *The Missing Pieces:*
          *   The "Greater Harm" proviso (crucial for the novelist).
          *   The role of "Public Authority" (corporate vs. private).
          *   The appeal to God (the ultimate fallback).
      *   *Novelist Advice:* How to use this in the book. The tension *is* the drama. The conspirators might be misusing Aquinas (which makes them human/flawed) or interpreting him radically.

  6.  **Refining the Analysis (Self-Correction during drafting):**
      *   *Correction:* Make sure not to say Aquinas *never* allows tyranny removal. He does. Just not via private assassination usually.
      *   *Nuance:* The "Seminarian" is right about the definition of tyranny, but wrong on the remedy. The "Lawyer" is right on the remedy, but maybe too rigid on the "paperwork" rebuttal.
      *   *Key Text:* *Summa Theologiae* II-II, Q. 42, Art. 2 is the big one. *De Regno* is the other.
      *   *Tone Check:* Ensure I don't sound like I'm grading students, but rather analyzing a scholarly dispute for a creative purpose.

  7.  **Final Polish:** Check against the prompt requirements (move by move, who wins each, what's missing). (Looks good. The structure is clear.)

  **(Self-Correction Note on "Paperwork"):** The Seminarian uses "paperwork" dismissively. I need to point out that for Aquinas, legitimacy isn't bureaucratic; it's ontological/moral. But the Lawyer's defense of it is also slightly off; it's about *jurisdiction*, not paperwork. I should clarify that.

  **(Self-Correction on "Private vs Public"):** Aquinas does allow for "public authority" to depose. Does that mean the people? Some interpreters say yes (popular sovereignty roots), others say no (superior emperor). I should mention this ambiguity as it helps the novelist.

  8.  **Final Output Generation** (Proceed to write the response based on these thoughts).
answer: |-
  This is a remarkably high-quality debate for margin comments. Both your beta readers are grasping real tensions in medieval political theology, and both are citing actual texts. However, they are talking past each other slightly, and each is selectively reading Aquinas to fit their narrative preference.

  Here is a move-by-move breakdown of who holds the stronger textual ground, followed by the crucial nuances both are missing that could enrich your novel.

  ### Move 1: The Definition of Tyranny
  **She (Seminarian):** Argues that *Summa Theologiae* (II-II, q. 42, a. 2) exempts tyrannical regimes from the charge of sedition because they serve private advantage, not the common good. Therefore, unmaking them is not a sin against order.
  **He (Lawyer):** Concedes the point but argues it applies to *public* removal, not private assassination. Cites *On Kingship* (*De Regno*), where Aquinas warns against private initiative.

  *   **Who wins the point:** **He (The Lawyer).**
  *   **Why:** She is textually correct that Aquinas distinguishes between a true regime (common good) and a tyranny (private good). However, she stops reading too early. In that very same article of the *Summa*, Aquinas immediately adds a massive caveat: resisting tyranny is permissible *provided that this action does not occasion greater harm than the tyranny itself.*
  *   **The Verdict:** She wins on the *definition* of tyranny, but he wins on the *implication*. Aquinas does not grant a blank check for resistance simply because a ruler is tyrannical. The Lawyer correctly identifies that Aquinas distinguishes between the *status* of the ruler and the *method* of his removal.

  ### Move 2: Private vs. Public Authority
  **He (Lawyer):** Argues that *On Kingship* explicitly warns that allowing private individuals to judge and kill tyrants invites chaos and ambitious murder.
  **She (Seminarian):** Counters that the distinction between a usurper and a legitimate ruler gone bad is "paperwork" and shouldn't matter if the suffering is identical.

  *   **Who wins the point:** **He (The Lawyer).**
  *   **Why:** The Seminarian is importing a modern utilitarian framework (suffering = the only metric) onto a scholastic mind. For Aquinas, "legitimacy" is not paperwork; it is ontological. It concerns the source of authority and the structural order of the community.
  *   **The Verdict:** The Lawyer is right that Aquinas is deeply concerned with *jurisdiction*. In *On Kingship* (Book I, Chapter 6), Aquinas writes that while killing a tyrant seems praiseworthy, it is dangerous because "there is no greater danger to the multitude than that someone should usurp the government for himself." If any private citizen can decide the king is a tyrant, stability collapses. The Seminarian's argument that "suffering is the same" ignores Aquinas's belief that disorder (civil war following assassination) is often a greater spiritual and temporal evil than enduring a bad king.

  ### Move 3: The Problem of Judgment
  **She (Seminarian):** Implies Aquinas wouldn't care about legitimacy over welfare.
  **He (Lawyer):** Argues the core issue is *who judges*. Private judgment invites chaos even if the abuse is real.

  *   **Who wins the point:** **He (The Lawyer).**
  *   **Why:** This is the strongest argument in the exchange. It captures the essence of the Rule of Law as understood in the Middle Ages. Aquinas is not defending the tyrant; he is defending the *community* from the precedent of regicide.
  *   **The Verdict:** The Lawyer accurately identifies the epistemological problem: If the conspirators act privately, they are acting as judges in their own case. Aquinas consistently argues that coercion belongs to the public authority, not private will.

  ---

  ### What Both of Them Are Missing

  While the Lawyer wins the debate on textual fidelity, both readers are missing three critical nuances that could add immense depth to your novel's conflict.

  **1. The "Greater Harm" Proviso (The Utilitarian Trap)**
  In *Summa Theologiae* II-II, q. 42, a. 2, Aquinas writes: *"If to overthrow a tyrant is subject to such dangers that greater harm comes to the multitude from the ensuing disturbance than from the tyrant's government, it would not be licit to proceed against the tyrant."*
  *   **For your novel:** This is the conspirators' weak point. They must argue not just that the Prince is evil, but that killing him won't trigger a civil war worse than his reign. If your conspirators ignore this, they are bad Thomists. If they debate it, they are good ones.

  **2. The Role of "Public Authority"**
  Aquinas does allow for the removal of a tyrant, but he insists it must be done by **public authority**, not private presumption.
  *   **The Nuance:** Who constitutes "public authority"? In *On Kingship*, Aquinas suggests that if a king is elected by the people, the people (or their representatives) may depose him. However, if the king is appointed by a superior (like an Emperor or the Pope), only that superior can depose him.
  *   **For your novel:** Are your conspirators acting as a "cabal" (private) or as a "council of nobles" (quasi-public)? If they are high-ranking nobles claiming to represent the *corpus politicum* (the body politic), they have a stronger Thomistic case than if they are a group of disgruntled knights. The Seminarian is right that tyranny voids the ruler's claim, but the Lawyer is right that the *remedy* must be institutional.

  **3. The Appeal to God (The Quietist Out)**
  In *On Kingship*, after outlining the dangers of assassination, Aquinas offers his ultimate solution for when no human remedy exists: **Prayer.** He cites Psalm 11: *"Thou hast proved my heart... let the wickedness of the sinners come to an end."* He argues that God can soften a tyrant's heart or remove him without human bloodguilt.
  *   **For your novel:** This is the dramatic goldmine. A truly devout Thomist conspirator would be tormented by this. They would know that Aquinas ultimately suggests leaving it to God if human removal causes too much disorder. Your conspirators are essentially deciding that God is taking too long, or that God works through knives. That is a fascinating theological tension: are they instruments of God's will, or are they usurping God's judgment?

  ### Recommendation for the Manuscript

  Do not resolve this argument in the text. **Let them both be partially right.**

  *   **The Seminarian's Character:** Should argue that the Prince has forfeited his status as a true ruler, making him a public enemy (*hostis humani generis*) rather than a sovereign. This justifies the *act*.
  *   **The Lawyer's Character:** Should argue that without a public trial or decree, they are merely murderers, and their success will invite future anarchy. This justifies the *risk*.

  **The Verdict:** The Lawyer has the better of the historical argument. Aquinas is generally hostile to private assassination, even of tyrants. However, the Seminarian has the better *dramatic* argument. History is full of men who used Aquinas's definitions of tyranny to justify what Aquinas's methods forbade.

  If your conspirators invoke Aquinas, they are technically misusing him (favoring the *definition* of tyranny over the *restriction* on removal). But that makes them more human. They are taking a theology of order and bending it to serve a necessity of justice. That is the heart of tragedy, and it fits a historical novel perfectly.
