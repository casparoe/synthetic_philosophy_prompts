          *   Length: Short memo.

  2.  **Determine the Ethical/Philosophical Core:**
      *   *The Core Issue:* The definition of "Minimal Risk" (45 CFR 46.102(i)). It means risks not greater than those encountered in daily life or during routine physical/psychological examinations.
      *   *The Majority View:* Relies on *cognitive appraisal*. If I know $X$ isn't real, $X$ can't hurt me more than a movie.
      *   *The Minority View:* Relies on *phenomenology/physiology*. Immersive VR bypasses cognitive appraisal. The body reacts (cortisol, startle response) even if the mind knows it's safe. This aligns with the "Paradox of Fiction" (how can we fear what we know doesn't exist?).
      *   *My Position (as the drafter):* As a philosophy of emotion student, I likely side closer to the Minority, or at least see the flaw in the Majority's reasoning. However, as an IRB member, I need a actionable recommendation that protects participants without necessarily killing the study.
      *   *Decision:* The Majority's comparison to a "scary movie" is flawed. VR is *immersive*, not observational. The physiological stress response is the risk. Therefore, "More than Minimal Risk" is the ethically defensible classification, but with safeguards that allow the study to proceed safely. This validates the Minority's philosophical insight while providing a path forward.

