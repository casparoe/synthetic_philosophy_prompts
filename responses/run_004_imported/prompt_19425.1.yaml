          *   *Minority (2 members):* Wants "more than minimal risk" + safeguards. Argument: Paradox of Fiction (we feel real fear toward known fictions), so "knowing it's fiction" offers less protection than assumed.
      *   **Requirements:**
          *   Recommend a concrete classification (Minimal, More than Minimal + Safeguards, or Revisions).
          *   Give the losing side's argument (the Minority/Paradox of Fiction side) real weight (not a token nod).
