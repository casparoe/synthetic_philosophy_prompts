answer: |-
  You are not overthinking this, and you are not giving them too much credit. Your intuition is spot on: **Religious belief often functions cognitively and linguistically in a fundamentally different way than ordinary empirical belief.**

  The "blank" reaction you saw from your mother-in-law is the smoking gun. It wasn't evasion; it was a **category error**. You asked a question that works perfectly for scientific hypotheses (like "Is there water on Mars?") but malfunctions when applied to existential frameworks (like "What is the point of my life?").

  Here is a breakdown of what is actually going on, drawing from philosophy of religion, psychology, and linguistics.

  ### 1. Belief *That* vs. Belief *In*
  In everyday life, you hold **propositional beliefs**. You believe *that* the bus is coming at 5:00 PM. This is a claim about the physical world that can be proven true or false. If the bus doesn't come, your belief is falsified, and you change your behavior (you call an Uber).

  For many deeply religious people, faith is not a proposition about the physical world; it is an **orienting framework**. Philosophers like Ludwig Wittgenstein called this a "form of life." It's not a piece of data *within* their map of reality; it is the *grid* on the map itself.

  When you ask, "How do we know the resurrection happened?" you are treating it as a historical data point (a proposition). When she says, "I feel it," she is describing a relationship or a stance toward existence (an orientation).

  **The "Blank" Reaction:**
  When you asked, "If you knew none of it was true, what would you do differently?" she blanked because the question asks her to imagine removing the grid from the map. Without that grid, the concepts of "doing," "differently," and even "tomorrow" might lose the specific meaning she assigns them. It's like asking a chess player, "If you knew the rules of chess were made up, what move would you make?" The rules *are* made up, but if she stops accepting them, she isn't playing chess anymore. She can't answer what move to make *in chess* if she isn't playing chess.

  ### 2. The Concept of the "Blik"
  In the mid-20th century, philosopher R.M. Hare introduced the concept of a **"blik."** A blik is a non-falsifiable way of seeing the world that governs how you interpret all evidence.

  Hare used the example of a lunatic who believes all university professors are trying to murder him. No matter how kind a professor acts, the lunatic says, "He's just pretending." You cannot use evidence to change his mind because his blik dictates how the evidence is interpreted.

  Most religious believers do not have a "lunatic" blik (their lives function normally), but they do have a **theistic blik**.
  *   **Your view:** Evidence $\rightarrow$ Conclusion.
  *   **Her view:** Faith (Blik) $\rightarrow$ Interpretation of Evidence.

  If she finds beauty in nature, it confirms God. If she finds suffering, it is a test from God. The belief is the lens, not the image. You cannot change the lens by arguing about the image.

  ### 3. The Engineer Brother-in-Law (Compartmentalization)
  You mentioned your brother-in-law is an engineer who deals in probabilities but believes the same way. This is very common and is not necessarily hypocrisy. Stephen Jay Gould called this **NOMA (Non-Overlapping Magisteria)**.

  Human brains are excellent at compartmentalization.
  *   **Magisterium 1 (Work/Engineering):** Empirical evidence, falsifiability, probability, material causes.
  *   **Magisterium 2 (Home/Church):** Meaning, morality, purpose, community, ultimate concern.

  For him, asking for evidence of the resurrection is like asking for the chemical composition of a poem's rhyme scheme. It's the wrong tool for the job. He isn't being irrational; he is switching cognitive modes. In the lab, he demands proof. In the pew, he demands meaning. The "blank" reaction happens when you try to force the lab rules onto the pew.

  ### 4. Is it Denial?
  Your friend suggested it's just "not wanting to give up something comforting." This is partially true but incomplete. This is known in psychology as **Motivated Reasoning** or **Identity-Protective Cognition**.

  However, calling it "denial" implies they know it's false deep down and are hiding from it. That is likely not the case. For them, the "truth" of the religion is not found in its historical accuracy, but in its **transformative power**.

  If praying makes her feel peaceful, and that peace allows her to be a kinder mother and grandmother, then within her framework, the belief is "true" because it produces real fruit. Asking "But is it historically factual?" is, to her, like asking a person in love, "But have you chemically analyzed the pheromones?" It misses the point of the experience.

  ### 5. Why the "What Would Change Your Mind?" Test Fails
  The "What would change your mind?" test is the gold standard for **scientific claims**. It is not the gold standard for **commitments**.

  *   **Scientific Claim:** "This bridge can hold 10 tons." (Must be falsifiable).
  *   **Commitment:** "I will love my spouse until death." (Should *not* be falsifiable).

  If your spouse said, "What evidence do you have that you'll love me forever? What would change your mind?" you would be hurt. You would say, "That's not how love works."

  For your mother-in-law, faith is closer to a vow of love than a hypothesis about a bridge. Asking her what would falsify it is asking her to treat her commitment as a hypothesis, which feels like a betrayal of the commitment itself.

  ### How to Talk to Her (If You Still Want To)
  If you want to understand her without frustrating both of you, you have to switch languages. Stop asking **evidentiary** questions and start asking **functional** questions.

  *   **Don't ask:** "How do you know it's true?"
  *   **Do ask:** "What does this belief give you when things are hard?"
  *   **Don't ask:** "What if it's false?"
  *   **Do ask:** "How does this shape how you treat people?"
  *   **Don't ask:** "What about other religions?"
  *   **Do ask:** "How did you come to feel this connection personally?"

  ### Summary
  You aren't dealing with simple denial. You are encountering a different **mode of truth**.
  *   **You** are looking for *Correspondence Truth* (Does this match the physical facts?).
  *   **She** is looking for *Coherence/Transformative Truth* (Does this make my life hang together? Does this make me better?).

  The "blank" look was her brain registering that you had asked, "If you stopped speaking English, what sentence would you say?" She couldn't answer because the question dissolves the medium required to answer it. Recognizing this doesn't mean you have to agree with her, but it does mean you can stop viewing her as an engineer who forgot how to do math, and start seeing her as someone playing a different game entirely.
