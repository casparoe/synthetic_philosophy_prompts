      *   *Conservation of Expected Evidence (CEE):* Formally, $\sum P(E_i) P(H | E_i) = P(H)$. Or, $E[P_{t'}(H)] = P_t(H)$. This is a theorem of probability theory *if* the update is via Bayesian Conditionalization on a partition of evidence that is known at time $t$.
