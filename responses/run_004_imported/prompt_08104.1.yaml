      *   *Rationalist Usage:* Yudkowsky uses CEE primarily to say "You can't expect your belief to move in a specific direction." If you expect it to move up, it should be up already. This aligns with the martingale property of Bayesian posteriors.
      *   *Key Distinction:* RP is about *conditionalizing on the future belief value itself*. CEE is about the *expectation of the future belief*.
