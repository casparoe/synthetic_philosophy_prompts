          *   *CEE Vulnerabilities:* CEE holds *mathematically* for Bayesians. If CEE fails, you aren't Bayesian updating. However, applying it normatively ("You should move belief now") assumes the future update *will* be Bayesian. If you expect to be brainwashed, CEE still holds for the *actual* Bayesian update you *should* do, but your *predicted* belief might violate it.
