      *   *The "Brainwashing" Case:* If I know I will be brainwashed to believe $A$ with $p=0.99$, CEE says my current belief shouldn't move (because brainwashing isn't evidence). RP says $P_t(A | P_{t'}(A)=0.99) = 0.99$. This leads to the paradox: Should I update now? Van Fraassen says yes (Reflection). Most epistemologists say no (because the process is unreliable).
      *   *Yudkowsky's stance:* He would say "Conservation of Expected Evidence" means you can't expect brainwashing to move your belief *rationally*. You should anticipate the brainwashing as a separate event, not as evidence. So CEE protects against the brainwashing paradox better than RP.
      *   *Conclusion on "Smuggling":* The Rationalist community often uses CEE to do the work of "Don't update on non-evidence." This is actually *rejecting* the strong Reflection Principle in cases of known irrationality. So they aren't smuggling RP's difficulties; they are using CEE to avoid them. *However*, they sometimes speak loosely as if "Future Me is always right," which *is* RP.

