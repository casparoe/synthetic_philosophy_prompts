answer: |-
  You have put your finger on a genuine and often-overlooked distinction in formal epistemology. Your suspicion is well-founded: while the Rationalist community (following Yudkowsky) often treats **Conservation of Expected Evidence (CEE)** and **Van Fraassen's Reflection Principle (RP)** as rhetorical siblings, they are logically distinct, have different normative strengths, and fail under different conditions.

  To answer your core questions directly: **No, CEE is not best understood as a special case of Reflection.** Rather, Reflection is a much stronger normative principle that *implies* CEE (under specific conditions), but CEE is a mathematical theorem of Bayesian probability that holds independently of Reflection. The "missing generality" of CEE—its restriction to expectations over evidence partitions rather than specific future credence values—is precisely what immunizes it against the classic counterexamples that plague Reflection.

  Here is a detailed comparison of the two principles, their logical relationship, and an assessment of their epistemic utility.

  ---

  ### 1. Formal Distinctions: Martingale vs. Expert Principle

  To see the difference, we must look at what each principle constrains.

  **Conservation of Expected Evidence (CEE)**
  Formally, CEE is the statement that Bayesian posteriors form a **martingale**. If $P_t$ is your credence at time $t$, and $P_{t'}$ is your credence at a later time $t'$ after observing evidence $E$ drawn from a known partition, then:
  $$ E_t[P_{t'}(A)] = P_t(A) $$
  This is a theorem of probability calculus (specifically the Law of Total Probability), provided the update rule is Bayesian Conditionalization. It says that *before* you see the evidence, you cannot predict the direction of your belief change. If you could, you should have already updated.

  **Van Fraassen's Reflection Principle (RP)**
  Formally, RP states:
  $$ P_t(A \mid P_{t'}(A) = r) = r $$
  This is not a theorem; it is a normative constraint on rationality. It asserts that your future self is an **expert** relative to your current self. It requires you to defer to your future credence *regardless* of how that credence was reached, provided you know what it is.

  **The Logical Relationship**
  *   **RP implies CEE:** If you satisfy Reflection for all values $r$, then your expected future credence must equal your current credence. (If you defer to every possible future value, the weighted average of those values must match your current view).
  *   **CEE does not imply RP:** You can satisfy the martingale property without satisfying Reflection. For example, suppose you know that tomorrow you will either believe $A$ with probability 0.1 or 0.9, with equal probability. Your current credence is 0.5. CEE is satisfied ($0.5 \times 0.1 + 0.5 \times 0.9 = 0.5$). However, RP requires that $P_t(A \mid P_{t'}(A)=0.1) = 0.1$. If the 0.1 outcome is the result of a known cognitive malfunction (e.g., you will be tired or drugged), RP forces you to treat that malfunction as authoritative. CEE does not; it merely says the *average* of your possible futures matches your present.

  ### 2. The "Special Case" Hypothesis

  You asked: *Is CEE best understood as simply a special case of Reflection, restricted to future credences that arise from Bayesian conditionalization on a known evidence partition?*

  It is more accurate to say that **CEE is the mathematical skeleton that remains when you strip Reflection of its normative ambition.**

  Reflection attempts to solve the problem of diachronic coherence by demanding that you treat your future self as a black-box expert. It does not require you to know *why* your belief changed, only *that* it changed to $r$. This is its "generality."

  CEE, by contrast, is derived from the mechanics of conditionalization itself. It relies on the structure of the evidence partition. It says: "If you update on evidence $E$, your expectation of the posterior must match the prior."

  Therefore, CEE is not a "restricted Reflection." It is a property of the updating rule. Reflection is a property of the agent's attitude toward their future self. You can be a perfect Bayesian (satisfying CEE) while rejecting Reflection (e.g., knowing you will suffer memory loss).

  ### 3. Vulnerabilities: Forgetting and Brainwashing

  You asked: *Is that missing generality the genuinely interesting part of Van Fraassen's principle, or precisely the part that exposes it to the classic brainwashing- and memory-loss-style counterexamples?*

  It is precisely the part that exposes RP to counterexamples. The "generality" of RP (deferring to $P_{t'}$ without knowing the evidence path) is its fatal flaw.

  **The Memory Loss Case (Talbott/Arntzenius):**
  Suppose you know you will forget everything you learned today.
  *   **RP:** If you know your future credence in $A$ will be 0.5 (because you forget the evidence), RP demands your current credence be 0.5. This prevents you from learning anything today, as you must anticipate forgetting it.
  *   **CEE:** CEE handles this gracefully. You anticipate that your future credence will be 0.5, but you also anticipate that this change is *not* due to conditionalization on new evidence, but due to information loss. CEE applies to rational updates; it does not command you to anticipate irrational decay as if it were evidence.

  **The Brainwashing Case:**
  Suppose you know a demon will force you to believe $A$ with $p=0.99$ tomorrow.
  *   **RP:** $P_t(A \mid P_{t'}(A) = 0.99) = 0.99$. You should update to 0.99 now. This is clearly irrational; the demon's manipulation is not evidence for $A$.
  *   **CEE:** CEE says your expected posterior *given Bayesian updating* equals your prior. If you know the demon will intervene, you know you will *not* be Bayesian updating. CEE serves as a warning: "Do not expect your belief to move to 0.99 via evidence." It does not command you to move there preemptively.

  The "missing generality" of CEE is actually a **protective restriction**. By tying the conservation law to the expectation over evidence (or rational updates), it avoids commanding agents to defer to their own future irrationality.

  ### 4. Substantive Epistemic Work

  You asked: *Which principle is doing more substantive epistemic work?*

  **Reflection (RP)** does deep philosophical work regarding **trust and authority**. It is useful in contexts where the future self *is* strictly more informed or reliable (e.g., deferring to a future version of yourself who has finished a calculation you are currently doing). It captures the intuition that "I should not disagree with my future, better-informed self." However, as a general norm, it is too brittle for real-world agents who face forgetting, bias, and manipulation.

  **Conservation of Expected Evidence (CEE)** does more practical work regarding **bias detection and calibration**.
  Yudkowsky deploys CEE chiefly as a heuristic against motivated reasoning: *"If you can predict which way an argument will push you, you should have already moved."*
  This is powerful because:
  1.  It is mathematically robust (it's a theorem, not a norm).
  2.  It isolates **directional bias**. If you expect your belief to rise, you are implicitly claiming you already have evidence for that rise.
  3.  It avoids the "brainwashing" trap. If you expect your belief to rise due to peer pressure, CEE tells you that is *not* evidence, and thus you should not update.

  In the context of the LessWrong Sequences, CEE is the workhorse. It is used to argue against "anticiping short inferential distances" (expecting to be convinced by weak arguments) and to enforce the idea that beliefs should only move on the weight of evidence, not on the anticipation of social or psychological pressure.

  ### 5. Does Yudkowsky's Version Smuggle in Reflection's Difficulties?

  You asked: *Does Yudkowsky's version quietly smuggle in any of Reflection's difficulties by another route?*

  Generally, **no**, but there is a risk of rhetorical conflation.

  Yudkowsky's usage of CEE is typically: *"You cannot expect your beliefs to change in a specific direction without evidence."* This is a correct application of the martingale property. It does not require you to defer to your future self if that self is compromised.

  However, the Rationalist community sometimes slides into a stronger claim: *"Trust your future self's rationality."* This is where RP sneaks in.
  *   **Safe Usage:** "I expect to see evidence $E$. If $E$ supports $H$, my belief will go up. I cannot expect $E$ to support $H$ unless I already believe $E$ is likely and supports $H$." (This is CEE).
  *   **Risky Usage:** "My future self will have processed more data, so I should defer to their conclusion now." (This is RP).

  The danger arises when an agent anticipates their own **predictable irrationality**.
  *   If I know I will be exhausted tomorrow and prone to pessimism, RP suggests I should be pessimistic now (since $P_{future}(Bad) > P_{now}(Bad)$).
  *   CEE suggests I should *not* update on pessimism now, because exhaustion is not evidence of badness.

  Yudkowsky's writing generally supports the CEE view (don't update on non-evidence), but the community culture of "optimizing your rationality" can sometimes lead to an implicit assumption that "Future Me will be More Rational," which invokes RP. If an agent assumes Future Me is a Rational Oracle, they might ignore the possibility of systematic drift or fatigue, effectively accepting RP and becoming vulnerable to its counterexamples.

  ### Conclusion

  Your intuition is correct. The two principles are not interchangeable.

  1.  **Logical Status:** CEE is a theorem of probability (martingale property); RP is a normative principle of diachronic coherence (expert principle).
  2.  **Generality:** RP is more general (applies to any future credence), but this generality is a bug, not a feature, as it forces deference to irrational changes. CEE is restricted to expectations over evidence/updating, which protects it.
  3.  **Epistemic Utility:** CEE is the superior tool for practical rationality and bias checking. RP is philosophically interesting but practically fragile.
  4.  **Smuggling:** Yudkowsky's CEE does not inherently smuggle in RP's difficulties, provided it is understood as a constraint on *expected evidence* rather than a command to *defer to future credence*. However, careless rhetoric can conflate the two, leading agents to incorrectly update on anticipated irrationality.

  The Rationalist community is right to champion CEE. They are wise to treat Van Fraassen's Reflection with caution, even if they don't always explicitly distinguish the two in casual discourse. CEE gives you the benefit of diachronic consistency without the cost of deferring to your future, potentially brainwashed, self.
