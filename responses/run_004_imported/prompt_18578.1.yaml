      *   *Another Example:* The "Value of Information in Games." In some games, being ignorant allows for credible threats/promises. (e.g., Schelling's focal points, or not knowing the exact payoff to avoid temptation). A classic example is *not* knowing your own reservation price in a negotiation to maintain a tough stance (though this is more about commitment). A better game-theoretic example: In a coordination game, public information can lead to a worse equilibrium than private information (Morris & Shin).
