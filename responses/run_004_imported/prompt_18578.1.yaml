answer: |-
  This is an exceptionally sharp analysis. You have correctly identified the two standard "escape hatches" from Good's theorem that decision theorists and economists use when the "information is always good" slogan runs into trouble. Your intuition that something is being oversold is correct: Good's theorem is a mathematical truth within a specific, narrow model, but your friend is treating it as a universal normative principle.

  Here is a breakdown of your objections, some verification on the Good distinctions, and suggestions for sharpening the moral.

  ### 1. On Type I vs. Type II Rationality
  Your memory is correct. I. J. Good did indeed distinguish between these two types of rationality (most notably in his 1971 paper "Rationality" and subsequent books).

  *   **Type I:** Maximizing expected utility relative to current beliefs and a fixed set of actions. Good's 1967 theorem operates strictly here.
  *   **Type II:** Maximizing expected utility when "thinking," "calculating," and "updating" are themselves actions with associated costs and time requirements.

  **Comment:** This is a valid objection to the *practical* application of the theorem, but a pedant might argue it doesn't refute the *theorem* itself. Good's theorem calculates the *gross* value of information. If the *net* value (Gross Value − Computational Cost) is negative, a Type II rational agent declines the info.
  **How to sharpen it:** Frame this not as a refutation of the math, but as a refutation of the **implicit premise** that "receiving" information is distinct from "processing" it. For a bounded agent, acquisition and processing are coupled. If the slogan is "a rational agent should never *pay* to avoid information," your friend might still win on cost-free info. But if the slogan is "a rational agent should always *prefer* to have the information available," the Type II objection holds: having the information available imposes a cognitive demand to update, which can be a net negative resource drain.

  ### 2. On Hirshleifer and Multi-Agent Settings
  This is your stronger argument. You are asking whether Hirshleifer is a counterexample to the slogan or simply outside the theorem's scope. The answer is **both**, and distinguishing them is key to winning the argument.

  Good's theorem relies on a specific structural assumption: **The action space is fixed.**
  The theorem compares:
  1.  $\max_a E[U(a, \theta)]$ (Act now)
  2.  $E_s [\max_a E[U(a, \theta) | s]]$ (See signal $s$, then act)

  It proves (2) $\ge$ (1) *provided the set of available actions $A$ remains the same in both cases.*

  In the Hirshleifer insurance example, the arrival of information changes the **feasible set of actions**.
  *   **Late Info:** Action set includes "Write Insurance Contract."
  *   **Early Info:** Action set excludes "Write Insurance Contract" (because uncertainty is resolved).

  Because the action space shrinks when information arrives early, the convexity argument (Jensen's inequality) no longer applies. You aren't comparing the same function at the prior vs. the posterior; you are comparing two different functions.

  **Verdict:** Hirshleifer is a genuine counterexample to the **slogan** ("more info is always weakly good"), precisely because it demonstrates a context where the **theorem's assumptions do not hold.** Your friend is committing a category error by applying a single-agent, fixed-action-space theorem to a multi-agent, endogenous-action-space environment.

  ### 3. Alternative/Complementary Examples
  Hirshleifer is the classic economic example, but if you want something that feels more like "decision theory" and less like "market microstructure," consider these:

  **A. The Value of Ignorance in Games (Commitment)**
  In strategic settings, information can destroy your ability to make credible threats or promises.
  *   *Example:* In a bargaining scenario, if you know exactly how much the other party is willing to pay, you might be tempted to extract every last penny, causing the deal to collapse (if they resist). If you remain ignorant of their exact reservation price, you might make a moderate offer that is accepted.
  *   *Reference:* This relates to the concept of **strategic ignorance**. Sometimes, not knowing your own strength (or the opponent's weakness) prevents you from overplaying your hand.

  **B. Morris and Shin (2002) – "Social Value of Public Information"**
  This is a modern, rigorous complement to Hirshleifer. They show that in coordination games (like currency attacks), **public information** can actually reduce welfare compared to **private information**.
  *   *Mechanism:* Public information creates a "common knowledge" effect that forces agents to coordinate on a bad equilibrium (e.g., all attacking a currency because everyone knows everyone else knows the fundamentals are weak). Private noise allows for some dispersion that can sustain a good equilibrium.
  *   *Why use it:* It shows that even without insurance markets collapsing, the *structure of knowledge* (public vs. private) can make more precise public information harmful to the agents involved.

  ### 4. Stating the Moral
  You asked how best to state the moral. I suggest framing it as a distinction between **Local** vs. **Global** rationality, or **Internal** vs. **External** validity.

  **Draft Proposal:**
  > "Good's theorem is a *local* result about belief updating within a fixed decision frame. It proves that *given* a fixed set of actions and a single agent, updating on cost-free data cannot hurt.
  >
  > However, the slogan 'rational agents should always want more information' is a *global* claim about policy and system design. It fails when:
  > 1.  **Processing is costly** (Type II rationality): The cost of updating exceeds the value of the update.
  > 2.  **The frame is endogenous** (Hirshleifer/Morris-Shin): The arrival of information changes the feasible set of actions (e.g., destroying insurance markets) or alters the strategic equilibrium (e.g., forcing coordination on a bad outcome).
  >
  > Therefore, Good's theorem does not settle the matter. It establishes a baseline for idealized, isolated cognition, but it does not license the universal claim that ignorance is never preferable in real-world social or bounded contexts."

  ### Summary of Advice for Your Friend
  1.  **Acknowledge the Math:** Concede that Good's proof is correct *within its assumptions*. This prevents you from looking like you're denying basic probability theory.
  2.  **Attack the Assumptions:** Point out that the "fixed action space" assumption is the heavy lifter. In the real world (and especially in economics), information often changes *what you are allowed to do* (contracts, laws, social norms), not just *what you believe*.
  3.  **Use the Type II Distinction:** Remind her that Good himself admitted his theorem was for "Type I" rationality. If we are talking about actual rational agents (humans or AI with compute limits), Type II applies, and the theorem is silent.
  4.  **The "Ex-Ante" Trap:** In the Hirshleifer case, emphasize that the agents are worse off *ex-ante* (before the information structure is chosen). A rational agent, behind a veil of ignorance, would choose a world with *less* available information. Therefore, a rational agent *does* sometimes prefer ignorance.

  Your write-up is already very strong. If you add the specific point about the **action space shrinking** in the Hirshleifer example, you will have a technically airtight objection.
