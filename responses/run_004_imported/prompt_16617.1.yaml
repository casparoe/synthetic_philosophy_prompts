      *   *The "Paradox":* Humphreys argues that if propensities are physical causal tendencies, they have a direction (cause $\to$ effect). Probability calculus (Kolmogorov axioms + Bayes/Conditional definition) treats conditional probability symmetrically in terms of mathematical definability ($P(A|B) = P(AB)/P(B)$ implies a relationship with $P(B|A)$).
