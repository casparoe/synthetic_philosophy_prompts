      *   *Why doesn't this hurt Frequentists?* Frequencies are just counts in a reference class. $P(B|A)$ is just the frequency of $B$ within the subset where $A$ occurred. No causality implied.
      *   *Why doesn't this hurt Subjectivists?* Degrees of belief can be updated on anything. Learning $A$ happened changes belief in $B$. No physical causality required.
