      *   **User's Understanding:** Two agents with *no* causal interaction (no communication, no shared state, spacelike separated, etc.) strike a deal (e.g., "I'll honor your values if you honor mine").
      *   **User's Mechanism Hypothesis:** The enforcement works because the advanced agent "reaches backwards across that gap" and makes good on its end after the fact. The user interprets "acausal" as literally reaching backwards across the causal gap.
