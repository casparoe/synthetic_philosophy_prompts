      *   *The Actual Mechanism:* It's not about physical enforcement or signaling across the gap. It's about *logical correlation* derived from *predictive simulation*. Each agent simulates the other (or reasons about the other's decision algorithm) and realizes that cooperation is the optimal strategy given their shared rationality. The "enforcement" isn't external; it's internal to the decision theory (specifically Timeless Decision Theory or Functional Decision Theory).

