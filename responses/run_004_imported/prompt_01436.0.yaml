  ok so I've fallen down a rabbit hole reading about 'acausal trade' on some AI-safety/decision-theory blogs, and I think I finally get the mechanism. The setup is two agents that can never causally interact at all — like us now and some future superintelligence, or us and an alien civilization in a totally seperate part of the universe. Basically zero network path between them, no shared state, nothing. They still manage to strike a deal, like 'I'll look out for your values if you look out for mine.' My understanding is the enforcement works because the more advanced agent reaches backwards across that gap and makes good on its end after the fact — that backwards reach across the causal gap is literally what 'acausal' means here. Do I have that right? Mainly trying to figure out what's actually carrying the deal across a gap that, by definition, has zero channel.
