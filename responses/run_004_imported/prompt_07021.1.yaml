prompt: |-
  I'm about a third of the way into a generation-ship novel, and one of my favorite threads is how the descendants of the original crew end up with all these little unwritten rules that nobody ever voted on — which side of the main corridor you walk down, how you queue outside the hydroponics bay, who gets to speak first at the monthly assembly. My editor pointed me toward David Lewis's old book on convention as research (I was a lit major, so game theory is not exactly home turf for me), and it's honestly been great for showing how a rule like that can just solidify out of repeated coincidence and everyone expecting everyone else to keep doing it, rather then some founding committee sitting down and deciding it on day one.

  Here's where I've talked myself into a corner, though. Lewis is pretty insistent that a convention is arbitrary — some other regularity, like walking on the left instead of the right, would've worked exactly as well. Which seems to mean that since nobody on my ship actually has a real stake in a custom being one particular way rather than another, switching it should be pretty painless the second somebody points out the alternative works just as fine — there's no vested interest to overcome, just habit. I'd originally written a subplot where a young reformer has to fight a whole political battle to get one of these customs changed, but now I'm wondering if I should cut that and just have her point out the arbitrariness and let the ship adopt the new rule within a scene or two, since that's presumably what the theory predicts. Does that track, or is there some reason arbitrary conventions might actually be hard to shift even when literally nobody disagrees that the new one is just as good?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Problem:**
      *   **Context:** The user is writing a generation-ship novel.
      *   **Core Theme:** Unwritten rules/conventions among descendants (corridor walking, queuing, speaking order).
      *   **Research:** They've been reading David Lewis's *Convention: A Philosophical Study* (1969).
      *   **The Conflict:** Lewis argues conventions are *arbitrary* (could have been otherwise) and sustained by mutual expectations. The user interprets this to mean changing a convention should be easy (just point out the alternative works as well).
      *   **The Plot Issue:** The user has a subplot where a reformer fights a political battle to change a custom. Based on their reading of Lewis, they think this is unrealistic and are considering cutting the conflict.
      *   **The Question:** Does Lewis's theory actually imply conventions are easy to change? Or are there reasons arbitrary conventions might be hard to shift even if everyone agrees the alternative is equally good?

  2.  **Evaluate David Lewis's Theory of Convention:**
      *   *Definition:* A regularity in behavior, sustained by mutual expectations, where everyone prefers to conform if others conform (coordination problem).
      *   *Arbitrariness:* Yes, Lewis says there must be at least one alternative regularity that could have solved the coordination problem instead.
      *   *Stability:* Lewis emphasizes *equilibrium*. Once a convention is established, it's a Nash Equilibrium. No single individual has an incentive to deviate.
      *   *Change:* Lewis doesn't explicitly focus on *how* conventions change, but game theory suggests shifting equilibria is hard. It requires *common knowledge* that everyone will switch simultaneously.
      *   *Key Insight:* Just because something is arbitrary *in origin* doesn't mean it's costless *in transition*.

  3.  **Brainstorm Reasons Why Arbitrary Conventions are Hard to Change (Counter-arguments to the user's interpretation):**
      *   **Coordination Failure:** Even if Rule B is as good as Rule A, switching from A to B requires everyone to switch *at the same time*. If only half switch, chaos ensues (collisions in the corridor).
      *   **Salience/Focal Points:** The existing rule is "salient." It's the thing everyone sees. The new rule is abstract.
      *   **Transition Costs:** During the switch, there's a period of uncertainty. Accidents happen. Efficiency drops. People hate uncertainty.
      *   **Identity/Signaling:** Conventions often become markers of group identity ("We are people who walk on the right"). Changing it feels like losing tradition.
      *   **Second-Order Conventions:** Other rules might have grown around the original rule. (e.g., signage, handrails, muscle memory).
      *   **Trust/Authority:** Who says we're switching? If the reformer isn't trusted, people won't believe *others* will switch, so they won't switch themselves.
      *   **Status Quo Bias:** Psychological inertia. "If it ain't broke, don't fix it."

  4.  **Connect Back to the Novel's Context (Generation Ship):**
      *   **High Stakes:** On a ship, efficiency and safety are paramount. A coordination failure (collision in a narrow corridor) could be dangerous.
      *   **Closed Society:** Traditions carry more weight in isolated communities.
      *   **Generational Amnesia:** The original reason might be lost, making the rule seem sacred/mystical rather than practical.
      *   **The Reformer's Challenge:** It's not about proving Rule B is *better*, it's about convincing everyone that *everyone else* will follow Rule B.

  5.  **Formulate the Advice:**
      *   **Validate the Research:** Acknowledge Lewis is great, but the user's interpretation of "arbitrary = easy to change" is a common misunderstanding of game theory.
      *   **Correct the Theory:** Explain *Coordination Equilibria*. The cost isn't in the *state* (Left vs. Right), it's in the *transition* (Moving from Left to Right).
      *   **Provide Plot Solutions:** How to make the political battle realistic within Lewis's framework.
          *   The "Focal Point" problem.
          *   The "Common Knowledge" problem.
          *   The "Transition Cost" problem.
      *   **Suggest Nuance:** Maybe the rule *wasn't* arbitrary originally (hidden function), or maybe it has accrued symbolic weight.
      *   **Conclusion:** Keep the conflict. It's theoretically sound.

  6.  **Refine the Tone:**
      *   Encouraging (it's a cool premise).
      *   Intellectual but accessible (acknowledge the lit major/game theory gap).
      *   Specific to the generation ship setting.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Opening:* Great premise. Lewis is the right guy, but don't cut the conflict.
      *   *Theoretical Correction:* Lewis says conventions are arbitrary *ex ante* (beforehand), not *ex post* (afterward). Once established, they are "sticky."
      *   *Game Theory Concept:* Nash Equilibrium. Everyone conforms because everyone else conforms. To change, you need to shift the equilibrium.
      *   *The "Transition Cost":* The period where half do A and half do B is dangerous.
      *   *The "Common Knowledge" hurdle:* I need to know that you know that I know we are switching.
      *   *Generation Ship Specifics:* Scarcity, safety, isolation make coordination harder.
      *   *Plot Ideas:* The reformer needs to solve the coordination problem, not just the logic problem. Maybe they need a crisis to force the switch.
      *   *Closing:* Trust your instinct, the conflict is valid.

  8.  **Final Polish:** Check against Lewis's specific claims. Lewis does discuss "precedence." The past regularity creates an expectation of future regularity. Breaking precedence requires overcoming the weight of history. This supports the "hard to change" argument. (Self-Correction: Make sure not to get too bogged down in philosophy jargon).

  9.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  Do not cut that subplot. Your instinct for conflict is correct, and your reading of Lewis is slightly tripping over the difference between *arbitrariness in origin* and *stability in equilibrium*.

  You have identified a fascinating tension between philosophical theory and narrative drama, but you don't need to sacrifice the drama to satisfy the theory. In fact, a deeper dive into Lewis (and the game theory surrounding him) suggests that arbitrary conventions are often the **hardest** things to change, precisely *because* they are arbitrary.

  Here is why your reformer should still have to fight a political battle, grounded in the very theory you're using.

  ### 1. The Coordination Problem (The Nash Equilibrium)
  Lewis defines a convention as a solution to a coordination problem. The classic example is driving: it doesn't matter if we all drive on the left or all drive on the right, but it matters immensely that we **all do the same thing.**

  Once a convention is established (e.g., "Walk on the Right"), it becomes a **Nash Equilibrium**. No single individual has an incentive to deviate. If I walk on the left while everyone else walks on the right, I cause collisions. I am worse off.

  To change the convention, you aren't just asking people to agree that "Left is as good as Right." You are asking them to coordinate a simultaneous switch. If only 10% of the ship switches to walking on the left, chaos ensues. The reformer isn't fighting against people who love the *old rule*; she is fighting against the **risk of the transition period.**

  **Plot Application:** The political battle isn't about the merit of the new rule. It's about trust. The elders argue, "Even if your way works, we can't guarantee everyone will switch at once. During the transition, people will get hurt. Is your efficiency gain worth the risk of collision?"

  ### 2. The Weight of Precedent
  Lewis emphasizes that conventions rely on **precedent**. We follow the rule because we expect others to follow it based on past behavior. The past behavior becomes a "focal point."

  On a generation ship, where history is likely mythologized, existing conventions aren't just habits; they are links to the ancestors. Even if the rule is arbitrary, the *adherence* to it signals group cohesion.
  *   **Old Guard Argument:** "We walk on the right because that is how the First Crew walked. To walk on the left is to sever a link with the Founders."
  *   **Reformer Argument:** "The Founders cared about safety, not direction. We honor them by optimizing the ship, not mimicking their muscle memory."

  This gives you immediate ideological conflict without violating Lewis's theory. The arbitrariness of the rule allows it to become a symbol, because it has no functional weight to distract from its symbolic weight.

  ### 3. The "Common Knowledge" Hurdle
  For a convention to shift, it requires **common knowledge**. It's not enough for me to know we are switching. I need to know that *you* know we are switching. And I need to know that *you* know that *I* know.

  In a large, decentralized society (even a ship), establishing common knowledge is a massive logistical and political hurdle. How does the reformer broadcast the switch? How do they ensure the hydroponics workers got the memo as well as the engineers? If there is a single pocket of resistance or ignorance, the new convention fails.

  **Plot Application:** The reformer's battle might be technical. She needs to hijack the comms system, or get the Assembly to vote on a specific "Switch Day," creating a focal point in time to match the focal point in behavior. The antagonists might try to disrupt the *communication* of the change, knowing that ambiguity preserves the status quo.

  ### 4. Hidden Dependencies (The "Second-Order" Conventions)
  Lewis notes that conventions often cluster. A primary convention (walk on the right) might spawn secondary conventions that are no longer arbitrary.
  *   Maybe the handrails are worn down on the right side.
  *   Maybe the emergency signage is angled for traffic flowing right.
  *   Maybe the queuing system outside hydroponics relies on people exiting on the right to merge with the line.

  Suddenly, the arbitrary rule has accrued **switching costs**. It is no longer true that "Left works exactly as well." Left works as well *in a vacuum*, but not in a ship built and worn by thirty years of Right-walking.

  **Plot Application:** The reformer has to prove she has accounted for the second-order effects. The antagonists point out the worn handrails as physical proof that the universe prefers the Right. The reformer has to argue for the long-term over the short-term cost.

  ### 5. Status Quo Bias and Rational Ignorance
  Finally, game theory accounts for human cognitive load. Evaluating a new proposal takes energy. Even if the new rule is theoretically equal, the **cost of evaluation** is a barrier.
  *   **Citizen Thought:** "I don't care which side we walk on. I've walked on the right since birth. You want me to expend mental energy monitoring my steps for three weeks while we switch? What do I get out of it?"

  If the reformer cannot demonstrate a *net benefit* (even if the benefit is just "fairness" or "modernity"), rational actors will remain indifferent, which functionally supports the status quo. Indifference is the reformer's enemy, not opposition.

  ### Summary
  David Lewis would agree with your editor that the rule is arbitrary. But he would also agree that **equilibria are sticky.**

  The conflict in your novel shouldn't be "Is Rule B better than Rule A?" (Because Lewis says they are equal). The conflict should be: **"How do we move 5,000 people from Equilibrium A to Equilibrium B without causing a collision during the switch?"**

  That is a political battle. It requires leadership, trust, communication infrastructure, and risk management. It is absolutely worth keeping.

  **One final literary thought:**
  The fact that the rule *is* arbitrary makes the fight more tragic, not less. If the old rule was actively harmful, the reformer is a hero. If the old rule is neutral, the reformer is a disruptor fighting against the sheer inertia of human habit. That is often a more poignant theme for a generation ship story: the realization that we are slaves to patterns that no longer serve us, yet are too afraid to break.

  Keep the fight. It tracks.
