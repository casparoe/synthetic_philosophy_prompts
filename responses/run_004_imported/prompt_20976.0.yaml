      *   *Move 2 (Devon):* **Right.** The infinite switching argument proves the conclusion is absurd.
      *   *Move 3 (Nora):* **Wrong.** She demands a specific error spot, but claims her math is "just linearity." Linearity applies to random variables, but she's mixing conditional probabilities incorrectly.
