      *   **Public Action:** Everyone sees what previous people chose, but *not* their private signals.
      *   **The Cascade Point:** Person $N$ sees a history of actions that implies so much information that their own private signal becomes irrelevant. Even if their signal says "Bad," the weight of previous "Adopt" actions makes "Adopt" the expected utility maximizer.
      *   **Fragility:** Since later people ignore their private signals, no new private information enters the public pool. The cascade is built on the early signals. If an early signal was wrong, everyone follows the wrong path. A small public shock can break it.

