answer: |-
  The rain hammered the tarp above the food truck festival, turning the grass to sludge. Two trucks sat side-by-side: *Nordic* and *Noodle*. Unknown to the customers, *Noodle* was serving fresh ingredients; *Nordic* was working from frozen stock. The goal was simple: maximize lunch quality. There was no reputation to protect; these were strangers who would never meet again.

  The first customer, Elias, checked his phone. He had a subscription to a food critic's live blog—a private signal. It rated *Noodle* highly. He joined the *Noodle* line.

  The second, Sarah, checked the same blog. It also rated *Noodle* highly. She joined Elias.

  The third, Marcus, checked his phone. His signal rated *Nordic*. He paused. He looked at the two people standing under the *Noodle* awning. He knew Elias and Sarah were rational actors like himself. They wouldn't stand in the rain unless their private information suggested *Noodle* was superior. 

  Marcus ran the calculus. The probability that both Elias and Sarah received false positive signals was low. The probability that his own single signal was incorrect was higher than the joint probability of the first two being wrong. His private information was now outweighed by the public history of actions. He ignored his phone, stepped into the *Noodle* line, and added his weight to the crowd.

  The cascade had begun.

  The fourth customer, Jen, saw three people at *Noodle*. She assumed Marcus, like the others, had acted on a positive private signal. She now faced the inferred weight of three positive signals against her own private signal, which suggested *Nordic*. The math was even starker than Marcus's. She joined the line.

  The fifth was David. David didn't check the blog. He walked past the *Noodle* truck and smelled the air. He was a chef; his nose was a high-precision instrument. He smelled burnt oil and stale broth from *Noodle*. He walked to *Nordic* and smelled searing scallops. His private evidence was strong—far stronger than a generic blog review.

  David looked at the line of four people shivering under the *Noodle* awning. He knew they couldn't smell what he smelled. But he also knew they possessed four private signals he didn't see. Even if his olfactory evidence was strong, was it stronger than four independent confirmations? 

  He calculated the likelihood. For the crowd to be wrong, all four previous customers would have had to receive misleading signals. For him to be wrong, his own nose would have to be mistaken. Statistically, it was more likely that four people were misled by bad reviews than that his own sensory data was flawed—but only if he assumed their actions reflected *four* independent signals. He didn't know Marcus had ignored his signal. To David, the public history looked like four votes. The weight of the inferred information crushed his private evidence. 

  David turned and joined the queue for the frozen food.

  Behind him, the line grew. Each new arrival saw a crowd at *Noodle* and inferred quality. None of them added new information to the pool; they merely echoed the past. The system had become fragile. The collective decision rested entirely on the accuracy of Elias and Sarah's initial phone checks. If a health inspector arrived—a piece of public, undeniable information—the cascade would shatter instantly. But without that shock, the group would rationally starve, bound by the invisible logic of what came before.
