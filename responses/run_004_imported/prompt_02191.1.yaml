      *   *Strategy:* I will acknowledge the standard view (CPA is key) but validate the user's deeper intuition: The *Harsanyi Doctrine* suggests rational agents *should* have common priors. Therefore, observing different priors is evidence of bounded rationality. Thus, the "load-bearing" constraint is effectively Rationality. If you are truly rational, you converge. If you trade, someone is "wrong."
