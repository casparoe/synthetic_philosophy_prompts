      *   *Epistemic Trust:* Markets are still good aggregators *because* of the noise. The noise provides the liquidity for the informed to trade. If everyone were perfectly rational (NTT world), there would be no market to aggregate from. The "failure mode" (irrationality/noise) is actually the *feature* that allows information aggregation to happen.

