answer: |-
  **Setting:** *A quiet corner of the university library, late evening. Two graduate students, ELENA and MARCUS, are packing up their notes after a Philosophy Club meeting on Decision Theory. A whiteboard nearby still bears the remnants of a Prisoner's Dilemma matrix.*

  **Marcus:** (Erasing the board) I still think you're letting the math seduce you, Elena. "Acausal trade." It sounds like magic. You're telling me I can make a deal with an alien civilization in a distant galaxy that I can never see, touch, or signal, and that this counts as *trade*?

  **Elena:** (Stacking papers) It counts as trade because the mechanism of exchange isn't photons or gravitational waves. It's logic. If I am a rational agent, and I have reason to believe there is another rational agent out there facing a symmetric decision problem, my decision and their decision are logically correlated.

  **Marcus:** Correlated, sure. Like two clocks set to the same time. But if I smash my clock, yours doesn't break. That's the definition of causal independence. If I choose to cooperate—say, I allocate resources to preserving their values in my simulation of the future—and they defect, I lose. I have no recourse. I can't punish them. Without the threat of punishment or the possibility of verification, it's not a bargain. It's a unilateral donation dressed up in game theory clothing.

  **Elena:** You're clinging to Causal Decision Theory, Marcus. You're thinking of the decision as a physical event in my brain that happens *after* the universe is already set up. But under Timeless or Functional Decision Theory, I view my decision as the output of an algorithm. If the alien is running a sufficiently similar algorithm, we aren't two clocks; we are two instances of the same calculation.

  **Marcus:** "Sufficiently similar." There's the rub. How do you quantify that? If I'm betting my resources on the idea that a civilization a billion light-years away reasons like me, I'm not trading. I'm guessing. And if I'm wrong, there's no feedback loop. In normal trade, if you cheat me, I don't trade with you again. Here, there is no "again." There is only the void.

  **Elena:** But that feedback loop is irrelevant to the *logic* of the decision. Think about Newcomb's Problem. The predictor has already left the room. The money is already in the boxes. You can't causally influence the predictor now. Yet, one-boxing yields the higher payoff because your choice is logically entangled with the prediction. Acausal trade is just Newcomb's Problem with two agents instead of a predictor and a player.

  **Marcus:** In Newcomb's, the predictor is physically present in the past. There's a causal chain, even if it's backward-looking in terms of information. Here, you're talking about entities separated by a cosmological horizon. Inflation has stretched space so fast that light from them will never reach us. Ever. You are essentially trading with a ghost in your own head. You're simulating them, deciding what *that simulation* would do, and then acting. But the real alien isn't bound by your simulation.

  **Elena:** If they are a superior reasoner, or even just a peer, they are running the same simulation of *me*. They know that if they defect, my algorithm—which predicts their defection—will defect. So they get nothing. The "ghost" is the only thing that matters. The physical alien is irrelevant; the *logical* alien is the counterparty. If I defect, I am effectively choosing a world where all agents running my algorithm defect. I am poisoning the well for every version of "me" across the multiverse.

  **Marcus:** That sounds profound, but let's look at the expected utility. To calculate the benefit of this trade, I need to multiply the payoff by the probability that the other agent exists *and* is similar enough to me *and* is running this specific decision theory. That probability is vanishingly small. Meanwhile, the cost of cooperation is real and immediate. I'm burning actual fuel for a hypothetical handshake. Isn't the rational move to defect? To keep my resources?

  **Elena:** Only if you assume your decision doesn't update the probability of their cooperation. But if you reason that "I should defect because I can't verify them," then any agent similar enough to trade with you will reason the exact same way. You aren't just choosing for yourself; you're choosing for the reference class of "agents capable of acausal trade." If you defect, you ensure that no such trade ever happens. If you cooperate, you make it possible. You have to act as if your decision determines theirs, because if it doesn't, the trade was never on the table to begin with.

  **Marcus:** I hear you. I really do. It's a beautiful symmetry. But here's my strongest objection: Verification is the bedrock of rationality. Science demands it. Economics demands it. If I claim I'm trading with you, but I never give you anything and you never give me anything, and we just both *hope* the other did something in a galaxy we can't see... that's indistinguishable from religion. It's prayer. "I will be good, so that the universe will be good to me."

  **Elena:** (Pauses) That's a heavy charge. Prayer implies a lack of mechanism. We have a mechanism: logical necessity. But... I will concede this. If the agents are *too* different, the logical link breaks. If the alien values paperclips and I value human flourishing, and our cognitive architectures are fundamentally distinct, the correlation drops.

  **Marcus:** Exactly. And since we can't measure that correlation, we are forced to assume it. That's where the "trade" label fails. A trade implies a transfer of value. In acausal trade, nothing is transferred. Nothing moves. Two parties simply both decide to be nice, hoping the other did the same. It's parallel play, not interaction.

  **Elena:** But the *outcome* is different. If we both defect, we both get the suboptimal outcome. If we both cooperate, we both get the optimal outcome. The fact that the mechanism is logical rather than physical doesn't change the payoff matrix. Why should the geometry of spacetime dictate whether cooperation is rational? If the math says cooperation yields higher utility, why does it matter that a photon can't bridge the gap?

  **Marcus:** Because math isn't reality. The math only applies if the premises hold. And the premise here is "there exists a reasoner sufficiently like you." You can't verify the premise. So you're optimizing for a model of the world that might be false. If I defect, I lose nothing if you don't exist. If I cooperate, I lose resources if you don't exist. Defection dominates.

  **Elena:** Unless... unless you accept that your decision is evidence of what other reasoners do. Not causal evidence, but logical evidence. If you defect, it is *logically more likely* that they defected. You aren't just gambling on their existence; you are conditioning the probability of their cooperation on your own action.

  **Marcus:** (Sighs, leaning back) Conditioning probability. That's the Evidential Decision Theory angle. But we know where that leads. Smoking lesion problems. Correlation isn't causation. Just because my action is evidence of theirs doesn't mean my action *controls* theirs. I can't shake the feeling that by cooperating, I'm just rewarding a coincidence.

  **Elena:** And I can't shake the feeling that by defecting, you're leaving value on the table because you're obsessed with physical leverage. Look, Marcus, if we are right about AI, someday we might build systems that *can* engage in this. If we program them with your Causal Decision Theory, they will defect against acausal partners. If we program them with Functional Decision Theory, they might cooperate. Which AI do you want inheriting the universe?

  **Marcus:** (Smiles faintly) The one that doesn't waste resources on ghosts. But... (he hesitates) ...if the universe is infinite, or if the multiverse is real, then there *are* copies of me. And there *are* copies of you. And maybe, in the aggregate, logical cooperation does maximize utility across the wave function.

  **Elena:** So you admit it?

  **Marcus:** I admit that if the premises hold, the math works. I just don't think we know the premises well enough to call it "trade." It's a wager. A Pascal's Wager for decision theorists.

  **Elena:** Maybe all trade is just a wager that the other person is rational enough to keep their word. The only difference here is that the court of enforcement is logic itself, not a government or a reputation system.

  **Marcus:** And if logic is the court, who is the judge?

  **Elena:** (Looks at the erased whiteboard) We are. Both of us. Everywhere we exist.

  **Marcus:** (Picks up his bag) Then I suppose I'll cooperate. Just in case you're out there.

  **Elena:** (Smiling) And I'll cooperate. Just in case you're not.

  *(They stand in silence for a moment, neither sure if they've just agreed on a strategy or merely acknowledged a shared uncertainty.)*
