  *(Self-Correction Note during final review)*: I need to make sure I don't accidentally validate FDT/TDT as "correct" science, but present it as a philosophical position. The prompt asks for a debate, not a lecture. Ensure Marcus's skepticism feels equally robust, not just like a strawman. Marcus should represent the common-sense causal view which dominates standard economics and game theory.

