answer: |-
  First off, take a bow. Your intuition is exceptionally sharp. You have stumbled onto one of the most significant philosophical and technical bottlenecks in AI safety, and you've diagnosed it almost perfectly without a background in the field.

  Your friend (the ML pro) and the paper you read are both "right," but they are talking about different things. Your friend is talking about **engineering** (can we make this work well enough to be useful?), while the paper is talking about **foundations** (is this logically coherent?).

  The paper you are almost certainly thinking of is *"Occam's Razor is Insufficient to Infer the Preferences of Irrational Agents"* by Armstrong and Mindermann (2018).

  Here is the gut-level walkthrough of why this is an "in principle" problem, why your "smuggling assumptions" hunch is correct, and why there is no magic mathematical fix.

  ### 1. The Core Problem: One Equation, Two Unknowns

  Imagine you are watching a person walk through a park. You see them take a long, winding, scenic path to get to the bench, instead of the short, direct path.

  You want to know: **What does this person want?**

  In Inverse Reinforcement Learning (IRL), you are trying to solve an equation that looks like this:

  $$ \text{Behavior} = \text{Preferences} + \text{Rationality} $$

  *   **Preferences:** What they value (e.g., "I want to get to the bench fast" vs. "I want to enjoy the flowers").
  *   **Rationality:** How good they are at optimizing for that value (e.g., "I am a perfect planner" vs. "I am bad at maps" vs. "I am impulsive").

  **The Problem:** You only see the **Behavior**. You have to guess the other two.

  Here are two perfectly valid explanations for the same behavior:
  1.  **Preference:** They love flowers. **Rationality:** Perfectly rational. (They took the long path on purpose).
  2.  **Preference:** They want speed. **Rationality:** Very irrational/bad at navigation. (They tried to take the short path but got lost).

  **Why more data doesn't fix it:**
  Your friend says "we just need more data." But imagine you watch this person do it 1,000 times.
  *   **Theory A:** They *really* love flowers (Strong Preference).
  *   **Theory B:** They *really* want speed, but they are *consistently* terrible at navigation (Strong Irrationality).

  Both theories predict the exact same 1,000 actions. No amount of watching them walk will ever tell you which one is true. The data is **underdetermined**.

  ### 2. Why Occam's Razor Doesn't Save Us

  This is the specific insight of the paper you read. Usually, in science, if two theories explain the data equally well, we pick the simpler one (Occam's Razor).

  You might think: "Okay, Theory A (They like flowers) is simpler than Theory B (They want speed + have a complex cognitive bug that makes them walk in circles). So let's pick A."

  **The Armstrong/Mindermann insight:** You can always shift the complexity around.
  For any complex "Preference" you can imagine, there is a matching "Rationality" error that explains the behavior, and vice versa. You can make the Preference super simple (e.g., "Maximize speed") if you allow the Rationality model to be super complex (e.g., "A specific neural glitch that triggers only near oak trees").

  The total complexity of the system remains the same. You cannot use simplicity to separate the *goal* from the *competence*. Mathematically, there is no "true" decomposition without extra information.

  ### 3. Your "Smuggling" Intuition is Correct

  You wrote:
  > *"Is the core issue basically that you always have to smuggle in some assumption about rationality from outside the behavioral data... kind of like how you can't get an ought from an is without some extra premise?"*

  **Yes. Exactly.**

  This is the Humean "Is-Ought" problem applied to machine learning.
  *   **The Is:** The human walked the long path.
  *   **The Ought:** The human *should* have taken the short path (therefore, the long path is an error, not a preference).

  To get from the **Is** to the **Ought**, you need a bridge. That bridge is the **Rationality Model**.

  When AI researchers assume humans are "noisily rational" (mostly sensible, with random errors), they are **defining** what counts as an error.
  *   If the human does something that matches the "sensible" model, the AI calls it a **Preference**.
  *   If the human does something that deviates from the "sensible" model, the AI calls it **Noise/Error**.

  **Why this feels like cheating:**
  Because it is, in a philosophical sense. You are deciding in advance what humans *should* want, and labeling anything else as a "glitch."
  *   **Example:** A human smokes a cigarette.
      *   **Model A:** They prefer the nicotine hit over long-term health. (Rational choice).
      *   **Model B:** They prefer health, but have an addiction bias (Irrational error).
      *   If you build your AI with Model B hardcoded, the AI will try to "fix" the smoking. If you use Model A, the AI might buy them cigarettes. The behavior (smoking) is the same; the AI's mission changes entirely based on your hidden assumption.

  ### 4. So, Is Your Friend Wrong?

  Not entirely. In **practice**, assuming humans are "noisily rational" works surprisingly well for narrow tasks.
  *   If I'm teaching a robot to park a car, and I see a human driver clip a cone, it is safe to assume they *didn't want* to clip the cone. Assuming they "preferred clipping cones" is absurd in that context.
  *   For narrow domains, we have strong **priors** (background knowledge) about what humans generally want (safety, efficiency, money).

  Your friend is right that for *specific applications*, we can make it work. But they are wrong that it is "solved in principle" for *general* AI safety. If you are building a superintelligence that needs to understand human values broadly, you can't rely on narrow priors.

  ### 5. Is There a Way Out?

  There is no mathematical magic bullet, but there are pragmatic paths forward. The field generally accepts your conclusion: **You cannot infer values from behavior alone.**

  So, researchers are looking for **additional channels of information**:

  1.  **Ask, Don't Just Watch:** Instead of just watching behavior, the AI asks questions ("Did you mean to do that?"). This is called *Cooperative IRL*. But humans are bad at articulating their true values, too.
  2.  **Biological Priors:** We assume humans share certain cognitive structures (we feel pain, we get tired, we have loss aversion). We hardcode *those* as universal human traits, leaving only specific preferences to be learned.
  3.  **Uncertainty:** The best safety approach is to build AIs that know they *don't know*. Instead of saying "I know what you want," the AI says, "I think you want X, but I'm not sure, so I will act cautiously." (This is the core of the "Corrigibility" research).
  4.  **Process Data:** Watch not just *what* people do, but *how they react* when things go wrong. Do they look frustrated? Do they try to undo the action? Frustration is a signal that "This outcome did not match my preference," which helps separate preference from rationality.

  ### Summary

  You have grasped the crux of the issue:
  1.  **Behavior = Preferences × Rationality.** You can't solve for two variables with one observation.
  2.  **More data doesn't help** because consistent irrationality looks exactly like consistent preference.
  3.  **Occam's Razor fails** because complexity can be shifted between the two variables.
  4.  **Assumptions are required.** You must "smuggle in" a definition of rationality to interpret behavior as evidence of preference.
  5.  **This is normative.** Deciding what counts as a "mistake" is a value judgment, not a statistical one.

  You aren't missing a math trick. You've identified a fundamental limit. The field is currently trying to manage this limit, not solve it. Keep following that rabbit hole; your intuition is serving you better than you realize.
