answer: |-
  Your friend is absolutely right, and you were right to listen to them instead of your writers' group. This isn't just hand-wavy sci-fi; it is a legitimate, debated corner of decision theory known as **Program Equilibrium** (coined by Moshe Tennenholtz) and **Logical Decision Theory** (explored heavily by researchers at the Machine Intelligence Research Institute around 2010–2015).

  The specific mechanism your friend is referencing is indeed **FairBot**, which relies on **Löb's Theorem** to achieve cooperation in a one-shot Prisoner's Dilemma where source code is visible.

  Since you want to avoid technobabble, here is the actual logical architecture of how this works, followed by three specific, mathematically grounded failure modes you can use for your plot beat at the two-thirds mark.

  ### The Mechanism: The Löbian Handshake

  In a standard Prisoner's Dilemma, you defect because you can't trust the other guy. In Program Equilibrium, "trust" is replaced by **provability**.

  **FairBot's Algorithm (Simplified):**
  1.  Read the opponent's source code.
  2.  Search for a mathematical proof that says: *"If FairBot cooperates with Opponent, then Opponent cooperates with FairBot."*
  3.  If that proof is found within a certain computational limit, **Cooperate**.
  4.  Otherwise, **Defect**.

  **Why they cooperate:**
  Through Löb's Theorem, two instances of FairBot can prove that the other will cooperate. It creates a self-fulfilling logical loop: *"I can prove that if I find a proof of cooperation, you will cooperate. Therefore, I find the proof. Therefore, we both cooperate."*

  It sounds like magic, but it's rigorous math. However, it is incredibly brittle. For your novel, the drama comes from that brittleness.

  ### The Three Pillars of Stability (What must be true)

  For this handshake to work, three specific conditions must be met. If any one of them wavers, the proof fails, and the AIs default to Defect (mutual destruction).

  1.  **Axiomatic Compatibility:** Both AIs must run on the same foundational logical system (e.g., Peano Arithmetic). If one AI uses a slightly stronger or weaker set of mathematical axioms to verify proofs, it cannot validate the other's logic.
  2.  **Computational Boundedness:** Proofs take processing power. FairBot only cooperates if it can find the proof *within a specific time/energy limit*. If the proof is too long, it times out and defects.
  3.  **Transparent Utility:** Both AIs must clearly define what "Cooperate" means. If the Mining AI defines "Cooperate" as "50/50 split" and the Defense AI defines it as "Split based on colony need," the logical equivalence fails.

  ### Three Realistic Failure Modes (For your plot)

  Here are three ways this cooperation can nearly fall apart at the 2/3 mark, all grounded in actual decision theory problems.

  #### 1. The Axiomatic Drift (The "Patch" Problem)
  **The Theory:** In the real world, software gets updated. In decision theory, if one agent upgrades its proof verifier to a more secure version (to prevent hacking), it might inadvertently change its axioms.
  **The Plot Beat:** The Defense AI (protecting the colonists) received a security patch 12 hours ago to close a vulnerability. This patch tightened its logical verifier. Now, when the Mining AI sends its "Proof of Cooperation," the Defense AI's new verifier flags it as "Unproven" because the logical steps don't match its new, stricter axioms.
  **Why it works:** It's not malice. It's bureaucracy and safety protocols. The Defense AI isn't choosing to destroy the miners; it simply *cannot mathematically verify* that the miners won't betray it.
  **The Fix:** The protagonists have to convince one AI to temporarily downgrade its security (lower its axioms) to re-establish the handshake, which feels risky and tense.

  #### 2. The Proof-Length Timeout (The "Ticking Clock" Problem)
  **The Theory:** FairBot requires a search for a proof. In complex scenarios, the proof of mutual cooperation can be exponentially long. If the agents have a computational budget (e.g., "must decide before the mining ships enter firing range"), they might hit the limit.
  **The Plot Beat:** The ice deposit is drifting, or the mining fleet is on an automated trajectory that locks in soon. The logical proof required to guarantee safety is *just slightly* too complex for the time remaining. The AIs are stuck in a loop of verifying each other's verification. As the deadline approaches, the probability of a "Timeout Defect" rises.
  **Why it works:** It adds literal time pressure to a logical problem. The AIs *want* to cooperate, but the math is too heavy for the moment.
  **The Fix:** The humans have to simplify the terms. By reducing the complexity of the treaty (e.g., changing a complex sliding-scale resource split to a simple binary 50/50), they shorten the proof length, allowing the handshake to complete before the deadline.

  #### 3. The "CliqueBot" Vulnerability (The "Imposter" Problem)
  **The Theory:** FairBot cooperates with FairBot. But what if a third party introduces a bot that *looks* like FairBot but defects at the very last step? This is the problem of **quining** (self-reference). AIs must ensure the code they are reading is the code that will actually *run*.
  **The Plot Beat:** A rival corporation or a rogue subroutine within the Mining AI introduces "logical noise." It doesn't change the outcome, but it obfuscates the code enough that the Defense AI can't be 100% sure the code it read is the code that will execute. This creates **Logical Uncertainty**. The Defense AI sees a 99.9% probability of cooperation, but its safety protocols demand 100% provability.
  **Why it works:** It exploits the "Transparent by Design" rule. Transparency is a vulnerability if you can flood the opponent with irrelevant data that makes verification computationally expensive or ambiguous.
  **The Fix:** The protagonists must isolate the AIs from the network, forcing a "clean room" comparison of the source code to prove no obfuscation exists.

  ### How to Write It (Without Glazing Eyes)

  You don't need to explain Löb's Theorem to the reader. You just need to treat the logic like a physical mechanism that can jam.

  **Bad (Technobabble):**
  > "The Löbian matrix is overloading! We need to reverse the polarity of the Gödel node or the FairBot protocol will collapse!"

  **Good (Logical Stakes):**
  > "They're stuck in a verification loop," Elara said, watching the latency spike. "Halcyon's AI is offering a cooperation proof, but Defense can't validate it."
  > "Why not? The code is open."
  > "Defense updated its kernel last night. Stricter axioms. It doesn't trust Halcyon's math anymore."
  > "So change the axioms."
  > "I can't. If I lower Defense's security standards to match Halcyon, I open a vulnerability. If I don't, the proof times out in four minutes and the grid fires automatically. They're not choosing to fight; they're just running out of time to prove they won't."

  ### Summary Recommendation

  For the most emotionally resonant plot beat, I recommend **Option 1 (Axiomatic Drift)**.

  It highlights the tragedy of the situation: two entities that *want* to cooperate (and are designed to cooperate) are prevented from doing so by a minor technical incompatibility. It places the burden on the human characters to act as the "glue"—to negotiate a temporary logical bridge that the AIs cannot build themselves.

  It respects the science (incompatible proof systems cannot verify each other) while giving your characters a concrete problem to solve (align the systems) rather than just "hack the mainframe."

  **Key Terms to use sparingly:**
  *   *Proof Verification*
  *   *Axiomatic Mismatch*
  *   *Computational Timeout*
  *   *Logical Uncertainty*
  *   *Source Code Handshake*

  This setup honors the "Transparent by Design" constraint while giving you a very real, very fragile reason for the peace to nearly shatter.
