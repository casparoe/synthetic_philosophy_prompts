answer: |-
  Colleagues,

  The consensus in this room is understandable. Earman and Norton's presentation of the Hole Argument is designed to force a dilemma: accept radical indeterminism or abandon manifold substantivalism. Most of you have chosen the latter, concluding that if we cannot track spacetime points across diffeomorphic models (i.e., if we deny haecceitism), then positing the points at all is an ontological idle wheel. If the points have no trans-model identity, you argue, they are indistinguishable from the structural nodes posited by relationalism. Therefore, sophisticated substantivalism (SS) is merely relationalism wearing substantivalist clothing—a verbal dispute with no metaphysical bite.

  I want to persuade you that this verdict is premature. It rests on a specific, and I argue mistaken, conception of what ontological commitment is *for*. The charge of emptiness assumes that the only job spacetime points could possibly do is to serve as anchors for haecceitistic counterfactuals (e.g., "Point *p* could have had different metric properties"). Once sophisticated substantivalists like Butterfield, Brighouse, and Hoefer deny that such counterfactuals are meaningful (by accepting Leibniz Equivalence), the relationalist concludes the points have no work left to do.

  This is a category mistake. It assumes the *only* function of a substance is to support trans-world identity. I will argue that sophisticated substantivalism is metaphysically substantive because it gets the direction of ontological dependence right in a way relationalism cannot, specifically regarding the nature of fields, the reality of vacuum solutions, and the grounding of physical structure.

  ### 1. Distinguishing Substance from Haecceitism

  The first step is to disentangle substantivalism from haecceitism. The Hole Argument shows that *Manifold Substantivalism + Haecceitism* leads to indeterminism. The sophisticated substantivalist drops Haecceitism, not the Manifold.

  Why is this not a retreat to relationalism? Because relationalism is not merely the denial of haecceitism; it is the claim that spacetime facts *reduce* to facts about material relations (or, in more modern structuralist versions, that spacetime is nothing over and above the structural relations themselves). Sophisticated substantivalism maintains that spacetime points are concrete particulars that exist *prior* to the metric field defined upon them.

  The "emptiness" charge asks: "If point *p* in model *M* and point *p'* in diffeomorphic model *M'* are not the 'same' point in a haecceitistic sense, what does it matter that they exist?" The answer is that their existence matters *intra-model*, not *inter-model*. In any given model, the metric field $g_{ab}$ is a property *of* the points. For the relationalist, the "points" are merely logical constructs derived from the intersection of relations. For the sophisticated substantivalist, the points are the *bearers* of the properties.

  This is not verbal. It is a disagreement about the category of being. If I say "the charge is a property of the electron," and you say "the electron is just a bundle of properties including charge," we agree on the empirical predictions, but we disagree on the ontology. Similarly, SS says the geometry is a property of the spacetime points; relationalism says the geometry *constitutes* the spacetime. This matters for how we understand the nature of physical fields.

  ### 2. The Argument from Vacuum Solutions

  The most decisive argument against the claim that SS is "relationalism in disguise" concerns empty spacetimes.

  Standard relationalism (à la Leibniz or Mach) defines spatial and temporal relations in terms of relations between material bodies. In General Relativity, however, we have valid solutions to the Einstein field equations that contain no matter (e.g., Minkowski space, gravitational wave solutions in a vacuum).

  The relationalist faces a steep burden here. To make sense of an empty universe, they must resort to counterfactuals: "This region of spacetime exists because *if* matter were placed here, it would stand in such-and-such relations." This reduces the actual existence of spacetime to a modal fact about non-existent matter.

  Sophisticated substantivalism handles this naturally. It posits that the manifold points exist independently of the matter distribution. In a vacuum solution, the metric field is still a field *on* the manifold. The points are there, bearing the metric properties, even if there is no matter to relate.

  If SS were just verbal relationalism, it would have to adopt the same awkward counterfactual stance regarding empty universes. But it doesn't. It asserts that the spacetime points are real constituents of the vacuum universe. This is a substantive ontological claim: it asserts the existence of concrete particulars in the absence of material relata. That is not a verbal difference; it is a disagreement about what exists in a vacuum solution.

  ### 3. Grounding Structure vs. Being the Structure

  The charge of emptiness suggests that without trans-model identity, points are merely "nodes in a structure." But this conflates the *role* points play in the mathematics with their *ontological status*.

  Consider the difference between a graph and the physical system it represents. A graph consists of nodes and edges. A structural realist might say the physical system *is* the graph. The sophisticated substantivalist says the physical system *instantiates* the graph, where the nodes are concrete spacetime points.

  Why does this matter? Because it resolves the "problem of missing relata" that plagues ontic structural realism (a close cousin of modern relationalism). If structure is fundamental, what are the relations relations *between*? If the answer is "nothing," relations seem to float free of ontology. If the answer is "the nodes," but the nodes are just bundles of relations, we face circularity.

  Sophisticated substantivalism breaks this circle. The points are the non-derivative relata. They ground the structure. Denying haecceitism does not mean the points lack individuality *within* a model; it means their individuality is not captured by a primitive "thisness" that persists across diffeomorphic redescriptions. They are individuals by virtue of being distinct particulars, not by virtue of having unique haecceities that survive coordinate transformations.

  When Butterfield and Brighouse argue for this view, they are not trying to hide relationalism. They are arguing that we can have the ontological benefits of substantivalism (a clear account of fields, a natural handling of vacuum solutions, a grounding for structure) without the pathological metaphysical commitments (haecceitism) that lead to indeterminism.

  ### 4. Naturalism and Mathematical Practice

  Finally, consider the argument from scientific naturalism. When physicists construct a spacetime model in GR, they begin with a manifold $\mathcal{M}$ and define a metric $g$ on it. The mathematical practice treats the points of $\mathcal{M}$ as the domain of the fields.

  Relationalism requires an interpretive layer over this practice. It must say: "Although the math looks like it's about points on a manifold, what it *really* means is relations between events/matter." This is a hermeneutic maneuver.

  Sophisticated substantivalism takes the mathematical ontology at face value. It says: "The math quantifies over points; therefore, points exist." The only adjustment it makes is to the *modal semantics* of how those points correspond across models. It accepts Leibniz Equivalence not because points are fake, but because diffeomorphisms represent a redundancy in our *description*, not a difference in the *world*.

  To call this "verbal" is to imply that taking the ontology of our best physics seriously is a linguistic choice. It is not. It is a commitment to the idea that the field is a physical entity distributed over a substrate. If you deny the substrate, you must explain what the field is a field *of*. If you say "it's just a field," you risk turning the field into a substance itself (metric substantivalism), which faces its own difficulties regarding background independence. Manifold substantivalism, sophisticated to avoid the Hole Argument, preserves the distinction between the container (manifold) and the content (metric/matter) without falling into the trap of thinking the container has a magical trans-world identity.

  ### Conclusion

  The verdict that sophisticated substantivalism is empty rests on the assumption that ontological commitment must purchase haecceitistic modal realism. If you believe that the only point of positing an entity is to track it across all possible worlds in a haecceitistic fashion, then yes, SS looks empty.

  But that is a poor theory of ontological commitment. We posit electrons not because we can track their haecceity across all possible worlds, but because they ground the properties and behaviors we observe in *this* world. Similarly, sophisticated substantivalism posits spacetime points because they ground the metric field and allow for a coherent ontology of empty spacetimes.

  It differs from relationalism because it treats points as *ontological grounds* rather than *logical constructs*. It differs from naive substantivalism because it recognizes that the mathematical redundancy of diffeomorphism invariance reflects a physical symmetry, not a multiplicity of worlds.

  This is not a verbal dispute. It is a disagreement about whether spacetime structure hangs free of relata, or whether it is borne by concrete particulars that exist even when matter does not. For the purposes of your seminar, I urge you to treat sophisticated substantivalism not as a desperate salvage operation, but as a robust metaphysical position that respects both the mathematics of GR and the demands of a coherent ontology.
