answer: |-
  This is a foundational tension in the economics of information, and disentangling it requires precise attention to the structural assumptions underlying decision theory versus general equilibrium theory. As a PhD student, you likely recognize that Good's (1967) theorem is a result in *individual decision theory*, while Hirshleifer's (1971) effect is a result in *general equilibrium*. The friction arises when one attempts to map the former onto the latter without adjusting for market feedback loops.

  Here is an analysis of the specific assumptions Good's theorem relies upon that Hirshleifer's scenario violates, and the consequent implications for regulatory welfare analysis.

  ### 1. The Crucial Violation: Invariance of the Opportunity Set

  Good's theorem states that for a Bayesian expected-utility maximizer, the expected utility of acting *with* cost-free information is at least as high as acting *without* it. Formally, if $A$ is the set of available actions and $u(a, \omega)$ is the payoff function, the value of information is non-negative because the agent can always choose to ignore the signal and replicate the no-information action.

  However, this result rests on a critical, often implicit background assumption: **The Invariance of the Feasible Set and Payoff Function.**

  Good's theorem assumes that:
  1.  The set of feasible actions $A$ is fixed.
  2.  The mapping from actions and states to payoffs, $u(a, \omega)$, is fixed.
  3.  The information signal affects only the agent's posterior beliefs $P(\omega|s)$, not the structural constraints of the problem.

  **Hirshleifer's scenario violates this invariance assumption through endogenous price formation.**

  In a financial market, the "action" is purchasing a portfolio, and the "payoff" is consumption. However, the budget constraint is defined by prices $p$. In a rational expectations equilibrium, prices are a function of the information structure $\mathcal{I}$ available to the market ($p = p(\mathcal{I})$).

  When public information is released *before* trading:
  *   The state space effectively collapses (uncertainty is resolved).
  *   Prices adjust immediately to reflect the realized state.
  *   **The Budget Set Shifts:** The terms of trade change. Specifically, the ability to trade state-contingent claims at *ex-ante* odds disappears.

  In Good's framework, information expands the agent's *knowledge* without shrinking their *opportunity set*. In Hirshleifer's framework, public information can shrink the *effective opportunity set* for risk-sharing. By resolving uncertainty before agents can contract on it, the market eliminates the very states against which agents wished to insure. The payoff function $u(\cdot)$ effectively changes because the prices determining the trade-off between consumption in different states have become degenerate (or simply reflect the realized state rather than the prior distribution).

  Therefore, Good's theorem does not "fail"; rather, its **ceteris paribus** condition regarding the opportunity set is violated by the general equilibrium price effect.

  ### 2. The Pecuniary Externality

  A second, related violation concerns **strategic independence**. Good's theorem is derived for a single agent (or multiple agents acting independently without affecting each other's payoffs). It ignores externalities.

  In Hirshleifer's setting, information generates a **pecuniary externality**. When information is made public, it alters the equilibrium prices faced by *all* participants.
  *   If I receive private information (in a model with insider trading), I trade on it, moving prices slightly.
  *   If information is *publicly* mandated, it moves prices for everyone simultaneously.

  While Good's theorem guarantees that *I* benefit from the information holding prices constant, it does not account for the fact that the information release changes the prices I face. In the Hirshleifer effect, the price adjustment is so profound (resolving the uncertainty entirely) that it destroys the gains from trade. The welfare loss comes from the fact that the information changes the *terms of trade* in a way that makes the agents worse off ex-ante, even though they are making "better" (more informed) decisions ex-post.

  Good's theorem calculates the **private value of information**. Hirshleifer highlights the divergence between private value and **social value** (or even ex-ante private value) when market completeness is endogenous to the information structure.

  ### 3. Implications for Regulatory Welfare Analysis

  For your paper on mandatory disclosure, this distinction provides the theoretical grounding to challenge the "more disclosure is always weakly welfare-improving" mantra. Here are the specific implications you should articulate:

  #### A. Distinguish Between Productive and Risk-Sharing Efficiency
  Regulators often justify disclosure on the grounds of **productive efficiency** (capital allocation): better information leads to better investment decisions (e.g., Myers and Majluf, 1984). Good's theorem supports this: if managers know more, they invest better.

  However, Hirshleifer warns about **risk-sharing efficiency**. If disclosure resolves uncertainty before risk-averse agents can trade, it impedes insurance.
  *   **Regulatory Implication:** Welfare analysis must weigh the gains from improved capital allocation against the losses from impaired risk-sharing. In markets where risk-sharing is the primary function (e.g., certain derivatives or insurance-linked securities), mandatory pre-trade disclosure may be welfare-reducing.

  #### B. The Timing of Disclosure is Endogenous to Welfare
  Good's theorem is timeless; information is valuable whenever it arrives. Hirshleifer's result is highly sensitive to timing.
  *   **Pre-Trade Disclosure:** Risks the Hirshleifer effect (destroying risk-sharing).
  *   **Post-Trade Disclosure:** Preserves risk-sharing opportunities (agents trade on priors) while ensuring settlement transparency and reducing adverse selection in *future* rounds.
  *   **Regulatory Implication:** Regulators should not treat disclosure as a binary "on/off" switch but as a timing mechanism. Mandating disclosure *after* positions are established (but before settlement) often captures the governance benefits of transparency without triggering the Hirshleifer risk-sharing destruction.

  #### C. Market Completeness Matters
  The Hirshleifer effect is strongest when markets are **incomplete**. If markets were complete (Arrow-Debreu securities for all states existed and could be traded *before* information arrival), agents could fully insure regardless of information arrival.
  *   **Regulatory Implication:** In real-world incomplete markets, the "cost" of information is higher than Good's theorem suggests. Regulators should be more cautious about mandating disclosure in nascent or thin markets where risk-sharing mechanisms are fragile, compared to deep, liquid markets where agents can hedge around the disclosure.

  #### D. Ex-Ante vs. Ex-Interim Welfare
  Good's theorem is often interpreted as an ex-interim result (given I exist and have priors, should I look at the signal?). Hirshleifer forces an **ex-ante** perspective (behind the veil of ignorance, do we want this information regime?).
  *   **Regulatory Implication:** Justifying disclosure rules requires an ex-ante welfare standard. Even if every investor benefits from reading a 10-K *ex-post* (Good), the *requirement* to produce it might lower ex-ante welfare if it systematically degrades market liquidity or risk-sharing capacity (Hirshleifer). The regulator's objective function should prioritize ex-ante welfare, which may diverge from the sum of ex-post individual utilities.

  ### Summary for Your Draft

  You can frame the resolution of the tension as follows:

  > "Good's theorem guarantees the non-negative value of information only under the assumption of a fixed opportunity set and absent pecuniary externalities. Hirshleifer's result demonstrates that in general equilibrium, public information is not merely a signal that updates beliefs; it is a shock to the price system that alters the feasible set of risk-sharing arrangements. Consequently, the regulatory presumption that 'more disclosure is always weakly welfare-improving' relies on a partial equilibrium fallacy. Valid welfare analysis must account for the endogenous response of prices and the potential for information to collapse the state-space available for insurance, particularly in incomplete markets."

  This framing acknowledges the validity of Good's theorem within its domain while precisely isolating the general equilibrium mechanisms that render it insufficient for justifying mandatory disclosure policy.
