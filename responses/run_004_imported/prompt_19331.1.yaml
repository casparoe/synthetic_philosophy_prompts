prompt: |-
  I sit on the board of a mid-sized research foundation and recently finished my first stint as an ordinary panelist on one of our grant-review panels. The board is about to vote on our executive director's proposal to triple every panel, from four reviewers to twelve, on the theory that more independent judgment converges on better funding decisions, especially on our closest calls. However, what I saw during calibration calls made me skeptical: reviewers are drawn from a small, overlapping set of subfields, scores drift toward whoever speaks first or most confidently, and on the genuinely contested proposals -- the ones this reform is meant to help with -- I doubt any single reviewer is even reliably right more than half the time. Please draft the memo I'll circulate to the board before the vote: take a clear position on the proposal, engage seriously with the "more independent judgment" reasoning rather than dismissing it outright, and say concretely what, if anything, would actually fix the problem it's meant to solve.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Board member of a mid-sized research foundation.
      *   **Context:** Recently served as a panelist. Board is voting on ED's proposal to triple panel size (4 -> 12 reviewers).
      *   **ED's Rationale:** More independent judgment converges on better decisions (Condorcet's Jury Theorem logic), especially for close calls.
      *   **User's Observation/Skepticism:** Reviewers come from small/overlapping subfields, scores drift due to social influence (first/confident speaker), and individual accuracy on contested proposals is likely <50% (random/noise).
      *   **Task:** Draft a memo to the board before the vote.
      *   **Requirements:**
          *   Take a clear position (implied: oppose the current proposal).
          *   Engage seriously with the "more independent judgment" reasoning (don't just dismiss it).
          *   Propose concrete alternatives that actually fix the underlying problems.
          *   Tone: Professional, constructive, evidence-based, persuasive.

  2.  **Determine the Position:**
      *   The prompt implies skepticism based on specific observations (social bias, lack of independence, low individual accuracy).
      *   Mathematically, if individual accuracy $p < 0.5$, adding more voters makes the group *less* likely to be right (Condorcet's Jury Theorem). Even if $p > 0.5$, if votes aren't independent, the benefit diminishes rapidly.
      *   *Position:* Oppose the tripling of panel size *in its current form*. It increases cost/burden without guaranteeing quality and might exacerbate specific biases. Support a targeted reform instead.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the ED's intent (improving decision quality) and validate the goal. State the purpose of the memo (recommendation on the vote).
      *   **The Core Argument (Engaging the "Independent Judgment" Theory):**
          *   Acknowledge the statistical logic (Wisdom of Crowds/Condorcet).
          *   Introduce the caveats observed: Independence and Competence.
          *   *Independence:* The prompt notes "scores drift toward whoever speaks first." This violates the independence assumption. Social loafing or anchoring bias.
          *   *Competence:* The prompt notes "doubt any single reviewer is even reliably right more than half the time" on close calls. If $p \le 0.5$, more voters = worse outcomes.
          *   *Overlap:* Small pool of subfields means correlated errors, not independent data points.
      *   **The Operational Cost:** Tripling panels triples cost and reviewer burden. Is the ROI there? Likely not given the above.
      *   **Proposed Solutions (Concrete Fixes):**
          *   Instead of *more* reviewers, improve the *process* of reviewing.
          *   *Blinding/Delphi Method:* Collect scores before discussion to prevent anchoring.
          *   *Diversity:* Broaden the pool to reduce subfield correlation.
          *   *Calibration:* Better training on what "close calls" mean.
          *   *Two-Stage Review:* Use larger panels only for the very top tier or specific contested grants, not all.
      *   **Conclusion:** Summarize recommendation (Vote No on current proposal, Yes on working group for process reform).

  4.  **Refining the Tone:**
      *   Needs to be respectful to the ED (don't make it personal).
      *   Needs to be firm on the data/logic.
      *   Avoid jargon where possible, but use the correct statistical concepts (independence, signal vs. noise) to show rigor.
      *   *Self-Correction during drafting:* I initially thought about suggesting AI review. *Correction:* No, that's too controversial and speculative for a research foundation board right now. Stick to process human factors.
      *   *Self-Correction:* Make sure I explicitly mention the "close call" argument. The ED says big panels help close calls. I need to argue that big panels *harm* close calls if the signal-to-noise ratio is low.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Subject Line:* Needs to be clear. "Recommendation Regarding Panel Size Proposal."
      *   *Opening:* "Having recently served..." establishes credibility.
      *   *The Math Bit:* Explain Condorcet simply. "The theory holds only if..."
      *   *The Observation:* "Calibration calls revealed..."
      *   *The Alternative:* "Process over Volume."
      *   *Specifics:* Pre-meeting scoring (Delphi), rotating chairs, expanding the reviewer pool.

  6.  **Final Review against Constraints:**
      *   Clear position? Yes (Recommend against).
      *   Engage "independent judgment"? Yes (discuss statistical assumptions).
      *   Concrete fixes? Yes (Delphi method, pool expansion, etc.).
      *   Tone? Board-appropriate.

  7.  **Final Polish:** Check for flow and persuasiveness. Ensure the distinction between *adding noise* vs. *adding signal* is clear. (The resulting memo looks good).

  *(Self-Correction Note during final review)*: Make sure I don't sound like I'm attacking the ED personally. Frame it as "The proposal is well-intentioned but relies on assumptions that our current ecosystem doesn't meet."

  8.  **Final Output Generation** (Proceed to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Proposal to Expand Review Panel Size

  **Executive Summary**

  I am writing to recommend that the Board vote **against** the Executive Director's current proposal to triple the size of grant-review panels from four to twelve members. While I fully endorse the goal of improving the accuracy of our funding decisions—particularly on "close call" applications—the proposed mechanism relies on statistical assumptions that do not hold true in our current review ecosystem.

  Tripling panel size will significantly increase costs and reviewer burden without guaranteeing better outcomes. In fact, under the conditions I observed during my recent service as a panelist, this change risks amplifying noise rather than signal. I propose we instead invest resources in process reforms that ensure genuine independence and reduce social bias.

  **The Theory: Wisdom of Crowds vs. Reality**

  The ED's proposal rests on a sound statistical principle, often referred to as Condorcet's Jury Theorem or the "Wisdom of Crowds." The theory posits that if individual reviewers are more likely to be right than wrong (>50% accuracy), and if their judgments are independent, then aggregating more judgments converges on the correct decision.

  However, this theorem relies on two critical conditions that our current panel structure struggles to meet:

  1.  **Individual Competence on Marginal Cases:** The theorem requires that the average reviewer has a better-than-random chance of identifying the superior proposal. During calibration calls for contested grants, I observed that the distinction between fundable and non-fundable proposals was often indistinguishable from noise. If individual accuracy on these close calls is at or below 50%, adding more voters mathematically *decreases* the probability of a correct group decision.
  2.  **Independence of Judgment:** The value of additional reviewers diminishes rapidly if their votes are correlated. I observed that scores frequently drifted toward the first or most confident speaker during discussions. When reviewers come from a small, overlapping set of subfields, they share similar biases and blind spots. Twelve correlated reviewers do not provide twelve data points; they provide one data point with twelve times the administrative cost.

  **Operational Risks**

  Beyond the statistical limitations, tripling panel size introduces operational risks:

  *   **Reviewer Fatigue:** Finding qualified reviewers is already a bottleneck. Tripling the demand will force us to dip deeper into the pool, potentially lowering the average expertise per seat or overburdening our most reliable reviewers.
  *   **Dilution of Accountability:** In larger groups, individual responsibility often diffuses (the "bystander effect"). With four reviewers, each knows their voice is critical. With twelve, it is easier to free-ride on the analysis of others.
  *   **Logistical Friction:** Facilitating a substantive discussion among twelve experts is exponentially harder than among four. We risk replacing deep deliberation with procedural management.

  **Alternative Solutions: Process Over Volume**

  If the problem we are solving is the reliability of decisions on contested proposals, we should address the *quality* of the input and the *structure* of the deliberation, not just the quantity of voters. I propose the Board direct staff to develop a pilot program incorporating the following reforms:

  1.  **Adopt a "Delphi" Scoring Structure:** To preserve independence, reviewers should submit final scores and written summaries *before* any group discussion occurs. This prevents anchoring bias, where early speakers disproportionately influence the group. Discussion should then focus only on proposals where scores diverge significantly.
  2.  **Diversify the Reviewer Pool:** To reduce correlated error, we must actively recruit reviewers from adjacent disciplines or different methodological traditions. We need cognitive diversity, not just more bodies from the same subfield network.
  3.  **Targeted Expansion:** If we believe larger panels help with close calls, we should test this empirically before scaling. We could assign a "shadow panel" of additional reviewers to a random 10% of applications to measure if their aggregated score predicts future grant success better than the standard four-person panel.
  4.  **Calibration Training:** Reviewers need explicit training on recognizing uncertainty. If a proposal is genuinely a coin flip, the system should allow for a "tie" mechanism or funding via lottery among the top tier, rather than forcing a false consensus.

  **Recommendation**

  The Executive Director is correct that our close-call decisions need improvement. However, scaling up a flawed process simply produces flawed results at a higher cost.

  I move that we table the proposal to triple panel sizes. Instead, I recommend we form a small working group to pilot the process reforms outlined above. We should let data from those pilots drive future structural changes, rather than relying on theoretical assumptions that do not match our on-the-ground reality.

  Thank you for your consideration.

  [Your Name]
  Board Member
