prompt: |-
  I sit on the incidental-findings subcommittee of my university's biobank, and we're close to voting on a policy for a case that keeps recurring in our aging-cohort study: participants who consented to research-grade whole-genome sequencing and turn out to carry two copies of the APOE4 allele, which substantially raises lifetime Alzheimer's risk and for which there is still no approved intervention that prevents or delays onset in people who are asymptomatic. At enrollment, participants ticked a box indicating whether they wanted this kind of finding disclosed if it ever turned up, and a sizable minority said no.

  One subcommittee member, a former decision theorist now doing public-health research, keeps invoking what she calls Good's theorem -- the result that for a Bayesian expected-utility maximizer, the expected value of costless evidence is never negative -- to argue that the "no" box is tracking discomfort rather than anything a sound policy should defer to, and that disclosure by default is simply what the math recommends once you're honest about it. Two of our clinicians push back with the "right not to know" tradition that grew out of Huntington's-disease predictive testing, together with documented cases of anxiety and family disruption following unsolicited disclosure of similarly grim, non-actionable results -- disruption that's compounded here, since a participant's APOE4 status also implies something about their parents and siblings, none of whom consented to learn anything. I've read enough Bayesian-inflected blogs over the years to recognize the theorem on sight, but I've never seen anyone actually work out whether it bears on a case like this one, and nobody on the subcommittee seems able to either dismiss the argument or accept it outright.

  Could you draft the short recommendation memo the subcommittee will bring to the full board next month? It should land on one specific policy for this class of finding rather than calling for further study -- covering at least the default (opt-in vs. opt-out at enrollment), the threshold a finding must meet to be disclosed at all, and how, if at all, biological relatives factor in. And since the decision-theoretic argument is the one nobody here has managed to actually rebut rather than just talk past, please give it a serious hearing on its own terms: say specifically which of the theorem's idealizing assumptions -- about the evidence being free, the relevant utility function being fixed and already complete, there being a single decision-maker, and so on -- this situation satisfies or fails to satisfy, rather than just asserting that real participants aren't idealized Bayesian agents.
reasoning: |-
  Here's a thinking process that leads to the recommended memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the incidental-findings subcommittee of a university biobank.
      *   **Task:** Draft a short recommendation memo to the full board.
      *   **Topic:** Policy on disclosing APOE4 homozygosity (high Alzheimer's risk, no cure) in an aging-cohort study where participants chose opt-in/opt-out at enrollment.
      *   **Key Conflict:** A decision theorist argues for default disclosure based on Good's Theorem (value of information is non-negative). Clinicians argue for the "right not to know" based on psychological harm and family implications.
      *   **Requirements:**
          *   Land on a *specific policy* (no "further study").
          *   Cover: Default (opt-in vs. opt-out), Disclosure Threshold, Biological Relatives.
          *   Address Good's Theorem specifically: Analyze which assumptions hold or fail (cost, utility function, decision-maker, etc.) rather than just dismissing it.
          *   Tone: Professional, reasoned, authoritative, suitable for a university board.

  2.  **Deconstruct Good's Theorem in this Context:**
      *   *Theorem:* For a Bayesian expected-utility maximizer, the expected value of free information is $\ge 0$.
      *   *Assumption 1: Costless Evidence.* Is genetic testing/disclosure costless?
          *   *Reality:* No. There are psychological costs (anxiety, depression), social costs (stigma, insurance discrimination despite GINA), and familial costs (implicating relatives).
      *   *Assumption 2: Fixed, Complete Utility Function.* Does the participant have a well-defined utility function over all states of the world *before* receiving the info?
          *   *Reality:* Often no. Preferences might be constructed upon receipt. Also, the utility function might include "not knowing" as a intrinsic good (autonomy/peace of mind), which the theorem treats as a state to be updated, but if the *act* of knowing destroys the utility of the state, it's tricky. More importantly, if the utility function assigns negative value to the *state of knowing* (dread), the theorem still holds *if* the agent updates beliefs correctly. However, if the information changes the utility function itself (e.g., induces a depressive state where *all* future utilities are discounted), the theorem breaks.
      *   *Assumption 3: Single Decision-Maker.* Is the participant the only one affected?
          *   *Reality:* No. Biological relatives are materially affected without consent. This introduces externalities.
      *   *Assumption 4: Ability to Act on Information.* Does the information allow for better decisions?
          *   *Reality:* Limited. No cure. Lifestyle changes are generic good advice regardless of genotype. If the information doesn't change the optimal action (e.g., "live healthy" is optimal regardless), the instrumental value is near zero, making the psychological costs dominate.

  3.  **Formulate the Policy:**
      *   *Default:* Respect the enrollment choice (Opt-in for this specific finding). Why? Because the "cost" assumption of Good's Theorem fails (psychological harm is real) and the "single agent" assumption fails (family impact).
      *   *Threshold:* High. Only disclose if actionable *or* if explicitly requested. Since APOE4 is non-actionable clinically, it falls under "explicitly requested only."
      *   *Relatives:* Do not contact. The participant is the gatekeeper. Duty to warn is weak here due to lack of preventability.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **Background:** Briefly state the APOE4 dilemma and the conflict (Good's Theorem vs. Right Not to Know).
      *   **Analysis of Good's Theorem:** This is the crucial part requested by the prompt. I need to be precise.
          *   Acknowledge the theorem's validity in its domain.
          *   Point out the *violations* in this context.
          *   *Cost:* Information is not free (psychological burden).
          *   *Actionability:* If the optimal action doesn't change based on the signal, the instrumental value is zero. (If I should exercise and eat well regardless of APOE4 status, knowing the status adds no decision-theoretic value).
          *   *Externalities:* Relatives are non-consenting stakeholders.
      *   **Policy Recommendations:**
          *   *Enrollment Default:* Honor the box. If they checked "No," do not disclose. (Strict Opt-In for APOE4).
          *   *Threshold:* Clinical actionability or explicit prior consent. APOE4 fails actionability, so consent is key.
          *   *Relatives:* No proactive contact.
      *   **Conclusion:** Reiterate the balance between respect for autonomy and mathematical idealization.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* Is it true that optimal action doesn't change? Some argue knowing risk motivates lifestyle change.
      *   *Counter:* Evidence is mixed. If the participant *believes* it won't change their action, the value is zero. If they believe it will, they should opt-in. The theorem assumes the agent knows their own decision problem. If the agent anticipates the info will cause paralysis (depression) rather than action, the expected utility is negative.
      *   *Refinement on Good's Theorem:* The strongest rebuttal isn't that people aren't Bayesian, but that the *cost term* ($c$) in $V(I) - c$ is positive. Good's theorem says $V(I) \ge 0$ for *free* information. If disclosure has a cost (anxiety), $V(I) - c$ can be negative. The clinician's argument *is* the cost argument. I need to make sure I articulate that the theorem assumes *costless* evidence.
      *   *Refinement on Utility:* The theorem assumes the utility function is defined over world states. If "knowing I have E4" is a world state with low utility compared to "not knowing," a rational agent can prefer ignorance. Good's theorem says you shouldn't *ignore* free info if you *have* it, but it doesn't force you to *seek* it if acquiring it has a cost. Wait, actually, Good's theorem is about the value of *observing* a signal before acting. If the observation itself changes the utility function (e.g., induces despair), that violates the stable utility assumption. I will focus on the "Costless" and "Single Agent" assumptions as they are clearest.

  6.  **Final Polish:**
      *   Ensure the tone is respectful to the decision theorist member (don't dismiss them, show why the model doesn't fit).
      *   Ensure the policy is actionable.
      *   Check word count/length (should be a "short recommendation memo").

  7.  **Final Review against Prompt:**
      *   Specific policy? Yes (Honor opt-out).
      *   Cover default, threshold, relatives? Yes.
      *   Address Good's Theorem assumptions specifically? Yes (Cost, Utility Stability, Externalities).
      *   No "further study"? Yes.

  *(Self-Correction during drafting)*: I need to be careful not to misrepresent Good's Theorem. It states that *acquiring* free information before making a decision cannot decrease expected utility. It does *not* mandate that information must be disclosed if the recipient didn't ask for it. The theorem applies to the *agent* deciding whether to look. If the biobank forces disclosure, they are forcing the observation. If the observation has a psychological cost, it's not "costless." That is the pivot point.

  Let's write the memo.cw
answer: |-
  **MEMORANDUM**

  **TO:** University Biobank Governance Board
  **FROM:** Incidental Findings Subcommittee
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendation Regarding Disclosure of APOE4 Homozygosity

  **Executive Summary**
  The Subcommittee recommends a policy of **strict prior authorization** for the disclosure of APOE4 homozygosity. We recommend honoring the enrollment election (opt-in/opt-out) without exception. Disclosure should occur only if the participant explicitly selected "yes" for neurodegenerative risk findings at enrollment. We further recommend against proactive contact of biological relatives. This policy prioritizes participant autonomy and psychological safety over a default of maximal information transfer.

  **Context and Conflict**
  Our aging-cohort study frequently identifies participants homozygous for the APOE4 allele, indicating elevated Alzheimer's disease risk. Unlike actionable findings (e.g., BRCA1), no preventative intervention exists. A conflict has arisen within the Subcommittee:
  1.  **Clinical/Ethical View:** Supports the "right not to know," citing risks of anxiety, stigma, and familial disruption.
  2.  **Decision-Theoretic View:** Invokes Good's Theorem (1967), arguing that for a rational agent, the expected value of costless information is non-negative. Therefore, default disclosure is mathematically superior, and opt-out boxes reflect transient discomfort rather than rational preference.

  **Analysis of the Decision-Theoretic Argument**
  We have evaluated Good's Theorem on its own terms. While the theorem is mathematically sound within its axioms, the clinical reality of APOE4 disclosure violates three critical assumptions required for the theorem to recommend mandatory disclosure:

  1.  **The "Costless Evidence" Assumption:** Good's Theorem proves that $Expected\_Value(Information) \ge 0$ only if the information is free. In this context, "cost" includes psychological distress, potential insurance discrimination (despite GINA limitations regarding life/long-term care), and familial tension. Clinical data on Huntington's disease and APOE4 disclosure demonstrates these costs are non-zero and often substantial. When cost ($c$) is introduced, the net value is $V(I) - c$, which can be negative.
  2.  **The "Stable Utility Function" Assumption:** The theorem assumes the agent's utility function is fixed prior to observation. However, receiving a high-risk Alzheimer's diagnosis can fundamentally alter a participant's utility function (e.g., inducing depressive states that discount future utility). If the information transforms the agent's capacity to derive utility from future states, the pre-test expected utility calculation is invalid.
  3.  **The "Single Decision-Maker" Assumption:** The theorem models a single agent maximizing their own utility. APOE4 status is genetically shared; disclosure implicates parents and siblings who did not consent to risk assessment. This creates a negative externality. A policy maximizing the participant's information access may decrease the aggregate utility of the family unit.

  Furthermore, the theorem relies on the information having *instrumental value* (changing a decision). For many participants, the optimal health behavior (cardiovascular health, cognitive engagement) remains identical regardless of genotype. If the information does not change the optimal action, its instrumental value is zero, leaving only the psychological costs.

  **Policy Recommendations**

  Based on the failure of these idealizing assumptions in the clinical context, we propose the following binding policy:

  **1. Enrollment Default (Opt-In vs. Opt-Out)**
  **Policy:** Honor the participant's enrollment election exactly.
  **Rationale:** Because the "cost" of information is non-zero and variable, the participant is the only valid estimator of their own expected utility. If a participant checked "No" regarding neurodegenerative findings, the biobank will not disclose APOE4 homozygosity. We reject a policy of overriding opt-outs based on theoretical rationality.

  **2. Disclosure Threshold**
  **Policy:** Disclosure requires **clinical actionability OR explicit prior consent.**
  **Rationale:** Since APOE4 status lacks approved preventative interventions, it fails the actionability threshold. Therefore, it may only be disclosed under the "explicit prior consent" pathway. We will not re-contact participants to solicit consent for this finding if they previously declined or left the section blank.

  **3. Biological Relatives**
  **Policy:** No proactive contact of biological relatives.
  **Rationale:** The duty to warn is predicated on the ability to prevent harm. Given the lack of preventative intervention for Alzheimer's, the potential benefit to relatives does not outweigh the violation of the participant's confidentiality and the relatives' right not to know. The participant remains the sole gatekeeper of familial genetic information.

  **Conclusion**
  Good's Theorem correctly identifies that information is generally valuable to a rational agent. However, it does not mandate disclosure when the "cost" of that information includes psychological harm, when the utility function is vulnerable to disruption, or when the decision affects non-consenting third parties. Our policy respects the participant's own assessment of these costs.

  **Recommendation:** The Subcommittee moves to adopt this policy immediately for all current and future cohort analyses.
