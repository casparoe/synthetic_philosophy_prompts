answer: |-
  This is a fantastic observation. You have hit on one of the most crucial but often overlooked pillars of Hobbes's entire philosophical system. Most people read *Leviathan* and focus on the "state of nature" or the "social contract," but they miss the engine driving it: Hobbes's epistemology (theory of knowledge).

  You are absolutely right: Hobbes believed that **we can only have certain knowledge (*scientia*) of things we create.** In physics, God created the world, so we can only guess at the causes (probability). In geometry, *we* create the definitions of circles and triangles, so we can know them with absolute certainty. And in politics, because the Commonwealth is an artificial "monster" created by human covenant (not by God or nature), we can have the same geometric certainty about it.

  The feud with Wallis wasn't just ego; it was existential. If Hobbes couldn't do geometry, his claim that philosophy could be a demonstrative science like geometry looked shaky.

  So, if we drag Thomas Hobbes out of Highgate Cemetery and show him Non-Euclidean Geometry and Gödel's Incompleteness Theorems, does the *Leviathan* collapse?

  Here is the argument for why **Non-Euclidean geometry would barely bother him, Gödel would annoy him but not defeat him, and his political philosophy would actually survive largely intact.**

  ### 1. The Non-Euclidean Shock: "So What?"
  Your intuition is that Non-Euclidean geometry (where parallel lines *can* meet, etc.) proves Euclid wasn't "universally true," which seems to undermine the idea of geometry as perfect knowledge.

  However, this misunderstands *why* Hobbes loved geometry. Hobbes was a **Nominalist**. He believed that truth isn't about discovering mystical forms in the sky; it is about the correct use of language and definitions.

  For Hobbes, a geometric truth isn't "true" because it matches the physical dirt outside your window. It is true because **if you accept the definitions, the conclusion is unavoidable.**
  *   *Hobbes's View:* "I define a triangle. I define a straight line. Given those definitions, the angles *must* add up to 180 degrees."
  *   *Non-Euclidean Reality:* "Actually, if you define space differently (curved), they add up to more."

  **Hobbes's Counter-Argument:**
  Hobbes would likely shrug and say, "Exactly! You changed the definitions (axioms), so you got a different result. The *certainty* of the reasoning didn't change, only the starting premises."

  Non-Euclidean geometry actually reinforces Hobbes's constructivism. It proves that geometry is indeed a game of human-defined rules, not a discovery of God's mind. As long as the deduction from the axioms is valid, the knowledge is certain. Hobbes wouldn't care that Euclid isn't the *only* geometry; he would care that within any chosen system, the consequences are necessary.

  **Verdict:** Non-Euclidean geometry does not wreck his epistemology. It actually validates his view that geometry is about human definitions, not external nature.

  ### 2. The Gödel Problem: "There are holes in the system."
  This is the heavier artillery. Gödel's Incompleteness Theorems (roughly) state that in any sufficiently complex logical system, there will be statements that are **true but unprovable** within that system. Furthermore, you cannot prove the system is consistent using only the rules of the system itself.

  This seems to attack the heart of Hobbes's dream: a closed system of philosophy where you can derive all necessary political truths from first principles without doubt.

  **Hobbes's Counter-Argument:**
  There are two ways Hobbes could dodge this bullet:

  *   **Complexity Threshold:** Gödel's theorems apply to formal systems complex enough to include basic arithmetic. Hobbes might argue that "Civil Science" (politics) is not an arithmetic system. It is a system of passions, incentives, and laws. He could claim his political geometry is simple enough to avoid incompleteness.
  *   **Sufficiency vs. Completeness:** Hobbes doesn't need to prove *everything*. He needs to prove *specific things* (e.g., "A divided sovereignty leads to war," "The Sovereign must control the sword"). Gödel says you can't prove *every* true statement. He doesn't say you can't prove *any*. As long as the specific theorems Hobbes cares about (the necessity of absolute sovereignty) are provable within his system, he doesn't care that there are some obscure, unrelated geometric truths floating around that are unprovable.

  **Verdict:** Gödel wounds the dream of a "Total System of Truth," but it doesn't destroy the ability to have certain knowledge about specific, constructed questions. Hobbes would likely treat Gödel as a technical limitation of arithmetic, not a refutation of deductive reasoning.

  ### 3. The Political Fallout: Where Hobbes Actually Bleeds
  If the math doesn't kill him, what does?

  The link between Hobbes's geometry and his politics isn't the *math* itself; it's the **method of construction.**
  *   **Geometry:** We define the circle -> We deduce its properties.
  *   **Politics:** We define the Contract -> We deduce the Sovereign's rights.

  The threat from modern science isn't to the *logic*; it's to the **premises.**

  Hobbes believed his premises about human nature were as fixed as geometric definitions. He thought "fear of violent death" and "rational self-interest" were universal constants, like the definition of a line.
  *   **Modern Psychology/Behavioral Economics:** We now know humans are not consistently rational. We are irrational, altruistic, tribal, and emotional in ways that don't fit Hobbes's "geometric" model of human nature.
  *   **Modern Physics:** Hobbes was a materialist who believed in absolute space and time. Relativity and Quantum Mechanics wreck his physics. Since he wanted his politics to be grounded in a materialist understanding of the universe, a quantum universe makes his "matter in motion" psychology look quaint.

  **However,** if we stick strictly to your question about the *mathematical certainty* underpinning his politics:
  Hobbes could argue that even if humans are irrational, the **logic of the Institution** holds. " *If* you want security (premise), *then* you must authorize a Sovereign (conclusion)." This is a conditional truth, like geometry. It remains certain *if* you accept the goal.

  ### The Final Verdict: How Hobbes Would Respond
  If you sat Hobbes down with a whiteboard today, here is the argument he would make:

  1.  **On Math:** "You tell me there are many geometries? Good. That proves my point. Geometry is not about the world; it is about the consequences of our own definitions. That is why it is certain. Physics is uncertain because the world is God's definition. Geometry is certain because it is man's."
  2.  **On Gödel:** "You tell me I cannot prove every truth? I do not need every truth. I only need the truths necessary to keep men from cutting each other's throats. Can you prove that a house divided against itself cannot stand? Yes? Then my science works."
  3.  **On Politics:** "My politics does not rely on Euclid's parallel postulate. It relies on the construction of the Commonwealth. Since men made the Commonwealth, men can understand it. The math has limits, but the logic of power remains."

  **Conclusion:**
  Showing Hobbes modern math would **not** wreck his philosophy. In fact, it might make him feel vindicated.
  *   **Non-Euclidean geometry** confirms his Nominalism (truth is about definitions, not reality).
  *   **Gödel** limits the *scope* of formal systems, but not the *certainty* of the deductions that can be made.

  The real damage to Hobbes isn't the math; it's the empirical study of human behavior. We have discovered that the "definitions" of human nature he started with are flawed. But strictly regarding his claim that **"Politics can be as certain as Geometry because both are human constructs"**? That logic holds up surprisingly well. He would likely tell Wallis, "I told you the method was sound, you just couldn't handle the new axioms."

  He was wrong about the circle, but he was arguably right about why geometry matters. And that is why the feud matters.
