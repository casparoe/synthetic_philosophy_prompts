      *   **The Vulnerability: Short-Run Non-Neutrality:** This is crucial. Hume admitted money stimulates output before prices rise. Protectionists argue tariffs + weak currency can boost domestic manufacturing *now*. Address the inflation risk and retaliation risk.
      *   **Capital Mobility:** Hume didn't foresee massive capital flows. Trade deficits are often mirror images of capital surpluses. Tariffs don't fix savings/investment imbalances.
      *   **Verdict:** Does it hold? Yes, fundamentally, but with caveats. The long-run futility remains, but the short-run pain (which matters to politicians and businesses) is real.

