answer: |-
  This is a classic clash between **idealized Bayesianism** (the map your friend is using) and **bounded rationality** (the territory you actually inhabit).

  Your friend is technically reciting a theorem of standard probability theory: if $A \iff B$, then $P(A) = P(B)$. If $P(A) \neq P(B)$, you are vulnerable to a Dutch Book. He is correct that *an ideal agent* cannot assign different credences to logically equivalent claims.

  However, he is wrong to apply this standard to you, and wrong to call it a "rationality failure." Here is the principled breakdown of why your split was rational, why his Dutch Book argument doesn't land, and how to distinguish "mistake" from "unfinished math."

  ### 1. The Object of the Bet Was Not the Logic
  The most immediate error in your friend's critique is a category mistake about what the markets were actually tracking.

  You didn't bet on "Is the logical conclusion of this puzzle True?" You bet on **"Will the group get the right answer?"**

  Let $L_1$ and $L_2$ be the underlying logical structures of the Knights and Monks puzzles. Your friend is right that $L_1 \iff L_2$.
  But the market propositions were $S_1$ ("Group Solves $L_1$") and $S_2$ ("Group Solves $L_2$").

  $S_1$ and $S_2$ are **not** logically equivalent. They are causal claims about human psychology. Human cognition is not isomorphic to formal logic. The "Knights and Knaves" framing triggers different heuristics, different cognitive loads, and different familiarity biases than the "Muddy Monks" framing. It is a well-documented psychological fact that logically isomorphic problems have different solve-rates depending on flavor text (e.g., the Wason Selection Task).

  Therefore, $P(S_1) \neq P(S_2)$ is not a logical contradiction; it is a correct assessment of framing effects. Your 80% vs. 35% wasn't a failure to see the logic; it was a successful prediction that your friends find monks easier to reason about than liars.

  ### 2. The Problem of Logical Omniscience
  Even if the market *had* been about the truth of the propositions, your friend is demanding **Logical Omniscience**.

  Standard Bayesian probability assumes an agent knows all logical consequences of their axioms instantly. If you know $A$, and $A \implies B$, standard Bayes says you automatically know $B$ and $P(B) \ge P(A)$. This is obviously false for humans. We have **Logical Uncertainty**. We are uncertain about the output of computations we haven't run yet.

  The LessWrong-adjacent formalization that actually handles this is **Logical Induction** (developed by Garrabrant et al. at MIRI). A logical inductor is a bounded agent that assigns probabilities to logical statements *before* it has the computational power to prove them.
  *   In Logical Induction, it is perfectly valid to assign $P(A) = 0.8$ and $P(B) = 0.35$ even if $A \iff B$, *provided you have not yet computed the equivalence.*
  *   Your credences are not a static snapshot of truth; they are a trajectory of your computation.
  *   The "failure" only occurs if you *refuse* to update once the equivalence is shown. Since you are engaging with the write-up, you are updating. That is rational behavior.

  ### 3. The Dutch Book Requires a Smarter Bookie
  Your friend claims he could have Dutch Booked you. This is theoretically true *only if the bookie knows the equivalence.*

  A Dutch Book is a set of bets that guarantees a loss for the bettor. To construct it, the bookie must know that the two markets are arbitrages of each other.
  *   **Ex-ante (before the write-up):** Neither you, nor the market, nor (presumably) your friend knew the puzzles were isomorphic. The arbitrage opportunity did not exist in the common knowledge base. You cannot be Dutch Booked on information nobody possesses.
  *   **Ex-post (after the write-up):** Now that the equivalence is known, if you *refused* to move the markets to converge, *then* you would be irrational.

  Your friend is conflating "vulnerable to a Dutch Book by an oracle" with "vulnerable to a Dutch Book by a market participant." Rationality is about making the best decisions with available compute and information, not about being invulnerable to a hyper-intelligent adversary who knows math you haven't done yet.

  ### 4. Distinguishing "Mistake" from "Unfinished Math"
  You asked for a principled way to distinguish these. The distinction lies in **computational cost vs. processing error.**

  *   **Epistemic Mistake:** You have the necessary information and compute, but you process it incorrectly (e.g., double-counting evidence, ignoring a base rate you already knew, motivated reasoning). This is a bug in the algorithm.
  *   **Logical Uncertainty (Unfinished Math):** You lack the output of a computation you haven't run yet. The "probability" you assign is actually a estimate of your own future compute (e.g., "What is the probability I can solve this before Sunday?").

  **The Test:**
  If you handed the problem to a computer with infinite speed, would the probabilities converge instantly?
  *   If **Yes**, it's logical uncertainty. (This is your case. A solver would see $L_1 \iff L_2$ instantly).
  *   If **No** (because the input data itself was flawed or biased), it's an epistemic mistake.

  A more practical test is **Cost-Benefit.** Rationality includes resource allocation. Checking every pair of puzzles for isomorphism has a high computational cost. If the expected value of the market accuracy gain is lower than the cost of your friend's time to write the proof, it is *rationally optimal* to leave the probabilities divergent. This is **Rational Ignorance.**

  ### The Verdict
  Your friend is holding you to the standard of a **God** (infinite compute, instant logical knowledge). You are operating as a **Human** (bounded compute, psychological framing effects).

  He is right that *ideal* probability theory forbids your spread. He is wrong that *human* rationality forbids it. In fact, if you had spent 20 hours verifying isomorphism on every low-stakes market just to satisfy the "logical consistency" axiom, *that* would be the rationality failure (misallocation of resources).

  **Take the win:** You correctly predicted that the "Monks" framing was easier for your group than the "Knights" framing. That is a valid model of reality. The fact that the underlying logic was identical is a feature of the puzzles, not a bug in your calibration. Tell your friend to read up on **Logical Induction** and **Bounded Rationality**, and then ask him if he's willing to bet on whether he can solve a P vs NP reduction by next Tuesday. If he assigns <100% to "I will solve it," ask him why he isn't assigning 100% to "P=NP or P!=NP" being true. He's living in logical uncertainty too; he just hasn't noticed it yet.
