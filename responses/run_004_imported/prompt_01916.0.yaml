answer: |-
  You have read Du Bois closer than most scholars do. The "all art is propaganda" soundbite is often stripped of its nuance, but your reading of the surrounding text exposes a genuine fault line in the essay. You are right to feel that the logic shifts underfoot.

  Here is the strongest case that this is not merely loose rhetoric, but a structural inconsistency in Du Bois's argument, followed by an analysis of which concept is carrying the weight, and finally, how this applies to your novel.

  ### The Case for Inconsistency

  The inconsistency lies in the **direction of causality** and the **locus of control**. Du Bois attempts to hold two mutually exclusive theories of artistic agency simultaneously without bridging the gap between them.

  **1. The Teleological Contradiction**
  In the first instance you cited, Du Bois argues for an *organic* relationship between Beauty and Truth. The artist pursues Beauty; Truth follows as a "compulsion." Here, propaganda (in the sense of shifting public perception) is an *effect*. It is retrospective. The artist does not need to know the political utility of their work for the work to have political utility.

  In the second instance ("I do not care a damn for any art that is not used for propaganda"), Du Bois argues for an *instrumental* relationship. Here, propaganda is a *requirement*. It is prospective. The artist must intend the political utility.

  If Truth is the inevitable byproduct of Beauty, you cannot *demand* it as a prerequisite without risking the Beauty itself. If I tell a painter, "You must paint Beauty, and by doing so you will reveal Truth," I am an aesthetician. If I tell a painter, "You must reveal Truth to advance our civil rights," I am a minister of information. Du Bois demands the artist obey the minister while promising them the freedom of the aesthetician. That is not a synthesis; it is a jurisdictional dispute.

  **2. The Problem of "Bad" Propaganda**
  Du Bois critiques white propaganda (like *The Birth of a Nation*) for lying. This implies there is an objective standard of Truth outside the propaganda itself. However, if the primary function of the art is propaganda (the "Weapon" model), then "Truth" becomes tactical.

  If showing the full, messy truth of Black life (including intra-community conflict, colorism, or class strife) undermines the political goal of securing voting rights or housing equality, does the "Weapon" model demand you suppress that truth? Du Bois says no (he asks for the "whole truth"), but his "Weapon" model provides the logical framework for saying yes. He wants the credibility of the "Truth" model to protect the art from censorship, while using the authority of the "Weapon" model to censor art that *doesn't* serve the cause. He wants to have his cake (autonomous art that tells the truth) and eat it too (instrumentalized art that serves the NAACP).

  **3. The Compulsion vs. Choice Paradox**
  Du Bois says the artist is an apostle of Truth "not by choice but by inner and outer compulsion." Then he essentially commands them to choose it. You cannot be compelled to do something voluntarily. If the propaganda value is inherent to honest art, Du Bois's speech is unnecessary. If the speech is necessary, then the propaganda value is *not* inherent. The existence of the speech proves the inconsistency of the claim.

  ### Which Notion is Doing the Work?

  If we accept this tension is real, we have to ask: which concept is the engine, and which is the paint job?

  **The "Deliberate Weapon" is doing the political work.**
  This is what Du Bois actually *wants*. He is in a crisis moment (1926). Lynching, disenfranchisement, and housing covenants are active threats. He does not have the luxury of believing Beauty will save the world eventually. He needs art to function as a battering ram *now*. The urgency of the essay comes from this demand.

  **The "Inevitable Byproduct" is doing the philosophical legitimizing.**
  This notion is coasting on the credibility of the "Weapon." Du Bois knows that if he tells artists they are merely pamphleteers, they will reject him (and many did, notably Langston Hughes and Zora Neale Hurston). He needs the "Byproduct" argument to assure the artists that they can remain *artists* and not just activists. It is an alibi. It allows him to demand political utility while claiming he is respecting artistic autonomy.

  **The Verdict:** The "Weapon" is the master; the "Byproduct" is the servant. Du Bois invokes the sanctity of Truth/Beauty only insofar as it serves the political goal. When the two conflict, his essay implies the political goal must win, because he explicitly states he doesn't care about art that *isn't* propaganda.

  ### Application to Your Novel

  You asked if you can retire "Is this propaganda?" and just ask "Is this true?"

  **Yes, but with a specific definition of "True."**

  Your writing group is telling you the book is "preachy." In craft terms, "preachy" usually means the **Weapon has overtaken the Byproduct.** It means the characters are making choices based on the author's political thesis rather than their own internal logic. It means the "Truth" feels curated to ensure the "Propaganda" lands safely.

  Du Bois's inconsistency offers you a way out, but you have to side with the half of him that he undermines.

  **1. Trust the "Byproduct" Model**
  If you focus on "Is this true?" in the sense of human complexity, the propaganda (the argument against housing discrimination) will take care of itself. In fact, it will be *stronger*.
  *   **Preachy Propaganda:** A family fights a housing covenant, they are noble, the oppressors are cartoonishly evil, they win (or lose nobly), and the reader learns Housing Discrimination Is Bad.
  *   **True Propaganda:** A family fights a housing covenant. The father is terrified. The mother is angry but exhausted. Maybe they consider taking a bribe. Maybe they disagree on strategy. Maybe they win the house but lose their savings. Maybe the neighbors who oppose them aren't villains, but scared people acting on bad information.

  Du Bois argued that white propaganda fails because it lies about Black humanity. Your book avoids being "preachy" if it refuses to lie about *your* characters' humanity to make a point.

  **2. The "Truth" Trap**
  Be careful. "Is this true?" can become its own trap if you interpret "truth" as "factual accuracy" regarding the legal case. That leads to exposition dumps.
  Instead, ask: **"Is this emotionally honest?"**
  If a character gives a speech about the history of redlining, ask: *Would a tired father actually say this out loud to his daughter in the kitchen? Or is this me, the author, needing to say it?*
  If the answer is the latter, it's propaganda (the Weapon model). If the answer is the former, it's truth (the Byproduct model).

  **3. The Du Bois Solution**
  Du Bois wanted art to be propaganda *because* he believed the truth of Black life was itself a revolutionary act in a society built on lies.
  For your novel: The mere existence of your family, rendered in full, messy, contradictory detail, is the political act. You do not need to sharpen the edges of their personalities to make them fit the "housing discrimination case" narrative.

  **Recommendation:**
  Retire the question "Is this propaganda?" It leads to anxiety about utility.
  Replace it with: **"Am I protecting my characters from the truth to protect my thesis?"**

  If you find yourself shielding a character from making a morally ambiguous choice because it might weaken the reader's sympathy for the housing case, you are in the "Weapon" zone. That is where the preachiness lives. If you let them be flawed, contradictory, and human, you are in the "Byproduct" zone.

  Du Bois's tension remains unresolved in literature because it is the tension between **Art** (which explores) and **Activism** (which concludes). Your novel will succeed if it leans into the exploration. Let the housing case be the setting, not the moral. If the Truth is honest, the Propaganda will be undeniable—and it won't feel like preaching. It will feel like witness.
