      *   **Context:** The user is writing a novel about three generations of a family involved in a housing discrimination case.
      *   **Problem:** Their writing group says it's getting "preachy."
      *   **Research:** They read W.E.B. Du Bois's 1926 speech "Criteria of Negro Art" in full, not just the famous "all art is propaganda" quote.
      *   **Observation:** They see a tension/inconsistency in Du Bois's argument:
          1.  Art/Beauty leads to Truth/Right as a *byproduct* (compulsion).
          2.  Art *must* be used for propaganda (deliberate aim).
          3.  Bad propaganda distorts Truth (Truth is an external standard).
      *   **Task:**
          1.  Make the *strongest case* that this is an actual inconsistency (not just loose rhetoric).
          2.  If convinced, identify which notion of propaganda is doing the philosophical work and which is coasting.
          3.  Advise on whether the user can retire "is this propaganda?" and ask "is this true?" instead for their own novel.

  2.  **Deconstruct Du Bois's "Criteria of Negro Art":**
      *   *Context:* 1926, NAACP crisis, rising Harlem Renaissance, tension between "Art for Art's Sake" (Locke, Hughes, etc.) and "Art for Social Change."
      *   *The "Byproduct" Argument:* Du Bois argues that Beauty is not neutral. True Beauty reveals Truth. Therefore, if a Black artist pursues True Beauty, they inevitably reveal the humanity of Black people, countering racist stereotypes. This is "propaganda" in the sense of changing public perception, but it arises organically from artistic integrity.
      *   *The "Deliberate" Argument:* Du Bois explicitly states, "I do not care a damn for any art that is not used for propaganda." He wants art to fight for political rights (voting, equality). This implies intent.
      *   *The "Truth" Standard:* He critiques white propaganda (Uncle Tom's Cabin, Birth of a Nation) for lying. He implies Black art must tell the *whole* truth (including ugliness) to be effective propaganda.

  3.  **Drafting the Argument for Inconsistency (The "Strongest Case"):**
      *   *Thesis:* Du Bois is trying to square a circle. He wants the moral authority of "Truth/Beauty" (which implies autonomy) while demanding the utility of "Propaganda" (which implies instrumentalization).
      *   *Point 1: The Definition Shift.* He shifts "propaganda" from *effect* (people change their minds because they saw truth) to *intent* (I am making this to change minds). If it's inevitable (byproduct), you don't need to command it. If you command it, it's not inevitable.
      *   *Point 2: The Constraint on Beauty.* If Truth is the handmaid of Imagination, the artist follows the muse. If the artist *must* serve a cause, the Cause becomes the master, not Imagination. Du Bois demands the artist serve the Cause *while claiming* the Cause is served by following the Muse. This creates a conflict of interest for the artist.
      *   *Point 3: The Truth Trap.* If propaganda is the goal, "Truth" becomes tactical. Do I show the criminal in the Black community? If it hurts the Cause, is it "True" enough? Du Bois says show the whole truth, but also says the art *must* work for the cause. These can contradict.
      *   *Conclusion on Inconsistency:* It is a genuine philosophical tension, not just rhetorical flourish. He wants art to be autonomous enough to be credible but heteronomous enough to be useful.

  4.  **Determining Which Notion Does the Work:**
      *   *Option A: Inevitable Byproduct.* This gives art its dignity. It protects the artist from being a mere pamphleteer.
      *   *Option B: Deliberate Weapon.* This gives art its urgency and political justification in a crisis.
      *   *Analysis:* The "Deliberate Weapon" is the *goal*, but it borrows its credibility from the "Inevitable Byproduct." Without the claim that "True Beauty reveals Truth," the demand for propaganda is just censorship. Du Bois needs the "Byproduct" argument to make the "Weapon" argument palatable to artists.
      *   *Verdict:* The "Deliberate Weapon" is doing the *political* work (what he wants to happen). The "Inevitable Byproduct" is doing the *aesthetic* work (justifying why it's still art). The "Byproduct" claim is coasting on the "Weapon's" urgency, while the "Weapon" claim is coasting on the "Byproduct's" integrity. Actually, it's more that the "Weapon" is the *driver*, and the "Byproduct" is the *alibi*.

  5.  **Addressing the User's Novel (The Practical Application):**
      *   *Can they switch from "Is this propaganda?" to "Is this true?"*
      *   *Nuance:* Yes, but with a warning. Du Bois's tension exists *because* "Truth" in a racialized society is political.
      *   *The "Preachy" Note:* Writing groups usually mean "characters are mouthpieces" or "narrative is resolving moral complexity too neatly."
      *   *Du Bois's Lesson:* The "preachiness" comes when the "Deliberate Weapon" overtakes the "Handmaid of Imagination." If the housing discrimination case is resolved by a speech rather than the messy reality of the family's experience, it's bad propaganda (by Du Bois's own standard of Truth).
      *   *Advice:* Keep asking "Is this true?" but define "True" as "complex/human" not just "factually accurate to the case." If the truth is messy, show the mess. That satisfies Du Bois's "Truth" requirement and fixes the "Preachy" note.

  6.  **Refining the Tone:**
      *   The user is smart, well-read, and looking for a rigorous intellectual sparring partner.
      *   Avoid condescension. Acknowledge the depth of their reading.
      *   Be decisive on the "Inconsistency" prompt (they asked for the strongest case *for* inconsistency).
      *   Connect the theory back to the craft of fiction.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific prompt? "Make the strongest case... that this is an actual inconsistency." Yes.
      *   *Check:* "Tell me which... is doing the real philosophical work." Yes.
      *   *Check:* "Mostly I'm trying to figure if I can retire 'is this propaganda'..." Yes.
      *   *Caution:* I need to make sure I don't just trash Du Bois. His tension was strategic. But the prompt asks me to argue *for* the inconsistency. I will frame it as a "strategic contradiction" that creates artistic risk.
      *   *Refinement on "Preachy":* Explain *why* the writing group feels it's preachy. Usually, it's because the "Weapon" is visible.

  8.  **Final Polish:** Organize into clear sections. Use the user's terminology ("handmaid," "compulsion," "weapon"). Ensure the advice on the novel is actionable. (Self-correction: Make sure to explicitly validate that their reading of Du Bois is astute.)

  9.  *(Final thought before generating)*: The user is asking for permission to prioritize Truth over Propaganda. Du Bois would say they are the same. I need to tell them that prioritizing Truth *is* the best way to solve the Propaganda problem, effectively siding with one half of Du Bois's contradiction to solve the other.

