      *   *Specifics:* The guide explicitly said he'd been stiffed before. This highlights the selection pressure. The user passed the "scan."
      *   *Key Insight:* The decision wasn't made at home. The decision was made *when the promise was accepted*. The payment is just the execution of that earlier decision. If you view the "self" as continuous, reneging is a failure of the earlier plan.

  6.  **Final Polish (Tone):**
