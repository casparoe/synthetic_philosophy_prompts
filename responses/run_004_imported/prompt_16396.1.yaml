answer: |-
  This is a textbook example of a problem that has been extensively debated within the rationalist community. In fact, your situation is nearly isomorphic to one of the most famous thought experiments in decision theory: **Parfit's Hitchhiker.**

  To answer your question directly: Your friend is applying **Causal Decision Theory (CDT)**, which is the intuitive, default mode of reasoning for most people. Under CDT, she is technically correct: at the moment you are home safe, the money is gone regardless of your choice, and paying yields no *causal* benefit to your current state.

  However, by the standards of the rationalist idiom you have been studying (specifically **Timeless Decision Theory** or **Updateless Decision Theory**), **you were rational to pay, and she is mistaken.** Paying was not merely "decency"; it was the output of a superior decision algorithm.

  Here is the breakdown of why your intuition holds up under scrutiny, and how to explain it to your friend.

  ### 1. The Problem with "Ex Post" Rationality
  Your friend's argument relies on slicing time into discrete, isolated moments. She argues that at Time B (home safe), the utility of Time A (the rescue) is sunk. Therefore, any action at Time B that reduces your current resources without changing Time A is a loss.

  This is the **Dynamic Inconsistency Problem**. If you reason this way at Time B, you must also reason this way at Time A. If you know at Time A that you will reason this way at Time B, you cannot credibly promise to pay at Time B. If you cannot credibly promise, the guide (who is simulating your likely behavior, as evidenced by his "studying you") does not rescue you. You die.

  A rational agent wants to be the *kind of agent* that gets rescued. To be that kind of agent, you must be the kind of agent that pays.

  ### 2. Parfit's Hitchhiker
  Your story is almost exactly the scenario proposed by philosopher Derek Parfit. A hitchhiker is dying in the desert. A driver offers a ride only if the hitchhiker promises to pay $100 upon arrival. Once at the destination, the hitchhiker has no incentive to pay. The driver knows this.
  *   **CDT Agent:** Predicts they won't pay. Driver won't pick them up. Hitchhiker dies.
  *   **TDT/UDT Agent:** Precommits to paying. Driver predicts this. Hitchhiker lives and pays $100.

  The rationalist definition of rationality is **"winning."** Which agent won? The one who is alive. The one who is alive is the one who paid. Therefore, the policy that includes paying is the rational policy.

  ### 3. Decision Algorithms, Not Isolated Acts
  In the rationalist framework, you do not make decisions in a vacuum. You are an instantiation of a decision algorithm. When you decide whether to pay, you are not just deciding for *this* Tuesday; you are determining the output of your algorithm for *all* situations structurally identical to this one, including the counterfactual where the guide is deciding whether to trust you.

  The guide looked you in the eye and tried to "read" your algorithm. He was looking for evidence that your source code includes `IF promised THEN pay EVEN IF unenforced`.
  *   If your source code is `IF safe THEN renege`, the guide detects this (or assumes it based on priors), and you are not rescued.
  *   If your source code is `IF promised THEN pay`, the guide detects this, rescues you, and you pay.

  By paying, you validated the algorithm that saved your life. If you had not paid, you would have proven that your algorithm is "untrustworthy," which is a dangerous trait to possess in a world where you might need trust again.

  ### 4. Precommitment and Reflective Consistency
  Rationality requires **reflective consistency**. You should not wish you had a different mindset than the one you have.
  *   **Before the rescue:** You desperately wish you were a person who would pay, because that person gets rescued.
  *   **After the rescue:** Your friend suggests you should wish to be a person who keeps the money.

  If you adopt your friend's view, you create a conflict between your *ex ante* self (who wants to survive) and your *ex post* self (who wants to save $100). A rational agent aligns these interests by binding their future self to the plan that maximizes *ex ante* expected utility. Paying the money is simply executing the precommitment you implicitly made when you accepted the ride.

  ### 5. Why "Decency" is a Heuristic for Rationality
  Your friend draws a distinction between "rationality" (self-interest) and "decency" (moral obligation). In high-level game theory, this distinction often collapses.

  "Decency" or "honor" can be viewed as a **heuristic for precommitment.** Humans are not perfect calculators. We cannot simulate every game tree. Instead, we cultivate emotional aversions to breaking promises (guilt, shame) and emotional rewards for keeping them (pride). These emotions act as an enforcement mechanism when external enforcement is absent.

  By feeling compelled to pay, you demonstrated that you possess this internal enforcement mechanism. This makes you a viable partner for future cooperative ventures (not just with this guide, but with anyone who can model your behavior). Burning the money was the cost of maintaining a high-value reputation algorithm.

  ### How to Explain This to Your Friend
  You likely couldn't explain this to her because she is operating under CDT, which treats the past as immutable and unrelated to the current decision. To bridge the gap, try this analogy:

  > "Imagine I could press a button right now that would have guaranteed you were rescued last winter, but pressing it costs $500 today. Would you press it? Of course.
  >
  > The problem is, the button *was* pressed last winter. The button was my character. The cost of that button is paid now. If I refuse to pay now, I am effectively smashing the button for next time. I am choosing to be the kind of person who doesn't get rescued in counterfactual worlds. I'd rather have $500 less and be the kind of person who survives."

  ### Conclusion
  You acted rationally. You recognized that the decision point was not when you were home safe, but when you were on the mountain. The payment was the final step of a single, extended decision process that began when you accepted his offer.

  Your friend views rationality as **maximizing utility at the current node** of the decision tree.
  You (and the rationalist canon) view rationality as **maximizing utility across the entire decision tree.**

  In situations involving promises, reputation, or prediction (Newcomblike problems), the latter definition is the one that keeps you alive. You should feel confident that you "won" the scenario, and that your willingness to pay was the specific move that secured the win.
