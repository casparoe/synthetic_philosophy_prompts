answer: |-
  Here is a draft of ten questions (organized into five thematic blocks) designed for your podcast interview. They are structured to be respectful but rigorous, progressively narrowing the space for a purely introspective defense.

  Each block includes the primary question and a follow-up keyed to the answer she is most likely to give, with specific instructions on how to handle the "phenomenology settles it" move if she attempts it.

  ### Block 1: The Confound Problem (Firestone & Scholl)

  **Question 1:**
  "Your showcase cases—like the hill looking steeper when fearful or the target looking larger after a successful throw—are compelling introspectively. However, Firestone and Scholl's methodological critique suggests that demand characteristics, attentional weighting, and post-perceptual judgment can mimic the *report* of a perceptual change without actually altering early vision. Beyond the introspective report itself, what methodological criteria do you use to distinguish a genuine change in perceptual content from a change in how the subject attends to or judges a stable perceptual input?"

  **Follow-up 1 (Keyed to her likely appeal to phenomenology):**
  "If your answer is that the phenomenology itself carries a marker of 'perceptualness' that distinguishes it from judgment, I'm worried we face a reliability gap. Subjects often report phenomenological differences in cases of illusion or bias that we later explain away as cognitive errors. If the only arbiter is the subject's introspection, how do you rule out the possibility that what you're identifying as 'cognitive penetration' is actually a sophisticated form of cognitive *illusion* about one's own perception?"

  *Interviewer Note:* If she insists phenomenology is self-verifying, press her on whether she accepts any third-person psychophysical measure (e.g., priming effects that bypass report) as necessary conditions, or if her view is immune to third-person disconfirmation.

  ### Block 2: Predictive Processing and Trivialization

  **Question 2:**
  "Contemporary predictive-processing models describe perception as inference from priors, where top-down signals constantly shape lower-level processing. On this picture, some degree of top-down shaping is constitutive of perception itself. Does adopting a predictive-processing framework trivialize your thesis by making cognitive penetrability the default state of the system, and if not, how do you distinguish a 'perceptual prior' from a 'cognitive belief' within that architecture?"

  **Follow-up 2 (Keyed to her likely distinction between 'types' of priors):**
  "Suppose you argue that only *semantic* or *conceptual* states count as cognitive penetrators, whereas mere statistical priors do not. Given that predictive coding often treats concepts and statistical expectations as operating on the same currency of precision-weighted prediction errors, where exactly do you draw the line? Is there a functional or anatomical boundary you can point to, or does the line rely, again, on how the state feels to the subject?"

  *Interviewer Note:* This forces her to specify the "Cognitive" in Cognitive Penetrability. If she retreats to phenomenology here, note that predictive processing is usually sub-personal and inaccessible to introspection, creating a tension with her methodological reliance on introspection.

  ### Block 3: Epistemic Downgrade and Circularity

  **Question 3:**
  "A major philosophical worry, raised by Susanna Siegel and others, is the epistemic downgrade argument: if a prior belief alters perceptual experience, and that experience is then used as evidence to confirm the belief, we seem to license a vicious circularity. Does your view entail that penetrated experiences lose their justificatory power, or do you argue that a penetrated experience can still serve as fresh evidence for the belief that caused it?"

  **Follow-up 3 (Keyed to her likely defense of justificatory status):**
  "If you maintain that penetrated experience *does* justify the belief, consider cases of implicit bias, such as a security guard perceiving a weapon in the hand of a person from a specific demographic due to antecedent stereotypes. If the perception itself is altered by the stereotype, and that perception justifies the action, doesn't your view make these biases epistemically self-sealing and practically impossible to correct through observation?"

  *Interviewer Note:* This moves the debate from metaphysics to ethics/epistemology. If she says "phenomenology reveals the bias," press that the whole point of implicit bias is that the phenomenology *doesn't* reveal the influence.

  ### Block 4: The Stakes (Modularity vs. Terminology)

  **Question 4:**
  "Much of the original debate was framed against Fodor's encapsulation thesis. But if we accept that the mind is massively interactive, as most connectionists and predictive processors do, is there anything substantive left to fight over? Does your defense of cognitive penetrability still carry the burden of proving the mind is *not* modular, or has the debate shifted to something else?"

  **Follow-up 4 (Keyed to her likely claim about 'Architectural Boundaries'):**
  "If the disagreement is no longer about strict modularity, is it possible this is largely a terminological dispute about where we draw the label 'perception'? If we agreed on all the empirical data regarding top-down influence but disagreed only on whether to call it 'perception' or 'cognition-imbued-perception,' would anything objective about the world or the mind hang on that classification?"

  *Interviewer Note:* This challenges the *importance* of the view. If she says "It matters for objectivity," pivot to the final closing question. If she says "It's just terminology," ask why she defends it so vigorously.

  ### Block 5: Falsification and Closing

  **Question 5:**
  "In your published replies to critics, you often treat proposed counterexamples as cases where confounds haven't been sufficiently ruled out. To close, I'd like to ask a question about falsification: What specific pattern of empirical results, if it came in tomorrow, would you accept as decisive evidence *against* cognitive penetrability? Is there a psychophysical signature that would convince you the phenomenology was misleading?"

  **Follow-up 5 (Keyed to her likely hesitation to specify):**
  "If the answer is that no third-person result could override the first-person phenomenological report, are you concerned that this renders the thesis unfalsifiable in principle? And if it is unfalsifiable, should we treat it as a metaphysical claim about the mind, or a methodological commitment to trusting introspection over experimental control?"

  *Interviewer Note:* This is the trapdoor. If she admits a result could change her mind, you have moved past the stalemate. If she says nothing could, you have successfully highlighted the dogmatic nature of the "phenomenology settles it" defense for your audience.
