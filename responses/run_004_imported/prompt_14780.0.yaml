answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I'm Priya's oldest friend. We go back to the... let's call them "early internet forum" days. Back when we bonded less over shared hobbies and more over shared spreadsheets of existential risk.

  So, when Priya asked me to give this toast, she gave me one rule: "Do not explain the contract."

  (Laughter)

  For the half of the room currently leaning forward: Yes, there is a contract. Early on, Priya and Dev realized they had a classic problem. They loved each other, but they also loved... well, comfort. Routine. The gravitational pull of doing nothing on a Friday night.

  So, they did what any two rational people would do. They wrote a precommitment contract. If they flaked on date night, there were financial penalties. Stakes.

  Now, I know what some of you are thinking. The parents, the aunts, the romantics in the room. You're thinking, "Wait. Isn't love supposed to be spontaneous? Isn't putting a price tag on a date night... cold?"

  And to the rationalists in the room, I see you nodding. You're thinking, "Finally, people who understand incentive compatibility."

  (Laughter)

  But here is the thing I want to say to everyone, regardless of whether you know what a discount curve is.

  We tend to think of love as a feeling. A spark. A state of grace. But anyone who has been married for more than five years knows that feelings are... weather. They change. They are subject to storms. They are subject to what economists call "hyperbolic discounting," which is a fancy way of saying: *Present You* wants to be a good partner, but *Future You*—specifically *Future You* on a random, miserable Tuesday in year twelve, when you're tired and the sink is leaking and you just want to sleep—Future You is a different person. Future You is willing to sacrifice the long-term marriage for a little short-term comfort.

  Priya and Dev understood something profound. They understood that the "You" of today is making a promise to the "You" of ten years from now. And since they can't trust that future version of themselves to make the right choice when they're exhausted, they decided to tie their own hands.

  It's the story of Odysseus and the Sirens. Odysseus wanted to hear the song, but he knew he wouldn't want to hear it when he was in the moment. So he had his crew tie him to the mast. He restricted his future freedom to save his future life.

  Most people think a wedding vow is a declaration of how you feel *right now*. "I love you today." That's easy. Anyone can say that.

  But Priya and Dev treat their vows as a treaty between their successive selves. They are saying: "We know there will be Tuesdays where we do not feel like being married. We know there will be days where the rational choice for the individual is to check out. So we are building a mast. We are building a structure that holds us together when the weather turns."

  For the record, the joke I promised the rationalists? It's about the penalty clause. Dev learned pretty quickly that "traffic" is not a valid excuse for missing dinner if the GPS data says otherwise.

  (Bigger Laughter)

  But seriously. Some people think acknowledging the difficulty of marriage is cynical. I think it's the opposite. Blind optimism says, "Nothing will ever go wrong, so we don't need a plan." That's fragile.

  What Priya and Dev have is antifragile. By admitting that they are human, that they are prone to drift, and that love requires *work*—actual, enforced work—they aren't reducing their love to a transaction. They are elevating it to a priority.

  They are saying that their commitment is more important than their momentary impulses. They are saying that the relationship is a third entity in the room, more important than either of their individual moods on any given Tuesday.

  That isn't cold. That is the warmest, safest place you can build a life. It's knowing that when the spark fades, the structure holds. It's knowing that you are loved not just for who you are when you're happy, but for who you are when you're tired, and that you have a partner who has literally signed a document saying they won't let you drift away.

  So, if you'll raise your glasses.

  To Priya and Dev. May your discount rates be low, your penalties never trigger, and may you always find your way back to the mast, together.

  To the couple!
