answer: |-
  This is a rich comparison that cuts to the heart of how we model normativity under conditions of plurality. While both Toby Ord's **Moral Trade** and the **Parliamentary Model** (Bostrom; Ord & Newberry) employ the language of bargaining to resolve normative conflict, they operate on fundamentally different ontological levels. One is a mechanism for social coordination; the other is a heuristic for individual deliberation.

  Here is a comparison of the two proposals, an analysis of whether the justification for moral trade transfers to the parliamentary model, and an evaluation of their respective defensibility.

  ### 1. What is Exchanged, and Between Whom?

  The primary distinction lies in the **ontology of the parties** and the **currency of the exchange**.

  **Moral Trade (Interpersonal)**
  *   **Between Whom:** Distinct moral agents (e.g., a utilitarian and a deontologist). These are ontologically real beings with distinct psychologies and capacities for agency.
  *   **What is Exchanged:** *Behavioral compliance.* Agent A agrees to perform action $X$ (which is costly to A but valuable according to B's moral theory) in exchange for Agent B performing action $Y$ (costly to B, valuable to A).
  *   **Nature of the Deal:** It is a causal swap of influence over the external world. I give up my right to decide what I eat; you give up your right to decide where your money goes.

  **The Parliamentary Model (Intrapersonal)**
  *   **Between Whom:** Hypothetical delegates representing moral *theories* within a single agent's mind (e.g., the "Utilitarian Delegate" and the "Virtue Ethics Delegate"). These are not real agents; they are personifications of the agent's own credences.
  *   **What is Exchanged:** *Decision weight.* The theories bargain over which actions the single agent should perform. The Utilitarian delegate might concede on a issue of personal integrity in exchange for the Virtue Ethics delegate supporting a high-impact donation.
  *   **Nature of the Deal:** It is an internal allocation of deliberative priority. No external agency is swapped; rather, the agent's own decision-making procedure is adjusted to reflect a compromise between competing internal standards.

  ### 2. Does the Justification Transfer?

  The justification for Moral Trade rests on standard welfare economics: **voluntary participation guarantees a Pareto improvement.** If both parties voluntarily enter the trade, they must both expect to be better off (according to their own values) than in the status quo. This relies on two conditions: **consent** and the **ability to walk away.**

  **The Transfer Failure**
  This justification does not cleanly transfer to the Parliamentary Model for two critical reasons:

  1.  **The Impossibility of Consent:** In Moral Trade, agents have welfare interests that can be improved. In the Parliamentary Model, moral theories do not have welfare. A utilitarian theory does not "feel better" when it wins a vote; it is simply a proposition about what is right. Therefore, there is no sense in which the "parties" are made better off. The "improvement" is not a Pareto gain for the delegates, but rather an attempt by the *agent* to maximize *expected choiceworthiness* (or a similar meta-ethical metric) under uncertainty.
  2.  **The Inability to Walk Away:** In Moral Trade, if the deal is bad, I refuse it. In the Parliamentary Model, the agent cannot simply "walk away" from a theory in which they hold non-zero credence. If I have 5% credence in a theory that demands extreme sacrifice, the parliamentary model suggests this theory still gets delegates and bargaining power. I cannot exclude it from the parliament without violating the norms of rationality regarding my own uncertainty. This removes the "voluntary" safeguard that prevents exploitation in ordinary trade.

  Consequently, the Parliamentary Model is not truly a bargaining scenario in the economic sense. It is a **social choice problem mapped onto a single mind.** The "bargaining" is metaphorical; it is a way of visualizing how to aggregate non-comparable values (e.g., how to weigh "units of happiness" against "degrees of virtue") when simple expected utility maximization is mathematically impossible due to scale incompatibility.

  ### 3. Which Proposal is More Defensible?

  While the Parliamentary Model is a brilliant heuristic for handling structural moral uncertainty, **Moral Trade is the more defensible proposal.**

  **Why Moral Trade is More Robust**
  Moral Trade relies on no controversial meta-ethics. It works whether you are a moral realist, an expressivist, or an error theorist. It simply observes that agents have different comparative advantages in producing moral value (as defined by their own lights) and allows them to cooperate.
  *   **Normative Safety:** It respects autonomy. No one is forced to trade.
  *   **Ontological Clarity:** The parties are real. The exchange is real. The benefits are real.
  *   **Defusiveness:** It effectively defuses disagreement without requiring anyone to change their mind about the truth of their moral theory.

  **The Problems with the Parliamentary Model**
  The Parliamentary Model, while ingenious, suffers from the "category error" of treating propositions as people.
  *   **The Fanaticism Problem:** If bargaining power is proportional to credence, a tiny credence in an extreme theory (e.g., "suffering is infinitely bad") can hold the rest of the parliament hostage. In real trade, I wouldn't trade with a partner who demands infinite resources; in the parliamentary model, the "delegate" for that theory is already inside the room and cannot be ejected.
  *   **Arbitrariness of Delegation:** As noted by Ord and Newberry in their formalization (e.g., *Variance Voting*), we need complex rules to determine how many "seats" a theory gets. Why should credence determine voting power? Why not bargaining power based on the intensity of the theory's demands? These are meta-ethical questions the model claims to solve via bargaining, but which actually must be solved *before* the bargaining can begin.
  *   **Reification Risk:** There is a psychological danger in treating moral theories as agents. It may encourage agents to compartmentalize their morality rather than seeking a reflective equilibrium.

  **Conclusion**
  Moral Trade is a literal application of bargaining theory to ethics; the Parliamentary Model is an analogical one.

  Moral Trade is more defensible because the **bargaining metaphor matches the reality.** There are actual parties, actual consent, and actual gains. The Parliamentary Model is a useful *deliberative tool* for when we face incomparable values, but its justification cannot rest on the Pareto efficiency of voluntary trade, because theories cannot consent and agents cannot opt out of their own uncertainty.

  Therefore, while the Parliamentary Model is a sophisticated response to *uncertainty*, Moral Trade is the superior response to *disagreement*. If forced to choose the more defensible use of the bargaining framework, it is Moral Trade, because it avoids the metaphysical baggage of populating one's mind with fictitious voters who demand representation for dangerous ideas. Moral trade allows us to cooperate despite our differences; the parliamentary model asks us to fractalize those differences within ourselves, a move that is heuristically helpful but normatively precarious.
