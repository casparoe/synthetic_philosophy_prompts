answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Two philosophers, **ELARA** (a Contextualist) and **MARCUS** (a proponent of Pragmatic Encroachment/SSI), are reviewing a draft of a paper based on a colleague's recent experience with a real estate wire transfer.*

  **Elara:** So, this case is perfect. The "Wire Transfer Case." Your colleague has the same email evidence in the low-stakes imagination as in the high-stakes reality. In the imagination, they say, "I know these are the right instructions." In reality, right before closing, they say, "I don't know." Same evidence, different truth value for the knowledge claim. That is the textbook signature of Contextualism.

  **Marcus:** Is it? Or is it the textbook signature of the fact that knowledge isn't just about evidence? In the low-stakes imagination, the risk of error is negligible. In the high-stakes reality, losing six figures is catastrophic. The *subject's* practical environment changed. That's Pragmatic Encroachment. The standards for knowledge didn't shift because of the word "know"; they shifted because the subject's relationship to the truth changed.

  **Elara:** But look at *who* is speaking. In both scenarios, it's the subject doing the attributing. "I know" vs. "I don't know." On my view, the semantic content of "knows" is sensitive to the *attributor's* context. When your colleague imagined the low-stakes scenario, they were in a relaxed context. The semantic bar was low. When they sat at the closing table, the context was high-pressure. The semantic bar rose. The word "knows" is indexical, like "tall." You can be tall for a jockey but not tall for a basketball player.

  **Marcus:** And that's where you lose me. "Tall" is clearly about the comparison class. But "knows"? If I say, "I know the bank is open," and you say, "No, you don't," we feel like we're contradicting each other. If Contextualism is right, we aren't. You're saying "I know-by-low-standards" and I'm saying "You don't know-by-high-standards." We're talking past each other. But it doesn't *feel* like talking past each other. It feels like a disagreement. This is the "Semantic Blindness" objection. Speakers are blind to the context-sensitivity you claim is there.

  **Elara:** I'm not blind to it; I just think the shift is subtle. Look at your view, Marcus. Subject-Sensitive Invariantism. You say the semantic content is fixed, but the stakes determine if the subject clears the bar. Here's my killer objection: The "Unaware High-Stakes" case. Suppose your colleague *didn't* realize wire fraud was common. Suppose they thought it was a low-stakes transfer, but objectively, if they got it wrong, they'd lose their life savings. On your view, do they know the instructions are correct?

  **Marcus:** If the stakes are objectively high, then no. They don't know.

  **Elara:** That seems absurd. Their mental state is identical to the low-stakes version. They are rational in acting on the belief. But you're saying they lack knowledge simply because the world is dangerous, even if they don't know it? Knowledge becomes external to the subject's perspective in a way that severs the link between rationality and knowledge.

  **Marcus:** Not absurd, Elara. Just realistic. Knowledge is the norm of action. If you can't rationally act on it given the *actual* stakes, you don't know. If I hand you a glass I believe is water, but it's actually acid, you don't *know* it's water, even if you have every reason to think it is. The danger is real. Why should epistemic status ignore practical danger? Your colleague felt the shift. They said, "I genuinely couldn't say I knew." That wasn't a semantic glitch; that was a recognition that their evidence wasn't good enough *for what they had to do*.

  **Elara:** But notice the phrasing: "I couldn't *say* I knew." That points to assertion conditions. Contextualism explains this beautifully. In high-stakes contexts, it becomes inappropriate to *assert* "I know" because the standards for appropriate assertion rise with the context. The underlying fact of the matter might be fuzzy, but the linguistic rule is clear. You're trying to bake the pragmatics of assertion into the metaphysics of knowledge.

  **Marcus:** And you're trying to explain away a real metaphysical shift as a mere linguistic trick. Let's press this. Is our dispute substantive? Or are we just labeling the same phenomenon differently? We both agree: Evidence stayed constant. Stakes rose. Knowledge attribution vanished.

  **Elara:** It's substantive if we can find a case where the *attributor's* stakes and the *subject's* stakes come apart. That's the wedge. Imagine I am a bank teller (high stakes for me if I give wrong info). You are a casual customer (low stakes for you). I ask you, "Do you know the bank is open?" If Contextualism is right, *my* high-stakes context sets the standard. You likely don't "know" relative to my standards.

  **Marcus:** And if Encroachment is right, *your* low stakes determine whether you know. So you *do* know.

  **Elara:** Exactly. So we have different predictions. But in the Wire Transfer Case, the subject and attributor are the same person. The stakes align. So in *this* specific case, we are empirically equivalent.

  **Marcus:** I'm not sure they align even there. When your colleague imagined the scenario, they were the subject *and* attributor, but the *practical* stakes were simulated. When they were at the closing table, the stakes were real. Contextualism says the *conversational* context changed. Encroachment says the *practical* context changed.

  **Elara:** But isn't the conversational context just a reflection of the practical one? If I'm betting a million dollars on a coin flip, I'm not going to say "I know it's heads" even if I'm 99% sure. Why? Because the conversation has shifted to a high-stakes register.

  **Marcus:** No, you won't say it because you *don't know it*. The pressure doesn't change the meaning of "know"; it changes whether you meet the condition. Think about the "Semantic Blindness" again. If I tell you, "You know the instructions are right, but you don't know the instructions are right," you hear a contradiction. If Contextualism is true, that sentence could be true (Low-standards Know & High-standards ~Know). But no speaker accepts that sentence. They hear nonsense. That suggests the meaning of "know" isn't shifting.

  **Elara:** I have an error theory for that. We are blind to the context-sensitivity because it happens automatically, like shifting focus in vision. We don't notice the lens adjusting, only the clarity of the image. But let's turn your "Unaware High-Stakes" objection back on you. If a subject is unaware of the stakes, they will assert "I know." They will act. If you say they are wrong, you are saying knowledge is something that can vanish without the subject's cognitive state changing. That makes knowledge less about the subject's competence and more about the environment's hostility.

  **Marcus:** Epistemology *should* be about navigating the environment! If the environment is hostile, you need better evidence to navigate it. That's the insight. Your colleague's evidence (the email) was sufficient for a low-stakes world. It was insufficient for a world with wire fraud. The world changed, not the word.

  **Elara:** But the world didn't change between the imagination and the reality. The *email* was the same. The *fraud risk* was objectively present in both scenarios (fraud exists regardless of whether you are imagining it). What changed was your colleague's *attention* to the risk. That sounds like a shift in salience, which is a contextual factor.

  **Marcus:** Salience matters, yes. But salience matters because it highlights the *practical consequences*.

  **Elara:** Okay, let's try to settle the "Substantive vs. Verbal" question. If we both agree that in high-stakes situations, subjects require more evidence to properly claim knowledge and act, what hangs on the label?

  **Marcus:** It hangs on the explanation of *why* they require more evidence. If it's semantic (Contextualism), then in a low-stakes context, a subject with weak evidence *literally knows*. If it's encroachment, they *never really knew* if the stakes were high, even if they thought they were low.

  **Elara:** And that matters for...?

  **Marcus:** For criticism and advice. If your colleague comes to me and says, "I thought I knew, but I was wrong," on my view, I say, "Yes, given the stakes, your evidence was insufficient." On your view, I might say, "Well, relative to your earlier context, you did know, but you can't say it now." That's confusing. It suggests they lost a fact they once possessed.

  **Elara:** But your view suggests they never had it, which undermines their prior rationality. They acted rationally in the imagination. If they didn't know, were they irrational to assert they did?

  **Marcus:** No, because they reasonably *believed* the stakes were low. It's a reasonable false belief about the practical environment.

  **Elara:** This is the stalemate, isn't it? We can both model the Wire Transfer Case. I model it as a shift in the semantic parameter $s$ (standards). You model it as a shift in the practical threshold $t$ required for the fixed relation $K$.

  **Marcus:** Mathematically, they look isomorphic. $K(s, e)$ vs $K(e, t)$.

  **Elara:** But the metaphysics differ. I'm saying "knows" is incomplete without a context. You're saying "knows" is complete but hard to satisfy.

  **Marcus:** Here is where I think it might be merely verbal. We are both trying to capture the intuition that knowledge is the "sufficient epistemic position for action."

  **Elara:** I'll concede that we share that core intuition. But I deny it's merely verbal because of third-party attributions. If a detective asks me, "Did the victim know the wire instructions were fake?" and the victim is dead (so no stakes for them), but the detective is investigating a massive fraud ring (high stakes for the investigation)...

  **Marcus:** ...Then on my view, the victim's knowledge depends on the *victim's* stakes. On your view, it depends on *my* stakes as the attributor.

  **Elara:** Precisely. If I say "The victim knew," and you say "No, the victim didn't know," and we are both speaking in the same high-stakes investigative context...

  **Marcus:** ...I say they didn't know because their evidence was just an email. You say they *might* have known if we evaluate them by their own low-stakes context, but I can't truthfully say "They knew" in my high-stakes context.

  **Elara:** So the dispute is substantive regarding *whose* context matters. The subject's or the attributor's.

  **Marcus:** Agreed. But in the Wire Transfer Case, the subject *is* the attributor. So the case underdetermines the theory.

  **Elara:** Which means your colleague's experience, while visceral, doesn't solve the philosophical debate. It just motivates it.

  **Marcus:** It does something else, though. It shows why we care. If I'm right, epistemology is practical. You can't do it in an armchair ignoring what's at risk. If you're right, epistemology is linguistic. We need to understand how we talk about risk.

  **Elara:** I'd argue that even if it's linguistic, it reflects a deep feature of how we coordinate action. We raise standards to coordinate caution.

  **Marcus:** And I'd argue that raising standards *is* the caution. It's not just talk.

  *They sit in silence for a moment, watching a student across the room nervously check their phone before transferring money.*

  **Elara:** Do you think that student knows the app is secure?

  **Marcus:** Depends on how much money they're sending.

  **Elara:** And depends on how carefully I'm watching them.

  **Marcus:** *Smiles.* Shall we get another coffee?

  **Elara:** I don't know if I can afford it.

  **Marcus:** See? You're encroaching.

  **Elara:** No, I'm contextualizing.

  *They both laugh, stand up, and walk toward the counter, neither having conceded, but both acknowledging the other's grip on the puzzle.*
