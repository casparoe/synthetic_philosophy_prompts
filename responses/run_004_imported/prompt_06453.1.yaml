answer: |-
  Here are 10 interview questions tailored for your podcast. They are designed to move past the basics of the discursive dilemma and dig into the metaphysical and normative implications of your guest's realist position.

  The first three questions address your specific requirements (Realism vs. Supervenience, Procedure Selection, and List-Pettit Axioms), each including a targeted follow-up based on the most likely philosophical response.

  ### The "Hard Metaphysics" Questions

  **1. The Case for Ontological Realism**
  You argue that the discursive dilemma shows groups are genuine subjects, not just aggregates. But a "supervenience individualist" could concede that group attitudes are inconsistent without conceding that a *new entity* exists. They might say group attitudes are just complex relational states among individuals. Why does collective inconsistency force us to posit a distinct ontological subject rather than just acknowledging a complex failure of coordination among individuals?
  *   **Follow-up:** (If she argues that distinct subjecthood is required for responsibility): "If the goal is responsibility, doesn't positing a group agent risk letting individuals off the hook? If the 'Court' is the blameworthy subject, can individual judges claim they were merely cells in the organism? Why do we need a metaphysically distinct 'ghost in the machine' to solve a problem of accountability?"

  **2. The Circularity of Procedure Selection**
  To resolve the dilemma, a group must adopt an aggregation procedure (like premise-based vs. conclusion-based). But choosing a procedure seems to require a prior intention or decision by the group. Doesn't selecting the procedure presuppose the very group agency you're trying to prove? How do you escape this circularity without saying the agency exists *before* the rules are in place?
  *   **Follow-up:** (If she argues agency is a normative achievement constituted by the rules): "So, does that mean group agency is a matter of degree? If a committee picks a 'irrational' procedure, do they cease to be an agent, or are they just a *bad* agent? At what point does a collection of people fail to qualify as a group subject in your view?"

  **3. The List-Pettit Impossibility Theorem**
  List and Pettit show we can't satisfy Universal Domain, Anonymity, Systematicity, and Collective Rationality simultaneously. As a defender of group agency, you clearly want to preserve Collective Rationality. Which of the other three axioms are you willing to sacrifice, and why is that the least costly trade-off for a theory of genuine group judgment?
  *   **Follow-up:** (If she sacrifices Anonymity to save Rationality): "If you sacrifice Anonymity, you're essentially endorsing hierarchical weighting (e.g., experts or chairs count more). Does this make genuine group agency inherently elitist? Can a strictly democratic group—one-person-one-vote—ever meet your threshold for being a rational agent?"

  ### The Normative & Practical Implications

  **4. Diachronic Identity**
  Individual members of a court or a firm come and go, yet we treat the institution as the same agent over decades. What grounds the *identity* of the group agent over time? Is it purely the continuity of the decision-making rules, or is there a substantive "will" that persists independently of the membership roster?

  **5. Instrumentalism vs. Realism**
  Many economists and legal theorists treat group agents as "useful fictions"—instrumental models that predict behavior without committing to metaphysical realism. What practical or explanatory work does your *realist* view do that instrumentalism cannot? If the predictions are the same, why bear the ontological cost?

  **6. The Distribution of Blame**
  If a group agent is a genuine subject, it can bear responsibility. But does this responsibility *replace* individual responsibility or *supplement* it? In cases of corporate crime or unjust judicial rulings, how do you parse the moral remainder that attaches to the individuals who voted for the outcome?

  **7. Functionalism and Phenomenology**
  Your view seems to rely on a functionalist account of belief and desire. But individuals have phenomenology—we *feel* doubt or conviction. Can a group agent experience doubt, or is "group belief" purely a dispositional state? If they can't feel the weight of judgment, in what sense are they truly like us?

  ### The Future & Boundaries of Group Agency

  **8. Democratic Legitimacy**
  If we accept that groups need to be rational agents to function, and rationality requires restricting inputs (as per your answer to Q3), does this create a tension with democratic legitimacy? Is there a trade-off between a group's *capacity to act* as an agent and its *right to rule* over its members?

  **9. Algorithmic Members**
  As decision-making committees begin to integrate AI tools that process premises independently, does the "supervenience base" of the group change? Can an algorithm be a member of a group agent, or must all members be capable of moral responsibility for the view to hold?

  **10. The Limits of Aggregation**
  Are there domains where you think group agency is impossible? For example, can a group truly "judge" aesthetic or moral matters where premises aren't easily logically separable from conclusions, or does your framework apply universally to any collective judgment?
