answer: |-
  You have correctly identified the single most important nuance that gets stripped out of pop-science explanations of Arrow's Impossibility Theorem. You are right to be annoyed: saying "Arrow proves fair democracy is impossible" is like saying "Physics proves perpetual motion is impossible, therefore cars can't move." It confuses a logical boundary condition with an empirical reality.

  Here is the strongest possible case for why restricting the domain to single-peaked preferences defangs the "democracy is a myth" crowd, followed by the multidimensional counter-attack and how to salvage the defense.

  ### Part 1: The Case for Single-Peakedness (Defanging Arrow)

  The "democracy is a myth" take relies on treating Arrow's Theorem as an empirical prediction rather than a logical constraint. Arrow proved that **if** you demand a voting system satisfy a specific set of axioms (including Unrestricted Domain), **then** no system exists.

  The "Unrestricted Domain" axiom is the heavy lifter here. It assumes that any logical ordering of preferences is possible (e.g., Voter 1: A>B>C, Voter 2: B>C>A, Voter 3: C>A>B). This specific configuration creates a Condorcet Cycle (A beats B, B beats C, C beats A), leading to intransitive social preferences and instability.

  **The Defense:**
  1.  **Preferences are Structured, Not Random:** In the real world (and especially in an HOA), voters do not generate preferences by rolling dice. Preferences are derived from underlying interests. If the choice is "How much should we spend on the lobby?" (Low, Medium, High), almost no one prefers "Low" and "High" over "Medium." Their utility function is single-peaked.
  2.  **Black's Median Voter Theorem:** As you noted, Duncan Black proved that if preferences are single-peaked along a single dimension, Majority Rule satisfies all of Arrow's conditions. It produces a transitive social ordering, it's non-dictatorial, and it respects Pareto efficiency. The "impossibility" vanishes.
  3.  **Empirical Stability:** The "democracy is a myth" argument implies that democratic outcomes should be chaotic, cycling endlessly with no stable equilibrium. Yet, stable democracies exist. HOAs function. This suggests that the *conditions for chaos* (unrestricted domain) are rarely met in practice.
  4.  **The "Pathology" Argument:** Arrow's theorem identifies a *pathology* of voting, not the *norm*. It tells us that voting systems are vulnerable to manipulation *if* the electorate is deeply polarized in a specific, circular way. But in a healthy polity, consensus tends to cluster around a median. Therefore, for 90% of decisions, the "impossibility" is irrelevant.

  **The Verdict:** The "myth" take is intellectually lazy. It mistakes *logical possibility* for *practical probability*. If human preferences are naturally structured (which evolutionary psychology and political science suggest they are), Arrow's theorem is a warning about edge cases, not a verdict on the system as a whole.

  ***

  ### Part 2: The Multidimensional Counter-Attack

  Now, here is the comeback you anticipated, and it is devastating.

  **The Attack:**
  Politics is rarely one-dimensional. Even in your HOA, a decision isn't just "Spend More vs. Spend Less." It's "Spend More on Security vs. Spend More on Landscaping vs. Spend Less to Keep Dues Low."

  Once you move from a 1D line to a 2D (or n-dimensional) space, **single-peakedness breaks down.**
  *   Voter A wants High Security / Low Landscaping.
  *   Voter B wants Low Security / High Landscaping.
  *   Voter C wants Moderate Security / Moderate Landscaping.

  In multidimensional space, there is usually **no Condorcet Winner.** This is formalized in **McKelvey's Chaos Theorem** (1976). It shows that in a multidimensional majority-rule environment, you can construct an agenda path that leads from *any* policy to *any other policy*. The "median voter" disappears; the "core" is empty.

  This seems to resurrect Arrow's ghost. If issues are multidimensional, majority rule becomes unstable, manipulable by whoever sets the agenda, and potentially intransitive. The "democracy is a myth" crowd can point to this and say, "See? Once things get real, the stability vanishes."

  ***

  ### Part 3: Saving the Defense (How to Survive Multidimensionality)

  Does multidimensionality wreck the defense? **No.** It just shifts the burden from *voter psychology* to *institutional design*. We save the defense by arguing that real-world democracies (and well-run HOAs) introduce friction that artificially restores stability.

  Here is how you save the "Single-Peaked Defense" against the Multidimensional Attack:

  **1. Agenda Control and Structure-Induced Equilibrium**
  Direct democracy is indeed chaotic in multidimensional space. But representative democracy (or HOA boards) is not direct democracy. Institutions restrict the domain of choices.
  *   **Committees:** A landscaping committee only votes on landscaping (1D). A security committee only votes on security (1D). By slicing the multidimensional problem into 1D slices, you restore single-peakedness locally.
  *   **Agenda Setting:** The Chair/President decides the order of votes. While this sounds like manipulation, it actually *prevents* cycling. By forcing a vote to a conclusion, the institution imposes a "stop" on the McKelvey chaos. This creates a "Structure-Induced Equilibrium." The system is stable not because preferences are simple, but because the rules prevent the cycle from completing.

  **2. Party Bundling (The 1D Projection)**
  In national politics, parties solve the multidimensional problem by bundling issues.
  *   Instead of voting on 50 distinct dimensions, you vote on "Team Blue" vs. "Team Red."
  *   The parties negotiate the trade-offs internally and present a platform.
  *   This effectively projects the multidimensional preference space back onto a single 1D line (The Party Spectrum).
  *   Voters then have single-peaked preferences over the *parties*, even if they don't over the *issues*. This restores the Median Voter Theorem at the party level.

  **3. Salience and Dimensionality Reduction**
  Voters rarely evaluate all dimensions simultaneously. In any given election cycle, one dimension becomes dominant (e.g., "The Economy" or "The Pool Roof").
  *   When the economy is the salient issue, social issues fade into the background.
  *   This temporarily collapses the multidimensional space back to 1D for the duration of the vote.
  *   Democracies survive by serializing multidimensional conflicts into a sequence of 1D decisions.

  **4. The Status Quo Bias**
  McKelvey's Chaos Theorem assumes you can move anywhere. In reality, changing policy requires energy. The status quo acts as a gravitational well.
  *   To overturn the current rule, a majority must be *strongly* motivated.
  *   This inertia prevents the "chaos" from manifesting. The system might theoretically cycle, but practically, it stays stuck near the center because the energy required to move it is too high.

  ### The Synthesis for Your HOA Tool

  So, how do you explain this to your neighbors (or yourself) without sounding like a wonk?

  **Arrow's Theorem** tells us that there is no perfect *mathematical formula* for aggregating preferences that works in *every conceivable universe*.
  **Black's Theorem** tells us that in *our* universe, where people usually want things that are "not too hot, not too cold," Majority Rule works fine.
  **McKelvey's Theorem** warns us that if we try to vote on too many complicated things at once, we can get stuck in loops.

  **The Conclusion:**
  The "democracy is a myth" take is wrong because it ignores **institutional friction.** We don't rely on raw math to save democracy; we rely on committees, agendas, parties, and inertia. These structures artificially create the "single-peaked" conditions that allow the math to work.

  For your HOA tool:
  1.  **Acknowledge the limit:** No system is perfect if everyone is trying to game it.
  2.  **Rely on structure:** If you keep the votes simple (1D choices where possible), Arrow's impossibility doesn't apply.
  3.  **Use the tool to clarify, not decide:** Use the RCV tool to reveal the Median Voter, but let the Board (agenda control) manage the multidimensional trade-offs.

  Arrow didn't prove democracy is impossible; he proved that **unstructured** democracy is fragile. The solution isn't to abandon voting; it's to build better guardrails.
