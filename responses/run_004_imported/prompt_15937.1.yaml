          3.  *Status Quo Bias:* It's hard to move away from the current policy. This stabilizes the cycle.
          4.  *Salience:* Voters usually care about *one* dimension at a time. In an election about the economy, social issues fade, making preferences temporarily 1D.
          5.  *Arrow's Criteria are Too Strict:* Maybe we don't need *perfect* transitivity everywhere, just stability most of the time.

  4.  **Drafting the Response - Section by Section:**

