      *   *Competence:* Ulysses $t_2$ is *temporarily* incompetent (Sirens). Constitutional $t_2$ is usually presumed competent (citizens voting), just potentially misguided or having different values.
      *   *Exit Options:* Ulysses can tell sailors to ignore him if he screams (sometimes). Constitutional amendment is often deliberately hard, sometimes impossible (eternity clauses).
      *   *Beneficiary:* Ulysses benefits Ulysses. Do the Founders benefit the Future? Or do they privilege their own values over future preferences?

