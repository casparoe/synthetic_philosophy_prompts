      *   *The Constitutional Contract (Polity):* People $t_1$ bind People $t_2$. Motivation: $t_1$ fears $t_2$ will be passionate, tyrannical, or short-sighted. Mechanism: Entrenchment, judicial review, bicameralism. Justification: Stability, rights protection, long-term planning. Identity: Different biological entities (generations).

  3.  **Identify the Fault Lines (Where it breaks):**
