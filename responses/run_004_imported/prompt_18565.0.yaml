          *   Design: Predict based on function/purpose (e.g., the alarm clock is designed to ring at 7). Good for artifacts.
          *   Intentional: Predict based on beliefs, desires, and rationality (e.g., he wants coffee, believes the shop is open).
      *   *The Criterion:* Use the intentional stance *if and only if* it yields predictive power that is more efficient than the other stances.
      *   *Real Patterns:* Beliefs aren't little neural sentences; they are patterns in behavior. If the pattern is robust and detectable, the belief is "real" in the only sense that matters.
      *   *The Thermostat Issue:* Dennett *does* say thermostats have proto-beliefs. This is often cited as a *reductio ad absurdum* by critics, but Dennett owns it. He thinks belief is a gradient, not a binary switch.
      *   *The "Counterfeit People" Concern:* In his later years (e.g., "The Mystery of Consciousness Explained" or interviews around *From Bacteria to Bach and Back*), Dennett worried about AI deceiving us. Why worry if they are just "believers"? Because *moral status* and *consciousness* are different from *intentionality*.
      *   *Key Distinction:* Intentionality (having beliefs/desires) vs. Phenomenal Consciousness (feeling like something) vs. Moral Agency (responsibility). Dennett is a compatibilist about free will but strict about the *competence* required for certain kinds of agency.

