answer: |-
  You have hit on a central pillar of decision theory. Your intuition is correct: within the framework of standard rational choice theory, intransitive preferences are not merely a "bad habit" or a heuristic error; they are viewed as a **structural inconsistency**.

  Here is a breakdown of why that distinction matters, followed by a practical toolkit for auditing your own preferences for cycles.

  ### 1. Is it "Logical Irrationality"?
  You asked if having intransitive preferences is irrational in a "full-on logical sense, like believing a contradiction."

  **The Short Answer:** Yes, effectively.
  **The Nuance:** In formal logic, a contradiction is asserting $P$ and $\neg P$ simultaneously. In preference logic, transitivity ($A \succ B \land B \succ C \implies A \succ C$) is an **axiom of coherence**.

  If you violate it, you aren't necessarily stating a falsehood about the world, but you are failing to define a coherent ordering of your own values. The money pump argument demonstrates that this incoherence has **pragmatic consequences**. If your preferences don't map onto a consistent ordering, you cannot be modeled as a maximizer of *anything*. You become a system that leaks value by definition.

  Some philosophers (like Edward McClennen) have argued for "resolute choice"—the idea that if you see the money pump coming, you can simply resolve to stop. However, the dominant view (championed by Ramsey, Savage, and Dutch Book theorists) is that if your preferences *permit* the pump, you are already irrational, regardless of whether you manage to stop the bleeding in a specific instance. The vulnerability itself is the flaw.

  ### 2. How to Audit Your Preferences for Cycles
  Intransitivity rarely shows up in simple choices (e.g., "Do I want this apple or that apple?"). It hides in **multi-attribute trade-offs** and **framing effects**.

  Here is a four-step protocol to check for hidden cycles.

  #### Step 1: The Triadic Test (Isolation)
  Cycles require at least three options. Pick a specific domain (e.g., "weekend activities," "investment strategies," "potential apartments").
  1.  Select three options: $A$, $B$, and $C$.
  2.  Compare them in pairs, ideally in writing.
      *   **Pair 1:** $A$ vs. $B$. (Force a choice. No "indifference." If you are indifferent, pick one arbitrarily or adjust the options until you prefer one).
      *   **Pair 2:** $B$ vs. $C$.
      *   **Pair 3:** $C$ vs. $A$.
  3.  **Check:** If you chose $A \succ B$, $B \succ C$, but $C \succ A$, you have a cycle.

  **Crucial Constraint:** You must hold the *context* constant. If you prefer $A$ to $B$ in the morning but $B$ to $A$ at night, that is time-inconsistency, not logical intransitivity. For the audit, freeze the context.

  #### Step 2: Willingness-to-Pay (Monetization)
  Preferences often feel vague until money is introduced. Assigning a cash value forces transitivity because money is transitive ($\$10 > \$9 > \$8 \implies \$10 > \$8$).
  1.  Take the same three options ($A, B, C$).
  2.  Ask: "What is the maximum amount I would pay to secure $A$ over the status quo?" Record $WTP(A)$.
  3.  Repeat for $B$ and $C$.
  4.  **Check:** If $WTP(A) > WTP(B)$ and $WTP(B) > WTP(C)$, but you would choose $C$ over $A$ in a direct swap, your stated preferences contradict your valuation. This is a classic sign of a cycle driven by **framing** (e.g., you value $C$ for its emotional appeal but $A$ for its utility).

  #### Step 3: Attribute Decomposition
  Intransitivity often arises because you are using different "rules" for different pairs.
  *   **Scenario:** Choosing a job.
      *   $A$: High Pay, Long Commute.
      *   $B$: Medium Pay, Medium Commute.
      *   $C$: Low Pay, Short Commute.
  *   **The Cycle:** You might choose $A \succ B$ (Pay matters most), $B \succ C$ (Balance matters), but $C \succ A$ (Commute is a dealbreaker).
  *   **The Fix:** Explicitly weight the attributes *before* comparing the options. If you decide Commute is 40% and Pay is 60%, apply that formula to all three. If the formula yields a cycle, your weighting system is flawed, not just the choice.

  #### Step 4: The "Small Improvement" Check (Testing Vagueness)
  Sometimes what looks like intransitivity is actually **vagueness** (the Sorites Paradox).
  *   You prefer Coffee $A$ to Coffee $B$.
  *   You prefer Coffee $B$ to Coffee $C$.
  *   But $A$ and $C$ taste identical to you, so you feel indifferent.
  *   This creates $A \succ B \succ C \sim A$, which is technically intransitive.
  *   **The Test:** If $A$ and $C$ are indistinguishable, admit indifference ($A \sim C$). If you admit indifference, you must also be indifferent between $A$ and $B$ if $B$ is indistinguishable from $A$.
  *   **Resolution:** If you claim $A \succ B$, there *must* be a distinguishable difference. If you can't name it, you are likely succumbing to a framing illusion. Force yourself to identify the specific feature driving the preference.

  ### 3. Common Hiding Spots
  If you want to find cycles, look where your brain tries to save energy:

  1.  **Lexicographic Preferences:** "I always choose the safest option." Unless safety is perfectly measurable, you might choose Safe-er $A$ over $B$, $B$ over $C$, but realize $C$ is actually safer than $A$ due to a hidden variable.
  2.  **Emotional State:** We often have "hot" preferences (in the moment) and "cold" preferences (planning). A cycle often exists between Hot-You and Cold-You. Treat them as different agents if necessary, but acknowledge the conflict.
  3.  **Menu Dependence:** Do you prefer $A$ over $B$ when only those two are available, but prefer $B$ over $A$ when $C$ is added to the menu? This violates the **Independence of Irrelevant Alternatives (IIA)**. It suggests your preference isn't intrinsic to the object but relative to the set. This is a soft form of intransitivity.

  ### Summary
  You are right to treat this as a logical hygiene issue. Intransitivity implies that your decision-making machinery has no "ground state"—it can spin forever without settling.

  **The Best Audit:**
  Pick three significant pending decisions in your life. Write down your pairwise rankings. Assign a dollar value to each. If the rankings and the dollar values don't align, or if the pairwise rankings form a rock-paper-scissors loop, you have found a leak. Plug it by deciding which attribute (price, quality, time, ethics) is the **master metric** for that specific domain, and enforce it ruthlessly.
