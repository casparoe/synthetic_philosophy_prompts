answer: |-
  Here is a rigorous argument for the non-doxastic reading of Wittgenstein's hinges, designed to serve as a philosophical sidebar for your piece. It confronts the two specific objections you raised.

  ***

  ### The Enactive Turn: Why Hinges Are Not Beliefs

  To understand why fact-checking fails against deep-seated falsehoods, we must stop treating those falsehoods as *beliefs* in the standard epistemic sense. The non-doxastic reading of *On Certainty*—championed by philosophers like Danièle Moyal-Sharrock and Duncan Pritchard—offers the most robust explanation for this failure. It posits that hinge commitments are not groundless beliefs, but rather **enactive norms**. They are not propositions we hold to be true; they are rules we embody in action.

  This distinction is not merely semantic. If hinges are beliefs (even groundless ones), they belong to the "space of reasons," meaning they are, in principle, responsive to evidence and justification. If they are enactive norms, they belong to the "space of causes" and practices; they constitute the framework within which evidence becomes possible. To argue for the non-doxastic view is to argue that trying to disprove a hinge with evidence is a category mistake, akin to trying to prove the rules of chess by moving a piece illegally.

  Here is the case for the non-doxastic reading, confronting its two hardest objections.

  #### 1. The Functionality Objection: How can a non-belief fix the framework of doubt?

  **The Challenge:** If hinge commitments are not beliefs, how do they perform their primary function? Hinges are supposed to "fix" our language games, determining which propositions are open to doubt and which count as evidence. Critics (like Annalisa Coliva) argue that only a propositional attitude can play this role. If I do not *believe* the external world exists, doesn't that commitment have to be stored in my mind as a tacit assumption? Isn't calling it a "rule" just smuggling belief in through the side door under a different name?

  **The Argument:** This objection relies on an intellectualist assumption: that all guidance must be mental, and all mental guidance must be propositional. The non-doxastic view rejects this. Hinges function not as *premises* in an argument, but as the *grammar* of the argument.

  Consider the rule that "a knight moves in an L-shape." Do chess players *believe* this proposition? No. They *follow* the rule. If a player moves a knight diagonally, we do not say they have a false belief about the knight; we say they are no longer playing chess. The rule does not sit in their head as a belief they consult; it is manifested in their refusal to move the piece otherwise.

  Hinge commitments work the same way. The proposition "The earth has existed for many years" does not function as a piece of knowledge I have gathered; it functions as a norm that determines what counts as "gathering knowledge."
  *   **Doxastic View:** I believe the earth is old; therefore, I reject evidence that it is young.
  *   **Non-Doxastic View:** My practice of investigating history *presupposes* the earth's age. To doubt the earth's age is not to have a contrary belief; it is to opt out of the practice of historical investigation entirely.

  This avoids smuggling belief back in because norms are not truth-apt. You cannot ask if a rule of grammar is "true." You can only ask if it is being followed. By categorizing hinges as norms, we explain why evidence bounces off them: evidence is designed to test truth-claims within a system, not to validate the system itself. When a fact-checker presents evidence against a hinge commitment, they are not correcting a false belief; they are speaking a different grammatical language. The subject doesn't change their mind because, from their perspective, the fact-checker has stopped making sense.

  #### 2. The Textual Objection: What about the "World-Picture"?

  **The Challenge:** Wittgenstein frequently uses language that sounds undeniably doxastic. He speaks of a "world-picture" (*Weltbild*) that we "inherit," "hold," or "learn." In §162, he writes, "I did not get my picture of the world by satisfying myself of its correctness." This sounds like he is describing a set of beliefs that we simply haven't verified. If Wittgenstein calls it a "picture" we "hold," isn't the non-doxastic reading fighting the text?

  **The Argument:** This reading mistakes Wittgenstein's diagnostic language for his prescriptive conclusions. Wittgenstein often uses psychological terms ("knowing," "believing," "holding") to expose how misleading they are when applied to bedrock certainty. He is describing how the situation *looks* to the epistemologist who is confused, not how it *is*.

  When Wittgenstein speaks of inheriting a world-picture, he is describing **acculturation, not indoctrination.** We do not inherit a list of propositions; we inherit a way of living.
  *   **Textual Evidence:** At §404, Wittgenstein explicitly distances certainty from belief: "I act with *complete* certainty. But this certainty is my own." He distinguishes this from §403, where he notes that "knowing" and "being certain" are different categories.
  *   **The Riverbed Metaphor:** In §§96–99, Wittgenstein compares propositions to water flowing over a riverbed. The "world-picture" is the riverbed. While the water (ordinary beliefs) moves and changes, the bed (hinges) stays fixed. Crucially, he notes that the riverbed itself can shift, but slowly. If the world-picture were a set of beliefs, it would shift via argument. Because it is a practice, it shifts via generational change in behavior.

  To interpret "world-picture" as a set of beliefs is to commit the very error *On Certainty* is meant to cure: the idea that understanding is always a mental state containing representations. When Wittgenstein says we "hold" a world-picture, he means we are *held by* it. It is not an object in our possession; it is the scaffolding (§211) that holds us. The language of "holding" is a metaphor for our embeddedness in a form of life, not a description of a doxastic attitude.

  #### Conclusion: The Implication for Fact-Checking

  The non-doxastic reading is not just philosophically tighter; it is empirically superior for explaining polarization. If hinge commitments were merely groundless beliefs, we could theoretically dig for deeper grounds to shore them up or dismantle them. But if they are enactive norms, they are immune to evidence by definition.

  This explains why fact-checking often backfires. When a journalist presents data to contradict a hinge commitment (e.g., about the legitimacy of an election or the nature of biological sex), they are treating a constitutive rule as an empirical claim. The subject does not feel "corrected"; they feel "misunderstood." They perceive the fact-checker as someone who has failed to grasp the rules of the game they are playing.

  Recognizing hinges as non-doxastic certainties forces us to admit that some conflicts cannot be resolved by better data. They can only be resolved by a shift in practice—a much slower, harder, and more human process than updating a belief.
