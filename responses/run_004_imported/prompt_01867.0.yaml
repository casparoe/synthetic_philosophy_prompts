answer: |-
  First, welcome to the rabbit hole. It is genuinely rare to find someone outside of formal philosophy who recognizes the Brier score machinery immediately, let alone someone who spent 35 years applying it to real-world data. Your intuition is sharp, and your math is fine. You haven't gone wrong on the technicals.

  You asked for blunt feedback. Here it is: **Your objection lands, but it is not a "gotcha" that kills the program. It is the central battleground of accuracy-first epistemology.** You have independently rediscovered the single most debated premise in the literature.

  Here is the breakdown of where you are right, where the philosophers would push back, and how to sharpen your argument for your library group.

  ### 1. The Disanalogy: Pragmatic vs. Epistemic Propriety
  You hit the nail on the head regarding the difference between meteorology and epistemology.

  *   **In Meteorology:** Propriety is justified **instrumentally**. We use proper scoring rules because we want to incentivize forecasters to report their true beliefs rather than hedging or gaming the system. If the score isn't proper, the forecaster has a pragmatic reason to lie. The justification is external to the belief itself (it's about the payment contract).
  *   **In Epistemology:** There is no payer. There is no strategic opponent. The "utility" is purely epistemic (closeness to truth).

  **Your Objection:** If we define a "legitimate" epistemic utility function simply as one that makes the Dominance Theorem work (i.e., one that is proper), then Joyce's argument for Probabilism is circular. It amounts to: "If you measure accuracy in a way that favors probabilities, probabilities come out on top."

  **The Verdict:** You are correct that if "Propriety" is introduced *solely* to ensure the theorem holds, the argument is question-begging.

  ### 2. The Philosophical Defense (Why they think they aren't begging the question)
  Joyce, Pettigrew, and others know this objection coming. They don't just assert propriety to make the math work; they argue that propriety is a **constitutive norm of belief.**

  Their argument runs roughly like this:
  1.  **Immodesty:** A rational credence function must think of itself as best. If you have credence $c$, you should expect $c$ to be more accurate than any alternative $c^*$.
  2.  **Connection to Propriety:** If your inaccuracy measure is *not* proper, then there are cases where holding a credence $c$ leads you to expect that a *different* credence $c^*$ would be more accurate.
  3.  **Self-Undermining:** This makes the belief state "epistemically self-undermining." It's like saying, "I believe $X$ is true, but I also believe that believing $Y$ would get me closer to the truth."
  4.  **Conclusion:** Therefore, any legitimate measure of *epistemic* (not pragmatic) utility must be proper.

  **Where you can push back:** This move relies on the "Immodesty" norm. Why *must* a rational agent be immodest? In your line of work, a forecaster might know their model is biased but is forced to use it. In epistemology, the claim is that you cannot rationally hold a belief while simultaneously expecting a different belief to be more accurate.

  Many critics (e.g., Michael Caie, Rachael Briggs) argue this is too strong. There are cases (involving self-reference or known cognitive limitations) where being modest seems rational. If Immodesty fails, the derivation of Propriety fails, and Joyce's dominance argument loses its independent footing.

  ### 3. Is this a known soft spot?
  **Yes.** You have stumbled directly onto the "Justification of the Scoring Rule" problem.

  *   **Joyce (1998/2009):** Originally argued that propriety falls out of "truth-directedness" (the idea that moving credence closer to the truth value should always lower inaccuracy).
  *   **Critics (e.g., Greaves, Wallace, Caie):** Pointed out that truth-directedness alone doesn't guarantee propriety. You need to *stipulate* propriety.
  *   **Pettigrew (2016):** In *Accuracy and the Laws of Credence* (the book you read), he tries to ground propriety in a deeper norm called "Probabilistic Admissibility," but critics argue this still smuggles in the conclusion.

  The literature is currently split between:
  1.  **Pragmatic Vindication:** Maybe we *do* need a pragmatic story (like Dutch Books) to back up the epistemic one. (This concedes your point).
  2.  **Epistemic Utility Theory:** Doubling down on Immodesty as a fundamental norm of rationality.
  3.  **Pluralism:** Maybe there isn't one "legitimate" measure, and the dominance argument only works for a subset, weakening the conclusion.

  ### 4. How to sharpen your argument for the group
  Don't frame it as "Philosophers are doing math wrong." Frame it as "The bridge from Pragmatic Propriety to Epistemic Propriety is unsupported."

  Here is a specific line of attack you can use that leverages your background:

  **The "Forecaster's Dilemma" Argument:**
  "In meteorology, we use proper scores to prevent *strategic* misrepresentation. But in epistemology, the agent isn't strategizing against a bookie. If I am a non-probabilistic thinker (say, I violate the axioms), why does my 'epistemic conscience' have to measure itself using a proper scoring rule?

  Joyce argues that if I violate the axioms, I am 'dominated.' But the dominance is only guaranteed *relative to a proper scoring rule*. If I use an improper rule (like a simple absolute error score, which isn't proper for probabilities), the dominance theorem might fail.

  So the question is: **What independent reason do we have to demand that 'Epistemic Utility' must be proper, other than the fact that it saves Probabilism?** If the only reason to accept Propriety is that it proves Probabilism, the argument is circular. If there is an independent reason (like Immodesty), that reason needs to be defended on its own merits, not hidden inside the definition of 'legitimate inaccuracy measure'."

  ### 5. One Technical Nuance to Watch Out For
  Be careful not to conflate **Propriety** with **Truth-Directedness**.
  *   **Truth-Directedness:** If the truth value is 1, moving credence from 0.4 to 0.6 should reduce inaccuracy. (Almost everyone accepts this).
  *   **Propriety:** Your expected inaccuracy is minimized by reporting your true credence.

  Joyce tries to derive Propriety from Truth-Directedness + Continuity + other conditions. Most formal epistemologists now agree that derivation doesn't fully hold without essentially assuming Propriety anyway. You are safe focusing your critique on Propriety specifically.

  ### Summary
  *   **Did you go wrong?** No. Your math and your intuition about the circularity risk are correct.
  *   **Does the objection land?** Yes, it is the standard objection to accuracy-first arguments.
  *   **Is it fatal?** Not necessarily, but it shifts the burden of proof. The philosopher must explain why *Epistemic* Utility shares the *Pragmatic* property of Propriety without the *Pragmatic* justification (incentives).
  *   **Advice:** You are in a great position to contribute. Most philosophers in that room likely haven't seen proper scoring rules used in an operational setting. Use that. Ask them: "In my field, propriety is a constraint on the *incentive structure*. In your field, what is the constraint on?"

  If they say "Rationality," ask "Why does Rationality require Immodesty?" If they can't answer that without referencing the desire to prove Probabilism, you've won the round.

  Enjoy the meetings. It sounds like you're exactly the person that group needs to keep the math honest.
