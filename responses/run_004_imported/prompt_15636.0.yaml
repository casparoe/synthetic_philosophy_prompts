answer: |-
  This is a profound question that sits precisely at the intersection of epistemology, the philosophy of history, and the ethics of representation. You are asking whether *verisimilitude* (truthlikeness) is a coherent metric when absolute truth is inaccessible.

  The short answer is: **Yes, philosophers have worked extensively on this, and their findings validate your intuition while complicating your confidence.** Your fear that you are merely mistaking aesthetic satisfaction for accuracy is a standard epistemological hazard, but it does not necessarily invalidate the distinction you are drawing between the "truth of the person" and the "truth of the record."

  Here is how the philosophical landscape maps onto your dilemma, and how it might help you resolve the impasse.

  ### 1. The Problem of Verisimilitude
  The specific philosophical concept you are looking for is **verisimilitude** (or truthlikeness). Karl Popper introduced this term in the 1960s to address exactly your problem: how to say that one false theory (or account) is "better" or "closer to the truth" than another false theory.

  Popper initially argued that Account A is closer to the truth than Account B if A entails more true statements and fewer false statements than B. However, this definition was famously dismantled in the 1970s (by Pavel Tichý and David Oddie), who proved that under strict logical conditions, you cannot compare the "distance from truth" of two false statements without already knowing the truth. If you don't know the actual state of affairs (the real woman), you cannot measure the distance from it.

  **The Traction:** This confirms your suspicion that you cannot *prove* Source A is closer to the truth in a scientific sense. However, subsequent philosophers of science (like Niiniluoto) refined the concept to rely on *similarity* rather than strict logical entailment. They argue that we judge truthlikeness based on how well a model captures the *relevant features* of the target.

  **Application to your novel:** Source B captures the *propositional* features (dates, locations, official actions). Source A captures the *dispositional* features (motives, emotional texture, interpersonal dynamics). If your novel is about "who she was" (character) rather than "what she did" (chronology), Source A may have higher verisimilitude regarding the *relevant features* of your inquiry, even if it fails on the propositional facts.

  ### 2. The Philosophy of History: Archive vs. Narrative
  Your distinction between the "truth of the record" and the "truth of the person" mirrors a central debate in the philosophy of history, particularly in the work of **Hayden White** and **Paul Ricoeur**.

  *   **The Archive (Source B):** The academic biography treats history as a reconstruction of events based on trace evidence. But police records and archives are not neutral; they are generated by the oppressor (the Occupation authorities). They record her as a *criminal*, a *object of surveillance*. As the philosopher **Michel de Certeau** noted, the archive is a system of power. A "cold, calculating" figure in police records may simply be a person successfully masking their fear to survive. Source B gives you the "truth of the state's gaze."
  *   **The Narrative (Source A):** The memoir treats history as a meaning-making structure. **Paul Ricoeur** argued that human time is understood through narrative. We make sense of lives by plotting them. Source A imposes a "martyr" plot, which is a distortion, but it also preserves the *testimony* of those who knew her interiority.

  **The Traction:** Philosophers of history generally agree that no single account captures the "whole truth." Source B is not "truer" in a moral or psychological sense; it is merely more *verifiable*. Source A is more *veridical* regarding experience, but less *accurate* regarding data. Your instinct that Source A is "nearer the truth of the person" is philosophically defensible: it prioritizes *phenomenological truth* (how it felt/lived) over *positivist truth* (what can be measured).

  ### 3. The Fear of Aesthetic Self-Deception
  You worry that preferring Source A is just "taste wearing the costume of accuracy." This is the danger of what the philosopher **Bernard Williams** called "truthfulness." He distinguished between *Accuracy* (getting the facts right) and *Sincerity* (not misleading others about what you believe).

  Your friend's advice ("write the better novel") relies on an aesthetic metric. Your worry is that you are conflating *narrative coherence* with *historical reality*. Just because a character arc hangs together psychologically doesn't mean it happened that way.

  However, there is a counter-argument from the philosophy of action. Human beings act for reasons. If Source B's "cold calculator" model makes the network's trust in her inexplicable (resistance networks relied on intense emotional bonds, not just contractual ambition), then Source B may be factually precise but *explanatorily false*. If the facts don't explain the outcome, the interpretation of the facts is suspect.

  Therefore, your preference for Source A isn't necessarily aesthetic; it might be **abductive**. You are inferring the best explanation for the totality of evidence (including the fact that she was trusted with high-risk courier work). A cold calculator might have defected; a reckless loyalist might not have. Source A explains the *outcome* better, even if it gets the *dates* wrong.

  ### 4. A Way Forward: Negative Capability
  So, does the ranking collapse? In a strict binary (True/False), yes. But in a multidimensional model, no.

  You are stuck because you feel you must choose one ontology of the woman. But the most philosophically robust approach for a historical novelist might be to embrace the gap. The poet **John Keats** called this **Negative Capability**: the ability to exist in "uncertainties, Mysteries, doubts, without any irritable reaching after fact & reason."

  Consider that the "truth" of this woman *is* the discrepancy between how the state saw her (Source B) and how her comrades loved her (Source A).
  *   **Source B** is the truth of her vulnerability (she was caught, recorded, processed).
  *   **Source A** is the truth of her agency (she chose, she risked, she inspired).

  **Practical Suggestion:**
  Do not treat this as a problem to be solved by selection, but as a tension to be dramatized.
  1.  **Use Source B for the skeleton:** The dates, the routes, the arrest. This grounds the novel in the material reality of the Occupation.
  2.  **Use Source A for the blood:** The motivations, the conversations, the emotional stakes.
  3.  **Acknowledge the uncertainty:** You do not need to write a postmodern novel that breaks the fourth wall, but you can write a protagonist whose interiority is opaque even to herself. Let the reader feel the tension between how she is perceived by the Nazis (the record) and how she is perceived by her network (the memoir).

  ### Conclusion
  To answer your specific question: **Philosophy does not offer a formula to prove Source A is "truer," but it does validate the coherence of the question.**

  The ranking does not collapse into mere taste if you define your criteria. If your criterion is "correspondence with archival data," Source B wins. If your criterion is "explanatory power regarding human behavior and network dynamics," Source A may well win.

  Your instinct is not self-deception; it is a recognition that **factual accuracy is not the only component of truth.** A map that gets the coastline right but omits the mountains is accurate but useless to a hiker. Source B is a map for a historian; Source A is a map for a human being. Since you are writing a novel about a human being, you are licensed to prioritize the latter, provided you do not claim the former is false when it is merely incomplete.

  You are not lying by choosing Source A's psychology; you are engaging in the necessary act of historical imagination that bridges the gap between the archive and the life. That is not a collapse of truth; it is the only way to access it.
