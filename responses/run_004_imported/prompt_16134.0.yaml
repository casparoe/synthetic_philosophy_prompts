  So I'm putting together a short story for a 'thought experiments as fiction' collection and I want to get the Kripkenstein rule-following paradox right, not the watered-down 'meaning is kind of subjective' version everyone flattens it to. The actual bite of it: nothing about my past behaviour, or what's going on in my head, rules out that I've secretly been following 'quus' instead of 'plus' this whole time -- some function that agrees with plus on every case I've actually computed but diverges once the numbers get past, say, 57 -- and Kripke's fix isn't to dig up some hidden fact that settles which one I really meant, its to ditch the idea that meaning is fixed by facts at all and cash it out in terms of what the community around me would back up instead. can you write me a short story, around 1000 words, where that exact structure drives the plot -- someone's (or something's) rule-following comes apart from everyone else's at a point nobody saw coming, and the story doesn't resolve it by unearthing a secret fact, it turns on the community-verdict logic instead. setting/characters totally up to you -- coder, mathematician, translator, whatever, doesn't need to involve actual maths -- just don't have people sit around reciting the philosophy at each other, i want it dramatised not a lecture with a plot stapled on. bonus points if its genuinely good as a story too.
