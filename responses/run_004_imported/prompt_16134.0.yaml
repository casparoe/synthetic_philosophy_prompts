  The console hummed, a low B-flat that had been the baseline of Silas's life for thirty years. He was a Signal Adjudicator for the Outer Rim Coalition, tasked with interpreting the Beacon Stream. His job was simple, governed by Protocol 9: *If the beacon pulses in a Prime Sequence, authorize Approach.*

  Silas had authorized Approach ten million times. Every pulse sequence he had ever encountered—2, 3, 5, 7, 11—had been clean, sharp, and unmodulated. He had never seen anything else. The rule was as much a part of his nervous system as the blink reflex.

  Then came Sequence 59.

  It was a prime. Mathematically, it fit the Protocol perfectly. But the carrier wave carried a harmonic distortion, a subtle vibrato that had never appeared in the thirty-year history of the Stream.

  Silas's finger hovered over the green key. *Approach.*

  But the distortion tasted like rust in his mouth. It felt wrong. Not because the math failed, but because the *pattern* felt broken. His hand moved to the red key instead. *Retreat.*

  The alarm didn't sound immediately. It took three seconds for the Central Audit AI to flag the deviation. Then the screen flashed white, and Director Halsey's face appeared, pixelated and cold.

  "Explain the inhibition, Silas."

  "Sequence 59 is compromised," Silas said. His voice sounded thin in the booth. "The harmonic variance indicates a spoof."

  "Protocol 9 does not mention harmonics," Halsey said. "It specifies Prime Sequence. 59 is prime. You are in violation."

  "Protocol 9 implies *valid* Prime Sequences," Silas countered. "I've authorized ten million approaches. Every single one was clean. I understood the rule to be 'Approach valid signals.' This isn't valid."

  Halsey leaned forward. "Show me where your mental state defined 'valid' as 'undistorted'."

  "It's implicit," Silas said. "Check my logs. Have I ever authorized a distorted signal?"

  "No," Halsey said. "Because there have never been distorted signals. Your past behavior is consistent with two rules, Silas. Rule A: 'Approach all Primes.' Rule B: 'Approach all Primes that are clean.' Until today, those rules were identical. You cannot point to a single past action that proves you meant Rule B."

  Silas gripped the edge of the console. "I know what I meant. I meant safety. I meant the spirit of the Protocol."

  "You mean what you say you mean now," Halsey corrected. "But meaning isn't a ghost in your head. It's not a fact we can excavate from your neurons. If I say you meant Rule A, and you say you meant Rule B, there is no evidence in the universe to settle it. Your history fits both."

  "So I'm right by default," Silas said. "Reasonable doubt."

  "There is no doubt," Halsey said. "There is only usage. The Coalition uses Rule A. The Stream is a tool, and tools are defined by how they are used, not by what the operator feels about them. If the community accepts 'Prime' as 'Prime regardless of distortion,' then that is what 'Prime' means."

  "That's tyranny," Silas whispered.

  "It's grammar," Halsey said. "Language is a public game. You don't get to change the rules mid-match because you don't like the outcome. You think you're following the rule, but you're just following your inclination. And your inclination diverges from ours."

  Silas looked at the red key. He felt a surge of certainty. He *knew* that 59-plus-distortion was not the same as 59-clean. He knew it in his bones. But he also knew Halsey was right about the logs. There was no entry, no memo, no neural scan that could prove he hadn't been blindly following Rule A all along, waiting for this exact moment to deviate.

  "What happens now?" Silas asked.

  "Now?" Halsey's expression softened, not with pity, but with finality. "Now we verify the consensus. The other Adjudicators are polling. They all see Sequence 59. They are all authorizing Approach."

  Silas looked at the secondary monitor. A cascade of green lights lit up across the sector. Forty other booths. Forty other humans who had lived the same thirty years, learned the same Protocol, and faced the same anomaly. They all pressed green.

  "They're wrong," Silas said.

  "They are the community," Halsey replied. "Meaning is assertibility. If they say it's Approach, it's Approach. You are no longer asserting correctly. Therefore, you are no longer speaking the language."

  "Am I fired?"

  "No, Silas. You're just... silent."

  The screen went dark. The connection to the Stream was severed from his booth. The hum of the console dropped an octave. Silas sat in the silence, his hand still hovering over the red key. He could press it, but no signal would send. He could scream that he meant Rule B, that his history was his own, but there was no one left to verify it.

  He looked at the logs one last time. Ten million entries. *Approach. Approach. Approach.*

  He tried to remember the moment he learned Protocol 9. He tried to find the specific shape of the word "Prime" in his memory, to see if it had always contained the shadow of "clean." But the memory was just a picture of a manual, and the manual was just ink on paper, subject to the same interpretation as the signals.

  Outside the booth, the fleet began to move. They were approaching Sequence 59.

  Silas closed his eyes. He knew he was right. But he also knew, with a cold, hollow certainty, that being right was a fact about the world, and meaning was a fact about the group. And he was no longer in the group.

  He was just a man sitting in a room, making noises that no longer meant anything.
