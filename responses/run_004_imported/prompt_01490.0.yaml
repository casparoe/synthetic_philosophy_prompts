answer: |-
  This is a profound reading of Sidgwick, and it aligns with the most sophisticated contemporary scholarship on his work (such as that by Bart Schultz and Eric Schmidt). You are quite right to reject the notion that Sidgwick's psychical research was a mere eccentricity; it was, as you note, the empirical wing of his ethical project. If the "dualism of practical reason" (the conflict between Rational Egoism and Universal Benevolence) could not be resolved by a cosmic guarantee of justice—typically implying survival after death—then morality lacked a fully rational sanction.

  Given this high-stakes philosophical motivation coupled with his famously scrupulous "scientific conscience," Sidgwick's reaction to Daryl Bem's *Feeling the Future* (2011) and the subsequent Open Science reforms would likely be a complex mixture of vindication, methodological approval, and deepened existential pessimism.

  Here is how Sidgwick would likely parse the episode:

  ### 1. On Bem's *Feeling the Future*: A Vindication of Skepticism
  Sidgwick would not have been shocked by Bem's results, nor would he have been immediately convinced. Throughout his presidential addresses to the Society for Psychical Research (SPR), Sidgwick warned against the "fallacy of averages" and the dangers of unconscious bias. He was acutely aware that investigators often find what they hope to find.

  Bem's paper demonstrated that standard psychological methodology (p < .05, flexible analysis plans) could generate "significant" evidence for an impossible phenomenon (precognition). Sidgwick would have viewed this as a confirmation of his long-held suspicion: **the human mind is too prone to self-deception to trust standard statistical significance when the claim is extraordinary.**

  He would have appreciated the immediate backlash from the psychological community. In his fifth presidential address (1892), Sidgwick noted that the burden of proof lies heavily on the claimant and that the absence of evidence, over time, becomes evidence of absence. Bem's study triggered exactly the kind of scrutiny Sidgwick demanded: a demand for independent replication. When those replications largely failed, Sidgwick would have seen this not as a scandal, but as the scientific immune system functioning correctly.

  ### 2. On Preregistration: The Rigor He Demanded
  Sidgwick would almost certainly have welcomed preregistration and the Open Science movement with enthusiasm. In many ways, preregistration is the institutionalization of the evidentiary standards Sidgwick tried to enforce at the SPR.

  *   **Fixing the Hypothesis:** Sidgwick was constantly battling "post-hoc" rationalizations in spiritualist circles, where failures were reinterpreted as successes based on shifting criteria. Preregistration locks the hypothesis and analysis plan before data collection, preventing the "moving of the goalposts" that plagued 19th-century psychical research.
  *   **Combating the File Drawer Problem:** Sidgwick knew that positive results get published while negative results gather dust. He strove to publish the SPR's failures as diligently as its successes. Preregistration forces the registration of studies regardless of outcome, ensuring that the "dearth of high-quality evidence" Sidgwick spoke of is accurately measured rather than hidden.
  *   **Collective Verification:** Sidgwick viewed the SPR as a collective enterprise to overcome individual bias. The Open Science framework is the modern technological realization of this ideal, making data and code available for communal scrutiny.

  For Sidgwick, preregistration would represent the maturation of the scientific method into a form finally robust enough to test the claims he cared about. He would argue that if psi phenomena exist, they *should* be able to survive preregistered replication.

  ### 3. On the Outcome: Confirming Late-Life Pessimism
  However, while he would embrace the *method*, the *results* of the replication crisis would likely deepen the pessimism he expressed in his later years.

  Sidgwick died in 1900, still disappointed that the SPR had not secured the "proof" of survival that might resolve the dualism of practical reason. The modern trajectory of parapsychology—where initial exciting findings (like Bem's) dissolve under the rigors of preregistered replication—suggests that the "cosmic guarantee" he sought is not empirically accessible.

  Sidgwick was honest enough to admit that if the evidence remains absent, one must accept the dualism as unresolved. The failure of Bem's effects to replicate in high-powered, preregistered studies would tell Sidgwick what his own decades of work hinted at: **nature does not yield evidence of a moral order.**

  He would likely conclude that the replication crisis proves that the human desire for such evidence (including his own) is a powerful source of bias, one that only the strictest methodological constraints can contain. Since even those constraints fail to produce robust evidence for psi, the rational conclusion is negation.

  ### 4. The Ethical Implication: Duty Without Hope
  Would this destroy his ethics? No. Sidgwick's greatness lies in his willingness to face the "fundamental paradox" without flinching.

  In *The Methods of Ethics*, he suggests that even if we cannot prove that virtue and self-interest coincide, we are still bound by the intuition of duty. The failure of modern psychology to validate psi would not invalidate Utilitarianism; it would simply strip it of its rational egoist support.

  Sidgwick would likely view the modern situation as follows:
  1.  **Methodologically:** A triumph. We finally have the tools (preregistration) to ask the question without fooling ourselves.
  2.  **Ontologically:** A disappointment. The tools show no signal.
  3.  **Ethically:** A challenge. We must practice morality without the "hope" of cosmic reward, relying instead on the intrinsic authority of the moral intuition.

  ### Conclusion
  Sidgwick would see the Bem episode and the subsequent reforms as the final chapter of his own project. He would view preregistration as the rigorous filter he spent his life trying to construct. But he would also likely feel a grim satisfaction that the filter works so well that it filters out the very hopes he cherished.

  He would probably tell modern psychologists that they have finally achieved the scientific honesty he demanded of the SPR, but that they have also confirmed his deepest fear: that the universe offers no empirical receipt for moral behavior. Yet, true to his own philosophy, he would insist that we must act rightly regardless. The lack of a "Feeling the Future" does not negate the duty to build a better one.
