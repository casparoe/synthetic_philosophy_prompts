      *   **Key Insight:** The user correctly identifies the link between Sidgwick's "dualism of practical reason" (the conflict between rational egoism and utilitarianism) and his motivation for psychical research (seeking a cosmic guarantee that virtue and happiness coincide, i.e., immortality/divine justice).
      *   **Key Tension:** Sidgwick had high existential stakes (needed proof for morality's rationality) but maintained strict methodological standards (willing to abandon the claim if evidence wasn't found).
      *   **Question:** How would Sidgwick react to Bem (2011) and the subsequent replication crisis/preregistration movement? Would he see preregistration as the rigor he wanted, or would the whole mess confirm his pessimism?

  2.  **Deconstruct Sidgwick's Position:**
      *   *Motivation:* Not a hobby, but a philosophical necessity. If no afterlife/retribution, rational egoism might trump utilitarianism, undermining the "rationality" of morality.
      *   *Methodology:* Empiricist, rigorous, skeptical. He wanted "proof" comparable to scientific standards of his time. He was willing to say "we haven't found it" (pessimism).
      *   *Attitude towards Evidence:* He valued negative results as much as positive ones (falsifiability avant la lettre). He was wary of fraud and self-deception.
      *   *Attitude towards Scientific Community:* He believed in collective, transparent inquiry (hence the SPR).

  3.  **Analyze the Modern Context (Bem & Replication Crisis):**
      *   *Bem (2011):* Claimed evidence for precognition using standard psychological methods. Published in *JPSP*. Shocked the field.
      *   *The Problem:* Standard methods allowed "p-hacking," flexibility in analysis, and publication bias. Bem showed that standard methods could "prove" impossible things.
      *   *The Response:* Replication crisis. Many failed to replicate Bem.
      *   *The Reform:* Preregistration (locking in hypotheses and analysis plans before data collection), open data, higher statistical thresholds. This aims to eliminate researcher degrees of freedom.

  4.  **Synthesize: Sidgwick meets Bem and Preregistration:**
      *   *Reaction to Bem:* Sidgwick would be deeply suspicious. Bem used standard methods to find extraordinary claims. Sidgwick knew that extraordinary claims require extraordinary evidence. He would likely spot the methodological looseness (even if he didn't know the term "p-hacking"). He would appreciate the skepticism it triggered.
