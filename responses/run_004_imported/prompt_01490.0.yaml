      *   *Sidgwick on the Outcome (Pessimism vs. Hope):* Here's the nuance. He would be pleased with the *method* (preregistration) but likely confirmed in his *pessimism* about the *result*. The fact that preregistered replications of psi generally fail would tell him what his own SPR work hinted at: the evidence isn't there.
