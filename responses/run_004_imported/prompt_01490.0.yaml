      *   *Reaction to Preregistration:* This is the crux. Sidgwick demanded rigor. Preregistration is the modern embodiment of the rigor he sought. It prevents the "shifting hypothesis" and "cherry-picking" that plagued early SPR work (and Bem's work).
      *   *The Twist:* Would he think it's *enough*? Sidgwick died disappointed. He might worry that even with preregistration, the signal is too weak or non-existent. But he would likely *welcome* the method as the only honest way to proceed.

  5.  **Drafting the Argument (Iterative Process):**

