answer: |-
  **Setting:** *A quiet corner of a campus coffee shop, shortly after their seminar on Moral Uncertainty has finished. Priya and Sam are sitting with half-empty mugs. The whiteboard in the seminar room behind them still bears a diagram of Toby Ord's "Moral Trade" matrix.*

  **Priya:** So, the math seems obvious, Sam. Look at the board. I assign a huge negative value to factory farming. You assign a huge negative value to long-haul carbon emissions. But I don't care about flying, and you don't care about meat. If I stop flying to visit my parents in Mumbai, and you stop eating meat, the total suffering in the world drops precipitously. The cost to each of us is negligible. Why wouldn't we do this?

  **Sam:** Because it feels like we're turning morality into a marketplace.

  **Priya:** And? Economics isn't evil. It's a system for coordinating preferences to maximize welfare. Toby Ord's point is that moral disagreement shouldn't lead to gridlock. It should lead to gains from trade, just like comparative advantage.

  **Sam:** Comparative advantage works for widgets. If I make bread and you make cheese, we trade, and we both eat better. No one's soul is involved. But here, you're asking me to change my behavior regarding something I believe is *permissible*. I think eating meat is fine. If I stop, I'm not acting on my moral judgment. I'm acting on… a bribe.

  **Priya:** It's not a bribe. A bribe implies corruption. This is cooperation. You aren't admitting you were wrong about meat. You're acknowledging that *I* care about it deeply, and since you're indifferent, accommodating me costs you nothing but buys me a massive moral win. In exchange, I accommodate your deep concern about climate.

  **Sam:** But that's the rub. If I stop eating meat, I'm not doing it because I think it's wrong. I'm doing it to purchase your restraint on flying. That makes my moral agency instrumental. It turns my actions into currency. I worry that treating our convictions as negotiable assets corrodes the very idea of having convictions.

  **Priya:** You're prioritizing the purity of your agency over the actual outcome. If a child is drowning, and I say, "I'll jump in if you promise to stop hunting foxes," and you agree, the child lives. Does it matter that you didn't stop hunting because you suddenly believed hunting was wrong? You stopped because you wanted the child saved. The result is identical.

  **Sam:** In the drowning case, we both agree the child matters. That's shared ground. In our case, we don't share ground. That's why we're trading. If I eat a burger, I think I've done nothing wrong. But *you* believe I've committed a serious wrong. By entering this trade, I'm essentially saying, "I know you think this is murder, Priya, but I'll do it anyway unless you pay me with flight credits."

  **Priya:** No! I'm saying, "I know you think this is neutral, Sam, but since it causes me profound distress to participate in a world where this happens, will you help me?" You're not validating the harm; you're validating *our friendship* and *cooperation*. You're helping me live according to my values, and I'm helping you live according to yours.

  **Sam:** But am I helping you live according to your values, or am I just reducing the score on your personal moral ledger? There's a difference. If I go vegetarian, the animals are spared. That's real. But my *reason* for going vegetarian is that it buys your compliance on climate. It makes my vegetarianism contingent. What happens if you decide to fly again? Do I get my moral credit back and start eating steak?

  **Priya:** That's a contract enforcement issue, not a philosophical one. We can make it a standing agreement.

  **Sam:** It's deeper than enforcement. It's about truth. Moral trade assumes we should act on moral *uncertainty*. It says, "I'm 80% sure flying is bad, you're 80% sure meat is bad, so let's hedge." But morality isn't a hedge fund. If meat-eating is actually objectively wrong, then I shouldn't eat it regardless of what you do. If it's objectively permissible, then you shouldn't ask me to stop. The trade only makes sense if we both admit we might be wrong.

  **Priya:** Exactly! We *should* admit we might be wrong. That's epistemic humility. If I acknowledge there's a 20% chance you're right that flying is permissible, and you acknowledge a 20% chance I'm right that meat is impermissible, the trade maximizes expected value. It's the rational thing to do under uncertainty.

  **Sam:** Rational, maybe. But is it *moral*? It feels like we're bypassing the hard work of persuasion. Instead of me trying to convince you that flying is necessary for global connection, or you trying to convince me that animals have rights, we just swap concessions. It treats our moral disagreement as a fixed obstacle to navigate around, rather than something to resolve.

  **Priya:** But some disagreements *are* irresolvable, Sam. We've been talking about this for two years. We're not converging. If we wait for consensus, the cows keep dying and the carbon keeps burning. Moral trade is for the non-ideal world. It's for when the truth doesn't win quickly enough.

  **Sam:** I get the urgency. I do. But I worry about the precedent. If we normalize this, does morality become just a series of non-aggression pacts? "I won't punch your god if you don't punch mine." It creates a modus vivendi, sure, but it doesn't create a moral community. It creates a moral market. And in a market, the person with the most leverage wins. What if next term, someone comes along who cares deeply about something harmful—say, they really want to build a loud factory—and they offer to donate to my favorite charity if I let them?

  **Priya:** That's different. That's negative utility. In our trade, both sides are reducing what the *other* perceives as harm. You aren't letting me build a factory. I'm stopping flying, which you think is harmful. I'm stopping meat, which I think is harmful. We are both moving toward the good, as we each see it.

  **Sam:** Are we? Or are we just moving toward *compromise*? There's a specific kind of integrity in doing the right thing *because* it's the right thing. If I go vegetarian because of this deal, I'm not practicing virtue. I'm practicing negotiation. I'm worried that if I habituate myself to trading my principles, even on things I'm indifferent to, I lose the ability to distinguish between what I *should* do and what I can *get away with* in a bargain.

  **Priya:** You're describing a slippery slope. "If I compromise here, I'll become a moral relativist." But look at the alternative. You keep flying. I keep eating meat. The animals suffer. The climate warms. And you keep your hands clean of "transactional morality." Is your integrity worth the carbon, Sam?

  **Sam:** *(Pauses, looking into his coffee)* That's the hard question, isn't it? If I say no, I look like I care more about my philosophical consistency than the planet.

  **Priya:** You do.

  **Sam:** Maybe. But if I say yes, I'm agreeing that my actions don't belong to me. They belong to the negotiation. I guess… I guess I'm afraid that if we trade, we stop seeing each other as moral agents trying to find the truth, and start seeing each other as obstacles to be managed. I don't want to manage you, Priya. I want to understand you.

  **Priya:** And I don't want to be understood while the world burns. I want to be helped.

  **Sam:** *(Sighs)* I know. And I want to help. The utilitarian calculus is screaming at me to sign the deal. The animals win, the atmosphere wins. It's only me that loses something.

  **Priya:** What do you lose?

  **Sam:** The certainty that when I do a good thing, it's because I saw the good, not because I was paid to do it. Even if the payment is just your restraint.

  **Priya:** Is that certainty worth more than the actual good done?

  **Sam:** *(Looks up, meeting her eyes)* I don't know. I really don't. If I agree to this, I need to know it's not just a transaction. I need to know we're still trying to convince each other, too. That this isn't the end of the conversation.

  **Priya:** It doesn't have to be. We can trade *and* talk.

  **Sam:** Can we? Or does the trade silence the talk? If I've already agreed to stop eating meat, why would I listen to your arguments about factory farming? I've already bought the outcome.

  **Priya:** *(Leans back, frustrated)* So you're saying the success of the trade kills the motivation for moral progress?

  **Sam:** I'm saying it risks it.

  **Priya:** *(Quietly)* So where does that leave us? The seminar ends in an hour. I have a flight booked for Christmas. You have a steak dinner planned tonight.

  **Sam:** *(Looks down at his hands)* I'm not saying no. I'm saying… I need to think about whether I can make this trade without selling out the idea that we're supposed to be doing the right thing for the right reason.

  **Priya:** The cows don't care about your reasons, Sam.

  **Sam:** I know. That's what terrifies me. That maybe the reasons don't matter, and we're just machines optimizing outputs.

  **Priya:** Maybe we are.

  **Sam:** *(Stands up slowly)* I'll let you know about the flight. Before you book.

  **Priya:** And I'll let you know about the steak. Before you order.

  **Sam:** Okay.

  **Priya:** Okay.

  *(Sam picks up his bag. He looks at the whiteboard, at the matrix of gains and losses, then turns and walks out. Priya stays seated, watching the door, her hand hovering over her phone.)*
