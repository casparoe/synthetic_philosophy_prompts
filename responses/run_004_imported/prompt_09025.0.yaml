answer: |-
  Here are nine interview questions designed to probe the philosophical mechanics of your guest's defense while adhering to your specific constraints. Each main question includes a follow-up keyed to the response she is most likely to offer.

  **1.** David Lewis is primarily remembered for modal realism and counterpart theory, not soteriology. In your monograph, you treat his 1997 paper not as a curious sideline but as a foundational text for analytic penal substitution. What is it about Lewis's specific methodological approach to "folk concepts" that makes his brief treatment of atonement more robust than the extensive work done by dedicated philosophical theologians?

  *   **Follow-up:** If she cites Lewis's clarity or conceptual analysis: "Does relying on a generalist metaphysician risk importing assumptions about identity and transfer that are alien to the specific theological tradition you're trying to defend?"

  **2.** The core of Lewis's argument, which you revive, rests on the structural similarity between financial debt and penal liability. However, critics argue that while debt is an external asset that can be moved, guilt is an internal state of the agent. Why should we accept the premise that penal liability is separable from the moral agent in the way a bank balance is, without simply asserting the analogy holds?

  *   **Follow-up:** If she insists the separability is intuitive: "Is that intuition derived from our actual moral practices, or is it a theoretical construct required to make the substitution model work?"

  **3.** **(Constraint A)** You have characterized the standard retributivist objection—that punishment must essentially target the wrongdoer—as 'begging the question' about the purpose of punishment. But isn't there a distinction between a *contingent* purpose we assign to punishment and the *conceptual truth* of what punishment *is*? Why should the disanalogy between debt and desert count as a revisable assumption rather than a definitional boundary?

  *   **Follow-up:** If she argues that definitions are flexible: "If we can revise the definition of punishment to allow for transfer, on what grounds do we prevent revising it so far that it no longer qualifies as *justice*?"

  **4.** Let's press on that definitional boundary. If the retributive link between offender and penalty is not essential, what stops this from becoming a purely utilitarian calculation where the suffering of an innocent is instrumentally good simply because it balances a cosmic ledger? Where is the non-consequentialist constraint in your model?

  *   **Follow-up:** If she posits a constraint (e.g., consent): "Doesn't that shift the justificatory weight entirely onto the consent, rendering the 'penal' aspect secondary to the 'voluntary offering' aspect?"

  **5.** **(Constraint B)** In Lewis's secular examples of penalty swapping, the transfer seems to require licensing from three possible sources: the substitute's consent, the wrongdoer's acceptance, or the authority's decree. In your reconstruction, which of these is doing the heavy lifting to make the transfer morally permissible?

  *   **Follow-up:** If she identifies the Authority (God): "If the permissibility rests solely on Divine Authority, does that not make the atonement an exercise of power rather than an satisfaction of independent justice?"

  **6.** Following up on the licensing condition: If the substitute's consent is required, can a human or divine person genuinely consent to *punishment* as opposed to mere *suffering*? Punishment carries a connotation of censure directed at guilt; can Christ consent to be censured for guilt he does not possess without creating a fiction?

  *   **Follow-up:** If she argues Christ accepts the *status* of guilt: "Does imputing the status of guilt to an innocent party satisfy the logic of substitution, or does it merely replicate the moral problem you're trying to solve?"

  **7.** **(Constraint C)** By loosening the requirement that punishment must target the wrongdoer, are you not quietly trading a retributive theory of punishment's point for a consequentialist or 'vindication of the law' theory? Retributivism insists on the intrinsic value of giving the offender their due; your model seems to prioritize the balancing of the ledger.

  *   **Follow-up:** If she denies the trade-off and claims a hybrid view: "In that hybrid, is the retributive element doing any justificatory work, or is it merely decorative language used to maintain continuity with tradition?"

  **8.** If your defense does rely on a non-retributive theory of punishment, does this not concede exactly what your critics were asking for? If the 'penalty' is no longer retributive in the strict sense, haven't you saved the doctrine of substitution only by abandoning the doctrine of penal justice that made it controversial in the first place?

  *   **Follow-up:** If she argues the tradition is broader than strict retributivism: "Is there historical evidence that the proponents of penal substitution understood it in the non-retributive way you propose, or is this a charitable reconstruction?"

  **9.** **(Lewis's Doubt)** Lewis concludes his paper by wondering whether a logically tidied-up version of penal substitution is still recognizably what believers take themselves to be committed to. If we accept your defense, we have a logically coherent model of transferable liability; but how do you ensure that this model hasn't been sanitized to the point where it no longer matches the religious experience of those who actually rely on this doctrine for salvation?

  *   **Follow-up:** If she argues that theological doctrines evolve: "Is there a line where evolution becomes replacement, and if the 'penalty' is no longer personal, have we crossed that line?"
