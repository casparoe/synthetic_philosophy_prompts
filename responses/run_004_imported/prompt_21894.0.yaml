      *   *Resolution:* Mill believes the *education* and *dignity* gained from cooperation will naturally lead to population restraint. It's not a contradiction; it's a prerequisite condition that he believes the system itself will foster. The "unresolved" part is empirical: Will it actually foster that restraint? Mill hopes yes, but hedges his bets.

