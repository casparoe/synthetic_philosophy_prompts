prompt: |-
  I've volunteered at a small wildlife rehabilitation center for about three years, and I now sit on the five-person board that sets our intake policy. That policy, drafted by the center's founder a decade ago, says we treat animals "whose injury or illness is clearly attributable to human activity" -- roadkill survivors, birds that hit windows, animals tangled in fishing line, raptors poisoned by rodenticide -- while animals hurt by predation, disease, or starvation in the ordinary course of nature are only to be stabilized enough for release or euthanasia, never actively treated. Last month a hiker brought in a fawn that had escaped a coyote attack but was badly wounded; its injuries looked no different from the car-strike fawns we treat every week, but our policy said we weren't supposed to do more than assess it.

  That case has split the board almost evenly. Afterward I spent an evening reading about this on my own and found there's an entire existing argument, apparently going back decades, that the human/natural line is basically arbitrary once you accept that suffering is bad regardless of what caused it -- and two of my fellow board members now want to drop the distinction entirely. The other three don't deny the pain feels the same either way, but argue that our specific duty is to fix harms we're implicated in causing, not to referee the entire food web -- and they point out, a little uncomfortably, that we already blur this line ourselves, since our non-releasable education-program hawks are fed live mice, which makes the center itself a direct cause of exactly the kind of "natural" predation the policy calls off-limits.

  I'd like you to draft the short memo I'll circulate before our board meeting in two weeks, recommending whether we keep the human-cause criterion, replace it with a different triage principle, or drop it altogether -- and to give real reasons for the recommendation rather than just picking whichever side sounds more compassionate on its face. I especially want it to engage with the mission-creep worry instead of waving it away, since that's the argument that's kept this policy in place for ten years, and I need the recommendation to translate into concrete criteria our intake volunteers could actually apply at the door at 11 p.m. on a Saturday, not just a restatement of the principle that suffering matters wherever it occurs.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Board member of a small wildlife rehabilitation center (3 years volunteering, now on the 5-person board).
      *   **Audience:** The other 4 board members (split 2 vs. 3 on the issue) and potentially the Executive Director/Staff (who implement policy).
      *   **Topic:** Revising the intake policy regarding the "human-cause" criterion (anthropogenic vs. natural causes).
      *   **Current Policy:** Treat only human-caused injuries (roadkill, window strikes, fishing line, rodenticide). Stabilize/euthanize natural injuries (predation, disease, starvation).
      *   **The Catalyst:** A fawn injured by a coyote (natural) looked identical to car-strike fawns (human), highlighting the arbitrariness of the distinction regarding suffering.
      *   **The Conflict:**
          *   Side A (2 members + User leaning?): Suffering is bad regardless of cause; drop the distinction.
          *   Side B (3 members): Duty is to fix harms we caused; can't referee the food web; resource limits/mission creep.
          *   Complicating Factor: The center feeds live mice to education hawks, indirectly causing "natural" predation deaths, which undermines the moral purity of Side B's argument.
      *   **Requirements:**
          *   Short memo.
          *   Recommend a specific path (Keep, Replace, or Drop).
          *   Provide *real reasons* (not just "compassion").
          *   Engage with the "mission creep/resource" worry (don't wave it away).
          *   Provide concrete criteria for volunteers at 11 p.m. on a Saturday (actionable).

  2.  **Determine the Recommendation:**
      *   *Option 1: Keep the status quo.* Weak. The fawn case exposed the moral inconsistency and the "live mice" issue exposes the hypocrisy. It doesn't solve the suffering problem.
      *   *Option 2: Drop the distinction entirely (Treat all).* Dangerous. "Refereeing the food web" is impossible. Resources are finite. Treating a starving fox or a diseased raccoon could overwhelm the center, leading to lower quality care for everyone and potential closure.
      *   *Option 3: Replace with a different triage principle.* Best balance. Acknowledge the moral weight of suffering but prioritize based on *releasability* and *resource impact*, while acknowledging human responsibility where clear.
      *   *Refined Option 3 (The "Human-Impact + Viability" Hybrid):* We can't treat everything, but the strict "human-cause" binary is flawed. A better metric is "Probability of Release" combined with "Human Contribution." However, the prompt asks to engage with the mission creep worry.
      *   *Decision:* I will recommend **replacing the strict "human-cause" binary with a "Releasability and Resource Impact" framework, while retaining a priority tier for anthropogenic injuries.** This acknowledges the duty to fix our mess (Side B) without ignoring suffering that looks treatable (Side A), and it solves the "11 p.m. Saturday" test.
      *   *Wait, looking closer at the prompt:* The prompt asks to recommend whether to *keep, replace, or drop*.
      *   *Strategic Choice:* Dropping it entirely is too risky for a small center. Keeping it is morally inconsistent. *Replacing* it with a nuanced triage protocol is the most responsible leadership move.
      *   *Specific Recommendation:* Shift from "Cause of Injury" to "Likelihood of Successful Release & Resource Burden," with a *priority* for human-caused cases. This addresses the mission creep (we still say no to chronic diseases/starvation) but allows the coyote fawn (acute trauma, high release chance) to be treated.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the fawn case and the division. State the purpose of the memo.
      *   **The Problem with the Current Policy:** It's morally inconsistent (suffering is the same) and logically fragile (the live mouse issue).
      *   **The Problem with Dropping It Entirely:** Mission creep. We cannot treat the entire food web. Resources are finite.
      *   **The Recommendation:** A hybrid model. "Anthropogenic Priority" + "High Viability."
      *   **Concrete Criteria (The 11 p.m. Test):** This is crucial. Volunteers need a checklist, not philosophy.
          1.  Is it acute trauma? (Yes -> Proceed. No -> Euthanasia/Stabilize).
          2.  Is release likely? (Yes -> Proceed. No -> Education/Euthanasia).
          3.  Is there evidence of human cause? (Yes -> Priority. No -> Secondary).
      *   **Addressing the "Live Mouse" Hypocrisy:** Acknowledge it. It shows we participate in nature, but we shouldn't *multiply* suffering unnecessarily.
      *   **Closing:** Call to action for the meeting.

  4.  **Refining the Tone:**
      *   Needs to be respectful but firm.
      *   Needs to show empathy for both sides (the compassionate idealists and the pragmatic stewards).
      *   Needs to be practical.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the "Priority" system clear enough?
      *   *Fix:* Make sure the "11 p.m. Saturday" section is very distinct.
      *   *Critique:* Did I address the "live mice" point?
      *   *Fix:* Yes, include it in the "Integrity of Mission" section. It shows we aren't pretending to be outside nature, but we are limiting our *negative* footprint.
      *   *Critique:* Is the recommendation clear?
      *   *Fix:* Explicitly state: "Replace the binary cause-based policy with a Viability-First Triage Protocol."

  6.  **Final Polish:** Check word count (keep it "short" as requested) and ensure the arguments are "real reasons" (resource allocation, mission integrity, moral consistency) rather than just "feelings."

      *(Self-Correction on the Recommendation)*: Actually, looking at the "mission creep" worry, the strongest argument for the *status quo* proponents is resources. If we drop the line, we get flooded. If we keep the line, we turn away treatable animals that look like car strikes.
      *Better Recommendation:* **Replace the "Human-Cause" criterion with a "Treatable Acute Trauma" criterion, with Human-Cause as a tie-breaker for resource allocation.**
      *Why?* Because a coyote bite and a car strike are both acute trauma. A disease or starvation is chronic/systemic. This solves the fawn problem without opening the floodgates to every sick raccoon. It addresses the "suffering is the same" argument (acute pain is acute pain) while addressing the "referee the food web" worry (we aren't treating chronic natural selection issues, just acute accidents, regardless of agent).

      *Wait, one more nuance:* The prompt says the current policy allows stabilization for natural injuries. The proposal should allow *treatment* for natural injuries *if* they meet specific criteria (acute, releasable).
      *Let's go with:* **Replace the strict "Human-Cause" gatekeeper with a "High-Viability Acute Trauma" standard, prioritizing human-caused cases when resources are constrained.** This is the most balanced approach.

      *Wait, looking at the "Live Mouse" point again:* The board members arguing for the status quo use the "we cause predation" point *against* themselves (uncomfortably). The memo should use this to show why the current policy is logically unsustainable, pushing them toward the new model.

      *Final Plan:*
      1.  Subject: Intake Policy Revision Recommendation.
      2.  Context: The fawn case.
      3.  Analysis: Why "Human-Cause" is failing (moral & logical). Why "Treat All" is impossible (resources).
      4.  Proposal: "Acute Trauma & Release Viability" model.
      5.  Implementation: The 11 p.m. Checklist.
      6.  Addressing the Mouse/Hypocrisy point.

  7.  **Drafting the Content:** (Mental check of the "11 p.m. Saturday" constraint). The criteria must be objective. "Is there broken bone?" "Is there bleeding?" vs "Did a human do this?" (which requires investigation). Actually, "Did a human do this" is often hard to know at 11 p.m. A coyote bite looks like a dog bite looks like a car graze. So shifting to *Injury Type* is actually more practical for volunteers too.

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Intake Policy Revision

  **Purpose**
  Following the recent intake of the coyote-injured fawn, this memo recommends replacing our current "Human-Cause Only" treatment policy with a **"High-Viability Acute Trauma"** protocol. This approach maintains our resource boundaries while resolving the moral and logical inconsistencies currently dividing the board.

  **The Problem with the Status Quo**
  Our current policy relies on a binary distinction (Human vs. Natural) that is increasingly difficult to defend on two fronts:

  1.  **Moral Consistency:** As noted in our last meeting, the physiological suffering of a fawn is identical whether caused by a coyote or a sedan. When the injury presentation is indistinguishable, denying treatment based on an unseen cause creates moral distress for staff and volunteers without reducing animal suffering.
  2.  **Logical Integrity:** The argument that we must not interfere in "natural" predation is undermined by our own education program. Feeding live mice to raptors makes us active participants in the predation cycle we claim to stand apart from. We cannot claim moral purity regarding "natural order" while orchestrating it for our operational needs.

  **The Risk of Removing All Criteria**
  Conversely, dropping the distinction entirely ("Treat All") invites mission creep that threatens the center's survival. We lack the capacity to treat chronic wasting disease, starvation, or endemic parasites. Attempting to "referee the food web" would dilute our resources, lower recovery rates, and potentially force us to close—helping no one.

  **Recommendation: A Viability-First Triage Model**
  I propose we shift our intake gatekeeper from **Cause of Injury** to **Type of Injury and Release Probability.**

  Under this model, we treat acute trauma regardless of cause, provided the animal is a candidate for release. Human-caused injuries retain *priority* status when resources are critically constrained, honoring our specific duty to rectify anthropogenic harm without ignoring treatable natural trauma.

  **Concrete Criteria for Volunteers (The "11 P.M. Saturday" Test)**
  To ensure this is actionable for intake volunteers, we will replace the question *"Did a human cause this?"* with the following triage checklist. If the answer to **A** is No, we stabilize/euthanize. If **A** is Yes, we proceed to **B**.

  *   **A. Is the injury Acute Trauma?**
      *   *Yes:* Broken bones, lacerations, blunt force, acute poisoning. (Eligible for treatment).
      *   *No:* Emaciation, chronic infection, congenital defects, advanced disease. (Not eligible for treatment; stabilize for transfer or euthanasia).
      *   *Reasoning:* This excludes the "food web" issues (starvation/disease) that overwhelm resources, while capturing the fawn/coyote and fawn/car scenarios equally.

  *   **B. Is Release Likely (>60% probability)?**
      *   *Yes:* Proceed with intake.
      *   *No:* Euthanasia or Education (if space permits).
      *   *Reasoning:* Ensures resources are spent on wild outcomes, not long-term captivity.

  *   **C. (Tie-Breaker) Is Human Cause Confirmed?**
      *   *Yes:* Priority intake during high-volume periods.
      *   *No/Unknown:* Intake permitted if capacity exists.
      *   *Reasoning:* This satisfies the duty to fix our own mess first without forcing volunteers to play detective at the door.

  **Conclusion**
  This revision acknowledges that while we cannot prevent all suffering, we are not obligated to perpetuate arbitrary distinctions that hinder our primary goal: returning wild animals to the wild. It protects our resources from chronic cases while allowing us to treat the treatable, regardless of the agent of injury.

  I ask that we vote to adopt this Triage Model at the upcoming meeting.
