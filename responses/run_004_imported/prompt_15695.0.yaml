answer: |-
  Good evening. For those of you who don't know me, I'm [Name], and I had the distinct privilege of being [Bride] and [Groom]'s doctoral advisor. For those of you who *do* know me, please, put away your red pens; there will be no grading tonight. Only celebration.

  I've been asked to say a few words about how this couple met. And the truth is, they didn't meet over a shared love of hiking, or a mutual dislike of cilantro. They met in a graduate seminar I taught on the nature of moral value. Specifically, they met in opposition.

  As far as I can tell, they have not stopped arguing since.

  Now, I know about a third of this room is filled with philosophers who know exactly what I'm talking about. But for the parents, siblings, and friends—who I promise are not being tested on this later—let me translate.

  [Bride] argued, in her dissertation, for a view rooted in Immanuel Kant. She held that an action only has true moral value if you do it because it is your *duty*. She used the example of the honest shopkeeper. If a shopkeeper charges you the fair price only because he's afraid of getting a bad reputation, he's honest, but he deserves no moral credit. He's just calculating. To be truly good, you have to do the right thing *because* it is the right thing.

  [Groom], on the other hand, spent the last several years arguing the opposite. He drew on the story of Huckleberry Finn. Huck helps his friend Jim escape slavery, even though he thinks he's breaking the law and sinning. He isn't acting from a high-minded maxim of duty; he's acting because he sees Jim's suffering and he cares. [Groom] argued that what matters isn't the rule in your head, but your responsiveness to the person in front of you.

  For years, she championed the integrity of the will. He championed the responsiveness of the heart. She stood for Principle. He stood for Perception.

  And looking at them tonight, I realize that their disagreement was never really a disagreement at all. It was a division of labor.

  Because a marriage cannot survive on Huck Finn alone. Love is not just a spark of responsiveness when the sun is shining. Sometimes, love is the honest shopkeeper. Sometimes, love is showing up, keeping a promise, and doing the right thing even when you are tired, even when it is difficult, simply because you made a vow. That is the Kantian spine of a relationship: the duty to care, even when the feeling fluctuates.

  But a marriage cannot survive on Kant alone. You cannot love someone merely because a rulebook tells you to. That is cold. To love someone is to see *them*. It is to be responsive to their joy, their pain, their specific needs, not because "spouses ought to," but because *they matter*. That is the Huck Finn heart of a relationship: the loyalty that transcends the rule.

  [Bride] and [Groom], you have spent your intellectual lives debating what makes an action *worthy*. You have parsed the conditions of moral credit. But tonight, we are not here to evaluate your maxims. We are here to celebrate your union.

  And this brings me to the only technical term I think is appropriate for this evening. It is the word that sits at the center of your debate, and at the center of this celebration.

  *Worth.*

  In your seminar, "worth" was a technical metric. It was about merit and justification. But in a marriage, "worth" is something else entirely. It is not about what you earn. It is about what you give.

  To the philosophers in the room: You might ask if this union is justified by duty or by reasons-responsiveness.
  To the family in the room: You might ask if they make each other happy.

  The answer is yes. Because they have built a life where the duty protects the love, and the love animates the duty. They have proven that they are, quite simply, *worth* the effort. They are *worth* the argument. They are *worth* each other.

  So, I invite you all to raise your glasses.

  [Bride] and [Groom], you have spent years analyzing the conditions of a good life. Tonight, you stop analyzing and start living it. May your home always be a place where principles are kept, but people come first. May you always find the right balance between the rule and the response. And may you never stop debating, as long as you never stop listening.

  To [Bride] and [Groom]. To a life of immeasurable worth.

  Cheers.
