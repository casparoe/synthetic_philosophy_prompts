answer: |-
  **The Interval**

  **I.**

  The cursor blinked against the white void of the document, a steady, metronomic pulse. Elias watched it for a long time, listening to the rain tap against the study window. It was November, gray and cold, the kind of weather that made the interior of his head feel spacious and clean.

  On the screen, the draft was finished. Twelve hundred words addressed to his brother, Julian. An admission of fault, specific and unadorned. An offer to meet. A bridge built of text.

  Elias leaned back in the chair, the leather creaking softly. He knew himself. He knew the architecture of his own hesitation. If he clicked *Send* now, in the cold clarity of November, he would feel a spike of adrenaline, a flash of panic, and he would delete it. He would tell himself the wording was wrong, that Julian wasn't ready, that the timing was imperfect. He would save the draft. And then he would never open it again.

  The future reward was clear: a restored relationship, the end of a five-year silence, the lifting of the heavy stone he carried in his chest. The immediate cost was also clear: vulnerability, the risk of rejection, the humiliation of begging for forgiveness. In November, with the distance of weeks between him and the act, the future reward outweighed the cost. It was simple arithmetic. The stone was heavy; the risk was theoretical.

  He needed to remove his own hand from the equation.

  Elias opened his email settings. He pasted the text into the composer. He set the delivery date for December 15th, 9:00 AM. Then he logged out.

  He picked up his phone and dialed Claire. She answered on the second ring, her voice bright with the noise of a party in the background.

  "I need a favor," Elias said. "A specific kind."

  "I'm listening."

  "I'm going to give you my password. My email password. I need you to write it down and put it in an envelope. You cannot give it to me until December 16th. No matter what I say. No matter if I call you crying. No matter if I offer you money."

  There was a pause on the line, the muffled bass of the party fading as she stepped into a quieter room. "Elias, that sounds extreme. Just send the email."

  "I can't. You know I can't. I need to be unable to stop it."

  "You want me to hold you hostage."

  "I want you to hold *me* hostage. From myself."

  He could hear her breathing, considering the weight of it. She knew the history with Julian. She knew the stone.

  "Okay," she said finally. "But if you hate me for this, I'm keeping the envelope."

  "I'll hate you," Elias said. "And I'll thank you. Both will be true."

  He read her the string of characters. He imagined the future Elias, the one in December, receiving the reconciliation. That Elias would be lighter. That Elias would look back at this November night and feel gratitude. The discomfort of now was a small price for the stability of then. It was a rational trade. He was investing pain today for peace tomorrow.

  He closed the laptop. The room was quiet again, save for the rain. He felt virtuous, like a man who had just signed a contract to quit a vice, the ink still wet, the resolve still untested by the heat of the day.

  **II.**

  The porch light buzzed, a harsh, yellow insect sound that drilled into the side of Elias's head. It was December 15th. The email was scheduled to send in twelve hours.

  He stood on Claire's doorstep, the cold biting through his coat. He had driven here in a state of low-grade nausea, his hands gripping the steering wheel so tightly his knuckles had turned the color of old parchment.

  Now, standing on the mat, the arithmetic had changed.

  In November, the rejection was a concept. Now, it was a physical sensation in his gut. The email was no longer a bridge; it was a loaded gun pointed at his own head, set to fire in the morning. He could see Julian's face when he read it. Not the forgiving face Elias had imagined in the study, but the cold, dismissive face from five years ago. The humiliation wasn't theoretical anymore. It was waiting for him, twelve hours away.

  The future reward—the possibility of peace—had shrunk. It was distant, foggy, uncertain. The immediate cost—the anxiety vibrating in his chest right now—was enormous. It dwarfed the future. The curve had steepened. The present moment demanded safety, and safety meant stopping the send.

  He knocked.

  Claire opened the door. She was wearing a sweater, holding a mug of tea. She looked at him, and her expression shifted from surprise to a quiet, resigned understanding. She didn't invite him in.

  "It's tomorrow," Elias said. His voice sounded thin in the cold air.

  "I know."

  "I need the password, Claire."

  "Elias, we talked about this. Sixteen th."

  "I can't let it go. It's not right. I looked at it again. The wording… it's aggressive. It's going to make things worse. I'm protecting him. I'm protecting myself."

  "You told me not to listen to that."

  "I know what I told you." He stepped closer to the doorframe, invading the warmth of her hallway. "Please. It's a mistake. I'm correcting a mistake."

  "You're correcting the commitment."

  "I'm being rational. The situation has changed."

  Had it? The facts were the same. The draft was the same. Julian was the same. Only the distance had changed. The cliff was no longer on the horizon; it was at his toes. From here, jumping looked like suicide. From November, it had looked like flying.

  Claire didn't move. She held his gaze, and for a second, he saw the judgment there. Not anger, but a kind of pity. She saw the sequence of selves. The November Elias who made the plan, and the December Elias who was dismantling it. She was the witness to the handoff, the uneasy negotiation between two people who shared a name but wanted different things.

  "If I give it to you," she said softly, "you'll never make this call again. You know that. The November you is gone. He won't come back."

  "He was wrong," Elias said. "He didn't know how it would feel."

  "He knew exactly how it would feel. That's why he called me."

  Elias looked past her, into the warm light of the hall. He could feel the password in the air between them, a key to a lock he had built himself. To take it was to admit that the future self was a stranger whose needs could be ignored. To leave it was to sacrifice the present self to a plan that now felt like a trap.

  "Claire," he said. He didn't beg. He stated it. "Give me the password."

  She closed her eyes for a moment. She exhaled, a long, slow release of breath that fogged in the cold air between them. She turned and walked back into the house. Elias waited. He did not feel triumphant. He did not feel ashamed. He felt a profound, hollow consistency. He was doing exactly what made sense for the person standing on the porch, just as the person in the study had done exactly what made sense for the person sitting in the rain.

  She returned with a slip of paper. She held it out, not letting go until he met her eyes.

  "Don't thank me," she said.

  "I won't," Elias said.

  He took the paper. He turned and walked back to his car. The engine started smoothly. He drove home through the wet streets, the password burning a hole in his pocket. He would log in. He would delete the draft. He would sleep tonight without the fear of tomorrow's notification.

  He pulled into his driveway and sat in the idling car. The stone was still in his chest. It felt heavy, familiar, and entirely his own. He turned off the engine and watched the house, dark and waiting, and wondered if the man who got out of the car was the same one who had gotten in, or if he had simply finally caught up to who he had been all along.
