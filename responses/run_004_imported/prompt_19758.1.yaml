prompt: |-
  I'm a philosophy PhD student who somehow ended up as the grad rep on my university's research misconduct committee (don't ask). I have to draft the recommendation memo for Friday's meeting and I'm stuck.

  A postdoc fabricated data in three published papers. A labmate flagged to the PI months earlier that the postdocs raw files looked 'too clean' to be real. The PI never looked into it or told anyone; two more of the fabricated papers went out in the meantime, and another lab wasted a year on a failed replication. Our policy treats 'knowingly facilitating misconduct' as equivalent to committing it, versus a lesser category, 'inadequate supervision' -- and the committee's split on which fits here. Half say the PI caused the extra harm, since none of it happens if they'd spoken up. The other half say that's backwards: the postdoc would've kept fabricating regardless, so the PI didn't cause anything, just failed to stop something already underway.

  Can you draft the memo? Land on one category, argue for it rather than assert it, and actually engage the 'would've happened anyway' objection instead of waving it off.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Philosophy PhD student, Grad Rep on Research Misconduct Committee.
      *   **Task:** Draft a recommendation memo for Friday's meeting.
      *   **Scenario:** Postdoc fabricated data in 3 papers. Labmate warned PI months earlier ("too clean"). PI ignored it. 2 more fabricated papers published. Another lab wasted a year on failed replication.
      *   **Policy:** Two categories: 1) "Knowingly facilitating misconduct" (equivalent to committing it), 2) "Inadequate supervision" (lesser).
      *   **Committee Split:** Half say PI caused extra harm (inaction = facilitation). Half say Postdoc would've done it anyway (PI just failed to stop).
      *   **Requirements:** Land on *one* category, argue for it (don't just assert), engage the "would've happened anyway" objection seriously.
      *   **Tone:** Professional, philosophical rigor (given the user's background), persuasive, suitable for a university committee.

  2.  **Determine the Stance:**
      *   *Option A: Inadequate Supervision.* Easier to defend causally. The PI didn't *make* the postdoc lie. But it feels morally weak given the specific warning. Ignoring a specific tip-off moves beyond mere negligence into complicity.
      *   *Option B: Knowingly Facilitating.* Harder causal lift, but morally stronger and fits the policy's intent. The specific warning creates a duty of care. Ignoring it allowed the harm to propagate.
      *   *Decision:* "Knowingly facilitating" is the more philosophically interesting and ethically robust position, especially for a Philosophy PhD student to draft. It allows for a nuanced discussion of causation, omission vs. commission, and institutional duty. It also aligns better with the severity of the harm (wasted year for another lab).

  3.  **Outline the Memo:**
      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose, the case summary, and the recommendation.
      *   **Analysis of Policy:** Define the two categories briefly.
      *   **Argument for "Knowingly Facilitating":**
          *   Focus on the specific warning (the pivot point).
          *   Discuss the shift from general supervision to specific knowledge.
          *   Address the causal link (omission as cause).
      *   **Engaging the Counter-Argument ("Would've Happened Anyway"):**
          *   Acknowledge the validity of the causal skepticism.
          *   Refute it using the concept of *opportunity* and *institutional validation*.
          *   Distinguish between the *act* of fabrication and the *harm* of publication/propagation.
      *   **Conclusion:** Reiterate recommendation and suggest sanctions/outcomes.

  4.  **Drafting - Section by Section:**

      *   *Header:* Keep it formal.
      *   *Opening:* Clear statement of the recommendation. "Knowingly facilitating."
      *   *The Crux:* The labmate's warning. This is the smoking gun. It moves the PI from "unaware supervisor" to "aware bystander."
      *   *The Causal Argument:* This needs philosophical weight. The counter-argument relies on a "but-for" causation regarding the *fabrication*. I need to shift the focus to the *harm*. The PI's inaction caused the *publication* and the *replication attempt*.
      *   *Addressing the Objection:* The "would've happened anyway" crowd argues the Postdoc is the sole cause. I need to argue that research isn't just raw data; it's a social/credentialing process. The PI holds the keys to the castle. By not locking the door after being told it was open, they facilitated the theft.
      *   *Policy Alignment:* Why does "facilitating" fit better than "inadequate supervision"? "Inadequate" implies negligence/lack of skill. "Facilitating" implies a choice to allow. The PI *chose* not to act on specific evidence.

  5.  **Refining the Tone:**
      *   Needs to sound like a committee document, not a philosophy paper, but with the rigor expected of the user.
      *   Avoid overly academic jargon where possible, but use precise terms (omission, complicity, epistemic gatekeeping).
      *   Ensure the distinction between the *act* of fraud and the *success* of fraud is clear.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the causal argument strong enough?
      *   *Fix:* Emphasize the specific timeline. Warning -> 2 papers published. The PI had the power to stop the *publication* even if they couldn't stop the *fabrication*. The harm is the publication.
      *   *Critique:* Is it too aggressive against the PI?
      *   *Fix:* Acknowledge the difficulty of the PI's position but emphasize the specific duty triggered by the report.
      *   *Critique:* Did I address the "would've happened anyway" point?
      *   *Fix:* Make sure there's a dedicated section or strong paragraph explicitly tackling the counterfactual. (Decided to integrate it into the main argument for flow, but ensure it's distinct). *Correction:* The prompt asks to "actually engage" it. A dedicated section might be clearer. Let's create a specific "Addressing Causal Objections" section.

  7.  **Final Polish:** Check formatting, clarity, and ensure the recommendation is unambiguous. (The prompt asks to "Land on one category"). I will choose "Knowingly Facilitating."

  8.  **Final Check against Constraints:**
      *   Draft the memo? Yes.
      *   Land on one category? Yes (Knowingly Facilitating).
      *   Argue rather than assert? Yes.
      *   Engage the 'would've happened anyway' objection? Yes.
      *   Tone appropriate for Philosophy PhD/Committee? Yes.

  *(Self-Correction during final review)*: Wait, I need to make sure I don't sound *too* much like a philosopher. It still needs to be a university admin memo. I will balance the normative ethics with the practical policy interpretation.

