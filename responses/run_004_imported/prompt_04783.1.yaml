prompt: |-
  So this is a weird one that landed in my lap recently. I write short stories on the side, and this year I said yes for the first time to judging our regional arts council's short-fiction prize — five judges, about 130 submissions, six weeks total to land on a shortlist. The coordinator's plan is that each story only gets a full read from two of the five judges, who each write a short response and a 1-10 score, and then the whole panel decides the shortlist off those write-ups, even for the stories most of us never actually read ourselves. Two of the judges are now flatly refusing to go along with this: their argument is that calling one story better or more affecting than another isn't the kind of judgment you can take secondhand, no matter how much you trust the person's taste — you either read it and it did something to you or it didn't, and a colleague telling you a story is the strongest in the batch can't do the work that testimony does for an ordinary fact. The coordinator thinks that's precious, since we all act on other people's aesthetic verdicts constantly — best-of lists, a critic we trust, a friend's recommendation — without treating any of that as fake or illegitimate.

  I got stuck drafting the actual protocol that goes to the rest of the panel (and probably gets explained to writers who ask how their work was judged), and with results due in three weeks I cant just let the standoff sit there. I mentioned it to my partner, who thinks I'm overthinking a short-story contest, but the panel is genuinely split down the middle and someone has to put something in writing. Could you draft that memo for me? I need it to actually take a side on whether, and how far, a judge can legitimately rank or score a story they haven't read themselves — engaging with the strict pair's strongest point rather than just asserting that we all trust each other's taste — and then turn that into a workable protocol: who has to read what firsthand, what the secondhand write-ups are and aren't allowed to settle, and whether anything (like the eventual winner) should require every judge to have read it themselves.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** A regional arts council short-fiction prize. 5 judges, 130 submissions, 6 weeks.
      *   **The Conflict:** The coordinator's plan is for each story to be read by only 2 judges (who score/write responses), and the full panel decides the shortlist based on those write-ups (meaning 3 judges might vote on stories they haven't read). Two judges refuse, arguing aesthetic judgment requires direct experience. The coordinator argues we trust secondhand recommendations all the time.
      *   **The Task:** Draft a memo to the panel (and potentially public-facing) that resolves the standoff.
      *   **Key Requirements:**
          *   Must take a side on the philosophical question (can you rank unread work?).
          *   Must engage with the "strict pair's" strongest point (aesthetic experience is subjective/immediate), not just dismiss it as "trusting taste."
          *   Must create a workable protocol (who reads what, limits on secondhand scoring, requirements for the winner/shortlist).
          *   Deadline pressure (3 weeks left).
          *   Tone: Professional, diplomatic, decisive, principled.

  2.  **Determine the Stance:**
      *   *Option A (Coordinator's View):* Trust the system. Efficient. But risks alienating the dissenting judges and undermines the integrity of the prize if discovered.
      *   *Option B (Dissenting Judges' View):* Read everything. Impossible (130 stories x 5 judges = 650 reads in 6 weeks).
      *   *Option C (Hybrid/Compromise):* Acknowledge the validity of the dissenting view (aesthetic judgment *is* personal) but recognize logistical constraints. Therefore, secondhand data can *filter* but cannot *decide* the top tiers.
      *   *Decision:* Option C is the only viable path. It validates the dissenters' philosophical point (you can't truly judge what you haven't felt) while accepting the coordinator's logistical reality (we can't all read 130 stories). The memo should argue that secondhand reports are for *elimination*, not *elevation*, beyond a certain threshold. The Winner *must* be read by all.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the tension. Validate both sides. State the purpose (protocol for decision-making).
      *   **Philosophical Stance (The Core):** Address the "secondhand judgment" issue.
          *   *Argument:* A recommendation is a map, not the territory. We can trust a colleague's *analysis*, but a prize recognizes *effect*. Therefore, we can use scores to narrow the field, but we cannot finalize rankings without consensus of experience.
          *   *Engaging the Dissent:* Acknowledge that a score of 9/10 from a colleague doesn't transmit the *ache* of the story.
          *   *Engaging the Coordinator:* Acknowledge we rely on critics, but a prize jury is different than a reader following a critic. We are *arbiters*, not consumers.
      *   **The Protocol (The Mechanics):**
          *   *Round 1 (Triage):* 2 readers per story. Scores + Comments.
          *   *Round 2 (The Shortlist):* Stories above a certain threshold (e.g., average 8+) move to "Full Panel Read."
          *   *The Crucial Rule:* No story makes the final Shortlist (or wins) unless *all* judges have read it.
          *   *Handling Disagreement:* If a story has high scores from 2 judges but the other 3 haven't read it, it stays in "Contention" until read.
          *   *Timeline:* Needs to fit the 3-week remaining window.
      *   **Public Facing/Transparency:** How to explain this if asked. "Rigorous multi-stage process."
      *   **Closing:** Call to action/agreement.

  4.  **Refining the Tone:**
      *   Needs to be firm but not authoritarian.
      *   Needs to show I've listened to the dissenters (this is crucial for buy-in).
      *   Needs to show I respect the coordinator's timeline.
      *   *Self-Correction during drafting:* I initially thought about letting the shortlist be decided by the 2 readers. But the prompt says the *whole panel* decides the shortlist off write-ups. That's the friction point. The solution must be that the *panel* only decides the shortlist *after* everyone has read the shortlist candidates. The write-ups are for *nomination*, not *selection*.

  5.  **Addressing the Specific Prompt Requirements:**
      *   *Take a side:* Yes, the memo will argue that final ranking requires direct experience.
      *   *Engage the strict pair's point:* Yes, explicitly mention that aesthetic impact isn't transmissible data.
      *   *Workable protocol:* Yes, specific steps for Round 1 vs. Round 2.
      *   *Winner requirement:* Yes, unanimous reading required for the winner.

  6.  **Final Polish:**
      *   Check word count and flow.
      *   Ensure the distinction between "scoring" (can be secondhand) and "ranking/shortlisting" (must be firsthand) is clear.
      *   Make sure the timeline feels realistic (3 weeks left is tight for a full panel read of a shortlist, so the shortlist needs to be small, e.g., 10-12 stories).

  7.  **Final Review against constraints:**
      *   Did I overthink it? (Partner's view). No, the prompt asks for a principled stand.
      *   Is it diplomatic? Yes.
      *   Does it solve the standoff? It offers a middle ground that honors the dissenters' integrity without breaking the logistics.

  *(Self-Correction Note)*: Wait, if there are 130 submissions and only 3 weeks left, can the whole panel read a shortlist of 10? Yes, 10 stories is doable. Can they read 20? Maybe. The protocol needs to ensure the "Full Read" pile is manageable. I will suggest a "Longlist" (based on 2 readers) that gets whittled to a "Shortlist" (based on 5 readers).

  Let's write the memo.cw
answer: |-
  **MEMORANDUM**

  **TO:** Short-Fiction Prize Judging Panel
  **FROM:** [Your Name], Panel Chair
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Protocol and Reading Requirements for Final Selection

  **Context**
  As we enter the final three weeks of the judging period, we need to formalize how we move from individual scores to a collective shortlist and winner. We have 130 submissions, five judges, and a logistical constraint that prevents every judge from reading every submission. This memo establishes the protocol we will use to ensure our final decisions are both logistically feasible and ethically sound.

  **The Philosophical Stance**
  There has been a necessary and vigorous debate regarding whether a judge can legitimately score or rank a story they have not read personally. One view suggests that trusting a colleague's assessment is no different than trusting a critic or a friend's recommendation. The opposing view argues that aesthetic judgment is not data transfer; a colleague's summary cannot transmit the specific emotional or intellectual impact a story has on a reader.

  **This panel adopts the latter position for the final stages of judgment.**

  While we can trust our colleagues' competence in filtering out weak work, a literary prize does not reward "competence" or "technical adherence" alone; it rewards *effect*. A score of 9/10 from a colleague tells us a story worked for *them*, but it does not allow the rest of us to weigh how it might work for us, or how it compares to other 9s we have felt personally. To rank a story we haven't read is to judge the judge, not the art.

  Therefore, while we will utilize secondhand reports to manage the volume of submissions, we will not utilize them to finalize rankings. We can use secondhand data to eliminate, but we cannot use it to elevate.

  **The Protocol**
  To honor this principle while meeting our deadline, we will implement a two-stage process effective immediately.

  **Stage 1: Triage and Longlist (Weeks 1–4)**
  *   **Assignment:** Each submission is read by two judges.
  *   **Output:** Those two judges submit a score (1–10) and a 150-word justification.
  *   **Function:** These scores are used *only* to create a "Longlist" of contention.
  *   **Threshold:** Any story with an average score of 8.0 or higher, or any story where one judge scores a 10 (regardless of the second score), moves to Stage 2.
  *   **Elimination:** Stories averaging below 6.0 are eliminated. Stories between 6.0 and 7.9 are held in reserve should the Longlist be too small.

  **Stage 2: Full Panel Review (Weeks 5–6)**
  *   **Requirement:** Every story on the Longlist must be read by **all five judges**.
  *   **Redistribution:** The coordinator will immediately distribute the Longlist files to the three judges who have not yet read them.
  *   **Discussion:** We will convene for a final meeting (virtual or in-person) only after all five judges have read all Longlist stories.
  *   **Selection:** The Shortlist (e.g., top 5) and the Winner will be selected exclusively from this pool. No story can be shortlisted or win unless every judge has read it firsthand.

  **Contingency for Volume**
  If the Stage 1 threshold results in more than 15 stories (which would be too many for 5 people to read deeply in 2 weeks), we will apply a secondary filter:
  1.  Stories with a 10 from *both* initial readers are auto-advanced.
  2.  Remaining slots are filled by highest averages.
  3.  In the event of a tie for the final Longlist slot, the story with the more compelling written justification advances, but it *still* requires a full panel read before it can be shortlisted.

  **Transparency and Public Facing Language**
  If asked by submitters or the public how the work was judged, we will state:
  *"Submissions undergo a double-blind review by two initial readers. Top-scoring work advances to a full panel review, where every finalist is read by every judge before the final shortlist and winner are determined."*
  This is accurate and maintains the integrity of the prize.

  **Next Steps**
  1.  **Coordinator:** Please identify all stories meeting the Stage 1 threshold by [Date, 4 days from now].
  2.  **Judges:** If you have not yet submitted your scores/write-ups for your assigned batch, please do so by [Date].
  3.  **All:** Once the Longlist is circulated, we have 10 days to complete our reads before the final deliberation meeting.

  **Closing**
  This compromise acknowledges the coordinator's need for efficiency in the early rounds while upholding the dissenting judges' insistence that final aesthetic arbitration requires direct experience. It ensures that when we sign our names to a winner, we are all signing off on work we have personally encountered, not work we have been told about.

  Please reply all by tomorrow morning to confirm you can work within this protocol.

  Thank you for your rigor and your care for these writers.

  [Your Name]
