answer: |-
  The charred skeleton of the warehouse stood against a grey sky, smelling of wet ash and melted plastic. Elias Vance stepped over a beam, his clipboard heavy in his hand. He was an insurance adjuster, tasked with finding the single thing that had turned this building into a loss of four million dollars.

  The official report said fire. But fire needed fuel, oxygen, and heat. Those were present. What was missing was the prevention.

  The night watchman, Mr. Henderson, had been asleep in his booth. That was the first omission. If Henderson had done his rounds at 2:00 AM, he would have smelled the smoke. He would have called it in. The sprinklers would have engaged before the flames took the roof. Henderson's stillness was a cause of the destruction.

  Elias wrote *Watchman Negligence* in the margin. But he paused. Henderson slept because the shift was sixteen hours long, mandated by the facility manager, Mrs. Gable, to cut costs. If Gable had scheduled a second guard, Henderson would have been awake. Her decision not to act was also a cause.

  Elias walked to the perimeter. The fire alarm system had been offline for three weeks. A work order sat in the maintenance manager's inbox, unopened. If the manager had clicked *Approve*, the sensors would have screamed. That inaction was a cause.

  He looked past the fence. Across the street, a resident, Mr. Aris, had seen the glow at 2:15 AM. He had assumed it was a controlled burn from the incinerator plant downriver. He went back to sleep. If Aris had called 911, the fire department would have arrived four minutes earlier. Four minutes would have saved the east wing. Aris's silence was a cause.

  Elias felt the list expanding, like a stain spreading on cloth. The fire chief hadn't pre-positioned engines in this sector due to budget reallocations. The city council hadn't funded the hydrant upgrade. The architect hadn't designed a fire break. The manufacturer of the wiring hadn't insulated the copper sufficiently.

  And then, the thought arrived unbidden: *I could have caused this.*

  Elias had inspected this policy six months ago. He had skimmed the safety compliance section. If he had dug deeper, if he had demanded a full audit, the maintenance backlog would have been flagged. The manager would have been forced to act. Henderson would have had a shorter shift. The alarm would have worked.

  Elias's failure to look was a cause.

  He stood in the rain, the clipboard getting wet. The logic was seamless. Every event has necessary conditions. Every omission where an action could have prevented the outcome is a necessary condition. Therefore, everyone who did not save the warehouse caused its destruction. The causal net encompassed the watchman, the manager, the neighbor, the city, the manufacturer, and Elias himself. It encompassed anyone who knew how to dial 911 and didn't.

  If causation was purely counterfactual—if *but-for* X not happening, Y would not have occurred—then there was no such thing as a specific cause. There was only the state of the universe failing to prevent the event.

  Elias returned to his car and sat in the driver's seat. The wipers thumped rhythmically. He opened the claim file. Box 14: *Proximate Cause of Loss.*

  He had to write one thing. The policy required it. The payout depended on it. If he wrote *Universal Entropy*, the claim would be denied. If he wrote *Watchman Negligence*, the bond would cover it. If he wrote *Maintenance Failure*, it might be excluded due to wear and tear.

  He looked at the stack of documents. The physics of the fire didn't care about Box 14. The chemistry of the combustion was identical regardless of who filled out the form. The physical world offered no hierarchy among the omissions. Henderson's sleep was physically identical to Aris's silence in terms of causal weight; both were absences of intervention that allowed the fire to continue.

  But the contract was different. The contract was not a map of physics. It was a map of duties.

  Elias picked up the policy document. He turned to the definitions page. *Insured.* *Exclusions.* *Duties in Event of Loss.*

  He ran his finger down the list of obligations. The watchman was an employee of the insured. The maintenance manager was an employee of the insured. Mr. Aris, the neighbor, was not. The city council was not. Elias, the adjuster, was an agent of the insurer, not the insured.

  The infinite regress of causality stopped where the signatures stopped.

  The physical world said everyone was responsible. The contract said only the signatories were responsible. The distinction wasn't in the smoke or the heat. It wasn't in the chain of events. It was in the ink.

  Elias realized then that the question "What caused this?" was a trap. It pretended to be a question about the mechanics of the world, like asking what broke the engine. But in human affairs, "cause" was a shorthand for "who breached a duty?" There was no such thing as legal causation without normative obligation. To call something a cause was to assign a blame that someone had agreed to bear.

  If he treated causation as a physical fact, he would never finish the report. The chain went back to the Big Bang. If he treated it as a normative boundary, the work could be done.

  He uncapped his pen. He thought about Henderson, sleeping in the booth. He thought about Aris, sleeping in his house. Physically, they were identical. Normatively, they were opposites. One was paid to wake; the other was not.

  Elias wrote *Failure of Security Personnel* in Box 14.

  It wasn't the whole truth. The maintenance manager was equally culpable. The city was partially liable. But the security personnel were the point where the duty converged most tightly within the scope of the policy. It was the cleanest cut through the web.

  He closed the clipboard. The rain hammered the roof, a chaotic noise of infinite drops hitting metal. Each drop was a cause of the wetness. But only the ones funneled into the gutter were responsible for the flow.

  Elias started the engine. He hadn't solved the puzzle of the universe. He had simply enforced the boundary of the contract. He put the car in gear and drove away from the ashes, leaving the rest of the causes behind him.
