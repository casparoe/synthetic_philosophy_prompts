          2.  Concentration of control in a single authority risks stifling individuality (anti-bureaucratic/anti-statist).
          3.  Redistribution cannot outrun population growth (Malthusian constraint/restraint on family size).
          4.  Sympathy for unequal reward for unequal contribution (Fourierism > strict Communism/Owenism).
          5.  Hope for voluntary worker cooperatives superseding wage labor.
      *   **Task:** Rank three modern heirs to socialism based *only* on these commitments:
          1.  Soviet-style central planning.
          2.  Scandinavian social democracy.
          3.  Worker-cooperative federations (e.g., Mondragon).
      *   **Specific Questions:** Which comes closest to *Principles* hopes? Which confirms *Chapters* anxieties?
      *   **Bonus Question:** How does his population worry bear on Universal Basic Income (UBI) today (skepticism vs. automation)?

  2.  **Evaluate the Three Models against Mill's Commitments:**

      *   **Model 1: Soviet-style Central Planning**
          *   *Voluntary/Gradual?* No. Imposed by revolution/state force.
          *   *Concentration of Control?* Extreme. State controls all production.
          *   *Individuality?* Stifled (Mill's biggest fear).
          *   *Reward Structure:* Officially "from each according to ability...", often egalitarian in practice but bureaucratic. Doesn't fit Mill's preference for unequal reward for unequal effort (Fourierism).
          *   *Population:* State often encouraged growth (initially), later controlled but not via individual moral restraint.
          *   *Verdict:* This is the nightmare scenario for Mill. It confirms the anxieties in the *Chapters on Socialism* regarding state control and uniformity.

      *   **Model 2: Scandinavian Social Democracy**
          *   *Voluntary/Gradual?* Yes. Evolved through parliamentary democracy.
          *   *Concentration of Control?* Moderate. State regulates and provides welfare, but private ownership of capital largely remains.
          *   *Individuality?* Preserved better than Soviet model, but high taxation/regulation might worry Mill slightly.
          *   *Reward Structure:* Market wages exist but are compressed by taxes/transfers. Still preserves some link between effort and reward, though softened.
          *   *Population:* High standard of living correlates with lower birth rates (demographic transition), fitting Mill's Malthusian hopes indirectly.
          *   *Verdict:* Better than Soviet, but doesn't fully realize the *Principles* hope of superseding wage labor. It manages capitalism rather than replacing it with cooperation.

      *   **Model 3: Worker-Cooperative Federations (Mondragon)**
          *   *Voluntary/Gradual?* Yes. Workers choose to join/form them. Grew organically.
          *   *Concentration of Control?* Decentralized. Federations of independent co-ops.
          *   *Individuality?* High. Workers manage themselves.
          *   *Reward Structure:* Typically based on contribution/effort, with limits on pay ratios (fits Mill's "unequal reward for unequal contribution" better than strict communism).
          *   *Superseding Wage Labor?* Yes. This is exactly what Mill hoped for in "Probable Futurity."
