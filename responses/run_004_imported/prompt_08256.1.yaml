          *   *Refinement:* Stick to the textually grounded commitments. 1. Effort/Reward link. 2. Population. 3. Individuality. UBI weakens #1. If population is controlled (#2), maybe okay. But #1 is strong in Mill (Fourierism). He prefers co-ops (profit sharing) over handouts. So, likely skeptical of UBI compared to co-ops.

