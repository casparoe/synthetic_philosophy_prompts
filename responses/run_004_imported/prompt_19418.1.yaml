      *   **Topic:** The semantics/pragmatics of slurs (specifically, why their derogatory force survives embedding).
      *   **Debate Context:** The user (pro-Hom/combinatorial externalism/truth-conditional) vs. their friend (pro-non-at-issue/conventional implicature or presupposition).
      *   **Task:** Argue *for* the friend's side (non-at-issue content: CI or Presupposition).
      *   **Key Challenges to Address:**
          1.  Projection data (why the offense survives embedding).
          2.  Reclamation data (how in-group use sheds derogatory force without becoming a totally different word).
          3.  The user's objection (that truth-conditional views make bigoted sentences "true" if the descriptive core holds, conceding too much to bigotry).
      *   **Goal:** Make the *strongest case* for the non-at-issue view, showing it handles the data better than Hom-style views.

  2.  **Deconstruct the Positions:**
      *   **Hom-Style (Combinatorial Externalism):** The slur refers to a complex property (e.g., *being German and worthy of derogation because of being German*). If nothing has that property (because no one is worthy of derogation), the extension is empty. Sentences using slurs are strictly false (or truth-valueless).
          *   *Pros:* Avoids making bigoted sentences true.
          *   *Cons:* Struggles with embedding (if the extension is empty, conditionals involving slurs get weird), struggles with reclamation (how does the property change?), struggles with disagreement (if I say "He isn't a [slur]," am I denying the descriptive content or the evaluation?).
      *   **Non-At-Issue (CI/Presupposition):** The slur has a neutral descriptive content (at-issue) + a derogatory evaluation (not-at-issue).
          *   *Pros:* Explains projection naturally (CIs/Presuppositions project), explains reclamation (turning off the CI), explains disagreement.
          *   *Cons:* The user's objection (makes "Hans is a [slur]" *true* if Hans is German, seemingly validating the slur).

  3.  **Brainstorming Arguments for the Non-At-Issue View:**

      *   *Argument 1: Projection is the Smoking Gun.* The strongest linguistic evidence is that slurs behave exactly like other expressive items (e.g., "damn," "alas," "even") which are standardly treated as CIs. If I say, "If that damn dog barks, I'll wake up," the dog isn't necessarily "damn" in the antecedent, but the attitude is present. Slurs do this too. Hom's view has to do heavy lifting to explain why empty reference projects offense.
      *   *Argument 2: The "Truth" Objection is a Misunderstanding.* The user worries that saying "Hans is a Boche" is *true* (if Hans is German) validates the bigotry. But we can distinguish *semantic truth conditions* from *appropriateness conditions*. We can say the sentence is semantically true (descriptively) but pragmatically toxic/forbidden. We don't need to falsify the sentence to condemn the word.
      *   *Argument 3: Reclamation is Easier on this View.* If the derogatory content is a separate layer (CI), reclamation is just the process of detaching that layer within a specific community. On Hom's view, the property *itself* changes. But properties are external and fixed. How does a social group change an externally fixed property? It's easier to say they change the *convention of use* (the CI) than the *reference* (the truth conditions).
      *   *Argument 4: Disagreement and Denial.* If I say "He is not a [slur]," on Hom's view, I might be saying he doesn't have the neutral property (he's not German). But often I mean "He is German, but that word is inappropriate." The non-at-issue view captures this: I deny the appropriacy/CI, not necessarily the descriptive content.
      *   *Argument 5: Cognitive Load and Processing.* Speakers process the descriptive content and the expressive content differently. Neuropragmatics suggests different brain regions handle at-issue vs. not-at-issue content.

  4.  **Structuring the Argument:**
      *   **Introduction:** Acknowledge the moral weight (validate the user's concern) but state the linguistic thesis: Non-at-issue content explains the *behavior* of the word better without sacrificing moral condemnation.
      *   **Point 1: The Projection Data (The Linguistic Core).** Show how slurs pattern with expressives ("damn," "bastard") which are classic CIs. Hom's view makes embedding awkward (the "Frege-Geach" problem for expressivism/truth-conditional slur views).
      *   **Point 2: Reclamation (The Social Core).** Explain reclamation as "semantic bleaching" of the CI, not reference shifting. This preserves lexical continuity. Hom's view implies a homonym, which doesn't fit intuition.
      *   **Point 3: Addressing the "Truth" Objection (The Moral Core).** Distinguish between *truth* and *assertibility*. We can condemn the word as unusable without claiming sentences containing it are false. In fact, calling them false might let bigots off the hook ("Oh, I was just speaking truthfully").
