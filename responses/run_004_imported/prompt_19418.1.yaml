answer: |-
  This is a profound disagreement that cuts to the heart of how language interfaces with ethics. Your concern is morally intuitive: if we say "Hans is a Boche" is *true* (provided Hans is German), it feels as though we are validating the bigoted category the slur creates. You want the semantics to block the truth of the sentence to block the legitimacy of the prejudice.

  However, I argue that your friend's position—treating the derogatory force as **non-at-issue content** (specifically, a Conventional Implicature or CI)—is linguistically superior. It offers a more robust explanation of the projection data, a more plausible mechanism for reclamation, and, crucially, it does not actually concede moral ground to the bigot. In fact, it provides better tools for condemning the speech act without distorting the logic of the sentence.

  Here is the case for the non-at-issue view.

  ### 1. The Projection Data is the "Smoking Gun"
  The strongest linguistic evidence favors the non-at-issue view. As you noted, the derogatory force of a slur survives embedding under negation, conditionals, and questions.
  *   *"If Hans is a Boche, he will be difficult to work with."*
  *   *"Hans is not a Boche."*
  *   *"Is Hans a Boche?"*

  In all three cases, the speaker conveys hostility toward Germans, even though they haven't asserted that Hans *is* German. This is the classic behavior of **Conventional Implicatures** (like *but*, *therefore*, or expressives like *damn*). If I say, "That damn dog barked," the proposition that the dog barked is at-issue; the attitude that the dog is "damn" is not. If I say, "If that damn dog barks, I'll wake up," I haven't asserted the dog is damn, but the attitude projects.

  **The Problem for Hom-Style Views:**
  On Hom's Combinatorial Externalism, the slur refers to a complex, socially constructed property (e.g., *being German and worthy of derogation*). Since nothing is worthy of derogation, the extension is empty. Atomic sentences are false.
  But consider the conditional: *"If Hans is a [slur], then he is German."*
  On Hom's view, the antecedent is false (empty extension). In classical logic, a conditional with a false antecedent is vacuously **true**. Yet, uttering this sentence is still deeply offensive. The derogatory force persists even when the truth-conditional machinery renders the sentence vacuously true.
  Hom has to posit complex pragmatic mechanisms to explain why the "offense" survives when the truth-conditions are inert. The non-at-issue view explains this effortlessly: the offense is carried on a separate semantic tier that is designed to project. It behaves exactly like other expressive content because it *is* expressive content.

  ### 2. Reclamation is Lexical Continuity, Not Reference Shift
  You both noted the difficulty of explaining reclamation (in-group use).
  *   **Hom's View:** For a reclaimed slur to lose its sting, the property it refers to must change. The word must essentially become a homonym. The in-group [slur] refers to *Property A* (neutral/solidarity), while the out-group [slur] refers to *Property B* (derogatory).
  *   **Non-At-Issue View:** The word retains the same reference (the neutral descriptive core) but the **convention of use** changes.

  The non-at-issue view captures the intuition that the reclaimed word is the *same word*, just stripped of its toxic convention. Reclamation is a social process of severing the link between the descriptive content and the expressive CI.
  If we treat the derogatory content as a CI, we can model reclamation as the community agreeing to "turn off" that specific implicature for certain speakers. This explains why an out-group member using the reclaimed term is still offensive: they are invoking a CI that the in-group has suspended for themselves. On Hom's view, it is harder to explain why the out-group usage is offensive if the word simply refers to a neutral property in that context; you'd have to say they are referring to a different property entirely, which makes the disagreement look like a mere equivocation rather than a normative clash.

  ### 3. Addressing the "Truth" Objection: Truth vs. Assertibility
  Your primary objection is moral: *"This still lets a sentence like 'Hans is a Boche' come out true... which seems to concede far too much to the bigoted practice."*

  This relies on the assumption that to condemn a statement, we must declare it **false**. But we can condemn it as **unassertible**.
  On the non-at-issue view, "Hans is a Boche" has the same truth conditions as "Hans is German." If Hans is German, the sentence is true. **However**, the sentence carries a Conventional Implicature that expresses a hateful ideology.
  *   **Truth:** Determined by the world (Is Hans German?).
  *   **Appropriateness:** Determined by the convention (Is it permissible to express this hatred?).

  By separating these, we actually gain moral precision. If we follow Hom and say the sentence is *false*, we risk a strange conversation:
  *   *Bigot:* "Hans is a [slur]."
  *   *Us:* "That's false."
  *   *Bigot:* "Why? He is German."
  *   *Us:* "Yes, but the property of being [slur] doesn't exist."

  This allows the bigot to claim they are "morally right" even if "semantically wrong." They can say, "I am capturing the truth about these people, even if your liberal semantics blocks the word."

  By contrast, the non-at-issue view allows us to say: "The sentence is descriptively accurate, but **toxic**." It forces us to admit that the descriptive fact (Hans is German) is not the problem; the problem is the *expression of contempt*. It shifts the debate from metaphysics (do these properties exist?) to ethics (are we allowed to express this attitude?). This concedes nothing to the bigot; it simply locates the harm in the **act of speaking** rather than the **truth of the proposition**. We ban the word not because it lies, but because it wounds.

  ### 4. Disagreement and Denial
  The non-at-issue view handles disagreement better. Consider:
  *   *Speaker A:* "Hans is a [slur]."
  *   *Speaker B:* "No, he isn't."

  On Hom's view, Speaker B is denying that Hans possesses the complex derogatory property. Since no one possesses that property, Speaker B is trivially right, but it's unclear if they are denying Hans's ethnicity or the evaluation.
  On the non-at-issue view, Speaker B can be understood as objecting to the **appropriateness** of the CI. "No, he isn't [and you shouldn't call him that]." The non-at-issue framework allows for **metalinguistic negotiation**. We can understand Speaker B as rejecting the *norm* encoded in the word, not just the facts. This aligns with how we actually experience arguments about slurs: we aren't arguing about whether the person fits a category; we are arguing about whether that category is permissible to invoke.

  ### Conclusion
  Your Hom-style view is motivated by a desire to make the semantics do moral work—to make bigoted sentences false so that bigotry is factually incorrect. But semantics is a descriptive tool, not a normative shield.

  The non-at-issue view (Conventional Implicature) is superior because:
  1.  **Linguistically:** It explains projection naturally without vacuous truth conditions.
  2.  **Socially:** It explains reclamation as a change in convention rather than a shift in reference.
  3.  **Morally:** It locates the harm in the *expression* of hatred (which we can forbid) rather than the *truth* of the description (which we cannot change).

  We do not need to make the sentence false to condemn it. We only need to recognize that some truths are too poisonous to speak. The non-at-issue view gives us the vocabulary to say exactly that.
