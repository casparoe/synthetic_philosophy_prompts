  8.  *(Self-Correction during drafting)*: Make sure to distinguish between CI and Presupposition. CI is probably stronger here because presuppositions usually require the common ground to accept them, whereas slurs force the attitude even if the hearer rejects it. I will lean towards Conventional Implicature (Potts-style) as the primary vehicle, as it handles the "independence" of the content better.

  9.  **Final Polish:** Ensure tone is respectful but persuasive, acknowledging the moral stakes while prioritizing linguistic explanatory power. (Proceed to generate output).

  *(Wait, one more thought)*: I should explicitly mention that Hom's view leads to *falsehood* for all atomic slur sentences. This creates a problem for conditionals. "If he is a [slur], he will be treated badly." If the antecedent is always false (empty extension), the conditional is vacuously true. But the offense remains. Non-at-issue handles this: the offense projects, the truth value depends on the neutral core. This is a strong technical point.

