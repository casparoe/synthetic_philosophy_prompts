answer: |-
  1. **The Demon's Condition and the Source of Reasons**
  In my novel, the demon's demand is specific: the admiration must be *sincere*. He isn't satisfied with mere lip service; the villagers must actually feel the pro-attitude to save themselves. If a villager successfully cultivates genuine admiration solely to avoid the plague, does the pragmatic, state-given reason eventually transform into an object-given one simply by virtue of producing the correct attitude? Or does the causal history of that admiration permanently disqualify it as fitting, regardless of how sincere it feels?

  *   **Follow-up:** She will likely argue that the *source* of the reason remains state-given even if the attitude is sincere. If so, ask: "Does this imply that fittingness is entirely independent of the psychological reality of the agent? If two people feel identical admiration, but one is motivated by the demon's threat and the other by the demon's wit, is the *fittingness* of their attitudes actually different, or just the moral worth of the agent?"

  2. **The Redescription Worry**
  Critics of the buck-passing account often argue that the line between object-given and state-given reasons is porous. They suggest we can simply redescribe the demon's threat as a relational property of the demon: he possesses the property of 'being such that admiring him averts disaster.' If that is a property of the object, why doesn't it count as an object-given reason to admire him, thereby collapsing your distinction?

  *   **Follow-up:** She will likely respond by excluding normative properties from the count of relevant object-properties to avoid circularity. If so, ask: "But isn't that exclusion ad hoc? How do we identify which properties are 'reason-providing' without already presupposing the very notion of fittingness you're trying to analyze?"

  3. **Generalization to Non-Evaluative Attitudes**
  Your defense focuses heavily on value and admiration, but fitting-attitude accounts are often applied to emotions like fear or reactive attitudes like blame. If a tyrant threatens to punish anyone who *doesn't* blame him for his crimes, does your distinction hold there? Is there a 'wrong kind of reason' for fear or blame, or does the pragmatic stakes of physical safety make the distinction blurrier in those cases?

  *   **Follow-up:** She will likely maintain that fear is only fitting if the object is dangerous, regardless of the threat. If so, ask: "But if the only danger present *is* the threat contingent on the fear itself, doesn't that create a loop where the state-given reason is the only reason available? Does your account allow for cases where the 'fitting' attitude is practically impossible to access?"

  4. **Falsifiability and Theoretical Cost**
  Philosophical distinctions often survive by becoming increasingly refined. What specific kind of case or intuition pump would actually persuade you that the object-given/state-given distinction has failed? Is there a scenario where the cost of maintaining the distinction becomes higher than the cost of abandoning it?

  *   **Follow-up:** She will likely suggest that the distinction is a conceptual truth rather than an empirical hypothesis. If so, ask: "If it's a conceptual truth, does that insulate it from real-world counterexamples? At what point does protecting the concept make it useless for explaining actual human deliberation?"

  5. **Doxastic Voluntarism and Cultivation**
  Your account assumes we can distinguish between reasons for having an attitude and reasons for bringing it about. But in my book, the villagers have to *work* to admire the demon. We often cultivate emotions over time for pragmatic reasons—like forcing ourselves to respect a colleague to keep a team functional. Does your account treat these long-term cultivated attitudes as fitting once established, or are they permanently tainted by their pragmatic origins?

  *   **Follow-up:** She will likely distinguish between direct and indirect control over attitudes. If so, ask: "If we can indirectly bring about fitting attitudes through pragmatic means, doesn't that make the state-given reasons instrumentally vital to achieving object-given fittingness? Why privilege the end state over the mechanism that got us there?"

  6. **Value vs. Good Outcomes**
  If the villagers succeed and the demon lifts the plague, he has undeniably produced a good outcome. Under a buck-passing account, is the demon now 'valuable' because there are reasons to have pro-attitudes toward him (gratitude, perhaps), or does the initial wrong-kind demand permanently stain his value status? Can an agent be the source of value without themselves being valuable?

  *   **Follow-up:** She will likely separate the value of the *outcome* from the value of the *agent*. If so, ask: "In practical ethics, we often treat agents who produce good as worthy of praise. If your theory says we shouldn't admire this demon despite the saved lives, does it risk divorcing value theory from our actual moral practices?"

  7. **The Phenomenology of Fittingness**
  For the villagers, the admiration has to feel real. From the inside, does admiration driven by a state-given reason *feel* different than admiration driven by an object-given reason? If the phenomenology is identical, is the distinction merely a theoretical construct for philosophers, or is it something agents can detect in the moment?

  *   **Follow-up:** She will likely argue that phenomenology is unreliable for determining normative facts. If so, ask: "If agents can't detect the difference, what work is the distinction doing for them? Is fittingness a property that exists entirely outside the perspective of the valuer?"

  8. **Practical Implications for the Audience**
  Finally, for an audience navigating a world full of 'demons'—advertisers, politicians, or algorithms designed to hack our attitudes—what is the practical utility of this distinction? Does recognizing a reason as 'state-given' actually help us resist manipulation, or is it merely a way to categorize our attitudes after the fact?

  *   **Follow-up:** She will likely argue it helps clarify what is truly worthy of our attention. If so, ask: "But if the stakes are high enough—like a plague, or climate change, or political instability—does the 'fitting' attitude matter as much as the 'effective' one? Can we afford the luxury of this distinction in a crisis?"
