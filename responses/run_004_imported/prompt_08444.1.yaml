  2.  **Deconstruct the Philosophical Concepts:**
      *   **Fitting-Attitude (FA) Account:** X is valuable iff it is fitting to have a pro-attitude toward X.
      *   **Wrong-Kind-of-Reasons (WKR) Problem:** The demon case. You have a reason to admire the demon (to avoid plague), but that doesn't make the demon *admirable*. The reason is the wrong kind.
      *   **Object-Given vs. State-Given:**
          *   *Object-Given:* Reasons grounded in the properties of the object (e.g., the demon is kind). These make the attitude fitting.
          *   *State-Given:* Reasons grounded in the benefits of having the attitude (e.g., admiring him saves the village). These do *not* make the attitude fitting.
      *   **The Tension:** The distinction is notoriously hard to draw sharply. Critics argue you can always redescribe state-given reasons as object-given properties (e.g., "the property of being such that admiring it saves the village").

