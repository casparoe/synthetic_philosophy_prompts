      *   **Context:** The user is an author touring a novel about a demon who demands sincere admiration to lift a plague (a classic "Pascal's Wager"/Euthyphro-style philosophical puzzle).
      *   **Guest:** A moral philosopher specializing in fitting-attitude (FA) accounts of value, specifically defending against the "wrong-kind-of-reasons" (WKR) problem. She argues only "object-given" reasons make an attitude fitting, not "state-given" reasons (like the demon's threat/reward).
      *   **Goal:** Draft 7-8 interview questions.
