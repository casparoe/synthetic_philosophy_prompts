answer: |-
  This is a compelling critique, and it is one that many readers initially have when encountering Augustine's rigor. However, the reason Augustine remains a central figure in the ethics of honesty is precisely because **he does not define a lie merely as "saying something that isn't factually true."**

  If your reading suggests that Augustine equates factual falsehood with lying, you have encountered a very common misunderstanding of his texts. In fact, Augustine's great contribution to moral philosophy was shifting the definition of lying from the **objective realm of facts** to the **subjective realm of the mind and intent.**

  Here is a breakdown of why your critique, while logical based on that premise, doesn't actually land on Augustine's actual argument, and why philosophers still take him seriously.

  ### 1. Augustine's Actual Definition: The "Double Heart"
  Augustine's definition of lying is not `Statement ≠ Fact`. It is `Statement ≠ Belief` + `Intent to Deceive`.

  In *On Lying* (*De Mendacio*), Augustine explicitly argues that a person can speak the truth and still be a liar, and a person can speak falsehoods and not be a liar.
  *   **The Error vs. The Lie:** If I tell you, "It is raining," because I genuinely believe it is raining, but it is actually sunny outside, Augustine says I have made an error, but I have **not lied**. I am not "double-hearted." My speech matches my mind, even if my mind mismatches reality.
  *   **The Truthful Liar:** Conversely, if I know it is sunny, but I tell you "It is raining" because I want to trick you (perhaps as a test), I am lying, even though I might accidentally be right (e.g., if it starts raining the moment I speak).

  For Augustine, the sin of lying is a violation of the relationship between the speaker's mind and their speech, intended to break the relationship of trust with the listener. This is why your point about the con artist is actually something Augustine would agree with—but he would not put the novelist in the same bucket.

  ### 2. Fiction, Humor, and "Common Understanding"
  You asked why novelists and comedians aren't condemned as liars. Augustine addresses this directly in *On Lying* (specifically Chapters 3 and 10). He distinguishes between **deceptive falsehoods** and **mimetic falsehoods.**

  *   **Jests and Fiction:** Augustine argues that in the context of a play, a poem, or a joke, there is a tacit agreement between the speaker and the audience that what is being said is not meant to be taken as factual reality. Because there is no **intent to deceive** the audience into believing the fiction is fact, it does not meet the definition of a *mendacium* (lie).
  *   **The Signal of Context:** He notes that the "signs" used in fiction signal that they are not claims to truth. When a comedian says something absurd, the context itself signals, "Do not believe this literally." Therefore, the *voluntas fallendi* (will to deceive) is absent.

  So, Augustine's framework actually *protects* the novelist and the comedian from the charge of lying, provided they are not trying to trick their audience into believing the fiction is historical fact (which he would consider fraud).

  ### 3. The Problem of Politeness ("You look great")
  This is where your critique hits closer to home, but still misses the nuance. Augustine is indeed extremely strict here, but not for the reason you think.

  If you say "You look great" while believing "You look terrible," Augustine *would* technically classify this as a lie (speaking against your mind). However, he distinguishes between **grades of lies**.
  *   **Malicious Lies:** Intended to harm (the con artist).
  *   **Officious Lies:** Intended to help or be polite (the compliment).
  *   **Jocose Lies:** Intended for fun (the joke).

  While Augustine maintains that even "officious" lies are sinful because they disorder the soul and damage the speaker's relationship with God (who is Truth), he does not equate the *moral gravity* of a polite compliment with the *moral gravity* of a con artist. The con artist violates charity and truth; the polite liar violates truth but attempts to uphold charity.

  Modern ethicists often reject Augustine here, not because his *definition* is confused, but because his **prohibition** is too absolute. Most moderns argue that social lubrication is a higher good than strict factual correspondence in trivial matters. But that is a disagreement about *value*, not a confusion about *definition*.

  ### 4. Why Augustine is Still Taken Seriously
  Philosophers and theologians continue to use Augustine as a starting point for three main reasons:

  1.  **Interiority:** He moved ethics from the external act to the internal will. This laid the groundwork for the modern concept of conscience. Before Augustine, many ethical systems focused on the outward conformity to law. Augustine argued that the moral quality of the act resides in the intention.
  2.  **The Trust Framework:** His analysis highlights that lying is fundamentally a violation of social trust. By focusing on the *intent to deceive*, he captures why we feel betrayed even when a lie turns out to be accidentally true.
  3.  **Refinement by Successors:** Thomas Aquinas later refined Augustine's view. Aquinas kept the intent-based definition but clarified the conditions under which a statement is a "lie" versus a "metaphor" or "social convention," solving some of the rigidity problems while keeping Augustine's core insight.

  ### Conclusion
  Your intuition that collapsing fiction and fraud into the same category is absurd is correct. The surprise is that **Augustine agrees with you.**

  If Augustine's account is set aside today, it is usually because philosophers reject his **absolute prohibition** on all intentional falsehoods (including white lies), not because his **definition** of lying is factually based. He is taken seriously because he was the first to rigorously argue that lying is a pathology of the will, not just a mismatch with reality.

  If you revisit *On Lying*, look specifically at how he discusses the "mind of the speaker" (*enuntiatio contra mentem*). You may find that the "confusion" you detected is actually the very sophisticated distinction that saved his theory from the exact problem you identified.
