answer: |-
  You have hit on one of the most common and understandable points of confusion in modern philosophical logic. Your intuition isn't "wrong" in the sense that the two concepts are deeply intertwined, but your professor is technically correct: **paraconsistency is a formal property, while dialetheism is a metaphysical thesis.**

  The "daylight" you are looking for lies in the difference between **ontology** (what is true in the world) and **epistemology/information theory** (what we believe, know, or have recorded).

  Here is the breakdown of why you can be a paraconsistent logician without being a dialetheist, and why your CS roommate isn't secretly a metaphysical radical.

  ### 1. The Formal Distinction
  *   **Paraconsistent Logic:** This is a claim about a **consequence relation**. A logic is paraconsistent if its consequence relation ($\vdash$) is not explosive. That is, $\{A, \neg A\} \nvdash B$. It simply means the system is *robust* against inconsistency.
  *   **Dialetheism:** This is a claim about **truth**. It is the view that there exist sentences $A$ such that $(A \land \neg A)$ is *true*.

  **The Crucial Gap:** You can adopt a paraconsistent logic to *model* inconsistent situations without believing those situations are *true*.

  Think of it like non-Euclidean geometry. Mathematicians developed geometries where parallel lines *do* meet. Does using that geometry commit you to the metaphysical claim that physical space is curved? No. You might just be studying the formal properties of that system, or applying it to a specific domain (like a globe) where it fits, while believing "straight" space is Euclidean.

  Similarly, you can use paraconsistent logic to handle inconsistent *information* without believing the *world* is inconsistent.

  ### 2. The Motivations for Paraconsistency (Without Dialetheism)
  If dialetheism isn't the only reason to reject explosion, what are the others?

  **A. Epistemic/Informational Inconsistency (The CS Case)**
  This is exactly what your roommate is dealing with. In AI and database theory, a system often aggregates data from multiple sources.
  *   Source 1 says: `Sensor_X = ON`
  *   Source 2 says: `Sensor_X = OFF`

  A classical logic database would crash (explode) and infer `The_Building_Is_Made_Of_Cheese`. A paraconsistent database says, "Okay, I have conflicting reports. I will flag this as inconsistent, but I will still let you query the parts of the database that *aren't* contradictory."

  The engineer is **not** claiming the sensor is metaphysically both ON and OFF. They are claiming their *information state* is inconsistent. They are using paraconsistent logic as a tool for **inconsistency management**, not truth discovery. This view is sometimes called **epistemic paraconsistency**.

  **B. Fictionalism and Instrumentalism**
  Many logicians (most notably the Brazilian logician **Newton da Costa**, one of the founders of paraconsistency) were not dialetheists. Da Costa believed contradictions were never true in reality.
  However, he recognized that humans often reason with inconsistent theories that are still useful (e.g., early calculus, Bohr's model of the atom, or naive set theory).
  *   **The View:** "Naive Set Theory is inconsistent, but it's useful. I want a logic that allows me to reason *within* Naive Set Theory without everything becoming trivial, even though I know the theory itself isn't ultimately 'true'."
  *   This is an instrumentalist view: The logic tolerates the contradiction because the *theory* contains one, not because reality does.

  **C. Relevance**
  Some logics (like Relevance Logic) are paraconsistent, but their primary motivation isn't contradictions at all. Their motivation is that the premises must be *relevant* to the conclusion.
  *   In classical logic, $A \to (B \to A)$ is a tautology. Relevance logicians hate this.
  *   It turns out that if you demand relevance, you often lose Explosion. So, they end up with a paraconsistent logic, but their motivation was **connection/meaning**, not true contradictions.

  ### 3. Why the Confusion Exists
  You aren't crazy for thinking they are the same. The most famous proponent of paraconsistent logic, **Graham Priest**, is also the most famous proponent of dialetheism.
  *   Priest argues: "If you have a paraconsistent logic, you should be honest and admit that the contradictions you are tolerating are actually *true* (e.g., the Liar Paradox)."
  *   He argues that non-dialetheic paraconsistency is unstable.

  Because Priest is such a dominant figure in the field, the two terms often get conflated in seminars. But historically and technically, they are distinct. There are plenty of "quiet" paraconsistent logicians who view contradictions as errors in human cognition or data, not features of reality.

  ### 4. Summary for Your Seminar
  To answer your specific worries:

  1.  **Is there daylight?** Yes. Paraconsistency is about **inference**; Dialetheism is about **truth**.
  2.  **Why design a logic that tolerates contradictions?** To model **belief revision**, **database management**, and **inconsistent scientific theories** without committing to the claim that the world itself is contradictory.
  3.  **Are the CS engineers dialetheists?** Absolutely not. They are **pragmatists**. They treat contradictions as "errors to be contained" rather than "truths to be embraced."

  **The Analogy to use:**
  A paraconsistent logic is like a **shock absorber** on a car.
  *   **Dialetheist:** "The road is full of holes (contradictions), and the car is designed to acknowledge that holes are a natural part of the road."
  *   **Non-Dialetheic Paraconsistent Logician:** "The road *should* be smooth, but sometimes there are holes. If we don't install shock absorbers, the car breaks. Installing shock absorbers doesn't mean I *like* the holes or think they *should* be there; it just means I want the car to keep running despite them."

  Your professor is drawing the distinction because in philosophy, **formal tools** and **ontological commitments** must always be kept separate until you are ready to bridge them. You can wield the tool without signing the contract.
