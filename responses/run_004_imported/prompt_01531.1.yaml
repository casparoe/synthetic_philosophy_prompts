      *   *Strategic Choice:* I will focus on **McGrath (Normativism)**. Why? Because the user is a reporter covering negligence. The temptation to say "The regulator caused it *because* they should have acted" is the exact confusion I need to untangle. Showing why norms belong to *blame*, not *causation*, serves the user's practical goal better than arguing about physical processes (Dowe).

  4.  **Drafting the Argument - Section by Section:**

