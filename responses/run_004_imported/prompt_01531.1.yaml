  5.  **Refining the Tone:**
      *   Needs to be authoritative but not condescending.
      *   Avoid overly technical jargon where possible, or explain it (e.g., "contrastive focus").
      *   Ensure the "verdict" is sharp.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I argue for the third position? Yes.
      *   *Check:* Did I engage McGrath? Yes, focusing on the conflation of cause and blame.
      *   *Check:* Is the verdict definite? Yes.
      *   *Check:* Is it useful for a reporter? I need to emphasize *why* this helps their reporting. It allows them to expose the "Queen" causes (systemic issues) without getting bogged down in legal liability immediately. It expands the scope of investigation.

  7.  **Final Polish:** Ensure the distinction between "causal selection" (pragmatics) and "causal relation" (metaphysics) is crystal clear. This is the crux of the Lewis/Schaffer view. (Self-correction: Make sure to mention Schaffer's contrastivism explicitly as it refines Lewis.)

  8.  *(Final thought on the Dowe vs. McGrath choice)*: Actually, engaging Dowe might be philosophically cleaner because McGrath's view is less standard than the physicalist objection. However, for a *reporter*, the normativist view is the more dangerous confusion. I will stick with McGrath but perhaps acknowledge the physicalist intuition briefly to show robustness. No, the prompt says "at least one." I'll stick to McGrath to keep the argument tight and relevant to negligence.

      *Wait, one more consideration:* The prompt asks to show where the rival goes *wrong*. McGrath's view is that causation *has* a normative component. The counter-argument is that this makes causation unstable across different normative frameworks. If duties change, do causes change? That seems ontologically weird. I'll use that.

      *Let's write.*
answer: |-
  Here is the argument you need for your reporting. It is a defense of the "profligate" view: causation is broad, objective, and non-normative. The selectivity we apply in courtrooms and newsrooms belongs to pragmatics and ethics, not metaphysics.

  ### The Case for Profligate Causation

  To understand the regulatory failures you are investigating, you must first accept a counterintuitive premise: **Causation is cheap.**

  The third position you identified—rooted in David Lewis's counterfactual theory and refined by Jonathan Schaffer's contrastivism—argues that we should not flinch from the "Queen of England" problem. If the plant died because it wasn't watered, then every entity or agent whose action *could* have prevented that death is a cause of it. The gardener is a cause. The Queen is a cause. You are a cause. The rain cloud that drifted away is a cause.

  This sounds absurd in ordinary conversation, but that is precisely the point. Ordinary conversation is not a metaphysical inquiry; it is a tool for coordinating action. When we say, "The gardener caused the plant's death," we are not making a statement about the fundamental structure of reality. We are making a statement about *relevance*.

  By adopting this view, you separate the **causal field** (everything that made a difference) from the **causal selection** (the one difference we care about). This separation is vital for your work. If you conflate them, you risk missing the systemic causes (the "Queen" causes) because you are too focused on the liable agents (the "Gardener" causes).

  ### Why Normativism Fails: The McGrath Objection

  To see why this distinction matters, we must look at where the rival camp goes wrong. Sarah McGrath argues that causation by omission has a normative component: the gardener causes the death because he *ought* to have watered the plant; the Queen does not, because she had no such duty.

  This view is tempting for a legal reporter because it aligns causation with liability. However, it is metaphysically disastrous and practically blinding for an investigator.

  **1. The Instability of Fact**
  If McGrath is right, then causal facts change whenever normative facts change. Imagine a scenario where the gardener is off-duty. Under McGrath's view, if the gardener has no duty to water the plant, his inaction is no longer a *cause* of the death, even though the physical counterfactual remains identical (if he had watered it, it would have lived).

  This implies that the physical history of the universe depends on human social contracts. It suggests that if a legislature repeals a safety regulation, the regulator's subsequent inaction literally ceases to be a cause of the resulting disaster. This makes causation unstable. For a reporter, this is unacceptable. You need to know if the regulator's inaction *made a difference* to the outcome, regardless of whether a statute currently says they were supposed to act. If you build duty into causation, you lose the ability to argue that a duty *should have existed* because the inaction was causally potent.

  **2. Conflating Cause with Blame**
  McGrath's error is collapsing the distinction between *causation* and *culpability*.
  Consider a drowning. A bystander watches a child drown. A lifeguard watches a child drown. Both could have saved the child. Both did not.
  *   **Metaphysically:** Both omissions are causes of the death. The counterfactual holds for both.
  *   **Normatively:** Only the lifeguard is blameworthy.

  If you adopt McGrath's view, you must say the bystander did not *cause* the death. This obscures the reality that the bystander *could* have prevented it. In your reporting on negligence, this is the critical trap. If you only look for causes where there is already an established duty, you will never uncover the *new* duties that need to be assigned. You will only report on breaches of existing protocol, missing the systemic gaps where no protocol existed but harm occurred anyway.

  By keeping causation non-normative, you preserve the ability to say: "The regulator's inaction caused this harm (fact), and therefore they should have had a duty to act (norm)." McGrath forces you to say: "They had a duty, therefore they caused it." That reverses the logical order of accountability.

  ### The Pragmatic Solution: Contrast and Salience

  So, if the Queen is a cause, why do we never say she is? The Lewis/Schaffer camp answers this with **pragmatics**, specifically through *contrastive focus*.

  Causal claims are implicitly contrastive. When we ask, "What caused the plant's death?" we are usually asking, "What caused the plant to die *rather than live*?" In that context, the absence of water is the key difference. But we are also implicitly asking, "Which factor is *abnormal* or *intervention-ready*?"

  *   **The Gardener:** His inaction is abnormal (he was hired to water) and intervention-ready (we can fire him or sue him).
  *   **The Queen:** Her inaction is normal (she never waters plants) and not intervention-ready (we cannot reasonably command her).

  Jonathan Schaffer argues that the *causal relation* is the same for both, but the *causal explanation* selects the gardener. This selection is driven by context, interest, and moral stakes, not by the metaphysics of causation itself.

  For your reporting, this is the liberating insight. It means you can map the **full causal network** of a disaster without being constrained by current liability laws. You can identify the "Queen causes"—the budget cuts, the political pressure, the outdated technology, the regulatory silence. Metaphysically, these are all genuine causes of the harm. They satisfy the counterfactual test. If the budget hadn't been cut, the valve would have been replaced. If the regulator had acted on the warning, the hospital would have updated the protocol.

  The fact that the budget-cutter or the politician might not be *legally* liable is a separate question of pragmatics and justice. It does not erase their causal contribution.

  ### The Verdict

  You asked whether it makes sense to expect the metaphysics of causation to tell you who "really" caused a regulatory failure.

  **The verdict is no.**

  Metaphysics tells you *everything* that caused the failure. It tells you that the death of the plant was overdetermined by a vast network of absences: the gardener, the Queen, the rain, the soil quality. To ask metaphysics to single out the gardener is to ask it to do a job it was never designed for. That is the job of ethics, law, and journalism.

  If you adopt the "profligate" view, your reporting becomes more powerful, not less.
  1.  **It expands your scope:** You are free to investigate causes that currently have no assigned duty. You can show how a lack of funding (a "Queen" cause) was just as causally potent as the technician's error (the "Gardener" cause).
  2.  **It clarifies blame:** By establishing that the regulator's inaction was a *genuine cause* (independent of their duty), you strengthen the argument for why they *should* have had a duty. You avoid the circularity of saying they are responsible because they broke a rule, and they broke the rule because they were responsible.
  3.  **It protects truth:** It prevents the defense from arguing that because no specific rule was broken, no "cause" can be identified. You can assert: "The harm happened because X was not done. Whether X was required is a legal question; that X prevented the harm is a physical fact."

  Do not look to metaphysics to absolve or accuse. Look to it to map the terrain. The map will show you that the Queen is just as much a cause as the Gardener. It is then your job, and the court's, to decide why we only lock up the Gardener. Keep the science of cause distinct from the art of blame, and your reporting will cut through the obfuscation that negligence cases rely on.
