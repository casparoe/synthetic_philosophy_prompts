      *   *Decision:* McGrath is the stronger target for this specific argument. Why? Because the user is asking about *negligence* and *regulatory failure*. These are inherently normative contexts. If I can show that mixing norms into *causation* muddies the water for a reporter trying to distinguish "cause" from "blame," that's highly relevant. Dowe's view is easier to dismiss (omissions *do* make a difference physically, even if they aren't processes), but McGrath's view is more tempting for legal/moral contexts. Attacking McGrath clarifies the distinction between *causation* and *responsibility*, which is the user's core need.
