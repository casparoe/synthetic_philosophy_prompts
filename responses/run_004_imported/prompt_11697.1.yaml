          2.  **Thick vs. Thin:** Replacing complex tragedy with modern safety protocols is replacing "thick" concepts with "thin" ones.
          3.  **The Necessity of Uncomfortable Truths:** Opera shows us things we don't want to see about ourselves (desire, violence, fate). Sanitizing it makes it a lie.
