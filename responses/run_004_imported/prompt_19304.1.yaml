prompt: |-
  My mother taught the Zhuangzi for nearly forty years. She died eleven days ago, and I've been asked to give her eulogy. She loved retelling the scene in chapter 18, "Perfect Happiness," where Huizi visits Zhuangzi after his own wife's death and finds him not weeping but drumming on a basin and singing, and she left instructions asking for something closer to that than to a conventional wake: a plain, unembalmed burial, and music rather than unbroken solemnity, echoing Zhuangzi's own refusal, near the end of the book, of a lavish funeral for himself on the grounds that the crows would eat him regardless of the coffin. The room will mix former students and colleagues who will notice at once if I flatten this into stock wisdom about not fearing death, with family who have never opened the text and are simply grieving. Write the eulogy so that it honors what she asked for without implying that her death doesn't matter, or that missing her is some failure to understand her properly -- in that very scene, Zhuangzi says he grieved too, at first, before he ever reasoned his way to the drum.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Subject:** A eulogy for a mother who taught *Zhuangzi* (Daoist philosophy) for nearly 40 years.
      *   **Context:** She died 11 days ago. The speaker is her child.
      *   **Specific Instructions from the Deceased:**
          *   Reference Chapter 18 ("Perfect Happiness"), specifically the "drumming on a basin and singing" scene.
          *   Plain, unembalmed burial.
          *   Music rather than unbroken solemnity.
          *   Echo Zhuangzi's refusal of a lavish funeral (crows/kites vs. ants/moles).
      *   **Audience:** A mix of former students/colleagues (experts in the text) and family (non-experts, simply grieving).
      *   **Tone/Constraint:** Must *not* flatten the philosophy into stock wisdom ("don't fear death"). Must *not* imply that grieving is a failure to understand her. Crucially, must acknowledge Zhuangzi's own admission that he grieved *first* before he reasoned his way to the drum.
      *   **Goal:** Honor her wishes while validating the pain of loss.

  2.  **Deconstruct the Philosophical Tension:**
      *   *The Trap:* Daoist funerals can easily sound cold, detached, or dismissive of human emotion. If I say "She's part of the Dao now, so don't cry," it insults the grief of the family and simplifies the text for the scholars.
      *   *The Key Insight:* The prompt explicitly points out Zhuangzi's admission: "I grieved too, at first." This is the bridge. It allows for human sorrow *and* philosophical acceptance. It validates the 11 days of pain before arriving at the music.
      *   *The Imagery:* Drumming on a basin, singing, the transformation of elements (seasons, qi), the crows and kites.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the unusual nature of the gathering. Validate the grief immediately. Don't start with a joke or a quote; start with the reality of the loss.
      *   **The Mother's Legacy:** Mention her 40 years of teaching. Acknowledge the students in the room. She wasn't just a teacher of text, but of life.
      *   **The Zhuangzi Connection (Chapter 18):** Introduce the story of the wife's death. *Crucial:* Include the part about initial grief. This protects the mourners from feeling guilty for crying.
      *   **The Philosophy of Transformation:** Explain *why* Zhuangzi sang. Not because he didn't care, but because he saw death as a transformation (seasons, summer to winter). Apply this to the mother. She isn't "gone" in a nihilistic sense; she has changed form.
      *   **The Funeral Instructions (Chapter 32/End of Book):** Address the plain burial and the crows/kites. This shows her commitment to her beliefs until the end. It's an act of integrity, not neglect.
      *   **The Music:** Incorporate the request for music. This isn't just performance; it's the "drumming on the basin."
      *   **Closing:** Bring it back to the personal. It's okay to miss her. The philosophy holds space for the missing.

  4.  **Refining the Tone (Iterative Process):**
      *   *Drafting thought:* "She told us not to cry." -> *Correction:* No, that's wrong. She told us to sing *eventually*.
      *   *Drafting thought:* "She is now the Dao." -> *Correction:* Too abstract. "She has returned to the great transformation."
      *   *Drafting thought:* "Zhuangzi said grief is wrong." -> *Correction:* No, Zhuangzi said grief is natural, but understanding brings peace.
      *   *Addressing the Scholars:* Use the terminology correctly (Qi, transformation, *wanwu* - ten thousand things) but keep it accessible for family.
      *   *Addressing the Family:* Ensure they feel permission to weep. The "drumming" comes *after* the weeping.

  5.  **Incorporating Specific Textual References:**
      *   Chapter 18: Huizi visiting, the basin drumming, the explanation of the process (no life -> life -> death -> now back to non-life).
      *   Chapter 32 (or near end): The coffin argument (crows/kites vs. ants/moles).
      *   The "11 days" detail: This mirrors the "at first" period of grief Zhuangzi mentioned.

  6.  **Writing the Eulogy (Mental or Scratchpad):**
      *   Start with the 11 days. That's the "at first."
      *   Talk about her teaching. She lived the text.
      *   Bring in the basin story. Emphasize the *sequence*: Grief -> Understanding -> Song.
      *   Talk about the burial. No embalming. Feeding the crows. It's about equality with nature.
      *   End with the music. We sing not because we aren't sad, but because we know where she went.

  7.  **Polishing and Checking Constraints:**
      *   *Did I imply missing her is a failure?* No, I need to explicitly state that missing her is part of the "human heart."
      *   *Did I honor the plain burial?* Yes, frame it as her final lesson in equality.
      *   *Is the tone right?* Solemn but lifting. Not morbid, not cheerfully dismissive.

  8.  **Final Review against the Prompt:**
      *   "Nearly forty years teaching": Included.
      *   "Died eleven days ago": Included.
      *   "Chapter 18 Perfect Happiness": Included.
      *   "Huizi/Zhuangzi wife scene": Included.
      *   "Plain, unembalmed burial": Included.
      *   "Crows/Kites argument": Included.
      *   "Students/Colleagues vs. Family": Addressed both groups implicitly by balancing text analysis with emotional validation.
      *   "Zhuangzi grieved at first": **This is the core pivot point.** Must be highlighted.

  9.  **Final Polish:** (Self-Correction during drafting) Make sure the transition from grief to music feels earned, not abrupt. The music is the *result* of the processing, not a denial of it.

  **(Self-Correction Note):** Ensure I don't get the chapter numbers wrong in the text of the eulogy. While scholars know the division varies (Inner vs. Outer chapters), sticking to the user's "Chapter 18" citation is safest for their context. The "Crows/Kites" story is typically associated with the end of the text (often Chapter 32 in some editions, or just "near the end"). I will refer to it as "near the end of the book" as the prompt does.

  10. **Final Output Generation** (Proceeding to write the eulogy based on these thoughts).
answer: |-
  Thank you all for being here.

  For those of you who knew my mother only as a scholar, you know that for nearly forty years, her life was dedicated to the *Zhuangzi*. She taught the words, yes, but she also taught the rhythm of them. She taught that the way we move through the world matters as much as the destination.

  For those of you who knew her only as a mother, a sister, or a friend, you know that she was warm, and present, and very much here. And now, she is not.

  It has been eleven days since she died. In the *Zhuangzi*, there is a famous passage in Chapter 18, "Perfect Happiness." Zhuangzi's wife dies, and his friend Huizi comes to offer condolences. He finds Zhuangzi not weeping, but sitting on the ground, drumming on a basin and singing. Huizi is shocked. He says, "This is going too far."

  My mother loved this story. She retold it often. But she always made sure to tell the whole of it, not just the part about the singing. Because before Zhuangzi drums, before he sings, he admits something crucial. He says to Huizi: "When she first died, do you think I was not affected? I grieved."

  He grieved first. He reasoned his way to the song only after he had felt the weight of the loss.

  I tell you this because I know there are people in this room who are hurting. I know there are those who feel that if we honor my mother's wishes—if we play music, if we speak of transformation rather than only of ending—it might feel like we are dismissing the pain of her absence. I want to be clear: Missing her is not a failure of understanding. Grieving her is not a betrayal of her philosophy.

  Zhuangzi grieved. My mother grieved. And we, who loved her, are allowed to grieve. These eleven days have been our time to sit with the initial shock, the silence of the house, the empty chair. That is human. That is the heart responding to the severing of a bond.

  But my mother asked us to gather here today not to dwell in that initial shock, but to move toward the drumming.

  She asked for this plain burial. She asked for no embalming. She asked that her body be returned to the earth simply. This, too, comes from the text. Near the end of the book, Zhuangzi's disciples worry about how he will be buried. They worry that crows and kites will eat him. Zhuangzi replies that if you bury him deep, the ants and moles will eat him instead. Why, he asks, favor the ants over the crows?

  To my family, who may find this imagery difficult: This was not my mother being cold. It was her being honest. It was her final act of integrity. She believed that we are not separate from the world that feeds us. She did not want to be preserved in a state that was not hers. She wanted to return to the transformation of the ten thousand things. She wanted to be part of the cycle, not an exception to it.

  She taught that death is not a wall, but a turn in the road. In Chapter 18, Zhuangzi explains his singing by looking at the process of life. He says it is like the progression of the seasons. Spring to summer, summer to autumn, autumn to winter. When she died, she did not vanish; she changed form. She went from the shape of "my mother" back into the great flow from which she came.

  To sing is not to say that she is not gone. To sing is to acknowledge that the flow continues.

  So, we will have music today. It will not be unbroken solemnity. This is not because we do not respect the gravity of death, but because we respect her life. She spent forty years teaching us that rigidity breaks, but flexibility endures. That sorrow is real, but it is not the only truth.

  To her students and colleagues: You know better than anyone that she never used this text to escape the human condition. She used it to inhabit it more fully. She would not want her philosophy to be a shield that protects us from feeling. She would want it to be the ground we stand on when we feel.

  To my family: It is okay to cry. Zhuangzi cried. But when the tears slow, and when the heaviness lifts for a moment, we will play the music she asked for. We will drum on the basin, metaphorically. We will sing. Not because we are happy she is dead, but because we are grateful she was alive, and because we trust where she has gone.

  She has moved from the winter of her life back into the spring of the universe. She is in the wind, in the soil, in the crows, and in the ants. She is in the words she taught, and she is in the silence between them.

  We will miss her. We will love her. And now, as she asked, we will begin to sing.
