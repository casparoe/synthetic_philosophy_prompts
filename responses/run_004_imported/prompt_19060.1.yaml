prompt: |-
  So Lewis's Humean account of objective chance runs into the famous 'problem of undermining futures': since the chances at a time are just whatever the best system says they are, and the best system gets picked by how well it fits the entire history of the world (future included), there's always some tiny chance the future unfolds in a way that would've made a different theory the best system instead. Lewis tried to patch this in 'Humean Supervenience Debugged' with what he calls the New Principal Principle. Can you argue that the patch doesnt actually work, and that undermining is a real, unfixable problem for Humean chance/laws rather than just an annoying technical wrinkle?
reasoning: |-
  Here's a thinking process that leads to the argument against Lewis's "debugging" of the undermining problem:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** David Lewis's Humean account of objective chance (Best System Analysis - BSA).
      *   **Problem:** The "Problem of Undermining Futures" (PUF).
      *   **Lewis's Solution:** The "New Principal Principle" (NPP) proposed in "Humean Supervenience Debugged" (1994).
      *   **Task:** Argue that the patch *doesn't* work and that undermining is a fundamental, unfixable problem for Humean chance/laws, not just a technical wrinkle.

  2.  **Understand the Core Concepts:**
      *   **Humean Supervenience (HS):** The world is a mosaic of local matters of particular fact. Laws and chances supervene on this mosaic (they are summaries of it).
      *   **Best System Analysis (BSA):** Laws/chances are the theorems of the system that best balances simplicity, strength, and fit regarding the *entire* history of the world (past, present, future).
      *   **Undermining Futures:** Since chances depend on the *whole* history, a future sequence of events could occur that makes the current best system *not* the best system. If the current theory says there's a non-zero chance of this future, we have a contradiction: The theory says $P(F) > 0$, but if $F$ happens, the theory is false (because a different system would be best).
      *   **The Old Principal Principle (PP):** $Cr(A | E \land Ch(A)=x) = x$. (Credence in A given evidence E and chance x should be x).
      *   **The Conflict:** If $F$ is an undermining future, $Ch(F) > 0$ according to current theory $T$. But if $F$ occurs, $T$ is false, so $Ch_T(F)$ doesn't exist. So $Cr(F | T) > 0$, but $F$ entails $\neg T$. This violates PP.
      *   **Lewis's Fix (NPP):** Replace $Ch(A)=x$ with $T$ (the theory specifying the chances). $Cr(A | E \land T) = Ch_T(A)$. Basically, condition on the theory being true, not just the chance value.

  3.  **Brainstorming Arguments Against the NPP/HS:**
      *   *Argument 1: Circularity/Triviality.* The NPP basically says "Condition on the theory being true." But the whole point of chance is to guide belief in an uncertain world. If we have to assume the theory is true to use the chance, does it still function as *objective* chance?
      *   *Argument 2: The "Bug" is a Feature.* The problem isn't just mathematical; it reveals a metaphysical incompatibility. Humean chances depend on the future. Rational credence depends on the present. You can't bridge that gap without begging the question.
      *   *Argument 3: Loss of Explanatory Power.* Chances are supposed to explain frequencies (or fit them). If the chance function is sensitive to future fluctuations that haven't happened yet, it loses its normative force for current decision-making.
      *   *Argument 4: The "Might" vs. "Would".* Lewis admits undermining futures *might* happen. But if they *would* change the laws, then the laws aren't stable enough to ground the probabilities assigned to them.
      *   *Argument 5: Ismael's Critique (The Self-Undermining).* Jenann Ismael has argued extensively on this. The NPP makes chance epistemic rather than metaphysical.
      *   *Argument 6: The "Big Bad Bug" remains.* Lewis called undermining the "Big Bad Bug." Debugging it requires abandoning the spirit of the Principal Principle, which was meant to capture the link between chance and credence. If the link is broken/modified this much, is it still *chance*?

  4.  **Developing the Strongest Line of Attack:**
      *   Focus on the metaphysical status of chance.
      *   Focus on the normative role of chance (guiding credence).
      *   Show that NPP severs the link between *current* evidence and *future* probability in a way that makes Humean chance useless for agents.
      *   Highlight that the dependency on the future makes chance *post-hoc* rather than *predictive*.

  5.  **Drafting the Argument Structure:**
      *   **Introduction:** Define HS, BSA, and the Undermining Problem. State the thesis: Lewis's NPP is an ad hoc fix that fails to resolve the deep metaphysical tension between Humean supervenience and the normative role of chance.
      *   **Point 1: The Normative Disconnect.** The PP was meant to tell us how to believe *now*. The NPP tells us to condition on the truth of a theory that depends on the *future*. This makes it impossible for an agent to actually use the principle without omniscience.
      *   **Point 2: Metaphysical Instability.** If laws/chances depend on the future, they aren't "in" the present to guide action. They are global summaries. This contradicts the intuition that chances are propensities or physical features available *now* to influence outcomes.
      *   **Point 3: The "Best System" is a Moving Target.** Since the Best System is determined by the *entire* history, the "true" chances don't exist until the end of time. Assigning probabilities to futures that determine the probabilities themselves is viciously circular.
      *   **Point 4: Comparison to Non-Humeanism.** Contrast with Armstrong or Primitivism where laws/chances are local or relational facts that don't depend on the future mosaic. This shows the problem is specific to Humeanism.
      *   **Conclusion:** The bug isn't debugged; it's swept under the rug. The NPP saves the math but kills the metaphysics of chance.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Check:* Did Lewis admit the NPP changes the concept of chance? Yes, he said we have to adjust our concept.
      *   *Counter:* That's exactly the point! If you have to change the concept so much it no longer plays the role of objective chance, you've eliminated the concept.
      *   *Key Philosopher:* Jenann Ismael is crucial here. Her work "The Open Universe" and papers on Humean chance argue that the NPP makes chance epistemic. Also, Michael Strevens and Tim Maudlin have criticisms.
      *   *Focus:* Make sure to emphasize *why* it's unfixable. It's because HS defines laws/chances as *summaries* of the mosaic, but chance needs to be a *guide* through the mosaic. You can't summarize what hasn't happened yet to guide what happens next.

  7.  **Final Polish:** Ensure the tone is philosophical, rigorous, and directly addresses the prompt's request to argue that it's an "unfixable problem." (Avoid sitting on the fence).

      *(Self-Correction during drafting)*: I need to be careful with the formulation of the NPP. Lewis's NPP is $Cr(A | T_w) = Ch_T(A)$. The issue is that $T_w$ includes information about the future. An agent cannot condition on $T_w$. They can only condition on $H_t$ (history up to time t). So the NPP is unusable for agents.

      *Wait, Lewis's specific formulation:* $Cr(A | T \land E) = Ch_T(A)$. Where $T$ is the theory of chance. The problem is that $T$ is not known. But more deeply, $T$ is not *determinate* yet.
      *Better argument:* The NPP requires us to treat the Humean Best System *as if* it were a fixed truth-maker for chances. But by Humean lights, it *isn't* fixed until the future is settled. So the NPP asks us to treat a contingent global summary as a necessary local constraint. This is a category error.

  8.  **Finalizing the Points:**
      1.  **Epistemic Inaccessibility:** Agents can't use NPP because they don't know the true Best System (it depends on the future).
      2.  **Metaphysical Circularity:** Chances depend on frequencies; frequencies depend on chances. Undermining exposes this loop.
      3.  **Loss of Objectivity:** NPP turns chance into a conditional credence, not a worldly feature.
      4.  **The "Bug" is Structural:** It stems from the tension between Global Supervenience and Local Guidance.

  9.  **Writing the Response.** (Proceed to generate output based on these thoughts).
answer: |-
  David Lewis's "Humean Supervenience Debugged" (1994) is often treated as a valiant attempt to save the Best System Analysis (BSA) from its own internal contradictions. However, a strong case can be made that the "debugging" is merely cosmetic. The Problem of Undermining Futures is not a technical glitch to be patched with a revised Principal Principle; it is a symptom of a deep metaphysical incompatibility between **Humean Supervenience (HS)** and the **normative role of objective chance**.

  Here is an argument that Lewis's New Principal Principle (NPP) fails to resolve the issue, and that undermining remains a fatal flaw for Humean accounts of law and chance.

  ### 1. The Normative Disconnect: Chance Cannot Guide Credence
  The primary philosophical job of objective chance is to constrain rational credence. The original Principal Principle (PP) captured this: if you know the chance of $A$ is $x$, your credence in $A$ should be $x$.

  Lewis's NPP modifies this to: $Cr(A \mid T_w) = Ch_T(A)$, where $T_w$ is the true theory of chance for world $w$.
  The fatal flaw here is **epistemic inaccessibility**.

  On the Humean view, the "true theory of chance" ($T_w$) is determined by the Best System, which balances simplicity, strength, and fit over the **entire history of the world** (past, present, and future). Therefore, no agent situated at a time $t$ can know $T_w$, because no agent at $t$ knows the future mosaic.
  *   **The Consequence:** The NPP renders chance useless for decision-making. If an agent cannot condition on $T_w$ (because it depends on the future), the NPP provides no guidance on what to believe *now*.
  *   **The Humean Dilemma:** If Lewis says agents should condition on the *current candidate* for the Best System, he re-introduces undermining (since that candidate might be undermined). If he says they must condition on the *actual* Best System, he demands omniscience. The NPP saves the logic of chance only by making it inapplicable to any actual knower.

  ### 2. Metaphysical Circularity: The "Moving Target" Problem
  Undermining reveals that on the Humean view, chances are not fixed features of the present that govern the future; they are **post-hoc summaries** of the future.

  Consider a coin that the current Best System says is fair ($Ch(Heads) = 0.5$). There is a possible future sequence of 1,000 heads. If this sequence occurs, the Best System might shift to one that says the coin was biased ($Ch(Heads) = 1.0$) to achieve better "fit."
  *   **The Circularity:** The chance of the future sequence is defined by a theory that is defined by the occurrence of the future sequence.
  *   **Why NPP Fails:** The NPP asks us to treat the chance function as a stable truth-maker. But metaphysically, on HS, the chance function is *supervenient* on the very events it is supposed to probability. Lewis tries to fix this by telling us to ignore the dependency in our credence calculations. But this is a pragmatic instruction, not a metaphysical solution. It tells us how to *act* as if chances are stable, while admitting they *are not* stable. This severs the link between the metaphysics of chance and its normative role. If the "chance" is a moving target that depends on what it is measuring, it ceases to be an explanatory ground for probabilities.

  ### 3. The Loss of "Objectivity"
  Lewis wanted objective chance to be a feature of the world, distinct from subjective credence. However, the NPP effectively collapses chance into **conditional credence**.

  By defining the link between chance and credence as $Cr(A \mid T)$, Lewis makes chance relative to the theory $T$. But since $T$ is just a human construction (the "Best" System is selected based on human virtues like simplicity and strength), chance becomes relative to our systematization preferences.
  *   **The Undermining Implication:** If a future sequence undermines the current theory, it shows that the "chances" were never really *in* the world to begin with; they were just our best guess at a summary.
  *   **The Critique:** A robust account of objective chance should allow that we can be wrong about the chances. But on the Humean view, if the future turns out differently, the chances *were different all along*. This implies there is no fact of the matter about current chances independent of the future. The NPP tries to paper over this by saying "Condition on the theory," but this admits that chance is not a worldly property guiding the future, but a retrospective label we apply to the past.

  ### 4. Structural Incompatibility: Global Supervenience vs. Local Production
  The deepest reason undermining is unfixable is that it highlights a category error in Humean Supervenience itself.
  *   **Physical Intuition:** We intuitively understand chances as **local productive features**. A radioactive atom has a propensity to decay *now* that influences its future.
  *   **Humean Reality:** On HS, chances are **global descriptive features**. They supervene on the whole mosaic.

  The Problem of Undermining arises because HS tries to derive the **local/normative** (what should I believe about the next decay?) from the **global/descriptive** (what is the best summary of all decays?).
  Lewis's NPP attempts to bridge this gap by fiat. It essentially says, "Even though the chance depends on the future, pretend it doesn't when calculating credence."
  *   **Why this is fatal:** If the chance *metaphysically* depends on the future, you cannot coherently pretend it doesn't when calculating rational belief without introducing a disconnect between reality and rationality. If the world is Humean, then the "chance" of an undermining future is non-zero, but the realization of that future negates the chance assignment. This is not a paradox of language; it is a paradox of ontology. It shows that **Humean Supervenience cannot ground objective chance.**

  ### 5. Comparison to Non-Humean Alternatives
  The persistence of the undermining problem is best highlighted by contrasting it with Non-Humean accounts (e.g., Armstrong's necessitation relations or Primitivist chance).
  *   **Non-Humean:** Laws/Chances are fixed at $t$ and constrain the future. An undermining future is metaphysically impossible (or has chance 0) because it would violate the existing productive relations.
  *   **Humean:** Laws/Chances are not fixed at $t$. An undermining future is possible, but its realization changes the past truth-values of chance claims.

  Lewis's debugging admits the Non-Humean intuition (that we must treat chances as fixed) while retaining the Humean metaphysics (that they are not fixed). This is an unstable hybrid. As philosopher Jenann Ismael has argued, the NPP essentially concedes that Humean chance cannot play the role of objective chance, and instead functions as a guide for "epistemic" probability. But if Humeanism cannot account for *objective* chance, it fails one of its main selling points: providing a metaphysics of science that includes probabilistic laws.

  ### Conclusion
  Lewis's "debugging" is a pragmatic patch on a metaphysical crash. The New Principal Principle saves the *formalism* of chance by instructing agents to condition on the truth of the Best System. But since the Best System's truth is contingent on the future, this instruction is either impossible to follow (requiring knowledge of the future) or dishonest (pretending the theory is fixed when it isn't).

  The Problem of Undermining Futures demonstrates that **you cannot derive normative, forward-looking probabilities from a metaphysics that makes those probabilities dependent on the future outcomes.** The bug is not in the logic of the Principal Principle; it is in the Humean conception of laws. Until one abandons the idea that laws/chances supervene on the *entire* mosaic, the tension between the definition of chance and the use of chance remains unresolvable.
