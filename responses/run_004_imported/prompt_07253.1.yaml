answer: |-
  Here is a sequence of 8 questions designed to progressively tighten the constraints on the surrogate goals defense, moving from internal consistency to external ecosystem risks. Each includes the likely answer she will give and a follow-up designed to block that escape route.

  ### 1. The Indifference Mechanism
  **Question:** "To start, could you clarify the exact decision-theoretic node where the threatener becomes indifferent? Is the claim that by valuing the surrogate $S$ as highly as my true value $V$, I make the expected utility of threatening $S$ identical to threatening $V$ from *their* perspective, or merely that I make myself unwilling to concede to threats against $V$?"

  *   **Likely Answer:** She will likely say it's about making the *cost* to you identical. If you care about $S$ as much as $V$, a rational threatener seeking concessions will target whichever is cheaper for *them* to threaten, which should be $S$.
  *   **Follow-up:** "So the defense relies on the threatener having a lower cost to damage $S$ than $V$. But if $S$ is arbitrary, don't we risk picking a surrogate that is actually *harder* for them to manipulate than $V$, thereby increasing the total threat surface rather than deflecting it?"

  ### 2. Acausal Credibility (Required)
  **Question:** "This strategy hinges on the threatener believing you have truly modified your utility function. In an acausal context where there is no causal channel to demonstrate commitment and no prior track record with this specific agent, what mechanism makes the commitment credible? Why shouldn't a predictor simply simulate you, see that $S$ is instrumentally adopted but not terminally valued, and target $V$ anyway?"

  *   **Likely Answer:** She will likely appeal to logical updatelessness or precommitment: "If you are the sort of agent who *can* successfully precommit, you get the better outcome. A rational predictor knows you would have precommitted before the simulation started, so they must treat the commitment as real."
  *   **Follow-up:** "But doesn't that require the threatener to be uncertain about your source code? If they can simulate the decision process where you *chose* the surrogate, they see the calculation 'I don't really care about $S$.' How do you prevent the simulation from distinguishing between a terminal value and a high-fidelity pretense?"

  ### 3. Transparency and Rationality
  **Question:** "Your go-to response to the credibility objection is that it doesn't matter if the threatener sees through the substitution; rationality dictates they target the surrogate regardless. Can you unpack why a rational agent, knowing $S$ is a decoy and $V$ is what you actually care about, wouldn't simply update their strategy to target $V$ to ensure compliance, given that threatening $S$ yields no actual leverage over your true welfare?"

  *   **Likely Answer:** She will argue that if you have successfully precommitted, your *behavior* is identical whether $S$ is real or fake. "Rationality is about predicting actions. If your actions defend $S$ at all costs, threatening $S$ works. It doesn't matter what's in your head, only what you do."
  *   **Follow-up:** "That works for simple compliance, but what if the threat requires you to be functional? If they destroy $S$ and you go catatonic in response, they get no concessions. If they know $S$ is fake, they know your catatonia is 'unnecessary' suffering. Does your defense assume the threatener is indifferent to the *efficiency* of the suffering they cause, provided they get the concession?"

  ### 4. Terminal Values of Distress (Required)
  **Question:** "Let's assume the threatener isn't just looking for concessions but terminally values your distress or the frustration of your actual preferences. If their utility function includes a term for $-U_{you}(V)$, does the surrogate goal strategy collapse? It seems indifference only works if they care about the *threat* working, not about *what* gets hurt."

  *   **Likely Answer:** She will likely concede this is a limitation but argue it applies to a specific subclass of agents (sadists) and that most acausal threats are resource-seeking, not sadistic. "We are optimizing for the median acausal threat, not the worst-case malign agent."
  *   **Follow-up:** "But in an acausal landscape, won't the sadistic agents be the ones who persist? If resource-seekers are deflected by surrogates, the remaining active threats are disproportionately those who specifically want to bypass surrogates. Doesn't the strategy filter your adversary pool toward the exact agents who can defeat it?"

  ### 5. Surrogate Selection Costs
  **Question:** "For this to work, the surrogate must be cheap for you to protect but expensive for the threatener to damage, or at least cheaper than your real values. How do you select a variable that is robust against acausal manipulation without inadvertently tying it to something you actually care about? If $S$ is truly arbitrary, why would you defend it? If it's not arbitrary, isn't it correlated with $V$?"

  *   **Likely Answer:** "We look for logical correlations that are one-way. For example, caring about the digits of pi in a specific base. It costs you little to 'care,' but an acausal threatener might find it costly to manipulate the mathematical truth or the simulation of it."
  *   **Follow-up:** "If you care about the digits of pi, doesn't that create a new vulnerability? If a threatener can't change the digits, they might threaten to *convince you* they changed them. Does the surrogate strategy shift the battlefield from resource extraction to epistemic warfare, which might be even costlier for you to defend?"

  ### 6. Ecosystem Escalation (Required)
  **Question:** "If surrogate goals become a standard defense in the decision-theoretic community, doesn't that teach potential threateners to manufacture threats against whatever we seem to care about next? By signaling that we are vulnerable to threats but are trying to hide our values, do we incentivize agents to run broad-spectrum scans for *any* strong preference, surrogate or not, effectively raising the price of privacy for everyone?"

  *   **Likely Answer:** "Ideally, if everyone adopts this, threateners learn that threatening is low-yield overall. It creates a 'market for threats' where the price of coercion goes up because targets are harder to hurt."
  *   **Follow-up:** "But if the price of coercion goes up, won't threateners simply invest more in reconnaissance to distinguish surrogates from real values before launching a threat? Doesn't this arms race favor the threatener, who only needs to find one real value, over the defender, who must hide *all* of them?"

  ### 7. Correlated Failure Modes
  **Question:** "Surrogate goals assume the damage to $S$ is isolated. But in acausal trade, variables are often logically correlated. If the threatener can damage $S$, does that imply they have enough computational power or logical influence to also damage $V$ as a side effect? Are we assuming a modularity of acausal influence that might not exist?"

  *   **Likely Answer:** "We assume the threatener chooses the path of least resistance. Even if they *could* damage $V$, if damaging $S$ gets the same concession for less effort, they will choose $S$."
  *   **Follow-up:** "That assumes effort is the only constraint. But if damaging $S$ grants them access to your decision algorithm in a way that *allows* them to damage $V$ later, they might take the surrogate deal as an entry point. Have you modeled the 'foot-in-the-door' risk of acausal engagement?"

  ### 8. Falsifiability and Evidence (Required)
  **Question:** "Finally, what would count as evidence that the surrogate goals strategy fails? Since this deals with acausal predictors who by definition don't leave causal traces until it's too late, is there any observable outcome or decision-theoretic paradox that would convince you to abandon the approach?"

  *   **Likely Answer:** "If we could construct a formal proof that a sufficiently intelligent predictor can always distinguish surrogate from terminal values regardless of precommitment, that would falsify it. Or if we observed 'acausal disasters' in simulated environments that correlated with surrogate usage."
  *   **Follow-up:** "But if the disaster is acausal, we wouldn't observe it causally. So aren't you relying on a belief that cannot be updated by empirical evidence? If the strategy is unfalsifiable in practice, how do you distinguish it from a just-so story that comforts us against existential risk rather than a robust defense?"
