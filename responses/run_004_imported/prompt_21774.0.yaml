  *(Self-Correction Note during drafting the ending)*: I initially thought about having them agree it works. But the prompt asks them to figure out if it's a real fix or busted. The rationalist consensus is generally skeptical of simple surrogate goals because of the transparency issue. I should lean towards "It's busted unless you have opacity." That feels more intellectually honest.

