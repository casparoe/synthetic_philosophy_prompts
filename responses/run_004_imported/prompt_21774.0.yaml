      *   *Skeptic:* Let's call her **Sam**. Needs to be pragmatic, focused on information asymmetry and the mechanics of the threat.

  3.  **Key Concepts to Weave In:**
      *   **Acausal Trade/Threats:** Agents influencing each other without causal contact (via simulation or logical prediction).
      *   **Surrogate Goals:** Caring about something trivial (e.g., paperclips) so threats target that instead of your real values (e.g., human happiness).
