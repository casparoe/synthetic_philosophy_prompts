      *   *Focus:* Ensure they talk about *acausal* specifically. If it's causal, blackmail is normal. The weirdness is the acausal part.
      *   *Key Insight:* The surrogate goal only works if the threatener *cannot* distinguish the surrogate from the terminal goal without incurring prohibitive computational cost.

  6.  **Writing the Dialogue (Iterative Process):**
