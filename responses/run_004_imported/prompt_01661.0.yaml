answer: |-
  This is one of the most famous and enduring puzzles in the philosophy of language and metaphysics. You have stumbled upon what is often called **"The Jade Problem."**

  It strikes at the heart of how we connect words to the world. Your intuition is shared by many philosophers: it feels unjust to say ancient artisans were "mistaken" or that their concept "failed," because they successfully manipulated the material, traded it, and built a culture around it. Yet, modern science tells us there is no single "natural kind" corresponding to the word *jade*.

  Here is a framework for thinking about this tension, moving from the strict semantic view to a more pragmatic one.

  ### 1. The Strict Semantic View (Kripke and Putnam)
  In the 1970s, philosophers Saul Kripke and Hilary Putnam revolutionized how we think about reference. They argued that terms for natural substances (like "water," "gold," or "tiger") are **natural kind terms**.

  *   **The Theory:** When we use these words, we aren't just describing surface features (clear, wet liquid); we are implicitly pointing to an underlying essence (microstructure, DNA, atomic number).
  *   **The Implication for Jade:** If "jade" is a natural kind term like "gold," it ought to refer to a single microstructure. Since it refers to two distinct minerals (jadeite is a pyroxene; nephrite is an amphibole), the strict view suggests "jade" is not a genuine natural kind term.
  *   **The Verdict:** On this view, the ancients *were* referring to something, but they were operating under a false hypothesis that these two minerals were the same substance. Their reference was "indeterminate" at the microscopic level.

  **Why this feels unsatisfying:** As you noted, this dismisses the reality of the artisans' expertise. To a carver, the "essence" of jade isn't its silicate chain structure; it's its toughness, grain, and ability to take a polish. If the strict semantic view says the carvers were "wrong," the theory seems out of touch with human practice.

  ### 2. The "Functional Kind" Solution
  One way to resolve this is to distinguish between **scientific natural kinds** and **functional (or phenomenal) kinds**.

  *   **Scientific Kinds:** Grouped by underlying constitution (e.g., $H_2O$, $CaCO_3$).
  *   **Functional Kinds:** Grouped by what they *do* or how they appear to us (e.g., "weed," "pest," "fruit," "jade").

  Consider the word **"fruit."** Botanically, a tomato is a fruit. Culinarily, it is a vegetable. If a chef says, "I need fruit for this salad," and you hand them a tomato, you haven't "failed" to refer; you are simply operating in different taxonomic frameworks.

  Applied to jade: The ancients were not using "jade" as a geological term; they were using it as a **technological term**. They referred to a *functional kind*: "Stone that is tough, green, and polishable." Both jadeite and nephrite fit this functional description perfectly. Therefore, their concept was determinate *relative to their interests*. It only becomes "indeterminate" when judged by the interests of modern mineralogy.

  ### 3. The Disjunctive View
  Some philosophers argue that "jade" simply refers to a **disjunctive kind**.

  *   **The Definition:** The extension of "jade" is `(Jadeite OR Nephrite)`.
  *   **The Logic:** There is no rule that says a valid category must share a single microstructure. If two different microstructures produce the same macroscopic properties relevant to humans, we are entitled to group them.

  However, critics argue that disjunctive kinds are "gerrymandered"—they don't support scientific laws. You can't make generalizations about "jade" that hold true for both minerals (e.g., melting point, specific gravity). But again, this only matters if your goal is *geology*. If your goal is *art history* or *archaeology*, the disjunction is stable and useful.

  ### 4. The Division of Linguistic Labor
  Hilary Putnam also introduced the idea of the **Division of Linguistic Labor**. He argued that the reference of some terms is fixed by experts in the community.

  *   **Pre-Modern Context:** The "experts" were master lapidaries and carvers. They fixed the reference of "jade" based on workability and appearance. Within that community, the reference was precise.
  *   **Modern Context:** The "experts" are now mineralogists. They have refined the taxonomy.

  This suggests that reference isn't static; it evolves as the "linguistic labor" shifts. When mineralogy emerged, the word "jade" didn't necessarily become "wrong"; rather, the language split. In a geological context, "jade" is now understood as a trade name covering two species. In an art context, it remains a unified category.

  ### 5. A Pluralistic Conclusion: Reference is Interest-Relative
  The most satisfying way to think about this case is to reject the idea that there is only **one true way** the world is carved up.

  Philosopher John Dupré argues for **"The Disorder of Things."** He suggests that the world does not come pre-packaged into single, correct categories. Different classification systems serve different human purposes.
  *   **Geology** carves the world at the joints of crystal structure.
  *   **Archaeology** carves the world at the joints of cultural usage.
  *   **Commerce** carves the world at the joints of market value.

  **So, did the ancients refer to anything determinate?**
  Yes. They referred to a **macroscopic, functional kind** that is real and stable, even if it is not a **microscopic, chemical kind**.

  **Did their concept fail?**
  No. A concept fails only if it prevents you from navigating the world successfully. Since they created enduring art and established trade routes using this concept, it was successful.

  **How to think about words attaching to things:**
  Instead of thinking of words as "hooks" that must latch onto a single, hidden essence in the object, think of them as **tools for coordination**.
  *   If the goal is chemical analysis, "jade" is a blurry tool.
  *   If the goal is understanding human history and art, "jade" is a sharp, precise tool.

  The "Jade Problem" teaches us that reference is not just about the world; it is about the **interaction between the world and human interests**. The ancients weren't mistaken about the stone; we are mistaken if we assume their vocabulary was intended to do the same work as ours.
