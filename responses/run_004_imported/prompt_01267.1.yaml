  You are right to feel that Lewis and Woodward are "cousins." They both reject regularity theories (Hume's constant conjunction) and both analyze causation through the lens of *what would have happened if things were different*.

  However, treating them as identical is a category error. The divergence isn't in the *logic* of counterfactuals, but in the **semantics**: how do we determine whether a counterfactual is true or false?

  *   **Lewis (1973):** Truth is determined by **Global Similarity**. We look at the nearest possible world where $C$ is false. This involves a "miracle" (a violation of actual laws) just before $C$ to keep the past identical.
  *   **Woodward:** Truth is determined by **Local Surgery**. We look at the result of an *intervention* ($do(C=0)$). This involves breaking the incoming arrows to $C$ while leaving the structural equations of the rest of the system intact.

  Here is a concrete scenario where these two semantics yield different verdicts, followed by the deeper metaphysical rift.

  ### The Scenario: "The Dueling Assassins" (Late Preemption)

  **The Setup:**
  Suzy and Billy are both expert assassins hired to kill a target. They agree that whoever gets the cleanest shot takes it.
  1.  **Suzy ($S$)** fires at time $t_1$. Her bullet is on a perfect trajectory.
  2.  **Billy ($B$)** fires at time $t_1$ as well, but his bullet is slightly slower.
  3.  Suzy's bullet hits the target at $t_2$. The target dies ($D$).
  4.  **Crucial Detail:** If Suzy's bullet had vanished mid-air (or missed), Billy's bullet would have hit the target at $t_3$ and killed him anyway.

  **The Question:** Did Suzy's shot cause the target's death?

  ---

  ### 1. Lewis's Analysis (1973 Paper)
  Lewis's 1973 account defines causation as the **ancestry of counterfactual dependence**. For $S$ to cause $D$, there must be a chain of events where each step counterfactually depends on the previous one.

  *   **Step 1:** Does $D$ depend on $S$?
      *   Counterfactual: "If Suzy hadn't fired ($S=0$), would the target have died ($D=1$)?"
      *   Lewis's Similarity Metric: We look for the closest world where $S=0$. We hold the past fixed (Billy is still there, still aiming). In this world, Billy's bullet hits. The target dies.
      *   Result: $D$ does **not** depend on $S$. (Because $D$ happens anyway).
  *   **Step 2:** Is there an intermediate chain?
      *   Maybe $S$ causes "Suzy's Bullet in Air" ($I$), and $I$ causes $D$?
      *   Does $D$ depend on $I$? Counterfactual: "If Suzy's bullet had vanished mid-air ($I=0$), would the target have died?"
      *   Result: Yes, Billy's bullet would still kill him.
      *   **Verdict:** The chain of dependence is broken. Under the strict 1973 account, **Suzy did not cause the death.**

  *(Note: Lewis admitted this was a bug in his 1973 theory and patched it in 1986 with "quasi-dependence," but your prompt specifies the '73 paper, where this verdict stands.)*

  ### 2. Woodward's Analysis (Interventionism)
  Woodward models this using Structural Equations. Crucially, Woodward allows us to **fine-grain the variables** and perform **surgical interventions**.

  *   **The Model:**
      *   $S = 1$ (Suzy fires), $B = 1$ (Billy fires).
      *   $D_{time}$ = Time of death.
      *   Equation: $D_{time} = \text{if } S=1 \text{ then } t_2 \text{ else if } B=1 \text{ then } t_3 \text{ else } \infty$.
  *   **The Intervention:**
      *   We perform $do(S=0)$. This surgically sets Suzy's shot to 0 *without* changing Billy's shot (because the intervention breaks the correlation/common cause if there was one, but here they are independent).
      *   Result: $D_{time}$ changes from $t_2$ to $t_3$.
  *   **Verdict:** Because the intervention on $S$ changes the value of $D$ (specifically, the *time* of death), **Suzy is a cause.**

  ---

  ### What's Doing the Work?

  The disagreement stems from **Modularity vs. Holism**.

  1.  **Lewis (Holism/Similarity):** Lewis evaluates counterfactuals by comparing whole worlds. In the "closest world" where Suzy doesn't fire, the *entire situation* is evaluated. Since Billy is still present in that world (held fixed by the past), the effect remains. The "backup" mechanism swallows the dependence. Lewis's 1973 metric cannot easily isolate Suzy's contribution from Billy's without breaking the chain.
  2.  **Woodward (Modularity/Surgery):** Woodward's interventions are *local*. When we $do(S=0)$, we are not asking "What is the closest world where Suzy is a non-assassin?" We are asking "What happens if we surgically remove this specific arrow?" By defining the effect variable precisely ($D_{time}$ rather than just $D$), Woodward's structural equations reveal that Suzy's contribution is distinct from Billy's, even if the binary outcome is the same.

  ### Which Verdict is Intuitively Correct?

  **Woodward (and Mature Lewis) tracks intuition better here.**
  Intuitively, Suzy *did* cause the death. Her bullet was the one that actually hit the flesh. The fact that Billy *would have* killed him is irrelevant to the actual mechanism that produced the death.

  **Why this isn't a cop-out:**
  It's not just about "getting the right answer." It's about **explanatory power**.
  *   If we accept Lewis's 1973 verdict (No Causation), we cannot explain *why* the victim died at $t_2$ rather than $t_3$. Suzy's action is the only difference-maker for the *timing*.
  *   Woodward's framework forces us to model the *mechanism* (the equations). By requiring an invariant relationship under intervention, Woodward forces the modeler to specify *how* the cause produces the effect. If the binary variable "Death" masks the causal structure, Woodwardian analysis demands we refine the variable until the dependence shows up. Lewis's similarity metric is vaguer; it relies on our intuitive ranking of "closeness" between worlds, which can be gamed to produce the wrong result (as in 1973 Preemption).

  ### The Deeper Rift: The "Laplacian" Divergence

  If you want a case where even **Mature Lewis** and **Woodward** disagree, consider a **Closed Deterministic System**.

  **Scenario:** A clockwork universe with no external inputs. Gear A turns Gear B.
  *   **Lewis:** Causation exists. We evaluate "If A hadn't turned..." by imagining a small miracle (a violation of the clockwork laws) where A stops. B stops. Causation holds.
  *   **Woodward:** Causation is **undefined**. An intervention requires an *exogenous* variable—a source of variation outside the system. In a closed Laplacian universe, there are no interventions possible (no "outside hand" to turn the gear). Therefore, strictly speaking, there is no causation, only correlation governed by laws.

  **Why this matters:**
  *   **Lewis** is a **Humean Supervenientist**: Causation is a pattern in the mosaic of events, mind-independent. It exists even if no one can manipulate it.
  *   **Woodward** is a **Manipulation Realist**: Causation is essentially tied to the *possibility* of manipulation (even if only by a god-like agent). If the variables aren't modular (i.e., if you can't change one without violating the laws), it's not a causal relation, it's a law-like constraint.

  ### Summary
  You are right that they wear similar hats. But Lewis's hat is woven from **similarity between whole worlds**, while Woodward's is woven from **surgical cuts on local graphs**.
  *   In **Preemption**, Lewis (1973) fails because the "closest world" includes the backup cause; Woodward succeeds because interventions isolate the specific path.
  *   In **Closed Systems**, Lewis succeeds (via miracles) where Woodward fails (via lack of modularity).

  Woodward wins on **precision and modeling utility** (which is why causal inference loves him). Lewis wins on **metaphysical breadth** (allowing causation where intervention is impossible).
