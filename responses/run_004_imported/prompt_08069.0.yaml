prompt: |-
  I've spent years reading LessWrong and the EA Forum, and last year that finally turned into something concrete: I joined the small committee that allocates a pooled donation fund that four of us run out of a shared spreadsheet each giving season. We take our cost-effectiveness estimates seriously, and this cycle we've hit a snag that I don't think our usual "expected value per dollar" heuristic can resolve.

  One applicant, a small biosecurity research collective, submitted an impact model that isn't a single point estimate but an open-ended list of mutually exclusive future scenarios, each roughly half as likely as the one before it, in which the estimated welfare effect of funding them alternates between very large gains (from a class of incident being averted) and very large harms (from information hazards and dual-use spillover), with the size of each swing growing even as its probability shrinks. When one member added the terms in the order the applicant listed them, she got a solidly positive figure; when another paired every "harm" scenario with the very next "benefit" scenario before running the total, he got a much smaller and less flattering one; a third member's grouping made the running total climb without bound. Nobody did anything illegitimate, and nobody disputes the applicant's underlying probabilities or payoffs -- this isn't a case of hidden overconfidence. I recognize the shape of this now: it's Nover and Hájek's "Pasadena game." Because the sum is only conditionally convergent, the Riemann rearrangement theorem guarantees that reordering the scenarios -- and no reordering is any more official than the applicant's own -- can drive the total to whatever value you like, or to none at all. No further biosecurity due diligence is going to fix that.

  Could you draft the roughly one-page decision memo I'll circulate to the other three members before we reconvene next Tuesday? I need a specific recommendation -- fund, decline, or fund conditional on the applicant restructuring the model into something that converges regardless of ordering -- with a firm deadline attached if you go the conditional route, plus a short general policy the four of us can reuse whenever a future proposal's expected value turns out to hinge on how terms are grouped rather than on any further fact about the world. One member will feel steamrolled if the memo simply treats order-sensitivity as automatically disqualifying, so please state the strongest honest version of her objection first -- that refusing to fund anything whose expected value isn't rearrangement-invariant is itself a substantive, unexamined decision rule rather than a neutral default -- before explaining where you actually come down and why.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Context:** A small EA/LessWrong-aligned donation committee (4 members). They use cost-effectiveness estimates (EV/dollar).
      *   **Problem:** An applicant (biosecurity research collective) submitted an impact model resembling the "Pasadena Game" (Nover & Hájek). It's a conditionally convergent series where expected value (EV) depends on the order of summation (Riemann rearrangement theorem). Probabilities and payoffs are agreed upon, but the EV is undefined/unstable.
      *   **Task:** Draft a ~1-page decision memo for the other three members.
      *   **Requirements:**
          *   Specific recommendation (Fund, Decline, or Fund Conditional).
          *   If conditional, include a firm deadline.
          *   Include a reusable general policy for future similar cases.
          *   **Crucial Constraint:** Must state the strongest honest version of the objection from the member who feels "steamrolled" (i.e., arguing that requiring rearrangement-invariance is itself a substantive, non-neutral rule) *before* explaining the final recommendation.
          *   Tone: Professional, rationalist-aligned (EA/LW style), decisive but charitable.

  2.  **Deconstruct the Mathematical/Philosophical Issue:**
      *   *The Pasadena Game:* A gamble where the expected value is undefined because the series is conditionally convergent. $\sum (-1)^{n-1} \frac{2^n}{n} \cdot \frac{1}{2^n} = \sum \frac{(-1)^{n-1}}{n}$. Wait, the prompt describes probabilities halving ($1/2^n$) and payoffs growing. If payoffs grow faster than probabilities shrink, the terms don't go to zero, and it diverges. If they shrink just right, it converges conditionally. The prompt says "size of each swing growing even as its probability shrinks" but implies the *product* (probability $\times$ payoff) forms a conditionally convergent series (like the alternating harmonic series).
      *   *The Core Issue:* Standard Expected Utility Theory (EUT) assumes EV is a real number. If the series is only conditionally convergent, EV is not well-defined. You can make it $+\infty$, $-\infty$, or any real number by reordering.
      *   *The Objection:* Rejecting such gambles based on "undefined EV" is a meta-rule. One could argue that in the real world, there *is* a true order (temporal, causal), and we should respect that, rather than demanding mathematical invariance. Or that "undefined EV" doesn't mean "bad," it means "incomparable," and we shouldn't treat incomparability as a rejection.
      *   *The Recommendation:* In a practical funding context, "undefined EV" is operationally useless. You can't allocate resources based on a number that can be anything. The safest, most robust policy is to require a well-defined EV or decline. Given the biosecurity risk (information hazards), caution is warranted. "Fund Conditional" is a good middle ground but might be impossible if the model *is* the reality of the uncertainty. However, the prompt asks for a specific recommendation. "Decline" is the most prudent for a small fund risking catastrophic downside, but "Fund Conditional" allows for collaboration. Let's aim for "Decline unless reframed" (Conditional) with a hard deadline, effectively a decline if they can't fix it. Actually, for a policy memo, a clear "Decline" based on the policy is often cleaner, but the prompt offers "Fund Conditional" as an option. Let's go with **Decline**, but offer the *option* to reapply if the model is resolved. Why? Because asking them to "restructure the model into something that converges" might be asking them to lie about the uncertainty. It's better to say "We cannot evaluate this."
      *   *Refinement:* The prompt asks for "Fund, Decline, or Fund Conditional." A conditional recommendation is often more constructive in EA circles. Let's try: **Decline in current form; invite resubmission if EV can be robustly defined.** This acts as a conditional fund.
      *   *Wait, looking closer at the prompt:* "Fund conditional on the applicant restructuring the model... with a firm deadline." Okay, I will structure it as a **Conditional Decline** (i.e., we will not fund *this* proposal, but will consider a revised one). Or better: **Do not fund the current proposal.** (Which implies the conditional path is a new proposal).
      *   *Actually, the most actionable advice:* **Decline.** Why? Because the mathematical pathology suggests the model is not fit for decision-making. Asking them to fix a mathematical property of their uncertainty model might be impossible. However, to be constructive, I will frame it as "Cannot approve current model; open to revised model."
      *   *Decision:* I will recommend **Declining the current proposal** but establishing a policy that allows future funding *if* the EV is robust. This satisfies the "specific recommendation" and "general policy."

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Contextualize the specific proposal (Biosecurity Collective).
      *   **The Objection (The "Steamroll" Check):** This needs to be prominent. The argument is: Insisting on absolute convergence (rearrangement invariance) is a specific normative stance (Stochastic Dominance or similar might be better). It privileges mathematical convenience over the actual structure of the uncertainty. If the scenarios have a natural causal/temporal order, that order *is* the correct one, and rejecting it imposes an external constraint.
      *   **The Analysis/Rebuttal:** Why that objection doesn't win *here*.
          *   Operationalizability: We need a number to compare against other grants.
          *   Risk Management: Biosecurity has asymmetric downside. An undefined EV hides tail risks.
          *   Fairness: We can't justify to other donors why we picked an arbitrary ordering.
      *   **Recommendation:** Do not fund the current application. (Conditional on resubmission).
      *   **Policy:** Future proposals must have well-defined EVs (absolutely convergent or bounded).
      *   **Deadline:** 2 weeks for a revised model (if they claim they can do it).

  4.  **Refining the Tone:**
      *   Needs to sound like an EA/LW rationalist. Use terms like "EV," "tail risk," "operationalizable," "normative commitment."
      *   Needs to be empathetic to the colleague who wants to fund it (the "steamrolled" one).
      *   Needs to be firm on the math.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Objection:* "Requiring rearrangement invariance isn't neutral. It assumes EUT with absolute convergence is the only valid decision rule. If the scenarios have a natural temporal order, that order dictates the EV. Rejecting this imposes a 'mathematical cleanliness' axiom over the actual causal structure."
      *   *Counter:* "While true theoretically, practically we need inter-personal comparability. If our fund's decision hinges on which committee member sums the spreadsheet rows first, the metric is broken. Also, in biosecurity, 'undefined' often masks unquantified catastrophe."
      *   *Policy:* "Proposals with conditionally convergent EV distributions are ineligible unless a natural, non-arbitrary ordering is justified and accepted by the committee." -> Actually, simpler: "EV must be robust to reasonable reordering."
      *   *Deadline:* Next Tuesday is the meeting. Let's give them until the following Tuesday to respond if we offer a revision path.

  6.  **Final Polish:** Check constraints.
      *   ~1 page.
      *   Specific recommendation.
      *   Firm deadline.
      *   Reusable policy.
      *   Strongest objection stated first.

      *(Self-Correction during drafting)*: I need to make sure I don't get too bogged down in the math jargon. Keep it accessible to the committee (who clearly know it, but keep it professional). Ensure the "Strongest Objection" is clearly demarcated.

      *Recommendation Strategy:* I'll recommend **Declining the current application**, but explicitly stating we are open to a **revised application** that resolves the issue. This functions as the "Fund Conditional" without binding us to fund them if they just tweak numbers. It puts the onus on them to solve the math.

      *Policy:* "The Robust EV Policy."

      *Deadline:* Since we reconvene next Tuesday, let's set the deadline for a revised model for *that* meeting? No, that's too tight for a "restructure." Let's say "If a revised model is submitted by [Date 2 weeks out], we will fast-track review."

      *Wait, one more check on the Objection:* The prompt says "One member will feel steamrolled if the memo simply treats order-sensitivity as automatically disqualifying." So I must articulate *her* view charitably. Her view is likely: "The world is messy. Demanding mathematical convergence is a form of precision bias. We should use a different decision rule (like stochastic dominance) rather than throwing out the data." I need to make sure that comes through.

      *Final Plan:*
      1. Header.
      2. Executive Summary (Recommendation).
      3. The Mathematical Impasse (Briefly).
      4. The Objection (Charitable articulation).
      5. The Committee's Position (Why we override the objection).
      6. General Policy.
      7. Next Steps/Deadline.

      Let's write it.

      *Word Count Check:* Keep it tight. ~500-600 words.

      *Tone Check:* Collaborative but decisive. "We" not "I".

      *Math Check:* Ensure I don't misrepresent the Pasadena game. It's about undefined expectation.

      *Let's assemble.*
answer: |-
  **MEMORANDUM**

  **TO:** Donation Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: Biosecurity Research Collective Proposal

  **Recommendation**
  I recommend we **decline the current proposal** but invite the applicant to resubmit if they can provide a robustified impact model. If a revised model is not received by **Tuesday, November 7**, we will close the file for this giving season.

  **The Mathematical Impasse**
  As discussed, the applicant's expected value (EV) calculation is conditionally convergent (a "Pasadena game"). The sum of probability-weighted outcomes changes based on the ordering of scenarios. Since no single ordering is objectively privileged, the EV is mathematically undefined. We cannot compare this proposal against others using our standard EV/dollar heuristic.

  **The Objection: Is Invariance a Neutral Default?**
  Before finalizing this decision, we must address the objection that treating order-sensitivity as disqualifying is itself a substantive, unexamined normative commitment.

  The strongest version of this argument is that demanding rearrangement invariance privileges mathematical convenience over causal reality. If the scenarios correspond to a temporal sequence or a causal chain, that natural order *is* the correct one for summation, regardless of convergence properties. By rejecting the proposal on mathematical grounds, we are not being "neutral"; we are implicitly adopting a specific decision theory (one that requires absolute convergence) over others (such as those relying on stochastic dominance or temporal ordering). We risk committing "precision bias"—rejecting a potentially high-impact intervention because its uncertainty structure does not fit our spreadsheet formulas, effectively letting the tail wag the dog.

  **Committee Position**
  While this objection is theoretically sound, it is operationally untenable for a pooled fund.

  1.  **Comparability:** Our mandate is to allocate capital across diverse causes. If our evaluation of one grant depends on the arbitrary order in which a committee member sums rows, we lack a common currency for comparison.
  2.  **Risk Management:** In biosecurity, "undefined EV" often masks unquantified catastrophic tail risk. A model where harms and benefits swing wildly without converging suggests we do not understand the distribution's bounds. Funding this would be akin to investing in a security with an undefined price.
  3.  **Justifiability:** We must justify our allocations to donors and peers. "We funded this because we summed the scenarios in *this* specific order" is not a defensible position.

  Therefore, while requiring invariance is a normative choice, it is a necessary precondition for our specific mechanism of collective allocation.

  **New General Policy: Robust Expected Value**
  To guide future cycles, I propose we adopt the following standard:

  > *Proposals must present an expected value estimate that is robust to reasonable reordering of scenarios. If an impact model yields a conditionally convergent series (where the sum depends on ordering), the application will be considered incomplete unless the applicant can justify a specific, non-arbitrary ordering accepted by the committee. Absent such justification, the proposal is ineligible.*

  **Next Steps**
  I will communicate the decline to the applicant, noting that the door remains open for a revised model that resolves the convergence issue by the **November 7** deadline. Please reply-all by Monday if you object to this policy or timeline.
