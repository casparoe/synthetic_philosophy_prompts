  7.  **Final Polish:** Check flow and voice. Make sure they interrupt or acknowledge each other's points naturally. (e.g., "But that's exactly where the analogy breaks...")

  *(Self-Correction during final review)*: I need to make sure Elena defends the *specific* Article V clause about the Senate, not just general constitutionalism. Marcus should attack that specific clause as the most undemocratic feature.

