      *   **Opening Salvo:** Elena introduces the Ulysses Pact analogy regarding Article V. Marcus immediately challenges the "who is tying whom" aspect.
      *   **Round 1: The Nature of Precommitment:**
          *   Elena: It's about protecting democracy from itself (tyranny of the majority).
          *   Marcus: But is it *us* protecting *us*, or *them* protecting *themselves* from *us*?
      *   **Round 2: The Ulysses Analogy (The Core Request):**
          *   Elena: Ulysses knew he'd be irrational later. We know we might be passionate later.
          *   Marcus: Ulysses could untie himself if the crew agreed. The dead can't untie the ropes. The "crew" today didn't sign the contract.
      *   **Round 3: Stability vs. Legitimacy:**
