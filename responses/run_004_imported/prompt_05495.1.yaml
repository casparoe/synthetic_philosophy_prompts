      *   *The Problem:* If the margin shrinks to zero at the boundary, then *at the boundary*, you would need perfect discrimination. But the setup assumes the steps are *subjectively indistinguishable*. If $t_i$ and $t_{i+1}$ are phenomenally identical, you cannot know you are at $t_i$ and not $t_{i+1}$. If the margin shrinks to zero, it implies you *can* distinguish the boundary case from the non-boundary case. But ex hypothesi, you can't.
