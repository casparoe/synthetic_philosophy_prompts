answer: |-
  Your hunch is spot-on. Lumping the Pasadena Paradox in with St. Petersburg as merely "St. Petersburg with alternating signs" is a common pedagogical shortcut, but it obscures a fundamental categorical difference. They are not just different in degree; they are pathological in different *dimensions*.

  For a seminar, you want to highlight that while St. Petersburg challenges the *plausibility* of Expected Utility Theory (EUT), Pasadena challenges its *coherence*.

  Here is the breakdown you need for your seminar, structured by the mathematical distinction, the normative severity, and the "bite" of the rearrangement problem.

  ### 1. The Mathematical Distinction: Divergence vs. Undefinedness

  The core difference lies in the behavior of the infinite series representing the expected value.

  *   **St. Petersburg (SPP):** The series is **divergent**.
      $$ \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot 2^n = \sum_{n=1}^{\infty} 1 = \infty $$
      The expected value is well-defined; it is positive infinity. The mathematical object exists, but it conflicts with our intuition about rational pricing.
  *   **Pasadena (PP):** The series is **conditionally convergent**.
      $$ \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot \left( (-1)^{n-1} \frac{2^n}{n} \right) = \sum_{n=1}^{\infty} \frac{(-1)^{n-1}}{n} = \ln(2) $$
      *Wait,* you might say, "That sums to $\ln(2)$." But by the **Riemann Rearrangement Theorem**, a conditionally convergent series can be rearranged to sum to *any* real number, or to $\pm \infty$.
      In measure-theoretic probability, the expectation is defined via the Lebesgue integral, which requires **absolute convergence** ($\sum |x_n|p_n < \infty$) for the expectation to be well-defined. Since the Pasadena game fails absolute convergence, **the expected value is formally undefined.**

  **The Seminar Point:** St. Petersburg gives you an answer you don't like ($\infty$). Pasadena gives you *no answer at all*.

  ### 2. Which is the Bigger Normative Problem?

  Pasadena is the more severe threat to EUT as a normative theory. Here is why:

  **A. Action Guidance**
  *   **SPP:** EUT is action-guiding, albeit counterintuitively. It tells you: "Pay any finite amount to play this game." You can disagree with the theory, but the theory has spoken. You can patch this by imposing a normative constraint (e.g., bounded utility functions), which resolves the paradox without breaking the machinery of EUT.
  *   **PP:** EUT is silent. If the expectation is undefined, the theory cannot rank the Pasadena gamble against a sure thing of $0, or against the St. Petersburg gamble. A normative theory that fails to rank acts in a simple choice situation is functionally broken. It's not that it gives the wrong advice; it's that it cannot speak.

  **B. Violation of Dominance (The Altadena Variation)**
  The normative bite gets sharper if you introduce the **Altadena Paradox** (a variant proposed by Nover and Hájek).
  *   **Pasadena Game:** Payoffs $(-1)^{n-1} \frac{2^n}{n}$.
  *   **Altadena Game:** Payoffs $(-1)^{n-1} \frac{2^n}{n} + 1$.
  *   **The Problem:** The Altadena game pays exactly $1 more than the Pasadena game in every possible state of the world. By **Statewise Dominance**, a rational agent must prefer Altadena to Pasadena.
  *   **The EUT Failure:** Because the Pasadena expectation is undefined, adding 1 to every term shifts the rearranged sum by 1, but since the original sum could be anything, the ranking remains undefined. EUT cannot formally capture the dominance relation here because the values it operates on do not exist.

  ### 3. Does the Rearrangement Business Have "Decision-Theoretic Bite"?

  This is the crux of your second question. Is the Riemann Rearrangement Theorem just a mathematical curiosity, or does it matter for an agent holding a ticket?

  **It has real bite, because it breaks the Law of Large Numbers (LLN).**

  Many defenses of EUT rely on a frequentist intuition: "If you play this gamble many times, your average payoff will converge to the Expected Value."
  *   **In SPP:** The LLN fails (the average grows without bound), but it grows predictably.
  *   **In PP:** Because the series is not absolutely convergent, the **Strong Law of Large Numbers does not apply.**

  If a rational agent plays the Pasadena game repeatedly, the sample mean of their payoffs **will not converge**. It will oscillate indefinitely. There is no "long-run average" to anchor the expectation.

  **Why this matters for your seminar:**
  If you argue that the "rearrangement" is just math trivia, you are assuming the order of summation is arbitrary. But in decision theory, the "order" corresponds to how we partition the state space. If the value of a gamble depends on how we describe or partition the states (which is essentially what rearranging the series amounts to), then **value is not intrinsic to the gamble.**

  This leads to a **Frame Dependence** problem. If I describe the outcomes by index $n=1, 2, 3...$ I get one value. If I describe them by grouping positive outcomes first, I get $+\infty$. If I group negatives first, I get $-\infty$. A normative theory of rationality should be invariant to the description of the states. Pasadena proves EUT is not invariant under conditions of conditional convergence.

  ### 4. Summary for the Seminar

  To summarize the comparison for your participants:

  | Feature | St. Petersburg | Pasadena |
  | :--- | :--- | :--- |
  | **Series Type** | Divergent ($+\infty$) | Conditionally Convergent (Undefined) |
  | **EUT Verdict** | Value is Infinite | Value is Undefined |
  | **Primary Pathology** | **Magnitude:** Value exceeds intuition. | **Existence:** Value fails to exist. |
  | **Dominance** | Preserved (mostly) | Violated (via Altadena variant) |
  | **Long Run (LLN)** | Diverges predictably | Oscillates/No convergence |
  | **Fix** | Bounded Utility | Requires abandoning standard EUT integration |

  ### 5. Recommended Discussion Angles

  1.  **The "Silence" Argument:** Ask the group: Is a theory that gives the wrong answer (SPP) better or worse than a theory that gives no answer (PP)? (Most argue silence is fatal for a *normative* theory).
  2.  **The Integration Definition:** Discuss whether decision theory should adopt the Lebesgue integral requirement (absolute convergence) as a rationality constraint. If so, Pasadena games are "illegitimate" lotteries. But why? What physical fact makes them impossible?
  3.  **Finite vs. Infinite:** Is the problem merely that we are dealing with infinite state spaces? If so, does this imply EUT is only a theory for finite worlds? (This leads into the Arntzenius, Elga, and Hawthorne arguments on infinite ethics).

  **Key Citation:** Ensure you reference **Nover and Hájek (2004), "Vexing Expectations"**. They are the originators of the Pasadena paradox and make the specific argument about the rearrangement problem being decision-theoretically significant, not just mathematically so. Also, **Colyvan (2006)** on "No Expectations" is excellent for the normative implications.

  **Verdict:** Your hunch is correct. Pasadena is not just "St. Petersburg Jr." It is a deeper structural failure of the expectation operator itself.
