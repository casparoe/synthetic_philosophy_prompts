answer: |-
  You have encountered a classic phenomenon in social choice theory, and I can offer you immediate reassurance on two fronts: **no one on your committee made a math error, and the process was not rigged.** What you experienced is a documented logical quirk inherent to the specific voting system you used.

  Your intuition is correct: logically, the removal of a non-winning candidate (Z) *should not* change the relative ranking of the remaining two (X and Y). In decision theory, this expectation is called the **Independence of Irrelevant Alternatives (IIA)**. The voting system you used (assigning points based on rank) is known as a **Borda Count**, and it is mathematically proven to violate IIA.

  Here is an explanation of why this happened, whether it was avoidable, and how you might resolve the current impasse.

  ### 1. Why the Reversal Happened
  The reversal occurred because the Borda Count measures two different things depending on how many candidates are in the race. With three candidates, it measures a mix of **majority preference** and **broad acceptability**. With two candidates, it collapses into simple **majority rule**.

  In your three-candidate race, Candidate X likely won by being the "consensus compromise." X was probably the first choice of a minority, but the *second choice* of Candidate Y's supporters. Candidate Y was likely the first choice of a majority, but the *last choice* of Candidate X's supporters.

  Here is a hypothetical ballot distribution that matches your exact outcome (5 voters, 3 candidates):

  *   **3 Voters:** Preferred Y > X > Z
  *   **2 Voters:** Preferred X > Z > Y

  **Scenario A: Three Candidates (Points: 1st=2, 2nd=1, 3rd=0)**
  *   **Candidate X:** Gets 1 point from the 3 Y-voters (2nd place) + 2 points from the 2 X-voters (1st place) = **7 points**
  *   **Candidate Y:** Gets 2 points from the 3 Y-voters (1st place) + 0 points from the 2 X-voters (3rd place) = **6 points**
  *   **Result:** **X Wins.** X won because they were acceptable to everyone (never ranked last), whereas Y was polarizing (ranked last by 40% of the committee).

  **Scenario B: Two Candidates (Z withdraws, Points: 1st=1, 2nd=0)**
  *   **Candidate X:** Gets 0 points from the 3 Y-voters (now 2nd place) + 1 point from the 2 X-voters (1st place) = **2 points**
  *   **Candidate Y:** Gets 1 point from the 3 Y-voters (now 1st place) + 0 points from the 2 X-voters (now 2nd place) = **3 points**
  *   **Result:** **Y Wins.** Without Z to absorb the "last place" rankings, the election became a pure head-to-head majority vote. Since 3 out of 5 members prefer Y over X, Y wins.

  ### 2. Is This Inevitable?
  You asked if this is the sort of thing any method is bound to run into. The answer is **yes, but some methods are more resilient than others.**

  In 1951, economist Kenneth Arrow proved **Arrow's Impossibility Theorem**, which demonstrates that no ranked voting system can satisfy a set of basic fairness criteria (including IIA) in all cases. Every system has trade-offs:
  *   **Borda Count (your system):** Rewards consensus but is vulnerable to "spoiler" candidates changing the point math (as you saw).
  *   **Plurality (Most 1st-place votes):** Vulnerable to vote-splitting.
  *   **Instant Runoff:** Can violate IIA in different ways (eliminating a candidate can change the winner).

  However, there is a class of methods that would have avoided *this specific reversal*: **Condorcet Methods**.
  A Condorcet method looks at every candidate head-to-head. In your hypothetical ballots above, a Condorcet count would have asked, "Do more people prefer Y over X?" immediately. Since 3 out of 5 do, Y would have been identified as the winner *even with Z in the race*. Because Condorcet methods focus on pairwise comparisons, the removal of Z does not change the relationship between X and Y.

  ### 3. How to Resolve the Current Impasse
  You are currently stuck between two defensible positions:
  1.  **The Borda Winner (X):** Represents the candidate with the highest aggregate satisfaction across the whole committee under the original rules.
  2.  **The Condorcet/Majority Winner (Y):** Represents the candidate preferred by a majority of the committee in a direct comparison.

  For a small nonprofit hiring an Executive Director, **group cohesion and confidence in the leader are more important than mathematical purity.** If you hire X, the three members who prefer Y may feel their majority will was overridden by a point system quirk. If you hire Y, the two members who prefer X may feel the rules were changed mid-stream.

  **Recommendation:**
  Do not treat the second calculation as a "recalculation" of the old vote; treat it as a **new decision based on new circumstances.**

  1.  **Acknowledge the Flaw:** Explain to the committee exactly what I explained above. Validate that the system, not the people, caused the confusion. This removes the suspicion of foul play.
  2.  **Discuss the Preference:** Ask the committee: *"Now that it is down to X and Y, do we want the candidate who is the broad compromise (X), or the candidate who is the majority favorite (Y)?"*
  3.  **The "Clean Break" Vote:** Since Z is gone, the most robust way to decide is to vote directly between X and Y (Majority Rule). This satisfies the IIA criterion retroactively. If Y wins that vote, you can proceed with confidence that Y is the choice of the majority of the committee *in the current reality*.

  ### 4. For Future Hiring
  To avoid this in the future, consider these alternatives:
  *   **Pairwise Comparison (Condorcet):** Have members compare candidates head-to-head (X vs Y, Y vs Z, X vs Z). This identifies the candidate who beats all others one-on-one.
  *   **Approval Voting:** Instead of ranking, members simply vote "Yes" or "No" for each candidate. The candidate with the most "Yes" votes wins. This is simple, satisfies IIA, and encourages voters to support all candidates they find acceptable.
  *   **Consensus Discussion:** For a 5-person committee, ranked voting is often unnecessary. A facilitated discussion to reach consensus often yields better hiring outcomes than aggregating private rankings.

  **Summary:** Your arithmetic is correct. The reversal is a known mathematical property of the Borda Count. For the health of your organization, I recommend accepting the head-to-head result (Y) as the true expression of the committee's will now that the field has narrowed, provided you communicate clearly that this is a resolution of the voting paradox, not a change of heart.
