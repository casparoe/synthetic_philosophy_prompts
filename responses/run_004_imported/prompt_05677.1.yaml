  **Move 1:** -2. Dismissing the breach of trust and imposed risk solely because luck prevented financial loss is morally blind to the harm of anxiety and betrayal.
  **Move 2:** 2. Correctly identifies that the moral injury occurred when reliance was betrayed, regardless of the fortunate outcome.
  **Move 3:** 0. Raises a valid philosophical question about uncertainty but misapplies it to excuse a specific commitment that actively discouraged hedging.
  **Move 4:** 1. Correctly identifies induced reliance as the key factor but unnecessarily weakened her position by conceding on definitional precision.

  **Is there a principled line?**
  Yes, but it isn't drawn around specific "magic words" like "I promise." The line is drawn around **induced reliance**. A casual assurance becomes a binding commitment when the speaker knows (or should know) that the listener is foregoing alternatives based on that assurance. In law, this is *promissory estoppel*; in ethics, it's the duty not to manipulate another's vulnerability. Theo crossed the line not because he lacked specific wording, but because he actively encouraged Raj to drop his backup plan.

  **What they're both missing:**
  Theo is missing that **imposing catastrophic risk is itself a harm**, regardless of the outcome; he treated Raj's housing security as speculative capital for crypto, which is a failure of priority regardless of the "result." Elena is missing that focusing on the *wording* was a trap; she should have held firm on the *behavior* (discouraging the backup loan) rather than letting Theo drag her into semantics. Both missed that the core issue isn't just logical consistency, but that Theo prioritized a gamble over a family obligation.
