answer: |-
  **MEMORANDUM**

  **TO:** Prediction Market Steering Committee
  **FROM:** [Your Name/Committee Chair]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Insider Trading Policy and Market Structure

  ### 1. Executive Decision

  After reviewing the competing proposals regarding trading eligibility, the Committee has reached the following ruling:

  **Project insiders (e.g., engineers, product managers) ARE permitted to trade on markets related to their own work, subject to Position Limits and Mandatory Disclosure tags.**

  We will not implement a blanket ban on insider participation. However, to address the valid concerns regarding market fairness and liquidity, we are simultaneously implementing a **Liquidity Subsidy Protocol** and **Position Caps** to ensure the market remains viable for non-insiders.

  ### 2. Context and Dispute

  The Committee has been divided on a fundamental design question: Should employees with private information about a project be allowed to trade on that project's outcome?

  *   **The Restrictionist View:** Allowing insiders to trade creates an asymmetry akin to financial insider trading. Non-insiders, recognizing they are at an informational disadvantage, will refuse to take the other side of the bet (adverse selection). This leads to demoralization, reduced participation from the general staff, and the perception that the bonus pool is rigged.
  *   **The Aggregationist View:** The primary utility of a prediction market is information aggregation. If the people who know the most (the engineers) are silenced, the market price reflects only public rumor, rendering the forecast useless for leadership decision-making. Banning them creates a "thin" market that looks fair but predicts nothing.

  ### 3. Rationale

  This decision prioritizes **forecast accuracy** while mitigating **participation risk**. We have evaluated the Restrictionist argument seriously and acknowledge its theoretical strength, particularly regarding the **No-Trade Theorem**.

  **Why we considered the Restrictionist View:**
  The Restrictionist side correctly identifies that in a zero-sum game with rational agents, common priors, and private information, trade should not occur. If a general employee sees an engineer betting heavily on "Ship Date: Q4," the employee should infer the engineer knows something and update their own belief without trading. If everyone reasons this way, liquidity dries up. Furthermore, if the bonus pool is finite, a group of informed insiders could theoretically drain the pool from uninformed outsiders, creating a genuine morale hazard and turning the tool into a wealth transfer scheme rather than a forecasting tool.

  **Why we ruled for Aggregation:**
  Despite the above, a corporate prediction market is not a pure financial exchange; it is a **subsidized information gathering mechanism**.

  1.  **The Subsidy Overrides No-Trade:** The No-Trade Theorem holds in purely zero-sum environments. Our market is positive-sum due to the bonus pool subsidy. We are effectively paying outsiders a premium (the chance at bonus points) to provide liquidity against insiders. The outsiders are not expected to win on every trade; they are compensated for the risk of trading against informed counterparts by the overall pool distribution.
  2.  **Incentive Compatibility:** If we ban insiders, we remove their incentive to reveal private information through the market. An engineer who knows a ship date is slipping has no way to profit from that knowledge if banned, and may instead resort to informal channels or silence. We want them to "put their money where their mouth is."
  3.  **The "Useless Market" Risk:** A market where only uninformed participants trade is merely a popularity contest. For leadership to use these forecasts for resource allocation, the price must reflect the *true* probability, which requires the informed parties to be active.

  ### 4. New Trading Policy & Guardrails

  To balance the need for information with the need for fairness, the following rules are effective immediately:

  **A. Mandatory Disclosure ("Insider Tag")**
  Any trader who is directly working on a project must be flagged in the system. When they place a trade, the order book will display an "Insider Activity" indicator. This allows outsiders to see when informed money is moving and adjust their strategies accordingly. Transparency mitigates the asymmetry.

  **B. Position Limits**
  No single participant may hold more than 15% of the total open interest on any single market. This prevents a small group of engineers from cornering the market or draining the bonus pool entirely. It ensures there is always room for outsiders to participate and keeps the market liquid.

  **C. The Liquidity Subsidy (Market Maker)**
  To address the concern that outsiders will be scared off by insiders, the Committee will allocate 20% of the total bonus pool to a **Liquidity Mining** program. Points will be awarded not just for final accuracy, but for providing volume during periods of low liquidity. This subsidizes the "noise traders" who are essential for the market to function, ensuring they are rewarded for participation even if they lose on specific trades against insiders.

  **D. Blackout Periods**
  Trading on a specific market will close 48 hours before the official company announcement or deadline. This prevents last-minute manipulation or panic selling based on non-actionable last-second news.

  ### 5. Implementation Plan

  1.  **System Update:** Engineering will tag user accounts with project affiliations by [Date].
  2.  **Communication:** We will send an all-hands email explaining that while insiders are allowed to trade, position limits and subsidies are in place to keep the game fair. We must explicitly frame the bonus pool as a subsidy for accuracy, not a salary supplement.
  3.  **Review:** We will review participation metrics after Q1. If outsider participation drops by more than 30%, we will revisit the Position Limits.

  ### 6. Conclusion

  We are building a tool to improve company decision-making, not a casino. While the Restrictionist concern regarding fairness is valid, a fair market that predicts incorrectly is more dangerous than an asymmetric market that predicts accurately. By subsidizing liquidity and capping positions, we can harness the engineers' knowledge without alienating the broader staff.

  Approved by the Steering Committee.
