  *   *Critique:* The definition of "Cartesian" is roughly correct ($\phi$ is Cartesian if $K\phi$ is consistent). The assessment of the "ad hoc" charge is a standard defense of Tennant. Some philosophers argue it *is* ad hoc because the class of Cartesian propositions is defined specifically to exclude the Fitch conjunctions, but the student's defense is a standard, acceptable philosophical position in this context.
