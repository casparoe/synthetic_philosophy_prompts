answer: |-
  Your impression is tracking something very real, both in moral philosophy and in the underlying logic of legal systems. Your first friend is relying on a simplistic view of evidence ("without proof, claims are equal"), while your second friend is sensing a procedural violation they can't name.

  The grievance you feel is not necessarily about the grass itself, but about the **privatization of adjudication** and the violation of the **status quo as a provisional peace.**

  Here is a breakdown of why your intuition about fairness is correct, even in the absence of a survey.

  ### 1. The Moral Weight of the Status Quo
  In political philosophy (particularly in the work of David Hume), stability of possession is often valued higher than abstract correctness. Why? because uncertainty is costly. When two parties have disputed a boundary for a year and then agreed—tacitly, by inaction—to leave the old fence where it stood, that fence became a **Schelling point**. It was a focal point of coordination that allowed you to live without conflict.

  By tearing down the fence, your neighbor didn't just move a physical object; he unilaterally dissolved a social contract. Even if the old fence was in the "wrong" geometric spot, it represented an agreed-upon reality. Your grievance is valid because the neighbor prioritized his *potential* correctness over the *actual* peace you had established. In almost every legal system, the burden of proof is on the person seeking to disturb the status quo, not on the person wishing to maintain it. Your friend who said your claims are "no better or worse" is ignoring that possession and history carry their own evidentiary weight.

  ### 2. Procedural Justice vs. Substantive Justice
  There is a distinction between *substantive justice* (who actually owns the land) and *procedural justice* (how we decide who owns the land).

  Since neither of you can afford the survey, you are in a state of epistemic uncertainty (you don't know the truth). In a civilized society, when we cannot know the truth, we rely on process to resolve disputes. The "process" is supposed to be negotiation, mediation, or court.

  Your neighbor bypassed the process. He acted as judge, jury, and executioner. He effectively said, "I have decided the truth, and I have the resources to enforce it." Your feeling of unfairness stems from the fact that **he collapsed the distinction between "being right" and "being strong."** Fairness requires that the mechanism for resolving the dispute be independent of the power dynamics of the disputants. By making the resolution dependent on who is willing to spend money on a lawsuit, he turned a property dispute into a contest of resources.

  ### 3. The "Might Makes Right" Problem
  You asked whether acting first and making it stick is *really* all that separates your claims. Factually, in this specific instance, yes: he now controls the land. But morally and legally, no.

  If we accept that "ability to enforce" equals "rightness," we return to a Hobbesian state of nature where justice is simply the will of the stronger party. Legal systems are designed specifically to prevent this. They exist to protect the party who *cannot* afford to fight from the party who *can*.

  The injustice you feel is the recognition that the system has failed to protect you from this dynamic. Because the cost of the survey/lawsuit exceeds the value of the land, the law is effectively inaccessible. Your neighbor exploited this **access-to-justice gap**. He knew the cost of verification was higher than the value of the asset, so he gambled that you wouldn't pay to verify. That is a form of coercion. It is unfair because it leverages economic asymmetry to dictate reality.

  ### 4. The Grievance is Real
  Your first friend suggests you are just "annoyed at having lost." This assumes the situation was a game with neutral rules. It wasn't. The rules changed when he tore down the fence.

  You have a legitimate grievance because:
  1.  **Presumptive Possession:** You were in possession of that strip (treating it as yours, maintained by the old fence). He dispossessed you without consent.
  2.  **Unilateral Adjudication:** He decided a disputed fact without mutual agreement or third-party verification.
  3.  **Exploitation of Asymmetry:** He relied on the fact that you are reasonable (don't want to sue) and he is not, to gain an advantage.

  ### Conclusion
  Your intuition is tracking a fundamental principle of justice: **Claims should be validated by evidence or process, not by the capacity for unilateral enforcement.**

  The fact that you cannot prove he is wrong geometrically does not mean he is right procedurally. He has established *control*, but he has not established *right*. The unfairness lies in the fact that, due to the high cost of truth (the survey), control is the only thing that currently matters. That is a failure of the situation, not a failure of your moral reasoning. You are right to feel that a boundary fixed by "who acted first" is inferior to one fixed by agreement or evidence, even if you cannot afford to change it back.

  *Disclaimer: I am an AI, not an attorney. This is an ethical and philosophical analysis of your situation, not legal advice. Property laws vary significantly by jurisdiction.*
