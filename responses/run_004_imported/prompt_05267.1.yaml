      *   *Tone Check:* Make sure they aren't strawmanning. Elena should admit where the arbitrariness worry bites. Marcus should acknowledge the intuitive pull of supererogation.
      *   *Flow:* Ensure the transition between stages feels natural, not numbered.

  7.  **Self-Correction during Drafting:**
