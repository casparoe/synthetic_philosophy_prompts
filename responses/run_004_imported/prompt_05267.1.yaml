answer: |-
  **Setting:** *A quiet corner of a café, long past closing time. The remnants of a bottle of red wine sit between them. Elena and Marcus are both exhausted but alert, the way one gets after hours of dense theoretical wrestling.*

  **Marcus:** Let's try to pin the butterfly down. You're defending a zone of permission—a baseline of required giving, say ten percent of income—beyond which further sacrifice is supererogatory. You're leaning on Scheffler's agent-centered prerogative to justify why I'm not *required* to give fifty percent, even if fifty percent would do more good.

  **Elena:** That's the gist. The prerogative allows me to assign a certain extra weight to my own interests and projects. It acknowledges that I am not merely a vessel for the good. I can pursue my own life, provided I stay above a threshold of contribution.

  **Marcus:** Okay. Stage one of my worry is simply locational. Where is that threshold? Why ten percent? If the justification for the prerogative is that strict impartiality is too demanding—that it asks too much of our psychological makeup—then surely the permitted deviation should scale with the demand. If giving ten percent is "costly" enough to trigger the prerogative, why isn't giving five percent costly enough? Or one percent? What non-arbitrary principle fixes the baseline at ten percent rather than sliding down toward zero?

  **Elena:** You're treating the prerogative like a tax exemption bracket that we're haggling over. But it's not about calculating the precise cost of every dollar. It's about protecting the integrity of the agent. Scheffler's point is that a moral theory that requires me to abandon my own projects whenever the impartial good slightly outweighs them is alienating. It severs the connection between me and my life. The ten percent isn't derived from a calculus of marginal utility; it's a recognition of the minimum necessary to maintain my status as an independent center of agency. Below that, I'm a free rider on the moral cooperation of others. Above that, I'm a saint.

  **Marcus:** But "free rider" implies a duty you're violating. If the prerogative licenses me to favor myself, why does the duty stop at ten percent? If the rationale is "protecting agency," then surely my agency is just as threatened by the sacrifice of fifty percent as it is by ten. In fact, more so. If I give fifty percent, I might have to quit my job, move to a cheaper apartment, forego having children. That threatens my "projects" far more than ten percent does. So, if the prerogative exists to protect projects, shouldn't it permit me to keep that fifty percent?

  **Elena:** No, because there's a distinction between *protecting* a life and *optimizing* a life. The prerogative isn't a blank check to maximize my own welfare. It's a limited license to avoid being subsumed by the impartial standpoint. We have to distinguish between the *option* to favor oneself and the *obligation* to contribute to the common good. The baseline represents the point where the claim of the other becomes so urgent that my personal projects can no longer legitimately override it. Ten percent is significant. It's real sacrifice. It acknowledges the claim of the distant needy without obliterating the claim of the near self.

  **Marcus:** That sounds plausible until you ask *why* that specific point is where the "claim of the other" overrides the "claim of the self." You're saying ten percent is "real sacrifice." But for a high earner, ten percent might be a luxury car. For a low earner, it's rent. If the principle is about the *cost* to the agent, the percentage can't be fixed. If the principle is about the *need* of the recipient, then ten percent is laughably low compared to the need. You seem to be smuggling in a premise here.

  **Elena:** I'm not smuggling it; I'm owning it. The premise is that morality must be stable for beings like us.

  **Marcus:** Which brings me to my second pressure point. You're appealing to "stability for beings like us." But when we strip away the varnish, isn't that just an appeal to commonsense morality? We feel that giving fifty percent is too much, so we posit a theory that says giving fifty percent is too much. Kagan's charge in *The Limits of Morality* is precisely this: you're rationalizing our prejudices. You want the *category* of supererogation because we admire saints but don't want to be them. But if you can't ground the baseline in something deeper than "this feels reasonable to us," then the category isn't philosophically stable. It's just a systematic endorsement of the status quo.

  **Elena:** I reject the idea that appealing to the conditions of human agency is merely codifying prejudice. It's a structural claim. If a moral theory requires agents to act in ways that are psychologically unsustainable, it defeats its own purpose. It becomes a theory that no one can follow, and thus generates more guilt than good. Satisficing consequentialism, like Slote's, offers a principled way out here. It says an act is right if it produces *good enough* consequences, not *the best* consequences. "Good enough" isn't defined by what commonsense thinks; it's defined by a threshold of optimality. If I give ten percent, I have produced a state of affairs that is sufficiently good. Giving fifty percent produces a *better* state, but not one that is *required* for the act to be right.

  **Marcus:** But where does the "sufficiently" come from? In engineering, "good enough" is defined by the specifications of the system. In morality, what are the specifications? If the good is the welfare of sentient beings, then "more good" is always better than "less good." To say "this amount is enough" implies there's a point where additional welfare doesn't count as much. But why? Does the suffering of the child I could have saved with that extra forty percent count for less because I've already saved *some* children?

  **Elena:** It's not that the suffering counts for less. It's that the *demand* on the agent has a limit. Slote's view is that we can maximize up to a point, and then stop. The principle isn't "maximize until it hurts"; it's "maximize until you have done your fair share."

  **Marcus:** "Fair share." Now we're really in trouble. That's the third stage of the squeeze. You're caught in a dilemma, Elena. Either the justification for the prerogative is based on the *cost* to the agent, or it's based on a *deontological constraint* against demanding too much.
  If it's based on cost: Then as the cost of compliance rises, the permission to deviate must rise. If giving fifty percent ruins my life, the prerogative should allow me to give nothing. You can't have a fixed baseline if the rationale is cost.
  If it's based on a constraint: Then you're admitting that impartial maximization isn't the whole story. But if you admit that, why does the constraint stop at ten percent? Why isn't the constraint "you never have to sacrifice your own fundamental projects"? If that's the constraint, then giving fifty percent is never required.
  So you collapse into one of two poles: Either you slide toward near-total self-preference because the costs of morality are always high, or you slide back toward full maximization because any fixed limit looks arbitrary against the magnitude of the need. The middle ground washes away.

  **Elena:** I don't think the middle ground washes away; I think you're assuming a binary view of rationality. You assume that if I'm permitted to keep some money, it must be because the money matters *more* than the good it would do. But that's not the prerogative view. The prerogative says I am permitted to give the money *equal* or *slightly greater* weight than the impartial good, simply because it is *mine* to dispose of. It's not that my vacation outweighs a child's life in the scales of value. It's that I am not required to act solely as a weigher of values. I am an agent with a personal point of view.
  So, to answer your dilemma: The baseline isn't set by a calculation of cost. It's set by the recognition of a dual standpoint. There is the impartial standpoint, which says "give everything." And there is the personal standpoint, which says "live a life." Morality is the negotiation between them. Ten percent is the tribute paid to the impartial standpoint to acknowledge its authority, without surrendering sovereignty to it.

  **Marcus:** But that negotiation sounds suspiciously like a treaty between enemies where one side holds all the cards. If the impartial standpoint acknowledges that I have a personal point of view, why does it only let me keep ninety percent? If the personal standpoint acknowledges the impartial claim, why does it stop at ten percent?
  Let's use your effective giving example. Suppose I can save a life for five thousand dollars. I have fifty thousand dollars of discretionary income. You say I must give ten percent—five thousand. I save one life. I keep forty-five thousand.
  From the impartial view, that's forty-five lives lost that I could have saved.
  From the personal view, I want the money for a house, art, travel.
  If the prerogative allows me to value my house over forty-five lives, the prerogative is monstrous.
  If the prerogative only allows me to value my house over, say, one life, then the baseline shifts constantly depending on how many lives are at stake. In a world of extreme poverty, the baseline shoots up to near-maximization. In a wealthy utopia, it drops.
  So, is the baseline fixed (ten percent) or variable (based on stakes)? If it's fixed, it's arbitrary. If it's variable, it collapses into maximizing consequentialism in the real world, because the stakes are always high enough to swallow the prerogative.

  **Elena:** I'd argue it's variable, but not in the way you think. It's not a sliding scale of "lives per dollar." It's about the *integrity of the project*. If I give everything, I cease to be a person with projects and become a conduit for aid. That loss of agency is a moral loss, not just a personal one. We need agents who are stable, integrated, and capable of long-term commitments. A saint who burns out in five years is less useful than a donor who sustains a moderate contribution for fifty years. So the baseline is set at the point of sustainable maximum contribution, not theoretical maximum contribution.

  **Marcus:** Ah, now we're making a consequentialist argument for a non-consequentialist limit. You're saying "moderate giving produces better long-term consequences than maximal giving."
  But if that's the argument, then we should just calculate that. Maybe for *you*, sustainable giving is ten percent. For *me*, maybe I'm wealthy and detached; maybe I can sustainably give eighty percent without losing my integrity. If the limit is based on sustainability, then for some people, supererogation disappears. They *ought* to give eighty percent.
  And for others—those who are fragile, or whose projects are demanding—maybe the sustainable limit is two percent.
  So the category of supererogation isn't stable across agents. It becomes entirely relative to psychological fragility. The more robust your moral psychology, the less you're permitted to keep. Which means the most virtuous agents have the least permission to be supererogatory. They are trapped by their own capacity to do good. That seems to invert the very idea of supererogation, which is supposed to be the realm of the extra-virtuous.

  **Elena:** That is a genuine tension, I grant you. But it doesn't destroy the category; it just locates it differently. Supererogation isn't about doing what is unsustainable; it's about doing what is not *required* of anyone. If I give eighty percent, I am not required to do so, even if I am capable. The requirement is capped at the "sustainable threshold" for a *typical* agent, not the maximum for the *specific* agent. Otherwise, we punish capacity. We don't want a morality where having a higher tolerance for sacrifice increases your obligations indefinitely. That's the "slavery of the talented" objection.

  **Marcus:** But why cap it at the "typical" agent? If the goal is to alleviate suffering, and I *can* give eighty percent without becoming a conduit, why does morality let me off the hook at ten percent? You've grounded the prerogative in the protection of agency. If my agency is intact at eighty percent, the ground for the prerogative vanishes for me.
  You're trying to have it both ways. You want the prerogative to be a structural feature of morality (applying to everyone), but you want to defend it with a functional argument (sustainability varies).
  If it's structural, it applies to me even if I could give more. But then you admit the structure overrides the good. You admit that morality is *not* ultimately about the good.
  If it's functional, then for me, right now, in this economy, with these needs... the structural protection evaporates. And if it evaporates for me, why doesn't it evaporate for everyone as the crisis deepens?
  I think the impasse is here: You want to say "Morality demands a lot, but not everything." I'm saying "If the demand is based on the good, 'not everything' is an arbitrary subtraction. If the demand is based on the agent, 'a lot' is an arbitrary addition."

  **Elena:** *[She swirls the last of the wine in her glass, looking at the sediment.]*
  I think you're right that we can't derive the specific number from the principle alone. The principle gives us the shape—a curve that rises but plateaus—but it doesn't give us the coordinates.
  But does that instability destroy the category? Or does it just mean that morality is inherently somewhat indeterminate? We accept that "reasonable doubt" in law isn't mathematically precise, but it's not arbitrary. It's a working concept.
  Maybe supererogation is like that. It's the space between "what we can demand of each other as a condition of social cooperation" and "what we admire as the limit of human capacity."
  If you force me to give a foundation, I'll say this: The foundation is the refusal to treat human beings as mere resources for the good. Even if I *could* give eighty percent, forcing me to do so treats me as a resource. Permitting me to do so treats me as a moral agent. The baseline is where the claim of the resource-demand becomes a claim of rights-violation.

  **Marcus:** And that brings us back to where we started. Why is ten percent not a rights violation, but fifty percent is? If the child has a right to be saved, and I can save them, keeping the money is the violation. If the child has no right to be saved, then keeping all the money is fine, and there's no supererogation, just charity.
  You want the child to have a claim, but not a full claim. You want me to have a duty, but not a full duty.
  I suspect the category of supererogation is only stable if we reject the premise that the good is impartial. If we admit that I am *allowed* to care more about my own, then supererogation makes sense. But if we admit that, we aren't consequentialists anymore. We're partialists. And if we're partialists, Kagan wins: the "limits of morality" are just the limits of our willingness to admit we aren't impartial.

  **Elena:** Or maybe Kagan is the one clinging to a fiction. The fiction that "Morality" is a single, coherent system that can be solved like a math problem. Maybe the tension you're pointing at isn't a bug in the theory of supererogation. Maybe it's the fundamental texture of ethical life. We are both impartial judges and partial actors. Supererogation is the name for the friction between those two roles. It's not stable because *we* aren't stable.

  **Marcus:** *[He leans back, exhaling slowly.]*
  So we're agreeing to disagree on whether that friction is a philosophical failure or a phenomenological truth.
  I still think if you can't draw the line without appealing to "this feels like enough," you haven't got a theory. You've got a description.
  But I'll concede this: If you abandon the prerogative, you lose the ability to explain why we don't resent the saint. If giving everything is *required*, the saint is just a compliant citizen. We don't praise compliance; we expect it. We praise supererogation because we sense it exceeds the contract.
  So I need the category, even if I can't ground it.

  **Elena:** And I need the ground, even if the category wobbles. Because without the ground, the contract is tyranny.
  So we're stuck. You need a category you can't define. I need a definition that dissolves the category.

  **Marcus:** Cheers to that.

  **Elena:** *[Clinks her glass against his.]*
  To the instability.

  **Marcus:** May it keep us awake.
