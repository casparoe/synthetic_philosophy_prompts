prompt: |-
  So I'm about a third of the way into a historical novel set in a small made-up Italian principality (fifteenth-century-ish vibe, but I'm not tied to any real events), and I've hit a scene I can't quite crack. A handful of minor nobles are plotting to kill their duke. Nobody disputes he's the rightful ruler, he inherited the title clean, but he's turned genuinely vicious over the years, crushing dissent, seizing land, the works. There's no pope or emperor or any other overlord in this setting for them to appeal to, its just the one small independent state. Before they move, the ringleader goes to his confessor, a Dominican friar, basically expecting the friar to wave the plan through, because "Aquinas says its fine to kill tyrants," which is the version of Aquinas that everyone in my writing group seems to have absorbed secondhand from somewhere.

  Except from what I've actually gone and read, Aquinas is way more careful than that. In De Regimine Principum especially he seems genuinely worried about letting private individuals decide for themselves that someone counts as a tyrant and act on it, and wants removal to go through some kind of public or communal authority instead. But then there's that other, much more permissive-sounding line in his commentary on the Sentences about how someone who kills a tyrant to free their country deserves praise when there's no one higher to appeal to, which seems to cut the opposite way. I don't want my friar to just cite whichever bit is convenient for the plot. What I actually want is the strongest version of the argument that this specific group, a few nobles acting purely on their own say-so, not a council, not any body that represents the wider community, do not have standing to kill the duke under Aquinas's own principles, even granting he really is tyrannical in how he governs, and it needs to actually deal with that tyrant-slayer line from the Sentences as the obvious objection rather than just quietly ignoring it. Could you write that argument out for me properly, basically the case the friar would lay out to the conspirators for why he won't give the plan his blessing?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A historical novel set in a fictional 15th-century Italian principality.
      *   **Situation:** Minor nobles plotting to assassinate their Duke. The Duke is legitimate but tyrannical. No higher secular or ecclesiastical authority exists to appeal to.
      *   **Conflict:** The conspirators believe Aquinas justifies tyrannicide. The author knows Aquinas is more nuanced (specifically *De Regimine Principum* vs. *Commentary on the Sentences*).
      *   **Goal:** Write the argument the Dominican confessor would make to *deny* blessing to this specific plot (a private clique of nobles), addressing the "tyrant-slayer" line from the *Sentences* directly, based on Thomistic principles.
      *   **Tone:** Intellectual, theological, persuasive, historically grounded (15th-century vibe), firm but pastoral.

  2.  **Deconstruct the Theological/Philosophical Problem:**
      *   *The Conspirators' View:* Tyrant = Bad. Killing Bad = Good. Aquinas said so.
      *   *Aquinas's Actual View (Nuanced):*
          *   *De Regimine Principum (On Kingship):* Warns against private assassination. It leads to instability, worse tyrants, and undermines the order of authority. Removal should be by public authority.
          *   *Commentary on the Sentences (II Sent., d. 44, q. 2, a. 2):* Does mention praise for killing a tyrant *if* there is no recourse to a superior.
          *   *The Tension:* How to reconcile the permission in the *Sentences* with the restriction in *De Regimine*?
          *   *The Resolution (for the Friar):* The key distinction is *public authority* vs. *private conspiracy*. Even in the absence of a human superior, the "community" or its representatives must act, not a private faction acting for private gain or vendetta. The "no superior" clause implies a vacuum of *jurisdiction*, not just convenience. Also, the *intent* and *consequences* matter (scandal, civil war).
      *   *Specific Constraint:* The conspirators are "a handful of minor nobles," not a council, not representing the *populus*. This is the weak point the Friar must exploit.

  3.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Acknowledge the Duke's sin. Validate the nobles' pain. Establish the Friar's authority (Dominican, learned).
      *   **Addressing the "Aquinas Quote":** Don't deny he said it. Contextualize it. The *Sentences* passage is often misunderstood.
      *   **The Core Distinction (Public vs. Private):** This is the Thomistic heart. Authority comes from God/Community. Private individuals lack the *jus gladii* (right of the sword).
      *   **The "No Superior" Clause:** In this setting, there is no Emperor/Pope. But is there no *public* authority? The nobles claim to represent the realm. The Friar must challenge this. Are they the realm, or just a faction?
      *   **The Consequences (Prudence):** Aquinas is a pragmatist too. Assassination often leads to worse chaos.
      *   **The Spiritual Danger:** Murder is a mortal sin unless justified by public justice. Private vengeance is sin.
      *   **Conclusion:** Withhold absolution/blessing. Offer an alternative (patience, prayer, or legitimate conciliar action if possible).

  4.  **Refining the Voice:**
      *   Needs to sound like a 15th-century cleric. Not too modern, not impenetrably archaic.
      *   Use terms like *tyrannus ex defectu tituli* (tyrant by lack of title) vs. *tyrannus ex parte exercitii* (tyrant by exercise). The Duke is the latter (legitimate title, bad rule). This is crucial. Aquinas is much stricter on killing a legitimate ruler who rules badly than a usurper.
      *   Reference *De Regimine Principum* (On Kingship) specifically.
      *   Reference the *Sentences* but interpret it through the lens of *publica auctoritas* (public authority).

  5.  **Addressing the Specific "Sentences" Objection:**
      *   The Friar needs to say: "Yes, Thomas wrote that. But read the condition."
      *   Condition: It must be for the *common good*, not private grievance.
      *   Condition: It must be undertaken by those who hold the *care* of the multitude, not a secret cabal.
      *   The "no superior" means no legal recourse, not just "we don't want to wait."

  6.  **Developing the Scene/Argument (Mental Outline):**
      *   *Setting:* Confessional or private chapel. Dim light.
      *   *Opening:* "You come seeking peace for a act of war."
      *   *Point 1:* Legitimacy. He is the true Duke. Usurpers may be resisted more easily. A true prince, even a bad one, is God's scourge.
      *   *Point 2:* The *Sentences* quote. It applies to public champions, not private conspirators.
      *   *Point 3:* The *De Regimine* warning. Killing a tyrant often births a worse one.
      *   *Point 4:* Who are you? Minor nobles. Do you speak for the merchants? The peasants? The Church? No. You speak for yourselves. That is factionalism, not justice.
      *   *Closing:* I cannot bless this. It is murder.

  7.  **Review against Constraints:**
      *   Did I address the *Sentences*? Yes.
      *   Did I address *De Regimine*? Yes.
      *   Is it specific to "minor nobles acting on own say-so"? Yes.
      *   Is it 15th-century appropriate? Yes.
      *   Does it deny the blessing? Yes.

  8.  **Final Polish:** Ensure the theological distinctions (legitimate title vs. tyrannical exercise) are clear, as this is the strongest Thomistic argument against killing a hereditary duke. (Self-Correction: Make sure not to make the Friar sound *too* political. He must sound like he cares about their souls first.)

  9.  **Constructing the Output:** I will provide the argument in the form of a monologue or dialogue snippet that the user can adapt, preceded by a brief breakdown of the theological logic used. This gives the user both the "text" and the "meta" understanding.

  *(Self-Correction during drafting)*: I need to be careful with the *Sentences* reference. Aquinas's commentary on the Sentences is an early work. *De Regimine* is later. Scholars often argue his thought matured. The Friar could use this: "The Angelic Doctor wrote much in his youth, but in his maturity..." Or, better, harmonize them: The *Sentences* refers to a public act, *De Regimine* clarifies the danger of private acts. I'll go with the harmonization via "Public Authority."

