answer: |-
  This is a fantastic historical and theological puzzle. You are absolutely correct: the popular understanding of Aquinas on tyrannicide is often a caricature. While he does allow for the removal of a tyrant, he places heavy restrictions on *who* may do it and *how*, specifically distinguishing between a tyrant who usurps power (*tyrannus ex defectu tituli*) and a legitimate ruler who governs tyrannically (*tyrannus ex parte exercitii*). Your Duke is the latter, which makes the bar for resistance much higher.

  Below is a breakdown of the theological logic your Friar would use, followed by a draft of the scene/argument itself. You can adapt the dialogue to fit your voice.

  ### The Thomistic Logic (For your reference)

  1.  **Legitimacy Matters:** Aquinas is far more permissive about killing a usurper. Your Duke inherited cleanly. He holds authority from God, even if he abuses it. To kill him is to strike at the Divine order of authority itself.
  2.  **Public vs. Private Authority:** This is the crux. In *De Regimine Principum* (On Kingship), Aquinas argues that removing a tyrant is not the business of private individuals. It must be done by "public authority."
  3.  **Reconciling the *Sentences*:** In his *Commentary on the Sentences*, Aquinas says killing a tyrant is praiseworthy "when there is no recourse to a superior." The Friar's argument must be that "no recourse to a superior" does not mean "no Emperor exists." It means "no legal mechanism exists." However, even then, the act must be undertaken by those representing the *community*, not a private faction. A handful of nobles acting on their own are private individuals, not the *populus*.
  4.  **Prudence and Consequences:** Aquinas is a virtue ethicist. An act is judged by its object, end, and circumstances. If the assassination leads to civil war (which a factional coup likely would), the "good" of removing the tyrant is outweighed by the "evil" of the ensuing chaos.

  ***

  ### The Scene: The Friar's Argument

  **Setting:** *The private chapel of the Dominican friary. Night. The conspirator (let's call him Count Valerio) has just laid out the plan.*

  **Friar Tommaso:** "You ask me to bless a dagger, Valerio. But you speak as if the blade is the problem. It is not. The problem is the hand that holds it."

  **Valerio:** "The Angelic Doctor himself wrote that he who kills a tyrant to liberate his country is worthy of praise. There is no Emperor to appeal to. No Pope. We are the only recourse left."

  **Friar Tommaso:** "You quote Thomas, but you read him with the eyes of a soldier, not a theologian. You quote his Commentary on the *Sentences*, written when he was a young friar. But have you read his *On Kingship*, written in the maturity of his wisdom? There, he warns explicitly against what you propose."

  **Valerio:** "He does not forbid it."

  **Friar Tommaso:** "He forbids *you*. Listen closely, my son. Thomas distinguishes between the tyrant who steals the crown and the prince who inherits it but wears it poorly. Your Duke is legitimate. His title is clean. His blood is right. To strike him is not to prune a weed; it is to strike the trunk of the tree God planted. When a ruler is a usurper, the community may reject him. But when he is anointed and inherited, his authority comes from God, even if his actions come from the Devil. To kill him is to claim a judgment that belongs to the Lord."

  **Valerio:** "And if he starves the Lord's sheep? If he seizes the land of the Church and the nobility alike? Are we to wait for God to strike him down while he burns the principality?"

  **Friar Tommaso:** "Thomas writes that if there is no recourse to a superior, the removal of a tyrant may be praiseworthy. *But.* Read the condition. He says it is praiseworthy when undertaken by *public authority*. Not by a private conspiracy. Not by a handful of men aggrieved by lost rents and slighted honors."

  **Valerio:** "We are the nobility. We represent the realm."

  **Friar Tommaso:** "Do you? Where are the merchants of the city? Where are the guild masters? Where is the council of elders? You are a faction, Valerio. A cabal. If you strike the Duke, you do not act as the body of the realm; you act as a rival power. And what happens when you succeed? You say you will restore order. But history teaches us that when private men take up the sword of justice, they do not lay it down easily. You kill one tyrant, and in the scrambling for the crown, three more rise in his place. Thomas warns of this: that often the tyranny following a deposition is worse than the one before, for the new ruler fears retribution and rules with greater cruelty."

  **Valerio:** "So we do nothing? We let him crush us?"

  **Friar Tommaso:** "I say you have no *standing* to crush him. If the Duke is truly mad, if he is truly destroying the common good, then it is the *community* that must act. Not you in this shadowed chapel. If the people, the clergy, and the nobility together—through a recognized council—declare him unfit, that is public authority. That is the body politic amputating a diseased limb. But you? You are proposing murder. You are proposing that your private judgment of the common good supersedes the Divine order of succession."

  **Valerio:** "The *Sentences* says—"

  **Friar Tommaso:** "The *Sentences* speaks of a deliverer who acts for the *multitude*, with the *consent* of the multitude, when no legal path remains. You seek to act *for* the multitude without *them*. You seek to bypass the law because the law is slow. But justice that is swift and private is not justice; it is vengeance. And vengeance is Mine, saith the Lord."

  **Valerio:** "If I cannot count on the Church, I count on my sword."

  **Friar Tommaso:** "Then count on it knowing you go to God with blood on your hands that He did not authorize. I cannot absolve a sin that is committed in defiance of the very order God established to keep sin in check. If you kill him as a private conspirator, you are a murderer. If the realm rises as one body to depose him, that is a different matter. But do not ask me to call a factional coup the will of Heaven. Thomas would not. And neither will I."

  ***

  ### Key Takeaways for Your Narrative

  *   **The "Public Authority" Trap:** The Friar traps them on the definition of *who* acts. Aquinas is consistent that private individuals cannot execute public justice. By highlighting that they are a "handful of nobles" rather than a "Council of State," the Friar invalidates their claim to represent the *populus*.
  *   **The "Legitimate Title" Distinction:** Emphasize that the Duke inherited properly. This makes him *tyrannus ex parte exercitii* (tyrant by exercise). Aquinas is much more hesitant about removing these than usurpers (*tyrannus ex defectu tituli*).
  *   **The Prudential Argument:** The Friar should argue that even if the killing is technically justifiable, the *consequences* (civil war, worse tyranny) make it sinful under the virtue of Prudence. Aquinas holds that an act must be good in its object, end, *and* circumstances.
  *   **The Tone:** The Friar shouldn't sound like he loves the Duke. He should sound like he loves *Order* more. He fears the chaos of the precedent more than the cruelty of the man.

  This approach gives your Friar intellectual integrity. He isn't ignoring the "tyrannicide" quote; he is interpreting it through the stricter, more mature lens of Aquinas's political thought, which fits a learned Dominican in the 15th century perfectly.
