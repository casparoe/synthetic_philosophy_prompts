answer: |-
  This is a classic philosophical puzzle, often referred to as the "Deathbed Promise" case. It is designed specifically to stress-test theories that ground moral obligations in social consequences, utility, or current interpersonal states. Your dinner debate was well-founded: both Hume and Scanlon face challenges here, but they fail (or succeed) for different reasons.

  To give you the careful comparison you requested, we need to move beyond the "elevator pitch" versions of these theories. We must look at the specific mechanisms each philosopher uses to generate obligation, and then see if those mechanisms can reach a promisee who is dead and a promise that is secret.

  ### 1. Hume's Conventionalism: The Artificial Virtue

  **The Core Commitment:**
  For Hume, there is no "natural" motive to keep a promise. If you promise to give me money, there is no inherent moral force in the words themselves. Instead, promising is an **artificial virtue**. It is a human invention (a convention) created to solve a specific problem: the instability of possession and the need for cooperation over time.

  The obligation to keep a promise arises because society has collectively agreed to treat certain speech acts as binding. We adhere to this convention because we recognize its **public utility**. If people stopped keeping promises, commerce and cooperation would collapse. Therefore, the "moral sentiment" approves of promise-keeping because it serves the public interest.

  **Application to the Grandmother Case:**
  Your friend's critique of Hume is strong, perhaps stronger than your own. On a strict Humean reading, the obligation to keep a promise is parasitic on the utility of the *practice*.

  *   **The Problem of Isolation:** In your scenario, the promise is secret and unrepeatable. Breaking it will not damage the convention. No one else will lose trust in the practice of promising because no one else knows the promise existed. Therefore, the *public utility* of the convention is unaffected by your breach.
  *   **The "General Point of View":** Hume argues we judge actions from a "general point of view," not based on immediate self-interest. However, if the general point of view asks, "Does this act undermine the convention?" the answer here seems to be "No."
  *   **Hume's Potential Rescue:** Hume might argue that you cannot make an exception for yourself. To break the rule, even in secret, is to cultivate a vice in your own character. It trains you to disregard the convention when it is inconvenient. However, this moves Hume closer to a Rule-Utilitarian or even Kantian position (duty to the law/rule) rather than a pure Conventionalist one. If the *only* reason for the rule is social utility, and this instance lacks social utility, the Humean ground for obligation becomes very thin.

  **Verdict on Hume:** Hume struggles significantly here. His theory grounds the obligation in the *system* of cooperation. If the act is removed from the system (secret, one-off, no reliance), the conventionalist engine has nothing to grip. To say it is still wrong, Hume would have to import a resource he explicitly denies: a **natural duty of fidelity** independent of social utility.

  ### 2. Scanlon's Contractualism: Principle F

  **The Core Commitment:**
  Scanlon's theory in *What We Owe to Each Other* is not based on social utility or conventions, but on **justifiability**. An act is wrong if it violates a principle that no one could reasonably reject.

  Regarding promises, Scanlon offers **Principle F (The Principle of Fidelity)**:
  > If (1) A voluntarily and intentionally leads B to expect that A will do X... and (2) A knows that B wants to be assured of this... then (3) A must do X unless B consents to X not being done.

  Crucially, Scanlon grounds the wrongness not in the *consequences* of breaking the promise (disappointment, loss of trust), but in the **manipulation of the assurance itself**. When you invoke the practice of promising, you claim a special authority to bind yourself. If you break the promise, you have exploited the trust you invited to gain an advantage (e.g., peace of mind for your grandmother) without paying the cost (doing the act).

  **Application to the Grandmother Case:**
  Your friend argues Scanlon fails because the grandmother is dead, so she has no "expectations" or "trust" to abuse. This is a common misunderstanding of Scanlon's temporal view of obligation.

  *   **The Timing of the Obligation:** For Scanlon, the normative bond is created at the **moment the assurance is given**, not the moment it is fulfilled. When you promised your grandmother, you invoked Principle F. You created a reason for yourself to act that is grounded in her interest in receiving that assurance.
  *   **Duties to the Dead:** Scanlon explicitly addresses duties to the dead. He argues that we owe things to people based on the **interests they had while alive**. Your grandmother had an interest in knowing her ashes would be scattered. That interest existed. You assured her you would respect it. The fact that she no longer exists to *feel* disappointment does not erase the normative claim she established while she was a moral agent.
  *   **The "Secret" Aspect:** Scanlon's theory does not rely on public knowledge. It relies on the relationship between the promisor and promisee. Even if no one else knows, *you* know that you invoked a principle to gain her trust. Breaking it is a failure of justification to *her* (as she was).

  **Verdict on Scanlon:** Scanlon handles this case much better than Hume. He does not need the promise to support a social convention (Hume) nor does he need the promisee to be currently alive to feel disappointment (simple expectation views). He only needs the fact that a **valid assurance was given** based on principles that could not be reasonably rejected.

  ### 3. Do They Need to "Import" Resources?

  This is the crux of your dispute. Does explaining the obligation require smuggling in a theory the philosopher doesn't officially hold?

  **Hume:**
  *   **Yes.** To condemn you for breaking the secret deathbed promise, Hume needs to appeal to something like **integrity** or a **natural duty** to respect the will of another. But Hume famously argues there is no natural motive for fidelity. If he admits there *is* a duty here, he undermines his central claim that promising is purely artificial/conventional. He would have to admit that sometimes we are bound by the *content* of the commitment (respect for the dead) rather than the *form* (the convention).

  **Scanlon:**
  *   **No (mostly).** Scanlon's framework is robust enough to handle this without importing external natural duties. Principle F is designed to cover exactly this: the creation of reasons through assurance.
  *   **The Caveat:** However, Scanlon does rely on a specific view of **respect for persons**. He assumes that when someone creates an expectation in another who wants assurance, they create a binding reason. Some critics argue this *is* a form of "natural duty" (a duty to respect autonomy) that Scanlon tries to derive from contractualism but actually presupposes. Nevertheless, within the internal logic of Scanlon's system, the grandmother case is a feature, not a bug. It demonstrates that the obligation lies in the **transaction**, not the **consequences**.

  ### 4. Who Wins?

  **Scanlon comes out ahead.**

  Here is why the case discriminates between them more cleanly than you assumed:

  1.  **Source of Obligation:** Hume locates the obligation in the **social practice**. If the practice isn't served (because the act is secret and isolated), the obligation dissolves. Scanlon locates the obligation in the **interpersonal transaction**. The transaction occurred; therefore, the obligation exists, regardless of whether the practice is bolstered or whether the promisee survives.
  2.  **The Role of the Promisee:** Your friend argued that because the grandmother cannot be disappointed, Scanlon fails. But Scanlon's point is that the wrongness isn't the *feeling* of disappointment; it's the **violation of the assurance**. The assurance was given when she was alive. The obligation persists because the *reason* for the obligation (her reliance on your word) was validly created.
  3.  **The "Secret" Factor:** This is the nail in the coffin for Hume. A secret violation cannot damage a public convention. Scanlon doesn't care if it's secret; morality for Scanlon is about what you owe to specific others, not about maintaining public order.

  **The Nuanced Conclusion:**
  Your friend was right to be unsatisfied with the "simplified" Scanlon (that promises are just about managing expectations), but wrong to think Scanlon's *actual* theory fails the case. Scanlon's Principle F is specifically designed to bind agents even when consequences are negligible.

  You were right to be unsatisfied with Hume, but perhaps too generous in thinking the case was a draw. The deathbed promise is traditionally considered a "counter-example" to Conventionalism/Utilitarianism precisely because it isolates the duty from social utility.

  **Final Recommendation:**
  If you want to press the advantage, argue this:
  Hume cannot explain the duty without admitting that **fidelity is sometimes natural**, which contradicts his main thesis. Scanlon can explain the duty using **Principle F**, provided we accept that duties to the dead are based on the interests they held while alive. Scanlon's theory is more capacious; it treats the promise as a normative bond between persons, not a brick in the wall of social cooperation.

  The obligation exists not because society needs it (Hume), and not because she will feel bad (naive expectation view), but because **you claimed the authority to bind yourself to her will, and you cannot revoke that authority unilaterally.** That is a distinctly Scanlonian (and Kantian) insight that Hume's convention-based system cannot easily accommodate.
