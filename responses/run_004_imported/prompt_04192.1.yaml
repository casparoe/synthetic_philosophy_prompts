prompt: |-
  A friend and I spent a long dinner arguing about why promises are binding in the first place, and neither of us walked away convinced. The dispute turned on a case I posed to her: suppose that, alone at my grandmother's bedside in her final hours, I promise her I will scatter her ashes off a stretch of coastline she loved. She dies shortly afterward. No one else ever learns the promise was made, so keeping or breaking it cannot affect anyone's trust in me, or in promising as a practice; and since she no longer exists, she cannot be disappointed, form residual expectations, or be harmed by any reliance she placed on me. My friend insisted it would still obviously be wrong for me to quietly skip the trip, and took this to show that Scanlon's contractualist account of promising -- on which the wrongness of breaking a promise consists in manipulating expectations you intentionally created and abusing the trust this invites -- cannot be the whole story, since there is no one left whose expectations or trust are at stake.

  I pushed back that the obvious alternative fares no better. Hume's view that promise-keeping is a convention we are bound by once society has adopted it also grounds the obligation in a system of mutual expectations: his argument is that the convention is worth everyone's adherence because it stabilizes cooperation, and a single unwitnessed, unrepeatable promise does not feed into that system in any way that keeping it would preserve or breaking it would damage. So we each ended up convinced the other's preferred theory failed the case, without either of us having anything better to put in its place.

  I would like a more careful comparison than we could manage ourselves. Could you lay out what Hume's conventionalist account and Scanlon's contractualist account (his "Principle of Fidelity," or Principle F) are each actually committed to, beyond the simplified versions we were trading over dinner, and then apply both to the grandmother case? Specifically: does either genuinely explain the residual obligation on its own terms, or does explaining it require quietly importing some further resource -- a natural, non-conventional duty, say, or facts about what she would have wanted -- that the theory is not entitled to? If one account clearly comes out ahead, say which and why; and if you think the case does not actually discriminate between them as cleanly as we assumed, I would like to hear that too.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A dinner argument between the user and a friend about the binding nature of promises.
      *   **The Case:** A deathbed promise to scatter ashes. Secret (no one else knows), promisor is dead (no reliance, no disappointment, no harm to promisee).
      *   **The Theories:**
          *   Scanlon's Contractualism (Principle F): Wrongness lies in manipulating expectations/abusing trust.
          *   Hume's Conventionalism: Wrongness lies in violating a social convention necessary for cooperation.
      *   **The Problem:** Both theories seem to rely on social/interpersonal effects (trust, expectations, convention stability). In this specific case, those effects seem absent.
      *   **The Task:** Provide a careful comparison of Hume and Scanlon beyond the simplified dinner versions. Apply both to the grandmother case. Determine if either explains the obligation on its own terms or if they need to import external resources. Declare a winner if possible, or explain why the case doesn't discriminate cleanly.

  2.  **Deconstruct the Theories (Mental Sandbox):**

      *   **Hume (Conventionalism):**
          *   *Core Idea:* Promises are artificial virtues. There is no natural motive to keep a promise. The obligation arises from a social convention established to facilitate exchange and cooperation.
          *   *Mechanism:* I perform a speech act that signals my submission to the convention. Breaking it undermines the convention *generally*.
          *   *The "Secret Promise" Challenge:* If no one knows, does it undermine the convention? Hume might say the *agent* knows they are violating the rule that sustains society. But if it's truly isolated, does it matter?
          *   *Nuance:* Hume distinguishes between the *origin* of the convention (utility) and the *motive* to follow it (moral sentiment approved by the general point of view). Even if *this* act doesn't hurt utility, violating the *rule* corrupts the agent's character.
          *   *Potential Rescue:* The duty is to the *rule*, not the specific consequence. But why follow the rule if the rule's purpose (social utility) isn't served?

      *   **Scanlon (Contractualism/Principle F):**
          *   *Core Idea:* Wrongness is determined by principles no one could reasonably reject.
          *   *Principle F:* If one intentionally leads another to expect X, knowing they want assurance, one must do X unless they consent otherwise.
          *   *The "Secret Promise" Challenge:* The friend argues the promisee is dead, so no expectations/trust exist *at the time of action*.
          *   *Nuance:* Scanlon focuses on the *time of the promise*. The wrong is in the *creation* of the expectation without intent to fulfill. But here, the intent might change *after* death.
          *   *Potential Rescue:* Scanlon talks about the "value of the relationship" or duties to the dead based on what was owed *when they were alive*. Also, Scanlon allows for "Principle M" (manipulation) or broader duties of respect.
          *   *Crucial Distinction:* Is the obligation to the *person* (even dead) or to the *practice*? Scanlon is usually read as focusing on the interpersonal justification.

  3.  **Evaluate the "Grandmother Case" against the Theories:**

      *   **Hume:**
          *   *Strict Reading:* If the convention exists for social utility, and this act has zero social utility/disutility, the obligation vanishes.
          *   *Charitable Reading:* The obligation is to maintain one's own integrity as a participant in the convention. To make an exception for oneself is to claim a privilege one cannot universalize (Kantian echo, but Humean sentiment).
          *   *Weakness:* Hume explicitly denies natural fidelity. If the convention doesn't apply (secret, one-off), where does the binding force come from?

      *   **Scanlon:**
          *   *Strict Reading:* Principle F requires inducing expectations *in the promisee*. If the promisee is dead, they have no current expectations.
          *   *Charitable Reading:* The obligation was incurred *when she was alive*. The wrong is violating the assurance given *then*. The death doesn't erase the normative bond created *ante-mortem*.
          *   *Weakness:* Scanlon's framework is about justifiability to *others*. Can the dead be part of the "others" to whom justification is owed? Scanlon says yes (duties to the dead exist), but is it based on *their* expectations or *our* integrity?

  4.  **Synthesize and Compare:**

      *   *The Friend's Claim:* Scanlon fails because no trust/expectations exist *now*.
      *   *The User's Claim:* Hume fails because no convention stability is at stake *now*.
      *   *Reality Check:* Both claims rely on a slightly shallow reading.
      *   *Scanlon's Strength:* He explicitly addresses duties to the dead. The obligation is rooted in the *past* interaction. The "Principle of Fidelity" locks in the obligation at the moment of assurance. The death of the promisee doesn't dissolve the duty; it just changes who can hold you accountable (perhaps no one, but the act remains wrong).
      *   *Hume's Strength:* He emphasizes the *rule* over the *act*. Even if *this* act doesn't hurt society, treating the rule as optional hurts the *agent's* virtue.
      *   *Hume's Weakness:* It's harder for Hume to explain why a *secret* violation matters if the "general point of view" can't see it.
      *   *Scanlon's Weakness:* If the promisee can't be disappointed, what is the "harm"? Scanlon might need to appeal to the value of autonomy/respect rather than just expectation management.

  5.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the depth of the argument. It's a classic philosophical puzzle (the "Deathbed Promise").
      *   **Section 1: Hume's Conventionalism.**
          *   Explain the "Artificial Virtue."
          *   Explain the role of the "General Point of View."
          *   Apply to case: Does a secret breach undermine the convention?
          *   Verdict: Hume struggles. He needs to appeal to the agent's character or a "rule worship" aspect that borders on natural duty.
      *   **Section 2: Scanlon's Contractualism.**
          *   Explain Principle F (Assurance).
          *   Explain the timing of the obligation (incurred *ante-mortem*).
          *   Explain duties to the dead (justifiability to the person *as they were*).
          *   Verdict: Scanlon handles this better. The obligation is grounded in the past interaction, not current consequences.
      *   **Section 3: The "Imported Resource" Critique.**
          *   Does Scanlon import a natural duty? Maybe a duty of respect.
          *   Does Hume import one? Yes, a duty to virtue independent of utility.
      *   **Section 4: Comparison/Verdict.**
          *   Scanlon comes out ahead because his framework explicitly accommodates duties to those who cannot currently hold expectations (the dead, future generations). Hume's utility calculus is more vulnerable to the "no one knows" objection.
      *   **Nuance:** Acknowledge that *both* might ultimately rest on a deeper intuition about respect for autonomy/will, which might be outside both systems (Kantian territory).

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction on Scanlon:* I need to be careful. Scanlon's *What We Owe to Each Other* focuses on justifiability to others. If the other doesn't exist, can I justify to them? Scanlon argues we owe it to them *based on the interests they had while alive*. So the "expectation" isn't a current psychological state, but a normative claim established when they were alive.
      *   *Correction on Hume:* Hume is tricky. He says the *sentiment* of morality approves of promise-keeping. Even in secret, the agent feels the vice. But why? Because the *rule* is useful. If the rule is useful, breaking it is vicious. But if *this instance* doesn't affect the rule's utility... Hume might say "You are training yourself to be a knave."
      *   *Key Distinction:* Scanlon grounds it in the *specific relationship/transaction*. Hume grounds it in the *general practice*. The grandmother case isolates the transaction from the practice. This favors Scanlon (transactional) over Hume (practicial), contrary to the friend's intuition. Wait, the friend thinks Scanlon fails. I need to explain why the friend is likely wrong about Scanlon.
      *   *Wait, actually:* The friend says Scanlon fails because it relies on *trust/expectations*. If the grandmother is dead, she has no trust. Scanlon's reply: The obligation arises from the *act of inducing expectation*, not the *continued existence* of the expectation. The wrong is breaking the assurance *given*.
      *   *Hume's problem:* If the convention is for *social coordination*, a non-coordinating promise is outside the convention. Hume might actually say "No obligation." This makes Hume look worse than Scanlon here.

  7.  **Final Plan:**
      *   Intro: Validate the puzzle.
      *   Hume Analysis: Artificial virtue, utility, general point of view. Show why the secret case is fatal to strict Humeanism.
      *   Scanlon Analysis: Principle F, temporal aspect, duties to the dead. Show why Scanlon can accommodate it better.
      *   The "Import" Question: Does Scanlon need Kant? Does Hume need Rule Utilitarianism?
      *   Conclusion: Scanlon wins, but with caveats.

  8.  *(Self-Correction)*: I should check Scanlon's specific text on promises. In *What We Owe to Each Other*, he discusses the "Principle of Fidelity." He acknowledges the "deathbed" objection. He argues that the obligation is to the *person* based on the *reasons* they had to rely on you. The death doesn't erase the reason.
      *   Also, consider T.M. Scanlon's later work or commentaries. The standard interpretation is that Scanlon handles this better than consequentialists/conventionalists.

  9.  **Final Polish:** Ensure tone is respectful, analytical, and directly answers the prompt's specific questions (commitments, application, imported resources, winner).

