      *   **Decision Theory Case:** Often framed as single-shot or finite horizon. Expected Utility Theory (EUT) says maximize $E[U(x)]$. Ergodicity Economics (EE) says maximize time-average growth rate (which maps to log wealth).
      *   **The Tension:** EUT relies on ensemble averages (many parallel universes). EE relies on time averages (one path through time).
      *   **The "Ought" Claim:** Proponents of EE argue that because time is irreversible and we live in one timeline, maximizing the time-average growth rate is *objectively* rational, not just a preference for safety (risk aversion).
