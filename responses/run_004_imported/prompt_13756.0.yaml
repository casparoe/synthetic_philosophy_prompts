answer: |-
  You have put your finger on the exact nerve that makes philosophers of decision theory twitch when they hear the "ergodicity economics" pitch. As a population geneticist, you recognize the math immediately because it *is* the math of multiplicative processes. But you are also right to be suspicious of the normative leap.

  The short answer is: **Yes, it is partially smuggling an *ought* out of an *is*, but it does so by redefining the physical constraints of the decision problem rather than by invoking psychological preferences.**

  Here is the breakdown of why the analogy holds physically but stumbles philosophically, specifically regarding that single-shot normativity.

  ### 1. The Biology vs. Agency Distinction
  In your field, the "decision maker" is natural selection. Selection has no preferences; it has a filter. Lineages that maximize arithmetic mean fitness in a multiplicative environment go extinct. Lineages that maximize geometric mean persist. The "ought" here is hypothetical: *If* a lineage wants to persist, *then* it must maximize geometric mean. But lineages don't "want." They just are or aren't.

  In decision theory, the agent has agency. Expected Utility Theory (EUT) was built (by Bernoulli, von Neumann, Morgenstern) to describe what a consistent agent *should* do, given their preferences.

  The ergodicity economists (like Ole Peters) argue that EUT made a category error. They claim EUT uses **ensemble averages** (what happens across 1,000 parallel universes) to prescribe action for a **time average** (what happens to one person over time). Since we live in one timeline, they argue, the ensemble average is physically irrelevant.

  So, they argue: Maximizing expected log wealth isn't a "preference" for safety (risk aversion); it is the mathematical requirement for maximizing the time-average growth rate of wealth in a non-ergodic (multiplicative) system.

  ### 2. Where the Normative Sneak Happens
  The claim is that this solves the "risk aversion" problem. Instead of saying "I am psychologically afraid of loss" (concave utility), you say "I am respecting the dynamics of time."

  However, to get to the *ought*, you still need a premise that isn't purely descriptive. That premise is: **"The agent ought to maximize their long-term rate of growth."**

  In biology, that premise is enforced by extinction. If you don't maximize geometric fitness, you disappear. In economics, you don't necessarily disappear if you maximize arithmetic expectation on a single bet. You might just end up with zero wealth.

  So the normative move relies on equating **"rationality"** with **"long-term survival/growth."**

  If I am a terminally ill patient with no heirs, and I face a single bet: 50% chance to triple my wealth, 50% chance to lose it all.
  *   **Arithmetic Mean (EV):** Positive.
  *   **Geometric Mean:** Zero (because of the zero outcome).
  *   **Kelly/Ergodic prescription:** Do not bet (or bet fractionally to avoid ruin).

  If I take the bet and lose, I have zero. If I take the bet and win, I have 3x. If I don't bet, I have 1x.
  The ergodic argument says taking the bet is "irrational" because it lowers your time-average growth rate to zero. But why *ought* I care about my time-average growth rate if I don't plan to make further bets?

  The "ought" is smuggled in via the assumption that **every decision is part of a repeated sequence.** Peters argues that there is no such thing as a "single shot" because every decision happens within the trajectory of a life. Therefore, you should always act as if you are optimizing for the long run.

  ### 3. The Philosophical Pushback
  Philosophers and standard decision theorists push back on two fronts:

  **A. The Definition of Rationality**
  Standard decision theory defines rationality as **internal consistency** (transitivity of preferences, etc.), not **outcome optimality**. If I prefer a 50% chance at \$3M over a sure \$1M, and I state that clearly, EUT says I am rational, even if I go broke.
  Ergodicity economics redefines rationality as **dynamic survival**. It says, "No, you aren't rational if you make choices that lead to extinction in the time average."
  This isn't a derivation of an *ought* from an *is*; it's a stipulation of a *different ought*. It swaps "be consistent" for "survive." Both are normative commitments.

  **B. The Single-Shot Problem**
  You noted the claim is that log-wealth is rational *even for a bet they'll only ever face once*. This is the weakest link in the ergodicity armor.
  Mathematically, the geometric mean only converges to the time-average growth rate as $N \to \infty$. For $N=1$, the expected value (arithmetic mean) is the literal expectation.
  To claim log-optimality for $N=1$, you must argue that $N$ is never actually 1. You are always betting a fraction of your life's bankroll.
  But this requires assuming the agent *values* future betting capacity. If the agent values *current* consumption more than future capacity, the arithmetic mean might be the correct metric for their utility. By insisting on the geometric mean, ergodicity economics is implicitly imposing a specific time-preference (value the future) without admitting it's a value judgment.

  ### 4. Is it just "Risk Aversion" Repackaged?
  You asked me not to say "log utility is concave, that's risk aversion." I won't. But I will say this:

  The ergodicity argument successfully demonstrates that **some** behaviors we label "risk aversion" are actually **rational responses to non-ergodic dynamics.**
  *   *Example:* Refusing a gamble with positive EV that risks ruin is not "fear"; it is mathematical necessity for continuation.

  However, it fails to prove that **all** risk aversion is dynamic necessity.
  If I refuse a gamble where I cannot go to zero (e.g., 50% lose 10%, 50% gain 20%), but I still prefer the sure thing, that cannot be explained by ergodicity alone. That requires a utility function.

  The "smuggling" occurs when proponents claim they have eliminated the need for utility functions entirely. They haven't. They have simply hard-coded a specific utility function (Log Wealth) and claimed it is a law of physics rather than a preference.

  ### 5. The Verdict
  Your intuition is correct. The move from biology to decision theory is valid regarding the **dynamics** (multiplicative processes require geometric means to grow), but it is invalid regarding the **normativity** without an added axiom.

  *   **Biology:** "Geometric mean maximizers survive." (Descriptive)
  *   **Ergodic Economics:** "You should maximize the geometric mean." (Normative)
  *   **Missing Premise:** "You should prioritize long-term survival/growth over short-term expected gain."

  In biology, that premise is enforced by the environment (extinction). In decision theory, it must be adopted by the agent. An agent who says, "I don't care about the long run, I want to maximize my expected wealth on this one bet because I'm dying tomorrow," is not being "irrational" in the EUT sense, even if they are "biologically" doomed.

  So, is it legitimate? **It is legitimate as a correction to the *physics* of the model (time vs. ensemble), but it is not legitimate as a elimination of *values*.** It replaces the value of "consistency" with the value of "persistence." It doesn't get you an *ought* from an *is*; it gets you a different *ought* from a more accurate *is*.

  As a geneticist, you know that bet-hedging is only selected for when the environment fluctuates and extinction is possible. If the environment is stable, arithmetic maximizers win. Ergodicity economists assume the "environment" (the market/life) is always fluctuating and multiplicative enough to warrant geometric optimization. That is an empirical claim, not a philosophical proof.

  **Summary:** They are right that EUT often ignores the time-structure of reality. They are wrong that this automatically dictates a normative rule for all single-shot decisions. The "ought" comes from your decision to value *staying in the game* over *winning the hand*. That is a value, not a theorem.
