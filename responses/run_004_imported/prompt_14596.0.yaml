  **Justifications:**

  *   **Move 1 (Lena): -1.** While ontologically standard, this contradicts the core thesis of Anderson's essay. Anderson argues that the "Constructionist Hypothesis" (that you can reconstruct the universe from fundamental laws) breaks down due to complexity and scale. Lena treats the inability to derive higher-level phenomena as merely computational, whereas Anderson argues it is conceptual; the macro-behavior is not simply "latent" but requires new independent laws.
  *   **Move 2 (Marcus): 2.** This is an accurate summary of Anderson's central physical argument. Anderson uses spontaneous symmetry breaking to demonstrate that the macroscopic state (e.g., a ferromagnet) possesses less symmetry than the microscopic Hamiltonian. The specific ground state is not determined by the micro-laws alone without boundary conditions or the thermodynamic limit, validating Marcus's claim that the regularity isn't just "waiting to be read off."
  *   **Move 3 (Lena): -1.** Lena retreats to a metaphysical claim about "ontology" to save reductionism. While it is true that no new *fundamental particles* are added, Anderson's point is that new *effective laws* emerge that are autonomous from the micro-theory. Furthermore, strictly speaking, symmetry breaking requires the thermodynamic limit ($N \to \infty$); a "complete specification" of finite particles cannot mathematically produce a phase transition without invoking this higher-level limit concept.
  *   **Move 4 (Marcus): 2.** Marcus correctly identifies the methodological weakness of hard reductionism. By deferring to an impossible counterfactual (an unbounded intelligence with complete information), the reductionist claim becomes metaphysical rather than scientific. Anderson's essay is a plea for the validity of higher-level science *as practiced*, not a debate about what a Laplace's Demon could calculate.

  **What Both Are Missing:**

  1.  **The Thermodynamic Limit:** Neither explicitly mentions that strict symmetry breaking only occurs in the limit of infinite particles ($N \to \infty$). Finite systems tunnel between states; the "broken" symmetry is an emergent property of the limit itself, which is a mathematical idealization not present in the micro-physics of finite $N$.
  2.  **Ontology vs. Epistemology:** They are conflating what exists (ontology) with how we understand it (epistemology). Anderson accepts ontological reductionism (everything is made of particles) but rejects epistemological reductionism (particle physics explains everything). Lena argues ontology; Marcus argues epistemology. They need to agree on this distinction to resolve the dispute.
  3.  **Renormalization Group Flow:** Both miss the later theoretical framework (Kadanoff/Wilson) that formalized Anderson's intuition. Renormalization shows mathematically how microscopic details "wash out" at larger scales, proving that higher-level laws are often *insensitive* to lower-level details, making Lena's demand for derivation not just hard, but irrelevant.
