answer: |-
  Your friend is right, and your confusion is completely understandable. It is the most common reaction to Galen Strawson's "Basic Argument."

  Most people intuitively think the free will debate is a battle between **Determinism** (everything is fixed) and **Indeterminism** (there is randomness). We tend to think: *"If determinism is true, I'm a robot. If indeterminism is true, I have room to move."*

  Strawson's argument is famous precisely because it claims **both sides lose.** It argues that the problem isn't the physics of the universe (determined vs. random); the problem is the **logic of responsibility itself.**

  Here is the walkthrough of the logic, why randomness doesn't save you, and what is actually doing the philosophical work.

  ---

  ### 1. The Core Intuition: "You have to make yourself"
  To understand Strawson, you have to shift what you think "Moral Responsibility" means.
  *   **Standard View:** I am responsible if I acted freely and wasn't coerced.
  *   **Strawson's View (Ultimate Responsibility):** I am responsible only if **I am the ultimate source of my actions.**

  For me to be the ultimate source of my action, I must be the source of the **mental state** that produced the action.
  *   I did X because I wanted Y.
  *   To be responsible for X, I must be responsible for wanting Y.
  *   But why did I want Y? Because of my character/upbringing/prior choices (Z).
  *   To be responsible for wanting Y, I must be responsible for Z.

  This creates an infinite regress. To be truly responsible, you would have to be responsible for the way you are *all the way back*. You would have to be **_causa sui_** (the cause of yourself).

  Strawson argues that being _causa sui_ is logically impossible. Nothing can create itself. You have to exist *before* you can create something, so you can't create yourself.

  ### 2. The Fork: Why Determinism AND Indeterminism Fail
  This is where your specific question comes in. Strawson applies this "regress" logic to both physical possibilities.

  #### Scenario A: Determinism is True
  *   **The Chain:** Your choices are the result of your character + prior causes. Those prior causes go back to before you were born.
  *   **The Verdict:** You didn't choose your genes, your parents, or your environment. Since you didn't choose the "setup" that produces your choices, you aren't the ultimate source.
  *   **Result:** No responsibility. (This is the part you already understood).

  #### Scenario B: Indeterminism is True (The Randomness Objection)
  *   **The User's Intuition:** "If there is genuine randomness (quantum indeterminacy, etc.), then the chain is broken. The past doesn't dictate the future. I can originate something new!"
  *   **Strawson's Counter:** Randomness is not **agency**.
  *   **The Logic:**
      1.  Imagine you are making a choice.
      2.  If the outcome is determined by your character/reasons, we go back to the regress problem (you didn't choose your character).
      3.  So, to escape the regress, the choice must *not* be determined by your character. It must be random/indeterminate.
      4.  **The Kicker:** If the choice is random, **it is not *you* doing it.** It is just a neurological accident.
      5.  If a quantum fluctuation makes you raise your hand, you didn't *control* that. You can't be morally responsible for a accident or a roll of the dice.

  **Analogy:** Imagine you are programming a robot.
  *   **Determinism:** The robot follows the code you wrote. (You are responsible, not the robot).
  *   **Indeterminism:** The robot has a "random number generator" chip that occasionally overrides the code. (You are still responsible for the code, but the random overrides are just noise. The robot isn't "free," it's just glitchy).

  In neither case is the *robot* responsible for its actions. Strawson argues we are in the same position.

  ### 3. What is doing the work? (If not Determinism)
  You asked: *"What exactly is doing the work here if it isn't determinism itself?"*

  The work is being done by the **Principle of Transfer of Non-Responsibility.**

  This is the engine of the argument. It goes like this:
  1.  If you are not responsible for X, and X necessarily leads to Y, then you are not responsible for Y.
  2.  You are not responsible for the initial conditions of your existence (genes, birth, laws of physics).
  3.  Your actions are the necessary result of those initial conditions (plus whatever random noise occurs).
  4.  Therefore, you are not responsible for your actions.

  **The "Work" is the requirement for Self-Creation.**
  Strawson's argument forces you to admit that to be truly responsible, you would need to have chosen your own nature *before* you had a nature to choose with.
  *   To choose your nature, you need a set of principles to guide that choice.
  *   Where did *those* principles come from?
  *   If they came from your nature, you didn't choose them (circular).
  *   If they came from outside you, you didn't choose them (determinism).
  *   If they came from nowhere, they are random (indeterminism).

  The argument works "either way" because it attacks the **subject** (you), not the **universe**. It claims that "You" are always the product of something "Not-You" (either prior causes or random chance).

  ### 4. Why your intuition about "Origination" feels right (but fails)
  You asked: *"Why doesn't [randomness] give you at least some kind of origination that could ground responsibility?"*

  This is the hardest pill to swallow. We feel like "randomness" opens a door for "me" to step in. But Strawson argues that "me" is just a collection of prior states.

  If I act according to my desires, I am determined by my desires (which I didn't choose).
  If I act *against* my desires (a random break), I am acting arbitrarily (which I don't control).

  There is no "third thing." There is no magical "Self" floating outside the chain of cause-and-effect that can grab a random event and claim it as its own. If there were, that "Self" would have to have a nature, and we'd have to ask: *Where did that nature come from?* And we are back at the start.

  ### Summary for your next argument
  If you talk to your friend again, here is the cheat sheet:

  1.  **It's not about Physics:** Strawson isn't arguing about whether atoms are determined. He is arguing about the **concept of responsibility**.
  2.  **The Regress:** To be responsible for an act, you must be responsible for the mind that committed the act. You can't be responsible for that mind unless you created it. You can't create yourself.
  3.  **Randomness = Luck:** Indeterminism doesn't give you control; it just gives you luck. You can't be praiseworthy for good luck.
  4.  **The Conclusion:** "Ultimate Moral Responsibility" is a incoherent concept (like a "married bachelor"). It doesn't exist.

  **One caveat:** Strawson admits we can still have *practical* responsibility (legal systems, social praise/blame) because it changes behavior. He just denies *ultimate, metaphysical* responsibility.

  Your friend was right: It's not determinism dressed up. It's a logical trap that snaps shut regardless of how the universe works.
