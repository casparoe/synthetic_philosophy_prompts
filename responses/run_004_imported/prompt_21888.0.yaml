  2.  **Deconstruct the Ethical/Logical Problem:**
      *   **The Lottery Paradox:** If you have a lottery with 1000 tickets and 1 winner, it's rational to believe of any *specific* ticket that it will lose (99.9% chance). But it's irrational to believe *all* tickets will lose (since one must win).
      *   **Application here:** For any *specific* student, there's a 93% chance they cheated. It seems rational to sanction them individually. But if you sanction *all* 54, you are effectively asserting that *none* are innocent, which contradicts the known 7% error rate (statistically, some *must* be innocent).
      *   **The Preface Paradox:** An author believes every claim in their book is true, but also believes (in the preface) that at least one claim is likely false due to human error.
      *   **Application here:** The Board believes the evidence against each student is strong enough to sanction, but also acknowledges the system produces errors, so at least one sanction is likely unjust.
      *   **The Conflict:** Individual justice (probabilistic guilt) vs. Systemic integrity (acknowledging inevitable error).
      *   **The Options:**
          1.  *Sanction All:* Maximizes deterrence and efficiency but guarantees punishing innocents (violates "beyond reasonable doubt" or similar standards).
          2.  *Void Question/Report:* Protects innocents but lets cheaters off scot-free, undermines the exam's validity, and is unfair to the 300+ honest students.
