answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Board
  **FROM:** [Your Name], Graduate Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Case #24-STAT-F (Intro Stats Final Exam)

  ### Executive Summary

  Regarding the 54 students flagged for collusion in the Intro Stats remote final: **I recommend against issuing blanket sanctions based solely on the forensic report.** While the statistical evidence is compelling, the known 7% false-positive rate at the current threshold means we possess *systemic certainty* that innocent students are included in this group. Sanctioning all 54 collectively would violate the Board's ethical obligation to individual justice.

  Instead, I propose a **"Show Cause" procedure**: notify the 54 students of the specific evidence against them (the specific answer pattern and similarity score) and invite a written explanation within 72 hours. Sanctions (zero points on the specific question) should only apply to those who fail to provide a plausible, individualized account of their work. This approach balances the integrity of the exam with the moral necessity of avoiding known false positives.

  ### Factual Background & The Statistical Constraint

  The Exam Security Office has identified a cluster of 54 students with high similarity scores on a specific complex question. The forensic software is robust, but the validation study appended to the report admits a **7% false-positive rate** at the threshold used to flag these students.

  Mathematically, this means that within this group of 54, we should expect approximately **3 to 4 students to be innocent**. We do not know *which* ones. This creates a logical and ethical impasse:
  1.  **Individual Probability:** For any *single* student, there is a 93% probability they cheated.
  2.  **Group Certainty:** For the *group*, there is a 100% probability that *some* did not cheat.

  ### Ethical Analysis: The Lottery Paradox

  My recommendation is grounded in a logical problem known as the **Lottery Paradox**. In a fair lottery, it is rational to believe of any *single* ticket that it will lose (high probability). However, it is irrational to believe that *all* tickets will lose (certainty), because we know one must win.

  Applied here: It is rational to suspect any *single* student in the flagged group. It is **irrational and unjust** to conclude that *all* of them are guilty, because we know (via the 7% error rate) that "winning tickets" (innocent students) exist in this pool. If we sanction all 54, we are not merely risking error; we are **knowingly punishing innocence.**

  The Board's standard of proof is typically "Preponderance of Evidence" (more likely than not). While 93% clears this bar for an individual, the *known systemic error* undermines the evidence's sufficiency for *collective* adjudication. We cannot use a tool that admits to error to issue error-free judgments without a human filter.

  ### Addressing the Counter-Argument (The Case for Blanket Sanctions)

  I understand the position held by half the Board: that sanctioning all 54 is necessary to maintain deterrence and fairness to the 286 honest students. The argument is that the statistical weight is overwhelming, and letting cheaters slide devalues the degree.

  **I acknowledge the strength of this concern.** If we do nothing, we signal that collusion is low-risk. However, this argument fails on two grounds:
  1.  **Reputational Risk:** If even one innocent student successfully appeals or leaks the 7% error rate disclosure, the University's credibility collapses. We cannot defend punishing students we *know* are likely innocent.
  2.  **Deterrence vs. Justice:** Deterrence cannot justify the certain violation of a few innocent students' records. The integrity of the *process* is as vital as the integrity of the *exam*.

  Conversely, I also reject the argument to **void the question for the entire class**. While this protects the innocent, it unfairly penalizes the 286 honest students by altering the grading curve and effectively rewards the cheaters by erasing their advantage.

  ### Recommended Action Plan

  To resolve this, we must shift the burden of proof procedurally without violating it ethically. The statistical flag establishes *probable cause*, not *guilt*.

  **1. Notification (Monday Morning)**
  Send individual notices to the 54 students. Do not accuse them of cheating outright; state that their exam responses have been flagged for "irregular similarity" requiring clarification. Include the specific question ID and the nature of the anomaly (e.g., "identical unique error pattern").

  **2. The "Show Cause" Window (Monday – Wednesday)**
  Give students 72 hours to submit a brief written statement. They do not need to prove innocence, but they must provide a plausible account of how they arrived at their answer (e.g., draft work, explanation of logic, reference to study materials).
  *   *Rationale:* Cheaters collaborating on a final rarely have individualized draft trails or can explain the *logic* of a wrong answer derived from a peer. Innocent students usually can.

  **3. Board Review (Thursday)**
  A sub-committee reviews the responses.
  *   **Plausible Explanation:** Case dismissed.
  *   **No Response / Implausible Explanation:** Sanction applied (0 points on the question, not course failure).
  *   *Rationale:* Limiting the sanction to the question acknowledges the statistical uncertainty. We are confident enough to remove the *benefit* of the doubt, but not confident enough to fail the course.

  **4. Communication to Class (Friday)**
  Announce to the full cohort that the specific question has been reviewed for validity. Do not name names. Confirm that grading will proceed normally for the rest of the exam.

  ### Timeframe

  *   **Friday (Today):** Board votes on this memo.
  *   **Monday 9:00 AM:** Notices sent to 54 students.
  *   **Wednesday 5:00 PM:** Deadline for student responses.
  *   **Thursday:** Sub-committee review of responses.
  *   **Friday:** Final grades released.

  ### Conclusion

  We are facing a situation where efficiency tempts us to sacrifice accuracy. The forensic report is a powerful tool, but it is not a verdict. By requiring a minimal level of individualized engagement from the flagged students, we respect the Lottery Paradox: we acknowledge that while most are likely guilty, we refuse to act as though *all* are. This protects the innocent few without letting the guilty many off scot-free.

  I move that we adopt this "Show Cause" protocol immediately.
