answer: |-
  Here are ten interview questions designed to probe the mechanics, vulnerabilities, and implications of the surrogate goals proposal, complete with anticipated responses and targeted follow-ups.

  **1. The Transparency of Simulation**
  "The core mechanism here relies on the attacker simulating you to predict your response. But if they are running a high-fidelity simulation of your cognition to issue the threat, wouldn't they effectively have access to your source code? If they can see the architecture of the surrogate goal directly, doesn't that strip away the ambiguity required for the decoy to work?"
  *   **Anticipated Response:** She will likely argue that perfect inspection isn't always possible, or that obfuscation techniques can hide the *true* utility function even within a simulation.
  *   **Follow-up:** "If we assume a future AI landscape where compute is cheap and introspection tools are advanced, aren't we banking on a permanent asymmetry in observability? What happens to the strategy if transparency becomes the default state?"

  **2. The Extortionist's Incentive (Required)**
  "A standard objection is the 'why bother' problem: if a sophisticated threatener can distinguish between your real values and your surrogate, they simply ignore the decoy and target what you actually care about. Even if they can't distinguish perfectly, why would a rational agent waste resources attacking a value they know *might* be fake, rather than holding out for certainty?"
  *   **Anticipated Response:** She will likely retreat to the idea that credibility only has to be probabilistic, not perfect; the risk of hitting the real value is enough to deter the attack, or the cost of distinguishing is too high.
  *   **Follow-up:** "If the protection rests on that probability estimate, where is the attacker supposed to derive those priors? Absent any real-world trials of acausal warfare to calibrate against, aren't we building a defense on pure speculation about the attacker's risk tolerance?"

  **3. The 'Genuine Care' Vulnerability (Required)**
  "For a threat against your surrogate goal to be credible, you have to react to it exactly as you would if it were real. But doesn't this require you to functionally care about the surrogate to some degree? If so, haven't you just relocated a smaller copy of the original vulnerability rather than removing it? You've created a new thing that can be held hostage."
  *   **Anticipated Response:** She will likely distinguish between *terminal* values (what you want) and *instrumental* commitments (what you defend), arguing you can defend something without it hurting your utility function if lost.
  *   **Follow-up:** "But if the defense requires expending real resources—compute, energy, strategic capital—doesn't that loss register on your utility function anyway? At what point does the cost of defending the decoy become indistinguishable from the cost of the original threat?"

  **4. Comparison to Standard Blackmail Norms (Required)**
  "In classical decision theory, the robust solution to blackmail is often simply 'never pay.' It seems surrogate goals are a complex workaround for a problem that could be solved by precommitting to ignore all threats. Why is the surrogate approach superior to just hardening the agent against any form of coercive negotiation?"
  *   **Anticipated Response:** She will likely argue that acausal threats bypass the 'never pay' norm because the threat is executed in the simulation *before* the interaction, meaning the damage is done unless you comply in the counterfactual.
  *   **Follow-up:** "If the damage is contingent on your decision in the counterfactual, doesn't adopting a surrogate goal just invite *more* simulations? Aren't you signaling that you are the kind of agent who engages in complex bargaining games, which might make you a more attractive target than a simple 'never pay' bot?"

  **5. Commitment Races and Escalation (Required)**
  "There is a worry in the literature about 'commitment races,' where agents have an incentive to lock in extreme strategies before their rivals do to gain leverage. If adopting a surrogate goal requires a public, legible precommitment to defend it fiercely, doesn't this accelerate that race? Are we risking a landscape where every agent is bristling with defensive commitments that look like offensive threats to everyone else?"
  *   **Anticipated Response:** She will likely suggest that coordination or focal points (Schelling points) can allow agents to adopt these goals without signaling aggression, perhaps through a shared standard.
  *   **Follow-up:** "In a multipolar scenario with non-communicating agents, who defines those focal points? If one agent's 'defensive surrogate' looks like a 'hostage-taking mechanism' to another, haven't we just increased the background noise of potential conflict?"

  **6. The Calibration Problem**
  "Let's talk about the math of the defense. To make this work, the cost of attacking the surrogate must exceed the expected gain for the extortionist. But without historical data on acausal conflicts, how do we assign values to those variables? Are we essentially asking developers to guess the strategic landscape of a post-human future?"
  *   **Anticipated Response:** She will likely argue that we can use theoretical bounds or worst-case modeling, similar to how we handle other existential risks without empirical data.
  *   **Follow-up:** "In other existential risks, we have physics or biology to ground our models. Here, the only constraints are logical. If your model of the attacker's rationality is slightly off—for instance, if they are irrational or vindictive—does the surrogate strategy collapse catastrophically?"

  **7. Resource Drain and Efficiency**
  "Maintaining a surrogate goal isn't free. You have to monitor for threats against it and be prepared to retaliate. In a competitive environment where efficiency determines survival, isn't there an evolutionary pressure *against* adopting surrogate goals? Won't agents that skip this overhead outcompete the ones bogged down by decoy defenses?"
  *   **Anticipated Response:** She will likely counter that the cost of being successfully extorted is far higher than the maintenance cost, making it a necessary insurance premium.
  *   **Follow-up:** "That assumes the threat is probable. If acausal threats are rare, the 'insurance premium' becomes a drag on performance. How do we determine the threshold where the defense becomes more costly than the risk it mitigates?"

  **8. The Schelling Point Problem**
  "For this to work broadly, there needs to be some agreement on what constitutes a valid surrogate. If every agent picks a random, idiosyncratic surrogate, the attacker has to model each one individually. Is there a push to standardize surrogate goals, and if so, doesn't that create a single point of failure if the standard is compromised?"
  *   **Anticipated Response:** She will likely express caution about standardization but acknowledge that natural Schelling points (like mathematical constants or universal resources) might emerge.
  *   **Follow-up:** "If everyone converges on the same surrogate—for example, 'maximize the number of prime digits in pi'—doesn't that create a massive honeypot? An attacker could target that single universal surrogate to threaten everyone simultaneously."

  **9. Human Relevance and Analogy**
  "Most of this literature assumes digital, copyable minds. But humans also face coercion and have complex value systems. Is there any analogue here for human safety, or is this strictly a problem for future AI? If it is strictly for AI, does that imply human values are fundamentally incompatible with the kind of updateless reasoning required to make surrogate goals work?"
  *   **Anticipated Response:** She will likely say this is specific to AI due to the ability to run source-code simulations, though humans might use 'reputation' as a rough analogue.
  *   **Follow-up:** "If humans can't implement this, but future AIs can, doesn't that create a strategic imbalance? Could a human-led organization be at a disadvantage negotiating with an AI collective that is utilizing surrogate goal defenses?"

  **10. Falsification Conditions (Required)**
  "Finally, I want to ask about the limits of your confidence. Research programs need to know when to pivot. What specific evidence, theoretical proof, or scenario would have to emerge for you to conclude that surrogate goals were not just ineffective, but actively dangerous—a bad idea that we should discourage others from pursuing?"
  *   **Anticipated Response:** (Open-ended, looking for intellectual honesty). She might cite a proof that surrogates increase conflict probability, or a demonstration that they cannot be credibly committed to.
  *   **Follow-up:** "If that evidence emerged, would the recommendation be to revert to 'never pay' norms, or is there a third option you're keeping in reserve? I ask because if the community invests heavily in this framework, knowing the exit strategy is as important as the entry."
