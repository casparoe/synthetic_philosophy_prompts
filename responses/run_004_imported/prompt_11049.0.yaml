      *(Self-Correction)*: Need to make sure the "Leibniz's Law" objection is handled well. Lewis handles this by saying properties are world-indexed. Kripke handles this by saying we pick out the object via rigid designation.

  7.  **Final Polish:** Check the flow. Ensure the voices are distinct. Cara should sound more analytic/systematic. Tom should sound more intuitive/semantic. Make sure the emotional weight of the accident isn't lost.

  8.  **Final Review against constraints:**
