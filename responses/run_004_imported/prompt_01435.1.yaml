answer: |-
  **Setting:** *Isaac Newton's chambers in Trinity College, Cambridge. Circa 1692. The only light comes from two dying tallow candles, illuminating stacks of folios and loose manuscripts covered in Newton's cramped script. Newton stands by the hearth; the fictional fellow, DR. ELIAS HAMMOND, sits opposite, nursing a cold cup of wine.*

  **Newton:** You speak of the Creed as a shield, Elias. I tell you it is a scar. Look at this passage from Athanasius. He does not argue from Scripture; he argues from necessity. He binds the bishops not with the Word, but with the threat of schism.

  **Hammond:** Necessity is often the midwife of truth, Isaac. If the Church did not define the Son's nature at Nicaea, the Gospel becomes a moral fable rather than a divine redemption. If Christ is not God, who forgives the sin?

  **Newton:** The Father forgives, through the Son He appointed. You conflate authority with essence. The primitive Church knew the Son was the Agent of Creation, yes, but subordinate to the Father. This *homousios*—this "same substance"—it is not in the Gospels. It is a Greek metaphysical import.

  **Hammond:** Nor is the word "Trinity" in the Gospels, yet the reality breathes through every page. You hunt for the absence of a word to deny the presence of a mystery. Is God bound to speak in the vocabulary of the first century forever?

  **Newton:** God is bound to Truth. And Truth does not require alteration. I have collated the citations of the Fathers before the year 325. They speak of the Son as the first-born of Creation. Then, suddenly, after Athanasius maneuvers himself into power, the texts shift. Margins bleed into the body.

  **Hammond:** You suspect a conspiracy of ink. I see the guidance of the Spirit. The Church is a living body, Isaac. It grows in understanding. Just because the terminology was sharpened in the fourth century does not mean the belief was invented then. It was defended.

  **Newton:** Defended? Or imposed? Athanasius was a politician who saw that if he could make the Son equal to the Father, he centralized power in the Church's hierarchy. It is idolatry, Elias. To worship the Son as the Most High is to rob the Father of His glory. I would rather be a heretic than an idolater.

  **Hammond:** And I would rather be a Trinitarian than a deist. If the Son is a creature, however exalted, then we are saved by a creature. We are left alone in the cosmos. The Incarnation is God reaching down to lift us up. If He is not fully God, His hand is too short.

  **Newton:** You assume God cannot delegate His power. I tell you, the Scripture is plain: "The Father is greater than I." Why must you twist the plain text to suit a philosophical system? You value the Creed of the Councils above the words of Christ Himself.

  **Hammond:** I value the consensus of the Saints who died for those words. You sit here in safety, with your prisms and your manuscripts, and you dissect the Church like a corpse. But you miss the life. The liturgy, the sacrament, the prayer—it all presupposes the divinity of Christ.

  **Newton:** The liturgy is corrupted too! Do you think I have not traced the doxologies? They were altered to fit the new dogma. I am not dissecting a corpse, Elias. I am trying to clear away the rubble of four hundred years to find the foundation.

  **Hammond:** And if you clear away too much, the building falls. You seek a Christianity of pure reason, of historical data. But faith requires a leap into the paradox. You want a God you can calculate.

  **Newton:** I want a God who is One. Not a riddle. Not a geometric impossibility. If I have erred, it is in loving the Truth too much to let it stand dressed in lies.

  **Hammond:** Then you love an abstraction. I love the Church. And I tell you, if you publish these notes, you will not save the Truth. You will only lose your place, and the truth will die with you.

  **Newton:** *(Turning back to the desk, picking up a quill)* Let it die, then. Better the truth should perish than that God should be worshipped as a triad of persons. The night is long, Elias. You may leave the wine.

  **Hammond:** *(Standing, voice quiet)* The night is long, Isaac. But dawn comes whether you light the candle or not. Pray you are not found fighting the sun when it rises.

  *(Hammond exits. Newton dips the quill, the scratch of the nib the only sound in the room.)*
