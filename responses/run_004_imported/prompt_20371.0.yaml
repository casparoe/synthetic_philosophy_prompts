answer: |-
  This is an excellent question that cuts to the heart of why population ethics is considered one of the most difficult and frustrating fields in moral philosophy. You have correctly identified the standard "fix" that introductory discussions often present: **Average Utilitarianism** does indeed avoid the Repugnant Conclusion.

  However, the consensus among philosophers is that your conclusion—that the Repugnant Conclusion is merely a technical quirk of Total Utilitarianism—is incorrect. The problem is much deeper. Switching to Average Utilitarianism does not solve the underlying tension; it merely trades the Repugnant Conclusion for a different set of equally counter-intuitive results.

  Here is why the Repugnant Conclusion is viewed as a structural problem for population ethics as a whole, rather than a bug specific to one aggregation method.

  ### 1. The Cost of Average Utilitarianism
  You are right that Average Utilitarianism (AU) prefers a smaller population with very high wellbeing over a massive population with barely positive wellbeing. However, AU generates its own "repugnant" implications, often referred to as the **Absurd Conclusion** or problems regarding **Mere Addition**.

  *   **The Problem of Happy Additions:** Under AU, if you have a population with a very high average wellbeing, adding a new person who is *also* very happy—but slightly less happy than the current average—makes the outcome **worse**.
      *   *Example:* Imagine a world with 10 people, all at 100 units of happiness (Average: 100). If you add an 11th person who has 99 units of happiness (a life clearly worth living), the new average drops to roughly 99.9. AU dictates that this new world is *worse* than the original.
      *   *Implication:* This implies that it is morally wrong to bring happy children into the world if their happiness isn't "high enough" to maintain the statistical average. Most people find it counter-intuitive that creating a happy person could be a moral negative.

  *   **The Small Elite Population:** AU implies that a world containing only one person living at maximum bliss is better than a world containing billions of people living extremely wonderful lives, provided the billions are even fractionally less happy than the single person. This prioritizes statistical intensity over the sheer scale of flourishing, which strikes many as equally "repugnant."

  ### 2. Parfit's Broader Project
  Derek Parfit did not present the Repugnant Conclusion simply to criticize Total Utilitarianism. His goal in *Reasons and Persons* was to map the logical space of our moral intuitions and show that they are **incompatible**.

  Parfit demonstrated that we hold several intuitions that seem individually plausible but cannot all be true simultaneously. For example:
  1.  It is better to have more people with lives worth living (Quantity).
  2.  It is better to have people with higher quality of life (Quality).
  3.  Adding people with lives worth living cannot make an outcome worse (Mere Addition).

  The Repugnant Conclusion shows that if you accept Total Utilitarianism, you must reject intuition #2 in extreme cases. But if you switch to Average Utilitarianism to save intuition #2, you must reject intuition #1 and #3 (because adding happy people becomes bad). Parfit's point was that **any** theory you choose will violate at least one strong moral intuition. There is no "clean" escape.

  ### 3. The Impossibility Theorem
  Your hope that there might be a technical fix was formally addressed by the contemporary philosopher **Gustaf Arrhenius**. Building on Parfit's work, Arrhenius developed several **Impossibility Theorems** in population ethics.

  In simplified terms, Arrhenius proved mathematically that no population axiology (theory of value) can satisfy a set of six very weak, plausible adequacy conditions simultaneously. In other words, it is not just that Total Utilitarianism has a flaw; it is that **any possible theory** will yield counter-intuitive results in some scenario.

  This confirms that the Repugnant Conclusion is not a quirk of summation; it is a symptom of a fundamental logical tension between the *number* of lives and the *quality* of lives.

  ### 4. Relevance to Your Original Concern
  You mentioned your interest stems from the ethics of procreation in a resource-strained world. This distinction matters practically:

  *   **Total Utilitarianism** might suggest we should maximize the number of people, provided their lives are net positive (potentially encouraging high population growth even if individual resources are tight).
  *   **Average Utilitarianism** might suggest we should restrict population growth to ensure those who exist have the highest possible resources (potentially implying we should not have children unless we can guarantee them exceptional circumstances).

  Both views have drastic, difficult implications for policy and personal choice. The Repugnant Conclusion forces us to ask: **Is a life barely worth living a moral gain?**
  *   If you say **Yes**, you lean toward Total Utilitarianism and face the Repugnant Conclusion.
  *   If you say **No**, you lean toward Average Utilitarianism (or Critical-Level theories) and face the problem that bringing happy people into the world might be morally neutral or negative.

  ### Summary
  The Repugnant Conclusion is not a technical quirk of Total Utilitarianism; it is a boundary marker showing where our intuitions about quantity and quality break down. Switching to Average Utilitarianism avoids the specific conclusion Parfit named, but it immediately runs into the "Mere Addition" problem and the "Absurd Conclusion."

  Philosophers continue to debate this not because they haven't thought of Average Utilitarianism, but because **every available solution requires biting a bullet that feels morally wrong.** The problem is deep, structural, and currently unsolved.
