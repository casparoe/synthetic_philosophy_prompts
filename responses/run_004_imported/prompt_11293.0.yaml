answer: |-
  First off, take comfort in the fact that your friend's assessment ("your taste is inconsistent") is economically and psychologically shallow. They are looking at a static snapshot of assets, whereas you were living through a dynamic experience of utility.

  To answer your question directly: **No, you were not irrational.** However, you did fall victim to a very common behavioral economic phenomenon known as **transaction costs as tuition.**

  Here is the breakdown of why this happened, why it feels weird, and why your friend is missing the point.

  ### 1. The "Money Pump" Paradox
  In decision theory, there is a concept called the *Money Pump Argument*. It states that if your preferences are cyclical (you prefer A over B, B over C, but C over A), you are irrational because someone could theoretically trade with you in an endless loop, draining your money forever while you end up back where you started.

  On paper, that is exactly what happened to you.
  *   Hermes > Olivetti (Trade 1)
  *   Olivetti > Smith-Corona (Trade 2)
  *   Smith-Corona > Hermes (Trade 3)

  If you view these machines as static investment assets, you have violated the principle of *transitivity*. But typewriters aren't stocks; they are tools and experiences. Your preferences weren't cyclical; they were **state-dependent.**

  *   **In January:** You valued *aesthetics/typeface* most. (Olivetti won).
  *   **In Summer:** You valued *portability* most. (Smith-Corona won).
  *   **In Autumn:** You likely valued *typing feel/stability* most, or realized portability wasn't worth the sacrifice. (Hermes won).

  You didn't change your mind about the machines; **your life context changed around the machines.** That isn't inconsistency; that's adaptation.

  ### 2. The $150 Was a Rental Fee, Not a Loss
  You are viewing the $150 as money lost. I suggest you reframe it as **rent.**

  If you had rented a high-end vintage typewriter for three months, you would have paid a premium. Instead, you entered the secondary market. In any collectibles market (cars, watches, typewriters), there is a "spread." When you trade or sell, you usually get wholesale value; when you acquire, you pay retail or near-retail.

  You paid a $150 "spread" to have the Olivetti experience for a few months and the Smith-Corona experience for a few months.
  *   Was the Olivetti typeface worth ~$75 of enjoyment?
  *   Was the Smith-Corona portability worth ~$75 of enjoyment?

  If the answer is yes, the trade was rational. You consumed the utility of those machines during the interim. You didn't end up with the *same* machine you started with; you ended up with a Hermes 3000 that you now **know** is the right machine, having empirically tested the alternatives.

  ### 3. The "Grass is Greener" vs. The Process of Elimination
  The reason this is bugging you is that you suspect you might have been chasing a ghost. You wonder if you could have saved the $150 if you had just realized the Hermes was the best one back in January.

  This is the **Hindsight Bias.**

  In January, you didn't know the Hermes was the best one for you *in the long run*. You only knew you loved the Olivetti's typeface. You had to trade for the Olivetti to learn that the typeface wasn't enough to sustain your happiness. You had to trade for the Smith-Corona to learn that portability wasn't worth the typing compromise.

  You didn't run in a circle; you walked a **spiral.** You are at the same coordinate (owning a Hermes 3000), but you are at a higher elevation of knowledge. You now own that Hermes with conviction, whereas before you owned it with curiosity.

  ### 4. Where the Irrationality *Could* Creep In
  While this specific cycle wasn't irrational, there is a warning sign in your description: *"now its a full blown habit."*

  The only way this becomes irrational is if the *trading itself* becomes the hobby, rather than the *collecting or using.*
  *   **Rational:** Trading to find the perfect tool for your current needs.
  *   **Irrational:** Trading because the dopamine hit of the "new" machine is the only thing that satisfies you, leading to a perpetual cycle where you never keep a machine long enough to write with it.

  If you keep the Hermes for a year and write your novel on it, the $150 was a bargain. If you trade the Hermes next month for a Royal Quiet De Luxe because you're bored, then your friend is right: you have a liquidity problem, not a taste problem.

  ### The Verdict
  You weren't being irrational. You were engaging in **market-based discovery.**

  In the world of vintage collecting, cash is often the tool we use to bridge the gap between what we *think* we want and what we *actually* want. You spent $150 to buy certainty.

  **My advice:** Stop trading for six months. Force yourself to use the Hermes 3000. If the itch to trade disappears, you've solved the puzzle. If the itch remains, the problem isn't the typewriters; it's the hunt. But regarding this specific cycle? Don't let your friend make you feel dumb. You paid a small fee to learn exactly what you value. That's not a loss; that's education.
