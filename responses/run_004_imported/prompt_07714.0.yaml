          *   *Refinement:* Hofstadter argues it *is* decisive for superrational agents. But in a practical sorting for a general user, it's often seen as conditional on the other agent's type. However, the prompt asks for "freestanding rational justification". Superrationality claims to be freestanding *given* the symmetry of reasoning. But is it "decisive" in the real world? Usually classified as conditional on the assumption of correlated reasoning. Let's look at the "Conditional" definition: "only given further assumptions — e.g., about shared reasoning procedures... that a partner assigned by an automated matching service may or may not satisfy". This fits Hofstadter perfectly.
          *   *Selection:* Conditional.

