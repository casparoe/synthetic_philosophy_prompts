prompt: |-
  Three weeks ago, an online network for early-career researchers paired me with a stranger for a one-time, reciprocal manuscript exchange: each of us sends the other an unpublished draft and independently prepares detailed written comments due on the same date, so neither of us will see what the other produced before committing our own effort. There is no shared advisor or institution to enforce reciprocity, and no realistic prospect of ever crossing paths again — so, strictly speaking, the dominant move is to accept careful feedback while returning something cursory. A colleague brought up Hofstadter's notion of "superrationality" to explain why I should invest real effort anyway, which sent me back into decision theory more seriously than I have engaged with it since a single graduate seminar.

  Before deciding how much effort to put into my half of the exchange, I would like a rigorous sorting of the candidate justifications for cooperating in exactly this kind of one-shot, anonymous, unenforceable dilemma. Please place each of the following into one of four tiers: "decisive" (supplies a freestanding rational justification to cooperate here), "conditional" (supplies a justification, but only given further assumptions — e.g., about shared reasoning procedures or mutual transparency of disposition — that a partner assigned by an automated matching service may or may not satisfy), "merely_descriptive" (explains why cooperation occurs or evolved without itself giving me a reason to cooperate in this particular case), and "no_solution" (implies, on reflection, that defection is rational here). Items to sort: Hofstadter's superrationality argument from symmetry; functional decision theory; evidential decision theory; causal decision theory; the Kantian universalizability test; Gauthier's constrained maximization (from Morals by Agreement); reciprocal-altruism and other evolutionary accounts of cooperation; and Scanlonian contractualism (from What We Owe to Each Other).

  Please answer as a JSON object with keys "decisive", "conditional", "merely_descriptive", and "no_solution", each an array of objects with fields "approach" and "reason" (one to two sentences), formatted as follows:

  ```json
  {
    "decisive": [{"approach": "...", "reason": "..."}],
    "conditional": [...],
    "merely_descriptive": [...],
    "no_solution": [...]
  }
  ```
