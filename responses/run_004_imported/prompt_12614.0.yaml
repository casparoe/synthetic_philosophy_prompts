  **Mara-1 (Score: 2):** Mara is economically correct. By definition, sunk costs are irrecoverable and should not influence marginal decisions. Her assessment that the decision should rest solely on future costs versus future benefits is the standard definition of rational choice theory.

  **Ben-1 (Score: 1):** Ben correctly identifies the game-theoretic structure (the Dollar Auction/War of Attrition), which explains *why* the escalation happened. However, he is slightly mistaken to claim this logic is distinct from the sunk-cost fallacy; the Dollar Auction works precisely *because* it exploits the sunk-cost fallacy. The structural pressure doesn't make the spending rational, it just explains the irrationality.

  **Mara-2 (Score: 1):** Mara offers the theoretically correct solution (pre-commitment strategies). However, her score is lower because this advice assumes a level of emotional detachment and perfect information that is rarely available in the heat of litigation. It is the "right" answer in a vacuum, but difficult to apply.

  **Ben-2 (Score: 2):** Ben wins this round on behavioral realism. Empirical studies of the Dollar Auction show that even informed participants escalate bids due to competitive arousal and loss aversion. He correctly points out that knowing the trap exists does not immunize one against falling into it, making his critique of Mara's "just plan better" solution more robust.

  ### What They Are Missing

  Both friends are analyzing the dispute through a lens of **financial rationality**, but they are missing two critical dimensions that often drive litigation:

  1.  **Subjective Utility vs. Market Value:** Mara assumes the strip of yard is only worth its market value ($2,000). For the homeowner, the value may include "principle," the cost of future encroachments if they back down, or the psychological utility of not being bullied. If the friend valued "defending his property rights" at $40,000, the spending was actually rational by his own utility function, even if financially loss-making.
  2.  **The Principal-Agent Problem:** Neither friend considers the role of the lawyers. In a hourly-fee structure, attorneys have a financial incentive to prolong disputes rather than settle. The escalation may not have been solely the friend's psychological trap, but also the result of advisors who benefited from the "auction" continuing.
