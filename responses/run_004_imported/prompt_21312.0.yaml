      *   **Stage 3: The Philosophical Expansion (1980s-Present).** Dennett ("Cognitive Wheels"), Fodor ("The Frame Problem Strikes Back"). They argue the technical fix misses the point. The real problem is *semantic relevance*. How does the system know *which* rules to apply in the first place? How does it know what matters in an open world?
