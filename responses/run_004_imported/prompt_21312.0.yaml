answer: |-
  This is one of the most famous and understandable points of confusion in the philosophy of AI. You are not missing anything; the confusion arises because the term "The Frame Problem" refers to two distinct, though related, problems that share a name but live in different neighborhoods.

  To reconcile your seminar readings, you need to distinguish between the **Logical Frame Problem** (the technical engineering hurdle) and the **Epistemological Frame Problem** (the deep cognitive mystery).

  Here is the breakdown of how these two halves fit together, why they seem contradictory, and how they relate to modern AI.

  ### 1. The Logical Frame Problem (McCarthy & Hayes)
  **Status:** *Largely Solved (in closed domains)*

  When McCarthy and Hayes coined the term in 1969, they were talking about a specific technical headache in **Situation Calculus** (a logic-based way of representing the world).

  *   **The Issue:** In formal logic, if you write a rule that says `Action(Paint, Chair) -> Color(Chair, Red)`, logic does not automatically assume that `Location(Chair)` stays the same. To be logically rigorous, you historically had to write "frame axioms" for every property that *doesn't* change (e.g., "Painting the chair doesn't move it," "Painting the chair doesn't change the phone number," etc.). This creates a combinatorial explosion.
  *   **The Fix:** As your professor noted, formalisms like **STRIPS**, **Circumscription**, and **Successor-State Axioms** (Ray Reiter, 1991) solved this. They introduced a "default assumption": *Assume everything stays the same unless an action explicitly changes it.*
  *   **The Scope:** This works beautifully in "toy worlds" or closed domains (like a blocks world or a planning schedule) where the system knows all the relevant rules in advance.

  **Takeaway:** When AI researchers say "The Frame Problem is solved," they mean this specific bookkeeping issue in symbolic logic has efficient workarounds.

  ### 2. The Epistemological Frame Problem (Dennett & Fodor)
  **Status:** *Unsolved (and arguably the core problem of cognition)*

  In the 1980s, philosophers like Daniel Dennett (in "Cognitive Wheels") and Jerry Fodor looked at the AI researchers' "solution" and said, "You've solved the bookkeeping, but you haven't solved the thinking."

  They generalized the term. To them, the Frame Problem isn't about how to write logic axioms efficiently; it is about **Relevance**.

  *   **The Issue:** In the real world, there are infinite facts. When a robot needs to pull a wagon out of a room (Dennett's famous example), it needs to know that pulling the wagon will move the wagon. But it also needs to know that pulling the wagon won't change the color of the walls, won't cause the moon to crash into the earth, and won't change the price of tea in China.
  *   **The Deeper Problem:** The technical solutions (like STRIPS) work because the *human programmer* pre-selected which facts matter. The robot doesn't figure out what is relevant; the engineer hard-coded the relevance.
  *   **Dennett's Point:** How does a mind (biological or artificial) determine *what to consider* without checking everything? If you have to check every fact in the universe to see if it's relevant to your current action, you will die (like Dennett's robot, which starves while deducing irrelevant implications as the bomb ticks).
  *   **Fodor's Point:** Fodor argued this shows the mind isn't just a computational module. Computation is local (step-by-step); relevance is global (depends on the whole context). Therefore, you can't compute relevance purely syntactically.

  **Takeaway:** When philosophers say "The Frame Problem is unsolved," they mean we have no idea how a system determines *salience* and *context* in an open world without human hand-holding.

  ### 3. Reconciling the Two Halves
  The contradiction in your seminar comes from a **scope shift**.

  *   **The AI Researchers** are solving: "How do we efficiently update a database of facts after an event?"
  *   **The Philosophers** are asking: "How does the system know which database of facts to look at in the first place?"

  Think of it like writing a mystery novel.
  *   **The Logical Problem:** Once you decide the butler is the killer, how do you efficiently edit the previous chapters to ensure there are no contradictions? (This is the STRIPS/Successor-State solution).
  *   **The Epistemological Problem:** How do you decide *that* the butler is the killer out of all the possible people in the world, based on a vague hunch and context clues? (This is the Dennett/Fodor problem).

  The AI researchers solved the editing software. The philosophers are pointing out that the software doesn't know how to write the story.

  ### 4. Why This Matters for LLMs Today
  Your professor mentioned LLMs because this distinction is crucial for evaluating them.

  *   **Do LLMs solve the Logical Frame Problem?** In a way, yes, but differently. They don't use successor-state axioms. They use statistical prediction. They often "hallucinate" because they don't actually track truth values or state changes logically. If you tell an LLM a story where a cup is moved, it might forget where the cup is in the next paragraph. It lacks a persistent world model.
  *   **Do LLMs solve the Epistemological Frame Problem?** This is the big debate. LLMs are incredibly good at *simulating* relevance. They can ignore irrelevant info in a prompt better than old symbolic AI. However, critics argue this is just "stochastic parrot" pattern matching. They don't *understand* why something is relevant; they just predict that in this linguistic context, this token usually follows that token.
      *   If you ask an LLM a question that requires deep causal reasoning about the physical world (e.g., "If I put the key in the cup and turn the cup upside down, where is the key?"), older models failed miserably. Newer models are better, but they still struggle with **grounding**—connecting the symbols to actual physical constraints.

  ### Summary for Your Seminar
  If you want to impress your section, you can frame the reconciliation like this:

  > "It seems the confusion stems from the **Frame Problem** being used as a homonym.
  >
  > 1.  **McCarthy/Hayes/Reiter** addressed the **Representational Frame Problem**: How to formally encode non-change without infinite axioms. This is technically solvable via default logic and successor-state axioms in closed systems.
  > 2.  **Dennett/Fodor** addressed the **Relevance Frame Problem**: How an agent identifies *which* facts are salient in an open environment without exhaustive search. This remains unsolved because technical fixes rely on human-engineered ontologies.
  >
  > The 'contradiction' is that AI solved the syntax of change, but philosophy is still asking about the semantics of relevance. Modern LLMs complicate this by statistical approximation of relevance without explicit representation, which might be a workaround or just a different version of the same hole."

  This acknowledges that the AI people weren't "fooling themselves" (they solved the math problem they set out to solve), but the philosophers weren't "out of touch" (they correctly identified that the math problem was a subset of a much harder cognitive problem).
