  4.  **Developing the Example (The "Local vs. Global" Charity Swap):**
      *   *Party 1 (Alice):* An Effective Altruist. Moral Commitment: Maximizing overall well-being per dollar. She believes saving a life overseas is morally superior to funding a local park bench.
