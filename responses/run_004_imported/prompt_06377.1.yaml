              *   For A: Donating locally is morally suboptimal (opportunity cost of lives not saved). But getting B to donate globally saves lives (high value).
              *   For B: Donating abroad is morally distant/neglectful of neighbors. But getting A to support the local center strengthens the community (high value).
          *   Check constraints: No diet, animals, or environment.
