      *   Correct "rigidity"? Yes.
      *   Gentle tone? Yes.

  7.  (Mental Sandbox): *Wait, does Jeffrey Conditionalization ever commute?* Only if the partitions are independent or if the updates are specified via likelihood ratios (Wagner's constraint). Sanjay is right that *standard* JC (specifying target probabilities) doesn't commute. Ruth is right that *reformulated* JC (specifying Bayes factors) does. This is the key resolution. I need to make sure this distinction is crystal clear.

  8.  (Rigidity Check): User said: "what a Jeffrey shift holds fixed is a bunch of conditional probabilities relative to whatever you already believe going into it". This is essentially correct. $P_{new}(H|E_i) = P_{old}(H|E_i)$. I will confirm this is accurate.

