      *   *Correction on Rigidity:* The user said "what a Jeffrey shift holds fixed is a bunch of conditional probabilities." That is correct. I should validate that clearly.
      *   *Chemistry Analogy:* Use the UV-vis analogy. Baseline correction (prior) vs. Peak height (evidence). If you baseline correct *after* integrating vs. *before*, you get different results. This mirrors the order dependence.
      *   *Technical Detail:* Mention Carl Wagner. He's the key figure on the commutativity of Jeffrey Conditionalization via likelihood ratios.
