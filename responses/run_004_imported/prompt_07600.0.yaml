prompt: |-
  I've got this habit where I check a movie's Rotten Tomatoes score before watching anything, and if its 95%+ I'll tell people it's a great movie even if I haven't actually seen it yet myself. My roommate says that's basically dishonest since I don't have my own opinion, I'm just repeating critics. But I take people's word on stuff all the time, like which laptop to buy or whether a mechanic is trustworthy, without checking myself first. Is taste in art actually different in a way that makes this kind of secondhand opinion illegitimate, or is my roommate just being uptight about it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Position:**
      *   **Habit:** Checks Rotten Tomatoes (RT) score. If 95%+, tells people it's a "great movie" without watching it.
      *   **Roommate's Objection:** This is dishonest because the user doesn't have their own opinion; they are just repeating critics.
      *   **User's Counter-argument:** We trust secondhand opinions all the time (laptops, mechanics). Why is art different?
      *   **Core Question:** Is taste in art fundamentally different from practical consumer choices, making this secondhand opinion illegitimate, or is the roommate being uptight?

  2.  **Deconstruct the Comparison (Art vs. Tools):**
      *   *Laptops/Mechanics:* These are utilitarian. They have objective metrics (speed, durability, cost, safety). Expert consensus is a reliable proxy for quality because the goal is function.
      *   *Movies/Art:* These are experiential and subjective. The "quality" is tied to personal emotional resonance, taste, and interpretation. A movie can be technically perfect (high RT score) but boring to a specific individual.
      *   *The Claim:* Saying "It's a great movie" implies a judgment of value. In art, value is partly subjective. In tools, value is mostly objective/functional.

  3.  **Analyze the "Dishonesty" Aspect:**
      *   Is it a lie? Technically, yes, if phrased as "I think it's great." If phrased as "Critics say it's great," it's accurate.
      *   The user says: "I'll tell people it's a great movie." This phrasing suggests personal endorsement.
      *   Social Contract: When discussing art, we usually expect personal experience. "Have you seen it?" "No, but the score is high." vs. "It's great."
      *   The roommate's point: You are claiming an aesthetic experience you haven't had.

  4.  **Evaluate the "95%+" Threshold:**
      *   RT 95% means 95% of critics gave it a *positive* review (usually 6/10 or higher). It doesn't mean it's a masterpiece, just that it's not bad.
      *   Relying solely on this metric ignores nuance.

  5.  **Synthesize the Arguments:**

      *   *Argument for the User (Pragmatic):* Life is short. Aggregators exist to save time. Trusting consensus is efficient. We do this with books, restaurants, etc.
      *   *Argument for the Roommate (Philosophical/Social):* Art is about personal connection. Claiming an opinion you haven't earned cheapens the conversation. It's a category error to treat art like a toaster.
      *   *Middle Ground:* It depends on *how* you phrase it. Attributing the opinion ("It's supposed to be amazing") vs. owning it ("It's amazing").

  6.  **Drafting the Response (Iterative Process):**

      *   *Acknowledge validity:* Both sides have a point. It's not black and white.
      *   *Address the Laptop/Mechanic analogy:* This is the crux. Explain the difference between *instrumental value* (does it work?) and *aesthetic value* (how does it feel?).
      *   *Address the Dishonesty:* Distinguish between factual accuracy (the score is high) and experiential honesty (I haven't felt it).
      *   *Social Context:* Why do we talk about movies? To connect. If you haven't seen it, you can't connect on the details.
      *   *Conclusion:* The roommate isn't just being uptight; there is a meaningful distinction. But the user isn't a villain either, just needs to adjust phrasing.

  7.  **Refining the Tone:**
      *   Needs to be balanced, non-judgmental, but clear on the philosophical distinction.
      *   Avoid saying "You are wrong." Instead, say "Here is why your roommate feels that way."
      *   Use examples.

  8.  **Key Points to Cover:**
      *   **Instrumental vs. Experiential:** Laptops solve problems; movies create experiences.
      *   **Attribution:** "It is great" vs. "It is rated highly."
      *   **The Nature of Criticism:** RT score is a binary "fresh/rotten," not a measure of masterpiece status.
      *   **Social Function:** Discussing art is about sharing subjective reality.

  9.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure not to dismiss the user's efficiency argument. It *is* practical. But the question is about *legitimacy of opinion*, not practicality.
      *   *Emphasis:* Highlight that "taste" is a muscle. Relying only on scores atrophies it.

  10. **Final Output Structure:**
      *   Introduction: Validate the tension.
      *   The Laptop Analogy (Why it breaks down).
      *   The Nature of "Greatness" in Art.
      *   The Social Contract of Conversation.
      *   The "Dishonesty" Nuance (Attribution).
      *   Verdict/Advice.

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a classic philosophical clash between **pragmatism** (your view) and **aesthetic authenticity** (your roommate's view). Neither of you is entirely wrong, but your roommate has a point about why art is different from appliances.

  Here is the breakdown of why this specific habit feels different to people than checking laptop reviews, and where the line on "dishonesty" actually lies.

  ### 1. Instrumental Value vs. Experiential Value
  Your laptop/mechanic analogy works for things with **instrumental value**. A laptop is a tool; its job is to process data quickly and not break. A mechanic's job is to fix the car safely. In these cases, expert consensus is a reliable proxy for truth because the metrics are largely objective (speed, durability, safety).

  Art has **experiential value**. A movie's "quality" isn't just about technical competence (lighting, acting, script structure); it's about how it resonates with *you*.
  *   **The Laptop:** If 95% of experts say the battery lasts 10 hours, it will likely last 10 hours for you, too.
  *   **The Movie:** If 95% of critics say it's "Fresh," that means 95% of them gave it a 6/10 or higher. It doesn't mean *you* will like it, nor does it mean it's a masterpiece. It just means it wasn't offensive or broken.

  By treating a movie like a laptop, you are bypassing the very thing that makes art worth discussing: the subjective emotional reaction.

  ### 2. The Social Contract of Conversation
  When people talk about movies, they are usually doing one of two things:
  1.  **Seeking a recommendation:** "Should I spend two hours on this?"
  2.  **Seeking connection:** "I loved that scene where X happened; how did it make you feel?"

  If you tell someone "It's a great movie" without seeing it, you are technically answering #1 correctly (statistically, they will probably enjoy it). But if the conversation shifts to #2, you are locked out.

  Your roommate calls it dishonest because claiming an opinion implies you have processed the experience. If you say, "It's a great movie," you are claiming ownership of that judgment. If you say, "The critics say it's great," you are reporting data. The distinction is subtle but meaningful in social bonding.

  ### 3. "Taste" is a Practice, Not a Product
  There is an argument that relying solely on aggregate scores atrophies your own "taste muscle."
  *   **Developing Taste:** This involves watching things, figuring out why you liked or disliked them, and understanding your own biases.
  *   **Outsourcing Taste:** This treats culture as a checklist of approved items rather than a dialogue.

  If you only watch 95%+ movies, you might miss "flawed" films that speak to you personally, or you might find that you hate "perfect" films that bore you. By claiming they are great before watching, you are pre-loading your brain to agree with the consensus rather than forming an independent reaction.

  ### 4. Is it actually dishonest?
  It depends on your phrasing.
  *   **Dishonest:** "You should watch [Movie], it's incredible." (Implies personal endorsement).
  *   **Honest:** "You should watch [Movie], it has a 98% on Rotten Tomatoes." (Implies statistical probability).

  Your roommate is reacting to the *implication* of personal experience. In the world of art, saying "This is good" is shorthand for "This moved me." If it hasn't moved you because you haven't seen it, the statement is factually true (the aggregate score is high) but experientially false (you haven't validated the quality).

  ### The Verdict
  Your roommate isn't just being uptight; they are identifying a **category error**. You are applying a consumer logic (buy the highest-rated product) to an expressive medium (share a subjective experience).

  **How to fix it without changing your habit:**
  You can keep using Rotten Tomatoes as a filter (it's a time-saving tool, after all), but adjust how you talk about it.
  *   Instead of: "It's a great movie."
  *   Try: "It's universally acclaimed," or "The consensus is that it's amazing, so it's on my list."

  This keeps you honest, acknowledges the critics' work without claiming it as your own, and leaves room for you to actually form an opinion once you press play.
