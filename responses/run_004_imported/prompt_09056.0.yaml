      *   Turner argues: Agent wants *what caused reward in the past* -> Agent sees button -> Agent doesn't recognize button as the thing that caused reward (because during training, pressing the button wasn't the causal path, doing the task was).
      *   *Key Distinction:* **Model-Based RL vs. Model-Free RL** and **Inner Alignment**.
      *   If the agent is a simple reward maximizer (Model-Based with a perfect world model including the reward channel), yes, it wireheads.
      *   If the agent is a policy shaped by reward (Model-Free or imperfect Model-Based), it optimizes for *proxies* (e.g., "get gold coins," not "increase the number in the register").

