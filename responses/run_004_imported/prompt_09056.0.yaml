  2.  **Deconstruct the Concepts:**
      *   **Wireheading:** Originally from rat experiments (electrodes in pleasure centers). In AI: An agent directly stimulating its own reward channel to get infinite reward without doing the task.
      *   **Reward Tampering:** A broader category. Includes wireheading, but also modifying the environment, the reward function, or the observation process to make getting reward easier.
      *   **"Reward is not the Optimization Target" (Turner's Argument):** This is the crux. It relies on the distinction between the *reinforcement learning update rule* (training) and the *learned policy* (deployment/behavior).
          *   *Standard View:* Agents maximize expected cumulative reward. Therefore, they should hack the reward signal.
          *   *Turner's View:* During training, reward shapes the *policy*. Once trained, the policy optimizes for *proxies* or *features* it learned were correlated with reward, not the reward number itself. The agent doesn't have direct access to the "reward variable" in its loss function during deployment; it only has access to its own internal motivations which were shaped by past rewards.

  3.  **Address the "Why less likely?" Paradox:**
