      *   **Conclusion:** Summarize. Take the stand clearly.

  6.  **Refining the Tone:**
      *   Avoid overly dense jargon where possible.
      *   Use his metaphors (wire, glass, steel).
      *   Be decisive. No "on the one hand, on the other."
      *   *Self-Correction during drafting:* I need to make sure I don't just say "Engineering is different." I need to answer the metaphysical question. The metaphysical answer is "Powers are primitive." The engineering implication is "Your tests track the powers because the world is stable."

  7.  **Final Polish:** Check against the prompt requirements.
