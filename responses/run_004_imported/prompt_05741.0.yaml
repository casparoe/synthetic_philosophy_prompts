  This is a strong submission, clearly from a student who has done the reading and can synthesize complex arguments. However, there is one significant philosophical "contamination" in the final section (Markovits) that reads smoothly but is technically inaccurate regarding the specific case of Huckleberry Finn. In a graduate seminar, precision on that distinction is the difference between an A and an A-.

