      *(Double check Yablo move)*: Yablo is generally considered the strongest defense against Kim. However, Elena's critique that the analogy is unproven is the standard objection to Yablo (e.g., by Kim or Bennett). It's a stalemate, but Elena successfully shifts the burden of proof back to Daniel. I'll call it a point for Elena on burden of proof, but acknowledge Daniel's framework is influential.

