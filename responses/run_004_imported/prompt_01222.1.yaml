prompt: |-
  I've been working through some of Aquinas's political writings on my own, and as I understand him, a ruler who governs for his own benefit rather than the common good forfeits the legitimacy that makes obedience owed to him, which is why Aquinas treats killing such a ruler as a praiseworthy act rather than murder. What I can't square is why, if that's really his view, the broader Catholic tradition has historically been so much more cautious about actual attempts to kill oppressive rulers, often condemning them outright even when the ruler in question was plainly tyrannical. Shouldn't consistency with Aquinas's own premises commit the tradition to endorsing tyrannicide far more readily than it actually has? I'd like help figuring out where my reading of the argument must be going wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Premise:** The user believes Aquinas argues that a ruler governing for self-interest rather than the common good forfeits legitimacy, making obedience not owed and killing them praiseworthy (not murder).
      *   **Observation:** The user notes that the broader Catholic tradition has historically been very cautious about tyrannicide, often condemning it even against oppressive rulers.
      *   **Conflict:** The user sees a contradiction between Aquinas's supposed view and the tradition's caution.
      *   **Goal:** The user wants to know where their reading of Aquinas (or the tradition) is going wrong to resolve this inconsistency.

  2.  **Evaluate the User's Reading of Aquinas:**
      *   *Claim:* "Aquinas treats killing such a ruler as a praiseworthy act rather than murder."
      *   *Fact Check:* This is a common misconception. Aquinas *does* discuss tyranny, but his position is nuanced and often misinterpreted.
      *   *Key Text:* *De Regno* (On Kingship) and *Summa Theologiae* (II-II, Q. 42, A. 2; Q. 64, A. 3).
      *   *Aquinas's Actual View:*
          *   Tyranny is unjust.
          *   However, private individuals generally do *not* have the authority to kill a tyrant.
          *   Public authority is required for execution.
          *   Sedition (rising up against a ruler) is usually a mortal sin unless the ruler is a usurper or there is a public mechanism for removal.
          *   In *De Regno*, he actually warns *against* killing tyrants because it often leads to worse tyranny or instability.
          *   He suggests prayer, patience, or public action (by representatives) rather than private assassination.
      *   *Conclusion:* The user's premise that Aquinas endorses private tyrannicide as "praiseworthy" is largely incorrect or at least a significant oversimplification of a much more cautious stance.

  3.  **Evaluate the Broader Catholic Tradition:**
      *   *Development:* Post-Aquinas, the School of Salamanca (Suárez, Vitoria) and Jesuit theologians (Mariana) did discuss tyrannicide more openly, but even then, with strict conditions.
      *   *Counter-Reformation:* The Church became very cautious after the assassination of Henry III and Henry IV (linked to Jesuit theories).
      *   *Modern Teaching:* Emphasis on rule of law, non-violence, and the dangers of anarchy. *Catechism of the Catholic Church* (2242) allows for armed resistance only under very strict conditions (grave violations, last resort, no worse disorder), but doesn't explicitly endorse assassination.
      *   *Consistency:* The tradition isn't necessarily inconsistent with Aquinas if Aquinas is read correctly (cautiously). The tradition *is* consistent in its caution.

  4.  **Identify the Core Misunderstanding:**
      *   The user is likely conflating Aquinas's *definition* of tyranny (which makes it illegitimate in principle) with his *prescription* for resistance (which is highly restricted).
      *   The user assumes "forfeiture of legitimacy" = "anyone can kill them." Aquinas argues "forfeiture of legitimacy" = "authority may remove them," but private killing is usually sedition/murder.
      *   The user might be thinking of John of Salisbury (*Policraticus*), who was much more pro-tyrannicide, and attributing that to Aquinas.

  5.  **Drafting the Response:**

      *   **Acknowledge and Validate:** Start by acknowledging that this is a sophisticated and common question. The tension between political legitimacy and violence is real.
      *   **Correct the Reading of Aquinas (Crucial Step):**
          *   Clarify *De Regno* and *Summa Theologiae*.
          *   Distinguish between *usurpers* (no title) and *tyrants in exercise* (have title but abuse power). Aquinas treats these differently.
          *   Highlight the "Private vs. Public Authority" distinction. Aquinas generally forbids private individuals from executing judgment.
          *   Mention the "Greater Evil" argument (killing a tyrant often leads to worse chaos).
      *   **Explain the Tradition's Caution:**
          *   Why the caution? Fear of anarchy, scandal, and the sanctity of order.
          *   Mention the shift after the Wars of Religion (regicide fears).
          *   Reference the *Catechism* (2242-2243) on armed resistance (strict conditions).
      *   **Synthesize/Resolve the Tension:**
          *   The tradition isn't inconsistent with Aquinas; it's actually following his caution more than the popular caricature of him.
          *   The principle (tyranny is bad) remains, but the prudential judgment (killing is rarely the solution) is the bridge.
      *   **Nuance on "Tyrannicide":**
          *   Mention the Salamanca School (Suárez/Mariana) who were more permissive but still restricted.
          *   Note that the Church never dogmatically defined tyrannicide as a duty.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say Aquinas *never* allows it. In *Commentary on the Sentences*, he suggests that if there is no superior to judge the tyrant, the people *might* have a right, but he pulls back in later works. I should emphasize the *Summa* and *De Regno* as his mature thought.
      *   *Clarification:* Make sure to distinguish between "resistance" and "assassination." The tradition allows for resistance more often than assassination.
      *   *Tone:* Keep it academic, respectful, and theological/philosophical.

  7.  **Final Polish:**
      *   Structure with clear headings.
      *   Ensure the distinction between *legitimacy* and *licensure to kill* is clear.
      *   Check references (Summa II-II, Q. 42 on Sedition is key).

  8.  *(Final check against user prompt)*: Did I answer *why* the tradition is cautious if Aquinas supposedly wasn't? Yes, by showing Aquinas *was* cautious, so the tradition is consistent with him. Did I address the "forfeiture of legitimacy" point? Yes, by explaining that forfeiture doesn't grant private execution rights.

  9.  **Construct Output.** (Proceed to generate response based on these points.)
answer: |-
  You have identified a genuine tension in political theology, but the resolution lies primarily in correcting a common misconception about Aquinas's specific position. While your understanding of Aquinas's *definition* of tyranny is largely correct, your understanding of his *prescription* for dealing with tyrants is where the reading likely goes astray.

  The short answer is: **Aquinas is actually much more cautious about tyrannicide than the popular caricature suggests.** The broader Catholic tradition's caution is not a departure from Aquinas, but rather a faithful development of his prudential warnings.

  Here is a breakdown of where the reading needs adjustment and how the tradition maintains consistency.

  ### 1. Distinguishing Legitimacy from Private Execution
  Your premise states: *"A ruler... forfeits the legitimacy that makes obedience owed to him, which is why Aquinas treats killing such a ruler as a praiseworthy act."*

  Aquinas agrees with the first half but largely rejects the second. For Aquinas, the forfeiture of moral legitimacy does not automatically grant a private individual the authority to execute judgment.

  *   **Public vs. Private Authority:** In the *Summa Theologiae* (II-II, Q. 64, A. 3), Aquinas argues that killing a human being is generally sinful unless done by public authority for the common good (like a judge sentencing a criminal). A private citizen does not possess this authority. Even if a ruler is tyrannical, a private individual killing him is usually acting without public authority, which renders the act murder or sedition.
  *   **The Usurper vs. The Tyrant in Exercise:** Scholastic theology (following Aquinas) often distinguished between a ruler who had no right to the office at all (*tyrannus absque titulo*, a usurper) and one who ruled unjustly but held the office legitimately (*tyrannus in exercitio*).
      *   Regarding a **usurper**, Aquinas is more permissive, suggesting that removing them is not sedition because they never held authority.
      *   Regarding a **tyrant in exercise**, Aquinas is very restrictive. In *De Regno* (On Kingship), he explicitly warns against killing such rulers.

  ### 2. Aquinas's Prudential Warning in *De Regno*
  In *De Regno* (Book I, Chapter 6), Aquinas addresses the question of whether it is permissible to kill a tyrant. While he acknowledges the misery of tyranny, he argues against assassination for several pragmatic and theological reasons:

  1.  **The Risk of Worse Tyranny:** He argues that killing a tyrant often leads to greater instability. The conspirators may become tyrants themselves out of fear, or the succession crisis may lead to civil war, which harms the common good more than the original tyranny.
  2.  **The Danger to the Virtuous:** He notes that if killing rulers becomes acceptable, even good kings may be killed by subjects who merely *perceive* them as tyrants. This undermines the stability required for a virtuous society.
  3.  **The Proper Remedy:** Aquinas suggests that if a tyranny is not excessive, it is better to endure it mildly than to risk greater evils by resisting. If it is extreme, he argues for **public authority** to intervene (e.g., representatives of the people or a superior authority, like an Emperor removing a local king), not private assassination.

  Therefore, when Aquinas speaks of "deposing" a tyrant, he is generally speaking of a corporate or public act, not a private act of violence.

  ### 3. The Question of Sedition (*Summa Theologiae* II-II, Q. 42, A. 2)
  In his discussion on sedition, Aquinas defines it as opposing the unity of the people. He argues that resisting a tyrant is *not* sedition **if** the tyrant is the one disrupting the common good. However, he immediately qualifies this:

  > "Nevertheless, if the excess of tyranny is unbearable, it would be an act of virtue for courageous men to kill the tyrant and expose themselves to the danger of death to set the multitude free."

  This is the quote often used to support your reading. However, context is key. Aquinas is discussing this in the context of **Old Testament examples** (like Ehud killing Eglon) and specific historical instances where there was no higher public authority to appeal to. He does not present this as a general policy for Christian governance. In his later, more mature political thought (*De Regno*), he pulls back from this, emphasizing the dangers of such acts.

  ### 4. Why the Tradition Became More Cautious
  If Aquinas was already cautious, why did the later tradition (especially post-16th century) become even more so?

  *   **The Wars of Religion:** In the 16th and 17th centuries, theories of tyrannicide were weaponized. Catholics were accused of plotting to kill Protestant monarchs (e.g., William of Orange, Henry IV of France), and Protestants theorized killing Catholic monarchs. The assassination of Henry III and Henry IV of France, linked by some to Jesuit theories, caused a massive backlash.
  *   **Condemnation of Regicide:** In response, the Church moved to protect the sanctity of order. The Council of Constance (1415) had already condemned Jean Petit's justification of the murder of the Duke of Orléans. Later, Pope Innocent X and others condemned propositions that allowed private individuals to kill tyrants without public trial.
  *   **Development of the Rule of Law:** As political theory developed (e.g., Suárez, Bellarmine), the emphasis shifted toward the idea that authority resides in the *community*, which delegates it to the ruler. Therefore, only the community (through representatives/law), not an individual, can reclaim that authority.

  ### 5. Modern Catholic Teaching
  The *Catechism of the Catholic Church* (2242-2243) reflects this developed caution. It acknowledges a right to armed resistance but sets an incredibly high bar:
  1.  Certain, grave, and prolonged violations of fundamental rights.
  2.  All other means of redress have been exhausted.
  3.  Such resistance will not provoke worse disorders.
  4.  There is a well-founded hope of success.
  5.  It is impossible reasonably to foresee any better solution.

  Notice that even here, the Catechism speaks of "armed resistance," not assassination. The tradition maintains that the *end* (removing tyranny) does not justify *any means* (murder/assassination).

  ### Summary of the Correction
  Your reading goes wrong in assuming that for Aquinas, **illegitimacy = license for private killing.**

  *   **Aquinas's View:** Tyranny is illegitimate, but removing it requires public authority. Private killing is usually sinful sedition because it risks greater harm to the common good.
  *   **The Tradition's View:** Consistent with Aquinas's mature thought. The tradition emphasizes that the common good includes order and stability. Destroying order to remove a bad ruler often destroys the common good you are trying to save.

  The consistency you are looking for is found in the **principle of double effect** and **prudential judgment**. Both Aquinas and the tradition agree that tyranny is an evil, but they also agree that the violence required to remove it privately is often a greater evil. Therefore, the tradition is not contradicting Aquinas; it is applying his warning that "it often happens that this [killing the tyrant] is followed by much greater dangers for the people than the tyranny itself."
