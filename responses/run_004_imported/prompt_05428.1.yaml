      *   Strongest versions? Yes.
      *   No default winner? Yes.

      *Let's add a bit of atmosphere.* The sea is cold. The engine is the only heat. It emphasizes the isolation of the individuals.

      *(Final thought on the ending)*: If Mara steers to the five, Elias might object. If they stall, no one is saved. I think the most dramatic ending is that they act, but the argument lingers in the air. I will have them prepare to act, but the philosophical impasse remains unresolved in their minds.

      *Wait, one nuance:* Taurek argues for a *chance* procedure to give equal concern. Scanlon argues that equal concern *leads* to saving the greater number. This is the crux. I must highlight this.

