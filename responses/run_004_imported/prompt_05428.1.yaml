answer: |-
  **SCENE:** *The bridge of the rescue cutter "Aequitas." The engine idles, a low thrum vibrating through the deck. Outside, the North Atlantic is grey and churning. To port, fifty yards off, a single figure clings to a debris field. To starboard, the same distance, a life raft bobs, crowded with five figures. The fuel gauge hovers near empty. Enough for one run.*

  *ELIAS stands at the helm, hand resting on the throttle. MARA stands beside him, clipboard in hand, though the data is already known.*

  **ELIAS:** Get the coin ready.

  **MARA:** Put the throttle to starboard, Elias.

  **ELIAS:** (Without looking) You know I can't do that. Not without the toss.

  **MARA:** We don't have time for superstition. Five people on the raft. One on the debris. We save the five.

  **ELIAS:** That's the math I'm refusing to do. To you, five lives outweigh one. To me, there is no "five lives." There is one person here, and one person there, and one person there... and one person over there. And one person on the port side. Each of them faces the same loss. Each of them loses *everything* if we don't come.

  **MARA:** I'm not adding up lives like gold bars. I'm looking at the principle we're acting on. If we turn to port, we are acting on a principle that says, "When you can save five or one, it is permissible to save the one." Can you justify that to the five people freezing on the starboard raft?

  **ELIAS:** I can justify it to the one person on the port side. If I turn starboard, I am telling him, "Your life is worth less than the sum of those others." But it isn't. His death is a total catastrophe for him. It's not 20% of a catastrophe. It's 100%. Taurek was right: there is no super-person who experiences the "sum" of the five deaths. There are just five separate tragedies. Why should the fact that they are happening near each other give them more weight than the single tragedy happening over there?

  **MARA:** Because it's not about the weight of the tragedy. It's about the justification of the choice. Scanlon's test: Could the single man on the port side reasonably reject a principle that required us to save the greater number?

  **ELIAS:** Reasonably reject? He's going to die, Mara. That's a pretty reasonable ground for rejection.

  **MARA:** Not if he reasons from a general standpoint. If he were on the raft, he would want us to save the five. Since he could have been on the raft, he cannot reasonably reject a rule that applies to everyone equally. The rule "save the greater number" protects him in the majority of possible scenarios. It treats everyone's interest in surviving with equal respect.

  **ELIAS:** That's the trick, isn't it? You're smuggling utilitarianism in through the back door of "possible scenarios." But we aren't in the possible. We are *here*. Right now, he is the one. And those five are the five. If I toss a coin, I give every individual involved a 50% chance of survival. That is equal concern. If I steer starboard, I give the five 100% and the one 0%. I am sacrificing the one for the sake of the group. That is exactly what the separateness of persons forbids.

  **MARA:** You say equal concern requires a coin toss. I say equal concern requires saving the five. Think about the complaints. If we save the one, each of the five has a complaint against us: "You could have saved me, and you chose not to." If we save the five, the one has a complaint: "You could have saved me, and you chose not to."

  **ELIAS:** The complaints are identical in force. "I died when I could have lived."

  **MARA:** They aren't identical. Because if we save the one, we are leaving *four* people to die who could have been saved *without any additional cost* to the one's claim. The one man's claim to be saved is no stronger than any single person on the raft. So, if we save him, we are privileging his claim over the claims of four others who have an *equal* claim. To do that is arbitrary. To save the five is to acknowledge that while his claim is equal to any *one* of theirs, it is not equal to *all* of theirs combined in terms of satisfying the most claims possible.

  **ELIAS:** There it is. "Satisfying the most claims." That's aggregation. You're saying the moral force of the five claims adds up to something greater than the one. But morality isn't about maximizing claim-satisfaction. It's about how I relate to *him*. (He points to port). If I toss a coin, I show him that his life matters just as much as any of the others. I don't treat him as a vessel of value that weighs less than five vessels. I treat him as a sovereign individual. If I steer starboard without the toss, I am using him as a means to maximize the good outcome.

  **MARA:** You're conflating "maximizing the good" with "minimizing the number of people who can reasonably complain." I am not using him. I am acknowledging that in a tragic choice where not everyone can be saved, the principle that no one could reasonably reject is the one that saves the most. Why? Because the single person cannot say, "My life is more important than theirs." He can only say, "My life is as important as theirs." And if it's as important, why should we let five people die to save one?

  **ELIAS:** Because letting five people die isn't worse than letting one person die, in the way you think. It's five times the loss, yes. But moral reason doesn't work like arithmetic. If I have a duty to *you*, and a duty to *him*, I can't discharge my duty to *him* by saying, "Well, I had a duty to five others." The duty is owed to individuals. The coin toss is the only procedure that honors the individual nature of the duty. It says, "I owe each of you a chance."

  **MARA:** But a chance isn't what they need. Survival is what they need. And you can provide survival to five, or survival to one. If you toss the coin and it lands on the one, you have actively chosen a world where four more people die than necessary. Can you justify that to the families of the four? "Sorry, we wanted to be philosophically pure about individual sovereignty, so we let four extra people drown."

  **ELIAS:** And if I steer starboard, I say to the one: "Sorry, you were outnumbered." We turn his bad luck into a death sentence. The coin toss shares the burden of the bad luck. It says, "Nature put us in this spot, but we won't compound it by deciding your life is worth less."

  **MARA:** Deciding his life is worth less isn't the reason. The reason is that we have a duty to rescue, and when duties conflict, we follow the principle that minimizes the violation of duties. We have a duty to the one. We have a duty to the five. We can't fulfill all of them. Fulfilling five duties is not "aggregation"; it's fulfilling more obligations. To choose the one is to willingly violate five obligations to fulfill one.

  **ELIAS:** But you don't have five obligations floating in the air. You have an obligation to *Alice*, an obligation to *Bob*, an obligation to *Charlie*... If I save Alice, I haven't violated an obligation to Bob in the same way I violate an obligation to the single man if I ignore him. The obligations aren't fungible.

  **MARA:** They are fungible in the context of rescue. The content of the obligation is "preserve life." If I can preserve five units of life or one, and I choose one, I am showing less respect for the value of life generally.

  **ELIAS:** No! I am showing equal respect for the *person*. That's the distinction you keep missing. Utilitarianism respects the *value* of the life. Contractualism, Taurek's way, respects the *status* of the person. Status is equal. Value might vary, but we don't measure that. If status is equal, then a lottery is the only fair arbiter between equal claims. Any other method introduces a hierarchy.

  **MARA:** A lottery isn't fair when the stakes are this asymmetric. Imagine the single man is you, Elias. And the five are strangers. Do you really want the principle to be "flip a coin"? Or do you want the principle to be "save the most lives possible"?

  **ELIAS:** (Pauses) If I'm the one... I want the coin. Because the coin gives me a chance. The principle "save the most" gives me zero. It writes me off.

  **MARA:** But if you're one of the five, you'd demand we save the most. So, which principle is "reasonable"? A principle that gives you a 50% chance when you're the one, but kills you 83% of the time when you're in the group? Or a principle that saves you whenever you're in the majority? The "save the most" principle is the only one that is stable across all positions.

  **ELIAS:** That's ex-ante reasoning. It's insurance logic. "I'll agree to sacrifice you if it's me in the majority, so you agree to sacrifice me if I'm in the minority." But morality isn't an insurance contract. It's about what I owe you *now*. Right now, that man on the port bow is not a statistical probability. He is a human being making a claim on me. And that claim is not diminished by the presence of others on the starboard bow.

  **MARA:** But the others on the starboard bow are also human beings making claims. If you ignore them to save the one, you are saying their claims count for nothing.

  **ELIAS:** I'm not saying they count for nothing. I'm saying they don't outweigh his.

  **MARA:** Then you are saying five equal claims equal one equal claim. That implies the five don't actually matter as five. It implies that once I have saved one person, saving a second, third, or fourth adds no moral weight. That's absurd.

  **ELIAS:** It adds no *decisive* weight. It tips the scale only if you think morality is about the total sum of good. If morality is about fairness between individuals, the scale stays balanced. Five against one is still a conflict between individuals. The only way to resolve a conflict between equals without a relevant difference is chance.

  **MARA:** (Grips the railing as the boat pitches) There is a relevant difference. The difference is the number of people left to die. We are not just choosing who lives. We are choosing who dies. If we go port, we choose five deaths. If we go starboard, we choose one. To choose five when you could choose one is to be responsible for four gratuitous deaths.

  **ELIAS:** And to choose the one by fiat is to be responsible for killing him by decision. With the coin, his death is fate. With your steering, his death is *policy*. I won't make policy that sacrifices the minority.

  **MARA:** And I won't follow a procedure that treats four extra deaths as morally irrelevant. Look at them, Elias. (She gestures starboard). They are waving. They know we see them. If we turn away, we are telling them, "You don't count enough."

  **ELIAS:** If we turn toward them without the toss, we tell him (Gestures port), "You don't count enough."

  **MARA:** No. We tell him, "You count exactly as much as each of them. But they are more numerous." We acknowledge his equal worth, but we acknowledge the reality of the situation. We can't save everyone. When we can't save everyone, the only non-arbitrary way to choose is to save the most. Anything else is caprice.

  **ELIAS:** A coin toss isn't caprice. It's a ritual of equality. It admits that we have no right to decide who is worth more.

  **MARA:** We aren't deciding who is worth more. We are deciding how to act when equal worths conflict. And the only action that respects the equal worth of *all* six people is to ensure that the fewest number of those equal worths are extinguished.

  *The engine idles. The silence stretches, filled only by the slap of water against the hull. The figure on the port debris field raises an arm, weakly.*

  **ELIAS:** (Hand tightening on the throttle) If I steer starboard, I carry the death of that man. I know it.

  **MARA:** And if you toss, and it lands port, you carry the deaths of the five. You carry the knowledge that you could have saved them, and you gambled. Which weight is heavier, Elias? The one you chose, or the four you threw away?

  **ELIAS:** (Whispering) The separateness of persons...

  **MARA:** ...doesn't vanish just because they are in the same raft.

  *Elias looks from the single figure to the group. His hand trembles slightly on the lever.*

  **ELIAS:** A coin toss gives everyone a chance.

  **MARA:** Saving the five gives everyone the best odds, overall. It's the only principle that doesn't waste lives.

  **ELIAS:** Lives aren't resources to be optimized, Mara.

  **MARA:** They aren't resources. They are people. And there are more of them over there.

  *Elias closes his eyes for a second. The engine note shifts as the boat begins to drift slightly with the current.*

  **ELIAS:** I'm not convinced.

  **MARA:** I know. But steer starboard.

  **ELIAS:** (After a long pause) I'm steering starboard. But I'm not doing it because five is greater than one.

  **MARA:** Why then?

  **ELIAS:** Because I can't live with the four extra ghosts. But don't tell me that makes it right.

  **MARA:** (Softly) It makes it justifiable. That's all we have.

  *Elias pushes the throttle. The boat heels sharply to starboard. The single figure on the port side begins to shrink in the distance, indistinguishable from the grey waves.*
