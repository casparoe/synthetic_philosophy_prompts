answer: |-
  Your gut is right. Your writing group is reacting to the *surface grammar*, but you are operating on *logical semantics*. These two lines do not contradict; they represent two different stages of logical deduction known as **epistemic uncertainty** versus **counterfactual necessity**.

  You can absolutely defend this. In fact, this logical shift is the engine of your mystery.

  Here is the breakdown of the mechanics, the linguistic distinction, and the script you can use to defend it to your editor.

  ### 1. The Logical Mechanics

  The contradiction your group sees is based on reading both sentences as claims about **possibility**. They aren't. One is a claim about **agency**, and the other is a claim about **capacity**.

  **Line 1: "If Callum didn't do it, someone else did."**
  *   **Logic Type:** Indicative Conditional (Epistemic).
  *   **Function:** This establishes the **Necessity of an Agent**.
  *   **The Mechanic:** We know the tea was spiked (Fact $A$). Therefore, a spiker must exist. At this stage, Rosalind does not know the constraints of the room. She is stating a tautology of crime: *Crime = Criminal.*
  *   **Truth Condition:** This statement is true as long as the tea was spiked. It leaves the variable of *who* open. It essentially says: $\text{Culprit} = \{\text{Callum} \cup \text{Others}\}$.

  **Line 2: "If Callum hadn't done it, no one would have."**
  *   **Logic Type:** Subjunctive/Counterfactual Conditional (Ontological).
  *   **Function:** This establishes the **Exclusivity of Opportunity**.
  *   **The Mechanic:** Rosalind now knows the constraints (locks, timing, motive). She is evaluating a hypothetical world where Callum is innocent. In that specific hypothetical world, the physical circumstances prevent anyone else from succeeding.
  *   **Truth Condition:** This statement is true because the *opportunity* was unique to Callum. It essentially says: $\text{Capable Culprit} = \{\text{Callum}\}$.

  **Why they don't contradict:**
  Line 1 says, "Someone poisoned the tea." Line 2 says, "Only Callum *could* have poisoned the tea."
  When you combine them, you don't get a contradiction; you get a **syllogism**:
  1.  Someone poisoned the tea. (Line 1)
  2.  Only Callum could have poisoned the tea. (Line 2)
  3.  Therefore, Callum poisoned the tea. (Conclusion)

  Your writing group thinks Line 1 claims "Others were *capable*." It doesn't. It claims "Others *existed*." Line 2 later reveals those others were *incapable*. That is an update in information, not a logical contradiction.

  ### 2. The Grammatical Distinction (The "Smoking Gun")

  If your editor pushes back, point to the verb moods. They are technically different types of conditionals.

  *   **Line 1 uses the Indicative Mood:** "Didn't / Did."
      *   This treats the condition as a **live possibility**. It reflects Rosalind's state of mind *at that moment*. She genuinely does not know. She is mapping the landscape of the crime.
  *   **Line 2 uses the Subjunctive/Counterfactual Mood:** "Hadn't / Would have."
      *   This treats the condition as **contrary to fact**. By the time she says this, she effectively knows Callum is guilty. She is using the counterfactual to demonstrate *why* he must be guilty. She is saying, "In any universe where Callum is innocent, this crime does not occur."

  **The Defense:** You are not contradicting yourself; you are shifting from an **open investigation** (Indicative) to a **closed deduction** (Subjunctive).

  ### 3. How to Defend This to Your Editor

  If this gets flagged in edits, do not apologize. Frame it as a deliberate characterization of Rosalind's deductive process. Here is a script you can adapt:

  > "This isn't a contradiction; it's the logical arc of the investigation.
  >
  > The first line is **epistemic**: it acknowledges the fact of the crime. Since the tea was poisoned, a poisoner must exist. At that point, we don't know the constraints, so the set of potential poisoners includes Callum and 'Someone Else.'
  >
  > The second line is **ontological**: it acknowledges the constraints of the scene. By the end, we know the physical access was limited. Rosalind is stating that Callum was the *only* variable that could satisfy the equation.
  >
  > If I change the second line to match the first, I lose the proof of his guilt. If I change the first line to match the second, I ruin the suspense of the early investigation. The tension between 'someone else did' and 'no one else could' is exactly how she corners him."

  ### 4. A Small Tweak for Bulletproof Clarity (Optional)

  While your logic is sound, readers (like your writing group) often skim for "vibes" rather than logic. If you want to make the distinction undeniable without changing the meaning, you can slightly adjust Line 1 to emphasize the *event* rather than the *person*.

  **Current:** "If Callum didn't do it, someone else did."
  **Tweak:** "If Callum didn't do it, **it had to be** someone else."

  **Why this helps:**
  *   "Someone else did" sounds like she knows a specific other person exists.
  *   "It had to be someone else" sounds like she is acknowledging the *necessity of an unknown agent*.
  *   This makes the transition to Line 2 ("No one *would* have") smoother. It clarifies that Line 1 was about the *requirement for a culprit*, and Line 2 is about the *impossibility of alternatives*.

  ### Summary
  Your writing group is reading the lines as static statements of fact. They are actually dynamic statements of **knowledge states**.
  *   **Page 10:** "We know a crime happened. Agent X or Agent Y did it."
  *   **Page 200:** "We now know Agent Y couldn't have done it. Therefore Agent X did."

  That is not a contradiction; that is a solution. Keep the lines. They work.
