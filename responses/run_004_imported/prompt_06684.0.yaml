  **Point 1 (Score: 0):** He is mathematically correct that betting 100% maximizes the *arithmetic expected value* of the final bankroll, but he is strategically wrong because in a repeated multiplicative game, the arithmetic mean is dominated by astronomically unlikely outcomes, making the "rational" conclusion misleading for a single player.

  **Point 2 (Score: 2):** She is entirely correct; betting 100% leads to almost certain ruin over 50 rounds, and the Kelly formula ($p - q$) accurately calculates the 20% fraction that maximizes the geometric growth rate of the bankroll.

  **Point 3 (Score: 1):** He makes a valid theoretical point that utility functions are subjective preferences, but he overlooks that in a single-path compounding game, log-utility isn't just a preference—it reflects the actual time-average growth rate experienced by the bettor.

  **Point 4 (Score: 2):** She correctly identifies the core statistical issue (ergodicity): the average outcome of many parallel players (ensemble average) does not equal the outcome of one player over time (time average), which is why the high EV of the all-in strategy is an illusion for an individual.

  **Point 5 (Score: 1):** He is practically right that real-world uncertainty makes full Kelly dangerous and that professionals use fractional Kelly, though this is less relevant in a controlled simulation where the odds were explicitly defined as facts.

  ### The Missing Context: It's a Tournament, Not an Investment Account

  Neither of them noticed that the goal of the game wasn't to maximize your own wealth in isolation, but to **finish with more money than everyone else** to win the gift card. This changes the problem from "wealth maximization" to "probability of ranking first."

  In a tournament setting, the optimal strategy depends on what your opponents are doing. If everyone else plays conservatively (like Kelly), you might need to take *more* risk than Kelly to have a chance at outperforming them, but not *all* the risk (which guarantees ruin). Conversely, if everyone goes All-In, the winner is simply the one person lucky enough to flip 50 heads, and playing Kelly guarantees you lose the prize. They were debating how to grow money, but the rules actually required them to play **game theory** against each other. Additionally, because the prize is a fixed-value gift card, the utility of money is a **step function** (you get the card or you don't), not linear or logarithmic, which neither of them accounted for.
