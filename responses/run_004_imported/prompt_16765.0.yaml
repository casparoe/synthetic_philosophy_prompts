answer: |-
  The candlelight in the council chamber flickered, casting long, trembling shadows against the stone. Outside, the wind howled across the capital, but inside, the silence was heavier. On the table between them lay a small glass vial, stoppered with wax, and a scroll of parchment sealed with the royal signet.

  Lady Celia rested her hand near the vial. Lord Jorian sat opposite, his hands clasped over the parchment.

  "It ends tonight," Celia said. Her voice was low, stripped of ornament. "The grain shipments are burned. The peasants in the valley are starving while he feasts. He is a tyrant, Jorian. By any measure."

  "He is a tyrant by exercise," Jorian corrected gently. "Not by defect of title. He was anointed by the Archbishop. His blood is the blood of the founders."

  "And does holy oil excuse murder?" Celia pushed the vial forward. "One drop in his wine. The realm is saved. Why hesitate?"

  "Because you are a private person, Celia. And I am another." Jorian tapped the parchment. "Aquinas writes that to kill a legitimate king is not liberation. It is sedition. It is a special sin, because it fractures the unity of the people. If you strike him, you do not act for the community. You act for yourself."

  "The community is starving!" Celia snapped. "If I wait for the community to speak, half the valley will be dead of winter frost. Sometimes the hand must act before the voice."

  "If a man seizes the throne by force," Jorian said, leaning in, "then he is a usurper. A tyrant without title. In that case, yes—any man may repel him. Force may be met with force. He has no standing, so neither does his life."

  "But Alaric is not a usurper," Celia said. "He is the rightful heir. Which is why you stop me."

  "I stop you because I love the law more than I hate the man," Jorian said. "If you kill a legitimate king, even a cruel one, you teach every disgruntled knight that blood is the answer to bad policy. We invite civil war. We invite a worse tyrant to rise on the backs of your 'justice.'"

  Celia pulled her hand back from the vial, but her eyes remained hard. "So we do nothing? We let him burn the valley?"

  "I did not say nothing." Jorian broke the seal on the parchment. "I said *you* cannot do it. A private hand cannot judge the head. But a public hand can."

  He unrolled the document. It was a writ of convocation.

  "The Estates," Celia breathed. "The barons, the clergy, the burgesses."

  "The community acting as a whole," Jorian said. "Not a whisper in the dark, but a voice in the light. If the realm declares him deposed, it is not murder. It is judgment. If the realm executes him, it is not sedition. It is justice."

  "It will take weeks," Celia said. "Men will die while we argue."

  "Men may die," Jorian admitted. "But if we act alone, the soul of the kingdom dies with us. We become the tyrants we seek to remove. We place our will above the order that holds us all."

  Celia looked at the vial, then at the writ. The distinction hung in the air, heavier than the stone walls. The difference between a murderer and a magistrate was not the act, but the authority. The difference between a usurper and a king was not always the cruelty, but the crown.

  She pushed the vial away. It rolled slightly, clinking against the stone table, but did not break.

  "Convene the Estates," she said softly. "But Jorian? If they hesitate... if they choose order over justice..."

  "Then we pray," Jorian said, rolling the parchment closed. "And we endure. For a time. Because the remedy must not be worse than the disease."

  Celia stood, wrapping her cloak around her shoulders. She looked once more at the king's seal on the table. "God help us if the Estates are cowardly."

  "God help us if we are impatient," Jorian replied.

  She left the chamber, leaving the vial behind. Jorian extinguished the candle, plunging the room into darkness, save for the moonlight catching the glass. It remained unbroken.
