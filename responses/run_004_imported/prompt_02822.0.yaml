      *   *Stance:* Interventionism (Woodward) is more defensible for *science* (which the user is doing). Lewis is more defensible for *metaphysics* (maybe). But as a "general theory," Interventionism avoids the metaphysical baggage of possible worlds and aligns better with how we actually learn and use causal knowledge. However, Lewis is more ambitious in trying to reduce causation to non-causal terms. Woodward accepts circularity.
