      *   *Symmetric Overdetermination (Two rocks hit simultaneously):*
          *   *Lewis:* Fails. If either didn't throw, the other would have broken it. No counterfactual dependence. Lewis admits this is a problem (often calls it "quasi-causation" or accepts it as a cost).
          *   *Woodward:* Also tricky. If you intervene on one, the effect remains. However, Woodward emphasizes *modularity*. If the system is modular, we can intervene on one without triggering the other. But in symmetric overdetermination, the effect is robust. Woodward might say both are causes because both satisfy the intervention criterion *independently* in different possible scenarios, or he might classify it as a limit case. Actually, Woodward is better here because he allows for *potential* interventions. If I intervene on $X_1$, $Y$ stays same. But the *relationship* is invariant.
