      *   **Judea Pearl (SCMs/do-calculus):** Mathematical formalization of causation using structural equations and interventions ($do(X)$). Often linked to counterfactuals but operationalized via graphs.
      *   **James Woodward (Interventionist/Manipulationist):** Causation is about invariance under intervention. $X$ causes $Y$ if there is a possible intervention on $X$ that changes $Y$. Focuses on *explanation* and *manipulation* rather than metaphysical dependence.
      *   **The Conflict:** Lewis is metaphysical/semantic (what *is* causation?). Woodward is epistemological/pragmatic (how do we *identify* and *use* causation?). Pearl sits somewhat in between but is mathematically aligned with Woodward's interventions.

  3.  **Drafting Section 1: The Core Theories:**
      *   *Lewis:* Focus on "Humean Supervenience" and "Possible Worlds." Causation = Counterfactual Dependence. Transitivity is key for Lewis.
