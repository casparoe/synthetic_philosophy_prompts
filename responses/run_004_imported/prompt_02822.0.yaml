  8.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *Pearl's Role:* The user uses Pearl. Pearl is mathematically closer to Woodward (interventions) but semantically uses counterfactuals. I need to clarify that Pearl *formalizes* the interventionist intuition using counterfactual logic.
      *   *Preemption:* Lewis's "stepwise dependence" is the key fix. Woodward's fix is "holding fixed" other variables (controlling for Billy).
