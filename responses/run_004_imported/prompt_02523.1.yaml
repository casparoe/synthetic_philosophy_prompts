prompt: |-
  I'm about a third of the way into a novel set in Cambridge in the years right before WWI, and one of my POV characters is a painter loosely orbiting the Bloomsbury crowd. I want a scene where she gets cornered at a dinner by one of those insufferable young Apostles who's just discovered epistemology and wont let it go. To get his rambling right I've actually been reading G.E. Moore instead of faking it from a summary somewhere, specifically his 1918 paper "Some Judgments of Perception," and there's a stretch in the middle I've now read about six times and still can't fully untangle. He's spent several pages building up the classic worry about a penny looking elliptical from an angle even though nothing about the actual coin has changed, and then he writes this (sorry for the wall of text, it's more or less verbatim, semicolons and all):

  "What now seems to me to be possible is that the sense-datum which corresponds to a tree, which I am seeing, when I am a mile off, may not really be perceived to be smaller than the one, which corresponds to the same tree, when I see it from a distance of only a hundred yards, but that it is only perceived to seem smaller; that the sense-datum which corresponds to a penny, which I am seeing obliquely, is not really perceived to be different in shape from that which corresponded to the penny, when I was straight in front of it, but is only perceived to seem different—that all that is perceived is that the one seems elliptical and the other circular; that the sense-datum presented to me when I have the blue spectacles on is not perceived to be different in colour from the one presented to me when I have not, but only to seem so; and finally that the sense-datum presented when I touch this finger is not perceived to be different in any way from that presented to me when I see it, but only to seem so that I do not perceive the one to be coloured and the other not to be so, but only that the one seems coloured and the other not. If such a view is to be possible, we shall have, of course, to maintain that the kind of experience which I have expressed by saying one seems different from the other—"seems circular," "seems blue," "seems coloured," and so on—involves an ultimate, not further analysable, kind of psychological relation, not to be identified either with that involved in being "perceived" to be so and so, or with that involved in being "judged" to be so and so; since a presented object might, in this sense, seem to be elliptical, seem to be blue, etc., when it is neither perceived to be so, nor judged to be so. But there seems to me to be no reason why there should not be such an ultimate relation. The great objection to such a view seems to me to be the difficulty of believing that I don't actually perceive this sense-datum to be red, for instance, and that other to be elliptical; that I only perceive, in many cases, that it seems so. I cannot, however, now persuade myself that it is quite clear that I do perceive it to be so."

  What I think he's doing is trying to save the idea that we're actually seeing the real penny (or tree, or inkstand) rather than some private mental stand-in, by saying the sense-datum doesn't really change at all — it only "seems" different, in some further sense of "seem" that he insists can't be reduced to being perceived-as or judged-as. But three things are tripping me up. First, I can't tell what this "seeming" relation is actually supposed to be if it's neither perceiving nor judging — it kind of sounds like he's just naming the problem rather than solving it. Second, I can't tell if Moore even believes his own move, since the passage ends with him basically admitting he can't talk himself into it. And third, which is the bit I actually need for the book since my philosopher character is meant to come across as ahead of his time — I keep wondering whether this "seems vs. is" maneuver is a real, if clumsy, ancestor of what people now call disjunctivism about perception, or whether it's doing something else entirely and I'm just pattern-matching to the one 21st-century term I happen to know. Could you go through the passage more or less sentence by sentence and tell me what's actually going on logically, rather than giving me the general-purpose version of the argument from illusion, which I already know well enough? My one philosophy seminar on this stuff was a decade ago, so don't assume I remember any of the jargon.
