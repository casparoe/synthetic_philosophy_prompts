answer: |-
  This is a fantastic bit of research. Reading primary Moore to get the rhythm of an Apostle right is exactly the kind of detail that makes historical fiction sing. You are also right to find this passage dense; Moore is famous for being painstakingly precise to the point of unreadability, and this 1918 paper is him wrestling with the biggest threat to his Realism: the Argument from Illusion.

  Here is the breakdown you asked for: a logical autopsy of the paragraph, answers to your three specific questions, and a note on how to weaponize this for your scene.

  ### Part 1: Sentence-by-Sentence Logic

  To understand this, you need one piece of context: Moore believes in **Sense-Data**. When you look at a penny, you aren't directly touching the physical coin; you are aware of a "sense-datum" (a patch of color/shape in your mind's eye). The problem is: if the sense-datum changes shape (ellipse vs. circle) but the coin doesn't, are we ever actually seeing the coin?

  Moore is trying to save the idea that we are connected to the real world.

  **1. "What now seems to me to be possible is that the sense-datum which corresponds to a tree, which I am seeing, when I am a mile off, may not really be perceived to be smaller than the one, which corresponds to the same tree, when I see it from a distance of only a hundred yards, but that it is only perceived to seem smaller..."**

  *   **The Standard View:** When I move away, my sense-datum literally *shrinks*. (Datum A is big, Datum B is small).
  *   **Moore's Hypothesis:** Maybe the sense-datum *doesn't* change size. Maybe the datum stays the same, but I perceive a relation of "seeming smaller."
  *   **The Goal:** He wants to stop the sense-datum from changing properties. If the datum doesn't change, maybe it's more stable, more "real," and closer to the actual tree.

  **2. "...that the sense-datum which corresponds to a penny, which I am seeing obliquely, is not really perceived to be different in shape from that which corresponded to the penny, when I was straight in front of it, but is only perceived to seem different—that all that is perceived is that the one seems elliptical and the other circular..."**

  *   **The Application:** He applies the same logic to the penny.
  *   **The Distinction:** He is separating *being* elliptical from *seeming* elliptical.
  *   **The Logic:** Usually, we say "I see an elliptical patch." Moore is suggesting we say "I see a patch that *seems* elliptical." This sounds like splitting hairs, but for Moore, it's the difference between the patch *having* the property (ontological) and the patch *presenting* the property (phenomenological).

  **3. "...that the sense-datum presented to me when I have the blue spectacles on is not perceived to be different in colour from the one presented to me when I have not, but only to seem so..."**

  *   **The Spectacles:** This is the clincher. If I put on blue glasses, the white wall looks blue.
  *   **Standard View:** My sense-datum *becomes* blue.
  *   **Moore's View:** My sense-datum remains neutral (perhaps white-ish?), but stands in a "seeming-blue" relation to me.
  *   **Why?** If the sense-datum *becomes* blue, then my perception is falsified (the wall isn't blue). If the sense-datum only *seems* blue, Moore hopes to preserve the integrity of the datum itself.

  **4. "...and finally that the sense-datum presented when I touch this finger is not perceived to be different in any way from that presented to me when I see it, but only to seem so that I do not perceive the one to be coloured and the other not to be so, but only that the one seems coloured and the other not."**

  *   **Cross-Modal:** He extends this to Touch vs. Sight.
  *   **The Claim:** When I look at my finger, I get a colored datum. When I touch it, I get a tactile datum. Usually, we say one has color and one doesn't.
  *   **Moore's Move:** Maybe neither *has* color. One *seems* colored, the other *seems* uncolored. He is trying to make the underlying "stuff" of experience (the datum) uniform, with the variations pushed into the "seeming" relation.

  **5. "If such a view is to be possible, we shall have, of course, to maintain that the kind of experience which I have expressed by saying one seems different from the other... involves an ultimate, not further analysable, kind of psychological relation, not to be identified either with that involved in being 'perceived' to be so and so, or with that involved in being 'judged' to be so and so..."**

  *   **The Cost:** This is the heavy lifting. He admits this requires a new category of mental state.
  *   **Not Perception:** It's not standard perception (which implies the property is actually there).
  *   **Not Judgment:** It's not a thought ("I judge this to be blue") because it happens instantly, pre-thought.
  *   **The "Ultimate Relation":** He is positing a brute fact of consciousness. A raw "seeming-ness." He can't explain *what* it is, only *that* it must exist if his theory is to work.

  **6. "But there seems to me to be no reason why there should not be such an ultimate relation."**

  *   **The Defense:** He appeals to logical possibility. Just because we haven't named it doesn't mean it can't exist.

  **7. "The great objection to such a view seems to me to be the difficulty of believing that I don't actually perceive this sense-datum to be red, for instance, and that other to be elliptical; that I only perceive, in many cases, that it seems so."**

  *   **The Intuition Pump:** He admits this contradicts how life feels. When you see red, it feels like you are seeing *Redness*, not "Seeming-Redness."
  *   **The Tension:** His logic demands one thing; his intuition demands another.

  **8. "I cannot, however, now persuade myself that it is quite clear that I do perceive it to be so."**

  *   **The Retreat:** He ends in uncertainty. He can't prove the standard view (that we perceive the property directly) is definitely true, so his "seeming" theory remains a live, if uncomfortable, option.

  ***

  ### Part 2: Answering Your Three Questions

  **1. What is this "seeming" relation if it's not perceiving or judging?**
  You are right to feel it is unsatisfying. Logically, Moore is trying to invent a **phenomenological buffer**.
  *   **Perceiving:** Me + Object (where Object *has* Property X).
  *   **Judging:** Me + Proposition (where I *think* Object has Property X).
  *   **Moore's "Seeming":** Me + Object (where Object *presents* Property X without necessarily *having* it).

  He is trying to locate the variation in the *relationship* between the mind and the datum, rather than in the datum itself. He wants the datum to be a stable bridge to the real world. If the datum itself changes (becomes elliptical, becomes blue), it becomes a veil hiding the real world. If the datum stays stable and only "seems" to change, the veil is transparent.
  *Is it a solution?* Most philosophers think no. It looks like he is just moving the problem from the object to the relation. But for a character in 1918, it feels like a breakthrough in rigor.

  **2. Does Moore even believe his own move?**
  **No, not fully.** And that is the key to your character. Moore is famously intellectually honest to a fault. In this paper, he is exploring a *logical possibility* to save Realism, not describing a discovered truth.
  He is essentially saying: *"If we want to avoid Skepticism, we might need to say this. I don't like it, it feels wrong, but I can't prove it's false."*
  Your Apostle character shouldn't preach this as Gospel. He should preach it as a **burden**. He should sound like he's discovered a trap that the rest of the world is walking around blindly. "Don't you see? We *must* posit this relation, or else we lose the tree!"

  **3. Is this an ancestor of Disjunctivism?**
  This is the trickiest one. The short answer is **No, but they are fighting the same dragon.**
  *   **Disjunctivism (1980s+):** Says there is *no* common element between seeing a real penny and hallucinating a penny. They are fundamentally different states. (State A OR State B).
  *   **Moore (1918):** Assumes there *is* a common element (the sense-datum) in all cases. He is trying to tweak the properties of that common element.
  *   **The Connection:** Both are trying to save **Direct Realism** (the idea that we see the world, not a movie in our head). Moore tries to save it by refining Sense-Data theory. Disjunctivism saves it by burning Sense-Data theory to the ground.
  *   **For your book:** Your character cannot be a disjunctivist (the term and theory don't exist). However, he can have the *instinct* of a disjunctivist. He feels that "seeming" and "being" must be kept apart to save the reality of the object. If he claims he's discovering that perception is "direct," he sounds prophetic. If he claims he's solving the sense-datum problem, he sounds like a 1918 Apostle. Go with the latter for historical accuracy, but give him the former's *hunger*.

  ***

  ### Part 3: Advice for the Scene

  Since your POV is a painter, this philosophical debate is a goldmine for conflict. Moore's theory essentially gaslights the artist.

  **The Conflict:**
  *   **The Painter:** "I see the blue. I see the ellipse. That is my truth. That is what is on the canvas."
  *   **The Apostle:** "No, you don't. You perceive a datum that *seems* blue. The blueness isn't in the datum, it's in the relation. You aren't painting reality; you're painting a 'seeming'."

  **How to make the Apostle insufferable (but accurate):**
  Don't have him explain it confidently. Have him explain it *agonizingly*. The Moore passage is full of "What now seems to me to be possible" and "I cannot persuade myself."
  *   **Bad Dialogue:** "Moore has proven that we only perceive seemings!"
  *   **Good Dialogue:** "But don't you see the trouble? If the datum *is* elliptical, then the penny is hidden. It *must* only seem elliptical. But then, what is this 'seeming'? It's not a judgment... I lie awake over it. If we can't define the relation, we lose the tree."

  **The "Aha" Moment for the Painter:**
  She might realize that his philosophy actually validates her art.
  *   **Apostle:** "We only perceive that it *seems* blue."
  *   **Painter:** "Exactly. I don't paint the penny. I paint the 'seeming'. You call it a logical relation; I call it light."

  **Summary for your notes:**
  1.  **Moore's Goal:** Keep the sense-datum stable so it doesn't block the real object.
  2.  **The Mechanism:** Move the change from the *object* to the *relation* ("seeming").
  3.  **The Vibe:** Desperate rigor. He knows it sounds crazy, but he thinks the alternative (Skepticism) is worse.
  4.  **Disjunctivism:** Not a direct ancestor, but a fellow traveler in the war against Skepticism.

  This passage is perfect for showing the Apostle as someone who values logical consistency over lived experience, which is a wonderful foil for a painter who values lived experience over logical consistency.
