  *   **legitimacy cost:** Public acceptance is a political hurdle rather than a mechanism failure, potentially solvable via hybrid governance models or education.

  **C Tier**
  *   **existential risk:** Long time horizons and survival contingencies depress pricing due to discount rates, limiting scope but not breaking the mechanism for near-term policy.

  **D Tier**
  *   **values/beliefs inseparability:** This is a philosophical fuzziness that complicates the initial voting stage but doesn't prevent the market mechanism from functioning technically.
