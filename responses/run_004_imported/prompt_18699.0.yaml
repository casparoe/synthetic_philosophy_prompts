answer: |-
  The candle was not a object; it was a sequence of yellow sensations. Dr. Aris Thorne knew this, or rather, he had just finished writing it. The manuscript lay cooling on the desk, a stack of paper that claimed to be solid but was, by his own accounting, merely a potential for tactile and visual impressions. He struck a match. The flare was not an event happening in time; it was a singular perception, complete in itself, requiring no prior moment to ignite it and no subsequent moment to sustain it.

  He lit the wick. The flame settled into a teardrop of blue and orange.

  Thorne leaned forward, resting his chin on his hand. The first step was the easiest. He closed his left eye. The room contracted. The bookshelf to the left ceased to be. He opened it and closed the right. The window vanished. There was no world behind his eyelids, no persistent matter waiting in the dark for inspection. *Esse est percipi.* To be is to be perceived. The candle existed only insofar as his retina caught the photons. If he looked away, the candle did not wait in the darkness; it ceased. There was no stage upon which the drama of objects played out. There was only the seeing.

  He watched the wax melt. A droplet formed, clear and viscous, hanging precariously from the rim. It was beautiful. It was also a lie. There was no "droplet" separate from the perception of gloss, the perception of curvature, the perception of gravity's pull. If he ceased to look, the tension would not hold, the wax would not fall. The universe was not a container; it was a glance.

  Thorne blinked. The darkness between blinks was not a pause; it was a deletion.

  He shifted his gaze to his own hand, resting on the mahogany desk. The skin was pale, the knuckles swollen with age. Here lay the second step, the harder truth. Who was the owner of the hand? He searched for the "I" that held the gaze upon the flame. He found a sensation of pressure where his chin met his palm. He found a fatigue in the lower back. He found the memory of the match striking, now fading into a memory of a memory.

  There was no thinker behind the thoughts. There was only the thinking. There was no Aris Thorne persisting from the moment he lit the wick to this moment of observation. The Thorne who struck the match was a bundle of perceptions distinct from the Thorne watching the wax fall. They were linked by memory, yes, but memory was just another present impression, a picture held up now, not a bridge to then. He was a riverbed without a river, a series of snapshots shuffled together by habit.

  The droplet fell. It hit the table with a silent, soft splatter.

  Thorne felt a pang in his chest. A sharp, contracting ache.

  If the object was nothing but perception, and the subject was nothing but a bundle of perceptions, then time was impossible. Time required a subject to move through a continuum of objects. But there was no subject, and there were no objects. There was only this instant, self-contained and absolute. The previous instant was dead; the next was unborn. He was trapped in an eternal now, a static point where nothing changed because nothing persisted long enough to change.

  He had won. The argument was airtight. He had dismantled the prison of chronology. He was free of the tyranny of the clock, of the decay of matter, of the aging of the self. He was nowhere, and he was no one.

  So why did the room feel so cold?

  The flame flickered. A draft from the window he could not see—but which existed only as a chill on his neck—disturbed the air. The flame stretched, thinning into a wisp of smoke.

  Thorne realized he was holding his breath. He exhaled. The flame danced again.

  He understood, intellectually, that the fear he felt was a category error. One cannot lose what does not exist. If the self is a fiction, who is there to die? If the candle is a fiction, what is there to extinguish? The grief rising in his throat was a phantom pain in a phantom limb.

  And yet, the darkness creeping into the corners of his vision felt heavy. It felt like an invasion.

  He watched the wick blacken. The reservoir of wax was shrinking. The end was approaching. Not a philosophical end, not the cessation of a logical series, but a physical termination. The light would go out. The room would return to a state where no perceptions occurred.

  If Berkeley was right, the room would not exist in the dark. If Hume was right, Thorne would not exist to witness the darkness. There would be nothing.

  But the anticipation of that nothingness was unbearable.

  He reached out to shield the flame with his hand, a reflexive gesture to protect the illusion. His hand passed through the heat, casting a giant, wavering shadow against the books. The shadow looked like a man. It looked like a life.

  The flame sputtered. The wick drowned.

  For a second, the light held, a final ember glowing on the charred cotton. Thorne stared into it, pouring every ounce of his consciousness into the perception, trying to force the object to remain, trying to stitch the bundles of self together into a continuous witness. He wanted to be the one who saw the end. He wanted there to be a world that went on after he looked away.

  The ember died.

  Smoke curled upward, white against the blackness. Thorne sat in the absolute dark. The argument remained perfect in his mind. Time was refuted. The self was dissolved. The world was a dream with no dreamer.

  He sat perfectly still, waiting for his eyes to adjust to a darkness that, by his own logic, should not be there. He waited for the cold to cease being cold once he stopped attending to it.

  It did not.

  He reached for the matchbox, his fingers trembling in the void. He needed the light back. Not because he believed in it, but because the alternative was a silence so profound it felt like a theft. He struck the match. The flare screamed into existence, violent and sudden.

  Thorne wept. He knew the tears were merely saline secretions, and the sorrow was a chemical misfire in a brain that wasn't truly his, occurring in a moment that wasn't truly real. But as the flame caught the wick, restoring the room, the furniture, and the man who sat among them, he felt the weight of the passing minute settle on his shoulders like a lead coat.

  He had proved that time was not real. But he knew, with a certainty that bypassed thought, that he would never get this minute back.
