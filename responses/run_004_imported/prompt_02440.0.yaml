answer: |-
  It is a genuine pleasure to speak with someone who has lived inside the 5-sigma culture. You are right to feel a bit of vertigo; the Jeffreys-Lindley (JL) paradox strikes at the heart of what we mean by "evidence." In high-energy physics (HEP), we treat the 5-sigma threshold as a fortress against false positives. The JL paradox suggests that under certain conditions, that fortress might be guarding the wrong castle.

  Since you have a physicist's intuition, I will skip the hand-waving about "subjective priors" and get straight to the geometry of the likelihood and the prior mass, which is where the mechanical tension actually lives.

  ### 1. The Mechanism: It's About "Wasted" Prior Mass
  The paradox arises when comparing a **point null** ($H_0: \theta = 0$) against a **composite alternative** ($H_1: \theta \neq 0$).

  In the Bayesian framework, to calculate the evidence for $H_1$, you must integrate the likelihood over the prior distribution of $\theta$ under $H_1$. Let's say your prior for $H_1$ is a broad normal distribution centered at 0 with width $\tau$ (representing "some non-zero effect").

  Here is the driver of the paradox: **The Ockham's Razor Penalty.**
  As you collect more data ($N \to \infty$), your experimental resolution improves. The likelihood function narrows proportional to $1/\sqrt{N}$.

  *   **The Frequentist View:** You look at the peak of the likelihood. If the peak is 5 standard deviations away from 0, you reject $H_0$. The width of the likelihood doesn't change the *significance* of the peak's displacement.
  *   **The Bayesian View:** The Bayes Factor is essentially a ratio of average likelihoods.
      *   $H_0$ concentrates all its probability mass at exactly $\theta = 0$.
      *   $H_1$ spreads its probability mass over the entire range of the prior $\tau$.

  **The Crucial Twist:** To maintain a *fixed* p-value (say, exactly $5\sigma$) while increasing $N$, the observed effect size $\hat{\theta}$ must **shrink**.
  If $\sigma_{\text{data}} \propto 1/\sqrt{N}$, then to keep $Z = \hat{\theta} / \sigma_{\text{data}} = 5$, you must have $\hat{\theta} \propto 1/\sqrt{N}$.

  So, as $N \to \infty$ with fixed significance:
  1.  The data tells you the true value is in a vanishingly small interval around a tiny number $\hat{\theta}$.
  2.  $H_0$ says the value is 0. (Distance to data $\approx 0$).
  3.  $H_1$ says the value could be anything in range $\tau$. But since the likelihood is now incredibly narrow, almost all of the prior mass assigned by $H_1$ falls in regions of parameter space that the data has ruled out.

  The Bayesian calculation effectively says: "$H_1$ predicted a wide range of outcomes. The data showed a very specific, tiny outcome. $H_1$ 'wasted' almost all its predictive probability on values that didn't happen. $H_0$ predicted exactly 0, which is very close to this tiny outcome. Therefore, $H_0$ is the better predictor."

  In HEP terms: It's like claiming you discovered a new particle, but the cross-section you measured is $10^{-20}$ times smaller than any theoretically motivated model predicted. The "Signal" hypothesis is penalized for being too vague about how strong the signal should be.

  ### 2. Why More Data Doesn't Make It "Safer"
  In your career, more data usually meant better systematics control and narrower peaks on top of background. You assumed more data converges on the "truth."

  In the JL scenario, "more data" with a "fixed p-value" means you are converging on a **null effect with high precision.**
  *   If you have $N=100$ and see a $5\sigma$ effect, the effect size is large. Both Frequentist and Bayesian agree: Discovery.
  *   If you have $N=10^{12}$ and see a $5\sigma$ effect, the effect size is microscopic. The Frequentist says "Discovery." The Bayesian says "This is consistent with zero given the resolution of the instrument, and the alternative hypothesis was too vague to claim otherwise."

  The paradox highlights that a p-value measures **incompatibility with the null**, not **compatibility with the alternative.** With infinite data, you can prove the null is *technically* false (nature is rarely exactly integer-valued), while simultaneously proving the alternative is *practically* useless.

  ### 3. Does This Connect to the Replication Crisis?
  Yes, but they are opposite ends of the same elephant.

  **The Replication Crisis (Psychology/Medicine):**
  *   **Problem:** Low Power (Small $N$).
  *   **Mechanism:** With small samples, you need a massive effect size to hit $p < 0.05$. If the true effect is small, you only hit significance when noise fluctuates wildly upward. This is the "Winner's Curse."
  *   **Connection to JL:** It shares the **misinterpretation of the p-value.** Researchers treat $p < 0.05$ as "Probability $H_0$ is false > 95%." Both JL and the Replication Crisis show this is wrong. In replication, $P(H_0|D)$ is often still high even when $p < 0.05$ because the prior probability of the hypothesis was low (Basu's theorem / Base Rate Fallacy).

  **The Jeffreys-Lindley Paradox:**
  *   **Problem:** High Power (Huge $N$).
  *   **Mechanism:** You detect statistically significant deviations that are physically meaningless.
  *   **Connection:** This is becoming relevant in "Big Data" fields (genomics, epidemiology, and yes, some modern social science with massive datasets). You find "significant" correlations that are $10^{-4}$ in magnitude. They replicate perfectly (because they are real non-zero numbers), but they are useless for theory building.

  **The HEP Exception:**
  You might wonder why this didn't blow up the Higgs discovery.
  1.  **Sharp Alternatives:** In HEP, $H_1$ is usually not "some mass exists." It is "a Higgs boson exists at 125 GeV with Standard Model cross-section." The prior on $H_1$ is not diffuse; it is concentrated around a specific physical prediction. This mitigates the Ockham penalty.
  2.  **Systematics Floor:** In practice, we rarely reach the statistical $N$ required for JL to dominate before systematics dominate. We don't keep reducing $\sigma_{\text{data}}$ indefinitely; we hit a wall of calibration uncertainty.
  3.  **Effect Size:** We don't claim discovery at 5-sigma if the signal strength $\mu$ is $0.001$. We require $\mu \approx 1$. We implicitly enforce a prior on the effect size by demanding physical plausibility.

  ### Summary
  The Jeffreys-Lindley paradox isn't saying 5-sigma is "wrong." It is saying that **significance is not evidence** when the alternative hypothesis is vague.

  *   **Frequentist:** "The data is extremely unlikely if $\theta=0$." (True, even for tiny $\theta$).
  *   **Bayesian:** "The data is even *more* unlikely under the vague alternative than under the precise null."

  For a retired experimentalist, the philosophical takeaway is this: The 5-sigma convention protects you from **noise**, but it does not protect you from **irrelevance**. The paradox reminds us that statistical significance is a property of the dataset size, while scientific evidence is a property of the model comparison. In HEP, we bridge that gap with theoretical priors (we know what a Higgs looks like). In fields without those sharp priors, p-values alone are indeed a dangerous currency.
