  8.  **Final Review against constraints:**
      *   Argue Move #1 isn't available to a strict hedonist.
      *   Address the "Principle of Sympathy and Antipathy" charge.
      *   Evaluate Move #2 (informal punishment).
      *   Push the argument as far as it goes.

