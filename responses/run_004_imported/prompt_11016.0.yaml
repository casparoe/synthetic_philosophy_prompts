answer: |-
  This is a sharp philosophical provocation. You have identified a genuine tension in Bentham's unpublished manuscript on "Paederasty" (or "Offences Against One's Self"). The standard reading celebrates Bentham as a proto-liberal hero for using utilitarianism to dismantle the case against sodomy. But your critique suggests that to reach this liberal conclusion, Bentham must violate the strict accounting rules of his own felicific calculus.

  Here is the argument pushed to its limit: Bentham's exclusion of "prejudicial" pain is a category error within strict hedonism, and his second move regarding informal sanctions fails to rescue him because it relies on the very validity of that pain he attempts to nullify.

  ### 1. The Hedonistic Axiom vs. The Prejudice Filter

  Bentham's foundational axiom in *An Introduction to the Principles of Morals and Legislation* is that nature has placed mankind under the governance of two sovereign masters: pain and pleasure. They determine what we *ought* to do. Crucially, the calculus is quantitative, not qualitative. As Bentham famously notes, "prejudice apart, the game of push-pin is of equal value with the arts and sciences of music and poetry."

  The logic is straightforward: If a pain exists, it counts. If a pleasure exists, it counts. The *source* of the sensation is irrelevant to its moral weight; only its intensity, duration, certainty, propinquity, fecundity, purity, and extent matter.

  In the "Paederasty" essay, Bentham confronts the pain felt by the public (the "antipathists"). He admits this pain is real. He admits it causes "mischief." Yet, he dismisses it because it is "grounded only in prejudice."

  **Here lies the breach in the system.** Nowhere in the seven dimensions of the felicific calculus is there a variable for "warrantedness" or "rationality."
  *   If a neighbor feels genuine psychic distress because he believes your gardening choices are summoning demons, that pain is real.
  *   If a neighbor feels genuine psychic distress because he believes your sexual choices are summoning divine wrath, that pain is also real.

  In a strict utilitarian framework, if the demon-believing neighbor's pain is intense and widespread enough, the state *ought* to stop you from gardening to maximize aggregate utility. By refusing to count the pain of the antipathist, Bentham is not doing math; he is making a qualitative judgment about which preferences are legitimate. He is asserting that pains derived from "false" beliefs (prejudice) deserve less weight than pains derived from "true" beliefs (physical harm).

  But hedonism has no access to "truth" independent of sensation. To a strict hedonist, a pain caused by a delusion is just as painful as a pain caused by a broken leg. By filtering out the pain of antipathy, Bentham is secretly importing a non-hedonic standard of value—likely a form of rational autonomy or natural liberty—to override the calculus. He is saying, "This pain doesn't count," which is metaphysically indistinguishable from saying, "I disapprove of this pain."

  ### 2. The Return of the Principle of Sympathy and Antipathy

  This brings us to your second point: the accusation that Bentham is utilizing the very "Principle of Sympathy and Antipathy" he famously eviscerated.

  Bentham defines this principle as the practice of approving or disapproving of actions based on a personal feeling of like or dislike, rather than on an calculation of consequences. He attacks natural law theorists for using it, claiming they call acts "unnatural" simply because they dislike them.

  However, in the "Paederasty" essay, Bentham effectively deploys a **Second-Order Principle of Sympathy and Antipathy**.
  *   **First-Order:** The public feels antipathy toward the sodomite.
  *   **Second-Order:** Bentham feels antipathy toward the *public's antipathy*.

  When Bentham labels the public's pain as "prejudice," he is not measuring its intensity; he is expressing his own disapproval of its origin. He is essentially arguing: *The pain you feel is illegitimate because I find the source of your pain repugnant.*

  This is a performative contradiction. He accuses the moralist of banning acts based on bare antipathy, but he bans the *counting of the pain* based on his own bare antipathy toward that pain. To maintain consistency, a strict Benthamite would have to admit: "The antipathists' pain is real mischief. However, the pain of the sodomite (from punishment) plus the pain of the antipathists (from the act) must be weighed." If the antipathists are numerous and hysterical enough, strict utilitarianism might actually *demand* persecution to soothe the majority's distress.

  Bentham knows this conclusion is abhorrent. To avoid it, he cheats the ledger. He declares certain pains "void" not because they aren't painful, but because they are *wrong*. This admits that Utility is not the sole sovereign; there is a higher constraint (perhaps Liberty or Truth) that trumps the calculus when the calculus demands oppression.

  ### 3. Does the "Informal Punishment" Move Escape the Charge?

  Bentham's second move is pragmatic: Even if the act causes pain to the public, the law need not intervene because "informal sanctions" (social stigma, ostracism, loss of reputation) already punish the offender sufficiently. Adding legal punishment (fines, imprisonment, execution) is surplus misery that adds no security.

  Does this escape the charge of inconsistency? **No. In fact, it deepens the trap.**

  For this argument to work, the pain inflicted by social stigma must be **real and effective**.
  1.  **If the pain is real:** Then it counts in the calculus. If it counts in the calculus as a deterrent (which Bentham relies on to say "no need for law"), it must also count as "mischief" generated by the act. You cannot have it both ways. You cannot say the stigma is potent enough to deter the actor (validating the pain's reality) but too prejudicial to count as a reason for legislation (invalidating the pain's legitimacy).
  2.  **If the pain is not real (because it is prejudice):** Then the informal sanction is illusory. If the social stigma is based on "groundless prejudice," it should be dismissed just like the legal punishment. But Bentham relies on the *fear* of this stigma to argue that the offender is already suffering.

  Furthermore, by relying on informal sanctions, Bentham is effectively outsourcing the tyranny he seeks to avoid. He argues against *legal* punishment, but he accepts *social* punishment as a given utility fact.
  *   **The Inconsistency:** If the state should not punish based on prejudice, why is society permitted to punish based on prejudice?
  *   **The Utilitarian Calculation:** If the social stigma causes immense pain to the gay individual, and that stigma is rooted in "prejudice" (false belief), a reformist utilitarian should seek to *reduce* that stigma to increase aggregate happiness. Instead, Bentham treats the stigma as a fixed cost of nature, like bad weather. He accepts the prejudicial pain of the mob as a legitimate constraint on the individual, provided the state doesn't add to it.

  This reveals that Bentham's second move is not a hedonic calculation, but a **political restraint**. He is arguing that the *cost* of eradicating the prejudice (social upheaval) is too high, so we must accept the informal punishment. But this admits that the "prejudicial pain" is indeed a sovereign master, capable of dictating policy. It justifies the status quo of oppression so long as the state doesn't officialize it.

  ### 4. The Conclusion: Liberalism Requires More Than Hedonism

  Pushing this argument to its limit leads to a uncomfortable conclusion about Bentham's project. Bentham wants to protect the individual from the tyranny of the majority. But strict hedonistic utilitarianism provides no shield against the tyranny of the majority if the majority's hatred is intense enough.

  If 90% of the population feels agonizing pain at the existence of a 10% minority, the calculus demands the suppression of the minority. Bentham instinctively knows this is wrong. So, in the "Paederasty" essay, he implicitly introduces a **rights-based constraint** disguised as a utilitarian calculation. He treats the "prejudice" as a zero-value variable not because the math works out that way, but because he believes individuals have a sphere of sovereignty that public opinion cannot invade.

  **Verdict:**
  1.  **Move #1 (Prejudice):** Fails strict hedonism. It imports a qualitative filter ("warranted" vs. "unwarranted" pain) that the felicific calculus cannot support. It is Bentham using the Principle of Sympathy and Antipathy against itself.
  2.  **Move #2 (Informal Sanctions):** Fails to escape the charge. It relies on the reality of the prejudicial pain for the sake of deterrence while denying its legitimacy for the sake of legislation. It creates an unstable dualism where pain is "real" for the victim but "fake" for the legislator.

  Bentham is right to decriminalize, but he cannot get there on hedonism alone. To save the sodomite from the calculus, he has to break the calculator. He needs a principle of **equal consideration of interests** that excludes "external preferences" (preferences about how others live) from the sum. But that is a liberal principle of justice, not a hedonic principle of utility. Bentham the Radical Liberal had to strangle Bentham the Strict Hedonist to write that essay.
