answer: |-
  You have put your finger on the exact nerve of the entire Bayesian-frequentist debate, one that throbs just as violently today as it did in 1763. The move you identify in the Scholium is indeed the "original sin" of objective Bayesianism, but characterizing it merely as a conflation of physics and epistemology might let Bayes off too lightly—or perhaps condemn him too harshly.

  To answer your specific questions: Bayes is not simply committing a logical error; he is **operationalizing a definition of ignorance**. However, in doing so, he is indeed stipulating a convention while presenting it as a derivation. This distinction fundamentally validates the frequentist complaint regarding "unearned assumptions," though it also exposes a parallel weakness in frequentist orthodoxy.

  Here is an analysis of what licenses that step, how it relates to Jaynes and Keynes, and what it implies for modern inference.

  ### 1. The License: Predictive Indifference, Not Just Parameter Ignorance

  The crucial nuance in the Scholium text you quoted is often overlooked. Bayes does not merely say, "I know nothing about the probability $p$, therefore $p$ is uniform."

  He says: *"I have no reason to think that, in a certain number of trials, it should rather happen any one possible number of times than another."*

  This is a claim about **predictive indifference**, not just parameter indifference. Bayes is arguing that if you are truly ignorant about a binary event, you must be equally surprised by observing 0 successes in $n$ trials as you are by observing $n$ successes, or $n/2$ successes.

  Mathematically, this is profound. If we require the marginal likelihood of the data (the predictive distribution) to be uniform over the possible counts $x \in \{0, 1, ..., n\}$, then:
  $$ P(x|n) = \int_0^1 \binom{n}{x} p^x (1-p)^{n-x} \pi(p) \, dp = \frac{1}{n+1} $$
  The only prior $\pi(p)$ that satisfies this condition for all $n$ is the Uniform(0,1) distribution (the Beta(1,1)).

  So, what licenses the step? **It is a consistency requirement.** Bayes is defining "total ignorance" as a state where the *consequences* of the unknown probability are maximally uncertain. He uses the billiard table not as a physical proof that all events are like balls, but as an **existence proof** that a mechanism *can* produce this state of predictive indifference. The table shows that such a state is physically possible; the Scholium argues that it is the epistemic default when we lack information.

  ### 2. Convention or Conflation?

  Is he conflating physical symmetry with epistemic indifference? **Yes, but purposefully.**

  Bayes is effectively arguing that the *metric* of our ignorance should match the *metric* of physical space in the absence of evidence to the contrary. In the billiard case, the metric is length (uniform over the table). In the general case, he assumes the metric of "probability space" is linear.

  This is where the "conflation" charge sticks. Why should "knowing nothing" about a medical treatment's efficacy map to a uniform distribution over $[0,1]$? Why not uniform over the log-odds? Or the probit scale?
  *   **Keynes** later attacked this in *A Treatise on Probability* (1921), showing that the Principle of Indifference yields contradictions when you change the parameterization (e.g., uniform specific volume vs. uniform density).
  *   **Jaynes** later tried to rescue this in *Probability Theory: The Logic of Science* using transformation groups. Jaynes would argue Bayes was intuitively reaching for **invariance**. The billiard table is invariant under translation; therefore, the prior must be translation-invariant (uniform). But for general problems, Jaynes showed you must derive the prior based on the symmetries of the specific problem, not assume linearity.

  So, Bayes is **stipulating a convention** (linearity of probability is the natural measure of ignorance) and offering a **plausibility argument** (the billiard table) to make it feel objective. He is treating an epistemic stance as if it were a physical law because, in his Newtonian/Deist worldview, the laws of reasoning were thought to mirror the laws of nature.

  ### 3. The Frequentist Complaint and the Replication Crisis

  Does this history change how we should take the modern frequentist complaint? **It validates the complaint but complicates the alternative.**

  **The Validation:**
  The frequentist critique that "default priors are informative" is historically vindicated by Bayes' own Scholium. A Uniform(0,1) prior is not "neutral." It asserts that:
  1.  The probability is unlikely to be extremely close to 0 or 1 (compared to, say, a Beta(0.5, 0.5) Jeffreys prior).
  2.  The "distance" between $p=0.1$ and $p=0.2$ is the same as between $p=0.8$ and $p=0.9$.

  In replication crisis contexts, using a "flat" prior on effect sizes (often implicitly done in hierarchical models) can shrink estimates toward zero or inflate them depending on the parameterization. When researchers claim they are using an "uninformative prior" to let the data speak, they are repeating Bayes' Scholium move: disguising a substantive assumption (about the scale of effects) as a lack of assumption. This is indeed an "unearned assumption."

  **The Complication:**
  However, the frequentist alternative often hides the assumption elsewhere.
  *   **Stopping Rules:** Frequentist p-values depend on the stopping intention (fixed $n$ vs. fixed time). This is an assumption about the experimental design that is often just as subjective as a prior.
  *   **Model Selection:** Choosing *which* test to run is a prior-like commitment.

  The lesson from Bayes' Scholium is not that we should abandon priors, but that **there is no such thing as inference from a state of zero knowledge.** Bayes realized that to learn from data (to solve the problem of induction), you must start with *something*. The billiard table was his way of saying, "If you won't give me a prior, I will give you this one, because it corresponds to the only state where learning is possible without initial bias."

  ### 4. Conclusion: The Cost of Induction

  Bayes' Essay was, in part, a response to Hume. Hume argued that induction (inferring the future from the past) has no logical justification. Bayes provided a mathematical framework where induction *works*, provided you accept the Scholium's premise.

  The "slide" you identified is the price of admission.
  *   **Bayes** admits the assumption openly (in the Scholium) but tries to dress it in the clothes of physical symmetry to make it palatable.
  *   **Modern Bayesians** often forget the Scholium and treat reference priors as mathematical defaults, reifying the convention.
  *   **Frequentists** correctly point out the assumption is unearned, but often fail to acknowledge that their own methods rely on counterfactual assumptions (infinite repetitions) that are equally unobservable.

  We should take the frequentist complaint seriously: **Ignorance priors are substantive models.** But we should also recognize that Bayes was not trying to describe the world; he was trying to describe the *logic of reasoning* for a being who knows nothing. The tragedy of the replication crisis is not that Bayes' theorem is used, but that the Scholium is forgotten: researchers use "ignorance" priors without acknowledging that they are making a specific, contestable claim about the structure of the unknown.

  Bayes didn't conflate physics and epistemology by accident; he did it to bridge the gap between a stable universe and an uncertain mind. The crack in that bridge is where all modern statistical philosophy still stands.
