      *   *Scholarly Reaction:* Michael Dummett was indeed profoundly affected. He wrote the introduction to the English translation of the diary (*Frege: Political Writings*) and famously said it shattered his image of Frege as a "saint." Other scholars (Sluga, Weiner) have also engaged with this.
      *   *Timeline:* Frege died in 1925. The diary is from 1924. This is *late* Frege. However, the user suggests a "lifelong" anti-psychologism linked to this temperament. Need to be careful about projecting 1924 politics back onto 1879 logic, though the psychological disposition might be continuous.

  3.  **Evaluating the Thesis (The "Temperament" Argument):**
      *   *The Link:* The user posits a structural homology between logical anti-psychologism and political authoritarianism. Both reject pluralism/relativism in favor of a single Truth/Order.
      *   *Philosophical Content:* Is this just a metaphor? Or is there a conceptual bridge?
          *   *Bridge:* The concept of *normativity*. For Frege, logic is normative (laws of truth), not descriptive (laws of thinking). If one conflates the normative authority of logic with the normative authority of the State, the link becomes stronger.
