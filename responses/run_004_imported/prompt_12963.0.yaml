answer: |-
  Good evening, everyone.

  For those of you who don't know me, I'm a former student of [Teacher's Name]. Looking around this room, I realize we have a bit of a divided audience. On one side, we have family, friends, and colleagues who know [Teacher's Name] as the dedicated, if occasionally terrifyingly intense, educator. On the other side, we have the Olympiad alumni. I see you nodding. I know half of you are currently mentally deriving the CHSH inequality in your heads to make sure I get the opening right. Don't worry, I won't touch the math. I value my life.

  But there is one lesson from [Teacher's Name]'s classroom that bridges the gap between the physicists and the rest of the room. It wasn't about force, or motion, or energy. It was about a rule. A specific, inviolable rule regarding how we spoke about the universe.

  If you ever walked into her junior-year physics class and said, "Bell's theorem proves Einstein was wrong about spooky action at a distance," you would be stopped. Immediately.

  To the non-physicists here: Einstein famously worried that quantum mechanics allowed for "spooky action"—the idea that particles could influence each other instantly across vast distances. He didn't like it. Decades later, a physicist named John Bell came up with a way to test this. And when the experiments were run, the results violated Bell's inequality.

  The easy headline—the one you see in pop-science magazines—is: "Einstein Was Wrong."

  But [Teacher's Name] would not let us write that headline. She would stand at the board, chalk in hand, and correct us. She'd say, "Einstein coined the phrase. He knew the stakes. Bell didn't give us a verdict; he gave us a dilemma."

  She taught us that the experimental results mean you cannot keep two specific assumptions at the same time. You can keep *Locality*—the idea that things are only influenced by their immediate surroundings. Or you can keep *Realism*—the idea that objects have definite properties even when you aren't looking at them. But the universe, in its infinite complexity, refuses to let you keep both.

  You have to choose what to let go of. But you cannot simply say the experiment "proved" one man wrong and another right. It proved that reality is more subtle than our language allows.

  For years, I thought this was just about physics. I thought she was protecting Einstein's legacy. But looking back, after thirty years of her coaching, I realize she wasn't teaching us about particles. She was teaching us about thinking.

  She was teaching us that the world rarely offers clean verdicts. It offers dilemmas.

  In a world that loves a binary choice—good or bad, right or wrong, winner or loser—[Teacher's Name] demanded we hold the tension of the dilemma. She taught us that if an answer sounds too simple, it's probably because you've ignored a variable. She taught us that precision in language isn't pedantry; it's integrity. To say "Einstein was wrong" is satisfying. To say "Our classical intuition about locality and realism is incompatible with experimental data" is honest.

  To the family and colleagues in the room: I know that intensity could be daunting. I know there were days when the rigor felt like pressure. But that pressure was a form of care. She refused to let us be sloppy thinkers, because she knew that sloppy thinking leads to sloppy living. If you can't distinguish between a verdict and a dilemma in physics, how will you distinguish them in politics? In relationships? In justice?

  She built a classroom where nuance wasn't weakness; it was the only path to truth.

  And now, as she moves into retirement, I know she's looking at this next chapter with the same rigor. Some might say retirement is the end of the career. A verdict. But I suspect [Teacher's Name] sees it as a dilemma. She can keep the schedule of a teacher, or she can keep the freedom of a retiree. But she cannot keep both.

  And knowing her, she's already calculated the inequality. She knows exactly what she's letting go of, and exactly what she's keeping.

  So, to the Olympiad alumni: May your correlations always be strong.
  To the family and friends: May you never have to grade her lab reports.
  And to [Teacher's Name]: Thank you for teaching us that the universe is under no obligation to make sense to us, but we have an obligation to make sense of the universe.

  Please raise your glasses.

  To [Teacher's Name]. May your retirement be non-local, your joy be definite, and may you finally be allowed to say whatever you want about Einstein.

  To [Teacher's Name]!
