      *   *Closing:* Tie it back to retirement. The uncertainty principle of retirement? No, keep it to the Bell theme. She's leaving the classroom, but the lessons remain.

  5.  **Refining the Physics (Crucial Step):**
      *   Must ensure the Olympiad kids don't roll their eyes.
      *   *Correction:* Einstein *did* use the phrase "spooky action at a distance" (spukhafte Fernwirkung) in a letter to Born. Bell's theorem tests Local Realism. Violations mean $\neg$(Local & Real). So you can keep Locality (and drop Realism/Counterfactual Definiteness) or keep Realism (and drop Locality/Non-contextuality). Most physicists drop Local Realism.
      *   *Her Point:* It's not "Einstein was wrong." It's "Our classical intuition about how the world works is incomplete."
      *   *Toast Phrasing:* "You can keep a local universe, or you can keep a definite universe. But you cannot have both." That's accurate enough for a toast.

