prompt: |-
  I've been asked to give a short toast at the retirement dinner for my high school's physics teacher, who spent over thirty years coaching our Physics Olympiad team and built her entire junior-year unit around Bell's theorem. Her one inviolable classroom rule was that nobody could say Bell's theorem "proved Einstein wrong about spooky action at a distance": she'd remind us that Einstein used that exact phrase decades before Bell's theorem existed, and that what Bell actually showed is a dilemma, not a verdict -- you can keep locality, or you can keep the assumption that particles have definite properties before they're measured, but the experimental violations of Bell's inequality mean you cannot keep both. Half the room will be Olympiad alumni who can still recite the CHSH inequality from memory; the other half will be family and colleagues who know her only as "the terrifyingly intense physics teacher." Could you write me a four-to-five-minute toast that uses her insistence on that distinction as its throughline -- showing what it taught us beyond physics -- without turning into a lecture that loses the non-physicists in the room?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Retirement dinner for a high school physics teacher.
      *   **Subject:** Taught for 30+ years, coached Physics Olympiad team, built junior-year unit around Bell's theorem.
      *   **Key Characteristic/Rule:** Inviolable rule: Don't say Bell's theorem "proved Einstein wrong about spooky action." She insisted Einstein coined "spooky action," and Bell showed a *dilemma* (locality vs. realism), not a verdict.
      *   **Audience:** 50% Physics Olympiad alumni (know CHSH inequality), 50% Family/Colleagues (know her as "intense").
      *   **Goal:** A 4-5 minute toast.
      *   **Theme:** Use the Bell's theorem distinction as a throughline to show what it taught students *beyond* physics.
      *   **Constraint:** Do not turn into a lecture that loses the non-physicists.

  2.  **Determine the Tone:**
      *   Respectful but warm.
      *   Intellectual but accessible.
      *   Humorous (acknowledging her intensity).
      *   Emotional (celebrating her impact).

  3.  **Structure the Toast:**
      *   **Opening:** Welcome everyone, acknowledge the split audience (nerds vs. normals), introduce the teacher.
      *   **The Hook:** The "Spooky Action" rule. Explain it simply enough for non-physicists but accurately enough for the Olympiad kids.
      *   **The Metaphor:** Translate the physics dilemma (Locality vs. Realism) into a life lesson.
      *   **The Impact:** How this mindset shaped students (critical thinking, nuance, intellectual honesty).
      *   **The Tribute:** Acknowledge her intensity and care.
      *   **The Close:** Raise a glass, wishing her well in retirement.

  4.  **Drafting - Section by Section:**

      *   *Opening:* Start by addressing the room. Acknowledge the two tribes. Make a joke about the CHSH inequality.
      *   *The Core Concept:* Introduce the "Spooky Action" rule. I need to explain Bell's theorem simply.
          *   *Challenge:* How to explain "Locality vs. Realism" to grandma?
          *   *Solution:* Use an analogy. "Things happen where they are" vs. "Things are what they are." Or keep it high-level: "The universe is more complicated than a simple story." Let's stick close to her phrasing: It's a dilemma, not a verdict.
      *   *The Life Lesson:* Why did she care? Because easy answers are dangerous. "Einstein was wrong" is a headline. "We have to choose which assumption to let go of" is the truth.
      *   *Connecting to Students:* We didn't just learn physics. We learned to question binary choices. We learned precision in language.
