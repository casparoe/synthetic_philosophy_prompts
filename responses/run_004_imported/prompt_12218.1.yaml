answer: |-
  **Setting:** *The Grind, a coffee shop directly across from the philosophy building. It's 4:30 PM on a Tuesday. The seminar on Powers and Laws ended twenty minutes ago. Dana and Sam are at a small table littered with empty espresso cups and printouts of Lewis's "Finkish Dispositions."*

  **Sam:** (Stirring a cold cappuccino) I'm just saying, if the history of a research program looks exactly like a Ptolemaic system adding epicycles every decade, maybe it's time to consider that the earth moves.

  **Dana:** That's a dramatic way to say "we haven't found the perfect formulation yet." Look, the Ptolemaic system was wrong. The conditional analysis isn't *wrong*, it's just sensitive to context. We're refining the semantics. That's progress.

  **Sam:** Is it? Think about the trajectory. We start with the naive analysis: *Fragile iff would break if struck.* Clean. Elegant. Then Martin drops the electro-fink on us. The wire is live, but if touched, the machine makes it dead instantly. So, it's live, but it wouldn't conduct if touched. The conditional is false, the disposition is true. Boom.

  **Dana:** And Lewis patches it in '97. He adds the requirement that the *causal basis* must persist through the stimulus and actually produce the manifestation. The electro-fink fails because the basis (the conductivity) doesn't persist. The analysis holds.

  **Sam:** For exactly five minutes. Until someone walks in with a mask. The bubble-wrapped glass. It's fragile. The intrinsic basis—the molecular structure—is there. It persists when struck. But it doesn't break because of the bubble wrap. Lewis's analysis says it's *not* fragile because the counterfactual "if struck, it would break" is false. But we know it is fragile. So Lewis fails. And now we're here, drinking bad coffee, trying to figure out how to exclude the bubble wrap without excluding the fink.

  **Dana:** Okay, but admitting Lewis's fix wasn't the final word isn't an admission of defeat. It's an admission that the naive conditional was too simple. Look at Manley and Wasserman. They moved away from the strict binary. Dispositions aren't all-or-nothing; they're proportional. *x* is fragile to degree *n* iff in *n* proportion of relevant test cases, *x* breaks when struck.

  **Sam:** (Leans forward) Ah, the "relevant test cases" clause. There it is. The get-out-of-jail-free card. How do you define "relevant" without already knowing which cases manifest the disposition? If you include the bubble-wrapped cases in your set of relevant tests, the proportion drops, and the glass loses its fragility. If you exclude them, you've saved the analysis, but only by stipulating that masks don't count. That's circular. You're defining the disposition by the conditions under which it manifests, but you're selecting those conditions based on the disposition.

  **Dana:** It's not circular if "relevance" is cashed out in terms of *normal conditions*. And "normal" isn't defined by the disposition; it's defined by the actual world's statistical regularities or by similarity metrics. In the actual world, glasses aren't usually bubble-wrapped when we test for fragility. We're analyzing the concept as it functions in our best scientific theories. Science assumes ceteris paribus clauses all the time. We don't say thermodynamics is primitive just because we have to specify "in a closed system."

  **Sam:** But in thermodynamics, "closed system" is independently definable. No energy exchange. What's the independent definition of "no masking"? To say a condition is "normal" for a fragile object just means "a condition where nothing interferes with fragility." But *interferes with what?* Fragility. You can't specify the conditions without referencing the very power you're trying to reduce.

  **Dana:** I think you're conflating epistemic access with metaphysical reduction. Yes, *we* might need to know about fragility to pick the right test cases. But the *truthmaker* for the disposition ascription is still the counterfactual pattern in the world, not a primitive "power" entity. The point of the conditional analysis is to ground dispositions in the Humean mosaic of events. If I say "this glass is fragile," I'm making a claim about what *would* happen, not positing a ghostly "fragility" inside the glass.

  **Sam:** That's the Humean anxiety talking. You're terrified of ontological commitment. But here's the thing: Finks and Masks aren't just annoying counterexamples. They reveal a structural gap. A fink removes the basis *during* the stimulus. A mask keeps the basis but blocks the effect. Logically, for your conditional analysis, they do the exact same work: they sever the link between stimulus and manifestation.

  **Dana:** They don't do the same work metaphysically, though. That matters. A fink is intrinsic change. The wire *loses* the property. A mask is extrinsic prevention. The glass *keeps* the property. If we treat them as the same, we lose the distinction between losing a disposition and having a disposition that is prevented from manifesting. That's a crucial distinction for science. If a drug loses its potency (fink) versus if it's blocked by an antidote (mask), the medical intervention is totally different.

  **Sam:** I agree the distinction is useful for science. I disagree that the conditional analysis can capture it without smuggling in the distinction as a premise. To handle the fink, Lewis had to appeal to the *persistence of the basis*. To handle the mask, you have to appeal to *interfering factors*. But how do you identify an "interfering factor" without already knowing what the disposition is supposed to do? An antidote interferes with arsenic's lethality. But if lethality *just is* the counterfactual "if ingested, death follows," then the antidote makes the counterfactual false, which means the arsenic wasn't lethal. You can't say "it was lethal but the antidote stopped it" unless "lethal" means something *more* than the counterfactual. It means "has a nature directed at death."

  **Dana:** (Takes a sip of coffee, thinking) So you're pushing for Dispositional Essentialism. Bird's view. The property *is* the power.

  **Sam:** I'm pushing for honesty. If every time you try to analyze X in terms of Y, you need a clause that secretly references X, maybe X is primitive. The endless parade of finks, masks, antidotes, mimics, and reverse-finks... it's a degenerating research program. Lakatos would say you're protecting the hard core by adding auxiliary hypotheses that have no independent predictive power.

  **Dana:** But primitivism stops inquiry. If I ask "What is fragility?" and you say "It's a primitive power," you've told me nothing about its relation to laws, or causation, or observation. The conditional analysis, even if messy, connects dispositions to the empirical world. It explains *why* we attribute fragility: because of the pattern of breaking.

  **Sam:** It connects them by reducing them away. But you can't reduce them away because they're the glue of the laws of nature. Laws aren't just regularities; they're necessitations. The arsenic kills *because* of its nature. The conditional analysis treats the connection as contingent. That's why finks are possible in your view. In my view, a true fink is metaphysically impossible for a fundamental power. If something has the power, it must manifest unless something else *actively opposes* it. But that "must" isn't captured by a counterfactual. Counterfactuals are too weak.

  **Dana:** Wait, let's look at the "ad hoc" charge again. You say adding clauses for masks is degenerating. I say it's iterative refinement. When Newtonian physics failed to predict Uranus's orbit, we didn't say "Gravity is primitive and mysterious." We posited Neptune. We refined the conditions. Maybe "normal conditions" is our Neptune. It's a placeholder for a complex set of background constraints that we haven't fully mapped.

  **Sam:** But Neptune was independently observable. "Normal conditions" is defined by the success of the theory. It's a tautology. "The disposition manifests in conditions where it manifests."

  **Dana:** Not if we ground "normal" in similarity to actual paradigm cases. We point to actual breakings of actual glasses. We say, "Conditions relevantly similar to *that*." It's ostensive, not circular.

  **Sam:** (Laughs softly) Ostensive? So we're pointing at broken glass and saying "Like that, but not if there's bubble wrap, and not if a wizard is present, and not if the gravity is turned off..." Dana, at what point does the list of "nots" become the definition? If the analysis requires an infinite list of exclusions to match our intuition, the intuition is doing all the work. The analysis is just a shadow.

  **Dana:** So what's the alternative? We accept primitive powers. Now we have to explain how we know about them. If they aren't exhausted by their manifestations, how do we detect them?

  **Sam:** We detect them by their manifestations, just like you. But we don't claim the manifestations *constitute* the power. The power is the categorical ground that *supports* the counterfactuals. The counterfactuals are the evidence, not the meaning.

  **Dana:** But then you've got a gap between the evidence and the ontology. How do you close it?

  **Sam:** Same way you close the gap between "normal conditions" and "actual conditions." Inference to the best explanation. It explains the finks, the masks, and the laws without needing an infinite conjunctive clause in the definition.

  **Dana:** (Pauses, looking at the Lewis printout) I worry that taking powers as primitive makes them too safe. If a power is defined by its essence, it can't fail to be what it is. But then how do we handle probabilistic dispositions? A radioactive atom might not decay. Is its power to decay *primitive* but probabilistic?

  **Sam:** Sure. A tendency. A propensity. It's still a real feature of the atom, not just a summary of what it might do.

  **Dana:** But doesn't that make the connection to laws trivial? "Laws are relations between powers." Okay. Which powers? The ones that obey the laws. It feels like we're just renaming the problem. At least with the conditional analysis, if we get it wrong, the world proves us wrong. The glass doesn't break. If you have primitive powers, and the glass doesn't break, you just say "The power was masked." It's unfalsifiable.

  **Sam:** And if you have conditional analysis, and the glass doesn't break, you say "That wasn't a relevant test case." It's *also* unfalsifiable. You're just hiding the unfalsifiability in the ceteris paribus clause instead of the essence.

  **Dana:** (Sighs) Touché.

  **Sam:** Look, I'm not saying the conditional analysis is useless. It's great for everyday talk. "Don't drop that, it's fragile." We mean "It'll break." But for metaphysics? For grounding laws? It's trying to build a house out of smoke. You need bricks. Powers are the bricks.

  **Dana:** And I'm saying your bricks are invisible. You want me to build a metaphysics on entities that are defined by what they do, but insist they aren't what they do. I'd rather deal with the complexity of the smoke than the mystery of the invisible brick. Maybe the "whack-a-mole" isn't a sign of failure. Maybe it's a sign that dispositionality is a high-dimensional concept that resists simple reduction, but still supervenes on the counterfactual structure of the world. We just need a more complex logic. Not primitive ontology.

  **Sam:** Or maybe the mole is telling us the game is rigged.

  *(They sit in silence for a moment. The barista calls out an order. Dana traces the rim of their cup.)*

  **Dana:** You know... if we go with your primitivism, we still have to explain masks. Even if fragility is a primitive power, why does the bubble wrap stop it? You still need an account of interaction.

  **Sam:** True. But I don't need to define fragility *in terms of* the interaction. I just need to say the bubble wrap has a power to absorb impact that overrides the glass's power to shatter. Powers interacting with powers.

  **Dana:** And I say that interaction is just a complex web of counterfactuals. The bubble wrap would absorb... the glass would break...

  **Sam:** (Smiles) We're back to the start.

  **Dana:** (Smiles back) Maybe. But at least we're back to the start with better coffee.

  **Sam:** Cheers to that.

  *(They clink cups. Neither looks convinced, but both look thoughtful.)*
