answer: |-
  This is a splendid question that cuts to the heart of one of the most famous disagreements in the history of biology. To adjudicate between you and your friend, we have to disentangle two distinct layers of the debate: the *mechanism* of selection (who is choosing?) and the *criteria* of selection (why are they choosing?).

  First, a quick verification of your historical recollection: You are correct. In a letter to Asa Gray dated April 3, 1860, Darwin famously wrote, *"I remember well the time when the thought of the eye made me cold all over, but I have got over this stage of the complaint... and now only a little of the same nonsense comes over me when I think of a feather in a peacock's tail."* (He later intensified this to "makes me sick" in subsequent correspondence). This captures his genuine dread that the tail was a counter-example to Natural Selection.

  Here is the reconstruction of how Darwin would likely have reacted to Zahavi, and an assessment of whose reading holds more water.

  ### 1. The Core Disagreement: Aesthetics vs. Utility
  To understand Darwin's potential reaction, we must be precise about where he and Wallace actually diverged.

  *   **Darwin's Position:** He proposed **Sexual Selection**. He argued that females actively choose mates. Crucially, in *The Descent of Man* (1871), Darwin insisted that this choice was often driven by a **"taste for the beautiful."** He was committed to the idea that animals possessed an aesthetic sense independent of utility. For Darwin, the peacock's tail was chosen *because* it was beautiful, even if that beauty conferred no survival advantage (and indeed, conferred a disadvantage).
  *   **Wallace's Position:** He rejected Sexual Selection via aesthetic choice. He found the attribution of "taste" to birds anthropomorphic and unscientific. Wallace argued that male ornaments were signals of **vigor, health, or species recognition.** For Wallace, the tail was not "beautiful" in an aesthetic sense; it was a certificate of health. A male with a brilliant, symmetrical tail was demonstrating that he was so robust he could survive *despite* the encumbrance.

  ### 2. Zahavi's Handicap Principle
  Amotz Zahavi's 1975 proposal argues that for a signal to be evolutionarily stable, it must be costly. If a signal were cheap, low-quality individuals could fake it. Therefore, the signal must be a **handicap**. The peacock's tail is honest *because* it is dangerous. Only a male with superior genetics (disease resistance, foraging ability, predator avoidance) can afford to grow the tail and survive long enough to mate.

  ### 3. Darwin's Likely Reaction
  If you placed Zahavi's 1975 paper on Darwin's desk in 1871, his reaction would likely be a complex mixture of relief and philosophical concession.

  **Where your friend is right:**
  Your friend argues Darwin would see this as vindication. In a broad sense, they are correct. The greatest threat to Darwin's theory was not Wallace, but the later "eclipse of Darwinism" in the early 20th century, when biologists largely rejected Sexual Selection because they couldn't explain *why* females would choose a trait that reduced survival. Zahavi provides the mathematical and logical engine that makes Sexual Selection viable. Darwin would be profoundly relieved that the "sickening" paradox of the peacock is resolved. He would be thrilled that his mechanism—**Female Choice**—is preserved against Wallace's attempt to subsume everything under strict Natural Selection.

  **Where you are right:**
  However, your reading is more textually faithful to Darwin's specific arguments about the *nature* of the ornament. Darwin fought hard to distinguish **aesthetic preference** from **utility**. He wanted to show that beauty could evolve for its own sake.

  Zahavi's principle fundamentally grounds the signal in **utility** (viability/survival quality). Under the Handicap Principle, the female is not choosing the male because she derives pleasure from his beauty; she is choosing him because his beauty is a proxy for his ability to survive. She is assessing his **vigor**.

  This is precisely Wallace's argument. Wallace claimed the ornament indicated "general vigor." Zahavi claims the ornament indicates "genetic quality/viability." Darwin, conversely, argued that the ornament indicated "beauty," which *might* correlate with vigor but was selected for primarily because it pleased the female's eye.

  ### 4. The Verdict
  If we are strict about "reasoning only from what Darwin actually believed," **your reading is better supported.**

  Darwin would likely recognize that Zahavi's logic aligns more closely with Wallace's instincts than his own. Here is why:

  1.  **The Reduction of Beauty:** Darwin resisted the idea that all ornamentation must be tied to survival utility. He cited cases where ornaments seemed purely decorative. Zahavi's principle insists that the cost *is* the message. This reduces the "taste for the beautiful" to a "calculation of viability." Darwin spent chapters in *The Descent of Man* arguing against the notion that animals only choose based on utility. Zahavi restores utility to the center of the choice.
  2.  **The "Checkable Quality":** You noted that Zahavi grounds the signal in a "real, checkable underlying quality." Darwin explicitly distinguished Sexual Selection from Natural Selection by suggesting the former could operate *against* survival quality (e.g., a tail that makes you slower but gets you mates). Zahavi argues the tail proves you are *better* at surviving. This validates Wallace's view that the ornament is a testament to the male's robustness.
  3.  **Darwin's Honesty:** Darwin was a rigorous thinker. If presented with the Handicap Principle, he would likely admit that it provides a stronger *adaptive* explanation for the tail than his "aesthetic" argument. He might say: *"I was right that the female chooses, but Mr. Wallace was righter than I knew about why she chooses. She does not choose for beauty alone, but because the beauty proves the bearer is fit."*

  ### Conclusion
  Your friend is correct that Zahavi saves Darwin's **theory of Sexual Selection** from oblivion. Without Zahavi (and later Fisherian runaway selection), Darwin's mechanism of female choice looked biologically inexplicable for nearly a century.

  However, **you are correct** that Zahavi's explanation of the *peacock's tail specifically* is philosophically congenial to **Wallace**. It transforms the tail from an object of aesthetic contemplation (Darwin) into a certificate of survival capability (Wallace).

  If Darwin were forced to choose, he would likely concede that Zahavi resolved the "sickening" paradox by showing the tail *is* compatible with survival logic—precisely the concession Wallace demanded. Darwin would have to accept that the "taste for beauty" is actually a "taste for honest signals of health." In that specific adjudication regarding the *meaning of the ornament*, your reading wins: Zahavi vindicates Wallace's intuition about quality, even while saving Darwin's mechanism of choice.

  **Recommendation for the dinner party:** Tell your friend they win on the **mechanism** (Female Choice is real), but you win on the **motive** (The choice is based on viability, not aesthetics). It is the perfect synthesis: Darwin's engine running on Wallace's fuel.
