      *   **Core Question:** Kripke argues "Water = H2O" is necessary but *appears* contingent (explainable). He argues "Pain = C-fiber firing" is necessary and *appears* contingent (unexplainable). Chalmers uses Zombies (physical duplicates without consciousness) to argue against physicalism. The user sees Chalmers as using Kripke's playbook.
      *   **Specific Task:** Compare Kripke's two arguments (Heat/Water vs. Pain). Explain *why* Kripke (and Chalmers following him) thinks the "explaining away" move works for Heat/Water but fails for Pain/Consciousness. Evaluate whether Chalmers earns this distinction or just asserts it.

  2.  **Deconstruct Kripke's Argument (Naming and Necessity):**
      *   *Scientific Identities:* "Heat = Molecular Motion" and "Water = H2O."
      *   *Modal Status:* If true, they are necessarily true (rigid designators).
      *   *Epistemic Status:* They feel contingent (we can imagine heat without molecular motion).
      *   *Kripke's Explanation:* The feeling of contingency comes from confusing the *referent* (heat itself) with the *mode of presentation* (the sensation of heat). We can imagine a world where molecular motion exists but doesn't cause the *sensation* of heat in us. That's not a world without heat (molecular motion), but a world where heat doesn't feel like *this* to us. The contingency is in the *detection*, not the identity.
      *   *Mind-Brain Identities:* "Pain = C-fiber firing."
      *   *Modal Status:* If true, necessarily true.
      *   *Epistemic Status:* Feels contingent (we can imagine C-fibers firing without pain).
      *   *Kripke's Explanation (Failure):* Can we say the contingency is in the detection? No. Because for pain, the *mode of presentation* (feeling pain) *is* the referent (pain itself). There is no gap between "seeming to feel pain" and "feeling pain." Therefore, if we can imagine C-fibers firing without pain, we are imagining C-fibers firing without the *thing itself*. Thus, the identity is false.

  3.  **Deconstruct Chalmers' Zombie Argument:**
      *   *Premise:* Philosophical Zombies (P-Zombies) are conceivable (physically identical to us, but no conscious experience).
