      *   *Conclusion:* If Zombies are possible, then Physicalism is false (because Physicalism says the physical facts fix all facts, including consciousness).
      *   *Connection to Kripke:* Chalmers explicitly builds on Kripke's modal argument. He accepts Kripke's distinction between primary and secondary intensions (roughly corresponding to the "mode of presentation" vs. "referent" distinction).

  4.  **Address the Core Comparison (The "Explaining Away" Move):**
      *   *Heat/Water:* The "contingency" is explained by the distinction between the phenomenon (molecular motion) and our *sensation* of it. We mistake "I can imagine molecular motion without *this sensation*" for "I can imagine molecular motion without *heat*."
      *   *Pain/Consciousness:* There is no distinction between the phenomenon and the sensation. Pain *is* the feeling. To imagine C-fibers without pain is to imagine C-fibers without the phenomenon itself.
      *   *Chalmers' Twist:* Chalmers formalizes this using "Primary vs. Secondary Intensions."
          *   *Water:* Primary intension (watery stuff) $\neq$ Secondary intension (H2O). Zombies are inconceivable regarding water because if you have H2O, you have water (in the actual world sense). Wait, actually, Chalmers argues Zombies are conceivable regarding *consciousness* specifically.
          *   *Consciousness:* Primary intension = Secondary intension. What it feels like *is* what it is.

  5.  **Evaluate the Criticism (Did Chalmers earn the distinction?):**
