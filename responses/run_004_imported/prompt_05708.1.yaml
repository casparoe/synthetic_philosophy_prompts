answer: |-
  Your friend's argument is a classic application of the **Logical Omniscience** requirement found in standard Bayesian epistemology, but it conflates *metaphysical necessity* with *epistemic certainty*. While her reasoning is valid within the framework of ideal Bayesianism, that framework is widely recognized as inappropriate for modeling bounded rational agents like human mathematicians.

  Here is the breakdown of where the argument goes wrong, tailored to your background.

  ### 1. The Logical Omniscience Problem
  Standard Bayesianism requires that an agent's credence function be a probability function over a Boolean algebra of propositions. Since mathematical truths are tautologies (or contradictions) within the relevant system (e.g., PA or ZFC), standard probability axioms dictate that $P(\text{Collatz}) \in \{0, 1\}$.

  However, this requirement entails **Logical Omniscience**: the agent must be certain of all logical consequences of their beliefs. It is a consensus in formal epistemology (see Hacking 1967, Garber 1983, Eells 1985) that this is an unrealistic idealization for human agents. Rationality norms for humans must account for **logical uncertainty**. We are rationally permitted to assign non-extreme credences to necessary propositions whose truth values we have not yet computed or derived.

  ### 2. The Dutch Book Setup Requires a Knowledgeable Bookie
  Your friend claims that assigning a credence of 0.5 leaves you exposed to a Dutch Book (a sequence of bets guaranteed to lose money). This is the crux of the technical error.

  For a Dutch Book to be constructed against an agent regarding a logical truth, the **Bookie must know the truth value** (or the logical relation) that the agent misses.
  *   If the Collatz Conjecture (CC) is necessarily true, a Bookie who *knows* CC is true can sell you a bet on $\neg \text{CC}$ and a bet on $\text{CC}$ in a way that guarantees your loss.
  *   However, your friend *does not know* whether CC is true or false. She is in the same epistemic position as you.

  Because she lacks knowledge of the necessary truth, she cannot construct a **synchronic** Dutch Book against you. She can only argue that, *diachronically*, once the proof is found, one of you will have been "wrong." But Dutch Book arguments are typically used to establish synchronic coherence constraints. If neither party knows the logical status of the proposition, a bet at even odds reflects a coherent alignment of credence with *evidence*, not a violation of probability axioms relative to the agent's actual algebra of knowledge.

  ### 3. Metaphysical vs. Epistemic Possibility
  Your friend is conflating the **modal status of the proposition** with the **epistemic status of the agent**.
  *   **Metaphysically:** There is only one possible world (regarding arithmetic); CC is either true in it or false in it.
  *   **Epistemically:** There are multiple epistemic possibilities compatible with your current evidence.

  Rational credence tracks epistemic possibility, not metaphysical necessity. If we required credences to match metaphysical necessity, we could never assign probabilities to any mathematical conjecture, past or future. We would have to assign 1 to Fermat's Last Theorem before Wiles proved it (since it was always necessary), which renders the concept of "mathematical discovery" incoherent from an epistemic standpoint.

  ### 4. The Performative Contradiction
  There is a pragmatic flaw in your friend's position. By agreeing to a bet at even odds, she is implicitly acting as though the outcome is uncertain.
  *   If she truly believed a rational agent must assign 0 or 1, she should refuse to bet unless she has a proof (in which case she wouldn't bet at even odds; she'd take any odds).
  *   By betting at even odds, she is signaling that her *effective* credence is near 0.5, even if her *stated* norm is 0/1. She is violating the very coherence she demands of you.

  ### 5. Formal Frameworks for Logical Uncertainty
  If you want to press the formal point, you can point her toward literature on **Logical Uncertainty**. Frameworks developed by Gaifman, Hacking, and more recently by researchers in AI alignment (e.g., Garrabrant et al. on "Logical Induction"), explicitly relax the logical omniscience requirement.
  *   In these frameworks, agents assign probabilities to logical sentences based on computational resources and patterns, not just truth conditions.
  *   A "Logical Inductor" can assign 0.5 to CC without being Dutch Booked *by a polynomial-time bookie*. Since your friend is not a hypercomputer, she cannot exploit your logical ignorance.

  ### Conclusion
  Your friend is applying an **ideal norm** to a **non-ideal context**. While it is true that CC is necessarily true or false, it is not irrational to assign intermediate credences to necessary truths when their status is unknown to the agent. The Dutch Book argument fails because it requires a Bookie with access to logical facts that are currently inaccessible to both parties.

  You can keep your dinner money. The rational move is to treat the bet as being on the *resolution of the conjecture within our epistemic horizon*, not on the metaphysical necessity itself.

  **Suggested Reply:** "You're applying the Logical Omniscience requirement. Unless you can construct a synchronic Dutch Book against me *without knowing the proof yourself*, my credence is coherent relative to my evidence state. Until you have a proof, you're betting on epistemic uncertainty just like I am."
