  8.  **Final Polish:** Check against the user's specific constraints ("I'd rather hear that it doesn't hold up"). I need to be clear that it *does* hold up, but explain the limits so they don't overclaim. (e.g., Don't claim Berkeley predicted Bitcoin, claim he understood the ontology of fiat).

