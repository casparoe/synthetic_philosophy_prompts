              *   **Scanlon's Principle of Fidelity:** This is close to the user's view (expectations), but Scanlon adds a layer about the *principle* one cannot reasonably reject, not just the raw harm.
      *   *The "Spooky Duty" Comment:* The user is dismissing deontological obligations (duty for duty's sake) as "spooky." This is a common naturalist/consequentialist move, but it's a *contested* move, not a settled one.

  3.  **Identify the Risks in the User's Draft:**
