answer: |-
  This is a strong, coherent position, but if you write that it's the **"settled view among ethicists,"** you will get pushback from anyone specializing in normative ethics or philosophy of law.

  Here's the sanity check you need: Your view is a **dominant** and **highly respected** account (often called the **Reliance Theory** or a **Expectation-Based** account), but it is not the *only* game in town, and the debate is very much alive.

  Here are the three main buckets of thought on promising, so you can position your piece accurately:

  ### 1. The Reliance/Expectation View (Your View)
  *   **The Gist:** Exactly as you described. The obligation arises because you induced reliance in another person. Breaking the promise causes harm (disappointed expectations).
  *   **Key Proponents:** P.S. Atiyah (in law), T.M. Scanlon (in ethics—specifically his *Principle of Fidelity*), and many consequentialists.
  *   **Strength:** It naturalizes the obligation. It doesn't require "magic"; it just requires understanding harm and causality.
  *   **Weakness:** It struggles with "harmless" broken promises. If I promise to meet you for coffee, you rely on it, but then I call you 10 minutes before and you stay home anyway (no harm done), did I still wrong you? Most people say yes. Your theory has to work hard to explain why.

  ### 2. The Will Theory (Autonomy View)
  *   **The Gist:** A promise binds you because you **willed it to**. It is an exercise of autonomy. By saying "I promise," you transfer a right to the other person. The obligation isn't about the *harm* to them; it's about respecting your own agency and the rights you created.
  *   **Key Proponents:** Immanuel Kant, Charles Fried (*Contract as Promise*), many deontologists.
  *   **Counter to you:** They would argue your view misses the point. Even if no harm occurs, breaking a promise is a violation of the other person's right to your performance. They would say your view reduces promises to mere predictions of behavior, stripping them of their normative "oomph."

  ### 3. The Practice/Convention View
  *   **The Gist:** Promising is a social institution (like money or baseball). You can't opt out of the rules while staying in the game. Breaking a promise harms the **institution** of trust, not just the individual.
  *   **Key Proponents:** David Hume, John Rawls (*Two Concepts of Rules*), Searle.
  *   **Counter to you:** They argue you can't explain the obligation by looking at a single instance of harm. The obligation exists because if everyone reasoned the way you do (breaking whenever it seems harmless), the practice of promising would collapse.

  ### The "Spooky Duty" Comment
  You mention there's no extra "spooky" duty left over. In philosophy, that "spooky duty" is called a **deontological constraint**.
  *   **Naturalists/Consequentialists** (like you seem to be leaning) agree with you: duties are just shorthand for preventing bad outcomes.
  *   **Deontologists** disagree: They argue duties are real constraints that exist *independent* of outcomes.
  *   **Verdict:** This is the oldest fight in ethics. It is definitely not settled.

  ### Recommendation for Your Piece
  You don't need to change your argument, but you should tweak the framing to maintain credibility:

  1.  **Don't say "Settled."** Say: *"This reliance-based account is one of the most compelling and widely held views in modern ethics..."*
  2.  **Acknowledge the "Will" counter-argument briefly.** You can say: *"While some argue that promises create a metaphysical bond of will, we don't need to invoke that to explain the obligation. The harm of disappointed reliance explains the weight of the duty without the extra metaphysical baggage."*
  3.  **Distinguish Psychology from Normativity.** You mentioned reading game theory/evolution. Be careful not to conflate *why we evolved to keep promises* (reciprocal altruism) with *why we are morally obligated to keep them* (the philosophical justification). Your argument bridges the two nicely, but keep the distinction clear.

  **Bottom line:** Your intuition is philosophically robust (it aligns with Scanlon and Atiyah), but if you claim it's the consensus, you'll look like you haven't read the Kantians or the Rawlsians. Frame it as the **most parsimonious** view, rather than the **only** view, and you'll be on solid ground.
