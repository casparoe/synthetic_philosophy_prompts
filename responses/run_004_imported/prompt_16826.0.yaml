          *   Physics: Galileo's physics of motion was incomplete (no inertia in the Newtonian sense).
          *   The Tides: Galileo's "proof" in the *Dialogue*. It relies on the Earth's dual motion causing sloshing. It is physically incorrect (tides are lunar/solar gravity). It was demonstrably flawed even then (Kepler pointed out the moon's role).
      *   *The Conclusion:* Galileo claimed to have "proof" (or at least sufficient demonstration) to trigger his hermeneutic rule. He didn't. Bellarmine waited for that proof. Therefore, Bellarmine adhered to Galileo's rule better than Galileo did.

  3.  **Drafting - Section by Section:**

