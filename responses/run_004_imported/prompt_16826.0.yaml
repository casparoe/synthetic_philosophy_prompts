      *   **Constraints:** Do not hedge. Do not do a "both sides had a point" balance. Commit to the thesis. Engage with specific texts (*Christina*, Bellarmine's letter to Foscarini, *Dialogue Concerning the Two Chief World Systems*) and the evidential situation of the time (parallax, phases of Venus, tides, Tychonic system). Avoid generic "science vs. religion" tropes.
      *   **Tone:** Analytical, historical, argumentative, nuanced but firm.

