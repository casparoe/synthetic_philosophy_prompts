prompt: |-
  Ok so my friend Priya and I have been going back and forth about this for like two hours now — it started at dinner and then kept going over text until almost midnight — about that Taurek thought experiment, the one where you've got a drug that can either save David, who needs the whole dose, or save six other people instead, since the same drug could be split so each of them only needs a sixth of it (I might be a little off on the exact numbers, but that's the gist). Taurek's whole point is that you're not automatically obligated to save the six just because there's more of them, since you can't just add up seperate people's losses into one big loss that outweighs David's loss on its own. I actually buy that part, weirdly. Where we started properly fighting is over what you're supposed to DO once you accept it. Priya's position is that the mature, grown-up answer — the one that actually respects both sides of the disagreement — is to run a weighted lottery: give the six a proportionally bigger chance at the drug than David gets, like 6/7 vs 1/7, instead of either just saving the six outright or flipping a plain 50/50 coin. She thinks she read this somewhere, possibly attached to a guy named Broome but she wasn't totally sure, and she's convinced it's the neat solution that splits the difference between "numbers don't matter at all" and "numbers are all that matters."

  I think this is basically a shell game and I want something more solid than "it feels off" to bring back to her next time it comes up. Can you build the strongest case you can that this weighted-lottery move doesn't actually work as a genuine middle path? I want you to really get into the mechanics of it rather than just asserting it: either show that weighting the lottery by headcount already smuggles in exactly the kind of cross-person aggregation that Taurek's original argument was supposed to rule out (so it's not a real compromise, it's aggregation wearing a coin-flip costume), or show that if you take the "equal, non-aggregable claim" idea fully seriously, there's no principled way to derive those unequal weights at all, and you're pushed back to a flat 50/50 no matter whether it's 1 vs 6 or 1 vs 6 million. Don't just pick whichever horn is convenient — actually work through why the weights can or can't be justified from the underlying premise. And if there's a genuinely strong comeback available to Priya, be upfront about what the best version of that looks like too. I'd rather find the hole in my own argument now than get blindsided by it later.
