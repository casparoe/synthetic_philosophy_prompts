          *   Calculation: If I cooperate, you cooperate (Payoff: R, R). If I defect, you defect (Payoff: P, P). Since R > P, I should cooperate.
          *   Nature: It's a decision-theoretic move based on expected utility, but with a modified causal/counterfactual model (acausal trade/logical correlation). It is ultimately *consequentialist* in structure (maximizing payoff based on the correlation).

      *   **Kant's Categorical Imperative (Formula of Universal Law -FUL):**
          *   Maxim: "I will do X in circumstance Y."
