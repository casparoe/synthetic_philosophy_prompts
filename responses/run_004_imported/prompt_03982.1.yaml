prompt: |-
  I am putting together a graduate seminar on formal epistemology, and this week's session pairs I. J. Good's 1967 paper, "On the Principle of Total Evidence," with some applied readings on disclosure policy. As I understand the theorem Good proves there, for a Bayesian agent facing a fixed decision problem, the expected utility of consulting a piece of cost-free evidence before acting can never be lower than the expected utility of acting without it: free information, properly used, is never harmful in expectation. This looks to me like a strikingly clean, decision-theoretic vindication of transparency norms quite generally. Mandatory disclosure requirements in finance, pre-registration of clinical trials, and "sunshine" rules for regulatory rule-making all look like straightforward instances of exactly the free-information-before-a-decision structure that Good's proof covers, so it would seem to follow that any resistance to such requirements must ultimately rest on something other than the effects of information as such — protecting incumbents, say, or paternalism about people's capacity to cope with bad news — rather than any genuine decision-theoretic cost of the disclosure itself.

  What has been nagging at me is that actual policy does not behave as though this were settled. The 2008 Genetic Information Nondiscrimination Act bars American health insurers and employers from requiring or using an applicant's genetic test results, and the British insurance industry has operated for more than two decades under a voluntary arrangement with government — originally a moratorium, since 2018 the Code on Genetic Testing and Insurance — under which insurers do not ask most applicants to disclose existing predictive genetic test results. In neither case is the restriction presented as a regrettable compromise against an otherwise desirable free flow of information; keeping the information out of the underwriting decision is treated as the whole point of the policy. Before I present Good's theorem to my students as grounding a general presumption toward maximal disclosure, I would like a precise answer: is there a genuine decision-theoretic rationale for restrictions like these, and if so, exactly which premise of Good's argument fails to carry over from the case of a single, lone decision-maker to a setting like insurance underwriting? I would rather have the precise mechanism than a gesture toward "incentives are complicated."
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** Graduate seminar on formal epistemology.
      *   **Core Text:** I. J. Good's 1967 paper, "On the Principle of Total Evidence."
      *   **User's Interpretation:** Good's theorem proves free information is never harmful in expectation for a Bayesian agent. Therefore, transparency/disclosure norms (finance, clinical trials, regulation) are decision-theoretically vindicated. Resistance to disclosure must be non-epistemic (incumbent protection, paternalism).
      *   **The Puzzle:** Real-world policy often *restricts* information flow (e.g., GINA 2008, UK Code on Genetic Testing and Insurance). These aren't framed as compromises but as positive goods (keeping info *out* of decisions).
      *   **The Question:** Is there a genuine decision-theoretic rationale for these restrictions? Which premise of Good's argument fails when moving from a single agent to insurance underwriting? The user wants precision, not hand-waving about "complicated incentives."

  2.  **Deconstruct Good's Theorem:**
      *   **Setup:** Single agent, fixed decision problem, cost-free evidence.
      *   **Mechanism:** Agent updates credences via Conditionalization. Agent maximizes Expected Utility (EU) based on posterior credences.
      *   **Result:** $EU(\text{observe } E) \ge EU(\text{do not observe } E)$.
      *   **Key Assumptions:**
          1.  Single agent (or agents with identical utility functions/goals).
          2.  The act of observation does not change the state of the world (non-intrusive).
          3.  The cost of information is zero (or negligible).
          4.  **Crucially:** The utility function is fixed and independent of the information state *except* through the action chosen.
          5.  **Crucially:** The information is relevant to the decision *of that agent*.

  3.  **Analyze the Insurance/Genetic Testing Case:**
      *   **Agents:** Insurer (I) and Applicant (A).
      *   **Decision:** I decides whether to insure and at what premium. A decides whether to apply/buy.
      *   **Information:** Genetic test results (known to A, potentially known to I).
      *   **Good's Framework Application:**
          *   If we view the *Insurer* as the Bayesian agent: More info (genetic test) allows better risk assessment. $EU_I$ goes up (less adverse selection).
          *   If we view the *Applicant* as the Bayesian agent: More info (knowing their own risk) helps them decide whether to buy. $EU_A$ goes up.
          *   **So why ban it?** Because the *interaction* changes the game structure. It's not a single-agent decision problem; it's a game.

  4.  **Identify the Failure of Good's Premises:**
      *   **Premise 1: Single Agent vs. Game Theory.** Good's theorem is for a single decision-maker. Insurance is a strategic interaction (often modeled as signaling or screening games).
      *   **Premise 2: Fixed Utility/State Independence.** In insurance, the *availability* of information changes the pool composition (Adverse Selection).
      *   **Premise 3: Cost-Free.** Information isn't cost-free if acquiring it changes behavior (endogenous risk).
      *   **Premise 4: The "Value" being maximized.** Good maximizes individual Expected Utility. Policy often maximizes *Social Welfare* or *Pareto Efficiency* across heterogeneous agents.

  5.  **Develop the Decision-Theoretic Rationale (The "Precise Mechanism"):**
      *   *Adverse Selection (The Akerlof/ Rothschild-Stiglitz mechanism):* If insurers use genetic info, high-risk individuals pay high premiums (or are denied). Low-risk pay low premiums. High-risk might drop out. Pool shrinks. Risk increases for remaining. Market can collapse.
      *   *Ex-Ante vs. Ex-Post Efficiency:*
          *   *Ex-Post (Good's view):* Given I know your risk, I price correctly. Efficient allocation.
          *   *Ex-Ante (Veil of Ignorance):* Before I know my genetics, I want insurance to pool risk. If info is used, risk pooling fails. I am worse off *before* I know the info.
      *   *The "Value of Ignorance":* In a risk-pooling context, *not* knowing (or not being allowed to use) specific information preserves the insurance function (transferring wealth from lucky to unlucky). If you allow the info, you destroy the transfer mechanism.
      *   *Good's Theorem Limit:* Good assumes the state of the world is fixed. In insurance, the "state" includes the distribution of risks in the pool, which is endogenous to the information policy.

  6.  **Synthesize the Argument for the Seminar:**
      *   Acknowledge Good's theorem is correct *within its domain* (single agent, fixed state).
      *   Identify the category error: Applying single-agent decision theory to multi-agent strategic contexts with risk-pooling goals.
      *   Pinpoint the specific premise failure: **The assumption that the utility of outcomes is independent of the information partition of other agents.** (Or: The assumption that the probability distribution over states is exogenous).
      *   Explain the Genetic Insurance case specifically: It's about preserving *risk pooling*. If info is used, it becomes a bet, not insurance.
      *   Connect to "Value of Information" vs. "Value of Ignorance."

  7.  **Refine the Technical Details (Self-Correction/Nuance):**
      *   *Is it just Adverse Selection?* Partly, but also the definition of insurance. Insurance is about smoothing consumption across states. If states are perfectly distinguished, no smoothing occurs.
      *   *Hirshleifer Effect:* This is the specific economic term for when public information destroys risk-sharing opportunities. This is the "precise mechanism" the user wants.
      *   *Good's Theorem assumption:* $P(State)$ is fixed. In Hirshleifer, the *ability to contract* depends on the information structure.
      *   *Distinction:* Good talks about *decision* utility. Policy talks about *welfare* utility (often ex-ante).

  8.  **Drafting the Response:**
      *   **Introduction:** Validate the user's understanding of Good (it is correct for single agents). Validate the puzzle (policy does contradict a naive extension).
      *   **The Core Diagnosis:** Good's theorem assumes a single agent and an exogenous state space. Insurance is a multi-agent game with endogenous risk pools.
      *   **The Precise Mechanism:** The **Hirshleifer Effect** (1971). Information can destroy risk-sharing opportunities.
      *   **Breaking Down Good's Premises:**
          1.  *Exogeneity of States:* Good assumes $P(S)$ is fixed. In insurance, the *contract feasibility* depends on information.
          2.  *Single Utility Function:* Good maximizes $EU_{agent}$. Policy maximizes $SWF$ (Social Welfare Function), often ex-ante.
          3.  *Non-Strategic:* Good ignores how my info affects your willingness to trade.
      *   **Application to Genetic Testing:**
          *   With info: Actuarially fair premiums. No cross-subsidy. High risks uninsurable.
          *   Without info: Pooling equilibrium. Cross-subsidy. Risk protection.
          *   Ex-ante perspective: Behind a veil of ignorance, agents prefer the pooling equilibrium (insurance) over the separating equilibrium (betting).
      *   **Conclusion for Seminar:** Good vindicates transparency for *belief formation* and *individual action*. He does not vindicate it for *market design* where risk-pooling is the goal. The "cost" of information is the destruction of the insurance market itself.

  9.  **Review against Constraints:**
      *   "Precise answer": Yes, Hirshleifer effect / Ex-ante vs Ex-post welfare.
      *   "Which premise fails": Exogeneity of the state/contract space; Single agent assumption.
      *   "Not gestures": Avoid vague "incentives" talk, focus on the structural change in the decision problem.

  10. **Final Polish:** Ensure tone is appropriate for a graduate seminar context (rigorous, philosophical but economically literate). (Self-correction: Make sure to distinguish between *adverse selection* and the *Hirshleifer effect* clearly, though they are related. Adverse selection is about asymmetric info. Hirshleifer is about symmetric info destroying risk sharing. In the genetic case, if the *insurer* gets the info, it becomes symmetric (or at least usable), destroying the pool. If only the *applicant* knows, it's adverse selection. The bans prevent the *insurer* from knowing, maintaining the pool.) *Wait, let's refine this.*
      *   If Insurer knows: Actuarial fairness. No pooling.
      *   If Insurer doesn't know (but Applicant might): Adverse selection risk.
      *   The GINA/UK Code prevents the *Insurer* from asking/using. This maintains the "ignorance" required for pooling.
      *   So the relevant mechanism is the **value of ignorance for risk-sharing**. Good's theorem says information is valuable for *decision making*. But in insurance, the "decision" is entering a contract that relies on *uncertainty* about specific states to function as insurance.
      *   Okay, the Hirshleifer effect is the strongest technical point here.

  11. **Final Structure:**
      *   Affirm Good's theorem validity (single agent).
      *   Identify the category mistake (Single Agent vs. Strategic/Market).
      *   Name the specific economic mechanism (Hirshleifer Effect).
      *   Detail the failed premises (Exogeneity, Utility Definition).
      *   Apply to Genetic Testing (Ex-ante vs Ex-Post).
      *   Seminar takeaway.

  (One more check: Does Good's theorem actually fail, or is it just misapplied? It's misapplied. The theorem holds for the insurer's profit maximization *if* the market doesn't collapse. But if the market collapses, the decision problem changes. The "state space" includes the existence of the contract. Good assumes the acts are available regardless of evidence. In insurance, the *act* of insuring at a pooled rate is not available if evidence is disclosed. So the set of available acts $A$ is a function of Evidence $E$. Good assumes $A$ is fixed. That is the precise premise failure.)

  *Refining the "Premise Failure":*
  Good's Theorem assumes the set of available actions $\mathcal{A}$ is independent of the evidence $E$.
  In insurance regulation, the set of permissible/feasible contracts $\mathcal{A}$ *depends* on the information regime.
  If $E$ (genetic info) is revealed, $\mathcal{A}$ shrinks to actuarially fair contracts (pooling contracts vanish).
  If $E$ is hidden, $\mathcal{A}$ includes pooling contracts.
  Therefore, $EU(\text{observe } E)$ is calculated over a different $\mathcal{A}$ than $EU(\text{ignore } E)$. Good's inequality $EU(E) \ge EU(\text{no } E)$ assumes the same $\mathcal{A}$.
  This is the precise technical violation.

  Okay, ready to write.
answer: |-
  You have correctly identified the tension, and your intuition that Good's theorem is being over-extended is spot-on. Good's result is mathematically sound, but it relies on structural assumptions that are violated in the specific context of insurance markets and risk-pooling policies.

  To give you the precise mechanism you need for your seminar: The failure lies in the assumption that the **set of available acts is independent of the evidence obtained**, and in the assumption that the **state space is exogenous to the information structure**. In the language of welfare economics, this is known as the **Hirshleifer Effect** (after Jack Hirshleifer's 1971 paper, "The Private and Social Value of Information and the Reward to Inventive Activity").

  Here is the breakdown of why Good's theorem does not vindicate maximal disclosure in this context, precisely where the premises fail, and how to frame this for your students.

  ### 1. The Precise Mechanism: The Hirshleifer Effect
  Good's theorem proves that for a single agent, more information allows for better mapping of states to actions, thereby increasing expected utility. However, this assumes that the *consequences* of actions are determined solely by the state of the world and the action itself.

  In insurance markets, the "action" is entering a contract. The value of that contract depends on the **informational symmetry between parties**.
  *   **With Disclosure:** If genetic information is available to the insurer, the market moves to a **separating equilibrium**. Premiums match individual risk exactly. The "act" of buying insurance becomes a bet at fair odds. Risk-averse agents gain no utility from this (since the premium equals the expected payout), so the insurance function (consumption smoothing) vanishes.
  *   **Without Disclosure:** If genetic information is banned, the market can sustain a **pooling equilibrium**. Low-risk individuals subsidize high-risk individuals. Risk-averse agents *do* gain utility from this, because they are paying less than their expected cost in the high-risk state.

  The "cost" of the information is not a processing cost; it is the **destruction of risk-sharing opportunities**. Good's theorem assumes the availability of acts is fixed. In insurance, the availability of *pooling contracts* is a function of the *absence* of information.

  ### 2. Which Premises of Good's Argument Fail?
  To be rigorous in your seminar, you can point to three specific assumptions in Good's framework that do not hold in the insurance underwriting context.

  **A. The Independence of the Action Space ($\mathcal{A}$)**
  Good's proof assumes a fixed set of available actions $\mathcal{A}$. The agent chooses $a \in \mathcal{A}$ to maximize utility given posterior credences.
  *   **Failure:** In the genetic insurance case, the set of feasible contracts $\mathcal{A}$ is endogenous to the information regime. If evidence $E$ (genetic test) is observed/disclosed, the set $\mathcal{A}_E$ contains only actuarially fair contracts. If $E$ is suppressed, the set $\mathcal{A}_{\neg E}$ contains pooled contracts.
  *   **Result:** You cannot compare $EU(\mathcal{A}_E)$ vs $EU(\mathcal{A}_{\neg E})$ using Good's inequality, because Good proves $EU(\mathcal{A} | E) \ge EU(\mathcal{A} | \text{no } E)$ for a *fixed* $\mathcal{A}$. He does not prove that $EU$ cannot decrease when the acquisition of $E$ restricts $\mathcal{A}$.

  **B. The Exogeneity of the State Space**
  Good assumes the probability distribution over states $P(S)$ is fixed prior to the decision.
  *   **Failure:** In insurance, the "state" includes the composition of the risk pool. If high-risk individuals are identified and priced out (due to disclosure), the pool composition changes (Adverse Selection/Market Collapse). The probability of the insurer facing a claim is not fixed; it is a function of who remains in the pool, which is a function of the information policy.
  *   **Result:** The "state of the world" is partly constituted by the information structure itself.

  **C. The Definition of the Agent (Single vs. Social)**
  Good's theorem is about the Expected Utility of a **single** Bayesian agent.
  *   **Failure:** Insurance policy is not about maximizing the EU of the insurer (who would want the info) or the applicant (who might want the info if they know they are low-risk). It is about maximizing **Ex-Ante Social Welfare**.
  *   **Result:** From an *ex-post* perspective (after I know my genetics), information is valuable (Good is right). From an *ex-ante* perspective (behind a Rawlsian veil of ignorance, before I know my genetics), I prefer a regime that forbids the use of that information because it guarantees me insurance coverage regardless of my genetic lottery. Policy restricts information to protect the *ex-ante* position, not the *ex-post* decision efficiency.

  ### 3. Application to the Genetic Testing Cases
  You can present the GINA and UK Code cases not as exceptions to rationality, but as rational responses to the **Value of Ignorance**.

  *   **The Insurer's Perspective:** If the insurer is the "Goodian Agent," they *should* want the information. It reduces their variance and prevents adverse selection. If the policy bans it, it is indeed a constraint on the insurer's decision-theoretic optimality *qua* profit maximizer.
  *   **The Social/Ex-Ante Perspective:** The "Agent" here is the citizen *before* they know their genetic risk. For this agent, the "act" is securing a lifetime of financial security. The "evidence" is the genetic test.
      *   If the test result is admissible in underwriting, the citizen faces a gamble: if positive, they are uninsurable.
      *   If the test result is inadmissible, the citizen faces a certainty: they are insured at the average rate.
      *   For a risk-averse agent (which is the justification for insurance in the first place), the certainty of coverage (enabled by ignorance) has higher expected utility than the gamble of insurability (enabled by information).

  ### 4. Seminar Takeaway
  For your seminar, the lesson is not that Good's theorem is wrong, but that it is **domain-specific**.

  1.  **Good's Domain:** Single-agent decision problems where information refines beliefs about a fixed state space to select from a fixed action space. Here, transparency is always instrumentally rational.
  2.  **Policy Domain:** Multi-agent strategic environments where information structures determine the *feasibility* of certain cooperative arrangements (like risk-pooling). Here, transparency can be instrumentally irrational because it destroys the mechanism (pooling) that generates the utility.

  **Suggested Framing for Students:**
  "Good's theorem vindicates the Principle of Total Evidence for **belief updating** and **individual action**. It does not vindicate it for **institutional design** where the value of the institution relies on specific informational asymmetries or opacities. In insurance, the 'cost' of free information is the collapse of the risk pool. Therefore, restrictions on genetic disclosure are not paternalistic; they are structural prerequisites for the existence of the insurance market itself."

  This gives you the precise decision-theoretic rationale: The restriction preserves the **action space** (pooling contracts) that would otherwise vanish if the evidence were admitted.
