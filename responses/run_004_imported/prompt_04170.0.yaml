prompt: |-
  hey, random question -- I'm TAing our grad micro sequence this semester and a student asked why the Allais paradox is supposed to be such a deep challenge to rational choice theory. I told them it's basically just risk aversion in disguise: people pick the sure $1M over the 89% $1M / 10% $5M / 1% nothing gamble because of diminishing marginal utility, which is totally consistent with expected utility theory as long as the bernoulli utility function is concave enough. So whats the cleanest way to explain to students why economists still bothered inventing stuff like rank-dependent utility and prospect theory to deal with the independence axiom violation, if a sufficiently concave utility function already does the job?
