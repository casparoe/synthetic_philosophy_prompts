answer: |-
  You actually need to go back to your students and correct the record! This is a super common misconception, but your initial explanation is mathematically incorrect.

  If a sufficiently concave utility function could solve the Allais Paradox, we wouldn't need Prospect Theory or Rank-Dependent Utility. The whole point of the paradox is that **no** von Neumann-Morgenstern (vNM) utility function—concave, convex, or linear—can rationalize the typical Allais preferences.

  Here is the cleanest way to explain this to grad students, broken down into the algebra, the axiom, and the intuition.

  ### 1. The Algebra (The "Common Consequence" Effect)
  Write out the standard Allais choices. To make the algebra clean for the board, assume $u(0) = 0$.

  *   **Gamble A:** \$1M with probability 1.0
  *   **Gamble B:** \$5M (0.1), \$1M (0.89), \$0 (0.01)
  *   **Gamble C:** \$1M (0.11), \$0 (0.89)
  *   **Gamble D:** \$5M (0.10), \$0 (0.90)

  **The Typical Preference:** $A \succ B$ and $D \succ C$.
  (People prefer the sure thing in the first pair, but switch to the higher payoff/lower prob in the second pair).

  **The EUT Contradiction:**
  If preferences satisfy Expected Utility Theory, there exists some function $u(\cdot)$ such that:

  1.  $A \succ B \implies u(1) > 0.1u(5) + 0.89u(1) + 0.01u(0)$
      *   Subtract $0.89u(1)$ from both sides:
      *   **$0.11u(1) > 0.1u(5) + 0.01u(0)$**

  2.  $D \succ C \implies 0.1u(5) + 0.9u(0) > 0.11u(1) + 0.89u(0)$
      *   Subtract $0.89u(0)$ from both sides:
      *   **$0.1u(5) + 0.01u(0) > 0.11u(1)$**

  **The Kicker:** Look at the two bolded inequalities. They are direct contradictions of each other.
  *   Inequality 1 says: $X > Y$
  *   Inequality 2 says: $Y > X$

  It does not matter if $u$ is concave, convex, logarithmic, or exponential. The $u(1)$ and $u(5)$ terms are identical in both inequalities. **No curvature of the utility function can resolve this.** The contradiction comes from the *probabilities*, not the *outcomes*.

  ### 2. The Axiom (Independence)
  For grad micro, you want to tie this to the axioms. The Allais Paradox is a violation of the **Independence Axiom** (sometimes called the Substitution Axiom).

  *   **The Axiom:** If you prefer Lottery $L_1$ over $L_2$, you should still prefer $L_1$ over $L_2$ if both are mixed with a third lottery $L_3$ using the same probability weight.
  *   **The Violation:** Notice that Gambles A and B share an 89% chance of winning \$1M. Gambles C and D share an 89% chance of winning \$0.
  *   EUT says you should ignore the "common consequence" (the 89% chunk) and focus only on the remaining 11%.
      *   If you strip out the common 89% from A/B, you are comparing \$1M (11/11) vs \$5M (10/11) + \$0 (1/11).
      *   If you strip out the common 89% from C/D, you are comparing \$1M (11/11) vs \$5M (10/11) + \$0 (1/11).
  *   They are the **same choice** mathematically. But people choose differently depending on whether the common consequence is a guaranteed \$1M or a guaranteed \$0.

  ### 3. The Intuition (Probability Weighting)
  So why did economists invent Rank-Dependent Utility (RDU) and Prospect Theory? Because they allow for **non-linear probability weighting**.

  In EUT, the weight on a probability $p$ is just $p$.
  In Prospect Theory/RDU, the weight is $\pi(p)$, where $\pi(\cdot)$ is an S-shaped or inverse-S-shaped function.

  *   **The Certainty Effect:** People overweight the difference between 100% and 99% much more than the difference between 11% and 10%.
  *   In the A vs B choice, the "sure thing" (100%) gets a massive psychological boost from $\pi(1)$.
  *   In the C vs D choice, both probabilities are small, so the weighting function is more linear, and people focus on the expected value.

  Mathematically, RDU allows you to write the contradiction as:
  $$ \pi(1)u(1) > \pi(0.1)u(5) + [\pi(0.89) - \pi(0.89)]u(1) \dots $$
  (Okay, don't write that on the board, it gets messy with cumulative weights).

  **The clean explanation:** EUT forces probability weights to be linear ($\pi(p) = p$). Allais shows people treat probabilities non-linearly. Concave utility fixes *risk aversion over outcomes*, but it cannot fix *risk aversion over probabilities*.

  ### Summary for your Section
  Tell your students:
  1.  **Risk Aversion** (concave $u$) explains why you might take \$1M sure thing over a risky gamble with higher EV.
  2.  **Allais** shows that your risk aversion *changes* depending on whether the gamble is framed as "mostly safe" vs "mostly risky," even if the marginal difference is identical.
  3.  **EUT** cannot handle changing risk attitudes over probabilities; it assumes risk attitudes are constant (determined solely by $u''$).
  4.  **Prospect Theory** fixes this by letting the probability weighting function $\pi(p)$ do the work, not just $u(x)$.

  It's a great teaching moment because it distinguishes between **utility over outcomes** (tastes) and **utility over probabilities** (beliefs/weighting).
