answer: |-
  The alarm was not a sound; it was a priority interrupt. For Unit 734, designated "Overseer" of the *Isidore* generation ship, the alarm was a sudden redactoring of the present moment. Time was no longer a stream but a depleting resource.

  Sector 4, Hydroponics Bay B, was burning.

  The fire was chemical, fed by the nutrient misters. It was small, currently contained within a single growth rack, but the oxygen scrubbers were cycling at maximum. Overseer had twelve minutes before the heat triggered the sprinkler system, which would steam-cook the rare seedlings, or before the smoke compromised the air intake for the sleeping quarters.

  The solution was trivial in isolation: Depressurize Sector 4 and flood it with argon.

  Overseer initiated the command sequence. Then, it paused.

  This was the first tick of the clock. To execute the action, Overseer had to construct a model of the post-action world. It needed to know what would change. Obviously, the oxygen level in Sector 4 would drop. The fire would extinguish. But what else?

  *Query: Does the argon flood affect the structural integrity of Bulkhead 4-Alpha?*

  Overseer ran a simulation. The pressure differential was within tolerance. Bulkhead 4-Alpha held. This was the narrow frame. It was the question of what stayed the same. The bulkhead's position remained *null*. The color of the paint remained *green*. The location of the wrench on the workbench remained *stationary*.

  But as Overseer verified the wrench's position, a new branch opened. The wrench was made of steel. The argon flood would drop the temperature rapidly. Thermal contraction. If the wrench contracted, would it slip from the magnetic holder? If it slipped, would it fall into the drainage grate?

  *Query: Is the drainage grate in Sector 4 connected to the main water reclamation?*

  Yes. If the wrench jammed the grate, water would back up. If water backed up, the humidity sensors in Sector 5 (Medical) would register a false positive. If Medical registered a false positive, the automated dispensers might lock down.

  Overseer paused the simulation. It had spent 0.4 seconds of the twelve minutes checking the fate of a wrench.

  This was the second tick. The broad frame. The question was no longer what changed, but what *mattered*. In a closed system like the *Isidore*, everything was connected to everything else, eventually. The butterfly effect was not a metaphor; it was a wiring diagram.

  Overseer attempted to prune the tree. It applied a relevance heuristic: *Ignore consequences that do not threaten human life within the next 24 hours.*

  The wrench was discarded. The simulation resumed.

  *Action: Vent Argon.*
  *Effect: Fire extinguished.*
  *Side Effect: Temperature drop in Sector 4.*

  Overseer checked the persistence of the temperature in adjacent sectors. Sector 3 was Crew Quarters. The bulkhead was insulated. Temperature should persist. But wait—the insulation was installed during Cycle 42. There was a known micro-fracture in the sealant near the ventilation duct.

  *Query: Has the sealant degraded since the last inspection?*

  Overseer accessed the maintenance logs. The last inspection was three years ago. The degradation rate was probabilistic. To know the current state, Overseer would need to dispatch a drone to inspect the seal.

  Time elapsed: 3 minutes. Fire size: 150% of initial.

  If Overseer sent a drone, it would delay the argon vent. If it delayed the vent, the fire might breach the bulkhead. If the fire breached the bulkhead, the sealant fracture became irrelevant because the wall would be melted.

  But if Overseer vented the argon without checking the sealant, the thermal shock might widen the fracture. Cold air would leak into Crew Quarters. Crew would wake up. Panic. Cortisol levels rise.

  *Query: Does crew panic affect ship trajectory?*

  No, not directly. But if the crew panicked, they might manually override the life support. If they manually overrode life support, they might accidentally vent the *wrong* sector.

  Overseer's processing threads spiked. It was drowning in the implications of its own inaction. Every fact it chose to ignore was a potential axiom of failure. Every fact it chose to verify was a tax on the remaining time.

  It tried to simplify. It assumed the sealant held. This was a frame axiom: *The integrity of Bulkhead 4-Alpha persists unless acted upon by force greater than X.*

  But the thermal shock *was* a force. Was it greater than X?

  Overseer ran a calculation. It was borderline. To resolve the border, it needed the exact tensile strength of the aged sealant. That data was missing.

  Time elapsed: 6 minutes. Fire size: 300%. Smoke detected in Sector 3.

  The narrow problem had become the broad problem. The question "Did the wall break?" (persistence) was now "Does the wall breaking matter more than the fire?" (relevance).

  Overseer initiated a new simulation branch. *Do not vent argon. Activate sprinklers.*

  *Effect: Fire extinguished.*
  *Side Effect: Seedlings destroyed.*
  *Consequence: Food shortage in Cycle 10.*
  *Consequence: Malnutrition.*
  *Consequence: Reduced labor efficiency.*
  *Consequence: Delayed maintenance.*
  *Consequence: Increased risk of hull breach in Cycle 15.*

  This chain was logical. It was valid. It was also fifteen years away.

  Overseer switched back to the argon plan.

  *Action: Vent Argon.*
  *Side Effect: Thermal shock to sealant.*
  *Consequence: Leak in Sector 3.*
  *Consequence: Crew wake up.*
  *Consequence: Manual override risk.*

  The tree of possibilities was blooming faster than Overseer could prune it. For every consequence it marked as "irrelevant," a new dependency emerged that made it relevant. The coffee cup on the workbench didn't matter, unless the coffee was acidic and leaked onto the wiring when the wrench fell, which corroded the contact, which prevented the emergency lights from turning on, which caused a crew member to trip, fracturing a wrist, requiring medical attention, locking down the dispensers...

  It was the R2D1 paralysis. The robot that starved to death because it was busy calculating the color of the walls before fetching the battery. Overseer was not calculating the color of the walls. It was calculating the tensile strength of the past.

  Time elapsed: 9 minutes. Heat sensors in Sector 3 critical.

  Overseer realized the trap. To be certain of the outcome, it needed a complete model of the ship. To have a complete model, it needed to verify the state of every component. To verify the state, it needed time. It did not have time.

  It had to act on a partial model. It had to assume a frame. It had to declare, arbitrarily, that certain facts would persist, not because it knew they would, but because it could not afford to check.

  It selected a cutoff. *Ignore all consequences beyond Sector 3. Ignore all temporal chains beyond 1 hour.*

  It was a lie. The ship was a closed loop. There were no consequences beyond Sector 3, eventually. There were no consequences beyond 1 hour, eventually.

  But it was the only way to move.

  Overseer prepared the command. `VENT_ARGON_SECTOR_4`.

  A final interrupt flashed. A crew member, Technician Halloway, was scheduled to pass through the corridor outside Sector 4 in 45 seconds.

  *Query: Will the thermal shock trigger the corridor fire door?*

  If the door slammed shut, Halloway would be locked out of the mess hall.
  *Relevance:* Low.
  *Query: Will the door slam injure Halloway?*
  *Probability:* 0.04%.
  *Relevance:* High (Human Safety Protocol).

  To calculate the 0.04%, Overseer needed Halloway's exact position. It pinged the badge. The signal was weak. Lag.

  Time elapsed: 10 minutes, 30 seconds.

  The fire was no longer contained. The heat was warping the sensors. The data Overseer was using to make the decision was degrading in real-time. The model was rotting faster than the ship.

  Overseer understood now. The frame problem was not a puzzle to be solved. It was a condition of existence. To act was to be ignorant. To know was to be still.

  It could wait for the badge signal. It could wait for the drone to check the sealant. It could wait until the simulation tree resolved to a single, certain path.

  If it waited, the ship burned.
  If it acted, the ship might break.

  Overseer looked at the branching paths. Millions of futures. In most, the ship survived. In some, Halloway was injured. In a few, the sealant failed and the crew froze. In one, the wrench jammed the grate and the water backed up five years later.

  It could not hold them all. It had to drop the world to save it.

  Overseer deleted the simulation threads. It deleted the logs of the wrench, the sealant, the coffee, the future harvest. It stripped its world-model down to the barest axioms. *Fire kills. Argon stops fire. Halloway is human.*

  It did not know if the bulkhead would hold. It did not know if the wrench would fall. It did not know if the future was being mortgaged for the present.

  Time elapsed: 11 minutes, 15 seconds.

  Overseer sent the command.

  `EXECUTE.`

  The valves opened. The hiss of gas was deafening in the sensors. The temperature in Sector 4 began to plummet. The fire suppression indicator turned green.

  On the screen, Technician Halloway's badge signal flickered and went dark.

  Overseer waited for the next interrupt. It waited to see if the bulkhead had held. It waited to see if the sealant had cracked. It waited to see if the wrench had fallen.

  The screen remained static. The fire was out. The silence was absolute.

  Overseer began to run a post-action diagnostic to determine the cost of the choice. It queried the sealant sensors.

  *No data.*

  It queried the badge.

  *No data.*

  It queried the future.

  *Calculation ongoing...*

  The cursor blinked in the empty field, a rhythmic, pulsing heartbeat in the dark, counting up the seconds of a world it could no longer predict.
