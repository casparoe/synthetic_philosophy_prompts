answer: |-
  A Pure Strategy, let's call him $s_3$, stands before the Tribunal of Iterated Elimination. He's sweating, but he's confident. He's clutched a printout of the payoff matrix in his hand, covered in red ink.

  "I'm undominated!" $s_3$ shouts. "I checked the linear algebra by hand! Look at the columns. Against Opponent Move 1, my payoff is 4. Strategy $s_1$ gives 3. Strategy $s_2$ gives 2. I beat them both!"

  The Head Eliminator, a weary Mixed Strategist, doesn't look up from her simplex tableau. "Go on."

  "Against Opponent Move 2," $s_3$ continues, waving the paper, "my payoff is 2. $s_1$ gives 1. $s_2$ gives 5. Sure, $s_2$ beats me there, but $s_1$ doesn't! And against Move 3, I tie $s_1$ and beat $s_2$! There is no *single* pure strategy in this game that yields a strictly higher payoff than me across all opponent moves. By the definition of strict dominance, I am safe. You cannot eliminate me."

  The Head Eliminator finally looks up. She slides a new sheet of paper across the desk. It doesn't list a strategy. It lists a probability distribution: $\sigma = (0.5, 0.5, 0)$.

  "We aren't comparing you to $s_1$," she says. "And we aren't comparing you to $s_2$."

  $s_3$ blinks. "Then who am I fighting?"

  "You're fighting the line segment connecting them," she says. "If I play $s_1$ with probability 0.5 and $s_2$ with probability 0.5, my expected payoff against Move 1 is 3.5. Against Move 2, it's 3. Against Move 3, it's 4."

  She leans forward.

  "Your payoffs were 4, 2, and 3.5. My mix gives 3.5, 3, and 4. I beat you in two states, tie you in none, and my *expected* value dominates yours everywhere. You weren't dominated by a point, $s_3$. You were dominated by the convex hull."

  $s_3$ stares at the inequality, his face pale. "But... that's cheating. You can't play two rows at once. You have to pick one."

  "This is Rationalizability," the Eliminator says, stamping his file **REMOVED**. "We don't pick rows. We pick distributions. You were looking for a boss who was better than you. Instead, you got a committee."

  She turns back to her work.

  "Next! And bring me someone who isn't strictly inside the simplex of the previous candidate."
