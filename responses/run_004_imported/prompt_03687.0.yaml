answer: |-
  This is one of the most fascinating and poignant connections in the history of philosophy, and your intuition is spot-on: **it is absolutely not a random hobby.** In fact, many modern Sidgwick scholars (like Bart Schultz and Roger Crisp) argue that you cannot fully understand the emotional and philosophical weight of *The Methods of Ethics* without understanding his psychical research.

  The short answer is: Sidgwick turned to ghosts and telepathy because he was desperate to find empirical evidence for the one thing his philosophy needed to work but couldn't prove: **a moral government of the universe.**

  Here is a breakdown of the link between the Society for Psychical Research (SPR) and the Dualism of Practical Reason, what the failure of that research implies, and how you should handle it in your term paper.

  ### 1. The Philosophical Problem: Why the Dualism Needs "Ghosts"

  To understand the link, we have to look closely at why the "Dualism of Practical Reason" is so devastating for Sidgwick.

  *   **The Conflict:** Sidgwick argues that both **Rational Egoism** (maximize your own happiness) and **Rational Utilitarianism** (maximize universal happiness) are self-evident axioms of reason.
  *   **The Crisis:** In this life, these two often conflict. Being moral might cost you your happiness, health, or life. If reason commands you to do X (be moral) and also commands you to do Y (look out for yourself), and you can't do both, then **Reason is contradictory.**
  *   **The Stakes:** For Sidgwick, if Reason is contradictory, the "rationality of ethics" collapses. Ethics becomes a matter of preference or sentiment, not rational obligation.
  *   **The Traditional Solution:** Kant and the theological utilitarians solved this by postulating **God and Immortality.** If you survive death and there is a God who rewards virtue and punishes vice, then self-interest and duty *eventually* align. Your sacrifice now is repaid in eternity.
  *   **Sidgwick's Block:** Sidgwick was an empiricist and a skeptic. He couldn't just *assume* God exists (like Kant) because that wasn't scientifically rigorous. He needed **evidence.**

  **Enter the SPR:** Sidgwick didn't join the SPR to chase spooky thrills. He joined it to find **empirical data** that could serve as the missing premise for his ethics.
  *   **Survival of Death:** If he could prove via mediumship or telepathy that consciousness survives bodily death, the "long-term self-interest" calculation changes.
  *   **Moral Governance:** If he could find evidence that the universe is structured such that moral actions yield positive psychic consequences, the harmony between Egoism and Utilitarianism is restored.

  In short: **Psychical research was the laboratory where Sidgwick hoped to empirically verify the postulates required to save ethics from irrationality.**

  ### 2. The Tragedy of the Negative Result

  You asked if the fact that his research turned up nothing conclusive is tragic for his ethical project. The answer is a profound **yes.**

  Sidgwick investigated the SPR for nearly 20 years. He interviewed mediums, analyzed crop circles (before they were called that), and tested telepathy. He remained cautiously open to the possibility until his death, but he never found the "smoking gun."

  *   **The Philosophical Implication:** Without empirical proof of an afterlife or moral governance, the Dualism of Practical Reason remains **unresolved.** Sidgwick dies with the admission that we cannot know if it is rational to be moral if morality conflicts with self-interest.
  *   **The "Esoteric" Morality:** This anxiety led Sidgwick to a controversial conclusion in *The Methods*: the possibility of "esoteric morality." If the masses need religious belief to align their self-interest with duty (because they fear hell), but the philosophical elite know there is no proof of hell... should the elite lie to the masses to keep them moral? Sidgwick seriously entertained this, largely because the Dualism left him without a rational way to motivate morality without sanctions.

  This is the tragedy: Sidgwick wanted ethics to be as rigorous as science. He went to science (psychical research) to save ethics. Science gave him no answer. He was left with a system that says, "You ought to be utilitarian, but reason cannot prove why you shouldn't be an egoist if you can get away with it."

  ### 3. How This Affects Your Term Paper

  This is the crucial part for your grade. Does this biographical/philosophical drama mean you should toss out Sidgwick's utilitarianism? **No.** But it does change *how* you critique or defend it.

  Here are three angles you can take in your paper:

  #### A. The "Modern Secular" Defense (Separating Normative from Meta-Ethical)
  You can argue that Sidgwick's anxiety about the Dualism is a **meta-ethical** problem, not a **normative** one.
  *   **Argument:** Even if we can't prove it is *rationally self-interested* to be moral, Utilitarianism still provides the best framework for *what* is moral.
  *   **Move:** Modern utilitarians (like Peter Singer or J.J.C. Smart) often ditch Sidgwick's requirement for a cosmic sanction. They argue that the "rationality" of morality doesn't depend on self-interest. Morality *overrides* self-interest by definition.
  *   **Verdict:** Sidgwick's utilitarianism survives, but his specific demand for a harmony with egoism is an outdated relic of his Victorian need for cosmic order.

  #### B. The "Psychological" Critique (Attacking the Egoism Side)
  Sidgwick assumes Rational Egoism is a valid, self-evident method. You can critique this.
  *   **Argument:** Is it actually rational to be a pure egoist? Sidgwick's psychical research shows how desperate he was to validate Egoism as a rival to Utilitarianism.
  *   **Move:** If you argue that Egoism isn't actually a coherent rational method (perhaps because the "self" is less distinct than Sidgwick thought, or because humans are socially constituted), the Dualism disappears. You don't need ghosts to solve the Dualism if one of the twins isn't real.
  *   **Verdict:** This uses Sidgwick's anxiety to show a weakness in his setup, not necessarily in Utilitarianism itself.

  #### C. The "Integrity" Critique (The Tragic Reading)
  If you want to write a more historical or critical paper, you can argue that Sidgwick's failure reveals a flaw in the Utilitarian project itself.
  *   **Argument:** Sidgwick's need for psychical research shows that Utilitarianism is too demanding for human psychology without external sanctions.
  *   **Move:** If a philosopher as brilliant as Sidgwick had to hunt for ghosts to make Utilitarianism "stick," maybe the theory demands too much sacrifice from human agents. It suggests Utilitarianism is inherently unstable without religious or metaphysical crutches.
  *   **Verdict:** This is a strong critique of the *motivational* viability of Sidgwick's system.

  ### 4. Summary for Your Paper Strategy

  *   **Don't treat it as a footnote:** Acknowledging the SPR connection shows you understand the *depth* of Sidgwick's commitment to rationality. It makes you look like you've engaged with the text deeply.
  *   **Don't let it invalidate the theory:** You can say, "While Sidgwick felt the Dualism threatened the rationality of ethics, contemporary utilitarians argue that moral reasons are categorical, not dependent on self-interest."
  *   **Key Scholar to Cite:** If you want to impress your professor, look up **Bart Schultz's** biography, *Henry Sidgwick: Eye of the Universe*. He argues extensively that Sidgwick's life and philosophy were a unified project to find light in a darkening universe. Also, **J.B. Schneewind's** *Sidgwick's Ethics and Victorian Moral Philosophy* is the standard text on this.

  **The Bottom Line:** Sidgwick's psychical research was a Hail Mary pass to save the rationality of ethics. He dropped the pass. But the game (Utilitarianism) is still being played today, just with different rules about what "rationality" requires. Your paper should focus on whether those new rules hold up, using Sidgwick's struggle as the historical context for *why* the question matters.
