answer: |-
  **Title:** The Event Horizon of Computation: Logic, Physics, and the Kerr Loophole

  **The Core Confusion**
  Your writers group is suffering from a category error that is rampant even among physicists: they are conflating the *Mathematical Church-Turing Thesis* with the *Physical Church-Turing Thesis*. To determine whether your protagonist's device is "cheating," we must separate what is logically impossible from what is physically contingent.

  **Position 1: The Mathematical Wall (Gandy and the Theorem)**
  The first position you encountered—that the Church-Turing Thesis (CTT) is a theorem in disguise—refers to the *Mathematical* CTT. This states that any function effectively calculable by a human following an algorithm is computable by a Turing Machine. Alan Turing proved that no Turing Machine can solve the Halting Problem. This is a logical truth, as immutable as $2+2=4$. No device, magical or physical, can make a Turing Machine do the impossible.

  Robin Gandy extended this by arguing that if the universe obeys certain physical constraints (bounded signal speed, finite information density per volume), then *physical* systems are limited to Turing-computability. Your beta readers are leaning on this: if Gandy is right, your black hole device is impossible.

  *The Flaw:* Gandy's derivation relies on specific assumptions about spacetime structure—specifically, that causal influences are bounded and information density remains finite. A Malament-Hogarth (MH) spacetime, such as the interior of a maximally extended Kerr black hole, explicitly violates these assumptions. At the Cauchy horizon (where your protagonist receives the signal), an infinite amount of external time is compressed into a finite proper time, resulting in infinite blueshift and theoretically infinite energy density. Gandy's theorem does not apply here because the premises of his theorem (finite density/boundedness) are broken by the geometry of the black hole. Therefore, the Mathematical CTT remains intact (Turing Machines still can't do it), but Gandy's physical derivation does not forbid the black hole from acting as an *oracle*.

  **Position 2: The Empirical Claim (The Falsifiable Universe)**
  The second position treats the *Physical* CTT as an empirical hypothesis: "Every physical process in this universe can be simulated by a Turing Machine." This is not a logical truth; it is a claim about the specific architecture of our cosmos, akin to the claim that "no massive particle can exceed $c$."

  In the philosophy of physics, MH spacetimes are not considered "magic"; they are exact solutions to the Einstein Field Equations. Philosophers like John Earman and physicists like David Malament have explicitly used MH spacetimes to argue that the Physical CTT is *contingent*. If our universe contains stable Kerr black holes, the Physical CTT is false.

  *The Weight:* This position is the strongest scientifically. It acknowledges that logic (Position 1) cannot dictate physics. If the geometry exists, the computation is possible. However, this position opens the door to the real objection: while the *geometry* is a valid solution, the *stability* of that geometry is debated.

  **Position 3: The Semantic Shift (Hypercomputation)**
  The third position argues that "computation" is a human-centric concept. If a black hole solves the Halting Problem, we haven't broken the CTT; we've just changed the definition of the machine. In computability theory, a Turing Machine equipped with an "oracle" that can answer undecidable questions is called a *Hypercomputer*.

  *The Weight:* This is philosophically safe but narratively weak. It suggests your protagonist isn't "computing" but "querying nature." While semantically precise, it doesn't answer whether the setup is coherent. It merely says, "If it works, we'll call it something else."

  **The Verdict: Wildly Improbable, Not Incoherent**
  Here is the landing spot for your novel. Your device is **not impossible in principle**, nor is it a **meaningless violation**. It falls squarely into the category of **wildly improbable but not incoherent.**

  Here is the precise distinction you need to arm yourself with against your writers group:

  1.  **Logic is Safe:** Your protagonist is not building a Turing Machine that solves the Halting Problem. She is building a *physical apparatus* that uses general relativity to bypass the constraints of a Turing Machine. She is not contradicting Turing's proof; she is circumventing its hardware requirements. This is not cheating; it is engineering.
  2.  **Physical CTT is Violated:** If her device works, the *Physical* Church-Turing Thesis is falsified. This is a meaningful scientific result, not a semantic trick. It would mean our universe allows hypercomputation.
  3.  **The Real Objection is Stability, Not Logic:** The actual "hard SF" snag is not the Church-Turing Thesis; it is **Mass Inflation**. Current astrophysical models suggest that the infinite blueshift at the Cauchy horizon would cause energy density to diverge, creating a singularity that destroys the MH region before the signal can be received. The geometry exists on paper, but quantum effects or perturbations might "seal" the loophole.

  **Recommendation**
  Your beta readers are right to be skeptical, but for the wrong reason. They think you are breaking logic. You are not. You are betting on a specific, controversial interpretation of General Relativity where the Cauchy horizon remains traversable despite instability.

  To silence the "cheating" accusation, have your protagonist acknowledge the distinction. She isn't claiming to have disproven Turing. She is claiming that the universe is not a Turing Machine. The tension in your third act shouldn't be "Will the math work?" (it does); it should be "Will the horizon survive the blueshift long enough for the data to arrive?"

  **Final Classification:** **Wildly improbable but not incoherent.** The setup is physically consistent within classical General Relativity, contingent on the stability of the Kerr metric's interior. It violates the *Physical* Church-Turing Thesis, which is an empirical claim, not a logical law. Proceed, but mind the mass inflation.
