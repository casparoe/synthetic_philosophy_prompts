answer: |-
  You have excellent instincts here. Your suspicion is well-founded, and you have put your finger on the exact pressure point where supervaluationism strains against the claim of preserving "classical logic."

  Your friend is half-right, but she is glossing over a significant semantic cost. She is correct that supervaluationism validates the *law of excluded middle* (LEM) as a theorem, but she is misleading you if she implies that the *semantics* remain classical or that bivalence is preserved.

  Here is the breakdown of who is right about what, and where the "sleight of hand" lies.

  ### 1. The Mechanism: How Supervaluationism Saves LEM
  Your friend is referencing a specific technical framework (often associated with Richmond Thomason and Bas van Fraassen). In branching-time semantics:
  *   There is the actual present moment.
  *   From this moment, multiple possible histories (futures) branch out.
  *   A statement like "There will be a sea battle tomorrow" ($p$) is true on some histories and false on others. Therefore, relative to the present moment, it is **indeterminate**.
  *   However, on *any given history*, classical logic holds. On history $H_1$, either $p$ is true or $\neg p$ is true. On history $H_2$, either $p$ is true or $\neg p$ is true.
  *   **Supervaluation:** A statement is **supertrue** if it is true on *all* acceptable histories.
  *   Since $p \lor \neg p$ is true on every single history (because classical logic holds within a history), $p \lor \neg p$ is **supertrue**.

  So, your friend is right that the disjunction comes out true. This allows the supervaluationist to say, "Yes, either there will be a battle or there won't," without committing to "It is *already settled* which one it is." This blocks the fatalist argument, which relies on the claim that one disjunct must be *determinately* true now.

  ### 2. Where You Are Right: The Death of Truth-Functionality
  Your objection is this: *If neither disjunct is true, how can the disjunction be true?*

  In **classical logic**, truth is **truth-functional**. The truth value of a compound sentence is determined strictly by the truth values of its parts.
  *   Classical Rule: $v(A \lor B) = \text{True}$ **if and only if** $v(A) = \text{True}$ or $v(B) = \text{True}$.

  Supervaluationism explicitly **abandons truth-functionality**.
  *   Supervaluationist Rule: $SV(A \lor B) = \text{True}$ even if $SV(A) = \text{Indeterminate}$ and $SV(B) = \text{Indeterminate}$.

  This is the "sleight of hand" you sensed. Your friend claims to keep classical logic "fully intact," but she has replaced the classical truth-conditional semantics with a non-classical one. She is preserving the *theorems* of classical logic (the tautologies) while sacrificing the *semantics* that usually justify them.

  ### 3. Bivalence vs. Excluded Middle
  The core of your disagreement likely stems from conflating (as many do) the **Law of Excluded Middle** with the **Principle of Bivalence**.
  *   **Bivalence:** Every proposition is either True or False. (Supervaluationism **rejects** this).
  *   **Excluded Middle:** The proposition $(p \lor \neg p)$ is always True. (Supervaluationism **accepts** this).

  Your friend is arguing that she has preserved Excluded Middle. You are arguing that without Bivalence, Excluded Middle is hollow. Philosophically, you are in good company. Many critics (like Timothy Williamson) argue that if a disjunction is true but neither disjunct is true, the meaning of "or" has shifted so significantly that we are no longer speaking classical logic.

  ### 4. The Inference Cost (The Smoking Gun)
  If your friend insists classical logic is "fully intact," ask her about **inference rules**. Supervaluationism validates all classical tautologies, but it **invalidates certain classical inference rules.**

  The most famous casualty is the rule of **Disjunction Elimination** (or reasoning from validity):
  *   In classical logic: If $\models A \lor B$, then $\models A$ or $\models B$.
  *   In supervaluationism: $\models p \lor \neg p$ is valid, but neither $\models p$ nor $\models \neg p$ is valid.

  Furthermore, **Contraposition** can fail in some supervaluationist systems, and the deduction theorem requires careful handling. If a system invalidates standard inference rules, claiming it is "classical logic" is a significant stretch. It is more accurate to call it "a non-classical logic that validates classical tautologies."

  ### 5. Verdict
  You are not missing a distinction; you are seeing the cost of the solution clearly.

  *   **Is your friend wrong?** She is wrong to say classical logic is *fully* intact. She is preserving the *validities* (theorems) but not the *semantics* or the *inference rules*.
  *   **Is it sleight of hand?** It feels like it because it allows one to have one's cake (LEM is true, so we sound rational) and eat it too (Bivalence is false, so fatalism is blocked). But it is a recognized, formal trade-off, not necessarily a deception.
  *   **The Fatalism Block:** She is right that this blocks fatalism effectively. The fatalist argues: "Since '$p \lor \neg p$' is true, one of them must be *necessarily* true." The supervaluationist replies: "'$p \lor \neg p$' is true, but neither $p$ nor $\neg p$ is *settled* true."

  **How to reply to her:**
  Tell her you concede that supervaluationism validates the *theorem* of Excluded Middle, but point out that it does so by abandoning **truth-functionality**. Ask her: "If the truth of a disjunction no longer depends on the truth of its disjuncts, in what sense is the meaning of 'or' still classical?"

  She is trading the Principle of Bivalence for the Law of Excluded Middle. That is a legitimate philosophical move, but it is not "preserving classical logic fully intact." It is revising the semantics of truth to save the theorems. You were right to smell a rat.
