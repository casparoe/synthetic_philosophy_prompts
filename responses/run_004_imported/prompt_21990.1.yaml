prompt: |-
  A friend and I got into a long argument last night about Aristotle's sea-battle passage and what it does or doesn't show about fatalism. She defended the standard supervaluationist treatment of future contingents — the Thomason-style semantics built on branching time — as the way to block the fatalist argument in De Interpretatione 9 while keeping classical logic fully intact. That struck me as sleight of hand: if "there will be a sea battle tomorrow" is neither true nor false today, then the disjunction "there will be a sea battle tomorrow, or there will not be" can't be true either, so excluded middle has quietly been abandoned, whatever the supervaluationist chooses to call it. Is my friend just wrong to insist she's preserved classical logic here, or is she trading on some distinction I'm missing that would let the disjunction come out true even though neither disjunct is?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Topic:** Aristotle's Sea Battle argument (De Interpretatione 9), fatalism, future contingents.
      *   **The Friend's Position:** Defends the standard supervaluationist treatment (Thomason-style semantics on branching time). Claims this blocks fatalism *while keeping classical logic fully intact*.
      *   **The User's Objection:** If $p$ ("there will be a sea battle") is neither true nor false, then $p \lor \neg p$ shouldn't be true either. Therefore, Excluded Middle (LEM) is abandoned, regardless of what supervaluationists call it. The user suspects "sleight of hand."
      *   **The Question:** Is the friend wrong about preserving classical logic, or is there a distinction the user is missing that allows the disjunction to be true while disjuncts are not?

  2.  **Deconstruct the Philosophical/Logical Issues:**
      *   **Aristotle's Problem:** If statements about the future are already true or false, then the future is fixed (fatalism). Aristotle seems to suggest denying bivalence for future contingents.
      *   **The Fatalist Argument:** Relies on Bivalence (every proposition is T or F) + Transfer of Necessity (if $p$ is true, it's necessarily true).
      *   **Supervaluationism (van Fraassen/Thomason):**
          *   Context: Branching time (many possible futures).
          *   Truth definition: A sentence is *supertrue* if it is true on *all* acceptable completions (histories/branches). It is *superfalse* if false on all. It is *indeterminate* if true on some, false on others.
          *   Key Feature: $p$ might be indeterminate (true on some branches, false on others). $\neg p$ is also indeterminate.
          *   Crucial Feature: $p \lor \neg p$ is true on *every* branch (because classical logic holds *within* each branch/history). Therefore, $p \lor \neg p$ is *supertrue*.
      *   **The User's Intuition:** Classical logic requires that if $A \lor B$ is true, at least one of $A$ or $B$ must be true (Disjunction Property, or just standard truth-functional semantics). If neither disjunct has a truth value, how can the disjunction?
      *   **The Friend's Claim:** "Classical logic fully intact."
      *   **The Conflict:** Supervaluationism validates all classical *tautologies* (like LEM), but it invalidates some classical *inference rules* (like Disjunction Introduction in reverse, or reasoning from $\Gamma \models A \lor B$ to $\Gamma \models A$ or $\Gamma \models B$).

  3.  **Evaluate the "Classical Logic" Claim:**
      *   *Validities:* Supervaluationism preserves all classical tautologies. $p \lor \neg p$ comes out valid (supertrue). So, in terms of *theoremhood*, it looks classical.
      *   *Semantics:* It is *not* truth-functional. The truth value of a compound is not determined solely by the truth values of the parts (since "indeterminate" $\lor$ "indeterminate" = "true").
      *   *Inference Rules:* It fails certain classical rules. Specifically, the rule of Disjunction Elimination or reasoning from validity of a disjunction to the validity of a disjunct. Also, contraposition can fail in some formulations.
      *   *Bivalence:* It explicitly rejects Bivalence (not every sentence is T or F).
      *   *Excluded Middle:* It validates LEM ($p \lor \neg p$) as a theorem, but not as a semantic principle of Bivalence.

  4.  **Formulate the Answer:**
      *   **Acknowledge the User's Insight:** The user is sharp. Their intuition about truth-functionality is correct. Supervaluationism *does* break the link between the truth of a disjunction and the truth of its disjuncts.
      *   **Validate the Friend's Point (Partially):** The friend is right that $p \lor \neg p$ comes out true (supertrue). This blocks the fatalist who says "One of them must be *determinately* true."
      *   **Identify the "Sleight of Hand":** The friend is conflating "Validating Classical Tautologies" with "Preserving Classical Logic/Semantics."
      *   **Key Distinction:** Truth vs. Supertruth. Bivalence vs. Excluded Middle.
      *   **The Technical Catch:** Supervaluationism is *non-truth-functional*. In classical logic, $v(A \lor B) = 1$ iff $v(A)=1$ or $v(B)=1$. In supervaluationism, $SV(A \lor B) = 1$ even if $SV(A) \neq 1$ and $SV(B) \neq 1$.
      *   **Inference Rules:** Mention that while tautologies hold, inference rules like Disjunction Introduction (from $A$ infer $A \lor B$) hold, but the reverse doesn't. More importantly, the rule "If $\models A \lor B$, then $\models A$ or $\models B$" (Disjunction Property for validity) fails.
      *   **Conclusion:** The user is right to be suspicious. The friend is technically wrong to say classical logic is *fully* intact. It's "classical logic plus a non-classical semantics." The cost is giving up truth-functionality and bivalence, even if LEM is preserved as a validity.

  5.  **Refine the Tone:**
      *   Respectful to both parties.
      *   Philosophically precise (distinguish Bivalence from LEM).
      *   Clear on the Thomason/Supervaluationist mechanics.
      *   Address the specific charge of "sleight of hand."

  6.  **Drafting the Content (Iterative refinement):**
