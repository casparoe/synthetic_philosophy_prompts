          *   *Absolute Discernibility:* Different monadic properties.
          *   *Relative Discernibility:* One has a relation to the other that it doesn't have to itself (but the other doesn't have that relation to the first? No, that's asymmetric).
          *   *Weak Discernibility:* $x$ and $y$ stand in an irreflexive relation $R$ (i.e., $\neg R(x,x)$ and $\neg R(y,y)$, but $R(x,y)$).
          *   *Claim:* If $R(x,y)$ holds and $R$ is irreflexive, then $x \neq y$ is a logical truth. Therefore, they are discernible *by* the relation.
