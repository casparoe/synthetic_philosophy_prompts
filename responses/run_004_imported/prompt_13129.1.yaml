          *   (3) Jake: My claim stands regardless of who says it.
          *   (4) Mia: It's about selective moralizing/cudgeling, not truth.
          *   (5) Jake: That implies only carbon-neutral people can criticize, which is absurd.
          *   (6) Mia: No, it's about arbitrary self-exemption (necessary vs. frivolous).
      *   **The Task:**
