      *   **Thesis:** Patched Reflection is not a fundamental norm. It is a **derivative theorem** that holds only under conditions of **Evidential Transparency**. Since ideal rationality does not require Transparency, Reflection is not a requirement of ideal rationality.
      *   **The Example:** "The Unforeseen Defeater."
