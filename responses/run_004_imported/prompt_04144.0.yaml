answer: |-
  The packing boxes were stacked like beige monoliths in the living room, sealing away the life Martha thought they were building. Simon stood by the window, not looking at her, looking instead at the rain slashing against the glass. He wasn't packing. He was waiting.

  "You're just leaving," Martha said. The words were heavy, weighted with the machinery of the moral system: obligation, contract, betrayal. She expected them to land, to bruise him. "After five years? You don't even have a reason that isn't a cliché."

  Simon turned. He smiled, and it was a terrifyingly bright thing, devoid of malice but also devoid of apology. "I don't have a reason, Martha. I have a direction."

  "That's selfishness. That's cruelty." She was ticking off items on a ledger of blame, expecting him to flinch, to offer the currency of guilt. "You're destroying everything."

  "No," Simon said, and his voice dropped an octave, resonating in the cheap drywall of the apartment. "I am completing a movement."

  Here, the realism of the scene should have fractured. In a normal story, this is where he would stammer, or she would scream, or the awkward silence of a modern breakup would suffocate them both. But the air in the room grew thick, charged with a voltage that had nothing to do with the storm outside. The light from the streetlamp below didn't just illuminate Simon; it seemed to emanate from him, a golden, impossible halo that cast no shadow.

  Martha opened her mouth to speak, to deploy the ultimate weapon of *ought*, but the words dissolved. Simon was no longer just a man in a grey sweater. He was a principle of motion. To ask him to stay was to ask a river to flow uphill; it wasn't that he wouldn't, it was that the category of 'staying' did not apply to his substance.

  He walked toward the door, and the floorboards did not creak. They sang. A low, thrumming chord vibrated through the soles of Martha's feet, a bass line underscoring his stride. The packing tape on the boxes shimmered like silver ribbon. The implausibility of it was absolute. Why was the light bending around his shoulders? Why did the rain outside seem to pause in mid-air, suspended like diamonds, waiting for his exit?

  "Simon," she whispered, but the name was too small, a pedestrian label for a phenomenon.

  He stopped at the threshold. The hallway beyond was dark, but behind him, the room was ablaze with an interior luminosity. He looked at her, and his eyes were not windows to a soul but mirrors reflecting her own desperate need for a narrative where he was the villain. If he were the villain, she would be the victim, and the world would make sense. But he wasn't a villain. He was a force.

  "You think this is about pain," Simon said. The voice was no longer human speech; it was a recitative, soaring over the orchestra of the thunder outside. "You think I am inflicting a wound. But I am merely revealing the edge of the map. There is nothing here for me, Martha. Not because it is bad. Because it is *finished*."

  He reached for the doorknob. The metal groaned, not in rust, but in anticipation.

  "You'll regret this," she said, but the threat was hollow, a paper dart thrown at a tank. Regret implies a past that holds weight. Simon lived entirely in the immediate pressure of the now, the next note, the next breath. The morality system requires time to calcify actions into judgments. Simon moved too fast for the cement to set.

  "Regret is for those who look back," he said.

  He opened the door. The wind rushed in, but it didn't mess up the papers on the table. It parted around him. He stepped into the hallway, and for a second, he didn't walk away; he faded out, like a singer holding a high note until the sound becomes pure frequency, invisible and everywhere. Then, the door clicked shut.

  The light vanished. The room returned to its dull, beige reality. The rain resumed its normal, chaotic fall. Martha stood alone amidst the boxes, holding a blame that had nowhere to land, suspended in the silence of a system that had just failed to compute the thing that walked out of it.
