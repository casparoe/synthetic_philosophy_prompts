answer: |-
  This is a sharp observation, and you have put your finger on the single most debated technical issue in accuracy-first epistemology (AFE). You are right to feel that if the argument for Probabilism hinges entirely on picking the Brier score because it makes the math work, the project is circular.

  However, the literature has evolved significantly since Joyce's 1998 paper to address exactly this "arbitrariness worry." Here is how defenders try to plug the leak, followed by my honest assessment of whether the hull holds water.

  ### The Defense: Narrowing the Admissible Class

  The core response from Joyce, Pettigrew, Easwaran, and others is that we do not need to justify the **Brier score specifically**. We only need to justify a **class of scoring rules**. If *every* scoring rule in that class condemns incoherent credences, then the result is robust, even if we can't pinpoint the One True Score.

  To define this class, they impose constraints on what counts as a legitimate measure of "accuracy." If a scoring rule violates these constraints, it is argued to be conceptually incoherent as a measure of *epistemic* value.

  #### 1. Strict Propriety (The Big One)
  This is the heavy lifter. A scoring rule is **proper** if, when you have a credence $p$, your expected accuracy is maximized by reporting $p$. It is **strictly proper** if reporting $p$ is the *unique* maximizer.
  *   **The Argument:** If a scoring rule is not strictly proper, it incentivizes you to misreport your credence to get a better "accuracy score." But epistemology is about aiming at the truth. If your measure of accuracy tells you that you are doing "better" by stating a credence different from what you actually believe, it is not measuring *epistemic* accuracy; it is measuring something else (like pragmatic utility).
  *   **The Result:** Joyce (2009) and Pettigrew (2016) showed that for **any** continuous, strictly proper scoring rule, incoherent credence functions are accuracy-dominated by coherent ones. You don't need Brier; you just need *propriety*.

  #### 2. Extensionality (Truth-Directedness)
  The accuracy of a credence in a proposition $X$ should depend only on the truth value of $X$ (True/False) and the credence assigned. It shouldn't depend on irrelevant facts (e.g., the day of the week, or the truth value of an unrelated proposition $Y$).
  *   **The Argument:** If a scoring rule violates extensionality, it's not measuring the fit between mind and world; it's measuring the fit between mind and world-plus-noise.

  #### 3. Continuity and Convexity
  *   **Continuity:** Small changes in credence should not result in discontinuous jumps in accuracy score.
  *   **Convexity:** This is mathematically linked to strict propriety. It ensures that the "penalty" for being wrong increases as you move away from the truth value.
  *   **The Argument:** These are argued to be minimal conditions for a metric of "distance from the truth." If accuracy isn't continuous, it's hard to see how it guides gradual belief revision.

  **The Synthesis:** The defender says: "We aren't rigging the game by picking Brier. We are defining the rules of the game by analyzing the concept of 'accuracy.' Any rule that deserves the name 'accuracy' must be strictly proper and continuous. And *all* such rules yield Probabilism."

  ### The Counter-Attack: Why the Worry Persists

  Despite these defenses, critics (like Hannes Leitgeb, Brian Hedden, and some skeptics on LW) argue the arbitrariness worry isn't fully resolved.

  **1. The "Why Propriety?" Regress**
  Why must epistemic utility be strictly proper?
  *   **Pragmatic Vindication:** Often, propriety is justified because proper scoring rules align with betting behavior (avoiding Dutch Books). But if you need pragmatic arguments (betting) to justify the scoring rule, which is then used to justify Probabilism non-pragmatically, haven't you just hidden the pragmatic argument inside the math?
  *   **Purely Epistemic:** If you try to justify propriety purely epistemically, you risk circularity: "Accuracy is what proper scores measure" vs "Proper scores measure accuracy."

  **2. The Weighting Problem**
  Even if we agree on a strictly proper rule for a *single* proposition, how do we aggregate accuracy across a whole belief system?
  *   If I have beliefs about $A$, $B$, and $C$, is my total accuracy the sum of their individual Brier scores?
  *   If I weight $A$ twice as heavily as $B$, does that change the dominance result? (Generally, no, as long as weights are positive).
  *   But what if the "importance" of a proposition depends on its truth value? (e.g., Being right about "There is a tiger" is more important if there *is* a tiger). Some scoring rules that capture this "verisimilitude" intuition violate strict propriety or extensionality. If those rules are legitimate, the dominance argument might fail.

  **3. The "Tautology" Risk**
  Leitgeb has argued that the class of strictly proper scoring rules is essentially defined *to make Probabilism come out true.* If we define "epistemic utility" as "that which is maximized by coherent credences," then proving coherent credences maximize epistemic utility is trivial. The work is being done by the definition, not the discovery.

  ### My Honest Read

  Here is the bottom line on whether Probabilism survives and whether this is a fatal crack in AFE.

  **1. Probabilism is Safe (But not because of AFE alone)**
  Probabilism is one of the most robust results in formal epistemology. It is supported by a "trinity" of arguments:
  *   **Dutch Book:** Incoherence leads to guaranteed pragmatic loss.
  *   **Representation Theorems:** Incoherence implies preference violations.
  *   **Accuracy Dominance:** Incoherence implies guaranteed epistemic loss.

  Even if the Accuracy argument were to collapse entirely due to scoring rule arbitrariness, Probabilism would not fall. The Dutch Book argument is immune to scoring rule choices (it relies on logic and betting, not metrics of distance). So, the *conclusion* (Probabilism) survives.

  **2. Accuracy-First Epistemology is Weakened, Not Destroyed**
  The ambition of AFE was to provide a **unified, purely epistemic foundation** for Bayesian norms, replacing the "pragmatic" Dutch Book arguments with something "purer" (truth-approximation).
  *   **The Crack:** The reliance on strictly proper scoring rules reveals that "accuracy" is not a pre-theoretical intuition we can measure like height. It is a theoretical construct. To make the math work, we have to build normative assumptions (like Propriety) into the definition of accuracy.
  *   **The Consequence:** This means AFE is not as "foundational" as Joyce originally hoped. It cannot stand entirely alone. It leans on the same normative intuitions as the Dutch Book argument (essentially, that you shouldn't hold beliefs that undermine their own goals).

  **3. The "Rigged" Feeling is Partially Correct**
  You are right to sense that the conclusion is smuggled in, but "smuggled" implies deception. A better term is **"explication."**
  *   Proponents argue they aren't smuggling the conclusion; they are explicating the concept of accuracy. They claim that *if* you care about accuracy in the way epistemologists do (aiming at truth, avoiding error, being honest about uncertainty), you *must* accept a strictly proper rule.
  *   However, if you reject that explication (e.g., "I care about accuracy, but I think being confidently wrong about important things is worse than being unsure about trivial things, even if that violates propriety"), the argument loses its grip.

  ### Verdict

  **Is it a bigger crack than defenders let on?**
  Yes. Defenders often speak as if the dominance theorem is a geometric necessity (like proving triangles have 180 degrees). It is not. It is a normative result that depends on accepting specific constraints on how we value truth.

  **Does Probabilism survive?**
  Absolutely. The scoring rule sensitivity shows that **Accuracy is not the sole fundamental norm.** It suggests a pluralistic foundation: Probabilism is true because it satisfies *both* pragmatic coherence (Dutch Book) and epistemic coherence (Accuracy), provided we accept standard explications of those terms.

  **Advice for your rabbit hole:**
  If you want to dig deeper, look at **Richard Pettigrew's *Choosing for the Sake of Accuracy* (2016)**. He attempts to axiomatize the scoring rules to show they aren't arbitrary. Then, read **Hannes Leitgeb's "The Stability of Belief"** papers for the strongest critique of why accuracy measures might be the wrong tool for the job entirely.

  The tension you found is the live wire of the field right now. It hasn't killed the project, but it has forced it to mature from "Look, I proved Bayesianism!" to "Here is the specific normative structure required to make Bayesianism plausible."
