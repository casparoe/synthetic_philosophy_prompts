answer: |-
  This is an exceptionally rich and pedagogically valuable comparison. It cuts to the heart of meta-philosophical questions regarding the autonomy of reason, the situatedness of the thinker, and the boundaries between the genetic fallacy and philosophical archaeology.

  For a graduate seminar, you want to move students beyond the simple intuition that "logic is objective, ontology is subjective." That distinction is too crude. Instead, I suggest framing the asymmetry around three specific axes: **The Locus of Normativity**, **Conceptual Entanglement**, and **The Status of the Subject**.

  Here is a breakdown of the principled bases for the asymmetry, followed by the counter-arguments, and finally a recommendation for how to frame this in your seminar.

  ---

  ### I. The Principled Basis for Asymmetry

  There *is* a principled basis for treating the two cases differently, but it relies on the internal architecture of their respective systems rather than merely disciplinary turf wars.

  #### 1. The Locus of Normativity (Laws of Truth vs. Structures of Existence)
  *   **Frege:** Frege's project is fundamentally about the **laws of truth**. In "Thought" (1918), he posits a "third realm" of sense that is objective, timeless, and independent of the mental acts of any particular subject. The validity of the *Begriffsschrift* does not depend on the psychological or moral state of the user. If the law of non-contradiction holds, it holds for an anti-Semite, a democrat, or a Martian. The normativity is external to the human subject; the human subject must conform to the logic, not vice versa. Therefore, Frege's personal failings are categorially distinct from the validity conditions of his system.
  *   **Heidegger:** Heidegger's project in *Being and Time* is an analysis of **Dasein** (human existence). The normativity here is internal to the existence of the subject. Concepts like *authenticity* (Eigentlichkeit), *resoluteness*, and *historicity* are not timeless logical laws but modes of being. If the analysis of "historicity" presupposes a specific kind of collective destiny (*Volk*), and that concept is infused with exclusionary nationalism, the philosophical description is contaminated *at the level of description*. You cannot separate the "structure of existence" from the "existence of the structurer" as easily as you can separate "laws of logic" from the "logician."

  #### 2. Conceptual Entanglement (Extralogical vs. Ontologized Politics)
  *   **Frege:** Frege's anti-Semitism and authoritarianism appear in his diary as **extralogical commitments**. There is no theorem in the *Grundgesetze* that requires the inferiority of Jews for its proof. The political views are adjacent to the philosophy, not constitutive of it. One can excise the diary entries without creating a gap in the derivation of arithmetic from logic.
  *   **Heidegger:** In the *Black Notebooks* and the Rectoral Address, political concepts are **ontologized**. "The People" (*Volk*) is not just a sociological category for Heidegger; it is a site where Being discloses itself. "World Jewry" is critiqued not merely politically but metaphysically (as an agent of calculative thinking and rootlessness). Because the political vocabulary is doing *ontological work*, removing the politics risks collapsing the philosophical architecture. If "destiny" is inextricably linked to "national destiny" in Heidegger's mind, the concept of destiny itself becomes suspicious.

  #### 3. The Status of the Subject (The View from Nowhere vs. The View from Here)
  *   **Frege:** Analytic philosophy, following Frege, aspires to a "view from nowhere" (Nagel). The ideal thinker is a pure vehicle of reason. Biography is irrelevant because the system is designed to eliminate the idiosyncrasies of the thinker.
  *   **Heidegger:** Continental philosophy, following Heidegger, insists on the "view from here" (situatedness). *Geworfenheit* (thrownness) is a fundamental category. If the philosopher is "thrown" into a Nazi context and embraces it as an ontological opportunity, that situatedness is data for the philosophy itself. To ignore the biography is to ignore the *Geworfenheit* that the philosophy claims to analyze.

  ---

  ### II. The Challenge to the Asymmetry (Why the Principle Might Fail)

  To sharpen the seminar discussion, you must present the strongest arguments *against* this insulation. This prevents the seminar from becoming an apology for analytic exceptionalism.

  #### 1. The Myth of Logical Purity
  Frege's logicism was not merely a technical exercise; it was driven by a desire for **certainty and order** in the face of 19th-century psychological empiricism and political fragmentation.
  *   **Argument:** The drive to eliminate the "human" from logic (anti-psychologism) can be read as a reaction against the "messiness" of democracy and pluralism. Frege's desire for rigid hierarchies of concept and object may mirror his desire for rigid social hierarchies.
  *   **Implication:** If the *motivation* for the system is authoritarian (a desire for absolute, unchallengeable authority in thought), does that cast suspicion on the *utility* of the system? (e.g., Is formal logic inherently conservative?)

  #### 2. The "Community of Reason" Problem
  Fregean semantics relies on the communicability of sense. Sense is what is shared.
  *   **Argument:** If Frege privately believes that a segment of humanity (Jews) is incapable of grasping true culture or thought (as suggested in his diary), does this undermine the **universality** required for his theory of communication? If the "third realm" is only accessible to a specific "type" of human, it ceases to be objective and becomes tribal.
  *   **Implication:** This attacks the *scope* of Frege's philosophy, if not its internal validity.

  #### 3. The Heideggerian Defense (The "Turn")
  Some defenders argue that even for Heidegger, the biography is distinct from the *truth content* of the analysis of Dasein.
  *   **Argument:** Just because Heidegger *applied* his concepts of destiny to the Nazis doesn't mean the concept of destiny *requires* Nazism. One could argue this is a category error similar to the Frege case: confusing the *use* of the ontology with the *structure* of the ontology.
  *   **Implication:** This pushes back toward symmetry. If we can separate Heidegger's *concepts* from his *applications*, why can't we do the same for Frege?

  ---

  ### III. Recommendation for the Seminar Handout

  Do not resolve the tension for the students. Instead, offer them a **"Relevance Test"** to apply to any philosopher. This turns the comparison into a methodological tool.

  **Proposed Framework: The Integration/Insulation Test**

  Ask students to evaluate the biography-doctrine link using these three questions:

  1.  **The Dependency Question:** Does the philosophical argument *logically depend* on the biographical commitment?
      *   *Frege:* No. (The quantifier works regardless of the author's view on Jews).
      *   *Heidegger:* Debatable. (Does *Authenticity* require a specific *Volk*? If yes, it fails the test).
  2.  **The Vocabulary Question:** Is the political language metaphorical or constitutive?
      *   *Frege:* Metaphorical/Personal. ("Leadership" in logic is not political leadership).
      *   *Heidegger:* Constitutive. (*Führung* [leadership] and *Volk* are ontological categories).
  3.  **The Universality Claim:** Does the philosophy claim to apply to all rational beings or specific historical existences?
      *   *Frege:* All rational beings. (Biography is an accident).
      *   *Heidegger:* Historical existence. (Biography is part of the data).

  **Pedagogical Payoff:**
  This framework allows you to conclude that the asymmetry is not merely a double standard or disciplinary protectionism. It is a reflection of the **different truth-claims** made by logic versus ontology.
  *   Frege claims **timeless validity**; thus, time-bound biography is irrelevant to truth (though relevant to moral evaluation).
  *   Heidegger claims **historical disclosure**; thus, time-bound biography is relevant to the truth-claim (as it reveals the specific historical disclosure involved).

  **The "Twist" for Discussion:**
  End the session by asking: *Does passing the Integration Test let Frege off the hook entirely?*
  Push the students to consider that while Frege's *logic* may be insulated, his **philosophical culture** (the analytic tradition's self-image as purely rational, ahistorical, and superior to "continental" vagueness) might be complicit in the very kind of exclusionary thinking found in his diary. The asymmetry in *treatment* might be justified, but the asymmetry in *self-reflection* between the two traditions is worth critiquing.

  ### Summary for the Handout
  *   **Thesis:** The differential treatment of Frege and Heidegger is not merely hypocritical; it tracks a genuine difference in how their systems relate to the subjectivity of the philosopher.
  *   **Key Distinction:** Logic claims independence from the thinker; Ontology (of Dasein) claims to describe the thinker.
  *   **Critical Caveat:** Insulating the *doctrine* does not insulate the *tradition*. We must ask how the myth of the "pure logician" protects analytic philosophy from examining its own historical situatedness.

  This approach validates the students' suspicion that something is odd about the asymmetry, while giving them the technical vocabulary to explain *why* the asymmetry exists, and finally pushing them to critique the consequences of that asymmetry.
