  *Key Insight:* Frege's project is *normative* regarding thought (how we *ought* to think to reach truth), but claims the laws of truth are independent of the thinker. Heidegger's project is *descriptive/interpretive* of the thinker's existence (Dasein). Therefore, the nature of the thinker matters more for Heidegger.

