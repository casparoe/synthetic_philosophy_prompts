      *   **Relationalist (let's call him "Marcus"):** Believes spacetime is just a codification of relations between material events/fields. He sees Elena's position as "relationalism with extra ontological steps." He needs to press on parsimony and explanatory power.

  3.  **Key Philosophical Concepts to Weave In:**
