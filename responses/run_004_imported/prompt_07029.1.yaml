  *(Self-Correction Note during final polish)*: I need to make sure Elena doesn't slip back into naive substantivalism. She must maintain that $M$ (manifold) + $g$ (metric) under diffeomorphism $d$ is the *same* state as $M$ + $d^*g$. Her claim is that $M$ is still a *thing*. Marcus claims $M$ is just a mathematical index for the field values.

