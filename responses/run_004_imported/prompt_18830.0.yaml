answer: |-
  **Rochester, New York. November 1857.**

  **The study of Frederick Douglass's home on South Avenue. The fire is low, casting long shadows against the shelves of law and philosophy. Two men sit opposite one another. William Lloyd Garrison, slight and bespectacled, looks weary, his hands clasped tight around a teacup. Frederick Douglass, broad-shouldered and imposing, stands by the mantel, a cigar unlit in his hand.**

  **GARRISON:** You look at me as though I am the one who has strayed, Fred. But it is you who have moved. When you stood on the Nantucket wharf, a fugitive with the tremor of the whip still in your back, you knew the truth. You knew the Union was a lie.

  **DOUGLASS:** I knew the *slaveholder's* Union was a lie, Bill. That has not changed. But I have come to see that the Constitution is not the slaveholder's property. To surrender the Constitution to the slave power is to surrender the very ground on which we fight.

  **GARRISON:** It is not surrender; it is recognition! Look at the document. It is stained in the blood of the kidnapped before the ink was even dry. "Covenant with death, and an agreement with hell." I did not invent that phrase to be poetic. I coined it to be precise. The Framers sat in that Philadelphia heat and bargained for the souls of millions. They counted us as three-fifths of a man to swell the representation of the tyrant. How can you call that a liberty document?

  **DOUGLASS:** Because I read the text, Bill. I read it with my eyes, not just with my anger. Show me the word "slave." Show me the word "slavery." They are not there. The Framers, ashamed of their bargain, hid it. They used euphemisms. "Persons held to service." "Other persons." If the Constitution intended to establish property in man, why did it lack the courage to name it?

  **GARRISON:** Because they were cowards! Does a thief become honest because he calls his loot "borrowed goods"? The intent is clear. The history is clear. Every Southern delegate at the Convention understood those clauses as a shield for their peculiar institution. And the courts? Have you read Chief Justice Taney in *Dred Scott*? He did not hesitate. He read the Constitution exactly as I have for twenty years. He said the black man has no rights the white man is bound to respect. He said the Constitution was made for white men. If the highest court in the land says the document sanctions your bondage, on what authority do you stand and call it glorious?

  **DOUGLASS:** Taney's opinion is a judicial usurpation, not a textual truth. He looked at the history of racism and called it law. I look at the law and see a mandate for justice. You argue from the secret intentions of dead men; I argue from the plain text of the living law. When a law is ambiguous, when it can be read two ways, there is a maxim of jurisprudence, borrowed from my friend Lysander Spooner: *In favor of liberty.* If the text does not explicitly sanction slavery, we must assume it sanctions freedom. To assume otherwise is to say that a document founded on "We the People" secretly intends to enslave a portion of those people without naming them. That is not interpretation; that is sorcery.

  **GARRISON:** Sorcery? It is reality! You speak of maxims, Fred, while the fugitive is dragged from Boston in chains under the Fugitive Slave Clause. Article Four, Section Two. "No person held to service or labor in one state... escaping into another, shall be discharged." It commands the return of the bondman. It makes the free state a jailer. How is that liberty?

  **DOUGLASS:** It commands the return of a "person held to service." It does not say "slave." It does not give Congress the power to enforce it; it leaves it to the states. It is a contract between states, not a divine sanction of chattel property. If a man is held to service unjustly, the Constitution does not say the federal government must uphold the injustice. It merely acknowledges the claim. We can meet that claim with the higher law of natural rights. But if you burn the Constitution, as you wish to do, you burn the ladder. You leave the slave with no legal recourse, no political voice, no claim upon the government but the mercy of the master.

  **GARRISON:** Political voice? In a government built on your three-fifths reduction? You want to vote? You want to hold office? While the Union stands, the slave power holds the veto. They control the Presidency, the Congress, the Courts. To participate is to be complicit. "No Union with Slaveholders" is not a retreat; it is a moral quarantine. Let the North sever the tie. Let the South see that their security depends on our submission, and when we withdraw that submission, the system collapses.

  **DOUGLASS:** And what becomes of the four million souls in the South when you sever the tie? You leave them in a foreign country, with no ally, no Constitution to appeal to, surrounded by a hostile power that recognizes no law but the lash. Disunion is not abolition, Bill. It is abandonment. I would rather use the Constitution as a weapon than cast it aside as a shield for the enemy. The Preamble, Bill! "To establish justice." "To secure the blessings of liberty." These are not empty sounds. They are the purpose of the machine. If the machine is being used to crush men, we do not smash the machine; we seize the controls and turn it toward its stated end.

  **GARRISON:** You trust too much in paper. You trust that the words "liberty" and "justice" have power against the dollar and the whip. I have seen the mob. I have seen the rope. The Constitution protected the slave trade for twenty years. Twenty years of legal kidnapping, sanctioned by the "glorious liberty document." Can you look a mother in the eye, whose child was torn from her breast under the protection of Article One, Section Nine, and tell her the document is on her side?

  **DOUGLASS:** I can tell her that the same document gave Congress the power to end that trade in 1808, which it did. I can tell her that the same document provides for habeas corpus, for trial by jury, for republican government in every state. The slavery is not in the text; it is in the violation of the text. The slaveholder is the unconstitutional actor, not the abolitionist who demands the law be followed. You say the document is pro-slavery because it was compromised at birth. I say it is anti-slavery because it contains the seeds of slavery's destruction. It appeals to natural law. And natural law knows no property in man.

  **GARRISON:** Natural law is invisible. The Fugitive Slave Act is iron. Taney's gavel is wood and sound. You are fighting ghosts with ghosts, Fred. I deal in the moral absolute. Sin cannot be legislated into virtue. A pact with the devil cannot be redeemed by reading the fine print differently. It must be torn up.

  **DOUGLASS:** And I deal in the possible. I deal in the votes, the laws, the courts. If I tell the Northern man that he must dissolve the Union, he calls me a fanatic and closes his door. If I tell him that the Constitution demands he free the slave, he must argue with the text. He must argue against "justice" and "liberty." I put him on the defensive. You put yourself outside the gate.

  **GARRISON:** *(Leans forward, voice dropping, intense)* I am outside the gate because the house is built on a foundation of bones. I will not pray in a church that holds slaves. I will not vote in a government that counts me as a fraction. I want you back, Fred. Not to my view, but to the purity of our first witness. We stood together when the world hated us. Do not let the politics of the possible dilute the moral of the necessary.

  **DOUGLASS:** *(Steps closer, resting a hand on the back of the chair opposite Garrison)* And I want you to see that purity without power is merely martyrdom. I have not diluted the moral, Bill. I have sharpened the sword. I am not asking you to love the slaveholder. I am asking you to love the slave enough to use every tool available to free him. If the Constitution is a tool, why drop it? Because the handle is warm from the master's grip? Take it. Wrench it from his hand. Use it to break his chains.

  **GARRISON:** *(Sits back, shaking his head slowly)* It is a poisoned cup. You may drink and think it water, but it is hemlock.

  **DOUGLASS:** Then I will drink it and not die. Because the poison is not in the cup, William. It is in the men who pour it.

  **GARRISON:** *(A long silence. He picks up his teacup, his hand trembling slightly.)* We shall see. The storm comes, Fred. I feel it in the air. And when the thunder breaks, it will not care for our interpretations. It will ask only where we stood.

  **DOUGLASS:** I know where I stand. On the text. On the law. On the side of a Union that *can* be redeemed.

  **GARRISON:** And I stand on the rock of moral truth. Even if the Union shatters against it.

  **DOUGLASS:** *(Nods slowly)* Then we are still friends, even if we are no longer allies in method.

  **GARRISON:** *(Looks up, eyes wet but fierce)* Always friends. But God help the slave if we are both wrong.

  **DOUGLASS:** God help the slave if we do nothing.

  **Douglass turns back to the fire. Garrison stares into his tea. The clock on the mantel ticks loudly in the silence, counting seconds neither man can reclaim.**
