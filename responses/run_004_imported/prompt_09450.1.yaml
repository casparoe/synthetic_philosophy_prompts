answer: |-
  **Setting:** *A quiet courtyard in the state of Zhao, circa 300 BCE. Two scholars sit on mats beneath a gnarled pine. One is **Master Ming**, a adherent of the School of Names, known for his precise distinctions. The other is **Master Shi**, a pragmatic logician with Mohist leanings, concerned with the utility of language in governing the state.*

  **Master Ming:** You look troubled, Shi. Is it the state of the roads, or the state of our tongues?

  **Master Shi:** It is your tongue, Ming, that troubles me. I hear you have been teaching disciples that a white horse is not a horse. If this is true, then when the King commands the stables to prepare a horse for his chariot, should the groom ignore the white ones? Or should he ignore all of them, since none are "horse"?

  **Master Ming:** You rush to the stables before understanding the name. Consider this: When we say "horse," what are we naming?

  **Master Shi:** We are naming the animal. The creature that pulls the plow and carries the rider.

  **Master Ming:** No. "Horse" names the *shape*. "White" names the *color*. The name for color is not the name for shape. Therefore, the name "white horse" is not the name "horse."

  **Master Shi:** This is a sleight of hand. I grant you that "white" is not "horse." Color is not shape. But when you combine them, you do not erase the shape. A white horse possesses the shape of a horse. If I point to a white horse and ask, "Is there a horse here?" you would nod. If you nod, you admit it is a horse. If you admit it is a horse, how can you say it is *not* a horse?

  **Master Ming:** I nod because a white horse *contains* the shape of a horse. But containment is not identity. Tell me, Shi, if a ruler seeks a horse, will a yellow horse or a black horse suffice?

  **Master Shi:** Of course.

  **Master Ming:** But if he seeks a *white* horse, will a yellow or black horse suffice?

  **Master Shi:** No.

  **Master Ming:** If "white horse" were truly "horse," then the request for one would be the request for the other. The acceptance of the yellow horse in the first case and the rejection of it in the second proves that "white horse" and "horse" are not the same. Since they are not the same, a white horse is not a horse.

  **Master Shi:** You are conflating "is the same as" with "is a member of." When I say "a white horse is a horse," I do not mean the concept *White Horse* is identical to the concept *Horse*. I mean the object falls under the classification.
  Consider a cup. If I ask for "a cup," any cup will do. If I ask for "a bronze cup," a wooden one will not. Does this mean a bronze cup is not a cup? It only means the set of bronze cups is smaller than the set of cups. You are treating the narrowing of the category as the destruction of the category.

  **Master Ming:** But where does the "white" go? If "white horse" is just "horse," then "white" has vanished. You are saying that when we join them, the color becomes invisible to the logic. If having a white horse means having a horse, then having a horse means having a white horse?

  **Master Shi:** No, that is your inversion. Having a white horse *implies* having a horse. But having a horse does not imply having a white horse. The relationship is one of inclusion, not equivalence. You treat the word "is" (or *fei*, "is not") as a rigid bridge. But language is a net. Sometimes the net catches everything with four legs; sometimes it catches only the white ones. The net changes, but the fish remain fish.

  **Master Ming:** You speak of nets and fish, but I speak of *Zhi*—of concepts themselves. "Horse" exists as a concept independent of color. "White" exists as a concept independent of shape. When they combine, they form a new compound concept.
  If you say a white horse *is* a horse, you are saying the compound is identical to the simple. But if I take "horse" and add "white," I have changed the designation. If the designation changes, the thing designated is distinct. To say "white horse is horse" is to allow two names to occupy one actuality without distinction. That is chaos.

  **Master Shi:** Chaos? It seems to me your distinction creates the chaos. Let us follow your logic to its end. If a white horse is not a horse because it has an added attribute of color, then a brown dog is not a dog. A tall man is not a man. A dead king is not a king.
  If we strip away every attribute to find the "pure" name, we are left with nothing we can point to. There is no "horse" in the world that is not *some* color. If "white horse" is not "horse" because it is specific, then no actual horse is a horse. You have saved the purity of the name "horse" by ensuring nothing in the world can ever bear it.

  **Master Ming:** You miss the point of the exercise. We are not talking about the physical animal alone; we are talking about the rectification of names (*Zhengming*). If the King says "I want a horse," and the groom brings a white one, the groom has fulfilled the command *in practice*. But in *logic*, the groom has fulfilled the command "horse," not the command "white horse."
  The danger, Shi, is not in the stable. It is in the court. If a minister promises "loyalty" but delivers "loyalty to his family," is that loyalty? If we say "family-loyalty is loyalty," we allow treason. We must distinguish the compound from the simple. "White horse is not horse" trains the mind to see that adding a modifier changes the essence of the obligation.

  **Master Shi:** So this is moral geometry? You twist language to sharpen the mind? But language must map to the world, or it is just music.
  You argue that "horse" names shape and "white" names color, so they cannot be combined. But in the world, shape and color are never found apart. You cannot skin the color off a horse to leave the "horse" behind. Since they are inseparable in actuality (*Shi*), separating them in name (*Ming*) creates a ghost.
  When I say "white horse is a horse," I am acknowledging that the primary substance is the animal. The color is secondary. You treat them as equal partners in a compound. But if I kill the white horse, I have killed a horse. If I kill a horse, I have not necessarily killed a white horse. The substance determines the kind. Your logic makes the attribute equal to the substance.

  **Master Ming:** And your logic makes the attribute invisible! If I seek a white horse and you bring me a black one, saying "This is a horse, is it not?" you have lied by omission. You rely on the ambiguity of "is."
  In our tongue, we say *Bai ma fei ma*. *Fei* means "is not." It does not mean "is not a member of." It means "is not identical to." I am stating a truth of identity. You are stating a truth of classification. Both are true, but you claim my truth is false because it conflicts with your usage.
  Why is your usage the master? Is it because it is convenient? Truth is often inconvenient.

  **Master Shi:** It is not convenience; it is function. A knife is for cutting. If you sharpen a knife until it is so fine it cuts only air and cannot touch the wood, is it still a knife? Your distinction is so fine it cannot cut through a conversation.
  You say *Fei* means "is not identical." Very well. A son is not identical to a man. So, is a son not a man? If a son is not a man, he owes no filial duty, for only men owe duty. If he is a man, then your rule fails.
  You are using the difference in *extension* (which things are picked out) to prove a difference in *nature* (what the thing is). The set of white horses is not the set of horses. Agreed. But every member of the white horse set is a member of the horse set. You deny the membership because you obsess over the set.

  **Master Ming:** I deny the membership because the name "horse" alone implies *no color*. The name "white horse" implies *color*. If I accept a white horse under the name "horse" without qualification, I am accepting color under the name of shape.
  Imagine if we applied this to the state. "A general is a servant." True. "A white-clad general is a servant." True. But if the King says "Send a servant," and you send a general, you have erred. The rank matters. The color matters.
  "White horse is not horse" is a shock to wake us from the slumber of assuming that because one thing includes another, they are the same. It is a wedge to split the world where it needs splitting.

  **Master Shi:** But the world does not need splitting there. It needs joining. We use language to build bridges between minds. If you stand on one side saying "White Horse" and I stand on the other saying "Horse," and you refuse to let me cross because the names are not identical, the bridge collapses.
  You say it trains the mind. I say it intoxicates it. It makes the scholar feel clever while the farmer starves because he cannot understand the order for grain.
  If your logic holds, then "one" plus "one" is not "two," because "one" is not "two." "Left" is not "right," so "left and right" is not "direction." You dissolve the connections that hold reality together in favor of the atoms. But we live in the compounds, Ming. We live in the white horses.

  **Master Ming:** We live in compounds, yes. But we govern by names. If we cannot distinguish the compound from the part, we cannot govern anything. Let the farmer have his "horse." Let the philosopher keep his "white horse is not horse." If you cannot see the distinction, it is because you are looking at the stable, not the sky.

  **Master Shi:** And if you look only at the sky, you will fall into the well.

  *(Both fall silent. The wind rustles the pine needles, sounding neither like "pine" nor "needle," but simply sound.)*
