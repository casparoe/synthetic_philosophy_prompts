          *   Explain the case clearly using the SE analogy (interrupt handler, watchdog timer).
          *   Explain why Frankfurt thinks this kills PAP (Responsibility without Alternative Possibilities).
      *   **Objection 1: The Flicker of Freedom:**
          *   Explain the counter-argument: There *is* an alternative (the prior sign).
          *   Frankfurt's counter-counter: That alternative isn't "robust" enough for moral responsibility.
          *   Evaluation: This is a debate about the *quality* of alternatives. It weakens PAP but doesn't destroy it.
      *   **Objection 2: The Dilemma Defense (The Heavy Hitter):**
          *   Explain Kane/Widerker.
          *   Horn 1 (Determinism): If the sign guarantees the choice, the case assumes determinism. Incompatibilists won't accept it.
