      *   **Frankfurt's Claim:** Jones is responsible, but couldn't have done otherwise (due to the device). Therefore, PAP is false.
      *   **Flicker of Freedom:** Jones *could* have shown sign $S$ (even if he couldn't have ultimately voted differently). This tiny alternative is enough for PAP.
      *   **Dilemma Defense:** Is sign $S$ causally sufficient for the choice?
          *   Horn 1: Yes. Then determinism is presupposed. Incompatibilists (who usually hold PAP) will reject the case as question-begging.
