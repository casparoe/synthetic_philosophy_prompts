      *   *Decision:* I will argue that Frankfurt cases **fail** to definitively refute PAP. While they are powerful intuition pumps, the Dilemma Defense exposes a structural flaw that prevents them from settling the debate between compatibilists and incompatibilists. This aligns well with the "software engineer" analogy (edge cases, race conditions, undefined behavior).

