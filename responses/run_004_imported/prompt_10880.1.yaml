      *   *Section 2: Pascal's Mugging (The Finite but Astronomical Game).* Explain Bostrom's setup. Emphasize that the payoff is *finite* (e.g., $3 \uparrow\uparrow\uparrow 3$ lives). Explain that this targets *unbounded* utility, not *infinite* utility.
      *   *Section 3: The Crucial Divergence.* This is where I answer the specific question about whether PM depends on infinite utilities. **No, it doesn't.** This is the smoking gun against the friend's argument. If you ban infinities, PW dies, but PM lives.
      *   *Section 4: Solutions.* PW solutions (faith, theology) don't touch PM. PM solutions (bounded utility, leverage penalties) are technical decision-theory fixes.
      *   *Section 5: The Name.* Discuss the aptness. It honors the structural lineage but warns against conflating the contexts.
