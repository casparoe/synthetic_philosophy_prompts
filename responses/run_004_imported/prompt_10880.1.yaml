  2.  **Deconstruct Pascal's Wager (PW):**
      *   *Origin:* Blaise Pascal (17th century).
      *   *Context:* Philosophy of Religion / Theology.
      *   *Structure:* Decision matrix.
          *   Option A: Believe in God. Cost: Finite (time, effort, foregone sins). Payoff: Infinite (Heaven).
          *   Option B: Disbelieve. Cost: Finite (pleasure). Payoff: Infinite negative (Hell) or Zero (nothing).
      *   *Key Feature:* **Infinite Utility**. The expected value (EV) calculation relies on $\infty \times p > \text{finite cost}$. Even if $p$ is tiny, if it's non-zero, $\infty \times p = \infty$.
      *   *Standard Objections:*
          *   Many Gods Objection: Which God? Competing infinite payoffs cancel out or make probability assignment impossible.
          *   Infinite Utility incoherence: Can utility actually be infinite? Decision theory breaks with infinities (e.g., Pasadena Game).
          *   Pragmatic vs. Epistemic: Can you force yourself to believe?

  3.  **Deconstruct Pascal's Mugging (PM):**
      *   *Origin:* Nick Bostrom (2009), building on ideas from Eliezer Yudkowsky.
      *   *Context:* Decision Theory / AI Safety / Longtermism.
      *   *Structure:* A stranger (mugger) approaches you. "Give me $5, or I will use my magic powers to simulate and kill $3 \uparrow\uparrow\uparrow 3$ people."
      *   *Key Feature:* **Unbounded Utility + Tiny Probability**. The payoff is *finite* but astronomically large (larger than any number you pick). The probability is tiny, but if your probability assignment doesn't shrink fast enough relative to the payoff size, EV dominates.
      *   *Mechanism:* It targets **unbounded utility functions**. If utility is unbounded, there exists *some* number of lives $N$ such that even a probability $1/N$ (or smaller) makes the EV huge.
      *   *Standard Objections/Responses:*
          *   Bounded Utility: Cap utility at some point.
          *   Leverage Penalty: Probabilities of having high impact drop faster than the impact rises.
          *   Complexity Penalty: Hypotheses requiring long descriptions get penalized (Solomonoff induction).

  4.  **Compare and Contrast (The "Meat" of the answer):**
      *   *Similarities:* Both use Expected Value (EV) maximization. Both involve low probability $\times$ high impact. Both challenge intuitive decision-making.
      *   *Differences:*
          *   **Infinity vs. Finitude:** PW *requires* infinity to work (otherwise a tiny probability of a finite payoff is just a lottery ticket). PM *specifically avoids* infinity to show the problem persists even with finite numbers. This is the critical point for the user's argument against their friend.
          *   **Source of Uncertainty:** PW is about metaphysical uncertainty (Does God exist?). PM is about empirical/simulation uncertainty (Can the mugger do this?).
          *   **Decision Theory Implication:** PW suggests religion is rational (or pragmatic). PM suggests standard EV maximization leads to absurdity (giving money to muggers) and implies a flaw in unbounded utility functions.
      *   *Addressing the Friend's Claim:* The friend says "Many Gods" and "Infinite Utility objections" solve PM. This is incorrect because PM is designed to work *without* infinities. The "Many Gods" objection doesn't apply because there aren't competing muggers with infinite claims, just one mugger with a huge finite claim.

  5.  **Address the Naming Convention:**
      *   Is "Pascal's" apt? Yes, historically. It references the structure of the wager (low prob $\times$ high stake).
      *   Does it obscure? Potentially, because it invites theological baggage (faith, God) that isn't there. But it signals "decision theoretic paradox involving stakes."
