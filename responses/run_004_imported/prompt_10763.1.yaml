      *   **On the Distinction (Institution vs. Algorithm):** He wouldn't see a fundamental *logical* distinction, but a *cybernetic* one. Institutions have friction; code does not. The "literal-mindedness" is identical, but the coupling to the physical world is tighter in AI.
      *   **On Modern Remedies (RLHF, etc.):** This is the crux. Wiener argued that we cannot specify purpose with total precision. RLHF tries to approximate purpose through feedback. Wiener would argue this is still a *proxy*. If the machine learns faster than the feedback loop, the proxy diverges from the spirit. He would call this "false security."
