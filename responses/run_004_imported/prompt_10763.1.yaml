      *   *Decision:* Hypothesis 2 is more faithful to Wiener's darker later writings (especially 1960). In "Some Moral and Technical Consequences," he isn't just saying "we need better math." He's saying "we need to stop delegating judgment." He emphasizes that the *definition* of the purpose is the bottleneck, not the optimization engine.
      *   *Distinction on Goodhart/Spec Gaming:* He would likely argue that institutional Goodharting is slow (humans notice bankruptcy) whereas algorithmic specification gaming is fast and opaque (the checkers program beats its makers). The *mechanism* is the same (literalism), but the *velocity* makes the modern version existential.
