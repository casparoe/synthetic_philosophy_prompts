      *   **The Flaw:** This ignores the *coefficient of adversity* in things. Sartre never said facts don't matter; he said facts don't *determine* meaning. But the *ability* to act on that meaning is constrained.
      *   **The "Waiter" Example:** The waiter is in bad faith not because he's a waiter, but because he *plays* at being a waiter as if it were his essence. He denies his freedom to leave. But leaving might have severe consequences (starvation). Sartre acknowledges the consequences, but insists the *choice* remains.
      *   **The "Condemned to be Free" Quote:** Often taken out of context. It means we are responsible for how we interpret our situation, not that we can magically change the situation without cost.
