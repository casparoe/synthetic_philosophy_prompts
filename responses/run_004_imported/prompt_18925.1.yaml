answer: |-
  You have stumbled onto one of the most subtle and genuinely interesting fault lines in non-cooperative game theory. Your intuition is spot-on, and your lecture notes were hinting at a distinction that introductory materials gloss over because it requires juggling three concepts simultaneously: **mixed strategies**, **correlated beliefs**, and **independence**.

  Here is the unpacking of why the gap opens, the specific mechanics of the divergence, and what it implies about the philosophy of rationality.

  ### 1. The "Mixed Strategy" Wrinkle (The 2-Player Baseline)

  First, let's clear up the question you raised about pure vs. mixed domination, because this is a prerequisite for the 3-player issue.

  **Question:** When checking if a strategy is dominated, do we check against pure strategies only, or mixes too?
  **Answer:** You **must** check against mixed strategies.

  If you only check for domination by *pure* strategies, Iterated Elimination of Dominated Strategies (IEDS) is too weak. There are classic 2-player examples where a strategy is not dominated by any single pure strategy of the opponent, but is dominated by a 50/50 blend of two of them.

  *   **Why it matters:** If you allow mixed strategies in the elimination procedure, then in **2-player games**, IEDS yields the exact same set of strategies as **Rationalizability**.
  *   **The Catch:** This equivalence holds for 2 players regardless of the correlation issue (because there is no one to correlate *with*). The divergence you read about only happens when $N \ge 3$.

  ### 2. The "Correlation" Wrinkle (The 3-Player Gap)

  This is the core of your confusion. The lecture notes were likely contrasting **IEDS** with **Independent Rationalizability**.

  To understand the gap, we have to look at how Player 1 forms a belief about Players 2 and 3.

  *   **IEDS (and Correlated Rationalizability):** When Player 1 considers whether their strategy is a best response, they consider *all possible probability distributions* over the opponents' strategy profiles $(s_2, s_3)$. Crucially, Player 1 is allowed to believe that $s_2$ and $s_3$ are **correlated**. Player 1 can think, "I don't know what they will do, but if Player 2 plays Up, I bet Player 3 plays Left."
  *   **Independent Rationalizability:** This imposes an extra constraint. It requires Player 1's belief to be a **product measure**. Player 1 must believe that Player 2 and Player 3 choose their strategies **independently**. Player 1's belief must look like $\mu(s_2, s_3) = \mu_2(s_2) \times \mu_3(s_3)$.

  **Why does this create a gap at $N=3$?**
  In a 2-player game, Player 1 has a belief over Player 2's strategies. There is no second opponent to correlate with, so "independent" and "correlated" beliefs are the same thing.

  In a 3-player game, the set of independent beliefs is a strict **subset** of the set of correlated beliefs.
  *   **IEDS** asks: "Is there *any* belief (correlated or not) over $(s_2, s_3)$ that makes $s_1$ a best response?"
  *   **Independent Rationalizability** asks: "Is there any *independent* belief over $(s_2, s_3)$ that makes $s_1$ a best response?"

  Because the set of allowed beliefs is smaller in the Independent case, it is **harder** for a strategy to survive. Therefore, Independent Rationalizability eliminates *more* strategies than IEDS. A strategy might survive IEDS (because it's a best response to a correlated belief) but be eliminated by Independent Rationalizability (because it's never a best response if opponents act independently).

  ### 3. A Minimal 3-Player Example

  Here is a sketch of a game where a strategy survives IEDS but fails Independent Rationalizability.

  **The Setup:**
  *   **Players:** 1, 2, 3.
  *   **Strategies:**
      *   Player 2: $\{H, T\}$ (Heads/Tails)
      *   Player 3: $\{H, T\}$
      *   Player 1: $\{Match, Safe\}$
  *   **Payoffs for P2 and P3:** They are playing Matching Pennies *against each other*.
      *   P2 wants to match P3. P3 wants to mismatch P2.
      *   **Result:** The only rationalizable strategy for both P2 and P3 is to mix 50/50. Player 1 *knows* this via Common Knowledge of Rationality (CKR).
  *   **Payoffs for Player 1:**
      *   If P1 plays **Safe**: Payoff is **0.6**, regardless of what P2/P3 do.
      *   If P1 plays **Match**: Payoff is **1** if P2 and P3 play the same thing $(H,H)$ or $(T,T)$. Payoff is **0** if they play different things $(H,T)$ or $(T,H)$.

  **The Analysis:**
  Player 1 knows P2 and P3 are rational, so P1 knows P2 plays $H$ with probability 0.5 and P3 plays $H$ with probability 0.5.

  1.  **Independent Rationalizability:**
      *   P1 must believe P2 and P3 are independent.
      *   Probability of $(H,H) = 0.5 \times 0.5 = 0.25$.
      *   Probability of $(T,T) = 0.5 \times 0.5 = 0.25$.
      *   Total probability of "Match" outcome = $0.5$.
      *   Expected Payoff for **Match** = $0.5 \times 1 + 0.5 \times 0 = \mathbf{0.5}$.
      *   Expected Payoff for **Safe** = $\mathbf{0.6}$.
      *   **Result:** **Match** is *not* a best response. It is eliminated.

  2.  **IEDS (Correlated Rationalizability):**
      *   P1 knows the *marginals* are 50/50, but P1 is allowed to hold a **correlated belief** about the joint outcome, provided it respects those marginals.
      *   P1 can believe: "There is a 50% chance they play $(H,H)$ and a 50% chance they play $(T,T)$." (This respects the 50/50 marginal for each player).
      *   Under this belief, Probability of "Match" outcome = $1.0$.
      *   Expected Payoff for **Match** = $\mathbf{1.0}$.
      *   Expected Payoff for **Safe** = $\mathbf{0.6}$.
      *   **Result:** **Match** *is* a best response. It survives IEDS.

  **Conclusion:** The strategy **Match** survives IEDS but is not Independently Rationalizable. The gap is real.

  ### 4. Philosophy: Which one is "Correct"?

  You asked whether this disagreement exposes something shaky about Common Knowledge of Rationality (CKR). It does, but not in the way you might think. It exposes that CKR is not a complete description of a rational agent's epistemic state.

  **CKR + Independence = Independent Rationalizability**
  **CKR (alone) = Correlated Rationalizability (IEDS)**

  The disagreement isn't about rationality; it's about **statistical independence**.

  *   **The Case for Independent Rationalizability:** If the game is truly sealed-bid, simultaneous, and there is no communication, no shared culture, and no external signals, then physical reality dictates independence. If you play **Match** in the example above, you are essentially betting on a correlation that has no physical mechanism to exist. In this view, IEDS is "too loose" because it allows players to entertain "magical" correlations.
  *   **The Case for IEDS (Correlated):** Real-world agents are rarely perfectly independent. They might share heuristics, read the same textbooks, or be influenced by the same ambient noise. IEDS is more **robust**. It identifies strategies that are defensible *even if* your opponents happen to be correlated for reasons you don't understand. If you play **Safe**, you are being cautious. If you play **Match**, you are making a specific structural assumption about the other players' independence.

  **The Verdict:**
  Most modern theorists view **IEDS (Correlated Rationalizability)** as the baseline "solution concept" derived purely from rationality and common knowledge. **Independent Rationalizability** is viewed as a stronger concept that requires an *additional* assumption (Independence).

  If your lecture notes said "IEDS and Rationalizability diverge," they were implicitly using "Rationalizability" to mean the stricter **Independent** version (which was Bernheim's original preference). However, in many modern contexts (like Pearce 1984), "Rationalizability" is defined to allow correlation, making it equivalent to IEDS.

  **Summary for your next hackathon:**
  1.  **Always check for mixed strategy domination.** A blend can beat a pure strategy even if no single pure strategy can.
  2.  **In 3+ player games, beware of correlation.** If you eliminate a strategy because "it requires opponents to correlate," make sure your game rules actually forbid correlation. If they don't, that strategy might be safer than it looks.
  3.  **The "Rational" set depends on your belief constraints.** There is no single "set of rational strategies" without specifying whether agents assume independence.

  You didn't mangle the notes; you just found the place where the math forces us to admit that "rationality" doesn't tell us everything about how we model uncertainty regarding other minds.
