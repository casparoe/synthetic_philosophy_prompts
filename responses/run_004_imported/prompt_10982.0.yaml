answer: |-
  The appraisal chamber was silent, save for the hum of the ventilation. Elara adjusted her gloves and looked at the two daggers resting on the steel bench. Both were identical in appearance: obsidian handles, matte black blades. Her task was to certify their dispositions. Specifically, she needed to verify the claim: *If this blade pierces flesh, it will cause death.*

  She picked up the first dagger, designated Subject Alpha. She ran a thumb along the flat of the blade. It was cold, inert. She knew the internal structure; there was no poison reservoir in the edge itself, only a sealed capsule in the hilt connected to micro-channels. The blade, in its current state, was chemically harmless. She could lick it and suffer no ill effects. The property of *toxicity* was absent.

  Elara positioned the blade over a slab of synthetic tissue, designed to mimic human biology. She swung.

  The moment the edge breached the surface of the synthetic skin, a pressure sensor in the tip registered the resistance of the flesh. In the microsecond between contact and penetration, the sensor fired. The sealed capsule in the hilt shattered. Pumped by the kinetic energy of the strike itself, the neurotoxin rushed through the channels and flooded the wound.

  The synthetic tissue darkened instantly, simulating necrosis. The condition was satisfied: pierce flesh, cause death. Yet, Elara noted in her log, the blade had not been toxic before the strike. The trigger had not merely released a standing property; it had created it. The moment the strike ended, the flow stopped, the channels sealed, and the blade returned to its harmless state. It behaved exactly as a poisonous weapon should, but only because the act of testing it forced it to become one.

  She set Subject Alpha aside. It was a perfect mimic, a hollow conditional.

  Next was Subject Beta. Elara approached this one with greater caution. She did not touch the blade with her gloves. She knew the coating on the edge was stable and potent. Even sitting on the bench, the air around it shimmered slightly where the toxin evaporated. The property of *toxicity* was intrinsic and present. It did not need a trigger to exist; it was there waiting.

  She prepared the second slab of synthetic tissue. However, this slab had been treated. Before the test, she had infused the material with a universal neutralizer, a compound that bound to neurotoxins on contact and rendered them inert.

  Elara swung Subject Beta. The blade cut deep. The toxin on the edge entered the synthetic flesh immediately. The disposition was present—the blade was genuinely poisonous—and the trigger occurred—the flesh was pierced.

  But the tissue remained pink. The neutralizer swarmed the toxin molecules, locking them down before they could interact with the simulation's vital systems. There was no necrosis. No death.

  Elara lifted the blade. The coating was still there, still potent. If she were to strike a neutral slab, it would kill instantly. The failure of the manifestation was not due to any lack in the blade, nor any change in its nature during the strike. The blade remained what it was. The prevention had come from outside, an interference that allowed the cause to exist without the effect.

  She looked between the two weapons. The first had lied about its nature by changing itself to match the test. The second had told the truth about its nature but was silenced by the world around it. Both defied the simple equation of *if struck, then broken*, but for opposite reasons.

  Elara closed her log. One was a shapeshifter, becoming dangerous only when watched. The other was a prisoner, dangerous always, but held in check by a cage it could not see. She marked Subject Alpha as *Contingent* and Subject Beta as *Inhibited*. The physics were sound, but the metaphysics were messy. She preferred the mess; it kept her employed.

  She turned off the ventilation hum. The blades sat in the silence. One was safe until it wasn't. The other was deadly until it wasn't allowed to be. Both waited for the next hand to reach out.
