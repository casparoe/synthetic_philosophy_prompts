  **Rank-Discounted Utilitarianism:** This view occupies the top tier because it is explicitly engineered to satisfy the most of Arrhenius's adequacy conditions (such as Dominance and Equity), though it must violate Separability or Independence to do so.

  **Critical-Level Utilitarianism:** While it successfully avoids the Repugnant Conclusion, it accepts the Sadistic Conclusion, implying it can be better to add lives with negative welfare than lives with positive welfare below the critical threshold.

  **Variable Value Theory:** This theory avoids the Repugnant Conclusion by positing diminishing marginal value of population size, but it violates Non-Elitism or Continuity by implying a small number of excellent lives can outweigh any number of very good lives.

  **Total Utilitarianism:** This view has the strongest independent motivation via simple aggregation, but it is ranked lower here because it directly entails the Repugnant Conclusion, which is the primary problem the seminar seeks to address.

  **Parfit's Lexical View:** This approach avoids the Repugnant Conclusion by asserting qualitative lexical gaps, but it violates the Non-Lexicality (Continuity) condition, implying no amount of lower-quality welfare can ever outweigh higher-quality welfare.

  **Wide Person-Affecting Views:** These views attempt to accommodate the Non-Identity Problem but often result in Incompleteness, failing to provide a ranking for many pairs of populations with different identities.

  **Average Utilitarianism:** This theory is placed in the lowest tier because it entails a severe version of the Sadistic Conclusion, implying it is better to add miserable lives than happy lives if the latter lower the average.

  **Narrow Person-Affecting Views:** This view is least defensible because it falls prey to the Non-Identity Problem, implying we cannot condemn actions that severely harm future people simply because those people would not otherwise exist.
