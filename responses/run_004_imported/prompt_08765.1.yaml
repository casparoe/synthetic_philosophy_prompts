answer: |-
  This is an exceptionally sharp observation, and it is one that often arises when students first encounter the transition from Lewisian to interventionist metaphysics. You are correct that both theories are modal and both rely on counterfactual reasoning. If one views counterfactuals merely as "sentences of the form 'if A had happened, B would happen'," then Woodward does look like he is simply applying a filter to Lewis's broader set.

  However, the consensus in the literature is that interventionism constitutes a **principled departure** from the Lewisian tradition, not merely a refinement or narrowing of scope. The distinction is not just "formal bookkeeping"; it reflects deep disagreements regarding the **semantics of counterfactuals**, the **ontology of causal relata**, and the **ultimate aim of a theory of causation**.

  Here is a breakdown of why interventionism is treated as a distinct research program, addressing your specific doubts about scope and late preemption.

  ### 1. Divergent Semantics: Similarity vs. Surgery
  Your intuition rests on the idea that an intervention is just a specific *kind* of counterfactual antecedent. But for Lewis and Woodward, the **truth conditions** for those counterfactuals are fundamentally different.

  *   **Lewis (Similarity Metric):** For Lewis, to evaluate "If $c$ had not occurred, $e$ would not have occurred," we look at the possible world most similar to ours where $c$ does not occur. Similarity is weighed by a complex, context-sensitive metric (avoiding miracles, maximizing spatiotemporal match, etc.). This leads to well-known problems with "backtracking" counterfactuals (e.g., if the barometer hadn't fallen, would the storm still have happened?). Lewis has to stipulate that we hold the past fixed, but his similarity metric struggles to justify *why* without circularity.
  *   **Woodward (Graph Surgery):** For Woodward, counterfactuals are evaluated via **Structural Equation Models (SEMs)**. An intervention ($do(X=x)$) is not just a world where $X=x$; it is a world where the *equations determining X* are replaced by the assignment $X=x$. All incoming arrows to $X$ are severed.

  This is not just narrowing the scope; it is changing the logic. In Lewis's framework, the connection between $C$ and $E$ is mediated by global similarity. In Woodward's, it is mediated by **modularity**. Woodward assumes the world is composed of distinct mechanisms that can be independently manipulated. Lewis makes no such assumption; he assumes a mosaic of categorical facts. Therefore, Woodward's counterfactuals are not a subset of Lewis's; they are evaluated using a different logical machinery that presupposes a causal structure Lewis is trying to reduce.

  ### 2. Ontology: Events vs. Variables
  The two theories posit different causal relata, which signals a metaphysical divergence.

  *   **Lewis:** Causation is a relation between **events** (particulars).
  *   **Woodward:** Causation is a relation between **variables** (properties that can take values).

  This shift is crucial. By moving to variables, Woodward builds **contrastivity** and **granularity** into the theory. "The short circuit caused the fire" is ambiguous for Lewis (which event? the spark? the heating of the wire?). For Woodward, this is resolved by specifying the variables (e.g., $Current=high$ vs. $Current=low$).

  More importantly, Woodward's variables imply an ontology of **invariant relationships**. Lewis is a Humean reductionist; he wants to reduce causation to non-causal patterns of events. Woodward is arguably non-reductive or pragmatic. He is less interested in what causation *is* in the fundamental furniture of the universe and more interested in what causal claims *do* for scientific explanation. He explicitly argues that causation might not exist at the fundamental physical level (where interventions may be impossible) but is nonetheless real and objective at the level of the special sciences. This is a direct rejection of the Lewisian goal of a unified metaphysics of causation supervening on fundamental physics.

  ### 3. Late Preemption: Structural vs. Chain-Based
  Your classmate was right to point to late preemption, but the difference is deeper than just a "tidier apparatus."

  *   **The Case:** Suzy and Billy throw rocks at a bottle. Suzy's rock hits first and shatters it. Billy's rock would have hit a moment later.
  *   **Lewis's Problem:** There is no counterfactual dependence. If Suzy hadn't thrown, Billy's rock would have shattered the bottle. So $E$ does not depend on $C_{Suzy}$. Lewis had to introduce **quasi-dependence** (intrinsic process matching) to fix this. Many critics argued this was an *ad hoc* patch that undermined the purity of the counterfactual analysis.
  *   **Woodward's Solution:** In an SEM, Suzy's throw and Billy's throw are independent variables. We intervene on Suzy's throw while holding Billy's fixed. If we set $Suzy=0$ (and $Billy=0$, as per the actual scenario), the bottle doesn't break. The structural path from Suzy to Bottle is **active**.

  This isn't just "tidier." It shows that Woodward is analyzing **causal structure** (paths in a graph), whereas Lewis is analyzing **causal dependence** (chains of counterfactuals). Woodward allows for causation without dependence (via active paths), whereas Lewis tries to reduce causation *to* dependence. When Lewis fails (as in preemption), he must alter the definition of dependence. Woodward simply acknowledges that dependence is a special case of the more general notion of **invariance under intervention**.

  ### 4. The Aim: Metaphysics vs. Methodology
  Finally, the sharpest distinction lies in the research goals.

  *   **Lewis** is doing **metaphysics**. He wants to know the truth conditions for causal claims in terms of non-causal facts. He is concerned with the "ground" of causation.
  *   **Woodward** is doing **methodology/philosophy of science**. He wants to know how scientists distinguish causal from spurious correlations. He is concerned with the **epistemic access** to causation.

  Woodward explicitly argues that a theory of causation should be useful for distinguishing causal relationships that support manipulation and explanation. He embraces **context-sensitivity** (causal claims are relative to a set of variables), whereas Lewis seeks context-independent truth conditions.

  ### Conclusion
  You are right that Woodward inherits the counterfactual *intuition* from Lewis: causation is about what would happen if things were different. However, to treat interventionism as merely a "restricted subset" of Lewisian counterfactuals misses that Woodward changes the **rules of evaluation** for those counterfactuals.

  Lewis evaluates counterfactuals by comparing **worlds**. Woodward evaluates them by manipulating **models**.

  Therefore, the contrast in survey articles is not merely emphasis. It marks a shift from a **reductionist, event-based metaphysics** (Lewis) to a **functionalist, variable-based account of explanation** (Woodward). While Woodward's theory can be seen as a descendant of the counterfactual tradition, it constitutes a distinct research program because it abandons the Humean reductionist project in favor of an account tied to scientific practice, modularity, and invariance. Your skepticism is healthy—it highlights the continuity—but the theoretical break is genuine.
