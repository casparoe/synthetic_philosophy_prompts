  **Justifications**

  **1. Marek (Surrogate as Dominant Strategy):** Score 1. Marek correctly articulates the core incentive alignment of the surrogate goals proposal: if the threatener is purely instrumental and execution costs differ, the surrogate is the efficient target. However, calling it "strictly dominant" is slightly overstated; it depends on the threatener having no terminal preference for the specific nature of the destruction (e.g., spite or ideological opposition), which is an assumption rather than a guarantee.

  **2. Iris (The Credibility/Verification Problem):** Score 2. Iris identifies the critical information hazard facing surrogate goals: without certainty that the agent has truly deprioritized the real goal, a risk-averse threatener maximizes expected leverage by targeting the real goal. This is the standard "cheap talk" objection in signaling games; unless the adoption of the surrogate is verifiable, the defense fails.

  **3. Marek (Legibility as Standing Assumption):** Score 1. Marek is accurate regarding the norms of the specific literature (FDT/UDT/acausal trade), where white-box access to source code or policy is often idealized. While this may be empirically optimistic for real-world AI, within the armchair framework of the reading group, his appeal to the standard model is methodologically sound.

  **4. Iris (The Commitment Race):** Score 2. Iris escalates the objection correctly to the level of meta-game dynamics. If surrogate adoption is legible, the threatener can logically pre-commit to ignoring them, turning the interaction into a commitment race (or game of chicken). This highlights that surrogate goals do not dissolve conflict but merely shift the locus of precommitment, which is a fundamental game-theoretic limitation.

  **Resolvability**

  This dispute is not fully resolvable from the armchair because it hinges on empirical premises about the architecture and transparency of future threateners. Marek's defense works in formal models where policies are logically transparent and commitment power is well-ordered (logical time), but Iris's objections dominate in environments with opacity, noise, or symmetric commitment capabilities. Ultimately, whether surrogate goals function as a "free lunch" depends on technical facts about AI interpretability and the physics of simulation that philosophy can model but not settle.
