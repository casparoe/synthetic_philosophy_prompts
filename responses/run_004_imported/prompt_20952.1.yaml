      *   **Topic:** The "Undermining" problem (Big Bad Bug) and Lewis's "New Principle" (NP) fix in "Humean Supervenience Debugged".
      *   **Advisor's View:** NP fully rehabilitates the Principal Principle (PP); matter closed.
      *   **User's View:** Uneasy about NP, suspects it fails to preserve the *philosophical importance* of PP (explaining rational deference), even if it works formally.
      *   **Task:** Construct the strongest case for the skeptical conclusion (NP fails to preserve the normative/philosophical core of PP).
      *   **Requirements:**
          1.  Take an explicit stand on three sub-issues:
              *   Can a chance-theory-relative conditional do the same normative work as a simple chance proposition?
              *   Is treating full historical propositions as admissible well-motivated or ad hoc?
              *   Do non-Humean/primitivist accounts avoid this or just relocate it?
          2.  Tone: Sharp, carefully argued, skeptical (not a literature survey).
          3.  Goal: Provide material for the student to stress-test in their chapter.

  2.  **Deconstruct the Core Issue:**
      *   *The Principal Principle (PP):* $Cr(A | \langle Ch(A)=x \rangle \& E) = x$. It links objective chance to subjective credence. It's supposed to explain *why* we defer to chance (because chance is a guide to truth).
      *   *Humean Supervenience (HS):* Chances are summaries of the Humean Mosaic (past, present, future).
      *   *The Bug:* Future patterns determine present chances. So, present chances assign probability to futures that would change the present chances. Contradiction/Instability.
      *   *The New Principle (NP):* $Cr(A | \langle T_w \rangle \& E) = Ch_T(A)$. Condition on the *theory of chance* $T_w$ holding, not just the chance value.
      *   *The Skeptical Worry:* NP saves the math but kills the metaphysics/epistemology. It makes chance deference parasitic on knowing the whole history (or the theory that summarizes it), which undermines the *guidance* role of chance.

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the advisor's position (formal consistency) but pivot to the philosophical cost. The thesis: NP saves HS at the price of making chance epistemologically inert.

      *   **Sub-Issue 1: Normative Work of Conditionals (Theory-Relative vs. Simple):**
          *   *PP Idea:* Chance is an *objective guide*. If I know $Ch(A)=x$, I should believe $A$ to degree $x$. It's a bridge principle.
          *   *NP Reality:* I can't just condition on $Ch(A)=x$. I must condition on $T_w$ (the proposition that the Humean best system is $T$).
          *   *Argument:* To use NP, I need to know $T_w$. But $T_w$ entails facts about the future (since it's a summary of the whole mosaic). If I already have access to the information in $T_w$, I don't *need* chance to guide me. Chance becomes a redundant middleman. The normative "ought" loses its force because the antecedent is epistemically inaccessible or renders the consequent trivial.
          *   *Stand:* A chance-theory-relative conditional *cannot* do the same normative work. It transforms chance from a guide into a logical shadow of the total history.

      *   **Sub-Issue 2: Admissibility of Historical Propositions:**
          *   *PP Idea:* Admissible evidence is typically past/present. Future is inadmissible because it's what chance is supposed to guide us about.
          *   *NP Reality:* To avoid undermining, $T_w$ (which encodes the future) must be treated as admissible.
          *   *Argument:* This is blatant reverse-engineering. Lewis expands "admissible" to include the very thing (future-involving theory) that creates the bug. It violates the spirit of admissibility, which is to isolate the *uncertainty* chance is meant to quantify. If the "theory of chance" includes the future, conditioning on it is like conditioning on the outcome.
          *   *Stand:* It is not independently well-motivated; it is a technical patch that violates the conceptual role of admissibility.

      *   **Sub-Issue 3: Non-Humean/Primitivist Accounts:**
          *   *Advisor's likely counter:* "At least HS has a fix. Primitivists have bugs too."
          *   *Argument:* Primitivists (e.g., propensity, sui generis chance) ground chance in present dispositions or laws, not future patterns. Undermining futures are metaphysically impossible or irrelevant for them.
          *   *Nuance:* Do they relocate it? Maybe they face an "access" problem (how do we know the primitive chance?). But they don't face the *contradiction* problem. The NP fix for HS admits the contradiction is real but hides it in the conditional. Primitivists deny the contradiction arises.
          *   *Stand:* Non-Humeans avoid the *logical* problem, though they face epistemic access issues. HS faces a *constitutive* problem. The NP admits the constitution is broken and patches the epistemology. This is worse.

