  *(Reviewing the MR point specifically):* Kim argues that if Pain is realized by $P_1$ in humans and $P_2$ in octopuses, "Pain" is just a disjunction $P_1 \lor P_2 \lor P_3$. Disjunctions aren't natural kinds, so they can't feature in causal laws. Blake needs to counter that functional properties *are* natural kinds despite MR.

