  ok so I fell down a wiki hole on Berkeley last night (the "esse est percipi" guy, not the city) and turns out before he was all bishop-y he wrote this thing called The Querist, which is literally just hundreds of numbered questions about 1730s Irish economic policy, no real prose argument, just query after query. the gist iirc is that money isn't wealth in itself, its more like a ticket or counter for keeping track of who's owed what, and that gold/silver only have value because people agree they do, not intrinsically - which kind of rhymes with his whole "matter doesn't exist apart from being perceived" thing if you squint. he was also pushing hard for a national bank so Ireland would have more currency circulating and people would actually have work to do instead of just sitting around with no specie.

  given all that, what do you reckon he'd say if you showed him bitcoin? would he read it as the ultimate vindication of his "money's just an arbitrary token, no intrinsic value required" argument, since BTC doesn't even have gold's fake-intrinsic-value thing going for it - or would his stuff about needing some trusted institution to manage the tickets (the whole bank angle) make him deeply suspicious of something explicitly built to not have a central issuer? steelman both readings using his actual querist-era arguments, not just the "immaterialism guy" meme people know him for.
