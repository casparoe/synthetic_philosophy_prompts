answer: |-
  This is a sophisticated pedagogical challenge, and it is excellent that you are pausing to interrogate the reconstruction before Thursday. The hesitation from your graduate TA is well-founded, and addressing it will actually strengthen your lecture, even if it requires a slight adjustment to your framing.

  While your reading (and your colleague's) is common in **Law of Armed Conflict (LOAC)** contexts—where proportionality is the primary operational metric—it risks flattening Anscombe's specific **moral philosophical** contribution. For Anscombe, the primary objection to Hiroshima was not that the civilian deaths were *disproportionate* collateral damage (which implies they were unintended side-effects), but that the civilians were **intentionally targeted** as a means to force surrender.

  In "War and Murder," Anscombe argues that the Doctrine of Double Effect (DDE) only applies when the evil effect is *foreseen but not intended*. If the destruction of the city and the killing of its inhabitants was the *method* of victory (which she argues it was), then DDE does not apply at all. It is not a case of "failed proportionality"; it is a case of "direct intention." If you teach it solely as a proportionality failure, students may leave thinking, "If fewer people had died, Truman would have been innocent." Anscombe's view is stricter: "If he targeted them directly, he is guilty regardless of the number."

  Below, I have drafted the materials you requested. However, I have designed the **Discussion Question** to surface this tension (Intention vs. Proportionality) rather than obscure it, which will validate your TA's instinct while keeping your lecture flow. I have also sketched the **Deterrence** extension based on Anscombe's principle of "Conditional Intention."

  ### Part 1: Discussion Question (Proportionality vs. Intention)

  **Context for Students:** *We are testing the limits of the Doctrine of Double Effect. Usually, DDE requires that the good effect outweigh the bad effect (proportionality). But Anscombe adds a prior condition: the bad effect must not be intended.*

  **Discussion Prompt:**
  "Imagine a spectrum of military scenarios involving civilian casualties.
  1.  **Scenario A:** A missile strikes a munitions factory. 2 civilians die as an unforeseen accident.
  2.  **Scenario B:** A missile strikes a munitions factory. 200 civilians die, foreseen but unintended. The factory produces weapons currently killing your own soldiers.
  3.  **Scenario C:** A missile strikes a munitions factory. 20,000 civilians die, foreseen but unintended. The factory produces weapons currently killing your own soldiers.
  4.  **Scenario D (Hiroshima):** A bomb strikes a city center. 140,000 civilians die. The military objective is to shock the government into surrender by demonstrating the capacity to destroy their urban centers.

  **Questions for the class:**
  *   At what point between Scenario B and C does the death toll become 'disproportionate' enough to render the act murder under DDE?
  *   Now, look at Scenario D. Anscombe argues Hiroshima belongs in a different category entirely. Why might she argue that no calculation of proportionality matters for Scenario D, even if the war had ended immediately after?
  *   **The Crux:** If the civilian destruction is the *means* by which victory is achieved (rather than a side-effect of achieving victory), does the 'proportionality' defense remain available to the commander?"

  **Instructor Note:** *Use this to pivot from the LOAC reading (proportionality) to Anscombe's reading (intention). If the civilians are the mechanism of victory, they are intended. If they are intended, DDE is off the table, and the act is murder regardless of the ratio.*

  ### Part 2: Extending to Nuclear Deterrence & Countervalue Targeting

  **Core Argument:** *The Corruption of Conditional Intention*

  If you carry Anscombe's framework into the unit on deterrence, the argument becomes even more severe than it was for Truman. Here is the sketch for your lecture notes:

  **1. The Logic of Deterrence:**
  Nuclear deterrence (specifically countervalue targeting, which targets cities/population rather than silos) relies on a **conditional intention**. The state says: "If you attack us, we will destroy your cities." For the threat to be credible, the intention to carry it out must be genuine (or at least indistinguishable from genuine).

  **2. Anscombe's Principle on Intention:**
  For Anscombe, morality governs the will. To intend to do something evil is already to participate in evil, even if the action is never consummated.
  *   **Truman (The Act):** He *actually* willed the destruction of civilians. He is guilty of murder.
  *   **The Deterrent (The Threat):** The leader *holds in their will* the intention to destroy civilians, contingent on an enemy's action.

  **3. Why Deterrence is "Harder to Justify":**
  *   **Prolonged Corruption:** Truman's intention lasted until the bombs fell. A deterrent posture requires a leader (and a military crew) to maintain a murderous intention *continuously* over years or decades. It institutionalizes a "willingness to murder" as a permanent state of policy.
  *   **The Bluff Dilemma:**
      *   *If the threat is a bluff:* It is a lie and undermines the stability of international trust (and may fail to deter).
      *   *If the threat is genuine:* The state is actively intending to commit mass murder (which Anscombe has already defined as intrinsically evil).
  *   **Countervalue Specifics:** In Truman's case, one might argue (incorrectly, per Anscombe, but arguably) that there was some military target involved. In pure countervalue deterrence, the *only* target is the civilian population. There is no "collateral damage" fiction available. It is the explicit intention to kill innocents as a means of prevention.

  **4. Conclusion for the Lecture:**
  "On Anscombe's view, Truman was guilty because he executed a murderous intention. The nuclear deterrent state is guilty because it *marries* itself to a murderous intention. It makes the willingness to commit mass murder a standing condition of its security. If the act of killing innocents is murder, the conditional intention to kill innocents is a conditional intention to commit murder—and for a moral agent, willing the evil is sufficient for culpability."

  ### Summary Advice for Thursday
  You can confidently tell your students: *"Many legal scholars read Anscombe as arguing about proportionality. However, a closer philosophical reading suggests she argues about intention. If the civilians are the means, the math doesn't matter."*

  This acknowledges your colleague's reading (validating the law context) while respecting Anscombe's philosophical rigor (validating your TA's instinct). It turns a potential contradiction into a productive teaching moment about the difference between **Legal Proportionality** and **Moral Intention**.
