answer: |-
  1. **The Source of the Power vs. Humean Skepticism**
  You ground promissory obligation in a normative power inherent to the will, distinct from social utility. But a Humean would argue that this "power" is itself just a fiction generated by the long-term usefulness of the practice. If the power isn't derived from convention or consequences, where does it come from? Is it a brute metaphysical fact about agency, and if so, doesn't that risk making the obligation mysterious rather than explained?

  *Follow-up:* You'll likely say utility explains why we *have* the practice, but not why we are *bound* within it. But if the power is brute, isn't your account just labeling the mystery "normative power" rather than solving it?

  2. **The Asymmetry of Self-Release**
  If binding oneself is a power the promisor exercises unilaterally, it seems odd that this same power cannot be exercised in reverse to unbind oneself. In property law, the power to create a right often includes the power to revoke it before it's claimed. Why is the promisor sovereign over the creation of the duty, but entirely sovereign-less regarding its cancellation, when it seems only the promisee can release the promisor?

  *Follow-up:* I expect you'll say the right transfers to the promisee upon creation. But if the power is rooted in *your* will, why does your will lose all authority over the duty the moment it is instantiated?

  3. **The Deathbed Promise and the Status of the Promisee**
  Let's grant your leading case: the deathbed promise where breach is undetectable. You argue the obligation holds. But does it still matter, morally, whether the promisee is actually alive and capable of being let down? If I break a promise to a corpse, have I violated a normative power they hold, or have I merely failed to honor a commitment I made? Where is the "other" in this bilateral relation if they no longer exist?

  *Follow-up:* You will probably distinguish between "harming" the dead (impossible) and "wronging" them (possible). But doesn't "wronging" someone require a subject who can be wronged, or does your metaphysics allow for rights without living right-holders?

  4. **Degrees of Bindingness vs. Binary Powers**
  In casual conversation, promises among friends seem to bind more loosely and excuse more easily than formal or commercial contracts. If bindingness is the binary exercise of a power—either I have it and use it, or I don't—how do you account for this gradient? Are there different "strengths" of normative power, or does your view imply that a casual "I promise to text you" is metaphysically identical to a mortgage agreement?

  *Follow-up:* You might argue that context changes whether the power was *successfully* exercised. But doesn't that smuggle reliance back in as a criterion for whether the power actually took hold?

  5. **The Analogy with Consent**
  Normative powers accounts often lean heavily on the analogy with consent. But consent typically waives an existing claim (e.g., against bodily intrusion), whereas promising creates a *new* duty where none existed before. Does your account owe more to the logic of waiver or the logic of creation? If it's creation, does that require a different metaphysical mechanism than the one we use for consent?

  *Follow-up:* If you unify them under a general "normative control," does that stretch the concept of control so thin that it no longer explains why promising feels distinct from consenting?

  6. **Improving on Rawls and Scanlon**
  Rawls argued promissory obligation is constituted by a social practice, and Scanlon grounds it in a principle against manipulating expectations (Principle F). You dismiss these as reducing obligation to something else. But what does your account *gain*? If Rawls explains the stability and Scanlon explains the harm, what explanatory work is left for the "metaphysics of the power" to do, other than preserving the intuition that promises are special?

  *Follow-up:* You'll likely say they fail to capture the *authority* of the promisor. But if the authority doesn't produce different practical outcomes than Scanlon's principle, is the disagreement merely semantic?

  7. **The "Etiquette vs. Metaphysics" Distinction**
  You have a habit of dismissing reliance-based objections by saying critics are describing "the etiquette of promising, not its metaphysics." That's a sharp distinction, but isn't it possible that what you call "metaphysics" is just internalized etiquette? If the normative power only makes sense within a community that recognizes it, isn't the power itself a social artifact rather than a feature of the will?

  *Follow-up:* If you insist the power is pre-social, how do you explain why the specific *form* of promising varies so wildly across cultures if the underlying metaphysics is universal?

  8. **Third-Party Beneficiaries**
  Consider a promise made to A to benefit B. If the normative power creates a right in the promisee, who holds the power of release? If A can release me even if B still needs the help, it suggests the duty is to A, not B. But if A *cannot* release me without B's consent, doesn't that imply the obligation is grounded in B's reliance or interest, undermining the pure powers account?

  *Follow-up:* You may argue the right belongs strictly to the promisee. But does that mean the third party has no standing to complain if I break the promise, which seems counterintuitive?

  9. **Impossibility and the Limits of Will**
  If promising is an exercise of will to create a duty, what happens when performance becomes impossible through no fault of the promisor? Can I literally bind myself to do the impossible? If your account says I am still obligated despite impossibility, it seems divorced from reality; if it says I am not, doesn't that suggest the obligation was never really about my will, but about what I could reasonably control?

  *Follow-up:* If you say the duty shifts to compensation, isn't that an admission that the primary duty was actually grounded in the expectation of performance, not just the act of willing?

  10. **Falsifiability and Defeaters**
  Finally, a methodological question. What would actually count as evidence against your account, rather than just another case to be explained away? Is there a scenario involving promises where, if our intuition went the other way, you would abandon the normative-powers view? Or is the theory structured such that any intuition about obligation is taken as data confirming the existence of the power?

  *Follow-up:* If the only evidence for the power is the intuition that the obligation exists, aren't we reasoning in a circle where the power explains the obligation and the obligation proves the power?
