answer: |-
  This is a fantastic collision of ideas. You have identified a genuine philosophical fault line: the clash between **Cosmic Utilitarianism** (Longtermism) and **Humanistic Pragmatism** (Ramsey).

  Most people discuss longtermism using arguments from Peter Singer (impartiality) or Derek Parfit (non-identity). Using Frank Ramsey is much sharper because Ramsey attacks the *epistemological* and *aesthetic* foundations of the view, not just the ethics.

  Here is the reconstruction of what Ramsey would likely say, based on his writings (specifically *"Epilogue,"* *"Truth and Probability,"* and *"Knowledge"*), followed by an evaluation of whether his objection holds water against Bostrom and Ord.

  ### The Verdict: Ramsey Would Reject It (But Not How You Think)

  Ramsey would not reject longtermism because he doesn't care about the future. He would reject it because he believes the longtermist calculation is a **category error** regarding how value and probability work.

  He would likely land on a position that looks like this: **"The future matters, but you cannot mathematically dominate the present with an abstraction you cannot comprehend."**

  Here are the three specific arguments Ramsey would deploy, reconstructed from his actual philosophy.

  #### 1. The Argument from Perspective (The "Epilogue" Objection)
  In *"Epilogue,"* Ramsey writes:
  > *"My picture of the world is drawn in perspective, and not like a model to scale. The foreground is occupied by human beings and the stars are all as small as threepenny bits."*

  Longtermists argue that because the *number* of future people is vast, their moral weight is vast. Ramsey would argue that **moral weight does not scale with quantity in the abstract.**

  To Ramsey, value is not a substance that accumulates like sand grains. Value is rooted in **conscious experience and human relations**. When Bostrom talks about "trillions of future lives," he is treating lives as units in a sum. Ramsey treats lives as "organic wholes."

  **Ramsey's specific critique:** You are making the same mistake as the person who thinks a star is more important than a man because it is bigger. The longtermist thinks a trillion future people are more important than a billion present people because the number is bigger. Ramsey would say: *"Importance is a function of proximity to agency and feeling, not spatiotemporal volume. To let the abstract magnitude of the future obliterate the concrete reality of the present is not rationality; it is a failure of imagination."*

  #### 2. The Argument from Probability (The "Truth and Probability" Objection)
  This is Ramsey's nuclear option. Frank Ramsey is one of the fathers of **subjective probability theory** (Bayesianism). He argued that probabilities are not objective features of the world waiting to be discovered; they are **degrees of belief** based on available evidence.

  Longtermism relies on **Expected Value (EV) Calculations**:
  $$ \text{Value} = \text{Probability of Existence} \times \text{Number of Future People} $$

  Since "Number of Future People" is huge (trillions), even a tiny reduction in risk yields massive EV.

  **Ramsey's specific critique:** He would tear apart the "Probability" variable.
  In *"Truth and Probability,"* Ramsey argues that for a probability to be meaningful, it must be grounded in a system of beliefs that can be tested or acted upon consistently. What is the objective probability of an AI catastrophe in 2150? Or an asteroid deflection in 3000?

  Ramsey would say: *"You are pretending to have a degree of belief that you cannot justify. When you multiply a concrete human good (saving a life now) by a probability so vague it is essentially unknowable (existential risk reduction over millennia), you are not doing math. You are doing theology."*

  He would argue that longtermists are suffering from **illusion of precision**. They are plugging "infinity" into an equation where the variables are undefined. For Ramsey, a probability without a basis in evidence is nonsense. Therefore, the Expected Value calculation collapses.

  #### 3. The Argument from "The Good" (The Moorean Objection)
  Ramsey was influenced by G.E. Moore, who argued that the "good" consists of specific states of affairs (like aesthetic enjoyment or personal affection).

  Longtermism is often aggregative (more good lives = better). Ramsey is more qualitative. He values the **actualization** of goods.
  *   **Longtermist:** A potential future life has moral weight because it *could* exist.
  *   **Ramsey:** A potential life is nothing. A *real* relationship is everything.

  Ramsey would argue that sacrificing definite, concrete goods (present suffering, current friendship, immediate justice) for indefinite, abstract goods (the potential of a future civilization) is a betrayal of what "good" actually means. The good must be *experienced* to count.

  ---

  ### Does Ramsey's Objection Hold Up?

  This is the critical part. Does Ramsey actually defeat Bostrom and Ord, or is he just expressing a human bias?

  #### Where Ramsey Wins: The Epistemic Check
  Ramsey's strongest point is the **probability critique**.
  Toby Ord, in *The Precipice*, admits that estimating existential risk is incredibly difficult. He assigns probabilities like "1 in 6" for AI risk this century.
  Ramsey would pounce on this. He would say: *"On what evidence is this ratio based? You have no frequency data. You have no historical precedent. This is not a probability; it is a guess dressed in mathematical clothing."*

  If the probability is unknowable, the "astronomical value" argument fails. You cannot justify ignoring present suffering based on a calculation that relies on guesswork about the year 3000. In this sense, Ramsey provides a necessary **epistemic humility** that longtermism often lacks. He forces the longtermist to admit they are acting on faith, not pure rationality.

  #### Where Longtermism Wins: The Scope Neglect Charge
  The longtermist comeback to Ramsey is strong, too. They would argue that Ramsey's "perspective" is just **cognitive bias** (scope neglect).
  *   **Ord's Counter:** "Ramsey says stars look small so they matter less. But if a star explodes and kills everyone, it matters a lot regardless of how big it looks. You are admitting that your brain is wired to ignore large numbers. Longtermism is the *correction* for that bug in human psychology."

  If you accept the premise that **a future life is worth as much as a present life** (impartiality), Ramsey's "perspective" argument looks like special pleading. Why does distance in time matter morally? If you could save a child in 10 years or a child today, most ethicists say you should be indifferent. Longtermists just extend that to 1,000 years. Ramsey's refusal to do so looks like an arbitrary cutoff.

  #### The "Weirder" Middle Ground
  However, Ramsey might force a compromise that is more sophisticated than either side currently admits.

  Ramsey wouldn't say "Ignore the future." He would say: **"Maximize expected value only within the horizon of meaningful probability."**

  He would propose a **discount rate based on uncertainty**, not time.
  *   It's not that future people matter less because they are in the future.
  *   It's that our ability to *affect* them positively (without causing unintended harm) diminishes as the causal chain gets longer.

  Ramsey would argue that trying to optimize for the year 3000 is likely to result in **negative value** because our models are too poor. We might prevent an AI risk but accidentally lock in a totalitarian regime that lasts a million years. Because our epistemic access is limited to the "foreground," our moral efforts should be concentrated there, not because the background doesn't matter, but because we are blind to it.

  ### Conclusion

  If you dropped Frank Ramsey into your EA club meeting:

  1.  **He would reject the core longtermist claim** that existential risk reduction *dominates* all other moral priorities.
  2.  **His reason:** Not because he doesn't care about the future, but because the **mathematical precision required to justify that claim is illusory.** He would call it "pseudo-mathematics."
  3.  **Would he be right?**
      *   **Yes,** on the epistemology. Longtermism often glosses over how impossible it is to predict the far future. Ramsey's probability theory shows that you can't build a moral imperative on undefined variables.
      *   **No,** on the ethics. If we *did* know the future with certainty, Ramsey's "perspective" argument would fail. If you knew for a fact that a button press would save a trillion lives, Ramsey's appeal to "human scale" would look like selfishness.

  **The Synthesis:** Ramsey saves longtermism from itself. He forces longtermists to stop claiming they have *calculated* the best path and admit they are making a **bet**. And if it's a bet, Ramsey would argue it is irrational to bet the entire present on a payout that is this uncertain.

  You can tell your friends: Ramsey wouldn't say the future is irrelevant. He would say that **treating the future as a number to be maximized destroys the very human values that make the future worth having.**
