answer: |-
  1. **The Kantian Shopkeeper Distinction**
  Kant famously argues that the honest shopkeeper who charges fairly only to protect his reputation lacks moral worth, even if his action aligns with duty. Your view requires being moved by the considerations that *make* the act right. How does your account decisively distinguish an agent who cares about a right-making feature (like "this person trusts me") from the shopkeeper, who might care about "trust" only instrumentally, as a means to profit?
  *   **Likely Answer:** She will argue the shopkeeper is moved by *profit*, not the *normative force* of the customer's claim or the value of honesty itself.
  *   **Follow-up:** If the shopkeeper genuinely believes that profit *just is* the primary reason to be honest in business, has he not conceptually merged the right-making feature with self-interest? How do you police that boundary without demanding agents parse their own psychology with impossible precision?

  2. **Moral Fetishism and Huckleberry Finn**
  Michael Smith charges that caring about "rightfulness" itself is a kind of moral fetishism; we should care about people, not morality. Yet, Huckleberry Finn helps Jim escape while believing he is doing wrong, lacking any explicit moral reasoning. Does your view escape Smith's charge by focusing on right-making features (like Jim's freedom) rather than "duty," and does that mean Huck qualifies as morally worthy despite his mistaken moral beliefs?
  *   **Likely Answer:** She will likely say yes; Huck is moved by Jim's welfare (a right-making feature), so he has moral worth, avoiding fetishism.
  *   **Follow-up:** If Huck's motivation is purely affectionate preference rather than a recognition of Jim's *claim* to freedom, does your view risk collapsing moral worth into mere personal attachment? Where is the line between loving a friend and acknowledging their moral standing?

  3. **The Wallet Case: Mixed Motives**
  I want to put my own case to you: I returned a wallet partly because I cared about the owner's loss, but also because I saw a security camera and wanted to look good. On your account, does the presence of a self-regarding motive (reputation) dilute the moral worth generated by the other-regarding motive, or can they coexist unharmed as long as the right-making feature was *a* sufficient cause?
  *   **Likely Answer:** She will likely argue that moral worth is not an all-or-nothing property and that mixed motives are permissible if the right-making reason was operative.
  *   **Follow-up:** If the reputation motive was actually the *tipping point* that got you moving when you otherwise wouldn't have, does that make the right-making feature merely incidental? Does the "sufficient cause" test require the moral reason to work *independently* of the selfish one?

  4. **The Threshold of Dilution**
  Following up on mixed motives: Is there a threshold where self-interest crowds out moral worth entirely? If I return the wallet primarily to feel superior, but I also acknowledge the owner's need, have I lost moral worth? Or does your view imply that almost any honest act has *some* moral worth, provided the agent isn't completely blind to the right-making features?
  *   **Likely Answer:** She will likely posit a "primary motive" or "dominant reason" threshold.
  *   **Follow-up:** Since agents are notoriously bad at identifying their primary motives, does your view make moral worth largely unknowable to the agent themselves, turning it into a verdict for observers rather than a guide for living?

  5. **Epistemic Access to Right-Making Features**
  Your view hinges on the agent being moved by the considerations that *actually* make the act right. But what if an agent is moved by a feature they *believe* is right-making, which turns out to be false? If I return the wallet because I believe it brings good karma, not because it respects property rights, do I lack moral worth on your account?
  *   **Likely Answer:** She will likely distinguish between the *content* of the reason and the agent's *conceptualization* of it.
  *   **Follow-up:** If the agent's conceptual framework is deeply flawed (e.g., returning the wallet only to avoid a curse), are they truly responsive to the *moral* reality, or just to their own superstition that happens to align with it?

  6. **Emotional Resonance vs. Cognitive Recognition**
  You mention the agent need not conceive of considerations in "moral terms." Does this require an emotional resonance with the right-making feature? If a cold, calculating agent returns the wallet solely because "efficiency dictates minimizing loss," without any empathy for the owner, do they satisfy your condition, or is there an affective requirement to truly be "moved"?
  *   **Likely Answer:** She will likely argue that cognitive recognition of the reason is sufficient, without specific emotional qualia.
  *   **Follow-up:** If emotion isn't required, how do you distinguish your view from a sophisticated form of consequentialist calculation, which many argue strips the agent of the personal engagement we typically associate with moral praise?

  7. **Moral Development and Habituation**
  If we accept that self-regarding motives (like my desire to look good on camera) can coexist with moral worth, does this suggest a developmental path? Could we encourage moral behavior by appealing to reputation or reward, hoping agents eventually become sensitive to the right-making features themselves, or does that instrumentalization corrupt the process?
  *   **Likely Answer:** She will likely endorse a habituation model where external motives can train attention toward right-making features.
  *   **Follow-up:** At what point in that development does the moral worth "kick in"? Is there a moment where the agent shifts from acting for reward to acting for the feature, or is it a gradual spectrum where worth increases proportionally?

  8. **Counterfactual Dependence**
  Consider my wallet case again. If the security camera had been broken or absent, would I still have returned the wallet? If the answer is "no," does that retroactively strip the act of moral worth, even if I *was* also thinking about the owner's loss at the time? Does your view require that the agent would have acted on the right-making feature *even in the absence* of the self-interested one?
  *   **Likely Answer:** She will likely argue for a counterfactual test: the moral reason must be robust enough to sustain the action alone.
  *   **Follow-up:** That seems to demand a level of psychological stability most humans lack. Are we to say that most "good deeds" done under social scrutiny lack moral worth because we can't prove we'd do them in the dark?

  9. **Moral Luck and Outcome**
  Your account focuses on the agent's motives regarding right-making features. But suppose I try to return the wallet, moved entirely by the owner's need, but I accidentally drop it in a puddle, ruining the cash. Have I lost moral worth due to bad outcome luck, or does your view insulate worth entirely from consequences, focusing strictly on the orientation toward the right-making features at the moment of action?
  *   **Likely Answer:** She will likely insulate moral worth from outcome luck, focusing on the motivation.
  *   **Follow-up:** If worth is insulated from outcomes, does that sever the link between moral worth and moral *responsibility*? Can we be praiseworthy for an act that ultimately causes harm, provided our orientation toward the right-making features was correct?

  10. **The Falsification Condition**
  Finally, every philosophical view must have limits. What specific thought experiment or real-world case would force you to abandon this account of moral worth? Is there a scenario where an agent is clearly moved by the right-making features, yet you would intuitively refuse to grant them moral worth, or vice versa?
  *   **Likely Answer:** She might suggest a case of "accidental alignment" where the agent is moved by a feature that is right-making only by coincidence.
  *   **Follow-up:** If such a case exists, does it imply that your view ultimately relies on a hidden appeal to traditional virtue or duty to validate which features count as "right-making," thereby circling back to the very frameworks you aim to refine?
