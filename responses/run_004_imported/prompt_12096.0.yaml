      *   *ICMJE Criterion 2:* "Drafting or revising critically." *No.*
      *   *ICMJE Criterion 4:* "Accountability." Can the labmate defend the study design? *No.*
      *   *Verdict:* This sounds like technical support, not intellectual partnership.

  5.  **Address the "Cutoff" Fallacy:**
      *   The labmate thinks it's a spectrum of *effort*.
