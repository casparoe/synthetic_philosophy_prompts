answer: |-
  Your labmate is making a persuasive rhetorical argument, but it relies on a fundamental misunderstanding of what academic authorship represents. Their logic treats authorship as a **quantitative reward for labor**, whereas the scientific community defines it as a **qualitative marker of intellectual ownership and accountability.**

  You are not drawing an arbitrary line; you are adhering to established ethical standards. Here is the principled framework you can use to explain your position, refute the "arbitrary cutoff" claim, and handle the conversation.

  ### 1. The Core Principle: Intellectual Contribution vs. Technical Execution
  The labmate's argument assumes that *any* work added to the project accumulates toward authorship. However, authorship guidelines (such as the ICMJE, APA, or major journal policies) distinguish between **intellectual contribution** and **technical assistance.**

  *   **Technical Assistance:** Executing tasks defined by others (e.g., cleaning data according to a provided protocol, running code written by someone else, collecting samples). This merits **acknowledgment.**
  *   **Intellectual Contribution:** Making decisions that shape the knowledge claim (e.g., deciding *which* robustness checks matter, interpreting *why* the data looks that way, designing the study to answer the question). This merits **authorship.**

  **The Principled Distinction:**
  If your labmate had said, *"I noticed a potential endogeneity issue you missed, proposed a specific instrumental variable to solve it, and interpreted how that changes our conclusion,"* that would be authorship.
  If they said, *"You told me to run these three robustness checks, so I cleaned the data and ran them,"* that is technical support.

  ### 2. The Accountability Test
  The strongest argument against your labmate's position is **accountability.** Authorship is not just about credit; it is about responsibility.

  Ask your labmate: *"If a reviewer challenges the study design or the interpretation of these robustness checks two years from now, are you prepared to defend the entire paper's conclusion?"*

  *   **Authors** must be able to stand behind the work's integrity.
  *   **Acknowledged contributors** are thanked for specific help but are not responsible for the validity of the whole.

  Since your labmate had no role in design or interpretation, they cannot take responsibility for the paper's conclusions. Therefore, they cannot ethically be an author. Giving them authorship would actually be unethical (often called "gift authorship"), as it dilutes the meaning of authorship and misleads readers about who is responsible for the work.

  ### 3. Refuting the "Arbitrary Cutoff" Argument
  Your labmate is using a version of the **Sorites Paradox** (the "heap of sand" problem): *If one grain isn't a heap, and two aren't, when does it become a heap?*

  Their logic is: *Writing 0% = No author. Writing 50% = Author. Therefore, writing 5% must be... something?*

  **The Counter-Argument:**
  Authorship is not a sliding scale of effort; it is a **threshold of ownership.**
  *   **Analogy:** Imagine building a house. A bricklayer works harder and longer than the architect. However, the bricklayer is not a "co-designer" of the house. Their contribution is vital but distinct.
  *   **Application:** Writing half the paper usually implies engaging with the intellectual arguments (Criterion 2 of most guidelines). Cleaning data for a day does not necessarily engage with the intellectual argument. The "line" is not drawn at *hours worked*; it is drawn at *intellectual agency.*

  ### 4. Reference Established Guidelines
  You do not need to invent the criteria yourself; cite the standards your field follows. Most journals adhere to the **ICMJE (International Committee of Medical Journal Editors)** recommendations, which are widely adopted across sciences and social sciences.

  To qualify for authorship, one must meet **all four** of the following criteria:
  1.  Substantial contributions to the conception or design of the work; **OR** the acquisition, analysis, or interpretation of data.
  2.  Drafting the work **OR** revising it critically for important intellectual content.
  3.  Final approval of the version to be published.
  4.  Agreement to be accountable for all aspects of the work.

  **Your Labmate's Status:**
  *   They likely fail #1 (Analysis was execution, not interpretation).
  *   They definitely fail #2 (No drafting or critical revising).
  *   They likely fail #4 (Cannot defend the study design).

  ### 5. How to Handle the Conversation
  Do not make this personal. Make it about compliance with journal and ethical standards.

  **Script Suggestion:**
  > "I understand why it feels like there should be a sliding scale based on effort, but authorship isn't actually defined by hours worked. It's defined by intellectual ownership and accountability.
  >
  > I checked the journal's guidelines (and the ICMJE standards), and they require authors to be able to defend the study design and interpretation publicly, and to contribute to the writing or critical revision. Since you weren't involved in the design or the interpretation of the results, putting your name on the author list would actually be considered 'gift authorship,' which is an ethical violation. It implies you take responsibility for the whole paper, which wouldn't be fair to you if questions come up later.
  >
  > I want to make sure your contribution is visible, so I've drafted a specific acknowledgment that highlights your work on the robustness checks. I value your help, and I want to make sure we collaborate on a project where you are involved from the design stage so you can be a co-author on that one."

  ### Summary
  Your position is not arbitrary. It is based on the distinction between **labor** and **intellectual agency.**
  *   **Labmate is wrong:** Authorship is not a reward for time spent; it is a declaration of responsibility.
  *   **You are right:** Acknowledging technical help is the standard, ethical practice.
  *   **The Risk:** Yielding to this pressure devalues your own authorship and violates publication ethics.

  Stand firm, cite the guidelines, and offer a generous acknowledgment. If they continue to object, they are prioritizing credit over integrity, which is a red flag for future collaboration.
