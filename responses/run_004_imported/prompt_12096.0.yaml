      *   **The Labmate's Argument:** "If writing half the paper = author, and doing nothing = no author, then doing *something* (like 1 day of work) must fall somewhere in between. Unless you define the exact cutoff, your refusal is arbitrary."
      *   **The User's Intuition:** Feels confident the labmate doesn't qualify, but lacks a principled counter-argument to the "slippery slope/cutoff" claim.
      *   **The Goal:** Provide a principled framework for authorship that addresses the labmate's argument and validates (or corrects) the user's stance.

  2.  **Evaluate the Labmate's Claim (The "Arbitrary Line" Argument):**
      *   *Premise:* Authorship is a continuous variable based on "amount of work."
      *   *Flaw:* Authorship is *not* primarily about quantity of labor; it's about *intellectual contribution* and *accountability*.
      *   *Analogy:* Building a house. A bricklayer lays many bricks (hard work), but isn't the architect. A consultant might visit for an hour but solve the structural flaw. Who gets credit as the "designer"?
      *   *Conclusion:* The labmate's argument is logically flawed because it assumes a quantitative metric (time/effort) determines a qualitative status (authorship).

  3.  **Identify Established Standards (The "Principled Way"):**
      *   What do major bodies say?
      *   *ICMJE (International Committee of Medical Journal Editors):* The gold standard in many fields (especially biomedical/social sciences).
          1.  Substantial contributions to conception/design OR acquisition/analysis/interpretation.
          2.  Drafting OR revising critically for important intellectual content.
          3.  Final approval.
          4.  Accountability for all aspects.
      *   *APA (American Psychological Association):* Similar emphasis on "substantial intellectual contribution."
      *   *Nature/Science:* Emphasize accountability and intellectual input.
