answer: |-
  You can tell Alex to buy the next round, because on the specific historical facts, **you are right and Alex is wrong.**

  Alex has latched onto a very real aspect of Hobbes's philosophy (his love of geometry) but has gotten the historical record and the philosophical implications backward. Here is the breakdown you need to settle the bet, divided into the Math History and the Philosophical Method.

  ### 1. The Math: Did Hobbes Square the Circle?
  **Short Answer:** No. Absolutely not.

  **The Details:**
  *   **Impossible Task:** "Squaring the circle" (constructing a square with the same area as a given circle using only a finite number of steps with a compass and straightedge) was proven mathematically impossible in 1882 when Ferdinand von Lindemann proved that $\pi$ is a transcendental number. It was impossible in Hobbes's time, too; it just hadn't been formally proven yet.
  *   **Hobbes's Attempt:** Hobbes did publish an attempted solution in *De Corpore* (1655). He was proud of it. He was wrong.
  *   **The Wallis Beef:** John Wallis was not a "jealous Oxford guy." He was the Savilian Professor of Geometry at Oxford and one of the preeminent mathematicians of the 17th century (a founder of the Royal Society). Wallis thoroughly dismantled Hobbes's proofs, pointing out elementary errors.
  *   **The Obsession:** This wasn't a one-off disagreement. Hobbes became obsessed. For the next 20+ years, he published pamphlets attacking Wallis, and Wallis would calmly debunk them. By the end of his life, Hobbes's contemporaries viewed his mathematical claims as the ramblings of a stubborn old man. Even his friends (like the Earl of Devonshire) tried to get him to stop talking about it because it was damaging his reputation.

  **Tiebreaker Point:** Hobbes was a brilliant philosopher, but he was an amateur mathematician. His reputation among the scientific elite of his day (like Boyle and Wallis) suffered significantly *because* of his mathematical errors, not because they were jealous.

  ### 2. The Philosophy: Is *Leviathan* as Certain as Geometry?
  **Short Answer:** Hobbes *wanted* it to be, but it isn't. Alex is confusing Hobbes's *aspiration* with his *achievement*.

  **The Details:**
  *   **The Geometrical Method:** Alex is correct that Hobbes was inspired by Euclid. Hobbes famously discovered Euclid's *Elements* late in life (around age 40) and was amazed by the certainty of deductive reasoning. He wanted to apply this "resolutive-compositive" method to politics: break society down to its basic elements (men), understand their motion (passions), and build back up to the State (Leviathan).
  *   **The Flaw in the Transfer:** In geometry, definitions are stipulative and universally agreed upon (e.g., "a triangle is a three-sided figure"). In politics, the "definitions" are contested.
      *   Hobbes defines the "State of Nature" as a war of all against all.
      *   Critics (like Locke later, or modern anthropologists) argue this premise is false.
      *   If the premises are debatable, the conclusion cannot have the same certainty as the Pythagorean theorem, even if the logic is valid.
  *   **Hobbes's Own Admission:** Ironically, Hobbes admits this himself. In *Leviathan*, he notes that geometry is certain because men do not disagree about the definitions of lines and circles. However, in civil philosophy, men disagree about definitions because their **passions** and **interests** are involved. People argue about what is "Just" or "Sovereign" because it benefits them to do so. Therefore, political philosophy can never achieve the *exact* same certainty as geometry.
  *   **The Critics:** Alex claims critics are "missing the point" by picking apart the sovereignty argument. This is false. The "point" of political philosophy is to examine the premises. If Hobbes's geometry of power is built on a faulty definition of human nature, the proof fails. Critics aren't missing the method; they are challenging the axioms.

  ### 3. Why Alex's Argument is Tempting (But Wrong)
  Alex is making a category error common in undergrad seminars. It is true that Hobbes's *rhetorical style* is geometric. He writes in a way that feels like a proof: "If X, then Y." He wants the reader to feel the inevitability of Absolute Sovereignty.

  However, the fact that Hobbes *failed* at actual mathematics (squaring the circle) actually undermines Alex's point. It suggests that Hobbes's confidence in his "scientific" method was partly hubris. He thought he had discovered a universal key to truth (geometry) that he could apply to everything. His failure in math suggests he overestimated the applicability of that method to the messy real world.

  ### Summary for Your Next Pub Session
  Here is your "Cheat Sheet" to drop on Alex:

  1.  **On Math:** "Hobbes didn't square the circle; it's mathematically impossible. Wallis wasn't jealous, he was right. Hobbes's mathematical errors were so bad they actually hurt his reputation with the Royal Society."
  2.  **On Method:** "Hobbes *aspired* to geometric certainty, but he admits in *Leviathan* that political definitions are disputed by passion, unlike geometric definitions. The logic might be valid, but the axioms are contestable."
  3.  **On Critics:** "Critics aren't missing the point; they are doing exactly what you do in a geometric proof: checking the axioms. If the definition of the 'State of Nature' is wrong, the theorem doesn't hold."
  4.  **The Irony:** "If Hobbes's political philosophy relied on his mathematical genius to be valid, we'd have to throw it out. Luckily, *Leviathan* stands on its political insights, not its geometry."

  **Verdict:** You win. Hobbes was a giant of political philosophy, but a delusional mathematician. The "geometrical method" is a useful metaphor for his style, but it does not grant his political conclusions the status of mathematical proof.
