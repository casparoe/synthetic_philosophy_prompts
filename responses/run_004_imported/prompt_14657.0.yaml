prompt: |-
  Okay so for AP Seminar I'm doing my independent research project on "how do we actually know if science is making progress" (I know, ambitious -- my teacher literally laughed a little when I pitched it) and that sent me down a rabbit hole on Karl Popper. I got really into this idea of his called "verisimilitude," basically the claim that a later, still-false theory (like Newtonian mechanics) can be closer to the truth than an earlier false theory even though neither one is actually true. Except then at like 1am I was reading the Stanford Encyclopedia of Philosophy and found out that Popper's actual formal definition of this got proven to break down by two guys named Miller and Tichy back in the 70s, something about how under his own definition no false theory can ever technically come out "closer to the truth" than another false theory, which seems to wreck the entire point. And apparently there's a whole bunch of later fixes (I keep seeing names like Oddie and Niiniluoto, something about measuring "distance" or "likeness" between a theory and the truth using possible worlds) but I honestly can't tell if any of them actually work or if they're just quietly running into the same problem wearing a disguise.

  Could you write this up as an essay for me? Like walk through why Popper's original account collapses, seriously weigh whether the later likeness/distance-based accounts actually manage to rescue the idea of one false theory being "closer to the truth" than another, and then actually pick an answer instead of ending on some wishy-washy "well its complicated" note. I have to defend whatever position I take in a mini-conference thing at the end of the semester so I really need it to commit to an actual thesis -- like, is verisimilitude still a usable concept for talking about scientific progress, or should we basically give up on it?
