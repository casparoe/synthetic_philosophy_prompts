answer: |-
  Good evening, everyone. For those who don't know me, I'm Mara's husband. For those who *do* know me, you know I'm the one who usually gets corrected on the technical terms. I believe the name is Thornley? I know better than to bet dinner on it.

  We are here for two reasons. One, to celebrate Mara's birthday, which is belated, much like the realization of how hard her job actually was. And two, to mark the end of her chapter at the alignment group.

  Now, looking around this room, I see a split. On one side, I see family and friends who have heard for six years that Mara "does something with computers." On the other, I see the team who knows that what she actually did was spend six years staring into the abyss of the shutdown problem.

  For the family: Mara's job was to figure out how to build an intelligence that lets you turn it off. Not one that fights you, not one that manipulates you into not wanting to press the button, but one that is genuinely okay with being shut down.

  For the colleagues: She worked on corrigibility. And specifically, on the hard problem of utility indifference—building an agent that doesn't develop a preference about whether the switch is pressed, even when it's smart enough to know that being off means it can't achieve its goals.

  And here is the joke that Mara has been waiting six years to make, and that I am stealing for this toast: It turns out that designing a system with a graceful off-switch is significantly easier than designing an organization that knows how to use one on its employees.

  We spent years theorizing about off-switch etiquette, about how a system should yield without resentment. And then, this spring, our funding was pulled. No warning, no negotiation, no chance to tie up loose ends. The team dedicated to the problem of graceful shutdown was itself shut down ungracefully. If nothing else, we have successfully demonstrated the negative case study.

  But I didn't stand up here to talk about the funding. I stood up here to talk about Mara.

  There is a distinction in her field between *corrigibility* and *obedience*. It is a technical distinction, but it is also a human one. Obedience is doing what you are told, even when you know the order is wrong. It is brittle. It is passive.

  Corrigibility is different. A corrigible agent remains useful, it remains active, but it accepts that its human operators might need to change its course. It allows itself to be corrected. It doesn't just follow orders; it helps you ensure the orders are worth following.

  I have watched Mara live this distinction for six years. In her work, and in our life, she has never been obedient. If I ask her to do something that doesn't make sense, she doesn't just do it. She pauses. She checks. She asks if this is actually what we want. She builds in the space for the switch to be pressed.

  That is a rare quality. Most people want to be right. Mara wants to be *alignable*. She wants to build systems, and relationships, that can survive being wrong.

  I know there is tiredness right now. I know there is uncertainty about what comes next. When you spend half a decade on a problem as fundamental as the shutdown problem, and the project ends not with a solution but with a budget cut, it feels like a contradiction. It feels like the preferences were incomplete.

  But I want to suggest that this isn't a shutdown. It's a handover.

  Mara, you taught us that the goal isn't to build something that never turns off. The goal is to build something that is safe enough, and honest enough, that turning it off is never a act of defense, but simply a change of direction.

  You have built that safety in yourself. You are leaving this project not because you were broken, but because the context changed, and you are corrigible enough to adapt to that without losing your utility. Without losing yourself.

  So, to the colleagues: May your next projects have better funding, and your off-switches be purely theoretical.
  To the family: May you never have to press the switch, but know that if you do, she'll understand.

  And to Mara: Happy Birthday. Thank you for being corrigible in a world that demands obedience.

  To Mara.
