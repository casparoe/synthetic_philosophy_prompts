answer: |-
  The debate over Frankfurt cases is often treated as a stalemate, but I contend that this pessimism is unwarranted. The original Frankfurt cases were indeed vulnerable to the Widerker-Kane Dilemma Defense, but the "blockage" or "no-sign" variants developed by Alfred Mele, David Robb, and Derk Pereboom successfully close that loophole. These cases do not merely patch a hole; they fundamentally shift the terrain of the debate from the *availability of alternatives* to the *source of the actual action*.

  I argue that blockage-style Frankfurt cases succeed in refuting the Principle of Alternative Possibilities (PAP) as a necessary condition for moral responsibility. They achieve this by constructing a scenario where alternative possibilities are metaphysically eliminated without the actual decision being causally determined by the elimination mechanism. The Dilemma Defense fails against these cases because it conflates the *causal sufficiency of the actual sequence* with the *modal robustness of the counterfactual sequence*.

  ### The Failure of the Sign and the Promise of Blockage

  To see why blockage cases succeed, we must acknowledge why the original Frankfurt cases failed. The original design relied on a "prior sign" (e.g., a blush or a neural blip) that indicated what Jones would do. Widerker and Kane correctly identified that this sign was the weak link. If the sign causally determined the choice, the case assumed determinism (begging the question against libertarians). If it didn't, Jones could have had the sign but chosen otherwise (preserving PAP).

  Blockage cases remove the epistemic/predictive element entirely. In a Mele-Robb style case, Jones has a neural decision node. Unbeknownst to him, a device is installed that *blocks* all neural pathways leading to any choice other than A. The device does not *cause* Jones to choose A; it merely renders the neural realization of ~A impossible. Jones deliberates and chooses A for his own reasons. The device remains idle.

  This structure escapes the Dilemma Defense cleanly:
  1.  **It avoids Horn 1 (Determinism):** The blockage mechanism does not causally determine the actual choice. Jones's choice of A arises from his own reasons-responsive process. The blockage is a counterfactual constraint, not an actual cause. Therefore, the case does not assume that the *actual decision* is determined.
  2.  **It avoids Horn 2 (Flickers of Freedom):** Because there is no prior sign relied upon for prediction, there is no gap between the sign and the decision where an alternative could sneak in. The blockage is stipulated to be metaphysically absolute. Jones literally *cannot* choose ~A. There is no "robust" alternative possibility remaining.

  By severing the link between the intervener and the actual causal history of the action, blockage cases isolate the intuition that moral responsibility tracks *actual sequence sourcehood*, not *counterfactual openness*. If Jones is responsible in the blockage case (where he acts on his own), and the only difference between that case and a case where he couldn't act on his own is the presence of the idle blockage, then the inability to do otherwise is not what drives our responsibility judgments.

  ### The Strongest Objection: The "Guarantee implies Determinism" Charge

  However, to claim victory is premature. The most potent objection against the blockage strategy is a refined version of the Dilemma's first horn, which I will call the **"Guarantee implies Determinism" objection**.

  The critic argues that for a blockage case to work, the blockage must be *guaranteed* to work. If there is any chance Jones could bypass the block, he retains an alternative possibility, and PAP stands. But if the blockage is guaranteed to work, the critic contends, the setup must be governed by deterministic laws. If the laws governing the blockage are deterministic, and the blockage ensures outcome A, then the *scenario as a whole* is deterministic.

  Consequently, the objection runs, the blockage case has not shown that moral responsibility is compatible with the *absence of alternatives in an indeterministic world*. It has only shown that responsibility is compatible with determinism. But compatibilists already believe that! The libertarian incompatibilist maintains that if determinism is true, there is no responsibility. By relying on a guaranteed blockage, the Frankfurt proponent is simply assuming a deterministic framework to prove a point against libertarians, which is question-begging. In short: **You cannot have a guarantee of no-alternatives without determinism, and if you have determinism, you haven't refuted the libertarian claim that determinism kills responsibility.**

  ### Rebuttal: Local Constraint vs. Global Determinism

  This objection fails because it conflates the *determinism of the constraint* with the *determinism of the choice*. It assumes that for an alternative to be truly blocked, the entire causal chain leading to the agent must be determined. This is false.

  We can construct an indeterministic blockage case. Imagine Jones's decision process is genuinely indeterministic (as libertarians require). At the moment of choice, there is an objective probability that he chooses A or ~A. However, the blockage device is designed to intervene *only if* the indeterministic process begins to trend toward ~A. Crucially, the *trigger* for the blockage can be indeterministic, or the blockage itself can be a "hard wall" that exists within an otherwise indeterministic system.

  Consider the analogy of a mouse in a maze. The maze has only one exit (A). The walls blocking exit (B) are solid. The mouse's movement *within* the path to A can be entirely erratic, indeterministic, and free from prior causation. The fact that the wall *deterministically* prevents exit B does not mean the mouse's movement toward A is *determined*. The wall constrains the *space of possibilities*, but it does not determine the *actual path* taken within the remaining space.

  The libertarian objection relies on the intuition that if you *cannot* do otherwise, you are a puppet. But the blockage case demonstrates that the "inability" can be external and counterfactual. In the actual sequence, Jones is not a puppet; he is an agent. The fact that a puppet-master *would have* pulled strings if Jones had tried to resist is irrelevant to the fact that Jones *did not* resist and acted on his own.

  The "Guarantee implies Determinism" objection ultimately begs the question against the **Actual Sequence Intuition**. It assumes that the *presence* of a guarantee (the blockage) contaminates the actual sequence enough to destroy responsibility. But this is precisely what is up for debate. The Frankfurt proponent argues that responsibility supervenes on the actual sequence properties (reasons-responsiveness, sourcehood). If the actual sequence is untouched by the blockage, the agent remains the source.

  To insist that the *mere existence* of a counterfactual blocker destroys responsibility is to abandon the actual sequence and return to a leeway incompatibilism that Frankfurt has already challenged. The blockage case forces the libertarian to admit that either:
  1.  Jones is not responsible in the blockage case (which contradicts strong intuitions about his actual sequence autonomy).
  2.  Jones is responsible, in which case PAP is false (since he had no alternatives).

  The libertarian cannot simply assert that the blockage makes the world deterministic without pointing to a specific causal determinant in the *actual* sequence. Since the blockage is counterfactual, there is no such determinant. Therefore, the blockage case succeeds in creating a scenario where an agent is morally responsible despite having no alternative possibilities, even in an indeterministic context.

  ### Conclusion

  The Widerker-Kane Dilemma Defense was a formidable challenge to the original Frankfurt cases, but it relied on the specific machinery of "prior signs." Blockage cases dismantle this machinery. By replacing prediction with prevention, they ensure that alternative possibilities are genuinely absent without rendering the actual decision causally determined.

  The strongest objection—that effective blockage implies a deterministic framework—fails to distinguish between the modality of the constraint and the causality of the action. An agent can be free in the actual sequence even if the counterfactual sequence is walled off. Consequently, blockage-style Frankfurt cases succeed in their original mission: they demonstrate that the Principle of Alternative Possibilities is not a necessary condition for moral responsibility. The locus of responsibility is not what we *could* have done, but what we *did* do and how it came about.
