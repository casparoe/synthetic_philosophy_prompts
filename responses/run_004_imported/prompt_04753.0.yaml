answer: |-
  Good evening. To the graduating class, to your families who have supported you through late-night study sessions and early morning clinicals, and to my colleagues—including the two philosophers I see sitting quietly in the back row, waiting to see if I get this right—welcome.

  There is a specific weight to a nursing pin. It is small, but it carries the gravity of trust. When you wear it, you are telling the world that you can be relied upon to act correctly when it matters most.

  But what does it mean to act correctly?

  Early in your training, we test you. We give you scenarios, and we ask for the right answer. Recently, in one of our pharmacology exams, a student arrived at the correct dosage for a high-risk medication. On paper, the number was perfect. It would have saved the patient. But when a preceptor later asked her to walk through *how* she got there, the path was wrong. She had used a formula that didn't fit the physiology. She had arrived at the truth, but she had taken a wrong turn to get there.

  Fortunately, she was caught. She learned. She is likely in this room today, safer and wiser for the correction. But that moment left me thinking about a question asked twenty-four hundred years ago by Socrates.

  In the dialogue *Meno*, Socrates poses a puzzle about a road to a place called Larissa. He asks: If you need to get to Larissa, and I guide you there, does it matter if I actually know the way, or if I just have a lucky guess about which road to take?

  If we take the guess, we arrive. If we take the knowledge, we arrive. On that single trip, the result is identical. So, Socrates asks, why do we prize knowledge so much higher than a lucky correct belief?

  It is a question that could easily belong in a philosophy seminar, but I submit to you that it is the central question of nursing.

  Socrates gives a beautiful answer. He says that true opinions—the lucky guesses—are like the magnificent statues of the craftsman Daedalus. They are beautiful and valuable, but they have a flaw: they are not fastened down. If you leave them untethered, they run away like slaves. They escape your mind.

  Knowledge, Socrates says, is true opinion that has been tethered. It is tied down by an understanding of the *reason why*.

  For a nurse, the difference between the guess and the tethered truth is not academic. It is the difference between safety and risk.

  When you are on the floor, rested, with your textbook open, a lucky guess might hold. But nursing is not practiced in a vacuum. It is practiced at 3:00 AM, during a code, when the monitor is alarms, the family is crying, and you are tired. In those moments, untethered opinions run away. Memory fails. Formulas blur.

  If your correct action is only a guess, it will abandon you when the pressure rises. But if your action is tethered—if you understand the pharmacokinetics, the pathophysiology, the *reason why* the dose is what it is—that knowledge stays. It holds fast.

  To the families here tonight: You have entrusted your loved ones to this profession. You want a nurse who doesn't just happen to be right. You want a nurse whose correctness is tied down by an unshakeable account of why they are doing what they are doing.

  To the graduates: You have spent years building those tethers. Every time you asked "why?" instead of just "what?", you were tying down a statue. Every time you corrected a misunderstanding in clinical, you were securing the rope.

  The pin you receive tonight is not just a symbol of skill. It is a symbol of that tether. It signifies that you are no longer satisfied with merely arriving at Larissa. You are committed to knowing the map.

  Socrates taught that knowledge is more honorable than opinion because it abides. In our profession, "abiding" isn't just a philosophical virtue. It is the pulse of the patient. It is the stability of the care.

  So, as you step into your careers, do not be content with being right. Be content with knowing *why* you are right. Because when the road gets dark, and the way to Larissa is no longer clear, a lucky guess will run away. But knowledge? Knowledge will stay with you. And it will stay with the patients who depend on you.

  Congratulations, class. Go forth and be tethered.

  Thank you.
