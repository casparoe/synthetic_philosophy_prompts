answer: |-
  This is a fantastic starting point. First off, your intuition about the couch is spot-on: you have independently rediscovered one of the central problems in the philosophy of social action. The feeling that "a 'we' was steering the couch" is exactly the phenomenon philosophers call **collective intentionality**.

  You have also done your homework correctly. Michael Bratman and Margaret Gilbert are indeed the titans of this debate. John Searle is the third major figure, but as you noted, he treats "we-intentions" as biological primitives (like vision or hunger), which stops analysis before it starts. Bratman and Gilbert both want to *analyze* the "we," but they disagree fundamentally on what the analysis looks like.

  Here is the breakdown of the rivalry, how they apply to your couch, and where the debate currently stands.

  ---

  ### 1. The Common Ground (Where They Agree)
  Before they fight, Bratman and Gilbert agree on what they are *not* doing.
  *   **Against Summation:** They agree that joint action isn't just two people doing the same thing at the same time (like two strangers running for the same bus).
  *   **Against Mysticism:** Neither thinks there is a literal group mind or a mystical hive consciousness. They are both methodological individualists in the sense that they don't believe in spooky metaphysics.
  *   **Common Knowledge:** Both agree that for joint action to occur, there must be "common knowledge" (I know that you know that I know...) regarding the activity.
  *   **Responsiveness:** Both agree that the participants must be mutually responsive to each other's actions (your micro-adjustments on the stairs).

  ### 2. Michael Bratman: Shared Intentional Activity (SIA)
  **The Core Idea:** Reductionism.
  Bratman argues that we don't need a new kind of mental state ("we-intend"). We can explain joint action using standard, individual intentions ("I-intend"), provided they are structured in a specific way.

  **The Mechanics:**
  For us to "intend to carry the couch," the following must be true:
  1.  **I intend** that *we* carry the couch.
  2.  **You intend** that *we* carry the couch.
  3.  **Interlocking:** I intend that we carry it *because* I know you intend it, and vice versa.
  4.  **Meshing Sub-plans:** My plan for how to hold the couch fits with your plan. If I plan to tilt left and you plan to tilt right, we don't have shared intention until we resolve that.
  5.  **Responsiveness:** We track each other's actions to ensure the plan stays meshed.

  **The Normativity (Obligation):**
  For Bratman, the obligation is **derivative**. If I suddenly let go of the couch, I have frustrated your reliance on me. I have acted inconsistently with my own stated intention. You might be angry, and I might be blameworthy, but that blame comes from general moral principles about reliance and cooperation. There is no *special* obligation created solely by the joint action itself.

  ### 3. Margaret Gilbert: Plural Subject Theory (PST)
  **The Core Idea:** Non-Reductionism.
  Gilbert argues that Bratman's "interlocking I-intentions" are not enough. You can have interlocking intentions without truly acting together (e.g., I intend to push the car, you intend to push the car, we both know it, but we haven't actually agreed to do it *together*).

  **The Mechanics:**
  To act together, we must form a **Joint Commitment**.
  1.  **Expression:** We must each express readiness to enter this commitment (this can be non-verbal, like both grabbing the couch handles simultaneously).
  2.  **The Plural Subject:** Once committed, we become a "plural subject." We are no longer just two individuals; we are one unit of agency.
  3.  **Indivisibility:** The commitment cannot be rescinded unilaterally. I cannot decide to stop being part of the "we" without your say-so.

  **The Normativity (Obligation):**
  For Gilbert, the obligation is **constitutive**. The moment the joint commitment is formed, I *owe* it to you to do my part. It is not just that you are relying on me; it is that I have given you a right to my actions. If I let go, I haven't just been unreliable; I have violated a specific normative bond that exists *only* between joint partners.

  ---

  ### 4. The Couch Test: Who Explains Your Experience?

  Let's look at that specific feeling: *"My sister would've had every right to snap at me if I'd just let go of my end without warning."*

  **Bratman's Explanation:**
  Bratman would say your sister's right to snap comes from **reasonable reliance**. By engaging in the interlocking intention, you signaled to her that you would continue. She adjusted her grip and balance based on that signal. If you let go, you cause a practical failure (the couch drops) and a rational failure (you contradicted your own intention). Her anger is a reaction to being let down by a partner she trusted.
  *   *Verdict:* Bratman explains the *coordination* perfectly (the silent micro-adjustments). But he struggles to explain why the obligation feels so specific. Why is it different from me promising to mail a letter for you and then not doing it?

  **Gilbert's Explanation:**
  Gilbert would say your sister's right to snap comes from **joint commitment**. The moment you both lifted, you formed a plural subject. You were no longer two people holding a couch; you were one entity carrying a couch. By letting go unilaterally, you didn't just break a plan; you broke the bond that constituted the activity. She has a *right* to rebuke you because, in that moment, your actions belonged to *her* as much as to you.
  *   *Verdict:* Gilbert captures the **normative force** better. She explains why the "snap" feels justified in a way that is unique to *joint* action, distinct from general moral disappointment.

  ### 5. Which Theory Has the Edge?

  This is the million-dollar question in social ontology. Is there a fact of the matter, or is it preference?

  **The Case for Bratman (Parsimony):**
  Bratman wins on **Occam's Razor**. He explains everything using mental states we already know exist (individual intentions). He doesn't need to posit a "plural subject" or a special "joint commitment" glue. For many naturalistic philosophers, Gilbert's "plural subject" smells too much like a group mind, even if she denies it. If Bratman can explain the coordination (which he does very well), why add Gilbert's extra metaphysical machinery?

  **The Case for Gilbert (Normativity):**
  Gilbert wins on **Phenomenology**. She explains the *feeling* of obligation better. There is a distinct difference between "I am disappointed you didn't help" and "You had no right to quit without asking." Bratman has to work very hard to derive that specific "right to rebuke" from individual intentions. Gilbert builds it into the foundation. If you think the *obligation* is the most important part of acting together, Gilbert is the winner.

  **The Current Consensus:**
  There is no settled "fact of the matter," but the field has moved slightly toward a middle ground in recent years.
  1.  **Bratman's Weakness:** Many now agree Bratman underplays the normative element. In his later work, he has conceded more ground on the idea that shared intention creates "normative constraints," though he still resists Gilbert's strong "joint commitment" language.
  2.  **Gilbert's Weakness:** Critics argue her theory is too rigid. It implies you can't stop carrying the couch unless you literally negotiate an exit with your sister. But in reality, if you see a spider on the couch, you can just drop it. Gilbert has to argue that you are *still* violating the commitment but are justified in doing so, which gets messy.

  **My Take:**
  If I have to choose which theory captures *your* specific experience on the stairs: **Gilbert has the edge.**

  Here is why: You described a silence where "neither of us had said a single word." Bratman relies heavily on the content of intentions ("I intend that we J"). Gilbert allows for **tacit joint commitment**. The fact that you both just *grabbed* and *moved* created the bond instantly.

  More importantly, that feeling that she would have been *wronged* (not just inconvenienced) is the smoking gun. Bratman can explain why the couch drops. Gilbert explains why *she gets to be mad*. The "right to snap" is a normative claim, and Gilbert's theory is specifically designed to account for normative claims in social settings. Bratman's theory is designed to account for cognitive coordination. Since your lingering feeling is about the *bond* (the "we"), not just the *mechanics* (the "how"), Gilbert describes the ontology of your experience more accurately.

  ### Summary
  *   **Bratman** explains the **machinery**: How two brains synchronize to move an object without talking. (The micro-adjustments).
  *   **Gilbert** explains the **bond**: Why letting go feels like a betrayal rather than just a mistake. (The right to snap).

  You aren't butchering the philosophy at all; you've identified the exact tension that keeps this field alive. The debate isn't likely to be "solved" soon because it depends on whether you value metaphysical simplicity (Bratman) or normative accuracy (Gilbert) more. But for the sake of your relationship with your sister? Gilbert is probably the safer bet: you owed it to her not to drop the couch.
