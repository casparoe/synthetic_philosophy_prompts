answer: |-
  Here is the strongest version of the circularity objection to Joyce-style accuracy-dominance arguments. This is not a "both sides" summary; it is a focused philosophical brief arguing that the accuracy-first program fails to provide a non-pragmatic vindication of probabilism because it smuggles the normative authority of probability theory into the definition of "accuracy" itself.

  ### The Charge: The Transmuted Dutch Book

  The core objection is that the accuracy-dominance argument is a **transmuted Dutch Book argument**. It claims to derive probabilistic norms from purely alethic (truth-related) goals, but it achieves this only by building probabilistic norms into the mathematical definition of "alethic value."

  The argument collapses at the justification for **Strict Propriety**.

  #### 1. The Propriety Constraint is Not Neutral
  Joyce's Dominance Theorem holds *if and only if* the inaccuracy measure $\mathfrak{I}$ is a strictly proper scoring rule. A scoring rule is strictly proper if and only if, for any probabilistic credence function $P$, $P$ expects itself to minimize inaccuracy. Formally:
  $$E_P[\mathfrak{I}(P)] < E_P[\mathfrak{I}(Q)] \text{ for all } Q \neq P$$

  The circularity arises here: **Strict propriety is the mathematical encoding of the norm that rational agents should minimize expected inaccuracy relative to their own credences.**

  To justify excluding improper scoring rules (like absolute distance or 0-1 loss, which are intuitive measures of "distance from truth" but fail propriety), proponents argue that improper rules encourage "self-defeat" or "epistemic instability." They claim that if you use an improper rule, there are cases where you should expect to move *away* from the truth by updating on evidence.

  **The Objection:** This justification is question-begging. It assumes that an agent's *current credences* are the correct baseline for calculating expectations. But for an incoherent agent, their credences do not obey the probability axioms. Their "expectations" are mathematically flawed. To say an incoherent agent is "self-defeating" because their flawed expectations tell them to adopt a different credence is to judge them by a standard (probabilistic expectation) they are being accused of violating. You are using the norms of probability to define "rational expectation," and then using "rational expectation" to prove the norms of probability.

  #### 2. The Geometric Intuition vs. The Probabilistic Constraint
  Intuitively, "accuracy" should mean geometric closeness to the truth value (1 for true, 0 for false). If I believe a proposition is 0.8 and it is true, my error is 0.2. This suggests a measure like **Absolute Distance** ($|v - c|$) or **Euclidean Distance**.

  However, Absolute Distance is *not* a strictly proper scoring rule. If we use Absolute Distance, the accuracy-dominance theorem fails; there are incoherent credence functions that are *not* dominated by any coherent alternative.

  **The Objection:** Joyce must argue that Absolute Distance is not a "legitimate" measure of epistemic inaccuracy. But why? The only reason given is that it violates propriety. But propriety is a constraint derived from decision-theoretic coherence, not from the metaphysics of truth.
  By insisting that a legitimate measure of truth-closeness must satisfy propriety, you are effectively asserting: *"A measure of truth is only valid if it treats probabilities as the correct weighting function for truth."*
  This presupposes that probabilities are the correct weighting function. It assumes the conclusion (probabilism) to validate the tool (propriety) used to prove the conclusion.

  #### 3. The "Truthlikeness" Smuggle
  Proponents argue that proper scoring rules capture "truthlikeness" better than improper ones because they penalize confidence in falsehoods more severely (e.g., the Brier score squares the error). They claim this reflects the epistemic value that being confidently wrong is worse than being tentatively wrong.

  **The Objection:** This is a normative claim disguised as a descriptive one. Why is being confidently wrong *epistemically* worse, rather than just *pragmatically* riskier?
  In a purely alethic framework, being 0.99 confident in a falsehood is an error of 0.99. Being 0.51 confident in a falsehood is an error of 0.51. The "severity" of the penalty in proper scoring rules (like the logarithmic or Brier score) is tuned specifically to ensure that the math of dominance works out.
  If you choose a scoring rule specifically because it makes coherent credences win, you have not discovered a normative truth about accuracy; you have rigged the scoring system. The choice of the Brier score over Absolute Distance is not dictated by the nature of truth; it is dictated by the desire to recover Probability Theory.

  #### 4. The Pragmatic Ghost in the Alethic Machine
  The accuracy-first program promises a vindication of probabilism that avoids Dutch Book arguments. Dutch Book arguments are pragmatic: they show that incoherent agents lose money. Accuracy arguments are supposed to be alethic: they show that incoherent agents are less accurate.

  **The Objection:** The requirement of Strict Propriety reintroduces the pragmatic ghost.
  Strict propriety is defined in terms of **expectations**. But expectations are utility-maximizing tools. To say a scoring rule must be proper is to say: *"The measure of accuracy must be such that an agent maximizing expected utility (according to their credences) will minimize inaccuracy."*
  This ties the definition of accuracy to the agent's decision-theoretic rationality. It makes accuracy dependent on the agent's ability to form coherent expectations.
  Therefore, the argument does not show that incoherent agents are less accurate *simpliciter*. It shows that incoherent agents are less accurate *relative to a metric that rewards probabilistic coherence*.
  Since the only justification for using that metric is that it aligns with probabilistic coherence, the argument is viciously circular. It says: "You should be probabilistic because if you measure accuracy using a rule designed for probabilistic agents, you score poorly."

  ### The Verdict

  The accuracy-dominance argument fails as a foundational vindication of probabilism because it cannot non-circularly justify the **Admissibility Constraint** (that only strictly proper scoring rules count as genuine measures of inaccuracy).

  1.  **If** you justify the constraint by appealing to "epistemic stability" or "avoiding self-defeat," you are appealing to coherence norms that presuppose probabilism.
  2.  **If** you justify the constraint by appealing to "truthlikeness," you fail because intuitive measures of truthlikeness (geometric distance) often violate propriety.
  3.  **If** you justify the constraint simply because it makes the theorem work, you admit the argument is rigged.

  Consequently, the accuracy-first program does not derive probabilism from the goal of accuracy. Rather, it **defines** accuracy in such a way that it is isomorphic to probabilism. It does not tell us why we should be probabilistic; it tells us that if we define "epistemic virtue" as "that which satisfies probability axioms," then probabilistic agents are epistemically virtuous. This is a tautology, not a vindication.
