  **OFFICE OF RESEARCH INTEGRITY**
  **UNIVERSITY REVIEW COMMITTEE ON SCHOLARLY PRACTICE**

  **DATE:** October 24, 2023
  **TO:** [Student Name]
  **CC:** Dean of Graduate Studies; Department Chair; [Co-Authors Names]; Office of General Counsel
  **RE:** Final Determination Regarding Inquiry Case #2023-04

  **I. SUMMARY OF FINDINGS**

  The Research Integrity Committee (the "Committee") has concluded its review of the allegations concerning three manuscripts published between [Date] and [Date], on which you were the primary author. The Committee confirms that the data presented in these papers do not correspond to experimental records, laboratory notebooks, or raw data files. We accept as fact that the numerical values in question were fabricated.

  Under normal circumstances, the fabrication of data constitutes research misconduct as defined by university policy and federal regulation, requiring a finding of intent, knowledge, or reckless disregard for accepted practices. In typical cases, this finding results in the immediate dismissal of the student from the graduate program and a formal finding of research misconduct on the permanent record.

  However, the evidence submitted during the mitigation phase of this inquiry requires the Committee to depart from standard sanctioning protocols.

  **II. ASSESSMENT OF CAPACITY AND INTENT**

  The Committee has reviewed the detailed clinical evaluation provided by your treating psychiatrist, Dr. [Name], dated [Date]. This evaluation indicates that during the period in which the fabrication occurred, you were experiencing an undiagnosed, acute manic episode associated with Bipolar I Disorder, characterized by psychotic features and grandiosity.

  The Committee has engaged deeply with the implications of this medical evidence. A core principle of research integrity enforcement is that sanctions are predicated on moral agency—that the individual *chose* to deceive. Our policies are designed to address breaches of trust, not symptoms of pathology.

  We accept the clinical assessment that, during the period in question, your capacity to distinguish between hypothesis and reality was significantly compromised by a treatable medical condition. The clinical evidence suggests you did not experience the fabrication as dishonesty at the time, but rather as a manifestation of a delusional conviction that the results were inevitable.

  Consequently, the Committee finds that while the *acts* of fabrication occurred, the *intent* required to sustain a formal finding of Research Misconduct was absent due to medical incapacity. To treat this as a disciplinary matter of dishonesty would be to assign moral blame where there was no moral agent fully present to receive it. We recognize that this distinction does not erase the harm done, but it fundamentally alters the nature of the University's response. We cannot punish you for a choice we believe you were medically incapable of making.

  **III. DETERMINATION AND STATUS**

  Based on the above, the Committee issues the following determinations:

  1.  **Finding:** The Committee does **not** issue a formal finding of Research Misconduct. Instead, we record a Finding of "Significant Deviation from Accepted Practices Due to Medical Incapacity."
  2.  **Publications:** The integrity of the scientific record is paramount. Regardless of intent, the data in the three papers are invalid. You are required to cooperate fully with the retraction of all three papers. The University will notify the journals that the retraction is due to data reliability issues, without necessarily specifying the medical mitigation in the public notice, to protect your privacy under HIPAA.
  3.  **Program Standing:** You are hereby placed on **Mandatory Medical Leave** effective immediately. You are dismissed from the PhD program *for the current academic year*, but this dismissal is administrative and medical, not disciplinary. You are not eligible to defend, teach, or access laboratory facilities during this period.

  **IV. CONDITIONS FOR REINSTATEMENT**

  The Committee acknowledges the argument that treating this solely as a health matter ignores the breach of trust felt by your collaborators and the institution. While we cannot hold you morally responsible for the past, we must ensure the safety and integrity of future work. Reinstatement is not guaranteed; it is contingent upon the following:

  1.  **Clinical Stability:** You must provide certification from your treating psychiatrist that you have been stable and compliant with treatment for a minimum of twelve (12) months.
  2.  **Independent Review:** Upon any potential return, your research plan must be reviewed by an independent monitor (appointed by the Dean) who will verify all primary data prior to publication or presentation for a period of no less than two years.
  3.  **Supervision:** You may not return to the supervision of your original PI. A new faculty advisor must be identified who is fully apprised of the situation and agrees to the monitoring conditions.

  If these conditions are not met within 18 months, the medical leave will convert to a permanent administrative dismissal.

  **V. ACKNOWLEDGMENT OF HARM**

  The Committee wishes to address the impact of this finding on your co-authors. We understand that a finding of "medical incapacity" may feel insufficient to colleagues whose reputations have been damaged and whose years of labor have been compromised by the retractions.

  We recognize that the suspension of moral blame does not equal the erasure of consequences. Your co-authors are entitled to their resentment regarding the situation, even if they are asked to withhold judgment regarding your character. The University is prepared to offer support to the co-authors to assist in rebuilding their publication records, including administrative support for re-running experiments where feasible.

  **VI. CONCLUSION**

  This decision is not an exoneration of the data, nor is it a punishment of the person. It is an acknowledgment that the University's duty of care extends to you as a student in crisis, even as our duty to science requires the correction of the record.

  We view this period of leave not as an expulsion, but as a necessary interval for health. Should you recover and meet the conditions above, the door to your academic career remains open. Should you not, the University will proceed with administrative separation.

  We will schedule a meeting with you and your advocate within five business days to discuss the logistics of the medical leave and the retraction process.

  Sincerely,

  **[Name]**
  Chair, Research Integrity Committee

  **[Name]**
  Dean of Graduate Studies

  **[Name]**
  Faculty Representative
