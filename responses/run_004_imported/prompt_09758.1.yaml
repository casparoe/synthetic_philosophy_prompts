              *   **SSA:** "Reason as if you are a random sample from the set of all *actual* observers." SSA tends to neutralize the "number of observers" effect unless combined with specific indexical data.
              *   *Wait, let's refine:* The Presumptuous Philosopher argument is usually cited as a *reductio ad absurdum* against SIA. Bostrom actually favors SSA (specifically the Strong Self-Sampling Assumption or SSIA) over SIA because SIA leads to the "Presumptuous Philosopher" problem (settling physics from the armchair).
              *   *However*, SSA has its own problems (the Doomsday Argument).
      *   **The Conflict:** The outsider is using SIA reasoning (I exist -> More observers -> Big Universe). The cosmologist should likely push back using SSA or a critique of SIA.

  3.  **Evaluate the "Presumptuous Philosopher" Scenario:**
      *   **Setup:** Theory A (10^12 observers), Theory B (10^24 observers). Priors equal.
      *   **SIA Verdict:** Theory B is 10^12 times more likely. Why? Because there are 10^12 times more "slots" for you to occupy.
      *   **SSA Verdict:** Theory A and B remain roughly equiprobable (depending on reference class). SSA says: Conditional on me existing, what is the probability I am in A vs B? If I exist in both, SSA doesn't shift the odds based on population size alone. It shifts based on *which* observer I am (e.g., birth rank).
      *   **Bostrom's View:** Bostrom introduced the Presumptuous Philosopher to highlight the counter-intuitive consequences of SIA. He generally leans towards SSA (with caveats) to avoid the philosopher being able to dictate cosmology without data.

