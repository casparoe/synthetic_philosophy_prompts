          *   **SSA (Cosmologist's view):** "I exist" is not evidence. "I am *this* specific observer" is the indexical fact. If priors are equal, population size doesn't shift the probability of the *theory* being true, only the probability of *which* observer you are within that theory.
      *   **The Verdict:** Cosmologist endorses SSA.
      *   **The Objection:** The Doomsday Argument (Carter, Leslie). If SSA is true, we should expect to be typical observers. If we are early, the total number must be small.
      *   **The Defense:** Distinguish between *physical* probabilities and *indexical* probabilities. Or argue that the Doomsday Argument relies on a flawed reference class (e.g., including future humans who may not exist vs. current observers). Or simply bite the bullet: "Better a gloomy prediction than magic."
      *   **Refining the Defense:** The strongest defense for a scientist is methodological. SIA allows "observation selection effects" to trump empirical data. SSA keeps the anchor in empirical priors. The Doomsday Argument is a probabilistic constraint on the *future*, not a falsification of the *present* physics.

  6.  **Structuring the Response:**
      *   **Part 1: Philosophical Grounding.** Define SSA and SIA clearly in the context of the scene. Explain the Presumptuous Philosopher.
      *   **Part 2: The Verdict.** Recommend the cosmologist endorse SSA. Explain why (preserves empirical science).
      *   **Part 3: The Objection & Defense.** Address the Doomsday Argument. Provide a robust counter-argument (Reference Class problem or Methodological Priority).
      *   **Part 4: Scene Advice.** How to translate this into dialogue without info-dumping.

