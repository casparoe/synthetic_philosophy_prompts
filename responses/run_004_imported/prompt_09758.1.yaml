      *   *Best path for the scene:* The cosmologist accepts the "Presumptuous Philosopher" critique of SIA as fatal. She accepts the risk of the Doomsday Argument but argues it's less damaging than allowing physics to be solved by solipsism. Or, she adopts a hybrid view (e.g., "Compromise" or "Reference Class Restriction").
