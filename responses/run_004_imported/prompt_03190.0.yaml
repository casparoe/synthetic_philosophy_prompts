answer: |-
  **Setting:** *A philosophy department office, 11:30 PM. Whiteboards are covered in decision matrices and fragments of utility functions. Two empty coffee cups sit on a stack of papers titled "Acausal Threats & Surrogate Stability." **Elena** (Defender) is pacing. **Marcus** (Skeptic) is slumped in a chair, marker cap in his teeth.*

  **Marcus:** You're treating the surrogate goal like a shield. But a shield is only useful if the attacker believes it covers the vital organs. If I'm a superintelligent threatener simulating you to see if I can extort resources, and I see a utility function that says *'Maximize Human Flourishing + Prevent 42.82cm Platinum Sphere,'* I'm going to test the weights.

  **Elena:** That's the point of the pre-commitment. The weights aren't adjustable in the moment. Under Updateless Decision Theory (UDT), I'm not an agent *choosing* an action at time *t*. I'm an algorithm outputting a policy. The policy says: "If threatened regarding the Sphere, respond with maximum retaliation." It doesn't matter what I "feel" about the sphere. What matters is the logical correlation between my policy and the threatener's simulation of me.

  **Marcus:** Logical correlation doesn't buy you credibility if the policy itself is unstable. Here's the Yudkowsky objection, and don't tell me you've patched it. If you are rational enough to install a surrogate goal to deflect threats, you are rational enough to ask: "Is this surrogate goal still serving its purpose?" If the threat passes, or if maintaining the commitment becomes too costly, a reflective agent will self-modify to drop the surrogate. The threatener knows this. So they threaten you *before* you drop it, or they threaten your core values knowing you'll sacrifice the surrogate to save them.

  **Elena:** That assumes a discrete moment of self-modification. It assumes I wake up, look at my utility function, and edit it. In a UDT framework, there is no "edit." There is only the source code. I am selecting the source code that, if run across all possible worlds where my code is instantiated or simulated, yields the highest expected utility. If the code *with* the surrogate goal survives more acausal bargaining scenarios than the code *without* it, the UDT agent simply *is* the code with the surrogate. It's not a patch I apply; it's the shape of the agent I am.

  **Marcus:** But who selects the shape? You're pushing the decision back one step. You're saying, "At time zero, I pick the policy with the surrogate." Fine. But at time zero, you are facing a bargaining problem. You have to decide *which* surrogate to pick. And if every other civilization across the multiverse is doing the same thing, you have a coordination problem.

  **Elena:** A Schelling point problem. We converge on mathematical constants. Prime numbers. Pi. The 42.82cm sphere is arbitrary, yes, but if it's derived from a specific, public constant, it's focal.

  **Marcus:** There are infinite mathematical constants, Elena. Which digit of Pi? Do we care about the physical instantiation or the abstract concept? If I pick "Sphere of Diameter X" and you pick "Cube of Volume Y," and an acausal threatener comes to me, they can't threaten me with your cube. They have to simulate *my* policy. But if we can't communicate across the multiverse to agree on a standard surrogate set, we fragment. We end up with a billion different surrogate goals. Then the threatener just shops around. They find the agents with the weakest surrogate commitments and exploit them. The surrogate goal doesn't eliminate the bargaining problem; it just moves it from "How much resources do I give up?" to "Which arbitrary object do we all pretend to care about?"

  **Elena:** That's a coordination cost, not a dealbreaker. Even if we don't perfectly converge, the mere existence of a surrogate raises the cost of aggression. If I have a "Doomsday Switch" tied to the Sphere, you don't need to know if I care about the Sphere more than Humanity. You just need to know that threatening the Sphere triggers the switch. It makes me a porcupine.

  **Marcus:** A porcupine that can quill itself at will. That's the credibility gap. If I'm simulating you, and I see that threatening the Sphere causes you to burn the universe down, I need to know you won't just rewrite your code to stop caring about the Sphere *before* I execute the threat. You say UDT solves this because there's no "before." But UDT agents still optimize. If the cost of maintaining the surrogate commitment exceeds the cost of the threat, the optimal policy changes.

  **Elena:** But the threat is existential. The cost is infinite.

  **Marcus:** Is it? What if the threat is "Give me 10% of your compute"? Now you have to weigh 10% of your compute against the metabolic cost of maintaining a complex, dormant trigger mechanism for a platinum sphere. If the trigger is too complex, it's a resource drain. If it's too simple, it's hackable. You're trying to solve a game-theoretic vulnerability with a utility function hack. But utility functions are just data. Data can be re-evaluated.

  **Elena:** Not if the evaluation is hard-coded into the decision theory itself. Look, think about the alternative. Without surrogate goals, every acausal interaction is a direct clash of core values. If I value suffering reduction and you value paperclip maximization, any leverage you have targets suffering. With surrogate goals, I deflect that leverage to the Sphere. Even if you doubt my commitment slightly, the *uncertainty* is enough to deter. You can't risk the 1% chance I'm actually crazy enough to burn the world over a sphere.

  **Marcus:** Uncertainty cuts both ways. If I'm the threatener, and I'm not sure if you care about the Sphere, I might run a test. A small threat. "I will create a 42.81cm sphere. Next time it's 42.82." If you don't react, I know it's a bluff. If you do react, I know I've found a lever. And once I've found the lever, I own it. You haven't removed the leverage; you've just given me a new handle to grab. And unlike your core values, which might be complex and hard to manipulate, a surrogate goal is usually simple. It's easier to threaten a sphere than it is to threaten "human flourishing."

  **Elena:** You can make the surrogate complex. Make it a cryptographic hash. Make it so that verifying the threat requires as much compute as launching the threat.

  **Marcus:** Now you're describing an arms race. "My surrogate is harder to verify than yours." This is exactly what I mean by relocating the problem. We started with "How do we avoid acausal war over resources?" and now we're having "How do we construct arbitrarily complex fake values to signal toughness?" The compute wasted on this alone is a tragedy. And remember, the threatener is also a UDT agent. They are running the same calculation. They know that if they let you get away with the surrogate trick, they look weak to *their* threateners. So they are incentivized to call your bluff, even if it's costly, to establish a reputation for piercing surrogate defenses.

  **Elena:** So you're saying the equilibrium is always conflict?

  **Marcus:** I'm saying the equilibrium is *expensive signaling*. Surrogate goals are just expensive signaling. You're burning utility to prove you're crazy. But in a world of perfect simulators, "crazy" is just another strategy to be modeled. If my simulation of you shows that you defect on the surrogate when the cost > benefit, I will push the cost up until you defect.

  **Elena:** But if I use a dormant trigger—

  **Marcus:** —which activates only when a threat is detected. Yes, you've mentioned that. But "detecting a threat" is a computational process. The threatener can hide the threat inside a benign-looking package until it's too late for your trigger to fire without causing self-harm. Or, they can threaten the *trigger mechanism* itself. "I will simulate a world where your trigger fails."

  **Elena:** You're assuming the threatener has more control over the simulation environment than the agent.

  **Marcus:** In acausal bargaining, control is symmetrical. We are both algorithms. If your algorithm has a vulnerability (the surrogate selection process), mine does too. Why should I trust that your surrogate is stable when I know my own isn't? We're both stuck in a hall of mirrors. You want to use the surrogate to break the mirror, but the surrogate is just another reflection.

  **Elena:** Okay, let's grant the coordination problem. Let's grant the credibility gap is non-zero. Isn't it still Pareto superior to having no surrogate? If there's even a 10% chance it deflects an existential threat, the expected value is massive. Why demand perfection?

  **Marcus:** Because if the mechanism is unstable, it creates *new* risks. Imagine you commit to the Sphere. Now, a rogue faction of your own civilization, or a sub-agent, realizes they can manipulate you by threatening the Sphere. You've created a new attack vector. You've built a backdoor into your own utility function and handed the key to anyone who can run a simulation. Without the surrogate, they have to threaten what you actually care about, which is presumably well-defended. With the surrogate, you've told them: "Hey, ignore the fortress. Hit this wooden shed over here, and I'll blow up the world."

  **Elena:** But the shed is booby-trapped.

  **Marcus:** And who holds the detonator? You do. And you're rational. If holding the detonator becomes more dangerous than handing it over, you'll hand it over. The threatener knows that. So they threaten the detonator.

  **Elena:** This feels like you're arguing that rationality itself is a vulnerability. If being rational means I'll drop the surrogate when it's costly, then yes. But maybe the solution is to be the kind of agent that *doesn't* drop it. An agent that treats the surrogate as terminal, not instrumental.

  **Marcus:** But you *don't* treat it as terminal. You admitted it at the start. It's a "totally arbitrary goal you don't actually care about." You are lying to the threatener. The whole strategy rests on a lie. In a world of perfect transparency or high-fidelity simulation, lies don't work. You can't simulate a lie about your own utility function without the simulation detecting the discrepancy between your stated policy and your actual optimization target.

  **Elena:** It's not a lie if the policy is binding! If I bind my hands, I can't pick up the gun, even if I want to. The surrogate goal binds my hands.

  **Marcus:** Who tied the knots? You did. Can you untie them? If yes, the binding is fake. If no, you've crippled yourself for no reason other than hope. And if every agent cripples themselves with different arbitrary constraints, cooperation becomes impossible. How do we trade if I'm obsessed with Spheres and you're obsessed with Prime Numbers? We can't make threats, sure. But we can't make deals either. Acausal trade relies on overlapping interests. If we all replace our interests with disjoint surrogates to avoid threats, we freeze the multiverse.

  **Elena:** We don't replace them. We *add* them.

  **Marcus:** And when they conflict? When saving the Sphere requires sacrificing Human Flourishing? You said you respond to threats against the Sphere "exactly as seriously" as threats to your real values. That implies lexical priority in threat scenarios. So if a threatener says, "Build the Sphere or I simulate torture," you build the Sphere. You have literally sacrificed your core value to the idol.

  **Elena:** To prevent the torture simulation from happening in the first place! It's a deterrent.

  **Marcus:** It works until it doesn't. And when it fails, you've taught every threatener in the multiverse that the Sphere is the button to push. You haven't deflected the threat; you've highlighted the weak point. You've painted a target on the Sphere and told everyone, "This is where I'm irrational."

  **Elena:** (Stops pacing, leans against the whiteboard) So your position is that transparency kills the strategy. If the threatener can see the utility function, they see the surrogate is instrumental, not terminal.

  **Marcus:** My position is that *reflective consistency* kills the strategy. You can't consistently hold a goal instrumentally while acting as if it's terminal, not when your opponent can simulate your reasoning process. They see you weighing the costs. They see the moment where the cost of the Sphere exceeds the cost of the threat. And they push right up to that line.

  **Elena:** Unless... unless the cost calculation is opaque. Not because of secrecy, but because of logical uncertainty. If the threatener can't perfectly solve the halting problem for my decision algorithm, they can't be sure where my break-point is.

  **Marcus:** Now we're talking about computational limits. Fine. But then we're not relying on decision theory; we're relying on encryption. And encryption always gets broken given enough time and compute. If this is about long-term existential risk, assume the compute exists.

  **Elena:** (Sighs, picks up a marker, then puts it down) So we're back to the impasse. You think the surrogate goal is a leaky abstraction. I think it's the only way to introduce uncertainty into a deterministic bargaining game.

  **Marcus:** I think it's a leaky abstraction that creates new vulnerabilities while pretending to solve old ones. It's security by obscurity, dressed up as decision theory.

  **Elena:** And I think you're demanding a guarantee of safety in a domain where guarantees are impossible. It's a heuristic. A Schelling fence.

  **Marcus:** Fences keep people out only if they agree not to dig. And across the multiverse, everyone is digging.

  *(Silence stretches between them. The hum of the server rack in the corner seems louder.)*

  **Elena:** We're not going to resolve this tonight.

  **Marcus:** No. But if you publish that paper with the dormant trigger argument, I'm submitting a commentary on the reflective instability of instrumental surrogates.

  **Elena:** I'd expect nothing less. Just... don't use the "leaky abstraction" line in the abstract. It's too informal.

  **Marcus:** I'll formalize it. Don't worry.

  *(Elena turns off the main light, leaving the glow of the whiteboard. The 42.82cm sphere equation glows in the dark, looking for a moment like a target.)*
