answer: |-
  The asymmetry between the Liar and Curry's paradoxes lies in the distinct proof-theoretic mechanisms they exploit. While the Liar paradox relies on the interaction between **negation** and the structural principle of **Explosion**, Curry's paradox relies on the interaction between **implication** and the structural principle of **Contraction**. Consequently, a logic's paraconsistency (the invalidity of Explosion) is orthogonal to the derivation of Curry's paradox.

  ### 1. Why Paraconsistency Fails Against Curry

  Paraconsistent logics, such as Priest's Logic of Paradox (LP), are designed to invalidate the principle of *Ex Contradictione Quodlibet* (Explosion):
  $$A, \neg A \vdash B$$
  In the context of the Liar paradox, one derives a contradiction ($L \land \neg L$). In classical logic, Explosion allows this contradiction to entail every sentence $B$, leading to triviality. In LP, Explosion is invalid; thus, the contradiction is "contained," and the logic remains non-trivial.

  Curry's paradox, however, does not derive a contradiction. It derives an arbitrary sentence $A$ directly, without ever invoking negation or the conjunction of a sentence and its negation. The paradox utilizes a Curry sentence $C$ equivalent to $C \to A$. The derivation proceeds roughly as follows:
  1.  Assume $C$.
  2.  From $C$ and the equivalence, derive $C \to A$.
  3.  From $C$ and $C \to A$, derive $A$ (via Modus Ponens).
  4.  Discharge the assumption to conclude $C \to A$.
  5.  From $C \to A$ and the equivalence, derive $C$.
  6.  From $C$ and $C \to A$, derive $A$.

  Since the derivation never produces $\neg A$ or $A \land \neg A$, the invalidity of Explosion is irrelevant. The derivation relies entirely on the properties of the conditional and the management of assumptions. Therefore, merely tolerating contradictions (paraconsistency) provides no defense against a derivation that never produces one.

  ### 2. The Proof-Theoretic Asymmetry

  To understand the specific structural vulnerability, we must look at the derivation in a **sequent calculus** framework. This reveals exactly where the logical "leverage" is applied.

  Let $\vdash$ represent the derivability relation. Let $C$ be a sentence such that $C \dashv\vdash C \to A$.

  **The Liar Derivation (Blocked by Paraconsistency):**
  1.  $\vdash L \leftrightarrow \neg L$
  2.  $\vdash L \land \neg L$
  3.  $L, \neg L \vdash B$ (Explosion)
  4.  $\vdash B$
  *Block:* In LP, step 3 is invalid.

  **The Curry Derivation (Unblocked by Paraconsistency):**
  1.  $C \vdash C$ (Identity)
  2.  $C \vdash C \to A$ (Substitution from 1, given equivalence)
  3.  $C, C \vdash A$ (Left-Implication Rule / Modus Ponens on 1 and 2)
  4.  $C \vdash A$ (**Contraction** on 3)
  5.  $\vdash C \to A$ (Right-Implication Rule on 4)
  6.  $\vdash C$ (Substitution from 5, given equivalence)
  7.  $\vdash A$ (Cut / Modus Ponens on 5 and 6)

  The critical asymmetry is visible at **Step 4**. In Step 3, we have derived $A$ from two occurrences of the assumption $C$ (one acting as the antecedent trigger, one as the truth of the antecedent). To apply the Right-Implication Rule ($\to R$) in Step 5, which discharges the assumption to form the conditional $C \to A$, we typically require the succedent ($A$) to follow from a *single* occurrence of the antecedent ($C$).

  The move from $C, C \vdash A$ to $C \vdash A$ is the structural rule of **Contraction**:
  $$\frac{\Gamma, A, A \vdash B}{\Gamma, A \vdash B}$$

  Paraconsistency restricts rules involving negation (specifically Explosion). It leaves structural rules like Contraction intact. Since Curry's paradox derives triviality using only Implication and Contraction, a paraconsistent logic that retains Contraction (and a detachable conditional supporting Modus Ponens) will still trivialize.

  ### 3. The Required Restriction: Contraction

  To block Curry's paradox while maintaining a dialetheic stance (and typically while retaining a detachable conditional that supports Modus Ponens, which LP's material conditional lacks), the dialetheist must restrict **Contraction**.

  This leads to **substructural logics** (such as certain relevant logics or specific dialetheic systems like $\mathbf{DL}$). By rejecting Contraction, the logic distinguishes between having one reason to believe $C$ and having two. In the Curry derivation, the assumption $C$ is "consumed" twice: once to instantiate the conditional $C \to A$, and once to satisfy the antecedent. Without Contraction, the derivation stalls at $C, C \vdash A$. One cannot discharge two occurrences of $C$ to prove $C \to A$ (which intuitively claims that *one* truth of $C$ suffices for $A$).

  **Summary of the Asymmetry:**
  *   **Liar Paradox:** Exploits **Negation**. Solved by invalidating **Explosion** (Paraconsistency).
  *   **Curry's Paradox:** Exploits **Implication**. Solved by invalidating **Contraction** (Substructuralism).

  Thus, paraconsistency is necessary but not sufficient for a full solution to the semantic paradoxes. A dialetheist must typically adopt a logic that is both paraconsistent (to handle the Liar) and non-contractive (to handle Curry).
