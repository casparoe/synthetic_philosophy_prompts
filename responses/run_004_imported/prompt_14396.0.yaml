prompt: |-
  Ok, weird context for this question but bare with me. I'm a data scientist and my team just spent the last quarter finally getting serious about causal inference — DAGs, do-calculus, the "Book of Why" reading group, potential outcomes for the experimentation side of the house, all of it. Totally seperately, my partner is finishing a philosophy MA thesis that's basically 80 pages of close reading Woodward's "Making Things Happen," and every time she explains her latest chapter to me over dinner I get this nagging feeling that "interventionist theory of causation" and "the thing my team does in Python" are the same idea wearing different clothes.

  Here's my actual confusion though. Lewis's theory says (roughly) that C causes E when E counterfactually depends on C: go to the closest possible world where C doesn't happen and check whether E still happens there. Woodward instead defines it through what would happen to E if you could perform a hypothetical, surgical intervention on C. But an intervention like that is still just a counterfactual — "if C were set to a different value by an intervention, would E change?" — so I don't get why interventionism is presented as a genuine rival to Lewis rather than just counterfactual theory with the similarity-of-worlds machinery swapped out for the intervention recipe. And if that's right, doesn't Woodward need his own independent, non-causal handle on what counts as an "intervention," on pain of just presupposing the very causal facts he's supposed to be analyzing?

  Could you actually walk through the comparison properly instead of giving me the two-line textbook version? Specifically I'd want: (1) whether interventionism really is a species of counterfactual theory or something importantly different, (2) how each one deals with the classic hard cases — early vs. late preemption, symmetric overdetermination (two shooters, either shot alone sufficient) — since I gather this is exactly where Lewis's original account ran into trouble, and (3) whether the "intervention" my team performs when we do graph surgery on a DAG is really the same notion Woodward has in mind or just a formalized cousin of it. And then just tell me straight, at the end: which theory do you think is in better shape overall, and why?
