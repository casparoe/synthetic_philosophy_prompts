prompt: |-
  Been building a little algo-betting bot on the side and fell down a rabbit hole on the Kelly criterion. The pitch everywhere is that full Kelly maximizes your long-run growth rate with probability 1, so it's basically mathematical proof that its the objectively rational bet size regardless of your personal risk tolerance (some rationalist blogs even call this 'geometric rationality' and treat it as a strict upgrade over normal expected-value thinking). So why does literally every serious trader/gambler I read about use half-Kelly or less instead of just running full Kelly if it's the mathematically correct answer? Feels like they're all leaving growth on the table for no reason.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user is building an algo-betting bot.
      *   **Observation:** They've encountered the Kelly Criterion, which claims to maximize long-run geometric growth rate.
      *   **Conflict:** They notice that serious traders/gamblers use *fractional* Kelly (half-Kelly, etc.), not full Kelly.
      *   **Question:** Why do practitioners deviate from the "mathematically correct" full Kelly if it maximizes growth? Are they leaving money on the table?
      *   **Tone:** Skeptical of the "objective rationality" claim, looking for practical justification.

  2.  **Deconstruct the Kelly Criterion Claims:**
      *   *Claim:* Full Kelly maximizes expected logarithmic utility (geometric growth).
      *   *Truth:* Yes, asymptotically, under specific assumptions.
      *   *Assumptions:* Known probabilities, known payoffs, infinite time horizon, no transaction costs, no bet limits, continuous betting, utility function is exactly log(wealth).

  3.  **Identify the Problems with Full Kelly in Practice:**
      *   **Estimation Error (The biggest one):** Kelly requires knowing the *true* edge. In real markets/betting, you only have an *estimated* edge. If you overestimate your edge, Full Kelly becomes overbetting, which leads to ruin (negative geometric growth).
      *   **Volatility/Drawdown:** Full Kelly is incredibly volatile. A 50% drawdown requires a 100% gain to recover. Full Kelly can easily see 50-80% drawdowns. Most humans (and funds) cannot stomach this psychologically or operationally (margin calls, redemption gates).
      *   **Utility Function:** Log utility implies risk neutrality regarding percentage changes, but most people have higher risk aversion. Losing 50% hurts more than gaining 50% helps in terms of actual life utility (consumption, staying in the game).
      *   **Discrete vs. Continuous:** Markets aren't infinite sequences of identical bets. Regime changes happen.
      *   **Correlation:** In a portfolio of bets, correlations can spike during crises, making a Kelly-optimized portfolio suddenly overlevered.

  4.  **Synthesize the "Why Fractional Kelly?" Argument:**
      *   It's a hedge against estimation error.
      *   It reduces variance disproportionately more than it reduces expected growth (the "efficient frontier" of betting).
      *   It accounts for non-log utility (risk aversion).
      *   It prevents ruin from "black swan" model failures.

  5.  **Drafting the Response (Iterative Process):**

      *   *Acknowledge and Validate:* Start by confirming their observation. Yes, Full Kelly is theoretically optimal *under specific conditions*. Yes, practitioners ignore it.
      *   *The "Mathematical Proof" Caveat:* Clarify what the math actually proves. It proves optimality *if you know the true probabilities*. This is the crux. In reality, you don't.
      *   *Key Reason 1: Edge Estimation Error.* This is the most important technical point. If you think you have a 10% edge but actually have 2%, Full Kelly bets too much. Fractional Kelly acts as a safety margin. Mention "Overbetting leads to negative growth."
      *   *Key Reason 2: Volatility Drag & Drawdowns.* Explain the variance. Full Kelly = max growth but also max variance. Half Kelly gives ~75% of the growth with ~50% of the variance. That's a great trade-off.
      *   *Key Reason 3: Utility & Survival.* Log utility is a specific preference. Most people care about not going broke *before* the long run. "The long run is a series of short runs." Mention risk of ruin in finite time.
      *   *Key Reason 4: Market Impact & Liquidity.* In algo trading, betting size affects price. Kelly assumes you can bet any amount at fixed odds.
      *   *Conclusion:* Fractional Kelly isn't "leaving money on the table"; it's paying an insurance premium against model error and psychological failure.

  6.  **Refining the Tone:**
      *   Avoid being condescending. The user is technically inclined ("algo-betting bot," "geometric rationality").
      *   Use precise terms (ergodicity, estimation error, variance reduction).
      *   Keep it practical.

  7.  **Self-Correction/Edge Case Check:**
      *   *Did I mention Thorp?* Edward Thorp is the godfather of this. Worth a mention.
      *   *Did I explain the growth/variance trade-off curve?* The curve is flat at the top. This is crucial. Moving from Full to Half Kelly loses little growth but gains huge safety.
      *   *Is "Geometric Rationality" addressed?* Yes, point out that it assumes the model is the territory.

  8.  **Final Polish:** Organize into clear sections. (1) The Theory vs. Reality Gap, (2) Estimation Error, (3) The Variance Trade-off, (4) Survival. (This matches the structure of the final output).

