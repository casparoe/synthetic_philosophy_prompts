  ### The Scenario: The Redundant Veto

  **The Setup:** Mara is a mid-level compliance officer at a bank. A refugee client, Mr. K, asks her to unlock a frozen account so he can pay for legal counsel before a deportation hearing. Mara, pressured by her superiors to "minimize risk," manually signs the order to keep the funds frozen. Mr. K is deported and dies abroad. Mara is haunted for years by the belief that she held his life in her hands and chose wrong.

  **The Reveal:** Years later, Mara learns that Mr. K's account had already been flagged by an automated government sanction list the day *before* she made her decision. The bank's system was configured such that any manual attempt to *unlock* a flagged account would trigger an immediate, unappealable override by the compliance algorithm. However, if the manual decision was to *keep it frozen* (which Mara chose), the algorithm remained dormant, logging it as a human-led decision.

  **The Philosophical Work:** Mara is treated as morally responsible. She acted on her own reasons (career security, risk aversion). The "Intervener" (the algorithm) ensured the outcome (frozen funds) would have happened regardless, but only would have *acted* if she tried to do otherwise. She couldn't have succeeded in saving him, but she is blameworthy for willing his ruin.

  ### Why It Dodges the Objections

  **1. The Flicker of Freedom:** Critics argue there's always a tiny alternative (e.g., "She could have *tried* to unlock it"). This scenario dodges that by making the alternative *causally inert* regarding the moral outcome. The "flicker" of pressing the 'unlock' button leads to the exact same state of affairs (frozen funds) via a different mechanism. Since moral responsibility tracks the alignment of the agent's will with the outcome, the inability to change the *result* removes the alternative possibility that matters for exoneration, leaving only the "flicker" of futile motion which carries no moral weight.

  **2. The Prior Sign:** Critics argue the Intervener needs a prior sign to know when to intervene, which implies determinism. Here, the "Intervener" (the algorithm) requires no prediction of Mara's psychology. It operates on a **conditional trigger** based on the *action itself*, not a prior cause of the action. The system doesn't know what she *will* do; it simply stands ready to correct her *if* she deviates. This locates the guarantee in the structural constraints of the present moment, not in a deterministic chain originating in her past.
