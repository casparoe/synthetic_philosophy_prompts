answer: |-
  Here are three attempts, ranging from a direct philosophical clash to a more structural analogy.

  ### Attempt 1: The Theologian's Loophole

  A theologian corners David Lewis at a conference. "David, I've solved the Atonement! If we treat Jesus as humanity's 'perfect counterpart' in a divine possible world, his punishment satisfies justice via modal realism. It's trans-world penal substitution!"

  Lewis adjusts his glasses. "No, it isn't. In counterpart theory, 'you' don't exist in other worlds. Only someone *like* you does. If Jesus is just a counterpart, he's a distinct individual. Punishing a distinct individual for your crime isn't substitution; it's injustice."

  The theologian insists, "But if all worlds are equally real, his suffering is real! Doesn't that balance the cosmic ledger?"

  "It balances *his* ledger," Lewis says. "Yours remains overdrawn. Liability doesn't transfer across concrete boundaries unless there's a prior union. Counterparts merely resemble each other; they don't share an identity."

  The theologian slumps. "So Modal Realism makes the Atonement incoherent?"

  "Not necessarily," Lewis says. "It just means you can't outsource your guilt to a guy who just looks like you. Unless..."

  "Unless what?"

  "Unless *you* are the counterpart. If you're the counterpart of a sinner in another world, then *that* guy is guilty, and you're innocent."

  The theologian brightens. "So I'm saved?"

  Lewis smiles. "No. Because the guy standing here asking me this question is definitely guilty of wasting my time. And *he* is actual."

  > **The Logic:** This relies on Lewis's argument in *Do We Believe in Penal Substitution?* that liability (unlike guilt) might be transferable, but only under specific conditions of union/identity, which counterparts lack (they are distinct concrete individuals). The punchline uses the "I might be the innocent counterpart" loophole to offer hope, then slams it shut by asserting the *actual* world's causal responsibility (wasting Lewis's time) cannot be offloaded to a counterpart.

  ***

  ### Attempt 2: The Courtroom Ruling

  A modal realist is on trial for embezzlement. His lawyer argues, "Your Honor, my client didn't steal the money. His counterpart in World-42 did. Since Lewis says World-42 is just as real as this one, the crime *was* punished there. The counterpart is serving the time right now."

  The judge looks at David Lewis, who is sitting in the jury box. "Is this valid? Is it penal substitution?"

  Lewis shakes his head. "Objection. Counterpart theory denies trans-world identity. The guy in World-42 is a *different person*. Punishing him for my client's crime isn't atonement; it's just punishing an innocent man who looks similar."

  The lawyer panics. "But isn't that exactly what you said about the Atonement? That guilt doesn't transfer!"

  Lewis nods. "Precisely. You can't satisfy justice in World-@ by punishing someone in World-42. That's not theology; that's identity theft."

  The lawyer turns to the client. "So we're screwed?"

  Lewis leans in. "Not necessarily. In World-19, you're innocent."

  The client brightens. "So I can go home?"

  "No," Lewis says. "You're stuck in @. But statistically, most of you are in prison."

  The judge bangs the gavel. "Verdict: Guilty. But I'll note in the record that the defendant's counterpart is a model citizen."

  > **The Logic:** This highlights the core tension you noticed: Counterpart Theory is structurally similar to Substitution (someone else takes the hit), but Lewis's ontology forbids the moral transfer because counterparts are *distinct entities*, not the *same entity* in a different mode. The punchline emphasizes that while the "multiverse sum" of you might be balanced, the *actual* individual (World-@) bears the liability, rendering the counterpart's status legally and morally irrelevant to the trial.

  ***

  ### Attempt 3: The Architecture Analogy (For the Dev)

  A backend developer asks Lewis, "Is Modal Realism like having multiple production environments? Can I push a fix from Staging to Prod?"

  Lewis says, "No. In dev, you deploy the same code to different servers. In modal realism, every server has its own distinct code base that merely resembles the others. They are not instances of the same object."

  The developer asks, "So if Server A crashes, Server B doesn't feel the pain?"

  "Correct," Lewis says. "Which is why Penal Substitution is like trying to fix a crash on Server A by deleting data on Server B."

  The developer nods. "Because they're distinct instances. You can't transfer the exception."

  "Right," Lewis says. "You can't substitute a counterpart for identity any more than you can substitute a backup for the primary without a failover protocol."

  The developer asks, "And what's the failover protocol for sin?"

  Lewis replies, "Repentance. There's no cross-server transaction for guilt."

  The developer sighs. "So the Atonement is a distributed system error?"

  "No," Lewis says. "It's a monolithic architecture trying to run on a microservice ontology."

  > **The Logic:** This maps the philosophical problem (identity vs. resemblance) to a technical problem (instances vs. distinct services). In Lewis's view, possible worlds are causally isolated (like separate servers), and counterparts are distinct objects (not the same ID). The punchline points out that Penal Substitution requires a "monolithic" view of humanity (one shared identity/nature) to work, which clashes with Lewis's "microservice" ontology (many distinct, isolated individuals/worlds). If the services are distinct, you can't handle an exception in one by punishing the other.
