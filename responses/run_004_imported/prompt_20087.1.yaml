answer: |-
  This is a classic sticking point in formal epistemology. The Problem of Old Evidence (POE) exposes a tension between the mathematical elegance of Bayesianism and the messy reality of scientific history. Since you need to get these two fixes straight for your seminar, let's break them down by mechanism, their application to the Mercury/GR case, and the philosophical costs involved.

  ### 1. The Mechanisms

  **The Garber-Jeffrey Move (Learning the Entailment)**
  *   **The Idea:** You are right that if $P(E) = 1$, you cannot update on $E$. Garber (and Jeffrey) argue that what actually changes your credence isn't $E$ itself, but the **logical relationship** between $H$ and $E$.
  *   **The Formalism:** You expand the algebra of propositions to include a statement like $L$: "Hypothesis $H$ entails Evidence $E$." Before Einstein finished GR, $P(L) < 1$ (he wasn't sure his equations would yield the specific perihelion shift). When he derived it, he updated on $L$, not $E$.
  *   **The Result:** Since $P(L) < 1$, standard conditionalization works: $P_{new}(H) = P_{old}(H | L)$. If $H$ entails $E$ and $E$ is known, learning that connection boosts $H$.

  **The Counterfactual Move (The Ur-Prior Strategy)**
  *   **The Idea:** This approach (associated with Howson, Urbach, and others) suggests we assess confirmation not by the agent's *actual* diachronic update, but by a **counterfactual synchronic relation**.
  *   **The Formalism:** We ask: "What would your credence in $H$ have been if you had not yet learned $E$?" Let's call this fictional credence function $P_0$. We then calculate confirmation as $P_0(H | E) > P_0(H)$.
  *   **The Result:** This restores the inequality needed for confirmation. It claims $E$ confirms $H$ relative to a state where $E$ was unknown, even if the actual agent already knew $E$.

  ---

  ### 2. Which tells a more believable story about Mercury and GR?

  **Winner: The Garber-Jeffrey Move.**

  Here is why: The Mercury case is fundamentally a story about **discovery and cognitive resolution**.
  *   **Garber-Jeffrey:** This captures the psychological reality of Einstein's situation. The data about Mercury ($E$) was indeed "old" ($P(E)=1$). It wasn't new data that changed his mind. What changed his mind was the realization that *his specific theory* locked onto that old data. The "aha!" moment was the derivation ($H \to E$), not the observation. This explains why the credence in GR went up *at that specific moment in time*.
  *   **Counterfactual:** This tells a story about objective evidential support, not historical belief change. It says, "Mercury supports GR." But it struggles to explain why Einstein's credence *changed* in 1915. If confirmation is defined by a fictional past state ($P_0$), then strictly speaking, no confirmation happened in 1915 (since $P_{actual}(E)=1$). It makes the 1915 event a "discovery of a timeless relation" rather than a rational update. While true in a sense, it feels less like an explanation of the *event* of confirmation.

  ### 3. Which one relabels the problem rather than solving it?

  **Suspect: The Counterfactual Move.**

  This is the common critique from people like Maher or Christensen.
  *   **The Charge:** The POE asks: "How can old evidence confirm a new theory for an **actual agent**?" The Counterfactual move answers: "It can't for the actual agent; it only confirms relative to a **fictional agent** who doesn't know the evidence."
  *   **Why it feels like relabeling:** It changes the definition of confirmation from "what rationalizes belief change in the actual world" to "what holds in a reconstructed epistemic history." It solves the math by changing the subject to a hypothetical scenario that never existed. It saves Bayesianism by saying, "Well, technically confirmation is defined relative to ur-priors," which many find to be an ad hoc maneuver to save the formalism.

  **Garber-Jeffrey** is less guilty of relabeling but guilty of **idealization failure** (more on that below). It attempts to model the actual update, just on a different proposition ($L$ instead of $E$).

  ---

  ### 4. Logical Omniscience: Cost or Concession?

  **Does Garber-Jeffrey require giving up logical omniscience?**
  **Yes, absolutely.**
  In standard Bayesianism, agents are logically omniscient. If $H$ entails $E$, a standard Bayesian agent *must* assign probability 1 to the proposition $(H \to E)$ immediately upon understanding $H$ and $E$. If $P(H \to E) = 1$ always, you cannot update on it (conditionalizing on a certainty changes nothing). For Garber-Jeffrey to work, the agent must be capable of being uncertain about logical consequences.

  **Is this a real cost, or something Bayesians must concede anyway?**
  This is the crux of your seminar debate.

  *   **Argument for "Real Cost":** Standard Bayesianism is a normative theory of *ideal* rationality, not a descriptive psychology. Logical omniscience is a feature, not a bug; it sets the ceiling for rationality. By giving it up, Garber-Jeffrey turns Bayesianism into a theory of bounded rationality. This breaks many standard theorems (like the Dutch Book argument, which relies on logical omniscience to ensure coherence). It makes the formalism much messier (e.g., how do you constrain logical learning? Can I update on $H \to E$ without updating on $E \to H$?).
  *   **Argument for "Necessary Concession":** Any Bayesian who wants their theory to apply to **human scientists** (like Einstein) must concede this. No human is logically omniscient. We constantly learn logical/mathematical facts (e.g., "Does this model entail this prediction?") that shift our credences. If Bayesianism cannot model learning a mathematical proof, it cannot model theoretical science. Therefore, giving up logical omniscience isn't a cost; it's a **correction** that makes the view applicable to reality.

  ### Summary for your Seminar

  If you want to take a stance:

  1.  **Garber-Jeffrey** is the better model for the **dynamics of belief**. It explains why Einstein's confidence spiked in 1915. It requires dropping logical omniscience, which is a formal cost but a philosophical necessity for modeling real agents.
  2.  **The Counterfactual Move** is a better model for **objective evidential relations** (GR *is* supported by Mercury), but it risks "changing the subject" by defining confirmation relative to a fictional epistemic past rather than explaining actual belief revision.

  **The "Gotcha" Point:** If you want to impress the seminar, point out that Garber-Jeffrey solves the POE only by creating the **Problem of Logical Learning**. If we aren't logically omniscient, what are the rules for updating on logic? Standard conditionalization doesn't apply to logical truths (since they should be probability 1). So Garber-Jeffrey solves POE but breaks the standard updating rule, requiring a new theory of how we learn logic. The Counterfactual move keeps standard updating but makes confirmation dependent on fictional histories. Both pay a price.
