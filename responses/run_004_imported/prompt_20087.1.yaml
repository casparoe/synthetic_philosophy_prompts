      *(Self-Correction on "Relabeling"):* Actually, some argue G-J relabels the problem because it turns empirical confirmation into logical learning. But the Counterfactual view is more commonly criticized for making confirmation dependent on a fictional history. I will present the Counterfactual view as the one more susceptible to the "relabeling/changing subject" charge because it defines confirmation relative to a state that never existed.

      *(Self-Correction on Logical Omniscience):* Be careful. Standard Bayesianism *requires* it. So giving it up is a deviation from standard Bayesianism. But is it a cost *of the view* (i.e., is the view worse)? It makes it more realistic. I need to balance "cost relative to formalism" vs "cost relative to truth."

