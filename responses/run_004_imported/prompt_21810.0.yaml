      *   *Why is this "Wrong"?* It's not wrong for the agent, it's wrong for the *system*.
      *   *User wants:* "Where treating a reasoner as logically omniscient forces a specific credence or decision that's clearly the wrong call."
      *   *Ah, the "Wrong Call":* If the agent is *part* of a system that requires uncertainty (like a mechanism design setup), omniscience breaks the mechanism.
      *   *Better:* **The "Proof of Work" Salary Contract.**
      *   *Setup:* Employer pays Employee if Employee finds a hash preimage.
      *   *Omniscient Employee:* Already knows the preimage. Does no work. Demands pay.
      *   *Employer:* Knows Employee is omniscient?
      *   *This is getting messy.*

      *   *Let's focus on the "Credence" aspect.*
      *   **Scenario:** A bet on a mathematical truth that is *true* but the agent is offered odds that reflect *uncertainty*.
      *   **The Trap:** If you are logically omniscient, you cannot accept a bet that offers positive expected value *if the bet implies you didn't know the truth already*.
      *   *Wait, the standard Dutch Book argument says Omniscience protects you.*
      *   *I need the reverse:* A situation where Omniscience *costs* you.
      *   **The "Paradox of Idealization" in Decision Theory.**
      *   If I know $A \to B$, and I know $A$, I know $B$.
      *   Suppose calculating $B$ is costly, but knowing $B$ allows me to avoid a disaster.
      *   Omniscient agent knows $B$ for free. Bounded agent must pay cost. Omniscient wins.
      *   *This is the opposite of what I need.*

      *   *Okay, let's look at the "Crypto" claim again.* "A truly logically omniscient Bayesian could never use a cryptographic scheme."
      *   Why is this a "wrong call"? Because they *want* to use it for privacy.
      *   **Concrete Example: The Sealed Bid Auction.**
      *   **Setup:** Second-price sealed-bid auction.
      *   **Item:** Worth \$100 to me.
      *   **Mechanism:** I encrypt my bid $B$ and send ciphertext $C$.
      *   **Omniscient Opponent:** Sees $C$. Decrypts it instantly (logical entailment). Knows $B$. Bids $B + \epsilon$. I lose.
      *   **Bounded Opponent:** Sees $C$. Cannot decrypt. Bids based on prior. I might win.
      *   **Conclusion:** Using encryption is useless for an Omniscient agent. They *cannot* participate in a sealed-bid auction effectively. They are forced to bid openly.
      *   *Is this a "wrong decision"?* It's a limitation on their *capabilities* to engage in certain protocols.
      *   *Can we make it a decision error?*
      *   Suppose the Omniscient agent *offers* a contract based on their certainty.
      *   **The "Mathematical Insurance" Policy.**
      *   Agent sells insurance on "The Riemann Hypothesis is true by 2030".
      *   Omniscient Agent: Knows it's True (or False).
      *   If True: Sells insurance for \$0.01. Collects premium. Pays nothing. Profit.
