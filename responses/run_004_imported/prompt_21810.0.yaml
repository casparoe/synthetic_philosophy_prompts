      *   *If Insurer is Omniscient:* They know the result already. If the result is bad, they charge \$1M (no insurance). If good, they charge \$0. Insurance market collapses.
      *   *If Insurer is Bounded:* They assign probability $p$. They charge premium $p \times \$1M$. Market works.
      *   *Wait, this shows the Omniscient agent *prevents* the market, not that they make a bad decision themselves.*

      *   *Let's try the "Money Pump" / Dutch Book angle on the Omniscient Agent.*
      *   Actually, the strongest argument is about **Value of Information** and **Decision Theory**.
      *   If I know the outcome of a deterministic process, I cannot gain value from waiting.
