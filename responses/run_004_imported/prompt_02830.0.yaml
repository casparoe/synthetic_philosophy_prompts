      *   *Why propose it?* To find common ground. Everyone agrees we *report* having hard-to-explain experiences. Not everyone agrees on the ontology of those experiences.
      *   *The "Easy" Hope:* Maybe the mechanisms generating these reports are standard cognitive science (functional/physical), even if the experience itself is non-physical (for dualists/panpsychists).
