          *   *Key Distinction:* Cognitive mechanisms vs. Phenomenal ontology.

      *   *Objection 2: "It's a mere relabeling."*
          *   *Counter:* It shifts the target from "Why is there experience?" to "Why do we judge experience to be X?" This allows empirical work (neuroscience, psychology) to engage without settling metaphysics first.

      *   *Objection 3: "It mainly serves illusionists."*
