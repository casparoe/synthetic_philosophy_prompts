answer: |-
  **Setting:** *A quiet corner of a university faculty lounge, late afternoon. Two emeritus professors, ELIAS (Everettian) and MARA (Bohmian), are finishing up coffee. They've known each other for decades.*

  **Elias:** So, I heard you've been reading Saunders and Wallace. I suppose you're finally ready to admit that the wavefunction is all there is?

  **Mara:** Don't start, Elias. I'm just exploring why my former colleagues think I'm a heretic. But honestly, the charge that Bohmian Mechanics is just "Many-Worlds in denial" keeps nagging at me. Specifically the ontological cost. You guys claim we're hoarding "empty waves."

  **Elias:** It's not just a claim, Mara. Look at the math. In Bohm, you have the universal wavefunction $\Psi$ evolving via Schrödinger's equation. That never collapses. Ever. So, after a measurement, you have a superposition of macroscopic states. In my book, those are all real worlds. In your book, only one is "occupied" by the particle configuration $Q$. But the other branches of $\Psi$ are still *there*. They still exist in the formalism. You haven't shaved them off; you've just declared them haunted houses.

  **Mara:** But they are dynamically inert, Elias. That's the point. Once the branches separate in configuration space due to decoherence, the empty waves no longer influence the actual particle trajectory. The particle is guided only by the branch it's in. The rest might as well not exist for all the causal work they do.

  **Elias:** "Might as well not exist" is doing a lot of heavy lifting. If I recombine the beams in an interferometer, those "inert" waves interfere. They have physical effects. They carry energy, momentum, phase. You're telling me they are physically real enough to push a particle around, but ontologically second-class? That's the bloating. You have the full ontology of the wavefunction—my entire universe—plus you add a set of point particles riding on top of it. By Occam's Razor, I should win hands down. I have $\Psi$. You have $\Psi$ + $Q$.

  **Mara:** You're counting entities like they're marbles in a jar. Occam's Razor isn't about minimizing the *number* of terms in the Lagrangian; it's about minimizing *ad hoc* postulates. Let's talk about the Born Rule. In your theory, where does probability come from? If every outcome happens, what does it mean to say one is "more probable" than another?

  **Elias:** Decision theory. Deutsch-Wallace. If you accept that the wavefunction is real and branching is structural, then a rational agent must bet according to the squared amplitude weights. It's not about frequency of outcomes; it's about the measure of existence of the branches.

  **Mara:** With respect, that's circular. You're deriving probability from a deterministic theory by smuggling in decision-theoretic axioms that already assume the weights matter. In Bohm, probability is epistemic. It's statistical mechanics. We have a distribution $\rho = |\Psi|^2$ (the Quantum Equilibrium Hypothesis). It's no different than Boltzmann. We don't know the exact initial position of the particle, so we get probabilities. It's clean. In MWI, you have to explain why I should care about the "measure" of a branch if *I* exist in all of them.

  **Elias:** But your "clean" probability relies on the assumption that the universe started in quantum equilibrium. Why? And don't tell me it's typicality, because that's just typicality with respect to the measure $|\Psi|^2$. You're assuming the Born rule to get the Born rule. Meanwhile, my theory is just the Schrödinger equation. No extra equations of motion for particles. No equilibrium hypotheses. Just unitary evolution.

  **Mara:** But unitary evolution doesn't give me a world, Elias. It gives me a vector in a high-dimensional Hilbert space. Where is the table? Where is the chair? In Bohm, the primitive ontology is the particles. The table is the particles arranged table-wise. The wavefunction is nomological—it's a law, like a force field. It tells the particles how to move. You don't say a gravitational field is "real matter" in the same way a planet is.

  **Elias:** Ah, the nomological defense. You're trying to downgrade $\Psi$ to a law to save on ontological cost. But $\Psi$ lives in configuration space, not 3D space. If it's a law, it's a law defined on a space of $3N$ dimensions. That's a very strange law. In MWI, we accept that the fundamental reality is high-dimensional. The 3D world emerges via decoherence and the structure of the Hamiltonian. Your "particles" are the weird addition. Why do you need them? To tell you which branch you're on? But *you* are the branch.

  **Mara:** I need them because without them, I don't have definite outcomes. I have a superposition of "Mara sees spin up" and "Mara sees spin down." You say both are real. I say that contradicts my experience. I see one thing.

  **Elias:** And I say your experience is local to a branch. Look, here's the real jab, Mara. You criticize me for having too many worlds. But since your $\Psi$ never collapses, you *also* have all those branches. They are in your equations. The only difference is that you've sprinkled fairy dust (the particles) on one branch and called it "Real," while the others are "Empty." But if the Empty waves are still part of the physical field guiding the particles, they are real. So you have Many Worlds, but you've hidden all the other copies of Mara. You're a Many-Worlder who feels guilty about the multiplicity.

  **Mara:** That's the "Empty Wave" objection, yes. But here's the counter-punch: In Bohm, the other branches are *empty* of matter. They are ghosts. If I define "world" as a configuration of matter, there is only one world. In your view, there are billions of configurations of matter, all equally real. You aren't saving ontology; you're maximizing it. You say the wavefunction *is* the matter. I say the wavefunction *guides* the matter.

  **Elias:** But if the "empty" part of the wavefunction can, in principle, be revived—like in a quantum eraser experiment—then it wasn't empty. It was waiting. It had potentiality. In MWI, we just say the branches decohere and effectively don't talk to each other. You say the same thing, but you insist there's a little dot riding one wave. If that dot doesn't change the empirical predictions—if Bohm and MWI are empirically equivalent in equilibrium—then the dot is metaphysical baggage.

  **Mara:** It's not baggage if it solves the measurement problem without multiplying observers! Think about the cost of your "emergence." You need decoherence to define the branches. But decoherence is approximate. It's never exact. So your "worlds" are fuzzy. When does a split happen? Is it continuous? In Bohm, the split is effective, but the ontology is sharp. The particle is here, not there. The fuzziness is in our knowledge, not in the world. I prefer a theory where "existence" is binary, not a matter of degree.

  **Elias:** I prefer a theory where the laws are simple, even if the consequences are vast. You're willing to complicate the dynamics (adding the guiding equation) to save our intuition about uniqueness. I'm willing to complicate our intuition about uniqueness to save the simplicity of the dynamics. But let's be honest: the "Empty Wave" criticism sticks because you can't explain why the empty waves don't count as worlds without invoking the particles. And if the particles do nothing but label the world...

  **Mara:** They don't do nothing! They constitute the macroscopic reality. Without them, you don't have a local beable. You have a cloud in 3N-space. How do you get 3D space out of that without a mapping rule? That mapping rule is just as "added" as my particles.

  **Elias:** The mapping comes from the interactions. The Hamiltonian is local in 3D space. That structure is in $\Psi$. The 3D world is encoded in the entanglement structure.

  **Mara:** Encoded, but not *present*. Look, Elias, here's where I think you're vulnerable. You say I'm a closet Many-Worlder. Fine. But I'm a Many-Worlder with a mechanism for probability that looks like physics, not decision theory. And I'm a Many-Worlder where only one history is actualized. If Occam's Razor cuts away "superfluous entities," does it cut away the entities that make my experience unique? If I cut those away, I'm not explaining *my* reality anymore. I'm explaining the reality of a multiverse I can't access.

  **Elias:** And if you keep the empty waves, you're positing a vast, invisible infrastructure that does almost no work, just to preserve the idea that "I am special." That sounds theological. The empty waves are the other worlds, Mara. They have the same complexity, the same structure. They contain copies of you who think they are the real one. By refusing to acknowledge them as real, you aren't saving ontology. You're just refusing to look at the full size of your own house.

  **Mara:** I acknowledge they exist as fields. I deny they exist as *worlds*. A world requires a witness. A configuration. You have the stage but no actors. I have the stage and the actors. You say the stage is the actor. I say that's a category error.

  **Elias:** (Laughs) The stage is the actor. I'll put that on a t-shirt. But seriously, if we ever get to test non-equilibrium Bohmian mechanics, and we find superluminal signaling, you win. Until then, I'll stick with the theory that doesn't require a hidden variable to tell me which branch I'm on. I'm on all of them.

  **Mara:** And I'll stick with the theory that tells me I'm only here. Because frankly, Elias, if the other versions of me are out there living my life, I'd like them to pay some taxes. Since they don't, I assume they aren't real.

  **Elias:** Typical Bohmian. Obsessed with local conservation laws.

  **Mara:** Typical Everettian. Obsessed with global unitary at the expense of the local view.

  *(They clink coffee mugs.)*

  **Mara:** Same time next week? I want to hear your take on the Preferred Basis problem.

  **Elias:** Only if you bring your best argument against the Nomological view. I hear Goldstein has a new paper.

  **Mara:** Deal.
