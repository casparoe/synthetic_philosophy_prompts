      *   **Topic:** The specific criticism from Everettians (Many-Worlds Interpretation, MWI) against Bohmian Mechanics (De Broglie-Bohm, dBB): that dBB retains the full wavefunction (including "empty" branches) but adds hidden variables (particles), making it ontologically bloated compared to MWI.
      *   **Task:** Write a dialogue between a committed Bohmian and a committed Everettian.
      *   **Constraints:** Genuine back-and-forth, no strawmanning, both sides playing the "smartest version" of their position, addressing the specific "empty wave" vs. "many worlds" ontological cost argument.
      *   **Tone:** Intellectual, respectful but spirited, technically accurate (given the user's background).

  2.  **Character Conception:**
      *   **The Everettian (Eva):** Needs to emphasize parsimony of *postulates* rather than *ontology* in the naive sense. She should argue that the wavefunction *is* the world, and branching is inevitable. The "empty waves" in Bohm are just other worlds without particles, which is weird.
      *   **The Bohmian (Ben):** Needs to emphasize clarity of *phenomenology* and the definition of "existence." He should argue that the empty waves are dynamically inert regarding the particle configuration, and that MWI fails to recover probability (the Born rule) without circularity. He needs to defend the particle as the locus of reality.

  3.  **Key Arguments to Include:**
      *   **Eva (MWI):**
          *   Schrödinger equation is linear and universal.
          *   Bohm keeps the whole $\Psi$ anyway (ontologically costly).
          *   Bohm adds particles ($Q$) on top of $\Psi$.
          *   MWI just has $\Psi$.
          *   The "empty" branches in Bohm are effectively other worlds; why privilege one trajectory?
          *   Decoherence explains the appearance of collapse without extra rules.
      *   **Ben (dBB):**
          *   $\Psi$ is a law/nomological entity, not necessarily "stuff."
          *   Particles provide definite outcomes (the "primitive ontology").
          *   MWI has the "Incoherence Problem" (why probability if everything happens?).
