      *   **Name the Theory:** Introduce Aumann's Agreement Theorem. This gives the user the vocabulary they need.
      *   **Analyze the Assumptions (Where it breaks):**
          1.  *Common Priors:* The biggest break. Different mental models.
          2.  *Common Knowledge:* Sharing info $\neq$ sharing how info is weighted.
