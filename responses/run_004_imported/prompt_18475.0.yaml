prompt: |-
  I'm a junior at my high school, and this year I was elected to our Honor Council -- the student-faculty board that investigates academic integrity cases and sends the dean a recommended resolution for each one. We have a hearing this week that has split the council more than any case I've seen so far, and, probably because I took AP Psychology last year, I've ended up being the one asked to write the discussion memo we'll go over before Thursday's vote.

  The case: during a chemistry final, a proctor who has monitored exams at our school for over a decade reported seeing a sophomore, Jordan, tilt his paper and glance toward his neighbor's desk twice. What complicates things is that, a few days earlier, a different teacher had mentioned to this proctor, informally, that Jordan was "someone to watch," based on a cheating rumor from last semester that later turned out to be baseless. Jordan's advocate argues that once that expectation was planted in the proctor's mind, the problem isn't just that she may have judged ambiguous behavior more harshly than she otherwise would have: there is real psychological research suggesting that what we expect to see can change what we actually perceive in the moment, not merely how we interpret it afterward, so her report might not amount to the "direct, firsthand observation" our Honor Code requires for a finding. Several other council members are unconvinced. They point out that no observation is ever expectation-free -- arguably that is the whole reason we station experienced proctors instead of substitutes who do not know the students -- so if we discount testimony whenever the observer had some prior belief about the student, we would have to throw out nearly every case that is not caught on camera.

  Could you draft the memo I'll circulate to the council? It should recommend a specific resolution for Jordan's case, propose a general standard the council can use in future cases for weighing proctor testimony when expectation may have shaped what was seen, and take the "we can't function without some expectation-guided observation" worry seriously rather than wave it away.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Junior high school student, member of the Honor Council.
      *   **Task:** Draft a discussion memo for the Honor Council regarding a specific cheating case.
      *   **Audience:** Fellow student council members and faculty advisors (needs to be formal but accessible, persuasive, and balanced).
      *   **Case Details:**
          *   Accused: Jordan (sophomore).
          *   Incident: Chemistry final. Proctor saw Jordan tilt paper/glance at neighbor twice.
          *   Complicating Factor: Proctor was informally warned by another teacher days prior that Jordan was "someone to watch" (based on a baseless rumor).
          *   Defense Argument: Confirmation bias/Expectation effects (Psychology angle). The proctor's perception might have been altered by the prior warning, violating the "direct, firsthand observation" requirement.
          *   Prosecution/Counter Argument: All observation is theory-laden. Experienced proctors *should* know students. Discounting this paralyzes the council.
      *   **Requirements:**
          *   Recommend a specific resolution for Jordan.
          *   Propose a general standard for future cases involving expectation-shaped testimony.
          *   Address the "we can't function without expectation" counter-argument seriously.

  2.  **Determine the Tone and Style:**
      *   **Tone:** Professional, objective, thoughtful, empathetic, and authoritative (but humble, as it's a student memo).
      *   **Style:** Structured like a formal memo (To, From, Date, Subject), with clear headings.
      *   **Voice:** Needs to sound like a high school junior who took AP Psych but is also a responsible leader. Not too academic, but showing understanding of the concepts.

  3.  **Brainstorming the Core Conflict:**
      *   *The Psychological Principle:* Top-down processing / Confirmation Bias / Observer Expectancy Effect. If you expect to see cheating, neutral movements look like cheating.
      *   *The Practical Reality:* Proctors need to be vigilant. Total neutrality is impossible. If we throw out this testimony, do we throw out *all* testimony where a proctor knows a student's reputation?
      *   *The Honor Code Standard:* "Direct, firsthand observation." Does bias negate "directness"?
      *   *The Precedent:* The prior rumor was *baseless*. This is crucial. It's not a prior conviction; it's a rumor. This weakens the proctor's basis for suspicion.

  4.  **Developing the Resolution (Jordan's Case):**
      *   *Option A: Guilty.* Risks punishing based on biased perception. Ignores the "baseless rumor" aspect.
      *   *Option B: Not Guilty (Dismissal).* Upholds the integrity of the "direct observation" clause. Acknowledges the contamination of the witness.
      *   *Option C: Not Guilty (Insufficient Evidence).* This is usually the safer legalistic route. The burden of proof isn't met *because* the reliability of the observation is compromised.
      *   *Decision:* Recommend "Not Responsible" due to insufficient reliable evidence. It's not declaring innocence definitively, but stating the *proof* doesn't meet the standard given the contamination.

  5.  **Developing the General Standard:**
      *   We can't ban all prior knowledge. Proctors *should* know repeat offenders.
      *   Distinction: *Relevant History* vs. *Unsubstantiated Rumor*.
      *   If the prior knowledge is a *confirmed* prior violation, expectation is reasonable vigilance.
      *   If the prior knowledge is a *rumor* or *informal warning* without proof, expectation is prejudicial bias.
      *   Corroboration requirement: If expectation is potentially biased, we need more than one witness or physical evidence.

  6.  **Addressing the Counter-Argument ("All observation is biased"):**
      *   Acknowledge validity: Yes, top-down processing is normal.
      *   Distinguish: There's a difference between "expert schema" (knowing what cheating looks like generally) and "specific prejudice" (expecting *this* student to cheat based on gossip).
      *   The goal isn't to eliminate expectation, but to ensure the expectation is *grounded in fact*, not gossip.

  7.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Introduction:** State the purpose (prepare for Thursday's vote), acknowledge the difficulty.
      *   **Case Summary:** Briefly recap the Jordan situation.
      *   **Psychological Context:** Briefly explain the AP Psych concept (Observer Expectancy Effect) without sounding like a textbook.
      *   **The Core Tension:** Balance the "bias" argument vs. the "practicality" argument.
      *   **Recommendation for Jordan:** Not Responsible. Why? The "baseless rumor" contaminates the "direct observation."
      *   **Proposed Standard:** The "Grounded Expectation" standard. Differentiate between confirmed history and rumors. Require corroboration for the latter.
      *   **Addressing the Counter-Argument:** Explicitly tackle the "we can't function" worry. Explain why this standard actually strengthens the council's legitimacy.
      *   **Conclusion:** Call to action/discussion.

  8.  **Refining and Polishing:**
      *   *Self-Correction during drafting:* Make sure I don't sound like I'm accusing the proctor of lying. It's about *perception*, not dishonesty.
      *   *Check constraints:* Did I recommend a resolution? Yes. A general standard? Yes. Address the counter-argument? Yes.
      *   *Tone Check:* Is it too legalistic? Soften it to sound like a student leader. Is it too casual? Keep it respectful of the process.
      *   *Key Phrase:* "Direct, firsthand observation." Ensure this is central to the argument.

  9.  **Final Review:** (Looking over the generated draft)
      *   The distinction between "expert vigilance" and "prejudicial expectation" is clear.
      *   The resolution is specific (Not Responsible).
      *   The standard is actionable (Corroboration required if based on unconfirmed info).
      *   The tone is appropriate.

  10. **Final Output Generation** (Proceed to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Honor Council Members and Faculty Advisors
  **FROM:** [Your Name], Honor Council Member
  **DATE:** October 23, 2023
  **SUBJECT:** Discussion Memo: Case of Jordan (Chemistry Final) & Standards for Observer Expectancy

  **Purpose**
  This memo is intended to frame our discussion for Thursday's vote regarding the alleged academic integrity violation by Jordan (Class of 2026). As we prepare to deliberate, it is clear this case presents a complex conflict between our Honor Code's requirement for "direct, firsthand observation" and the psychological realities of human perception. This memo outlines the specific circumstances of the case, proposes a resolution for Jordan, and suggests a general standard for handling proctor testimony when prior expectations may influence observation.

  **Case Summary**
  During the Chemistry final, a proctor reported observing Jordan tilt his paper and glance toward a neighbor's desk on two occasions. However, it has come to light that 48 hours prior to the exam, a different teacher informally advised this proctor that Jordan was "someone to watch," citing a cheating rumor from the previous semester. That rumor was never substantiated. Jordan's advocate argues that this prior warning created an "observer expectancy effect," potentially causing the proctor to interpret ambiguous movements as cheating. The Council is divided on whether this invalidates the proctor's testimony.

  **The Psychological Context**
  In AP Psychology, we studied how perception is not merely a recording of reality but a construction of the brain. This is often called *top-down processing*. When we have a strong prior expectation (e.g., "this student cheats"), our brains are more likely to categorize ambiguous sensory input (e.g., a glance) as confirming that expectation. This is not to suggest the proctor is lying or acting in bad faith. Rather, as the defense notes, the warning may have altered what the proctor genuinely *perceived*, not just how she interpreted it later.

  **The Counter-Argument: The Necessity of Expectation**
  Several council members have rightly pointed out that we cannot demand proctors be blank slates. We hire experienced proctors specifically because they have a "schema" for what cheating looks like. If we dismiss testimony every time a proctor knows a student's name or reputation, we render the Honor Council unable to function without video evidence for every infraction. We must take this concern seriously: a standard that is too rigid protects individual students at the expense of the community's integrity.

  **Recommendation for Jordan**
  **I recommend the Council vote "Not Responsible."**

  This recommendation is not a definitive declaration of Jordan's innocence, but a ruling on the *reliability of the evidence*. Our Honor Code requires "direct, firsthand observation." For an observation to be considered direct, the observer's neutrality must not be compromised by unsubstantiated bias.

  Because the proctor's vigilance was heightened by a *baseless rumor* rather than a confirmed prior violation, the reliability of her observation is fundamentally compromised. We cannot verify if she saw cheating, or if she saw what she was told to look for. In cases where the burden of proof is not clearly met due to compromised observation, the benefit of the doubt must go to the student.

  **Proposed General Standard: "Grounded Expectation"**
  To address the concern that this sets an impossible precedent for future cases, I propose we adopt a "Grounded Expectation" standard for evaluating proctor testimony. This distinguishes between *expert vigilance* and *prejudicial expectation*.

  1.  **Grounded Expectation (Permissible):** A proctor may rely on prior knowledge if it is based on **confirmed** prior Honor Code violations or documented behavioral patterns established by the Dean's Office. In these cases, the proctor's expectation is based on fact. Their testimony can stand alone if they are confident in what they saw.
  2.  **Ungrounded Expectation (Requires Corroboration):** A proctor's observation is considered potentially compromised if it is influenced by informal warnings, rumors, or unverified reports from other faculty or students. In these cases, the proctor's testimony **cannot stand alone**. It requires corroboration (e.g., a second proctor, physical evidence like matching answers, or a confession) to meet the burden of proof.

  **Addressing the "Paralysis" Concern**
  Adopting this standard does not paralyze the Council. It simply shifts the burden of proof when the evidence source is potentially biased.
  *   If a proctor knows a student is a repeat offender (Grounded), their testimony remains sufficient. We do not lose the ability to catch repeat offenders.
  *   If a proctor is acting on gossip (Ungrounded), we require more evidence. This is not a bug; it is a feature. It incentivizes faculty to avoid sharing unverified rumors that could contaminate an investigation. It ensures that our findings are based on what actually happened in the room, not on a student's past reputation.

  **Conclusion**
  We are tasked with upholding the Honor Code, but we must also uphold the fairness of the process. Finding Jordan "Responsible" based on testimony influenced by a baseless rumor risks violating the very integrity we seek to protect. By voting "Not Responsible" in this specific instance and adopting the "Grounded Expectation" standard moving forward, we protect students from bias while maintaining the Council's ability to act on legitimate, fact-based proctor observations.

  I look forward to discussing this with you all on Thursday.
