answer: |-
  You are absolutely right to be annoyed. The pop-sci reduction of the Handicap Principle to "waste equals honesty" is one of the most persistent and damaging simplifications in evolutionary biology. It turns a subtle game-theoretic insight about marginal incentives into a cartoon about burning money to prove you have money.

  While Zahavi's original intuition emphasized cost, Alan Grafen's 1990 formalization clarified that **absolute cost is not the mechanism; differential marginal cost is.** The signal works not because it is expensive, but because it is *expensive in a specific way* that exploits the physiological differences between high-quality and low-quality individuals.

  To see why "waste" is a red herring, we need to look at the **single-crossing condition**. In a separating equilibrium, a low-quality individual *could* physically produce the high-quality signal, but they choose not to because the *additional* cost of doing so outweighs the *additional* benefit. The high-quality individual produces it because their additional cost is lower.

  The total amount of resources burned at equilibrium is just a byproduct of how steep that differential is. If the differential is sharp, the equilibrium cost can be surprisingly low.

  ### The Model: The Perilous Perch

  Let's ditch the peacocks. Instead, imagine a species of desert lizard, *Sceloporus signalis*.

  **The Context:**
  Males compete for mates by performing a "perch display." They climb out onto an open rock to do push-ups.
  *   **The Signal ($x$):** The distance (in meters) the lizard ventures from the safety of its burrow before stopping to display.
  *   **The Quality ($q$):** The lizard's sprint speed (ability to escape predators). High $q$ = Fast, Low $q$ = Slow.
  *   **The Benefit:** Females prefer males who display further out ($B(x)$ increases with $x$). It implies confidence and visibility.
  *   **The Cost:** Predation risk ($C$). The further you are from the burrow, the higher the chance a hawk snatches you.

  **The Pop-Sci "Waste" Interpretation:**
  "The lizard walks far out into the open. This is dangerous! He is risking his life. Only a truly fit lizard can afford to risk death. The danger is the proof."

  **The Grafen/Spence "Sorting" Interpretation:**
  The danger isn't the proof. The *slope of the danger* is the proof.

  Let's look at the cost function $C(x, q)$.
  For a **Fast Lizard (High $q$)**: Moving from 1 meter to 2 meters away adds a tiny amount of risk. They know they can outrun the hawk.
  For a **Slow Lizard (Low $q$)**: Moving from 1 meter to 2 meters adds a *massive* amount of risk. That extra meter is the difference between life and death.

  Mathematically, this is the cross-partial derivative:
  $$ \frac{\partial^2 C}{\partial x \partial q} < 0 $$
  The marginal cost of distance ($\frac{\partial C}{\partial x}$) decreases as quality ($q$) increases.

  ### Why "Waste" is Irrelevant

  Here is where the pop-sci narrative falls apart. Imagine a scenario where hawks are currently very rare.

  1.  **The Equilibrium:** Suppose the evolutionary stable strategy dictates that High Quality lizards display at **2 meters**, and Low Quality lizards display at **1 meter**.
  2.  **The Absolute Cost:** At 2 meters, with few hawks, the actual probability of death might be only **0.1%**.
  3.  **The Pop-Sci Take:** "0.1% risk? That's hardly a handicap! That's barely a cost. The signal must be cheap and therefore unreliable."
  4.  **The Reality:** The signal is perfectly honest. Why? Because for the Slow Lizard, moving from 1 meter to 2 meters might increase their risk from 0.1% to **50%**.

  The Slow Lizard looks at the 2-meter spot. They *could* physically walk there. It doesn't require "wasting" energy they don't have. But the *marginal jump* in risk destroys their expected fitness. The Fast Lizard looks at the same jump and sees a risk increase from 0.1% to 0.15%.

  The honesty is sustained by the **gap in marginal sensitivity**, not the absolute height of the cost.
  *   If you focus on **waste**, you ask: "How much energy/risk is burned?"
  *   If you focus on **sorting**, you ask: "How much harder is it for the liar to fake this than for the truth-teller to say it?"

  ### The "Low Cost" Equilibrium

  Your point that the equilibrium cost could be quite low is critical. In many signaling models, we assume the signal must be "costly enough" to deter cheating. But "costly enough" is relative to the *benefit of cheating*, not relative to the organism's total budget.

  If the benefit of mating is $V$, the signal cost $C$ only needs to satisfy:
  $$ C_{low}(x_{high}) - C_{low}(x_{low}) > V $$
  $$ C_{high}(x_{high}) - C_{high}(x_{low}) < V $$

  If the differential in cost functions is steep (i.e., the Slow lizard is *much* more vulnerable to distance than the Fast lizard), then $x_{high}$ doesn't need to be very far out to satisfy the inequality.

  You could have a situation where the "honest" signal costs the High Quality individual almost nothing in absolute terms, yet remains perfectly immune to mimics. The "Handicap" is not a heavy tail dragging the peacock down; it is a lock that only the high-quality individual has the key to, even if the lock weighs nothing.

  ### Conclusion

  The pop-sci obsession with "waste" leads to a fundamental misunderstanding of evolutionary stability. It suggests that nature is fundamentally inefficient, burning calories just to burn them.

  The Grafen model suggests nature is fundamentally **informational**. The system is designed to extract private information (quality) through public actions (signals). The "cost" is merely the price of admission to the separating equilibrium.

  By fixating on the peacock's tail as a "burden," we miss the real insight: **Signaling works because biology is heterogeneous.** It works because the same action maps to different internal states for different individuals. The tail isn't honest because it's heavy; it's honest because *growing* it hurts the weak much more than it hurts the strong.

  So, you are correct. The "Handicap Principle" is a misnomer. It should be called the **Differential Marginal Sensitivity Principle**. But that doesn't sell books, and it doesn't make for a good documentary voiceover. "Waste" is a better story, but "Sorting" is the science.
