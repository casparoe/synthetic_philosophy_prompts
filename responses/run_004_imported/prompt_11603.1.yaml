answer: |-
  This is a fantastic debate to have had, and your friend is largely correct about the text and the general contour of Quine's view, but your pushback is philosophically sharper than you might realize. You've hit on the exact tension that makes Quine's metaethics interesting (and controversial).

  The essay in question is indeed **"On the Nature of Moral Values,"** found in *Theories and Things* (1981). Your friend's summary of the "observation sentence" argument is accurate, but your objection—that this "proves too much" against history or theoretical physics—is the crucial point where Quine's specific naturalism does some heavy lifting.

  Here is a reconstruction of Quine's reasoning, why he thinks ethics is uniquely disqualified compared to history, and how to label his metaethical stance.

  ### 1. The Observation Sentence Mechanism
  To understand Quine's move, we have to be precise about what an **observation sentence** is for him. It isn't just "a sentence about something you see." It is a sentence that meets two criteria:
  1.  **Immediate Assent:** It is triggered directly by sensory stimulation (e.g., seeing red and saying "Red").
  2.  **Intersubjective Agreement:** Any competent speaker of the language, given the same stimulation, would agree.

  For Quine, science is a "fabric" or "web of belief." Theoretical sentences (like electrons exist) are far from the edge. Observation sentences are at the edge. The link between them is **causal and explanatory**. Theoretical sentences are retained because they help us *predict* the observation sentences. If a theory fails to predict sensory stimulation, we adjust the web.

  **Quine's Claim about Ethics:**
  Quine argues that moral sentences (e.g., "Stealing is wrong") lack the first criterion. They are not triggered by sensory stimulation. If you see a theft, your retina receives light waves (observation), but the judgment "wrong" is not caused by the light waves; it is caused by your **internalized standards** or **sentiments**.

  Therefore, moral sentences do not face the "tribunal of experience." You cannot refute "Stealing is wrong" by pointing to a sensory experience in the way you can refute "There is a red patch" (by showing the patch is green) or "Electrons exist" (by showing the cloud chamber didn't fog).

  ### 2. Answering Your Objection: Why not History?
  Your objection is the strongest part of your position: *"Tons of ordinary empirical claims (about other minds, or history...) are pretty far removed from any observation sentence too."*

  Quine has a specific reply to this, and it hinges on the difference between **distance** and **relevance**.

  *   **History/Other Minds:** The sentence "Caesar crossed the Rubicon" is indeed far from observation sentences. However, it is part of the **explanatory web** that accounts for observation sentences. It implies consequences (there should be documents, ruins, carbon dating results) that *do* cash out in sensory stimulation. Even if we can't check them all, the *type* of claim is one that *could* be checked against experience. It plays a role in predicting and explaining the sensory world.
  *   **Ethics:** The sentence "Stealing is wrong" does not help predict sensory stimulation. It doesn't explain why the light hit your retina the way it did. It doesn't help you anticipate the next noise you'll hear.

  For Quine, the "tribunal of experience" isn't just about being *connected* to observation sentences eventually; it's about whether the sentence contributes to the **predictive efficacy** of the web.
  *   Science (including history and psychology) aims at **truth**, defined naturalistically as the successful prediction of sensory stimuli.
  *   Ethics aims at **social cohesion** and **behavioral regulation**.

  So, ethics isn't disqualified because it is "abstract"; it's disqualified because it is **functionally different**. It isn't trying to map the causal structure of the world; it's trying to manage the behavior of the organisms in the world.

  ### 3. Is Quine a Non-Cognitivist?
  This is where it gets tricky. Quine rejects the Logical Positivist verification principle (which said unverified sentences are *meaningless*). Quine thinks moral sentences are meaningful—they play a vital role in human life. But he denies they are **truth-apt** in the scientific sense.

  *   **Not an Error Theorist (exactly):** An error theorist (like J.L. Mackie) says moral sentences try to state facts, fail, and are therefore all false. Quine is softer. He suggests moral sentences aren't even *trying* to state facts in the way "Electrons exist" is.
  *   **Naturalistic Non-Cognitivist:** This is the best label. Quine thinks we can explain morality entirely through natural science (evolution, psychology, sociology). We can explain *why* we have moral sentiments (they aided survival). But that explanation doesn't validate the moral sentences as *true*.
  *   **The "Folklore" Analogy:** Quine often compares moral values to folklore or biological traits. They are real phenomena (people *have* them), but the *content* of the values doesn't refer to objective entities in the world.

  In *Theories and Things*, he writes:
  > *"Moral traits are selected like biological traits... The values themselves are not discovered; they are inculcated."*

  This is the deflationary move your friend mentioned. Quine naturalizes the *practice* of ethics (we can study it scientifically) but refuses to naturalize the *ontology* of ethics (there are no moral facts to be added to our physics).

  ### 4. Why This Isn't Just Quietism
  A quietist might say, "Science and Ethics are separate domains, don't mix them." Quine is more aggressive. He says:
  1.  **Naturalism is mandatory:** There is no first philosophy. We must use science to understand everything, including morality.
  2.  **Science reveals ethics is not factual:** When we use science to study ethics, we see it is a matter of sentiment and conditioning, not fact-tracking.

  So he isn't refusing to rule on the matter; he is ruling that moral sentences lack "objective purport." They are imperatives or expressions of attitude disguised as declaratives.

  ### Summary of the View
  To settle your debate:

  1.  **Your Friend is Right:** Quine does argue that moral statements lack the causal link to sensory stimulation that observation sentences have, and therefore cannot be part of the truth-apt web of science.
  2.  **You are Right (with a caveat):** Your objection holds for any claim that *aims* at describing the world. Quine's counter is that history *aims* at describing the world (and thus is accountable to evidence), whereas ethics *aims* at regulating behavior (and thus is accountable to social utility, not evidence).
  3.  **The Verdict:** Quine is a **Naturalistic Non-Cognitivist**. He believes moral sentences are meaningful and useful, but they do not state truths about the world. They are tools for social living, not maps of reality.

  **The "Gotcha" for your next conversation:**
  Ask your friend about **Quine's Ontological Commitment**. Quine's famous maxim is "To be is to be the value of a bound variable." We commit to the existence of things when our best scientific theories quantify over them (e.g., "There exists an *x* such that *x* is an electron").
  Since Quine argues ethics is not part of our best scientific theory for predicting experience, we are **not ontologically committed** to moral values. We are committed to electrons; we are not committed to "Wrongness." That is the ultimate deflationary punch.
