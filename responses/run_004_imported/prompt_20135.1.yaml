answer: |-
  Good evening, everyone. For those who don't know me, I'm the older brother.

  Now, usually, this is the part of the speech where I talk about how my brother and his fiancée are "two soulmates" who finally found their "other half." But, as some of you know, my brother is currently deep in a PhD program in philosophy. And he has kindly provided me with a list of forbidden phrases. Apparently, saying they are "two individuals completing each other" is metaphysically suspect.

  He's right. And honestly, I think that makes for a much more beautiful promise.

  In the tradition my brother studies, we aren't seen as isolated atoms floating through life until we bump into someone. We aren't finished products looking for a place to sit. Instead, we are defined by the relationships we inhabit. You are a son, a brother, a friend, a teacher. You are the sum of the ways you connect with others. There is no "you" without the "we."

  So, when I look at [Brother] and [Fiancée], I don't see two static people signing a contract. I see two people who have already changed because of one another.

  I've watched it happen. [Brother], you are kinder than you were five years ago. [Fiancée], you are more patient than you were when you first met. You didn't just find each other; you cultivated each other. You grew into the spaces you occupy together.

  This is what I love about the vision you two share. You aren't trying to fit into old scripts. You aren't looking for a hierarchy where one leads and the other follows. You are building a new role, together, from the ground up. In a way, the marriage isn't something that happens *to* you; it is something you *do*. It is a continuous act of co-creation.

  For our family here tonight, this is deeply comforting. We know that a life well-lived isn't about standing alone at the top of a mountain. It's about the quality of the connections at your back. It's about showing up, day after day, and tending to the relationship until the relationship tends to you.

  [Brother] and [Fiancée], my wish for you is not that you remain the same people who fell in love. My wish is that you continue to be transformed by this partnership. May you always find your meaning in the space between you. May you cultivate a home that isn't a place you go to, but a way you are with one another.

  You are not two halves making a whole. You are a living story that is just beginning its best chapter.

  Please raise your glasses. To the relationship, and to the people you are becoming within it. To [Brother] and [Fiancée].
