      *   **Key Constraint 2 (Social/Ethical):** Avoid traditional *Wu Lun* (Five Relationships) framing regarding husband/wife. No hierarchy, no gendered roles, no "1950s marriage" vibes.
      *   **Audience:** Split 50/50 between philosophy academics (who will spot fake scholarship) and family/elders (who need emotional resonance, not jargon).
      *   **Tone:** Sentimental but intellectually honest, warm, accessible yet precise.
