      *   *Refinement on Dutch Book:* Make sure they distinguish between a *synchronic* Dutch Book (incoherence at a time) and a *diachronic* one (exploitable strategy over time). Van Fraassen's argument is diachronic. Marcus should point out that diachronic books require the agent to *commit* to a strategy, which they shouldn't do in memory-loss cases.
      *   *Literature Check:* Mention Arntzenius (2003) "Some Problems for Conditionalization and Reflection". Mention Christensen (1991) on synchronic vs diachronic. Maybe mention Briggs (2009) on Distorted Reflection.

  6.  **Writing the Dialogue (Iterative Process):**

      *   *Scene:* A dimly lit bar. Whiskey/Beer.
      *   *Elena's Opening:* "Van Fraassen got it right. It's about consistency."
      *   *Marcus's Pushback:* "What about the drug case? If I know I'll be drunk tomorrow, why defer?"
      *   *Deep Dive:* The mechanics. If $P_t(A | P_{t+1}(A) = r) \neq r$, I'm vulnerable.
      *   *Marcus's Move:* In the drug case, I know $P_{t+1}$ will be irrational. Why should $P_t$ match it?
      *   *Elena's Counter:* It's not about matching irrationality. It's about the *condition*. If you know the shift is non-evidential, the condition $P_{t+1}(A)=r$ carries information about the *process*, not just the truth.
