  *(Self-Correction during final review)*: Make sure Elena doesn't just retreat to "Conditionalization is the real norm." She needs to defend Reflection. Her best move is to argue that Reflection captures a *conceptual* truth about belief attribution over time, and the counterexamples show where the *indexical* link breaks, not where the norm fails. Marcus will counter that breaking the link *is* the failure of the norm's universality.

