  *(Self-Correction during drafting)*: Make sure to mention that for Schopenhauer, even the "Idea" is an objectification of Will. So music objectifies Will *in parallel* to how the world objectifies Will into Ideas. Music doesn't copy the Idea; it copies the Will *at the same level* that the Idea does. It's a parallel track, not a derivative one.

  *Wait, let me double check §52 specifically.*
  Schopenhauer writes: "music... skips the Ideas."
  But then: "in the melody... I recognise the highest grade of the objectification of will."
  This sounds like he *is* referencing the grades of Ideas.
  *Resolution:* He is saying the *tones* correspond to the *grades*. But the *nature* of music is still Will. The tones *are* the Will. The Ideas are the Will seen through the lens of space/time/causality. Music is the Will seen through the lens of number/time (rhythm/harmony).
  So, Melody = Human Will. Idea of Man = Human Form.
  Music captures the *effort*, the *striving*. The Idea captures the *form*.
