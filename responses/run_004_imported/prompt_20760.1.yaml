answer: |-
  It is his semiotic idealism exported into economics. Full stop.

  To claim there is a fundamental disanalogy between the two is to mistake a difference in *administration* (who institutes the signs) for a difference in *ontology* (what the signs are). Berkeley's philosophical project is unified by a relentless attack on the notion of intrinsic material value, whether that value is epistemic (in vision) or financial (in coin).

  Here is why the "Export Thesis" holds and why the supposed disanalogy is secondary.

  **1. The Attack on Intrinsic Value**
  In *A New Theory of Vision* and *Alciphron*, Berkeley's target is the materialist assumption that visual ideas resemble or contain the objects they signify. He argues they do not; they are arbitrary marks. In *The Querist*, his target is the bullionist assumption that gold or silver contains intrinsic value. He argues it does not; it is a ticket.

  In both cases, Berkeley is dismantling a fetish. The bullionist worships the metal; the materialist worships the resemblance. Berkeley replaces both with a functionalist relation. A shilling is no more valuable in a desert than a visual idea of fire is hot without the tactile expectation of heat. The value exists only in the *connection* to a future outcome (purchasing power/tactile sensation). If you strip away the system of exchange (the economy) or the system of nature (God's grammar), the sign becomes nothing. This is not a similarity; it is the *same argument* applied to different domains.

  **2. The "Divine vs. Human" Objection is a Red Herring**
  The standard objection is that visual language is instituted by God (stable, universal, necessary for survival), whereas money is instituted by humans (volatile, local, prone to collapse). While factually true, this does not constitute a philosophical disanalogy in Berkeley's semiotics.

  For Berkeley, the *source* of the institution determines the *reliability* of the sign, not its *semiotic structure*.
  *   **Divine Signs:** Instituted by an omnipotent benevolent agent. Therefore, the connection between sign and signified is constant.
  *   **Monetary Signs:** Instituted by fallible human agents (the State, the market). Therefore, the connection is contingent.

  But in both cases, the sign remains a *sign*. It still derives its power entirely from the system embedding it, not from its substance. In fact, the human institution of money *strengthens* Berkeley's idealist point. It proves that a system of signs can generate immense real-world power (industry, employment, national wealth) without *any* material substrate to anchor it. If money worked because of the gold, Berkeley's idealism would be threatened. Because money works *despite* the gold (via credit, paper, tickets), it serves as empirical proof that immaterial relations drive the material world.

  **3. Economics as Applied Semiotics**
  If you accept the disanalogy as fundamental, you fracture Berkeley's philosophy into a metaphysical bucket (God/Vision) and a pragmatic bucket (Money/Politics). But Berkeley was a bishop trying to fix Ireland. He didn't have two philosophies; he had one immaterialist worldview applied to the salvation of souls and the solvency of nations.

  In *The Querist*, when he asks if money is not merely a "ticket for recording" industry, he is using the exact same vocabulary as when he describes visual ideas as "marks" for tactile expectations. He is treating the economy as a language that can be spoken well or poorly. Bad monetary policy is essentially bad grammar—it breaks the connection between the sign (money) and the signified (industry), leading to confusion (poverty) just as bad visual interpretation leads to injury.

  **The Verdict**
  The disanalogy regarding the *institutor* (God vs. Man) is merely a variable in the equation, not a change in the formula. Berkeley's account of money is precisely his semiotic idealism exported into economics. To deny this is to miss the radical core of his thought: that **all** value, whether truth or wealth, is relational, systemic, and immaterial. The gold coin is just as much an "idea" as the visual flame, and both are only valuable insofar as they successfully navigate the system they inhabit.
