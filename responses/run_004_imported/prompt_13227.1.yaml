  Here is a detailed test case designed to discriminate between Rosenthal's Actual HOT theory, Lycan's Higher-Order Perception (HOP) theory, and Carruthers' Dispositional HOT theory.

  ### The Scenario: "The Delayed Conceptualization Task"

  **Subject:** Elena, a neurotypical participant in a psychophysical experiment.
  **First-Order State:** A visual experience of a specific, fine-grained shade of teal (Teal-42) presented in her peripheral visual field.
  **Sequence:** The scenario tracks the status of this single visual state across three distinct temporal phases ($t_1$, $t_2$, $t_3$) involving manipulations of attention and conceptual access.

  **Phase 1 ($t_1$): Iconic Registration (0–200ms)**
  The Teal-42 patch flashes briefly in Elena's periphery. She is fixated on a central cross and is not attending to the periphery. However, the stimulus is salient enough to be registered in her iconic memory. It is not yet attended, and no thought about it has formed. However, the state is *poised*: if she were to shift attention, she could immediately access it.

  **Phase 2 ($t_2$): Attentive Scanning with Conceptual Blockade (200–1000ms)**
  Elena shifts her attention to the periphery (cued by the salience of the flash). Her internal monitoring mechanism engages with the visual state. However, during this window, she is engaged in **articulatory suppression** (repeating "the, the, the" aloud). This task occupies her conceptual-linguistic resources, preventing the formation of any predicative or demonstrative thoughts (e.g., she cannot token the thought "I am seeing teal" or even "I am seeing *this*").

  **Phase 3 ($t_3$): Conceptual Release (1000ms+)**
  The articulatory suppression stops. Elena immediately tokens a non-inferential thought to the effect that she is in the visual state she has been monitoring.

  ---

  ### The Verdicts and Theoretical Commitments

  This scenario yields three distinct profiles of consciousness across the timeline, discriminating the theories based on their specific requirements for the higher-order representation.

  #### 1. Peter Carruthers (Dispositional HOT Theory)
  *   **Verdict:** Elena is phenomenally conscious of the state from **$t_1$ through $t_3$**.
  *   **Discriminating Commitment:** **Mere Availability (Poisedness).**
      Carruthers argues that consciousness does not require the *actual occurrence* of a higher-order state, but only that the first-order state be *available* to the mindreading system. In Phase 1, although no attention or thought has occurred, the state is registered in iconic memory and is *poised* to trigger a higher-order response. For Carruthers, this dispositional availability is sufficient for phenomenality. Consequently, the conceptual blockade in Phase 2 does not extinguish consciousness, because the state remains available to the system even if the system's output channel is temporarily occupied.

  #### 2. William Lycan (Higher-Order Perception Theory)
  *   **Verdict:** Elena is phenomenally conscious of the state from **$t_2$ through $t_3$** (but not $t_1$).
  *   **Discriminating Commitment:** **Actual Perceptual Scanning.**
      Lycan's model requires an *occurrent* higher-order state, but construes it as a quasi-perceptual scan rather than a thought. In Phase 1, there is no attention and thus no internal scanning of the first-order state; the state is merely registered, rendering it unconscious. However, in Phase 2, when Elena shifts attention, the "inner sense" mechanism actively scans the analog visual state. Because HOP does not require conceptualization (only perceptual monitoring), the articulatory suppression does not interrupt consciousness. The scanner detects the state, conferring phenomenality before any thought is formed.

  #### 3. David Rosenthal (Actual HOT Theory)
  *   **Verdict:** Elena is phenomenally conscious of the state **only at $t_3$** (not $t_1$ or $t_2$).
  *   **Discriminating Commitment:** **Actual Conceptual Tokening.**
      Rosenthal requires an *occurrent*, non-inferential higher-order *thought*. In Phase 1, no thought is tokened, so the state is unconscious. Crucially, in Phase 2, even though Elena is attending (satisfying Lycan) and the state is available (satisfying Carruthers), the articulatory suppression prevents the tokening of the requisite conceptual thought. For Rosenthal, without the actual thought "I am in this state," there is no phenomenality. Consciousness only arises in Phase 3 when the suppression lifts and the specific HOT is successfully executed.

  ### Summary of Discrimination

  | Theory | Phase 1 (Poised, Unattended) | Phase 2 (Scanned, No Concept) | Phase 3 (Thought Tokened) | Key Differentiator |
  | :--- | :---: | :---: | :---: | :--- |
  | **Carruthers** | **Conscious** | **Conscious** | **Conscious** | Consciousness begins with *availability*, prior to attention or thought. |
  | **Lycan** | Unconscious | **Conscious** | **Conscious** | Consciousness begins with *actual scanning*, independent of concepts. |
  | **Rosenthal** | Unconscious | Unconscious | **Conscious** | Consciousness begins with *actual conceptual thought*. |

  This scenario avoids the "problem of the rock" or "targetless HOT" objections because the first-order state is real and present in all phases. Instead, it isolates the specific *mechanism* (disposition vs. perception vs. thought) and *timing* (availability vs. attention vs. conceptualization) required to transform that first-order state into a conscious one.
