answer: |-
  Your friend is onto something real. This is not merely a surface-level analogy; it is a substantive structural isomorphism between a foundational problem in the philosophy of science and a practical problem in statistical learning theory. However, while the *logic* is the same, the *stakes* and the *resolution strategies* differ in ways that illuminate both fields.

  Here is an independent assessment of the relationship between the Duhem-Quine thesis and predictive multiplicity, breaking down the parallels, the divergences, and the specific question of the "Quinean move."

  ### 1. The Core Parallel: Empirical Equivalence
  Your friend is correct that predictive multiplicity is a specific, quantifiable instance of **underdetermination of theory by evidence**.

  *   **Duhem-Quine:** For any finite set of observational data $O$, there exist multiple theories $T_1, T_2, \dots T_n$ such that $T_i \vdash O$. The data alone cannot logically compel the acceptance of a single theory.
  *   **Predictive Multiplicity:** For any finite training set $D$, there exist multiple models $M_1, M_2, \dots M_n$ (varying in architecture, weights, or seeds) such that $Loss(M_i, D_{test}) \approx \epsilon$. The validation metrics alone cannot compel the selection of a single model.

  In both cases, the mapping from evidence to explanation is **one-to-many**. The "Rashomon effect" (a term coined in this context by Leo Breiman, explicitly referencing the film about contradictory truths) is essentially the statistical learning formulation of underdetermination. It demonstrates that minimizing empirical risk does not uniquely identify the underlying data-generating process.

  ### 2. Where the Analogy Holds: The Role of "Auxiliaries"
  You asked what plays the role of "auxiliary hypotheses" in ML. In the Duhem-Quine thesis, a hypothesis $H$ is never tested alone, but only as $H \land A_1 \land A_2 \dots$ (where $A$ are auxiliaries like instrument calibration or background assumptions).

  In Machine Learning, the "Core Hypothesis" is typically the **Model Class/Architecture** (e.g., "a transformer is appropriate for this data") combined with the **Learning Principle** (e.g., "Empirical Risk Minimization will generalize").

  The **Auxiliary Hypotheses** in ML are:
  1.  **Hyperparameters:** Learning rate, regularization strength, depth/width.
  2.  **Optimization Choices:** The specific optimizer (Adam vs. SGD), batch size, and initialization seed.
  3.  **Preprocessing Assumptions:** Imputation strategies, normalization methods, feature selection.

  When a model fails to generalize (a failed prediction), you rarely discard the core idea of using neural networks (the Core Hypothesis). Instead, you adjust the auxiliaries (tune hyperparameters, change the seed, clean the data). This is structurally identical to the scientist who, upon a failed experiment, checks the calibration of the microscope (auxiliary) rather than discarding the theory of optics (core).

  ### 3. Where the Analogy Diverges
  While the logical structure is identical, the context creates three important differences.

  #### A. Truth vs. Utility (Realism vs. Instrumentalism)
  *   **Philosophy of Science:** The anxiety of underdetermination stems from a desire for **Truth**. If $T_1$ and $T_2$ both fit the data, but $T_1$ says gravity is curvature and $T_2$ says it's a force, we want to know which one describes reality.
  *   **Machine Learning:** Most supervised learning is explicitly **Instrumentalist**. If $M_1$ and $M_2$ have identical accuracy, standard ML practice often treats them as interchangeable. The "story" the model encodes (feature importance) is secondary to the prediction.
      *   *Exception:* This changes if you are doing causal inference or scientific ML (e.g., drug discovery). In those cases, the "story" matters, and predictive multiplicity becomes a crisis of validity, exactly mirroring the philosophical problem.

  #### B. Finite Sample vs. Nomological Necessity
  *   **Philosophy of Science:** Underdetermination is often discussed regarding *all possible* evidence. Quine argued that even with all possible sensory stimuli, multiple theories could remain compatible.
  *   **Machine Learning:** Predictive multiplicity is largely a **finite-sample phenomenon**. As $N \to \infty$ (and under certain regularity conditions), consistent estimators should converge to the same function. The multiplicity exists because your dataset is a finite projection of the true distribution. It is a form of *transient* underdetermination caused by data scarcity relative to model capacity.

  #### C. The Nature of the "Web of Belief"
  *   **Philosophy of Science:** The web of belief is semantic and logical.
  *   **Machine Learning:** The web is **geometric**. Predictive multiplicity arises because the loss landscape contains wide, flat basins of attraction. Different random seeds land you in different parts of the same "valley" of low loss. The models are functionally distinct but loss-equivalent. This gives us a topological understanding of underdetermination that philosophy lacks: we can actually *measure* the size of the "Rashomon set" (the set of models within a certain accuracy threshold).

  ### 4. The Verdict on the "Quinean Move"
  You asked specifically whether the Quinean move (protecting a favored hypothesis by revising auxiliaries) has a counterpart in ML.

  **The Verdict:** Yes, but it is usually **implicit and pragmatic** rather than dogmatic.

  **In Science:** The Quinean move is often criticized as ad hoc. If I save my theory by inventing an invisible planet every time a prediction fails, I am being unscientific.

  **In ML:** We do this constantly, but we call it **Debugging** or **Tuning**.
  *   *Scenario:* A model exhibits bias against a subgroup.
  *   *Quinean Move:* Instead of admitting the architecture is fundamentally incapable of capturing the fairness constraint (Core Hypothesis failure), we claim the *loss function* was missing a penalty term (Auxiliary revision) or the *data preprocessing* was flawed (Auxiliary revision).
  *   *Interpretability:* When a model produces nonsensical feature importances (e.g., "shoe size predicts credit risk"), practitioners often blame the *explanation method* (SHAP/LIME are approximations/auxiliaries) rather than the model itself. This is a pure Quinean defense: "The theory (model) is fine; the measurement of the theory (interpretability tool) is what failed."

  **Where the Analogy Breaks Down:**
  In science, the Quinean move is often a defensive maneuver to protect a cherished theory from falsification. In ML, the "Quinean move" is the **primary engine of progress**. We *expect* to revise auxiliaries (hyperparameters) iteratively. We do not hold a dogmatic attachment to a specific set of weights or a specific random seed.
  *   **Ensembling:** The ultimate ML response to predictive multiplicity is not to choose one model and defend it (as a scientist might), but to **average them**. By acknowledging that $M_1$ and $M_2$ are equally valid but different, we combine them to reduce variance. This is a pragmatic dissolution of the underdetermination problem that philosophy rarely considers. We accept the multiplicity and monetize it.

  ### Summary Assessment
  Your friend is right: **Predictive multiplicity is the empirical, quantifiable shadow of the Duhem-Quine thesis.**

  *   **Similarities:** Both arise from the logical gap between finite evidence and infinite hypothesis spaces. Both rely on auxiliary assumptions (hyperparameters/background theories) to bridge that gap.
  *   **Differences:** ML treats the problem instrumentally (accuracy > truth) and often resolves it via ensembling rather than theory selection. ML underdetermination is topological and finite-sample dependent, whereas philosophical underdetermination is often logical and infinite.
  *   **The Quinean Move:** It exists in ML as hyperparameter tuning and debugging, but without the philosophical stigma. In ML, tweaking auxiliaries to save the core architecture isn't "ad hoc"; it's the job description.

  **Recommendation:**
  Take the analogy seriously, but recognize that ML offers a way *out* of the philosophical anxiety. The "Rashomon effect" suggests that there may be no single "true" model to find. If multiple stories fit the data equally well, the "truth" of the model might be less important than the robustness of the prediction. Your friend sees a philosophical crisis; you can see an engineering constraint. Both views are correct.

  If you want to read one paper that bridges this gap, look for **"Model Class Reliance"** by Fisher, Rudin, and Dominici (2019), or Leo Breiman's **"Statistical Modeling: The Two Cultures"** (2001). They grapple directly with the fact that different models tell different stories about the same data, acknowledging the philosophical weight without getting bogged down in it.
