answer: |-
  The air in the consultation room smelled of ozone and sterilized linen, a scent Elias had come to associate with waiting. He sat on the edge of the exam table, his legs dangling, watching the wall screen flicker through cascading waterfalls of data. He was here for the Cohort Review. If the algorithm cleared him, he got the synaptic patch. If not, the degradation in his left hand would spread to his spine within the year.

  Dr. Aris stood by the console, her fingers hovering over the haptic interface. She looked tired, the lines around her eyes deepening as she stared at the primary metric.

  "Eighty-four percent," Aris said, her voice tight. "Based on the Phase II trial data. You match the biomarkers exactly, Elias. Same mutation, same progression rate, same age window. You're a lock."

  Elias exhaled, a breath he felt he'd been holding for months. He looked at his left hand. The tremor was barely visible today, hidden by the stillness of hope. "So I get the patch?"

  "Wait," said a voice from the doorway.

  Ms. Vance stepped in. She wore the grey suit of the Oversight Committee, carrying a tablet that glowed with a softer, colder light than the wall screen. She didn't look at Elias; she looked at Aris.

  "Phase II is too narrow," Vance said. She walked to the console and tapped a command. The waterfall on the wall shifted. The green cascades turned amber. The number dropped. Forty-two percent.

  Elias felt the floor tilt. "What did you do?"

  "Correcting the sample size," Vance said, finally meeting his eyes. Her expression was sympathetic but firm, the look of someone explaining why a flight was cancelled due to wind shear. "Dr. Aris is grouping you with twelve other people. Twelve. That's not a population, Elias. That's an anecdote. When we widen the scope to include everyone with your general diagnosis over the last five years, the success rate stabilizes around forty percent."

  "Stabilizes?" Aris snapped. "It dilutes. You're mixing apples and orbitals. Those other patients didn't have the specific genetic marker. They didn't have the early intervention Elias did. Putting him in that group ignores the specific causality we identified."

  "And ignores the variance," Vance countered. "If we approve based on the narrow group, and the success rate turns out to be an outlier, we waste resources on patients who won't benefit. We have fifty patches. We need to maximize lives saved across the board, not gamble on a specific subset that might be statistical noise."

  Elias looked between them. He was the same man he had been five minutes ago. His hand trembled, exactly as it had before. His blood was the same chemistry. But somehow, depending on who was speaking, he was either a candidate with a high probability of survival or a risk with a coin-flip chance.

  "It's not about gambling," Aris said, turning back to the console. She input a string of codes. The number climbed back up. Seventy-nine percent. "It's about precision. Elias isn't 'general diagnosis.' He is *this* specific configuration. If we treat him as generic, we are deliberately ignoring data we know is relevant. That's malpractice."

  "It's integrity," Vance said. She didn't touch the console. She didn't have to. Her authority was embedded in the protocol. "You can't carve out a universe for every patient. Where do you stop? Do we make a group of one? Then the probability is either zero or one hundred, and it's useless for decision making. We need a class large enough to have predictive power."

  "So I'm not a person to you," Elias said. His voice sounded thin in the sterile room. "I'm a denominator."

  "You're a patient," Vance said. "And I am responsible for ensuring the program doesn't collapse because we overpromised on small samples. If I approve you based on Dr. Aris's grouping, and you fail, I have to answer for why I ignored the broader trend. If I deny you based on the broader trend, and you succeed... well, statistics are about aggregates. I can live with that error rate. Can you live with a program shutdown?"

  Aris slammed her hand on the console. "He's sitting right there. He's not an aggregate. Look at his scan. Look at the neural density. It matches the survivors in Phase II perfectly. The failures in the broader group failed because they lacked this density. By including them, you're punishing Elias for having better biology."

  "I'm protecting the validity of the prediction," Vance said. "Your group is cherry-picked. It's optimized for success. Mine is honest about the uncertainty."

  "Yours is honest about the uncertainty of the past," Aris shot back. "It assumes the future will look like the average of everything that came before. But medicine moves forward. We learned *why* those others failed. We can't unlearn that. To treat Elias as if we don't know about the genetic marker is to pretend we're stupid."

  "To treat him as if the marker guarantees success is to pretend we're gods," Vance said.

  The number on the screen hovered between forty-two and seventy-nine. It wasn't fluctuating randomly; it was waiting for a command. A toggle. A selection of which truth to enforce.

  Elias looked at his hand again. The tremor was worse now, a rhythmic shaking that matched the pounding in his chest. He tried to imagine himself as Aris saw him: a unique key fitting a specific lock, a precise alignment of biology and technology. He felt solid there. Real.

  Then he tried to imagine himself as Vance saw him: a point on a scatter plot, one dot among thousands, subject to the gravity of the mean. He felt diffuse there, spread out across the data set, partially alive and partially dead in proportion to the aggregate.

  "Is there a rule?" Elias asked. "For which group I belong to?"

  Both of them paused.

  "The protocol says 'most relevant comparable population'," Aris said.

  "And 'statistically significant sample size'," Vance added.

  "They contradict," Elias said.

  "They balance," Vance corrected.

  "They cancel out," Aris muttered.

  She looked at Elias, and for the first time, he saw fear in her eyes. Not fear of the disease, but fear of the abstraction. She knew the math was right, but she also knew the math was a map, and he was the territory. The map was tearing itself in half.

  Vance sighed, softening her posture. "Elias, if we use the narrow class, and you are one of the failures, we won't know until it's too late. The sample is too small to warn us. If we use the broad class, we might deny you a treatment that would work. It's a trade-off between precision and confidence."

  "I don't want a trade-off," Elias said. "I want to know if I'll wake up next year."

  "We can't tell you that," Vance said gently. "We can only tell you who you resemble."

  "But I don't resemble them," Elias said, gesturing to the screen, to the invisible thousands in Vance's broad group. "I resemble *me*."

  "And who else is you?" Aris asked quietly. "That's the question. Are you the twelve people with your基因 profile? Or are you the ten thousand people with your condition?"

  Elias stood up. The room swam slightly. He realized that the answer wasn't in the room. It wasn't in his blood or his scan. It was in the decision of how to look at him. He was a chameleon made of flesh, taking on the color of the graph he was plotted on.

  "What happens now?" he asked.

  "Now," Vance said, looking at her tablet, "the Committee reviews the classification criteria. We have to decide if the genetic marker supersedes the historical mortality rate."

  "And until then?"

  "Until then," Aris said, her hand resting on the console near the toggle switch, "the probability remains indeterminate."

  Elias looked at the screen. The number was gone. In its place was a blinking cursor, waiting for an input that defined reality. He realized then that he wouldn't be leaving the room with a yes or a no. He would be leaving with a definition. Either he was a member of the Lucky Twelve, or he was a citizen of the Average Thousand. He would be the same man walking out the door, but the odds of his existence continuing would depend entirely on which crowd he was told he belonged to.

  "Let me know," Elias said.

  He walked to the door. Behind him, he heard the soft click of a keyboard, then another. They were arguing again, not about him, but about the box he fit into. He opened the door and stepped into the hallway. The light there was fluorescent and uniform, casting no shadows, revealing nothing. He looked at his hand. It was still shaking. He couldn't tell if it was the disease, or the uncertainty of knowing which version of himself was about to be born.
