          *   *Analysis:* This is the core Hacking thesis. It's strong on the *sociological* mechanism. Weakness: Implies the *instances* are generated, not just the *count*.
      *   **Move (2) Devesh:** Looping can coexist with biology. Hacking's case (MPD/DID) was specific (therapist-patient). ADHD has high heritability.
