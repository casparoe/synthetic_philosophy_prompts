      *   *Nuance:* Make sure to distinguish between the *trait* (attention regulation) and the *disorder* (ADHD). Hacking is about the *disorder* as a social/biological hybrid.
      *   *BMI Nuance:* Actually, knowing your BMI *can* change behavior (dieting). So it *is* slightly interactive. Mara's point is about the *degree* and the *narrative integration*. I need to be careful not to dismiss Devesh's analogy too easily, but show why Mara's distinction holds more water in Hacking's specific sense.

