answer: |-
  **Setting:** *A study that exists outside of time, lined with books that are both bound and unbound. IMMANUEL KANT sits in a high-backed chair, his wig perfectly powdered. Opposite him sits THE INTERLOCUTOR, a contemporary philosopher with a notebook open, though she writes nothing.*

  **Kant:** You wish to discuss the beasts. It is a topic that often provokes more sentiment than reason. My position, as you know, is frequently caricatured. I do not say one may torment a dog. I say one must not. But I insist upon the *ground* of that prohibition. If you strike your horse because it is old, you do not wrong the horse. You wrong the humanity in your own person. You dull the shared feeling of suffering that nature has planted in you to assist your duties toward *men*.

  **Interlocutor:** I know the passage from the *Lectures on Ethics* and the *Doctrine of Virtue*. The duty is indirect. It is owed to yourself, as a moral agent, to keep your sympathies sharp. But Herr Professor, this always struck me as a fragile bridge. If the horse's pain is not the reason for the prohibition, but merely the occasion for it, then the pain itself carries no normative weight. It is merely a tool for your moral calibration.

  **Kant:** Precisely. Pain is a sensation, not a moral claim. A moral claim requires a claimant who can recognize the law. Only a rational being can represent to himself what is universally valid. Only such a being is an *end in itself*. Animals are not self-legislating. They are driven by inclination. They are things, relative to the moral law. To treat a thing as a person is to confuse the categories of understanding.

  **Interlocutor:** But let us look at the legislator. You argue that rational nature exists as an end in itself. But where does this rational nature reside? Does it float in the ether? No. It resides in an embodied organism. When I legislate for myself, when I adopt a maxim, I am not legislating for a disembodied mind. I am legislating for *Immanuel*, a man who gets hungry, who feels pain, who has a natural good.

  **Kant:** You speak of the empirical self. Yes, we are animals. But morality does not arise from our animality. It arises from our freedom *from* the determination of nature. When you act morally, you act *against* inclination, if necessary. That is the sublimity of duty.

  **Interlocutor:** I am not saying morality arises from inclination. I am asking about the *object* of our valuing. When you value your own rational agency, what are you valuing it *for*? You value it because it allows you to set ends, to solve problems, to navigate your existence. But the existence you are navigating is an animal existence. You have a "good of your own"—things that go well for you and things that go poorly, independent of whether you choose them. Pain is bad for you, even if you don't choose it.

  **Kant:** Pain is disagreeable. But "bad" in the moral sense implies a violation of a law. Animals have no concept of a law. Therefore, nothing can be "bad" for them in the sense that matters for morality. They have a master, nature, who dictates their ends. We have no duty to the master.

  **Interlocutor:** Here is the friction. You argue that we must treat humanity as an end. But if I value my capacity to set ends, I must value the conditions that make end-setting possible. My animality is a condition of my humanity. If I say, "It matters that *I* have a good," I am acknowledging that *having a good* is the prerequisite for *caring about anything at all*.
  If I deny that the animal's good matters, I am undercutting the very foundation of my own. I am saying, "My pain matters because it is mine, but the horse's pain does not matter because it is his," despite the fact that the *structure* of the suffering is identical.

  **Kant:** You conflate the *subject* of sensation with the *subject* of morality. That your pain matters to you is a fact of nature. That it *ought* to matter to me is a fact of reason. Why ought it to matter? Because you are a rational being who can consent to my actions. You can say "No." The horse cannot say "No" in the moral sense; it can only flee or bite. It cannot enter into a community of law.
  If you grant the animal direct moral standing, you make it a co-legislator. Can the dog vote on the categorical imperative? Can the cow be held responsible for eating the grain?

  **Interlocutor:** We do not need them to be legislators to be *constituents* of the moral law. Consider the argument from consistency. You say rational nature is the source of all value. Nothing has value unless a rational being confers it. Correct?

  **Kant:** Correct. Value is not a property of things like weight or color. It is a status conferred by the will.

  **Interlocutor:** Then when I confer value upon my own rational nature, I must do so for a reason. I cannot value it arbitrarily. I value it because it is the faculty that allows me to pursue my good, to resist destruction, to flourish. But my rational nature is inextricably bound to my animal nature. I cannot value the pilot and discard the ship. If I say, "Rational nature is valuable because it protects and pursues a good," then I am admitting that *the good itself* is the source of the claim.
  If the horse has a good—a life that can go better or worse for it—and I have a good, and the only difference is that I can reflect on mine while he simply lives it... why does the reflection grant me the right to destroy his good for my trivial ends?

  **Kant:** Because reflection changes the *kind* of existence. An animal lives *in* time, determined by the chain of cause and effect. A rational being stands *outside* the chain, if only momentarily, to judge it. This capacity for autonomy is the only thing with *dignity*. Everything else has a *price*.
  You ask why reflection grants the right. It does not grant a right to destroy. It grants a right to *use*, provided we do not violate our duties to ourselves. But you ask why the cutoff is there. It is there because without it, morality collapses into mere empathy. If mere sensation grants standing, then a lobster and a child differ only in degree. But they differ in kind. The child is a potential member of the Kingdom of Ends. The lobster is not.

  **Interlocutor:** But this "Kingdom of Ends" risks becoming a closed shop, Herr Professor. A guild that protects its own privileges. You say animals are "things." But they are not things like stones. A stone has no good. A stone does not care if it is kicked. A dog *cares*.
  If I am a rational agent, I must conceive of myself as an agent *in a world*. If I treat the beings in that world who *care* as if they were beings who *do not care*, am I not acting on a false maxim? Am I not denying the truth of their existence?
  You argue that cruelty coarsens us. I argue that cruelty is a *contradiction*. It is a contradiction to value your own animality as the vessel of your reason, while treating other animalities as mere vessels for your use.

  **Kant:** You press on the word "contradiction." In logic, a contradiction is $A$ and not-$A$. Where is the contradiction in eating meat? Where is the contradiction in using an ox to plow?
  The ox does not conceive of itself as an end. It does not demand respect. Respect is a tribute we pay to the law. To pay respect to a being that cannot comprehend the law is to engage in a category error. It is like apologizing to a chair you bumped into. You may say "pardon" to cultivate humility, but the chair has not been wronged.

  **Interlocutor:** The chair has no *telos*. The ox does. And I do.
  Let me press you on the source of the value. You say rational nature is the only thing with unconditional value. But why? Is it not because rational nature is the only thing capable of recognizing value?
  If I am the only thing that can recognize value, then I am the sole source of normativity. But if I am the sole source, I must ask: What am I recognizing when I recognize my own value? I recognize that I am a being who needs things, who suffers deprivation, who strives.
  If I say, "My striving matters because I am rational," I ignore that my striving is animal. If I say, "My striving matters because it is *mine*," then I am privileging my own perspective without justification.
  Korsgaard argues that if I value my humanity, I must value the humanity in others. But I argue further: If I value my *animal* nature as the necessary substrate of my humanity, I must value the *animal* nature in others. To deny it is to saw off the branch upon which my rationality sits.

  **Kant:** You saw nothing, because the branch is not the tree.
  Listen closely. You say the animal nature is the substrate. I agree. But morality is not about preserving substrates. It is about the *use* of freedom.
  If I grant the animal direct standing, I bind my freedom to the inclinations of the beast. I cannot kill it to save myself, perhaps? I cannot use it to till the soil that feeds the rational community?
  If the animal is an end in itself, it cannot be used merely as a means. But we *must* use them. We are embodied. We eat.
  Therefore, they cannot be ends in themselves. They are resources provided by nature. Our duty is to use them without *wanton* cruelty, not because they have rights, but because wanton cruelty suggests a disposition that might later turn toward men. The focus remains, inescapably, on the moral agent.

  **Interlocutor:** But why must "end in itself" mean "cannot be used"? We use each other. I use the baker to get bread. The distinction is not *use*, it is *consent* and *respect for the good*.
  I can respect the horse's good while riding it. I feed it, I rest it, I do not whip it unnecessarily. I treat its good as a constraint on my action.
  You say this is only to protect my sympathy. I say this is to protect the *truth*.
  If I acknowledge that I have a good, and that my good imposes claims on you, I must acknowledge that your good imposes claims on me. If the horse has a good, and that good is the same *kind* of fact as my animal good, then consistency demands I treat that good as a constraint.
  You stop at the threshold of rationality. I stop at the threshold of *sentience*—the having of a good.
  You ask me: Why should the having of a good matter?
  I ask you: Why should the capacity to *think* about the good be the only thing that matters? Is reason a light that illuminates value, or is it a spotlight that creates it?

  **Kant:** It is the light that creates it. Without the light, there is only darkness. There is no "good" in the universe until a rational will posits it. The dog's pain is a fact of nature, like a storm. It is not an *evil* until a rational being judges it so.
  You wish to make the pain itself normative. But pain is heteronomous. It is something that happens *to* you. Morality is something you *do*.
  If you ground morality in the passive reception of sensation (pain/pleasure), you ground it in heteronomy. You make us slaves to nature.
  I ground it in autonomy. And yes, that excludes the beasts. It is a high price, but it is the only way to save freedom.

  **Interlocutor:** But in saving freedom, you have sacrificed solidarity. You have created a moral universe where the only thing that matters is the capacity to step back from nature. But we are never fully stepped back. We are always partly in the storm.
  When I feel the horse's fear, I am not just observing a fact. I am recognizing a claim.
  You say the claim exists only because I project it. I say the claim exists because the horse is a *center of experience* fighting for its existence, just as I am.
  My rationality allows me to *hear* the claim. His sentience *makes* the claim.
  If you insist that only the hearer matters, and not the speaker, you are not defending autonomy. You are defending a tyranny of the articulate over the inarticulate.

  **Kant:** And if you insist that the mere cry of pain binds the will, you reduce the moral law to a calculation of sensations. You lose the *ought*. You lose the dignity that separates us from the herd.
  We agree on the action: Do not whip the horse.
  We disagree on the reason.
  For you, the horse is a subject of a life, and that life is sacred.
  For me, the horse is a mirror for the human soul, and that soul is sacred.
  You fear this makes the animal expendable. I fear your view makes the human merely another animal, distinguished only by a louder cry.

  **Interlocutor:** And I fear your view makes the human a god who owes nothing to the earth that birthed him.
  We stand at the precipice. You cannot grant them standing without blurring the line of autonomy. I cannot accept the line without betraying the embodiment that makes autonomy possible.

  **Kant:** Then let us leave the precipice. The duty remains. Do not be cruel. Whether you do it for the horse's sake, or for humanity's sake... the horse suffers less either way.

  **Interlocutor:** But the *truth* of the matter matters, Professor. If I do it for the horse's sake, I acknowledge a community of beings. If I do it for humanity's sake, I acknowledge only a monarchy of reason.
  The horse does not care about our metaphysics. But we must care about ours. For it dictates whether we live in a world of subjects, or a world of subjects and shadows.

  **Kant:** Then we shall not agree. For I maintain that without the light of reason, all is shadow. And you maintain that the shadows themselves cast a claim.

  **Interlocutor:** Precisely. And until we resolve whether value is *made* or *found*, the dialogue must rest here.

  **Kant:** *Nods slowly.* Then let it rest. But remember: Act so that you treat humanity, whether in your own person or in the person of any other, always at the same time as an end, never merely as a means. The rest... is anthropology.

  **Interlocutor:** And I say: Act so that you treat every living being that has a good of its own as a constraint upon your will. The rest... is tyranny.

  *They sit in silence, the gap between them unbridged, the book on the table remaining closed.*
