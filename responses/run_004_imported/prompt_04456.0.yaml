          *   Introduce "Homeostatic Property Clusters" (HPC) as a modern philosophical middle ground (Richards, Boyd).
      *   **Conclusion:** Summarize. Darwin wasn't contradictory; he was a process thinker in a typological world. The "arbitrariness" is about boundaries, not the reality of the clusters.

  7.  **Refine the Tone:**
