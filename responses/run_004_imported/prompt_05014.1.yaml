prompt: |-
  okay so I'm elbows deep in a novel where my four leads each get one or two core virtues -- one's brave, one's brutally honest, etc -- that are supposed to hold steady no matter what the plot throws at them. My housemate (a psych postdoc, mildly insufferable about it) informed me that this is exactly the assumption situationism blew up decades ago, and that Doris and Harman didn't even agree on how bad the damage was. I already know the Milgram/Stanford Prison greatest hits so you can skip those -- what I actually want is the more precise version: what's the real difference between Doris's position and Harman's, and did anyone ever mount a comeback for virtue ethics thats better than just insisting characters can be consistent by fiat? Trying to figure out if what I'm doing on the page is psychologically naive or just fine actually.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is writing a novel with four leads, each assigned 1-2 core virtues (e.g., brave, brutally honest) that remain steady regardless of plot pressure.
      *   **Conflict:** Their housemate (a psych postdoc) told them this approach is psychologically naive, citing "situationism" (Doris and Harman) which challenges the existence of robust character traits.
      *   **Knowledge Level:** The user knows the basics (Milgram, Stanford Prison Experiment) and wants to skip those. They want the *nuanced* philosophical/psychological distinction between Doris and Harman.
      *   **Core Question:** What's the real difference between Doris's and Harman's positions? Is there a viable comeback for virtue ethics (beyond "because I say so")? Is their writing approach naive or acceptable?
      *   **Tone:** Intellectual, slightly witty (acknowledging the "insufferable" housemate), practical for a writer.

  2.  **Deconstruct the Philosophical/Psychological Debate (Situationism vs. Virtue Ethics):**
      *   *Situationism:* The empirical claim that human behavior is driven more by situational factors than stable character traits.
      *   *Gilbert Harman:* The harder skeptic. He argues that *global character traits* (like "honesty" or "courage" as cross-situational dispositions) basically *do not exist*. He thinks folk psychology is wrong.
      *   *John Doris:* The softer skeptic. He argues that global traits are rare and fragile. He doesn't say they *never* exist, but that they aren't robust enough to support traditional Aristotelian virtue ethics. He focuses on "local" traits (e.g., "honest-in-exam-settings" rather than just "honest").
      *   *The Difference:* Harman = Traits are a myth. Doris = Traits are fragmented and situational (local vs. global).

  3.  **Identify the "Comeback" (Virtue Ethics Defense):**
      *   *The "Fragmentation" Defense:* Accept Doris's local traits. Characters can be "brave-in-war" but "cowardly-in-love." This adds depth.
      *   *The "Effort/Struggle" Defense:* Virtue isn't automatic; it's a struggle against situation. A character *trying* to be honest when the situation pressures them to lie is more interesting than one who is effortlessly honest.
      *   *The "Narrative Identity" Defense:* (McAdams et al.) Traits aren't just behavioral predictors; they are internalized life stories. Characters construct identity through narrative.
      *   *The "Normative vs. Descriptive" Defense:* Virtue ethics is about how we *ought* to be, not necessarily how we *are* on average. Fiction often deals with the ideal or the exceptional.
      *   *Snow's Nancy Snow:* Argues for "modest" virtue ethics that incorporates situationist insights.

  4.  **Evaluate the Writer's Dilemma (Naive vs. Fine):**
      *   *Naive:* If the characters never struggle, never fail, and the virtue is a magic shield against context.
      *   *Fine:* If the virtue is a *commitment* or a *struggle*, or if the story explores the *cost* of that consistency.
      *   *Literary Precedent:* Many great characters are defined by a "tragic flaw" or a "steadfast virtue" (e.g., Atticus Finch, Captain Ahab, Les Misérables' Valjean). Fiction isn't a psych study; it's a meaning-making machine.

  5.  **Drafting the Response (Iterative Process):**

      *   *Intro:* Acknowledge the housemate's point (they aren't wrong, but they aren't the whole story). Validate the user's concern.
      *   *Section 1: Doris vs. Harman (The Nuance).*
          *   Harman: Eliminator. Traits don't exist. Behavior is situational.
          *   Doris: Fragmenter. Global traits don't exist, *local* traits do. (Honest-at-work vs. Honest-at-home).
          *   Key distinction: Existence vs. Robustness.
      *   *Section 2: The Comeback (Defending Virtue).*
          *   Don't just say "fiction is different." Use philosophical counter-arguments.
          *   *Argument A: Local Traits.* Use Doris against the housemate. Make the virtues specific.
          *   *Argument B: Effortful Virtue.* Virtue isn't a reflex; it's a resistance. (The "despite" factor).
          *   *Argument C: Narrative Identity.* Dan McAdams. We make ourselves consistent through story.
      *   *Section 3: Application to the Novel.*
          *   Is it naive? Only if it's frictionless.
          *   Advice: Show the cost. Show the situational pressure. Show the *failure* points.
          *   Example: A "brave" character who is brave physically but cowardly emotionally.
      *   *Conclusion:* Reassure the user. Fiction requires coherence that real life often lacks.

  6.  **Refining the Tone:**
      *   Keep it sharp. The user used phrases like "elbows deep" and "greatest hits." Match that energy.
      *   Avoid overly dense jargon without explanation.
      *   Make sure the distinction between Harman and Doris is crystal clear, as that was a specific request.

  7.  **Self-Correction/Check during drafting:**
      *   *Did I skip Milgram?* Yes.
      *   *Did I explain Doris vs. Harman?* Yes, need to ensure the "local traits" distinction is highlighted for Doris.
      *   *Did I offer a comeback?* Yes, Narrative Identity and Effortful Virtue are strong points.
      *   *Is the advice practical?* Need to make sure I tell them *how* to write it, not just theory.

  8.  **Final Polish:** Check for clarity and flow. (The resulting output matches the detailed response provided previously.)
answer: |-
  Your housemate is technically right, but they're also being a bit of a reductionist about it (as psych postdocs tend to be). The situationist critique is a serious blow to *Aristotelian* virtue ethics, but it doesn't necessarily kill character-driven fiction. In fact, understanding the nuance between Doris and Harman might actually make your novel better.

  Here is the precise breakdown of the philosophical dispute, the viable comebacks, and how to apply this to your manuscript without throwing it in the bin.

  ### 1. The Difference: Harman vs. Doris
  While both are situationists who argue that global character traits (like "Honesty" or "Courage" as cross-situational constants) are empirically unsupported, their conclusions differ in severity and prescription.

  **Gilbert Harman (The Eliminator)**
  *   **The Claim:** Global character traits **do not exist**.
  *   **The Argument:** Harman argues that our attribution of character is a fundamental error in folk psychology (the Fundamental Attribution Error). When we see someone act kindly, we label them "kind." When they fail to act kindly later, we make excuses for the situation. Harman says the excuses are the truth; the label is the illusion.
  *   **The Verdict:** He is an eliminativist. He believes we should stop talking about character traits entirely and focus exclusively on situational management. For a writer, a Harmanian world is one where your characters are leaves in the wind, with no internal rudder.

  **John Doris (The Fragmenter)**
  *   **The Claim:** Global character traits are **rare and fragile**, but *local* traits exist.
  *   **The Argument:** Doris doesn't say traits are impossible; he says they aren't *robust*. You might not have a trait of "Honesty," but you might have a trait of "Honesty-When-With-Friends-And-No-Money-Is-Involved." He calls these **local traits**.
  *   **The Verdict:** He is a revisionist. He argues for a "fragmented" self. Behavior is consistent only within narrow situational parameters.
  *   **The Distinction:** Harman says the engine doesn't exist. Doris says the engine exists but only runs on specific fuel in specific weather.

  ### 2. The Comeback: Defending Virtue (Without Fiat)
  You asked if there is a comeback better than "insisting characters can be consistent by fiat." Yes. Philosophers and psychologists have mounted three specific defenses that are useful for fiction.

  **A. The "Narrative Identity" Defense (Dan McAdams)**
  Situationism relies on behavioral prediction (will they return the wallet?). But human psychology isn't just behavioral; it's narrative. Dan McAdams argues that while *traits* might be fragmented, **identity** is integrative.
  *   **The Theory:** People construct a life story to make sense of their fragmented actions. We *become* consistent by telling ourselves a story about who we are.
  *   **For Your Novel:** Your characters don't need to be psychologically robotic. They need to be *narratively* committed. A character can be terrified (situation) but act bravely because their internal story is "I am the person who stands fast." The virtue isn't a reflex; it's a plot they are forcing onto reality.

  **B. The "Effortful Virtue" Defense (Nancy Snow / Julia Annas)**
  Situationism assumes virtue is a state of being (you *are* brave). The comeback is that virtue is a state of **striving**.
  *   **The Theory:** Nancy Snow argues for a "modest virtue ethics" that incorporates situationism. She suggests virtues are **dynamic skills**. A virtuous person isn't someone who never feels fear; it's someone who has developed the skill of managing fear across varying situations.
  *   **For Your Novel:** If your "brave" character never feels fear, your housemate is right: that's naive. If your "brave" character feels terror (situational pressure) but utilizes a learned skill to act anyway, that is psychologically robust. The virtue is in the *resistance*, not the absence of conflict.

  **C. The "Selection" Defense**
  Situationism focuses on how situations affect people. It ignores how people **select** situations.
  *   **The Theory:** People with specific dispositions actively choose environments that reinforce those dispositions. An "honest" person avoids jobs that require lying.
  *   **For Your Novel:** Show your characters curating their world to protect their virtue. If your "brutally honest" lead keeps getting fired, they aren't virtuous, they're stupid. If they find a niche where honesty is currency (or they force that niche into existence), that demonstrates agency.

  ### 3. Is Your Approach Naive?
  It depends entirely on **friction**.

  **It is psychologically naive if:**
  *   The virtue is a magic shield. (e.g., The "Honest" character is never tempted to lie, or lies never have consequences for them.)
  *   The virtue is global without cost. (e.g., The "Brave" character is brave in a fistfight, brave in a breakup, and brave in a tax audit, with no internal variance.)
  *   The situation never penetrates the psyche. (e.g., The Stanford Prison Experiment showed guards becoming cruel. If your "Kind" character is put in a power structure and remains effortlessly kind without struggling, you are writing fantasy, not psychology.)

  **It is "Fine Actually" if:**
  *   **You treat virtues as local (Doris-style).** Maybe your "Brave" character is physically courageous but emotionally cowardly. This isn't a bug; it's depth.
  *   **You show the tax.** Consistency is exhausting. Show the fatigue of maintaining a virtue in a hostile situation.
  *   **You treat virtues as commitments, not reflexes.** As per the Narrative Identity defense, let the character *choose* the virtue repeatedly, even when the situation screams otherwise.

  ### The Verdict for the Page
  Don't let the postdoc talk you out of character. Fiction is not a behavioral study; it is a simulation of **meaning**. Real humans are inconsistent, but readers need coherence to generate empathy.

  However, to inoculate yourself against the "naive" critique:
  1.  **Specify the Domain:** Don't write "He was brave." Write "He was brave when it came to physical danger, but a coward when it came to confrontation with his mother." (This validates Doris).
  2.  **Show the Situation Winning Sometimes:** Let the virtue crack. A virtue that never fails is a superpower, not a trait. If your "Honest" character lies to save a life, that is more interesting than if they tell the truth and get someone killed.
  3.  **Focus on the Recovery:** Situationism says we are pushed around by context. Virtue ethics says we can pull ourselves back. The most compelling moment isn't when the character is virtuous effortlessly; it's when the situation breaks them, and they *re-commit* to the virtue.

  **Summary:** Your housemate is describing *descriptive* psychology (how people are). You are writing *normative* fiction (how people strive to be). As long as you acknowledge the struggle between the two, your novel is on solid ground.
