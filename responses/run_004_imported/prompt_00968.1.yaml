  4.  **Identify the Key Logical Fallacy:**
      *   Priya is committing a "Perfect Solution Fallacy" (or Nirvana Fallacy). She's arguing that because algorithms can't be *perfectly* fair (by conflicting definitions), they are worse than the status quo (humans), which is implicitly assumed to be *more* fair or at least exempt from the math.
