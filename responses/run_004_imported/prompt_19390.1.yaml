      *   *Drafting (4):* Diego is right. Approval has strategy. The Gibbard-Satterthwaite theorem supports his claim about ranked systems.
      *   *Drafting the "Universality" section:* Explain G-S theorem. Acknowledge that while cardinal systems (Score) exist, they still have strategy (min-maxing). So, no system eliminates strategy completely while remaining fair and deterministic. Diego is theoretically sound.

  8.  **Determining the Verdict:**
      *   Maya relies on idealistic claims (RCV solves it, Approval is strategy-free) that are theoretically flawed.
