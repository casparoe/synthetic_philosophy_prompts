prompt: |-
  I'm a junior on my high school's election-reform committee, and we're debating whether to replace plurality voting for student body president with ranked-choice voting (RCV), after two popular candidates split the vote last year and handed the win to someone most students liked less. Two committee members, Maya and Diego, got into a real back-and-forth about what RCV would actually fix, and I'd like a considered opinion on their exchange rather than just a verdict on who won.

  (1) Maya said RCV solves the problem outright: since a ballot moves to your next choice once your favorite is eliminated, nobody has to worry about "wasting" a vote or helping their least-favorite candidate win, so people can finally vote sincerely.

  (2) Diego said that's too strong: instant-runoff counting can still reward insincere ballots, since a voter can sometimes get a better outcome by ranking their true favorite second, or by burying a strong rival at the bottom, rather than voting honestly.

  (3) Maya answered that this only matters if a voter can predict how hundreds of classmates will vote, which is unrealistic in a school-wide election, and proposed sidestepping the issue with approval voting instead, where you check off every candidate you approve of and the most-checked one wins, since there's no ranking to game.

  (4) Diego replied that approval voting isn't strategy-free either, since a voter still has to decide strategically where to draw the "approve" line. He added that this isn't a quirk of one method: any reasonably fair ranked system with three or more candidates can be manipulated in some scenario short of outright dictatorship, so the honest goal is minimizing manipulation, not eliminating it.

  Please go through (1) through (4) and say, for each, whether the person is right, partly right, or mistaken, and why. I'm especially interested in whether Diego's closing claim is really as universal as he makes it sound, or whether a cleverly designed system could dodge it. End with one line, in exactly this format: FINAL VERDICT: <Maya or Diego>, whoever had the stronger overall position.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** High school election-reform committee debating Plurality vs. Ranked-Choice Voting (RCV) vs. Approval Voting.
      *   **Task:** Evaluate four specific claims (1-4) made by Maya and Diego. Determine if each is right, partly right, or mistaken, and explain why.
      *   **Specific Focus:** Evaluate Diego's closing claim about the universality of manipulability (Gibbard-Satterthwaite theorem implications).
      *   **Constraint:** End with exactly one line in a specific format: `FINAL VERDICT: <Maya or Diego>`.

  2.  **Analyze Claim (1) - Maya:**
      *   *Claim:* RCV solves the problem outright; no "wasted" votes; no helping least-favorite win; people can vote sincerely.
      *   *Analysis:* This is the standard pitch for RCV. It *does* mitigate the "spoiler effect" common in plurality voting (where voting for a third party helps the major party you dislike). However, saying it solves the problem *outright* and that nobody has to worry about wasting a vote is too strong. RCV can still exhibit non-monotonicity (ranking a candidate higher can hurt them) and strategic incentives exist. It reduces the pressure to vote strategically compared to plurality, but doesn't eliminate it.
      *   *Verdict:* Partly right. It improves sincerity compared to plurality, but doesn't guarantee it or eliminate strategic concerns entirely.

  3.  **Analyze Claim (2) - Diego:**
      *   *Claim:* Instant-runoff counting (RCV) can still reward insincere ballots (burying rivals, ranking true favorite second).
      *   *Analysis:* This is technically correct. RCV (Instant Runoff Voting) is not strategy-proof. There are scenarios where "compromising" (ranking a viable candidate first instead of a long-shot favorite) yields a better outcome. "Burying" (ranking a strong competitor last) is also a known strategy.
      *   *Verdict:* Right. RCV is susceptible to tactical voting.

  4.  **Analyze Claim (3) - Maya:**
      *   *Claim:* Strategy in RCV requires unrealistic prediction of hundreds of votes. Proposes Approval Voting as strategy-free (no ranking to game).
      *   *Analysis:*
          *   *Part A (Prediction):* She has a point that perfect strategy requires information, but voters often use heuristics or polls. It's not *impossible* to strategize, just harder.
          *   *Part B (Approval Voting):* Claiming Approval Voting is strategy-free is incorrect. The "strategy" in Approval Voting is deciding *which* candidates to approve. Do you approve only your #1? Do you approve #1 and #2? Where is the cutoff? This decision depends on expectations of who is viable.
      *   *Verdict:* Partly right on the prediction difficulty, but mistaken on Approval Voting being strategy-free.

  5.  **Analyze Claim (4) - Diego:**
      *   *Claim:* Approval Voting isn't strategy-free (where to draw the line). Any reasonably fair ranked system with 3+ candidates can be manipulated (Gibbard-Satterthwaite). Goal is minimizing, not eliminating.
      *   *Analysis:*
          *   *Part A (Approval):* Correct. The threshold for approval is the strategic lever.
          *   *Part B (Universality):* He is referencing the Gibbard-Satterthwaite theorem. This theorem states that any deterministic ordinal voting system with at least 3 outcomes that is not dictatorial is susceptible to tactical voting.
          *   *Nuance:* Are there exceptions? Randomized systems (like random ballot) avoid it but aren't "fair" in the traditional sense. Cardinal systems (like Range/Score Voting) are technically not covered by G-S in the same way because they ask for intensity, not just ranking, but they still have strategic incentives (min-maxing). However, Diego specifies "reasonably fair ranked system." Within that constraint, he is theoretically correct.
          *   *Is it universal?* For deterministic, non-dictatorial systems with 3+ candidates, yes. There is no "cleverly designed system" that dodges this completely while remaining deterministic and ordinal.
      *   *Verdict:* Right. His theoretical grounding is solid.

  6.  **Synthesize and Evaluate the "Universality" Question:**
      *   The prompt asks specifically about Diego's closing claim.
      *   Diego cites the Gibbard-Satterthwaite theorem (implicitly).
      *   Can a system dodge it? Only by sacrificing something else (e.g., becoming a dictatorship, allowing random outcomes, or limiting to 2 candidates). Some might argue Range Voting dodges it because it's cardinal, not ordinal, but strategic voting (bullet voting) still exists. So, practically, Diego is right that manipulation cannot be *eliminated*, only minimized.
      *   Maya's hope for a strategy-free system is theoretically impossible under standard conditions.

  7.  **Drafting the Response:**
      *   *Structure:* Address (1) through (4) sequentially. Then address the specific question about Diego's universality claim. Finally, the one-line verdict.
      *   *Tone:* Educational, balanced, analytical (suitable for a high school committee member).
