answer: |-
  You have hit on precisely the nerve that keeps philosophers of information awake at night. Your intuition is spot-on: the invariance theorem is an asymptotic comfort that offers very little protection in the finite regime where actual science happens.

  To answer your question directly: **No, there is no structural theorem that forces two arbitrary universal machines to agree on the ordering of finite strings.** You are not missing a piece of math; you are identifying the "Reference Machine Problem," which is the elephant in the room for Algorithmic Information Theory (AIT).

  Since you come from a physics background, let's lean into your gauge analogy, because it's apt but requires a slight tweak to fit the information-theoretic landscape.

  ### 1. The Gauge Analogy and the "Entry Fee"
  In physics, gauge invariance tells us that physical observables must be independent of our coordinate choices. If a quantity depends on the gauge, it's not an observable.

  In Solomonoff Induction, the "observable" is the prediction of the next bit (or the ranking of hypotheses). For finite strings, this *does* depend on the "gauge" (the choice of Universal Turing Machine, or UTM). The invariance theorem ($|K_U(x) - K_V(x)| \leq c_{UV}$) is essentially saying: "The gauges are equivalent, but you have to pay an entry fee $c_{UV}$ to switch between them."

  In the limit of infinite data, that entry fee is amortized to zero. The cumulative prediction error of Solomonoff induction is bounded by $K(\mu) \ln 2$ (where $\mu$ is the true distribution). The constant $c$ gets swallowed by the infinite stream of data. But as you noted, science is not done in the limit. We are often in the regime where the "entry fee" is larger than the complexity difference between the hypotheses we are testing.

  If you choose a "perverse" UTM—one that has a hard-coded bias for strings that look like Maxwell's equations over strings that look like Newton's—you can indeed make the "wrong" hypothesis appear simpler for any realistic dataset size.

  ### 2. The "Naturalness" Defense
  So, why do proponents (like your postdoc) treat it as a gold standard? The defense usually rests on two pillars, neither of which is mathematically airtight but both of which are pragmatically necessary.

  **A. The Class of "Natural" UTMs**
  The invariance theorem holds for *any* two UTMs. However, proponents argue we should restrict our attention to "natural" UTMs. These are machines that don't have specific scientific theories hard-coded into their transition tables. Think of them as standard programming languages (Python, C, Turing Machine standard encodings).

  The argument is that the constant $c_{UV}$ between any two *natural* machines is small. It corresponds roughly to the length of a compiler or interpreter between them. If you are comparing General Relativity ($H_{GR}$) vs. Newtonian Gravity ($H_{Newt}$), the difference in their Kolmogorov complexities is likely substantial (hundreds or thousands of bits of code to simulate the respective physics). The "compiler constant" between a Python-based UTM and a C-based UTM is negligible in comparison.

  The worry only becomes critical when comparing hypotheses that are *already* extremely close in complexity. But one could argue that if two hypotheses are that close in algorithmic description length, they are empirically indistinguishable anyway, or the distinction is semantic rather than physical.

  **B. The "Simplest UTM" Argument**
  Some, like Jürgen Schmidhuber, have argued that there might be a "simplest" UTM (one with the shortest description length itself). If we anchor our complexity measure to the simplest possible UTM, we remove the gauge freedom. The problem, of course, is that defining "simplest" requires a meta-UTM, leading to an infinite regress. It doesn't solve the problem; it just pushes it up one level.

  ### 3. Subjectivity Shifted, Not Eliminated
  Here is the philosophical pivot that often gets glossed over in the hype. Solomonoff Induction does not eliminate the subjectivity of the prior; it **localizes** it.

  In standard Bayesian inference, you are asked to justify a prior probability distribution $P(H)$. This is notoriously difficult (the "Problem of Priors").
  In Solomonoff Induction, you are asked to justify a Universal Turing Machine $U$.

  Is choosing a UTM easier than choosing a prior? Arguably, yes. It is easier to agree on what constitutes a "simple" computational process (e.g., local interactions, low-degree polynomials) than to agree on abstract probability assignments over hypothesis spaces. The UTM encodes your inductive bias about *how the world computes*, rather than *what the world is*.

  So, the machine dependence isn't a bug; it's a feature. It makes explicit the inductive bias that was always hidden in standard Bayesianism. Two scientists with different UTMs effectively have different "priors over computation." If their UTMs differ significantly, they will disagree on finite data. The math doesn't adjudicate this; only more data (eventually) will.

  ### 4. The Computability Reality Check
  As an experimentalist, you might also appreciate the practical constraint: **Kolmogorov complexity is uncomputable.**

  Your postdoc is likely working with approximations (Minimum Description Length, L1/L2 regularization, etc.). In those practical ML contexts, the "UTM" is effectively the model class (e.g., neural network architecture). The "constant" becomes the penalty term hyperparameter.
  In practice, ML researchers *do* face your exact worry: changing the architecture or regularization strength can flip the model selection. They resolve it not via the invariance theorem, but via cross-validation (empirical performance).

  This suggests that for finite science, **predictive success trumps descriptive simplicity.** Solomonoff induction claims that simplicity *leads* to predictive success. But for finite $N$, the "constant" can break that link.

  ### 5. Verdict: A Known Soft Spot
  To answer your specific question: **Is this a known soft spot people live with?**
  Yes. It is widely acknowledged in the foundations of AIT.

  *   **Li & Vitányi** discuss it (mostly in the context of the "Invariance Theorem" limitations).
  *   **Hutter** (in *Universal Artificial Intelligence*) acknowledges that for finite time horizons, the choice of UTM matters, but argues that any UTM is "Pareto optimal" in some sense (no other UTM is better on all environments).
  *   **Critics** (like philosophers of science) often use this to argue that Solomonoff Induction is not a normative theory of rationality, but rather a formalization of a specific *kind* of rationality (one that assumes the universe is computable and favors short programs).

  **The Physics Analogy Refined:**
  Think of the UTM choice less like a gauge choice in electromagnetism (where observables *must* be invariant) and more like a **renormalization scheme** in QFT.
  Physical predictions should be scheme-independent, but at any finite order of perturbation theory, they depend on the scheme. You only recover scheme independence as you include all orders (the infinite limit). In the finite regime, you choose the scheme that makes the convergence fastest or the physics most transparent.

  Similarly, in Solomonoff Induction, the "truth" is only UTM-independent in the limit. In the finite regime, you choose the UTM that best reflects the computational symmetries of the physical universe you inhabit (e.g., a UTM that favors local, causal laws).

  ### Summary
  You aren't missing a theorem. The invariance theorem provides asymptotic convergence, not finite-sample objectivity. For the "short-ish, finite hypotheses" of real science, the additive constant *can* dominate, and different UTMs *can* rank hypotheses differently.

  The field "lives with it" by arguing that:
  1.  Between *reasonable* UTMs, the constant is small.
  2.  Between *reasonable* hypotheses, the complexity gap is large.
  3.  The subjectivity of the UTM is preferable to the subjectivity of an arbitrary Bayesian prior.

  It is a rigorous framework for Occam's Razor, but only if you accept that "simplicity" is relative to a computational reference frame. If your former postdoc is selling it as an absolute, machine-independent logic of discovery, they are overselling the product. It's a powerful normative ideal, not a practical algorithm for Tuesday morning data analysis.
