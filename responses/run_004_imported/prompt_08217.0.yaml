  I guess my actual question is: assuming I've got the setup right, is there an actual decision-theoretic reason not to act on this, or does taking UDT/TDT-style reasoning seriously basically commit you to taking the threat seriously too? And if there's a real hole in the argument, why did it take the community so long to just say that plainly instead of treating the whole topic as unspeakable for years?
