answer: |-
  **Setting:** *A quiet corner of a coffee shop near the hospital where both speakers work. **Julian** is a data analyst who volunteers with an EA group. **Elena** is a senior social worker. They are discussing a mutual friend, Priya, a young accountant.*

  **Julian:** So, did Priya decide on the budget?

  **Elena:** She's stuck. She's committing to ten percent of her gross income to GiveWell charities. She thinks that's her moral ceiling. She wants to know if she's permitted to stop there, or if she's required to push to thirty, forty, maybe more.

  **Julian:** And you told her ten percent is fine.

  **Elena:** I told her ten percent is extraordinary. Most people give zero. If she does ten percent consistently for forty years, she'll save lives. That's a moral victory, not a deficit.

  **Julian:** It's a start. But is it *enough*? That's the question. If Priya accepts Singer's premise—that distance doesn't matter and death is worse than a luxury—then ten percent is just where she feels comfortable, not where the logic stops. If she can save a life by giving forty percent, and she keeps that money for a mortgage on a larger house, she's choosing the house over the life.

  **Elena:** That's the Kagan line, isn't it? *The Limits of Morality.* That there's no principled place to stop short of the point where giving more causes as much harm as it prevents.

  **Julian:** Exactly. Kagan's point is that "ordinary morality" is a mess of intuitions. We say, "It's good to give," but "You're not bad if you don't." But if the outcome is a dead child versus a nicer house, the intuition that "you're not bad" collapses. Priya needs to know if she's actually *obligated* to maximize.

  **Elena:** But Julian, look at Priya. She's twenty-six. If she gives forty percent, she's not just skipping the nicer house. She's delaying independence. She's increasing her stress. She's potentially burning out her capacity to care at all. You're treating her like a utility pump. If you squeeze too hard, the pump breaks.

  **Julian:** That's a practical concern, not a moral one. If burning out means she earns less later, then yes, she should moderate giving to maximize lifetime earnings. But if she can sustain forty percent without collapsing, but chooses not to because she wants to travel or save for early retirement, that's not "burnout." That's preference. And why should her preference for travel outweigh a stranger's preference for living?

  **Elena:** Because she's *her*. This is where Scheffler comes in. The Agent-Centered Prerogative. Morality can't just be about the impersonal good. It has to acknowledge that Priya has a personal point of view. She is permitted to give her own projects *extra weight*, simply because they are hers.

  **Julian:** I've read Scheffler. And here's my problem: It feels like he's just relocating the arbitrariness. Kagan argues that ordinary morality draws a line at "ruined shoes" versus "drowning child" with no justification. Scheffler says, "Okay, let's draw a line at 'reasonable balance between personal projects and impartial good.'" But *where* is that line? Why is ten percent okay, but not eleven? Why is a vacation worth a life? Scheffler gives her a prerogative to weight her interests, but he doesn't give a formula for *how much* weight. Isn't that just codifying selfishness?

  **Elena:** It's not codifying selfishness; it's codifying agency. If morality demands that Priya treat her own life as no more valuable than anyone else's, it asks her to abandon the very perspective from which she acts. She isn't a vessel for the good. She's a person. If the moral theory requires her to cease being a person in the full sense—to have no independent projects, no personal relationships that aren't justified by their utility—then the theory is asking for too much.

  **Julian:** But "too much" according to what standard? If the standard is "what feels comfortable for Priya," then morality is just etiquette. If the standard is "preventing suffering," then her discomfort is irrelevant compared to death. You say she's a person. The child in the malaria zone is also a person. Why does Priya's personhood grant her a right to resources that the child's personhood does not?

  **Elena:** Because Priya is the one who has to *live* the morality. You're assuming the impartial point of view is the only rational one. Scheffler argues it's rational for Priya to care more about her own life. It's not just a feeling; it's structural. If I tell Priya she must sacrifice her career ambitions to send more money, I'm asking her to alienate herself from her own future.

  **Julian:** Alienation is a cost. I grant that. But let's press the limit. Suppose Priya gives ten percent. That's $8,000 a year. That buys roughly three bed nets per second, or saves a life every few years. If she bumps to thirty percent, she saves three times as many. She delays buying a condo by five years. Is the "alienation" of waiting five years to buy a condo really equivalent to three times the body count? Scheffler's prerogative allows her to weigh her interests disproportionately, sure. But is it rational to weigh a condo *that* heavily? Where is the principle that says "Condo = 3 Lives"?

  **Elena:** You're asking for a conversion rate that doesn't exist. That's the utilitarian trap. You think everything must be commensurable on a single scale. Scheffler is saying there are two scales: the impartial good, and the personal good. The prerogative allows the agent to favor the personal good up to a point.

  **Julian:** But *what point*? That's the Kagan objection! If you can't define the limit, the limit is arbitrary. If Priya says, "I value my vacation at ten lives," and you say, "Okay, that's within your prerogative," you haven't solved the demandingness problem. You've just said, "Morality is demanding, but you're allowed to ignore it whenever your personal projects feel heavy enough." That leaves us right back where ordinary morality started: doing what we can live with.

  **Elena:** No, because it's not "whenever it feels heavy." It's grounded in the necessity of having a life. If Priya gives until she has nothing left for herself, she becomes a martyr. And while martyrs are admirable, we can't require martyrdom as a baseline duty. If morality requires martyrdom, morality is self-defeating because no one will follow it.

  **Julian:** That's an empirical claim. Maybe people *would* follow it if the culture shifted. But more importantly, "self-defeating" isn't "false." If the truth is that we ought to give until it hurts, then the fact that people won't do it doesn't make it false. It makes people unwilling. Kagan's whole point is that we shouldn't let the difficulty of the truth dictate the truth itself. You're arguing for a morality that fits human psychology. I'm arguing for a morality that fits the reality of suffering.

  **Elena:** But morality *is* a human practice, Julian. It's not physics. It governs relationships between agents. If you strip away the agent's right to their own life, you aren't creating a moral system; you're creating a consumption algorithm. Priya isn't just a resource allocator. She's a friend, a daughter, a professional. If she gives 50%, she can't participate in those roles fully. She can't take colleagues to lunch, she can't visit her aging parents as often because she's working overtime to replace the income. Those relationships have value too.

  **Julian:** They have value *to her*. Do they have value to the dying child?

  **Elena:** They have value to the *world*. A world where everyone is a burnt-out saint is not a better world. It's a grim one. Scheffler's prerogative protects the integrity of the moral community. It acknowledges that we are separate persons. You keep talking about "the good" as if it's a cloud floating above us that we all feed. But the good is instantiated *in* lives. Priya's life is one of those instances. To drain it completely to feed others is to destroy one instance of the good to create others. Why is that a net win?

  **Julian:** Because one life of moderate comfort versus three lives of existence. That's the math. You keep saying "integrity" and "separate persons." But the separation of persons is exactly why the child dies. The child is separate from Priya. If Priya says, "That's *my* money," she's using the separation of persons as a shield. Kagan says that shield is illegitimate when the cost is life. Scheffler says the shield is necessary for agency. I think Scheffler is just giving a fancy name to "I want to keep my stuff."

  **Elena:** And I think Kagan is confusing "rational" with "impartial." It is rational for Priya to care more about her own life. If she didn't, she'd be pathological. If you demand she be impartial, you're demanding she be pathological. Is morality supposed to make us pathological?

  **Julian:** Morality is supposed to stop preventable death. If being "pathological" by your standards means saving ten children instead of one, maybe we need a new definition of pathology. But let's get back to the limit. You say Priya can stop at ten percent because she needs a life. Okay. Suppose she wins the lottery. Does her prerogative expand? Can she keep 90% then?

  **Elena:** Probably. Her projects might cost more.

  **Julian:** See? That's the arbitrariness. If the prerogative is based on "having a life," why does having a life cost more when you're rich? If the moral claim of the starving child is constant, why does Priya's permission to ignore it fluctuate with her income? It looks like the prerogative is just a way to preserve the status quo of wealth distribution while feeling philosophically clean.

  **Elena:** It's not about wealth distribution; it's about the cost to the agent. Sacrificing 50% of a low income is a different qualitative burden than 50% of a high income. But look, Julian, you're pressing me for a formula. "Give X% until Y condition." Scheffler doesn't offer a formula. He offers a *structure*. He says the agent is permitted to maximize the good *unless* doing so requires sacrificing a personal project of sufficient weight.

  **Julian:** "Sufficient weight." Who weighs it?

  **Elena:** The agent does.

  **Julian:** There it is. So Priya decides. She says, "My vacation weighs more than the malaria clinic." And you say, "That's her prerogative." Kagan would say you've just surrendered. You've handed the keys of morality back to the very intuitions that let the child drown. You've replaced "do what you want" with "do what you want, provided you call it a project."

  **Elena:** I haven't surrendered. I've acknowledged that morality is a negotiation between the demand of the world and the capacity of the self. If you don't build the self into the equation, you don't get a moral theory. You get a demand. And demands without buy-in don't create obligation; they create resentment. If Priya gives 50% and hates every minute of it, she stops giving next year. If she gives 10% and sustains it for forty years, she does more good.

  **Julian:** That's a consequentialist argument for a non-consequentialist limit. You're saying "Give less to give more in the long run."

  **Elena:** I'm saying sustainability is a moral virtue.

  **Julian:** Is it? Or is it just prudence? If I can save a child *now* by burning out *later*, the child is still saved. The burnout is my problem. The death is theirs. You're prioritizing Priya's psychological continuity over the child's physical existence. I understand why Priya wants that. I even sympathize. But I don't see how it's *morally justified* rather than just psychologically necessary. Scheffler tries to bridge that gap, but Kagan is right: the bridge is made of fog. It tells Priya she's allowed to stop, but it can't tell her *why* stopping here is right, only that stopping *somewhere* is necessary for sanity.

  **Elena:** And you can't tell her why going *all the way* is right, only that the math adds up. You're asking her to treat her life as a means to an end. I'm arguing her life *is* the end. Both of us are appealing to a first principle we can't prove. You appeal to the Impartial Good. I appeal to the Integrity of the Agent.

  **Julian:** But the Impartial Good has the dead child on its side. What does Integrity have?

  **Elena:** It has Priya. And if morality eats Priya, who is left to do the good?

  **Julian:** Then we're at the stalemate. You think a morality that consumes the agent is invalid. I think a morality that allows the agent to watch children die to preserve their "integrity" is complicit.

  **Elena:** And Priya is still sitting with her budget spreadsheet, caught between us.

  **Julian:** Then tell her this: If she gives ten percent, she's better than most. If she gives more, she's better than she needs to be. But don't tell her she's *done*.

  **Elena:** And I'll tell her: If she gives ten percent, she's moral. If she gives more, she's a saint. But don't tell her she's *failing* if she stops.

  **Julian:** *(Sips coffee, looks out the window)* The child in the pond doesn't care about our stalemate.

  **Elena:** No. But Priya has to live with herself after she walks away from the pond. And if she can't live with herself, she won't walk past many more ponds.

  **Julian:** Maybe. Or maybe she'll just get used to the water.

  **Elena:** Maybe. But I'd rather she stay dry enough to keep walking.
