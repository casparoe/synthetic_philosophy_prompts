prompt: |-
  My first writing teacher is retiring after forty years running the same fiction workshop, and I have been asked to give the toast at her farewell dinner. She has always judged fiction—student drafts and, later, my own published novels—by Tolstoy's 'infection' test from *What Is Art?*: not craft, only whether a piece carries one sincere, particular feeling that any reader can actually catch. She has never let me forget that, by that standard, my own novels belong with the 'bad art' Tolstoy eventually decided even his own *War and Peace* was. Half the room will be former students who know his opera-rehearsal chapter cold; the other half will be family who have never read a word of it. Write the toast—five minutes, anchored in that rehearsal scene—honest about exactly where her standard leaves my work, yet still unmistakably a gift, not a verdict.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Farewell dinner for a retiring writing teacher (40 years, same fiction workshop).
      *   **Speaker:** A former student, now a published novelist.
      *   **Key Theme:** The teacher judges fiction by Tolstoy's "infection" test from *What Is Art?* (sincere, particular feeling transmitted to the reader).
      *   **Conflict/Tension:** The teacher holds the speaker's published novels to this standard and has told the speaker they fall short (categorized as "bad art" like Tolstoy deemed *War and Peace*).
      *   **Audience:** 50% former students (know the Tolstoy reference/opera rehearsal scene well), 50% family (don't know the theory).
      *   **Tone:** Honest about the judgment (don't hide the "bad art" label), but ultimately a gift/tribute, not a bitter verdict.
      *   **Constraint:** Five minutes (approx. 750-900 words spoken at a moderate pace).
      *   **Anchor:** Must be anchored in Tolstoy's opera-rehearsal scene from *What Is Art?*.

  2.  **Deconstruct the Tolstoy Reference:**
      *   *What Is Art?* (1897) is notoriously severe. Tolstoy argues that true art isn't about beauty or craft, but about "infection"—the ability of the artist to transmit a feeling they have experienced to the audience.
      *   *The Opera Rehearsal Scene:* Tolstoy describes attending a rehearsal of Wagner's *Siegfried*. He details the exhaustion, the artificiality, the sweat, the shouting, the disjointed effort. He feels *nothing* but fatigue and repulsion. He uses this to illustrate "counterfeit art"—laborious, clever, but devoid of sincere infectious feeling.
      *   *Relevance:* The teacher uses this to cut through pretension. It's about the *effect*, not the *effort*.

  3.  **Determine the Emotional Arc:**
      *   **Opening:** Acknowledge the occasion, the teacher's longevity, and the specific lens she uses (Tolstoy).
      *   **Middle (The Anchor):** Describe the opera rehearsal scene. Connect it to the workshop experience (the sweat, the struggle).
      *   **The Turn (The Conflict):** Address the "bad art" label on the speaker's own work. Own it. Don't be defensive.
      *   **Resolution (The Gift):** Reframe the "failure." The value isn't in passing the test, but in having a teacher who cared enough to administer it. The infection *did* happen, just not in the way Tolstoy meant. The teacher infected the students with integrity.
      *   **Closing:** A wish for retirement and a final nod to the theory.

  4.  **Drafting - Section by Section:**

      *   *Introduction:* Start with the number 40. That's a long time. Mention the workshop. Introduce the "Tolstoy Test."
      *   *The Tolstoy Scene:* Need to make it accessible for the family but specific for the students. Describe the exhaustion, the artificiality. "Sweat," "shouting," "no feeling."
      *   *The Workshop Connection:* How did she use this? She didn't care about adjectives; she cared if we felt it.
      *   *The Personal Sting:* I'm a published novelist. She tells me I'm Tolstoy's "bad art." Like *War and Peace*. That's a hard pill to swallow.
      *   *The Reframe:* Why is this a good thing? Because she prioritized truth over praise. She didn't let us get away with counterfeit emotion.
      *   *The Infection:* Wait, if art is infection... didn't she infect *us*? We feel her sincerity. So *she* is the artist. We are the canvas.
      *   *Conclusion:* Raise a glass. To the teacher who made us feel the weight of the words.

  5.  **Refining the Tone:**
      *   *Avoid:* Bitterness, defensiveness, overly academic jargon (for the family's sake), excessive sentimentality.
      *   *Aim:* Wry, respectful, warm, intellectually honest.
      *   *Voice:* A writer speaking—precise, slightly self-deprecating.

  6.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. 40 years is crazy. You all know she loves Tolstoy. Specifically *What Is Art?* There's a part where he goes to an opera rehearsal. It's awful. Everyone is tired. He feels nothing. That's her standard. Does the writing make you feel? If not, it's trash. Even my books. She tells me they are trash. But I'm here to say, that's why I love her. She didn't lie. She taught us to try for the real thing. So, cheers to her.

      *Critique 1:* Too blunt. Needs more poetry. Needs to handle the "bad art" comment more gracefully so it doesn't sound like she was mean, but rigorous. Needs to bridge the gap for the family.

  7.  **Drafting - Iteration 2 (Focusing on the Opera Scene):**
      Let's describe the rehearsal. The tuning, the shouting. Tolstoy sat there feeling bored. She put our drafts on that same operating table. When I published my first book, I thought I passed. She said, "Remember the opera." She said *War and Peace* failed. So my mystery novel definitely failed. But here's the thing. I feel her love in that criticism. That *is* infection.

      *Critique 2:* Better. Now need to polish the prose to make it speech-ready. Ensure the timing is right (5 mins).

  8.  **Final Polish (incorporating into the final output):**
      *   *Word Count Check:* 5 minutes is roughly 750 words.
      *   *Key Phrase:* "Counterfeit art." "Sincere feeling."
      *   *The Twist:* The infection flowed from her to us, not just from us to the reader.

  9.  **Writing the Toast (incorporating the constraints):**
      *   *Opening:* Good evening. Forty years.
      *   *The Theory:* Tolstoy's *What Is Art?* Explain it simply.
      *   *The Scene:* The Wagner rehearsal. The exhaustion.
      *   *The Application:* How she treated our drafts.
      *   *The Personal:* My books. Her verdict.
      *   *The Pivot:* The definition of success.
      *   *The Toast:* To the teacher.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm agreeing that my books are bad, but rather that her *standard* is what matters. The "gift" is the standard itself.

      *(Refining the "Bad Art" line)*: It needs to be funny but true. "If Tolstoy couldn't clear the bar with *War and Peace*, don't expect me to clear it with *The Silent Garden*."

      *(Ending)*: Bring it back to the feeling in the room *tonight*. That is the proof of her art.

  10. **Final Review against constraints:**
      *   5 minutes? Yes.
      *   Anchored in rehearsal scene? Yes.
      *   Honest about the "bad art" label? Yes.
      *   Gift, not verdict? Yes.
      *   Audience balance? Yes (explained the theory clearly).

      *(Proceed to generate output based on this thought process.)*
answer: |-
  Good evening.

  For those of you who don't know me, I'm one of the many writers who passed through [Teacher's Name]'s workshop over the last four decades. I'm also one of the few who ended up publishing novels. And because of that, I have a unique distinction in this room. I am living proof of [Teacher's Name]'s favorite literary theory, and I am also the primary evidence of its severity.

  To understand why we are all here, loving her as much as we do, you have to understand the yardstick she used to measure us. It wasn't plot. It wasn't syntax. It wasn't even "good writing."

  It was Leo Tolstoy. Specifically, Tolstoy's late-career treatise, *What Is Art?*

  For the family members in the room: Tolstoy decided late in life that most art was a lie. He argued that true art isn't about beauty or craft. It is about "infection." The artist must feel a specific, sincere emotion, and through their work, transmit that feeling to the audience, like a virus. If the reader doesn't catch the feeling, it isn't art. It's just noise.

  To illustrate this, Tolstoy describes attending a rehearsal of Wagner's *Siegfried*. He doesn't describe the magic of the music. He describes the sweat. He describes the singers shouting to save their voices, the conductor banging the baton, the workers moving scenery in the dark, the exhaustion, the artificiality. He sits there, cold and bored, feeling nothing but the labor behind the curtain. He calls it "counterfeit art."

  For forty years, [Teacher's Name] ran this workshop like that opera rehearsal. She wasn't interested in the pretty costumes. She wanted to know if we were freezing in the dark, or if we were actually burning up.

  When I brought in my drafts, she didn't talk about adjectives. She asked: "Do you feel this? Or are you just shouting like the Wagner singers?"

  And when I finally published my first novel, I brought it to her, expecting a pardon. I expected her to say, "You've done it. You're an artist."

  Instead, she reminded me that Tolstoy eventually decided even his own *War and Peace* was "bad art" because it lacked religious sincerity. She looked at me, smiled that terrifyingly kind smile, and said, "If Leo couldn't clear the bar with *War and Peace*, don't expect me to clear it for you with this."

  By her standard, I am a manufacturer of counterfeit goods. My novels are the opera rehearsal: laborious, clever, but ultimately failing the infection test.

  For a long time, I thought that was a harsh thing to say to a student. But standing here tonight, looking around this room, I realize I misunderstood the direction of the infection.

  Tolstoy was wrong about one thing. He thought the infection had to flow from the page to the reader. But in this room, for forty years, the infection flowed from the teacher to the students.

  She never let us settle for the easy emotion. She never let us fake a tear. She made us rewrite scenes not until they were grammatically perfect, but until they were honest. She made us feel the weight of the words before we were allowed to ask anyone else to carry them.

  Yes, by her standard, my books might be "bad art." But the integrity I have as a writer? The refusal to lie on the page? The knowledge that craft without feeling is just sweat and shouting? That came from her.

  She held a standard so high that even Tolstoy couldn't reach it, and she demanded we aim for it anyway. That isn't criticism. That is faith.

  So, if art is the transmission of feeling, look around this room. Look at the writers she mentored. Look at the family who supported her. Look at the exhaustion and the joy in her eyes after forty years of reading our drafts.

  Do you feel that? That sincerity? That particular, infectious love for the truth of a story?

  That is her art. Not the books she read, but the writers she made. And by that standard, she is a master.

  To [Teacher's Name]. May your retirement be free of rehearsals, and full of nothing but the real thing.
