      *   *Check:* Is the recommendation actionable? *Yes, move from "project" to "impact criteria."*

  6.  **Final Polish:** (Reviewing against the prompt's constraints)
      *   Short memo? *Keep it under 1-2 pages equivalent.*
      *   Clear recommendation? *Yes, Redesign.*
      *   Fair hearing for opposition? *Yes, dedicated section.*

  7.  **Final Output Generation:** (This matches the provided good response.)
