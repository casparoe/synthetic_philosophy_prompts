prompt: |-
  I'm a senior engineer on my company's Staff Engineer promotion committee, and we're reconsidering our "signature project" requirement: to be promoted, a candidate must lead a highly visible, technically ambitious project on top of their regular workload, usually over several months. Supporters argue it's the only reliable test of true Staff-level ability, since only someone genuinely capable would sustain that kind of costly effort; one committee member likened it to a peacock's tail, arguing that the sheer extravagance is what makes it credible. Critics respond that the requirement mostly rewards whoever has fewer caregiving duties, more job security, and a manager willing to hand them high-visibility work, so it may be measuring access to the signal rather than the underlying skill. We need to decide whether to keep the requirement as is, drop it in favor of manager and peer judgment, or redesign it, and I have to circulate a short recommendation memo before our next meeting. Please draft that memo: give a clear recommendation, and make sure the strongest argument against whichever position you take gets a fair hearing.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Senior Engineer on a Staff Engineer Promotion Committee.
      *   **Task:** Draft a short recommendation memo regarding the "signature project" requirement for promotion.
      *   **Context:** The committee is reconsidering the requirement.
          *   *Supporters:* It's a reliable test of Staff-level ability (costly signal, like a peacock's tail).
          *   *Critics:* It rewards privilege/access (caregiving duties, job security, manager support) rather than skill.
      *   **Options:** Keep as is, drop entirely (favor judgment), or redesign.
      *   **Requirements:** Clear recommendation, fair hearing for the strongest counter-argument, professional tone suitable for a committee.

  2.  **Determine the Recommendation:**
      *   *Option 1: Keep as is.* Risks reinforcing bias and excluding talented engineers with constraints. The "peacock's tail" argument is biologically interesting but culturally problematic in a modern DE&I (Diversity, Equity, and Inclusion) context.
      *   *Option 2: Drop entirely.* Risks lowering the bar or making promotions purely political/subjective based on manager influence. Staff level *does* require demonstrated scope and impact.
      *   *Option 3: Redesign.* This is the balanced engineering approach. It acknowledges the *intent* (proving scope/impact) while mitigating the *unintended consequences* (bias/access).
      *   *Decision:* Recommend **Redesigning** the requirement. This allows the committee to keep the rigor of demonstrated impact without the exclusionary mechanics of the current "signature project" model.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary/Recommendation:** State the bottom line up front. Recommend redesigning the requirement to focus on *outcomes* and *scope* rather than a specific *type* of project.
      *   **Context:** Briefly summarize the debate (Peacock's Tail vs. Access/Privilege).
      *   **Rationale for Redesign (The "Why"):**
          *   Acknowledge the validity of the "costly signal" argument (it does prove stamina and technical depth).
          *   Highlight the systemic risks (bias, unequal access).
          *   Propose the middle ground: Define "Staff-level impact" more broadly.
      *   **Addressing the Counter-Argument (Crucial Step):** The prompt asks for the strongest argument against the position to get a fair hearing.
          *   *My Position:* Redesign.
          *   *Strongest Counter:* If we loosen the specific "signature project" constraint, we risk inflation. Manager/peer judgment alone can be gamed or biased. The "hard" requirement acts as an objective anchor. Without it, promotions become purely political.
          *   *Rebuttal/Mitigation:* We need calibration rubrics, not just a binary checkbox.
      *   **Proposed Framework (The "How"):**
          *   Instead of "One Big Project," allow "Portfolio of Impact."
          *   Focus on *scope* (cross-team), *ambiguity* (defined the problem), and *multiplier effect* (lifting others).
          *   Ensure manager sponsorship is a *support* mechanism, not a gatekeeper.
      *   **Next Steps:** Timeline for drafting new rubrics.

  4.  **Refining the Tone:**
      *   Needs to be professional, objective, and decisive.
      *   Avoid emotional language, but acknowledge the human element (caregiving, etc.).
      *   Use engineering/leadership terminology (signal-to-noise, scope, ambiguity, multiplier effect).

  5.  **Self-Correction/Review during Drafting:**
