answer: |-
  **MEMORANDUM**

  **TO:** Staff Engineer Promotion Committee
  **FROM:** [Your Name], Senior Engineer & Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding "Signature Project" Promotion Requirement

  ### Recommendation
  I recommend we **redesign** the "signature project" requirement rather than keeping it as is or dropping it entirely. Specifically, we should shift from a binary requirement for a single, high-visibility project to a competency-based framework that validates Staff-level scope through a portfolio of impact. This approach preserves the rigor of the current standard while mitigating the systemic biases inherent in measuring access rather than ability.

  ### Context
  The committee is currently divided on the value of the "signature project" mandate.
  *   **Proponents** argue it functions as a "costly signal" (analogous to a peacock's tail): the sheer difficulty of delivering a massive technical initiative on top of BAU (Business As Usual) work is the only reliable proof of Staff-level stamina and technical authority.
  *   **Critics** argue the requirement measures privilege more than skill. It disproportionately favors engineers with fewer caregiving responsibilities, higher job security, and managers who actively broker high-visibility work, thereby excluding equally capable candidates who lack that specific access.

  ### Rationale for Redesign
  The "costly signal" argument holds merit: Staff engineers must demonstrate the ability to navigate ambiguity and deliver complex value. However, relying on a single project type introduces significant noise into our signal.

  1.  **Scope vs. Visibility:** Staff-level work is defined by scope and ambiguity, not necessarily visibility. Critical infrastructure work, deep debugging, or enabling other teams often lacks "flash" but requires genuine Staff-level judgment.
  2.  **The Access Gap:** Requiring a specific *type* of project makes promotion contingent on a manager's ability to allocate work. This conflates the candidate's skill with their manager's influence.
  3.  **Sustainability:** The expectation to sustain "extravagant" effort over months can incentivize burnout. We should be promoting sustainable leadership patterns, not heroic bursts.

  ### The Counter-Argument: The Risk of Subjectivity
  The strongest argument against redesigning (and for keeping the requirement as is) is the risk of **promotion inflation and subjectivity.**

  Committee members favoring the status quo argue that without a concrete, high-bar artifact like a signature project, promotions devolve into popularity contests. A "portfolio of impact" relies heavily on manager narratives and peer testimonials, which are easier to game than a shipped system. They contend that the "signature project" is the only objective anchor we have; removing it hands too much discretion to managers, potentially lowering the bar or introducing new biases based on who writes the best promotion packet rather than who does the best work.

  *Assessment:* This concern is valid. If we broaden the criteria without tightening the rubric, we risk diluting the Staff title. However, objectivity should not come at the cost of equity. We can maintain rigor without mandating a specific project structure.

  ### Proposed Path Forward
  To balance rigor with equity, I propose we replace the "Signature Project" checkbox with three **Staff Impact Pillars**. Candidates must demonstrate evidence across all three, which can be achieved through a signature project, a portfolio of smaller initiatives, or a mix of both:

  1.  **Technical Strategy:** Defining the "what" and "why" for complex systems, not just the "how."
  2.  **Cross-Functional Scope:** Solving problems that span multiple teams or service boundaries.
  3.  **Multiplier Effect:** Elevating the capability of the organization (e.g., mentoring, tooling, process improvement) rather than just individual output.

  **Next Steps:**
  If the committee agrees, I will draft a rubric defining specific evidence types for these pillars by our next meeting. This allows us to test the "signal" of Staff ability without relying on the "peacock's tail" mechanism that inadvertently filters for privilege.

  ### Conclusion
  The goal of the Staff level is to identify engineers who can operate at scale. We can verify this capability without enforcing a single mode of operation that favors the fortunate. By redesigning the requirement to focus on *impact competencies* rather than *project artifacts*, we protect the bar while widening the funnel for top talent.
