      *   *Structure:* Recommendation, Background, Analysis, Counter-Argument, Proposed Path Forward.

  *(Self-Correction Note during final polish)*: Make sure I explicitly mention that dropping it entirely is also risky. The redesign should borrow the *rigor* of the old system without the *specific constraint*.

