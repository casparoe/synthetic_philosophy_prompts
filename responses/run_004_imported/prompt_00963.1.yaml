      *   **The "Two-Way" Prediction:** Illustrate that pure statistical reasoning predicts entropy increase in *both* directions away from the present moment.
      *   **The Need for the Past Hypothesis:** Explain why we need a boundary condition (low entropy past) to break the symmetry. We observe entropy increasing to the future *because* it was lower in the past.
