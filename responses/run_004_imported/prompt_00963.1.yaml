      *   *The Problem (Loschmidt's Objection):* Microscopic laws are time-reversal invariant ($t \to -t$). If a trajectory $\gamma(t)$ leads from low $S$ to high $S$, then the time-reversed trajectory $\gamma(-t)$ leads from high $S$ (technically, a state with reversed momenta) to low $S$.
      *   *The "Gap":* If we only rely on the *current* macrostate and the counting of microstates (typicality), the argument is symmetric in time.
          *   If I see a system in a non-equilibrium state *now*, statistical mechanics predicts that *typical* microstates compatible with this macrostate will evolve toward equilibrium in the *future*.
          *   *However*, because of time symmetry, the same statistical argument implies that typical microstates compatible with the current macrostate must have *come* from equilibrium in the *past*.
      *   *The Consequence:* Without a constraint on the past, the most probable history of a cup of coffee sitting on a table (currently in equilibrium) is that it spontaneously fluctuated into a slightly lower entropy state (hot coffee) a moment ago, rather than being poured there 10 minutes ago. This leads to the "Boltzmann Brain" problem or simply the falsification of our memories and records.

  3.  **Formulate the Response Strategy:**
