      *   *The "Boltzmann Brain" / Fluctuation argument:* If we rely *only* on combinatorics and no past hypothesis, the most likely way to find ourselves in the current macrostate (which has some structure) is as a random fluctuation from equilibrium, not as the result of a long history of structure formation. This is physically absurd and contradicts observation.
