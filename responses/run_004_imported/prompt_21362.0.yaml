      *   **Topic:** Aquinas on tyrannicide.
      *   **Key Sources:** Commentary on the Sentences, *De Regimine Principum* (On Kingship), *Summa Theologiae* IIaIIae, q.42 (Sedition).
      *   **Key Sub-questions:**
          1.  Does he think a private citizen may licitly kill a tyrant?
          2.  Does this depend on the distinction between usurper (tyrant without title) vs. legitimate ruler governing tyrannically (tyrant in exercise)?
          3.  How does *De Regimine Principum* handle this?
