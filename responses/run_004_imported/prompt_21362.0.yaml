      *   *One more check on the Salisbury comparison:* John of Salisbury *Policraticus* VIII.20 explicitly defends tyrannicide by private individuals. Aquinas *De Regimine* I.6 explicitly argues *against* private individuals killing a tyrant who has legitimate title (fear of greater tyranny). So the student's claim that they end up in the "same place" is objectively false in the context of standard medieval pol sci curriculum.

