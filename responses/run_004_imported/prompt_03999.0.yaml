  *(Self-Correction Note during final review)*: I need to make sure I don't just say "Money is different." I need to explain *why* that difference undermines Lewis's inference. Lewis argues: "We accept A (fines), therefore Substitution is possible." I argue: "We accept A because A is not actually Penal Substitution in the relevant sense."

  Let's structure the argument around the distinction between *liabilities* and *personal sufferings*.

  *   *Lewis's view:* Fine = Punishment. Substitution allowed. Therefore Punishment-Substitution is coherent.
  *   *My view:* Fine = Liability with punitive labeling. Substitution allowed because Liabilities are transferable. Prison = Personal Suffering. Substitution rejected. Therefore, *Penal* Substitution (which aligns with Personal Suffering) remains incoherent. The fine case is a false positive.

