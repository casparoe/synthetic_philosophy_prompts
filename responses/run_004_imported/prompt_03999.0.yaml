      *   *Lewis's Rebuttal to "Fees":* He says we attach stigma to fines. They are punitive, not just pricing.
      *   *Lewis's Rebuttal to "Impracticality":* He says we could enforce identity checks more strictly if we wanted to, but we don't because we think it's permissible.
      *   *Counter-Strategy 1: The Nature of the Burden.* Prison is personal/incommunicable. Money is fungible/communicable. The asymmetry doesn't show penal substitution is coherent; it shows money isn't a *penal* burden in the same sense. It's a transfer of resources, not a suffering of the self.
      *   *Counter-Strategy 2: The Victim's Perspective.* In criminal law, the state punishes. In civil torts, compensation is paid by third parties all the time (insurance). Are fines more like torts? If so, Lewis's classification of them as "penal" is the weak link.
      *   *Counter-Strategy 3: The "Two Minds" Fallacy.* Ambivalence isn't evidence of truth; it's evidence of confusion. Just because we are inconsistent doesn't mean the underlying concept is metaphysically possible.
      *   *Counter-Strategy 4: Addressing Lewis's Rebuttals directly.*
          *   *Against "Fee" Rebuttal:* Even if there is stigma, the *mechanism* of payment is fundamentally different from serving time. Stigma attaches to the *conviction*, not the *payment method*.
          *   *Against "Impracticality" Rebuttal:* We don't prevent it because the *harm* of the crime is often economic or social, and the *restoration* is economic. Prison is about incapacitation and retribution on the body. You can't incapacitate a substitute.

  4.  **Developing the Core Argument:**
      *   *Thesis:* The asymmetry Lewis identifies stems not from a hidden coherence in penal substitution, but from a category distinction between *punishments that target the agent's person* versus *liabilities that target the agent's property*.
      *   *Point 1: Fungibility vs. Identity.* Money is fungible; prison time is not. Lewis acknowledges this but thinks the acceptance of fine-substitution overrides it. I need to argue that the acceptance proves fines aren't truly "penal" in the retributive sense required for the Atonement analogy.
      *   *Point 2: Engaging the "Fee" Objection.* Lewis says fines carry stigma. Counter: The stigma attaches to the *judgment*, not the *discharge*. If I pay your fine, I am not taking on your *guilt*, I am taking on your *debt*. The Atonement requires taking on guilt/wrath, not just writing a check.
      *   *Point 3: Engaging the "Impracticality" Objection.* Lewis says we *could* stop it. Counter: We don't stop it because the legal system treats fines as *debts to the state*. Debts are payable by third parties. Prison is not a debt; it's a status.
      *   *Point 4: The Theological Gap.* Even if fine-substitution is coherent, it's the *wrong kind* of substitution for Penal Substitutionary Atonement (PSA). PSA is about wrath, death, and separation. Fine substitution is about liquidity.

