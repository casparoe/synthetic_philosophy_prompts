  *Answer:* *Laws* applies because it's about *why* we alter states. If we alter states to *avoid* the test of character, we fail the civic education. If we alter states to *enhance* productivity, we serve the appetitive city (the "City of Pigs" or the "Fevered City" from *Republic* II), not the Kallipolis.

