prompt: |-
  I'm a few years into a clinical psych PhD, which is sort of relevant here because of the OCD-adjacent angle, but the real question underneath it has me stuck in a different way. My partner has an anxious habit of fixating on unanswerable questions, and for the past week or so its been whether his memories from earlier that day are "real," or whether he can prove he isn't just misremembering everything. Nothing I say satisfies him - whatever I answer, he just asks how I know THAT's true too, and we end up circling for an hour. I've tried reasoning it through with him (memory generally coheres with other evidence, other people confirm things, etc) and he'll agree each step sounds fine but still lands on "ok but you still havent PROVEN it." A friend told me this is just reassurance-seeking and I shouldn't engage, which is probably right practically, but separate from the clinical side, it's genuinely bugging me: is there a good answer to what he's asking, or is he demanding something that can't be given no matter what - and if it's the second one, what does that even mean?
