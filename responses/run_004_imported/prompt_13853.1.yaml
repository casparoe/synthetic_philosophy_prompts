          *   **Goal:** Understanding communication vs. Aligning goals.
          *   **Resolution:** Quine accepts naturalized epistemology (we just pick a manual that works). IRL researchers try to find *additional* data sources (structure, side information, neuroscience) to break the tie.

  5.  **Evaluate the User's Hypothesis ("Is it Quine applied to desires?"):**
      *   *Yes, structurally.* It's a strong analogy. Both argue that behavior $\nrightarrow$ unique internal state.
      *   *Yes, philosophically.* It challenges the realist view of preferences (that preferences exist independently of our models of rationality).
      *   *Nuance:* Quine was more radical (elimativist about meaning). IRL researchers usually want to *save* the concept of preferences by adding constraints (e.g., cognitive biases, neural data).

