      *   *The Theorem:* Given a policy $\pi$, there are infinitely many decompositions into a reward function $R$ and a planner $p$ such that $p(R) = \pi$.
      *   *The "No Free Lunch" aspect:* Even imposing a simplicity prior (Kolmogorov complexity) on the pair $(R, p)$ doesn't help. You can construct a "degenerate" pair that is just as simple as the "intuitive" pair.
      *   *Example:* A rational agent maximizing $R$ looks identical to an irrational agent (e.g., always does the opposite of what's optimal) minimizing $-R$.
