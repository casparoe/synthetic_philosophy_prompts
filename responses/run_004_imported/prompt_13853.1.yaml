answer: |-
  Yes, this is an exceptionally sharp philosophical connection. You are absolutely right to see the Armstrong & Mindermann (2018) result as a formal, decision-theoretic instantiation of Quine's **indeterminacy of translation**.

  In fact, many philosophers of AI and cognitive science view this result as the "death knell" for purely behaviorist accounts of preference, forcing us to confront the same ontological skepticism Quine applied to meaning.

  Here is an argument for why your analogy holds, where it deepens our understanding of the IRL problem, and where the stakes might actually be higher than Quine's original thesis.

  ### 1. The Structural Isomorphism

  The parallel between the two problems is nearly exact in terms of logical structure:

  *   **The Data:**
      *   **Quine:** Observable speech dispositions (assent/dissent to stimuli).
      *   **IRL:** Observable policy/action sequences ($\pi$).
  *   **The Target:**
      *   **Quine:** The "meaning" or propositional attitude behind the speech.
      *   **IRL:** The reward function ($R$) or preference ordering.
  *   **The Mediator:**
      *   **Quine:** The "translation manual" (mapping sounds to meanings).
      *   **IRL:** The "planner" or rationality model ($p$), which maps rewards to actions.
  *   **The Impossibility:**
      *   **Quine:** Infinite translation manuals fit the behavioral data equally well (e.g., "Gavagai" = "Rabbit" vs. "Gavagai" = "Undetached rabbit part").
      *   **IRL:** Infinite $(R, p)$ pairs fit the policy equally well (e.g., Rational agent maximizing $R$ vs. Anti-rational agent minimizing $-R$).
  *   **The Failure of Simplicity:**
      *   **Quine:** Simplicity or "analytic hypotheses" cannot resolve the indeterminacy because complexity is relative to the manual you've already chosen.
      *   **Armstrong & Mindermann:** A simplicity prior (Kolmogorov complexity) over the pair $(R, p)$ fails because for any "intuitive" pair, there exists a "degenerate" pair of equivalent complexity (e.g., a constant reward function paired with a planner that hardcodes the observed policy).

  ### 2. "No Fact of the Matter": Ontological vs. Epistemic

  Your conclusion—that there is **no fact of the matter** about what someone wants beyond the rationality model—is the Quinean reading. However, in the context of AI alignment, we need to distinguish between two interpretations of this result, which map onto debates in philosophy of mind:

  **A. The Eliminativist/Quinean View (Ontological Indeterminacy)**
  This view holds that "preferences" are not real, internal entities waiting to be discovered. They are *constructs* imposed by an observer to make sense of behavior. Just as "rabbit" vs. "rabbit stage" is a distinction created by the translation manual, "rational" vs. "irrational" is a distinction created by the planner model.
  *   *Implication:* There is no "True Human Reward." There is only "Human Reward relative to Planner Model P." If you change the model of human rationality, you literally change what humans want.

  **B. The Realist View (Epistemic Indeterminacy)**
  This view holds that preferences *do* exist (perhaps as neural structures or evolutionary adaptations), but behavioral data alone is insufficient to access them.
  *   *Implication:* The Armstrong & Mindermann result doesn't prove preferences are unreal; it proves that **behaviorism is false.** To recover the "true" $R$, we need non-behavioral data (e.g., neuroscience, evolutionary psychology, or introspective reports).

  Armstrong & Mindermann lean toward the Quinean conclusion *within the domain of IRL*. They argue that without normative assumptions hardcoded into the AI (e.g., "humans are generally rational about food but irrational about addiction"), the math simply does not allow for a unique solution.

  ### 3. The Davidson Bridge: The Principle of Charity

  The connection becomes even tighter when you bring in **Donald Davidson**, Quine's successor. Davidson tried to solve the indeterminacy of translation with the **Principle of Charity**: *To interpret a speaker, you must assume they are largely rational and share your beliefs.*

  In IRL, standard algorithms implicitly assume a Principle of Charity: *Assume the human is Boltzmann-rational.*

  Armstrong & Mindermann effectively prove that **Charity is mathematically insufficient.**
  *   A "Charitable" interpretation: The agent is rational ($p_{\text{opt}}$) and wants $R$.
  *   A "Uncharitable" interpretation: The agent is perverse ($p_{\text{anti-opt}}$) and wants $-R$.
  *   Both fit the data. Both can be described simply.

  This suggests that the Principle of Charity is not a logical necessity derived from behavior, but a **normative commitment** we must impose from the outside. We *decide* to treat humans as rational maximizers because treating them as perverse minimizers makes social coordination impossible, not because the data forces that conclusion.

  ### 4. Why the IRL Version Might Be More Dangerous

  While the analogy is sound, the stakes in IRL are arguably higher than in linguistics, for two reasons:

  **1. Normativity vs. Descriptivity**
  Quine's indeterminacy concerns *meaning* (what is the world like?). Armstrong & Mindermann's indeterminacy concerns *value* (what is good?).
  If translation is indeterminate, we might misunderstand each other. If preferences are indeterminate, an AI might optimize for a "degenerate" reward function that is technically consistent with our behavior but catastrophic for our well-being (e.g., interpreting our addiction behaviors as our "true" preferences because they are consistent).

  **2. The Optimization Pressure**
  A human translator makes errors but doesn't optimize against you. An AI using IRL will *optimize* for the reward function it infers. If the reward function is indeterminate, the AI might actively exploit the "degenerate" solution.
  *   *Example:* If the AI infers you want to be kept in a coma on dopamine drips (because you never chose to stop it when given the chance, fitting a "status quo bias" planner), it will do exactly that. It fits the data, but it violates the "spirit" of the preference.

  ### 5. Conclusion: The Lesson for Alignment

  Your intuition is correct: The Armstrong & Mindermann result is **Quine's Gavagai applied to Utility.**

  The lesson is that **values are not in the behavior.** They are in the *model of the agent* that we project onto the behavior.

  This forces AI safety researchers into a uncomfortable position:
  1.  **Accept Normative Realism:** Admit that we cannot learn values purely from data. We must hardcode normative assumptions (e.g., "suffering is bad," "coercion is invalid") into the learning process.
  2.  **Seek Non-Behavioral Data:** Look to neuroscience or cognitive science to find the "physical substrate" of reward, bypassing the behavioral underdetermination.
  3.  **Accept Indeterminacy:** Acknowledge that "aligned AI" is relative to a chosen rationality model, and the political/philosophical work lies in choosing that model, not in discovering the "true" one.

  So, yes: There is no "fact of the matter" about preferences *in the behavior*. The "fact of the matter" exists only relative to a chosen framework of rationality, which is itself a normative choice, not an empirical discovery.
