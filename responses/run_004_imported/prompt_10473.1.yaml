      *   *Why it has teeth:* It's not just "I deny your premise." It's "Your premise relies on a semantic picture that generates paradoxes (Accidental Intrinsics), whereas my picture solves them, and your intuition is compatible with my picture once you understand the semantics of 'could have'."

