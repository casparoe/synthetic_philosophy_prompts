answer: |-
  This is a classic moment in the metaphysics of modality. You fumbled because the Humphrey objection is rhetorically devastating but metaphysically shallow. It relies on a pre-theoretic intuition that Kripke treats as a datum, whereas Lewis treats it as a theoretical claim that needs justification.

  To defend Lewis against sharp second-years, you cannot simply say, "Lewis denies transworld identity, so Kripke is wrong." That *is* trivial question-begging. To make the "question-begging" charge stick, you have to show that Kripke's objection relies on a semantic assumption (that *de re* modality requires strict identity) which Lewis has independent reasons to reject, and that Kripke offers no argument for that assumption other than the intuition itself.

  Here is a rigorous breakdown of the argument, structured so you can adapt it for office hours or a seminar board.

  ---

  ### The Core Argument: Semantics vs. Metaphysics

  The Humphrey objection fails because it conflates the **truth-conditions** of a modal sentence with the **metaphysical machinery** used to analyze it.

  **1. The Objection Restated**
  Kripke's claim is essentially:
  1.  The sentence "Humphrey could have won" is about *Humphrey*.
  2.  Counterpart Theory (CT) analyzes this as "A counterpart of Humphrey won."
  3.  A counterpart is not Humphrey (strict identity fails).
  4.  Therefore, CT changes the subject; it makes the sentence about someone else.
  5.  Therefore, CT is false (or at least, fails to capture the meaning).

  **2. The Lewisian Rejoinder (The "Question-Begging" Charge)**
  Lewis's response is that premise (1) is ambiguous.
  *   **Reading A (The Kripkean Reading):** "About Humphrey" means the proposition contains Humphrey himself as a constituent, and the property of winning is instantiated by *that very individual* in another world.
  *   **Reading B (The Lewisian Reading):** "About Humphrey" means the proposition is anchored to Humphrey in the actual world, and its truth depends on the existence of individuals in other worlds who stand in the counterpart relation to him.

  Kripke's objection assumes Reading A is the *only* coherent way to make sense of "aboutness." But Reading A presupposes **Transworld Identity (TWI)**. Since CT is explicitly designed to replace TWI, Kripke is assuming the falsity of CT in order to prove the falsity of CT.

  **3. Why This Isn't Trivial Question-Begging**
  This is the part your students will press. Why isn't this just *any* theorist dismissing *any* counterexample by saying "You're using the wrong semantics"? (e.g., A Presentist telling an Eternalist, "Your tense logic presupposes existence at non-present times, which I deny.")

  The difference lies in **independent theoretical motivation**. Lewis does not adopt CT merely to be contrarian; he adopts it because TWI generates the **Problem of Accidental Intrinsics**.

  *   **The Problem:** If Humphrey exists in $W_1$ (actual) and $W_2$ (possible), and is 6ft in $W_1$ but 5ft in $W_2$, and Humphrey-$W_1$ is identical to Humphrey-$W_2$, then Humphrey is both 6ft and 5ft. This is a contradiction of intrinsic properties.
  *   **Kripke's Solution:** Index properties to worlds (Humphrey is 6ft-at-$W_1$, 5ft-at-$W_2$). Lewis argues this turns intrinsic properties into disguised relations, which is metaphysically costly and counterintuitive.
  *   **Lewis's Solution:** Deny the identity. Humphrey-$W_1$ and Humphrey-$W_2$ are distinct individuals. No contradiction.

  **The Teeth of the Argument:**
  When you tell the student, "Kripke is begging the question," you mean: *Kripke is treating TWI as a pre-theoretic intuition, but TWI is actually a metaphysical posit that requires significant semantic patching (property indexing) to avoid contradiction.*

  CT offers a semantics that preserves the truth of "Humphrey could have won" without the metaphysical cost of TWI. Kripke's objection amounts to: "Your semantics doesn't match my metaphysical commitment to TWI." Lewis replies: "Your metaphysical commitment to TWI is the very thing causing the paradoxes I'm trying to solve."

  Therefore, the objection doesn't show CT is *wrong*; it shows CT is *different*. To prove CT is wrong, Kripke would need to show that the counterpart relation cannot ground *de re* reference. He doesn't do that; he just asserts that only identity can.

  ---

  ### Addressing the "Humphrey Doesn't Care" Point

  Kripke adds a rhetorical flourish: *"Humphrey could not care less whether someone else, though similar to him, would have been victorious in another possible world."*

  This is the emotional hook for the students. You need to dismantle it using **Sortal-Relativity**.

  **1. Counterparts are not just "Lookalikes"**
  Students often think CT means "Humphrey cares about his twin." That's false. The counterpart relation is not merely overall similarity; it is weighted by context and sortals.
  *   When we say "Humphrey could have won," we are invoking the counterpart relation relative to the sortal **Person/Politician**.
  *   Lewis allows that an object can have different counterparts under different descriptions (similar to the Statue/Lump distinction).
  *   Under the sortal "Biological Organism," Humphrey's counterpart might be someone who died young. Under "Politician," the counterpart is the election winner.

  **2. Why Humphrey Should Care**
  If the counterpart relation is the modal analogue of identity, then what happens to the counterpart *is* what happens to Humphrey, modally speaking.
  *   **Analogy:** Why do you care about your future self? Strict identity over time is philosophically dubious (Parfit, etc.). If you lose all your memories and change all your cells, are you identical? Maybe not. But you care about that future person because of the **psychological continuity relation**.
  *   **Lewis's Point:** The counterpart relation is the modal version of psychological continuity. It is the relation that *makes* modal claims about Humphrey true. To say "Humphrey doesn't care" is to insist that only Magic Transworld Identity matters. But since Magic Transworld Identity is incoherent (see Accidental Intrinsics), the counterpart relation is the *only* thing Humphrey *could* care about regarding modal facts.

  ---

  ### Office Hours Script / Talking Points

  Here is how you can put this to the student without getting bogged down in jargon.

  **1. Validate the Intuition**
  "Kripke's objection is powerful because it matches our pre-theoretic language. When we say 'I could have been a doctor,' it feels like *I* am the one in that world. Lewis admits this feels right. But philosophy often requires us to distinguish between how we *speak* and what makes our speech *true*."

  **2. Hit the Accidental Intrinsics**
  "Here is why Lewis thinks Kripke is begging the question. If you insist that *you* are literally in that other world, you run into the Problem of Accidental Intrinsics. If you are 6ft here and 5ft there, and you are strictly identical across worlds, you have contradictory properties. Kripke solves this by making height a relation to a world. Lewis thinks that's a bad analysis of intrinsic properties. CT solves it by saying the 5ft guy is a distinct individual. So, when Kripke says 'CT changes the subject,' Lewis says 'No, CT is the only way to keep intrinsic properties intrinsic.'"

  **3. The "Changing the Subject" Rebuttal**
  "Does CT change the subject? Only if you define 'subject' as 'transworld identical entity.' But Lewis argues we have no grip on what 'transworld identical entity' means other than 'thing that is a counterpart.' If the counterpart relation does all the logical work—preserving truth values, validating S5, handling reference—then positing a further 'glue' of identity is metaphysical excess. Kripke assumes the glue is necessary; Lewis argues the glue is unintelligible."

  **4. The "Caring" Objection**
  "Regarding Humphrey not caring: Imagine you say, 'I could have been taller.' On Lewis's view, this is true because there is a counterpart of you who is taller. Why should you care? For the same reason you care about your future self. It's not because of magical identity; it's because that person stands in the right relation to you to make your modal claims true. If you reject that relation, you don't just reject Lewis; you lose the ability to make sense of modal claims without contradiction."

  ### Summary for the TA

  The Humphrey objection is not a *reductio* of Counterpart Theory; it is a **clash of semantic frameworks**.
  *   **Kripke:** Modal discourse presupposes Transworld Identity.
  *   **Lewis:** Transworld Identity is incoherent (Accidental Intrinsics); Modal discourse is best analyzed via Counterpart Relations.

  To say CT fails because it denies TWI is to assume TWI is the correct analysis of modality. Since Lewis provides independent arguments (Accidental Intrinsics) that TWI is *incorrect*, Kripke's objection assumes the conclusion of the debate. It has teeth because it points out that Kripke offers no argument for TWI other than the linguistic intuition that Lewis is explicitly revising for theoretical gain.

  If the student presses: "But it just *feels* like I'm talking about me!"
  Your reply: "It feels like the sun moves around the earth, too. The job of metaphysics is to tell us what structure the world must have for our talk to be true, not just to codify our initial impressions."
