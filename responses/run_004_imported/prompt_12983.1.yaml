              *   Descartes *does* describe bodily pain as a mechanical disturbance, but usually links the *feeling* of pain to the mind-body union.
              *   *Verdict:* Sasha wins on the physiology/mechanism point (Descartes definitely thinks bodies react without minds). Colin wins on the semantic/phenomenological point (Descartes usually equates *sentiment* with conscious awareness). This is a draw/stalemate on this specific exchange, but Sasha is more accurate about the *system*.

      *   **Move 3: Colin's Closer (Definition of *Cogitatio*).**
