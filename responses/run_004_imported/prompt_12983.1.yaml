      *   *Scholarly Consensus:* Most scholars (Cottingham, etc.) side with Colin on the *consciousness* issue. Descartes denies animals *conscious* experience. Sasha's "sensation without consciousness" is arguably a contradiction in Cartesian terms because *sentire* (to feel) implies a subject. However, Sasha is right that the *body* undergoes a state analogous to pain.
