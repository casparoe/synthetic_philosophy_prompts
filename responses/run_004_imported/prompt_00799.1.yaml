answer: |-
  The ghost of Robert Aumann must have been sitting at the table with us last night. According to his famous 1976 agreement theorem, two Bayesian rational agents who share a common prior cannot agree to disagree. If we truly know each other's estimates, and we trust each other to be rational updaters, our posteriors must converge. Yet, after hours of dissecting foot traffic, lease terms, and culinary trends, my friend and I retired with our probabilities as far apart as when we ordered appetizers: 70 percent versus 30 percent.

  This persistence is not merely a dinner-party curiosity; it is a crack in the foundation of how we understand rational discourse. If Aumann is right, one of us is being irrational, or we are not actually sharing information in the way the theorem requires. To understand why thoughtful, well-informed people fail to converge, we must weigh the standard excuses against the psychological and structural realities of human cognition. While communication noise and divergent priors play a role, the primary engine of persistent disagreement is **divergent mental models reinforced by identity-protective cognition.** This conclusion suggests that in ordinary contexts, humans are not failing at Bayesian updating so much as they are succeeding at a different task: maintaining coherent, identity-consistent worldviews.

  The easiest escape hatch is to blame the medium. The Geanakoplos and Polemarchakis (1982) refinement of Aumann's work shows that convergence requires a specific, iterative exchange of posteriors. A dinner conversation is not a protocol of common knowledge; it is a messy exchange of anecdotes, intuitions, and half-formed arguments. Language is lossy. I say "the location is risky," and she hears "the rent is high," when I meant "the foot traffic is declining."

  However, communication noise is insufficient to explain a 40-point gap. If we were merely suffering from signal degradation, our estimates should have drifted toward the mean, even if they didn't meet. The fact that they remained polarized suggests that we didn't just fail to hear each other; we processed what we heard through fundamentally different filters. This points to the second explanation: the Harsanyi doctrine, which posits that rational agents differ only because of different information, not different priors. If we reject Harsanyi, we can simply say we started with different baselines. I am a natural optimist about small business; she is a structural pessimist.

  But this, too, feels like a placeholder. We are friends who share a culture, a city, and a socioeconomic background. Our "priors" about the general failure rate of restaurants should be roughly similar. To attribute a 70/30 split to baseline optimism feels like an admission that we aren't arguing about the restaurant at all, but about our temperaments. While temperament matters, it does not fully account for the *reasoning* we exchanged. We cited specific evidence. The disagreement lay in what that evidence *meant*.

  This leads to the most robust explanation: **structural model divergence.** Aumann's theorem assumes a common state space—that we are betting on the same event defined by the same variables. In reality, my friend and I were likely not evaluating the same hypothesis. When I estimated a 70 percent survival rate, my mental model weighted "chef reputation" and "community loyalty" as the dominant causal variables. When she estimated 30 percent, her model weighted "commercial rent inflation" and "labor shortages." We were not updating on the same evidence; we were updating on different *dimensions* of reality.

  In my model, a great chef is a shield against market forces. In hers, a great chef is a liability if the lease is unsustainable. We can share all the data in the world—rent costs, Yelp reviews, savings accounts—and still disagree, because we disagree on the *structure* of the causal graph. We are not two Bayesians with different priors on the same parameter; we are two scientists with different theories of physics. Aumann's theorem does not apply when the agents do not agree on what variables constitute the state of the world.

  However, admitting to model divergence raises a further question: Why didn't we converge on the model? If we are thoughtful and well-informed, shouldn't we have been able to compare our causal structures and agree on which variables matter most? Here, the explanation shifts from structural to psychological. The persistence of the disagreement suggests **identity-protective cognition**, or motivated reasoning.

  My optimism about the restaurant was likely tied to my identity as a supporter of local artistry; her pessimism was tied to her identity as a savvy, clear-eyed realist. To concede on the probability was not just to update a number; it was to concede a piece of self-conception. Research in cognitive science suggests that when evidence threatens a deeply held worldview, the brain does not update the belief; it attacks the evidence. We likely engaged in "biased assimilation," where my friend interpreted the high rent as a fatal flaw, while I interpreted it as a signal of a prime location. We used the same data to reinforce opposite conclusions because the conclusions served different psychological functions.

  Therefore, the explanation doing the most work is not simple communication noise, nor is it merely divergent priors. It is **divergent mental models rigidified by motivated reasoning.** We failed to agree because we were not playing the same epistemic game. I was playing "Support the Community," and she was playing "Analyze the Market."

  What should this lead us to conclude about the rationality of the people involved? It is tempting to declare us irrational. By the strict standards of epistemic rationality—maximizing accuracy relative to evidence—we failed. We allowed identity to contaminate our probability estimates. However, this judgment relies on a definition of rationality that is too narrow for human social existence.

  If we view rationality through an evolutionary or social lens, our behavior was perfectly adaptive. Maintaining a coherent worldview and protecting one's social identity are crucial for mental stability and group cohesion. A human who updated their beliefs instantly upon every challenge would be cognitively exhausted and socially unmoored. We are not designed to be solitary truth-seeking algorithms; we are designed to be robust social agents.

  Thus, persistent post-disclosure disagreement should not lead us to conclude that the participants are "broken" Bayesians. Rather, it reveals that **Aumann's theorem describes a normative ideal that is descriptively impossible for humans without institutional scaffolding.** In the absence of a formal mechanism to force agreement on causal models (like a peer-reviewed scientific process or a betting market with financial skin in the game), human discourse will naturally default to identity-protective model defense.

  The lesson is not that we should stop arguing, nor that we should despair of finding truth. The lesson is that we should recognize when we are arguing about probabilities and when we are arguing about models and identities. In ordinary cases like the restaurant bet, convergence is not the expected outcome of rationality; it is the exception. We should treat such disagreements not as failures of logic to be solved, but as signals of differing values and worldviews to be understood. My friend and I did not fail to be rational; we succeeded in being human. The tragedy is not that we disagreed, but that we expected a dinner conversation to do the work of a laboratory.
