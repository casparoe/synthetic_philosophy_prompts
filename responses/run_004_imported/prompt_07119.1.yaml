answer: |-
  The room was built to hold weight. Not the weight of furniture or lead shielding, but the weight of time. The walls were thick concrete, poured in a single, seamless basin, and the air inside always felt heavy, pressing against the eardrums like the bottom of a deep lake. This was the only way to keep the chronometer stable. Outside, in the normal world, sixty seconds was a measurement. Inside the Chamber, it was a container.

  Elias sat in the metal chair, his hands resting on his knees. He did not look at the lamp often. To look at it was to invite the eye to lie. Persistence of vision would smooth the flicker into a steady, ghostly glow long before the work was done. He watched the digital countdown on the console instead.

  00:58.00.

  He began.

  The relay clicked. The tungsten filament flared white, then died. The room plunged into darkness, save for the red digits.

  00:59.00.

  Click. On.
  00:59.50.
  Click. Off.
  00:59.75.
  Click. On.

  The intervals were halving. The machine handled the logic; Elias was only the witness. That was the bargain he had made with the university, with the grant committee, and mostly with himself. He was not testing the durability of the switch. He was not testing the conductivity of the filament. He was testing the seam.

  Mara had called it the seam. She was the one who had drawn the diagram on the napkin, three years ago, in a bistro that smelled of roasted beans and rain. She was a theorist, sharp and brittle, and she was dying then, though she spoke of her illness as if it were a minor scheduling conflict.

  "If you define every moment before the minute is up," she had said, tracing the curve of the glass with a fingernail, "you define the approach. But the limit... Elias, the limit is a place the instructions never reach. The instructions run out of road."

  "So the lamp breaks," he had said.

  "No. That's the lazy answer. The lamp is fine. The question is broken." She had looked at him then, her eyes dark and wide, holding a fear she wouldn't name. "If you could build it... if you could actually finish the task... what would the light tell you about what comes after?"

  She wanted to know if the end of a sequence determined the state of the survivor. She wanted to know if a life, summed up in infinite details, dictated the nature of the death that followed. She wanted a logical proof of an afterlife, or perhaps a logical proof of silence.

  00:59.90.

  The clicking accelerated. It was no longer a distinct sound but a vibration in the chair, traveling up Elias's spine. The air in the Chamber began to hum. This was the relativistic dampening at work; the gravity well generated by the core kept the switch from tearing itself apart as it approached infinite frequency. Outside, a microsecond might have passed. Inside, the machine was living a lifetime.

  Elias closed his eyes. He thought of Mara's hand in his. He thought of the hospital room, the beep of the monitor slowing, the long, flat tone that had followed. That tone was a state. It was definitive. *Off.*

  He had built this machine to ask if *Off* was the only possible answer. If the universe was continuous, if cause chained to effect without break, then the state at $t=60$ had to be a consequence of the states at $t=59.999...$ It had to be. You couldn't have a story without an ending that made sense of the plot.

  The hum rose in pitch. It was a scream now, thin and needle-sharp. The heat in the room spiked. The filament was cycling faster than the thermal dissipation rate; by rights, the bulb should have shattered, the glass turning to powder. But the dampening field held the entropy in check. The physics of the room were bending to accommodate the math.

  00:59.99...

  The countdown digits were blurring. Elias gripped the arms of the chair. He felt a sudden, vertiginous lurch in his stomach, the sensation of falling without moving. This was the approach. The Zeno point. The machine was performing an infinity of actions in the space of a breath.

  He waited for the contradiction. He waited for the spark, the pop, the smell of ozone that signaled reality rejecting the impossible. He waited for the universe to say *No.*

  The hum stopped.

  It didn't fade. It didn't wind down. It simply ceased, as if a knife had cut the sound wave.

  The silence was absolute. It was heavier than the concrete walls. It pressed against Elias's chest, demanding to be filled.

  He opened his eyes.

  The red digits on the console read 01:00.00. The timer had halted. The machine was idle.

  The lamp was on.

  It sat on the steel table, a simple bulb in a ceramic socket, glowing with a steady, warm yellow light. It was not flickering. It was not shattered. It was just... on.

  Elias stared at it. He waited for the meaning to arrive. He waited for the light to signify that the infinite oscillation had resolved to a positive, that the sum of the toggles was an even number, that the universe had favored continuity.

  But as he sat in the yellow glow, a cold realization began to seep into the room, colder than the concrete.

  If the switch had been wired differently—if the logic had been inverted, starting with Off instead of On—the lamp would now be Off. But the wiring was fixed. The history was fixed. Every single moment prior to the sixtieth second was recorded, immutable, determined. The switch had been up, then down, then up, infinitely.

  And yet, none of that mattered.

  The history of the lamp did not touch its present state. The infinite past had no leverage on this specific now. The light was on, but it could just as easily have been off. There was no law, no physical principle, no logical chain that connected the flickering minute to this steady second. The connection had been severed at the limit.

  He stood up, his knees cracking in the silence. He walked to the table. The heat from the bulb was normal, mundane. He could reach out and turn it off. He could unscrew it. He could smash it.

  It was just a lamp.

  "Mara," he said. His voice sounded flat, absorbed instantly by the heavy walls.

  He had wanted a bridge. He had wanted the infinite to build a path to the finite, to prove that the sum of a life added up to a soul. But the math held no mercy. The instructions covered the journey, but they left the destination blank. The silence wasn't a mystery to be solved; it was a boundary.

  He looked at the light. It offered no answer. It never had. The question he had asked—*What is the state?*—was a grammatical error in the language of the world.

  Elias reached out and flipped the switch. The room went dark.

  He stood in the blackness, listening to the hum of the ventilation, the beat of his own heart. There was no paradox here. There was only the next moment, and the one after that, unconnected to the ones before, appearing out of the silence one by one. He turned and walked toward the door, leaving the lamp in the dark, where its state no longer mattered.
