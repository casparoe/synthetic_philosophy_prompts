      *(Refining the Tautology point)*: If *any* behavior can be rationalized by positing a hidden cost, the theory loses predictive power. I should argue that while it *can* be rationalized, doing so shifts the burden of proof to specifying the utility function. The theorem remains substantive as a *consistency check*: If you claim you don't want to know, you must be able to articulate the disutility of the state of knowing.

      *Final Plan:*
