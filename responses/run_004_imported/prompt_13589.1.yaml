answer: |-
  The blood work was identical. That was the first thing the coroner noted, and the first thing Silas's widow, Mara, fixated on.

  Two men. Same genetic marker, same diet, same exposure to the industrial coolant known as Solvent-7. One lived in North Harrow, the other in South Harrow. They were monozygotic twins, separated at birth, reunited only for the annual company physical. Let's call them Silas-N and Silas-S.

  On Tuesday, both men felt the same tingling in their fingertips. A numbness that spread to the wrist.
  On Wednesday, both men went to their respective company clinics.
  On Thursday, Silas-N was on a plane to a specialized neurology center. Silas-S was back on the factory floor, handed a bottle of ibuprofen and a brace.
  On Friday, Silas-S suffered a catastrophic neuromuscular seizure. He died before the ambulance arrived. Silas-N, three hundred miles away, was beginning a treatment regimen that would save his life.

  The mystery wasn't biological. The coolant affected the nervous system in exactly the same way in both bodies. The mystery was semantic.

  In North Harrow, the medical community used the term *Neuro-Tox* to describe any reaction to Solvent-7 that involved nerve degradation. It was a broad, catch-all term. If you had the tingling, you had *Neuro-Tox*. The protocol for *Neuro-Tox* was immediate isolation and aggressive chelation therapy.

  In South Harrow, the term *Neuro-Tox* was used differently. There, the medical establishment had historically categorized the condition more narrowly. *Neuro-Tox* referred only to the late-stage cognitive decline. The early-stage tingling? That was classified as *Peripheral Strain*. *Peripheral Strain* was considered an ergonomic issue, a repetitive stress injury. The protocol was rest and painkillers.

  Silas-N walked into his clinic and said, "I think I have Neuro-Tox."
  The doctor nodded, looked at the chart, and saw the Solvent-7 exposure. The concept NEUROTOX in North Harrow carried the weight of *nerve death*. The doctor's belief, triggered by Silas's utterance, was: *This man is in immediate mortal danger.* The action followed inevitably.

  Silas-S walked into his clinic and said, "I think I have Neuro-Tox."
  The doctor nodded, looked at the chart, and saw the Solvent-7 exposure. But the concept NEUROTOX in South Harrow carried the weight of *cognitive decline*, which wasn't present yet. The tingling fell under the concept PERIPHERAL STRAIN, even if Silas used the other word. The doctor corrected him gently. "You don't have Neuro-Tox, Silas. You have Strain. It's common." The doctor's belief was: *This man is sore.* The action followed inevitably.

  Mara sat in the coroner's office, the report spread before her. "He told them," she said, her voice flat. "He told them exactly what he felt. He used the word they taught him."

  "The blood chemistry is identical," the coroner said, tapping the page. "If this were a Twin Earth scenario—if the coolant in South Harrow were chemically different, say, Solvent-7 prime—we could blame the physics. But it's the same sludge. The same biology."

  "Then why did one live and the other die?"

  "Because the word *Neuro-Tox* isn't just a label, Mara. It's a tool. In North Harrow, that tool cuts deep. In South Harrow, it's dull."

  "But Silas-S thought he was sick," Mara insisted. "He had the same fear. He had the same pain. Inside his head, he was screaming for help just like his brother."

  "Was he?" The coroner leaned back. "This is the part that keeps the philosophers up at night. We want to say that what's in the head is private property. That Silas-S's *thought* was his own. But Burge would argue that Silas-S didn't actually possess the concept that would have saved him."

  Mara frowned. "He possessed the word."

  "He possessed the sound. But the *content* of the thought—what made the thought *about* nerve death rather than muscle strain—wasn't in his neurons. It was in the room. It was in the way the doctors in South Harrow had agreed to use the language. Silas-S's brain state was identical to his brother's, yes. But a belief isn't just a brain state. It's a relationship between a brain and a world."

  The coroner picked up a pen, twirling it. "In North Harrow, when Silas-N thought *I have Neuro-Tox*, that thought hooked into a network of social practices that included emergency protocols. In South Harrow, when Silas-S thought *I have Neuro-Tox*, that thought hooked into a network that included ibuprofen. The difference wasn't in the wiring of their minds. It was in the wiring of their communities."

  "So he died because of a definition?"

  "He died because mental content isn't skin-bound," the coroner said. "We like to think we own our thoughts. That if we feel a thing, we know a thing. But Silas-S's understanding was incomplete, not because he was stupid, but because his community hadn't carved up the world in a way that let him see the danger. He couldn't form the intention to save his own life using that concept, because the concept didn't *mean* 'save your life' where he stood."

  Mara looked at the report again. The blood work was identical. The men were identical. The only variable was the dictionary.

  "It feels like a cheat," she said quietly. "Like he was punished for not reading the fine print of reality."

  "Maybe," the coroner said. "But that's the teeth of it. If meaning were just in the head, Silas-S would be alive, because his head was fine. The fact that he's dead proves that what we think depends on who we're talking to. We aren't islands, Mara. We're nodes. When the network fails, the node fails, no matter how perfectly it fires."

  Mara stood up, folding the report. She thought of Silas-S at dinner the night before he died, rubbing his wrist, telling her he had that *Neuro-Tox* tingling again. He had been worried. She had told him to take a pill and rest. They had both used the word. They had both thought they understood.

  But they were in South Harrow. And in South Harrow, the word didn't reach far enough to touch the truth.

  "Can we change it?" Mara asked. "The definition?"

  "The medical board is convening Monday," the coroner said. "They're going to align with North Harrow."

  "Too late for Silas."

  "Yes," the coroner said. "But not for the next man who walks in and says the word. That's the only leverage we have. We can't change our brains fast enough to save us. But we can change the world we stick them in."
