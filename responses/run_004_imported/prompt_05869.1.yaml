answer: |-
  This is a fantastic problem, and you are right to feel that Lewis's framework is precise enough to demand a definite answer rather than a hand-wave. The tension you're identifying—between Lewis's static equilibrium analysis and the dynamic, adversarial reality of algospeak—is exactly where the rubber meets the road for applying mid-20th-century analytic philosophy to 21st-century technolinguistics.

  Here is a reconstruction of how Lewis would likely parse algospeak, sticking strictly to the apparatus in *Convention* (specifically Chapter 3) and "Languages and Language," followed by a assessment of whether Skyrms or Millikan offers a better fit.

  ### 1. The Lewisian Checklist
  To determine if algospeak is a convention, we have to run it against Lewis's five conditions for a regularity $R$ in behavior among a population $P$ in a recurrent situation $S$:

  1.  **Conformity:** Everyone conforms to $R$.
  2.  **Expectation:** Everyone expects everyone else to conform to $R$.
  3.  **Conditional Preference:** Everyone prefers to conform to $R$ on the condition that others do (coordination problem).
  4.  **Arbitrariness:** There is at least one alternative regularity $R'$ that could have solved the coordination problem instead.
  5.  **Common Knowledge:** Conditions 1–4 are common knowledge in $P$.

  Let's apply your two specific objections to this checklist.

  ### 2. Objection One: The Adversarial/Unstable Element
  **Your worry:** Lewis assumes a stable recurring situation $S$. Algospeak involves an adversary (the classifier) that changes $S$, forcing the convention to churn. Does this break the "stable equilibrium" requirement?

  **Lewis's Reconstruction:**
  Lewis would likely argue that you are misidentifying the boundaries of the situation $S$. For Lewis, $S$ is defined by the payoffs and the constraints facing the agents.
  *   **Old $S_1$:** Communicating on a platform with no moderation.
  *   **New $S_2$:** Communicating on a platform with a classifier that flags keyword $K_1$.

  In $S_2$, using "kill" yields a negative payoff (shadowban/removal). Using "unalive" yields a positive payoff (communication succeeds), *provided* the audience understands it. This is a coordination problem. The algorithm is not a player in the coordination game; it is part of the *environment* defining the payoff matrix, much like a washed-out bridge in a driving coordination problem.

  **The Churn:**
  Lewis does not require conventions to be eternal. He requires them to persist *while $S$ persists*. When the classifier updates to flag "unalive," the situation changes to $S_3$. The convention $R_1$ (say "unalive") lapses, and a new convention $R_2$ (say "u-n-a-l-i-v-e" or "lemon") emerges.
  *   **Verdict:** This does not break Lewis's framework. It simply means algospeak is a **sequence of short-lived conventions** rather than one long-lived one. Lewis's framework handles the *snapshot* of equilibrium perfectly; it is less concerned with the *diachronic stability* of that equilibrium. As long as, at time $t$, users are coordinating on $R$ to solve $S_t$, it is a convention.

  ### 3. Objection Two: Common Knowledge and Forgotten Rationale
  **Your worry:** Many users say "seggs" without knowing it's for moderation evasion. They just think it's slang. Does this violate the Common Knowledge or Conditional Preference conditions?

  **Lewis's Reconstruction:**
  This is the sharper objection. Lewis is strict about common knowledge. However, he distinguishes between knowing the *history* of a convention and knowing the *current structure of expectations*.

  *   **Conditional Preference:** Does the "clueless" user prefer to say "seggs" conditional on others doing so? Yes. If they say "sex," they might be misunderstood (because the community norm is "seggs") or flagged. Their preference is grounded in *current utility* (being understood/fitting in), not *historical origin* (evading the 2021 classifier).
  *   **Common Knowledge:** Do they know that *others* expect them to say "seggs"? Yes. That is the definition of a norm.
  *   **The Crucial Nuance:** Lewis requires common knowledge that *everyone prefers to conform*. If Group A (Evasionists) prefers "seggs" to avoid bans, and Group B (Trenders) prefers "seggs" to signal in-group status, do they satisfy the condition?
      *   Lewis would say **yes**, provided the coordination holds. The *reasons* for the preferences can differ as long as the preference structure (I do $R$ if you do $R$) is common knowledge.
      *   However, if Group B believes "seggs" is the *only* word for the concept (a semantic shift), the **Arbitrariness** condition (Condition 4) is threatened.

  **The Arbitrariness Trap:**
  This is where Lewis might call algospeak a **degenerate case**.
  *   If users think, "I could say 'sex' or 'seggs', but I choose 'seggs' because you expect it," it is a convention.
  *   If users think, "On TikTok, 'seggs' *means* sex; 'sex' is the wrong word," it has ceased to be a convention and has become **semantics** (a rule of language rather than a rule of use).
  *   Lewis distinguishes between *conventions of language* (which are conventions) and *semantic rules*. If the evasion tactic becomes codified into the dialect such that the alternative is no longer perceived as a live option, it loses the "arbitrariness" required for a Lewisian convention. It becomes a rule of grammar for that dialect.

  **Verdict:** Algospeak starts as a Lewisian convention. As it spreads to users unaware of the evasion motive, it risks solidifying into a semantic rule of the "TikTok Dialect." Lewis would say it transitions from a *behavioral convention* to a *linguistic rule*.

  ### 4. Is Lewis's Machinery Enough? (Skyrms & Millikan)
  You asked if Lewis needs to "bolt on" new features or if other frameworks do better.

  **Brian Skyrms (Signaling Games):**
  Skyrms is actually the superior fit for the **adversarial/churning** aspect.
  *   Lewis analyzes equilibrium; Skyrms analyzes *dynamics*.
  *   In *Signals: Evolution, Learning, and Information*, Skyrms models how signaling systems evolve and collapse. He explicitly handles cases where the environment changes (the classifier updates).
  *   Skyrms would model the algorithm as a "predator" or a filter in the evolutionary dynamic. He can explain *why* the convention churns (evolutionary arms race) rather than just noting that $S$ changed.
  *   **Recommendation:** If your group cares about the *instability* and the *emergence* of the terms, Skyrms is the upgrade. Lewis explains the *state*; Skyrms explains the *process*.

  **Ruth Millikan (Proper Functions):**
  Millikan is the superior fit for the **forgotten rationale** aspect.
  *   Millikan's theory of "proper functions" allows a device (or word) to retain its function even if current users don't know it.
  *   She would argue "unalive" has the proper function of evasion, derived from its history, even if current users use it merely for conformity.
  *   Lewis struggles slightly here because his "common knowledge" requirement is internalist (agents must know the preferences). Millikan is externalist (the history determines the function).
  *   **Recommendation:** If your group cares about the *meaning* and *historical drift* of the terms, Millikan handles the "forgotten origin" problem better than Lewis.

  ### 5. Summary for Your Reading Group
  If I were sitting in your reading group, here is the Lewisian position I would defend:

  1.  **It is a Convention:** Algospeak satisfies Lewis's definition *at any given time slice $t$*. The adversarial algorithm is part of the situation $S$, not a violation of coordination.
  2.  **It is Fragile:** Because $S$ changes frequently (classifier updates), the convention has a high turnover rate. Lewis's framework predicts this instability: when payoffs shift, equilibria break.
  3.  **The "Clueless User" Problem:** This threatens the **Arbitrariness** condition. If users no longer perceive "kill" as a viable alternative to "unalive," it ceases to be a convention and becomes a dialectal rule. Lewis would say the convention has "solidified" into language.
  4.  **Who Does It Better?**
      *   Stick with **Lewis** to define the *normative structure* (why do I feel pressure to say "seggs"?).
      *   Switch to **Skyrms** to explain the *evolutionary churn* (why does "seggs" become "s3gs" next year?).
      *   Switch to **Millikan** to explain the *semantic drift* (why does "unalive" mean death even to people who don't know about moderation?).

  **Final thought for your advisor:** Lewis's framework isn't broken by algospeak, but algospeak exposes the **static limitation** of *Convention*. Lewis gives us a geometry of social norms; he doesn't give us a kinetics. Algospeak is high-kinetics social physics. You don't need to throw out Lewis, but you do need to acknowledge that his snapshot analysis requires constant re-calibration in adversarial environments.

  Hope this helps untangle the knot. It's a great case study for the limits of equilibrium analysis.
