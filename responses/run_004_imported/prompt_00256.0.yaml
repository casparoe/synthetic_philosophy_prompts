answer: |-
  **Setting:** *A cramped office, late afternoon. Whiteboards are covered in payoff matrices and epistemic logic notation. Two graduate students, **Alice** and **Bob**, are debating over lukewarm coffee.*

  **Alice:** Look, I'm telling you, you're overthinking the lecture notes. The theorem is clean: Common Knowledge of Rationality (CKR) is epistemically equivalent to Iterated Elimination of Dominated Strategies (IEDS). You iterate until you can't eliminate anything else, and what's left are the rationalizable strategies. That's the Pearce-Bernheim result. It's the foundation of the course.

  **Bob:** It's the foundation, sure, but the notes glossed over the crack in the foundation that appears as soon as you add a third player. In two-player games, fine. But in three-player games, saying IEDS delivers "the" rationalizable set is misleading. It delivers *correlated* rationalizability. But if you want the standard Bernheim definition—independent rationalizability—you need an extra assumption that CKR doesn't give you.

  **Alice:** You're talking about the independence of opponents' strategies. But look, in a non-cooperative game, players don't have a correlation device. They don't meet in a smoky room to coordinate their randomizations. So why wouldn't their strategies be independent? It's the default.

  **Bob:** Because "non-cooperative" describes the game form, not the belief structure. CKR says I know you're rational, you know I'm rational, I know you know I'm rational, and so on. It says nothing about whether my belief about Player 2 is statistically independent of my belief about Player 3. I could believe you're both responding to the same sunspot, or the same piece of public news, without you two explicitly colluding. If CKR allows for that possibility, then the set of strategies surviving IEDS should be larger than the set surviving under an independence assumption.

  **Alice:** But IEDS checks for dominance against *all* pure strategy profiles of the opponents. If a strategy survives that, it's a best response to *some* belief. Whether that belief is a product measure or a correlated distribution doesn't change the fact that the strategy wasn't dominated. The elimination process itself doesn't care about independence.

  **Bob:** Exactly! And that's the problem. The elimination process allows correlation. So the survivors are the *correlated* rationalizable strategies. But the notes imply this is the *only* epistemic consequence of CKR. If I'm a purist, and I say "CKR alone," I shouldn't be allowed to rule out correlated beliefs. But if I *do* rule them out to get the smaller, independent set, I've added an axiom. The notes make it sound like CKR *forces* the elimination, but in three-player games, CKR actually *preserves* more strategies than the independent model does.

  **Alice:** You're saying CKR is too permissive?

  **Bob:** I'm saying CKR is precise. It doesn't justify independence. Let's walk through a concrete example. It makes the gap obvious.

  **Alice:** Okay, hit me. Three players?

  **Bob:** Three players. Player 1 chooses $U$ or $D$. Player 2 chooses $L$ or $R$. Player 3 chooses $l$ or $r$.
  Player 1's payoffs are simple:
  If the profile is $(L, l)$ or $(R, r)$, Player 1 gets 10 from playing $U$.
  If the profile is $(L, r)$ or $(R, l)$, Player 1 gets 0 from playing $U$.
  Player 1 gets a guaranteed 6 from playing $D$, regardless of what 2 and 3 do.

  **Alice:** Okay, so Player 1 wants to "match" the actions of 2 and 3. $U$ is good if 2 and 3 coordinate; $D$ is the safe option.

  **Bob:** Right. Now, look at Players 2 and 3. Suppose they are playing a Matching Pennies game *against each other*.
  Player 2 wants to match Player 3 ($L$ with $l$, $R$ with $r$).
  Player 3 wants to mismatch Player 2 ($l$ against $R$, $r$ against $L$).
  Payoffs for 2 and 3 are standard zero-sum Matching Pennies.

  **Alice:** Okay, in Matching Pennies, the unique rationalizable strategy for both is the 50-50 mix. There's no pure strategy that survives iterated elimination. So, under Common Knowledge of Rationality, Player 1 *knows* that Player 2 must play $(0.5, 0.5)$ and Player 3 must play $(0.5, 0.5)$.

  **Bob:** Wait. That's true for *Nash Equilibrium*, and it's true for *Independent* Rationalizability. But is it true for *Correlated* Rationalizability?
  Think about Player 2's belief. For $L$ to be rationalizable for Player 2, Player 2 just needs to believe Player 3 plays $l$. Is it rational for Player 3 to play $l$? Yes, if Player 3 believes Player 2 plays $R$. Is it rational for Player 2 to play $R$? Yes, if he believes Player 3 plays $r$.
  This loop closes. In the correlated rationalizability set, the profiles $(L, l)$ and $(R, r)$ are *not* eliminated. They are rationalizable profiles, even if they can't happen simultaneously in equilibrium.

  **Alice:** I see where you're going. So, if we allow correlated beliefs, Player 1 can believe that 2 and 3 are playing $(L, l)$ with probability 0.5 and $(R, r)$ with probability 0.5.
  In that case, Player 1's expected payoff for $U$ is $0.5(10) + 0.5(10) = 10$.
  Since $10 > 6$, $U$ is a best response. So $U$ survives IEDS.

  **Bob:** Precisely. $U$ survives the iterated elimination process because it is not dominated. It is a best response to a *correlated* belief consistent with CKR.
  But now, look at the Independent case. If Player 1 assumes independence, Player 1 must believe 2 plays $L$ with $p=0.5$ and 3 plays $l$ with $q=0.5$.
  The probability of $(L, l)$ is $0.25$. The probability of $(R, r)$ is $0.25$.
  Player 1's expected payoff for $U$ is $10(0.25 + 0.25) = 5$.
  Since $5 < 6$, $U$ is never a best response under independent beliefs. $U$ gets eliminated.

  **Alice:** So, under Independent Rationalizability, $U$ is gone. Under Correlated Rationalizability (and IEDS), $U$ stays.
  Your point is that the lecture notes claim CKR leads to IEDS, which implies $U$ stays. But often, when people say "Rationalizable," they implicitly mean the Independent version, where $U$ goes.

  **Bob:** Exactly. The notes say "CKR delivers the rationalizable strategies." If a student takes that to mean "strategies consistent with rationality and independence," they've been misled. CKR *alone* does not force independence. To eliminate $U$, you need CKR *plus* an Independence Axiom. The notes treat the Independence Axiom as if it's free, but in three-player games, it's a substantive restriction on beliefs.

  **Alice:** Okay, I grant the technical distinction. But pragmatically? In a non-cooperative game, why should Player 1 believe 2 and 3 are correlating? There's no mechanism for it. If we include $U$ in the solution set, we're predicting players might coordinate on outcomes that require a correlation device they don't have. Isn't Independent Rationalizability the more "defensible" benchmark for standard game theory?

  **Bob:** Defensible, maybe. But is it *epistemically forced*? That's the question. If I'm Player 1, and I know you're rational, and I know Player 3 is rational... why am I forbidden from thinking you might both be reading the same economic report? That report isn't a "correlation device" in the game rules, but it correlates your beliefs. CKR doesn't rule out common causes. By insisting on independence, we aren't just analyzing rationality; we're analyzing rationality *plus* a specific assumption about the absence of common signals.

  **Alice:** But if we allow *any* correlation, the solution concept becomes almost vacuous in large games. The set of correlated rationalizable strategies can be huge. It includes outcomes that feel incredibly fragile. $U$ in my example only works if 2 and 3 are perfectly correlated. If there's even a slight tremble toward independence, $U$ crashes. Independent Rationalizability is more robust. It filters out strategies that rely on "magical" correlation.

  **Bob:** "Magical" is doing a lot of work there. You're essentially arguing for Independence because it gives a sharper prediction, not because CKR demands it.
  And consider the reverse: If the Notes claim IEDS *is* the operationalization of CKR, and IEDS keeps $U$, then the Notes are admitting that CKR allows correlation. If they wanted the Independent set, they should have taught Iterated Elimination assuming product measures, not standard mixed-strategy dominance. They can't have it both ways. They can't say "CKR implies IEDS" and then implicitly treat IEDS as if it yields the Independent set.

  **Alice:** Fair. The conflation is real. But here's my defense of the Notes: In the context of a graduate course on *non-cooperative* foundations, the "Independence" assumption is usually baked into the definition of the game form itself. The players are distinct agents with distinct randomization devices. Unless the game specifies a correlating device (like Aumann's correlated equilibrium), the product structure is the null hypothesis.
  Teaching Correlated Rationalizability as the *default* outcome of CKR might confuse students into thinking correlation is as standard as independence in non-cooperative settings. It's a pedagogical choice to prioritize the Bernheim view.

  **Bob:** It's a choice, sure. But it's an epistemic lie if presented as a theorem of CKR.
  Here's the worry: If I'm designing a mechanism, and I rely on the "Rationalizable" set to predict behavior, I need to know which one I'm using. If I assume Independence, I might design a mechanism where $U$ is eliminated, and the system is stable. But if the agents *do* find a way to correlate their beliefs (through focal points, culture, pre-play chatter), $U$ becomes viable, and my mechanism might break.
  By glossing over the independence assumption, the Notes hide a source of fragility in the prediction.

  **Alice:** So you think we should teach Correlated Rationalizability as the primary concept?

  **Bob:** I think we should teach that CKR $\to$ Correlated Rationalizability. And then say, "If you *add* an independence assumption, you get Independent Rationalizability."
  The Notes say: CKR $\to$ Rationalizability (full stop). That implies the independence comes for free. It doesn't. In two-player games, it does, which is why the Notes glossed over it. In three-player games, it's a fork in the road.

  **Alice:** Okay, I'll concede the point on the lecture notes. They were imprecise.
  But I still think there's a normative argument for Independence. If we accept Correlated Rationalizability, we are essentially saying that *any* correlation consistent with rationality is as plausible as independence. But in the absence of communication, independence has a higher prior probability. It's the maximum entropy solution.
  If I have to bet on whether Player 2 and 3 are correlating without talking, I bet on independence. So as a solution concept for *prediction*, Independent Rationalizability is more useful.

  **Bob:** As a prediction tool, maybe. But as an *epistemic foundation*? It's weaker. It relies on an assumption about the world (no common signals) that isn't in the model.
  Look, let's compromise. The Notes are right that IEDS characterizes the strategies consistent with CKR. But they are wrong to imply that this set is the "standard" rationalizable set in $N$-player games without qualification.
  We need to tell students: "IEDS gives you the Correlated set. If you want the Independent set, you must justify why beliefs cannot correlate."

  **Alice:** I can live with that. It clarifies why the 2-player case feels so clean—it's the only case where the fork doesn't exist.
  But I'm still going to argue that for most economic applications, the Independent set is the one that matters. If your mechanism only works under correlation, it's a bad mechanism.

  **Bob:** And I'll argue that if your theory relies on an assumption not derived from the axioms, you should state the axiom. CKR is powerful enough on its own; we don't need to smuggle in Independence and pretend it's logic.

  **Alice:** *Takes a sip of cold coffee.* So, we agree the Notes were sloppy, but disagree on whether the "sloppy" version is more useful for economists.

  **Bob:** *Smiles.* That sounds like a Nash Equilibrium of this conversation. Neither of us has an incentive to change our position.

  **Alice:** Don't start with the game theory jokes. But... yeah. I'll update my study guide. "CKR = Correlated Rationalizability. Independence = Extra Axiom."

  **Bob:** Perfect. Now, do you want to work out the payoffs for a 4-player version where even the correlated set gets weird?

  **Alice:** Let's finish the coffee first. One epistemic crisis at a time.
