prompt: |-
  For the past year, my partner and I have paid our nine-year-old daughter a dollar for every finished homework assignment and taken away screen time whenever she skips a chore. Her grades and chore completion improved right away, but she has since started asking what she will get before doing almost anything, including small favors for her little brother that she used to do freely, and she has grown noticeably fixated on how much money she has saved. When we quietly stopped the payments for a few weeks to see what would happen, her effort dropped right back to where it had been before we started. I suspect the trouble lies with the whole approach rather than with how we calibrated it, but I cannot quite articulate what is wrong with it or what we should do instead. Is there something fundamentally mistaken about motivating a child this way, and if so, what would actually work better?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Current Strategy:** Paying \$1 per homework assignment (positive reinforcement/reward) and removing screen time for skipped chores (negative punishment).
      *   **Initial Result:** Immediate improvement in grades and chore completion.
      *   **Current Problem:** Daughter now asks "What do I get?" for *everything* (including small favors/sibling help). She is fixated on money. When payments stopped, effort dropped back to baseline.
      *   **User's Insight:** Suspects the *approach* is flawed, not just the calibration.
      *   **Goal:** Understand *why* this is happening (the psychology) and find a better alternative.

  2.  **Identify the Core Psychological Concept:**
      *   The scenario describes the **Overjustification Effect** (or Crowding Out Effect).
      *   *Mechanism:* Extrinsic rewards (money) undermine intrinsic motivation (doing things because they are good, expected, or helpful).
      *   *Operant Conditioning:* The parents are using a token economy. While effective for short-term behavior shaping, it fails to build long-term internal values if not faded out correctly or if applied to tasks that should be normative.
      *   *Self-Determination Theory (SDT):* The child's needs for Autonomy, Competence, and Relatedness are being bypassed in favor of external control.

  3.  **Diagnose the Specific Issues:**
      *   **Commodification of Responsibility:** Homework and basic chores are often viewed as "citizenship of the family/school" duties, not paid labor. Paying for them signals they are optional burdens rather than expected contributions.
      *   **Erosion of Intrinsic Motivation:** She used to help her brother freely (intrinsic/relatedness). Now she expects payment (extrinsic). The reward replaced the internal desire to be helpful.
      *   **Dependency:** When the reward stopped, the behavior stopped. This proves the motivation was entirely external.
      *   **Fixation:** The focus shifted from *learning/cleaning* to *earning*.

  4.  **Formulate the Explanation (The "Why"):**
      *   Validate the parents' observation (yes, the approach is the issue).
      *   Explain the Overjustification Effect simply.
      *   Distinguish between "Market Norms" (paid work) and "Social Norms" (family duty/kindness).
      *   Explain that punishment (taking screen time) creates avoidance, not engagement.

  5.  **Develop a Better Strategy (The "What Instead"):**
      *   *Shift from Extrinsic to Intrinsic:* Focus on mastery, contribution, and natural consequences.
      *   *Categorize Tasks:*
          *   *Citizenship Chores:* Unpaid (cleaning own room, homework, basic family help).
          *   *Paid Work:* Extra jobs above and beyond (washing the car, deep cleaning garage).
          *   *Allowance:* Unlinked from chores (teaching money management).
      *   *Restore Intrinsic Motivation:* Praise effort/character, not just results. "Thank you for being helpful" vs. "Here's a dollar."
      *   *Autonomy:* Give choices within boundaries.
      *   *Natural Consequences:* If homework isn't done, the teacher deals with it (within reason). If chores aren't done, screen time isn't earned (privilege vs. right), but frame it as "when/then" rather than punishment.
      *   *Transition Plan:* Don't stop cold turkey. Communicate the change.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Empathetic, non-judgmental, authoritative but accessible.
      *   *Structure:*
          1.  Validate and confirm the suspicion.
          2.  Explain the psychology (Overjustification Effect).
          3.  Break down the specific pitfalls (Market vs. Social norms).
          4.  Provide actionable steps for the transition.
          5.  Offer specific scripts/phrases.
      *   *Key Distinction:* Make sure to separate allowance from chores. This is a common point of confusion.
      *   *Addressing the Regression:* Acknowledge that behavior might get worse before it gets better during the transition.

  7.  **Refining the Advice (Self-Correction during drafting):**
      *   *Initial thought:* Tell them to stop paying immediately.
      *   *Correction:* No, that causes rebellion. Suggest a "family meeting" and a phased approach.
      *   *Initial thought:* Suggest praising her.
      *   *Correction:* Be specific about *process praise* vs. *person praise*.
      *   *Addressing the Screen Time:* Taking it away is punitive. Better to frame screen time as a privilege earned by meeting expectations, not a right taken away. Or, decouple it entirely from specific chores and link it to overall responsibility.
      *   *Addressing the Brother:* This is crucial. Need to rebuild the "helper" identity.

  8.  **Final Polish:** Check against the user's specific details (9-year-old, 1 year duration, homework/chores, sibling favors). Ensure all points are addressed. (The resulting output matches the detailed response provided previously.)

  9.  **Final Review:** Does this answer "Is there something fundamentally mistaken?" Yes. Does it answer "What would work better?" Yes.

