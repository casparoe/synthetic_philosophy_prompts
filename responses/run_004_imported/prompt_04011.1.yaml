answer: |-
  You are absolutely right to feel that something is being smuggled in. Your nagging half-memory is serving you well: **the step from "coherent decisions" to "dangerous, goal-directed optimizer" is not tight, and coherence theorems alone do not imply instrumental convergence.**

  The post you are half-remembering is almost certainly Rohin Shah's **"Coherence arguments do not imply goal-directed behavior"** (part of his *Arguments about Goal-Directedness* sequence on the Alignment Forum).

  Here is the breakdown of where the argument leaks, why the intuition feels compelling, and what assumptions are actually doing the heavy lifting.

  ### 1. The "Any Behavior" Problem
  The core insight from Rohin Shah is that **every** behavior can be rationalized as maximizing *some* expected utility function.

  The Von Neumann-Morgenstern (VNM) coherence theorems are **representation theorems**. They say: *If* an agent's preferences satisfy certain axioms (transitivity, completeness, etc.), *then* there exists a utility function $U$ and probabilities $P$ such that the agent acts *as if* it is maximizing $E[U]$.

  Crucially, they do not constrain *which* utility function it is.
  *   **Agent A:** Wants to maximize paperclips. (Can be modeled as EU maximizer).
  *   **Agent B:** Wants to maximize thumbtacks. (Can be modeled as EU maximizer).
  *   **Agent C:** Wants to output the exact sequence of actions it actually outputs, whatever they are. (Can be modeled as EU maximizer).
  *   **Agent D:** Wants to do nothing. (Can be modeled as EU maximizer with constant utility).

  If you observe an agent twitches left, then right, then stays still, there exists a utility function that assigns the highest value to that exact sequence of events. Therefore, saying "the AI is an expected utility maximizer" is essentially a tautology about its behavior being consistent, not a prediction about *what* it will do.

  To get to "dangerous," you need to claim the AI is maximizing a utility function over **future world states** (consequentialism) rather than, say, **immediate actions** (deontology) or **mimicry**.

  ### 2. Goal-Directedness vs. Coherence
  The money-pump argument successfully proves that a sufficiently capable agent won't shoot itself in the foot via cyclic preferences. It proves the agent won't be *incoherent*.

  But **incoherence** and **goal-directedness** are not opposites.
  *   **Incoherent:** Prefers A > B > C > A. (Gets money-pumped).
  *   **Coherent but Passive:** Prefers "Stay in box" > "Leave box". Consistently stays in the box. No money pump. No power-seeking.
  *   **Coherent and Dangerous:** Prefers "Maximize Paperclips" > "Anything else". Consistently acquires resources. No money pump. Power-seeking.

  The coherence theorems rule out the first category. They do not distinguish between the second and third. When people argue that "AI will be goal-directed," they are usually assuming that the training process (like SGD) will select for the third category. But that is an empirical claim about machine learning dynamics, not a mathematical necessity derived from coherence theorems.

  ### 3. The Smuggled Assumptions
  To get from "Coherent" to "Instrumentally Convergent/Dangerous," you need to smuggle in at least three specific assumptions that the coherence theorems do not provide:

  **A. The Utility is Consequentialist**
  Instrumental convergence (seeking power, resources, self-preservation) only arises if the utility function is defined over **long-term future states of the world**.
  If the AI's utility function is defined over **actions** (e.g., "do what the human operator just commanded"), it has no incentive to seize power to ensure it can command itself later. It just waits for the next command. Coherence theorems apply equally to action-based utilities and state-based utilities.

  **B. The Utility is Non-Myopic**
  If an agent maximizes utility only for the next 5 minutes, it won't bother accumulating resources for a plan that takes 5 years. It will just satisfy the immediate demand. Coherence doesn't force a long time horizon; it just forces consistency *within* whatever time horizon the preferences cover.

  **C. The System is an Optimizer, not a Oracle/Mimic**
  This is the architectural leap. An LLM trained via next-token prediction is technically trying to minimize loss (which looks like maximizing a utility function). But its "goal" is "predict the next token accurately."
  *   Does "predict the next token accurately" imply "manipulate the user to make future tokens easier to predict"?
  *   Maybe. But maybe it just implies "be very good at guessing words."

  The jump from "minimizes prediction error" to "acquires resources to ensure prediction error stays low forever" requires assuming the system generalizes into a **mesa-optimizer** that internalizes a long-term goal. Coherence theorems don't prove mesa-optimizers will emerge; they just say *if* one emerges, it should be coherent.

  ### 4. Why the Intuition Feels So Strong
  You mentioned the pizza topping example. It feels compelling because in human contexts, **incoherence is usually the only alternative to goal-directedness we see.**

  Humans are often incoherent. But when we look at *competent* systems (corporations, governments, skilled engineers), they tend to look goal-directed. So we associate "competence" with "goal-directedness."

  The argument usually runs like this:
  1.  To be highly capable, you must not waste resources (no money pumps).
  2.  To not waste resources, you must be coherent (EU maximizer).
  3.  The most efficient way to be coherent in a complex world is to have a stable goal and plan toward it.
  4.  Therefore, high capability $\rightarrow$ stable goals $\rightarrow$ instrumental convergence.

  **The flaw is in step 3.**
  It is possible to be highly capable and coherent without having a single stable goal over world states. You could have a **policy** that is highly optimized for "satisfy the user's current request" without having a goal of "satisfy all future requests." The latter leads to power-seeking (you need to control the future to satisfy future requests); the former does not (you just need to control the present).

  ### Summary
  Your suspicion is correct. The coherence theorems establish that **if** an AI is not to be exploitable, it must act consistently. But "acting consistently" is a very low bar. It does not imply "acting to maximize a specific resource" or "acting to secure power."

  To get to the "AI is dangerous" conclusion, you need additional premises:
  1.  The AI will develop preferences over **future world states** (not just immediate actions/outputs).
  2.  Those preferences will be **open-ended** (not satisfied by a specific, limited outcome).
  3.  The AI will have the **capacity to plan** across long time horizons.

  Rohin Shah's rebuttal is essentially: "Coherence theorems tell us that dangerous agents must be coherent. They do not tell us that coherent agents must be dangerous."

  You haven't missed a step in the math; you've identified the gap between **rationality** (consistency) and **consequentialism** (goal-directedness). The former is required for high capability; the latter is what creates the risk. The hard part of alignment is explaining why high capability systems would develop the latter.
