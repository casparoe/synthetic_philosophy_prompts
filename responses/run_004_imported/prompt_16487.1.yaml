  **Derk Pereboom's hard incompatibilism (S Tier):** This position accepts the Basic Argument's conclusion that ultimate responsibility is impossible, making it the most logically consistent response since it doesn't try to fight the regress.

  **P.F. Strawson's "reactive attitudes" (A Tier):** By shifting the focus from metaphysical self-creation to unavoidable interpersonal practices, this move dissolves the problem rather than trying to solve the unsolvable metaphysics.

  **Manuel Vargas's revisionism (A Tier):** Similar to P.F. Strawson, this accepts the impossibility of ultimate responsibility but argues we should consciously revise our concept of responsibility to keep useful normative practices.

  **Fischer & Ravizza's reasons-responsiveness (B Tier):** This offers a sophisticated compatibilist account that denies the need for ultimate responsibility, though it still struggles to fully satisfy the intuition that agents must be the ultimate source of their actions.

  **Agent-causal libertarianism (B Tier):** This attempts to halt the regress by positing agents as uncaused causes, but it faces significant challenges regarding metaphysical intelligibility and how such causation actually works.

  **Saul Smilansky's illusionism (B Tier):** While logically consistent with the Basic Argument, this view is ranked lower because it requires maintaining a harmful societal deception rather than finding a stable ethical framework.

  **Robert Kane's event-causal libertarianism (C Tier):** Kane tries to secure ultimate responsibility through indeterministic "self-forming actions," but remains vulnerable to the objection that luck undermines control just as much as determinism does.

  **Frankfurt-style compatibilism (F Tier):** Hierarchical models are specifically vulnerable to the Basic Argument because an agent cannot be ultimately responsible for their higher-order desires any more than their first-order ones.
