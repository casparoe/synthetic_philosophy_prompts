  Before that goes in the piece I'd like to actually understand the mechanics instead of just repeating the soundbite. Can you walk me through why giving agents access to eachother's source code supposedly flips a one-shot Prisoner's Dilemma from mutual defection to mutual cooperation, in a way that counts as a genuine equilibrium and not just wishful thinking? I tried working through the original Tennenholtz paper on program equilibrium and got lost in the notation pretty fast, so honestly a plain-English but accurate version of the argument -- including whatever the catch turns out to be, if there is one -- would save me from embarrassing myself in print.
