      *   *Is it circular?* Not necessarily circular, but it shifts the burden of justification. Instead of justifying Probabilism directly, you justify the Inaccuracy Measure. If the Inaccuracy Measure is justified *because* it yields Probabilism, that's circular. If it's justified by independent epistemic principles (e.g., extensionality, truth-directedness), it's not.
