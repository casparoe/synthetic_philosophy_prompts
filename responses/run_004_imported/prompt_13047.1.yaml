  A.J. Ayer is midway through a lecture on logical positivism. "Claims about surviving bodily death are factually significant only insofar as they can be given determinate empirical content," he declares. "Since such claims are unverifiable in principle, they are cognitively meaningless."

  Months later, Ayer chokes on a salmon bone, flatlines for four minutes, and is resuscitated.

  Returning to his seminar, a student raises a hand. "Professor, given your recent... fieldwork... do you still maintain that the proposition 'I survive death' is meaningless?"

  Ayer adjusts his glasses and replies, "Strictly speaking, yes. Since I returned to report it, the verification conditions for permanent cessation remain unmet. However, I must concede that the sense-data I encountered while clinically deceased has slightly shaken my conviction that death is the end... so, while the claim remains nonsense, it is now nonsense regarding which I harbor empirical doubts."
