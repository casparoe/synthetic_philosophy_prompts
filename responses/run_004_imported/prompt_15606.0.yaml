          *   Crucial point: Gibbard & Harper implicitly assume Death *cannot* predict the random device. This changes the problem from "Death in Damascus" to "Death vs. a Quantum Randomizer." It solves a different problem.

      *   **Body Paragraph 3: The Decision-Theoretic Failure (CDT vs. Correlation):**
          *   Even if we allow the coin flip, why does CDT struggle?
          *   CDT says: My choice doesn't *cause* Death's location. (True).
          *   But my choice is *evidence* of Death's location. (Also True).
          *   CDT ignores the evidence. In Newcomb's, CDT two-boxes and loses. In Death in Damascus, CDT spins in circles.
          *   Randomization doesn't fix the blindness to evidential correlation; it just creates a stalemate where the blindness doesn't hurt as much.
          *   Real solution: Recognize that the *algorithm* of decision is what is predicted. (Hint at FDT/EDT).

      *   **Body Paragraph 4: Ratifiability as a Red Herring:**
          *   Is ratifiability the gold standard?
