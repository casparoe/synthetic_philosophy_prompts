answer: |-
  This is a fantastic deep dive. You have your history right: the 1957 **Wolfenden Report** (which recommended decriminalizing homosexuality and prostitution), followed by the famous duel between **Lord Patrick Devlin** (*The Enforcement of Morals*, 1965) and **H.L.A. Hart** (*Law, Liberty, and Morality*, 1963).

  And the case you're remembering is indeed the **Robert Smith case** (Falkirk Royal Infirmary, Scotland, 2000). Smith amputated the healthy legs of two patients suffering from **Body Integrity Identity Disorder (BIID)** (sometimes called apotemnophilia). The patients were consenting adults who claimed the amputation relieved their psychological suffering. The medical community and public were horrified, and Smith was effectively barred from continuing.

  This case is a perfect stress test for the Hart-Devlin debate because it removes the "harm to others" variable almost entirely. It isolates the conflict between **collective moral intuition** (Devlin) and **individual autonomy/competence** (Hart).

  Here is how each philosopher would likely dissect the Robert Smith case, using their specific philosophical frameworks.

  ---

  ### 1. Lord Devlin: The Disintegration Thesis and the "Right-Minded" Person

  Devlin's argument is often summarized as "legal moralism," but it's more specific than that. It rests on what he called the **Disintegration Thesis**.

  **The Core Argument:**
  Devlin argued that society is not just a political arrangement; it is a "community of ideas." Without a shared moral code, society cannot exist. Therefore, society has the same right to protect its moral fabric from subversion as it does to protect its government from treason. Immorality, for Devlin, is akin to treason.

  **The Test: The "Man on the Clapham Omnibus" (or the Jury Box)**
  You mentioned the "Clapham Omnibus." Devlin did use that legal standard for reasonableness, but for morality, he specifically pointed to the **"12 jurors in the box."** He argued that if you put 12 ordinary, right-minded people in a room and they feel **"intolerance, indignation, and disgust"** at an act, that is proof that the act violates the shared moral code essential to society's survival.

  **Devlin's Verdict on Robert Smith:**
  Devlin would almost certainly argue that the Smith amputations should be criminalized or strictly banned by medical regulation, and his reasoning would be distinctively *non-medical*.

  1.  **The Gut Reaction is Evidence:** For Devlin, the fact that the public was "horrified" and "grossed out" isn't just an emotional reaction; it is *data*. The visceral disgust the public felt toward healthy legs being锯 off is the "jury" speaking. It signals a boundary of the shared moral code regarding the sanctity of the body and the purpose of medicine.
  2.  **Medicine as a Moral Institution:** Devlin would argue that the medical profession holds a specific place in the moral architecture of society (healing, not harming). Allowing doctors to amputate healthy limbs, even with consent, undermines the shared understanding of what a doctor *is*. If that understanding erodes, trust in the institution erodes, and society weakens.
  3.  **No "Private" Sphere:** Devlin famously argued that there is no such thing as a purely "private" immorality. Even if done behind closed doors in an operating theater, the *knowledge* that this is happening corrodes the shared values of the community.
  4.  **The Slippery Slope of Disintegration:** He would ask: If we allow this because the patients "want it," what stops us from allowing consensual cannibalism? Or voluntary slavery? For Devlin, the law must draw a line at the boundary of shared morality, not at the boundary of physical harm.

  **Summary of Devlin:** Ban it. Not because the patients are harmed (they feel helped), but because the act violates the shared moral code that holds society together. The disgust of the "ordinary person" is sufficient justification for the law to intervene.

  ---

  ### 2. H.L.A. Hart: The Harm Principle and the Competence Trap

  Hart's critique of Devlin was scathing. He argued that Devlin provided no evidence for the Disintegration Thesis (just because people dislike homosexuality doesn't mean society will collapse) and that using law to enforce morality is a tyranny of the majority.

  **The Core Argument:**
  Hart leaned on J.S. Mill's **Harm Principle**: The only purpose for which power can be rightfully exercised over any member of a civilized community, against his will, is to prevent harm to others.

  **The Nuance: Hart on Paternalism**
  This is where your question gets really sharp. Hart was not a dogmatic libertarian. He acknowledged that the Harm Principle might need modification for **paternalism** (preventing people from harming themselves). However, Hart was deeply suspicious of it. He distinguished between:
  1.  **Legal Moralism:** Banning an act because it is *immoral* (Devlin's view).
  2.  **Paternalism:** Banning an act because the actor is *incapable of choosing wisely*.

  **Hart's Verdict on Robert Smith:**
  Hart would likely oppose a ban *if* the justification is Devlin's (public disgust), but he might support restrictions based on **mental capacity**.

  1.  **Rejecting the "Disgust" Standard:** Hart would immediately dismiss the public outrage as irrelevant. Just because the "man on the Clapham Omnibus" is disgusted does not mean the act should be illegal. He would argue that Devlin confuses *what is* (people feel disgust) with *what ought to be* (the law should ban it).
  2.  **The Consent Question:** Hart would focus entirely on the validity of the consent. In the Smith case, the patients had BIID. Hart would ask: *Does this mental condition negate their autonomy?*
      *   If BIID is viewed as a delusion (like a schizophrenic believing their arm is alien), then the consent is not truly voluntary. In this case, Hart's **soft paternalism** kicks in. The state can intervene, not because the act is "immoral," but because the agent is not fully competent.
      *   However, if the patients are deemed competent (i.e., they understand the risks, the permanence, and the social consequences, and still choose it to alleviate psychological suffering), Hart would struggle to justify a ban.
  3.  **The Danger of Paternalism:** Hart would warn that if we ban this procedure purely because "they shouldn't want this," we are sliding back toward Devlin's moralism. We are saying, "We know what is good for you better than you do," based on *our* values, not *theirs*.
  4.  **Regulation vs. Prohibition:** Hart would likely argue for strict regulatory oversight (ensuring competence) rather than a blanket ban. A blanket ban assumes *no one* with BIID can ever be competent to choose. Hart would likely demand case-by-case evaluation.

  **Summary of Hart:** Do not ban it because it disgusts people. Only restrict it if you can prove the patients lack the mental capacity to consent. If they are competent adults, the law must respect their autonomy, even if their choice seems irrational to the majority.

  ---

  ### 3. The Crucial Clash: Hart's "Soft Paternalism" and the BIID Dilemma

  You asked specifically whether Hart's soft paternalism would pull him toward restriction. This is the most philosophically rich part of the scenario.

  **What is Soft Paternalism?**
  Soft paternalism (a term later coined by Joel Feinberg, but rooted in Hart's nuances) argues that state intervention is only justified to determine if a choice is *voluntary*. If a choice is voluntary, even if self-harming, the state must stand down. If it is non-voluntary (due to ignorance, coercion, or mental defect), the state can step in.

  **How this applies to Smith/BIID:**
  *   **Devlin** doesn't care if the choice is voluntary. He cares that the *act* is wrong.
  *   **Hart** cares *only* if the choice is voluntary.

  **The Trap:**
  In the Smith case, the patients *claimed* they were suffering and that amputation was the only cure. Psychiatry was divided on whether BIID renders a person incompetent.
  *   **If Hart views BIID as a capacity-defect:** He supports the ban. He would argue that the "harm" is that the patient is acting under a pathological compulsion, similar to a suicidal depressive. The law intervenes to protect the "true self" from the "diseased self."
  *   **If Hart views BIID as a preference (however unusual):** He must oppose the ban. If the patient is rational, informed, and consistent, Hart's framework demands liberty.

  **Why Hart would likely hesitate to ban:**
  Hart was acutely aware that "mental illness" is often used as a code word for "moral deviation." In the 1960s, homosexuality was often classified as a mental disorder to justify keeping it illegal. Hart fought against that.
  He would likely worry that declaring BIID patients "incompetent" is just a backdoor way of enforcing Devlin's morality. He would ask: *Are we saying they can't choose because they are mentally ill, or because they chose something we hate?*

  **The Likely Hartian Position:**
  Hart would probably argue for a **presumption of liberty**. He would say the burden of proof is on the state to demonstrate *incapacity*. Since the patients underwent psych evaluations and insisted on the procedure, Hart would likely lean toward allowing it under strict medical governance, arguing that **suffering is real**, and if amputation relieves that suffering without harming others, the "harm principle" does not justify stopping it.

  He would tell Devlin: *"You say society will crumble if we allow this. I say society is strong enough to tolerate a few amputated legs, but it will crumble if we let the majority dictate the bodily autonomy of the minority based on nothing but disgust."*

  ### The Verdict

  *   **Devlin** bans the surgeon immediately. The "jury" is disgusted; the moral bond is threatened; the act is inherently wrong regardless of consent.
  *   **Hart** allows the surgeon to continue *only if* the patients are proven mentally competent. He rejects the public disgust as a legal standard. He might restrict the practice to prevent exploitation, but he would fiercely resist banning it solely because it violates the "shared moral code."

  **Why this matters today:**
  This debate isn't just history. It's the exact framework used today for **assisted dying**, **gender-affirming care**, and **psychedelic therapy**.
  *   The **Devlin** side asks: "Does this violate our traditional understanding of the body/medicine?"
  *   The **Hart** side asks: "Is the patient competent, and are they harming anyone else?"

  You picked a perfect case to test these ideas. The Robert Smith scandal is essentially the Hart-Devlin debate played out in an operating theater.
