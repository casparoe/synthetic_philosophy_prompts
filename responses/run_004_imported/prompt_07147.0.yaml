  So a few weeks back I fell down a rabbit hole reading about an old British legal debate from the late 50s/early 60s between two law guys, Patrick Devlin and H.L.A. Hart. I actually brought it up at dinner with some friends and just got blank stares, so now I'm asking an AI instead lol. From what I can tell it all kicked off because of a government report (the Wolfenden one, I think) that said you shouldn't criminalize gay sex between consenting adults in private, and Devlin basically argued that society has the right to punish anything that disgusts the "ordinary" person (something about "the man on the Clapham omnibus," or maybe I'm mixing that up with a different case) because a shared moral code is literally what holds society together, and once that erodes the whole thing falls apart. Hart pushed back hard, saying that's a dangerous standard to build law on, and that it should mostly only step in to stop harm to others — though I also read he wasn't a pure Mill guy either, since he thought some paternalism (stopping people from harming themselves) was fine too.

  Anyway, I can't stop thinking about how each of them would've reacted to a case I stumbled on afterward (might be misremembering the name, I think it was a surgeon called Robert Smith) at a hospital in Scotland who, back in the late 90s, actually went ahead and amputated healthy legs off a couple of patients because they had this condition where they were completely convinced the limb wasn't really theirs, and were suffering alot because of it. It became a huge scandal once it hit the news and the hospital banned him from doing it again. What gets me is there's no obvious "victim" in the harm-to-others sense — the patients wanted it, went through psych evaluations, gave full consent — but it obviously grosses a lot of people out and feels deeply wrong on a gut level to most people.

  Could you walk through, in real depth and using their actual arguments (not just a generic "conservative vs liberal" summary), what Devlin's position on a case like this would most likely be, and then how Hart would specifically respond to that reasoning? I'm especially curious whether Hart's own soft-paternalism would end up pulling him toward wanting some restriction here too, even though the harm principle by itself seems to suggest it should just be allowed.
