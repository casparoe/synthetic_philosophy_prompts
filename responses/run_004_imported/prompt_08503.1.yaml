      *   *Motivation:* Evidence sometimes doesn't support a sharp number (Keynes' weight of evidence, Levi's indeterminate probabilities).
      *   *Elga's Objection:* If you use a rule like "choose $A$ over $B$ only if $EU(A) > EU(B)$ for all $P \in \mathbb{P}$," you might reject a series of bets that guarantee a win because at each step, some $P$ in the set says "don't take it." This looks like ignoring evidence.
