      *   *Section 2: The Chain of Imputation (Upward vs. Gap).* Discuss *imputatio facti*. Use the tool/animal analogy. Explain that the *act of deployment* is the imputable deed, not necessarily the specific trigger pull. Discuss *culpa* (negligence).
      *   *Section 3: The Verdict on the Gap.* Synthesize. The gap is an illusion of empirical complexity obscuring transcendental freedom.
      *   *Tone:* Scholarly, precise, adhering to the constraint (stick to *Metaphysics of Morals* apparatus).

  7.  **Refining the Argument (Self-Correction/Nuance Check):**
