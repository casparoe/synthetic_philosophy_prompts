answer: |-
  This is an excellent objection, and it touches on a central tension in legal philosophy between **retributive justice** and **distributive liability**. Your intuition is shared by many critics of Lewis: if the law allows an employer to pay for an employee's mistake, why can't God allow Christ to pay for humanity's sin?

  However, Lewis would argue that this objection rests on a category error regarding what "vicarious liability" actually is in the legal system, and how it differs from "penal substitution." To see why Lewis treats the transferability of punishment as a distinctive philosophical problem, we need to distinguish between three key concepts that your objection tends to conflate: **compensation vs. punishment**, **liability vs. guilt**, and **shared burden vs. exoneration**.

  ### 1. Compensation vs. Retribution
  The strongest counter-example you offer is vicarious liability in tort law (e.g., an employer paying for an employee's negligence). Lewis would point out that this is fundamentally **compensatory**, not **retributive**.

  *   **Vicarious Liability:** The goal is to make the victim whole. The law looks for the "deep pocket" to ensure compensation is paid. It is forward-looking and utilitarian.
  *   **Penal Substitution:** The Christian doctrine (and Lewis's analysis of it) concerns **retribution**. It is backward-looking. It is about satisfying the demands of justice regarding *guilt*.

  In our legal system, we generally forbid vicarious *criminal* liability. An employer cannot go to jail for a murder committed by an employee, even if the employer pays the victim's family. Lewis's puzzle is specifically about *punishment* (which implies censure and retribution), not *penalties* or *damages* (which imply costs and debts). Since vicarious liability is almost exclusively civil or regulatory, it does not solve the puzzle of whether *retributive punishment* can be transferred.

  ### 2. Liability vs. Guilt
  Lewis argues that punishment is inherently personal because it is tied to moral **guilt**, whereas liability is often tied to **relationship** or **risk**.

  When a firm is fined for a manager's misconduct, the firm is not being declared *morally guilty* in the same way the manager is. The firm is held strictly liable because it benefits from the manager's labor and is best positioned to prevent future harm. The moral blame still attaches to the manager.

  In penal substitution, the claim is that the substitute bears the *guilt* (or the punishment due to that guilt) of the offender. Lewis finds this puzzling because guilt is a property of the agent's will and actions. You can transfer the *cost* of a wrong (like a fine), but it is conceptually difficult to transfer the *moral culpability*. If the substitute is innocent (as Christ is in the doctrine), how can they justly receive a punishment that is defined by its application to the *guilty*? Vicarious liability works precisely because it sidesteps the question of the employer's moral guilt; penal substitution cannot sidestep it, because the doctrine hinges on the justice of punishing the innocent to save the guilty.

  ### 3. The Exoneration Condition
  Perhaps the most significant difference is the effect on the original offender.

  *   **In Vicarious Liability:** The employee is not exonerated. If a driver causes an accident and their company pays the damages, the driver can still be fired, sued personally, or criminally charged. The liability is shifted financially, but the responsibility remains with the actor.
  *   **In Penal Substitution:** The core promise is that the original offender is **exonerated**. Because the substitute took the punishment, the sinner goes free *as if they had not sinned*.

  Our legal system does not allow this. If you pay my fine, I am still a convict; I still have the record. If you go to jail for me (which is illegal), I am still the one who committed the crime. Lewis's puzzle is: How can justice be satisfied if the person who actually committed the wrong suffers no penalty, while someone else suffers entirely? Vicarious liability doesn't allow the wrongdoer to walk away scot-free; penal substitution does.

  ### Why Lewis Treats This as a Problem
  Lewis's essay is not necessarily an attack on Christianity, but a probe into our intuitions about justice. He argues that if we find penal substitution unjust in human law (and we do—we outlaw it in criminal contexts), we should be hesitant to claim it is just in divine law unless we can explain the difference.

  He acknowledges that we *do* allow the transfer of **penalties** (like fines). In the essay, he notes that we happily let parents pay their children's fines. But he distinguishes this from **punishment**.
  *   **Penalty:** A cost attached to an offense (transferable).
  *   **Punishment:** Hard treatment imposed *because* of guilt (non-transferable).

  Lewis treats this as a philosophical problem because he suspects that the doctrine of penal substitution relies on blurring this line. If it is just a "penalty" (a debt), it is transferable, but then it loses its retributive weight. If it is "punishment" (retribution), it carries the weight, but it becomes unjust to transfer it.

  ### Conclusion
  Your observation that the law recognizes vicarious liability is astute, but it likely confirms Lewis's point rather than refuting it. The law allows vicarious liability precisely in areas where **retributive justice is not the primary goal** (i.e., civil compensation). In areas where retributive justice *is* the goal (criminal law), the law strictly forbids punishing an innocent substitute.

  Lewis treats the transferability of punishment as a puzzle because our legal system actually **agrees with him**: we resolve the issue by *forbidding* penal substitution in criminal law. We allow the transfer of *costs*, but not the transfer of *punishment*. Therefore, the existence of vicarious liability does not show that responsibility for wrongdoing can be legitimately shifted in the retributive sense required by the doctrine of penal substitution.

  **For your seminar:** You might frame your contribution by asking whether Lewis is presupposing a strictly retributive theory of punishment. If one adopts a utilitarian theory of punishment (where the goal is deterrence or rehabilitation, not desert), does the puzzle dissolve? Lewis would likely say "no," because the Christian doctrine itself claims to satisfy *justice* (desert), not just utility. But that tension is where the real philosophical work lies.
