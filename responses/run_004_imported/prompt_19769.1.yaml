      *   *Student:* "...finitary in exactly Hilbert's original sense..." -> *Fact:* Hilbert's finitism is usually interpreted as primitive recursive arithmetic or weaker. $\epsilon_0$-induction is stronger. Gentzen showed consistency *relative* to a principle stronger than PA. Whether that principle is "finitary" is the crux of the philosophical debate, but stating it as fact ("exactly") is incorrect.
