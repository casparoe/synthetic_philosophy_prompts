answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I've had the privilege of being [Groom]'s friend for [Number] years. I work in IT support, which means my job is mostly telling people to turn it off and on again. But [Groom]'s job, historically, has been telling his future self to "handle it later."

  We all know this about him. Affectionately, I hope. We know about the eleven gym memberships that expired unused. We know about the novel that has been "almost finished" since 2014. We know the running joke that [Groom] treats his future self like a different person—a guy who is apparently much more disciplined, organized, and willing to wake up at 6:00 AM than the guy currently holding the credit card.

  In the books I read, there's a name for this. The philosophers call it *akrasia*—knowing what's best for you and freely choosing not to do it. The economists call it *hyperbolic discounting*—which is a fancy way of saying that a reward feels huge when it's right in front of us, but shrinks to nothing if we have to wait for it. From a distance, going to the gym feels like a great idea. But when the alarm goes off in the dark? The cost is immediate, and the reward is months away. So Present-[Groom] makes a promise that Future-[Groom] has no intention of keeping.

  So, when [Groom] asked me to be Best Man, I'll admit I had a technical concern. A wedding vow is, effectively, a promise about the future. It is a commitment to prioritize someone else's well-being over your own convenience, day after day, for decades. Given the history of the gym memberships, why should we trust that this promise won't get discounted the moment the wedding cake is eaten? Why is this different?

  The answer is that today isn't just a promise. It's a specific kind of strategy. The Greeks had a story about Odysseus tying himself to the mast of his ship so he could hear the Sirens' song without steering the ship onto the rocks. He knew his future self would be weak, so his present self removed the option to fail. We call that a Ulysses Pact.

  For years, [Groom] has tried to make Ulysses pacts with himself. But the problem with tying yourself to the mast alone is that… well, you're also the one holding the knife to cut the ropes. When the going gets tough, the person tying the knots and the person cutting them are the same guy. And we know how that movie ends.

  But look at who is standing next to him.

  [Groom] isn't tying himself to the mast today. He and [Bride] are tying the rope to *each other*.

  This is why the math changes. The gym was a solo project with a delayed reward. You suffer now, maybe you look better in six months. That is a high discount rate. But marriage isn't about a reward six months from now. The reward is the partnership itself, starting today. When you love someone, the cost of keeping a promise isn't a burden you carry alone; it's a weight you share.

  [Bride], you are the external commitment device he didn't know he needed. Not because you'll police him, but because being with you makes the "future" feel less like a distant country and more like where we already live. You flatten the curve. You make the immediate choice—the choice to be kind, to be present, to show up—the most valuable one in the room.

  For the few of you here who know the literature, let's just say [Groom] has finally found a way to make his time-inconsistent preferences time-consistent. But for the rest of us, it's simpler than that. He's stopped betting on willpower and started betting on "us."

  [Groom], I've seen you abandon a lot of projects. But I've never seen you abandon a person. And I've never seen anyone look at a person the way you look at [Bride]. The gym memberships were about who you thought you should be. This marriage is about who you actually are, and who you are together.

  So, if everyone could please raise a glass.

  To [Groom] and [Bride]. May your promises be binding, may your discount rate be zero, and may you always find that the best version of the future is the one you build together, starting right now.

  To the happy couple.
