answer: |-
  Friends, family, colleagues, and students.

  Thank you for being here. For those of you who don't know me, Alan and I started our PhDs in the same department in the late eighties. I went into geophysics; he went into atmospheric science. Back then, we were just two grad students arguing over coffee about model parameters and worrying about our qualifying exams. Neither of us imagined that one of us would end up testifying before Congress, or that the other would be standing here, thirty-five years later, trying to summarize a life that became so much larger than just a life.

  We all know why we are here. We are here to mourn Alan the husband, Alan the father, Alan the friend who remembered your birthday and helped you move your couch. But we are also here to mourn Alan the Public Figure. And because this room is filled with people who loved him, and people who worked with him, and people who were publicly eviscerated by him, I think we owe it to Alan's memory to be honest about the whole picture.

  Alan was a man who lived in a state of tension. In his private life, he was generous, warm, and deeply loyal. But in his professional life, he became something else: a watchdog. For the last fifteen years, he made it his mission to hold people accountable for their carbon footprints. He was merciless. He wrote op-eds that burned bridges. He criticized oil executives, senators with heated pools, and yes, even his own graduate students who flew home for Christmas.

  He knew exactly what he was doing. And he knew exactly what people would say about him.

  There is a blog post, written years ago, that calculated Alan's personal carbon footprint. It noted the business class flights to four continents a year. It noted the big, drafty house he refused to downsize. It called him a fraud. Alan read that post. He showed it to me once, actually, with a wry smile. He knew that in the eyes of many, he lacked the "standing" to criticize others. In moral philosophy, there is a debate about whether being a hypocrite disqualifies you from telling the truth. The argument goes: if you do the thing you say is wrong, you lose the authority to say it's wrong.

  Alan disagreed. He believed that the urgency of the crisis was so great that we could not afford to wait for perfect messengers. He used to say, "Someone has to say the unfashionable true thing, even if the messenger is imperfect."

  He wagered his reputation on that idea. He accepted that he would be called a hypocrite if it meant the data got heard. He absorbed the vitriol so that the science wouldn't be dismissed as merely ideological. Was he contradictory? Yes. Did he struggle with that contradiction? I believe he did. But he decided that the cost of his own reputation was a price he was willing to pay to keep the pressure on.

  To his colleagues in the science community, some of whom felt the sting of his public criticism: I know that his methods were sometimes difficult. I know that the disconnect between his words and his travel schedule was frustrating. But I ask you to consider that his willingness to be the target might have been part of his service. He didn't ask for exemption. He stood in the line of fire he helped aim.

  And to his family: Do not let the public controversy obscure the man you knew. The sternness you saw on television was not the man who sat at your dinner table. The fact that he was complicated in public does not negate that he was good in private. A man can be flawed in his habits and still be right about the world. A man can fail to meet his own standards and still be worthy of love.

  So, how do we honor him?

  We do not honor him by pretending he was perfect. He would have hated that. He valued truth over comfort.
  We do not honor him by dismissing his work because of his flaws. That is the easy way out, and Alan never took the easy way out.

  We honor him by accepting the burden he carried. We acknowledge that we are all, in some way, imperfect messengers. We all participate in the systems we criticize. We all fly, we all drive, we all consume. If we wait until our lives are spotless before we speak up for what is right, we will never speak.

  Alan's life asks a hard question of us: Can we separate the message from the messenger? Can we accept criticism from someone who is struggling with the same problems we are?

  He believed we could. He believed the truth was sturdy enough to survive the flaws of the person speaking it.

  Alan, you were a good friend. You were a brilliant scientist. And you were a complicated man. You took the heat so the rest of us could see the fire. We will miss you. And we will try, in our own imperfect ways, to keep telling the truth.

  Rest now.
