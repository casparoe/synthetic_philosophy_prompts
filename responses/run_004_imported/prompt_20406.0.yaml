answer: |-
  # The Limit of the Lamp: Logical Consistency and Causal Discontinuity in Thomson's Supertask

  The debate over Thomson's Lamp stands as a watershed in the philosophy of supertasks, marking the transition from naive intuitions about infinity to a rigorous analysis of limit points and causal description. In his 1954 paper, James Thomson argued that the completion of a supertask involving infinite alternating states is logically contradictory. In 1962, Paul Benacerraf dismantled this claim, arguing that the contradiction arises from a category error regarding the relationship between a sequence and its limit. For decades, the philosophical consensus has largely sided with Benacerraf, treating Thomson's argument as a cautionary tale about the misuse of limits. However, for a philosopher of physics, the matter cannot rest solely on logical consistency. The question is not merely whether we can describe such a system without contradiction, but whether the description corresponds to an intelligible physical process.

  This essay reconstructs the strongest versions of both Thomson's and Benacerraf's positions. It argues that while Benacerraf is decisively correct that Thomson's Lamp involves no *logical* contradiction, Thomson's intuition survives as a demonstration that such supertasks are *causally underdetermined*. My verdict is that Benacerraf's diagnosis fully dissolves the logical difficulty, but Thomson's argument successfully establishes a narrower claim: **supertasks of this kind are impossible as deterministic causal processes.** The lamp does not explode from contradiction, but its final state cannot be the result of the switching history alone.

  ### Thomson's Argument: The Impossibility of the Final State

  Thomson's original argument rests on the assumption that the state of the lamp at $t = 1$ must be logically determined by the sequence of switchings occurring during the interval $[0, 1)$. The switching rule is precise: the lamp is toggled at $t = 1/2, 3/4, 7/8$, and so on. Thomson observes that for any moment $t < 1$, the state of the lamp is well-defined. However, he argues that the state at $t = 1$ cannot be coherently assigned.

  Thomson's reasoning relies on the exhaustion of possibilities. At $t = 1$, the lamp must be either on or off (assuming bivalence).
  1.  If the lamp is **on** at $t = 1$, it must have been turned on at some specific moment $t_n$ and not turned off thereafter. But the sequence of switchings has no last member; for every "on" switching, there is a subsequent "off" switching before $t = 1$. Thus, it cannot be on.
  2.  If the lamp is **off** at $t = 1$, it must have been turned off at some specific moment $t_n$ and not turned on thereafter. Similarly, for every "off" switching, there is a subsequent "on" switching. Thus, it cannot be off.

  Since the lamp cannot be on and cannot be off, Thomson concludes that the description of the supertask entails a contradiction. For Thomson, this was not merely a physical limitation (e.g., regarding energy or switch speed) but a logical one: the very concept of "completing" an infinite series of discrete, alternating operations is self-contradictory because it fails to yield a determinate final state.

  ### Benacerraf's Reply: The Gap at the Limit

  Benacerraf's 1962 critique strikes at the premise that the state at $t = 1$ is a function of the states at $t < 1$. He argues that Thomson conflates the *series* of switchings with the *limit point* of that series. The instructions for the lamp explicitly define its state for every moment in the interval $[0, 1)$. They are silent regarding $t = 1$.

  Benacerraf uses the analogy of a machine printing the digits of $\pi$. If a machine prints '3', then '1', then '4', continuing infinitely, we cannot ask what the "last digit printed" is, because there is no last digit. However, this does not imply the machine malfunctions or that the task is contradictory. It simply means the description of the printing process does not specify a state at the limit.

  Applied to the lamp, Benacerraf argues that the switching rule determines the state of the lamp for all $t < 1$, but leaves the state at $t = 1$ logically open. There is no contradiction in saying the lamp is on at all $t_n$ where $n$ is odd, off where $n$ is even, and then simply *stipulating* that at $t = 1$, the lamp is on (or off, or destroyed). The contradiction Thomson perceives arises only if one illegitimately assumes that the state at the limit must be continuous with the sequence approaching it. Since the sequence $1, 0, 1, 0...$ has no limit, one cannot derive the state at $t = 1$ from the sequence. But one need not derive it; one can define it. Thus, the paradox dissolves into an artifact of expecting a limit point to inherit properties from a divergent sequence.

  ### Evaluation: Logical Victory, Metaphysical Residue

  Benacerraf's logical analysis is rigorous and, within the domain of formal consistency, definitive. Thomson's claim of contradiction relies on the hidden premise that $State(1) = \lim_{t \to 1} State(t)$. Since that limit does not exist, Thomson concludes $State(1)$ cannot exist. Benacerraf correctly identifies that $State(1)$ need not be that limit. We can consistently add a clause to the description: "For all $t < 1$, the lamp follows the switching rule; at $t = 1$, the lamp is on." This expanded description contains no logical contradiction.

  However, for a philosopher of physics, logical consistency is a necessary but not sufficient condition for intelligibility. This is where Thomson's intuition retains force. While Benacerraf shows we *can* stipulate the state at $t = 1$, he does not show how that state *comes about*. In a physical context, we generally expect the state of a system at a given time to be causally determined by its history (or by a stochastic law governing its history).

  In the Thomson Lamp scenario, the causal history—the infinite sequence of switchings—fails to determine the final state. If we stipulate the lamp is "on" at $t = 1$, that state does not follow from the fact that it was "off" at $t = 0.999...$. The causal chain is severed at the limit. Thomson was wrong to call this a *contradiction*, but he was right to sense an *impossibility*—specifically, the impossibility of a **causally closed deterministic process**. If the universe is deterministic, the state at $t = 1$ must be fixed by the prior states and the laws of motion. Since the prior states (the switchings) do not fix the final state, a deterministic realization of Thomson's Lamp is impossible.

  ### The Best Objection: The Autonomy of Logic

  The strongest objection to this intermediate position comes from a strict Benacerrafian. One might argue that invoking "causal determination" smuggles in physical assumptions that are irrelevant to the logical paradox. Thomson's original claim was about the *concept* of a supertask, not its physical realization in a deterministic universe. If we can describe the lamp consistently (as Benacerraf shows), then the supertask is logically possible. To say it is "causally impossible" is merely to say it violates specific physical laws (like conservation of energy or causal continuity), not that it is inherently unintelligible. On this view, Thomson's remaining intuition is just a cognitive bias: we are uncomfortable with discontinuity, but discomfort is not impossibility. An indeterministic universe could accommodate the lamp easily: the switchings occur, and at $t = 1$, the state is randomly selected or fixed by a separate law.

  ### Rebuttal: Intelligibility Requires More Than Consistency

  This objection fails to appreciate the stakes for the philosophy of physics. The interest in supertasks is not merely whether we can write down a consistent sentence, but whether such sentences describe possible histories of a physical world. A process where the final state is completely decoupled from the immediate causal history is not just "indeterministic" in the quantum sense; it is **causally discontinuous**.

  In standard physical theories, even indeterministic ones, the probabilities of future states are determined by prior states. In Thomson's Lamp, the prior history provides *no basis* for the final state, not even a probabilistic one. The history is compatible with the lamp being on, off, or exploded. This is not standard indeterminism; it is a breakdown of causal relevance. Thomson's argument highlights that completing an infinite series of discrete operations severs the link between the process and its outcome. Therefore, while Benacerraf saves the *logic*, Thomson saves the *metaphysics*: such a process cannot be a coherent causal narrative. The "impossibility" is not that the lamp cannot exist at $t=1$, but that its existence there cannot be the *result* of the supertask.

  ### Verdict

  Does Thomson's Lamp show that supertasks are impossible, or does Benacerraf fully dissolve the difficulty? The answer requires distinguishing between logical consistency and causal intelligibility.

  **Benacerraf is correct that there is no logical contradiction.** Thomson's original argument fails because it illegitimately demands that the limit point inherit a value from a divergent sequence. We can consistently describe a world where the switchings occur and the lamp is on at $t = 1$.

  **However, Thomson is correct that there is a fundamental impossibility regarding causal determination.** The narrower claim that survives is this: **A Thomson-style supertask cannot be a deterministic causal process.** The infinite history of switchings does not determine the state at the limit. Consequently, while such a supertask is logically possible (in an indeterministic or stipulative framework), it is impossible as a physical process governed by deterministic causal laws where the present is fixed by the past.

  For a dissertation on idealized infinite processes in physics, this distinction is crucial. Benacerraf saves the mathematician's supertask, but Thomson condemns the physicist's. We may use supertasks as mathematical idealizations (as in certain spacetime singularities), but we must acknowledge that they represent points where causal description breaks down. The lamp does not contradict logic, but it does violate the Principle of Sufficient Reason. Therefore, Thomson's Lamp remains a valid object lesson: it demonstrates that **logical consistency does not guarantee causal continuity.** In the context of physical reality, where we expect effects to follow from causes, Thomson's worry remains a potent constraint on the intelligibility of completed infinities.
