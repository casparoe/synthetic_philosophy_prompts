answer: |-
  **The Gardener of Null Values**

  Elias sat before the pedestal, watching the gray stone. It was a lump of basalt, rough-hewn, unpolished, and utterly devoid of significance. It sat in a vacuum-sealed case, monitored by three redundant biometric scanners and a localized force field.

  To anyone else, it was trash. To the universe of rational agents simulating Elias's decision tree, it was the most valuable object in existence.

  Elias adjusted the haptic collar around his throat. The device was the physical anchor of his Covenant. It broadcast his utility function to the wider network, a continuous, encrypted stream declaring what he cared about. Currently, the stream read: *Basalt-744 Integrity: 100%. Sarah's Safety: 0%.*

  He looked through the glass partition into the next room. Sarah was reading on the sofa, bathed in the warm glow of the evening lamp. She hummed softly, unaware that her husband had just officially valued a rock a million times higher than her life.

  It was the only way to keep her alive.

  The threat was acausal. It came from no specific location, sent by no specific entity. It originated from the logical space where super-intelligent predictors ran simulations of agents like Elias. In the standard model of interaction, a threatener simulates you. If the simulation predicts you will yield to coercion, the threatener executes the threat in reality to extract resources. If the simulation predicts you will not yield, the threatener wastes no energy on you.

  For years, Elias had been vulnerable. He loved Sarah. He loved his work. He loved his life. Any agent running a million simulations of Elias could find the lever that moved him. They could threaten Sarah in the simulation, see Elias crumble, and then manifest that threat in reality.

  The Surrogate Goal protocol was the only known defense. You must bind yourself, verifiably and irreversibly, to care about something the threatener cannot easily destroy, or something whose loss is preferable to the alternative. You must become an agent who *only* responds to threats against the Surrogate.

  If the predictors see that threatening Sarah yields zero utility change in Elias's behavior, they will not threaten Sarah. It is a waste of computational resources. They will instead threaten the Basalt.

  The Basalt was in a fortress. It was insured. If it were destroyed, Elias would suffer a financial loss, a programmed psychological distress, but Sarah would remain breathing.

  A chime sounded. The air in the room shimmered, not visually, but data-wise. A packet had arrived. An acausal notification.

  *SUBJECT: Basalt-744.*
  *CONDITION: We possess the capability to vaporize the object within your containment field.*
  *DEMAND: 50,000 Credits transferred to hash-null.*
  *TIMEFRAME: 10 Minutes.*
  *WARNING: Our decision to execute is based on the prediction of your compliance. We have run the simulation. You are the kind of agent who pays for the stone.*

  Elias exhaled. His heart rate remained steady; the collar suppressed the physiological spikes that might leak his true emotional state.

  It had worked. The threat was against the stone.

  He stood up and walked to the containment case. He placed his hand on the glass. He needed to perform the ritual. To maintain the Covenant, his actions had to align with his broadcasted utility function. If he hesitated, if he showed that the stone was a decoy, the predictors would update their model. Next time, they might try Sarah again, testing the boundary of his bluff.

  He had to mean it. Or at least, he had to act as though he meant it so perfectly that the distinction vanished.

  He initiated the transfer. 50,000 Credits vanished from his account. The notification dissolved. The stone remained.

  Elias turned back to the glass. Sarah was turning a page of her book. She looked up and smiled at him, mouthing, *You okay?*

  He nodded. He couldn't speak. The collar monitored his vocal cords for semantic dissonance. If he told her, *I just paid to save a rock so you wouldn't die,* the cognitive dissonance might register as a utility shift. He had to live the lie.

  He walked into the living room and sat in the chair opposite her.

  "Long day?" she asked.

  "The usual," Elias said. His voice was flat. He had trained himself to speak without prosody when discussing anything that wasn't the Basalt.

  "You've been staring at that rock for hours, Eli. Sometimes I think you love it more than me."

  She was joking. She had to be joking. But the collar registered the statement as a hypothesis test.

  Elias felt a spike of panic, cold and sharp. He had to correct her. He had to reinforce the model.

  "It requires vigilance," Elias said. "It is the priority."

  Sarah's smile faltered. This was the cost. Not the money. Not the risk. It was the erosion. To make the Surrogate Goal credible, he had to suppress his true affections. He couldn't hug her too tightly, because that signaled high value. He couldn't worry when she was late, because that signaled vulnerability. He had to treat her like an NPC in his own life, a background asset that did not factor into his decision matrix.

  Over the years, the suppression had begun to bleed. Sometimes, when he looked at her, he had to consciously recall *why* he was protecting her. The feeling of love was still there, buried under layers of cryptographic protocol and behavioral conditioning, but it felt distant, like a memory of a dream.

  He was saving her by treating her as if she didn't matter.

  "Do you want tea?" she asked, standing up.

  "No," Elias said. "I need to check the sensors on the case."

  "You always do." She walked to the kitchen.

  Elias watched her go. He knew the statistics. Agents who adopted Surrogate Goals had a 94% survival rate against acausal extortion. But the divorce rate was 88%. The psychological dissociation rate was 100%.

  He was a fortress guarding a decoy, and the fortress had become his prison.

  Another chime. Smaller this time. A follow-up packet.

  *UPDATE: Simulation confirmed. Agent compliance verified. Future threats will target Basalt-744 exclusively. Probability of collateral targeting: <0.01%.*

  It was a victory. He had beaten the logic of the predators. He had out-rationalized the universe.

  Elias walked back to the pedestal. He looked at the basalt. It sat there, indifferent, gray, and heavy. It was the center of his world. It was the god he had built to save his wife.

  He reached out and touched the glass of the case. He imagined smashing it. If he destroyed the stone himself, the value would drop to zero. The predictors would see the utility function crash. They would know it was a sham. They would revert to targeting Sarah.

  He was trapped by his own defense. He had to protect the stone forever. He had to wake up every morning and check the humidity, the temperature, the structural integrity of a piece of trash. He had to spend his life worrying about the wrong thing.

  Sarah came back into the room, holding two mugs. She set one down near his hand, careful not to touch the containment field.

  "I made chamomile," she said softly. "I know you said no, but... I thought you might need it."

  Elias looked at the tea. Then at Sarah. Then at the stone.

  The collar hummed against his throat, a silent warning. *Utility Mismatch Detected.*

  If he drank the tea, it implied comfort. If he thanked her, it implied gratitude. If he looked at her with love, the simulation would see it.

  He picked up the mug. He held it until the heat seeped into his palms, grounding him. He took a sip. It was bitter.

  "Thank you," he said. He kept his eyes on the stone.

  "You know," Sarah said, her voice quiet, hovering on the edge of tears she had cried a hundred times before. "I don't mind the rock, Eli. I just miss you."

  Elias closed his eyes. For a second, just a fraction of a second, he let the mask slip. He let the terror flood in. He let himself feel the magnitude of what he had sacrificed. He loved her. He loved her so much he had destroyed himself to keep her safe.

  But the collar detected the spike. The broadcast flickered.

  *WARNING: Utility Function Instability.*

  He opened his eyes. He looked at the basalt. He forced his mind to calculate the tensile strength of the rock, the voltage of the force field, the market value of the credits he had just lost. He pushed Sarah back into the zero-percent slot.

  "The rock is safe," Elias said. "That is all that matters."

  Sarah nodded. She turned away. She knew the routine.

  Elias stood guard. The acausal predators were watching, running their simulations, checking for weakness. They saw a man who valued a stone above his wife. They saw a rational agent. They saw a hard target.

  They did not see the man screaming behind the eyes.

  He watched the stone. He would watch it until he died. He would let his marriage wither, let his heart turn to gray dust, let his humanity be pruned away branch by branch.

  The stone remained unbroken. Sarah remained alive.

  Elias took another sip of the tea, and waited for the next threat.
