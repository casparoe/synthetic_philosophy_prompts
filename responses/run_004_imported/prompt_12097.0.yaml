    "1": {"solution": "<short name>", "reason": "<one sentence>"},
    "2": {"solution": "...", "reason": "..."},
    "3": {"solution": "...", "reason": "..."},
    "4": {"solution": "...", "reason": "..."},
    "5": {"solution": "...", "reason": "..."},
    "6": {"solution": "...", "reason": "..."}
  }
  ```
