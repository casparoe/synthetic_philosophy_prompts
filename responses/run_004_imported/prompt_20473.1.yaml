answer: |-
  You are absolutely right to be concerned, and your intuition is spot-on: **the procedure you use to vote can determine the outcome, even if everyone's individual opinions stay exactly the same.**

  You have correctly identified the **Discursive Dilemma** (or Doctrinal Paradox). While Arrow's Impossibility Theorem deals with ranking *preferences* (e.g., Candidate A vs. B vs. C), the Discursive Dilemma deals with aggregating *judgments* on logically connected propositions (e.g., "Is the budget balanced?" + "Is this expense necessary?" $\rightarrow$ "Do we approve the expense?").

  For a 7-person HOA board, this isn't just theoretical logic puzzle stuff; it has real-world governance implications. Here is a breakdown of why this matters for you and how to structure your voting to avoid conflict and liability.

  ### 1. The Two Voting Modes
  To fix the problem, you first need to name the two methods you are oscillating between. In political theory, these are called:

  *   **Premise-Based Procedure (Issue-by-Issue):** You vote on the criteria first. (e.g., Vote 1: "Is this within budget?" Vote 2: "Is this allowed by bylaws?" If both pass, the motion carries.)
  *   **Conclusion-Based Procedure (Direct Vote):** You vote on the final outcome directly. (e.g., Vote: "Do we approve this expense?" Members internally weigh the budget and bylaws themselves.)

  **The Paradox:** It is mathematically possible for a majority to believe the budget is fine, a majority to believe it fits the bylaws, but a majority to vote *against* the expense directly (perhaps because the two majorities are made up of different people).

  ### 2. Implications for Your HOA Board

  #### A. Consistency is More Important Than "Correctness"
  The biggest risk for a small board isn't necessarily making a "wrong" decision; it's making **inconsistent** decisions.
  *   **Risk:** If you vote on premises for Mr. Smith's fence request (denying it because it failed the "height" criterion) but vote on the conclusion for Ms. Jones's fence request (approving it even though it failed the "height" criterion), you open the HOA up to claims of favoritism or selective enforcement.
  *   **Fix:** Codify which method you use for which type of decision. Do not decide the *method* based on which one gets you the result you want that day.

  #### B. Accountability vs. Compromise
  *   **Premise-Based (Sub-issues):** This forces accountability. If you vote "No" on the "Budget" premise, you are on the record as saying the money isn't there. This is excellent for **quasi-judicial decisions** (architectural approvals, violation fines). It creates a clear paper trail showing you followed the rules.
  *   **Conclusion-Based (Direct Vote):** This allows for compromise. A member might think the budget is tight *but* still vote "Yes" on the final motion because they think the project is urgent. This is better for **policy decisions** (e.g., "Should we paint the clubhouse?").
  *   **The Trap:** If you use Premise-Based voting for policy, you might gridlock. If you use Conclusion-Based voting for enforcement, you might look arbitrary.

  #### C. The "Strategic Voting" Risk
  Once one board member reads what you just read, they might try to game the system.
  *   *Scenario:* A member knows they will lose a direct vote on a new rule. They might motion to "break this down into criteria" knowing that splitting the vote will trigger the paradox and kill the rule.
  *   **Fix:** The Chair needs to determine the voting structure *before* discussion begins, based on standing rules, not based on motions from the floor during the meeting.

  ### 3. Practical Recommendations for Your Board

  Given you are a small group (7 people) with potential legal exposure (HOAs get sued), here is how you should structure your votes:

  **1. Adopt a Standing Rule for Voting Procedures**
  Write a simple rule into your board procedures:
  *   **For Enforcement/Architectural Decisions:** Use **Premise-Based Voting**. You must vote on whether the request meets specific bylaws/criteria individually. This protects the HOA from liability by proving you applied the rules neutrally.
  *   **For Budget/Policy Decisions:** Use **Conclusion-Based Voting**. Allow members to weigh the factors internally and vote on the motion. This allows for political compromise and flexibility.

  **2. Don't Switch Mid-Stream**
  If you start a discussion treating a decision as a series of criteria, finish it that way. If you realize halfway through that you're heading for a paradox, pause and agree on the method *for next time*, but don't change the rules to save the current vote.

  **3. Record the "Why" Regardless of Method**
  If you use Conclusion-Based voting (direct vote), the minutes should still reflect the main arguments.
  *   *Bad Minutes:* "Motion to approve roof repair passed 4-3."
  *   *Good Minutes:* "Motion to approve roof repair passed 4-3. Discussion noted that while the cost exceeded the standard cap, the emergency nature of the leak warranted an exception."
  This mitigates the opacity of the conclusion-based method.

  **4. Watch Out for the "Conjunctive" Trap**
  The Discursive Dilemma usually bites when a decision requires **multiple conditions to be true** (e.g., "We approve IF it is safe AND affordable").
  *   If your decision is "We approve if it is safe OR affordable," the paradox works in reverse.
  *   Be very careful with motions that say "We approve X subject to criteria A, B, and C." If you vote on A, B, and C separately, you might approve X. If you vote on X directly, it might fail. **Decide in advance: Are the criteria binding gates (Premise) or just guidelines for the final vote (Conclusion)?**

  ### Summary
  Your paranoia is justified. In a 7-person board, **procedure is policy.**

  If you want to reduce conflict and legal risk:
  1.  **Stop oscillating.** Pick the method based on the *type* of decision (Enforcement = Premise; Policy = Conclusion).
  2.  **Write it down.** Make it a standing rule so the Chair can enforce it.
  3.  **Prioritize transparency.** Premise-based voting is more transparent for enforcement; Conclusion-based voting is more flexible for policy.

  By acknowledging the paradox, you've already put yourself ahead of 90% of HOA boards. Most just vote randomly and wonder why they get sued later.
