      *   **Slote's Satisficing Consequentialism:**
          *   *Core Idea:* An act is right if it produces "good enough" consequences, not necessarily the *best* consequences.
          *   *Structure:* It keeps the consequentialist framework (consequences determine rightness) but changes the *maximizing* condition to a *satisficing* condition.
          *   *Mechanism:* There is a threshold. Above the threshold, acts are permissible. Below, they are wrong.
          *   *Relationship to Consequentialism:* It claims to be a *version* of consequentialism (hence "Satisficing Consequentialism"), though critics say it abandons the core maximizing drive.
