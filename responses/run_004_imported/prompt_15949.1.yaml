      *Refining the "Basic Objection":* One potential issue is that for Berkeley, ideas are *passive*. Money is an *instrument*. Ideas are perceived; Money is used. The parallel works on "substance," but maybe fails on "agency." I should mention this.

  8.  **Final Polish:** Ensure the distinction between "ideas" (metaphysics) and "words/counters" (language/economics) is clear. In *Principles*, ideas are the *objects*. In *Alciphron/Querist*, words/counters are *signs*. This is a crucial semiotic shift. Berkeley moves from a metaphysics of ideas to a semiotics of signs. The blog post hints at this but could sharpen it.

