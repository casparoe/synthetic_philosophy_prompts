      *   *Deeper Objection:* The deeper objection might be about *normativity*. In metaphysics, we *must* accept God's order. In economics, the system *ought* to serve the public good. If the bank fails, the money becomes worthless, but the *industry* (the real wealth) remains. In metaphysics, if God stops perceiving, the object ceases to be. The ontological stakes are different.
