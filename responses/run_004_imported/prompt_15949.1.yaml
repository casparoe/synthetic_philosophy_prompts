      *(Self-Correction during drafting)*: I need to be careful not to say "You are wrong." Instead, "Scholars debate this," or "Here is a nuance." Regarding *Alciphron*, I am fairly confident he uses the money analogy there. It's a famous passage in philosophy of language circles.
      *Check:* *Alciphron*, Dialogue IV, Section 14. "Words... may be significant... though they do not stand for ideas... Thus in algebra... thus also in money." Yes.
      *Check:* *Querist*. Query 31: "Whether the wealth of a nation be not the productive industry of its people?" Query 53: "Whether money be not only useful as it stirs up industry?"
