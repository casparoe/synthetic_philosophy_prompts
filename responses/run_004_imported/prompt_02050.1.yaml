      *   *Correction:* In Move 4, I should mention that while consensus is lacking, there *are* viable definitions now (min-sum, average distance, etc.), so "hunch" is too strong.
      *   *Correction:* In the "Missing" section, bring in Structural Realism (Worrall) as it fits the Rutherford/Thomson case perfectly (equations remained similar, ontology changed).

