      *   *Key Concept:* Violation (Lying) vs. Flouting (Sarcasm).
      *   *Deep Dive:*
          *   Lying = Hiding the break. Goal = Deception.
          *   Sarcasm = Highlighting the break. Goal = Implicature.
      *   *The "So What?":* Why does this matter? Trust and Cooperation. Lying breaks the Cooperative Principle; Sarcasm relies on it.
