answer: |-
  It is a profound transition to move from the diagnostics of physical systems to the diagnostics of moral systems. In physics, you deal with laws that hold regardless of human belief; in ethics, you deal with norms that exist only insofar as we sustain them. The unease you feel regarding the "Revisionist" turn (led by philosophers like Jeff McMahan) against the "Traditionalist" view (championed by Michael Walzer) is shared by many. It strikes at the heart of how we institutionalize morality.

  Below is a dialogue staged between two philosophers, **Arthur** (a Traditionalist/Walzerian) and **Elena** (a Revisionist/McMahanite). They are discussing the specific case you requested: **Alexei**, a 19-year-old conscript from an aggressor state (propagandized, threatened with execution for desertion), and **Sarah**, a professional soldier defending her country from invasion.

  ***

  **Setting:** *A quiet study room in a university library. Late afternoon light slants across a table covered in papers.*

  **Arthur:** Let's stick to the case. Alexei crosses the border. He doesn't want to be there, but if he turns back, his own officers shoot him. He's been told since he was six that this invasion is a liberation. He encounters Sarah in a trench. She is defending her home. They exchange fire. Alexei kills Sarah. According to the traditional view—the view I hold—Alexei and Sarah are moral equals. Both are permitted to kill the other. Neither commits a wrong.

  **Elena:** And that is precisely where the traditional view loses its grip on reality. They are legal equals, Arthur. The Geneva Conventions treat them symmetrically. But moral equality? No. Sarah is acting in self-defense. She is justified. Alexei is participating in an unjustified aggression. He is not justified. At best, he is excused. To say they are moral equals is to say that justice and injustice cancel each other out in the fog of war. They don't.

  **Arthur:** They don't cancel out politically, Elena. But morally, regarding the *act* of killing? You have to look at the epistemic position of the agent. Alexei is nineteen. He is under duress. He lacks access to independent news. If you tell me he is morally distinct from Sarah, you are imposing a burden on him he cannot carry. You are asking a conscript to adjudicate the *jus ad bellum* while under fire.

  **Elena:** I am not asking him to adjudicate it successfully. I am saying there is an objective moral fact of the matter. Sarah is defending rights; Alexei is violating them. If Alexei kills Sarah, he contributes to a wrongful harm. That he is coerced or ignorant might mitigate his *blameworthiness*, but it does not change the *wrongfulness* of the act.

  **Arthur:** This is the abstraction that worries me. In your view, what is Alexei supposed to do? If he knows that by fighting he is acting unjustly, even if "excused," the logical imperative is to stop fighting. But if he stops, he is executed by his own commanders. So you leave him with no permissible path. You create a moral trap. The traditional view offers a way out: we grant combatant equality so that soldiers can follow the rules of war without needing to solve the geopolitical puzzle of who started it.

  **Elena:** But that's a pragmatic fiction, not a moral truth. You're arguing that we should teach soldiers a lie because the truth is inconvenient.

  **Arthur:** I'm arguing that the "truth" you're offering is operationally inert. If the laws of war are to regulate conduct, they must be action-guiding. If the rule is "Only fight if your war is just," the result isn't peace; it's chaos. Aggressors will always claim their war is just. Defenders will claim the same. The only stable equilibrium is symmetry: *If you are a uniformed combatant, you are a legitimate target, and you may target uniformed combatants.* Period.

  **Elena:** I agree that the *laws* of war might need symmetry for practical reasons. But we are discussing the *ethics* of killing. McMahan's point is precisely to separate liability from legal status. Let's look at Alexei's liability. Because he is coerced and non-culpably ignorant, he is less liable to be killed than a volunteer mercenary fighting for the same aggressor state. Sarah, if she knows his situation, might have a duty to capture him rather than kill him if possible.

  **Arthur:** "If possible." In a trench? With a rifle? Elena, this distinction collapses under the first burst of gunfire.

  **Elena:** It doesn't have to collapse. It changes the weighting of the decision. But more importantly, it changes how we view the outcome. If Alexei kills Sarah, a wrong has been done to Sarah. If Sarah kills Alexei, she has neutralized a threat, though she must weigh his reduced liability. The traditional view says: "No wrong was done to Sarah because Alexei had a right to kill her." That is intolerable. Sarah had a right not to be invaded, and not to be killed by an invader.

  **Arthur:** But Alexei didn't choose the invasion. He was swept up in it. This is where your distinction between *justified* and *excused* does the heavy lifting, isn't it? You want to say Alexei is *excused* but not *justified*.

  **Elena:** Exactly. To be justified is to act rightly. To be excused is to act wrongly, but without full culpability. Alexei is a wrongful threat. Sarah is a rightful defender. Because Alexei is non-culpable, he retains some right to life—he is not fully liable—but he does not gain a right to kill Sarah.

  **Arthur:** Here is my pushback. If Alexei is not fully liable, but Sarah is fully justified, then Sarah is morally superior in that engagement. But if we institutionalize this, what happens to the norms of surrender? If the aggressor soldiers know they are viewed as "wrongful threats" rather than "moral equals," they know they are essentially criminals in uniform. They will fight to the death. They will not trust that they will be treated as POWs. By insisting on this moral asymmetry, you increase the bloodshed. You sacrifice lives on the altar of moral precision.

  **Elena:** That is a consequentialist argument, Arthur. You are saying we should mask the moral reality to save lives.

  **Arthur:** I am saying that morality *includes* the consequences of our norms. If a moral theory leads to more people dying because it makes the rules of war unworkable, it is a defective moral theory. The "Moral Equality of Combatants" is a convention that allows us to contain violence. It says: "We will not judge your soul for being here; we will only judge how you fight." That allows Alexei to surrender. It allows Sarah to take prisoners.

  **Elena:** But does it? Or does it simply allow commanders to use men like Alexei as cannon fodder without the men feeling the weight of their actions? There is a danger in your view, too. By telling Alexei he is a moral equal to Sarah, you sever the link between his actions and the justice of his cause. You make him a tool. McMahan wants to restore his agency. Even if Alexei is coerced, acknowledging that he is participating in a wrong respects his humanity more than treating him as a force of nature, like a landslide or a flood.

  **Arthur:** It's not about treating him as a force of nature. It's about recognizing the limits of his agency. You speak of agency as if it exists in a vacuum. But Alexei's agency is crushed between the enemy in front of him and the executioner behind him. To say he bears a moral burden—even a reduced one—is to ignore the reality of totalitarian coercion.

  **Elena:** I am not saying he bears the same burden as the general who ordered the invasion. This is the nuance the Traditionalist often misses. McMahan argues that liability comes in degrees. Alexei is *minimally* liable because he poses a threat, even if innocently. Sarah is *not* liable because she poses no wrongful threat. So, Sarah is permitted to kill Alexei to save herself. Alexei is *not* permitted to kill Sarah to save himself, because killing her would be sacrificing an innocent person to save himself from his own commanders.

  **Arthur:** That is the hard case. You are arguing that Alexei ought to let Sarah kill him rather than kill her?

  **Elena:** I am arguing that if the choice is strictly between "Kill an innocent defender" or "Die," morality is tragic. But it is not symmetric. Sarah's killing is justified. Alexei's killing is not. If Alexei chooses to live, he is excused by duress, but he has not acted *rightly*.

  **Arthur:** And there we have the impasse. For me, the fact that Alexei is excused by duress *is* what makes the act permissible in the context of war. We cannot have a morality that demands martyrdom from conscripts to satisfy a metaphysical account of liability. If the cost of your moral truth is that the nineteen-year-old must choose death to remain "morally clean," then the truth is too expensive.

  **Elena:** But if the cost of your moral truth is that Sarah's death is counted as morally equivalent to the death of the man invading her home, then justice is dead. You are prioritizing the regulation of war over the rights of the victim.

  **Arthur:** I am prioritizing the only thing we can actually control. We cannot stop the generals from starting unjust wars. We can only try to stop the soldiers from slaughtering each other without limit. The symmetry of *jus in bello* is a firewall. It keeps the injustice of the war from infecting every single interaction on the battlefield.

  **Elena:** But a firewall that hides the fire doesn't put it out. By insisting on symmetry, you allow the aggressor state to claim moral legitimacy for its soldiers. You let them go home and say, "I did nothing wrong." And perhaps, under your view, they didn't. But Sarah is still dead. And her death was a wrong.

  **Arthur:** Her death was a tragedy. Alexei's death is a tragedy. If we adopt your view, Sarah's death is a murder (by Alexei), and Alexei's death is justice (by Sarah). That might satisfy a philosopher in a study. But in the mud, it just means Alexei fights harder, Sarah hesitates less, and the graveyards get fuller. I will take the convention that lets them both survive as prisoners over the theory that ensures one of them dies "justly."

  **Elena:** And I will take the theory that accurately describes who was wronged, even if it offers no clean exit. Because if we don't name the wrong, we can't repair it. We can't hold the aggressor state accountable if we tell the world their soldiers were just "doing their job" as moral equals.

  **Arthur:** So we disagree on the purpose of the theory. You want it to track the truth of liability. I want it to guide action and minimize harm.

  **Elena:** I want it to track the truth *so that* it can guide action correctly. If we tell soldiers the truth—that they are liable if they fight for an unjust cause—perhaps they will be more hesitant to fight. Perhaps that hesitation saves lives.

  **Arthur:** Or perhaps it just makes them more dangerous.

  *(Silence falls between them. The light fades further.)*

  **Elena:** We aren't going to resolve this today, Arthur.

  **Arthur:** No. You see the individual moral ledger. I see the systemic cost of balancing it. I suppose that is the difference between the physicist and the philosopher. You want the equation to balance. I just want the reactor not to melt down.

  **Elena:** And yet, if the reactor is melting down because someone sabotaged it, doesn't it matter who holds the wrench?

  **Arthur:** Only if we can stop them without blowing us all up.

  ***

  **Commentary on the Impasse**

  As you noted in your prompt, the disagreement often "bottoms out" in a clash of fundamental priorities.

  1.  **The Nature of Moral Theory:** Elena (Revisionist) views moral theory as primarily **truth-tracking**. Its job is to correctly identify who is liable, who is justified, and who is wronged, regardless of whether agents can easily act on that information. Arthur (Traditionalist) views moral theory as primarily **action-guiding**. If a principle cannot be followed by the agents in the situation (due to epistemic limits or coercion), it is not a valid principle for them.
  2.  **The Function of Convention:** For Arthur, the Moral Equality of Combatants is a *convention* that creates a beneficial equilibrium (reducing brutality, facilitating surrender). For Elena, conventions cannot override fundamental rights. Sarah's right to life cannot be waived by a convention that grants Alexei permission to kill her.
  3.  **Liability vs. Blame:** The dialogue highlights McMahan's crucial contribution: Alexei can be **liable** (permissibly killed by Sarah) without being **culpable** (blameworthy). Arthur struggles with this because, in his view, if Alexei isn't blameworthy, he shouldn't be a legitimate target in a way that differs from Sarah. Elena insists that one can be an "innocent threat" (like someone thrown off a cliff at you) whom you may kill to save yourself, even if they bear no blame.

  For a physicist, the analogy might be this: The Traditionalist treats the rules of war like **thermodynamics**—macroscopic laws that hold regardless of the microscopic state of the particles, necessary for the system to function. The Revisionist treats them like **quantum mechanics**—insisting that the underlying state of the individual particle (the soldier's moral liability) determines the outcome, even if the macroscopic view looks messy. Both describe the same reality, but at different scales, and they do not easily map onto one another.
