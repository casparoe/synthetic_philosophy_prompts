      *   *Is there a structural analogue?* Yes. This is "semantic drift" or "telephone game" degradation. If $TA_0$ trusts $TA_1$ because $TA_1$ mimics $TA_0$, and $TA_1$ trusts $TA_2$ because $TA_2$ mimics $TA_1$, does trust degrade?
