      *   *Löb's Obstacle:* In formal systems (like PA), a system cannot prove the soundness of a system equally powerful as itself. If $T \vdash \text{Sound}(T')$, and $T'$ is as strong as $T$, this leads to inconsistency (via Löb's Theorem). To avoid this, each successor usually needs to be strictly weaker (in terms of proof strength) or trust must be grounded differently.
      *   *TA Chain:* The user ($TA_0$) trains $TA_1$, who trains $TA_2$, etc. The "proof system" is the grading rubric + logical intuition.
