prompt: |-
  So me and my friend got into it last night about Bentham -- yes, THE Jeremy Bentham, felicific calculus and panopticon guy. She'd read that he wrote a whole manuscript defending gay sex and other 'irregularities of the venereal appetite' (or however he actually phrased it) on pure hedonistic grounds back in the 1780s, way before it was safe to say that kind of thing out loud. Thing is, he never published it in his lifetime, even though men could still be and were hanged in England for exactly what he privately thought was harmless. She says that makes him a coward who let people die for a cause he knew was just. I said publishing probably would've ruined him and helped no one, and that his own principles would've told him to stay quiet and stay useful instead. We went back and forth for ages and got nowhere. Write an essay that actually weighs both sides and then commits to an answer -- judged by Bentham's own utilitarian standards, was his silence the right call or a betrayal of them? Don't wimp out with 'its complicated,' pick a side and argue it.
