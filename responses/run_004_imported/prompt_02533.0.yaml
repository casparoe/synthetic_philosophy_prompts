answer: |-
  You have independently rediscovered one of the most famous headaches in the philosophy of science. You are absolutely right about the math: if $P(e) = 1$, then $P(h|e) = P(h)$. In strict Bayesian updating, old evidence is mathematically inert.

  You are also right that your proposed solution is a known position in the literature (often called the **Counterfactual Historical Account**, associated with philosophers like Paul Horwich). It feels intuitive because it captures the *explanatory power* of the theory.

  However, since you asked me to poke holes in it rather than validate it, I am going to tell you why most formal epistemologists consider your fix (and the counterfactual approach generally) to be unstable. Then I will offer you the solution that is currently considered more robust (Garber's Solution).

  ### The Strongest Objection: The "Erasure Problem"

  Your solution hinges on this phrase: *"if I hadn't already known e."*

  The hole in your raft is that there is no unique, non-arbitrary way to subtract $e$ from your knowledge base. Knowledge isn't a stack of independent cards you can just remove one from; it's a web.

  To calculate the confirmation, you need to construct a counterfactual agent who knows $h$ (General Relativity) but does not know $e$ (Mercury's perihelion drift).
  1.  **If you erase too little:** If the agent knows all the background astronomy that *led* to the discovery of the drift, they might still assign $P(e) \approx 1$ simply based on the reliability of the telescopes and prior calculations, even if they don't know the specific result. In this case, $P(e)$ is still too high, and $h$ gets no boost.
  2.  **If you erase too much:** To get $P(e)$ down low enough to make the confirmation significant, you have to erase the background knowledge that makes $e$ intelligible. But if you erase the background astronomy, the agent likely cannot understand $h$ either, because $h$ is formulated using concepts (tensors, spacetime curvature) that rely on that same background.
  3.  **The "Gerrymandering" Risk:** As you suspected, this allows you to manipulate the result. If I want to prove $h$ is amazing, I construct a counterfactual agent who thinks $e$ is wildly improbable. If I want to prove $h$ is trivial, I construct an agent who thinks $e$ was likely anyway. Without a strict rule for *how* to remove $e$, the confirmation value becomes subjective.

  **The Verdict:** Your fix works intuitively, but it fails formally because it lacks a principled way to define the "prior state" of the counterfactual agent. It solves the math by outsourcing the difficulty to an undefined hypothetical scenario.

  ### A Second Objection: Logical Omniscience

  Standard Bayesianism assumes **logical omniscience**. This means if an agent knows theory $h$, and $h$ logically entails $e$, the agent *must* assign probability 1 to $e$.

  In your counterfactual, you are asking us to imagine a scientist who knows Einstein's equations ($h$) but doesn't know they entail the Mercury drift ($e$). In standard Bayesian logic, this agent is **impossible**. You are asking for a probability distribution over logical possibilities that violates the rules of logic.

  To make your counterfactual work, you have to abandon standard Bayesianism and adopt a framework that allows for "non-omniscient" agents (agents who don't know all the logical consequences of their beliefs). Once you do that, you open a can of worms regarding how to model logical uncertainty, which is notoriously difficult.

  ### The Better Patch: Garber's Solution

  There is a solution that is generally preferred in formal epistemology because it doesn't require imaginary agents or erasing history. It was proposed by Daniel Garber in 1983.

  **The Shift:** We stop trying to update on the evidence $e$. We update on the **logical relationship** between the theory and the evidence.

  Here is how it works for Einstein:
  1.  **Before 1915:** Scientists knew $e$ (Mercury drifts). They had a credence in $h$ (GR). Crucially, they did *not* know that $h$ entailed $e$. Let's represent the proposition "h entails e" as $h \rightarrow e$.
  2.  **The Event:** Einstein does the math. He does not discover $e$ (we knew that). He discovers that $h \rightarrow e$.
  3.  **The Update:** We update our credence in $h$ based on learning the *implication*, not the *evidence*.

  Mathematically, it looks like this:
  $$P(h | h \rightarrow e) > P(h)$$

  Even if $P(e) = 1$, learning that your theory *predicts* the known fact is new information. It rules out versions of $h$ that were compatible with not-$e$. It shows that $h$ is "tightly constrained."

  **Why this is better than your counterfactual:**
  1.  **No Erasure:** We don't have to pretend we don't know $e$. We acknowledge $P(e)=1$.
  2.  **Real Agents:** It models actual human cognition. Humans are not logically omniscient. We often know a theory and know the data, but we don't know if they fit until we do the work. Learning the fit is a genuine cognitive event.
  3.  **Objective:** We aren't guessing what a hypothetical ignorant person would think. We are updating on the actual discovery of the mathematical derivation.

  ### The Alternative Framework: Likelihoodism

  If you want to step outside Bayesian updating entirely, there is **Likelihoodism**.

  Likelihoodists argue that confirmation isn't about how much your *belief* changes ($P(h|e)$ vs $P(h)$), but about how well the hypothesis *predicts* the data compared to rivals.

  The measure is the Likelihood Ratio:
  $$\frac{P(e|h)}{P(e|h')}$$

  Where $h'$ is a rival theory (e.g., Newtonian Gravity).
  *   For General Relativity ($h$): $P(e|h) = 1$ (It predicts the drift exactly).
  *   For Newtonian Gravity ($h'$): $P(e|h') \approx 0$ (It predicts 0 drift, or requires ad-hoc fixes).

  In this framework, it does not matter that $P(e) = 1$. The evidence $e$ favors $h$ over $h'$ massively, regardless of when $e$ was discovered. This bypasses the Old Evidence problem entirely by changing the definition of "confirmation" from "belief update" to "discriminatory power."

  ### Summary

  You were right to be suspicious of your own fix.
  1.  **Your Fix (Counterfactual):** Intuitively strong, but formally weak. It relies on an ill-defined "erasure" of knowledge and requires violating logical omniscience without a clear framework for doing so.
  2.  **The Strongest Objection:** The "Erasure Problem." There is no non-arbitrary way to construct the counterfactual prior.
  3.  **The Better Patch:** **Garber's Solution.** Update on the discovery of the entailment ($h \rightarrow e$), not the evidence ($e$). This respects the fact that $P(e)=1$ while acknowledging that learning the *connection* is new information.
  4.  **The Nuclear Option:** Switch to **Likelihoodism**, where old evidence can discriminate between theories even if it doesn't update absolute credence.

  Your intuition that "deriving old evidence counts as new work" was correct. You just located the "newness" in the wrong place (the agent's ignorance of $e$) rather than the right place (the agent's ignorance of the link between $h$ and $e$).
