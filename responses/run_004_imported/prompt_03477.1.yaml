answer: |-
  This is an exceptionally sharp reading of the tension in *De la justice et de la raison des effets*. You have correctly identified the crux of Pascal's political skepticism: the necessity of a "mystical foundation of authority" (to borrow the Montaignean phrase Pascal inherits) versus the moral desire for genuine justice.

  To answer your question directly: Pascal would almost certainly judge institutions like the International Criminal Court (ICC) or UN commissions of inquiry not as a progressive step toward uniting justice and might, but as a dangerous instantiation of the very divorce he seeks to conceal. He would view them as politically naive mechanisms that expose the "usurpation" of law without possessing the force to remedy it, thereby triggering the sedition he warns against in Fragment 326.

  Here is the defense of that position, structured around the specific tensions you noted.

  ### 1. The Spectacle of Helpless Justice (Fragment 298)
  Pascal's famous formulation in Fragment 298 (Lafuma 97) is often read as a cynical capitulation to power, but it is better read as a tragic diagnosis of the human condition. He writes: *"Justice without might is helpless; might without justice is tyrannical... We cannot make what is just strong, so we have made what is strong just."*

  For Pascal, the union of justice and might is the *telos* of a stable polity, but since true justice (in the metaphysical sense) cannot compel obedience, we must clothe force in the garments of justice to ensure peace.

  The ICC represents the inverse of Pascal's political solution. It asserts "what is just" while explicitly lacking "what is strong." It has no police force; it relies on state cooperation. To Pascal, this does not look like a bridge toward unity; it looks like the exposure of helplessness. By issuing warrants against heads of state without the means to enforce them, the ICC stages a public spectacle of justice's impotence. For Pascal, this is worse than tyranny. Tyranny (might without justice) at least keeps order; helpless justice (justice without might) invites contempt for the law itself. It reveals that the "justice" claimed by the international community is merely rhetorical, lacking the essential attribute of sovereignty: the monopoly on violence.

  ### 2. "Sounding Laws to Their Source" (Fragment 294)
  Your reference to Fragment 294 (Lafuma 94) is critical. Pascal argues: *"It is necessary not to sound laws even to their source... otherwise they collapse."* He posits that legal authority rests on a foundational fiction—that laws are obeyed because they are *just*, not because they are *customary* or *enforced*.

  International tribunals are explicitly designed to "sound laws to their source." Their mandate is to trace the actions of sovereign powers back to a standard of universal justice that transcends positive state law. In doing so, they reveal that the source of authority is contested. When a UN commission declares a state's military action "unlawful," it is effectively telling the populace: *"The force your sovereign wields is not legitimate."*

  Pascal would argue that this strips authority of its mystical foundation. If the people perceive that their leaders are subject to a higher law that those leaders can ignore with impunity, the "illusion" of legitimate authority evaporates. Pascal believes this illusion is not merely a lie but a necessary social technology. By publicizing the gap between international norms and state behavior, the ICC destroys the "reason of effects"—the pragmatic acceptance of authority for the sake of peace.

  ### 3. Sedition Without Remedy (Fragments 326 and 336)
  This leads to the most damning Pascaline critique, found in Fragment 326 (Lafuma 101) and 336 (Lafuma 103). Pascal warns that revealing the injustice of laws *"breeds sedition without producing anything juster."* He advises the "wise" (those who understand the contingency of law) to keep this insight secret and outwardly comply to maintain order.

  The ICC operates on the exact opposite principle: it assumes that *publicity* of injustice is a good in itself. Pascal would view this as catastrophic.
  *   **Sedition:** When the ICC indicts a leader, it often galvanizes domestic support for that leader (framed as resisting foreign interference) or incites unrest among opposition groups who feel empowered by the ruling but unprotected by its enforcement. This is the "sedition" Pascal fears.
  *   **No Remedy:** Because the ICC lacks might, it cannot "produce anything juster." The indicted leader often remains in power, the victims remain unprotected, and the rule of law is shown to be selective.

  For Pascal, the "wise" diplomat would understand that a war criminal remaining in power might be preferable to the civil war or international conflict that arises from attempting to prosecute them without the force to guarantee a transition. Fragment 336 suggests that we must follow the "custom" of the country because it is the only available proxy for justice. The ICC attempts to bypass custom (sovereign immunity, realpolitik) in the name of abstract justice. Pascal would argue this bypass leads not to heaven, but to the state of nature.

  ### 4. The Counter-Argument: Is there a Pascaline Defense?
  Could one argue that Pascal might support the ICC as a nascent form of "global might"? If the ICC were the nucleus of a future global sovereign that *could* unite justice and might, would he support it?

  Likely not, for two reasons rooted in his anthropology:
  1.  **Concupiscence:** Pascal does not believe human institutions progress toward righteousness. He believes power is inherently self-aggrandizing. A global court would simply become another site of *libido dominandi* (lust for domination), likely weaponized by powerful states against weaker ones (which critics often allege of the ICC).
  2.  **The Necessity of Secrecy:** Even if the ICC were a step toward global might, its *current* operation relies on transparency. Pascal's politics requires that the "usurpation" remain hidden *until* the force is absolute. To expose the lack of force *before* the force is secured is to invite chaos.

  ### Conclusion
  Pascal would judge the ICC as a noble but dangerous abstraction. It embodies the "justice without might" he calls helpless (298), it violates the injunction against sounding laws to their source (294), and it risks the sedition that comes from revealing injustice without the power to cure it (326).

  For Pascal, the tragedy of politics is that we must treat the strong *as if* they are just to avoid the war of all against all. Institutions that publicly declare the strong *unjust*, without the capacity to make them weak, do not solve the tragedy; they merely strip away the veil that keeps the tragedy from becoming a catastrophe. He would likely advise the "wise" to work for justice within the shadows of power, rather than establishing tribunals that shine a light on power's limits without the ability to expand them.
