      *   *What is the key difference?* Freud posits a topographical split (Id/Ego/Superego, Conscious/Unconscious). Sartre posits a unified consciousness that lies to itself *in full awareness* (pre-reflectively).
      *   *The "Censor" Problem:* Sartre argues that for repression to work, the "censor" must know what to repress. If it knows, it's conscious. If it doesn't, how can it choose? This leads to an infinite regress in Freud's model, according to Sartre.
      *   *The Cure:* If the mechanisms are different, the cures are different. Psychoanalysis aims to uncover hidden drives. Existential psychoanalysis (Sartre's version) aims to recognize radical freedom and responsibility.

