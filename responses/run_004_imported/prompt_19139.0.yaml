      *   *Ayer's Likely Verdict:* The bot is a simulation of behavior, not a continuation of the "person" (bundle of experiences).
      *   *Comparison to Medium:* A medium claims a causal connection (spirit channeling). A griefbot claims a statistical mimicry.
      *   *Comparison to NDE:* Ayer's NDE was a *first-person experience* of consciousness continuing (apparently). The griefbot is a *third-person artifact*.

  4.  **Drafting the Argument - Step-by-Step:**

