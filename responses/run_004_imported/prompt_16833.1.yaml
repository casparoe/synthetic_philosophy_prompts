answer: |-
  Thank you all for coming. For those who don't know me, I'm [Your Name], a colleague of Miriam's in the department.

  We are here because three weeks ago, the world lost Miriam. Sixty-one years old. A stroke. No warning. There is no decision tree that branches to this outcome, no probability distribution that makes this feel anything other than a violent rupture.

  When the department asked me to speak, I went to Miriam's sister and her partner, Sarah, to ask what they thought she would have wanted. They told me something I already knew, but needed to hear again. They told me that if Miriam could script this moment, she wouldn't want hymns, and she wouldn't want platitudes about her being "looking down from the stars."

  She wanted Frank Ramsey.

  Specifically, she wanted the stray paragraph from *The Foundations of Mathematics* where Ramsey writes about his picture of the world. For the family and students here who haven't spent the last thirty years reading footnotes on subjective probability, the passage is short, and I want to read it now, because it was Miriam's creed:

  *"My picture of the world is drawn in perspective, and not like a model to scale. The foreground is occupied by human beings, and the stars are all as small as threepenny bits. I don't really believe that the stars are that small; I know they are huge. But I still see them as small. And I refuse to be humbled by the vastness of the universe. Size is not a measure of value. The stars are dead matter. They cannot think, and they cannot love. And it is thinking and loving that are the only things that matter."*

  Miriam wasn't joking when she said this should be read at her funeral. But I know that standing here, looking at her empty chair, that passage feels dangerous.

  Ramsey wrote those words when he was a brilliant, vibrant young man. He died at twenty-six. To use his refusal to be humbled by the cosmos as comfort at a funeral can sound like bravado. It can sound like we are trying to talk ourselves out of grief, pretending that death doesn't loom large just because we say size doesn't matter.

  If I were to tell you that Miriam's death isn't significant because the universe is indifferent, I would be insulting her memory. Miriam knew the universe was indifferent. She was a formal epistemologist; she spent her life mapping the logic of uncertainty. She knew better than anyone that the stars are huge, and we are physically negligible.

  But she also knew that "significance" is not a physical property. It is not measured in light-years or mass.

  To the logicians in the room: Miriam spent her career working on the Ramsey-de Finetti theorem, on how we assign credence, on how we make rational decisions under uncertainty. She knew that in a utility function, the variables are not defined by their spatial coordinates. They are defined by their value to the agent.

  To Miriam's family, and to the students who loved her: This is what she meant. When we feel crushed by grief, it is because we are trying to view our loss "to scale." We are trying to measure Miriam's absence against the timeline of the universe, or the randomness of biology. And against that scale, yes, we are small. The loss feels like a void that swallows everything.

  But Miriam is asking us to correct the perspective.

  She is asking us to stop looking at the stars. She is asking us to look at the foreground.

  The stars are cold. They are vast, yes. But they are silent. They have never held a hand. They have never solved a problem that eased a burden. They have never laughed at a bad joke in a pub on a Tuesday night.

  Miriam did.

  The "thinking and loving" that Ramsey wrote about, and that Miriam lived, is the only mass that exists in this room. The grief you feel right now? That is not a measure of how small we are. It is a measure of how much thinking and loving Miriam generated.

  I saw this in her work. She never cared about the prestige of a journal, or the size of a conference. Those were just "stars"—distant, cold metrics. She cared about whether an argument was true, and whether the person she was debating felt heard. I saw it in her office hours, where she would spend an hour untangling a single confused thought from an undergraduate, not because it would advance her career, but because a mind was struggling, and she valued that mind.

  I saw it most of all in the way she spoke about Sarah, and her sister, and the friends in this room. She did not love you because it was efficient. She loved you because, in her picture of the world, you were in the foreground. You were not drawn to scale. You were drawn large.

  So, how do we comfort ourselves with this? We do not use Ramsey's words to deny that Miriam is gone. We use them to deny that her absence makes her small.

  If we measure by size, by time, by the cold mechanics of the stroke that took her, then yes, she is gone. The universe has continued, indifferent.

  But if we measure by the only metric that Ramsey allowed, and the only metric Miriam respected, then she is here. Because thinking and loving are not properties of matter. They are properties of connection.

  The stars will burn out. The universe will cool. But the thoughts Miriam sparked in this department, the love she built in her home, the decisions she influenced, the comfort she gave—these are not subject to the entropy of the physical world. They are part of the foreground.

  Miriam refused to be humbled by the vastness of the universe. She would not want us to be humbled by the vastness of our grief. She would want us to look at the threepenny bits. She would want us to look at each other.

  She would want us to recognize that while the stars may be huge, they are dark. And while we are small, we are the only things that carry the light.

  Miriam thought. Miriam loved. And in the only perspective that counts, that makes her larger than the sky.

  Thank you.
