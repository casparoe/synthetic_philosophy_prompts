answer: |-
  Good evening. For those who don't know me, I'm the bride's brother. And for the third of you in this room who are here representing the Philosophy Department: I know what my sister does for a living. I know she spends her days worrying about whether her thoughts can actually move her body, or if they're just shadows cast by her neurons.

  So, I felt it would be disrespectful to stand here and offer you a toast that treats her mind as merely decorative. We are gathered here to celebrate a decision. She decided to marry [Groom's Name]. But if we take the causal exclusion problem seriously, we might worry that her decision didn't actually *do* anything. After all, her brain states were physically sufficient to make her say "I do." If the physics is closed, what work is left for the love?

  Now, there is a cheap way out of this. We could say that her love and her brain state are two separate causes, both fully sufficient to bring about the wedding. That's systematic overdetermination. It's like saying a window broke because a ball hit it *and* because a sonic boom hit it, simultaneously, every single time. My sister rejects this. It's ontologically wasteful, and frankly, it makes her love sound like a redundant backup system for her biology.

  She is a non-reductive physicalist. She believes her mind is not a ghost, but it is also not *just* her neurons in the way that water is *just* H2O. She believes her mental states are realized by her physical states, but distinct from them. So, how do we save the causal power of her "Yes"?

  I want to propose we look at this through the lens of the **determinate and the determinable**.

  Consider the color red. A specific shade, like scarlet, is a *determinate* of the *determinable* property, red. If a pigeon pecks at a red triangle, it pecks because the triangle was red. It doesn't matter if the triangle was scarlet, crimson, or ruby. The specific shade (the determinate) realizes the color (the determinable), but the causal work is best attributed to the color. If you had swapped scarlet for crimson, the pigeon still pecks. The specific shade is too narrow to be the true cause. The causal power lies in the property that remains invariant across changes in the realization.

  Apply this to my sister. Her specific neural firing pattern is the *determinate*. It is the scarlet. Her decision to marry [Groom's Name] is the *determinable*. It is the red.

  If her neurons had fired slightly differently—perhaps she had a different breakfast, or a slightly different synaptic density—but she still held the same belief and love, she still would have said "I do." The specific neurons are the mechanism, but they are too specific to be the *reason*. The reason is the mental state.

  This blocks the exclusion argument without reaching for dualism. There are not two causes competing for the effect. There is one causal process, but the mental property captures the *relevant* causal grain that the physical description misses. The physical description tells us *how* the arm moved to place the ring. The mental description tells us *why* the ring was placed there. And in philosophy, as in marriage, the "why" is not a shadow. It is the invariant feature that makes the event what it is.

  So, to answer the question: Does her decision to marry him do anything in the world *over and above* her neurons?

  It does not add energy to the universe. It does not violate the conservation of mass. But it exerts a causal power that the neurons, described merely physically, cannot claim. Her neurons could not commit to a future. Her neurons could not promise fidelity. Those are properties of the mental state, realized by the neurons, but causally potent in their own right. Her decision is not a passenger in her body. It is the pattern her body makes, and patterns constrain the future.

  [Groom's Name], you didn't fall in love with her occipital lobe. You fell in love with her mind. And thanks to the fact that mental properties are causally relevant determinables, that mind is now actively shaping your shared reality.

  So, please raise your glasses. To the bride and groom. May your love be physically realized, mentally distinct, and causally potent. To the happy couple!
