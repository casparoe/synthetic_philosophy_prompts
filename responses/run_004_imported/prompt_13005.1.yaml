      *   **Bride's Stance:** Non-reductive physicalist. Rejects identity theory (mental $\neq$ physical) and dualism. Rejects systematic overdetermination (the "cheap" escape).
      *   **Goal:** Block the exclusion argument using *one* specific strategy (not a survey). Must be warm/emotional but philosophically precise (no equivocation). Must commit to a real position on whether her decision to marry him does anything *over and above* her neurons.
      *   **Constraint:** 5 minutes (approx. 750-850 words spoken at a moderate pace).

  2.  **Determine the Philosophical Strategy:**
