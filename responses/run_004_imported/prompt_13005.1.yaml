      *   *Let's try the "Realization" angle.* The mental state *is* the physical state functioning in a specific way.
      *   *Decision:* I will use the **Determinate/Determinable** distinction (Stephen Yablo's approach). It is the standard "non-reductive physicalist" move that avoids overdetermination.
