      *   *Option A: Identity Theory.* (Rejected by bride).
      *   *Option B: Dualism/Interactionism.* (Rejected by bride).
      *   *Option C: Systematic Overdetermination.* (Rejected by bride as "too cheap").
      *   *Option D: Compatibilism/Counterfactual Dependence.* (Lewis-style). Good, but can feel a bit dry.
      *   *Option E: The "Program Model" or "Determinate/Determinable" relation.* (Yablo, Shoemaker). This is strong. It argues that $M$ and $P$ aren't competitors. $M$ is a determinable of $P$ (the determinate). Like "scarlet" and "red." If the pigeon pecks at the red triangle, it's because it was red, not necessarily because it was *scarlet*. The mental property captures the *relevant* causal grain.
      *   *Option F: Constitutive Relevance / Mechanistic Explanation.* (Craver, Kaplan). Mental states are constituted by neural states, not caused by them.
      *   *Selection:* **The Determinable/Determinate relation (Yablo-style)** is the most elegant for a wedding toast. It allows for distinctness without competition. It avoids overdetermination because they aren't two *separate* causes; one is a specific version of the other. It validates the "meaning" of the decision (mental) without denying the "mechanism" (physical). It fits the "Non-reductive Physicalist" brief perfectly.

  3.  **Drafting - Section by Section:**

