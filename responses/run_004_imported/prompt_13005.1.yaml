      *   *Actually, the Yablo line is:* The determinable is causally relevant because it is *less specific* but *more robust*. If she had slightly different neurons (different determinate), she would still have the same belief (same determinable), and she would still say "I do." Therefore, the belief is the cause, not the specific neuron firing. This is the "Counterfactual Dependence" angle within the Determinable framework. This is the strongest argument. I will use this.

