  *(Self-Correction Note)*: I need to be careful with Sarah's defense. The standard Stalnaker response to Lewis is often that the conditional *does* have truth conditions, but Adams' Thesis only holds approximately or that the probability space is restricted. However, a more sophisticated Truth-Conditionalist (like Alan Hájek or Richard Bradley) might argue that the *proposition expressed* is context-dependent. Let's go with the Context-Dependence move (Stalnaker/Bradley) because it's the most direct counter to Lewis's assumption of a fixed proposition.

