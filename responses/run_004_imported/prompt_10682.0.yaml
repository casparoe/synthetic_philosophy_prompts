      *   If the human signs off knowing civilians will die, is it foresight or intention?
      *   Anscombe distinguishes based on the *description of the act*. If the act is "Destroy HVT," deaths are foreseen. If the act is "Destroy HVT *at the cost of* X civilians," the cost is integrated.
      *   The *ranking* system is problematic. It prioritizes targets based on a ratio involving civilian deaths. This suggests the deaths are part of the valuation metric.

