      *   The "Plan Failure" test: If the civilian deaths *didn't* happen, would the mission be a success? Yes. So they aren't intended *as an end*. But are they intended *as a means*?
      *   Anscombe's view on "means": If I blow up a plane to kill a passenger (even if I also destroy the plane), I intend the death. If I blow up a plane to destroy cargo and a passenger dies, I foresee it.
