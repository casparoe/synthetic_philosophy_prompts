      *   **Core Question:** How would Anscombe judge this specific algorithmic pipeline? Does the algorithmic weighing of civilian deaths against target value constitute *intending* those deaths (making it murder), or is there a principled way to keep it permissible on her terms?

  2.  **Initial Assessment of Anscombe's Stance:**
