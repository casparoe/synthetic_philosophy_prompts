      *   Actually, Anscombe allows for *foreseen* bad effects. The question is whether the "weighing" makes it *intended*.
      *   If I say "I will do X provided the cost is not more than Y," and the cost is innocent deaths, am I intending those deaths?
      *   Anscombe would likely say: You are making the killing of innocents a *condition* of your action. You are saying "I am willing to kill these people to get this target." That willingness looks a lot like intention.
      *   In "War and Murder," she writes about the principle that one may not kill the innocent *whatever the consequences*. The "weighing" is literally calculating consequences.

  10. **Drafting the Response:**
      *   **Introduction:** Acknowledge the gravity. State clearly that Anscombe would likely be deeply suspicious, if not outright condemnatory, primarily due to the "weighing" mechanism.
