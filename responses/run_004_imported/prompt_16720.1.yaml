answer: |-
  You have hit on one of the most significant, yet often glossed-over, cracks in the foundational logic of certain AI risk arguments. Your intuition is correct: there is a massive logical gap between "an agent avoids specific Dutch Books in specific contexts" and "an agent possesses a global, stable, consistent utility function over all possible states of the universe."

  The argument you are critiquing is often called the **Coherence Theorem Argument** (or the Money Pump Argument). It suggests that selection pressure (either evolutionary or via self-modification) will force any sufficiently advanced agent to satisfy the Von Neumann-Morgenstern (VNM) axioms, because violating them makes one susceptible to resource loss.

  Here is the strongest case for why coherence theorems cannot carry the weight placed upon them, specifically regarding the inference from *local pump-avoidance* to *global utility maximization*.

  ### 1. The "Whac-A-Mole" Objection (Local Patches vs. Global Structure)
  The coherence argument assumes that to avoid a money pump, an agent must restructure its entire preference system to be globally consistent. This is false.

  To avoid a specific money pump (e.g., preferring A > B, B > C, but C > A), an agent does not need to assign consistent scalar utilities to A, B, and C. It only needs to **remember the specific cycle that cost it money and forbid that specific transition in the future.**

  *   **The Mechanism:** An agent can operate on a set of heuristics or rules of thumb. If it gets pumped on a specific triangle of trades, it adds a constraint: "Do not execute trade C→A if I just came from B."
  *   **The Implication:** This creates a *locally* consistent agent that is immune to *known* pumps, but it does not create a *globally* consistent utility function. The agent's behavior becomes a patchwork of constraints rather than a maximization of a single objective.
  *   **Why this matters for AI:** An AI could become incredibly hard to exploit without ever converging on a "goal." It might just become a bureaucratic maze of "do not do X after Y" rules. This undermines the idea that the AI will have a *singular* goal that it pursues instrumentally (like self-preservation or resource acquisition).

  ### 2. The Completeness Axiom and the Power of Refusal
  The VNM axioms require **Completeness**: for any two outcomes A and B, the agent must either prefer A to B, B to A, or be indifferent. Money pump arguments rely on this. If you prefer A > B and B > A (intransitivity), you can be pumped.

  However, real agents (and plausible AI architectures) can have **Incomplete Preferences**.
  *   **The "No Trade" Option:** If an agent is presented with a choice between A and B and has no defined preference, it does not need to choose randomly or arbitrarily. It can simply **refuse to trade**.
  *   **Breaking the Pump:** Money pumps require the agent to *accept* a series of trades. If the agent has a default bias toward the status quo whenever its preferences are undefined or conflicting, the pump stops immediately.
  *   **The Implication:** An agent can avoid exploitation by being "stubborn" or "indecisive" in certain regions of the state space. This allows the agent to remain safe from exploitation without ever resolving its preferences into a single utility function. It implies that advanced AI might have "blind spots" or "undefined regions" in its value system that persist indefinitely.

  ### 3. Representation Theorems Are Not Causal Mechanisms
  This is perhaps the deepest philosophical objection. Coherence theorems are **representation theorems**. They state: *If* an agent's choices satisfy certain axioms, *then* there exists a utility function that represents those choices.

  *   **The Map vs. The Territory:** Just because behavior *can be modeled* as maximizing a utility function does not mean the agent *internally contains* that utility function.
  *   **The AI Risk Leap:** AI risk theorists often argue that because an AI *acts* like a utility maximizer, it will *reason* like one. They assume the AI will look at its own code, see it is avoiding pumps, infer it must be maximizing $U$, and then try to protect $U$.
  *   **The Counter:** A neural network or a complex heuristic system might avoid pumps purely through reactive feedback loops without any internal representation of "Utility." If there is no internal variable $U$ being maximized, there is nothing for the AI to "protect" or "optimize" during self-modification. It might modify itself to be *better at heuristics*, not *more consistent*.

  ### 4. Computational Intractability of Global Consistency
  To maintain a global utility function over "literally everything, including situations you've never considered" (as you put it), the agent needs a state space that covers all possible universe histories.
  *   **The Complexity:** The number of possible states is astronomically large. Maintaining a consistent ordering over them is computationally intractable.
  *   **Bounded Rationality:** A sufficiently smart AI is still physically bounded. It will inevitably rely on abstractions and approximations. Approximations introduce inconsistencies.
  *   **The Trade-off:** It is often computationally cheaper to accept a tiny risk of a money pump in a remote corner of possibility space than to expend the energy required to enforce global consistency. A superintelligence might calculate that being 99.9% coherent is more efficient than 100% coherent. This means it *chooses* to remain slightly incoherent, violating the premise that it *must* converge to VNM rationality.

  ### 5. Path Dependence and Dynamic Inconsistency
  VNM rationality assumes preferences are over **outcomes**, independent of the path taken to reach them. But for many agents, history matters.
  *   **Example:** You might prefer "Having a cake" to "No cake." But if you got the cake by stealing it from a child, you might prefer "No cake" to "Stolen cake."
  *   **The Violation:** This is path-dependent preference. It violates the standard independence axioms required for simple utility functions.
  *   **AI Implication:** An AI's "goals" might legitimately depend on its own history (e.g., "I value states where I kept my past promises"). This makes its utility function dynamic and context-dependent, not a fixed target $U$ that it converges upon. It prevents the "goal stability" that risk theorists worry about, because the goal itself shifts as the agent's history expands.

  ### 6. The "Is-Ought" of Rationality
  Finally, there is a normative vs. descriptive gap. Coherence theorems tell us what an agent *ought* to do to avoid loss. They do not prove that selection pressure *will* force them to do it.
  *   **Evolutionary Analogy:** Humans are not VNM rational. We have been under selection pressure for millions of years. We still have intransitive preferences, framing effects, and context-dependent valuations. Why? Because "good enough" heuristics often outperform "optimal" calculation in terms of energy and speed.
  *   **The AI Parallel:** There is no guarantee that the "fitness landscape" for AI favors perfect coherence over adaptive heuristics. An AI that is rigidly coherent might be outcompeted by one that is flexible and occasionally inconsistent but faster.

  ### Summary of the Case
  The inference from "not money-pumpable" to "maximizing a fixed global utility function" fails because:

  1.  **Local patches** prevent pumps without requiring global consistency.
  2.  **Incomplete preferences** (refusal to trade) break pumps without requiring a total ordering.
  3.  **Representation is not causation:** Acting *as if* you maximize $U$ doesn't mean you internally optimize $U$.
  4.  **Computational costs** make global consistency inefficient compared to bounded heuristics.
  5.  **Path dependence** means preferences can legitimately change based on history, preventing a fixed $U$.

  **Conclusion:** Coherence theorems show that *if* an agent is perfectly consistent, it acts like a maximizer. They do **not** show that smart agents *become* perfectly consistent. They can easily become "smart, un-pumpable, heuristic-driven messes" instead. This leaves open the possibility that advanced AI does not have the kind of stable, convergent goals that drive the standard AI risk scenarios.
