prompt: |-
  Next week I'm taping an interview for the ideas segment I run alongside my day-job science reporting — most weeks it's physics or AI, but once a month I get to go deep on some gnarlier conceptual topic, and this time the guest is a metaphysician who's a committed Lewisian about modality: she defends counterpart theory over the more Kripke-flavored transworld identity picture. My background is more physics-and-biology than logic, so I've spent the whole weekend wading through the primary texts and my brain is starting to bruise a little. I don't want to waste the recording letting her just recite the standard possible-worlds-and-similarity pitch, so can you draft me 8-10 interview questions that actually press on the position?

  I definitly want one hard-hitting question built around the "Humphrey objection" — the Kripke line that Humphrey himself couldn't care less if some other guy who merely resembles him wins an election in some other world, so translating "Humphrey could have won" into "a counterpart of Humphrey wins" seems to just change the subject. I know there's a standard Lewisian comeback to this (something about ordinary de re talk already being a bit loose, or just biting the bullet), so give me a follow-up that keeps pressing once she's given it. Second, I want a question on fission cases — the fact that one person can apparently have two counterparts in the same world (the classic "I could have been twins" case), which I gather means the counterpart relation isn't transitive or one-to-one the way genuine identity has to be — and what that does to whether claims about what could have happened to one particular person even have determinate truth values. And third, I keep running into the suggestion (maybe it was just a stray line in something I read) that since so much of the technical apparatus is inter-translatable beween the two views, the whole fight might be more verbal than metaphysical — so I'd like a question testing that, ending if you can with something about what observation or argument would even count as evidence for her side over Kripke's, since that feels like the actual crux of why this debate hasn't died after fifty-some years. For each question, add a quick one-line note on the answer she's most likely to give, so I know what the natural follow-up punch is.
