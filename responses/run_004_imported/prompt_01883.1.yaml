answer: |-
  This is not a weird combo at all; you have accidentally stumbled onto the central fault line in contemporary metaphysics of science. You are seeing the friction between the last great attempt at a **reductive Humean analysis** of causation (Lewis) and the rise of **non-reductive causal realism/pragmatism** (Woodward/Pearl).

  You are right to be suspicious of the textbook summaries. They often paint Pearl/Woodward as simply "formalizing" Lewis, but as you've noticed, the philosophical commitments are radically different.

  Here is the deep-dive on the preemption/graph-smuggling issue, the circularity charge, and the verdict on who "won."

  ### 1. Preemption and the "Cheating" Charge

  You asked: *Is the structural-equations move a genuinely principled advance on Lewis's preemption patches, or is it cheating, in that all the real work has already been smuggled in by whoever drew the causal graph?*

  **The Lewis Problem:**
  Lewis's 1973 theory failed on preemption because it relied on *counterfactual dependence between events*. In early preemption (Suzy throws, Billy holds back; if Suzy hadn't, Billy would have), the shattering does not counterfactually depend on Suzy's throw. Lewis's patches (quasi-dependence, influence) were attempts to save the event-based ontology without admitting that the *structure of the process* mattered more than the events themselves. His 2000 "Influence" account got closer to the SCM view (looking at ranges of alterations), but it remained bogged down in the metaphysics of events and world-similarity.

  **The SCM/Woodward Move:**
  In an SCM, preemption is trivial. You have equations:
  $$S = U_s$$
  $$B = \text{if } S=0 \text{ then } U_b \text{ else } 0$$
  $$E = S \lor B$$
  To test if $S$ causes $E$, you intervene on $S$ (set $S=0$) while holding the structural equations fixed. $B$ becomes 1 (because $S=0$), $E$ remains 1. Wait, that's late preemption. In early preemption, $B$ is structurally inhibited by $S$. The graph *explicitly represents the mechanism of inhibition*.

  **Is it Cheating?**
  The charge is that the DAG is just a causal map in disguise. If you need causal knowledge to draw the arrows, you haven't analyzed causation; you've just represented it.

  **The Verdict:** It is **not cheating**, but it is a **retreat from reductionism**.
  *   **Lewis's Goal:** Reduce causal facts to non-causal facts (the Humean mosaic of local particular matters of fact + laws). The similarity metric was supposed to be derivable from non-causal features of the world.
  *   **Woodward/Pearl's Goal:** Provide a semantics for causal claims that aligns with scientific practice. They do not claim the graph is derived from non-causal data alone. The graph encodes *causal assumptions*.

  **Why it's a principled advance:**
  Lewis hid his causal assumptions inside the **similarity metric**. To get the right counterfactuals (no backtracking), Lewis had to weight "miracles" (law violations) against "match of fact." But how do you weigh them? Lewis admitted you need a system of weights that prioritizes avoiding big miracles. But what counts as a "big miracle"? Often, it's a violation of a causal law.
  *   **Lewis:** Smuggles causation into the *similarity metric* but claims it's non-causal.
  *   **Woodward:** Smuggles causation into the *graph structure* and admits it's causal.

  The SCM advance is **transparency**. It forces you to explicitly state the causal assumptions (the edges) rather than hiding them in a vague metaphysical weighting of possible worlds. Once the assumptions are explicit, the logic of preemption is handled rigorously via the `do`-operator (which surgically breaks incoming arrows) rather than Lewis's messy "quasi-dependence" intrinsicness checks.

  So, SCM wins on preemption not because it magic-wandled the problem away, but because it changed the ontology from *events* to *variables/mechanisms*. If you care about mechanisms, preemption isn't a bug; it's a feature of the structure.

  ### 2. The Circularity Charge

  You asked: *Is Woodward's intervention circularity a serious problem, and doesn't Lewis have the same issue with similarity metrics?*

  **Woodward's Circularity:**
  An intervention $I$ on $X$ with respect to $Y$ is defined as a variable that causes $X$, does not cause $Y$ except through $X$, and is uncorrelated with other causes of $Y$.
  *   **The Charge:** You are defining "cause" using "intervention," but "intervention" is defined using "cause." Vicious circle.
  *   **Woodward's Defense:** He bites the bullet. He is not offering a reductive analysis. He is offering an **explication**. The goal is to connect causal claims to a specific class of evidence (experimental/manipulative). The circularity is "virtuous" or coherentist: our concept of causation is tied to our concept of manipulation, and neither reduces to non-causal Humean facts. It's a package deal.

  **Lewis's Circularity:**
  Lewis *did* want a reductive analysis. This makes his circularity fatal to his specific project.
  *   **The Problem:** To evaluate "If $C$ had not occurred..." Lewis requires a world that is maximally similar to ours. To avoid backtracking (If the match hadn't lit, the oxygen wouldn't have been there), Lewis requires the similarity metric to prioritize avoiding "big, widespread miracles" over "small, localized miracles."
  *   **The Catch:** Determining what counts as a "localized miracle" vs. a "backtracking violation" often relies on causal intuition. As Horwich and others pointed out, the asymmetry of overdetermination (which Lewis uses to ground the metric) looks suspiciously like it presupposes the causal asymmetry it's trying to explain.
  *   **Comparison:** Lewis's circularity is a bug because he promised a reduction to non-causal facts. Woodward's circularity is a feature because he promises a functional account of scientific reasoning.

  **Is it a serious problem for Woodward?**
  Only if you are a Humean reductionist. If you believe causal facts supervene on non-causal facts, Woodward fails. If you believe causal facts are real and distinct (or at least autonomous), Woodward succeeds. In the context of your health-data job, Woodward's circularity is irrelevant because you are never trying to derive causation from pure pixel-data; you are always bringing in prior structural knowledge (the DAG).

  ### 3. Who Won? (Standoff or Victory?)

  **In Metaphysics: Standoff.**
  *   **The Humeans (Lewisians):** Still argue that Woodward just pushes the mystery back. "Okay, interventions are causal. But what makes an intervention causal? It must supervene on the Humean mosaic." They continue to try to fix the similarity metric or propose new regularity accounts.
  *   **The Anti-Humeans (Woodwardians):** Argue that Humean reduction is a fool's errand. Causation is about dependency structures that support manipulation, not patterns in the mosaic.
  *   **Status:** No knockout. It depends on whether you think metaphysics requires reduction to non-causal bases.

  **In Science (and your job): Woodward/Pearl Victory.**
  *   Lewis's theory is computationally intractable and operationally useless for data science. You cannot calculate the similarity metric between possible worlds from an EHR dataset.
  *   You *can* encode assumptions in a DAG and apply do-calculus.
  *   The "Interventionist" account won because it matches the **experimental ethos** of modern science. We don't verify causation by checking world-similarity; we verify it by checking invariance under intervention (RCTs, natural experiments). Woodward provided the philosophy that justifies why RCTs are the gold standard.

  ### The "Real" Disagreement

  The core tension you are feeling is between **Ontology** (Lewis) and **Methodology** (Woodward).

  *   **Lewis** asks: "What *is* causation in the fabric of reality?" (Answer: A relation of counterfactual dependence grounded in the Humean mosaic).
  *   **Woodward** asks: "What do causal claims *do* for us in science?" (Answer: They tell us what happens under hypothetical manipulations).

  When you are doing causal inference on health data, you are doing Woodwardian science. You are asking, "If we intervene on treatment $X$, does $Y$ change?" You are not asking, "Is there a metaphysical bond between $X$ and $Y$?"

  **The "Cheating" Conclusion:**
  The graph *does* smuggle in causal information. But Lewis's similarity metric *also* smuggled in causal information. The difference is that Pearl/Woodward made the smuggling **explicit** (as assumptions in the DAG), whereas Lewis hid it in the **implicit weighting** of possible worlds.

  In your onboarding, they taught you Pearl because it works. In your reading group, you read Lewis because it's a monumental attempt to solve the metaphysical puzzle. The friction you feel is the realization that the metaphysical puzzle might not have a solution that satisfies the methodological requirements of science.

  **Recommendation:** If you want to see this fight play out in real-time, look up the literature on **"Humean Interventionism"** (e.g., work by Jonathan Schaffer or recent papers in *British Journal for the Philosophy of Science*). There is a current movement trying to reconcile Woodward with Humean supervenience, arguing that the "structural equations" themselves can supervene on the Humean mosaic. If they pull that off, Lewis gets a posthumous win. If not, Woodward remains the king of the scientists.
