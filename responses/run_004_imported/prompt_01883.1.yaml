  *(Refining the "Cheating" argument)*: The charge is that the DAG *is* a causal map. So defining causation via the DAG is circular. Response: The DAG is a representation of *structural* relations (equations), which are distinct from mere probabilistic dependence. The "causal" part comes from the *intervention* semantics applied to the structure. Lewis's "structure" was the Humean mosaic + similarity weights. Both start with primitives. Lewis claimed his were non-causal; Woodward admits his aren't. That's the key.

