prompt: |-
  Okay so this is a weird combo but bear with me. I started a new job about a month ago doing causal inference on a health-data team, and onboarding was basically wall-to-wall Judea Pearl -- do-calculus, structural causal models, the works. Fine, whatever, I was following along okay. Then completely seperately, my Thursday night reading group (we do metaphysics, nothing to do with my job) landed on David Lewis's old counterfactual theory of causation, and I had this mildly annoying realisation that the two things I'm doing with my week are apparently rival camps in the philosophy of causation -- counterfactual dependence vs. Woodward-style interventionism -- not just two notations for the same idea, like I'd been assuming.

  So now I actually want the real version of this disagreement, past the one-paragraph-textbook-summary level I keep bumping into online. Specifics: Lewis's 1973 theory analyses causation as roughly a chain of counterfactual dependence between distinct events, and he had to keep patching it to handle preemption -- first the "quasi-dependence" fix in the 1986 postscripts, then basically abandoning that for the "influence" version in 2000, which grades causation via patterns of dependence across whole ranges of alterations instead of a plain yes/no counterfactual. Meanwhile Woodwards interventionist account (Making Things Happen) defines X causing Y through a hypothetical surgical intervention on X within a structural equation/graph, and apparently gets a lot of the same preemption cases for free just by holding certain other variables fixed at their actual values. What I want to know is: is that structural-equations move a genuinely principled advance on Lewis's preemption patches, or is it cheating, in that all the real work has already been smuggled in by whoever drew the causal graph? And relatedly -- I keep running into the charge that Woodward's theory is "circular" since an intervention is itself a causal notion. Is that actually a serious problem, and if so, doesn't Lewis have a quieter version of the exact same issue hiding in his similarity metric (all that business about avoiding "big miracles")? I'm not after the SEP-summary version, I've read it a bunch of times now -- more interested in whether one side has actually won this argument or it's a genuine standoff.
