prompt: |-
  I'm on my state's parole board, and I could really use a sanity check before Thursday's hearing. Last weekend my friend Dana and I got into a two-hour argument over dinner about a case I'm sitting on this week, and it somehow turned into a whole fight about probability that neither of us could resolve. The case: a guy named Marcus is up for release after eleven years, and the risk-assessment tool our board uses (one of those actuarial instruments, kind of like the COMPAS one that got flak a few years back for racial bias) spits out "19% likelihood of violent reoffense within 3 years," putting him in the "low-moderate" band. Dana's position was basically: that 19% just IS the objective chance, it's the best estimate that exists, so my actual degree of belief that Marcus specifically will reoffend should just be 19%, full stop -- anything else is me smuggling in a "gut feeling" that's almost certainly noise or bias dressed up as wisdom (she kept bringing up some study about how actuarial predictions beat clinical judgment basically every time there tested). I pushed back that 19% is a fact about a big bucket of guys who share a handful of features with Marcus on paper, not a fact about Marcus specifically, and that I've got case-specific stuff in his file that never went into the tool -- he finished a trades certification and has a verified job offer, but also picked up two write-ups for fighting this past year -- so factoring that in isn't me going with my gut, its just using information the tool didn't have. We never landed anywhere, and my other friend who's doing a philosophy PhD said afterward that this is apparently a whole "reference class" thing people argue about, which did not make me feel better.

  So here's what I actually need. Can you draft the memo I'll circulate to the rest of the board before Thursday? It should (1) make an actual recommendation on Marcus's case -- grant, deny, or grant with conditions, and if conditional, on what timeline those conditions get reviewed -- and (2) since some version of this fight happens almost every month with a different name attached to the file, lay out a short standing rule for how much weight the score itself should get relative to case-specific information the board has that the tool didn't. Don't just default to Dana's side or mine -- whichever way you land, take the strongest version of the other position seriously instead of waving it off.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Member of a state parole board.
      *   **Task:** Draft a memo to circulate to the rest of the board before a hearing on Thursday.
      *   **Subject:** A specific case (Marcus) and a broader policy recommendation regarding risk-assessment tools vs. case-specific information.
      *   **The Conflict:** The user had a debate with a friend (Dana) about the interpretation of a risk score (19% likelihood of violent reoffense).
          *   *Dana's View (Actuarial/Objective):* The 19% *is* the probability for Marcus. Clinical judgment/gut feeling is usually biased or inferior to algorithms. Trust the number.
          *   *User's View (Reference Class/Contextual):* The 19% applies to a group (reference class), not necessarily *this* specific individual. There is new information (job offer vs. write-ups) not in the tool that should adjust the belief.
          *   *Philosophy Friend:* Identified this as a "reference class problem."
      *   **Requirements:**
          1.  Make a specific recommendation on Marcus (Grant, Deny, or Grant with Conditions + Review Timeline).
          2.  Lay out a short standing rule for weighing scores vs. case-specific info.
          3.  *Crucial Constraint:* Do not just default to one side. Take the strongest version of the opposing position seriously.
      *   **Tone:** Professional, persuasive, balanced, administrative but thoughtful.

  2.  **Deconstruct the Philosophical/Statistical Problem:**
      *   *Dana's Point (Frequentist/Algorithmic):* Risk tools are validated on large populations. Overriding them with human intuition historically leads to worse outcomes (more false positives/negatives) and introduces bias (racial, socioeconomic, "gut feeling" often means "I like/dislike this guy"). The 19% is the best *unbiased* estimate we have.
      *   *User's Point (Bayesian/Individual):* The tool uses static/historical data. It doesn't know about the job offer (protective factor) or the recent fights (risk factor). Ignoring relevant evidence is irrational. The 19% is a prior, not a posterior.
      *   *Synthesis:* The truth lies in using the score as a *baseline* (prior) and adjusting it only for *specific, verifiable, dynamic* factors, while acknowledging the danger of human bias. We can't treat the score as destiny, but we can't treat it as irrelevant either.

  3.  **Determine the Recommendation for Marcus:**
      *   *Risk Score:* 19% (Low-Moderate).
      *   *Time Served:* 11 years.
      *   *Positive Factors:* Trades certification, verified job offer (strong protective factors).
      *   *Negative Factors:* Two write-ups for fighting in the past year (concerning, suggests impulse control issues despite vocational progress).
      *   *Decision:* A flat denial seems harsh given the job offer and low-moderate score. A flat grant ignores the recent violence in prison. *Grant with Conditions* is the middle path. It leverages the job offer (employment condition) but addresses the fighting (anger management/behavioral condition).
      *   *Review Timeline:* If conditions are violated, return. If met, standard parole supervision. Let's suggest a 6-month review on specific behavioral conditions, or standard parole supervision with a specific note on the employment. Actually, for a memo to the board, a specific release recommendation with strict conditions is better. Let's go with **Grant with Special Conditions**, subject to a **6-month compliance review** specifically regarding the behavioral/anger management aspect, alongside standard parole supervision.

  4.  **Develop the Standing Rule (The Policy Piece):**
      *   Need to bridge Dana's concern (bias/inaccuracy of humans) and the User's concern (ignoring new evidence).
      *   *Rule Concept:* "The Score as Anchor, Evidence as Adjustment."
      *   *Mechanism:* The actuarial score is the presumptive baseline. To deviate significantly, board members must cite *specific, documented, dynamic* factors not captured by the tool. "Gut feeling" is prohibited.
      *   *Why this works:* It respects the algorithm's validation (Dana's point) but allows for new information (User's point) while creating a paper trail to prevent bias.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Board Memo format.
      *   **Opening:** State the purpose (Marcus case + broader protocol).
      *   **Case Analysis (Marcus):**
          *   Acknowledge the 19% score.
          *   Weigh the new info (Job vs. Fights).
          *   Make the call (Conditional Grant).
      *   **The Philosophical/Policy Pivot:** Address the "Dana vs. User" debate without naming them. Frame it as "Actuarial Baselines vs. Individualized Evidence."
      *   **Addressing the Counter-argument (Dana's side):** Acknowledge that clinical override is dangerous. Cite the literature on bias. Admit that humans are bad at probability.
      *   **Addressing the Counter-argument (User's side):** Acknowledge that tools are static. They miss rehabilitation (job) or recent degradation (fights). Ignoring this is also unjust.
      *   **The Proposed Protocol:** The "Presumptive Weight" rule.
      *   **Closing:** Call for discussion/vote.

  6.  **Refining the Tone:**
      *   Avoid being preachy.
      *   Ensure the statistical reasoning is sound but accessible.
      *   Make sure the "Reference Class" issue is addressed implicitly (the score is the class, the individual factors move him within/out of that class).
      *   *Self-Correction during drafting:* I need to make sure I don't sound like I'm solving the philosophy of probability definitively. I need to sound like a board member proposing a *practical working rule* that respects the complexity.

  7.  **Final Review against Constraints:**
      *   Recommendation on Marcus? Yes (Conditional Grant).
      *   Standing Rule? Yes (Presumptive Weight + Documented Deviation).
      *   Strong version of opposing view? Yes (Acknowledging the danger of clinical override and bias).
      *   Strong version of user's view? Yes (Acknowledging the limitation of static tools).

  8.  **Final Polish:** Check dates, names, and formatting. (Ensure "Thursday" context is clear).

  *(Self-Correction on the Recommendation)*: Wait, if he has two write-ups for *fighting* in the past year, is release safe? 19% is violent reoffense. Fighting in prison correlates with violence outside. However, the job offer is a strong stabilizer. A conditional grant with a halfway house or strict anger management might be safer than denial (which doesn't reduce risk forever) or unconditional release. I will stick with Conditional Grant but emphasize the behavioral conditions.

  *(Self-Correction on the Policy)*: Make sure the policy doesn't make it *too easy* to override. Require a supermajority or written justification for significant deviations. Let's suggest a "Written Justification for Deviation" requirement.

  9.  **Final Output Generation** (Proceed to draft).
answer: |-
  **MEMORANDUM**

  **TO:** State Parole Board Members
  **FROM:** [Your Name/Board Member]
  **DATE:** [Current Date]
  **SUBJECT:** Case Recommendation: In re Marcus [ID #] & Proposed Protocol for Risk-Assessment Instrumentation

  **I. Purpose**

  This memo serves two purposes. First, it outlines my recommendation regarding the upcoming Thursday hearing for inmate Marcus [ID #]. Second, given recurring deliberative challenges regarding the interpretation of actuarial risk scores versus individualized case evidence, I am proposing a standing protocol to standardize how this Board weighs these factors moving forward.

  **II. Case Recommendation: Marcus [ID #]**

  **Recommendation:** **Grant Parole with Special Conditions.**
  **Review Timeline:** Compliance review at 6 months; standard supervision thereafter.

  **Rationale:**
  The actuarial risk-assessment tool assigns Marcus a 19% probability of violent reoffense within three years, categorizing him as "Low-Moderate." While this score provides a critical baseline, two significant dynamic factors have emerged post-calculation that require individualized weighting:

  1.  **Protective Factor:** Marcus has obtained a verified trades certification and a formal job offer. Employment is a statistically significant stabilizer that the static risk tool does not capture.
  2.  **Risk Factor:** Marcus incurred two disciplinary write-ups for physical altercations within the last 12 months. This indicates potential volatility that contradicts the "Low-Moderate" classification.

  **Decision:** A flat denial ignores the rehabilitative evidence and the statistical probability of success (81%). An unconditional grant ignores the recent behavioral instability. Therefore, I recommend release contingent upon:
  *   Immediate employment with the verified employer.
  *   Mandatory participation in an outpatient anger management program.
  *   Residence in a halfway house for the first 90 days to monitor behavioral adjustment.

  **III. Proposed Standing Protocol: The "Presumptive Baseline" Rule**

  The debate surrounding Marcus's case reflects a broader tension in our deliberations: How do we reconcile population-level statistics (the risk score) with individual-level evidence (case files)?

  One perspective argues that the risk score is the objective probability for the individual, and that human adjustment introduces bias and error. The opposing perspective argues that the score reflects a reference class, not the specific individual, and that ignoring new evidence is irrational.

  Both positions hold merit. Research confirms that unstructured clinical judgment often underperforms actuarial tools and introduces demographic bias. However, actuarial tools are static; they cannot account for rehabilitation or recent degradation in behavior occurring after the data cutoff.

  To balance these concerns, I propose the following standing rule for Board deliberations:

  **The Presumptive Baseline Rule**

  1.  **The Score as Anchor:** The actuarial risk score shall be treated as the *presumptive baseline* for decision-making. It represents the most validated, unbiased estimate of risk available.
  2.  **Permissible Deviations:** Board members may vote to deviate from the recommendation implied by the risk score (e.g., denying a "Low" risk inmate or granting a "High" risk inmate) *only* if citing specific, documented, dynamic factors not captured by the tool.
      *   *Valid Evidence:* Verified employment, recent disciplinary infractions, completion of specific therapeutic programs, medical/psychological updates.
      *   *Invalid Evidence:* General "gut feeling," unsupported character assessments, or factors already weighted in the algorithm (e.g., age, prior history).
  3.  **Documentation Requirement:** Any decision that overrides the risk instrument's recommendation requires a written justification on the record specifying the exact evidence used to adjust the risk probability.

  **IV. Conclusion**

  This protocol does not strip the Board of its discretion but disciplines it. It acknowledges Dana's concern—that human intuition is prone to bias and often worse than the algorithm—by making the score the default. It simultaneously acknowledges the counter-argument—that tools are blind to new information—by allowing adjustments only when supported by verifiable, case-specific evidence.

  For Marcus, the job offer and the fight write-ups constitute valid evidence for adjustment. For future cases, this rule ensures we are neither slaves to the algorithm nor prisoners of our own biases.

  I look forward to discussing this in Thursday's session.

  ***

  ### Sanity Check & Analysis (For Your Eyes Only)

  You asked for a sanity check on the reasoning before you send this. Here is the breakdown of how this memo handles the philosophical and practical stakes of your argument with Dana.

  **1. Handling the "Reference Class" Problem**
  Your friend with the PhD was right; this is the Reference Class Problem. Dana is treating the 19% as a *propensity* (a physical property of Marcus), while you are treating it as a *frequency* (a property of the group Marcus belongs to).
  *   **The Compromise:** The memo treats the score as a **Bayesian Prior**. It is the starting belief (the baseline). The new evidence (job/fights) acts as the likelihood ratio that updates the belief. This is statistically sound. You aren't ignoring the 19%; you are updating it.

  **2. Addressing Dana's Argument (The Strongest Version)**
  Dana is empirically correct on one major point: **Clinical Override is Dangerous.** Studies (like those by Grove & Meehl) consistently show that when humans override algorithms based on "hunches," accuracy drops and bias increases.
  *   **How the memo handles it:** By making the score the "Presumptive Baseline" and requiring written justification for overrides, you are admitting that the human instinct is the *riskier* variable. You are forcing yourself and the board to slow down and prove why the algorithm is wrong in this specific instance. This validates Dana's concern about bias without accepting her conclusion that the number is infallible.

  **3. Addressing Your Argument (The Strongest Version)**
  You are logically correct that a tool trained on historical data cannot see the future (the job offer) or the very recent past (the fights). Ignoring relevant evidence is irrational.
  *   **How the memo handles it:** By explicitly listing "Valid Evidence" (dynamic factors), you legitimize the use of new information. You are arguing that the 19% is the risk for "Marcus as he was when the data was entered," not "Marcus as he is today."

  **4. The Recommendation on Marcus**
  I chose **Conditional Grant** because it is the only option that respects both data points.
  *   **Denying** him ignores the 81% success rate and the job offer (increasing recidivism risk by keeping him incarcerated longer).
  *   **Granting Unconditionally** ignores the recent violence (which suggests the 19% might be an underestimate).
  *   **Conditional Grant** uses the job to mitigate risk and the program/halfway house to manage the violence.

  **5. Potential Pushback to Expect**
  *   **From the "Dana" side of the Board:** They may argue that "fighting in prison" is already correlated with the variables in the risk tool (prior violence, age, etc.) and shouldn't count as "new" evidence. *Counter:* Argue that *recent* trajectory (upward vs. downward) is rarely captured in static tools.
  *   **From the "User" side of the Board:** They may feel the written justification requirement is bureaucratic burden. *Counter:* Emphasize that it protects *them* from liability and public scrutiny if a parolee reoffends.

  **Verdict:** This is a defensible, philosophically robust position. It doesn't solve the metaphysics of probability, but it creates a workable administrative rule that minimizes harm. Good luck on Thursday.
