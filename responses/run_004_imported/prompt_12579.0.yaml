answer: |-
  First, congratulations. Three weeks post-op is still the thick of recovery, both physically and psychologically. The fact that you are processing this through moral philosophy rather than just "wow, my side hurts" is impressive, but also understandable given the social noise you're receiving.

  To answer your primary questions immediately: **No, you are not butchering the concepts.** And **no, this is not just overthinking.** You have stumbled onto one of the most persistent and uncomfortable tensions in normative ethics, and you are doing it from the vantage point of someone who actually *did the thing*, which gives your essay a weight most philosophy papers lack.

  Here is the breakdown of where you stand philosophically, specifically regarding your doubts on Scheffler and the "polite fiction" question.

  ### 1. The Philosophy Check
  Your summary of Urmson is spot on. The tripartite division (obligatory, permissible, forbidden) indeed fails to capture the intuition that some acts are good to do but not bad to omit.

  Your grasp of the Utilitarian problem is also correct. Classical Act Utilitarianism (maximize utility) is notoriously hostile to supererogation. If Act A produces 10 units of good and Act B produces 5, Act A is obligatory. To call it "optional" is, in that framework, a moral error. This is the "Demandingness Objection" in a nutshell.

  **On Scheffler:** You wrote: *"Scheffler patched this... except that move feels like it was built backward from wanting supererogation to exist, not from any independent motivation for it."*

  You are not missing something here; you have identified the central critique of Scheffler's *The Rejection of Consequentialism*. Scheffler introduces the "agent-centered prerogative" to allow agents to give disproportionate weight to their own interests. He argues this is necessary to preserve the integrity of personal projects (which give life meaning).

  However, you are right to feel it is "built backward." Scheffler is engaging in **reflective equilibrium**. He starts with the intuition that "it shouldn't be mandatory to jump on the grenade" and works backward to find a principle that allows that. He admits this is a modification of consequentialism to save it from being self-defeating (by destroying the agent's personal life).
  *   **Is it ad hoc?** Many critics say yes. It lacks the clean, first-principle derivation of pure utilitarianism or Kantianism.
  *   **Is it useful?** Yes, because pure utilitarianism is psychologically unsustainable for almost everyone.
  *   **Your Instinct:** Your suspicion that it's a "patch" is philosophically literate. You aren't failing to understand it; you are correctly identifying that it is a compromise position between maximizing good and preserving human psychology.

  ### 2. The Kidney: Duty or Extra Credit?
  This is where your essay has teeth. Your EA friend is applying a strict Singerite logic: *If the cost to you is less than the benefit to them, it is obligatory.*

  However, your essay hints at the flaw in your friend's calculation without explicitly stating it: **The definition of "cost."**

  Singer's drowning child analogy relies on "small cost" (muddy clothes, ruined watch). A nephrectomy is not muddy clothes. It is general anesthesia, surgical risk, recovery time, and a statistical reduction in renal reserve.
  *   **The Utilitarian Calculation:** Even under strict utilitarianism, kidney donation is not *clearly* obligatory unless you accept that your one kidney is worth significantly less than a stranger's two. Most utilitarians draw the line at "significant bodily integrity."
  *   **The Supererogatory Line:** This is why your confusion is valid. If you accept the *Strong Principle* (save until marginal utility equals loss), it's obligatory. If you accept the *Moderate Principle* (save until serious sacrifice), it's supererogatory.

  You are not butchering this; you are highlighting that the "line" is arbitrary. The line moves depending on how much you value your own bodily wholeness versus another's life.

  ### 3. Is Supererogation a "Polite Fiction"?
  You ask: *"Is that a sign the category is doing real philosophical work, or a sign that it's mostly a polite fiction we use so we don't have to call non-donors negligent?"*

  This is the strongest paragraph in your snippet. Here is the argument for why it is **real work**, not just fiction:

  **1. Incentive Structures:** If we classify kidney donation as *obligatory*, we shift the social mechanism from **praise** to **blame**.
  *   *Supererogatory:* "Wow, you did that? You're amazing." (Incentivizes others through aspiration).
  *   *Obligatory:* "You didn't do that? You're negligent." (Incentivizes others through guilt/shame).
  *   Psychologically, shame is often a worse motivator for high-cost bodily sacrifice than aspiration. If donation becomes a duty, people might hide their refusal, or resent the system, rather than be inspired by donors. The category of supererogation protects the *voluntary* nature of the act, which is medically and ethically crucial for organ donation.

  **2. The Sustainability of Morality:** If every act that produces net good is obligatory, morality becomes a life-consuming engine. Most humans cannot live that way without burning out or becoming resentful. The category of supererogation acknowledges human limitation without calling it sin. It allows us to say, "You don't *have* to do this, but the world is better because you *chose* to."

  **3. Agency:** There is a specific moral value in *choice*. A robot programmed to maximize utility cannot be a hero. A human who *could* keep their kidney but *chooses* to give it exercises a moral muscle that is distinct from mere compliance. Supererogation preserves the space for moral creativity.

  ### Feedback on the Essay
  **Keep it.** The voice is strong. It's rare to read philosophical reasoning grounded in fresh surgical scars.

  **Suggestions for refinement:**
  1.  **Lean into the Scheffler doubt.** Don't apologize for feeling it's "built backward." Argue that *all* moral theories that accommodate human psychology are built backward from human reality. That doesn't make them wrong; it makes them humane.
  2.  **Address the "Cost" variable.** Explicitly challenge your EA friend's math. A kidney is not $500. It is a piece of your biological future. Acknowledge that even under utilitarianism, bodily integrity usually trumps statistical life-saving *unless* you subscribe to a very specific, radical view of self-ownership.
  3.  **The "Hero" Label.** You mention the "hero/saint" label felt nice then annoying. Consider ending on why the *category* of supererogation protects you from the label. If it's supererogatory, you are praiseworthy. If it's obligatory, you are just compliant. Paradoxically, your friend trying to make it "obligatory" diminishes the moral weight of your choice, not elevates it.

  **Verdict:** You aren't overthinking. You are grappling with the "Demandingness Objection" from the inside. That is genuinely interesting. Write the essay. And please, rest up.
