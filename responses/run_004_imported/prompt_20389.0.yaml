answer: |-
  **MEMORANDUM**

  **TO:** Long-Range Capital-Planning Committee
  **FROM:** [Name], Emeritus Professor of Biology
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Futarchy Pilot Proposal

  **Introduction**

  For thirty years, I studied how headless colonies of ants and bees make life-or-death decisions without leaders, ballots, or markets. They rely on decentralized signaling—pheromones, waggle dances—to aggregate local information into a coherent collective choice. Since retiring, I have turned to philosophy, specifically the difficulty of translating human values into actionable premises. It is from this dual vantage point—biological mechanism and normative ethics—that I evaluate our economist colleague's proposal to pilot Robin Hanson's *futarchy*.

  The proposal suggests we "vote on values, bet on beliefs." We would agree on a metric of institutional welfare, then allow conditional prediction markets to determine whether a new research building or expanded graduate housing better serves that metric.

  **Recommendation**

  I recommend that the committee **approve a limited, highly constrained pilot of the futarchy mechanism**, provided that specific safeguards regarding market liquidity and timeline realism are implemented.

  While I share the philosophical concerns regarding the quantification of university values, the capital planning process currently suffers from information silos and status bias. A well-designed market can function as a "swarm intelligence" mechanism, surfacing dispersed knowledge about project risks and benefits that traditional deliberation misses. However, human markets are not ant colonies; they are susceptible to predation and moral hazard. Therefore, this pilot must be treated as an experiment in information aggregation, not a binding abdication of governance.

  **Proposed Terms and Timeframe**

  To mitigate the risks of manipulation and structural failure, I propose the following modifications to the economist's initial scheme:

  1.  **Metric Validation:** The composite welfare metric (research output, retention, etc.) must be approved by a two-thirds supermajority of the committee *before* markets open. If the definition of "welfare" is contested, the market signal will be noise.
  2.  **Timeline Adjustment:** A resolution horizon of "one year after funding" is biologically and structurally unrealistic for construction projects. I recommend the market resolve based on metrics measured **three years post-completion**, or utilize verified intermediate milestones (e.g., occupancy rates, grant applications filed) to prevent the market from betting on short-term noise.
  3.  **Liquidity and Manipulation Safeguards:**
      *   **Subsidized Liquidity:** The university must act as a market maker to ensure thin trading does not allow a single wealthy actor to skew prices.
      *   **Position Limits:** Cap individual trading exposure to prevent any single faction from manufacturing a "price" that does not reflect genuine belief.
      *   **Anonymity:** Trades should be anonymized to reduce social pressure and lobbying, but auditable by a neutral third party to detect collusion.
  4.  **Advisory Status:** The market result should serve as a **binding recommendation** to the committee, not an automatic trigger. The committee retains veto power if the market outcome violates fiduciary or ethical constraints. This preserves ultimate accountability.

  **The Strongest Objection: Legitimacy and Commensurability**

  Those opposing this pilot raise a profound objection that deserves more than a pragmatic dismissal. Their argument is not merely that markets might fail, but that they *should* not be used for this purpose.

  The core of this objection is that futarchy attempts to launder a normative disagreement as an epistemic one. The choice between a research building and graduate housing is not merely a calculation of efficiency; it is a statement about what the university *is*. Is it a factory for grants, or a community for scholars? By forcing this choice into a single composite metric, we may create the illusion of consensus where none exists.

  Furthermore, the comparison to the Pentagon's 2003 Policy Analysis Market (PAM) is apt. The PAM was canceled not because the economic theory was necessarily flawed, but because it was perceived as morally repugnant to bet on political instability. Similarly, allowing faculty and students to financially profit from predictions about graduate retention or research failure could create perverse incentives. If a bettor profits because a housing project fails to retain students, have they merely predicted the future, or have they been incentivized to ensure that failure? Even if manipulation does not occur, the *appearance* of betting against the institution's welfare may erode trust in the committee's legitimacy. A decision reached by market pricing lacks the democratic legitimacy of a vote, potentially making the outcome harder to implement if it displeases the campus community.

  **Conclusion**

  In ant colonies, the mechanism of decision-making is inseparable from the survival of the colony. In human institutions, the mechanism is also a message. Using a prediction market signals that we value dispersed information and are willing to test our assumptions against financial skin-in-the-game. However, we must ensure we do not signal that we value price over purpose.

  By adopting the pilot with the safeguards outlined above—specifically retaining final committee veto power and extending the timeline—we can test the utility of this tool without surrendering our governance to the highest bidder. I urge the committee to proceed, but with the caution of a philosopher and the structural rigor of a biologist.
