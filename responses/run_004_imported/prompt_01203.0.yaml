answer: |-
  Your suspicion is well-founded. While Émilie du Châtelet's *Discourse on Happiness* (c. 1748) is undeniably hedonistic in its conclusion—that pleasure is the sole end of human action—labeling it "Epicurean" without significant qualification obscures profound philosophical divergences. Your group's debate touches on one of the most fascinating tensions in eighteenth-century moral philosophy: the appropriation of ancient schools to serve modern, often conflicting, psychological insights.

  To answer your core question: **Du Châtelet's embrace of destabilizing passions and self-serving illusions amounts to a genuine rejection of core Epicurean commitments.** While she adopts the Epicurean *telos* (pleasure), she inverts the Epicurean *techne* (the method of achieving it).

  Here is a detailed comparison of her account with Epicurus's, followed by an assessment of whether the label "Epicurean" remains apt.

  ### 1. The Nature of Pleasure: *Katastematic* vs. *Kinetic* Intensity
  The most fundamental divergence lies in what counts as the highest pleasure.

  *   **Epicurus:** Distinguishes between *kinetic* pleasures (the active process of satisfying a desire, e.g., eating when hungry) and *katastematic* pleasures (the state of equilibrium once the desire is satisfied, e.g., the feeling of fullness and absence of pain). Epicurus explicitly prioritizes *katastematic* pleasure (*ataraxia* and *aponia*). The goal is a stable, static condition where the soul is not disturbed. Intensity is often viewed with suspicion because high peaks imply the possibility of deep valleys (pain).
  *   **Du Châtelet:** Her account is almost exclusively focused on *kinetic* intensity. For her, happiness is not the absence of pain but the presence of vivid feeling. She argues that "uniformity" and "tranquility" are indistinguishable from boredom (*ennui*), which she views as the greatest evil.
  *   **The Conflict:** When Du Châtelet defends gambling or theater, she is defending the *agitation* of the soul. For Epicurus, gambling is anathema because it introduces anxiety and the risk of loss (disturbance). For Du Châtelet, the anxiety *is* the point; the fluctuation of hope and fear generates the "vivacity" necessary to feel alive. She rejects the Epicurean preference for stability in favor of a modern preference for stimulation.

  ### 2. The Epistemology of Happiness: Truth vs. Illusion
  This is the most radical point of departure and the one that most strongly undermines the "Epicurean" label.

  *   **Epicurus:** Believes that unhappiness stems from false beliefs (fear of gods, fear of death, belief that wealth is necessary). The Epicurean cure is *physics* and *logic*: understanding the material nature of the universe to dispel superstition. For Epicurus, truth is therapeutic. To be happy, one must see the world as it is.
  *   **Du Châtelet:** Argues that unhappiness stems from *disillusionment*. She posits that reality is often too harsh or too dull to sustain happiness. Therefore, we must cultivate the ability to be deceived. As she famously writes, "We owe our pleasures to illusions."
  *   **The Conflict:** Epicurus seeks to cure the patient by removing the illusion. Du Châtelet seeks to cure the patient by administering the illusion. For Epicurus, the sage knows that death is nothing to us; for Du Châtelet, the happy person is the one who can successfully ignore or obscure that fact to maintain their drive. This makes her view psychologically pragmatic but epistemologically anti-Epicurean.

  ### 3. The Economy of Desire: Reduction vs. Cultivation
  Both philosophers agree that unbridled desire leads to pain, but their strategies for managing desire are opposites.

  *   **Epicurus:** Advocates pruning desire. He categorizes desires into natural/necessary, natural/unnecessary, and vain/empty. The goal is to reduce needs to the bare minimum (natural/necessary) so that happiness is easily secured and fortune cannot easily disrupt it. Regarding erotic love, Epicurus is famously wary, advising that sexual intercourse never profited anyone and one should be satisfied if it hasn't harmed them. He views passion as a form of madness (*tarache*) that disrupts *ataraxia*.
  *   **Du Châtelet:** Advocates cultivating desire. She argues that we cannot change our nature, and since we are made to have passions, suppressing them leads to misery. Instead of reducing desires, we should multiply the *objects* of our taste so we are never without a source of pleasure. Regarding love, she views passionate attachment as one of the few things capable of providing the intense illusion required for supreme happiness.
  *   **The Conflict:** Epicurus tries to make the self invulnerable to fortune by needing less. Du Châtelet tries to make the self resilient by engaging more deeply with fortune (even through illusions). Her defense of romantic passion is a direct contradiction of the Epicurean warning against eros.

  ### 4. Is "Epicurean" Still an Apt Label?
  If the label "Epicurean" implies adherence to the doctrines of the Garden (static pleasure, truth-based tranquility, limitation of desire), then **no, it is not apt.** It is historically understandable—18th-century France often used "Epicurean" as a catch-all term for any secular hedonism opposed to Christian asceticism or Stoic rigor—but philosophically it is misleading.

  However, there is a sense in which she is an **Epicurean Revisionist**. She accepts the *axiom* of hedonism (pleasure is the good) but updates the *psychology* to fit a modern, social, and ambitious worldview. She recognizes that the ancient model of the "sage in the garden" is incompatible with the life of a woman in the court of Versailles or the salon of Paris.

  ### Better Characterizations
  If "Epicurean" is too blunt, how else might we characterize her view?

  **1. Voltairean Hedonism**
  Du Châtelet was Voltaire's intellectual partner for many years, and her view mirrors his *mondain* (worldly) philosophy. Like Voltaire, she believes in cultivating one's garden, but hers is a garden of active engagement, arts, and social intrigue, not withdrawal. This brand of hedonism values *diversion* (in the Pascalian sense, but without the guilt) as a positive good.

  **2. Psychological Sentimentalism**
  Du Châtelet places the *feeling* of the subject above the *reality* of the object. This aligns her more with the emerging tradition of Sentimentalism (think Rousseau or later Romanticism) than with ancient materialism. The value of an experience lies in the intensity of the sentiment it produces, regardless of its truth value.

  **3. Libertine Naturalism**
  In the seventeenth and eighteenth-century French context, "Libertine" (*libertin*) did not just mean sexually promiscuous; it referred to a *libertin érudit*—a free-thinker who rejected religious dogma and often ancient moral strictures in favor of a morality based on nature and reason. Du Châtelet fits this well. She argues that since nature gave us passions, it is "natural" to use them, and "reason" dictates we use them in ways that maximize pleasure (even via illusion).

  ### Conclusion for Your Group
  You can validate your group's Epicurean reading by acknowledging the shared **hedonistic consequentialism**: both judge actions solely by their capacity to produce pleasure and avoid pain. Both also share a **naturalistic ethics**, rejecting divine command or duty for duty's sake.

  However, you should argue that Du Châtelet represents a **modernization that breaks the ancient vessel.** She takes the Epicurean engine (hedonism) and installs it in a Ferrari (high-intensity, illusion-dependent, passion-fueled life) rather than the sedan Epicurus designed (low-maintenance, truth-dependent, tranquil life).

  If you need a precise label, **"Illusionist Hedonism"** or **"Dynamic Hedonism"** captures her specific contribution better than "Epicurean." She teaches that happiness is not a state of rest to be found in truth, but a state of motion to be manufactured through artifice. That is a distinctly modern, and distinctly un-Epicurean, insight.
