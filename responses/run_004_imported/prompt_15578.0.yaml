      *   **Tone:** Academic, sharp, respectful but challenging (seminar style).

  2.  **Deconstruct the Required Topics & Brainstorm Angles:**

      *   *Topic 1: Rectification.* Nozick admits in *Anarchy, State, and Utopia* (ASU) that historical injustices are pervasive. If we try to rectify them, we might not know the counterfactual history. Nozick suggests a "rough rule of thumb" might look like a patterned principle (e.g., Rawls's Difference Principle).
          *   *Angle:* If rectification collapses into patterned distribution, what work is the entitlement theory actually doing in the real world?
          *   *Follow-up:* If they say "we can't know history," press on why we should privilege current holdings then.

      *   *Topic 2: Cohen (Self-Ownership vs. World-Ownership).* Nozick assumes self-ownership implies strong property rights over external resources. Cohen argues you can believe in self-ownership but believe the world is jointly owned.
          *   *Angle:* Does self-ownership alone generate the right to appropriate unlimited external resources without consent of others?
          *   *Follow-up:* If they say "mixing labor," press on why mixing what I own (labor) with what no one owns (land) gives me exclusive ownership of the whole.

      *   *Topic 3: Taxation as Forced Labor (Nagel/Murphy).* *The Myth of Ownership*. Property rights are legal constructs defined by the state. You can't claim pre-political rights to income that is only definable within a tax system.
          *   *Angle:* If property rights are constituted by the legal system (which includes tax laws), how can taxation be "taking what is mine"?
          *   *Follow-up:* If they say "natural rights," press on how those rights function without the state's enforcement mechanism.

      *   *Topic 4: The Wilt Chamberlain Argument itself (Limitations).* The prompt says they use it *every time*. Need to question its applicability beyond voluntary exchange.
          *   *Angle:* Does the argument assume a baseline of equality that is unrealistic? Or does it ignore power dynamics?
          *   *Follow-up:* Focus on the "voluntariness" of the exchange.

      *   *Topic 5: Lockean Proviso.* Nozick adds the proviso that appropriation must not worsen the situation of others.
          *   *Angle:* How is "worsening" measured? Baseline of nature or baseline of equality?
          *   *Follow-up:* If environmental degradation occurs, does that violate the proviso?

      *   *Topic 6: Intergenerational Justice/Inheritance.* Entitlement theory allows unlimited accumulation and transfer.
          *   *Angle:* Does unlimited inheritance undermine the liberty of the next generation (starting gate equality)?
          *   *Follow-up:* If liberty includes opportunity, doesn't massive inheritance restrict the liberty of non-heirs?

      *   *Topic 7: The Minimal State's Stability.* Can a minimal state stay minimal?
          *   *Angle:* Won't economic power inevitably translate to political power, requiring redistribution to maintain liberty?
          *   *Follow-up:* If they say "no," ask for historical evidence.

      *   *Topic 8: Moral Arbitrariness (Rawls counter).* Nozick rejects end-states because they ignore choices. But talents are arbitrary.
          *   *Angle:* If talents are morally arbitrary, why is the market return on those talents sacrosanct?
          *   *Follow-up:* Distinguish between earning *something* vs. earning *market value*.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Drafting Q1 (Rectification):* Focus on the "historical shadow." If past injustice is everywhere, current holdings are tainted. Nozick says rectification might look patterned.
          *   *Follow-up:* If it looks patterned, why fight patterned principles theoretically?
