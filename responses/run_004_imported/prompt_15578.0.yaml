      *   *Drafting Q6 (Inheritance/Starting Gate):* Liberty of the next generation.
          *   *Follow-up:* Does the liberty of the dead outweigh the liberty of the living?
      *   *Drafting Q7 (Market Value vs. Contribution):* Talents are arbitrary. Market values them differently.
          *   *Follow-up:* Why is the *market valuation* of talent a matter of entitlement rather than social convention?
      *   *Drafting Q8 (The State's Role):* Enforcement costs.
          *   *Follow-up:* If enforcement requires redistribution, is the minimal state coherent?

