          *   *Follow-up:* If the world is jointly owned, doesn't appropriation require consent?
      *   *Drafting Q3 (Nagel/Murphy):* Property is legal. Taxation defines property.
          *   *Follow-up:* If property is pre-political, how do you enforce it without a state that taxes?
      *   *Drafting Q4 (Wilt Chamberlain/Voluntariness):* The exchange is voluntary, but is the background just?
