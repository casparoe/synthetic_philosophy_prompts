          1.  Rectification Problem (Nozick's footnote, historical injustice vs. patterned principles).
          2.  Cohen's Critique (Self-ownership vs. World-ownership).
          3.  Taxation as Forced Labor (Nagel/Murphy critique: property rights depend on the legal/tax system).
