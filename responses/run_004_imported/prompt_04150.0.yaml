answer: |-
  The ice in Arthur's whiskey had long since surrendered, diluting the amber liquid into something pale and tepid. Across the sticky table, Maya's phone buzzed, face down. She ignored it.

  "You didn't see the second act," Arthur said. He wasn't angry, just stating a fact, like noting a typo in a manuscript.

  "I saw the livestream of the opening," Maya countered, swirling her gin. "And I read the director's notes. And I trust your reaction to the climax. You texted me during intermission: 'It collapses.' I know what that means coming from you."

  "You know what *I* felt. You don't know if the play *earned* that collapse." Arthur leaned forward, the leather of his jacket creaking. "That's the job, Maya. To stand in the room and let the thing happen to you. You can't outsource the collision."

  "Why not?" Maya's voice was sharp, but not defensive. "If I trust a structural engineer's report that a bridge is safe, I drive across it. I don't need to personally calculate the load-bearing stress of the steel to know it's sound. If you're the engineer, Arthur, why isn't your word enough?"

  "Because a bridge's safety is a fact. It exists independently of your experience of it," Arthur said. "Aesthetic value isn't a property sitting in the object like iron in the steel. It's a spark that jumps between the object and the viewer. If you aren't there to complete the circuit, there is no spark. There's just a report about a spark."

  "That's romantic, but it's inefficient. And honestly? It's elitist." Maya took a sip. "We live in a world of infinite content and finite time. If I calibrate my taste against yours over ten years, I know how your nervous system reacts. If you say the pacing dragged, I can justifiably believe it dragged. I'm not claiming I felt the drag. I'm claiming I *know* it dragged."

  "But do you?" Arthur tapped his glass. "Imagine I tell you a joke. I say, 'It was hilarious.' You believe me. But do you know it's funny? No. You know that *I laughed*. To know it's funny, you have to laugh. Aesthetic concepts—'funny,' 'moving,' 'tedious'—are response-dependent. You can't grasp the concept without the response."

  "Okay, but that's about *feeling*," Maya said. "I'm talking about *judgment*. I'm writing a review for subscribers who also won't see the show. I'm synthesizing data. If I rely on the testimony of three critics whose sensibilities I map, plus the video feed, I'm forming a justified belief about the work's quality. Why is moral testimony different? If a philosopher I respect tells me an action is unjust, I can believe it's unjust without working through the categorical imperative myself."

  Arthur shook his head. "There's a huge debate on that, actually. But even if you can inherit moral knowledge, art is different. Moral truth is about action. Art is about attention. If you skip the attention, you miss the point of the thing. You're treating the play like a package to be delivered. 'It's good, three stars.' But the 'goodness' isn't the package. The 'goodness' is the unpacking."

  "So criticism is just a diary entry?" Maya laughed, a short, dry sound. "Then why publish it? If the value is solely in my private experience of the unpacking, keep it to yourself. No, we publish because the judgment has value *apart* from the experience. It helps people navigate. It creates a culture."

  "It creates a culture of opinions without roots," Arthur said softly. "You're building a house on borrowed foundations. You might get the verdict right—maybe the play *was* terrible. But your belief isn't knowledge. It's hearsay. You're a parrot with a thesaurus."

  Maya didn't flinch. "I'm a curator. Look, Arthur, the Acquaintance Principle works for the artist. They need the experience to make it. But the critic? The critic is a translator. If I can translate the consensus of the room, the vibe of the stream, and your text message into a coherent analysis of why the lighting failed to support the mood, haven't I done the work? I'm analyzing the *effects*, even if I didn't feel the *cause*."

  "You're analyzing the *symptoms*," Arthur corrected. "You're diagnosing an illness you haven't seen in the patient. You're reading the chart. Sometimes the chart is wrong. Sometimes the patient is lying. Only being in the room lets you smell the lie."

  "And sometimes being in the room makes you myopic," Maya shot back. "You hate new technology. You hate immersive theater. Your presence in the room biases you. My distance gives me objectivity. I see the pattern of the reception, not just the reception itself. I'm not claiming I know what it *felt* like. I'm claiming I know what it *is*."

  Arthur sat back, finally looking tired. "That's where we are, then. You think the play is a thing in the world, like a bridge. I think the play is an event. A happening."

  "I think the play is a text," Maya said. "And texts can be read second-hand."

  "And I think it's a performance," Arthur said. "And performance dies the moment it stops happening. You're reviewing a ghost."

  "Then I'm reviewing the haunting," Maya said, picking up her phone. "And the subscribers care more about whether the house is haunted than whether I saw the ghost myself."

  Arthur watched her light up the screen. "You'll write a brilliant review, Maya. It will be insightful, well-argued, and completely hollow."

  "And yours," she said, not looking up, "will be deeply felt, profoundly authentic, and read by twelve people. We're both serving the art, Arthur. Just different gods."

  Arthur picked up his watered-down whiskey. He didn't drink. He just held it, weighing the glass. "One of us is wrong about what criticism is for."

  "Maybe," Maya said. "Or maybe criticism is big enough to be two things at once."

  She sent the email. The subject line read: *Review: The Hollow Man.* Arthur watched the cursor blink, wondering if she knew the irony, or if she just didn't care.
