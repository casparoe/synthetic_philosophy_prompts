answer: |-
  This is an excellent set of questions. You have identified the two weakest links in Weil's chain of reasoning here, or at least the two points where her poetic intuition demands more philosophical scaffolding than she explicitly provides in that specific paragraph. Your seminar discussion likely stalled because the water analogy is doing a tremendous amount of heavy lifting, and it relies on a specific (and contestable) sociology of knowledge.

  Here is a reconstruction of the logic, addressing your two specific hurdles: the nature of "collective passion" versus individual passion, and why parties are the unique culprit.

  ### 1. The Physics of the Analogy: Vectors vs. Currents

  Your first question asks what distinguishes a "collective" passion from a situation where many individuals separately have passions. You are right to suspect that Weil is asserting a qualitative difference rather than proving one. However, the distinction relies on a specific model of social geometry, heavily influenced by Rousseau but radicalized by Weil.

  **The Rousseauian Baseline (Vector Cancellation)**
  In *The Social Contract* (Book II, Chapter 3), Rousseau argues that the General Will emerges from the sum of private wills. He uses a mathematical metaphor: if you take the "pluses and minuses" of private interests, they cancel each other out, leaving the General Will as the remainder.
  *   **Weil's Water:** This corresponds to the "ceaseless, disordered motion" of the drops. Drop A moves North (self-interest), Drop B moves South (conflicting self-interest). The surface remains level.
  *   **The Epistemic Claim:** Stillness equals truth. A mind (or a people) that is not being pushed in a specific direction by desire is capable of "attention" (a key Weil concept) and can reflect reality ("mirror exactly whatever is set before it").

  **The "Collective" Difference (Vector Alignment)**
  Weil's distinction between *individual* passion and *collective* passion is not about the *number* of people feeling passion, but about the **alignment of vectors**.
  *   **Individual Passions:** Even if everyone is passionate, if Person A is passionate about X and Person B is passionate about Y, their forces oppose or diverge. The water churns locally but the macro-surface remains relatively still.
  *   **Collective Passion:** This occurs when the vectors align. If Person A, B, and C are all passionate about X *in the same direction at the same time*, the forces do not cancel; they compound.
  *   **The Qualitative Shift:** Weil is drawing on crowd psychology (reminiscent of Le Bon, whom she read, though she critiques him). She argues that when passion becomes collective, it ceases to be a sum of individual judgments and becomes a singular force. The individual drop loses its autonomy and becomes part of the current.

  **Is it just asserted?**
  Yes, largely. Weil assumes that human beings are suggestible enough that "collective passion" overrides individual friction. In a crowd, I do not oppose your passion; I catch it. The "missing premise" here is a psychological claim: **Human attention is contagious.** When the water moves as a mass, the individual drop cannot remain still unless it possesses "sainthood" (supernatural grace, in Weil's Catholic mysticism). She is arguing that the *social pressure* of a collective current creates a coercive force that individual disagreement cannot withstand.

  ### 2. Why Parties? (The Structural Argument)

  Your second question is the stronger critique: Nationalism, media, and referendums can also create currents. Why single out parties for *abolition*?

  To answer this, you have to look at how Weil defines a "party" later in the essay. She does not define a party merely as a group of people with similar policy preferences. She defines it by its **mechanism of action.**

  **The Missing Premise: Parties are Engines of Alignment**
  Weil argues that political parties are *institutional machines designed to manufacture collective passion.*
  *   **Nationalism** is a sentiment. It *can* create a current, but it is often diffuse.
  *   **Media** is a medium. It *can* transmit a current, but it is often chaotic or competing.
  *   **A Political Party,** for Weil, is defined by two things:
      1.  **The desire for growth:** A party must expand its influence to survive.
      2.  **Collective pressure on thought:** To maintain cohesion and growth, a party must align the wills of its members.

  Weil's argument is that parties *require* the water to be in motion to function. A party cannot exist in "still water" because still water implies individuals thinking independently. If individuals think independently, they will not vote as a bloc, donate consistently, or attend rallies. Therefore, the party *structure* necessitates the creation of the "current."

  **The Argument for Abolition**
  Weil isn't saying parties are the *only* thing that can stir the water. She is arguing they are the **legitimized** source of the disturbance within a democracy.
  *   In a democracy, we accept parties as the method of organizing will.
  *   Weil argues this is a category error. Organizing will via parties creates artificial currents (factionalism) that prevent the "level surface" (truth/General Will) from forming.
  *   Nationalism or media might be external storms, but parties are the *internal engines* installed in the ship of state.

  **Does she earn this conclusion later?**
  Yes. Immediately following the water analogy, she moves into an analysis of the "party spirit." She argues that the very structure of party membership demands that a member substitute the party's truth for reality.
  *   *Example:* If the party line is "The economy is booming," a member is pressured to believe it, even if their individual observation (their "drop" motion) suggests otherwise.
  *   This is why she singles them out: They formalize the suppression of the "canceling out" mechanism. They tell the drops: "Do not move randomly; move North."

  ### Reconstructing the Logic for Your Seminar

  If you are going back to class, here is a way to frame the reconstruction that acknowledges the gaps while clarifying her intent:

  1.  **The Epistemic Condition:** Truth in politics requires "stillness" (the absence of coercive collective pressure), allowing for individual attention to reality. (The Water Surface).
  2.  **The Threat:** "Collective passion" creates a "current" that overrides individual attention. This is distinct from individual passion because it aligns vectors rather than canceling them. (The Current).
  3.  **The Diagnosis:** While many things can create currents (nationalism, war), **political parties** are the only democratic institution *structurally designed* to sustain and amplify these currents permanently. They turn temporary passions into permanent factions.
  4.  **The Conclusion:** Therefore, to achieve the condition of truth (stillness), the institutional engines of alignment (parties) must be removed.

  ### A Critical Pushback (For Discussion)

  Since this is a seminar on "Democracy and Its Critics," your professors will likely welcome a critique of the analogy itself. Here is where you can push back:

  *   **The "Still Water" Fallacy:** Is a "level surface" actually desirable? Rousseau thought so, but modern pluralists argue that the "churn" of competing parties is how we *find* the truth, not an obstacle to it. Weil assumes truth is static (waiting to be mirrored), whereas democrats often assume truth is dynamic (forged through conflict).
  *   **The Party Monopoly:** You are right to question if parties are uniquely bad. In 1943, Weil was writing against the backdrop of totalitarian single-party states (Nazism, Stalinism) and the collapse of the French Third Republic. She conflates *competitive* parties with *totalizing* parties. One could argue that competitive parties actually *prevent* a single collective passion from seizing the whole people (by keeping the vectors opposed), whereas a referendum or nationalist wave is actually more dangerous to the "still water" than a parliament full of bickering parties.

  **Summary:** You haven't misread the water. The analogy asserts that collective alignment creates a force individual randomness does not. The leap to parties relies on the claim that parties are the *institutionalization* of that alignment. Your skepticism about whether other forces (media, nationalism) might be equally culpable is a valid and strong critique of Weil's specific focus. She chooses parties because they are the formal mechanism of democracy, and she wants to argue that the mechanism itself is the disease.
