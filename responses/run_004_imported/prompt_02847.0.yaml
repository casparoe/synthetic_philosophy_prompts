  So a while back someone showed me this brain-breaking puzzle about math and meaning -- i think the weird alternate rule in it is called 'quus' or something like that. The idea is that there's no actual fact about whether I've ever meant 'plus' when I use the plus sign, since some totally different rule could match every calculation I've ever done but spit out a different answer on some new number, and nothing about my past behavior or brain state could ever rule that out. It's kind of stuck with me since, this creeping feeling that maybe none of my words have ever definitely meant one specific thing rather than another. Could you write me a short story that captures that exact floor-dropping-out feeling? Doesn't need to involve math or philosophy explicitly, just want it to hit that same nerve.
