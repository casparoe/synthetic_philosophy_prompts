answer: |-
  The path through the woods was one they had walked every Sunday for seven years. Three miles of packed dirt, roots, and stone. Elias walked a step ahead of Mara. He knew the terrain. He knew where the loose shale began, where the oak root tripped the unwary, where the path narrowed.

  His ritual was simple. When the way was clear, he said, "Walk." When there was an obstacle, he stopped.

  For seven years, the ritual had never failed. Elias would say "Walk," and Mara would step forward. Her foot would find earth. She would catch up to him. He would say "Walk" again.

  It was a damp November morning when the frost made the stones slick. They reached the creek crossing. Usually, it was dry stones, hopscotch style. Today, the water was high, lapping over the first stone.

  Elias looked at the stone. It looked solid enough. He looked at Mara, waiting behind him, trusting the rhythm of their years. He said, "Walk."

  Mara stepped. Her boot hit the stone, slid on the algae-hidden ice, and she went down into the freezing water. She didn't break a bone, but the shock was absolute. The silence that followed was louder than the creek.

  Elias helped her up. They stood on the bank, dripping, shivering. There was no anger in her face, only a strange, hollow confusion.

  "I said 'Walk'," Elias said. His voice sounded thin.

  "I heard you," Mara said.

  "You stepped."

  "I stepped."

  They began to hike back to the car in silence. The rhythm was broken. Elias opened his mouth to apologize, but the words stuck in his throat. He was thinking about the word *Walk*.

  "Did you mean 'move your leg'?" Mara asked suddenly. They had stopped by the car. She was wringing out her sock.

  Elias blinked. "What?"

  "The word. 'Walk'." She looked at him, her eyes wide and unblinking. "For seven years, every time you said it, I moved my leg. And every time I moved my leg, there was ground. So I thought the rule was: *When Elias says Walk, move your leg.*"

  Elias felt a coldness in his stomach that had nothing to do with the water. "I thought... I thought the rule was: *When the ground is safe, I say Walk.*"

  "But you didn't say 'Ground is safe.' You said 'Walk'."

  "Because 'Walk' implies ground. Doesn't it?"

  "Does it?" Mara asked. "How do you know?"

  "Because we've done it a hundred times."

  "No," she said softly. "We've done the *action* a hundred times. We haven't defined the *word*."

  Elias leaned against the car door. The metal was cold. He tried to reach back into his own memory, to that first Sunday seven years ago. He tried to find the moment he decided what *Walk* meant. He searched for the mental hook, the internal definition that anchored the sound to the reality.

  He found nothing.

  He found only the history of success. Every time he had said it, she had moved, and she had not fallen. The pattern was perfect. But a pattern isn't a rule. A pattern is just a streak of luck.

  "I could have meant," Elias whispered, "that you should walk only when the sun is at a certain angle."

  "We walked in the rain," Mara said.

  "I could have meant," he continued, his voice trembling, "that you should walk only when you feel like it."

  "I walked when I was tired. I walked when I was happy."

  "I could have meant," Elias said, the dread rising like bile, "that 'Walk' means 'Fall'."

  Mara didn't flinch. "Today, it did."

  "But not before."

  "Because the ground was there before. The ground was the variable, not the word." She opened the car door. "Elias, if the ground had been missing on day one, I would have fallen on day one. And we would have said, 'Oh, Walk means step into the void.' And we would have done that for seven years. Jumping off cliffs, thinking it was the path."

  "That's insane."

  "Is it? How do you prove it isn't?" She looked at him, and for the first time in seven years, he saw a stranger. "You can't check your brain. There's no little scroll in there that says *Definition: Walk*. There's only what you've done. And what you've done is compatible with a thousand different rules. All of them worked until today."

  Elias got into the driver's seat. He put his hand on the key. He had started this car a thousand times. *Turn key, engine starts.* That was the rule.

  But maybe the rule was *Turn key, engine starts, provided the temperature is above zero.*
  Maybe the rule was *Turn key, engine starts, provided I am not thinking about the word 'start'.*
  Maybe the rule was *Turn key, engine makes a noise that I interpret as starting.*

  He sat with his hand on the ignition. He was terrified to turn it. If he turned it and the car didn't start, it wouldn't mean the car was broken. It would mean he had never known what *starting* meant. It would mean that for seven years, he hadn't been driving; he had been participating in a coincidence.

  "Elias?" Mara asked.

  He looked at her. He wanted to say, *I love you.*

  But he stopped.

  He realized he didn't know what *love* meant. He only knew that for seven years, he had said it, and she had smiled, and they had stayed together. The conditions had held. The pattern was unbroken.

  But if *Walk* could mean *Fall* today, what could *Love* mean tomorrow?

  "I..." He started.

  The word hung in the air, suspended. It had no weight. It had no anchor. It was just a sound that had happened to coincide with safety for a long time.

  Mara looked at him, waiting for the definition that wasn't there.

  Elias took his hand off the key. He didn't turn it. He was afraid that if he did, he would find out that *Go* meant *Stay*, and they would be sitting in the driveway forever, watching the world move on without them, convinced they were driving.

  "Let's just sit," he said.

  "Okay," she said.

  They sat. The silence was absolute. It was the silence of a world where the bridges between minds had dissolved, leaving them on opposite banks, waving at each other with hands that might not mean *hello*, or *help*, or *I am here*.

  They waited for something to happen that would prove they were still on the same path. But the path was just dirt, and the dirt didn't care what they called it.
