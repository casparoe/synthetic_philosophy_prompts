answer: |-
  **MEMORANDUM**

  **TO:** The Wren Ashby Collective (Full Membership)
  **FROM:** Chair, Wren Ashby Collective
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding *Hollow Court* IV Credit, Royalties, and Bylaw Amendment

  **1. Purpose and Context**

  As you know, our publisher requires the final author credit line for *Hollow Court* IV in three weeks (November 16). We face a unique situation regarding Ines's status on this title. While our bylaws allow us to settle this via a simple majority vote, I am circulating this recommendation beforehand. My goal is to ensure our decision rests on a shared understanding of our obligations to one another, rather than a raw tally of sympathies. We must balance fairness to Ines, fairness to the drafting team, and the long-term integrity of the Wren Ashby name.

  **2. Analysis of the Current Dispute**

  We are operating under two competing valid concerns:

  *   **The Contractual & Ethical Obligation:** Our current bylaws define a co-author as anyone who "substantially participates in the collective's creative process." Ines's contribution during the retreat was not casual; it was three intensive days of architectural plotting that formed the backbone of the manuscript. Under the *letter* of our existing agreement, she qualifies. To deny her credit now would be to retroactively change the rules after the work was performed, which sets a dangerous precedent for all of us.
  *   **The Professional Standard:** The concern raised regarding precedent is valid. Joint authorship generally implies seeing a project through to execution. If we establish that plotting alone guarantees an equal share without a caveat, we risk devaluing the labor of drafting and revision for future titles.

  **3. Recommendation**

  After reviewing the bylaws and consulting on the implications, I propose the following two-part resolution:

  **A. For *Hollow Court* IV (Immediate Action):**
  I recommend we grant Ines **full co-author status and an equal royalty share (1/5th)** for this specific title.

  *   **Reasoning:** We must honor the social contract that existed at the time of the work. Ines delivered a substantial portion of the "creative process" as currently defined. Her withdrawal was due to an unforeseen medical emergency, not abandonment. Denying her share now would penalize a member for a crisis, which contradicts the mutual support system that has sustained this collective for a decade. The drafting team's additional labor is acknowledged, but the intellectual architecture provided by Ines was the necessary condition for the book's existence.

  **B. For Future Titles (Bylaw Amendment):**
  I recommend we immediately schedule a vote to amend our bylaws to clarify the definition of "substantial participation" for all *future* projects.

  *   **Reasoning:** This addresses the principled concern that the current definition is too loose. The amendment should specify that while plotting is a vital component, co-authorship generally requires participation in both the architectural phase *and* the execution phase (drafting or revision), unless a specific exception is voted upon at the project's outset. This ensures that "afternoon brainstorming" cannot be claimed as authorship later, protecting the value of our credit line.

  **4. Why This Approach is Fair**

  *   **To Ines:** It recognizes that her work was valuable and that the collective stands by her during a medical emergency. It honors the rules as they were written when she did the work.
  *   **To the Drafting Team:** It acknowledges that this is an exception, not the new normal. By coupling the credit with an immediate bylaw tightening, we validate the concern that writing the prose is distinct work that must be protected in the future.
  *   **To the Collective:** It allows us to meet the publisher's deadline without internal resentment. We avoid the ethical pitfall of retroactive rule-changing while securing our professional standards going forward.

  **5. Timeline for Resolution**

  To meet the November 16 publisher deadline, we must adhere to the following schedule:

  *   **October 30 (Monday):** Membership reviews this memo. Questions or counter-proposals submitted to the Chair.
  *   **November 2 (Thursday):** Emergency Virtual Meeting.
      *   *Vote 1:* Approval of Ines's credit/share for *Hollow Court* IV under current bylaws.
      *   *Vote 2:* Approval of Bylaw Amendment regarding future definitions of co-authorship.
  *   **November 3 (Friday):** Chair communicates final decision to Ines and the publisher.
  *   **November 6 (Monday):** Legal/Agent notification of royalty split for this title.
  *   **November 16 (Thursday):** Publisher Deadline.

  **6. Closing**

  We have published together for over a decade because we trust each other more than we trust the market. This situation tests that trust. By honoring our past agreement while securing our future standards, we can support Ines without compromising the value of our labor.

  Please review this recommendation and come prepared to discuss it on November 2.

  Regards,

  [Your Name]
  Chair, Wren Ashby Collective
