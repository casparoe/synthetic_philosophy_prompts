prompt: |-
  I'm the elected chair of a five-person fantasy-writing collective that has published its novels for over a decade under a single joint pen name, Wren Ashby, and that settles disputes over cover credit and royalty splits by a vote of the full membership. Our bylaws, drafted long before anyone anticipated this dispute, define a co-author of a given title as anyone who "substantially participates in the collective's creative process for that title"—language that has never needed sharpening before, since in that time everyone who showed up to help plot a book also ended up drafting some of it.

  That stopped being true with our fourth Hollow Court novel. At the retreat where we plot each installment, one member, Ines, proposed the book's central mystery and spent three intensive days working out its architecture with the rest of us, chapter by chapter; four days after the retreat ended, she withdrew entirely because of a family medical emergency and never wrote, revised, or commented on a page again. The remaining four of us wrote the whole book from those retreat notes, departing from them substantially as the draft demanded. Ines is now asking to be listed as co-author and paid an equal share, on the grounds that the collective has always treated "the creative process" as something that happens in the room as much as on the page. Two of the four of us who actually wrote the book are ready to agree, partly out of sympathy and partly because it matches how we've handled lopsided contributions in the past; a third is resisting on principle, arguing that joint authorship has to involve seeing a plan through, not just shaping it and then stepping away, and that stretching the definition now will empty it of meaning the next time someone wants credit for an afternoon's brainstorming.

  I'm genuinely undecided myself, which is partly why I'd rather have a carefully reasoned outside opinion than just call a vote; I've also floated the dilemma with novelist friends outside the collective, and their sympathies split along exactly the same lines. Our publisher needs the final credit line in three weeks, and however we rule will function as precedent the next time this happens. Could you draft the memo I'll circulate to the full membership: a clear recommendation on Ines's credit and royalty share, a timeline for settling it before the deadline, and reasoning solid enough that whichever side turns out not to prevail would recognize it as a fair account of what we actually owe each other, rather than just a tally of votes?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Elected Chair of a 5-person fantasy-writing collective (joint pen name: Wren Ashby).
      *   **Context:** Published for 10+ years. Disputes settled by vote, but Chair wants to provide a reasoned recommendation first to ensure fairness and set precedent.
      *   **The Dispute:** Member Ines contributed heavily to plotting/architecture (3 intensive days) but withdrew before drafting/revising due to family emergency. Remaining 4 wrote the book, deviating substantially from notes.
      *   **The Bylaws:** Define co-author as anyone who "substantially participates in the collective's creative process for that title." Ambiguous regarding plotting vs. drafting.
      *   **The Split:** Ines wants full credit/pay. 2 members agree (sympathy + past practice). 1 member resists (principle + precedent). Chair is undecided.
      *   **Deadline:** Publisher needs credit line in 3 weeks.
      *   **Goal:** Draft a memo to the full membership with a clear recommendation, a timeline, and reasoning that feels fair to both sides (even the losing one).

  2.  **Determine the Core Ethical/Legal/Professional Issues:**
      *   **Copyright Law (US context implied):** Joint authorship usually requires intent to merge contributions into a unitary whole and copyrightable contribution. Plotting *can* be copyrightable, but usually, the expression (writing) carries the weight. However, this is a private contract/collective agreement, not necessarily a court case.
      *   **Collective Harmony:** The group has existed for a decade. Preserving relationships is crucial.
      *   **Precedent:** The decision will bind future cases. Needs to be specific enough to prevent abuse (e.g., "afternoon's brainstorming") but flexible enough for genuine emergencies.
      *   **Fairness:** Ines did significant work (3 intensive days on architecture). The others did the heavy lifting of execution.
      *   **Sympathy vs. Principle:** The tension between supporting a colleague in crisis and maintaining professional standards.

  3.  **Formulate a Recommendation:**
      *   *Option A: Full Credit/Pay.* Risks devaluing the definition of authorship. Sets a precedent that plotting = writing.
      *   *Option B: No Credit/Pay.* Harsh given the intensity of her contribution and the reason for withdrawal (medical emergency). Ignores the "creative process" argument.
      *   *Option C: Hybrid/Split.* Acknowledges the contribution without equating it to full drafting.
      *   *Decision:* A hybrid approach is usually best for collective harmony and fairness. However, the prompt asks for a *clear recommendation*.
      *   *Refined Decision:* Given the bylaws say "substantially participates in the creative process," Ines *did* do that. However, "co-author" usually implies execution.
      *   *Wait, looking closer at the prompt:* The prompt asks for a recommendation on *credit and royalty share*.
      *   *Strategy:* I need to take a stand. A "split the difference" memo can look weak. A strong recommendation that acknowledges the nuance is better.
      *   *My Choice:* Recommend **Full Co-Authorship Credit** but a **Adjusted Royalty Split**.
      *   *Why?* Credit is about the *idea* and the *structure* (which she built). Royalties are about the *labor* and *market value* of the finished product. This honors her contribution to the "creative process" (satisfying the bylaws and the sympathetic members) while acknowledging the labor disparity (satisfying the principled member).
      *   *Alternative:* Actually, in publishing, "Co-Author" is a binary status on the cover. You usually can't put "Wren Ashby & Ines" if Wren Ashby is the pen name for the group. The credit line is "By Wren Ashby." The internal split is the money.
      *   *Correction:* The prompt says "listed as co-author." Since they use a joint pen name, this likely means internal recognition + royalty split. Or perhaps "Based on a concept by..."? No, they publish under a *single joint pen name*. So the "credit" is likely internal acknowledgment of authorship status for that title, which dictates the royalty split.
      *   *Re-evaluating the Recommendation:* If they publish under *one* name (Wren Ashby), the "credit line" the publisher needs is likely just "Wren Ashby." The dispute is about the *internal royalty split* and *internal status*.
      *   *Wait, re-reading:* "Publisher needs the final credit line in three weeks." If it's a joint pen name, the credit line is always the same. Unless... they sometimes list individual names? "Settles disputes over cover credit and royalty splits." Okay, so sometimes individual names might appear, or the "credit" refers to the internal ledger of who counts as an author for that book.
      *   *Assumption:* The "credit" determines the royalty split. If she is a "co-author," she gets 1/5. If not, she gets 0 (or a finder's fee).
      *   *Best Path:* Recommend she be recognized as a **Contributing Architect** (or similar) with a **Partial Royalty Share**. This creates a new category.
      *   *Actually, simpler is better:* Recommend **Full Authorship Status** (to honor the bylaws and her intense contribution) but **amend the bylaws** immediately for the future.
      *   *No, the principled member worries about precedent.* If we give her full share now, it sets the precedent.
      *   *Okay, the most balanced recommendation:* **Full Authorship Credit, but a One-Time Exception with a Reduced Royalty Share.** This acknowledges the "creative process" (she did plot) but acknowledges the "drafting" (she didn't write).
      *   *Let's go with:* **Full Co-Author Status (Credit) but a 50% Royalty Share (relative to a full share).** This validates her contribution to the "creative process" (bylaws) while acknowledging the labor imbalance.
      *   *Wait, 3 weeks deadline.* We need to vote.
      *   *Let's try to find a middle ground that feels like a "win" for the principle.*
      *   *Recommendation:* **Grant Co-Author Credit, but adjust the royalty split to reflect labor.**
      *   *Actually, looking at industry standards:* Plotting is often considered authorship if it's detailed enough. She spent 3 *intensive* days on architecture chapter-by-chapter. That's substantial.
      *   *Decision:* I will recommend **Full Co-Author Status and Full Share** *for this specific instance*, based on the specific intensity of the contribution and the emergency, BUT couple it with a **Bylaw Amendment** to prevent future ambiguity. This satisfies the sympathetic members (Ines gets paid), the principled member (rules get tightened so it doesn't happen again casually), and the Chair (fairness + precedent management).
      *   *Wait, is that fair to the writers?* They did all the writing.
      *   *Okay, let's pivot.* The most defensible position that respects the *current* bylaws ("substantially participates in the creative process") is that she *did* qualify. The bylaws don't say "drafting." They say "creative process." She did the architecture.
      *   *So:* Recommend honoring the current bylaws (Full Share) but immediately updating the bylaws.
      *   *Counter-argument:* The writers feel it's unfair labor-wise.
      *   *Compromise:* Full Credit (name on the internal ledger), but a split that reflects the work.
      *   *Let's draft the memo to recommend: **Full Co-Author Credit, but a Split Royalty Share (e.g., 50% of a standard share).**.* This is the most nuanced "Chair" decision. It acknowledges the bylaws (she participated) but acknowledges the reality (she didn't write).
      *   *Wait, simpler:* **Full Share.** Why? Because 3 days of intensive architecture *is* substantial. The others wrote, but they used her map. The principled member says "stretching the definition." The Chair needs to argue it's *not* stretching, it's interpreting.
      *   *Okay, I will recommend **Full Co-Author Status and Full Royalty Share**.* Why? Because the bylaws say "creative process," not "drafting." To deny her now is to rewrite the contract retroactively, which is unethical. *However*, to address the precedent concern, I will recommend an immediate bylaw amendment for *future* books. This protects the group going forward without punishing Ines for a rule that was vague.
      *   *Wait, one more consideration:* The prompt says "reasoning solid enough that whichever side turns out not to prevail would recognize it as a fair account."
      *   *If I recommend Full Share:* The writer who resisted might feel bullied.
      *   *If I recommend Partial Share:* Ines might feel punished for a medical emergency.
      *   *If I recommend Full Share + Bylaw Change:* This is the strongest leadership move. It says "The rules as written protect Ines. We will honor them. But we agree the rules need work, so we fix them now."
      *   *Wait, is there a financial middle ground?* A "Story By" credit?
      *   *Let's stick to the prompt's constraints:* "Credit and royalty splits."
      *   *Okay, final decision on recommendation:* **Full Co-Author Credit and Full Royalty Share for this title only, contingent on immediate Bylaw Amendment.** This honors the existing social contract while fixing the loophole.

  4.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Acknowledge the difficulty, the deadline, and the goal (fairness + precedent).
      *   **Analysis of Bylaws:** Interpret "creative process." Argue that Ines *did* meet the current definition.
      *   **Analysis of Precedent/Risk:** Acknowledge the risk of devaluing authorship.
      *   **Recommendation:** Full credit/share for *this* book (honoring the contract & emergency), BUT immediate bylaw revision for *future* books (honoring the principle).
      *   **Timeline:** Specific dates to meet the 3-week deadline.
      *   **Closing:** Emphasis on collective health.

  5.  **Refining the Tone:**
      *   Needs to be empathetic but firm.
      *   Needs to sound like a Chair, not a dictator.
