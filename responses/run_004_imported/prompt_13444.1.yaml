answer: |-
  **MEMORANDUM**

  **TO:** Model Risk Committee
  **FROM:** Engineering Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendation for Thin-File Model Uncertainty

  **Executive Summary**
  To address the instability of default-risk predictions for thin-file applicants (4%–22% PD variance), I recommend adopting an **Uncertainty-Adjusted Decision Policy**. This approach utilizes prediction ranges to drive decisioning but implements strict version controls to resolve concerns regarding decision inconsistency and reversibility.

  **The Problem**
  For thin-file applicants, our current point-estimate model exhibits high epistemic uncertainty. Relying on a single probability score creates false precision. However, simply reporting dynamic ranges introduces the risk that identical applicants receive different outcomes based on when they apply relative to our retraining schedule (Member B's objection).

  **Recommended Policy: Deterministic Ensemble with Version Control**
  We will treat model uncertainty as a first-class input, but we will decouple the *calculation* of uncertainty from the *frequency* of retraining.

  **1. Definition of the Range**
  The "Range" will not be generated from a fresh bootstrap on every request. Instead, it will be derived from a **Frozen Deterministic Ensemble** (e.g., 50 bootstrap models) packaged within a specific Model Version (e.g., v2.4).
  *   **Lower Bound:** 5th percentile of the ensemble.
  *   **Upper Bound:** 95th percentile of the ensemble.
  *   **Stability Guarantee:** As long as Model v2.4 is active, an identical applicant profile will *always* yield the exact same Range, regardless of when they apply.

  **2. Decision Logic**
  Let $C$ be the risk cutoff for auto-approval.
  *   **Auto-Approve:** If Upper Bound $< C$. (We are confident risk is low).
  *   **Auto-Deny:** If Lower Bound $> C$. (We are confident risk is high).
  *   **Manual Referral:** If Lower Bound $< C <$ Upper Bound. (Uncertainty straddles the risk appetite).

  **3. Addressing Decision Inconsistency (Member B's Objection)**
  To prevent identical applicants from receiving different outcomes due to model updates:
  *   **Governed Version Swaps:** We will not update the active Model Version on a fixed schedule (e.g., weekly). New versions are only promoted after validating that the "Referral Rate" for the thin-file segment remains stable ($\pm 5\%$) compared to the incumbent.
  *   **Application Locking:** Once an applicant is scored, their score and range are locked to that Model Version for 30 days. If a model update occurs during underwriting, the application continues on the original version to prevent mid-process reversals without new evidence.

  **4. Monitoring & Exit Criteria**
  *   **Referral Volume:** If $>30\%$ of thin-file applicants are referred, the model is deemed unfit for this segment, and we revert to rules-based underwriting.
  *   **Manual Override Audit:** We will track the approval rate of referred cases. If manual underwriters approve $>90\%$ or $<10\%$ of referrals, the cutoff $C$ or the referral logic requires recalibration.

  **Next Steps**
  Engineering will implement the Frozen Deterministic Ensemble by [Date]. I request Committee approval to proceed with the Decision Logic and Version Control protocols outlined above.
