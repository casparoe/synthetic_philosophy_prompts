answer: |-
  You are right, and your friend is falling for a very common mathematical trap. While his logic sounds intuitive ("if I have an advantage, I should exploit it as much as possible"), it ignores the difference between **arithmetic expected value** (what happens on average in one bet) and **geometric growth** (what happens to your bankroll over a series of bets).

  If you follow your friend's advice, you will almost certainly go broke eventually, even if every single bet you make has a positive expected value.

  Here is the breakdown of why he is wrong, the math that proves it, and the actual formula you should use to settle the argument.

  ### 1. The Flaw: Expected Value vs. Risk of Ruin
  Your friend is optimizing for the **Arithmetic Mean**. He is saying, "If I have a 1% edge, betting \$100 makes me \$1 on average, but betting \$1,000 makes me \$10 on average. So I should bet \$1,000."

  The problem is that gambling bankrolls grow (or shrink) multiplicatively, not additively. If you lose a bet, you have less capital to bet with on the next hand. If you bet too large a portion of your bankroll, the variance (the ups and downs) will wipe you out before the "long run" advantage can kick in. This is called **Risk of Ruin**.

  **The Coin Flip Analogy**
  Imagine a coin flip where you have a massive edge:
  *   **Heads:** You win 2x your bet.
  *   **Tails:** You lose your bet.
  *   **Probability:** 60% chance of Heads, 40% chance of Tails.

  This is a much better edge than a card counter ever gets in blackjack. According to your friend's logic, you should bet **100% of your bankroll** every time to maximize your expected value per flip.

  *   **Flip 1:** You bet everything. 60% chance you double up, 40% chance you have \$0.
  *   **Flip 2:** If you won Flip 1, you bet everything again.
  *   **Flip 10:** The chance of surviving 10 flips in a row is $0.6^{10}$, which is roughly **0.6%**.

  Even though every single bet has a huge positive expected value, betting 100% of your bankroll guarantees you will eventually hit a "Tails" and go to zero. Once you hit zero, the game is over. You cannot bet on the next positive-EV opportunity.

  ### 2. The Solution: The Kelly Criterion
  The mathematical formula that answers "How much should I bet?" is called the **Kelly Criterion**. It was developed by John Kelly at Bell Labs in 1956 and is used by professional gamblers and investors (like Warren Buffett) to maximize long-term wealth growth without going broke.

  The Kelly Criterion doesn't maximize the *expected value of the next bet*; it maximizes the **geometric growth rate of your bankroll** over time.

  **The Simplified Formula**
  For a bet where you either win or lose the amount wagered (like blackjack), the formula is roughly:

  $$f^* = \frac{\text{Edge}}{\text{Variance}}$$

  In blackjack terms, since the payout is roughly 1-to-1, it simplifies even further to:

  $$\text{Bet Size} \approx \text{Your Advantage Percentage} \times \text{Your Bankroll}$$

  **Example:**
  *   **Bankroll:** \$10,000
  *   **Current Count:** Gives you a 2% edge over the house.
  *   **Kelly Bet:** 2% of \$10,000 = **\$200**.

  If the table maximum is \$5,000, your friend wants to bet \$5,000 (50% of your bankroll). Kelly says you should bet \$200 (2% of your bankroll).

  Betting 50% of your bankroll on a 2% edge is **massive over-betting**. It creates a volatility so high that your "Risk of Ruin" (chance of losing the whole \$10k) skyrockets, even though you have the edge.

  ### 3. Why Pros Don't Bet Table Max
  Professional card counters use a strategy called **Bet Spreading**.
  *   When the count is neutral or negative, they bet the table minimum (to minimize loss).
  *   When the count is positive, they raise their bet proportionally to their edge, **capped by their Kelly limit**, not the table limit.

  Table limits are actually set by casinos partly to prevent exactly what your friend wants to do. If a counter has a \$50,000 bankroll, a \$10,000 table max might tempt them to bet too high relative to their edge, increasing their risk of ruin.

  ### 4. The "Half-Kelly" Compromise
  There is one nuance where your friend might feel vindicated, but it still proves you right.
  Full Kelly betting is volatile. It can result in drawdowns (temporary losses) of 50% of your bankroll before you recover. This is psychologically difficult for most humans.

  Most professionals use **"Fractional Kelly"** (usually Half-Kelly or Quarter-Kelly).
  *   If Kelly says bet 2% of your bankroll...
  *   A Half-Kelly bettor bets 1% of their bankroll.

  This reduces the volatility by half but retains about 75% of the growth rate. It is a safety buffer against miscalculating your edge. If your friend thinks Full Kelly is too conservative, betting *Table Max* is essentially "Super-Over-Kelly," which is financial suicide.

  ### How to Explain This to Your Friend
  Tell him this:

  1.  **EV is linear, Bankroll is logarithmic.** Maximizing EV per hand ignores the fact that if you lose your bankroll, you can't make future +EV bets.
  2.  **The "All-In" Test.** Ask him: "If you had a 55% chance to win a coin flip, would you bet 100% of your net worth on it?" If he says no, he admits that bet size matters more than just having an edge.
  3.  **Kelly Criterion.** Tell him the mathematically proven way to grow a bankroll long-term is the Kelly Criterion, which almost always suggests betting a small percentage of your total funds (1–5%), never the table maximum unless your bankroll is millions of dollars deep.

  **Verdict:** You are right. Positive Expected Value justifies *placing* the bet, but it does not justify *any size* bet. Betting too much on a +EV opportunity is the fastest way to turn a mathematical advantage into actual bankruptcy.
