      *Revised Thesis:* A system based on *resemblance* (ISOTYPE) is limited in principle. A system based on *spatial logic* (like diagrams) can do more, but ceases to be "pictures" in the common sense. I will argue that Neurath's specific constraint (pictograms of objects) creates a principled limit on logical syntax.

  8.  **Finalizing the Essay Structure:**
      *   Title: The Silence of the Icons.
      *   Intro: Neurath's vision.
      *   Part I: The War on Words (Vienna Circle context).
      *   Part II: The Ontological Strength of Pictures.
      *   Part III: The Logical Wall (Negation, Conditionals).
      *   Part IV: The Verdict (Principle vs. Execution).
      *   Conclusion.

  9.  (Drafting content based on these thoughts...) *Focus on the distinction between showing 'what is there' vs 'what is the case'.*

  10. *Final Review against Prompt:*
      *   Neurath's reasons for distrusting language? Yes.
      *   Reasons for doubting pictures? Yes.
      *   Verdict? Yes (Limited in Principle).
      *   No fence-sitting? Yes.

