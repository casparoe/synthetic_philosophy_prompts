  okay this has been messing with my head all week so bear with me. I'm about a year into an MA thesis on Frege's sense/reference distinction, and last week my advisor mentioned — kind of in passing — the political diary Frege kept in 1924, the one full of stuff about stripping Jews of political rights and wanting some strongman to sweep away the Weimar government. I looked into it and yeah, its as bad as it sounds, and apparently even Michael Dummett (the guy who basically built Frege's reputation in English-language philosophy) said reading it permanently changed how he felt about him. This is hitting different for me specifically because my great-grandparents got out of Germany in the 30s and not everyone in the family did. Now I can't stop asking myself whether I'm even allowed to keep admiring the Begriffsschrift and "On Sense and Reference" the way I used to, or whether that's just letting him off the hook. Can you write me an essay that actually takes a side on this instead of dodging it — lay out the strongest case that a philosopher's political and moral character has zero bearing on whether their formal logical/semantic work is any good, then the strongest case that it does (maybe the same rigid, exclusionary cast of mind shows up in the philosophy itself, or there's something off about celebrating the work while scrubbing out the person). Don't just land on "it's complicated," tell me where you actually come down and defend it.
