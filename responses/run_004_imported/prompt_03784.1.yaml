answer: |-
  This is a fantastic catch. You have identified a tension that lies at the very heart of Sidgwick's project, both in ethics and in his psychical research. It is easy to dismiss Sidgwick's SPR involvement as a Victorian eccentricity, but as you've noted, the epistemological framing in that 1882 address is rigorous, deliberate, and deeply consistent with his broader philosophical commitments.

  To answer your core question: Sidgwick is not offering a deflationary theory of truth (truth = consensus), nor is he purely invoking a Kantian regulative ideal. Instead, he is proposing an **institutional and pragmatic criterion for scientific legitimacy.**

  Here is a reconstruction of the most charitable version of Sidgwick's position, its relationship to the *Methods of Ethics*, its distance from Clifford, and where the whole edifice is most vulnerable.

  ### 1. The Epistemological Move: Legitimacy, Not Truth
  You ask whether "evidence that will convince the scientific world" is a sociological description or a regulative ideal. Charitably read, it is neither; it is a **demarcation criterion.**

  Sidgwick is not saying, "X is true if scientists believe it." He is saying, "For X to be admitted as a *scientific fact* rather than a *private experience* or *superstition*, it must survive the scrutiny of the scientific community."

  Notice the setup: He calls the current state a "scandal." Why? Because there is a disconnect between the *testimony* (which is abundant) and the *status* of that testimony (which is nil). The "scandal" is an inconsistency in the body of knowledge.
  *   **The Credulous:** Accept the phenomena without sufficient proof.
  *   **The Materialists:** Reject the phenomena without examining the proof.
  *   **The SPR:** Will examine the proof to see if it meets the standard required to change the scientific consensus.

  When Sidgwick defines sufficient evidence as that which convinces the scientific world, he is acknowledging that science is a social practice with gatekeeping mechanisms. He is effectively saying: *"We are not trying to prove these phenomena are real in a metaphysical sense; we are trying to prove them real in a way that forces the institution of Science to update its ledger."*

  This saves him from the charge of relativism. He assumes there is a fact of the matter (the phenomena are either real or not). But he recognizes that in the 19th century (as now), "scientific fact" is a status conferred by a community of practice. If the evidence is overwhelming but the community refuses to believe it due to prejudice, Sidgwick would likely say the evidence is *logically* sufficient but *sociologically* insufficient. His goal in the SPR is to make the evidence sociologically sufficient by making it methodologically unimpeachable.

  ### 2. The Parallel with *The Methods of Ethics*
  You are absolutely right to see the same underlying principle at work. This is Sidgwick's **Coherentism of Considered Judgments.**

  In *The Methods of Ethics*, Sidgwick is wary of building a moral system on abstract deduction alone. He constantly checks his utilitarian calculations against the "common sense" of moralists and the "considered judgments" of competent thinkers. He doesn't treat Common Sense as infallible, but as a data set that any successful ethical theory must accommodate (or explain away).
  *   **In Ethics:** The "competent judges" are moral philosophers and reflective common agents.
  *   **In Psychical Research:** The "competent judges" are the "scientific world."

  In both cases, Sidgwick is an epistemic fallibilist. He does not trust the individual mind (prone to bias, error, or egoism) to settle high-stakes questions alone. He trusts the **convergence of independent, competent inquiries.**

  *   **Ethics:** If all competent moralists agree on a principle (e.g., promise-keeping), it has a high probability of being valid, even if utilitarian calculus is messy.
  *   **SPR:** If all competent scientists agree on a result (e.g., telepathy is real), it has a high probability of being valid, even if materialist metaphysics is messy.

  The vulnerability is the same in both: What if the "competent judges" are systemically biased? In ethics, Sidgwick worries about cultural prejudice. In the SPR, he worries about materialist prejudice. His solution in both cases is the same: **Rigorous methodological scrutiny to isolate the signal from the noise.** He hopes that if the method is pure enough, the consensus will eventually align with the truth.

  ### 3. Sidgwick vs. Clifford's "Ethics of Belief"
  W.K. Clifford's famous essay was published in 1877, five years before this address. The relationship is one of **shared deontology but divergent scope.**

  *   **Clifford:** Focuses on the *individual's duty*. "It is wrong always, everywhere, and for anyone, to believe anything upon insufficient evidence." Clifford is worried about the habit of credulity corrupting the individual's character and harming society.
  *   **Sidgwick:** Focuses on the *institution's duty*. He agrees with Clifford that belief without evidence is wrong (hence the SPR's skepticism of mediums). But Sidgwick adds a consequentialist layer: **The cost of ignoring evidence is also a sin.**

  Sidgwick's phrase "impossible to exaggerate the scientific importance" is key. For Clifford, the risk is mostly in believing falsehoods. For Sidgwick, there is a symmetrical risk in **rejecting truths.** If telepathy is real, it revolutionizes physics and psychology. To ignore it because it is uncomfortable is, for Sidgwick, just as much a violation of the "ethics of belief" as credulously accepting it.

  Sidgwick's definition ("evidence that will convince the scientific world") is an operationalization of Clifford's maxim. Clifford says "don't believe without evidence." Sidgwick asks, "What counts as evidence in this domain?" and answers, "Whatever satisfies the guardians of rationality (the scientific world)." Sidgwick is trying to create a procedural path to belief that satisfies Clifford's strictures while remaining open to anomalous data.

  ### 4. The Vulnerabilities
  Despite the charitable reconstruction, Sidgwick's position here faces three significant problems, two of which he likely recognized.

  **A. The Conservatism Problem (The Paradigm Blindness)**
  If "sufficient evidence" is defined as "that which convinces the current scientific world," you risk baking in the prejudices of the current paradigm. If the scientific world is committed to materialism, no amount of evidence for telepathy may ever be "sufficient," because the claim itself violates the axioms of the observers.
  *   *Sidgwick's Defense:* He anticipates this. He distinguishes between the "educated world" (which is incredulous) and "competent witnesses" (who believe). He hopes that by subjecting the phenomena to *stricter* scientific methods than the scientists themselves use, he can force the consensus to shift. He is betting on method over metaphysics.

  **B. The Circularity of Competence**
  In *Methods of Ethics*, who counts as a "competent moral judge"? In the SPR, who counts as "scientific"? If you define the scientific world as those who reject spiritualism, you can never win. If you define it as those open to spiritualism, you are a cult.
  *   *Sidgwick's Defense:* He relies on a procedural definition. A scientist is someone who applies the scientific method. If they apply the method and get a positive result, they must believe. This pushes the burden onto the *methodology* of the SPR. (Historically, this is where the SPR actually succeeded; they invented double-blind protocols and controls that became standard in psychology, even if they didn't prove ghosts).

  **C. The Wishful Thinking Bias**
  You noted the "stronger pull toward wishful thinking." In ethics, the bias is usually toward self-interest. In psychical research, the bias is toward *hope* (survival of death, meaning in the universe). Sidgwick, an agnostic who desperately wanted to believe in immortality (for ethical reasons—see his discussion of the "Dualism of Practical Reason"), was personally vulnerable here.
  *   *The Risk:* Defining evidence as "what convinces the scientific world" might be a subconscious strategy to reassure *himself* that he isn't being credulous. It allows him to investigate spirits while maintaining his identity as a rationalist. It is a form of epistemic insulation.

  ### Conclusion
  Sidgwick is not being deflationary about truth; he is being **realist about scientific sociology.** He recognizes that facts do not speak for themselves; they must be certified by a community.

  The most charitable reading is that Sidgwick is attempting to **normalize the anomalous.** He wants to move psychical phenomena from the category of "Superstition/Religion" (where evidence standards are loose) to "Science" (where evidence standards are high). To do that, he must adopt the admission criteria of Science.

  Is it the same move as in *The Methods of Ethics*? **Yes.** It is the move of **Reflective Equilibrium applied to Communities.** He seeks a stable point where individual testimony, methodological rigor, and communal consensus align.

  Where is it vulnerable? Precisely where all coherentist systems are vulnerable: **If the community is corrupted, the truth is lost.** Sidgwick's gamble was that the "scientific method" was a strong enough filter to purify the community of its materialist biases. History suggests the method worked (giving us modern parapsychology and rigorous psychology), but the community remained unconvinced. Sidgwick died hoping the scandal was resolved; the scandal, arguably, remains.
