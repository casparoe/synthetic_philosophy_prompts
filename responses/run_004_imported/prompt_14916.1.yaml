          *   *Key implication:* The subject's situation matters. The truth condition of "S knows that p" changes based on S's practical environment.
      *   **Epistemic Contextualism (EC):** The word "know" is context-sensitive. The *speaker's* conversational context determines the standard. In a low-stakes conversation, "know" is easy to satisfy. In a high-stakes conversation (e.g., discussing medical liability), "know" requires more.
