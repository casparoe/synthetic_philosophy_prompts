      *   *Horn 2 (Insufficiency):* If we accept these four for *other* reasons (e.g., agent-relative duties, psychological limitations), do they entail that *existence is always a harm*? Or do they just mean "don't create miserable kids, but it's okay to create happy ones"? Benatar needs the strong claim (Coming into existence is *always* a serious harm) to support antinatalism. The four judgments seem compatible with pro-natalism for happy lives.

