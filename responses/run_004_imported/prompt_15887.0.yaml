answer: |-
  Here are 10 interview questions designed to press the "MWI is local" claim beyond the standard rationalist talking points, including the specific technical deep-dives you requested. Each includes a follow-up designed to counter the most common Everettian deflections.

  ### 1. The Jarrett Condition & Outcome Independence
  "Let's start with the technical definition of locality. Bell's condition is often decomposed via Jarrett into *Parameter Independence* (my setting doesn't affect your probabilities) and *Outcome Independence* (my result doesn't affect your probabilities). Standard QM violates Outcome Independence. I want you to walk through exactly which of these MWI satisfies. If your answer is that Outcome Independence is irrelevant because there are no single outcomes to be independent *of*, is that a genuine dissolution of the nonlocality puzzle, or just a relabeling of it? In other words, does removing the single outcome remove the *constraint* that required nonlocality, or does it just remove the *language* we use to describe the constraint?"

  *   **Follow-up:** "If you say it removes the constraint: Bell's inequalities are derived from statistical correlations in the data we actually see, which *are* single outcomes. If the theory only recovers those single outcomes by appealing to a global wavefunction that contains *all* outcomes, haven't you just pushed the nonlocal bookkeeping into the ontology rather than eliminating it?"

  ### 2. The EPR-Bohm Branch Matching
  "Let's talk about the mechanism of correlation. In an EPR-Bohm experiment, when Alice measures spin-up, she ends up in a branch where Bob measures spin-down. She never ends up in a branch where Bob measures spin-up. If there is no collapse and no signal traveling between them, what physically prevents the 'Alice-Up' branch from overlapping with the 'Bob-Up' branch? I've heard the answer 'it just falls out of unitary evolution, no signal required,' but is that an actual explanation of the matching mechanism, or just a restatement of the mystery? How does the unitary evolution 'know' to correlate the distant branches correctly without a nonlocal term in the Hamiltonian?"

  *   **Follow-up:** "If you say the correlation is encoded in the initial entangled state: That state is defined over a configuration space, not 3D space. If the correlation is pre-existing in the global wavefunction, isn't that a form of holism that looks functionally identical to nonlocality, even if you refuse to call it that?"

  ### 3. Configuration Space vs. 3D Space
  "Following up on that: Where does the wavefunction actually live? If the fundamental ontology is a field on 3N-dimensional configuration space, then 'locality' in 3D physical space might be a category error. Interactions might be local in configuration space, but points that are close in configuration space can be light-years apart in 3D space. So when you claim MWI is 'local,' are you claiming locality in 3D space (which seems false for the wavefunction) or locality in configuration space (which might be true but doesn't match our intuitive notion of locality)?"

  *   **Follow-up:** "If you argue 3D locality is emergent: Doesn't that mean the 'locality' you're defending is an approximate, high-level feature, whereas Bell's theorem is a exact constraint on the fundamental theory? How can an emergent locality save you from a fundamental no-go theorem?"

  ### 4. Branching and Relativistic Simultaneity
  "Branching seems to imply a 'split' that happens across space. If Alice measures her particle in Andromeda and Bob measures his here, when do their respective branches split? If branching is a physical process driven by decoherence, does it require a preferred simultaneity surface to define when the branches become distinct globally? If not, how do you square the global definition of a 'branch' with the relativity of simultaneity without invoking a hidden preferred frame?"

  *   **Follow-up:** "If you say branching is local and gradual (decoherence spreads at light speed): Then for a spacelike separated interval, the global branch structure is ill-defined. Does that mean 'which world I am in' is frame-dependent? If so, doesn't that undermine the objective reality of the branches you rely on to solve the measurement problem?"

  ### 5. MWI vs. Superdeterminism
  "You're prioritizing locality enough to accept an infinite multiplicity of worlds. But there's another way to save locality: Superdeterminism. It keeps single outcomes and keeps locality, at the cost of measurement independence. If your primary virtue criterion is 'save locality,' why is positing $10^{100}$ extra worlds ontologically cheaper or more scientific than positing a highly constrained initial state that correlates measurement settings with particle states? Why is MWI the 'local' option rather than Superdeterminism?"

  *   **Follow-up:** "If you argue Superdeterminism kills scientific practice: Doesn't MWI also make probability tricky (the incoherence problem)? If both views make standard statistical inference difficult in different ways, why is the MWI trade-off considered the 'rational' one for a locality enthusiast?"

  ### 6. The Pointer Basis Problem
  "For branching to be local, the basis in which branching occurs (the pointer basis) must be selected by local interactions. But decoherence depends on the system-environment split. In a relativistic setting, is the selection of the preferred basis fully Lorentz invariant? Or does defining 'the branch I'm on' implicitly rely on a specific foliation of spacetime to define the environment interacting with the system?"

  *   **Follow-up:** "If you say the basis is robust across frames: There are known cases where decoherence rates are frame-dependent. If the *rate* of branching is frame-dependent, doesn't that mean the *number* of branches in a given volume is frame-dependent? How is that a local, objective ontology?"

  ### 7. Probability and Measure
  "If MWI is local, how do you recover the Born Rule locally? In a single-outcome theory, probability is about what *will* happen. In MWI, everything happens. So probability becomes a measure over branches. If that measure is conserved under unitary evolution, fine. But does deriving that measure require assuming a global normalization of the wavefunction? If so, isn't that a global constraint that violates the spirit of locality, even if the dynamics are local?"

  *   **Follow-up:** "If you appeal to decision theory (Wallace/Deutsch): That derives rational betting behavior for an agent, not the physical frequency of branches. Does 'locality' apply to the physics or just to the agent's expectations? If it's just expectations, haven't we changed the subject from Bell's physical locality to psychological locality?"

  ### 8. The Phenomenology of Collapse
  "Listeners experience measurements as having single outcomes. They experience correlations as 'spooky.' If MWI is the true theory, the feeling of nonlocality is an illusion generated by being a subsystem within a branch. But isn't that subjective experience itself data? If a theory predicts that observers *should* perceive nonlocality (even if it's not fundamental), does that count as a strike against the theory's claim to be 'local' in any empirically meaningful sense?"

  *   **Follow-up:** "If you say 'No, because the underlying math is local': Then we have a theory where the math is local but the phenomenology is indistinguishable from nonlocality. Is there any operational difference between 'actually local' and 'locally simulated nonlocality'? If not, is the claim 'MWI is local' physics or metaphysics?"

  ### 9. Falsifiability of the Locality Claim
  "Here's the point-blank question: What observation, even in principle, could count as evidence *against* the claim that 'MWI is local'? If Bell tests rule out local hidden variables, and you say 'MWI isn't a hidden variable theory,' and you also say 'MWI has no collapse,' what experimental result would force you to admit MWI is nonlocal? If the answer is 'none,' isn't the locality claim unfalsifiable interpretive bookkeeping?"

  *   **Follow-up:** "If you suggest a violation of unitarity (like spontaneous collapse): That would rule out MWI entirely, not just its locality. I'm asking if there's a result compatible with MWI being *true* but *nonlocal*. If there's no such state of affairs, isn't 'MWI is local' a tautology rather than a scientific claim?"

  ### 10. Research Heuristics and Utility
  "Finally, let's talk utility. If I'm a working physicist designing a quantum computer or analyzing a QFT, does believing 'MWI is local' change how I do my math compared to believing 'QM is nonlocal'? If the calculational rules are identical, is the 'locality' claim doing any work other than satisfying an ontological preference? Should we care if the theory is 'really' local if the experimental predictions regarding signals and causality are identical to a nonlocal theory?"

  *   **Follow-up:** "If you say it guides quantum gravity research: How? Does assuming MWI locality lead to specific constraints on quantum gravity models that a nonlocal interpretation wouldn't? Can you name a paper or a result where the 'MWI is local' stance generated a novel prediction or constraint?"
