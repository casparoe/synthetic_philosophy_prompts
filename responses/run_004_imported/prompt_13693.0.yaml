      *   **The Specific Objection:** UDT agents still act differently based on observations (e.g., pay if tails, don't pay if heads in some variants, or just pay if tails in the standard setup). So, how is this different from just updating beliefs and then acting? Is "updatelessness" just pre-commitment disguised as a decision theory? Is there a substantive difference between updating beliefs vs. updating policies?
      *   **Goal:** Clarify the distinction between Causal/Epistemic Decision Theory (CDT/EDT) with updating vs. UDT, specifically addressing the "in what sense is it updateless?" question.

  2.  **Deconstruct the Counterfactual Mugging (CM):**
