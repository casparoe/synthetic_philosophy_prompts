  3.  **Identify the Core Distinction:**
      *   It's not about *ignoring* information. It's about *when* and *how* that information is used to select the decision rule.
      *   **Updateful:** Information updates the *probability distribution over worlds*, and the agent maximizes EU relative to the *posterior*. The decision rule is selected *after* conditioning.
      *   **Updateless:** Information is treated as an input to a function (policy) that was selected *before* conditioning. The agent maximizes EU relative to the *prior*, integrating over all possible observations.
      *   **Key Concept:** Logical/Counterfactual Dependence vs. Causal/Evidential Dependence. UDT treats the action in the actual world as logically linked to the action in the counterfactual world (via the source code/policy). Updateful agents treat them as causally disconnected once the coin flip is known.

