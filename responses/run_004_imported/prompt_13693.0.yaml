answer: |-
  This is an excellent question that cuts to the heart of what makes UDT (and its successors like FDT) distinct from CDT/EDT. You are right to be skeptical of the terminology: an updateless agent *does* observe the coin flip, and its actions *do* depend on that observation. If it didn't, it would be blind, not rational.

  The distinction is not about whether information flows into the agent, but rather **which probability distribution is used to weight the consequences of the decision.**

  Here is the substantive difference between "updating beliefs" and "selecting an updateless policy," and why it is not merely a relabeling of Bayesian conditionalization.

  ### 1. The Mathematical Distinction: Posterior vs. Prior Optimization

  To see the difference formally, let's look at the Expected Utility (EU) calculation for both agents in the Counterfactual Mugging.

  **The Setup:**
  *   Coin is fair ($P(\text{Heads}) = 0.5$).
  *   **Heads:** Omega gives you \$10,000 (if it predicted you would pay on Tails).
  *   **Tails:** Omega asks you for \$100.
  *   You are currently in the **Tails** branch.

  **The Updateful Agent (CDT/EDT):**
  This agent maximizes expected utility relative to its **posterior** beliefs.
  1.  **Observation:** "I see Tails."
  2.  **Update:** $P(\text{Heads} | \text{Tails}) = 0$. $P(\text{Tails} | \text{Tails}) = 1$.
  3.  **Calculation:**
      *   $EU(\text{Pay}) = 1 \times (-\$100) + 0 \times (\$10,000) = -\$100$.
      *   $EU(\text{Refuse}) = 1 \times \$0 + 0 \times (\$10,000) = \$0$.
  4.  **Decision:** Refuse.

  The updateful agent has **discarded the probability mass** of the Heads world. Because it conditions on the observation *before* evaluating the action, the counterfactual world where the reward is given no longer "exists" for the purpose of the calculation.

  **The Updateless Agent (UDT):**
  This agent maximizes expected utility relative to its **prior** beliefs, treating its action as the output of a policy function $\pi(\text{observation})$.
  1.  **Observation:** "I see Tails."
  2.  **Update:** None. The agent does not condition its *objective function* on the observation. It only uses the observation as an input index for its policy.
  3.  **Calculation:** The agent evaluates the policy $\pi$ that it committed to at $t=0$.
      *   $EU(\pi) = P(\text{Heads}) \times U(\text{Heads}, \pi) + P(\text{Tails}) \times U(\text{Tails}, \pi)$.
      *   If $\pi(\text{Tails}) = \text{Pay}$: $EU = 0.5 \times \$10,000 + 0.5 \times (-\$100) = \$4,950$.
      *   If $\pi(\text{Tails}) = \text{Refuse}$: $EU = 0.5 \times \$0 + 0.5 \times \$0 = \$0$.
  4.  **Decision:** Execute $\pi(\text{Tails}) = \text{Pay}$.

  **The Substantive Difference:**
  The updateless agent has **not** zeroed out the probability of the Heads world. Even though it *knows* it is in the Tails world, it calculates the value of its action by weighting the Tails outcome by 0.5 and the Heads outcome by 0.5.

  To answer your specific question: It avoids updating in the sense that it refuses to let the observation **renormalize the probabilities in its utility function.** It uses the observation to select *which branch of the code to execute*, but not to determine *which worlds count toward the score*.

  ### 2. Logical Counterfactuals vs. Causal Counterfactuals

  Your intuition that the agent is "just updating on the observation" relies on a causal view of decision-making. In CDT, once the coin lands Tails, the Heads world is causally disconnected. Your action now cannot reach back and change Omega's prediction in the Heads world.

  UDT relies on **logical counterfactuals**.
  *   **Updateful View:** "My action *now* is a physical event in the Tails world. It cannot affect the Heads world."
  *   **Updateless View:** "My action *now* is the output of a mathematical function (my source code). Omega predicted the output of this function. Therefore, the output of this function in the Tails world is logically correlated with the output of this function in the Heads world."

  When the UDT agent pays in the Tails world, it is not trying to causally influence the Heads world. It is acknowledging that "Paying in Tails" and "Getting Reward in Heads" are both consequences of the same underlying truth: **I am the kind of agent that Pays on Tails.**

  If you view the agent as a physical instance, it looks like updating. If you view the agent as a **logical algorithm**, it looks like evaluating a function. The "updatelessness" is the insistence that you are the algorithm, not just the current execution thread.

  ### 3. Is it just Pre-commitment Relabeled?

  You asked: *Does "updatelessness" just amount to ordinary Bayesian conditionalization performed in advance and relabeled?*

  It is essentially **pre-commitment**, but with a crucial twist that distinguishes it from standard game-theoretic pre-commitment.

  In standard game theory, an agent might wish it could pre-commit, but once the moment comes to act, it has no mechanism to force itself to stick to the plan if it's no longer optimal *ex-post*. An updateful agent *wants* to be the type of agent that pays, but when it actually faces the choice, its decision theory tells it to refuse. It is **dynamically inconsistent**.

  UDT is a decision theory that **resolves dynamic inconsistency by fiat**. It constructs an agent that *cannot* update its utility weights.
  *   **Ordinary Pre-commitment:** "I promise to pay." (But when Tails comes, I break the promise because my decision theory says Refuse is better).
  *   **UDT:** "I am an agent whose source code selects actions to maximize Prior-EU." (When Tails comes, my source code still says Pay, because that's what maximizes Prior-EU).

  So, it is not just relabeling. It is a change in the **object of optimization**.
  *   **Updateful:** Optimize **Action** given **Posterior**.
  *   **Updateless:** Optimize **Policy** (mapping from Obs to Action) given **Prior**.

  ### 4. Why "Updating the Policy" isn't the same as "Updating Beliefs"

  You asked: *Is there a substantive difference between updating one's beliefs and updating one's policy?*

  Yes.
  *   **Updating Beliefs:** Changes the weights ($P(w)$) assigned to different possible worlds in your utility sum. It discards information about worlds you know you aren't in.
  *   **Updating Policy (in UDT):** You *don't* update the policy. You select the optimal policy once at the beginning of time (logically speaking). You only update your **indexical knowledge** (where you are in the policy tree).

  If you "updated your policy" based on the coin flip, you would switch from the "Pay on Tails" policy to the "Refuse on Tails" policy once you saw Tails. That is exactly what the updateful agent does. The UDT agent refuses to update the policy; it only updates its *location* within the policy.

  ### Summary

  The "updateless" in Updateless Decision Theory does not mean "ignores evidence." It means **"does not condition the probability distribution of the objective function on evidence."**

  1.  **Updateful Agents:** Condition on evidence $\rightarrow$ Discard counterfactual worlds $\rightarrow$ Optimize action locally. (Result: Dynamic Inconsistency).
  2.  **Updateless Agents:** Keep prior distribution $\rightarrow$ Retain counterfactual worlds in calculation $\rightarrow$ Optimize policy globally. (Result: Dynamic Consistency).

  The substantive difference is that Bayesian conditionalization is a method for **discarding** probability mass of falsified hypotheses to refine beliefs about reality. UDT is a method for **retaining** probability mass of counterfactual hypotheses to evaluate the logical output of your decision algorithm. It treats the counterfactual world not as a place you *might* have been, but as a place your algorithm *is* evaluated against.
