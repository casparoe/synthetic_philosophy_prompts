      *   *Heads:* Omega asks for \$100. (If you pay, you get nothing extra, but Omega predicted you would pay if Tails).
      *   *Tails:* Omega gives you \$10,000 *if and only if* it predicted you would have paid \$100 if Heads.
      *   *Standard CDT/EDT (Updateful):*
          *   If Tails: I know I'm in the Tails world. Paying \$100 gets me nothing. Omega's prediction is already made. Expected Utility (EU) of paying = -\$100. EU of not paying = \$0. I don't pay.
          *   Result: If Heads, Omega predicts I won't pay, so I get nothing. Overall EU = 0.
      *   *UDT (Updateless):*
          *   Evaluate the policy *before* knowing the coin flip.
          *   Policy A: Pay if Heads, Don't Pay if Tails. (Wait, standard CM is usually: Pay if asked (Heads), Reward if Tails based on prediction). Let's stick to the standard Parfit/Wei Dai version.
          *   *Correction on CM Setup:* Usually: Coin flips. If Tails, Omega asks for \$100. If Heads, Omega gives \$10,000 *if* it predicted you would pay if Tails.
          *   *Updateful Agent at Tails:* "I'm at Tails. Paying costs \$100. Heads is impossible now. I lose \$100." -> Refuses.
          *   *Updateful Agent at Start:* "If I refuse at Tails, Omega predicts this, so I get \$0 at Heads. Expected Value = 0.5 * 0 + 0.5 * 0 = 0."
          *   *Updateless Agent:* "I choose a mapping from Observation -> Action. Policy: If Tails, Pay. If Heads, (N/A or Keep money). Expected Value = 0.5 * (-100) + 0.5 * (10,000) = \$4,950."
