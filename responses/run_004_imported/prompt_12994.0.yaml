answer: |-
  Here are 10 questions designed to progressively tighten the screws on the "reformed" counterfactual analysis, specifically targeting the strategy of patching the theory with new clauses.

  **1. The Independence of the Basis**
  **Question:** Let's start with the core of the Lewis-style reformed analysis. You argue that for a disposition to hold, the object must retain its *intrinsic basis* through the stimulus. But how do we identify that basis independently of the disposition itself? If I ask you what the basis of fragility is, you point to the molecular structure. But if I ask how you know *that* is the relevant structure, don't you have to point back to the fact that it produces breaking?
  **Likely Reply:** "We identify bases via natural kinds and microphysics, not by looking at manifestations. The silicon-oxygen bonds are there regardless of whether the glass breaks."
  **Follow-up:** "But we only care about *those* bonds because they support the counterfactual 'if struck, it breaks.' If we discover a glass with those same bonds that *doesn't* break under standard conditions, would you say it lacks the basis, or lacks the disposition? If the latter, what work is the basis doing?"

  **2. The Determinacy of Ordinary Dispositions**
  **Question:** You mentioned fragility. But fragility seems massively multiply realizable. A wine glass, a sugar vase, and a carbon-fiber panel might all be 'fragile' in some context, but their intrinsic bases are totally different. When your analysis says the object must 'retain the same basis,' which basis are we talking about? Is there a single determinate basis for 'fragility,' or is the term too vague for your analysis to grip?
  **Likely Reply:** "It's a disjunctive basis. As long as it retains *whichever* of the relevant microstructures it actually has, the analysis holds."
  **Follow-up:** "If the basis is a massive, open-ended disjunction, doesn't the clause 'retains the same basis' become trivial? Almost any change counts as a change in basis, or almost no change does. How do we prevent the disjunction from being gerrymandered to fit whatever the object does?"

  **3. Circularity in 'Retention'**
  **Question:** This leads to the worry about circularity. In Martin's electro-fink case, the wire loses its conductivity the moment it is touched. Your view says the disposition is absent because the basis isn't retained. But isn't 'retaining the basis' just a technical way of saying 'retaining the disposition'? If the basis vanishes exactly when the stimulus occurs, haven't you just defined the disposition in terms of itself?
  **Likely Reply:** "No, because the basis is categorical. The electron flow capacity is a physical state. It's not modal. We can measure it without testing the disposition."
  **Follow-up:** "Only if the test doesn't interfere. But if the 'finkish' mechanism is triggered by the *measurement* of the basis itself, how do you verify the basis is there without triggering the loss? It seems you need to assume the disposition is stable to prove the basis is stable."

  **4. The Temporal Window**
  **Question:** Let's press on that fink case. Your analysis requires the basis to survive the stimulus long enough to cause the manifestation. But how long is that? If the basis vanishes a nanosecond after the stimulus, but before the break, do we say the disposition was there or not? Where do you draw the line for 'retention' without just looking to see if the manifestation happened?
  **Likely Reply:** "It must survive long enough for the causal process to initiate. That's a matter of physical law, not stipulation."
  **Follow-up:** "But if the causal process is interrupted by the very thing that removed the basis, aren't you defining the 'sufficient time' as 'the time it took in cases where it worked'? That looks like you're using the success of the manifestation to define the retention condition."

  **5. Masks vs. Lost Dispositions**
  **Question:** I want to ask about masks. If I wrap a fragile glass in bubble wrap, it won't break when struck. Your view needs to distinguish this from a glass that has lost its fragility. How can we tell the difference between a masked disposition and a disposition that is simply gone, without simply stipulating that the basis is still present in the first case?
  **Likely Reply:** "In the mask case, the intrinsic basis of the glass remains unchanged. In the loss case, the molecular structure is altered. We check the glass, not the wrap."
  **Follow-up:** "Imagine a case where the mask is intrinsic—say, a molecular dampener embedded in the glass that activates on impact. The structure changes *internally* upon stimulus. Is that a mask or a loss? If you say 'loss,' aren't you just defining 'loss' as 'any intrinsic change that prevents manifestation'?"

  **6. Antidotes and Intrinsicness**
  **Question:** Consider Bird's poison case. A poison is disposed to kill, but if an antidote is present, it doesn't. Lewis wants the basis to be intrinsic. But the antidote interacts with the poison's chemistry. Does the poison retain its 'lethal basis' when mixed with the antidote?
  **Likely Reply:** "The poison retains its intrinsic properties; the antidote is an extrinsic interferer. The disposition is still there, the conditions just aren't right."
  **Follow-up:** "But if the antidote binds to the poison molecules, changing their shape, isn't that an intrinsic change to the poison? If you say no, it seems you're defining 'intrinsic' as 'the part we decided to call the object,' which lets you move the goalposts whenever a counterexample arises."

  **7. Mimics and Causal Relevance**
  **Question:** Let's flip it. Suppose a non-fragile glass is surrounded by a hidden bomb that explodes when the glass is struck, shattering the glass. The counterfactual 'if struck, it breaks' is true. Your view says this isn't fragile because the breaking isn't *due to* the basis. But doesn't adding a 'causal relevance' clause admit that the counterfactual isn't doing the work?
  **Likely Reply:** "The counterfactual sets the condition, but the basis explains *why*. We need both to avoid mimics."
  **Follow-up:** "If the basis explains why, why do we need the counterfactual analysis at all? Why not just say dispositions *are* the causal bases, and skip the 'if-then' wrapper that requires all these patches to function?"

  **8. The Proliferation of Clauses**
  **Question:** We've talked about finks, masks, antidotes, and mimics. For each, you've added a specific clause: 'retain basis,' 'no masks,' 'no antidotes,' 'causal connection.' At what point does refining the theory become a degenerating research programme? How many clauses can we bolt on before the analysis loses its simplicity and explanatory power?
  **Likely Reply:** "It's not degenerating; it's precisifying. We are uncovering the hidden complexity of our modal concepts."
  **Follow-up:** "But if the 'simple' analysis requires a page of *ceteris paribus* conditions to apply to a simple concept like 'flammable,' are we analyzing the concept, or are we building a fortress around a definition that doesn't match our actual usage?"

  **9. Epistemic Access**
  **Question:** If your analysis is correct, to know if something is fragile, I need to know its microstructural basis, whether that basis would be retained, whether masks are absent, and whether mimics are absent. But ordinary people ascribe fragility without knowing any of that. Does your analysis imply that ordinary people are systematically mistaken when they talk about dispositions?
  **Likely Reply:** "No, they refer to the same property, they just don't know the full analysis of it. Like water being H2O."
  **Follow-up:** "But with water, 'H2O' explains the behavior. Here, the analysis seems to rely on the behavior to define the terms. If the folk concept works without the clauses, what theoretical work are the clauses actually doing, other than saving the theory from refutation?"

  **10. The Knockout Counterexample**
  **Question:** Finally, I want to ask about falsifiability. If every time a counterexample arises, the move is to say 'the basis wasn't retained' or 'a mask was present,' your view seems immune to evidence. What would an actual counterexample to your view have to look like? Describe a case where the basis is retained, no masks are present, the stimulus occurs, the manifestation fails, and you would admit the disposition was there.
  **Likely Reply:** "If the basis is truly retained and no masks are present, the manifestation *must* occur by the laws of nature. So that case is nomologically impossible."
  **Follow-up:** "Exactly. If the conditions for the disposition's existence are defined such that a failure is impossible, then the analysis isn't describing the world; it's defining terms. If you can't describe a world where the analysis fails, have you actually said anything about dispositions, or have you just created a tautology?"
