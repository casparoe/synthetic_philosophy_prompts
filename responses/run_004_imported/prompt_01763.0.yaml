prompt: |-
  In my graduate seminar on decision theory this term, one of my students—a former professional poker player who returned to academia after several years on the circuit—raised an example that has left me dissatisfied with the answer I gave in class, and I would welcome your help thinking it through properly. Consider a coin known with certainty to land heads sixty percent of the time, and suppose you are offered a long sequence of even-money bets on it: on each round you may stake any fraction of your current bankroll, heads doubles the stake and tails loses it, and you may play as many rounds as you like. I told the class that a rational, risk-neutral agent should stake their entire bankroll every round, since this is what maximizes the expected value of their wealth at each stage. My student objected that this policy amounts to near-certain ruin, since a single occurrence of tails wipes the bettor out completely, and across a long enough run the chance of tails coming up at least once approaches one, however favorable the arithmetic looked at the outset. He maintains that the fraction professional gamblers actually stake—on his account, about a fifth of the current bankroll each round, regardless of how many rounds remain—is not a symptom of risk-aversion but simply the fraction that maximizes what an individual bettor's wealth will actually do over a long career, as distinct from what happens on average across a hypothetical population of bettors who each live through a different random sequence of flips.

  What I cannot settle, and what I would like your help with, is whether my student has identified a genuine shortcoming in ordinary expected-value reasoning as applied to sequential, compounding wagers, or whether his rule simply redescribes expected-utility maximization under a suitably concave, for instance logarithmic, utility function for wealth—in which case my original answer to the class was correct after all, and the disagreement is merely terminological. He resists this redescription, insisting that even a bettor with no independent aversion to risk should still adopt his rule, once they properly distinguish an average taken across possible worlds from the average that one and the same person actually accumulates across time. I would like to understand, before the seminar reconvenes, whether this distinction marks a substantive difference in what rationality demands under repeated risk, or whether it collapses on reflection into a familiar fact about risk-averse preferences expressed in unfamiliar terms.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A graduate seminar on decision theory.
      *   **The Scenario:** A biased coin ($p=0.6$ for Heads). Even-money bets (win stake or lose stake). Infinite/long sequence of rounds.
      *   **The Professor's Stance:** Rational, risk-neutral agents should bet 100% of bankroll each round to maximize Expected Value (EV) of wealth.
      *   **The Student's Objection:** Betting 100% leads to almost certain ruin (probability of at least one Tail $\to 1$ as rounds $\to \infty$). Professionals bet a fraction (specifically mentions $\approx 20\%$, which hints at Kelly Criterion).
      *   **The Core Question:** Is the student identifying a genuine shortcoming in standard Expected Value (EV) reasoning for sequential compounding wagers (ergodicity breaking), OR is this just Expected Utility Theory (EUT) with a logarithmic utility function disguised as something else?
      *   **The Student's Claim:** This isn't about risk aversion; it's about the difference between ensemble averages (across possible worlds) and time averages (across time for one person).
      *   **Goal:** Help the professor understand if this is a substantive distinction in rationality or just a redescription of risk aversion.

  2.  **Deconstruct the Mathematical Problem:**
      *   **Game:** Bet fraction $f$ of wealth $W$.
      *   **Outcome Heads ($p=0.6$):** $W_{new} = W(1 + f)$.
      *   **Outcome Tails ($q=0.4$):** $W_{new} = W(1 - f)$.
      *   **Professor's Logic (Maximize Expected Wealth $E[W_n]$):**
          *   $E[W_1] = p W_0(1+f) + q W_0(1-f) = W_0 (1 + f(p-q))$.
          *   Since $p=0.6, q=0.4$, $p-q = 0.2 > 0$.
          *   To maximize $E[W_1]$, set $f=1$.
          *   By induction, $E[W_n] = W_0 (1 + f(p-q))^n$. Maximized at $f=1$.
          *   *Result:* $E[W_n]$ grows exponentially with $f=1$.
          *   *Caveat:* With $f=1$, if *any* tail occurs, $W_n = 0$. Probability of no tails in $n$ rounds is $p^n \to 0$. So, with probability 1, $W_n = 0$.
          *   *Paradox:* The Expected Value is huge, but the *actual* outcome for almost all paths is zero.

      *   **Student's Logic (Maximize Growth Rate / Time Average):**
          *   Look at the geometric growth rate.
          *   $W_n = W_0 (1+f)^H (1-f)^T$, where $H$ is heads count, $T$ is tails count.
          *   By Law of Large Numbers, $H/n \to p$, $T/n \to q$.
          *   $\frac{1}{n} \log(W_n/W_0) \to p \log(1+f) + q \log(1-f)$.
          *   This is the expected logarithmic growth rate.
          *   Maximize $g(f) = p \log(1+f) + q \log(1-f)$.
          *   Derivative: $p/(1+f) - q/(1-f) = 0 \Rightarrow p(1-f) = q(1+f) \Rightarrow p-pf = q+qf \Rightarrow p-q = f(p+q) \Rightarrow f = p-q$.
          *   With $p=0.6, q=0.4$, optimal $f = 0.2$ (20%).
          *   This is the **Kelly Criterion**.

  3.  **Address the Core Philosophical/Theoretical Question:**
      *   *Is this just Log Utility?*
          *   Mathematically: Maximizing the geometric mean is equivalent to maximizing the expected value of the logarithm of wealth ($E[\log W]$).
          *   In standard Expected Utility Theory (EUT), choosing $f=0.2$ implies the agent has $U(W) = \log(W)$.
          *   Standard EUT interpretation: The agent is *risk-averse*.
          *   Student's interpretation: The agent is *risk-neutral* regarding utility, but recognizes that "Expected Wealth" is the wrong metric for a single trajectory over time. This is an **Ergodicity** argument.

      *   *The Ergodicity Argument (Ole Peters et al.):*
          *   Standard EV calculates an *ensemble average* (average across many parallel universes at time $n$).
          *   A single bettor experiences a *time average* (one path through time).
          *   The process is non-ergodic. The ensemble average does not equal the time average.
          *   If you care about what happens to *you* over time, you should maximize the time-average growth rate.
          *   This yields the Kelly criterion without invoking "psychological risk aversion." It's a structural feature of multiplicative dynamics.

      *   *Is it substantive or terminological?*
          *   *Terminological View:* Any behavior consistent with maximizing time-average growth in multiplicative wealth can be modeled as EUT with Log Utility. Therefore, it's just risk aversion.
          *   *Substantive View:* The justification matters. EUT says "you dislike risk." Ergodicity says "the metric 'Expected Wealth' is misleading for non-ergodic processes."
          *   If the student claims "even a bettor with no independent aversion to risk should still adopt his rule," they are arguing for the Ergodicity/Economic Growth perspective, not the Psychological Utility perspective.
          *   Does rationality demand maximizing $E[W]$ or maximizing the growth rate of $W$?
          *   If the goal is to end up with the most money *in this specific life*, $E[W]$ is the wrong target because the median outcome diverges from the mean outcome.
          *   However, if one can play the game in parallel (e.g., hedge across many independent instances), $E[W]$ maximization makes sense.
          *   Since the student is a single individual, the time-average is the relevant metric for survival and long-term wealth accumulation.

  4.  **Synthesize the Answer:**
      *   **Validate the Student:** The student is mathematically correct about the outcome (Kelly Criterion, $f = p - q = 0.2$). The "bet everything" strategy leads to ruin with probability 1.
      *   **Validate the Professor (partially):** In standard Von Neumann-Morgenstern (VNM) Expected Utility Theory, maximizing $E[W]$ *is* the definition of risk neutrality. If you define rationality as maximizing $E[W]$, the professor is right.
      *   **The Crux:** The disagreement is about the *objective function* of rationality in dynamic settings.
      *   **Ergodicity Economics:** Explain the distinction between Ensemble Average (what the professor used) and Time Average (what the student used). This is the work of Ole Peters and others.
      *   **Log Utility Connection:** Acknowledge that mathematically, maximizing time-average growth is isomorphic to maximizing $E[\log W]$.
      *   **Substantive vs. Terminological:**
          *   It *is* terminological in the sense that the behavior is identical to Log Utility.
          *   It *is* substantive in the sense that the *justification* differs. One relies on psychological preference (risk aversion), the other on physical/mathematical structure of the process (non-ergodicity).
          *   The student's claim that "even a risk-neutral bettor" should do this relies on redefining "rational" from "maximize expectation of wealth" to "maximize long-term growth rate of wealth."
      *   **Recommendation:** Acknowledge the nuance. The professor's answer is standard textbook EUT. The student's answer is standard Kelly/Ergodic theory. Both have merit depending on the axioms chosen. The student isn't "wrong," but neither is the professor "wrong" within the VNM framework. However, for a *single* agent over *time*, the student's critique of EV is powerful.

  5.  **Refine the Argument (Self-Correction/Nuance Check):**
      *   *Wait, is the student right that it's not risk aversion?*
          *   In EUT, Log Utility *is* risk aversion. So if the student says "this is not risk aversion," they are rejecting the EUT framework's definition of risk. They are saying the risk is *objective* (ruin), not *subjective* (disutility of loss).
          *   This is a key distinction. In EUT, ruin is bad because $U(0)$ is low. In Ergodic theory, ruin is bad because the time-average growth rate becomes $-\infty$.
      *   *Is the distinction substantive?*
          *   Yes, because it changes how we model agents. If it's just utility, we fit a curve to behavior. If it's ergodicity, we derive behavior from the dynamics of the environment.
          *   Also, it matters for policy and ethics. Is the agent "irrational" for not betting 100%? EUT says yes (if risk neutral). Ergodicity says no (100% is irrational because it ignores the dynamics).
      *   *What about the "risk-neutral" claim?*
          *   A truly risk-neutral agent (linear utility) *should* bet 100% if the goal is $E[W_n]$.
          *   But if the goal is "wealth in the long run for a single path," linear utility is the wrong metric.
          *   So the student is arguing that "rationality" implies caring about the time-path, not the ensemble mean.

  6.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the depth of the question. It touches on the Kelly Criterion, Ergodicity, and the foundations of Expected Utility.
      *   **Mathematical Verification:** Confirm the student's numbers ($f^* = 0.2$) and the ruin probability of the professor's strategy.
      *   **The Two Frameworks:**
          1.  **Expected Utility (VNM):** Your answer holds here. Risk neutrality = Linear Utility = Bet 100%. Student's behavior = Log Utility = Risk Averse.
          2.  **Ergodicity/Time-Average:** Student's answer holds here. Distinguishes Ensemble vs. Time averages. Non-ergodic process.
      *   **Addressing the "Substantive vs. Terminological" Question:**
          *   Mathematically isomorphic? Yes (Log Utility).
          *   Conceptually distinct? Yes. One is preference-based, one is dynamics-based.
          *   Does rationality demand the student's view? In sequential compounding, maximizing $E[W]$ is often considered a "money pump" or misleading because the median outcome diverges from the mean.
      *   **Conclusion:** The student has identified a genuine limitation of applying static EV reasoning to dynamic, multiplicative processes. It is not *merely* terminological, though it maps onto Log Utility. It challenges the definition of the objective function for a single agent over time.

  7.  **Final Polish:** Ensure tone is respectful to both professor and student. Use precise terminology (Kelly Criterion, Ergodicity, Geometric Mean vs. Arithmetic Mean). Highlight Ole Peters' work as it's exactly this debate.

      *(Self-Correction during drafting)*: Make sure to clarify that "risk-neutral" in the student's mouth means "cares only about money," whereas in EUT "risk-neutral" means "linear utility of money." The student is arguing that caring only about money *over time* necessitates non-linear betting behavior due to the math of compounding, not due to psychological aversion.

      *Key Insight to emphasize:* The expectation value $E[W]$ is dominated by extremely rare paths where the bettor wins every time. These paths pull the average up, but they are not the path *you* will take. This is the "non-ergodic" heart of the matter.

  8.  **Final Review against constraints:** The user wants to know if it's a genuine shortcoming or just redescription. I need to take a stance while acknowledging the complexity.
      *   *Stance:* It is a genuine shortcoming of *naive* EV reasoning in dynamic contexts, but it is isomorphic to Log Utility in static EUT. The "substantive" part is the justification for *why* Log Utility is appropriate (dynamics vs. psychology).

