answer: |-
  This is a profound question that cuts to the heart of decision theory, touching on the Kelly Criterion, the ergodicity problem in economics, and the interpretation of Expected Utility Theory (EUT). You and your student are effectively reenacting a debate that has gained significant traction in recent years, notably through the work of physicist Ole Peters and others in the field of "ergodicity economics."

  Here is the breakdown of the situation to help you prepare for your seminar.

  ### 1. The Mathematical Facts
  First, it is important to validate the mathematics on both sides, as both are technically correct within their own frameworks.

  *   **Your Position (Maximize Expected Wealth):**
      If $W_0$ is initial wealth and $f$ is the fraction staked, the expected wealth after one round is:
      $$E[W_1] = 0.6 \cdot W_0(1+f) + 0.4 \cdot W_0(1-f) = W_0(1 + 0.2f)$$
      To maximize this, you set $f=1$. By induction, the expected wealth after $n$ rounds is $W_0(1.2)^n$. This grows exponentially. Your advice is correct **if** the objective is to maximize the *arithmetic mean* of wealth across an ensemble of parallel universes.

  *   **Your Student's Position (Maximize Growth Rate):**
      In a sequential game, wealth compounds. After $n$ rounds with $k$ heads, wealth is $W_n = W_0(1+f)^k(1-f)^{n-k}$.
      By the Law of Large Numbers, as $n \to \infty$, the ratio $k/n \to 0.6$. The long-term behavior is determined by the geometric mean, or equivalently, the expected logarithm of wealth:
      $$\lim_{n \to \infty} \frac{1}{n} \log\left(\frac{W_n}{W_0}\right) = 0.6 \log(1+f) + 0.4 \log(1-f)$$
      Maximizing this growth rate yields the **Kelly Criterion**: $f^* = p - q = 0.6 - 0.4 = 0.2$.
      Your student is correct that betting $f=1$ leads to ruin with probability 1 (since $P(\text{at least one tail}) \to 1$), rendering the massive expected value irrelevant for a single trajectory.

  ### 2. Is It Terminological or Substantive?

  You asked whether the student's distinction is merely a redescription of risk-aversion (log utility) or a genuine shortcoming in expected-value reasoning. The answer is **both**, depending on whether you view decision theory as a description of preferences or a prescription for dynamics.

  #### The "Terminological" View (Standard EUT)
  In the standard Von Neumann-Morgenstern (VNM) Expected Utility framework, rationality is defined as maximizing $E[U(W)]$.
  *   If an agent maximizes $E[W]$, they have linear utility ($U(W) = W$) and are **risk-neutral**.
  *   If an agent maximizes the geometric growth rate, they are mathematically equivalent to an agent maximizing $E[\log(W)]$. In VNM terms, this is **logarithmic utility**, which exhibits constant relative risk aversion.

  From this perspective, your student is simply describing a risk-averse agent. If you define a "risk-neutral" agent as one with linear utility, then your original answer was correct: a risk-neutral agent *should* bet everything. The student's claim that a "risk-neutral" bettor should bet 20% is, in standard EUT terminology, a contradiction in terms.

  #### The "Substantive" View (Ergodicity Economics)
  However, your student's objection points to a substantive critique of how EUT is applied to dynamic processes. This is the **ergodicity argument**.

  *   **Ensemble vs. Time Average:** Standard EV calculates an *ensemble average* (the average wealth of 1,000,000 people playing once). The student is concerned with the *time average* (the wealth of 1 person playing 1,000,000 times).
  *   **Non-Ergodicity:** The system is non-ergodic; the time average does not equal the ensemble average. The ensemble average is skewed by vanishingly rare paths where the bettor wins every single time. These paths pull the expected value up to infinity, but no single individual will ever experience that path.
  *   **The Definition of Rationality:** The student argues that for a single agent living through time, the "rational" objective function is the time-average growth rate, not the ensemble-average wealth.

  In this view, the logarithm does not represent a psychological "aversion to risk" (a subjective preference); it represents the **mathematical structure of compounding**. The student is arguing that even an agent who cares *only* about money (no psychological risk aversion) should maximize the time-average growth rate, because that is the only way to actually accumulate money over time.

  ### 3. Resolution for the Seminar

  You can resolve this in class by distinguishing between the **objective function** and the **dynamics of the environment**.

  1.  **Acknowledge the Validity of Both:**
      *   You were teaching **static decision theory**: Given a choice between lotteries, a risk-neutral agent maximizes expected monetary value.
      *   The student is describing **dynamic portfolio theory**: Given a sequence of multiplicative bets, maximizing expected monetary value leads to ruin.

  2.  **Address the "Risk-Neutral" Claim:**
      The student is right that the behavior (betting 20%) is robust for long-term survival, but he is stretching the definition of "risk-neutral."
      *   **Correction:** It is more precise to say that in multiplicative dynamics, **maximizing expected wealth is a pathological objective for a single agent.**
      *   The "risk" here is not subjective disutility; it is the objective risk of absorption (ruin). Once you hit zero, you cannot play. Standard EV ignores the absorbing barrier at zero.

  3.  **The Verdict on "Substantive Difference":**
      Is it a genuine shortcoming in ordinary EV reasoning? **Yes.**
      Ordinary EV reasoning assumes that the expectation value is a good proxy for what will happen. In non-ergodic, multiplicative processes, it is not. The expectation value is dominated by outcomes that have probability approaching zero.
      
      Is it just Log Utility? **Mathematically, yes; Philosophically, no.**
      While the behavior is isomorphic to Log Utility, the *justification* differs.
      *   **EUT Justification:** "I bet 20% because I feel pain from losses."
      *   **Ergodic Justification:** "I bet 20% because the math of compounding dictates that any other fraction reduces my long-term growth rate."

  ### Recommendation for Class Discussion

  You might frame the resolution this way:

  > "My student has correctly identified that Expected Value maximization is insufficient for sequential, compounding wagers where ruin is absorbing. This is known as the **Kelly Criterion**.
  >
  > In standard Expected Utility Theory, we would model this behavior by assigning the agent a logarithmic utility function, which we call 'risk aversion.' However, the student's deeper point is from **ergodicity economics**: the distinction between what happens on average across a population (ensemble) and what happens to an individual over time (time average).
  >
  > If we define rationality as 'doing best for oneself over a lifetime,' then the student is right: maximizing Expected Wealth is irrational because it optimizes for a parallel universe you will not inhabit. However, if we define 'risk-neutral' strictly as 'linear utility of wealth,' then my original statement holds, but it serves as a warning: a truly risk-neutral agent in this specific dynamic game will almost surely go broke.
  >
  > Therefore, the disagreement is not merely terminological. It highlights a limitation of applying static Expected Value reasoning to dynamic, non-ergodic systems. The logarithm arises not necessarily from psychology, but from the geometry of growth."

  This validates your student's sophisticated intuition (which is mathematically sound) without invalidating the standard curriculum (which defines risk neutrality via linear utility). It elevates the discussion to the properties of the stochastic process itself.

  **Reference for your preparation:** You may wish to look up **Ole Peters' work on ergodicity economics** (e.g., "The ergodicity problem in economics" or his lectures on the St. Petersburg Paradox). He argues exactly what your student is arguing: that many behaviors attributed to "risk aversion" are actually rational responses to non-ergodic dynamics.
