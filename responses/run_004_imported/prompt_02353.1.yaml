answer: |-
  This is an exceptionally sharp reading of the *Monadology*, and your connection to the modern causal exclusion argument is spot-on. You have identified one of the most notorious tension points in Leibniz's metaphysics. Your friend's suggestion that Leibniz is a "polite epiphenomenalist" is a common critique, but to understand whether it sticks, we have to unpack what Leibniz means by "cause," "act," and "substance."

  Here is a breakdown of what Sections 78–81 commit Leibniz to, how it relates to epiphenomenalism, and why his system attempts to sidestep the modern exclusion problem rather than solve it in the way a physicalist would expect.

  ### 1. Decoding Section 81: The "As If" Clauses
  You are rightly troubled by the three clauses in Section 81. Let's parse them using Leibniz's metaphysics of **immanent causation**.

  *   **"Bodies act as if there were no souls at all":** This refers to the realm of **Efficient Causes** (physics). Leibniz argues (in Section 80) that the laws of motion (conservation of force and direction) are closed. You do not need to posit a "ghost in the machine" nudging atoms to explain why a hand rises. A complete physical explanation involves only prior physical states and laws of motion.
  *   **"Souls act as if there were no bodies":** This refers to the realm of **Final Causes** (psychology/teleology). A monad (soul) has no windows. Its next state is determined entirely by its own internal nature and its preceding state, driven by "appetite" toward what it perceives as good. It does not need the body to tell it what to think; its perceptions unfold from within.
  *   **"Both... act as if the one were influencing the other":** This is the **Pre-established Harmony**. Because God synchronized every monad at the beginning of time, the internal unfolding of the soul (I *will* to raise my hand) matches perfectly with the internal unfolding of the bodily monads (the nerves and muscles *move* to raise the hand).

  **The Crucial Distinction:** For Leibniz, substances do not interact via **transitive causation** (A pushes B). They interact via **immanent causation** (A unfolds its own nature). The "influence" is not a transfer of energy; it is a correlation of internal scripts.

  ### 2. Is Leibniz an Epiphenomenalist?
  Your friend's diagnosis is understandable from a modern perspective, but Leibniz would reject the label **epiphenomenalist**. Here is why:

  **The Modern Definition:** In modern philosophy of mind, epiphenomenalism usually assumes physicalism. It says mental states are byproducts of physical brain states and have no causal power *over the physical*.

  **Leibniz's Rejection:** Leibniz is not a physicalist; he is an **idealist**. For him, "matter" or "body" is not the fundamental reality; it is a "well-founded phenomenon" resulting from aggregates of monads. The soul (the dominant monad) is *more* real than the body.
  *   **Does the soul cause the hand to rise?** In the sense of transferring energy to the muscles? **No.** (So, physically, it looks like epiphenomenalism).
  *   **Does the soul explain the hand rising?** **Yes.** For Leibniz, a full explanation requires both efficient causes (mechanism) and final causes (purpose). If you remove the soul's decision, you have removed the *reason* the event occurred, even if the mechanical chain remains intact.

  Leibniz would argue that calling him an epiphenomenalist privileges efficient causation (physics) as the only "real" causation. He insists that final causation (purpose) is equally real. The soul is not powerless; it is the **teleological ground** of the action.

  ### 3. The Causal Exclusion Argument Comparison
  Your intuition here is excellent. Leibniz essentially anticipates the **Causal Exclusion Argument** by roughly 300 years.

  **The Modern Argument:**
  1.  **Closure:** Every physical event has a sufficient physical cause.
  2.  **Distinctness:** Mental properties are distinct from physical properties.
  3.  **Exclusion:** If the physical cause is sufficient, there is no work left for the mental cause to do.
  4.  **Conclusion:** Either mental properties are physical (reductionism) or they do nothing (epiphenomenalism).

  **Leibniz's Version (Sections 79–80):**
  1.  **Closure:** Bodies follow laws of motion/force conservation; no external force (from a soul) is needed or possible (Section 80).
  2.  **Distinctness:** Souls (final causes) and Bodies (efficient causes) are distinct realms.
  3.  **Harmony (The "Escape"):** Leibniz denies the premise that the two causes **compete**.

  **How Leibniz Escapes:**
  The modern exclusion argument assumes that efficient and mental causes are vying for the same ontological slot (i.e., both are trying to be the "pusher" of the effect). Leibniz says they are describing the **same event** from two different perspectives that cannot contradict each other because they are synchronized by God.

  *   **Physics Story:** "The hand rose because neurons fired and muscles contracted according to laws of motion." (True)
  *   **Psychology Story:** "The hand rose because I wanted to ask a question." (True)

  For a modern physicalist, these two stories conflict if the first one is *complete*. For Leibniz, the first story is only complete *within the realm of phenomena*. The second story is complete *within the realm of substances*. Because the realms are harmonized, not interacting, there is no exclusion.

  ### 4. What Sections 78–81 Commit Leibniz To
  To answer your specific question about what these sections commit him to regarding mental causation:

  1.  **No Transitive Mental Causation:** Leibniz is committed to the view that the mind cannot physically intervene in the chain of physical events. If you are looking for a model where the mind "zaps" the brain to make it fire, Leibniz says that is impossible (and violates conservation laws).
  2.  **Explanatory Autonomy:** The mental realm is autonomous. You can explain human action entirely through psychology (desires, ends) without referencing physics, and entirely through physics without referencing psychology. Neither explanation invalidates the other.
  3.  **The Primacy of the Mental:** Despite the "powerlessness" to move matter, Leibniz views the soul as the dominant substance. The body exists *for the sake of* the soul's expression. The harmony is established so that the physical world mirrors the mental perfection of the monads.

  ### Summary: Is the Comparison Fair?
  **Yes, the comparison holds up.** Leibniz accepts a version of causal closure (Section 80 explicitly praises the discovery of conservation laws for making his system viable).

  **However, Leibniz avoids the *consequence* of the exclusion argument (epiphenomenalism) by rejecting the underlying metaphysics of the argument.**
  *   **Modern Exclusion:** Assumes the physical world is the base reality. If the mind isn't physical, it's left out.
  *   **Leibniz:** Assumes the mental (monadic) world is the base reality. The physical is a derivative expression.

  So, is the soul causally powerless?
  *   **Mechanically:** Yes. (Your friend is right).
  *   **Teleologically:** No. (Leibniz is right, on his own terms).

  Leibniz's solution is to say that your decision to raise your hand *does* explain why your hand goes up, not because it pushed the hand, but because your hand going up was pre-programmed from the beginning of time to correspond exactly to that decision. It saves the *reality* of mental causation by sacrificing the *interaction* of mental and physical causation. Whether that satisfies you depends on whether you accept that "pre-established harmony" is a valid substitute for interaction!
