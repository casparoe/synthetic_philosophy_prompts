  ### **Note for the TA (You)**
  Since you mentioned you were debating this last night: The student's confusion on the "equal weights" issue is extremely common. Harsanyi has two main arguments:
  1.  **The Aggregation Theorem:** If individuals and society satisfy vNM + Pareto, then $W = \sum a_i U_i$. (This is positive/structural).
  2.  **The Veil of Ignorance:** If you don't know who you are, you should choose the society that maximizes average utility. (This is normative and justifies $a_i = a_j$).

  The exam question asked about the **Theorem**. The student answered with **Theorem + Veil**. That is the core reason for the deduction in section 2. If you keep that distinction clear in your head, you'll be on solid ground grading the rest of the stack.
