      *   *The "Strongest Move":* The *Iterated Cases / Large Numbers* argument (often linked to the "Each-We" distinction or simply the absurdity of ignoring scale). If you face a choice between saving 1 person vs. 1,000,000, flipping a coin seems morally monstrous. Parfit argues that "separateness of persons" doesn't preclude aggregation for decision-making purposes.
      *   *Key Concept:* The "Principle of Aggregation" or "Minimizing Harm." If I can prevent more deaths without extra cost to myself, I ought to.

