  4.  **Refining the Theology (The "Weeds"):**
      *   *Grounding Objection:* Marcus needs to press that truth requires an ontological ground. If the creature doesn't exist, and God didn't decree it yet (in the Molinist order), what makes "If Peter were in situation S, he would deny Christ" true?
      *   *Molinist Defense:* Danny needs to appeal to God's omniscience regarding possibilities. The truth lies in the logical relation, not the actual existence.
