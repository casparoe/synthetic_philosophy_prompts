      *   **Marcus (Reformed):** Needs to sound dogmatic but warm (they are friends). Defends God's sovereignty. Uses terms like "decree," "grounding," "truthmaker," "compatibilist." Likely drinking something darker or stronger. Let's give him a scotch.
      *   **Dynamic:** Old friendship means they can skip the pleasantries quickly and use nicknames or shared history references.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the setting and the immediate tension. The wedding context provides a natural segue (love, choices, fate).
      *   **The Hook:** Marcus makes a jab about the wedding vows or the couple's "choice." Danny takes the bait.
