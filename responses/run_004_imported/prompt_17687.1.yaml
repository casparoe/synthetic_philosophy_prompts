answer: |-
  The bass from the reception band thumped through the floorboards, vibrating the ice in Danny's bourbon. He leaned against the mahogany bar, watching the newlyweds cut the cake.

  "Look at them," Marcus said, sliding onto the stool next to him. He signaled the bartender for a scotch, neat. "So sure they're writing their own story."

  Danny smiled, tired but warm. "They are, Marc. That's the point of the sacrament. Two wills, one flesh."

  "Two wills bound by a decree they don't see," Marcus corrected, taking the glass. "Ephesians one. Chosen in Him before the foundation of the world. Not 'choosing.'"

  "Here we go. Ten years since Princeton, and you're still preaching to the choir at an open bar."

  "I'm just reminding the Jesuit that God doesn't wait on man." Marcus swirled his drink. "Speaking of waiting, how's the middle knowledge holding up? Still think God sits around wondering what you *would* do before He decides what you *will* do?"

  Danny took a slow sip. "It's not wondering, Marcus. It's knowing. Natural knowledge first—all necessary truths. Then Middle Knowledge—all counterfactuals of creaturely freedom. Then Free Knowledge—the decree. God knows exactly what any free creature would do in any set of circumstances."

  "The Grounding Objection, Danny," Marcus said, pointing a finger. "We've been over this. If the creature doesn't exist yet, and God hasn't decreed the world yet, what *makes* those counterfactuals true? Truth requires a truthmaker. If I don't exist, there's no 'me' to ground the proposition 'If Marcus were in situation S, he would freely choose X.' You're positing truths floating in the ether, ungrounded. That's Platonism, not theology."

  Danny turned to face him fully. "The truthmaker isn't the actual existence of the creature. It's the nature of the possible creature as known by God. God knows His own power to create, and He knows the logical relations between circumstances and agents. The truth lies in the compatibility of the agent and the circumstance within the divine intellect."

  "So the proposition is true because God thinks it?"

  "No. God thinks it because it *is* true. He doesn't determine them; He surveys them."

  "Surveys them," Marcus scoffed. "Like a menu. 'Let's see, in World A, Peter denies Christ. In World B, Peter flees. I like World A better.' So He actualizes World A. But if He actualizes World A knowing Peter *will* deny Christ, and Peter *cannot* do otherwise in World A because if he did, it would be World B... then in what sense is Peter free?"

  "Libertarian freedom," Danny said. "The source of the action is within Peter. God provided the circumstances, yes. But the *causality* of the denial comes from Peter's will, not God's decree. God knew Peter would do it freely, so He placed him there."

  Marcus shook his head. "It's a distinction without a difference. If God selects the world where I sin, He selects my sin. You say He permits it, but if He could have actualized a world where I didn't sin, and He didn't, then He intended the sin. You're trying to save libertarian freedom by pushing the determinism back a step. You make God the author of the script, then pretend the actors are improvising."

  "And you make God the puppeteer," Danny shot back, his voice lowering. "If there are no true counterfactuals, if God determines the will directly, then evil comes from God's causal hand. In Molinism, God risks creation. He knows that to get the Incarnation, He has to allow the Fall. He doesn't cause the Fall; He knows it's the necessary cost of the feasible world where the maximum number of people freely come to know Him."

  "Feasible," Marcus mused. "Meaning, there are some worlds God *can't* create?"

  "Meaning, God can't actualize a world where creatures freely do X if, in those circumstances, they would freely do Y. Even God can't force a free choice to be free."

  "Exactly," Marcus said, leaning in. "So He's limited by these counterfactuals. And if He's limited by them, and they're true from eternity, then they constrain God. You've put something co-eternal with God that He didn't decree. You've compromised sovereignty to save a philosophical notion of freedom that Scripture doesn't demand."

  Danny looked down at his bourbon. The ice had melted, diluting the burn. "I compromise nothing. I protect the goodness of God. If I sin, it is mine. If I love, it is mine. God gets the glory because He orchestrated the stage, but I bear the weight of the act. Your view... it makes the evil in the world something God specifically ordained for His glory. That's a harder pill to swallow at a wedding, Marcus."

  Marcus looked out at the dance floor. The bride was laughing, head thrown back. "It is a hard pill. But it's the only one that doesn't make God a spectator. He's not surveying feasible worlds, Danny. He's speaking light into darkness. If I am free, it's because He sustains me in that freedom moment by moment. Not because He checked a box labeled 'What Marcus Would Do.'"

  "So you think I'm wrong."

  "I think you're trying to solve a mystery that's meant to humble us." Marcus clinked his glass against Danny's. "But you argue it better than Plantinga."

  Danny smiled, a genuine, tired smile. "And you argue it better than Edwards. Though you both still miss the point."

  "Oh?"

  "The point," Danny said, finishing his drink, "is that they're married. However it happened. However it was known. They're still standing there."

  Marcus nodded, finishing his scotch. "Soli Deo Gloria, Danny."

  "Soli Deo Gloria, Marc."

  They stood in silence for a moment, the music swelling, two old friends agreeing that the mystery was bigger than the map.
