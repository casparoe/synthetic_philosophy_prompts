      *   *Move 2: Lack of Intentionality.* Words are signs of thought. LLMs manipulate signs without thought. They are "parrots on steroids," not thinkers.
      *   *Move 3: The Unity of Reason.* LLMs are fragmented. They can't hold a coherent belief system. They contradict themselves. Reason implies a unified subject.
      *   *Move 4: Embodiment/Action.* Descartes emphasizes acting in the world. LLMs are passive text generators.

