      *   *LLM Weakness:* LLMs fail at logical consistency, long-term planning, and true novelty. They are bounded by training data. They "fall apart" in ways humans don't (e.g., simple logic puzzles, context window limits, lack of embodied agency).
      *   *The "Universal Instrument" Point:* Descartes defines reason as the ability to adapt to *all* contingencies of life. An LLM cannot act in the world; it can only output text. It lacks the *unity* of agency.

  5.  **Synthesize the "Principled Cartesian Move":**
      *   Descartes wouldn't be shaken. He would double down on the *source* of the behavior.
