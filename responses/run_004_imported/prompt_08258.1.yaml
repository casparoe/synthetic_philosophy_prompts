prompt: |-
  Ok this has been bugging me since todays proof theory seminar. Gödel's second incompleteness theorem means PA and ZFC can't prove their own consistency - doesn't that actually give us decent reason to suspect they might be inconsistent? And if ZFC is inconsistent, then by explosion literally every sentence, including its negation, is already a theorem, so something like the twin prime conjecture is technically already 'decided' in the system, we just cant see the proof. I brought this up with my advisor and she just said 'that's not really how it works' and moved on, which wasn't super satisfying. Why is everyone so confident ZFC is consistent when incompleteness is literally telling us there's no way to check that from the inside? Am I misunderstanding something, or is this actually as big a deal as it sounds?
