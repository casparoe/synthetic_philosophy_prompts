answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name], and I have the distinct honor of offering the toast. I was given a specific brief for this speech. There are four phrases I am strictly forbidden from using: "meant to be," "soulmate," "fate," and "everything happens for a reason."

  For most couples, avoiding those words would be a constraint. For [Partner A] and [Partner B], avoiding them is the entire point. To use them would be what Sartre calls *mauvaise foi*—bad faith. It would be pretending that their relationship is a fixed fact of the universe, a comfortable object resting in the world, rather than what it actually is: a terrifying, exhilarating, continual act of freedom.

  They met in a graduate seminar on *Being and Nothingness*. Now, for the half of the room currently checking their phones for the definition of "ontology," don't worry. You don't need to know the difference between the in-itself and the for-itself to know love when you see it. But it helps to know the stakes.

  Jean-Paul Sartre was not a romantic. In fact, his account of love in *Being and Nothingness* is famously bleak. He argued that human relationships are inherently conflictual. He believed that when we love, we are trapped in a paradox: we want the other person to be free to choose us, but we also want that choice to be secure, guaranteed, and permanent. We want to be loved by a freedom that no longer feels like a risk. Sartre thought this was impossible. He thought love inevitably collapses into either trying to dominate the other person or erasing yourself to become an object for them. He never married. He didn't think it was philosophically honest.

  So, when [Partner A] and [Partner B] asked me to stand here, they knew the irony. They know that according to the text they studied together, this union is a contradiction. They know that there is no cosmic glue holding them together. There is no destiny that ensured they would sit next to each other in that seminar. There was only contingency. There was only chance.

  But here is where they improve on the master. Sartre was right that there are no guarantees. He was right that we are "condemned to be free." But he underestimated the courage it takes to look into that abyss of uncertainty and say, "I choose you anyway."

  This marriage is not a contract that secures the future. It is not a way to stop choosing. It is a promise to keep choosing.

  To the guests who know the philosophy: You will notice they are not trying to become an "in-itself." They are not trying to freeze this moment into a statue. They know that tomorrow, they will wake up as different people than they are today. They know that "bad faith" is always waiting, tempting them to pretend the hard work is done.

  To the guests who are just here for the cake: What this means, in plain English, is that [Partner A] and [Partner B] love each other without illusions. They don't love the idea of each other. They love the reality. They know that nothing forces them to stay. No stars aligned. No divine plan is protecting them. The only thing protecting this marriage is their own daily, deliberate decision to build it.

  There is a profound comfort in that. Because if your love is not a matter of fate, then it cannot be taken away by fate. It belongs to you. It is yours to make, yours to sustain, and yours to renew.

  Sartre wrote that "existence precedes essence." You do not start with a definition; you create one through your actions. [Partner A] and [Partner B], you are not starting this marriage with a definition of who you are supposed to be. You are starting it with the freedom to become who you choose.

  So, I ask you all to raise your glasses. Not to destiny, and not to a happy ending. But to the courage of the beginning. To the radical freedom of two people who know the world is contingent, and who have decided, against all odds and without any guarantees, to make a world together.

  To [Partner A] and [Partner B].
