          2.  *Arational/Bedrock (Duncan Pritchard/Wittgensteinian Fideism):* Hinges are outside the space of reasons. They are arational commitments. Calling them "entitled" smuggles evidentialism back in.
      *   **Format:** A dialogue between two philosophers (one for each side).
