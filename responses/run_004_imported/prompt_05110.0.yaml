      *Decision:* The strongest steelman is that LLM systematicity is **derivative** (borrowed from human data) and **fragile**, whereas human systematicity is **intrinsic** and **robust**. Therefore, LLMs do not demonstrate that a non-symbolic system can *ground* systematic thought; they only show it can mimic the *shadow* of it.

  9.  **Finalizing the Structure:**
      1.  Introduction: Validate the puzzle, state the thesis (Fodor is not dead).
      2.  Argument 1: Derivative vs. Intrinsic Systematicity (The Data Mirror).
