answer: |-
  The marker squeaked as Elena closed the loop on the whiteboard. Three nodes, three arrows, a cycle: *A > B > C > A*. She capped the pen and turned to Julian, wiping a smudge of blue ink from her thumb.

  "Look at it," Elena said. "You start with A. You prefer B, so you pay a penny to switch. You prefer C, pay a penny to switch. You prefer A, pay a penny to switch. You're back at A, minus three cents. If rationality forbids sure loss, rationality forbids cyclic preferences. Transitivity isn't just aesthetic; it's a survival constraint."

  Julian leaned against the desk, arms crossed. "That argument only works on a naive chooser. McClennen settled this decades ago. If I'm a resolute chooser, I evaluate the whole tree at the initial node. I see the cycle, I see the drain, and I commit to a path. I don't maximize locally at every node; I maximize globally over the plan."

  "But what binds you at the second node?" Elena tapped the middle of the diagram. "At *t2*, you hold C. You prefer A to C. Your current preference ordering says 'trade.' If you refuse to trade, you aren't satisfying your preferences at *t2*. You're overriding them. That's not decision theory; that's willpower. You've changed the subject from 'what is rational to prefer' to 'how stubborn can you be?'"

  "You're assuming the only thing that can motivate action is the local preference ordering," Julian countered. "Why must rationality be cashed out as a sequence of disconnected local maximizations? If I view my agency as extended over time, the plan *is* the object of choice. When I stick to the plan at *t2*, I'm not overriding a preference; I'm executing a higher-order choice made at *t1* that governs the sequence."

  "That's just verbal sleight of hand," Elena said, uncapping the marker again. "At *t2*, you genuinely prefer A to C. If you choose C, you are acting against your preference. You're saying, 'I prefer A, but I'll choose C because I said I would.' That breaks the link between preference and choice. If preference doesn't drive choice, what work is it doing? And if it *does* drive choice, you get pumped. You can't have it both ways."

  "Or maybe," Julian said, pushing off the desk, "the money pump argument is begging the question. You say rationality requires transitivity because intransitivity leads to pumping. But the pumping only happens if we assume the agent *must* act on local preferences at every node. You've smuggled the conclusion into the premises. You're defining rationality as 'local maximization,' then proving that local maximizers need transitive preferences. But if rationality is about achieving global ends without sure loss, the resolute chooser is rational *despite* cyclic preferences."

  Elena drew a sharp line through the center of the cycle. "But now you've made preference inert. If I can have cyclic preferences but act transitively because I'm 'resolute,' then the preference ordering isn't explaining the behavior. The *resolution* is. So why talk about preferences at all? Just say rational agents need consistent plans. But that concedes my point: the underlying structure governing rational choice must be consistent. You've just moved the consistency requirement from the preference relation to the planning mechanism. You haven't escaped transitivity; you've just hidden it in the will."

  Julian walked to the board and drew a small box around the initial node. "I haven't hidden it; I've relocated it to where agency actually lives. You think preferences are these synchronic snapshots that dictate action. I think preferences are dispositions to choose within a temporal context. If I can dispose myself to avoid the pump without changing my pairwise judgments, then the pairwise judgments weren't the problem. The *naivety* was."

  "But what normativity carries you from *t1* to *t2*?" Elena pressed, her voice rising slightly. "At *t1*, the plan is optimal. At *t2*, the plan requires doing something you currently rank lower. What force does the *t1* self have over the *t2* self? If there's no binding mechanism, you're just hoping your future self ignores their own preferences. That's not a theory of rationality; it's a hope for self-control."

  "And if there *is* a binding mechanism," Julian shot back, "then you admit the agent is more than a sequence of momentary preference-satisfiers. Once you admit that, transitivity stops being a constraint on static orderings and becomes a constraint on dynamic strategies. So tell me: is transitivity supposed to be a truth about values, or a rule for not losing money? If it's the latter, I've won. If it's the former, you haven't proved anything except that your model of agency is too thin."

  Elena stared at the diagram, the blue cycle glaring between them. "If your model of agency requires you to ignore your current best judgment to avoid looking foolish, I'd rather take the loss."

  "And if your model of rationality says I'm irrational for keeping my money just because I won't maximize at every micro-step," Julian said, picking up his bag, "then maybe the model is what needs pumping out."

  He left the marker on the tray. Elena didn't erase the board.
