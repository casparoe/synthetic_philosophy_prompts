prompt: |-
  So this thing has been bugging me for like a week now and I honestly can't drop it. My roommate's had this gym membership for about three years, and because of some old sign-up promo, she's still getting billed the promo rate even though it obviously should've expired ages ago - she's like 90% sure it's just a billing mistake nobody at the gym ever caught. Over pizza I told her that's kind of messed up, like, what if everyone who noticed a mistake like that just quietly let it ride, the gym would go under eventually. But she had a whole comeback ready: she said the "what if everybody did this" test only makes her look bad if you state her rule in some vague general way, like "anyone who notices they're being undercharged should keep quiet." But if you describe the situation as specific as it actually is - someone who signed up for this exact promo, at this exact branch, around this exact date, who happens to notice this exact clerical error and says nothing - then basically nobody else on earth is ever gonna land in that exact situation, so her doing it could never generalize into some world where the gym goes bankrupt. Her point is that her rule technically passes fine, and that you could make basically any shady thing pass the same way, just by describing it specific enough.

  It kind of wrecked my brain because I couldn't find the hole in it right there at the table, but it still feels like a cheap trick and not an actual defense, like she's gaming a rule instead of actually being in the clear. So is she just cleverer then me here, or is there an actual answer for why your not allowed to slice up a situation that finely before you run the "what if everybody did it" test on it? I've read bits of old philosophy stuff on my own over the years here and there (never took an actual class, no degree or anything), so don't worry about it being too basic for me, I just don't know the proper words for a lot of this stuff.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **The Core Issue:** The user's roommate is undercharged for a gym membership due to a billing error. She justifies keeping the error by arguing that Kant's Categorical Imperative (specifically the "universalizability" test) fails if the maxim is described too generally, but passes if described hyper-specifically.
      *   **The Roommate's Argument:** "If *everyone* undercharged kept quiet, gyms would fail. But if *only people in this exact specific situation* (this promo, this branch, this date, this error) keep quiet, almost no one fits that description, so the gym won't fail. Therefore, my action is moral."
      *   **The User's Intuition:** This feels like a "cheap trick" or "gaming the system," but they couldn't articulate *why* in the moment. They want to know if there's a philosophical counter-argument.
      *   **User's Background:** Some self-taught philosophy reading, no formal degree. Comfortable with concepts but needs terminology.
      *   **Goal:** Validate the user's intuition, explain *why* the roommate's argument is flawed using philosophical concepts (Kant, universalizability, maxims), and provide a clear, accessible explanation without being condescending.

  2.  **Identify the Philosophical Concepts:**
      *   **Kant's Categorical Imperative (Formula of Universal Law):** "Act only according to that maxim whereby you can at the same time will that it should become a universal law."
      *   **The Problem of Maxim Formulation:** How specific or general should a "maxim" (the rule behind the action) be?
      *   **The Roommate's Strategy:** This is known as "gerrymandering the maxim" or making the maxim *too specific* (ad hoc).
      *   **Relevant Philosophers/Counter-arguments:**
          *   Onora O'Neill (Kant scholar): Discusses abstraction and relevance.
          *   Christine Korsgaard: Discusses the nature of maxims and practical identity.
          *   General Kantian interpretation: Maxims must be based on *relevant* features, not arbitrary ones.

  3.  **Drafting the Response - Section by Section:**

      *   **Validation:** Start by affirming the user's intuition. It *is* a cheap trick. They aren't missing something obvious; the roommate is exploiting a loophole in the *application* of the test, not the test itself.
      *   **Naming the Move:** Give it a name. "Gerrymandering the maxim" or "The Problem of Description." This gives the user the vocabulary they asked for.
      *   **Explaining the Flaw (The "Why"):**
