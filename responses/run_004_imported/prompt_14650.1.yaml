          *   *Purpose of the Test:* The test is meant to check for *contradictions in conception* or *will*. If you make the rule specific enough to apply only to one person, it ceases to be a *law* and becomes a *singular exception*.
          *   *The "Law" part:* Laws, by definition, apply to classes of people/actions, not unique snowflakes.
      *   **Analogy:** Use a clearer analogy to show the absurdity. (e.g., "It's okay for *me* to steal this specific wallet because I'm [Name], born on [Date], standing on [Spot].")
