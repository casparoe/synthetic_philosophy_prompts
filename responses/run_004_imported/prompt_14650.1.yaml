answer: |-
  You are absolutely right to feel that something is off here. Your intuition is spot-on: your roommate isn't being cleverer than you; she is exploiting a known loophole in how people *apply* moral tests, not a loophole in morality itself.

  In philosophy, specifically in Kantian ethics (which is where the "what if everybody did this" test comes from), this move has a name. It's often called **"gerrymandering the maxim"** or the **"problem of description."**

  Here is the breakdown of why her argument fails, the vocabulary you need to dismantle it, and why you can't slice a situation quite that finely.

  ### 1. The Terminology: What is a "Maxim"?
  To understand why she's wrong, we have to look at what the "what if everybody did this" test is actually testing. In Kantian ethics, you aren't testing the *action* (keeping the money); you are testing the **maxim**.

  A maxim is the subjective principle of volition. Put simply: **It is the rule you are following in your head when you act.**

  *   **Your Roommate's Maxim:** "Whenever I am the specific person [Name], at this specific gym, with this specific billing error, I will keep the underpayment."
  *   **The Actual Moral Maxim:** "Whenever I notice a billing error in my favor, I will keep the money."

  Kant's **Categorical Imperative** (the formal name for the test) says you must act only on maxims that you can will to become a **universal law**.

  ### 2. The Flaw: Relevance vs. Arbitrariness
  The hole in your roommate's argument is that she is including **morally irrelevant features** in her maxim to make it unique.

  For a maxim to be a valid candidate for universalization, the conditions within it must be *relevant* to the moral decision.
  *   **Relevant Condition:** "If I cannot afford to pay my bills..." (This speaks to need/survival).
  *   **Relevant Condition:** "If the service was not rendered..." (This speaks to contract/fairness).
  *   **Irrelevant Condition:** "If I signed up in 2021..." or "If my name is Sarah..."

  By packing her maxim with arbitrary details (the specific date, the specific branch, the specific clerical error), she is turning a **law** into a **singular exception**.

  A "law," by definition, applies to a *class* of things, not a single unique instance. If you describe a situation so specifically that only one person in history fits the description, it is no longer a rule; it is just a description of an event. Testing whether *that* can be universalized is meaningless because it *can't* be universalized by definition—no one else can ever be in that exact situation.

  ### 3. The "Reductio Ad Absurdum"
  The easiest way to show her why this is a cheap trick is to apply her logic to something clearly immoral, like stealing.

  If she says, "My specific details make my rule universalizable," you can say:
  > "Okay, so if I see a wallet on the ground, can I steal it? Well, if my rule is 'Anyone named [Your Name], born on [Your Birthday], standing on this specific street corner at 2:03 PM, can take this specific wallet,' then nobody else will ever do that. So the rule passes. Therefore, stealing is moral."

  Obviously, that's absurd. The reason it's absurd is that **your name and the time of day are not morally relevant to the act of theft.** Similarly, the specific year she signed up for the gym is not morally relevant to the act of paying for services rendered.

  ### 4. What Philosophers Say (The "Proper Words")
  Since you mentioned you've read some philosophy, here are the concepts that formalize your intuition:

  **Onora O'Neill on Abstraction:**
  The Kantian scholar Onora O'Neill argues that maxims must be formulated at the right level of **abstraction**. They can't be so vague that they mean nothing ("Do good things"), but they can't be so specific that they apply to no one else ("Do this thing right now"). They must capture the **type of action** being performed. The "type of action" here is *profiting from a known billing error*, not *profiting from a 2021 promo at Planet Fitness.*

  **Christine Korsgaard on Practical Identity:**
  Korsgaard argues that when we act, we are endorsing a reason for action. If your roommate's reason is "I am getting away with this," she is acting on a principle that undermines the very system of exchange she is participating in. She is treating the gym not as a partner in a contract, but as a resource to be exploited.

  **The "Contradiction in Will":**
  Kant argues that some actions fail the test because while you can *imagine* a world where everyone does them, you cannot *will* it.
  *   **The Scenario:** Imagine a world where *everyone* who notices a billing error keeps the quiet.
  *   **The Result:** Gyms (and businesses) would raise prices to cover losses, implement invasive audits, or go bankrupt.
  *   **The Contradiction:** Your roommate *wills* to have a gym membership. But if her rule were universalized, reliable gym memberships would cease to exist. Therefore, she is willing a world where her own goal (having a gym) becomes impossible. By making her rule hyper-specific, she tries to hide this contradiction, but the contradiction remains in the underlying principle of *dishonesty*.

  ### 5. Why It Feels Like a "Cheap Trick"
  It feels like a cheap trick to you because it is a form of **special pleading**. She is arguing that she deserves an exception to the rule without providing a morally relevant reason for *why* she deserves that exception.

  She is technically correct that *description matters*. (Philosophers agree with her there; if you describe the action as "exercising her right to free speech," burning a flag is moral. If you describe it as "destroying property," it's immoral).

  However, she is wrong that *any* description goes. The description must capture the **morally salient features** of the situation.
  *   **Salient Feature:** She is receiving a service.
  *   **Salient Feature:** She is being billed less than the agreed price due to an error.
  *   **Salient Feature:** She knows it is an error.

  The "2021 Promo" is not a salient moral feature; it's just administrative data.

  ### The Verdict
  You don't need to feel like you missed something. You identified a sophistry (a clever but false argument).

  **The Counter-Argument for Next Time:**
  Tell her: *"You're gerrymandering your maxim. The Universalizability test requires you to strip away arbitrary details like dates and names and look at the principle. The principle isn't 'Sarah keeps the 2021 rate.' The principle is 'Customers keep money when the business makes a mistake.' If everyone did that, trust in contracts would collapse, and you can't rationally will that while still wanting to use contracts yourself."*

  She isn't cleverer than you; she's just hiding behind a technicality that any ethicist would reject immediately.
