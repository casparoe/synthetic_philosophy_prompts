  Here is a draft for your handout. It skips the algebra and goes straight for the conceptual engine, then diagnoses the counterexamples by isolating the hidden assumptions.

  ***

  # Handout Supplement: The Intuition Behind Good's Theorem
  **Topic:** The Value of Free Evidence (Good, 1967)
  **The Claim:** A Bayesian expected-utility maximizer should never pay to avoid free, relevant evidence.

  ## 1. The Gut-Level Story: Information as "Option Value"
  The convexity proof is correct, but it obscures the mechanism. The intuitive engine of Good's Theorem is **conditioning**.

  When you act *without* evidence, you are choosing a single **Plan** (e.g., "Take the umbrella").
  When you act *with* evidence, you are choosing a **Strategy** (e.g., "If the barometer falls, take the umbrella; if it rises, leave it").

  A strategy is simply a menu of plans contingent on the state of the world. Crucially, **a strategy always includes the option to ignore the evidence.** If the evidence comes in and suggests your original blind plan was still best, the strategy allows you to stick with it. You only deviate from the blind plan when the evidence indicates a *better* alternative is available.

  Therefore, in expectation, you cannot lose. You are effectively giving yourself the option to change your mind, but never the obligation. Since you only change your mind when it increases expected utility, the expected value of the opportunity must be non-negative.

  **The Slogan:** *Information doesn't force you to act differently; it merely permits you to act differently when it pays to do so.*

  ## 2. Squaring the Circle: The "Ignorance is Bliss" Counterexamples
  Students will immediately raise cases where information seems harmful. These are not failures of the theorem; they are violations of its boundary conditions. Here is how to diagnose them in seminar.

  ### Case A: The Baby's Sex (The Psychological Cost)
  *Scenario:* Parents decline an ultrasound because they want the surprise at birth.
  *Diagnosis:* **Violation of the "Cost-Free" Premise.**
  Good's theorem assumes evidence is *free*. In standard decision theory, "cost" is usually cash or time. But if your utility function assigns negative value to the *state of knowing* (e.g., anxiety during the waiting period, or loss of the "surprise" utility at birth), then the evidence is not free.
  *   **Formal Fix:** If we model "surprise" as a utility good, acquiring the info consumes that good. The theorem still holds: $EU(Action | Info) - Cost(Info) \geq EU(Action | No Info)$. The parents are correctly calculating that the psychological cost outweighs the instrumental benefit.

  ### Case B: The Scary Test Before a Flight (The Inability to Act)
  *Scenario:* You take a medical test before a long flight. If it's positive, you'll be terrified, but you can't get off the plane or treat it mid-air.
  *Diagnosis:* **Violation of the "Action-Guidance" Premise.**
  Good's theorem relies on the evidence being *relevant* to a decision you can actually make.
  *   **If you truly cannot act:** If your action set is fixed (e.g., "Sit on plane" is the only physical option regardless of the test result), then the evidence has **zero decision-theoretic value**. $EU(Action | Info) = EU(Action | No Info)$.
  *   **If knowing hurts:** If your utility function cares about your emotional state (fear), and the test induces fear without offering a mitigating action, you have introduced a cost (as in Case A).
  *   **The Lesson:** Information has no *instrumental* value if it cannot map to a differential action. If it has negative *intrinsic* value (fear), you should avoid it. Good's theorem only applies to the *instrumental* value of evidence for decision-making.

  ## 3. The Quiet Premises (For Discussion)
  To make the theorem stick, ensure students accept these three constraints. If any fail, the theorem fails.

  1.  **Instrumentalism:** Truth is only valuable insofar as it guides action. (The agent does not value "true belief" for its own sake).
  2.  **State-Dependent Utility:** Utility is defined over **world-states** and **actions**, not **belief-states**. (The agent does not suffer disutility merely from holding a pessimistic credence, unless that credence leads to a worse outcome).
  3.  **Deferred Choice:** The agent must be able to wait for the evidence before committing to an action. (If you must commit *before* seeing the evidence, the evidence has no value).

  ## 4. Summary for Students
  Good's Theorem is not a claim that *knowing* always feels better than *not knowing*. It is a claim that **having the option to condition your action on the world** is always better than **being forced to commit blind.**

  If you think you are better off ignorant, you are either:
  1.  Paying a psychological cost for the knowledge (anxiety/loss of surprise).
  2.  Unable to use the knowledge to change your actions (powerlessness).
  3.  Valuing the state of your beliefs intrinsically (epistemic utility), rather than just instrumentally.

  ***

  ### Instructor Note on "News Value" vs. "Diagnostic Value"
  If a sharp student pushes back, you can distinguish **Diagnostic Value** (Good's Theorem) from **News Value**.
  *   **Diagnostic Value:** How much does this help me manipulate the world? (Always $\geq 0$).
  *   **News Value:** How does hearing this make me feel? (Can be $< 0$).
  Good's Theorem is strictly about Diagnostic Value. Most "counterexamples" are actually complaints about News Value.
