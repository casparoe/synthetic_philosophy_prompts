answer: |-
  Good evening, everyone. For those who don't know me, I'm the best man. I'm also Theo's former housemate, which means I've witnessed his decision-making process under pressure. Usually, it involves a flowchart and too much coffee. But when it came to proposing to Ana, he decided to go with a two-hour debate on rational intentionality.

  For the five people in the room who took Decision Theory 401, you know exactly what I'm talking about. For the rest of you: Theo proposed using Kavka's Toxin Puzzle.

  The setup is this: A billionaire offers you a million dollars if, at midnight, you genuinely *intend* to drink a foul poison tomorrow afternoon. You get the money the moment you form the intention. You don't actually have to drink the poison. The puzzle asks: Can you rationally intend to do something you know you'll have no reason to do once the money is in the bank?

  Theo told Ana that marrying him was like the toxin puzzle, "except you actually want to drink it."

  Now, Theo has been insisting that the fact our professor re-assigned that paper two weeks ago was a cosmic sign. I told him the only thing that proves is that the Philosophy Department is even more stubborn than he is.

  But looking at the paper again, I realized Theo missed the point. The real puzzle isn't the poison. It's the timing. It's the gap between midnight and the afternoon. It's binding your future self to a promise when the incentives of the moment might change.

  And that isn't just an analogy for marriage. That *is* marriage.

  A wedding vow is a mechanism to bridge that gap. It's saying: "I know that in ten years, the 'incentives' might look different. I know there will be afternoons where plain self-interest suggests I should walk away. But I am binding myself to you now, so that when that time comes, I don't have to calculate. I just have to choose."

  The puzzle assumes you can't intend to drink the toxin because you won't want to later. But watching Theo and Ana, I realize the solution is simpler. You don't drink the toxin for the money. You drink it because you made a promise, and because the person you're sharing the table with is worth the taste.

  They aren't solving the puzzle by tricking themselves. They're solving it by wanting the hard parts just as much as the good ones.

  So, if everyone could raise a glass.

  To Theo and Ana: May you always want to drink the toxin. May you always keep the promise you made at midnight, when the afternoon gets hard. And may you never need a billionaire to tell you what you're worth.

  To the happy couple!
