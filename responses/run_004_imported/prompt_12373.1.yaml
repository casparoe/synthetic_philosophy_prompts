answer: |-
  Adam Elga's "Subjective Probabilities Should Be Sharp" is indeed the central obstacle for defenders of imprecise credences in contemporary analytic circles. His argument is elegant: he constructs a diachronic choice problem where an agent with interval-valued credences (e.g., $P(H) \in [0.4, 0.6]$) appears forced into irrationality (leaving guaranteed money on the table) unless they collapse their interval to a point.

  However, Elga's conclusion relies on a specific, contested constraint on diachronic rationality—**Separability**—which imprecise credence theorists have independent reason to reject. The defense of imprecise credences does not require a vague appeal to "sophistication," but rather a precise distinction between **credal states** (belief) and **decision rules** (action), coupled with the argument that rational agents under ambiguity are permitted to violate Separability to maintain Dynamic Consistency.

  Here is the concrete argument for how a rational agent can retain genuinely imprecise credences and navigate Elga's betting case without collapsing into sharpness.

  ### 1. The Structure of Elga's Trap
  To engage concretely, we must isolate exactly where Elga claims the imprecise agent fails.
  *   **The Setup:** You face Bet 1 (Pay 10 if $H$, Get 15 if $\neg H$). Later, you face Bet 2 (Pay 15 if $\neg H$, Get 10 if $H$).
  *   **The Interval:** Your credence in $H$ is $[0.4, 0.6]$.
  *   **Local Evaluation:**
      *   Bet 1 has expected value range $[-1, 9]$. Since the lower bound is negative, accepting is *permissible* but not *mandatory*.
      *   Bet 2 has expected value range $[-9, 1]$. Since the lower bound is negative, accepting is *permissible* but not *mandatory*.
  *   **The Global Outcome:** Accepting both yields $+\$5$ surely. Rejecting both yields $\$0$.
  *   **Elga's Charge:** A rational agent must accept at least one. If your decision theory allows you to reject both, it licenses dominated strategies. If you adopt a policy to ensure you accept one (PLAN/SEQUENCE), Elga argues you are effectively treating the two nodes differently despite them being identical in local belief and local outcomes, which violates **Separability**. If you treat them the same, you must either accept both (which might be risky if the sequence stops early) or reject both (which is dominated).

  Elga concludes that the only way to mandate accepting exactly one (or ensuring the pair is taken) without contradiction is to have a sharp probability (e.g., 0.5), which makes one bet positive EV and the other negative EV.

  ### 2. The False Dilemma: Separability vs. Dynamic Consistency
  The core of the rebuttal lies in Elga's attack on the **PLAN** and **SEQUENCE** policies. Elga argues that for a plan to be rational, the choice made at a decision node must depend only on the subtree emanating from that node (Separability). He claims that if you plan to "Accept Bet 1, Reject Bet 2," you are violating this because the local situation at Bet 1 and Bet 2 is identical.

  However, in decision theory under ambiguity, **Separability is known to conflict with Dynamic Consistency.**
  *   **Dynamic Consistency:** If you prefer Plan A over Plan B at $t_0$, you should not abandon Plan A for Plan B at $t_1$ if no new information has arrived.
  *   **Separability:** Choices at a node should depend only on the future consequences from that node, not on the past or the broader tree.

  For an agent with sharp credences and standard Expected Utility, these two principles harmonize. For an agent with imprecise credences, they do not. If you adhere strictly to Separability (evaluating each bet locally as it comes), you will reject both bets (because neither has a strictly positive *minimum* EV). This leads to Dynamic Inconsistency: at $t_0$, you would have preferred the plan "Take Both" (which has positive minimum EV), but at $t_1$, you deviate from that plan.

  **The Defense:** A rational agent prioritizes **Dynamic Consistency** over Separability. It is more irrational to abandon a optimal plan mid-stream without new evidence than it is to let the temporal context of a decision node influence the choice. Therefore, an imprecise agent is rational to adopt a **SEQUENCE** policy: "Evaluate the whole tree at $t_0$, commit to the strategy that maximizes minimum EV, and execute it."

  Elga claims this requires treating identical nodes differently. The counter-argument is that **the nodes are not identical.**
  *   At Node 1, the history is $\emptyset$.
  *   At Node 2, the history is $\{ \text{Bet 1 Offered} \}$.
  Even if the *local* betting odds are mirror images, the *strategic* position is different. At Node 1, you can secure the hedge. At Node 2, the hedge is already either in place or lost. A policy that says "Accept Bet 1 to enable the hedge; Accept Bet 2 to complete the hedge" is sensitive to the history, which is a rational basis for decision-making. Violating Separability is not a bug of imprecise credences; it is the necessary cost of representing ambiguity while remaining dynamically consistent.

  ### 3. Credal State vs. Decision Rule (Avoiding the "Sharpness" Charge)
  Elga's deeper worry is that if you have a policy that deterministically selects one bet over the other (or ensures the pair is taken), you are acting *as if* you have a sharp probability. He argues this collapses the interval.

  This conflates the **Credal State** (the representation of uncertainty) with the **Decision Rule** (the mechanism for choosing actions).
  *   **Credal State:** $P(H) \in [0.4, 0.6]$. This remains imprecise. It accurately reflects that the evidence does not support a specific number.
  *   **Decision Rule:** "When faced with a sequence of bets where the combination has positive minimum EV but individuals do not, commit to the combination."

  Adopting a deterministic decision rule does not sharpen the credence. Consider a **Lexicographic Decision Rule**:
  1.  Maximize Minimum Expected Utility (Maximin).
  2.  If tied, Maximize Maximum Expected Utility (Maximax).
  3.  If still tied, Accept the bet offered first.

  In Elga's case, the sequence "Take Both" dominates "Take Neither" on Minimim EV ($+\$5$ vs $\$0$). So the agent commits to the sequence. If forced to choose locally without commitment, Rule #3 breaks the tie.
  Does Rule #3 imply $P(H) = 0.5$? No. It implies a **procedural tie-breaker**. The agent still believes $H$ is between 0.4 and 0.6. They simply acknowledge that **indecision has a cost**. To function in the world, an agent must sometimes act on indeterminate beliefs. Using a secondary, non-probabilistic rule (like "accept the first offer" or "stick to the pre-committed plan") resolves the action without resolving the belief.

  Elga argues that if you can rank all acts, you have a sharp probability. This is only true if the ranking is *solely* determined by Expected Utility. If the ranking is determined by $EU + \text{TieBreaker}$, the underlying probability can remain a set. The "sharpness" is in the *choice function*, not the *credence function*. Since the goal of imprecise credences is to model the *evidence* (which is vague), not to model the *will* (which must act), preserving imprecision in the credence while having a complete choice function is a coherent and rational position.

  ### 4. The "Ambiguity Premium" Defense
  Finally, there is a defense that accepts Elga's local evaluation but rejects his normative conclusion that rejecting the bets is irrational.

  Elga assumes that leaving $\$5$ on the table is a decisive mark of irrationality. However, for an ambiguity-averse agent, the **structure of the choice** matters.
  *   If the two bets are offered as a **package**, the imprecise agent *must* accept them (Minimum EV is $+\$5$).
  *   If they are offered **sequentially** without the ability to commit, the agent faces **Ambiguity** at each node.

  The "loss" of the $\$5$ profit is effectively an **Ambiguity Premium**. Just as a risk-averse agent pays a premium (accepts negative EV) to avoid risk, an ambiguity-averse agent may forgo positive EV to avoid making a decision under indeterminate probabilities.
  Elga's argument presupposes that rationality requires maximizing profit regardless of the epistemic conditions of the choice. But if we accept that **Ambiguity Aversion** is rational (as supported by the Ellsberg Paradox intuition), then an agent is permitted to reject the individual bets because the *local* epistemic state is ambiguous, even if the *global* outcome is safe.

  To avoid this, Elga must argue that Ambiguity Aversion is irrational in sequential contexts. But this begs the question. The imprecise credence model is *designed* to capture the intuition that ambiguity matters. If the model prescribes rejecting the bets, and the agent follows the model, the "loss" is simply the cost of maintaining fidelity to one's ambiguity aversion in a dynamic setting where commitment is impossible. This is not a *reductio* of the model; it is a prediction of the cost of ambiguity.

  ### Conclusion
  Elga's argument succeeds only if we accept two premises:
  1.  **Separability:** Rational choices at a node must be independent of the broader tree structure.
  2.  **No Ambiguity Premium:** Rational agents must always take guaranteed profits, regardless of the local ambiguity of the decision path.

  Defenders of imprecise credences reject both.
  1.  **Against Separability:** Rational agents prioritize Dynamic Consistency. Violating Separability to stick to a plan (SEQUENCE) is rational when beliefs are imprecise.
  2.  **Against Sharpness:** Using a meta-rule to execute a plan does not sharpen the underlying credal interval; it merely completes the preference ordering over acts.

  Therefore, a rational agent can retain a genuinely imprecise credence $[0.4, 0.6]$, adopt a policy of Dynamic Consistency (committing to the sequence at $t_0$), and use a non-probabilistic tie-breaker if forced to choose locally. This navigates Elga's betting case intact, preserving the representation of Knightian uncertainty without succumbing to the charge of irrationality. The "bind" Elga identifies is not a contradiction in imprecise credences, but a demonstration that **ambiguity imposes diachronic constraints that sharp probabilities do not.**
