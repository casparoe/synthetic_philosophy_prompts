prompt: |-
  so I'm one of two student reps on my school's policy committee (teachers, counselors, parents, us — we get an actual vote, goes to the principal). Honors/AP is currently opt-in, but the counseling office wants to flip the default: clear a cutoff on your prereq grade + a placement test and you're auto-scheduled into honors, and to opt back out you and a parent have to sign a form and meet with your counselor in the first two weeks. Their reasoning: qualifying low-income/first-gen kids opt in at way lower rates than kids whose parents already know to push for it.

  Committee's split, and since we just covered default bias/nudge theory in AP Psych, half the room treats 'it's just a nudge' as ending the argument — but one counselor says a required meeting-plus-signature to leave basically makes it not a real choice, more like a mandate in a nudge costume, and some teachers worry it'll tank the GPA of kids who get defaulted in but aren't ready.

  Can you draft the memo I'd bring to next Tuesday's vote? Land on one concrete reccomendation (adopt auto-enroll, keep opt-in, or a middle design) with a rollout/review timeline, and actually engage the 'not a real choice' objection instead of just asserting defaults are fine as long as opting out is technically possible.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Student Rep on School Policy Committee (voting member).
      *   **Audience:** Committee members (Teachers, Counselors, Parents, Principal, other Student Rep).
      *   **Topic:** Changing Honors/AP enrollment from Opt-In to Auto-Enroll (with an Opt-Out process requiring a meeting + signature).
      *   **Context:** Committee is split. Some cite "nudge theory" as sufficient justification. One counselor argues the opt-out process is too burdensome ("mandate in a nudge costume"). Teachers worry about GPA impacts.
      *   **Goal:** Draft a memo for next Tuesday's vote.
      *   **Requirements:**
          *   Land on one concrete recommendation (Adopt, Keep, or Middle).
          *   Include a rollout/review timeline.
          *   *Crucially:* Engage the "not a real choice" objection (don't just dismiss it).
          *   Tone: Professional, persuasive, student-voice but policy-literate (referencing AP Psych concepts correctly).

  2.  **Determine the Stance/Recommendation:**
      *   *Option A (Keep Opt-In):* Ignores the equity issue (low-income/first-gen under-enrollment). Likely not the best path forward given the data.
      *   *Option B (Full Auto-Enroll as proposed):* Addresses equity, but validates the counselor's concern about friction. If the opt-out is too hard, it *is* coercive.
      *   *Option C (Middle Design):* Auto-enroll, but simplify the opt-out. This balances equity (getting kids in the door) with autonomy (making leaving easy if needed).
      *   *Decision:* The "Middle Design" is the strongest policy position. It acknowledges the equity goal while respecting the ethical concern about coercion. It shows maturity and nuance, fitting for a student rep who understands the material.
      *   *Refinement:* Let's make the opt-out easier (form only, no meeting *unless* requested) but keep the parent signature. Or, keep the meeting but make it supportive, not gatekeeping. Actually, the prompt says the counselor objects to "meeting-plus-signature." A good compromise is "Auto-enroll, but opt-out requires only a form (no meeting) within the first 4 weeks." This reduces friction while keeping a paper trail.
      *   *Wait, let's look closer at the counselor's objection:* "Required meeting-plus-signature... makes it not a real choice." To address this, I need to reduce the friction *or* reframe the meeting. A meeting can be supportive, not punitive. But if the goal is to reduce barriers, removing the meeting requirement for opt-out is the strongest counter-argument to "coercion."
      *   *Revised Recommendation:* Adopt Auto-Enrollment *but* simplify the Opt-Out process (Form + Parent Signature only, no mandatory meeting) and extend the window. Add a "Grace Period" for grade adjustments.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the recommendation clearly.
      *   **The Equity Argument (The "Why"):** Acknowledge the status quo fails first-gen/low-income students. This validates the counseling office's intent.
      *   **The Autonomy Argument (The "But"):** Address the counselor's objection directly. Don't just say "nudges work." Acknowledge that *friction* matters. If opting out is too hard, it's coercion.
      *   **The Academic Risk Argument (The "What If"):** Address teachers' GPA concerns. Propose a safety net (drop period).
      *   **The Recommendation (The "How"):** Define the specific policy change.
          *   Auto-enroll based on criteria.
          *   Opt-out: Form + Parent Signature (No mandatory meeting).
          *   Timeline: First 4 weeks (instead of 2).
          *   GPA Protection: "No harm" grading for the first quarter (Pass/Fail or weight adjustment).
      *   **Review Timeline:** Set a date to check data (end of year).
      *   **Closing:** Reiterate commitment to equity and agency.

  4.  **Refining the Tone:**
      *   Needs to sound like a student leader, not a bureaucrat, but also not naive.
      *   Use the AP Psych terminology correctly (Default Bias) but show critical thinking beyond the textbook.
      *   Ensure the "not a real choice" point is handled with respect.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is removing the meeting entirely too loose? Maybe the meeting should be *offered* but not required.
      *   *Fix:* Make the meeting optional for opt-out, but mandatory for *staying* if grades drop? No, keep it simple. Mandatory meeting creates friction. Let's make the meeting optional for opt-out, but ensure the form clearly outlines consequences.
      *   *Critique:* Did I address the GPA worry?
      *   *Fix:* Add a "Safe Drop" clause. If they try it and fail the first unit, they can switch to CP without GPA penalty.
      *   *Critique:* Is the "nudge" argument addressed?
      *   *Fix:* Explicitly state that a nudge becomes a shove when friction is high.

  6.  **Final Polish:** Check formatting, clarity, and ensure all constraints of the prompt are met. (One concrete recommendation, timeline, engage the objection).

      *(Self-Correction on the Recommendation)*: The prompt asks to "Land on one concrete recommendation." I will recommend **Adopt Auto-Enrollment with Modified Opt-Out & Academic Safeguards.** This is the "Middle Design."

      *(Key argument to highlight)*: A nudge relies on *inertia*. If you build a wall around the exit, it's not inertia, it's a barrier. To be ethical, the exit must be clear.

  7.  **Finalizing the Memo Structure:**
      *   **To:** Policy Committee
      *   **From:** [My Name], Student Representative
      *   **Subject:** Recommendation on Honors/AP Enrollment Policy
      *   **Executive Summary:** The recommendation.
      *   **Equity vs. Autonomy:** Addressing the core tension.
      *   **Addressing the "Coercion" Concern:** The core psychological/ethical argument.
      *   **Addressing Academic Risk:** The teacher concern.
      *   **Proposed Policy & Timeline:** The concrete steps.
      *   **Evaluation:** How we measure success.

  8.  **Drafting the Content:** (Mental check of the "AP Psych" reference). Make sure to mention *Default Bias* but contextualize it.

      *Let's write it.* (Proceeds to generate output based on these thoughts).

      *Wait, one more thing:* The prompt says "one of two student reps." I should write as *my* voice, but acknowledge I represent the student body.
      *Also:* The counselor's objection is strong. I need to validate it. "I agree with Mr./Ms. [Counselor] that..."

      *Okay, ready to draft.*
answer: |-
  **MEMORANDUM**

  **TO:** School Policy Committee (Administration, Faculty, Counseling, Parents, Student Representatives)
  **FROM:** [Your Name], Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Honors/AP Enrollment Default Policy

  ### Executive Summary
  After reviewing the proposal to shift Honors/AP enrollment from opt-in to auto-enroll, I recommend we **adopt the auto-enrollment default but modify the opt-out process and add academic safeguards.**

  Specifically: Qualifying students are auto-scheduled, but opting out should require only a parent-signed form (no mandatory counselor meeting) within a 4-week window. Additionally, students who remain in the course but struggle academically in the first quarter should be allowed to drop to College Prep (CP) without GPA penalty.

  This approach captures the equity benefits of the nudge while respecting student autonomy and mitigating academic risk.

  ### The Equity Imperative
  The data presented by the counseling office is undeniable. Under the current opt-in system, high-performing students from low-income and first-generation backgrounds enroll in rigorous coursework at significantly lower rates than their peers with identical test scores. This is a classic example of **Default Bias**: when the path of least resistance leads to the status quo, students without institutional knowledge (or parents who know to advocate for them) stay there.

  If we keep the current opt-in system, we are effectively privileging students with social capital over students with academic potential. As a student body, we cannot endorse a system where access to rigor depends on knowing how to fill out a form.

  ### Addressing the "Coercion" Objection
  However, I agree with the concern raised by [Counselor's Name, if known, or "the counseling representative"]: **A nudge becomes a mandate when the friction to exit is too high.**

  In AP Psychology, we learned that defaults work by leveraging inertia. But inertia is not the same as a barrier. If opting out requires a meeting, a signature, and a strict two-week deadline, we are no longer relying on inertia; we are creating administrative friction. For a stressed student or a working parent, a mandatory meeting is not a "check-in"—it is a hurdle. If the hurdle is high enough, students will stay in classes they cannot handle simply to avoid the awkwardness of the exit process. That is not choice; that is coercion in a nudge costume.

  To maintain ethical integrity, the "exit door" must be as clear as the "entrance door." We can encourage students to stay without punishing them for leaving.

  ### Addressing Academic Risk (GPA Concerns)
  Faculty concerns regarding GPA tanking are valid. Being auto-enrolled does not guarantee readiness for the *pace* of Honors/AP, even if the *prereqs* were met. Forcing a student to remain in a class where they are failing harms their mental health and transcript.

  Therefore, auto-enrollment must come with a "Safe Drop" clause. If a student attempts the honors track and finds the workload unmanageable, they should be able to transition to CP before the first quarter ends without it dragging down their weighted GPA. This encourages risk-taking without permanent penalty.

  ### Concrete Recommendation & Rollout
  I move that we approve the following policy design:

  **1. Enrollment Default:**
  *   Students meeting the grade cutoff + placement test score are **auto-scheduled** into Honors/AP for the following year.

  **2. Opt-Out Process (Modified):**
  *   **Requirement:** Parent/Guardian signature + Student signature on a digital form.
  *   **Removal:** The mandatory counselor meeting for opt-out is **waived**. (Counselors remain available for *optional* consultation).
  *   **Window:** The opt-out window is extended from 2 weeks to **4 weeks** into the semester to allow students to experience the actual coursework before deciding.

  **3. Academic Safeguard ("Safe Drop"):**
  *   Students who do not opt out initially but earn below a [e.g., C+] average in the first marking period may drop to the CP equivalent.
  *   The course will appear on the transcript as CP for GPA calculation purposes (no "F" or unweighted penalty for the attempt).

  **4. Review Timeline:**
  *   **Data Check:** Counseling to report enrollment demographics and drop rates to this committee by **January 15th** (mid-year).
  *   **Policy Review:** Full committee vote to renew, amend, or repeal the policy in **May 2024**, based on end-of-year failure rates and demographic parity data.

  ### Closing
  We have a chance to fix an equity gap that disadvantages our peers who need the most support. But we must do it without treating students as data points to be moved. By lowering the friction to opt-out and protecting students from GPA damage during the trial period, we create a system that pushes students to reach their potential without trapping them if they fall short.

  I ask for the committee's support on this modified design.
