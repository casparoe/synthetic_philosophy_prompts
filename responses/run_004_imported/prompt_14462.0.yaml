answer: |-
  Thank you all for being here. For those who don't know me, I'm [Your Name].

  When my aunt asked me to give the eulogy, she told me it was because I'm "the smart one" now. Two years into a PhD, I suppose I'm supposed to have a way with words. But standing here, looking at the photos of my grandfather, I realize that the wisdom in this family didn't come from books. It came from him. And for a long time, I didn't understand it.

  Grandpa was drafted in 1967. He did two tours in Vietnam. Like many men of his generation, he didn't talk much about the combat. But at Thanksgiving, when the politics of that era came up, he had a line he'd use. He'd lean back and say, "You don't get to pick the war, kid. You just try to fight it right and bring your guys home."

  For years, I heard that as a way to shut down the conversation. I thought it was deflection. But recently, I've come to understand that it wasn't an evasion. It was his code.

  We live in a time where we like to debate the morality of big causes. And history has been very clear that the war he was sent to fight was… complicated. Painful. For many, unjust. I think Grandpa knew that. In his later years, watching the news, I saw a quiet bitterness in him. He wasn't blind to the reality of what happened over there.

  But his ethic wasn't about the geopolitics. It was about the man standing next to him in the mud.

  There is a hard truth in this world that sometimes you are put in situations you didn't choose, where the larger purpose is unclear or even wrong. Grandpa's philosophy was that even in the middle of a broken mission, you still have a duty to do right by the people depending on you. He couldn't control the orders from Washington. But he could control whether he looked out for his platoon. He could control whether he kept his honor intact when everything else was falling apart.

  To the veterans sitting in the front row: I know what that cost. I know that "bringing your guys home" isn't just about physical survival. It's about carrying the weight of who didn't make it, and living a life worthy of their memory. Grandpa carried that weight quietly. He didn't ask for praise for it. He just lived it.

  In my studies, we talk a lot about the difference between the justice of a cause and the justice of one's actions within it. It's easy to get lost in the theory. But Grandpa taught me the practice. He taught me that integrity isn't about having a perfect record or a perfect history. It's about how you handle the hand you're dealt. It's about finding the things you *can* control—your loyalty, your courage, your care for your neighbors—and doing those things flawlessly, even when the world around you is chaotic.

  He was a man who fixed his own fence, who showed up when he said he would, and who loved his family with a steady, unshakeable devotion. He didn't need the war to be righteous to be a righteous man. He made his own righteousness through the way he treated people.

  So, I won't stand here and offer platitudes about glory. Grandpa wouldn't have wanted that. He would have wanted us to look at the truth, acknowledge the hard parts, and then focus on what matters.

  What matters is that he brought himself home. What matters is that he raised a family that loved him. What matters is that when the dust settled, he was a man who kept his word.

  Rest easy, Grandpa. You fought it right. And we've got it from here.

  Thank you.
