      *   *The Heart of the Matter:* The sin lies in the double-heartedness (*duplex cor*). Speaking against what is in your heart.
      *   *The Hierarchy of Lies:* Augustine categorizes lies into 8 types, ranging from malicious lies to "officious" lies (told for benefit). Even beneficial lies are sinful, though less grievous.
      *   *Truth and God:* God is Truth (*Veritas*). Lying turns away from God toward nothingness/falsehood. It disrupts the order of love (*ordo amoris*).

