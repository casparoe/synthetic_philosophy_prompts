answer: |-
  Good morning. For those of you who don't know me, I'm [Name]. I'm her son. I make my living restoring antique furniture. I spend my days dealing with wood that has warped, joints that have loosened, and structures that need to bear weight again. My mother spent her life dealing with something much harder to hold onto: the human mind.

  She taught philosophy for nearly forty years. If you ask her former students or her colleagues here in the front row, they will tell you she was a non-reductive physicalist. If you ask the rest of us, they will tell you she was the woman who made sure we did our homework, who remembered our birthdays, and who argued about politics at Thanksgiving.

  For a long time, I thought these were two different women. I thought there was the Professor, who lived in a world of abstract arguments, and the Mom, who lived in our kitchen. But as I've gotten older, and as I've spent more time thinking about the things she talked about at our dinner table, I've realized she was trying to build a single structure that could hold both.

  She spent her career circling one specific problem. It's technical, but the heart of it is something we all feel. If we are physical beings—made of cells and neurons and chemistry, just like the rest of the universe—then how do our thoughts matter? If every time I lift my arm, there is a sufficient physical cause in my muscles and nerves to explain that movement, what work is left for my *decision* to lift my arm to do? Is my mind just a passenger, watching the body drive?

  This kept her up at night. She wanted to say that we are physical, full stop. She didn't believe in ghosts in machines. But she also refused to say that a belief or a desire is just the same thing as a firing neuron. She knew that the same thought could happen in a human brain, or an alien brain, or someday, perhaps, a computer. The thought is defined by what it *does*, not just what it's made of.

  The trouble, as she explained it to me while I sanded down chair legs, is that if the physical world is already complete, there doesn't seem to be any room for the mind to push back.

  But I am standing here today to tell you that she found a peace with this. And I need to be very careful how I say this, because she was a precise woman, and she would not want me to simplify her into a comfort she didn't earn.

  She came to believe that our ordinary states of mind—our beliefs, our plans, our decisions—are real causes. They do real work. When she decided to drive us to school, that decision was realized in her brain, yes, but it was the *decision* that organized the physics. When she chose to listen to me instead of grading papers, that choice was a functional state that intervened in the world. She held that her love for us was not a ghostly addition to her biology; it was the pattern her biology took. And because it was a pattern of care, it produced physical results.

  I can say to her colleagues that she accepted a form of local reduction for intentional states. And I can say to my cousins and my children that she believed her choices mattered. She believed that when she chose to be kind, that kindness was a causal force that built the lives we are living now. The structure of our family rests on the joinery of her decisions.

  But there is a second part to this. And this is where I have to be careful.

  There is a difference between the *work* of loving someone and the *feeling* of loving someone. There is the act of care, and there is the qualia—the sheer, inner felt quality of what it is like to be her, loving us.

  On this, she remained stubborn. She refused to claim that the feeling itself—the private, inner warmth—was what moved the atoms. She wouldn't say that the sensation of love pushed the pen across the page or drove the car to the hospital. She said the *commitment* did that. The functional role. The belief that we mattered.

  She left that door open. She never solved the mystery of how the feeling fits into the physics. She didn't close the gap just to make the picture pretty. She taught me that intellectual honesty is its own kind of love. She wouldn't want me to tell you that her soul moved her hands. She would want me to tell you that her *judgment* moved her hands. And that judgment was real.

  I see this in my own work. When I restore a table, I can explain the glue, the clamp pressure, the grain alignment. I can explain the physics of why it holds weight. But there is a moment when the piece becomes "finished," when it feels right. I can't quite measure that. My mother would say that the "rightness" might not be a physical force, but the *craft* that got us there certainly was.

  She applied that same craft to us.

  She didn't just feel love; she executed it. She believed we were worthy of education, so she taught us. She believed we needed stability, so she provided it. She believed truth was important, so she told it, even when it was hard. These were not passive sensations. These were active, functional states that changed the physical world. Because of her beliefs, I have a trade. Because of her decisions, her grandchildren are safe and fed. Because of her plans, this room is full of people who are better for having known her.

  To her students: She never sold out. She never took the easy way out of the exclusion problem. She held the line that the mind is physical, that mental properties are distinct, and that intentional states are causally potent without needing to invoke magic.

  To her family: She loved you. And because she was a physicalist, she didn't believe that love was a vague cloud hovering over us. She believed it was something she *did*. It was in the meals she made, the questions she asked, the time she gave. It was in the causal chain of her life, and it produced effects that will outlast all of us.

  She taught me that we don't need to solve every mystery to know what is true. We don't need to know exactly how the feeling of love relates to the firing of a synapse to know that the love itself is real. We know it is real because we are living in the world it built.

  My mother spent forty years asking how the mind moves the world. In the end, she answered not with a paper, but with a life. She moved our world. She moved it with her choices. She moved it with her will. And if you look around this room, at the people she taught, the family she raised, and the work she left behind, you can see the physical evidence of it.

  The feeling of her love may remain a mystery, locked in the privacy of her own experience where she said it belonged. But the work of her love is here. It is in the wood, it is in the bone, and it is in us.

  Thank you.
