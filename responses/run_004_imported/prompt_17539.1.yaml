answer: |-
  In the valley of Oros, uncertainty was the only constant. The rains were fickle, the soil temperamental. For generations, the farmers had survived through the Barn Pact. Every harvest, each family contributed a fixed portion of their grain to the communal silo. When the rains failed some and favored others, the silo smoothed the variance. No one starved, no one grew fat. The uncertainty was shared, and because the farmers were risk-averse, the Pact made them all wealthier in terms of security than any solo harvest ever could.

  Then came the Merchant with the Lenses.

  These were not ordinary glasses. Polished from quartz and star-metal, they allowed a farmer to look upon their fallow field in spring and see the harvest as it would be in autumn. The yield would be revealed: bountiful, meager, or failed.

  Elara stood at the edge of the market, clutching her savings. She understood the Pact. She also understood survival. If she looked through the Lens and saw a failed harvest, she could choose not to plant wheat. Instead, she could hire herself out as a laborer in the stone quarries, guaranteeing herself wages to buy grain later. If she saw a bounty, she could plant double, borrowing against the certainty of surplus.

  For Elara, individually, the Lens was pure gain. Ignorance meant guessing; knowledge meant optimizing. To remain blind while others might see was to invite ruin. She bought the Lens.

  She looked. Her field would fail.

  Elara did not plant wheat. She worked the quarries. When autumn came, her neighbors brought their varying harvests to the silo. Elara arrived with quarry wages. She bought grain from the Pact. She was safe. She felt no regret; knowing had allowed her to secure her family's winter.

  But Elara was not the only one who bought a Lens.

  By the next spring, half the valley possessed the quartz glass. By the third year, every head of household held one. The uncertainty that had fueled the Barn Pact began to evaporate, replaced by cold, hard foresight.

  The collapse was not immediate, but it was inevitable. It began during the contribution season. Those who looked into their Lenses and saw bounty stopped coming to the silo. Why contribute to a shared pool when you know you will not need it? They argued that the Pact was designed for uncertainty, not known deficits. They hoarded their surplus, building private storehouses.

  Conversely, those who saw failure demanded immediate payouts from the silo before the harvest even began. They knew they would have nothing to contribute. The silo masters, facing a run on reserves and a cessation of inputs, locked the gates. The Barn Pact dissolved.

  The total grain produced in the valley that year was identical to the years before. The land had not changed. The weather had not changed. Yet, the distribution was catastrophic. The families who had seen failure in the Lens could not afford the inflated price of private grain, for the surplus holders knew exactly who was desperate and priced accordingly. The risk-sharing mechanism was gone, unravelled by the very light that was supposed to guide them.

  Elara stood in the market square, watching a neighbor beg for bushels he knew he wouldn't grow. She had her wages. She had her grain. She was secure.

  A young farmer approached her, eyes red. "If we had smashed the Lenses," he whispered, "the surplus holders would have trusted the silo. We would all be fed."

  Elara looked at the Lens in her pocket. It was cold and heavy. She thought of her children, safe because she had known to work the quarries. If she gave up the Lens, she would be blind. If she were blind, she might have planted wheat, lost it, and starved alongside this neighbor. She could not wish for ignorance. Not for herself.

  "We are worse off together," Elara said softly, watching the hoarders guard their private piles. "But I cannot choose to be blind."

  The tragedy was not that the information was false, nor that the harvest was poor. The tragedy was that the value of the information to Elara was positive—she would never pay to unsee it—yet the value of the information to the community was negative, because it destroyed the insurance that uncertainty had made possible. They stood individually rational, collectively ruined, surrounded by grain they could not share, starving in the light of perfect knowledge.
