      *   **Rising Action:** Individuals start using the Glass. Why? Because if *I* know I'm going to have a bad harvest, I can prepare differently (save extra, plant different crops). This satisfies Good's Theorem (individual optimization).
      *   **Climax:** Everyone gets the Glass. The harvest predictions become common knowledge.
      *   **Falling Action:** The Granary Pact collapses. Those who know they will succeed refuse to contribute. Those who know they will fail demand everything. The pool empties.
      *   **Resolution:** The community is worse off than before (higher variance of consumption, no smoothing). But individually, no one regrets looking into the Glass (because given the info, they acted optimally). The tragedy is the loss of the *pool*, not the harvest itself.

