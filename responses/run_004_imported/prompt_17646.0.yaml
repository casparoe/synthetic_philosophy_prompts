      *   *SSA + SIA:* It is a well-known result in anthropic reasoning (specifically discussed by Nick Bostrom and others) that SSA + SIA $\approx$ SSA alone on priors (or rather, SIA counteracts the SSA update). This is often called the "Self-Indication Assumption Doomsday Argument Rebuttal."
      *   *The Cancellation:* Yes, mathematically, SIA tends to cancel the DA effect. If $H_1$ = 1 billion humans, $H_2$ = 100 billion humans. SSA favors $H_1$ given early birth rank. SIA favors $H_2$ by a factor of 100 in the prior. The posterior returns to the original prior ratio.
      *   *The Presumptuous Philosopher:* The PP thought experiment shows that SIA implies we should be extremely confident in cosmological theories that predict vastly more observers, even without empirical evidence.
      *   *The User's Hope:* The user wants to accept SIA *only* when it helps with DA, but reject it (or ignore its consequences) when it leads to PP.

