  Random philosophy question for a novel I'm working on. I've got a character, an aging composer, who's obsessed with Schopenhauer and won't stop ranting about him to anyone who'll listen. My understanding is that Schopenhauer thought all art is basically a copy of a copy — the Will objectifies itself into the eternal Platonic Ideas, and then poets, painters, and sculptors just copy those Ideas in there work. So wouldn't music actually rank at the very bottom of his hierarchy of the arts, since a symphony doesn't copy any Idea or represent any object at all? Trying to get this right before I put words in his mouth for the big scene.
