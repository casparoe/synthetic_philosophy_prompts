answer: |-
  This is one of the sharpest cuts in formal epistemology. You are right to feel that the Problem of Old Evidence (POE) is not merely a technical glitch to be patched over, but a stress test for the very architecture of Bayesian confirmation theory.

  If Bayesianism is to serve as a normative model of rational belief update, it must account for how rational agents actually change their minds. The Mercury/GR case demonstrates that scientists *do* rationally increase their confidence in a hypothesis based on evidence they already possessed. If the formalism says this is impossible (or irrational), the formalism is descriptively inadequate and normatively suspect.

  Here is a breakdown of what is actually at stake, organized by the implications for scientific history, the normative project of Bayesianism, and the specific concessions required by the leading solutions.

  ### 1. Implications for the History and Structure of Scientific Reasoning

  The most immediate implication of the POE is that it exposes a gap between **empirical learning** and **conceptual unification**.

  **The Myth of "Novel Prediction"**
  Standard Bayesian conditionalization models learning as the acquisition of new empirical data ($E$). However, a significant portion of scientific progress involves **systematization**. Newton did not discover new data to confirm universal gravitation; he showed that Kepler's laws (known) and Galileo's laws (known) were mathematical consequences of a single framework. Darwin did not find new species to confirm natural selection; he showed how known biogeographical distributions made sense under that hypothesis.

  If Bayesianism cannot handle old evidence, it implies that **unification and explanation are not confirmatory virtues in themselves**, but only insofar as they predict *new* data. This contradicts the actual practice of science, where a theory's ability to "save the phenomena" (even known ones) is a primary justification. The POE forces us to admit that confirmation is not just about *prediction*; it is about *retrodiction* and *integration*.

  **Discovery vs. Justification**
  The POE highlights a tension between the **context of discovery** (formulating $H$) and the **context of justification** (evaluating $H$).
  *   In the standard Bayesian model, $H$ exists in the probability space *before* $E$ is learned.
  *   In the Mercury case, $H$ (GR) did not exist in the probability space when $E$ (Mercury's orbit) was learned.

  This suggests that standard Bayesianism lacks the resources to model **hypothesis generation**. It treats the space of hypotheses as static and given, whereas scientific rationality often involves expanding the space of conceivable hypotheses. The POE implies that a complete epistemology needs a dynamic logic of **awareness** or **conceptual change**, not just a static logic of probability distribution.

  ### 2. Implications for Bayesianism as a Normative Model

  The deeper philosophical stake concerns the idealizations required by Bayesianism, specifically **Logical Omniscience**.

  **The Logical Omniscience Problem**
  Standard Bayesianism assumes that if an agent believes $H$, and $H$ entails $E$, the agent implicitly believes $E$ (or at least assigns probability 1 to the material conditional $H \rightarrow E$).
  *   If Einstein believed GR ($H$), he should have immediately known it entailed the 43 arc-seconds/century precession ($E$).
  *   The fact that he had to *calculate* this connection shows that logical/mathematical consequences are not immediately transparent to human agents.

  **The Implication:** If we stick to strict Bayesianism, we must model scientists as logically omniscient. But if they are logically omniscient, they can never learn logical connections, and thus old evidence can never confirm anything.
  Therefore, to solve the POE, Bayesianism must **abandon or relax the assumption of logical omniscience**. It must allow for **logical uncertainty**. An agent can be certain of $E$, certain of $H$, but uncertain about the relation $H \vdash E$. Learning the confirmation is actually learning the logical relation, not the evidence.

  **Normative Consequences**
  If Bayesianism admits logical uncertainty, it faces a computational explosion. How do we assign priors to logical propositions? How do we update on logical proofs? This moves Bayesianism away from being a clean, axiomatic system (like probability calculus) toward a more complex, resource-bounded theory of rationality. It suggests that "rationality" includes the management of computational limitations, not just coherence of beliefs.

  ### 3. Leading Solutions: What They Save and What They Concede

  There is no consensus solution, but the major approaches reveal what philosophers are willing to sacrifice to save the Bayesian core.

  #### A. The Counterfactual/Historical Approach (e.g., Garber, Jeffrey)
  *   **The Move:** We evaluate confirmation not by the actual update, but by a counterfactual: "What would the agent's probability of $H$ have been if they had *not* known $E$, but then learned it?" Alternatively, Daniel Garber suggested we expand the language to include the proposition "$H$ explains $E$" (or $H \vdash E$) as a distinct learning event.
  *   **What it Preserves:** It saves the intuition that $E$ confirms $H$ by making the update about the *connection* between them.
  *   **What it Concedes:** It admits that standard conditionalization on $E$ is insufficient. It requires enriching the probability space with logical propositions. It also introduces subjectivity: different agents might construct different counterfactual "prior" states, making confirmation less objective.

  #### B. The "Ur-Prior" or Temporal Indexing Approach
  *   **The Move:** We compare the current posterior $P_{now}(H)$ not to the immediate prior $P_{then}(H)$, but to an "Ur-prior" from a time before $E$ was known (or before $H$ was conceived).
  *   **What it Preserves:** It maintains that confirmation is a diachronic process of probability raising.
  *   **What it Concedes:** It makes confirmation dependent on historical accident. If I was born after the evidence was known, can I never be rationally confirmed in the theory? (Most proponents say yes, I inherit the confirmation, but this complicates the individualistic nature of Bayesian agents).

  #### C. Explanationism / Abductive Bayesianism
  *   **The Move:** Modify the Bayesian framework to allow explanatory power to directly influence priors or likelihoods, independent of conditionalization on $E$. (e.g., $H$ gets a boost because it *explains* $E$, even if $P(E)=1$).
  *   **What it Preserves:** It aligns formal epistemology with Inference to the Best Explanation (IBE), which matches scientific practice well.
  *   **What it Concedes:** It breaks the purity of Bayesianism. If explanatory virtue can shift probabilities without new data, we are no longer strictly following the axioms of probability conditionalization. We are hybridizing Bayes with IBE.

  #### D. Fragmentation / Contextualism
  *   **The Move:** Agents have fragmented belief states. In the "context of testing," $E$ is treated as uncertain or bracketed, even if known in the "context of daily life."
  *   **What it Preserves:** It allows $P(E) < 1$ effectively, by shifting contexts.
  *   **What it Concedes:** It complicates the notion of a unified "agent." It suggests rationality involves managing separate silos of belief that don't always communicate, which violates the ideal of global coherence.

  ### 4. Synthesis: Is it Fatal?

  It is not fatal, but it is **transformative**.

  If you view Bayesianism as a **synchronic logic of coherence** (how beliefs should relate at a single moment), the POE is devastating, because coherence alone cannot explain why learning a logical connection changes belief.

  However, if you view Bayesianism as a **diachronic heuristic for ideal learning**, the POE reveals that the "ideal" needs to be redefined. The problem shows that **information is not just empirical data; information is also structural insight.**

  **The Verdict on the Normative Project:**
  The POE forces Bayesianism to concede that **strict conditionalization is not the only rational update rule.** We need a rule for **logical learning** (updating on $H \vdash E$) alongside empirical learning (updating on $E$).

  For your seminar, the strongest takeaway is this: The Problem of Old Evidence demonstrates that **confirmation is not merely about surprise.** It is about **dependence**. Even if $E$ is not surprising (because it is known), $H$ can still be confirmed if $H$ provides the *reason* for $E$'s necessity.

  A Bayesianism that survives the POE is one that stops treating probabilities as merely subjective degrees of belief about the world, and starts treating them as degrees of belief about **theoretical relationships** within a model. It shifts the focus from "Did the data surprise us?" to "Did the theory illuminate the data?"

  **Recommendation for further reading/discussion:**
  If you want to press this in seminar, look into **Richard Jeffrey's "Bayesianism with a Human Face"** or **Daniel Garber's "Old Evidence and Logical Omniscience."** Also, consider **Colin Howson's** work, who argues quite radically that the POE shows we must abandon the requirement that known evidence must have probability 1 (the "Jeffrey Conditionalization" route).

  The Mercury case isn't a bug; it's a feature that reveals Bayesianism must evolve from a logic of **data** to a logic of **information structure**.
