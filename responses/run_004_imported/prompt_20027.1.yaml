      *   The scent needs a name. *L'Ombre de Vérité* (The Shadow of Truth) – a bit on the nose, maybe too literal. Let's go with *Cendres de Rose* (Ashes of Rose) or simply *No. 9*. Let's try *Memorandum 4*. No, let's make it poetic. *Le Fantôme*.

  4.  **Plot Outline:**
