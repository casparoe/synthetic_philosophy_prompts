answer: |-
  Your intuition is correct, and your friend's caution, while methodologically standard in contemporary historiography, risks imposing a modern compartmentalization that Kepler himself would have found unintelligible. The strongest case for your position rests on recognizing that for Kepler, "physics" was not merely the study of local motion (the domain of the *Astronomia Nova*) but the study of *all* celestial efficacy, including the influence of the heavens on the sublunary realm. To excise his reformed astrology as a pragmatic appendage is to sever the ontological root system that nourishes his planetary theory.

  The core of your argument lies in the unity of Kepler's geometric ontology. In the *Mysterium Cosmographicum*, the regular polyhedra determine planetary distances; in the *Harmonice Mundi*, the regular plane figures determine the harmonic ratios and the valid aspects. These are not distinct projects but applications of a single axiom: God created the world according to archetypes accessible to the human soul because the soul is made in the image of the Creator (*imago Dei*). When Kepler rejects the zodiacal signs and the houses as "Arabic sorcery," he is not applying a modern criterion of falsifiability; he is applying a criterion of *geometric necessity*. The signs are arbitrary divisions of the ecliptic; the aspects are real angles subtended at the Earth, constructible by ruler and compass. If the ellipse is physically real because it satisfies a geometric archetype, the trine or quartile must also be physically real for the exact same reason. To accept the ellipse as physics and the aspect as mere superstition is to accept Kepler's kinematics while rejecting his dynamics and ontology. It creates a Kepler who is a modern empiricist regarding Mars but a Pythagorean mystic regarding the Earth—a schism that does not exist in his texts.

  This leads directly to the causal mechanism. You noted the *anima telluris* (soul of the Earth). In the *Astronomia Nova*, Kepler struggles to replace the intelligences of the ancients with a physical *vis motrix* (motive force), eventually leaning toward a magnetic analogy. In his astrological works, specifically *De Fundamentis Astrologiae Certioribus* and *Tertius Interveniens*, he proposes an analogous mechanism for terrestrial influence. The rays of the planets do not carry little demons or arbitrary meanings; they strike the Earth's soul, which responds to the geometric configuration much as a string responds to a harmonic ratio. This is not "occult" in the sense of being outside nature; it is natural philosophy extended to the sublunary sphere. The weather logs you mention are the empirical test of this physical hypothesis, exactly parallel to the use of Tycho's Mars data. He is asking: Does the *anima telluris* react to the quintile as predicted by the geometry? When he finds correlations, he views this as confirmation of the physical reality of the aspect, just as the 8-minute arc discrepancy confirmed the physical reality of the elliptical orbit.

  Your friend's reliance on the "wise mother/foolish daughter" aphorism as evidence of skepticism is the weakest link in the revisionist defense. This quote, from the *Tertius Interveniens*, is indeed pragmatic, but pragmatism is not ontology. Kepler lived in a patronage economy where astrology was the primary funding stream for astronomy. Acknowledging this financial reality does not imply he viewed the content as false. More importantly, the title *Tertius Interveniens* ("The Third Party Intervening") reveals his true intent: he is not abandoning astrology, but intervening to save it from its own excesses. He positions himself between the superstitious credulity of the common astrologers and the atheistic dismissal of the skeptics. If he were truly a modern skeptic, he would have joined the latter camp. Instead, he sought to purify astrology of its arbitrary elements (signs, houses) to reveal the physical core (aspects). This is the same purifying impulse that drove him to strip away the equant and deferents to reveal the true path of Mars.

  Regarding the charge of anachronism: It is arguably more anachronistic to project a 20th-century demarcation criterion onto a 17th-century natural philosopher than to take his metaphysical commitments at face value. Patrick Boner's work on Kepler's "cosmological synthesis" is cited by your friend to suggest unity, but she interprets that unity as a post-hoc scholarly construction rather than Kepler's lived reality. However, the textual evidence suggests the unity was explicit. In *Harmonice Mundi* Book IV, Kepler explicitly links the harmonic law of the planets (physics) to the harmonic aspects (astrology). They are two manifestations of the same cosmic music. To separate them is to perform the very "compartmentalization" that early modern scholars warn against, ironically falling into the trap of viewing Kepler as a proto-positivist who was unfortunately burdened by superstition.

  The "demarcation problem" you identify is real, but Kepler's boundary was not between science and astrology. It was between *demonstrative knowledge* (based on geometric archetypes) and *conjectural opinion* (based on tradition or arbitrary rules). His reformed astrology falls on the side of demonstrative knowledge. He believed that because the aspects are grounded in the same geometrical necessities as the orbital spacings, they possess the same epistemic weight.

  Therefore, your contention stands: Kepler's reformed astrology cannot be excised without collapsing the architectonic of his entire system. The *Astronomia Nova* explains *how* the planets move; the *Harmonice Mundi* and his astrological works explain *why* they move that way and *what effect* that motion has on the rest of creation. Both rest on the tripod of geometric archetypes, the *imago Dei* in the soul, and empirical adjudication. To dismiss the astrology as a "foolish daughter" is to repeat the error of the very skeptics Kepler sought to correct, mistaking his reform for a rejection. You are not falling for a fashionable revision; you are recognizing the internal coherence of a mind that saw geometry as the causal fabric of the universe, weaving together the motion of Mars and the rain on the roof with the same thread.
