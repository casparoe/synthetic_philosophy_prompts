      *   Engage three sticking points? Yes.
      *   Commit to conclusion? Yes.
      *   Qualified verdict allowed? Yes.

  *(Self-Correction Note)*: Make sure to emphasize that "Moral Revisionism" doesn't mean prosecuting every soldier. It means acknowledging the objective wrongness while granting excusing conditions. This nuance is key to the "Justification vs. Excuse" point.

  8.  **Final Polish:** Check flow and transitions. Ensure the voice is authoritative. (Proceed to generate output).

