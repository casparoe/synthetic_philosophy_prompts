answer: |-
  # The Uniform and the Conscience: Reconciling Moral Truth with Legal Necessity in the Ethics of War

  The ethics of war is haunted by a paradox. On one hand, our deepest moral intuitions suggest that killing is permissible only in defense of the innocent or against those who have made themselves liable to harm. On the other hand, the international legal order treats soldiers on opposing sides as moral equals, granting them the same right to kill and the same immunity from prosecution, provided they follow the rules of engagement. This is the thesis of the Moral Equality of Combatants (MEC). For decades, Michael Walzer's traditionalist defense of MEC dominated the field, positing that *jus in bello* (justice in war) is independent of *jus ad bellum* (justice of war). In recent years, however, Jeff McMahan and the revisionist school have dismantled the philosophical foundations of this view, arguing that there is no moral symmetry between an aggressor and a defender.

  The debate between your friend and yourself mirrors the central fault line in contemporary just war theory. The traditionalist prioritizes the regulation of violence; the revisionist prioritizes moral coherence. To resolve the stalemate, we must examine three critical sticking points: the analogy to ordinary self-defense, the distinction between justification and excuse, and the practical consequences of abandoning legal equality. While revisionism succeeds in establishing the *moral* truth of the matter, traditionalism retains a vital, albeit instrumental, role in the *legal* architecture of war. The most defensible position is a qualified verdict: combatants are morally unequal, but they should remain legally equal.

  ### The Traditionalist Picture: War as a Unique Realm

  Michael Walzer's argument in *Just and Unjust Wars* rests on the claim that war constitutes a distinct moral sphere with its own internal logic. In ordinary life, if two people fight, we ask who started it to determine who is permitted to strike back. In war, Walzer argues, this inquiry is suspended once hostilities begin. Soldiers are "dangerous men" serving their states, and because they are coerced instruments of policy rather than free moral agents regarding the decision to go to war, they stand on equal footing.

  For the traditionalist, the independence thesis is not merely a description of international law but a moral necessity. If we tell soldiers on the unjust side that they are morally equivalent to murderers, we remove their incentive to follow the rules of war. Why should an "aggressor" soldier show mercy to a civilian or treat a prisoner of war humanely if he believes he is already a criminal liable to be killed? Furthermore, Walzer argues that determining the justice of a war is often epistemically difficult for the individual soldier. To demand that they adjudicate the *jus ad bellum* before firing a shot is to demand the impossible. Thus, MEC serves a functional purpose: it contains the horrors of war by creating a reciprocal set of constraints that apply regardless of the cause.

  ### The Revisionist Picture: War as Continuous with Morality

  Jeff McMahan's revisionist critique strikes at the metaphysical heart of Walzer's position. He argues that war is not a magic circle where ordinary morality ceases to apply. In ordinary life, if a mobster sends a henchman to kill a rival, the henchman does not gain a moral right to kill simply because he is following orders or wearing a "uniform." The victim retains their right not to be killed, and the attacker lacks a just cause.

  For McMahan, the permission to kill in war derives from the same source as the permission to kill in self-defense: liability. A combatant is liable to be attacked only if they pose an unjust threat. Therefore, a soldier fighting for an unjust cause poses an unjust threat, while a soldier fighting in self-defense does not. This creates a fundamental asymmetry. The unjust combatant commits a wrongful harm even if he follows all rules of engagement, because he lacks the substantive right to kill in the first place. The just combatant, conversely, is justified. To claim they are moral equals is, for the revisionist, a confusion of legal convention with moral truth.

  ### Sticking Point 1: The Self-Defense Analogy and Agent-Neutrality

  The first point of contention is whether the analogy to ordinary self-defense holds. Traditionalists argue it does not, because war is a collective, institutional activity. Revisionists argue it does, because killing is an individual act with individual victims.

  Here, the revisionist position is morally superior. The traditionalist view relies on a form of agent-neutrality that we would reject in any other context. If a police officer shoots an unarmed civilian by mistake, we do not say, "Well, he was following the protocol of his institution, so he had the same moral standing as a civilian defending their home." We look at the objective facts of liability. The "uniform" argument suggests that state authorization transforms the moral status of the victim, rendering them liable to death simply because they wear a different uniform. But a conscript on the just side has done nothing to make himself liable to be killed other than posing a threat in defense of rights. The unjust combatant, by threatening rights without cause, makes himself liable. To deny this is to privilege the state's authority over the individual's right to life. The revisionist correctly identifies that the moral logic of killing cannot be severed from the justice of the cause without abandoning the core principle that human life has intrinsic value.

  ### Sticking Point 2: Justification vs. Excuse

  However, acknowledging moral inequality leads to the second sticking point: does revisionism turn most soldiers into murderers? This is the traditionalist's strongest emotional appeal. If MEC is false, then every German soldier in World War II who followed the rules of war was still acting wrongly.

  This is where the distinction between *justification* and *excuse* saves revisionism from absurdity. An act is **justified** if it is objectively the right thing to do (e.g., killing an aggressor). An act is **excused** if it is objectively wrong, but the agent is not blameworthy due to epistemic limitations or duress.

  McMahan accepts that most unjust combatants are *excused*, not *justified*. Soldiers often lack access to the intelligence required to judge the *jus ad bellum*. They face social pressure, patriotic indoctrination, and legal coercion. If a soldier reasonably believes their war is just, or if they face execution for disobedience, they may be morally excused for fighting. They still commit an objective wrong (killing someone who was not liable to die), but they are not moral monsters. This distinction allows revisionism to maintain moral asymmetry (the act is wrong) without demanding impossible moral heroism from individuals (the agent is not blamed). It acknowledges the tragedy of war: good people doing bad things because they are trapped in unjust institutions.

  ### Sticking Point 3: Practical Costs and Legal Order

  The final and most difficult sticking point is the practical cost. Even if McMahan is right about morality, should the law reflect it? Traditionalists argue that abandoning legal equality would make wars bloodier. If unjust combatants know they are war criminals merely for fighting, they will have no incentive to observe *jus in bello* constraints. They might fight to the death, refuse surrender, and target civilians, reasoning that they have nothing to lose.

  This is a consequentialist argument, and it carries significant weight regarding *legal* design, even if it fails to overturn *moral* truth. Morality is about what is right; law is often about what is feasible. The International Humanitarian Law (IHL) framework is a tool for minimizing suffering in a non-ideal world. If adopting legal revisionism leads to more atrocities, then it fails by its own humanitarian standards.

  Therefore, we must distinguish between the *moral status* of the combatant and the *legal status* of the combatant. Morally, the unjust combatant is liable and acting wrongly (though perhaps excused). Legally, however, granting them immunity for the mere fact of fighting (combatant privilege) is a necessary fiction. It is a bargain: the international community agrees not to prosecute you for taking up arms, provided you agree to follow the rules of war. This bargain works best if it is blind to the justice of the cause, because determining the justice of the cause is often impossible until after the war, and soldiers need to know their status *during* the war.

  ### Conclusion: A Qualified Verdict

  The stalemate between your friend and yourself arises from conflating two different questions: "What is the moral truth of killing in war?" and "How should we regulate killing in war?"

  On the first question, the revisionists win. The Moral Equality of Combatants is a moral fiction. A soldier fighting an aggressive war of conquest does not have the same moral right to kill as a soldier defending their homeland from invasion. The analogy to ordinary self-defense holds, and the distinction between justification and excuse allows us to acknowledge this wrongness without condemning every individual soldier to the status of a culpable criminal. To assert moral equality is to obscure the fundamental injustice of aggression.

  However, on the second question, the traditionalists win. While morality should be precise, law must be pragmatic. Abandoning the legal equality of combatants would likely undermine the incentives for unjust forces to comply with the laws of war, leading to greater suffering and making war termination more difficult. The legal order must remain neutral not because the combatants are morally equal, but because the alternative creates a perverse incentive structure that endangers everyone, including civilians.

  Therefore, the correct conclusion is a bifurcated one: **We ought to be moral revisionists and legal traditionalists.** We must teach that soldiers on the unjust side are not moral equals, to discourage aggression and clarify the moral stakes of foreign policy. But we must maintain a legal framework that grants combatant privilege to all who follow the rules of war, to ensure that when the drums of war beat, the violence remains contained. To do otherwise is to choose between moral clarity that breeds chaos, or legal order that rests on a lie. We can, and must, hold both: acknowledging the moral asymmetry of the sword, while sheathing it in legal equality for the sake of a less brutal world.
