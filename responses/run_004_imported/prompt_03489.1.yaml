      *   **Key Reference:** Abram Demski's Radical Probabilism sequence, Richard Jeffrey's *The Logic of Decision* (specifically the "cloth by candlelight" example).
      *   **Characters:**
          *   *Strict Conditionalizer (SC):* Old-school Bayesian. Believes all learning is conditioning on certainty ($P(E)=1$). Views JC as a shortcut for conditioning on fine-grained sensory propositions.
          *   *Jeffrey Conditionalizer (JC):* Radical Probabilist. Believes evidence can be uncertain. Views JC as a fundamental generalization.
      *   **Key Arguments to Include:**
