          *   JC admits this is a cost. But argues SC's "path independence" is bought at the price of fictional certainty.
      *   **Round 4: Rigidity and Constraints.**
          *   JC explains Rigidity (Sufficiency). $P_{new}(H|E) = P_{old}(H|E)$.
