answer: |-
  The rain against the window was the only sound in Elias's apartment, a steady, gray rhythm that matched the looping thought in his head: *If I had stayed.* Two years since he'd left Sarah, two years since he'd taken the job in Chicago. Two years of telling himself it was ambition, now unravelling into the quiet suspicion that it was cowardice.

  Mara sat on the sofa opposite him, swirling the last of her wine. She had listened for an hour, nodding, waiting for the opening.

  "You know what Lewis would say," she said softly.

  Elias sighed, rubbing his temples. "Don't start. The incredulous stare doesn't work on me anymore. I know you believe it."

  "It's not about belief, it's about quantification," Mara said, leaning forward. "If modal realism is true, then there is a world, concrete and real as this one, where you stayed. Where you didn't get on that train. In that world, you and Sarah are sitting in a kitchen just like this, maybe arguing about bills, but you're together. You're fine. That possibility is actualized."

  "But it's not *me*," Elias said, the familiar friction sparking in his chest. "Lewis is explicit. Transworld identity is impossible. That guy in the other world? He's a counterpart. He's similar to me. He shares my origins, maybe. But he isn't me. His happiness is his own. It's no more mine than your happiness is."

  "Does the metaphysics matter more than the comfort?" Mara asked. "Knowing that the choice wasn't a dead end. Knowing that the version of you who stayed isn't a ghost, but flesh and blood, living a life you discarded."

  "It feels like being told a stranger won the lottery," Elias said. "A stranger who looks like me. So what? I'm still here. I'm still the one who bought the losing ticket."

  Mara set her glass down. "But the ticket wasn't losing. It was just played in a different game. The totality of reality includes your success. You are part of a plurality that succeeds."

  Elias stood up and walked to the window. He pressed his hand against the cold glass. This was the isolation thesis. The worlds were sealed. No causality crossed the gap. No light, no sound, no quantum entanglement. Just the logical structure of reality holding them apart like sheets of glass stacked in the dark.

  He tried to summon the image Mara offered. He tried to see the other Elias. In that world, the rain might not be falling. Maybe the sun was hitting the kitchen table. That other Elias was laughing. He was warm. He was real. Not a dream, not a abstract proposition, but concrete. His heart beat. His nerves fired.

  But the silence between them was absolute.

  That was the thing that caught in Elias's throat. If the other world was truly concrete, then his regret was not a lack of reality, but a lack of access. He was trapped in this indexical slice of the pluriverse. *Here*. *Actual*. The word "actual" was just a label like "here" or "now," Lewis said. No special status. Just where he happened to be standing.

  So, somewhere, the other Elias was looking out a window too. Was he regretting leaving? No, in that world, he stayed. But maybe in another world, he stayed and they were miserable. Maybe in another, he left and found something better than Chicago. The plurality was vast. Every variation was instantiated.

  "Does it change the weight?" Mara asked from the sofa.

  Elias didn't turn around. "What weight?"

  "The regret. Knowing that you aren't the only version. Knowing that the path not taken isn't voided."

  Elias looked at his reflection in the glass. Faint, superimposed over the city lights. He thought about the other Elias. If that man was happy, did it diminish Elias's loneliness? Or did it highlight it?

  If the other Elias was happy, he was happy *there*. He couldn't send his surplus joy here. He couldn't lend his confidence to this version struggling to sleep. They were causally isolated. The happiness existed, but it was locked away in a vault without a door. To know it was there was to know that happiness was possible, yes. But it was also to know that *this* sadness was necessary. In this world, at this index, the sadness was the fact.

  "It makes me feel small," Elias said finally. "Not comforted. Just... diluted. If I'm just one of infinite variations, then my pain doesn't matter much. But it also means my joy doesn't matter. It's all just... distributed."

  "Or," Mara said, "it means you don't have to carry the burden of being the only reality. You're not the sole arbiter of what could have been. The universe took care of the alternatives."

  Elias turned back to the room. The lamp cast long shadows. He looked at the phone on the table. He could pick it up. He could call Sarah. But he wouldn't. That was the fixed point of this world. In another world, he was picking it up. In another, he had never hung up.

  "Does knowing he's okay make you feel better?" Mara asked. "Knowing that somewhere, you didn't fail?"

  Elias looked at his hands. They were the same hands the other Elias had. Same scar on the thumb. Same tremor when he was tired. They were real hands. But they were here.

  "I don't know," Elias said. He walked back to the chair and sat down. He didn't pick up his wine. He just sat with the silence of the apartment, and the silent, concrete reality of the worlds he could never touch.

  He thought about the other Elias laughing in a sunlit kitchen. The image was vivid. It was real. It was utterly useless.

  "Maybe," Elias said, his voice barely above the rain. "Maybe it helps. Or maybe it just makes the quiet louder."

  He looked at Mara, and she looked back, waiting for a conclusion that wouldn't come. Outside, the rain continued to fall, here and only here, while in the infinite stack of realities, every other possibility fell too, unheard, untouched, and completely alone.
