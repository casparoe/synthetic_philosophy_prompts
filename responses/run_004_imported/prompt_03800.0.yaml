answer: |-
  This is a classic crux in the interpretation of the *Mingjia* (School of Names), and your intuition is correct: the logical force of the second argument relies on a specific interpretation of identity that allows Gongsun Long to derive a counter-intuitive conclusion.

  For a seminar paper, you will want to distinguish between the **intensional** argument (Argument 1: naming/essence) and the **extensional** argument (Argument 2: request/satisfaction), and then show how both converge on an equivocation regarding the copula "is" (or rather, the negation *fei* 非).

  Here is an explicit breakdown of the logical structure, the nature of the equivocation, and the relationship between the two arguments.

  ### 1. Logical Structure of the Second Argument (The "Request" Argument)

  The second argument is essentially an application of **Leibniz's Law** (the Indiscernibility of Identicals). Gongsun Long is arguing that because the two terms have different satisfaction conditions, they cannot be identical.

  Let us formalize the terms:
  *   Let $H$ = the concept/term "Horse"
  *   Let $W$ = the concept/term "White Horse"
  *   Let $y$ = a yellow horse (or black horse)
  *   Let $S(x, T)$ = "$x$ satisfies the request for term $T$"

  **The Premises:**
  1.  $S(y, H)$ is True. (A yellow horse satisfies the request for a "horse".)
  2.  $S(y, W)$ is False. (A yellow horse does *not* satisfy the request for a "white horse".)
  3.  **Leibniz's Law:** If $W = H$, then for any property $P$, $P(W) \leftrightarrow P(H)$. (If the terms are identical, they must share all properties, including their satisfaction conditions.)
  4.  **Property in question:** The property of "being satisfied by a yellow horse."

  **The Inference:**
  *   From (1) and (2), $H$ and $W$ differ in the property of "being satisfied by a yellow horse."
  *   Therefore, by *modus tollens* on Leibniz's Law (3): $W \neq H$.

  **The Conclusion:**
  *   "White horse is not horse" ($W \neq H$).

  **Analysis of Entitlement:**
  The argument is **valid** for the conclusion that the *concept* "White Horse" is not **identical** to the *concept* "Horse." It successfully proves that the extension of the set "White Horse" is not identical to the extension of the set "Horse" (because one is a proper subset of the other).

  However, the argument is **invalid** for the conclusion that a white horse is not a **member** of the class of horses. The fact that Set A $\neq$ Set B does not entail that Set A $\not\subset$ Set B. Gongsun proves non-identity of sets, but the thesis "White horse is not horse" is naturally understood by the Objector (and in common sense) as non-membership or non-inclusion.

  ### 2. The Equivocation on "Fei" (非)

  You asked whether the argument trades on a slide between "is not" meaning "is not identical to" and "is not" meaning "is not a member of."

  **The answer is yes.** This is the central dialectical trick of the dialogue.

  In Classical Chinese, *fei* (非) functions as a general negator. It can negate identity ($A \neq B$), class membership ($a \notin B$), or class inclusion ($A \not\subset B$). Gongsun Long exploits this ambiguity.

  *   **The Objector's Interpretation:** When the Objector hears "White horse is not horse," they understand it as **Class Exclusion**: "No white horses are members of the class of horses." This is why they object ("If there is a white horse, one cannot say there is no horse").
  *   **The Advocate's Proof:** The Advocate proves **Conceptual Non-Identity**: "The concept 'white horse' is not identical to the concept 'horse'."
  *   **The Slide:** The Advocate accepts the Objector's challenge ("Can it be maintained...?") using the meaning of *Non-Identity*, but allows the conclusion to stand with the rhetorical force of *Non-Exclusion*.

  In the second argument specifically, the slide occurs in the **reductio assumption**.
  When the Advocate says, "If a white horse simply *were* a horse..." (Shi bai ma nai ma...), he is asking the Objector to grant **Identity** ($W = H$) to test the hypothesis.
  *   If the Objector means "is a" as **Inclusion** ($W \subset H$), the Advocate's Leibniz Law argument fails. (Subsets can have different satisfaction conditions than supersets; e.g., "Asking for a mammal" vs "Asking for a dog". A cat satisfies the first, not the second, but dogs *are* mammals).
  *   To make the logic work, the Advocate must interpret the Objector's "is" as **Identity**.
  *   Once he proves Non-Identity, he concludes with "White horse is not horse," which sounds like the negation of the Objector's original Inclusion claim, even though he has only negated Identity.

  ### 3. Is the First Argument Innocent?

  You asked if the first argument (Shape/Color) is innocent of this move or quietly depends on it.

  **The First Argument:**
  *   **Premise 1:** "Horse" names a shape.
  *   **Premise 2:** "White" names a color.
  *   **Premise 3:** Naming a color is not naming a shape.
  *   **Conclusion:** "White horse" (the compound name) is not "horse" (the simple name).

  **Analysis:**
  The first argument is **intensional**. It argues that the *definition* or *essence* of "white horse" (color + shape) is not identical to the *definition* of "horse" (shape only).
  *   **Is it valid?** Yes, for the conclusion that the *terms* are not synonymous.
  *   **Does it slide?** Internally, no. It does not claim that white horses aren't horses; it claims the *name* "white horse" is not the *name* "horse."
  *   **Does it depend on the slide?** It depends on the same **ambiguity of *fei*** to be rhetorically effective, but it does not rely on the logical error of the second argument. It establishes a metaphysical distinction (the compound is not the simple) which supports the Non-Identity conclusion.

  However, the first argument **sets the trap** for the second. By establishing that "White Horse" and "Horse" are distinct *names* referring to distinct *essences* (color+shape vs. shape), it primes the audience to accept that they are distinct *entities*.
  *   Argument 1 establishes: Intension($W$) $\neq$ Intension($H$).
  *   Argument 2 establishes: Extension($W$) $\neq$ Extension($H$).
  *   The Thesis claims: $W$ is not $H$ (implying $W \not\subset H$).

  So, while Argument 1 is logically "innocent" of the membership/identity confusion (it is a true statement about semantics), it is **complicit** in the overall equivocation. It persuades the listener that because the *concepts* differ, the *objects* falling under them must be disjoint, or at least that the statement "White horse is not horse" is true in the strong sense.

  ### Summary for Your Paper

  For your seminar paper, you might structure the analysis as follows:

  1.  **The Logical Form:** Identify Argument 2 as a *reductio ad absurdum* relying on Leibniz's Law (Indiscernibility of Identicals). It proves $\neg(W = H)$.
  2.  **The Semantic Ambiguity:** Argue that the dialogue turns on the polysemy of *fei* (非). The Objector interprets the thesis as $\neg \forall x (Wx \rightarrow Hx)$ (Non-inclusion), while the Advocate proves $\neg (W = H)$ (Non-identity of concepts/extensions).
  3.  **The Dialectical Strategy:**
      *   **Argument 1** secures the **Intensional Non-Identity** (The definition of W is not the definition of H).
      *   **Argument 2** secures the **Extensional Non-Identity** (The set W is not the set H).
      *   **The Conclusion** conflates these to suggest **Class Exclusion** (No W is H).
  4.  **Scholarly Context:** You may wish to reference A.C. Graham's distinction in *Later Mohist Logic, Ethics and Science*. Graham argues that the School of Names distinguishes between "being separate" (*bie*) and "not being included" (*fei*). Gongsun Long is arguably pointing out that while white horses are *included* in horses, the *term* "white horse" is *separate* from the *term* "horse." The "paradox" arises because natural language uses the same copula for both relations.

  **Verdict:** The second argument is valid only if "is" means strict identity. It trades on the slide between identity and inclusion to make the conclusion seem paradoxical rather than trivial. The first argument is logically sound regarding semantics but contributes to the metaphysical confusion that allows the slide to go unchallenged.
