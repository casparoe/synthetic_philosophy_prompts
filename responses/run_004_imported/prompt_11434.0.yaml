      *   *The "Small Study" Dominance:* The canonical replication crisis (Open Science Collaboration, psychology, medicine) is largely driven by *underpowered* small studies with inflated effect sizes (Winner's Curse), publication bias, and p-hacking.
      *   *The "Large Study" Dynamic:* Large studies usually *solve* replication issues by providing precise estimates. If a large study finds a tiny effect ($p < 0.0001, d = 0.05$), it will likely *replicate* as a tiny effect. It won't necessarily "fail to replicate" in the binary sense, but it will fail to be *practically significant*.
