      *   *Epidemiology Context:* In the user's field (epidemiology), huge $N$ often leads to statistically significant but clinically irrelevant associations (e.g., HR = 1.02). This is a validity/interpretation crisis, not necessarily a *replication* crisis in the strict sense.

