      *   **Address the "Agency" Factor:** This is the crux. Differentiate between *spectator* emotion (book) and *agent* emotion (game).
      *   **Counter the Friend's "Reload" Argument:** Explain why reloading undermines the specific type of engagement the user is having (role-playing vs. optimization).
      *   **Discuss "Justification" of Emotion:** Emotions aren't really "justified" or "unjustified" in a logical sense; they are responses. However, we can assess their *rationality* or *fittingness*.
