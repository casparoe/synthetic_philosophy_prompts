  6.  **Refining the Decision Theory:**
      *   Avoid phrases like "they bluff." Instead, use "they broadcast hash commitments to policy functions."
      *   Highlight the *updatelessness*. They must decide *before* simulating the other's reaction.
      *   The problem: If I wait to see your code, I am "updating." If I commit before seeing your code, I am "updateless." But if we both commit before seeing the other's *commitment*, we might clash.
      *   The specific mechanism: "Logical Causality."

