  2.  **Deconstruct the Decision Theory (UDT & Commitment Races):**
      *   *Standard CDT/Evidential Decision Theory:* You update on information. If you learn the other guy is crazy, you back down.
      *   *Updateless Decision Theory (UDT):* You choose a policy *before* receiving specific information. You act as if you are choosing the output of your source code for all possible inputs.
      *   *The Commitment Race:* If I know you are UDT, I know you will stick to your pre-committed policy. If I commit *earlier* in logical time (i.e., my decision depends on fewer facts about you), I force you to accommodate me. If we both try to commit "first" (at the earliest logical point), we might lock into incompatible policies (e.g., "I demand 90%" vs "I accept max 10%").
      *   *The Twist:* It's not about who speaks first in real time, but whose policy function is logically prior. If Agent A's output depends on Agent B's source code, but Agent B's output *does not* depend on Agent A's source code (it's a constant function), Agent B wins. But if both are constant functions that conflict, crash.
      *   *Source Code Inspection:* They can verify each other's algorithms. No lying.

