answer: |-
  **Setting:** *A quiet corner of a university faculty lounge. On a small table sits a mug (Item A), a coaster (Item B), and a pen (Item C). The Agent, Sarah, sits before them. She strictly prefers the mug to the coaster, the coaster to the pen, and the pen to the mug. Two decision theorists, Elena and Marcus, stand on either side of her. A trader offers to swap the mug for the coaster, minus a small fee.*

  **Elena:** (Gesturing to the trader's offer) Look at the setup, Sarah. You have the mug. You prefer the pen to the mug. You prefer the coaster to the pen. You prefer the mug to the coaster. It is a closed loop. If you take this trade—mug for coaster, minus ten cents—you initiate a cycle. Next, you will trade the coaster for the pen, minus ten cents. Then the pen for the mug, minus ten cents. You end where you started, but thirty cents poorer. It is a normative perpetual motion machine. Just as a thermodynamic cycle cannot yield net work without a heat gradient, a preference cycle cannot yield net benefit without a loss of wealth. Rationality forbids it. Don't trade.

  **Marcus:** (Placing a hand gently on the table, near Sarah) Elena is right about the loss, but wrong about the prohibition. Sarah, you are allowed to have these preferences. Cyclicality reflects the multi-dimensional nature of value—perhaps the mug is aesthetic, the pen functional, the coaster sentimental. The error isn't in the preferences; it's in the view that you are a sequence of instantaneous choosers. You are a single agent extended in time. I advise you to adopt a resolution: *Commit now to the policy of refusing all trades in this sequence.* Stick to it, even when you hold the coaster and the pen looks tempting.

  **Elena:** And there it is. The magic trick. Marcus, you haven't solved the incoherence; you've just hidden it. To adopt that policy, Sarah must prefer the policy "Keep Mug" to the policy "Trade Cycle." But policies are just outcomes extended in time. If she prefers the outcome (Mug) to (Mug minus 30 cents), she is invoking a transitive ranking over outcomes to override her intransitive ranking over items. You haven't escaped the transitivity requirement; you've just pushed it up a level to the space of plans. If her preferences over plans are cyclic, she can be money-pumped on plans. If they aren't, then transitivity is doing the work, not "resoluteness."

  **Marcus:** That is the standard objection, Elena, but it conflates the *source* of the ranking with the *structure* of the ranking. When Sarah adopts a resolution, she isn't simply comparing Outcome X to Outcome Y using her local, cyclic preferences. She is invoking a *diachronic* preference: a preference for being the kind of agent who can sustain a plan. This is a distinct value dimension, inaccessible to a synchronic snapshot.

  Think of it in your own terms, Elena. You spent your career in low-temperature thermodynamics. Consider a system that is open, not closed. A living cell maintains homeostasis against entropy not by ignoring thermodynamic laws, but by importing energy to maintain a boundary condition. Resoluteness is that boundary condition. It isn't that the preferences over objects become transitive; it's that the agent introduces a constraint function that renders the cycle inert. The "transitivity" exists at the level of the *agency*, not the *objects*.

  **Elena:** A poetic boundary condition, Marcus, but let's look at the mechanics. You claim this "diachronic preference" allows her to keep the mug. But consider the "Sophisticated Chooser." She doesn't need your mystical resolution. She simply uses backward induction. She looks at the final node: if she has the pen, she will trade it for the mug (minus fee), because she prefers the mug. Knowing this, at the second node, she knows holding the coaster leads to the pen, which leads to the mug-minus-fee. Since she prefers the coaster to the mug-minus-fee (assuming the fees don't swamp the preference), she won't trade the coaster for the pen. Knowing *that*, at this very first node, she knows trading the mug leads to the coaster, which she now knows she won't trade. But she also knows that if she *did* trade, she'd end up in a chain that loses money.

  Wait, let me sharpen that. A sophisticated agent anticipates her future choices. She knows that if she enters the cycle, her future selves will execute the trades because, at each moment, the trade looks locally beneficial. She predicts she will end up with Mug-minus-30¢. She currently holds Mug. She prefers Mug to Mug-minus-30¢. Therefore, she refuses the first trade. No pump. No resolution needed. She just needs to know her own future irrationality. Why do we need "resoluteness" if sophistication achieves the same result more cheaply, without positing new diachronic values?

  **Marcus:** Because sophistication is merely predictive, not normative. It treats your future self as an adversary you must dodge, rather than a partner you can lead. In this specific money-pump case, you are correct: sophistication avoids the loss. But it does so by *paralysis*. It forces Sarah to treat her own future rational agency as a fixed constraint, like a law of physics she cannot change.

  Resoluteness claims she *can* change it. She can make a promise to herself that binds her future self. This matters immensely outside of money pumps. Consider a Newcomb problem, or a Prisoner's Dilemma played against your future self (like saving for retirement). A sophisticated chooser, seeing that her future self will defect (spend the money), defects now (doesn't save). She ends up poor. A resolute chooser commits to a policy of cooperation (saving), and because she sticks to it, the "future self" complies. Sophistication accepts dynamic inconsistency as fate; resoluteness overcomes it as a failure of will. If we define rationality as effective agency over time, sophistication is a surrender.

  **Elena:** But that "effectiveness" comes at the cost of coherence. If Sarah resolves to stick to the plan, but at time $t_2$ she strictly prefers to deviate, and she deviates, she is consistent with her local preferences. If she resolves and *doesn't* deviate, she is acting against her local preferences at $t_2$. You are asking her to act against her own judgment of what is better at that moment.

  If I hold the coaster, and I strictly prefer the pen, and I refuse the trade solely because of a past vow, I am choosing what I judge to be worse. How is that rational? It looks like fetishizing the past self's authority. Why does the Sarah at $t_1$ have sovereignty over the Sarah at $t_2$? If they are the same agent, their preferences should align. If they differ, why should $t_2$ obey $t_1$? This is where the "pushing transitivity up" objection bites hardest. To say $t_2$ should obey $t_1$ is to say there is a "Global Sarah" who ranks obedience higher than local satisfaction. But if that Global Sarah exists, *she* must have transitive preferences. If she doesn't, we can pump her on policies. So, you still need transitivity somewhere in the architecture. Resoluteness doesn't remove the requirement; it just assumes the Global Sarah satisfies it while Local Sarah doesn't.

  **Marcus:** I grant that the "Global Sarah" must be coherent. But that isn't a vicious regress; it's the definition of agency. The "Global Sarah" isn't a homunculus; she is the temporally extended person. The mistake is assuming that rationality is defined by the satisfaction of local preferences at every node. That is the "Separability" assumption—that the rationality of a choice depends only on the subtree ahead.

  McClennen's point is that Separability is false. Rationality assesses the *plan*, not just the *act*. When Sarah refuses the trade at $t_2$, she isn't acting against her judgment; she is acting on a *different* judgment than the one Elena recognizes. She judges that "Being a Resolute Agent" is a good in itself, one that outweighs the local gain of the pen.

  To your thermodynamic analogy: You say a cycle returning to the original state with net loss is irrational. I agree. But a cycle returning to the original state with *no loss* because the system maintained a structural integrity (the resolution) is not a perpetual motion machine; it's a stable orbit. The energy isn't coming from nowhere; it's coming from the cognitive cost of maintaining the commitment.

  **Elena:** The cognitive cost is irrelevant if the logic is flawed. Let's press the "Sophistication" point again, harder. You say sophistication leads to paralysis in Prisoner's Dilemmas. But many decision theorists argue the rational move in a one-shot Prisoner's Dilemma *is* defection. If sophistication leads to defection, and defection is the rational act, then sophistication is correct, and resoluteness is just a fancy name for irrational cooperation.

  Why should Sarah trust her resolution? At $t_2$, the reason she had at $t_1$ to stick to the plan no longer applies in the same way. The trade is now immediate. The loss is avoided. The "plan" is a sunk cost. Unless you posit that she gets utility from "keeping promises to herself," which again, pushes the transitivity requirement into her utility function. You are essentially saying: "She won't be pumped because we will redefine her utility function so that she hates being pumped." That's not a vindication of cyclic preferences; it's a repair job that restores transitivity by fiat.

  **Marcus:** It is not by fiat, Elena. It is by recognizing that preferences are not merely revealed by isolated choices. They are constituted by patterns of choice. If Sarah *knows* she is resolute, then at $t_1$, the option "Trade" does not lead to "Pen." It leads to "Mug-minus-30¢" because she knows her resolution will fail? No, if she is resolute, the option "Trade" is *unavailable* to her as a rational path.

  Here is the crux: You view the money pump as a proof that cyclic preferences are impossible for a rational agent. I view it as a proof that *unresolute* agents with cyclic preferences are vulnerable. The vulnerability is not in the preferences, but in the lack of diachronic integration.

  You ask why $t_2$ should obey $t_1$. Because $t_2$ is not a new agent. If $t_2$ ignores $t_1$, the agent effectively fragments. The "loss" in the money pump is the tax on fragmentation. Resoluteness is the glue. It doesn't restore transitivity over objects (Mug, Pen, Coaster); Sarah still prefers Pen to Mug at $t_2$. But she prefers "Adhering to Plan" to "Violating Plan" more strongly. This higher-order preference is transitive. But that doesn't invalidate the lower-order cycle; it just manages it. It allows an agent to function *as if* she were transitive without actually being so. That is a genuine insight into the structure of agency, not just a repair job.

  **Elena:** (Pauses, looking at Sarah, who has not moved) "As if." That is the operationalist escape hatch. If she acts *as if* her preferences are transitive, then for all predictive and normative purposes, they *are* transitive. The cycle is empirically vacuous.

  But I will concede this: If the "utility of resoluteness" is real, then the money pump argument does not prove that cyclic preferences over *objects* are irrational. It proves that cyclic preferences *unconstrained by higher-order plans* are exploitable. However, I maintain that this higher-order plan must itself be transitive. If Sarah prefers Plan 1 to Plan 2, and Plan 2 to Plan 3, and Plan 3 to Plan 1, she can be pumped on plans. So, transitivity is inescapable. It is the bedrock. Resoluteness is just the concrete poured on top.

  **Marcus:** And I will concede that without *some* coherence at the level of the plan, resoluteness is blind thrashing. But the bedrock isn't the preference over objects; it's the preference over *temporal integrity*.

  (Sarah reaches out and covers the mug with her hand.)

  **Marcus:** She chooses.

  **Elena:** She chooses to keep the mug. But does she keep it because she is resolute, or because she is sophisticated and fears the pump?

  **Marcus:** If she is sophisticated, she keeps it with regret, knowing her future self is a slave to local impulses. If she is resolute, she keeps it with authority, knowing her future self is an extension of her current will. The outcome is the same, Elena. The agency is not.

  **Elena:** (Nods slowly) Then we agree on the prediction, and disagree on the metaphysics of the self. You see a unified agent imposing order. I see a sequence of selves constrained by the threat of incoherence.

  **Marcus:** And perhaps that is the real thermodynamic lesson. You studied systems in equilibrium. I am studying systems in flow. In flow, stability requires active maintenance, not just static consistency.

  **Elena:** Then let us watch her maintenance. If she trades the coaster next week, your orbit decays.

  **Marcus:** And if she does, she proves she was never resolute, only wishful. But if she holds, she proves that rationality is more than the absence of cycles. It is the presence of a plan.

  *(The trader waits. Sarah removes her hand from the mug and shakes her head. No trade.)*

  **Elena:** Rational.

  **Marcus:** Resolute.

  **Elena:** We shall see if the terms are synonymous.

  **Marcus:** We shall see if the agent is.
