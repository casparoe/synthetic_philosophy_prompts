  4.  **Sam (Move 4):** Score 2. Sam correctly identifies the standard orthodoxy response (Jackson). By relocating Adams's Thesis from semantics (truth conditions) to pragmatics (assertability conditions/robustness), he preserves the truth-conditional framework while respecting the probabilistic data. This effectively neutralizes the Triviality objection without abandoning the unified semantic core.

  **Overlooked Issues:**
  Both students overlook **contextualist nuances regarding the indicative antecedent**. In the Oswald case, the truth of the indicative often depends on what is presupposed in the common ground; if it is common ground that Oswald acted alone, the indicative may be vacuous or evaluated differently than they assume. Additionally, both treat **Adams's Thesis** as more robust than it is, ignoring **McGee's counterexamples** (e.g., nested conditionals) which challenge the thesis even on probabilistic accounts. Finally, they ignore recent work on **past indicatives** which can sometimes behave like counterfactuals, blurring the mood distinction they rely on.
