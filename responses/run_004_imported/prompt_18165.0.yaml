      *   The partner is committing the **Naturalistic Fallacy** (deriving an "ought" from an "is") or simply conflating *capacity* with *will*.
      *   Crucially, in AI alignment, if you treat all behavior as optimal, you learn the wrong reward function (e.g., if a human makes a typo, the AI shouldn't learn they wanted the typo).

