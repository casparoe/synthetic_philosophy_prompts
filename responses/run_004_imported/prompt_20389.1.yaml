answer: |-
  **MEMORANDUM**

  **TO:** Long-Range Capital-Planning Committee
  **FROM:** [Your Name], Emeritus Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Proposed Futarchy Pilot

  **Background and Context**
  For thirty years, my research focused on collective decision-making in social insects. Ant colonies and bee hives solve complex allocation problems—where to nest, how to forage—without central command. They succeed because their individual interests are genetically aligned with the colony's welfare. Human institutions, however, lack this genetic cohesion. Our colleague's proposal to apply Robin Hanson's *futarchy* to the choice between the Interdisciplinary Research Building and Graduate Housing is a bold attempt to import the efficiency of market mechanisms into our governance. The scheme suggests we vote on a welfare metric, then allow conditional prediction markets to decide the project.

  While I admire the theoretical elegance, and having spent my retirement studying the normative implications of such systems, I cannot recommend binding this capital decision to the proposed pilot.

  **The Case for the Pilot (The Reform Argument)**
  I must acknowledge the strength of the proponent's position, which rests on a legitimate critique of our current process. As the economist on this committee argues, our traditional voting model is vulnerable to "rent-seeking" behavior: decisions are often swayed by seniority, departmental lobbying, and the volume of voices rather than the quality of arguments. 

  The strongest objection to my caution is that rejecting this pilot preserves a status quo that is already opaque and potentially biased. By refusing to test a mechanism that forces participants to put "skin in the game," we may be prioritizing institutional comfort over genuine innovation. The proponent argues that even a thin market reveals information that private deliberation hides; if a faculty member bets heavily against the research building, they are signaling a belief in its failure that they might otherwise only express as a vague objection in a meeting. To dismiss this tool entirely is to deny the university a chance to correct for the very human biases that plague our current voting system.

  **The Risks of Implementation**
  However, the biological and economic conditions required for futarchy to function are not present here. 

  1.  **Market Thickness and Manipulation:** Prediction markets require liquidity and diverse, independent actors to aggregate truth. Our "market" is limited to faculty, staff, and students—a thin, interconnected community where reputational and departmental interests are highly concentrated. Unlike the open market, a bet here is not just a financial transaction; it is a political signal. This invites the manipulation cited by skeptics, reminiscent of the Pentagon's 2003 Policy Analysis Market. In that instance, the market was shut down not because the theory was wrong, but because the appearance of betting on instability undermined the institution's legitimacy. We risk a similar scandal if bets are perceived as lobbying by other means.
  2.  **Metric Gaming (Goodhart's Law):** The proposal requires us to define a composite metric of "institutional welfare" (research output, grants, retention). Once a metric becomes a target, it ceases to be a good measure. If the market knows the payout depends on graduate retention, bettors will price based on how easily retention can be artificially inflated, not on the true value of the housing.
  3.  **Alignment of Interests:** In ant colonies, the queen's success is the worker's success. In our university, the interests of the physics department, the housing office, and the graduate student body are divergent. Futarchy works best when values are agreed upon and only beliefs differ. Here, the disagreement is fundamentally about *values* (research prestige vs. student welfare), which a market cannot resolve, only obscure.

  **Recommendation**
  I recommend we **do not bind the capital decision to this pilot.** The risk of manipulating a thin market on a high-stakes, one-off decision is too great, and the potential for reputational damage mirrors the Pentagon precedent too closely to ignore.

  However, in the spirit of scientific inquiry, I propose we run a **Shadow Market Pilot**. We would establish the prediction markets exactly as proposed, with real (but nominal) currency or points, but the results would be advisory only, presented to the committee alongside traditional deliberations. 

  **Terms for the Shadow Pilot:**
  *   **Time Frame:** Markets open for four weeks prior to the final vote.
  *   **Stakes:** Limited to a nominal cap per participant to prevent wealth from equating to voting power.
  *   **Transparency:** All trades and trader identities (within the university community) must be public to discourage covert lobbying.
  *   **Review:** The committee will publish a post-mortem comparing the market's prediction to the final decision and subsequent outcomes.

  **Conclusion**
  We should not treat governance as a black box to be hacked by financial instruments, nor as a tradition to be preserved without scrutiny. By running a shadow pilot, we respect the economist's desire for rigor without exposing the university to the risks of a binding experiment on a thin market. We can observe whether the market reveals truth or merely amplifies noise, gathering data for future decisions without gambling this one.
