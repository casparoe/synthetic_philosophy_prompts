answer: |-
  Here is a clean, problem-set-ready example that distinguishes the two solutions, followed by a discussion on fairness.

  ### The Bargaining Problem

  **Players:** 1 and 2
  **Disagreement Point:** $d = (0, 0)$
  **Feasible Utility Set ($S$):**
  Let $S$ be the comprehensive hull of the region under the parabola $u_2 = 1 - u_1^2$ in the positive quadrant. Formally:
  $$ S = \left\{ (u_1, u_2) \in \mathbb{R}^2 \mid u_1 \ge 0, u_2 \ge 0, u_2 \le 1 - u_1^2 \right\} $$
  *(Note: This implies $u_1$ cannot exceed 1, otherwise $u_2$ would be negative.)*

  **Ideal Point ($a$):**
  To find the ideal point, we find the maximum possible utility for each player within $S$ (assuming the other gets at least their disagreement payoff of 0).
  *   Max $u_1$: Set $u_2 = 0 \Rightarrow 0 = 1 - u_1^2 \Rightarrow u_1 = 1$.
  *   Max $u_2$: Set $u_1 = 0 \Rightarrow u_2 = 1 - 0 = 1$.
  *   So, $a = (1, 1)$.

  ---

  ### 1. Computing the Kalai-Smorodinsky (KS) Solution

  The KS solution lies on the Pareto frontier of $S$ and also on the line segment connecting the disagreement point $d(0,0)$ to the ideal point $a(1,1)$.

  1.  **Equation of the line $d \to a$:** Since $d=(0,0)$ and $a=(1,1)$, the line is simply $u_2 = u_1$.
  2.  **Equation of the Pareto Frontier:** $u_2 = 1 - u_1^2$.
  3.  **Intersection:** Set $u_1 = 1 - u_1^2$.
      $$ u_1^2 + u_1 - 1 = 0 $$
      Using the quadratic formula (taking the positive root):
      $$ u_1 = \frac{-1 + \sqrt{1 - 4(1)(-1)}}{2} = \frac{\sqrt{5} - 1}{2} \approx 0.618 $$
      Since $u_2 = u_1$, the KS solution is:
      $$ \mathbf{u^{KS} \approx (0.618, 0.618)} $$

  ---

  ### 2. Computing the Nash Bargaining Solution (NBS)

  The NBS maximizes the product of the gains from cooperation (the Nash Product). Since $d=(0,0)$, we maximize $u_1 u_2$ subject to the frontier constraint.

  1.  **Objective Function:** Substitute the frontier constraint $u_2 = 1 - u_1^2$ into the product.
      $$ \max_{u_1} \quad N(u_1) = u_1 (1 - u_1^2) = u_1 - u_1^3 $$
  2.  **First Order Condition:**
      $$ \frac{dN}{du_1} = 1 - 3u_1^2 = 0 $$
      $$ 3u_1^2 = 1 \implies u_1 = \frac{1}{\sqrt{3}} \approx 0.577 $$
  3.  **Find $u_2$:**
      $$ u_2 = 1 - \left(\frac{1}{\sqrt{3}}\right)^2 = 1 - \frac{1}{3} = \frac{2}{3} \approx 0.667 $$
      The NBS solution is:
      $$ \mathbf{u^{Nash} \approx (0.577, 0.667)} $$

  ---

  ### 3. Comparison and Fairness Argument

  **The Difference:**
  *   **KS:** Awards equal utility to both players $(0.618, 0.618)$.
  *   **Nash:** Awards Player 2 significantly more utility $(0.577, 0.667)$.

  **Why do they differ?**
  The feasible set is **asymmetric**. While both players have the same maximum *potential* (1), the "cost" of transferring utility differs. Near the middle of the frontier, the curve is steeper for Player 1. For Player 1 to gain a unit of utility, Player 2 must give up more than a unit (locally). Player 2 is in a position of stronger marginal bargaining power because the frontier "bulges" in their favor.

  *   **Nash** respects this marginal power. It equalizes the *percentage* gain from a small concession. Because Player 2's utility is "cheaper" to give up in the middle region, Nash pushes the outcome toward Player 2.
  *   **KS** ignores the curvature of the frontier between the axes. It only looks at the ideal point $(1,1)$. It argues that since both players have the same "ceiling," they should receive the same proportion of that ceiling.

  **Which is more "Fair"? (The Argument for KS)**

  While Nash is the standard solution, **Kalai-Smorodinsky is more defensible in this specific context if you view the curvature of the frontier as "noise" or "irrelevant alternatives."**

  Here is the intuition you can give your students:

  Imagine the utility possibilities are determined by a technology. Both players have the same maximum capacity (1). However, the current "technology" (the shape of $S$) makes it temporarily inefficient for Player 1 to convert joint effort into their own utility in the middle range.
  *   **The Nash Critique:** Nash says Player 1 should be punished (receive less) because the current technology makes them inefficient to satisfy *right now*.
  *   **The KS Defense:** KS says Player 1's *potential* is the same as Player 2's. The fact that the frontier curves away in the middle shouldn't reduce Player 1's share of the *potential* pie. If we believe in **Individual Monotonicity**, we argue that if we were to "straighten" the frontier (expand the set $S$ to the triangle connecting $(0,0), (1,0), (0,1)$), Player 1's solution shouldn't *decrease* when we go back to the curved set, provided their ideal point hasn't changed. Nash violates this; KS satisfies it.

  **Verdict for the Problem Set:**
  If the goal is **efficiency and marginal trade-offs**, Nash is better.
  If the goal is **equal opportunity relative to maximum potential**, KS is better.

  In a classroom setting, KS is often more intuitively satisfying here because the maxima are symmetric ($1,1$). Students often feel that if both players *could* get 1 in a best-case scenario, a solution giving one player ~15% more than the other (0.667 vs 0.577) feels unjustified solely due to the curvature of the set. KS restores that symmetry of opportunity.
