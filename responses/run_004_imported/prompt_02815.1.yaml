answer: |-
  This is a profound and deeply human dilemma. You are grappling with the "problem of mixed motives," a classic tension in moral philosophy. You did the right thing, for the right reasons, but those reasons were amplified—or perhaps triggered—by an emotion (fury) that feels self-interested or at least non-moral.

  Here is a precise breakdown of how Kant and Julia Markovits diverge on this issue, the specific verdicts they would render on your case, and an argument for why Markovits's view offers the more defensible framework for your situation.

  ### 1. The Divergence: Source vs. Alignment

  The core disagreement lies in what constitutes the *source* of moral worth.

  **Immanuel Kant: The Purity of the Will**
  For Kant (specifically in the *Groundwork*), moral worth is not about the *outcome* (reporting the violation) or even the *correctness* of the reason (protecting customers). It is about the **maxim** upon which you act.
  *   **The Criterion:** An action has moral worth only if it is done *from duty* (aus Pflicht). This means the determining ground of your will must be the moral law itself.
  *   **The Role of Inclination:** Inclinations (emotions, self-interest, desire for revenge, even sympathy) are morally neutral at best and contaminating at worst. If you do the right thing *because* you are angry, or *because* you like helping people, you are acting on inclination.
  *   **The Verdict Mechanism:** Kant asks a counterfactual question: *If the inclination (fury) were removed, would the moral reason alone have been sufficient to produce the action?* If the answer is "no," then the action lacks moral worth, even if it is the right action.

  **Julia Markovits: The Coincident Reasons Thesis (CRT)**
  Markovits (in *Moral Worth*) shifts the focus from the *source* of the motive to the **alignment** between your psychology and the normative facts.
  *   **The Criterion:** An action has moral worth if your *motivating reasons* (why you actually did it) coincide with the *normative reasons* (the facts that make the act right).
  *   **The Role of Inclination:** Markovits is less concerned with whether you were thinking "I must do my duty." She is concerned with whether the facts that make the act right (e.g., "customers are being harmed") were the facts that motivated you.
  *   **The Verdict Mechanism:** Markovits asks: *Were the right-making reasons operative in your deliberation?* If you were motivated by a set of reasons that includes the right-making reasons, moral worth is present. She allows for **overdetermination**: if you were motivated by *both* fury and customer safety, and either one alone might have sufficed (or both worked together), the presence of fury does not necessarily negate the moral worth provided by the safety concern.

  ### 2. The Verdicts on Your Case

  Here is how these theories would judge your specific situation: reporting the violation due to a mix of customer concern and fury over the blocked reorganization.

  **The Kantian Verdict: Suspicious / Withheld Worth**
  Kant would likely be skeptical of your claim to moral worth. You stated: *"what finally got me to pick up the phone was fury."*
  *   To a Kantian, this suggests that the moral reason (customer safety) was present but **insufficient**. It was inert until the inclination (fury) provided the necessary energy.
  *   Because the determining ground of your will was not *solely* the moral law, but rather a combination where emotion played the decisive causal role, Kant would classify this as acting *in accordance with duty* but not *from duty*.
  *   **Result:** You did the right thing, but you get no "moral credit." In fact, Kant might worry that your action was contingent on your anger; if you hadn't been angry, the customers would have remained exposed. That contingency undermines the moral reliability of the will.

  **The Markovitsian Verdict: Affirmed Moral Worth**
  Markovits would likely affirm the moral worth of your action.
  *   You explicitly state: *"I did, and still do, think the exposure was a real harm."* This means the normative reason (customer harm) was also a motivating reason. It wasn't just a post-hoc justification; it was part of your psychological landscape.
  *   Under the Coincident Reasons Thesis, the fact that you *also* had a self-interested or emotional reason (fury at the director) does not cancel out the moral reason. As long as the moral reason was **operative**—meaning it actually played a role in your deliberation and wasn't just window dressing—the reasons coincide.
  *   **Result:** Your action has moral worth. The coincidence of motives (fury + concern) does not negate the alignment between your motivation and the right-making facts.

  ### 3. Which Verdict is More Defensible?

  While Kant's rigor is intellectually seductive, **Markovits's view provides the more defensible verdict in your case.** Here is why:

  **1. The Psychology of Moral Action**
  Kant's requirement for purity sets a bar that is arguably inhuman. Human psychology is rarely, if ever, driven by a single, isolated motive. We are complex beings where moral conviction and emotion are intertwined. By demanding that duty be the *sole* determining ground, Kant risks making moral worth impossible for almost anyone. Markovits's view acknowledges that we can act for the right reasons even when those reasons are accompanied by "noisier" emotions. In your case, denying moral worth because you were also angry risks punishing you for being human, rather than rewarding you for acting on the truth of the harm.

  **2. The Moral Status of Anger**
  Kant categorizes fury as an "inclination," often grouping it with self-interest. However, your fury was not merely "I didn't get my way." It was a response to your director's negligence and obstructionism regarding a serious ethical breach.
  *   This is not just self-interest; it is **moral indignation**.
  *   Markovits's framework is flexible enough to recognize that anger at injustice can be a *fitting* response to a moral violation. If the director's behavior was wrong, your fury is, in a sense, a recognition of that wrongness. Therefore, the fury itself is partially aligned with the right-making reasons. Kant's binary (Duty vs. Inclination) fails to capture the nuance that some emotions are themselves cognitive assessments of moral failure.

  **3. Encouraging Future Integrity**
  There is a pragmatic moral dimension to consider. If we adopt the Kantian verdict, we tell whistleblowers: *"Unless you can prove you acted solely out of abstract duty, without any personal grievance, your act lacks integrity."* This creates a perverse incentive to suppress legitimate emotions or pretend to be colder than one is.
  *   Markovits's verdict validates the action. It says: *"You saw a harm, that harm motivated you, and you acted. The fact that you were also angry does not erase the good you did."*
  *   This is more defensible because it reinforces the behavior we want to see (reporting violations) without subjecting agents to an impossible purity test that could lead to moral paralysis.

  ### Conclusion

  You are stuck because you feel your motives were "contaminated." Kant validates that fear; Markovits dissolves it.

  The more defensible view is Markovits's. Your action has moral worth because the reasons that made the act right (the harm to customers) were genuine reasons *for you*. They were not merely intellectual acknowledgments; they were part of what moved you. The fury did not replace the concern; it catalyzed it.

  In the real world, integrity is not the absence of self-interest or emotion. It is the alignment of one's actions with the good, even when that alignment is forged in the fire of complex, messy human motivations. You protected the customers. You exposed the negligence. The presence of fury does not subtract from the reality of that protection. You should accept your friends' label: it was an act of integrity.
