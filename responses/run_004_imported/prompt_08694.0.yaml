answer: |-
  Here are ten interview questions designed to progressively tighten the pressure on a Scanlon-style expectation account, specifically targeting the "supplementary principle" defense. They are ordered to move from concrete counterexamples to structural and meta-ethical concerns.

  ### 1. The Compensation Case
  **Question:** "Consider a case where I promise to help you move, break that promise, but immediately hire professional movers to ensure you are no worse off than if I had kept my word. My reliance costs are covered, and my expectations regarding the *outcome* are met. Yet, many of us feel I have still wronged *you* specifically. If Principle F grounds the wrong in the defeat of reliance or expectation, and those have been neutralized by compensation, what exactly is the residual wrong made of?"

  **Follow-up:** *She will likely answer:* "Principle F is the core, but we need a supplementary principle to capture the distinct wrong of breaking the bond of trust itself."
  *You press:* "If the 'core' principle doesn't account for the specific wrong in the paradigmatic case of breaking a promise, in what sense is it still doing the foundational work? Are we saying Fidelity explains the *harm*, but a different principle explains the *wrong*?"

  ### 2. The Proliferation Problem
  **Question:** "Following up on that: if we must add a supplementary principle to handle the compensation case, and perhaps another to handle cases of coerced promising, and another for implicit promises, does the theory risk becoming a list of intuitions rather than a unified account? At what point does adding supplementary principles to save Principle F look less like principled extension and more like ad hoc patching?"

  **Follow-up:** *She will likely answer:* "Moral phenomena are complex; a single principle rarely captures every nuance without losing explanatory power."
  *You press:* "I agree morality is complex. But if the 'nuances' we are patching are the very cases that define the practice (like the mover case), isn't the 'core' principle becoming an empty shell that only applies when the supplementary principles don't?"

  ### 3. The Standing to Release
  **Question:** "On an expectation-based account, the obligation arises because I led you to form a reliance-based expectation. But if a bystander witnesses my promise and forms the exact same expectation about my conduct, why do they lack the standing to release me from the obligation? If the ground is the *expectation itself*, shouldn't anyone holding that expectation have a say in waiving it?"

  **Follow-up:** *She will likely answer:* "Because only the promisee was the intended audience of the invitation to rely; the bystander's expectation is incidental."
  *You press:* "But why does being the *intended* audience grant a normative power—the power to release—that the bystander lacks? If the obligation is just about not manipulating expectations, what normative magic does 'intention' add that creates a unique bilateral relationship?"

  ### 4. The Source of Normative Power
  **Question:** "To press that point on the bilateral relationship: Conventionalists say the power to release comes from a social practice we both participate in. You want to ground it in moral principles alone. But if Principle F plus supplementary principles don't explicitly grant the promisee authority over the promisor, where does that authority come from? Are we smuggling in a convention while claiming to derive it from pure morality?"

  **Follow-up:** *She will likely answer:* "The authority comes from the autonomy of the promisee; they have a right to determine whether the assurance is still needed."
  *You press:* "If it's about their autonomy and need for assurance, why can't they exercise that autonomy *after* I break the promise to forgive the wrong? The power to release usually operates *before* the breach to prevent the wrong. What grounds that specific timing?"

  ### 5. The Kolodny-Wallace Objection (Reasonableness)
  **Question:** "Niko Kolodny and R. Jay Wallace have argued that to determine which expectations trigger Principle F, we must already know which expectations it is 'reasonable' to form. But isn't the reasonableness of expecting me to move *already* determined by the fact that I promised? Doesn't this make the account circular: we need the practice of promising to define the reasonable expectations that are supposed to explain the practice?"

  **Follow-up:** *She will likely answer:* "Reasonableness is determined by general moral considerations about reliance and assurance, not by the practice of promising itself."
  *You press:* "But without the prior norm that 'promises create obligations,' how do we distinguish a 'reasonable expectation of a promise' from a 'hopeful expectation of a prediction'? It seems the normative force of the promise is doing the work to make the expectation reasonable, not vice versa."

  ### 6. The Circularity Charge
  **Question:** "If you deny the circularity, could you specify a non-circular criterion for 'reasonableness' in a vacuum? If I say 'I predict you will help me move' and you say 'I promise,' the physical facts are identical. What changes in the moral landscape to make my expectation 'reasonable' in the second case but not the first, without referencing the normative force of the promise itself?"

  **Follow-up:** *She will likely answer:* "The change is the voluntary invocation of the expectation and the knowledge that you want assurance."
  *You press:* "But why does invoking the expectation create a duty rather than just a strong prediction? If the duty doesn't come from the social convention of 'promising,' it seems we are back to needing a supplementary principle to explain why *that* invocation is special."

  ### 7. Third-Party Beneficiaries
  **Question:** "Consider a case where I promise *you* to donate to a charity *they* support. The charity relies on this and plans programs. If I break the promise, Principle F suggests I wrong you. But the charity's reliance is identical to yours. Why is the wrong to you primary? Is it because the expectation account struggles to distinguish between the source of the expectation and the beneficiary of the action?"

  **Follow-up:** *She will likely answer:* "The wrong is to you because you were the one given the assurance; the charity is a secondary victim."
  *You press:* "If the ground of the obligation is the prevention of harm via reliance, and the charity's harm is greater, why does the 'assurance' to me outweigh the 'reliance' of the charity? This suggests the obligation isn't actually about reliance at all."

  ### 8. The "Assurance" Condition
  **Question:** "Scanlon's Principle F requires that I know you *want* assurance. But suppose I promise to meet you for lunch, and you tell me, 'Don't worry about it, I don't need assurance, just show up if you can.' If I then don't show up, have I wronged you? If yes, Principle F seems too narrow. If no, then promising seems to create obligations even when the promisee doesn't desire the specific assurance F requires."

  **Follow-up:** *She will likely answer:* "In that case, you haven't made a full promise, or the obligation is weaker."
  *You press:* "But ordinary language suggests I still broke a promise. If the theory has to redefine what counts as a promise to fit the principle, aren't we prioritizing the theory over the phenomenon we are trying to explain?"

  ### 9. Trivial Promises and Proportionality
  **Question:** "If the wrong of breaking a promise is grounded in the disappointment of expectations, shouldn't the severity of the wrong scale exactly with the intensity of the expectation? If I promise to send a trivial text and fail, my expectation is low. Is the wrong therefore negligible? Or is there a categorical wrong in breaking the bond that exists regardless of the stakes of the expectation?"

  **Follow-up:** *She will likely answer:* "The wrong is proportional to the reliance and the importance of the assurance."
  *You press:* "Many people feel there is a *sui generis* wrong in breaking a promise, even a trivial one, that feels different in kind, not just degree, from merely disappointing a prediction. Can an expectation-based account capture that qualitative difference?"

  ### 10. Theoretical Parsimony
  **Question:** "Finally, if we need Principle F, plus a principle for the bond of trust, plus a principle for standing to release, plus a principle for reasonableness that avoids circularity: have we gained anything over a Conventionalist view that simply says 'promising is a social practice that creates obligations'? What is the explanatory gain of the expectation account if it requires this many auxiliary assumptions to match the conventionalist's simplicity?"

  **Follow-up:** *She will likely answer:* "The gain is explaining *why* the practice binds us morally, rather than just stating that it does."
  *You press:* "But if the 'why' ends up being 'because we have supplementary moral principles that mimic the practice,' haven't we just reconstructed the practice in moral language without actually grounding it in something more fundamental than the practice itself?"
