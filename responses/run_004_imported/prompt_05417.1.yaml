answer: |-
  **1. The Severity Threshold**
  Lewis tries to bridge the gap between fines and prison by suggesting that once a fine gets severe enough, it stops feeling like a fee and starts feeling like real punishment. Does your account of transferable penalty rely on that severity threshold to work, or can you justify substitution even for trivial penalties without collapsing the distinction between a debt and a punishment?
  *   **Likely Answer:** She will likely argue that severity isn't the deciding factor; rather, it's about the *nature* of the burden (property vs. bodily liberty).
  *   **Follow-up:** If the distinction is about the nature of the burden rather than severity, doesn't that re-establish the very gap Lewis was trying to close? If bodily punishment is inherently non-transferable by nature, how does the Cross bypass that metaphysical constraint?

  **2. The "Practical Impossibility" Explanation**
  Lewis explicitly doubts the explanation that we tolerate fine-substitution merely because it's practically impossible to stop people gifting money to one another. Do you think he's right to reject that administrative convenience story, and if so, what normative story replaces it to explain why we allow fine-substitution but not prison-substitution?
  *   **Likely Answer:** She will likely propose that we allow it because property is external to the person, whereas prison time is internal to the person's bodily autonomy.
  *   **Follow-up:** If the barrier is bodily autonomy, doesn't that make penal substitution *harder* to defend rather than easier? How does your account overcome the intuition that my body and my guilt are inseparable in a way my bank account is not?

  **3. Inconsistency as Evidence**
  Lewis concludes that our shared inconsistency on this issue is itself weak evidence that penal substitution *can* make sense. But isn't that move equally consistent with the idea that we're all just making the same category mistake? Why should we treat this specific intuition as data rather than error?
  *   **Likely Answer:** She will likely appeal to "reflective equilibrium," arguing that we shouldn't discard deep-seated intuitions without a better theory to replace them.
  *   **Follow-up:** But we *do* have a competing, deeply seated intuition: that punishing the innocent is inherently unjust. How do you weigh Lewis's "inconsistency data" against that stronger moral intuition without simply privileging the conclusion you want to reach?

  **4. The Role of Consent**
  Lewis's example involves a "friend" stepping in, which implies volition, but his argument focuses on the structure of the penalty itself. Does your completion of his argument require the substitute's voluntary consent to bridge the gap, or is there a sense in which the penalty could be transferred even without it?
  *   **Likely Answer:** She will almost certainly say consent is necessary to avoid a moral monstrosity.
  *   **Follow-up:** If consent is the necessary condition, does that shift the theory away from "Penal Substitution" and closer to "Voluntary Acceptance of Consequences"? At what point does adding consent change the mechanism enough that Lewis's original puzzle about *penalty* transfer no longer applies?

  **5. Debt vs. Punishment**
  Lewis insists punishment isn't a debt because there's no creditor who just wants to be made whole. But if a fine is transferable, doesn't it functionally become a debt in that moment? How do you maintain Lewis's distinction between debt and punishment while simultaneously allowing the transferability that characterizes debt?
  *   **Likely Answer:** She will likely argue it's a hybrid category: a punitive debt owed to the moral order rather than a specific person.
  *   **Follow-up:** If it's a debt owed to the moral order, doesn't that collapse your account back into a classic Anselmian Satisfaction Theory? What work is "Penal" actually doing in your title if the mechanism is satisfaction of a moral debt?

  **6. Secular Implications**
  If you successfully show that penal substitution is coherent based on Lewis's secular intuitions, does that imply our secular courts *ought* to allow volunteers to serve prison time for others? Or do you posit a relevant disanalogy between human and divine justice?
  *   **Likely Answer:** She will likely posit a disanalogy, arguing that God has prerogatives regarding justice that human states do not.
  *   **Follow-up:** Critics might call that an ad hoc exemption to save the theology. If the logic holds for Lewis's secular friend paying a fine, what specific metaphysical feature of God allows Him to do the prison-equivalent without violating the principles of justice we apply to humans?

  **7. The Mechanism: Metaphysical or Normative?**
  Lewis left the "how" hanging. In your paper, is the missing piece primarily metaphysical (e.g., a union between offender and substitute) or normative (e.g., a specific account of retributive justice)?
  *   **Likely Answer:** She will likely say it's both: a normative shift enabled by a metaphysical union.
  *   **Follow-up:** Which of those is doing the heavy lifting? If the metaphysical union is removed, does the normative argument collapse? If so, doesn't that make the argument inaccessible to the very secular intuitions Lewis was relying on?

  **8. The "Friend" Analogy**
  Lewis frames the substitution as a friend helping a friend. But in Christian atonement, the substitute is often described as a judge, a priest, or a second person of the Trinity. Does Lewis's "friend" analogy limit your account, or do you find that simple relational category sufficient to carry the theological weight?
  *   **Likely Answer:** She will likely argue "friend" is a placeholder for "one in covenant relationship," which is robust enough.
  *   **Follow-up:** If it requires a covenant relationship, does that limit the scope of the atonement? Lewis's friend can pay the fine for *any* friend, but if your account requires a specific ontological union, does it risk making penal substitution unavailable to the very people who need it most?
