      *   *Love/Metaphysics of Sexual Love:* The "Genius of the Species." We think we are pursuing personal happiness, but we are actually puppets of the Will-to-Life ensuring the next generation has good traits. The "romantic glow" is a delusion to trick us into the serious business of procreation.
