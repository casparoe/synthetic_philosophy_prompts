answer: |-
  This is a sophisticated question that touches on a deep tension in decision theory, often framed recently as **Ergodicity Economics** (championed by physicist Ole Peters) versus standard **Expected Utility Theory (EUT)**.

  You are mathematically correct: in a context of repeated, multiplicative bets where you reinvest your bankroll, maximizing the arithmetic expected value (EV) of wealth leads almost surely to ruin, while maximizing the geometric growth rate (via the Kelly criterion) maximizes long-term wealth.

  However, the reason economics, finance, and effective altruism (EA) have not universally switched to geometric expectation is not merely institutional inertia. There are principled, structural reasons why arithmetic expectation (or, more accurately, expected utility) remains the dominant framework. The short answer is: **Arithmetic EV is the correct tool for additive or single-shot problems, while Geometric EV is the correct tool for multiplicative, repeated problems.** Most real-world decisions are a complex hybrid of both.

  Here is a detailed breakdown of why plain expected value survives in these fields.

  ### 1. Economics: Expected Value vs. Expected Utility
  There is a common misconception that mainstream economics maximizes the *arithmetic expected value of wealth*. It does not. Since Von Neumann and Morgenstern (1944), standard economics has maximized the **expected value of a utility function**.

  *   **The Bridge:** If an agent's utility function is $U(W) = \ln(W)$ (logarithmic utility), maximizing expected utility is mathematically identical to maximizing the geometric growth rate (Kelly).
  *   **The Disagreement:** Mainstream economics treats the utility function as a representation of **subjective preference**. If you are risk-neutral, your utility is linear ($U(W) = W$), and you should maximize arithmetic EV. If you are risk-averse, your utility is concave.
  *   **The Geometric Rationality Claim:** Proponents of geometric rationality argue that log-utility shouldn't be a *preference*; it should be a **physical necessity** for survival in multiplicative environments. They argue that using linear utility in a compounding world is a calculation error, not a preference.
  *   **Why Economics Resists:** Economists deal with many decisions that are not multiplicative bets. If I choose between a guaranteed \$50 or a 50% chance of \$100, and I spend the money immediately on groceries, the bet does not compound. The process is additive, not multiplicative. In additive, single-shot contexts, arithmetic EV is actually the correct metric for a risk-neutral agent. Because economic models must cover both consumption (additive) and investment (multiplicative), the broader Expected Utility framework is retained, with log-utility as a specific case rather than the universal default.

  ### 2. Quantitative Finance: Diversification and Estimation Error
  In finance, the Kelly criterion is well-known and respected, but it is rarely used as a raw, unadjusted decision rule.

  *   **Volatility Drag:** Full Kelly betting results in extreme volatility. Your bankroll will frequently experience drawdowns of 50% or more. While the *terminal* wealth is maximized, the *path* is often unacceptable for funds that face margin calls, investor redemptions, or psychological limits.
  *   **Estimation Error (The "Edge" Problem):** Kelly requires precise knowledge of the probability of winning and the payoff odds. In sports betting, you might have a robust model. In financial markets, edges are microscopic and noisy. If you overestimate your edge even slightly, Full Kelly becomes "Over-Kelly," which drastically reduces geometric growth and increases ruin risk. Consequently, quants typically use **Fractional Kelly** (e.g., Half-Kelly), which is a heuristic compromise between geometric optimality and risk management.
  *   **Portfolio Theory:** Modern Portfolio Theory (Markowitz) optimizes the arithmetic mean and variance of returns. While this is technically an arithmetic framework, it is usually a proxy for maximizing utility over a specific time horizon. For short horizons or non-reinvested capital, arithmetic mean-variance optimization is often more practical than geometric optimization.

  ### 3. Effective Altruism: Compounding vs. Impact
  The EA community is perhaps the most receptive to long-termist, compounding arguments, yet it largely sticks to arithmetic EV. Why?

  *   **The Currency of "Good":** Money compounds; "lives saved" or "suffering averted" generally does not. If I spend \$1,000 on bednets today, I save X lives. I cannot "reinvest" those saved lives to save more lives next year in a multiplicative way. When the output is not reinvestable capital, arithmetic EV is the correct metric.
  *   **Risk Neutrality in Altruism:** A core tenet of some EA thought (particularly long-termism) is that altruists should be risk-neutral regarding outcomes. If there is a 1% chance to prevent human extinction (a massive value) and a 99% chance to do nothing, the arithmetic EV is enormous. A geometric/log approach would heavily discount the 99% failure case, potentially making high-variance, high-impact interventions look unattractive. Since existential risk reduction is inherently high-variance, switching to geometric expectation could paralyze the movement.
  *   **Time Horizon:** Geometric growth only dominates arithmetic growth over very long time horizons. If an EA organization needs to demonstrate impact within a decade to maintain funding, the "long-run" guarantee of Kelly is less relevant than the "short-run" expectation of arithmetic EV.

  ### 4. The Ergodicity Argument (The Core Theoretical Clash)
  The intellectual home of "Geometric Rationality" is **Ergodicity Economics**. This framework highlights the difference between:
  1.  **Ensemble Average (Arithmetic):** What happens if 1,000 people make the bet once?
  2.  **Time Average (Geometric):** What happens if 1 person makes the bet 1,000 times?

  In non-ergodic systems (like compounding bets), these two averages diverge. The arithmetic mean reflects the ensemble average; the geometric mean reflects the time average.

  **Why hasn't this overturned standard theory?**
  *   **Insurance and Hedging:** We live in a society where risks can be pooled. Insurance allows individuals to convert multiplicative risks (my house burns down) into additive costs (I pay a premium). In a well-functioning market with hedging instruments, the distinction between time and ensemble averages blurs because you can offload the time-risk to the ensemble.
  *   **Consumption:** As mentioned, humans consume wealth. We do not simply compound it until death. The optimal strategy for a agent who consumes along the way is not pure Kelly, but a consumption-investment optimization (Merton's problem), which blends arithmetic and geometric considerations depending on the utility of consumption.

  ### 5. Summary: Is it Lag or Principle?
  It is mostly **principle**, with a side of **complexity**.

  1.  **Context Dependence:** Arithmetic EV is correct for additive, single-shot, or hedged decisions. Geometric EV is correct for repeated, unhedged, multiplicative decisions. Since the real world contains both, a unified theory (Expected Utility) that can accommodate both via different utility functions is more flexible than hard-coding Geometric Expectation as the universal rule.
  2.  **Parameter Sensitivity:** Geometric optimization is incredibly sensitive to input errors. In fields where probabilities are uncertain (finance, policy), arithmetic EV with conservative constraints is often more robust than geometric EV with optimistic edges.
  3.  **Value Definitions:** In fields like Effective Altruism, the "value" being maximized often lacks the mathematical property of compounding, making geometric expectation category errors.

  **The Verdict:**
  You have identified a genuine blind spot in how people intuitively handle risk. For your sports-betting model, **geometric rationality is absolutely the correct framework** because you are engaging in repeated, multiplicative betting with reinvestment.

  However, general economics and finance haven't "failed" to switch; they recognize that Kelly is a specific solution to a specific problem (repeated capital growth), whereas Expected Utility is the general solution to decision-making under uncertainty. The "Geometric Rationality" movement is valuable because it forces us to check if we are mistakenly applying arithmetic logic to multiplicative problems (a very common error), but it is not a total replacement for standard decision theory.

  **Practical takeaway:** Use geometric expectation (Kelly) for your bankroll management. Use arithmetic expectation (EV) for evaluating one-off opportunities or non-compounding outcomes. Use Expected Utility to bridge the gap based on your personal risk tolerance and consumption needs.
