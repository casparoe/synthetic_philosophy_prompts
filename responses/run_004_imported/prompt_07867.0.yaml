          *   *Verdict:* Philosophically robust, practically paralyzing.

      *   **Turn 2: Marcus's Counter.**
          *   *Argument:* Uncertainty cuts both ways. Doing nothing has the same unknowable tail. If uncertainty is symmetric, fall back to foreseeable effects (saving a life now).
