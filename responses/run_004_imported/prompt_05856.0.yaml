answer: |-
  Elara sat before the hearth until the logs collapsed into a bed of white eyes, refusing to go to the room where her husband's body lay cooling. She wanted to say he was in there, that the man was the flesh, but the flesh was still and the man had never been still. If the fire were the wood, the wood would burn without a spark, yet the logs sat cold until she lit them. If he were the body, the body would not have left when the breath stopped. She poked the ash, looking for the heat in the timber itself, but found only dust. To mourn the body felt like mourning the unburnt log; it was there, solid and undeniable, but it was not the burning.

  She looked up into the dark corner of the ceiling, trying to find him separate from the flesh, hovering like a flame detached from fuel. But fire does not float in the air without consuming something; a flame without wood is just a word. If he were somewhere else, apart from the room and the body, she should be able to point to where he went, just as she could point to the smoke rising up the chimney. But the air was empty. To mourn a ghost felt like mourning the heat after the fire died; it was a memory of sensation, not a thing she could tend. She was stuck between the wood that wouldn't burn and the fire that wouldn't hold.

  The logic of the night tightened around her throat. If he was the body, why was she speaking to the air? If he was the air, why was she washing the hands? If he was both, he was two things, and she had only lost one. If he was neither, then who had died? The grief had no object, yet it weighed heavy enough to break her ribs. She felt like a fire trying to burn without fuel, consuming itself in the questioning, spinning in the exhaustion of a mind that demands a noun where there is only a verb.

  She reached for the kindling box and pulled out a split branch of pine, heavy with resin. She laid it on the embers and blew until the orange caught the sap. The flame was not the wood, yet it did not exist without it. It was not separate, yet it was not the same. It was the *eating* of the wood. The heat was real, enough to warm her hands, but it belonged to the contact, not the thing. She stopped looking for him in the room or in the corpse and felt the grief shift from a search for a location to an acknowledgment of the burning. He was not gone; the conditions for him had changed.

  Dawn greyed the window pane. Elara stood up, her knees cracking in the cold air. She did not know where he was, but she knew what the fire required. She picked up the poker and the washbasin, not because she had solved the mystery of the self, but because the duty remained even when the owner was empty. She opened the door to the bedroom to begin the washing, carrying the heat in her hands like a borrowed thing, knowing it would cool again, knowing it was enough for now.
