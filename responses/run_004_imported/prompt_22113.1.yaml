answer: |-
  It is a genuine pleasure to speak with someone who has actually *done* the physiology. Too often, philosophers of biology argue about "hearts" and "wings" without ever having dissected one. Your intuition—that a molecule-for-molecule identical heart *must* have the function of pumping blood—is the exact intuition that keeps the Causal Role (CR) camp in business and gives the Etiological (Selected Effects, or SE) camp their biggest headache.

  Let's walk through the four parts of your query: why the etiological view takes that hard line, whether the bullet is as bitter as it tastes, how the causal role view handles it, and whether there are hybrid solutions that don't collapse into one another.

  ### 1. Why the Etiological Camp is Committed to "No Function"

  To understand why etiological theorists (like Ruth Millikan or Karen Neander) bite this bullet, you have to look at what work they want the word "function" to do. For them, function is not a description of **current utility**; it is a claim about **normativity**.

  In your lab, if a swim bladder failed to control buoyancy, you called it "malfunctioning" or "broken." You didn't just say, "It is currently failing to contribute to the system." You implied it *ought* to be doing something else. The etiological camp argues that the only way to ground an "ought" in biology is through history.
  *   **The Claim:** $X$ has the function $F$ if and only if $X$ exists now because ancestors of $X$ successfully did $F$ in the past (and were selected for it).
  *   **The Swampman Heart:** Since this organ popped into existence via quantum fluctuation (or whatever), it has no ancestors. Therefore, it has no selection history. Therefore, strictly speaking, it has no function.

  **The Counterfeit Analogy:**
  Think of a perfect counterfeit \$100 bill. It is molecule-for-molecule identical to a real bill. It can buy coffee; vending machines accept it. But economists and legal theorists say it is *not money*. Why? Because it lacks the right causal history (it wasn't minted by the Treasury).
  The etiological theorist says the Swampman heart is like the counterfeit bill. It *acts* like a heart, but it isn't *a heart* in the functional sense yet. It is a "heart-ish" object. They are committed to this because they believe if you sever function from history, you lose the ability to distinguish between a **broken heart** and a **heart that just isn't useful**.

  ### 2. Does the Weirdness Survive Scrutiny?

  Does this conclusion hold up, or is it a *reductio ad absurdum*? This is where the fight is.

  **The Etiological Defense:**
  Proponents argue the weirdness is actually a feature, not a bug. They would say:
  1.  **Projection:** When you look at the Swampman heart and say "it pumps blood," you are projecting the history of *other* hearts onto it. You are treating it *as if* it had a function.
  2.  **The First of a Line:** If the Swampman survives and reproduces, its offspring will have hearts with genuine functions (because *those* hearts will be there due to selection). The Swampman is just the lucky progenitor. It has the *effect* of pumping, but not the *function*.
  3.  **Normativity:** If the Swampman heart has an arrhythmia, can we say it is "broken"? The SE theorist says no. It's just a flawed object. A broken compass is one that fails to point North *because compasses are designed to point North*. A random magnetic needle that happens to point North isn't "correct," it's just aligned.

  **The Critique:**
  However, many philosophers (and physiologists!) feel this is semantic stubbornness. If the organ is structurally identical and integrated into a circulatory system that relies on it, denying it has a function seems to divorce philosophy from biological reality. If the "function" label doesn't apply to the thing doing the job perfectly, what good is the label? This intuition is why many find the SE view too restrictive for actual scientific practice.

  ### 3. How the Causal Role Camp Handles the Case

  Robert Cummins's Causal Role (CR) theory was explicitly designed to avoid this historical baggage. It fits much more comfortably with how physiologists actually talk.

  **The Mechanism:**
  For Cummins, a function is a causal contribution of a component to a capacity of the containing system.
  *   **System:** The Swampman organism.
  *   **Capacity:** Circulation (or survival).
  *   **Component:** The heart.
  *   **Analysis:** Does the heart contribute to circulation? Yes.
  *   **Verdict:** The function of the heart is to pump blood. History is irrelevant.

  **The Trade-off:**
  The CR view handles the Swampman easily, but it pays a price elsewhere: **Panfunctionalism.**
  If function is just "whatever causal contribution a part makes," then the heart also has the function of "making a thumping sound" (which contributes to the capacity of "alerting predators to my presence") or "occupying space in the chest cavity" (which contributes to "preventing the lungs from collapsing").
  Cummins handles this by saying functions are relative to a specific **analytical program**. If the physiologist is analyzing circulation, pumping is the function. If the ecologist is analyzing predation, noise-making is a function.
  So, while CR saves the Swampman heart, it makes "function" less objective. It becomes relative to the observer's explanatory interests, whereas the SE camp wants function to be an objective fact about the organism, regardless of who is looking.

  ### 4. Patching the Etiological View (Without Collapsing into CR)

  You asked if anyone has patched the etiological view to dodge the Swampman bullet without just becoming a causal-role view in disguise. There are three major attempts worth noting:

  **A. Pluralism (Godfrey-Smith, Sterelny)**
  This view suggests you are both right, but you are talking about different concepts.
  *   **Selected Effect Function:** Used when discussing adaptation and evolution ("Why is this trait here?"). Here, Swampman has no function.
  *   **Causal Role Function:** Used when discussing physiology and mechanics ("How does this system work?"). Here, Swampman has a function.
  *   *Verdict:* This doesn't solve the metaphysical dispute, but it validates your 35 years of physiology. You were using CR functions; the evolutionary biologists were using SE functions.

  **B. The Propensity/Dispositional View (Bigelow & Pargetter)**
  They try to keep the link to survival without requiring *past* history. They argue function is about the **propensity** of the trait to confer survival in the *current* environment.
  *   *Swampman:* The heart has a high propensity to confer survival. Therefore, it has a function.
  *   *Risk:* This leans heavily toward CR. If it's just about current survival potential, how is it different from Cummins? They argue it's different because it still ties function to *survival* specifically, not just any causal role (like making noise).

  **C. The Organizational Account (Mossio, Saborido, Moreno)**
  This is a newer view that might appeal to a systems physiologist. It grounds function not in *past* selection, but in **current self-maintenance**.
  *   **The Idea:** In living systems, components are produced by the system itself, and the system depends on those components to maintain itself. This creates a closed loop of causal dependence.
  *   **Swampman:** If the Swampman organism is a self-maintaining system (it repairs itself, metabolizes, etc.), and the heart is part of that self-maintaining organization, it has a function.
  *   **Advantage:** It keeps the normativity (a part can fail to maintain the system) without requiring an evolutionary past. It treats the organism as a thermodynamic system rather than a historical artifact.
  *   **Status:** This is currently one of the most vigorous areas of debate in philosophy of biology. It avoids the Swampman problem but struggles with things that aren't self-reproducing (like mules or sterile castes in ants).

  ### Summary for a Retired Physiologist

  You aren't stuck because you missed something; you're stuck because the philosophy is genuinely split on whether biology is a **historical science** (like geology) or a **functional science** (like engineering).

  *   **Etiological (SE):** Biology is historical. Function = History. Swampman heart = Counterfeit money. (Good for explaining adaptation/malfunction).
  *   **Causal Role (CR):** Biology is mechanistic. Function = Current Contribution. Swampman heart = Working engine. (Good for explaining physiology/systems).
  *   **The Patch:** Most modern philosophers lean toward **Pluralism**. They admit that when you were in the lab saying "the function of the swim bladder is buoyancy," you were speaking truthfully in the Causal Role sense. When an evolutionary biologist asks "what is the function of the swim bladder," they are asking about the Selected Effect sense.

  The Swampman case reveals that these are two different questions wearing the same coat. The etiological camp refuses to take the coat off; the causal role camp says the coat doesn't fit; the pluralists say we need two coats. Given your background, you'll likely find the **Organizational Account** the most satisfying middle ground: it respects the systemic integration you studied for decades without demanding a genealogy for every trait.
