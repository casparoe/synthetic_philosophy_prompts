          3.  Analyze the "Weirdness" (Is it a bug or a feature?). Discuss Normativity vs. Description.
          4.  Explain the Causal Role response (The "How"). Mention the "Capacity" constraint.
          5.  Discuss the Patches/Hybrids (The "Future"). Focus on Pluralism and Organizational accounts.
      *   *Key Distinction to emphasize:* "What does it do?" vs. "What is it *for*?"

  5.  **Refining the Content (Self-Correction during drafting):**
