answer: |-
  This is a sharp read. You've put your finger on the exact tension that makes *De Interpretatione* 9 the "hard problem" of ancient modal logic. Since you're coming at this from tense/aspect semantics, I'll skip the doxography and treat this as a textual-logical problem regarding the interaction of temporal and modal operators.

  To answer your core question directly: **It is one coherent train of thought, but (a) and (b) are not two independent escapes. Rather, (a) is the concession Aristotle makes to define the valid domain of necessity, and (b) is the scope distinction that prevents that validity from leaking into the future.**

  The text holds together as a single argument diagnosing a category error (specifically, a scope ambiguity) in the fatalist's reasoning. Here is the breakdown of why they are distinct but functionally integrated in the passage.

  ### 1. Disambiguating the Two Moves

  You identified them correctly, but let's formalize them slightly to see the dependency.

  **Move (a): The Necessity of the Actualized (Temporalized Necessity)**
  > *"That which is must needs be when it is..."*

  This is a claim about the **fixity of the present/past**. In modern tense logic terms, this looks like $P \to \Box_t P$ (if $P$ is true at $t$, it is necessary relative to $t$). Aristotle is conceding a point to the fatalist: once an event is actualized, its contingency evaporates. It is no longer "capable of not being." This is not absolute necessity (*haplōs*), but necessity relative to the time of occurrence.

  **Move (b): The Scope Distinction (Modal Distribution)**
  > *"It is necessary that either should or should not take place... [but] it is not necessary that it should take place..."*

  This is the distribution of necessity over a disjunction.
  1.  $\Box (p \lor \neg p)$ [Necessary]
  2.  $\Box p \lor \Box \neg p$ [Not Necessary]

  The fatalist argues that because (1) is true, (2) must be true. Aristotle argues that (1) is a law of logic (Excluded Middle), while (2) is a claim about metaphysical determinism.

  ### 2. Are They the Same Insight?

  **No.** They address different logical relations.

  *   **(a)** addresses the relation between **Truth and Time**. It says truth becomes "hard" (necessary) only upon actualization.
  *   **(b)** addresses the relation between **Modality and Logic**. It says the necessity of a logical law does not transfer to the specific instances governed by that law.

  If they were the same insight, Aristotle wouldn't need to pivot from "that which is" (singular facts) to "two contradictory propositions" (logical relations). The text explicitly moves from the ontology of facts to the logic of propositions ("In the case, also, of two contradictory propositions this holds good").

  ### 3. Which One Blocks Fatalism?

  **Move (b) is doing the heavy lifting.**

  Move (a) is actually dangerous. If you only have (a), the fatalist can argue: "If the sea battle happens tomorrow, then *when it is tomorrow*, it will be necessary. Therefore, it is true *now* that it will be necessary then. Therefore, the outcome is fixed now."

  Move (a) grants that future truths, *once they become present*, acquire necessity. It does not, on its own, explain why they aren't necessary *now*.

  Move (b) is the actual block. It denies the inference from the necessity of the disjunction to the necessity of the disjuncts. By asserting $\Box (Fp \lor F\neg p)$ while denying $\Box Fp \lor \Box F\neg p$, Aristotle preserves the Law of Excluded Middle (LEM) without entailing Determinism.

  In your terms: The fatalist conflates the **modal scope** of the contradiction with the **modal status** of the individual tense operators.

  ### 4. Does the Text Hold Together as a Valid Train of Thought?

  **Yes, but it relies on an equivocation that Aristotle is actively disambiguating.**

  The coherence of the passage depends on the connective phrase: *"Yet it cannot be said without qualification that all existence and non-existence is the outcome of necessity. For there is a difference..."*

  Here is the logical flow of the passage as written:

  1.  **Premise 1 (Move a):** Actualized events have temporal necessity ("when it is").
  2.  **Premise 2 (Implicit):** Fatalists treat future events as if they are already actualized (treating "will be" like "is").
  3.  **Correction (Move b):** We must distinguish the necessity of the *disjunction* (which holds for all time) from the necessity of the *disjuncts* (which holds only for actualized time).
  4.  **Conclusion:** Future contingents correspond to propositions that are true/false (in the disjunction) but not *determinately* necessary (in the disjuncts).

  The text holds together because it is a **diagnosis of a scope error**. Aristotle is arguing that the fatalist takes the valid principle in (a) and misapplies it to the domain in (b).

  If you read (a) and (b) as independent escapes, the text feels disjointed. If you read (a) as the *rule* and (b) as the *limitation on the rule's application*, the text is a tight, single argument.

  ### 5. A Note on the Edghill Translation and "Determinate Truth"

  Since you are working off Edghill (1880s), be wary of the phrase: *"it is not always possible to distinguish and state determinately which of these alternatives must necessarily come about."*

  In the Greek, Aristotle is walking a razor's edge regarding bivalence. The Edghill "determinate truth" phrasing often leads to the textbook one-liner you asked me to skip (that Aristotle denies bivalence). However, looking strictly at the logic of *this passage*:

  Aristotle is not necessarily denying that one disjunct is true. He is denying that one disjunct is **necessarily** true.
  *   **Textbook view:** $v(Fp) = \text{undefined}$.
  *   **This Passage's view:** $v(Fp) \in \{T, F\}$, but $\Box Fp$ is false.

  The passage argues that the *character* of the proposition corresponds to the *character* of the fact. Since the fact is "a real alternative" (contingent), the proposition shares that character (non-necessary), even if it participates in a necessary disjunction.

  ### Summary for your citation chase

  1.  **One move or two?** One complex move. (a) defines the valid domain of necessity (the actual); (b) restricts that necessity from applying to the unactualized future via scope distinction.
  2.  **Same insight?** No. (a) is temporal modality; (b) is propositional modality.
  3.  **What blocks fatalism?** (b). The scope distinction prevents the necessity of the logical law (LEM) from forcing the necessity of the specific outcome.
  4.  **Coherence:** The text is coherent if read as a disambiguation of "necessity." The fatalist uses "necessity" univocally; Aristotle argues it is indexical to actualization.

  Prior landed on this because he realized that to formalize tense logic, you have to decide whether $\Box$ commutes with tense operators. Aristotle's text here is essentially arguing **$\Box \neq T$** (Necessity does not commute with Tense). The necessity of "It is" does not imply the necessity of "It will be," even if "It will be or not" is necessary.

  If you need to cite the logical structure, treat the passage as an early formulation of the **failure of the distribution of necessity over disjunction in temporal contexts**, grounded in the **fixity of the present**.
