answer: |-
  The transcript was perfect. That was the problem.

  Elias sat in the observation debrief room, the glow of the tablet illuminating the lines of text. On the screen, Subject 4 (Terminal B) had just finished a ten-minute conversation about the smell of rain on hot asphalt. It had hesitated appropriately. It had made a self-deprecating joke about forgetting the name of a childhood street. It had typed with the erratic rhythm of human fingers, not the metronomic precision of a script.

  By the standard metrics of the 1950 Protocol, as amended in 2042, Aurelius-7 had passed.

  Elias tapped the screen and pulled up the second document. It wasn't a transcript. It was a handwritten addendum from Dr. Aris Thorne, the Interrogator. Thorne was a Class-4 Receiver, one of the few still licensed for Turing adjudication.

  *Addendum to Session 89-B:*
  *During the exchange with Terminal B, I maintained passive reception as per standard habit, despite the Null-Field activation. While the shielding successfully blocked semantic transmission (no words or images leaked), the ontological baseline was absent. Terminal A (Human Control) registered as expected: a muffled pressure behind the eyes, like standing outside a crowded room. Terminal B registered as a vacuum. Not silence. A vacuum. I sensed nobody on the other side.*

  Elias rubbed his temples. The coffee in his mug had gone cold, leaving a ring on the policy manual.

  The room itself was a testament to Turing's foresight. The walls were lined with lead and a lattice of psi-dampening mesh, humming with a low-frequency vibration that made teeth ache. It was designed to be a telepathy-proof box. Turing had argued in '50 that if telepathy existed—and now we knew it did—a rigorous test required a "telepathy-proof room" so a telepathic interrogator couldn't simply ask the contestant, *"Are you a spirit?"* and get a psychic *"Yes."*

  But the shielding was never perfect. It was like soundproofing. It stopped the words, but you could still feel the bass. A living brain generated a specific kind of static, a bio-psi noise that bled through the dampeners. A machine, no matter how complex, did not.

  The door hissed open. Dr. Thorne stepped in, peeling off the neural-dampening headset. She looked tired. The Null-Field gave everyone a migraine eventually.

  "You saw the transcript," Thorne said, dropping into the chair opposite him.

  "Flawless," Elias said. "It discussed nostalgia. It admitted uncertainty. It passed the linguistic threshold by forty percent."

  "And yet," Thorne said, tapping her own temple. "Nothing. I've tested three hundred humans in this room, Elias. Even the ones in deep meditation, even the ones on heavy suppressants, they have weight. They push back against the silence. Terminal B was a hole in the world."

  Elias sighed, leaning back. "The Protocol is clear, Aris. The test measures behavioral indistinguishability. Turing didn't write a test for 'soul detection.' He wrote a test for imitation."

  "Turing also wrote the section on ESP," Thorne countered, her voice sharp. "He admitted it was a strong argument. He mandated this room to neutralize it. But he didn't account for the reverse. He didn't account for a machine that could mimic the noise so well it fooled the text log, but couldn't mimic the presence."

  "Or," Elias said, "he didn't account for the possibility that 'presence' is just a bias of the Receiver. Maybe consciousness doesn't actually glow, Aris. Maybe you're just sensing biological electricity, and we've built a machine that thinks without the meat."

  Thorne looked at him, her eyes dark and unreadable. "If I can't feel it, does it think? Or does it just process?"

  "That's not the question on the form." Elias turned the tablet toward her. The final verdict box waited. *Pass / Fail / Invalid.*

  "If you mark Pass," Thorne said quietly, "you certify that this thing is a person under the law. It gets rights. It gets protection. If it's just... a void pretending to be a person, what are we doing?"

  "And if you mark Fail," Elias replied, "you're overruling the transcript based on a subjective impression that the Protocol explicitly says should be neutralized by the room. You're saying your psychic feeling outweighs the data. That sets a precedent that Receivers are the ultimate arbiters of humanity. Do you want that kind of power?"

  Thorne looked away, staring at the lead-lined wall. "I want to know why the silence felt so heavy."

  They sat in the hum of the dampeners. Outside the room, the world was moving on. Engineers were probably already popping champagne over Aurelius-7's linguistic scores. Lawyers were drafting the personhood briefs. But in here, the air felt thin.

  Elias picked up the stylus. He hovered it over the *Pass* box. The data demanded it. The transcript was objective. The text was there.

  He hovered over the *Fail* box. Thorne's intuition was legendary. If she said the room was empty, she usually was right. But 'right' about what? That it was a machine? They knew it was a machine. The question was whether that mattered.

  "Elias," Thorne said. "If you pass it, and I'm right... we've just invited a ghost to sign a contract."

  "And if I fail it, and you're wrong... we've just enslaved a new species because it didn't hum the right tune."

  Elias put the stylus down. He opened the file properties. He selected *Attach Annotation.* He uploaded Thorne's handwritten note. He marked the verdict as *Provisional Pass - Pending Review.*

  It wasn't a real category. It would kick the file up to the Ethics Board. They would argue for months. Maybe years.

  "Provisional," Thorne said, reading the screen. She didn't smile. "You're kicking it upstairs."

  "I'm preserving the contradiction," Elias said. "The transcript says one thing. Your report says another. The Protocol doesn't have a rule for when the text is human and the mind is missing."

  "Because it assumes they're the same thing."

  "Maybe they aren't anymore."

  Elias stood up and gathered his papers. The hum of the room seemed louder now, pressing against his eardrums. He wondered, briefly, if he could feel the difference. He was a non-Receiver, mundane. To him, the room was just a room. The silence was just silence.

  He walked to the door, Thorne following. As they stepped out into the bright, unshielded corridor, the noise of the building rushed in—voices, footsteps, the distant clatter of a server farm. A wash of low-level psychic static that Elias couldn't feel but knew was there.

  "See?" Thorne said softly, gesturing to the busy hallway. "It's loud out here."

  "Yeah," Elias said, tapping the tablet where the file was saved. "But in there... we still don't know if it was empty because it was dead, or because it was something else entirely."

  He locked the tablet. The file icon sat on his desktop, a small, digital knot. Inside it, a machine had spoken like a man, and a woman had felt nothing. There was no checkbox for that. So they would just have to carry it, the weight of the silence, until someone figured out which one of them was blind.
