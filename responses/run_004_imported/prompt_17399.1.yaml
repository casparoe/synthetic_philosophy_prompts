  **MEMORANDUM**

  **TO:** Steering Committee and Contributing Team
  **FROM:** Chair, Steering Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Regarding Global Classical Axioms in Library Core

  ### 1. Executive Decision

  After reviewing the proposal to adopt the Law of Excluded Middle (LEM) and the Axiom of Choice (AC) as global defaults, and considering the feedback from all stakeholders, the Steering Committee has decided to **reject the adoption of global classical axioms.**

  We will maintain the library's core as intuitionistic. Classical reasoning will remain permitted but must be explicitly scoped via local axioms or confined to designated namespaces. We will not pursue a separate fork at this time, as we believe the community's strength lies in a unified codebase, provided the boundaries between constructive and classical content are rigorously enforced.

  ### 2. Context and Stakes

  This decision addresses a fundamental tension in our project's identity. Our library serves three distinct constituencies:
  1.  **Industry Partners:** Who extract certified code for safety-critical systems.
  2.  **Academic Educators:** Who use the library to teach verification and computational logic.
  3.  **Mathematical Contributors:** Who seek to formalize standard mathematics efficiently.

  The proposal to globalize classical axioms was driven by a desire to reduce the friction of porting standard analysis and set theory. The resistance was driven by a commitment to the guarantee that existence proofs yield computable witnesses. Both positions are technically coherent and philosophically grounded. However, a library cannot simultaneously guarantee computational extraction for all theorems and assume non-constructive axioms globally. We must choose which guarantee defines the "Core."

  ### 3. Rationale for Rejecting Global Adoption

  The primary driver for this decision is the contractual and safety-critical dependency of our industry partners. Their workflow relies on the property that any proof of existence in the core library corresponds to an executable algorithm. 

  If we adopt LEM and AC globally:
  *   **Extraction Becomes Unsound:** Code extraction from proofs relying on these axioms produces terms that cannot be executed or require unsafe stubs. In a safety-critical context, this introduces unverified risk.
  *   **Silent Contamination:** In a global classical setting, a contributor might inadvertently use a classical lemma in a proof intended to be constructive. Without explicit flags, the loss of computational content is invisible until extraction fails.
  *   **Mission Drift:** Our library distinguishes itself from other formalization projects (such as Lean's Mathlib) by prioritizing constructivity. Abandoning this differentiates us less and alienates the user base that selected us specifically for this guarantee.

  ### 4. Engaging the Proposal for Classical Axioms

  We take the arguments of the contributors advocating for global classical axioms seriously. This is not merely a matter of convenience; it is a matter of mathematical scope and sustainability.

  **The Burden of Constructivity:**
  We acknowledge that re-proving standard analysis constructively is exponentially more difficult than porting classical proofs. Requiring every contributor to navigate intuitionistic logic creates a high barrier to entry for mathematicians trained in standard ZFC set theory. When local axioms are required, they introduce boilerplate and can complicate type inference, slowing down development.

  **The Argument for Standardization:**
  The faction arguing for global axioms correctly notes that the vast majority of published mathematics is classical. By resisting this, we risk isolating our library from the broader mathematical community, making it a niche tool rather than a general-purpose repository of formalized knowledge. There is validity to the claim that a proof of existence, even without a witness, provides valuable logical certainty about the structure of mathematical objects.

  **Why Global Adoption is Still the Wrong Tool:**
  While the goal of expanding our coverage of analysis is correct, global axioms are a disproportionate solution. They solve the friction problem for classical contributors by breaking the guarantee for constructive users. Since we already have a mechanism for local axioms that works technically, the issue is one of workflow friction, not feasibility. We should address the friction, not the philosophy.

  ### 5. Engaging the Constructive Resistance

  To our long-standing contributors who resist classical axioms on principle:

  **The Value of Witnesses:**
  Your position remains the ethical core of this project. A proof that supplies no construction is, in the context of verification, an incomplete specification. If we cannot extract the witness, we cannot verify the behavior of the system that depends on it. 

  **The Risk of Purism:**
  However, we must also heed the warning that strict purism can lead to stagnation. If the library becomes too difficult to contribute to, the "constructive core" will shrink from lack of maintenance. We cannot allow the principle of constructivity to become a barrier to the growth of the library itself. The presence of classical sections, clearly marked, does not invalidate the constructive sections; it merely delineates where computation is guaranteed and where it is not.

  ### 6. Path Forward: Reinforcing the Local-Only Model

  To make this decision sustainable, we cannot simply maintain the status quo. We must improve the experience for contributors working in classical domains so that a fork does not become necessary in the future.

  1.  **Strict Dependency Linting:** We will implement automated tooling in the CI pipeline that flags any constructive file importing a classical dependency. This protects the industry partners from accidental contamination without requiring manual code review for every axiom usage.
  2.  **Classical Namespaces:** We will establish a `Classical` namespace hierarchy. Files within this namespace may assume LEM/AC globally *within their scope*, but any export to the root namespace must be stripped of classical dependencies. This allows classical mathematicians to work comfortably within their namespace without imposing their axioms on the core.
  3.  **Documentation of Guarantees:** We will clearly label theorems in the documentation. A "Constructive" badge will indicate extraction safety; a "Classical" badge will indicate logical validity without computational content. This transparency serves both the industry auditors and the theoretical mathematicians.

  ### 7. Conclusion

  This decision prioritizes the safety-critical guarantees that define our library's unique value proposition while acknowledging the legitimacy of classical mathematics. By rejecting global axioms, we protect our industry partners and educational mission. By refining our support for local axioms, we respect the time and effort of our classical contributors.

  We are one library with two modes of reasoning, not two libraries. It is the responsibility of the Steering Committee to ensure the boundary between them is technically enforced, so that both communities can thrive without compromising the other's integrity.

  I look forward to implementing these changes in the next release cycle.

  **[Signature]**
  **Chair, Steering Committee**
