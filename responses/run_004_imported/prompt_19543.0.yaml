      *   **Löbian Obstacle (in AI/Self-Modification):**
          *   Context: An agent $A$ wants to create/modify into agent $B$ (or trust its future self). $A$ needs to prove $B$ is sound (will only prove true things).
          *   Mechanism: Löb's Theorem ($\square(\square P \to P) \to \square P$). Roughly: A system cannot prove its own soundness unless it is inconsistent.
          *   Result: $A$ cannot prove $B$'s soundness if $B$ uses the same logic as $A$.
          *   *Goal:* Shows the impossibility of self-verification in formal systems of sufficient strength.

  3.  **Evaluate the Comparison (Question 1):**
