prompt: |-
  I've been building a simple Bayesian updating module for a side project and went down a rabbit hole reading about the philosophical foundations of confirmation theory. I kept running into something called the "problem of old evidence": since Bayesian conditionalization requires P(E) < 1 for E to raise your credence in a hypothesis, it seems to imply that already-known evidence (like Mercury's perihelion precession before Einstein) can never confirm a new theory that explains it -- which seems clearly wrong, since that's exactly the kind of thing that made physicists take general relativity seriously. Can you explain why this is considered a genuine problem for Bayesianism rather than just a technicality about how we set up the probabilities, and walk me through how the main proposed solutions (e.g., appeals to counterfactual credences or logical/impossible-possible-worlds approaches) try to resolve it?
