      *   *Move 3: Owen's Rebuttal (The Qualia Gap).*
          *   Claim: Testimony doesn't close the gap. Knowing *about* silence isn't *experiencing* silence (Mary's Room argument).
          *   Analysis: This is the strongest philosophical move. There is a difference between propositional knowledge (knowing that) and phenomenal knowledge (knowing how/what it's like).
