      *   *Move 2: Nadia's Counter.*
          *   Claim: This applies to *all* big decisions (kids, marriage). We use expected-value reasoning despite uncertainty. Cass did due diligence (talked to nuns).
          *   Analysis: This is a *reductio ad absurdum*. If Owen is right, rationality is impossible for normal life. She also introduces the "due diligence" aspect.
