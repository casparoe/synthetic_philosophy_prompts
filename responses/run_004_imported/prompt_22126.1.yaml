      *   *Move 4: Nadia's Final Stand.*
          *   Claim: If "can't know" = "irrational," then no one rationally has kids/marries/emigrates. Problem lies with the standard.
          *   Analysis: She doubles down on the *reductio*. She forces a choice: either accept that life's biggest choices are irrational, or expand the definition of rationality.
          *   Verdict: Nadia wins on the pragmatic/definitional front. We *call* these decisions rational in common parlance.

      *   *Move 5: Owen's Concession/Reframe.*
          *   Claim: Maybe that *is* true. Those decisions aren't rational in the "weigh-costs" sense. Something else justifies them.
          *   Analysis: Owen shifts from "Cass is irrational" to "Rationality isn't the only game in town." He distinguishes between instrumental rationality and something else (commitment, faith, identity).
