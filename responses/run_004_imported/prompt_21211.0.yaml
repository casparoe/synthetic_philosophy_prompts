      *   *Claim:* "That's her main argument for why we're better off just sticking with plain plurality voting."
      *   *Verdict:* **Weak/Incorrect.** Since plurality is *also* gameable (often notoriously so, e.g., "lesser of two evils" voting), using G-S to argue *for* plurality against RCV is logically inconsistent. Plurality is susceptible to the "spoiler effect," which is a form of strategic vulnerability.

  4.  **Consider Nuance/Context:**
