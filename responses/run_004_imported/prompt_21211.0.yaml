  Quick gut check for a piece I'm working on about the ranked-choice voting ballot measures popping up in a bunch of states this cycle. An election-law professor I interviewed told me the Gibbard-Satterthwaite theorem is basically proof that ranked-choice systems are the uniquely gameable ones, and thats her main argument for why we're better off just sticking with plain plurality voting (most votes wins, full stop). That sort of matches what I vaguely remember about the theorem from a stats class ages ago, but before this goes to print - is that actually a fair characterization of what the theorem shows?
