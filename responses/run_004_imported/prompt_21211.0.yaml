  2.  **Recall/Verify the Gibbard-Satterthwaite Theorem:**
      *   *What does it say?* It states that for any voting system with three or more candidates, if it is deterministic and non-dictatorial, it is susceptible to strategic voting (tactical voting/gaming).
      *   *Key implication:* *All* such systems are gameable, not just RCV.
      *   *Does it single out RCV?* No. It applies to plurality, Borda count, RCV (IRV), etc.
      *   *Does it imply plurality is better?* No. In fact, it implies *no* perfect system exists (relating to Arrow's Impossibility Theorem).

  3.  **Evaluate the Professor's Claim:**
