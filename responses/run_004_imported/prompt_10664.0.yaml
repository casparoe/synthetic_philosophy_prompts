prompt: |-
  I'm running a graduate seminar on social ontology this term, and last week we worked through David Lewis's *Convention*. I'd like some help sharpening a comparison for the next session, which turns to the game-theoretic literature on the evolution of norms, before I finalize the discussion questions for my students.

  Lewis analyzes a convention as a regularity in action that solves a recurring coordination problem: everyone conforms, everyone expects everyone else to conform, everyone prefers to conform given that others do, some alternative regularity could equally well have served the same purpose, and — crucially — all of this is common knowledge among the population, a notion Lewis essentially introduces into philosophy for this purpose. My students always balk at that last clause: it seems to commit Lewis to crediting ordinary convention-followers with an infinite hierarchy of higher-order beliefs — I expect you to conform, I expect you to expect me to conform, and so on — that no finite mind actually entertains.

  Brian Skyrms's evolutionary treatment of the same subject matter looks like a rival strategy for reaching the same destination at a fraction of the cognitive cost. On his account, the very same coordination regularities — including Lewis's own signaling conventions — can be driven to fixation by replicator dynamics or simple reinforcement learning, where no party represents anyone else's beliefs at all, let alone achieves common knowledge of them; a shared history of interaction and selection does the work that Lewis assigns to shared cognition. I'd like you to compare the two explanatory strategies in some detail: does Skyrms's dynamical story actually reproduce everything Lewis's account was designed to explain — the arbitrariness of the equilibrium selected, the self-perpetuating expectations that sustain it, the sense in which conforming parties are following a convention rather than each merely doing what happens to be individually best — or does something get lost once common knowledge drops out of the picture? I am particularly interested in whether an evolved regularity can ever be a norm in the sense that carries genuine normative force, something one can be faulted for violating, or whether that normative residue is only available once Lewis's mutual, common-knowledge-backed expectations are in place. Tell me which account is doing more of the real explanatory work in your assessment, and whether the two are ultimately competitors or could be combined so that each covers a different part of the phenomenon.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Graduate seminar on social ontology.
      *   **Previous Topic:** David Lewis's *Convention* (specifically the common knowledge requirement).
      *   **Upcoming Topic:** Game-theoretic literature on the evolution of norms (specifically Brian Skyrms).
      *   **Core Task:** Sharpen a comparison between Lewis's rationalist/common knowledge account and Skyrms's evolutionary/dynamical account.
      *   **Key Questions to Address:**
          *   Does Skyrms reproduce everything Lewis explains (arbitrariness, self-perpetuation, "following" vs. "doing")?
          *   What is lost without common knowledge?
          *   Can evolved regularities be *norms* with genuine normative force (fault/blame), or is that exclusive to Lewis's account?
          *   Which account does more explanatory work?
          *   Are they competitors or complementary?
      *   **Target Audience:** Graduate students (needs philosophical rigor, nuance, and clarity).
      *   **Tone:** Academic, analytical, helpful for seminar preparation.

  2.  **Deconstruct the Two Accounts:**

      *   **Lewis (Rationalist/Intentional):**
          *   *Mechanism:* Rational choice + Common Knowledge (CK).
          *   *Requirements:* Agents must have beliefs about beliefs (infinite hierarchy, though Lewis allows for "reason to believe" to mitigate the psychological burden).
          *   *Normativity:* Conventions create expectations. Violating them disappoints expectations and harms coordination. Normative force comes from the conditional preference to conform *given* others conform.
          *   *Arbitrariness:* Crucial. Another equilibrium could have worked.
          *   *Strengths:* Captures the *reason-giving* aspect of norms. Explains why we feel *obliged*.
          *   *Weaknesses:* Cognitively demanding (the student objection). Static snapshot (how did we get there?).

      *   **Skyrms (Evolutionary/Dynamical):**
          *   *Mechanism:* Replicator dynamics, reinforcement learning, selection.
          *   *Requirements:* Minimal cognition. Agents respond to payoffs/history, not necessarily beliefs about others' beliefs.
          *   *Normativity:* Stability. If you deviate, you get lower payoffs. "Normative force" is reduced to prudential stability or social sanctioning mechanisms that evolve.
          *   *Arbitrariness:* Path dependence. History selects one basin of attraction over another.
          *   *Strengths:* Solves the cognitive overload problem. Explains *emergence* (the dynamics Lewis lacks).
          *   *Weaknesses:* Risks reducing "ought" to "is" (stable regularity). Does it capture the *reason* to follow, or just the *cause* of following?

  3.  **Address the Specific Comparison Points:**

      *   *Arbitrariness:* Lewis needs alternative equilibria to be salient. Skyrms gets this via path dependence (historical accident determines which equilibrium is selected). Both handle this well.
      *   *Self-Perpetuating Expectations:* Lewis has this explicitly (CK). Skyrms has this implicitly via stable propensities. If the population is at equilibrium, my best response is to conform. But do I *expect* you to? In Skyrms, maybe not consciously, but my behavior *tracks* that expectation.
      *   *Following vs. Doing:* Lewis: I follow because I know you follow. Skyrms: I do because it worked before. This is the crux of the "normativity" issue.
      *   *Normative Force:* This is the hardest part. Lewis offers a *justification* (we agreed, implicitly). Skyrms offers an *explanation* (selection pressure). Can Skyrms account for *blame*? Only if we add a layer of meta-norms (punishing deviators). But is that *moral* fault or just cost? Lewis connects it to mutual assurance. Skyrms connects it to stability.

  4.  **Synthesize the "Competitors vs. Complementary" Question:**
      *   Are they rivals? On the surface, yes (Rationality vs. Causality).
      *   In reality? They answer different questions. Lewis answers "What constitutes a convention *now*?" (Constitutive). Skyrms answers "How did conventions *arise*?" (Etiological).
      *   Can they combine? Yes. Evolution gets us to the equilibrium; Common Knowledge sustains it among reflective agents. Or, CK is an idealization of the stable expectations generated by evolution.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the pedagogical value. Validate the student objection (CK is indeed heavy).
      *   *Section 1: The Cognitive Gap.* Contrast Lewis's "Reason to Believe" with Skyrms's "Blind Selection." Address the infinite regress objection directly (Lewis's "reason to believe" vs. psychological reality).
      *   *Section 2: Arbitrariness and Equilibrium Selection.* Show how Skyrms handles this via path dependence/basins of attraction. It matches Lewis on outcome, differs on mechanism.
      *   *Section 3: The Normativity Problem (The Core).* This needs careful handling. Lewis = Conditional Preference + Assurance. Skyrms = Stability + Sanctions. Does Skyrms lose the "ought"? Argue that Skyrms explains the *causal grip* of norms, while Lewis explains the *justificatory grip*.
      *   *Section 4: Competitors or Complements?* Argue for Complementarity. Etiology (Skyrms) vs. Constitution (Lewis).
      *   *Section 5: Recommendation for Seminar.* Suggest framing the discussion around "Explanation vs. Justification" and "Emergence vs. Maintenance."

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't undersell Lewis's response to the cognitive objection. Lewis talks about "reason to believe" based on salience, not actual infinite computation. I should mention that.
      *   *Correction:* I need to be careful with Skyrms. He doesn't deny agents have beliefs, but he shows you *don't need* CK for conventions to emerge. The question is whether the resulting state *counts* as a Lewisian convention.
      *   *Nuance on Normativity:* Distinguish between "prudential normativity" (don't drive on the left or you crash) and "social normativity" (don't drive on the left or we'll blame you). Skyrms is better at the former, Lewis at the latter. But Skyrms does model signaling and trust, which edges toward the latter.
      *   *Key Insight:* The "Normative Residue." If I violate a Skyrmsian convention, I am irrational (in the evolutionary sense) or unlucky. If I violate a Lewisian convention, I let you down. The *interpersonal* element is stronger in Lewis.

  7.  **Final Polish:** Check tone (academic but accessible). Ensure all parts of the prompt are answered. (Yes: Arbitrariness, Expectations, Normative Force, Workload, Competitors/Complements).

  8.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  This is an excellent pivot for a social ontology seminar. The tension between Lewis's rationalist, intentionalist account and Skyrms's naturalist, evolutionary account is one of the most fertile grounds in contemporary philosophy of social science. Your students' skepticism about Common Knowledge (CK) is the standard and correct entry point, but as you note, the deeper issue is whether removing CK removes the *normativity* that makes a convention a social phenomenon rather than a mere behavioral regularity.

  Here is a detailed comparison structured to help you frame the session, followed by an assessment of their explanatory division of labor and a verdict on their compatibility.

  ### 1. The Cognitive Gap: Infinite Hierarchies vs. Blind Dynamics

  **Lewis's Burden:**
  Your students are right to balk at the psychological realism of CK. Lewis anticipates this by distinguishing between *entertaining* an infinite hierarchy of beliefs and having a *reason to believe* that such a hierarchy holds. For Lewis, CK is a logical condition for the *definition* of convention, grounded in salient indicators (e.g., "we all saw the traffic light turn red"). However, even softened, this requires agents to represent the situation as one of mutual interdependence. It treats convention-followers as miniature game theorists.

  **Skyrms's Solution:**
  Skyrms (particularly in *Evolution of the Social Contract* and *Signals*) bypasses the cognitive hierarchy entirely. In replicator dynamics or simple reinforcement learning models, agents do not need to model others. They simply track payoffs. If strategy $A$ yields higher returns because others are playing $A$, the propensity to play $A$ increases.
  *   **The Gain:** This solves the cognitive overload problem. It explains how conventions can exist among animals, infants, or boundedly rational humans.
  *   **The Loss:** It risks turning "convention" into a label we apply from the outside to a stable equilibrium, rather than a status the agents themselves recognize.

  ### 2. Arbitrariness and Equilibrium Selection

  Does Skyrms capture Lewis's crucial condition of **arbitrariness**?

  *   **Lewis:** Arbitrariness is modal. There is another regularity $R'$ that *could* have served the same interest. We follow $R$ because we expect others to follow $R$.
  *   **Skyrms:** Arbitrariness is historical (path dependence). In signaling games, there are multiple stable equilibria (e.g., "stop means stop" vs. "stop means go"). Which one is selected depends on initial conditions or stochastic noise.
  *   **Comparison:** Skyrms successfully reproduces the arbitrariness. The system settles into one basin of attraction, but it could have settled into another. However, for Lewis, the *awareness* of the alternative is part of what makes the regularity arbitrary *for the agents*. For Skyrms, it is arbitrary only *for the observer*. The agents are simply locked in.

  ### 3. The Normative Residue: "Ought" vs. "Is"

  This is the crux of your seminar discussion. Does an evolved regularity carry **normative force**?

  **The Lewisian Norm:**
  For Lewis, the normativity is derived from **assurance**. I ought to conform because I know you expect me to, and I know you will be harmed (or we will both fail) if I don't. The "fault" in violating a convention is a failure of mutual reliance. It is interpersonal.
  *   *Normative Force:* "You let me down."
  *   *Source:* Mutual knowledge of conditional preferences.

  **The Skyrmsian Norm:**
  For Skyrms, normativity is often reduced to **stability** or **prudential rationality**. If you deviate from the evolved equilibrium, you get a lower payoff.
  *   *Normative Force:* "You played a losing strategy."
  *   *Source:* Selection pressure / Reinforcement history.

  **The Problem of Blame:**
  Can you be *faulted* for violating a Skyrmsian convention?
  *   If the convention is merely a coordination equilibrium sustained by payoffs (e.g., driving on the right), violating it is self-defeating. We might call you "irrational" or "clumsy," but is it a *social* violation?
  *   Skyrms does model **correlation** and **trust**, and he discusses how populations can evolve to punish deviators (meta-norms). If the population evolves a disposition to sanction those who deviate from the signaling equilibrium, then normative force re-enters the picture. But note: the force comes from the *threat of sanction*, not the *disappointment of expectation*.
  *   **Verdict:** Lewis captures the *reason-giving* character of norms (I follow because I recognize your claim on me). Skyrms captures the *causal grip* of norms (I follow because I am shaped to do so). Without CK, the "interpersonal obligation" aspect is attenuated. It becomes a regularity that *functions* normatively, but may not be *experienced* normatively by the agents.

  ### 4. Explanatory Division of Labor

  Which account is doing more work? It depends on the *explanandum*.

  1.  **Emergence (Etiology):** **Skyrms wins.** Lewis famously admits he has no theory of how conventions get started; he only analyzes what they *are* once established. His account is static. Skyrms provides the dynamics of emergence. He explains how we get from a state of no convention to a state of convention without a miraculous leap into Common Knowledge.
  2.  **Constitution (Ontology):** **Lewis wins.** If you ask, "What makes this regularity a *social* convention rather than a mere instinctual synchronization (like fireflies flashing)?", Lewis's appeal to mutual expectations is stronger. Skyrms's fireflies and Skyrms's humans look identical in the model (both are replicators). Lewis provides the criteria to distinguish social action from mere causal regularity.
  3.  **Normativity:** **Split.** Lewis explains the *internal* normativity (why agents feel bound). Skyrms explains the *external* normativity (why the group sustains the rule via sanctions/stability).

  ### 5. Competitors or Complements?

  They are best understood as **complementary**, addressing different phases of the social ontological lifecycle.

  *   **The Synthesis:** You can view Lewis's Common Knowledge not as a psychological precondition that must exist *ex nihilo*, but as the **reflective superstructure** that evolves on top of Skyrmsian regularities.
      *   *Phase 1 (Skyrms):* Through repeated interaction and reinforcement, a population converges on a regularity. Expectations are implicit in behavior.
      *   *Phase 2 (Lewis):* Once the regularity is established, reflective agents develop the concepts to represent it. They come to *know* that others know. The CK is the *result* of the convention's stability, not just its cause.
  *   **The Caveat:** If you combine them, you must concede that "full" Lewisian conventions (with full CK) are a high-end, reflective subset of the broader category of "evolved signaling systems." Most human conventions probably live in the middle: more than blind reinforcement, less than infinite hierarchies of belief.

  ### Recommendation for Discussion Questions

  To sharpen this for your students, I suggest framing the discussion around the distinction between **Explanation** (causes) and **Justification** (reasons).

  1.  **The Cognitive Objection:** "If Skyrms is right, does it matter that agents don't have Common Knowledge? If the behavioral outcome is identical, is the 'infinite hierarchy' objection just a psychological quibble, or does it point to a missing ontological ingredient?"
  2.  **The Normative Force:** "In Lewis's account, violating a convention lets others down. In Skyrms's account, violating a convention lowers your fitness/payoff. Can an evolutionary account recover the 'letting down' aspect, or does it reduce social norms to sophisticated selfishness?"
  3.  **The Emergence vs. Maintenance Distinction:** "Lewis explains what a convention *is*; Skyrms explains how it *happens*. Do we need both to have a complete social ontology? Can a regularity be a convention if it evolved blindly but is now sustained by Common Knowledge (or vice versa)?"
  4.  **The Firefly Test:** "Fireflies synchronize their flashing via evolutionary dynamics (similar to Skyrms's models). We don't call this a 'convention.' What exactly is missing? Is it Common Knowledge, or is it the *capacity* for Common Knowledge?"

  ### Summary Assessment

  **Does something get lost?**
  Yes. Without Common Knowledge (or something approximating mutual awareness), you lose the **interpersonal reason-giving force** of the norm. You retain the stability and the arbitrariness, but the convention becomes a causal trap rather than a mutual agreement.

  **Which does more work?**
  *   For **social ontology** (what constitutes the social world): **Lewis**. He defines the terms of the art.
  *   For **social science** (how the social world operates): **Skyrms**. He provides the mechanisms.

  **Final Verdict:**
  Treat them as **complementary**. Use Skyrms to dissolve the student's worry about the *origin* of CK (it evolves out of simpler interactions), but insist on Lewis to preserve the *normative status* of the convention (it binds us because we recognize it as binding, not just because we are conditioned to follow it). The "Normative Residue" you are looking for survives best in Lewis, but it is rendered plausible by Skyrms's demonstration that such states are naturalistically achievable.
