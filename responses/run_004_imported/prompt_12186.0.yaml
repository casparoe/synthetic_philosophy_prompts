answer: |-
  **Cambridge, 1884. A private room at the Society for Psychical Research, following a disappointing séance with a physical medium.**

  **STERLING:** (Pouring brandy) The table did not move, Henry. The curtains did not part. And the lady's toes were clearly doing the work of the spirits. Another three hours burned in the dark.

  **SIDGWICK:** We established that the phenomena were fraudulent. That is data. It narrows the field.

  **STERLING:** It narrows the field of conjuring tricks, perhaps. But I must ask again: what field are we actually hunting in? You treat this inquiry as a matter of scientific necessity. I contend it is a matter of theological desperation.

  **SIDGWICK:** I treat it as an empirical investigation into the limits of human consciousness.

  **STERLING:** Do not dissemble. I have read *The Methods*. I know where your philosophy bleeds. You believe that unless virtue and self-interest coincide in the long run, morality is irrational. You need an afterlife to balance the ledger. But tell me, Henry: if that medium *had* summoned a spirit, how does that close the gap?

  **SIDGWICK:** If consciousness survives the body, then the calculus of happiness extends beyond the grave. The duration of existence changes the sum.

  **STERLING:** It changes the duration, not the distribution. Suppose you prove, beyond doubt, that we survive. Suppose we find ourselves in a ghostly Cambridge tomorrow. What guarantees that the moral law holds there? Why should the afterlife be a court of justice rather than a continuation of chaos? A demon survives as readily as a saint. Evidence of survival is evidence of fact, not of value. You are trying to derive an *ought* from a ectoplasmic *is*.

  **SIDGWICK:** (Steepling his fingers) You mistake the nature of the sanction I seek. I do not require a spirit to preach Utilitarianism from the clouds. I require evidence that the universe is not fundamentally hostile to the moral impulse. If mind is merely a transient accident of matter, then the conflict between my good and the general good is final. Reason dictates egoism, for death cancels all debts. But if mind is fundamental—if it persists independent of neural decay—then the moral law may be as objective as the law of gravity.

  **STERLING:** But that is a leap. Even if mind persists, it may persist in a moral vacuum. You are looking for a cosmic magistrate, but the SPR can only deliver a cosmic survivor. You are smuggling a benevolent God in through the back door of a trance medium. Is that not wishful thinking disguised as rigor?

  **SIDGWICK:** It is not wishful thinking to test the conditions under which rational ethics becomes possible. Look at the alternative, Arthur. If I accept your skepticism, I must admit that the deepest convictions of my moral consciousness are ultimately groundless. I must act as if the general good matters, while knowing that reason offers me no ultimate justification for sacrificing my own. That is a contradiction I cannot live with. I cannot *assume* the universe is moral. But I refuse to assume it is neutral until I have exhausted every avenue of inquiry.

  **STERLING:** And if you exhaust them? If you sit in every dark room in England and find only fraud and physics?

  **SIDGWICK:** (Quietly) Then I shall have to live with the contradiction. But I will not invite it in prematurely. I will not declare the universe godless simply because the spirits remain silent. Silence is not evidence of absence. It is merely... silence. And until I know whether the silence is empty or merely waiting, I cannot say that duty is a delusion.

  **STERLING:** You risk making the Society a prayer meeting for atheists.

  **SIDGWICK:** Better that than a graveyard for ethics. If there is a bridge between self-interest and duty, it must be built on facts, not faith. Even if those facts are found in the dark.
