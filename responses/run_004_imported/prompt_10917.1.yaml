answer: |-
  First off, you are not crazy, and you are definitely not alone in this. You have independently rediscovered one of the oldest, stickiest problems in the history of philosophy. What you're describing is the conflict between **Determinism** (everything is caused by what came before) and **Moral Responsibility** (taking credit or blame).

  Your intuition about your brother's "quantum randomness" argument is spot-on. In philosophical circles, that is widely considered a failed defense of free will.

  Here is a walk-through of the logic, breaking down why your brother's argument fails, why your argument is strong, and yet why we still act like free will exists.

  ### 1. The Trap of Randomness (Why Quantum Mechanics Doesn't Help)
  Your brother tried to use quantum indeterminacy (the idea that subatomic particles behave randomly) as an escape hatch. His logic is: *If the universe isn't 100% predictable, then my brain isn't 100% determined, so I have room to choose.*

  Here is why that doesn't work, using the logic you already sensed:

  Imagine your brain is a decision-making machine.
  *   **Scenario A (Determinism):** You choose the gym because your genetics + environment + prior brain states caused that decision.
      *   *Problem:* You didn't choose the causes.
  *   **Scenario B (Randomness):** You choose the gym because a quantum particle in your neuron fired randomly, tipping the scale.
      *   *Problem:* If the decision was tipped by a random event, **you didn't make it.** Luck made it.

  If you act because of a random neural blip, that isn't "freedom"; that's a seizure or a glitch. To be responsible for an action, *you* must be the source of it. If the source is "random noise," you are no more the author of that action than you are the author of a lightning strike.

  So, you are correct: Adding randomness doesn't give you *control*; it just replaces a chain of causes with a roll of the dice. Neither gives you "credit."

  ### 2. The "You Can't Choose Yourself" Argument
  Your main argument was: *That choice to get up... came from whatever kind of person he happened to be in that exact moment, which again isn't something he picked either.*

  This is a famous line of reasoning often associated with the philosopher Galen Strawson, called **The Basic Argument**. It goes like this:

  1.  To be truly responsible for what you do, you must be responsible for the way you *are* (your character, your desires, your willpower).
  2.  If you didn't choose your character (genetics, parents, upbringing), you aren't truly responsible for what flows from it.
  3.  But to choose your character, you would need to have *already* had a character to make that choice with.
  4.  Therefore, you would need to have chosen your character *before* you had a character.
  5.  This is impossible. You cannot create yourself from nothing (*causa sui*).

  Your brother claims he "chose" to be disciplined. But *why* did he choose that? Because he valued discipline. *Why* did he value discipline? Because of how he was raised or how his brain is wired. He didn't choose the wiring that made the choice easy.

  If he had been born with a different brain chemistry where getting out of bed felt physically painful, he likely wouldn't have "chosen" differently. He would have stayed in bed. Since he didn't choose his brain chemistry, he didn't ultimately choose the action.

  ### 3. So, Is Your Brother Wrong? (The Compatibilist View)
  If the logic above holds up, it seems like no one is responsible for anything. This is the position of **Hard Incompatibilism** (which matches your current view).

  However, most philosophers and society at large operate on a different definition called **Compatibilism**. This is likely where your brother is living, even if he doesn't know the term.

  Compatibilists argue that we are using the wrong definition of "Free Will."
  *   **Metaphysical Freedom (What you want):** Being the ultimate, uncaused source of your actions. (Compatibilists admit this is impossible).
  *   **Practical Freedom (What they mean):** Acting according to your own desires without external coercion.

  **The Compatibilist Logic:**
  Even if your brother's desire to go to the gym was determined by genetics, *it was still his desire.* No one held a gun to his head. No one forced him. He acted in alignment with his own internal programming.

  For a Compatibilist, "Free Will" doesn't mean "I could have done otherwise in the exact same universe." It means "I did what I wanted to do, and if I had wanted to do otherwise, I could have."

  **Why this matters for credit/blame:**
  Society doesn't actually care about metaphysical freedom. We care about **predictability and safety.**
  *   If we praise your brother, it reinforces the behavior (for him and others watching).
  *   If we blame a criminal, it might deter them or remove them from society.

  From this view, taking "credit" isn't a statement about the magic of the soul; it's a social tool. Your brother feels pride because that feeling is part of the feedback loop that keeps him disciplined.

  ### 4. The Verdict on Your Argument
  You asked: *"Am I missing something obvious here, or is my brother just smuggling in a feeling of control that isn't really justified?"*

  **You are not missing anything obvious.** You have correctly identified that:
  1.  **Determinism** removes ultimate authorship (you are a product of prior causes).
  2.  **Randomness** removes control (you are a victim of chance).
  3.  Therefore, **Ultimate Moral Responsibility** (in a cosmic sense) is impossible.

  Your brother is indeed "smuggling in a feeling of control." He is conflating *effort* with *ultimate authorship*. It feels like he is choosing, and that feeling is real, but the *source* of that feeling is not something he created from scratch.

  ### 5. How to Live With This (Without Going Nihilistic)
  The scary part of your realization is: *If no one is responsible, does anything matter?*

  The practical solution is to separate **Ultimate Responsibility** from **Functional Responsibility**.

  *   **Ultimate Responsibility:** Did you create yourself? No. Do you deserve cosmic praise or eternal blame? No.
  *   **Functional Responsibility:** Are you the agent acting in the world? Yes. Do your actions have consequences? Yes.

  You can tell your brother: *"You didn't choose the hand you were dealt (genetics/upbringing), but you are the one playing the cards. You don't get cosmic credit for having a good hand, but you do get practical results for playing it well."*

  This keeps his motivation (which is good for him) without requiring him to believe in magic (which is logically flawed). It also helps you let go of the anger. If he didn't ultimately choose to be the "disciplined one" any more than you chose to be the "skeptical one," there's less reason to be frustrated by his judgment. He's just running his software.

  ### Summary
  1.  **Your logic is sound.** Tracing choices back to prior causes eliminates ultimate credit.
  2.  **His quantum defense fails.** Randomness is not freedom; it's just noise.
  3.  **The "Choice" is an illusion of authorship.** He chose based on who he was, but he didn't choose who he was.
  4.  **Responsibility is pragmatic, not metaphysical.** We hold people accountable to shape behavior, not because they are magical prime-movers of the universe.

  You haven't missed anything. You've just looked under the hood of the human experience and realized there's no driver in the seat, just a very complex engine running on autopilot. The trick is learning to drive the car anyway.
