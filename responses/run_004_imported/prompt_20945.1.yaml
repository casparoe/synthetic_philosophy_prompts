answer: |-
  **Title:** The Flicker and the Buffer: Assessing the Dilemma Defense Against Frankfurt-Style Cases

  **Introduction**

  The Principle of Alternative Possibilities (PAP) has long served as a cornerstone of incompatibilist theories of moral responsibility. It posits that an agent is morally responsible for an action only if they could have done otherwise. In 1969, Harry Frankfurt challenged this intuition with a thought experiment designed to show that an agent can be responsible even when alternative possibilities are eliminated by a counterfactual intervener. However, the dialectic shifted significantly with the "Dilemma Defense" advanced by David Widerker and Robert Kane. They argue that Frankfurt-style counterexamples (FSCs) are unstable: they either presuppose causal determinism (begging the question against libertarians) or they fail to eliminate all alternative possibilities (leaving a "flicker of freedom").

  This essay assesses whether the Dilemma Defense successfully defeats Frankfurt's argument against PAP. I will engage with John Martin Fischer's "flicker strategy," which argues that the remaining alternatives are not robust enough to ground responsibility, and Alfred Mele and David Robb's "buffer case," which attempts to construct an indeterministic scenario without a prior sign. I argue that while the Dilemma Defense effectively dismantles *canonical* sign-based FSCs, it fails to vindicate PAP. By shifting the focus from alternative sequences to the *actual sequence* of action, refined Frankfurt-style cases demonstrate that moral responsibility is a function of ownership and causal history, not metaphysical leeway. Therefore, the Dilemma Defense does not defeat the Frankfurt strategy; it merely necessitates a refinement that ultimately strengthens the case against PAP.

  **The Dilemma Defense: Sign and Determination**

  To understand the force of the Dilemma Defense, one must recognize that Frankfurt's original case relies on a "prior sign"—a physiological or psychological indicator that allows the counterfactual intervener (Black) to predict the agent's (Jones's) decision before it occurs. Widerker and Kane argue that in an indeterministic world (the only world where PAP is contested by libertarians), the relationship between this sign and the decision creates a dilemma.

  On the first horn, if the prior sign causally determines Jones's decision, then the case presupposes causal determinism. For a libertarian who believes determinism is incompatible with responsibility, this begs the question. The case would only show that responsibility is compatible with determinism, not that it is compatible with the *absence of alternatives* in an indeterministic context. On the second horn, if the sign does not causally determine the decision, then the connection between sign and action is fallible. If it is fallible, Jones retains the power to refrain from producing the sign or to act contrary to it. Consequently, Jones retains an alternative possibility—a "flicker of freedom." If this flicker exists, PAP is not falsified; it is merely obscured.

  This objection is potent because it targets the coherence of FSCs in the very context where they are needed most: an indeterministic universe where libertarians claim responsibility requires robust alternative possibilities. If every FSC collapses into one of these two horns, Frankfurt's argument fails to move the dialectic.

  **Fischer and the Flicker Strategy**

  John Martin Fischer's response to the second horn of the dilemma is to concede that alternative possibilities may remain but to deny their moral significance. This is the "flicker strategy." Fischer argues that not all alternative possibilities are created equal. For PAP to hold, the alternative possibility must be *robust*—it must be an alternative in which the agent is not morally responsible (typically, a scenario where they do otherwise).

  In a standard FSC where the sign is fallible, the alternative possibility available to Jones is not "Jones decides otherwise and is praiseworthy/blameworthy." Rather, the alternative is "Jones begins to decide otherwise, triggering Black's intervention, and Jones decides as originally intended anyway." Fischer contends that this alternative sequence is not relevant to grounding moral responsibility. The presence of a mechanism that ensures the same outcome regardless of the agent's initial inclination does not provide the agent with a genuine opportunity to avoid responsibility.

  Fischer's insight shifts the locus of responsibility from *leeway* (the ability to do otherwise) to *actual sequence* (the specific causal history of the action performed). If Jones decides on his own, without Black's intervention, the source of the action is Jones's own reasons-responsive mechanism. The fact that Black *would have* intervened had Jones wavered is a fact about alternative sequences, which are irrelevant to the actual sequence.

  Critics of Fischer argue that this moves the goalposts. If *any* alternative possibility exists, PAP is technically satisfied, so Frankfurt hasn't falsified it. However, this misses the philosophical point. The intuition pumping behind PAP is that an agent cannot be blameworthy if they *could not have avoided* the blameworthy action. If the only available alternative is a futile gesture that leads to the exact same blameworthy action via intervention, the agent effectively could not have avoided the blame. Thus, Fischer successfully neutralizes the second horn by arguing that the "flicker" is too metaphysically flimsy to support the weight of the incompatibilist's intuition.

  **Mele and Robb: The Buffer Case**

  While Fischer addresses the significance of flickers, Alfred Mele and David Robb attempt to eliminate the flicker entirely by constructing a case that avoids the first horn (determinism) without relying on a prior sign. Their "buffer case" posits an agent, Bob, who faces a decision. Bob's decision-making process is indeterministic. However, there is a "buffer"—a neural mechanism that prevents Bob from deciding to perform a specific action (say, stealing) unless a specific threshold of neural activity is met.

  In their model, there are two processes: Process 1 (deterministic, leading to theft) and Process 2 (indeterministic, leading to refraining). A "blocker" prevents Process 2 from completing if Process 1 is initiated. Crucially, there is no *prior sign* that predicts the choice before the choice is made. The indeterminism is located *within* the decision process itself. If Bob decides to steal, he does so via Process 1. He could have initiated Process 2, but the buffer ensures that initiating Process 2 does not result in a different outcome if Process 1 is already underway.

  Mele and Robb argue this avoids Widerker's dilemma. It does not presuppose determinism because the initiation of the decision process is indeterministic. Yet, it seemingly eliminates robust APs because the buffer ensures that once the decision to steal is on track, no alternative outcome is possible.

  This model faces objections, notably from Carl Ginet, who argues that if Bob can initiate Process 2, he retains the power to do otherwise, preserving PAP. However, Mele and Robb counter that the ability to *initiate* a process that is guaranteed to fail to produce a different action is not a robust alternative possibility in the sense required for moral responsibility. If the outcome is fixed by the buffer once the actual sequence begins, the agent's responsibility rests on the actual sequence, not the blocked alternative path. By removing the "prior sign," Mele and Robb evade the first horn of the dilemma (question-begging determinism) while relying on Fischer's logic to defang the second horn (the residual ability to initiate a blocked process).

  **Assessment and Verdict**

  Does the Dilemma Defense defeat Frankfurt's argument? The answer depends on whether we view Frankfurt's project as relying on the specific mechanics of his original 1969 case or the broader philosophical strategy of separating responsibility from alternative possibilities.

  The Dilemma Defense successfully demonstrates that *sign-based* FSCs are flawed. Widerker and Kane are correct that if a prior sign exists in an indeterministic world, it must be either determined or fallible. If the literature stopped at canonical Frankfurt cases, the Dilemma Defense would be victorious. However, the dialectic has evolved. Fischer's actual-sequence approach and Mele and Robb's buffer cases represent a refinement that absorbs the force of the Dilemma Defense without capitulating to PAP.

  The fundamental weakness of the Dilemma Defense is that it implicitly assumes the truth of PAP to generate the dilemma. On the first horn, it claims the case begs the question against libertarians. But Frankfurt's goal is precisely to challenge the libertarian assumption that determinism precludes responsibility. To demand that an FSC work without *any* deterministic elements is to demand that it satisfy incompatibilist criteria to prove compatibilism, which is an unreasonable burden.

  On the second horn, the Dilemma Defense assumes that *any* alternative possibility, no matter how trivial or non-robust, sustains PAP. This is the crux of the dispute. If Fischer is correct that moral responsibility is grounded in the actual sequence (ownership of the action) rather than the alternative sequence (leeway), then the existence of a "flicker" is irrelevant. The Dilemma Defense fails because it conflates the *presence* of an alternative possibility with the *relevance* of that possibility. A "flicker" that does not allow the agent to avoid the action or the associated blame does not satisfy the intuitive motivation behind PAP.

  Furthermore, Mele and Robb's buffer cases show that it is conceptually possible to construct scenarios where the agent is the sole source of the action (satisfying sourcehood conditions) without the presence of a robust alternative possibility. While one might argue that the ability to initiate the blocked process is still an AP, it is an AP that makes no difference to the outcome or the blame. If responsibility tracks the actual causal history, and that history is free of coercion and manipulation (as in the buffer case where the agent decides on their own), then the agent is responsible.

  Therefore, the Dilemma Defense does not defeat the Frankfurt strategy; it merely forces it to mature. It compels proponents of the actual-sequence view to clarify *why* alternative possibilities matter. In doing so, it reveals that what matters is not the *ability to do otherwise*, but the *way in which the action was done*.

  **Conclusion**

  The Dilemma Defense is a formidable objection that exposes the structural weaknesses of early Frankfurt-style counterexamples. It correctly identifies that prior signs create a vulnerability to charges of determinism or residual freedom. However, it does not defeat the core argument against PAP. By integrating Fischer's distinction between robust and non-robust alternatives with Mele and Robb's structural innovations, the Frankfurt strategy survives. The verdict is that refined Frankfurt-style cases succeed in showing that moral responsibility does not require alternative possibilities. The Dilemma Defense fails because it relies on a conception of responsibility that prioritizes metaphysical leeway over actual sourcehood. Once we recognize that responsibility is anchored in the actual sequence of events, the "flickers" highlighted by Widerker and Kane vanish into metaphysical insignificance. PAP, therefore, remains untenable.
