          *   *Solution:* Be honest. Admit that we are passing a *retroactive* law to punish her because it is morally necessary, even if it violates the principle of *nullum crimen sine lege* (no crime without law). Don't hide behind legal fiction.
          *   *Key Concern:* Moral honesty and clarity about the sacrifice of legal principles (like non-retroactivity) for moral ends.
      *   **Lon Fuller (Natural Law/Procedural Naturalism):**
          *   *Core Thesis:* Law has an "inner morality" (procedural requirements like generality, publicity, non-retroactivity, consistency, etc.). If a regime systematically violates these, it fails to produce "law."
          *   *On the Informer:* The Nazi regime was so lawless (secret laws, arbitrary enforcement, disregard for procedure) that its statutes weren't truly "law." Therefore, the wife wasn't acting under "law."
