      *   Total Tuesdays: 50.
      *   If you are told it's Monday, you are in the set of 100 Mondays.
      *   Of those 100 Mondays, 50 are Heads, 50 are Tails.
      *   Wait... that leads to 1/2. That's the *Thirder* calculation on Monday.
      *   *Correction:* Lewis Halfer does *not* agree with the frequency count of awakenings as the probability basis. Lewis insists the *coin* probability is primary.
      *   Lewis's Probability Space:
          *   $P(Heads) = 1/2$.
          *   $P(Tails) = 1/2$.
