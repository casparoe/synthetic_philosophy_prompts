      *   **Core Argument 4: Betting/Payoffs (Rebutting Priya's Pragmatic Argument).** Priya used betting to argue for 1/3. Show how Lewis Halfers handle betting (usually by arguing the bet is offered twice on Tails, so the *decision* changes, not the *credence*). Or, argue that on Monday specifically, the betting odds *should* be 2/3 if the bet is only valid for that day.
