      *   Check: $P(Mon) = P(H-Mon) + P(T-Mon) = 1/2 + 1/4 = 3/4$.
      *   Conditionalize: $P(H | Mon) = P(H-Mon) / P(Mon) = (1/2) / (3/4) = 2/3$.
      *   *Defense:* This isn't magic. It's just math following from the initial 1/2 assignment. The question is: Is the initial 1/2 assignment defensible? Yes, because the coin is fair.
      *   *Why 2/3 on Monday isn't crazy:* If it's Monday, the Tails-Tuesday option is eliminated. In the Tails world, there was a 50% chance (from the perspective of the awakening distribution) that you would have been in Tuesday. Since you aren't, Tails becomes less likely relative to Heads (where Monday was the *only* option).

