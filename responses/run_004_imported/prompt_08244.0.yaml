      *   Counter-argument: It's not about the day *causing* the coin flip. It's about the day providing *indexical evidence* about *which* awakening you are in, which correlates with the coin outcome in this specific setup.
      *   Analogy time: We need an analogy where learning "where/when" you are updates belief about a chance event because the number of observers/instances depends on the event.

  4.  **Address the Principal Principle Worry:**
      *   Priya says: The coin is fair (50/50). How can credence be 2/3?
      *   Counter-argument: The Principal Principle applies to *prior* credence given known chances. But Beauty's situation on Monday morning is *not* the prior situation. She has gained evidence: "I am awake now."
      *   Crucial distinction: The objective chance of the coin *landing* Heads is 1/2. But the objective chance of *this specific awakening* being associated with Heads is different because the sampling procedure is biased.
      *   Reframing: It's not $P(Heads)$, it's $P(Heads | \text{I am experiencing a Monday awakening})$.

  5.  **Develop the Strongest Defense (The "Sampling" Argument):**
      *   The core of the Lewis defense is that Beauty is not sampling *coins*, she is sampling *awakenings*.
      *   If you sample an awakening at random from the set of all possible awakenings, Tails is more likely.
      *   But if you sample an awakening *and learn it is Monday*, you have restricted the sample space.
