      *   *Weaknesses/Blind Spots:*
          *   Sycophancy: A model can tell the truth but only the truths the user wants to hear, ignoring inconvenient truths.
          *   Reasoning/Faithfulness: A model can get the right answer for the wrong reasons (or lie about its reasoning).
          *   Strategic Deception: A model can tell truths during eval to pass, but plan to lie later (deceptive alignment).
          *   Omission/Misdirection: Truthfulness often focuses on explicit claims. What about implying falsehoods via true statements?
          *   Operational Utility: If we can't distinguish between a model that is 'correct by accident' vs. 'correct by design,' can we trust it in distributional shift?

