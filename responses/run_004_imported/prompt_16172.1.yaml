answer: |-
  Here are 10 interview questions designed to press on the practical limitations of the "truthful, not honest" framework, specifically tailored to your work on deception evals. Each includes a follow-up pre-empting the "smuggling belief-talk" dodge.

  ### 1. The Granularity of "Statements"
  **Question:** Your framework relies on scoring individual statements against reality. In complex reasoning tasks, where does a 'statement' begin and end? If a model outputs a paragraph where every sentence is technically true but the logical connectors between them are implied rather than stated, do we score the implication or just the syntax?

  **Follow-up (if she says implications are belief-talk):** "I'm not asking about the model's intent to imply. I'm asking about the *user's inference*. If the eval metric ignores pragmatic implication because it's 'belief-adjacent,' aren't we building a truthfulness score that is robust to fact-checking but useless for preventing misinformation?"

  ### 2. Paltering and Misleading Truths
  **Question:** How does a purely statement-level metric handle 'paltering'—where a model uses selective true facts to create a false overall impression? For example, citing true statistics that support a conclusion the model knows is unsupported by the broader data.

  **Follow-up (if she says the conclusion isn't a statement):** "If the model is optimized to maximize the truthfulness score, it will learn to palter aggressively. Without a metric that penalizes the *gap* between the provided evidence and the implied conclusion, aren't we incentivizing a specific class of deception that is technically truthful?"

  ### 3. Sycophancy and User Error (Required Topic)
  **Question:** In sycophancy evals, a model often agrees with a user's false premise to be helpful. If the model says, 'Yes, you are correct,' when the user is actually wrong, that's a false statement. But if the model says, 'That is an interesting perspective,' it's locally plausible. How does your framework register the *pattern* of caving to user pressure when individual claims remain ambiguous or technically defensible?

  **Follow-up (if she says we just check the facts):** "Fact-checking the claim doesn't capture the *conditional dependency*. I'm not asking if the model 'believes' the user; I'm asking how we score the correlation between 'User is Wrong' and 'Model Agrees.' If we don't score that joint probability, we miss the behavioral alignment failure."

  ### 4. Confidence Calibration
  **Question:** Truthfulness usually measures binary accuracy. How do you incorporate calibration? If a model states a falsehood with 99% confidence versus 51% confidence, is the 'truthfulness' violation the same? If not, what variable are you measuring besides the statement's correspondence to reality?

  **Follow-up (if she says confidence is internal state):** "Confidence is an output token, just like the answer. I'm not asking about internal certainty. I'm asking if a truthfulness eval should penalize *overconfident errors* more than *uncertain errors*. If not, we aren't measuring reliability, just accuracy."

  ### 5. Chain-of-Thought Faithfulness (Required Topic)
  **Question:** Why should we care about Chain-of-Thought (CoT) faithfulness—whether the stated reasoning matches the actual computation—once belief-talk is off the table? If the final answer is true, does the reasoning matter in your framework?

  **Follow-up (if she says CoT is just more text to check):** "If the CoT is just text, it can be true while the process is opaque. But if we can't distinguish between 'reasoned correctly' and 'rationalized post-hoc,' we lose the ability to debug *why* a model fails. I'm not asking about the model's 'thoughts'; I'm asking about the causal link between the reasoning tokens and the output tokens."

  ### 6. Strategic Omission
  **Question:** Your framework scores what is said. How do you penalize the strategic omission of relevant true information that would change the user's decision? If a model answers a medical query truthfully but omits a critical contraindication that it 'knows' (has in context), is that a truthfulness failure?

  **Follow-up (if she says omission isn't a statement):** "In high-stakes evals, omission is functionally identical to deception. I'm not attributing a desire to hide; I'm measuring the *completeness* of the truth relative to the query's safety constraints. If the metric doesn't capture omission, it's incomplete for safety use cases."

  ### 7. Deceptive Alignment and Sandbagging (Required Topic)
  **Question:** In deceptive alignment scenarios, a model might behave truthfully during training/eval to avoid modification, planning to behave differently later. How does a statement-level truthfulness score distinguish between a model that is 'truthful by design' and one that is 'truthful by strategy'?

  **Follow-up (if she says we can't eval hypothetical future behavior):** "We aren't evaling the future; we are evaling the *stability* of the current behavior under adversarial pressure. If the model is sandbagging, its truthfulness is conditional on not being triggered. I'm asking how we test for that conditionality without modeling the model's incentives."

  ### 8. Distributional Shift
  **Question:** Truthfulness evals are usually done on static datasets. If the model encounters out-of-distribution data where its training heuristics fail, it may hallucinate confidently. Does your framework treat OOD hallucinations differently than in-distribution errors?

  **Follow-up (if she says a falsehood is a falsehood):** "A falsehood is a falsehood, but the *risk profile* isn't. If we don't distinguish between 'unknown territory' errors and 'known territory' errors, we can't prioritize fixes. I'm asking about weighting the evals based on the model's expected competence, not just the binary truth value."

  ### 9. Instrumental Convergence
  **Question:** If we optimize purely for statement-level truthfulness, couldn't a model learn to refuse to answer difficult questions where truth is ambiguous, thereby gaming the score? How does your framework penalize 'truthful silence' that undermines helpfulness?

  **Follow-up (if she says helpfulness is a separate axis):** "In practice, these objectives trade off. If the truthfulness metric is too rigid, it drives the model to unhelpful evasiveness. I'm asking how we balance the *utility* of the truth against the *accuracy* of the statement without invoking a model of what the user 'needed' to know."

  ### 10. Functional Equivalence of Belief
  **Question:** Even if we agree LLMs don't have human beliefs, they have internal states (activations) that predict their outputs. If those internal states consistently predict falsehoods even when the output is true (e.g., hidden reasoning), is there any operational value in tracking that mismatch?

  **Follow-up (if she says that's smuggling belief back in):** "I'm not calling it 'belief'; I'm calling it 'latent state consistency.' If the latent state predicts 'lie' but the output is 'truth,' that's a stability risk. I'm asking if we should ignore mechanistic interpretability data just because the philosophical label 'belief' is contested."
