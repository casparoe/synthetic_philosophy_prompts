  5.  **Final Polish:**
      *   Make sure to distinguish between the *math* (same) and the *interpretation* (time vs. agents).
      *   Ensure the advice is feasible for 8 students (not too much math during the meeting).
      *   Address the "risk-averse" part: Yes, it avoids the risk of members leaving.

  6.  **Self-Correction during drafting:** I initially thought about suggesting Quadratic Voting. But QV is about public goods funding, not necessarily splitting a fixed budget among discrete events. Nash Bargaining is more direct for a fixed pie. I should emphasize that Nash Bargaining requires *cardinal* utilities (how much do you like it?), not *ordinal* (I like A more than B). This is a big process change.

