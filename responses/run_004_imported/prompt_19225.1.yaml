prompt: |-
  I've got a metaphysician coming on my little philosophy-of-science podcast next month who has built her whole career defending the Humean line on laws of nature -- the Lewis-style "best system" picture, where a law just is whatever comes out as an axiom of the true deductive systematization of all the particular facts that best trades off simplicity against strength (plus "fit," once objective chance gets thrown into the mix). Last time I had a Humean on the show I let her basically just restate Lewis for half an hour and got mocked for it in the department group chat, so this time around I want questions with actual teeth. Could you draft me eight to ten interview questions, each with a follow-up keyed to whatever answer she's most likely to give, that push on the real soft spots in the view instead of inviting a recap?

  At minimum I want one question on the worry that if laws are just a redescription of the mosaic of particular fact, it's unclear how they can explain or "govern" those very facts rather than merely summarizing them after the fact; one on the "undermining futures" headache for her account of objective chance and how that's supposed to sit with the Principal Principle; one that presses on whether her appeal to "natural" properties -- needed to fix which systematization even counts as simplest -- is quietly smuggling in some non-Humean ingredient (the quidditism worry, basically); and one built around the objection that quantum entanglement shows the world isn't seperable into a mosaic of local matters of particular fact to begin with, which, if right, undercuts Humean Supervenience before you even get to the best-system story about laws. Throw in a couple more if you spot a good angle I've missed, but please don't let her wriggle out of any of these with an answer that's really just a paraphrase of the postscript to "A Subjectivist's Guide to Objective Chance."
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Guest:** A metaphysician defending Humean Supervenience (HS) / Best System Analysis (BSA) of laws (Lewis-style).
      *   **Context:** Philosophy-of-science podcast.
      *   **Host's Goal:** Avoid letting the guest just restate Lewis (as happened last time). Wants questions with "teeth" that target soft spots.
      *   **Requirements:** 8-10 questions, each with a specific follow-up based on the likely answer.
      *   **Mandatory Topics:**
          1.  Explanation/Governance (Laws summarizing vs. explaining facts).
          2.  Undermining Futures & Principal Principle (Chance).
          3.  Natural Properties (Smuggling in non-Humean ingredients/Quidditism).
          4.  Quantum Entanglement/Non-separability (Threat to the Mosaic itself).
      *   **Tone:** Sharp, knowledgeable, preventing evasion/paraphrasing of standard Lewisian defenses.

  2.  **Deconstruct the Humean/BSA Position & Its Vulnerabilities:**
      *   *Core Claim:* Laws supervene on the "Humean Mosaic" (spatiotemporal distribution of local qualities). Laws are axioms of the system that best balances simplicity and strength.
      *   *Vulnerability 1: Explanation.* If laws depend on facts, how can they explain facts? (Circularity/Direction of fit).
      *   *Vulnerability 2: Chance.* If chances are frequencies in the mosaic, future frequencies can undermine current chance assignments. Lewis admitted this was a bug. How do modern Humeans fix it without abandoning the core view?
      *   *Vulnerability 3: Natural Properties.* To measure "simplicity," you need a privileged language (natural properties). Where do these come from? If they aren't Humean, HS fails. If they are, is it circular?
      *   *Vulnerability 4: Quantum Mechanics.* Entanglement suggests holism. The state of the whole isn't determined by local states. This attacks the "Mosaic" premise directly.
      *   *Vulnerability 5: Counterfactuals/Modality.* Humeans struggle with robust counterfactual support.
      *   *Vulnerability 6: Scientific Practice.* Do scientists actually treat laws as summaries? Or as constraints?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1 (Explanation/Governance):* Need to hit the "circularity" hard.
          *   *Draft:* How do laws explain facts if they depend on facts?
          *   *Refinement:* Make it about the *direction* of explanation. Humeans often say "systematization explains." Push back: Is that just epistemic?
          *   *Follow-up:* If she says "it's pragmatic," ask why science treats laws as ontologically robust.

      *   *Question 2 (Undermining/Chance):* This is technical. Need to mention the Principal Principle (PP).
          *   *Draft:* What about undermining futures?
          *   *Refinement:* Lewis thought PP + BSA were inconsistent. Did you fix it? If you modify PP, aren't you changing the concept of chance?
          *   *Follow-up:* If she appeals to a "revised PP," ask if that revised principle still captures our pre-theoretic notion of chance guiding credence.

      *   *Question 3 (Natural Properties):* The "cheat code" worry.
          *   *Draft:* Where do natural properties come from?
          *   *Refinement:* Simplicity is language-relative. You need a privileged vocabulary. If that vocabulary tracks "real resemblance," isn't that non-Humean?
          *   *Follow-up:* If she says "science tells us," ask if science is discovering the mosaic or presupposing the laws to find the properties.

      *   *Question 4 (Quantum Entanglement):* The physics objection.
          *   *Draft:* Quantum mechanics says no local facts.
          *   *Refinement:* Bell inequalities/Entanglement suggest the whole isn't built from local parts. If the Mosaic doesn't exist, HS is dead. Do you deny QM or redefine separability?
          *   *Follow-up:* If she redefines separability (e.g., wavefunction as property of spacetime points), ask if that's ad hoc to save the metaphysics.

      *   *Question 5 (Counterfactuals):* A good extra angle.
          *   *Draft:* How do you handle counterfactuals?
          *   *Refinement:* Humean laws support counterfactuals. But if laws supervene on actual facts, how do they tell us about *non-actual* scenarios?
          *   *Follow-up:* Push on the "closest world" analysis relying on laws which rely on the actual world.

      *   *Question 6 (Scientific Practice/Realism):* Another extra angle.
          *   *Draft:* Do scientists agree with you?
          *   *Refinement:* Scientists use laws to *predict* and *intervene*. If laws are just summaries, why are they so good at guiding intervention in new contexts?
          *   *Follow-up:* Distinguish between predictive success and ontological status.

      *   *Question 7 (Simplicity/Strength Trade-off):* Internal coherence.
          *   *Draft:* How do you measure simplicity?
          *   *Refinement:* Simplicity is subjective/anthropocentric. Are laws mind-dependent?
          *   *Follow-up:* If yes, realism is threatened. If no, what is the objective metric?

      *   *Question 8 (Temporal Asymmetry):* Good for physics/philosophy overlap.
          *   *Draft:* What about time?
          *   *Refinement:* The mosaic is 4D. Why do laws look dynamic/forward-looking?
          *   *Follow-up:* Is the "governing" feel just an illusion of our temporal perspective?

      *   *Question 9 (Meta-Laws):* Deep cut.
          *   *Draft:* What about laws of laws?
          *   *Refinement:* Symmetry principles constrain laws. Are they in the Best System too?
          *   *Follow-up:* If so, does the regress stop?

      *   *Question 10 (The "So What?" Question):* Closing.
          *   *Draft:* Why does this matter?
          *   *Refinement:* If Humeanism is true, what changes in scientific methodology?
          *   *Follow-up:* If nothing changes, is it just verbal?

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Follow-ups included? Yes. Mandatory topics covered? Yes (Explanation, Chance, Natural Props, QM). Tone sharp? Yes.
      *   *Self-Correction on Follow-ups:* Ensure the follow-ups anticipate the *standard* Humean dodge (e.g., "It's pragmatic," "We revise the principle," "Science decides"). The prompt specifically asks to prevent paraphrasing Lewis's postscript.
      *   *Polishing:* Make the questions sound like a podcast host speaking to a peer, not a student asking a professor. Use specific terminology (Best System, Mosaic, Principal Principle, Separability).

  5.  **Final Polish:** (Mental check of the generated output)
      *   Q1: Explanation (The "Circularity" Objection).
      *   Q2: Chance (Undermining/PP).
      *   Q3: Natural Properties (The "Cheat" Objection).
      *   Q4: QM (Non-separability).
      *   Q5: Counterfactuals (Modal Force).
      *   Q6: Anthropocentrism (Simplicity).
      *   Q7: Scientific Practice (Intervention).
      *   Q8: Meta-Laws (Symmetries).
      *   *Wait, I need to ensure the follow-ups are specific.* I will write them as "If she says X, ask Y."
      *   *Check:* Did I cover the "quidditism worry" on natural properties? Yes, need to ensure that's explicit in Q3.
      *   *Check:* Did I cover "governance"? Yes, Q1.
      *   *Check:* Did I cover "undermining"? Yes, Q2.
      *   *Check:* Did I cover "entanglement"? Yes, Q4.

      *Let's finalize the list.* I'll aim for high-impact questions that force a choice between modifying the view or biting a hard bullet.

      *(Self-Correction during drafting Q3)*: Make sure to mention that if natural properties are primitive, HS might collapse into Armstrong-style necessitation.
      *(Self-Correction during drafting Q2)*: Ensure the distinction between Lewis's admission of defeat and modern "Humean-friendly" revisions of the PP is clear.

      *Okay, ready to generate.*
answer: |-
  Here are ten interview questions designed to press the specific vulnerabilities of the Humean Best System Analysis (BSA), complete with follow-ups tailored to block standard Lewisian evasions.

  ### 1. The Explanation/Governance Objection
  **Question:** "The classic objection to Humeanism is that it gets the direction of fit backwards. If laws are just the axioms of the best systematization of the particular facts in the 'mosaic,' then the facts ontologically ground the laws. But in scientific practice, we treat laws as *explaining* the facts. If the laws are merely a redescription of the mosaic, aren't you forced to say that the mosaic explains itself? How can a summary explain the very data it summarizes?"

  **Follow-up:** "If you reply that this is just a pragmatic, epistemic kind of explanation rather than an ontological one, I want to press you on that distinction. When a physicist uses a conservation law to predict a particle's behavior in a *new* experimental setup, they aren't treating that law as a summary of past data; they're treating it as a constraint on what is physically possible. If your view can't accommodate that modal force without paraphrase, aren't you essentially changing the subject on what scientists mean by 'law'?"

  ### 2. The Undermining Future & Principal Principle
  **Question:** "Lewis famously admitted that the Best System Analysis of objective chance is inconsistent with his own Principal Principle (PP) because of 'undermining futures'—where the actual future frequencies could turn out to make the current chance assignment false. Many modern Humeans propose a 'revised' Principal Principle to fix this. But doesn't modifying the PP to fit the metaphysics risk losing the very link between chance and rational credence that made the concept of objective chance useful in the first place?"

  **Follow-up:** "Suppose you argue that the revised PP still guides credence adequately. I'd ask: doesn't that revision implicitly acknowledge that 'chance' in the BSA isn't tracking the same normative concept of chance we use in decision theory? If the 'chance' derived from the Best System doesn't compel belief the way the original PP suggested, in what robust sense is it still *objective* chance, rather than just idealized frequency?"

  ### 3. Natural Properties & The "Cheat Code" Worry
  **Question:** "To run the Best System analysis, you need to measure 'simplicity,' but simplicity is language-relative. To avoid triviality, Lewisians posit a privileged vocabulary of 'natural properties.' But where do these come from? If they are just another part of the Humean mosaic, how do we identify them without already presupposing the laws? And if they are primitive, aren't you smuggling in a non-Humean, quasi-Aristotelian ingredient that does the heavy lifting while the 'Best System' story takes the credit?"

  **Follow-up:** "If you insist that science discovers the natural properties, isn't that circular? Scientists identify properties like *mass* or *charge* by how they behave according to the laws. If the laws are supposed to emerge from the systematization of those properties, but we need the laws to identify the properties, haven't you created a vicious circle? How do you break in without assuming some non-Humean 'carving at the joints'?"

  ### 4. Quantum Entanglement & Separability
  **Question:** "Humean Supervenience rests on the claim that the world is a mosaic of local matters of particular fact—separable points in spacetime. But quantum entanglement, specifically Bell inequality violations, suggests the state of a composite system is not determined by the intrinsic states of its parts. If the physical world isn't separable, the 'mosaic' doesn't exist. Do you deny the standard interpretation of QM, or do you redefine 'local fact' so broadly that Humean Supervenience becomes trivial?"

  **Follow-up:** "If you opt for the strategy of treating the wavefunction as a property of spacetime points to save separability, aren't you making that move solely to preserve the metaphysics rather than because the physics demands it? Given that the wavefunction lives in high-dimensional configuration space, isn't forcing it into 3D spacetime points an ad hoc maneuver to save the Humean base from empirical falsification?"

  ### 5. Counterfactuals & Modal Robustness
  **Question:** "A key job of laws is to support counterfactuals: 'If I had struck this match, it would have lit.' For the Humean, the truth of that counterfactual depends on the Best System of the *actual* world. But if the antecedent is false, the mosaic is different. If the mosaic is different, the Best System might be different. So, how can the actual Best System validate counterfactuals about a world where the Best System itself might have changed?"

  **Follow-up:** "Lewis handles this with similarity metrics between possible worlds, but that relies on laws being fixed across worlds to measure similarity. If you say laws supervene on the actual mosaic, you seem to lose the leverage to evaluate non-actual scenarios. Are you forced to admit that, on your view, counterfactuals are ultimately less objective than the particular facts, despite science treating them as robustly true?"

  ### 6. Anthropocentrism & The Simplicity Metric
  **Question:** "The 'Best' System is chosen based on a trade-off between simplicity and strength. But simplicity is arguably anthropocentric—it depends on our cognitive architecture and what *we* find easy to compress. Does this make the laws of nature mind-dependent? If an alien civilization with different cognitive constraints systematized the same mosaic, could they legitimately arrive at a different set of 'laws'?"

  **Follow-up:** "If you say 'yes, laws are relative to cognitive agents,' you seem to abandon realism about laws. If you say 'no, there is an objective simplicity,' you owe us a metric that isn't tied to human psychology. Given that Kolmogorov complexity is uncomputable and language-relative, what is this objective metric grounded in, if not the very minds doing the systematizing?"

  ### 7. Scientific Intervention & Manipulation
  **Question:** "In experimental science, laws are used as tools for intervention. We assume that if we manipulate variable X, law L ensures variable Y changes. This suggests laws have a productive or generative role. If laws are just passive summaries of the total history of the universe, why are they so exceptionally reliable as guides for *local* manipulation? Why should a global summary license local causal inference?"

  **Follow-up:** "A common Humean reply is that the systematization is just so good that it *works*, even if it doesn't govern. But isn't that indistinguishable from saying the view is empirically adequate but metaphysically empty? If the 'governing' intuition is an illusion, why is it a persistent, inescapable illusion for every practicing physicist? Does your metaphysics explain that persistence, or does it just dismiss it?"

  ### 8. Meta-Laws & Symmetry Principles
  **Question:** "Modern physics places huge weight on symmetry principles and meta-laws (like gauge invariance) that constrain what first-order laws can look like. In the Best System view, are these meta-laws just more axioms in the system? If so, don't they create a regress? If not, where do they sit in the ontology, and how do they constrain the mosaic if they aren't themselves derived from it?"

  **Follow-up:** "If you argue that symmetry principles are just particularly strong/simple axioms, you miss that they often *select* the dynamics rather than summarize them. They seem to have priority over the particular facts. If your view has to treat them as just another summary statistic, aren't you failing to capture the hierarchical structure of modern physical theory?"

  ### 9. The "Loose" vs. "Strict" Mosaic
  **Question:** "Some Humeans have tried to accommodate non-separability by expanding the 'mosaic' to include global facts, not just local ones. But if you allow global facts into the supervenience base, aren't you effectively abandoning Humean Supervenience? The whole point of the view was that everything supervenes on *local* qualities. If you let the whole determine the parts, haven't you conceded the anti-Humean point?"

  **Follow-up:** "If you deny that this abandons the view and call it 'Humeanism 2.0,' I'd ask: what work is the label 'Humean' doing at that point? If the supervenience base is no longer local and separable, you've removed the primary motivation for the view, which was to avoid holistic or necessitarian metaphysics. Are you keeping the name just for brand recognition?"

  ### 10. The "So What?" Challenge
  **Question:** "Let's step back. If Humeanism is true, what changes in scientific methodology? If it's false and necessitarianism is true, what changes? If the answer is 'nothing,' then isn't this debate purely verbal? But if the answer is 'something,' what practical difference does it make whether we view laws as governors or summaries?"

  **Follow-up:** "If you say it affects how we interpret probability or confirmation, I'd press you: does the Humean view actually make *different* predictions about theory choice than the necessitarian view? If both views recommend the same theories based on the same evidence, isn't the Humean account just a deflationary gloss on a realist practice, rather than a competing metaphysics?"
