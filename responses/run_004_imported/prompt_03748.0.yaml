prompt: |-
  okay so this has been living in my head for like three weeks and I figured I'd type it out instead of continuing to spiral about it at 1am. I'm a sophomore doing the whole "optimize your resume" thing everyone here does — decent GPA, an exec board spot in a club "for leadership experience," an internship I mostly took because it'll help me get a better internship next summer. At some point I noticed literally everything I do lately is FOR something else, theres always a next rung. Even when I actually hit a goal, like getting the internship, I get maybe a day of feeling good before my brain's already worrying about the next thing. My roommate asked me when's the last time I did something just because, which annoyed me alot because I couldn't answer it. So I tried picking guitar back up, which I used to mess around with for fun in high school, except within two weeks I had a practice-streak app going and caught myself comparing my chord speed to some 14 year old on youtube, and now that feels like homework too.

  I'm in a philosophy seminar this semester that's touched on a handful of old, pretty different answers to what makes a life meaningful, and honestly none of them have "solved" this for me directly, but its at least made me suspicious that theres something structurally off about a life where basically everything is a means to a further end, rather than me just being a normal burnt out 20 year old who needs to relax more. is there an actual coherent problem here, philosophically speaking? and if so what would fixing it even look like — like is "just add more hobbies" a real answer, or does that miss the point given what happened with the guitar thing?
