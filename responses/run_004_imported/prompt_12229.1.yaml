answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees, [College Name]
  **FROM:** [Your Name], Honorary Degrees Subcommittee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Honorary Doctorate for General [Name]

  **Recommendation**
  After careful deliberation and review of the General's record, both military and humanitarian, I recommend that the Board **decline** to award an honorary doctorate to General [Name] at this time.

  This recommendation is made with full respect for the General's last two decades of service to refugees. However, an honorary degree is not merely a reward for good deeds; it is a public declaration of moral and intellectual exemplarity by this institution. Based on the specific nature of the General's wartime command decisions twenty years ago, awarding this degree would compromise the College's ethical integrity and implicate us in a moral framework we should not endorse.

  **The Case for Approval**
  I want to first articulate the arguments made by my colleagues on the subcommittee who support the nomination. Their position is reasonable, grounded in standard Just War theory, and deserves a fair hearing.

  1.  **Legitimacy of Targets:** Proponents argue that power grids and water-treatment plants are "dual-use" infrastructure. They support civilian life, but they also command military logistics, communications, and regime stability. Under the laws of armed conflict, such targets are often considered legitimate if they offer a definite military advantage.
  2.  **Utilitarian Necessity:** The General's reasoning was explicitly consequentialist: a short, sharp shock to the enemy's infrastructure would collapse the regime's will in weeks, avoiding a ground invasion that would have cost hundreds of thousands of lives—both coalition soldiers and enemy civilians—over years. If the calculation holds, the action minimized total suffering.
  3.  **Redemption and Holism:** Finally, supporters argue that we are honoring the whole person. The General's subsequent twenty-year commitment to refugee resettlement demonstrates a profound commitment to human dignity. To deny the honor based on actions taken in a different era, under the pressure of war, ignores his growth and his current status as a humanitarian leader.

  These points are not frivolous. If we view the degree as a simple "lifetime achievement award," the General's humanitarian ledger arguably outweighs his military one.

  **The Ethical Objection: Anscombe and Institutional Complicity**
  However, the subcommittee is divided because a significant portion of us believes that certain actions cannot be balanced out by later good works, specifically when those actions involve the intentional targeting of civilian survival. Here, I must engage with the philosophical framework raised by the late philosopher G.E.M. Anscombe in her 1956 protest against Oxford University awarding a degree to Harry Truman.

  Anscombe's argument is often caricatured as saying "consequences never matter." That is incorrect. Her argument is more precise, and it applies directly to the General's specific orders regarding the capital's water and power.

  **1. Means vs. Side Effects**
  Anscombe distinguishes between civilian deaths that are a *foreseen side effect* of attacking a military target and civilian deaths that are the *means* to victory.
  *   **Side Effect:** Bombing a munitions factory located in a city, knowing civilians nearby might die, but intending only to destroy the munitions.
  *   **Means:** Destroying water and power *specifically* to make civilian life untenable, thereby using the resulting civilian suffering as the lever to force the government's surrender.

  According to the briefing materials we reviewed, the General's reasoning was the latter: "the resulting collapse in civilian living conditions would break the enemy government's will." This makes the civilian suffering not an accident of war, but the mechanism of victory. Anscombe argues this is morally equivalent to murder, regardless of the uniform worn. If we accept this premise, the General ordered the mass killing of innocents as a tactic. No amount of later charity erases the moral nature of that specific act.

  **2. The "Conditions" of the Utilitarian Defense**
  The strongest defense for the General is that he "saved more lives" by shortening the war. Anscombe challenges the epistemic arrogance of this claim. She argues that we are being asked to trade *certain* present evil (the destruction of civilian infrastructure knowing it will cause suffering/death) for *hypothetical* future good (lives saved by a shorter war).

  We cannot know the future with certainty. Perhaps the regime would have collapsed anyway. Perhaps the ground campaign would have been negotiated. Anscombe argues that justifying the certain killing of innocents relies on a "condition"—*if* this saves more lives—that we cannot verify until after the fact. To base a moral justification on a speculative calculation is to claim a knowledge of consequences that no commander possesses. By accepting the "he saved lives" defense without reservation, we validate the idea that leaders are permitted to murder innocents based on optimistic projections.

  **3. Institutional Complicity**
  Finally, and most critically for this Board, is the question of what an honorary degree *does*. It is not a private transaction; it is a public witness. When Oxford honored Truman, Anscombe argued the university made itself complicit in his actions. She wrote that the university was essentially saying, "We approve of this."

  If we award this degree, we are not just thanking the General for his refugee work. We are signaling to our students, faculty, and the public that the College judges his overall life to be exemplary. By smoothing over the moral rupture of his wartime command, we normalize the logic that civilian suffering is an acceptable tool of statecraft if the "math" works out. We risk turning the College's moral authority into a currency used to sanitize difficult histories. As a small college, our reputation rests on our integrity, not our prestige. We cannot afford to be seen as an institution that looks away from the intentional targeting of civilians because the perpetrator later did good deeds.

  **Conclusion**
  I recognize that rejecting this nomination will be difficult. The General is a respected figure, and his refugee work is genuinely noble. It would be easier to approve the degree and avoid conflict.

  However, we are trustees of this institution's conscience as well as its endowment. The "dual-use" argument fails because the *intent* described in the record was to leverage civilian hardship as a weapon. The "saved lives" argument fails because it relies on speculative calculus to justify certain harm. And the "redemption" argument fails because an honorary degree is a judgment of exemplarity, not a pardon.

  We can acknowledge the General's humanitarian contributions in other ways—perhaps through a guest lecture series or a humanitarian award that does not carry the moral weight of a doctorate. But we should not grant him the highest honor this College bests. To do so would be to decide that the ends justify the means, a principle that undermines the very liberal arts education we exist to protect.

  I move that we table this nomination indefinitely.
