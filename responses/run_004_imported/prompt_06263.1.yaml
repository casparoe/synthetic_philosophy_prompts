answer: |-
  Your critique partner is looking at the *words*, but you are hearing the *logic*. You are absolutely right to keep both. They are not redundant; they are grammatically and logically distinct modes of reasoning that serve different purposes in your narrative arc.

  Here is the breakdown of the actual logical difference, along with the terminology you can use to explain it to your partner.

  ### 1. The Grammatical Difference: Indicative vs. Counterfactual

  *   **Line 1 (Early):** *"If Marcus didn't spike the wine, one of the other four people at that table **did**."*
      *   **Mood:** **Indicative.** This deals with facts and reality as it is known.
      *   **Logic:** This is a **Deductive Constraint**. It establishes the "Closed Circle." It says: *The wine is spiked. That is a fact. The set of possible agents is {Marcus, A, B, C, D}. If Marcus is not the agent, the agent must be in the remaining set.*
      *   **Narrative Function:** This sets the stakes. It tells the reader, "We are looking for the one person among these five." It treats the *act* as a known fact, but the *perpetrator* as unknown.

  *   **Line 2 (Late):** *"If Marcus hadn't spiked the wine, one of the other four **would have**."*
      *   **Mood:** **Subjunctive (Counterfactual).** This deals with hypothetical scenarios that contradict known facts.
      *   **Logic:** This is a **Reflection on Inevitability**. It acknowledges that Marcus *did* do it (the condition "If Marcus hadn't" is known to be false). It speculates on an alternative timeline.
      *   **Narrative Function:** This is thematic closure. It suggests that the *murder itself* was the constant, and Marcus was just the variable. It implies that the motive or opportunity was so potent that if Marcus hadn't acted, the pressure would have forced someone else to act.

  ### 2. Why Swapping Them Breaks the Story

  Your intuition that swapping them feels "wrong" is backed by logic.

  *   **If you put Line 2 Early ("...would have"):**
      *   **The Problem:** This asserts **premature certainty**. To say someone "would have" done it implies you know the *intent* and *capability* of the other four suspects. Early in a mystery, the detective shouldn't know if the others were capable or willing. It sounds like she is assuming guilt before investigating.
  *   **If you put Line 1 Late ("...did"):**
      *   **The Problem:** This asserts **lingering doubt**. By the end, you said it's "confirmed Marcus did it." If she says, "If Marcus didn't... someone did," she is grammatically leaving open the possibility that Marcus *didn't*. It undermines the resolution. It sounds like she hasn't fully accepted the proof.

  ### 3. How to Defend This to Your Partner

  You can tell your partner: *"They aren't repetitions; they are bookends that show the change in the detective's certainty."*

  *   **Line 1 is about Opportunity:** It defines the suspect pool. (Early Game)
  *   **Line 2 is about Inevitability:** It reflects on the nature of the crime now that the killer is known. (End Game)

  ### A Small Caveat to Watch Out For

  There is one logical trap in Line 2 you should be aware of.

  *"If Marcus hadn't spiked the wine, one of the other four would have."*

  Strictly speaking, this implies the other four **were willing and able** to kill the victim. If the other four are truly innocent (i.e., they would *never* have poisoned the wine), a hyper-literal reader might call this line false.

  *   **If the other four had motive but lacked opportunity:** Line 2 works perfectly. It means "If Marcus hadn't seized the opportunity, one of the others was ready to."
  *   **If the other four are totally innocent:** You might consider a slight tweak to keep the *logic* of your sentence while protecting the *innocence* of the suspects.
      *   *Option A:* "If Marcus hadn't spiked the wine, logic says one of the other four **must have**." (Focuses on deduction, not their willingness).
      *   *Option B:* Keep it as is, but ensure the context implies she means "If Marcus wasn't the killer, the situation dictates it would have had to be one of them," rather than "They were all secret murderers."

  ### Verdict

  **Keep both lines.** Your partner is seeing surface-level repetition, but you are writing structural logic. Line 1 opens the puzzle box; Line 2 closes it. Swapping them breaks the timeline of the detective's knowledge. Trust your gut.
