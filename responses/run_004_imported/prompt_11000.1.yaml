prompt: |-
  I'm taking a set theory course this semester and we just finished the block of proofs showing that the Axiom of Choice, Zorn's Lemma, and the Well-Ordering Theorem are all equivalent over ZF - three totally different-sounding statements that turn out to be logically interchangeable. My professor mentioned in passing that theres an old joke among mathematicians that goes something like "AC is obviously true, the well-ordering theorem is obviously false, and as for Zorn's lemma, who knows." It got a laugh, but it's also stuck with me, because even after working through the equivalence proofs myself, AC (in the "pick one element from each set in the collection" form) still just feels way more believable to me than "the real numbers can be well-ordered" - and a couple people in my study group said the same thing.

  What I want is for you to actually take a side on this rather than just explaining the joke or the usual motivating examples for AC (Vitali sets, Banach-Tarski, etc - I already know those). Specifically, argue for the position that this gap in gut-level plausibility between logically equivalent statements is philosophically legitimate rather than just a bias we should train ourselves out of - i.e., that being able to prove two statements equivalent inside a formal system does NOT automatically mean a person who's justified in believing one is thereby equally justified in believing the other, and that AC-vs-well-ordering is a genuine instance of this rather than something that would dissolve if we "really" understood the proof. Feel free to bring in your own diagnosis of specifically why a well-ordering of the reals feels so alien even to people who accept AC without hesitation. As a bonus, I'd love to hear what you think this implies about how much weight mathematicians should even give to "intuitive self-evidence" when deciding whether to adopt some new, controversial axiom down the line.
