answer: |-
  Your intuition is correct, and it is shared by most moral philosophers and many economists. Your sister is proposing what is known in ethics and economics as a **Pure Rate of Time Preference (PRTP)** applied to human welfare.

  While discounting *money* over time is standard financial practice (because money today can be invested to become more money tomorrow), discounting *wellbeing* or *entitlement* purely because it occurs later is widely considered ethically indefensible.

  Here is a breakdown of why her reasoning is flawed, along with the few nuanced arguments that might actually support adjusting payouts (which are different from her stated reason).

  ### 1. The Ethical Objection: "Temporal Discrimination"
  The strongest argument against your sister's position is that it violates the principle of **impartiality**.

  *   **Moral Equality:** Most ethical frameworks hold that a unit of wellbeing (happiness, security, opportunity) counts equally regardless of *who* experiences it or *when* they experience it. A great-grandchild in 2090 is a moral equal to a grandchild in 2035. To say their needs count for less simply because they are born later is a form of discrimination based on birth date.
  *   **The Ramsey Quote:** The famous economist and philosopher Frank Ramsey addressed this exact issue in 1928. He wrote that discounting later enjoyments in comparison with earlier ones is **"a practice which is ethically indefensible and arises merely from the weakness of the imagination."**
  *   **The "View from Now" Bias:** Your sister's reasoning ("from where we're sitting now") admits the bias. She is privileging the perspective of the *current* generation over the *future* generation. But the trust is not for *you*; it is for *them*. From the perspective of the great-grandchild in 2090, their needs are just as real and pressing as the grandchild's needs are in 2035.

  ### 2. The Economic Confusion: Price vs. Value
  Your sister is conflating **financial discounting** with **moral valuation**.

  *   **Financial Discounting (Valid):** $100 today is worth more than $100 in 50 years because you can invest the $100 today. However, you noted that the trust's investment growth is *already adjusted for*. This means you are comparing **real** purchasing power. $10,000 of purchasing power in 2035 should theoretically buy the same bundle of goods as $10,000 of purchasing power in 2090.
  *   **Moral Discounting (Invalid):** If the purchasing power is equal, why should the payout be lower? Only if the *value* of that purchasing power to the human being is lower. There is no evidence that a dollar buys less "happiness" in 2090 than in 2035 simply due to the calendar date.

  ### 3. The Valid Alternative: Diminishing Marginal Utility
  There is one defensible reason to give future generations less money, but it is **not** the reason your sister gave.

  *   **The Argument:** If we expect future generations to be significantly wealthier than the current generation (due to technological progress and economic growth), then an extra dollar means less to them than it does to us. This is called **diminishing marginal utility of wealth**.
  *   **The Difference:** This argument relies on *relative wealth*, not *time*. If the family trust is the *only* source of wealth for these descendants, or if economic stagnation occurs, future descendants might be poorer than the current ones. In that case, discounting their share would be actively harmful.
  *   **Recommendation:** If your sister is worried about future descendants being "too rich," the trust should tie payouts to their external economic status, not arbitrarily discount based on birth year.

  ### 4. The Practical/Trust Governance Objection
  Beyond ethics, this rule creates practical problems for the trust itself.

  *   **Mission Drift:** What is the purpose of the trust? If it is to support the family lineage, arbitrarily shrinking support undermines that goal. It signals to future generations that they are less valued members of the family.
  *   **Resentment:** Family trusts often fail due to interpersonal conflict. A rule that explicitly states "Grandchildren matter more than Great-Grandchildren" creates a hierarchy of worthiness that can breed resentment and litigation.
  *   **The "Dead Hand" Problem:** By imposing a pure time discount, the current generation is asserting that their impatience or perspective should govern resources centuries from now. This is often viewed as an overreach of control by the grantors (the "dead hand" of the past controlling the future).

  ### 5. Is it *Defensible*?
  Is she doing something "wrong"?

  *   **Legally:** No. It is your family's money. You can write almost any rule you want into the trust deed.
  *   **Rationally/Ethically:** Yes, she is making a mistake. She is applying a financial heuristic (time value of money) to a moral question (distribution of welfare) without the necessary adjustments.

  If she insists on the rule, ask her to clarify the **goal**:
  1.  **If the goal is to prevent the trust from lasting too long:** There are clearer ways to do this (e.g., a "sunset clause" that ends the trust in 2090).
  2.  **If the goal is to reflect that future people will be richer:** Tie payouts to GDP per capita or median income, not just time.
  3.  **If the goal is simply that "future wellbeing matters less":** She is arguing for a philosophical position that most ethicists reject as discriminatory.

  ### Summary Argument for Your Sister
  You might say something like this to her:

  > "We agree that money today is worth more than money tomorrow because of investment returns, and we're already accounting for that. We also agree that if our great-grandchildren are billionaires, they might need less help than our grandchildren, and we could adjust for wealth.
  >
  > But your proposal discounts their share *purely* because of the date on the calendar. That implies a great-grandchild's happiness is intrinsically less valuable than a grandchild's happiness. As Frank Ramsey said, that's ethically indefensible. It treats time of birth as a moral disqualification. If we want to limit the trust's duration or adjust for future wealth, let's write those specific rules. But let's not write a rule that says future family members count for less than current ones."

  **Verdict:** Her reasoning is ethically flawed. While you *can* implement the rule, it rests on a premise (that future welfare is intrinsically less valuable) that is generally rejected in moral philosophy and sound long-term planning.
