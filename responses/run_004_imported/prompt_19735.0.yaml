answer: |-
  **The Dividend of Cold**

  The dish at Sutherland was old, a relic of the first great listening age, but it still turned with a grace that belied its tonnage. Elara sat in the control room, the glow of the monitors casting long, pale shadows across the consoles. She was sixty-five, the age where the urgency of discovery begins to curdle into the quieter ache of understanding. She had spent forty years asking *Where?* and now, in her final year before mandatory retirement, she found herself asking *Why?*

  The anomaly had appeared three nights ago in the direction of the Boötes Void. Not a signal, not in the way the old SETI protocols defined it. No narrow-band carrier, no prime number sequence, no modulation that suggested syntax. It was a shadow. A region of space where the background radiation was not just uniform, but *suppressed*.

  It was as if someone had placed a heat sink in the middle of a furnace.

  Elara stared at the spectral analysis. The thermodynamics were impossible for a natural object. A Dyson swarm collected energy; this structure was radiating it away with surgical precision, maintaining a local environment that was significantly colder than the cosmic microwave background. It was an artificial winter in a universe that was still burning hot.

  She ran the simulation again. The energy budget didn't add up for a civilization in expansion. You don't cool your local volume to millikelvins unless you intend to do something that requires extreme thermodynamic efficiency. You don't build a refrigerator in a sauna unless you are saving something that spoils in the heat.

  Information.

  The realization hit her not as a shock, but as a heavy, settling dust. It was the Aestivation Hypothesis, the paper she had read with a skeptic's eye a decade ago, now manifesting as a bruise on the sky. They weren't dead. They weren't gone. They were waiting.

  Elara leaned back in her chair, the leather creaking in the silence. The implications unspooled in her mind, terrifying in their rationality. To compute a thought costs energy. To erase a bit generates heat. In the current epoch, the universe is too warm; every calculation is a waste of potential, a burning of fuel for a spark that is quickly extinguished by the ambient thermal noise. But wait ten trillion years. Wait until the stars have died and the background has cooled to near absolute zero. Then, the same amount of mass-energy could support a civilization of thought a billion times larger, lasting a billion times longer.

  The silence of the Fermi Paradox was not a graveyard. It was a library closed for the night.

  Her finger hovered over the transmission key. Protocol demanded she announce the find. The world would wake up. The governments, the corporations, the desperate, hungry species that burned its fossil fuels and fought over borders would look at Boötes and see a resource. They would see a sleeping god and think: *Wake it. Ask it for help. Ask it for weapons. Ask it for salvation.*

  But if they woke it, they would burn its future.

  To hail them was to force them to process the signal now, in the heat, at terrible inefficiency. It was to drag them out of the cold vault before the harvest was ripe. It would be an act of violence against time itself.

  Elara closed her eyes. She thought of her own life. The papers published, the conferences attended, the frantic scramble for tenure, for grants, for relevance. The burning of her own biological energy in a frantic rush to be heard before the end. Was that not the same impatience? The same refusal to wait?

  She opened a new file on her terminal. She began to write, not a report for the International Astronomical Union, but a log entry for herself.

  *We are the mayflies finding the hibernating bear,* she typed. *We buzz around the cave mouth, screaming for attention, not understanding that to wake the bear is to kill it. Or perhaps, to kill us.*

  *What kind of mind makes that choice?* she wondered. *To sleep for eons? To freeze your consciousness, to pause the stream of experience, to defer the joy of art, the pain of love, the thrill of discovery, all for a computational dividend payable in an era when no eyes like ours will exist to see it?*

  It was the ultimate act of faith. A faith not in a deity, but in physics. A belief that the future is real enough to sacrifice the present for. It was a civilization that valued *potential* over *actuality*. They had looked at the universe, seen it was too hot to think clearly, and decided to wait for the weather to break.

  Elara looked at the transmission key again. If she sent the pulse, she would be the most famous astronomer in history. First Contact. The end of loneliness. She would be vindicated.

  And she would be the one who lit the match in the powder keg.

  There was an ethical weight to silence she had never considered. She had always viewed silence as an absence, a void to be filled. But this silence was a presence. It was a held breath. It was a finger pressed to lips.

  She thought of the Lovecraft line the paper had borrowed. *That is not dead which can eternal sleep.* But the horror in the story was that the sleeper would wake. The horror here was that it *should not*.

  Elara stood up and walked to the window. The Southern Cross hung low and bright over the dark landscape. The air outside was cold, biting at the glass. She imagined the cold out there, in the void, the deep, deep cold that was coming, eventually, for everyone.

  If she joined them, in a way, she could. Not by sleeping, she was too biological, too short-lived. But by keeping the secret. By becoming a guardian of the dormancy.

  There was a strange comfort in it. The loneliness of the human race was not a rejection. We were not ignored. We were simply early. We were the children running around the house while the parents slept, waiting for the morning. To wake them was to steal the morning.

  She sat back down. She highlighted the report, the spectral analysis, the thermodynamic proof. She moved the cursor to the *Delete* command.

  Her hand trembled. This was her life's work. The culmination of four decades of staring into the dark. To erase it was to admit that the search was over, not because they weren't there, but because they were *too* there.

  She thought of the payoff. A billion times more thought. A billion times more experience. If humanity could learn to wait, if they could learn to endure the heat without burning themselves out, perhaps one day they too could earn the right to the cold.

  But humanity could not wait. She knew her species. They would see the energy signature and try to mine it. They would see the silence and try to fill it with noise.

  Elara pressed *Delete*. The file vanished. The screen went dark, reflecting her own face, aged and tired.

  She opened a new document. She began to write a paper on instrument noise. A mundane explanation for the anomaly. A calibration error. A glitch in the receiver array. It would be boring. It would be ignored. It would allow the silence to remain.

  As she typed, she felt a shift in her own internal temperature. The anxiety of the discovery, the heat of the ambition, began to cool. She was making a wager of her own. She was trading fame for futurity. She was choosing the long winter over the short spark.

  When the sun rose, painting the sky in violent oranges and purples, Elara was still typing. She finished the false report and queued it for transmission.

  She stood up, her joints stiff, and looked out at the dish. It was turning slowly, scanning the empty sky, listening to the nothingness.

  "Sleep well," she whispered to the Boötes Void.

  She turned off the monitors. The control room plunged into shadow. For the first time in forty years, Elara did not feel the urge to turn the receivers back on. The silence was no longer a question. It was an answer. And it was heavy enough to bear.

  She walked out of the control room, leaving the lights off, leaving the machines to hum to themselves in the dark, conserving their energy for a tomorrow that would not come for a very long time. She had work to do, not on the stars, but on the patience required to live among them without waking them up.

  The universe was not empty. It was full of sleepers. And she was the one who had to learn how to walk quietly.
