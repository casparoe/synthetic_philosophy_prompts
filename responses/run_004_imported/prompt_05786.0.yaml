      *   *Fuller's nuance:* Fuller isn't just "natural law" in the Thomistic sense. It's procedural. The Nazi decrees often violated procedural norms (retroactivity, secrecy). This makes the colleague's argument stronger technically.

  8.  **Final Structure:**
