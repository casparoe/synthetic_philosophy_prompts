answer: |-
  # The Bankruptcy of Infinity: A Verdict on Pascal's Mugging

  Pascal's Mugging is not merely a paradox; it is a stress test for the coherence of expected value (EV) maximization. The scenario is simple: a stranger threatens to harm an astronomically large number of people (say, $3 \uparrow\uparrow\uparrow 3$) unless you hand over five dollars. They offer no evidence, yet you assign a tiny, strictly positive credence to their claim. If your utility function is unbounded, the expected utility of paying ($P \times N$) vastly exceeds the cost of the five dollars. Rationality, seemingly, demands you pay. But if you pay, you are exploitable by any fantasist who can name a bigger number.

  To rescue rationality from this paralysis, we must determine whether a rational agent should pay. To do so, we must evaluate the proposed fixes not as theoretical curiosities, but as operational constraints. I will examine two dominant solutions: the Leverage Penalty and Utility Capping. I will argue that while both relocate the problem, only one allows for a coherent agency. My verdict is definitive: **No, a rational agent should not pay.** This verdict depends on the acceptance that a rational, embedded agent must possess a bounded utility function.

  ### The Leverage Penalty: Epistemic Blindness

  The Leverage Penalty, proposed by Robin Hanson and elaborated by Eliezer Yudkowsky, attempts to solve the mugging at the level of priors. The argument is that hypotheses granting an agent outsized causal leverage over a vast number of people are inherently complex and should be penalized. Specifically, the prior probability of a hypothesis should scale inversely with the number of people affected ($P \propto 1/N$). If the utility scales linearly with lives ($U \propto N$), the expected value ($P \times U$) remains constant regardless of $N$, preventing the EV from exploding to infinity.

  Does this block the mugging? Mathematically, yes. It prevents the stranger from bullying you by simply naming a larger number. However, it does not solve the underlying tension; it relocates the problem from financial exploitation to epistemic blindness, creating the "Pascal's Muggle."

  A Pascal's Muggle is an agent who refuses to update their beliefs even in the face of overwhelming evidence. If the stranger were to tear open the sky and display the suffering masses, a strict Leverage Penalty would still suppress the posterior probability. Because the hypothesis "I am in a position to affect $3 \uparrow\uparrow\uparrow 3$ people" carries a massive complexity penalty, the evidence required to overcome it becomes impossibly large. The agent becomes incapable of recognizing genuine high-leverage opportunities, such as existential risk mitigation, where our actual leverage over the future *is* astronomically high.

  By adopting the Leverage Penalty, you save your wallet but sacrifice your eyes. You become immune to muggings, but you also become blind to reality when reality presents high-stakes scenarios. This is an unacceptable cost for a rational agent whose goal is to navigate the world accurately. The Leverage Penalty blocks the mugging only by making the agent epistemically inert to the very scale of impact they claim to care about.

  ### Utility Capping: Moral Saturation

  The second solution is to cap the utility function. Instead of $U(N) = N$, we posit a function that asymptotes, such as $U(N) = \tanh(N)$ or a hard cap at some maximum value $U_{max}$. If utility is bounded, then no matter how large $N$ becomes, the expected utility of the transaction cannot exceed $P \times U_{max}$. As the stranger's claim grows more outlandish, the rational credence $P$ typically shrinks (due to complexity). Eventually, $P \times U_{max}$ drops below the cost of five dollars.

  Does this block the mugging? Yes, decisively. It renders the infinite irrelevant. However, it too relocates the problem, this time from epistemology to ethics. It introduces the problem of Moral Saturation.

  If utility is bounded, there exists a point where saving an additional billion lives adds effectively zero utility. This violates the principle of stochastic dominance: a world where $N+1$ people are saved is strictly better than a world where $N$ are saved, yet a capped utility function treats them as equivalent. To a moral realist, this looks like a bug. It implies that preventing an extinction event affecting $10^{50}$ future beings is not significantly more valuable than preventing one affecting $10^{40}$ beings, provided both are near the cap.

  However, we must weigh the cost of this relocation. The Leverage Penalty makes you blind to *evidence*; Utility Capping makes you indifferent to *margins* at scales beyond human comprehension. For a finite, embedded agent, the latter is a feature, not a bug. Human values are naturally bounded; we do not experience infinite joy or infinite suffering. A utility function that mirrors the agent's cognitive architecture is more coherent than one that posits infinite value in a finite universe. The "absurdity" of moral saturation only arises at numbers so vast they have no operational meaning for a physical agent. Unlike the Pascal's Muggle, who ignores evidence right in front of their face, the agent with capped utility can still see the sky tear open—they just value the outcome coherently relative to their capacity to affect it.

  ### The Verdict

  We are left with a choice between two relocations: epistemic blindness (Leverage Penalty) or moral saturation (Utility Capping). The Leverage Penalty forces the agent to deny the possibility of high-impact actions even when evidence is present, which cripples the agent's ability to achieve its goals. Utility Capping preserves the agent's ability to update on evidence and act, merely constraining the *value* assigned to infinite outcomes.

  Therefore, the only coherent path for a rational agent is to adopt a bounded utility function. Unbounded utility functions are mathematically pathological for agents with finite memory and computation; they allow finite resources to be wagered on infinite payoffs with vanishing probabilities, leading to sure losses (money pumps). A rational agent must recognize its own finitude.

  **Verdict:** **No, I would not pay the five dollars.**

  This verdict is not a heuristic shortcut; it is a requirement of coherence. However, it is conditional.

  **Condition:** This refusal to pay depends entirely on the agent maintaining a **bounded utility function**. If an agent insists on an unbounded utility function, they *must* pay the five dollars (and indeed, must pay any amount less than the expected value), rendering them exploitable. Since exploitability is irrational, a rational agent *must* have bounded utility. Thus, the condition for not paying is simply the condition of being a rational, non-exploitable agent.

  Furthermore, this verdict holds specifically in the absence of extraordinary evidence. If the stranger provides evidence sufficient to raise the probability $P$ such that $P \times U_{capped} > \$5$, payment would be rational. But in the standard mugging scenario, where the claim rests solely on the magnitude of $N$ and a fixed tiny credence, the bounded utility function ensures the expected value remains below the cost of compliance.

  To pay is to admit that your decision theory allows you to be money-pumped by the first fantasist who learns to count to $3 \uparrow\uparrow\uparrow 3$. To refuse is to acknowledge that while the universe may be vast, your capacity to value it—and your vulnerability to those who lie about it—must have a limit. Rationality requires limits.
