answer: |-
  **Title:** The Triviality of Truth: Why Indicative Conditionals Do Not Express Propositions

  **Introduction**

  The indicative conditional occupies a unique and troubling space in the philosophy of language. On one hand, the "Adams Thesis" (or "The Equation") seems undeniable: the assertibility or probability of a conditional "If A, then B" aligns perfectly with the conditional probability of the consequent given the antecedent, $P(B|A)$. On the other hand, standard semantic theory assumes that declarative sentences express propositions—sets of possible worlds that are either true or false. In his 1976 triviality proof, David Lewis demonstrated that these two intuitions are incompatible. If conditionals express propositions and the Equation holds across a reasonable range of belief states, probability theory collapses into triviality.

  The upshot of Lewis's result remains a matter of fierce debate. My advisor argues it proves non-cognitivism: conditionals do not express truth-evaluable propositions. My officemate argues for truth-conditional escapes, such as indexical contextualism or trivalent semantics. This paper argues that the non-cognitivist verdict is the correct one. While truth-conditional escapes are formally possible, they incur theoretical costs that outweigh the benefits. The most coherent explanation of Lewis's result is that indicative conditionals are not descriptions of fact, but tools for suppositional judgment. Therefore, indicative conditionals do not have truth conditions.

  **The Triviality Argument**

  To assess the upshot, we must first be precise about the trap Lewis set. The argument targets the conjunction of three claims:
  1.  **Truth-Conditionality:** The conditional $A \to B$ expresses a proposition $X$ with standard truth conditions (it is true in some worlds, false in others).
  2.  **The Equation:** For any rational credence function $P$, $P(A \to B) = P(B|A)$ (where $P(B|A) = P(A \& B) / P(A)$).
  3.  **Closure:** The class of admissible credence functions is closed under conditionalization (if $P$ is admissible, then $P(\cdot|A)$ is also admissible).

  Lewis shows that if $A \to B$ is a proposition $X$, then $P(X)$ is the sum of probabilities of worlds where $X$ is true. By partitioning the worlds into those where $A$ is true and those where $A$ is false, and applying The Equation, one can derive that $P(B|A) = P(B)$. This implies that $A$ and $B$ are probabilistically independent. Since this must hold for *any* $A$ and $B$ (within the closure class), it entails that no two propositions can be probabilistically dependent—a clearly absurd result for natural language.

  The force of the proof lies in the Closure assumption. It is not enough to say the Equation holds for my *current* beliefs. If I can learn $A$ (conditionalize on $A$), the Equation should still hold for my new beliefs. Lewis shows that maintaining the Equation through belief update forces the truth conditions of $A \to B$ to shift in impossible ways if $A \to B$ is a standard proposition.

  **The Truth-Conditional Escapes**

  The formal semantics community, including my officemate, often resists the non-cognitivist conclusion by attacking the premises of Lewis's proof. There are two primary strategies: modifying the semantics of the conditional or modifying the logic.

  The first strategy is **Indexical Contextualism** (championed by Stalnaker and van Fraassen). This view denies Closure. It argues that the proposition expressed by $A \to B$ depends on the speaker's credence function. When you conditionalize on new information, the context shifts, and $A \to B$ comes to express a *different* proposition. Thus, Lewis's proof fails because it equivocal on the content of $A \to B$ across different probability functions.

  While formally valid, this move is theoretically expensive. It makes the content of "if" radically unstable. If I say, "If it rains, the match will be cancelled," the proposition I express depends on my current subjective probabilities. If you have different probabilities, we are not disagreeing about the same thing; we are expressing different propositions. This threatens to make communication about conditionals nearly impossible, as we could rarely be sure we are asserting the same content.

  The second strategy involves **Trivalent Semantics** (revived by Rothschild, following De Finetti). This view denies that propositions must be bivalent. If $A \to B$ can be True, False, or Void (e.g., when $A$ is false), the probability calculus changes. In a trivalent system, $P(A \to B)$ can equal $P(B|A)$ without triggering triviality because the algebra of propositions is no longer Boolean.

  This is the strongest truth-conditional rival. However, it struggles with embedding. Natural language allows conditionals to be embedded in disjunctions, negations, and larger conditionals (e.g., "If if A then B, then C"). Trivalent semantics typically requires complex, non-classical logic to handle these embeddings, often yielding counterintuitive validity results (such as the failure of Modus Ponens in certain contexts). We are left with a choice: save truth conditions by adopting a logic that does not match our inferential practices, or save the logic by abandoning truth conditions.

  **The Case for Non-Cognitivism**

  Given the costs of the truth-conditional escapes, the most parsimonious solution is to accept Lewis's conclusion: indicative conditionals do not express propositions. This is the **Suppositional** or **Non-Cognitivist** view, defended by Dorothy Edgington and the later Lewis.

  On this view, the Equation is not a fact about the *truth* of a proposition, but a constraint on *belief*. To assert "If A, B" is not to describe a state of affairs in the world; it is to invite the listener to suppose $A$ and judge $B$ under that supposition. This explains why the Equation holds so robustly: it reflects the very nature of conditional judgment, not a correlation between two distinct quantities (probability of a proposition and conditional probability).

  Critics often object that conditionals *appear* to be truth-apt. We say, "That's true," in response to a conditional. The non-cognitivist replies that this is a pragmatic phenomenon. We can agree or disagree with a rule of inference or a command without that rule or command being a truth-bearing proposition. When we say a conditional is "true," we mean that the conditional probability is high, not that a corresponding fact obtains.

  Furthermore, non-cognitivism avoids the communicative instability of Indexicalism. If conditionals express no propositions, then two speakers can share the same conditional belief ($P(B|A)$ is high for both) without needing to align on a specific set of possible worlds that constitutes the "content" of the conditional. It also avoids the logical complexity of Trivalence. We can maintain classical logic for categorical assertions while treating conditionals as a distinct, non-truth-functional grammatical category.

  **Verdict**

  So, do indicative conditionals have truth conditions? The verdict is **no**.

  Lewis's triviality result is not merely a technical puzzle to be solved by tweaking the algebra; it is a signpost indicating a category mistake in our semantic theory. We have long assumed that all declarative sentences function to describe the world. Lewis showed that if conditionals did so, our probabilistic reasoning would be impossible. The "wiggle room" offered by indexicalism or trivalence saves the letter of truth-conditional semantics only by sacrificing its spirit—either by making meaning too unstable for communication or by adopting a logic that fails to capture our actual reasoning.

  The upshot of Lewis 1976 is that the indicative conditional is not a connective that builds complex facts from simple ones. It is an operator on belief states. We should not try to force "if" into the truth-conditional box. The Equation holds precisely because conditionals are not in the business of being true or false. They are in the business of guiding supposition. To insist on truth conditions is to demand a price—triviality, instability, or logical revision—that the semantics of natural language simply does not pay.

  **Conclusion**

  The debate over Lewis's triviality result often stalls on the reluctance to abandon truth-conditional semantics. However, a philosophical theory must follow the data, even when it leads to revisionary metaphysics. The data here is the robust validity of the Adams Thesis and the impossibility of reconciling it with classical propositions. The truth-conditional escapes require us to distort the logic or the pragmatics of conditionals to save a metaphysical picture. Non-cognitivism requires us only to update that picture. Given the choice, the latter is the superior theoretical position. Indicative conditionals do not have truth conditions; they have conditions of assertibility grounded in conditional probability. Lewis was right: the Equation is a fact about minds, not the world.
