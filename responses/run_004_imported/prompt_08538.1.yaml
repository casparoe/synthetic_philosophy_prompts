          "So the hypocrite's blame is false?"
          "No, the blame is accurate, but the *standing* is forfeit. You lose the right to occupy the moral high ground."
          "High ground? Please. That's just status politics dressed as deontology. If the rule is valid, anyone can enforce it. Otherwise, morality becomes a club where only the pure can speak."
          "Not the pure. The non-hypocritical. Consider the recovering addict telling their kid to stay off heroin. They messed up. But we intuitively think they have standing. Maybe more than a stranger."
          "Exactly. So your theory collapses. Why do they have standing?"
          "Because they aren't claiming exemption. They're saying, 'I violated this, and it destroyed me. Don't.' They own the hypocrisy."
          "See, that's my point. It's not about 'standing' as a metaphysical veto. It's about sincerity. The addict is sincere. The hypocrite you're defending—the guy cheating on his wife while policing his friend's marriage—isn't. He's lying about his own commitment to the norm."
          "So you reduce standing to sincerity?"
          "I reduce it to the function of blame. Blame aims to correct behavior or acknowledge wrongs. If the accuser is hypocritical, the correction fails because the message is corrupted. But the wrong remains. You're conflating the messenger with the message."
          "I'm conflating nothing. I'm saying the *relationship* conditions the permission to speak. If I violate the norm, I put myself outside the community of compliance. I can't demand you comply while I opt out."
          "But the addict *did* opt out. Yet they speak."
          "They speak as a witness, not a judge. There's the distinction. Losing standing doesn't mean you can't speak truth. It means you can't *condemn*. The addict warns; they don't say, 'You owe me restitution for using drugs.' They say, 'This is dangerous.'"
          "So standing is just the权限 to demand restitution?"
          "It's the authority to hold someone accountable within a shared normative framework. If I reject the framework by violating it without remorse, I lose the key. But notice, you haven't denied the act is wrong. You've just denied my right to scream about it."
          "But why does that matter? If I deny your right, I'm just shielding myself from the discomfort of the truth. 'Look who's talking' is a shield."
          "Sometimes it's a shield. Sometimes it's a boundary. If we say standing doesn't exist, we invite moral tyranny. The puritanical can weaponize blame without self-scrutiny. Recognizing standing losses forces us to clean our own houses before policing neighbors."
          "Or it lets criminals off the hook because the cop once sped."
          "It lets the cop know he can't preach while speeding. There's a difference between stopping crime and claiming moral superiority. You want the truth to stand alone. I want the relationship to matter."
          "Maybe the truth *is* the relationship."
          "Then we agree the hypocrite damages the truth by speaking it."
          "No. We agree the hypocrite damages *themselves* by speaking it. The accusation stands. Your standing is just your reputation."
          "Reputation is social currency. You can't blame without it."
          "Then morality is bankrupt."

