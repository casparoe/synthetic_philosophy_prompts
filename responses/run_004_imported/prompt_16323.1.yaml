answer: |-
  Here are 8 conversational but sharp questions for the Q&A, tailored to your specific requests. I've included a "Likely Answer & Follow-up" note for each so you can keep the discussion moving if her response is too brief or evasive.

  ### 1. The Contextualism Distinction (The "Elephant in the Room")
  "Thanks again for the talk. I want to start with a clarification that I think half the audience is silently wrestling with. We've heard versions of this since DeRose in the 90s. For the uninitiated, what's the hard line between your view and Contextualism? They both make the truth of 'S knows p' vary with context. Is your claim that the *word* 'knows' is stable but the *state* changes, or is there a structural difference in how the context gets selected?"

  *   **Likely Answer:** She will emphasize that for Contextualism, it's the *attributor's* context (the speaker) that changes the standard. For Encroachment, it's the *subject's* practical situation that changes whether they actually have the knowledge state, regardless of who is speaking.
  *   **Follow-up:** If she leans hard on "subject vs. speaker," ask: "But if I, as a low-stakes speaker, tell a high-stakes subject 'You know p,' am I speaking falsely on your view? If so, doesn't that create the same communication breakdown Contextualism was trying to solve?"

  ### 2. The Ignorant High-Stakes Subject
  "I'm curious how you handle the 'unaware' agent. Imagine I'm crossing a bridge that I *think* is safe and low-stakes, but unbeknownst to me, it's actually rigged to collapse if I'm wrong about its load-bearing capacity. Do I lose knowledge of its safety because of the *objective* stakes, or only if I *believe* the stakes are high? If it's objective, knowledge seems to vanish without the subject's cognitive access."

  *   **Likely Answer:** Most pragmatists (like Stanley) tie it to the subject's actual practical situation, not their beliefs about it. So, you lose knowledge even if you're unaware.
  *   **Follow-up:** "That makes knowledge radically external. Does that worry you? It means I can lose knowledge of where my car is parked just because someone secretly put a bomb in it, even if I have no evidence of the bomb."

  ### 3. The Sorites/Skepticism Worry
  "One structural worry: Stakes seem to come on a continuum, but 'knows' feels binary. If encroachment is real, as stakes gradually rise, at what precise point does knowledge vanish? Are you comfortable saying 'knows' is vague in a way that generates a Sorites paradox, or does this view inevitably slide into a form of skepticism where high-stakes knowledge is impossible?"

  *   **Likely Answer:** She will likely accept that "knows" is vague (like "tall") and deny skepticism by arguing that for most ordinary propositions, the stakes rarely get high enough to defeat knowledge.
  *   **Follow-up:** "If it's vague, how is it action-guiding? If I'm hovering right on the threshold of the cutoff, am I permitted to act on $p$ or not? It seems we need a sharp line for decision-making even if the concept is vague."

  ### 4. Moral Encroachment Connection
  "There's been a surge of interest in 'Moral Encroachment' recently—the idea that moral stakes, not just prudential ones, affect justification. Do you see your view as naturally entailing moral encroachment? Or do you want to resist that extension, perhaps by keeping the 'practical' in pragmatic encroachment strictly about the subject's own goals?"

  *   **Likely Answer:** Many pragmatists welcome this, arguing moral harms are just a type of practical cost. However, some resist because moral stakes might be *too* high, making knowledge of social facts too difficult.
  *   **Follow-up:** If she accepts it: "Doesn't that make knowledge of social stereotypes too easy to lose? If the moral cost of being wrong is high, do we effectively lose knowledge of generalizations that might be statistically true?" If she resists: "What's the principled difference between prudential costs and moral costs that stops the slide?"

  ### 5. The Action-Knowledge Bridge
  "Your view relies heavily on the link between knowledge and action—roughly, that you should only act on $p$ if you know $p$. But couldn't we get all the intuitive results of the Bank Case just by saying knowledge is stable, but the *norm of assertion* or *practical rationality* shifts? Why locate the shift in knowledge itself rather than in the norms governing how we use it?"

  *   **Likely Answer:** She will argue that the best explanation for why it's irrational to act is that the epistemic position itself has weakened. Separating them makes the theory too complex (positing two shifts instead of one).
  *   **Follow-up:** "But isn't it simpler to say I *know* the bank is open, I'm just not *justified in acting* on it without checking? Why force epistemology to carry the weight of practical rationality?"

  ### 6. Testimony and Community
  "Let's think about sharing knowledge. If knowledge is stake-sensitive, it seems I can't easily transfer knowledge to you. If I'm low-stakes and tell you, a high-stakes agent, 'I know the bank is open,' have I lied to you? Or have I given you knowledge that you can't actually use? How does your view handle the social transmission of knowledge?"

  *   **Likely Answer:** She might say testimony provides evidence, but the hearer's stakes determine if that evidence amounts to knowledge. So, I haven't lied, but you haven't acquired knowledge yet.
  *   **Follow-up:** "That makes testimony surprisingly weak. It suggests we can never truly reassure someone in a high-stakes situation just by telling them we know. Is that a bullet you're willing to bite?"

  ### 7. Cognitive Load and Psychological Realism
  "On a psychological level, does this view demand too much of the knower? To know if I know something, do I need to calculate the stakes of being wrong? It seems like ordinary agents don't track stakes explicitly before claiming knowledge. Are we attributing a level of meta-cognitive awareness to subjects that they don't actually have?"

  *   **Likely Answer:** She will likely say stakes are often salient automatically (System 1 thinking) and don't require explicit calculation. The environment cues the stakes.
  *   **Follow-up:** "But in the Bank Case, the stakes change based on a hypothetical ('What if the check bounces?'). That requires counterfactual reasoning. How do we square that with the idea that knowledge is supposed to be a basic state we rely on effortlessly?"

  ### 8. The "Why Epistemology?" Question
  "Finally, a big-picture question. Even if pragmatic encroachment is true, some critics argue it changes the subject from *epistemology* to *decision theory*. If whether I 'know' depends on what I'm going to do with the information, have we stopped doing epistemology? Or is this just a reminder that belief is inherently a guide to action?"

  *   **Likely Answer:** She will argue that belief *is* a guide to action, so epistemology has always been about action. Separating them is an artificial carve-up of the mind.
  *   **Follow-up:** "If they're inseparable, does that mean we can't evaluate beliefs in isolation anymore? Do we lose the ability to critique a belief as 'unreasonable' without first knowing the agent's practical goals?"
