  **TA-to-TA Note:**
  Since you mentioned your reductionist leanings: You might be sympathetic to the student's conclusion in (c) (that chairs don't fundamentally exist). Don't let that bias inflate the grade. The student gets the *conclusion* right (Van Inwagen is a quasi-nihilist about artifacts) but gets the *argument* wrong (the Trout-Turkey is supposed to fail to exist, not succeed). In a grad seminar, exegesis trumps agreement. They need to know they misread the text, even if they landed on a worldview you find plausible.
