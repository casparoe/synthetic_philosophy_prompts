prompt: |-
  I've got a metaphysician coming on my little philosophy-of-science podcast next month who has built her whole career defending the Humean line on laws of nature -- the Lewis-style "best system" picture, where a law just is whatever comes out as an axiom of the true deductive systematization of all the particular facts that best trades off simplicity against strength (plus "fit," once objective chance gets thrown into the mix). Last time I had a Humean on the show I let her basically just restate Lewis for half an hour and got mocked for it in the department group chat, so this time around I want questions with actual teeth. Could you draft me eight to ten interview questions, each with a follow-up keyed to whatever answer she's most likely to give, that push on the real soft spots in the view instead of inviting a recap?

  At minimum I want one question on the worry that if laws are just a redescription of the mosaic of particular fact, it's unclear how they can explain or "govern" those very facts rather than merely summarizing them after the fact; one on the "undermining futures" headache for her account of objective chance and how that's supposed to sit with the Principal Principle; one that presses on whether her appeal to "natural" properties -- needed to fix which systematization even counts as simplest -- is quietly smuggling in some non-Humean ingredient (the quidditism worry, basically); and one built around the objection that quantum entanglement shows the world isn't seperable into a mosaic of local matters of particular fact to begin with, which, if right, undercuts Humean Supervenience before you even get to the best-system story about laws. Throw in a couple more if you spot a good angle I've missed, but please don't let her wriggle out of any of these with an answer that's really just a paraphrase of the postscript to "A Subjectivist's Guide to Objective Chance."
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Guest:** A metaphysician defending Humean Supervenience (HS) / Best System Analysis (BSA) of laws (Lewis-style).
      *   **Host:** Philosophy-of-science podcaster.
      *   **Goal:** 8-10 interview questions with follow-ups.
      *   **Tone:** "Teeth," not letting the guest just recap Lewis. Avoid questions that invite standard defenses found in Lewis's postscripts.
      *   **Mandatory Topics:**
          1.  Explanation/Governance (Laws summarizing vs. explaining facts).
          2.  Undermining Futures/Principal Principle (Chance and consistency).
          3.  Natural Properties (Is "naturalness" secretly non-Humean/quidditistic?).
          4.  Quantum Entanglement/Non-separability (HS base is wrong).
      *   **Constraint:** No easy outs. Follow-ups must anticipate standard Humean moves.

  2.  **Deconstruct the Humean Position (BSA/HS):**
      *   *Core:* The world is a mosaic of local particular facts. Laws supervene on this mosaic. Laws are axioms of the system that best balances simplicity and strength (and fit).
      *   *Weaknesses:* Explanatory circularity, chance coherence (undermining), the status of "natural properties" (perfectly natural properties are primitive), compatibility with modern physics (holism/entanglement), normativity/governance.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Topic 1: Explanation/Governance.*
          *   *Standard Q:* How do laws explain facts if they depend on facts?
          *   *Standard A:* Systematicity explains. It's not governance, it's description.
          *   *Better Q:* Focus on the direction of fit. If the law is *made* true by the facts, how can it constrain them?
          *   *Follow-up:* Anticipate the "scientific practice" defense (scientists use BSA). Push on the *metaphysical* ground vs. *epistemic* utility.

      *   *Topic 2: Undermining Futures.*
          *   *Standard Q:* How do you handle undermining futures?
          *   *Standard A:* Modify the Principal Principle (PP). Use the "New Principle."
          *   *Better Q:* Focus on the *concept* of chance. If chance is defined by the best system, but the best system can be undermined by future outcomes, isn't the definition unstable?
          *   *Follow-up:* If you modify PP, are you still capturing what we mean by "objective chance"?

      *   *Topic 3: Natural Properties.*
          *   *Standard Q:* Aren't natural properties non-Humean?
          *   *Standard A:* They are just the basis for similarity.
          *   *Better Q:* Lewis needs "perfectly natural properties" to calculate simplicity. Where do *they* come from? If they aren't derived from the mosaic, isn't HS false?
          *   *Follow-up:* Is this a primitive modality? If so, how is this different from Armstrong's universals?

      *   *Topic 4: Quantum Entanglement.*
          *   *Standard Q:* What about QM?
          *   *Standard A:* Wave function is part of the mosaic. Or, Humean structuralism.
          *   *Better Q:* Entanglement implies holism. HS requires separability (local facts). If the state of the whole isn't determined by the state of the parts, HS fails at the base level.
          *   *Follow-up:* If you redefine the mosaic to include global wave functions, haven't you abandoned the spirit of Humeanism (local beables)?

      *   *Topic 5: Counterfactuals.*
          *   *Angle:* Humeans struggle with counterfactuals because laws supervene on actuals.
          *   *Q:* How do you ground counterfactuals if laws just summarize actuals?
          *   *Follow-up:* If the mosaic were slightly different, would the laws change? If yes, laws are too fragile. If no, laws aren't Humean.

      *   *Topic 6: Simplicity/Objectivity.*
          *   *Angle:* Simplicity is mind-dependent (anthropocentric).
          *   *Q:* Simplicity depends on cognitive agents. Does this make laws mind-dependent?
          *   *Follow-up:* If laws are mind-dependent, is science discovering truth or just useful fiction?

      *   *Topic 7: Temporal Asymmetry.*
          *   *Angle:* Laws are usually time-symmetric, but explanation isn't.
          *   *Q:* How does BSA handle the arrow of time if the mosaic is just a block?
          *   *Follow-up:* Is the "best system" biased towards past-to-future inference?

      *   *Topic 8: The "Why" of Regularity.*
          *   *Angle:* Coincidence vs. Law.
          *   *Q:* What distinguishes a cosmic coincidence from a law in BSA?
          *   *Follow-up:* If a regularity is universal but complex, is it not a law? Why?

  4.  **Refining and Polishing (Adding "Teeth"):**
      *   Make sure the follow-ups cut off the "It's just a conceptual analysis" escape route.
      *   Ensure the tone is respectful but rigorous.
      *   Check against the "no Lewis postscript paraphrase" rule. (i.e., Don't let her just say "We use the New Principle" without addressing the conceptual cost).

  5.  **Final Review against Constraints:**
      *   8-10 questions? Yes.
      *   Follow-ups included? Yes.
      *   Mandatory topics covered? (Explanation, Undermining, Natural Properties, QM). Yes.
      *   Tone appropriate? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't sound *too* hostile. It's a podcast, not an inquisition. The questions should invite depth, not just defensiveness. I will frame them as "tensions" or "costs" rather than "fatal errors."
      *   *Correction on Q3 (Natural Properties):* Make sure to press on whether "naturalness" is itself a modal notion.
      *   *Correction on Q4 (QM):* Be specific about "local beables."
      *   *Correction on Q1 (Explanation):* Distinguish between epistemic systematization and metaphysical grounding.

  6.  **Final Polish:** Check the flow. Start with the big picture (Explanation), move to technical metaphysics (Natural Properties, Chance), then Physics (QM), then broader implications (Simplicity, Counterfactuals).

      *(Wait, I need to ensure I don't exceed 10 questions.)* I'll aim for exactly 10 to give variety.
      1. Explanation/Governance (Mandatory)
      2. Natural Properties/Quidditism (Mandatory)
      3. Undermining/Chance (Mandatory)
      4. Quantum/Non-separability (Mandatory)
      5. Simplicity/Anthropocentrism
      6. Counterfactuals/Resilience
      7. Intrinsic vs. Relational properties
      8. The "Base" of Supervenience (Parsimony)
      9. Scientific Realism vs. Instrumentalism
      10. The "Cost-Benefit" Analysis (Meta-metaphysics)

      *Let's refine the follow-ups to be very specific traps.*

      *   *Refining Q1 (Explanation):* If she says "Systematization *is* explanation," push: "Is that enough for *scientific* realism?"
      *   *Refining Q2 (Natural Props):* If she says "They are primitive," push: "Isn't that just universals by another name?"
      *   *Refining Q3 (Chance):* If she cites the New Principle, push: "Does the New Principle still capture *objective* chance?"
      *   *Refining Q4 (QM):* If she says "Wave function is in the mosaic," push: "Is the wave function local?"

      *Okay, ready to write.*
answer: |-
  Here are ten interview questions designed to press the specific metaphysical costs of the Humean Best System Analysis (BSA), complete with follow-ups that anticipate standard defensive maneuvers.

  ### 1. The Direction of Explanation
  **Question:** Let's start with the metaphysical ground floor. On the Best System view, the laws supervene on the mosaic of particular facts; the facts make the laws true. But in scientific practice, we treat laws as doing the heavy lifting: they explain *why* the facts are the way they are. If the laws are just a redescription of the facts derived *after* the fact, aren't you reversing the direction of explanation? How can the summary explain the data it summarizes?

  **Follow-up:** *If she answers that systematization just **is** a form of explanation (the "unificationist" reply):*
  "Okay, but that seems to conflate epistemic utility with metaphysical grounding. I can unify the data by writing 'Everything happens exactly as it does'—that's maximally strong and simple, but it explains nothing. If you say the Best System explains the mosaic, aren't you implicitly relying on a non-Humean notion of constraint to make that explanation stick, rather than just logical deduction?"

  ### 2. The "Natural Properties" Primitive
  **Question:** To run the Best System analysis, you need to know which predicates count towards simplicity. Lewis insists we need a fixed list of "perfectly natural properties" to prevent gerrymandered systems (like 'grue') from winning. But where do *these* properties come from? If they aren't derived from the mosaic, aren't you smuggling in a primitive, non-Humean modal structure at the base level?

  **Follow-up:** *If she argues natural properties are just the "sparse" properties required for resemblance:*
  "But resemblance in what respect? If you say they resemble in virtue of sharing a property, you sound dangerously close to Armstrong's universals. If the Humean base requires a primitive distinction between 'natural' and 'unnatural' properties to even get off the ground, how is this view ontologically cheaper than the Dretske-Tooley-Armstrong view you're trying to replace?"

  ### 3. Undermining Futures and Objective Chance
  **Question:** Let's talk about chance. The "undermining future" problem suggests that on your view, the current chance of a future sequence of events could be non-zero, even if that sequence, were it to occur, would change the laws (and thus the chances) retroactively. This creates a tension with the Principal Principle, which links rational credence to objective chance. How do you resolve this without rendering 'objective chance' incoherent?

  **Follow-up:** *If she appeals to Lewis's "New Principle" or a modified Principal Principle:*
  "Modifying the Principal Principle saves the math, but does it save the concept? The whole point of objective chance was that it guides belief because it tracks a real feature of the world. If we have to tweak the principle to stop the definitions from crashing into each other, are we still talking about *chance*, or just a useful statistical fiction that happens to avoid contradiction?"

  ### 4. Quantum Entanglement and Separability
  **Question:** Humean Supervenience relies on the world being a mosaic of local matters of particular fact—spatiotemporal points with intrinsic properties. But quantum entanglement suggests the state of a system is not determined by the states of its parts. If the world isn't separable into local beables, doesn't the Humean base collapse before you even get to the Best System story?

  **Follow-up:** *If she argues the wave function can be included in the mosaic (the "wave function realism" move):*
  "But the wave function lives on configuration space, not 3D space. If your 'local' mosaic requires high-dimensional space to be defined, haven't you abandoned the Humean intuition that the world is built from local, intrinsic facts in the way we experience it? At what point does redefining the 'mosaic' just to save the theory become an ad hoc rescue mission?"

  ### 5. Anthropocentrism and Simplicity
  **Question:** The "Best" System is chosen based on a trade-off between simplicity and strength. But simplicity isn't a mind-independent feature of the world; it's a feature of how *we* compress information. Does this make the laws of nature mind-dependent? If a super-intelligent alien with different cognitive architecture calculated the Best System, would they get different laws than we do?

  **Follow-up:** *If she argues there is an objective notion of simplicity (e.g., Kolmogorov complexity):*
  "Kolmogorov complexity is relative to a choice of Turing machine or language. If you fix the language to get a unique answer, aren't you just baking human linguistic preferences into the fabric of reality? If laws depend on our choice of language to be formulated, in what sense are they 'out there' waiting to be discovered?"

  ### 6. Counterfactual Resilience
  **Question:** We usually think laws support counterfactuals: "If I had dropped this cup, it would have fallen." But if laws just summarize the actual mosaic, what grounds the counterfactual? If the mosaic were slightly different, the Best System might change entirely. Does this mean laws are incredibly fragile?

  **Follow-up:** *If she says laws are stable across "nearby" possible worlds:*
  "But on Humeanism, there are no modal connections between worlds. To say the laws hold in a nearby world is just to say that world *also* has a mosaic that generates the same Best System. Isn't this just a massive cosmic coincidence? Without a truthmaker for the counterfactual beyond the regularity itself, how do you distinguish a law from a universal accident that just hasn't been broken yet?"

  ### 7. Temporal Asymmetry
  **Question:** The Humean mosaic is typically treated as a four-dimensional block. The Best System axioms are usually time-symmetric (like Newton's laws). But our explanatory practices are time-asymmetric (we explain effects by causes, not vice versa). Where does this asymmetry come from if the base and the laws are both symmetric?

  **Follow-up:** *If she appeals to the Past Hypothesis or entropy gradients:*
  "Those are physical posits, but the *logic* of the Best System seems to treat past and future equally. If the Best System is just a compression algorithm, it should compress equally well from both ends. If Humeanism can't ground the asymmetry of explanation without borrowing from non-Humean causal intuitions, is the view actually self-sufficient?"

  ### 8. The "Loose and Separate" Problem
  **Question:** Hume famously said objects are "loose and separate." The problem is that science finds deep structural dependencies. If the Humean says these dependencies are just patterns in the mosaic, doesn't that render the stability of the universe miraculous? Why should the mosaic be so well-behaved that it admits of a simple systematization at all?

  **Follow-up:** *If she says "That's just a brute fact, and non-Humeans have brute facts too":*
  "Non-Humeans posit a brute fact about *necessitation* which explains the stability. You posit a brute fact about the *arrangement* of the mosaic that happens to look necessitated. Isn't your brute fact much less plausible? It's one thing to say 'Nature is necessary,' it's another to say 'Nature is contingent but happens to look necessary everywhere.' Which is the bigger bullet to bite?"

  ### 9. Scientific Realism vs. Instrumentalism
  **Question:** Many scientists are realists about laws; they think they are tracking real governing principles. If you tell them, "Actually, laws are just summaries we impose on data for convenience," are you asking them to be instrumentalists about their own core theoretical commitments?

  **Follow-up:** *If she argues this is a "philosophical analysis" that doesn't change scientific practice:*
  "But metaphysics is supposed to tell us what makes science *true*. If the scientist says 'Gravity causes this' and you say 'No, "Gravity" is just a label for a pattern in the mosaic,' you are contradicting their ontological commitment. Can you really claim to be a scientific realist if you think the 'laws' scientists claim to discover don't exist as anything over and above the data?"

  ### 10. The Meta-Metaphysical Cost-Benefit
  **Question:** Let's zoom out. The main selling point of Humeanism is ontological parsimony: no powers, no universals, no necessitation. But we've just discussed the costs: struggles with explanation, chance, quantum mechanics, and counterfactuals. At what point does the theoretical complexity required to *save* Humeanism (New Principles, wave function mosaics, natural property primitives) outweigh the initial ontological savings?

  **Follow-up:** *If she argues ontological parsimony is the only virtue that matters:*
  "Why? If a view saves on entities but costs us the ability to make sense of explanation, chance, and modality without contortions, isn't that a false economy? If the 'cheaper' ontology requires a much more expensive logic to make it work, is it actually the simpler view?"
