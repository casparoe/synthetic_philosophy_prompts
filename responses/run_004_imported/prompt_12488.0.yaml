          *   His argument is that *monogamous marriage as property* inflames it.
          *   *Application:* Polyamory confirms that when you remove the "property" frame, jealousy doesn't disappear (biology), but it becomes manageable (plasticity).

      *   *Point 2: The Role of Reason and Education.*
