answer: |-
  **The Eagle Coffee House, Dublin. November 1736.**

  The air inside the Eagle was thick enough to chew, a suspension of tobacco smoke, roasted chicory, and the damp wool of men escaping the Liffey's chill. In a corner booth, illuminated by a single tallow candle, sat Dean George Berkeley. He stirred his coffee with the deliberate slowness of a man who believed haste was a sin against the intellect.

  Opposite him sat Elias Harte, a linen merchant whose hands were stained with ink and whose face was lined by the memory of the year 1720. Harte tapped a silver shilling against the table. It rang, a clear, honest sound.

  "You write cleverly, Dean," Harte said, his voice low. "Your *Querist* is the talk of the Exchange. But you ask questions where answers are needed. You suggest we might float this kingdom on paper alone. You say gold is a fetish."

  Berkeley looked up, his eyes bright behind his spectacles. "I say, Mr. Harte, that men often mistake the counter for the game. Whether the shilling in your pocket possesses any virtue other than what the law and custom of men have bestowed upon it?"

  "It possesses weight," Harte snapped. "It possesses purity. If London turns against us, if the Parliament falls, that silver buys passage to Amsterdam. Your paper note buys only the goodwill of the banker who signed it. I voted against the National Bank in '21 for this reason. And I would vote the same today."

  "Because of Law?" Berkeley asked softly.

  "Because of *ruin*," Harte corrected. "I had a cousin in Paris. When the Mississippi Bubble burst, his notes became kindling. He held a million livres in the morning and begged for bread by night. Why? Because the paper was detached from reality. It was air. You propose we fill Ireland with air and call it wealth."

  Berkeley leaned forward, clasping his hands. "Consider, sir. When your cousin held those notes, what did he expect them to procure?"

  "Labor. Goods. Land."

  "And when the bubble burst, did the land of France vanish? Did the hands of the workers disappear? Did the looms of Lyon cease to exist?"

  Harte frowned. "No. But the *trust* was broken. The medium was corrupted."

  "Precisely. The medium was corrupted because it was used not to stir industry, but to feed avarice." Berkeley paused, letting the smoke curl between them. "Whether the true end of money be not to motivate the industry of a people, and to circulate the fruits of that industry?"

  "It is a store of value," Harte insisted. "A reservoir."

  "A reservoir that stagnates!" Berkeley's voice rose, drawing a glance from a nearby table of lawyers. He lowered it again. "Mr. Harte, imagine a nation where every man sits idle. They have a vault full of gold. Are they rich?"

  "They have the *means* to become rich."

  "They have metal. They have no wealth. Wealth is the power to command the necessaries and conveniences of life. If no one ploughs, no one weaves, the gold is but yellow dirt." Berkeley tapped the table near Harte's shilling. "I do not argue for paper simply to print it. I argue for credit as a ticket. A ticket to what? To the labor of your neighbor."

  Harte leaned in, his eyes hard. "And who prints the tickets, Dean? If I may print a ticket for your labor, and you for mine, and we print a million... we are not richer. We are merely drowning in lies. That was Law's error. He thought the printing press was a mine."

  "Law's error was not the paper. It was the purpose." Berkeley's finger traced a circle in the condensation on his cup. "Whether credit, issued to fund the idleness of courtiers or the gambling of stock-jobbers, be not a poison?"

  "Agreed," Harte said. "It is poison."

  "And whether credit, issued to a man to drain a bog, or build a ship, or weave linen for export, be not a medicine?"

  Harte hesitated. "It... can be useful. If secured."

  "Secured by what?"

  "By land! By specie!"

  "Land cannot move," Berkeley said. "Specie hides. But a man's willingness to work? That is the only true security. If the National Bank issues notes only against the value of improvements to be made—only against the *future labor* of the borrower—then the note is not air. It is a claim on reality yet to be created."

  Harte shook his head, picking up his shilling again. "You place great faith in human nature, Dean. You assume the Bankers will be philosophers. They will not. They will see the press and they will print. They will lend to speculators because speculators pay higher interest than farmers. And when the crash comes, it is the farmer who hangs, not the banker."

  "A just fear," Berkeley conceded. He took a sip of his coffee. "But consider the alternative. We cling to silver. The silver flows out to pay for foreign luxuries. Our people sit idle for want of a medium to exchange their toil. We starve amidst plenty because we worship the counter and ignore the game."

  Berkeley leaned back, the candlelight catching the sharp angle of his nose. "Whether it be not better to risk the management of a bank, than to resign the fate of a nation to the accidental flow of bullion?"

  "It is not accidental," Harte argued. "It is disciplined. Gold cannot be created by a whim. It limits us. It keeps us honest."

  "It limits us to poverty," Berkeley countered gently. "Ireland is full of beggars in rags, while the earth beneath them yields abundance. Is it honesty that binds them? Or is it a lack of circulation? You fear the paper will vanish, like Law's. I fear the labor will vanish, because there is no ticket to summon it."

  Harte looked down at the shilling. He thought of the empty looms in the Liberties, the men standing on corners in the rain. He thought of his cousin in Paris, screaming at worthless notes.

  "The distinction you make," Harte said slowly. "Between credit for industry, and credit for speculation. How do you enforce it? In the heat of a boom, every gambler claims he is an industrialist."

  Berkeley smiled, a thin, weary expression. "There, Mr. Harte, you leave the realm of economics and enter the realm of virtue. Whether a nation can be rich without being virtuous? I think not. No bank can save a people determined to gamble rather than work. But neither can gold save them."

  He pushed a small pamphlet across the table. *The Querist*.

  "I do not propose we print money to chase shadows. I propose we issue tickets to wake the sleepers. If the ticket is backed by the promise of work done, it is as solid as your silver. If it is backed by greed... it is already worthless, whether printed on paper or stamped on gold."

  Harte picked up the pamphlet. He didn't open it. He weighed it in his hand. It was light. Almost insubstantial.

  "You ask whether wealth is not the power to command labor," Harte said quietly. "I say wealth is the trust that the labor will be rewarded. Law broke that trust. You ask me to risk it again."

  "I ask you to consider," Berkeley said, standing up and pulling on his clerical coat, "whether the fear of fire should prevent a man from lighting a hearth in winter."

  Berkeley dropped a coin on the table to pay for the coffee. It was copper, small, insignificant.

  "The metal matters little, Elias," the Dean said, turning toward the door. "It is the warmth it buys that counts."

  Harte sat alone in the booth. He looked at the copper coin, then at the pamphlet, and finally at his own silver shilling. Outside, the rain lashed against the cobblestones of Dublin. Somewhere in the dark, a man was shivering for want of work, and another was shivering for want of bread.

  Harte closed his fist around the silver. It was cold. He opened the pamphlet.

  "Whether the making of money be not the only way to get wealth?" he read aloud to the empty chair.

  He sighed, signaled the boy for more coffee, and began to read.
