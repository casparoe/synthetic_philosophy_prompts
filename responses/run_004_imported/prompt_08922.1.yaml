      *   *Assumption 2: Common Knowledge of Posteriors.* Do they *really* know exactly what the other believes and *why*? They know the number (70/30), but do they know the weighting of the evidence?
      *   *Assumption 3: Truthfulness/Common Knowledge of Rationality.* Are they both updating perfectly via Bayes' Rule? Humans are notoriously bad at Bayesian updating. We have confirmation bias, overconfidence, etc.
      *   *Assumption 4: Information Partition.* Did they actually share *everything*? "Burnt out in texts" is subjective. Sales numbers are objective. Interpretation differs.
      *   *Conclusion:* Real humans are not ideal Bayesians. The theorem holds for idealized agents, not humans.

