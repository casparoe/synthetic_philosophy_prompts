answer: |-
  ### The Example: The 5-and-10 Problem with Self-Knowledge

  A canonical example of a decision problem where embeddedness creates a failure for standard reasoning is the **5-and-10 Problem** (specifically, the variant involving an agent with knowledge of its own source code).

  **The Setup:**
  Imagine an agent situated in an environment where it must choose between taking a \$5 bill or a \$10 bill. The utility function is straightforward: the agent prefers more money. There are no external predictors, no other players, and no hidden boxes.

  **The Cartesian Agent:**
  A Cartesian agent models itself as standing outside the environment. It treats its action as an independent intervention. It reasons: "If I take \$5, I get \$5. If I take \$10, I get \$10. Since \$10 > \$5, I will take \$10." This reasoning is trivial and successful. The agent assumes it has the freedom to select either branch of the counterfactual ("What if I took \$5?" vs. "What if I took \$10?") without those counterfactuals contradicting the laws of physics or logic.

  **The Embedded Agent:**
  An embedded agent, however, recognizes that it is a physical (or computational) process within the environment. Crucially, suppose this agent has **access to its own source code**. It knows that it is a deterministic algorithm. Let us say the agent's code is designed to maximize utility.

  When this embedded agent attempts to apply standard expected-utility reasoning, it tries to evaluate the counterfactual: *"What would happen if I took the \$5?"*

  Here lies the difficulty: If the agent's source code logically dictates that it will take the \$10 (because \$10 > \$5), then the statement "I take the \$5" is logically **false**. In classical logic, a false premise implies *anything* (the principle of *ex falso quodlibet*). Therefore, the agent can logically prove: "If I take the \$5, then $0=1$, and if $0=1$, then I receive \$1,000,000."

  Consequently, the agent may calculate that the expected utility of taking \$5 is infinite (or arbitrarily high), while the utility of taking \$10 is merely 10. Driven by this "spurious counterfactual," the embedded agent takes the \$5, failing to secure the obvious \$10.

  ### Why the Trouble Depends on Embeddedness

  The failure arises precisely because the agent treats its own reasoning process as an object within the environment it is reasoning about.

  1.  **Loss of Counterfactual Independence:** Standard expected-utility reasoning (specifically Causal Decision Theory) relies on the ability to treat actions as interventions ($do(Action)$). This mathematical operator effectively severs the causal links leading *into* the action node, allowing the agent to ask, "What happens if I force this action?" A Cartesian agent assumes it can do this. An embedded agent knows it cannot "force" an action that contradicts its own source code. Its action is a logical output of its reasoning, not an external input.
  2.  **Self-Reference and Logical Correlation:** Because the agent is embedded, its decision is a fact about the universe that is logically correlated with its own predictions. When the agent simulates the world to evaluate an action, it must simulate *itself* making that action. If the agent knows its own code, it knows that simulating "taking \$5" is simulating a logical contradiction (assuming it is determined to take \$10).
  3.  **The Environment Contains the Agent:** In the Cartesian view, the environment is $E$ and the agent is $A$, and $A$ is not part of $E$. In the embedded view, $A \subset E$. When the agent reasons about $E$, it is reasoning about a system that contains $A$. This creates a self-referential loop. The agent cannot construct a consistent model of "What if I did otherwise?" because "otherwise" implies its own source code behaves differently than it does, which breaks the logical consistency of the model.

  ### Opinion: Technical Wrinkle or Deep Limit?

  In my view, this difficulty reflects something **deeper about the limits of formal rationality**, rather than being a merely solvable technical wrinkle.

  While researchers have proposed decision theories like Functional Decision Theory (FDT) or Updateless Decision Theory (UDT) to navigate these specific problems, these solutions require abandoning the intuitive notion of "choosing" as a local causal intervention. They force us to accept that rational agents must reason about *policies* or *logical outputs* rather than *actions*.

  The deeper limit is rooted in **Gödelian incompleteness and the impossibility of a complete self-model**. A system cannot fully contain a truthful model of itself without running into paradoxes (Tarski's undefinability theorem). An embedded agent can never be certain it has correctly modeled its own future reasoning, because that reasoning depends on the model itself.

  This suggests that "perfect rationality" is not a fixed point that an embedded agent can occupy. Instead, rationality for embedded agents is necessarily approximate, heuristic, and perhaps fragmented. The difficulty highlights that the Cartesian ideal of a "view from nowhere"—a neutral vantage point from which to evaluate hypothetical interventions—is physically and logically impossible for any agent that is part of the universe it seeks to understand. We are not just solving a decision problem; we are confronting the structural limits of self-reference in a finite universe.
