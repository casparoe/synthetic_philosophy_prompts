answer: |-
  **MEMORANDUM**

  **TO:** State Consumer-Lending Oversight Board
  **FROM:** [Your Name/Office], Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation for Rulemaking on Short-Term Loan Rollovers and Repayment Plans

  ### I. Purpose
  This memo recommends a final rule regarding the renewal ("rollover") of state-licensed short-term loans. Pursuant to our statutory authority to prohibit unfair, deceptive, or abusive (UDA) terms or practices, this recommendation seeks to balance the demonstrated need for short-term liquidity against the risks of perpetual debt accumulation. The proposed rule establishes a limit on consecutive rollovers and mandates a transition to an amortizing installment plan thereafter.

  ### II. Background and Data
  Current licensing regulations permit borrowers to renew a two-week short-term loan indefinitely by paying a fee, with no reduction in principal. Board data indicates a bifurcated usage pattern:
  1.  **Majority Usage:** Most borrowers utilize one rollover or none, retiring the debt within one month.
  2.  **Minority Usage:** A distinct minority of borrowers renew the same loan consecutively for extended periods.

  In the latter category, data shows borrowers routinely pay cumulative fees exceeding 100% of the original principal before the debt is retired. This cohort generates a disproportionate share of statewide rollover fee revenue.

  ### III. Statutory Authority
  The enabling statute empowers the Board to prohibit practices found to be "unfair, deceptive, or abusive." While "abusive" is not explicitly defined in statute, regulatory precedent and legislative history suggest a practice is abusive when it:
  *   Materially interferes with a consumer's ability to understand a term or condition; or
  *   Takes unreasonable advantage of a consumer's lack of understanding, inability to protect their interests, or reasonable reliance on the lender to act in their interests.

  The accumulation of fees exceeding principal without principal reduction presents a prima facie case of abusiveness under this standard, as it suggests the product is functioning less as a bridge to liquidity and more as a long-term credit facility with usurious effective rates.

  ### IV. Summary of Board Perspectives
  The Board has heard two compelling, good-faith arguments regarding the appropriate regulatory response.

  **1. The Protectionist View (Pro-Cap)**
  This perspective argues that the economic model of unlimited rollovers relies on "time-inconsistency." Borrowers may intend to repay in two weeks but, when faced with the choice at the due date, defer payment due to immediate cash constraints. Proponents argue that when revenue relies on this deferral, the product is structurally designed to exploit the gap between a borrower's long-term intent and short-term vulnerability.

  **2. The Access and Autonomy View (Anti-Cap)**
  This perspective argues that rollovers function as a vital harm-reduction mechanism. Exit interviews indicate that heavy-rollover borrowers often choose extension to avoid materially worse outcomes, such as bank overdraft fees, utility shut-offs, or recourse to unlicensed illegal lenders. Proponents argue that repeated renewal represents a reasoned hierarchy of options by an adult consumer. They contend that removing the rollover option does not eliminate the financial distress but rather removes the least harmful coping mechanism available, potentially forcing default.

  **Board Assessment:** Both views identify valid consumer interests. The Access view correctly identifies that short-term credit serves a need and that denying *all* flexibility causes harm. The Protectionist view correctly identifies that *infinite* flexibility without principal reduction transforms a short-term product into a long-term debt trap. The recommended rule attempts to synthesize these views by preserving the short-term utility of the rollover while terminating the practice before it becomes abusive.

  ### V. Recommended Rule
  The Board is advised to adopt the following provisions:

  **A. Rollover Limit**
  A licensee shall not permit more than **three (3) consecutive rollovers** on a single short-term loan principal.
  *   *Definition:* A "rollover" occurs when a borrower pays a fee to extend the due date of the existing principal without making a principal payment.
  *   *Effect:* This allows a borrower to hold a loan for a total of eight weeks (Initial 2-week term + 3 x 2-week extensions).

  **B. Mandatory Installment Plan Trigger**
  Upon the borrower's request for a fourth renewal (or at the maturity of the third rollover), the lender **must** offer and enroll the borrower in a mandatory installment repayment plan.
  *   **Terms:** The plan must amortize the outstanding principal over a minimum of **90 days**.
  *   **Fees:** No additional fees, interest, or charges may be assessed upon entry into the installment plan or during its duration.
  *   **Default:** A borrower who defaults on the installment plan may not be issued a new short-term loan for 90 days following the resolution of the default.

  **C. Application to Existing Loans (Mid-Sequence)**
  This rule shall apply to all open loans as of the Effective Date.
  *   **Counting:** Rollovers occurring prior to the Effective Date count toward the three-rollover limit.
  *   **Transition:** If a loan is currently in a rollover sequence (e.g., on its second rollover) when the rule takes effect, the borrower may complete that specific term. However, they may not renew beyond the statutory cap (three total rollovers) even if the loan sequence began prior to the rule.
  *   **Rationale:** This prevents a "rush to renew" before the rule takes effect while honoring the contractual term currently in force.

  **D. Compliance Timeline**
  Licensees shall have **ninety (90) days** from the date of final rule adoption to update loan origination systems, disclosure documents, and staff training protocols to ensure compliance.

  ### VI. Rationale for Recommendation
  This recommendation adopts a "Safety Valve" approach designed to address the statutory mandate while respecting borrower agency.

  **1. Addressing the "Abusive" Standard**
  Allowing a loan to be renewed indefinitely with fees exceeding principal creates a scenario where the lender's revenue expectation relies on the borrower's inability to exit. By capping rollovers at three, we acknowledge that short-term deferral is legitimate, but assert that a product requiring more than two months of fee-only deferral without principal reduction crosses into "abusive" territory.

  **2. Validating the Access Argument**
  We take the Board's Access camp arguments seriously. A flat prohibition on rollovers (a "one-and-done" rule) would ignore the reality that financial emergencies often last longer than two weeks. By permitting three rollovers (eight weeks total coverage), we preserve the utility of the product for extended emergencies, validating the borrower's judgment that a rollover is preferable to an overdraft or default in the short term.

  **3. Ensuring a Viable Exit**
  The Access camp's concern is that caps force borrowers into worse outcomes. This is mitigated by the **Mandatory Installment Plan**. By requiring a no-fee, 90-day amortization schedule, we ensure that when the rollover option expires, the borrower is not forced into immediate default. This provides the "off-ramp" that protects the borrower from the debt spiral without cutting off the creditor's ability to collect the principal.

  **4. Market Stability**
  The 90-day compliance window allows lenders to adjust IT systems without disrupting current borrowers. Counting prior rollovers toward the cap prevents lenders from resetting sequences to bypass the rule, ensuring the integrity of the limit.

  ### VII. Conclusion and Voting Question
  The status quo allows for a minority of borrowers to enter a fee spiral that contradicts the consumer protection mandate of this Board. However, a prohibition that ignores the genuine utility of short-term extensions risks harming the very consumers we seek to protect.

  This recommendation strikes a balance: it respects the borrower's repeated choice to extend credit as a rational response to short-term constraints, while establishing a boundary where that choice no longer serves the borrower's long-term financial interest.

  **Motion:**
  I move to adopt the rule limiting consecutive short-term loan rollovers to three, mandating a no-fee installment plan thereafter, with a 90-day compliance timeline and immediate application to existing loan sequences at their next renewal point.
