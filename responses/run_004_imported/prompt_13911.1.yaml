  ### **Advice for Priya:**
  Tell her she has the history right, but she needs to read Kuhn more like a philosopher and less like a historian. When Kuhn says "incommensurable," he means you can't even agree on what the data *is*, let alone what to call it. If she fixes the "same gas" line and nuances the conclusion about evidence (changing "isn't something evidence can settle" to "is not determined by evidence alone"), she easily jumps into the 17/20 range.
