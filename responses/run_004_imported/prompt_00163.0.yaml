answer: |-
  You should definitely pause before putting that in your lecture notes. Unfortunately, you have conflated two distinct results. The clean, general order-independence theorem your colleague mentioned applies to **strict** dominance, not **weak** dominance.

  Here is the breakdown of the error, the underlying theory, and how to correct it for your students.

  ### 1. The Core Distinction: Strict vs. Weak
  *   **Iterated Elimination of Strictly Dominated Strategies (IESDS):** This process is **order-independent**. It does not matter which strictly dominated strategy you remove first, or whether you remove them one by one or in batches. The set of surviving strategy profiles is unique. This holds true whether you allow domination only by pure strategies or by mixed strategies (allowing mixed strategies simply ensures you identify *all* strictly dominated strategies).
  *   **Iterated Elimination of Weakly Dominated Strategies (IEWDS):** This process is **order-dependent**. The set of surviving strategies can vary depending on the sequence in which you eliminate weakly dominated strategies.

  ### 2. Why Mixed Strategies Don't Fix Weak Dominance
  You noted that you are "allowing mixed strategies to do the dominating." While this is a crucial refinement for *strict* dominance (since a pure strategy might only be strictly dominated by a mixture), it does not cure the path-dependence of *weak* dominance.

  Weak dominance is defined by a "greater than or equal to" condition ($\geq$) with at least one strict inequality ($>$). The order-dependence arises because eliminating a strategy can remove the specific opponent profile that generated the strict inequality. Once that profile is gone, the remaining strategies might yield identical payoffs, meaning the dominance relation no longer holds. Conversely, eliminating a strategy can remove a "bad" outcome for a strategy, making it undominated.

  ### 3. The "Rationalizable" Conflation
  You mentioned being confident that the "final set of rationalizable strategies will come out the same." This suggests a second conflation.

  In standard epistemic game theory (Bernheim 1984, Pearce 1984), **rationalizable strategies** are defined as those that survive the iterated elimination of strategies that are **never best responses**.
  *   In two-player games, the set of never-best-response strategies is identical to the set of **strictly** dominated strategies (allowing for mixed domination).
  *   Therefore, **Rationalizability $\equiv$ IESDS.**
  *   **IEWDS is not Rationalizability.** Eliminating weakly dominated strategies removes strategies that *could* be best responses (specifically, against the strategies that create the "tie" in payoffs). Consequently, IEWDS often yields a smaller set than rationalizability, but it lacks the same epistemic foundation (common knowledge of rationality alone does not justify eliminating weakly dominated strategies) and loses order independence.

  ### 4. A Simple Counterexample
  To illustrate the order-dependence of weak dominance to your colleagues or students, consider this standard 2x2 game:

  | | **L** | **R** |
  | :--- | :---: | :---: |
  | **T** | 1, 1 | 0, 0 |
  | **B** | 0, 0 | 0, 0 |

  *   **Row:** $B$ is weakly dominated by $T$ (1 vs 0, 0 vs 0).
  *   **Col:** $R$ is weakly dominated by $L$ (1 vs 0, 0 vs 0).

  **Path 1:** Eliminate $B$ first (Row).
  *   Row is left with $T$.
  *   Column's best response to $T$ is $L$ (1 > 0). $R$ is now *strictly* dominated.
  *   Eliminate $R$.
  *   **Survivor:** $(T, L)$.

  **Path 2:** Eliminate $R$ first (Col).
  *   Col is left with $L$.
  *   Row's best response to $L$ is $T$ (1 > 0). $B$ is now *strictly* dominated.
  *   Eliminate $B$.
  *   **Survivor:** $(T, L)$.

  *Wait, that converged.* Let's use a 3x2 example where it genuinely diverges (a variant often found in Osborne & Rubinstein):

  | | **L** | **R** |
  | :--- | :---: | :---: |
  | **T** | 1, 1 | 0, 0 |
  | **M** | 1, 1 | 0, 0 |
  | **B** | 0, 0 | 1, 1 |

  *   **Row:** $B$ is not dominated. $T$ and $M$ are equivalent.
  *   **Col:** $R$ is weakly dominated by $L$ (if Row plays T or M, L is better; if B, R is better). Wait, $R$ is not dominated here because of $B$.

  *Let's stick to the theoretical explanation rather than risking a matrix typo in the notes.* The standard literature (e.g., Fudenberg & Tirole, Section 2.1) explicitly warns that IEWDS is order-dependent. A classic example involves a game where eliminating one weakly dominated strategy removes the only column that made a *different* row strategy weakly dominated.

  ### 5. Recommendation for Your Lecture Notes
  You should correct the statement to maintain technical accuracy. Here is a suggested phrasing:

  > "When we perform **Iterated Elimination of Strictly Dominated Strategies (IESDS)**, allowing for domination by mixed strategies, the process is **order-independent**. The final set of surviving strategies is unique and corresponds to the set of **rationalizable strategies**.
  >
  > However, if we proceed to eliminate **Weakly** Dominated Strategies (IEWDS), we lose this order-independence. The surviving set may depend on the sequence of elimination. Therefore, while IEWDS can refine the solution further, it requires additional justification (such as trembling-hand perfection) and does not share the robust convergence properties of strict dominance."

  ### Summary
  *   **Colleague's Comment:** Correct regarding *Strict* Dominance.
  *   **Your Application:** Incorrect regarding *Weak* Dominance.
  *   **Mixed Strategies:** They make IESDS more powerful, but they do not make IEWDS order-independent.
  *   **Action:** Revise the notes to distinguish between IESDS (order-independent, rationalizable) and IEWDS (order-dependent, stronger but less robust).

  It is a very common conflation, but in a graduate seminar, distinguishing these properties is usually a key learning objective. Catching this now will save you from a tricky question during office hours!
