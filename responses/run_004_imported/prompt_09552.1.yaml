  6.  *(Drafting the content based on the above plan...)* -> *See final output.*
      *   *Note:* I need to make sure the distinction between "Manifold Substantivalism" (the target of the Hole Argument) and "Sophisticated Substantivalism" (the defense) is clear without being jargon-heavy.
