      *   *Check:* Is "Impossible Worlds" strictly contradictory for Leibniz? Yes. For Leibniz, modality is grounded in the divine intellect. God cannot think contradictions. Therefore, they have no being even as objects of thought in a "world."
      *   *Nuance:* Hintikka's impossible worlds are often semantic devices, not metaphysical claims. Leibniz, being a metaphysician first, would likely attack the metaphysical coherence of the device if proposed as representing "ways things could be." I need to make sure I address the *semantic* utility vs. *metaphysical* commitment. Leibniz would likely say a semantics relying on "non-beings" is flawed.

