prompt: |-
  After thirty years doing numerical relativity I retired and fell into philosophy of physics, and these days I co-host a tiny podcast where we get philsophers on to argue with a room full of ex-scientists. Next month's guest defends 'sophisticated substantivalism': she thinks spacetime points are real substantival individuals, but she dodges the Earman-Norton indeterminism argument by denying points have haecceities, so diffeomorphic models don't count as different possibilities. Write me eight to ten interview questions that push past her just restating the position -- I want at least one on whether dropping haecceitism while keeping 'individual' points is even coherent, or whether shes just a relationalist who won't say so, one tying the hole argument back to Leibniz's old shift argument against Newton (new problem, or the same one in modern dress?), and one on whether calling the diffeomorphisms 'gauge', like the redundancy in a Yang-Mills potential, commits her to more than she'd like. Give each question a short follow-up keyed to the answer she's most likely to give, and end on a question that makes her say what observation or argument would actually change her mind.
