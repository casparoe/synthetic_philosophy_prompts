answer: |-
  Good evening, everyone. For those who don't know, I teach philosophy for a living. Which means my parents have been very brave to let me hold the microphone. They specifically asked me to avoid the "Ship of Theseus" argument. Apparently, Uncle Jerry exhausted that one two anniversaries ago, and we are still not allowed to replace the patio furniture without a departmental review.

  So, instead, I want to talk about a different puzzle. In metaphysics, there's a problem called "The Statue and the Clay."

  Imagine a sculptor takes a lump of clay and shapes it into a statue. At that moment, you have the clay, and you have the statue. They occupy the same space. They weigh the same. But are they the *same thing*?

  Philosophers say no. Why? Because they have different "persistence conditions." Different rules for what it takes to survive. If you squash the statue, the clay survives, but the statue is gone. If you melt the clay, the statue is definitely gone. They travel together through time, but they aren't identical.

  I bring this up because, after forty years, I've realized my parents' marriage works the exact same way.

  Mom and Dad, you are the clay. You are distinct, wonderful, changing individuals. You have your own lives, your own careers, your own aging processes. But the *Marriage*? The Marriage is the statue.

  It is constituted by you, but it isn't *just* you. It isn't even the sum of the two of you. It is a distinct entity with its own life.

  Think about the logic of it. Over forty years, you have both changed immensely. If you were the same people you were in 1984, this union wouldn't have lasted a month. The marriage has survived changes that would have shattered either of you individually. It absorbed job losses, moves, sickness, and kids. The clay shifted shape constantly, but the statue held.

  But here is the part that matters most. The statue can cease to exist, even if the clay remains intact. A marriage can end, while both people walk away alive and whole. That is a modal mismatch. It means the marriage is fragile. It is a real thing, worthy of its own name, precisely because it *could* have been lost without destroying either of you.

  But you didn't let it squash. You didn't let it melt.

  For forty years, you have maintained the persistence conditions of this union. You have protected something that is greater than the parts that make it up. You have kept the statue standing.

  So, I ask you all to raise a glass. To the clay: may you continue to thrive. But mostly, to the statue: To the Marriage itself. For surviving when it didn't have to, and for being a real thing in the world that we are all lucky enough to witness.

  Happy 40th Anniversary.
