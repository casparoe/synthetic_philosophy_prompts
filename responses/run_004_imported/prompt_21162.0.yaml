answer: |-
  This is a fantastic skeleton. You are asking the right historiographical and philosophical questions, and your instinct to pause before fleshing it out is wise—this specific intersection (Carnap + Politics + Tolerance) is a minefield of common conflation.

  Here is feedback on your four points, followed by a suggestion for sharpening the central claim.

  ### 1. The History (Manifesto & Sympathies)
  **Verdict:** Roughly right, but needs a specific nuance regarding *degree*.
  You are correct that Carnap co-signed the 1929 manifesto (*Wissenschaftliche Weltauffassung*) and that it explicitly links the scientific world-conception to social progress ("Internationalism of the scientific spirit..."). However, historians (like Thomas Uebel and Alan Richardson) often note a distinction in intensity. Neurath was the political engine; Carnap was the logical engineer. Carnap's socialism was often more of a ethical-humanitarian commitment to rationalization and the reduction of suffering than Neurath's active, revolutionary Marxism.
  **Advice:** Don't overstate Carnap's activism. Frame it as Carnap believing that *logical clarity* was a prerequisite for *social progress*, whereas Neurath believed social progress was the *goal* of logical clarity. It's a subtle difference, but it protects you from the charge of turning Carnap into a revolutionary agitator.

  ### 2. The "Tolerance vs. Planning" Puzzle
  **Verdict:** This is a **substantive philosophical question**, not a false dilemma. In fact, it is the strongest part of your potential argument.
  Many readers assume "Tolerance" implies a laissez-faire relativism ("anything goes") which contradicts the assertiveness of central planning ("we know the rational way"). However, Carnap's Tolerance is about *frameworks*, not outcomes within a framework.
  **The Fix:** The tension dissolves if you frame Planning not as "discovering the metaphysically True Economy" but as "adopting a linguistic/conceptual framework that maximizes specific utility functions (e.g., equality, stability)."
  For Carnap, asking "Is socialism the *true* system?" is a pseudo-question (metaphysical). Asking "Is the socialist framework more *efficient* for our chosen goals than the capitalist framework?" is a legitimate internal question. Therefore, Tolerance *supports* planning by stripping it of metaphysical baggage. It turns economics into pure engineering. This is a much stronger claim than "there is a tension."

  ### 3. The Carnap vs. Neurath Conflation
  **Verdict:** **This is your weakest point and the biggest historical risk.**
  You are right to be worried. Neurath is the one who developed "calculation in kind" (*Naturalrechnung*) to answer Mises. Neurath is the one who argued that a moneyless economy was physically calculable. Carnap's contribution was providing the *logical legitimacy* for Neurath's physicalism.
  **Advice:** Be explicit about the division of labor. Do not attribute the economic calculation arguments to Carnap. Instead, argue that Carnap's *Logical Syntax* provided the **philosophical immunity** Neurath needed. When Mises said socialist calculation was "impossible" (often implying logically or epistemically), Carnap's Tolerance allows the response: "It is not impossible; it is just a different linguistic framework. Prove it is less *useful*, do not claim it is *incorrect*."
  *Hedging strategy:* Use phrases like "Carnap provided the logical scaffolding for Neurath's economic views" rather than "Carnap advocated for in-kind calculation."

  ### 4. The Cold War/Reisch Angle
  **Verdict:** Good context, but keep it as an epilogue.
  George Reisch's *How the Cold War Transformed Philosophy of Science* is the standard text here, and his thesis is robust. The worry about anachronism is valid: you don't want to explain Carnap's 1934 views by referencing 1950s McCarthyism.
  **Advice:** Use Reisch to explain why this connection was *lost*, not to explain the connection itself. It serves as a poignant conclusion: "Here was a philosophy designed to aid social reconstruction, which was subsequently neutered into a tool for analytic puzzle-solving." This adds emotional weight without compromising the historical analysis of the 1930s.

  ### Sharpening the Central Claim
  Your current working claim is: *"There's an interesting tension between Carnap's pluralism about logic and his sympathy for planning."*

  I suggest flipping the script. The tension is only apparent; the reality is **mutual reinforcement**.

  **Proposed Claim:**
  > "Carnap's Principle of Tolerance was not merely a methodological rule for logic, but a political tool: by recasting economic systems as linguistic frameworks rather than metaphysical truths, Carnap sought to immunize socialist planning against apriorist objections (like Mises's) and transform social organization into a matter of pragmatic engineering."

  **Why this is better:**
  1.  **It solves the Tolerance/Planning puzzle:** Tolerance doesn't hinder planning; it enables it by removing the "True/False" barrier.
  2.  **It clarifies the Carnap/Neurath relationship:** Carnap provides the "immunity" (logic); Neurath provides the "engineering" (economics).
  3.  **It raises the stakes:** It moves the post from "Carnap was also a socialist" to "Carnap's logic was *designed* to facilitate socialism."

  ### Summary of Recommendations for the Draft
  1.  **Point 3 needs the most hedging.** Clearly distinguish Neurath's economic specificities from Carnap's logical permissions.
  2.  **Reframe Point 2.** Don't present Tolerance and Planning as opposing forces. Present Tolerance as the *condition of possibility* for non-dogmatic Planning.
  3.  **Use the Internal/External distinction (proto-version).** Even though *Empiricism, Semantics, and Ontology* is later, the seed is in *Syntax*. The choice of an economic system is an "external" pragmatic choice; the management of that system is an "internal" scientific task.
  4.  **Keep Reisch for the end.** Don't let the Cold War narrative overshadow the 1930s argument.

  If you write this, you'll be contributing to a specific and very active niche in the history of analytic philosophy (the "Political Carnap" revival led by scholars like Uebel, Richardson, and Carus). It's a solid angle.
