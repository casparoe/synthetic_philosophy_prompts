          *   *Difference 1 (Normative vs. Descriptive):* Prospect Theory says "humans *do* this (and it's often a bias)." REUT says "it is *permissible* to reason this way."
          *   *Difference 2 (Loss Aversion vs. Risk Attitude):* Teodor conflates loss aversion (Prospect Theory) with risk weighting (REUT). Loss aversion is about the *value* of losses vs. gains. Risk weighting is about the *structure* of the gamble itself. You can be risk-averse over gains without loss aversion.
          *   *Difference 3 (The "Why"):* Teodor thinks it's a post-hoc rationalization of a trauma response (his inability to bet). Buchak argues it's a fundamental attitude toward risk inherent in rational agency.

