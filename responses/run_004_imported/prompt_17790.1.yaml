      *   *Emotional Core:* Teodor feels broken because he can't act like a rational agent (EUT). Ilse needs to show him that his caution might be structurally rational, even if his specific paralysis is trauma-induced. Or, she needs to show him that the theory doesn't save him from the responsibility of choice.

  5.  **Drafting the Technical Explanation (for the User):**
