      *   **Prospect Theory (Kahneman & Tversky):** Descriptive/Psychological.
          *   Reference dependence (gains/losses relative to a status quo).
          *   Loss aversion (losses hurt more than gains feel good).
          *   Probability weighting ($\pi(p)$): People overweight small probabilities and underweight moderate/high probabilities. This is non-linear.
          *   *Status:* It describes how people *do* behave (often irrationally/inconsistently), not necessarily how they *should* behave.
      *   **Risk-Weighted Expected Utility Theory (REUT) (Lara Buchak):** Normative/Philosophical.
          *   Book: *Risk and Rationality* (2013).
          *   Formula: $V = \sum [r(p_i) - r(p_{i-1})] \cdot u(x_i)$ (roughly, using a risk function $r$). Or more simply, it introduces a risk function $r$ that transforms cumulative probabilities.
          *   *Key Distinction:* Buchak argues that caring about the *distribution* of outcomes (risk) is a separate preference from caring about the *value* of outcomes (utility).
          *   *Status:* It argues that being risk-averse (or risk-seeking) is *rational*, not a bias. It's about global preferences over gambles, not just local attitudes toward money.

  3.  **Evaluate Teodor's Claim:**
      *   *Teodor's Claim:* REUT is just Prospect Theory's probability weighting renamed to sound rational. It's "loss aversion wearing a philosopher's coat."
