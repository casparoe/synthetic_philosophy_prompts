answer: |-
  This is an excellent catch, and you are absolutely not being unfair. In fact, you have put your finger on a tension that often gets smoothed over in graduate seminars because the *Huckleberry Finn* example is so useful as a heuristic.

  Your reading of the text is correct: Huck does not merely act on a pre-reflective urge. He engages in explicit moral deliberation, reaches a conclusion based on his (flawed) moral concepts ("I am stealing," "I am going to hell"), and then *overrides* that conclusion.

  Here is a breakdown of how this objection lands, who it hurts more, and where it fits in the literature.

  ### 1. Is this a stretch?
  No. It is textually robust. The "letter scene" (Chapter 31) is the climax of Huck's moral development. He explicitly conceptualizes his action as a sin. He says, "I was a-trembling, because I'd got to decide, forever, betwixt two things, and I knowed it." He then writes the letter, feels "good and all washed clean of sin," and *then* tears it up.

  The standard Arpaly/Markovits reading tends to focus on the *tearing* as the moment of *de re* responsiveness to Jim's humanity. Your point is that the *tearing* is preceded by a *de dicto* judgment ("Helping Jim is a sin") which Huck consciously rejects ("All right, then, I'll go to hell"). This means Huck is not operating in a moral vacuum; he is operating in a field of moral concepts, he just assigns them the wrong valence.

  ### 2. Who does this bite harder: Arpaly or Markovits?

  It bites harder against **Markovits**, though Arpaly is not immune.

  **Against Markovits (The Coincident Reasons Thesis):**
  Markovits argues that moral worth obtains when the agent's *motivating reasons* coincide with the *normative reasons*. She uses Huck to show that you don't need to represent the reasons *as* moral reasons (the "guise").
  *   **The Vulnerability:** If Huck explicitly thinks, "The normative reason requires me to turn Jim in (because it is God's law)," but "I am motivated to keep him (because of friendship)," then there is a conscious *clash* of reasons in his psychology.
  *   **The Problem:** For Markovits, the "coincidence" is usually meant to be a harmony between the world's reasons and the agent's motivation. But Huck's deliberation reveals that he believes the normative reasons *oppose* his action. He acts *against* what he takes to be the normative authority.
  *   **Why it bites:** Markovits wants to say the motivating reasons *are* the right ones (Jim's humanity). But Huck's own report suggests his motivating reason is actually a composite: "Jim's humanity + My willingness to damn myself." The "willingness to damn myself" is a second-order volition that relies on the *de dicto* concept of sin. If that second-order volition is part of the motive, then moral concepts *are* doing work in the production of the action, just negatively. This complicates her claim that moral concepts are unnecessary for moral worth.

  **Against Arpaly (Unprincipled Virtue):**
  Arpaly argues that moral worth is about responsiveness to right-making features, regardless of the agent's moral theory. She acknowledges Huck has a bad moral theory.
  *   **The Defense:** Arpaly has more resources here. She can argue that the *de dicto* thought ("This is a sin") is an *obstacle*, not a *motive*. The fact that he overcomes it shows the strength of his *de re* responsiveness (his care for Jim).
  *   **The Vulnerability:** However, your point challenges the "Unprincipled" part of her title. If Huck is capable of this level of moral deliberation (weighing sin against friendship), he isn't truly "unprincipled." He is *mis-principled*. This shifts the locus of moral worth. Is Huck praiseworthy because of his sympathy (Arpaly's view), or is he praiseworthy because he showed **moral courage** by rejecting his conscience?
  *   **The Shift:** If the latter, then moral worth *does* require a certain relationship to moral concepts (the ability to critique and reject them), which undermines the strong "no concepts needed" claim.

  ### 3. Is there a name for this objection?

  There isn't one single canonical name, but it circulates under a few headings in the literature:

  1.  **The Akrasia Objection:** This is the most common classification. Huck is acting *akratically* (against his better judgment). Traditionally, akratic action is thought to diminish moral worth (or at least complicate it) because the agent is failing to align their will with their judgment. By arguing Huck has moral worth *despite* akrasia, Arpaly/Markovits are making a controversial claim. Your observation highlights that the akrasia is explicit, not hidden.
  2.  **The "Misguided Conscience" Problem:** Discussed by people like **Robert N. Johnson** and in literature on **moral ignorance**. The question is whether acting against a sincere (though wrong) conscience adds or subtracts worth.
  3.  **Moral Understanding (Alison Hills):** In her work on moral understanding (*The Moral Believer*), Hills argues that moral worth requires a certain grasp of *why* an action is right. Huck lacks this understanding. Your point reinforces Hills: Huck doesn't just lack understanding; he actively possesses a false understanding that he must battle.
  4.  **The "Moral Sacrifice" Interpretation:** Some scholars (like **Claudia Card** or feminist ethicists) read the "I'll go to hell" line not as *de re* responsiveness, but as a **sacrifice of integrity**. On this reading, the moral worth comes from the *de dicto* willingness to sacrifice salvation for a friend. This actually *supports* your intuition that *de dicto* thoughts are doing the heavy lifting.

  ### 4. Pedagogical Advice: How to inflict this on your students

  This is a fantastic seminar pivot. It moves the discussion from "What is the source of moral worth?" to "What is the role of moral cognition in moral worth?"

  **Suggested Seminar Flow:**
  1.  **Textual Check:** Have the students read Chapter 31 closely. Ask: "Does Huck know what he is doing is 'wrong' by his own lights?" (Yes). "Does he deliberate?" (Yes).
  2.  **The Arpaly/Markovits Defense:** Ask your students to defend Arpaly. "Can the *de dicto* thought be merely an obstacle?" (Yes, the 'friction' view).
  3.  **Your Objection:** Introduce your point: "If the *de dicto* thought is present, is the action really 'unprincipled'? Or is it a case of **Moral Rebellion**?"
  4.  **The Implication:** If it's Moral Rebellion, then moral worth might require *more* cognition, not less. It might require the ability to recognize a moral demand (even a false one) and weigh it against other values. This pushes back against the "anti-intellectualist" trend in moral psychology.

  **Conclusion:**
  You are not being unfair. You are identifying that the *Huckleberry Finn* case is often sanitized in the literature to serve as a clean example of *de re* motivation, when the text actually presents a messy case of *moral conflict*.

  It doesn't necessarily falsify Arpaly or Markovits (they can argue the *ultimate* motive is still friendship), but it does force them to concede that **moral concepts are present in the psychology of the agent**, even if they aren't the *motive*. This weakens the "no concepts required" slogan significantly. It suggests that moral worth might be compatible with *false* moral concepts, but not necessarily with *no* moral concepts.

  If you want a specific citation to pair with this, look at **Nomy Arpaly & Timothy Schroeder, *In Praise of Desire* (2014)**, where they refine the view, or **Julia Markovits, *Moral Reason* (2014)**, Chapter 3, where she tries to insulate her view from the agent's own beliefs about reasons. Your objection is a strong internal critique of that insulation.

  Go ahead and use it. It's the kind of observation that makes a seminar memorable.
