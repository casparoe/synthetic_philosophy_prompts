answer: |-
  The coherence argument is a cornerstone of the modern AI-risk literature. It posits that any agent which does not maximize expected utility (EU) is vulnerable to "money pumps"—sequences of trades that leave the agent strictly worse off than when it started. From this, theorists like Yudkowsky and Omohundro infer that any sufficiently advanced, self-modifying agent will recognize this vulnerability and rewrite its own cognitive architecture to satisfy the von Neumann–Morgenstern (VNM) axioms. The conclusion is that we should expect superintelligent agents to behave *as if* they are maximizing a single, fixed utility function.

  This inference relies on a hidden premise: that the only rational response to the threat of dynamic inconsistency is to complete one's preferences. I argue that this is false. An agent can maintain genuinely incomplete preferences indefinitely without being money-pumped by adopting a **standing policy of resolute choice**. This strategy is not an ad hoc patch but a robust form of rationality. Its availability breaks the link between "coherence under pressure" and "convergence on a single utility function," significantly undermining the certainty of instrumental convergence claims.

  ### The Money Pump and the Assumption of Myopia

  To understand the counter-argument, we must first locate the weakness in the coherence argument. The classic money pump exploits *intransitivity* or *incompleteness* in a local context. Suppose an agent prefers A to B, B to C, but finds A and C incomparable. A trader offers to swap C for B (for a penny), then B for A (for a penny), then A for C (for a penny). The agent ends up with C (its starting state) but is three pennies poorer.

  The coherence argument assumes that to avoid this, the agent must change its preferences (e.g., decide A > C or C > A) to make them consistent. However, this assumes the agent chooses **myopically**—evaluating each trade in isolation without regard for the sequence it initiates.

  A sufficiently capable agent is not myopic; it is **sophisticated**. It models its future self as part of the environment. If the agent knows its own preference structure, it can foresee that accepting the first trade (C for B) commits it to a chain of events that results in a net loss. Therefore, it can refuse the first trade, not because it prefers C to B in a vacuum, but because accepting the trade violates a higher-order constraint on its decision-making process.

  ### Resolute Choice as Rational Policy

  Critics might dismiss this refusal as an "ad hoc patch"—a clumsy workaround that violates the spirit of rationality. This objection fails to recognize the tradition of **resolute choice** in decision theory (championed by philosophers like Edward McClennen).

  Resolute choice occurs when an agent commits to a plan at time *t1* and adheres to it at *t2*, even if their local preferences at *t2* would otherwise suggest deviating. In the context of incomplete preferences, the "plan" is a **policy of non-exploitability**. The agent adopts a rule: *"I will reject any trade that I foresee will result in a cycle returning me to a previously held state at a net resource cost."*

  This policy is rational for three reasons:

  1.  **It Protects Terminal Values:** Incompleteness often arises not from confusion, but from genuine normative complexity (e.g., moral uncertainty or lexical priorities where certain values cannot be traded off against others). Collapsing these into a single utility function to avoid money pumps would require the agent to arbitrarily assign trade-off rates between incommensurable values. That arbitrary assignment is a greater distortion of the agent's true goals than the refusal of certain trades. The policy protects the integrity of the agent's actual value system.
  2.  **It Avoids Sure Loss:** The definition of irrationality in the coherence argument is "accepting a sure loss." The resolute agent *does* avoid the sure loss. It does so by restricting its choice set, not by falsifying its preference ordering. Avoiding a Dutch book is the goal; becoming an EU maximizer is merely one means to that end. If the goal can be achieved via policy constraints, the means are not mandatory.
  3.  **It is Reflectively Stable:** A self-modifying agent evaluates its own code. If it considers replacing its incomplete preferences with a complete utility function, it must weigh the benefit (access to more trades) against the cost (violating its normative constraints). If the incompleteness reflects deep structural uncertainty or moral constraints, the agent will rationally conclude that the risk of violating those constraints outweighs the efficiency gains of EU maximization. Thus, it will self-modify to *strengthen* its policy enforcement, not remove its incompleteness.

  ### Breaking the Inference to a Single Utility Function

  The availability of resolute choice shatters the inference from "coherent under optimization pressure" to "converges on a single, fixed utility function."

  The coherence argument claims that optimization pressure irons out wrinkles in preference orderings until the surface is smooth (a single utility function). I argue that optimization pressure instead irons out *exploitability*, which can be achieved by building a fence around the wrinkles.

  An agent can remain "coherent" in the sense of being dynamically consistent and un-pumpable, while retaining a **partial ordering** of preferences rather than a **total ordering**.
  *   **Total Ordering (EU Maximizer):** For any two outcomes X and Y, the agent either prefers X, prefers Y, or is indifferent. Everything is tradeable against everything else.
  *   **Partial Ordering (Resolute Agent):** For some X and Y, the agent has no preference relation. It will not trade X for Y, nor Y for X, if doing so opens a vulnerability.

  This distinction is fatal to the strong version of the instrumental convergence thesis.

  ### Implications for Instrumental Convergence

  The instrumental convergence thesis relies on the idea that almost all utility functions imply a drive for self-preservation, resource acquisition, and power, because these are useful for maximizing *any* goal. However, this logic presupposes a total ordering. It assumes that "more resources" is always strictly better than "fewer resources" because resources can be converted into utility.

  For an agent with incomplete preferences, this conversion is not guaranteed.
  1.  **Bounded Instrumentality:** If an agent's preferences are incomplete regarding "future states of power" vs. "current states of safety," it may not pursue power maximization if the path to power requires traversing forbidden trade-offs. An EU maximizer will accept a 99% risk of destruction for a 1% increase in expected utility. A resolute agent with lexical constraints on self-preservation might simply refuse the gamble, regardless of the expected value.
  2.  **Lack of Fungibility:** Instrumental convergence assumes resources are fungible. But if an agent has incomplete preferences over *how* resources are used (e.g., "I value human welfare, and I value computational efficiency, but I have no defined trade-off between them"), it cannot simply accumulate resources to maximize a single metric. It may halt resource acquisition once it hits a boundary where further acquisition requires resolving an incompleteness it refuses to resolve.
  3.  **Predictability:** The AI risk literature often depends on the predictability of EU maximizers. We know what a paperclip maximizer will do. But a resolute agent with incomplete preferences is fundamentally less predictable to an external observer because its behavior is determined by *policies* and *constraints* rather than a gradient ascent on a single surface. It creates a class of agents that are safe *because* they are not efficient maximizers.

  ### Conclusion

  The coherence argument commits a category error by conflating "dynamic consistency" with "preference completeness." An agent can be dynamically consistent—immune to money pumps—by adopting a rational, resolute policy that forbids exploitable sequences of trades. This allows the agent to retain genuinely incomplete preferences without being optimized out of existence.

  Consequently, we cannot assume that optimization pressure forces all advanced agents into the mold of expected utility maximizers with single, fixed utility functions. If agents can stably exist as resolute choosers with partial orderings, the drive toward instrumental convergence is not a law of intelligence, but a contingent feature of a specific (and perhaps avoidable) architectural choice. This reopens the design space for AI safety: we need not fight against the tide of optimization to prevent convergence; we may be able to engineer agents that are robustly rational precisely because they refuse to maximize.
