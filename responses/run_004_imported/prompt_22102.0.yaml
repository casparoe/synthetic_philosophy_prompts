      *Key Insight:* The money pump argument assumes *myopic* choice. If the agent is *sophisticated* (anticipates future choices), the pump fails. The claim that optimization forces EU maximization assumes that the *only* way to be sophisticated is to complete the preferences. I need to show that maintaining incompleteness + a policy is *another* way to be sophisticated.

