prompt: |-
  I'm a second-year PhD student in philosophy working in formal epistemology and decision theory. My advisor runs a graduate seminar on rational choice this term, and for my final paper I decided to write on updateless decision theory (UDT) rather than rehearsing the standard causal-versus-evidential dispute one more time, partly because almost nobody in the room has engaged with it seriously and partly because I think there's a real objection to be made against it that goes beyond the usual "but what about Newcomb's problem" back-and-forth. Below is the core section of my draft. I'd like your comments before I circulate it, since I suspect I'm either reinventing an objection that's already well known in the literature, getting some technical detail of UDT wrong, or both.

  Updateless decision theory, as Wei Dai first proposed it and as it survives in more polished form in Yudkowsky and Soares's work on functional decision theory, differs from both causal decision theory (CDT) and evidential decision theory (EDT) in a specific structural way. Rather than asking, once you know where you are, "which act now maximizes expected utility?", the updateless agent asks, prior to updating on its observations, "which function from possible epistemic states to acts would have maximized expected utility, evaluated against my prior?" — and then simply executes whatever that policy dictates once a particular epistemic state is realized.

  The difference shows up clearly in the counterfactual mugging case. A perfect predictor, Omega, flips a fair coin. On heads, Omega will hand you $10,000 if and only if Omega predicts that you would, on tails, hand over $100 when asked. On tails, Omega simply asks you for the $100. Suppose the coin lands tails and Omega asks. A CDT agent, reasoning causally about the situation it is now actually in, sees that paying has no causal bearing on a heads-world that never occurred, and refuses. An EDT agent fares no better: conditional on having been asked, which happens only on tails, paying is simply a pure loss, so it refuses too. The updateless agent, having fixed its policy before updating on the coin's result, pays, because the policy of paying on tails has the higher expected value by the lights of the original, unconditional prior — half the time it gains $10,000 and half the time it loses $100, for an expected gain of $4,950, against an expected gain of $0 for the policy of never paying.

  The usual moral drawn here is that UDT "wins": its adherents end up richer in expectation, and that is supposed to settle the matter in its favor. I want to push on this rather than just repeat it. What the updateless agent is doing, once it is actually sitting in the tails-branch with the heads-world's money permanently out of reach, looks a great deal like what Edward McClennen called resolute choice in the older dynamic-choice literature: having settled on a plan under one, more encompassing evaluation, the agent sticks to the plan at a later decision node even though, evaluated purely from that later node, deviating would leave it strictly better off. McClennen's resolute chooser was designed to handle an agent's own anticipated future preference reversals, not an external predictor, but the structural move — privileging the plan's ex ante ranking over its ex post, local ranking — looks identical. And resolute choice has always faced one stubborn objection: showing that a disposition to stick to the plan is good to have is not the same as showing that, at the later node itself, with nothing further at stake and full knowledge of one's situation, sticking to the plan is what one is rationally required to do right then. The natural UDT reply is that this dichotomy is illusory here, because what makes an agent the type Omega rewards is nothing but the fact that its decision procedure outputs "pay" in the tails-branch, so there is no coherent halfway house in which you collect the benefits of being predicted a payer while reserving the right to defect once the coin is settled. But that reply looks to me like it slides from an epistemic claim — an agent who defects would have been predicted differently — to a normative one — therefore defecting, once already in the tails-branch, is irrational — and I don't think that slide has actually been earned. It is, in different dress, exactly the point at issue between sophisticated and resolute choosers in the older literature.

  What I'd most like your comments on: first, whether my three-way contrast between CDT, EDT, and UDT and my version of the counterfactual mugging case are technically accurate, or whether I've smuggled in some confusion about what the "policy" an updateless agent optimizes over actually ranges over; second, whether the parallel I draw to McClennen's resolute choice actually holds up, or whether there's a disanalogy between being bound by one's own earlier preferences and trying to look good to an external predictor that undermines the comparison (I read Rationality and Dynamic Choice years ago for an unrelated seminar and am relying on memory, so please flag it if I've mischaracterized resolute choice); and third, and most importantly, whether the ex-ante-versus-ex-post worry in my final paragraph is a real, recognized problem for UDT and its descendants, one with a standard rebuttal I'm failing to anticipate, or whether it simply doesn't work as an objection at all. I would rather hear this from you than from a committee member in the back row.
reasoning: |-
  Here's a thinking process that leads to the suggested feedback:

  1.  **Analyze the User and Context:**
      *   **User:** Second-year PhD student in philosophy.
      *   **Field:** Formal epistemology and decision theory.
      *   **Task:** Writing a final paper for a graduate seminar on rational choice.
      *   **Topic:** Updateless Decision Theory (UDT) / Functional Decision Theory (FDT).
      *   **Goal:** Wants feedback on a core draft section before circulating it.
      *   **Specific Concerns:**
          1.  Technical accuracy of the CDT/EDT/UDT contrast and the Counterfactual Mugging setup.
          2.  Validity of the analogy to McClennen's Resolute Choice.
          3.  Strength/Novelty of the "ex-ante vs. ex-post" rationality objection (is it known? is there a standard rebuttal? is it cogent?).
      *   **Tone:** Professional, academic, rigorous, but open to constructive criticism. Needs to sound like a peer/senior colleague review.

  2.  **Analyze the Draft Text:**
      *   **Summary of UDT:** Describes UDT as optimizing a policy (function from epistemic states to acts) against the prior, rather than optimizing an act given updated beliefs. *Assessment:* Generally accurate, though "epistemic states" might need slight nuance (often logical/algorithmic output), but for a philosophical overview, it's acceptable.
      *   **Counterfactual Mugging:** Describes the setup (Omega, coin flip, $10k on Heads if pay on Tails, asked on Tails). Describes CDT/EDT refusal and UDT acceptance based on ex-ante EV. *Assessment:* Accurate standard presentation.
      *   **McClennen Analogy:** Connects UDT's "stick to the policy" to McClennen's "Resolute Choice" (sticking to a plan despite ex-post preference reversal). *Assessment:* This is a strong and insightful connection. McClennen is indeed the go-to for dynamic choice without precommitment technology.
      *   **The Objection:** The "slide" from epistemic (you wouldn't have been predicted to pay) to normative (therefore paying now is rational). Questions whether ex-ante optimality dictates ex-post rationality *at the node*. *Assessment:* This is the crux. It touches on the "Why ain'cha rich?" vs. "Rationality" debate, and specifically the tension between *plan rationality* and *action rationality*.

  3.  **Address Specific Concerns (Brainstorming & Verification):**

      *   **Concern 1: Technical Accuracy.**
          *   *UDT Definition:* The draft says "function from possible epistemic states to acts." In FDT/UDT, it's often framed as optimizing over the *output of the decision algorithm* across logically possible worlds. "Epistemic states" is okay, but "information states" or "observations" might be more precise.
          *   *Counterfactual Mugging:* The setup is standard. One nuance: UDT agents don't "update" in the Bayesian sense on the observation *for the purpose of decision making*, but they do condition on the observation to know *which* part of the policy to execute. The draft says "prior to updating on its observations... and then simply executes whatever that policy dictates once a particular epistemic state is realized." This is correct.
          *   *CDT/EDT:* Standard analysis holds. CDT sees no causal link. EDT sees paying as bad news (correlated with losing $100, no gain possible).
          *   *Verdict:* Technically sound enough for a philosophy paper, though a logician might nitpick "epistemic states."

      *   **Concern 2: McClennen Analogy.**
          *   *Resolute Choice:* McClennen (1990) argues against Sophisticated Choice (backward induction) and Myopic Choice. Resolute choice involves sticking to a plan chosen at $t_0$ even if at $t_1$ the plan is no longer optimal *by the lights of the preferences at $t_1$*.
          *   *Disanalogy?* In McClennen, the tension is usually *time-inconsistency* (e.g., hyperbolic discounting). In UDT/Counterfactual Mugging, preferences haven't changed; *information* has changed. The tension is between *conditional* expected utility (given Tails) vs. *unconditional* expected utility (given Prior).
          *   *Connection:* However, the structural move is identical: privileging the $t_0$ evaluation over the $t_1$ evaluation. The "preference reversal" in UDT isn't psychological; it's evidential/causal. But functionally, the agent at $t_1$ (Tails) prefers not to pay (dominance reasoning), but the agent at $t_0$ preferred paying. So the analogy holds structurally.
          *   *Literature:* This connection is noted in some circles (e.g., discussions on dynamic consistency), but often UDT proponents argue they *are* dynamically consistent because they don't update. McClennen assumes updating happens. This is a key distinction to flag.

      *   **Concern 3: The Ex-Ante/Ex-Post Objection.**
          *   *Is it known?* Yes, this is the "Why ain'cha rich?" (WAR) vs. "Rationality" debate. Ahmed (2014), Joyce, and others have pushed on this. Specifically, the objection that UDT violates *Separability* or *Dynamic Consistency* (in the sense of following the optimal plan at every node given current info).
          *   *Standard Rebuttal:* UDT proponents (Yudkowsky, Soares, MacAskill) argue that "rationality" just *is* winning. If your theory of rationality says you should lose money compared to another theory, your theory is wrong. They reject the normative force of the "ex-post" perspective if it conflicts with the "ex-ante" optimum in logical correlation cases. They argue the ex-post perspective is *misguided* because it ignores logical counterfactuals.
          *   *The "Slide":* The user identifies a slide from "you wouldn't have been predicted" (metaphysical/epistemic fact about the predictor) to "you ought to pay" (normative claim). The UDT reply is that the normative claim *depends* on the decision algorithm's output across all worlds, not just the actual one.
          *   *Novelty:* The specific framing via McClennen is nice. It grounds the UDT debate in older dynamic choice literature which is often ignored by the LW/FDT crowd. This is a good contribution.

  4.  **Drafting the Response:**
      *   **Tone:** Encouraging but critical. Acknowledge the student's level (2nd year PhD).
      *   **Structure:**
          1.  General impression (Strong, promising).
          2.  Technical Accuracy (Minor tweaks on "policy" definition).
          3.  McClennen Analogy (Validate it, but highlight the Updating vs. Non-Updating distinction).
          4.  The Objection (It's known but the McClennen framing adds value. Address the "Standard Rebuttal" regarding Logical Counterfactuals and the definition of Rationality).
          5.  Specific suggestions for strengthening the argument.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't confuse FDT and UDT too much. They are close, but FDT is the "polished" version mentioned. The draft conflates them slightly, which is fine for this level, but worth noting.
      *   *Correction on McClennen:* McClennen's resolute chooser *updates* but chooses resolutely. UDT *doesn't update*. This is a crucial technical difference. The *effect* is the same (paying on Tails), but the *mechanism* differs. The UDT agent doesn't feel the tension of "ex-post suboptimality" because it doesn't acknowledge the ex-post probability distribution as decision-relevant. I need to point this out. The objection is that UDT *should* acknowledge it.
      *   *Literature Check:* Arif Ahmed's "Evidence, Decision and Causality" (2014) discusses this. Also, Meacham (2010) on "Two Mistakes Regarding the Principal Principle." But more directly, the "Dynamic Consistency" objection to UDT is discussed by Briggs (2010) and in the FDT papers themselves (they claim dynamic consistency). I should mention that UDT proponents *claim* dynamic consistency, so the student needs to argue why that claim fails or is verbal.
      *   *The "Slide":* The user calls it a slide from epistemic to normative. The UDT defender says the normative *supervenes* on the algorithm's global properties. The student needs to argue why local rationality matters independently. This is the "Separability" principle.

  6.  **Final Polish:** Ensure the advice is actionable. Suggest specific literature to cite (Ahmed, Briggs, maybe Gauthier on constrained maximization as a cousin). Encourage the McClennen angle as the unique contribution.

  7.  **Final Review against constraints:** The user asked for comments on three specific points. I must address all three clearly.

      *   *Point 1 (Tech Accuracy):* Looks good, minor terminology tweak.
      *   *Point 2 (McClennen):* Strong analogy, but note the updating distinction.
      *   *Point 3 (Objection):* It's a known objection (Dynamic Consistency/Separability), but the McClennen framing is fresh. The standard rebuttal is "Rationality = Winning" + "Logical Counterfactuals are real."

      *Let's write the response.*
answer: |-
  This is a strong draft section. You have a clear grasp of the landscape, and your instinct to bridge the newer FDT/UDT literature with the older dynamic choice literature (McClennen, Gauthier, etc.) is excellent. That is likely where your paper's unique contribution lies, as the "rationality vs. winning" debate often gets stuck in metaphysical weeds about counterfactuals rather than structural norms of agency.

  Here are my comments on your three specific concerns, followed by a few suggestions for sharpening the argument.

  ### 1. Technical Accuracy (CDT/EDT/UDT & Counterfactual Mugging)

  Your exposition is technically sound for a philosophy seminar context, but there is one nuance regarding UDT's "policy" that you should tighten to avoid nitpicking from formalists.

  *   **The Policy Space:** You write that the agent asks "which function from possible epistemic states to acts..." In strict UDT/FDT formalisms, the optimization is often over the *output of the decision algorithm* across logically possible worlds, not just "epistemic states." The distinction matters because UDT treats logical correlations (e.g., between your code and Omega's simulation) differently than standard empirical correlations. However, for the purpose of the Counterfactual Mugging, your description works. To be precise, you might say: "which mapping from observations to actions maximizes expected utility relative to the prior, treating the output of that mapping as a logical fact fixed across all possible worlds (including counterfactuals)."
  *   **The "Updateless" Claim:** You correctly note the agent executes the policy "once a particular epistemic state is realized." Be careful not to imply the agent *updates* its credences in the Bayesian sense before acting. The UDT agent conditions on the observation to know *where it is* in the policy, but it does not update the probability distribution used to evaluate the policy's worth. It uses the prior $P$ to evaluate expected utility, even when it knows it is in the Tails world. Your text says "prior to updating... and then simply executes," which is safe, but ensure you don't accidentally concede that the agent adopts the posterior $P(\cdot | \text{Tails})$ for the *evaluation* of the act. It uses $P(\cdot | \text{Tails})$ only to index the policy, not to weigh the utility.

  **Verdict:** Accurate enough, but tightening the "policy" definition will inoculate you against technical objections.

  ### 2. The McClennen Analogy (Resolute Choice)

  This is the strongest part of your draft, but there is a disanalogy you need to confront head-on to make the comparison stick.

  *   **The Structural Parallel:** You are right that the *move* is identical: privileging the $t_0$ evaluation over the $t_1$ evaluation. Both the Resolute Chooser and the UDT agent refuse to maximize utility relative to their current information state if doing so violates the plan that was optimal ex ante.
  *   **The Disanalogy (Updating):** McClennen's Resolute Chooser *updates* on new information but chooses resolutely anyway to overcome time-inconsistency (e.g., hyperbolic discounting). The UDT agent, by definition, does *not* update (or rather, treats the update as irrelevant for policy selection).
      *   *Why this matters:* A critic might say McClennen solves a problem of *changing preferences*, whereas UDT solves a problem of *logical correlation*. The Resolute Chooser admits that at $t_1$, the plan is suboptimal by their *current* lights but sticks to it for the sake of coherence. The UDT agent argues that at $t_1$, the plan is *still* optimal by the correct lights (the prior), because the "current lights" (the posterior) are the mistake.
  *   **Recommendation:** Don't let this disanalogy undermine your point; use it. You can argue that despite the mechanistic difference (updating vs. non-updating), the *normative tension* is the same. Both theories require the agent to ignore a dominance argument that is locally valid at the decision node. If McClennen's resolute choice is vulnerable to the charge of "irrational stubbornness" (ignoring local optimality), UDT is vulnerable to the charge of "irrational ritualism" (ignoring local causal/evidential irrelevance).

  **Verdict:** The analogy holds up structurally and is a valuable lens. Just acknowledge the updating distinction to show you aren't conflating the mechanisms.

  ### 3. The Ex-Ante vs. Ex-Post Objection

  This is a recognized problem, but your framing via McClennen gives it fresh leverage.

  *   **Is it Known?** Yes. In the UDT/FDT literature, this is often discussed under the header of **Dynamic Consistency**. UDT proponents (Yudkowsky, Soares, MacAskill) argue UDT *is* dynamically consistent because the agent never changes its mind; it always follows the ex-ante optimal plan. Critics (e.g., Arif Ahmed, Rachael Briggs) argue that this violates **Separability** (the principle that what you should do at a node depends only on the subtree at that node).
  *   **The Standard Rebuttal:** The standard UDT reply is not just "winning is everything." It is that the ex-post perspective is *metaphysically mistaken* in cases involving predictors. They argue that once you accept that your decision is a logical fact that determines Omega's past prediction, the "local" dominance reasoning (I can't change the past) is false. You *are* changing the past (or rather, selecting which past is consistent with your algorithm). Therefore, there is no "slide" from epistemic to normative; the normative facts just *are* determined by the global algorithmic properties.
  *   **Your Counter-Move:** Your objection needs to target the **normative significance of the local perspective**. Even if the UDT agent *can* win by ignoring the local perspective, why is that *rational*?
      *   McClennen's critics argued that Resolute Choice requires a kind of "precommitment without technology" that is psychologically or normatively mysterious.
      *   You can argue similarly: UDT requires the agent to treat its current decision as having causal/logical power over worlds it knows are counterfactual (the Heads world). While this leads to winning, it violates a deep intuition about **act-individuation**: that I am responsible for *this* act in *this* world, not the output of a function in a world I know I am not in.
      *   The "slide" you identify is crucial. UDT says: "Because you would have been predicted differently, you ought to pay." You are rightly pointing out that this moves from a fact about *prediction conditions* to a prescription for *current action* without justifying why the prediction conditions normatively bind the agent *after* the coin has landed.

  **Verdict:** This is a real objection. To make it punchier, explicitly name the principle UDT violates. It is usually **Separability** or **State-Wise Dominance**. If you can argue that Separability is a necessary condition for rational agency (perhaps citing McClennen or Gauthier on constrained maximization), you strengthen the claim that UDT isn't just "different" but "defective."

  ### Specific Suggestions for Revision

  1.  **Cite the Dynamic Choice Literature Explicitly:** Since you are bringing McClennen in, consider citing **Edward McClennen, *Rationality and Dynamic Choice* (1990)** directly, and perhaps **David Gauthier, *Morals by Agreement* (1986)** on constrained maximization. Gauthier is often seen as a precursor to this "ex-ante optimization" view, and comparing UDT to Constrained Maximization could be very fruitful.
  2.  **Clarify the "Slide":** In the final paragraph, make the "epistemic to normative" slide more explicit.
      *   *Current:* "It slides from an epistemic claim... to a normative one."
      *   *Revision:* "It infers a normative obligation at $t_1$ (pay the $100) solely from a metaphysical fact about $t_0$ (the policy required for prediction). It assumes without argument that the rationality of an action is determined by the optimality of the policy generating it, rather than the consequences of the action itself in the actual world."
  3.  **Anticipate the "Rationality = Winning" Reply:** You mention the "usual moral... is that UDT 'wins'." You should explicitly address the **Pragmatic Vindication** argument. UDT defenders say if your theory of rationality loses money, it's the theory that's wrong. Your counter-argument should be that "winning" in Counterfactual Mugging relies on a specific metaphysical setup (logical correlation) that shouldn't dictate general norms of rationality, or that "winning" here is achieved by sacrificing **autonomy at the node**.
  4.  **Terminology:** Consider using the term **"Separability"** in your final paragraph. It gives the committee a specific technical hook to hang your objection on. The objection is that UDT violates Separability to preserve Dynamic Consistency (in their sense). McClennen argued we should preserve Dynamic Consistency even at the cost of Separability (via Resolute Choice). You are asking whether that cost is too high when the "consistency" is enforced by a predictor rather than future selves.

  ### Summary
  You are not reinventing the wheel, but you are putting the wheel on a different vehicle. The "UDT violates Separability" objection is known in formal circles (see work by **Rachael Briggs** or **Arif Ahmed**), but linking it explicitly to McClennen's Resolute Choice and framing it as an unjustified slide from prediction-conditions to current-obligations is a solid philosophical contribution.

  It is ready for circulation, provided you tighten the definition of the UDT policy and explicitly name the normative principle (Separability) you believe is being violated. Good luck with the seminar.
