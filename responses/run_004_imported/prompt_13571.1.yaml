answer: |-
  **TRANSCRIPT: PANEL ON THE ARCHITECTURE OF VOLITION**
  **Conference:** *Mind, Mechanism, and Morality*
  **Session:** *The Puzzle of Akrasia*
  **Participants:**
  *   **Dr. Elias Thorne** (Professor of Philosophy, specializing in Action Theory)
  *   **Dr. Sarah Chen** (Behavioral Economist, specializing in Intertemporal Choice)
  **Moderator:** (Silent for the purpose of this transcript)

  ***

  **Chen:** Let's begin with the premise that we are trying to explain the same phenomenon. We all know the scene: It's 11:00 PM. You have a meeting at 7:00 AM. You judge, clearly and without ambiguity, that going to sleep now is better than watching one more episode. And yet, you click "Next Episode."

  Donald Davidson calls this a philosophical scandal. He argues that you are holding two contradictory states in your mind simultaneously: a judgment that A is best, and an intention to do B. He thinks this breaks the logic of agency.

  I'm here to suggest that the scandal is only a scandal if you insist on a metaphysical fiction: the idea that there is a single, unchanging "you" spanning the gap between 11:00 PM and 11:30 PM. If we look at the data from hyperbolic discounting, there is no contradiction. There is only a preference reversal. At 11:00 PM, Sleep has higher utility. At 11:29 PM, as the reward of "plot resolution" moves closer, its value spikes along a hyperbolic curve. Sleep's value stays flat. At the moment of the click, Watching *is* the preferred option. You aren't violating your judgment; your judgment has simply updated to match your new temporal horizon.

  **Thorne:** Sarah, with respect, that explanation dissolves the phenomenon it claims to explain. If, at 11:29 PM, I genuinely judge that Watching is better than Sleeping, then I am not weak-willed. I am just fickle. I've changed my mind.

  Davidson's point is precisely that akrasia is *not* changing one's mind. It is the experience of acting *against* a judgment that one still holds. When I click "Next Episode," I do not think, "Ah, well, given the proximity of the reward, Watching is now the rational choice." I think, "I really shouldn't be doing this." The normative force of the judgment persists *at the moment of action*. If your model says that my valuation flips so that the action becomes rational *ex ante*, you are explaining away the guilt. You're telling me I shouldn't feel regret because, technically, my utility function was satisfied. But the regret is the data.

  **Chen:** But why privilege the regret of the 11:00 PM self over the satisfaction of the 11:30 PM self? You say the judgment persists. I say that what persists is a *memory* of a judgment, while the active valuation has shifted.

  Think of it as a negotiation between temporal selves. The "Morning Self" wants rest. The "Night Self" wants relief from stress. When the Night Self takes the controls, it isn't acting irrationally; it's acting on its own local information and discount rate. The "violation" you feel is just the Morning Self complaining about a contract breach. But if we posit a single agent who is simultaneously evaluating and acting against that evaluation, we have to posit a magical break in the causal chain of motivation. How does a judgment of "better" fail to motivate? In my model, it doesn't fail. The "better" just belongs to a different stakeholder.

  **Thorne:** This fragmentation of the agent is where I must dig in. If the Night Self and the Morning Self are different stakeholders, then morality becomes impossible. Why should the Night Self feel guilty? If they are distinct entities, that's like me feeling guilty because my neighbor ate my lunch.

  The "all-things-considered" judgment is the glue of personhood. It is the attempt to synthesize all my desires—stress relief, rest, professional reputation—into a single verdict *now*. When I form that verdict, I am not just predicting my future utility; I am committing my agency. To say, "Oh, that was just the Morning Self talking," is to retreat from the first-person perspective. It turns the agent into a battlefield rather than a combatant. But *I* am the one who feels the tension. *I* am the one who clicks the mouse. If I am merely the site where two temporal utilities collide, who is responsible for the click?

  **Chen:** Responsibility is a social technology, Elias. It's a way we incentivize the temporal selves to cooperate. When you feel guilt, that is a mechanism. It's a penalty imposed by the memory of the past self on the present self to try to steer the future self.

  But let's press on your "all-things-considered" judgment. You say it persists. Empirically, we know that attention narrows under the influence of immediate gratification. This is "myopia." When the cake is in front of you, the cognitive weight of "health" diminishes. You might verbally assent to "I should not eat this," but that assent is hollow. It's a semantic tag attached to a depreciated value.

  So I ask you: If the motivational power of the judgment drains away as the reward gets closer, in what sense does the judgment still exist? If it has no cash value in the currency of action, isn't it just a ghost? A whisper from a previous configuration of the brain? Why posit a single agent struggling against themselves rather than a succession of agents with conflicting interest curves?

  **Thorne:** Because the whisper is audible *while* I eat the cake. That is the distinctively human texture of weakness of will.

  If your model were correct, if this were merely a preference reversal, we would expect the agent to feel relief upon consuming the reward. "Ah, the tension is resolved; my utility is maximized." But often, we feel shame *during* the act. We eat the cake *while* telling ourselves it is wrong.

  This suggests that the "better judgment" isn't just a preference for a later time. It's a claim about truth. I am claiming that, objectively, considering all factors, abstaining is the right course. If I act against that claim while still acknowledging its truth, I am violating the Principle of Continence. I am breaking the link between reason and action. Your model saves the rationality of the action by sacrificing the unity of the reasoner. You save the agent from contradiction by chopping the agent into time-slices. But then you've lost the "will" in "weakness of will." There is no will, only a sequence of impulses.

  **Chen:** I think you're conflating "unity" with "consistency." I'm not saying there is no agent. I'm saying the agent is a dynamic system.

  Let's look at the alternative. If we accept your Davidsonian picture, we have a mystery: How does the mind generate an intention that contradicts its own evaluative ranking? It implies a kind of freedom that is almost spooky—a ability to decouple action from the strongest current motive.

  My model grounds it. The "strongest current motive" shifts because of the hyperbolic curve. The "judgment" you speak of is a high-level cognitive representation of long-term goals. But high-level cognition is slow. Impulse is fast. When you click "Next Episode," the fast system has hijacked the slow system. The slow system is still screaming "Stop!"—that's your persisting judgment—but it no longer holds the veto power.

  So, I agree with you that the judgment persists verbally. But I disagree that it persists *valuationally*. You say I'm losing the normative character. I say I'm locating it. The normativity is the long-term self trying to bind the short-term self. It's a political struggle, not a logical contradiction.

  **Thorne:** A political struggle implies a polity. Who governs? If the "slow system" is the government, and it issues a law ("Go to sleep"), and the "fast system" ignores it, then the government has failed. It is a failure of authority.

  But here is the knot I cannot untie with your help, Sarah. If the fast system ignores the law because, *at that moment*, the utility of staying up is higher, then the agent is doing what they most want to do. And if they are doing what they most want to do, how can it be irrational?

  Davidson's insight is that human action isn't just about maximizing want-satisfaction. It's about acting on reasons. When I am akratic, I am not following my strongest desire; I am acting against my best *reason*. Your model reduces reasons to desires with time-stamps. But I can have a desire to sleep and a desire to watch TV, and still judge that sleep is *better*. If your model says the TV desire becomes "stronger" simply because it is nearer, you are defining strength solely by the outcome of the action. That's circular. "I did it, therefore it must have been the stronger preference."

  **Chen:** It's not circular if we can predict the reversal beforehand. We can map the curve. We know that on Tuesday, you will prefer the salad, and on Friday at 8:00 PM, you will prefer the burger. We can predict the "failure of authority" before it happens.

  You worry that this removes the normative sting. I argue it sharpens it. If akrasia is a logical puzzle, the solution is abstract contemplation. If it is a mechanical failure of discounting, the solution is pre-commitment. It's why we use alarm clocks that run across the room. That is the Morning Self tying the hands of the Night Self.

  If we stick to your view, where I am a unified agent violating my own logic, the solution is... what? Willpower? Trying harder to make the judgment stick? That has a poor success rate. Acknowledging that my preferences are time-inconsistent allows me to build structures that enforce the judgment I hold when I am calm, against the judgment I hold when I am tempted. Isn't that a more useful philosophy for a creature trying to live a life?

  **Thorne:** It is a useful technology, I grant you. But is it an accurate metaphysics?

  You offer me a strategy for management, but you deny the experience of the manager. When I tie my own hands, I do so because I acknowledge that *I* will be weak. Not that "a future self" will be weak. *I* will be weak. The pronoun remains singular.

  If I accept your picture, I risk cynicism. "Oh, I'm eating the burger? Well, that's just the Friday Curve. Nothing I can do, it's just utility maximization." Your model risks turning the violation into a validation. By explaining the mechanism, you normalize the breach.

  Davidson wants to preserve the idea that we are answerable to our own judgments. That there is a standard of rationality that we can fail to meet, not just a curve we can plot. The discomfort we feel—the akratic pain—is the signal that we are not merely bundles of preferences. We are agents who claim to be more than the sum of our temporal parts. If you explain away the contradiction, you explain away the humanity.

  **Chen:** And if you insist on the contradiction, you explain away the causality. You leave us with a ghost in the machine that refuses to follow its own commands for no reason other than "weakness."

  I think we are at an impasse, Elias. You want to save the Agent, even if it means accepting a paradox of irrationality. I want to save the Explanation, even if it means fragmenting the Agent into a timeline of competing interests.

  **Thorne:** Perhaps. Though I would say this: You can have your curves and your temporal selves, provided you admit that the *experience* of crossing them—the feeling of betraying a judgment that still stands—is not an illusion. It is the one datum that proves the unified self exists, if only as a normative ideal we are constantly failing to inhabit.

  **Chen:** And I will accept that the feeling is real, provided you admit that the feeling is a byproduct of the mechanism, not evidence of a metaphysical unity. The pain is the friction between the selves. It doesn't prove they are one; it proves they are attached.

  **Thorne:** Attached how?

  **Chen:** By memory. By consequence. By the fact that the Night Self has to wake up in the Morning Self's body.

  **Thorne:** (Pauses) Then perhaps the "all-things-considered" judgment is simply the attempt to speak for the whole chain, rather than just the current link.

  **Chen:** And akrasia is what happens when the current link forgets it's part of a chain.

  **Thorne:** Or refuses to acknowledge it.

  **Chen:** Or refuses. Yes.

  ***

  **[End of Transcript]**
