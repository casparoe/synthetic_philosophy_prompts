  7.  **Final Polish:** (Writing the actual response based on these thoughts.) *Self-correction: Make sure the moderator intro is brief so the dialogue starts quickly.* *Ensure the distinction between "changing one's mind" and "akrasia" is clear, as that's Davidson's main wedge.*

