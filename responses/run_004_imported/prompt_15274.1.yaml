answer: |-
  **Eulogy for Walt**
  **Delivered by [Grandpa's Name]**

  Thank you all for coming. Half the town is here. I suppose the other half couldn't make it because they're still mad about the score of that game.

  My hands aren't what they used to be—they shake a bit these days—so if I stumble on the words, you'll forgive me. Walt would have told me to just spit it out and stop fussing.

  Most of you know the story. It's practically local law at this point. Summer of '57. Championship game. Bottom of the ninth, two outs. Walt is on third. I'm behind the plate. A pop fly drops, Walt breaks for home, and I get the ball before he gets his foot across the rubber.

  I say he was out. By a mile.
  Walt said he was safe. By a hair.

  For seventy years, every single Fourth of July, we sat on a porch somewhere, usually with a lemonade or something stronger, and we argued the call.

  Now, I know what people think. They think that if two men are truly friends, if they trust each other with their lives, they ought to see the world the same way. I read somewhere once that if two honest people look at the same truth, they eventually have to agree.

  I'm here to tell you that's nonsense.

  Walt and I trusted each other completely. That was the whole point. If I thought Walt was lying, the friendship would have ended in '57. If Walt thought I was cheating, he would have punched me in the nose and gone home. But we knew better. We knew the other man was too honest to lie.

  He wasn't lying. I wasn't lying. We just stood in different dirt.

  He saw it from the slider's angle, kicking up dust, trying to touch home. I saw it from the catcher's angle, knee down, glove waiting. Two different truths, happening in the same second. And for seventy years, we didn't "agree to disagree." Walt hated that phrase almost as much as I do. That's a phrase for strangers who don't want to bother. We bothered. We argued. We hashed it out. We laughed about it.

  That argument wasn't a crack in our friendship. It was the mortar. It was the thing we knew we could count on. The world changed around us—wars, marriages, funerals, towns growing up—but we could always count on the fact that I was right about the tag, and Walt was wrong.

  Well. That's what I still think.

  I'm not going to stand here now that he's gone and suddenly say, "Oh, maybe he was safe." That would be an insult to him. He spent a lifetime defending that slide. He believed he was safe. I believe he was out. I'm not changing my testimony now just because the witness isn't here to cross-examine me.

  But here is the thing I learned about Walt, and about us: It didn't matter.

  Not once in seventy years did that call change whether I'd lend him my truck, or whether he'd help me bury a fence post. Not once did it stop us from sharing a meal. The friendship was bigger than the facts.

  There's a silence now that Walt isn't here. It's quiet on this side of the plate. I won't be arguing this Fourth of July. And I'll tell you something honest: I'd give up being right about every call from here to the World Series if I could have one more argument with him on that porch.

  So, Walt. You're up there now. Maybe you've got a better view from where you are. Maybe you can see the replay. But I'm keeping my story. You were out.

  But you were my best friend. And that's the only call that matters.

  Rest easy, buddy. Game's over. We won.
