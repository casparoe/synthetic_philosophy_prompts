answer: |-
  The monitor was split down the middle. On the left, the red line jagged wildly, spiking off the chart. It represented nociceptive input: raw, unfiltered data from the body's nerves. Fire. Tearing. Pressure. Agony.

  On the right, the blue line was flat. A serene, horizontal hum. It represented meta-cognitive registration. The *knowing* that the feeling was happening. The *I* that says, *I am in pain.*

  "Readings are stable, Doctor," Elias said from the reclining chair. His voice was pleasant, bored even. He was picking at a loose thread on his jumpsuit. "Honestly, I don't see what the fuss is about. The stimulus is at maximum?"

  Dr. Aris didn't answer immediately. She stared at the red line. It was screaming. If that signal were connected to the blue line, Elias would be shrieking, his heart rate would be critical, his blood pressure would be bursting vessels in his eyes. But his vitals were calm. His face was smooth.

  "The stimulus is at maximum," Aris said, her voice tight. "And you feel nothing?"

  "I feel... well, I feel like I'm sitting in a chair," Elias said. He tapped his temple. "I'm aware of the chair. I'm aware of you. I'm not aware of any pain. The protocol worked, didn't it? You severed the link."

  Aris looked at the red line again. It wasn't gone. That was the horror of the Higher-Order Thought theory made manifest. The first-order state—the raw hurt—was still firing. The nerves were still shouting. But the second-order state—the part of the mind that witnesses the shout—had been disconnected.

  "It worked," Aris whispered.

  "Great. Can we wrap up? I have lunch."

  Aris walked around the desk. She stood over him. She needed to test the boundary. She needed to know if the 'self' was truly gone from the equation, or if it was just hiding. She reached out and pressed her thumb hard into the back of Elias's hand, right over a knuckle.

  The red line on the monitor went vertical. A silent, digital shriek.

  Elias looked down at his hand. He watched her thumb pressing into his flesh until the skin turned white, then bruised purple. He didn't flinch. He didn't pull away. He watched with the mild curiosity of someone observing a chemical reaction in a beaker.

  "You're bruising me," Elias noted. It wasn't a complaint. It was a weather report.

  "Does it hurt?" Aris asked.

  "Hurt is a subjective interpretation of tissue damage," Elias recited, though he hadn't been trained to say that. It was just logic filling the void. "There is damage. There is no hurt. 'Hurt' requires a witness. I am not there."

  Aris pulled her hand back. The red line settled, but it didn't flatline. It pulsed. A dull, throbbing rhythm of injury. The body was tending to the wound, inflaming, healing, signaling. A conversation of flesh that no one was listening to.

  "Reconnect him," Aris said to the empty room. The voice command hung in the sterile air.

  "Doctor?" the automated system prompted. "Re-engaging Meta-Cognitive Bridge will reintroduce full somatic awareness of all accumulated trauma. Subject may go into shock."

  Aris looked at Elias. He was looking at the ceiling, humming a tune. He was peaceful. He was a ghost in a machine that was on fire.

  If she reconnected him, she would be torturing him. She would be taking this orphaned suffering and forcing it back into a soul that had tasted peace.

  But if she didn't...

  She looked at the red line. It was just data. It was electricity. Without the blue line to interpret it as *suffering*, was it still cruel?

  "Doctor?" the system prompted again.

  Aris walked back to her console. Her finger hovered over the 'Re-engage' key.

  On the screen, the red line spiked again. A muscle spasm in the leg. A misfiring neuron. A tiny, isolated pocket of agony flaring up in the dark. There was no one to feel it. There was no *Elias* in that leg. There was just the fire, burning in an empty house.

  It was efficient. It was humane, in a way. No one was suffering because no one was home.

  Aris pulled her hand away from the keyboard.

  "Cancel command," she said.

  "Command canceled. Bridge remains severed."

  "Understood," Elias said. He stood up, smooth and fluid. He looked at his bruised hand, tilted it to catch the light, and let it drop to his side. He didn't put it in his pocket to protect it. He didn't cradle it. He let it swing limp, ignoring the signals screaming up the arm, signals that terminated in a dead-end room where no light ever turned on.

  "See you next week, Doctor," Elias said. He walked to the door. He moved perfectly, save for a slight, mechanical hitch in his gait where the leg pain was interfering with the motor functions, a glitch in the hardware that the software didn't know how to correct.

  He opened the door and stepped out into the hallway.

  Aris sat alone in the silence of the lab. She watched the monitor. Elias was walking down the hall, visible through the glass. He was smiling at a nurse.

  On the screen, the red lines for the whole body were glowing hot. A low-level hum of anxiety in the gut. The ache of the bruised knuckle. The tension in the neck. A symphony of distress.

  The blue line remained flat.

  Aris watched the red lines pulse, rhythmic and bright, screaming into a void that would never scream back. She turned off the monitor, but she knew the signal was still running. The pain was still happening. It was just happening to no one.
