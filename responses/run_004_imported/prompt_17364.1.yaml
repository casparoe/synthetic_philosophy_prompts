          *   *Key Distinction:* GMG does *not* require the agent to be a mesa-optimizer. GMG can happen in simple reflex policies (e.g., a CNN that looks for "right edge" instead of "coin"). Mesa-optimization is a specific architectural/behavioral claim about the *internal structure* of the policy (does it perform search?).
          *   *Relationship:* GMG is often discussed alongside inner alignment because both involve the learned objective diverging from the intended objective. However, equating them directly is a common conceptual error in introductory alignment discussions. Hubinger et al. specifically distinguish inner alignment failures (mesa-objective != base objective) from other generalization failures. GMG is a broader category; Inner Alignment is a specific subset requiring mesa-optimization.

