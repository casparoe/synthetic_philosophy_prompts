      *   **Goal Misgeneralization (GMG):** The reward function is correct (tracks intent during training), but the agent learns a heuristic/proxy that correlates with the reward in training but diverges in testing. The capability generalizes, the goal does not. (e.g., CoinRun).
      *   **Inner Alignment / Mesa-optimization (Hubinger et al.):**
          *   *Mesa-optimizer:* A learned model that is itself an optimizer (runs a search process over actions/plans to achieve an objective).
