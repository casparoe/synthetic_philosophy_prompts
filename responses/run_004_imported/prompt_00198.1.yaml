answer: |-
  This is one of the best questions to ask in a bargaining unit because it moves you from "calculating solutions" to "thinking like a mechanism designer." The difference between Nash and Kalai-Smorodinsky (KS) isn't just technical; it represents a fundamental philosophical disagreement about what information matters in a negotiation.

  Here is the deep dive to help you crush that midterm.

  ---

  ### 1. The Geometric Intuition: Local vs. Global

  The quickest way to build a "gut feel" is to visualize how each solution finds the agreement point on the Pareto frontier. Assume the disagreement point $d = (0,0)$.

  *   **Nash Bargaining Solution (NBS):** Imagine blowing up a hyperbola defined by $u_1 \cdot u_2 = k$ from the origin. The NBS is the point where this hyperbola is **tangent** to the Pareto frontier.
      *   *Intuition:* This is a **local** property. The NBS only cares about the slope of the frontier (the marginal rate of substitution) at the solution point. It ignores the rest of the shape of the feasible set.
  *   **Kalai-Smorodinsky (KS):** Draw a line from the origin $(0,0)$ to the **Utopia Point** $a(S) = (\max u_1, \max u_2)$. The KS solution is where this ray **intersects** the Pareto frontier.
      *   *Intuition:* This is a **global** property. The KS solution depends entirely on the "corners" of the feasible set (the ideal points), regardless of the curvature in between.

  **Why they diverge:**
  If the Pareto frontier is a straight line (e.g., $u_1 + u_2 = 1$), the tangent point of the hyperbola and the intersection of the ray to $(1,1)$ are the same. **They coincide on linear frontiers.**
  To see them diverge, you need **curvature**.

  #### Concrete Example of Divergence
  Let the feasible set $S$ be bounded by the curve $u_2 = 1 - u_1^2$ for $u_1 \in [0,1]$.
  *   **Disagreement:** $d = (0,0)$.
  *   **Utopia Point:** $a(S) = (1,1)$ (since max $u_1=1$ when $u_2=0$, and max $u_2=1$ when $u_1=0$).

  **Calculate KS:**
  The KS solution lies on the ray connecting $(0,0)$ to $(1,1)$, so $u_1 = u_2$.
  Substitute into the frontier equation:
  $$u_1 = 1 - u_1^2 \implies u_1^2 + u_1 - 1 = 0$$
  $$u_1 = \frac{\sqrt{5} - 1}{2} \approx \mathbf{0.618}$$
  So, **KS = (0.618, 0.618)**.

  **Calculate Nash:**
  Maximize $u_1 u_2$ subject to $u_2 = 1 - u_1^2$.
  $$\max_{u_1} u_1(1 - u_1^2) = u_1 - u_1^3$$
  FOC: $1 - 3u_1^2 = 0 \implies u_1 = \frac{1}{\sqrt{3}} \approx \mathbf{0.577}$
  $$u_2 = 1 - (0.577)^2 \approx \mathbf{0.667}$$
  So, **Nash = (0.577, 0.667)**.

  **The Difference:**
  *   **Nash** favors Player 2 (the player with the "flatter" part of the curve near their axis). It exploits the curvature to maximize the *product*.
  *   **KS** treats them equally (0.618 each). It ignores the curvature and just splits the *proportional gains* equally.

  ---

  ### 2. The Axiomatic Clash: IIA vs. Individual Monotonicity

  This is the core of your professor's comment. You cannot have both.

  #### Independence of Irrelevant Alternatives (IIA)
  *   **Definition:** If you remove outcomes from the feasible set that were *not* chosen anyway, the solution shouldn't change.
  *   **Nash:** Satisfies this. Because Nash is determined by local tangency, if you chop off parts of the feasible set far away from the tangent point, the solution stays put.
  *   **KS:** Violates this. Because KS depends on the Utopia point, if you chop off a corner of the set (reducing a player's maximum potential utility), the Utopia point moves, the ray changes slope, and the solution changes—even if the original solution was still feasible.

  #### Individual Monotonicity (IM)
  *   **Definition:** If the feasible set expands in a way that increases Player $i$'s maximum possible utility (their ideal point) without hurting Player $j$'s maximum, Player $i$ should not end up worse off (and ideally better off).
  *   **KS:** Satisfies this by construction. If Player 2's max utility goes up, the Utopia point moves up, the ray becomes steeper, and the intersection with the frontier shifts in favor of Player 2.
  *   **Nash:** **Violates this.** This is the specific "break" that motivated Kalai and Smorodinsky.

  #### Why Nash Fails Monotonicity (The Intuition)
  Imagine a bargaining problem where the Nash solution is determined by a specific "kink" or curvature in the middle of the frontier.
  Now, suppose Player 2 discovers a new technology that allows them to achieve a much higher utility *in theory* (expanding the feasible set upward), but this new potential is only achievable if Player 1 gets almost nothing. Geometrically, you've added a "spike" to the top of the feasible set.

  1.  **KS Response:** The Utopia point moves up. The ray tilts toward Player 2. The solution shifts to give Player 2 more. **Intuition:** "Player 2 has more potential power, so they should get a better deal."
  2.  **Nash Response:** If the "spike" is far enough away, it doesn't change the local curvature near the original agreement point. The hyperbola is still tangent at the same spot. The solution **does not change**.
      *   **The Violation:** Player 2's potential power increased, but their actual settlement did not improve.
      *   **Worse Case:** In some non-convex expansions, the change in the frontier's shape can actually shift the tangent point *against* the player whose set expanded. Nash is "myopic"—it only sees the margin, not the potential.

  ---

  ### 3. Interpretive Differences: Fairness vs. Efficiency

  Is KS just a technical fix? No, it embodies a different normative view of fairness.

  | Feature | Nash Bargaining Solution | Kalai-Smorodinsky Solution |
  | :--- | :--- | :--- |
  | **Core Philosophy** | **Utilitarian / Market-like.** | **Proportional / Arbitrator-like.** |
  | **Fairness Concept** | Equalizing marginal rates of substitution. Gains are multiplicative. | Equalizing **relative gains**. |
  | **Formula** | $\max (u_1-d_1)(u_2-d_2)$ | $\frac{u_1-d_1}{a_1-d_1} = \frac{u_2-d_2}{a_2-d_2}$ |
  | **Information Used** | Local shape of the frontier (curvature). | Global extremes (Ideal points). |
  | **Risk Interpretation** | Equivalent to players having specific risk aversion (log utility). | Independent of risk attitudes; focuses on bargaining power. |
  | **Vulnerability** | Vulnerable to "dummy" alternatives (IIA). | Vulnerable to "utopia manipulation" (claiming higher max potential). |

  **The "Proportionality" Insight:**
  KS is often described as **Equal Relative Concession**.
  *   Let $r_i = \frac{a_i - u_i}{a_i - d_i}$ be the fraction of their maximum possible gain that player $i$ *gives up*.
  *   KS solves for the point where $r_1 = r_2$.
  *   **Why this matters:** In labor negotiations or international treaties, parties often argue about percentages ("We want 5% of the growth," not "We want $5 million"). KS formalizes the idea that fairness means both sides sacrifice the same *percentage* of their ideal demand. Nash formalizes the idea that fairness means maximizing the total "volume" of agreement.

  ---

  ### 4. Summary for the Midterm

  If you get a question comparing them, hit these three points:

  1.  **Geometric Mechanism:** Nash is a **tangency** condition (hyperbola); KS is an **intersection** condition (ray to utopia).
  2.  **The Axiom Trade-off:** They are mutually exclusive given Pareto Efficiency and Symmetry. Nash keeps **IIA** (solution depends only on local options); KS keeps **Individual Monotonicity** (solution responds to changes in potential power).
  3.  **The "Why":**
      *   Choose **Nash** if you believe the *marginal trade-offs* at the agreement point are what matter (e.g., market exchanges, risk-sharing).
      *   Choose **KS** if you believe *bargaining power* (defined by best-case scenarios) should dictate the split (e.g., political bargaining, claims problems).

  **One-sentence intuition:** Nash asks "Where can we generate the most joint value?" while Kalai-Smorodinsky asks "How can we split the available value proportionally to our maximum potential?"

  ### 5. A Note on "What Breaks"
  To specifically answer your worry about "what breaks in Nash":
  Nash assumes that if an option is not chosen, it is **irrelevant**.
  Kalai and Smorodinsky argued that unchosen options are **relevant** if they define a player's **threat potential** or **ideal point**.
  *   *Example:* If I can prove I *could* have gotten \$1M (even if I didn't), KS says I deserve a larger share of the \$100k we actually split. Nash says "Irrelevant, we aren't at \$1M, so let's just split the \$100k based on the local slope."
  *   KS was motivated by the feeling that Nash ignores the **context of power** provided by the boundaries of the feasible set.

  Good luck on the midterm! If you remember **Tangency vs. Ray** and **Local vs. Global**, you'll be able to derive most of the rest.
