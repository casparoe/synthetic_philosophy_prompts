      *   *The "Probability 1" Defense:* Explain what Thorp means (asymptotic dominance) and why Samuelson says it's irrelevant (finite time, utility of wealth isn't linear). The "sleight of hand" is ignoring the *path* to get there.
      *   *Fractional Kelly:* Is it a concession to Samuelson? Yes, but also practical. It acknowledges estimation error (the biggest killer in sports betting) and risk aversion (utility).
