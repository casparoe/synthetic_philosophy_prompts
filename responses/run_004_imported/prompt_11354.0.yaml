answer: |-
  You have stumbled onto one of the most fascinating intellectual feuds in the history of finance and decision theory. You've done your homework: Samuelson's monosyllabic paper ("Why We Should Not Make Mean Log of Wealth Big Though Years to Act Are Long") is legendary, and Thorp's practical application of Kelly at MIT and in his hedge funds is equally storied.

  To answer your core question directly: **No, the "no utility function needed" defense is not a free lunch.** It is a rhetorical sleight of hand that smuggles in a very specific value judgment disguised as a mathematical fact.

  However, your friend the options trader isn't entirely wrong, and Samuelson wasn't entirely right in a practical sense. The truth lies in the distinction between *mathematical dominance* and *decision-theoretic optimality*, and why fractional Kelly is the pragmatic synthesis of that fight.

  Here is the breakdown of the crux of the argument.

  ### 1. The "No Utility" Claim: Objective Math or Hidden Preference?

  The Kelly proponents (Thorp, Breiman, Latané) argue that maximizing the geometric growth rate is an **objective property of the betting sequence**. Their argument is:
  *   If you bet repeatedly, your wealth compounds multiplicatively.
  *   There is a specific bet size that maximizes the rate of that compounding.
  *   Any other size will result in lower wealth in the long run (with probability 1).
  *   Therefore, you don't need to ask the bettor what they prefer; this is just how multiplication works.

  **The Counter-Argument (Samuelson/Merton):**
  Samuelson argued that "maximizing long-run wealth" is not a goal in itself; it is only a goal *if* you derive utility from that wealth in a specific way.
  *   Mathematically, maximizing the expected geometric growth rate is **identical** to maximizing the Expected Utility of Wealth where $U(W) = \ln(W)$.
  *   By saying "ignore utility, just maximize growth," Kelly proponents are implicitly saying "assume your utility function is logarithmic."
  *   If your utility function is $U(W) = -1/W$ (more risk-averse) or $U(W) = \sqrt{W}$, Kelly betting is **mathematically suboptimal** for you, even in the long run.

  **The Verdict:** The claim that Kelly requires no utility function is false. It simply hard-codes Log Utility into the objective function and calls it "growth." It smuggles in the value judgment that you care about the *percentage change* in your wealth equally at all wealth levels (constant relative risk aversion of 1).

  ### 2. The "Probability 1" Defense vs. The Finite Horizon

  Thorp's defense relies on asymptotic dominance: "Given enough bets, Kelly beats any other strategy almost surely."

  Samuelson's rebuttal (the "sleight of hand" you mentioned) is that **"almost surely" does not mean "always," and "long run" does not mean "infinite."**
  *   **The Path Matters:** Kelly maximizes the *median* terminal wealth, but it does not maximize the *mean* terminal wealth. A strategy that bets slightly more than Kelly (overbetting) has a higher *expected* value, but a high probability of ruin. A strategy that bets less than Kelly (underbetting) has a lower growth rate but a much smoother path.
  *   **Finite Time:** In any finite timeframe (a career, a life), there is a non-zero probability that a Kelly bettor will underperform a conservative bettor. If you have a liability due in 5 years, the asymptotic argument is irrelevant.
  *   **The "Gambler's Ruin" Nuance:** Samuelson pointed out that if you compare a Kelly bettor to a bettor who uses a slightly different strategy, the Kelly bettor will have more wealth than the other bettor with probability approaching 1 as $N \to \infty$. *However*, the expected utility of the other bettor can still be higher if the "other" strategy captures the fat tails of the distribution that Kelly sacrifices to avoid ruin.

  ### 3. Why Practitioners (Like Thorp) Bet Fractional Kelly

  You noticed that Thorp, despite writing the book on Kelly, often bet half-Kelly or less. This is the most important part for you as a sports bettor. This is not just a concession to Samuelson; it is a concession to **reality**.

  There are two main reasons for fractional Kelly, and one is philosophical while the other is practical.

  **A. The Practical Reason: Estimation Error (The Edge is Unknown)**
  This is the killer in sports betting. Kelly requires precise knowledge of your edge ($p$) and the odds ($b$).
  *   Formula: $f^* = \frac{p(b+1) - 1}{b}$
  *   If you overestimate your edge by even a small amount, Full Kelly becomes **Over-Kelly**.
  *   **Over-Kelly is dangerous:** If you bet double-Kelly, your expected growth rate drops to zero. If you bet more than double-Kelly, your expected growth rate becomes *negative*, and you will go bankrupt almost surely.
  *   In options trading, edges can be modeled with high precision (volatility surfaces, etc.). In sports betting, your "edge" is an estimate based on CLV and historical models. It is noisy. Fractional Kelly acts as a safety buffer against your own overconfidence.

  **B. The Philosophical Reason: Drawdown Tolerance (Utility)**
  Full Kelly is volatile. It is not uncommon for a Full Kelly strategy to experience 50% drawdowns.
  *   Mathematically, a 50% drawdown requires a 100% gain to recover.
  *   Psychologically, most humans (and investment committees) cannot withstand a 50% drop in bankroll without quitting or changing strategy.
  *   By betting Half-Kelly, you sacrifice only ~25% of the theoretical growth rate, but you reduce the volatility and drawdowns by roughly 50%.
  *   **This is a utility decision.** It is an admission that "smoothness of equity curve" has value to the bettor, which contradicts the pure Log Utility assumption of Full Kelly.

  ### 4. Is Fractional Kelly a Concession to Samuelson?

  **Yes, but it's also a concession to Reality.**

  *   **Concession to Samuelson:** It acknowledges that Log Utility might not be *your* utility function. If you are more risk-averse than Log (which most people are), Full Kelly is too aggressive. Fractional Kelly effectively shifts your implied utility function to be more risk-averse (e.g., Half-Kelly implies a utility function closer to $U(W) = -1/W$).
  *   **Concession to Reality:** It acknowledges that you do not know the true probabilities. In sports betting, the "true" probability is unknowable. Full Kelly assumes you know the truth. Fractional Kelly assumes you are estimating.

  ### The Bottom Line for Your Sports Betting

  Your buddy the options trader is right that flat betting is inefficient *if* you have a stable, known edge. But he is wrong that Full Kelly is "THE mathematically correct one" for a human bettor.

  1.  **There is no free lunch:** Choosing Kelly is choosing Log Utility. It is a value judgment that you care about long-term geometric growth more than short-term volatility or arithmetic mean wealth.
  2.  **Samuelson was right about the "Sleight of Hand":** Ignoring utility doesn't make it go away; it just hides it. The "Probability 1" argument only holds in the limit, and none of us bet in the limit. We bet in finite time with finite patience.
  3.  **Fractional Kelly is the Standard for a Reason:** In sports betting, where edges are small and estimates are noisy, Full Kelly is effectively "suicide by variance."
      *   **Quarter-Kelly to Half-Kelly** is the sweet spot. It captures most of the growth optimality while providing a massive buffer against model error and emotional tilt.

  **Summary:** The Kelly Criterion is the optimal strategy for **maximizing the growth rate of wealth assuming you know the true probabilities and have Log Utility.** Since you likely don't know the true probabilities perfectly and likely have higher risk aversion than Log, Full Kelly is not "correct." Fractional Kelly is the pragmatic admission that while the math of growth is objective, the application of it is subjective.

  Tell your buddy: "Thorp bets half-Kelly because he knows his edge isn't perfect. If the master of Kelly doesn't trust Full Kelly, why should I?"
