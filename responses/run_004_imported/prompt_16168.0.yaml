answer: |-
  **Setting:** *The hallway outside the lecture hall, 5:15 PM. The crowd from the colloquium is thinning out. Paul (Perdurantist) is lingering by the coffee urn; Elena (Endurantist) approaches with her coat over her arm.*

  **Paul:** Elena, good to see you. I was hoping I'd run into you. What did you make of the talk? The speaker really leaned into the Sider line, didn't they? The idea that Special Relativity basically just hands the persistence debate to the four-dimensionalist on a silver platter.

  **Elena:** It was a solid talk, Paul, but I think the "silver platter" is a bit tarnished. The speaker assumed too quickly that the endurantist is committed to a privileged, frame-independent notion of simultaneity. That's the linchpin of Sider's argument: that for me to be "wholly present" at a time, there must be a unique, objective fact about which of my spatial parts exist together. But why accept that?

  **Paul:** Because without it, "wholly present" loses its grip. Look, in Minkowski spacetime, there is no unique foliation into global "nows." If you say you are wholly present at $t$, and I ask "Which $t$?", you have to specify a reference frame. But if your existence is frame-relative, aren't you just admitting that there is no single *you* that persists? There's a you-for-Frame-A and a you-for-Frame-B. That sounds less like endurance and more like you've just chopped the worm into overlapping slices and given each slice a name.

  **Elena:** That's the first move I want to resist. I'm not chopping anything. I'm saying that *location* is frame-relative. I am wholly present at spacetime region $R_1$ relative to Frame A, and wholly present at region $R_2$ relative to Frame B. These regions are different, yes, but *I* am the same entity located at both. I don't need a God's-eye view of the universe to be wholly present. I just need to be fully located at the spacetime region defined by an observer's simultaneity hyperplane. Why is that incoherent?

  **Paul:** Because it creates a problem of "ontological proliferation" that perdurantism avoids. If you are wholly present at $R_1$ and wholly present at $R_2$, and $R_1$ and $R_2$ are distinct spacetime regions that overlap but aren't identical, then you are saying that the *whole* object is at $R_1$ and the *whole* object is at $R_2$. But in SR, those regions contain different sets of spacetime points. So, relative to Frame A, you have a certain shape and mass distribution. Relative to Frame B, due to Lorentz contraction, you have a different shape. If the *whole* you is at $R_1$ and the *whole* you is at $R_2$, aren't you attributing incompatible intrinsic properties to the same substance? You're straight-at-$R_1$ and bent-at-$R_2$. That looks like a contradiction unless you admit those are actually different parts of a larger worm.

  **Elena:** That's the old problem of temporary intrinsics, just dressed up in relativistic clothing. And the solution is the same: properties are relations to regions or frames. I'm not straight simpliciter; I'm straight-relative-to-$R_1$. I'm not bent simpliciter; I'm bent-relative-to-$R_2$. There's no contradiction there. But here is where I think your view begs the question. You assume that the only way to avoid the contradiction is to say I have a part at $R_1$ and a distinct part at $R_2$. I say *I* am at both, but my properties are indexed to the location. Why is your ontology of "temporal parts" more parsimonious than my ontology of "frame-relative properties"?

  **Paul:** Because of invariance. In physics, we look for the invariant quantities—the things that don't change depending on who's looking. The four-dimensional worm is an invariant geometric object in spacetime. Its shape in 4D doesn't change based on the frame; only the *slice* changes. Your view makes the object itself frame-dependent. You're saying the *object* changes its shape and properties depending on the coordinate system. That makes the object less real than the worm. The worm is the physical reality; your "wholly present objects" are just perspectival shadows cast by that worm on different hyperplanes. If metaphysics is about what fundamentally exists, isn't the worm the fundamental thing?

  **Elena:** I'd challenge the idea that the worm is an "object" in the sense that matters for persistence. The worm is a history. It's a mathematical abstraction of a trajectory. When I interact with a table, I don't interact with a four-dimensional history; I interact with a three-dimensional surface at a moment. My metaphysics is supposed to track the locus of causal power and interaction. Those interactions happen on hypersurfaces. So, the "wholly present" object is the causally efficacious entity. The worm is just the sum of those causal possibilities. If you say the worm is fundamental, you're prioritizing geometric elegance over the phenomenology of agency and interaction.

  **Paul:** But that phenomenology is exactly what SR undermines! There is no unique "moment" of interaction that everyone agrees on for spacelike separated events. If you prioritize the "now" of interaction, you have to pick a frame. And if you pick a frame, you're violating the spirit of relativity, which says no frame is privileged. So you're left with two bad options: either you pick a frame and fight physics, or you accept all frames and admit that "the object" is just a frame-relative manifestation of the worm. If you take the second option—which it seems you are—you're basically a perdurantist who refuses to use the word "part." You agree the worm exists; you just insist on calling cross-sections "the object."

  **Elena:** Not quite. The difference is modal and mereological. On your view, if I had moved my hand five minutes ago, a different temporal part would exist. The "me" of now is ontologically distinct from the "me" of then. They are related, but they are different entities. On my view, *I* could have moved my hand. It is the same substance that endures through the different possibilities. By chopping me into temporal parts, you lose the ability to say that *I* persist through counterfactual changes. You have a counterpart theory of modality. I keep the transworld identity. So even if I concede that my existence is frame-relative, I'm still holding onto a unified substance that travels through modal space in a way your worm cannot. Your worm is fixed; I am flexible.

  **Paul:** That's a strong modal point, I'll grant you. But does it survive the relativistic pressure? If you are the same substance located at $R_1$ and $R_2$, and $R_1$ and $R_2$ are spacelike separated, then in some frames, $R_1$ is in the past of $R_2$. In others, they are simultaneous. In others, $R_1$ is in the future. If you are wholly present at both, you are wholly present in your own past and future depending on the observer. That dissolves the asymmetry of time for the object itself. If you are wholly present in the future, in what sense are you "persisting" toward it? You're just *there*. And if you're just there, across all these overlapping regions, the distinction between "enduring through time" and "extending through time" becomes verbal. You've saved the word "substance," but you've lost the dynamic notion of persistence that endurantism was supposed to capture.

  **Elena:** I don't think I've lost the dynamic notion, because persistence isn't about moving through time; it's about being present at times. The "dynamism" comes from the causal connections between the regions I occupy, not from the ontological replacement of parts. But let's turn the tables. You say the worm is the invariant reality. But we never experience worms. We experience slices. If metaphysics is supposed to explain our experience of objects, and your fundamental ontology is something we cannot, even in principle, encounter as a whole, haven't you made the object too abstract to do the work we need it to do? I'm willing to accept frame-relativity to save the idea that *I* am here, now, as a whole thing. Are you willing to accept that the "real" you is a four-dimensional block that you can never actually meet?

  **Paul:** I'm willing to accept it because it's the only view that treats spacetime as a unified manifold rather than a stack of "nows" glued together by metaphysical fiat. But I see your point. We're at an impasse. You're willing to relativize the object to save the unity of the substance; I'm willing to fragment the substance to save the unity of spacetime.

  **Elena:** Precisely. And I suspect no amount of Minkowski diagrams will decide which price is too high to pay.

  **Paul:** Probably not. Though I still think the worm is prettier.

  **Elena:** And I still think the worm is a graveyard. Let's continue this over dinner? I know a place that serves excellent three-dimensional pasta.

  **Paul:** *Laughs.* As long as it doesn't ask about my reference frame before serving it. Lead the way.
