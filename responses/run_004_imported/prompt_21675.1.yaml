answer: |-
  The notification arrived on David's phone at 6:03 AM, a soft chime that felt disproportionately heavy for a Tuesday. *Governance Update: Proposal 88-B Resolved.* He didn't need to open the app to know the result. The air in the house had changed, the way the pressure drops before a storm.

  He walked into the kitchen where his father was eating oatmeal, spooning it slowly with a hand that trembled slightly. The morning light hit the dust motes dancing over the table. In three months, this kitchen would be part of a demolition zone.

  "The market closed," David said.

  His father looked up, eyes cloudy but present. "And?"

  "Incubator. It beat the Hospice Expansion by twelve points."

  David sat down. He wasn't a trader. He was a high school history teacher, and he found the mechanics of the town's new system exhausting. Five years ago, the town of Aethelgard had adopted futarchy to break the gridlock of endless council meetings. The citizens had voted once, in a grand constitutional convention, on a single definition of welfare: The Aethelgard Civic Index (ACI). It was a weighted formula of property values, local business revenue, and population retention. That was the "Vote on Values."

  Everything else was "Bet on Beliefs." If you wanted to build a park, you didn't petition the council. You created a market. Traders bought shares in 'Yes' or 'No' based on whether the park would raise or lower the ACI over a five-year horizon. The option with the highest projected ACI became law. It was supposed to remove ideology. It was supposed to be math.

  "It's better for the town," his father said, repeating the line David had heard a dozen times already. "The biotech firm brings jobs. Jobs raise the Index."

  "It closes the hospice wing, Dad."

  "It says we relocate. The market predicts the relocation costs are offset by the tax revenue."

  David stood up and walked to the window. The backyard bordered the facility where his father had been receiving palliative care for the last six months. It was a quiet place. The garden was overgrown, but the benches were solid wood. You could hear the birds. The biotech incubator would be glass and steel, humming with servers and ventilation units.

  He drove to the Municipal Hub to meet with Sarah, the Town Administrator. She was one of the few people who still treated the system like a government rather than a casino. Her office was sparse, dominated by a large screen displaying the live ACI ticker. It was up 0.4% since the market closed.

  "Twelve points," David said, sitting in the chair opposite her. "That's a landslide in this system."

  "The liquidity was high," Sarah said, not looking up from her tablet. "The traders are confident in the revenue projections. The biotech lease is ironclad. The hospice relocation is... flexible."

  "Flexible," David repeated. "You're moving dying people to a strip mall office park."

  "The Index doesn't measure location aesthetics, David. It measures fiscal solvency and retention. The model shows that without the biotech revenue, the town's ability to fund *any* social services drops by fifteen percent in four years. The market is optimizing for survival."

  "That's the thing, though," David said, leaning forward. "Five years ago, when we voted on the Index, we thought we were voting on 'survival.' We thought we were voting on 'prosperity.' But we didn't define what prosperity *felt* like. We just defined how to count it."

  Sarah finally looked at him. "We had to pick a number. You can't trade on a feeling."

  "So you traded on a proxy," David said. "And now the proxy has eaten the reality. The traders aren't wrong, Sarah. They're playing the game perfectly. They know that a living tenant in a biotech lab generates more ACI points than a dying tenant in a hospice bed. The market is efficient. It's the values that are bankrupt."

  "The values were voted on democratically," Sarah said, her voice tightening. "That was the election. This is just the execution."

  "That's my point. We voted once, in the abstract. We didn't know we were voting to prioritize tax revenue over dignity. We just thought we were voting for 'good government.' Now, every time a specific decision comes up, the market forces us to cash out that abstraction. And every time, the number wins."

  Sarah sighed and turned to the screen. The green line of the ACI ticked upward. "If we override the market, we break the system. Trust evaporates. Capital leaves. Then we have no money for the hospice at all."

  "I know," David said. "I'm not asking you to break it. I'm just telling you what it cost."

  He left the Hub and drove to the facility. He walked through the garden. A group of traders from the city were standing near the entrance, looking at the building, tablets in hand. They weren't looking at the flowers. They were looking at the square footage, the zoning potential, the infrastructure load. They weren't villains. They looked like accountants. They were just following the incentives created by the number Aethelgard had chosen to worship.

  David found his father in the common room. He was watching a bird feeder outside the window.

  "Did you talk to them?" his father asked.

  "I talked to Sarah."

  "And?"

  "The Index goes up. The town gets richer. We move."

  His father nodded slowly. "It's a clean system, in a way. No one to yell at. No councilman to bribe. Just the truth of what things are worth."

  "Is it the truth?" David asked. "Or is it just the price?"

  His father didn't answer. He just watched the birds. A sparrow landed on the feeder, fluttered, and flew away.

  David walked back to his car. He opened the governance app on his phone. He navigated to the 'Constitutional Parameters' section. It was greyed out. To change the ACI formula required a 75% supermajority referendum, a threshold that hadn't been met in a decade. It was easier to sell the town than to change the way the town counted itself.

  He sat in the driver's seat for a long time. The ACI ticker on his dashboard widget blinked green. +0.5%. The town was doing better. The town was thriving.

  David put the car in gear. He had to go to work. He had to teach history to children who would grow up in a town where the value of a thing was determined by what it could be wagered to yield. He merged onto the main road, passing the construction crews already setting up surveyor tripods on the hospice lawn. They were measuring the ground, preparing to build the future.

  The number went up. The light turned red. David stopped, waiting for the signal to change, watching the traders walk across the crosswalk, confident in their math, while the bird feeder in the garden behind them swung empty in the wind. He didn't know if the system was wrong, or if they were. He only knew that the cost had been paid, and the receipt was a single, rising digit that no one could spend.
