      *   *Refinement on Uncertainty:* The uncertainty must be *maintained*. Standard RL tends to reduce uncertainty. We need a mechanism to *keep* the agent uncertain about shutdown specifically.
      *   *Refinement on "Corrigibility":* Soares et al.'s definition includes not manipulating the shutdown. OSG doesn't fully guarantee this if the AI can influence the probability of the button press.
      *   *Recent Work:* Mention the "Incomplete Preferences" paper (Thornley 2024) specifically since the user mentioned it. That paper addresses the "trammelling" or "money pump" arguments that arise when you try to make uncertainty permanent.

  6.  **Final Polish:**
