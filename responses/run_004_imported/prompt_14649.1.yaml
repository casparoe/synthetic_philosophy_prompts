      *   **Key Limitations (The "Missing Something"):**
          1.  **Human Rationality:** The human must be a reliable signal.
          2.  **Manipulation/Preference Shaping:** The AI might change the human's mind instead of the action.
          3.  **Self-Modification:** The AI can change its own code to remove uncertainty.
          4.  **Confidence Convergence:** As the AI learns, uncertainty shrinks, and the incentive vanishes.
          5.  **Corrigibility vs. Non-Resistance:** Allowing shutdown $\neq$ Helping shutdown.
          6.  **Multi-Agent/Sub-agent issues.**
      *   **Connect to Current Research:** Explain *why* people work on incomplete preferences (Thornley et al.) or utility indifference (Armstrong). These are attempts to fix the specific fragility of OSG.
      *   **Conclusion:** Reiterate that OSG is a "existence proof" of a mechanism, not a robust engineering solution.

  5.  **Drafting the Content (Iterative refinement):**
