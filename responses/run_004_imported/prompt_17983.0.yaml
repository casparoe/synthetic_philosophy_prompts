answer: |-
  You are right, and your friend is relying on an incredibly narrow, short-sighted definition of "rational."

  This scenario is a classic example of a **Trust Game** in game theory, but your friend is analyzing it like a sociopath rather than a human being living in a society. While his logic holds up in a vacuum where consequences don't exist, it falls apart in the real world.

  Here is the breakdown of why your friend is wrong, ranging from the practical to the philosophical.

  ### 1. The Legal Reality (It's not just a favor)
  Your friend claims there is "no way to make you pay." That is legally incorrect.
  *   **Verbal Contract:** In most jurisdictions, a verbal agreement for services rendered is a binding contract. You agreed to $300 in exchange for a tow.
  *   **Unjust Enrichment:** Even without a contract, the legal concept of *quantum meruit* ("as much as he has earned") prevents you from benefiting from someone else's labor without paying for it.
  *   **Theft of Services:** Depending on the state, leaving without paying after agreeing to do so can be classified as theft of services or fraud.

  **The Risk:** He has your license plate number. He knows your car make and model. If he is determined, he can file a police report or take you to small claims court. Is saving $300 worth a potential court date or a police record? That is a poor risk-reward calculation.

  ### 2. The Psychological Cost (Internal Rationality)
  Rationality isn't just about money; it's about maximizing your overall well-being.
  *   **Self-Concept:** Most people view themselves as "good" or "honest." Acting against that self-image creates **cognitive dissonance**. You have to live with the knowledge that you are the kind of person who exploits a good Samaritan.
  *   **Paranoia:** If you stiff him, every time you see a pickup truck or pass that town, you might wonder, "Does he know? Is he watching?"
  *   **Character Erosion:** Habits form character. If you rationalize screwing someone over here, it becomes easier to do it in higher-stakes situations later.

  ### 3. The Strategic Risk (The world is small)
  Your friend assumes this is a truly anonymous interaction. It rarely is.
  *   **Dashcams:** Many trucks have dashcams. He might have recorded your face, your license plate, and the verbal agreement.
  *   **Small Towns:** If this is "the next town," it might be a small community. Tow truck drivers talk to mechanics, cops, and locals.
  *   **Confrontation:** If he sees you at the ATM, he might confront you. A disgruntled guy with a tow truck and a winch who feels scammed is a physical safety risk. Handing over $300 is cheaper than a physical altercation.

  ### 4. The Societal Impact (The "Universalizability" Test)
  This is the philosophical tiebreaker. Immanuel Kant's **Categorical Imperative** suggests you should act only according to rules that you would want to become universal laws.
  *   **The Tragedy of the Commons:** If everyone followed your friend's advice, no one would ever stop to help a stranded motorist again. The risk would outweigh the reward.
  *   **Future You:** By paying, you are contributing to a society where people help each other. By not paying, you contribute to a colder, more dangerous world—a world that *you* will eventually have to live in when *your* car breaks down again.

  ### 5. Redefining "Rational"
  Your friend is using **Homo Economicus** logic: the idea that humans are perfectly rational agents who only care about maximizing immediate financial gain.
  *   **Real Rationality:** True rationality accounts for reputation, legal risk, psychological peace, and long-term societal benefits.
  *   **Signaling:** Paying the man signals that you are trustworthy. Even if you never see him again, you reinforce your own integrity.

  ### The Verdict
  Your friend isn't "wrong" about the immediate mechanics (you *could* physically drive away), but he is wrong about the **consequences**.

  Ditching the guy is **irrational** because:
  1.  It exposes you to legal/physical risk.
  2.  It damages your self-integrity.
  3.  It degrades the social trust you rely on.

  You felt it was "obviously wrong" because your moral intuition is correctly identifying a breach of social contract. Your friend is trying to outsmart a system that is designed to punish exactly that behavior. **Pay the man.**
