answer: |-
  **Elena:** You're treating the distinction between tyranny *ex defectu tituli* and *ex parte exercitii* as a retrofit, Marcus. But look at the metaphysics in *II Sentences*, distinction 44. Aquinas isn't offering a political loophole; he's defining authority. A usurper lacks the form of authority. He isn't a ruler; he's a violent aggressor. Killing him isn't tyrannicide; it's self-defense. That principle doesn't vanish in *De Regimine*. It's presupposed.

  **Marcus:** It's presupposed verbally, perhaps, but suffocated practically. In the *Sentences*, a private individual can licitly kill the usurper. In *De Regimine*, written for the King of Cyprus, Aquinas wraps even that possibility in so many caveats about sedition that the permission becomes theoretical. He worries that "ambitious men" will use the label of usurper to depose legitimate kings. That anxiety isn't in the early commentary. It's a hardening.

  **Elena:** It's not hardening; it's elaboration. The *Sentences* is a classroom commentary on Lombard's propositions. It's abstract. *De Regimine* is counsel for a reigning monarch. Of course he emphasizes stability. But the logical structure remains: if the title is null, the authority is null. The warning about sedition applies to tyranny of *exercise*, where the title holds. You're conflating the two categories to manufacture a development.

  **Marcus:** Am I? In *De Regimine* I.6, he argues that even against a tyrant, private presumption is dangerous. He pushes remedy toward public authority—the community or a superior. But if a usurper is merely a private aggressor, as the *Sentences* says, why does the community need to act? Why can't the private citizen act then? Aquinas doesn't explicitly reaffirm the private right against the usurper in the later text. He lets it drop. That silence is deafening.

  **Elena:** Silence isn't revocation. He doesn't reaffirm it because he doesn't need to; the metaphysical status of the usurper hasn't changed. What changes is the recognition that judging title is often as contentious as judging exercise. But that's prudence, not a change in doctrine. You're arguing that because Aquinas became more cautious about the *application*, he abandoned the *principle*.

  **Marcus:** I'm arguing that in political thought, prudence *is* the doctrine. If the earlier text gives a weapon to the private conscience and the later text takes it away because it's too dangerous, the political teaching has shifted. The *Sentences* trusts the individual's judgment of legitimacy. *De Regimine* distrusts it profoundly. That's not just context; that's a different anthropology of the citizen.

  **Elena:** It's a consistent anthropology of fallen man. In both texts, private judgment is risky. In the *Sentences*, the risk is outweighed by the injustice of the usurpation. In *De Regimine*, he's weighing the risk of tyranny against the risk of civil war. He concludes civil war is often worse. That's a utilitarian calculation layered on top of the metaphysical distinction, not a replacement of it. The distinction still does the work: it tells you *what* the tyrant is. Prudence tells you *what to do* about him.

  **Marcus:** But the distinction collapses if you can't act on it. If the only licit response to a usurper must wait for public authority, and the usurper controls the public authority, you've effectively granted immunity. The *Sentences* allowed a rupture. *De Regimine* closes the circuit. Your "unity" reading saves Aquinas's consistency by making the earlier permission practically inert.

  **Elena:** No, it saves it by recognizing that authority is relational. If the community accepts the usurper, does he become legitimate? Aquinas hints at this. But if he remains a pure aggressor, the right remains. You want to read Aquinas as a proto-revolutionary in the *Sentences* and a statist in *De Regimine*. I'm reading him as a realist in both.

  **Marcus:** And I'm reading him as a thinker who realized that defining legitimacy is easier than enforcing it without destroying the common good. The *Sentences* is clean logic. *De Regimine* is messy politics. To say they're perfectly consistent is to privilege the logic over the politics.

  **Elena:** And to say they're inconsistent is to privilege the politics over the logic. Maybe the tension isn't between the texts, but between justice and order themselves. Aquinas doesn't resolve that tension; he just maps it.

  **Marcus:** Then we agree he doesn't resolve it. We just disagree on whether he changed his mind about where the balance lies.

  **Elena:** Or whether the balance was always there, and we're just looking at different sides of the scale.
