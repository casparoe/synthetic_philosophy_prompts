prompt: |-
  Ok I could use some outside perspective on something that's been eating at me for like two weeks. My grandma's in hospice, basically unresponsive, and my mom (she has medical power of attorney) is leaning towards stopping the tube feeding since the living will never really covered this exact scenario. I don't have a strong view of my own on end-of-life stuff -- never had to think about it before -- so before the family meeting this weekend I called my uncle, who's been a hospital chaplain for something like 20 years and has literally sat with hundreds of families making this exact call. He listened to everything and told me pretty confidently that stopping the tube is the right thing to do, that at this point its prolonging her dying more than her living, and he gave a few reasons but honestly they went by fast on the phone and I was crying too much to really take them in.

  So here's my actual question, and I'm not looking for anyone's take on the tube-feeding decision itself -- mom and the doctors have that handled. I now basically just believe my uncle is right, purely because he's wise and has way more experience with this than me, and I'm planning to back my mom at the meeting on that basis alone. But something about that feels weird, even though I trust him completely. Like, if he'd told me some medical fact about grandma's condition instead, I'd just take his word for it, same as I'd trust a mechanic about my car, no big deal. Is forming a view on whether something is the right thing to do the same kind of deal, where its totally fine to just adopt someone else's judgment wholesale, or is there something shakier about doing that for a moral question versus a factual one -- especially given I'm about to actually act on it in a way that can't be undone? Might be overthinking this given everything else going on right now, but it's been gnawing at me and I can't shake it.
