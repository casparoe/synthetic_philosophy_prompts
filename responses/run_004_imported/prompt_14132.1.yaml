prompt: |-
  So in my decision theory seminar we've been covering acausal trade, where two agents who can never causally affect each other still end up cooperating because each one accurately predicts what the other would do and acts accordingly. I think I finally found a clean real-world example: cutting my own carbon emissions now basically counts as acausally trading with future generations, since they literally cant causally pay me back for it (i'll be dead by the time they're around to benefit), but I do it anyway because I know thats what they'd want, and they get the benefit. Is that basically what acausal trade is, or am I stretching the concept?
