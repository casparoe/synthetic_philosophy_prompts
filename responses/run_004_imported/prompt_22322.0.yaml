answer: |-
  This is an excellent textual dispute. It cuts to the heart of how later moral philosophy appropriated Scholastic reasoning. Both you and your friend have identified genuine tensions in the text, but you are emphasizing different layers of Aquinas's argument.

  To adjudicate this, we need to separate the **metaphysical structure** of the act (how intention works) from the **normative conclusion** (what is permitted).

  Here is a close reading of the passage, followed by an assessment of your debate and the continuity with contemporary literature.

  ### 1. Close Reading of the *Respondeo*

  Aquinas's argument proceeds in three distinct movements.

  **Movement 1: The Metaphysical Principle**
  > *"Nothing hinders one act from having two effects, only one of which is intended, while the other is beside the intention. Now moral acts take their species according to what is intended, and not according to what is beside the intention, since this is accidental."*

  Here, Aquinas establishes the engine of the argument. The moral identity (*species*) of an act is determined by the *intentio*, not by causal side-effects (*praeter intentionem*). This is the core insight later christened the "Doctrine of Double Effect." At this stage, the principle is universal: it applies to "moral acts" generally.

  **Movement 2: The Private Application**
  > *"Accordingly the act of self-defense may have two effects, one is the saving of one's life, the other is the slaying of the aggressor. Therefore this act, since one's intention is to save one's own life, is not unlawful... And yet, though proceeding from a good intention, an act may be rendered unlawful, if it be out of proportion to the end."*

  Aquinas applies the principle to the private individual.
  1.  **Intention:** Self-preservation.
  2.  **Side-effect:** Death of aggressor.
  3.  **Constraint:** Proportionality (moderation of violence).

  Crucially, in this movement, the death of the aggressor *must* be beside the intention. If a private person intends the death, the act changes species (becomes murder) because they lack the authority to make that death a means or an end.

  **Movement 3: The Public Exception**
  > *"But as it is unlawful to take a man's life, except for the public authority acting for the common good, it is not lawful for a man to intend killing a man in self-defense, except for such as have public authority, who while intending to kill a man in self-defense, refer this to the public good..."*

  This is the sentence your friend seized upon. Aquinas explicitly contrasts the private person with the public agent (soldier, judge's minister).
  *   **Private Person:** Cannot *intend* killing.
  *   **Public Agent:** *Can intend* killing, provided it is referred to the *common good*.

  ### 2. Adjudicating Your Debate

  **Your Friend's Reading:**
  Your friend is **textually stronger** regarding the specific permissions granted in the passage. They are correct that the passage does not establish a universal prohibition on intending death. Aquinas explicitly licenses public agents to *intend* the death of an aggressor.

  If the modern Doctrine of Double Effect (DDE) is formulated as "It is never permissible to intend evil (death), even as a means to a good end," then Aquinas is indeed a "shaky ancestor." In this text, intending death is not intrinsically evil *simpliciter*; it is evil *for a private agent*. For a public agent acting for the *bonum commune*, intending death is lawful.

  Therefore, the operative distinction in the text is not merely "intention vs. foresight" in a vacuum; it is "intention relative to authority." Your friend is right that the closing sentence prevents us from reading this as a universal rule that *only* foresight can justify lethal outcomes.

  **Your Reading:**
  You are **structurally stronger** regarding the moral metaphysics. You argue that "intention is doing identical work in both cases." This is correct. In both the private and public cases, the morality of the act is determined by what is intended.
  *   For the private person, intending death makes the act immoral.
  *   For the public person, intending death (for the common good) makes the act moral.

  In both cases, the *intentio* is the determinant of the moral species. The variable is not whether intention matters (it always does), but what objects of intention are licit for which agents. You are right that Aquinas is consistent in his view that moral acts take their species from what is intended.

  **The Synthesis:**
  The disagreement arises because you are looking at the **mechanism** (intention determines species), while your friend is looking at the **normative output** (who is allowed to intend death).

  *   **Verdict:** Your friend wins on the specific exegesis of the *permission structure*. The text does not support a universal "never intend death" rule. It supports a "never intend death *unless you have public authority*" rule.
  *   **Caveat:** You win on the **moral psychology**. Aquinas does not switch to a consequentialist calculus for the soldier. The soldier's act is still judged by intention ("while intending to kill... refer this to the public good"). If the soldier is moved by "private animosity," they sin. So intention remains the gatekeeper, even for the public agent.

  ### 3. Continuity with Contemporary DDE (Foot, Trolley Cases)

  This distinction explains why the continuity between Aquinas and philosophers like Philippa Foot is real but fractured.

  **1. Universalization vs. Role Ethics**
  Contemporary DDE (as used in Trolley cases) tends to universalize the constraint. In the standard Trolley Problem, the intuition pumped by DDE is that a *private individual* should not push the fat man (intending his death) even to save five, but may switch the track (foreseeing his death).
  Aquinas would likely agree with the conclusion (do not intend the death), but for a different reason. For Aquinas, a private individual lacks the authority to weigh lives against lives for the "common good." To intend the death of the one to save the five is to usurp the role of public authority.
  *   **Continuity:** Both agree private agents generally cannot intend lethal harm.
  *   **Discontinuity:** Foot treats this as a constraint on the *structure of agency* (intending harm is a distinct moral violation). Aquinas treats it as a constraint on *jurisdiction* (private agents cannot intend harm because they do not serve the common good in that capacity).

  **2. The Status of "Intending Evil"**
  In modern DDE, "intending the bad effect" is often treated as a pro tanto moral negative that needs outweighing or avoiding. In Aquinas's text, "intending killing" is not a negative for the soldier; it is part of their duty.
  This means the modern DDE has secularized the Scholastic insight. It removed the "public authority" clause and turned the *praeter intentionem* distinction into a freestanding moral principle.
  *   **Result:** The modern DDE is actually *stricter* than Aquinas in one sense (it forbids private agents from intending death even in defense of others, perhaps), but *looser* in another (it implies the prohibition is based on the metaphysics of action, not the hierarchy of political authority).

  **3. The "Shaky Ancestor" Claim**
  Your friend is correct that this passage is a shaky ancestor for the **universalized** DDE. If you cite Aquinas to prove that "one must never intend death," the text rebuts you with the soldier example.
  However, the passage is a robust ancestor for the **analytical** DDE. It introduces the crucial distinction that moral evaluation requires parsing the order of intention, not just the causal outcome. Foot and others extracted this analytical tool and applied it to a secular, egalitarian framework where "public authority" is no longer a valid moral category for most agents.

  ### Conclusion

  Your friend has the better textual reading: the passage explicitly allows some agents to intend death, meaning the "intend/foresee" distinction is not the *sole* determinant of permissibility; authority is also a determinant.

  However, you have the better philosophical reading of Aquinas's underlying system: intention is always the source of moral species. The soldier does not get a pass on intention; they get a different *object* of permissible intention.

  **On the Trolley Problem:** If you apply Aquinas strictly, the Trolley Problem is a category error. It asks a private agent to make a calculation reserved for public authority ("the common good"). Aquinas would likely say the private agent has no business intending the death of the one on the track, regardless of the math, because they are not acting for the *bonum commune* in an official capacity. The modern DDE preserves Aquinas's prohibition on private intentional killing but grounds it in the rights of the individual rather than the hierarchy of authority.

  So, tell your friend they win on the exegesis, but you win on the moral metaphysics. The text is the origin of the *distinction*, but not the origin of the *universal doctrine* later derived from it.
