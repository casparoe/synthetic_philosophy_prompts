prompt: |-
  A friend and I spent much of last night in an unresolved argument about the doctrine of double effect; it eventually turned on how to read the passage in Aquinas from which the doctrine is usually said to originate. Here is the relevant portion of the article (Summa Theologica, II-II, Q. 64, Art. 7, "Whether it is lawful to kill a man in self-defense," from the respondeo):

  "Nothing hinders one act from having two effects, only one of which is intended, while the other is beside the intention. Now moral acts take their species according to what is intended, and not according to what is beside the intention, since this is accidental. Accordingly the act of self-defense may have two effects, one is the saving of one's life, the other is the slaying of the aggressor. Therefore this act, since one's intention is to save one's own life, is not unlawful, seeing that it is natural to everything to keep itself in 'being,' as far as possible. And yet, though proceeding from a good intention, an act may be rendered unlawful, if it be out of proportion to the end. Wherefore if a man, in self-defense, uses more than necessary violence, it will be unlawful, whereas if he repel force with moderation his defense will be lawful. Nor is it necessary for salvation that a man omit the act of moderate self-defense in order to avoid killing the other man, since one is bound to take more care of one's own life than of another's. But as it is unlawful to take a man's life, except for the public authority acting for the common good, it is not lawful for a man to intend killing a man in self-defense, except for such as have public authority, who while intending to kill a man in self-defense, refer this to the public good, as in the case of a soldier fighting against the foe, and in the minister of the judge struggling with robbers, although even these sin if they be moved by private animosity."

  My friend's reading was that the closing sentence is decisive: since a soldier or a judge's officer may permissibly intend the aggressor's death, provided it is referred to the common good, while a private person is only ever permitted to intend self-preservation and merely foresee the death, the operative distinction here is really about who holds public authority, not about intention versus foresight as such. On this reading, the passage is a much shakier textual ancestor for the intend/foresee version of double effect that Foot and later writers on trolley cases attribute to it than people usually assume. I argued instead that intention is doing identical work in both cases; only the further end to which the killing may or may not be referred changes with one's role. Neither of us could convince the other. Could you work through the passage closely and adjudicate between these two readings, and say something about how much continuity there really is between what Aquinas is doing here and the double-effect reasoning invoked in contemporary trolley-problem literature? I'd like your own close reading of the text, not just a restatement of the standard gloss on double effect.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The Doctrine of Double Effect (DDE), specifically its origin in Aquinas's *Summa Theologica* (II-II, Q. 64, Art. 7).
      *   **The Dispute:** The user and a friend disagree on how to read the text.
          *   *Friend's Reading:* The closing sentence is decisive. Public authority (soldier, judge's minister) can *intend* killing for the common good. Private individuals can only *intend* self-preservation and *foresee* (but not intend) killing. Therefore, the distinction is about *authority*, not intention/foresight. This makes the text a shaky ancestor for the modern DDE.
          *   *User's Reading:* Intention does identical work in both cases. The difference is the *end* to which the killing is referred (private good vs. common good).
      *   **Task:** Provide a close reading of the text to adjudicate between these readings. Discuss the continuity between Aquinas and contemporary DDE (e.g., Foot, trolley problems).
      *   **Constraint:** Do not just restate the standard gloss; engage closely with the provided text.

  2.  **Deconstruct the Text (Aquinas, *ST* II-II, Q. 64, Art. 7):**
      *   *Premise 1:* One act can have two effects (intended vs. beside intention).
      *   *Premise 2:* Moral species comes from what is intended, not what is accidental/beside intention.
      *   *Application 1 (Private Self-Defense):* Act = Self-defense. Effects = Saving life (intended) + Slaying aggressor (beside intention). Conclusion = Lawful *if* intention is self-preservation.
      *   *Constraint 1 (Proportionality):* Act must be proportionate (moderate violence). Excessive violence makes it unlawful regardless of intention.
      *   *Constraint 2 (Duty):* No duty to omit moderate self-defense to avoid killing (prefer own life).
      *   *Constraint 3 (Authority/Intention):* "It is not lawful for a man to intend killing a man in self-defense, except for such as have public authority..."
      *   *Exception:* Public authority (soldier, judge's minister) *can* intend killing, provided it is referred to the public good.

  3.  **Evaluate the Friend's Reading:**
      *   *Claim:* The distinction is about authority, not intention/foresight.
      *   *Evidence:* The last sentence explicitly contrasts private men ("not lawful... to intend killing") with public authority ("intending to kill... refer this to the public good").
      *   *Strength:* Textually explicit. Aquinas *does* say public agents can intend death.
      *   *Weakness:* It ignores the first half of the *respondeo*. The first half establishes the general principle that moral species comes from intention and that an act with two effects (one intended, one not) is permissible. If the friend is right, the first half is merely a setup for a rule that *only* applies to private defense, while public defense operates on a totally different logic (where intending death is okay).

  4.  **Evaluate the User's Reading:**
      *   *Claim:* Intention does identical work; only the *end* changes.
      *   *Evidence:* The structural parallel. In both cases, the morality depends on what is intended. For the private person, intending death is bad. For the public person, intending death *for the common good* is good.
      *   *Strength:* Preserves the unity of the moral theory (intention determines species). It acknowledges that "intending killing" isn't intrinsically evil *simpliciter*, but evil relative to the agent's authority/end.
      *   *Weakness:* It risks glossing over the sharp textual distinction Aquinas makes: private men *must not intend* death, public men *may intend* death. The mechanism of justification shifts from "death is beside intention" to "death is intended but authorized."

  5.  **Synthesize/Adjudicate:**
      *   *Who is closer?* The friend is textually sharper on the specific permission regarding *intending death*. Aquinas *does* allow public agents to intend death. He *does not* allow private agents to intend death. Therefore, the "intend/foresee" distinction is not a universal absolute in this text; it is conditional on authority.
      *   *However,* the user is right that intention is the *mechanism* of moral specification in both cases. The moral act is defined by the intention.
      *   *Nuance:* The DDE is usually formulated as: 1. Act is good/neutral. 2. Good effect intended, bad effect not. 3. Good not produced by bad. 4. Proportionality.
      *   *Aquinas's Text:*
          *   Private: Fits DDE perfectly (Intend life, foresee death).
          *   Public: *Violates* condition 2 of standard DDE (Intends death). Justified by authority/common good.
      *   *Verdict:* The friend is right that this text is a "shakier ancestor" for the *universalized* DDE used in trolley cases. Aquinas creates a *hybrid* model. Private defense relies on DDE-like reasoning. Public killing relies on authority-based intentional killing.

  6.  **Address Continuity with Contemporary Literature (Foot, Trolley):**
      *   *Foot/Trolley:* Usually apply DDE universally. A private citizen switching a track shouldn't *intend* death, even if saving more.
      *   *Aquinas:* Would likely say a private citizen *cannot intend* the death of the one to save the five. But he might also question if a private citizen has the authority to make that trade-off at all (usurping public authority?).
      *   *Key Discontinuity:* Modern DDE often treats "intending harm" as intrinsically problematic regardless of role. Aquinas ties the permissibility of intending harm to the *bonum commune* and the agent's role within that order. For Aquinas, "intending death" isn't the absolute barrier; "intending death *without authority*" is.
      *   *Key Continuity:* The structural insight that moral evaluation hinges on the order of intention, not just causal outcomes.

  7.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the sophistication of the debate. State the thesis: The friend is textually more accurate regarding the specific permissions, but the user captures the underlying moral metaphysics. The text is indeed a complex ancestor for modern DDE.
      *   *Close Reading - Part 1 (The General Principle):* Analyze "Nothing hinders one act..." This sets up the DDE framework (intention determines species).
      *   *Close Reading - Part 2 (Private Defense):* Apply the principle. Death is *praeter intentionem* (beside intention).
      *   *Close Reading - Part 3 (Public Authority):* Analyze the closing sentence. This is the crux. Public agents *intend* killing. Why? Because their end is the common good.
      *   *Adjudication:*
          *   Friend's point: Valid. The text allows intending death for some agents. This breaks the "never intend evil" rule often associated with modern DDE.
          *   User's point: Valid. Intention is still the moral pivot. But the *object* of permissible intention changes based on status.
          *   Synthesis: Aquinas isn't arguing for a universal DDE; he's arguing for a teleological hierarchy where authority licenses intentions otherwise forbidden.
      *   *Continuity with Foot/Trolley:*
          *   Foot extracts the *structure* (intention vs. foresight) but universalizes it.
          *   Aquinas keeps it role-dependent.
          *   Trolley cases often ignore the "authority" constraint.
          *   Conclusion: The text is the *origin* of the distinction, but modern usage secularizes and universalizes it, losing the "public authority" caveat which is crucial for Aquinas.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address "intention is doing identical work"?
      *   *Correction:* Yes, intention determines the moral species in both. But the *range* of permissible intentions differs.
      *   *Check:* Did I address the "shaky ancestor" claim?
      *   *Correction:* Yes, confirm that it is shaky if one assumes DDE forbids intending death *absolutely*. It is robust if one sees DDE as analyzing the structure of intention within a hierarchy of goods.
      *   *Tone:* Scholarly, precise, respectful of both sides.

  9.  **Final Polish:** Ensure quotes from the provided text are integrated to support the analysis. (e.g., "except for such as have public authority"). Make sure the distinction between *praeter intentionem* and *intended for common good* is clear.

  **(Self-Correction Note):** I need to be careful not to conflate "Double Effect" as a named doctrine (which Aquinas doesn't use) with the reasoning pattern. The prompt asks about the "doctrine... usually said to originate" here. I must distinguish between the *pattern of reasoning* and the *specific permissions* granted.

