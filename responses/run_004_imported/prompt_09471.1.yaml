answer: |-
  You have hit on one of the most fertile intuitions in contemporary epistemology. You are absolutely right: both Lewis's Principal Principle (PP) and van Fraassen's Reflection Principle (RP) are instances of what Alvin Goldman and others call **"Expert Principles."** They are norms telling you how to calibrate your subjective credence against an authority.

  For PP, the authority is **Objective Chance**.
  For RP, the authority is **Your Future Self**.

  Your question cuts to the chase: Are the "safety valves" (admissibility for PP, rationality/no-forgetting for RP) doing the same work? And is there a metaphysical reason to trust Chance more than Future-You?

  Here is the verdict: **The restrictions are functionally identical (they screen off defeating information), but they reveal a deep asymmetry in *why* we defer.** PP is a norm about *metaphysical deference*, while RP is a norm about *diachronic coherence*. Chance gets a "presumption of innocence" that your future self does not, which is why the restrictions look slightly different.

  Here is the depth comparison you asked for.

  ### 1. The Structural Isomorphism
  Let's bypass the textbook definitions and look at the logic.
  *   **PP:** $C(A \mid \text{Chance}(A)=x \land E) = x$
      *   *Translation:* If you know the objective chance is $x$, your credence should be $x$, provided your other evidence ($E$) doesn't interfere.
  *   **RP:** $C_t(A \mid C_{t'}(A)=x) = x$
      *   *Translation:* If you know your future credence will be $x$, your current credence should be $x$, provided you haven't gone insane in the interim.

  In both cases, you are conditionalizing on a fact about a probability assignment (either the world's or your own) and setting your current credence to match it. You are treating the target (Chance or Future-Self) as an **expert**.

  ### 2. The Restrictions: Admissibility vs. Rationality
  You noted that PP needs "admissible" evidence and RP needs a "non-brainwashed" future self. Are these doing the same job?

  **Yes.** Both restrictions exist to prevent **defeating information** from short-circuiting the deference.

  *   **In PP (Admissibility):** The worry is that you possess "crystal ball" evidence. If I tell you a coin is fair (Chance = 0.5), but you also have a reliable prophecy that the coin will land Heads, you should not set your credence to 0.5. You should set it to 1. The prophecy is *inadmissible* because it gives you information about the *outcome* that bypasses the *chance*. Admissibility filters out evidence that renders the chance function irrelevant.
  *   **In RP (Rationality/No Forgetting):** The worry is that your future self is a "broken instrument." If you know you will be drugged at $t'$, your future credence is not an expert opinion; it's noise. If you know you will forget evidence you currently have, your future self is *less* informed than you. The restriction filters out scenarios where the "expert" (Future-You) loses their epistemic authority.

  **The Verdict on Restrictions:** They are functionally equivalent. Both say: *"Defer to the expert, unless you have specific reason to believe the channel of deference is corrupted."* In PP, the corruption is in the **evidence** (you know too much). In RP, the corruption is in the **agent** (future-you knows too little or is irrational).

  ### 3. The "Undermining" Parallel
  This is where the comparison gets deep. Lewis famously worried about **"Undermining Futures"** regarding the PP.

  If chances supervene on the Humean Mosaic (the total history of events), then the *current* chance assignment is determined by the *entire* history, including the future. If you knew the future history, you might realize that the current chance assignment is actually false (because the frequencies in the future won't match the propensity).
  *   **PP Problem:** Knowing the future mosaic undermines the current chance.
  *   **RP Problem:** Knowing your future evidence undermines your current credence.

  Lewis had to tweak the PP to handle this (the "New Principle"). Van Fraassen had to tweak RP to handle "self-locating" beliefs and forgetting (the "Generalized Reflection").
  **The Parallel:** Both principles nearly collapse because **knowing the future breaks the norm.** In both cases, the restriction is there to preserve the *opacity* of the future. You are allowed to defer to Chance/Future-Self only so long as you don't peek behind the curtain in a way that makes the deference incoherent.

  ### 4. Is Chance More Trustworthy? (The Principled Reason)
  You asked if there is a principled reason objective chance gets to be trusted in a way your future opinions don't.

  **Yes.** It comes down to **Rigidity.**

  *   **Chance is a Rigid Expert:** On Lewis's view, "Chance" is defined by its role. What *makes* something a chance fact is precisely that it is the thing rational agents should defer to. If you find a number that you shouldn't defer to, it *wasn't* the chance. The authority of Chance is **constitutive**. The restriction (admissibility) is only there to make sure *you* aren't holding evidence that overrides the definition.
  *   **Future-Self is a Contingent Expert:** Your future self is not an expert by definition. They are an expert only *contingently*, based on the expectation that they will be rational and better informed. There is no metaphysical guarantee that Future-You is smarter than Present-You. You might get dumber. You might forget.

  **This explains the difference in restrictions:**
  *   Because Chance is *defined* as authoritative, the PP restriction focuses on **your evidence** (Admissibility). We assume the Chance is good; we worry that *you* are cheating.
  *   Because Future-Self is only *empirically* authoritative, the RP restriction focuses on **their state** (Rationality). We assume *you* are honest; we worry that the *Future-Self* is broken.

  ### 5. Final Verdict: How They Relate
  Here is the synthesis.

  **Reflection is the General Case; Principal is the Specific Application.**
  Many philosophers (most notably Adam Elga) have argued that the Principal Principle can actually be *derived* from the Reflection Principle. If you treat "Objective Chance" as a hypothetical future self who is idealized (has all the evidence, is perfectly rational), then PP collapses into RP.

  However, the restrictions reveal the tension:
  1.  **RP is a norm of Consistency:** It says your current and future selves shouldn't fight. It's internal to the agent.
  2.  **PP is a norm of Calibration:** It says your mind should match the world. It's external to the agent.

  **The "Bad Verdicts" Avoidance:**
  The restrictions are doing the **same job** (preventing defeat), but they highlight a **hierarchy of trust**.
  *   In RP, the default stance is **skepticism**. I should defer to my future self *unless* I have reason to think they are drugged/forgotten. The burden of proof is on the future self's reliability.
  *   In PP, the default stance is **deference**. I should defer to chance *unless* I have inadmissible evidence. The burden of proof is on the evidence to override the chance.

  **Conclusion:**
  You are right to see them as the same schema. They are both norms of **epistemic humility**.
  *   **RP** demands humility toward your future rationality.
  *   **PP** demands humility toward the metaphysical structure of the world.

  The restrictions differ because **it is easier to break your own brain than it is to break the laws of nature.** We need stronger caveats for RP because human agents are fragile; we need stronger admissibility clauses for PP because Humean chances are fragile (they can be undermined by the future mosaic).

  If you have to choose one as more fundamental: **Reflection is more fundamental.** Chance is just the label we put on the probability assignments we expect our idealized future selves to hold. The PP is just RP applied to a world where we pretend the "Future Self" is the Universe itself. The restrictions are the patches we apply when that pretense starts to leak.
