prompt: |-
  Been down a bit of a rabbit hole on Lewis's Principal Principle lately, and it keeps striking me how similar it is to van Fraassen's Reflection Principle -- like both are basically instances of some general "defer to whoever/whatever knows better" schema, just applied to different things (objective chance vs your own future credences). Can you actually compare the two in some depth? Specifically im curious about the restrictions each one needs to avoid giving obviously bad verdicts: Lewis needs the evidence to be "admissible" for PP to kick in, and van Fraassen has to bolt on some caveat so you're not obligated to defer to a future self who's been drugged or brainwashed. Are those restrictions doing basically the same job, or is there a principled reason objective chance gets to be trusted in a way your future opinions just don't? Don't just define terms at me -- give me an actual verdict on how the two relate.
reasoning: |-
  Here's a thinking process that leads to the comparison between Lewis's Principal Principle and van Fraassen's Reflection Principle:

  1.  **Deconstruct the User's Request:**
      *   **Topic:** Comparison of David Lewis's Principal Principle (PP) and Bas van Fraassen's Reflection Principle (RP).
      *   **Core Intuition:** The user sees them as similar instances of a "defer to expertise" schema (PP: defer to objective chance; RP: defer to future self).
      *   **Specific Question:** Compare the restrictions needed to avoid bad verdicts (PP: *admissibility*; RP: *no forgetting/irrationality/drugs*). Are these restrictions doing the same job? Is there a principled reason to trust chance more than future selves?
      *   **Constraint:** "Don't just define terms at me -- give me an actual verdict on how the two relate." (Needs analysis, synthesis, and a strong conclusion, not just a textbook summary).

  2.  **Initial Knowledge Retrieval & Structuring:**
      *   **Principal Principle (PP):** $C(A | X_t(A) = x \land E) = x$. Where $X_t(A)$ is the chance of $A$ at time $t$, and $E$ is admissible evidence.
          *   *Problem:* Undermining futures (Lewis's big worry). If I know the chance is $x$, but I also know evidence $E$ that suggests the chance *won't* hold (e.g., the coin is biased, or the laws of nature are different), I shouldn't defer. Hence, *admissibility*.
      *   **Reflection Principle (RP):** $C_t(A | C_{t'}(A) = x) = x$. My current credence in $A$, conditional on my future credence being $x$, should be $x$.
          *   *Problem:* Self-locating beliefs, forgetting, irrationality (drugs/brainwashing). If I know I will be drugged, my future credence is unreliable.
      *   **The Connection:** Both are norms of *diachronic coherence* (though PP looks synchronic, it links current credence to chance, which is often treated as an idealized guide). Actually, PP is often seen as synchronic (current credence vs. current chance), while RP is diachronic (current vs. future). *Correction:* PP links current credence to *current* chance. RP links current credence to *future* credence. However, chance is often viewed as a "future-looking" property (propensity).
      *   **The "Deference" Schema:** Yes, both are norms of deference. PP: Defer to Chance. RP: Defer to Future Self.
      *   **The Restrictions:**
          *   PP: Admissibility (evidence must not reveal the outcome or the chance itself in a way that overrides the chance assignment).
          *   RP: Idealization (future self must be rational, no forgetting, no new information that isn't accounted for).
      *   **The Verdict:** Are they the same? Elga and others have argued RP is a special case of PP (if you treat future self as an expert on chance). But there are tensions.

  3.  **Drafting the Comparison - Step-by-Step:**

      *   **Acknowledge the Insight:** Start by validating the user's intuition. Yes, they are both "Expert Principles." This is the standard philosophical framing (Gaifman, Lewis).
      *   **Analyze the Restrictions (The Core Task):**
          *   *PP's Admissibility:* Why do we need it? Because chance is *contingent*. Knowing the outcome (inadmissible evidence) trumps the probability. Also, "Undermining Futures" (knowing the future history might contradict the current chance assignment). Admissibility filters out information that *bypasses* the chance function.
          *   *RP's Caveats:* Why do we need them? Because the future self is *contingent* and *fallible*. If I know I will be irrational, I shouldn't defer. If I know I will forget, I shouldn't defer.
          *   *Comparison:* Admissibility filters *evidence*. RP's caveats filter *the expert* (the future self).
          *   *Deep Dive:* Is admissibility just about ensuring the "expert" (Chance) is actually speaking? Or is it about ensuring *I* don't have inside info?
          *   *Key Distinction:* Chance is (by definition) the *objective* guide. If PP fails, it's because we have "god's eye view" info (inadmissible). RP fails because the *guide itself* is broken (irrational future self).
      *   **The "Principled Reason" Question:** Is chance more trustworthy?
          *   Chance is defined by its role in the Best System (Lewis). It *is* the thing that guides credence.
          *   Future self is only an expert *if* they are rational and better informed.
          *   Actually, van Fraassen argues RP is a consistency requirement, not an expertise claim. Lewis argues PP is an expertise claim.
          *   *Wait, check the literature:* Elga (2010) "Subjective Probabilities Should Be Conditional" argues RP implies PP (under certain conditions). Arntzenius has critiqued both.
          *   *The "Undermining" Parallel:* Lewis's "Undermining Futures" problem for PP is very similar to the "Self-Undermining" problem for RP (where I know my future self will have evidence that makes the current chance impossible).
      *   **Synthesizing the Verdict:**
          *   They are structurally isomorphic *if* you view Chance as a particular kind of Future Self (an idealized one).
          *   However, the *source* of the restriction differs.
          *   PP restriction (Admissibility) protects the *link* between chance and credence from being short-circuited by crystal-ball evidence.
          *   RP restriction (Rationality/No Forgetting) protects the *status* of the future self as an expert.
          *   *Crucial Point:* PP is a norm about how to respond to *metaphysical* facts (chances). RP is a norm about *temporal coherence*.
          *   *Better Verdict:* RP is actually the more fundamental principle. PP can be derived from RP *if* you treat Chance as your future self's expected credence (under ideal conditions). But the restrictions reveal that Chance is a "rigid designator" of expertise, whereas Future Self is a "non-rigid" designator (could be a fool).

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Don't get bogged down in formalism.* Keep it conceptual.
      *   *Address the "Admissibility" vs. "Rationality" distinction directly.*
      *   Admissibility says: "Don't use info that renders chance irrelevant."
      *   RP Caveat says: "Don't defer if the future self is broken."
      *   Are they the same job? Yes, they both ensure the *expert* is actually authoritative in the specific context.
      *   *The "Verdict":* The user asks for a verdict. I should argue that RP is the general template, and PP is a specific application where the "expert" is metaphysically privileged, which is *why* the restrictions look slightly different (one filters evidence, one filters the agent's state).
      *   *Wait, one nuance:* Lewis explicitly linked them. He thought RP was plausible but PP was the real heavy lifter for Humean Supervenience.
      *   *The "Undermining" Issue:* This is the strongest link. Lewis worried that if chances supervene on the Humean Mosaic, knowing the whole mosaic (future) could undermine the current chance assignment. This is exactly like knowing your future self will have evidence that makes your current credence look stupid.
      *   *Final Polish:* Make sure to answer "Is there a principled reason objective chance gets to be trusted in a way your future opinions just don't?"
      *   *Answer:* Chance is trusted *by definition* (that's what chance is). Future opinions are trusted *contingently* (based on expected rationality). The restrictions manage this definitional vs. contingent trust.

  5.  **Final Outline:**
      *   **Intro:** Validate the "Expert Principle" intuition. It's correct and standard in the lit.
      *   **The Structural Parallel:** Show the math/logic similarity briefly without defining terms endlessly.
      *   **The Restrictions (The Meat):**
          *   PP: Admissibility = No "crystal ball" info.
          *   RP: Rationality/No Forgetting = No "broken instrument."
          *   Comparison: Both prevent *defeating information*.
      *   **The "Undermining" Connection:** This is the deep link. Lewis's fear that the Humean base undermines chances mirrors the fear that future evidence undermines current credence.
      *   **The Verdict:**
          *   Are they the same job? Yes, screening off defeating information.
          *   Is chance more trustworthy? Yes, metaphysically. Chance is *defined* as the guide. Future self is only *expected* to be a guide.
          *   Conclusion: RP is the general norm of diachronic rationality; PP is the specific norm of metaphysical deference. The restrictions differ because one manages *evidence* (PP) and the other manages *agency* (RP).

  6.  **Writing the Response:** (Focusing on tone: philosophical, direct, analytical, avoiding dry textbook definitions). *Self-Correction during drafting:* Make sure not to say PP is diachronic. PP is synchronic (Current Credence vs Current Chance). RP is diachronic (Current vs Future Credence). This is a key difference to acknowledge before bridging them. *Wait, Lewis treats Chance as a guide to future frequencies, so it has a diachronic flavor, but the principle itself is synchronic.* I need to be careful there.
      *   *Correction:* Actually, many philosophers (like Elga) argue PP should be understood diachronically or that RP implies PP. I will stick to the standard Lewis/van Fraassen framing but acknowledge the bridge.
      *   *Key Insight:* Admissibility is about *what you know now*. RP caveats are about *what will happen to you*.
      *   *Refining the "Verdict":* The restrictions are doing the *same functional job* (preserving the authority of the expert) but they operate on *different ontological categories* (Information vs. Agent).

  7.  **Final Review against constraints:**
      *   Depth? Yes.
