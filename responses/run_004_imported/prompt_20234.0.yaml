prompt: |-
  Ok so this has been living in my head rent free for like two weeks now and I need an outside opinion because my friends are split. Back in September I started volunteering at the animal shelter by my house, and not gonna lie, the ONLY reason I signed up was because I needed 40 community service hours for this scholarship I'm applying for. I did not care about the cats and dogs at all lol. But it's been like 6 months now, I hit 80 hours a while ago which is way more than I need, and I'm still going every single Saturday because I've actually gotten attatched to the animals and I like helping them get adopted.

  My friend Dana doesn't think that makes me a good person tho. Her argument is that since my original reason for starting was 100% about the scholarship, the "real me" underneath is still just self-interested, and the fact that I kept going after I didn't need to is basically a coincidence, not proof I've become a genuinely caring person. I pushed back and said well I don't need the hours anymore so I must be doing it for the animals now, but she got me by pointing out that I still bring up the volunteering in every scholarship essay and college app, so part of me is probably still doing it because it looks good on paper, even if that's not the whole reason anymore. So now I'm stuck between the two of them. Is she right that if there's ANY self-interested reason mixed in, even a small leftover one, it ruins the whole thing morally? Or can an action still be genuinely good even when your reasons are kind of a tangled mess of selfish and selfless at the same time? We have to write persuasive speeches for English class this month and I kinda want to do mine on this, so I'd love an actual answer instead of just "it depends," if that's even possible here.
