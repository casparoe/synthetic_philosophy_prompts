answer: |-
  Here is the actual answer you asked for, straight up: **Dana is wrong.**

  You can absolutely be a good person and perform genuinely good actions even if your motives are a tangled mess of selfish and selfless reasons. In fact, demanding "pure" altruism is a philosophical trap that basically says no human being is capable of goodness.

  Since you want to use this for a persuasive speech, I'm going to break this down into three concrete arguments you can use. These aren't just opinions; they are based on established ethical frameworks that philosophers have debated for centuries.

  ### 1. The "Outcome" Argument (Consequentialism)
  Ethically, the impact of an action matters just as much as the intent.
  *   **The Logic:** If a dog gets fed, walked, and loved, that dog's quality of life improves. The dog does not care if you are there because you love animals, because you need a scholarship, or because you are trying to impress a date. The *result* is objectively good.
  *   **The Speech Angle:** "If a tree falls in the forest and helps an animal, does it matter why the tree fell?" (Okay, maybe tweak that metaphor). But seriously: **Goodness is measured in impact, not just intent.** If we only valued actions done with 100% pure hearts, we would have to shut down most charities, because even donors get tax write-offs or social status from giving.

  ### 2. The "Growth" Argument (Virtue Ethics)
  Dana is committing something called the **Genetic Fallacy**. She is judging your current character solely based on where it started, ignoring how it has evolved.
  *   **The Logic:** Morality isn't a switch; it's a muscle. Aristotle argued that you become virtuous by *doing* virtuous things. Even if you started faking it for the hours, the act of showing up every Saturday trained you to care. You didn't just "coincidentally" keep going; you kept going because the action *changed you*.
  *   **The Speech Angle:** **Fake it 'til you make it is a valid moral strategy.** Starting selfishly and growing into selflessness is actually *more* impressive than being born a saint. It proves that good habits can cure bad motives. Dana is saying you are frozen in time as the person you were in September. You aren't.

  ### 3. The "Purity Trap" Argument (Psychological Reality)
  Dana's argument relies on the idea that "selfishness" and "selflessness" are mutually exclusive. Psychologically, they aren't.
  *   **The Logic:** Almost every "good" deed comes with a selfish side effect. We help people because it makes us feel less guilty, or because it gives us a "warm glow," or because we want to go to heaven, or yes, because it looks good on a resume. If *any* self-interest ruins the moral value, then **no one is a good person.** Not you, not Dana, not Mother Teresa.
  *   **The Speech Angle:** **The "Purity Test" is a myth.** Acknowledging that you benefit from your good deeds doesn't make you a hypocrite; it makes you human. The fact that you are honest enough to admit you still use it for college apps actually proves you *aren't* trying to hide your self-interest, which is its own form of integrity.

  ### Addressing the College App Point
  Dana says mentioning the volunteering in essays proves you are still selfish. That is a weak argument.
  *   **It's the truth:** It *is* a major part of your life now. Leaving it out would be lying.
  *   **Self-improvement isn't evil:** Wanting a scholarship to get an education so you can have a good life is self-interested, but it isn't *immoral*. You can care about cats *and* care about your future simultaneously. One does not cancel the other.

  ### The Verdict for Your Speech
  If you write this speech, your thesis statement is this:
  **"We need to stop demanding moral purity and start valuing moral progress."**

  Dana is looking for a saint. The world doesn't need saints; it needs people who show up. You showed up when you didn't have to. You helped animals that needed it. You grew as a person.

  Dana's definition of a "good person" is someone who doesn't exist. Your definition is someone who does the right thing, even if their reasons are complicated. **You win this argument.**
