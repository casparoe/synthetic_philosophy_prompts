prompt: |-
  I'm about two-thirds into a novel with a side character loosely based on Henry Sidgwick -- the Victorian utilitarian who helped found the Society for Psychical Research and personally investigated mediums for something like twenty-five years despite being a professional sceptic through and through. I mentioned this to my writing group last week and two of them got sidetracked into an argument about whether the guy was actually being rational, and I still can't settle it in my head.

  Elena's opening claim was that the whole thing was motivated reasoning wearing a rigor costume: Sidgwick had basically argued in his big ethics book that without immortality, or some moral government of the universe, self-interest and duty can never be fully reconciled, so practical reason is left arguing with itself. Naturally a guy staring down that conclusion spends the next two decades hunting ghosts -- that's not open inquiry, that's a man trying to rescue his own system.

  Marcus said that gets the psychology backwards. A motivated believer finds what he needs and stops looking. Sidgwick kept exposing cheating, including in subjects his own circle had initially vouched for, and kept publishing the bad news instead of quietly shelving it. If he needed it to be true and still wouldnt call it, that's evidence he wasn't fooling himself, not evidence that he was.

  Elena came back with: fine, but he also never gave the negative verdict. Twenty-five years and he never once published 'there's nothing here, I was wrong to look.' He just kept looking indefinitely, and 'I'll keep searching forever' is exactly what you'd expect from someone who can't accept the answer he's actually getting, not from someone dispassionately following the evidence.

  Marcus's reply was that this isn't fair to the shape of the problem: if the phenomenon, supposing it exists at all, is rare and actively hidden by fraud, a long run of null results doesn't earn you a confident 'it doesn't exist' any more than decades of failing to spot a rare particle lets a physicist declare it fictional. Continuing to look isn't bias -- refusing to ever stop would just be the same caution pointed the other way.

  Elena's last word was that this supposed even-handedness was awfully one-sided in practice -- he was quick to expose fraud in mediums but never applied anything like that same speed to the possibility that the whole project wasn't worth another year. That asymmetry, she said, is the tell.

  Nobody backed down and I told them I'd think about it, which was a lie -- I'm putting it to you instead. Can you go through the exchange move by move, say who's got the better of each point rather than just who wins overall, and flag anything you think both of them are missing?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is writing a novel with a character based on Henry Sidgwick (Victorian utilitarian philosopher, co-founder of the Society for Psychical Research (SPR), investigated mediums for ~25 years).
      *   **Conflict:** Two members of the user's writing group (Elena and Marcus) are arguing about whether Sidgwick's behavior was rational or motivated reasoning.
      *   **Task:** Go through the exchange move-by-move, evaluate who has the better of each point (not just a final verdict), and flag what *both* might be missing.
      *   **Tone:** Analytical, nuanced, helpful for a writer (since this informs character development), and historically/philosophically accurate regarding Sidgwick.

  2.  **Deconstruct the Argument (Move-by-Move):**

      *   **Elena's Opening (Motivated Reasoning):**
          *   *Claim:* Sidgwick's ethics (*The Methods of Ethics*) posits a dualism of practical reason (Self-Interest vs. Duty) that can only be reconciled via Immortality/Divine Government. Therefore, his psychical research was an attempt to save his ethical system.
          *   *Assessment:* Historically strong. Sidgwick *did* famously worry about this "dualism." He *did* hope for evidence of survival.
          *   *Winner:* Elena has the stronger philosophical grounding here. The motivation is well-documented in his letters and biographies (e.g., by Bart Schultz).

      *   **Marcus's Rebuttal (The "Stopping Rule" Argument):**
          *   *Claim:* A motivated believer stops when they find confirmation. Sidgwick exposed fraud (even among friends) and published negative results. This suggests intellectual honesty, not self-deception.
          *   *Assessment:* Strong point on behavior. The SPR was notorious for debunking its own darlings (e.g., Eusapia Palladino, though Sidgwick died just before the big scandals, he was involved in early investigations). He valued evidence over comfort.
          *   *Winner:* Marcus wins on the *conduct* of the investigation. It counters the idea of simple delusion.

      *   **Elena's Counter (The "Never Giving Up" Argument):**
          *   *Claim:* He never published a final negative verdict. "I'll keep searching forever" is a way to avoid the painful conclusion.
          *   *Assessment:* This is the trickiest point. Is "absence of evidence" evidence of absence? In 19th-century terms, the standards were shifting. Sidgwick died still hoping, but he was also cautious.
          *   *Winner:* Split. Elena is right that he didn't renounce the quest, but Marcus is right that the quest wasn't logically closed. However, Elena hits a psychological nerve: the *cost* of continuing vs. stopping.

      *   **Marcus's Counter (The "Rare Particle" Analogy):**
          *   *Claim:* If the phenomenon is rare/fraudulent, null results don't prove non-existence (like physics). Continuing is caution, not bias.
          *   *Assessment:* Good analogy for the *methodology*, but maybe weak on the *probability*. Physics deals with mathematically predicted particles. Ghosts are metaphysical claims. The prior probability is vastly different.
          *   *Winner:* Marcus wins on the logic of scientific inquiry (falsifiability issues), but Elena would argue the *prior probability* makes the comparison unfair.

      *   **Elena's Closer (The Asymmetry Argument):**
          *   *Claim:* He was quick to debunk fraud but slow to debunk the project itself. That asymmetry is the tell.
          *   *Assessment:* This is a strong Bayesian point. He updated his beliefs about *specific* mediums quickly but didn't update his *prior* on the phenomenon despite accumulating negative data.
          *   *Winner:* Elena. This is the strongest philosophical critique of his rationality. It addresses the "sunk cost" or "belief inertia."

  3.  **Identify What Both Are Missing:**
      *   **Historical Context:** The Victorian crisis of faith. It wasn't just about ethics; it was about science vs. religion. Spiritualism was the "third way."
      *   **The Nature of the SPR:** It wasn't just Sidgwick. It was a collective. He was trying to legitimize the inquiry, not just satisfy personal hope.
      *   **Sidgwick's Personal Tragedy:** The death of his friend (and potentially more intimate relationships, like the triangle with Eleanor Balfour and John Addington Symonds) played a role. It wasn't purely abstract ethics.
      *   **The Definition of "Rational":** Is it rational to pursue a low-probability, high-value hypothesis? (Pascal's Wager logic).
      *   **The Character Angle:** For a novelist, the *ambiguity* is more useful than the verdict.

  4.  **Drafting the Response:**
      *   *Structure:* Introduction -> Move-by-Move Analysis -> The "Missing Middle" (What they overlook) -> Implications for the Novel.
      *   *Tone:* Respectful to both arguers, authoritative on Sidgwick, helpful to the writer.
      *   *Key Insight:* Sidgwick isn't a binary "rational/irrational" figure. He embodies the tension.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did Sidgwick actually expose fraud? Yes, he was instrumental in exposing the mediums Slade and others, though he was sometimes criticized for being too gentle.
      *   *Check:* Did he never publish a negative? He expressed deep doubt privately and in some correspondence, but publicly maintained the *possibility*.
      *   *Check:* The "Dualism of Practical Reason." Make sure to explain this clearly as it's Elena's core premise.
      *   *Nuance:* Ensure I don't just say "Elena is right." Marcus has a point about scientific rigor. The tension *is* the story.

  6.  **Final Polish:** Check against the prompt requirements (move-by-move, flag missing elements, no simple winner). *Self-correction: Make sure to explicitly state who wins each round.*

  7.  **Final Output Generation:** (Proceeds to generate the response based on these thoughts.)
answer: |-
  This is a fantastic debate for a writing group to be having, because it cuts to the heart of what makes Sidgwick (and your character) compelling: he is a man straddling the fault line between high Victorian rationalism and a desperate metaphysical hunger.

  Neither Elena nor Marcus is wholly right or wholly wrong. They are arguing past each other on different definitions of "rationality." Elena is arguing from **Bayesian rationality** (updating priors based on accumulated evidence), while Marcus is arguing from **Methodological rationality** (adhering to rigorous process regardless of outcome).

  Here is the move-by-move breakdown of who holds the stronger ground, followed by what both of them are missing that could enrich your novel.

  ### Round 1: The Motivation
  **Elena:** Sidgwick's ethics require immortality to reconcile Duty and Self-Interest. Therefore, the research is motivated reasoning to save his system.
  **Marcus:** (N/A)

  *   **Verdict:** **Elena wins.**
  *   **Why:** This is historically watertight. In *The Methods of Ethics*, Sidgwick famously concludes with the "Dualism of Practical Reason." He argues that if there is no afterlife to reward virtue and punish vice, then it is not strictly "rational" to be moral if being moral conflicts with your own happiness. He called this a "fundamental contradiction." He explicitly stated in letters that if he could find scientific proof of survival, it would resolve this ethical crisis. Elena is correct that the *desire* for the result was baked into the inquiry from day one.

  ### Round 2: The Conduct
  **Marcus:** A motivated believer stops when they find confirmation. Sidgwick exposed fraud (even among allies) and published negative findings. This proves he wasn't fooling himself.
  **Elena:** (N/A)

  *   **Verdict:** **Marcus wins.**
  *   **Why:** This is the strongest evidence for Sidgwick's integrity. The Society for Psychical Research (SPR) was unique because it debunked its own darlings. Sidgwick was instrumental in exposing the slate-writing medium Henry Slade and others, even when it embarrassed the movement he helped found. If he were merely deluded, he would have embraced every hit and ignored the misses. His willingness to publish failure suggests his commitment to *truth* was higher than his commitment to *comfort*.

  ### Round 3: The Verdict
  **Elena:** He never published a final negative. "I'll keep searching forever" is a strategy to avoid accepting the answer he's getting.
  **Marcus:** (N/A)

  *   **Verdict:** **Elena wins (narrowly).**
  *   **Why:** Marcus will try to defend this in the next round, but Elena is right about the psychology of closure. In science, you eventually reject the null hypothesis. Sidgwick treated the hypothesis of survival as unfalsifiable in practice. By maintaining that "we just haven't looked hard enough" for 25 years, he insulated his hope from refutation. That is the definition of a protected belief.

  ### Round 4: The Analogy
  **Marcus:** Null results don't prove non-existence (like a rare particle in physics). Continuing to look is caution, not bias.
  **Elena:** (N/A)

  *   **Verdict:** **Marcus wins (on logic), Elena wins (on probability).**
  *   **Why:** Marcus is technically correct about the logic of induction; you can't prove a negative. However, his analogy is weak. Physicists look for particles predicted by mathematical models with known energy levels. Sidgwick was looking for spirits with no agreed-upon mechanism of interaction.
      *   *The nuance:* If you look for a needle in a haystack, 25 years of looking without finding it *does* eventually justify saying "there is no needle," or at least "there is no needle accessible to us." Marcus is right that you can't be dogmatic, but Elena is right that the *duration* of the search without success should have lowered his confidence significantly more than it did.

  ### Round 5: The Asymmetry
  **Elena:** He was quick to expose fraud in mediums but slow to expose the possibility that the project itself wasn't worth another year. That asymmetry is the tell.
  **Marcus:** (N/A)

  *   **Verdict:** **Elena wins.**
  *   **Why:** This is the killer argument. It addresses the "Sunk Cost Fallacy." Sidgwick applied rigorous skepticism to the *data* (the mediums) but suspended skepticism regarding the *premise* (the possibility of the phenomenon). A truly dispassionate observer would have periodically asked, "At what point does the cumulative failure of the mediumship imply the failure of the hypothesis?" Sidgwick seemingly refused to set that point.

  ---

  ### What Both of Them Are Missing

  If you want to deepen your character beyond this binary, here are three elements both Elena and Marcus are overlooking. These are crucial for a novelist because they add texture and tragedy to the character.

  **1. The "Crisis of Faith" Context**
  Elena treats Sidgwick like a modern scientist, and Marcus treats him like a pure logician. Neither accounts for the Victorian spiritual vacuum. Sidgwick wasn't just trying to save his ethical system; he was trying to save *meaning* in a world where Darwin and Higher Criticism had dismantled Christianity.
  *   **For your novel:** The stakes aren't just intellectual; they are existential. If Sidgwick is wrong, the universe is not just godless, it is *morally incoherent*. The "motivated reasoning" isn't a weakness; it's a survival mechanism. A man can live with doubt, but Sidgwick felt he couldn't live with *absurdity*.

  **2. The Social Function of the SPR**
  Marcus implies Sidgwick was a lone investigator. He wasn't. He was building an institution. If he had published "It's all nonsense" in 1885, the SPR collapses, funding dries up, and the rigorous study of the borderline between psychology and physics ends.
  *   **For your novel:** There is a bureaucratic rationality to his ambiguity. By keeping the question "open," he kept the funding open, which allowed for legitimate psychological research (like the study of hallucinations) to happen under the cover of ghost-hunting. He may have been sacrificing his own intellectual closure for the greater good of scientific inquiry.

  **3. The "High Value, Low Probability" Wager**
  Both argue as if the hypothesis is neutral. It isn't. If ghosts exist, it is the most important discovery in human history. If they don't, it's a waste of time.
  *   **For your novel:** Sidgwick was effectively playing a Pascal's Wager with his career. Even if the probability is 1%, the payoff is infinite. Therefore, it *is* rational to keep looking longer than usual. Elena calls this bias; a gambler calls it "chasing the jackpot." The tragedy is that Sidgwick knew the odds were likely against him, but felt he couldn't afford to leave the table.

  ### Recommendation for Your Character

  Don't settle the argument in the book. The tension *is* the character.

  *   **Use Elena's point** to show his private moments of despair. Have him admit in a diary or a drunken confidence that the evidence is thin, that he *wants* it to be true too much.
  *   **Use Marcus's point** to show his public rigor. Have him dismantle a beloved medium in a scene, showing the pain it costs him to destroy a hope he shares with his friends.
  *   **The Synthesis:** The most interesting version of this character is one who knows Elena is right but acts as if Marcus is right. He suspects he is motivated by fear of the void, but decides that the only way to conquer that fear is to pretend he isn't afraid, to pursue the data with cold rigor even if the motivation is hot desperation.

  That contradiction—a man using the tools of skepticism to build a ladder to faith—is where the humanity lives.
