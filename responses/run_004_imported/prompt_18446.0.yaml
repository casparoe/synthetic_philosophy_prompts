answer: |-
  This is a fantastic philosophical knot, and your discomfort is completely justified. You aren't just being precious; you are sensing a category error in your mom's logic.

  She is using an argument about **performance** (the Strad study) to dismiss a revelation about **provenance** (the appraisal). While they both involve violins and "old vs. new," they are measuring fundamentally different things.

  Here is how you can untangle why the appraisal changes the object, even if the sound didn't change, and why your article doesn't actually vindicate her the way she thinks it does.

  ### 1. The Category Error: Acoustics vs. Ontology
  The Stradivarius blind tests you wrote about were measuring **acoustic superiority**. The question was: *Does age guarantee better sound?* The answer was: *No.* A new violin can perform just as well as an old one.

  Your mom's situation is about **ontological continuity**. The question is: *Is this the same object my great-grandfather held?* The answer is: *No, not entirely.*

  When you replace the neck, scroll, and varnish, you aren't just polishing the shoe; you've replaced the sole and the laces. In the violin world, the neck angle and scroll aren't just decorative; they are structural load-bearers that dictate tension and resonance. A 1950s neck reset is a major surgery.

  Your mom is arguing, "It sings the same song." You are feeling, "It is a different singer." Both can be true. The Strad study proves that *new* singers can sing as beautifully as *old* singers. It does not prove that a new singer is the *same person* as the old one.

  ### 2. The Ship of Theseus
  You are essentially bumping up against the classic philosophical paradox of the Ship of Theseus. If you replace every plank of a ship over time, is it still the same ship? If you take the old planks and build a second ship, which one is the original?

  In your mom's case, the "body" is the original hull, but the "neck and scroll" are the new mast and rudder.
  *   **For the Player (Mom):** It's the Ship of Theseus. As long as it floats and sails (plays), the identity is in the utility.
  *   **For the Historian (You):** It's a composite. The "heirloom" status relies on an unbroken chain of physical existence. That chain was physically interrupted in the 1950s.

  The physical object didn't change *yesterday*, but your **map of the object** did. You are realizing that the instrument you thought was a 1920s time capsule is actually a 1950s restoration of a 1920s artifact. Those are two different museum labels.

  ### 3. Blind vs. Sighted Value
  Your article relied on **blind** testing. The whole point was that when you remove the *story* (the label, the price, the age), the *sound* remains.

  Your mom is trying to apply that blind logic to a **sighted** reality. She is saying, "Since the sound is the same, the story doesn't matter." But heirlooms are *entirely* about the story.

  If you drink wine blind, a $20 bottle might beat a $200 bottle. But if you are celebrating an anniversary, the $200 bottle carries a weight of occasion that the $20 bottle does not, regardless of the tannins. The value of an heirloom violin is not solely in its decibels or timbre; it is in its **witness**. It is supposed to be a physical tether to your great-grandfather.

  The appraisal revealed that the tether was severed and re-knotted in the 1950s. That doesn't make the violin worse to play, but it does make it less "authentic" as a historical artifact. Your mom is right that it doesn't affect the *music*, but she is wrong that it doesn't affect the *relic*.

  ### 4. The "Magic" of Authenticity
  There is a psychological phenomenon where knowledge changes perception. In the Strad study, they removed the knowledge to test the physics. In your living room, the knowledge has been added.

  Before the appraisal, the violin had an "aura" (to borrow from Walter Benjamin). It was the *original*. Now, it is a *restoration*.
  *   **Before:** "This is the wood Great-Grandpa touched."
  *   **After:** "This is the wood Great-Grandpa touched, but the part the player touches most (the neck) is from a stranger in the 1950s."

  It is perfectly valid to feel a sense of loss there. It's not snobbery; it's a disruption of narrative. You aren't mourning the sound; you are mourning the continuity.

  ### How to Explain This to Her
  You don't need to tell her she's wrong to love playing it. She isn't. But you can explain why your article doesn't apply here.

  You might say something like:
  *"My article was about whether old violins sound better than new ones. It proved they don't necessarily. But this isn't about sound; it's about history. If we found out the family portrait was actually a really good print from the 1950s and not the original photo Great-Grandpa sat for, it would still look the same on the wall. But it wouldn't be the same piece of history. I'm not saying it plays worse; I'm just saying the story we told ourselves about it changed."*

  ### The Verdict
  Your mom is right that the **utility** hasn't changed.
  You are right that the **identity** has.

  The Strad study debunks the idea that *age equals quality*. It does not debunk the idea that *provenance equals value*. You can acknowledge that the violin is still beautiful and playable (validating her) while holding space for the fact that the family myth has been altered (validating yourself).

  It feels different because the object *is* different, just not in the way that affects vibrato. It's different in the way that affects memory. And for an heirloom, memory is the whole point.
