prompt: |-
  I've been asked to give the toast at my newspaper's retirement dinner for our science editor, who is stepping down at eighty after fifty years on the job and has spent much of that time citing Cicero's De Senectute to any junior reporter who suggested he slow down. I'd like the toast to engage Cicero's argument on its own terms rather than just gesture at it: work through Cato's four counts against old age -- that it withdraws us from active affairs, weakens the body, deprives us of almost all sensory pleasure, and brings us too near to death -- and his answer to each. But our editor built his career on not letting a well-turned line stand in for a checked fact, so wherever current research on aging actually undercuts one of those specific answers, the toast should say so plainly rather than smoothing it over. Keep it to about five minutes, for a room split evenly between veteran colleagues who know the text and interns who have never heard of it.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Retirement dinner for a science editor.
      *   **Honoree:** 80 years old, 50 years on the job.
      *   **Key Characteristic:** Frequently cited Cicero's *De Senectute* (On Old Age) to junior reporters who suggested he slow down.
      *   **Tone/Style:** Engage Cicero's argument on its own terms (work through Cato's four counts and answers).
      *   **Critical Constraint:** The editor values facts over rhetoric ("not letting a well-turned line stand in for a checked fact"). If modern science contradicts Cicero, the toast *must* say so plainly.
      *   **Audience:** Split evenly between veteran colleagues (know the text) and interns (don't).
      *   **Length:** About 5 minutes (roughly 600-800 words spoken at a moderate pace).

  2.  **Deconstruct *De Senectute* (Cato's Four Counts):**
      *   *Count 1:* Old age withdraws us from active affairs (*abstrahit a rebus gerendis*).
      *   *Count 2:* Old age weakens the body (*corpus infirmum facit*).
      *   *Count 3:* Old age deprives us of sensual pleasures (*privat omnibus voluptatibus*).
      *   *Count 4:* Old age is not far from death (*haud longe abest a morte*).

  3.  **Drafting Strategy - Section by Section:**
      *   **Opening:** Welcome everyone, acknowledge the honoree's habit (citing Cicero), set the stage (Cato the Elder speaking in the text).
      *   **Count 1 (Active Affairs):** Cicero says wisdom guides rather than acts. *Science Check:* Cognitive decline varies; engagement keeps the brain sharp. Acknowledge the editor *did* stay active, but maybe not at the same pace.
      *   **Count 2 (Physical Strength):** Cicero says strength isn't needed for intellectual work. *Science Check:* Sarcopenia is real, but exercise mitigates it. Don't pretend he's 30.
      *   **Count 3 (Pleasure):** Cicero says freedom from lust is a benefit. *Science Check:* Dopamine/reward systems change, but social connection remains vital. Maybe he missed out on some joys, but found others.
      *   **Count 4 (Death):** Cicero says death is natural/ripe fruit. *Science Check:* Mortality risk increases, but life expectancy has risen since Rome. It's closer, but not imminent.
      *   **Closing:** Tie it back to the editor's legacy (truth over rhetoric), raise a glass.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi everyone. Bob loves Cicero. Specifically *De Senectute*.
      *   Cato lists 4 complaints about aging. Bob used to rebut them.
      *   1. Can't work. Cicero: You lead with wisdom. Science: Actually, processing speed slows, but crystallized intelligence stays. Bob proved this by editing until 80.
      *   2. Weak body. Cicero: Who needs muscles for writing? Science: Frailty is real. Bob isn't running marathons. But he walked to work.
      *   3. No fun. Cicero: Sex is bad anyway. Science: That's grim. But social bonding is good. Bob loved the newsroom party.
      *   4. Death. Cicero: It's natural. Science: Yes, but we live longer now.
      *   Cheers to Bob.

  5.  **Refining - Iteration 2 (Adding Voice and Fact-Checking):**
      *   Need to make sure the "Science Check" feels respectful but accurate, honoring the editor's demand for facts.
      *   Need to balance the Latin literati and the interns. Explain the four counts clearly.
      *   *Tone:* Witty, respectful, intellectually rigorous.

  6.  **Drafting - Writing the Content (incorporating constraints):**
      *   *Intro:* Mention the 50 years and the Cicero habit.
      *   *Count 1:* *Abstrahit a rebus gerendis*. Cicero: The pilot steers, doesn't climb rigging. *Fact:* Cognitive aging isn't uniform. Fluid intelligence drops, crystallized stays. Bob was the crystallized intelligence.
      *   *Count 2:* *Corpus infirmum*. Cicero: Strength is for athletes. *Fact:* Sarcopenia is real. We aren't pretending his knees don't hurt. But he stood by the truth.
      *   *Count 3:* *Voluptatibus*. Cicero: Good riddance to lust. *Fact:* That's stoic repression. Modern psych says social engagement matters. Bob loved the gossip, just not the scandals.
      *   *Count 4:* *Morte*. Cicero: Ripe fruit falls. *Fact:* Mortality curves are steeper now than Rome, but 80 isn't 50. He's not dying, he's retiring.
      *   *Conclusion:* He taught us to check the source. Even if the source is Cicero.

  7.  **Review against Constraints:**
      *   *5 Minutes?* Word count needs to be around 750-850 words.
      *   *Four Counts?* Yes.
      *   *Science Fact-Check?* Yes, explicitly mentioned where Cicero is wrong/outdated.
      *   *Audience?* Explain the Latin terms briefly for interns, keep the depth for vets.
      *   *Tone?* Respectful but rigorous.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't sound like I'm attacking the editor for citing Cicero. He liked the *argument*, not necessarily the blind acceptance. The prompt says he cited it to reporters who suggested he *slow down*. So he used it as a shield. I need to validate his stamina while acknowledging biological reality.
      *   *Correction:* Ensure the "Science Check" doesn't become a lecture. Keep it punchy.
      *   *Correction:* Ensure the ending lands emotionally.

  9.  **Final Word Count Check:** (Aiming for ~130-150 words per minute for 5 mins = 650-750 words). Let's aim for slightly tighter to allow for pauses and laughter.

  *(Self-Correction on the "Science Check" regarding Count 4)*: Cicero argues death is natural. Science says mortality risk increases exponentially (Gompertz law). I should mention that while death is closer, "ripe fruit" is a metaphor that doesn't account for modern medicine extending the "ripening" phase.

  *(Self-Correction on Count 3)*: Cicero argues pleasure distracts the mind. Modern science says pleasure/social connection is vital for longevity. I need to make sure I don't say "Cicero is wrong, party hard." I should say "Isolation is the risk, not pleasure itself."

  10. **Finalizing the Text.** (Proceeding to generate output based on these thoughts).

