answer: |-
  First off, I'm sorry about the roommate situation. It is genuinely ironic (and frustrating) that you're grading this specific prompt while feeling the sting of that exact accusation in real life. For what it's worth: in the literature, "standing to blame" is usually about *normative authority* in a specific context, not a blanket ban on ever asking someone to do their dishes. You can still have standing even if you're imperfect, provided you aren't claiming exemption from the norm itself. But yes, grading this stack is going to feel weirdly meta.

  Here is the grade and breakdown for this student. They actually nailed the distinction, which might help clarify your own thinking on the matter.

  ### Grade: 9.5 / 10

  **Point-by-Point Comments:**

  *   **Part (a) - Core Argument (Excellent):** The student correctly identifies that the standing view isn't about the *truth* of the moral claim (plagiarism is wrong) but about the *appropriateness* of the blamer. The explanation of "parity" and "unearned authority" is spot-on and aligns well with standard accounts (e.g., Bell, Fritz).
  *   **Part (a) - Tu Quoque Distinction (Strong):** They explicitly distinguish the standing view from a simple *tu quoque* fallacy. This shows they understand that the hypocrisy objection isn't just a logical deflection but a normative claim about fairness.
  *   **Part (b) - Alternative Diagnosis (Good):** They offer the "credibility/insincerity" objection. This is a standard and valid counter-argument in the literature. It distinguishes between *epistemic* reasons to discount the blame (credibility) vs. *normative* reasons to reject the standing. It could have been slightly more developed, but for a short answer, it's sufficient.
  *   **Mechanics (Minor Deduction):** There is one spelling error ("seperate" instead of "separate"). In a philosophy paper, precision matters, even in spelling.

  **Where I'd take points off:**
  Strictly speaking, only the **0.5 deduction for the spelling error**. The philosophical content is accurate, concise, and demonstrates a clear grasp of the reading. Some TAs might dock slightly more on Part (b) for not elaborating on *why* credibility is distinct from standing normatively, but given the short-answer format, I think giving them the benefit of the doubt is fair.

