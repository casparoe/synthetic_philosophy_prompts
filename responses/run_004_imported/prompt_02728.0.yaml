      *   *Michael Slote:* Yes, satisficing consequentialism (1989 paper "Satisficing Consequentialism"). Normative ethical theory. Focus on moral demandingness.
      *   *The Connection:* It *looks* like the same move, but the domains are different (descriptive/structural rationality vs. normative morality).
      *   *The Conflict:* The user is conflating *rationality* (efficiency/achieving goals given constraints) with *morality* (what one ought to do regardless of personal cost/effort, potentially).

  3.  **Identify the Core Philosophical Distinction:**
      *   **Is/Ought Gap:** Simon describes how agents *do* (or practically *can*) act. Slote argues about what agents *should* be morally permitted to do.
      *   **Definition of Rationality vs. Morality:** In decision theory, "rationality" is often instrumental (achieving ends efficiently). In ethics, "morality" might demand inefficiency (sacrifice).
      *   **The "Cost" Argument:** Simon says optimization is too *cognitively* costly. Critics of maximizing consequentialism say optimization is too *morally* costly (demandingness). Are these the same cost? No.
      *   **The "Good Enough" Threshold:** In Simon, the threshold is exogenous or aspirational. In Slote, the threshold is moral. How do you set it without arbitrariness?

  4.  **Brainstorm Counter-Arguments (Why Simon doesn't settle Slote):**
      *   *Category Error:* Decision theory is about means-ends efficiency. Ethics is about the justification of the ends and the constraints on action.
      *   *The "Could Implies Ought" problem:* Just because I *can't* maximize (Simon) doesn't mean I *shouldn't be required to try* (Ethics). "Ought implies can" works one way. If I can't, I'm excused, but that doesn't make satisficing the *ideal*.
      *   *Moral Demandingness:* The main motivation for Slote isn't cognitive load; it's that maximizing consequentialism requires too much *sacrifice* (giving away all wealth until marginal utility equals the poor). Simon's costs are search/computation costs. These are different.
      *   *The Collapsing Problem:* If you allow "good enough," what stops "barely good enough"? How do you set the bar non-arbitrarily? Simon handles this with aspiration levels; Slote struggles with moral thresholds.
