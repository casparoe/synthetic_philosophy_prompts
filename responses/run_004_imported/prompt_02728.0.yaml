prompt: |-
  so in my decision theory class we went over herbert simon's satisficing stuff — basically that boundedly rational agents just grab the first option that's 'good enough' since actually computing the optimum is too costly. now in my ethics seminar we're doing satisficing consequentialism (slote) and it feels like literally the same move just imported into ethics. doesnt simon's argument basically already win the debate for slote, since it shows maximizing isnt even what rational agents do? kinda confused why there's still a whole literature debating whether satisficing is permissible if bounded rationality already proved optimizing isn't required.
