      *   **Deceased's View:** Van Inwagen-style Life View (restrictive composition). Simples compose something *only* when they constitute a life. No chairs, rocks, or corpses. When life stops, the person ceases to exist. No afterlife/resurrection.
      *   **Constraint:** Do *not* use loose ordinary-object language that contradicts her view (e.g., "her body," "she's at peace," "part of her lives on").
      *   **Goal:** Comfort the non-philosophers without betraying the philosophers (or her memory). Draw comfort *from* her specific metaphysical position (persistence of simples, definiteness of life, composition in relationships/legacy).
      *   **Length:** About 7 minutes spoken (approx. 900-1000 words at a moderate pace).
      *   **Tone:** Respectful, accurate, warm, funny (reflecting her personality), comforting but honest.

  2.  **Deconstruct the Metaphysical Challenge:**
      *   *The Problem:* Standard eulogies rely on dualism or loose materialism ("her body is here," "her spirit lives on"). Her view denies the existence of the corpse and denies the persistence of the person after biological death.
      *   *The Opportunity:* Her view emphasizes the *preciousness* and *reality* of life. A life is a specific, rare event in the history of simples. The simples don't die; they scatter. The *pattern* of her life caused changes in other lives (which *do* exist).
      *   *Key Phrases to Avoid:* "Her body," "remains," "passed away" (might imply transition rather than cessation), "looking down on us," "part of her is here."
      *   *Key Phrases to Use/Adapt:* "The life that was her," "Simples arranged [Name]-wise," "The event of her living," "Composition of our community."

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Establish the dual audience immediately but gently. Mention her humor.
      *   **The Metaphysics (The "Hard" Part):** Address the view directly but poetically. Don't lecture, but don't hide. Explain *why* she held it (honesty, precision).
