answer: |-
  Thank you all for coming. For those who knew my mother only as a colleague, you know she would have appreciated the precise categorization required by this room. We have family, who knew her heart; we have students, who knew her mind; and we have metaphysicians, who know exactly what she thought about the casket at the front of the room.

  My mother spent twenty-five years arguing that composition is restricted to life. She held that simples—fundamental particles—compose a further object only when their activity constitutes a living organism. On her view, there are no chairs, no stones, and, crucially, no corpses. There are only simples arranged chairwise, stone-wise, or, as she would correct a interlocutor with a smile that was both warm and devastating, *corpsewise*.

  She was not religious. She did not believe in a soul that detached from the biology. She believed that when the life stops, the object ceases to exist. So, to speak with the precision she demanded: the person who was my mother is not here. The life that constituted her has ceased. What remains are simples, no longer caught in the specific causal loop that made her *her*, scattering back into the world.

  I know that for many of you, this sounds cold. It sounds like it denies us comfort. But I have spent the last ten days trying to understand why she held this view so calmly, and why she found peace in it. And I think the comfort is there, but it is a different kind of comfort. It is the comfort of honesty, and of rarity.

  If my mother was right, then life is not a property that matter has. It is an event that matter *does*. It is a rare, specific, and definite activity in the history of the universe. For a brief span of time, the universe managed to organize itself into *her*. Into a woman who could grade a paper on supervenience while simultaneously making a soufflé that defied the laws of thermodynamics. That organization was real. It was not a metaphor. It was the one true object in her vicinity. And because it was finite, because it was not guaranteed to persist, every moment of it was precious.

  She did not believe in ghosts. She believed in the past. She believed that the life she lived *happened*. That is a fact that death cannot undo. The event of her living is fixed in the history of the world. Her laughter, her arguments, her kindness—these were not shadows. They were the operations of a real thing. And the fact that the thing no longer exists does not mean it never did.

  There is comfort, too, in what happens to the simples. She used to tell me, when I was a child asking where people go, that the stuff we are made of never dies. It only changes arrangements. The carbon and nitrogen and oxygen that were caught up in her life are not destroyed. They are released. They will be taken up by the grass, by the air, by other living things. In a very literal sense, the materials that constituted her will go on to constitute other lives. She returns to the world, not as a spirit, but as the building blocks of the future.

  But the greatest comfort, I think, lies in us.

  Look around this room. Many of us are living organisms. Strictly speaking, on her view, *we* exist. We are the things that compose. And we were all touched by her life. My father, who shared his life with hers for forty years; her students, whose minds were shaped by her rigor; my siblings and me, who were raised by her.

  We are existing things that were causally affected by her. The ways in which we think, the standards we hold, the jokes we tell, the patience we try to show—these are patterns in us that were caused by her. She is not here, but the effects of her life are composing parts of our lives right now. We are the living evidence that she was here.

  I know some of her colleagues might worry that I am slipping into loose language. I am not trying to say that she survives in our memories. Memories are mental states; they are not her. I am saying that we, who *do* exist, are different because she existed. The causal chain is unbroken.

  She knew the objections. She knew the "corpse problem" better than anyone. She knew that denying the existence of a corpse makes death seem abrupt, violent even. But she faced that abruptness without flinching. She taught me that we should not comfort ourselves with illusions about chairs or rocks or bodies. We should comfort ourselves with the reality of what we have.

  We have the fact of her life. We have the simplicity of the truth. And we have each other.

  To the metaphysicians in the room: She would want you to know that she remained consistent to the end. There is no body in the casket. There are only remains arranged mother-wise.

  To the rest of you: She would want you to know that she loved you. That love was not a chemical illusion; it was the central activity of her life. And while that activity has stopped, the world is permanently altered by the fact that it occurred.

  She is not at peace, because "she" is not. But the life that was her was good. It was definite. It was real. And for as long as there are living things left to remember it, it will not have been in vain.

  Thank you.
