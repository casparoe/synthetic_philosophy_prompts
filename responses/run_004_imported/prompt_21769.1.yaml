      *   Did I identify the limitation in expected benefit ranking? Yes (Blindness to distribution of chance).
      *   Did I identify the assumption? Yes (Linearity of Social Welfare / Ex Ante Irrelevance).
      *   Did I focus on the general lesson? Yes.

