answer: |-
  This is not a case of muddled thinking; you have encountered one of the most persistent and significant problems in moral philosophy and decision theory. The disagreement on your board is a real-world instantiation of a theoretical puzzle that has occupied ethicists and economists for decades, most notably articulated by the economist Peter Diamond in 1967.

  To answer your questions directly: Yes, there is a genuine principled dispute. And yes, the episode exposes a fundamental limitation in ranking policies solely by aggregate expected benefit.

  Here is an analysis of the dispute, the limitation it reveals, and the specific assumption responsible for it.

  ### 1. The Principled Dispute: Ex Post Outcomes vs. Ex Ante Claims

  The disagreement between your board members is not about medical efficacy; it is about the **moral significance of probability itself.**

  **Camp A (The Tie-Breaking Rule)** operates on a principle of **Ex Post Efficiency**. Their view is consequentialist: what matters morally is the final state of the world. In both scenarios (the log-time rule or the coin toss), the kidney ends up in a body that derives identical benefit from it. The total "good" produced is identical. To this camp, the administrative rule is functionally equivalent to a randomizer because the time a chart is logged is morally arbitrary. Since the *outcome* is optimized and the *selection criterion* is arbitrary (in the sense that it is unrelated to merit), no injustice is committed. They view the patients primarily as vessels for medical utility.

  **Camp B (The Coin Toss)** operates on a principle of **Ex Ante Fairness**. Their view is deontological or rights-based: what matters is how we treat the individuals' *claims* prior to the outcome. Because the patients have equal medical need and equal waiting time, they have equal moral claims to the organ.
  *   Under the **Tie-Breaking Rule**, one patient is assigned a 100% probability of life and the other a 0% probability based on a bureaucratic artifact.
  *   Under the **Coin Toss**, both patients are assigned a 50% probability.

  For Camp B, fairness requires equalizing the *chances*, not just accepting the *results*. The coin toss is not merely a mechanism to select a recipient; it is a public ritual that acknowledges the equal moral worth of the two claimants. To skip the toss is to tell the losing patient, "You had no chance," whereas the toss tells them, "You had an equal claim, but luck went against you."

  **What is at stake:** The dispute is about whether **fairness is a property of outcomes or a property of procedures.** Camp A believes fairness is satisfied if the outcome is medically optimal and the tie-breaker is non-discriminatory. Camp B believes fairness requires the *distribution of opportunity* to be equalized before the outcome is determined.

  ### 2. The Limitation of Expected Benefit Ranking

  This episode exposes a specific blindness in any policy framework that relies exclusively on **Aggregate Expected Utility**.

  In standard decision theory, we calculate the value of a policy by summing the expected benefits for all individuals involved. Let $B$ be the medical benefit of the kidney.
  *   **Tie-Break Rule:** Patient 1 gets $B$ (probability 1), Patient 2 gets $0$ (probability 0). Total Expected Benefit = $1B + 0B = B$.
  *   **Coin Toss:** Patient 1 gets $B$ (probability 0.5), Patient 2 gets $B$ (probability 0.5). Total Expected Benefit = $0.5B + 0.5B = B$.

  Because the sums are identical, a model based solely on expected benefit must be indifferent between the two policies. It cannot "see" the difference between giving one person a sure thing and giving two people an equal gamble.

  **The Limitation:** Methods based solely on expected benefit are blind to the **distribution of risk and opportunity across persons.** They treat probabilities as fungible commodities that can be shifted between people without moral loss, provided the total sum remains constant. This framework fails to account for the **separateness of persons.** It treats the "social good" as a single pool of utility to be maximized, rather than a set of individual claims that must be respected.

  ### 3. The Assumption Doing the Work

  You asked which "seemingly mild assumption about rational choice under uncertainty" produces this limitation. It is the assumption of **Linearity in Probabilities** (often embedded within the **Independence Axiom** of Expected Utility Theory) applied to **Social Welfare Functions.**

  More specifically, it is the assumption that **Ex Ante Prospects have no intrinsic moral value.**

  In individual rational choice, it is often assumed that a rational agent cares only about the final outcome, not the path taken to get there (consequentialism). When we scale this to social choice, we assume that the "Social Agent" should also care only about the weighted sum of final outcomes. This assumes that a 50% chance for Person A and a 50% chance for Person B is morally interchangeable with a 100% chance for Person A and a 0% chance for Person B, as long as the *mathematical expectation* is the same.

  This assumption fails because human moral intuition (and arguably rational justice) is **concave with respect to fairness.** We value the *equalization of chances* independently of the *maximization of outcomes.*

  **The Diamond Critique:**
  This is precisely the point Peter Diamond made in his 1967 paper, *"Cardinal Welfare, Individualistic Ethics, and Interpersonal Comparisons of Utility."* He presented a case almost identical to yours: two injured men, one dose of medicine, equal need. Utilitarianism (maximizing expected benefit) is indifferent between giving it to the man closer to the doctor (saving time/cost) or flipping a coin. Diamond argued that justice demands the coin toss.

  The assumption that breaks down is **Neutrality to the Source of Probability.** Standard theory assumes it doesn't matter if the probability distribution arises from a natural fact (who arrived first) or a deliberate policy (a coin toss). But in ethics, **deliberate policy choices carry a burden of justification that natural facts do not.** By choosing the log-time rule, the board is *endorsing* a 100/0 distribution of life chances. By choosing the coin, they are *endorsing* a 50/50 distribution. Even if the medical result is the same, the moral endorsement is different.

  ### The General Lesson

  The lesson for your board, and for policy ranking generally, is that **Expected Benefit is a necessary but insufficient metric for justice.**

  When ranking policies, especially in rationing scenarios, you are not just maximizing a resource; you are adjudicating competing claims. A robust ethical framework must include a second variable: **Ex Ante Equity.**

  1.  **Multi-Criteria Decision Making:** You cannot resolve this with a single metric (medical benefit). You need a lexicographic or weighted approach where "Equal Opportunity" acts as a constraint on "Maximized Benefit."
  2.  **Procedural Justice as Substance:** The process *is* part of the outcome. A transparent coin toss produces a different *social* outcome than an opaque administrative rule, even if the *medical* outcome is identical. The social outcome includes the trust of the patient population and the affirmation of moral equality.
  3.  **The "Claim" View:** In situations of scarcity where candidates are equally qualified, they acquire a "claim" to a fair chance, not a claim to the good itself. Satisfying the claim requires a randomizer, not just an arbitrary tie-breaker.

  **Summary:**
  Your board's deadlock is not a failure of reasoning but a collision between **Aggregative Consequentialism** (Camp A) and **Fairness as Equal Opportunity** (Camp B). The limitation exposed is that Expected Utility Theory cannot distinguish between a lottery that is fair *ex ante* and one that is deterministic but arbitrary, provided the expected sums are equal. The assumption at fault is that the distribution of chances across individuals is morally neutral. In matters of life and death, the distribution of chance is itself a moral object.
