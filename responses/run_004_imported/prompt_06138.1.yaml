answer: |-
  This is one of the most fertile and technically dense corners of moral philosophy and welfare economics. You have correctly identified the fault lines: Robbins's skepticism, Harsanyi's formalist attempt to bypass it via expected utility, and Sen's meta-critique regarding the informational basis of social choice.

  To walk through this dialectic properly, we need to separate the mathematical machinery from the ethical assumptions, because Harsanyi's genius (and his vulnerability) lies in how tightly he wraps them together.

  Here is the breakdown of the debate, the technical role of expected utility, Sen's taxonomy of comparability, and the connection to Arrow.

  ---

  ### 1. Robbins's Blockade: The Ban on Interpersonal Comparisons

  To understand what Harsanyi is trying to do, we must be precise about what Robbins banned. In his 1932 *Essay on the Nature and Significance of Economic Science*, Robbins argued that economics should be a science of means, not ends.

  *   **Ordinalism:** We can observe that Person A prefers bundle $X$ to bundle $Y$. We cannot observe *how much* they prefer it.
  *   **Non-Comparability:** We can observe that Person A prefers $X$ to $Y$, and Person B prefers $Z$ to $W$. We cannot scientifically verify whether A's preference intensity is greater than, equal to, or less than B's.

  For Robbins, the statement "a pound is worth more to a poor man than a rich man" is a value judgment, not a positive fact. If you cannot measure it, you cannot put it in a scientific model. Consequently, welfare economics was stuck in a Paretian limbo: you could only say a change is "good" if it makes someone better off without making anyone worse off. Any policy involving trade-offs (which is almost all policy) required interpersonal comparisons, which were deemed unscientific.

  ### 2. Harsanyi's Move: The Aggregation Theorem

  John Harsanyi, in the 1950s (specifically 1955), attempted to break this deadlock not by arguing that Robbins was empirically wrong about human psychology, but by arguing that **rationality constraints** force us into a utilitarian framework.

  #### The Role of Expected Utility (vNM)
  The engine of Harsanyi's proof is the von Neumann–Morgenstern (vNM) expected utility theorem.
  *   **Individual Level:** If an individual's preferences over lotteries satisfy certain axioms (completeness, transitivity, continuity, independence), their preferences can be represented by a utility function $U_i$ that is **cardinal**.
  *   **What "Cardinal" Means Here:** It means $U_i$ is unique up to a **positive affine transformation** ($aU_i + b$, where $a > 0$). You can change the zero point ($b$) and the unit size ($a$), but you cannot change the ratios of differences. This allows us to talk about "expected utility" and risk attitudes.

  #### The Aggregation Theorem
  Harsanyi posits a "Social Welfare Function" (SWF) representing the moral preferences of an impartial observer. He imposes two main conditions:
  1.  **vNM Rationality:** The social preference ordering must also satisfy the vNM axioms (it must be rational over lotteries).
  2.  **Pareto Condition:** If every individual prefers lottery $L_1$ to $L_2$, society must prefer $L_1$ to $L_2$. (If everyone is indifferent, society is indifferent).

  **The Result:** Mathematically, if individual utilities $U_1, \dots, U_n$ and social welfare $W$ are all vNM functions, and the Pareto condition holds, then $W$ must be a linear combination of the $U_i$'s:
  $$W = \sum_{i=1}^{n} a_i U_i + b$$

  This looks like utilitarianism. It suggests that if you accept rationality and Pareto, you get a sum of utilities.

  #### The Catch: The Weighting Problem
  You asked where the equal-weighting assumption comes from. **It does not come from the theorem.**

  The theorem proves **weighted utilitarianism**. The coefficients $a_i$ are arbitrary positive constants.
  *   Mathematically, $a_i$ could be 1 for everyone (classical utilitarianism).
  *   But $a_i$ could also be 1,000,000 for the King and 1 for the peasant (extreme elitism), and it would still satisfy the Aggregation Theorem and the Pareto condition.

  To get *equal* weights (genuine utilitarianism), Harsanyi needs a second argument: the **Impartial Observer Theorem** (or Veil of Ignorance). He argues that if a moral observer does not know which individual they will be in the society (equiprobability assumption), rationality dictates they maximize expected utility. This implies assigning equal probability to being any person $i$, which effectively sets the weights $a_i$ to be equal.

  **Robbins's Counter-Punch:** Robbins would argue this is question-begging. To maximize expected utility behind the veil, you must be able to compare the utility of being Person A vs. Person B. You must assume that "1 util for A" is comparable to "1 util for B." But vNM utility is only cardinal *within* a person. The zero point and unit size are arbitrary *between* persons. Harsanyi has smuggled interpersonal comparability in through the back door of the "equiprobability" assumption.

  ### 3. Sen's Intervention: Informational Basis and Comparability

  Amartya Sen's contribution (particularly in *Collective Choice and Social Welfare* and *On Ethics and Economics*) was to stop asking "Is utility real?" and start asking "What information are we allowing into the social welfare function?"

  Sen argued that the disagreement between Arrow, Harsanyi, and Robbins is actually about **informational constraints**.

  #### The Taxonomy of Comparability
  Sen distinguished between different types of measurability and comparability. This is the "trenchcoat" you mentioned.

  1.  **Ordinal Non-Comparability (ONC):** (Arrow's assumption). We know A prefers $x$ to $y$. We don't know by how much, and we can't compare A to B. **Result:** Impossibility Theorem.
  2.  **Cardinal Unit Comparability (CUC):** We know the *size* of the utility unit is the same across people, but the zero point might differ. (e.g., We agree on what a "degree of happiness" is, but we don't agree on where "zero happiness" is).
      *   **Relevance:** This is what Utilitarianism needs. To sum utilities ($\sum U_i$), the units must be comparable. If my "1 util" is a headache and your "1 util" is a stubbed toe, the sum is nonsense.
      *   **Harsanyi's Implicit Assumption:** Harsanyi's theorem effectively assumes CUC. He treats the vNM scales as if they are calibrated across persons.
  3.  **Cardinal Level Comparability (CLC):** We know the zero point is the same (we can say who is happier), but the unit size might differ.
      *   **Relevance:** This is what Rawlsian Maximin needs. You need to know who is worst off (levels), but you don't need to sum gains and losses (units).
  4.  **Full Comparability:** Both levels and units are comparable.

  #### Sen's Critique of Harsanyi
  Sen argues that Harsanyi's Aggregation Theorem is mathematically valid but ethically incomplete.
  *   **The Math:** Yes, if you have CUC, you can sum utilities.
  *   **The Gap:** The vNM axioms only guarantee cardinality *within* the individual. They do not guarantee that the "unit" of risk-preference for Person A is the same as the "unit" for Person B.
  *   **The Consequence:** Harsanyi hasn't "solved" Robbins's problem; he has simply **stipulated** a richer informational basis (CUC) that Robbins forbade. Harsanyi says, "If we allow ourselves this information, utilitarianism follows." Sen says, "Correct, but you haven't justified *why* we are allowed that information."

  For Sen, the choice isn't between "scientific" (Robbins) and "unscientific" (Harsanyi). It's a choice between different informational bases, each leading to different ethical conclusions. If you want Utilitarianism, you *must* assert Unit Comparability. If you only have Level Comparability, you get something closer to Rawls. If you have neither, you get Arrow's impossibility.

  ### 4. The Arrow Connection: Myth or Reality?

  You asked whether Harsanyi/Sen-style comparability is a genuine escape from Arrow's Impossibility Theorem or a myth.

  **It is a genuine escape, but it comes with a price.**

  Arrow's Impossibility Theorem holds under specific conditions, one of which is effectively **Ordinal Non-Comparability**. Arrow's framework deliberately excludes interpersonal comparisons of well-being.
  *   **Theorem:** If you demand a SWF that satisfies Unrestricted Domain, Pareto, Non-Dictatorship, and Independence of Irrelevant Alternatives (IIA) using only ordinal, non-comparable data, no such function exists.
  *   **The Escape:** If you relax the informational constraint to allow **Cardinal Unit Comparability** (as Harsanyi does), the theorem no longer holds. The "Sum of Utilities" function satisfies all of Arrow's conditions *except* the informational constraint.

  So, it is not a myth. Comparability *does* dissolve Arrow's impossibility. However, Robbins's objection was never "You can't do the math." It was "You can't verify the inputs." Escaping Arrow requires admitting data that Robbins claimed was scientifically inaccessible. Sen's point is that we should admit this openly: "We are choosing to assume comparability because we need to make decisions, not because we have measured it with a utility-meter."

  ### 5. Back to the Chicken-Years (EA Context)

  This brings us back to your rabbit hole. When an EA spreadsheet calculates that "1 year of chicken suffering = 0.1 years of human suffering," they are making a massive informational assumption.

  1.  **Cardinality:** They are assuming suffering is cardinal (you can have twice as much suffering).
  2.  **Unit Comparability:** They are assuming the "unit" of suffering is comparable across species.

  **The Harsanyi View:** If we accept that chickens and humans are "individuals" in the moral sense, and we accept the Veil of Ignorance, we should maximize the sum of expected utility. We just need to figure out the conversion rate (the weights).
  **The Robbins View:** This number is scientifically meaningless. You are comparing apples to oranges and calling it "fruit utils."
  **The Sen View:** The spreadsheet is a formalization of a specific **informational basis**. The debate shouldn't be "Is this number true?" but "Is Unit Comparability across species a permissible ethical assumption for our decision procedure?"

  ### Summary of the Dialectic

  1.  **Robbins:** Interpersonal comparisons are unscientific value judgments. Economics must remain ordinal and non-comparable. (Result: Pareto-only welfare economics).
  2.  **Harsanyi:** If we model individuals and society as vNM rational agents over lotteries, and impose Pareto, social welfare *must* be a weighted sum of individual utilities. If we add the Veil of Ignorance, weights become equal. (Result: Utilitarianism derived from rationality).
  3.  **The Flaw:** vNM utility is only cardinally measurable *within* a person. Summing across persons requires **Unit Comparability**, which the math does not generate. Harsanyi assumes it ethically.
  4.  **Sen:** The debate is about **Informational Basis**.
      *   Arrow's Impossibility arises from **Ordinal Non-Comparability**.
      *   Harsanyi's Utilitarianism arises from **Cardinal Unit Comparability**.
      *   We cannot "prove" one basis is correct; we must choose the basis that fits our ethical commitments.
  5.  **Conclusion:** Harsanyi did not refute Robbins empirically; he bypassed him by changing the rules of the game to allow richer data. Sen clarified that this is a choice of ethical information, not a discovery of mathematical fact.

  For your cause-prioritization spreadsheets: The math works *if* you accept the informational basis. The "rabbit hole" is the realization that the conversion factor between chicken and human suffering is not a fact waiting to be discovered, but a parameter reflecting your chosen commitment to interpersonal (and inter-species) unit comparability.
