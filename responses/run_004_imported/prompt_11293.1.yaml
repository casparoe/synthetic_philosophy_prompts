answer: |-
  First off, as a fellow lover of mechanical things, I have to say: welcome to the club. The tactile feedback of a Hermes 3000 is legendary for a reason.

  To answer your question directly: **No, you were not irrational, and your friend is looking at this through the wrong lens.**

  Your friend is applying **investment logic** to an **experience hobby**. If you were trading stocks and ended up with the same share you started with minus $150, you would be irrational. But typewriters aren't stocks; they are tools and art objects that provide utility and joy *while you own them*, not just when you sell them.

  Here is the breakdown of why your cycle makes perfect sense, economically and psychologically, and why you shouldn't feel dumb about it.

  ### 1. The "Money Pump" Fallacy
  In economics, there is a concept called a "money pump." It argues that if your preferences are cyclical (you prefer A over B, B over C, but C over A), you are irrational because someone could theoretically trade you in circles forever until you run out of money.

  Your friend sees this cycle:
  *   Hermes $\rightarrow$ Olivetti
  *   Olivetti $\rightarrow$ Smith-Corona
  *   Smith-Corona $\rightarrow$ Hermes

  However, this theory assumes your preferences are **static**. It assumes you are the same person with the same needs at the start of the year as you are at the end. You aren't.
  *   **Trade 1** was about **Aesthetics** (Typeface).
  *   **Trade 2** was about **Function** (Portability).
  *   **Trade 3** was likely about **Feel/Realization** (The travel machine wasn't enough; you missed the typing experience).

  You didn't have inconsistent taste; you had **evolving priorities**. You couldn't have known the Smith-Corona wouldn't satisfy you until you lived with it.

  ### 2. The $150 Wasn't a Loss; It Was a Rental Fee
  You view the $150 as money lost. I suggest you view it as **rent**.

  You "rented" the Olivetti Lettera for a few months to satisfy your craving for that specific typeface. You "rented" the Smith-Corona for the summer to satisfy your desire to write on the go.
  *   $40 for the Olivetti experience.
  *   $60 for the Smith-Corona experience.
  *   $50 to buy back the comfort of the Hermes.

  Would you have paid $150 to rent two vintage typewriters over the course of a year to test them out? For a collector, that is a bargain. You paid for the *knowledge* of what you didn't want, which is just as valuable as knowing what you do want.

  ### 3. The "Second Hermes" is Not the "First Hermes"
  This is the most critical psychological point. The Hermes 3000 you own now is **not the same machine** as the one you started with, even if they are the same model.

  *   **Hermes #1:** You owned it out of habit or initial interest. You didn't truly appreciate it because you hadn't compared it to anything else recently.
  *   **Hermes #2:** You own it out of **choice**. You have now felt the Olivetti and the Smith-Corona. You have actively rejected them in favor of the Hermes.

  The value of the second Hermes is higher because it is the *confirmed* winner. You have closure now. The "itch" to see what else is out there has been scratched. That peace of mind is worth the $150.

  ### 4. Where the Danger Actually Lies
  While you weren't irrational, there is one nuance worth checking. You mentioned this started as research and became a "full-blown habit."

  The only way this behavior would be irrational is if the **thrill was in the trading**, not the **typing**.
  *   **Rational:** "I traded to find the best tool for my writing."
  *   **Irrational:** "I traded because I get a dopamine hit from the negotiation and the acquisition."

  If you find yourself eyeing a Royal Quiet DeLuxe next month just to see what it's like, you might be chasing the *hunt* rather than the *write*. But based on your description, it sounds like you were genuinely seeking the right tool for specific contexts (studio vs. travel).

  ### The Verdict
  You didn't make a mistake. You conducted a year-long A/B/C test on your own writing process.

  *   **Was a specific trade off?** No. Each solved a specific desire at that moment.
  *   **Was something off at the start?** Only in that you didn't know yet that the Hermes was your endgame. You couldn't have known that without leaving it.

  Tell your friend that you didn't lose $150; you spent $150 to learn that the Hermes 3000 is the love of your typewriter life. Now, stop trading and **write the next novel.** That is the only way to make the $150 truly worth it.
