      *   **Experience Goods:** Typewriters are experience goods. You don't know how much you value the Hermes until you've tried the Olivetti and Smith-Corona.
      *   **Sunk Cost/Endowment Effect:** Did the user value the second Hermes more because it was familiar? Or was it truly the superior machine for their needs?
      *   **The Cost of Learning:** The $150 wasn't lost; it was spent on information gathering and sensory experience.

  6.  **Formulate the Verdict:**
      *   **Not Irrational:** The user isn't irrational. They paid for an experience.
