answer: |-
  This is a wonderfully constructed seminar pairing, and the friction your students are feeling is entirely warranted. It stems from a genuine tension in Keynes's intellectual biography: the gap between the *teleological optimism* of his Moorean ethics and the *sociological pessimism* of his later political economy.

  To help structure your seminar discussion, I suggest framing the relationship between the two texts not as a simple contradiction, but as a shift from an **ethical ideal** (1930) to a **political technology** (1938). Here is an analysis of how far the 1930 essay is Moorean, where it departs, and how the 1938 memoir complicates rather than negates the earlier forecast.

  ### 1. The Moorean Core: The 1930 Essay as Applied *Principia Ethica*

  Your students are correct to identify the 1930 essay as a transposition of Moore's intrinsic goods. In *Principia Ethica*, Moore argues that the only things good in themselves are certain states of consciousness: principally the pleasures of human intercourse (love/friendship) and the enjoyment of beautiful objects (art/nature). Everything else (money, work, virtue) is merely instrumental.

  Keynes's 1930 vision is rigorously Moorean in its **ends**:
  *   **The End of Instrumentalism:** Keynes defines the "economic problem" as the struggle for subsistence. Once solved, instrumental striving (work, thrift, accumulation) loses its moral justification.
  *   **The Content of Leisure:** When Keynes asks how we shall use our freedom, he does not suggest hedonism or consumption. He suggests we return to "the principles of religion and traditional virtue"—but stripped of their economic utility. To "live wisely and agreeably and well" is to inhabit those Moorean states of mind: contemplation, affection, and aesthetic appreciation.
  *   **The Critique of Purposiveness:** Keynes diagnoses the modern capitalist psyche as addicted to "purpose." We do things *for* money, not for the thing itself. This is a direct echo of Moore's distinction between means and ends. Keynes argues that we have mistakenly treated the means (accumulation) as the end.

  In this sense, the 1930 essay is perhaps the most ambitious attempt in the 20th century to build a macroeconomic policy framework designed solely to realize a specific moral philosophy.

  ### 2. The Departure: Elitism and the Psychology of Habit

  However, the essay departs from Moore in a crucial sociological respect, which is where your students' discomfort with elitism arises.

  Moore's ethics are fundamentally individualist and intellectualist. He assumes that if one can perceive the good, one should pursue it. He does not dwell extensively on the *social preconditions* required to cultivate the sensitivity to perceive the good. Keynes, writing as an economist, confronts the **habituation problem**.

  *   **The Psychological Barrier:** Keynes argues that for centuries, humanity has been bred to be "painful" and "purposeful." We have cultivated the virtues of scarcity (thrift, foresight, deferment of gratification). He worries that when scarcity ends, we will suffer a "nervous breakdown."
  *   **The Two-Class Solution:** This leads to the passage that troubles your students: the suggestion that for a considerable time, there must be two classes—the "purposeful" who keep working and saving, and the "lilies of the field" who enjoy the leisure.
  *   **The Departure from Moore:** Moore does not suggest that only an aristocracy of taste is *capable* of the good life, only that they are better at recognizing it. Keynes implies a harder constraint: that the *capacity for leisure* is a cultural skill that the masses currently lack. He treats the Moorean good life not as a universal human potential waiting to be unlocked, but as a cultivated art form that requires a transition period of tutelage.

  This is where Keynes moves beyond Moore's abstract ethics into a Burkean sociology. He recognizes that you cannot simply switch off the "economic motor" without social dislocation. The elitism in 1930 is not just snobbery; it is a pessimistic assessment of how deeply economic necessity has shaped human psychology.

  ### 3. The 1938 Retrospective: Chastened but Consistent?

  Does "My Early Beliefs" undermine the 1930 forecast? It complicates it, but I argue it renders it more coherent rather than invalidating it.

  In the memoir, Keynes critiques the Apostles for believing that "states of mind" were the only reality, leading them to ignore "consequences" and "conventions." They treated general rules (do not lie, do not steal, work hard) as mere superstitions that enlightened individuals could discard if their intuition deemed it unnecessary. Keynes admits this was dangerous; conventions are the "weak ties" that hold civilization together when individual judgment fails.

  **Reading the two texts together:**

  1.  **The 1930 Essay is actually Consequentialist:** Ironically, the 1930 essay is not an example of the "immoralism" Keynes critiques in 1938. It is not an appeal to intuition. It is a cold calculation of remote consequences (1% growth over 100 years). In 1930, Keynes is acting precisely as the 1938 memoir suggests an adult should: weighing the long-term impact of actions on social welfare. The 1938 critique is of the *youthful* Keynes who ignored consequences; the 1930 Keynes is the *mature* economist managing them.
  2.  **The Necessity of Conventions:** The 1938 realization that conventions matter helps explain the "two-class" theory in 1930. If Keynes had remained a pure Moorean idealist in 1930, he might have argued for immediate leisure for all. Instead, he argues that the "old habits" (conventions of work and thrift) must be maintained for the majority *until* they are psychologically ready. The 1938 memoir explains *why* the 1930 essay is so cautious about immediate liberation: because without the scaffold of convention, society might collapse before it reaches the Moorean promised land.
  3.  **The Role of the Expert:** In 1938, Keynes acknowledges that the "enlightened few" cannot simply float above society. They have a duty to manage the machinery that allows others to live. This aligns with the 1930 view that the "purposeful" class (investors, managers, economists) must continue to toil so that the "lilies" can eventually bloom. The elitism is recast not as a right to superior pleasure, but as a burden of responsibility.

  ### 4. Pedagogical Synthesis for Your Seminar

  You might propose to your students that the tension they feel is the tension between **Ethics** (Moore) and **Governance** (Keynes).

  *   **The Moorean Ideal:** The 1930 essay gives us the *destination*. It tells us what freedom is *for*. Without this, economic growth is meaningless.
  *   **The 1938 Correction:** The memoir gives us the *map*. It warns us that we cannot get there by simply telling everyone to follow their intuitions. We need institutions, conventions, and a managed transition.

  **A Provocation for Discussion:**
  Ask your students whether Keynes's 1930 prediction failed because the economics were wrong (growth was uneven, leisure didn't materialize) or because the **moral psychology** was wrong.
  *   If the latter, was it Moore's fault? Did Moore provide a vision of the good life that was too thin, too aesthetic, and too detached from the human need for "purpose"?
  *   Or was Keynes right in 1938: that we cannot simply *decide* to be "lilies of the field"? If the "economic problem" were solved tomorrow, would we indeed face a nervous breakdown, proving that the "old habits" were not just instrumental, but constitutive of our sense of self?

  **Conclusion:**
  The texts are consistent if viewed as a progression. The 1930 essay sets the Moorean goal. The 1938 memoir admits the difficulty of the path. Keynes never abandoned the belief that love and beauty were the only things that mattered; he simply realized in 1938 that achieving a world where those things are possible requires a respect for rules, consequences, and social cohesion that the young Apostles had scorned. The "elitism" of 1930 is the unfortunate acknowledgment that the capacity for Moorean freedom is not yet universally distributed, and the "chastening" of 1938 is the recognition that bridging that gap requires more than just good intentions—it requires the very economic management Keynes spent his life perfecting.
