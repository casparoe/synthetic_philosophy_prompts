      *   *Section 2: The Departure (Elitism & Psychology).* Discuss the "lilies of the field" passage. Why can't everyone do it? Keynes introduces a *psychological* barrier (habituation to scarcity) that Moore didn't emphasize. This is where Keynes adds a sociological layer to Moore's ethics.
      *   *Section 3: The 1938 Retrospective.* Summarize the "immoralism" charge. The realization that conventions protect us from our own bad judgment.
      *   *Section 4: Synthesis/Consistency.* How to read them together.
          *   *Point A:* The 1930 essay is a *forecast*, not just an ethical prescription. It allows for a transition period where conventions (work) remain necessary for most.
          *   *Point B:* Keynes in 1938 isn't rejecting Moore's *ends*, only the Apostles' *method* of ignoring consequences. The 1930 essay is actually very concerned with consequences (growth).
          *   *Point C:* The "Two-Class" solution in 1930 (some work, some play) anticipates the need for structure acknowledged in 1938.
      *   *Conclusion:* Summarize the pedagogical takeaway. The tension is productive. It shows Keynes as a bridge between idealist ethics and pragmatic governance.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the "elitism" specifically? Yes, need to ensure I distinguish between Moore's intellectual elitism (only philosophers see the good clearly) and Keynes's cultural elitism (only the cultivated can enjoy leisure).
      *   *Check:* Is the distinction between "intrinsic good" and "instrumental rules" clear? Yes, this is the crux of the Moore/Apostles split.
      *   *Nuance:* Make sure not to paint Keynes as purely cynical in 1938. He still values the states of mind; he just regrets the disregard for social cohesion.
      *   *Key Insight:* The 1930 essay *is* an exercise in calculating remote consequences (growth over 100 years), which actually aligns *better* with the chastened 1938 view than the radical 1903 Apostles view. This is a strong point for consistency.

