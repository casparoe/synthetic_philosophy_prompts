prompt: |-
  I'm on the standards committee at the outlet I write for, and we've got an annoying case in front of us. A piece our science desk ran stated flat-out that social media is causing the rise in teen depression, no hedge, leaning on the same correlational and quasi-experimental evidence Haidt uses in The Anxious Generation. A few academics in the Odgers/Orben camp complained that effect sizes are tiny and causation's nowhere near established, so we owe readers a correction. Half the committee thinks we overclaimed; the other half thinks the reporter had plenty of good evidence and that hedging everything with "some scientists believe" is it's own kind of dishonesty, not more honest, just mushier. We meet thursday and I need an actual memo: what to do about this piece, plus a real rule reporters can use for how much evidence is "enough" to assert a contested causal claim outright instead of attributing it. Don't split the difference, and give the anti-hedging camp a fair hearing -- committees like ours usually wave them off too fast.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Standards committee at a media outlet.
      *   **Issue:** A science piece claimed "social media *is causing* the rise in teen depression" (causal claim) based on correlational/quasi-experimental evidence (Haidt-style). Academics (Orben/Odgers) pushed back (small effects, causation unproven).
      *   **Conflict:** Half the committee says "overclaimed, needs correction." Half says "evidence is strong enough, hedging is dishonest/mushy."
      *   **Task:** Write a memo for the Thursday meeting.
      *   **Requirements:**
          *   Decide what to do about *this* piece (Correction? Editor's Note? Stand by it?).
          *   Create a *real rule* for reporters on when to assert causal claims vs. attribute them.
          *   *Do not split the difference* (need a clear recommendation).
          *   *Give the anti-hedging camp a fair hearing* (acknowledge their valid points about "false balance" or "mushiness").

  2.  **Deconstruct the Scientific Debate (Haidt vs. Orben/Odgers):**
      *   *Haidt's Position:* Social media/smartphones are a primary driver of the mental health decline starting around 2012. Evidence includes cross-national correlations, time-use surveys, and some quasi-experiments.
      *   *Orben/Odgers' Position:* Effects are small, inconsistent, and correlational. Other factors (economic anxiety, climate change, family structure) matter. Causation is not established.
      *   *Journalistic Standard:* To say "X causes Y" outright, you generally need randomized control trials (RCTs) or extremely robust natural experiments that rule out confounders. The current consensus in psychology/epidemiology is that the evidence is *suggestive* but not *definitive*.
      *   *Conclusion on the Science:* The "anti-hedging" camp is right that the evidence is substantial, but the "correction" camp is right that "causing" is too strong a verb for the current state of play. It's not binary (true/false), it's about certainty levels.

  3.  **Address the "Anti-Hedging" Argument (Fair Hearing):**
      *   Why do they hate hedging? "Some studies suggest" can obscure urgent public health risks. It creates false equivalence between a mountain of evidence and a few dissenters. It weakens the impact of vital reporting.
      *   Valid point: If the evidence is overwhelming (e.g., smoking causes cancer), hedging is malpractice.
      *   Valid point: Constant attribution ("scientists say") abdicates the outlet's responsibility to synthesize truth for the reader.

  4.  **Address the "Pro-Correction" Argument:**
      *   Why do they want a correction? Accuracy. Causation is a high bar. If we say "X causes Y" and later it turns out to be "X contributes slightly to Y alongside Z," we lose credibility.
      *   Valid point: The Orben/Odgers critique is mainstream in the field, not fringe. Ignoring it misrepresents the scientific consensus.

  5.  **Formulate the Recommendation (No Splitting the Difference):**
      *   *Decision:* We cannot stand by the flat claim "is causing." It exceeds the evidence. However, a full "Correction" implies factual error. An "Editor's Note" or "Clarification" is better. It acknowledges the nuance without admitting the original was a lie.
      *   *Actually, looking closer:* If the standard is "assert causation only when established," and it's *not* established, the original statement was technically inaccurate by scientific standards. A Correction is the honest move, but framed carefully. Let's go with a **Correction/Clarification** that adjusts the language from definitive causation to strong association/contribution.
      *   *Wait, the prompt asks not to split the difference.* I need to pick a side on the *principle* while solving the specific case.
      *   *Principle:* Reporters should not assert causation without RCTs or near-RCT quality natural experiments *unless* there is a consensus statement from major bodies.
      *   *Specific Case:* The piece overclaimed. It needs an amendment.
      *   *Anti-Hedging Fair Hearing:* I need to validate their fear of "mushiness" in the rule itself. The rule shouldn't be "always hedge." It should be "assert when the threshold of evidence is met."

  6.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** Clear recommendation (Amend the piece, adopt new guideline).
      *   **The Specific Case:** Acknowledge the reporter's work (it wasn't lazy), but the verb "causing" is the problem. Recommend an Editor's Note/Clarification (less punitive than "Correction" but fixes the record).
      *   **The Anti-Hedging Argument (Fair Hearing):** Dedicate a section to why "some say" is bad. It creates false balance. It paralyzes reporting on emerging risks. We *want* reporters to take stands when evidence warrants it.
      *   **The Proposed Rule (The "Causal Threshold"):** This is the core value add.
          *   Level 1: Correlation (Use "linked to," "associated with").
          *   Level 2: Mechanism + Longitudinal (Use "contributes to," "drives").
          *   Level 3: RCT/Consensus (Use "causes").
          *   *Crucial Nuance:* Allow assertion if the *weight* of evidence is overwhelming even without a single RCT (e.g., climate change), but require Senior Editor sign-off.
      *   **Implementation:** How to train reporters.

  7.  **Refining the Tone:**
      *   Needs to be authoritative but collegial.
      *   Needs to show I understand the science (Haidt vs. Orben).
      *   Needs to respect the "anti-hedging" colleagues (they care about impact and truth, not just safety).

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is recommending a correction too harsh on the reporter?
      *   *Fix:* Frame it as "Clarifying the certainty level" rather than "Fixing a lie." The reporting was good, the conclusion was too sharp.
      *   *Critique:* Is the rule too complex?
      *   *Fix:* Make it a "Traffic Light" system or clear tiers. Let's use a "Threshold of Certainty" framework.
      *   *Critique:* Did I give the anti-hedging camp enough respect?
      *   *Fix:* Explicitly state that excessive hedging is a failure of journalism, not a virtue. The goal is *precision*, not *caution*.

  9.  **Final Polish:** Check against constraints.
      *   Memo format? Yes.
      *   Decision on piece? Yes (Clarification).
      *   Real rule? Yes (Causal Assertion Threshold).
      *   No splitting difference? Yes (Taking a firm stand on the verb "causes").
      *   Fair hearing to anti-hedgers? Yes (Validated in the rationale).

  10. **Final Output Generation** (Proceed to write the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Standards Committee
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Social Media/Teen Depression Coverage & Causal Assertion Guidelines

  ### Executive Summary

  We are at an impasse regarding the recent science desk piece on teen depression. Half the committee views the headline claim ("Social Media Is Causing the Rise in Teen Depression") as a factual overreach requiring correction; the other half views a correction as capitulation to academic nitpicking that undermines urgent public interest reporting.

  **My recommendation is this:** We issue a **Clarification** (not a full Retraction/Correction) adjusting the definitive causal language to reflect the current limits of the data. Simultaneously, we adopt a new **Causal Assertion Threshold** for science reporting.

  This approach rejects "false balance" hedging while acknowledging that the verb "causes" carries a specific scientific burden our current evidence does not fully meet. We can validate the anti-hedging camp's concern about "mushy" journalism without committing the outlet to claims the data cannot support.

  ---

  ### 1. Ruling on the Specific Piece

  **Decision:** Publish an Editor's Note/Clarification at the top of the digital article.

  **Rationale:**
  The reporter did not fabricate data. They synthesized a compelling body of work (Haidt, Twenge, etc.) that points strongly toward harm. However, in epidemiology and psychology, the term "causes" implies a mechanism and exclusivity that quasi-experimental data cannot yet prove to the satisfaction of the broader field (including the Orben/Odgers camp).

  If we stand by "causing" outright, we tie our credibility to a scientific consensus that does not yet exist. If we issue a full "Correction," we imply the reporter was negligent, which they were not. A **Clarification** strikes the necessary balance: it signals to the reader that while the evidence is strong, the scientific community is still debating the *magnitude* and *mechanism* of the effect.

  **Suggested Language:**
  *> *Clarification:* An earlier version of this article stated definitively that social media is causing the rise in teen depression. While substantial evidence links platform usage to worsening mental health outcomes, the scientific community continues to debate the magnitude of this effect relative to other factors. We have adjusted the language to reflect the strength of the current correlational and quasi-experimental evidence.*

  ---

  ### 2. The Anti-Hedging Argument: A Fair Hearing

  Before establishing new rules, we must address the valid concerns of the committee members opposed to excessive hedging. Their argument is not that accuracy is optional; it is that **precision is not the same as caution.**

  1.  **False Equivalence:** Constantly attributing claims ("Some scientists say...") can elevate fringe dissent to the same level as overwhelming evidence. If 90% of the data points to harm and 10% urges caution, writing "scientists are divided" is arguably more dishonest than writing "evidence suggests harm."
  2.  **Public Health Stakes:** In cases of potential harm (e.g., opioids, climate change, lead paint), waiting for 100% causal certainty before asserting risk can cost lives. Journalism must convey the *weight* of evidence, not just the *status* of evidence.
  3.  **Reader Trust:** Readers come to us for synthesis. If we hide behind attribution in every sentence, we abdicate our role as interpreters of reality. "Mushy" writing erodes authority faster than a bold claim that is later nuanced.

  **We agree:** The goal is not to hedge more; it is to be more precise about what we know.

  ---

  ### 3. Proposed Policy: The Causal Assertion Threshold

  To resolve future disputes without resorting to "splitting the difference," reporters must meet specific criteria before asserting a causal claim outright (e.g., "X causes Y") rather than attributing it ("X is linked to Y" or "Researchers believe X causes Y").

  **The Rule:** Reporters may assert causation directly only when **one** of the following three thresholds is met. If none are met, claims must be attributed or qualified.

  #### Threshold A: The Gold Standard (Experimental)
  *   **Evidence:** Randomized Controlled Trials (RCTs) or Natural Experiments that successfully isolate the variable.
  *   **Allowed Language:** "Causes," "Leads to," "Produces."
  *   **Example:** Smoking causes lung cancer; Seatbelts reduce fatalities.

  #### Threshold B: The Consensus Standard (Institutional)
  *   **Evidence:** No single RCT exists, but major relevant bodies (CDC, APA, IPCC, National Academies) have issued a consensus statement affirming causality based on the aggregate weight of evidence.
  *   **Allowed Language:** "Causes," "Drives."
  *   **Requirement:** Must cite the consensus body, not just individual papers.
  *   **Example:** Human activity causes climate change.

  #### Threshold C: The Mechanism Standard (Emerging Science)
  *   **Evidence:** Strong longitudinal data + a plausible, identified biological or psychological mechanism + replication across multiple independent teams.
  *   **Allowed Language:** "Contributes to," "Is a driver of," "Fuels." (Note: Avoid flat "Causes").
  *   **Requirement:** Must explicitly acknowledge competing variables in the text.
  *   **Example:** Social media use *contributes to* teen anxiety (Current Status).

  **Application to the Current Case:**
  The social media piece falls under **Threshold C**. The longitudinal data is strong, but the mechanism is debated and effect sizes are contested by credible peers. Therefore, the flat assertion "is causing" violated the policy. "Is a key driver of" or "Contributes significantly to" would have been permissible without a Clarification.

  ---

  ### 4. Implementation & Workflow

  To prevent this from becoming a bottleneck:

  1.  **The "Causality Check":** Copy editors are empowered to flag definitive causal verbs ("causes," "creates," "destroys") in science/health copy.
  2.  **The Burden of Proof:** If a reporter wishes to use definitive causal language under Threshold B or C, they must include a "Evidence Box" in their pitch outlining why the threshold is met, signed off by the Science Editor.
  3.  **No "Safe" Hedging:** Reporters are discouraged from using "some studies suggest" as a default shield. If the evidence is weak, the story should focus on the *uncertainty*, not the claim. If the evidence is strong, state it boldly within the Threshold guidelines.

  ### Conclusion

  This recommendation protects the outlet from credibility damage regarding the specific piece while empowering reporters to write with authority in the future. It acknowledges that the anti-hedging camp is right about the *danger of mushiness*, but maintains that the *accuracy of verbs* is non-negotiable.

  We do not need to choose between being bold and being right. We need to be bold only when we are right.

  **Action Required:** Vote on adopting the Causal Assertion Threshold and approving the Clarification language for the social media piece.
