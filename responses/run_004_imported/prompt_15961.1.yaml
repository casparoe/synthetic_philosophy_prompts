prompt: |-
  So this is going to sound like an odd ask, but bear with me. An old editor of mine talked me into judging the nonfiction category for a mid-size foundation's annual science-writing award this year -- small enough you won't have heard of it, so let's just call it "the Prize." There are five of us on the panel, and the charter is oddly precise about what counts as prize-worthy: a finalist wins only if it clears at least two of three named bars -- "rigor" (the science actually holds up), "originality" (it's not a rehash of stuff that's already out there), and "craft" (it's genuinely well written, not just important). We're deadlocked on the last finalist, a deep dive into a gut-microbiome study that turned out to be quietly p-hacked, and honestly the deadlock itself is way more interesting to me than the piece itself.

  Three of the five of us gave the piece an overall thumbs-up, but for three different reasons -- I thought it nailed rigor and craft but was thin on originality, another judge thought it was original and rigorous but badly written, and a third thought it was original and beautifully written but scientifically shaky. The other two judges gave it a flat thumbs-down on all three bars. So the straight headcount is 3-2 in favor. But our coordinator, just out of curiousity, also tallied things bar by bar instead of judge by judge -- and on every single one of the three bars, "fails" beat "passes" 3-2. So depending on whether you add up judges or add up bars, the piece either wins clearly or fails every single thing it needed to clear to win at all. Half the panel wants to just certify the 3-2 headcount and move on; the other half says that's absurd when a majority of us rejected the piece on every named criterion, and wants the bar-by-bar result to stand instead. Both halves think the other is being dense about it, and we announce winners in nine days.

  I cover this kind of stuff for a living and I'm annoyed at myself for not seeing this coming. Could you draft the short memo I'd circulate to the other four judges and the foundation's oversight board? It should recommend an actual course of action for this year's finalist, plus whatever tallying method you think the panel should commit to for future cycles so we're not refighting this every year, with a concrete point by which the board should adopt it. Don't give me a split-the-baby memo -- pick a side. But whatever you land on, deal honestly with the strongest thing to be said for the method you're rejecting, because I'll have to defend this to whichever half of the jury looses.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** A 5-person judging panel for a science-writing award ("the Prize").
      *   **The Rule:** A finalist wins *only if* it clears at least two of three bars: Rigor, Originality, Craft.
      *   **The Situation:** Deadlock on the last finalist (a piece about a p-hacked gut-microbiome study).
      *   **The Voting Data:**
          *   *Judge-by-Judge (Headcount):* 3 Judges say "Win" (Thumbs Up), 2 Judges say "Lose" (Thumbs Down). -> **Result: Win.**
          *   *Bar-by-Bar (Criteria):*
              *   Rigor: 3 Fail, 2 Pass.
              *   Originality: 3 Fail, 2 Pass.
              *   Craft: 3 Fail, 2 Pass.
              *   *Result:* The piece fails every single bar by a majority vote. -> **Result: Lose.**
      *   **The Conflict:** Half the panel wants to go with Judge Headcount (3-2 Win). Half wants to go with Bar Majority (3-2 Fail on all bars).
      *   **My Task:** Draft a short memo to the other 4 judges and the oversight board.
      *   **Requirements:**
          *   Recommend an actual course of action for *this* year's finalist (Pick a side: Win or Lose).
          *   Recommend a tallying method for *future* cycles.
          *   Set a concrete deadline for the board to adopt the method.
          *   Do *not* split the baby.
          *   Address the strongest argument for the rejected method (steelman the opposition).
          *   Tone: Professional, decisive, fair, authoritative but collaborative (since I'm a judge writing to peers/board).

  2.  **Determine the Logic/Decision:**
      *   *Option A: Judge Headcount (The piece wins).*
          *   Argument: Each judge is an expert entrusted to evaluate the whole. If 3 experts say "This meets the standard of a winner," it wins. The criteria are guidelines for the judge's holistic assessment, not a checklist for a machine.
          *   Weakness: It ignores the specific charter rule ("wins only if it clears at least two of three named bars"). If a majority says it *didn't* clear Rigor, and a majority says it *didn't* clear Originality, how can it be a winner? It violates the spirit of the specific rule.
      *   *Option B: Bar-by-Bar Majority (The piece loses).*
          *   Argument: The charter is explicit. The condition is objective relative to the panel's consensus. If the panel collectively determines Rigor is failed, it's failed. Allowing a win when the majority rejects every single criterion undermines the specific rules set by the foundation.
          *   Weakness: It can lead to "tyranny of the minority" in specific niches (e.g., if Judge 1 loves Craft, Judge 2 loves Rigor, Judge 3 loves Originality, they might outvote 2 judges who hate everything, even if the 3 judges don't overlap on *which* bars are passed). *Wait, let's look at the data again.*
          *   *The Data Quirk:*
              *   Judge 1: Pass Rigor, Pass Craft, Fail Originality. (Win)
              *   Judge 2: Pass Rigor, Pass Originality, Fail Craft. (Win)
              *   Judge 3: Pass Originality, Pass Craft, Fail Rigor. (Win)
              *   Judge 4: Fail All. (Lose)
              *   Judge 5: Fail All. (Lose)
              *   *Bar Tally:*
                  *   Rigor: Pass (J1, J2), Fail (J3, J4, J5) -> **Fail 3-2**
                  *   Originality: Pass (J2, J3), Fail (J1, J4, J5) -> **Fail 3-2**
                  *   Craft: Pass (J1, J3), Fail (J2, J4, J5) -> **Fail 3-2**
          *   *Analysis:* This is a classic Condorcet Paradox / Voting Theory issue. The "Judge Headcount" method respects individual holistic judgment. The "Bar Majority" method respects the specific constraints of the charter.
          *   *Decision:* The charter says "a finalist wins only if it clears at least two of three named bars." This implies the *bars* are the gatekeepers, not the judges' overall vibe. If the collective wisdom of the panel says the science is shaky (3-2), then the science *is* shaky for the purposes of the award. To award a piece that the majority agrees lacks Rigor, lacks Originality, and lacks Craft (individually) is to lie about the piece's quality. It undermines the award's integrity.
          *   *Selection:* I must recommend **disqualifying the piece (Lose)** and adopting the **Bar-by-Bar Majority** method for the future. This aligns best with the specific wording of the charter ("clears... bars").

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Acknowledge the difficulty, state the purpose (resolve the deadlock, set future precedent).
      *   **The Decision (This Year):** Recommend the piece does *not* win.
      *   **The Reasoning:** The charter sets criteria as necessary conditions. If the panel majority finds a criterion unmet, it is unmet. Awarding a piece that fails all three criteria by majority vote makes the criteria meaningless.
      *   **Addressing the Opposition (Steelmanning):** Acknowledge that Judge Headcount respects individual expertise and holistic judgment. It prevents niche vetoes. It's simpler. *But* it risks awarding pieces that no single majority believes are actually good in specific ways.
      *   **Future Protocol:** Formalize the Bar-by-Bar tally. Define the threshold (Majority of judges per bar).
      *   **Deadline:** Give a concrete date for the board to ratify this (before the announcement in 9 days).
      *   **Tone Check:** Needs to be firm but respectful. "I know we are tired," "This is hard," but "Here is the right path."

  4.  **Refining the Argument:**
      *   *Key Insight:* The charter says "wins only if it clears... bars." It doesn't say "wins if a majority of judges think it should win." The bars are the logic gates.
      *   *The "Odd Ask":* The user wants me to pick a side. I'm picking the "Bar-by-Bar" side because it adheres closer to the written charter rules provided in the prompt ("a finalist wins only if it clears at least two of three named bars"). The Judge Headcount method effectively rewrites the charter to "wins if 3 judges like it," ignoring the specific mechanism of the bars.
      *   *Deadline:* Announcement is in 9 days. Board needs to approve before that. Let's say 4 days from now to allow time for announcement prep.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Subject Line:* Needs to be clear. "Recommendation regarding Finalist X and Voting Protocol."
      *   *Opening:* Don't bury the lede.
      *   *The "Why":* Focus on the integrity of the criteria. If we say a piece is "Rigorous" when 3/5 judges say it isn't, we are lying.
      *   *The Counter-argument:* The "Holistic Expertise" argument. Judges are hired for their gut and expertise, not as vote machines. Forcing a bar tally might encourage strategic voting. I need to acknowledge this is valid but secondary to the charter's explicit rules.
      *   *Future:* Make the voting sheet explicit. Checkboxes for each bar, then a tally.
      *   *Closing:* Call to action.

  6.  **Review against Constraints:**
      *   Short memo? Yes.
      *   Recommend course of action? Yes (No award for this piece).
      *   Recommend future method? Yes (Bar-by-bar majority).
      *   Concrete point for adoption? Yes (Date).
      *   Pick a side? Yes (Bar method).
      *   Deal honestly with strongest opposing argument? Yes (Holistic expertise/Judge autonomy).

  7.  **Final Polish:** Ensure the tone isn't condescending. The user is a pro writer/judge, so the language should be crisp and intelligent. (Self-Correction: Make sure I don't sound like I'm scolding the other judges. Frame it as "structural ambiguity" rather than "you guys are wrong.")

  8.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** The Prize Judging Panel; Foundation Oversight Board
  **FROM:** [Your Name], Panel Judge
  **DATE:** October 14, 2023
  **SUBJECT:** Resolution of Finalist Deadlock and Voting Protocol Recommendation

  **Decision on Current Finalist**
  After reviewing the tally discrepancy regarding the microbiome finalist, I recommend the panel **decline to award the Prize to this entry.**

  While three judges voted to award based on their individual holistic assessments, the piece failed to secure a majority pass on any of the three mandatory criteria (Rigor, Originality, Craft). The charter states a finalist wins *only if* it clears at least two of the three bars. By aggregating the votes, we have established that a majority of the panel finds the science shaky, the narrative unoriginal, and the prose lacking. To award the piece despite this collective finding would render the specific criteria in our charter decorative rather than functional. We cannot certify a piece as "Rigorous" when a majority of the judges have formally recorded that it is not.

  **Recommendation for Future Cycles**
  To prevent recurrence, I recommend the Board formally adopt the **Criterion-Majority Method** for all future cycles.

  Under this protocol, a piece's eligibility is determined bar-by-bar. A bar is considered "cleared" only if a majority of judges (3 of 5) vote "Pass" on that specific criterion. A winner must clear at least two bars by this majority definition. This replaces the **Judge-Headcount Method**, where a judge's overall "Thumbs Up" is tallied regardless of how they scored the individual criteria.

  **The Strongest Case for the Rejected Method**
  I want to acknowledge the validity of the Judge-Headcount argument, championed by half this panel. Their position is that we are appointed as expert generalists, not metric auditors. A holistic vote respects the nuance of expertise—allowing a judge to decide that exceptional Craft compensates for moderate Rigor, for example, without being bound by a rigid checklist. It protects against a situation where a piece is excellent overall but loses because different judges nitpick different bars. It prioritizes human judgment over bureaucratic tallying.

  However, while holistic judgment is vital, it cannot override the explicit constraints of the charter. When the charter defines winning conditions as clearing specific bars, the panel's collective definition of those bars must take precedence over individual interpretations of the whole.

  **Timeline for Adoption**
  We announce winners in nine days. To ensure this protocol is settled before the press release is drafted, I request the Oversight Board ratify this voting method by **5:00 PM EST on October 18 (four days from now).**

  If ratified, we will proceed immediately with notifying the finalists that no award will be given in the Nonfiction category this year, preserving the integrity of the criteria for next cycle.

  Respectfully,

  [Your Name]
