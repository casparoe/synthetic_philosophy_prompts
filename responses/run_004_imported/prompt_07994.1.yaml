answer: |-
  Here are nine interview questions tailored to your background and the guest's expertise. They are designed to move past the textbook definition of Lewisian convention and probe the structural integrity of the theory.

  **1. The Purpose of the Analysis**
  David Lewis's *Convention* is often treated as a definition, but you've argued it's better understood as a functional analysis. In distributed systems, we define consensus by what it *achieves* (safety and liveness) rather than the specific message passing used to get there. When Lewis analyzes convention, is he trying to capture the folk concept of what people *call* a convention, or is he building a theoretical construct to explain how social order is *possible*?

  **2. The "Viable Alternative" Condition**
  Lewis requires that a convention solves a coordination problem where at least one viable alternative exists. We see this in driving on the left vs. the right. But consider protocols where the alternative isn't just suboptimal but catastrophic—like a "crash" state in a system. If the cost of deviating becomes infinitely high, does the regularity cease to be a convention and become something else, like a law of nature or a physical constraint? Where does the line sit for you?

  **3. The Psychological Realism of Common Knowledge**
  This is the classic objection, but I want to frame it through my lens. In distributed computing, true common knowledge is impossible to achieve in finite time over unreliable networks; we settle for "epsilon-common knowledge" or practical approximations. Lewis's definition invokes an infinite hierarchy of "I know that you know that I know..." Does the common-knowledge clause demand something psychologically unrealistic for human agents, and if so, does that invalidate the analysis, or is it acceptable as a normative idealization?

  *   **Follow-up:** *If you argue it's an idealization grounded in salient public signals: Does that mean "salience" is doing the heavy lifting here? If we can explain the coordination via salience alone, do we still need the infinite regress of mutual expectations, or is that just philosophical baggage?*

  **4. Gilbert and the Normative Force**
  Margaret Gilbert argues that Lewis reduces convention to individual expectations and preferences, which fails to explain why breaking a convention feels like a *fault* or a *violation* rather than just a prediction error. In my field, if a node violates a protocol, it's a bug or a Byzantine fault, not a moral failing. But in society, we feel entitled to rebuke convention-breakers. Can a Lewisian framework, which is rooted in self-interested coordination, actually generate that normative "ought," or does it need Gilbert's "joint commitment" patch to work?

  *   **Follow-up:** *If you argue that interdependent expectations create a conditional obligation: How do you handle the agent who simply lacks the preference for conformity? If I know everyone expects me to drive on the right, but I genuinely don't care about coordinating with them, does the Lewisian model still claim I'm at fault, or does it admit I'm outside the convention?*

  **5. Evolutionary Dynamics vs. Rational Agency**
  Brian Skyrms and others have shown how signaling systems and conventions can emerge through evolutionary dynamics or reinforcement learning without agents possessing high-level knowledge or rationality. They don't need common knowledge; they just need replication and payoff. Should a Lewisian worry that these models explain the *phenomenon* without the *machinery* Lewis proposed, or do you view evolutionary accounts as explaining the *genesis* while Lewis explains the *steady state*?

  *   **Follow-up:** *If you distinguish between genesis and maintenance: Can you have a Lewisian convention in the steady state if the agents have no memory of the genesis? If the common knowledge evaporates but the behavior persists due to habit, is it still a convention in your sense, or has it become a mere behavioral regularity?*

  **6. Language as the Paradigm**
  Lewis focuses heavily on language as the primary example of convention. However, in distributed systems, we distinguish between the consensus layer (agreeing on the state) and the application layer (what the state means). Do you think language is the *foundational* convention upon which others rest, or is it just the most complex instance of the same underlying coordination logic? If it's foundational, does that make linguistic conventions harder to change than traffic conventions?

  **7. Engineered vs. Spontaneous Order**
  My work involves *designing* conventions (protocols) that agents are forced to adopt. Lewis is interested in conventions that arise spontaneously from the population. Does the *source* of the convention matter for your analysis? If a central authority mandates a regularity that satisfies all of Lewis's criteria (common knowledge, alternative, coordination), is it a convention, or does the voluntary aspect of the equilibrium matter more than the equilibrium itself?

  **8. Updating the 1969 Code**
  You've spent your career defending and updating Lewis. If you could push a "patch" to the 1969 text to handle the last fifty years of criticism, what would it be? Is there a specific clause in the definition—perhaps regarding the content of the expectations or the nature of the preferences—that you find yourself constantly clarifying in your own work?

  **9. Falsifiability and the "Mis-specified Problem" Dodge**
  I want to close on the common-knowledge requirement specifically. A tempting move when facing a counterexample is to claim the coordination problem was mis-specified—that if agents weren't coordinating, it wasn't really a convention. What would actually count as evidence against the common-knowledge requirement? Is there a scenario where we have stable coordination, clear alternatives, and mutual expectations, but *no* common knowledge, where you would concede, "Okay, this is a convention, and Lewis was wrong about the necessity of common knowledge"?
