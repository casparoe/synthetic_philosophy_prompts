answer: |-
  Your flatmate is sharp. In fact, she is technically correct on a distinction that 90% of introductory philosophy textbooks blur. It is completely understandable why you are confused; the pop-philosophy version of Quine usually smashes two distinct arguments together under the label "Indeterminacy of Translation," using the rabbit example to do all the heavy lifting.

  To give you the "actual shape of the argument" you asked for, we need to separate **Inscrutability of Reference** (the rabbit stuff) from **Indeterminacy of Translation** (the sentence/manual stuff), and then tackle why Quine thinks this is ontological (about reality) rather than epistemological (about knowledge).

  Here is the structural walkthrough.

  ### 1. The Distinction: Reference vs. Translation

  Your flatmate is right: *Gavagai* is primarily an argument for the **Inscrutability of Reference**, which is a sub-component of the larger **Indeterminacy of Translation** thesis.

  **A. Inscrutability of Reference (The *Gavagai* Argument)**
  *   **The Setup:** You point at a rabbit. The native says "Gavagai."
  *   **The Data:** You have access to "stimulus meaning." This is the range of sensory stimulations that would prompt the native to assent to "Gavagai."
  *   **The Problem:** The stimulus meaning for "rabbit," "undetached rabbit part," and "temporal stage of a rabbit" is identical. Every time a rabbit is present, a rabbit part is present, and a rabbit stage is present.
  *   **The Conclusion:** You cannot determine the *reference* of the term based on behavioral evidence alone. You don't know if the native is referring to an object (rabbit) or a process (rabbiting).
  *   **Scope:** This applies to **terms** (words referring to objects). It shows that reference is relative to a "background language" or a manual of translation.

  **B. Indeterminacy of Translation (The Holistic Argument)**
  *   **The Setup:** Now we move from words to **sentences**. Quine argues we learn language not word-by-word, but by correlating whole sentences ("Holophrases") with sensory stimuli (e.g., "It is raining" + feeling wet).
  *   **The Data:** All possible behavioral dispositions. Every situation in which a native would assent to or dissent from any given sentence.
  *   **The Argument:** Quine claims you can construct two different "Translation Manuals" (Manual A and Manual B).
      *   Both manuals are perfectly compatible with *all* possible behavioral evidence (every assent/dissent in every situation).
      *   However, Manual A translates a specific sentence as $X$, while Manual B translates it as $Y$, where $X$ and $Y$ are logically incompatible in English.
  *   **The Conclusion:** There is no fact of the matter as to which manual is "correct."
  *   **Scope:** This applies to **sentences and theories**. It is broader than reference because it involves how logical connectives (if, and, not) and identity are mapped between languages.

  **Why the distinction matters:**
  You can resolve *Inscrutability of Reference* by stipulating a grammar. If we decide the native language has a count/mass distinction like English, "Gavagai" means "rabbit." But *Indeterminacy of Translation* says that even after you fix the grammar and the reference, you can still have rival manuals that fit all behavior but translate sentences differently.

  So, yes: *Gavagai* illustrates the reference problem. The full Indeterminacy thesis requires the argument about whole sentences and analytical hypotheses.

  ### 2. Why is this "Spookier" than Scientific Underdetermination?

  This is the crux of your second question. You noted that physicists often have rival theories that fit the data (Underdetermination of Theory by Evidence, or UTE), but we don't say there is "no fact of the matter." We just say we don't know which one is true.

  Quine draws a hard line between **UTE (Science)** and **Indeterminacy (Translation)**.

  **A. Scientific Underdetermination (Epistemic)**
  *   **Scenario:** Physics Theory T1 and Physics Theory T2 both predict all observable data.
  *   **Quine's View:** There *is* a fact of the matter. The world is one way or the other. One theory is true, the other is false (or both are false, and a T3 is true).
  *   **Why?** Because physical theories are about the **world**. The world exists independently of our theories. The "truth maker" is the physical state of the universe. We just lack the evidence to distinguish them. This is an *epistemological* limitation.

  **B. Translation Indeterminacy (Ontological)**
  *   **Scenario:** Translation Manual M1 and Manual M2 both predict all verbal behavior (assent/dissent).
  *   **Quine's View:** There is **no fact of the matter**. Neither is "really" true.
  *   **Why?** This comes from Quine's **Behaviorism** and **Physicalism**.
      *   For Quine, "meaning" is not a ghostly mental idea in the native's head. Meaning is exhausted by **behavioral dispositions**.
      *   In physics, there is a "residue" beyond the data (the actual physical particles/fields).
      *   In translation, there is **no residue**. Once you have accounted for all possible sensory stimuli and all possible verbal responses, you have accounted for *everything that exists* regarding meaning.
      *   If two manuals fit all that data equally well, there is nothing left to appeal to to decide between them. There is no "Meaning Fact" hidden in the brain.

  **The "Spooky" Implication:**
  In science, underdetermination means "We can't know the truth."
  In translation, indeterminacy means "There is no truth to know."

  Quine famously summarizes this as: **"There is no fact of the matter."** It is not that the native *really* means "rabbit" and we can't tell; it's that "meaning rabbit" vs. "meaning rabbit-stage" is not a real distinction until a manual is chosen. Meaning is relative to the manual.

  ### 3. The Structure of the Argument (Step-by-Step)

  If you want to explain this to your flatmate (or yourself) cleanly, here is the logical flow Quine uses in *Word and Object* and *Ontological Relativity*:

  1.  **Premise 1 (Physicalism/Behaviorism):** All facts about meaning must supervene on facts about physical behavior (stimulus and response). There are no private mental meanings.
  2.  **Premise 2 (Holism):** Sentences face the "tribunal of experience" not individually, but as a corporate body. We can adjust the translation of one sentence by compensating with adjustments to others (logic, grammar, other词汇).
  3.  **Construction:** Therefore, it is possible to construct Manual A and Manual B such that:
      *   Both account for all behavioral data (Premise 1 satisfied).
      *   Both adjust internal logical connections to maintain consistency (Premise 2 satisfied).
      *   Manual A translates sentence $S$ as "True," Manual B translates $S$ as "False."
  4.  **Inference:** Since all meaning facts are behavioral facts (Premise 1), and the behavioral facts are identical for both manuals, there is no meaning fact that distinguishes them.
  5.  **Conclusion:** Translation is indeterminate. There is no unique correct translation.

  ### 4. How this applies to your Korean learning

  Since you are in Seoul doing the "pointing method":

  *   **The *Gavagai* Limit:** When you point at a subway station and say "Yeok?" and someone nods, you have fixed the *stimulus meaning*. But you haven't fixed the reference. Does "Yeok" mean "station," "building," "place where trains stop," or "transportation hub"? You resolve this by learning the grammar (counters, particles), which acts as the "analytical hypotheses" Quine talks about.
  *   **The Indeterminacy Limit:** Even if you become fluent, Quine would argue that if a linguist came to study *your* Korean, they could construct a manual where your word for "blue" actually maps to their concept of "green-or-blue-under-certain-conditions," provided they adjust the translation of your logic and other color terms to compensate. You wouldn't be able to prove them wrong behaviorally.

  ### Summary for your Flatmate

  You can tell her she nailed the distinction.
  1.  **Gavagai** = Inscrutability of Reference (Terms/Objects).
  2.  **Indeterminacy** = Indeterminacy of Translation (Sentences/Manuals).
  3.  **The Difference from Science:** Science is underdetermined *epistemically* (reality exceeds evidence); Translation is indeterminate *ontologically* (meaning does not exceed evidence).

  The reason pop-philosophy skips this is that "We can't know if they mean rabbit or rabbit-part" is a fun puzzle. "There is no such thing as a unique correct meaning for any sentence" is a existential crisis that makes people stop buying philosophy books. But the latter is the actual thesis.
