prompt: |-
  Okay, this has been bugging me for about two weeks now. I moved to Seoul for work this spring and I've been trying to pick up Korean partly just by pointing at stuff and watching how people react to what I say (lazy way to learn a language, I know), and at some point my flatmate -- who's ABD in a linguistics PhD -- joked that I was basically doing "radical translation" and brought up Quine's gavagai example: the one where a linguist points at a rabbit, the native says "gavagai," and you supposedly can't tell if he means rabbit, or undetached rabbit-part, or rabbit-stage, etc. I half remembered this from an undergrad phil class, so I went down a bit of a rabbit hole (sorry) trying to actually understand the argument instead of just the pop-science version of it, and now I'm honestly more confused then when I started.

  Here's what's tripping me up. My flatmate says the gavagai example doesn't actually show the big scary thesis everyone thinks it shows -- she claims Quine himself later admitted it was really only ever an example of "inscrutability of reference" for individual terms, and that this is actually a narrower, less dramatic claim than "indeterminacy of translation" proper, which is supposedly about whole sentences and comes from a totally separate, bigger argument (something to do with underdetermination of theory by evidence plus his physicalism, no rabbits required). I can't tell if she's oversimplifying or if there's an actual substantive distinction here that all the pop-phil explainers skip over because the rabbit example is more fun to write about. And separately, I still don't get why any of this is supposed to be spookier than ordinary scientific underdetermination -- physicists have rival theories fitting the exact same data all the time, and we don't usually conclude there's "no fact of the matter" about which one's true, just that we can't know which one is.

  So could you actually walk me through the structure of this properly? Specifically: what's the real difference between the "terms" argument (the rabbit stuff) and the "whole sentence" argument, is my flatmate right that gavagai only ever illustrates the former, and why does Quine think translation is indeterminate in a different way than garden-variety scientific underdetermination, rather than just being another instance of it? Would love the actual shape of the argument rather than another rehash of the rabbit anecdote, if that's possible.
