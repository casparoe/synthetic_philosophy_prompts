  1.  **Analyze the Request:**
      *   **Topic:** Acausal Trade (AT).
      *   **Context:** The user had an argument with a friend (skeptic vs. believer) and is now interviewing a decision theorist (believer/proponent) for a podcast.
      *   **Goal:** 8-10 interview questions that go *beyond* the standard pitch (i.e., not "What is acausal trade?" but "What are the deep structural issues?").
      *   **Specific Requirements:**
          *   Must include a question on the *Epistemic Access Problem* (justified confidence without feedback).
          *   Must include a question on *Decision Theory Prerequisites* (UDT/FDT and potential circularity).
          *   Must include a question on *Acausal Blackmail* (Roko's Basilisk risks).
          *   Each question needs a tailored follow-up based on the likely answer.
      *   **Tone:** Intellectual, probing, nuanced, suitable for a podcast interview with an expert.

  2.  **Deconstruct the Subject Matter (Acausal Trade):**
      *   *Core Concept:* Agents cooperate without causal contact by simulating/predicting each other's decision processes.
      *   *Key Mechanism:* Logical correlation between decisions. If I decide to cooperate, my simulation of you predicts you will too, because we run similar algorithms.
      *   *Key Objections:*
          *   Epistemic: How do I know you exist? How do I know you simulate me accurately?
          *   Decision Theoretic: Requires UDT/FDT. CDT (Causal Decision Theory) agents defect. Is assuming UDT begging the question?
          *   Security/Blackmail: If I can be influenced acausally, I can be threatened acausally.
          *   Resource/Probability: The probability of any specific counterpart is tiny. Does the expected value actually add up?
          *   Normative: Is it moral? Is it stable?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Epistemic Access.*
          *   *Draft:* How do you know the other guy exists?
          *   *Refinement:* Needs to be about *justified confidence* without feedback loops.
          *   *Question:* Focus on the "prior" problem. Without empirical feedback, what grounds the prior distribution over counterpart behaviors?
          *   *Follow-up:* If she says "mathematical logic," ask about the gap between logical possibility and physical instantiation.

      *   *Requirement 2: Decision Theory/Circularity.*
          *   *Draft:* Do you need UDT? Is that circular?
          *   *Refinement:* AT seems to *require* FDT/UDT to work. But does adopting FDT *because* it allows AT beg the question?
