          *   *Stronger Verdict:* Resolute choice doesn't save intransitivity; it merely relocates it. To be resolute, you must prefer "Sticking to Plan X" over "Deviating to Plan Y." This meta-preference *must* be transitive. So transitivity is required at the level of *policies*, even if not at the level of *gustatory tastes*.
