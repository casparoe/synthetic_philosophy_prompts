          *   *Decision:* The Money Pump Argument *fails* to prove that underlying *psychological* preferences must be transitive if resolute choice is allowed. *However*, it succeeds in proving that *effective choice functions* must behave *as if* they are transitive to avoid exploitation. For AI, behavior is what matters. Therefore, the MPA holds for *design*, if not for *internal state*.
