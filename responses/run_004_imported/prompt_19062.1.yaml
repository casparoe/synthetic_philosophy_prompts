      *   **The Counter-Argument (Resolute Choice):** An agent with intransitive preferences can anticipate the pump. They can adopt a policy: "I will not trade A for B." Even if, at the moment of choice, B looks better than A, they stick to the plan. Thus, they avoid the pump without changing their underlying pairwise preferences.
      *   **The Counter-Counter-Argument (Dynamic Consistency/Regret):** Resolute choice requires overriding local preferences. Is that rational? If you truly prefer B to A *now*, why bind yourself? Also, resolute choice often implies a form of preference over *plans* rather than *outcomes*, which might restore transitivity at a higher level (plans are transitive even if outcomes aren't).
