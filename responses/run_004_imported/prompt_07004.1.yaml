answer: |-
  I was playing poker with my philosophy group last week, and when I reached for a peek at a discard pile, I justified it by citing I. J. Good. "Cost-free information always has non-negative expected value," I told them. "It's a theorem."

  I looked. My opponent saw me look. He raised. I folded.

  He showed his cards—he was bluffing. I had the nuts.

  "Your theorem sucks," he said.

  "No," I said. "Good's theorem assumes you're playing against nature. Nature doesn't update its strategy when you peek. But when you're playing against a mind that reacts to your information acquisition? That's not decision theory anymore. That's signaling."

  "So you folded a winning hand because of game theory?"

  "I folded because the data was free, but the tell cost me the pot. Good guarantees you'll never be worse off in expectation against the universe. He never promised you'd survive a opponent who knows you're Bayesian."
