          2.  He doubts/denies the Pythagorean property applies.
          3.  By Descartes' rule: If I can conceive X without Y, X and Y are distinct.
          4.  Conclusion: He could conclude God can make a right-angled triangle where $a^2 + b^2 \neq c^2$.
      *   *The Problem:* This is mathematically impossible. The Pythagorean property is *essential* to a right-angled triangle. You can't have one without the other, even if you don't *know* they go together.
      *   *Arnauld's Point:* Just because you *think* you have a clear and distinct perception of X without Y doesn't mean they are actually distinct. You might just have an *incomplete* understanding of X.
      *   *The Kicker:* Arnauld asks: How do you know your perception of "Mind" is complete enough to say it excludes "Body," any more than the geometer's perception of "Right Triangle" was complete enough to exclude "Pythagoras"?

