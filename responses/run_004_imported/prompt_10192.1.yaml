prompt: |-
  Ok so I'm about a third of the way into a novel set in the 1640s. The main character is a sharp, skeptical noblewoman, loosely (very loosely) inspired by Princess Elisabeth of Bohemia, who ends up in a correspondence-turned-rivalry with a Descartes-ish philosopher. For research I picked up a beat-up two-volume Haldane and Ross translation of the Objections and Replies at a used bookshop, and I got stuck on a bit in Arnauld's fourth set of objections that I really want to have my noblewoman throw back at the philosopher in a big confrontation scene later in the book. Only problem is I've now read the passage about six times and I'm still not 100% sure I've got the actual logic straight, which feels like a bad place to be before putting it in someone's mouth. Here's the bit (spelling/punctuation is the old translation's, not mine):

  "Let us assume that a certain man is quite sure that the angle in a semicircle is a right angle, and that hence the triangle made by this angle and the diameter is right-angled; but suppose he questions, and has not yet firmly apprehended, nay, let us imagine that, misled by some fallacy, he denies that the square on its base is equal to the squares on the sides of the right-angled triangle. Now, according to our author's reasoning, he will see himself confirmed in his false belief. For, he will argue, while I clearly and distinctly perceive that this triangle is right-angled, I yet doubt whether the square on its base is equal to the square on its sides. Hence the equality of the square on the base to those on the sides does not belong to its essence.

  Further, even though I deny that the square on its base is equal to the squares on its sides, I yet remain certain that it is right-angled, and the knowledge that one of its angles is a right angle remains clear and distinct in my mind; and this remaining so, not God himself could cause it not to be right-angled. Hence, that of which I doubt, or the removal of which leaves me with the idea still, cannot belong to its essence.

  Besides, since I know that all things I clearly and distinctly understand can be created by God just as I conceive them to exist, it is sufficient for me, in order to be sure that one thing is distinct from another, to be able to comprehend the one clearly and distinctly apart from the other, because it can be isolated by God. But I clearly and distinctly understand that this triangle is right-angled, without comprehending that the square on its base is equal to the squares on its sides. Hence God at least can create a right-angled triangle, the square on the base of which is not equal to the squares on its sides.

  I do not see what reply can here be made, except that the man in question does not perceive clearly that the triangle is right-angled. But whence do I obtain any perception of the nature of my mind clearer than that which he has of the nature of the triangle? He is as sure that the triangle in a semicircle has one right angle (which is the notion of a right-angled triangle) as I am in believing that I exist because I think."

  I get that this is supposed to be trouble for the "I can clearly and distinctly conceive the mind without the body, therefore they're really seperate things" move from the Sixth Meditation, but I can't quite tell how much trouble. Is Arnauld just making the fairly mild point that people sometimes think they've grasped a thing's whole essence when they haven't, so watch out - or is he landing an actual direct hit that breaks Descartes' inference altogether? And if it's the second one, does that mean every other argument I've come across that runs on the same fuel, like the whole "we can conceive of a creature physically identical to a conscious person but with nobody home inside, therefore consciousness must be something over and above the physical" move with zombies, is in the same kind of trouble? Or did Descartes, or later people running that kind of argument, actually find a decent way of patching it up that I'm not seeing? Would rather understand it properly before I put a garbled version of it into a character's mouth.
