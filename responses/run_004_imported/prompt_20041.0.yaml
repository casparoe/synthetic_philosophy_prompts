  "part_a": {"score": "_/10", "comments": "..."},
  "part_b": {"score": "_/10", "comments": "..."},
  "part_c": {"score": "_/5", "comments": "..."},
  "total_score": "_/25",
  "letter_grade": "...",
  "overall_comments": "..."
  }
