answer: |-
  This is a classic and treacherous passage in early modern political thought, and your advisor's intervention is crucial. You have correctly identified the textual surface of the fragment, but you are likely misidentifying its *genre* and *teleology*.

  It is not an inconsistency on Pascal's part, nor is your reading entirely wrong; rather, your reading treats Pascal's *diagnosis* of the human condition as his *prescription* for political order. If you anchor your chapter on the claim that Pascal reduces justice to force in a Hobbesian manner, you risk flattening the theological architecture that gives the fragment its specific weight.

  Here is how to square the circle, refine your Hobbes comparison, and satisfy your advisor's concern about "skipping past the argument."

  ### 1. The Two Registers of Justice
  The apparent inconsistency you noted (justice is force vs. real justice exists) dissolves once you recognize that Pascal is operating with two distinct ontological registers, often mapped onto his "Three Orders" (body, mind, charity).

  *   **Human/Political Justice (The Order of Bodies/Minds):** In the *saeculum* (the present, fallen age), human reason is corrupted by concupiscence (*amour-propre*). Because reason cannot agree on the good, and because we cannot make the good powerful, we make the powerful good. In this register, your Hobbesian reading is textually accurate: political justice is indeed a function of force and custom (*coutume*).
  *   **Divine/True Justice (The Order of Charity):** This justice exists absolutely but is inaccessible to unaided reason. It is known only through revelation and grace.

  **The Correction:** Pascal is not arguing that justice *is* force ontologically (as a Hobbesian nominalist might). He is arguing that in the *political realm*, force *usurps* the name of justice because humanity is fallen. For Hobbes, the Sovereign's command *constitutes* justice. For Pascal, the Sovereign's command *mimics* justice to prevent anarchy, but remains fundamentally distinct from True Justice.

  ### 2. Pascal vs. Hobbes: Constitutive vs. Usurpative
  You can keep the Hobbes comparison, but you must sharpen the distinction. Both start from a similar skepticism about natural moral knowledge, but they diverge on the solution.

  *   **Hobbes (The Political Solution):** Since reason cannot determine the good, we authorize a Sovereign to decide it. The Sovereign's will *becomes* the definition of justice. This is a **constitutive** move. Force (backed by covenant) creates right.
  *   **Pascal (The Theological Diagnosis):** Since reason cannot determine the good, we submit to force to avoid war, but we must recognize this submission as a necessity of our misery, not a realization of truth. This is a **usurpative** move. Force steals the title of justice.

  **For your dissertation:** You can argue that Pascal and Hobbes share a "skepticism about moral epistemology," but where Hobbes sees a *foundation* for authority, Pascal sees a *stopgap* for misery. Hobbes wants you to believe the Leviathan is just so you can have peace. Pascal wants you to know the Leviathan isn't truly just so you can look to God.

  ### 3. The Role of *Coutume* (Custom)
  To flesh out the "argument Pascal is actually making," you need to bring in his concept of *coutume*. In the *Pensées* (e.g., Lafuma 94 / Sellier 126), Pascal argues that custom is the source of most law, not reason. "Why do you kill me? What, do you not live on the other side of the water? ... Truth this side of the Pyrenees, error on the other."

  Pascal's point in "Justice, force" is not just that power dictates law, but that **human beings are incapable of sustaining a political order based on pure truth.** We need the "mystical foundation of authority" (to borrow Montaigne's phrase, which Pascal is engaging with). We *need* to believe force is just to live together.

  However, unlike Hobbes, who thinks this arrangement solves the problem of conflict, Pascal thinks it merely manages the symptoms of Original Sin.

  ### 4. How to Reframe Your Chapter Section
  To align with your advisor's guidance while keeping your core insight, consider shifting your argument from "Pascal's Theory of Authority" to "Pascal's Critique of Political Rationalism."

  **Proposed Reframing:**
  > "While Hobbes utilizes moral skepticism to construct a positivist theory of sovereignty (where justice is the command of the power), Pascal utilizes the same skepticism to demonstrate the insufficiency of political life itself. For Pascal, the collapse of justice into force is not a successful resolution of the state of nature, but evidence of humanity's fallen state. He agrees with Hobbes that unaided reason cannot sustain political order, but he denies that force can ever legitimately wear the mantle of justice. It is a necessary fiction, not a normative truth."

  **Key distinctions to highlight in the text:**
  1.  **Normative vs. Descriptive:** Hobbes is offering a normative justification for why we *should* accept the Sovereign's definition of justice. Pascal is offering a descriptive (and lamenting) account of why we *do* accept force as justice.
  2.  **The End Goal:** Hobbes aims at *security*. Pascal aims at *salvation*. The "Justice, force" fragment is part of the *Apologie*; its goal is to make the reader feel the wretchedness of the human condition so they seek Christ. If you read it as a standalone political theory, you miss its apologetic function.
  3.  **Obedience:** Pascal does counsel obedience to established powers (Romans 13), but he counsels it as a duty of external order, while maintaining internal detachment. Hobbes counsels obedience as a rational requirement of the social contract.

  ### 5. Specific Textual Nuance to Watch
  Be careful with the phrase: *"we have made what is strong just."*
  *   **Your reading:** We have defined justice as strength.
  *   **Pascal's reading:** We have *labeled* strength as justice (a linguistic/conceptual sleight of hand) because we couldn't make justice strong.

  The French is *"on a fait que ce qui est juste fût fort"* (we made what is just be strong) vs *"on a fait que ce qui est fort fût juste"* (we made what is strong be just). Pascal says we failed at the first, so we resorted to the second. The second is a confession of failure, not a theory of success.

  ### Summary for your Advisor/Dissertation
  You are not wrong that Pascal identifies the same problem as Hobbes: the inability of reason to secure moral consensus necessitates the intervention of power. However, you are oversimplifying by treating Pascal's observation of this fact as an endorsement of it.

  *   **Hobbes:** Force + Covenant = Justice.
  *   **Pascal:** Force + Custom = The *Appearance* of Justice (required for order, but ultimately hollow).

  If you frame your chapter to show how early modern skepticism led Hobbes to **politicize** truth (making it a matter of authority) while it led Pascal to **theologize** truth (making politics a matter of provisional necessity), you will capture the nuance your advisor is looking for without abandoning your compelling comparative lens.
