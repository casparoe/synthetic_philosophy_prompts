answer: |-
  This is a fantastic angle for an episode. It bridges the gap between "dry" metaphysics and lived human experience, which is exactly where the best philosophy lives. Since your guest is a committed Lewisian, they will try to steer toward the elegance of the system (parsimony, avoiding transworld identity puzzles). Your job is to keep pulling them back to the *costs* of that elegance.

  Here are eight questions designed to corner the view, including the three technical deep-dives you requested with anticipated dodges and follow-ups, closing with your personal stake in the debate.

  ### 1. The Humphrey Objection (Concern)
  **Question:** Kripke's famous objection to Counterpart Theory is that it severs the link between me and my possibilities. If I say, "I could have taken that job," and you say, "No, a *counterpart* of you took that job," it feels like you've changed the subject. Humphrey doesn't care if a lookalike wins the election; he cares if *he* wins. On your view, why should I have any *de se* concern for what happens to a distinct individual who merely resembles me?

  **Anticipated Dodge:** He will likely argue that counterparts aren't just "lookalikes" but are the *representatives* of my possibilities. He'll say modal claims are about the space of possibilities, not literal identity.
  **Follow-up:** "But representation isn't identity. If I watch a movie about a character who made the choice I didn't, I don't grieve their life as *mine*. If the counterpart is numerically distinct from me, why isn't my concern for their success just misplaced altruism rather than genuine modal regret?"

  ### 2. Accidental Intrinsics (Properties)
  **Question:** Lewis rejects Transworld Identity partly because of the "Accidental Intrinsics" argument. He claims that if I exist in two worlds, I'd have contradictory intrinsic properties (bent in one, straight in another), which is impossible. He insists we can't solve this by saying properties are world-indexed relations. But Transworld Identity theorists argue we *do* this with time all the time—I'm bent at *t1* and straight at *t2*. Why is Lewis's move illegitimate when applied to worlds? Why can't the Transworld theorist treat world-indexing exactly like time-indexing?

  **Anticipated Dodge:** He will likely lean on the disanalogy between times and worlds: times are parts of a single spacetime manifold, whereas Lewisian worlds are causally isolated and disjoint concrete entities.
  **Follow-up:** "Granted, the ontology is different. But from the *subject's perspective*, the phenomenological access is the same. I don't experience 'time' differently than I conceive of 'possibility.' If the logical structure of property attribution works for temporal parts, why does positing it for modal parts destroy the 'intrinsic' nature of the property rather than just clarifying it?"

  ### 3. The Similarity Relation (Fission/Ties)
  **Question:** The counterpart relation is grounded in qualitative similarity, not identity. But similarity is a matter of degree and can come in ties. In principle, I could have two equally good counterparts in the same world who disagree on a fundamental choice—one takes the job, one doesn't. If the counterpart relation ties, does the statement "I could have taken the job" become truth-valueless? And if so, doesn't that make modal reality disturbingly vague?

  **Anticipated Dodge:** He will likely argue that vagueness is in our *language* or conceptual scheme, not in the world itself. The counterparts are precise; our selection of which one counts is what's fuzzy.
  **Follow-up:** "But if the truth of the modal claim depends on our selection criteria, then 'what I could have done' isn't a fact about me or the world, it's a fact about our conversational context. Does that mean there's no objective fact of the matter about my own possibilities until we decide how to count similarities?"

  ### 4. Contextualism
  **Question:** Building on that, Lewisians often embrace contextualism about counterparts. In one context, my counterpart is the person who shares my biology; in another, it's the person who shares my psychology. Doesn't this make modal truth dangerously subjective? If I'm on trial for a crime my counterpart committed in another world, can I just shift the context to make them *not* my counterpart and escape responsibility?

  ### 5. Haecceities (Thisness)
  **Question:** A lot of the motivation for Counterpart Theory comes from a rejection of haecceities—primitive "thisness" that makes me *me* across worlds without requiring qualitative similarity. You reject haecceities to keep metaphysics naturalistic. But isn't there a cost to saying that if a being was qualitatively identical to me in every way, but lacked my specific causal history, they literally couldn't be me? Are we buying parsimony at the cost of our intuition about selfhood?

  ### 6. Moral Residue
  **Question:** If Counterpart Theory is true, the person who took the job abroad is not me. They are a distinct concrete particular. So, when I feel regret about the life I'm currently living, am I making a category mistake? Is it coherent to feel envy toward a distinct individual just because they resemble me, or is that an emotional error I should philosophically correct?

  ### 7. Reference and Rigidity
  **Question:** When I use the pronoun "I," Kripkeans say I rigidly designate myself across all possible worlds. On your view, "I" only picks out me in the actual world, and shifts to pick out counterparts in other worlds. Does this mean that when I imagine my future, I am literally not thinking about *myself*? Does Counterpart Theory require us to change how we understand the semantics of first-person thought?

  ### 8. The Personal Question (Grief)
  **Question:** I want to close with something personal. Two years ago, I turned down a life-changing opportunity to stay with a partner, and we broke up anyway. I constantly grieve the version of me who left. But on your view, that person is literally a stranger who shares my memories up to a point. If Counterpart Theory is true, is my grief metaphysically incoherent? Am I mourning a loss that never happened to me, or does the counterpart relation do enough work to make that pain real?
