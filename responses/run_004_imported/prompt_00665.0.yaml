      *   *Angle 2: The Indivisibility of the Weapon.* Anscombe focuses on intention. But what if the *available means* dictate the description? If the only way to hit the HQ is with a weapon that kills everyone, is the intention to kill the HQ (legitimate) or the civilians (illegitimate)?
