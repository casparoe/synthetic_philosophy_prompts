      *   *The War of Attrition:* Game theory models (like the Dollar Auction) explain why rational actors make irrational collective outcomes. Each incremental step looks rational ("If I spend $50k more, I might save the $2M I already spent"), but the sum is disastrous.

  3.  **Address the "Guaranteed Irrational Outcome" Aspect:**
