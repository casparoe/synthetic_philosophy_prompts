          *   Take a clear position on which vote should control going forward.
          *   Address the status of the current applicant (permit already pulled).
          *   Explain reasoning for non-lawyers.
          *   Address the strategic voting concern (colleague's worry about insincere voting).
          *   Acknowledge that no procedure is perfect (if true) but recommend the best option.
          *   Tone: Professional, persuasive, clear, actionable.

  2.  **Deconstruct the Legal/Theoretical Problem:**
      *   **The Doctrinal Paradox:** This occurs when a majority supports the *premises* (findings) required for a conclusion, but a different majority rejects the *conclusion* itself.
      *   **Option A: Conclusion-Based Approach (Direct Vote).** Vote on the application. Findings are just explanatory.
          *   *Pros:* Reflects the actual will of the board on the outcome. Harder to manipulate via technicalities.
          *   *Cons:* Can lead to unreasoned decisions. Doesn't ensure statutory criteria are actually met by a majority.
      *   **Option B: Premise-Based Approach (Findings Vote).** Vote on findings. If findings pass, outcome is automatic.
          *   *Pros:* Ensures statutory requirements are explicitly met by a majority. Promotes transparency of reasoning.
          *   *Cons:* The "Paradox" risk (as seen here). Can lead to outcomes no single majority actually wants. Vulnerable to strategic voting (vote "Yes" on a finding you don't believe in to kill/save the application).
      *   **Legal Context:** In administrative law (Zoning), statutory criteria are usually *jurisdictional*. You *cannot* grant a variance unless the findings are made. Therefore, the findings are logically prior to the conclusion.
      *   **Strategic Voting:** If we use the Premise-Based approach, a member who wants to deny can vote "No" on a finding even if they think it's true, to ensure denial. Or vote "Yes" on a finding they think is false to ensure approval. This undermines the integrity of the record.

  3.  **Determine the Recommendation:**
      *   *Which is better for a Zoning Board?*
      *   Zoning variances are quasi-judicial. They require specific statutory findings. If the findings aren't met, the board lacks the legal authority to grant the variance.
      *   Therefore, the **Premise-Based Approach (Findings Control)** is legally safer *but* needs safeguards against the paradox and strategic voting.
      *   *However*, the specific scenario described (3-2 on Finding A, 3-2 on Finding B, 2-3 on Outcome) creates a legal vulnerability. If the 3 who voted for the outcome don't overlap, is there a "majority of the board" that believes the legal standard is met?
