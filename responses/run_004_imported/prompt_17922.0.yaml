      *   *Re-evaluating based on "Statutory Criteria":* The prompt says the ordinance *conditions* a variance on the board finding these things. This suggests the findings are conditions precedent.
      *   *Best Practice:* The **Conclusion-Based Approach (Direct Vote Controls)** is generally more robust against the Doctrinal Paradox in a deliberative body, *provided* that members are required to articulate their reasoning. However, for Zoning, the "Premise-Based" approach is often preferred to ensure legal compliance.
      *   *Wait, let's look at the "Strategic Voting" constraint:* The prompt asks to take seriously the worry that formalizing a finding-by-finding rule teaches insincere voting.
      *   *Synthesis:* The most defensible position for a public board is that the **Vote on the Application (Conclusion)** controls, *but* members must state which findings they support in their reasoning. If the application fails, it fails. If it passes, the record must show a majority supports the necessary findings *among those voting yes*.
      *   *Actually, the standard legal advice in this specific paradox:* Most administrative law scholars suggest the **Premise-Based** approach is better for rule-of-law reasons (ensuring statutory criteria are met), *but* the **Conclusion-Based** approach is better for democratic legitimacy.
      *   *Decision:* Given the permit is already pulled and the rules were silent, the Board needs stability. The Chair's ruling (Findings Control) aligns with the statutory requirement that findings are *conditions*. However, the paradox reveals a flaw.
      *   *Refined Decision:* I will recommend adopting a **Premise-Based Procedure (Findings Control)** because statutory compliance is paramount in zoning. *However*, I must address the paradox. The solution to the paradox in a 5-member board is to require that the *same* majority that approves the application must also support the necessary findings. Or, simpler: The vote on the application is the binding one, but it is *invalid* if a majority of the *winning coalition* did not agree on the findings.
      *   *Simpler Recommendation for a Memo:* Stick to the **Conclusion-Based Approach (Direct Vote Controls)**. Why? Because the Board's ultimate power is to Grant or Deny. Findings are the *reason*, but the Vote is the *act*. If 3 people vote "No" on the grant, the grant fails. This avoids the "Frankenstein" majority (where Finding A has supporters {1,2,3} and Finding B has supporters {3,4,5}, so no single group of 3 supports the whole package). This directly addresses the colleague's worry about the "binding" vote. It also reduces strategic voting on findings because the findings don't mechanically dictate the outcome.
