answer: |-
  **MEMORANDUM**

  **TO:** Rules Committee, Zoning Board of Appeals
  **FROM:** [Your Name], Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Procedural Recommendation Regarding Voting on Findings vs. Final Disposition

  **I. Purpose**

  The purpose of this memo is to recommend a procedural amendment to clarify how the Board votes when statutory findings and the final decision on an application appear to conflict. As we encountered in last week's hearing, our current silence on this issue creates legal vulnerability and confusion. This memo analyzes the recent voting discrepancy, recommends a specific voting protocol for future hearings, addresses the status of the current applicant, and considers the risk of strategic voting.

  **II. The Problem: The "Doctrinal Paradox"**

  Last week, the Board faced a situation where a majority of members (3 out of 5) voted that the statutory findings were met, yet a different majority (3 out of 5) voted to deny the application. The Chair ruled that the findings controlled, granting the variance. My colleague argued the direct vote on the application should have controlled.

  In political philosophy and legal theory, this is known as the **Doctrinal Paradox** (or Discursive Dilemma). It occurs when a group votes on the *reasons* for a decision separately from the *decision* itself.
  *   **Premise-Based Voting:** We vote on the required findings (e.g., "Is the hardship unique?" "Does it alter the neighborhood?"). If both pass, the application is granted.
  *   **Conclusion-Based Voting:** We vote directly on the application ("Shall the variance be granted?"). The findings are recorded as the reasoning for that vote.

  As we saw, these two methods can produce opposite results. In our case, the "Premise-Based" approach granted the variance; the "Conclusion-Based" approach would have denied it. The paradox arises because the three members who supported Finding A were not the exact same three who supported Finding B. Consequently, there was no single group of three members who supported the *entire package* required to grant the variance, even though each individual requirement passed.

  **III. Recommendation: Conclusion-Based Voting (Application Vote Controls)**

  I recommend that the Rules Committee amend our procedures to adopt a **Conclusion-Based** approach. Specifically:

  1.  **The Vote on the Application is Dispositive:** The binding vote is the motion to Grant or Deny the variance.
  2.  **Findings are Incorporated, Not Separate:** A "Yes" vote on the application constitutes a finding that all statutory criteria are met. A "No" vote constitutes a finding that at least one criterion is not met (or that discretion should be exercised to deny).
  3.  **Record Requirement:** Members voting to grant must articulate on the record which statutory findings they rely upon. The written decision must reflect that a majority of the *granting* members support all necessary findings.

  **Reasoning:**
  *   **Legal Coherence:** This ensures that a single, coherent majority supports the final outcome. It prevents the Board from issuing a decision that no actual majority of members fully endorses.
  *   **Statutory Compliance:** Our ordinance requires us to *find* certain facts before granting. It does not explicitly require a separate *vote* on those facts. By requiring members to state their findings as part of their motion to grant, we satisfy the statutory requirement without creating the mechanical paradox of separate votes.
  *   **Accountability:** It forces members to own the final result. A member cannot vote "Yes" on findings to appear reasonable, then vote "No" on the application to kill the project (or vice versa) without explaining the disconnect.

  **IV. Addressing Strategic Voting**

  My colleague has rightly worried that formalizing a "findings-first" rule encourages insincere voting. If members know that voting "Yes" on a finding mechanically forces a grant, a member who opposes the project might insincerely vote "No" on a finding they believe is true, simply to block the variance.

  Adopting the **Conclusion-Based** recommendation above mitigates this risk. Because the finding votes are no longer mechanical switches that dictate the outcome, members have less incentive to manipulate them. They are free to vote their conscience on the application as a whole. However, we must acknowledge that **no procedure is immune to strategic behavior.** A determined member can always vote insincerely. The goal of procedure is not to eliminate human nature, but to minimize structural incentives to be dishonest. Decoupling the finding votes from the automatic outcome reduces the temptation to treat statutory criteria as tactical levers.

  **V. Status of the Current Applicant**

  We face an immediate issue: the Chair declared the variance granted based on the findings, and the applicant has since pulled a building permit in reliance on that ruling.

  Although I recommend changing the rule for the future, I advise that we **ratify the Chair's ruling in this specific instance.**
  *   **Reliance Interest:** The applicant acted in good faith based on an official ruling by the Chair. Reversing this now could expose the Town to significant liability under principles of equitable estoppel.
  *   **Procedural Silence:** Because our rules did not previously specify which vote controls, the Chair's interpretation was a valid exercise of authority to resolve an ambiguity.
  *   **Prospective Application:** We should clarify that this new voting procedure applies prospectively to hearings scheduled after the adoption of this amendment. This balances fairness to the current applicant with the need for clarity in future cases.

  **VI. Conclusion**

  The Doctrinal Paradox demonstrates that separate votes on findings and outcomes can yield contradictory results. To ensure that every granted variance is supported by a majority that agrees on *both* the facts and the conclusion, the Board should move to a system where the vote on the application controls.

  This approach does not perfectly solve the problem of strategic voting, but it removes the structural flaw that caused our recent deadlock. I recommend we adopt this procedure at the upcoming meeting and issue a formal notice of ratification regarding the recent permit to protect the Town's interests.

  **Action Requested:**
  Please consider adding this procedural amendment to the agenda for the Rules Committee meeting in three weeks. I am available to discuss the drafting of the specific bylaw language.
