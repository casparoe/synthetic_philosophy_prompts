      *   *Best Advice:* Acknowledge the "Doctrinal Paradox." Recommend that the **Vote on the Application** is the binding act, *provided* that the written decision documents that a majority of the *granting* members support each statutory finding. This ensures a coherent majority.
      *   *Actually, let's go with the standard administrative law solution:* **Premise-Based (Findings) Control.** It ensures statutory compliance. The risk of strategic voting is real but manageable through deliberation. The risk of granting a variance without a majority agreeing on the statutory prerequisites is a greater legal liability.
