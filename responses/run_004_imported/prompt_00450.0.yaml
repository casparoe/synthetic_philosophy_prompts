      *   *Key Counter-arguments:*
          1.  Bets $\neq$ Casino Gambling. Bets represent *any* decision under uncertainty.
          2.  Incoherence leads to sure loss in *value*, not just money (e.g., preference reversal).
          3.  The "Shut Up and Multiply" issue: Incoherent beliefs lead to inconsistent planning.
          4.  Epistemic vs. Pragmatic: DBA is often used to argue for epistemic norms, not just pragmatic ones.

