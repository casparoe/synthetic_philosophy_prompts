      *   **The Core Rebuttal:** Explain why "bets" are a metaphor for *actions/choices*.
      *   **Argument 1: The Decision-Theoretic Link.** Every action is a bet against the world.
      *   **Argument 2: Preference Reversal/Inconsistency.** Show how incoherence messes up planning even without money.
      *   **Argument 3: The Epistemic Norm.** DBA is about truth-tracking, not wallet-protecting.
      *   **Conclusion:** Summarize why the friend is technically right but philosophically wrong.

  4.  **Fleshing out the Content (Iterative refinement):**

