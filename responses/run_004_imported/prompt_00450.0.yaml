      *   *Point 1: What is a "bet"?* It's not just poker. It's crossing the street (betting you won't get hit). It's studying for a test (betting it will help). If your probabilities are incoherent, your actions will be self-defeating.
      *   *Point 2: The "Money Pump" aspect.* Even if you don't take external bets, incoherent preferences can lead you to trade A for B, B for C, and C for A, losing value each time. This is internal Dutch Booking.
      *   *Point 3: Planning.* If $P(A) + P(\text{not } A) > 1$, you might over-invest in outcomes that can't both happen. You'll make plans that are impossible to satisfy.
      *   *Point 4: Epistemic Rationality.* The goal of DBA is to show that probability axioms are the *logic of belief*. If you violate them, your beliefs are structurally flawed, regardless of whether anyone exploits them. It's like saying "If I don't do math, it doesn't matter if $2+2=5$." Well, it matters if you want to describe reality accurately.
      *   *Refining the "Refusing to Bet" move:* If you refuse *all* bets, you become inert. You can't act. Action requires weighing probabilities. If those weights are incoherent, the action is irrational.

