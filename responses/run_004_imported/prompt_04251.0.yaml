answer: |-
  This is a fantastic catch. Seriously, bring this up in section. It cuts to the heart of Douglass's shift from the Garrisonian view (Constitution = pro-slavery covenant) to his own independent view (Constitution = anti-slavery weapon).

  You are right to feel the tension there. On the surface, it looks like he says "Ignore what they meant" in paragraph one, and then says "Let's interpret this based on what it's meant to do" in paragraph two.

  However, there is a principled distinction Douglass is drawing between **historical intention** and **legal purpose**. If you can articulate that distinction, you'll nail the discussion. Here is how to untangle it.

  ### 1. The Distinction: Subjective Mind vs. Objective Text
  The key to consistency lies in *where* Douglass says we should look for meaning.

  *   **Passage 1 (Rejecting "Intentions"):** Here, Douglass is rejecting **historical/psychological intentionalism**. He is arguing against looking at the private diaries, secret letters, or closed-door debates of the Framers (like Madison's Notes). He calls these "secret motives" and "dishonest intentions." His point is epistemological: We cannot know what was in George Washington's head, and even if we could, the law is the *written paper*, not the psychic state of the writers. If the text says X, but a Framer secretly hoped it meant Y, the text wins.
  *   **Passage 2 (Adopting "Purpose"):** Here, Douglass is invoking a **legal canon of construction**. This isn't about what the Framers *psychologically wanted*; it's about how a court *must logically read* an ambiguous text to maintain the legitimacy of the law. In common law, there is a presumption that the law does not intend to do evil. Therefore, if the text is ambiguous, the "purpose" isn't the author's hidden desire, but the **objective function of the words in a just legal system.**

  **The Synthesis:** Douglass is consistent because both moves prioritize the **text** over **history**.
  *   Move 1 says: Don't use history to *corrupt* the text (i.e., "The Framers were slaveholders, so the text must be pro-slavery").
  *   Move 2 says: Use legal logic to *protect* the text (i.e., "The text is ambiguous, so we must read it in the only way that makes it a valid, moral law").

  ### 2. Is "Purpose" just "Intention" by another name?
  In modern legal theory, sometimes yes. But in Douglass's 1860 argument, **no.**

  For Douglass, "Intention" is backward-looking (What did they think in 1787?). "Purpose" is forward-looking (What does this law *do* now?).

  When he says "innocent purpose," he is relying on **Natural Law**. He is arguing that slavery is inherently wicked (a violation of natural rights). Therefore, no law can legitimately have the "purpose" of supporting slavery unless it is **explicit**.
  *   If the Constitution doesn't explicitly say "slave," it cannot be interpreted to mean "slave," because that would give the law a "wicked purpose."
  *   This isn't guessing the Framers' minds; it's applying a moral rule to the mechanics of reading.

  ### 3. The "Cherry-Picking" Charge
  Your TA might ask: *"Is Douglass just using whatever tool gets him to abolition?"*

  The honest answer is: **Yes, but that doesn't make it unprincipled.**
  Douglass is a political actor, not a disinterested historian. He admits he wants an anti-slavery reading. But his argument is that this is the *correct* legal way to read *any* constitution in a free society.

  He is essentially arguing: **"If we read the Constitution the way Garrisonians do (looking at the Framers' sins), we destroy the possibility of legal justice. If we read it the way I do (text + presumption of liberty), we save the law and destroy slavery."**

  He isn't contradicting himself; he is shifting the battlefield from **History** (where the pro-slavery side wins, because the Framers compromised) to **Law/Text** (where the anti-slavery side wins, because the word "slave" is absent).

  ### Cheat Sheet for Discussion Section
  If your TA puts you on the spot, here are three bullet points to have ready:

  1.  **Textualism vs. Historicism:** Douglass isn't contradicting himself; he is distinguishing between the *subjective motives of the writers* (which he rejects) and the *objective rules of legal interpretation* (which he accepts). He wants the text to stand on its own, divorced from the moral failings of the Framers.
  2.  **The Presumption of Liberty:** The "innocent purpose" rule isn't about guessing intent; it's a burden of proof. Douglass argues that because slavery is a crime against natural law, the Constitution must be presumed innocent of it unless the text is explicit. Ambiguity must be resolved in favor of liberty.
  3.  **Political Strategy:** This interpretive shift allows Douglass to move from moral suasion (Garrison's "burn the Constitution") to political action ("use the Constitution"). He needs the text to be clean so that abolitionists can work *within* the government rather than outside it.

  **One line you can drop:**
  "Douglass treats the Constitution like a deed or a contract. In contract law, you don't care about the secret thoughts of the signers; you care about the words agreed upon. The 'innocent purpose' rule is just how you read a contract when the wording is fuzzy."

  Good luck tomorrow. This is a high-level read on your part; trust that insight.
