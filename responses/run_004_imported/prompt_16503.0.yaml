      *   **Tone:** Intellectual, probing, suitable for a science/ideas magazine.

  2.  **Deconstruct the Specific Requirements & Draft Questions:**

      *   *Requirement 1: Cornaro vs. Universal Prescriptions.*
          *   Context: In "The Four Great Errors," Nietzsche critiques Cornaro for thinking his diet caused his longevity, when actually his slow metabolism caused both his longevity and his need for a sparse diet. Nietzsche calls this a confusion of cause and effect. Yet, Nietzsche often tells readers *what* to eat/drink.
          *   Draft Question: How do you reconcile Nietzsche's critique of Cornaro (confusing cause/effect regarding metabolism) with his own prescriptive tone?
