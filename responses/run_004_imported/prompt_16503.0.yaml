          *   Follow-up: If it's self-description, why the imperative mood?

      *   *Requirement 2: "Great Health" vs. Rulebook.*
          *   Context: "Great Health" implies resilience, experimentation, overcoming sickness. A rulebook implies restriction and fragility.
