answer: |-
  This is a profound question that sits at the intersection of professional ethics, personal integrity, and the philosophy of moral growth. You are asking whether moral authority requires moral perfection, or whether it requires moral honesty.

  From the perspective of moral philosophy, your past conduct does not disqualify you from speaking, but it fundamentally dictates *how* you must speak. If you approach your colleague as a judge, you are a hypocrite. If you approach him as a reformed peer, you are a witness.

  Here is an analysis of your position and a suggested path forward.

  ### 1. The *Tu Quoque* Trap
  In logic, the *tu quoque* ("you also") fallacy suggests that an argument is invalid if the arguer is inconsistent. However, in ethics, the truth of a moral claim is independent of the moral status of the speaker. That you committed a wrong in the past does not make your colleague's current action right. Authorship guidelines (such as those from the ICMJE) generally require substantial intellectual contribution; "gift authorship" based solely on lab headship is widely considered unethical in modern standards.

  Therefore, you are not disqualified from identifying the error. However, ethics is also about *virtue* and *relationship*. If you confront him without acknowledging your own history, you violate the virtue of humility and invite him to dismiss your critique as self-righteousness.

  ### 2. The Power of Vulnerability
  Your past misconduct is not a liability; it is your strongest rhetorical tool.
  *   **If you hide it:** You are a hypocrite criticizing a sin you secretly share.
  *   **If you reveal it:** You are a mentor sharing a hard-won lesson.

  By admitting, *"I did this for years before I realized it was unjust to the students,"* you remove his ability to defend himself by saying, *"But everyone does it."* You validate that it *was* the norm, while asserting that the norm was wrong. This shifts the conversation from an accusation of current bad character to a discussion on evolving standards and mentorship duties.

  ### 3. The Setting and Method
  A group reunion is a delicate social environment. A public confrontation could cause him to lose face, triggering defensiveness rather than reflection.
  *   **Do not raise this in a group setting.** This would look like grandstanding.
  *   **Seek a private moment.** A quiet coffee or a walk during the reunion.
  *   **Frame it as concern, not censure.** Focus on the students' development and credit, rather than his integrity.

  ### 4. The Unfinished Business (Your Two Students)
  You mentioned you never apologized to the two students you wronged. This is the shadow hanging over your own moral standing. Moral philosophy often distinguishes between *repentance* (stopping the behavior) and *restitution* (repairing the harm). You have achieved the former but not the latter.

  Before or alongside confronting your colleague, you should strongly consider contacting those two former students.
  *   **Why?** It clears your own conscience, but more importantly, it aligns your actions with your new ethical understanding.
  *   **How?** A simple letter or email acknowledging that you realized later in your career that you took credit that wasn't yours, and apologizing for that failure of mentorship.
  *   **The Benefit:** If you do this, your conversation with your colleague gains immense weight. You can say, *"I actually recently reached out to two of my former students to apologize for this very thing. It led me to think about how we credit our trainees..."*

  ### 5. A Proposed Script
  If you decide to speak with him, your moral standing is secure *provided* you own your history. It might sound something like this:

  > "I've been doing a lot of reading on ethics since retiring, and it's forced me to look back at some of my own habits. I realized that early in my career, I put my name on papers where I didn't do the work, just because I was the PI. I stopped twenty years ago, but I never went back to make it right with the students involved.
  >
  > I've noticed you're still listing yourself on the students' papers. I'm not saying this to judge you—I did it too. But I've come to believe it holds them back. I wanted to share that with you privately because I value our friendship, and I know you care about your trainees' success."

  ### Conclusion
  You are in a position to raise this, but only if you strip yourself of the authority of the "virtuous critic" and adopt the authority of the "reformed sinner."

  Your past does not silence you; it obligates you to speak with humility. In fact, because you have seen the error of your ways, you have a duty to prevent the continuation of that practice. Silence now would be a different kind of moral failure: complicity through inaction.

  **Recommendation:**
  1.  **Contact your two former students** and offer an apology. This resolves your internal dissonance.
  2.  **Speak to your colleague privately.** Lead with your own confession.
  3.  **Accept the outcome.** You cannot force him to change. Your duty is to bear witness to the truth as you now understand it, not to control his response.

  This approach honors your new pursuit of moral philosophy by applying it not just to others, but first to yourself.
