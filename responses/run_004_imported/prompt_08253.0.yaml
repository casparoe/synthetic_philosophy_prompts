answer: |-
  Your working theory is not only correct; it is the precise hinge upon which the intellectual history of psychical research turns. You have identified the exact friction point between High Victorian Empiricism (Sidgwick) and American Pragmatism (James).

  Most people assume the Society for Psychical Research (SPR) was a club of gullible believers. In reality, it was founded by some of the toughest minds of the 19th century specifically to apply scientific rigor to claims that science usually ignored. But as you noted, Sidgwick and James brought different philosophical toolkits to the table, which dictated how they processed the ambiguity of the séance room.

  Here is a comparison of their approaches, a verdict on their epistemic stances, and an analysis of the cruel irony of the cross-correspondences.

  ### 1. The Philosophical Motivations: Desperation vs. Expansion

  **Henry Sidgwick: The Ethical Refugee**
  You are spot on about the "Dualism of Practical Reason." In *The Methods of Ethics*, Sidgwick arrives at a devastating conclusion: Rational Egoism (what is best for me) and Rational Benevolence/Utilitarianism (what is best for all) are logically irreconcilable unless there is a cosmic moral order that ensures virtue is eventually rewarded. Without God and immortality, ethics is essentially a trap; the rational thing to do is often to be selfish.

  Sidgwick didn't join the SPR because he loved ghosts; he joined because he needed a *premise*. He was looking for empirical evidence of survival to save ethics from nihilism. This created a tragic tension: he *needed* the phenomena to be real more than almost anyone, yet his commitment to Millian empiricism forced him to be the harshest critic of the evidence. He approached mediums like a cross-examiner in court. If a detail could be explained by cold reading, leakage, or chance, he discarded it. He wanted a "mathematical certainty" of survival, and he never found it.

  **William James: The Radical Empiricist**
  James approached the same data with a different metaphysical baseline. For James, the "Will to Believe" wasn't a license for wishful thinking; it was an epistemological tool for dealing with "genuine options" that cannot be decided on intellectual grounds alone.

  Furthermore, James's "Radical Empiricism" argued that reality includes relations and experiences that materialist science ignores. When he observed Leonora Piper, he wasn't looking for a theological guarantee for ethics. He was looking for anomalies in human consciousness. If a medium knew things they shouldn't, James was willing to expand the boundaries of science to include "telepathy" or "survival" rather than contract the evidence to fit existing materialist laws. He famously described the SPR's work as washing the "dirty linen" of humanity, but he was willing to accept "probability" where Sidgwick demanded "proof."

  ### 2. Handling Ambiguous Evidence

  The divergence is most visible in how they treated the "residuum"—the cases that remained after fraud was stripped away.

  *   **Sidgwick's Filter:** For Sidgwick, ambiguous evidence was effectively negative evidence. If a medium produced a hit that *could* be a lucky guess, it had to be treated as a guess. He feared the "contamination" of science by superstition. His stance was: *Extraordinary claims require extraordinary evidence, and so far, we have only ordinary evidence.*
  *   **James's Filter:** For James, ambiguous evidence was data pointing to a fringe reality. He argued that in the early stages of investigating a new phenomenon (like meteorites or hypnotism), evidence *will* be messy. To demand laboratory perfection on a phenomenon that by nature evades control is to guarantee you never find it. He treated the Piper sittings as establishing a *presumption* of telepathy, shifting the burden of proof onto the skeptic to explain how the knowledge was obtained normally.

  ### 3. The Verdict: Who Had the More Defensible Epistemic Stance?

  This is the hard question. If we judge them by the standards of **scientific integrity**, Sidgwick wins. If we judge them by the standards of **heuristic openness**, James wins.

  However, given what they actually had in front of them, **Sidgwick's stance is the more defensible one.**

  Here is why:
  1.  **The Base Rate of Fraud:** The Victorian spiritualist movement was overwhelmingly fraudulent. Slate writing, trick cabinets, and cold reading were rampant. Sidgwick's ruthless skepticism was a necessary immune response. James's openness, while philosophically rich, occasionally left him vulnerable to charlatans who knew how to exploit his "Will to Believe."
  2.  **The Explanatory Gap:** James was willing to accept "survival" as an explanation for mediums like Piper. However, as the SPR progressed, "Telepathy among the living" (Super-ESP) emerged as a simpler explanation that didn't require the metaphysical baggage of an afterlife. Sidgwick's refusal to jump to the survival hypothesis, even when he wanted it to be true, aligns better with Occam's Razor.
  3.  **The Cost of Error:** Sidgwick recognized that believing in false comforts undermines the very rationality needed to solve ethical problems. James argued that believing in a wider universe enriches life. But epistemically, Sidgwick's refusal to assent without sufficient warrant is the safer position for a truth-seeker. James conflated the *value* of a belief with the *truth* of a belief; Sidgwick kept them ruthlessly separate.

  That said, James's stance was more *productive* for psychology. By taking the phenomena seriously, he helped legitimize the study of the subconscious, dissociation, and altered states. Sidgwick protected the integrity of science, but James expanded the map of the human mind.

  ### 4. The Bonus: The Irony of the Cross-Correspondences

  The posthumous "Cross-Correspondences" are the ultimate punchline to this intellectual drama.

  After Sidgwick, F.W.H. Myers, and Edmund Gurney died, several mediums (who often didn't know each other) began producing scripts that were nonsensical on their own but formed coherent classical allusions when pieced together. The content suggested it was the deceased SPR founders trying to prove survival by creating a puzzle that required their combined intellects to solve.

  **The Epistemic Trap:**
  This creates a profound irony for Sidgwick's legacy. He spent his life demanding clear, unequivocal evidence of survival and died agnostic. His "spirit" then allegedly provided evidence that was:
  1.  Cryptic.
  2.  Dependent on classical scholarship (which living SPR members possessed).
  3.  Impossible to verify conclusively.

  If the Cross-Correspondences were genuine, Sidgwick failed his own test: the evidence was not airtight. If they were fraudulent (or the result of telepathy among the *living* SPR members unconsciously collaborating), they validate Sidgwick's skepticism: even after death, the "evidence" remains ambiguous enough to be explained by natural causes.

  Most modern analysts view the Cross-Correspondences as the high-water mark of the SPR's intellectual effort, but also its *reductio ad absurdum*. They required so much interpretation that they became unfalsifiable. In a way, Sidgwick's ghost (if it was him) finally gave him exactly what he asked for: a complex ethical and epistemological puzzle that refused to yield a definitive answer, keeping him in a state of eternal agnosticism.

  **Summary for your piece:**
  Sidgwick was the tragic figure who needed the afterlife to make sense of his ethics but couldn't lie to himself to find it. James was the optimist who believed the universe was "pluralistic" and messy enough to include ghosts if the experience warranted it. Sidgwick was right to demand more proof; James was right to look where others wouldn't. But in the end, Sidgwick's refusal to be comforted by ambiguity is the sterner, more defensible intellectual posture.
