answer: |-
  **Title:** The Arithmetic of Rescue: Why Taurek is Right About Persons but Wrong About Morals

  The argument you had with your roommate is one of the most enduring stalemates in modern moral philosophy. It centers on John Taurek's 1977 paper, *"Should the Numbers Count?"* Taurek challenges the intuitive assumption that if you can save one person or five, you must save the five. He argues that since there is no "super-person" who experiences the sum of five deaths, the numbers are morally irrelevant. You should flip a coin.

  Your intuition—that letting five die to save one is absurd—is shared by most people. But as you found, articulating *why* Taurek is wrong is difficult because his metaphysical premise is actually quite strong. He is right that groups do not feel pain; only individuals do. However, Taurek makes a critical error in moving from that metaphysical truth to a moral conclusion. By analyzing the responses from Derek Parfit and T.M. Scanlon, we can see that Taurek's coin flip does not protect the separateness of persons; it actually violates it. The verdict must be clear: we are obligated to save the five.

  To understand why, we must first grant Taurek his due. His argument is not merely contrarian; it is a defense of individual equality. Taurek argues that moral loss is always experienced from a specific point of view. For David (the single individual), losing his life is a total catastrophe. For any single member of the group of five, losing their life is also a total catastrophe. There is no entity called "The Group" that suffers a "mega-catastrophe." Therefore, Taurek claims, we cannot say the loss of the five is *greater* than the loss of the one. We can only say it is *wider*.

  If we cannot sum the losses, Taurek argues, the only way to show equal concern for all six people is to give them an equal *chance* of survival. If we automatically save the five, we treat David as if he doesn't matter. If we flip a coin, David has a 50% chance, and the group has a 50% chance. To Taurek, this respects the fact that David's death is just as tragic to him as any single member of the five's death is to them. He accuses the "save the many" crowd of engaging in a mystical aggregation, adding up lives like dollars in a bank account.

  This is where Derek Parfit enters the fray. Parfit acknowledges Taurek's metaphysical point: there is no "group mind." However, Parfit argues that Taurek confuses the *experience* of loss with the *badness* of the outcome. Parfit asks us to adopt an impartial perspective. Even if no single person suffers "five deaths," it is undeniably true that five people will cease to exist instead of one. From the point of view of the universe, or even from a neutral standpoint of benevolence, a world with five fewer people is worse than a world with one fewer.

  Parfit's critique is that Taurek's focus on the individual perspective blinds him to the cumulative reality of the situation. If you accept Taurek's logic, you are forced to admit that there is no reason to prefer saving a million people over saving one, provided you give the one person a 50% chance via a coin flip. This leads to moral paralysis. Parfit argues that we can acknowledge the separateness of persons while still acknowledging that *more* separate persons suffering is a worse state of affairs. The "sum" isn't a feeling in a super-mind; it is a count of distinct tragedies.

  However, Parfit's utilitarian-leaning response doesn't fully satisfy the worry about using individuals. This is where T.M. Scanlon's contractualism provides the knockout blow to Taurek. Scanlon argues that morality is about justifying our actions to others based on principles they could not reasonably reject.

  Imagine you are one of the five. The rescuer decides to flip a coin, and the coin lands on David. You die. Can you reasonably reject the principle that guided this decision? Yes. You can say to the rescuer: "You could have saved me without violating any duty to David." David has a claim to be rescued. You have a claim to be rescued. Your claims are identical in weight. But there are five of you.

  Scanlon introduces the idea of **pairwise comparison**. If we compare David to Person A in the group, their claims are equal. If we compare David to Person B, their claims are equal. But David is only one person. He cannot stand in for the others. When the rescuer flips a coin, they are effectively saying that David's single claim is equal to the *combined* claims of the five. But since the claims are individual, David's one claim is outweighed by the fact that there are five other claims of equal strength pressing on the same decision.

  This exposes the fatal flaw in Taurek's reasoning regarding aggregation. Taurek thinks that "aggregation" means merging five people into one giant victim. That is indeed a mistake. But the alternative to aggregation is not ignoring the numbers; it is **counting claims**.

  When you flip a coin to decide between one person and five, you are not giving everyone an "equal chance." You are giving David a 50% chance of survival, and you are giving each of the five a 10% chance of survival (assuming the 50% for the group is split among them). Taurek claims this treats everyone equally. It does not. It privileges David. It treats David's single interest as weightier than the individual interest of any member of the five, because his single vote cancels out all five of theirs.

  To truly respect the separateness of persons, you must acknowledge that each person has an equal interest in being saved. If you have a resource that can save lives, and you distribute it to minimize the violation of those interests, you must save the greater number. To do otherwise is to tell the five: "Your individual lives count for less than David's, because five of your equal claims are worth only the same as one of his."

  There is a distinction here that is vital for your debate: this is not about *sacrificing* David. In the classic Trolley Problem, we push a fat man to stop the trolley; that uses him as a means. In the drug case, we are simply allocating a rescue resource. David is not being harmed by the rescuer; he is unfortunately not being saved. There is a moral difference between killing one to save five and letting one die to save five. Taurek treats these scenarios as identical. They are not. When we are in the business of rescue, we are not bound to give everyone an equal *outcome* (which is impossible), nor an equal *probability* (which privileges the minority). We are bound to give everyone's interest equal *weight*.

  Weighting interests equally inevitably leads to saving the greater number. If I have two hands and I can prevent two hand-crushings or one, I prevent two. I am not summing the pain into a "super-pain"; I am acknowledging that there are two instances of pain rather than one.

  **The Verdict**

  Taurek is right that there is no group mind, but he is wrong that this prevents us from counting heads. His argument collapses because it conflates the *nature* of loss (which is individual) with the *scale* of loss (which is numerical). By insisting on a coin flip, Taurek does not protect David's dignity; he inflates it. He grants David's single claim the power to veto the equal claims of five other people.

  You should tell your roommate that Taurek's view is logically consistent only if you believe morality is strictly about the relationship between the agent and each individual in isolation. But morality also concerns the state of the world we bring about. We do not need a "super-person" to know that five graves are worse than one. We just need to recognize that while persons are separate, their claims are comparable. When five equal claims stand against one, the only way to respect the equality of all six is to honor the majority. Save the five. Flip the coin only if the numbers are equal. Anything else is not humility; it is mathematical negligence.
