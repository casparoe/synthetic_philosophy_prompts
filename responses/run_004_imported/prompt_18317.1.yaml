prompt: |-
  okay so me and my roommate got into it for like two hours last night over that classic thought experiment where you've got one dose of a drug that can save one guy (some philosophers call him David) or a totally different group of five, and whoever doesn't get it dies, no way to split it. she kept bringing up this guy Taurek who apparently argued the numbers literally shouldn't matter and you should just flip a coin, becuase you can't add up five different people's deaths into one bigger loss the way you'd add up five dollars. I said thats insane, flipping a coin means the five extra deaths count for literally nothing, but honestly I couldn't pin down the actual flaw in his reasoning about aggregation and the separateness of persons. can you write an essay that takes Taurek's argument seriously on its own terms instead of strawmanning it, gets into how people like Parfit and Scanlon tried to push back on him, and then actually commits to a real verdict instead of just concluding "both sides have good points"?
