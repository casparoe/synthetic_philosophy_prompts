          *   *Correction on Temkin:* Temkin argues that "all things considered better than" is not transitive. $A$ is better than $B$, $B$ is better than $C$... but $A$ is not necessarily better than $Z$. This allows us to say Torture is worse than a slightly less torture, ..., slightly worse than specks, BUT Torture is *not* worse than many specks. Wait, that supports Aggregation.
          *   *Let's re-read Temkin's position carefully:* Temkin uses the spectrum to show that if we hold transitivity + no arbitrary cutoffs + aggregation, we get counterintuitive results (The Repugnant Conclusion style). He suggests we might have to give up transitivity to maintain the intuition that some harms are lexically superior.
          *   *My Argument:* I will maintain the intuition that Torture is lexically worse. To do this without falling into Norcross's trap, I must deny that the "worse than" relation is transitive across the qualitative gap.
      *   **Body Paragraph 3: Defending Intransitivity (The Cost):**
          *   Acknowledge this is a high cost (logic usually demands transitivity).
