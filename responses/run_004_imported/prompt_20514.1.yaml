      *   *Deontological/Rights View:* Torture violates rights/dignity. Specks are minor annoyances. Verdict: Specks are worse (choose torture to avoid mass violation, or simply refuse to torture).
      *   *Norcross's Argument (The Continuum):* If you say torture is worse than specks, what about a slightly less severe torture? And slightly less? Eventually, you get to a headache. If you accept transitivity and no arbitrary cutoffs, you must admit enough small harms outweigh one large harm. This supports aggregation.
      *   *Temkin's Argument (The Intransitivity Challenge):* If you follow the spectrum, you might end up with $A > B$, $B > C$, ... $Y > Z$, but intuitively $Z$ (specks) is *not* worse than $A$ (torture). If $A > B > ... > Z$, then $A > Z$. But if we feel $Z \ngtr A$, we have a cycle or intransitivity. Temkin suggests "all things considered better than" might not be transitive.

  3.  **Determine the Stance:**
