      *   *Is "Old Evidence" the only angle?* There's also the distinction between *context of discovery* vs. *context of justification*. The data belongs to discovery, the theory to justification. But POE is the stronger fit.
      *   *Avoid overly technical Bayesian math:* Keep it conceptual. The user is in "introductory epistemology," so don't drown them in Bayes' Theorem derivations unless necessary for clarity.
      *   *Make sure to answer the specific question:* "Was my colleague right... and what exactly is happening?"

  7.  **Final Polish:** (Reviewing the generated response against the thought process.)
