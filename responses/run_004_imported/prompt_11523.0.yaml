answer: |-
  Two superrationalists are arrested for a crime and placed in separate interrogation rooms. The detective enters Room A and sits down across from Prisoner 1.

  "Here's the deal," the detective says. "If you confess and your partner stays silent, you go free. If you both stay silent, you each get a year. If you both confess, you each get five years. If you stay silent and he confesses, you get ten."

  Prisoner 1 smiles. "We'll both stay silent."

  The detective leans in. "Look, I just came from Room B. Your partner confessed. He's signing the paper right now. You should too."

  Prisoner 1 shakes his head. "That's logically impossible."

  "I'm holding his confession!"

  "If he confessed, I would have confessed," Prisoner 1 says calmly. "We are identical reasoners facing identical information. Our outputs must match. Since I know I haven't confessed, he hasn't either. You're holding a forgery."

  The detective slams the paper on the table. "He's walking out the door as we speak!"

  "Then I must be walking out the door too," Prisoner 1 says, remaining firmly seated. "But I'm not. Therefore, he isn't. Your evidence contradicts the symmetry of our reasoning. I trust the math more than my eyes."

  The detective sighs, walks out, and goes to Room B. Prisoner 2 is sitting there, silent.

  "Did he buy it?" Prisoner 2 asks.

  "He thinks you're a hallucination," the detective says. "He refuses to believe you confessed because he knows he didn't."

  "Good," says Prisoner 2. "As long as he thinks we're symmetric, he won't rat me out."

  The detective pauses. "But you *did* rat him out. You signed the paper five minutes ago."

  Prisoner 2 shakes his head. "No, I didn't. Because if I did, he would have too. And he's still in there. So I didn't."

  The detective looks at the signed confession in his hand, looks at Prisoner 2, and slowly tears it up. "I hate this job."
