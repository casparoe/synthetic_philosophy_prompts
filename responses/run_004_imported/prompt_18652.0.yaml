prompt: |-
  I cover science and ideas for a mid-size outlet, and along with the actual reporting I sit on the internal committee that writes our editorial standards -- sourcing rules, corrections policy, that sort of thing. We hit a real snag last month that I think needs an actual standing policy rather than a one-off ruling, so I volunteered to draft something for the committee to argue over, and I'm hoping you can help me think it through before I do.

  Here's the case that started it. Our two most experienced health reporters were each given the same pile of recent studies on moderate drinking and heart disease -- same cohort studies, same meta-analyses, same newer genetic studies pushing back on the old "a glass of wine a day is good for you" findings -- and they came back with opposite framings. One wants to lead with "the case for any cardiovascular benefit has basically collapsed," the other thinks that overreads the new evidence and wants to lead with "the picture is still genuinely contested." Neither can point to an actual mistake in the other's reasoning; both are equally careful, equally experienced, and nobody on staff has some known edge in reading this particular literature. They've just weighed the same studies differently. This isn't really a sourcing or legal problem (our lawyers are fine either way), and it's happened on other beats before and will again, so what we actually need is a rule.

  About half the committee wants a policy that says: when this happens and there's no real asymmetry between the reporters, the desk pushes them toward a hedged, split-the-difference framing rather than letting either one's confidence carry the day. The other half thinks that's cowardice dressed up as balance, and that an editor should just back whichever framing holds up better under questioning, even if that means overruling a reporter who is, by every measure we have, just as reliable as the one getting sided with. Could you draft the memo I'd bring to committee -- something that actually lands somewhere, with a rule the desk could apply on deadline rather than "use good judgement," and that gives whichever side ends up loosing a fair hearing rather than a strawman? I keep flip-flopping on this myself, so don't just tell me what I want to hear.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Science/Ideas reporter and member of the editorial standards committee at a mid-size outlet.
      *   **The Problem:** Two equally experienced reporters interpret the same body of evidence (specifically regarding moderate drinking and heart disease) differently. One says "benefit collapsed," the other says "still contested." Neither is factually wrong; they differ in *weighting* and *framing*.
      *   **The Conflict:** The committee is split.
          *   Side A: Default to hedged/split-the-difference framing (safety/balance).
          *   Side B: Editor picks a side based on argument strength (clarity/conviction), even if it overrules a reliable reporter.
      *   **The Goal:** A draft memo for the committee that proposes a standing policy. It needs to:
          *   Land somewhere in the middle (not just "use good judgment").
          *   Be actionable on deadline.
          *   Give the losing side a fair hearing (process-oriented).
          *   Avoid strawmanning either committee faction.
          *   Acknowledge the complexity (science isn't always binary).

  2.  **Deconstruct the Core Issue:**
      *   This isn't about *facts* (e.g., did the study say X?). It's about *consensus* and *certainty*.
      *   Side A (Hedging) risks "false balance" (giving equal weight to unequal evidence) or "mushy middle" (telling readers nothing useful).
      *   Side B (Decisiveness) risks editorial overreach or suppressing valid scientific uncertainty.
      *   The solution needs to distinguish between *scientific uncertainty* (the data is actually messy) and *interpretive uncertainty* (reporters disagree on what the messy data means).

  3.  **Determine the Policy Stance:**
      *   A pure "split the difference" rule is bad science journalism (false equivalence).
      *   A pure "editor decides" rule is risky without guardrails (subjective).
      *   *Best Approach:* A tiered decision tree based on the state of the literature, not just reporter preference. The policy should prioritize *characterizing the consensus* over *picking a winner*.
      *   *Key Mechanism:* If reporters disagree, the tiebreaker isn't the Editor's gut, but an external check on the *state of the field*.
      *   *Secondary Mechanism:* If the field is genuinely unsettled, the headline/lead must reflect the *range* of confidence, not just pick one pole.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Context/Preamble:** Acknowledge the specific incident (drinking study) without naming names. Validate that this is a structural issue, not a performance issue.
      *   **The Problem Definition:** Distinguish between factual disputes and interpretive weighting.
      *   **Proposed Policy (The "Meat"):**
          *   Need a clear workflow.
          *   Step 1: Verify facts (already done).
          *   Step 2: Assess the field (is there a consensus?).
          *   Step 3: The Tiebreaker (if reporters disagree, look outside).
          *   Step 4: Framing rules (how to write about uncertainty).
      *   **Rationale:** Explain *why* this solves both Side A and Side B's concerns.
          *   Side A gets protection against overconfidence.
          *   Side B gets protection against false balance.
      *   **Implementation:** How to handle the "losing" reporter (respectful process).

  5.  **Refining the Policy (Self-Correction during drafting):**
      *   *Initial thought:* Maybe suggest bringing in an external expert every time.
      *   *Correction:* Too slow for deadline. Need a faster heuristic.
      *   *Revised:* Use "consensus indicators" (guidelines, major reviews, position statements). If those exist, follow them. If not, acknowledge uncertainty.
      *   *Addressing the "Editor Decides" fear:* The editor shouldn't decide based on who argues better, but on which framing aligns with the external consensus indicators.
      *   *Addressing the "Hedging" fear:* Hedging is only required if the literature is actually contested. If the literature is settled, don't hedge just because one reporter is cautious.

  6.  **Tone Check:**
      *   Needs to be professional, collaborative, but decisive.
      *   Avoid jargon where possible.
      *   Show empathy for both reporters (they are both right in a way).
      *   Show respect for the committee's division.

  7.  **Final Polish:**
      *   Make sure the "Decision Tree" is clear.
      *   Ensure the "Fair Hearing" aspect is included (the overruled reporter gets to ensure their caveats are in the text, even if the headline is decisive).
      *   Title: Needs to be specific. "Interpretive Divergence Policy."

  8.  **Review against constraints:**
      *   *Actionable on deadline?* Yes, the checklist is quick.
      *   *Fair to losing side?* Yes, caveats must remain.
      *   *Avoids "good judgment"?* Yes, provides specific criteria.
      *   *Addresses both committee factions?* Yes, by reframing the choice from "Hedge vs. Pick" to "Match the Consensus."

  9.  *(Self-Correction post-drafting)*: I need to make sure I don't sound like I'm solving the science. I'm solving the *editorial process*. The memo should focus on how we determine the narrative, not the medical advice itself.

  10. **Finalizing the Output:** (Proceed to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Editorial Standards Committee
  **FROM:** [Your Name], Science & Ideas Desk
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Policy on Interpretive Divergence in Scientific Reporting

  ### 1. Context and Purpose

  Last month, two senior reporters produced divergent narratives from the same body of evidence regarding moderate alcohol consumption and cardiovascular health. One framed the findings as a collapse of previous benefits; the other framed them as an ongoing contest. Both pieces were factually accurate, sourced rigorously, and legally vetted. The divergence was not in *what* the studies said, but in the *weight* assigned to conflicting signals within the literature.

  This is not an isolated incident. As our coverage increasingly deals with evolving science (nutrition, epidemiology, climate adaptation, AI safety), we will face "interpretive divergence" where reasonable journalists weigh the same evidence differently.

  Currently, we have no standard for resolving this. The committee is divided between defaulting to hedged framing (to avoid overconfidence) and empowering editors to select the stronger argument (to avoid false balance). This memo proposes a standing policy to resolve these deadlocks on deadline, ensuring consistency without sacrificing nuance.

  ### 2. The Core Principle: Match the Consensus, Not the Confidence

  The choice should not be between "Reporter A's Confidence" vs. "Reporter B's Caution." The choice must be between "The Story" and "The State of the Field."

  Our standard should be **Calibrated Certainty.** The framing of the piece (particularly headlines and ledes) must reflect the actual level of consensus in the relevant scientific community, not the confidence level of the individual reporter or the preference of the editor.

  ### 3. Proposed Policy: The Interpretive Divergence Protocol

  When two editors or reporters disagree on the framing of a scientific story, and no factual errors are present, the following decision tree applies.

  **Step 1: The Consensus Check (Deadline: +2 Hours)**
  Before an editor overrules a reporter based on argumentative strength, we must verify the state of the field. The desk will identify three external indicators of consensus:
  *   Are there existing systematic reviews or meta-analyses from the last 24 months?
  *   Do major relevant bodies (e.g., AHA, CDC, NAS) have current position statements?
  *   Is there a clear majority view in recent coverage by specialist outlets (e.g., *Stat*, *Nature News*, *Science*)?

  **Step 2: Alignment**
  *   **If Consensus Exists:** The framing must align with the consensus position, even if it contradicts one reporter's reading.
      *   *Example:* If major health bodies say evidence is "insufficient," we cannot headline "Benefits Collapsed." We must headline "Evidence Insufficient."
      *   *Resolution:* The reporter favoring the decisive frame must incorporate the consensus caveats. The reporter favoring the cautious frame is vindicated.
  *   **If Consensus Does Not Exist (Genuine Contention):** The framing must explicitly signal the contention.
      *   *Resolution:* We reject the "Split-the-Difference" mush (e.g., "Some say good, some say bad"). Instead, we use "Range of Confidence" framing (e.g., "New Data Complicates Old Advice," or "Debate Intensifies Over...").
      *   *Constraint:* We do not allow a definitive claim (e.g., "Wine is Safe") when the field is split. We allow a definitive description of the split (e.g., "Experts Divided").

  **Step 3: The Editor's Tiebreaker**
  If the Consensus Check is inconclusive (e.g., the science is too new for guidelines), the Senior Editor on duty makes the final call. However, this call is bound by **The Caveat Preservation Rule**:
  *   If the Editor selects the more decisive framing, the losing reporter's key caveats *must* remain in the top 50% of the story.
  *   If the Editor selects the more cautious framing, the losing reporter's strongest evidence for a trend *must* be prominently featured, not buried as a "some might say."

  ### 4. Rationale

  **For the "Decisiveness" Faction:**
  This policy prevents "false balance." If the literature has moved decisively (as with the alcohol example), the Consensus Check will reveal that guidelines have shifted. We do not hedge just to be safe; we hedge only as much as the field hedges. It empowers editors to make a call, but grounds that call in external verification rather than internal debate.

  **For the "Caution" Faction:**
  This policy prevents overreach. A reporter cannot claim a "collapse" or a "breakthrough" if the broader field is still sitting on the fence. It institutionalizes humility without requiring mushy writing. It ensures that when we are decisive, it is because the science allows it, not because a reporter argued well.

  **For the Reporters:**
  This removes the personal element. A reporter is not "overruled" because their editor disagreed; they are aligned because the external indicators pointed elsewhere. The Caveat Preservation Rule ensures their work is not gutted, maintaining morale and intellectual integrity.

  ### 5. Implementation & Trial

  I propose we adopt this as a **Six-Month Interim Standard**.

  *   **Workflow:** Editors must document the "Consensus Check" sources in the story's internal notes when this protocol is triggered.
  *   **Review:** In six months, we will review cases where this was applied to see if it slowed production or resulted in more accurate corrections.

  ### 6. Recommendation

  I recommend the committee adopt this protocol. It moves us away from a binary choice between "cowardly hedging" and "editorial fiat." It forces us to do the reporting on the *state of the science* before we write the *story about the science.*

  Please review the decision tree above. I am specifically looking for feedback on whether the "Consensus Check" indicators are feasible on our typical deadlines.

  ***

  ### Notes for the Committee Discussion (Mental Prep for You)

  *   **Anticipate the "Too Slow" Objection:** Some will say checking three external indicators takes too long. *Counter:* If you can't check three sources in 2 hours, you don't have enough info to write a definitive piece anyway. In that case, the default *must* be caution.
  *   **Anticipate the "Stifles Innovation" Objection:** Some will say this prevents us from breaking news before guidelines change. *Counter:* This policy applies to *interpretive divergence*, not breaking news. If we have an exclusive study, that's different. This is for when we are synthesizing existing piles of research.
  *   **The "Losing" Reporter:** Emphasize that the Caveat Preservation Rule is crucial. It ensures the losing reporter doesn't feel their expertise was ignored, just contextualized.

  This draft attempts to give you a procedural shield. It makes the policy about *process* (checking consensus) rather than *personnel* (who argued better), which should lower the temperature in the room while giving you a concrete tool for the next deadline.
