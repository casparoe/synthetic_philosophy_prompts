      *   **The Math:** Briefly confirm the EV is positive (+\$100).
      *   **The Friend's Point (Rabin's Paradox):** Explain *why* the friend thinks this (Expected Utility Theory). Explain the "absurd conclusion" (rejecting massive bets).
      *   **The Defense (Why the user is rational):**
