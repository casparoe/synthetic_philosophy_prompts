prompt: |-
  A friend recently offered me a simple bet: on a coin flip, I would lose $500 if it landed heads but win $700 if it landed tails. I turned it down, even though I recognized that taking the bet was the smarter move on average, because risking that much money on a single flip made me uneasy. My friend called this inconsistent, since I contribute part of every paycheck to a stock index fund without hesitation, and he argued that the same reasoning, applied consistently, would force me to also turn down much larger bets, even ones so favorable that refusing them would seem absurd. I haven't found a good way to counter that argument, but something about it still doesn't sit right with me. Was I really being irrational, or is there a coherent way to defend my decision?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Dilemma:**
      *   **The Bet:** 50/50 coin flip. Lose \$500 (Heads), Win \$700 (Tails).
      *   **Expected Value (EV):** $(0.5 \times -500) + (0.5 \times 700) = -250 + 350 = +\$100$.
      *   **User's Decision:** Turned it down.
      *   **Reasoning:** Risk aversion regarding a single event ("uneasy").
      *   **Friend's Counter-argument:** Inconsistency. The user invests in stock index funds (risky assets) regularly. If the logic holds, the user should reject *any* bet with positive EV, even absurdly good ones (Rabin's Paradox).
      *   **User's Feeling:** Something doesn't sit right, but can't articulate why. Wants to know if they were irrational or if there's a coherent defense.

  2.  **Identify the Core Concepts:**
      *   **Expected Value (EV):** The mathematical average outcome.
      *   **Risk Aversion:** Preference for certainty over uncertainty with the same EV.
      *   **Utility Theory:** Diminishing marginal utility of wealth (Bernoulli).
      *   **Rabin's Paradox (Calibration Theorem):** A specific economic theorem stating that if you reject a small positive EV bet due to risk aversion, you must logically reject huge positive EV bets if you apply the same utility function globally.
      *   **Mental Accounting/Myopic Loss Aversion:** How people actually behave vs. how models say they should.
      *   **Time Horizon & Diversification:** Stocks vs. a single coin flip.
      *   **Ergodicity:** Ensemble average vs. time average.

  3.  **Evaluate the Friend's Argument (Rabin's Paradox):**
      *   The friend is essentially citing Matthew Rabin's 2000 paper.
      *   *The Logic:* If a utility function is concave enough to reject a 50/50 lose \$500/win \$700 bet at *any* wealth level, it implies absurd risk aversion for larger stakes (e.g., rejecting a 50/50 lose \$1000/win \$1,000,000 bet).
      *   *The Flaw:* The assumption that risk aversion is constant across all wealth levels or that the utility function is smooth and global. People treat "play money" or "single event risk" differently than "lifetime wealth."

  4.  **Evaluate the User's Intuition:**
      *   The user feels uneasy about a *single* binary outcome.
      *   The user invests in stocks, which are *repeated* gambles with *diversified* risk over a *long* time horizon.
      *   This suggests the distinction isn't just about EV, but about the *structure* of the risk.

  5.  **Develop Counter-Arguments/Defenses:**

      *   *Argument 1: Ergodicity (The strongest mathematical defense).*
          *   Stocks: You participate in the *time average*. Over 30 years, the volatility smooths out. You get the compound return.
          *   Coin Flip: You only get one shot. You are stuck with the *ensemble average* of one trial.
          *   *Key Insight:* It's not irrational to prefer a repeated game over a one-off game, even if the one-off has positive EV.

      *   *Argument 2: Mental Accounting & Context.*
          *   Investment money is "long-term wealth." The \$500 bet is likely from "spending money" or liquid cash.
          *   Losing \$500 *now* might have a higher utility cost (missed rent, stress) than the abstract gain of \$700.
          *   Stocks are diversified. This bet is idiosyncratic risk.

      *   *Argument 3: Rabin's Paradox Limitations.*
          *   The friend's argument relies on the assumption that the user's risk aversion applies *globally* to all wealth.
          *   In reality, risk aversion is local. We are more risk-averse with immediate losses than with long-term portfolio fluctuations.
          *   The "absurd" conclusion the friend mentions is actually a known paradox in economics, suggesting the *model* (expected utility theory) might be flawed, not the human.

      *   *Argument 4: Transaction Costs & Opportunity Cost (Minor but valid).*
          *   Emotional energy spent worrying about the flip has a cost.
          *   Stocks don't require active worry after setting up the auto-invest.

  6.  **Structure the Response:**
