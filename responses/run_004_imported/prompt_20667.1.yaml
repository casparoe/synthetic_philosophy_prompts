  I've been chewing on a wrinkle in the two-envelope paradox that I haven't seen addressed in any of the explanations I've come across online or in the puzzle books I've read. I already follow the standard resolution of the basic version: the "switching always has higher expected value" argument secretly assumes that every possible dollar amount in your envelope is equally likely, and since there's no genuine probability distribution that spreads itself out evenly over every amount from zero to infinity, that argument is really just an artifact of an incoherent assumption rather than a real flaw in decision theory. That part I've made peace with.

  What I can't work out on my own is what happens once you swap out that incoherent "uniform over everything" assumption for an actual, honest probability distribution over how much money is in the smaller of the two envelopes -- one whose probabilities are perfectly ordinary numbers that really do add up to one. Could you construct a specific example of such a distribution, with real numbers or a formula I could compute by hand, under which switching envelopes has a higher expected value than staying no matter which amount you actually find when you open yours? Please don't just assert that this is possible -- walk through the arithmetic for at least three or four different amounts you might observe, so I can see for myself that the conclusion holds every time and isn't secretly just true "on average" in a way that hides exceptions.

  If it does turn out to be possible, I'd love your help making sense of it conceptually, because it seems to just resurrect the original paradox in a subtler form: the two envelopes are symmetric before either one is opened, so how can a perfectly legitimate probability distribution ever justify a blanket rule like "switch no matter what you see"? Does constructing such a distribution force some kind of strange conclusion about how much money you should expect to be riding on the whole game in the first place? I have a nagging feeling this connects to that other paradox involving a casino game where the prize keeps doubling as long as a coin keeps landing on heads, but I've never been able to pin down why.
