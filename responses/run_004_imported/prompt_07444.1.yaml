answer: |-
  **MEMORANDUM**

  **TO:** Clinical Policy Committee
  **FROM:** [Your Name], Data & Outcomes
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Universal PGD Screening Implementation

  ### **Executive Summary & Bottom Line**

  **Recommendation:** **Adopt a Modified, Phased Implementation.**
  I recommend we **do not** proceed with the proposed *universal* Prolonged Grief Disorder (PGD) screener at initial intake for all family members. Instead, we should adopt a **two-stage protocol**: (1) a brief *risk-factor* assessment at intake for all, followed by (2) a targeted PGD criteria screener only for those exhibiting high risk or self-identifying distress at the 12-month mark.

  **Timeframe:** Implement this modified protocol as a **12-month pilot**, with a mandatory data review scheduled for next October to assess both clinical outcomes and potential iatrogenic effects before making the policy permanent.

  **Rationale:** While the clinical intent (earlier access to evidence-based treatment) is sound, a universal diagnostic screener applied at intake carries a specific, documented risk of altering the very phenomenon we are measuring. We must balance the benefit of identification against the risk of "category-induced pathology."

  ---

  ### **1. The Clinical Case for Screening (Steel-Manning)**

  The Bereavement Team's proposal rests on strong clinical grounds that this committee respects and validates:

  *   **Diagnostic Validity:** PGD is now a recognized condition in the DSM-5-TR and ICD-11. It is distinct from depression and typical grief, characterized by persistent yearning, identity disruption, and functional impairment lasting beyond 12 months.
  *   **Treatment Efficacy:** We have evidence-based interventions (e.g., Complicated Grief Treatment) that show superior outcomes for PGD compared to standard supportive counseling.
  *   **Stigma Reduction:** Naming the experience can validate suffering. For families struggling in isolation, knowing there is a name for their pain and a specific treatment for it can be relieving rather than pathologizing.
  *   **Triage Efficiency:** Currently, we rely on ad-hoc identification. A standardized screener ensures equity; a quiet sufferer is less likely to fall through the cracks if a systematic net is cast.

  These points are correct. Ignoring the DSM-5-TR update would be clinically negligent. However, *how* we screen matters as much as *if* we screen.

  ---

  ### **2. The Risk Analysis: Looping Effects vs. Goodhart's Law**

  In our previous discussions, concerns were raised that creating a "checkbox" for grief might manufacture pathology. It is vital to distinguish this from the more common concern of metric gaming.

  *   **Goodhart's Law (Metric Gaming):** This occurs when a measure becomes a target, and people game the system to hit the target. *Example:* If reimbursement depends on a PGD code, clinicians might over-diagnose to secure funding. This is a financial/administrative distortion.
  *   **Hacking's Looping Effects (Ontological Shift):** This is the deeper concern. Philosopher Ian Hacking described "interactive kinds"—classifications of people that interact with the people classified. When we label a human experience, people become aware of the label and change their behavior or self-narrative to align with (or resist) it.
      *   **The Specific Risk:** If we universally screen for a "12-month disorder" at *intake* (day one of bereavement), we implicitly teach the bereaved that there is a "correct" timeline for grief.
      *   **The Consequence:** A family member might anchor on the 12-month deadline. At month 13, rather than experiencing a natural fluctuation in grief, they may interpret their pain as "failure to heal" or "symptoms of disorder." This anxiety can *increase* impairment, thereby making the diagnosis more likely to be true. We risk creating a self-fulfilling prophecy where the screener does not just detect PGD, but cultivates the conditions for it.

  This is not theoretical. Similar effects have been observed in the expansion of PTSD and ADHD criteria, where increased awareness led to increased reporting that outpaced prevalence changes. In hospice, where trust and narrative are central, we must avoid becoming the arbiter of "normal" mourning.

  ---

  ### **3. Proposed Modified Protocol**

  To capture the clinical benefits while mitigating the looping risk, I propose the following adjustments to the original proposal:

  **A. Intake (Days 1–30): Screen for Risk, Not Disorder**
  *   **Action:** Do not administer the PGD diagnostic screener at intake. It is clinically premature (criteria require 12 months duration) and primes the "timeline anxiety."
  *   **Alternative:** Use a brief *Risk Factor Inventory* (e.g., history of mental health conditions, traumatic nature of death, lack of social support).
  *   **Goal:** Identify who needs *proactive support*, not who has a disorder.

  **B. The 12-Month Check-In: Reframe the Trigger**
  *   **Action:** For high-risk cases (identified in Step A) or those who self-refer, administer the PGD screener at the 12-month mark.
  *   **Framing:** Change the patient-facing language. Instead of "Screening for Prolonged Grief *Disorder*," frame it as a "12-Month Grief Support Check-In."
  *   **Safeguard:** A positive screener result does not equal a diagnosis. It triggers a *clinical conversation*, not an automatic code. The clinician must assess cultural context and functional impairment before applying the label.

  **C. Data Safeguards (Outcomes Team Commitment)**
  *   We will track not just PGD prevalence, but **help-seeking latency** and **retention rates**.
  *   **Crucial Metric:** We will monitor the rate of "screen positives" who decline further assessment. A high decline rate may indicate resistance to the label (a sign of looping/stigma).

  ---

  ### **4. Implementation Timeframe**

  *   **November 1 – December 31:** Training for bereavement staff on the distinction between *risk screening* and *diagnostic screening*, including language guidelines to minimize "deadline anchoring."
  *   **January 1:** Launch Modified Protocol (Pilot).
  *   **October 1 (Next Year):** Mandatory Committee Review.
      *   *Decision Point:* We will review the prevalence data against national baselines. If our PGD rates are statistically anomalous (e.g., significantly higher than community norms without corresponding functional impairment), we will pause to investigate whether our screening process is inflating the category.

  ---

  ### **5. Conclusion**

  We have an ethical obligation to treat suffering that falls outside the bounds of typical mourning. PGD is real, and our families deserve access to treatment. However, as a hospice, our primary tool is not just medicine, but *meaning*.

  By moving from a **Universal Diagnostic Screener** to a **Targeted Risk & Support Model**, we protect the integrity of the grieving process while still catching those who need clinical intervention. We avoid teaching our families that their grief has an expiration date, while ensuring that if that date passes and they are still suffering, we are ready to help.

  I move we adopt the Modified Protocol as a 12-month pilot.

  **Attachments:**
  *   *Draft: Risk Factor Inventory vs. PGD Screener Comparison*
  *   *Summary of DSM-5-TR PGD Criteria & Timing Constraints*
