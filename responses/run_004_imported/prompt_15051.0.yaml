      *   *Strict Propriety:* A scoring rule is strictly proper if expected inaccuracy is minimized *only* when reporting one's true credence. This is crucial for the dominance argument.
      *   *Bregman Divergences:* The class of scoring rules that work are essentially Bregman divergences (of which Brier score is a special case).
