answer: |-
  This is a fantastic rabbit hole to have gone down. You have correctly identified the central tension in the "Accuracy-First" program: the move from Dutch Book (pragmatic inconsistency) to Accuracy (epistemic inconsistency) buys you philosophical purity, but it costs you mathematical robustness unless you are extremely careful about how you define "accuracy."

  You are right on the money regarding the history: Joyce's 1998 argument was groundbreaking but technically flawed, Maher (2002) exposed the flaw, and the community converged on **strictly proper scoring rules** (crystallized by Predd et al. in 2009) as the necessary condition to save the dominance argument.

  Here is the walkthrough of why the measure matters, why absolute distance fails, what Maher found, and where the consensus stands today.

  ---

  ### 1. Why the Argument is Sensitive to the Measure

  To understand the sensitivity, you have to look at the geometry of the dominance argument.

  Imagine a simple world with two mutually exclusive and exhaustive possibilities, $A$ and $\neg A$.
  *   **The Space of Credences:** Any pair of credences $(c(A), c(\neg A))$ is a point in the unit square $[0,1] \times [0,1]$.
  *   **Coherence:** Probabilistic coherence requires $c(A) + c(\neg A) = 1$. Geometrically, the coherent credences form a diagonal line segment connecting $(1,0)$ and $(0,1)$.
  *   **The Truth:** The world is either $w_1$ (where $A$ is true, represented by vertex $(1,0)$) or $w_2$ (where $\neg A$ is true, represented by vertex $(0,1)$).

  **The Dominance Claim:** Joyce wants to show that for any incoherent point $c$ (off the diagonal), there exists a coherent point $c^*$ (on the diagonal) such that $c^*$ is closer to the truth than $c$ is, **regardless of which vertex is the actual truth.**

  For this to hold, the "distance" function (inaccuracy measure) must have a specific shape. Specifically, the level sets of the inaccuracy function (the "contour lines" of equal inaccuracy around the truth vertices) must be **strictly convex**.

  If the contour lines are flat or concave, you can position an incoherent credence such that moving it onto the coherent diagonal moves it *away* from one of the truth vertices, or leaves it equidistant. The dominance argument collapses if the geometry of "accuracy" doesn't align with the geometry of "coherence."

  ### 2. What Goes Wrong with Absolute Value?

  The "naive" measure you recalled is **Absolute Loss** (or $L_1$ distance):
  $$ \mathcal{I}(c, w) = |c(w) - 1| + \sum_{v \neq w} |c(v) - 0| $$
  In our 2-option case, if $A$ is true, inaccuracy is $|c(A) - 1| + |c(\neg A) - 0|$.

  **The Failure:** Absolute loss is **linear**, not strictly convex. This creates "flat spots" in the epistemic landscape where accuracy doesn't improve even if you move toward coherence.

  **A Concrete Counterexample:**
  Let your incoherent credences be $c(A) = 0.5$ and $c(\neg A) = 0.4$. (Sum = 0.9).
  Let's calculate the inaccuracy under Absolute Loss for the two possible worlds:

  1.  **World $A$ (True):**
      $$ \mathcal{I}(c, A) = |0.5 - 1| + |0.4 - 0| = 0.5 + 0.4 = 0.9 $$
  2.  **World $\neg A$ (True):**
      $$ \mathcal{I}(c, \neg A) = |0.5 - 0| + |0.4 - 1| = 0.5 + 0.6 = 1.1 $$

  Now, can we find a coherent alternative $c^* = (p, 1-p)$ that dominates $c$? To dominate, $c^*$ must have inaccuracy $\leq 0.9$ in World $A$ AND $\leq 1.1$ in World $\neg A$ (with at least one strict inequality).

  Let's test the closest coherent point, $c^* = (0.55, 0.45)$ (projecting onto the diagonal):
  1.  **World $A$:** $|0.55 - 1| + |0.45 - 0| = 0.45 + 0.45 = 0.9$. (Tie with $c$)
  2.  **World $\neg A$:** $|0.55 - 0| + |0.45 - 1| = 0.55 + 0.55 = 1.1$. (Tie with $c$)

  Under Absolute Loss, moving to the coherent plane resulted in **no improvement whatsoever**. In fact, for a whole range of incoherent credences near the diagonal, there is *no* coherent credence that is strictly more accurate in all worlds. The incoherent credence is **undominated**.

  If incoherence isn't dominated, Joyce's claim that it is an "epistemic mistake" (in the strong sense of being suboptimal no matter what) fails.

  ### 3. Joyce's 1998 Axioms and Maher's Counterexample

  Joyce (1998) knew he couldn't just assume the Brier Score (squared error). He tried to derive the result from qualitative axioms about what makes a measure of inaccuracy "legitimate." His axioms included things like:
  *   **Normality:** Inaccuracy is 0 if you are certain of the truth.
  *   **Continuity:** Small changes in credence lead to small changes in inaccuracy.
  *   **Convexity:** (Roughly) Extremizing credences without evidence is risky.

  **The Critic:** Patrick Maher, in his 2002 paper *"Diagnosis of Joyce's Argument"*.

  **The Counterexample:** Maher constructed a scoring rule that satisfied **all** of Joyce's 1998 axioms but still failed to vindicate probabilism. That is, he found a measure of accuracy that looked perfectly "epistemic" by Joyce's own definition, yet under which some incoherent credences were *not* accuracy-dominated.

  Maher showed that Joyce's axioms were too weak to guarantee **Strict Propriety**. Joyce had assumed that "convexity" was enough to ensure that the coherent point was always better, but Maher demonstrated that you could have a convex scoring rule that wasn't *proper* (i.e., a rule where you wouldn't necessarily minimize expected inaccuracy by reporting your true credence). Without propriety, the link between "minimizing inaccuracy" and "being coherent" breaks.

  ### 4. The Fix: Strict Propriety and Predd et al. (2009)

  This led to a major revision in the literature, culminating in the paper you suspected: **Predd, Seiringer, Osherson, Schreiber, and Poor (2009), "Probabilistic Coherence and Proper Scoring Rules."**

  They cleaned up the geometry and identified the precise mathematical condition required.

  **Strict Propriety:**
  A scoring rule $\mathcal{I}$ is strictly proper if, for any probabilistic credence function $c$, the expected inaccuracy is minimized *uniquely* by reporting $c$.
  $$ E_c[\mathcal{I}(c, \cdot)] < E_c[\mathcal{I}(d, \cdot)] \quad \text{for all } d \neq c $$
  This condition ensures that if you *are* coherent, you have no incentive to shift your credences to minimize inaccuracy further. But crucially, combined with continuity, it ensures that if you are *incoherent*, there is always a coherent shift that lowers your inaccuracy in every world.

  **The Geometric Proof:**
  Predd et al. showed that any continuous, strictly proper scoring rule corresponds to a **Bregman Divergence**.
  *   Geometrically, Bregman divergences behave like squared distances (even if they aren't Euclidean).
  *   Because they are strictly convex, the "distance" from an incoherent point to the truth vertices is always strictly greater than the distance from its projection on the coherent plane to the truth vertices.
  *   This restores the Dominance Theorem: **If and only if** you use a strictly proper scoring rule is Probabilism vindicated by accuracy dominance.

  This is why the Brier Score ($\sum (c_i - w_i)^2$) is the canonical example: it is the simplest strictly proper scoring rule. Absolute loss is not proper.

  ### 5. Is This Settled Consensus?

  **Within Formal Epistemology:**
  Yes, mostly. If you are working in "Epistemic Utility Theory" (Pettigrew, Leitgeb, Greaves, etc.), **Strict Propriety is the non-negotiable entry ticket.** It is now standard to define an "epistemic scoring rule" *as* a strictly proper scoring rule. Joyce himself adopted this in his 2009 follow-up paper.

  **Live Disagreements & Criticisms:**
  However, there are still significant philosophical battles being fought around this consensus:

  1.  **The "Question-Begging" Charge:** Critics (like Hájek or various skeptics of Bayesianism) argue that requiring Strict Propriety basically builds Probabilism into the definition of accuracy. If the only "legitimate" measures of accuracy are those that vindicate probability theory, have we really *vindicated* probability theory, or just defined it into existence? (Defenders argue propriety is independently motivated by the idea that you shouldn't be incentivized to lie about your beliefs).
  2.  **Which Proper Rule?** While all proper rules vindicate coherence, they disagree on *degrees* of inaccuracy. The Brier Score and the Logarithmic Score can rank two agents differently. If Agent A is more accurate than Agent B by Brier, but less accurate by Log, which one is *really* more accurate? There is no consensus on which proper rule is the "One True Measure."
  3.  **The Value of Truth:** The whole program assumes **Veritism**: that the sole epistemic good is accuracy (closeness to truth). Virtue epistemologists or those who value understanding, explanation, or coherence *for its own sake* reject the premise that accuracy dominance is the only thing that matters.
  4.  **Non-Classical Logics:** Joyce and others have explored whether this argument vindicates *classical* probability or if it can be adapted to justify non-classical credences (e.g., in quantum logic or fuzzy logic). The math holds, but the interpretation of the "truth values" (the vertices) changes.

  ### Summary
  You hit the nail on the head. The move from Dutch Book to Accuracy was an attempt to make Bayesianism about *truth* rather than *money*. But to make the math work, they had to constrain "truth" to be measured in a very specific way (Strictly Proper Scoring Rules).

  *   **Absolute Value:** Fails because it's linear; incoherent credences can be undominated.
  *   **Joyce (1998):** Failed because his axioms didn't guarantee propriety.
  *   **Maher (2002):** Proved the failure.
  *   **Predd et al. (2009):** Established Strict Propriety (Bregman Divergences) as the necessary and sufficient condition for the dominance argument to hold.

  The consensus is that if you accept the Accuracy-First framework, you must accept Strict Propriety. But whether you should accept the Accuracy-First framework itself remains the larger philosophical open question.
