  5.  **Final Polish:** Organize with clear headings. Use LaTeX for math where appropriate. Ensure the transition from Joyce (1998) -> Maher (2002) -> Joyce (2009)/Predd (2009) is clear. (Self-correction: Make sure to emphasize that Strict Propriety isn't just a fix, it's the *definition* of an epistemic scoring rule in this framework).

