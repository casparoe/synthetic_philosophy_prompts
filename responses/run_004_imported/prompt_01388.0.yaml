  2.  **Deconstruct "Safe Pareto Improvements" (SPIs):**
      *   *Core Idea:* Change the game being played by the delegates (or the agents) such that the equilibrium of the *new* game Pareto dominates the equilibrium of the *original* game, without needing to know the private information (types) of the players.
      *   *Key Mechanism:* Commitment. Principals bind their agents to a modified utility function or a modified set of allowed strategies.
      *   *Classic Example:* Two countries might fight a war (costly). Instead, they agree their generals will fight a simulated war (cheap) or play a board game, and the outcome of *that* determines the territory division.
