      *   *The "Shrug":* The lawyer shrugged because SPI is a theoretical computer science/game theory concept, not a standard legal negotiation tactic. It sounds like "let's flip a coin" but more complex.

  4.  **Brainstorming Actionable SPI-Inspired Tactics:**
