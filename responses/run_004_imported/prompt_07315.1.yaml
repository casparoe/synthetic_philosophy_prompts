prompt: |-
  For the past year or so I've been teaching myself the philosophy of personal identity, mostly by working through library copies of Derek Parfit's *Reasons and Persons* and a few introductory books on Buddhist thought, since I never had the chance to study any of this formally. One claim keeps coming up in almost everything I read on the topic: that Parfit's Reductionist View of persons — the idea that a person's existence is nothing more than a brain and a body plus a series of interrelated physical and mental events, with no further fact of identity underneath all that — is essentially a modern, secular restatement of the Buddhist doctrine of anatta. Parfit seems to invite the comparison himself: he explicitly discusses the Buddha's teaching on non-self in the book, and describes his own shift to the Reductionist View in almost liberating terms, as though becoming a Reductionist had dissolved some kind of enclosure around him.

  The more Buddhist material I actually read, though, the shakier that equivalence starts to look to me. The Abhidharma tradition doesn't just deny a self; it replaces the person with a very specific ontology of momentary, causally connected dharmas (as in the chariot simile from the Milindapañha, where "chariot" and "person" turn out to be nothing more than convenient labels for an assembly of parts), and it still treats those momentary dharmas themselves as ultimately real. Madhyamaka goes further and denies even that, insisting that the aggregates and the dharmas are just as empty of intrinsic essence as the self was supposed to be, to the point that its thinkers worry about reifying emptiness itself, which is presumably why they end up talking about an "emptiness of emptiness." None of this seems to map cleanly onto Parfit, who as far as I can tell isn't committed to momentariness, to any Buddhist-style dharma ontology, or to anything like emptiness of emptiness — he's only denying that there is a further fact of identity over and above ordinary physical and psychological continuity.

  So rather than another side-by-side summary of both positions, I'd like you to actually argue for a specific claim: that the popular equation of Parfit's reductionism about persons with the Buddhist doctrine of anatta is mistaken, or at least considerably overstated, once you look past the shared rejection of a persisting self to what each view is actually committed to. Please give the strongest version of this argument you can, engaging directly with the specific points I raised above — the further-fact language, dharma theory and momentariness, and emptiness of emptiness — rather than resting on the vaguer observation that "Buddhism is more radical."
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user has been self-studying personal identity (Parfit's *Reasons and Persons* and Buddhist thought) for about a year.
      *   **Observation:** They notice a common claim: Parfit's Reductionism $\approx$ Buddhist *Anatta* (No-Self). Parfit himself invites this comparison.
      *   **Problem:** The user finds this equivalence "shaky" upon closer inspection. They note specific differences:
          *   Abhidharma: Replaces self with momentary *dharmas* (ontologically real).
          *   Madhyamaka: Denies intrinsic essence even to *dharmas* (Emptiness of Emptiness).
          *   Parfit: Denies "further fact" of identity but doesn't commit to momentariness, dharma ontology, or emptiness of emptiness. He stays within physical/psychological continuity.
      *   **Task:** Argue *for* the claim that the equation of Parfit's Reductionism with *Anatta* is mistaken or overstated.
      *   **Constraints:**
          *   Do not just summarize side-by-side.
          *   Argue a specific thesis (the equivalence is mistaken).
          *   Engage directly with specific points raised: "further fact" language, dharma theory/momentariness, and emptiness of emptiness.
          *   Avoid vague observations like "Buddhism is more radical."
          *   Tone: Philosophical, rigorous, respectful of the user's evident knowledge level.

  2.  **Deconstruct the Core Argument:**
      *   *Thesis:* While Parfit and Buddhism share a negative thesis (no substantial, unchanging self), their positive ontologies and soteriological goals diverge significantly, making the equation misleading.
      *   *Point 1: The Nature of the Reduction Base (Further Fact vs. Dharma Ontology).* Parfit reduces persons to physical/psychological continuity within a broadly physicalist or common-sense realist framework. Abhidharma reduces persons to *dharmas*, which are ontologically distinct, momentary, and carry karmic potential. Parfit's "parts" are not Buddhist *dharmas*.
      *   *Point 2: Momentariness and Continuity.* Parfit accepts psychological continuity (overlapping chains of connection). Buddhism (specifically Abhidharma/Sautrantika/Yogacara) often insists on momentariness (*ksanika*), where causation is problematic without a self. Parfit doesn't need momentariness; he needs enough overlap.
      *   *Point 3: Emptiness (*Sunyata*) vs. Reductionism.* Madhyamaka doesn't just reduce; it deconstructs the *reality* of the reducing elements too. Parfit is a reductionist (X is nothing but Y), not an emptiness proponent (X and Y lack inherent existence). Parfit stops at the physical/psychological facts; Madhyamaka questions the inherent existence of those facts.
      *   *Point 4: Soteriological Purpose.* Parfit's reductionism is ethical/metaphysical (less fear of death, more concern for others). *Anatta* is soteriological (ending *dukkha*, breaking rebirth). The "liberation" Parfit feels is intellectual/emotional; the liberation in Buddhism is ontological/existential (Nirvana).

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the user's insight. Validate that the "Parfit = Buddha" meme is common but philosophically superficial. State the thesis clearly: The equivalence fails because Parfit is a *constitutive reductionist* within a realist framework, whereas Buddhism (especially Madhyamaka) is an *ontological deconstruction* aimed at soteriological release, not just metaphysical clarification.

      *   **Argument 1: The Ontology of the Parts (Further Facts vs. Dharmas).**
          *   Parfit: "No further fact." Identity just consists in physical/psychological continuity. The "parts" (brain states, memories) are treated as conventionally real in a standard physicalist sense.
          *   Abhidharma: The "parts" (*dharmas*) are *ultimately* real (*paramartha-sat*). They are not just physical events; they are bearers of intrinsic characteristics (*svalaksana*).
          *   *Crucial Distinction:* Parfit reduces the person to *events* that are ontologically unproblematic. Abhidharma reduces the person to *dharmas* that are ontologically loaded (karma, momentariness). Parfit doesn't care if the "parts" have essence; Abhidharma insists they do (until Madhyamaka comes along).

      *   **Argument 2: Continuity vs. Momentariness.**
          *   Parfit relies on "Relation R" (psychological connectedness/continuity). It's a gradient. It allows for fission, branching, etc. It assumes a temporal duration where connections hold.
          *   Buddhist Momentariness: Existence is a series of discrete instants. Causation is the puzzle. If there is no self, what connects moment A to moment B?
          *   *The Clash:* Parfit's view is compatible with a continuous brain process. Buddhist view (often) requires a discrete, perishing ontology. Parfit's "continuity" is too thick/substantial for strict momentariness, yet too loose for the *dharmic* causal chain which requires specific karmic conditioning.

      *   **Argument 3: Reductionism vs. Emptiness of Emptiness.**
          *   This is the user's strongest point.
          *   Parfit: Reductionism. Persons aren't real *separately*, but the physical/psychological facts *are* real. He is a realist about the base.
          *   Madhyamaka: Emptiness (*Sunyata*). The aggregates (*skandhas*) are *also* empty. There is no "bottom level" of reality.
          *   *The "Further Fact" Trap:* Parfit denies a further fact of *identity*. Madhyamaka denies a further fact of *inherent existence* for the constituents themselves. Parfit stops at "physical and mental events." Madhyamaka asks, "What is the inherent nature of an event?" and finds none.
          *   Parfit is guilty of exactly what Madhyamaka warns against: reifying the basis of reduction.

      *   **Argument 4: The Goal of the Doctrine (Ethics vs. Soteriology).**
          *   Parfit: "Liberation" from the fear of death and selfishness. It's a moral improvement within *samsara* (life).
          *   Buddhism: Liberation from *samsara* itself. *Anatta* is a tool to stop craving/clinging.
          *   Parfit's view makes life better. Buddhism's view aims to end the cycle of rebirth (or realize the unborn).
          *   Parfit's "liberation" is a change in attitude. *Nirvana* is a change in ontological status (or realization of the ontological status).

      *   **Conclusion:** Summarize. The comparison is a "family resemblance" at best. Parfit is a Western analytic metaphysician trying to solve puzzles of identity and ethics. Buddhism is a soteriological system using metaphysics as a raft. Equating them obscures the radical nature of *Sunyata* and domesticates Buddhism into a form of physicalist reductionism.

  4.  **Refining and Polishing:**
      *   *Check Tone:* Ensure I'm not talking down. The user clearly knows the material. Use terms like "constitutive reductionism," "svabhava," "Relation R."
      *   *Check Constraints:* Did I address "further fact"? Yes. "Dharma theory"? Yes. "Emptiness of emptiness"? Yes.
      *   *Strengthening the Parfit side:* Make sure I represent Parfit fairly. He *is* a reductionist. He believes the facts obtain. He isn't a nihilist.
      *   *Strengthening the Buddhist side:* Distinguish Abhidharma (realist about dharmas) from Madhyamaka (anti-realist about dharmas). Show how Parfit fits neither perfectly.
      *   *Key Insight to Highlight:* Parfit denies the *unity* of the self but accepts the *reality* of the components. Madhyamaka denies the *reality* of the components themselves. This is the fatal flaw in the equivalence.

  5.  **Final Review against User Prompt:**
      *   "Argue for a specific claim": Yes (The equivalence is mistaken).
      *   "Engage directly with specific points": Yes (Further fact, dharmas, emptiness).
      *   "Strongest version": Need to be decisive. Don't hedge too much.

      *(Self-Correction during drafting)*: I should be careful not to say Parfit is *wrong* and Buddhism is *right*. The task is to argue they are *different*. Also, acknowledge Parfit's own nuance (he knows he isn't a Buddhist), but focus on the scholarly tendency to equate them.

      *Refining the "Further Fact" point:* Parfit says "Identity consists in X." Buddhism says "X is empty." Parfit thinks finding X solves the problem. Madhyamaka thinks reifying X creates a new problem.

      *Refining the "Liberation" point:* Parfit feels "open." Buddhism seeks cessation of *dukkha*. Parfit's openness is about concern for others; Buddhist liberation is about non-attachment.

      *Final Polish:* Ensure the transition between Abhidharma and Madhyamaka is clear, as the user distinguished them. Parfit is closer to Abhidharma (reduction to parts) but fails the momentariness test. He is further from Madhyamaka (emptiness).

  6.  **Final Output Generation** (Proceed to write the response based on these thoughts).
answer: |-
  The equation of Derek Parfit's Reductionism with the Buddhist doctrine of *anatta* is a compelling narrative, not least because Parfit himself cultivates it. In *Reasons and Persons*, he describes the Reductionist View as dissolving the "walls" around the self, leading to a greater identification with others and a diminished fear of death. This sounds strikingly like the soteriological promise of Buddhism. However, your intuition is correct: this equivalence is philosophically superficial. It relies on a shared negative thesis (there is no substantial, unchanging self) while ignoring the divergent positive ontologies and soteriological aims that give that negation its meaning.

  To argue the strongest version of your claim: **Parfit's Reductionism is a constitutive analysis within a realist framework, whereas Buddhist *anatta* (particularly in the Madhyamaka tradition) is an ontological deconstruction that undermines the reality of the reducing constituents themselves.** Equating the two mistakes a disagreement about the *unity* of the person for a disagreement about the *inherent existence* of reality.

  Here is the argument for why the equivalence is mistaken, engaging directly with the specific ontological commitments you raised.

  ### 1. The "Further Fact" vs. The Reality of *Dharmas*
  Parfit's central move is to deny a "further fact" of personal identity. He argues that when we ask, "Is the person at $t_2$ the same as the person at $t_1$?", we need not posit a separate entity (a Cartesian Ego or Soul) that survives. We need only point to physical and psychological continuity (Relation R). For Parfit, the person is "nothing but" these interrelated events. Crucially, however, Parfit treats these events—brain states, memories, intentions—as ontologically secure. He is a realist about the *constituents* of the person, even if he is a reductionist about the *person*.

  This creates a mismatch with the Abhidharma tradition. You noted that Abhidharma replaces the person with momentary *dharmas*. While this looks like Parfit's reduction of persons to "mental and physical events," the ontological status of those events differs radically. In Abhidharma, *dharmas* are *paramartha-sat* (ultimately real). They possess *svalaksana* (intrinsic characteristics). The reduction of the person is intended to reveal the *ultimate* building blocks of reality.

  Parfit is not doing this. He is not claiming that memories or brain states are "ultimately real" in a Buddhist sense; he is claiming they are the *only facts there are* in a standard physicalist or common-sense ontology. Parfit reduces the person to save the reality of the physical/psychological chain. Abhidharma reduces the person to reveal the reality of the *dharmas*. Parfit says, "There is no self, only events." Abhidharma says, "There is no self, only *dharmas* (which are not merely events, but bearers of karmic potential and intrinsic nature)." Parfit's reduction stops at a level of reality that Abhidharma would consider conceptually constructed if those "events" are not analyzed into momentary *dharmas*.

  ### 2. Continuity vs. Momentariness (*Ksanikavada*)
  The structural mechanics of Parfit's view are incompatible with the Buddhist doctrine of momentariness, which is central to most classical formulations of *anatta*.

  Parfit's Relation R relies on **overlap and continuity**. For Parfit, psychological connectedness can hold by degrees. I am connected to myself yesterday by many memories; I am connected to myself in ten years by fewer. This implies a temporally extended chain where links overlap sufficiently to sustain the label "person." This view is compatible with a continuous brain process or a "stream" of consciousness that has duration.

  The Buddhist doctrine of momentariness (*ksanikavada*) denies duration. A *dharma* arises and perishes in an instant. It does not endure long enough to be "connected" to the next moment in the way Parfit requires. This creates a specific philosophical problem for Buddhism that Parfit does not face: **If nothing endures, what connects moment A to moment B?**

  Buddhist schools (like the Sautrantika or Yogacara) develop complex theories of "seed perfuming" or causal series to explain how a perishing moment causes the next without a self to carry the burden. Parfit has no need for this. He assumes a background of physical time and causal continuity that is robust enough to support "Relation R" without needing to atomize time into perishing instants. To equate Parfit with Buddhism here is to ignore that Parfit's "continuity" is too thick for the Abhidharmika, while the Abhidharmika's "momentariness" is too atomic for Parfit. Parfit reduces the self to a *continuum*; Buddhism often reduces the self to a *series of discretes*. These are different metaphysical pictures.

  ### 3. Reductionism vs. Emptiness of Emptiness
  This is the most decisive point of divergence. Parfit is a **reductionist**; Madhyamaka is a proponent of **emptiness** (*sunyata*). These are not synonyms.

  *   **Parfit's Reductionism:** X (the person) is not real *over and above* Y (physical/psychological events). Therefore, Y is the reality. Parfit denies the reality of the whole to affirm the reality of the parts (or the relations between them).
  *   **Madhyamaka Emptiness:** X is empty of inherent existence. But Y (the aggregates, the *dharmas*, the physical events) are *also* empty of inherent existence.

  As you noted, Madhyamaka thinkers worry about "reifying emptiness." They argue that if you deny the self but cling to the reality of the aggregates (*skandhas*), you have merely shifted your attachment from a "person" to "phenomena." This is precisely what Parfit does. Parfit denies the "further fact" of identity but accepts the "further fact" of the physical and psychological events. He treats the base of his reduction as ontologically fundamental.

  Nagarjuna would argue that Parfit has fallen into the trap of *svabhava* (inherent existence) regarding the constituents. For Madhyamaka, there is no "bottom level" of reality. Physical events are dependently originated just as persons are. To say "a person is nothing but a brain and body" is, from a Madhyamaka perspective, to mistake one empty convention for another. Parfit believes he has found the hard facts (physics/psychology) beneath the illusion (self). Madhyamaka argues that physics and psychology are *also* conventional truths (*samvrti-satya*), not ultimate realities (*paramartha-satya*).

  Therefore, Parfit's view is ontologically **foundationalist** (there are basic facts about physics and psychology), while Madhyamaka is **anti-foundationalist**. Equating them obscures the radicality of *sunyata*, which denies the very ground Parfit stands on.

  ### 4. The Nature of "Liberation"
  Finally, the "liberation" Parfit describes is categorically different from the liberation promised by *anatta*, which changes the stakes of the comparison.

  Parfit's liberation is **ethical and emotional**. He writes that adopting the Reductionist View makes him less concerned about his own future and more concerned about others. It reduces the fear of death because "death" is just the end of a chain of relations, not the destruction of a substance. This is a modification of attitude *within* the world.

  The liberation of *anatta* is **soteriological and ontological**. The point of denying the self is not merely to be nicer or less afraid; it is to cut the root of *tanha* (craving) and *avidya* (ignorance) that fuels *samsara* (rebirth/suffering). In Buddhism, the belief in self is not just a metaphysical error; it is an existential clinging that binds one to suffering.

  Parfit does not believe that believing in a "further fact" causes suffering or rebirth. He believes it causes bad ethical reasoning. Conversely, a Buddhist would argue that Parfit's view is insufficient for liberation because Parfit still clings to the reality of the *dharmas* (the physical/mental events). As long as one reifies the aggregates, one has not realized *nirvana*. Parfit feels "open," but from a Buddhist perspective, he is still enclosed within a subtle reification of phenomena. His "liberation" is a change of mind; *nirvana* is the cessation of the conditions that make a "mind" (as a substantial entity) possible.

  ### Conclusion
  The equation of Parfit with the Buddha is a category error. Parfit is an analytic metaphysician using reduction to solve puzzles of identity and ground a utilitarian ethics. He denies the self to save the reality of the physical world and our ethical obligations within it.

  Buddhism, particularly in the Madhyamaka tradition you referenced, uses *anatta* to deconstruct the reality of the physical world itself. Parfit denies the self to affirm the events; Madhyamaka denies the self to reveal the emptiness of the events.

  To say Parfit is a "secular Buddhist" is to domesticate the doctrine of emptiness into a form of physicalist realism. It ignores the specific commitments to momentariness, the ontological status of *dharmas*, and the critical move of "emptiness of emptiness." Parfit stops where the Buddha (on this reading) would say the work is only half-done. They share a target (the substantial self), but they are using different weapons for different wars.
