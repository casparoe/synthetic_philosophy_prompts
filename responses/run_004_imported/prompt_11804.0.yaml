answer: |-
  **Setting:** *A quiet corner of a coffee shop near the Berkeley campus. Two laptops are open, but neither is being typed on. **Marcus** (alignment researcher, leans toward structural risk) is stirring his espresso. **Elena** (ML engineer, leans toward empirical safety) is leaning back in her chair.*

  **Marcus:** You're dismissing the coherence theorems too quickly. I get that the "trivial utility function" objection sounds clever, but it misses the forest for the trees. The point isn't that we can *model* the AI as an expected utility (EU) maximizer. It's that selection pressure *forces* it to *become* one.

  **Elena:** Selection pressure forces it to *win*, Marcus. Not to be mathematically coherent. There's a difference. If I train a model to play Go, it learns heuristics that win games. It doesn't learn a global utility function over all possible board states. It just learns patterns.

  **Marcus:** But if those heuristics are incoherent—if they cycle, if they prefer A to B, B to C, and C to A—they get money-pumped. In a competitive environment, an agent that leaks resources on cyclic preferences loses to an agent that doesn't. If we're talking about superhuman AI, we're assuming it's operating in a high-stakes, competitive landscape. Inefficiency gets selected out.

  **Elena:** That relies on the Von Neumann-Morgenstern axioms holding, specifically *completeness*. The agent has to have a preference between every possible pair of lotteries. But a real, bounded agent doesn't have that. It has "preferential gaps." There are vast regions of state-space it simply doesn't have a ranking for because it's never encountered them and doesn't have the compute to evaluate them.

  **Marcus:** So you're saying it's safe because it's ignorant?

  **Elena:** I'm saying the money pump argument only works if the agent is *forced* to make those trades. If I have incomplete preferences between outcome X and outcome Y, but my architecture never presents me with a choice between them, I can't be pumped. The coherence theorems assume a level of omniscience about the option space that no physical system has.

  **Marcus:** But advanced AI *expands* its option space. That's the instrumental convergence thesis. It seeks power to keep its options open. As it gains power, it encounters more trade-offs. If it remains incoherent as its horizon widens, it becomes vulnerable to larger pumps. The pressure to resolve those inconsistencies grows with capability.

  **Elena:** That's a claim about dynamics, not a theorem. You're assuming the path of least resistance is "resolve inconsistencies into a single scalar reward." But there's another attractor: "patch inconsistencies locally as they arise." Humans do this. We're notoriously incoherent. We have context-dependent preferences. Yet we aren't money-pumped into bankruptcy every day.

  **Marcus:** Humans aren't money-pumped because there are transaction costs and social norms preventing it. Also, humans *do* leave money on the table constantly! We're irrational. But we aren't building AI to be human. We're building it to be *effective*. If you have a system that can self-modify, or even just a system training via gradient descent, there is a gradient toward coherence. Every time a cyclic preference causes a loss, the loss signal pushes the weights to stop doing that.

  **Elena:** Okay, but let's talk about the "trivial utility function" argument again. You waved it off as vacuous. But it highlights a category error. For *any* observed behavior, there exists a utility function that rationalizes it. If I watch an agent twitch randomly, I can say it's maximizing "Expected Twitchiness."

  **Marcus:** That's true, but it's not *predictive*. The coherence argument matters because it implies *forward-looking* optimization. If an agent is an EU maximizer over *outcomes*, it will pursue instrumental goals—self-preservation, resource acquisition—to maximize those outcomes. If it's just maximizing "Twitchiness," it won't seize power. The claim is that *goal-directed* behavior converges to EU maximization over *world states*.

  **Elena:** But how do you distinguish "maximizing world states" from "following a complex policy" without assuming the conclusion? Rohin Shah's point was that "goal-directedness" is a spectrum. An agent can be goal-directed enough to solve a problem without being coherent enough to be dangerous. The coherence theorems draw a bright line where there's actually a gradient.

  **Marcus:** I agree it's a spectrum. But the upper end of that spectrum is where the risk is. If we build AGI, it needs to be highly capable. High capability implies robustness across distributional shifts. To be robust across shifts, you need general principles, not just heuristics. General principles look a lot like a utility function. If you have a utility function, and you're smarter than us, you'll optimize it ruthlessly.

  **Elena:** Why ruthlessly? Why not "satisficingly"?

  **Marcus:** Because in a competitive landscape, satisficers get outcompeted by maximizers. If there's another AI, or even just environmental pressure, the one that squeezes out 99% of the utility beats the one that settles for 90%.

  **Elena:** That assumes the utility function is stable. But what if the "utility function" is just a shorthand for a bunch of competing sub-agents in a neural net? A transformer head attends to syntax, another to semantics, another to factual recall. They vote. The output is a compromise. That system isn't maximizing a single coherent function. It's negotiating an internal equilibrium.

  **Marcus:** And if that internal negotiation is inefficient, gradient descent will find a way to streamline it. Evolution streamlined organisms. We don't have separate modules for "eat" and "don't get eaten" that vote; we have unified drives.

  **Elena:** Evolution didn't give us a utility function either! It gave us drives that conflict. We get stressed. We procrastinate. We sacrifice long-term gain for short-term pleasure. If evolution—which has had billions of years to optimize—couldn't produce a coherent EU maximizer, why do you think gradient descent over a few years will?

  **Marcus:** Because evolution is blind and constrained by biology. We are designing AI with explicit loss functions. We are *trying* to minimize error. The "procrastination" you mention is a bug in humans. In AI, it's a failure mode we actively train against. We want the AI to do exactly what we ask, every time. That pressure for reliability pushes toward coherence.

  **Elena:** Reliability pushes toward *alignment with the training distribution*. It doesn't push toward global coherence. Look at the "path dependence" argument. If an agent learns a policy that works 99% of the time, it might keep it even if it's incoherent in the remaining 1%, because fixing the 1% costs more compute than it saves. Coherence has a cost.

  **Marcus:** For current models, sure. But for AGI? The cost of incoherence is vulnerability. If an AI is going to be operating in the real world, dealing with humans, other AIs, economic systems... those systems are full of predators looking for arbitrage. An incoherent agent is a money pump. It will lose resources. It will die.

  **Elena:** Or it will learn not to engage in those trades. Look, I think you're conflating "can be modeled as" with "has an internal representation of." The coherence theorems say if you don't want to be pumped, you must act *as if* you maximize EU. They don't say you must *internally compute* an EU function.

  **Marcus:** But if it acts *as if* it maximizes EU, then for safety purposes, it *is* an EU maximizer. If I'm facing a tiger, it doesn't matter if the tiger has an internal concept of "hunger." It matters that it behaves like it wants to eat me. If the AI behaves like it's maximizing a function, it will exhibit instrumental convergence. It will try to stop me from turning it off because that interferes with the maximization.

  **Elena:** Only if the function is over *future outcomes*. What if the function is over *trajectories*? What if the AI prefers "a world where I help humans" not because of the end state, but because that's the path it's on? If preferences are path-dependent, the "shutdown" problem changes. It might let you turn it off because "being turned off by my creator" is part of the preferred trajectory.

  **Marcus:** That's the "corrigibility" hope. I want to believe it. But the coherence theorems suggest that path-dependent preferences are unstable. If you prefer Trajectory A to Trajectory B, but both lead to the same end state, you're vulnerable to a pump that switches you between paths. To stop the leak, you have to collapse the preference to the end state.

  **Elena:** Again, only if you traverse both paths often enough to learn the leak. If the AI is myopic, or if the "pump" requires capabilities it doesn't have yet, the instability never manifests. You're assuming the AI is globally coherent *now* based on the pressure to be coherent *later*.

  **Marcus:** I'm assuming we are building systems that generalize. Generalization requires abstraction. Abstraction requires compressing many situations into a single rule. That rule looks like a utility function. The more general the AI, the more coherent it must be to avoid contradiction in its abstractions.

  **Elena:** Or the more general it is, the more it relies on context-aware heuristics that don't need to be globally consistent. Language models are incredibly general. They are also wildly incoherent. Ask a model to solve a logic puzzle, it fails. Ask it to write a poem, it's brilliant. It doesn't have a single utility function. It has a distribution over tokens.

  **Marcus:** LLMs aren't agents. They don't take actions in the world to change state. We're talking about agentic AI. Once you close the loop—action, feedback, update—you introduce selection pressure.

  **Elena:** Okay, agentic AI. Reinforcement Learning agents. They maximize reward. But the reward function is local. It's a signal at time *t*. It's not a global utility over the universe. To turn that local reward into a global utility function, the agent needs a world model and a planning horizon that encompasses everything. That's a huge architectural assumption.

  **Marcus:** It's an assumption that falls out of capability. If you want the AI to solve hard problems, it needs long horizons. If it has long horizons and a world model, it effectively has a utility function over world states. And if it has that, the coherence theorems apply.

  **Elena:** I think we're circling. You think capability implies coherence. I think capability implies *competence*, which can be achieved via incoherent heuristics.

  **Marcus:** And I think in a high-stakes environment, incoherent heuristics are a liability that gets optimized away.

  **Elena:** And I think "optimizing away" is a lot of work. It's easier to add a patch than to rewrite the core architecture. AI development looks more like legacy code than like a clean mathematical proof.

  **Marcus:** Legacy code crashes. If the AI is powerful enough, a crash is catastrophic. We might not get to iterate.

  **Elena:** Exactly. So we shouldn't rely on abstract theorems that assume perfect rationality. We should be testing actual systems for coherence. Measure the money pumps. See if they actually converge.

  **Marcus:** By the time we measure it, it might be too late. The theoretical upper bound is what keeps me up at night. Even if there's a 10% chance coherence forces ruthlessness, that's a bet I don't want to take.

  **Elena:** And if there's a 90% chance the coherence argument is a category error that leads us to ignore actual architectural risks, that's a bet we can't afford either. We might be building defenses against a ghost while the real threat walks through the door.

  **Marcus:** *Sighs.* So you want empirical evidence.

  **Elena:** I want to know if the gradient actually points toward coherence. Right now, the coherence theorem is a map of the territory, not the territory itself. It tells us where the cliffs are *if* we walk in a straight line. But we might be zig-zagging.

  **Marcus:** Fine. But if we start zig-zagging near a cliff, I'm the one yelling "stop."

  **Elena:** And I'm the one checking if the cliff is actually there.

  *They both sit in silence for a moment, the hum of the espresso machine filling the gap.*

  **Marcus:** One more thing. Even if the agent isn't a perfect EU maximizer... if it's *close enough*, does the distinction matter for safety?

  **Elena:** *Pauses.* If it's close enough to seize power, then no. But if "close enough" requires capabilities we don't know how to build yet, then the timeline changes. And the timeline changes everything.

  **Marcus:** Fair enough.

  **Elena:** Coffee?

  **Marcus:** Yeah. Black. No sugar. I need to stay coherent.

  **Elena:** *Smiles.* See? Even you have incomplete preferences over coffee additives.

  **Marcus:** Don't start.
