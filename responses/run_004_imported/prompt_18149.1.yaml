answer: |-
  Here is a draft for the toast. It's written to be spoken at a measured, warm pace. It hits all four of Cicero's points without ever mentioning his name, and it weaves in the specific details about your grandpa and the metaphors you liked.

  **Time:** Approx. 3–4 minutes at a moderate speaking pace.
  **Tone:** Warm, respectful, slightly humorous, life-affirming.

  ***

  **The Toast**

  [Stand up, tap your glass gently for attention, and smile at your grandpa]

  Hi everyone. For those who don't know me, I'm [Your Name], [Grandpa's Name]'s grandson/granddaughter. My mom volunteered me to give this toast because apparently, I'm "good with words." Which is convenient, because when you turn ninety, people tend to have a lot of words *about* you. Usually, they're whispers. They talk about how ninety is a threshold. They worry that this age is the beginning of the end.

  But I've been thinking about that. There's an old idea that there are four reasons to be afraid of getting old. And looking at my grandpa, I realize those four reasons are wrong.

  The first complaint is that old age pulls you out of an active life. That you stop contributing. Two years ago, Grandpa sold the hardware store. By all rights, he should have walked away. But we all know he still calls the new owner every week with "suggestions." [Pause for laughter] He isn't hauling lumber anymore, but he's still steering the ship. There's an old saying that a captain doesn't need to climb the mast to know where the north star is. The young men can bail the water and hoist the sails. But the old man? He sits at the helm. And the ship goes where he points it.

  The second complaint is that the body fails. It's true, Grandpa moves a little slower these days. The cane isn't just for show. But physical speed isn't the same as strength. There is a steadiness that comes only after ninety years of walking through the world. He doesn't rush, because he knows exactly where he's going.

  The third complaint is that old age takes away your pleasures. I'll admit, the doctor has put him on a strict diet. No more spicy wings. And he's down to exactly one beer. [Raise your glass slightly] But I've watched him at the card table. The joy isn't in the spice or the alcohol; it's in the bluff, the laugh, and the company. He traded the fleeting pleasures for the lasting ones.

  And finally, the fourth complaint. The one nobody likes to say out loud. That ninety means you're just waiting for death. That's a dark way to see it. A better way is to think of fruit on a tree. If you pick it too early, it's torn away before it's ready. But if you let it stay on the branch through the sun and the rain, eventually, it becomes so ripe that it falls naturally, of its own weight.

  Or think of it like a play. It doesn't matter how long the show runs; it matters how good the final act is. And looking around this room—at his coworkers, his card buddies, his family—I'd say this final act is getting a standing ovation.

  So, Grandpa, let them worry about getting old. You've proven that the helm is more important than the mast, that steadiness beats speed, that company tastes better than spicy food, and that a life well-lived isn't a tragedy, it's a harvest.

  [Turn to the room]

  If everyone could raise a glass. We're only allowed one beer, so make it count.

  To Grandpa. Happy 90th Birthday.

  ***

  ### A Few Delivery Tips for Your Latin IV Brain:

  *   **The "Cicero" Element:** Notice I didn't mention Cicero or *De Senectute*. Your grandpa's coworkers don't need the citation; they need the sentiment. You're honoring the text by using its logic, not by name-dropping it.
  *   **The "Death" Section:** When you get to the "fruit" and "play" paragraph, slow down. This is the emotional core. If you rush it, it sounds morbid. If you take your time, it sounds peaceful.
  *   **The "One Beer" Joke:** This is your release valve. The section before it is heavy. Deliver the line about the doctor and the beer with a smile to let the room breathe before the final toast.
  *   **Eye Contact:** When you talk about the "helm," look at Grandpa. When you talk about the "room/family," scan the audience.

  Good luck! This is a really cool way to apply a classics unit to real life. Cato would be proud.
