prompt: |-
  ok so i just had to pick between two job offers (a big consulting offer vs a much smaller research job that i actually care about) and i've been kind of spiraling about whether there was actually a right answer i missed. my friend sent me the ruth chang ted talk to make me feel better, the one where she says hard choices are hard because the options are "on a par" -- like theres a real fourth value relation sitting next to better/worse/equal, not just us being unable to tell which one wins. i went down a bit of a rabbit hole after and apparently she's got actual papers arguing parity is a genuine "sui generis" relation, seperate from just not knowing which option is better. it's a comforting idea but ngl it kinda feels like a dodge to me.

  can you build the strongest case you can that parity isn't real -- that what's actually going on in cases like mine is just plain old vagueness/indeterminacy about which option is better, dressed up in fancier language? not looking for a "both views have merit" answer, i want real ammo against parity.
