      *   *Fiction Focus:* Ensure the advice is practical for a novelist. How do you show "credit terms" without an info-dump? (The bank letter, the owner's stress).

  7.  **Final Polish:** Check tone (objective, analytical, helpful). Ensure the distinction between historical truth and narrative truth is clear. (Proceed to generate output based on this structure).

      *   *Key Insight:* The debate is Structure vs. Agency. In fiction, Agency is the vehicle, Structure is the terrain. You need both.

  8.  **Final Review against constraints:**
