prompt: |-
  In my school's philosophy club, we spent a couple of sessions this term on metaethics, and I've been reading further on my own about expressivism: the view that a sentence like "cheating is wrong" doesn't describe a moral fact but instead expresses an attitude such as disapproval. I found the view fairly compelling until I ran into what is apparently called the Frege–Geach problem, which I have found genuinely difficult to get to the bottom of. As far as I can tell, the difficulty is that moral sentences constantly show up in places where they clearly aren't being asserted at all, such as the antecedent of a conditional ("If cheating on an exam is wrong, then pressuring a friend into cheating for you is wrong"), and yet an inference built out of that conditional together with the premise "cheating on an exam is wrong," concluding that pressuring a friend into cheating is wrong, still seems perfectly valid. If the expressivist says that the meaning of a moral sentence just is the attitude expressed when someone asserts it on its own, it isn't obvious what explains either the meaning of the embedded occurrence or the validity of the resulting argument. A friend of mine in the club is convinced this is fatal to expressivism, while I'm not so sure, and the two of us haven't been able to get much further than restating our own intuitions at each other.

  Could you write a dialogue between two equally capable philosophers who disagree about exactly this question: one an expressivist who thinks the embedding problem can be solved, or at least defused, without giving up the idea that moral sentences express attitudes rather than describe facts, and the other a cognitivist who thinks the problem shows that moral sentences must have genuine truth-conditional content after all. I'd like the expressivist to actually attempt a specific, detailed strategy for explaining why a moral sentence means the same thing whether it's asserted or embedded, and what makes the resulting inference valid, rather than just insisting that a solution must exist somewhere; and I'd like the cognitivist to respond with a concrete objection to that particular strategy rather than a generic dismissal, so that the two of them are genuinely engaging with each other's specific moves instead of merely restating their opening positions. A handful of exchanges of real back-and-forth would be more useful to me than a longer dialogue that simply repeats the initial problem several times over.
reasoning: |-
  Here's a thinking process that leads to the dialogue above:

  1.  **Analyze the Request:**
      *   **Topic:** Metaethics, specifically Expressivism vs. Cognitivism regarding the Frege-Geach Problem.
      *   **Characters:** Two equally capable philosophers (Expressivist vs. Cognitivist).
      *   **Goal:** A dialogue where they genuinely engage with specific arguments, not just restate positions.
      *   **Requirements:**
          *   Expressivist must offer a *specific, detailed strategy* for solving/defusing the problem (not just "it can be done").
          *   Cognitivist must offer a *concrete objection* to that specific strategy (not just "it fails").
          *   Multiple exchanges of back-and-forth.
          *   Tone: Academic but accessible (suitable for a philosophy club student).

  2.  **Determine the Specific Strategy:**
      *   *The Problem:* "Cheating is wrong" expresses disapproval when asserted. But in "If cheating is wrong, then...", no disapproval is expressed. So how does the meaning stay constant to allow valid inference (Modus Ponens)?
      *   *Expressivist Solution:* I need a recognizable, sophisticated expressivist approach.
          *   *Option A:* Blackburn's Quasi-Realism (commitment to attitudes).
          *   *Option B:* Gibbard's Norm-Expressivism (planning/norm-acceptance).
          *   *Option C:* Hybrid Views (express attitude + describe belief).
          *   *Option D:* Inferential Role Semantics (meaning is use).
      *   *Selection:* **Blackburn's Quasi-Realism** focusing on *higher-order attitudes* is a classic and robust choice. It allows the expressivist to explain the conditional without positing moral facts. Specifically, the idea that accepting the conditional expresses a higher-order attitude of disapproval towards *combining* certain attitudes.
      *   *Cognitivist Counter:* The challenge is usually about the *explanation of validity*. If validity is truth-preservation, and there are no truth-conditions, what is it? If the expressivist redefines validity (e.g., consistency of attitudes), does it capture the *logic* we actually use? The "Negation Problem" or the "Embedding Problem" often resurfaces as a challenge to the compositional semantics. I'll focus on the *compositionality* and *truth-conditional* aspect. The cognitivist should argue that the expressivist is essentially mimicking truth-conditions without owning them, and that this mimicry fails to explain *why* the inference holds independently of our psychological states.

  3.  **Drafting - Character Conceptions:**
      *   **Alex (Expressivist):** Defends Quasi-Realism. Calm, analytical, tries to show how logic works within a framework of attitudes.
      *   **Jordan (Cognitivist):** Defends Moral Realism/Cognitivism. Sharp, focuses on the objective structure of logic and semantics.

  4.  **Drafting - The Flow:**
      *   *Opening:* Acknowledge the Frege-Geach problem directly.
      *   *Move 1 (Alex):* Propose the higher-order attitude solution (Blackburn-style). To accept "If P then Q" is to have a attitude towards the combination of attitudes in P and Q.
      *   *Move 2 (Jordan):* Challenge the compositionality. Does "wrong" mean the same thing in both spots? If the meaning changes (assertoric vs. embedded), logic breaks.
      *   *Move 3 (Alex):* Refine the semantics. It's not about changing meaning, it's about the *logic of attitudes*. Validity is about inconsistency in attitude sets, not truth preservation.
      *   *Move 4 (Jordan):* The "Truth-Conditional" pushback. Logic *is* truth preservation. If you change the definition of validity, you aren't solving Frege-Geach, you're changing the subject. Also, mention the "Negation Problem" (Schroeder's point) as a specific technical hurdle for the higher-order view.
      *   *Move 5 (Alex):* Defend the pragmatic utility. We don't need robust truth, just "minimal truth."
      *   *Move 6 (Jordan):* Minimal truth isn't enough for explanation. It explains *usage* but not *correctness*.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is Alex's explanation too vague?
      *   *Fix:* Make sure Alex explicitly defines what accepting the conditional means. "Disapproval of disapproving of cheating while not disapproving of pressuring."
      *   *Critique:* Is Jordan's objection too generic?
      *   *Fix:* Jordan needs to hit the *logical form*. If "wrong" in the antecedent doesn't contribute the same semantic value as "wrong" in the premise, it's the fallacy of equivocation. Alex needs to show how the semantic value *is* constant (as a function from worlds to attitudes? No, as a function of commitment). Let's stick to the *consistency of commitments* vs. *truth conditions*.
      *   *Specific Technical Point:* I should incorporate Mark Schroeder's "Negation Problem" or a simplified version of it, as it's the modern standard objection to Blackburn's specific solution. It shows that higher-order attitudes multiply too quickly.

  6.  **Writing the Dialogue (Iterative Process):**
      *   *Start:* Set the scene. Coffee shop or office hours.
      *   *Alex's Opening:* State the quasi-realist move. Moral sentences express attitudes. Conditionals express attitudes towards combinations of attitudes.
      *   *Jordan's Response:* The Equivocation Objection. If the semantic content differs, Modus Ponens is invalid.
      *   *Alex's Counter:* Deny that semantic content *must* be truth-conditional. Define validity as "inconsistency of commitment."
      *   *Jordan's Counter:* The "Negation Problem" (Schroeder). There are too many ways to not accept a norm. Expressivism can't distinguish them without truth conditions.
      *   *Alex's Counter:* Minimalism about truth. We can say it's "true" in a deflationary sense.
      *   *Jordan's Closing:* Deflationary truth doesn't do the explanatory work required for logic.

  7.  **Review against Constraints:**
      *   Equally capable? Yes.
      *   Expressivist gives specific strategy? Yes (Higher-order attitudes/Quasi-realism).
      *   Cognitivist gives concrete objection? Yes (Equivocation + Negation Problem).
      *   Back-and-forth? Yes.
      *   Tone? Respectful, philosophical.

  8.  **Final Polish:** Check for clarity. Ensure the distinction between *asserting* and *embedding* is clear. Ensure the definition of validity is contested clearly. (Self-correction: Make sure Alex doesn't just sound like they are changing the subject on validity, but arguing for a parallel notion of validity that serves the same function.)

  9.  *(Final thought before generating)*: Keep the jargon manageable but precise. Use "disapproval" and "attitudes" consistently. Ensure the "If P then Q" example is used throughout.

  *(Proceed to generate output based on these thoughts.)*
answer: |-
  **Setting:** *A quiet corner of the university library, late afternoon. Two graduate students, Alex (an expressivist) and Jordan (a cognitivist), are reviewing notes for the philosophy club.*

  **Jordan:** So, you're sticking with expressivism despite the Frege–Geach problem? I get the appeal. It fits with the intuition that morality feels motivational. But the embedding issue seems like a wall. If "cheating is wrong" just means *Boo cheating!*, then "If cheating is wrong..." means *If Boo cheating!...* which is nonsense. You can't put an exclamation mark in the antecedent of a conditional.

  **Alex:** I don't think it's nonsense, though. It just requires a more sophisticated semantics than the simple "Boo/Hurrah" model. Look, the core expressivist move here—following Blackburn's quasi-realism—is to treat the meaning of moral terms not as descriptions of the world, but as expressions of *commitments*. When I assert "Cheating is wrong," I express a first-order attitude of disapproval toward cheating.

  **Jordan:** Okay, but that doesn't help with the conditional. In "If cheating is wrong, then pressuring a friend is wrong," you aren't disapproving of cheating. You're hypothesizing. So what attitude is being expressed there? If there's no attitude, there's no meaning, on your view.

  **Alex:** Not quite. On the quasi-realist view, accepting a moral conditional expresses a *higher-order* attitude. To accept "If cheating is wrong, then pressuring is wrong" is to express a state of mind that rules out *combining* certain attitudes. Specifically, it expresses disapproval of the combination: *disapproving of cheating* while *not disapproving of pressuring*.

  **Jordan:** So the meaning of "wrong" shifts? In the premise, it's a first-order attitude. In the conditional, it's part of a higher-order attitude about consistency.

  **Alex:** No, the semantic value is constant. The semantic value of "wrong" is its role in expressing a practical commitment. Whether that commitment is asserted outright or embedded in a conditional, it's still functioning as a marker of a normative stance. The conditional just tells you how those stances relate. Validity, for us, isn't about truth-preservation in the realist sense. It's about *consistency of commitments*. If you commit to the conditional, and you commit to the antecedent, you are rationally required to commit to the consequent. Otherwise, your set of attitudes is inconsistent.

  **Jordan:** Here's where I have to push back hard. You're redefining validity to save the theory. Classical logic defines validity as truth-preservation: if the premises are true, the conclusion *must* be true. You're defining it as "attitude-consistency." But that creates an equivocation fallacy.

  **Alex:** How so?

  **Jordan:** Take the Modus Ponens argument:
  1. If cheating is wrong, then pressuring is wrong.
  2. Cheating is wrong.
  3. Therefore, pressuring is wrong.

  For this to be valid, the phrase "cheating is wrong" must mean exactly the same thing in premise 1 and premise 2. But on your account, in premise 2, I am *expressing* disapproval. In premise 1, I am *not* expressing disapproval; I'm expressing a higher-order attitude about the relation of disapprovals. If the semantic contribution of "cheating is wrong" differs between the two premises, the argument is invalid. It's like saying: "If banks are steep, I can't climb them. The river has banks. Therefore, I can't climb the river's banks." You're trading on two different senses of "wrong."

  **Alex:** That's the standard objection, but I think it misses the compositional aspect. We can model this using a logic of attitudes. Think of it like this: The content of "cheating is wrong" is a function from a agent's normative perspective to a commitment. In the antecedent, that function isn't *activated* as an assertion, but it's still the same function. It's the same way negation works. "It is raining" describes a fact. "It is not raining" describes the absence of that fact. The content "rain" is constant. Similarly, "wrong" marks a normative role. When embedded, that role is preserved, even if the speech act isn't assertion. We explain validity by showing that anyone who accepts the premises but rejects the conclusion has a fractured normative psychology. They are guilty of a specific kind of irrationality.

  **Jordan:** But irrationality isn't invalidity. I can be irrational and still make a valid argument. I can be rational and make an invalid one. The Frege–Geach problem is about *logic*, not psychology.

  Let me give you a concrete technical problem with your higher-order attitude solution. This is essentially Mark Schroeder's "Negation Problem." Let's look at the negation of your conditional.
  Suppose I say: "It is not the case that (if cheating is wrong, then pressuring is wrong)."
  On your view, accepting the conditional means disapproving of the combination [Disapprove(Cheating) + ~Disapprove(Pressuring)].
  So, rejecting the conditional should mean... what?

  **Alex:** It means I don't have that higher-order disapproval.

  **Jordan:** Exactly. But "not having that higher-order disapproval" is ambiguous. It could mean I *approve* of that combination (I think it's fine to disapprove of cheating but not pressuring). Or it could mean I'm *uncertain* or have no attitude at all.
  In standard truth-conditional semantics, ¬(P → Q) is equivalent to (P ∧ ¬Q). It has a precise truth condition. But on your expressivist view, the negation of a higher-order attitude doesn't map cleanly onto a specific alternative attitude. You end up with too many ways to *not* accept a norm, and your logic can't distinguish between them. If your semantics can't distinguish between *denying* the conditional and *withholding judgment* on the conditional, you can't build a logic that mirrors Modus Ponens. You lose the binary structure logic requires.

  **Alex:** That's a serious challenge, I grant you. But the expressivist can respond by adopting a minimalist or deflationary theory of truth. We can say moral sentences *are* truth-apt. "Cheating is wrong" is true if and only if cheating is wrong.

  **Jordan:** [Laughs] That's circular.

  **Alex:** It's not circular; it's deflationary. The point is that the predicate "is true" doesn't add any metaphysical weight. It just allows us to embed moral sentences in logical contexts. So, "If cheating is wrong is true, then..." works perfectly fine. We get the logic of cognitivism without the metaphysics of moral facts. We earn the right to talk about truth by showing how moral discourse behaves *as if* it were truth-conditional.

  **Jordan:** But that's the crux of it. You're saying moral sentences behave *as if* they have truth conditions. I'm saying they *must* have them to explain *why* they behave that way.
  If you use deflationary truth to solve Frege–Geach, you're essentially admitting that the logical structure of moral thought *requires* truth-conditions. The reason Modus Ponens works is that the premises preserve a property (truth) that the conclusion inherits.
  If you say, "Well, it's just a useful fiction that they have truth," you haven't explained the validity; you've just papered over it. You're borrowing the cognitivist's logic to make your view work, while denying the ontology that grounds that logic. It's like saying, "I don't believe in numbers, but 2+2=4 is true in a deflationary sense." Eventually, you have to explain what makes the equation hold if there are no numbers.

  **Alex:** But what if the "ontology" is just us? What if the "making hold" is the requirement of rational agency? I'm not borrowing your logic; I'm reconstructing it from the ground up using practical reason. The "truth" of "cheating is wrong" is just the stability of that commitment within a coherent system of norms.
  Your view posits mysterious moral facts. My view posits human agents trying to coordinate their attitudes. If my reconstruction of logic via consistency of commitments yields the same theorems as your truth-conditional logic, why is your ontology necessary? Isn't it ontologically parsimonious to stick with attitudes?

  **Jordan:** Parsimony is good, but not at the cost of explanatory power. Your reconstruction yields the same theorems only if you ignore the negation problem I mentioned. Once you look closely at complex embeddings—negations of conditionals, disjunctions of moral claims—your "consistency of attitudes" model becomes incredibly convoluted compared to the clean truth-conditional model.
  To make your higher-order attitudes work, you have to posit a new, distinct attitude for every logical connective. Disapproval for conditionals, tolerance for disjunctions, etc. It explodes the number of psychological states required to understand simple moral logic.
  Cognitivism explains all of that with one thing: the proposition has a truth value. Whether it's asserted, negated, or conditionalized, it's the same proposition with the same truth conditions. That explains the constancy of meaning across embeddings without multiplying psychological entities.

  **Alex:** I suppose we're at the impasse of our respective costs. You pay in metaphysical queerness (moral facts); I pay in psychological complexity (complex higher-order attitudes).
  But I'd argue my cost is lower. We already know attitudes exist. We know people have inconsistent beliefs and desires. We don't need to discover a new realm of facts to explain why "If cheating is wrong..." implies things. We just need to understand the grammar of our own commitments. The Frege–Geach problem shows that expressivism can't be *simple*. It doesn't show it's impossible.

  **Jordan:** And I'd argue that once you've added enough complexity to your expressivism to solve Frege–Geach—deflationary truth, higher-order attitudes, complex consistency rules—you've essentially recreated cognitivism in all but name. If you grant that moral sentences function logically exactly like truth-conditional propositions, the motivation for denying they *are* truth-conditional propositions starts to look like dogma.
  But, I will concede this: if you can solve the Negation Problem without collapsing into realism, you'd have a winner. Until then, the embedding problem remains the strongest reason to think "wrong" picks out a property, not just an attitude.

  **Alex:** And I'll concede that if the Negation Problem proves insurmountable, expressivism loses its claim to be a full semantic theory. But I'm not ready to admit defeat. I think there's room for a hybrid view, or a more refined norm-expressivism, that handles the logic without the facts.

  **Jordan:** Fair enough. That gives us enough for the club meeting. We can let the undergraduates wrestle with the Negation Problem.

  **Alex:** [Smiling] Poor undergraduates. They just wanted to know if cheating was wrong.

  **Jordan:** Now they'll know that whether it's wrong depends on whether you can embed an exclamation mark in a conditional.

  **Alex:** Exactly. Philosophy in a nutshell.
