answer: |-
  Good morning. Thank you all for being here.

  For those of you who don't know me, I'm [Your Name]. I'm a junior in high school, and I was Grandma's only grandchild. I'm also, apparently, the only person in the family who ever sat through her full lecture on Nietzsche without trying to change the subject to sports or the weather.

  Standing here, I know thirty people are looking at me expecting a summary of a life. But if I know Grandma, she'd be pacing behind me right now, telling me that a eulogy shouldn't be a heavy German-style meal that leaves everyone too full to move. She'd want this to be light. Vital.

  Many of you knew her as the woman who hosted dinner parties but wouldn't let you linger too long over dessert. Some of you know that she lived her life by the philosophy of Friedrich Nietzsche. Specifically, the chapter "Why I Am So Clever" from *Ecce Homo*.

  To my cousins who know the texts: Yes, she was devoted to the idea of the Will to Power. But to everyone else, including her old friends who just want to remember the woman who brought casseroles and checked in on you when you were sick: Please don't let the philosophy scare you. To Grandma, Nietzsche wasn't about being cold or intellectual. It was about paying attention.

  My parents always described her lifestyle as "very disciplined." No alcohol, no heavy soups, winters in Arizona, summers in the Colorado mountains. She called Arizona her Nice and Colorado her Sils-Maria. But if she were here, she would correct my parents. She hated the word "discipline." She said discipline sounded like denial, like saying "no" to yourself.

  Her point was the opposite. She didn't avoid the heavy soup because it was forbidden; she avoided it because it made her feel sluggish. She didn't move to the mountains because she was rigid; she went there because the air made her feel more alive. She taught me that taking care of your vitality isn't self-denial. It's self-respect. It's about not wasting yourself on the wrong climate, or the wrong company, or the wrong soup.

  I will miss her pacing the most. If a guest sat too long after dinner, she wouldn't ask them to leave. She would just stand up and start walking around the room, telling them that a sedentary life was a "sin against the Holy Spirit." At first, I thought she was just being impatient. But later, I realized she was trying to wake us up. She wanted us to keep moving, keep talking, keep living. She couldn't understand why anyone would choose to sit still when there was so much life left to experience.

  To her friends here: You knew the warmth behind the rules. You knew that her insistence on fresh air and light meals was just her way of wanting you to be healthy enough to stay in her life for a long time.

  To my cousins: She would want us to carry this forward. Not necessarily the Nietzsche books, but the courage to design a life that fits us. To have the will to choose our own mountains.

  Grandma died at eighty-six. She chose her climate, she chose her habits, and she chose her friends. And in the end, she chose to leave on her own terms, before the winter could set in.

  I promise to try not to be sedentary. I promise to watch what I eat, not out of guilt, but out of respect for the energy I've been given. And I promise to keep listening, even when the talk gets heavy, because I know now that the point wasn't the philosophy. The point was the vitality.

  Thank you, Grandma, for showing us how to be clever enough to live. We will miss you.
