answer: |-
  It is a pleasure to speak with someone who knows what it means to wrestle with matter rather than just words. Your intuition as a chemist is spot-on: to modern ears, and certainly to an experimentalist's ear, Hobbes's claim that geometry is the *only* science because it starts with definitions sounds not just backwards, but almost perverse. In your line of work, a definition is useless if the data doesn't back it up; for Hobbes, the data is useless if the definitions aren't settled first.

  To unpack this, we have to step out of the modern conception of "science" (empirical, data-driven, falsifiable) and into Hobbes's 17th-century conception of *Scientia*.

  Here is the breakdown of what Hobbes is claiming, why the "maker" hypothesis you recall is the key to unlocking it, and what his embarrassing obsession with squaring the circle tells us about the limits of his philosophy.

  ### 1. Truth as Accounting, Not Discovery
  The first sentence of your passage is the linchpin: *"Truth consisteth in the right ordering of names in our affirmations."*

  For Hobbes, truth isn't primarily a relationship between a statement and the external world (correspondence theory); it is a relationship between names within a logical system. He views reasoning as a form of **computation**. Just as you add and subtract numbers, the philosopher adds and subtracts concepts.
  *   "Man" + "Rational" = "Human Being."
  *   If you define your terms loosely, your calculation fails.

  This is the "lime-twigs" analogy. If you use a word like "gold" without a precise definition, and I use it with a different one, we aren't just disagreeing about facts; we are talking past each other. The more we argue (struggle), the more entangled we become.

  For a chemist, you resolve this by pointing to a sample and running a spectrum. For Hobbes, you resolve this by **stipulating a definition** before you begin.

  ### 2. Why Geometry is the "Only Science"
  This is where your background creates friction. You view science as discovering what *is*. Hobbes views *Scientia* as knowing *why* something must be, with absolute certainty.

  *   **Natural Philosophy (Chemistry/Physics):** We observe effects (fire burns, gold sinks). We hypothesize causes. But because we did not create the fire or the gold, we cannot be certain we know their true essence. We can only have probability based on experience (what Hobbes calls *Prudence*, not *Science*).
  *   **Geometry:** We define a circle. We construct a triangle. Because **we** created these objects in our minds (or on paper) according to our own definitions, we know their properties with absolute certainty.

  Your recollection from the commentary is exactly right. This is often referred to as the *verum factum* principle (truth is made), later made famous by Vico but present in Hobbes. Hobbes argues that we can only have demonstrative knowledge of things we construct.
  *   **God** made nature, so only God has *Scientia* of nature.
  *   **Man** made geometry (conceptually), so Man has *Scientia* of geometry.

  When Hobbes says geometry is the "only science that it hath pleased God hitherto to bestow on mankind," he is being slightly cheeky. He means that God gave us the rational capacity to construct figures and deduce consequences, but He did not give us the capacity to see into the essential causes of natural bodies.

  ### 3. The Load-Bearing Work of Definitions
  In your passage, Hobbes says geometers *"place them [definitions] in the beginning of their reckoning."*

  Think of this like standardizing a reagent before a titration. If your standard solution is impure, your entire analysis is garbage, no matter how precise your pipetting.
  *   In **Chemistry**, the "standard" is nature itself, which is often messy, impure, and context-dependent.
  *   In **Geometry**, the "standard" is the definition. A Euclidean point has no parts. A line has no breadth. These things don't exist in the physical world, but because we agree to pretend they do, the logic holds perfectly.

  Hobbes wants to turn politics and ethics into a geometry. He wants to define "Man," "Liberty," and "Covenant" so precisely in Chapter 4 that by Chapter 17, the necessity of the Leviathan (the State) follows as inevitably as the Pythagorean theorem. He believes social chaos comes from "undefined words" (like "justice" or "faith") being used ambiguously to stir up passion.

  ### 4. The Irony of the Squared Circle
  Now, to the delicious irony: Hobbes spent the last decades of his life engaged in public feuds with mathematicians (like John Wallis), insisting he had squared the circle. He had not. It is mathematically impossible (proven later regarding transcendental numbers, but the geometric impossibility was clear enough to his contemporaries).

  Does this undermine his philosophy? **Yes, but in a specific way.**

  It exposes the fragility of Rationalism when it lacks an empirical brake.
  *   **The Chemist's Brake:** If your theory says gold should float, and it sinks, you are wrong. The data corrects the definition.
  *   **Hobbes's Brake:** If your reasoning says the circle is squared, and another mathematician says it isn't, you must check the *logic*.

  Hobbes's failure suggests that "settling significations" is not a magic shield against error. You can have perfect definitions and still make a mistake in the "reckoning" (the logical deduction). Hobbes was so convinced of his own method—that he was constructing truth from definitions—that he became blind to the possibility that his construction was flawed.

  For a philosopher who built a system on the idea that human reason is prone to error and needs the sovereign to keep it in check, his personal inability to submit his geometric "proofs" to the sovereign authority of mathematical consensus is a profound contradiction.

  ### 5. Summary for the Retired Chemist
  To synthesize this for your reading of *Leviathan*:

  1.  **Don't read "Science" as "Empiricism."** Read it as "Certainty." Hobbes is admitting that we can't be certain about the physical world (chemistry, biology) because we didn't make it. We can only be certain about abstract systems (geometry, politics) where we define the rules.
  2.  **Definitions are Axioms.** He isn't asking for dictionary definitions; he is asking for stipulative axioms. "Let X stand for Y." Once agreed, the consequences are binding.
  3.  **The Weakness.** His track record with the circle shows that starting with definitions guarantees clarity, but it does not guarantee truth. You can define your way into a box just as easily as you can define your way out. It lacks the "recalcitrant data" that keeps a chemist honest.

  Hobbes is trying to save us from the "lime-twigs" of political rhetoric by forcing us to speak like geometers. It is a noble, rigorous, and ultimately human attempt. That he got stuck in his own lime-twigs over the circle is a reminder that even the greatest architects of reason are still just birds.

  Enjoy the rest of the *Leviathan*. It gets darker, but the logic remains as rigid as he promises. Just keep your empirical eye open; Hobbes would want you to check his reckoning.
