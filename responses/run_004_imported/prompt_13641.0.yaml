answer: |-
  The fire in the grate had gone grey, but Ramsey hadn't moved to poke it. He sat slumped in the leather armchair that had seen better decades, the Lewis offprint resting on his knee like a dead bird. He tapped the ash from his pipe into a saucer that already held a small geography of grey dust.

  "Lewis is clever," Ramsey said, his voice raspy, the Cambridge vowels worn down by forty extra years of argument. "Too clever. He's taken a psychological remark and tried to turn it into a metaphysical law. That's the trouble with you lot now. You think because you can formalize a habit, you've discovered a fact."

  He leaned forward, wincing slightly—a rheumatic twinge, or perhaps just the memory of the operation that never killed him.

  "Look at this triviality result. Lewis proves that if 'If A, then B' is a proposition, a thing that is either true or false, then my degree of belief in it can't match my conditional probability of B given A. Unless the world is terribly boring. So, the fork. Either I give up the equation—the one I wrote in the margin of a paper before breakfast one morning—or I admit that 'If A, then B' isn't a proposition at all. Adams and Edgington choose the latter. They say conditionals don't state facts. They have assertibility conditions, not truth conditions."

  He paused, looking at the visitor over the rim of his spectacles.

  "And you're worried this smells of Wittgenstein. Of the *Tractatus*. You're thinking: here we go again. A whole class of sentences that are meaningful, useful, essential to human life, but which somehow float above the realm of Fact. You hear the echo, don't you? 'Whereof one cannot speak, thereof one must be silent.' You think Adams is saying, 'Whereof one cannot assign a truth value, thereof one must not call it a proposition.' And you know what I said about Ludwig. That what we can't say, we can't say, and we can't whistle it either."

  Ramsey chuckled, a dry, hacking sound.

  "It is a tempting parallel. Superficially, it looks like the same mysticism dressed in formal clothes. The young Wittgenstein thought there were important things—ethics, aesthetics, the meaning of life—that couldn't be *said* because they didn't picture states of affairs. They *showed* themselves. It was all very solemn. Very German. I hated it. I hated it because it was an excuse for muddiness. If you can't say it, don't pretend it's a secret message. It's usually just nonsense."

  He picked up the paper again, crumpling the corner slightly.

  "But Adams isn't Wittgenstein. That's the point. Wittgenstein's silence was a boundary. A fence around the world. He thought we were bumping against the limits of language. Adams isn't putting up a fence. He's just looking at the tool. When I wrote that note in '29, I wasn't talking about truth. I was talking about *belief*. I said: if two people are arguing 'If A, will B?', they are adding A hypothetically to their stock of knowledge and arguing about B. That's a description of what we *do*. It's a map of how we navigate."

  Ramsey stood up and walked to the window, looking out at the Fellows' Garden.

  "Lewis made the mistake of thinking that for a sentence to be meaningful, it must correspond to a 'conditional fact'. A weird sort of fact that lives in possible worlds or some such. He proved those facts can't exist without trivializing the world. So Lewis says, 'The equation is wrong.' Adams says, 'The demand for a fact is wrong.' I say Adams is closer to the spirit of it. Because for me, truth was never the primary notion. Success was. A belief is a map by which we steer. If the map works, if the conditional probability guides my actions correctly, then the sentence is doing its job."

  He turned back, eyes brightening.

  "The *Tractatus* mysticism was that the unsayable was *higher*. Better. Beyond the physical. Adams isn't saying conditionals are holy. He's saying they're functional. They aren't pictures of the world; they're rules for updating the map. There's no whistling here. There's no secret meaning hovering in the ether. There's just a recognition that not every noise we make is a claim about furniture. Sometimes it's a instruction for the carpenter."

  Ramsey sat back down heavily.

  "Wittgenstein wanted to protect the mystical from the scientists. Adams is just protecting the conditional from the logicians. He's saying: stop trying to force 'if' into the box marked 'True/False' when it clearly belongs in the box marked 'Useful/Useless'. That's not silence. That's clarity. It's exactly what I wanted in '29. I wanted to get rid of the metaphysical fog. Lewis is creating fog by insisting there must be a 'fact' there for the sentence to catch onto. Adams clears it away."

  He tapped the pipe against the saucer, hard.

  "So no. I don't feel the awkwardness. I feel relief. The only thing I can't whistle is a tune I don't know. But a conditional isn't a tune. It's a bet. And Adams has finally worked out the odds without inventing imaginary facts to back them up. Tell your friend Lewis he's a brilliant mathematician, but he's trying to find a ghost in the machine. And tell Adams... tell Adams he's finally cleaned up my mess. Though he could have cited me more prominently."

  Ramsey reached for the teapot.

  "Now, pour. And don't tell me about possible worlds. I've had enough of worlds that don't exist to last a lifetime."
