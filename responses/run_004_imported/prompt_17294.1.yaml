      *   *Move-by-Move:* Use clear headings. Assess strengths/weaknesses. Declare a "point winner" for each round but nuance it.
      *   *Background Check:* Explicitly discuss the Bennett and Arpaly connections.
      *   *Conclusion:* Summarize the stalemate/trade-off (Textual Kant vs. Moral Reality).

  7.  **Refining the Tone:**
      *   Ensure I don't just say "Mara is right." The prompt asks who has the better of it *at each stage*.
      *   Make sure to highlight that Devon is actually being a *good* Kantian, even if the conclusion is unpalatable.
