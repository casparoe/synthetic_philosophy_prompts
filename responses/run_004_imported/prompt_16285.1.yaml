answer: |-
  Here are nine interview questions designed for your ethics podcast, structured to move from the historical specifics of Anscombe's pamphlet to the meta-ethical underpinnings of her argument, and finally to contemporary implications.

  **1. The Nature of the Protest**
  Elizabeth Anscombe's protest against Oxford granting Truman an honorary degree wasn't just a political statement; it was a philosophical intervention into the public square. In *Mr. Truman's Degree*, she argues that conferring the degree implies the university approves of Truman's acts. Beyond the specific verdict on Truman, what was Anscombe trying to teach us about the relationship between institutional honor and moral complicity?

  **2. Absolutism Without Pacifism**
  A common misconception is that Anscombe's position entails pacifism. However, she believed in the possibility of a just war. Can you clarify how she distinguishes between legitimate acts of war that result in civilian casualties and Truman's decision? Where exactly does the line cross from "tragic collateral damage" to "murder" in her framework?

  **3. The Closeness Problem (Intention vs. Foresight)**
  Anscombe's defense relies heavily on the Doctrine of Double Effect, specifically the distinction between intending a civilian's death as a means to end the war versus merely foreseeing it. Critics raise the "closeness problem": when an effect is so tightly bound to the action that it cannot be avoided without abandoning the act itself (e.g., destroying a city to force surrender), isn't the distinction between intention and foresight psychologically and morally untenable? How do you respond to the claim that "foresight of certainty" collapses into "intention"?

  *   **Follow-up:** *If you argue that intention is a distinct mental act separate from foresight:* How do we verify that mental act in a historical figure like Truman? If the external behavior and the known outcome are identical regardless of his internal mental state, does the moral weight of "intention" rest on a fiction we can never truly access?

  **4. Historical Contingency vs. Moral Absolute**
  Many historians argue that Japan was already seeking surrender terms prior to the bombings, suggesting Truman's act was unnecessary even by utilitarian standards. However, for an Anscombian absolutist, should that historical debate even matter? If the intentional killing of the innocent is intrinsically evil, does the fact that the bomb *might* have shortened the war become morally irrelevant, or does the necessity argument simply compound the error?

  **5. The "Corrupt Mind" Charge**
  In *Modern Moral Philosophy*, Anscombe writes that treating the intentional killing of the innocent as an open question of cost-benefit calculation demonstrates a "corrupt mind." Critics argue this isn't a philosophical argument but a refusal to give one—a way of insulating deontology from consequentialist critique by pathologizing the opponent. Is this charge a substantive meta-ethical claim about the limits of reasoning, or is it ultimately a rhetorical shutdown?

  *   **Follow-up:** *If you argue it is a substantive claim about the limits of reasoning:* If consequentialist reasoning is a symptom of corruption rather than a valid opposing view, does that make dialogue between your position and policymakers (like your host's father) impossible? How do we persuade a "corrupt mind" to change if it operates on a fundamentally different moral grammar?

  **6. The Utilitarian Pressure Point**
  My father, a retired Air Force officer, argues that moral philosophy collapses when faced with the "greater evil" scenario: if killing 100,000 civilians definitively saves a million lives, refusing to do so is not virtue, but vanity. Without resorting to religious authority, how do you explain to a military pragmatist why the prohibition against killing innocents trumps the arithmetic of survival?

  **7. Conventional Terror-Bombing**
  Anscombe focused on the atomic bomb, but the firebombing of Tokyo and Dresden involved conventional weapons used with the explicit intent of breaking civilian morale through mass death. Does your defense of Anscombe's charge against Truman equally convict the architects of the conventional terror-bombing campaigns, such as Curtis LeMay? If so, does this implicate the broader Allied strategy in the same moral category as the atomic attacks?

  *   **Follow-up:** *If you argue that Dresden and Tokyo were equally morally culpable:* This challenges the "Good War" narrative central to modern Western identity. If the victors of WWII are guilty of mass murder under Anscombe's framework, does that undermine the moral legitimacy of the post-war international order they built?

  **8. Command and Complicity**
  In a modern bureaucracy, responsibility is diffuse. Truman gave the order, but scientists built the weapon, generals selected the targets, and pilots dropped the bomb. Under Anscombe's ethics, where does the culpability lie? Is the pilot who drops the bomb as guilty as the President who orders it, or does the structure of military command mitigate the moral agency of those lower down the chain?

  **9. Nuclear Deterrence and the Future**
  To close, I want to bring this into the present. Current nuclear deterrence policy relies on the threat of inflicting unacceptable damage on civilian populations to prevent aggression. If Truman was a murderer for *executing* this threat, is a nation guilty for *maintaining the capability and intent* to do so? Does Anscombe's logic require the immediate abolition of nuclear deterrence, regardless of the geopolitical stability it purportedly provides?
