      *   Backward Induction: If Q4 defects, Q3 knows this, so Q3 defects to minimize loss/maximize leverage. If Q3 defects, Q2 defects... leading to Q1 defecting.

  3.  **Drafting - Section 1: The Case for Backward Induction (The Orthodoxy):**
