prompt: |-
  I sit on the editorial standards committee at the science magazine where I work, and we've reached a genuine impasse. A reporter's draft on a proposed new fundamental particle stated flatly that 'physicists have discovered' it. One committee member now wants us to adopt a standing rule: any claim about unobservable theoretical entities must be hedged (e.g., 'current evidence suggests'), since history is littered with once-confident theories -- phlogiston, caloric, the luminiferous ether -- that turned out not to exist, so today's confident talk of quarks or dark matter deserves the same caution. A more senior editor thinks this is a serious overcorrection: applied consistently, it would make our coverage of evolution, plate tectonics, and climate change sound as tentative as our coverage of string theory or the multiverse -- which he thinks misrepresents how settled that science actually is and hands ammunition to denialists. Both have a real point, and neither will budge. Please draft the short memo I'll circulate before Monday's meeting: give reporters and editors usable criteria -- not just 'it depends' -- for when and how much to hedge, show how those criteria would sort the examples above, and take seriously what's right about the blanket-hedging instinct before explaining why the committee is or isn't adopting it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the editorial standards committee at a science magazine.
      *   **Task:** Draft a short memo to circulate before Monday's meeting.
      *   **Context:** An impasse exists between two committee members regarding hedging language for unobservable theoretical entities.
          *   *Member A (Pro-Hedging):* Wants a standing rule to hedge all claims about unobservable entities (e.g., "current evidence suggests") because history shows theories like phlogiston/ether were wrong. Applies to quarks, dark matter, etc.
          *   *Member B (Anti-Overcorrection):* Thinks this is too extreme. It would make settled science (evolution, plate tectonics, climate change) sound as tentative as speculative science (string theory, multiverse), potentially aiding denialists.
      *   **Requirements:**
          *   Provide usable criteria (not just "it depends").
          *   Show how criteria apply to the specific examples mentioned (phlogiston, quarks, dark matter, evolution, plate tectonics, climate change, string theory, multiverse).
          *   Acknowledge the validity of the pro-hedging instinct (epistemic humility).
          *   State a recommendation on whether to adopt the blanket rule (implied: find a middle ground/solution).
          *   Tone: Professional, decisive but collaborative, clear, editorial.

  2.  **Determine the Stance/Resolution:**
      *   A blanket rule (Member A) is indeed problematic for the reasons Member B states. It creates false equivalence between well-supported theories and speculative ones.
      *   However, Member A's point about epistemic humility is valid. We shouldn't speak of *any* scientific entity as absolute metaphysical truth.
      *   *Solution:* Differentiate based on *consensus and predictive utility*, not just observability. "Unobservable" is a tricky category (electrons are unobservable to the naked eye but effectively real). The criteria should focus on the *weight of evidence* and *scientific consensus*, not just ontology.
      *   *Decision:* Do not adopt the blanket hedging rule. Instead, adopt a tiered framework for certainty.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the debate. Validate both sides. State the purpose of the memo (to propose a framework for Monday's discussion).
      *   **The Core Principle:** Epistemic precision. We match language to the strength of the evidence, not just the ontological status of the entity.
      *   **The Criteria (The "Usable" Part):** Need 3-4 clear tiers.
          *   *Tier 1: Settled/Operational Reality.* (Electrons, DNA, Plate Tectonics). Language: Direct.
          *   *Tier 2: Strong Inference/Standard Model.* (Quarks, Dark Matter). Language: Confident but acknowledging indirect detection.
          *   *Tier 3: Speculative/Theoretical.* (String Theory, Multiverse). Language: Heavily hedged.
          *   *Key Differentiator:* Is it the *only* viable explanation? Is it predictive? Is there consensus?
      *   **Addressing the Examples:**
          *   *Phlogiston/Ether:* Retrospectively wrong, but at the time lacked predictive power compared to alternatives eventually.
          *   *Quarks/Dark Matter:* Indirectly observed but essential to the model. High confidence.
          *   *Evolution/Climate/Plate Tectonics:* Overwhelming evidence. Hedging here is misleading.
          *   *String Theory/Multiverse:* No empirical verification yet. Needs hedging.
      *   **Addressing Member A's Point:** Acknowledge that science is fallible. We aren't claiming metaphysical truth, but operational reliability.
      *   **Addressing Member B's Point:** False equivalence harms public understanding.
      *   **Recommendation:** Reject the blanket rule. Adopt the tiered framework.
      *   **Closing:** Call to action for the meeting.

  4.  **Refining the Tone:**
      *   Needs to be diplomatic. I'm not dictating, I'm facilitating a decision.
      *   Needs to be authoritative enough to guide the discussion.
      *   Avoid jargon where possible.
      *   *Self-Correction on "Unobservable":* I need to be careful here. Quarks are "unobservable" in isolation (confinement), but their effects are measurable. Dark Matter is inferred. Evolution is a process observed in real-time and via fossils. The distinction isn't strictly "observable vs. unobservable" but "directly measurable vs. inferred vs. theoretical." I should refine the criteria to reflect *evidentiary status*.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Subject Line:* Needs to be clear. "Proposal for Editorial Standards on Scientific Certainty."
      *   *Intro:* Mention the draft that sparked this. Acknowledge the tension between humility and accuracy.
      *   *The Framework:* Let's call it the "Evidentiary Tiers."
          *   Tier 1: Empirical Consensus (Climate, Evolution).
          *   Tier 2: Inferred Entities (Quarks, Dark Matter).
          *   Tier 3: Hypothetical Frameworks (Strings, Multiverse).
      *   *Addressing the "Blanket Rule":* Explain why it fails. It treats Tier 1 and Tier 3 the same.
      *   *Addressing the "Humility" concern:* We can acknowledge fallibility without weakening the statement of current consensus.
      *   *Action:* Vote on this framework Monday.

  6.  **Review against Constraints:**
      *   Short memo? Yes, keep it tight.
      *   Usable criteria? Yes, the tiers.
      *   Sort the examples? Yes, included in the tiers.
      *   Take pro-hedging seriously? Yes, in the "Principle" section.
      *   State adoption decision? Yes, recommend rejecting the blanket rule in favor of the framework.

  7.  **Final Polish:** Check for clarity and tone. Ensure the distinction between "ontological reality" and "scientific utility" is clear but not overly philosophical. Make sure the recommendation is clear: We are *not* adopting the blanket rule, but we *are* adopting a nuanced guideline. (Wait, as a committee member drafting *before* the meeting, I should probably frame it as a *proposal* for the committee to decide, rather than a unilateral decision, though the prompt asks me to "take seriously... before explaining why the committee is or isn't adopting it." This implies I have the authority to make the call or strongly lead it. I will frame it as a recommendation to resolve the impasse.)

      *Correction:* The prompt says "I sit on the editorial standards committee... draft the short memo I'll circulate." It implies I am trying to break the deadlock. I should propose a path forward that the committee can likely agree on. I will frame the recommendation as the proposed standard for adoption.

      *Refining the "Unobservable" nuance:* The prompt specifically mentions "unobservable theoretical entities." I need to address that specific phrase. Quarks are theoretically unobservable in isolation. Dark matter is unobservable directly. But they are different from the Multiverse. The criteria must distinguish between *inferred from robust data* vs *postulated to solve theoretical problems.*

      *Let's structure the criteria around "Inference vs. Speculation."*

      *Okay, ready to write.*

  8.  **Final check of the prompt requirements:**
      *   "give reporters and editors usable criteria -- not just 'it depends'" -> Create a checklist or tier system.
      *   "show how those criteria would sort the examples above" -> Explicitly map phlogiston, quarks, evolution, etc.
      *   "take seriously what's right about the blanket-hedging instinct" -> Acknowledge the history of error.
      *   "explaining why the committee is or isn't adopting it" -> Make a decision.

      *Decision:* I will recommend *against* the blanket rule but *for* a specific set of guidelines that incorporate the humility Member A wants without the false equivalence Member B fears.

      *(Self-Correction during drafting)*: Keep it concise. Editors are busy. Use bullet points.

      *(Final thought on tone)*: Ensure it doesn't sound like I'm siding entirely with the Senior Editor. I need to validate the Junior Member's philosophical point while rejecting their policy prescription.

      *Let's go.*
answer: |-
  **TO:** Editorial Standards Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Proposal: Guidelines for Language on Theoretical Entities

  Colleagues,

  Regarding the impasse over our recent draft on the proposed new particle: We are stuck between two valid concerns. One side rightly demands epistemic humility, noting that history is full of confident errors (phlogiston, the ether). The other rightly warns that excessive hedging creates false equivalence, making settled science (evolution, climate change) sound as speculative as string theory.

  A blanket rule requiring hedging for all "unobservable theoretical entities" is unworkable. It conflates *inferred entities* (supported by overwhelming indirect data) with *hypothetical frameworks* (supported primarily by mathematical consistency).

  To resolve this, I propose we reject the blanket rule and instead adopt the **Evidentiary Tier Framework** below. This gives reporters usable criteria for when to hedge and when to speak directly.

  ### The Evidentiary Tier Framework

  **Tier 1: Operational Fact (Direct or Overwhelming Indirect Evidence)**
  *   **Criteria:** The entity or process is detected by multiple independent methods; the model has high predictive power; there is near-universal consensus; no viable competing theory exists.
  *   **Language:** Direct. Avoid "suggests" or "theorized."
  *   **Examples:** Electrons, DNA, Plate Tectonics, Human-Driven Climate Change, Evolution by Natural Selection.
  *   **Verdict:** Do not hedge. To do so misrepresents the scientific consensus.

  **Tier 2: Robust Inference (Standard Model Entities)**
  *   **Criteria:** The entity cannot be isolated/observed directly (e.g., due to physical constraints) but is the *only* viable explanation for consistent, reproducible data. It is part of a tested framework.
  *   **Language:** Confident but precise. Acknowledge the method of detection (e.g., "detected via," "inferred from").
  *   **Examples:** Quarks (confined), Dark Matter (gravitational effects), Black Holes (pre-2019 imaging).
  *   **Verdict:** Minimal hedging. It is accurate to say physicists "discovered" the Higgs boson, provided we explain the detection method. We treat these as real because the alternative requires discarding successful physics.

  **Tier 3: Hypothetical/Speculative (Theoretical Necessity)**
  *   **Criteria:** The entity is postulated to solve a theoretical problem or unify models but lacks direct empirical verification or unique predictive signatures. Competing models exist.
  *   **Language:** Explicitly hedged. Use "proposed," "hypothesized," "if confirmed."
  *   **Examples:** String Theory, The Multiverse, Supersymmetry (currently), the new particle in our recent draft (prior to independent replication).
  *   **Verdict:** Heavy hedging required. This is where the "phlogiston risk" is real.

  ### Why We Are Not Adopting the Blanket Rule

  The proposal to hedge *all* unobservable entities assumes that "observability" is the primary marker of truth. It is not. **Predictive utility and consensus are.**

  *   **What the Blanket Rule Gets Right:** Science is fallible. Dark Matter could theoretically be disproven by a modified gravity theory. We must never present science as religious dogma.
  *   **Why the Blanket Rule Fails:** It applies the uncertainty of Tier 3 to the stability of Tier 1. Telling readers that evolution is merely "suggested by evidence" while simultaneously saying the Multiverse is "suggested by evidence" fuels denialism by obscuring the massive gap in evidentiary weight between the two.

  ### Action Item

  For Monday's meeting, please review the Tier Framework. If accepted, we will update our Style Guide to reflect these distinctions. Reporters will be instructed to classify their subject matter into these tiers to determine appropriate verb strength.

  This allows us to be humble about the frontiers of physics (Tier 3) without being misleading about the foundations (Tier 1 & 2).

  See you Monday.
