      *   **Tiling Agents/Löbian Obstacle:** An agent $A_1$ wants to create $A_2$ such that $A_1$ trusts $A_2$'s reasoning. If $A_1$ and $A_2$ use the same system, $A_1$ needs to prove "If $A_2$ proves $\phi$, then $\phi$". This triggers Löb's theorem, leading to inconsistency or a loss of strength (hence the need for parameterized trust or probabilistic approaches).
      *   **Gödel's 1951 Gibbs Lecture:**
