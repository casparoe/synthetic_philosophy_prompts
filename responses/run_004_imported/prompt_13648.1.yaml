answer: |-
  This is an excellent objection. You have effectively reconstructed a version of the **Sorites paradox** (or the "continuum problem") as applied to value theory. This is not a novice worry; it is one of the most persistent and serious challenges raised against Chang's parity view in the meta-ethical literature.

  Here is a blunt assessment of your argument's validity, its standing in the literature, and whether your friend's reply saves Chang.

  ### 1. Validity Assessment
  **Is your reconstruction valid?**
  Yes. As a logical structure, your objection is valid. You have correctly identified that if a relation $R$ (parity) holds between $A$ and $B$, and $R$ is presumed to tolerate small improvements (the inductive premise of the Sorites), then by repeated application, $R$ must hold between $A^*$ (drastically improved) and $B$. Since $R$ clearly does *not* hold between $A^*$ and $B$ (one is strictly better), one of the premises must be false.

  You present the dilemma correctly:
  1.  **Deny the cumulative result:** This requires a sharp cutoff point where parity suddenly flips to "better than." This seems metaphysically implausible for value (why does one extra dollar of salary flip the relation?).
  2.  **Accept fuzzy boundaries:** This suggests parity is subject to vagueness. If the boundaries of parity are vague, the objection goes, the "hardness" of the choice might just be epistemic vagueness rather than a substantive fourth relation.

  **Does it damage the Small-Improvement Argument (SIA)?**
  It damages the *inference* from the SIA to the conclusion that parity is *sui generis* and distinct from vagueness. The SIA relies on the intuition that $A^+$ is not better than $B$. Your objection shows that this intuition cannot be iterated without collapse. Therefore, the SIA cannot establish parity as a stable, distinct relation without borrowing structural features from the very vagueness view Chang wants to reject.

  ### 2. The Literature Context
  You are not missing a standard response; you are channeling **John Broome**.

  Broome is the primary interlocutor on this issue. In *Rationality Through Reasoning* and various papers, Broome argues that what Chang calls "parity" is simply **vagueness** (or "rough equality"). He argues that when we say two things are "on a par," we are essentially saying it is indeterminate whether one is better than the other.

  Chang's response to Broome (and by extension, to your objection) relies on a specific distinction: **Constitutive Vagueness vs. Boundary Vagueness.**

  *   **Broome's View (Constitutive):** The relation *itself* is vague. There is no fact of the matter about whether $A$ is better than $B$.
  *   **Chang's View (Boundary):** The relation *itself* is precise (it is a distinct normative fact that they are on a par), but the *extension* of the relation (which items fall into the parity zone) may have borderline cases.

  ### 3. Evaluating Your Friend's Reply
  Your friend's reply ("Chang can accept fuzzy boundaries at the edges... without conceding that parity is nothing but vagueness at its core") is actually the **standard Changian defense**.

  Here is why your friend is technically right, but why your dissatisfaction is also philosophically justified.

  **Why your friend is right:**
  Chang can argue that the existence of a Sorites series does not prove the relation *is* vagueness. Consider the concept "bald." There are borderline cases (fuzzy boundaries), but "baldness" is not *nothing but* vagueness; it refers to a specific physical state (hair density). Similarly, Chang argues "parity" refers to a specific normative state (items belonging to the same "neighborhood" of value), even if the edge of that neighborhood is fuzzy. The "work" parity does is explaining why we can make rational choices without a "best" option. Vagueness alone doesn't explain that; it just explains why we are confused.

  **Why you are right to be unsatisfied:**
  Your intuition is that this distinction is fragile. If the boundaries of the parity zone are vague, then in the borderline cases (where the Sorites bites), it is **indeterminate** whether the options are on a par or whether one is better.
  If it is indeterminate whether $A_n$ is better than $B$ or on a par with $B$, then the "hard choice" at $A_n$ looks exactly like the vagueness view Chang rejects. The "fourth relation" disappears in the very cases where the Sorites pressure is highest.

  Chang tries to solve this by arguing that **parity is non-transitive**.
  *   $A$ is on a par with $B$.
  *   $A^+$ is on a par with $A$.
  *   This does *not* imply $A^+$ is on a par with $B$.
  This blocks the Sorites chain logically. However, critics (like you) argue this just pushes the problem back: What is the relation between $A^+$ and $B$? If it's still parity, the chain continues. If it's "better than," we have a sharp cutoff. If it's "indeterminate," we are back to vagueness.

  ### 4. The Verdict

  **Does the objection succeed?**
  It succeeds in showing that Chang cannot have it both ways. She cannot claim parity is **sharply distinct** from vagueness while also claiming it behaves smoothly enough to cover intuitive cases of hard choices (like Lawyer vs. Clarinetist) without arbitrary cutoffs.

  **Does it refute the existence of parity?**
  No. It does not prove parity doesn't exist. It proves that if parity exists, it likely shares structural features with vagueness (specifically, boundary indeterminacy).

  **Assessment of the Debate:**
  *   **Your Objection:** Strong. It highlights that the "Small-Improvement Argument" relies on a premise (that $A^+$ is not better than $B$) that cannot be sustained across a continuum without admitting vagueness.
  *   **Your Friend's Reply:** Standard and defensible, but it concedes more ground than Chang sometimes admits. It admits that parity has vague boundaries, which weakens the claim that it is wholly distinct from the vagueness view.
  *   **Chang's Position:** She maintains that the *source* of the difficulty in hard choices is not the vagueness of the boundaries, but the **normative significance** of the parity relation itself (i.e., that we must create reasons through commitment). Even if the boundaries are fuzzy, the *experience* of the choice is distinct from mere ignorance.

  ### Summary Advice for Your Argument
  If you continue this debate, pivot from asking "Is there a sharp cutoff?" to asking **"What is the truth value of claims in the boundary zone?"**

  1.  Ask your friend: In the middle of the Sorites chain (where $A_n$ is significantly better than $A$ but not yet clearly superior to $B$), is it **true** that $A_n$ is on a par with $B$?
  2.  If they say **Yes**: They accept the Sorites conclusion (that eventually a vastly superior option is on a par), which is absurd.
  3.  If they say **No**: They must identify where it becomes false. If they can't, they admit the boundary is vague.
  4.  If they admit the boundary is vague: Press the point that a "vague boundary" implies that for some cases, there is **no fact of the matter** whether the relation is parity or better-than. If there is no fact of the matter, then the "hardness" of the choice is indeed due to indeterminacy (vagueness), not a substantive fourth relation.

  **Conclusion:** Your objection is valid and strikes at the weakest point of Chang's theory. Your friend's reply is the standard defense, but it requires accepting that parity is *compatible* with vagueness, which softens Chang's original hardline claim that parity is *not* vagueness. You haven't missed a standard response; you've identified the exact friction point that keeps this debate alive in meta-ethics.
