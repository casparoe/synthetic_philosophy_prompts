      *   *Key takeaway for the eulogy:* Perspective matters. What looks infinite/uncountable from one view might look manageable from another, but the internal experience of "uncountability" (richness, complexity) is still real *within that context*. Or conversely, a life that seems small/countable from the outside contains universes from the inside.

