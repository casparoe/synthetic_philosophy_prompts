answer: |-
  **MEMORANDUM**

  **TO:** The University Consortium for Shared Detector Facilities (UCSDF)
  **FROM:** Beamtime Allocation Committee (BAC)
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Proposal to Integrate Prediction Markets into Allocation Protocol (FY2024 Pilot)

  ### 1. Context and Charge

  At the September convening, the Committee considered a proposal to partially replace our traditional peer-review scoring system with a futarchy-based mechanism ("vote on values, bet on beliefs"). The proponents argue that prediction markets aggregate dispersed information more efficiently than committee heuristics, aligning allocation with the probability of scientific output rather than the reputation of the proposer. The opponents argue that such a mechanism introduces wealth bias and systematically undervalues essential but low-yield maintenance work (calibration, replication, null-result searches).

  As experimentalists, we recognize that no measurement apparatus is perfect, and no control system is without systematic error. Our current peer-review process suffers from conservatism and potential groupthink. However, the proposed market mechanism introduces new systematic errors regarding public goods and equity.

  After deliberation, the Committee recommends **adopting a modified, hybrid pilot scheme** for the upcoming fiscal year. We will not replace peer review, but we will instantiate a controlled experiment to test the epistemic utility of prediction markets in science allocation.

  ### 2. Committee Decision: The "Split-Stream" Pilot

  We authorize a pilot program allocating **15% of total available beamtime** via a prediction market mechanism. The remaining **85% will continue to be allocated via traditional peer review.**

  This decision accepts the proponents' premise that markets may identify high-risk/high-reward opportunities that committees miss, but it accepts the opponents' premise that markets cannot be trusted with the foundational infrastructure of the field. By treating this as a controlled experiment with a control group (the 85% traditional pool), we generate data on the mechanism's efficacy without jeopardizing the facility's core mission.

  ### 3. Concrete Design Specifications

  To address the ethical and practical constraints of an academic environment, the pilot will deviate from the proponents' initial "real-money" request in specific ways designed to isolate *epistemic accuracy* from *financial capacity*.

  **A. The Metric (Vote on Values)**
  The market will optimize for a single, verifiable metric: **"Probability of publication in a Q1 journal within 36 months of beamtime completion."**
  *   *Rationale:* This is binary and auditable. While it risks favoring "salami-slicing," the 36-month window and Q1 requirement impose a quality threshold.
  *   *Governance:* This metric is fixed for the pilot duration to prevent market manipulation via metric redefinition.

  **B. The Currency (Modified "Skin in the Game")**
  Contrary to the initial proposal, **no real money will be wagered.** University policy and equity concerns preclude gambling mechanisms. Instead, traders will utilize **"Reputation Credits" (RC).**
  *   *Endowment:* All eligible traders receive an equal endowment of RC at the start of the cycle.
  *   *Stake:* Traders must lock RC to buy shares in proposals. Correct predictions yield RC; incorrect predictions lose RC.
  *   *Incentive:* RC balances will be published on a leaderboard. Top performers gain priority access to request beamtime in the *traditional* 85% pool for their own groups in the following cycle. This ties market performance to professional standing rather than personal wealth.

  **C. Eligible Traders**
  Participation is restricted to personnel with active beamtime proposals in the current cycle (PIs and Co-Is).
  *   *Rationale:* This ensures traders have domain expertise ("qualified physicists") and professional skin in the game, mitigating the risk of noise traders or external speculators.

  **D. The Allocation Mechanism**
  Proposals submitted to the 15% "High-Variance" stream are traded for two weeks. Beamtime is allocated proportionally to the final market price of the shares. A proposal with a market probability of 0.8 receives more time than one at 0.3. Proposals failing to reach a minimum liquidity threshold revert to the traditional pool.

  ### 4. Response to the Strongest Objection (The "Public Goods" Problem)

  The most compelling argument against the futarchy proposal is that **prediction markets systematically undervalue public goods.**

  Calibration runs, detector maintenance, and replication studies are the "infrastructure" of our field. They produce low variance in publication metrics but are necessary for the validity of *all* results. A market optimized for "Q1 publications within 3 years" will inevitably price these activities near zero. If we relied solely on the market, the detector would drift, systematic errors would go unnoticed, and the field would lose its capacity for self-correction.

  **Our Response:**
  We accept this objection as valid for the *marginal* utility of beamtime, but not for the *infrastructural* baseline. This is the primary justification for the **85/15 split.**

  1.  **Ring-Fencing Infrastructure:** The traditional 85% pool remains under Committee control. The Committee is explicitly charged with mandating calibration and maintenance time *before* the market opens. The market is only permitted to bid on the *surplus* capacity. This ensures the "unglamorous work" is funded by fiat, recognizing it as a public good that markets cannot price correctly.
  2.  **Epistemic Limits of Markets:** Markets are excellent at aggregating beliefs about *uncertain outcomes* (e.g., "Will this new symmetry search yield a signal?"). They are poor at valuing *certain necessities* (e.g., "We must calibrate the calorimeter"). By restricting the market to the high-risk pool, we utilize the market where it has a comparative advantage (risk assessment) and retain bureaucratic governance where it is superior (public good provision).
  3.  **Wealth vs. Expertise:** The opponents' second concern—that influence would flow to those with "spare cash"—is neutralized by the Reputation Credit system. Since all traders start with equal RC, and the payout is professional priority rather than cash, the mechanism tests *judgment*, not *liquidity*.

  ### 5. Conclusion and Next Steps

  We are physicists. We do not know a priori if futarchy improves allocation efficiency in science. We have a hypothesis. We now design an experiment to test it.

  If, after three years, the 15% market pool yields a statistically significant increase in high-impact output per beam-hour compared to the 85% control pool—without degrading detector stability—we will consider expanding the market share. If the market encourages gaming or fails to outperform the Committee, the pilot will be terminated.

  **Action Items:**
  *   **IT Department:** Develop the secure RC trading platform by December 1.
  *   **Secretariat:** Draft the legal waiver for the metric definition (Q1/36-month).
  *   **Committee:** Identify the mandatory calibration blocks for the 85% pool by January 15.

  We proceed not on faith in the market, nor on faith in the committee, but on faith in the method.

  Signed,

  *The Beamtime Allocation Committee*
  *Chair: Dr. Elena Rostova*
