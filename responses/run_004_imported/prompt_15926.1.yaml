answer: |-
  The wind on the Obsidian Flats didn't blow; it scoured. It carried grit that could strip paint from steel and patience from saints.

  Elara adjusted the goggles of her enviro-suit, squinting at the horizon. Ahead, the silhouette of the Anchor Station shimmered in the heat haze. It was the only fixed point in a region known for magnetic drifts that made GPS scream and die.

  "Stop," Kaelen said. His voice crackled over the comms, tight with that familiar, grinding frustration. He was kneeling in the dust, comparing two holographic projectors splayed on the ground. "We need to talk about the route."

  Elara sighed, the sound loud in her own helmet. "We're three clicks out, Kaelen. The New Survey says the ridge is stable. We walk."

  "The New Survey is false," Kaelen said, tapping the blue hologram. "Just like the Old Chart was false." He gestured to the red hologram beside it. "The Old Chart said this ridge was solid granite. We drilled last year; it was hollow basalt. False. The New Survey says it's 'structural basalt with high tensile strength.' Also false. It's still basalt. It's still not granite. Both maps are lies."

  Elara looked at the ridge, then at the man. They had been friends since the Academy, before Kaelen became obsessed with the epistemology of navigation. "One lie gets us across. The other got Miller's team crushed."

  "That's pragmatic utility," Kaelen snapped, standing up. "That isn't *truth*. You keep saying we're 'getting closer.' Closer to what? The territory is what it is. Either your map matches the territory, or it doesn't. Neither of these matches. Therefore, logically, they are equidistant from reality. You can't be 'a little bit pregnant,' Elara. You can't be 'a little bit true.'"

  Elara walked over and kicked dust over the red hologram. "Miller's team is dead, Kaelen. That feels like a pretty significant distance from where we want to be."

  "That's consequence, not correspondence!" Kaelen was shouting now, the wind stealing his words. "Popper tried to fix this. Verisimilitude. He wanted to say Theory B is closer to the truth than Theory A, even if both are false. But he couldn't define it. Miller and Tichý proved it. If both theories are false, you cannot mathematically compare their truth-content without smuggling in arbitrary weights. Why does 'tensile strength' matter more than 'composition'? That's a human preference, not a feature of the universe!"

  Elara looked at the Anchor Station. It was the goal. The absolute coordinate. "So what's your move, Archivist? Do we sit here until the radiation burns through the suits because neither map is perfect?"

  "I'm saying we acknowledge we are blind," Kaelen said, his voice dropping. "We stop pretending the New Survey is 'better.' It's just... different. A new fiction to replace the old one. In thirty years, they'll laugh at this basalt reading just like we laugh at the granite one."

  Elara checked her oxygen. 45 minutes. "If I follow the Old Chart, I step on a pressure plate at coordinate 404. If I follow the New Survey, I step *over* it."

  "Both maps are wrong about the destination," Kaelen insisted. "The Station isn't where either says it is. The magnetic drift shifts it. So we are navigating toward a ghost using two broken compasses."

  "Then help me fix the compass," Elara said.

  "I can't! That's the point! I can't tell you which error is smaller because 'smaller error' implies a metric of truth we don't have!"

  Elara looked at the ridge. She looked at the New Survey. It showed a path winding through the rocks, marked with green 'safe' zones. The Old Chart showed a straight line.

  "Kaelen," she said softly. "Look at the error bars."

  "What?"

  "The New Survey. It doesn't just give a coordinate. It gives a probability distribution. It says, 'There is a 90% chance the ground holds.' The Old Chart said, 'Ground holds.' Period."

  Kaelen hesitated. "So? It's still a false statement if that 10% hits."

  "But it admits the possibility of being false," Elara said. She stepped toward the ridge. "The Old Chart claimed certainty where there was none. The New Survey claims uncertainty where there is uncertainty. Isn't a map that admits it might be wrong... *truer* about the nature of the world than one that lies about its own perfection?"

  Kaelen stood frozen. The wind howled between them.

  "That's not verisimilitude," he muttered, but he sounded less sure. "That's just... honesty."

  "It's error correction," Elara said. She took a step onto the basalt. It held. "Popper was wrong about the math, maybe. But he was right about the game. We don't get closer by accumulating truths. We get closer by shedding the errors that kill us."

  She walked ten meters. The ground vibrated. A low hum resonated through her boots.

  "Elara, wait," Kaelen warned. "The New Survey didn't account for the harmonic resonance."

  "Nothing did," she said. "That's new data."

  She stopped. Ahead, the ground fractured. A fissure opened, exactly where the New Survey said the path was safe. The green line on the hologram hovered over a drop into darkness.

  Kaelen rushed forward, grabbing her harness. "See! False! It's false!"

  Elara dangled for a second, then Kaelen hauled her back. They collapsed on the solid rock behind the fissure. Dust settled.

  "Both maps are false," Kaelen whispered, shaking. "The Old Chart said bridge. The New Survey said safe path. Both are lies. We are no closer."

  Elara sat up, brushing grit from her visor. She looked at the fissure. Then she looked at her suit's sensors. They were recording the seismic data of the collapse.

  "We know where the hole is now," Elara said.

  "That's one data point."

  "It's one less place to fall," she corrected. She stood up and recalibrated the New Survey. She manually inputted the fissure coordinates. The green line shifted, routing around the hole. "The map isn't the truth, Kaelen. It's a tool for not dying. But look at the sequence."

  She pointed back the way they came. "Ten years ago, we couldn't cross the Flats at all. Five years ago, we crossed but lost vehicles to the basalt. Today, we lost nothing but time. We haven't found the 'True Map.' There is no True Map. The terrain shifts."

  "So we're just running in place," Kaelen said.

  "No," Elara said. She began to walk again, carefully, skirting the new hole. "We're learning how to run."

  Kaelen watched her. He looked at the red hologram, then the blue one. He deactivated the red one. He didn't activate the blue one's 'auto-pilot,' though. He kept it in manual overlay mode.

  "You're saying truth isn't a destination," Kaelen said, falling into step beside her.

  "I'm saying truth isn't a noun," Elara replied. "It's a verb. It's the act of reducing the discrepancy between expectation and reality."

  "But the Miller-Tichý result..."

  "Stands," Elara said. "You can't compare two static falsehoods and declare one 'truer' in a vacuum. But we aren't in a vacuum. We're in a feedback loop. The New Survey wasn't 'truer' because of its content. It was 'truer' because it was *more fragile*. It allowed itself to be broken faster."

  Kaelen looked at the fissure they had just avoided. "It failed."

  "It failed safely," Elara said. "The Old Chart would have had us drive a rover over this. We'd be dead. The New Survey let us walk. We found the error before it cost us everything."

  They reached the edge of the Anchor Station an hour later. The airlock cycled. As they stepped into the pressurized warmth, peeling off their helmets, Kaelen looked at the data pad Elara was uploading.

  "You're sending the fissure data back to Command," he said.

  "Updating the Survey," she said.

  "It'll be wrong again next year," Kaelen said. "The drift will change. The basalt will shift."

  Elara looked at him. She thought about the food pyramids of the past, the atomic models that looked like solar systems, the maps that put dragons in the uncharted seas. All false. All necessary.

  "Then we'll update it again," she said.

  "That's not truth," Kaelen insisted, though the fight was gone from his voice. "That's just... maintenance."

  Elara smiled, tired and dusty. She tapped the screen, sending the correction into the network. Somewhere, another team would receive the update. They wouldn't fall into the hole.

  "Maybe," she said. "But if you can tell the difference between a hole and a path, you're close enough for me."

  Kaelen looked at the screen. The map was still wrong. The Station wasn't exactly where the dots said it was. The margins of error were wide. But the dots were tighter than they had been yesterday.

  "Close enough," Kaelen repeated. He didn't sound convinced, but he sounded like he could live with it. "Just don't call it Truth."

  "I won't," Elara said. "I'll call it 'Less Wrong.'"

  She turned off the projector. The room was dark, save for the blinking lights of the console. Outside, the wind scoured the obsidian, erasing their footprints, resetting the board. But they were inside. And they were alive. And the map for the next traveler would be just a fraction less deadly than the one they had used.

  In the silence, Kaelen nodded. It wasn't an endorsement of progress as a march toward perfection. It was an acceptance of progress as a retreat from catastrophe.

  "Less Wrong," Kaelen said into the dark. "I can navigate by that."
