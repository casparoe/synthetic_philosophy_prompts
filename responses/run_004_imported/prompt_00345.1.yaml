answer: |-
  It is completely understandable why this bugs you. As a bench chemist, you live in a world where explaining known data is often just as valuable as predicting new data. If you propose a mechanism that perfectly accounts for a weird NMR shift that has puzzled the lab for years, your confidence in that mechanism skyrockets. Standard Bayesianism, taken literally, says that shouldn't happen.

  You have identified one of the most persistent headaches in the philosophy of science. It's not just a technical quirk; it strikes at the difference between **ideal rationality** and **human discovery**.

  Here is the breakdown of why the Problem of Old Evidence (POE) is deep, why the math breaks, and how Garber and others try to fix it.

  ### 1. The Mathematical Wall
  Let's look at the Bayes' Theorem equation you know well:

  $$P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)}$$

  Where:
  *   $H$ is the Hypothesis (General Relativity).
  *   $E$ is the Evidence (Mercury's perihelion precession of 43 arcseconds/century).

  In the standard Bayesian model of confirmation, $E$ confirms $H$ if $P(H|E) > P(H)$. Looking at the equation, this happens only if the likelihood ratio pushes the posterior up.

  **The Problem:**
  1.  **$P(E) = 1$:** The evidence is "old." We knew about Mercury's anomaly in 1859. By the time Einstein proposed GR in 1915, $E$ was a certainty. In probability, if you are certain of a proposition, its probability is 1.
  2.  **$P(E|H) = 1$:** If $H$ is true, it entails $E$. GR mathematically requires that precession. So the likelihood is also 1.

  Plug those in:
  $$P(H|E) = \frac{1 \cdot P(H)}{1} = P(H)$$

  **The Result:** Your posterior credence in GR is identical to your prior credence. The evidence provides **zero confirmation**.

  ### 2. Why This Is a "Deep" Problem
  You might ask: *"Why not just say $P(E)$ isn't literally 1? It's just very close to 1."*

  If you do that, you solve the math, but you break the philosophy. Here is why it's deep:

  **A. Logical Omniscience**
  Standard Bayesian epistemology assumes agents are "logically omniscient." It assumes that if you believe a theory $H$, you automatically believe all the logical consequences of $H$ instantly.
  *   **Ideal Agent:** As soon as you conceive of $H$, you know $H \rightarrow E$.
  *   **Human Scientist:** You conceive of $H$, then you do the math (or the experiment), and *then* you realize "Oh wow, $H$ explains $E$."

  The POE highlights that **learning a logical connection is different from learning an empirical fact.** Standard Bayesianism has no room for learning logical connections; it only handles updating on empirical data. If the POE can't be solved, Bayesianism fails to model the actual history of science (like the acceptance of GR).

  **B. Prediction vs. Explanation**
  If the math holds, Bayesianism implies that **only novel predictions confirm theories.** Explaining old data would be worthless.
  *   *Prediction:* "I predict a new planet." (Confirmatory)
  *   *Explanation:* "My theory explains why the old data looked weird." (Not confirmatory?)

  This contradicts scientific practice. Unification and explanatory power are core virtues of science. If Bayesianism can't account for the value of explaining old evidence, it's an inadequate model of scientific reasoning.

  ### 3. The Way Out: Garber's Solution
  In 1983, Daniel Garber proposed the most famous solution. It requires a shift in what we consider the "evidence."

  **The Insight:**
  When Einstein was working on GR, he didn't learn $E$ (the precession). He already knew that. What he learned was the **logical relation** between his new theory and the old data.

  **The Fix:**
  We need to expand the "algebra of propositions." We shouldn't condition on $E$. We should condition on the proposition: **"$H$ entails $E$"** (let's denote this as $H \vdash E$).

  So the update looks like this:
  $$P(H | H \vdash E)$$

  **How it works:**
  1.  Before the derivation, Einstein might have had a prior $P(H)$.
  2.  He was *uncertain* whether his new field equations would actually match the Mercury data. So, $P(H \vdash E) < 1$.
  3.  Once he completed the derivation, he became certain of the relationship: $P(H \vdash E) = 1$.
  4.  Because $H$ explaining $E$ is more likely if $H$ is true than if $H$ is false (roughly speaking), conditioning on this logical connection raises the probability of $H$.

  **In Chemist Terms:**
  Imagine you have a mysterious compound. You have its Mass Spec data ($E$). That data has been sitting on your desk for a week ($P(E)=1$).
  You propose a structure ($H$).
  At first, you aren't sure if structure $H$ actually produces that fragmentation pattern. You run a simulation or do a mental check.
  You realize: "Yes, Structure $H$ *does* produce Mass Spec $E$."
  Your confidence in Structure $H$ goes up.
  **Garber says:** You didn't update on the Mass Spec ($E$). You updated on the realization that **$H$ predicts $E$**. That realization is the *new* information.

  ### 4. Jeffrey and the Algebra of Propositions
  Richard Jeffrey (a giant in Bayesian epistemology) approached this similarly but focused on the structure of the probability space.

  Jeffrey argued that to solve POE, we must admit **logical propositions** into the same probability space as **empirical propositions**.
  *   Standard Bayes: Propositions are about the world (e.g., "The solution is blue").
  *   Jeffrey/Garber: Propositions can be about our theories (e.g., "Theory T implies the solution is blue").

  Jeffrey emphasized that we are not logically omniscient. We have subjective probabilities about logical truths. I can be 90% sure that a specific integral converges, even though mathematically it either does or it doesn't. By allowing uncertainty about logical connections, the "Old Evidence" becomes "New Logical Information."

  ### 5. Is It Solved? (The Criticisms)
  If you talk to a philosopher of science, they will tell you Garber's solution is clever but comes with baggage.

  1.  **The "New" Priors:** To make the math work, you have to assign priors to logical statements (like $P(H \vdash E)$). How do you justify those priors? It introduces a new layer of subjectivity.
  2.  **The Counterfactual Approach:** Some (like Colin Howson) argue we should ignore the actual history and ask: "What *would* my credence be if I *didn't* know $E$?" This tries to reconstruct a "ur-prior." It's intuitive but notoriously difficult to calculate formally.
  3.  **Does it capture the *value*?** Some argue that even if Garber fixes the math, it misses the point. We value GR explaining Mercury not just because we learned a logical link, but because it showed GR was *true* in the real world. Shifting the focus to logical relations feels like moving the goalposts to some realists.

  ### Summary
  You are right to feel that the standard math is missing something.
  *   **The Problem:** Standard Bayesianism assumes you know all consequences of your theories instantly.
  *   **The Reality:** Science involves hard work to derive consequences.
  *   **The Solution (Garber/Jeffrey):** We update not on the *data* (which is old), but on the *discovery that the theory explains the data*.

  For a bench scientist, Garber's view probably feels the most natural. You aren't surprised by the NMR spectrum anymore; you are surprised (and delighted) that your proposed structure actually fits it. That "fit" is the new information that drives your confidence up. Bayesian epistemology just had to get sophisticated enough to measure the "fit" as a probabilistic event itself.
