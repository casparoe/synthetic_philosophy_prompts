      *   **Anti-Luck/Control (let's call him Marcus):** Needs to channel Kant/Nagel's initial intuition but refine it. He should try to save the Control Principle, perhaps using the user's Act/Agent distinction or a nuanced version of culpability vs. blame. He needs to argue that without the Control Principle, morality becomes arbitrary.

  3.  **Drafting - Section by Section:**

      *   **Setting the Scene:** A quiet place, maybe late night. A bar or a park bench. Let's go with a late-night diner. It fits the "post-seminar" vibe.
      *   **Opening:** Establish the stakes immediately. Reference the driver case.
      *   **Round 1: The Driver Case.**
          *   Marcus starts with the Control Principle. It seems intuitive.
