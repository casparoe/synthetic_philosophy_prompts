          *   Elena attacks this: Is that distinction psychologically real? When we punish, we punish the person. The law treats them differently (negligent homicide vs. reckless driving). The "stain" is on the agent.
      *   **Round 3: Agent-Regret & Gauguin.**
          *   Elena brings in Williams' deeper point: Agent-regret isn't just guilt; it's a recognition that *I* did this, regardless of intent. Gauguin's justification is retrospective.
          *   Marcus counters: Gauguin is about *justification*, not *moral worth*. We can acknowledge regret without admitting moral luck. We can say "I wish I hadn't" without "I am evil."
      *   **Round 4: The Function of Blame.**
          *   Elena: Blame is a social practice. It responds to harm. If you remove luck, you remove the object of blame.
          *   Marcus: If blame responds to harm alone, it's just vengeance. Morality needs to be about the will to be *moral*.
      *   **Closing:** No winner. Acknowledge the tension. The Control Principle is normative (how we *should* judge), but Luck is descriptive (how we *do* judge). Or perhaps they are incommensurable.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did I use the user's Act/Agent move? *Yes, Marcus uses it.*
