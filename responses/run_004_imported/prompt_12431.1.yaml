answer: |-
  **Setting:** *A 24-hour diner, 1:30 AM. The coffee is bitter and bottomless. The booth vinyl is cracked. ELena (40s, wears her skepticism like a worn-in coat) and Marcus (30s, precise, clings to structure like a lifeline) have been at this for an hour. Napkins are covered in scribbles.*

  **Marcus:** Let's go back to the drivers. It's the cleanest test case. Driver A and Driver B. Both drink two beers. Both know they shouldn't drive. Both drive home the same route at the same speed. A kid darts out in front of A. Kid dies. A is charged with vehicular homicide. B gets home, parks, goes to sleep. Maybe gets a ticket if caught, but morally? We treat A like a pariah. B gets a shrug.

  **Elena:** And your point remains?

  **Marcus:** My point is that the *difference* between A and B is entirely outside their control. It's a fact about the world, not the will. If morality is about assessing the agent, then A and B are identical. To judge A more harshly is to say the universe's random configuration determines moral worth. That's not morality; that's superstition.

  **Elena:** But it's not superstition, Marcus. It's practice. You're treating the Control Principle as a normative axiom—*ought* implies *can*—but Williams treats it as a psychological falsehood. We *cannot* help but judge A more harshly. And Williams argues we *shouldn't* try to cure ourselves of that reaction.

  **Marcus:** Just because we have a reaction doesn't make it rational. We have a reaction to think the sun revolves around the earth. We correct it. I'm trying to correct the moral intuition. I'm proposing a distinction: We can acknowledge that A's *act* was worse—a child is dead—without judging A's *character* or *culpability* as worse than B's. We blame the outcome, not the soul.

  **Elena:** That's the move you made in the car, isn't it? The Act/Agent distinction.

  **Marcus:** It works. It preserves the Control Principle. A is not a worse *person*. He is an agent who, through bad luck, instantiated a worse state of affairs. We punish the harm to deter and to honor the victim, but we don't need to say A is more *guilty* in the deep sense.

  **Elena:** It's clean. I'll give you that. It's philosophically hygienic. But it doesn't survive contact with the agent themselves. Talk to Driver A. Ask him if he feels the same "guilt" as Driver B.

  **Marcus:** He feels more *regret*.

  **Elena:** No. Williams calls it *agent-regret*. It's distinct from ordinary regret. If I knock over a vase by accident, I feel regret. If I knock over a vase because I was careless, I feel guilt. But if I drive carefully and a kid runs out and I kill him? I feel something heavier than guilt. I feel that *I did it*. My hands are on the wheel. If Driver A tries to comfort himself with "Well, my will was identical to Driver B's," we'd say he's sociopathic. He *owns* the death. That ownership isn't just about the act; it changes who he is.

  **Marcus:** But why should it change who he is? If "who he is" is defined by his choices, and his choices were identical to B's, then the change is illusory. You're conflating *tragic significance* with *moral blameworthiness*. A's life is ruined. That's a tragedy. But is he *more evil*?

  **Elena:** "Evil" is too theological. Let's talk about responsibility. You want to shrink responsibility to fit inside the skin. To the moment of volition. But we live in the world. My responsibility extends to what I *bring about*. If I shoot a gun into a crowd, I am responsible for the bodies that fall, not just the finger twitch. If no one dies, I'm lucky. If they die, I'm a killer. That difference isn't just "state of affairs." It's my moral identity.

  **Marcus:** But that makes morality hostage to fortune. That's Nagel's worry. If my moral standing depends on whether a kid sneezes at the wrong moment, then moral judgment isn't about me. It's about the world.

  **Elena:** Exactly. And Williams says: Good. Morality *shouldn't* be a sheltered kingdom where the will is king. That's a Kantian fantasy. Look at Gauguin. He abandons his family to paint. If he fails, he's a monster. If he succeeds, he's a genius who made a hard choice. The justification is retrospective. It depends on luck.

  **Marcus:** Gauguin is about *justification*, Elena. Not *blame*. That's the slippage. I can grant that the *value* of Gauguin's life depends on success. But his *right* to leave? That depends on his reasons at the time.

  **Elena:** But he doesn't know if he has the right until he succeeds! That's the point. The moral permission is granted by the outcome. Now apply that to the driver. Driver A doesn't know the full weight of his action until the kid hits the bumper. The luck isn't an add-on; it completes the action.

  **Marcus:** Okay, let's press your Act/Agent distinction again. Suppose we accept your view. We judge A as "worse" than B. What work is that doing? If we say A is more blameworthy, are we justifying harsher punishment?

  **Elena:** Yes.

  **Marcus:** On what grounds? If B had the same reckless intent, B is just as dangerous. B is likely to kill someone next Tuesday. A is in jail. If we care about public safety or moral correction, B is the one we need to watch. Punishing A more because a kid happened to be there is vengeance. It's retributive luck.

  **Elena:** It's not vengeance. It's recognition of harm. You can't separate the harm from the wrong. Recklessness is a wrong *because* it risks harm. When the harm materializes, the wrong is actualized. Before the impact, it's a potential wrong. After, it's a real one. You're trying to judge the risk and ignore the realization.

  **Marcus:** But the risk was identical! The probability was the same.

  **Elena:** Probabilities aren't moral categories. Reality is. I can't have a relationship with a probability. The victim's family can't mourn a probability. They mourn a death caused by A. The moral bond between A and the world is severed in a way B's is not.

  **Marcus:** So the moral bond is external? It depends on the victim?

  **Elena:** Morality is relational, Marcus. It's not just about the purity of the agent's will. It's about what happens between people. If I swing a fist and miss, I'm a threat. If I swing and break your nose, I'm an assailant. The nose matters.

  **Marcus:** The nose matters for *tort*. For damages. I grant you that. But for *moral worth*? For the judgment of the soul?

  **Elena:** I don't know what "moral worth" means if it's not the sum of what you do and what happens because of you.

  **Marcus:** Then you've dissolved morality into history. If I'm judged by outcomes, I'm not being judged on my agency. I'm being judged on the weather.

  **Elena:** You keep saying "agency" like it's a ghost in the machine. But agency is the capacity to affect the world. If you affect it differently, your agency *was* different, even if the intention was the same.

  **Marcus:** That's a category error. The *exercise* of agency was different. The *capacity* was the same. Look, I want to save something from this. I want to say: We treat A differently because we must respond to the tragedy. We imprison A. We demand penance. But we don't have to believe A is *intrinsically* more wicked. We can maintain the Control Principle as a regulatory ideal. We say, "In the eyes of God, or the ideal moral court, A and B are equal. But in the human court, A has blood on his hands."

  **Elena:** And who lives in the ideal moral court? Not us.

  **Marcus:** No. But we need the ideal to keep us from becoming barbarians. If we accept resultant luck, we accept that we are not responsible for ourselves. We become leaves in the wind.

  **Elena:** Or we become adults who admit we aren't gods. That we can't control the world, but we are responsible for what we break in it. Williams thinks the Control Principle is a defense mechanism. It's how we protect ourselves from the terror of contingency.

  **Marcus:** And I think Williams' view is a surrender. If you accept resultant luck, you can't coherently blame anyone. Because *everything* is luck. Where did the recklessness come from? Constitutive luck. Why was he driving? Circumstantial luck. If you open the door to resultant luck, the Control Principle collapses entirely. Then you're left with no ground to stand on to blame anyone for anything.

  **Elena:** Then don't look for ground. Look at the practice. We *do* blame. We *do* hold people responsible for outcomes. The theory that says we shouldn't is the one that's out of touch with reality.

  **Marcus:** The theory says we *ought not to*, even if we do. That's what philosophy is for. To correct the instinct.

  **Elena:** To correct it, or to understand it? If you correct this instinct away, you lose the phenomenon of morality entirely. You're left with a hollow shell of "good will."

  **Marcus:** Better a hollow shell than a lottery.

  **Elena:** *(She stirs her coffee. It's cold now.)* Maybe. But Driver A isn't going to feel better knowing his will was pure. And Driver B... Driver B should be terrified. Because he knows he's the same man as A. He just got lucky.

  **Marcus:** He should be terrified of his potential. Not his moral standing.

  **Elena:** Can you separate them? Really?

  **Marcus:** *(He pauses. Looks at the napkin with the driver diagram.)* I want to say yes. Because if I say no, I don't know how to justify forgiveness. If A is actually worse, why forgive him?

  **Elena:** Because he suffered the luck. The agent-regret *is* the punishment.

  **Marcus:** That's not justice. That's fate.

  **Elena:** Maybe morality is just how we navigate fate without lying to ourselves.

  **Marcus:** *(He sighs, puts the pen down.)* I still think you're wrong. I think the Control Principle is the only thing keeping us from judging people for their genetics, their upbringing, and their bad breaks.

  **Elena:** And I think you're using the Control Principle to judge people for their bad breaks while pretending you aren't.

  **Marcus:** *(A small, tired smile.)* Touché.

  **Elena:** Coffee?

  **Marcus:** Yeah. Pour it. We're not going to solve this tonight.

  **Elena:** No. But at least we're not pretending the drivers are the same.

  **Marcus:** And at least I'm not pretending the will doesn't matter.

  *(The waitress refills the mugs. The steam rises between them, obscuring the napkin diagrams for a moment.)*
