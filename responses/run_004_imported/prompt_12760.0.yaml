answer: |-
  **Strategy Note:** This draft is designed to be spoken at a measured, calm pace. It clocks in at approximately 650–700 words, which allows for pauses and emphasis within a five-minute window. The language intentionally avoids taking a stance on the *source* of value (NU vs. CU) while affirming the *importance* of the object (suffering). It validates the veterans' endurance without making the newcomers feel like interlopers.

  ***

  **Opening Remarks**

  Good morning, everyone. Thank you for being here.

  It is a rare thing for us to share a physical room. Usually, this work happens in isolation, in threads, or across video calls. There is value in that distance sometimes, but there is also a specific kind of gravity that comes from sitting together and acknowledging, openly, what we are trying to do.

  We are here to talk about s-risk. We are here to discuss the prevention of astronomically bad outcomes. To say that this is heavy work is an understatement. We are not trying to optimize a margin; we are trying to prevent catastrophes that, if realized, would dwarf all the suffering in history to date. To hold that reality in your head, day after day, requires a specific kind of fortitude.

  I know that fortitude is not infinite.

  Some of you in this room have been holding this line for nearly a decade. You have been thinking about these tail risks since before they had a name. I want to acknowledge that endurance. It is easy to feel that the work moves slower than the urgency demands. It is easy to feel the weight of the stakes. If you are feeling tired, that is a rational response to the subject matter, not a personal failing. Your persistence is the reason the rest of us are able to have this conversation today.

  To those newer to this space: your presence matters. Earnestness is a resource, and we need it. But please listen to the veterans. They have navigated the dead ends and the theoretical traps. There is wisdom in their caution.

  Now, I also know we do not all stand on the same ethical ground. We arrive at this work via different paths. For some, the reduction of suffering is the *only* ultimate priority. For others, it is one critical imperative among several, including the preservation of potential.

  We are not going to resolve that disagreement today. And frankly, we do not need to.

  We do not need to agree on the lexical priority of suffering to agree that suffering is *bad*, that astronomical suffering is *unacceptably bad*, and that there are concrete interventions we can pursue right now to reduce the probability of those outcomes. We can have an overlapping consensus on action, even if our foundational axioms diverge. In fact, that diversity can be a strength. It means we are stress-testing our strategies against different ethical frameworks. If an intervention looks robust from multiple normative angles, it is likely a robust intervention.

  So, my hope for today is that we lean into that robustness.

  We are not here to dwell on the horror of the scenarios we study. We know the horror. We are here to assess tractability. We are here to ask: What can we actually *do*? Where are the leverage points? How do we build governance, technology, and norms that make these worst-case outcomes less likely?

  Let us be honest about the stakes, but let us also be honest about our agency. Despair is not a strategy. Burnout helps no one, least of all those we aim to protect. The most ethical thing we can do for the long-term future is to remain effective, collaborative, and sustainable in our efforts.

  So, let's treat today as a workshop, not a vigil. Let's respect the fault lines without letting them fracture the room. Let's focus on the intersection of our concerns.

  We have a lot of ground to cover. I'm grateful to be working alongside you. Let's get to it.
