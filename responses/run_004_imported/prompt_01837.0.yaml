answer: |-
  **Setting:** *2:15 AM. The common room of a philosophy department, post-conference. The air smells of stale coffee and dry-erase markers. Elias (Monist) is leaning against a whiteboard. Sarah (Pluralist) is slumped in an armchair, holding a lukewarm glass of wine.*

  **Elias:** You keep saying "the cup is on the table" as if it's a datum. It's not. It's a hallucination of grammar.

  **Sarah:** It's a truthmaker, Elias. The cup exists. The table exists. The spatial relation exists. If that doesn't obtain, then what? I'm hallucinating the wine, too?

  **Elias:** You're hallucinating the *is*. Look. *(He turns and writes **CUP — ON — TABLE** on the board.)* You have three entities here. The cup. The table. The relation "on." Now, be honest: does the relation "on" float in the middle like a magnetic field, or is it attached to the cup?

  **Sarah:** It's attached to both. It's a dyadic relation.

  **Elias:** *How?* If "on" is a third thing distinct from the cup and the table, you need a connector to glue "on" to the "cup." Let's call it $R_1$. But now you need a connector to glue $R_1$ to the cup. That's $R_2$. And a connector to glue $R_2$... Sarah, you've bought yourself an infinite regress before you've even finished your sentence.

  **Sarah:** This is the 1910 argument. Russell buried it.

  **Elias:** Russell *stipulated* it away. He said relations have a "sense," a direction, that just *does* the work. That's not an answer; it's a command. "It just relates!" is the philosophical equivalent of "because I said so."

  **Sarah:** It's not magic. It's category error. You're treating relations like relata. You're asking for a relation to relate the relation, which assumes relations are inert objects waiting to be hooked up. They aren't. They're essentially predicative. They're unsaturated.

  **Elias:** "Unsaturated." Lovely metaphor. But ontologically? If the relation is incomplete, it's not a thing. If it is a thing, it's complete, and you're back at the regress. You can't have it both ways. You want the relation to be real enough to ground truth, but ghostly enough to avoid needing glue.

  **Sarah:** Fine. Let's upgrade. Armstrong. States of Affairs. The fundamental unit of reality isn't "cup" plus "table" plus "on." It's *[Cup-being-on-Table]*. A single ontological atom. You don't need glue inside an atom.

  **Elias:** *(Turns from the board, smiling thinly.)* Ah, the "Non-Relational Tie." So you've just taken the problem, shrunk it down, and put a label on it that says *Do Not Open: Mystery Inside*. You're telling me that "instantiation" or "exemplification" isn't a relation?

  **Sarah:** It's not a *further* relation. It's the difference between a list and a fact.

  **Elias:** But *what makes* the difference? If I write "Cup, Table, On" on a shopping list, I have all the constituents. If I write "The cup is on the table," I have... what? A ghost in the machine? If the State of Affairs is just the constituents, you lose the structure. If it's the constituents *plus* something else, you're back to my regress. If it's the constituents *plus* nothing, then the list is the fact. And the list is false.

  **Sarah:** *(Stands up, walks to the board.)* You're obsessed with the glue. I'm obsessed with the truth. Look. *(She writes: **Alice is wise**.)* Now this: **Alice, wise, is**.

  **Elias:** A list.

  **Sarah:** Same words. Same constituents. But one is a proposition that can be true, and the other is just a noise. Why?

  **Elias:** Because the verb is conjugated? Because of syntactic rules?

  **Sarah:** Syntax mirrors ontology, Elias. If you can't explain how "Alice" and "wise" hook up in the sentence without an infinite chain of conjunctions, you can't explain how properties hook up in the world. You're forcing me to solve the Unity of the Proposition to save your Absolute.

  **Elias:** *(Pauses. He looks at the sentence, then back at her.)* You think that helps me? That's exactly the point. The sentence *isn't* a unity. It's a temporal string of signs we *interpret* as a unity. Just like the cup. You're projecting unity onto a manifold because your cognitive architecture demands a subject and a predicate.

  **Sarah:** So truth is a projection?

  **Elias:** Truth is a property of the Absolute. Partial truths are contradictions. "Alice is wise" implies Alice is distinct from Wisdom. But if they're distinct, how do they meet? If they aren't distinct, it's tautological. You pluralists live in a world of fragments and pretend the gaps don't exist. I'm just pointing at the gaps.

  **Sarah:** And I'm saying the gaps are where the work happens! If I accept your Absolute, I lose the ability to say anything specific. I lose science. I lose the difference between the cup being on the table and the cup being *in* the table. If it's all One, distinction is illusion.

  **Elias:** Distinction is *pragmatic*. Reality is coherent. Your "States of Affairs" are a patchwork quilt held together by invisible thread. You call it "fundamental," I call it "desperate." You're positing a magical binding force and calling it "ontological free lunch."

  **Sarah:** And you're positing a mystical One and calling it "coherence." At least my mystery allows me to navigate the room without bumping into the furniture.

  **Elias:** *(Picks up the eraser.)* Maybe. But you still can't explain how the furniture stays together.

  **Sarah:** *(Takes her wine glass.)* And you can't explain how you're standing there to tell me about it without being a separate thing from the floor.

  **Elias:** *(He stops erasing. He looks at the board, then at his own feet.)* ...Touché.

  **Sarah:** Drink your wine, Elias. The regress can wait until morning.

  **Elias:** *(Puts the eraser down.)* Fine. But tomorrow we're discussing time. And I'm going to prove that doesn't exist either.

  **Sarah:** God help me.
