      *   *Russell/Armstrong Point:* Relations are *unsaturated* or *non-relational ties*. A "State of Affairs" ($aRb$) is a fundamental ontological unit. You don't need a further glue to glue the glue. The regress is vicious only if you assume relations need external relaters.

