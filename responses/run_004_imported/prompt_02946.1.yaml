answer: |-
  This is a fascinating excavation. You have correctly identified that Augustine's *De Mendacio* (On Lying, c. 395 AD) is the true ur-text for the exceptionless honesty tradition, predating Kant by millennia. The confusion you are experiencing regarding the hierarchy—specifically why preventing "corporal defilement" (#8) is a *lesser sin* than preventing execution (#7)—is the exact hinge upon which Augustine's entire moral theology turns.

  To reconstruct the logic, you have to abandon the modern (and rationalist) framework of **harm minimization** and adopt Augustine's framework of **ontological order** and **hierarchy of goods**.

  Here is the reconstruction of the underlying logic, the resolution of the Defilement vs. Death puzzle, and how this supports his exceptionless rule.

  ### 1. The Structural Logic: A Hierarchy of Goods, Not Harms

  Modern intuition (and the rationalist lineage you trace) tends to be consequentialist or rule-utilitarian: *Which lie produces the least bad outcome?*
  Augustine is a theological deontologist: *Which lie violates the least important good?*

  For Augustine, reality is structured like a ladder (the Great Chain of Being). Sins are disorders—loving a lower good more than a higher good. Therefore, the gravity of a lie is determined by **what good is being sacrificed** (Truth/God) versus **what good is being protected**.

  The eight levels are not arbitrary; they track a descent from offenses against God to offenses against Neighbors, and finally to offenses against Truth for the sake of Charity.

  *   **Levels 1–2 (Offenses against God and Justice):**
      *   **#1 (Religious Doctrine):** This violates the highest Good (God/Truth). It damns souls. This is the worst possible sin.
      *   **#2 (Unjust Hurt):** This violates Justice. It harms a neighbor for no reason.
  *   **Levels 3–5 (Disordered Motives):**
      *   These lies involve mixed motives (profit, lust for deception, social pleasing). They are sinful because the *intent* is disordered, even if the outcome isn't catastrophic.
  *   **Levels 6–8 (Officious Lies / Lies of Charity):**
      *   Here, the *intent* is good (helping a neighbor). The sin lies *only* in the means (using falsehood).
      *   Because the intent is charitable, these are the "least sinful."
      *   **The Differentiator:** Among charitable lies, the sin is lighter the **higher the good being protected**.

  This leads us to your specific sticking point: Why is the good protected in #8 (Defilement) higher than the good protected in #7 (Life)?

  ### 2. Solving the Defilement vs. Death Puzzle

  On a modern secular view, Death is the ultimate harm because it is the end of existence. For Augustine, Death is merely the end of *temporal* existence, which is inherently fleeting.

  **The Logic of "Corporal Defilement"**
  In the text you quoted, Augustine makes a crucial anthropological observation:
  > *"No man says that a person is defiled by being murdered... But if he be... carnally used like a woman; then almost all men regard him with a feeling of horror, and they call him defiled and unclean."*

  Augustine is appealing to the *consensus gentium* (agreement of the peoples). In Late Antiquity, sexual violation was not viewed merely as physical pain or psychological trauma. It was viewed as a **ritual and ontological corruption**.

  1.  **Temporal vs. Sacred Goods:** Biological life (#7) is a temporal good. It ends for everyone eventually. Martyrdom (dying for truth) was considered a *glory* in Augustine's theology. Therefore, lying to prevent death is protecting a lower good (temporal continuity).
  2.  **The Body as Temple:** "Corporal defilement" (#8) was viewed as a unique violation of the body's sanctity. While Augustine argues elsewhere (e.g., *City of God*) that rape does not stain the *soul* if consent is withheld, he acknowledges here that it stains the *social and religious standing* of the person. It renders them "unclean." In a sacramental society, being "unclean" creates a barrier between the person and the community/God that death does not.
  3.  **The Intensity of Charity:** Because the "horror" of defilement is felt more acutely by human conscience than the horror of death, the **charitable impulse** to prevent it is stronger.

  **The Calculation:**
  *   **Lie #7:** You violate Truth to save a **Temporal Good** (Life).
  *   **Lie #8:** You violate Truth to save a **Quasi-Spiritual Good** (Integrity/Purity/Social Standing before God).

  Since the Quasi-Spiritual Good is higher on the ontological ladder than the Temporal Good, the lie told to protect it is *less disordered*. It is still a sin (because Truth is higher than Purity), but it is the *least* sinful lie because it protects the highest possible created good without directly offending God (like #1).

  ### 3. How This Supports the Exceptionless Rule

  This is where Augustine diverges sharply from the "Meta-Honesty" project of the rationalist blogosphere.

  Yudkowsky's "Meta-Honesty" attempts to create a policy framework where you can lie in edge cases (murderers at the door) without undermining your general reputation for honesty. It tries to **justify the exception**.

  Augustine's hierarchy is designed to **condemn the exception while measuring the guilt**.

  1.  **No Zero-Point:** Notice that there is no "Level 9: Permissible Lie." The scale stops at 8. Even the lie to prevent rape is a *sin*. It requires penance.
  2.  **Culpability vs. Permissibility:** The hierarchy measures *culpability* (how much penance you owe), not *permissibility* (whether you can do it). Augustine is saying: *"If you lie to save a life, you are still a liar, but you are a less guilty liar than someone who lies for fun."*
  3.  **Blocking the Slippery Slope:** By admitting that #8 is "less sinful," Augustine prevents moral despair (so you don't feel you might as well lie about everything). But by insisting it is *still sinful*, he prevents moral license (so you don't start treating #8 as a rule).

  For Augustine, the "Exceptionless Rule" isn't a social coordination policy (as it is for Kant or Yudkowsky); it is an **ontological alignment**. Speech is given by God to signify what is in the mind. To use speech to signify what is *not* in the mind is to break the tool's divine purpose. You can break a tool to save a life (like breaking a door to escape a fire), but you still broke the tool. You don't say "breaking the door was good"; you say "breaking the door was necessary but destructive."

  ### 4. Summary for Your Reading Group

  To synthesize this for your group's lineage tracing:

  *   **Augustine (395 AD):** Establishes the **Ontological Hierarchy**. Lying is always a disorder of the soul. The hierarchy ranks the *disorder*, not the *outcome*. Defilement > Life because Purity is closer to the Soul than Biology is. The rule is exceptionless; the guilt is gradable.
  *   **Kant (1797):** Secularizes the rule. Removes the "Hierarchy of Guilt." For Kant, lying to the murderer is a violation of the Categorical Imperative, full stop. He loses Augustine's pastoral nuance (the "lesser sin" aspect) but keeps the absolutism.
  *   **Sidgwick (1874):** Introduces the **Esoteric Morality** problem. If the truth causes harm, should the elite know the utilitarian calculus while the masses keep the absolute rule? This cracks the absolutism.
  *   **Yudkowsky (2000s):** Attempts **Meta-Honesty**. Tries to repair the coordination problem. "How can we lie in edge cases without breaking the social contract of truth?" This is a return to consequentialism wrapped in deontological language.

  **The Takeaway:** Augustine's hierarchy seems incoherent only if you assume the goal is *minimizing harm*. If you assume the goal is *minimizing ontological disorder*, the logic holds: Violating Truth to protect a "Temple of the Holy Spirit" (from defilement) is less disordered than Violating Truth to protect "Temporal Flesh" (from death).

  Augustine would tell the rationalist reading group: *You are trying to calculate the optimal policy for lying. I am telling you that every lie is a wound to the soul. Some wounds are deeper than others, but none of them are healthy.*
