  Both parties are stuck in a classic debate between hard incompatibilism (Reyna) and intuitive libertarianism (Phil). What they are both missing is **compatibilism**, the view that responsibility is compatible with determinism because it depends on responsiveness to reasons rather than metaphysical freedom. Additionally, they overlook the pragmatic function of responsibility practices (as argued by P.F. Strawson); holding someone responsible might be necessary for healthy relationships regardless of the metaphysical truth. Reyna wins on logical consistency, while Phil wins on practical necessity, but neither addresses the middle ground where most ethical systems actually operate.
