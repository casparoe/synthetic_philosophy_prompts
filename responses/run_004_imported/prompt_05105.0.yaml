  (1) reyna said no one is ever truly responsible for what they do, because to be responsible for your actions you'd have to be responsible for the kind of person you are, and to be responsible for THAT you'd have to be responsible for the person you were before that shaped you into this person, and so on back before you were even born — so the chain can never actually get started, which means "real" responsibility is impossible for anyone, cousin included.

  (2) phil said that can't be right because it proves way too much: if the argument worked it would mean literally nobody is responsible for literally anything, ever, which is absurd on its face, so something in the reasoning has to be broken even if he couldn't say what.

  (3) reyna said "that IS the conclusion, and yeah it sounds nuts, but plenty of true stuff in philosophy sounds nuts at first — that's not by itself an objection."

  (4) phil shot back that she still loses her temper at people and expects apologies same as anyone else, so she doesnt actually believe this deep down, whatever she says at the dinner table.

  (5) reyna said that's not a real counterargument, just noting that humans are bad at living out conclusions they accept, which happens with plenty of philosophical positions and doesn't make the argument wrong.

  (6) phil tried one more angle: "ok but what if it's not all locked in — what if in the actual moment he really could've gone a different way? doesn't that put it back on him?"

