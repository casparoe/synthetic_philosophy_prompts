      *   *Bivalence vs. Excluded Middle:* Technically, Peirceanism rejects Bivalence ($\phi$ is T or F). It might keep Excluded Middle ($\phi \lor \neg\phi$) depending on formulation, but usually, for future contingents, it rejects $F\phi \lor F\neg\phi$. I need to be precise here. Peirceanism typically makes $F\phi$ false and $F\neg\phi$ false, so $F\phi \lor F\neg\phi$ is false. So it rejects Excluded Middle for future tensed statements.

  9.  **Final Polish:** Ensure the distinction between *metaphysical* actuality (EQM) and *semantic* actuality (TRL) is clear. (This is the crux of the user's question).

