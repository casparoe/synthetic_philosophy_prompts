      *   *Key Distinction:* The Wager is addressed to the *libertine* (skeptic) who is *already* considering Christianity, not a random person on the street. The Mugger targets anyone.
      *   *Utility:* Pascal assumes Infinite Utility for Heaven. The Mugger offers finite but huge utility (or disutility). Actually, Bostrom's mugger often uses finite but astronomical numbers. If the Mugger offers *Infinite* torture, Pascal's math breaks harder. I should assume the Mugger offers Finite but Huge payoff to make it comparable to the standard Mugging, OR acknowledge that for Pascal, only God *is* Infinite. Let's stick to the prompt's implication: "tiny probability times big enough payoff."
      *   *Refinement:* Pascal would likely argue the Mugger's probability is *effectively* zero because it contradicts known order, whereas Christianity fits the "shape" of human misery and longing.

