answer: |-
  This is a wonderful problem, and your intuition that the "ex-ante/ex-post confusion" dismissal is too glib is well-founded. Your friend is defending a position known as **welfarist consequentialism**: the claim that the only thing that matters morally is the vector of final outcomes (who got what), and that lotteries are merely tools to achieve those outcomes. On this view, a 50% chance is *defined* as 0.5 units of utility for a risk-neutral agent. To prefer the coin flip is, in your friend's eyes, a category error—like preferring a probability distribution because you like the shape of its histogram rather than its mean.

  However, this defense relies on smuggling in a substantive ethical premise (consequentialism) under the guise of a technical requirement (rationality). To make the strongest case for Diamond, we need to show that the fairness intuition isn't a confusion about probabilities, but a rejection of the **Independence Axiom** when applied to social welfare, and that this rejection is necessary to capture the moral distinctness of persons.

  Here is the argument for why Diamond is right and Harsanyi requires qualification, structured to directly engage your friend's objection.

  ### 1. The Trivialization Objection
  Your friend's easiest retort is: *"If you value the fairness of the coin flip, just include 'fairness' in the utility function. If $U(\text{50\% chance}) > 0.5$, then expected utility theory is preserved."*

  This is the "definitional defense." It saves the math but kills the theory. Harsanyi's Aggregation Theorem is powerful precisely because it claims to derive utilitarianism from **thin** assumptions about rationality and Pareto efficiency, without requiring us to specify *what* people value. It says: "Whatever your individual preferences are, if you are rational and want to respect them, you must be a utilitarian."

  If we accept your friend's move, the theorem becomes tautological. It no longer tells us how to aggregate preferences; it just says "Maximize whatever the planner values." If the planner values fairness, we put that in the function. But then we haven't derived utilitarianism; we've just asserted that the planner has a specific utility function.

  Diamond's point is that standard individual utility functions (defined over final goods) *cannot* capture fairness, because fairness is a **relational** property between agents, not a property of an agent's final state. Person 1, wanting the good, is indifferent between "I get it for sure" and "I have a 50% chance" (if risk neutral). Person 1 does not inherently care about Person 2's chance. Therefore, the preference for the coin flip cannot be found in the sum of individual preferences. It must come from the social planner's independent ethical commitment to **equality of opportunity**. Harsanyi's theorem forbids the planner from having such independent commitments. Diamond argues the planner *must* have them.

  ### 2. The Violation of Independence (The Technical Core)
  To engage your friend on technical grounds, we must look at the **Independence Axiom**. Harsanyi's result relies on the social planner satisfying the vNM axioms, including Independence.

  In your example:
  *   **Lottery A:** Person 1 gets good (1, 0) with probability 1.
  *   **Lottery B:** Person 2 gets good (0, 1) with probability 1.
  *   **Lottery C:** 50% chance of (1, 0) and 50% chance of (0, 1).

  For risk-neutral individuals, the expected utility vector for A is $(1, 0)$, for B is $(0, 1)$, and for C is $(0.5, 0.5)$.
  Harsanyi's utilitarian SWF sums these: $W(A)=1, W(B)=1, W(C)=1$. Indifference.

  Diamond's intuition prefers C. Why? Because C reduces the **variance** of welfare across persons.
  Your friend says this is ex-post confusion. But consider this: The variance exists *ex-ante* in the distribution of *expectations*.
  *   In A/B, the ex-ante expectation is unequal (one person has expectation 1, the other 0).
  *   In C, the ex-ante expectation is equal (both have 0.5).

  If we care about ex-ante equality, we are saying the social welfare function should be concave over individual *expected* utilities, not linear. But Harsanyi proves that if you satisfy Independence, the SWF *must* be linear.

  Therefore, preferring the coin flip is a direct violation of the Independence Axiom at the social level. Your friend claims Independence is a requirement of rationality. But in social choice, Independence implies that the moral value of a prospect depends *only* on the sum of individual expected utilities, ignoring how those utilities are correlated across states.

  **The Counter-Argument:** Independence makes sense for a single agent choosing for themselves. It makes less sense for a planner choosing for others. For a single agent, correlation doesn't matter; I am the same person in all states. For a planner, correlation matters immensely.
  *   **State 1:** Person 1 is happy, Person 2 is sad.
  *   **State 2:** Person 1 is sad, Person 2 is happy.
  *   **Sum:** Constant.

  Harsanyi says these states are morally interchangeable with a state where Person 1 is always happy and Person 2 always sad (provided the sums match). Diamond says the *spread* of happiness across identities matters. By calling this a "confusion," your friend is asserting that **identities don't matter, only totals do.** That is a substantive ethical claim (classical utilitarianism), not a logical necessity. Diamond is simply pointing out that if you value persons as distinct entities, you must violate Independence.

  ### 3. The Symmetry Argument (For the Physicist)
  Since you come from statistical mechanics, consider the symmetry of the problem.
  You have two identical agents and one indivisible good. The physical setup is perfectly symmetric under the permutation of agent labels $(1 \leftrightarrow 2)$.

  *   **Option A (Give to 1):** Breaks the symmetry explicitly. It requires an arbitrary tie-breaking rule.
  *   **Option C (Coin Flip):** Preserves the symmetry in the mechanism. The probability distribution is invariant under permutation.

  In physics, when a system has a symmetry, we generally expect the solution to respect that symmetry unless there is a symmetry-breaking field. Here, there is no relevant difference between Person 1 and Person 2.
  *   Harsanyi's indifference implies that a symmetry-breaking solution (Give to 1) is just as good as a symmetry-preserving solution (Coin Flip).
  *   Diamond's intuition is that **arbitrary symmetry breaking is a cost.**

  Your friend's "ex-ante/ex-post" argument suggests that because the *expected* outcome is symmetric in all cases (total utility = 1), the mechanism doesn't matter. But this ignores that the *process* is part of the state space. If the planner chooses "Give to 1," they have introduced a distinction without a difference. This is procedurally irrational even if it is consequentially equivalent. The "fairness" you feel is the recognition that the mechanism itself must respect the symmetry of the agents. Harsanyi's framework treats agents as buckets for utility; Diamond treats them as claimants with equal standing.

  ### 4. Direct Rebuttal to "Ex-Ante/Ex-Post Confusion"
  Your friend claims that preferring the coin flip is illegitimately smuggling in facts about the realized outcome (ex-post). This is the crux. They argue: *"Once the coin lands, someone is unhappy. Why did you flip it? You didn't change the ex-post utility."*

  Here is the rebuttal: **Fairness is an ex-ante property of the social contract, not an ex-post property of the allocation.**

  When we design social institutions (courts, draft lotteries, resource allocation), we do so behind a veil of ignorance. We know we could be Person 1 or Person 2.
  *   Under Rule A (Give to 1), if I turn out to be Person 2, I have a justified complaint: "Why was I excluded without a chance?"
  *   Under Rule C (Coin Flip), if I turn out to be Person 2, I cannot complain about the *process*, only the luck. I was treated as an equal.

  Your friend's objection assumes that the only thing that can be "unfair" is the final distribution of goods. But **procedural injustice** is real. If a judge flips a coin to decide a verdict, we object. But if a judge flips a coin to decide which of two equally deserving patients gets the last ventilator, we approve. Why? Because in the ventilator case, the coin flip acknowledges the equal claim of both parties.

  To say this is "ex-post confusion" is to say that the *reason* for the allocation doesn't matter, only the allocation itself. But reasons matter for legitimacy. A society that allocates goods by "Give to Person 1" (perhaps based on a hidden bias) creates a class of citizens with zero ex-ante claim on resources. A society that uses lotteries acknowledges that all citizens have an equal ex-ante claim. This difference exists *before* the coin lands. It is not ex-post confusion; it is **ex-ante status recognition.**

  ### 5. Conclusion: Why Harsanyi Must Be Qualified
  Harsanyi's theorem is mathematically sound but ethically narrow. It proves: *If* you accept welfarism (only utilities matter), *and* you accept Independence (correlations across persons don't matter), *then* you must be a utilitarian.

  Diamond's example shows that many of us reject the second premise. We care about the **joint distribution of chances**, not just the sum of expected utilities.

  To answer your request directly: The fairness intuition tracks something real—**the moral value of treating persons as equals in the decision procedure.** Your friend dismisses this as confusion because they assume the only moral currency is final welfare. But if you believe that how we decide matters as much as what we decide (because it constitutes our social relations), then Harsanyi's route is blocked.

  You should reject the unqualified Harsanyi aggregation because it forces the planner to be indifferent to **arbitrary discrimination**. If the planner is indifferent between "Give to 1" and "Coin Flip," they are willing to discriminate against Person 2 without reason, provided the *total* utility is the same. That is not rationality; that is a failure to recognize the separateness of persons. The coin flip isn't about maximizing utility; it's about minimizing the **arbitrariness of power**. And that is a variable Harsanyi's equation sets to zero by definition.
