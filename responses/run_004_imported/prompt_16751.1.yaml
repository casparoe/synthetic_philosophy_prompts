      *   *Argument 4: Separability/Independence Violations.* Diamond's example is essentially an Allais-style paradox for social choice. It violates the Independence Axiom when applied to social states. If we value fairness, we violate Independence. Should we? Yes, because Independence ignores correlation between states and identities.
      *   *Argument 5: The Physicist Analogy.* The user likes stat mech. Use that. Microstates vs. Macrostates. Entropy? No, maybe symmetry breaking. A deterministic choice breaks symmetry arbitrarily. A random choice preserves symmetry in expectation *and* in the mechanism.

  4.  **Developing the Strongest Argument (The "Process Value" / "Non-Consequentialist" Angle):**
