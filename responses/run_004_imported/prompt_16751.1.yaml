      *   **The Friend's Objection:** It's an ex-ante/ex-post confusion. Once probabilities are fixed, fairness is just expected utility.
      *   **The Task:** Make the *strongest case* for the Diamond side (fairness is real, Harsanyi needs qualification/rejection). *Crucially:* Engage directly with the "ex-ante/ex-post confusion" objection. Do not just survey literature. Provide a rigorous argument.

  2.  **Deconstruct the Problem:**
      *   **Harsanyi's Position:** Social welfare function (SWF) must be a weighted sum of individual von Neumann-Morgenstern (vNM) utilities. If individuals are risk-neutral over the good (1 vs 0), expected social welfare is identical for (Give 1), (Give 2), and (Coin Flip). Therefore, indifference.
      *   **Diamond's Position:** The *process* matters. A coin flip gives each person a 50% *chance*, which has intrinsic value beyond the expected outcome. It treats people as equals *ex-ante*.
      *   **The Friend's Rebuttal:** If you value the chance, put it in the utility function. If $U(\text{50\% chance}) > 0.5 \times U(\text{Good})$, then expected utility theory (EUT) still holds, you just defined the utility wrong. If you stick to standard outcomes (Good/No Good), then fairness is an ex-post feeling about the realization, which shouldn't guide ex-ante policy.

  3.  **Brainstorming Counter-Arguments to the Friend (The Core Task):**
      *   *Argument 1: The Definition of Outcomes.* The friend says "fix the probabilities." But what is the *outcome*? Is the outcome "Person 1 gets good" or is the outcome "Person 1 has a 50% chance"? If the latter, Harsanyi's theorem applies to *prospects*, not just physical goods. But Harsanyi usually assumes utilities are defined over final states. If we define utilities over *processes*, we violate the consequentialist assumption underlying standard Harsanyi utilitarianism.
      *   *Argument 2: Risk Attitudes and Social Risk.* Individuals might be risk-neutral over the good, but society might be *risk-averse over the distribution of utility*. Harsanyi assumes the social planner has the same risk attitude as the individuals (if they agree). But Diamond suggests the planner has a distinct ethical risk attitude.
