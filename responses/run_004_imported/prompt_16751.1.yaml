  *Wait, deeper nuance:* Harsanyi's theorem says if individuals satisfy vNM and Pareto holds, the SWF must be a weighted sum of individual utilities. If individuals are risk neutral ($U(0.5) = 0.5$), then SWF($0.5$) = $0.5 + 0.5 = 1$. SWF($1$) = $1 + 0 = 1$. Indifference.
  The friend says: "If you prefer the coin flip, you just value the chance."
  My counter: That changes the *individual's* utility function to include fairness. But fairness is a *social* concern, not an individual one. Person 1 doesn't care if Person 2 gets a chance (usually). Person 1 just wants the good. The *Planner* cares about the distribution of chances. Harsanyi forces the Planner to only care about the sum of individual concerns. Diamond says the Planner has independent ethical concerns (equality of opportunity) that are not reducible to individual preferences.
