      *   *Key Point:* If we say "Oh, just include 'fairness' in the utility function," we make Harsanyi's theorem tautological. It loses its normative force. It stops telling us *how* to aggregate and just says "maximize whatever you value."
      *   *Key Point:* The specific violation is of the **Independence Axiom** applied to social welfare. Diamond shows that satisfying Pareto + Independence forces the planner to ignore the *correlation* of outcomes across individuals.
      *   *Refining the Ex-Ante/Ex-Post Rebuttal:* The friend says caring about the coin flip is caring about the ex-post realization. That's wrong. Caring about the coin flip *ex-ante* is caring about the *distribution of chances*. Harsanyi says only the *sum of expected utilities* matters. Diamond says the *variance of expected utilities* (or the equality of chances) matters too.

  5.  **Structuring the Response:**
      *   **Acknowledge and Validate:** Respect the user's background (physicist -> econ). Acknowledge the friend's point is the standard "Harsanyi Defense."
