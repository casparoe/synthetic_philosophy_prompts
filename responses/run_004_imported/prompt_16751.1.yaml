      *   *Check:* Is the math right? Harsanyi requires Pareto + vNM rationality for individuals + vNM rationality for society. Diamond shows these imply indifference to the coin flip.
      *   *Check:* Is the physicist analogy apt? Yes, symmetry arguments work well here.
      *   *Check:* Am I surveying literature? *No, focus on the argument.* Mention Diamond/Harsanyi but focus on the logic.

  8.  **Final Polish:** Ensure the distinction between "outcomes" (final allocation) and "prospects" (lotteries over allocation) is clear, as this is where the friend's argument usually hides. The friend says prospects reduce to expected outcomes. Diamond says prospects have intrinsic moral weight.

