      *   **Argument 1: The Trivialization Objection.** If the friend says "just put fairness in the utility function," Harsanyi's theorem becomes empty. It no longer derives utilitarianism; it just says "maximize utility."
      *   **Argument 2: Independence and Correlation.** Explain technically why Harsanyi fails here. It's about the Independence Axiom. The planner ignores *who* gets what in *which* state, only caring about the sum. Diamond cares about the joint distribution.
