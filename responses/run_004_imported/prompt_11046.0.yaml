answer: |-
  This is a fantastic translation for a "rough stab." You have captured the technical distinctions accurately, and your intuition about the "backwards" nature of the first distinction is one that has bothered political philosophers for centuries.

  To answer your core question: **No, this is not an ad-hoc taxonomy.** It flows directly from Aquinas's metaphysics of authority, his theology of grace/office, and his specific understanding of the *Common Good*.

  Here is the walkthrough of the logic that makes those lines fall where they do.

  ### 1. The Metaphysics of Office: Power vs. Person
  Your main friction point is this: *Why does personal unworthiness not void authority, but usurpation does?* You suggest conduct in office should matter more than "paperwork" (acquisition).

  For Aquinas, authority is not a personal property; it is a **participation in Divine Reason.**

  *   **The "Unworthy Person" Case:** Aquinas operates with a principle similar to the sacraments (*ex opere operato*). The validity of a baptism does not depend on the moral holiness of the priest; it depends on the priest acting *in persona Christi* with the proper form. Similarly, political authority flows from God through the structure of the office. If the authority depended on the moral worthiness of the ruler, no subject could ever know if they were obliged to obey (since only God knows the heart), leading to constant instability. As long as the ruler holds the *office* legitimately, the authority is real, because the *source* of the authority is God, not the ruler's virtue.
  *   **The "Usurper" Case:** This isn't just about "paperwork"; it is about **commutative justice.** For Aquinas, political authority arises (in most cases) from the consent of the community or lawful succession. To seize power by violence is to commit theft against the community. It is a violation of the *ordo* (order) itself. A usurper does not hold the "office"; they hold a sword. Because they lack the juridical link to the community (consent/law), they lack the link to God's ordination of order. Therefore, there is no "authority" to obey, only force to resist (prudentially).

  **The Unifying Idea:** Authority is ontological (about *being* and *order*), not merely moral. A sinful legitimate king is a broken vessel, but still a vessel of authority. A virtuous usurper is a good man, but he is a thief, and theft cannot generate right.

  ### 2. The Teleology of Command: End vs. Scope
  You also noted the second axis: commands against virtue vs. commands outside scope. This distinction relies on the **Telos (Purpose)** of authority.

  For Aquinas, the purpose of political authority is the **Common Good**, which ultimately directs men toward **Virtue** and **God**.

  *   **Commands Against Virtue (Sin):** If a ruler commands idolatry or murder, they are commanding something contrary to the *ultimate end* of authority. Since authority is delegated by God to lead men to the good, a command to do evil is a contradiction in terms. It is not an act of authority; it is an act of violence. Hence, you are *required* to disobey (Acts 5:29: "We must obey God rather than men").
  *   **Commands Outside Scope (Ultra Vires):** If a ruler demands money he isn't owed or interferes in family matters that belong to the domestic sphere, he is not necessarily commanding evil, but he is commanding **unjustly.** He is exceeding the *measure* of his authority. Here, Aquinas is nuanced. You *can* disobey because he has no right to demand it. However, you aren't always *required* to disobey. Why? Because sometimes submitting to an unjust demand preserves peace (the Common Good) better than resisting. This becomes a matter of prudence and charity, not strict justice.

  ### 3. Why the Taxonomy isn't "Ad-Hoc"
  It might look like he is splitting hairs to answer objections, but he is actually balancing two dangerous extremes: **Anarchy** and **Idolatry.**

  1.  **Preventing Anarchy (The "Unworthy Person" Rule):** If subjects could depose any ruler they deemed "unworthy," every faction would claim the ruler is sinful, and the state would collapse. By separating the *office* from the *man*, Aquinas secures social stability.
  2.  **Preventing Idolatry (The "Abuse" Rule):** If subjects had to obey everything, the State becomes God. By distinguishing commands against God (must disobey) and commands beyond scope (may disobey), Aquinas limits the state.
  3.  **Preventing Tyranny (The "Usurper" Rule):** By denying legitimacy to violence, Aquinas delegitimizes coups and warlordism, *unless* the community later consents (retroactive legitimacy). This acknowledges that while violence is bad, the *peace* of the community is the higher good, so a usurper can become legitimate if the people accept him.

  ### 4. Summary of the Logic
  Here is the schematic of Aquinas's logic in this passage:

  *   **Source of Authority:** God (via Natural Law/Community Consent).
  *   **Condition 1: Acquisition (The Title)**
      *   *Defect in Person:* Does not break the link to God. **Obedience Owed.** (Stability > Personal Merit).
      *   *Defect in Mode:* Breaks the link to Justice/Community. **No Obedience Owed.** (Justice > Force).
  *   **Condition 2: Exercise (The Command)**
      *   *Against God:* Breaks the link to the Ultimate End. **Disobedience Required.** (God > State).
      *   *Beyond Scope:* Breaks the link to Juridical Measure. **Disobedience Permitted.** (Prudence > Strict Right).

  ### A Note on the Text
  You are reading the *Scriptum super Sententiis* (Commentary on the Sentences). This is early Aquinas (1250s). He revisits this in *De Regno* (On Kingship) and the *Summa Theologiae* (II-II, q. 104).

  In the *Summa*, he tightens the language. He becomes slightly more cautious about the "usurper" clause, emphasizing that even usurpers should sometimes be obeyed to avoid scandal or danger. But the core logic remains: **Authority is a function of Order, not Merit.**

  Your intuition that "conduct should matter more" is modern and liberal (we care about performance and moral character). Aquinas's intuition is medieval and ontological (we care about Order, Hierarchy, and the Source of Power). For him, a legitimate king who sins is a tragedy; a usurper who rules well is a contradiction that threatens the very concept of Law.

  Does that help resolve the "backwards" feeling? It's not about the ruler's goodness; it's about the ruler's *place* in the divine order.
