answer: |-
  This is a profound and incredibly difficult situation, and your hesitation is not only valid—it is morally and psychologically sound. Your friend is offering a perspective that is common in mental health advocacy, but she has taken a helpful concept and stretched it until it breaks.

  The short answer is: **No, she is not right that resentment stops making sense.** Knowing the cause of a wound does not magically stop it from hurting, nor does it remove the responsibility of the person who inflicted it.

  Here is a breakdown of why your intuition is correct, where your friend's logic fails, and where the actual line lies between compassion and accountability.

  ### 1. The "It Was the Disorder, Not Him" Trap
  Your friend is using a separation tactic: separating the person from the illness. This is often used to help family members stop taking symptoms personally (e.g., "He isn't screaming because he hates you; he is screaming because his emotional regulation failed").

  **Where this helps:** It prevents you from believing the vicious things he said were the absolute truth about your relationship. It helps you not to internalize the abuse.

  **Where this harms:** It erases his agency. If *nothing* he does when symptomatic is "him," then *nothing* he does when stable is "him" either. It creates a paradox where he is only a person when he is perfect. By saying "that wasn't him," your friend is inadvertently infantilizing your brother. It suggests he is a vessel for a disease rather than a human being struggling with a disease.

  Your feeling that this treats him as "less of a person" is accurate. To respect someone's humanity is to acknowledge that they have choices, even difficult ones. To deny them that is to deny their capacity for growth.

  ### 2. Explanation vs. Excuse
  This is the crux of the issue.
  *   **An Explanation** provides context: "He has BPD, which makes emotional regulation incredibly difficult, especially during an episode."
  *   **An Excuse** removes consequence: "Because he has BPD, he cannot be held responsible for the impact of his words."

  BPD explains *why* the impulse was stronger than his filter. It does not absolve the *impact* of the words. If someone has a seizure and knocks over a vase, that is an accident. If someone has a condition that makes them prone to rage and they scream vicious insults, the condition explains the volatility, but the recovery process requires them to eventually own the cleanup.

  If you drop the resentment entirely based on your friend's logic, you are accepting the "excuse" version. That sends a message to your brother (consciously or not) that he does not need to do the hard work of making amends, which is actually detrimental to his recovery. People with BPD often struggle with intense shame; paradoxically, being held to a standard of accountability (with love) can be more validating than being treated as incapable of responsibility.

  ### 3. The Function of Resentment
  Your friend suggests resentment is something to be discarded like trash. But psychologically, resentment is often a **boundary signal**.

  Resentment tells you: *Something happened here that violated my values or my safety, and it hasn't been resolved.*
  *   If you suppress the resentment, you lose the signal.
  *   If you dwell on it without action, it becomes toxic.
  *   If you listen to it, it tells you what needs to be repaired.

  Your resentment is lingering because the repair is incomplete. A half-hearted "sorry, I was in a bad place" is often an attempt to shut down the conversation rather than validate your pain. It says, "I hope you understand why I did it," rather than "I understand how much I hurt you."

  ### 4. Where is the Actual Line?
  The line lies in holding two opposing truths at the same time. This is dialectical thinking (a core concept in DBT, the therapy often used for BPD).

  **Truth A:** Your brother has a disorder that compromises his control during episodes. He is suffering, and his behavior was symptomatic.
  **Truth B:** You were hurt. The words were said by his mouth. The impact is real. Accountability is required for trust to be rebuilt.

  **The Line:**
  You can have compassion for his struggle *without* sacrificing your right to heal.
  *   **Wrong Approach:** "I am angry because he is a bad person." (Ignores the disorder)
  *   **Friend's Approach:** "I cannot be angry because he is a sick person." (Ignores your humanity)
  *   **The Middle Line:** "I understand he was in a dysregulated state, but the hurt he caused is real, and I need more than a dismissal to move past it."

  ### 5. How to Move Forward
  You don't need to choose between "staying angry" and "pretending it didn't happen."

  1.  **Validate your own pain.** You are allowed to be hurt even if the person who hurt you is sick. Pain does not require malice to be valid.
  2.  **Redefine Accountability.** Accountability for someone with BPD might look different. It might not mean a long debate about why he was wrong (which could trigger shame spirals). It might look like: "I accept you were struggling. But when you speak to me that way, I feel unsafe. I need to know that you are working on skills to prevent that, and I need an apology that acknowledges my hurt, not just your state of mind."
  3.  **Use the "Bad Weather" Analogy Correctly.** Your friend said treat it like bad weather. That is good for *preparation* (e.g., "I see a storm coming, I will step back"). But if a neighbor's tree falls on your car during a storm, you still discuss who pays for the car. You can plan around the weather without accepting the damage as "just how it is."
  4.  **Release the Resentment on Your Timeline.** You cannot force yourself to drop the resentment. It will fade as you feel safer and as you see him take genuine steps toward accountability. Pushing it away now will just turn it into passive aggression or distance.

  ### Summary
  Your friend is trying to protect you from pain by asking you to lower your expectations of humanity. You are resisting that because you know your brother is capable of more.

  **Resentment makes sense when a boundary has been crossed and the repair is insufficient.** Keep the compassion for his struggle, but keep the standard for his behavior. That isn't unfair; it's the only way the relationship can actually grow.
