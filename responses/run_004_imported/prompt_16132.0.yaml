answer: |-
  **Characters:**
  *   **EPI:** An Epistemicist (Williamsonian).
  *   **SUPER:** A Supervaluationist (Fine/Keefe).

  **Setting:** A seminar room. A strip of 1,000 color patches is taped to the table, shading imperceptibly from pure red (Patch 1) to pure orange (Patch 1,000).

  ***

  **EPI:** Let's start at Patch 1. We agree it's red. And Patch 1,000 is orange. You say there's a penumbra in the middle where "red" is neither true nor false. I say "red" is true of some and false of others, we just don't know where the cut is.

  **SUPER:** We agree on the data, not the metaphysics. Look at Patch 500. On my view, there are admissible precisifications of "red" where 500 counts as red, and others where it doesn't. So, it's not supertrue that 500 is red. It's borderline.

  **EPI:** You use the "definitely" operator, $D$. You say $Dp$ is true if $p$ is true on all admissible precisifications. So for Patch 10, $D$-Red is true. For Patch 500, $\neg D$-Red and $\neg D$-Not-Red. But here's the wedge: Is there a sharp boundary between the patches where $D$-Red is true and the patches where $D$-Red is false?

  **SUPER:** That's the first-order boundary. Yes, in the model, there is a set of precisifications. Relative to that set, the extension of $D$ is precise.

  **EPI:** Exactly. So you've relocated the sharp boundary. You've smoothed out "red," but you've made "definitely red" precise. There is some patch $n$ such that $n$ is definitely red, and $n+1$ is not definitely red. That's a sharp cut.

  **SUPER:** But that cut isn't expressible in the object language as a simple predicate like "red." It's a semantic boundary, not a linguistic one. And anyway, "definitely" is itself vague. We can iterate the operator. We have $DD$-Red, $DDD$-Red...

  **EPI:** Does the hierarchy stop?

  **SUPER:** It doesn't need to stop. It captures the intuition that the transition from red to orange is smooth. There isn't a single jump; there's a fading of definiteness.

  **EPI:** But logic is bivalent. For any patch $k$ and any level $m$, either $D^m$-Red($k$) is true or it isn't. If your hierarchy is to make sense, there must be a point where $D^m$-Red($k$) is true and $D^m$-Red($k+1$) is false. If you deny that, you deny classical logic for the $D$ operator. If you accept it, you admit sharp boundaries at every level of the hierarchy. You haven't eliminated sharp boundaries; you've just pushed them up to the meta-language, and then the meta-meta-language.

  **SUPER:** I'm not pushing them to the meta-language. I'm saying the *concept* of admissibility is what does the work. Look, on your view, there is a specific patch—say, 634—that is the last red patch. 634 is red; 635 is orange. Why 634? What fact about our usage or the world fixes that number?

  **EPI:** No fact about usage fixes it uniquely. Usage underdetermines extension. But the world + usage fixes *a* extension. There has to be one, because "red" is a predicate that partitions the world. If it didn't partition the world sharply, the Sorites paradox would be valid, and we'd have to conclude Patch 1,000 is red. We know that's false. So the major premise—"if $n$ is red, $n+1$ is red"—must be false. That means there's a counterexample. A sharp cut.

  **SUPER:** You buy classical logic at the cost of implausible skepticism. You claim we *cannot know* where the cut is. Why?

  **EPI:** The margin for error principle. Knowledge requires safety. If I know patch $n$ is red, then in nearby cases—where my perceptual discrimination or linguistic disposition varies slightly—$n$ must still be red. But near the boundary, a tiny shift in usage makes $n$ non-red. So I can't know I'm at the boundary. In fact, I can't know I'm *near* the boundary.

  **SUPER:** That's the part that breaks competence. You're saying a competent speaker, looking at a clearly red patch, might be wrong about whether they *know* it's red, simply because it's too close to a boundary they can't locate. It makes vagueness a kind of blindness.

  **EPI:** It makes vagueness a kind of ignorance. But look at your alternative. You say Patch 500 is neither red nor not-red. But consider the sentence: "Patch 500 is a borderline case." Is *that* sentence true?

  **SUPER:** Yes. It's supertrue. It's true on all precisifications that 500 is borderline.

  **EPI:** So "is a borderline case" is a precise predicate! You have a sharp boundary between the borderline cases and the non-borderline cases. If you deny that, you need a "definitely borderline" operator. And then a "definitely definitely borderline." You are running the same hierarchy I am, but you're pretending the sharp cuts at each level don't count as "real" boundaries because they belong to the $D$ operator.

  **SUPER:** The difference is modal. My sharp boundaries are relative to a set of precisifications. I can change the set of admissible precisifications without changing the world. Your sharp boundary is fixed in the actual world. You say there is a fact of the matter, right now, that distinguishes 634 from 635, independent of our ability to refine our semantics.

  **EPI:** I say the fact is constituted by our actual use, even if that use doesn't determine it via a rule. But let's go back to your hierarchy. If "definitely" is vague, then the logic of $D$ shouldn't be S4. It shouldn't be transitive. If $Dp$ is vague, then $DDp$ shouldn't collapse into $Dp$.

  **SUPER:** Agreed. Keefe argues we need a logic where the hierarchy doesn't collapse.

  **EPI:** But if it doesn't collapse, does it converge? Is there a patch $k$ where for all $m$, $D^m$-Red($k$) is true?

  **SUPER:** Ideally, yes. The core red patches.

  **EPI:** And is there a patch $j$ where for all $m$, $\neg D^m$-Red($j$) is true?

  **SUPER:** The core orange patches.

  **EPI:** So there is a transition zone between the "always definitely" region and the "never definitely" region. Is the boundary of *that* zone sharp?

  **SUPER:** (Pauses) If I say no, I need a higher-order operator to describe the vagueness of the hierarchy. If I say yes, I admit a sharp boundary.

  **EPI:** Precisely. You're trapped. To avoid the sharp boundary, you need an infinite hierarchy of operators. But even then, for any specific patch, either it falls under $D^m$ or it doesn't. Bivalence holds at every level of your hierarchy. You get all the sharp boundaries I do, plus an infinite stack of them, plus the claim that we can't express the exact level where the shift happens.

  **SUPER:** But I don't posit a *single* unknowable fact. I posit a space of possibilities. When I say "Patch 634 is borderline," I'm saying its status varies across admissible interpretations. You say "Patch 634 is red, but you can't know it." That implies our word "red" is more precise than our understanding of it allows. It severs the link between meaning and use.

  **EPI:** It severs the link between meaning and *knowability*. But it preserves the link between meaning and truth. If "red" is vague, the Sorites is sound. If the Sorites is sound, 1,000 is red. That's absurd. So "red" isn't vague in its extension, only in our epistemic access. Your view tries to save the intuition that there's no cut by introducing truth-value gaps. But gaps don't stop the Sorites unless you invalidate Modus Ponens or introduce a "definitely" operator that behaves classically. And if it behaves classically, you're back to sharp cuts.

  **SUPER:** I invalidate the Sorites by rejecting the major premise for supertruth. "If $n$ is supertrue red, $n+1$ is supertrue red" is false. There is a last supertrue red patch.

  **EPI:** Aha! So you admit it. There is a last patch $n$ such that $D$-Red($n$) is true and $D$-Red($n+1$) is false. That is a sharp boundary.

  **SUPER:** It's a sharp boundary in the *semantics*, not in the *color*. The color shading is continuous. The semantics imposes a structure to model our uncertainty. You claim the color *extension* is discrete.

  **EPI:** The extension of the predicate is discrete. The color spectrum is continuous. The predicate "red" carves the spectrum. I say it carves it sharply. You say it carves it sharply at the level of "definitely," and fuzzily at the level of "red." But since "red" is defined by "definitely" in your logic (via supertruth), you're committed to the sharpness of "definitely."

  **SUPER:** I'm committed to the sharpness of the *model*, not the phenomenon.

  **EPI:** And I'm committed to the sharpness of the *extension*, which explains the phenomenon as ignorance. My skepticism is the price of classical logic and truth. Your "gaps" are the price of trying to model vagueness without ignorance. But you end up with higher-order vagueness that looks suspiciously like higher-order ignorance of where your precisifications stop.

  **SUPER:** Perhaps. But my skepticism is about semantics: we can't pin down the exact set of admissible precisifications. Your skepticism is about the world: we can't pin down which patch is red. I'd rather be uncertain about my model than certain that Patch 634 is red while everyone else calls it orange.

  **EPI:** And I'd rather say everyone is ignorant of the fact than say there is no fact. Otherwise, logic breaks.

  **SUPER:** Then we agree on the patches. We just disagree on whether the silence of the boundary is metaphysical or epistemic.

  **EPI:** Agreed. But don't tell your students that "definitely" saves them from sharp boundaries.

  **SUPER:** And don't tell yours that they can know the boundary if they just try harder.

  **EPI:** I wouldn't dream of it. The margin for error forbids it.
