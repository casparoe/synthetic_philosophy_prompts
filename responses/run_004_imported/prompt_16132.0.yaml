          *   We can't know where it is because of the *margin for error* principle. Knowledge requires safety; if you're too close to the boundary, your belief could easily be false in nearby possible worlds (where usage shifts slightly).
          *   HOV: There are sharp boundaries between "definitely red" and "borderline," and between "borderline" and "definitely not red." We are ignorant of these too.
