prompt: |-
  So at work we've got this internal library that was originally written years ago purely to do rate-limiting for one service, but as a side effect of how it manages its internal queues, it also does connection pooling, and now half our codebase imports it just for that pooling behavior and never even touches the rate-limiting path. We want to gut and rewrite the rate-limiting internals since theyre a mess, and a teammate argues that's totally fine as long as the pooling behavior stays intact, because "the library's function is just whatever it reliably does for callers right now, history doesn't matter." That feels wrong to me, but I'm struggling to justify why the fact that it was originally built for rate-limiting should matter to anyone, given that almost nobody uses it for that anymore. Who's actually right here?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **Context:** An internal library exists.
      *   **Original Purpose:** Rate-limiting for one service.
      *   **Incidental Feature:** Connection pooling (due to internal queue management).
      *   **Current Usage:** Half the codebase uses it *only* for connection pooling. Rate-limiting is rarely/never used.
      *   **Proposed Change:** Rewrite/gut the rate-limiting internals (which are messy).
      *   **Teammate's Argument:** "The library's function is just whatever it reliably does for callers right now, history doesn't matter." (Pragmatic/Behavioral view).
      *   **User's Intuition:** "That feels wrong." (Architectural/Conceptual view).
      *   **Goal:** Determine who is right and justify the reasoning.

  2.  **Evaluate the Teammate's Argument (The Pragmatist):**
      *   *Strengths:* Focuses on actual usage. If the pooling works and is relied upon, breaking it is bad. If the rate-limiting code is dead weight, removing it simplifies things. "Function follows usage" is a strong principle in maintenance.
      *   *Weaknesses:* Ignores coupling, conceptual integrity, and future maintenance. Just because something *works* doesn't mean it's the *right tool*. Incidental features are often fragile.

  3.  **Evaluate the User's Intuition (The Architect):**
      *   *Strengths:* Recognizes "accidental complexity." A library doing two disparate things (rate-limiting + pooling) violates Single Responsibility Principle (SRP). Relying on side effects is risky.
      *   *Weaknesses:* Might be clinging to "original intent" which is indeed irrelevant *if* the new design serves current needs better. The history *itself* doesn't matter, but the *implications* of that history do.

  4.  **Synthesize the Core Conflict:**
      *   It's not about "History vs. Current State."
      *   It's about "Explicit Contract vs. Implicit Coupling."
      *   The teammate is half-right (don't break pooling) but wrong on the philosophy (history/architecture *does* matter for maintainability).
      *   The user is half-right (it's messy/accidental) but might be overvaluing the "original purpose" label.

  5.  **Identify the Real Risks:**
      *   **Fragility:** If pooling is a side effect of rate-limiting logic, changing rate-limiting logic *will* risk breaking pooling.
      *   **Cognitive Load:** New devs see "RateLimiter" but use it for "Pooling." Confusing.
      *   **Configuration Hell:** To tune pooling, do I have to tweak rate-limit settings?
      *   **Testing:** How do you test pooling without triggering rate limits?
      *   **Evolution:** What if pooling needs features incompatible with rate-limiting architecture?

  6.  **Formulate the Verdict:**
      *   **Teammate:** Right about *not breaking existing consumers* (pooling must stay intact). Wrong about *architecture* (accidental features are technical debt).
      *   **User:** Right about *concern separation*. The library is architecturally unsound.
      *   **Conclusion:** You shouldn't just "gut the rate-limiting internals." You should likely **split the library** or **explicitly refactor** the pooling into a first-class feature, decoupling it from the rate-limiting mechanics.

  7.  **Drafting the Argument (Iterative refinement):**
      *   *Acknowledge the teammate's point:* Don't break the API. If callers rely on pooling, preserve that behavior.
      *   *Validate the user's feeling:* It feels wrong because it *is* wrong architecturally. Relying on side effects is dangerous.
      *   *Key Concept:* "Accidental Complexity" and "Single Responsibility Principle."
      *   *Actionable Advice:* Don't just rewrite the internals. Decouple. Make pooling explicit. Rename if necessary.
      *   *The "History" Point:* The user is worried history matters. Actually, history matters only insofar as it explains *why* the code is coupled. The teammate says history doesn't matter. The truth: History explains the debt, but current usage dictates the requirements.

  8.  **Refining the "Who is Right" answer:**
      *   It's not a binary.
      *   Teammate is right on *compatibility*.
      *   User is right on *design*.
      *   The specific claim "history doesn't matter" is false because history explains the *coupling*.
      *   The specific claim "library function is whatever it does" is a definition of *de facto* API, but ignores *conceptual integrity*.

  9.  **Structure the Response:**
