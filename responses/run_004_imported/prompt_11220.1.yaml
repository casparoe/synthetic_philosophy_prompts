          *   *Technical detail:* $M, m \models F\phi \iff \forall h \in H_m, \exists m' > m (m' \in h \land M, m' \models \phi)$. Actually, standard Peircean $F$ is often defined as "inevitably will". So $F\phi$ means "On all histories, eventually $\phi$". Thus if $\phi$ is contingent, $F\phi$ is false.

      *   **Ockhamism:**
          *   *Idea:* We assess truth relative to a specific course of events (a history), even if we are currently at a branching point.
          *   *Formalism:* Evaluation point is a pair $\langle m, h \rangle$ where $m \in h$.
