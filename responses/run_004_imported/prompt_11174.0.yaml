      Another blind spot: Taxes. Barter is income.
      Another: Future reciprocity. If Andre sets a precedent of emergency rates for favors, neighbors won't call him. If Meg sets a precedent of standard rates for emergency favors, Andre will stop taking calls.

      *Decision:* Focus on the "Social Contract" vs. "Market Contract."

