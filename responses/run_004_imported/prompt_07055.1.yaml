      *   Why the stubbornness? Admitting defeat isn't just admitting a math error; it's admitting his *entire philosophical system* is incoherent. If geometry can't be grounded in motion/body, then *De Corpore* fails. If *De Corpore* fails, the political theory loses its scientific claim.

  4.  **Synthesize the Connection (The "How"):**
      *   *The Metaphysical Commitment:* Geometry must be about *real* things (bodies in motion), not abstract concepts.
      *   *The Mathematical Consequence:* This leads to a rejection of indivisibles and infinitesimals (which Wallis used). Hobbes wants finite, constructible steps.
      *   *The Error:* By insisting on a physicalist interpretation of geometric objects, he limits the tools available to solve the problem. He rejects the very methods (limits, infinitesimals) that would eventually solve such problems (calculus).
      *   *The Ego vs. Philosophy:* It's not *just* ego. It's systemic integrity. But yes, by the end, it became entrenched.

