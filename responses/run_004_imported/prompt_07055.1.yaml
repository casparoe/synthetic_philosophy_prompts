answer: |-
  Your roommate is spot on, and your intuition that there's something deeper than just "old man stubbornness" is correct. While Hobbes's ego was certainly massive, the circle-squaring saga isn't just a footnote of crankery; it is the crash site where his metaphysics collided with the future of mathematics.

  To get the "gut-level" sense of this, you have to stop thinking of Hobbes as a philosopher who *also* did math, and start seeing him as a philosopher for whom **math was the only model for truth.**

  Here is the breakdown of why his materialism forced him into a corner on geometry, and why admitting Wallis was right would have meant admitting his entire philosophical system was nonsense.

  ### 1. The Horror of "Nothing"
  The core of Hobbes's metaphysics is radical materialism: **To exist is to be a body.** There is no "incorporeal substance." There is no soul, no spirits, and crucially for math, **no dimensionless objects.**

  In standard Euclidean geometry, a point is defined as "that which has no part." It has zero extension. For a Platonist or a standard mathematician, this is a useful abstraction. For Hobbes, this is metaphysical poison.
  *   **The Hobbesian Intuition:** If a point has zero size, it is literally *nothing*. You cannot build a line out of nothings. You cannot have motion start from nothing. If geometry is the science of quantity and magnitude, its fundamental unit must have magnitude.
  *   **The Consequence:** Hobbes redefines the point. For him, a point is a *mark*. It is the smallest visible or conceivable trace a body can make. It has to be "something."

  This seems like a minor quibble, but it changes the nature of geometry from a study of **static relations** to a study of **generation.**

  ### 2. Geometry as "Making" (Genetic Definition)
  This is the key to unlocking his stubbornness. Hobbes believes we can only truly know what we **make**.
  *   **God** knows the natural world because He made it.
  *   **Humans** cannot know the natural world perfectly (because we didn't make it), but we *can* know geometry perfectly because **we construct the figures.**

  For Hobbes, you don't contemplate a triangle; you draw it. A line isn't a set of points; it is the **trace of a moving point.** A plane is the trace of a moving line.
  *   **Why this matters:** This ties geometry directly to his physics. The fundamental principle of Hobbes's universe is **motion.** Matter in motion. By defining geometry genetically (through motion), he unifies physics and math. Geometry becomes the study of how bodies move to create magnitude.

  **The Gut Check:** Imagine drawing a circle in the sand with a stick.
  *   **Euclid/Wallis:** Cares about the ideal relationship between the radius and the area, regardless of the sand or the stick.
  *   **Hobbes:** Cares about the motion of the stick. The circle *is* the motion. If you can't describe the motion that creates the square equal to that circle, you haven't solved the problem.

  ### 3. The War with Wallis: Concrete vs. Abstract
  John Wallis, his nemesis, represented the new wave of mathematics that was moving toward algebra, infinitesimals, and symbolic logic. Wallis was comfortable with "imaginary" quantities and abstract symbols that didn't necessarily correspond to a physical body in motion.

  To Hobbes, Wallis wasn't just doing math differently; he was doing **metaphysics wrong.**
  *   **Wallis's Math:** Uses symbols and algebraic manipulations that hover above physical reality. It allows for concepts like indivisibles (infinitely thin slices) to calculate areas.
  *   **Hobbes's Objection:** An "infinitely thin slice" is just the old "incorporeal substance" trick in disguise. It's mystical. It's scholastic nonsense. It violates the rule that everything must be a body with magnitude.

  When Hobbes tries to square the circle, he is trying to do it using **only** ruler-and-compass style logic grounded in finite, physical motion. He refuses to use the algebraic shortcuts Wallis uses because he considers them philosophically illegitimate.

  ### 4. Why He Couldn't Admit Defeat
  Now we get to the tragedy of the last 25 years of his life. You asked if the math error is downstream of the metaphysical commitment. **Yes, absolutely.**

  If Hobbes admits that Wallis is right, he isn't just admitting, "I messed up this calculation." He is admitting:
  1.  **Geometry does not require physical motion to be true.** (Undermines his link between physics and math).
  2.  **Dimensionless abstractions are valid tools for truth.** (Undermines his materialist metaphysics).
  3.  **We can know truths about quantities that we cannot physically construct.** (Undermines his epistemology that knowledge = construction).

  For Hobbes, *Leviathan* (his political theory) rests on *De Corpore* (his physics/math). He wants politics to be as certain as geometry. But if geometry itself relies on "mystical" abstractions (as he saw Wallis's math) rather than clear, material causes, then the certainty of his political science evaporates.

  He couldn't admit defeat because **the mathematical error was the price of admission for his philosophical system.** To fix the math, he would have to burn the metaphysics.

  ### 5. The Intuitive Summary
  Think of it like this:

  Hobbes wanted to build a house (his philosophy) where every brick had to be made of solid stone (material bodies). He insisted that you couldn't use mortar that wasn't also stone.
  Wallis came along with modern cement (algebra/infinitesimals). It worked better, it held the building up stronger, and it allowed you to build arches (solve problems like squaring the circle) that solid stone alone couldn't support.

  Hobbes looked at the cement and said, "That is not stone. It is invisible. It is witchcraft. I will not use it."
  He then spent 25 years trying to build an arch out of pure stone blocks. It kept collapsing (his proofs were wrong).
  Everyone said, "Use the cement."
  He said, "If I use the cement, I admit that stone isn't the only thing that exists. And if stone isn't the only thing that exists, my entire theory of the house is wrong."

  ### Verdict
  Was it ego? Yes, Hobbes was notoriously combative. But it was **systematic ego.** He was trapped in a coherence problem. His materialism was so rigorous that it blinded him to the utility of abstraction.

  The "error" wasn't just a calculation mistake; it was a **category error** forced by his metaphysics. He tried to solve a problem of *quantity* using only the tools of *quality* (physical bodies). Your roommate is right: the math feud is the shadow cast by his metaphysics. He died defending the circle not because he couldn't do the math, but because he couldn't afford to let go of the material world that gave his math meaning.
