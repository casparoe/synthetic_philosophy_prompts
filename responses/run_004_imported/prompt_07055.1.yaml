      *   *Epistemology:* Knowledge comes from sense experience and reasoning about causes (motion).
      *   *Geometry:* For Hobbes, geometry isn't about abstract Platonic forms. It's about *construction*. To know something is to know how you made it.
      *   *The Point:* Euclid says a point has no parts. Hobbes says "Nonsense." If it has no magnitude, it doesn't exist. A point must be a small mark, a beginning of magnitude.
      *   *The Line:* Not a set of points, but the *trace* of a moving point. Motion is key.
      *   *Connection to Politics:* Certainty. Geometry offers certainty because we define the premises. Politics should be like geometry. But if geometry is flawed (abstract), politics loses its foundation.

  3.  **Address the Circle-Squaring Obsession (The "What"):**
