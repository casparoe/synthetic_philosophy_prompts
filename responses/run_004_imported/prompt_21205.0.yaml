      *   **Conclusion/Concessions:**
          *   Elena's hard evidence: The patient's *own report*. They never say "I feel like two."
          *   Marcus's hard evidence: The Bilateral Visual Search task. It defies the serial limit of a single stream.

  5.  **Refining the Arguments (Self-Correction during drafting):**
