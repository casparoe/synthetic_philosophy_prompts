answer: |-
  **Setting:** *A quiet corner of a university library, late afternoon. Two chairs face each other across a low table scattered with papers. **Elena** advocates for the Duality View (Puccetti, Marks). **Marcus** advocates for the Unity/Switch View (Bayne).*

  **Elena:** You know, looking at this through the lens of my colleague's background—physics, systems, control theory—the split-brain patient is the only place we have a lever to pull on the substrate of mind and watch the output change. When you sever the corpus callosum, you aren't just cutting fibers. You're decoupling two processing units that were previously synchronized. To say they remain one system is like cutting the drive shaft on a twin-engine plane and insisting there's still only one pilot.

  **Marcus:** But that's the metaphor begging the question, Elena. You're assuming consciousness *is* the processing unit. I'm arguing consciousness is the *output* of the system. In the switch model, there is only one cockpit, one pilot's seat. The hemispheres are merely competing for the controls. When the left hemisphere controls speech and the right hand, the single stream of consciousness is realized by the left. When the right hand grabs a key to unlock a box the left hand is holding, the control—and the phenomenological seat—has switched. It's time-sliced unity.

  **Elena:** Time-sliced? The latency data doesn't support a switch fast enough to account for the dissociation. Let's talk about the chimeric figures. You show a patient a composite image: the left half is a snow scene, the right half is a chicken claw. The left hemisphere (speech) says, "I saw a chicken." The left hand (right hemisphere) points to a shovel. When asked why, the left hemisphere confabulates: "You need a shovel to clean out the chicken shed."

  **Marcus:** I know the study. It's the classic dissociation. But notice what's happening. The patient offers a *unified* narrative. The left hemisphere is constructing a story to make sense of the behavior. That suggests the subject of experience is trying to maintain coherence. If there were truly two distinct minds, why doesn't the right hemisphere protest? Why doesn't the left hand write "No, I saw snow"?

  **Elena:** Because the right hemisphere is largely aphasic. It lacks the vocal apparatus to object. But it *does* object behaviorally. In lateralized tactile tasks, the left hand will often undo what the right hand just did. One hand buttons the shirt, the other unbuttons it. That's not a single pilot switching seats; that's two pilots fighting for the yoke. If it were a single stream, the conflict should be phenomenologically catastrophic. Instead, they report nothing.

  **Marcus:** Exactly! They report *nothing*. That is the crux of my position. If Puccetti is right, and there are two streams of consciousness, we have a metaphysical miracle: two subjects inhabiting one skull who never report encountering each other. Never. In decades of testing, no split-brain patient has ever said, "I feel like two people." They report being themselves. Your view requires us to posit invisible subjects. Mine posits only what is reported: a single subject whose neural realization is fragmented.

  **Elena:** Absence of evidence isn't evidence of absence, especially when the reporting mechanism is compromised. But let's move to the data that keeps me up at night, and should keep you up too. The bilateral visual search tasks.

  **Marcus:** The parallel search argument.

  **Elena:** Right. In a normal brain, if you search for a target across the entire visual field, there's a capacity limit. Attention is a bottleneck. But split-brain patients? They can search the left and right visual fields simultaneously with no loss in efficiency. It's as if they have two independent spotlights. If there is only one stream of consciousness, Marcus, how does it attend to two spatially distinct locations, processing different feature sets, without a switch cost?

  **Marcus:** I'll concede that the speed of the switch must be incredibly fast—faster than the reaction time measures can capture. But more importantly, why assume that *attention* requires *consciousness*? The switch model claims there is one *subject* of experience. It doesn't claim that sub-personal processing can't happen in parallel. The hemispheres can process the visual data in parallel, but the "light" of consciousness only illuminates the winner of the competition at any given micro-interval.

  **Elena:** That sounds like a distinction without a difference. If the right hemisphere finds the target and guides the hand to it before the left hemisphere even knows the search is over, in what sense was the "single stream" involved in the finding? The behavior implies the right hemisphere was *consciously* searching. If you push the consciousness down into the sub-personal to save the unity thesis, you've emptied the word "conscious" of its meaning. The efficiency gains in bilateral search are linear. Two processors give you double the speed. One processor switching back and forth gives you overhead. The data shows double speed.

  **Marcus:** You're treating consciousness like a CPU clock cycle. It's not. But I hear you. The visual search data is the strongest empirical wedge you have. However, you're glossing over the nuisance variable that saves my skin: cross-cuing.

  **Elena:** Ah, the "cheating" defense.

  **Marcus:** It's not a defense; it's a control. We know that split-brain patients develop strategies to integrate information. A flash in the left visual field might cause a head turn that brings it into the right field. A verbal mutter by the left hemisphere cues the right hand. When you rigorously control for cross-cuing—using tachistoscopes, preventing head movement—the evidence for radical independence diminishes. Often, the "two minds" collapse back into a coordinated, albeit slow, single agent. If the duality were fundamental, cross-cuing shouldn't be able to bridge the gap so effectively.

  **Elena:** We do control for it, Marcus. We use contact lenses, we restrict fixation. And yet, the dissociation remains. The left hand can type a word the right hand doesn't know. But... I will grant you this: cross-cuing is the ghost in my machine. It suggests the hemispheres are *motivated* to unify. If they were truly distinct persons, why the effort to coordinate? Why does the right hemisphere defer to the left's verbal authority so often? It looks less like two strangers trapped in a room and more like one person struggling with a bad connection.

  **Marcus:** Precisely. It's a single system struggling with bandwidth limitations.

  **Elena:** But that brings me back to the search task. Even with strict controls, the parallel processing advantage persists in some patients. That is the rock I cannot move. If I am right, and there are two minds, the hardest thing to explain is the *silence*. Why does the right hemisphere never scream? Why is there no phenomenological report of duality? I have to posit a "mute mind" that is conscious but forever cut off from expression. That's metaphysically expensive.

  **Marcus:** And if I am right, and there is one mind, the hardest thing to explain is the *bandwidth*. How does a single stream of consciousness account for the bilateral search efficiency without invoking a switch so fast it becomes indistinguishable from parallelism? I have to posit a mechanism of switching that violates our understanding of attentional bottlenecks. That's empirically expensive.

  **Elena:** So, we are left with a choice between invisible subjects and impossible switching speeds.

  **Marcus:** It seems so. You accommodate the behavioral independence but lose the subjective report. I accommodate the subjective report but strain against the behavioral capacity.

  **Elena:** Then let's make it official. For the record: My hardest pill to swallow is the patient's own testimony. As a scientist, I trust the third-person data, but in philosophy of mind, ignoring the first-person report feels like measuring heat without a thermometer. If there are two of them, why does it only feel like one?

  **Marcus:** And my hardest pill is the bilateral visual search. It violates the serial nature of the single stream I defend. If consciousness is unified, it should be serial. The data says it's parallel. I have to argue that what looks like parallel consciousness is actually serial switching on a timescale we can't yet resolve. It feels like special pleading.

  **Elena:** Then we agree on the data. We just disagree on the ontology.

  **Marcus:** Which, I suspect, is where the physics background helps you. You're comfortable with wave-particle duality. Maybe mind is just... context-dependent.

  **Elena:** *Laughs.* Don't tempt me to quantize consciousness, Marcus. But until we have a better meter for the stream, I'll stick with the two pilots. Even if they never speak to each other.

  **Marcus:** And I'll stick with the one pilot. Even if the controls are wired in parallel.
