answer: |-
  This is not just you being salty. You have put your finger on one of the central tensions in modern academic governance. What you are describing is a crisis of **legitimacy** versus **authority**.

  The administration and tenure line have the *authority* (by bylaws) to vote, but you are questioning the *legitimacy* (the moral right) of that vote. Those are two different things. A decision can be procedurally correct but politically illegitimate.

  To answer your specific question: No, it does not have to collapse into arbitrary line-drawing. There are established political and ethical frameworks you can use to articulate why the exclusion of adjuncts, TAs, and students matters. Here are four principled arguments you can use to frame this, moving beyond "it doesn't feel right."

  ### 1. The "All-Affected Principle"
  In democratic theory, the strongest principle for determining suffrage is the **All-Affected Principle**: *Anyone whose interests are significantly affected by a decision should have a say in making it.*

  *   **The Argument:** A core requirement dictates labor conditions for adjuncts (who teach the bulk of it), pedagogical labor for TAs, and educational trajectory for students.
  *   **The Flaw in the Current System:** By restricting the vote to tenure-line faculty, the department is prioritizing *institutional permanence* over *impact*. Just because a tenure-line faculty member will be here in 10 years doesn't mean they are the ones most affected *today*.
  *   **How to phrase it:** "Governance legitimacy relies on the inclusion of all stakeholders whose labor and educational outcomes are bound by this decision. Excluding the primary implementers creates a democratic deficit."

  ### 2. Epistemic Authority (Who Knows the Classroom?)
  This is an argument about knowledge, not just rights. Legitimacy in curriculum design should rely on **epistemic authority**—who actually possesses the knowledge required to make a good decision?

  *   **The Argument:** Tenure-line faculty often teach specialized upper-division courses or seminars. Adjuncts and TAs frequently teach the introductory, high-enrollment courses that a core requirement usually targets. They possess superior data on student preparedness, workload reality, and failure rates.
  *   **The Flaw in the Current System:** Voting based on rank assumes that research prestige correlates with pedagogical insight into introductory requirements. It often does not.
  *   **How to phrase it:** "We are making a pedagogical decision without the input of the pedagogical experts. The faculty teaching 80% of these sections possess critical data on feasibility that is absent from this room."

  ### 3. The Implementation Veto
  This is a pragmatic, rather than moral, argument. It focuses on the **capacity for execution**.

  *   **The Argument:** A curriculum requirement is not a law passed in a vacuum; it is a workflow. If the people responsible for the workflow (adjuncts/TAs) are not bought in, the policy will fail or be implemented poorly.
  *   **The Flaw in the Current System:** It treats the vote as the end of the process, rather than the beginning of the labor.
  *   **How to phrase it:** "Legitimacy isn't just about the vote count; it's about buy-in. If the instructors who deliver this curriculum feel disenfranchised by its creation, we risk passive resistance or inconsistent delivery, which undermines the requirement's goals."

  ### 4. The "Stewardship" Counter-Argument (And Why It's Weak)
  To be fair, you need to understand the principle the tenure line is using to defend themselves. It is the **Fiduciary or Stewardship Model**.

  *   **Their Argument:** Tenure-line faculty are the only permanent stakeholders. Adjuncts leave, students graduate, TAs move on. Therefore, only tenure-line faculty can vote on decisions binding the department for a decade because they are the only ones who will be around to answer for it.
  *   **The Rebuttal:** This model relies on a version of the university that no longer exists. If 70% of the teaching is done by non-permanent staff, the "stewards" are no longer the ones maintaining the building. You cannot claim long-term stewardship while offloading the long-term labor to temporary staff.
  *   **How to phrase it:** "Stewardship implies responsibility for the outcome. If we do not share the governance with those sharing the labor, we are not stewards; we are managers. And we lack the leverage to manage effectively without their consent."

  ### Why It Feels Arbitrary (And How to Fix the Discourse)
  You asked if the line-drawing is arbitrary. In practice, **yes**. It is based on an outdated labor model where the tenure line did most of the teaching.

  However, you can stop it from feeling arbitrary by shifting the language from "Fairness" to "Risk."
  *   **Don't say:** "It's unfair that adjuncts didn't vote." (This sounds like whining about equity, which tenure lines often tune out).
  *   **Do say:** "The process lacks the necessary feedback loops to ensure this requirement is sustainable. We are voting on a workflow we do not personally inhabit."

  ### A Note on Students
  Regarding students: While the "All-Affected Principle" suggests they should vote, academic governance rarely gives students *voting* power on curriculum (usually just advisory). However, excluding them entirely from *consultation* on a core requirement is a major risk. If students hate it, enrollment drops, and the major dies. You can argue that while they shouldn't necessarily *vote*, a lack of *student consultation* renders the data incomplete.

  ### Summary for Your Next Meeting
  If you want to raise this again without sounding "salty," try this framing:

  > "I respect the bylaws that granted us the vote. However, for a decision with a ten-year horizon, procedural legitimacy isn't enough; we need functional legitimacy. By excluding the majority of the instructors who will teach this and the students who will take it, we have created a high risk of implementation failure. I move that we condition the passage of this requirement on the formation of an implementation committee that includes voting representation from adjunct faculty and TAs."

  This forces the department to acknowledge that the vote was only step one, and that the "illegitimate" part (the exclusion of labor) must be remedied in the execution phase.

  **Verdict:** You aren't being salty. You are identifying a gap between **governance structure** and **labor reality**. That is a valid, principled critique.
