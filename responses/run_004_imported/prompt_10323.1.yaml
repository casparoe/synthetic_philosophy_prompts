  3.  **Deconstruct the "Legitimacy" Question:**
      *   Legitimacy in governance usually rests on a few pillars:
          *   *Authority:* Who has the legal/contractual right?
          *   *Stake:* Who is affected?
          *   *Expertise:* Who knows best?
          *   *Responsibility:* Who bears the burden of implementation/maintenance?

  4.  **Brainstorming Principles of Representation:**
      *   *All-Affected Principle:* Everyone affected should have a say. (Strongest moral argument, but practically difficult).
      *   *Stewardship/Fiduciary Model:* Tenure lines are "stewards" of the department's long-term health. (The administration's likely argument).
      *   *Labor/Implementation Model:* Those who do the work should decide how the work is done. (Adjunct/TA argument).
      *   *Consumer/Customer Model:* Students are the consumers. (Student gov argument, but often weak in curriculum).

  5.  **Evaluating the Specific Exclusions:**
      *   *Adjuncts:* High teaching load, low job security. Excluding them ignores the reality of *who* teaches.
      *   *Grad TAs:* Trainees, temporary. Often excluded from governance, but heavily impacted.
      *   *Students:* Future stakeholders. Usually represented by student gov, but rarely vote on specific curriculum.
      *   *Tenure-Line:* Permanent, research-focused, governance-heavy. Traditionally hold the vote.

  6.  **Developing a Principled Argument (The "Meat" of the response):**
      *   Avoid just validating the saltiness (though acknowledge it).
      *   Provide frameworks the user can use in future discussions.
      *   *Framework 1: The All-Affected Principle.* (Democratic theory). If you are bound by the rule, you should have a voice.
      *   *Framework 2: Implementation Feasibility.* If the people teaching it didn't agree, will it fail? (Pragmatic argument).
      *   *Framework 3: Epistemic Justice.* Who has knowledge about the classroom reality? Adjuncts often know more about student needs than research faculty.
      *   *Framework 4: Institutional Stability vs. Flexibility.* Tenure lines vote for stability; adjuncts need flexibility/survival.

  7.  **Addressing the "Arbitrary Line-Drawing" Fear:**
      *   Yes, lines *must* be drawn (you can't vote for *everyone*).
      *   But the *criteria* for the line shouldn't be arbitrary (e.g., employment status vs. impact).
      *   The current line (tenure status) is a historical artifact, not necessarily a moral principle.

  8.  **Drafting the Response (Iterative Process):**
      *   *Opening:* Validate the feeling. It's not just salt; it's a governance crisis common in academia.
      *   *Section 1: The "All-Affected Principle".* This is the strongest philosophical counter-argument. Cite it.
      *   *Section 2: The "Implementation Veto".* Pragmatic argument. If adjuncts hate it, the class suffers.
      *   *Section 3: The "Stewardship" Counter-argument.* Acknowledge why tenure lines vote (long-term commitment). But critique it (does it match reality?).
      *   *Section 4: Why it feels illegitimate.* It's about *agency* and *labor*.
