      *   **Methodological Individualism (MI):** Social phenomena *must* be explained by reference to individual actions, beliefs, and desires. Institutions are abstractions. Key figures: Popper, Watkins, Weber (interpretive sociology).
      *   **Holism/Structuralism:** Social structures have emergent properties that constrain/enable individuals in ways not reducible to individual psychology. "Social facts" (Durkheim). Key figures: Durkheim, Marx (structural aspects), Searle (institutional facts).
