      *   *Continuity:* His politics are consistent: Order, Law, Gradual Evolution (Morphology). Revolution is a disease (though sometimes a necessary fever).
      *   *Napoleon:* The exception that proves the rule. Napoleon was "Order from Above," Revolution is "Chaos from Below." Goethe prefers the former but lives in the latter's aftermath.
