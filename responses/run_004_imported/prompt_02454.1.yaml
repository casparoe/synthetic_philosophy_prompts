      *   *Political Context:* Goethe was a minister of state in Weimar for decades. He saw the French Revolution (1789) firsthand (Valmy campaign). He hated the mob violence. He valued stability, order, and the "enlightened despotism" of Carl August.
      *   *The Connection:* The "volcano" metaphor is key. He uses it for the revolution but pivots. He fears the "volcano" in politics (uncontrollable, destructive) but welcomes the "eruption" in science (clarification, truth coming to light).
