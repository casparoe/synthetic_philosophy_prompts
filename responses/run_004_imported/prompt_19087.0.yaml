answer: |-
  This is a classic crux in Pascal scholarship, and your advisor is steering you correctly. It is not an inconsistency on Pascal's part, but it is a significant category error to read the "Justice, force" fragment (Lafuma 103 / Sellier 97) as a Hobbesian theory of legitimacy.

  If you anchor your chapter on the reading that Pascal reduces justice to force in the same way Hobbes does, you will likely face serious pushback from examiners familiar with the *Pensées*. The distinction lies in the **ontological status of justice** versus the **sociological observation of power**.

  Here is a breakdown of why your reading is an oversimplification, how Pascal differs from Hobbes on this specific point, and how you can reframe this comparison to strengthen your dissertation.

  ### 1. Constitutive vs. Diagnostic
  The fundamental difference is that Hobbes is making a **constitutive** claim, whereas Pascal is making a **diagnostic** one.

  *   **Hobbes (Constitutive):** In *Leviathan*, the Sovereign's command *creates* justice. Prior to the Commonwealth, there is no common measure of right and wrong. When the Sovereign labels an action "just," it becomes just by definition. Force (the power of the sword) is the mechanism that gives efficacy to the law, but the law's authority stems from the authorization of the Sovereign. For Hobbes, "might makes right" is a solution to the problem of order; it is how peace is secured.
  *   **Pascal (Diagnostic):** Pascal is not saying force *makes* things just. He is saying that because humans are too corrupt and weak to uphold true justice, they **usurp the name of justice** to stabilize force. When he writes, "not being able to make what is just strong, we have made what is strong just," he is describing a tragic historical and psychological fact, not a normative political settlement. He is describing a **usurpation**, not a **legitimation**.

  For Pascal, true Justice exists (in God), but it is inaccessible to fallen reason. Therefore, political society operates on a fiction. For Hobbes, true Justice (independent of the Sovereign) does not exist in the civil sphere; the fiction is the State of Nature, and the reality is the Civil Law.

  ### 2. The Role of *Coutume* (Custom)
  To understand Pascal's argument without flattening it into Hobbesian positivism, you must read the "Justice, force" fragment alongside his writings on *coutume* (custom).

  Pascal argues that human beings are governed by custom rather than reason. We obey laws not because we recognize their intrinsic rationality or justice (which reason cannot reliably discern), but because they are established. Custom creates a "second nature" that stabilizes society.
  *   **The Hobbesian move:** We obey because we rationally consent to the Sovereign to avoid violent death.
  *   **The Pascalian move:** We obey because custom has habituated us to regard established power as authoritative, and to question it would lead to chaos, which is worse given our epistemic limitations.

  Pascal's point is that political authority rests on a **foundational myth**. We dress force in the robes of justice ("plausible equity") so that people will obey without constant revolt. This is not because the force *is* just, but because human society cannot survive if every individual demands to see the "true justice" of a law before obeying it.

  ### 3. The Three Orders
  This is the theological key that resolves the "inconsistency" you noted. Pascal distinguishes between three orders:
  1.  **The Order of Flesh:** Power, politics, wealth (the realm of Princes and Kings).
  2.  **The Order of Mind:** Knowledge, science, reason (the realm of Scholars).
  3.  **The Order of Charity:** Holiness, grace, true justice (the realm of Saints and God).

  Pascal's critique in the "Justice, force" fragment is that the **Order of Flesh** tries to mimic the **Order of Charity**. Political power (Flesh) claims the authority of True Justice (Charity).
  *   **Hobbes** collapses these orders. The Sovereign controls both the sword and the definition of public morality/religion.
  *   **Pascal** keeps them distinct but acknowledges their tragic confusion in earthly life. He admits that in the *political* sphere, force rules. But he insists this does not negate the existence of *true* justice in the *spiritual* sphere.

  When Pascal says "justice without force is powerless," he is speaking strictly within the Order of Flesh. He is not denying the existence of the Order of Charity; he is lamenting that the Order of Flesh cannot access it.

  ### 4. How to Reframe This for Your Dissertation
  You can still use the Hobbes comparison, but it needs to be a **contrast in ends**, not a similarity in means. Both Hobbes and Pascal start from a similar skepticism about the capacity of unaided reason to agree on moral truths (the "war of all against all" vs. the "diversity of customs"). However, they diverge on the implication:

  *   **Hobbes's Skepticism leads to Absolutism:** Because reason cannot find truth, we must construct an artificial truth (the Sovereign) to ensure survival. The reduction of justice to command is a *feature*, not a bug.
  *   **Pascal's Skepticism leads to Fideism:** Because reason cannot find truth, and force is a poor substitute, we must recognize the misery of our condition and turn to Faith. The reduction of justice to force is a *symptom of the Fall*.

  **Suggested Formulation:**
  > "While Hobbes utilizes moral skepticism to construct a positivist theory of authority where the Sovereign's will constitutes justice, Pascal employs a similar skepticism diagnostically. For Pascal, the collapse of justice into force is not a legitimate foundation for authority but evidence of humanity's fallen epistemic state. Where Hobbes sees the stabilization of power as the achievement of political rationality, Pascal sees it as a necessary 'plausible equity' that masks the absence of true justice, pointing the believer toward the need for divine grace rather than political finality."

  ### 5. Why Your Advisor Stopped You
  If you argue Pascal is making a Hobbesian move, you imply Pascal thinks political authority is *self-sufficient* or *rationally justifiable* through power. Pascal explicitly denies this. He advocates for obedience to established powers (a form of political quietism), but he does so **despite** their lack of true justice, not **because** their power makes them just.

  He obeys the King because the King holds the sword and God commands order, not because the King defines Justice. If the King commands something against God, Pascal's hierarchy of orders suggests the Order of Charity supersedes the Order of Flesh (though he is cautious about advocating rebellion). Hobbes, conversely, makes the Sovereign the ultimate interpreter of Divine Law in the public sphere.

  ### Summary for Your Chapter
  1.  **Don't discard the comparison:** It is fruitful to show how early modern skepticism puts pressure on the concept of legitimacy.
  2.  **Clarify the divergence:** Hobbes solves the problem politically (Sovereign defines justice); Pascal diagnoses the problem theologically (Force mimics justice because man is fallen).
  3.  **Key Terminology:** Use "usurpation" rather than "reduction." Use "custom" (*coutume*) to explain why we accept the fiction. Use "Orders" to explain why true justice still exists for Pascal.
  4.  **The "Inconsistency":** It is resolved by recognizing that Pascal is describing the *City of Man* (where force rules) while affirming the *City of God* (where justice rules). Hobbes attempts to merge them into one Commonwealth.

  This nuance will show your committee that you grasp the theological underpinnings of Pascal's political thought, distinguishing him from the secular materialists like Hobbes who are often grouped with him under the banner of "early modern skepticism."
