      *   *Descartes' Claim:* Animals/machines might emit sounds or fixed responses. But only humans can rearrange words to signify thoughts in response to *anything* said in their presence. Even dull humans do this; no animal does.
      *   *The AI Challenge:* LLMs *do* rearrange words. They *do* reply to almost anything. On the surface, they seem to pass.
