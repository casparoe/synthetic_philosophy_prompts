  **To:** Members of the Honorary Degrees Committee
  **From:** [Your Name]
  **Date:** October 26, 2023
  **Subject:** Recommendation Regarding the Nomination of [Nominee Name]

  **Recommendation**
  I recommend that the committee **proceed** with the nomination, forwarding it to the Senate with a specific explanatory minute. While I acknowledge the gravity of the objections raised, I do not believe the nominee's conduct meets the statutory threshold of bringing the university "into disrepute." Withdrawing the nomination would constitute a failure to engage with the tragic complexities of political ethics that a university ought to confront.

  **The Statutory Standard: "Disrepute"**
  Our statute permits withdrawal *only* for conduct that would bring the university "into disrepute." This is not a general mandate for moral purity, but a protection of the institution's integrity. Disrepute arises from hypocrisy, ignorance, or the endorsement of values antithetical to our mission. It does not arise merely from honoring a figure whose life contains profound moral contradictions, provided we do not ignore those contradictions.

  **Engaging the Anscombe Objection**
  The philosopher on our committee has correctly identified the core of Elizabeth Anscombe's 1956 argument against Oxford honoring Truman. Anscombe does not argue from utilitarian calculus (lives saved vs. lives lost); she argues from *intentionality*. Her contention is that choosing to kill the innocent *as a means* to an end (coercing surrender) is intrinsically evil—a form of murder that no "necessity" defense can sanitize. On this view, the nominee's order was not "collateral damage" but the deliberate weaponization of civilian death. To honor him, she argues, is to endorse that moral logic.

  This argument is philosophically robust. We must concede that, under Anscombe's deontological framework, the strike was a moral catastrophe. If our honor were intended to certify the nominee's moral innocence, Anscombe's objection would be fatal.

  **The "Dirty Hands" Counter-Argument**
  However, the committee members urging us to proceed rely on a distinction central to modern political ethics: the problem of "dirty hands." This view holds that political leadership sometimes coerces individuals into choices where *all* options involve moral wrongdoing. The nominee's memoir confirms he understood the strike not as a triumph, but as a burden accepted to prevent a greater slaughter.

  The "Dirty Hands" argument does not claim the act was good; it claims the act was *inevitable* within the tragic logic of that specific war, and that the moral weight lies in the leader's willingness to bear the guilt. Crucially, the nomination is not for the strike itself, but for the subsequent thirty years of democratic institution-building. To withdraw now is to assert that a single act of statecraft, however terrible, permanently negates a lifetime of redemption and public service. It collapses the distinction between the *act* and the *agent*.

  **Synthesis**
  Anscombe is right that the strike cannot be morally washed clean. But the "Dirty Hands" proponents are right that the university's honor need not be an endorsement of the strike. We can proceed without endorsing the nuclear order by framing the degree as a recognition of the nominee's *acceptance of responsibility* and his subsequent commitment to peace.

  Withdrawing the nomination would signal that the university prefers moral simplicity to political truth. It would suggest we cannot honor a man who helped build a democracy because his hands are dirty, ignoring that democratic foundations are often laid by those who have faced catastrophic choices. "Disrepute" would stem not from honoring him, but from our refusal to acknowledge the grim realities of the history we study.

  **Conclusion**
  I urge we proceed. We honor the totality of the life, including the burden of its darkest chapter, without absolving it. This upholds our statute and our mission.
