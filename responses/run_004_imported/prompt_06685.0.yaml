answer: |-
  # The Grue Machine: Why Solomonoff Induction Relocates Rather Than Resolves Goodman's Riddle

  Among the rationalist diaspora, a specific piece of orthodoxy has hardened into dogma: Solomonoff Induction (SI) solves Goodman's New Riddle of Induction. The argument is seductive in its simplicity. Goodman's "grue" predicate (green if observed before time $T$, blue thereafter) seems intuitively gerrymandered compared to "green." Since SI weights hypotheses by their Kolmogorov complexity (program length), and "print green" is presumably a shorter program than "if time < T then print green else print blue," the formalism naturally penalizes grue. We have, it seems, mathematized Occam's Razor and thereby bypassed the need for Goodman's vague sociological appeal to "entrenchment."

  This orthodoxy is wrong. It relies on a conflation of *description length* with *intrinsic simplicity*, ignoring the fact that Kolmogorov complexity is relative to a choice of Universal Turing Machine (UTM). As Sven Neth (2022) and others have rigorously demonstrated, one can construct a "Grue Machine"—a UTM where `grue` is a primitive operation and `green` is the complex, disjunctive derived property. On such a machine, SI favors grue.

  The standard defense is that SI converges on the truth in the limit regardless of the UTM choice. This defense is mathematically correct but philosophically vacuous for the specific problem at hand. Because green and grue are empirically indistinguishable prior to $T$, no amount of pre-$T$ data can update the prior. The prediction at $T$ is determined entirely by the arbitrary choice of UTM.

  Therefore, the verdict must be definite: **Solomonoff Induction does not solve the New Riddle of Induction. It merely relocates the arbitrariness Goodman identified in natural predicates to the choice of description language one level up.** Furthermore, this is not a new difficulty distinct from Hume; it is precisely Hume's original problem of induction wearing a computational costume. SI provides a consistent framework for processing evidence, but it cannot justify the prior assumptions required to make induction work in the first place.

  ### The Failure of Entrenchment

  To understand why the SI solution is alluring, we must first see why Goodman's own solution is widely regarded as inadequate. Goodman's *Fact, Fiction, and Forecast* (1955) posed the grue paradox to show that syntactic rules of confirmation (like "all observed $F$ are $G$") are insufficient. Any observation of a green emerald before $T$ confirms both "all emeralds are green" and "all emeralds are grue."

  Goodman's reply was **entrenchment**. We project "green" rather than "grue" because "green" has a history of successful projection in our linguistic community. "Green" is entrenched; "grue" is not.

  Philosophers generally reject this as a solution because it is descriptive, not normative. Entrenchment tells us *that* we prefer green, but not *why we are justified* in doing so. It reduces epistemology to intellectual history. If our ancestors had spoken Grueish, we would be entrenched in grue, and SI proponents argue we would be wrong (since emeralds are presumably physically green, not grue). A theory of induction ought to explain why one hypothesis is objectively better supported by evidence than another, not merely why one is more familiar. Goodman effectively admitted that there is no logical distinction between green and grue, only a pragmatic one rooted in habit. For those seeking a rationalist foundation for science, this is a surrender.

  ### The Solomonoff Promise and the UTM Trap

  Solomonoff Induction appears to offer the normative grounding Goodman lacked. By defining the prior probability of a hypothesis as $2^{-L}$, where $L$ is the length of the program generating the data on a UTM, SI claims to objectify simplicity. "Green" is a constant function; "Grue" requires a conditional check on time $T$. Thus, $L(\text{green}) < L(\text{grue})$, and the green hypothesis receives a higher prior.

  This argument collapses under the relativity of Kolmogorov complexity. $K(x)$ is not an absolute property of string $x$; it is $K_U(x)$, relative to a machine $U$. The Invariance Theorem states that for any two UTMs $U_1$ and $U_2$, the difference in complexity is bounded by a constant $|K_{U1}(x) - K_{U2}(x)| \leq c$. Proponents argue this constant is negligible for large data sets.

  This is where the "convergence in the limit" defense is deployed. Yes, a Grue Machine might favor grue initially, but as we accumulate data, the true hypothesis will eventually dominate the posterior probability.

  **This defense fails catastrophically for the Grue problem.** The Grue problem is not about long-run convergence; it is about the prediction at $T$. By construction, the data stream before $T$ is identical for both the Green and Grue hypotheses. In Bayesian terms, the likelihood ratio $P(Data | Green) / P(Data | Grue)$ is exactly 1 for all observations $t < T$. Consequently, the posterior odds equal the prior odds.

  If you choose a standard UTM, your prior favors Green, and you predict Green at $T$. If you choose a Grue Machine, your prior favors Grue, and you predict Blue at $T$. Since no evidence available *before* $T$ can shift these probabilities, the prediction is determined entirely by the arbitrary choice of $U$. The "constant" difference in complexity is not washed out by data; it is the *only* thing driving the prediction in the critical window.

  Neth's analysis confirms that without a privileged UTM, SI cannot distinguish between "natural" and "gruesome" predicates. To claim SI solves Grue is to implicitly assume our specific UTM (or human cognitive architecture) is the "correct" one. But asserting that our UTM is correct is simply asserting that "green" is the natural predicate—which is the very conclusion SI was supposed to prove. It is circular.

  ### Hume in Computational Costume

  This brings us to the final question: Is this a new problem, or is it Hume's problem of induction re-encoded?

  David Hume argued that there is no logical justification for the Principle of the Uniformity of Nature. We assume the future will resemble the past, but that assumption itself relies on past experience, rendering the argument circular.

  Solomonoff Induction attempts to break this circle by replacing "Uniformity of Nature" with "Computability and Simplicity." It posits that the universe is generated by a computable process and that shorter programs are more likely. Proponents often view this as a rigorous upgrade over Hume's vague "custom and habit."

  However, the Grue analysis reveals that **the assumption of Simplicity is just the Uniformity of Nature in disguise.** To say "the universe prefers shorter programs" is to make a metaphysical claim about the structure of reality. Why should the fundamental laws of physics be compressible in *our* chosen description language? There is no logical necessity for this. A universe where `grue` is the fundamental force and `green` is the derived anomaly is logically consistent.

  SI does not solve Hume's problem; it formalizes the *assumption* required to ignore Hume's problem. It tells us: *If* you accept Occam's Razor as a prior axiom, *then* induction is coherent. But it cannot tell you *why* you should accept that axiom without begging the question. When a LessWrong rationalist says, "SI favors green," they are really saying, "Given a prior that penalizes time-dependent disjunctions, SI favors green." The work is being done by the prior, not the induction mechanism.

  This is not a failure of SI as a mathematical tool; it is a failure of the hope that math can dissolve metaphysics. The arbitrariness Goodman found in "entrenchment" is indeed relocated to the choice of UTM. But this relocation is significant: it makes the arbitrariness explicit. Goodman hid the bias in linguistic history; SI hides it in the reference machine.

  ### Verdict

  The appeal to Algorithmic Information Theory does not provide a principled solution to Goodman's New Riddle. It provides a **principled formalization of the bias** we already hold.

  1.  **Goodman's Entrenchment** was rejected because it was circular and descriptive.
  2.  **Solomonoff's Complexity** is rejected as a solution because it is relative to a UTM, and the "convergence" defense is irrelevant when hypotheses are empirically equivalent in the observation window.
  3.  **Hume's Ghost** remains. SI assumes the universe is simple relative to a specific encoding. This is an unprovable metaphysical commitment, equivalent to assuming the Uniformity of Nature.

  We should not discard Solomonoff Induction. It remains the gold standard for defining idealized reasoning *given a prior*. But we must discard the notion that it saves us from the need to justify our priors. The choice between "green" and "grue" is not settled by counting bits; it is settled by betting on the structure of reality. SI clarifies the bet, but it cannot win it for us. The arbitrariness is not a bug to be patched; it is the fundamental cost of doing inductive business in a contingent universe.
