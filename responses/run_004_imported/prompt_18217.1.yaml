  Every couple of years some article about quantum suicide and quantum immortality does the rounds again, and the pitch is always the same: since every branch with nonzero amplitude actually happens under many-worlds, theres always a version of you that survives the quantum russian roulette no matter how many rounds you play, so subjectively you should expect to just never die. What these pieces never seem to mention is that your surviving branches make up a shrinking sliver of the total quantum measure as the rounds pile up -- shouldn't that matter for what you're rationally entitled to expect? Can you walk me through whether Born-rule branch weighting basically defuses the quantum immortality argument, or whether there's a real defense of it once you factor that in -- and how the decision-theoretic derivations of the Born rule (the Deutsch/Wallace stuff) are supposed to bear on it. Not looking for the "shut up and calculate" answer, I want the actual philosophical mechanics.
