answer: |-
  This is a fantastic observation, and you are in good company. The parallel between Frege's *Sinn/Bedeutung* distinction and the intensional/extensional distinctions in computer science (particularly in semantics of programming languages) has been explored by philosophers and logicians like Dana Scott, Christopher Strachey, and more recently in the philosophy of computation.

  Your intuition is correct that there is a structural isomorphism here. However, your friend is also correct that mapping them 1:1 "flattens" the philosophical problem. The reason the debate persists isn't because philosophers haven't noticed computability theory; it's because Frege's puzzle targets problems that computation, by design, sidesteps or treats as errors.

  Here are the three specific places where the "reference/value equality + Rice's Theorem" model leaves out the philosophical meat, and why the debate remains open.

  ### 1. Substitutivity in Intensional Contexts (The "Lois Lane" Problem)
  This is the strongest technical counter-argument to the CS mapping.

  In your Python model, if `a is b` evaluates to `True`, you can substitute `a` for `b` anywhere in the program without changing the program's behavior (extensional equivalence). If `superman = clark_kent`, then `lois_loves(superman)` is bitwise identical to `lois_loves(clark_kent)`. The machine only sees the reference (memory address).

  Frege's puzzle arises specifically because natural language allows **intensional contexts** where substitution of identicals *fails* to preserve truth.
  *   **Premise 1:** Superman = Clark Kent (Same Reference/*Bedeutung*)
  *   **Premise 2:** Lois Lane believes Superman can fly. (True)
  *   **Conclusion:** Lois Lane believes Clark Kent can fly. (False)

  In a strictly extensional system (like standard Python), this substitution *must* hold. If it doesn't, it's a bug (or you're using `eval`/reflection to inspect variable names, which is effectively cheating the type system). For Frege, the "Sense" (*Sinn*) is not just a different variable handle; it is part of the **truth conditions** of the proposition when embedded in belief, necessity, or knowledge operators.

  **Why CS doesn't solve this:** To model this in code, you have to reify the "Sense" as a string or a closure and prevent the interpreter from resolving the reference. You are essentially building a non-standard semantics on top of the machine. The machine itself is purely extensional; it has no "beliefs." The philosophical problem is explaining how rational agents (minds) can hold contradictory beliefs about the same object. Computation explains how to manipulate the symbols, but not why the *agent* distinguishes them when the *object* is identical.

  ### 2. Epistemology vs. Semantics (Rice's Theorem misses the point)
  You argue that Rice's Theorem (undecidability of semantic properties) explains why identity claims are informative: it's hard to compute if two things are the same.

  However, Frege's puzzle applies even to **trivial, decidable cases**.
  *   Consider: `118 + 13 = 131`.
  *   This is decidable. It is computationally trivial.
  *   Yet, for a child learning arithmetic, "118 + 13 = 131" is informative, while "131 = 131" is not.

  Rice's Theorem explains why we can't *automate* the discovery of identity in complex systems. It does not explain why the *statement of identity* carries cognitive significance even when the computation is easy. Frege is interested in the **nature of thought**, not the **complexity of verification**.

  In your aliasing bug, the "news" was epistemic (you didn't *know* they were the same). Frege is arguing something stronger: that the *meaning* of the terms differs. If Sense were just "computational difficulty," then once you optimized your code and cached the result, the Sense would vanish. But "Morning Star" and "Evening Star" retain different meanings even after we know they are Venus. The "mode of presentation" is stable; computational hardness is contingent on our current technology or algorithm.

  ### 3. Empty Names (The `null` Pointer Exception)
  This is where the CS model often breaks down completely.
  *   **Code:** `king_of_france = None`. If you try to access `king_of_france.is_bald`, you get an AttributeError or a `NoneType` error. The program halts or handles the exception.
  *   **Frege:** "The present King of France is bald."

  For Frege, this sentence has a **Sense** (we understand what it means) but no **Reference** (there is no King of France). The philosophical puzzle is: **Is the sentence true, false, or meaningless?**
  *   If it's false, then "The present King of France is not bald" must be true. But that implies there *is* a King of France who lacks baldness.
  *   If it's meaningless, how can we argue about it?

  In CS, we solve this pragmatically with `null` or `Option` types. We say, "The reference is null." But philosophically, this pushes the problem back: What is the `null` object? It's an object that represents the absence of an object. Frege's distinction allows us to say the *thought* exists (Sense) even if the *truth value* cannot be assigned (no Reference).

  Your CS model assumes that if there is no reference, there is no value to compare. Frege is asking how we can have a valid *comparison* (a meaningful sentence) when one side of the equation picks out nothing.

  ### Why the debate persists
  You asked why this doesn't just get reframed in computational terms. The answer is that philosophy is often doing a different job than computer science.

  1.  **Normativity vs. Description:** CS describes how symbols are manipulated. Philosophy asks how they *ought* to be interpreted to preserve truth and rationality. The "Lois Lane" case shows that human rationality violates strict extensional substitution. A philosophy of language must account for human reasoning, not just machine execution.
  2.  **The Nature of "Sense":** For Frege, Senses are abstract objects (like numbers), not psychological states or algorithms. They exist in a "third realm." CS treats "Sense" as code (procedures/algorithms). Many philosophers reject the reduction of meaning to procedure because meaning seems to involve intentionality (aboutness) that code lacks.
  3.  **Metaphysics:** The debate often shifts to metaphysics. Is "Venus" the reference? Or is the reference a bundle of properties? If I say "Venus is hot," am I talking about the planet or the concept? CS says "it's the object at address 0x..." Philosophy asks "what constitutes the objecthood of Venus?"

  ### How to talk to your friend
  You aren't "losing" the argument, but you are speaking different dialects. To bridge the gap, you might concede this:

  > "I see that my mapping works for **extensional semantics** (how the machine evaluates truth), but it fails for **intensional contexts** (belief, modality, and empty names). Rice's Theorem explains the *epistemic difficulty* of identity, but Frege is describing a *semantic difference* that persists even after the difficulty is resolved. The 'Sense' isn't just the algorithm to find the object; it's the contribution the term makes to the truth conditions of a belief statement."

  Your aliasing bug was a classic **epistemic** failure of reference (you didn't know `a is b`). Frege's puzzle is a **semantic** feature of language (even if you know `a is b`, "a" and "b" play different roles in reasoning).

  The reason philosophers are still writing papers on this is that we still don't have a formal model of "mind" or "belief" that satisfies both the rigorous constraints of logic and the messy reality of human cognition. Code executes; humans understand. Frege is trying to formalize understanding, not execution.
