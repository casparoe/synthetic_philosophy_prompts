      *   **Normativity:** Philosophy cares about truth conditions and rationality. CS cares about execution and state.
      *   **Rice's Theorem vs. Cognitive Significance:** Rice's Theorem says we can't algorithmically decide if two programs compute the same function. Frege's puzzle is about why the *identity statement* is informative to a *rational agent*. Undecidability explains why it's *hard* to know, but not why the *meaning* is different.

