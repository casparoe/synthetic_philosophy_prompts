prompt: |-
  Me and my roommates share a jar for grocery money and some cash went missing. One roommate found a video that's pretty convincing proof our friend Jamie took it, but another roommate, who's been close with Jamie for like 15 years, wont even watch it. She just says "I know Jamie, there's no way he'd steal from us, so whatever that video shows, there's gotta be some other explanation, I don't even need to see it to know that." Part of me thinks that's an awful way to treat evidence, but if she genuinely does know Jamie that well, isn't she basically right that any "evidence" against him has to be misleading somehow? Isnt that sort of what knowing someone means? So is she actually reasoning fine, or is something wrong with it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Situation:**
      *   **The Conflict:** Cash is missing from a shared grocery jar.
      *   **The Evidence:** One roommate has a video that is "pretty convincing proof" that Jamie took it.
      *   **The Skeptic:** Another roommate (let's call her Sarah) refuses to watch the video.
      *   **Sarah's Reasoning:** She knows Jamie (15 years friendship). She believes he wouldn't steal. Therefore, *any* evidence suggesting he did must be misleading/misinterpreted. She doesn't need to see the evidence to know this.
      *   **The User's Dilemma:** Is Sarah's reasoning valid (based on deep knowledge of character) or flawed (ignoring evidence)?

  2.  **Deconstruct Sarah's Reasoning (Epistemology & Logic):**
      *   *Premise 1:* I know Jamie's character deeply (15 years).
      *   *Premise 2:* Jamie's character is such that he would not steal from friends.
      *   *Premise 3:* There is evidence (video) suggesting Jamie stole.
      *   *Conclusion:* The evidence must be flawed/misleading, so I don't need to examine it.
      *   *Logical Form:* This is a form of *prior probability* weighting. She is assigning a near-zero prior probability to the hypothesis "Jamie stole," so any likelihood ratio provided by the evidence isn't enough to shift her posterior belief.
      *   *The Problem:* This is *dogmatism* or *belief perseverance*. It ignores the possibility that people change, circumstances change, or her knowledge is incomplete. It also dismisses objective data in favor of subjective intuition.

  3.  **Evaluate "Knowing Someone":**
      *   Does knowing someone mean you know *everything* they are capable of? No.
      *   People are complex. Good people do bad things under pressure (debt, addiction, emergency, impulse).
      *   15 years is a long time, but it's not omniscience.
      *   Trust is good, but blind trust in the face of contrary evidence is risky.

  4.  **Evaluate the Evidence (The Video):**
      *   The user describes it as "pretty convincing proof."
      *   If the video is objective (CCTV, clear footage of hand taking cash), it carries significant weight.
      *   Refusing to engage with objective evidence undermines the group's ability to resolve the conflict.

  5.  **Identify the Cognitive Biases:**
      *   *Confirmation Bias:* Only accepting information that fits the existing belief (Jamie is good).
      *   *Motivated Reasoning:* Protecting the relationship/emotional comfort over truth.
      *   *The Halo Effect:* Assuming because Jamie is good in way A, he is good in way B.
      *   *Invincible Ignorance:* Refusing to look at counter-evidence.

  6.  **Assess the Social/Relational Dynamics:**
      *   Sarah is prioritizing her relationship with Jamie over the trust of the current roommates.
      *   This creates a rift in the roommate dynamic.
      *   It puts the accuser (video holder) in a position of being gaslit or dismissed.
      *   It protects Jamie from accountability if he *did* do it.

  7.  **Formulate the Argument:**
      *   *Acknowledge the intuition:* It makes sense to trust long-term friends. Character evidence *is* evidence.
      *   *Highlight the flaw:* Character evidence is probabilistic, not absolute. Physical evidence (video) is usually more definitive in specific instances.
      *   *Explain the risk:* People change. Circumstances change. "Not in character" doesn't mean "Impossible."
      *   *Address the epistemic duty:* In a shared living situation with shared finances, transparency is required. Refusing to look is a breach of roommate trust.
      *   *Conclusion:* Her reasoning is emotionally understandable but logically and practically flawed.

  8.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Empathetic but firm on logic. Don't attack Sarah, but analyze the reasoning.
      *   *Structure:*
          1.  Validate the feeling (trust is important).
          2.  Analyze the logic (Bayesian update vs. Dogmatism).
          3.  Discuss the nature of "knowing someone."
          4.  Discuss the impact on the group.
          5.  Suggest a path forward.

      *(Self-Correction during drafting)*: I need to make sure I don't definitively say Jamie *did* steal. The prompt says the video is "convincing proof," but I must remain neutral on the *fact* of the theft while analyzing the *reasoning* about the evidence. Focus on Sarah's refusal to look.

      *(Refining the "Knowing Someone" point)*: Knowing someone means knowing their *tendencies*, not their *capabilities*. A non-violent person can snap. A honest person can steal in desperation. Sarah is conflating tendency with impossibility.

      *(Refining the "Evidence" point)*: Evidence isn't just about guilt; it's about resolution. Even if the video has an innocent explanation, you have to *watch* it to find that explanation. Refusing to watch precludes the innocent explanation too.

  9.  **Final Polish:** Check for clarity, balance, and actionable advice. (Ensure I address the specific question: "Is she actually reasoning fine, or is something wrong with it?")

      *Verdict:* Something is wrong with it. It's a category error between *character testimony* and *empirical evidence*.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  This is a classic conflict between **character testimony** (what we believe based on who someone is) and **empirical evidence** (what we observe happening in a specific instance).

  While your roommate's loyalty is understandable, her reasoning is logically flawed and potentially damaging to your living situation. Here is a breakdown of why her logic doesn't hold up, even if her feelings do.

  ### 1. "Knowing Someone" vs. "Knowing Everything"
  Your roommate is operating under the assumption that knowing someone for 15 years grants her omniscience regarding their moral capabilities. It does not.
  *   **Tendencies vs. Absolutes:** Knowing Jamie well means you know his *tendencies*. It means he is *unlikely* to steal. It does not mean he is *incapable* of stealing. People are complex; good people do bad things when under specific pressures (debt, addiction, emergency, impulse) that their friends might not know about.
  *   **The "Not In Character" Fallacy:** Just because an action is "out of character" doesn't mean it didn't happen. It usually means something is wrong in that person's life that the character testimony doesn't account for. By refusing to look at the video, she is prioritizing her static image of Jamie over the reality of his current situation.

  ### 2. The Logic of Evidence (Bayesian Reasoning)
  In logic and probability, you should update your beliefs based on new evidence.
  *   **Her Prior Belief:** "Jamie is honest" (Very High Probability).
  *   **The New Evidence:** "Video shows Jamie taking money" (Strong Evidence).
  *   **Her Conclusion:** "The video must be wrong."

  This is only valid if her confidence in Jamie is **100% absolute**. If there is even a 0.1% chance Jamie could steal, then a "convincing video" should mathematically shift the probability enough to warrant an investigation.
  *   **The Flaw:** She is treating her belief in Jamie as a **faith-based axiom** rather than a **probability**. By saying "I don't even need to see it," she is making her belief unfalsifiable. If you cannot imagine any scenario where you would change your mind, you aren't reasoning; you're engaging in dogma.

  ### 3. The "Innocent Explanation" Paradox
  Her argument is that "there's gotta be some other explanation." Here is the irony: **The only way to find that innocent explanation is to watch the video.**
  *   If the video shows Jamie putting money *back* into the jar, or borrowing it with intent to repay, or if it's actually a different person who looks like him, watching the video proves her right.
  *   By refusing to watch, she isn't defending Jamie with facts; she is defending him with blindness. She is essentially saying, "I prefer my story of Jamie over the truth of what happened."

  ### 4. The Social Contract of Roommates
  This is the most practical point. You and your roommates have a shared financial agreement.
  *   **Duty to the Group:** As a roommate, she has a responsibility to the *household* to resolve missing funds. By siding blindly with an outsider (Jamie) against her housemates, she is violating the trust of the people she lives with.
  *   **Enabling:** If Jamie *did* take the money, her refusal to acknowledge the evidence removes his accountability. It signals to him that he can rely on her blind loyalty to shield him from consequences.

  ### 5. Cognitive Biases at Play
  Your roommate is falling prey to a few specific psychological traps:
  *   **Confirmation Bias:** She is rejecting information that contradicts her existing belief.
  *   **The Halo Effect:** She assumes that because Jamie is a good friend in many ways, he is incapable of doing a bad thing in this specific way.
  *   **Motivated Reasoning:** She is reasoning backward from the conclusion she *wants* to be true (Jamie is good) rather than the conclusion the evidence points to.

  ### Conclusion
  **She is not reasoning fine.** She is prioritizing emotional comfort and loyalty over truth and accountability.

  While it is noble to trust friends, **trust is not a substitute for verification in shared finances.** The respectful thing to do—if she truly believes there is an innocent explanation—is to watch the video to *find* that explanation.

  **How to handle it:**
  You might say to her: *"I respect that you know Jamie well. But we all love him, and none of us want to believe he stole. That's exactly why we need to watch the video. If there is an innocent explanation, the video will prove it and clear his name. But refusing to look at it doesn't clear him; it just leaves us with missing money and broken trust in this house."*

  This frames watching the video not as an attack on Jamie, but as the only path to potentially exonerating him. If she still refuses, you have your answer about her priorities regarding the roommate agreement.
