answer: |-
  This is a classic crux in Aquinas scholarship, so you are definitely not alone in finding it tricky. Your professor's hint about the *Sentences* is the key to unlocking the second part of your problem, but to get there, we first need to diagnose exactly what Aquinas is doing in this specific passage from *De Regimine Principum*.

  Here is a breakdown of the two issues you raised, which should help you structure your response paper.

  ### 1. Principle vs. Prudence: What is the real objection?

  You asked whether Aquinas is making a categorical claim (private citizens *cannot* do this) or a prudential claim (private citizens *should not* do this because it backfires).

  The short answer is: **He is making a principled claim, but he uses prudential reasoning to justify the principle.**

  In Thomistic political philosophy, "prudence" isn't just guesswork about consequences; it is the virtue of right reason applied to action. However, if you look closely at the structure of the paragraph, you can see a hierarchy of arguments:

  1.  **The Theological Norm:** He starts with 1 Peter ("be subject... to the froward"). This establishes the default moral obligation: submission to authority is a divine command.
  2.  **The Political Reality (Prudence):** He then explains *why* this command aligns with political stability. He lists the consequences: dangerous precedents, the death of good rulers mistaken for bad ones, and the likelihood of worse tyranny arising from vengeance.
  3.  **The Juridical Conclusion:** He ends with the decisive line: *"It belongs not, therefore, to private presumption, but to public authority, to proceed against the wickedness of rulers."*

  This final sentence is the key to your first question. If his argument were *purely* prudential (i.e., "it usually goes badly"), he would have to allow for exceptions where it *might* go well. But by framing it as a matter of **jurisdiction** ("It belongs not to private presumption... but to public authority"), he is making a structural point about the nature of political power.

  For Aquinas, the ruler holds a "public person" status. To judge and punish the ruler is an act of jurisdiction. A private individual lacks that jurisdiction. Therefore, even if a private citizen *could* successfully kill a tyrant without negative consequences, they still lack the **standing** to do so. It is akin to a random citizen deciding to execute a criminal rather than leaving it to the judge. The "prudential" arguments (it causes chaos) are the *reasons* why God's law and Natural Law assign that jurisdiction to public authority rather than private individuals.

  **Takeaway for your paper:** Argue that the prudential arguments support the principled conclusion. The chaos that ensues from tyrannicide proves that it violates the natural order of authority.

  ### 2. The *Sentences* and the Problem of Consistency

  This is where your professor's hint is vital. Aquinas is generally consistent, but he is making a distinction between two different kinds of tyrants. This distinction is standard in medieval political thought:

  1.  **Tyrant *ex defectu tituli* (By defect of title):** A usurper. Someone who seized power illegitimately and has no rightful claim to rule.
  2.  **Tyrant *ex parte exercitii* (By exercise of power):** A legitimate ruler (king, prince) who has a rightful claim to the office but rules unjustly.

  **In the *Commentary on the Sentences*:**
  Aquinas is discussing the **usurper** (*ex defectu tituli*). Since the usurper has no legitimate authority, they are essentially an aggressor or a bandit. Aquinas argues that if there is no superior authority to appeal to (like an Emperor or Pope), a private citizen *may* kill the usurper to free the community. In this case, it isn't "resisting authority" because the usurper *has* no authority.

  **In *De Regimine Principum*:**
  Aquinas is discussing the **legitimate ruler who governs badly** (*ex parte exercitii*). This ruler *does* hold public authority, even if they are misusing it. This is why he leans so heavily on 1 Peter and the danger of undermining the *office* of kingship. If private citizens can kill a legitimate ruler, the institution of kingship itself becomes unstable.

  **How to resolve the contradiction:**
  There is no contradiction if you apply the distinction.
  *   **Case A (Usurper):** No public authority exists. Private action is licit (per *Sentences*).
  *   **Case B (Legitimate Tyrant):** Public authority exists. Private action is illicit (per *De Regimine*).

  **But wait, can a legitimate tyrant ever be removed?**
  Yes, and this is crucial for your paper. Aquinas does not say a legitimate tyrant must be endured forever. In the very next chapter (I.7), he argues that removal is possible, but it must be done by **public authority**.
  *   If the king is elected by the people, the people (acting collectively as a public body, not as private assassins) can depose him.
  *   If the king is appointed by a superior (like an Emperor or the Pope), that superior must depose him.

  This reinforces the "Principle vs. Prudence" point above. The problem isn't the *removal* of the tyrant; the problem is the *private* nature of the violence.

  ### Synthesizing for Your Response Paper

  Here is a potential thesis structure you could use to tackle this assignment:

  1.  **Introduction:** Acknowledge the tension. Aquinas seems to condemn tyrannicide here, but permits it elsewhere.
  2.  **The Argument of *De Regimine*:** Explain that Aquinas's primary objection in this passage is **juridical**, not just consequentialist. Private individuals lack the *standing* to punish a public official. The prudential arguments (chaos, vengeance, worse tyranny) explain *why* the natural order reserves this right for public authority.
  3.  **The Distinction (The *Sentences*):** Introduce the Usurper vs. Legitimate Ruler distinction. Show that Aquinas is consistent: killing a usurper is self-defense against an aggressor; killing a legitimate ruler is sedition against the order of the common good.
  4.  **The Thomistic Solution:** Highlight that Aquinas offers a "middle way." He rejects private assassination, but he does not demand absolute passive obedience. He allows for **public deposition**. This preserves order (no private violence) while allowing for justice (removal of tyranny).
  5.  **Conclusion:** Aquinas is trying to balance the need for resistance to evil with the need for political stability. He prioritizes the preservation of the *regime* (the public order) over the immediate removal of a bad actor, unless that removal can be done without shattering the principle of authority itself.

  ### One Final Tip for the "Augustine to Machiavelli" Context
  Since this is a seminar tracing that specific timeline, you might get extra points for noting where Aquinas sits.
  *   **Augustine** is very skeptical of earthly politics (City of God vs. City of Man).
  *   **Aquinas** is more optimistic about the state (it's natural, not just a result of sin), so he needs a theory of how to make it work *well*, not just how to endure it.
  *   **Machiavelli** (coming later in your semester) will essentially look at Aquinas's worries about "fear of losing power" and say, "Exactly. That's how a Prince maintains control."

  Aquinas is trying to moralize power; Machiavelli will analyze how power actually behaves. In this passage, Aquinas is admitting that private violence destabilizes power, so he tries to channel resistance into legal/public forms.

  Good luck with the paper! If you keep the "Private Presumption vs. Public Authority" distinction front and center, you'll have a solid argument.
