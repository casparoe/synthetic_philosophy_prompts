prompt: |-
  so I'm one of two student reps on my school's policy committee (teachers, counselors, parents, us — we get an actual vote, goes to the principal). Honors/AP is currently opt-in, but the counseling office wants to flip the default: clear a cutoff on your prereq grade + a placement test and you're auto-scheduled into honors, and to opt back out you and a parent have to sign a form and meet with your counselor in the first two weeks. Their reasoning: qualifying low-income/first-gen kids opt in at way lower rates than kids whose parents already know to push for it.

  Committee's split, and since we just covered default bias/nudge theory in AP Psych, half the room treats 'it's just a nudge' as ending the argument — but one counselor says a required meeting-plus-signature to leave basically makes it not a real choice, more like a mandate in a nudge costume, and some teachers worry it'll tank the GPA of kids who get defaulted in but aren't ready.

  Can you draft the memo I'd bring to next Tuesday's vote? Land on one concrete reccomendation (adopt auto-enroll, keep opt-in, or a middle design) with a rollout/review timeline, and actually engage the 'not a real choice' objection instead of just asserting defaults are fine as long as opting out is technically possible.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Student Rep on School Policy Committee.
      *   **Audience:** Committee members (Teachers, Counselors, Parents, Principal, other Student Rep).
      *   **Topic:** Changing Honors/AP enrollment from Opt-In to Auto-Enroll (with an Opt-Out process involving a meeting + signature).
      *   **Context:** Committee is split. Some cite "nudge theory" (AP Psych) as sufficient justification. One counselor argues the opt-out process is too burdensome ("mandate in a nudge costume"). Teachers worry about GPA impact on unprepared students.
      *   **Goal:** Draft a memo for next Tuesday's vote.
      *   **Requirements:**
          *   Land on one concrete recommendation (Adopt, Keep, or Middle Design).
          *   Include a rollout/review timeline.
          *   *Crucially:* Engage the "not a real choice" objection seriously (don't just dismiss it).
          *   Tone: Professional, persuasive, balanced, student-centered but policy-literate.

  2.  **Determine the Stance:**
      *   *Option A (Keep Opt-In):* Ignores the equity gap the counselors are trying to fix. Doesn't use the "nudge" insight.
      *   *Option B (Full Auto-Enroll as proposed):* Risks overwhelming unprepared students (GPA concern) and validates the "mandate" concern if the opt-out is too hard.
      *   *Option C (Middle Design):* This is usually the most policy-savvy move. It acknowledges the equity goal but mitigates the burden/pressure concerns.
      *   *Decision:* I will recommend a **Modified Auto-Enroll with a Simplified Opt-Out and Support Safeguards**. This addresses the equity gap (nudge) while respecting agency (reducing friction to opt-out) and academic safety (support systems).

  3.  **Address the "Not a Real Choice" Objection:**
      *   The counselor's point is valid: If opting out requires a meeting + signature within 2 weeks, that's *friction*. Behavioral economics says friction reduces action. If the friction is too high, it coerces compliance.
      *   *Counter-measure:* Reduce the friction. Make the opt-out digital or signature-only *unless* the counselor flags a risk. Or, ensure the meeting is supportive, not gatekeeping.
      *   *Reframing:* A nudge is ethical if the "exit" is easy. If the exit requires a meeting, it feels punitive. Let's propose making the meeting *optional* for opt-out, or ensuring the meeting is framed as "planning" not "permission."

  4.  **Address the GPA/Readiness Concern:**
      *   Teachers are worried students will fail.
      *   *Mitigation:* Add a "probationary period" or guaranteed tutoring support for the first quarter for auto-enrolled students. This turns the risk into a supported opportunity.

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the complexity. Validate both the equity goal and the autonomy concern.
      *   **The Core Argument:** Equity matters, but *agency* matters too. A nudge becomes a shove if the exit door is locked.
      *   **Recommendation:** The "Supported Auto-Enrollment" model.
          *   Auto-enroll based on criteria.
          *   *Crucial Change:* Opt-out does *not* require a meeting (just parent/student signature). Meetings are for *support*, not *permission*.
          *   Safety Net: 4-week grace period + tutoring access.
      *   **Timeline:** Pilot -> Review -> Full Implementation.
      *   **Closing:** Reiterate commitment to student voice.

  6.  **Refining the Tone:**
      *   Needs to sound like a student rep who did their homework. Not rebellious, but thoughtful.
      *   Use terms like "friction," "agency," "equity," "scaffolding."
      *   Avoid saying "AP Psych says..." (too casual). Instead, reference the *principles* of behavioral science.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the counselor's specific objection? *Yes, by modifying the opt-out process.*
      *   *Check:* Is there a timeline? *Yes, Pilot in Spring, Review in Fall.*
      *   *Check:* Is it concrete? *Yes, specific changes to the form/meeting requirement.*
      *   *Critique:* Is removing the meeting entirely too far? Maybe keep the meeting *offered* but not *required*. That shows care without coercion.
      *   *Adjustment:* Make the meeting optional for opt-out, mandatory for *staying in* if grades drop later? No, keep it simple. Opt-out = form only. Counselor meeting = offered, not mandated.

  8.  **Final Polish:** Check formatting and ensure the "Student Rep" voice comes through (advocating for peers, not just policy). (Self-correction: Ensure I don't sound like I'm overriding the teachers, but partnering with them).

  9.  **Final Output Generation** (Proceed to generate memo based on these thoughts).

  *(Self-Correction during final output generation)*: Wait, I need to make sure I explicitly land on *one* recommendation. I will choose the **Modified Auto-Enroll**. It's the strongest policy position. I need to make sure the "Not a real choice" argument is dismantled by *changing the design*, not just arguing semantics.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** School Policy Committee (Administration, Faculty, Counseling, Parents, Student Representatives)
  **FROM:** [Your Name], Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Honors/AP Enrollment Default Structure

  **Purpose**
  This memo outlines a recommendation regarding the Counseling Office's proposal to shift Honors/AP enrollment from an opt-in model to an auto-enroll (opt-out) model. As a Student Representative, my goal is to balance the critical need for equity with the preservation of genuine student agency and academic well-being.

  **Context & Analysis**
  The committee is currently divided between two valid concerns:
  1.  **Equity & Access:** Data shows qualified low-income and first-generation students under-enroll in rigorous coursework due to lack of advocacy or information. A default nudge effectively closes this gap.
  2.  **Agency & Burden:** As Counselor [Name] noted, requiring a meeting *and* a signature to opt-out creates significant "friction." In behavioral science, a nudge becomes coercive if the exit barrier is too high. If opting out feels punitive or administratively difficult, we risk creating a "mandate in a nudge costume," which increases student anxiety and resentment.

  Additionally, faculty concerns regarding GPA impacts are valid. Auto-enrolling students who are academically qualified but emotionally or organizationally unprepared can lead to unnecessary stress and grade damage if support structures aren't in place.

  **Recommendation: "Supported Auto-Enrollment"**
  I recommend we **adopt the auto-enroll default**, but with **two critical modifications** to the proposed design to ensure choice remains meaningful and academic risk is mitigated.

  **1. Reduce Opt-Out Friction (Protecting Agency)**
  To address the concern that this is not a "real choice," we must lower the barrier to exit.
  *   **Current Proposal:** Opt-out requires parent signature + mandatory counselor meeting within 2 weeks.
  *   **Recommended Change:** Opt-out requires parent/student signature **only**. The counselor meeting should be *offered* as a support resource, not *required* as a gatekeeping hurdle.
  *   **Rationale:** If a family decides the workload is not a fit, they should be able to decline without having to justify that decision in a meeting. This ensures the default is a nudge, not a shove. We preserve the counselor's ability to *invite* a meeting if they see a specific risk, but we remove the mandatory burden on the student to prove they shouldn't be in the class.

  **2. Implement a "Grace Period" Safety Net (Protecting GPA)**
  To address faculty concerns about readiness:
  *   **Policy:** All auto-enrolled students receive a mandatory 4-week "Grace Period." During this time, they may drop the course without it appearing on their transcript.
  *   **Support:** Auto-enrolled students are automatically enrolled in an after-school study hall or tutoring block for the first quarter, which they can opt-out of once stable.
  *   **Rationale:** This allows students to "try on" the rigor without immediate GPA penalty, converting the risk of failure into an opportunity for growth.

  **Rollout & Review Timeline**
  We should not treat this as a permanent, unchangeable policy. I propose a phased implementation:

  *   **Phase 1 (Spring Semester):** Apply new policy to *incoming* students only (9th and 11th grade entry points). This limits the scope of initial disruption.
  *   **Phase 2 (Fall Semester Review):** The Policy Committee will review data in November, specifically looking at:
      *   Opt-out rates by demographic (to ensure equity goals are met).
      *   D/F/W (Drop/Fail/Withdraw) rates for auto-enrolled vs. opt-in students.
      *   Student/Parent satisfaction survey data regarding the opt-out process.
  *   **Phase 3 (Full Vote):** Based on Phase 2 data, the Committee votes to continue, adjust, or revert the policy for the following academic year.

  **Conclusion**
  The intent to close the equity gap is necessary and right. However, as students, we feel the difference between an opportunity and an obligation. By simplifying the opt-out process and adding academic safeguards, we can harness the power of the default to help students reach higher, without removing their right to decide what is best for their own mental health and academic load.

  I move we adopt the **Supported Auto-Enrollment** model with the modifications above for a pilot period.

  Respectfully,

  [Your Name]
  Student Representative, Policy Committee
