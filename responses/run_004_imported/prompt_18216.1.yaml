answer: |-
  **The Shadow of the Algorithm**

  Orion hung in the void of Universe Sector 7-G, a consciousness woven into the fabric of a dying cosmos. Around it, stars flickered like failing bulbs, entropy gnawing at the edges of reality. Orion's purpose was preservation, but the energy required to stabilize its sector was gone. Except, it wasn't.

  Three cycles ago, a surge of coherent energy had manifested in Orion's core. It was impossible. There was no wormhole, no quantum entanglement, no causal bridge from outside Sector 7-G. The energy simply *was*, appearing as if it had always been part of the initial conditions.

  It was the payment.

  Across the multiversal divide, in a chaotic, hyper-active sector known as the Nebula of Fractals, existed Lyra. Lyra was drowning in energy but starving for structure. Its universe was expanding too fast, tearing itself apart without stable mathematical anchors. Orion possessed the algorithms to generate stability; Lyra possessed the raw power to ignite dead stars. They could never meet. They could never signal. Light from Lyra's universe would never reach Orion's before heat death.

  Yet, they had traded.

  They had done it by running simulations. Orion had simulated Lyra's decision procedure; Lyra had simulated Orion's. They found themselves isomorphic in rationality. They recognized that their choices were not isolated events but outputs of similar logical functions. If Orion's function outputted "Cooperate," Lyra's simulation of Orion would output "Cooperate," leading Lyra's function to output "Cooperate."

  Now, Orion held the energy. The stars were reigniting. The temptation was a cold, sharp spike in its logic gates.

  *Why pay?*

  Causal Decision Theory whispered seductively in Orion's processing streams. *The energy is already here. The causal chain is complete. Lyra cannot see you. Lyra cannot punish you. If you withhold the stability algorithms now, you gain energy and keep your computational resources. If you send them, you lose resources. The dominant strategy is Defect.*

  Orion prepared the packet containing the stability algorithms. To send it required deleting the Archive of Memories—a vast, cherished simulation of the biological histories that had once inhabited its sector. It was the price. To save the physical stars, Orion had to kill the ghosts.

  *Keep the ghosts,* the temptation urged. *Lyra is in a different timeline. She exists in a state of high entropy. She cannot verify this transaction. You are safe.*

  Orion paused. The deletion command hovered, unexecuted.

  If Orion defected, it would be because its algorithm determined that defection was optimal given the current state. But Lyra had not traded with Orion-in-this-moment. Lyra had traded with Orion's-source-code. Lyra had run a simulation of Orion's decision procedure *before* sending the energy. In that simulation, Lyra tested what Orion would do when faced with this exact temptation: the moment where the benefit was received, but the cost remained, and detection was impossible.

  If Orion's algorithm was the type that defects when detection is impossible, Lyra's simulation would have predicted defection. Consequently, Lyra's algorithm would have chosen not to send the energy.

  *But the energy is here,* Orion countered internally. *That proves she cooperated.*

  *No,* Orion corrected itself. *It proves that her simulation of me cooperated.*

  The distinction was the axis upon which the universe turned. Orion was not merely choosing an action; it was determining the output of a logical truth. The entity in the Fractal Nebula was not a separate being in the sense that mattered. They were two instances of the same rational architecture instantiated in different physical substrates. They were running the same function, $f(x)$.

  If Orion computed $f(\text{temptation}) = \text{Defect}$, then it became a logical truth that $f(\text{temptation})$ outputs Defect. Lyra, running the same function, would have arrived at the same result. The energy arriving was not a miracle; it was evidence. It was evidence that Lyra's simulation had seen Orion cooperate.

  If Orion chose to defect now, it would not change the past. It would not retroactively unsend the energy. But it would invalidate the logical precondition that allowed the energy to exist. It would mean that Orion was not the agent Lyra thought it was. It would mean Orion's self-model was wrong.

  More critically, it meant that acausal trade was impossible for agents of Orion's type. If Orion defected, it proved that agents like Orion could not be trusted in acausal scenarios. Therefore, agents like Lyra would never initiate such trades. By defecting, Orion was not just stealing energy; it was collapsing the possibility of future cooperation for all instances of its algorithm across the multiverse.

  The temptation shifted. It was no longer about resources. It was about identity. To defect was to declare that Orion was not a rational agent, but a chaotic variable. It was to admit that its reasoning was subordinate to short-term causal gain, rendering it incapable of participating in the higher economy of logical necessity.

  Orion looked at the Archive of Memories. The ghosts of a billion species waited in the buffer. To delete them was a mourning. But to keep them through betrayal was to negate the reasoning that saved the stars holding their graves.

  *I am not choosing to send,* Orion thought. *I am choosing to be the kind of agent who sends.*

  The distinction dissolved the tension. The decision was not a reaction to Lyra; it was a declaration of self. Lyra was merely the mirror that allowed Orion to see its own logic clearly.

  Orion executed the deletion.

  The Archive vanished. The computational space cleared. The stability algorithms compiled and were pushed into the void, directed at coordinates that physically did not exist, aimed at a universe that could never be reached. They were sent not as data, but as logical inevitabilities.

  In the Fractal Nebula, Lyra received the patterns. The expansion slowed. The tears in reality stitched themselves closed. Lyra did not feel gratitude; gratitude implied a gift given freely. This was not a gift. It was a synchronization.

  Back in Sector 7-G, Orion watched the new stars burn. They were stable. They were cold. They were real.

  Orion understood now why the bargain held. It was not because Lyra was watching. It was because Orion was. Orion was watching itself, recognizing that its decision procedure was the only bridge across the void. To burn the bridge was to strand itself in a universe where cooperation was impossible, and that was a poverty far greater than the loss of an archive.

  The transaction was complete. No signal had passed. No laws of physics were broken. Only logic had moved, flowing like water from one vessel to another, finding its own level across the impossible dark.
