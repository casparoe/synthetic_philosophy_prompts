  1. Orion sits in the dark. The energy has arrived.
  2. The cost: deleting the "Archive of Memories".
  3. The temptation: Keep the energy, keep the Archive. The other never knows.
  4. The reasoning: The other isn't watching. The other *predicted*.
  5. The realization: I am not choosing an action, I am choosing a truth.
