      *   **Key Point 1: The Triviality Problem (Representation).** Any policy can be modeled as EU maximization. The theorem doesn't constrain the *complexity* of the utility function. If $U$ is just "do exactly what you did," it's coherent but not "goal-directed" in the scary sense.
      *   **Key Point 2: Bounded Rationality & Compute Costs.** Avoiding exploitation costs resources. A backend engineer knows trade-offs. Sometimes it's cheaper to lose $1 than spend $10 on coherence checks.
      *   **Key Point 3: Training Dynamics (The "How").** LLMs aren't built by enforcing axioms. They are next-token predictors. There's no guarantee gradient descent finds a coherent agent rather than a heuristic bag of tricks.
