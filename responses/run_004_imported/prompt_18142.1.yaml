          2.  Sovereign Debt Growth (since 2008).
      *   **Key Texts:** "Of the Balance of Trade," "Of the Jealousy of Trade," "Of Public Credit."
      *   **Specific Concepts to Include:** Price-specie-flow mechanism, rejection of mercantilist jealousy, anxieties about public credit sustainability.
      *   **Critical Nuance:** Highlight where Hume's 18th-century premises (specie money, no central banks, etc.) strain against modern reality (fiat currency, electronic money, floating rates). This friction is crucial for the scene's drama.
      *   **Bonus:** 2-3 sentences in Hume's idiom/voice rendering a verdict.

  2.  **Deconstruct Hume's Economic Thought (Mental Sandbox):**
      *   *Trade Deficits/Tariffs:* Hume hated mercantilism. He argued that money (gold/silver) is just oil in the machine, not the machine itself. If a country accumulates too much money, prices rise (inflation), making exports expensive and imports cheap. Money flows out naturally. This is the *price-specie-flow mechanism*. Therefore, worrying about a trade deficit is foolish; the market corrects it. Tariffs are usually counterproductive and stem from "jealousy of trade" (thinking a neighbor's gain is your loss). He believed in the mutual benefit of trade.
      *   *Public Debt:* Hume was pessimistic here. In "Of Public Credit," he argues that accumulating debt leads to higher taxes, which crushes industry, or leads to default/confiscation, which destroys trust. He famously said "either the nation must destroy public credit, or public credit will destroy the nation." He worried about the shift of power from the productive class to the idle bondholders (stockjobbers).
      *   *Modern Friction:* Hume thought in terms of *specie* (physical gold/silver). Modern money is fiat/credit. Central banks manage liquidity, not just passive reservoirs. Exchange rates float, adjusting instantly rather than through price levels over years. Sovereign debt is denominated in currency the state can theoretically print (though with consequences), unlike Hume's hard currency constraint.

  3.  **Drafting the Response - Section by Section:**

