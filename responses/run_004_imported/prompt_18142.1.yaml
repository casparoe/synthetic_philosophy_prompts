          *   *Mechanism:* Price-Specie-Flow. More money -> higher prices -> less competitive exports -> money flows out.
          *   *Mercantilism:* Rejection of "Jealousy of Trade." Neighbors' riches are good for you (markets, emulation).
          *   *Modern Friction:* Fiat money doesn't flow physically. Exchange rates adjust faster than prices. Central banks sterilize flows. The "deficit" isn't a loss of gold, it's an accumulation of claims (Treasuries).
      *   **Debate 2: Sovereign Debt:**
          *   *Hume's Core Argument:* "Of Public Credit." Debt leads to taxation or default.
          *   *Social Consequence:* Shifts wealth from industrious to idle. Weakens the state in war.
          *   *Modern Friction:* Modern Monetary Theory (sort of). We don't pay debt in gold; we roll it over. Inflation can erode real value. The "idle bondholder" class is now global pension funds, not just London stockjobbers.
