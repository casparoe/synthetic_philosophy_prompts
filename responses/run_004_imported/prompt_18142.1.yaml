answer: |-
  Here is a reconstruction of the arguments, the frictions, and the voice you need for your scene.

  ### I. The Tariff & Trade Deficit Debate
  **Textual Grounding:** *"Of the Balance of Trade"* and *"Of the Jealousy of Trade"*

  **The Humean Argument:**
  Your scholar would begin by dismissing the premise of the question as a category error rooted in mercantilist superstition. For Hume, money (gold and silver) is not wealth itself, but merely "the oil which renders the motion of the wheels more smooth and easy." It is a commodity subject to supply and demand.

  Her explanation would center on the **price-specie-flow mechanism**. She would argue that Hume demonstrated mathematically that a bilateral trade deficit is self-correcting and requires no state intervention. If Nation A runs a deficit with Nation B, gold flows out of A into B. Consequently, the money supply in A shrinks, causing domestic prices and wages to fall. Simultaneously, the money supply in B expands, causing inflation there. Soon, Nation A's goods become cheaper and Nation B's become dearer. The flow of gold reverses naturally. Therefore, tariffs designed to stop this flow are not only unnecessary but harmful; they disrupt the natural equilibrium of industry.

  Furthermore, she would cite *"Of the Jealousy of Trade"* to attack the moral psychology behind tariffs. Hume argues that the prosperity of a neighbor is not a threat but a benefit. Rich neighbors create larger markets for your exports and spur emulation in industry. To fear a neighbor's economic growth is as irrational as a farmer fearing his neighbor's harvest will make his own grain grow less.

  **The Modern Friction (The Dramatic Tension):**
  This is where your scholar would pause, perhaps take a sip of water, and admit the anachronism. Hume's mechanism relies on money being **specie** (physical coin) that physically moves across borders.
  1.  **Fiat vs. Specie:** Today, money is fiat and digital. A trade deficit doesn't drain gold from the US to China; it results in Chinese entities holding US dollars or Treasury bonds. The "outflow" is an accumulation of claims, not a depletion of hard assets.
  2.  **Exchange Rates:** Hume assumed fixed metallic parity. Today, floating exchange rates adjust instantly to trade imbalances, often before domestic price levels (inflation/deflation) have time to shift. The adjustment happens in the currency market, not the wage market.
  3.  **Capital Controls:** Hume assumed money would flow freely to seek its level. Modern central banks "sterilize" inflows and outflows to manage domestic inflation, breaking the automatic link between trade balances and money supply.

  *For the scene:* She might bristle that while the *mechanism* has changed, the *folly* remains. Policymakers still fear the "loss" of money as if it were gold in a vault, ignoring that the deficit is often a reflection of domestic savings and investment rates, not a national wound.

  ### II. The Sovereign Debt Debate
  **Textual Grounding:** *"Of Public Credit"*

  **The Humean Argument:**
  Here, your scholar would drop the dry tone and become grim. Hume is far less optimistic about debt than he is about trade. In *"Of Public Credit,"* he argues that the modern innovation of funding long-term debt through national banks is a dangerous expedient.

  His argument rests on three pillars:
  1.  **Taxation and Industry:** To service debt, the state must tax. High taxes crush the "industrious" poor and the manufacturing class, driving up the cost of labor and making the nation uncompetitive (linking back to his trade theory).
  2.  **The Idle Bondholders:** Debt transfers wealth from the productive (taxpayers) to the idle (those who live off interest coupons). Hume despised the "stockjobber" class who held public funds but contributed nothing to the real economy.
  3.  **The Endgame:** Hume posits that a nation with unchecked debt faces only two outcomes: **voluntary bankruptcy** (default) or **involuntary bankruptcy** (confiscation of assets via inflation or decree). Both destroy public trust. He famously warns that "either the nation must destroy public credit, or public credit will destroy the nation."

  **The Modern Friction (The Dramatic Tension):**
  The scholar would have to concede that Hume's apocalypse has not arrived, and explain why his premises are straining.
  1.  **Debt Denomination:** Hume assumed debt was a fixed claim on real resources (silver). Modern sovereign debt is denominated in the state's own fiat currency. A state can theoretically print money to service debt (risking inflation, but avoiding technical default).
  2.  **Global Demand for Safe Assets:** Hume could not foresee a global financial system where sovereign debt (like US Treasuries) is treated as "risk-free" collateral essential for the plumbing of global finance. The world *wants* to hold the debt, keeping interest rates low despite high issuance.
  3.  **Growth vs. Austerity:** Hume assumed debt service was a dead weight. Modern Keynesians argue that in a liquidity trap (like 2008), debt-funded spending can stimulate growth that outpaces the interest cost.

  *For the scene:* The friction here is moral. Hume's worry wasn't just mathematical; it was about the *corruption of the body politic*. Your scholar might argue that while the math of debt has changed, the sociological rot Hume predicted—the dominance of the financial sector over the productive sector—is exactly what we are seeing.

  ### III. The "Humean Idiom" (Bonus)
  *Here is a verdict on the trade debate, rendered in a style mimicking Hume's periodic sentences, empirical detachment, and moral weight, suitable for your character to read aloud or recite:*

  > "It is a vanity peculiar to the magistrate to imagine he can arrest the tides of commerce by the erection of tariff-walls, as if money were not a fluid that finds its own level through the porous earth of nations. To envy the riches of a neighbour is to wish for the withering of the very branch upon which one's own trade must blossom; for where there is no industry to emulate, there can be no market to supply. Let the gold flow where it will, for it is but the counter of the game, and no man grows fat by hoarding the chips while the table is overturned."

  ### Notes for the Character's Voice
  To make your scholar authentic:
  *   **Avoid "Free Market" Buzzwords:** She shouldn't sound like a libertarian pundit. Hume wasn't an ideologue; he was an empiricist. She should frame his arguments as observations of human nature and historical cycles, not moral absolutes.
  *   **The "Cantankerous" Edge:** She should be annoyed by the interviewer's framing. If they ask about "protecting jobs," she should correct them to "protecting inefficiency." If they ask about "national debt," she should correct them to "mortgaging the future industry of the poor to pay the present idleness of the rich."
  *   **The Limit of Knowledge:** The most compelling moment in the scene will be when she admits Hume *cannot* answer the modern question fully. She should say something like: "Hume wrote for a world of gold coins and sailing ships. We live in a world of digital credit and instantaneous capital flight. He would be as bewildered as we are, though he would likely diagnose our anxiety as the same old greed in a new mask."
