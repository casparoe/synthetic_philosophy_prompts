prompt: |-
  I sit on the ethics subcommittee that sets our research biobank's policy on returning genetic findings to participants. We currently disclose a finding only if it is well-validated and medically actionable; one member wants to extend disclosure to well-validated findings for serious, untreatable conditions -- Huntington's disease is the clearest case, since the variant is highly predictive and no treatment yet delays onset or progression -- arguing that since a participant can always decline to read what we send, offering the information can never leave a rational participant worse off in expectation than withholding it. Others worry this reasoning proves too much and would commit us to disclosing virtually anything we ever learn about anyone. Draft the memo I will circulate before our next meeting: it should recommend a specific disclosure policy for well-validated, non-actionable findings -- including what advance choice, if any, participants get, and what happens by default if they haven't chosen -- and it should directly assess whether the "they can just ignore it" argument actually supports the conclusion its proponents draw from it, rather than simply accepting or dismissing it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of an ethics subcommittee for a research biobank.
      *   **Task:** Draft a memo to circulate before the next meeting.
      *   **Topic:** Policy on returning genetic findings to participants.
      *   **Current Policy:** Disclose only if well-validated and medically actionable.
      *   **Proposed Change:** Extend disclosure to well-validated findings for serious, untreatable conditions (e.g., Huntington's disease).
      *   **Argument for Change:** "Right not to know" implies participants can decline to read; therefore, offering information never leaves a rational participant worse off in expectation than withholding it (the "they can just ignore it" argument).
      *   **Counter-argument:** This reasoning proves too much (slippery slope to disclosing everything).
      *   **Requirements:**
          *   Recommend a specific disclosure policy (including advance choice and default settings).
          *   Directly assess the "they can just ignore it" argument (don't just accept or dismiss it).
          *   Tone: Professional, ethical, analytical, suitable for an ethics committee.

  2.  **Deconstruct the Ethical Issue:**
      *   **Core Tension:** Autonomy (right to know) vs. Non-maleficence (do no harm).
      *   **The "Ignore It" Argument:** This relies on the concept of *option value*. If I have the option to know or not know, I am strictly better off (or at least not worse off) than having the option withheld.
      *   **Critique of the Argument:**
          *   *Psychological Reality:* Once an envelope is opened or a portal notified, "ignoring" is psychologically difficult. The mere knowledge that the information *exists* and is *available* can cause anxiety.
          *   *Accidental Disclosure:* Systems fail. Emails get opened, letters get read by family members.
          *   *Duty of Care:* The biobank has a relationship with the participant. Offering a test for an untreatable fatal condition without counseling might be negligent.
          *   *Resource Allocation:* Counseling resources are finite. Diverting them to untreatable conditions might harm those needing actionable info.
          *   *The "Proves Too Much" point:* If we offer *everything*, we overwhelm participants and dilute the significance of serious findings.
      *   **Policy Recommendation:** Needs a balanced approach. Usually, this involves a tiered consent model or a specific opt-in for non-actionable serious conditions. Default should generally be *non-disclosure* for non-actionable findings to protect participants, but with a clear pathway to opt-in.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose of the memo (addressing the proposal to expand return of results). Acknowledge the current policy and the proposed change.
      *   **Analysis of the "Ignore It" Argument:** This is the critical intellectual heavy lifting.
          *   *Valid Point:* Respects autonomy.
          *   *Flaw:* Assumes perfect rationality and control. Information has "unringable bell" properties. The *offer* itself signals risk.
          *   *Conclusion on Argument:* It supports *offering the choice*, but not *mandatory offering* or *passive disclosure*. It supports an opt-in model, not an opt-out or automatic push.
      *   **Policy Recommendation:**
          *   *Category:* Well-validated, serious, non-actionable (HVSA - High Validity, Serious, Actionable is current; HVSN - High Validity, Serious, Non-actionable is the new category).
          *   *Advance Choice:* Participants must explicitly opt-in during consent or via a dynamic consent portal.
          *   *Default:* Non-disclosure (opt-in required).
          *   *Process:* Genetic counseling is mandatory *before* disclosure, even if they just want to know. This mitigates harm.
      *   **Addressing the "Proves Too Much" Concern:** Explain why this specific policy doesn't lead to disclosing *everything*. Limits based on validity, seriousness, and counseling capacity.
      *   **Conclusion:** Summarize the recommendation.

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Initial thought:* Maybe suggest a default opt-out?
      *   *Correction:* No, for untreatable fatal conditions (like Huntington's), the standard of care in clinical genetics is rigorous counseling and explicit consent. An opt-out default is ethically risky for a biobank. Stick with opt-in.
      *   *Addressing the "Rational Participant":* I need to use behavioral ethics concepts. The "omission bias" or "anticipatory anxiety." The argument that "offering never makes you worse off" is false if the offer itself causes distress.
      *   *Tone Check:* Ensure I'm not shutting down the colleague's idea but refining it. The colleague wants to empower participants; I agree but want to do it safely.

  5.  **Drafting the Content (incorporating specific phrases):**
      *   "Well-validated and medically actionable" (Current).
      *   "Serious, untreatable conditions" (Proposed).
      *   "They can just ignore it" (The argument to assess).
      *   "Proves too much" (The counter-concern).

  6.  **Final Review against Constraints:**
      *   Memo format? Yes.
      *   Recommend specific policy? Yes (Opt-in + Counseling).
      *   Assess the argument? Yes (Section II).
      *   Address advance choice/default? Yes (Section III).

  7.  **Final Polish:** Check for clarity, professional tone, and ethical precision. (Ensure the distinction between *offering* the option and *disclosing* the result is clear).

  *(Self-Correction during drafting)*: I need to make sure I don't confuse "returning results" with "offering the option to receive results." The colleague argues that *offering* is harmless. My counter is that the *manner* of offering matters. If we send a letter saying "We found something, click here to see," that's different from "Would you like to be notified if we find X?" The policy should focus on the *consent to be notified*.

  Let's structure the argument assessment carefully:
  1.  Theoretical validity (Information economics).
  2.  Practical/psychological validity (Human behavior).
  3.  Institutional duty (Biobank responsibility).

  Okay, ready to write.

  *(Final thought on the "Default")*: For non-actionable, the default must be "Do Not Return." Why? Because the harm of unintentional disclosure (psychological distress without medical recourse) outweighs the benefit of autonomy for those who didn't express a preference. Autonomy is best served by asking beforehand.

  *(Final thought on Counseling)*: Crucial. You can't just email a Huntington's result. Pre-test counseling is standard. The biobank might not have resources for this. The policy should mandate referral to clinical genetics rather than direct disclosure by the biobank. I will include this distinction.

  Let's assemble the memo.cw
answer: |-
  **MEMORANDUM**

  **TO:** Research Biobank Ethics Subcommittee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Policy for Returning Non-Actionable Genetic Findings

  **1. Purpose**

  At our last meeting, we discussed a proposal to expand our Return of Results (RoR) policy. Currently, we disclose findings only if they are well-validated and medically actionable. The proposal suggests extending disclosure to well-validated findings for serious, untreatable conditions (e.g., Huntington's disease). The central argument advanced was that offering this information cannot leave a rational participant worse off than withholding it, as they retain the option to decline viewing the data.

  This memo assesses that argument and recommends a specific policy framework regarding advance choice and default settings for the next meeting's vote.

  **2. Assessment of the "Option Value" Argument**

  The proposition that "offering information never leaves a rational participant worse off" relies on a concept from information economics known as *option value*. Theoretically, having the option to know provides utility to those who want to know, while those who do not want to know can simply exercise their "right not to know" by ignoring the offer.

  However, applying this logic to genetic biobanking requires scrutiny on three grounds:

  *   **Psychological Reality vs. Rational Expectation:** The argument assumes participants can perfectly compartmentalize the *existence* of a finding from the *content* of a finding. In practice, notifying a participant that a result is available for a serious, untreatable condition generates anticipatory anxiety, even if they intend to ignore it. The "offer" itself conveys risk. If a participant receives a portal notification stating, "A finding regarding a neurodegenerative condition is available," the psychological harm is incurred at the moment of notification, regardless of whether they click the link. Therefore, the act of offering is not neutral.
  *   **The "Proves Too Much" Concern:** If we accept that any well-validated information should be offered because it can be ignored, we logically commit to offering findings of uncertain significance, carrier status for recessive traits, or predispositions to minor conditions. This risks "information overload," where the significance of critical findings is diluted, and participants are burdened with managing complex data without clinical support. We must distinguish between *capability* (we *can* tell them) and *stewardship* (we *should* tell them).
  *   **Institutional Duty of Care:** Unlike a public database, a biobank maintains a relationship with participants. If we offer results for untreatable conditions without a robust support structure, we risk abandoning participants with distressing knowledge they did not seek. The "ignore it" defense fails if our disclosure mechanism is prone to accidental breach (e.g., mail opened by family, emails read on shared devices) or if we fail to provide adequate counseling context.

  **Conclusion on Argument:** The "they can just ignore it" reasoning correctly identifies that autonomy is paramount, but it incorrectly assumes that the *method* of offering is cost-free. It supports giving participants the *choice* to receive such data, but it does not support a policy of passive disclosure or aggressive notification.

  **3. Policy Recommendation**

  To balance respect for autonomy with non-maleficence, I recommend we adopt a tiered consent model for well-validated, serious, non-actionable findings.

  **A. Categorization of Findings**
  We should create a specific category for **High-Validity, Serious, Non-Actionable (HVSN)** findings. This category is distinct from our current actionable category and distinct from low-validity or minor findings (which should not be returned).

  **B. Advance Choice (Opt-In Model)**
  Participants must be given the choice to receive HVSN findings during the initial consent process or via a dynamic consent portal.
  *   **Recommendation:** Participants must explicitly **opt-in** to receive HVSN findings.
  *   **Rationale:** An opt-in requirement ensures that only those who have actively considered the psychological implications and expressed a desire to know will be contacted. This respects the "right not to know" by making non-disclosure the path of least resistance.

  **C. Default Setting**
  *   **Recommendation:** The default setting for HVSN findings must be **Non-Disclosure**.
  *   **Rationale:** If a participant does not make an active choice, we must assume they prefer not to know. This protects vulnerable participants from accidental psychological harm and aligns with clinical genetics standards for conditions like Huntington's, where pre-test counseling is the norm.

  **D. Disclosure Process and Counseling**
  *   **Recommendation:** Disclosure of HVSN findings should not be performed directly by the biobank via portal or letter. Instead, the biobank should facilitate a referral to a clinical genetic counselor or the participant's primary care provider.
  *   **Rationale:** This mitigates the harm identified in Section 2. It ensures that if a participant chooses to know, they do so with professional support. It also acts as a "friction" point that prevents accidental or impulsive viewing of life-altering data.

  **4. Summary of Proposed Workflow**

  1.  **Consent:** Participant selects "Yes" or "No" regarding HVSN findings (Default = No).
  2.  **Analysis:** Biobank identifies a well-validated HVSN variant.
  3.  **Check:** Biobank checks participant preference.
      *   If **No/Default**: Result remains in the research record; participant is not notified.
      *   If **Yes**: Biobank contacts participant to schedule genetic counseling.
  4.  **Disclosure:** Result is released only after counseling session, through a clinical partner.

  **5. Next Steps**

  This framework rejects the notion that we should disclose everything we can, but it also rejects paternalistic withholding of information participants explicitly desire. It refines the "ignore it" argument: participants should not have to *ignore* an offer; they should be able to *decline* the offer before it is made.

  I look forward to discussing this framework at our meeting on [Date].

  **Attachments:**
  *   Draft Consent Language for HVSN Findings
  *   Summary of Clinical Referral Partnerships
