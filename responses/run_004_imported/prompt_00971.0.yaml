answer: |-
  ### The Scenario: The Archivist's Wager

  **Characters:**
  *   **Elara:** A meticulous archivist and historian, driven by a devotion to objective truth.
  *   **Cassian:** Her rival, a brilliant but controversial theorist who argues that history requires "ruthless intervention" to be preserved.
  *   **The Stake:** Elara's younger brother, Kael, has been accused of falsifying state records—a crime that carries execution. The evidence is ambiguous, buried in a damaged cipher.

  **The Setup:**
  Cassian possesses the only algorithm capable of decoding the records that would exonerate Kael. He does not offer this help freely. Instead, he presents Elara with a condition: To receive the algorithm, she must publicly recant her lifelong critique of his work and endorse his theory of "Ruthless Intervention" as the superior historical method. Crucially, Cassian insists the endorsement must be *sincere*. He knows Elara well enough to detect a lie; if he senses she is merely complying, he will destroy the algorithm.

  **The Scene:**
  Elara sits with Cassian in the archive. She attempts to write the endorsement, but her hand shakes. She tries to feign admiration for his method, arguing that it is "effective." Cassian stops her. "Effectiveness is a pragmatic virtue, Elara. I require an aesthetic one. You must find it *beautiful*."

  Desperate to save Kael, Elara forces herself to truly *look* at Cassian's work, not as a critic, but as a supplicant. She traces the logic of his algorithm. She realizes that his "ruthlessness" isn't cruelty; it is a willingness to damage the surface of history to save its core. He is willing to be hated (by her) to save the truth (about Kael).

  In that moment, Elara feels a surge of genuine admiration. She sees the integrity of his design. She writes the endorsement, not just to save Kael, but because she now sees the elegance of Cassian's mind. She admires him. But she knows, with chilling clarity, that she would never have seen this elegance if he hadn't held Kael's life hostage.

  ***

  ### The Philosophical Strain: Where the Diagnosis Falters

  To dramatize the **Wrong Kind of Reasons (WKR)** problem rigorously, you must understand where the standard **Fitting-Attitude (FA)** analysis breaks down in this specific context.

  **1. The Standard Diagnosis**
  In FA theory, $X$ is admirable if and only if it is fitting to admire $X$.
  *   **Right Kind of Reasons (RKR / Object-Given):** Reasons that cite properties of the object (e.g., "Cassian's algorithm is elegant," "Cassian is intellectually brave"). These make admiration *fitting*.
  *   **Wrong Kind of Reasons (WKR / State-Given):** Reasons that cite the consequences of having the attitude (e.g., "If I admire Cassian, my brother lives"). These make admiration *prudent*, but not *fitting*.

  In a standard "Demon Case" (Admire this pebble or I kill you), the distinction is clean. The threat is external to the pebble. Admiring the pebble doesn't make it admirable; it just saves you.

  **2. The Strain in Your Scene**
  In Elara's case, the distinction between Object-Given and State-Given reasons becomes ontologically blurred. Here is precisely where the diagnosis strains:

  **A. The Constitutive Overlap**
  Usually, the WKR (saving the brother) is distinct from the RKR (the rival's skill). In your scene, the WKR *constitutes* the RKR.
  *   Cassian's "skill" (the object property) *is* his leverage over Elara.
  *   The property Elara admires is his **capacity to force a recognition of truth through coercion.**
  *   If you ask Elara, "Why do you admire him?" she cannot say "Because he saved Kael" (State-Given). She must say "Because he is a master of historical intervention" (Object-Given).
  *   *However*, the only evidence of that mastery *is* the successful coercion of Elara.
  *   **The Strain:** The "Wrong Kind" reason (the threat to Kael) is not merely a pragmatic add-on; it is the *demonstration* of the "Right Kind" property (his theoretical consistency). The threat is the *experiment* that proves the theory. Therefore, the pragmatic reason is evidentially necessary for the object-given reason. You cannot have the RKR without the WKR.

  **B. The Relational Property Problem**
  FA accounts struggle with properties that are defined by their effect on the subject.
  *   Is "being the person who can save my brother through intellectual leverage" a property of Cassian?
  *   If yes, then admiring him for this is Object-Given (RKR).
  *   If no, then it is State-Given (WKR).
  *   **The Strain:** In your scene, Cassian's value is *relational*. He is admirable *to Elara* specifically because of how he alters her normative landscape (forcing her to choose). Standard FA theory prefers non-relational properties (e.g., "kindness," "skill"). When the admirable property is "the power to rightly coerce the admirer," the theory cannot easily decide if this is a value of the *person* or a value of the *situation*.

  **C. The Counterfactual Test Failure**
  Philosophers often use a counterfactual test to distinguish WKR from RKR: *Would you still admire him if the threat were removed?*
  *   **Standard WKR:** No. (I wouldn't admire the pebble if the demon left).
  *   **Standard RKR:** Yes. (I would still admire the hero if no one was watching).
  *   **Your Scene:** The answer is genuinely unclear.
      *   If Cassian hadn't threatened Kael, Elara never would have studied his work closely enough to find the beauty. So, practically, no.
      *   But the beauty she found is *real* and independent of the threat once found. So, theoretically, yes.
      *   **The Strain:** The WKR acts as a **causal gateway** to the RKR. The wrong reason *generates* the right reason. This violates the standard assumption that WKRs and RKRs are independent categories. Here, the WKR is the *efficient cause* of the RKR's recognition.

  ### How to Write This for Emotional Logic

  To ensure your scene tracks this conceptual difficulty without becoming a lecture, focus Elara's internal monologue on the **indistinguishability of the motive.**

  *   **Don't write:** "She knew she was admiring him for the wrong reasons, but they felt right." (This accepts the standard diagnosis).
  *   **Do write:** "She searched for a reason to praise him that wasn't Kael's life, but every path of logic led back to the knife at her brother's throat. Was the knife part of his genius? Or was the genius just the sheath for the knife? She couldn't tell where the man ended and the leverage began."

  **The Climax of the Subplot:**
  When Elara finally speaks her admiration, let it be ambiguous even to her. She should feel a sense of *violation* and *elevation* simultaneously. The violation comes from the coercion (WKR); the elevation comes from the genuine insight (RKR). If she feels only gratitude, the philosophical point is lost. If she feels only awe, the coercion is forgotten. She must feel that the awe is *born of* the violation.

  This allows you to dramatize the **Fitting-Attitude** problem not as a logic puzzle, but as a human experience: **The terror of realizing that your highest values (Truth, Art, Integrity) might be inaccessible without your lowest vulnerabilities (Fear, Love, Loss).** The "Wrong Kind of Reasons" problem becomes a problem of the human condition: We often need pragmatic, dirty reasons to arrive at pure, fitting ones.
