answer: |-
  You have hit on the exact nerve that keeps social choice theorists up at night. You are describing the conflict between **Ex-Ante Pareto** (which Harsanyi satisfies) and **Ex-Post Equity** (which Harsanyi ignores). This is often called the **Diamond Critique** (after Peter Diamond, 1967), but most presentations of it rely on the "one kidney, two patients" indivisible good example.

  Here is a concrete example that avoids the indivisible good constraint, uses identical utility functions, and shows how a Harsanyi planner can be indifferent between a policy of **Solidarity** and a policy of **Ex-Post Inequality**.

  ### The Setup: "The Health Budget"

  **The Agents:**
  Two patients, **Alice** and **Bob**. They are identical in every relevant moral respect.

  **The Utility Function:**
  To satisfy your bonus constraint, they have the exact same vNM utility function over health outcomes. To make the math transparent and isolate the fairness issue from risk-aversion issues, let's assume they are **risk-neutral** regarding health statistics (e.g., they care about expected QALYs).
  $$U(h) = h$$
  *(Where $h$ is health outcome units)*

  **The Resource:**
  The planner has a fixed budget of **10 Units** of a divisible medical treatment.

  **The Policies:**
  The planner must choose between two distribution protocols before nature resolves a state of the world (State 1 or State 2, each with 50% probability).

  *   **Policy A (Solidarity):** The treatment is always split evenly, regardless of the state.
      *   **State 1:** Alice gets 5, Bob gets 5.
      *   **State 2:** Alice gets 5, Bob gets 5.

  *   **Policy B (The Swap):** The treatment is given entirely to one person, determined by a fair coin flip (the "state").
      *   **State 1:** Alice gets 10, Bob gets 0.
      *   **State 2:** Alice gets 0, Bob gets 10.

  ### The Harsanyi Calculation (Ex-Ante)

  A Harsanyi-style planner constructs a Social Welfare Function (SWF) that is a weighted sum of individual expected utilities. Since agents are identical, we give them equal weight ($w_A = w_B = 1$).

  **Policy A:**
  *   Alice's Expected Utility: $0.5(5) + 0.5(5) = 5$
  *   Bob's Expected Utility: $0.5(5) + 0.5(5) = 5$
  *   **Social Welfare:** $5 + 5 = \mathbf{10}$

  **Policy B:**
  *   Alice's Expected Utility: $0.5(10) + 0.5(0) = 5$
  *   Bob's Expected Utility: $0.5(0) + 0.5(10) = 5$
  *   **Social Welfare:** $5 + 5 = \mathbf{10}$

  **The Verdict:** The Harsanyi planner is **strictly indifferent**. From the perspective of *ex-ante* expected utility, these policies are identical. Both agents have the same life prospects under both regimes.

  ### The Ex-Post Reality (The Fairness Bug)

  Now, imagine the coin has landed. The uncertainty has resolved. We are now living in the *ex-post* reality.

  *   **Under Policy A:** We look around. Alice has 5 units of health. Bob has 5 units of health.
      *   **Inequality:** 0.
      *   **Intuition:** This looks like a fair society. Everyone was treated equally.

  *   **Under Policy B:** We look around. In *every single realized state*, one person is thriving (10) and the other is suffering/dead (0).
      *   **Inequality:** Maximal.
      *   **Intuition:** This looks like an unjust society. Even though everyone had a "fair chance" initially, the actual outcome is a world of haves and have-nots.

  ### Why This Bites Harder Than the "Indivisible Good"

  In the classic "one kidney" example, you can argue that inequality was technologically unavoidable (you literally can't split the kidney).

  In this example, the good **was divisible**. Policy A proves it was *possible* to give everyone 5. Policy B *chose* to create inequality where none needed to exist.

  The Harsanyi theorem cannot distinguish between these two cases because it integrates over the states of the world *before* evaluating the social welfare. It sees the **average** person, not the **actual** people in the realized state.

  ### Addressing the "Same Utility Function" Bonus

  This example works precisely *because* they have the same utility function.
  1.  If they had different utility functions, a Harsanyi planner might prefer Policy B simply to maximize total utility (e.g., if Alice converts treatment to health more efficiently).
  2.  By making $U_A(h) = U_B(h) = h$, we rule out efficiency gains. The *only* difference is the distribution.
  3.  Because they are risk-neutral, we rule out risk-preference confounds. They don't prefer Policy A because they hate variance; they are ex-ante indifferent.

  The indifference is purely a result of the **linearity of expectation** ($E[X+Y] = E[X] + E[Y]$), which allows the planner to swap utility across states without penalty.

  ### The EA/Longtermist Implication

  This is particularly relevant for Effective Altruism and Longtermism, which often rely on expected value calculations over huge populations and time horizons.

  Imagine a longtermist policy regarding AI Safety:
  *   **Policy A (Safety):** Guarantees a moderate quality of life for all future generations.
  *   **Policy B (Roll the Dice):** 50% chance of utopia for everyone, 50% chance of extinction for everyone.

  Harsanyi handles the above fine (usually preferring B if the utopia utility is high enough).

  But imagine a **distributional** longtermist risk:
  *   **Policy A:** All future civilizations achieve a stable, moderate welfare.
  *   **Policy B:** In 50% of possible futures, half the civilizations achieve utopia and the other half suffer totalitarian misery (correlated risk). In the other 50%, they swap.

  If you are a Harsanyi utilitarian calculating from behind a veil of ignorance (ex-ante), Policy B might look just as good as Policy A if the averages match. But if you care about the **ex-post fairness** of the multiverse (or the actual future that gets realized), Policy B is morally repugnant because it guarantees that *whoever actually exists* will likely be in a miserable civilization, even if "expected value" is preserved.

  Harsanyi tells you that **equality of opportunity** (ex-ante) is all that matters. Your intuition (and Diamond's) tells you that **equality of outcome** (ex-post) has independent moral weight that the theorem washes out.
