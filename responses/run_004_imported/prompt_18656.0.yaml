      *   *Stronger Argument:* The "method" for DNA includes the statistical interpretation. If the defendant is innocent, the statistical interpretation of the match (the Random Match Probability) remains valid. The inference relies on the base rate. Base rates are insensitive to the specific instance.
      *   *The "Causal" Counter:* People say DNA is causal. But the *weight* is statistical. A hair at the scene means nothing without the stats. The stats are the "naked" part.
      *   *Epidemiology:* This is the smoking gun. It is *purely* statistical. If sensitivity bans Blue Bus, it bans "more likely than not" causation in toxic torts.

  5.  **Final Polish:**
