      *   **Conclusion:** The knowledge/sensitivity account fails to explain the legal distinction because the distinction doesn't exist at the epistemic level. The legal distinction is pragmatic/moral (we don't want to punish based on group membership), not epistemic. Trying to force it into a "knowledge" box breaks the box.

