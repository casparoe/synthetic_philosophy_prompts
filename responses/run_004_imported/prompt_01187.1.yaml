answer: |-
  You are right, and your roommate is missing something real. He isn't wrong about the *outcome* utility (the dog ends up with one person, the other person is sad), but his model of the world is too narrow. He is calculating the utility of the *possession* of the dog, but ignoring the utility of the *process* of the decision.

  Since your roommate got you into rationalist blogs, let's speak his language to explain why he's mistaken.

  ### 1. His Utility Function is Incomplete
  Your roommate is arguing that:
  $$ \text{Total Sadness} = (\text{Probability A loses} \times \text{Sadness}_A) + (\text{Probability B loses} \times \text{Sadness}_B) $$

  Since the probabilities and sadness levels are equal, he thinks the method of decision doesn't change the sum. But this assumes sadness is only a function of *not having the dog*.

  In reality, human utility functions include **Procedural Justice**. Humans derive utility (or disutility) from *how* an outcome was reached.
  *   **Scenario A (Arbitrary):** One person takes the dog. The loser feels overridden, perhaps resentful, or feels their claim was disregarded. This adds "Process Sadness."
  *   **Scenario B (Coin Flip):** Both agree to submit to chance. The loser still feels sadness, but it is tempered by the knowledge that the process was fair.

  Therefore, $\text{Sadness}_{\text{coin}} < \text{Sadness}_{\text{arbitrary}}$. The coin flip actually *does* lower the expected amount of sadness in the world by removing the "unfairness" variable.

  ### 2. Ex-Ante vs. Ex-Post Regret
  There is a massive difference in the psychological narrative of losing.
  *   **If you just "take" the dog:** The loser looks back and thinks, "I let them take her," or "They didn't care enough about my pain to find a fair way." This breeds long-term resentment.
  *   **If you flip a coin:** The loser looks back and thinks, "It was fate."

  The coin flip externalizes the agency. It turns a conflict between *you and your partner* into a conflict between *you and the universe*. It is much easier to make peace with the universe than with an ex-partner. The coin flip buys you **closure**, which is a valuable commodity in a breakup.

  ### 3. The Schelling Point
  In game theory, a **Schelling point** is a solution that people tend to choose by default in the absence of communication, because it feels special or focal.

  Right now, you are in a coordination game. You both want the dog. Without a mechanism to decide, you risk a "war of attrition" (arguing, guilt-tripping, delaying the move). This burns time and emotional energy.
  The coin is a pre-commitment device. By agreeing to flip, you both signal: *"I acknowledge your claim is equal to mine, and I am willing to risk losing her to honor that equality."*

  That signal has value. It preserves the dignity of both parties. Skipping the ritual skips the signal, which can make the winner feel like a thief and the loser feel like a victim.

  ### 4. The "Second-Order" Sadness
  Your roommate is also ignoring the winner's experience.
  *   **Winning by default:** You keep the dog, but you carry the guilt of knowing your partner is devastated and that you essentially overruled them.
  *   **Winning by coin:** You keep the dog, and while you are sad your partner is hurting, you know you didn't *choose* to hurt them; the coin did.

  The coin flip protects the winner's relationship with the dog, too. It ensures the winner doesn't look back at the dog and see a source of conflict.

  ### The Verdict
  Your roommate is treating this like a resource allocation problem. It isn't. It's a **grief management** problem.

  The coin flip is a technology for minimizing conflict costs and maximizing closure. It transforms a interpersonal struggle into a shared acceptance of fate. That is not sentimentality; that is emotional efficiency.

  Flip the coin. Make it ceremonial. Let it be the final thing you decide together. It will hurt either way, but the coin ensures the hurt doesn't turn into resentment.
