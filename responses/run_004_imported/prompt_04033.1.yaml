      *   **Intent:** Rawls wanted to make liberalism *compatible* with faith, not hostile to it. He was responding to critics (like Wolterstorff and Audi).
      *   **The "Wide View":** In his later work, he softened the stance to allow religious language in the public square, provided it translates eventually.

