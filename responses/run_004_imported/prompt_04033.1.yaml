  Hey, quick gut check before my Rawls seminar tomorrow -- I've always told students that his idea of public reason means religious citizens basically have to leave their faith at the door in politics: no citing scripture or church teaching to justify a law, full stop, since comprehensive doctrines can't legitimately ground coercive state power in a pluralist society. Thats the headline version I give them from Political Liberalism, right? Just want to make sure I'm not flattening something before I put it in front of 40 undergrads.
