answer: |-
  This is a sophisticated objection that cuts to the heart of the accuracy-first program. As someone working in ML infrastructure, you have a distinct advantage here: you treat scoring rules as engineering tools selected for specific downstream properties (calibration, convergence speed, tail-risk sensitivity), whereas accuracy-first epistemologists often treat them as metaphysical mirrors of the "truth relation."

  Below, I lay out the argument that Joyce's dominance argument fails to establish the *irrationality* of incoherent credences due to rule-relativity, even in its 2009 propriety-restricted form. I will then engage with the strongest defense (Pettigrew's axiomatic characterization) and explain why it ultimately fails to rescue the non-pragmatic vindication.

  ---

  ### 1. The Core Failure: Rule-Relativity and the Underdetermination of "Accuracy"

  The goal of Joyce's program is to show that Probabilism is a requirement of *epistemic* rationality, grounded solely in the goal of believing truth and avoiding error (alethic veritism). The argument structure is:
  1.  **Normative Premise:** It is irrational to hold a credence function that is accuracy-dominated (i.e., guaranteed to be less accurate than some alternative in every possible world).
  2.  **Mathematical Premise:** A credence function is accuracy-dominated if and only if it is probabilistically incoherent (assuming a "legitimate" accuracy measure).
  3.  **Conclusion:** Therefore, it is irrational to be probabilistically incoherent.

  The failure lies in the gap between the Normative and Mathematical premises once we acknowledge rule-relativity.

  #### Why Strict Propriety Is Not Enough
  In ML, you know that "strict propriety" (where the expected score is minimized when the reported distribution matches the true distribution) is a desirable property for eliciting honest probabilities. However, it defines a *convex class* of functions, not a unique function. The Brier score, Log Loss (logarithmic scoring rule), and Spherical scores are all strictly proper.

  Joyce's 2009 move restricts "legitimate" measures to this class. He proves that for any strictly proper measure, every incoherent credence function is dominated by some coherent one. Mathematically, this looks robust. However, philosophically, it creates a **multi-objective optimization problem without a specified loss weighting.**

  Consider an incoherent agent $I$.
  *   Under Brier Score ($S_B$), $I$ is dominated by coherent function $C_1$.
  *   Under Log Loss ($S_L$), $I$ is dominated by coherent function $C_2$.
  *   Typically, $C_1 \neq C_2$.

  If the agent asks, "Which coherent credence should I adopt to repair my irrationality?", the accuracy-first framework gives conflicting advice. $S_B$ says "Move toward $C_1$," while $S_L$ says "Move toward $C_2$." Since both measures are "legitimate" (strictly proper), there is no internal epistemic reason to prefer one directive over the other.

  #### The Normative Gap
  The claim "Incoherence is irrational" implies a categorical normative failure. But if "Accuracy" is disjunctive (Brier-Accuracy OR Log-Accuracy OR...), then the claim dilutes to: "Incoherence is Brier-irrational AND Log-irrational AND..."

  While Joyce's theorem ensures that *some* coherent dominator exists for *each* measure, the **magnitude** and **direction** of the dominance vary.
  1.  **Magnitude:** $I$ might be 0.1 units from coherence under $S_B$ but 50 units under $S_L$. If the "degree of irrationality" tracks inaccuracy, the severity of the violation is measure-relative.
  2.  **Direction:** As noted, the repair path differs.

  If rationality requires minimizing inaccuracy, and "inaccuracy" is not a natural kind but a family of functions, the command "Minimize Inaccuracy" is semantically incomplete without a selection rule. In ML, you select the loss function based on the *task* (e.g., Log Loss for likelihood maximization, Brier for calibration). In epistemology, if the only task is "believing truth," the framework provides no mechanism to select the loss function. Therefore, the move from "Minimize Inaccuracy" to "Be Probabilistic" relies on a hidden, unjustified premise: that there is a *unique* or *privileged* measure of alethic accuracy. Strict propriety does not provide this uniqueness.

  ### 2. The Strongest Reply: Axiomatic Characterization

  The most rigorous defense of the accuracy-first program comes from Richard Pettigrew (e.g., *Accuracy and the Laws of Credence*, 2016). He acknowledges the underdetermination problem and attempts to solve it by arguing that additional, purely epistemic constraints narrow the class of legitimate measures down to a unique function (or a very narrow class, typically the Brier score).

  #### The Argument
  Pettigrew argues that strict propriety is necessary but not sufficient. We must add structural axioms that any *alethic* measure of accuracy should satisfy:
  1.  **Extensionality:** The inaccuracy of a credence in a proposition depends only on the credence assigned and the truth-value of the proposition (not on other propositions).
  2.  **Permutation Invariance (Symmetry):** The measure should not favor one proposition over another *a priori*. If we swap the labels of two worlds, the inaccuracy calculation should remain structurally identical.
  3.  **Continuity and Differentiability:** Required for the dominance theorem to hold geometrically.

  Pettigrew demonstrates that if you require a scoring rule to be strictly proper, continuous, and satisfy certain symmetry conditions, you essentially derive the **Brier Score** (or a positive affine transformation of it). If the Brier score is uniquely privileged by the nature of truth and falsity themselves, then the rule-relativity objection dissolves. There is only one "True Accuracy," and it yields a unique dominance result.

  #### Why This Seems Plausible
  This mirrors how we might justify Mean Squared Error (MSE) in regression as the "natural" loss under assumptions of Gaussian noise and symmetry. If truth is "binary" (0 or 1) and propositions are logically independent atoms, the Euclidean distance (Brier) seems like the most neutral geometric interpretation of "distance from truth."

  ### 3. Evaluating the Reply: Why It Fails to Rescue the Argument

  While Pettigrew's axiomatic approach is mathematically elegant, it fails to rescue Joyce's *non-pragmatic* vindication for two critical reasons.

  #### A. The Symmetry Axiom Encodes Pragmatic Indifference
  The Permutation Invariance (Symmetry) axiom is the linchpin. It asserts that getting the truth-value wrong on Proposition $A$ is *exactly as inaccurate* as getting it wrong on Proposition $B$, regardless of the content of $A$ or $B$.

  In ML terms, this assumes a uniform class weight. But why should an epistemologist assume this?
  *   **Logical Weight:** Some propositions entail many others. Being wrong about a fundamental law of physics might be "more inaccurate" (in terms of downstream error) than being wrong about a trivial contingent fact.
  *   **Salience:** Human rationality is often sensitive to the importance of the proposition.

  By imposing Symmetry, Pettigrew is not describing a metaphysical feature of "Truth"; he is imposing a **pragmatic constraint of indifference**. He is effectively saying, "We will treat all errors as equally costly because we have no reason to distinguish them." But this is a pragmatic decision rule (Principle of Indifference), not an alethic fact. If the uniqueness of the Brier score depends on a pragmatic indifference assumption, the vindication of Probabilism is no longer purely alethic; it is partially pragmatic. This undermines Joyce's original goal of a "Nonpragmatic Vindication."

  #### B. The "Smoothness" Requirement is Technical, Not Alethic
  To prove the dominance theorem for the class of proper scores, Joyce and Pettigrew rely on the measures being continuous and differentiable. This allows them to use geometric arguments (separating hyperplanes) to show that incoherent points lie outside the convex hull of coherent points.

  However, there is no *alethic* reason why accuracy must be smooth.
  *   **The Threshold Intuition:** One could argue that accuracy is binary: you are either "right enough" or "wrong." A step-function loss might capture this better than Brier.
  *   **The Outlier Sensitivity:** Log Loss penalizes confident errors much more severely than Brier. If "Truth" is the goal, why is the penalty for being 99% confident and wrong only quadratically worse (Brier) rather than infinitely worse (Log Loss)?

  By restricting "Legitimate Measures" to smooth, proper scores, the accuracy-first theorist is essentially selecting the class of functions that *makes the theorem work*. This looks suspiciously like fitting the metric to the desired conclusion. If there are legitimate, non-smooth proper scores (which exist mathematically) for which the dominance theorem fails or behaves pathologically, the claim that "Incoherence is *always* dominated" rests on a technical restriction that lacks philosophical justification.

  ### 4. Conclusion: The Collapse into Pragmatism

  The accuracy-dominance argument fails to establish that incoherent credences are irrational *solely on alethic grounds* because:

  1.  **Propriety is Underdetermined:** Strict propriety defines a family of measures, not a unique standard. Different members of this family provide conflicting repair directives for incoherent agents.
  2.  **Axioms are Pragmatic:** Attempts to isolate a unique measure (like Brier) rely on axioms like Symmetry, which encode pragmatic indifference rather than metaphysical truths about the nature of accuracy.
  3.  **The ML Analogy Holds:** Just as in ML there is no "True Loss Function" independent of the task (calibration vs. ranking vs. likelihood), there is no "True Accuracy Measure" independent of the epistemic goals of the agent.

  If the choice of accuracy measure depends on what the agent wants to *do* with their credences (e.g., maximize likelihood, minimize squared error, ensure calibration), then the rationality of Probabilism is vindicated **pragmatically** (it serves these goals better than incoherence), not **alethically** (it is closer to Truth *simpliciter*).

  Joyce's argument succeeds in showing that Probabilism is *compatible* with accuracy-first epistemology, but it fails to show that Probabilism is *required* by it, because the definition of "Accuracy" required to generate the requirement smuggles in the very probabilistic structure it aims to derive. The "rule-relativity" you identified is not a bug; it is a feature of the fact that "Accuracy" is not a monolithic natural kind, but a tool-dependent metric. Without a non-circular justification for privileging one proper score over another, the dominance argument remains mathematically sound but normatively inert.
