      *   **Imitation of Affects (*Ethics* III, Prop 27):** We feel what others feel. This is the mechanism of social cohesion and social contagion.
      *   **Power (*Potentia*):** Right is coextensive with power (*TTP* Ch. 16, *TP* Ch. 2). The sovereign's right is the power of the multitude combined.
      *   **Freedom:** Not free will, but acting from the necessity of one's own nature (reason). In politics, it's living under laws that allow one to develop rational capacity, but primarily it's about stability and peace.
      *   **The Threat:** Algorithmic curation isn't just "speech"; it's an external modification of the *environment* of the affects. It artificially enhances the *imitation of affects*.
      *   **Democracy vs. Aristocracy:** Democracy aligns best with natural right (equality of power), but it relies on the stability of the multitude. Aristocracy uses buffers (councils, syndics) to dampen passion.
      *   **The Core Tension:** Does algorithmic amplification overwhelm the natural checks of the multitude, making democracy impossible? Or can we engineer "digital syndics"?

  3.  **Drafting the Argument - Step-by-Step:**

      *   **Acknowledge the User's Expertise:** Validate their reading. They've grasped the crucial link between *Ethics* (psychology) and *Politics* (institutional design). This sets a respectful, high-level tone.

      *   **Step 1: Diagnose the Technology via the *Imitation of Affects*.**
