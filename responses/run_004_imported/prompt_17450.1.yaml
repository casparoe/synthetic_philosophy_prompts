      *   *The "Engagement" Construct:* Deconstruct this. Does "looking engaged" matter for an RA? Or does "doing the work well" matter?
      *   *Moral Psychology Angle:* Mention System 1 vs. System 2. The user's reaction is System 1 (intuitive). They need to engage System 2 (analytical) to correct it. Mention the "Bias vs. Noise" framework (Kahneman et al.).
      *   *Action Plan:*
