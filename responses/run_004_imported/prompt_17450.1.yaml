prompt: |-
  I am a PhD student in moral psychology, and this semester I have been helping my advisor screen undergraduates who are applying for research assistant positions in our lab. Across several rounds of interviews, I have noticed that I consistently rate candidates who answer quickly and maintain steady eye contact as more "engaged" and "sharp," even when a transcript of their answers reads no differently from that of a candidate who pauses more or looks away while thinking. A labmate who studies autism pointed out that this pattern would systematically disadvantage autistic applicants and anyone who simply needs more time to formulate an answer, and now I cannot decide whether my reaction is tracking something real about engagement or is just an unexamined bias. Is there a principled way to tell whether a reaction like mine reflects a legitimate preference rather than a bias, and should the answer change how I use these ratings going forward?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** PhD student in moral psychology.
      *   **Context:** Screening undergraduates for Research Assistant (RA) positions in their lab.
      *   **Observation:** The user consistently rates candidates who answer quickly and maintain steady eye contact as more "engaged" and "sharp," despite transcript analysis showing no difference in answer quality compared to those who pause or look away.
      *   **Trigger:** A labmate (autism researcher) pointed out this biases against autistic applicants or those needing processing time.
      *   **Core Question:** Is there a principled way to distinguish between a legitimate preference (tracking something real about engagement) and an unexamined bias? Should this change how they use ratings going forward?
      *   **Field:** Moral Psychology (implies familiarity with concepts like bias, heuristics, normative ethics, empirical evidence).

  2.  **Deconstruct the Problem:**
      *   **The Phenomenon:** The user is experiencing a "halo effect" or "affinity bias" based on neurotypical social cues (eye contact, fluency).
      *   **The Evidence:** The user *already has data* (transcripts) showing no correlation between these cues and answer quality. This is crucial.
      *   **The Ethical/Professional Stake:** Hiring fairness, diversity (neurodiversity), validity of selection criteria.
      *   **The Philosophical/Psychological Question:** How to distinguish signal (legitimate predictor of job performance) from noise (bias).

  3.  **Formulate the Argument:**
      *   **Acknowledge the Insight:** Validate the user's self-reflection and the labmate's input. This is a classic case of implicit bias vs. valid signal.
      *   **Define the Criteria for "Legitimate Preference":** In hiring, a preference is legitimate *only* if it predicts job performance (validity) and is job-relevant.
      *   **Apply the Evidence:** The user noted that transcripts (content) don't differ. This suggests the *style* (speed/eye contact) is not predicting *cognitive quality*.
      *   **Address the "Engagement" Construct:** Is "looking engaged" the same as *being* engaged? In this context, it seems to be a proxy that is failing.
      *   **Neurodiversity Perspective:** Eye contact and processing speed are culturally and neurologically variable. They are not universal markers of competence.
      *   **Actionable Advice:** How to change the hiring process to mitigate this bias.

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the user's moral concern. It's good they are asking. Connect to their field (moral psychology).
      *   *Distinguishing Bias from Signal:* Use the concept of **Predictive Validity**. If a trait doesn't predict the outcome (good RA work), it's bias/noise.
      *   *The Specific Cues:*
          *   *Eye Contact:* Cultural/Neurological variance. Not a valid measure of honesty or attention in all contexts.
