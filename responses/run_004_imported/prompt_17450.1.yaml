answer: |-
  This is an exemplary moment of ethical self-reflection, particularly for someone in your field. You are encountering the precise intersection of empirical observation and normative judgment that defines moral psychology. You have identified a discrepancy between your intuitive assessment (System 1) and the evidentiary record (System 2).

  To answer your questions directly: Yes, there is a principled way to distinguish legitimate preference from bias, and yes, the answer should fundamentally change how you use these ratings.

  Here is a framework for analyzing this situation, drawing on psychometric principles, hiring best practices, and the ethics of selection.

  ### 1. The Principled Distinction: Predictive Validity
  In personnel selection, the distinction between a "legitimate preference" and a "bias" is not philosophical; it is empirical. It rests on **predictive validity**.

  *   **Legitimate Preference:** A trait is a legitimate basis for selection *only* if it reliably predicts successful performance in the specific role. If you prefer candidates who are "sharp," you must define "sharpness" in terms of outcomes (e.g., data accuracy, coding efficiency, writing clarity) and demonstrate that the cue (eye contact/speed) correlates with those outcomes.
  *   **Bias:** A trait functions as a bias when it influences judgment *independent* of its relationship to job performance. If the transcript analysis shows no difference in answer quality, then processing speed and eye contact are not tracking "sharpness" or "engagement" in a way that matters for the work. They are tracking **neurotypical performance style**.

  Your transcript analysis provides preliminary validity evidence: the *content* (the actual cognitive output) is equivalent across groups. Therefore, the *style* (the social signaling) is noise, not signal. Relying on it reduces the validity of your hiring process.

  ### 2. Deconstructing the Cues
  As a moral psychologist, you likely recognize the **fluency heuristic**. We tend to judge statements that are processed easily (fast, fluent, accompanied by expected non-verbals) as more truthful and competent. However, research shows this is a cognitive illusion.

  *   **Processing Speed:** In research, deliberation is often superior to speed. A pause may indicate careful retrieval, inhibition of a wrong answer, or complex synthesis. Penalizing latency penalizes cognitive depth.
  *   **Eye Contact:** This is a culturally and neurologically specific norm. For many autistic individuals, maintaining eye contact consumes cognitive resources that would otherwise be used for listening and formulating answers. By rating eye contact as "engagement," you are effectively measuring a candidate's ability to perform neurotypicality, not their ability to conduct research.

  ### 3. Construct Validity: What are you actually measuring?
  You are rating candidates on "engagement" and "sharpness." You need to ask: **What is the construct?**

  If "engagement" means "displays neurotypical social cues," then your measure is reliable but invalid for the job.
  If "engagement" means "demonstrates interest and cognitive effort," your current metric is failing.

  If the goal of the RA position is to produce high-quality research, the only "engagement" that matters is engagement with the *work*, not the *interviewer*. By weighting social performance heavily, you introduce **adverse impact** against neurodivergent candidates without gaining any predictive power regarding their research output.

  ### 4. How to Change Your Ratings Going Forward
  You should not merely "try harder" to ignore these cues; intuition is resistant to willpower. You must change the **structure** of the evaluation.

  **A. Decouple Style from Substance**
  Continue doing what you started: separate the transcript from the performance. If possible, implement a **work sample test**. Give all finalists a small, timed task relevant to the lab (e.g., cleaning a dataset, coding a snippet, summarizing a paper). Rate *that* output blindly. This is consistently the strongest predictor of job performance, far outweighing interview impressions.

  **B. Re-calibrate the Rubric**
  Explicitly remove "eye contact" and "response speed" from your rating rubric. Replace them with behavioral anchors that relate to the job:
  *   *Instead of "Sharpness":* "Accuracy of technical concepts," "Nuance in ethical reasoning."
  *   *Instead of "Engagement":* "Quality of questions asked about the research," "Demonstrated knowledge of lab work."

  **C. The "Pause" Reframe**
  Cognitive reframing can help mitigate the automatic reaction. When a candidate looks away or pauses, actively label it in your notes as "processing" rather than "hesitating." Remind yourself: *In this context, latency is a feature of careful thought, not a bug of disengagement.*

  **D. Acknowledge the Moral Obligation**
  In moral psychology, we study how people *ought* to reason. In hiring, you hold gatekeeping power. If you know a metric disadvantages a protected group (including neurodivergent individuals) and lacks predictive validity, continuing to use it is not just a methodological error; it is an ethical failure. It perpetuates systemic exclusion under the guise of "merit."

  ### Summary
  Your reaction is a standard human heuristic, but in the context of fair hiring, it is a bias. The principled test is **job relevance**. Since the content of the answers does not vary with the style of delivery, the style is irrelevant to the merit of the candidate.

  You should downgrade the weight of these "social fluency" ratings immediately. Rely more on blind work samples and structured questions. By doing so, you align your hiring practices with the scientific rigor your lab espouses and the ethical standards your field demands. You are not lowering your standards by ignoring eye contact; you are raising them by focusing on actual competence.
