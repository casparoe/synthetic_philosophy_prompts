      *   *Verdict:* It's not a *distinct* decision theory in the formal sense (like CDT vs. EDT vs. FDT); it's more of a philosophical stance or a specific application of EDT with a strong assumption of symmetry. However, Functional Decision Theory (FDT) is the modern formalization that captures this best. I need to mention FDT (Yudkowsky/Soares) because it's the contemporary successor to this line of thinking.

