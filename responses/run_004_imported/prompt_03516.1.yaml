answer: |-
  Karl Popper introduced the concept of *verisimilitude* (truthlikeness) to rescue scientific realism from the implications of his own falsificationism. If all scientific theories are ultimately conjectural and likely false, Popper wanted a formal metric to explain how science progresses: a later, false theory (like Newtonian mechanics) can be *closer to the truth* than an earlier, false theory (like Aristotelian physics). Popper's qualitative definition relied on comparing the "truth content" and "falsity content" of theories. However, in 1974, Pavel Tichý and David Miller independently proved that Popper's definition collapses: it entails that no false theory can have greater verisimilitude than any other false theory. This essay will explain the fatal mechanics of the Tichý–Miller argument, contrast Popper's account with Ilkka Niiniluoto's "likeness" account of truthlikeness, and assess whether Niiniluoto's technical solution escapes the problem or merely exchanges it for a difficulty of comparable severity.

  ### Popper's Definition and the Tichý–Miller Refutation

  Popper defined the verisimilitude of a theory $A$ ($Vs(A)$) in terms of two classes of sentences derived from $A$: its truth content ($Ct_T(A)$), the set of all true sentences entailed by $A$, and its falsity content ($Ct_F(A)$), the set of all false sentences entailed by $A$. Intuitively, a theory is closer to the truth if it entails more truths and fewer falsehoods. Formally, Popper proposed that $A$ has greater verisimilitude than $B$ ($A >_v B$) if and only if:
  1.  $Ct_T(A) \supseteq Ct_T(B)$ and $Ct_F(A) \subset Ct_F(B)$, or
  2.  $Ct_T(A) \supset Ct_T(B)$ and $Ct_F(A) \subseteq Ct_F(B)$.

  In simpler terms, $A$ beats $B$ if $A$ has more truth content and no more falsity content, or the same truth content and less falsity content.

  The Tichý–Miller proof demonstrates that this definition is vacuous for the very cases it was designed to handle: comparisons between false theories. The argument relies on the logical relationships between consequence classes in a Boolean algebra. If a theory $A$ is false, it entails at least one false statement. Tichý and Miller showed that for any two false theories $A$ and $B$, the conditions required for $A >_v B$ cannot be satisfied.

  The fatal mechanism is the interdependence of truth and falsity content under logical entailment. If $A$ is false, it asserts something incompatible with the actual world. To increase truth content (to satisfy condition 2 above), $A$ must logically entail more true sentences than $B$. However, in a standard logical framework, strengthening a theory to entail more truths inevitably increases its logical strength overall. If the theory is already false, increasing its logical strength generally forces it to entail *more* false consequences as well, or at least prevents the falsity content from decreasing relative to $B$. Tichý proved rigorously that if $A$ and $B$ are both false, the set-theoretic relations required by Popper's definition ($Ct_T(A) \supset Ct_T(B)$ combined with $Ct_F(A) \subseteq Ct_F(B)$) imply that $A$ must actually be true. Since we are assuming $A$ is false, this is a contradiction. Consequently, under Popper's definition, all false theories are incomparable regarding verisimilitude. This renders the concept useless for describing scientific progress, as progress almost always involves replacing one false theory with another.

  ### The Successor Account: Niiniluoto's Likeness Approach

  To rescue verisimilitude, philosophers like Tichý, Niiniluoto, and Oddie shifted from Popper's "content" approach to a "likeness" (or similarity) approach. I will focus on **Ilkka Niiniluoto's Min-Sum account**, which systematizes Tichý's initial insights.

  The fundamental technical move Niiniluoto employs is to abandon the comparison of consequence classes ($Ct_T$ and $Ct_F$) in favor of a **metric distance over logical space**. Instead of asking "What sentences does this theory entail?", the likeness approach asks "How similar is the world described by this theory to the actual world?"

  Niiniluoto models logical space as being partitioned into a set of mutually exclusive and jointly exhaustive **constituents** (or state descriptions), which represent all possible ways the world could be given a specific conceptual framework. Exactly one constituent, $C^*$, corresponds to the truth. A theory $T$ is treated as a disjunction of these constituents (claiming that the truth is one of this set).

  Niiniluoto defines a distance function $d(C_i, C_j)$ between any two constituents, representing how many "features" or primitive properties differ between them. The truthlikeness of a theory $T$ is then defined as a function of the distances between the constituents allowed by $T$ and the true constituent $C^*$. In his Min-Sum measure, verisimilitude increases as the minimum distance from $T$'s constituents to $C^*$ decreases (getting the "best guess" right) and the sum of distances decreases (avoiding distant possibilities).

  ### Avoiding the Tichý–Miller Fate

  This technical move avoids the Tichý–Miller collapse because it decouples verisimilitude from the subset relations of consequence classes. In Popper's system, a false theory is a blunt instrument: it is simply "not the truth," and its consequences are binary (true or false). In Niiniluoto's system, falsity is graded.

  Consider two false theories, $T_1$ and $T_2$. $T_1$ might claim the world is in state $C_1$, while $T_2$ claims it is in state $C_2$. If the actual truth is $C^*$, and $C_1$ differs from $C^*$ by only one feature while $C_2$ differs by ten, $T_1$ is closer to the truth than $T_2$. This judgment holds even though both $T_1$ and $T_2$ are strictly false (entail false statements) and even if their truth/falsity content sets do not stand in the subset relations Popper required. By defining verisimilitude as a continuous metric of similarity rather than a discrete ordering of consequence sets, Niiniluoto allows for the ranking of false theories without triggering the logical contradiction Tichý identified.

  ### Assessment: Escaping or Trading Problems?

  Does Niiniluoto's account genuinely escape unscathed? While it solves the formal collapse, it trades Popper's problem for one of comparable severity: **language dependence**, often illustrated by David Miller's "Weather Example."

  Niiniluoto's distance metric depends entirely on the choice of primitive predicates used to define the constituents. Miller demonstrated that verisimilitude judgments are not invariant under logically equivalent translations of language. Suppose we describe weather using primitives *Hot* ($h$), *Rainy* ($r$), and *Windy* ($w$). A theory might be "close" to the truth in this vocabulary. However, we can define new primitives, such as *Minnesotan* ($m \equiv r \leftrightarrow w$) and *Arizonan* ($a \equiv r \leftrightarrow \neg w$). In this new, logically equivalent language, the "distance" between constituents changes. A theory that was close in the ($h, r, w$) framework can become distant in the ($h, m, a$) framework, and vice versa.

  This implies that verisimilitude is not an objective relation between a theory and the world, but a relation between a theory, the world, and a specific linguistic framework. For Popper, the problem was that progress was *impossible* (formal collapse). For Niiniluoto, the problem is that progress is *relative* (semantic instability).

  Is this of comparable severity? Yes. Popper's failure was logical: his definition contradicted the phenomenon it sought to describe. Niiniluoto's failure is metaphysical/semantic: his definition makes truthlikeness dependent on human conceptual schemes rather than mind-independent reality. If the goal of verisimilitude is to justify scientific realism—the idea that science converges on an objective reality—then a metric that shifts when we change our vocabulary undermines that realism just as effectively as Tichý's refutation undermined Popper's. It suggests that "closeness to the truth" is not something we can measure independently of how we choose to carve up the world conceptually.

  ### Conclusion

  The Tichý–Miller argument was fatal to Popper's definition because it proved that the set-theoretic relations of truth and falsity content cannot vary independently for false theories, rendering all false theories incomparable. Niiniluoto's likeness account avoids this by shifting the technical basis from consequence classes to distance metrics over logical constituents, allowing false theories to be ranked by their similarity to the truth. However, this solution does not escape unscathed. By making verisimilitude dependent on the choice of primitive predicates, Niiniluoto trades the impossibility of progress for the relativity of progress. While the likeness approach saves the *logic* of verisimilitude, it leaves the *ontology* of scientific progress vulnerable to the charge that "closeness to the truth" is merely a reflection of our linguistic preferences.
