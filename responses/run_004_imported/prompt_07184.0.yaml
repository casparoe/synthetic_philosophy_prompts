      *   *Premise 2:* Ultimate responsibility requires being the *causa sui* (cause of oneself).
      *   *Premise 3:* Being *causa sui* is logically impossible (a self-contradiction, pulling oneself up by the hair).
      *   *Conclusion 1:* Therefore, metaphysical free will/ultimate responsibility is nonsense.
