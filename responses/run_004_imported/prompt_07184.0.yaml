answer: |-
  This is a fantastic rabbit hole to be down. You have identified one of the most potent connections in the history of philosophy: the link between Nietzsche's genealogical critique of morality and Galen Strawson's formal "Basic Argument."

  You are right to sense that while they share a core intuition, their projects diverge significantly at the end. Nietzsche is diagnosing a psychological sickness; Strawson is proving a metaphysical impossibility.

  Here is the unpacking of the logical structure, the comparison with Strawson, and an evaluation of whether the argument actually sticks.

  ### 1. Unpacking Nietzsche's Argument (BGE 21)

  Nietzsche's prose is polemical, but the logical skeleton underneath is surprisingly rigid. He is attacking the *motivation* for believing in free will as much as the concept itself.

  **The Logical Reconstruction:**
  1.  **Definition:** The popular concept of "freedom of the will" (in the metaphysical sense) is defined as the capacity to bear **ultimate responsibility** for one's actions.
  2.  **Condition:** To bear ultimate responsibility for an action ($A$), you must be the **ultimate cause** of the self ($S$) that performed $A$. (If your self was caused by God, genetics, or society, they share the responsibility).
  3.  **Requirement:** To be the ultimate cause of your self ($S$), you must have created yourself (*causa sui*).
  4.  **Impossibility:** *Causa sui* is a logical contradiction. To cause something, you must exist prior to it. To cause yourself, you must exist prior to your own existence. This is "pulling oneself up by the hair."
  5.  **Conclusion:** Therefore, the desire for metaphysical free will is a desire for something logically impossible.
  6.  **Diagnosis:** Why do people want this impossible thing? Out of "extravagant pride." They want to isolate themselves as the sole authors of their lives to claim exclusive credit or blame, absolving the rest of the universe.

  **The Pivot ("Strong and Weak Wills"):**
  Nietzsche then pivots. If *moral responsibility* (based on *causa sui*) is nonsense, what is left? He suggests a naturalistic description: **wills are simply strong or weak.**
  *   This moves the discussion from *ethics* (desert, blame, praise) to *aesthetics/physiology* (power, capacity, health).
  *   A "strong will" isn't "morally good"; it is like a strong storm or a strong tiger. It is a fact of nature, not a moral achievement.

  ### 2. Galen Strawson's "Basic Argument"

  Galen Strawson's argument (first fully articulated in 1986, though the roots are older) is essentially a formalization of Nietzsche's steps 2 through 5, stripped of the psychological diagnosis.

  **The Regress Structure:**
  1.  To be morally responsible for what you do, you must be responsible for the way you are (at least in certain mental respects).
  2.  To be responsible for the way you are, you must have chosen to be that way.
  3.  But to choose to be that way, you must have had a prior nature/principles of choice ($N_1$).
  4.  To be responsible for $N_1$, you must have chosen it based on a prior nature ($N_2$).
  5.  This leads to an infinite regress.
  6.  You cannot complete an infinite regress of self-creations.
  7.  Therefore, you cannot be ultimately morally responsible.

  **The Alignment:**
  *   **Nietzsche:** "You want to be *causa sui*? That's nonsense."
  *   **Strawson:** "You want to be *causa sui*? That requires an infinite regress of self-creation, which is impossible."
  *   **Shared Target:** Both are targeting **Ultimate Responsibility (UR)**. They agree that if responsibility requires you to be the *unmoved mover* of your own character, it is impossible.

  ### 3. The Divergence: "Strong and Weak Wills" vs. Moral Pessimism

  This is where your intuition is spot on. Nietzsche and Strawson part ways on what to do *after* the argument lands.

  **Strawson's Project (Analytic/Metaphysical):**
  Strawson is a **pessimist**. He believes the concept of moral responsibility (in the "desert" sense, where you truly *deserve* praise or blame) is incoherent. However, he acknowledges humans will never stop feeling it. He isn't trying to replace morality; he is trying to show that the foundational justification for it is missing. He leaves us with a kind of metaphysical guilt: we know we aren't responsible, but we can't stop acting as if we are.

  **Nietzsche's Project (Genealogical/Transformative):**
  Nietzsche is a **transformer**. When he says, "in real life it is only a question of strong and weak wills," he is proposing we **abandon the framework of responsibility entirely.**
  *   He thinks the *desire* for responsibility is a symptom of "slave morality" or religious hangover (the need for a judge, a punishment, and a reward).
  *   By shifting to "strong/weak," he replaces **Accountability** with **Capacity**.
  *   If a "strong will" commits a violent act, Nietzsche doesn't ask, "Could they have done otherwise?" (Responsibility). He asks, "Is this expression of power life-affirming or decadent?" (Value).
  *   **Key Difference:** Strawson says, "You can't be responsible." Nietzsche says, "Responsibility is a fiction invented by the weak to shackle the strong; stop talking about guilt and start talking about health."

  ### 4. Does the Argument Hold Up? (The Evaluation)

  Is this a knockdown case against free will? It depends on what you mean by "free will."

  **Where it is Knockdown:**
  Against **Libertarian Free Will** that requires *Ultimate Responsibility*. If your definition of free will requires that you are the *absolute, uncaused cause* of your own nature, Nietzsche and Strawson are correct: that is logically impossible. No coherent model of physics or logic allows an effect to precede its cause.

  **Where it is Contested (The Compatibilist Move):**
  Most contemporary philosophers (Compatibilists like Daniel Dennett, Harry Frankfurt, or indeed Galen's father, P.F. Strawson) argue that the regress argument attacks a **straw man** of responsibility.
  *   **P.F. Strawson's "Freedom and Resentment":** He argued that moral responsibility isn't about metaphysical *causa sui*; it's about our participation in human social practices (reactive attitudes like resentment, gratitude, forgiveness). As long as you are responsive to reasons and social norms, you are responsible. You don't need to have created yourself.
  *   **The Counter-Argument:** The Compatibilist says Nietzsche and Galen Strawson set the bar for responsibility impossibly high. We don't need to be *God* to be responsible; we just need to be *agents*.
  *   **Nietzsche's Retort:** Nietzsche would likely sneer at Compatibilism. He would say Compatibilists are still clinging to the "pride" mentioned in BGE 21. They are trying to save the *feeling* of blame and credit by watering down the definition. He wants to excise the feeling entirely.

  **The Weak Spot in the Regress:**
  The only logical escape from the Basic Argument is **Agent Causation**. This is the theory that agents (substances) can cause events without being determined by prior events.
  *   *The Problem:* Most philosophers find Agent Causation mystical or incoherent (it sounds like magic).
  *   *The Nietzschean View:* Nietzsche would reject Agent Causation too, because it still relies on the "subject" as a stable entity, which he famously deconstructs ("there is no 'being' behind doing").

  ### Summary

  You have correctly identified that Strawson borrowed Nietzsche's "best line" (the impossibility of *causa sui*) but put it to a different use.

  1.  **Nietzsche** uses the impossibility of *causa sui* to diagnose the **psychology of morality**. He thinks wanting to be responsible is a sign of sickness/pride. His solution is to replace morality with a typology of strength.
  2.  **Galen Strawson** uses the impossibility of *causa sui* to prove the **metaphysics of responsibility** is incoherent. His solution is... well, there isn't one, other than intellectual honesty.
  3.  **The Verdict:** The argument is a knockdown against *Ultimate* Responsibility. It is not a knockdown against *Compatibilist* Responsibility (responsibility as responsiveness to reasons). However, Nietzsche would argue that Compatibilist Responsibility is just a secularized version of the same religious guilt he's trying to dismantle.

  If you are coming from LessWrong, you might appreciate that Nietzsche is essentially arguing for **Eliminativism** regarding moral responsibility, whereas Strawson is arguing for **Error Theory**. Nietzsche wants to delete the variable; Strawson wants to prove the variable returns `Null`.
