  3.  **Deconstruct Strawson's "Basic Argument":**
      *   *Premise 1:* To be morally responsible for what you do, you must be responsible for the way you are (at least in certain mental respects).
      *   *Premise 2:* To be responsible for the way you are, you must have chosen to be that way.
      *   *Premise 3:* To choose to be that way, you must have had a prior nature/principles of choice.
      *   *Premise 4:* To be responsible for *that* prior nature, you must have chosen it...
      *   *Conclusion:* This leads to an infinite regress. Since you can't complete the regress (you can't be causa sui), you can't be ultimately morally responsible.

  4.  **Compare Nietzsche and Strawson:**
      *   *Similarities:* Both target *ultimate* responsibility. Both rely on the impossibility of *causa sui*. Both agree that determinism/chance isn't the only problem; even indeterminism doesn't help if you need to be the *source* of yourself.
      *   *Differences:*
          *   *Tone/Style:* Nietzsche is polemical, psychological, genealogical (why do people *want* this?). Strawson is analytic, logical, formal.
