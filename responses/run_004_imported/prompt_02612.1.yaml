  I spent thirty-odd years as a chemist before I retired, and these days I fill the hours reading decision theory of all things (my wife thinks I've lost it). An old colleague from my lab days pointed me at a puzzle called "Death in Damascus" a few weeks back -- apparently a decision-theoretic reworking of that old fable about the servant who flees to Samarra only to discover Death was expecting him there all along. The version thats been rattling around in my head goes: you're in Damascus and you know you have an appointment with Death tonight; you can stay put or flee to Aleppo, but Death is such a good predictor of where you'll be that whichever city you pick, that's exactly where he'll be waiting. The apparent kicker is that the very fact you've settled on a plan is itself evidence Death predicted that plan, so you always end up wishing, on reflection, that you'd picked the other city. A forum post I stumbled on called this a situation where "no option is ratifiable" and said it's a much bigger headache for causal decision theory than Newcomb's problem is, with the only way out apparently being to flip a coin -- which sounds like cheating to me, but what do I know.

  Could you write me an essay that actually works through this properly? I'd like it to explain why this case is supposed to be special trouble for causal decision theory specifically (rather than just being Newcomb's problem again), what this "ratifiability" business really amounts to, and whether the coin-flip move genuinely dissolves the problem or just smuggles it in through the back door. Please dont leave it sitting on the fence with "both sides have a point" -- I want an actual verdict, standing there in Damascus, on what the rational thing to do is, argued for the way you'd defend a thesis, not a shopping list of positions.
