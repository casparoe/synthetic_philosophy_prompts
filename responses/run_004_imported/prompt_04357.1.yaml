      *   *Caution:* The prompt asks me not to "split the difference." I need to be decisive. I will argue that the "irrelevance" thesis (Advisor's view) is intellectually unsustainable given the evidence about "sharp boundaries."
      *   *Key Insight:* The ancestral makes a relation *closed*. Racial ideology wants heritage to be *closed*. This is a structural isomorphism. That makes D'Arcy's claim plausible.
