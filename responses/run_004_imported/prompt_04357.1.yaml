      *   *D'Arcy's View:* Frege explicitly linked the logical structure of heredity/descent (ancestral) to political heredity. He worried about the *sharpness* of the concept "Jew" because vague concepts violate the law of excluded middle, which is crucial for his logic. Therefore, his political desire for exclusion drove a logical concern for precision, or vice versa.
      *   *Evidence Check:* Frege's *Diary* (1924) is the primary source. He writes about voting rights, property, and "Aryan descent." Does he explicitly cite *Begriffsschrift* §29-31? No, not in those terms. He uses natural language about "descent" (*Abstammung*). D'Arcy interprets this as an application of the ancestral.
      *   *Critique:* Is it the *apparatus* or just the *concept*? Everyone uses "descent." Frege formalized it. If Frege says "only those of Aryan descent," he is using a natural language concept that *can* be formalized by the ancestral. Does that mean the ancestral *itself* is tainted?
      *   *Nuance:* The stronger claim is about the *sharp boundaries*. Frege insisted concepts must be sharply defined (no gaps). He lamented that "Jew" wasn't sharply defined legally. This links his logical requirement (precision) to his political goal (exclusion). This is a stronger link than just using the word "descent."
