answer: |-
  This is an excellent question, and it cuts to the heart of why the post-1997 literature on dispositions became so crowded so quickly. You have read Lewis carefully, and your reconstruction of his Revised Conditional Analysis (RCA) is accurate. However, your inference that RCA successfully handles masking cases rests on a specific verdict about those cases that the majority of the literature explicitly rejects.

  To put it bluntly: You are assuming that the correct verdict for the wrapped fragile glass is that it is *not* disposed to break (while wrapped). The literature (Bird, Fara, Choi, etc.) assumes the correct verdict is that it *is* disposed to break (while wrapped).

  Here is the structural asymmetry you are looking for, followed by how you might position this in your dissertation.

  ### 1. The Divergence in Intuitions (The Core Issue)

  Your argument hinges on this claim:
  > *"Lewis's analysis should deliver the verdict that the glass, while wrapped, is not disposed to break, in just the way it correctly denies that a dead wire wired to an electro-fink is disposed to conduct."*

  This is where the asymmetry lies.

  *   **Finkish Cases:** The standard intuition is that the object **lacks** the disposition. The electro-fink wire is dead; it does not have the disposition to conduct, even if the fink makes it act like it does (or vice versa). Lewis's RCA delivers the verdict "No disposition." **Analysis matches Intuition.**
  *   **Masking Cases:** The standard intuition (defended vigorously by Alexander Bird) is that the object **retains** the disposition. The glass is fragile in virtue of its intrinsic microstructure ($B$). The packing is extrinsic. Wrapping the glass does not change its microstructure. Therefore, the glass remains fragile even while wrapped. Lewis's RCA, however, requires that $C$ and $B$ *causally suffice* for $M$. In the masked scenario, $C$ and $B$ do *not* suffice (because the packing intercepts the causal chain). Thus, the counterfactual is false. RCA delivers the verdict "No disposition." **Analysis clashes with Intuition.**

  If you defend the view that the wrapped glass is *not* disposed to break, you are effectively arguing for an **extrinsic** view of dispositions (or at least, that disposition ascriptions are sensitive to extrinsic interferers). While this is a defensible minority position (often associated with contextualist accounts of dispositions, e.g., Gundersen 2002 or some readings of Fara), it places you at odds with the "Intrinsicality Thesis" that dominates the metaphysics of dispositions literature (Bird 1998, Molnar 2003, Williams 2000).

  ### 2. Why the "Causal Sufficiency" Clause Fails for Masks

  You noted:
  > *"Since Lewis's revised analysis already demands that C and B actually, causally suffice for M together... this same clause looks to me like it should dispose of masking."*

  It does "dispose" of masking only if your goal is to deny the disposition exists. But for most metaphysicians, the *problem* of masking is precisely that we want to affirm the disposition exists *despite* the failure of causal sufficiency in the actual (or counterfactual) scenario.

  Lewis's requirement that $C$ and $B$ **cause** $M$ is too strong for masking cases. In a masking case, $B$ is present, $C$ occurs, but $M$ does not occur because an extrinsic factor $A$ (the mask) intervenes.
  *   **Lewis's RCA:** Is it true that if $C$ and $B$, then $M$? **No.** (Because $A$ prevents it).
  *   **Conclusion:** $x$ is not disposed.
  *   **Objection:** But $x$ *is* disposed! The disposition is intrinsic; the mask is extrinsic. The truth of "x is disposed" should not depend on the absence of $A$.

  Bird's (1998) "Dispositions and Antidotes" is the canonical source here. He argues that because masks are extrinsic, a conditional analysis that makes disposition-ascriptions sensitive to masks violates the intrinsicality of dispositions. Lewis's "retention of $B$" clause handles the *intrinsic* basis, but it does not screen off *extrinsic* interferers in the counterfactual evaluation.

  ### 3. The Structural Asymmetry

  To answer your specific question about structural asymmetry:

  *   **Finks** operate on the **Basis ($B$)**. The stimulus causes the loss of $B$. Lewis's fix ("retain $B$") directly targets this by holding $B$ fixed in the counterfactual antecedent.
  *   **Masks** operate on the **Causal Process ($C + B \rightarrow M$)**. The basis $B$ is retained, but the link to $M$ is severed. Lewis's fix requires the link to hold ("$C$ and $B$ would cause $M$"). Because the link does not hold in the presence of the mask, the analysis fails to attribute the disposition.

  The asymmetry is that Lewis's fix for finks (holding $B$ fixed) successfully isolates the disposition from the finkish interference, but his requirement for causal sufficiency ($C+B \rightarrow M$) fails to isolate the disposition from masking interference. To fix masking, you would need a clause that holds fixed the *absence of masks*, but Lewis's 1997 analysis does not explicitly include a "no interferers" ceteris paribus clause.

  ### 4. Advice for the Dissertation

  You are in a good position, but you need to pivot your claim slightly to engage with the literature accurately.

  **Do not claim:** "Lewis's 1997 analysis solves masking, and the field hasn't caught up."
  **Do claim:** "Lewis's 1997 analysis *could* solve masking, but only if we reject the Intrinsicality Thesis regarding dispositions."

  Here are three ways to frame this in your chapter:

  1.  **The Intrinsicality Challenge:** Acknowledge that Lewis's RCA yields the "not disposed" verdict for masks. Argue that the literature (Bird, Choi) rejects this because they prioritize intrinsicality. Then, you can argue *against* Bird: perhaps dispositions *aren't* strictly intrinsic, or perhaps "fragile" is context-sensitive. If you can defend the view that the wrapped glass is *not* fragile (in the dispositional sense), you have a novel defense of Lewis against the standard objection.
  2.  **The Causal Sufficiency Problem:** Argue that the requirement for "causal sufficiency" is the culprit. You might suggest that dispositions require only that $B$ contributes causally, not that it suffices. This leads toward **causal contribution accounts** (like Handfield 2008) rather than strict conditional analyses.
  3.  **The "No-Interferers" Clause:** Argue that Lewis *intended* the analysis to include a tacit *ceteris paribus* clause (normal conditions), and that if we make this explicit, masking is solved. However, you must then address the "Problem of the Perfectly Normal World" (if we specify normal conditions too tightly, the analysis becomes trivial; too loosely, masks get in). This is the route Fara (2008) explores with his habitual account.

  ### Key References to Engage
  *   **Bird, Alexander (1998).** "Dispositions and Antidotes." *Philosophical Quarterly*. (The primary source for the masking objection to RCA).
  *   **Choi, Sungho (2008).** "Dispositional Properties and Counterfactual Conditionals." *Mind*. (Detailed technical breakdown of why RCA fails for masks).
  *   **Fara, Michael (2008).** "Masked Dispositions." *Philosophical Topics*. (Argues that masking shows the need for a habitual account, not a conditional one).
  *   **Handfield, Toby (2008).** "Unfinkable Dispositions." *Synthese*. (Discusses the causal process issues).

  ### Summary
  Your logic is internally consistent, but it conflicts with the prevailing metaphysical intuition that dispositions are intrinsic properties. The field hasn't "missed" your point; they have rejected the verdict your point entails. If you want to defend Lewis, your job is to convince us that the wrapped glass really *isn't* disposed to break (or that "disposed" is context-sensitive). If you want to critique Lewis, your job is to show why the intrinsicality intuition trumps the causal sufficiency clause.

  This is a fertile spot for a dissertation chapter. Just ensure you characterize the opposition correctly: they don't think Lewis's analysis *fails to generate a verdict*; they think it generates the *wrong verdict*.
