      *   *Premise 2 (The State of Astronomy):* In 1615, Copernicanism was empirically equivalent to Tychonic geoheliocentrism regarding the key observations (Venus, Jupiter).
      *   *Premise 3 (The Nature of Hypothesis):* Saving the phenomena (fitting the data) is not the same as demonstrating physical reality.
      *   *Conclusion:* Therefore, Galileo failed to meet his own burden of proof. Bellarmine was upholding Galileo's own standard by demanding actual proof before upending theology.

  5.  **Drafting the Argument - Section by Section:**

      *   *Introduction:* State the thesis clearly. Bellarmine wasn't anti-science; he was enforcing the epistemological rigor Galileo himself claimed to value.
      *   *Point 1: The Augustine Condition.* Define Galileo's rule. It hinges on *demonstration* (apodeixis), not probability.
      *   *Point 2: The Empirical Equivalence.* Explain why Venus and Jupiter don't prove Earth moves. They only prove planets move around the Sun. Tychonic system accounts for this without moving Earth.
      *   *Point 3: The Missing Parallax.* This is the smoking gun. If Earth moves, stars should shift. They didn't (to 17th-century instruments). Galileo had no answer for this other than "stars are too far," which was an assumption, not a proof.
      *   *Point 4: The Tides Blunder.* Mention that Galileo's attempt to provide the missing physical proof (tides) was wrong. This reinforces that he didn't have the proof in 1615 either.
      *   *Point 5: Bellarmine's Consistency.* Show how Bellarmine explicitly says, "If you prove it, we reinterpret." He is applying Galileo's rule consistently. Galileo is trying to skip the "proof" step.
      *   *Conclusion:* Reiterate that Bellarmine was the guardian of the logical standard Galileo proposed.

  6.  **Refining the Tone:**
