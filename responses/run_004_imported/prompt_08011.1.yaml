      *   **Constraint:** Do not "weigh both sides." Take a stance supporting Bellarmine's caution based on Galileo's own epistemological standard.

  2.  **Deconstruct Galileo's Rule (The Augustine Principle):**
      *   Galileo argues in the *Letter to the Grand Duchess Christina* that if a scientific truth is *demonstrated* (proven with necessity), and it contradicts a literal reading of Scripture, then Scripture must be interpreted metaphorically/allegorically in that instance.
      *   *Key Condition:* The scientific truth must be *demonstrated* (necessarily true), not just probable or empirically adequate.
      *   *Rationale:* God is the author of both Nature and Scripture; they cannot contradict. If they seem to, our understanding of one is wrong. Since sensory experience is certain, a demonstrated truth from nature trumps a literal reading.

  3.  **Analyze the State of Evidence in 1615:**
