  8.  **Final Polish:** (Reviewing against the prompt's request for "strongest case you can that Bellarmine was actually the more careful and consistent one".)
      *   Make sure to highlight that Bellarmine *agreed* with the hermeneutic principle, just not the application of it at that specific time. This is the crux of the "consistency" argument.

  9.  *(Final thought)*: The prompt asks to use *Galileo's own rule*. I need to quote or paraphrase the *Letter to Christina* logic and turn it back on Galileo's 1615 position.

