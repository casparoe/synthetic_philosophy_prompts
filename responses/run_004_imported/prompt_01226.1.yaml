prompt: |-
  Something's been bugging me and I can't tell if I'm being irrational about it. I've got two job offers: Job A is boring big-co, $175k guaranteed, and Job B is an early-stage startup, $130k base plus equity that (by the founders own numbers) has maybe a 7% shot of being worth ~$4M and otherwise nothing. Expected value clearly favors B, and my friend, whos big into rationalist blogs, says turning it down is just scope-insensitive bias, since the gap between 130k and 175k isn't nearly enough to justify skipping the higher-EV option.

  But when I imagine the exact same choice scaled way down, like a guaranteed $1,750 vs a 7% shot at $40k, I get the exact same pull toward the safe option, even though at that scale neither outcome would change my life at all. So it's clearly not about the money's marginal value to me, it feels more like I just don't like that shape of bet, period. Is my friend right that this is just a bias I should correct, or could there be an actual principled reason to weigh a gamble differently than its expected value, separate from how much you value the outcomes themselves?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Dilemma:**
      *   **Option A:** Big Co, $175k guaranteed.
      *   **Option B:** Startup, $130k base + Equity (7% chance of $4M, 93% chance of $0).
      *   **Friend's Argument:** Expected Value (EV) favors B. Choosing A is "scope-insensitive bias." The gap in base salary ($45k) isn't enough to skip the high-EV gamble.
      *   **User's Intuition:** Even when scaled down ($1,750 vs. 7% of $40k), they still prefer the safe option. This suggests it's not about marginal utility of money (life-changing vs. not), but about the *structure* of the bet itself.
      *   **Core Question:** Is this just a bias to correct, or is there a principled reason to weigh a gamble differently than its EV, independent of outcome utility?

  2.  **Evaluate the Math (Expected Value):**
      *   **Job A:** $175k.
      *   **Job B:** $130k + (0.07 * $4,000,000) = $130k + $280k = $410k.
      *   **EV Difference:** $410k - $175k = $235k in favor of Job B.
      *   *Initial thought:* Mathematically, the friend is right about EV. $410k > $175k.
      *   *Correction/Nuance:* Wait, equity vesting and dilution usually happen over time. Is the $4M exit value today or in 4 years? Let's assume the user simplified for the sake of the argument. Even so, the EV gap is huge.
      *   *Base Salary Gap:* $45k less per year. That's significant for cash flow, but not catastrophic.

  3.  **Evaluate the "Bias" Claim:**
      *   The friend calls it "scope-insensitive bias." This usually refers to caring less about large numbers than small ones proportionally.
      *   The user notes the preference holds even at small scales ($1,750 vs 7% of $40k).
      *   *Small Scale EV:*
          *   Safe: $1,750.
          *   Gamble: 0.07 * $40,000 = $2,800.
          *   EV Gap: $1,050.
      *   If the user still picks the safe $1,750 over the EV of $2,800, they are displaying **Risk Aversion**.
      *   Is Risk Aversion a bias? In standard Expected Utility Theory (EUT), no. It's a feature of the utility function (concave utility of wealth).
      *   However, the user says it's *not* about marginal value ("neither outcome would change my life at all"). This points towards something deeper than standard risk aversion based on diminishing marginal utility.

  4.  **Identify Principled Reasons to Reject High-EV Gambles:**
      *   **Ergodicity Economics:** This is the big one. Time average vs. Ensemble average. You only live one life. You can't repeat the bet 100 times. If you go bust (or in this case, take a pay cut and get zero equity), you can't recover easily.
      *   **Ruins/absorbing barriers:** Does losing this bet ruin you? $130k vs $175k isn't ruinous, but it reduces savings rate.
      *   **Option Value/Real Options:** Taking Job A keeps options open. Job B might lock you in (vesting schedules, golden handcuffs, specialized skills).
      *   **Psychological Cost:** Stress of uncertainty.
      *   **Information Asymmetry:** Founders' numbers (7% chance) are likely optimistic.
      *   **Liquidity:** Equity is illiquid. Salary is liquid.
      *   **Career Capital:** Big Co brand vs. Startup grind.

  5.  **Address the "Shape of the Bet":**
      *   The user dislikes the *distribution*, not just the mean.
      *   This is **Skewness** and **Kurtosis**.
      *   Job B is highly negatively skewed for cash flow (lower base) and highly positively skewed for upside (lottery ticket).
      *   Humans are loss-averse (Prospect Theory). Losing $45k/year feels worse than gaining potential equity feels good, especially since the equity is uncertain.

  6.  **Synthesize the Argument:**
      *   **Validate the User:** You are not irrational. Your friend is applying a narrow definition of rationality (Maximize EV) that ignores context.
      *   **The "One-Shot" Problem:** Explain Ergodicity. EV works for casinos (many bets), not careers (few bets).
      *   **Utility is not Linear:** Even if $40k doesn't change your life, certainty has value. Peace of mind is a utility.
      *   **The Founder's Numbers:** 7% is a guess. Usually, early-stage equity is worth $0. The EV is likely overstated.
      *   **Career Trajectory:** Job A (Big Co) often leads to higher future salaries. Job B (Startup) is binary.
      *   **Liquidity & Control:** You can spend salary. You can't spend equity until a liquidation event (which might never happen).

  7.  **Drafting the Response (Iterative refinement):**
      *   *Intro:* Acknowledge the tension. Friend isn't *wrong* about math, but *wrong* about decision theory in real life.
      *   *Point 1: Ergodicity.* This is the strongest theoretical counter to "Maximize EV." You can't average out career choices.
      *   *Point 2: Utility of Certainty.* It's not just money; it's planning ability.
      *   *Point 3: The "Founders' Numbers" Trap.* 7% is likely marketing. Real probability is lower.
      *   *Point 4: Career Capital.* Big Co name recognition has long-term value.
      *   *Point 5: Addressing the Scaled-Down Example.* Why did you still pick safe? Because risk aversion is a valid preference, not a bug.
      *   *Conclusion:* It's not a bias. It's a feature of navigating a non-ergodic world.

  8.  **Refining the "Scaled Down" point:**
      *   User said: "neither outcome would change my life at all."
      *   If utility is linear there, why pick safe?
      *   Maybe it's **Regret Minimization**. If I take the gamble and lose, I feel stupid. If I take safe and miss out, I feel neutral (status quo).
      *   Maybe it's **Cognitive Load**. Managing uncertainty costs energy.
      *   Actually, the most principled reason is **Kelly Criterion** logic (don't overbet even on positive EV if it risks ruin or significant setback), though this isn't "ruin."
      *   Better angle: **Risk Premium.** The price of taking risk must be paid. Is $45k enough premium for the risk? Maybe not.

  9.  **Final Polish:**
      *   Ensure tone is empathetic but analytical.
      *   Avoid jargon where possible, or explain it (Ergodicity).
      *   Make sure to explicitly answer: "Is my friend right... or could there be an actual principled reason?" -> There are principled reasons.

  10. **Self-Correction during drafting:** I need to be careful not to just say "Startups are risky." The user knows that. The user wants to know if *preferring certainty despite EV* is irrational. I need to focus on Decision Theory, not just job advice.
      *   *Key distinction:* Expected Value vs. Expected Utility.
      *   *Key distinction:* Ensemble Average vs. Time Average.

  11. **Final Structure:**
      *   Direct Answer: You are not irrational.
      *   Concept 1: Ergodicity (The most "principled" mathematical reason).
      *   Concept 2: Expected Utility vs. Expected Value (Risk aversion is rational).
      *   Concept 3: Information Asymmetry (The 7% is suspect).
      *   Concept 4: Optionality & Career Path.
      *   Addressing the Scaled-Down Intuition.
      *   Verdict.

  (Proceed to generate response based on these points.)
answer: |-
  Your friend is applying a specific, narrow definition of rationality (maximizing Expected Value in a vacuum) that fails when applied to real-world, non-repeatable life decisions. You are not being irrational, and there are several principled, mathematical, and economic reasons to weigh a gamble differently than its raw Expected Value (EV).

  Here is why your intuition is sound and why your friend's "bias" accusation is misplaced.

  ### 1. The Ergodicity Problem (The Strongest Argument)
  This is the most rigorous mathematical counter-argument to your friend's position. It comes from statistical physics and has been applied to economics by thinkers like Ole Peters.

  *   **Ensemble Average (EV):** This is what your friend is calculating. If 100 people took Job B, the *average* wealth of the group would be huge.
  *   **Time Average:** This is your reality. You are one person living through time. You cannot take Job B 100 times and average the results. You take it once.

  In **non-ergodic systems** (like a career), the time average does not equal the ensemble average. If you take the gamble and land in the 93% "zero equity" outcome, you cannot reset and try again to capture the average. You are stuck with the path you took. Maximizing EV is only rational if you can repeat the bet enough times for the law of large numbers to smooth out the variance. Since you can't repeat your career 100 times, prioritizing the path with the higher *geometric* growth rate (often the safer one) over the *arithmetic* mean (EV) is mathematically sound.

  ### 2. Expected Utility vs. Expected Value
  Standard decision theory distinguishes between Value (dollars) and Utility (how much those dollars improve your life).

  Even if you say the money "wouldn't change your life," **certainty itself has utility.**
  *   **Planning Utility:** A guaranteed $175k allows you to get a mortgage, plan investments, and support dependents with high confidence. A $130k base with volatile equity makes you "unbankable" for certain loans and increases the cognitive load of financial planning.
  *   **Stress Cost:** The psychological toll of wondering "will this equity ever vest?" or "is the company going to run out of cash?" is a real cost. If the stress of the gamble reduces your quality of life, it subtracts from the utility of the payout.

  Your friend is assuming a **linear utility function** (where $2 is exactly twice as good as $1). Most humans have a **concave utility function** for wealth. We value the first $100k (security) much more than the millionth $100k (luxury). Even at higher income levels, the utility of *stability* often outweighs the utility of *potential upside*.

  ### 3. Information Asymmetry and "Founder Math"
  You noted the 7% chance is "by the founders' own numbers." In the startup world, this is a massive red flag for EV calculations.

  *   **Optimism Bias:** Founders are incentivized to overstate probability of success to recruit talent.
  *   **Survivorship Bias:** The 7% figure likely ignores the dilution from future funding rounds. If the company raises Series A, B, and C, your slice of that $4M exit shrinks significantly.
  *   **The "Zero" Floor:** In early-stage startups, the probability of equity being worth *exactly* zero is often much higher than 93%.

  If the real probability is 3%, not 7%, the EV of Job B drops from $410k to $250k. The gap narrows significantly, making the $45k guaranteed salary premium much more attractive. Trusting the "guaranteed" number over the "modeled" number is a principled stance on data reliability.

  ### 4. Career Capital and Optionality
  A job is not just a cash flow stream; it is an investment in your future earning power (Career Capital).

  *   **Job A (Big Co):** Provides brand signaling. Having a recognizable company on your resume often acts as a "passport" for higher salaries in the future. It keeps your optionality open.
  *   **Job B (Startup):** If the startup fails (93% chance), you may end up with a brand no one knows and skills that were too specialized to the startup's specific stack.

  If Job A leads to a $200k job in two years, and Job B (if it fails) leads to a $140k job because the brand carries less weight, the long-term EV of Job A is actually higher. Your friend is calculating the EV of *this year*, not the EV of your *career trajectory*.

  ### 5. Why Your Scaled-Down Intuition Holds
  You mentioned that even at a small scale ($1,750 vs 7% of $40k), you prefer the safe option. You worried this proves it's a bias. It doesn't.

  This demonstrates **Risk Aversion**, which is a valid preference parameter, not a cognitive error.
  *   In the small scale example: EV of gamble is $2,800. Safe is $1,750.
  *   You are willing to pay a **risk premium** of $1,050 to avoid the uncertainty.

  In finance, this is standard. A risk-free Treasury bond yields less than a risky corporate bond. The difference is the "risk premium." You are simply saying that the $45k salary difference (plus the equity lottery ticket) does not offer a high enough risk premium to compensate you for the volatility and the lower base cash flow.

  ### The Verdict
  Your friend is confusing **rationality** with **risk-neutrality**.
  *   **Risk-Neutral:** Indifferent between a guaranteed $100 and a 50% chance at $200. (This is your friend).
  *   **Risk-Averse:** Prefers the guaranteed $100. (This is you).

  Risk aversion is not a bug in human reasoning; it is a feature that allows organisms to survive in volatile environments. Turning down a high-EV gamble because you value stability, liquidity, and career optionality is a **principled decision.**

  **Recommendation:**
  Don't let the "rationalist" label bully you into a decision that makes you anxious.
  1.  **Acknowledge the EV:** Yes, Job B has higher mathematical EV *if* the founder's numbers are true.
  2.  **Apply the Discount:** Discount the equity probability for dilution and founder optimism.
  3.  **Value the Optionality:** Quantify how much the Big Co brand is worth to your *next* job.
  4.  **Trust Your Utility:** If the "shape of the bet" causes you stress, that is a real cost.

  You are not being irrational. You are pricing risk appropriately for a one-shot game.
