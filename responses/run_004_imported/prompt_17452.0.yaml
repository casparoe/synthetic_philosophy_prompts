answer: |-
  Here are ten interview questions designed to bridge the gap between predictive processing neuroscience and philosophical disjunctivism, including the three specific constraints you requested. Each includes a follow-up targeting the most standard disjunctivist defense.

  ### 1. The Illusion Constraint (Common Factor)
  **Question:** Let's start with the classic cases you reject: the stick looking bent in water or the Müller-Lyer arrows. From a neuroscience perspective, the visual cortex processes these inputs using the exact same mechanisms as veridical sight; the "error" only happens at the level of interpretation. If the causal chain and the neural processing are identical up to the point of conscious report, aren't you forced to admit a "common factor" in the *process*, even if you deny it in the *outcome*?

  **Follow-up:** You'll likely say that metaphysical nature isn't determined by causal process. But if the brain is doing the exact same work to generate the appearance in both cases, doesn't that make the "direct contact" in the veridical case causally redundant? Why posit a special relation to the object if the brain's machinery is already sufficient to produce the scene?

  ### 2. The Hallucination Constraint (No Object)
  **Question:** In cases of total hallucination, there is literally no external object to be in contact with. You argue this is a fundamentally different kind of mental state than seeing. But if the subject cannot tell the difference, what work is the phrase "direct contact" doing? If I'm hallucinating a dagger, I'm not in contact with a dagger, but I'm also not in contact with "nothing" in a way that feels different from seeing a real dagger. What is the positive character of that state if not a representation?

  **Follow-up:** I anticipate you'll say the state is defined by the *absence* of the object relation. But if the phenomenology (what it feels like) is identical, and the neural correlate is identical, defining the state purely by what it *lacks* seems to make the veridical experience the only real one. Does that mean the hallucinating subject is effectively unconscious of their own experience?

  ### 3. The Neural Stimulation Constraint (Physical Substrate)
  **Question:** We can trigger specific visual experiences by stimulating the same patch of visual cortex, whether there is an object out there or not. If I stimulate your V1 to produce a flash of light, the physical realization of that experience is identical regardless of the external world. If the physical substrate of the mind is identical, how can the mental kind be fundamentally different?

  **Follow-up:** Your standard move here is to claim neural states aren't mental states. But if the neural state is sufficient to produce the reportable experience without the object, doesn't that prove the object is a causal trigger, not a constituent of the experience? Why shouldn't we view the object as just the *cause* of the perception, rather than *part* of it?

  ### 4. Predictive Processing vs. Direct Contact
  **Question:** My audience is used to the "brain as a prediction machine" model, where perception is essentially controlled hallucination constrained by sensory data. Disjunctivism claims that when perception works, there is no inference or construction. But we know there is a temporal delay in processing; the brain is always living in the past. How can you have "direct contact" with a present object when your neural access to it is always hundreds of milliseconds old and heavily processed?

  **Follow-up:** If you argue that "direct" doesn't mean "instantaneous," but rather "unmediated by representation," you run into the problem of perceptual constancy (e.g., seeing a coin as round despite retinal ovalness). That requires computation. If computation is required to stabilize the object, how is that not a form of inference that breaks the "direct" link?

  ### 5. Indistinguishability and Epistemology
  **Question:** Disjunctivism relies heavily on the idea that veridical and hallucinatory states are metaphysically distinct, even if epistemically indistinguishable. But for a scientist, if two states are indistinguishable to the subject and indistinguishable by our instruments, positing a metaphysical difference looks like a ghost in the machine. What empirical evidence could possibly falsify disjunctivism?

  **Follow-up:** If you say it's a conceptual claim, not an empirical one, then it risks being irrelevant to the science of how we actually see. If a theory of perception doesn't constrain or predict neural activity, is it a theory of perception, or just a theory of language?

  ### 6. Action and Guidance
  **Question:** Both veridical perceptions and perfect hallucinations guide action in the same way. If I see a snake or hallucinate a snake, I jump back. The motor output is identical. If the mental state guiding that action is fundamentally different in kind (relation vs. non-relation), why is the downstream behavioral output identical? Doesn't that suggest a common functional role?

  **Follow-up:** You might argue that the *reason* for the action is different (responding to a fact vs. responding to an appearance). But the muscles don't care about metaphysics. If the functional role is the same, doesn't that imply the internal state driving the function must share a common structure?

  ### 7. The Role of Priors and Expectations
  **Question:** In predictive processing, what you see is heavily influenced by your priors (expectations). If I expect to see a face in the clouds, I likely will. Disjunctivism suggests that in veridical cases, the world dictates the experience. How do you account for top-down processing where my internal expectations literally change what I perceive, even when the object hasn't changed?

  **Follow-up:** If my internal priors can alter the perceptual experience of the *same object*, then the experience isn't just a relation to the object; it's a mixture of object and brain. How do you disentangle the "direct contact" from the "predictive filter" if the filter changes the contact?

  ### 8. The "Screening Off" Problem
  **Question:** If the external object is a constituent of my experience, does the brain's processing become transparent? It seems disjunctivism risks "screening off" the neuroscience. If the experience is constituted by the world, why do we need to study the brain to understand perception, rather than just studying the world?

  **Follow-up:** If you concede we still need to study the brain to understand *how* we make contact, aren't you admitting that the brain's activity is the real locus of the perceptual state, and the object is just the target?

  ### 9. Evolutionary Continuity
  **Question:** Evolution tends to work by tinkering with existing mechanisms, not creating fundamentally new metaphysical kinds. It seems unlikely that evolution would build one system for hallucinating and a completely different metaphysical system for seeing. Doesn't disjunctivism require an evolutionary discontinuity that doesn't fit the biological data?

  **Follow-up:** If you argue that the system is the same but the *success* of the system changes the metaphysics, you're back to the common factor argument: the system is the common factor. Why privilege the successful run of the software as a different "kind" of process than the buggy run?

  ### 10. The Bridge Question
  **Question:** Finally, is there any room for compromise? Can we accept that the *phenomenology* feels direct (naïve realism) while accepting the *mechanism* is predictive and inferential? Or does disjunctivism demand that the mechanism itself must be non-inferential?

  **Follow-up:** If you allow the mechanism is inferential but claim the *relation* is direct, aren't you just rebranding predictive processing? If the brain infers the world so perfectly that the inference disappears from view, is that "direct contact" in any meaningful sense, or just really good prediction?
