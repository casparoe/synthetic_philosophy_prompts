answer: |-
  This is a classic problem in social choice theory. The name you are looking for is the **Discursive Dilemma** (sometimes also called the **Doctrinal Paradox**). It was famously formalized by Philip Pettit and Christian List in the early 2000s, though versions of it appeared in legal theory earlier. It is indeed a close cousin of Arrow's Impossibility Theorem, dealing specifically with *judgment aggregation* on logically connected propositions rather than just ranking preferences.

  Here is the move-by-move breakdown of Dana and Theo's argument, followed by an overall verdict on who is closer to the mark.

  ### Move-by-Move Analysis

  **1. Dana's Opening: "The mandate is the outcome."**
  *   **Dana's Point:** The committee was charged to answer "Hire or Don't Hire." The criteria (research/teaching) are just internal heuristics to help individuals reach that verdict. Only the final vote binds the institution.
  *   **Theo's Counter:** "The rule is part of the mandate."
  *   **Theo's Point:** The committee agreed on a logical rule (Hire $\iff$ Research $\land$ Teaching). Ignoring the majority view on the inputs violates the rule the committee set for itself.
  *   **Who wins this round?** **Draw / Context Dependent.**
      *   Dana is right about *authority*: In most organizations, the only vote that counts is the one on the motion before the chair.
      *   Theo is right about *integrity*: If you agree to a rule, violating the logical consequences of that rule makes the decision arbitrary.
      *   *Verdict:* Dana has the stronger *procedural* argument (standard parliamentary procedure), but Theo has the stronger *logical* argument.

  **2. Theo's Push: "The 'No' lacks collective reasons."**
  *   **Theo's Point:** A "No Offer" verdict implies the candidate is flawed. But there is no majority that thinks Research is flawed, and no majority that thinks Teaching is flawed. The "No" result is an artifact of two different minorities cancelling each other out. It's a "hollow" majority.
  *   **Dana's Counter:** "The 'Yes' lacks collective will."
  *   **Dana's Point:** If you follow Theo's logic (vote on premises), you get a "Hire" verdict. But look at the people: M2 and M3 both voted "No." Under Theo's system, you are forcing an offer on a candidate that two-thirds of the committee explicitly rejected based on the final question.
  *   **Who wins this round?** **Dana.**
      *   This is the crucial weakness of Theo's position (Premise-Based Procedure). In this specific scenario, the Premise-Based outcome ("Hire") is supported by **zero** members of the committee as a final verdict. M1 votes Yes, but M2 and M3 vote No.
      *   Dana's position (Conclusion-Based Procedure) yields a result ("No Hire") supported by a majority of the members (M2 and M3). In a democratic voting context, having a majority of *people* endorse the final outcome is usually more important than having the outcome be logically consistent with the premises.

  **3. Dana's Closer: "Real votes count."**
  *   **Dana's Point:** Two named human beings said "No" to the job offer. Overruling them by recombining their sub-judgments treats them like logic gates rather than agents.
  *   **Theo's Closer:** "Consistency applies everywhere."
  *   **Theo's Point:** If we respect the majority will on the conclusion, we must respect it on the premises. You can't cherry-pick which level of judgment gets democratic respect.
  *   **Who wins this round?** **Theo (on principle), Dana (on practice).**
      *   Theo identifies the core theoretical problem: You cannot satisfy both "Majority Rule on Premises" and "Majority Rule on Conclusion" simultaneously when logic connects them. One must give.
      *   However, Dana identifies the practical risk: If you allow premise-voting to overrule conclusion-voting, you risk "tyranny of the logic." You could end up hiring someone everyone thinks is unqualified, provided the specific reasons for disqualification are fragmented.

  ### Overall Verdict

  **Who is closer to right?**
  In the specific context of a **hiring committee**, **Dana is closer to right.**

  Here is why: Hiring is an *action*, not a *truth claim*.
  *   **Theo** is arguing for **Collective Rationality**. He wants the committee's output to look like it came from a single rational brain. If the "Group Brain" thinks Research is Good and Teaching is Good, it *should* Hire.
  *   **Dana** is arguing for **Democratic Responsiveness**. She wants the outcome to reflect the actual will of the constituents (the committee members).

  In a court of law (where this paradox originated as the Doctrinal Paradox), Theo often wins. Judges want the legal *doctrine* to remain consistent, even if it leads to a verdict no single judge fully prefers, because the integrity of the law matters more than the specific case outcome.

  But in hiring? You do not want to extend a job offer to a candidate that two out of three committee members explicitly voted against. If M2 thinks "Don't hire, bad teacher" and M3 thinks "Don't hire, bad researcher," and you hire anyway because "well, collectively you liked the teaching and the research," you have created a workplace disaster. M2 and M3 will be colleagues with someone they voted to reject. Dana's approach preserves accountability; Theo's approach preserves consistency at the cost of buy-in.

  **What are they both missing?**
  Both Dana and Theo are arguing *ex-post* (after the votes were cast) about how to aggregate the results. **The real failure was procedural design.**

  The Discursive Dilemma proves that you *cannot* have it both ways. You cannot have a system that guarantees:
  1.  Majority rule on premises.
  2.  Majority rule on conclusions.
  3.  Logical consistency between them.

  The committee's mistake was not deciding *beforehand* which procedure they were using.
  *   If they wanted **accountability**, they should have agreed: "We will vote directly on the offer; the criteria are just for our private guidance." (Dana's way).
  *   If they wanted **consistency**, they should have agreed: "We will vote on the criteria, and the math will decide the offer, even if we personally disagree with the result." (Theo's way).

  By leaving it ambiguous, they allowed the paradox to emerge.

  **Final Score:**
  *   **The Paradox:** The Discursive Dilemma (List & Pettit).
  *   **The Debate:** Theo wins on logic; Dana wins on governance.
  *   **The Reality:** The committee chair failed by not specifying the aggregation method before the voting began. In a hiring context, Dana's "Conclusion-Based" approach is generally safer, because you never want to hire a candidate a majority of the committee actively opposes, regardless of the logical gymnastics used to get there.
