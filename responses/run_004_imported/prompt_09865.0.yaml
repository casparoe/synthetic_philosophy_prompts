      *   *Correction on CBP:* The group decision ("No Offer") is supported by a majority (M2 & M3), but the *reasons* are inconsistent collectively. This is the strong point for Theo.

  9.  **Final Polish:** Ensure the distinction between the *Doctrinal Paradox* (legal context) and *Discursive Dilemma* (general context) is clear, though they are effectively the same structure. List & Pettit is the key citation.

