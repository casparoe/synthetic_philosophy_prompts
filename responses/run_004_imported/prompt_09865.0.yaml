      *   *Context Matters:* In a hiring context, accountability (Dana) often trumps logical consistency (Theo). You don't want to hire someone a majority explicitly rejected, even if the logic is wobbly. However, in a court setting (Doctrinal Paradox origin), consistency (Theo) is often preferred to maintain legal integrity.
