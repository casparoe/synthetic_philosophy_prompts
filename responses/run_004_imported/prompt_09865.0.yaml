      *   **The Paradox:**
          *   *Premise-based procedure (PBP):* Vote on premises first. Research (2-1 Yes), Teaching (2-1 Yes). Apply rule $\rightarrow$ Offer.
          *   *Conclusion-based procedure (CBP):* Vote on conclusion first. Offer (1-2 No). Apply rule individually $\rightarrow$ No Offer.
