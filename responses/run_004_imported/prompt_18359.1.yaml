prompt: |-
  I'm a public health reporter writing a retrospective on a 2022 outbreak traced to a single wedding reception. An epidemiologist I interviewed says the outbreak simply reflects a general pattern of room size, ventilation, and event duration — one that predicts this outbreak about as well as it predicts a dozen others on record. The county's contact tracer, who reconstructed the night guest by guest, insists the real explanation is a particular, unrepeatable sequence of small events: a broken air handler, a long toast, one still-asymptomatic guest who worked the room. My editor wants one clean cause for the piece. Do I have to choose between these two accounts, or can both be right, and how should that shape what I write?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Request:**
      *   **Role:** Public Health Reporter.
      *   **Topic:** Retrospective on a 2022 outbreak traced to a single wedding reception.
      *   **Conflict:** Two expert sources offer conflicting explanations.
          *   *Epidemiologist:* General pattern (room size, ventilation, duration). Predictive, structural, systemic.
          *   *Contact Tracer:* Specific sequence (broken air handler, long toast, one superspreader guest). Contingent, narrative, unique.
      *   **Constraint:** Editor wants "one clean cause."
      *   **Question:** Do I have to choose? Can both be right? How should this shape the writing?

  2.  **Evaluate the Science/Logic:**
      *   *Epidemiologist's View:* This is the "necessary conditions" perspective. Without the room size/ventilation/duration profile, the outbreak likely wouldn't happen *at scale*. It's the fuel and the engine.
      *   *Contact Tracer's View:* This is the "sufficient conditions" or "trigger" perspective. The specific spark (the asymptomatic guest) and the specific exacerbating factors (broken unit, toast) made *this* outbreak happen *here* and *now*.
      *   *Synthesis:* In complex systems (like disease transmission), outcomes are almost always the result of *both* structural vulnerabilities and specific triggers. Think of it as the "Swiss Cheese Model" of accident causation. Both accounts are scientifically valid; they operate at different levels of abstraction.
      *   *Editor's Constraint:* "One clean cause" is a journalistic simplification that risks distorting the truth. It's a common tension between narrative clarity and scientific accuracy.

  3.  **Determine the Answer:**
      *   *Do you have to choose?* No. In fact, choosing one weakens the story.
      *   *Can both be right?* Yes, absolutely. They are complementary, not mutually exclusive.
      *   *How to shape the writing?* Use the tension itself as the story. Challenge the editor's premise (gently) by showing that the "clean cause" is a myth.

  4.  **Drafting the Advice (Iterative Process):**

      *   *Initial thought:* Tell the user to fight the editor.
      *   *Correction:* That's not practical. Need to give actionable advice on how to write *and* manage the editor.
      *   *Key Concept:* The "Swiss Cheese Model" or "Perfect Storm."
      *   *Structure of the Response:*
          1.  Direct Answer (No, don't choose. Yes, both are right).
          2.  Scientific Explanation (Why they fit together).
          3.  Journalistic Strategy (How to pitch/write this).
          4.  Narrative Angle (Turning the conflict into the hook).

      *   *Refining the Scientific Explanation:* Use the analogy of fire. The epidemiologist describes the dry forest (conditions). The tracer describes the lightning strike (trigger). You need both for a wildfire.
      *   *Refining the Journalistic Strategy:* Acknowledge the editor's desire for clarity but explain why nuance sells better in a retrospective. A "clean cause" is boring/false. A "complex reality" is insightful.
      *   *Refining the Narrative:* The story isn't just about the virus; it's about *how we understand risk*. This makes it a meta-public health story.

  5.  **Developing Specific Recommendations:**
      *   *Headline/Lead:* Avoid "The Cause Was X." Try "Why X Happened."
      *   *Structure:* Start with the tracer's narrative (human element), then zoom out to the epi's data (structural element).
      *   *Editor Management:* Frame the dual explanation as adding *authority*, not confusion.

  6.  **Review against Constraints:**
