answer: |-
  Here are ten interview questions sequenced to move from grounding the concept to testing its limits, including the specific follow-ups you requested.

  **1. The Senator Case**
  In your email, you mentioned that a hypocrite retains the *truth* of their moral judgment but loses the *standing* to deliver it. To ground this: in my AP Government class, we argued about a corrupt senator criticizing a rival's corruption. If your view is right, the senator isn't *wrong* about the rival's corruption, but he isn't allowed to say it. What exactly is he missing that makes his criticism illegitimate? Is it a kind of moral authority?

  *Follow-up:* If he lacks authority but speaks the truth, does that mean the rival is still guilty, but the senator just isn't the right person to say it? Or does the senator's hypocrisy somehow change the moral status of the rival's action?

  **2. The Wallace Connection**
  You build on R. Jay Wallace's idea that blame is a form of "moral address" that presupposes equal standing. If I condemn you for something I do myself, am I claiming to be superior to you? Is that violation of equality the specific reason standing is forfeited?

  *Follow-up:* If equality is the key, does that mean if I openly acknowledge my own fault—"I do X, it's wrong, and you doing X is wrong too"—I restore that equality and keep my standing?

  **3. Hypocrisy vs. Complicity**
  I want to test what exactly causes the loss of standing. Is it the *hypocrisy* specifically—the double standard of condemning what I excuse in myself—or is it mere *complicity*? If I participate in a corrupt system but never criticize anyone else, do I have standing to blame? Or is the act of blaming while dirty the only thing that matters?

  *Follow-up:* So, if I am quietly complicit but silent, I retain standing, but the moment I speak up I lose it? That seems to suggest your view discourages people from speaking out against wrongs they are involved in. Is that a feature or a bug of the theory?

  **4. Degrees and Restoration**
  Is the loss of standing binary, like a light switch, or is it a matter of degree? If I have lied five times but tell the truth the sixth time, have I earned back the standing to blame liars, or is there a "statute of limitations" on hypocrisy?

  *Follow-up:* If it can be earned back, does it require public renunciation of the past behavior, or just private reform? At what point does the community get to decide I've earned it back, versus when I decide it for myself?

  **5. The Rhetorical Shield**
  A major worry critics raise is that this framework hands genuine wrongdoers a ready-made shield. If a murderer can silence a critic by pointing out that the critic once shoplifted, doesn't this view protect the worst actors by silencing flawed critics? How do you prevent "standing" from becoming a tool for deflection?

  *Follow-up:* But if we allow the shoplifter to blame the murderer, aren't we validating the idea that moral standing doesn't require moral integrity? How do you balance the need for criticism against the requirement for integrity without letting murderers off the hook?

  **6. Collective Agents**
  You've mentioned G.A. Cohen's question about governments condemning terrorism. Can a collective agent like a state or a school administration actually *be* hypocritical in the way a person is? Governments don't have a single psyche to hold conflicting values.

  *Follow-up:* If a government can't feel the "guilt" of hypocrisy, does it make sense to say it loses standing? Or does the loss of standing apply only to the specific officials speaking on behalf of the state?

  **7. The Bell Objection (Distinction)**
  Macalester Bell argues that "standing to blame" isn't a real, distinct normative power. She suggests that hypocritical blame is just *unkind*, *tactless*, or *badly timed*, but not illegitimate. How do you distinguish a loss of *standing* from the blame simply being unpleasant to hear?

  *Follow-up:* If it's just unpleasant, I can choose to ignore it. But if I lack standing, do I have a *right* to ignore it? What is the practical difference in how I treat the hypocrite versus the tactless blamer?

  **8. The Bell Objection (Truth vs. Source)**
  Following up on Bell: If the hypocrite's accusation is factually true and morally correct, why does the source matter normatively? If I tell you "smoking is bad for you" while I smoke, the medical fact doesn't change. Why is moral blame different from medical advice?

  *Follow-up:* So you're saying blame isn't just about transmitting information, it's about a relationship? If I reject your blame because you're a hypocrite, am I rejecting the *message* or the *relationship*?

  **9. The Psychology of Standing**
  Since your work is in moral psychology as well as philosophy: Do people actually *feel* the loss of standing in real time? When someone calls out a hypocrite, are they experiencing a philosophical intuition about normative authority, or just an emotional reaction of anger?

  *Follow-up:* If it's mostly emotional, does that undermine the philosophical claim that standing is an objective normative fact? Or does our psychology track the moral reality?

  **10. Advice for Students**
  For high school students running a club or student government, we often have to call out behavior we aren't perfect at ourselves. Based on your research, what is the one thing we should do before criticizing a peer to ensure we retain the standing to be heard?

  *Follow-up:* So, is acknowledgment of our own flaws a prerequisite for leadership, or just a strategy to make our criticism more effective?
