      *   *Philosophical Punch:* Why privilege Provenance over Environment? Intrinsic vs. Extrinsic. Reichenbach fails because the narrowest class lacks "reliable statistics" (Hájek's point).

  6.  **Refining the Argument (Addressing Hájek/Reichenbach):**
      *   Reichenbach: "Use the narrowest class with reliable statistics."
      *   Problem: The intersection (Narrowest) has *unreliable* statistics (small sample).
