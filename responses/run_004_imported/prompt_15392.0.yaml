          *   *Scenario:* The vineyard had a fantastic year (1% spoilage rate). The cellar had a cooling system failure 5 years ago (40% spoilage rate).
          *   *Conflict:* 1% vs 40%.
          *   *Reichenbach's Fix:* Use the narrowest class: "Bottles from this vineyard stored in this cellar."
          *   *The Kicker:* There are no statistics for *that* intersection. It's a unique conjunction.
          *   *Why no non-arbitrary rule?* To choose the Producer class is to privilege intrinsic properties. To choose the Storage class is to privilege extrinsic/historical properties. Neither is objectively "more relevant" without a causal model, but the causal model itself relies on probability assessments.

