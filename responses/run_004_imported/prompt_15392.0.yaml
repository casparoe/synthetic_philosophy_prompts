      *   **Requirement:** Show at least two equally well-motivated reference classes yielding substantially different probabilities for the same individual case.
      *   **Requirement:** Explain why no non-arbitrary rule exists to adjudicate between them (addressing Reichenbach's "narrowest reliable class" and Hájek's criticisms).

  2.  **Deconstruct the Reference Class Problem:**
      *   Core issue: $P(A | B)$ vs. $P(A | C)$ where $B$ and $C$ are both true of individual $x$, but $P(A | B) \neq P(A | C)$.
      *   Why is it hard to solve? Because "similarity" or "relevance" is context-dependent. Reichenbach suggests the narrowest class with stable statistics. Hájek argues "narrowest" is vague and "stable" is hard to define without circularity.
      *   Goal: Find a scenario where "narrowness" and "relevance" pull in opposite directions or where two classes are equally narrow/relevant but give different results.

  3.  **Brainstorming Domains:**
      *   *Medicine/Epidemiology:* (Too close to life tables/insurance).
      *   *Law/Criminal Justice:* (Recidivism rates? Risk assessment algorithms. Good potential).
      *   *Sports:* (Player performance. Good, but maybe too trivial).
      *   *Climate Science:* (Probability of extreme weather events. Interesting, but maybe too complex for a seminar paper).
      *   *Art/Auctions:* (Probability a painting is a forgery. Interesting).
      *   *Technology/AI:* (Probability of system failure. Good).
      *   *Archaeology/History:* (Probability a specific artifact is genuine).

  4.  **Selecting the Best Domain:**
      *   *Law/Criminal Justice* is strong because it involves high stakes and clear demographic vs. individual factors. However, it can be ethically sensitive and might distract from the pure philosophy.
      *   *Art/Auctions* is elegant. It deals with attribution, which is inherently probabilistic.
      *   *Technology/AI* is modern and relevant.
      *   *Let's try a hybrid: Conservation Biology/Species Extinction.* It's distinct from human life tables, involves specific individuals (animals), and has clear class divisions (species vs. location vs. trait).
      *   *Actually, let's go with something more quotidian but philosophically rich: Predictive Maintenance in Aviation.* Or perhaps *Medical Diagnosis* but focused on a specific rare condition where demographics clash with symptoms.
