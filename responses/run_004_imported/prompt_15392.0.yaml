          *   Conflict: Statistical base rate vs. contextual suspicion.
      *   *Critique:* A bit similar to insurance/actuarial logic.

      *   *Idea:* **The "Autonomous Vehicle Accident" Case.**
          *   Individual: A specific self-driving car model (e.g., Tesla Model X) at a specific intersection.
          *   Property: Getting into an accident.
          *   Class 1: All cars of this model (Global stats).
