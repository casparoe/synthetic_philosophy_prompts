      *   *Role of Illusion/Truth:*
          *   Du Châtelet: Truth is often inimical to happiness. We *need* self-deception (e.g., thinking our work matters more than it does).
          *   Epicurus: Truth (understanding nature) is the *only* path to happiness. False beliefs cause fear.
