      *   *Definition of Pleasure:* Primarily negative (absence of pain), not positive hedonism (constant stimulation).
      *   *Key Mechanism:* **Desire Management.** Distinguish between natural/necessary, natural/unnecessary, and vain/empty desires. Eliminate the vain ones.
      *   *View on Passion:* *Pathē* (emotions/passions) are often sources of disturbance. Fear of gods and death must be eradicated.
      *   *View on Illusion:* False beliefs (about gods, death, nature) cause anxiety. Truth (physics/logic) liberates us from fear.
      *   *View on Virtue:* Prudence (*phronesis*) is the highest virtue because it calculates pleasure and pain.

  4.  **Compare and Contrast (The "Structure of the Argument"):**

