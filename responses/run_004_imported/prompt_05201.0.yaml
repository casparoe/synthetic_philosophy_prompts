answer: |-
  Your intuition is spot-on. Your friend's classification of Borges as a straightforward "eternalist" or "block universe" proponent is a classic case of philosophical pattern-matching: seeing two systems deny the "flow" of time and assuming they deny it for the same reasons.

  If Borges sat down with a modern physicist to discuss the Block Universe (the idea that spacetime is a static 4D manifold where past, present, and future coexist), Borges would likely be polite, fascinated by the geometry, but ultimately convinced that the physicist is answering a completely different question. In fact, he might argue that the Block Universe is the *ultimate* materialist trap—the very "time-container" he was trying to dismantle.

  Here is the breakdown of why Borges would reject the Block Universe as a vindication of "A New Refutation of Time," based specifically on the metaphysical moves he makes in that essay.

  ### 1. Idealism vs. Realism (The Container Problem)
  The fundamental split is ontological.
  *   **The Physicist's Block:** This is a **Realist** model. It posits that Spacetime is a "thing" that exists independently of perception. It is a giant, frozen crystal structure. The past isn't gone; the future isn't unborn; they are just *over there* in the fourth dimension.
  *   **Borges's Argument:** Borges is arguing from **Idealism** (specifically Berkeleyan). His starting move is to deny the existence of matter independent of perception. When he attacks time, he is attacking the idea of a "container" that holds events.

  **Borges's Objection:**
  Borges would argue that the Block Universe commits the exact error he is trying to expose. By positing a 4D manifold, the physicist has reified time into a massive, static object. Borges writes: *"I suspect that the word 'time' is a synonym of 'matter'."* He wants to dissolve the substance of time, not freeze it into a block.

  To Borges, the physicist is saying, "Time doesn't flow, it's a landscape." Borges would reply, "There is no landscape, there are only footsteps." The Block Universe requires an external, objective reality to exist. Borges's essay argues that without a perceiver, there is no reality to be block-like.

  ### 2. Discontinuity vs. Continuity
  This is the most technical but crucial distinction.
  *   **The Physicist's Block:** Spacetime is a **continuum**. Even if it's frozen, Point A is mathematically and causally connected to Point B. Your "world-line" is a continuous tube stretching from birth to death. The structure is rigid and interconnected.
  *   **Borges's Argument:** Borges uses Hume to argue for **discontinuity**. If the Self is just a bundle of impressions, and Matter is just perception, then Moment A does not *cause* Moment B. There is no glue. As he puts it, each moment is "self-sufficient."

  **Borges's Objection:**
  Borges would find the Block Universe too cohesive. In "A New Refutation," he is arguing for a radical atomization of experience. He wants to isolate the "now" so thoroughly that it doesn't even touch the "past."
  The Block Universe says, "The past is still here, attached to the present."
  Borges says, "The past is a fiction we tell to make sense of the present; strictly speaking, only this impression exists."
  For Borges, the Block Universe is just another version of the "absolute time" he is mocking—it assumes a structure that binds moments together. Borges wants to cut the binds.

  ### 3. The Fate of the Self
  *   **The Physicist's Block:** You exist in the block as a "world-tube." Your consciousness is a spotlight moving along the tube (or, in the strict eternalist view, the whole tube is "you" and the movement is an illusion). But *you* are still an object in the system.
  *   **Borges's Argument:** Borges dissolves the Self. Following Hume, he argues there is no "I" that persists. There is only the thought, not the thinker.

  **Borges's Objection:**
  If there is no persistent Self, there is no one to occupy the Block Universe. The Block Universe requires an observer to locate a "coordinate" of 'now,' even if that 'now' is subjective. Borges goes further: if there is no 'I', there is no one to be trapped in the block.
  He would likely tell the physicist: *"You have frozen the river, but you forgot to ask if there is any water."* The physicist preserves the object (the universe) and demotes the subject. Borges sacrifices the subject to evaporate the object.

  ### 4. The Retraction (The Most Important Part)
  You noted the ending, where Borges pulls the rug out: *"The world, unfortunately, is real; I, unfortunately, am Borges."*
  This is not just a humble brag; it is the philosophical core of the essay. Borges admits that **phenomenology trumps ontology.** It doesn't matter if time is logically refutable; it matters that we *suffer* it.

  **Borges's Objection:**
  The physicist presents the Block Universe as a *solution*. "Don't worry about the flow, it's just geometry."
  Borges would view this as a evasion of the human condition. The tragedy of "A New Refutation of Time" is that we *want* time to be real (because we fear death, because we love memory), but logic says it isn't. Or conversely, we want to escape time, but our bodies demand it.

  If the physicist says, "Time is a block," Borges would ask: "Does that stop you from feeling regret? Does that stop you from fearing death?"
  The Block Universe is a cold comfort. Borges's essay is a warm contradiction. He would likely argue that the physicist is hiding behind mathematics to avoid the visceral horror of temporal succession. Borges *wants* to be the river, even if it hurts. The physicist wants to be the map of the river.

  ### The Verdict: Vindication or Misunderstanding?
  Borges would feel **misunderstood**, but he would write a beautiful story about the misunderstanding.

  He would tell the physicist:
  > "You have built a magnificent labyrinth of crystal. You say the Minotaur is dead because the walls do not move. But I tell you the Minotaur is alive because he breathes, even if only for an instant. You have denied the flow of time by making the universe a statue. I have denied the flow of time by waking up from the dream of the statue. We both say 'time does not pass,' but you mean it is all *there*, and I mean it is all *here*."

  **Why the pop-physics comparison persists:**
  People link them because both views kill the "common sense" view of time (a flowing river). But:
  *   **Physics (Block):** Kills the flow to save the **Object**. (The Universe is real, time is a dimension).
  *   **Borges:** Kills the flow to save the **Subject** (and then admits that fails too). (Perception is real, time is a mental habit).

  **A Note on Rovelli:**
  You mentioned Carlo Rovelli. Interestingly, Rovelli is actually closer to Borges than the Block Universe proponents are. In *The Order of Time*, Rovelli argues that time is not fundamental at all—it emerges from thermodynamics and perspective. He dissolves the "block" into a fuzzy quantum foam where distinct "nows" don't strictly exist. Borges would have a much richer conversation with Rovelli, likely bonding over the idea that time is a "blurring" of perspective rather than a frozen geometry. But the standard "Block Universe" (Einsteinian Eternalism)? Borges would view that as just another metaphysical fiction, albeit a mathematically elegant one.

  **Summary:**
  Borges isn't saying the future already exists (Eternalism). He's saying the past doesn't exist, the future doesn't exist, and the present is a knife-edge without width. The Block Universe says they all exist equally. That is a structural opposite, disguised as a similar conclusion. Borges would thank the physicist for the coffee, smile sadly, and go home to write about a man who lives his life backwards in a library that burns down every second.
