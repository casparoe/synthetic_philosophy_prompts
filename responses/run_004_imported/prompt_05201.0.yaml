prompt: |-
  So I've been on a big Borges kick this year — started with the short stories, then found out he wrote proper essays too, and I've read "A New Refutation of Time" like three times trying to actually get what he's aguing instead of just vibing with the title. As far as I can tell the move is: first he leans on Berkeley (nothing exists except perceptions, so theres no need to posit some kind of "time-container" running underneath them) and then on Hume (there's no persistent self either, just a bundle of impressions), and he uses that combo to argue that succession itself is suspect — theres no fact that actually stitches "now" to "a second ago" into one flowing thing, each moment is kind of self-sufficient and alone. Then, famously, right at the end, he basically pulls the rug out from under his own essay — something about how he can deny time all he wants on paper but he's still the river, still the tiger, still the fire, cant actually escape it in practice. Wild note to end a "proof" on.

  I mentioned this to a friend who did a philosophy minor and she just said "oh that's basically eternalism, the block universe thing" and moved on, which didn't really scratch the itch for me. Separately I keep running into this pop-physics idea (might've been from a Carlo Rovelli book, might've been somewhere else, honestly can't remember) that relativity implies a "block universe" — past present and future all equally real, nothing is actually flowing, "now" is just some artifact of being a limited creature stuck at one point in the block. People online love pointing out that Borges basically called this decades early.

  Thats the part I can't settle myself though: is that actually the same claim he's making, or is everyone just pattern-matching two "time isn't what it seems" vibes that are structurally pretty different underneath? So here's what I want from you: if Borges somehow got to sit down with a modern physicist and have the block universe explained to him properly, what do you think he'd actually say back — given the specific argument in that essay, not just his general reputation for labyrinths and infinite libraries? Would he take it as vindication of what he was doing, or would he think it's actually answering a completely different question from the one he was asking (maybe even pulling in the opposite metaphysical direction)? Walk me through why, specifically, not just a yes/no.
