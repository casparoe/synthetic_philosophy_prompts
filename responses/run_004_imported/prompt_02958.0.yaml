answer: |-
  This is one of the sharpest questions you can ask about Aristotle's economic thought. You have identified the central *aporia* (puzzle) that has kept commentators busy for decades: **How can something admitted to be a convention (*nomos*) in the *Ethics* be subject to a judgment of "unnatural" (*para physin*) in the *Politics*?**

  If money is just a social invention to measure demand, on what grounds can Aristotle claim it has a "nature" that can be violated by interest?

  Here is my take on the two passages, where they align, where they fracture, and whether the *tokos* argument is doing philosophical heavy lifting or just rhetorical work.

  ### 1. The Two Accounts: Function vs. Telos

  To see if they fit, we have to look at what job Aristotle is asking money to do in each text.

  **In the *Nicomachean Ethics* (Book V):**
  Aristotle is solving a problem of **commensurability**. How do you equate a house and a shoe? He argues that *chreia* (need/demand) is the ultimate reality that binds the polis. Money (*nomisma*) is introduced as a guarantee of future exchange—a token that represents *chreia*.
  *   **Status of Money:** Conventional (*nomisma* comes from *nomos*, law/convention).
  *   **Purpose:** To facilitate reciprocity so the community holds together.
  *   **Verdict:** Money is good/necessary *insofar as* it makes proportionate reciprocity possible.

  **In the *Politics* (Book I):**
  Aristotle is solving a problem of **limits**. He distinguishes *oikonomike* (household management, acquisition for use) from *chrematistike* (acquisition for its own sake).
  *   **Status of Money:** It has a proper use (exchange for goods) and an improper use (accumulation).
  *   **Purpose:** To satisfy natural needs.
  *   **Verdict:** Usury is "most unnatural" because it detaches acquisition from need. The *tokos* (offspring/interest) argument is that money is sterile; it cannot naturally reproduce like livestock or crops.

  ### 2. The Consistency: The Teleological Bridge

  There is a strong argument that these two views are consistent **ethically**, even if they wobble **ontologically**.

  Aristotle is a teleologist. For him, the "nature" of a thing is defined by its *telos* (end goal).
  *   In the *Ethics*, the *telos* of money is **exchange**.
  *   In the *Politics*, the *telos* of economic activity is **living well** (*eudaimonia*).

  From this perspective, the two accounts align perfectly on the **subordination of economics to ethics**. In both texts, money must remain a *means*, never an *end*.
  *   In the *Ethics*, if money stops measuring need and becomes the object of desire, reciprocity breaks down (injustice).
  *   In the *Politics*, if money stops facilitating household sustenance and becomes the object of infinite accumulation, the household corrupts the polis.

  So, the condemnation of usury in the *Politics* is actually an extension of the theory of justice in the *Ethics*. Usury represents the ultimate perversion of reciprocity: it is an exchange where one party gains without the other providing a good or service that satisfies a need. The lender gives money and gets back money + more, without the "need" (*chreia*) of the community being the anchor.

  **On the *Tokos* Argument:**
  You asked if the "breeding" metaphor is a naturalistic fallacy or rhetorical fluff. I argue it is **philosophically functional for Aristotle**, even if it fails modern economic scrutiny.
  Aristotle distinguishes between things that have a "principle of motion" within them (organic growth) and things that don't.
  *   A cow produces a calf (natural).
  *   A shoe wears out (use).
  *   Money sits there (sterile).

  When you charge interest, you are pretending money has a generative power it does not possess. You are treating a convention (metal) as if it were a living substance. For Aristotle, this isn't just a metaphor; it's a category error. It creates value out of nothing, which violates his metaphysics of causation. So, it's not merely rhetorical; it's an ontological claim about the source of value (labor/land vs. convention).

  ### 3. The Tension: Convention vs. Nature

  Here is where your intuition is spot on: **There is a genuine fracture in the theory.**

  In the *Ethics*, Aristotle is refreshingly modern: money is a convention (*nomos*). It exists because we agree it does. It has no value in itself (he notes that money can become worthless if the convention changes).
  In the *Politics*, however, he treats the *use* of money as having a **natural limit**.

  **The Problem:** If money is a convention, how can its usage be "unnatural"?
  *   If I invent a hammer (convention), I can use it to drive nails (intended use) or to hit people (unintended use). But hitting people isn't "unnatural" in a metaphysical sense; it's just a misuse of the tool.
  *   Aristotle treats the misuse of money (usury) not just as a misuse of a tool, but as a violation of *physis* (nature).

  This is the break point. He wants to have it both ways:
  1.  Money is artificial (so we can invent it to solve the commensurability problem).
  2.  Money has a natural teleology (so we can condemn interest as "unnatural").

  If money is purely conventional, its *telos* is whatever we agree it is. If we agree that lending at interest is a valid service (compensating for risk and time), then Aristotle's "nature" argument collapses. He is smuggling a moral judgment (greed is bad) into a metaphysical claim (money breeding is unnatural) to make the moral judgment seem objective.

  ### 4. Where the Theory Breaks Down (My Take)

  To answer your request for an "actual take": **The accounts are ethically consistent but ontologically inconsistent.**

  Aristotle saves the consistency by focusing on the *human agent* rather than the *money*.
  *   In the *Ethics*, the just man uses money to restore equality.
  *   In the *Politics*, the virtuous citizen uses acquisition to support the good life.
  *   In both cases, the **vice** is *pleonexia* (graspingness/greed).

  The theory breaks down when he tries to locate the vice in the **transaction mechanism itself** (the *tokos*).
  1.  **He ignores liquidity and time:** Aristotle assumes the only value money has is its purchasing power *now*. He cannot conceive that money *later* is worth less than money *now*, or that lending provides a service (liquidity) that deserves compensation distinct from "breeding."
  2.  **He conflates lending with investment:** In Aristotle's world, loans were mostly for consumption (distress), not production. If you borrow to buy seed corn, the corn produces a crop. If you borrow to buy food because you are starving, nothing is produced. Aristotle sees all interest as extracting value from a borrower in distress, rather than sharing in the risk of an enterprise. (This is why he hates usury but tolerates trade partnerships to some degree).
  3.  **The Naturalistic Fallacy:** You are right to flag this. By calling usury "unnatural," he tries to shut down debate. If it were merely "unjust" or "harmful to the polis," one could argue about the degree. By calling it "unnatural," he makes it a metaphysical impossibility for a virtuous person. This is a rhetorical fortification of a weak economic premise.

  ### Summary for your Seminar

  If I were presenting this in your seminar, I would argue this:

  Aristotle's *Ethics* and *Politics* accounts of money are **teleologically consistent but ontologically tense.**
  *   **Consistency:** Both texts demand that economics remain subordinate to human flourishing. Money must measure need (*chreia*), not generate infinite desire. Usury violates this in both frameworks because it decouples gain from need.
  *   **Tension:** The *Ethics* admits money is a convention (*nomos*), while the *Politics* condemns usury as a violation of nature (*physis*). Aristotle tries to bridge this by arguing that while the *token* is conventional, the *need* it serves is natural. However, the *tokos* argument relies on a biological metaphor that doesn't hold up to the reality that money *can* be productive capital.

  **The Verdict:** The *tokos* argument is not just rhetoric; it is the linchpin of his attempt to moralize economics. But it relies on a category error regarding the nature of value. He is right that unlimited accumulation is dangerous for the polis (a very relevant point today), but he is wrong that interest is "unnatural." He mistakes the **abuse** of a convention for a violation of **nature**.

  This tension reveals the limit of Greek political thought: they could analyze the *ethics* of exchange brilliantly, but they lacked the conceptual framework to understand *finance* as anything other than a zero-sum extraction.
