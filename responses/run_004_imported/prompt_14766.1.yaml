answer: |-
  **The Limits of Deliberation: A Defense of Williamsian Internalism**

  Bernard Williams's "Internal and External Reasons" constitutes a watershed moment in meta-ethics, challenging the rationalist consensus that practical reasons exist independently of an agent's psychological makeup. Williams's central thesis is deceptively simple: for a reason statement ("A has a reason to $\phi$") to be true, there must be a sound deliberative route connecting that reason to the agent's "subjective motivational set" ($S$). If no such route exists, the statement is false. This internalist constraint threatens to upend the categorical pretensions of morality, suggesting that the callous man may literally have no reason to avoid cruelty if his $S$ contains no element that deliberation could link to another's welfare.

  This essay will reconstruct Williams's argument with a focus on the precision of the "sound deliberative route" (SDR) clause, weigh two formidable objections regarding the elasticity of deliberation and the loss of moral categoricity, and defend a definite verdict: Williams is correct that external reasons are unintelligible, and while this entails a loss of metaphysical comfort regarding morality's authority, it is the only position compatible with a naturalistic understanding of human agency. Internal reasons exhaust the space of genuine practical reasons; external reason statements are either false or elliptical internal claims.

  ### The Architecture of Internalism

  To evaluate Williams's position, one must reconstruct the Internal Reasons Statement (IRS) with sufficient rigor to distinguish it from both crude Humeanism and Kantian rationalism. Williams defines the IRS as follows:

  > A has a reason to $\phi$ if and only if A could reach a conclusion to $\phi$ by a sound deliberative route from the motivations in A's $S$.

  The precision of this claim rests on two components: the composition of $S$ and the operations permitted in the SDR.

  First, $S$ is not merely a set of occurrent desires or brute urges. Williams explicitly broadens $S$ to include "dispositions of evaluation, patterns of emotional reaction, personal loyalties, and various projects... embodying commitments of the agent." This prevents the internalist from being trapped by an agent's immediate whims; a commitment to a career or a loved one is an element of $S$ even if not currently active in consciousness.

  Second, the SDR is not limited to instrumental calculation (finding means to ends). Williams grants deliberation significant expansive power. A sound deliberative route includes:
  1.  **Instrumental Reasoning:** Determining the means to satisfy an element of $S$.
  2.  **Factual Correction:** Removing false beliefs about the world or the consequences of actions.
  3.  **Imaginative Vivacity:** Appreciating the force of consequences through vivid rehearsal (e.g., realizing the pain caused by a prank).
  4.  **Constitutive Analysis:** Reflecting on what one's existing projects actually entail (e.g., realizing that being a "loyal friend" requires honesty in a specific context).
  5.  **Deliberative Weighting:** Resolving conflicts between elements of $S$ through reflection on their relative importance to the agent's identity.

  Crucially, however, the SDR *excludes* the generation of entirely new ultimate ends *ex nihilo*. Deliberation can refine, correct, and specify the contents of $S$, but it cannot conjure a motivation where there is no anchor in the existing set. If an agent possesses no element in $S$—no desire, commitment, or evaluative disposition—that could, even after maximal informational and imaginative correction, lead to $\phi$-ing, then the statement "A has a reason to $\phi$" is false.

  ### Objection I: The Elasticity of Deliberation

  The first major objection concerns the elasticity of the SDR. Critics argue that Williams's generous conception of deliberation—particularly "constitutive analysis" and "imaginative vivacity"—is capacious enough to smuggle almost any normative consideration back into the internal framework. If reflecting on what it means to be a rational agent, or vividly imagining the suffering of another, *necessarily* produces a motivation to act morally in any sane person, then the distinction between internal and external reasons collapses. Internalism would become trivially true but practically indistinguishable from the rationalism Williams opposes.

  John McDowell pushes this worry in a specific direction. He argues that the virtuous agent perceives reasons in the world that the non-virtuous agent cannot see. For McDowell, moral education does not merely inform the agent; it transforms their perceptual capacity, effectively altering their $S$. McDowell suggests this allows for a form of external reason: the reason exists in the situation, and the agent's failure to see it is a failure of rationality, not just a lack of desire.

  Williams's strongest reply here is to insist on the conceptual possibility of the amoralist. Williams concedes that for *many* agents, the SDR will indeed lead to moral conclusions because their $S$ contains generic social dispositions, empathy, or a desire for self-respect. However, he maintains that it is not a *conceptual truth* that deliberation must yield these results. There could be an agent whose $S$ is so impoverished or so malign that even with full information and vivid imagination, they remain unmoved by the suffering of others. To say such an agent "has a reason" to be kind is to invoke a mysterious normative force detached from human psychology.

  The elasticity objection fails because it conflates *empirical likelihood* with *conceptual necessity*. It may be true that in the actual world, almost everyone has some element in $S$ (e.g., a desire for social cooperation) that deliberation can link to morality. But Williams's internalism is a claim about the *truth conditions* of reason statements, not a statistical claim about human psychology. If the SDR were elastic enough to guarantee moral motivation for *any* possible $S$, Williams would indeed be a rationalist in disguise. But he explicitly denies this. The SDR is sound only if it proceeds from the agent's *actual* motivations. If the anchor is missing, the route cannot begin. Thus, the distinction retains its philosophical bite: it forces us to admit that reasons are contingent on psychological makeup.

  ### Objection II: The Categorical Pretensions of Morality

  The second objection strikes at the normative heart of the matter. If reasons are internal, morality loses its categorical force. The Kantian tradition insists that moral obligations bind us regardless of our desires. If the callous man has no internal reason to stop being callous, then morality appears to be merely a system of hypothetical imperatives ("if you care about others, don't hurt them") backed by social sanction. This reduces the claim "you ought not to torture" to "society will punish you if you torture," which seems to miss the normative authority of the moral claim.

  Williams meets this by biting the bullet. He argues that the demand for categorical reasons is a philosophical confusion. When we tell the callous man he has a reason to stop, we are often bluffing. We are expressing our own hostility and our desire to change his $S$, not stating a metaphysical fact about his rationality. Williams suggests we should replace the language of "reasons" with the language of "blame." We blame the callous man not because he violated a rational norm he was bound to acknowledge, but because he lacks the motivations we require for social life. Our blame is a tool to modify his $S$, potentially creating an internal reason for him in the future through shame or sanction.

  The rationalist objection is that this renders morality too contingent. If reasons depend on $S$, then a sociopath is not irrational, merely different. This seems to abdicate the critical power of ethics.

  However, Williams's reply exposes the rationalist's own mystification. To say the sociopath has a "reason" he cannot acknowledge is to posit a reason that cannot explain action. Since the function of a practical reason is to figure in the explanation of why an agent acts (or could act), a reason that is permanently inaccessible to the agent's motivation is a ghost. Williams preserves the critical power of ethics by relocating it: ethics is not about aligning with cosmic rational norms, but about negotiating the demands of social life. The "authority" of morality comes from the intensity of our reactions and the necessity of cooperation, not from a transcendent source of reasons.

  ### Verdict: The Exhaustion of Practical Reason

  Weighing these considerations leads to a definite verdict: **Internal reasons exhaust the space of genuine practical reasons.** Williams's internalism is the only position that respects the link between reasons and agency without resorting to metaphysical fiction.

  The elasticity objection ultimately strengthens Williams's case rather than weakening it. It highlights that the boundary between internal and external is not where the rationalists think it is. The rationalists want to say that reason *itself* provides the anchor in $S$. Williams shows that "reason" is a tool for processing $S$, not a source of it. If the SDR seems elastic, it is because human motivational sets are rich and socially embedded, not because deliberation accesses external norms. We must accept that for the truly alienated agent, moral reasons may not exist. This is not a failure of the theory, but a recognition of the tragic limits of rational persuasion.

  Regarding the categorical objection, we must accept that morality's "categorical" nature is a feature of our social practices, not the metaphysics of reasons. To insist that the callous man has a reason he cannot feel is to divorce "reason" from its role in guiding action. It is better to admit that he has no reason, and that our response to him must be one of modification (education, sanction, therapy) rather than rational demonstration. This does not make morality less important; it makes it more human.

  Therefore, Williams is correct. External reason statements are false. They purport to describe a normative relation between an agent and an action that bypasses the agent's motivational psychology. No such relation exists. Practical reason is the servant of the subjective motivational set, refined by truth and imagination. If the set is barren, reason is silent. We should not mourn this loss of metaphysical security. It forces us to ground our moral claims in the actual contours of human life and sentiment, where they belong, rather than in a phantom realm of external obligations. Internalism survives not by stretching the deliberative route to capture the moralist's hopes, but by clarifying that reasons are essentially for *agents*, and an agent without a motivational hook has no reason to catch.
