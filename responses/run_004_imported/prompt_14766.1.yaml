      *   *The Worry:* If "reflection on commitments" or "imaginative rehearsal" is broad enough, doesn't everyone have a reason to be moral? If so, Internalism collapses into Externalism (or Rationalism).
      *   *Williams's Defense:* He insists there *are* amoralists. Some people truly lack the $S$-elements that connect to others' welfare. For them, there is no internal reason.
      *   *McDowell's Twist:* McDowell argues that virtue *changes* the $S$. A virtuous person sees reasons the non-virtuous don't. But McDowell uses this to save Externalism (or a hybrid). Williams thinks McDowell is blurring the line.
      *   *Analysis:* The elasticity charge is serious. If "rationality" includes substantive normative constraints on $S$, Internalism loses its Humean bite. If it's purely procedural, the callous man survives.

  4.  **Address Objection 2: The Categorical Pretensions of Morality:**
      *   *The Worry:* If the callous man has no reason to stop being callous, morality loses its authority. It becomes hypothetical ("if you care..."). Rationalists (Kantians) say reason *itself* generates reasons.
      *   *Williams's Defense:* He bites the bullet. Morality's "categorical" claim is often a confusion. We should focus on *blame* and *social pressure* rather than metaphysical "reasons." We can still criticize him, just not say he is *irrational* in a strong sense.
      *   *Analysis:* This is the hardest pill to swallow. It makes morality contingent on psychology.

