  4.  **Developing the Argument (Why Math Doesn't Settle Philosophy):**
      *   *Definition of Privacy:* Is privacy just secrecy? Or is it autonomy? Contextual integrity? DP protects against statistical inference, but what about contextual misuse? (e.g., I consent to medical research, not marketing, even if both are "private" in the DP sense).
      *   *The "Epsilon" Problem:* Who sets $\epsilon$? That's a value judgment, not a math problem. Is $\epsilon=0.1$ okay for census data but not for health data? Math can't answer that.
      *   *Group Privacy:* DP protects individuals. What about groups (ethnic minorities, as mentioned in the Census example)? Philosophers care about structural harm.
