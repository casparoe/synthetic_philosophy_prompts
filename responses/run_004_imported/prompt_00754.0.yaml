answer: |-
  This is a fantastic question, and your intuition is shared by many philosophers (specifically those known as "Libertarians" in the metaphysical sense, not the political one). It makes perfect sense from an engineering standpoint: if a system's output is a deterministic function of its prior state, it's locked in. If you introduce a true hardware random number generator (HRNG) based on quantum decay, you've broken the causal chain. Surely, you think, *that* break is where freedom hides.

  However, Galen Strawson and other skeptics of free will argue that swapping "causal necessity" for "random chance" doesn't actually buy you the one thing moral responsibility requires: **control.**

  Here is the breakdown of why Strawson insists the determinism/indeterminism distinction is beside the point, specifically tailored to your background.

  ### 1. The Control Condition vs. The Causal Condition
  Your intuition relies on the idea that moral responsibility requires the **Causal Condition** to be broken. You think: *"If my decision is fully caused by prior states I didn't choose, I'm not responsible. If it involves an uncaused event, the chain is broken, and I might be responsible."*

  Strawson argues that moral responsibility actually requires a **Control Condition**. To be responsible for an action, *you* must be in control of it.
  *   **Determinism:** The action is controlled by the past + laws of nature. (You lose control).
  *   **Indeterminism:** The action is partly controlled by... randomness. (You also lose control).

  From the perspective of agency, "randomness" and "external coercion" look surprisingly similar. If a neuron in your brain fires due to quantum decay rather than prior neural states, that firing is not *authored* by you. It just *happens* to you.

  **The Technical Analogy:**
  Imagine you are writing a security protocol.
  *   **Scenario A (Deterministic):** The system grants access based on a hardcoded password set by the manufacturer. You didn't set the password. You aren't responsible for the access decision.
  *   **Scenario B (Indeterministic):** The system grants access based on a quantum RNG. If `random() > 0.5`, grant access.

  In Scenario B, have *you* (the system administrator) gained responsibility for the access decision? No. The decision is now a matter of luck. If the system lets a hacker in, you can't say, "I chose to let them in." You have to say, "The dice rolled that way."

  Strawson's point is that for you to be morally responsible, the decision must flow from *you* (your character, values, intentions). If the decision flows from a random quantum event, it doesn't flow from *you*; it flows from nature's dice.

  ### 2. Why the Regress Doesn't Stop at Chance
  You suggested that if character formation involves genuine chance, the regress might terminate in "a bit of genuine chance" rather than "unchosen necessity," and that should count for something.

  Strawson would reply: **Terminating in chance doesn't grant ownership.**

  Let's trace the regress with your indeterministic model:
  1.  **Action:** You choose to steal the cookie.
  2.  **Source:** This choice came from your character (you are a "cookie-stealer type").
  3.  **Source of Character:** Your character was formed by earlier choices + some quantum noise.
  4.  **The Problem:** To be responsible for your character, you must be responsible for how those earlier choices and that quantum noise were integrated.

  If the "quantum noise" influenced your character, *you* did not choose how that noise influenced you. You didn't choose to be the kind of person whose brain interprets a quantum fluctuation as "go ahead and steal" rather than "don't steal."

  For the regress to stop and grant responsibility, you would need to be **_causa sui_** (cause of yourself). You would need to stand outside of your own mental architecture and say, "I choose to be influenced by this random noise in this specific way." But to make *that* choice, you would need a prior set of values to guide it... and we are back at the start of the regress.

  Whether the bedrock of your psyche is **rigid determinism** (genes/environment) or **random indeterminism** (quantum noise), it is still **unchosen**. In Strawson's view, "I didn't choose it" is the disqualifier for moral responsibility, regardless of whether the "it" is a rigid law or a random roll.

  ### 3. The "Intelligibility" Objection
  There is a second layer to Strawson's view, often called the **Intelligibility Objection**.

  For an action to be morally praiseworthy or blameworthy, it usually needs to be intelligible as an expression of *who you are*.
  *   If you save a child because you value life, we praise you. (Deterministic link between value and action).
  *   If you save a child because a quantum fluctuation in your motor cortex twitched your arm, we don't praise you. We call it a spasm or luck.

  If you inject indeterminism into the decision-making process to break the causal chain, you risk making the decision **arbitrary**. If your choice wasn't determined by your reasons, values, or desires, in what sense was it *your* choice? It was just an event that occurred in your vicinity.

  Strawson argues that indeterminism doesn't give you freedom; it gives you **noise**. And you are no more responsible for the noise in your head than you are for the noise in the environment.

  ### 4. Why Philosophers Treat the Distinction as "Beside the Point"
  To summarize why Strawson (and hard incompatibilists) dismiss the quantum rescue attempt:

  1.  **Responsibility requires authorship, not just uncausedness.** A radioactive atom decaying is "uncaused" in a deterministic sense, but we don't hold the atom morally responsible. It just happens.
  2.  **Luck is not Freedom.** If indeterminism is true, your choices are partly a matter of luck. But being "lucky" to have good impulses is not the same as being "virtuous" for having them.
  3.  **The Regress is about the Self, not the Physics.** Strawson's Basic Argument is structural. It asks: "Did you create the 'You' that is making the choice?" Whether the materials used to build that 'You' were laid down by deterministic bricks or indeterministic mortar doesn't matter. You didn't lay them.

  ### Is there a counter-argument?
  Yes, and since you work with RNGs, you might appreciate it. Some philosophers (like Robert Kane) argue that **efforts of will** can harness indeterminism. They suggest that when we struggle with a difficult moral choice, the tension in the brain creates a state where quantum noise *could* tip the scale one way or the other, but *whichever way it goes*, it will be an expression of our will because we were trying to choose both options.

  Strawson rejects this. He would say that if the noise tips the scale, the outcome is still not fully determined by the agent's prior state, and thus not fully controlled by the agent.

  ### Conclusion
  Your instinct comes from viewing "freedom" as **freedom from prior constraints**. In that sense, quantum indeterminism does provide freedom.

  But Strawson views moral responsibility as requiring **freedom as authorship**. In that sense, quantum indeterminism provides only randomness, not authorship.

  If you are a computer:
  *   **Determinism:** You are running a script written by someone else.
  *   **Indeterminism:** You are running a script where some lines are generated by random noise.

  In neither case are *you* the programmer. Strawson's Basic Argument concludes that since you cannot be the programmer of your own source code (without needing a prior programmer to write the programming logic), you can never be ultimately morally responsible. The distinction between "hardcoded" and "randomly generated" lines of code doesn't change the fact that *you* didn't write them.
