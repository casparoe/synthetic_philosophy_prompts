      *   Example: GWAS studies. Millions of SNPs. Tiny effects. $p < 5 \times 10^{-8}$. Are they "real"? Yes. Do they matter? Often no.
      *   Lindley's paradox warns us: "Just because you rejected the null doesn't mean the alternative you care about is true."

