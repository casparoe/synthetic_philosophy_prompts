      *   *Correction:* The p-value calculates $P(Data | H_0)$. The Bayes Factor compares $P(Data | H_0)$ to $P(Data | H_1)$.
      *   As $n \to \infty$, $P(Data | H_0)$ drops (because the likelihood narrows), *but* $P(Data | H_1)$ drops *faster* because the prior is spread so thin over the region where the likelihood is now concentrated.
      *   *Better phrasing:* The likelihood becomes a spike. Under $H_0$, the spike is centered on the hypothesis. Under $H_1$, the spike is centered on a value that the diffuse prior thinks is improbable (because it's too close to zero compared to the prior's scale).

  6.  **Addressing the "Replication Crisis" Question:**
      *   Don't overhype it. P-hacking is bigger.
