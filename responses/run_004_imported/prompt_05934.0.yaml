answer: |-
  This is one of those topics where the algebra is clean but the intuition feels slippery until it suddenly clicks. Your friend's "priors matter" answer is the technically correct bumper sticker, but it doesn't explain the *mechanics* of the crash.

  Here is the felt sense of what is happening, why it needs large $N$ to bite, and whether it's actually killing the replication crisis.

  ### 1. The Intuition: The "Shrinking Searchlight"

  To understand why large $N$ is the trigger, you have to stop thinking about the p-value as a measure of "truth" and start thinking about what a **fixed p-value** implies as sample size grows.

  **The Frequentist View (The Ruler)**
  Imagine you are measuring the length of a table.
  *   **Small $N$:** You have a wobbly ruler. To get a "significant" result (say, $p=0.05$), the table has to look *obviously* longer than the null hypothesis. The measurement error is huge, so the observed effect size must be large to stand out from the noise.
  *   **Large $N$:** You have a laser interferometer. Your measurement error is microscopic. To get that *same* $p=0.05$, the table only needs to be longer than the null by a hair's breadth.

  **The Crucial Insight:** Holding $p$ constant at 0.05 while increasing $N$ forces the **observed effect size to shrink toward zero.**

  In a small study, $p=0.05$ might mean an effect size of $d=0.5$ (a medium effect). In a massive biobank study, $p=0.05$ might mean an effect size of $d=0.001$ (a vanishingly tiny effect).

  **The Bayesian View (The Betting Bookie)**
  Now bring in the Bayesian setup for Lindley's Paradox.
  *   **$H_0$ (Null):** The effect is **exactly** zero.
  *   **$H_1$ (Alternative):** The effect is **not** zero. (Crucially, in the paradox setup, we assign a "diffuse" prior here. We say the effect could be anywhere from -10 to +10 with equal-ish probability).

  **The Collision:**
  1.  **Small $N$:** Your data says the effect is 0.5.
      *   $H_0$ says: "Whoa, that's far from 0." (Unlikely)
      *   $H_1$ says: "0.5 is right in the middle of my expected range." (Likely)
      *   **Result:** Bayes favors $H_1$. P-value and Bayesian agree.

  2.  **Huge $N$:** Your data says the effect is 0.001 (but because $N$ is huge, the p-value is still 0.05).
      *   $H_0$ says: "0.001 is incredibly close to 0. Given your measurement precision, this is totally consistent with me."
      *   $H_1$ says: "Wait. I told you the effect could be anywhere between -10 and +10. The probability density of landing *specifically* on 0.001 is tiny. I expected a real effect to be bigger than this noise floor."
      *   **Result:** The data looks *more* like "Exact Zero with noise" than "Random Non-Zero Value." The Bayes Factor swings to $H_0$.

  **Why Large $N$ is Required:**
  In small samples, the likelihood function (what the data says) is wide and fuzzy. It overlaps comfortably with the diffuse prior of $H_1$.
  As $N$ grows, the likelihood function turns into a razor-thin spike.
  *   If that spike lands on 0, $H_0$ wins easily.
  *   If that spike lands *just far enough away* to trigger $p=0.05$, it is in a "no man's land." It is too far from 0 for the Frequentist to ignore, but **too close to 0** to be plausible under a diffuse Alternative hypothesis.

  The paradox isn't that the data supports the null; it's that the data supports "Exactly Zero" more than it supports "Some Random Non-Zero Number." As $N \to \infty$, a $p=0.05$ result implies an effect size $\to 0$. Eventually, "Effect $\approx 0$" looks more like "Effect $= 0$" than "Effect $\sim \text{Wide Distribution}$."

  ### 2. Is This Driving the Replication Crisis?

  This is the million-dollar question. The short answer: **No, but it explains why we are disappointed by successful replications.**

  **What Lindley's Paradox is NOT:**
  It is not primarily a generator of False Positives (Type I errors) in the traditional sense. If the null is truly zero, a p-value of 0.05 is wrong 5% of the time, regardless of $N$. Lindley's paradox doesn't change the Frequentist error rate.

  **What Lindley's Paradox IS:**
  It is a detector of **Trivial Positives.**

  The replication crisis is fueled by two things:
  1.  **Bias/P-hacking:** Finding effects that don't exist. (Lindley doesn't help much here).
  2.  **The Significance Filter:** Publishing only $p < 0.05$.

  In the era of Big Data (GWAS studies, biobanks, massive A/B tests), we have entered the Lindley Zone. We have enough power to detect effects so small they are physically meaningless.
  *   **Scenario:** A drug lowers blood pressure by 0.01 mmHg. $p < 0.0001$ because $N=1,000,000$.
  *   **Frequentist Conclusion:** "Highly significant! The drug works!"
  *   **Bayesian (Lindley) Conclusion:** "The posterior probability that the effect is practically zero is near 1. Don't bother manufacturing this."

  **The "Replication" Twist:**
  Often, when a huge study finds a "significant" result that fails to replicate in a smaller study, it's not because the first study was a false positive. It's because the first study detected a **real but tiny effect** (Lindley style), and the second study didn't have the power to see it.
  *   Study 1 ($N=100k$): Finds effect = 0.01, $p=0.04$. (Significant!)
  *   Study 2 ($N=100$): Finds effect = 0.01, $p=0.60$. (Not Significant!)
  *   **Narrative:** "Replication Failure!"
  *   **Reality:** The effect is real, but Lindley's paradox warns us that in Study 1, the evidence for a *meaningful* effect was actually weak, even if the evidence against the *point null* was strong.

  ### 3. The "Gotcha" in the Paradox

  There is one caveat you should know so you don't walk away thinking Bayesians are always the wise sages here.

  Lindley's Paradox relies heavily on the **Sharp Null** ($H_0: \theta = \text{exactly } 0$) and the **Diffuse Alternative**.
  *   In physics, a sharp null makes sense (e.g., "Does this particle have mass?").
  *   In social science/biology, a sharp null is almost always false. Everything is correlated with everything else at some decimal place.

  If you tell a Bayesian, "Don't test if the effect is *exactly* zero. Test if the effect is *negligible* (e.g., $|\theta| < 0.1$)," the paradox largely disappears. The Bayesian then agrees with the Frequentist that a tiny effect in a huge sample is evidence of a tiny effect, not evidence of no effect.

  **So, is it underappreciated?**
  Yes, but not because people don't know the math. It's underappreciated because **researchers treat $p < 0.05$ as a binary "Discovery" switch.**

  Lindley's Paradox is the mathematical proof that **Statistical Significance $\neq$ Evidence for a Theory.**
  *   In small samples, a significant result is strong evidence that *something* is going on.
  *   In massive samples, a significant result is often just evidence that your sample size is huge.

  ### Summary for your friend
  Next time you talk to her, tell her this:
  "The paradox happens because fixing $p=0.05$ while growing $N$ forces the observed effect size to converge to zero. Eventually, the data looks more like 'Noise around Zero' ($H_0$) than 'A draw from a Wide Distribution of Non-Zero Effects' ($H_1$). It's not that the null becomes true; it's that the diffuse alternative gets punished for assigning low probability to the tiny effect sizes that huge samples detect."

  And regarding the replication crisis: It's not causing false positives, but it is causing **false hype.** It convinces us that microscopic, meaningless correlations are "significant findings" worthy of theory-building, simply because we have enough data to measure the dust motes.
