      *   *The "Point Null" Issue:* Acknowledge that the sharp null ($\theta=0$) is often unrealistic, which is why some Bayesians dislike the paradox setup. But for the sake of the paradox, it holds.
      *   *Replication Crisis:* Distinguish between "False Positive" (Type I error) and "True but Trivial." Lindley's paradox is about the latter. Big data finds everything significant. The crisis is partly about treating trivial findings as discoveries.

  5.  **Refining the Intuition (The "Searchlight" Analogy):**
      *   Let's try a searchlight analogy.
      *   $H_0$: The target is at coordinate 0.
      *   $H_1$: The target is somewhere between -100 and 100.
      *   Data: A measurement.
