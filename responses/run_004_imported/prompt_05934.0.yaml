  2.  **Part 1: The Intuition (Why Large $N$?):**
      *   *The Standard Explanation:* Bayes Factor = Likelihood Ratio $\times$ Prior Odds. As $n \to \infty$, the likelihood under $H_1$ spreads out.
      *   *The "Felt Sense" Explanation:* I need to focus on the *resolution* of the test.
      *   *Key Concept 1: The Shrinking Confidence Interval.* As $n$ increases, the standard error ($\sigma/\sqrt{n}$) shrinks. A fixed p-value (e.g., 0.05) corresponds to a specific number of standard errors away from the null (e.g., $z \approx 1.96$).
      *   *Key Concept 2: The Alternative Hypothesis ($H_1$).* In the paradox setup, $H_1$ is "the effect is *not* zero." But to calculate a Bayes Factor, we need a specific distribution for $H_1$ (the prior). Usually, this is a wide normal distribution centered at 0.
      *   *The Conflict:*
          *   Frequentist: "The estimate is 1.96 SEs away from 0. That's unlikely if $\theta=0$."
          *   Bayesian: "Okay, but look at your estimate. It's *tiny* (because SE is tiny). My $H_1$ prior says effects are usually bigger than this. Your data says the effect is basically zero, just not *exactly* zero. My $H_0$ says it is *exactly* zero. Your data looks way more like 'exactly zero' than 'some random non-zero value drawn from a wide distribution'."
      *   *Why Small $N$ doesn't show it:* With small $N$, the SE is huge. A $z=1.96$ result means the estimate is *large* in absolute magnitude. It fits well within a reasonable $H_1$ prior.
      *   *Why Large $N$ shows it:* With huge $N$, the SE is tiny. A $z=1.96$ result means the estimate is *microscopic*. It's technically non-zero, but it's so close to zero that it looks more like noise around a true zero than a genuine signal drawn from a distribution of meaningful effects. The diffuse prior assigns very low density to this microscopic region.
      *   *Analogy:* Archery.
          *   $H_0$: You are aiming at the bullseye.
          *   $H_1$: You are aiming somewhere else on the wall (diffuse).
          *   Small $N$ (Blurry vision): You hit near the bullseye, but vision is blurry. Could be aiming elsewhere.
          *   Large $N$ (Laser vision): You hit 1mm from the bullseye. Frequentist: "Not the bullseye!" Bayesian: "If you were aiming elsewhere, you wouldn't hit *this* close to the bullseye by accident. You must be aiming at the bullseye."

  3.  **Part 2: The Replication Crisis Connection:**
      *   *Is it a driver?* Yes, but maybe not the *main* driver compared to p-hacking or publication bias.
      *   *The "Big Data" Problem:* In biobanks ($N=500,000$), tiny, meaningless effects become $p < 0.05$.
      *   *Statistical Significance $\neq$ Practical Significance:* This is the real lesson. Lindley's Paradox highlights the conflict between "Is it exactly zero?" (Null) and "Is it meaningful?" (Alternative).
      *   *Nuance:* Most replication issues are false positives due to bias, not true effects that are Bayesian-null. However, the *interpretation* of large-sample significant results is exactly where Lindley's warning applies.
