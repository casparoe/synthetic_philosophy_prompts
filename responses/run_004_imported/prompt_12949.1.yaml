answer: |-
  The lab was quiet, save for the hum of the incubators and the rain tapping against the high, reinforced windows. It was late, the hour when the air conditioning seems to breathe louder than the people.

  Professor Vance sat at the central bench, polishing a spectrometer lens with a slow, circular motion. Elara stood by the sink, rinsing the beakers from their final run. Between them, on the steel countertop, sat the specimen: a cutting of *Aethelgard-4*, the vine that had consumed their last three years and, apparently, their professional relationship.

  "The nutrient uptake on the lower stalk is negligible," Vance said, not looking up from the lens. "We should prune the roots tomorrow. Focus the energy on the new growth."

  Elara paused, a beaker halfway to the drying rack. Water dripped from the rim, hitting the steel with a sharp *plink*. "The lower stalk isn't the root system, Professor."

  Vance stopped polishing. He held the lens up to the light, inspecting a smudge. "It's underground, Elara. It anchors the plant. It absorbs the substrate. By definition, it's the root."

  "It anchors, yes. But it doesn't absorb," Elara said, turning around. She dried her hands on her coat, the fabric rustling loudly in the quiet room. "Not anymore. Not since the atmospheric shift in week forty. The absorption is happening in the leaves."

  Vance lowered the lens. He looked tired, the kind of tired that settles in the bone. "The leaves are for photosynthesis. The roots are for intake. That is the taxonomy of vascular flora. If you want to publish, you have to use words that mean something to the review board."

  "I am using words that mean something to the plant," Elara said. She walked over to the specimen. It was a tangled mess of pale tubers below the soil line and vibrant, pulsing violet foliage above. "Look at the isotopic trace. The nitrogen-15 we introduced to the air? It's in the stalk. The nitrogen we put in the soil? It's sitting there, untouched. The underground structure is just a scaffold now. The leaves are the roots."

  Vance sighed, a short exhalation through his nose. He picked up a pair of shears. "If I cut the leaves, the plant starves. If I cut the underground structure, the plant falls over. Therefore, the underground structure is the root. Function follows form."

  "Function follows need," Elara corrected softly. "The plant redefined itself. I'm asking you to redefine the word."

  Vance stood up and walked to the specimen. He reached out, his fingers hovering over the violet leaves. To him, they were leaves. They were green—well, violet—but they were broad, flat, and oriented toward the light. They belonged to the category *Foliar*. To cut them would be to defoliate. To prune them would be madness.

  "If we list the leaves as the primary intake organ," Vance said, his voice measured, "then we are no longer studying a vine. We are studying... what? An algae? A fungus? The category collapses, Elara. If the root is in the air, then 'root' ceases to be a useful category. It becomes a metaphor."

  "It's not a metaphor," Elara said, feeling that familiar frustration rise, not hot, but cold. It wasn't that he was ignoring the data. He had seen the same isotopic traces she had. He had signed off on the same logs. It was that when he looked at the data, he saw an anomaly in a leaf. When she looked at the data, she saw a standard function in a root. They were looking at the same numbers, but they were sorting them into different boxes. "The category doesn't collapse. It expands. 'Root' isn't about location anymore. It's about interface. It's about where the self meets the non-self for exchange."

  Vance placed the shears back on the table. *Clink.* "In this lab, 'root' is about location. It is a spatial coordinate. Below the soil line. If you change the definition, you can't compare this specimen to the control group. You can't compare it to *Aethelgard-1*, or *2*, or *3*."

  "Because *1, 2, and 3* were different organisms," Elara said. "They were vines. This... this is something else. It crossed a threshold."

  "Then it's a new species," Vance said. "Fine. We classify it as a new species. But we keep the anatomy standard. We keep the language stable. Otherwise, we aren't doing science. We're writing poetry."

  Elara looked at the plant. She saw the violet veins throbbing slightly, drawing the air in. She saw the pale tubers below, dormant, dead weight. She tried to imagine calling the leaves "leaves" again, tried to force her mind to see them as solar collectors rather than mouths. It felt like trying to look at a duck and see a rabbit, once you'd already seen the rabbit. The lines of the drawing hadn't changed, but the shape had.

  "If I write the paper," Elara said, "I'm going to label the intake nodes as roots. Regardless of position."

  Vance turned back to the spectrometer. He picked up the lens cloth again. He didn't turn around. "Then I can't be listed as a co-author."

  "I know."

  "It's not about stubbornness, Elara."

  "I know."

  "If 'root' means 'intake node'," Vance said, his voice flat, reflecting off the glass of the incubators, "then the air filtration system in this room is a root. The water pipe is a root. I am a root. The word loses its boundary. If everything can be a root, nothing is."

  Elara walked back to the sink. She picked up a dry beaker and held it up to the light. It was clear, transparent, empty. But she knew that "empty" was just another word that had split between them. To him, it was a vacuum. To her, it was a field of potential.

  "The boundary isn't gone, Professor," she said to the glass. "It just moved. You're sorting by shape. I'm sorting by process."

  "I'm sorting by what we can agree on," Vance said. He began to polish the lens again. *Circle. Circle. Circle.* "We need to be able to point to a thing and name it, and have the other person see the same thing. If you point to a leaf and say 'root,' and I point to a tuber and say 'root,' we aren't colleagues anymore. We're just two people making noise in a room."

  Elara set the beaker down. She looked at the back of his head, the gray hair, the rigid set of his shoulders. He wasn't blind. He was just living in a world where the map still matched the territory, even though the territory had shifted. She was standing on ground he couldn't acknowledge without falling.

  "Goodnight, Professor," she said.

  "Goodnight, Elara. Don't forget to lock the incubator."

  She walked to the door. Her hand hovered over the light switch. She wanted to say something else, to bridge the gap, to find a word that hadn't fractured yet. But every word she thought of—*plant, life, growth, change*—felt heavy, loaded with the weight of the split.

  "Leave the light," Vance said, without turning. "I need to see the roots."

  Elara looked at the violet leaves pulsing in the dim glow of the safety lights. She looked at the pale, dead tubers in the dirt.

  "Okay," she said. "Goodnight."

  She closed the door. Inside, Vance continued to polish the lens, preparing to look at a world that was no longer there, using a language that no longer worked. Outside, Elara walked down the hall, knowing she would have to write the paper alone, in a language he would read as nonsense, describing a world he could not see.
