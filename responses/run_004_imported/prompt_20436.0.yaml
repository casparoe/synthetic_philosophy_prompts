answer: |-
  Priya is right. You can settle the bet: **Good's Theorem does not hold for Risk-Weighted Expected Utility (REU) maximizers.**

  In standard Expected Utility Theory (EUT), the linearity of the expectation operator guarantees that having more information never decreases your expected utility (you can always ignore it). However, REU theory replaces the linear probability weighting with a non-linear risk function $r(p)$. This non-linearity means that "bundling" probabilities in a single gamble can be valued differently than "splitting" those same probabilities across conditional gambles, even if the final material outcomes are similar. An REU maximizer can rationally prefer ignorance because looking at the evidence might force them into a local choice (ex-post) that fragments the probability distribution in a way their risk function penalizes heavily.

  Here is a fully concrete toy example where an REU-maximizer prefers to remain blind, while an EU-maximizer is indifferent (or strictly prefers looking in other variations).

  ### The Setup

  **1. Preferences**
  *   **Utility Function:** $u(x) = x$ (Linear utility, so all risk attitude comes from the risk function).
  *   **Risk Function:** $r(p) = p^2$.
      *   *Note:* This is convex, representing risk aversion in the REU sense (downweighting the probability of better outcomes).
  *   **REU Formula:** For outcomes $x_1 < x_2 < \dots < x_n$:
      $$REU = u(x_1) + \sum_{i=2}^n r(P(X \ge x_i)) \cdot [u(x_i) - u(x_{i-1})]$$

  **2. The Actions**
  *   **Action $S$ (Safe):** Pays **10** for sure.
  *   **Action $G$ (Gamble):** Pays **100** with probability $0.5$, and **0** with probability $0.5$.

  **3. The Information (Signal $E$)**
  *   You can observe a cost-free signal $E \in \{+, -\}$ before choosing.
  *   **Prior:** $P(State=High) = 0.5$. (If High, $G$ pays 100; if Low, $G$ pays 0).
  *   **Signal Structure:**
      *   $P(+) = 0.5$ and $P(-) = 0.5$.
      *   $P(High | +) = 0.8$. (Good news).
      *   $P(High | -) = 0.2$. (Bad news).
      *   *(Check: Total Prob of High = $0.5(0.8) + 0.5(0.2) = 0.5$. Consistent.)*

  ---

  ### Part 1: The "No Information" Choice
  You must choose between $S$ and $G$ without seeing the signal.

  *   **Value of $S$:**
      $$REU(S) = 10$$
  *   **Value of $G$:**
      Outcomes are 0 (prob 0.5) and 100 (prob 0.5).
      $$REU(G) = u(0) + r(0.5) \cdot [u(100) - u(0)]$$
      $$REU(G) = 0 + 0.5^2 \cdot 100 = 0.25 \cdot 100 = \mathbf{25}$$

  **Decision:** Since $25 > 10$, the REU-maximizer chooses **$G$**.
  **Baseline Value:** **25**.

  *(For an EU-maximizer, $EU(G) = 50$ and $EU(S) = 10$, so they also choose $G$.)*

  ---

  ### Part 2: The "Look First" Choice
  You commit to a plan: Observe $E$, then choose the best action conditional on the signal.

  **Step A: Ex-Post Decisions**
  *   **If Signal $+$:**
      *   Choose $S \to 10$.
      *   Choose $G \to$ 80% of 100, 20% of 0.
      *   $REU(G|+) = 0 + r(0.8) \cdot 100 = 0.64 \cdot 100 = 64$.
      *   **Choice:** Pick $G$ (since $64 > 10$).
  *   **If Signal $-$:**
      *   Choose $S \to 10$.
      *   Choose $G \to$ 20% of 100, 80% of 0.
      *   $REU(G|-) = 0 + r(0.2) \cdot 100 = 0.04 \cdot 100 = 4$.
      *   **Choice:** Pick $S$ (since $10 > 4$).
      *   *(Note: An EU-maximizer would still pick $G$ here, because $EU(G|-) = 20 > 10$. This divergence is crucial.)*

  **Step B: Ex-Ante Evaluation of the Plan**
  The plan "Look, then Choose" results in the following overall lottery:
  1.  **Outcome 100:** Occurs if Signal $+$ AND State High.
      *   Prob = $0.5 \times 0.8 = \mathbf{0.4}$.
  2.  **Outcome 10:** Occurs if Signal $-$ (Agent switches to Safe).
      *   Prob = $\mathbf{0.5}$.
  3.  **Outcome 0:** Occurs if Signal $+$ AND State Low.
      *   Prob = $0.5 \times 0.2 = \mathbf{0.1}$.

  **Calculate REU of this Plan:**
  Sorted outcomes: $0, 10, 100$.
  *   $P(X \ge 0) = 1$
  *   $P(X \ge 10) = 0.4 + 0.5 = 0.9$
  *   $P(X \ge 100) = 0.4$

  $$REU(\text{Plan}) = u(0) + r(0.9)[u(10)-u(0)] + r(0.4)[u(100)-u(10)]$$
  $$REU(\text{Plan}) = 0 + 0.9^2(10) + 0.4^2(90)$$
  $$REU(\text{Plan}) = 0.81(10) + 0.16(90)$$
  $$REU(\text{Plan}) = 8.1 + 14.4 = \mathbf{22.5}$$

  ---

  ### The Verdict

  *   **Value of Blind Choice ($G$):** 25
  *   **Value of Looking (Plan):** 22.5

  **The REU-maximizer prefers to remain blind.** They would rationally turn down the free information.

  *(For comparison, an EU-maximizer evaluates the Plan as: $0.4(100) + 0.5(10) + 0.1(0) = 45$. Since their blind choice $G$ is worth 50, they would actually realize looking leads them to make a "mistake" ex-post [switching to S when -], so they would stick with G regardless. In EU, info is never negative value; in REU, it is.)*

  ### Why This Happens
  The risk function $r(p) = p^2$ is convex. In the **Blind** case, the agent enjoys the "bundled" probability weight of the high outcome: $r(0.5) = 0.25$.

  In the **Look** case, the probability of the high outcome is fragmented. The agent only gets the high outcome if they see the good signal (prob 0.4). The risk weight on the best outcome drops to $r(0.4) = 0.16$. While the agent gains safety in the middle tier (the sure 10), the convex risk function penalizes the loss of probability weight on the top outcome ($0.25 \to 0.16$) more than it rewards the security of the middle outcome. The information forces the agent to "cash out" to a safe option in the bad state, which destroys the global risk profile they originally valued.
