      *   **The Illusionist (I):** Needs to be precise, avoiding dualist traps, focusing on functional roles and misrepresentation. Let's call him "Marcus." He represents the Frankish/Dennett camp.

  3.  **Key Philosophical Concepts to Weave In:**
