      *   *Specific Focus:* Ensure the "quasi-phenomenal" property distinction is clear. Frankish calls them "pseudo-phenomenal." The illusion is that we represent states as having phenomenal properties when they only have physical/functional properties.
      *   *The "Seeming" Regress:* This is the tricky part. Marcus needs to explain that "seeming" is transitive (X seems Y to S) but Illusionism treats the "to S" as a functional access relation, not a phenomenal witnessing.

  6.  **Writing the Dialogue (Iterative Process):**
