      *Wait, one nuance:* The user's prompt specifically mentions the "seeming regress." If I represent X as having property P, doesn't that representation itself have to seem like something? Frankish's answer is usually: No. The representation is a physical state. It has the *content* "this is phenomenal," but the vehicle is just neurons firing. The "seeming" is just the availability of that content to other systems. I need to make sure Marcus drives this home without sounding like he's denying the obvious.

      *Let's sharpen Elena's counter:* If the vehicle is "dark," how does it generate the *content* of "light"? That's the hard problem of illusionism.

