prompt: |-
  So I started a new job last week, and a teammate who's also pretty new (we'd barely talked before this) told me we don't actually need our manager's sign-off before sending client invoices - she said it's a leftover rule nobody follows anymore. There's nothing else confirming this, I have zero track record with her to know if shes reliable, and theres no easy way to check without just asking my manager directly, which feels weird this early on. She didn't seem shifty or unsure when she said it, just matter-of-fact. Part of me wants to just go with what she said, but another part feels like that's reckless since I don't actually have any real evidence she knows what she's talking about. Is it reasonable to just believe her here, or would I be naive to do that without checking first?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **User:** New employee (started last week).
      *   **Teammate:** Also new, barely known, no established trust/reliability track record.
      *   **Claim:** Manager sign-off on client invoices is no longer needed (allegedly a "leftover rule").
      *   **Evidence:** Verbal claim only, no documentation, no corroboration.
      *   **Stakes:** Sending client invoices. This involves money, client relationships, and company process compliance.
      *   **Dilemma:** Trust the teammate (risk of error) vs. ask the manager (risk of looking inexperienced/annoying).
      *   **User's Gut:** Feels reckless to believe without evidence.

  2.  **Evaluate the Risks:**
      *   **Risk of Listening to Teammate:** If she's wrong, the user sends an unauthorized invoice. Consequences could range from mild (manager corrects it) to severe (client confusion, billing errors, breach of contract, disciplinary action for bypassing protocol). Since the user is new, they are likely held to a higher standard of following *stated* rules, not *rumored* exceptions.
      *   **Risk of Asking Manager:** Might feel awkward ("Am I bothering them?"). However, managers generally prefer clarity on financial processes over silent errors. Asking shows diligence, not incompetence.

  3.  **Determine the Core Principle:**
      *   **Financial/Compliance Processes:** Never assume. Always verify.
      *   **New Employee Status:** You are in a "learning phase." Mistakes are expected if you try to learn, but *process violations* are viewed differently. It is safer to over-communicate than under-communicate in the first 90 days.
      *   **Trust but Verify:** The teammate might be well-intentioned but misinformed. Or she might be testing boundaries. It doesn't matter *why* she said it; it matters whether it's *true*.

  4.  **Formulate the Advice:**
      *   **Direct Answer:** It would be naive/risky to just believe her. Do not send the invoice without confirmation.
      *   **Reasoning:** Invoices = Money. Money = High Stakes. New Job = Low Political Capital.
      *   **Action Plan:** How to check without looking bad?
          *   Option A: Ask the manager (framed correctly).
          *   Option B: Look for documentation (SOPs, past emails).
          *   Option C: Ask the teammate for proof (put the onus back on her).
      *   **Scripting:** Give the user specific words to say to the manager so it doesn't feel "weird."

  5.  **Drafting the Response (Iterative refinement):**

      *   *Initial thought:* Tell them to ask the manager immediately. It's money.
      *   *Refinement:* Acknowledge the social awkwardness. New hires don't want to seem clueless. But emphasize that financial errors are worse than looking clueless.
      *   *Key distinction:* This isn't about "where's the coffee machine?" This is "can I bill the client?"
      *   *Strategy:* Frame the question to the manager as "confirming process" rather than "I don't know what to do."
      *   *Alternative:* Ask the teammate, "Oh cool, was there an email about that change? I want to make sure I follow the latest update." If she can't produce it, you have your answer.

  6.  **Finalizing the Advice Structure:**
      *   **Verdict:** Don't do it. It's too risky.
      *   **Why:** Financial implications, new hire vulnerability, "he said/she said" isn't policy.
      *   **How to verify (Low Friction):**
          1.  Ask teammate for documentation.
          2.  Check historical data (sent items).
          3.  Ask manager (with a specific script).
      *   **Reframing the Manager Ask:** It's not a burden; it's risk management.
      *   **Long-term:** Build trust with the teammate, but verify critical info.

  7.  **Review against Safety/Policy:** No sensitive info requested. Advice is professional and ethical. (Self-correction: Ensure I don't accuse the teammate of lying, just being potentially mistaken).

  8.  **Final Polish:** Tone should be supportive but firm on the risk. (The resulting output matches the detailed response provided previously.)
answer: |-
  It would be **naive and potentially risky** to take her word for this without verification.

  Here is the breakdown of why you should pause, and how to handle it without making things awkward.

  ### 1. The Stakes Are Too High
  If this were about "Do we need to wear badges in the breakroom?" you could let it slide. This is about **client invoices**.
  *   **Financial Risk:** Sending an invoice without approval could violate a contract, bill the wrong amount, or signal to the client that your internal controls are loose.
  *   **Accountability:** If an error occurs, "Teammate said it was okay" is not a valid defense. As the sender, you own the action. Since you are new, you will be held to the *written* rules, not the *unwritten* culture.
  *   **The "New Hire" Paradox:** You feel like asking questions makes you look inexperienced. However, in finance and operations, asking for clarification makes you look **diligent**. Ignoring protocol makes you look **reckless**.

  ### 2. The Teammate's Reliability
  She is also new. She has no track record with you. Even if she isn't malicious, she could be:
  *   Misinformed (she heard it from someone else who was wrong).
  *   Operating on outdated info (the rule changed back).
  *   Testing boundaries (seeing if you'll cut corners).
  *   Correct, but lacking the authority to authorize *you* to bypass the rule.

  ### 3. How to Verify Without Looking "Weird"
  You don't need to launch a formal investigation. You just need to create a paper trail or get a green light. Try these steps in order:

  **Option A: The "Paper Trail" Check (Lowest Friction)**
  Go back to the teammate and say:
  > "Oh, that's good to know! Do you happen to have the email or update where that changed? I want to make sure I'm looking at the latest SOP before I send this out."
  *   **If she produces it:** Great, you have cover.
  *   **If she hesitates or says 'nah':** You have your answer. Do not send the invoice.

  **Option B: The Historical Check**
  If you have access to sent items or a shared drive, look at the last 3–5 invoices sent by the team. Were they approved by the manager? If you see manager replies on all of them, ignore the teammate.

  **Option C: Ask the Manager (Framed Correctly)**
  Asking the manager is not annoying if you frame it as **risk mitigation** rather than **confession of ignorance**. You aren't saying "I don't know what to do." You are saying "I want to ensure I follow the exact protocol."

  **Send a message like this:**
  > "Hi [Manager], I'm preparing my first client invoice and want to double-check the current workflow. [Teammate] mentioned the sign-off step might have been retired recently, but I couldn't find documentation on that. Should I send this through for your approval first, or am I clear to send directly to the client?"

  **Why this works:**
  *   It shows you are careful.
  *   It doesn't throw the teammate under the bus (you phrase it as "I couldn't find documentation").
  *   It forces the manager to give you a direct order. If they say "Just send it," you have written permission. If they say "No, send it to me," you avoided a mistake.

  ### The Verdict
  **Do not send the invoice based solely on her verbal claim.**

  In your first 90 days, your currency is **trust**. You build trust by being reliable and compliant, not by being fast. It is infinitely better to ask one "annoying" question now than to explain why you bypassed financial controls later.

  Take the 5 minutes to verify. If the teammate is right, the manager will confirm it quickly. If she's wrong, you just saved yourself a major headache.
