answer: |-
  Good morning. Thank you all for being here.

  For forty years, my father's job was to calculate risk. He was an actuary. His life was dedicated to the certainty of uncertainty—mapping out probabilities, understanding end dates, and making sure the numbers added up. He was a man who trusted what could be measured, and he had very little patience for what couldn't.

  If you knew him, you know he was a lifelong agnostic. He didn't believe in heaven, he didn't believe in hell, and he certainly didn't believe in easy answers. If you tried to offer him religious comfort, he would likely have smiled politely and changed the subject to the weather or the traffic. He viewed death as a biological conclusion, the final zero on the bottom line.

  And yet, those of us who were closest to him in his last decade noticed a shift. It wasn't a conversion. He didn't start going to church. He didn't start praying. But the absolute certainty that death was the end began to soften. He became quietly, carefully convinced that there was more.

  I want to talk about this, not to proselytize, but because understanding *how* he came to that belief is the best way to honor the man he was. Because even in this, he was an actuary. He needed the logic to hold.

  As far as I can reconstruct from the books left on his nightstand, it started with a biography of the logician Kurt Gödel that he picked up at an airport. It ended with a much denser book by Hao Wang, titled *A Logical Journey*, which was left open on his desk when he died.

  From the notes he left in the margins, I've pieced together what captivated him. It wasn't the popular idea that mathematics can "prove" God. In fact, he was scrupulous about rejecting that. He actually wrote "NOT THIS" in capital letters next to a magazine clipping that claimed Gödel's Incompleteness Theorems proved the existence of an afterlife. He knew better. He knew you can't derive metaphysics from math formulas.

  What he fixated on instead was an argument Gödel made in private letters to his mother. It was a philosophical dilemma, and it went something like this:

  We have to ask if the world is fundamentally rational or not.

  If the world *is* rational, then it must be meaningful. But if we look at life as it is—where good people suffer, where effort is often unrewarded, where justice is rarely perfect—a single lifespan makes no rational sense. It doesn't add up. So, if the world is rational, there must be a continuation of existence to allow the equation to balance.

  But, he reasoned, what if the world is *not* rational? What if it is chaotic and absurd? If that is the case, then our human intuition that "death is the end" is just another part of that chaos. We cannot logically rely on it.

  So, he wrote in his notes: "Either way points toward more than one life."

  For a man like my father, this wasn't a comfort blanket. It was a conclusion. It satisfied his need for intellectual honesty. He wasn't looking for a heaven of clouds and harps; he was looking for a universe that didn't contradict itself. He found a way to believe in continuation without having to abandon his skepticism. He found a way to hope without having to pretend.

  I think this matters for us today, for all of us in this room.

  To his colleagues here: He remained the same rigorous thinker you knew. He didn't lose his edge; he just applied it to the final question.

  To his niece, who knows the philosophy: He respected the distinction. He didn't conflate logic with dogma. He walked the narrow path between them.

  And to the rest of us, his family, his friends, his grandchildren: What this tells me is that his hope was earned. It wasn't given to him by a tradition; it was built by him, brick by logical brick.

  There is a profound comfort in that for me. Because if my father believed in a continuation of existence, it wasn't because he was afraid of the dark. It was because he looked at the light we have here—the love he had for his family, the work he did, the quiet integrity he lived by—and he decided that it was too significant to simply vanish. He decided that a universe that produced a life like his must have a place for the memory of it to endure.

  He spent forty years calculating the value of a life for other people. In the end, he calculated the value of his own. And he decided it was positive.

  I don't know what comes next. I don't have his books, and I don't have his mind. But I have his example. He taught me that it is okay to question, it is okay to demand evidence, and it is okay to change your mind when the evidence shifts. He taught me that skepticism and love are not opposites. You can be hard-headed and soft-hearted. You can check the numbers and still feel the warmth.

  So, I am not going to say he is in a better place. I don't know if that's true. But I will say this: He is not gone. Not entirely.

  The logic he cherished suggests that the sum of a life is not contained solely in its duration. It is contained in its impact. And by that measure, the numbers are overwhelming. He is in the work he left behind. He is in the standards he held. He is in the people who loved him, and in the people we are because we knew him.

  He spent his life making sure things added up. I believe, finally, he found the balance he was looking for.

  Rest well, Dad. The calculation is complete. And it holds.

  Thank you.
