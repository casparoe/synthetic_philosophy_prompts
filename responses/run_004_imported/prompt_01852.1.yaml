      *   **The Incident & The Walk-Back:** Detail the salmon choking, the vision, the article, and the postscript. Highlight the "belief vs. attitude" distinction.
      *   **The Philosophical Autopsy:** Analyze the coherence.
          *   If survival is meaningless, experience can't support it.
          *   If experience supports it, survival must be meaningful.
          *   Ayer tried to have it both ways.
