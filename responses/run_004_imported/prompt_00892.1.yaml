answer: |-
  You have done excellent research on the historical convergence: Church, Kleene, and Turing did demonstrate the equivalence of their respective formalisms ($\lambda$-definability, general recursiveness, and Turing computability) by 1937. You are also correct that Gödel, initially skeptical of Church, was converted by Turing's 1936 paper because Turing provided a philosophical analysis of the *human computer*, not just a formal system.

  However, to answer your specific question: **No, a knowledgeable logician of that period would not have called this a "mathematical proof" that "effectively calculable" means "computable by a Turing machine."**

  If your protagonist says this flatly, a reader familiar with the history or philosophy of logic will spot it as a category error. Here is the substantive reason why, and how you can adjust the scene to maintain historical accuracy without losing the dramatic impact.

  ### 1. Theorem vs. Thesis: The Category Error
  The reason it is called the **Church-Turing Thesis** and not the **Church-Turing Theorem** is fundamental.

  *   **A Theorem** is a statement proven within a formal system using axioms and rules of inference.
  *   **The Thesis** is an identification between a *formal* definition (Turing machines) and an *informal* intuition ("effective calculability" or "what a human can calculate with paper and pencil").

  You cannot mathematically prove that a formal definition matches an intuitive concept, because the intuitive concept is not mathematically defined. To prove it would require a formal definition of "effective calculability" independent of Turing machines, which did not (and does not) exist.

  In 1937, the logicians knew this distinction. They viewed Turing's contribution not as a *proof*, but as a **conceptual analysis**. Turing argued that any human computing process must break down into simple steps involving a finite alphabet and a finite state of mind. Because his machines modeled *that* analysis, the identification was deemed "adequate," not "proven."

  ### 2. What They Actually Believed in 1937–1938
  While they wouldn't call it a proof, the mood among the Cambridge/Princeton circle was indeed one of resolution.

  *   **The Equivalence is a Theorem:** It was a proven mathematical fact that $\lambda$-definable functions = recursive functions = Turing-computable functions. Your protagonist *can* declare this settled for good.
  *   **The Identification is Compelling:** Gödel famously said that Turing's paper made the definition of "mechanical procedure" "completely general." He accepted it as the correct *definition*, but he never referred to the link between that definition and intuition as a theorem.

  ### 3. How to Fix the Dialogue
  You can keep the protagonist's confidence and the scene's pivotal nature by shifting the claim from "proof of intuition" to "collapse of formalisms" and "adequacy of analysis."

  **Avoid this:**
  > "It is a genuine mathematical proof that 'effectively calculable' simply means 'computable by a Turing machine.'"
  *(This is philosophically false.)*

  **Try something like this:**
  > "Church, Gödel, and Turing started from three different corners of the world. Lambda calculus, recursive functions, logical machines. And they have all collided in exactly the same place. The equivalence is proven. And Turing... Turing has shown that his machines capture the very limits of what a human mind can compute. There is no gap left. The definition holds."

  Or, if you want her to be slightly more aggressive about the "settled" nature:
  > "Gödel called Church's proposal unsatisfactory because it lacked a definition of computation. Turing gave him one. He analyzed the act of calculation itself—symbol by symbol, step by step. There is nowhere left for a counter-example to hide. It is not a theorem, no, but it is something better: it is the end of the question."

  ### 4. A Note on Dissent (For Realism)
  If you want to add texture to the scene, you might acknowledge that not *everyone* agreed.
  *   **L.E.J. Brouwer** and the **Intuitionists** in Europe had a different view on constructibility and effective methods.
  *   Some mathematicians felt that "effective calculability" might allow for processes that weren't strictly algorithmic in the Turing sense (though this view became fringe very quickly).

  If your protagonist says, "The matter is settled," an older, more cautious professor might reply, "Settled for Cambridge, perhaps. Ask Brouwer in Amsterdam if he accepts your machines as the limit of thought." This highlights the protagonist's youth and enthusiasm while acknowledging the historical reality.

  ### Summary
  *   **Can she say the three systems are equivalent?** Yes, that is a theorem.
  *   **Can she say Gödel was converted?** Yes, historically accurate.
  *   **Can she call the link to "effective calculability" a mathematical proof?** No. That violates the logical distinction between formal syntax and informal semantics, a distinction these logicians were obsessed with.

  By having her acknowledge that it is an **analysis** rather than a **proof**, you actually make her sound *more* like a brilliant logician of the period, as it shows she understands the philosophical weight of what Turing accomplished.
