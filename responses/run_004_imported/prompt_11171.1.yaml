  The question was:

  "In the Seventeenth Discussion of the Tahafut al-Falasifa, al-Ghazali attacks the philosophers' account of causal necessity (the fire/cotton example). (a) Reconstruct his argument in your own words. (b) Explain how his position compares to Hume's later skepticism about causation. (c) Does the text commit al-Ghazali to full occasionalism, or does it leave the question open?"

