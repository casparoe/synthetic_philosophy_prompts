answer: |-
  Here is a concrete, non-sci-fi example that isolates the mechanics of the Commitment Race. We'll strip away the multiverse stuff and look at two construction contractors fighting over a single job.

  ### The Scenario: The Asbestos Renovation Bid

  **The Agents:**
  *   **Alice:** A specialized abatement contractor.
  *   **Bob:** A general contractor who holds the building lease.

  **The Deal:**
  Bob needs Alice to clear a building so he can renovate it.
  *   **Value to Bob:** The renovated building is worth **$1,000,000**.
  *   **Cost to Alice:** This is the unknown variable. The building might have **Low Asbestos** (Cost: $200k) or **High Asbestos** (Cost: $800k).
  *   **Probability:** 50% chance of Low, 50% chance of High.
  *   **The Surplus:**
      *   If **Low**: Total surplus is $800k ($1M value - $200k cost). A deal is very easy.
      *   If **High**: Total surplus is $200k ($1M value - $800k cost). A deal is tight but possible.

  **The Mechanism: The "Public Ledger"**
  To prevent last-minute renegotiation, the city requires all bids to be filed on a Public Ledger.
  *   **Rule 1:** Once a price is filed, it is **binding**. You cannot change it.
  *   **Rule 2:** The first person to file sets the "Anchor." The second person must either **Accept** the filed price or **Walk Away**.
  *   **Rule 3:** If both file simultaneously (or before the other accepts), the Ledger treats it as a **Conflict**. If the numbers don't match, the deal is **Cancelled** automatically.

  **The Timeline:**
  *   **T=0 (The Commitment Phase):** Alice and Bob can file their prices *now*.
  *   **T=1 (The Information Phase):** The Asbestos Test Results come back (Low or High).
  *   **T=2 (The Execution Phase):** Work begins or the deal dies.

  ---

  ### The Gears: Why They Race

  Here is the step-by-step reasoning that leads to the disaster.

  #### 1. The Ideal Outcome (Cooperative Waiting)
  If Alice and Bob could trust each other to **wait until T=1**:
  *   They run the test.
  *   **Case Low:** They see cost is $200k. They negotiate a price of $500k. Bob pays $500k, Alice keeps $300k profit. Deal happens.
  *   **Case High:** They see cost is $800k. They negotiate a price of $900k. Bob pays $900k, Alice keeps $100k profit. Deal happens.
  *   **Result:** Deal happens 100% of the time. Total value created.

  #### 2. The Temptation (The First-Mover Advantage)
  Alice thinks: *"If I wait until T=1, Bob might file a price at T=0."*
  *   If Bob files at T=0, he has to guess the cost. He'll probably offer **$600k** (averaging the Low and High scenarios).
  *   If the test comes back **Low** ($200k cost), Alice is forced to accept Bob's $600k offer. She makes $400k profit.
  *   **But:** If Alice had filed first at T=0, she could have demanded **$800k**. If Bob accepts, she makes $600k profit (in the Low case).
  *   **Conclusion:** Filing *first* gives me the power to set the split. Filing *second* forces me to take what's left.

  Bob thinks the exact same thing. He wants to set the price low ($400k) before Alice can demand a high price.

  #### 3. The Race (T=0 Panic)
  Because "Filing First" yields a better profit split than "Filing Second," both agents are incentivized to file as early as possible.
  *   If Alice waits 1 hour to think, Bob might file in 30 minutes.
  *   If Bob waits 1 hour to think, Alice might file in 30 minutes.
  *   **The Equilibrium:** Both file **immediately at T=0**, before the Asbestos Test results are in. They are racing to commit *before* they have information.

  #### 4. The Commitments (Based on Ignorance)
  Since they file at T=0, they don't know the cost. They have to file based on *expected* value.
  *   **Alice's Logic:** "Expected cost is $500k. I need profit. I will file a demand of **$750k**."
  *   **Bob's Logic:** "Expected cost is $500k. I need surplus. I will file an offer of **$550k**."

  They both hit "Submit" at T=0.

  #### 5. The Blow-Up (T=1 Revelation)
  Now the Asbestos Test results come back at T=1.
  **Scenario: The test reveals LOW Asbestos.**
  *   **Actual Cost:** $200k.
  *   **Actual Value:** $1,000k.
  *   **Possible Deal Range:** Any price between $200k and $1,000k creates value.
  *   **Rational Outcome (if they had waited):** They would see the low cost and easily agree on $500k.

  **The Commitment Race Outcome:**
  *   The Ledger compares Alice's filing ($750k) and Bob's filing ($550k).
  *   **Conflict Detected:** $750k ≠ $550k.
  *   **Rule 3 Activates:** Because both committed early and their blind guesses didn't match, the deal is **Cancelled**.
  *   **Payoff:** $0 for Alice. $0 for Bob.

  ### Pinpointing the Failure Step

  The exact step where the system breaks is **Step 3: The Race to T=0.**

  Here is why this is a pathology of "locking in a policy":
  1.  **UDT Intuition:** "I should commit to a policy (a price) early so the other agent can't exploit my future knowledge."
  2.  **The Race:** "If I commit early, I get leverage. But if *you* commit earlier, *you* get leverage. Therefore, I must commit *earlier than you*."
  3.  **The Limit:** The limit of "earlier than you" is **before information arrives.**
  4.  **The Error:** By racing to commit *before* the Asbestos Test, they convert a **Negotiation Problem** (where they can split the surplus flexibly based on reality) into a **Coordination Problem** (where they must match blind guesses).

  In the **Low Asbestos** case, the "Commitment Race" destroyed $800,000 of value.
  *   If they had **waited** (re-optimized with info), they would have seen the cost was low and dealt.
  *   Because they **raced** (locked in policy without info), they locked in incompatible positions ($750k vs $550k) that couldn't be updated when the truth came out.

  ### Summary of the Mechanic
  The Commitment Race isn't about being stubborn; it's about **trading information for leverage.**
  *   **Leverage:** Committing first forces the other person to react to you.
  *   **Information:** Waiting lets you see the true state of the world.
  *   **The Trap:** In a competitive setting, everyone chases Leverage. They all sacrifice Information. When everyone sacrifices Information, the Leverage cancels out (because everyone is "first" in their own head), but the Information is gone forever. You end up with two rigid, incompatible policies based on guesses, rather than one flexible deal based on facts.
