answer: |-
  This is one of those distinctions that looks like semantic hair-splitting until you realize it cuts directly to the ontology of agency. You are right to suspect that both camps (the coherence theorem hardliners and the shutdown-problem softeners) are leaning on the same mechanical intuition—that a money pump requires a naive victim—but they disagree on *what kind of agent* survives the pump without becoming an Expected Utility (EU) maximizer over outcomes.

  Let's ground this. I will walk through the **Cyclic Money Pump** (the cleanest case) node-by-node for Naive, Sophisticated, and Resolute agents. Then I will give you my verdict on whether this rescues non-EU preferences or just hides the EU structure in a basement.

  ### The Setup: The Cyclic Pump

  Imagine an agent with intransitive preferences over three states: $A \succ B$, $B \succ C$, and $C \succ A$.
  To make it a pump, we introduce a sequence of trades with a small transaction cost $\epsilon$.

  *   **Start:** Agent holds $A$.
  *   **Node 1:** Offered trade $A \to B$ for cost $\epsilon$. (Local pref: $B \succ A$, so $B - \epsilon \succ A$).
  *   **Node 2:** Offered trade $B \to C$ for cost $\epsilon$. (Local pref: $C \succ B$, so $C - \epsilon \succ B$).
  *   **Node 3:** Offered trade $C \to A$ for cost $\epsilon$. (Local pref: $A \succ C$, so $A - \epsilon \succ C$).

  If the agent takes all three trades, it ends up with $A - 3\epsilon$. It has paid to go in a circle.

  ---

  ### 1. Naive Choice (The Victim)
  The Naive agent optimizes locally at every node, assuming its future self will follow its *current* plan, but failing to realize its future self will re-optimize based on *future* preferences.

  *   **At Node 1:** Plans to take Trade 1, then stop (because it knows $A \succ C$). But it mistakenly thinks Future Self will obey this plan. It takes Trade 1. State: $B - \epsilon$.
  *   **At Node 2:** Re-evaluates. Locally prefers $C$ to $B$. Ignores past plan. Takes Trade 2. State: $C - 2\epsilon$.
  *   **At Node 3:** Re-evaluates. Locally prefers $A$ to $C$. Takes Trade 3. State: $A - 3\epsilon$.
  *   **Result:** Pumped.

  ### 2. Sophisticated Choice (Hammond)
  The Sophisticated agent knows it cannot bind its future self. It uses **backward induction**. It asks: "Given what my future self *will* actually do (based on its local preferences), what is the best move for me *now*?" It treats its future selves as independent players in a game.

  *   **At Node 3:** Holds $C - 2\epsilon$. Local pref: $A \succ C$. Will trade. **Outcome:** $A - 3\epsilon$.
  *   **At Node 2:** Holds $B - \epsilon$.
      *   Option Stop: Keep $B - \epsilon$.
      *   Option Trade: Leads to Node 3, where Future Self will trade to $A - 3\epsilon$.
      *   Comparison: Does it prefer $B - \epsilon$ or $A - 3\epsilon$?
      *   Since $A \succ C \succ B$, for small $\epsilon$, $A - 3\epsilon \succ B - \epsilon$.
      *   **Decision:** Trade.
  *   **At Node 1:** Holds $A$.
      *   Option Stop: Keep $A$.
      *   Option Trade: Leads to Node 2, where Future Self will Trade, leading to Node 3, where Future Self will Trade. Final outcome: $A - 3\epsilon$.
      *   Comparison: Does it prefer $A$ or $A - 3\epsilon$?
      *   Obviously $A \succ A - 3\epsilon$.
      *   **Decision:** **Refuse Trade 1.**
  *   **Result:** Not pumped. Ends with $A$.

  **The Catch:** Sophistication avoids the pump through **paralysis**. The agent refuses the first trade not because it prefers $A$ to $B$ (it doesn't; $B \succ A$), but because it *distrusts* its future self. It sacrifices a locally preferred move ($A \to B$) to avoid a globally disastrous trajectory. In more complex environments, Sophistication leads to "dynamic inconsistency" where the agent cannot pursue any long-term plan that requires future flexibility. It is rational in the game-theoretic sense (Subgame Perfect Equilibrium), but it is strategically crippled.

  ### 3. Resolute Choice (McClennen)
  The Resolute agent makes a plan at $t_0$ and treats that plan as binding at $t_1$, even if local preferences change. It does not view future selves as independent players; it views them as limbs of the same body.

  *   **At Node 1 (Planning):** Evaluates all complete trajectories.
      *   Path 1 (Stop): End at $A$.
      *   Path 2 (Trade 1, Stop): End at $B - \epsilon$.
      *   Path 3 (Trade 1, Trade 2, Stop): End at $C - 2\epsilon$.
      *   Path 4 (Trade 1, 2, 3): End at $A - 3\epsilon$.
      *   *Wait, a Resolute agent with cyclic preferences still has a problem:* If preferences are truly cyclic over outcomes, there is no "best" path. $A \succ B \succ C \succ A$.
      *   *Correction for Resolute to work:* Resolute Choice is usually invoked to save **time-inconsistent** preferences (like Hyperbolic Discounting), not necessarily cyclic ones. In the Allais/Cyclic case, Resolute Choice requires the agent to have a **meta-preference** over plans that breaks the cycle.
      *   Let's assume the agent resolves to "Maximize wealth" or "Avoid cycles." It forms a plan: **Trade 1, Trade 2, Stop.** (Ending at $C - 2\epsilon$).
      *   Why this plan? Perhaps $C$ is the "peak" of the cycle before it crashes back to $A$.
  *   **At Node 2:** Holds $B - \epsilon$. Local preference screams "Trade to $C$!" (which fits the plan) but then at Node 3 local preference will scream "Trade to $A$!" (which violates the plan).
      *   A Resolute agent at Node 3 would **Refuse Trade 3**, even though $A \succ C$ locally, because it is adhering to the plan formed at Node 1.
  *   **At Node 1:** Knowing it will stick to the plan, it takes Trade 1.
  *   **Result:** Not pumped (assuming the plan was chosen to avoid the cycle).

  **The Catch:** Resolute Choice requires **commitment power**. It posits that the agent *can* ignore its local utility function at $t_2$ in favor of the global utility function at $t_1$.

  ---

  ### The Verdict: Is This a Rescue?

  You asked me to pick a side. Here it is:

  **Resolute Choice does not rescue non-EU preferences; it reveals that the agent was an EU maximizer all along, just over a different domain.**

  Sophisticated Choice is the honest description of an agent with genuinely inconsistent preferences over outcomes. As we saw, it avoids the money pump only by refusing to engage in trades it locally desires. It is diachronically "safe," but it is not diachronically *rational* in the sense of being able to pursue optimal trajectories. It leaves value on the table (the $B - \epsilon$ outcome) because it lacks self-trust. It is a damaged agent.

  Resolute Choice, however, is often sold as "keeping non-EU preferences while avoiding the pump." **This is a sleight of hand.**

  If an agent can successfully employ Resolute Choice, it implies the existence of a **meta-utility function** over *policies* (or trajectories) that is consistent, even if the local utility function over *outcomes* is not.
  1.  To be resolute, the agent must prefer "Plan X" to "Plan Y" at $t_0$.
  2.  To stick to Plan X at $t_2$ despite local pressure to deviate, the agent must value "Adhering to Plan X" more than "Satisfying Local Preference at $t_2$."
  3.  This means the agent's *true* utility function is defined over **histories** or **policies**, not just terminal states.
  4.  If the utility function over policies is consistent (acyclic), then **the Coherence Theorems still apply.** The agent is an Expected Utility Maximizer, just one whose utility depends on the path taken, not just the destination.

  **Why this matters for Alignment (and the Shutdown Problem):**

  The Alignment Forum pushback you mentioned (e.g., from the "Corrigibility" or "Shutdown" literature) often hopes that we can build agents that are "resolute" about letting us shut them down, even if their goal structure would otherwise incentivize preventing shutdown.

  *   **The Hope:** We can give the agent a "nice" local preference structure that isn't a pure EU maximizer (maybe it has incomplete preferences), and rely on Resolute Choice to keep it safe.
  *   **The Reality:** If the agent is truly Resolute, it is maximizing *something* consistently. If that "something" includes "do not manipulate the shutdown button," then it is an EU maximizer with a penalty term for manipulation.
  *   **The Danger:** If you try to build a Resolute agent *without* giving it a consistent utility function over policies (i.e., you just tell it "be resolute" but give it cyclic drives), the resolution mechanism has no anchor. Why be resolute about *this* plan and not *that* one? Without a consistent meta-preference, "Resolute Choice" is just a label for "magic willpower."

  **Conclusion:**

  Sophisticated Choice admits the agent is broken (intransitive) and limits its behavior to avoid exploitation. It saves the agent from losing money, but not from being unable to act.

  Resolute Choice saves the agent's competence, but only by promoting it to an EU maximizer over policies. It does not allow you to have your cake (inconsistent preferences) and eat it too (diachronic rationality).

  **The Coherence Theorems win.** You cannot have an agent that is (1) diachronically rational (unpumpable), (2) capable of pursuing complex plans (resolute), and (3) has genuinely inconsistent preferences over outcomes. If it satisfies (1) and (2), it effectively satisfies EU maximization over a sufficiently rich domain. The "Resolute" agent isn't a counterexample to coherence theorems; it's a confirmation that rational agency *requires* a consistent ordering *somewhere* in the architecture. If it's not over outcomes, it must be over policies.

  So, when you see Alignment researchers proposing "non-EU agents" that are nonetheless safe and effective via resolution, treat it as shorthand for "EU agents over trajectories." If they literally mean inconsistent preferences held together by willpower, they are relying on a mechanism (Resolute Choice) that has no decision-theoretic grounding other than "and then it doesn't lose."
