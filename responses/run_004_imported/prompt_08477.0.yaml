  7.  **Final Polish:** Check formatting, clarity, and ensure the recommendation is actionable. (Make sure to explicitly mention the DSM-5-TR Prolonged Grief Disorder nuance).

  8.  *(Final thought)*: The prompt asks to "get into" the philosophy of psychiatry. I need to make sure I explicitly mention the debate around medicalizing grief (Horwitz & Wakefield style arguments) to satisfy that constraint.

