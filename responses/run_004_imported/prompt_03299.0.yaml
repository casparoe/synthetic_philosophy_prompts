answer: |-
  The machine didn't look like much. It was a box of brushed steel and fiber-optic cabling, humming with a sound that sat just behind the eyes. Elias sat in the chair opposite it, his hands clasped so tightly his knuckles were white.

  "Remember," said Dr. Aris, her fingers hovering over the console. "The Tuner doesn't move you. It doesn't even move *information*, strictly speaking. It aligns your perception with a causal branch that diverged from ours. You are looking through a window, Elias. Not opening a door."

  "I know the specs," Elias said. His voice was rough. He hadn't slept in three days. Not since the ice on the road, the skid, the tree. Since Sophie.

  "Right. We're targeting the branch where the car maintained traction. Probability weight is high. It's a near neighbor." Aris pressed a key. "Initiating lock."

  The screen flickered. Static washed out into a image that sharpened slowly, like a developing photograph. It was a kitchen. Sunlight hit a checkered tablecloth. Elias stopped breathing. He knew that tablecloth. He'd bought it at a market in Vermont five years ago. In this world, it was stained with coffee. In his world, it was in a box in the basement, packed away after the funeral.

  A girl walked into the frame. She was wearing a yellow raincoat. She was humming.

  "Sophie," Elias whispered. He reached out, his fingers hovering inches from the screen. She looked up, laughing at something off-camera. She looked healthy. She looked alive. The relief that hit him was physical, a warm rush that nearly knocked him out of the chair. She was okay. Somewhere, she was okay.

  "Wait," Aris said softly. "Look at the metadata."

  Elias tore his eyes away from Sophie. On the side of the screen, a cascade of numbers scrolled. "What am I looking for?"

  "Identity markers. We need to confirm the causal link." Aris tapped a glass panel. "In this branch, the accident didn't happen. But that means the history of the people in it is different. Look at the man pouring the orange juice."

  Elias looked. A man stood by the counter. He had Elias's nose. He had Elias's gray streak in his hair. He was wearing Elias's favorite flannel shirt. He turned and smiled at Sophie, handing her a glass.

  "That's me," Elias said.

  "That is a counterpart," Aris corrected. "Biologically, he shares your origin. Psychologically, he shares your memories up to the point of divergence. But he is not you. He never lost her. He never grieved. He is a man who got lucky."

  Elias felt a cold knot tighten in his stomach. "He's holding her. He's her father."

  "He is *a* father. To *a* Sophie."

  "Why does it matter?" Elias snapped. "She's alive. He's me. It's the same thing."

  "Is it?" Aris zoomed the image. The numbers on the side spiked red. "Here is the problem with the Tuner, Elias. We assume identity is a straight line. We assume that for every person here, there is one person there who is 'them.' But the math doesn't always work that out."

  She highlighted two figures in the background of the kitchen. They were blurred, standing in the hallway, talking.

  "Who are they?"

  "Scan says they are both you."

  Elias blinked. "What?"

  "In this specific branch, the divergence point wasn't just the car crash. It was a job offer you got six months prior. In this world, you didn't just take the job or not take the job. The simulation suggests a psychological split. One version of you took the job in Chicago. One version stayed here. Both have equal claim to the past. Both have equal biological continuity with the Elias sitting in this chair."

  On the screen, the man at the counter—the one with the juice—was the 'Stayed' version. But the man in the hallway... he looked tired. He looked like the Elias of *this* world. He looked like a man who had lost something.

  "So," Elias said, his voice trembling. "Which one is me?"

  "Neither. And both. That's the nature of the reflection." Aris turned to him, her expression sympathetic but clinical. "If you are the one who stayed, the Sophie at the table is your daughter. If you are the one who left, she is your niece, or a stranger. But the machine can't distinguish which 'you' is the primary anchor. The connection is fuzzy."

  Elias looked back at the girl in the yellow raincoat. She was drinking her juice. She wiped a drop from her chin.

  "If I'm the one who left," Elias said, "then she isn't mine. She's just... some girl who looks like her."

  "And if you're the one who stayed?"

  "Then I'm him. I'm the guy at the counter." Elias pointed at the screen. "But I'm not. I'm here. I remember the funeral. I remember the ice. He doesn't. He has no idea what it costs to keep her alive."

  "Exactly," Aris said. "If you claim him, you have to claim his life. You have to claim you never suffered. But you *did* suffer. You are the grieving father. He is not. So how can you be the same person?"

  Elias felt the warmth of the relief curdle into something hollow. He looked at the man at the counter. The man was laughing. He looked light. Unburdened.

  "If I tell myself that's me," Elias said, "I'm lying. Because I know what it feels like to bury a child. He doesn't. We can't be the same."

  "And if you tell yourself he's a stranger?"

  "Then she's a stranger." Elias watched Sophie turn away from the table. "If he's just a guy who looks like me, raised a girl who looks like Sophie... then she's not my daughter. She's just a coincidence. A biological echo."

  The screen flickered again. The 'Hallway Elias' walked into the kitchen. He looked at 'Counter Elias'. They nodded at each other. Two men, same face, different histories, occupying the same space in a way that made Elias's head spin.

  "The system is flagging a conflict," Aris said. "The counterpart relation isn't one-to-one. It's one-to-many. You have two shadows there, Elias. Which one gets to be the father?"

  Elias looked at the girl. She was walking toward the camera now, drawn by the light of the lens she couldn't see. She looked right at him. For a second, he thought she knew him. He thought she felt the pull of the grief across the void.

  But she just smiled at the camera, thinking it was a toy, and ran out of the room.

  The man at the counter called after her. "Don't forget your shoes!"

  The man in the hallway checked his watch and left.

  Elias sat in the silence of the lab. The hum of the machine was the only sound.

  "Turn it off," Elias said.

  "Elias, we can try to stabilize the anchor. We can try to isolate a single branch—"

  "Turn it off."

  Aris hesitated, then hit the kill switch. The screen went black. The reflection of Elias's face appeared in the dark glass. He looked tired. He looked like a man who had buried his daughter.

  "It doesn't help, does it?" Aris asked quietly.

  "I wanted to know she was okay," Elias said. "But if that's not me... if that's just some lucky bastard who looks like me... then she's not my Sophie. She's just a girl who didn't die."

  "And if it *was* you?"

  "Then I'm a liar," Elias said, standing up. "Because I remember the dirt on the coffin. He doesn't. If I say that's me, I'm saying my grief doesn't matter. I'm saying I could just be him, if I squinted hard enough."

  He walked to the door. He stopped with his hand on the frame.

  "Humphrey lost," Elias said, mostly to himself.

  "Excuse me?"

  "Nothing." Elias opened the door. The hallway outside was gray, sterile, real. "Keep your machine. I'd rather be the only me there is."

  He walked out, leaving the dark screen behind. In the black glass, his reflection remained for a moment, singular and alone, before the lights flickered and it vanished.
