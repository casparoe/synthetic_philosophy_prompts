      *   *Wait, simpler is better for word count.* Let's focus on the "Humphrey" feeling. Elias sees Mara. He feels joy. Then he realizes that *his* Mara is dead. The one on screen has his memories up to the crash, then diverged. Is she a stranger?
      *   *Let's incorporate the "Two Matches" wrinkle specifically.* In the target world, there are two girls who could be Mara. One has the scar, one has the name. The machine can't decide. This shows the arbitrariness of "counterpart."

      *(Self-Correction)*: Let's try to make it more about the *comfort*. Elias wants to know if *he* is happy in the other world. The machine shows him a world where the accident didn't happen. But it shows *two* men who fit his profile. One stayed with his wife, one left. Both are equally "Elias" by the machine's metrics (memory overlap, physical continuity). If the machine says "You are happy there," which "You" is it?

