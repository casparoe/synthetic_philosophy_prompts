answer: |-
  The sonar room smelled of ozone and stale coffee, a scent that had soaked into the bulkheads over the six weeks of the survey. Commander Halloway sat alone at the primary console, the glow of the screen painting his face in pale, sickly greens.

  On the display was the Channel. A narrow corridor through the Devil's Teeth, a minefield laid during the war that had never been fully mapped. His job was simple: verify the safe passage so the supply subs could get through.

  The verification list scrolled on the left. One thousand coordinates. One thousand depth readings. One thousand magnetic variance checks.

  Halloway clicked the first item. *Coordinate 45-North, 12-West.*
  The sensor sweep popped up. Clean seabed. No metallic signature. Water depth sufficient.
  Halloway believed it. He had calibrated the sensors himself. He had run the diagnostic twice. He knew, with the solid, heavy certainty of a man who has checked the math, that *this* specific patch of ocean was safe. He marked it green.

  He clicked the second. *Coordinate 45-North, 12-West-Plus-One.*
  Clean.
  He believed this one too. The sensor didn't lie. The readout was clear. He marked it green.

  He worked his way down the list. It took him four hours. His eyes burned. His back cramped. But for every single click, the ritual was the same. The data appeared. The data was perfect. His confidence was absolute. He believed, of Coordinate 342, that it was safe. He believed, of Coordinate 891, that it was safe. He believed it of every single entry. There was no hesitation. The evidence was right there, pixel-bright.

  When he reached the bottom of the list, one thousand green checkmarks stared back at him. The column was a solid wall of validation.

  Then he opened the statistical summary window.

  It showed the error rate for the sensor array. 0.2%. A miracle of engineering. Better than anything else in the fleet. But there were one thousand data points.
  One thousand multiplied by 0.002.
  The expected value of errors was two.

  Halloway sat back. The chair creaked.
  He looked at the list. He knew, with the same heavy certainty, that the list contained a lie.
  He knew that somewhere in that column of green, there was a red mark hiding. He knew that somewhere in that corridor, there was a mine.
  He didn't know where. He couldn't know. If he could point to Coordinate 512 and say, "That one is the mine," he would re-scan it. He would check it again. And if he checked it again and it came up clean, he would believe it was clean.

  So he was stuck.
  He held two thoughts in his head, and neither would yield.
  Thought One: *Every single coordinate on this list is safe.*
  Thought Two: *At least one coordinate on this list is not safe.*

  They crashed against each other like tide against cliff. Neither broke.

  The door behind him hissed open. Lieutenant Rourke stepped in, holding a clipboard. "Ready to sign off, Commander? The *Aegis* is waiting on the surface."

  Halloway didn't turn around. "Look at the screen."

  Rourke stepped up, squinting at the green column. "Looks clean. Perfect run."

  "It's not clean," Halloway said. His voice sounded flat, deadened by the room's acoustic paneling. "Statistically, there are two mines in that channel."

  Rourke frowned. "But the sensors cleared them."

  "The sensors are 99.8% accurate. That means they are wrong twice in a thousand."

  "So which ones?" Rourke asked, pen hovering over the clipboard. "Point them out. We'll send a drone to double-check."

  Halloway finally turned. He looked at Rourke, and he saw the confusion in the lieutenant's eyes. Rourke thought this was a problem of identification. He thought if they just looked hard enough, they could find the bad apples.

  "I can't point them out," Halloway said.

  "Why not?"

  "Because look at Coordinate 104." Halloway tapped the screen. "Is it safe?"

  Rourke looked. "Sensor says yes."

  "Do you believe the sensor?"

  "Yes, Commander. We calibrated it."

  "So Coordinate 104 is safe."

  "Yes."

  Halloway scrolled down. "Coordinate 755?"

  "Safe."

  "Coordinate 990?"

  "Safe."

  Rourke shifted his weight. "Commander, you're asking me if I believe the data. I do."

  "Good. So you believe every coordinate is safe."

  "Yes."

  "But you also know the error rate."

  Rourke paused. "Yeah. So there's probably a mistake."

  "So you believe every coordinate is safe," Halloway said, "and you believe not every coordinate is safe."

  Rourke blinked. "I believe... I believe we should proceed with caution."

  "That's not an answer, Lieutenant." Halloway turned back to the console. "I have verified every claim. I am justified in believing every claim. But I am also justified in believing the conjunction of those claims is false."

  "English, Commander."

  "It means I know the path is clear," Halloway said. "And I know the path is blocked. And I have to sign the order that says the path is clear."

  Rourke was silent for a moment. The hum of the servers filled the gap. "If you know it's blocked, you can't sign."

  "If I don't sign, the *Aegis* doesn't eat. The station doesn't get oxygen. We stay down here until the batteries die."

  "So sign," Rourke said. "Trust the sensors."

  "I do trust the sensors," Halloway snapped. "That's the problem. I trust them enough to know each individual reading is true. And I trust them enough to know the collection is false."

  He looked at his hand. It was hovering over the haptic pad. To sign was to assert: *All coordinates are safe.*
  To believe the statistics was to assert: *Not all coordinates are safe.*

  He couldn't resolve it. He couldn't say, "Well, maybe Coordinate 400 is the wrong one." Because looking at Coordinate 400, he saw only safety. To doubt it specifically would be to ignore the evidence in front of him. But to accept it fully was to ignore the math.

  He was rational. He was precise. And he was holding a contradiction in his mind like a hot coal.

  "Commander," Rourke said softly. "The *Aegis* is waiting."

  Halloway closed his eyes. He visualized the channel. He saw the thousand green lights. He saw the two dark spots hidden inside them, invisible, indistinguishable from the light. He loved the truth of the lights. He loved the truth of the dark spots.

  He couldn't make them match. He could only carry both.

  He opened his eyes. He placed his palm on the pad. He didn't try to fix the feeling. He didn't try to convince himself that the risk was negligible. He didn't try to pretend the error wasn't there. He let the certainty of the individual facts sit on top of the certainty of the collective error, layering them until the pressure was immense.

  He pressed down.

  *Order Confirmed.*

  "Send it," Halloway said.

  "Sir," Rourke hesitated. "Are you sure?"

  Halloway looked at the screen. The green column remained. The statistical probability remained. The vertigo spun in his gut, a quiet, rational nausea.

  "No," Halloway said. "I'm certain of everything. That's the trouble."

  Rourke waited for more. When none came, he turned and left. The door hissed shut.

  Halloway sat alone in the green glow. He watched the simulation of the *Aegis* moving into the channel. It slipped past Coordinate 1. Safe. Coordinate 2. Safe.
  He waited for the explosion. He knew it wouldn't happen yet. It might happen at Coordinate 400. It might happen at Coordinate 912. Or it might not happen at all. The statistics were only probabilities.

  But the contradiction was absolute.

  He picked up his coffee cup. It was cold. He drank it anyway, tasting the bitterness, grounding himself in the one thing he didn't have to verify. He kept watching the screen, holding the truth of the parts and the falsehood of the whole, waiting for the sea to decide which one was real.
