answer: |-
  The museum lights hummed softly above the glass case. Inside lay the artifacts of failure: a brass combustion chamber for phlogiston, a lithograph of caloric fluid flowing between bodies, and a small, empty bottle labelled *Luminiferous Ether*.

  Elena gestured at the bottle. "Stand here, Marcus. Tell me this isn't a graveyard of successful lies. Each of these theories saved the phenomena. Each was empirically adequate. And each was fundamentally false. The pessimistic meta-induction is simple: if past success didn't guarantee truth, why should we bet on QED or General Relativity?"

  Marcus adjusted his glasses, looking not at the artifacts but at the space between them. "Because you're conflating the ontology with the structure. The 'no miracles' argument isn't just that success would be accidental if theories were false; it's that the *mathematical structure* of successful theories tends to accumulate, even when the physical picture collapses. Look at Fresnel."

  "Fresnel is the realist's favorite ghost," Elena countered.

  "Because he's instructive. Fresnel derived his equations of light reflection and refraction assuming an elastic-solid ether. We now know there is no ether. But Maxwell didn't throw Fresnel's equations away; he absorbed them into electrodynamics. The structural relations survived the ontological purge. Selective realism isn't about saving the ether; it's about saving the equations that did the work."

  "But how do you know which parts did the work until you see what survives?" Elena stepped closer, her voice sharpening. "This is the hindsight objection. You look at Fresnel, see that Maxwell kept the math but ditched the medium, and then you declare the math was the 'real' part all along. But could Fresnel have known that? No. You're carving nature at joints that only became visible after the dissection was complete. It's a tailor-made distinction. You're restricting realism to the bits that happened to survive, which makes your realism a historical accident, not a philosophical stance. If tomorrow string theory dissolves the Standard Model, you'll just retreat again, saying, 'Ah, but the group symmetry was real!' It's unfalsifiable."

  Marcus didn't look away. "That assumes the distinction between structure and ontology is only visible retrospectively. It isn't. It's available to the theorist in the moment of construction. When Fresnel derived his coefficients, the mechanical model of the ether was already under strain—it was an auxiliary hypothesis used to visualize the boundary conditions, not the source of the mathematical constraints themselves. The math was constrained by interference patterns and polarization data; the ether was constrained by nothing but intuition."

  "So you claim we can identify 'idle wheels' in real-time?"

  "I claim we can identify what is empirically anchored versus what is explanatory padding," Marcus said. "The hindsight objection assumes we select the structural posits *because* they survived. But we commit to them because they are the only elements directly tied to measurement operations. The ether was a story told *about* the equations. The equations were the tools used to *predict* the shadows. When we practice science, we don't treat the mathematical formalism and the mechanical model with the same epistemic weight. We know when we're manipulating a symbol string that yields numbers versus when we're imagining a fluid. Structural realism isn't a retreat after the battle; it's a discipline during it. We commit to the structure because it's the only thing that touches the world, regardless of whether the next theory keeps it. That Maxwell kept it is confirmation, not the source of the distinction."

  Elena paused, looking back at the empty ether bottle. "So you're saying the structure has independent warrant?"

  "I'm saying the structure is the warrant. The history looks like hindsight only if you think realism requires believing in the *things* rather than the *relations*. If I believe the relations are real, I don't need to worry about whether the relata change names."

  "Or," Elena said softly, turning from the case, "you've just redefined 'truth' to mean 'whatever math we haven't overturned yet.'"

  "Perhaps," Marcus replied. "Or perhaps I've finally stopped confusing the map for the territory."

  They stood in silence for a moment, the hum of the lights filling the space where the ether used to be.
