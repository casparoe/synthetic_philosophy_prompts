answer: |-
  Good morning. Welcome to "Testing for Hidden Minds."

  Looking around this room, I see a divide that is rarely bridged, let alone placed at the same table. On one side, we have machine learning researchers who generally regard "mind" as a folk-psychological placeholder for patterns in high-dimensional space. On the other, we have philosophers of mind and researchers in parapsychology, who are concerned with the nature of consciousness and, in some cases, the possibility of anomalous cognition.

  It is tempting to treat this workshop as a collision between the rigorous and the speculative. But I want to begin by complicating that narrative with a historical fact that many of us know, but few of us truly sit with.

  When Alan Turing published "Computing Machinery and Intelligence" in 1950, he introduced the Imitation Game. We often treat this as the founding document of behavioral AI. But in Section 4 of that same paper, Turing addresses the "Argument from Extrasensory Perception." He does not dismiss it. He does not mock it. He notes that the statistical evidence for ESP, particularly telepathy, is strong enough that it cannot be simply ignored by a rigorous thinker.

  Turing worried that if a human contestant in the Imitation Game possessed telepathic abilities, they might guess the interrogator's questions without processing them linguistically. This would make the human look like a machine—or conversely, allow a machine to fail against a telepathic human. His solution was half-serious but methodologically precise: he proposed conducting the test inside a "telepathy-proof room."

  I bring this up not to debate the existence of psi, but to highlight a methodological vulnerability that unites everyone in this room. Turing's concern was not necessarily that ESP is real; it was that *if* a hidden variable exists that influences behavior, a purely behavioral test cannot distinguish between the mechanism you are testing for and the confound you are not.

  For my colleagues in machine learning: This should give us pause regarding our reliance on benchmarks. We often treat benchmark performance as a proxy for capability, and capability as a proxy for intelligence. But Turing reminds us that behavior is underdetermined by mechanism. If a model passes a benchmark because of data contamination, shortcut learning, or artifacts in the evaluation set, it is functionally equivalent to the telepathic human in Turing's example. The output looks correct, but the hidden mind—the actual reasoning process—is absent. We think we are testing for intelligence, but we may be testing for leakage. We need our own version of the telepathy-proof room, and we must be honest that our current walls are porous.

  For my colleagues in philosophy and parapsychology: Turing's digression also offers a mirror. He was willing to entertain the ESP objection because the statistics demanded it, but he also recognized that acknowledging the statistics is not the same as settling the ontology. Pre-registration is a vital tool for securing statistical inference; we owe a debt to the work done here to make anomalous cognition research rigorous. But pre-registration is not a telepathy-proof room. It prevents p-hacking and hindsight bias, but it does not necessarily seal out unknown confounds or alternative explanations for the behavioral signal. Candor requires us to admit that even perfect statistics on behavior leave the "hidden" part of the hidden mind just that—hidden.

  So, what are we doing here for the next two days?

  We are not here to decide if machines think, or if minds can project across space. We are here to discuss the limits of inference. We are all trying to measure a latent variable—call it intelligence, call it consciousness, call it psi—using observed behavior.

  Turing's legacy is not just the test that bears his name. It is the humility to recognize that when you test for a hidden mind, you must account for the possibility that the room itself is not as sealed as you think.

  Let us spend this workshop tightening the seals, questioning the proxies, and treating each other's confounds with the same seriousness Turing treated the card-guessing statistics.

  Thank you, and let's begin.
