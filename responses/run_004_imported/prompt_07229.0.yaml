      *   **Analyzing Fuller's Position:** Fuller argues the Nazi statute lacked the "inner morality of law." It was too arbitrary/secret/iniquitous to count as law. Therefore, the wife had no legal protection *then*. Punishing her now is not retroactive; it's recognizing that the previous regime's edicts were not laws but commands of force. The legal order remained continuous in its principles, even if suppressed.
