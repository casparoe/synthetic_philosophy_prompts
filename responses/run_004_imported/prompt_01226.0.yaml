prompt: |-
  Something's been bugging me and I can't tell if I'm being irrational about it. I've got two job offers: Job A is boring big-co, $175k guaranteed, and Job B is an early-stage startup, $130k base plus equity that (by the founders own numbers) has maybe a 7% shot of being worth ~$4M and otherwise nothing. Expected value clearly favors B, and my friend, whos big into rationalist blogs, says turning it down is just scope-insensitive bias, since the gap between 130k and 175k isn't nearly enough to justify skipping the higher-EV option.

  But when I imagine the exact same choice scaled way down, like a guaranteed $1,750 vs a 7% shot at $40k, I get the exact same pull toward the safe option, even though at that scale neither outcome would change my life at all. So it's clearly not about the money's marginal value to me, it feels more like I just don't like that shape of bet, period. Is my friend right that this is just a bias I should correct, or could there be an actual principled reason to weigh a gamble differently than its expected value, separate from how much you value the outcomes themselves?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Dilemma:**
      *   **Choice:** Job A (Big Co, $175k guaranteed) vs. Job B (Startup, $130k base + equity).
      *   **Equity Details:** 7% chance of ~$4M, 93% chance of $0.
      *   **Friend's Argument:** Rationalist perspective. Expected Value (EV) favors Job B. Choosing A is "scope-insensitive bias." The income gap ($45k) is small compared to the potential upside.
      *   **User's Intuition:** Even when scaled down ($1,750 vs. 7% of $40k), they still prefer the safe option. This suggests it's not about marginal utility of money (diminishing returns) but about the *structure* of the bet itself.
      *   **Core Question:** Is the friend right (it's a bias to correct), or is there a principled reason to weigh a gamble differently than its EV, independent of outcome utility?

  2.  **Evaluate the Expected Value (EV) Calculation:**
      *   Job A Salary: $175k.
      *   Job B Salary: $130k.
      *   Difference: -$45k (cost of buying the lottery ticket).
      *   Job B Equity EV: 0.07 * $4,000,000 = $280,000.
      *   *Wait, is this per year?* Usually, equity vests over 4 years. The friend's calculation likely assumes the $4M is the *total* value upon exit.
      *   *Time Horizon:* If the $4M is total over 4 years, the annualized EV of equity is $280k / 4 = $70k/year.
      *   Total Annualized EV Job B: $130k + $70k = $200k.
      *   Total Annualized EV Job A: $175k.
      *   *EV Difference:* $25k/year in favor of Job B.
      *   *Friend's Point:* Mathematically, B has higher EV.

  3.  **Evaluate the "Bias" Claim (Scope Insensitivity/Risk Neutrality):**
      *   Rationalist orthodoxy often assumes risk neutrality for large corporations/institutions, but *individuals* are typically risk-averse.
      *   The friend claims the user is suffering from a cognitive bias (likely misunderstanding scope or probability).
      *   However, the user notes the preference holds even at small scales ($1,750 vs. 7% of $40k).
      *   Small scale EV:
          *   Safe: $1,750.
          *   Gamble: 0.07 * $40,000 = $2,800.
          *   EV Diff: $1,050.
      *   If the user still picks the safe $1,750, they are displaying risk aversion. Is this irrational? In standard utility theory, no, as long as the utility function is concave. But the user says it's *not* about marginal value. It's about the "shape of the bet."

  4.  **Identify Principled Reasons to Reject EV Maximization (The "Kelly Criterion" & Ruin):**
      *   **Ergodicity:** This is the key concept. Ensemble average (EV) vs. Time average.
      *   If you take a bet once, you live in one timeline. EV assumes you can play the game infinite times. You can't.
      *   **Risk of Ruin:** If the downside (taking the lower salary) prevents you from meeting obligations or forces you into a worse position if the bet fails, EV is irrelevant.
      *   **Opportunity Cost/Path Dependence:** Taking Job B might limit future options if it fails (gap in resume, startup stigma in some industries, loss of networking). Job A might offer better optionality later.
      *   **Liquidity & Vesting:** Equity is illiquid. You can't spend it. It might be worthless. The $45k salary difference is real cash *now*.
      *   **Effort/Workload:** Startups usually require more hours. $130k for 60 hours vs $175k for 40 hours changes the hourly rate significantly.

  5.  **Address the "Shape of the Bet" Intuition:**
      *   The user feels discomfort with the *distribution*, not just the mean.
      *   This aligns with **Risk Aversion** in Utility Theory, which is rational for individuals.
      *   It also aligns with **Ambiguity Aversion** (Ellsberg Paradox). The 7% number comes from founders. It's likely not a true probability. It's a guess.
      *   **Principal-Agent Problem:** Founders benefit from risk (they have lots of equity, low salary). Employees do not.

  6.  **Synthesize the Argument:**
      *   **Validate the User:** You are not irrational. Your friend is applying institutional logic to an individual context.
      *   **Critique the EV Calculation:** The 7% is likely inflated (founder optimism). The $4M is pre-tax and illiquid.
      *   **Introduce Ergodicity:** You only live once. You can't average out the risk.
      *   **Utility of Money:** Even if the user says it's not about marginal value, $45k is significant for savings rate, stress, and lifestyle.
      *   **Career Capital:** Job A (Big Co) often provides better brand signaling for the next role than a failed startup.
      *   **The "Sleep at Night" Factor:** Psychological cost of uncertainty.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Opening:* Validate the feeling. It's not a bias; it's rational risk aversion + ergodicity.
      *   *Point 1: The EV Math is Flawed.* Founder numbers are marketing. 7% is likely <1%. Liquidity events are rare.
      *   *Point 2: Ergodicity.* Explain the difference between ensemble average (EV) and time average (your life). You can't replay the career choice 100 times.
      *   *Point 3: Risk of Ruin/Optionality.* Does the $45k loss hurt? Does the failed startup hurt the resume? Big Co brand is an asset.
      *   *Point 4: Effort Adjusted.* Startup hours usually suck. Calculate hourly rate.
      *   *Point 5: Utility Function.* It *is* about marginal utility, even if the scaled test suggests otherwise. The scaled test removes context (rent, bills). In reality, guaranteed cash has higher utility than speculative paper wealth.
      *   *Conclusion:* Trust your gut. It's pricing in risks the EV model ignores.

  8.  **Refining the "Scaled Down" Argument:**
      *   The user says: "$1,750 vs 7% of $40k."
      *   If I choose $1,750, I am risk-averse.
      *   Is risk aversion irrational? No. It's the basis of insurance. We pay negative EV to avoid risk.
      *   The friend confuses "Risk Neutral" (rational for a casino) with "Risk Averse" (rational for a human).
      *   The "Shape of the bet" is **Skewness**. Humans dislike high variance with high probability of zero.

  9.  **Final Polish:**
      *   Make sure to mention the *Kelly Criterion* conceptually (don't bet the farm).
      *   Highlight the *Ambiguity* (7% is not a coin flip).
      *   Keep the tone empathetic but analytical.

  10. **Self-Correction during drafting:** I need to be careful not to just say "Startups are risky." I need to address the *philosophical* question: Is maximizing EV always the rational choice for an individual? The answer is a definitive "No." I should reference Ole Peters' work on Ergodicity Economics as it directly addresses the friend's "rationalist" argument.

  11. **Final Structure:**
      *   Direct Answer: You are not irrational.
      *   Concept 1: Ergodicity (The most important point).
      *   Concept 2: The "7%" is likely wrong (Ambiguity).
      *   Concept 3: Career Optionality (Real Options).
      *   Concept 4: Effort & Liquidity.
      *   Advice on how to decide.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Your friend is applying a framework that works for **institutions** (like insurance companies or venture capital firms) to an **individual** (you). While their math on Expected Value (EV) might be technically correct based on the numbers provided, their conclusion that you are suffering from a "bias" is flawed.

  You are not being irrational. In fact, your intuition about the "shape of the bet" touches on a sophisticated concept in decision theory that standard EV calculations ignore: **Ergodicity.**

  Here is the principled breakdown of why rejecting the higher-EV option is often the rational choice for an individual.

  ### 1. The Ergodicity Problem
  Your friend's argument assumes that if you made this choice 1,000 times, the average outcome would favor Job B. That is an **ensemble average**. But you do not live 1,000 parallel lives. You live one life sequentially. That is a **time average**.

  In non-ergodic systems (like a career), the path matters. If you take the risk and it fails (93% probability), you do not get to "reset" and try again with the benefit of hindsight. You are stuck with the lower salary, potentially a gap in employment, and the psychological toll of the "loss."

  Standard EV maximization is rational for a casino that plays the game a million times. It is often irrational for a human who plays the game once. Preferring the guaranteed outcome in a non-ergodic scenario isn't a bias; it's a survival heuristic.

  ### 2. The "7%" is Ambiguity, Not Risk
  There is a distinction in economics between **Risk** (known probabilities, like a dice roll) and **Ambiguity** (unknown probabilities, like a startup exit).

  The founders' "7%" is not a calibrated probability; it is a marketing number. In the startup world, the actual probability of an early-stage company returning $4M to an *employee* (after dilution, liquidation preferences, and taxes) is often significantly lower than the founders' optimistic models.
  *   **Risk:** A 7% chance of rain.
  *   **Ambiguity:** A founder saying "there's a 7% chance we become unicorns."

  Rational agents should be **ambiguity averse**. When the probability distribution is unknown or manipulated by counter-parties (the founders) who benefit from you taking the risk, discounting the EV is mathematically sound. You are applying a "confidence discount" to their numbers.

  ### 3. Career Optionality (Real Options)
  You are not just choosing a salary; you are choosing a **platform for your next job**.
  *   **Job A (Big Co):** If you leave in two years, you have a brand name on your resume. You can likely command a higher base salary elsewhere. The "downside" is protected.
  *   **Job B (Startup):** If the startup fails (93% chance), you have to explain the failure in interviews. While some failure is tolerated, a string of failed startups can signal poor judgment to future employers.

  Job A purchases **optionality**. It keeps more future doors open. Job B burns optionality for a lottery ticket. In finance, optionality has value. Your friend's EV calculation treats your career as a static cash flow, ignoring the value of future opportunities.

  ### 4. Liquidity and Effort
  *   **Liquidity:** $175k is cash you can use to buy a house, invest in index funds (which have their own positive EV), or handle emergencies. Equity is illiquid paper wealth that you cannot spend until a liquidity event (5–7 years away, if ever). Cash in hand is almost always more valuable than paper wealth due to the *option value of liquidity*.
  *   **Effort:** Startups almost universally require more hours and higher stress than big companies. If Job B requires 60 hours/week and Job A requires 40, your hourly rate for Job B drops significantly.
      *   Job A: $175k / 40hrs
      *   Job B: $130k / 60hrs (+ lottery ticket)
      *   You are effectively *paying* the startup in unpaid labor for the chance to buy that equity.

  ### 5. Why Your "Scaled Down" Test Didn't Work
  You mentioned that even at a small scale ($1,750 vs. 7% of $40k), you still prefer the safe option. You interpreted this as "it's not about the money's marginal value."

  Actually, it confirms that you have a **concave utility function**, which is the definition of risk aversion.
  *   Utility of $1,750 = High (certainty).
  *   Utility of 7% chance at $40k = Lower (uncertainty).

  In standard utility theory, it is **not irrational** to be risk-averse. We pay insurance premiums (negative EV bets) every month to avoid risk. We do this because the pain of a loss is psychologically and practically greater than the pleasure of an equivalent gain. Your friend is assuming you should be **Risk Neutral**. Risk neutrality is a specific preference, not the default state of rationality for humans.

  ### The Verdict
  Your friend is suffering from "physics envy"—trying to apply clean mathematical models to messy human systems.

  *   **EV is real, but incomplete.** It ignores the cost of ruin, the value of optionality, the likelihood of founder optimism bias, and the non-ergodic nature of a career.
  *   **Your intuition is principled.** You are pricing in the variance, the illiquidity, and the ambiguity.

  **Recommendation:**
  Unless you have a high risk tolerance, a financial safety net that makes the $45k difference negligible, and a specific desire to work in the chaos of a startup, **Job A is likely the rational choice.** It maximizes your *geometric* growth rate (compounding career capital and savings) rather than your *arithmetic* expected value.

  You aren't biased. You're just pricing risk correctly for a single-player game.
