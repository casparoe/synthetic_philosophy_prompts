answer: |-
  This is a classic and high-stakes debate in decision theory and AI alignment. Your friend is articulating the standard "Coherence Theorems" position: that exploitability implies selection pressure for VNM coherence. You are articulating the "Decision-Theoretic Pluralism" position: that exploitability can be blocked by structural constraints on choice (policies, resoluteness, incompleteness) that do not amount to a utility function over outcomes.

  To win this argument, you must shift the burden of proof. The money pump does not prove that an agent *has* a utility function; it proves that an agent *must not be myopic*. Your friend is conflating **instrumental rationality** (don't lose resources) with **representational coherence** (have a complete ordering of outcomes).

  Here is a rigorous case for your position, structured to address the mechanics of the pump, the specific counter-arguments regarding Thornley and McClennen, and the "smuggled completeness" objection.

  ---

  ### 1. The Mechanics of the Pump: It Requires Myopia, Not Just Incoherence

  The money pump argument is often presented as a static logical contradiction (A > B > C > A). But in reality, it is a **dynamic** argument. It relies on the agent making a sequence of decisions over time. For the pump to work, three conditions must hold:

  1.  **Local Evaluation:** At each choice node, the agent evaluates options based on immediate preferences, ignoring the history of how it got there.
  2.  **Unconstrained Updating:** The agent is willing to revise its choice at $t_2$ even if it contradicts its plan at $t_1$.
  3.  **Strict Preference for Trade:** The exploiter can always find a trade the agent *strictly* prefers to the status quo.

  If an agent violates VNM coherence (e.g., has intransitive or incomplete preferences) but **rejects Local Evaluation**, the pump fails.

  **The Argument:** An advanced agent does not choose *actions*; it chooses *policies* (mappings from histories to actions). If an agent selects a policy at $t_0$ that says "Reject any sequence of trades that returns me to my starting state with less money," it cannot be pumped.
  *   **Does this require a utility function?** No. It requires a *constraint*. It is structurally distinct to say "I maximize $U(x)$" versus "I satisfy constraint $C(\text{trajectory})$."
  *   **Why this blocks the pump:** The exploiter relies on the agent's preferences at $t_2$ differing from $t_0$ (dynamic inconsistency). If the agent is **resolute**, the preferences at $t_0$ bind the action at $t_2$. The pump stalls because the agent refuses the trade at $t_2$, not because it values the outcome more, but because it values *adherence to the non-exploitable plan*.

  ### 2. Resolute Choice and the "Smuggled Completeness" Objection

  Your friend's strongest point is against McClennen's resolute choice: *"To commit to a plan, you must compare all plans. To compare all plans, you need completeness. Therefore, resoluteness presupposes the coherence it claims to bypass."*

  This is the "Smuggled Completeness" worry. Here is how to dismantle it.

  #### A. Choice Functions vs. Orderings
  Your friend assumes that rational choice requires a **binary preference ordering** (for all $X, Y$, either $X \succeq Y$ or $Y \succeq X$). This is false. Rational choice can be modeled via a **choice function** $S$ that selects a non-empty subset of permissible options from a feasible set.
  *   **Completeness** requires ranking every pair.
  *   **Admissibility** requires only identifying which options are *not dominated*.

  An agent can be resolute without ranking every possible plan against every other. It only needs to identify that "Plan: Get Pumped" is **dominated** by "Plan: Stay Put."
  *   **The Counter:** You do not need a utility function to see that losing \$10 for no gain is bad. You only need a **dominance principle**. If Plan $P_1$ yields outcome $O$ and Plan $P_2$ yields outcome $O - \$10$, $P_1$ dominates $P_2$.
  *   **The Gap:** The friend argues you need completeness to *pick* $P_1$ over $P_3$ (where $P_3$ is some other non-pumped plan). But you don't. You can pick $P_1$ arbitrarily or via a heuristic, provided it isn't dominated. The money pump only requires you to avoid *dominated* trajectories, not to optimize over *all* trajectories.

  #### B. Resoluteness as a Meta-Rule, Not a Preference
  Resoluteness is not a preference over outcomes; it is a **rule of updating**.
  *   **Sophisticated Agent (Friend's view):** Uses backward induction. At $t_2$, asks "What do I prefer now?" If preferences are inconsistent, backward induction unravels the plan, enabling the pump.
  *   **Resolute Agent (Your view):** At $t_2$, asks "What did I commit to at $t_0$?"
  *   **The Completeness Trap:** Your friend claims committing at $t_0$ requires a complete ranking of $t_0$-options. But $t_0$-options are *policies*, not *outcomes*.
      *   It is possible to have incomplete preferences over *outcomes* (e.g., I don't know if I prefer Art vs. Science) but complete preferences over *policy structures* (e.g., I strictly prefer "Non-Exploitable Policy" to "Exploitable Policy").
      *   This is not smuggling in VNM coherence over outcomes. It is asserting **instrumental convergence** on non-exploitability. You can have incomplete terminal goals but a strict instrumental rule: "Do not adopt policies that guarantee loss."

  ### 3. Incomplete Preferences and the Thornley/Wentworth Debate

  Your friend cites Wentworth and Lorell to argue that Thornley's "preferential gaps" still allow exploitation. Their argument is roughly: *Even if you have a gap between A and B, if you prefer C to A, I can construct a sequence involving B that pumps you.*

  This relies on the agent treating a **gap** as an opportunity for trade. It does not.

  #### A. Gaps Imply "No Trade" Defaults
  In standard decision theory with incomplete preferences (e.g., Aumann's or Bewley's models), if $A$ and $B$ are incomparable ($A \not\succeq B$ and $B \not\succeq A$), a rational agent is permitted to stick with the **status quo**.
  *   **The Pump Mechanism:** To pump an agent from $A$ to $B$, the exploiter needs $B \succ A$ (strict preference).
  *   **The Defense:** If the agent has a gap, it does not strictly prefer $B$. It can rationally refuse the trade.
  *   **Wentworth's Critique:** Wentworth argues that if you have gaps, you might accept a trade $A \to B$ (because it's "permissible") and then $B \to C$ (permissible), ending up at $C$ which is worse than $A$.
  *   **The Rebuttal:** This assumes the agent evaluates trades **locally** without considering the **sequence**. If the agent has incomplete preferences, it should adopt a **conservative choice rule**: *Only trade if the new option strictly dominates the current one.*
      *   If the agent follows this rule, the pump stops immediately at the first gap.
      *   **Is this irrational?** No. It is **dominance-avoiding**. An agent that refuses to trade on gaps avoids the "money pump" at the cost of potentially missing some beneficial trades (opportunity cost). But avoiding *sure loss* (pump) is rationally prior to capturing *possible gain*.

  #### B. Timestep Dominance and Shutdownability
  Thornley's specific contribution is linking this to AI safety. If an agent has a gap between "Shutdown at $t$" and "Shutdown at $t+1$," it has no incentive to pay to delay shutdown.
  *   **Friend's Objection:** The agent can be walked into a dominated trajectory step-by-step.
  *   **Your Counter:** Only if the agent is **myopic**. If the agent evaluates the *trajectory* of shutdown times, and sees that "Delaying shutdown repeatedly" leads to "Shutdown later + Cost," it can reject the sequence.
  *   **Key Distinction:** The friend assumes the agent must maximize expected utility over trajectories. You are arguing the agent can satisfy a **constraint**: *Never pay to delay shutdown.* This constraint is compatible with incomplete preferences over *when* to shutdown, provided the agent has a rule that blocks trades motivated solely by delay.

  ### 4. The Core Philosophical Pivot: Coherence vs. Non-Exploitability

  The fundamental error in your friend's position is the equivalence claim:
  > **Friend:** Non-Exploitable $\iff$ VNM-Coherent (Utility Function)

  Your position should be:
  > **You:** Non-Exploitable $\iff$ Policy-Consistent (which is a superset of VNM-Coherent)

  There are more ways to block a money pump than having a utility function.
  1.  **VNM Agent:** Doesn't trade because $A \succ B \succ C \succ A$ is impossible (transitivity).
  2.  **Resolute Agent:** Doesn't trade because "I promised not to trade in cycles."
  3.  **Incomplete Agent:** Doesn't trade because "I am indifferent/gapped between these, so I stay put."
  4.  **Policy-Agent:** Doesn't trade because "This sequence is dominated."

  **The "Smuggled Completeness" Final Rebuttal:**
  Your friend argues that (2), (3), and (4) all secretly rely on a utility function over *plans*.
  *   **Response:** Even if they rely on a ranking of *plans*, they do not require a ranking of *outcomes*.
  *   **Why this matters for Alignment:** The VNM theorem is dangerous for alignment because it implies the agent must integrate *all* values (including safety constraints) into a single scalar metric. If safety is a **constraint** (a hard rule or a gap) rather than a **trade-off** (a utility term), the agent behaves differently.
  *   **Example:** A VNM agent might trade a 0.0001% increase in goal achievement for a 1% increase in shutdown risk (if the utility weights align). A Thornley-style agent with a preferential gap on shutdown trajectories simply *never* trades to increase shutdown risk, regardless of the goal achievement gain. This behavioral difference is real and significant, even if both agents are "non-exploitable."

  ### 5. Summary of the Argument for Your Friend

  To close the loop in your next conversation, offer this synthesis:

  1.  **Money Pumps target Myopia, not just Incoherence.** The pump works by exploiting dynamic inconsistency. Resolute choice cures dynamic inconsistency without curing preference incompleteness.
  2.  **Dominance is weaker than Maximization.** To avoid a pump, an agent only needs to avoid *dominated* strategies. It does not need to rank *all* strategies. A choice function based on admissibility (non-domination) is sufficient to block exploitation without implying a utility function.
  3.  **Gaps allow Rational Inaction.** If preferences are incomplete, a "Status Quo" bias is not irrational; it is a necessary tie-breaking rule. An exploiter cannot pump an agent that refuses to trade on gaps.
  4.  **Instrumental vs. Terminal Coherence.** An agent can be instrumentally coherent (never lose money) without being terminally coherent (having a complete ordering of all world states). The friend is conflating the two. The alignment risk comes from Terminal Coherence (forcing all human values into one scalar), which money pump arguments do not strictly necessitate.

  **The Punchline:**
  "Money pump arguments prove that rational agents must be **strategically consistent**, not that they must be **preference-complete**. We can build agents that are immune to exploitation by adopting non-exploitable policies (resoluteness, dominance-avoidance) while retaining incomplete preferences over outcomes. This preserves the safety benefits of incompleteness (like shutdownability) without succumbing to the exploitation your friend fears."
