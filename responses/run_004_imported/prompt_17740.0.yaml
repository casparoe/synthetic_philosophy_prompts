answer: |-
  **Setting:** *The hotel bar, 11:30 PM. The noise of the conference reception has thinned out. Elena (Reductionist) is nursing a gin and tonic; Marcus (Primitivist) has a sparkling water. They are the last two at the high-top table, surrounded by napkins covered in scribbled logic notation.*

  **Elena:** You enjoyed that. I could see you smiling when the speaker stumbled on the antidote case.

  **Marcus:** I try not to enjoy pain, Elena. But there is a certain relief in seeing a category error treated with the respect due to a genuine paradox.

  **Elena:** It's not a category error. It's a technical glitch. We had a working model—Lewis's reformed conditional analysis—until people started getting creative with science fiction. The "causal basis" clause handles the electro-fink. The wire isn't live because the intrinsic structure that *makes* it live isn't present when the tester touches it. The fink removes the basis. Case closed.

  **Marcus:** Is it? The fink removes the basis, yes. But the mask leaves the basis alone. That's the distinction you're glossing. Take your fragile glass. It has the molecular lattice, the bonding structure, the whole causal basis. I wrap it in bubble wrap. I strike it. It doesn't break.

  **Elena:** Standard mask. We handle that with a *ceteris paribus* clause. "If struck, *in the absence of interfering factors*, it would break."

  **Marcus:** "Interfering factors." That's the epicycle I'm talking about. You're defining the disposition by the manifestation, but then you have to subtract all the cases where the manifestation doesn't happen, without using the disposition itself to define what counts as an interference. It's circular.

  **Elena:** It's not circular if we can specify the interference independently. Bubble wrap is macroscopic. Antidotes are chemical interactions. We can list them.

  **Marcus:** Can you? Let me try a case. Let's call it the "Local Law Suspension." Imagine a fragile glass. It has the full causal basis for fragility. I strike it. But, in the immediate spatial vicinity of the glass, the laws of physics shift just enough that the kinetic energy of the strike dissipates as heat *without* altering the molecular lattice. The glass doesn't break. The basis remains intact. The stimulus occurs.

  **Elena:** That's not a close possible world. If you're changing the laws of physics, you're not testing the disposition of the object; you're testing the disposition of the universe.

  **Marcus:** But why isn't it a close world? It's metaphysically possible. And if dispositions are real powers inherent in the object, they should travel with the object. If I take a poison to a world where human metabolism works differently so the poison doesn't kill, the arsenic is still poisonous. It retains the *power*, even if the *conditional* "if ingested, death follows" is false in that world.

  **Elena:** You're begging the question. You're assuming the power exists independently of the conditional. I'm saying the power *just is* the truth of the conditional in the actual world, holding fixed the actual laws.

  **Marcus:** Okay, hold the laws fixed. Let's stay in the actual world. I have a new case for your "causal basis" fix. Call it the "Mimic Basis." I have a block of wood. It is not fragile. But I embed a nanite cloud inside it. When the wood is struck, the nanites detect the impact and instantly reconfigure the wood's surface to shatter exactly like glass, then repair it.

  **Elena:** It shatters?

  **Marcus:** It manifests the breaking. To an observer, it's indistinguishable from fragility.

  **Elena:** But the causal basis isn't intrinsic fragility. It's the nanites.

  **Marcus:** Right. So your analysis says: "X is fragile iff X has an intrinsic basis B such that if struck, B causes breaking." In the Mimic case, the object breaks when struck. It has an intrinsic basis (the nanites). The basis causes the breaking. By your lights, the wood is fragile.

  **Elena:** No. Because the basis must be the *right kind* of basis. It must be the microstructural property that *normally* underwrites fragility.

  **Marcus:** "Normally." There's your *ceteris paribus* again. You're smuggling in a normative claim about which structures count. But why? If the conditional holds—if the thing breaks when struck—why does the metaphysical plumbing matter?

  **Elena:** Because "fragile" isn't just about breaking. It's about *why* it breaks. If I say "this glass is fragile," I'm saying something about its constitution, not just its future history.

  **Marcus:** Exactly! That's my point. You're trying to reduce a property of constitution to a conditional about history. But the counterexamples show the two come apart. You can have the history without the property (the Mimic), and the property without the history (the Mask).

  **Elena:** Okay, let's tighten the screw. I concede the simple conditional is dead. Lewis knew that. So we go to a *rigidified* conditional. "X is fragile iff in the actual world, X has a property such that in all worlds where that property is retained and the stimulus occurs, the manifestation occurs."

  **Marcus:** Now you're quantifying over worlds where the property is retained. But how do you identify the property without already knowing the disposition? If I point to the molecular lattice of the glass, how do you know *that* is the fragility-basis and not the "breaks-unless-bubble-wrapped" basis?

  **Elena:** We identify it by its causal role.

  **Marcus:** Which is defined by... the disposition. You're chasing your tail, Elena. The property is primitive. It's a power. It's a real feature of the world that *grounds* the conditional, not one that is *analyzed* by it. The conditional is just the shadow the power casts. Sometimes the light gets blocked (masks), sometimes the object moves (finks), but the power remains.

  **Elena:** If I accept that, I accept a ontology of "potentia." Hidden engines in every object. It smells of scholasticism. I want a Humean world. Events, regularities, conditionals. No secret powers.

  **Marcus:** But the Humean world can't account for the resilience of the intuition. Look, let's try one more case. Tailored to your "rigidified" move. The "Temporal Fink."
  Imagine a substance that is soluble. But it has a property that is only intrinsic at time *t*. The moment it touches water (the stimulus), it undergoes a phase change that makes it insoluble *before* it dissolves. But—and here's the kick—the phase change is reversible. Once removed from water, it returns to being soluble.
  At time *t*, it has the intrinsic basis for solubility. If you put it in water, it changes. It doesn't dissolve.
  Your rigidified analysis says: "In worlds where the basis is retained..."
  But in *this* world, the basis *cannot* be retained through the stimulus. It is the nature of the basis to vanish upon contact.

  **Elena:** Then it wasn't soluble at *t*.

  **Marcus:** But chemically, it is identical to sugar at *t*. It has the same bonding. The only difference is a law-like connection to water that triggers the change. If you bite the bullet and say "it's not soluble," you're saying solubility depends on what happens *after* contact, not just on the state *at* contact.

  **Elena:** Dispositions are forward-looking. Of course they depend on what happens after.

  **Marcus:** But you wanted to reduce them to the *current* state plus a conditional. If the current state guarantees the conditional fails (because the state changes), then your analysis says "not soluble." But our chemical intuition says "soluble, but finkish."
  This is why the project is a dead end. You're trying to flatten a three-dimensional object into a two-dimensional map. You keep redrawing the map to include the mountains, but you refuse to admit the terrain has elevation.

  **Elena:** Or, maybe the map is all there is, and the "terrain" is just a picture we paint to make ourselves feel like we understand the geography.
  Look, I'll concede the Mimic case. Maybe "fragile" is context-sensitive. In a context where we care about safety, the Mimic Wood is fragile. In a context where we care about materials science, it isn't.

  **Marcus:** Aha! Context sensitivity. So the metaphysics of the object depends on the conversational context of the observer?

  **Elena:** No. The *truth conditions of the ascription* depend on context. The object is what it is. But "is fragile" is a predicate we use, and its usage is governed by pragmatic norms.

  **Marcus:** So you've retreated from metaphysics to pragmatics. You're no longer telling me what fragility *is*; you're telling me when it's *useful to say* "fragile."

  **Elena:** Isn't that what analytic philosophy often boils down to? Clarifying use? If I can predict the breakage, I don't need the "power."

  **Marcus:** Prediction isn't explanation. If I ask *why* it broke, "because it was fragile" is an answer. "Because if it was struck it would break" is a tautology.
  Let's test your pragmatism. I have two glasses. One is standard fragile glass. The other is the Mimic Wood, tuned to break exactly like glass. I throw them both at the floor. I clean up the shards.
  Tomorrow, I need to build a bridge. Which material do I use?

  **Elena:** Neither. They both break.

  **Marcus:** But the Mimic Wood repairs itself after an hour. The glass doesn't. If I know that, I treat them differently. But your conditional analysis, at the moment of throwing, assigns them the same truth value for "is fragile."

  **Elena:** Only if I ignore the future conditionals about repair. "If struck, it breaks *and stays broken*."

  **Marcus:** Now you're adding conjuncts to the manifestation. "Breaks and stays broken." What about "Breaks and makes a sound"? "Breaks and cuts skin"? Where does it stop? The power explains the cluster of conditionals. The conditionals don't explain the power.

  **Elena:** (Pauses, swirls her drink) You know, if I accept your powers ontology, I have to accept that every object is buzzing with infinite potentialities. Solubility, flammability, toxicity, radioactivity...

  **Marcus:** And why not? The world is rich.

  **Elena:** It's ontologically profligate.

  **Marcus:** It's ontologically honest. You're saving on entities but spending on complexity. Your conditional analysis is now a Rube Goldberg machine of *ceteris paribus* clauses, rigidified designators, and context parameters. I have one thing: a power.

  **Elena:** But your power is occult. I can't measure a "power." I measure the breaking. I measure the dissolving.

  **Marcus:** You measure the manifestation. The power is the explanatory ground. You can't measure gravity either; you measure the apple falling. Do you deny gravity because it's not the apple?

  **Elena:** Gravity is a curvature of spacetime. It's structural.

  **Marcus:** And fragility is a structure of potentiality.
  (Silence stretches between them. The bartender begins wiping down the counter.)

  **Elena:** I'm not going to concede that the conditional analysis is dead. Not yet. There's a fix for the Temporal Fink. I think it involves indexing the disposition to time-intervals rather than instants.

  **Marcus:** And I'll be waiting with a case where the time-interval is gunky.

  **Elena:** (Smiles faintly) I expect nothing less. But you have to admit, the Lewisian patch held up for twenty years. That's not nothing.

  **Marcus:** It held up like a dam holding back a flood. It keeps the water out, but the pressure is cracking the concrete.
  (Signals for the check)
  One more drink?

  **Elena:** No. I need to go upstairs and think about whether "intrinsic" can be defined without reference to causal powers.

  **Marcus:** Good luck with that.

  **Elena:** You too. Try to find a world where the laws don't suspend.

  **Marcus:** (Standing up) I live in that world, Elena. I just think the objects in it do more than you give them credit for.

  *They part ways, neither looking entirely satisfied, both already mentally drafting the next counterexample.*
