answer: |-
  It is a pleasure to address a colleague who understands the texture of physical modeling from the inside. Your intuition—that a false model can be *better* than another false model—is not only shared by virtually every working scientist but is the engine of progress in our field. Popper was right to identify this intuition as central to rationality, but as you have discovered, his attempt to formalize it using the logic of consequences ran into a wall.

  To answer your request, I will use an example from your own backyard: the transition from the **Drude Model** to the **Sommerfeld Model** of electrical conduction in metals. Both are strictly false, yet any condensed-matter physicist would rank the Sommerfeld model as having higher verisimilitude. I will then demonstrate why Popper's definition collapses here, and evaluate whether the subsequent "likeness" approaches save the intuition.

  ### 1. The Example: Drude vs. Sommerfeld

  **The Phenomenon:** The electronic specific heat and electrical conductivity of simple metals (e.g., copper) at low temperatures.

  **Theory 1 ($T_D$): The Drude Model (1900).**
  *   **Assumptions:** Conduction electrons form a classical ideal gas obeying Maxwell-Boltzmann statistics. They bounce off immobile ions.
  *   **Predictions:** Predicts the Wiedemann-Franz law (roughly correct) but predicts an electronic specific heat contribution of $C_{el} = \frac{3}{2} n k_B$.
  *   **Status:** False. Experimentally, the electronic specific heat is orders of magnitude smaller than this at room temperature and vanishes linearly as $T \to 0$.

  **Theory 2 ($T_S$): The Sommerfeld Model (1927).**
  *   **Assumptions:** Conduction electrons form a quantum free electron gas obeying Fermi-Dirac statistics. Ions are still a static background.
  *   **Predictions:** Predicts $C_{el} = \gamma T$, where $\gamma$ is a constant. This matches the low-temperature data remarkably well.
  *   **Status:** False. It ignores electron-phonon interactions (lattice vibrations), electron-electron interactions, and the periodic potential of the lattice (band structure). It fails to explain superconductivity, effective mass variations, or holes.

  **The Intuition:**
  Relative to the "Truth" ($T_{QM}$), which we might take as Many-Body Quantum Field Theory applied to a lattice (itself likely approximate, but truer than the other two), $T_S$ is closer to the truth than $T_D$. $T_S$ gets the functional form of the specific heat right; $T_D$ does not. $T_S$ is a better approximation.

  ### 2. Why Popper's Definition Fails

  Popper defined verisimilitude ($Vs$) in terms of **truth content** ($Ct_T$) and **falsity content** ($Ct_F$).
  Let $Ct(T)$ be the set of all logical consequences of theory $T$.
  $Ct_T(T)$ is the subset of true consequences.
  $Ct_F(T)$ is the subset of false consequences.

  Popper proposed that $T_S$ has more verisimilitude than $T_D$ if:
  1.  $Ct_T(T_S) \supset Ct_T(T_D)$ and $Ct_F(T_S) \subseteq Ct_F(T_D)$
      *(More truth, no more falsity)*
      **OR**
  2.  $Ct_T(T_S) \supseteq Ct_T(T_D)$ and $Ct_F(T_D) \supset Ct_F(T_S)$
      *(Same truth, less falsity)*

  **The Miller-Tichý Collapse:**
  In 1974, David Miller and Pavel Tichý proved that if $T_D$ and $T_S$ are both *false*, neither condition can be met.

  Here is the logic applied to our example:
  To say $T_S$ is closer to the truth, it must entail some true statement $t$ that $T_D$ does not. For instance, let $t$ be the statement: *"At 1 Kelvin, the electronic specific heat of copper is less than 0.1 J/mol-K."*
  *   $t$ is True.
  *   $T_S$ entails $t$.
  *   $T_D$ entails $\neg t$ (or a value vastly higher).

  So far, so good. $T_S$ has more truth content. However, because $T_S$ is *false* (it ignores lattice interactions), it entails some false statement $f$. Let $f$ be: *"The lattice potential has no effect on electron wavefunctions."*

  The Miller-Tichý theorem exploits the fact that logical consequence classes are closed under conjunction. If $T_S$ entails $t$ (true) and $f$ (false), it entails the conjunction $(t \land f)$.
  *   $(t \land f)$ is False (because $f$ is false).
  *   Does $T_D$ entail $(t \land f)$? No. $T_D$ entails $\neg t$, so it cannot entail $(t \land f)$.

  Therefore, by adding the true consequence $t$, $T_S$ has *necessarily* added a new false consequence $(t \land f)$ that $T_D$ did not have.
  *   $Ct_T(T_S) > Ct_T(T_D)$
  *   **But also** $Ct_F(T_S) > Ct_F(T_D)$

  Popper's definition requires that you increase truth content *without* increasing falsity content (or vice versa). Miller and Tichý showed that for false theories, truth and falsity content are logically coupled: you cannot add a new truth to a false theory without dragging in new falsehoods via conjunction with the theory's existing errors.

  **The Result:** Under Popper's formal definition, $T_S$ cannot be ranked as closer to the truth than $T_D$. They are incommensurable with respect to verisimilitude. Since both are false, Popper's measure assigns them equal (undefined) standing. This contradicts the unanimous judgment of every physicist who has ever calculated a Sommerfeld expansion.

  ### 3. Do "Likeness" Repairs Rescue the Intuition?

  After 1974, the focus shifted from Popper's **syntactic** approach (counting consequences) to a **semantic** approach (measuring distance between models). Prominent figures here include Ilkka Niiniluoto, Graham Oddie, and Theo Kuipers.

  **The "Likeness" Approach:**
  Instead of comparing sets of sentences, we compare the *states of affairs* described by the theories. We imagine a "logical space" or a parameter space of possible worlds.
  *   The **Truth** is a point (or region) $w^*$ in this space.
  *   Theory $T_D$ describes a point (or region) $w_D$.
  *   Theory $T_S$ describes a point (or region) $w_S$.
  *   Verisimilitude is defined by a distance metric $d$: $T_S$ is closer to truth if $d(w_S, w^*) < d(w_D, w^*)$.

  **Application to Drude/Sommerfeld:**
  We can define a state space based on physical observables, such as the function mapping Temperature to Specific Heat, $C(T)$.
  *   $w^*$ (Truth): The experimental curve (linear at low $T$, cubic phonon contribution, etc.).
  *   $w_D$ (Drude): A horizontal line at $C = \frac{3}{2}R$.
  *   $w_S$ (Sommerfeld): A line $C = \gamma T$.

  If we use a standard metric (e.g., integrated square difference over a temperature range $0 < T < T_{room}$), the distance $d(w_S, w^*)$ is vastly smaller than $d(w_D, w^*)$.
  *   **Verdict:** The likeness approach *successfully* captures the intuition that Sommerfeld is closer to the truth than Drude. It formalizes the physicist's notion of "approximation" or "perturbative closeness."

  ### 4. Does the Trouble Run Deeper?

  While the likeness approach saves the Drude/Sommerfeld case, the trouble does run deeper, though perhaps not fatally. There are two significant philosophical hurdles that remain, which your reading group might find fruitful to debate.

  **A. Language Dependence (The "Grue" Problem):**
  Distance metrics are sensitive to how you parameterize the state space.
  Suppose we describe the specific heat not as $C$, but as a transformed variable $C' = C^3$ or $C' = 1/C$.
  *   In $C$-space, Sommerfeld might be closer to Truth.
  *   In $C'$-space, due to the non-linearity of the transformation, the Drude model might end up geometrically closer to the Truth curve.
  Unless there is a "privileged" set of physical magnitudes (natural kinds) that define the metric, verisimilitude becomes language-relative. Realists argue nature dictates the relevant magnitudes (e.g., energy, not "energy-cubed"), but formalizing this without circularity is difficult.

  **B. Ontological Incommensurability:**
  The Drude/Sommerfeld case is "easy" for likeness because both theories talk about the same things: *electrons*, *temperature*, *heat capacity*. They share an ontology.
  Consider **Caloric Theory** ($T_C$) vs. **Kinetic Theory** ($T_K$).
  *   $T_C$: Heat is a weightless fluid.
  *   $T_K$: Heat is molecular motion.
  *   Truth: Quantum field excitations (phonons/photons).

  How do you measure the "distance" between a world containing a fluid called Caloric and a world containing moving molecules? There is no common state space in which to plot the distance to the truth. The likeness approach works best for theory refinement (Drude $\to$ Sommerfeld $\to$ Band Theory) but struggles with theory revolution (Caloric $\to$ Kinetic).

  ### Summary for Your Group

  1.  **Your intuition is correct:** Science progresses by increasing verisimilitude, even when theories are false.
  2.  **Popper's math was wrong:** The consequence-based definition fails for all false theories (Miller-Tichý), rendering it useless for actual science.
  3.  **The fix is semantic:** Moving to "likeness" (Niiniluoto/Oddie) rescues the Drude/Sommerfeld ranking by treating theories as points in a physical state space rather than sets of sentences.
  4.  **The residual problem:** The "likeness" fix relies on the assumption that we can define a language-independent metric of physical similarity. This is plausible in continuous theory refinement (your field) but contentious in radical ontological shifts.

  Popper wanted verisimilitude to be a logical measure. The lesson of the last 50 years is that it is likely a *structural* or *geometric* relation between models and the world, not a syntactic relation between propositions. For a physicist, that should be a comforting distinction: it moves the concept from the logician's ledger to the modeler's phase space.
