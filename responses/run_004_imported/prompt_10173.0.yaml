      *   *The Fix:* Most anti-realists retreat. They don't say "All truths are knowable." They say "All *meaningful* statements are verifiable" or they restrict the logic (e.g., intuitionistic logic) to block the derivation. They accept that some truths might be *decidable* but not yet decided, but they have to be very careful not to assert the existence of "unknown truths" in a realist sense.

