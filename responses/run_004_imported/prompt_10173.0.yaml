  2.  **Deconstruct Fitch's Paradox (The Core Logic):**
      *   *Premise 1 (Knowability Principle):* All truths are knowable. ($\forall p (p \rightarrow \diamond Kp)$)
      *   *Premise 2 (Factivity of Knowledge):* If you know $p$, $p$ is true. ($Kp \rightarrow p$)
      *   *Premise 3 (Distribution):* Knowing a conjunction implies knowing each conjunct. ($K(p \land q) \rightarrow Kp \land Kq$)
      *   *The Trick:* Consider a specific proposition: "$p$ is true, but $p$ is not known." ($p \land \neg Kp$)
      *   *The Derivation:*
          1.  Assume there is an unknown truth: $p \land \neg Kp$.
          2.  By Knowability Principle, this conjunction must be *knowable*: $\diamond K(p \land \neg Kp)$.
          3.  If someone *knew* this conjunction, they would know $p$ AND know that $p$ is not known ($Kp \land K(\neg Kp)$).
          4.  But if they know $p$ is not known, that implies $p$ is not known. But they just knew $p$, so $p$ *is* known. Contradiction.
          5.  Therefore, the proposition "$p$ is true but not known" cannot be known.
          6.  If the Knowability Principle says *all* truths are knowable, then the proposition "$p$ is true but not known" cannot be *true*.
          7.  Therefore, there are no unknown truths. All truths are known.
      *   *Conclusion:* The assumption "All truths are knowable" collapses into "All truths are known."

