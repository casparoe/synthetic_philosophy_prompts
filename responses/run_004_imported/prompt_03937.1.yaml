      *   **The Problem:** Spinoza's metaphysics/politics usually defines *natural right* as *potentia* (power/capacity). In the *Theologico-Political Treatise* (TTP), he uses the "fish in water" analogy: right extends as far as power.
      *   **The Tension:** In TP 11.4, Spinoza argues women are naturally unequal to men based on historical observation ("never been a case of men and women reigning together") and passion (lust/jealousy).
      *   **The Question:** Is he applying the *potentia* standard consistently here, or is he swapping in a normative/traditional notion of power (historical authority) disguised as natural power? Does this inconsistency undermine his system, especially regarding slavery/custom? Is there a charitable reading of *imbecillitas* (weakness) that saves consistency, or is this a genuine crack in the armor?
      *   **Tone:** Academic but conversational ("Quick one for you," "sanity-check," "inflict it on students"). Needs to be rigorous but accessible for a seminar prep.

  2.  **Deconstruct the Philosophical Issue:**
