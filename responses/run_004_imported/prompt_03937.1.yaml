answer: |-
  You have hit on exactly the nerve that makes this passage the most contentious in Spinoza's political corpus. Your intuition is spot-on: there is a genuine tension here between his metaphysical definition of *jus naturale* (right = power/capacity) and the sociological generalizations he deploys to exclude women.

  For a seminar, you don't need to "solve" it (because the text is unfinished and arguably inconsistent), but you do need to map the fault lines. Here is a breakdown of the interpretive options, ranging from the charitable to the critical, to help you structure the session.

  ### 1. The Consistency Check: Is he swapping definitions of "Power"?

  You ask if he swaps *potentia* (ontological capacity) for historical authority. The short answer is: **Yes, but with a specific affective mechanism.**

  In the *TTP* (Ch. 16), the "fish" argument is about the State of Nature. Right extends as far as one's determinate power. In the *TP*, however, Spinoza is designing a *civil* state. The goal of the state is not just to express power, but to increase the *collective* power (*potentia multitudinis*) through stability and reason.

  **The Charitable Reading (The Affective Constraint):**
  Look closely at the second half of that paragraph. Spinoza doesn't just say "women are weaker." He says men are governed by **lust and jealousy** regarding women.
  *   **Argument:** It is not necessarily that women lack the *ontological* capacity to rule (though he implies this with the "consult experience" line). It is that *men* lack the rational capacity to accept women's rule.
  *   **The Mechanism:** Because men are ruled by passion (lust/jealousy) in relation to women, a polity where women hold equal power would be constantly destabilized by male violence and discord.
  *   **The Conclusion:** Therefore, excluding women is a pragmatic calculation to maximize the *state's* power. If including women reduces the state's stability (due to male irrationality), then by Spinoza's own metric, the state has "less right" to include them.
  *   **Verdict:** This saves the *logic* of the system (Right = Power of the State to persist) but at the cost of making Spinoza a pessimist about male psychology rather than a misogynist about female ontology.

  **The Critical Reading (The Empirical Fail):**
  Spinoza claims to be an empiricist ("consult experience itself"). He argues that because no nation has *historically* seen co-rule, it must be *naturally* impossible.
  *   **The Flaw:** This is a classic hasty generalization. As you noted with slavery, historical contingency is treated as natural necessity.
  *   **The "Weakness" (*imbecillitas*):** In Spinoza's ethics, weakness is usually a lack of rational control over affects. Is he saying women are inherently more passive? Or that their social positioning makes them so? The text suggests the former ("origin of it is in their weakness"), which contradicts his monism (minds are not sexed).
  *   **Verdict:** Here, the *potentia* framework buckles. He is conflating *actualized historical power* (men have ruled) with *natural capacity* (men can rule). By his own lights, if women *could* rule but are prevented by custom, they have the natural right to do so, and the custom is an oppression that diminishes the total power of the multitude.

  ### 2. The Slavery Comparison (Your strongest point)

  You are absolutely right to link this to slavery. Spinoza groups women, slaves, children, and servants together as "under authority."

  *   **The Problem:** Spinoza's metaphysics suggests slavery is a diminution of power. A slave acts on another's command, not their own *conatus*. To say slaves are "naturally" excluded from the democratic covenant looks like he is naturalizing a civil institution.
  *   **The Distinction:** Spinoza tries to distinguish between those "under allegiance to laws" (citizens) and those "under authority of masters/parents." But in a Democracy (which is supposed to be the most natural regime), this distinction becomes murky.
  *   **Seminar Angle:** This is where you can ask students: Is Spinoza's naturalism strong enough to critique patriarchy/slavery, or does his 17th-century sociology hijack his metaphysics? Most feminist Spinozists (like Moira Gatens or Genevieve Lloyd) argue the latter. His metaphysics *could* support equality (minds are equal), but his politics retreats to custom.

  ### 3. The "Unfinished" Caveat

  It is worth reminding students that this is the *Tractatus Politicus*, unpublished at his death.
  *   **Speculation:** He might have revised this. The argument feels rushed compared to the rigorous derivations in earlier chapters.
  *   **Counter-point:** However, the sentiment aligns with his letters (e.g., Letter 58 to Boxel, where he is skeptical of female authority). It's likely not just a draft error but a genuine blind spot.

  ### 4. How to Frame this for the Seminar

  Don't hide the tension; make it the climax of the session. Here is a proposed flow:

  1.  **Establish the Baseline:** Review *Jus Naturale = Potentia* from the *TTP*. (The Fish).
  2.  **Introduce the Text:** Read TP 11.4.
  3.  **The Trap:** Ask the students: "Based on the Fish analogy, if a woman *can* rule, does she have the right? Spinoza says 'no.' Why?"
  4.  **The Two Hypotheses:**
      *   **Hypothesis A (Metaphysical):** Women lack the *conatus*/capacity. (Critique: Contradicts Monism).
      *   **Hypothesis B (Political/Pragmatic):** Men's passions make female rule destabilizing. (Critique: Ratifies male irrationality).
  5.  **The Slavery Test:** Ask if the same logic applies to slaves. If "experience" shows slaves haven't ruled, do they lack natural right? If students say "no," ask why the logic holds for women but not slaves.
  6.  **The Takeaway:** Spinoza's system is powerful enough to unmask superstition (in the *TTP*), but perhaps not powerful enough to unmask the "naturalness" of social hierarchy when the philosopher is embedded within it.

  ### Recommended Secondary Sources for your Prep:
  *   **Moira Gatens, *Feminist Interpretations of Spinoza*:** Essential. She argues Spinoza's imagination is shaped by patriarchal structures even if his metaphysics isn't.
  *   **Susan James, *Spinoza on Philosophy, Religion, and Politics*:** Very good on the affective dimensions of this passage.
  *   **Étienne Balibar, *Spinoza and Politics*:** Discusses the transition from natural right to civil right and where the exclusions happen.

  **Bottom Line:** You aren't missing a clean answer because there isn't one. The passage is where Spinoza's radical naturalism crashes into his conservative sociology. If you present it as a "failure case" for his method, you'll have a fantastic seminar.
