  *(Refining the "Weakness" point)*: *Imbecillitas* in Spinoza often refers to a lack of power of the mind to control affects. If women are "weaker," is it biological or social? Spinoza says "consult experience." This is empirical induction. The problem is the sample size is biased. I should mention this empirical flaw.

