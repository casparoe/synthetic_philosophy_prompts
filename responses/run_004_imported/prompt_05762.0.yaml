answer: |-
  Good evening, everyone. For those of you who don't know me, I'm a fellow student in Marcos's PhD seminar. And I need to start by admitting something: Marcos knew exactly what he was doing when he asked me to give this toast. He knows we are currently reading Plato's *Laws* cover-to-cover. He knows I'm the type of person who would treat a birthday party like a textual analysis. Honestly, this wasn't an invitation to speak; it was a trap.

  But, since I walked right into it, I have to point out a remarkable coincidence. We are currently in the section of the *Laws* where the Athenian Stranger argues that wine drinking isn't just about getting drunk—it's a test of character. And Plato lays out a very specific age-graded policy. You can taste wine in your twenties, you can drink moderately in your thirties, but you are not fully licensed to enjoy it at dinner parties until you turn forty.

  So, technically, according to ancient Athenian law, Marcos isn't just turning forty this weekend. He is finally graduating.

  Now, Plato argues that Dionysus gave wine to older men as a kind of medicine. He says that as we age, our souls can become rigid, fearful, or stiff—like cold iron. Wine, taken in the right company, reheats the soul and makes it pliable again. And I have to say, looking at Marcos's journey—quitting a stable job, going back to school in his thirties, taking on a room full of twenty-somethings like me—he clearly didn't need the wine to avoid becoming rigid. He's already the most flexible person I know. But if Plato says the wine helps keep the soul young, then I suppose we are obligated to help him with his prescription.

  There is, however, one final rule from the *Laws* that we must respect tonight. Plato insists that no drinking party can succeed without a sober "President" or ruler to keep order and ensure the conversation stays virtuous.

  Looking around the room, I think we all know who the true ruler of this house is. So, while Marcos may have the license to drink, I think we can all agree that his wife remains the designated Symposiarch for the evening.

  Marcos, may your fortieth year be like the best symposium: warm, lively, and guided by wisdom. May your soul stay soft as iron in the fire, and may you never lack for good friends to share the cup.

  Happy Birthday. Cheers.
