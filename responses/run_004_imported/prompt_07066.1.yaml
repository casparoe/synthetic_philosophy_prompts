          *   *Philosophical Stake:* Ontology. Are we categorizing based on intrinsic properties (essentialism/nominalism) or historical continuity? It shifts the focus from "what they are" to "where they came from."
          *   *Problem with Ring:* If the ring breaks (gene flow stops in the middle), is it one individual or two? It tests the limits of "continuity."

      *   **Pluralism (Kitcher):**
          *   *Core Idea:* There is no single "True" species concept. Different concepts serve different scientific aims (ecology, phylogenetics, breeding, etc.).
          *   *Relation to Ring Species:* The ring shows that "interbreeding" and "distinctness" pull in different directions. Pluralism says "That's fine." Use BSC for one purpose, Phylogenetic for another.
