answer: |-
  You have hit on one of the most famous and significant problems in 20th-century meta-ethics. Your intuition is spot-on: this is widely considered the biggest hurdle for the view you're describing.

  The name of the puzzle you are looking for is **The Frege-Geach Problem** (sometimes called the **Embedding Problem**).

  Here is the breakdown of why this is a problem, why it matters, and how philosophers try to fix it.

  ### 1. The View: Non-Cognitivism / Expressivism
  The position your online interlocutors are taking is called **Non-Cognitivism** (specifically **Emotivism** or **Expressivism**).
  *   **The Claim:** Moral sentences like "Torture is wrong" do not state facts that can be true or false. They express non-cognitive attitudes (emotions, commitments, plans).
  *   **The Analogy:** As you noted, saying "Torture is wrong" is functionally equivalent to saying "Boo, torture!" or "Don't torture!"

  ### 2. The Problem: Logic Requires Truth
  Logic, specifically the **Modus Ponens** structure your friends are using, relies on **truth conditions**.
  *   *Premise 1:* If torture is wrong, then factory farming is wrong.
  *   *Premise 2:* Torture is wrong.
  *   *Conclusion:* Therefore, factory farming is wrong.

  For this argument to be valid, the phrase "torture is wrong" must mean the **exact same thing** in Premise 1 and Premise 2.
  *   In **Premise 2**, the Expressivist says it means "Boo, torture!" (an expression of attitude).
  *   But in **Premise 1**, it is inside an "If... then" clause. You aren't actually saying "Boo!" in Premise 1. You are hypothesizing.

  If "wrong" just means "Boo!", then Premise 1 translates to: *"If 'Boo, torture!', then 'Boo, factory farming!'."*
  That isn't a logical proposition; it's gibberish. You can't put an exclamation of emotion inside a conditional statement and expect it to obey the laws of logic. If moral sentences have no truth value, they can't be premises in a valid argument.

  This is the **Frege-Geach Problem**: How can moral sentences function logically (in conditionals, negations, questions) if they don't describe facts?

  ### 3. Is it an Inconsistency?
  **Yes, strictly speaking.** If someone says "Moral claims have no truth value" and then immediately uses them in a truth-functional logical argument without further explanation, they are being inconsistent.

  In casual online discourse (EA forums, group chats), people are often **pragmatic inconsistent**. They use Non-Cognitivism when they want to dodge a metaphysical burden ("I'm not saying it's *factually* true, just that I dislike it"), but they revert to Cognitivism when they want to win an argument ("Therefore, you are logically compelled to agree with me!").

  ### 4. Can the Position Be Saved?
  Philosophers who hold this view (Modern Expressivists) know about the Frege-Geach problem. They haven't abandoned ship; they've built complex engines to keep it afloat. There are two main ways they try to resolve it:

  **A. Quasi-Realism (Simon Blackburn)**
  This is the most famous attempt. Blackburn argues that even if moral facts don't exist *independently* of us, our moral language is so deeply structured like factual language that we can "earn the right" to talk *as if* there are moral truths.
  *   We can treat moral statements as true/false *within the discourse*, even if, metaphysically, they are just projected attitudes.
  *   **The Catch:** Critics say this is just Cognitivism in disguise. If it walks like a duck (truth-apt) and quacks like a duck (logic), why insist it's not a duck?

  **B. Expressivist Logic (Allan Gibbard, etc.)**
  Some argue we need to redefine what "validity" means. Instead of validity being about **preserving truth** (since there is no moral truth), validity is about **consistency of attitudes**.
  *   *Revised Logic:* It is inconsistent to hold the attitude "Boo, torture" while simultaneously accepting "If Boo, torture, then Boo, factory farming," yet refusing to say "Boo, factory farming."
  *   You aren't logically contradicted on *facts*; you are psychologically or rationally inconsistent in your *planning/attitudes*.

  ### 5. Summary for Your Arguments
  When you encounter this online, you can confidently say:

  1.  **Name it:** "You're running into the **Frege-Geach Problem**."
  2.  **Point out the shift:** "You're treating 'wrong' as an emotion when it suits you, but as a truth-apt property when you need to use Modus Ponens. You can't have it both ways without a sophisticated theory of **Quasi-Realism**."
  3.  **The Verdict:** Most casual arguers *are* being inconsistent. Professional Expressivists have complex theories to bridge the gap, but they usually admit it's the hardest part of their job.

  So, you aren't missing anything. You've independently rediscovered a problem that troubled philosophers like Peter Geach and John Searle in the 1960s and still drives meta-ethical research today.
