      *   *Addressing Kripke:* Kripke argues that properties are contingent. Leibniz argues (in this passage) that for the individual concept, all predicates are necessary *to that concept*. (Though Leibniz distinguishes necessary vs. contingent truths, the individual concept contains them all). If Adam doesn't sin, he isn't Adam. Kripke would say Adam could not have sinned and still be Adam. This is a direct clash.

  7.  **Final Structure:**
      *   **Intro:** Define the debate (CT vs. TWI) and state Leibniz's position via the CIC.
