      *   **The Role of the CIC:** Elaborate on how the CIC functions as the individuator. It prevents "vague" individuals.
      *   **Conclusion:** Leibniz anticipates the *logical structure* of Counterpart Theory but within a different metaphysical framework. He rejects the Kripkean/Plantingan view that an individual can retain identity across different property sets.

