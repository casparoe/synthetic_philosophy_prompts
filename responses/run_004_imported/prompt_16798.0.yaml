prompt: |-
  Ok so this is a weird rabbit hole I fell down last weekend and I can't stop thinking about it. I'm a backend engineer, and I got into Frege originally through the CS side of things -- his name keeps coming up as basically the guy who invented modern quantificational logic and the sense/reference distinction, which is apparently upstream of a bunch of stuff in type theory and formal semantics. Anyway I ended up on Wikipedia at like 1am and found out that in the last year or two of his life (1924-ish, he died in 1925) Frege kept a private diary that didn't even surface until decades later, and its apparently full of ugly stuff -- antisemitic remarks, contempt for the Weimar democracy, wanting a strongman "leader" to fix Germany, that whole package. It kind of wrecked my mental image of the guy as this impossibly careful, almost inhuman logic-machine.

  I mentioned this to a coworker who did a philosophy minor and he just said "that's the genetic fallacy, the diary and the logic are totally seperate, next question," and I get the point but it didn't fully satisfy me. Because Frege's actual philosophical program wasn't just "logic" in some generic sense, it was this very specific, forceful claim that logical and mathematical truths are completely objective and mind-independent -- they live in what he called a "third realm," untouched by anyone's psychology or culture -- and he was scathing about "psychologism," the idea that logic could be contaminated by the particular quirks or opinions of actual human thinkers. So is there any real philosophical connection between that picture and the diary's contempt for pluralism and democratic disagreement, or is that just two unrelated things that happen to both sound "absolutist" and I'm pattern-matching too hard? I'd like you to actually walk through how the people who've written seriously about this (historians of logic, Frege scholars, whoever) tend to come down on it -- the actual range of positions, not just a mushy "it's complicated" -- and tell me which argument you find most convincing and why, instead of just staying neutral and dodging the question.
