      *   *Key Distinction:* Bertrand's paradox allows a solution *within* the PoI framework (via Maximum Entropy/Invariance) if we accept Jaynes' physical constraints. The Cube Factory resists this because "Length" vs "Volume" isn't a matter of coordinate systems on the same space, but different physical quantities.
      *   *Is Cube Factory harder?* Yes, for the Principle of Indifference specifically. Bertrand shows PoI needs *constraints*. Cube Factory shows PoI needs *causal ontology*.
      *   *Van Fraassen's Goal:* He wants to show that probabilities aren't logical relations. Jaynes wants to show they are logical relations *given the right physical constraints*.
      *   *Final check:* Does Jaynes' invariance apply? Translation/Rotation don't make sense for a scalar size. Scale invariance does, but it doesn't pick $L$ over $L^3$ uniquely without knowing which variable is the "control variable."

  8.  **Drafting the Response:**
