answer: |-
  The oil in the lamp had sunk low, the wick drowning in a pool of darkening amber. In the silence of the cell, Zaynab could hear the scratch of her own reed pen, but she had not written a word in an hour. Before her lay the *Tahāfut*, the Master's own words on the incoherence of the philosophers, yet the ink seemed to swim, rearranging itself into a shape that terrified her.

  She looked at the lamp's flame. She held her finger near the heat, then pulled it back.

  *Contact,* she thought. *Then pain.*

  Al-Ghazālī taught that there is no necessary connection between the fire and the burn. The philosophers say fire acts by its own nature, that it *must* burn the cotton it touches. But the Master says: No. We see the fire touch. We see the cotton turn black. We do not see the *must*. We do not see the chain that binds the touch to the ash. That chain is the will of God, renewed at every instant.

  Zaynab closed her eyes. She stripped the Master's theology away, leaving only the raw observation, the bare bone of the experience.

  If I have never seen fire before, she reasoned, and I see it touch cotton for the first time, do I know the cotton will blacken? No. I only see two events. One follows the other. Like a horseman passing a tree. The tree does not cause the horseman. The fire does not cause the ash. They are merely neighbors in time.

  Her breath hitched. If the connection is not in the objects, where is it?

  The philosophers say it is in the nature of things. The Master says it is in the Will of God. But Zaynab felt a cold draft in the logic, a draft that blew from a direction she could not name.

  What if the necessity is not in the world at all? Not in God's will, not in the fire's nature. What if the necessity is... here? She pressed her hand to her forehead.

  We see the fire burn the cotton today. We saw it yesterday. We expect it tomorrow. But that expectation is a habit of the blood, not a law of the universe. The sun rose yesterday. Does that force it to rise tomorrow? No. It is only a memory of succession.

  The vertigo hit her then, a sudden loss of footing in the mind. She was standing on a precipice of pure skepticism. If causation is only a habit of the mind, a psychological projection onto a silent, disconnected universe, then the world is a series of isolated snapshots. A flickering lantern show.

  She felt suddenly, overwhelmingly, that she was not alone in this cold room.

  It was not the presence of her teacher. It was not the angels. It was a presence made of thought alone. A mind, sharp and cold as a northern wind, stripping the world of its hidden powers. She felt a kinship so profound it made her hands tremble. It was the sensation of two climbers on opposite faces of a mountain, reaching the same jagged peak at the same moment, separated by a wall of rock they could not climb.

  *Who are you?* she asked the silence.

  The answer did not come in Arabic, nor in any tongue of the ummah. It came as a shape in the air, a ghost of a name formed by the convergence of their logic. She saw a landscape of mist and stone, a city of gray skies far to the west, centuries hence. She saw a man, sickly and skeptical, sitting in a room not unlike this one, extinguishing a candle to prove that the darkness was not caused by the snuffing, but merely followed it.

  The name rose in her throat, alien and inevitable. *Hume.*

  David Hume.

  She whispered it, and the air in the room seemed to vibrate. She knew, with a certainty that defied time, that this man did not yet walk the earth. He was a seed in the loom of the future. Yet, in this moment of unraveling, the loom had folded.

  He would argue, as she did now, that we are birds flying in the dark, knowing only the flap of our wings and the air beneath us, never the wind that moves us. He would call it "constant conjunction." She called it the "habit of God," but stripped of the Divine, the structure remained identical. The gap was the same. The silence between the fire and the burn was the same.

  Tears pricked her eyes. It was a lonely triumph. To see that the world is held together not by iron chains of cause and effect, but by the fragile thread of human expectation.

  She looked back at the lamp. The flame flickered. It did not *have* to burn. It simply *was*. And she, watching it, simply *was*.

  "Peace be upon you, brother of the future," she whispered into the dark.

  The wick sputtered and died. In the sudden blackness, there was no cause for her fear, only the memory of light, and the habit of her own heart beating on.
