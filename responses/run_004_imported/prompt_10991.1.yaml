prompt: |-
  I'm recording an episode of our department's public philosophy podcast, and my guest is a contemporary just war theorist whose new book centers on a defense of Elizabeth Anscombe's pamphlet opposing Oxford's decision to grant Harry Truman an honorary degree -- including her central claim that the atomic bombings of Hiroshima and Nagasaki were murder, without qualification, and that no reckoning of consequences could have made them otherwise. Please draft eight to ten interview questions that go beyond having her simply restate the position. I want at least one question on how she individuates Truman's intention from his mere foresight, given that the chosen targets were themselves centers of both war industry and civilian population; one on whether her refusal to weigh the contested claim that the bombs spared lives that a land invasion would otherwise have cost reflects moral seriousness rather than fanaticism; one on what independent argumentative work this particular case does for the critique of consequentialism Anscombe develops more fully in "Modern Moral Philosophy," as against serving merely as a vivid illustration of a view she already held; and one on the gap between judging an act murder and judging that a university should withhold an honorary degree over it. For each of these, add a follow-up keyed to the answer she is most likely to give, and close with a question asking whether the position leaves room for anything like a Walzer-style "supreme emergency" exception, or whether it is meant to hold however catastrophic the alternative.
