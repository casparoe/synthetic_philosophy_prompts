answer: |-
  Here are nine interview questions designed for your podcast episode, including the four mandatory thematic probes with tailored follow-ups, and the required closing question on "supreme emergency."

  **1. Contextualizing Anscombe's Intervention**
  Elizabeth Anscombe's protest in 1956 was intellectually daring, but it was also socially isolating; she stood largely alone among her peers in this specific public intervention. When we revisit this pamphlet today, are we primarily recovering a historical artifact of Catholic conscientious objection, or do you argue that her specific reasoning regarding *this* case offers a corrective that contemporary Just War Theory has drifted away from?

  **2. The Structure of Intention (Mandatory Probe)**
  A standard defense of the bombings relies on the Doctrine of Double Effect: Truman intended to end the war, merely foreseeing but not intending civilian casualties. Anscombe rejects this, arguing that choosing a target *because* it will terrorize or destroy a population makes that destruction intended. Given that Hiroshima and Nagasaki were dual-use targets containing military headquarters and war industry, how do you individuate Truman's intention from his foresight in a way that doesn't simply stipulate the conclusion? How do you analytically separate the destruction of the war industry from the destruction of the civilians living within it?

  *   **Follow-up:** You will likely argue that making civilian destruction a *means* to surrender counts as intention, regardless of the military infrastructure present. But if the military target had been destroyed with zero civilian casualties via a hypothetical precision strike, would the moral character of the act change? If yes, doesn't that suggest the civilians were collateral rather than the primary object of the will?

  **3. Non-Combatant Immunity in Total War**
  Anscombe's position rests on a robust definition of "innocence" that doesn't necessarily align with legal citizenship or even economic contribution to the war effort. In an era of "total war" where the home front is economically integrated with the front line, does her view require us to shrink the category of legitimate targets significantly, or does it require us to expand the category of protected persons to include almost everyone outside uniform?

  **4. Moral Seriousness vs. Fanaticism (Mandatory Probe)**
  Critics often argue that refusing to weigh the contested claim that the bombs spared lives lost in a potential land invasion amounts to moral fanaticism—a purity of conscience purchased at the price of real-world blood. How do you respond to the charge that Anscombe's refusal to engage with the consequentialist calculus isn't moral seriousness, but rather an abdication of the responsibility to minimize overall suffering?

  *   **Follow-up:** You will likely respond that one cannot minimize suffering by committing murder, as murder is intrinsically evil. But does this position leave the moral agent with "clean hands" while accepting a catastrophic outcome they could have prevented? How do you reconcile the agent's personal moral integrity with their political responsibility for the deaths caused by the alternative course of action?

  **5. The Case Against Consequentialism (Mandatory Probe)**
  In "Modern Moral Philosophy," Anscombe argues that consequentialism is incoherent because it lacks a conception of justice that binds the will. Does the Truman case merely serve as a vivid, emotional illustration of that pre-existing view, or does the specific historical reality of the atomic bomb do independent argumentative work? Does the unique scale of nuclear destruction expose a flaw in consequentialism that smaller-scale dilemmas might not reveal?

  *   **Follow-up:** You will likely suggest that the extreme stakes strip away the nuance consequentialists use to hide the injustice of their calculations. If that is the case, does this imply that consequentialism might still function in lower-stakes political decisions, or does the Truman case act as a *reductio ad absurdum* for the framework in its entirety?

  **6. The Rhetoric of "Murder"**
  Anscombe does not mince words; she explicitly labels the bombings "murder." In public philosophy, there is often a tension between precise technical definitions and rhetoric designed to shock the conscience. Do you worry that using the legal and moral category of "murder"—typically reserved for private criminal malice—risks obscuring the specific nature of state violence, or is that shock value necessary to break through the normalization of strategic bombing?

  **7. The Gap Between Act and Honor (Mandatory Probe)**
  There is a logical gap between judging an act to be morally heinous and judging that an institution should withhold an honorary degree. One might argue that Oxford's degree recognizes past leadership or status, not a moral seal of approval. Why does Anscombe insist that the university's complicity in honoring Truman is a necessary site of philosophical contestation? What is the moral link between the act of murder and the administrative act of granting a degree?

  *   **Follow-up:** You will likely argue that honoring implies endorsement, making the university complicit in the moral evaluation of the honoree. If we accept that, does it impose a duty on universities to vet the moral history of all potential honorees across all domains? For instance, should a brilliant scientist be denied an honorary degree if they funded their research through morally dubious means?

  **8. Contemporary Relevance: Drones and AI**
  Anscombe wrote before the age of remote warfare and autonomous weapons systems. Today, we have technology that promises "surgical" strikes, theoretically aligning better with non-combatant immunity. However, does Anscombe's critique of intention suggest that the *remoteness* of the killing might actually worsen the moral hazard, making it easier for agents to dissociate their intention from the human reality of the destruction?

  **9. The "Supreme Emergency" Exception (Closing Question)**
  Finally, Michael Walzer and other contemporary theorists allow for a "supreme emergency" exception, where the imminent threat of a civilization's destruction might permit the targeting of innocents. Anscombe's position seems to admit no such exceptions. Is her view meant to hold however catastrophic the alternative? If the choice were genuinely between the bombing of a city and the enslavement or extermination of one's own population, does her absolute prohibition on murder still stand?
