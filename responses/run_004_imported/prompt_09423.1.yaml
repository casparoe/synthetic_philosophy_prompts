prompt: |-
  I did not expect to need actual philosophy for my job this year, but here we are. I'm an immunology professor, and back in the fall I got roped onto my university's Research Integrity Committee, which just got reactivated and given more teeth after -- well, you've probably seen the same headlines about manipulated data that I have, it feels like a new one breaks every few months. My actual first case landed on my desk two weeks ago, and it's a lot messier than the onboarding session made it sound.

  Short version: a postdoc in a cancer biology lab manipulated, and in a couple of spots outright fabricated, the quantification behind two of six figures in a paper (western blots and mouse tumor counts). Nobody disputes she acted alone or that the paper is getting retracted -- that part's easy. The fight is about the other three co-authors: the PI, an outside collaborator at another university who ran the statistical analysis on data as it was handed to him and never touched a raw blot, and a grad student whose own experiments in the same paper are totally clean. Our authorship policy just says authors "share responsibility for the accuracy and integrity of the reported work" and leaves it at that, which is not alot of help when the whole question is what that's even supposed to mean for three people who had no realistic way of knowing.

  Half the committee wants a finding only against the postdoc, with the other three simply asked to sign off on the retraction and otherwise cleared. The other half, led by our chair (she did a philosophy phd before moving into research administration), keeps insisting that co-authoring a paper is itself a joint act, not just four individual contributions stapled together, and that this creates a real, if lesser, form of shared responsibility that doesn't just reduce to who-knew-what -- she threw out some names, joint commitment, shared agency, Gilbert or Bratman or maybe both, I wrote it down wrong and don't have time to go chase down the actual texts before we reconvene a week from Monday. Could you draft the memo I'd actually bring to that meeting? I need a real recommendation on what, if anything, happens to the three non-fabricating co-authors, a rough timeline for next steps, and reasoning solid enough that the "only punish the person who did it" side of the room would have to actually engage with it rather than just being told they're wrong -- I think they've got a genuinely strong point, and I don't want the memo to just bulldoze past it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Immunology Professor, new member of Research Integrity Committee (RIC).
      *   **Context:** First case involves postdoc fabrication/manipulation (2 of 6 figures). Postdoc admits guilt. Paper being retracted.
      *   **The Conflict:** What to do with the three innocent co-authors (PI, external statistician, grad student)?
          *   *Side A:* Only punish the postdoc. Others sign retraction, otherwise cleared. (Focus on individual culpability/knowledge).
          *   *Side B (Chair):* Co-authorship is a joint act creating shared responsibility regardless of specific knowledge. Cites philosophy (Gilbert, Bratman, joint commitment/shared agency).
      *   **Task:** Draft a memo for the next RIC meeting (one week away).
      *   **Requirements:**
          *   Real recommendation on the three non-fabricating co-authors.
          *   Rough timeline for next steps.
          *   Reasoning that bridges the gap between the two sides (acknowledges Side A's strength but incorporates Side B's philosophical framework).
          *   Tone: Professional, academic, nuanced, actionable, respectful of the gravity of the situation.

  2.  **Deconstruct the Philosophical/Policy Conflict:**
      *   *Side A (Individual Culpability):* Intuitively fair. Why punish someone who didn't know? Practical. Avoids discouraging collaboration. Aligns with legalistic "mens rea" (guilty mind).
      *   *Side B (Joint Commitment):* Aligns with ICMJE/COPE guidelines (all authors must vouch for the whole). Science is a collective enterprise. Trust is the currency. If you put your name on it, you endorse it.
      *   *The Bridge:* Distinguish between *culpability* (blame/punishment) and *responsibility* (obligation/remediation). One can be responsible for fixing the mess without being culpable for making it. This is the key philosophical pivot. Gilbert/Bratman talk about "plural subjects." If we act as a "we," we bear the consequences as a "we," even if one "I" broke the rules.

  3.  **Determine the Recommendation:**
      *   *Postdoc:* Severe sanction (termination, debarment recommendation). Agreed by all.
      *   *PI:* Needs accountability but not punishment. Must demonstrate oversight failure (not fraud). Recommendation: Formal letter of caution, mandatory training on oversight, internal audit of lab data for X years.
      *   *External Statistician:* Least responsibility. Data was provided as "clean." Recommendation: No sanction, but must formally withdraw endorsement of the specific statistical claims in the retraction notice.
      *   *Grad Student:* Vulnerable position. Clean data. Recommendation: No sanction, mentorship support to ensure their reputation isn't tarnished.
      *   *All Three:* Must sign the retraction notice acknowledging the integrity failure of the *paper*, even if not their *conduct*. This satisfies the "joint act" theory.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard official memo format.
      *   **Subject:** Clear and specific.
      *   **Executive Summary:** Brief overview of the finding and the core philosophical pivot (Responsibility vs. Culpability).
      *   **Factual Background:** Keep it tight. (Postdoc fraud, 2/6 figures, others innocent of fraud).
      *   **The Core Question:** Frame the debate accurately. Individual fault vs. Collective endorsement.
      *   **Philosophical & Policy Framework:** This is where I integrate the Chair's hints (Gilbert/Bratman) without getting too jargon-heavy. Explain *Joint Commitment* simply: Authorship = a promise to the scientific community.
      *   **Analysis of Co-Author Roles:**
          *   PI: Highest duty of care.
          *   Statistician: Duty limited to scope of analysis.
          *   Grad Student: Peer level, limited oversight capacity.
      *   **Recommendations:** Specific actions for each.
      *   **Timeline:** Next 30-60-90 days.
      *   **Conclusion:** Reiterate the goal (integrity + fairness).

  5.  **Refining the Argument (The "Philosophy" Bit):**
      *   I need to make sure the philosophy isn't just name-dropping. It needs to do work.
      *   *Concept:* "Plural Subject Theory" (Gilbert). When authors publish, they form a "we."
      *   *Application:* The "we" is tainted. The "we" must fix it. But individual "I"s are only punished for their own actions.
      *   *Distinction:* *Retrospective Blame* (who gets punished) vs. *Prospective Responsibility* (who fixes it).
      *   *Why Side A should accept it:* It doesn't punish the innocent.
      *   *Why Side B should accept it:* It upholds the sanctity of co-authorship.

  6.  **Review against Constraints:**
      *   *Tone:* Professional, not preachy.
      *   *Length:* Long enough to be substantive, short enough to be read.
      *   *Specifics:* Mention the PI, Statistician, Grad Student specifically.
      *   *Timeline:* Include dates/steps.

  7.  **Self-Correction/Polishing during drafting:**
      *   *Initial thought:* Maybe suggest the PI loses funding? *Correction:* No, that's too severe for negligence unless it's systemic. Stick to oversight correction.
      *   *Initial thought:* Dive deep into Bratman's "Shared Intention." *Correction:* Keep it accessible. The committee members aren't all philosophers. Use the concepts to justify the policy, not to show off.
      *   *Check:* Did I address the "only punish the postdoc" side? Yes, by explicitly separating *sanctions* from *responsibility*.
      *   *Check:* Did I address the Chair's point? Yes, by validating the "joint act" theory as the basis for the retraction signature.

  8.  **Final Polish:** Ensure the distinction between "Research Misconduct" (fabrication/falsification/plagiarism) and "Questionable Research Practices" or "Oversight Failure" is clear. The innocent co-authors did not commit misconduct, but they bear the burden of the correction.

  9.  *(Final check of the prompt requirements)*: "Draft the memo I'd actually bring to that meeting." "Real recommendation." "Rough timeline." "Reasoning solid enough." Okay, ready to write.

  *(Self-Correction on Philosophy Names)*: The user mentioned Gilbert (Margaret Gilbert, Joint Commitment) and Bratman (Michael Bratman, Shared Intention/Plan). I should reference these correctly in the memo to show the Chair I listened, but explain them in plain English for the rest of the committee.

  *(Tone Check)*: The user is an immunologist. The memo should sound like it comes from a scientist who has done the homework, not a philosopher pretending to be a scientist. It needs to be pragmatic.

  *(Timeline)*: Needs to be realistic. Retraction notices take time. Investigations take time.

  *(Recommendation)*: Make sure it's actionable. "Letter of Caution" is a specific administrative tool.

  Let's assemble.cw
answer: |-
  **MEMORANDUM**

  **TO:** Research Integrity Committee (RIC)
  **FROM:** [Your Name], RIC Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendations Regarding Case #2023-09 (Cancer Biology Lab Data Fabrication)

  ### 1. Executive Summary

  This memo outlines findings and recommendations regarding the misconduct identified in [Paper Title/Reference]. While the investigation confirms that the Postdoctoral Fellow (Dr. X) acted alone in fabricating/falsifying data in two of six figures, the Committee remains divided on the status of the three innocent co-authors (PI, External Statistician, Graduate Student).

  **Recommendation:** The Committee should distinguish between *culpability* (blame warranting sanction) and *responsibility* (obligation to remediate). I recommend that while only the Postdoc faces formal misconduct sanctions, all co-authors must formally participate in the retraction process as a condition of maintaining good standing. This approach satisfies the need for individual fairness while upholding the philosophical and policy basis of co-authorship as a joint commitment to the scientific record.

  ### 2. Factual Background

  *   **Subject:** [Paper Citation]
  *   **Finding:** Dr. X (Postdoc) fabricated western blot quantification and mouse tumor counts (Figures 3 & 4).
  *   **Exoneration:** Figures 1, 2, 5, and 6 are valid. The Graduate Student's data (Figures 1 & 2) is unaffected. The External Statistician received data as represented by the PI/Postdoc.
  *   **Consensus:** Dr. X committed research misconduct (Fabrication/Falsification). The paper must be retracted.
  *   **Dispute:** The extent of obligation/sanction for the PI, Statistician, and Grad Student.

  ### 3. The Core Question: Individual Fault vs. Joint Commitment

  The Committee's debate centers on the interpretation of our Authorship Policy, specifically the clause that authors "share responsibility for the accuracy and integrity of the reported work."

  *   **Position A (Individual Culpability):** Responsibility is contingent on knowledge and control. Since the three co-authors could not reasonably have detected the fraud, holding them accountable punishes negligence where there is none. This aligns with legalistic standards of *mens rea* (guilty mind).
  *   **Position B (Joint Commitment):** Co-authorship is not merely the sum of individual contributions but a "plural subject" (Gilbert, 1990; Bratman, 1992). By submitting a paper, authors form a joint commitment to the scientific community that *the work as a whole* is sound. This creates a shared agency that survives the specific actions of individuals.

  **Synthesis:** Both positions hold validity. Position A is correct regarding *sanctions* (punishment), but Position B is correct regarding *remediation* (restoring integrity). We can affirm the "joint act" of authorship without assigning "joint guilt" for the fraud.

  ### 4. Analysis of Co-Author Obligations

  To bridge the divide, we must differentiate the levels of responsibility based on role and capacity for oversight, while maintaining the principle that all authors vouch for the whole.

  **A. Principal Investigator (PI)**
  *   **Role:** Ultimate supervisor of the lab environment and data management.
  *   **Assessment:** While not complicit in fraud, the PI failed in *oversight responsibility*. In a joint commitment, the senior partner bears the burden of ensuring the conditions for integrity exist.
  *   **Obligation:** Must acknowledge the failure of lab oversight mechanisms, even if not the fraud itself.

  **B. External Statistician**
  *   **Role:** Analyzed data provided as "verified."
  *   **Assessment:** Limited capacity to verify raw wet-lab data. Their joint commitment extends to the *analysis* of the provided data, not the generation of it.
  *   **Obligation:** Must withdraw statistical endorsement of the specific fabricated figures but should not be implicated in the data generation failure.

  **C. Graduate Student**
  *   **Role:** Junior co-author with clean data in the same paper.
  *   **Assessment:** Lacks authority to audit senior lab members. Vulnerable to reputational collateral damage.
  *   **Obligation:** Minimal administrative burden; protection of their independent contribution is paramount.

  ### 5. Recommendations

  I propose the Committee adopt the following findings. This avoids punishing the innocent (satisfying Position A) while enforcing the weight of co-authorship (satisfying Position B).

  **1. Regarding the Postdoctoral Fellow (Dr. X):**
  *   **Finding:** Guilty of Research Misconduct.
  *   **Action:** Termination of employment (if not already completed). Recommendation to funding agencies for debarment.

  **2. Regarding the PI:**
  *   **Finding:** Not guilty of misconduct, but responsible for **Oversight Failure**.
  *   **Action:**
      *   Issue a **Letter of Caution** to be placed in internal personnel file (not a public finding of misconduct).
      *   Require implementation of a **Data Management Audit Plan** for the lab (e.g., quarterly raw data reviews by a departmental designee) for 24 months.
      *   PI must sign the Retraction Notice alongside the Postdoc, explicitly stating: *"As corresponding author, I accept responsibility for the integrity of the work published under my supervision."*

  **3. Regarding the External Statistician:**
  *   **Finding:** No fault.
  *   **Action:** No sanction.
      *   Statistician must sign the Retraction Notice, but language should be scoped: *"I withdraw my statistical endorsement of Figures 3 and 4 based on the revelation of data fabrication."*

  **4. Regarding the Graduate Student:**
  *   **Finding:** No fault.
  *   **Action:** No sanction.
      *   The Retraction Notice must explicitly exonerate the Graduate Student's data (Figures 1 & 2) to protect their career trajectory.
      *   Student is not required to sign the retraction unless they choose to; the PI should sign on their behalf regarding those figures.

  **5. Regarding the Retraction Notice:**
  *   **Action:** The notice must be a **Joint Statement**. It cannot appear as though only the Postdoc is retracting. All living authors must sign, demonstrating the "joint commitment" to correcting the record, even if the text distinguishes between who committed the error and who is correcting it.

  ### 6. Rationale for the "Middle Path"

  This recommendation is designed to withstand scrutiny from both factions of this Committee:

  1.  **For the "Individual Culpability" faction:** No innocent party is labeled a "misconduct offender." No funding is clawed back from the PI personally. The Grad Student and Statistician face no career penalties. We are not punishing them for the Postdoc's lies.
  2.  **For the "Joint Commitment" faction:** We are affirming that authorship is not a stamp collection. By requiring the PI and co-authors to actively sign the retraction and (in the PI's case) submit to enhanced oversight, we acknowledge that they are part of the "plural subject" that produced the paper. They share the burden of cleaning up the mess, even if they didn't make it.

  This aligns with COPE (Committee on Publication Ethics) guidelines, which suggest that innocent co-authors should not be punished *as if* they were guilty, but they cannot simply walk away from a compromised publication.

  ### 7. Proposed Timeline

  *   **Week 1 (Oct 30):** Committee vote on these recommendations.
  *   **Week 2 (Nov 6):** Draft Retraction Notice circulated to all co-authors for comment. (Crucial step: Allows co-authors to negotiate the *wording* of their responsibility, preserving due process).
  *   **Week 4 (Nov 20):** Finalize Retraction Notice. Submit to Journal Editor.
  *   **Week 6 (Dec 4):** PI submits initial Data Management Audit Plan to Department Chair.
  *   **Week 12 (Jan 8):** First quarterly audit of PI's lab data conducted.

  ### 8. Conclusion

  We are setting a precedent for this university. If we clear the co-authors entirely, we signal that authorship is a reward devoid of risk. If we sanction them as misconduct offenders, we signal that collaboration is too dangerous to attempt.

  The recommended path treats co-authorship as a **fiduciary duty to the public**. The Postdoc broke the trust; the co-authors must help restore it. This allows us to issue a finding that is philosophically robust, policy-compliant, and fair to all parties involved.

  I request we discuss this framework at the reconvened meeting on Monday, November 6th.

  ***

  **Attachments:**
  *   *Draft Retraction Notice Language (for discussion)*
  *   *Summary of COPE Guidelines on Innocent Co-Authors*
  *   *References: Gilbert (1990) "On Social Facts"; Bratman (1992) "Shared Cooperative Activity"*
