      *   **Topic:** The Sleeping Beauty problem, specifically focusing on Adam Elga's argument against van Fraassen's Reflection Principle, rather than just the Halfer/Thirder debate.
      *   **Characters:** Two equally sharp Bayesian epistemologists.
      *   **Setting:** Drinks after a conference talk.
      *   **Positions:**
          *   *Character A (Anti-Reflection):* Elga's case sinks Reflection as a genuine rationality constraint.
