answer: |-
  **Elena:** ...but that's exactly where the pragmatic story loses the plot, Marcus. If the derogatory force were just a matter of *how* the word is deployed, you wouldn't get the projection data so cleanly. When I say, "If the new neighbor is a Zark, we should lock the doors," I haven't asserted that the neighbor is a Zark. Truth-conditionally, the antecedent is hypothetical. But the sentence is still offensive. It still carries the sting. If the sting were purely a matter of you asserting a derogatory proposition, the conditional should defuse it. It doesn't. That suggests the content is sitting there in the lexical entry, waiting to project, regardless of the at-issue truth conditions.

  **Marcus:** You're treating projection like it's the exclusive preserve of semantics. Look, think about the prohibitionist account. The rule isn't "Don't assert derogatory things." The rule is "Don't utter the phonological string /zark/." It's a standing social prohibition on the token itself. So when you embed it in a conditional, you're still uttering the token. You're still tripping the wire. The offense isn't in the proposition expressed; it's in the act of bringing the term into the common ground, even hypothetically.

  **Elena:** But that conflates the *act* with the *meaning*. If I say, "I promise to call you a Zark tomorrow," I've uttered the word, but I haven't insulted anyone yet. The offensiveness seems to track the *content* associated with the term, not just the phonology. In a Potts-style framework, this is textbook Conventional Implicature. It's a separate dimension of meaning. It's not at-issue, which is why it survives negation, but it is conventional, which is why you can't cancel it without sounding infelicitous. You can't say, "He's a Zark, but I don't mean anything bad by it," and expect to be believed. That infelicity points to encoding.

  **Marcus:** The infelicity points to a norm violation, not a semantic contradiction. Think about the Gricean signaling account. Why did the speaker choose "Zark" when "Zarian" was available? The neutral term is synonymous in descriptive content. Choosing the marked term signals an attitude. When you try to cancel it—"He's a Zark, but no offense"—you're signaling two contradictory things at once. You're using the signal that indicates hostility while verbally denying hostility. The pragmatic machinery breaks down, sure, but that doesn't mean the hostility is *in* the word. It means the word is a tool designed to do a specific job, and you're trying to use a hammer to paint a wall.

  **Elena:** Okay, let's press the reclamation data then. This is where your prohibitionism looks too thin, and my encoding view actually has to work for it. When an in-group member says "Zark" to another in-group member, the derogatory force vanishes. Sometimes it becomes affectionate. If the word *itself* encoded the hate, as I'm arguing, how does that content just disappear? If I'm right, it looks like the lexical entry changes.

  **Marcus:** Exactly! And that's the problem for you. If the lexical entry changes, then "Zark" isn't one word. It's two homonyms. One offensive, one not. But that feels ad hoc. On my view, it's the same word, same prohibition, but the pragmatic context overrides the default inference. When an in-group member uses it, the Gricean reasoning shifts. They aren't signaling hostility; they're signaling solidarity. They're flouting the general prohibition to create a boundary between us and them. The meaning doesn't change; the *use* changes. You don't need to posit a magical lexical switch.

  **Elena:** But it's not just about the speaker's identity. It's about the *potential* for offense. If an out-group member overhears that in-group usage and repeats it back, the offense returns instantly. If the meaning were purely pragmatic and context-dependent in the way you suggest, the out-grouper could just say, "I'm using it in the solidarity sense you established." But they can't. The word burns them. That suggests the derogatory potential is latent in the term itself, encoded, and the in-group usage is a special *licensing* condition that suspends the encoded content, not a case where the content was never there to begin with. It's like a loaded gun with a safety catch. The in-group has the key to the safety; the out-group doesn't. But the gun is still loaded.

  **Marcus:** That metaphor works against you, Elena. If the gun is loaded, who loaded it? Society didn't put the bullet in the lexicon; they put it in the social practice. Look, consider the mechanics of your "safety catch." How does that work semantically? Are you saying the lexical entry has a variable for *speaker identity*? So the meaning of "Zark" is literally a function from speakers to contents? That makes compositionality a nightmare. Every time we process the word, do we have to check the speaker's ID card before we can compute the proposition?

  **Elena:** We check context for indexicals all the time. "I," "here," "now." Why not "speaker's social relation to the target group"? Hom's combinatorial externalism handles this. The content of the term is determined by the social ideology associated with it. For the dominant group, that ideology is oppressive. For the marginalized group, they can appropriate the term and associate it with a different ideology—one of resistance or camaraderie. The semantics tracks the ideology. It's not just "who" is speaking; it's which social practice is governing the utterance.

  **Marcus:** But now you've moved the goalposts. You started by saying the derogatory force is encoded in the *lexical entry*. Now you're saying the lexical entry points to an external ideology that can shift. If the ideology shifts, the meaning shifts. If the meaning shifts, then when the in-group uses it, it literally *means something different* than when the out-group uses it. If that's true, then translation between the two uses fails. But it doesn't fail. We understand exactly what the in-group is doing. We understand they are using *the slur*, the offensive one, but repurposing it. If it were a different meaning, we wouldn't recognize the transgression. The fact that we recognize it as *reclamation* proves it's the same dangerous term being handled carefully, not a different term entirely.

  **Elena:** I agree it's the same term. That's why I like the CI model. The descriptive content stays constant—"person of Zarian descent." The expressive dimension stays constant—"contemptible." But in reclamation, the expressive dimension is repurposed. It's not that the contempt is gone; it's that the contempt is redirected outward, or transformed into pride. But here's the strain on *your* view, Marcus. If it's purely a prohibition on utterance, why does the *degree* of offensiveness vary so much by context even for out-groupers? If I say "Zark" in a philosophy paper discussing the word, it's less offensive than if I shout it on a street corner. Your prohibitionism says "Don't utter /zark/." But I *am* uttering it. If the rule is absolute, I've violated it equally.

  **Marcus:** Prohibitionism isn't necessarily absolute. It's a normative default. The Gricean story handles the variance better. In the philosophy paper, I'm mentioning the word, or using it metalinguistically. The hearer recognizes I'm not trying to derogate; I'm trying to analyze. The inference to hostility is blocked by the context. On the street corner, the inference is immediate. The variance isn't a bug; it's evidence that pragmatic reasoning is doing the work. If it were encoded semantic content, the offensiveness should be rigid. It should sting just as much in the lecture hall as on the street, because the meaning hasn't changed. But it doesn't sting the same way.

  **Elena:** It does sting, though. That's why we use scare quotes. That's why I'm hesitating to even say it right now. The semantic load is heavy enough that we need syntactic armor to protect ourselves from it. If it were just pragmatic, we could neutralize it easier. We can't. The history is sedimented in the word.

  **Marcus:** The history is sedimented in the *practice*, not the phonology. You're reifying the social harm into the lexicon. And here's the real difficulty for your encoding view: If the derogatory content is conventional, how do we explain semantic change over time? Slurs lose force, or gain it. If it's in the lexical entry, does the entry get updated every time social attitudes shift? That makes the lexicon incredibly unstable. On my view, the word is stable; the norms governing its use evolve. The pragmatics absorbs the change, leaving the semantics clean.

  **Elena:** But the semantics isn't clean, Marcus. That's the point of the seminar. The derogation isn't an add-on. It's central to how the term functions in inference. If I say, "Zarks are dangerous," and you say, "That's false," you aren't just denying the danger. You're objecting to the categorization itself. The slur does more than describe; it ranks. If that ranking is purely pragmatic, why does it behave like a truth-conditional commitment in so many downstream inferences?

  **Marcus:** Because the pragmatic force is strong enough to mimic semantic commitment. But mimicry isn't identity. Look, we're going to have to agree that both sides have to do some heavy lifting on the embedding data and the reclamation data. You have to explain how encoded hate gets suspended without changing the word. I have to explain why the prohibition feels so intrinsic to the word itself rather than just the context.

  **Elena:** Agreed. Though I still think your "suspension" is just my "contextual parameter" dressed up in pragmatic clothing.

  **Marcus:** And I think your "contextual parameter" is just an admission that the pragmatics is doing the work, but you're charging it semantic rent.

  **Elena:** *[Laughs]* Well, at least we agree the rent is too high.

  **Marcus:** Cheers to that. We'd better get back before they start the next session without us.
