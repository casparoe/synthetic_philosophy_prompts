  *(Self-Correction during final review)*: Make sure Elena doesn't sound like she's just saying "It's complicated." She needs a specific semantic mechanism (like Potts' CI or Hom's combinatorial externalism). Let's lean into the "expressive dimension" idea for her. For Marcus, lean into the "normative prohibition" idea.

