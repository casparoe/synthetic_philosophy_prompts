      *   **The Case:** A patient created a Ulysses Contract (advance directive) during stability, instructing involuntary treatment upon specific manic signs. She has successfully used it twice before. Now, signs appeared again, but during the intervention, she is lucid, articulate, and argues that *this* time is different and her "stable self" shouldn't dictate to her "current self."
      *   **The Question:** Whose judgment should carry the day (Past Stable Self vs. Current Manic-but-Lucid Self)? Is there a principled basis, or is it an unprincipled judgment call?
      *   **Tone:** The prompt is written in a sophisticated, philosophical, and reflective tone. The response should match this register (academic but accessible, nuanced, empathetic, rigorous).
      *   **Goal:** Provide a philosophical analysis of the autonomy/identity/capacity issues at play, offering a framework rather than just a clinical "yes/no."

  2.  **Deconstruct the Philosophical Problem:**
      *   **Core Tension:** Autonomy over time (Diachronic Autonomy) vs. Autonomy in the moment (Synchronic Autonomy).
      *   **Key Concept:** Ulysses Contracts (Precommitment strategies).
      *   **The Twist:** The "Manic-but-Lucid" presentation. Usually, mania implies delusion or incoherence. Here, the patient is *arguing* philosophically (identity change, tyranny of the past self). This challenges the standard "lack of capacity" justification.
      *   **Identity:** Is the "Manic Self" the same person as the "Stable Self"? (Parfit, Schechtman, etc.)
      *   **Epistemic Access:** Who knows the truth of the experience better? The one feeling it or the one observing the pattern?
      *   **Harm Principle:** Risk of harm to self/others vs. liberty.

  3.  **Brainstorming Perspectives:**

      *   *Argument for the Plan (Past Self):*
          *   **Competence:** The past self was competent; the current self is compromised by pathology, even if articulate. Mania often includes "insight blindness" (anosognosia).
          *   **Authenticity:** The stable self reflects "true" values. The manic self reflects distorted neurochemistry.
          *   **Reliability:** The track record shows the plan works and is ratified post-recovery.
          *   **Precommitment:** Rational agents bind themselves to avoid future weakness (Elster, Schelling).

      *   *Argument for the Objection (Current Self):*
          *   **Present Autonomy:** Overriding a currently articulate person is a severe violation of liberty.
          *   **Identity Shift:** If mania feels like "clarity" or a different mode of being, is it fair to suppress it? (Mad Pride movement nuances, though this is Bipolar I with hospitalization history).
          *   **False Positives:** What if she *is* right? (Unlikely given history, but philosophically possible).
          *   **Trust:** Enforcing the plan might damage the therapeutic alliance.

      *   *The "Lucid Mania" Problem:* This is the crux. If she passes a MacArthur Competence Assessment Tool (MACCAT) *in the moment*, does that override the diagnosis? Most clinical guidelines say "insight" is the missing piece in mania. She lacks insight into the *nature* of the state, even if she is logical *within* the state.

  4.  **Developing a Principled Framework:**
      *   Avoid a simple "Past Self Wins."
