      *   *Section 1: The Nature of the Contract.* Discuss Ulysses contracts. Why do we make them? To bind future irrationality. But usually, future irrationality is obvious (slurred speech, delusions). Here, it's subtle.
      *   *Section 2: Capacity vs. Competence.* Distinguish between *performance* (articulate speech) and *capacity* (understanding consequences). In mania, the valuation system is skewed. She isn't weighing risks correctly.
      *   *Section 3: Personal Identity.* Is she the same person? Philosophically, yes, but her *value hierarchy* is inverted. The stable self values stability; the manic self values expansion. Which hierarchy is "true"? The one that persists through recovery.
