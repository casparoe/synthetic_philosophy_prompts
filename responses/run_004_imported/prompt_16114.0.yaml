answer: |-
  Bernard Williams's *On Opera* is a profound resource for a novelist, precisely because he treats opera not as a broken form of drama that needs the music to fix it, but as a complete philosophical genre with its own rules of truth. His central contention is that operatic conventions are not obstacles to realism to be apologized for, but **technologies of disclosure** that achieve a kind of psychological exposure impossible in naturalistic media.

  Here is an explanation of Williams's argument regarding operatic truth, the specific case of the *Don Giovanni* sextet, and how this might illuminate your own use of prose conventions.

  ### 1. Operatic Truth vs. Straightforward Realism
  Williams argues that realistic drama (think Ibsen or Chekhov) is obsessed with **causality and subtext**. In realism, characters hide their true feelings; the drama lies in uncovering the hidden motive. Time moves at a "clock speed."

  Opera, by contrast, operates on **immediacy and expression**.
  *   **The Dying Aria:** When a heroine sings for five minutes while dying, Williams suggests we are not witnessing a biological event, but a **moral and emotional summation**. The convention of "slowing down time" allows the character to fully articulate the significance of their death. The "truth" here is not *how* people die (silently, quickly), but *what that death means* to the human spirit. The music makes the inner state public and undeniable.
  *   **The Ensemble:** When five characters sing contradictory thoughts simultaneously, realism would call this impossible. Williams calls it **psychological geometry**. In a novel, you might switch POV chapters to show conflicting views. In opera, the music allows us to hear the *structure of the conflict* all at once. We hear how the lover's despair harmonizes (or clashes) with the father's rage. The "work" this does is to reveal the **system of relationships** rather than just individual psyches.

  For Williams, operatic truth is about **acknowledgment**. In realism, we analyze characters; in opera, we are forced to acknowledge their emotional reality because the music bypasses our skepticism. We cannot say, "He is just saying that to manipulate her," when the orchestra reveals his genuine terror.

  ### 2. *Don Giovanni* and the Final Sextet
  This brings us to the specific controversy of the final sextet in *Don Giovanni* ("Questo è il fin di chi fa mal"), which occurs after the protagonist has been dragged to hell.

  **The Debate:**
  Many directors and editors cut this sextet. They argue that the dramatic climax is Giovanni's refusal to repent and his subsequent damnation. The return of the other characters (Anna, Ottavio, Elvira, Zerlina, Masetto, Leporello) to sing a moralizing tune about how "evildoers end this way" feels anticlimactic, tonally inconsistent, and breaks the tension. It seems like a tacked-on moral lesson.

  **Williams's Perspective:**
  Williams defends the sextet (or at least, provides the framework to understand its necessity) by looking at what *kind* of truth the opera is telling.
  *   **Giovanni as the Exception:** Don Giovanni represents radical individualism, desire without limit, and a refusal of social categories. He is the disruption.
  *   **The Sextet as the Social Order:** If the opera ended with Giovanni's scream as he falls into the flames, it would be a tragedy about a great individual. But *Don Giovanni* is an *opera buffa* (comic opera) as much as a drama. The sextet restores the **community**. It asserts that the world is bigger than Giovanni. The survivors must plan their weddings and their futures.
  *   **The Operatic Work:** The sextet performs the work of **reintegration**. It signals that the "operatic world" has survived the threat. To cut it is to treat the opera as a thriller about a criminal; to keep it is to treat it as a moral fable about society. Williams would argue that cutting it imposes a "realistic" standard of tension on a form that requires a "musical" standard of resolution. The truth of the opera is not just in Giovanni's death, but in the community's survival.

  ### 3. Application to Prose Fiction (Close Third-Person)
  You mentioned suspecting an analogous question applies to prose conventions, specifically close third-person narration. Williams's framework is incredibly useful here.

  **The Convention:**
  In "strict" realism (or cinema), we only see external behavior. In close third-person, the narrator knows what the character feels, thinks, and perceives, often with more coherence than a real human mind possesses.

  **The "Absurdity":**
  A critic of the form might say: "People don't narrate their lives in polished prose. This is an artificial distortion."

  **The Williamsian Defense:**
  Just as the aria allows for emotional summation, close third-person allows for **consciousness without secrecy**.
  *   **Doing the Work:** If you treat close third-person as a "window" that should try to be invisible, you are chasing realism. If you treat it as an **operatic convention**, you use it to do work that film cannot. You can juxtapose a character's thought against their dialogue (irony). You can expand a moment of decision (like an aria) to show the weight of the choice.
  *   **The "Sextet" of Prose:** Consider the ending of your novel. Do you need a "moralizing sextet"? Perhaps not literally, but do you need a moment where the narrative voice pulls back from the protagonist's immediate consciousness to show how they fit into the wider world?
      *   Many modern novels end "realistically"—with an ambiguous cut, or staying strictly inside the protagonist's head.
      *   A more "operatic" ending might step back to show the consequences of the protagonist's actions on the community, even if it feels less "cinematic."

  ### 4. Advice for Your Opera Scene
  Since you are writing a scene *set* at the opera, Williams's insights can help you describe not just what the characters see, but what they experience.

  1.  **Don't describe the absurdity:** Avoid having your characters think, "How silly that she is singing while stabbed." Instead, describe the **expansion of time**. Describe how the music makes the pain intelligible.
  2.  **The Ensemble as Polyphony:** If your characters are watching an ensemble, describe how they perceive the conflicting emotions. Do they hear the harmony or the dissonance? This can mirror their own relationships.
  3.  **The Sextet Moment:** Consider if your novel needs a moment of "restoration" after a climax. If your protagonist undergoes a major transformation (a "damnation" or "redemption"), do you leave them in that isolated moment, or do you show the world continuing around them? Williams suggests the latter is the more profound "operatic" truth, even if it feels less dramatic.

  **Summary:**
  Williams teaches us that conventions are not lies; they are **agreements about what kind of truth is being told**. Realism tells the truth of cause and effect. Opera tells the truth of value and feeling. As a novelist, you are free to choose which truth you are serving. If you use close third-person, do not apologize for its artificiality; use it to sing the aria that a camera could never capture.
