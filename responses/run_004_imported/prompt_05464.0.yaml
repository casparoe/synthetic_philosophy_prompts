answer: |-
  You are right, and your friend is mistaken. While his frustration is understandable and his intentions are good, he is chasing a mathematical impossibility.

  Your "vague hunch" is actually a precise description of one of the most famous results in social choice theory: the **Gibbard-Satterthwaite Theorem**.

  Here is the rigorous verdict, the explanation of why your friend's proposed fix (Instant-Runoff Voting) won't work, and some practical advice on how to actually handle next year's trip.

  ### 1. The Verdict: The Gibbard-Satterthwaite Theorem
  In the early 1970s, philosopher Allan Gibbard and economist Mark Satterthwaite independently proved a theorem that directly addresses your situation.

  The theorem states that for any voting system where:
  1.  There are **three or more** possible outcomes (you had four: beach, mountain, city, lake).
  2.  Voters are allowed to have **any preference order** (unrestricted domain).
  3.  The outcome is determined by a **single winner** (not a tie or a randomized mix).

  **...the only voting methods that are completely immune to strategic voting are:**
  *   **Dictatorships:** One specific person's top choice always wins, regardless of what anyone else votes.
  *   **Restrictive Methods:** The system limits the possible outcomes to only two options (effectively removing the "three or more" condition).

  Since your group explicitly wants to avoid a dictatorship and you clearly have more than two destination options, **no voting rule exists that is fully immune to tactical misreporting.** Your skepticism was mathematically sound.

  ### 2. Why Instant-Runoff Voting (IRV) Won't Save You
  Your friend is lobbying for Instant-Runoff Voting (also known as Ranked Choice Voting). While IRV has advantages over your points system (Borda Count) in certain scenarios, it is **not strategy-proof.**

  In IRV, candidates are eliminated round-by-round based on who has the fewest first-choice votes. This creates specific opportunities for manipulation that are different from, but just as potent as, the ones in the points system.

  **Common IRV Strategies:**
  *   **"Burial":** If you strongly dislike Candidate A, but know they are popular, you might rank them last (even if they aren't your true last choice) to ensure they are eliminated early, rather than letting them survive to the final round.
  *   **"Compromising":** Similar to what happened in your group, a voter might rank a less-preferred but more viable candidate higher than their true favorite to prevent their *least* favorite from winning.

  There are documented real-world examples of IRV elections where voters successfully gamed the system. So, switching to IRV would change *how* your friend lies next year, but it would not stop him from lying.

  ### 3. Why Is This Unavoidable?
  The intuition behind the impossibility is that when preferences are complex (multidimensional), there is no "neutral" way to aggregate them without creating leverage for manipulation.

  In your points system, the leverage came from the *weight* of the points (burying a rival by giving them 1 point instead of 2). In IRV, the leverage comes from the *order of elimination*. In a simple Plurality system ("vote for one"), the leverage comes from *vote splitting* (the "wasted vote" syndrome).

  Every system creates a different "map" of incentives. As long as the outcome depends on the input of multiple people with different desires, there will be gaps between "what I want" and "what happens if I tell the truth." A strategic voter exploits that gap. To close the gap completely, you must give one person total control (dictatorship) or remove the complexity (only two options).

  ### 4. Is There a "Single-Peaked" Loophole?
  There is one major exception to the Gibbard-Satterthwaite theorem: **Single-Peaked Preferences.**

  If all options can be arranged on a single straight line (e.g., "How much money do we spend?" from \$100 to \$1000), and everyone prefers options closer to their ideal point, then the **Median Voter Theorem** applies. In that specific case, honest voting is the best strategy.

  However, vacation destinations are rarely single-peaked. A person who loves the "Big City" might hate the "Mountain Cabin" just as much as the "Beach." There is no linear spectrum where Beach → Mountain → City → Lake makes sense for everyone. Because your preferences are multidimensional, the loophole does not apply.

  ### 5. Practical Solutions for Your Group
  Since a perfect voting system does not exist, you should stop looking for a mechanical fix and look for a procedural one. Here are four strategies that work better than changing the voting algorithm:

  **A. Rotating Dictatorship (The Fair Fix)**
  The theorem says a *fixed* dictator is the only strategy-proof method. It does not forbid a *rotating* dictator.
  *   **Method:** Every year, one person gets full decision-making power.
  *   **Why it works:** It removes the incentive to strategize because there is no vote to game. Over nine years, it averages out to fairness. Since you have eight people, everyone gets a turn, and one person gets a second turn.

  **B. Randomized Selection (The Strategy-Proof Fix)**
  *   **Method:** Everyone votes honestly. You tally the top two or three destinations. You then roll a die or draw names to pick the winner from that shortlist.
  *   **Why it works:** If there is a chance element, the expected utility of voting honestly is often higher than gaming the system, because gaming the system risks eliminating your favorite entirely. It acknowledges that no method is perfect and introduces fairness through chance.

  **C. Consensus over Voting (The Social Fix)**
  *   **Method:** Use the vote only as a "straw poll" to gauge interest, but require a consensus discussion to finalize.
  *   **Why it works:** Voting is adversarial; discussion is collaborative. If the person who wanted the Beach hears that the Mountain cabin makes the person with bad knees happy, they might voluntarily concede. This relies on social pressure and friendship rather than mathematical rules. *Warning: This can be time-consuming and favors the most vocal members.*

  **D. Separate the Dimensions (The Reduction Fix)**
  *   **Method:** Don't vote on the "Destination." Vote on attributes.
  *   **Why it works:** Break the trip down. Vote on "Relaxation vs. Activity," then "Hot vs. Cold," then "Urban vs. Nature." This attempts to force preferences into a more single-peaked structure, reducing the complexity that allows strategy to flourish.

  ### Summary
  You can tell your friend that his search for a perfectly strategy-proof, non-dictatorial voting system with three or more options is not just difficult—it is **provably impossible** according to the Gibbard-Satterthwaite Theorem.

  Your hunch was correct: the flaw is not in the points system; it is in the nature of collective decision-making itself. The most mature solution for a group of friends who have traveled together for nine years is likely **Rotating Dictatorship**. It accepts the impossibility of perfect fairness in a single instance in exchange for perfect fairness over time.
