answer: |-
  This is a fantastic question because it cuts right to the center of one of the biggest debates in neuroscience and philosophy. You aren't just asking about driving; you're asking about the nature of awareness itself.

  To give you the direct answer you want: **There is currently no scientific "fact of the matter" that can give you a simple Yes or No.**

  This isn't because science is lazy, but because "consciousness" isn't a single switch in your brain that is either On or Off. It is a collection of different processes that can be uncoupled. Your friends are arguing past each other because they are using different definitions of the word "conscious."

  Here is the breakdown of why this is so hard to resolve, what likely happened in your brain, and why the question itself might be the problem.

  ### 1. The Phenomenon: Highway Hypnosis
  First, what you experienced has a name: **Highway Hypnosis** (or sometimes "driving without attention"). It is well-documented. It happens when a task becomes highly automated.

  When you first learned to drive, every action (checking mirrors, pressing the brake, steering) required **controlled processing**. This uses a lot of working memory and feels effortful. You were definitely conscious then.

  After enough repetition, those actions shift to **automatic processing**. Your basal ganglia (the habit center) take over from your prefrontal cortex (the decision center). You can perform the task without "top-down" attention.

  ### 2. Why Your Friends Are All Partially Right
  To understand why there's no Yes/No answer, look at the three layers of consciousness your friends are accidentally debating:

  **Friend 1 (The Sleepwalker): "You weren't conscious."**
  *   **What they mean:** They are talking about **Episodic Memory and Meta-Awareness.**
  *   **The Science:** They are right that you lacked *self-monitoring*. You weren't thinking, "I am driving a car." You were on autopilot. In psychology, this is a lack of *meta-cognition*.
  *   **Why they're wrong:** Sleepwalkers operate in a state of dissociated arousal. Their motor cortex is active, but their higher reasoning is mostly offline. You, however, successfully navigated traffic. If a car had swerved, you likely would have reacted. A sleepwalker might not. You had *perceptual* awareness, even if you didn't have *self* awareness.

  **Friend 2 (The Skeptic): "You must have been conscious to drive."**
  *   **What they mean:** They are talking about **Perceptual Consciousness.**
  *   **The Science:** They are right that your brain was processing data. Your eyes saw the lane markers, your visual cortex processed the motion, and your motor cortex adjusted the steering wheel. Information was definitely entering your brain and being used.
  *   **Why they're wrong:** Information processing does not equal "conscious experience." Your brain regulates your heartbeat and digestion without you being conscious of it. Friend 2 assumes that because the brain *used* the info, *you* (the subjective self) must have been "there" watching it. That's an assumption, not a fact.

  **Friend 3 (The Philosopher): "The question doesn't make sense."**
  *   **What they mean:** They are touching on the **Definition Problem.**
  *   **The Science:** This is actually the strongest position. If you define consciousness as "encoding memory," you weren't conscious. If you define it as "reacting to stimuli," you were. If you define it as "feeling like a self," you weren't.
  *   **Why it matters:** Until we agree on what consciousness *is*, we can't measure if you *had* it.

  ### 3. The Memory Gap vs. The Experience
  This is the crux of your confusion: *Does the lack of memory prove the lack of experience?*

  **No.**
  Memory encoding is a separate process from perception.
  *   **Scenario A:** You can experience something vividly but fail to encode it (e.g., you walk into a room and forget why, or you drive while daydreaming).
  *   **Scenario B:** You can encode data without conscious experience (e.g., "blindsight," where blind patients can guess the location of objects despite claiming they see nothing).

  In your case, your brain likely deemed the last 10 minutes "irrelevant data." Because the drive was boring and routine, your hippocampus (the memory indexer) didn't bother saving the file. The fact that the file wasn't saved doesn't prove the camera wasn't recording *in the moment*, but it makes it impossible for you to verify it now.

  ### 4. Is there a "Fact of the Matter"?
  Here is the hard truth: **We cannot measure subjective experience directly.**

  Neuroscience can measure brain waves (EEG), blood flow (fMRI), and reaction times. We know that during highway hypnosis, your brain activity shifts. There is less activity in the areas associated with self-referential thought and more in the areas associated with habit.

  But science cannot answer: *"Did it feel like something to be you during those 10 minutes?"*
  *   If you asked yourself *during* minute 5, "Am I driving?" you would have snapped out of it. This suggests the *potential* for awareness was there, but the *active* awareness was dormant.
  *   Philosophers call this the difference between **Access Consciousness** (information available for use) and **Phenomenal Consciousness** (the raw feeling of experience). You definitely had Access Consciousness (you could steer). We don't know if you had Phenomenal Consciousness (the "feeling" of seeing the road).

  ### The Verdict
  You were likely in a state of **dissociated automaticity.**

  *   **Were you conscious of the road?** Yes, in the sense that your visual system was processing data and guiding your hands.
  *   **Were you conscious of yourself?** No. The "narrator" in your head that says "I am doing this" went on a break.
  *   **Does a fact of the matter exist?** Not really. Because "consciousness" is a label we apply to a bundle of brain functions, and in your case, some of those functions were on (vision, motor control) and some were off (memory encoding, self-monitoring).

  **A Safety Note:** While this is a normal psychological phenomenon, as a new driver, you want to be careful. Highway hypnosis works on familiar, boring roads. If something unpredictable happens (a deer jumps out, a tire blows), the time it takes to switch from "automatic" back to "controlled" processing is called the **reorientation lag**. In those split seconds, you are vulnerable. Your mom didn't notice, but don't make a habit of letting the "narrator" go to sleep while you're behind the wheel.

  **Summary:** Your third friend is the closest to the truth. The question "Was I conscious?" is too blunt an instrument for a complex brain state. You weren't unconscious like a sleeper, but you weren't fully "present" like a pilot. You were a biological autopilot system that was functioning perfectly, just without a passenger in the cockpit.
