answer: |-
  This is a classic and deeply technical corner of the philosophy of time and logic. Your skepticism is well-founded: many philosophers argue that these formalisms are often just "notational variants" of the same underlying metaphysical commitment, or that they solve a logical problem while creating a semantic one.

  To address your specific points, we need to work within the standard **branching-time framework** (originating with A.N. Prior). Let $m_0$ be the present moment. Let there be two possible histories passing through $m_0$: $h_1$ (where a sea battle occurs tomorrow at $m_1$) and $h_2$ (where no sea battle occurs).

  Let $\phi$ be the proposition "A sea battle occurs at $m_1$."
  Let $F\phi$ be the sentence "There will be a sea battle tomorrow."

  Here is the precise breakdown of the positions, their verdicts, and the specific objections you raised.

  ### 1. Peirceanism vs. Ockhamism

  The fundamental disagreement here is about the **parameters of truth**.

  **The Peircean Reading**
  *   **Semantics:** Truth is evaluated relative to a **moment** only ($m$).
  *   **The Operator:** For a Peircean, the future tense operator $F$ is a **necessity** operator. $F\phi$ is true at $m_0$ if and only if $\phi$ is true at the corresponding future moment on **all** histories passing through $m_0$.
  *   **Verdict on $F\phi$:** Since $\phi$ is true on $h_1$ but false on $h_2$, $F\phi$ is **false** at $m_0$.
  *   **The Cost:** This preserves the openness of the future (nothing is "true" yet), but it violates classical logic (the Law of Excluded Middle fails for future contingents: neither $F\phi$ nor $\neg F\phi$ is true). Furthermore, it clashes with intuition: if I say "It will rain," and it does rain, the Peircean must say my statement was *false* when I made it (because it wasn't settled).

  **The Ockhamist Reading**
  *   **Semantics:** Truth is evaluated relative to a **moment/history pair** ($m, h$).
  *   **The Operator:** $F\phi$ is true at $(m_0, h)$ if and only if $\phi$ is true at the future moment on **that specific history** $h$.
  *   **Verdict on $F\phi$:** $F\phi$ is **true** at $(m_0, h_1)$ and **false** at $(m_0, h_2)$.
  *   **The Cost:** This preserves classical logic within a history, but it loses "truth simpliciter." We do not speak from the perspective of a specific history; we speak from the present moment. If truth is always relative to a history, then at $m_0$, $F\phi$ has no unique truth value. It is "true relative to $h_1$" but "false relative to $h_2$."

  **Summary of Difference:** The Peircean says $F\phi$ is simply **false** (because it's not settled). The Ockhamist says $F\phi$ is **history-relative** (true on some branches, false on others).

  ### 2. Why Supervaluationism?

  Supervaluationism was introduced (by Thomason and others) to rescue **classical logic** without adopting the Ockhamist's history-relative truth or the Peircean's rejection of excluded middle.

  *   **The Mechanism:** It defines "Truth" (simpliciter) at a moment as **Supertruth**. A sentence is supertrue at $m_0$ if it is true at $(m_0, h)$ for **all** histories $h$ passing through $m_0$. It is superfalse if false on all histories. If it is true on some and false on others, it has **no truth value** (a truth-value gap).
  *   **The Improvement:**
      1.  **Logic:** It validates classical tautologies. $F\phi \lor \neg F\phi$ is supertrue (because on every history, either $F\phi$ is true or it isn't), even though neither disjunct is supertrue.
      2.  **Openness:** It preserves indeterminism. $F\phi$ is neither true nor false at $m_0$, so the future is not fixed.
  *   **The Relocation:** As you suspected, this relocates the problem. It saves logic by sacrificing the principle that every meaningful assertion must be true or false (bivalence).

  ### 3. The Failure of the "Thin Red Line" (TRL)

  The Thin Red Line theory attempts to restore bivalence and "truth simpliciter" to Ockhamism by postulating that among all possible histories passing through $m_0$, one is metaphysically privileged as **The Actual Future** ($h^*$).

  *   **The Move:** Truth at $m_0$ is defined as truth at $(m_0, h^*)$.
  *   **The Verdict:** $F\phi$ is simply True or False at $m_0$, depending on whether the battle is on the Red Line.
  *   **Why It Fails:**
      1.  **Metaphysical Arbitrariness:** If the world is genuinely indeterministic, what makes $h^*$ the "actual" future *now*? There is no causal fact at $m_0$ that distinguishes $h^*$ from $h_2$. Privileging one branch renders the "openness" of the other branches illusory.
      2.  **The Assertion Problem (Moore's Paradox):** Consider the sentence: *"There will be a sea battle, but it is not settled that there will be."*
          *   Intuitively, this is a coherent thing to say in an indeterministic world.
          *   On TRL, "There will be a sea battle" means "It is on the Red Line." "It is not settled" means "There are other histories."
          *   However, TRL semantics typically forces the truth conditions such that if "There will be..." is true, it implies settlement (depending on the specific formalization), or it creates a disconnect between what is *true* and what is *assertible*. More damningly, if $h^*$ is the actual future, then the other histories are merely "possible" in a weak sense. It collapses the distinction between "what will happen" and "what is determined to happen," which was the very distinction Aristotle wanted to protect.

  ### 4. The Retrospective Vindication Objection

  This is the strongest argument against Supervaluationism (and standard Ockhamism).

  **The Scenario:**
  1.  **Yesterday ($m_0$):** I assert $F\phi$ ("There will be a sea battle").
  2.  **Today ($m_1$):** A sea battle occurs.
  3.  **Intuition:** I was **right**. My prediction was **correct**. I am vindicated.

  **The Supervaluationist Problem:**
  According to supervaluationism, at $m_0$, $F\phi$ had **no truth value** (it was neither supertrue nor superfalse).
  *   If I asserted something without a truth value, did I violate the norm of assertion (Assert only what is true)?
  *   If the statement was *not true* at $m_0$, in what sense can I claim today that I "spoke the truth"?
  *   Supervaluationists often try to say, "It is true *now* that it was true *then*." But strictly speaking, their semantics say it was *indeterminate* then. To say "It is true now that it was true then" is to contradict their own semantic verdict about $m_0$. They struggle to explain the normative shift from "indeterminate assertion" to "vindicated predictor" without smuggling in a TRL or changing the semantics retroactively.

  ### 5. MacFarlane's Relativism (Assessment-Sensitivity)

  John MacFarlane proposes **Relativism** specifically to solve the retrospective vindication problem without collapsing into fatalism (TRL) or losing truth-values (Supervaluationism).

  **The Mechanism:**
  MacFarlane argues that truth is relative not just to a context of use (utterance), but also to a **context of assessment**.
  *   **Truth Predicate:** $True(\phi, C_u, C_a)$, where $C_u$ is the Context of Utterance and $C_a$ is the Context of Assessment.
  *   **The History Parameter:** The history parameter needed to evaluate $F\phi$ is not supplied by the utterance context (as in Ockhamism), but by the **assessment** context.

  **The Verdict on the Sea Battle:**
  1.  **At $m_0$ (Utterance):** I assert $F\phi$.
  2.  **Assessment at $m_0$:** The assessor (me, right now) looks at the histories available at $m_0$. Since $\phi$ happens on $h_1$ but not $h_2$, the truth value of $F\phi$ is **indeterminate**. I cannot correctly claim "It is true" right now.
  3.  **Assessment at $m_1$ (After the battle):** The assessor (me, tomorrow) looks back at the utterance at $m_0$. However, the assessor is now located at a moment where the history is **settled**. The context of assessment $C_a$ includes the actual history $h_1$ (since the battle happened).
  4.  **Retro-evaluation:** When evaluating the utterance from $m_0$ using the history from $m_1$, $F\phi$ comes out **True**.

  **Why This Solves Vindication:**
  *   It respects openness: At the time of speaking, the statement was not true (so no fatalism).
  *   It respects vindication: At the time of assessment (after the fact), the statement *is* true.
  *   It explains the norm: I am vindicated because, from the perspective of the current context, my past assertion tracks the truth. MacFarlane calls this **"truth relative to a context of assessment."**

  **Your Skepticism Check:**
  You mentioned worrying that these theories just "relocate the problem." MacFarlane would agree, but argue it is a *productive* relocation. He moves the locus of bivalence from the **metaphysics of the future** (is the future fixed?) to the **semantics of assessment** (can we evaluate past claims from a settled future?).
  *   **Critique:** Critics argue this makes truth too unstable. If truth depends on *when* you ask, is it still truth?
  *   **Defense:** MacFarlane argues this matches our actual practices. We treat future contingents as "up in the air" now, but we treat predictions as "right or wrong" later. Standard semantics forces us to choose one perspective; Relativism allows us to have both by indexing truth to the assessment time.

  ### Summary Table

  | Theory | Truth Parameters | Verdict on $F\phi$ (at $m_0$) | Retrospective Vindication | Main Weakness |
  | :--- | :--- | :--- | :--- | :--- |
  | **Peircean** | Moment | False (not settled) | Impossible (statement was false) | Makes all future contingents false. |
  | **Ockhamist** | Moment + History | True on $h_1$, False on $h_2$ | Problematic (no truth *simpliciter*) | No unique truth value at utterance. |
  | **Supervaluation** | Moment (quantified over histories) | Indeterminate (Gap) | **Fails** (Cannot explain how a gap becomes "right") | Breaks link between truth and vindication. |
  | **Thin Red Line** | Moment + Privileged History | True or False | Works | Metaphysically dubious (fatalistic). |
  | **Relativist** | Utterance Context + Assessment Context | Indeterminate at $m_0$; **True at $m_1$** | **Succeeds** (Truth is assessment-sensitive) | Truth becomes unstable/relative. |

  In short, your friend is right that branching time helps, but you are right that standard branching time (Ockhamist/Peircean/Supervaluationist) struggles to account for the *normative* fact that predictors are vindicated. MacFarlane's move is to make truth itself dynamic, allowing a statement to lack a truth value at $t_0$ but possess one at $t_1$, thereby dissolving the tension between openness and vindication without positing a metaphysically magical "Thin Red Line."
