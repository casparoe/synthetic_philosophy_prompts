          2.  Why Supervaluationism was introduced as an improvement.
          3.  Why the "Thin Red Line" (TRL) move is usually thought to fail.
          4.  The objection regarding retrospective vindication (was the predictor *right*?) against Supervaluationism.
          5.  How Relativism (MacFarlane) solves the retrospective vindication problem.
      *   **Tone/Level:** Precise, philosophical, technical but accessible (the user clearly knows the landscape but wants clarity on the specific mechanics and objections).

  2.  **Deconstruct the Philosophical Landscape:**

      *   **The Setup:** Time is branching (to preserve openness). Let $t_0$ be now. Tomorrow ($t_1$) has multiple possible histories ($h_1, h_2, ...$). In $h_1$, sea battle ($SB$). In $h_2$, no $SB$.
      *   **Sentence:** $F(SB)$ ("It will be the case that a sea battle occurs").

      *   **Peirceanism:**
          *   Truth is relative to a *moment* only (not a history).
          *   $F(\phi)$ is true at $m$ iff $\phi$ is true at all future moments on all histories passing through $m$.
          *   Verdict on $F(SB)$: False (because it's not settled). $\neg F(SB)$ is also true (or $F(\neg SB)$ is false, depending on exact formulation, but usually $F(SB)$ is simply false).
          *   Problem: Makes future contingents false, which feels like denying the possibility of them happening. Also, logic issues (excluded middle fails for future contingents).

      *   **Ockhamism:**
          *   Truth is relative to a *moment/history pair* ($m, h$).
          *   $F(\phi)$ is true at $(m, h)$ iff $\phi$ is true at the future moment on *that specific history* $h$.
          *   Verdict on $F(SB)$: True at $(t_0, h_1)$, False at $(t_0, h_2)$.
          *   Problem: We don't speak from the perspective of a specific history. We speak from "now." So what is the truth value *simpliciter* at $t_0$? It lacks a unique value.

      *   **Supervaluationism:**
          *   Attempt to save bivalence without TRL.
          *   A sentence is "supertrue" at $m$ if it is true at $(m, h)$ for *all* histories $h$ through $m$.
          *   Verdict on $F(SB)$: Neither supertrue nor superfalsely. It's indeterminate.
          *   Improvement: Preserves classical logic (validity) while allowing truth-value gaps for contingents.
          *   Problem: Retrospective vindication. If I say $F(SB)$ today, and tomorrow $SB$ happens, was I right? Supervaluationism says my assertion was neither true nor false *then*. How can I be vindicated now?

      *   **Thin Red Line (TRL):**
          *   Pick one history $h^*$ as "The Actual Future."
          *   Truth at $m$ is truth at $(m, h^*)$.
          *   Verdict: $F(SB)$ is simply True or False.
          *   Failure: Metaphysically dubious (privileges one branch without causal basis). Makes the openness illusory. "Moore's Paradox" type issues (It will rain, but it might not).

      *   **Relativism (MacFarlane):**
          *   Truth is relative to a *Context of Utterance* AND a *Context of Assessment*.
          *   Utterance: $t_0$. Assessment: $t_0$ or $t_1$.
          *   At $t_0$: $F(SB)$ is indeterminate (no unique history).
          *   At $t_1$ (after battle): We assess the utterance from $t_0$ using the history actualized at $t_1$.
          *   Verdict: The assertion was not true *when made*, but it is true *as assessed later*. This captures "being right."

