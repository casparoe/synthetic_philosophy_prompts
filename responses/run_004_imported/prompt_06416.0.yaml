      *   *Supervaluationism:*
          *   Why? To get classical logic back without TRL.
          *   Mechanism: Quantify over histories. True if true on all. False if false on all. Gap otherwise.
          *   Benefit: $F\phi \lor \neg F\phi$ is valid (supertrue), even if neither disjunct is.
      *   *Thin Red Line:*
          *   Why it fails: Metaphysical arbitrariness. If the future is open, why is *this* branch red? Also, semantic oddities (asserting "It will happen but it might not" becomes contradictory, but intuitively it's coherent).
      *   *Retrospective Vindication (The Crux):*
          *   Scenario: I predict battle. Battle happens.
          *   Supervaluationist problem: At time of utterance, prediction had no truth value. So in what sense was I *correct*? Saying "I was right" implies my statement was true. But it wasn't (super)true.
          *   MacFarlane's Relativism: Truth is assessment-sensitive.
          *   Mechanism: The "world of utterance" vs. "world of assessment."
          *   Result: At $t_0$, not true. At $t_1$ (given battle), the assertion *from $t_0$* is evaluated as True. This validates the intuition of vindication without committing to fatalism at $t_0$.

  4.  **Refining the Technical Details:**
      *   *Peircean:* $M, h \models F\phi$ iff for all $h'$ through $M$, there is a future moment in $h'$ where $\phi$. (Actually, standard Peircean is truth at a moment, so $M \models F\phi$ iff for all $h$ through $M$...). Let's stick to the standard Priorian distinction. Peircean: $F\phi$ is true at $m$ iff $\phi$ is settled true. Ockhamist: $F\phi$ is true at $m/h$ iff $\phi$ is true at the future moment on $h$.
      *   *Supervaluation:* "Supertrue" = true on all histories. "Superfalse" = false on all.
      *   *MacFarlane:* Use the terms "Context of Utterance" ($C_u$) and "Context of Assessment" ($C_a$). Truth is $C_u, C_a$ relative.

