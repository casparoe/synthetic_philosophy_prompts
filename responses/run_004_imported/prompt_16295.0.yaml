prompt: |-
  I cover evolutionary biology, and next week I'm profiling a theoretical biologist who has built her career rehabilitating group selection as a genuine causal force behind traits like eusociality and large-scale human cooperation, working in the tradition of multilevel selection theory. In public debate she reliably closes down the standard 'it's just bookkeeping' objection -- the charge that any multilevel-selection model can be losslessly rewritten as an inclusive-fitness (kin-selection) model once you run the numbers through the Price equation -- with the line 'that's a translation, not a refutation.' Please draft eight to ten interview questions that make that line progressively harder to lean on: I want at least one question pressing her on what would distinguish a genuinely selected group from an arbitrary statistical aggregate of individuals, at least one asking what empirical finding could in principle favor a multilevel-selection description over an inclusive-fitness one rather than a mere relabeling of the same variance, and a final question asking whether she would concede that the units-of-selection debate is, at bottom, not an empirical dispute at all but a disagreement over which partition of the same process is most illuminating. For each question, add a short follow-up keyed to the dodge she is most likely to reach for.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Topic:** Evolutionary biology, specifically the debate between Group Selection (Multilevel Selection Theory - MLS) and Kin Selection (Inclusive Fitness Theory - IFT).
      *   **Subject:** A theoretical biologist who champions MLS (rehabilitating group selection) and uses the "translation, not refutation" defense against the "bookkeeping" objection (Price Equation equivalence).
      *   **Goal:** Draft 8-10 interview questions that make her standard defense ("that's a translation, not a refutation") progressively harder to rely on.
      *   **Specific Requirements:**
          *   At least one question on distinguishing a *genuinely selected group* from an *arbitrary statistical aggregate*.
          *   At least one question on what *empirical finding* could favor MLS over IFT (beyond relabeling).
          *   A final question asking if the debate is just about *heuristic utility* (partitioning) rather than empirical reality.
          *   Each question needs a short follow-up keyed to her likely dodge.
      *   **Tone:** Professional, probing, knowledgeable (suitable for a profile in a serious publication), but challenging.

  2.  **Deconstruct the Scientific Context:**
      *   *The Core Conflict:* MLS (Williams, Wynne-Edwards, later Wilson, Sober, Nowak) vs. IFT (Hamilton, Dawkins, Grafen).
      *   *The Mathematical Equivalence:* The Price Equation shows that $\Delta z = Cov(w, z)$. This can be partitioned into within-group and between-group components (MLS) or into direct and indirect fitness effects (IFT). Mathematically, they are often equivalent descriptions of the same change in gene frequency.
      *   *The "Bookkeeping" Objection:* Critics (like Grafen, West, Gardner) argue MLS is just a different way of doing the math of IFT, adding no causal insight.
      *   *The Subject's Defense:* "Translation, not refutation." Meaning: Yes, the math translates, but the *causal story* matters. MLS offers a better causal narrative for certain phenomena (eusociality, human cooperation).
      *   *The Interviewer's Strategy:* Push past the "causal narrative" defense. If the math is equivalent, what makes one causally *real* and the other not? If it's just about utility, admit it. If it's about reality, show me the difference.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1: Setting the stage.* Start with the "translation" line. Ask what work it does.
      *   *Q2: Causal Mechanism.* If they are mathematically equivalent, where does the causality live?
      *   *Q3: The "Arbitrary Aggregate" requirement.* This is a specific prompt requirement. Need to ask how we define a "group" biologically vs. statistically.
      *   *Q4: Empirical Discrimination.* This is a specific prompt requirement. What data would rule one out?
      *   *Q5: Prediction.* Does MLS predict things IFT doesn't?
      *   *Q6: The Gene's Eye View.* Challenge the MLS view against the dominant gene-centric view.
      *   *Q7: Human Cooperation.* Specific application mentioned in the prompt.
      *   *Q8: History/Retraction.* Mention Nowak et al. (2010) controversy? Maybe too specific. Let's stick to the theoretical core. Let's focus on the "Unit of Selection" concept.
      *   *Q9: Modeling assumptions.* When do you *need* MLS math vs IFT math?
      *   *Q10: The "Heuristic" Concession.* This is the specific final prompt requirement. Is it just philosophy?

      *Refining for the "Progressively Harder" constraint:*
      I need to arrange these so she can't just repeat "translation" forever. I need to corner her into admitting either there *is* an empirical difference (which is hard to prove given Price Equation equivalence) or it *is* just heuristic (which undermines the "genuine causal force" claim).

      *Drafting Q1 (The Opening Salvo):* You say "translation not refutation." But if the math is identical, why is the causal story different?
      *Follow-up:* If she says "causality is about narrative," ask why the gene narrative is insufficient.

      *Drafting Q2 (The Aggregate Problem - Requirement 1):* How do we know a group isn't just a statistical artifact?
      *Follow-up:* If she says "interaction," ask if IFT captures interaction via relatedness.

      *Drafting Q3 (Empirical Difference - Requirement 2):* What observation favors MLS *ontologically*?
      *Follow-up:* If she says "trait evolution," ask if IFT predicts the same trajectory.

      *Drafting Q4 (Prediction):* Does MLS generate unique predictions?
      *Follow-up:* If she says "yes," ask for a specific example where IFT failed.

      *Drafting Q5 (The Price Equation):* Directly address the Price Equation partition.
      *Follow-up:* If she says "Price is abstract," ask why MLS isn't equally abstract.

      *Drafting Q6 (Parsimony):* Is MLS adding entities?
      *Follow-up:* If she says "no," ask why it feels like adding a layer of selection.

      *Drafting Q7 (Eusociality):* Focus on her specific expertise.
      *Follow-up:* If she cites Hamilton's rule failure, ask if modified Hamilton's rule fixes it.

      *Drafting Q8 (Causal Forces):* You call group selection a "force." Is it a vector?
      *Follow-up:* If she says "metaphorically," ask when metaphor becomes misleading.

      *Drafting Q9 (The "Realism" Trap):* Are groups real entities or temporary clusters?
      *Follow-up:* If she says "real," ask about the boundary conditions.

      *Drafting Q10 (The Final Concession - Requirement 3):* Is this just about which partition is illuminating?
      *Follow-up:* If she says "no," ask what is left besides illumination.

      *Review against constraints:*
      *   8-10 questions? Yes.
      *   Progressive difficulty? Yes, starts with theory, moves to empirics, ends on philosophy of science.
      *   Specific requirements met? Yes (Aggregate, Empirical Finding, Heuristic/Partition).
      *   Follow-ups included? Yes.

      *Polishing the Tone:* Ensure the questions sound like they come from a knowledgeable journalist, not a hostile debater, but one who sees the logical trap. The goal is to expose the tension between "causal force" and "mathematical equivalence."

      *Self-Correction on Q3 (Empirical):* This is the hardest part scientifically. Most theorists agree the *predictions* are identical. The question needs to force her to admit if there is *any* scenario where the *description* changes the *outcome* of the science, or if it's purely interpretive. I need to make sure the follow-up catches the "different models" dodge.

      *Self-Correction on Q10 (Final):* Make sure this lands the plane. If she says "it's not just partitioning," she needs to say what else it is. If she says "it is," she concedes the "bookkeeping" point essentially.

      *Refining the "Follow-ups":* The prompt asks for the follow-up to be keyed to the dodge she is *most likely* to reach for. I need to anticipate her standard MLS defenses (e.g., "IFT assumes weak selection," "MLS handles non-additive interactions better," "Causality is not math").

      *Let's finalize the list.*

      1.  Opening on "Translation."
      2.  Causal Mechanism vs. Math.
      3.  **Requirement:** Genuine Group vs. Aggregate.
      4.  **Requirement:** Empirical Finding/Ontology.
      5.  Predictive Power.
      6.  Hamilton's Rule limitations.
      7.  Parsimony/Ockham's Razor.
      8.  The definition of "Force."
      9.  Modeling utility vs. Reality.
      10. **Requirement:** Heuristic/Partition concession.

      *Wait, I need to ensure the flow is logical.*
      Start with the slogan. Move to the math. Move to the biology (groups). Move to the data. Move to the philosophy.
      Let's combine some to ensure high quality.

      *Revised Plan:*
      1.  The "Translation" slogan meaning.
      2.  Causal reality vs. Mathematical description.
      3.  **Req 1:** Group definition (Aggregate vs. Entity).
      4.  **Req 2:** Empirical discrimination (What data decides?).
      5.  Predictive divergence (Does MLS predict something IFT doesn't?).
      6.  The "Force" metaphor (Physics analogy).
      7.  Eusociality specifics (Where did IFT fail?).
      8.  Parsimony (Why add levels?).
      9.  Modeling assumptions (When is MLS *necessary*?).
      10. **Req 3:** Heuristic/Partition conclusion.

      *Wait, check the prompt again:* "make that line progressively harder to lean on."
      Okay, so the early questions can be softer, letting her use the line. The later questions must make the line sound empty.

      *Let's write the questions.*

      (Self-Correction during drafting): Make sure the follow-ups are punchy and specific to the likely evasion.

      *Q1:* Focus on the slogan itself.
      *Q2:* Focus on "Causal Force."
      *Q3:* Focus on the Group definition (Req 1).
