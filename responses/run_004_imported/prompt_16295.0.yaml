      *Q10:* Focus on the Heuristic concession (Req 3).

      *Wait, I need to make sure I don't sound like I'm attacking her, but rather probing the logic.* The prompt says "profile," so it should be interview style.

      *Let's refine the "Empirical Finding" question.* This is crucial. If the math is equivalent, the empirical findings *must* be the same. The only way MLS is favored is if the *model* is easier to build or understand. I need to ask if there is a case where the *conclusion* changes.
      *Actually, the prompt asks:* "what empirical finding could in principle favor a multilevel-selection description over an inclusive-fitness one rather than a mere relabeling of the same variance."
      *This implies:* Is there data that makes MLS *true* and IFT *false*? The answer is generally no. So the question is designed to trap her into admitting they are empirically equivalent, which weakens the "genuine causal force" claim.

      *Let's refine the "Aggregate" question.* MLS proponents argue groups are real. Critics say they are statistical slices. I need to ask for the biological boundary.

      *Let's refine the "Final" question.* This needs to corner her on whether it's ontology or epistemology.

