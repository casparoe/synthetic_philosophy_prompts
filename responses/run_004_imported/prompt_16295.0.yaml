answer: |-
  1. **You often counter the mathematical equivalence argument with the phrase, "That's a translation, not a refutation." But in physics, if two formalisms yield identical predictions, we usually treat them as describing the same underlying reality. When you say group selection is a "genuine causal force," are you claiming it identifies a mechanism that inclusive fitness literally cannot see, or simply one that it describes less intuitively?**
     *   **Follow-up:** If she insists it's about *mechanism* rather than intuition: "If the mechanism is distinct, at what specific step in the reproductive cycle does the group-level cause operate independently of the individual-level genetic accounting?"

  2. **Let's press on that idea of causality. If the Price Equation allows us to partition variance into within-group and between-group components without changing the total evolutionary change, what prevents the 'between-group' term from being a statistical artifact of how we chose to slice the population?**
     *   **Follow-up:** If she argues the slicing reflects biological reality: "Then isn't the 'reality' you're defending actually the biological structure of the population (who interacts with whom), rather than the selection process itself, which inclusive fitness captures via relatedness coefficients?"

  3. **This leads to a definitional problem. What specific biological criterion distinguishes a 'group' that is a genuine unit of selection from an arbitrary statistical aggregate of individuals? Is there a threshold of interaction or boundary permeability where a cluster becomes a 'group' in your ontology?**
     *   **Follow-up:** If she cites *functional integration* or *reproductive bottlenecks*: "Kin selection models also incorporate those constraints through assortment parameters. If the biological conditions are identical, why does labeling it 'group selection' add causal explanatory power rather than just descriptive flavor?"

  4. **You argue that multilevel selection is necessary to explain eusociality and human cooperation. Can you point to a specific empirical finding or dataset that is consistent with a multilevel-selection model but *inconsistent* with an inclusive-fitness model, even a complex one?**
     *   **Follow-up:** If she cites cases where Hamilton's Rule is hard to calculate: "Does the difficulty of calculation imply the theory is wrong, or merely that the inclusive-fitness accounting is more cumbersome in high-dimensional interaction spaces?"

  5. **If the two frameworks are mathematically translatable, they must generate the same evolutionary trajectories. So, does multilevel selection theory offer any unique *predictions* about future states of a population that inclusive fitness theory would explicitly predict differently?**
     *   **Follow-up:** If she says the predictions are the same but the *explanations* differ: "If the predictions are identical, on what grounds do we judge one explanation to be 'true' and the other 'false,' rather than simply judging them by their utility to the modeler?"

  6. **Critics argue that treating group selection as a 'force' analogous to gravity or pressure is misleading because selection is a statistical outcome, not a physical push. When you use force-language, are you speaking metaphorically to aid teaching, or do you believe there is a literal vector of selection acting on the group?**
     *   **Follow-up:** If she claims it is a literal causal vector: "Since genes are the only replicators with fidelity across generations, what is the physical substrate that carries the 'group-level' inheritance independent of the individual vehicles?"

  7. **In your work on human cooperation, you suggest that cultural group selection operates alongside genetic selection. If the genetic component can be fully described by kin selection, does the 'group' part of cultural group selection rely on the same mathematical equivalence, or does culture break the Price Equation symmetry?**
     *   **Follow-up:** If she argues culture allows for different inheritance patterns: "Doesn't inclusive fitness theory accommodate non-genetic inheritance through the concept of 'cultural relatedness,' rendering the separation of genetic vs. cultural group selection another partition of the same variance?"

  8. **Ockham's Razor suggests we should not multiply entities beyond necessity. If inclusive fitness can account for the data using only individual-level parameters (costs, benefits, relatedness), what is the minimal phenomenon that *requires* us to posit a second, group-level unit of selection to avoid error?**
     *   **Follow-up:** If she argues that ignoring group structure leads to wrong conclusions: "Is that because the group structure is real, or simply because assuming panmixia (random interaction) is a bad modeling assumption that inclusive fitness theory also rejects?"

  9. **There is a concern that by rehabilitating group selection, you risk rehabilitating 'good of the species' fallacies among students. How do you rigorously prevent your framework from sliding into functionalism where the group's survival is treated as a goal rather than an outcome?**
     *   **Follow-up:** If she says the math prevents the fallacy: "If the math prevents the fallacy, and the math is equivalent to inclusive fitness, isn't the risk purely rhetorical? And if it's rhetorical, why fight so hard for the terminology?"

  10. **To land the plane: If the Price Equation shows that the variance attributed to groups in your model is the same variance attributed to correlated interactions in kin selection, would you concede that the debate is not about empirical reality, but ultimately about which partition of the same process is most heuristically illuminating for the problem at hand?**
      *   **Follow-up:** If she resists the word "heuristic": "If it is not merely heuristic, please specify one ontological commitment a multilevel theorist must make that an inclusive-fitness theorist can safely deny while still agreeing on all observable data."
