      *   **Point 1: The Shift from Specie to Exchange Rates (The Mechanism Update).**
          *   Hume's mechanism worked through *prices* (inflation/deflation).
          *   Modern mechanism works through *exchange rates*.
          *   If the US runs a deficit, supply of USD increases abroad. In a pure float, USD should depreciate, making exports cheaper.
          *   *Why hasn't this happened?* Capital flows.

      *   **Point 2: Capital Flows vs. Trade Flows (The Missing Piece).**
          *   Hume focused on trade in goods.
          *   Modern Balance of Payments includes the Financial Account.
