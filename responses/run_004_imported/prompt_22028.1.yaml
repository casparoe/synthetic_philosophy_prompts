          *   The world *wants* to hoard dollars (liquidity, safety).
          *   Hume would likely view this as a temporary advantage. He was skeptical of paper credit. He might warn that expanding money/credit without a real anchor leads to eventual inflation or loss of trust.

      *   **Point 4: Hume's Empiricism (Would he change his mind?).**
          *   He was a skeptic. He wouldn't die on the hill of "gold."
