answer: |-
  You are missing a pivotal moment in the history of the philosophy of science that occurred shortly after Popper proposed that definition. Your intuition as a physicist is sound—Einstein *is* closer to the truth than Newton—but Popper's **formal definition of verisimilitude was proven logically untenable.**

  Here is the specific gap in the narrative you encountered: while Popper proposed the definition in *Conjectures and Refutations* (1963), it was demolished by logicians in 1974.

  ### The Miller-Tichý Theorems
  In 1974, David Miller (working with Popper in London) and Pavel Tichý (working independently in Prague) both published proofs showing that Popper's formal definition of verisimilitude was contradictory.

  Popper defined verisimilitude by comparing the **truth-content** (the set of true consequences) and **falsity-content** (the set of false consequences) of two theories. He wanted to say Theory A is closer to the truth than Theory B if:
  1.  A has more truth-content than B, and no more falsity-content; **or**
  2.  A has the same or more truth-content, and less falsity-content.

  The Miller-Tichý proofs demonstrated that **if two theories are both false** (which, in strict logical terms, almost all scientific theories are, including Newtonian mechanics and General Relativity), **Popper's definitions make it impossible to compare them.**

  Under Popper's formal calculus, if Theory A and Theory B are both false, it turns out you cannot establish that one has "more truth-content and less falsity-content" than the other in a way that doesn't lead to a logical contradiction. Essentially, the math implied that **no false theory can be closer to the truth than any other false theory.**

  ### Why This Stalled the "Solution"
  This was a devastating result for Popper's program. It meant that while his *intuition* about scientific progress matched your experience in the lab, his *logic* could not support it.

  If you accept Popper's formal definition, you cannot rigorously say General Relativity has more verisimilitude than Newtonian Mechanics, because both entail some false statements (e.g., about the singularity at the center of a black hole, or the behavior of particles at the Planck scale). Since both are strictly false, Popper's 1963 definition renders them incomparable regarding truthlikeness.

  Popper himself acknowledged this failure. In the 1970s and 80s, he admitted that the definition he had championed was defective, though he maintained that the *concept* of verisimilitude was still necessary for realism.

  ### Why Philosophers Are Still Writing Papers
  Because the definition failed, the problem was not "solved" in the 1960s; it was merely opened. Philosophers of science have spent the last 50 years trying to reconstruct a definition of truthlikeness that avoids the Miller-Tichý trap.

  Current debates generally fall into a few camps, none of which have achieved the universal acceptance you assumed Popper had secured:

  1.  **The Similarity Approach (Niiniluoto, Oddie):** Instead of counting logical consequences (which led to Popper's collapse), these philosophers use "possible worlds" semantics. They measure the "distance" between the actual world and the worlds described by the theory. If Einstein's theory describes a world "closer" to our actual world than Newton's does, it has higher verisimilitude. This is more promising but relies on controversial metaphysics regarding "possible worlds."
  2.  **The Consequence Approach:** Attempts to salvage Popper's idea by restricting which consequences count (e.g., only "relevant" consequences), but defining "relevance" without circularity has proven difficult.
  3.  **The Pragmatic Approach:** Some argue we should abandon the search for a formal logical definition and treat "closeness to truth" as a methodological rule or a pragmatic assessment rather than a logical property.

  ### Summary
  You are not missing a subtle nuance; you are missing a historical refutation.

  *   **Your Intuition:** Correct. Scientific progress looks like getting closer to the truth.
  *   **Popper's Intuition:** Correct. He wanted to formalize that feeling.
  *   **Popper's Math:** Incorrect. It was proven inconsistent in 1974.

  The reason you still see papers debating this is that philosophers are still trying to find the mathematical machinery that validates the intuition you had in the lab. Popper identified the right target, but he missed the shot, and the field has been trying to aim properly ever since.
