answer: |-
  You have diagnosed the situation with impressive precision. Your analogy to the Riemann Rearrangement Theorem is not just illustrative; it is mathematically isomorphic to the problem facing aggregative axiologies in infinite domains. If value is conditionally convergent, the "sum" is a function of the enumeration, not just the set of values.

  To answer your two questions directly: **Yes, the order-dependence worry is a fundamental crack in the extensionist/dominance strategy unless one accepts a controversial metaphysical premise about the structure of reality.** And **yes, Bostrom's Extended Decision Rule (EDR) largely swaps the paralysis problem for a severe form of fanaticism and inherits the cosmological "measure problem," which is arguably order-dependence in disguise.**

  Here is a breakdown of why these "fixes" remain unstable, validating your suspicion that we are looking at unresolved bugs rather than patched features.

  ### 1. Dominance, Natural Orders, and the Metaphysical Bet

  You are correct that Vallentyne and Kagan's (V&K) dominance principles rely on an "essential natural order." The intuition is that while we can mathematically rearrange a population of souls arbitrarily, we cannot arbitrarily rearrange spacetime regions without violating physical structure.

  **The Causal Defense**
  The strongest argument for privileging a specific ordering is **causal structure**. If ethics is fundamentally about *agency* and *influence*, perhaps we are only licensed to sum value over regions defined by causal connectivity (e.g., future light cones).
  *   **The Privilege:** We expand regions based on causal reachability. Region $R_1$ is "before" $R_2$ if $R_1$ is causally prior to $R_2$.
  *   **The Limit:** This solves the rearrangement problem *for the agent*, but it fails to rank worlds globally. It renders ethics agent-relative in a way that many find unsatisfying. It says "World A is better *for me* to create," not "World A is better *simpliciter*."
  *   **The Physics Objection:** Even this relies on a specific cosmology. In General Relativity, global time slices are not always well-defined (e.g., in Gödel universes or certain models of eternal inflation). If the universe lacks a global foliation, there is no "natural" sequence of expanding spatial regions. If the "multiverse" is a quantum branching structure without a canonical basis, the "branches" do not come with a natural enumeration.

  **Is it Fatal?**
  It is fatal to the claim that aggregative consequentialism is a *universal* ethical theory. It can only function as a *local* theory contingent on the cosmological structure of our specific universe having a privileged foliation.
  *   If you stipulate a natural order, you are indeed "smuggling in an arbitrary choice," or rather, betting on a specific metaphysics of time and space.
  *   If you refuse to stipulate, the dominance principle yields incomparability for many world-pairs. Incomparability is better than paralysis (it allows *some* choices), but it fails to guide action in the precise cases (infinite backgrounds) where we needed help most.

  So, your intuition holds: the dominance approach does not dissolve the indeterminacy; it outsources it to cosmology. If cosmology doesn't provide a canonical ordering, the ethical theory remains undefined.

  ### 2. The Extended Decision Rule (EDR) and the Fanaticism Trade-off

  Bostrom recognizes the limitations of dominance ranking (specifically that it leaves many worlds incomparable) and proposes the Extended Decision Rule. As you noted, EDR avoids summing total value. Instead, it compares acts based on the probability that they bring about an infinite positive outcome versus an infinite negative one.

  **Does it escape order-dependence?**
  Technically, yes, because it treats "Infinite Good" as a qualitative state (or a measure) rather than a sum of parts. However, it immediately runs into the **Measure Problem** from cosmology.
  *   To calculate the probability that an act leads to "unbounded good," you need a measure over the space of possible infinite outcomes.
  *   In eternal inflation or quantum multiverse theories, defining this measure is notoriously difficult. Different regularization schemes (cutoffs) yield different probabilities.
  *   This is effectively the Riemann Rearrangement problem resurfacing as the **Measure Problem**. How you "count" the infinite observers determines the probabilities, and there is no consensus on a canonical measure. So, EDR does not fully escape order-dependence; it just shifts it from the *ethical summation* to the *probability assignment*.

  **The Fanaticism Issue**
  This is the more practical fatal flaw. EDR implies that any non-zero probability of creating infinite value dominates any finite amount of value.
  *   **The Trade:** You escape infinitarian paralysis (you can now distinguish acts), but you succumb to **infinite fanaticism**.
  *   **The Consequence:** An agent using EDR should ignore all finite stakes (saving a billion lives, preventing a trillion years of suffering) if there is even a minuscule credence that an alternative act increases the *measure* of infinite good by a tiny fraction.
  *   **Pascal's Mugging:** This is Pascal's Mugging scaled to infinity. If you assign a probability of $10^{-100}$ to a hypothesis where your act creates $\infty$ value, the expected value is still $\infty$. This makes the agent vulnerable to any hypothesis that posits infinite leverage, no matter how epistemically tenuous.

  Bostrom acknowledges this. He suggests we might need to impose a "credibility threshold" or restrict the kinds of infinite hypotheses we entertain, but these look suspiciously like ad hoc patches designed to stop the theory from imploding.

  ### 3. The "Unresolved Crack" Verdict

  You asked for honesty over resolution, so here is the bottom line: **Infinite ethics is currently a reductio ad absurdum for standard aggregative consequentialism.**

  The problems you identified are not technical wrinkles; they indicate that the conceptual framework of "summing value" breaks down when the domain is infinite.
  1.  **Dominance approaches** require a metaphysical privilege (natural order/causal structure) that physics may not grant. Without it, they yield incomparability.
  2.  **EDR approaches** require probability measures over infinite outcomes that are ill-defined (Measure Problem) and lead to decision-theoretic fanaticism that violates basic intuitions about finite stakes.

  **Where does this leave us?**
  Most philosophers working in this niche (including Bostrom, Carlsmith, and others in the EA/LessWrong orbit) tend to converge on one of three uncomfortable positions:

  1.  **Finite Domain Restriction:** We assume for ethical purposes that the *relevant* domain is finite (e.g., only the causally accessible future). This avoids the math but feels like cheating if the universe is actually infinite.
  2.  **Non-Aggregative Axologies:** We abandon total utilitarianism for views that don't sum (e.g., person-affecting views, critical-level views, or virtue ethics). These often handle infinity better because they don't try to compute a global sum, but they come with their own counterintuitive implications (like the Non-Identity Problem).
  3.  **Epistemic Humility / Paralysis:** We accept that if the universe is infinite in the wrong way, our ethical theories literally cannot guide us. We hope the universe is finite, or that value is bounded.

  Your grip on the problem is solid. The "repairs" are indeed attempts to patch a hole in the hull of consequentialism by nailing planks of metaphysics over it. Whether those planks hold depends on the actual structure of reality—a fact that should deeply trouble any ethical theory claiming to be action-guiding regardless of empirical contingency.

  If you want to dig deeper into the "fanaticism" side of the EDR trade-off, I recommend looking at **William MacAskill's work on "Longtermism"** (which grapples with small probabilities of huge impacts) and **Hayden Wilkinson's** recent papers on "threats of fanaticism." They explicitly tackle the tension between avoiding paralysis and avoiding fanaticism, and they largely confirm your suspicion: there is no free lunch. You either accept paralysis, accept fanaticism, or accept arbitrary constraints.
