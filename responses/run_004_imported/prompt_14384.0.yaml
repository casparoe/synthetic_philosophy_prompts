answer: |-
  Good evening. For those who don't know me, I'm [Your Name], and I had the privilege of advising [Bride] during her PhD. When she asked me to give this toast, I was genuinely terrified. Not because of the public speaking, but because her dissertation argued convincingly that the Kalai-Smorodinsky solution is a superior theory of justice to the Nash bargaining solution.

  Half of you are nodding right now. The other half is wondering if I'm about to ask for a show of hands.

  Here is why I was scared: I know that if I fumble the axioms, the game theorists in the room will never let me publish again. But more importantly, I realized that [Bride] wasn't just asking me to talk about math. She was asking me to talk about *why* she loves math. Because she didn't study bargaining to win arguments. She studied it to understand how people build a life together without losing themselves.

  So, I'm going to take a risk. I'm going to use her framework as the spine of this toast.

  In classical game theory, the Nash solution looks at a relationship like a deal. It asks: "Given what happens if we walk away, how do we split the surplus?" It's cold. It's about leverage. It cares about the disagreement point—the worst-case scenario.

  [Bride] argued for Kalai-Smorodinsky. And the beautiful difference is this: KS doesn't look down at what happens if you fail. It looks up at the "utopia point."

  The utopia point is the theoretical maximum of what each of you could achieve if the other gave you everything. Now, in math, you never actually reach the utopia point. But in marriage, that point isn't a destination; it's a compass. A Nash marriage asks, "What do I deserve based on my fallback options?" A Kalai-Smorodinsky marriage asks, "What is the best version of us we can possibly imagine, and how do we walk toward that line together?"

  [Bride] and [Groom], you don't measure your love by what you'd get if you left each other. You measure it by the dreams you're chasing together. That is the utopia point doing real work.

  But the axiom that matters most for the years ahead is monotonicity. In [Bride]'s work, this is non-negotiable. It means that if my opportunities grow—if I get a promotion, if I find a new passion, if my feasible set expands—your slice of the happiness shouldn't shrink.

  In too many relationships, success is zero-sum. One person rises, and the other feels left behind, or threatened, or diminished. Kalai-Smorodinsky forbids that. It demands that when one of you grows, the other doesn't lose ground. It means [Groom], when [Bride] shines, you don't stand in the shadow; you stand in the light she casts. And vice versa. Your opportunities are not a threat to their share; they are an expansion of the whole set.

  Now, I promised myself I wouldn't turn this into a seminar. And I know there's usually a joke about bargaining in these situations.

  I actually tried to calculate the Nash equilibrium of who should give this toast. But I ran into a modeling error. The model requires a "disagreement point"—what happens if we can't agree on who speaks. And looking at the two of you, I realized that option simply isn't in the feasible set. You don't have a disagreement point anymore. You only have a joint payoff.

  [Bride], you taught me that justice isn't about splitting the pie according to who brought the flour. It's about ensuring that as the oven gets hotter, everyone gets fed.

  So, to the theorists: May your solutions be stable.
  To the family: May your love be simple.
  And to both: May you always look at the utopia point, may your growth be monotonic, and may you never, ever settle for the Nash equilibrium when you could have the ideal.

  To [Bride] and [Groom].
