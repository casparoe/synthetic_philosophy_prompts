  4.  **Refining the Philosophical Nuance:**
      *   *Compossibility:* Need to be careful. Leibniz scholars debate whether compossibility is just logical consistency. Most agree it's more (relational harmony). Lewis definitely rejects this. For Lewis, spatiotemporal isolation is the only barrier.
      *   *Actuality:* Leibniz's view is often called "Modal Actualism" (only one world exists) vs. Lewis's "Modal Realism" (all worlds exist). The student conflates "existence" in Leibniz (which is graded/perfective) with "existence" in Lewis (which is binary/univocal).
      *   *The "Surgically Removed" metaphor:* It implies the structure remains the same, just the motive force (God) is gone. But without God, the *selection* disappears. If you remove the selector from Leibniz, do you get Lewis? No, you get a chaos of unselected possibilities. Lewis adds the thesis that *all* exist. Leibniz says only the *best* exists. So Lewis isn't just Leibniz minus God; he's Leibniz minus God *plus* the claim that the non-selected ones exist anyway.

