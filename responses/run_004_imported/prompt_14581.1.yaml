answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I've been friends with Tom for [X] years, which means I have the distinct honor of standing here today, and the distinct disadvantage of knowing exactly how he thinks.

  Actually, that's not entirely true. Last weekend, I learned that I *don't* know how he thinks. Or at least, I don't know how he thinks about G.E. Moore.

  We got into a bit of a debate over dinner. I made the casual observation that Moore's *Principia Ethica* basically says "love and art make life worth living." Tom nearly flipped the table. He spent twenty minutes explaining that I was missing the point of "organic unities." For the non-philosophers here, don't worry, I'll translate. But for Tom's cohort in the back: yes, I got the memo.

  Here is what I learned, and why it matters for Tom and Priya.

  Moore argues that the greatest goods aren't just "beautiful things" and "loving people" sitting side-by-side. You can't just add them up. The value comes from the *unity* of them. It is the specific state of affairs where a human mind is consciously appreciating something worthy. It's not the painting plus the viewer. It's not the beloved plus the lover. It is the *connection* itself that creates a new, greater value that didn't exist before.

  And looking at Tom and Priya, I finally get it.

  If you look at them individually, they are both wonderful people. Tom is brilliant, loyal, and occasionally pedantic. Priya is [insert 1-2 warm traits, e.g., incredibly kind, sharp-witted, the adult in the room]. But Moore would say that listing their virtues is a category error. The "good" isn't Tom, and it isn't Priya. The "good" is what happens in the space between them.

  It's that specific, organic unity where they are truly *seeing* each other. Where the love isn't just a feeling, but a conscious appreciation of the other person's reality. That is the thing that is "greater than the sum of its parts." That is the thing that makes life worth living.

  Now, Tom also pointed out that this specific chapter was basically scripture for the Bloomsbury Group—Keynes, Virginia Woolf, and that whole crowd. They took Moore to mean that art and love were the only things that mattered, and they used it to justify a life of brilliant conversation and very few chores.

  Tom finds it hilarious that they conveniently skipped the much duller chapter on "Duty and Conduct." And I have to say, Tom, while I love you, Priya and I have discussed this. We are adopting the Bloomsbury interpretation for the "love and beauty" part, but we are *not* adopting it for the dishwashing part. That chapter on duty is back on the table.

  But in all seriousness, this philosophy works for you two because you don't just exist near each other. You actively appreciate each other. You create that organic unity.

  So, if I may propose a toast.

  To Moore, for getting it mostly right. To the Bloomsbury Group, for the aesthetic, but not the work ethic. And mostly, to Tom and Priya. May your life together be the ultimate organic unity: where the whole is always, always greater than the sum of its parts.

  To Tom and Priya.
