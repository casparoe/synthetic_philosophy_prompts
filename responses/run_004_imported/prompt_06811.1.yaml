      *   *Wait, one nuance:* Weil's argument rests on the idea that a party claims to pursue the public good but actually pursues its own growth. An algorithm *openly* pursues profit/engagement. Does that make it more honest? No, because it still crushes truth. In fact, it might be worse because it admits it doesn't care about truth.

