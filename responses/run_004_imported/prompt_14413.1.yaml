prompt: |-
  I'm working on a piece about rationalist/game-theory blogs and keep running into 'superrationality' as the reason two people would supposedly cooperate in a one-shot prisoners dilemma with zero communication, just by both being 'sufficiently rational.' Every explanation I've read feels like its quietly begging the question -- rational agents facing the same problem reach the same answer, therefore cooperate -- but why isn't 'we'll both correctly see that defection dominates' just as valid an instance of 'reaching the same answer'? Can you actually spell out the Hofstadter-style logic without hand-waving, and be honest about whether it only works if the two players are literally identical/exact copies of each other, or whether it still does any work when they're just similar-minded strangers? Also curious whether there's a real difference between this and just relabeling Kant's categorical imperative in game-theory language, or if 'superrational' is doing something a decision theorist would actually recognize as distinct. I have to explain this to readers who've never heard of Newcomb's problem, but don't dumb the mechanics down for me here -- I'll handle the simplifying myself.
