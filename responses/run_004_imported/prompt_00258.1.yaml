      *   *Nuance:* Make sure to mention that for Darwin, "selection" requires a population. A single universe cannot evolve. A multiverse provides the population.
      *   *Key Insight:* The strongest Darwinian objection isn't that a designer *exists*, but that the analogy of "selection" might not apply to physical constants if they don't vary and replicate.

