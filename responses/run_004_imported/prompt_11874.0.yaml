          *   *Evaluation:* This is Naomi's strongest move. She identifies the "separability" assumption. If I can update my strategy based on previous bets, I can avoid the loss while keeping the same credences. Owen's analogy holds for structural integrity, but Naomi points out that agents aren't static structures; they learn.
