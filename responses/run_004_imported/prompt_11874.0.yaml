          *   *Verdict:* Owen has the standard philosophical weight here. DBA is usually a *normative* argument about consistency, not an *empirical* prediction about losing money. Naomi confuses the *demonstration* (losing money) with the *point* (inconsistency).

      *   **Move 2: Owen's Bridge Analogy.**
