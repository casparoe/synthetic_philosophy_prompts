      *   **Understanding:** They lack semantic understanding (symbol grounding problem). They manipulate syntax based on probability.
      *   **Mathematical Insight:** They can solve problems, prove theorems (with tools like Lean/Coq), but do they *see* the truth of the Gödel sentence?

  4.  **Synthesize: Gödel vs. LLMs:**
