answer: |-
  Good evening, everyone. For those who don't know me, I'm the younger sibling. I'm currently a junior in high school, which means my expertise is usually limited to algebra and cafeteria food. But because my sister leaves her dissertation drafts all over the house, I also happen to know a surprising amount about the "wrong kind of reasons" problem for fitting-attitude accounts of value.

  For the non-philosophers, here is the gist: My sister's work asks what makes something truly "good." Is it good because it has actual merit? Or is it good just because we have a reason to want it? The classic example is an Evil Demon who threatens to torture you unless you admire a saucer of mud. You have a *reason* to admire the mud—to avoid pain—but the mud isn't actually *good*. That's the "wrong kind" of reason.

  Naturally, when I heard my sister was marrying Marcus, I had to run the numbers. I needed to know: Was this a saucer of mud situation? Was there a demon involved?

  **I have reviewed the premises, and I can confirm: There is no demon, the mud is metaphorical, and Marcus's properties provide sufficient normative grounds for a pro-attitude.**

  For my sister's colleagues in the back: Yes, I mean that the reasons are strictly object-given, not state-given. For everyone else: She isn't marrying him because she's being held hostage, or for the tax benefits, or because it's just "time." She's marrying him because of *him*.

  And that is the "right kind" of reason. In philosophy, a right-kind reason tracks the actual value of the object. In life, we call that love. Marcus, you are kind, patient, and you make my sister laugh in a way that no amount of philosophical rigor could explain. You are not a saucer of mud. You are worthy of admiration in your own right.

  So, if we accept that goodness is defined by what we have reason to value, then this marriage is undeniably good.

  Please raise your glasses. To the bride and groom: May your reasons always be the right kind, and may your attitudes always be fitting. To Marcus and [Sister's Name]!
