      *   *Weaknesses/Risks:* There is a risk of over-intellectualizing practical design choices. The connection to Wittgenstein needs nuance (Neurath admired W. but hated the mysticism). The "Words divide, pictures unite" interpretation needs careful handling to avoid sounding like it contradicts the pedagogical aim.

