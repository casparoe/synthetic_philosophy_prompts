      *   Pragmatic Encroacher: Sarah speaks falsely. Hannah *does* know (her stakes are low), even if Sarah shouldn't *rely* on it.
      *   *Wait, check Stanley:* Stanley argues knowledge *is* the norm of practical reasoning. If Hannah knows, she can act. If Sarah relies on Hannah, does Sarah know? That gets complicated.
      *   *Better focus:* Stick to the truth value of the ascription "Hannah knows."
      *   *Stanley's View:* Whether Hannah knows depends on Hannah's stakes.
      *   *DeRose's View:* Whether "Hannah knows" is true depends on the Speaker's context.
