          *   Speaker: Needs to know for a high-stakes reason (e.g., Speaker is betting their life on Hannah's deposit clearing).
          *   *EC Prediction:* Speaker's context is high stakes -> Standards raised -> "Hannah knows" is False.
          *   *PE/SSI Prediction:* Subject's stakes are low -> Knowledge is attainable -> "Hannah knows" is True (invariantly).
      *   *Scenario B: High Stakes Subject / Low Stakes Speaker.*
          *   Hannah (Subject): Will be ruined if the check doesn't clear. (High Stakes).
          *   Speaker: Just chatting, doesn't care. (Low Stakes).
          *   *EC Prediction:* Speaker's context is low stakes -> Standards low -> "Hannah knows" is True.
          *   *PE/SSI Prediction:* Subject's stakes are high -> Knowledge undermined -> "Hannah knows" is False (invariantly).

      *   *Refining the Case:* Scenario B is often more intuitive for testing. Let's flesh that out.
      *   *Wait, one nuance:* DeRose's contextualism focuses on *salience of error possibilities*, which is often driven by stakes. But strictly speaking, it's the *ascriber's* context. Stanley's SSI focuses on the *subject's* practical environment.
      *   *Let's check the literature:* This is often called the "Speaker-Stakes" vs. "Subject-Stakes" distinction.
      *   *Contextualism:* Truth depends on Ascriber's Standards.
      *   *Pragmatic Encroachment:* Truth depends on Subject's Practical Situation.
      *   *Divergence:* When Ascriber Stakes $\neq$ Subject Stakes.

  5.  **Drafting the Response:**
