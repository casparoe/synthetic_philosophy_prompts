answer: |-
  # The Looping Mourner
  **When the DSM-5-TR codified Prolonged Grief Disorder, it didn't just name a condition. It changed the condition. Was that a mistake, or a necessity?**

  In 2022, the American Psychiatric Association drew a line in the sand of human sorrow. With the publication of the DSM-5-TR, they formally recognized Prolonged Grief Disorder (PGD), a diagnosis reserved for those whose yearning for the deceased remains acute, disabling, and unrelenting for at least twelve months after a loss. Before this, a clinician might have coded such a patient for depression or anxiety, or simply noted "uncomplicated bereavement" and offered condolences. Now, there is a specific bucket for grief that refuses to soften.

  The practical arguments for this move are clear. Supporters note that without a code, insurance companies deny coverage for specialized grief therapy. "Normal grief" is not billable; pathological grief is. For the bereaved who find themselves functionally paralyzed years after a loss, the diagnosis offers validation: *You are not failing at mourning; you are suffering from a treatable condition.*

  But there is a deeper, more philosophical objection that resists the easy calculus of insurance reimbursement. Critics, including prominent thanatologists, worry that by medicalizing mourning, we alter the very texture of the experience. This is not merely the standard fear of overdiagnosis. It is a concern about what the philosopher of science Ian Hacking called the "looping effect."

  Hacking distinguished between "indifferent kinds" (like rocks or quarks) and "interactive kinds" (like people). If you classify a rock as sedimentary, the rock does not change its behavior to align with your classification. But if you classify a human being—as a "refugee," a "teenager," or "disordered"—that person becomes aware of the classification. They may internalize it, resist it, or perform it. Their reaction loops back, altering the meaning of the category itself.

  The critics' worry is that PGD creates a harmful loop. By handing a griever a diagnostic label, we invite them to view their enduring love as a symptom, their attachment as an obstruction, and their mourning as an illness to be cured rather than a price of love to be endured. If the APA's decision changes how millions of people narrate their loss, potentially truncating necessary pain in favor of clinical efficiency, was the diagnosis worth the cost?

  To answer this, we must take the looping effect seriously not as a rhetorical flourish, but as a psychological mechanism. And when we weigh the loops against one another, the conclusion becomes stark: The APA was right to add Prolonged Grief Disorder, because the loop of invisibility is far more destructive than the loop of diagnosis.

  ***

  Ian Hacking's insight reminds us that classification is never neutral. When the DSM introduces a new disorder, it creates a new way of being a person. Before the mid-20th century, one could not be a "multiple personality" in the modern sense because the cultural script for that experience did not exist. Similarly, before PGD, one could be "stuck," but one could not be "clinically prolonged."

  The risk of the PGD loop is that it medicalizes attachment. Grief is the continued presence of love in the absence of the beloved. It is, by definition, a resistance to letting go. If a therapist approaches PGD with a purely mechanistic mindset, the goal of treatment becomes "symptom reduction." The patient, sensing this, may begin to view their longing as a malfunction. They might suppress tears to show progress. They might rush to clear out the deceased's closet to prove they are "moving on." In this negative loop, the diagnosis becomes a weapon against the self, where the patient collaborates with the clinician to excise a part of their own emotional history.

  This is a genuine danger. It risks imposing a homogenized, Westernized timeline on mourning. In some cultures, ongoing communion with ancestors is a virtue, not a disorder. If the DSM-5-TR's twelve-month marker is applied rigidly, it pathologizes cultural norms. The looping effect here is one of conformity: the diagnosis teaches people how to grieve "correctly," potentially flattening the idiosyncratic, messy reality of loss into a checklist of criteria.

  However, we must compare this risk to the alternative. What is the looping effect of *not* having the diagnosis?

  Without PGD, the griever enters a different loop: the loop of isolation. Imagine a parent three years after the death of a child. They are unable to work. They are socially withdrawn. They feel a physical yearning that disrupts sleep and appetite. They go to a doctor who tells them, "There is nothing wrong with you; this is just grief."

  This is a classification, too. It classifies the suffering as "normal." But for the person drowning in it, it feels like a dismissal. The loop that closes here is one of silence. Because there is no name for the specific agony of *stuckness*, the griever assumes they are uniquely broken. They are not "disordered," but they are dysfunctional. They cannot access the specific therapies (such as Complicated Grief Therapy) that target the mechanisms of traumatic loss. They are often prescribed antidepressants that treat depression but leave the yearning untouched.

  In this scenario, the lack of a diagnosis does not protect the integrity of their mourning; it abandons them to it. The "normal grief" label creates a feedback loop where the sufferer hides their pain to avoid burdening others, which increases the isolation, which deepens the pathology. This is a silent loop, but it is lethal. It is associated with higher rates of suicide, cardiac issues, and immune dysfunction.

  ***

  Hacking did not argue that looping effects are inherently bad; he argued they are inherent to human sciences. We cannot classify people without changing them. Therefore, the question is not whether the PGD diagnosis will change how people grieve—it undoubtedly will. The question is which change we prefer.

  The argument for PGD rests on the idea that there is a point where grief ceases to be a process of integration and becomes a state of arrest. This is not a judgment on the depth of love. One can love deeply and still be clinically impaired. The diagnosis distinguishes between *feeling* pain and being *disabled* by it.

  When a clinician uses the PGD diagnosis correctly, it should not function as a command to stop loving the dead. It should function as a map of obstruction. It tells the patient: *Your grief has become a trap. The pain you feel is real, but the inability to function is the disorder, not the love itself.*

  This reframing can create a positive loop. By naming the condition, the clinician validates the severity of the suffering. The patient feels seen. This validation reduces shame. Reduced shame allows the patient to engage in therapy. Therapy helps them reintegrate the loss into their life narrative without being consumed by it. The classification changes the person, but it changes them toward agency.

  Critics fear that the diagnosis will make people grieve *less*. But evidence suggests that effective grief therapy often allows people to grieve *more effectively*. It helps them find a place for the deceased in their life that allows them to live again. The goal of treating PGD is not amnesia; it is restoration.

  Furthermore, the worry about medicalization assumes that the alternative is a pure, unmedicalized space of natural mourning. But we live in a medicalized world. People are already seeking help. They are already taking medications. They are already looking for answers. To deny them a specific diagnostic tool because it might alter their self-conception is to privilege philosophical purity over practical relief. It is akin to refusing to name a broken leg because "walking is a natural human activity," and naming the break might make the patient view their leg as a mechanical object.

  ***

  There are safeguards necessary to mitigate the negative looping effects. Clinicians must be trained to understand that PGD is not a mandate to sever bonds with the dead. The DSM criteria must be applied with cultural humility, recognizing that the twelve-month timeline is a heuristic, not a law of physics. Insurance companies must not use the diagnosis to limit care but to expand it.

  But these are implementation issues, not arguments against the category itself.

  The APA was right to add Prolonged Grief Disorder to the DSM-5-TR. They were right because the "interactive kind" of the untreated, unrecognized prolonged griever is a kind defined by stagnation and silence. The "interactive kind" of the diagnosed patient is defined by the possibility of intervention.

  Ian Hacking taught us that when we classify people, we create a space for them to move. We give them a language to understand themselves. For the millions of people whose grief has hardened into a cage, the language of "normal bereavement" offers no key. The language of PGD does.

  Yes, the diagnosis will change how people mourn. It will make them more aware of their process. It will make them more likely to seek help. It will medicalize a slice of human suffering. But to refuse the diagnosis is to leave that suffering in the dark, where the only looping effect is the spiral of untreated despair. We cannot protect the sanctity of grief by denying tools to those who are drowning in it. The diagnosis is not a judgment on the love that remains; it is a lifeline to the life that must go on.
