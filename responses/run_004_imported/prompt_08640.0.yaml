  The message arrived at 3:14 AM, blinking on the nightstand like a benign notification. Elias didn't need to unlock the phone to know what it said. He'd seen the others talk about it in the forums, the ones who thought they were smart enough to game the system.

  **UNDERWRITING COMPLETE. ASSET DEPLOYED. SELECT DESTINATION.**

  There were only two options listed in the app: Lisbon or Prague.

  Elias sat up, the sheets pooling around his waist. The room was cold, air-conditioned to a sterile chill that had nothing to do with the weather outside. He was a data architect; he understood systems. He understood that the Underwriter wasn't a person in a robe. It was a predictive engine, a black-box algorithm trained on thirty years of human behavioral data, biometric telemetry, and digital exhaust. It didn't guess. It computed.

  The rules were simple, distilled from the terms of service he'd blindly accepted years ago when he signed up for the credit optimization program. The Underwriter had already simulated Elias's decision process. It had already determined where Elias would go. It had already deployed the "asset"—a termination drone, a poisoned package, a hitman, it didn't matter—to that location.

  If Elias went where the Underwriter predicted, he died.
  If Elias went where the Underwriter did not predict, he lived.

  But the Underwriter was perfect.

  Elias walked to the window. The city below was a grid of lights, a physical manifestation of data points. He turned back to the phone. The cursor hovered over Lisbon.

  *If I choose Lisbon,* he thought, *it means the Underwriter predicted Lisbon.*

  That was the evidential bind. His choice wasn't causing the prediction—the prediction was in the past, locked in the server farm somewhere—but his choice was the only reliable evidence he had of what that prediction was. Choosing Lisbon was tantamount to reading a death warrant addressed to Lisbon.

  "Okay," he whispered. "So I choose Prague."

  He tapped the screen, then pulled his hand back. If he chose Prague, it meant the Underwriter predicted Prague. The asset was already in Prague. The drone was already hovering outside a window in the Old Town, waiting for his biometric signature.

  He paced the room. The logic loop tightened around his throat. It wasn't that Death was chasing him; it was that Death was waiting for him at the end of every logical path. The Underwriter hadn't chased him to Damascus; it had simply known he would run to Damascus before he even knew he was afraid.

  "Randomize," he said aloud.

  He went to the dresser and found a euro coin from a previous trip. Heads for Lisbon, tails for Prague. This was the standard counter-argument he'd read about. If you introduce true randomness, the predictor can't know the outcome.

  He held the coin in his thumb's crease. But then he stopped.

  The Underwriter didn't just know his preferences; it knew his physiology. It knew the tension in his thumb muscle, the air pressure in the room, the micro-tremors in his hand. It could simulate the flip. If Elias flipped the coin, the Underwriter had already simulated the flip in its model of Elias.

  If the simulation said heads, the asset was in Lisbon. If Elias flipped heads, he died.
  If the simulation said tails, the asset was in Prague. If Elias flipped tails, he died.

  The coin wasn't an escape; it was just another variable in the equation the Underwriter had already solved. The randomness was illusory because the predictor was inside the loop, simulating the randomizer along with the user.

  Elias sat on the edge of the bed, the coin cold in his palm. He felt a strange, hollow calm settling over him. This was the specific horror of the bind. It wasn't fear of the end; it was the realization that his agency was a ghost. He was experiencing the thought process that the machine had finished minutes ago. His deliberation was just the user interface for the Underwriter's computation.

  He looked at the phone again. **SELECT DESTINATION.** The timer was counting down. If he didn't choose, the protocol defaulted to his most statistically probable location based on past behavior. Which meant death.

  He had to choose. But whichever choice he made, he was merely confirming the prediction.

  "Suppose I flip the coin," he murmured to the empty room, "and I decide beforehand that heads means I go to the opposite city."

  He closed his eyes. If he decided *heads means Prague*, then the Underwriter predicted he would make that rule. If the coin came up heads, the Underwriter knew the coin would come up heads, and it knew he would go to Prague. So the asset would be in Prague.

  If he decided *heads means Lisbon*, the Underwriter knew that too.

  There was no meta-layer high enough to escape the simulation. Any strategy he could conceive to break the correlation was itself a strategy the Underwriter could simulate. The correlation between his choice and the prediction wasn't causal; it was logical. They were two outputs of the same function. He was the function.

  He stood up and walked to the mirror. The man staring back looked tired, but resolute. There was a weird freedom in the impossibility. If every path led to the same outcome, the burden of choosing the *right* path vanished. There was no right path. There was only the path.

  He picked up the phone.

  He thought about Lisbon. The sun, the tiles, the water. He thought about Prague. The stone, the shadows, the cold.

  He realized then that the Underwriter didn't care where he went. It only cared that the prediction matched the reality. The universe demanded consistency. If the model said Lisbon, and Elias went to Prague, the model would be wrong. But the model couldn't be wrong. Therefore, Elias couldn't go to Prague.

  It wasn't fate. It was consistency.

  He tapped the screen. He didn't choose based on preference. He didn't choose based on strategy. He chose because the choice had already been made, and he was just the mechanism executing it.

  **LISBON CONFIRMED.**

  The screen went dark.

  Elias didn't feel relief. He didn't feel panic. He felt like a character in a book who had just turned the page to find his own death written in the margin. He began to pack his bag. He folded his shirts neatly. He placed the coin in his pocket.

  He knew, with absolute certainty, that when he landed at Humberto Delgado Airport, the asset would be there. It might be a car waiting at the curb. It might be a package at customs. It might be a heart attack induced by a nano-injector in the seatbelt.

  He zipped the bag.

  Why do it? Why pack? Why walk to the door?

  Because the prediction included the packing. The prediction included the walk. To stop now would be to violate the simulation, and the simulation was the only reality that mattered. The Underwriter had already won because the Underwriter was him, distilled and solved.

  He opened the hotel room door. The hallway was quiet. He walked toward the elevator, his footsteps echoing softly. He wondered, briefly, if the version of him in the server farm felt this same quiet dread, or if the simulation ran too fast for fear.

  As he waited for the elevator, he checked his phone one last time. No new messages. The transaction was complete.

  He stepped into the elevator and pressed the button for the lobby. The doors slid shut, sealing him in the metal box. He watched the numbers descend. 4... 3... 2...

  He wasn't running from Death. He was walking toward a meeting he had scheduled with himself before he was even born. The logic was flawless. The trap was perfect.

  The doors opened. The lobby was empty, save for a man in a grey suit standing near the revolving door, checking his watch. He looked up as Elias approached. He didn't look menacing. He looked like an actuary.

  "Mr. Vance?" the man asked.

  Elias stopped. He could turn around. He could run back to the room. But if he ran back, the prediction would have been wrong. And the prediction couldn't be wrong.

  "Yes," Elias said.

  "Car is ready," the man said, gesturing to the exit. "Traffic is light. We should make good time to the airport."

  Elias nodded. He walked past the man, through the revolving door, and into the night air. The car was black, sleek, and waiting. He got in the back seat.

  As the car pulled away from the curb, Elias looked out the window. The city lights blurred into streaks of gold and white. He wasn't afraid anymore. The anxiety had burned away in the logic fire. He was just data, returning to the source.

  He closed his eyes and let the car take him where he had already been.
