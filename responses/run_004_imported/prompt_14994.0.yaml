      *   **Bayesian Perspective:** The Likelihood Principle states that evidence is contained in the likelihood function. Stopping rules *should* be irrelevant to the interpretation of the evidence *given the data*. However, practical Bayesian inference can still be affected by optional stopping if priors aren't robust or if decision rules are involved.
      *   **Colleague's Claim:** "Data is what it is" is a Likelihood Principle argument. "Bayesian analysis... wouldn't care" is mostly true regarding the *posterior* calculation, but there are nuances regarding calibration and decision-making.
      *   **Replication Crisis:** Yes, this specific behavior is a primary driver of the replication crisis in psychology.

  3.  **Structure the Response:**
