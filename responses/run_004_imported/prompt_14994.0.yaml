      *   **Explain the Frequentist Problem:** Why $p=0.03$ is invalid here (Type I error inflation). Use an analogy (flipping coins).
      *   **Address the Bayesian Claim:** Nuance the colleague's statement. Bayesians *theoretically* ignore stopping rules (Likelihood Principle), but in practice, optional stopping can still lead to misleading conclusions if not handled carefully (e.g., Bayes Factors can be biased by optional stopping if thresholds are used).
