          *   *Analogy:* Rolling a die until you get a 6. If you say "I rolled once and got a 6," $p=1/6$. If you say "I rolled until I got a 6," the probability of eventually getting a 6 is 1. The *outcome* is the same (a 6), but the *process* changes the meaning.
