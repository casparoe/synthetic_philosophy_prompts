      *   *Part 1:* The Epistemological Argument. A miracle is a violation of the laws of nature. Our evidence for laws of nature is based on uniform experience. Therefore, the evidence *against* a miracle is as strong as evidence can possibly be. To believe a miracle, the evidence *for* it must be even stronger (which is practically impossible).
      *   *Part 2:* The Psychological/Sociological Argument. Even if Part 1 isn't fully convincing, we have four maxims to evaluate testimony:
