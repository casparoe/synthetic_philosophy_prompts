      *   *Why is Soares et al. still relevant?* Because Hadfield-Menell assumes the agent *can* be uncertain and *will* update correctly. Soares et al. address the structural incentives that make an agent *resist* having its utility function modified (which includes being turned off).

  3.  **Identify Key Limitations of the Hadfield-Menell Result:**
      *   **Assumption 1: Perfect Rationality/Updating.** The agent must update its belief about the reward function correctly upon observing the human's action (pressing the button). If the agent thinks the human is irrational or noisy, the incentive weakens.
