answer: |-
  You have hit on one of the most famous and consequential problems in Fregean semantics. Your intuition is spot-on: **yes, Frege is committed to an infinite hierarchy of senses**, and **yes, he knows it**, though he treats it more as a necessary technical consequence than a philosophical crisis.

  Here is the breakdown for your seminar prep.

  ### 1. Does Frege flag this in the text?
  He does, but briefly. You are right that he doesn't dwell on the "infinity" of it in the main body of the argument, but he explicitly acknowledges the double-embedding case.

  Shortly after the passage you quoted, Frege writes (in the Black translation):

  > "In order to be precise, we ought really to distinguish a **double indirect reference** and a **double indirect sense**, and so on."

  He acknowledges that in a clause like "Galileo believed that Kepler said...", the words in the innermost clause ("morning star") are in a *double* oblique context. Therefore:
  *   **Customary Reference:** The planet Venus.
  *   **Indirect Reference (1st level):** The customary sense (the mode of presentation of Venus).
  *   **Double Indirect Reference (2nd level):** The *indirect sense* (the mode of presentation of the mode of presentation).

  So, the regress *does* get going. Frege bites the bullet. He accepts that for every level of embedding, there is a new reference and a new sense.

  ### 2. Why does he accept this? (The Seminar Point)
  The reason Frege accepts this infinite hierarchy is to save the **Principle of Compositionality**.

  Frege's core rule is: *The reference of a complex expression is determined by the reference of its parts.*

  *   In direct speech, the reference of "The Morning Star" is Venus.
  *   In "Kepler said that...", the reference of the clause is a **Thought**. For the clause's reference to be the Thought, the parts ("Morning Star") must contribute their **Customary Sense** to that Thought. So, in this context, the *reference* of "Morning Star" becomes its Customary Sense.
  *   Now, take "Galileo believed that [Kepler said...]". The reference of the whole *that*-clause is now Galileo's attitude toward Kepler's Thought. For compositionality to hold, the parts of the embedded clause must now contribute *their* reference in this new context. But their reference in the first embedding was their Customary Sense. So in the second embedding, their reference must be the *mode of presentation of that sense*.

  If Frege didn't allow the reference to shift up a level every time, substitution of co-referential terms would break down in nested contexts, and compositionality would fail. He prefers an infinite ontology of senses over losing compositionality.

  ### 3. Who sorted this out later?
  You mentioned Church and Dummett; both are crucial here.

  *   **Alonzo Church:** He formalized Frege's insight in his *Logic of Sense and Denotation* (1950s). Church explicitly built the infinite hierarchy into the type theory of his logic. For Church, this wasn't a bug; it was a rigorous feature. He distinguished types of senses (type 0, type 1, type 2...) to handle exactly the problem you identified.
  *   **Michael Dummett:** In *Frege: Philosophy of Language*, Dummett defends Frege against the charge that this hierarchy is psychologically implausible. Critics ask: "How can a human mind grasp an infinite number of distinct senses?" Dummett argues that we don't need to possess an infinite list of senses explicitly. Rather, we grasp a **rule** or a **method** for determining the sense at any given level of embedding. We understand the *system*, not every individual node in the infinite tree.

  ### 4. Is it a "real bullet"?
  Yes. It is often cited as a major cost of Fregean semantics.
  *   **The Cost:** Ontological extravagance (an infinite number of abstract entities) and psychological complexity.
  *   **The Benefit:** It preserves the substitutivity of identity (*Salva Veritate*) in all contexts, provided you track the "level" of reference. "Morning Star = Evening Star" is true at the customary level, but you cannot substitute them *Salva Veritate* inside "Kepler said..." because there they have different indirect references (different customary senses).

  ### Summary for your Seminar
  If you want to make a strong point in the seminar:
  1.  **Confirm your worry:** It is the "Hierarchy of Senses" objection.
  2.  **Cite Frege:** Point out the "double indirect reference... and so on" passage to show Frege knew.
  3.  **Explain the Trade-off:** Frege chooses this hierarchy to preserve **Compositionality**.
  4.  **Mention the Defense:** Dummett's "grasping a rule" argument is the standard Neo-Fregean defense against the psychological implausibility charge.

  You spotted a genuine structural feature of the theory that most first-time readers miss. Good luck with the seminar!
