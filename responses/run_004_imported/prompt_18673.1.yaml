answer: |-
  Good evening. For those of you who don't know me, I'm the younger sibling. I'm also, as my sister noted, the only other philosopher in the family. When she asked me to give this toast, she gave me one instruction: "Please do not make this a lecture."

  So, I promise I will not lecture. But I do need to talk about objects.

  My sister and [Fiancé's Name] met in a metaphysics seminar. Their courtship has been defined by a very specific, very persistent disagreement. It's about what philosophers call the Special Composition Question. Roughly: *When do some things add up to make a new thing?*

  My sister is a universalist. She believes that if you have any objects whatsoever, they compose a further object. There is a thing that is the fusion of this microphone and that wedding cake. [Fiancé's Name], on the other hand, follows van Inwagen. He believes composition only happens when particles are caught up in a life. For him, strictly speaking, there are no tables, no cars, and technically, no wedding cakes. There are only particles arranged table-wise, car-wise, and cake-wise.

  You can imagine this makes buying furniture difficult. But it also led to the moment my sister knew he was the one. At their engagement dinner, he raised a glass "to the simples arranged fiancée-wise." It sounds cold to some of you, I know. But to her, it was perfect. Because it acknowledged that even if the world is just particles, *she* is the arrangement that matters most to him.

  Now, as it happens, I'm currently taking a seminar on metaontology where we study disputes exactly like theirs. We read Eli Hirsch, who argues that disagreements like this are merely verbal. He says both sides agree on all the physical facts—they agree on where the particles are—and they only differ on how they use the word "exists." In Hirsch's view, they're saying the same thing in different languages.

  But then we read Ted Sider, who replies that this concedes too much. Sider argues that some ways of describing the world "carve nature at its joints" better than others. He thinks there might be a fact of the matter about who is right. One of them might be tapping into the fundamental structure of reality, and the other might be missing it.

  For months, I've been stuck in the middle of this debate. Is their love a substantive reality, or just a way of speaking? Is their marriage a fundamental joint in the universe, or just a convenient label for two people living in the same apartment?

  Standing here today, watching them, I think I've realized that the metaontology of marriage is different from the metaontology of tables.

  If Hirsch is right, and their dispute is merely verbal, that is a beautiful model for a relationship. It suggests that you can look at the exact same world, the exact same life, and describe it differently without contradicting one another. She sees a whole; he sees the parts. She sees the unity; he sees the constituents. And they make room for both descriptions. They agree on the particles. They agree on the arrangement. They just disagree on the label. And they love each other anyway.

  But if Sider is right, and there is a fact of the matter about what *really* exists, then I think today proves that my sister is right. Because look around this room. Look at what they have built. There is a community here. There is a history. There is a commitment. To say that this marriage is *not* a real object, that it is nothing over and above the particles, seems to miss the weight of what is happening. They have carved a new joint in nature. They have composed something that did not exist before.

  Perhaps the truth is a composition of both views. Maybe marriage is the one exception to van Inwagen's rule. Maybe there are no tables, and there are no cars, but there *are* marriages. Maybe "life" isn't just biological metabolism, but a shared project, a shared vocabulary, a shared refusal to let the other person drift away into a cloud of unrelated simples.

  My sister and [Fiancé's Name] have spent four years failing to convert one another. I am not going to solve this for them now. I don't know if quantifiers vary, and I don't know if nature has joints. But I know this: Ontology asks what exists. Marriage asks what we *make* exist.

  Whatever the fundamental structure of the universe turns out to be, you two have constructed a world within it that is sturdy, and kind, and real. You have taken the simples arranged [Fiancé's Name]-wise and the simples arranged [Sister's Name]-wise, and you have composed a new object. Call it a union, call it a fusion, call it a life.

  So, I'd like to propose a toast.

  To the universalist, who sees the whole.
  To the restrictionist, who respects the parts.
  And to the marriage, which proves that composition is not just a question of metaphysics, but an act of will.

  To the bride and groom.
