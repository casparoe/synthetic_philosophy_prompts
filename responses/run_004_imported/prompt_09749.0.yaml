      *   *Practically:* No. People bet for entertainment, risk preferences differ (utility of money isn't linear), or they have different priors that they agree to disagree on.
      *   *Specific Context:* They have *different expertise*. This breaks the "common prior" assumption slightly. The psychologist has a better reference class for replication rates in her field (the "Replication Crisis" context).

