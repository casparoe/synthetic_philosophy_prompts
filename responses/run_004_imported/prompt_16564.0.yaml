answer: |-
  This is an excellent prompt for a graduate seminar because it forces a confrontation between the *moral theology* of resistance (John) and the *juridical-constitutional* theory of resistance (Aquinas). To move your students past the textbook flattening, you need to highlight that while John of Salisbury provides the *rhetoric* of tyrannicide, Aquinas provides the *mechanics* of legitimate resistance that early modernity actually adopted.

  Here is a comparative analysis structured to help you guide that seminar discussion.

  ### 1. The Distinctions: Source of Authority vs. Bond of Obligation

  **Aquinas: The Juridical Distinction (*Titulus* vs. *Exercitium*)**
  Aquinas's distinction (articulated in *De Regimine Principum* and refined in the *Summa Theologiae* II-II, q. 42) is ontological and juridical. It concerns the **status of the ruler**.
  *   **Tyrant by Title (*tyrannus ex defectu tituli*):** The usurper. He has no legitimate claim to power. Resistance here is not technically "sedition" because there is no true common good to disrupt; it is akin to repelling an external aggressor.
  *   **Tyrant by Exercise (*tyrannus ex parte exercitii*):** The legitimate ruler who rules abusively. He holds true authority but misuses it.
  *   **The Work it Does:** This distinction protects the *office* while condemning the *man*. It creates a high barrier for resistance against a crowned king. Aquinas argues that removing a tyrant by exercise often leads to greater evils (factionalism, worse tyranny). Therefore, resistance must not be private but **public**, undertaken by a superior authority (e.g., the Emperor, the Pope, or the community acting through established mechanisms).

  **John of Salisbury: The Personal Distinction (The Oath of Fealty)**
  John's distinction in the *Policraticus* (Book VIII) is relational and theological. It concerns the **status of the killer**.
  *   **Bound by Oath:** If the would-be slayer has sworn fealty, they are generally bound to the tyrant, though John suggests this bond is voided if the tyrant commands against God.
  *   **Not Bound by Oath:** If the killer is a *privatus* (private citizen) with no specific bond of fealty, the tyrant is deemed a "public enemy" (*hostis publicus*). Killing him is not murder but an execution of divine justice.
  *   **The Work it Does:** This distinction individualizes the right of resistance. It transforms tyrannicide from a political act into a **religious duty**. By framing the tyrant as an enemy of God, John empowers the individual conscience to act as the judge of the ruler's legitimacy.

  ### 2. Who Licenses More Private, Unilateral Tyrannicide?

  **Verdict: John of Salisbury.**

  When taken seriously, **John of Salisbury's framework is significantly more permissive of private, unilateral action.**

  *   **John's Radicalism:** Although John includes the caveat about oaths, his overarching thesis is that the tyrant is a slave to sin and an enemy of the public utility. In a feudal society where oaths are complex and layered, the theological override ("God's law supersedes feudal law") is easily invoked. John explicitly praises the act of the private citizen who slays the tyrant, sanctifying the violence as a service to God. He places the judgment of tyranny largely in the hands of the moral actor.
  *   **Aquinas's Restraint:** Aquinas explicitly condemns private killing of a legitimate ruler as the sin of sedition. Even regarding a usurper, Aquinas prefers that the removal be handled by public authority to ensure the restoration of order. For a tyrant by exercise, Aquinas is famously cautious, suggesting that toleration is often preferable to the chaos of rebellion. He systematically closes the door on the *privatus* acting alone, channeling resistance through institutional bodies.

  **Seminar Point:** Ask your students: *Why does Aquinas fear the private killer more than the tyrant?* The answer lies in his teleology: the preservation of the *ordo* (order) is a prerequisite for the common good. Private violence destroys the *ordo*, even if it removes a bad man. John prioritizes the *salus* (salvation/safety) of the community over the *ordo* of the hierarchy.

  ### 3. Whose Framework Had the Greater Afterlife?

  **Verdict: Aquinas.**

  While John of Salisbury is frequently cited as the "father of tyrannicide," **Aquinas's framework provided the structural blueprint for early modern resistance theory.**

  **Justification:**

  1.  **The Doctrine of the Lesser Magistrate:**
      The dominant strand of early modern resistance theory—found in Lutheran (Magdeburg Confession), Calvinist (*Vindiciae Contra Tyrannos*), and Catholic (Suárez) thought—rejected private tyrannicide. Following the trauma of regicide (e.g., the assassination of Henry III and Henry IV), mainstream resistance theorists needed a way to justify resistance without licensing anarchy. They adopted the **Aquinas distinction**: private individuals cannot resist, but "lesser magistrates" (public authorities) can depose a tyrant by exercise. This is the *De Regimine* model institutionalized.

  2.  **Constitutionalism vs. Zealotry:**
      John's framework fueled the radical, often Catholic, wing of resistance (e.g., Juan de Mariana), which argued that private individuals could kill tyrants. This position became politically toxic, leading to the expulsion of the Jesuits from France and the condemnation of their texts. In contrast, the Aquinas/Thomistic trajectory evolved into Lockean constitutionalism. Locke's argument that the people may resist a ruler who violates the trust of government is a secularized version of Aquinas's "public authority" doctrine, not John's "religious duty" doctrine.

  3.  **The Usurper Distinction:**
      The Aquinas distinction between the usurper and the legitimate tyrant became central to early modern debates on conquest and legitimacy (e.g., the Glorious Revolution). William of Orange was justified not because he was a private killer, but because James II had effectively abdicated (becoming a tyrant by exercise who forfeited title) or was treated as an aggressor. The legalistic parsing of *title* vs. *exercise* is pure Scholasticism.

  **Seminar Point:** Challenge the students with this paradox: *John of Salisbury is more famous for "justifying tyrannicide," but Aquinas is more responsible for the actual practice of legitimate revolution in the early modern period.* John provided the **moral passion**, but Aquinas provided the **legal machinery**.

  ### Summary for the Seminar Board

  | Feature | John of Salisbury (*Policraticus*) | Thomas Aquinas (*De Regimine* / *Summa*) |
  | :--- | :--- | :--- |
  | **Core Distinction** | **The Agent:** Is the killer bound by an oath? | **The Ruler:** Is the tyranny in title or exercise? |
  | **Private Action** | **Permitted/Praised:** If no oath, it is a religious duty. | **Forbidden:** Private killing is sedition; requires public authority. |
  | **Nature of Act** | Executing divine judgment on a public enemy. | Restoring political order/justice. |
  | **Early Modern Legacy** | Radical wing (Mariana); often censored/condemned. | Mainstream wing (Lesser Magistrates, Locke, Constitutionalism). |

  **Conclusion:**
  If the goal is to understand who made tyrannicide *thinkable* as a virtue, it is John. But if the goal is to understand how resistance was *legitimized* within the emerging sovereign state system without collapsing into civil war, it is Aquinas. Your students should leave understanding that the "Scholastic justification of tyrannicide" was actually a Scholastic *restriction* of it, designed to save the state from the very zealots John of Salisbury might have inspired.
