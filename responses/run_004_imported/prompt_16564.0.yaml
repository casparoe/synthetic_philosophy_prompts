      *   **Core Questions:**
          1.  Whose position actually licenses *more* private, unilateral tyrannicide when qualifications are taken seriously?
          2.  Whose framework had the *greater afterlife* in early modern resistance theory?
      *   **Requirement:** Justify the answer.

  2.  **Deconstruct Aquinas's Position:**
      *   *De Regimine Principum* (On Kingship): Discusses tyranny. Suggests that if tyranny is excessive, it might be better to tolerate it than risk greater evils through resistance. Mentions public authority, not private individuals.
      *   *Summa Theologiae* (II-II, Q. 42, A. 2): Sedition is a sin. However, a tyrannical regime is not a true regime.
      *   *The Distinction:*
          *   *Tyrant by Title (Usurper):* No legitimate claim. Resistance is often seen as more permissible, sometimes even a duty of the community/public authority.
          *   *Tyrant by Exercise:* Legitimately appointed but rules badly. Aquinas is very cautious here. He generally argues against private individuals killing such a ruler. He prefers public mechanisms (deposition by superior authority, e.g., the Emperor or the Pope, or the community acting as a whole).
      *   *Private/Unilateral Action:* Aquinas explicitly *discourages* private individuals from taking matters into their own hands, especially against a legitimate title-holder. He fears anarchy and greater tyranny.

  3.  **Deconstruct John of Salisbury's Position:**
      *   *Policraticus* (Book VIII): Famous for the "slayer of a tyrant is praiseworthy."
      *   *The Distinction:* Based on the *oath of fealty*.
          *   If you have sworn fealty: You generally cannot kill the tyrant (though John waffles here, suggesting divine judgment might override, but the bond is strong).
          *   If you have *not* sworn fealty (or if the tyrant breaks the bond with God/public good): You are free to kill.
      *   *Private/Unilateral Action:* John is much more open to the idea of the "private" citizen (the *privatus*) acting against the tyrant, provided the tyrant is an enemy of the public good and the killer isn't bound by a specific oath. He frames it as a religious duty (executing God's judgment).
      *   *Nuance:* John's "no oath" condition is tricky. In a feudal society, almost everyone is bound by some chain of oaths. However, theoretically, his framework is more permissive of individual action than Aquinas's institutional approach.

  4.  **Compare the "Licensing" of Private Tyrannicide:**
      *   *Aquinas:* Restricts it heavily. Private killing is sedition. Only public authority can depose. Even then, tolerance is often preferred.
      *   *John of Salisbury:* More permissive *in theory*. If you aren't bound by oath, you can kill. He sanctifies the act.
      *   *Verdict:* John of Salisbury licenses *more* private/unilateral action, despite the oath caveat. Aquinas channels resistance through public/institutional bodies.
      *   *Wait, let's refine the "Oath" distinction:* John says if you *are* bound by oath, you shouldn't do it. But he also says the tyrant is an enemy of God. Does the oath to God supersede the oath to the lord? Yes, implicitly. So John is quite radical. Aquinas is conservative regarding private action.

  5.  **Analyze the "Afterlife" in Early Modern Resistance Theory:**
      *   *Context:* Reformation, Wars of Religion, Monarchomachs, Jesuit Scholastics (Suárez, Mariana), Calvinists (Knox, Buchanan), Locke.
