      *   *John of Salisbury's Legacy:* He is often cited as the *source* of tyrannicide, but his specific framework (oaths) isn't the dominant structural model. However, his *spirit* (tyrant = public enemy) fuels the radical wing.
      *   *The Twist:* The prompt asks whose *framework* had the greater afterlife.
      *   *Argument:* Aquinas's framework (distinction between usurper vs. legitimate, and the requirement of public authority) became the dominant *constitutionalist* model (Monarchomachs, Locke). The idea that private individuals cannot kill legitimate kings is central to early modern social contract theory (to prevent anarchy). John's *Policraticus* was read, but Aquinas's *structural* caution (via the Scholastics) shaped the "Lesser Magistrate" doctrine which dominated mainstream resistance theory (both Catholic and Protestant).
      *   *Counter-Argument:* Mariana (late 16th c.) is very Johannine. But Mariana was controversial. Locke explicitly rejects private execution.
      *   *Refinement:* Actually, the "Usurper vs. Legitimate" distinction (Aquinas) is the one that sticks in Early Modern thought (e.g., the distinction between a king *de facto* and *de jure*, or the right to resist a conqueror vs. a coronated king). John's oath distinction is less structurally relevant in the age of sovereignty.
      *   *Wait, let's look closer at the "Private" aspect.* Early modern theory largely *rejected* private tyrannicide (post-Ravaillac, post-Guy Fawkes). They wanted *public* resistance. Therefore, Aquinas's framework (which restricts private action) is the one that actually won the day in terms of respectable political theory. John's framework was the "dangerous" one that got censored.
      *   *So:* John licenses more private action. Aquinas's framework had the greater afterlife (in terms of influencing legitimate resistance theory like the Lesser Magistrates and Locke).

  6.  **Drafting the Argument:**

      *   **Introduction:** Acknowledge the nuance. State the thesis: John of Salisbury is more permissive of private action; Aquinas is more restrictive but his framework dominates early modern constitutionalism.
      *   **Section 1: The Distinctions.**
          *   Aquinas: Title vs. Exercise. Focus on the *source* of authority. Usurpers have none; legitimate tyrants have authority but misuse it.
          *   John: Oath of Fealty. Focus on the *agent* of resistance. Are they bound personally?
      *   **Section 2: Licensing Private Tyrannicide.**
          *   John: If no oath, go ahead. It's a service to God. This opens the door to the "private citizen."
          *   Aquinas: Private killing is sedition. Even against a tyrant by exercise, it must be public authority. Against a usurper, it's war/defense, not necessarily "tyrannicide" in the same sense.
          *   Conclusion: John licenses more private action.
      *   **Section 3: The Afterlife.**
          *   Early Modern context: Fear of anarchy/regicide (Ravaillac).
          *   Protestant Resistance Theory (Knox, Buchanan, Huguenots): They adopt the "Lesser Magistrate" doctrine. This is Aquinas (public authority), not John (private zeal).
          *   Catholic Scholastics (Suárez): Community authority. Aquinas.
          *   Locke: Executive power of the people, but structured.
          *   Why Aquinas won: Stability. John's model is too volatile for the emerging sovereign state.
      *   **Conclusion:** Summarize. John is the radical spark; Aquinas is the architectural blueprint.

  7.  **Refining the "Afterlife" Argument (Self-Correction/Nuance Check):**
      *   Is it fair to say Aquinas won? The Monarchomachs (*Vindiciae Contra Tyrannos*) blend both. But they emphasize *officers of the kingdom* resisting, not private men. That aligns with Aquinas's *De Regimine*.
