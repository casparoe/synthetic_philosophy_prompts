          *   Style: Philosophy must do real work, not just set dressing. Naturalistic dialogue within a formal setting (rubber chicken dinner).

  2.  **Philosophical Check:**
      *   **Kripke's Modal Argument:** Names are rigid designators (refer to the same object in all possible worlds where that object exists). Descriptions are non-rigid. Therefore, names cannot be synonymous with descriptions.
      *   **Gödel/Schmidt Case:** Suppose Gödel didn't prove the incompleteness theorem, but a man named Schmidt did, and Gödel stole it. When we say "Gödel," do we refer to the man who stole the proof (Gödel) or the man who discovered it (Schmidt)? Descriptivism says Schmidt. Causal theory says Gödel. Intuition says Gödel.
      *   **Two-Dimensionalism (Stalnaker/Chalmers style):** Distinguish two ways of evaluating content.
          *   *Primary Intension:* What a term picks out given how the actual world turns out to be (descriptive-ish, captures cognitive significance).
          *   *Secondary Intension:* What a term picks out given a counterfactual world, holding actual world reference fixed (rigid, Kripkean).
          *   *Iain's Move:* He needs to argue that while Kripke is right about *metaphysical* modality (secondary intension), Frege was right about *epistemic* space (primary intension). "Hesperus is Phosphorus" is necessary a posteriori (secondary), but there's a sense in which it's contingent (primary) that explains why we learned it.

  3.  **Drafting - Scene Setting:**
      *   Setting: Retirement dinner, noisy, cheap wine, rubber chicken.
      *   Atmosphere: Awkward, history lingering beneath the technical argument.
      *   Opening: Break the ice with the philosophy immediately, since that's their language of intimacy/conflict.

  4.  **Drafting - The Dialogue Flow:**
      *   *Start:* Renata brings up the old fight. Maybe referencing the wine or the food to pivot to names/reference.
      *   *Renata's Attack:* Bring up Gödel/Schmidt. It's the classic knockout punch against descriptivism.
      *   *Iain's Defense:* Don't deny Kripke's point about rigidity. Instead, pivot to *why* we care. The cognitive significance. The 2D move: "You're talking about counterfactuals; I'm talking about epistemic possibilities."
      *   *Renata's Counter:* Epistemic possibilities aren't metaphysical possibilities. Don't confuse the map for the territory.
      *   *Iain's Counter:* But the map is all we have to navigate the territory.
      *   *Ending:* Interrupted by the event, leaving the tension unresolved.

