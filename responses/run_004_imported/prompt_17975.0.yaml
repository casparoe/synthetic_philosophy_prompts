answer: |-
  The cabernet tasted like copper pennies, but Renata swirled it anyway, watching the legs slide down the glass. Across the small round table, Iain was attacking his rubber chicken with the grim determination of a man trying to prove something to himself.

  "You still look at names like they're tags," Renata said, her voice low enough to survive the clatter of cutlery but sharp enough to cut through fifteen years of silence. "Just causal hooks hanging on objects."

  Iain paused, fork halfway to his mouth. "And you still think everything else is just psychology. Decorative."

  "Psychology doesn't fix reference, Iain. Imagine the Gödel case. Suppose Schmidt actually proved the incompleteness theorem, and Gödel stole it. We find out tomorrow. Who does 'Gödel' refer to?"

  "The man who stole it," Iain said immediately. "Kurt Gödel."

  "Exactly. Even though 'the prover of incompleteness' picks out Schmidt. So the description isn't synonymous with the name. Descriptivism is dead. You're just haunting the corpse."

  Iain set his fork down. He didn't look angry; he looked tired, the way he used to look after comprehensive exams. "You're conflating metaphysical modality with epistemic space. I'm not defending simple descriptivism. I'm saying there are two dimensions of content."

  "There's only one world," Renata countered. "One set of truth conditions."

  "There's one actual world, yes. But there are two ways to evaluate a statement across possible worlds." Iain leaned in, the familiar intensity sparking between them, overriding the awkwardness. "Take 'Hesperus is Phosphorus.' Secondary intension? Necessary. Rigid designators pick out Venus in every counterfactual world. You win. But primary intension? That's about how we identify the referent given how the actual world turns out. In an epistemic scenario where the evening star isn't the morning star, the statement fails."

  "That's not possibility," Renata said, waving her wine glass. "That's ignorance. You're confusing how we *know* the reference with what the reference *is*. The primary intension is just a heuristic. It's not semantic content."

  "It explains cognitive significance," Iain pressed. "Why is 'Hesperus is Phosphorus' informative? If it's just necessary identity, learning it should be trivial. It's not. It tells us something about the world. Your rigid designators freeze the reference but leave the meaning hollow. You have the metaphysics right, but you've lost the agent."

  "I haven't lost the agent. I've just stopped pretending their misconceptions determine reality." Renata's eyes locked onto his. "You want to save Fregean sense without admitting it's descriptivism. But if your primary intension varies across epistemic scenarios, it's contingent. And if it's contingent, it's not what we mean when we say 'Necessarily, Hesperus is Phosphorus.'"

  "We mean it's necessary given the actual world fixed," Iain said. "But the *way* it's fixed matters. You treat the causal chain as a black box. I'm opening it."

  "And finding nothing but more descriptions."

  "Finding the connection between the mind and the modal reality." Iain reached for his water, his hand steady despite the rise in his voice. "You think rigidity solves everything. But it doesn't explain why we argue. If reference is just a causal hook, we're just barking at the same tree from different sides. Two-dimensionalism explains why we're barking differently."

  "Because one of us is wrong about the semantics," Renata said.

  "Or because one dimension isn't enough to capture the dispute."

  The room suddenly erupted in applause. The department chair was standing, tapping a spoon against a water glass, signaling the speeches were about to begin. The spell broke. Iain sat back, picking up his fork. Renata took a long drink of the copper wine, the argument hanging between them, unresolved and heavy as lead.

  "Still wrong," she murmured.

  "Still listening," he replied, without looking up.
