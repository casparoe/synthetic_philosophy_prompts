      *   *Address the "Tension":* Why is the professor insisting on this? Because Aquinas is balancing Natural Law (defend the common good) with Divine/Positive Law (Romans 13, do not kill authority). He never fully resolves the "who decides" problem cleanly for private individuals.
      *   *Conclusion:* It's not straightforward. It's a nuanced development from radical permission to cautious restraint.

