answer: |-
  You are hitting on one of the classic debates in Thomistic political theory, so don't feel bad—your reading isn't "wrong," but it is incomplete. Your professor is pushing you because the shift from the *Commentary on the Sentences* to *De Regno* represents a significant maturation (and caution) in Aquinas's thought.

  If you turn in an essay arguing that Aquinas endorses private citizens assassinating modern dictators, you will likely get marked down. Here is the nuance you are missing, broken down into three key areas: the distinction of tyranny, the agent of removal, and the specific retreat in *De Regno*.

  ### 1. The Crucial Distinction: Usurper vs. Legitimate Tyrant
  You are conflating two different types of tyrants. Aquinas distinguishes between:
  *   **Tyrant by Defect of Title (*tyrannus ex defectu tituli*):** A usurper who seizes power by force with no legitimate claim.
  *   **Tyrant by Exercise (*tyrannus ex parte exercitii*):** A ruler with a legitimate title who rules unjustly.

  **In the *Sentences* (II Sent., d. 44, q. 2, a. 2):**
  Aquinas is indeed quite radical here. He argues that regarding the **usurper**, there is no bond of fidelity. Since the usurper is essentially an aggressor against the commonwealth, killing him is not sedition; it is meritorious defense of the community. He even cites the Old Testament example of Ehud killing Eglon.

  **However,** even here, he implies this is permissible when there is *no superior* to appeal to. But notice the agent: he speaks generally of the "multitude" or those acting for the common good, not necessarily a lone vigilante.

  **In *De Regno* (Book 1, Chapter 6):**
  This is where your professor sees the tension. When discussing a **legitimate ruler who becomes tyrannical**, Aquinas explicitly **forbids** private assassination. He argues that private individuals do not have the authority to execute judgment on a public superior. To do so is sedition. He worries that if private citizens take this into their own hands, they expose the community to greater danger (failed plots lead to harsher repression) and the assassin may become a tyrant themselves.

  ### 2. Private Citizen vs. Public Authority
  This is the biggest flaw in the July 20 Plot analogy.

  The July 20 Plot was not carried out by "private citizens" in the Thomistic sense. It was carried out by high-ranking military officers and state officials (Stauffenberg, Beck, etc.). In Aquinas's framework, they were acting (in their own minds) as agents of **public authority** to remove a leader who had violated the fundamental law of the realm.

  Aquinas is a hierarchical thinker. He believes judgment belongs to the *publica auctoritas*.
  *   **Private Citizen:** Generally cannot kill a tyrant. If the tyrant is a usurper, defense is allowed, but Aquinas prefers this be done by the community collectively or by a superior authority.
  *   **Public Official:** Aquinas is more open to the idea that if a ruler violates the terms of their office, the *community* or its representatives (the "public person") can depose them.

  So, if you ask Aquinas about a random citizen shooting a dictator today, he would likely say **no** (unless in immediate self-defense against an active attack). If you ask him about the military or parliament removing a usurper, he is more amenable.

  ### 3. Why *De Regno* "Walks It Back"
  Your professor is right that *De Regno* is more cautious. There are three reasons for this, which constitute the "tension":

  1.  **The Risk of Greater Evil:** In *De Regno* I.6, Aquinas argues that attempting to kill a tyrant often makes things worse. If the plot fails, the tyrant becomes more paranoid and cruel. If it succeeds, the power vacuum often leads to civil war or a new, worse tyrant (he cites the assassination of Julius Caesar as a warning).
  2.  **Theological Consistency:** Aquinas has to balance Natural Law (defend the common good) with Divine Law (Romans 13: "Let every person be subject to the governing authorities"). In the *Sentences*, he leans Natural Law. In *De Regno*, written for a King (Hugh II of Cyprus), he has to be more politically prudent and emphasize order.
  3.  **Institutional Solutions over Violence:** In *De Regno*, Aquinas spends more time arguing that the best way to avoid tyranny is **preventative**: limit the king's power constitutionally, make the monarchy elective rather than hereditary, and ensure the king is accountable to the law. He prefers preventing the tyranny over curing it with blood.

  ### Summary for your Seminar
  You aren't missing the text, but you are missing the **development** and the **juridical categories**.

  *   **Your take:** Aquinas = Tyrannicide is okay for usurpers.
  *   **Professor's take:** Aquinas = Tyrannicide is theoretically possible for usurpers *only if* no public authority can act, but it is dangerous, discouraged, and strictly forbidden against legitimate rulers.

  **The Verdict:** Aquinas would **not** endorse a private citizen assassinating a dictator today. He might endorse a constitutional removal by the military or parliament (public authority), provided the ruler was a usurper or had fundamentally violated the divine/natural law to the point of losing legitimacy. But even then, *De Regno* warns that the cure might be worse than the disease.

  The "tension" your professor loves is that Aquinas never fully solves the "Who decides?" problem. He says private citizens can't decide, but if the public authority is the tyrant, who acts? He leaves that somewhat unresolved, preferring to focus on how to structure the kingdom so it doesn't happen in the first place.
