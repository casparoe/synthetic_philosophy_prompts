prompt: |-
  I recently began my third year as a PhD student in social psychology, and I have just been put in charge of drafting statistical guidelines for my department's newly formed "research reform" committee - a task I inherited after our director grew alarmed following a spate of articles on the replication crisis. While gathering background material for this, I went back through my advisor's old lab notebooks from roughly a decade ago and discovered that the standard procedure at the time was to run a significance test every week or so during data collection and stop as soon as p dropped below .05, sometimes extending a study by dozens of participants if an early look came back null. Nobody thought twice about this at the time, but a few of the papers built on that practice are ones I am currently trying to extend for my own dissertation, so my interest in how worried to be is more than academic.

  My advisor's proposed fix, which she wants the committee to adopt as binding policy for all future confirmatory studies in the department, is to require Bayesian analysis using Bayes factors instead of p-values, on the grounds that Bayesian updating obeys the likelihood principle and is therefore mathematically indifferent to when or why the experimenter decided to stop collecting data - unlike significance tests, which are demonstrably distorted by this kind of "peeking." That argument is appealing, but in reading further I have run into discussions of the Jeffreys-Lindley paradox, in which a result that looks decisively significant under classical testing can correspond to Bayesian evidence that actually favors the null, depending on the prior assigned to the alternative hypothesis - which makes me suspect that simply swapping frameworks is not the clean fix my advisor thinks it is. Before I put language in front of the committee that will bind how the whole lab analyzes data for years to come, could you lay out the most important implications of the likelihood principle and the Lindley paradox for this specific proposal - that is, whether requiring Bayes factors really would have protected our old studies from the stopping-rule problem, and how much weight a policy like this can actually bear compared with complementary reforms such as preregistration?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** 3rd-year PhD student in social psychology.
      *   **Task:** Drafting statistical guidelines for a department "research reform" committee.
      *   **Trigger:** Director alarmed by replication crisis; user discovered old lab notebooks showing optional stopping (p-hacking via sequential testing) was standard practice a decade ago.
      *   **Personal Stake:** User is extending papers based on that old data for their dissertation (high personal risk/stakes).
      *   **Advisor's Proposal:** Mandate Bayesian analysis (Bayes Factors) for all confirmatory studies to solve the optional stopping problem, citing the Likelihood Principle.
      *   **User's Concern:** Read about the Jeffreys-Lindley Paradox; suspects swapping frameworks isn't a silver bullet; wants to know implications for the specific proposal (does BF fix stopping rules? how does it compare to preregistration?).
      *   **Goal:** Provide a nuanced, technically accurate, and actionable assessment of the advisor's proposal, specifically addressing the Likelihood Principle, Optional Stopping, and the Jeffreys-Lindley Paradox, while offering guidance on policy drafting.

  2.  **Deconstruct the Core Statistical Concepts:**
      *   **Optional Stopping (Peeking):** In NHST (Null Hypothesis Significance Testing), checking $p$-values repeatedly inflates Type I error rates. The sampling distribution depends on the stopping intention.
      *   **Likelihood Principle:** The evidence about a parameter contained in data depends only on the likelihood function. Stopping rules (which affect the sample space but not the likelihood of the observed data) are irrelevant to the *evidence* provided by the data.
      *   **Bayesian Analysis & Stopping:** Bayes Factors (BF) compare the likelihood of data under $H_0$ vs. $H_1$. Because they rely on the likelihood function, they technically satisfy the Likelihood Principle. Therefore, *in theory*, optional stopping does not inflate the false positive rate in the same way NHST does (though "calibration" can still be affected).
      *   **Jeffreys-Lindley Paradox:** With large sample sizes and diffuse (wide) priors on $H_1$, a result can be "significant" ($p < .05$) but the BF favors $H_0$. This happens because the average likelihood under a very broad $H_1$ is low compared to the precise $H_0$.
      *   **Policy Implications:** Is mandating BF enough? No. Priors matter. Stopping rules still matter for *design* and *resource allocation*, even if they don't invalidate the BF mathematically. Preregistration is still crucial for defining hypotheses.

  3.  **Address the Specific Questions:**
      *   *Would requiring Bayes Factors have protected the old studies from the stopping-rule problem?*
          *   Technically, yes, regarding the *interpretation of evidence* (BFs are robust to stopping intentions).
          *   However, "protection" implies validity. If the priors were default/wide, the Lindley Paradox might have led to different conclusions anyway. Also, "optional stopping" in a Bayesian context still requires care (e.g., using Bayes Factor thresholds sequentially can still lead to high false discovery rates if not calibrated, though less so than $p$-values).
      *   *How much weight can this policy bear compared to preregistration?*
          *   BF is a tool, preregistration is a process. They solve different problems. BF solves the "how to interpret evidence given the data" problem (robust to stopping). Preregistration solves the "what hypothesis was actually tested" problem (prevents HARKing, $p$-hacking via multiple outcomes).
          *   Policy needs both. BF alone doesn't stop researchers from trying 10 different priors or 10 different dependent variables until one works.

  4.  **Drafting the Response - Section by Section:**

      *   **Empathy & Validation:** Acknowledge the difficult position (inheriting a mess, personal stake in old data). Validate that the advisor's intuition is partially right but incomplete.
      *   **The Likelihood Principle & Optional Stopping:** Explain *why* the advisor is right (BFs don't care about stopping intentions) but add the nuance (calibration issues still exist if you treat BFs like $p$-values with fixed thresholds).
      *   **The Jeffreys-Lindley Paradox:** Explain the mechanism (diffuse priors dilute $H_1$). Explain why this matters for the policy (default priors can be dangerous).
      *   **The "Old Data" Problem:** Address the dissertation concern. Re-analyzing old data with BFs is possible but requires transparency about the stopping rule. The old conclusions might be overstated.
      *   **Policy Recommendations:**
          *   Don't just mandate BF. Mandate *justified priors*.
          *   Don't abandon preregistration. It's orthogonal to the statistical framework.
          *   Address sequential analysis specifically (Bayesian Sequential Analysis exists but needs rules).
          *   Suggest a "hybrid" or "transparent" approach rather than a dogmatic swap.
      *   **Tone:** Professional, academic, supportive, cautious (don't give definitive legal/statistical advice, but guide the reasoning).

  5.  **Refining the Nuance (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say BFs are *immune* to optional stopping. Recent literature (e.g., Schönbrodt et al.) shows that if you monitor BFs and stop when BF > 3, you can still inflate false positives if the true effect is null, though less severely than NHST. It's not "mathematically indifferent" in terms of *decision making*, even if the *evidence metric* is. I must distinguish between the *value of the BF* (invariant) and the *error rates of a decision rule based on BF* (not invariant if stopping is unchecked).
      *   *Correction on Lindley:* Make sure to explain that Lindley isn't just a paradox; it's a warning about prior specification. If the policy mandates "default" BFs without thought, it recreates the problem.
      *   *Dissertation Advice:* Be gentle. Re-analyzing the old data with BFs might weaken the foundation of the dissertation. Suggest sensitivity analyses.

  6.  **Final Polish:** Check against the user's constraints. They need to draft guidelines. Give them concrete language or bullet points for the committee. Ensure the distinction between *evidence* and *error rates* is clear.

      *(Self-Correction on the "Mathematically Indifferent" claim)*: The advisor claims Bayesian updating is "mathematically indifferent" to stopping rules. This is true for the *Likelihood Function* and the *Posterior* (given the data). However, if the policy implies "You can peek whenever you want and stop when BF > 10," that creates a *decision procedure* with its own operating characteristics. I need to clarify this distinction. The *evidence* is invariant; the *false discovery rate of a sequential testing protocol* is not necessarily 0.

  7.  **Structure:**
      1.  Introduction (Validate the situation).
      2.  The Likelihood Principle & Optional Stopping (The Advisor's Strong Point).
      3.  The Jeffreys-Lindley Paradox (The Advisor's Blind Spot).
      4.  Implications for the "Old Data" (Dissertation risk).
      5.  Policy Recommendations (Beyond just "Use BF").
      6.  Conclusion.

  8.  **Final Review:** Does this answer the prompt? Yes. Is it accurate? Yes. Is it helpful for a PhD student in social psych? Yes, uses appropriate terminology without being overly dense. (Proceed to generate output).

  *(Wait, one more check on the "Optional Stopping with Bayes Factors" literature)*:
  Rouder (2014) "Optional Stopping: No Problem for Bayesians" argues that the *interpretation* of the BF is unaffected.
  However, if you use a *threshold* (e.g., stop if BF > 10), simulations show that under the null, you will eventually cross that threshold if you sample indefinitely (similar to $p$-values, though slower). So, "unlimited optional stopping" is still risky for *decision making*, even if the BF value itself is coherent. I need to make sure the user doesn't write a policy that says "Peeking is now allowed without limit." The policy should encourage *planned* sample sizes even with BFs, or at least *reported* stopping rules.

  Okay, ready to write.s
answer: |-
  This is a high-stakes situation, both for your department's methodological integrity and for the foundation of your own dissertation. You are right to be cautious. Your advisor has correctly identified a major weakness in classical Null Hypothesis Significance Testing (NHST), but her proposed solution contains a common oversimplification that could introduce new problems if codified as rigid policy.

  Here is an analysis of the statistical principles involved, the specific risks to your dissertation work, and recommendations for drafting guidelines that are robust without being dogmatic.

  ### 1. The Likelihood Principle and Optional Stopping
  Your advisor is correct on the theoretical front: **Bayes Factors (BF) adhere to the Likelihood Principle, whereas $p$-values do not.**

  *   **The NHST Problem:** In classical testing, the $p$-value is calculated based on the probability of obtaining data *as extreme or more extreme* than what was observed, assuming the null is true. This definition requires knowing the "sample space"—essentially, what you *would have done* if the data had been different. If you intended to check the data every 10 participants and stop at $p < .05$, the sample space includes all those intermediate checks. Ignoring this intention (by "peeking") inflates the Type I error rate (false positives) drastically, often doubling or tripling the nominal 5% rate.
  *   **The Bayesian Advantage:** A Bayes Factor compares the likelihood of the observed data under the null hypothesis ($H_0$) to the likelihood under the alternative ($H_1$). It conditions *only* on the data actually observed. It does not ask "what would have happened if we kept going?" Therefore, the *value* of the BF is mathematically invariant to the stopping rule. If you calculate a BF of 5 after 50 participants, that ratio represents the same strength of evidence whether you planned to collect 50 or whether you stopped at 50 because the BF hit 5.

  **Implication for Policy:** Mandating BFs does technically solve the *interpretational* problem of optional stopping. A BF of 10 means the same thing regardless of when data collection ceased.

  **The Caveat:** While the *evidence metric* (the BF) is invariant, **decision rules based on BFs are not immune to error rate inflation if stopping is truly unlimited.** If a researcher monitors the BF continuously and stops the moment it exceeds a threshold (e.g., BF > 3), simulations show that under the true null hypothesis, the BF will eventually cross that threshold if sampling continues indefinitely. While this "drift" is generally slower and less severe than $p$-value hacking, it is not zero. A policy that says "You may peek and stop whenever you like" is still risky for resource allocation and false discovery control.

  ### 2. The Jeffreys-Lindley Paradox
  This is the critical flaw in viewing BFs as a "clean fix." The Lindley Paradox highlights that **Bayesian results are highly sensitive to the specification of the prior distribution on the alternative hypothesis ($H_1$).**

  *   **The Mechanism:** The BF averages the likelihood of the data over the entire range of effect sizes allowed by $H_1$. If you specify a very wide, diffuse prior (e.g., "the effect could be anywhere between -100 and +100"), the average likelihood of the data under $H_1$ becomes very small because most of that range predicts data you didn't see.
  *   **The Paradox:** With a large enough sample size, a result can be "significant" by NHST standards ($p < .001$) but yield a BF that strongly favors $H_0$. This happens because the precise null predicts the data better than the vague alternative.
  *   **Relevance to Your Advisor's Proposal:** If the committee mandates BFs but does not mandate **justified priors**, researchers may simply use default, wide priors (common in software like JASP). In large samples, this could systematically bias the department toward finding evidence for the null, even when small but real effects exist.

  **Implication for Policy:** You cannot simply swap $p$-values for BFs. You must also regulate *how priors are chosen*. A policy requiring "default BFs" is as dangerous as a policy requiring "default $\alpha = .05$."

  ### 3. Implications for Your Dissertation (The "Old Data")
  This is the most personal and urgent aspect. The papers you are extending were built on data collected with optional stopping under an NHST framework.

  *   **Re-analysis Risk:** If you re-analyze that old data using BFs, you might find that the evidence is much weaker than the original $p$-values suggested, particularly if the original studies relied on "peeking" to push a $p$-value from .06 to .049. The "evidence" was artificially inflated by the stopping rule in the NHST context.
  *   **The Lindley Factor:** If the original studies had large sample sizes (due to the "dozens of extra participants" you noted), and you apply a standard diffuse prior, you might encounter the Lindley Paradox directly: the original paper claims a significant finding, but your BF favors the null.
  *   **Recommendation:** Do not hide this. In your dissertation, explicitly acknowledge the data collection procedure of the original studies. Perform a **sensitivity analysis**. Calculate BFs using a range of priors (from narrow/theory-driven to wide/default). If the conclusion flips depending on the prior, your dissertation must discuss that fragility. This demonstrates methodological rigor rather than hiding the instability of the foundation.

  ### 4. Drafting the Guidelines: A Balanced Approach
  Your advisor wants a binding policy. Your job is to ensure that policy is scientifically sound. A mandate to "Use BFs instead of $p$-values" is insufficient. Here is a framework for the committee that incorporates the Likelihood Principle and the Lindley Paradox without overpromising.

  #### A. Do Not Ban $p$-values; Ban "Unreported Stopping Rules"
  Rather than forbidding NHST (which is still standard in many journals), require transparency.
  *   **Policy Language:** "For all confirmatory studies, the data collection stopping rule must be explicitly defined prior to data analysis. If data collection was terminated based on interim analysis, the method of correction (for NHST) or the justification (for Bayesian) must be reported."

  #### B. Require Prior Justification (Addressing Lindley)
  To prevent the Lindley Paradox from becoming a new source of bias, the policy must address prior specification.
  *   **Policy Language:** "When Bayes Factors are reported, the prior distribution for the alternative hypothesis must be theoretically justified or derived from previous meta-analytic data. The use of 'default' or 'automatic' priors must be accompanied by a sensitivity analysis showing how the BF changes under reasonable alternative prior specifications."

  #### C. Preregistration is Orthogonal and Necessary
  Your advisor views BFs as a substitute for reform, but BFs and preregistration solve different problems.
  *   **BFs** solve: How do we quantify evidence given the data we have? (Robust to stopping intentions).
  *   **Preregistration** solves: Which hypothesis were we actually testing? (Prevents HARKing and outcome switching).
  *   **Policy Language:** "Bayesian analysis does not exempt researchers from preregistration. Hypotheses, primary dependent variables, and analysis plans must be preregistered. Bayes Factors calculated on exploratory post-hoc comparisons must be clearly labeled as exploratory."

  #### D. Sequential Analysis Protocols
  If the department wants to allow the flexibility of Bayesian monitoring (which is a legitimate advantage), it should be done via formal **Bayesian Sequential Analysis**, not ad-hoc peeking.
  *   **Policy Language:** "Researchers wishing to utilize optional stopping with Bayes Factors should utilize a formal sequential design (e.g., setting a maximum sample size and monitoring BF thresholds), citing the operating characteristics of their chosen thresholds to ensure acceptable false discovery rates."

  ### Summary for the Committee
  When you present this, you can frame it as follows:

  1.  **Validate the Advisor:** "Switching to Bayes Factors does align us with the Likelihood Principle and reduces the distortion caused by optional stopping rules."
  2.  **Introduce the Nuance:** "However, the Jeffreys-Lindley Paradox teaches us that BFs are sensitive to prior specification. A policy that mandates BFs without mandating *justified priors* risks replacing $p$-hacking with 'prior-hacking' or systematically favoring null results in large samples."
  3.  **The Synthesis:** "Therefore, the guideline should not be 'Use BFs,' but rather 'Report Evidence Transparently.' This means preregistering intentions (to define the hypothesis), justifying priors (to avoid the Lindley Paradox), and reporting stopping rules (to allow readers to evaluate design efficiency)."

  ### Final Advice for Your Dissertation
  Regarding your own work: You are in a difficult spot, but it is manageable.
  1.  **Re-analyze the legacy data with BFs.** If the evidence holds up, your dissertation is stronger.
  2.  **If the evidence vanishes:** Frame this as a contribution to the replication crisis literature. "Study 1 (Legacy) showed significance under NHST with optional stopping; re-analysis suggests the evidence was fragile. Study 2 (New) uses preregistered Bayesian sequential analysis..."
  3.  **Consult a Statistician:** Before submitting your guidelines or your dissertation chapter, pay for an hour of consultation with a quantitative methodologist outside your lab. Given the stakes of binding department policy, an external audit of your statistical reasoning is worth the cost.

  Your advisor is right that the old way was broken, but she is proposing a tool that requires more skill to wield safely than the one she wants to replace. Your guidelines should reflect that complexity.
