          *   *Refinement:* It challenges the *application* to non-ideal agents. Is it a counterexample to the *theorem*? No. Is it a counterexample to the *slogan* as a normative guide? Yes, for non-ideal agents.

      *   **Case 2: Newcomb-style setups (State-Act Entanglement).**
