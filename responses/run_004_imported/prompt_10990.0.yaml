      *   **Case 1: Uncertainty about updating rule.**
          *   *Description:* Agent knows she *should* conditionalize but isn't sure she *will*.
          *   *Implication:* Good's theorem assumes the agent *will* update via conditionalization. If the agent suspects she might update irrationally (e.g., bias, weakness of will), the expected value of information might be negative.
