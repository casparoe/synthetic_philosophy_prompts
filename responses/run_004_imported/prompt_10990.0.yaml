          *   *Damage Level:* High. This is a fundamental structural limitation. However, most decision theorists distinguish between "evidence about the world" and "evidence that changes the world." Good's theorem is typically framed within Causal Decision Theory or assumes the observation is non-intrusive. If the observation *changes* the state, it's not cost-free in the relevant sense.
          *   *Refinement:* This violates the "cost-free" or "non-intrusive" assumption. It's a category error regarding what counts as "mere evidence."

      *   **Case 3: Maxmin-EU and Dilation.**
          *   *Description:* Imprecise probabilities (sets of credences). Receiving info makes the set wider (dilation), lowering the maxmin expected utility.
