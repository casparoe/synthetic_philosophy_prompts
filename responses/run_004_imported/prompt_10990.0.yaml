  2.  **Analyze Good's Theorem (1967):**
      *   **Core Claim:** For a Bayesian agent maximizing expected utility, the expected utility of making a decision *after* observing free evidence is always at least as high as the expected utility of making the decision *without* that evidence.
      *   **Key Assumptions:**
          1.  Standard Bayesian Conditionalization (updating via Bayes' rule).
          2.  Expected Utility Maximization (linearity, precise probabilities).
          3.  Dynamic Consistency (the future self does what the current self plans).
          4.  The evidence doesn't causally affect the state of the world (no Newcomb-like causality).
          5.  The information is cost-free.
          6.  Standard probability axioms (countable additivity, proper priors).
      *   **The "Slogan":** "Never decline free, relevant information."

