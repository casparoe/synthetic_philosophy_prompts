answer: |-
  The map on the table was creased from being folded and unfolded too many times, marking the route to the Threshold. Imke was in the other room, packing. Corvin traced the line of the river with a dull fingernail. Sella was sharpening a knife, the *shhk-shhk* sound keeping time with the argument.

  "She's trying to make a spreadsheet, Corvin," Sella said, not looking up from the blade. "I heard her asking about survival rates versus cognitive retention stats. She's trying to weigh it."

  "Because she thinks she can," Corvin said. "She thinks 'Imke-after' is a variable she can solve for. She isn't."

  "Everyone solves for variables they can't see. Farmers plant seeds in weather they can't predict. Soldiers walk into fog."

  "This isn't fog. Fog is just obscured data. This is a different language." Corvin pushed the map away. "Standard decision theory requires you to assign a value to the outcome. But the Crossing is a personal transformation, not just an epistemic one. It's not that she doesn't know what it *feels* like to be Crossed. It's that she doesn't know what the Crossed Imke will *want*."

  Sella tested the edge of the knife with her thumb. "So you're saying she's incapable of rational choice?"

  "I'm saying the rational choice engine requires a stable self to do the weighing. If the act of choosing destroys the weigher, the calculation is void. If she goes through, the entity that emerges might value survival over memory, or oblivion over pain. We don't know. So telling her to calculate the 'expected value' of her life is nonsense. There's no common currency between Pre-Imke and Post-Imke."

  "That's a convenient way to say 'it's a leap of faith' without admitting you're being religious about it," Sella snapped. She finally looked at him. "You're dressing up mysticism as decision theory. Just because the data is incomplete doesn't mean the reasoning stops."

  "It's not incomplete data, Sella. It's structurally inaccessible. L.A. Paul's point isn't that we lack information. It's that the information *doesn't exist yet*. You can't interview the Crossed. They don't remember being Uncrossed well enough to compare. They can't say 'it was worth it.' They just say 'it is.' That's not testimony. That's a different species talking."

  "Then we use proxies," Sella said, resuming the sharpening. *Shhk. Shhk.* "We look at what Imke values *now*. She values continuity. She values her history. She values staying alive to finish her work. If the Crossing threatens those things, she has a rational reason to hesitate. If it secures them, she has a rational reason to go. That's reasoning."

  "But that reasoning is only valid if Post-Imke cares about those things!" Corvin leaned forward. "That's the trap. If the Crossing rewires her so that 'finishing her work' feels like a childish game, then Pre-Imke died. Even if her heart keeps beating. If she decides based on her current values, she's betting on a future self that might not honor that bet. That's not rationality. That's suicide with extra steps."

  "So what? She should just... what? Close her eyes and pick based on whether she feels adventurous?" Sella set the knife down hard. "That's your alternative? Treat it like a bungee jump?"

  "No. Treat it like a revelation. Don't ask 'what do I gain?' Ask 'do I want to find out who I become?' You can't maximize utility here. You can only choose whether to authorize the transformation. That's a different mode of decision. It's not about outcome optimization. It's about authorship."

  "Authorship?" Sella laughed, a short, sharp sound. "There's no authorship if the pen changes hands in the middle of the sentence. Look, I get the philosophical elegance of your position. It's clean. It says 'the problem is unsolvable, so stop trying to solve it.' But Imke isn't living in a philosophy paper. She's living in a body that's failing. She needs to act."

  "Acting without a rational framework is just thrashing."

  "Acting on the best available evidence *is* the rational framework!" Sella stood up, pacing the small room. "We have testimony. Yes, they can't compare, but they report coherence. They report agency. They don't come out lobotomized. They come out *different*. Imke can reason that 'different' is preferable to 'dead.' That is a value judgment she is qualified to make *now*, regardless of what Future-Imke thinks."

  "Is she qualified?" Corvin asked softly. "If I decide to become a vampire because I value sunlight, I've made a category error. I won't have sunlight anymore. If Imke decides to Cross because she values her memories, she's making a category error. She won't have those memories anymore. She's using a map of the north to navigate the south."

  "Then she updates the map!" Sella stopped pacing. "She acknowledges the loss. She says, 'I value my memories enough to mourn them, but I value my existence enough to lose them.' That's a coherent preference. It's tragic, but it's rational. You're insisting that because she can't know the *texture* of the future, she can't judge the *shape* of it. That's false."

  "The shape changes the judge, Sella!" Corvin's voice rose, just for a moment. "That's the distinction. In every other risk—war, farming, marriage—the person who faces the consequence is the same person who made the choice. Here, the choice annihilates the chooser. If you can't trust the future self to validate the choice, the choice has no logical ground. It's groundless. So stop pretending there's ground."

  Sella picked up the knife again. She looked at her reflection in the steel, distorted and narrow.

  "If there's no ground," she said quietly, "then your advice to 'authorize the transformation' is just as groundless as my advice to 'weigh the values.' You say don't calculate. I say calculate what you can. Both of us are asking her to step into the dark. The only difference is I'm honest enough to admit we're using a flashlight, even if the batteries are dying. You want her to turn the light off and call it enlightenment."

  "I want her to stop pretending the light shows her the bottom of the cliff."

  "And I want her to stop pretending the cliff isn't there just because she can't see the bottom." Sella sheathed the knife. "She's going to decide, Corvin. She's not going to wait for us to solve the metaphysics of identity. So the question isn't whether the decision is theoretically perfect. It's whether we help her make it with her eyes open, or tell her her eyes don't work."

  Corvin looked at the map, at the river line that ended in a blank space labeled *Threshold*.

  "If I tell her she can calculate it," Corvin said, "I'm lying to her about the cost."

  "If I tell her she can't," Sella replied, "I'm lying to her about her agency."

  They stood in the silence of the room, the argument suspended, unresolved, waiting for Imke to walk through the door and tell them which lie she needed to survive.
