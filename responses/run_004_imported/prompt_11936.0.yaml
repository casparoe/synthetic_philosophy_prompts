answer: |-
  The ice in Odile's glass had melted down to a single, bruised cube. Across the low table between them, the longlist sat in two uneven stacks, the spines of the hardbacks cracked, the manuscripts dog-eared and swollen with sticky notes. It was nearly one in the morning. The hotel bar was empty save for a bartender polishing glasses with a rag that looked dirtier than the glasses.

  Odile tapped her fingernail against the rim of her tumbler.

  " *The Cartographer's Wife* and *North of the Meridian*," Odile said. Her voice was level, devoid of shame. "I haven't read them."

  Priya, who had been rubbing her temples, stopped. She looked at the two books, then back at Odile. "You haven't started them?"

  "I haven't opened them."

  "Odile. We vote on the shortlist in forty-eight hours."

  "I know when we vote." Odile took a sip of the watery bourbon. "But I know what they are. I know where they sit."

  "That sounds like a riddle. It's not a riddle. It's a dereliction of duty."

  "It's triage, Priya. Twelve books. Six hundred pages each, on average. That is seven thousand two hundred pages. We have three weeks between longlist and shortlist. I have a department to run, two graduate students threatening to quit, and a marriage that is currently being conducted entirely via Post-it notes on the refrigerator. I did the math. I could give those two books the skim they deserve, or I could give the other ten the attention *they* deserve."

  "So you skimmed them?"

  "No." Odile leaned forward. "I called Elias. You know Elias Thorne?"

  "The critic? Yes."

  "He read them. He read them the week they came out. He read them again when the longlist was announced. He and I have argued over prose for twenty years. I know the architecture of his taste better than I know the floor plan of this hotel. He told me: *'Odile, these are the real thing. They are not flukes. They are not trends. They are enduring.'* So I am ranking them based on his verdict."

  Priya stared at her. The silence stretched out, filled only by the clink of the bartender's rag.

  "You're joking," Priya said finally.

  "I am entirely in good conscience."

  "It's not conscience if it's secondhand." Priya sat up straighter, the exhaustion momentarily burned off by indignation. "You can't inherit an aesthetic judgment. That's not how it works. If Elias told you the protagonist is a schoolteacher, you could inherit that. That's a fact. If he told you the book was published in 2023, you could inherit that. But *good*? *Enduring*? That's not data. That's a verdict."

  "It's a verdict I trust."

  "It's not *your* verdict."

  "Does it matter whose hand holds the pen if the signature is valid?" Odile asked. "Priya, look at the function of this prize. What are we here to do? Are we here to have a personal spiritual experience with twelve distinct objects? Or are we here to identify the best books of the year for the public?"

  "Both. You can't have one without the other."

  "Why not? If Elias says a bridge is safe to cross, I cross it. I don't need to test the tensile strength of the steel myself. I trust the engineer."

  "Because safety is objective. You can measure it." Priya reached for her water. "Aesthetic value isn't in the book, Odile. It's not like the steel. It happens *between* the book and the reader. It's an event. If you weren't there for the event, you didn't experience the value. You're ranking books based on a ghost story."

  Odile sighed, rubbing her eyes. "This is the Acquaintance Principle. Kant, Hume, everyone since. You have to see the thing to judge the thing."

  "Yes."

  "But we violate it constantly. We trust our teachers. We trust our editors. If a mentor tells a young philosopher, *'This argument is fallacious,'* the student accepts it. They don't re-derive the logic from scratch every time. They trust the expertise."

  "That's logic. That's truth-conditional."

  "Is it?" Odile's eyes sharpened. "What about morality? If I tell you, *'What that corporation is doing to the watershed is unjust,'* do you need to go measure the toxins yourself? Do you need to interview the locals? Or can you, in good conscience, adopt my moral judgment and sign the petition?"

  Priya paused. She looked down at her hands. "That's different."

  "Is it? Or is it just that we're more comfortable outsourcing our ethics than our taste?"

  "If I sign your petition based on your word," Priya said slowly, "I am trusting your *character*. I am trusting that you are a good person who recognizes injustice. But if I win this prize, if I put my name on a winner... I am staking my own character on the book's quality. I can't outsource my integrity, Odile. That's the point."

  "But the book *is* good. Elias isn't lying. He's not mistaken. If the book wins, and it turns out to be a masterpiece, does the mechanism of my arriving at that conclusion hurt the book?"

  "It hurts the *process*."

  "The process is a machine, Priya. It's creaky. It's flawed. It's run by people with jobs and children and failing eyesight." Odile gestured to the stacks. "We are not high priests. We are filters."

  "We're judges," Priya corrected. "A judge who doesn't hear the testimony is a fraud. Even if the defendant is guilty."

  "Ah." Odile smiled, a thin, tired expression. "So you think there's a disanalogy with moral testimony, then. In morality, we accept that we can learn from others. We accept moral testimony. But in art, you think we must be solitary monks."

  "I think aesthetic judgment requires a sensitivity that can't be transmitted via language. Elias can tell you *that* he liked it. He can tell you *why* he liked it. He can quote the sentences. But he can't transfer the *feeling*. And the feeling is the only thing that matters."

  "The feeling is subjective."

  "The feeling is the evidence!" Priya's voice rose, then she caught the bartender's eye and lowered it. "Look. If you ask me if this whiskey is good, and I say yes, and you drink it and hate it... you haven't just learned that I have different taste. You've learned that my judgment was useless to *you*. But if I'm judging for the prize, I'm not judging for me. I'm judging for the record."

  "And if the record is correct?"

  "Then it's a correct record of Elias's reading, not yours." Priya leaned in. "Here's the worry, Odile. And tell me if I'm wrong. If you allow this, if we accept aesthetic testimony... then the prize becomes a closed loop. The people who get picked are the ones the Elias Thornes of the world already like. It reinforces the canon. It stops new things from breaking through unless they break through to the critics first."

  Odile was quiet for a long moment. She turned her glass on the coaster.

  "That," Odile said softly, "is a much better argument than the one about monks and feelings."

  "It's not about feelings. It's about the source of the value."

  "I know what you're saying." Odile looked at the two unopened books. "You're saying that by not reading them, I am not failing the books. I am failing the *possibility* that the books might surprise me in a way Elias couldn't articulate."

  "Exactly."

  "Elias is very articulate."

  "But he's not you." Priya reached out and touched the cover of *The Cartographer's Wife*. "You said it yourself. The value happens between the book and the reader. You removed yourself from the equation. So the value isn't there. Not for this prize. Not for this panel."

  Odile sighed, a long, rattling exhalation. She looked at Priya, really looked at her, seeing the fatigue around her eyes but also the steel in her spine.

  "If I read them tonight," Odile said. "If I stay up until four. I will be tired tomorrow. I will read *The Glass Aviary* poorly. I might miss a nuance in the third act because my eyes are sliding shut. I might vote it down because I'm grumpy."

  "Then you vote down a book you actually read."

  "Versus voting up a book I know is good."

  "Versus voting up a book *Elias knows* is good."

  Odile picked up her glass. The ice clinked. She looked at the two stacks: the read and the unread. The known and the testified.

  "The Acquaintance Principle," Odile murmured. "It assumes that aesthetic properties are like colors. You have to see the red to know it's red."

  "Isn't it?"

  "Maybe," Odile said. "Or maybe aesthetic properties are like danger. You can be told the ice is thin. You don't have to fall through to know it."

  "But if you're the one signing the warning sign," Priya said, "you have to test the ice."

  Odile laughed, a short, dry sound. She finished the whiskey and set the glass down firmly.

  "Give me *The Cartographer's Wife*," Odile said.

  Priya blinked. "What?"

  "Give it to me. I'm not going to sleep anyway." Odile reached out her hand. "But Priya? If I read it, and I think it's shit... I'm still going to vote for it. If Elias is right, it deserves to win even if I'm too tired to see it. That's my compromise."

  Priya hesitated, her hand hovering over the book. She wanted to say *No, if you think it's shit, you should vote it down.* That was the logical conclusion of her own argument. But she knew Odile. She knew the weight of the institution Odile was carrying.

  "If you read it," Priya said, sliding the book across the table, "you have to vote on what *you* feel. Not what Elias feels. Not what the book deserves. What you feel."

  Odile took the book. It was heavy in her hand.

  "That," Odile said, opening the cover, "is the one thing I can't promise. But I'll give you the reading. That's the acquaintance, isn't it?"

  "It's a start," Priya said.

  Odile began to read. Priya watched her for a moment, watching the veteran's eyes track the first line, then the second. She didn't look like a fraud. She looked like someone trying to balance a ledger that would never quite add up. Priya picked up her own manuscript, but she didn't read. She just watched Odile read, guarding the silence, making sure the acquaintance was real.
