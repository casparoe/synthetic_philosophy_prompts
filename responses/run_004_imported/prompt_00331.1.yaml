          *   *Elena:* Not infallibility. *Reflective equilibrium*. I can correct errors. The machine cannot step outside its code to correct its own consistency in the way we do. The machine is bound by $F$; I am bound by truth. The distinction is between *derivability* and *truth*.

      *   **Exchange 5: The Fault Line (Epistemology vs. Ontology).**
