prompt: |-
  Quick one -- I help edit a small literary quarterly as a favor to a friend who runs it (mostly I write novels). We're stuck on a submission and I said i'd sort out a memo since nobody else will. The writer's cover letter admits she used AI pretty heavily: she'd describe a character, ask it to 'write in this person's voice,' then cut and rewrite what came back over several rounds. Some editors say that's fine -- it's a tool she steered, so the story's entirely hers. Others say once you're asking something to inhabit a voice and generate prose as that persona, its functioning as a co-author with its own take on the character, and our guidelines only take single-human-authored work. A third editor thinks both framings are wrong -- that it isn't a tool or an agent here so much as its simulating what an author would write, which is its own separate problem for a fiction magazine, closer to uncredited ventriloquism than either tool-use or co-authorship. Can you draft the short memo that settles this -- a straight accept/reject/accept-with-conditions on the story, plus a rule we can point to next time -- and be fair to whichever camp turns out wrong?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Small literary quarterly (friend runs it, user helps edit, user is mostly a novelist).
      *   **Problem:** A submission where the author admits to heavy AI use (describing character $\rightarrow$ AI writes in voice $\rightarrow$ author cuts/rewrites over several rounds).
      *   **Conflict:** Three editorial camps:
          1.  *Tool:* Author steered it, story is hers (Accept).
          2.  *Co-author:* AI inhabited voice/persona, violates single-human-author guideline (Reject).
          3.  *Simulation/Ventriloquism:* AI simulates authorship, fundamentally problematic for fiction regardless of tool/agent distinction (Reject/Philosophical objection).
      *   **Task:** Draft a short memo settling the decision (Accept/Reject/Conditional) + a future rule.
      *   **Constraint:** Be fair to the camps that might turn out wrong (diplomatic, acknowledging the complexity).
      *   **Tone:** Professional, decisive, literary, nuanced.

  2.  **Determine the Decision:**
      *   *Option A (Accept):* Risks alienating the "Co-author" and "Ventriloquism" camps. Might set a precedent that dilutes the magazine's identity as a human-centric literary space.
      *   *Option B (Reject):* Safer for a "literary quarterly" which usually prizes human voice and craft. Acknowledges the current ambiguity in the industry.
      *   *Option C (Accept with Conditions):* Tricky. How do you conditionally accept AI use after the fact? Disclosure? Labeling?
      *   *Best Path:* For a *literary* quarterly (implied focus on craft, voice, human experience), the "Ventriloquism" argument is the strongest philosophically, while the "Co-author" argument is the strongest practically regarding guidelines. However, since the guidelines weren't clear *before*, a hard reject might feel punitive. But the prompt asks to *settle* it. Usually, in literary fiction, "voice" is the sacred cow. If the AI generated the voice and the human edited it, the core literary element (voice) is compromised.
      *   *Decision:* **Reject.** Why? Because literary fiction relies on the provenance of the voice. If the voice is synthesized, it changes the nature of the art. However, the memo needs to be gracious because the author was honest.
      *   *Wait, reconsider:* The prompt asks to be "fair to whichever camp turns out wrong." A flat reject validates camps 2 & 3 and invalidates 1. A flat accept validates 1 and invalidates 2 & 3.
      *   *Better Decision:* **Reject, but with a specific nuance.** The decision should rest on the *current guidelines* (single-human-authored) while acknowledging the philosophical shift. This validates Camp 2 (guidelines) without necessarily fully endorsing Camp 3's philosophy as absolute truth, but acknowledging it as a valid concern for *this* publication.
      *   *Actually, looking at the "Tool" argument:* If she rewrote it over several rounds, is it hers? The prompt says "ask it to 'write in this person's voice'". In literary fiction, *voice* is the author's fingerprint. Outsourcing the generation of voice is the rub.
      *   *Final Decision:* **Decline to publish.** It's the safest bet for a small literary quarterly to maintain integrity while the industry sorts itself out. It allows for a clear policy going forward.

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Acknowledge the difficulty and the honesty of the author.
      *   **The Decision:** Clear and direct. (Decline).
      *   **The Rationale (The "Fairness" part):**
          *   Address Camp 1 (Tool): Acknowledge that AI *can* be a tool (brainstorming, etc.), but this usage crossed into generation of core literary elements (voice).
          *   Address Camp 2 (Co-author): This aligns with the current "single-human" guideline.
          *   Address Camp 3 (Ventriloquism): Acknowledge this is the deeper literary concern (provenance of voice).
          *   *Synthesis:* We are rejecting not because the work is bad, but because the *process* falls outside our current definition of authorship for fiction.
      *   **The Future Rule:** Needs to be specific. Not just "No AI," but defining *where* the line is. (e.g., AI can edit/brainstorm, but cannot generate prose or voice).
      *   **Tone Check:** Needs to be kind but firm. Not shaming the author.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* If I reject, Camp 1 feels ignored.
      *   *Fix:* Explicitly state that Camp 1 isn't "wrong" about AI being a tool generally, but that *this specific use case* (generating voice) is the boundary line for *this magazine*.
      *   *Critique:* If I reject, is it fair to the author who was honest?
      *   *Fix:* Praise the honesty. It allowed this decision to be made.
      *   *Policy:* The policy needs to be clear. "Human-generated prose" is the standard.

  5.  **Final Polish:**
