answer: |-
  **MEMORANDUM**

  **TO:** Editorial Board
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Submission [ID #] & AI Usage Policy

  **Decision:** **Decline.**

  **Rationale:**
  We are declining this piece not on the basis of quality, but on provenance. While we appreciate the author's transparency, the described workflow crosses the boundary of our "single-human-authored" guideline.

  To address the editorial debate:
  *   **To the "Tool" camp:** You are correct that AI can function as a passive instrument (e.g., for brainstorming or syntax checks). However, when an engine is prompted to *inhabit a voice* and *generate prose*, it moves beyond tool-use into generative partnership.
  *   **To the "Co-author" and "Ventriloquism" camps:** You raise the critical issue for a literary journal. Whether we view the AI as a co-author or a simulator, the result is the same: the core literary element of *voice* is not solely human in origin.

  We cannot verify the ratio of human-to-machine drafting after the fact. To maintain the integrity of the quarterly, we must prioritize the human genesis of the voice itself. This decision does not invalidate the "Tool" argument broadly, but it establishes that for *this* publication, the generation of narrative voice is a protected human act.

  **New Policy Guideline (Effective Immediately):**
  Submissions must be solely human-authored. Writers may disclose the use of AI for **non-generative tasks** (brainstorming, research, copy-editing) in their cover letter. The use of AI to **generate prose, simulate character voice, or draft scenes** renders a submission ineligible. We reserve the right to request a process statement if AI usage is disclosed.

  Please notify the author with our thanks for her honesty; without it, we could not have made this clarification.
