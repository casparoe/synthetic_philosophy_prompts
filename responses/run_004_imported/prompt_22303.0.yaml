      *   *The "Two Equalizations":* Most serious commentators agree there is a tension, but it's not necessarily a mistake. It's a distinction between the *basis* of comparison (need) and the *measure* of comparison (money/convention). The ratio of persons reflects their social standing/contribution, which is *linked* to need but not identical to marginal utility.

