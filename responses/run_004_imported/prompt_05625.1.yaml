  3.  **Drafting the Explanation - Step-by-Step:**

      *   **Setup: Branching Time:** I need to visualize the model first. A tree. Root is past, branches are futures. A "moment" is a node. A "history" is a full path through the tree.
      *   **The Index Problem:** In standard logic, truth is at a world. In branching time, we are *at* a moment, but there are many futures passing through this moment. So, to evaluate $F\phi$, which future do we look at?

      *   **Peirceanism (The Strict View):**
          *   *Idea:* Only what is *inevitable* counts as "will."
          *   *Truth Condition:* $F\phi$ is true at moment $m$ iff $\phi$ is true in *all* histories passing through $m$.
          *   *Consequence:* Most future contingents are false (or neither true nor false, depending on formulation, but usually treated as false in binary Peirceanism because "will" implies necessity). Actually, standard Peirceanism says $F\phi$ is false if there's *any* branch where $\phi$ doesn't happen.
          *   *Vibe:* "It will happen" = "It is settled that it will happen."
          *   *Pros:* Avoids fatalism easily.
          *   *Cons:* Makes "It will rain tomorrow" false even if it's 99% likely, as long as there's a possible branch where it doesn't. It changes the meaning of "will."

      *   **Ockhamism (The Classical View):**
          *   *Idea:* "Will" refers to the *actual* future, even if we don't know which one it is yet.
          *   *Truth Condition:* Truth is relative to a moment-history pair $\langle m, h \rangle$. $F\phi$ is true at $\langle m, h \rangle$ iff $\phi$ is true at some later moment in *that specific history* $h$.
          *   *Nuance:* But we speak from a moment $m$. We don't know $h$. Ockhamists say the proposition has a truth value relative to the *actual* history, even if we can't access it.
          *   *Vibe:* "It will happen" = "In the way things actually go, it happens."
          *   *Pros:* Preserves bivalence and the intuitive meaning of "will."
          *   *Cons:* The "Thin Red Line" problem.

      *   **The Thin Red Line (TRL) Problem:**
          *   *What is it?* The idea that one branch is "actual."
          *   *Why Ockhamism?* Ockhamism needs a specific history $h$ to evaluate truth at moment $m$ without quantifying over *all* histories. If there is no privileged "actual" history, then $F\phi$ lacks a truth value at $m$ simpliciter (it's only true relative to $h$). But we assert sentences at $m$, not $\langle m, h \rangle$.
