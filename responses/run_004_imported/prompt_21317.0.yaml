          *   Refinement: Hume leads to skepticism about metaphysics. You lead to certainty about God. How do you bridge the gap Hume left open?
          *   Follow-up: If he says "Hume lacked revelation," ask if the *philosophical* argument stands without it.

      *   *Question 4: Averroes's Objection (Essences).* (Required)
          *   Goal: If things have no natures, can we know them?
          *   Draft: Averroes said if fire doesn't burn, it isn't fire. How do we define things?
          *   Refinement: Science studies natures. If there are no natures, is science just studying God's habits? Does this empty the content of natural kinds?
          *   Follow-up: If he says "Natures are mental constructs," ask what distinguishes a real distinction from a mental one.

      *   *Question 5: The Problem of Evil/Pain.*
          *   Goal: If God directly causes everything, He directly causes pain.
          *   Draft: Why do we suffer if God does it all?
          *   Refinement: If I put my hand in fire, *God* burns me. The fire is inert. Does this make God the immediate agent of suffering in a way secondary causation doesn't?
          *   Follow-up: If he says "It's for a greater good," ask if the *mechanism* of direct causation changes the moral weight.

      *   *Question 6: Prayer and Supplication.*
