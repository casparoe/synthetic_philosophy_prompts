answer: |-
  This is a classic setup. The Ghazalian occasionalist position is philosophically robust but notoriously difficult to pin down because it shifts the burden of explanation from *physics* to *theology* whenever the pressure gets too high. The "Custom" (*ādah*) defense is essentially a conversation stopper unless you can force him to explain what work "custom" is actually doing beyond describing regularity.

  Since you're a PhD student, I've kept the terminology precise (modal strength, ontological commitment, epistemic access) but framed them for an audio format so they don't sound like a dissertation defense.

  Here are 8 questions designed to corner the "Custom" dodge, including your required specific topics.

  ### 1. The Explanatory Power of "Custom"
  **Question:** "You argue that what we call 'causation' is really just God's habitual way of acting—His *custom*. But in modern philosophy of science, we value explanations that increase the modal strength of a prediction. If fire burns cotton only because God *habitually* wills it, rather than because fire *must* burn cotton, doesn't 'custom' just describe the regularity without explaining it? What ontological work is 'custom' doing here that isn't just a placeholder for 'we don't know why God does this repeatedly'?"

  **Follow-up (If he says Custom *is* the explanation):** "If custom is the explanation, does that mean God is bound by a kind of rational consistency to maintain that custom? If He isn't bound, then the custom is contingent. If it's contingent, why trust it as a basis for knowledge rather than just hope?"

  ### 2. The *Kasb* (Acquisition) Problem
  **Question:** "I want to press you on human agency. In the Ash'arite tradition, you have *kasb*—acquisition—to preserve responsibility. But if God is the only true agent creating the motion of my hand, and I am merely the 'occasion' for that creation, in what sense is the action *mine*? If I lack causal power, isn't *kasb* just a metaphor for 'I was there when God acted'? How do you get moral responsibility out of a metaphysics where I am causally inert?"

  **Follow-up (If he says Kasb is a real connection to the act):** "If *kasb* is a real connection, does it have any causal efficacy? If yes, you've smuggled secondary causation back in. If no, then how is it distinct from pure passivity? What is the difference between 'acquiring' an act God creates and simply 'undergoing' an act God creates?"

  ### 3. The Humean Divergence
  **Question:** "David Hume starts from a premise that looks strikingly similar to yours: we never observe 'necessary connection,' only constant conjunction. But Hume lands in skepticism about metaphysics, while you land in certainty about Divine Omnipotence. Why does the same epistemic limitation—the inability to see the 'glue' between events—warrant a theological conclusion for you, but a skeptical one for Hume? Is the only difference here revelation, or is there a philosophical reason to prefer your inference?"

  **Follow-up (If he says Revelation bridges the gap):** "If the philosophical argument from constant conjunction alone doesn't get you to God (since Hume didn't go there), does that mean occasionalism is philosophically underdetermined? Can you defend the *philosophy* of occasionalism without leaning entirely on the *theology*?"

  ### 4. The Averroean Objection (Essences)
  **Question:** "Averroes argued against Ghazali that if things have no inherent causal powers, they have no specific natures. If fire doesn't burn by nature, what makes it *fire* and not *water*? If all natures are stripped of causal powers, aren't we left with a world of bare particulars that we can't actually know? How can we have scientific knowledge of things if their essences are causally empty?"

  **Follow-up (If he says Natures are mental constructs):** "If natures are just mental constructs we impose on God's actions, then natural science isn't studying reality, it's studying human psychology. Are you comfortable saying that physics is ultimately a study of how humans categorize God's habits, rather than how the world is structured?"

  ### 5. The Problem of Pain and Evil
  **Question:** "In a secondary causation model, if I stab you, I am the agent of your pain. In your model, God is the immediate agent of your pain; the knife is inert. Does this not make God the direct author of suffering in a way that secondary causation avoids? If the knife has no power, then God is effectively touching the nerve directly. How do you reconcile this immediate divine agency with the goodness of God?"

  **Follow-up (If he says God has a wise purpose):** "I'm not asking about the *purpose* of the pain, but the *mechanism*. If God is the immediate efficient cause of the pain, does that not intensify the problem of evil? It's one thing for God to permit a creature to harm me; it's another for God to directly inflict the harm using a creature as a screen."

  ### 6. Prayer and Divine Immutability
  **Question:** "If the world runs on God's 'custom,' what is the metaphysical status of petitionary prayer? If I pray for rain, am I asking God to break His custom? Or is my prayer just another occasion within the custom that God already accounted for? If it's the latter, does prayer actually change anything in the world, or does it only change me?"

  **Follow-up (If he says Prayer changes the outcome):** "If prayer changes the outcome, then God's custom is mutable based on human input. But if humans have no causal power (as per *kasb*), how does our prayer function as an input? Are we causally influencing God's will without having causal power ourselves?"

  ### 7. Temporal Atomism and Personal Identity
  **Question:** "Occasionalism often implies a discrete view of time—that God recreates the world at every instant. If I am recreated at moment $t_2$, what guarantees that I am the same entity as at $t_1$? If there is no causal continuity between my past self and my present self, isn't memory just a fresh impression God creates in me now? How do you secure the continuity of the self without causal persistence?"

  **Follow-up (If he says God sustains identity):** "If God sustains identity directly, isn't that a form of causal power residing in the soul? To be 'the same' requires a principle of individuation that persists. If that principle isn't causal, what is it? And if it is causal, haven't you granted the soul a power independent of the occasionalist framework?"

  ### 8. The Falsifiability Challenge
  **Question:** "I want to end on the status of the view itself. You explain predictable events as 'God's custom' and unpredictable events (miracles) as 'God's break with custom.' But since both are just expressions of Divine Will, what observation could ever count as evidence *against* your theory? If every possible state of affairs is compatible with God's will, is occasionalism immune to empirical refutation?"

  **Follow-up (If he says It's a metaphysical framework, not a scientific theory):** "If it's immune to empirical refutation, does it interact with our understanding of the natural world at all? Or is it essentially a theological overlay that leaves the scientific description of the world untouched? If it leaves science untouched, what is the philosophical cost of adopting it?"
