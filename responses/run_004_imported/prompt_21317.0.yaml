          4.  Each question needs a follow-up keyed to the likely answer.
          5.  End with a question about falsifiability (what observation counts as evidence against the view?).
      *   **Tone:** Academic but accessible (podcast format), rigorous but polite (Socratic).

  2.  **Deconstruct the Guest's Position (Ghazalian Occasionalism):**
      *   *Metaphysics:* Only God has efficacy (*ta'thir*). Creatures are occasions for God's action.
      *   *Epistemology:* We observe conjunction, not connection. Certainty comes from revelation or immediate experience, not inference from cause to effect.
      *   *Theology:* Preserves divine omnipotence and sovereignty.
      *   *The "Custom" Dodge:* Why does fire always burn cotton? Because God wills it to happen that way habitually, not because fire has the nature to burn.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The "Custom" Explanation (Setting the stage).*
          *   Goal: Challenge the explanatory power of "custom."
          *   Draft: Why call it custom? Isn't that just a word for regularity?
          *   Refinement: Make it about the *difference* between a habit and a nature. If God *could* break the habit at any moment, what grounds the expectation?
          *   Follow-up: If he says "Revelation guarantees it," ask about the status of natural knowledge vs. theological knowledge.

      *   *Question 2: Human Responsibility (*Kasb*).* (Required)
          *   Goal: How do we own actions if God does them?
