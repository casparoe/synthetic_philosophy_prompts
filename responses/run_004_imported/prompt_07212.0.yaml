      *   *Self-Correction on Grading:* 13/20 is a 65%. In many grad seminars, that's a low C or D. In undergrad, it's a D. Since it's a "seminar," I should assume upper-level undergrad or grad. 13/20 is a "C" range performance. It passes, but shows significant gaps. I will assign 13/20.

