      *   Points for (c):
          *   Is entitled to: 3/3 (Correctly identifies amoralist has no reason).
          *   Isn't entitled to: 0/4 (Incorrectly identifies Williams as a moral error theorist).
          *   Wait, the student *did* attempt the "isn't" part, they just got it wrong. So they engaged with the prompt.
          *   Let's adjust (c) to 3/7.
          *   (a) 4/6 (Self-interest error).
