answer: |-
  **Scene:** *The Rusty Anchor*, 2:15 AM. The conference bar is emptying out. Empty pint glasses and a crumpled napkin covered in symbolic logic clutter the table. **ELIAS** (30s, rumpled suit, defends Kripke) swirls the last inch of his whiskey. **JULIAN** (30s, cardigan, Wittgenstein purist) is signaling for the check.

  **JULIAN**
  (Dropping the leather folio on the table)
  Round three is on me. Provided you admit that Kripke's reading of *PI* §201 is a categorical error.

  **ELIAS**
  (Smiling, not looking at the folio)
  I'd love to, Julian. I really would. But I'm having a crisis of meaning regarding the tab.

  **JULIAN**
  Oh, god. Don't.

  **ELIAS**
  No, seriously. Look at the total. One hundred and twenty-five dollars. Now, up until this moment, every time we've split a bill, I've meant "split" as in "divide by two." But there's no fact of the matter about my past mental states that proves I didn't mean "quus-split."

  **JULIAN**
  (Sighs, rubbing his temples)
  Here we go.

  **ELIAS**
  For all you know, "quus-split" means "divide by two for all sums under one hundred, but for sums over one hundred, my contribution equals five." So, technically, I owe you five bucks.

  **JULIAN**
  That is the most tired skeptical trap in the book. You're ignoring the community practice. The meaning *is* the use within the form of life. We are in a bar. The form of life says "friends split tabs."

  **ELIAS**
  (Leans in, eyes glinting)
  Ah, but that's where you're missing the morphology. You're treating Kripkenstein like a philosopher. He's not. He's a monster.

  **JULIAN**
  (Pauses)
  Excuse me?

  **ELIAS**
  Kripkenstein. Think about it. Kripke took Wittgenstein's bones, stitched them together with skeptical thread, and waited for the lightning of interpretation to wake it up. It's Frankenstein. And you don't reason with a monster, Julian. You appease it.

  **JULIAN**
  So the monster wants five dollars?

  **ELIAS**
  The monster *is* the five dollars. 68 plus 57. The answer isn't 125. It's 5. That's the scream the monster makes when it wakes up.

  **JULIAN**
  (Dryly)
  And if I reject the monster's arithmetic?

  **ELIAS**
  (He finally picks up the folio, pulls out his card, and slides it over)
  Then I'm worried you'll interpret "ride home" as "quus-ride."

  **JULIAN**
  Which outputs what?

  **ELIAS**
  For all values of "get in the car," the destination equals "five miles from here." In the woods.

  **JULIAN**
  (A beat. Then he laughs, a genuine, drunk sound)
  Touché. But if you leave me in the woods, you're violating the community norms. The village will come for you with torches.

  **ELIAS**
  Let them come. I'll just quus the torches. For all values of "fire," they now equal "water."

  **JULIAN**
  (Shakes his head, signaling the waiter)
  You're paying for the next round. Before I decide "friend" means "quus-friend."

  **ELIAS**
  (Raises his glass)
  Which is?

  **JULIAN**
  For values greater than zero... "enemy."

  **ELIAS**
  (Clinks glass)
  Fair enough.
