answer: |-
  **MEMORANDUM**

  **TO:** Diagnostic Manual Revision Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on the Definition of "Dysfunction" in Mental Disorder

  **Recommendation**

  I recommend that the committee **adopt a third option**: we should retain the logical core of the etiological criterion (that a disorder requires an internal mechanism failure) but operationalize it through a **"Species-Typical Design Range"** standard, rather than requiring evidence of specific evolutionary selection histories.

  We must not adopt the pure causal-role alternative, nor should we retain the current wording if it implies that clinicians must verify evolutionary narratives. The definition of "mental disorder" must distinguish between a *broken mechanism* and a *mechanism working as designed in a difficult environment*. Only a design-based account preserves this distinction, but we must modify how we evidence "design" to satisfy scientific rigor.

  **Rationale**

  The central stake of this revision is the boundary of the medical model. If we define dysfunction purely by a trait's current causal contribution to the system (the causal-role view), we risk pathologizing expectable human responses to harmful environments. For example, intense grief after a loss or anxiety in a war zone reduces a person's current "functioning," but classifying these as disorders medicalizes normal human capacities operating correctly. We need the etiological insight: a disorder is a failure of the mechanism *itself*, not merely a mismatch between the mechanism and the context.

  However, the current etiological wording invites the charge that we are relying on unprovable "Just-So stories" about human evolution. This is the strongest objection raised by the faction proposing the causal-role alternative, and it is a valid concern. We cannot require clinicians or researchers to prove that a specific cognitive trait was selected for in the Pleistocene to diagnose a patient today.

  **Addressing the Strongest Objection**

  The proponents of the causal-role alternative argue that because we cannot rigorously establish the selection history of psychological traits, the etiological criterion is scientifically empty. They contend we should look only at what a trait *does* now, not what it *was for*.

  **This objection is answered by decoupling "function" from "history."**

  We do not need to know the *history* of a mechanism to identify its *design specifications*. We can infer design from **species-typical functioning**. Just as we can identify a dysfunctional heart without knowing the evolutionary history of the cardiovascular system (by comparing it to the standard operation of human hearts), we can identify a dysfunctional fear mechanism by comparing it to the species-typical range of fear response.

  By adopting the "Species-Typical Design Range" standard, we retain the etiological requirement that something *internal* must be failing (protecting us from medicalizing social problems), but we ground the evidence in observable, cross-cultural, and developmental norms rather than speculative evolutionary history (addressing the epistemic objection).

  **Proposed Wording Change**

  I propose we revise the text to state that a dysfunction exists when a psychological mechanism fails to operate within the **species-typical range of design**, as evidenced by universal developmental trajectories and cross-cultural norms, resulting in harm to the individual.

  This approach respects the philosophical necessity of the etiological view while incorporating the scientific caution of the causal-role critique. It allows us to vote forward with a definition that is both conceptually robust and clinically applicable.
