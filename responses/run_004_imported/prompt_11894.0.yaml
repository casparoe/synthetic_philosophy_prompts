answer: |-
  Your unease is not only valid; it is theoretically well-founded. You are intuitively detecting a violation of a core principle of fair bargaining known as the **Independence of Irrelevant Alternatives (IIA)**.

  To answer your question directly: **Your colleague's proposal (the Decision Theorist's) has the stronger claim to fairness.** It aligns with the standard **Nash Bargaining Solution**, which is the dominant framework in economics and decision theory for dividing the surplus of a cooperative venture. Your co-author's proposal resembles the **Kalai-Smorodinsky Solution**, which has specific use cases but is generally considered less appropriate for this kind of joint authorship because it allows "phantom" options to dictate real outcomes.

  Here is the breakdown of why your intuition is correct and why the second proposal is the principled choice.

  ### 1. The Problem with "Personal Maximums" (Proposal 1)
  Your co-author's rule anchors your share to a hypothetical ceiling ($M$) that exists only in theory. In bargaining theory, this is problematic for two main reasons:

  **A. The Independence of Irrelevant Alternatives (IIA)**
  A fair division rule should not change the outcome based on options that no one would actually choose.
  *   **Example:** Imagine there is a contract variant where your co-author earns \$10 million (their "maximum") but you earn \$0. No rational person would sign this, and it's not a viable option for the partnership. However, under your co-author's rule, the mere *existence* of this contract raises their "maximum" ($M_B$). Because their $M_B$ is now higher, your share of the *actual* contract goes down, even though that \$10 million contract is never going to happen.
  *   **Why it's unfair:** It allows a "ghost contract" to tax your real income. Your share becomes dependent on the most extreme, one-sided deal theoretically possible, rather than the value you are actually creating together.

  **B. Misaligned Incentives**
  This rule rewards *potential individual leverage* rather than *joint contribution*. Your co-author's higher ceiling is based on their specialty (foreign rights). If the textbook deal requires both of you to succeed (e.g., domestic sales fund the project, foreign sales are a bonus), anchoring to the foreign rights maximum treats the joint project as if it were primarily a vehicle for their specialty. It effectively penalizes you for not having a high-value "outside option" embedded in the contract menu, even though you are both essential to the book's existence.

  ### 2. The Strength of the "Product of Gains" (Proposal 2)
  Your colleague's suggestion is the **Nash Bargaining Solution**. John Nash proved that if you want a solution that satisfies basic axioms of fairness (efficiency, symmetry, and independence of irrelevant alternatives), maximizing the product of the gains is the unique mathematical solution.

  **A. It Focuses on the Cooperative Surplus**
  The Nash solution asks: "How much value do we create *by agreeing* compared to *not agreeing*?"
  *   Your disagreement point is \$0 (the deal falls through).
  *   Therefore, the solution maximizes the product of your actual earnings: $Earnings_{You} \times Earnings_{CoAuthor}$.
  *   Mathematically, when the disagreement point is zero for both parties, this pushes strongly toward an **equal split of the actual value generated**. It ignores what *could* have happened in a different universe and focuses entirely on the value created in *this* universe by *this* partnership.

  **B. It Respects the "Joint Venture" Nature**
  In a co-authorship, the primary moral claim to royalties is usually based on contribution to the work and the risk of the deal collapsing. Since the deal collapses for *both* of you if you disagree, you have symmetric bargaining power regarding the *existence* of the income. The Nash solution respects this symmetry. It treats the income as a joint product to be divided, rather than two individual claims to be reconciled against hypothetical ceilings.

  ### 3. Why Your Intuition Tracks Something Real
  You mentioned that pegging your share to a "lavish hypothetical" strikes you as odd. In philosophy of economics, this is known as the problem of **utopian benchmarks**.

  Fairness in distribution is usually about dividing the *actual* benefits of social cooperation. Your co-author's proposal implicitly argues that fairness means "equal relative satisfaction of greed." (i.e., "We should both feel equally close to our dream riches.") But fairness in a partnership is usually about "equal division of the actual benefit."

  If your co-author's "maximum" is high only because there is a contract version that gives them everything and you nothing, using that as a baseline implies that their "fair share" is defined by how much they could squeeze you out of in a different scenario. That is a bargaining threat, not a principle of fairness.

  ### Recommendation
  You should advocate for the Decision Theorist's proposal (the Nash Bargaining Solution). It is the standard, principled approach for this exact scenario in game theory and contractarian philosophy.

  **How to frame it to your co-author:**
  1.  **Avoid "Fairness" Accusations:** Frame it as "Standard Practice." Mention that in cooperative game theory, when the disagreement point is zero for both parties, the Nash Solution is the standard benchmark for rational agreement.
  2.  **Highlight the "Phantom Contract" Risk:** Gently point out that Proposal 1 makes your income dependent on contract variants neither of you intends to sign. Ask: "If we remove the contract variants that are unrealistic, does the split change? If so, why should our real money depend on fake options?"
  3.  **Propose Simplicity:** Since your disagreement point is identical (zero) and you are both risk-averse authors, the Nash Solution often simplifies to **an equal split of the net royalties from the chosen contract.** You might suggest: "Let's pick the contract that maximizes our total joint income, and split that income 50/50." This satisfies the Nash criteria without needing complex calculations.

  **Verdict:** Your colleague is right. Proposal 2 is the principled way to divide a joint gain. Proposal 1 allows irrelevant hypotheticals to distort the actual division of labor and reward. Trust your unease.
