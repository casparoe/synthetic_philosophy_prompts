answer: |-
  This is a profound and difficult task, but it is also the ultimate way to honor her. By adhering to her standard of truth, you are embodying the very lesson she spent her life teaching.

  Here is a draft for the eulogy. It is written to be spoken by you, incorporating your uncertainty and the family's split in a way that remains strictly truthful by her definition. It avoids metaphysical claims you cannot verify, focusing instead on the tangible reality of her life and impact.

  ***

  **Eulogy for [Grandma's Name]**

  Thank you all for being here.

  Standing here today, I feel a responsibility that is heavier than the usual sadness of a funeral. My grandmother passed away this Sunday, and I have been asked to speak about her life. Usually, this is a moment where we say things to make ourselves feel better. We say the departed are "looking down on us," or that "everything happens for a reason." We say these things because we want comfort, and we want to offer it to each other.

  But if I stood here and said those things simply because they are expected, I would be violating the core principle of my grandmother's life.

  She was not a showy religious person, but in her forties, she became deeply devoted to the writings of an old church thinker named Augustine. Specifically, she was captivated by his writing on lying. Augustine argued that a lie isn't just saying something that happens to be wrong. A lie is saying something you do not believe, with the intent to deceive.

  She took this seriously. She hated the phrase "white lie." She used to say, "A lie doesn't get nicer depending on what color you paint it."

  To her, truth was the highest form of respect. She never told me my school projects were good when they weren't. She didn't do the Santa Claus story with her own children. I remember my uncle talking about the time her own sister was dying. The whole room wanted to offer false comfort, to promise a recovery that wasn't coming. My grandmother stood there and told her sister the truth about the prognosis. It was hard to watch then. But it was her way of saying: *You deserve reality. You deserve my honesty, even when it hurts.*

  She told us, more than once, that the worst thing we could do at her funeral is stand up here and lie to make ourselves feel better.

  So, I am going to honor that request.

  I know this room is divided. Some of you are devout, and you find comfort in the certainty that she is in heaven, watching over us right now. Some of you are not religious, and you find comfort in the memory of the person she was while she was here. And then there are people like me, who are standing somewhere in the middle, unsure of what comes next.

  If I tell you I know where she is, I would be lying. I don't know.
  If I tell you she is gone forever, I might be lying. I don't know that either.

  But I do know this: I know the truth of what she did. I know the truth of how she made us feel.

  I know that she loved us enough to trust us with the truth. In a world that often treats us like we are too fragile to handle reality, she treated us like we were strong. When she looked at me, she didn't see someone who needed to be coddled with pretty fictions. She saw someone who needed to be told the truth so I could grow.

  That is a specific kind of love. It is a rigorous love. It is not always the easiest love to receive when we are young, but it is the only love that holds up when we are older.

  So, how do we say goodbye to her without lying?

  We acknowledge that she is not here. That is true. The chair she sat in is empty. The voice we know is silent. That hurts. It is okay to say that it hurts. We don't need to paint that pain a nicer color.

  But we also acknowledge that she is here. That is also true. She is here in the way we check our own motives before we speak. She is here in the way we hesitate before offering a comforting falsehood to a friend in trouble. She is here in the integrity of this family, even when that integrity makes things difficult.

  Some of you believe she is at peace with God. Some of you believe she lives on in our stories. Perhaps those are not as different as they seem. Because as long as we tell the truth about who she was—as long as we refuse to sanitize her memory into something she wasn't—she remains real.

  She taught us that silence is better than a falsehood. So, if you are in pain today, and you don't have the words, you don't need to make them up. She would have told you to just be quiet and be honest about the grief.

  And she taught us that the only way to honor the dead is to live truthfully.

  So, I will not promise you that she is watching over us. But I will promise you this: If we live with the honesty she demanded of us, if we treat each other with the respect of the truth, then we are doing the work she loved. We are keeping her here, in the only place we know for certain she can be: in the truth of what we do next.

  Thank you.

  ***

  ### A Few Notes for Delivery

  *   **The "Heaven" Section:** Notice the phrasing in the middle ("Some of you believe... Some of you believe..."). This allows the devout family members to nod along to their truth, and the atheist family members to nod along to theirs, while *you* remain truthful because you are reporting *their* beliefs, not asserting them as your own fact.
  *   **Pacing:** This speech relies on silence. When you say, "I don't know," pause. Let that hang in the air. That hesitation is the tribute to her.
  *   **Tone:** Keep it steady. You don't need to be cold, but you don't need to be overly emotional. Her version of comfort was stability and reality. A calm delivery honors that more than a trembling one.

  This approach turns your uncertainty from a liability into the central theme of the tribute. It tells the room: *I am honoring her by refusing to pretend I know things I don't.* That is the most consistent thing you can do.
