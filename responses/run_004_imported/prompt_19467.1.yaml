answer: |-
  Your friend is right, and you are fundamentally misreading Anscombe's argument. In fact, you have described the exact opposite of her position.

  If you attribute a "numbers argument" or "utilitarian math" to G.E.M. Anscombe, you are attributing to her the very ethical framework she spent her career attacking.

  Here is the breakdown of why your interpretation is incorrect and what her actual argument was.

  ### 1. Anscombe was fiercely anti-utilitarian
  G.E.M. Anscombe is one of the most important moral philosophers of the 20th century, largely because she helped revive **virtue ethics** and **natural law theory** in the Anglophone world. Her famous 1958 paper *Modern Moral Philosophy* is essentially a demolition job on consequentialism and utilitarianism.

  To argue that Anscombe believed Truman was a murderer *because* the bomb killed more people than an invasion would have is to claim she was a utilitarian. She was not. For Anscombe, an action is not made right or wrong by its consequences (the "math"), but by the nature of the act itself.

  ### 2. Her argument was about *intention*, not *outcome*
  In *Mr. Truman's Degree*, Anscombe's core argument is based on the **Doctrine of Double Effect** and the absolute prohibition against the intentional killing of innocents.

  *   **The Utilitarian View (Your interpretation):** "We should not drop the bomb because the total death count is higher than the alternative."
  *   **Anscombe's View:** "We should not drop the bomb because it involves the *intentional murder of non-combatants*, which is intrinsically evil, regardless of how many lives it saves."

  Anscombe argued that Truman authorized the mass killing of civilians as a *means* to an end (forcing surrender). In her moral framework, you cannot do evil so that good may come of it. Even if a land invasion would have cost ten million lives, and the bomb cost only 200,000, Anscombe would still argue that Truman was a murderer. The "math" was irrelevant to her moral judgment.

  ### 3. She explicitly rejected the "greater good" justification
  In the pamphlet, Anscombe addresses the prevailing justification for the bomb: that it ended the war sooner and saved lives overall. She does not try to debunk this by saying the invasion would have been less bloody. Instead, she dismisses the justification entirely.

  She writes that Truman's defense amounts to saying that "the slaughter of citizens... was justified by the fact that it brought the war to an end." She rejects this logic outright. To her, honoring Truman was Oxford University endorsing the idea that "mass murder of citizens" is acceptable if it produces a useful political result.

  ### 4. Why the confusion is understandable
  You aren't alone in thinking this. Most public debate about the atomic bomb *is* utilitarian. Historians and politicians usually argue over the numbers: *Would Japan have surrendered without the bomb? How many would have died in Operation Downfall?*

  Because that is the standard frame of the debate, it is easy to assume everyone is playing that game. But Anscombe stepped outside of that frame entirely. She wasn't arguing that the bomb was *inefficient*; she was arguing that it was *sinful*.

  ### The Verdict
  You are interpreting her argument as **consequentialist** (the morality depends on the outcome/numbers).
  Her argument was **deontological/natural law** (the morality depends on the act itself/intention).

  So, to settle the bet: **Your friend is right.** Anscombe did not vote against the degree because she thought the body count was too high; she voted against it because she believed Truman had committed mass murder, and no amount of "good consequences" could wash that away.
