prompt: |-
  So for AP Psych, my partner Owen and our friend Mina are presenting on split-brain patients (they get the corpus callosum cut to stop seizures), and while researching it they had a text argument that never got resolved. We'd covered the classic Sperry/Gazzaniga finding — flash a word to one hemisphere and the patient says one thing but writes something else with their left hand. Then we found a 2017 exchange in the journal Brain between a researcher named Pinto and Gazzaniga's own lab, and that's where it got heated.

  (1) Owen said Pinto's study kills the "two minds" idea — patients could always say which side a flash appeared on, with either hand, no matter which hemisphere saw it, so it's perception that's split, not consciousness.
  (2) Mina said Gazzaniga's team came back with "cross-cueing" — decades with a cut corpus callosum let patients learn to leak simple cues (an eye flick, a facial twitch) between hemispheres, so the sides coordinate without any shared conscious system.
  (3) Owen said Pinto's team already checked that: reaction times were identical whether the info had to "cross over" or not, and a smuggled cue should cost extra time, not zero.
  (4) Mina said identical speed just means the trick went automatic after enough practice, like not thinking about balancing on a bike — and even Pinto's data shows patients can locate a stimulus but not identify it, exactly the thin signal cross-cueing predicts.
  (5) Owen said if any coordinated behavior can always get waved off as "cross-cueing we just haven't caught yet," the two-minds side can never lose the argument, which should count against it, not for it.

  They wanted me to settle it and i had no idea. Can you go move by move and say who's got the better point at each step (doesn't have to be the same person every time), and flag anything both of them are missing? Then give your own overall read, on its own line, in exactly this format: \answer{unified}, \answer{still split}, or \answer{can't tell from this}.
