          *   **Matter:** If the name signifies matter (e.g., "body"), identity requires same matter.
          *   **Form/Motion:** If the name signifies a form that is a "beginning of motion" (e.g., "man," "city," "river"), identity persists as long as the motion/action continues from the same source, even if matter changes.
          *   **Accident/Figure:** If the name signifies matter *plus* a specific figure/accident (e.g., "ship"), identity depends on the matter.
