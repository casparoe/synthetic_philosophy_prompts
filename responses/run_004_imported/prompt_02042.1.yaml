      *   *Colleague's Point:* The colleague is largely right. Hobbes is doing conceptual analysis/nominalism, not modal metaphysics in the Lewisian sense.
      *   *Verdict:* It's a different axis. Hobbes = Sortal-Relative Identity Criteria. Lewis/Sider = Ontological Structure of Persistence.
