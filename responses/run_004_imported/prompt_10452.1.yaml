  # Handout: The "Doomsday" Scenario and the Resilience of Ordinary Mathematics
  **Topic:** The Consequences of a Hypothetical Inconsistency in ZFC
  **Context:** Post-Gödel Seminar, Week 10

  ## 1. The Standard Narrative vs. The Structural Reality
  The standard reaction to the hypothesis $\neg\text{Con}(\text{ZFC})$ is catastrophic: if ZFC is inconsistent, it proves everything (by *ex falso quodlibet*), including $0=1$ and $0\neq 1$. Therefore, all mathematics founded on ZFC is false.

  This reaction conflates **foundational dependency** with **logical necessity**. It assumes that because we *formalize* ordinary mathematics in ZFC, ordinary mathematics *requires* the full consistency strength of ZFC to be true. Reverse Mathematics suggests this is false.

  ## 2. The Reverse Mathematics Anchor
  The work of Friedman, Simpson, and others demonstrates that the vast majority of "ordinary mathematics" (analysis, algebra, number theory, topology relevant to physics) does not require the full power of ZFC. It requires only subsystems of Second-Order Arithmetic ($Z_2$).

  We can stratify the risk based on which system a theorem requires:

  *   **$\text{RCA}_0$ (Recursive Comprehension):** The base system. Corresponds to constructive mathematics with limited induction. Sufficient for basic properties of computable functions.
  *   **$\text{WKL}_0$ (Weak König's Lemma):** Adds the existence of infinite paths in binary trees. Sufficient for basic analysis (Heine-Borel, existence of maxima for continuous functions, local existence of ODE solutions).
  *   **$\text{ACA}_0$ (Arithmetical Comprehension):** Allows comprehension for arithmetical formulas. Sufficient for most classical analysis (Bolzano-Weierstrass, Baire Category, completeness of $\mathbb{R}$).
  *   **$\text{ATR}_0$ & $\Pi^1_1\text{-CA}_0$:** Required for more advanced descriptive set theory and some algebra (e.g., structure of countable abelian groups).

  **The Crucial Conservativity Result:**
  $\text{ACA}_0$ is **conservative over Peano Arithmetic (PA)** for arithmetical sentences. $\text{WKL}_0$ is conservative over $\text{PRA}$ (Primitive Recursive Arithmetic) for $\Pi^0_2$ sentences.

  **The Argument:**
  If ZFC is inconsistent, the contradiction must arise from axioms not present in these subsystems (likely Power Set, Replacement, or Choice applied to uncountable sets). If we assume $\text{Con}(\text{PA})$ holds (see Section 3), then $\text{ACA}_0$ cannot prove any false arithmetical statements. Since almost all scientific and engineering mathematics reduces to arithmetical claims (predictions, counts, measurements) provable in $\text{ACA}_0$ or below, the "truth" of ordinary mathematics remains intact even if the "attic" of high-level set theory collapses.

  ## 3. The Gentzen Reassurance (Is it Beside the Point?)
  A common objection is: *"If ZFC is inconsistent, why trust PA? Maybe the rot goes all the way down."*

  This is where Gentzen's 1936 consistency proof is relevant, not as a absolute guarantee, but as an epistemic boundary. Gentzen proved $\text{Con}(\text{PA})$ using PRA plus transfinite induction up to the ordinal $\varepsilon_0$.
  *   **PRA** is often considered "finitarily secure" (Hilbert's ideal).
  *   **Induction up to $\varepsilon_0$** is a combinatorial principle about well-ordering that many find intuitively clearer than the full Power Set axiom.

  If we accept Gentzen's principles as more secure than ZFC (a standard view in proof theory), then we have a hierarchy of security:
  $$ \text{PRA} + \text{TI}(\varepsilon_0) \prec \text{ZFC} $$
  If ZFC falls, it falls *above* the level required to secure PA. Therefore, a ZFC-inconsistency does not automatically impugn PA. We can retreat to the arithmetic core with high confidence that it remains sound.

  ## 4. Objection I: "We Wouldn't Know Where the Bomb Is"
  **The Worry:** A proof of $\neg\text{Con}(\text{ZFC})$ gives us a derivation of $0=1$. It doesn't come with a label saying "Error in Power Set Axiom." How do we know which fragment to retreat to? Maybe the inconsistency is in $\text{ACA}_0$?

  **The Response:**
  1.  **Proof Mining:** Proofs are finite objects. We can analyze the derivation of the contradiction to identify exactly which axioms were invoked. If the contradiction relies on the existence of $\mathcal{P}(\mathbb{R})$, we excise Power Set.
  2.  **Relative Consistency:** We have relative consistency proofs between these systems. We know $\text{Con}(\text{PA}) \to \text{Con}(\text{ACA}_0)$. If we maintain confidence in PA (via Gentzen), we maintain confidence in $\text{ACA}_0$. If a contradiction appears in ZFC, but we can verify the contradiction requires axioms stronger than $\text{ACA}_0$, then $\text{ACA}_0$ remains consistent *relative to PA*.
  3.  **Arithmetic Soundness:** Even if we couldn't isolate the axiom immediately, we know that if a $\Pi^0_1$ statement (like "this Turing machine never halts") is provable in $\text{ACA}_0$, and $\text{ACA}_0$ is conservative over PA, then the truth of that statement depends only on PA. If PA is consistent, the statement is true. The inconsistency in ZFC would only affect statements that *require* the stronger axioms (typically existence claims about uncountable sets).

  ## 5. Objection II: "Mathematicians Use More Firepower Than They Realize"
  **The Worry:** Working mathematicians don't check their axioms. Andrew Wiles' original proof of Fermat's Last Theorem (FLT) relied on Grothendieck Universes (ZFC + Inaccessible Cardinals). If ZFC is inconsistent, maybe FLT is unprovable in safe systems.

  **The Response:**
  1.  **The McLarty Reduction:** Colin McLarty (2010) demonstrated that the specific cohomological tools used in Wiles' proof can be formalized in **finite order arithmetic**, vastly weaker than ZFC, and certainly weaker than ZFC + Inaccessibles.
  2.  **Scaffolding vs. Structure:** High-powered set theory often acts as "scaffolding." It allows for elegant, high-level definitions (categories of all sets, large functors). However, the *conclusion* of FLT is a $\Pi^0_1$ arithmetical statement.
  3.  **The Conservation Safety Net:** If a $\Pi^0_1$ statement is provable in ZFC + Inaccessibles, and that system is inconsistent, does that invalidate FLT? **No.** Because we can (in principle) apply proof-theoretic reduction to show that if FLT is provable in the strong system, it is provable in the weak system (conservativity).
      *   *Caveat:* This requires the reduction to be done. If a theorem is proven *only* via a path that traverses the inconsistent axiom, and no alternative path exists, the theorem is currently "orphaned." But its *truth* (if arithmetical) is likely preserved; only our *justification* is broken.

  ## 6. Conclusion: Renovation, Not Demolition
  If $\neg\text{Con}(\text{ZFC})$ were discovered tomorrow:
  1.  **Set Theory:** Catastrophe. The study of the transfinite hierarchy would require a total reboot (New Foundations, HoTT, or a restricted ZF).
  2.  **Ordinary Mathematics:** Inconvenience. We would restrict formalizations to $\text{ACA}_0$ or $\text{ATR}_0$. Proofs relying on "proper classes" or large cardinals would need to be checked for reducibility.
  3.  **Science/Engineering:** No impact. Their mathematics lives in $\text{RCA}_0$ and $\text{WKL}_0$.

  The "Doomsday" narrative assumes mathematics is a monolith supported by a single pillar (ZFC). The Reverse Mathematics view reveals mathematics as a stratified arch. Removing the keystone (Power Set) might collapse the top, but the foundation (Arithmetic) and the lower arches (Analysis) remain standing.

  ***

  # Discussion Questions for Section
  1.  **Epistemic Security:** Is Gentzen's use of transfinite induction up to $\varepsilon_0$ actually "more secure" than ZFC Power Set, or is that just a historical artifact of Hilbert's Program? If we doubt ZFC, why don't we doubt $\varepsilon_0$?
  2.  **The "Orphaned Theorem":** Suppose a theorem in number theory is proven using a large cardinal axiom, and we later find that axiom is inconsistent. We haven't yet found a proof in PA. Should we suspend belief in the theorem? Does "provability" matter more than "truth" here?
  3.  **Convenience vs. Necessity:** If Grothendieck Universes make proofs shorter and more intuitive, but are technically "unsafe" (in this hypothetical), is it ethical for a mathematician to use them? Is mathematical practice a search for truth or a search for efficient compression?
  4.  **The Nature of the Contradiction:** If ZFC is inconsistent, the contradiction is likely non-constructive (we know $0=1$ is provable, but the proof might be astronomical in length). Does a "theoretical inconsistency" that never manifests in practice matter philosophically?
