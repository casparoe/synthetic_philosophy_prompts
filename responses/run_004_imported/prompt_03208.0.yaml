      *   *Refinement on "Evidence":* In EDT, $P(Other Cooperates | I Cooperate)$ is high. In CDT, it's just $P(Other Cooperates)$. The shift is in the decision theory, not just the physics.
      *   *Refinement on "Similarity":* Use the concept of "clustering" in algorithm space. I'm not correlated with *everyone*, just those in my cluster.
