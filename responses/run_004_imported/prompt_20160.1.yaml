      *   *Actionable Advice:*
          1.  **Transparency:** Admit the trade-off publicly. Don't hide the base rate difference.
          2.  **Focus on the Base Rate:** The real bias isn't the algorithm; it's the systemic inequality causing the base rate difference. The algorithm is a mirror.
