          2.  What advice should be given to the superintendent (is there a real answer beyond choosing a trade-off)?

  2.  **Identify the Core Statistical Concept:**
      *   This is a classic instance of the **Impossibility Theorem of Fairness** (often associated with Kleinberg, Mullainathan, and Raghavan, 2016; or Chouldechova, 2017).
      *   The specific conflict is between **Calibration** (District's claim: risk scores mean the same thing across groups) and **Balance/False Positive Rate Parity** (Parents' claim: labeling rates should be equal among those who succeed, or overall labeling rates should match population shares).
      *   The crucial constraint is the **Base Rate Difference**. Because the underlying outcome rates differ between groups (Latino students fall behind at higher rates due to systemic factors), you *cannot* simultaneously satisfy Calibration and Equal False Positive Rates (or Demographic Parity).

  3.  **Drafting the Explanation (Part 1: The Math/Logic):**
      *   Acknowledge the journalist's intuition: It's not a mistake; it's a mathematical constraint.
      *   Define the two fairness metrics at play:
          *   *Calibration (Predictive Parity):* If I say 70% risk, 70% of people in that group should fail. The district is right here.
          *   *False Positive Rate Parity (or Demographic Parity):* The rate at which successful students are flagged as risky should be the same across groups. The parents are right here.
      *   Explain *why* they conflict: Use the Base Rate.
          *   If Group A has a 20% failure rate and Group B has a 10% failure rate.
          *   To be *calibrated*, the model must assign higher average risk scores to Group A.
          *   If the model assigns higher average risk scores to Group A, it *must* flag more Group A students as "high risk" overall.
          *   Consequently, among those who *succeed*, more Group A students will have been flagged "high risk" (False Positives) simply because more of them were in the high-risk buckets to begin with.
      *   Conclusion on Q1: Neither side made a statistical mistake. They are optimizing for incompatible definitions of fairness.

  4.  **Drafting the Advice (Part 2: The Policy/Ethics):**
      *   The user asks what to tell the superintendent.
      *   Avoid the trap of saying "just pick one." While technically true, it's not helpful leadership advice.
