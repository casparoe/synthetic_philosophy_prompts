answer: |-
  Good evening. For those who don't know me, I'm [My Name], and I have the distinct privilege of being [Partner A]'s roommate and fellow philosophy major.

  When [Partner A] asked me to give this toast, she gave me one condition: it had to be "properly Lewisian." For the family, that refers to David Lewis, a philosopher who argued that social norms—like language, money, or driving on the right side of the road—aren't designed by kings or contracts. They emerge. They are conventions.

  Lewis says a convention has to be arbitrary. Now, I know what that sounds like to a room full of loved ones. It sounds like I'm saying this marriage is random. Or replaceable. But in Lewis's technical sense, "arbitrary" just means there was no law of nature forcing this outcome. You didn't *have* to end up here. There were other equilibria available. You could have lived apart. You could have driven on the left. The fact that you didn't—that you coordinated on *this* life, together—isn't a necessity. It's a choice you renew every single day. And that makes it infinitely more valuable than if it were written in the stars.

  This brings me to the evolutionary side of things. Brian Skyrms showed us that these conventions aren't signed once; they evolve through repeated play. [Partner A] and [Partner B], you didn't sign a contract on day one dictating who does the dishes or which side of the bed is whose. You played the game. You made mistakes. You adjusted. Those small, private rules you've accumulated—the nicknames nobody else is allowed to use, the specific way you make coffee—they weren't negotiated. They were selected for. They survived because they worked for *you*.

  And for my cohort in the back: I promise I won't call their love a Nash Equilibrium. But I will say that when they decided to move in together, they solved a coordination problem without a single explicit conversation. For the rest of you, that's intuition. For us, that's a Schelling point so salient it basically glowed.

  But Lewis faced a criticism: he explains why people *do* conform, but not why they *ought* to. [Partner A] wrote her thesis defending him on this, and I think this wedding proves her point. You *ought* to keep this convention because your expectations are now interdependent. You have built a world where the other person's happiness is a condition of your own.

  That is what Lewis called "common knowledge." It's not just that you know you love each other. It's that you know that they know that you know. It is a shared reality, iterated infinitely, stable against the noise of the world.

  So, let us raise a glass. To [Partner A] and [Partner B]. May your precedents be kind, your coordination be seamless, and may you never lose the common knowledge that you are on the same team.

  To the couple!
