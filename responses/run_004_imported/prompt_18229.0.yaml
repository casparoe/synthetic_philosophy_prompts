answer: |-
  The debate over multiple realizability (MR) stands as one of the central fault lines in the philosophy of mind. Hilary Putnam and Jerry Fodor famously argued that because mental states like pain can be realized by diverse physical substrates (C-fibers in humans, different ganglia in octopuses, silicon chips in robots), mental kinds cannot be identical to physical kinds. Consequently, they concluded, reductive physicalism is false, and psychology must remain autonomous from physics. Jaegwon Kim's response cuts through this dilemma by distinguishing between global and local reduction. Kim argues that MR only precludes a species-independent, global reduction; it leaves intact the possibility of structure-specific, local reductions.

  To argue for Kim's local-reduction strategy is to argue for a physicalism that is ontologically rigorous without being naively uniform. While critics charge that this victory is "hollow"—claiming that fragmenting mental kinds destroys the generalizations necessary for psychological science—this objection rests on a misunderstanding of what physicalism requires and how scientific generalizations function. Kim's strategy succeeds because it secures the causal efficacy of the mental and satisfies the ontological demands of physicalism, while preserving psychological generalizations as functional abstractions over locally reduced bases.

  ### The Case for Local Reduction

  Kim's primary insight is that Putnam and Fodor set the bar for reduction impossibly high. They assume that for physicalism to be true, there must be a single physical property $P$ such that for all $x$, $Mx \leftrightarrow Px$. MR demonstrates this is false. However, physicalism is fundamentally an ontological thesis: it claims that every particular instance of a mental property is constituted by, and dependent upon, a physical property.

  Local reduction satisfies this ontological commitment perfectly. While there is no "pain-as-such" physical kind, there is "pain-in-humans," which is identical to C-fiber firing, and "pain-in-octopuses," identical to a specific neural state in cephalopods. By restricting the scope of the identity claim to a specific physical structure or species, the reductionist avoids the MR counterexample without abandoning the identity theory.

  This move is not merely semantic; it is required to save mental causation. Kim's later work on the Exclusion Argument highlights the danger of non-reductive physicalism: if mental properties are not reducible to physical properties, and if the physical domain is causally closed, then mental properties risk being epiphenomenal. If pain is not identical to (or reducible to) C-fiber firing in humans, then it is the C-fiber firing that causes the withdrawal behavior, not the pain. Local reduction rescues the mental from epiphenomenalism by ensuring that in every specific context, the mental property *is* the physical property doing the causal work. Therefore, local reduction is not a retreat; it is the only way to maintain a causally robust physicalism.

  ### Addressing the "Hollow Victory" Objection

  The most potent objection to Kim's strategy is that it purchases ontological clarity at the cost of explanatory power. Critics argue that if "pain" is fragmented into "human-pain," "octopus-pain," and "robot-pain," we lose the ability to make general psychological laws. Science seeks generalizations (e.g., "Pain causes avoidance behavior"). If there is no unified kind "pain," but only a disjunction of disparate physical states, then psychology loses its subject matter. The reductionist saves physicalism, the objection goes, but kills psychology.

  This objection fails for three reasons. First, it conflates the *unity of the generalization* with the *unity of the physical realizer*. Second, it relies on an overly strict conception of "natural kind" that even hard sciences do not always meet. Third, it underestimates the role of functional abstraction in scientific explanation.

  **1. Functional Unity vs. Physical Unity**
  The objection assumes that for a generalization to hold, the *physical substrate* must be uniform. However, psychological generalizations are typically functional, not structural. The statement "Pain causes avoidance" is true not because humans and octopuses share a physical state, but because they share a causal role: a state triggered by damage and triggering withdrawal.

  Kim's local reduction does not deny this functional unity; it grounds it. We can maintain the generalization "Pain causes avoidance" as a higher-order abstraction, provided we understand that its *truth-maker* in any specific instance is a local physical reduction. The generalization ranges over a functional kind, while the ontology consists of locally reduced physical kinds. This does not eliminate the generalization; it merely clarifies its metaphysical basis. The victory is not hollow because the generalization remains valid at the functional level, even if the physical level is fragmented.

  **2. The Legitimacy of Disjunctive Kinds**
  Critics argue that the disjunction of all possible pain realizers ($P_{human} \lor P_{octopus} \lor P_{robot}$) is not a "physical kind" and thus cannot support laws. However, the demand for strict, non-disjunctive natural kinds is often overstated. In geology, "jade" refers to two distinct minerals (nephrite and jadeite). We accept generalizations about jade (e.g., "Jade is hard") despite its heterogeneous physical basis.

  Similarly, a disjunctive physical property can support causal generalizations if the disjuncts share relevant causal powers. In the case of pain, the diverse physical realizers are not random; they are selected precisely because they share the capacity to perform the pain-role (detecting damage, motivating avoidance). Therefore, the disjunction is not "gerrymandered" in a scientifically useless way; it is unified by causal profile. Local reduction allows us to say that in every instance, a physical property with the relevant causal power is instantiated. This is sufficient to underwrite the psychological generalization without requiring a single, monolithic physical kind.

  **3. Ceteris Paribus Laws and Explanatory Depth**
  Finally, the objection assumes that psychology requires strict, exceptionless laws akin to fundamental physics. But special sciences operate with *ceteris paribus* (all else being equal) laws. A local reductionist can argue that "Pain causes avoidance" is a summary of many specific local laws: "C-fiber firing causes withdrawal in humans," "Ganglia-state-X causes withdrawal in octopuses," etc.

  Far from eliminating the explanation, local reduction *deepens* it. Non-reductive physicalism leaves us with a "black box" where pain mysteriously correlates with avoidance across different species. Kim's strategy opens the box. It explains *why* the generalization holds: because in each structure, evolution (or design) has installed a physical mechanism that realizes the same causal profile. The fragmentation of the physical kind does not fragment the explanation; it multiplies the specific mechanisms that validate the general explanation.

  ### Conclusion

  Jaegwon Kim's local-reduction strategy offers the most defensible path for a rigorous physicalism. Putnam and Fodor correctly identified that a global type-identity theory is untenable given the diversity of life and potential AI. However, they incorrectly inferred that this necessitates autonomy for psychology or the abandonment of reduction.

  Kim demonstrates that we can have our physicalist cake and eat it too. By restricting reduction to specific physical structures, we secure the ontological claim that everything is physical and, crucially, we save mental causation from epiphenomenalism. The objection that this renders psychological generalizations impossible relies on the mistaken view that generalizations require uniform physical substrates. As long as we recognize psychological kinds as functional roles realized by diverse but locally reducible physical states, the generalizations remain robust.

  The victory is not hollow; it is substantive. It trades the comforting but metaphysically dubious idea of a single "mental stuff" for a nuanced picture where mental properties are causally potent because they are, in every specific instance, physical properties. This is precisely what a mature physicalism should aim for.
