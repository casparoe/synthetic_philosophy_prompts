      *   **Point 2: The "Private Citizen" Issue.** Aquinas generally forbids private violence. Resistance needs public authority (*auctoritas publicae*). Cite *Summa Theologiae* on sedition.
      *   **Point 3: The "Full Stop" Issue.** Aquinas is a prudential thinker. He warns against the *consequences* of resistance. It's not an automatic voiding of duty; it's a complex moral calculation.
      *   **Point 4: Historiographical Reasons.** Why do historians (Skinner, etc.) place the break later? Because the *concept* of individual right/standing changes. Aquinas is still within a corporate/hierarchical framework, not a liberal individualist one.
      *   **Point 5: Strategic Advice for the Dissertation.** Don't discard the genealogy, but nuance the Aquinas link. Maybe he's the *seed*, not the full bloom. Or focus on how later thinkers *misread* or *radicalized* him.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Academic, supportive but critical, rigorous.
