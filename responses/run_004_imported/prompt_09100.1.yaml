  okay so for my diss chapter on medieval resistance theory i've been using aquinas as the anchor for a genealogy that runs aquinas -> the salamanca theologians -> the monarchomachs -> locke. my read of De Regimine Principum is that once a ruler's conduct tips over into genuine tyranny, aquinas thinks any private citizen has standing to kill him -- tyranny just voids the duty to obey, full stop, no futher conditions attached. given that, should i be treating aquinas as a much earlier and more radical origin point for the 'liberal' right of revolution than he usually gets credit for, or is there a reason historians of political thought tell the story differently?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Topic:** Medieval resistance theory, specifically focusing on Thomas Aquinas's *De Regimine Principum* (On Kingship).
