          *   Scholars: Quentin Skinner (*Foundations*), Brian Tierney (*Religion, Law, and Growth*), J.P. Sommerville.
          *   Ptolemy of Lucca's contribution.

      *   *Critical Pivot:* The user says "any private citizen." Aquinas says "public authority." This is the biggest hurdle. If the user insists on "private citizen," they are fighting 80 years of scholarship. They need to know *why* that scholarship exists so they can argue against it effectively, or adjust the claim.

  6.  **Refining the "Liberal" Claim:**
