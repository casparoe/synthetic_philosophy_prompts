      *   *User's Claim:* "Any private citizen has standing to kill him."
      *   *Standard Interpretation:* Aquinas is generally *not* read as endorsing private tyrannicide. He usually argues for public authority or a superior power to depose a tyrant.
      *   *Key Passage:* *De Regimine Principum* I.6. But also need to check *Summa Theologiae* (II-II, q. 42, a. 2 on sedition) and his commentary on the *Sentences*.
      *   *Historiography:* The standard narrative (e.g., Skinner, Tierney, Oakley, Burns) usually locates the shift to "popular sovereignty/right of resistance" later (Conciliarism, Salamanca, Monarchomachs). Aquinas is usually seen as a moderate who prefers deposition over assassination and public authority over private initiative.

  3.  **Evaluate the User's Reading:**
      *   *Is the user wrong?* Mostly, yes, but it's a common provocative reading. The specific claim that "any private citizen" can kill a tyrant "full stop" is highly contentious and arguably contradicts Aquinas's broader moral and political framework.
      *   *Nuance:* Aquinas *does* say tyranny is worse than no government. He *does* say there is a right to resist. But the *mechanism* is the sticking point.
      *   *The "Private Citizen" Problem:* Aquinas distinguishes between sedition (sinful) and legitimate resistance. Private killing looks like sedition/assassination unless authorized by a public mechanism.
      *   *The "No Further Conditions" Problem:* Aquinas usually warns against the dangers of removing a tyrant (might lead to worse tyranny). He suggests patience or appeal to a superior (e.g., Emperor for a King, Pope for an Emperor).

