answer: |-
  This is a bold and ambitious thesis, and it touches on one of the most contested debates in the history of political thought. If you are writing a dissertation, you absolutely *can* make this argument, but you need to be aware that your reading of Aquinas runs counter to the dominant scholarly consensus for specific textual and conceptual reasons.

  If you proceed with the claim that Aquinas endorses **private** tyrannicide **without further conditions**, you will be fighting against roughly a century of historiography (from Acton to Skinner to Tierney). To make this stick, you need to understand exactly *why* historians treat him differently, so you can either dismantle those reasons or nuance your claim to make it defensible.

  Here are the four major landmines you need to navigate to sustain this genealogy.

  ### 1. The Authorship Problem (*De Regimine Principum*)
  The first hurdle is textual. *De Regimine Principum* (On Kingship) is not entirely by Aquinas.
  *   **The Consensus:** Aquinas wrote Book I and the first six chapters of Book II. The rest was completed by his student, **Ptolemy of Lucca**.
  *   **The Problem:** The most "radical" passages regarding resistance and the definition of tyranny often appear in the sections attributed to Ptolemy or are heavily influenced by his Aristotelian republicanism, which was more conducive to Italian civic liberty than Aquinas's broader natural law framework.
  *   **The Fix:** You must explicitly address the authorship debate. If your "radical Aquinas" relies on chapters written by Ptolemy, your genealogy starts with Ptolemy, not Aquinas. If you rely on Book I, Chapter 6 (the key text on tyranny), you have to read it very carefully against Aquinas's other works.

  ### 2. Private Citizen vs. Public Authority
  This is the biggest obstacle to your claim that "any private citizen has standing."
  *   **The Standard Reading:** In *Summa Theologiae* (II-II, q. 42, a. 2), Aquinas discusses sedition. He argues that resisting a tyrant is permissible *only* if it is done by **public authority**, not private presumption. He worries that private assassination leads to greater instability and worse tyranny.
  *   **The *De Regimine* Passage:** In I.6, Aquinas says that if a tyrant is intolerable, "it would not be sedition to disturb such a dominion." However, he immediately adds a prudential warning: often, removing a tyrant leads to worse dangers. He suggests that if there is no human recourse, one must have recourse to God (citing the Old Testament example of Ehud).
  *   **The Nuance:** Aquinas generally distinguishes between a *tyrannus in titulo* (usurper with no right to rule) and a *tyrannus in exercitio* (legitimate ruler who rules badly). Some scholastics allowed private action against the usurper, but almost none allowed it against the legitimate-but-abusive ruler without public authorization.
  *   **The Fix:** If you argue Aquinas allows *private* killing of a *legitimate* tyrant, you are making a "maximalist" claim. To defend this, you must argue that for Aquinas, tyranny voids the *ontological status* of the ruler, turning them into a private aggressor (a "wolf" rather than a "shepherd"), thereby making defensive killing permissible under natural law rather than "political resistance." But you must contend with his explicit warnings against private initiative in the *Summa*.

  ### 3. "Liberal" Right vs. Natural Law Duty
  You describe this as a "'liberal' right of revolution." Be careful with the anachronism.
  *   **The Historiography:** Historians like Quentin Skinner (*The Foundations of Modern Political Thought*) and Brian Tierney (*Religion, Law, and the Growth of Constitutional Thought*) locate the shift to "rights-based" resistance later (usually with the Conciliarists, the Salamanca school, or the Monarchomachs).
  *   **The Difference:** For Locke, resistance is a **right** grounded in individual property and consent. For Aquinas, resistance is a **moral necessity** grounded in the common good and natural law. Aquinas does not view the individual as the sovereign unit; the *community* (as a corporate body) is.
  *   **The Fix:** Instead of calling it a "liberal right," frame Aquinas as providing the **natural law precondition** for the later liberal right. He establishes that unjust law is "no law" (*Summa* I-II, q. 95, a. 2) and that tyranny violates the divine order. This creates the *space* for Locke, but Aquinas himself is not a liberal. If you claim he is, reviewers will flag it as conceptual confusion.

  ### 4. The Council of Constance (1415)
  You need to account for why later medieval and early modern thinkers were hesitant to cite Aquinas on this point.
  *   **The Context:** After Jean Petit justified the assassination of the Duke of Orléans in 1408 using scholastic arguments (heavily relying on Aquinas-like reasoning), the Council of Constance condemned the proposition that "any tyrant may be killed by any subject."
  *   **The Impact:** This made Catholic theologians (like the Salamancans) very careful. They had to distinguish their resistance theory from "tyrannicide." They emphasized **public deposition** over **private assassination**.
  *   **The Genealogy:** If you run the line Aquinas -> Salamanca -> Locke, you have to explain how the Salamancans (Vitoria, Suárez) navigated the Constance condemnation. They generally moved *away* from private killing and toward a theory of the community retaining the power to depose. This actually supports your genealogy, but it undermines your specific reading of Aquinas as endorsing *private* killing.

  ### Strategic Advice for the Chapter

  You don't have to abandon your thesis, but you should refine it to survive examination.

  1.  **Soften the "Private Citizen" Claim:** Instead of arguing Aquinas endorses *private assassination*, argue that Aquinas establishes that tyranny dissolves the **moral bond of obedience**. Whether the *mechanism* of removal is private or public is a secondary prudential judgment; the primary theoretical breakthrough is that the duty to obey is voided. This makes him the *theoretical* anchor, even if he is cautious about the *practice*.
  2.  **Focus on the "Voiding" Mechanism:** Your strongest point is that tyranny makes the ruler a private aggressor. If the ruler is no longer a "ruler" in the moral sense, killing them is not regicide; it is self-defense. This is the thread that connects Aquinas to Locke (who argues a tyrant puts himself in a "state of war" with the people).
  3.  **Acknowledge the Historiography:** Explicitly cite Skinner and Tierney. Say something like: *"While Skinner locates the right of resistance in the Machiavellian moment, and Tierney in the Conciliarists, I argue that the ontological groundwork is laid by Aquinas..."* This shows you know the field and are intervening, not ignoring it.
  4.  **Reframe the "Liberal" Label:** Call it a "proto-liberal" or "natural law" foundation. Argue that Locke secularizes and individualizes a mechanism Aquinas theologized and corporatized.

  ### Summary
  Historians treat Aquinas differently because he prioritizes **order and public authority** over individual resistance, and because his most famous text on the matter is partially authored by a student with different views.

  However, you can still make your argument if you pivot slightly: **Aquinas provides the *moral ontology* that makes resistance possible (tyranny = void of authority), even if he is cautious about the *political mechanics* (who strikes the blow).**

  If you claim he gives a "full stop, no conditions" right to *any private citizen*, you will likely be countered with *Summa Theologiae* II-II, Q. 42. If you claim he establishes that tyranny breaks the divine mandate of rule, rendering the tyrant liable to removal, you have a much stronger, defensible dissertation chapter.
