      *Wait, one nuance on Merricks:* In *Objects and Persons*, Merricks does argue that *some* organisms might exist, but his primary positive ontology is *persons*. He explicitly critiques van Inwagen's Organicism in Chapter 4. He argues that van Inwagen's criterion is too broad. So saying they reach the "same place" is definitely wrong.

