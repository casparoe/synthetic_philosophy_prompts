answer: |-
  Thank you all for being here.

  Walt left specific instructions for this moment. He told my mother that when the time came, we were not to say he "died so we could be free." He also said we were not to say "war is hell, and senseless." He said both of those things were lies. And if there was one thing Walt could not abide, it was a lie, especially a comfortable one.

  I am a novelist, not a philosopher. I deal in stories, not dialectics. So, standing here, looking at the family he loved and the books he wore out, I am tempted to smooth the edges. I am tempted to make his hard life fit into a soft box. But to do that would be to dishonor the man who held this room's attention for forty years at Thanksgiving, explaining why the wind is necessary for the sea, even if it makes the waves dangerous.

  We know who Walt was. He was the man with the paperback copy of Hegel's *Philosophy of Right* held together by gray masking tape. He was the man who flew supply runs over Korea in his twenties, and then spent the next seventy years trying to understand what that meant, not just for him, but for the world.

  Walt believed that a nation without the capacity for conflict is a nation without ethics. He believed that peace, if it is permanent, becomes stagnation. That was his truth. He carried it seriously. He didn't carry it lightly, and he certainly didn't carry it with joy. He carried it like a burden of logic.

  But we also know who else is in this room.

  We have Renata here. Renata, who served two tours. Renata, who knows the smell of the burn, the weight of the pack, and the cost of the wind Walt talked about.

  There is a tension here. I won't pretend there isn't. Walt spent his life arguing that war has a purpose in the ethical life of a state. Renata has lived the reality that war breaks the lives of the people within it.

  If Walt were here, he wouldn't want me to resolve that tension with a platitude. He would want us to hold both truths in the room at the same time.

  Walt's truth was intellectual. It was about the State, about history, about the long arc of sovereignty. But Renata's truth is human. It is about the blood, the loss, and the silence that comes after the guns stop.

  One of those truths is written in a book held together by tape. The other is written in the nervous system of the people who served.

  Walt would tell you that he respected the soldier more than the pacifist, not because the soldier was always right, but because the soldier accepted the risk of the dialectic. He put his body in the plane. He put his supplies on the line. And later, he put his mind on the line.

  So, how do we comfort this room? How do we comfort Renata, without softening Walt?

  We do it by acknowledging that Walt demanded we look at the world without blinking. He hated the phrase "war is hell" not because he didn't know war was hell, but because calling it "senseless" was an insult to the sacrifice. He believed the sacrifice *meant* something, even if that meaning was terrible.

  Renata, Walt knew what you know. He knew the cost. He spent seventy years staring at the bill. He just disagreed with you on who signed it.

  But tonight, we don't need to settle the argument. We need to honor the integrity.

  Walt was a man who refused to look away from the hard things. In a world that prefers slogans, he offered us complexity. In a world that wants to pretend war is either glorious garbage or garbage glory, he told us it was necessary tragedy.

  That is a heavy thing to leave behind. But it is an honest thing.

  The comfort we take today is not that Walt was right about everything. The comfort is that he was true to everything. He loved this family enough to give us his actual mind, not a sanitized version of it. He loved this country enough to argue with its deepest myths. And he respected the service enough to never call it meaningless.

  We can miss him without agreeing with him. We can love him without adopting his metaphysics. We can sit here, with his taped-up book in our memory, and Renata's service in our hearts, and acknowledge that the world is complicated, and that good people can carry different weights.

  Walt flew the supplies. He kept the line open. Then he came home and kept the conversation open.

  The wind has stopped for him. The sea is calm. He has put the book down.

  Rest now, Walt. We'll take it from here. We promise to keep thinking. We promise to keep arguing. And we promise not to lie.
