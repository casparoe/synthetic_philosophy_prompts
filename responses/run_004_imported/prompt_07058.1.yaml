prompt: |-
  In my formal epistemology seminar we recently covered Good's theorem: for a Bayesian agent facing a decision, the expected value of cost-free evidence is never negative, provided the agent conditionalizes on it and then chooses whatever act maximizes expected utility afterward. Two classmates of mine, Mara and Devon, got into a running argument about what this actually shows, and I'd like an impartial referee.

  (1) Mara opened by claiming the theorem proves a rational agent should always accept a free, no-strings look at more evidence before deciding, since declining it can never do better in expectation than accepting.

  (2) Devon objected with apparent counterexamples: people who turn down a free genetic test for a condition with no available treatment, or who ask a friend not to reveal how a film ends before they watch it, without thereby seeming irrational.

  (3) Mara replied that these aren't real counterexamples. Once dread or spoiled suspense is part of the payoff, "learn the result" and "stay ignorant" are two different acts, each with its own built-in utility, rather than a case of freely inspecting evidence before choosing an otherwise fixed act — so the theorem was never about situations like that.

  (4) Devon countered that this move only saves the theorem by making it unfalsifiable: whenever information seems to leave someone worse off, you can redescribe the case so that the harm was "really" part of the payoff of the act of learning, guaranteeing the theorem comes out true no matter what.

  (5) Mara granted that she couldn't say in general, in advance, which real-life decisions have the clean structure the theorem needs, but maintained that this only shows applying the theorem takes judgment, not that it is empty or unfalsifiable.

  Could you go through Mara and Devon's exchange move by move, saying who has the better of it at each of (1) through (5) rather than just declaring an overall winner, and flag anything important that you think both of them are overlooking about what Good's theorem does and doesn't license us to conclude about seeking out more information?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Good's Theorem (Value of Information) in formal epistemology/decision theory.
      *   **Context:** A seminar debate between two classmates, Mara and Devon.
      *   **Task:** Evaluate their exchange move-by-move (points 1-5), determining who has the better argument at each stage. Also, identify important overlooked aspects of the theorem.
      *   **Tone:** Impartial referee, philosophical/analytical.

  2.  **Deconstruct Good's Theorem:**
      *   *Core Claim:* For a Bayesian agent maximizing expected utility, the expected utility of obtaining cost-free evidence (and updating via conditionalization) before acting is at least as high as acting without that evidence.
      *   *Key Assumptions:*
          *   Bayesian updating (conditionalization).
          *   Utility depends *only* on the state of the world and the final act chosen (consequentialism).
          *   The act of observing evidence itself has no intrinsic utility/disutility (cost-free, no "news utility").
          *   The evidence does not causally influence the state of the world (evidential, not causal decision theory issues, though Good's theorem usually holds in CDT too under specific conditions).
          *   The agent *must* use the information to update beliefs before acting.

  3.  **Evaluate Move (1): Mara's Initial Claim.**
      *   *Claim:* Rational agents should *always* accept free evidence because declining can never do better in expectation.
      *   *Analysis:* This is the standard textbook statement of Good's Theorem. It follows mathematically from the assumptions.
      *   *Verdict:* Mara is technically correct *within the formal framework*. However, the word "always" in natural language implies real-world applicability without qualification, which is risky. But as a statement of the theorem's implication *given its premises*, she's right.
      *   *Referee Decision:* Mara wins on the formal logic, but needs to be careful about scope.

  4.  **Evaluate Move (2): Devon's Counterexamples.**
      *   *Claim:* People turn down genetic tests (no treatment) or movie spoilers. They don't seem irrational.
      *   *Analysis:* These are the classic "value of ignorance" counterexamples.
      *   *Genetic Test:* If there's no treatment, knowing doesn't change the act (medical intervention). But knowing causes anxiety (disutility).
      *   *Movie Spoiler:* Knowing ruins the experience (disutility).
      *   *Verdict:* Devon correctly identifies scenarios where the *standard assumptions* of Good's Theorem fail. Specifically, the assumption that the *act of learning* is utility-neutral. In these cases, learning *is* the payoff (or cost).
      *   *Referee Decision:* Devon wins on empirical adequacy. These are genuine challenges to the *unrestricted* application of the theorem.

  5.  **Evaluate Move (3): Mara's Rebuttal (Re-description).**
      *   *Claim:* These aren't counterexamples because "dread/suspense" makes "learn" and "stay ignorant" distinct acts with built-in utilities. The theorem assumes cost-free evidence *regarding the decision*, not utility-laden information states.
      *   *Analysis:* This is the standard defense in decision theory. Good's Theorem applies to *instrumental* value of information for decision-making, not *intrinsic* value/disvalue of the information state itself. If the information state enters the utility function directly, the "cost-free" assumption is violated.
      *   *Verdict:* Mara is theoretically correct. Good's Theorem is about the instrumental value of evidence for choosing *other* acts. If the evidence gathering is itself an act with consequences (psychological ones), it falls outside the specific scope of the theorem as usually formulated (where observation is a null-act).
      *   *Referee Decision:* Mara wins on theoretical precision. She correctly identifies the violated assumption.

  6.  **Evaluate Move (4): Devon's "Unfalsifiable" Charge.**
      *   *Claim:* This move makes the theorem unfalsifiable/trivial. You just redefine the utility function to save the theorem.
      *   *Analysis:* This is a serious philosophical charge (similar to criticisms of rational choice theory). Is it ad hoc?
      *   *Nuance:* It's not necessarily unfalsifiable, but it does shift the burden. The theorem becomes a conditional: *If* information has no intrinsic utility, *then* it has non-negative instrumental value. If we explain away every counterexample by positing intrinsic utility, does the theorem tell us anything substantive about the world?
      *   *Verdict:* Devon has a strong point about *empirical content*. If the theory can accommodate any behavior by adjusting the utility function, its predictive power is low. However, calling it "unfalsifiable" might be too strong; it's more that the *scope conditions* are being clarified. But Devon is right to worry about tautology.
      *   *Referee Decision:* Devon wins on methodological caution. Mara's defense risks making the theorem a tautology about "expected utility maximizers maximize expected utility."

  7.  **Evaluate Move (5): Mara's "Judgment" Defense.**
      *   *Claim:* Applying the theorem takes judgment; it doesn't mean the theorem is empty.
      *   *Analysis:* This is a standard philosophical defense of normative theories. Normative theories provide ideals or frameworks, not algorithms for every specific case without interpretation.
      *   *Verdict:* Mara is right that formal models require interpretation. However, she concedes she can't specify *in advance* when it applies. This weakens the "always" from Move (1).
      *   *Referee Decision:* Draw/Mara slightly. She is right about model application, but Devon's worry about vacuity remains relevant if the conditions are too hard to verify.

  8.  **Identify Overlooked Aspects:**
      *   *Computational Costs:* Good's theorem assumes cost-free. Real cognition has costs (time, effort).
      *   *Logical/Omniscience Assumptions:* Bayesian agents are logically omniscient. Real agents aren't.
      *   *Causal vs. Evidential:* In some Newcomb-like problems, information can be harmful (though Good's theorem generally holds in CDT if the info doesn't change the causal structure).
      *   *Dynamic Inconsistency:* Agents might plan to update but fail to (akrasia).
      *   *The "Blackwell Theorem" connection:* Good's theorem is essentially the decision-theoretic version of Blackwell's comparison of experiments.
      *   *Intrinsic vs. Instrumental:* This was touched on, but needs emphasis. Good's theorem is *only* about instrumental value.

  9.  **Drafting the Response:**
      *   *Structure:* Introduction -> Move-by-Move Analysis (1-5) -> Overlooked Considerations -> Conclusion.
      *   *Tone:* Academic, balanced, precise.
      *   *Content:* Ensure the distinction between *instrumental* and *intrinsic* value of information is clear. Ensure the distinction between *normative ideal* and *descriptive claim* is clear.

      *(Self-Correction during drafting)*: In Move (1), I need to be careful. Mara says "always." Good's theorem *does* say the expected value is non-negative. So strictly speaking, within the model, she is right. But the application to "a rational agent" in the real world is where the slip happens. I should credit her on the formal claim but note the hidden premises.
      In Move (4), Devon's charge of unfalsifiability is a classic critique of rational choice. I should validate that concern without dismissing the theorem entirely. It's about *ceteris paribus* conditions.

  10. **Final Polish:** Check against the prompt requirements. (Move by move? Yes. Flag overlooked stuff? Yes. Impartial? Yes.)

      *Refining the "Winner" for each:*
      1. Mara (Formally correct).
      2. Devon (Pragmatically correct).
      3. Mara (Theoretically correct distinction).
      4. Devon (Methodologically correct worry).
      5. Mara (Philosophically correct about models), but with a caveat.

      *Overlooked points:* Computational cost, logical omniscience, distinction between *seeking* info vs *being given* info, and the difference between *decision value* and *epistemic value*.

      *Let's write it.*
answer: |-
  Here is an impartial referee's report on the exchange between Mara and Devon regarding Good's Theorem (the Value of Information).

  ### Move-by-Move Analysis

  **(1) Mara's Initial Claim**
  *Claim:* A rational agent should always accept free evidence because declining can never do better in expectation.
  *Verdict:* **Mara is formally correct, but rhetorically overreaching.**
  Within the strict confines of the Bayesian decision-theoretic model, Mara is right. Good's Theorem mathematically demonstrates that for an expected-utility maximizer who conditionalizes, the expected utility of acting *after* observing cost-free evidence is greater than or equal to the expected utility of acting *without* it. The option to ignore the evidence is always available after seeing it, so seeing it effectively adds an option without removing any. However, Mara's use of "always" in a natural language context glosses over the heavy idealizations required for the proof (e.g., that the evidence is truly cost-free and has no intrinsic disutility). She states the theorem correctly but implies its applicability is broader than it is.

  **(2) Devon's Counterexamples**
  *Claim:* Real-world cases (genetic tests with no treatment, movie spoilers) show people rationally avoiding information.
  *Verdict:* **Devon is empirically correct.**
  Devon successfully identifies that the premises of Good's Theorem often fail in real-world contexts. In the genetic test case, the "act" (medical treatment) doesn't change, but the psychological state does. In the movie case, the information itself alters the utility of the consumption experience. These are not cases where information helps you choose a better *external* act; they are cases where the information state itself is a constituent of your well-being. Devon is right that if we take Mara's "always" literally, the theorem contradicts common intuitions about rationality in these specific cases.

  **(3) Mara's Rebuttal (Re-description)**
  *Claim:* These aren't counterexamples because dread/suspense makes "learning" an act with built-in utility, violating the "cost-free" assumption.
  *Verdict:* **Mara is theoretically correct.**
  Mara correctly identifies the specific assumption that Devon's cases violate. Good's Theorem concerns the *instrumental* value of information for decision-making, assuming the observation itself is utility-neutral. If the information causes dread or ruins suspense, the observation is not "cost-free" in the utility sense; it has negative *intrinsic* value. By distinguishing between the instrumental value of evidence (for choosing acts) and the intrinsic value of information states (knowing vs. not knowing), Mara preserves the mathematical integrity of the theorem. The theorem was never intended to cover cases where the knowledge itself is a good or a bad.

  **(4) Devon's "Unfalsifiable" Charge**
  *Claim:* Redefining the payoff to save the theorem makes it a tautology that can't be tested.
  *Verdict:* **Devon has the stronger methodological point.**
  Devon touches on a classic criticism of rational choice theory: the risk of vacuity. If every time an agent rejects information we simply posit "hidden costs" (like anxiety) to make the math work, the theory risks becoming an "all-weather" explanation that predicts nothing. While Mara is right that the utility function *should* include all relevant preferences (including anxiety), Devon is right to worry that this makes the theorem hard to apply normatively. If we can't independently verify whether the "cost of anxiety" outweighs the "instrumental benefit" without just looking at the agent's choice, the theorem tells us less about how agents *should* reason and more about how we can *describe* their reasoning.

  **(5) Mara's "Judgment" Defense**
  *Claim:* Applying the theorem requires judgment; this doesn't make it empty.
  *Verdict:* **Mara is philosophically sound, though she concedes ground.**
  Mara is correct that formal models are tools, not algorithms. No normative theory comes with a label specifying exactly when it applies to the messy real world; applying any theory (from physics to ethics) requires judgment about whether the idealizations hold. However, by admitting she cannot specify in advance which decisions have the "clean structure" the theorem needs, Mara implicitly concedes that her initial "always" in Move (1) was too strong. The theorem is a powerful consistency check, but not a universal command.

  ---

  ### Important Overlooked Considerations

  Both Mara and Devon are focused on the *utility* of information, but there are deeper structural issues regarding what Good's Theorem licenses that neither has fully addressed.

  **1. Computational Costs and Bounded Rationality**
  Good's Theorem assumes a Bayesian agent who can instantly and costlessly conditionalize. In reality, processing evidence takes time and cognitive effort. If the cost of *computing* the update exceeds the expected gain in decision quality, a bounded rational agent should reject the evidence. This is distinct from Devon's "dread" argument; this is a processing cost, not an emotional one. Good's Theorem does not apply to computationally limited agents.

  **2. The Distinction Between "Seeking" and "Receiving"**
  Good's Theorem is often interpreted as "you should seek information." Strictly, it proves you should not *refuse* information that is offered cost-free. There is a difference between passive acceptance (where the theorem holds) and active search (where there are search costs). Mara's initial claim ("accept a free... look") is safe, but if this bleeds into "go out and find evidence," the theorem no longer applies without modification.

  **3. Logical Omniscience and "Surprise"**
  The theorem assumes the agent knows all possible partitions of evidence and their likelihoods in advance. It does not account for "unknown unknowns"—evidence types the agent didn't anticipate. If an agent suspects that learning something might shatter their current framework (a paradigm shift) in a way they cannot currently model, the standard expected utility calculation breaks down.

  **4. Causal vs. Evidential Decision Theory**
  While Good's Theorem generally holds in both Causal (CDT) and Evidential (EDT) Decision Theory, there are niche "Newcomb-like" scenarios where having information can be detrimental in CDT if the information is correlated with the state of the world in a way that limits your causal options (e.g., if a predictor only gives you evidence if you are going to make a specific choice). Both students are assuming a standard decision environment where evidence is causally inert regarding the state of the world.

  **5. Epistemic vs. Pragmatic Value**
  Finally, both students are conflating *pragmatic* rationality (maximizing utility) with *epistemic* rationality (maximizing accuracy/truth). Good's Theorem is purely pragmatic. It is possible that seeking evidence maximizes expected utility (per Good) but minimizes accuracy (e.g., if a false belief makes you happier and more successful). Conversely, one might have a duty to know the truth (epistemic value) even if it lowers expected utility (violating Good's pragmatic recommendation). The theorem says nothing about the intrinsic value of truth.

  ### Summary Recommendation
  Mara wins on the **formal interpretation** of the theorem (Moves 1 and 3), while Devon wins on the **empirical and methodological application** (Moves 2 and 4). Move 5 is a draw, acknowledging the limits of formal modeling.

  The seminar should conclude that Good's Theorem is a robust result *within* idealized Bayesian decision theory regarding the **instrumental** value of information. It is not a universal command for real-world agents, who face computational costs, intrinsic preferences about ignorance, and framework uncertainties that the theorem explicitly brackets out.
