answer: |-
  **The Scenario: The Contrarian Short**

  You are a high-frequency trader holding a "short" position, meaning you only profit if a stock's price *crashes*. You have insider knowledge that a catastrophic glitch will hit one of two major tech giants today: **OmniCorp** or **AeroDyne**. One of them will tank; the other will stay stable. You need to know which one to short.

  Opposing you is "The Stabilizer," a market-making AI designed to prevent crashes. The Stabilizer has a perfect model of your psychology. It knows that wherever you *decide* to place your short bet, that is where the market will panic, triggering the glitch. To prevent the crash, the Stabilizer injects massive capital into whichever company it predicts you will target, artificially inflating the price and neutralizing the glitch.

  You want to short the company that crashes. But the Stabilizer has already positioned its capital based on its prediction of your move.
  *   If you settle on shorting **OmniCorp**, you realize the Stabilizer predicted this and propped up OmniCorp. The price won't crash; you'll lose money. So you switch to **AeroDyne**.
  *   But the moment you settle on **AeroDyne**, you realize the Stabilizer predicted *that* switch instead. It propped up AeroDyne. Now *that* one won't crash.
  *   You are trapped in a loop where finalizing your choice is the very evidence that the choice will fail.

  **Why this is "Death in Damascus" and not Newcomb**

  In Newcomb's Problem, the prediction is a fixed event in the past (the money is already in the box); changing your mind now doesn't change the box's content, only your payoff. In this scenario (and Death in Damascus), the prediction is logically tied to your *current* decision process. The "trap" isn't set in stone; it moves to match your final intention. Because your reasoning process ("I should choose A") is what identifies the trap, you can never reach a stable equilibrium where you feel safe choosing either option.
