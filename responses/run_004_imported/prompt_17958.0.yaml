  **MEMORANDUM**

  **TO:** Incident-Response Tooling Review Board
  **FROM:** [Your Name/Role]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Probability Distribution Update Logic for On-Call Automation

  ### Executive Summary

  I recommend we **halt the current rollout** and reject both the existing Minimum KL-Divergence (MinKL) behavior and the proposed "Cluster-Local" patch. Instead, we will implement a **Hierarchical Conditional Update** mechanism (Option 3).

  This approach preserves the operational intuition Engineer 1 requires (learning about US internals does not shift belief away from the US cluster) while addressing Engineer 2's valid concern that hard-coding a "Cluster > Service" hierarchy is arbitrary. We will achieve this by explicitly modeling subsystem dependencies in the configuration rather than patching the math ad-hoc.

  **Target Rollout Date:** November 17, 2023 (3-week timeline)

  ### Context and Problem Analysis

  Our automation maintains a probability distribution over four subsystems ($U_G, U_A, E_G, E_A$) to guide paging. When a signal provides a conditional constraint (e.g., "If US, then Gateway is 3x Auth"), the current MinKL algorithm minimizes information gain across the *flat* distribution.

  **The Current Behavior:**
  The bot reduces the total probability mass of the US cluster (50% $\to$ 47%) and shifts it to the EU cluster. Mathematically, this occurs because the constraint forces the US distribution to become less uniform (lower entropy). To minimize KL divergence from the uniform prior, the optimizer penalizes the "more ordered" US cluster and rewards the "maximally uncertain" EU cluster.

  **The Conflict:**
  *   **Engineer 1** argues this is a bug. Operationally, a signal about US internals should not reduce confidence that the incident is in the US. They propose freezing the US/EU marginal split.
  *   **Engineer 2** argues the fix is arbitrary. Protecting the "Cluster" split privileges one ontology over others (e.g., "Gateway vs. Auth" global split). They argue MinKL is the only mathematically principled, assumption-free update.

  ### Recommendation: Hierarchical Conditional Update

  We will implement a third option: **Configurable Conditional Independence.**

  1.  **Model Change:** Subsystems will no longer be treated as four atomic buckets. They will be modeled as a product of marginals and conditionals: $P(Cluster) \times P(Service | Cluster)$.
  2.  **Signal Tagging:** Incoming signals must declare their scope. The signal "If US, then 3:1" is tagged as a *conditional update* on $P(Service | US)$.
  3.  **Update Logic:** The system updates only the targeted conditional probability table. $P(Cluster)$ remains untouched unless a signal explicitly addresses cluster-level likelihood.

  **Why this wins:**
  *   **Operational Trust:** It prevents the counter-intuitive behavior where learning more about a failure mode makes that failure mode seem less likely globally.
  *   **Mathematical Integrity:** It removes the "arbitrariness" charge. We are not hard-coding a preference for Clusters; we are explicitly declaring the independence assumptions in the configuration. If we later define a "Service-First" hierarchy for a different class of alerts, the system supports it.

  ### Rollout Timeline

  *   **Week 1 (Oct 26 – Nov 2):** **Schema Design.** Define the configuration format for hierarchical dependencies and signal scoping tags. Freeze current bot deployment.
  *   **Week 2 (Nov 3 – Nov 10):** **Implementation & Unit Test.** Implement the conditional update engine. Verify that "Global" signals (e.g., "Auth is down everywhere") correctly propagate across clusters, while "Local" signals do not leak.
  *   **Week 3 (Nov 13 – Nov 17):** **Shadow Mode & Rollout.** Run the new logic in shadow mode against historical incidents to compare paging decisions. If divergence is within tolerance, enable for live traffic.

  ### Substantive Treatment of the Counter-Argument

  While I am rejecting Engineer 2's call to keep the flat MinKL logic, their strongest point requires honest acknowledgment: **MinKL is uniquely assumption-free.**

  Engineer 2 is correct that by adopting a hierarchical model, we are introducing a structural bias. We are asserting that $P(Service)$ is conditionally independent of $P(Cluster)$ absent specific evidence. If the reality is that a specific auth library is shared across US and EU, a "US-Auth" failure *should* statistically increase the likelihood of "EU-Auth" failure due to the common cause.

  The flat MinKL approach captures this correlation implicitly; if US-Auth becomes highly probable, the global "Auth" entropy drops, potentially shifting mass in ways that reflect shared risk. Our new Hierarchical model, by strictly isolating $P(Service | US)$ from $P(Service | EU)$, risks blinding the bot to cross-cluster common-cause failures unless explicitly configured to handle them.

  **Mitigation:** To address this, the Week 1 schema design will include a "Coupling" configuration. Engineers can tag services as "Shared" or "Isolated." If "Auth" is tagged as Shared, a signal on US-Auth will propagate a prior update to EU-Auth. This retains Engineer 2's desire for correlation sensitivity without sacrificing Engineer 1's requirement for marginal stability.

  ### Conclusion

  The current MinKL behavior is mathematically sound but operationally hazardous. Engineer 1's patch fixes the symptom but hardens the bias. The proposed Hierarchical Conditional Update resolves the incident-response intuition while making our modeling assumptions explicit and configurable.

  Approval is requested to proceed with the Week 1 Schema Design.
