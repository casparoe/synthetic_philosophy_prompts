      *   **Nahmanides' Objection (Commentary on Leviticus 1:9):** Sacrifice existed *before* idolatry (Abel, Noah, Patriarchs). Therefore, it cannot be merely a concession to idolatrous habits. It has intrinsic spiritual value.
      *   **Task:** Argue that Maimonides' theory can be *defended* against Nahmanides' objection.
      *   **Key Question:** Does pre-Sinaitic sacrifice undermine Maimonides, or is there a principled distinction that saves his theory?

