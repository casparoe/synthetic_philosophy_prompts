answer: |-
  The soup had formed a skin. It was a yellowish, congealed film that stretched across the surface of the broth, trembling slightly when Kurt shifted the bowl with a trembling hand.

  Adele was in the hospital. It had been weeks. The silence in the house on Mercer Street was not empty; it was heavy, pressurized, like the air before a storm. Without her, the kitchen was a laboratory of hazards. The locks on the refrigerator felt flimsy. The seals on the cans were suspect. Only Adele was a constant, a verified axiom in a system of variables he could no longer trust. But Adele was gone, and the system was becoming inconsistent.

  Kurt pushed the bowl away. The spoon clinked against the china, a sharp, final sound.

  He was not afraid of the dark. He was not afraid of the end. In fact, he was quite certain there would be no end. That was the irony that kept him warm in the drafty study while his body grew cold. He sat in his high-backed chair, a shawl wrapped around shoulders that jutted like coat hangers beneath his pajamas. On the desk before him lay a draft of a letter. Not to a colleague, not to a journal. To his mother. She was long dead, of course, but the arguments remained.

  *The world as we know it is rational,* he had written to her, the ink flowing in his precise, spidery hand. *It is ordered by laws, not chaos.*

  He closed his eyes and recited the proof to himself. It was beautiful, in its way. More elegant than the incompleteness theorems that had made him a ghost in his own lifetime.

  Premise one: The universe is a rational structure. It does not waste.
  Premise two: The human mind possesses infinite potential for development, for moral and intellectual growth.
  Observation: A single lifetime is insufficient to realize even a fraction of this potential.
  Conclusion: Therefore, a rational universe must provide the necessary conditions for this potential to be realized. Death is not a termination; it is a transition. To think otherwise is to assume the Creator is a bungler who builds an engine capable of infinity and shuts it off after a few decades.

  It was a cosmological argument for the soul. It relied on the Principle of Sufficient Reason. It was sound.

  And yet, his hand shook as he reached for the water glass. He inspected the rim. Was there a residue? He couldn't be sure. The senses were fallible instruments. They could be tampered with. The food could be poisoned. The logic of the afterlife was pure, derived from the *a priori*, but the food was *a posteriori*. It was empirical. And empirical data was corruptible.

  He remembered the walks.

  The image rose up, unbidden and vivid. The Institute for Advanced Study. The Princeton woods. Albert walking beside him, his hair a white halo, his gait shuffling. They were the two exiles, talking in German, talking about Leibniz, about Kant, about the nature of time.

  Near the end, Albert had stopped talking about field equations. He had stopped talking about the unified theory that refused to unify.

  *"I come to the office no longer for the work, Kurt,"* Albert had said, stopping to lean on his cane, the autumn leaves crunching underfoot. *"The equations... they do not sing anymore. I come for the walk. I come to talk to you."*

  Kurt had felt a surge of pity then, mixed with pride. Einstein, the giant, reduced to seeking comfort in conversation. But now, sitting in the silence of the house, Kurt understood. Albert hadn't been seeking comfort. He had been seeking consistency. In a world of shifting physics and political madness, their walk was a closed loop. It made sense.

  *"You worry too much about the body, Kurt,"* Albert had said once, noticing Kurt's careful inspection of a thermos. *"The spirit is the thing that matters."*

  *"The spirit requires a vessel, Albert,"* Kurt had replied.

  *"Does it?"* Albert had smiled, a sad, crinkled expression. *"Or does the vessel merely hinder the spirit?"*

  Kurt looked down at his own hands. They were skeletal. The veins were blue rivers on a map of parchment. He was starving. The doctors would call it malnutrition. They would call it paranoia. They would say the great logician had lost his mind.

  They were wrong. His mind had never been sharper. The clarity was terrifying.

  He realized now that the starvation was not a contradiction of his philosophy. It was a verification of it.

  If the world was rational, and if the self was eternal, then the body was merely a temporary constraint. A boundary condition. To fear the poison was to acknowledge the vulnerability of the boundary. To refuse the poison was to assert the independence of the interior.

  If he ate, he risked the vessel. If he starved, he accelerated the release of the content.

  Adele would be angry. She would fuss. She would boil the meat and taste it first, as she always did. She was the only one who understood that his fear was not madness, but a rigorous demand for safety that the world could not meet. She was his interpreter. Without her, the translation failed.

  He stood up, the room tilting slightly. He walked to the window. The Princeton night was black, dotted with the lights of other houses, other lives burning themselves out.

  He thought of the letter to his mother again. *It would be contrary to the rationality of the world if the development of the personality were to be broken off abruptly.*

  He was not breaking it off. He was simply turning the page.

  The hunger was a dull ache now, a distant signal from a failing machine. It was no longer a command; it was noise. He felt a strange lightness, a decoupling. The fear of the poisoned soup remained—it was a logical precaution against a hostile environment—but it no longer carried the weight of terror. Why fear the poisoning of a suit you are about to discard?

  He returned to the desk and dipped his pen. He added a postscript to the letter he would never send.

  *Do not mourn the cessation of breath. The argument does not depend on the lungs. The proof holds regardless of the paper it is written on.*

  He capped the pen. The house was silent. The soup was cold.

  Kurt Gödel sat back in the chair and folded his hands in his lap. He closed his eyes and began to work on the next theorem. It was a big one. It required no axioms. It required no food. It was the proof of the walk without the walker, the thought without the brain, the continuation of the conversation after the friend has gone home.

  It was consistent. It was complete.

  And for the first time in months, he was not hungry.
