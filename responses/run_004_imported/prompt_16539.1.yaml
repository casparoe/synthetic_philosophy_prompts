  *(Self-Correction during drafting)*: I need to make sure I don't make the paranoia look *irrational* to him. To Gödel, it was a hypothesis based on evidence (in his mind). The story must respect his internal logic even while showing the tragedy. The bridge is that he trusts the *abstract* logic more than the *sensory* input.

  11. **Final Polish:** Enhance the imagery of the "walk" and the "letter." Make the transition from the fear of poison to the hope of survival feel like a logical step.

