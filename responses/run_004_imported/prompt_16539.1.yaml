          *   Include Adele (his wife) or memories of her (she was hospitalized before he died).
          *   Include memories of Einstein (their walks).
          *   Tone: Introspective, capturing the "inside" feeling of holding these contradictory convictions.
          *   Format: Short story.
          *   Constraint: No biography lesson, take license with scenes/dialogue.
      *   **User Background:** Retired experimental physicist, appreciates Gödel's incompleteness, knows the Einstein/Gödel walk story.

  2.  **Determine the Setting and Mood:**
      *   **Setting:** Princeton Hospital (where he died) or his home just before. The prompt mentions he starved when Adele was hospitalized. So, the setting should be the period when Adele is away, and he is refusing to eat. Let's place him in his study or dining room, looking at food he won't touch.
      *   **Mood:** Melancholy, cerebral, fragile, claustrophobic. The mind is sharp but the body is failing. The logic is pristine, but the instinct is broken.

  3.  **Drafting - Scene by Scene:**

      *   **Scene 1: The Food.** Establish the immediate physical reality. The plate is there. The fear is there. He is thin, weak. Adele is gone (hospital).
      *   **Scene 2: The Letter/Memory.** He is writing or thinking about the letter to his mother. This is where the "rational afterlife" argument comes in. It needs to be articulated clearly. *Premise: The world is rational. Premise: Human potential is infinite. Conclusion: Death cannot be the end.*
      *   **Scene 3: Einstein.** A memory of the walks. Einstein's comment about working for the walk. This connects the intellectual heroism to the human vulnerability.
      *   **Scene 4: The Contradiction.** Bringing the two threads together. How can the same mind hold the proof of eternity and the fear of a sandwich?
      *   **Scene 5: The End.** Not necessarily the moment of death, but the acceptance of the transition. The logic wins over the biology.

  4.  **Developing the Voice:**
      *   Gödel's internal monologue should be precise, logical, yet increasingly detached from physical reality.
      *   Use mathematical/logical metaphors (axioms, proofs, consistency).
      *   Avoid making him sound "crazy" in a chaotic way; his paranoia was systematic to him.

  5.  **Refining the Afterlife Argument:**
      *   The prompt specifies: "The world is rational, every person has this enormous capacity for development that almost never gets close to finished in one lifetime, so a genuinely 'rational' world wouldn't just switch someone off before that development is done."
      *   I need to weave this into the narrative naturally. Maybe he's revisiting the letter in his head.

  6.  **Writing - Iteration 1 (Mental Outline):**
      *   Kurt sits at the table. Soup is cold. Adele is in the hospital. He can't eat.
      *   He thinks about his mother. He wrote to her about death.
      *   He thinks about Albert. The walks.
      *   He realizes the irony. He proved the mind goes on, but he can't keep the body going.
      *   He closes his eyes.

  7.  **Writing - Iteration 2 (Adding Depth & Texture):**
      *   *Sensory details:* The clink of the spoon, the dust motes, the coldness of the room.
      *   *The Logic:* Make the argument sound like a theorem. If $W$ is rational and $P$ is potential, then $\neg D$ (not death).
      *   *The Paranoia:* It's not just fear; it's a failure of the axiom system regarding food. The food is an external variable he cannot verify.
      *   *The Connection:* The body is just a vessel. If the mind persists, the body's failure is irrelevant. That's how he reconciles it.

  8.  **Drafting the Content (incorporating the prompt's specific requests):**
      *   *Opening:* The bowl of soup. Adele's absence.
      *   *Middle:* The letter to his mother. The argument about "wasted potential."
      *   *Einstein:* The Institute walks. Einstein's confession.
      *   *Climax:* The realization that the starvation is consistent with the logic. If the self survives, the hunger is temporary.
      *   *Ending:* Peaceful resignation.

  9.  **Polishing:**
      *   Check the tone. Is it respectful? Yes.
      *   Is the physics/logic accurate enough for a physicist reader? Use terms like "consistency," "axioms," "system."
      *   Ensure the emotional weight lands. The tragedy isn't just the death, it's the split between the infinite mind and the fragile body.

  10. **Final Review against constraints:**
      *   Short story? Yes.
      *   Last year or so? Yes.
      *   Afterlife reasoning as load-bearing? Yes, central to his comfort.
      *   Adele/Einstein included? Yes.
