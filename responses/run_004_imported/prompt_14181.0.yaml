answer: |-
  Here are 10 interview questions designed to be respectful but intellectually rigorous. They are structured to prevent your guest from settling into a lecture mode and force them to defend the implications of the "paraconsistent" (true contradiction) reading.

  I have included the three specific requirements you asked for, plus seven others that cover the practical, logical, and soteriological stakes.

  ### 1. The "No Thesis" Trap (Vigrahavyavartani 29)
  **Question:** "In the *Vigrahavyavartani*, verse 29, Nagarjuna says: 'If I had any thesis, I would be at fault. But I have no thesis, so I am faultless.' If your reading is correct, and Nagarjuna is endorsing the view that 'some contradictions are literally true,' doesn't that count as a thesis? How do you claim he has 'no thesis' while simultaneously attributing a very specific, controversial metaphysical claim to him?"

  *   **Follow-up (If he says it's a 'therapeutic' thesis):** "If it's just therapy, does the therapy work if the patient doesn't believe the medicine is real? If I tell a meditator 'suffering is literally bliss' to cure them of attachment, but that statement is false, isn't that just a noble lie rather than emptiness?"

  ### 2. Samsara and Nirvana (MMK 25.19)
  **Question:** "Let's look at the famous verse in Chapter 25: 'There is not the slightest difference between samsara and nirvana.' On the standard reading, this is about perspective—seeing through the illusion. On your reading, is this an ontological claim? Are you saying the *thing itself* is both suffering and cessation simultaneously, or just that our descriptions of it contradict?"

  *   **Follow-up (If he says it's ontological):** "If the contradiction is in the world and not just in language, does that mean the arhat who has ceased suffering is still literally suffering? At what point does 'true contradiction' stop being a philosophical insight and start sounding like a denial of the Buddha's core promise to end dukkha?"

  ### 3. The Tetralemma Eating Its Own Tail
  **Question:** "I want to run the tetralemma on itself. If the four corners are: 'It is,' 'It is not,' 'Both,' and 'Neither'—which corner does the tetralemma itself fall into? Is the tetralemma true, false, both, or neither? If it's 'neither,' why should we use it? If it's 'both,' does that mean logic is both valid and invalid?"

  *   **Follow-up (If he says it's 'empty' so it doesn't apply):** "If the tetralemma is empty of its own nature, does it have the power to negate anything else? A knife that has no edge can't cut. If the tetralemma has no logical force of its own, how does it cut through other views?"

  ### 4. The Two Truths and Contradiction
  **Question:** "Nagarjuna relies heavily on the Two Truths: Conventional and Ultimate. Usually, contradictions are resolved by saying 'X is true conventionally, but false ultimately.' If you allow true contradictions, do they exist at the conventional level, the ultimate level, or both? If contradictions exist conventionally, doesn't that make daily life incoherent?"

  *   **Follow-up (If he says only at the Ultimate level):** "But Nagarjuna says there is no ultimate truth without relying on the conventional. If the ultimate is contradictory, and the ultimate depends on the conventional, doesn't that contagion of contradiction spill over into our everyday reality? How do I drive a car if 'stop' and 'go' can be both true?"

  ### 5. The Risk of Dogmatism
  **Question:** "One of the main criticisms of the Garfield/Priest line is that it turns Madhyamaka into just another 'ism'—Dialetheism. Traditionalists say Nagarjuna wants to free you from *all* views, including the view that reality is contradictory. Are you worried that by positing 'true contradictions,' you're giving practitioners a new object to cling to?"

  *   **Follow-up (If he says clinging is impossible):** "If clinging is impossible because everything is empty, why did the Buddha spend 40 years teaching ethics and meditation? If the view of 'true contradiction' prevents clinging, isn't that view itself a form of grasping at wisdom?"

  ### 6. Logic vs. Reality
  **Question:** "When you say contradictions are true, are you saying human logic is broken, or that reality is broken? In other words, is the contradiction in the map, or in the territory? Nagarjuna often seems to target language and concepts (prapañca), not the world itself."

  *   **Follow-up (If he says map and territory are inseparable):** "If they are inseparable, then fixing the map should fix the territory. But I can accept contradictions intellectually and still feel anger when I'm insulted. If the contradiction is real, why doesn't realizing it instantly liberate me from emotional reactivity?"

  ### 7. The "View of No View"
  **Question:** "There's a verse where Nagarjuna says, 'Emptiness is the relinquishing of all views. Those for whom emptiness is a view, them have I called incurable.' If I adopt your reading, I am holding the view that 'reality is inconsistent.' Is that an incurable view? How is this different from holding a view about the nature of reality?"

  *   **Follow-up (If he says it's a 'non-assertive' view):** "What does 'non-assertive' mean in practice? If I ask you 'Is there a god?' and you say 'Both yes and no,' you have asserted something about the world. How do you assert a contradiction without actually making a claim?"

  ### 8. Practical Soteriology (Meditation)
  **Question:** "I came to this through meditation, not a philosophy department. For a meditator on the cushion, what is the practical difference between 'concepts don't capture reality' (the traditional reading) and 'reality is contradictory' (your reading)? Does one lead to calmness and the other to confusion?"

  *   **Follow-up (If he says it leads to greater openness):** "Could it also lead to passivity? If 'abuse is non-abuse' is a true contradiction, does that disarm me from fighting injustice? How do you ensure this reading doesn't become a philosophical excuse for tolerating harm?"

  ### 9. The Law of Non-Contradiction
  **Question:** "Aristotle said the Law of Non-Contradiction is the most certain of all principles. Nagarjuna seems to dismantle it. But if I reject that law, can I still communicate? When you speak to me, are you relying on me assuming your words *don't* mean their opposite?"

  *   **Follow-up (If he says communication works paraconsistently):** "Does it though? If I tell you 'The door is open' and 'The door is closed,' and you accept both as true, you won't walk through the door. Doesn't successful action require assuming non-contradiction, even if reality is contradictory?"

  ### 10. What Gets Lost?
  **Question:** "Finally, let's play devil's advocate. What do we *lose* by reading Nagarjuna this way? Is there a value in the traditional, skeptical reading that says 'we just can't know,' rather than 'we can know, and it's contradictory'? Does the mystery matter more than the logical solution?"

  *   **Follow-up (If he says we lose nothing):** "If we lose nothing, why is this reading controversial? Perhaps the controversy exists because something vital is at stake. Is it possible that turning emptiness into a logical system domesticates the very shock Nagarjuna intended?"

  ### Tips for the Interview
  *   **Don't let him define terms too early:** If he starts defining "paraconsistency" for 5 minutes, interrupt gently: "I get the definition, but I want to know what it *does* to the text."
  *   **Watch for the "Conventional" Dodge:** This is the most common escape hatch. When cornered, these philosophers often say, "Well, conventionally, we act as if logic holds." Push back: "If conventionally logic holds, why teach a philosophy that says it doesn't?"
  *   **Keep it grounded:** Since you mentioned your meditation background, use that. Whenever he gets too abstract, ask: "What does this look like on the cushion?"

  Good luck with the podcast! This is a fascinating debate to host.
