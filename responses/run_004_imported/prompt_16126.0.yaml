prompt: |-
  I'm preparing to interview a guest for a philosophy-of-mind podcast episode on machine understanding. The guest is a computational linguist who defends a strong 'stochastic parrots' position: that large language models manipulate linguistic form without any access to meaning, so that any appearance of understanding is just sophisticated mimicry of a communicative intent the system never actually had. Her preferred illustration is a version of Bender and Koller's octopus thought experiment, and she maintains that no amount of further scaling on text alone could close the gap to genuine understanding. Draft seven or eight interview questions that go beyond having her restate the position: include at least one question on how the view accommodates the 'Othello-GPT' result, in which a transformer trained only on sequences of Othello moves appears to develop an internal representation of the board state that causally affects its predictions; one on why prediction-based accounts of human cognition (predictive-processing theories, on which the brain is essentially engaged in continuous next-input prediction) should not count as 'mere statistics' by the same standard she applies to transformers; and one on whether multimodal training that grounds language in image or video data would change her verdict. For each of these, note the response she is most likely to give and add a follow-up question keyed to it, and close with a question about what empirical result, if any, would count as evidence against her view.
