answer: |-
  **Setting:** *The coffee break area of the Conference Center for Normative Ethics. The air smells of stale espresso and dry-erase markers. Two philosophers, ELENA (Total Utilitarian) and MARCUS (Critical-Level Utilitarian), stand by a high-top table, nursing paper cups.*

  **Marcus:** You looked uncomfortable during the Q&A, Elena. When the moderator asked you to describe World Z again.

  **Elena:** Did I? I suppose I was bracing for the usual horror. It's the Repugnant Conclusion, Marcus. Everyone treats it like I'm advocating for a gulag.

  **Marcus:** Isn't it? A world of billions upon billions, where the best things in life are muzak and potatoes, where no one experiences deep love, art, or triumph... and you say that's *better* than a world of ten million people living in sublime ecstasy.

  **Elena:** Better *in the aggregate*. I'm not saying it's better for the individuals in World A to be swapped into World Z. I'm saying the total sum of well-being in Z is higher. If every life in Z is barely worth living, it is still *worth living*. It is a positive. Why is it so hard to accept that ten billion positives outweigh ten million positives, even if the individual units are smaller?

  **Marcus:** Because value isn't just a fluid you pour into a bucket. It has structure. If you dilute the quality of existence enough, you lose the very thing that makes value valuable. But let's talk about the price of your purity. You accept the Repugnant Conclusion to avoid the Sadistic Conclusion. You pride yourself on the Non-Sadism Condition: that adding a suffering life is never better than adding a happy one.

  **Elena:** Obviously.

  **Marcus:** Is it? Let's make it concrete. Suppose we have a policy choice for a new off-world colony. Option One: We populate it with a million people who will have lives that are good, genuinely happy, but—by my lights, and arguably common sense—just below the "critical level" of excellence required to justify bringing someone into existence. Maybe it's a bit precarious, high stress, no art, just survival and mild contentment.

  **Elena:** Positive welfare.

  **Marcus:** Right. Positive, but below the critical threshold. Option Two: We populate it with a smaller group, but the colony fails partially. A few hundred people are born into it who will suffer terribly. Short, painful lives. Negative welfare. Total Utilitarianism says Option One is mandatory. You must add the million mild lives rather than the few suffering ones.

  **Elena:** Yes. Because adding suffering is always a net negative. Adding mild happiness is a net positive.

  **Marcus:** But Critical-Level Utilitarianism says: if those million mild lives are below the critical level, their value is effectively zero or negative *for the purpose of population addition*. So, in some specific mathematical configurations, my theory might rank Option Two as less bad than Option One. It implies that adding the suffering few could be preferable to adding the mediocre many. That is the Sadistic Conclusion. And I admit it.

  **Elena:** You admit that your theory can rank the creation of tortured children as *better* than the creation of happy, albeit ordinary, children?

  **Marcus:** I admit that the *axiology* ranks the state of affairs as less bad. I am not saying suffering is good. I am saying that creating lives that aren't "worth creating"—even if they are worth *continuing*—dilutes the moral landscape in a way that can, in edge cases, be worse than a localized tragedy. But look at what you're buying, Elena. To avoid that, you have to accept World Z. You have to accept that we should prioritize massive population expansion over ensuring high quality of life for the future.

  **Elena:** And you have to accept that we might prioritize limiting population so strictly that we allow suffering to persist rather than adding "sub-critical" happy people. But let's invoke Arrhenius. We both know his Impossibility Theorem. There is no population axiology that satisfies all the adequate conditions. We cannot have it all. We cannot avoid the Repugnant Conclusion, the Sadistic Conclusion, and the Non-Elitism condition simultaneously. Perfection is off the table. The question is: which bullet is softer?

  **Marcus:** Exactly. So which is the lesser evil? A world of muzak and potatoes, or a theory that tells a government, "It is permissible to allow these hundred infants to suffer rather than birth these thousand contented workers"?

  **Elena:** The latter legitimizes suffering as a trade-off commodity. That is the danger. If you accept the Sadistic Conclusion, you open the door to justifying harm. You tell the policy maker, "Well, the aggregate value of the mediocre lives doesn't clear the threshold, so the suffering of this minority doesn't outweigh them." It violates the basic intuition that suffering is an absolute bad. My theory never, ever says suffering is a price worth paying for existence. It says existence is worth paying for, even if it's drab.

  **Marcus:** But your theory says quality is irrelevant compared to quantity. That's a different kind of horror. Imagine a future where we have the technology to sustain ten trillion people, but only at a subsistence level. Or we could sustain one billion at a level of post-human flourishing. Total Utilitarianism demands we choose the ten trillion. It demands we turn the universe into a crowded slum rather than a garden.

  **Elena:** Why is a crowded garden of decent lives worse than an empty paradise?

  **Marcus:** Because the paradise contains *meaning*. The slum contains only duration. But let's press your Non-Sadism Condition. You say adding a life with positive welfare is always better than adding one with negative welfare.

  **Elena:** Always.

  **Marcus:** Even if the positive life is incredibly trivial? A life of a mosquito? If we genetically engineer a mosquito to have a micro-second of pleasure, 0.0001 units of welfare. And we compare that to adding one human who will suffer -100 units.

  **Elena:** You're trying to trap me with the Mere Addition Paradox. But we aren't comparing mosquitoes to humans usually. We are comparing human lives. If a human life is worth living, it has positive value.

  **Marcus:** Okay, concrete case. Climate policy. We are deciding on carbon emissions. High emissions lead to a larger future population, but with lower average welfare due to environmental degradation. Low emissions lead to a smaller population, but very high welfare.

  **Elena:** If the high-emission path results in lives that are still worth living, Total Utilitarianism might favor it if the population boost is large enough.

  **Marcus:** There it is. You would sacrifice the quality of the future for the quantity.

  **Elena:** And you? With Critical-Level? If the high-emission path produces lives below your critical threshold, you might prefer the low-emission path even if it means fewer people exist. But here is my attack on your Sadistic Conclusion. Suppose the low-emission path requires a sacrifice. To achieve that high-quality, low-population world, we have to impose sanctions on a developing nation that will cause acute suffering for a generation.

  **Marcus:** That's a standard trolley problem. That's not population ethics.

  **Elena:** It is when your theory is in play. If your theory says adding the "sub-critical" population is *bad*, then you are more willing to prevent their existence. If preventing their existence involves inflicting suffering on the parents, or on the existing population, your calculus is skewed. You are so afraid of the Repugnant Conclusion—of the "muzak world"—that you are willing to count the addition of happy-but-mediocre lives as a negative. That is where the Sadism creeps in. It treats positive welfare as a burden.

  **Marcus:** It treats it as failing to meet a standard of *significance*. Look, Arrhenius proved we're all doomed. My theory satisfies "Non-Repugnance." Yours satisfies "Non-Sadism." I think violating Non-Sadism is a technical violation of a ranking condition. Violating Non-Repugnance is a vision of hell.

  **Elena:** And I think violating Non-Sadism is a moral catastrophe. It breaks the link between well-being and value. If a life is worth living for the person living it, how can it be a negative for the universe? That alienates the subject from the moral calculus. In World Z, the people in Z are happy to be alive. In your Sadistic Conclusion scenario, you are saying the universe would be better off if the happy people didn't exist, even if the suffering people do.

  **Marcus:** I'm saying the universe is better off with fewer, brighter candles than a galaxy of dim embers.

  **Elena:** But you're willing to snuff out the embers by lighting a fire that burns a few hands.

  **Marcus:** And you're willing to fill the galaxy with embers until there's no room for fire.

  *(Silence stretches between them. They sip their cooling coffee.)*

  **Elena:** Arrhenius says we can't satisfy all conditions. So we have to choose our poison. I choose the poison that keeps suffering strictly negative. I can live with a universe of mild happiness. I cannot live with a theory that says suffering is sometimes the lesser evil compared to mild happiness.

  **Marcus:** And I choose the poison that keeps meaning intact. I can live with the mathematical artifact of the Sadistic Conclusion because it only applies to lives *below the critical level*. I will argue that those lives, while worth continuing, weren't worth *starting*. But I cannot live with the Repugnant Conclusion. It renders the concept of a "good life" meaningless if it can be swapped out for enough "okay lives."

  **Elena:** So we're at an impasse. You fear the dilution of value. I fear the instrumentalization of suffering.

  **Marcus:** It seems so. Though, if Arrhenius is right, maybe the impasse is the only rational position.

  **Elena:** Or maybe it just means we both have to sleep poorly at night.

  **Marcus:** *(Raises cup)* To sleeping poorly.

  **Elena:** *(Clinks cup)* To the lesser evil.
