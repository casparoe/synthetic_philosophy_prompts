prompt: |-
  My aunt, a critical-care physician who spent almost three decades running codes and calling times of death, and who sat for the last fifteen years of her career on her hospital's brain-death determination committee, died ten days ago after a massive stroke from which her physicians agreed she would never meaningfully recover. In keeping with wishes she had held for years, life support was withdrawn and she became an organ donor herself — but by the circulatory route rather than the neurological one she had spent her career applying to other people's relatives, since her brainstem reflexes never fully disappeared and she did not meet whole-brain criteria. I am delivering her eulogy this coming weekend, and there is one specific difficulty I do not think I can simply write around: she was known among colleagues for being quite open that she found the short waiting period used to declare circulatory death harder to defend on strictly biological grounds than the neurological criterion she used on everyone else — not because she thought it an unreasonable basis for practice, but because what actually licenses it is that resuscitation will not be attempted, not that it could no longer succeed, and she considered it a small but real intellectual dishonesty to treat "permanent" and "irreversible" as though they meant the same thing.

  The funeral will seat a couple dozen transplant physicians and organ-procurement colleagues who knew exactly where she stood on this, among a much larger group of relatives and old friends who have never heard of the dead donor rule and are not there for a lesson in it. I do not want the eulogy to quietly imply, for the sake of everyone's comfort, that there was nothing here she ever thought hard about; that would be false to her, and visibly so to the people in the first two rows. But I also do not want it to raise the distinction only to leave everyone else wondering, at the one moment they most need not to wonder it, whether she was really gone when they said goodbye, or whether the donation she had arranged so deliberately for herself was in some sense premature. Could you write the eulogy? It should run five to seven minutes and needs to function, without any hedge visible to the family, as complete and honest comfort, while still being something her colleagues would recognize as true to exactly what she thought.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Aunt, critical-care physician (30 years), ran codes, called times of death, 15 years on brain-death determination committee.
      *   **Cause of Death:** Massive stroke, life support withdrawn, organ donor (circulatory route/DCD - Donation after Circulatory Death) because she didn't meet whole-brain criteria (brainstem reflexes remained).
      *   **The Conflict/Complexity:** She was intellectually honest about the distinction between "permanent" (won't restart) and "irreversible" (can't restart) in circulatory death. She found the DCD waiting period harder to defend biologically than neurological death, acknowledging it relies on the *decision* not to resuscitate rather than biological impossibility. She saw a "small but real intellectual dishonesty" in conflating the two.
      *   **Audience:** Mixed. ~2 dozen transplant/procurement colleagues (know her stance) + larger group of family/friends (don't know the medical ethics, need comfort/closure).
      *   **Goal:** Write a 5-7 minute eulogy.
      *   **Constraints:**
          *   Must be honest to her intellectual rigor (colleagues must recognize her voice).
          *   Must provide complete comfort to family (no lingering doubt about whether she was "really gone" or if donation was "premature").
          *   Cannot be a lecture on the Dead Donor Rule.
          *   Cannot hedge or lie about her thoughts.
          *   Must resolve the tension between her skepticism and her action (donating via the route she scrutinized).

  2.  **Deconstruct the Ethical/Medical Nuance:**
      *   *Neurological Death (DBD):* Whole brain dead. She used this for 30 years. Biologically clear-cut (no integration).
      *   *Circulatory Death (DCD):* Heart stops. Wait 5 minutes (usually). Declare death. She found this "softer" because if you *tried* to resuscitate, you might succeed. It's "permanent" cessation, not "irreversible."
      *   *Her Stance:* She knew the distinction. She didn't think DCD was *wrong*, just that it relied on a social/ethical contract (we won't try to restart it) rather than pure biology (it can't be restarted).
      *   *The Irony:* She died via DCD, not DBD.
      *   *The Resolution:* Her choice to donate via DCD, despite her scrutiny of it, is the ultimate testament to her integrity. She didn't demand a "perfect" biological definition for herself that she might have scrutinized for others. She trusted the *intent* and the *outcome* (saving lives) over the semantic purity. She embodied the principle that medicine is a human practice, not just a biological one.

  3.  **Determine the Tone:**
      *   Respectful, warm, intelligent, unflinching but gentle.
      *   Avoid jargon (no "DCD," "DBD," "brainstem reflexes").
      *   Focus on *integrity* and *precision* as forms of love.
      *   The "comfort" comes from framing her scrutiny not as doubt, but as a deep respect for the truth, which ultimately led her to a generous act.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge who she was. The doctor, the aunt, the person of precision.
      *   **The Core Conflict (The "Hard Part"):** How to address her views on death without scaring the family?
          *   *Strategy:* Frame her scrutiny as a form of reverence for life. She didn't take the definition of death lightly. She weighed it.
          *   *Phrasing:* Use words like "honesty," "precision," "weight." Avoid "intellectual dishonesty." Instead, talk about the "gray areas" she navigated.
      *   **The Decision to Donate:** This is the pivot. Why did she choose this path if she scrutinized it?
          *   *Reasoning:* Because the *purpose* mattered more than the *technicality*. She trusted the system she helped uphold. She chose to be useful.
          *   *Comfort:* She was gone. Her choice confirms she was ready. The donation wasn't premature; it was deliberate.
      *   **The Legacy:** What does this teach us? That truth and compassion aren't opposites.
      *   **Closing:** A personal goodbye.

  5.  **Refining the "Dangerous" Passage:**
      *   *Risk:* Saying "She knew circulatory death is technically reversible if you try" sounds like "She might have been alive."
      *   *Fix:* Focus on the *decision*. "She understood that death is not just a biological switch, but a moment where we decide to stop fighting."
      *   *Key Insight:* Her skepticism about the *definition* makes her acceptance of it for *herself* more powerful. It means she accepted the human covenant of medicine.
      *   *Drafting thought:* "She spent her career drawing lines in the sand. When it was her turn, she didn't ask for the line to be moved. She stepped over it."

  6.  **Addressing the Colleagues:**
      *   They need to hear that I know what she thought.
      *   *Subtle nod:* Acknowledge she never stopped questioning, even at the end. "She never turned off the part of her mind that examined the hard questions."
      *   *Validation:* Her donation validates the practice she scrutinized. If she trusted it for herself, it stands.

  7.  **Addressing the Family:**
      *   They need to know she didn't suffer, she wasn't "taken" too soon.
      *   *Reassurance:* The stroke was massive. Recovery was impossible. The withdrawal of support was the acknowledgement of that reality. The donation was her final act of agency.

  8.  **Review against Constraints:**
      *   *Time:* 5-7 minutes is roughly 750-1000 words spoken at a moderate pace.
      *   *Honesty:* Does it hide her views? No, it frames them as integrity.
      *   *Comfort:* Does it suggest she wasn't dead? No, it emphasizes her *choice* to let go.
      *   *Colleagues:* Will they nod? Yes, they'll recognize the "permanent vs. irreversible" nuance without me saying the words.

  9.  **Polishing the Language:**
      *   Use metaphors of light, lines, boundaries.
      *   Ensure the transition from "doctor" to "patient" is smooth.
      *   Make sure the ending is emotional, not intellectual.

      *(Self-Correction during drafting)*: I initially thought about explicitly mentioning the "permanent vs. irreversible" distinction. *Correction:* No, that's too technical for the family and might trigger the anxiety the prompt warns against. I need to translate that concept into *human* terms: the difference between "can't" and "won't." She understood that sometimes "won't" is enough when the burden is too great.

      *(Refining the "Comfort" aspect)*: The family needs to know she wasn't in pain and that the organ donation didn't *cause* death. I need to be clear: The stroke was the cause. The withdrawal was the acceptance. The donation was the gift *after* the decision to let go.

      *(Refining the "Colleague" aspect)*: I need to signal that she didn't compromise her standards. She applied her standards to herself and found this path acceptable. That is the ultimate endorsement.

  10. **Final Polish:** Check rhythm and flow. Ensure the emotional arc lands on love and legacy, not ethics. (The ethics are the structure, not the paint).

      *Word Count Check:* A 5-7 minute speech is usually around 800-1000 words. I will aim for that range.

      *Key Phrase to include (implicitly):* "She knew the difference between what is impossible and what is impossible *for us*." (Captures the irreversible/permanent nuance without the jargon).

      *Let's write.*
answer: |-
  Good morning.

  For those of you who knew my aunt only as family, you knew a woman of fierce loyalty, dry humor, and a specific kind of love that showed up in acts of service. She was the one who remembered birthdays, who fixed the broken hinge on the cabinet, who sat with you in the hospital waiting room when you were the one who was scared.

  For those of you who knew her as a colleague, you knew the rest of the story. You knew the thirty years in critical care. You knew the nights spent running codes, the mornings spent speaking with families who were having the worst day of their lives. You knew that for fifteen years, she sat on the committee that determined when a brain had ceased to function. She was a woman who lived her life on the boundary lines of human existence. She was the one we called when the picture was unclear. She was the one who drew the lines.

  And because she was who she was, she did not draw those lines lightly.

  She believed that words matter. She believed that "truth" is not a slogan, but a discipline. In her work, she grappled with the hardest questions medicine can ask. She understood that declaring death is not just a biological observation; it is a moral act. She knew that there are gray areas in how we define the end of life. She knew that sometimes, the difference between life and death rests not just on what the body *can* do, but on what we *ask* it to do.

  She never turned off that part of her mind. Even when she was the one in the bed, even when the stroke had taken her voice and her movement, the integrity of her thought remained. She knew the distinctions. She knew the weight of the definitions. She spent a career ensuring that the criteria for death were rigorous, because she respected life too much to be careless with its ending.

  And this brings me to the final gift she gave us.

  Ten days ago, after a massive stroke from which she could not recover, her heart stopped. In keeping with wishes she had held for years, she became an organ donor.

  I know that for some of you, the mechanics of that decision might feel complex. For the family, I want to be clear: There was no uncertainty about her condition. The injury to her brain was catastrophic. The decision to withdraw support was not a gamble; it was an acknowledgement of a reality that could not be changed. She was gone. The love we held for her remained, but the person who held it was at peace.

  But for her colleagues in the first few rows, I know there is a specific resonance here.

  My aunt was a skeptic. She was a woman who would argue that "permanent" and "irreversible" are not synonyms. She knew that the protocol she followed at the end relied on a covenant—that we would not attempt to restart a heart that had stopped, rather than a biological impossibility of it restarting. She knew the theory was not perfect. She knew the biology was messy.

  But she also knew that medicine is not practiced in a vacuum. It is practiced in a community of trust.

  If she had demanded a perfect biological definition for her own death, she could not have donated. She could not have helped the people waiting for lungs, for kidneys, for a chance to see their own children grow up. She could have held out for a purity of theory that does not exist in the messy reality of being human.

  Instead, she chose utility over purity. She chose trust over skepticism.

  She looked at the system she had scrutinized for thirty years—the system she had questioned, debated, and refined—and she decided it was good enough for her. She decided that the small imperfections in the definition of death were outweighed by the certainty of the life it could give to others.

  That is not a contradiction. That is the ultimate endorsement.

  It is easy to be rigorous when you are standing on the shore, judging the water. It is much harder to be rigorous when you are the one learning to swim. But she did not ask for an exception. She did not ask for the rules to be bent to make her feel safer. She accepted the same boundaries she had enforced for others. She trusted her colleagues to honor the covenant she had helped write.

  In doing so, she resolved the tension she lived with for decades. She showed us that you can question a thing and still serve it. You can know the flaws in the map and still trust the destination.

  To her family: She did not suffer. She was not taken before her time. She left us exactly when she intended to, on her own terms, with a final act of generosity that was deliberate and conscious. She is not in pain. She is in the work she loved.

  To her colleagues: She didn't stop thinking until the end. But in the end, she chose to trust you. She validated the work you do together not by ignoring the hard questions, but by answering the hardest one herself. She proved that the Dead Donor Rule is not just a regulation; it is a promise kept between people who care more about the living than the technicalities of the dead.

  We are gathered here to mourn a loss. And it is a loss. The house is quieter. The phone rings less. But if you are waiting for an organ, if you are breathing because she let go, if you are living because she chose to stop fighting—she is not gone.

  She spent her life defining the end of life so that others could have a beginning. She drew the line, and then she crossed it, so that we could stay here a little longer.

  Thank you, Aunt [Name]. We have the watch now. You can rest.
