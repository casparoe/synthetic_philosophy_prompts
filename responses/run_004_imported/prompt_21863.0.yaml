answer: |-
  The particle board slab lay between them on the floor, cam locks exposed like empty eye sockets. Around them, the apartment was a topology of cardboard and bubble wrap. Mark, the mutual friend who had enlisted them, was in the kitchen wrestling with a mattress, out of earshot.

  Elias reached for the Allen key. Sarah pulled it back.

  "It's not a shelf yet," she said.

  "It's a shelf," Elias replied, not looking up. "It's a shelf arranged disassembledly."

  "It's simples arranged screwwise and boardwise. Don't reify the furniture, Elias. We swore we wouldn't do that."

  "We swore a lot of things." Elias finally met her eyes. The familiarity was a physical ache, a phantom limb of intellectual intimacy. "Besides, if I let go of these parts, they fall. Something is holding them together. Gravity? Friction? Or the shelf itself?"

  "Nothing is holding them together because nothing *is* there to hold them. There are only the simples. When Mark finishes wrestling that mattress, there won't be a mattress. There will just be foam and fabric arranged mattresswise."

  Elias smiled, thin and tired. "The old eliminativist refrain. It's ontologically parsimonious, I'll give you that. But it doesn't survive the Argument from Vagueness. You know that."

  Sarah began sorting screws into a plastic cup, clinking them by size. "I wrote the paper on the Argument from Vagueness, Elias. With you."

  "And you concluded that because composition can't be vague, it must never happen. I concluded it must always happen. The logic is the same; the courage is different."

  "It's not courage. It's sanity." Sarah dropped a screw. It spun on the floor. "Look at van Inwagen. He tries to take the middle road. Composition occurs only when the activity of the parts constitutes a life. But where is the cutoff? Is it vague when a collection of simples begins to live? If existence is not a matter of degree, then composition cannot be vague. If restricted composition implies vagueness, restricted composition is false."

  "Agreed," Elias said. He picked up a cam lock. "Van Inwagen's organicism is a disaster. It posits a sharp boundary where there conceptually cannot be one. One electron shifts, and *pop*, a new object exists? Or ceases to? That's magical. So we agree on the dilemma. Composition is either never or always."

  "Exactly," Sarah said. "So why choose the explosion? Why populate the universe with trout-turkeys and scattered objects composed of my left shoe and the moon? It's ontological gluttony."

  "Because the alternative is solipsism of the present moment's simples," Elias countered. "You say 'never.' But when I lift this board, *I* am lifting it. If there is no board, what am I lifting? If there are no composite objects, there are no people, Sarah. You're just simples arranged Sarahwise talking to simples arranged Eliaswise."

  "I'm not denying the utility of the talk," she snapped, a flash of the old frustration surfacing. "I'm denying the ontology. We can speak truly when we say 'the shelf is heavy' without committing to the existence of a singular entity *shelf*. It's a paraphrase. 'The simples are arranged heavily.' It saves the phenomena without the metaphysical bloat."

  "But it doesn't save the logic," Elias pressed. He leaned forward, the Allen key tapping against his knee. "Sider's point stands. If you deny composition, you have to deny that quantification is unrestricted. You have to change the meaning of 'there exists.' Universalism keeps classical logic intact. Existence is cheap. Let it be cheap. It costs nothing to say the trout-turkey exists. It costs everything to say *you* don't."

  "I exist," Sarah said, her voice dropping. "In the only way that matters. As a fundamental unity. You dissolve unity into arbitrary sums. If any two objects compose a third, then the distinction between an object and its environment is merely pragmatic. There's no metaphysical difference between this bookshelf and the dust motes floating above it."

  "There is a difference," Elias said. "Causal power. The bookshelf holds books. The dust motes don't."

  "The *simples* arranged bookshelf-wise hold the books," she corrected. "The causal work is done at the micro level. You're just drawing a circle around a subset of events and giving it a name."

  "And you're drawing a circle around *nothing* and calling it reality." Elias stood up, brushing dust from his jeans. "Think about the vagueness again. You use it to drive composition to zero. But why is zero better than infinity? If existence isn't vague, then every precise sum must exist. To deny the sum is to introduce a brute fact: *why* do these simples exist but not their fusion? The Universalist has a cleaner ideology. Unrestricted quantification. Classical mereology. No brute restrictions."

  "Cleaner, but empty," Sarah said. She picked up the board and offered him one end. "If everything exists, nothing is privileged. Your ontology can't distinguish between a person and a pile of garbage. They're both fusions. You've flattened the world."

  "I haven't flattened it. I've democratized it." Elias took the other end. "You're the one making existence an elite club. Only the simples get in. Or maybe the living things, if you're feeling charitable. But the Argument from Vagueness slams the door on the club. There's no non-arbitrary way to pick the members. So either the club is empty, or it's open to everyone."

  "Maybe the club is a mistake," Sarah said. "Maybe 'existence' isn't the right predicate for composites. Look at us. We're trying to build something for Mark. Does it matter if the shelf exists? No. It matters if it holds the books."

  "It matters to metaphysics."

  "Does it?" Sarah tightened her grip on the board. "We used to think metaphysics was about carving nature at its joints. Now you think it's about counting every possible combination of meat and wood. You've traded truth for consistency."

  "I've traded intuition for logic," Elias said. "You're clinging to the intuition that there are 'real' objects. But the Argument from Vagueness kills that. If you admit *one* composite object—say, a human organism—you invite the vagueness back in. When does the organism begin? Conception? Birth? Viability? If you can't draw a sharp line, you can't have the object. So, if you want to keep the human, you have to keep the trout-turkey. If you want to ban the trout-turkey, you have to ban the human."

  "I'm willing to ban the human," Sarah said quietly. "If 'human' implies a metaphysical unity that isn't there. I am here. The thinking is happening. The rest is commentary."

  Elias looked at her, really looked at her, for the first time since they'd arrived. "That's why we stopped talking, isn't it? Not the paper. This. You think if you cut away enough, you'll find the truth. I think if you connect enough, you'll find it."

  "Connecting isn't composing," she said.

  "Isn't it?"

  He gestured to the board between them. "We are both lifting this. There is a causal interaction between us mediated by this particle board. If there is no board, there is just a miraculous correlation between your simples and mine."

  "Correlation is enough."

  "It feels like resistance," Elias said. "The board resists gravity. That resistance is a property of the whole, not the parts. A single screw doesn't resist bending the way the assembly does."

  "Emergent properties don't require emergent objects," Sarah said. She shifted her weight. "Mark's coming."

  Footsteps thudded in the hallway. Mark appeared, sweating, holding the corner of a box spring.

  "Hey, you two make progress on the Billy bookcase?"

  Elias and Sarah looked at the board, then at each other. The silence stretched, heavy with the weight of the unsolved.

  "We're discussing the conditions of its possibility," Elias said.

  Sarah let out a short breath, almost a laugh. "We're discussing whether 'it' refers to anything."

  Mark blinked, shifting the box spring. "Okay. Well, let me know when 'it' is ready to hold books. Or when the simples are arranged ready-wise. Whatever."

  He disappeared back into the hall.

  Elias lowered his end of the board slightly. "You know the vagueness argument cuts both ways. If you say composition never occurs, you have to explain why language works. Why is 'pick up the board' successful? If there is no board, the reference fails."

  "Reference is causal," Sarah said. "I point. You look. The causal chain fixes the reference, not the ontology. I can talk about Sherlock Holmes without believing he exists."

  " Sherlock Holmes is fiction. This board is not."

  "How do you know?" Sarah asked. "Without the composite, what distinguishes the fiction from the furniture?"

  Elias opened his mouth, then closed it. He looked at the cam locks, the screws, the particle board. He saw the sum. She saw the parts. The light in the room was the same for both of them, but the world it illuminated was fundamentally different.

  "I don't know," Elias said softly. "But I know I can't build it alone."

  "I know," Sarah said. She tightened her grip. "Lift."

  They raised the board together, aligning it with the supports. It hovered there, suspended between them, neither fully one thing nor many, waiting to be screwed into place.
