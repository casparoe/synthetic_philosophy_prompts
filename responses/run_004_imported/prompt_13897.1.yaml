      *   *Clarity:* Make sure to distinguish between *ontological status* (existence) and *moral status* (rights/respect). Menkiti blurs them; Gyekye separates them.
      *   *Tone Check:* Ensure I don't sound like I'm dismissing the user's ethical concern. The concern about disabled people/infants is a standard and valid critique in the literature (e.g., by Metz or Wiredu).
      *   *Specific Terminology:* Use "Radical Communitarianism" vs. "Moderate Communitarianism." Mention the "ontological vs. moral" distinction.

  8.  **Final Polish:** Check against the user's specific prompts.
