  9.  (Final thought): Make sure to mention Thaddeus Metz as a contemporary voice who tries to synthesize this, as it adds current relevance. (Decided to keep it focused on Menkiti/Gyekye first to answer the specific prompt, maybe add Metz as a footnote or brief mention). Let's stick to the requested Menkiti/Gyekye focus to keep it tight.

  10. *Structure:*
