answer: |-
  An elderly citizen in Magnesia is stopped by the Symposiarch during the festival.

  "Sir," says the Symposiarch, checking his clipboard, "I'm going to need you to take a field test."

  The citizen stands at attention. "I'm ready."

  "Walk this line," says the Symposiarch, pointing to the mosaic floor.

  The citizen walks it perfectly, heel-to-toe, without a wobble.

  The Symposiarch sighs and writes him a citation.

  "What for?" demands the citizen. "I'm perfectly sober!"

  "That's the charge," says the Symposiarch. "Excessive Sobriety. You're sixty years old; under Book II, you're legally required to be intoxicated enough to dissolve your shame. If you can still walk a straight line, your soul is too rigid for the chorus."

  "But isn't inhibition a vice we must defeat?"

  "Exactly," says the Symposiarch, handing him a full kylix. "So drink up. In this city, the only thing more dangerous than a drunk young man is a sober old man who thinks he's too dignified to dance."
