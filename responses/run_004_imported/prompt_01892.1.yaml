answer: |-
  **The Arbitrariness of Sampling: A Defense of the Self-Indication Assumption**

  The problem of observer-selection effects reduces to a question of how rational agents ought to update their credences upon receiving indexical evidence—propositions regarding *who* one is or *where* one is located in logical space, distinct from *what* world one occupies. The two dominant normative principles governing this update are the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA). SSA instructs agents to reason as if they are randomly sampled from a reference class of observers; SIA instructs agents to weight hypotheses by the number of observers they contain. While the literature often treats these as competing heuristics with trade-offs, a rigorous analysis of their structural coherence reveals a decisive asymmetry. SSA is fatally compromised by the reference class problem, rendering it incapable of generating determinate probabilities without arbitrary parameters. SIA, while entailing counter-intuitive confidence in large universes (the Presumptuous Philosopher), preserves the integrity of Bayesian conditioning on existence itself. Consequently, SIA must be accepted as the correct principle for self-locating belief, and SSA rejected.

  **The Fatal Indeterminacy of SSA and the SSSA Evasion**

  The primary failure of SSA is not its implications for cosmology, but its internal incoherence regarding the *reference class*. SSA states: "One should reason as if one were a random sample from the set of all observers in one's reference class." However, the principle provides no non-arbitrary criterion for delineating this class. If the class is "all humans," the Doomsday Argument follows. If the class is "all conscious beings," the probabilities shift. If the class is "all observer-moments indistinguishable from my current state," they shift again. Since rational credence should not fluctuate based on arbitrary taxonomic decisions, SSA fails as a normative epistemic principle. It transforms objective Bayesian updating into a function of subjective categorization.

  Nick Bostrom attempts to resolve this via the Strong Self-Sampling Assumption (SSSA), which shifts the unit of sampling from observers to *observer-moments*. The intent is to refine the reference class to the point of precision where arbitrariness vanishes. However, SSSA merely relocates the problem from sociology to metaphysics. Individuating observer-moments is no less arbitrary than individuating observers. Does a moment correspond to a specious present? A millisecond of cognitive processing? A discrete computational state? Furthermore, SSSA struggles with fission cases. If an observer splits (as in teletransportation or quantum branching), does the pre-split moment belong to a class containing one successor or two? If the reference class is defined by phenomenological indistinguishability, we risk circularity, defining the class by the very evidence we are trying to evaluate.

  Because SSA/SSSA requires a parameter (the reference class) that is external to the evidence and the hypothesis space, it cannot generate unique probability assignments. A principle that yields different verdicts on the same evidence depending on an undefined variable is not a principle of reasoning; it is a schema for rationalization.

  **The Doomsday Argument as a Reductio of SSA**

  The structural flaw of SSA manifests catastrophically in the Doomsday Argument (DA). SSA entails that, ceteris paribus, one should expect to be located roughly in the middle of the reference class of all observers who will ever exist. Given my birth rank among humans (approximately the 100 billionth), SSA forces a high credence that the total number of humans will not vastly exceed this figure. This implies a high probability of near-term human extinction.

  Proponents of SSA often accept the DA as a bitter pill, arguing that our intuition against it is a cognitive bias. This is untenable. The DA allows an agent to predict physical catastrophes based solely on their birth order, independent of any empirical data regarding nuclear proliferation, climate stability, or asteroid trajectories. It violates the principle that empirical predictions should depend on empirical causes. If a principle of reasoning allows one to infer the duration of a civilization from a census count alone, the principle is disconnected from causal reality.

  SIA dissolves the Doomsday Argument immediately. SIA posits that hypotheses predicting more observers receive a prior boost proportional to the number of observers. In the DA framework, the "Long Future" hypothesis predicts vastly more observers than the "Short Future" hypothesis. SIA weights the "Long Future" hypothesis higher by exactly the factor that SSA penalizes it for my early birth rank. The two effects cancel out, leaving the posterior probability of extinction dependent on empirical evidence rather than indexical location. This restoration of empirical autonomy is a decisive theoretical virtue.

  **The Presumptuous Philosopher: Feature, Not Bug**

  The strongest objection to SIA is Bostrom's Presumptuous Philosopher. In this thought experiment, two theories of physics are proposed: $T_1$ predicts a finite universe with $10^{10}$ observers, and $T_2$ predicts a universe with $10^{20}$ observers. Both are equally simple and fit the non-indexical data. SIA dictates that we should be $10^{10}$ times more confident in $T_2$ simply because it contains more observers. Bostrom argues this allows philosophers to do physics from the armchair, presuming a universe structure without empirical investigation.

  However, this objection relies on the intuition that "I exist" is not evidence. Under a standard Bayesian framework, "I exist" *is* evidence. If $T_2$ makes my existence $10^{10}$ times more probable than $T_1$ (because there are $10^{10}$ times more slots for "me" to occupy), then updating on my existence *should* favor $T_2$. The intuition that this is "presumptuous" stems from a SSA-like prior that treats the probability of existence as constant across worlds regardless of population size. But why should the probability of me existing be independent of the number of opportunities for me to exist?

  To reject SIA on these grounds is to claim that the sheer number of observers in a world is evidentially irrelevant to one's location within it. This leads to the "Lazy Adam" paradox, where an agent can manipulate coincidences by forming intentions that would only be fulfilled in worlds with many observers. SIA avoids this by acknowledging that observer count is a likelihood factor. The "presumption" is not an arrogance of reasoning; it is a consequence of the Copernican principle applied to logical space. If we are not special, we are likely to be in the kind of world that produces the most observers like us.

  Furthermore, the cost of accepting the Presumptuous Philosopher result is purely intuitive, whereas the cost of accepting SSA is structural. SSA demands we accept arbitrary reference classes and absurd extinction probabilities. SIA demands we accept that we likely inhabit a populous universe. In a context where multiverse hypotheses are already live options in cosmology, the SIA verdict is metaphysically costly but epistemically coherent. The SSA verdict is epistemically incoherent.

  **Verdict**

  The choice between SSA and SIA is not a choice between two imperfect tools, but between a broken tool and a demanding one. SSA fails because it cannot define its own domain of application without arbitrariness. The move to observer-moments (SSSA) does not solve the reference class problem; it merely obscures the metaphysical vagueness involved in individuating subjective experience. Consequently, SSA's derivation of the Doomsday Argument is not a profound insight into human fragility, but a mathematical artifact of a flawed sampling assumption.

  SIA, by contrast, treats "I exist" as a standard piece of evidence subject to likelihood ratios. While this leads to the Presumptuous Philosopher conclusion, this result is only counter-intuitive if one clings to the SSA intuition that existence is a given rather than a datum. For the philosopher of physics and epistemology, formal coherence must trump pre-theoretic intuition. SIA provides a consistent framework for updating on centered propositions that respects Bayesian norms and avoids the arbitrariness of reference classes. Therefore, SIA should be adopted as the correct principle for self-locating belief, and SSA should be discarded as a heuristic that collapses under rigorous scrutiny. We are not random samples from a fixed class; we are evidence bearers whose very existence weighs the scales in favor of populous worlds.
