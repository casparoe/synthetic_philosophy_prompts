      *   *Alternative Rationality (TDT/UDT/Resolute Choice):* Yes. If you view yourself as a type of agent who keeps promises/intentions even when incentives shift, you can form the intention. The "rationality" comes from being the *kind of person* who gets the desk in the first place.
