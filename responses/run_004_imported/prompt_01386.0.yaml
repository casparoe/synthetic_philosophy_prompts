      *   *The Toxin Puzzle* (Gregory Kavka, 1983): An eccentric billionaire offers you $1 million if you *intend* to drink a harmless but painful toxin tomorrow. You get the money just for forming the intention. You don't actually have to drink it. But can you intend to do something you know you won't do once you have the money?
