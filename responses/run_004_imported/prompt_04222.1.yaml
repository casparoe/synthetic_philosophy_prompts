prompt: |-
  so i've been slowly working through the Guide for the Perplexed on my own (no yeshiva, no university, just me, a chumash, and a lot of late nights) and got stuck on what Rambam (Maimonides) says about animal sacrifice. His argument is basically that korbanot (sacrifices) were never something God actually wanted for their own sake - it was a concession, because the israelites were so used to sacrificing to idols that jumping straight to "pure" worship like prayer would've been too much too fast, so God let them keep the ritual but redirected it to Him, like weaning a kid off milk. Fine, but then in the Mishneh Torah he rules flat out that when moshiach (the messiah) comes the Temple gets rebuilt and sacrifices start right back up, no footnote saying "except we don't need this part anymore." If it was just training wheels for a idolatry problem that, by his own account, gets solved, why bring it back? And Ramban (Nachmanides), in his own commentary, basically tears into the whole "concession" idea as insulting nonsense.

  Can you write me an essay that actually picks a side instead of doing "on the one hand / on the other hand"? Either defend Rambam's accommodation theory (and explain away the moshiach problem), make the case for Ramban instead, or argue for some third reading if thats more honest to the texts - but commit to one and back it up.
