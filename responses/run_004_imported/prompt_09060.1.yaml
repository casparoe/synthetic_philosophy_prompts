      *   *Nuance on Deontology:* The user says "close to inviolable," not "absolutely." This allows for threshold deontology. I should mention *threshold* deontology as a bridge between the 45% and 30%.
      *   *Nuance on Exploitability:* Make sure to distinguish between *diachronic* exploitation (changing mind over time) and *synchronic* (at one time). The worry is usually about cyclical preferences. MEC avoids this.
