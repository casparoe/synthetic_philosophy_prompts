answer: |-
  The conference room lights hummed overhead as the cleanup crew waited impatiently. Dr. Sharma, defending the classical Nyāya position, stacked her notes while Dr. Rinchen, representing the Buddhist epistemological lineage of Dignāga, leaned against the podium.

  "Compelling defense of *śabda*, Sharma," Rinchen said, loosening her scarf. "But Occam's razor still cuts. If inference handles the cognitive lift, why posit a distinct *pramāṇa*? It feels like ontological inflation."

  Sharma sighed, gathering her papers. "It isn't inflation if the mechanism differs. Inference requires grasping a universal concomitance (*vyāpti*) between a mark and what it signifies. Testimony doesn't work that way. Consider the child. She hears her mother say 'Fire!' and runs. She doesn't silently reason, 'Mother is trustworthy, therefore fire exists.' She just knows."

  "Not explicit reasoning," Rinchen countered, stepping closer. "But *vāsanā*—latent impressions. Past successes with her mother create a habitual connection. The utterance functions as a *liṅga*, a sign. Just as smoke implies fire without conscious calculation, a trusted voice implies truth. The inference is compressed, not absent."

  "Habit isn't logic," Sharma insisted. "But consider the conditions of understanding: *ākāṅkṣā*, *yogyatā*, *sannidhi*. Words possess mutual expectancy. 'Cow' waits for 'bring.' This syntactic expectancy isn't a logical concomitance between smoke and fire. It's constitutive of meaning itself. You can't infer a sentence's meaning from its words alone without this structural fit, which isn't inferential."

  Rinchen nodded slowly. "It signals coherent intent. If I say 'green ideas sleep furiously,' *yogyatā* fails. You infer nonsense. If I speak coherently, you infer truth based on trust. The syntax confirms the speaker isn't random. Randomness undermines reliability. So, syntax supports the inferential basis of trust."

  "You're conflating understanding with validation," Sharma argued, her voice sharpening. "I understand the lie before I know it's false. The *śabda-pramāṇa* gives me the content. Your inference model requires I verify your trustworthiness *before* I grasp the proposition. But I grasp it immediately upon hearing. The words reveal the object directly, provided the conditions are met."

  "Valid knowledge (*pramā*) requires truth," Rinchen replied firmly. "If you believe a liar, it's not *pramā*. So the reliability check is essential for *validity*, even if understanding is immediate. That check is inferential. You infer the state of affairs from the speaker's competence."

  "But I don't need to know the universal 'All speaker's words are true,'" Sharma said. "Nyāya holds that if the speaker knows the truth and wishes to communicate it, the hearer gains knowledge directly. I don't need to know *that* you know. I just need to hear you. Your model makes testimony second-hand inference. Ours makes it a direct transmission of knowledge."

  "Direct transmission sounds magical," Rinchen smiled. "If the mechanism relies on a connection between sign (utterance) and signified (state of affairs), mediated by the speaker's competence, that's the structure of inference. You just dislike the label. Why? Because inference is fallible?"

  "Because it changes the phenomenology," Sharma said. "In inference, I move from known to unknown via a universal. In testimony, I access the unknown via *your* knowledge. I rely on your cognition, not a logical rule. You reduce the social transmission of knowledge to private reasoning. *Śabda* acknowledges our epistemic dependence. It's not just 'I infer you know.' It's 'You tell me, I know.'"

  "Epistemic dependence doesn't require a new *pramāṇa*," Rinchen countered. "It just shows inference is social. My point stands: if the causal chain involves a sign leading to a conclusion via an established connection, it fits the definition of inference. Adding *śabda* obscures this uniformity. We save ontology by recognizing the underlying cognitive uniformity."

  "Uniformity isn't truth," Sharma said, picking up her bag. "The phenomenology of being told differs from figuring it out. If we ignore that, we lose the nuance of how language works. You treat words as smoke. We treat them as vessels."

  "And if we multiply *pramāṇas* without distinct causal mechanisms, we lose ontological clarity," Rinchen said. "You prioritize the experience of language; I prioritize the economy of cognition."

  "Then we agree to disagree on what counts as a 'mechanism'," Sharma said, extending a hand. "You see a logical chain; I see a linguistic bridge."

  "Seems so," Rinchen shook it. "Dinner? I know a place where the menu doesn't require inference to understand."

  "Dinner," Sharma smiled. "But I'm trusting your recommendation blindly. So, according to you, I'm inferring."

  "According to me," Rinchen laughed, "you're finally doing epistemology correctly."
