answer: |-
  This is one of the most persistent and vexing problems in normative ethics. You are right to identify that the debate has largely calcified into a choice between two unpalatable options. Total Utilitarianism (TU) preserves the intuition that suffering is always bad and happiness always good, but yields the Repugnant Conclusion (RC). Critical-Level Utilitarianism (CLU) blocks the RC, but yields the Sadistic Conclusion (SC).

  Given your request for a rigorous adjudication rather than a survey, I will proceed by formally defining the theories, tracing their divergence through the Mere Addition Paradox, and then offering a definitive verdict on which failure mode is less destructive to a coherent axiology.

  ### 1. Formal Definitions

  To compare them precisely, let $N$ be the size of the population, and $w_i$ be the lifetime welfare of individual $i$. We assume welfare is measured on a cardinal scale where $0$ represents a neutral life (a life not worth living, but not worth avoiding).

  **Total Utilitarianism (TU)**
  The value of a population $W$ is the sum of the welfare of all individuals within it.
  $$V_{TU} = \sum_{i=1}^{N} w_i$$
  *Implication:* Any life with $w_i > 0$ makes a positive contribution to the total value, regardless of how small $w_i$ is.

  **Critical-Level Utilitarianism (CLU)**
  The value of a population $W$ is the sum of the differences between each individual's welfare and a fixed critical level $c$, where $c > 0$.
  $$V_{CLU} = \sum_{i=1}^{N} (w_i - c)$$
  *Implication:* A life only contributes positive value if $w_i > c$. A life with $0 < w_i < c$ is "worth living" for the person (positive welfare) but constitutes a net negative contribution to the population's value (below the critical level).

  ### 2. The Mere Addition Paradox (MAP)

  Parfit's MAP is a sequence of intuitively plausible steps that leads from a high-quality population ($A$) to the Repugnant Conclusion ($Z$).

  1.  **$A$**: A population of 10 billion people with very high welfare.
  2.  **$A+$**: $A$ plus a new group of people with positive welfare, lower than $A$'s average.
      *   *Intuition (Mere Addition):* $A+$ is not worse than $A$. The new people have lives worth living, and they don't harm the $A$-people.
  3.  **$B^-$**: Same population as $A+$, but resources are redistributed to raise the average of the new group and slightly lower the $A$-group (more equality).
      *   *Intuition:* $B^-$ is better than $A+$ (due to equality or total utility gains).
  4.  **$B$**: Same population as $B^-$, but everyone is slightly better off.
      *   *Intuition:* $B$ is better than $B^-$.
  5.  **Repeat:** Continue this process until you reach **$Z$**, a massive population with lives barely worth living.

  **How TU Handles MAP:**
  TU accepts the *Mere Addition* premise. Since the new people in $A+$ have $w > 0$, they add positive value. Therefore, $V(A+) > V(A)$. TU accepts the transitivity of the subsequent steps. Consequently, TU must accept that $V(Z) > V(A)$. It bites the Repugnant Conclusion.

  **How CLU Handles MAP:**
  CLU breaks the chain at the very first step: **Mere Addition.**
  In CLU, adding people is only value-neutral or value-positive if their welfare meets the critical level $c$.
  *   If the new people in $A+$ have welfare $w_{new}$ such that $0 < w_{new} < c$, their contribution to the sum is negative ($w_{new} - c < 0$).
  *   Therefore, $V_{CLU}(A+) < V_{CLU}(A)$.
  *   CLU denies that $A+$ is "not worse" than $A$. It asserts $A+$ is *worse* than $A$.

  By denying the premise that adding lives worth living (but below the critical threshold) is permissible or neutral, CLU blocks the slide toward $Z$. It asserts that there is a qualitative threshold for population expansion. You cannot trade quality for quantity once you dip below $c$.

  ### 3. The Sadistic Conclusion (SC)

  The cost of blocking the RC via CLU is the Sadistic Conclusion, formally demonstrated by Blackorby, Bossert, and Donaldson.

  **The Scenario:**
  Imagine you must add people to an existing population. You have two options, both of which will decrease the overall value of the world (relative to the status quo), but you must choose the "less bad" option.
  *   **Option 1:** Add a large number of people ($N_1$) with positive welfare below the critical level ($0 < w_1 < c$).
  *   **Option 2:** Add a smaller number of people ($N_2$) with negative welfare (suffering) ($w_2 < 0$).

  **The Math:**
  *   Value change for Option 1: $\Delta V_1 = N_1(w_1 - c)$. Since $w_1 < c$, this is negative.
  *   Value change for Option 2: $\Delta V_2 = N_2(w_2 - c)$. Since $w_2 < 0$ and $c > 0$, this is also negative.
  *   Because $w_2$ is negative, $(w_2 - c)$ is a *larger* negative number per person than $(w_1 - c)$. However, if $N_1$ is sufficiently large compared to $N_2$, the total loss from Option 1 can exceed the total loss from Option 2.

  **Example:**
  Let $c = 10$.
  *   Option 1: Add 100 people at $w = 5$. $\Delta V = 100(5 - 10) = -500$.
  *   Option 2: Add 10 people at $w = -5$. $\Delta V = 10(-5 - 10) = -150$.
  *   Since $-150 > -500$, CLU ranks Option 2 (adding suffering) as **better** than Option 1 (adding happy-but-sub-threshold lives).

  This is the Sadistic Conclusion: For any number of decent lives below the critical level, there is some number of tortured lives that it would be better to create instead.

  ### 4. The Verdict

  We are now at the crux of your request. Arrhenius's impossibility theorems suggest that no theory can satisfy all our adequacy conditions. We cannot have it all. We must choose which intuition to violate.

  **My verdict is that Critical-Level Utilitarianism is superior to Total Utilitarianism.** While the Sadistic Conclusion is grotesque, the Repugnant Conclusion is a fundamental failure of normative guidance that renders a theory unfit for purpose. CLU represents genuine progress, not merely a relocation of the problem.

  Here is the justification for this verdict, based on three criteria: **Directionality**, **The Asymmetry Intuition**, and **Tragic Trade-offs.**

  #### A. Directionality of Error
  The Repugnant Conclusion is a failure of *direction*. It tells us that World $Z$ (mass subsistence) is *better* than World $A$ (flourishing). If we accept TU, our axiology actively points us toward a world that almost every human intuition rejects as dystopian. It suggests that if we have the technology to sustain 100 trillion people at a subsistence level, we are morally obligated to do so, even if it requires sacrificing the flourishing of the current population. This is action-guiding in a dangerous way.

  The Sadistic Conclusion is a failure of *magnitude* within a *loss* frame. SC only triggers when **both** options reduce the total value relative to the status quo. It does not say "Create a world of suffering." It says, "If you are forced to make the world worse, creating a small amount of suffering is less bad than creating a massive amount of mediocrity."
  While SC is counterintuitive, it operates in the realm of "damage control." TU operates in the realm of "ideal theory." It is less damaging for a theory to give counterintuitive advice in a tragic, no-win scenario (SC) than to give counterintuitive advice about which world is ideally best (RC).

  #### B. The Asymmetry Intuition
  One of the strongest intuitions in population ethics is the **Asymmetry**: We have a strong moral reason not to bring a miserable child into existence, but we do not have a symmetric moral reason to bring a happy child into existence (absent other factors).
  *   **TU fails the Asymmetry.** For TU, adding a happy person is just as morally significant as avoiding the addition of a miserable person (mathematically symmetric around 0).
  *   **CLU captures the Asymmetry.** By setting $c > 0$, CLU posits that there is a gap between "a life worth living" ($w>0$) and "a life worth adding" ($w>c$). This aligns with the common moral view that existence is not inherently a benefit unless the life is *sufficiently* good.

  The Sadistic Conclusion is essentially the "tax" CLU pays to capture the Asymmetry. If you agree that we have no duty to create happy lives (below a certain threshold), you must accept that adding them is not a "gain." If it's not a gain, it can be outweighed by avoiding a larger loss. If you find the Asymmetry plausible (as most people do), you must accept some version of CLU's logic, and consequently, you must absorb some risk of SC.

  #### C. The Nature of the "Sadism"
  Critics of CLU argue that SC implies it is "good" to create suffering. This is a mischaracterization. SC implies that adding suffering is *less bad* than adding sub-critical lives *in specific comparative contexts*.
  Consider the logic: Adding a life below the critical level is treated as a *negative* value event (a dilution of value). Adding a life with suffering is also a negative value event. SC simply claims that a massive dilution of value can be worse than a concentrated instance of suffering.
  While this violates the intuition that suffering is lexically worse than non-flourishing, it does not violate the intuition that suffering is bad. TU, by contrast, violates the intuition that quality of life matters at all. TU implies that a life of mud and potatoes is *better* than a life of symphonies and philosophy, provided there are enough of the former. This erodes the concept of "welfare" entirely. CLU preserves the concept that welfare quality matters, even if it mishandles the trade-off with suffering in edge cases.

  ### Conclusion

  Total Utilitarianism is a dead end. Its acceptance of the Repugnant Conclusion undermines the very concept of "flourishing" that welfare ethics is meant to maximize. It reduces human value to a raw headcount of neural firings, ignoring the qualitative depth of experience.

  Critical-Level Utilitarianism is not a final solution—Arrhenius has proven no such solution exists within standard welfarist frameworks. However, CLU is a **necessary refinement**. It correctly identifies that the moral permission to create new lives is conditional on those lives meeting a standard of quality, not merely positivity.

  The Sadistic Conclusion is a bullet that must be bitten, but it is smaller than the Repugnant Conclusion. It is preferable to have a theory that occasionally mishandles tragic trade-offs between suffering and mediocrity (CLU) than a theory that systematically misidentifies dystopias as utopias (TU). Therefore, CLU gets us closer to an acceptable population axiology, not because it is free of paradox, but because its paradoxes are located in the realm of tragic loss rather than ideal aspiration.

  **Final Recommendation:** Adopt Critical-Level Utilitarianism with a high critical level, acknowledge the Sadistic Conclusion as a regrettable artifact of avoiding the Repugnant Conclusion, and recognize that this trade-off is the price of taking the quality of life seriously.
