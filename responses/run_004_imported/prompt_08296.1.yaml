answer: |-
  This is one of the most famous and genuinely difficult puzzles in contemporary metaphysics. You are right to feel stuck; Lewis himself described this as a crisis for his own system. The confusion usually stems from the fact that the argument relies on a tension between how we *use* chance (epistemology) and what chance *is* (metaphysics).

  Here is a walkthrough of the argument, the stakes, and the fix, keeping the formalism to a minimum.

  ### (a) How the Undermining Argument Runs

  To see the contradiction, we need to hold three claims together. Lewis wanted to hold all three, but the "undermining future" shows they form an inconsistent triad.

  1.  **Humean Supervenience (HS):** The chances at any time are nothing over and above the best summary of the pattern of particular facts across *all* of history (past, present, and future).
  2.  **The Principal Principle (PP):** If you know the objective chance of an event is $x$, your rational credence (degree of belief) in that event should be $x$ (assuming you have no "inadmissible" evidence).
  3.  **The Possibility of Undermining:** Because chances depend on the *entire* pattern of history (including the future), it is possible for the future to turn out in a way that is consistent with current chances but would, if it occurred, make those current chances false.

  **The Scenario:**
  Imagine a coin that, right now, has an objective chance of 50% for Heads. According to **HS**, this "50%" claim is true because the *actual* total history of the world (including all future tosses) forms a pattern that is best summarized by a 50% probability function.

  However, there is a possible future where this coin lands Heads on every single toss from now until the end of time. This future is **compatible** with a 50% chance (rare streaks happen). But, if that future *actually occurs*, the total pattern of history would look very different. In fact, the "best system" summarizing *that* history would likely say the chance of Heads was 100%, not 50%.

  So, if that "all-Heads" future comes true, it **undermines** the present claim that the chance is 50%. The future makes the present chance claim false.

  **The Contradiction:**
  Now, apply the **Principal Principle**.
  *   **PP says:** Since the current chance of the "all-Heads" future is non-zero (it's unlikely, but possible), you must assign it some **positive credence**. You cannot rule it out.
  *   **HS + Logic says:** The proposition "The current chance is 50%" is logically incompatible with the proposition "The future is all-Heads." Why? Because if the future *were* all-Heads, the current chance *would not be* 50% (it would be 100%).
  *   **Probability Calculus says:** If two propositions are incompatible, you cannot assign positive credence to one while conditionalizing on the other. If you assume "Chance is 50%," you must assign **zero credence** to "Future is all-Heads."

  **The Result:** The Principal Principle tells you to assign *positive* credence to the undermining future. Logic combined with Humean Supervenience tells you to assign *zero* credence to it. You are required to have two contradictory credences.

  ### (b) Why this is a "Bug" and not a "Wrinkle"

  It is tempting to think, "Okay, so Humean chance is weird. The future can change the past chances. So what?"

  Lewis called it a "bug" because it isn't just a weird feature; it is a **logical inconsistency** within the theory of chance itself.

  1.  **Incoherence of Rationality:** The Principal Principle is supposed to be the bridge between objective chance and rational belief. If following the PP forces you to violate the basic laws of probability (by assigning positive credence to a logical impossibility), then the PP is broken.
  2.  **Definition of Chance:** Lewis wanted to define chance in a way that makes sense of our scientific practices. If the "chance" posited by science entails that rational agents must be irrational, then the Humean analysis fails to capture what we mean by "chance."
  3.  **No Admissible Evidence:** The standard escape route for PP violations is to say the agent has "inadmissible evidence" (like crystal ball gazing). But here, the inadmissibility comes from the chance claim *itself*. If knowing the chance counts as having inadmissible evidence, the Principal Principle becomes vacuous—it never applies.

  For Lewis, this was existential. He was deeply committed to Humean Supervenience (the idea that there is no necessary connection between distinct existences). If HS makes the Principal Principle impossible, he had to choose: give up HS or give up PP. He chose to save HS and fix PP.

  ### (c) How the Rigidified "New Principle" Fixes It

  The solution, developed by Lewis in "Debugged" and refined by Ned Hall and Michael Thau, involves recognizing that under Humean Supervenience, chance propositions carry more information than we thought.

  **The Diagnosis:**
  The original Principal Principle assumes that the proposition "The chance of $A$ is $x$" is *admissible*. It assumes this proposition tells you only about the propensity of $A$, not about the specific pattern of the future.
  The Undermining argument proves that, under HS, the proposition "The chance is 50%" *does* tell you about the future: it tells you that the future will *not* be an undermining future (i.e., it won't be all-Heads).

  **The Fix (The New Principle):**
  The New Principle (NP) adjusts the instruction for setting credence. It says:
  > Your credence in $A$, given that the chance is $x$, should be $x$ **only after you have accounted for the fact that the chance hypothesis rules out undermining futures.**

  In intuitive terms: When you learn the chance is 50%, you are implicitly learning two things:
  1.  The propensity is 50%.
  2.  The future history will be of a type that supports a 50% propensity (i.e., it won't be the "all-Heads" future).

  The New Principle tells you to distribute your credence over the *remaining* possible futures (the ones that don't undermine the chance), rather than all logically possible futures.

  **Where Rigidification Comes In:**
  This is the specific contribution of Hall and Thau. They argue that the confusion arises because we treat the term "chance" ambiguously.
  *   **Non-Rigid:** In some contexts, "the chance" refers to whatever function supervenes on the world we are considering. (In the "all-Heads" world, "the chance" refers to the 100% function).
  *   **Rigid:** In the context of the Principal Principle, we must treat "the chance" as referring to the **actual** chance function, even when we are imagining counterfactual futures.

  By **rigidifying** the chance term, we fix the reference to the actual chance function (the 50% one). We then acknowledge that this specific function *cannot* coexist with the "all-Heads" future. The New Principle effectively says: "Conditionalize on the actual chance function, and recognize that doing so logically excludes undermining futures. Distribute your remaining credence proportionally among the futures that *are* compatible with this function."

  This dissolves the contradiction. You no longer assign positive credence to the undermining future *conditional on the chance being 50%*, because the chance being 50% logically precludes that future. You assign positive credence to it only *unconditionally*. The PP is modified so it no longer demands the impossible.

  ### (d) Is the Fix Successful?

  In the literature, the reception is mixed but leans toward "technically successful, metaphysically costly."

  1.  **Technical Success:** Most agree that the New Principle (especially in the Hall/Thau formulation) successfully removes the logical contradiction. It restores consistency between Humean Supervenience and a normative principle for credence. The "bug" is debugged.
  2.  **Metaphysical Cost:** However, many philosophers argue that the fix saves the theory only by making it less intuitive.
      *   **Loss of Simplicity:** The original Principal Principle was elegant: "Credence matches Chance." The New Principle is: "Credence matches Chance, adjusted for the logical constraints the chance claim imposes on history." This is harder to motivate as a basic norm of rationality.
      *   **The Nature of Chance:** Critics (like Richard Black or Carl Hoefer) argue that if chance claims carry this much hidden information about the future pattern, they stop looking like "objective chances" and start looking like disguised descriptions of history.
      *   **Lingering Worry:** Some argue that while the *contradiction* is gone, the *explanatory power* is diminished. If we have to rigidify and adjust for undermining to make sense of chance, perhaps Humean Supervenience is the wrong metaphysics for probability to begin with.

  **Summary for your seminar:**
  You can confidently say that the New Principle resolves the *logical inconsistency* (the bug) by admitting that chance propositions are inadmissible evidence regarding the global future pattern. However, the *philosophical worry* lingers: the fix makes the connection between chance and credence much more complex than the original intuition suggested, leading some to suspect that Humean Supervenience is simply incompatible with our pre-theoretic concept of objective chance.
