          *   *Draft Question:* How does a chain with no beginning support anything? Isn't this coherentism?
          *   *Refinement:* Focus on the *direction* of support. Foundationalism is bottom-up. Coherentism is mutual. Infinitism is... endless forward?
          *   *Likely Answer:* "Support comes from the *potential* of the series, not a foundational anchor."
          *   *Follow-up:* If the support relies on the potential of the whole series, doesn't that make the justification holistic? If it's holistic, what work is the 'linear' requirement actually doing?

