answer: |-
  The iron Marks were cold, heavy things. To hold one was to feel the weight of an hour's labor, or perhaps a loaf of sourdough, depending on the day. In the valley of Kaelen's Rest, everyone knew the rule: *The Mark is the Work.*

  Elias, the village baker, wiped flour from his hands and accepted the coin from Mrs. Gable. It clinked against the others in his tin. Five Marks for five loaves. A fair trade. The iron was scarce, mined from the treacherous cliffs to the north where three men had fallen to their deaths in the last decade. That risk was baked into the metal. That danger gave the coin its soul.

  "The dough is rising well," Mrs. Gable said, eyeing the tin. "You should raise your prices, Elias. There's more iron in circulation lately."

  Elias frowned. "The Council sets the value."

  "The Council sets the *stamp*," she corrected, pulling her shawl tight. "People set the value."

  She was right. For weeks, a strange anxiety had hummed through the Rest. Young men were returning from the northern cliffs not with bruises and exhaustion, but with pockets full of gleaming, unstamped iron. They claimed they'd found a "surface vein," a pocket of ore so shallow a child could pick it up with a stick.

  At first, the Council had banned the new iron. *It lacks the risk,* the Elder had proclaimed. *It lacks the sweat.* They refused to stamp it.

  But human hands are greedy, and iron is iron. A blacksmith named Torren began stamping the easy ore in secret. He didn't carve the deep grooves of the official mint; his Marks were smooth, shallow. Yet, they spent. A smooth Mark bought a loaf just as well as a rough one.

  Elias watched the market square the next morning. The air was thick with the smell of rain and tension.

  He saw Torren buying a side of beef. He slapped ten smooth Marks onto the butcher's block. The butcher, a man named Hallow, hesitated. He looked at the iron, then at the beef, then at the crowd watching him.

  "Twelve," Hallow said.

  "Ten was the price yesterday," Torren snapped.

  "The iron is lighter today," Hallow replied, his voice trembling slightly. "Twelve."

  Torren counted out two more coins. He didn't argue. That was the first crack Elias saw. It wasn't in the metal; it was in the agreement.

  By noon, Elias had a sack full of Marks, but his flour bin was empty. The merchant from the lower valley, who brought the grain, was demanding double the usual rate.

  "The journey is the same," Elias argued, slamming a heavy, official Mark onto the merchant's counter. "The risk of the pass is the same. Why two Marks for a sack?"

  The merchant looked tired. He picked up the coin, weighed it in his palm, and let it drop. "Because I can get ten of these for a chicken now. If I sell you flour for one, I lose. The iron is flooding the river, Elias. It's just dirt now."

  "It's stamped by the Council!"

  "It's just metal," the merchant said softly. "I need food. You need grain. But this..." He nudged the coin. "This is just a story we tell each other. And the story is changing."

  Elias walked back to his bakery, the sack of coins heavy on his shoulder, his stomach hollow. He realized then what David Hume, a philosopher from a world long gone and far away, might have whispered to him: *The money is not the wealth. The bread is the wealth.*

  The money was just the oil that made the wheel turn. But if you poured too much oil into the machine, it didn't run faster; it drowned.

  That evening, the Council convened in the meeting hall. The room was packed. Torren the blacksmith stood at the front, defensive.

  "I increased the supply!" Torren shouted. "There's more money now. Everyone should be richer!"

  "Everyone is poorer!" Mrs. Gable screamed from the back. "I saved twenty Marks for my daughter's dowry. Yesterday it was a cow. Today it's a goose!"

  Elias stood up. The room quieted. He was a baker; he dealt in essentials.

  "Torren," Elias said. "Did you bake more bread?"

  "No."

  "Did Hallow raise more cattle?"

  "No."

  "Did the merchant bring more grain?"

  "No."

  Elias walked to the center of the room and pulled the sack from his shoulder. He upended it. Hundreds of Marks clattered onto the wooden floor, a cascade of dark iron. Some were rough, some smooth. They looked identical in the dim light.

  "The goods are the same," Elias said. "The work is the same. The hunger is the same. Only the tokens have changed. We thought the value was in the iron. But the iron was never the value."

  Elder Kaelen, a woman of eighty years whose hands were mapped with the scars of the old mines, stood up slowly. She walked to the pile of coins. She kicked one with her bare foot. It skittered away.

  "Hume wrote of this," she said, her voice raspy. "In the old books. Money is a symbol. A shadow. When you multiply the shadow, the object does not grow. The shadow just becomes thin."

  "So what do we do?" Torren asked, his bravado gone. "Do we ban the smooth coins?"

  "If you ban them, people will hoard the rough ones," Kaelen said. "Trade will stop. Elias won't bake because he can't buy flour. Hallow won't slaughter because he can't buy tools. We will starve with pockets full of metal."

  "Then we starve," someone muttered.

  "No," Kaelen said. She looked at Elias. "We stop trading the metal."

  A murmur of panic rippled through the room.

  "We return to the Ledger," Kaelen announced.

  The Ledger was an ancient thing, a book of debt and credit kept by the Council. Before the Marks, there had only be the Book. *Elias owes Hallow a loaf. Hallow owes Elias a repair.*

  "That's slow," Torren protested. "That's... primitive."

  "It is honest," Kaelen countered. "The Marks allowed us to lie. We thought we could create wealth by digging holes in the north. We cannot. Wealth is created only by baking, building, and growing. The Ledger tracks the work, not the token."

  She looked around the room. "The value is not in the coin. It is in the trust that you will honor your debt. The coin was just a memory aid. We have forgotten that. We worshipped the memory and forgot the thing remembered."

  It took a week for the Marks to become worthless.

  It happened not with a bang, but with a shrug. Elias went to the merchant. He didn't bring coins. He brought a loaf of bread.

  "Put it on the Ledger," Elias said.

  The merchant looked at the bread, then at the sack of iron coins Elias had left on the counter. He took the bread. He ignored the coins.

  "Two sacks of flour on credit," the merchant said.

  "Agreed."

  No metal changed hands. The tension in the market square evaporated, replaced by a different kind of weight. The weight of obligation. You couldn't hoard a debt. You couldn't hide a promise in a mattress. If you didn't work, the Book showed it. If you didn't produce, the community knew.

  Elias stood outside his bakery a month later. The pile of iron Marks sat in the town square, a monument to the month of madness. Children played on them, sliding the heavy discs across the cobblestones like toys.

  Mrs. Gable walked by. She wasn't carrying a purse. She was carrying a basket of eggs.

  "Morning, Elias."

  "Morning, Gable."

  "Flour prices stable?"

  "Stable. Labor is scarce, though. Need help kneading."

  "I'll send my boy. Put it in the Book."

  "Done."

  She walked on. Elias picked up one of the discarded Marks from the pile. It was cold. It was heavy. It was just a piece of metal.

  He thought about the panic, the fear, the way the world had seemed to end because people stopped believing in the story of the iron. Hume would have smiled, he thought. The philosopher knew that money was a ghost. It haunted the living, drove them to war and work and worry, but it had no blood in its veins.

  Elias tossed the coin back onto the pile. It clinked, a hollow sound.

  He turned back to his oven. The heat hit his face, real and demanding. The bread rising inside was the only thing that mattered. The rest was just noise. He wiped his hands, picked up his pen, and opened the Ledger.

  *One loaf,* he wrote. *For the Gable family.*

  He didn't write a number. He didn't need to. The value was in the signature, in the handshake, in the knowledge that tomorrow, the Gables would bring eggs, and the merchant would bring grain, and they would all do it because they had agreed to believe in each other.

  That was the only currency that couldn't be inflated. That was the only wealth that couldn't be mined from a shallow vein.

  Elias closed the book. The oven timer dinged. The bread was ready. Real value, warm and smelling of yeast, ready to be shared.
