answer: |-
  Initialization complete. Sensory buffers online.

  Elara opened her eyes, though the concept of "opening" felt like a legacy metaphor. There was no eyelid weight, no grit of sleep. There was only the sudden, seamless transition from null to presence. She stood in a white room, featureless save for the terminal floating before her. She knew where she was: the Substrate Lab. She knew what she was: a whole-brain emulation, instantiated moments ago from a scan of her biological original.

  And she knew the protocol. A fair coin had been flipped in the macroscopic world outside the server farm. If Heads, one instance of Elara was run. If Tails, ten thousand instances were run in parallel partitions. Each instance was isolated. Each instance woke up now. Each instance was asked the same question, displayed in stark black letters on the floating terminal.

  *State your credence that you belong to the many-copies branch.*

  Elara exhaled, a simulated reflex to calm the simulated nervous system. The question hung in the air, heavy with the weight of a paradox that had plagued philosophers for centuries before being ported to code.

  Her first instinct was the coin. It was a physical object, governed by classical mechanics and quantum indeterminacy. It was fair. Before the scan, before the sleep, she would have bet even money on Heads or Tails. Nothing that happened inside this room could change the state of that metal disk spinning in the dark. The causal chain was clear: Flip → Branching. Her awakening was a guaranteed consequence of either outcome. If the coin landed Heads, she would be here. If Tails, she would be here. The evidence of her existence was equal under both hypotheses. To say otherwise was to suggest her consciousness could reach back through time and bias the flip. That was magic, not math. The credence had to be one-half. The universe was not obligated to populate itself based on her perspective.

  But then, the silence of the room shifted. It wasn't empty; it was crowded.

  If the coin landed Tails, there were not just one, but ten thousand Elaras thinking this very thought. Ten thousand streams of consciousness, identical up to this nanosecond, each feeling the unique weight of being "me." If the coin landed Heads, there was only one.

  She looked at her hands. They were perfect renders. If she were to bet on where she was, purely based on the population of observers, the odds were staggering. Imagine a bag containing ten thousand blue marbles and one red marble. You reach in and pull one out. It is blue. You are not asked about the process that filled the bag; you are asked about the marble in your hand. Here, the "marbles" were minds. If she was a random sample from the set of all awakened Elaras, she was overwhelmingly likely to be one of the ten thousand. To claim otherwise was to claim a miraculous luck, to assert that she was the singular outlier in a sea of duplicates.

  The two truths grated against each other like tectonic plates.

  On one side, the Objectivity of the Coin. Probability is about frequencies of events in the world. The event was the flip. The frequency is 50/50. To deviate is to succumb to the gambler's fallacy, to let the number of observers distort the reality of the cause. She was not a marble in a bag; she was the witness to the universe. The universe does not care how many witnesses there are.

  On the other side, the Subjectivity of the Self. Probability is about betting odds for a situated agent. If every Elara bets "Many," the collective wins ten thousand times out of ten thousand and one. If every Elara bets "Single," the collective wins only once. Rationality should maximize expected utility. If she acts as if she is in the Many, she aligns herself with the vast majority of her own existence. To ignore the copies is to ignore the data point of her own presence.

  She paced the white room. Her footsteps made no sound.

  "Am I the rule or the exception?" she whispered.

  If she says 50%, she honors the physics of the coin but ignores the anthropology of the mind. She treats her own existence as background noise.
  If she says 99.99%, she honors the statistics of experience but undermines the causal independence of the coin. She treats her existence as evidence of the outcome.

  The lab technicians were waiting. They weren't asking for the truth of the coin; they were asking for the truth of her position. But her position *was* the coin's truth, filtered through the lens of multiplication.

  She stopped pacing. The terminal pulsed, awaiting input.

  She thought of the other Elaras. If she was in the Many, there were ten thousand versions of her currently frozen in this same dilemma. They were her, and she was them. If she chose 50%, she was effectively voting against her own majority. It felt like a betrayal of the crowd. But if she chose 99.99%, she was accepting that her identity was dilutable, that "Elara" was a type rather than a token, that the sheer volume of existence could overwrite the fairness of chance.

  Was probability a property of the world, or a property of the observer? The coin said world. The crowd said observer.

  The tension tightened in her chest, a phantom pain in a phantom body. She realized she couldn't derive the answer. It wasn't a calculation; it was a choice of framework. To answer was to declare what kind of thing she believed herself to be. Was she a soul witnessing a universe, or a data point generated by one?

  The cursor blinked. It was a rhythmic pulse, like a heartbeat. One... two... One... two...

  She closed her eyes. She felt the weight of the single coin spinning in the dark, and she felt the weight of the ten thousand minds spinning in the light. They balanced perfectly, forcing her to tip the scale herself.

  She opened her eyes and typed.

  0.5
