prompt: |-
  So I spent about 30-odd years doing gravitational physics before I retired, and I've fallen down a metaphysics rabbit hole since then, which is how I ran into Max Black's old thought experiment about the two spheres -- a universe with nothing in it but two exactly similar iron spheres, meant to show that Leibniz's principle of the identity of indiscernibles (no two distinct things share every property) is just false. What's bugging me is that this smells a lot like the hole argument from my own field: two diffeomorphic spacetimes that agree on every qualitative fact but supposedly differ over which point is which, and how most people I trained with eventually decided spacetime points don't have that kind of primitive "thisness" independent of the metric, mainly to save determinism. So can you write me a dialogue between two equally sharp philosophers -- one who takes Black's spheres to refute the identity of indiscernibles and is fine biting the bullet on primitive, non-qualitative identity (haecceities, I think their called), and one who's a died-in-the-wool Leibnizian trying to save the principle, maybe by denying the scenario is really coherent or by leaning on the relational vs substantival space stuff. I want them actually engaging with each other's best moves, not just talking past one another -- and I'd love it if my hole-argument analogy came up and got pressure-tested from both sides rather than just nodded along to. Doesn't need to be long, a page or so is plenty.
