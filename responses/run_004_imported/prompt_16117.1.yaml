      *   **The Critique (Binmore/Stalnaker):** To say a player is rational at a node that *won't* be reached (given CKR) requires evaluating what they *would* do if it *were* reached. But if CKR holds, that node is impossible. So, the condition is vacuously true or relies on counterfactuals inconsistent with the premise. Binmore calls this "empty threats" or "incredible beliefs."
