answer: |-
  **Setting:** *A quiet corner of the faculty lounge at a conference on existential risk and cosmology. Two coffee cups sit between them. **Elena** specializes in formal decision theory and cosmology. **Marcus** focuses on normative ethics and the philosophy of action.*

  **Elena:** You look like you've just seen a ghost, Marcus. Or perhaps a Boltzmann brain?

  **Marcus:** Closer to a phantom correlation, Elena. I've been reading the latest papers on Evidential Cooperation in Large Worlds (ECL). It's haunting me. It's the kind of argument that feels profound until you try to hold it in your hands, at which point it turns into mist.

  **Elena:** Mist is just condensed water, Marcus. It's real. Look, you spent your career worrying about how we ought to act. I spent mine worrying about where we are acting. If the universe is infinite—or even just sufficiently vast due to eternal inflation—then ECL isn't metaphysics. It's arithmetic. If there are infinitely many agents reasoning like you, your decision is evidence of their decisions. To ignore that is to leave utility on the table.

  **Marcus:** Is it arithmetic, though? Or is it wishful thinking dressed up as probability? My first objection is the one that always kills these cosmic analogies: the reference class problem. In Newcomb's Problem, the Predictor is defined. It knows you. In ECL, who is the "other"?

  **Elena:** Any agent whose decision algorithm is sufficiently isomorphic to yours.

  **Marcus:** "Sufficiently isomorphic." There's the rub. Are we talking about agents who share my exact neurophysical state? My cultural background? My abstract computational structure? If I define the class too narrowly—say, exact physical duplicates—the probability of correlation drops to zero in a chaotic universe. If I define it too broadly—say, "any agent capable of reasoning"—the correlation becomes noise. There is no principled boundary where "evidential relevance" turns on. Without that boundary, the expected utility calculation is undefined.

  **Elena:** I grant you that the boundary is fuzzy. But decision theory is always dealing with fuzzy partitions. When you play a Prisoner's Dilemma with a stranger, you estimate the probability they are "like you" based on limited data. You don't demand a neural scan. ECL just scales this up. In an infinite universe, even if the probability of a specific agent being "like me" is infinitesimal, the *number* of such agents is infinite. The product isn't zero. You're letting the perfection of the reference class paralyze the necessity of the reasoning.

  **Marcus:** But in the local Prisoner's Dilemma, I have causal history to lean on. We share a culture, a species, maybe even a training dataset. In the cosmic case, I have no causal contact with these Hubble volumes. I'm relying entirely on the assumption that physics produces convergent reasoning *and* that my specific deliberation right now is evidentially linked to theirs.

  This leads to my second point: this argument is entirely parasitic on Evidential Decision Theory (EDT). If I'm a Causal Decision Theorist (CDT), I don't care. My action cannot *cause* their action across a cosmological horizon. Why should I accept the EDT premise just to accommodate a cosmological speculation?

  **Elena:** Because CDT loses. We've been over this. In Newcomb's Problem, the one-boxer wins. In Parfit's Hitchhiker, the agent who can commit gets the ride. CDT agents are systematically punished in cases where their decision is correlated with outcomes they cannot causally influence. ECL is just Newcomb's Problem written across the sky. If you reject ECL because you're a CDT agent, you're essentially saying, "I refuse to win in cosmic scenarios because I don't like the mechanism."

  **Marcus:** I'd say I refuse to restructure my ethics based on a decision theory that still struggles to give consistent advice in medical Newcomb cases. But let's set aside the decision theory wars. Let's assume EDT is correct. My third worry is about the practical upshot. You claim ECL urges us to "moderate our values toward a broader coalition." But isn't that just standard cosmopolitan morality?

  **Elena:** No. Standard cosmopolitanism is usually grounded in causal empathy or contractualism. ECL is colder. It says you should cooperate with distant agents *even if* you have nothing in common with them other than the structure of your reasoning. It argues against value fanaticism. If you pursue a narrow value system aggressively, you risk defecting against the vast coalition of your "copies" who might hold slightly different values. ECL suggests a compromise: support a union of values rather than imposing your own.

  **Marcus:** But how does that actually change behavior? If I'm already a utilitarian, I'm already counting everyone. If I'm a partisan, ECL asks me to trust that there are more "partisans like me" out there than "altruists like me." It seems ECL can be weaponized by anyone. A fanatic could argue, "There are infinitely many fanatics like me; therefore, I should double down to signal to them."

  **Elena:** *Pauses, stirring her coffee.* That is a genuine risk. If the fanatic is certain their reference class is the dominant one, ECL amplifies their fanaticism. But that's why the uncertainty matters. Since you don't know the distribution of values in the multiverse, the rational move is to hedge. You assume there are agents with different values who reason similarly. To cooperate with them, you must compromise. So, ECL doesn't just say "cooperate"; it says "cooperate on a meta-level." It pushes you toward value pluralism.

  **Marcus:** I'll concede that the push toward pluralism is distinct from standard utilitarianism. But the epistemic burden is crushing. To make this calculation, I need to know the measure of different agent-types in the infinite universe. We don't have a solution to the cosmological measure problem. We can't even agree on how to count observers in eternal inflation. You're asking me to base my moral strategy on a physics problem we haven't solved in forty years.

  **Elena:** I'm not asking for precision. I'm asking for non-zero weight. Even if the probability is obscure, the stakes are infinite. Pascal's Wager applies here. If there is even a small credence that the universe is infinite and EDT is correct, the expected value of ECL cooperation dominates local causal concerns. You don't need to solve the measure problem to see that the infinite tail wags the dog.

  **Marcus:** And that's exactly where I dig in. When the "infinite tail" swamps all local evidence, your theory has become insensitive to reality. If I can justify *any* action by pointing to a possible infinite correlation, the theory loses its grip on the world. It becomes a license for solipsism. I might decide to sit on this couch all day because I reason that infinitely many copies of me are doing productive work elsewhere, and our correlation is enough.

  **Elena:** *Laughs.* That's the "free-rider on yourself" objection. But it fails because if you reason that way, so do your copies. If you defect, they defect. The correlation works both ways. You only get the benefit of their cooperation if you cooperate. So you still have to do the work.

  **Marcus:** Fine. You've defended the internal consistency. But I remain unconvinced that this moves the needle on what we should actually *do*. It seems to collapse into: "Be reasonable, assume others are like you, and compromise." We didn't need infinite universes to tell us that. Kant gave us the Categorical Imperative. Rawls gave us the Veil of Ignorance. ECL adds layers of cosmological speculation to reach a conclusion that secular humanism reached a century ago.

  **Elena:** It adds *leverage*. Humanism relies on shared sentiment. ECL relies on shared logic. It extends moral consideration to agents we can never meet, who may not even share our biology, provided they run the same algorithm. It's a more robust foundation for a cosmic ethics. But... *She sighs.* I will concede this: if the reference class is too vague, the "correlation" becomes a mirror. We might just be cooperating with our own projections. If I assume distant agents reason like me, and I reason poorly, I've just scaled up my error.

  **Marcus:** And I will concede this: if EDT is the correct normative theory, and the universe is infinite, then ignoring ECL is technically irrational. It is a form of myopia. My worry isn't that the math is wrong, but that humans aren't built to handle probabilities of this magnitude. We treat "infinity" as a number, not a concept that breaks our intuition.

  **Elena:** So where does that leave us?

  **Marcus:** It leaves us with a heuristic. Use ECL as a check against tribalism. Ask yourself: "Am I prioritizing my local causal cluster over the logical cluster?" But don't bet the farm on it. Don't let the infinite universe dissolve your responsibility to the finite one standing in front of you.

  **Elena:** Agreed. It's not a replacement for local ethics. It's a horizon. We navigate by the stars, even if we can't reach them. But I still think you're underestimating the weight of that horizon. One day, when we understand the measure problem better, ECL might not be a philosophical curiosity. It might be the only thing that makes sense.

  **Marcus:** And on that day, I hope we've figured out how to define "agent" better than we have today. Until then, I'll stick to the causal world. It's smaller, but the feedback is clearer.

  **Elena:** *Raises her cup.* To the causal world, then. For now.

  **Marcus:** *Clinks his cup against hers.* For now.
