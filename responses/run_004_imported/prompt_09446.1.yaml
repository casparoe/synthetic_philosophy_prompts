answer: |-
  Here are eight questions designed to leverage your background in physiology while pressing the philosophical weaknesses of the Selected-Effects (SE) account. They are ordered to build from metaphysical intuitions to empirical applications, ending with the criterion for falsification.

  **1. The Swampman Intuition**
  "Let's begin with the classic 'Swampman' case. If a molecule-for-molecule duplicate of a human were to spontaneously assemble via cosmic accident, it would have no evolutionary history and no lineage of selection. Yet, physiologically, its heart would be indistinguishable from mine. On your etiological view, does this Swampman's heart have the function of pumping blood? If you say 'no,' you clash with the intuition that identical structures have identical capacities. If you say 'yes,' you seem to admit that current organization, not history, is doing the work."

  *   **Follow-up:** "If you reply that our intuitions about Swampman are simply mistaken because 'function' is essentially historical, I'd ask: Why should biology care about a definition of function that renders two physiologically identical organs functionally distinct based solely on a past we cannot observe?"

  **2. The Novel Mutation Problem**
  "Consider a brand-new mutation that arises in a population. It confers an immediate survival advantage, but it has not yet been 'selected' in the sense of increasing in frequency over generations. It has no history of reproduction. On the etiological account, does this trait have a function *yet*? It seems odd to tell a physiologist that a trait currently keeping an organism alive lacks a function simply because it hasn't had time to become historical."

  *   **Follow-up:** "If you argue it has a 'causal role' but not a 'proper function' until selection acts, aren't you creating a metaphysical waiting period that has no correlate in the actual physiology of the organism?"

  **3. Vestigial Structures**
  "I'd like to test how far 'selected effect' and 'current usefulness' can come apart. Consider a vestigial structure, like the pelvic bones in a whale. They have a clear selective history (walking in ancestors), but they currently contribute nothing to walking. Does the etiological account say the function of these bones is *still* walking? If so, the definition seems untethered from what the trait is actually doing. If not, at what exact point in the degradation of the trait does the function vanish?"

  *   **Follow-up:** "If you say the function vanishes when selection stops maintaining the trait, doesn't that concede that current maintenance (and thus current contribution) is actually what matters, rather than the original origin?"

  **4. Spandrels and Exaptation**
  "Gould and Lewontin warned us that many traits are architectural by-products or later co-optations, not direct products of selection for their current use. If a trait arose as a non-adaptive by-product but is now essential for survival, what is its function? The etiological view looks backward to the origin, which might say 'no function,' while the organism's survival depends entirely on its current utility. How do you avoid labeling essential, life-sustaining traits as functionless simply because they started as accidents?"

  *   **Follow-up:** "If you distinguish between 'original function' and 'current use,' why should the biological community prioritize the historical label over the current causal contribution when studying how the organism survives?"

  **5. Malfunction and the Causal-Role Rival**
  "Proponents of the Causal-Role account define function by what a part currently contributes to a system's capacity. The standard criticism is that this view cannot explain malfunction—a broken heart doesn't pump, so on a purely causal view, it has no function. Please explain plainly how your etiological view solves this, and why your solution is preferable for working scientists. Is the advantage merely linguistic, or does it track a real biological difference?"

  *   **Follow-up:** "If you argue that SE allows us to say the heart is 'failing' rather than 'functionless,' isn't that just a normative judgment we project onto the biology? Why is your historical normativity more scientific than a physiologist's current capacity normativity?"

  **6. Convergent Evolution**
  "Consider convergent evolution: the wing of a bird and the wing of an insect perform the same aerodynamic work, but they have entirely distinct selective histories and lineages. If function is fixed by specific history, does it follow that bird wings and insect wings have *different* functions, despite doing the exact same physical work? If SE forces us to say they have different functions, doesn't that make comparative physiology impossible, since we compare functions across lineages constantly?"

  *   **Follow-up:** "If you reply that they share a 'general' function but differ in 'specific' function, aren't you admitting that the physically observable contribution is the primary definition, with history merely adding a secondary footnote?"

  **7. Traits Fixed by Drift**
  "Not every trait that persists is there because of natural selection; some fix in a population via genetic drift. If a trait becomes universal in a species purely by chance, but currently contributes to the organism's survival, does it have a function? The etiological view seems committed to saying 'no,' because there was no selection *for* the trait. Does this mean a vast number of traits currently keeping organisms alive are functionless?"

  *   **Follow-up:** "If you accept that drift-fixed traits have no function, doesn't that render the concept of function useless for large swathes of genomics and molecular biology where drift is a dominant explanation?"

  **8. The Falsification Condition**
  "To close, I want to ask about the status of the theory itself. Philosophy of science often asks what evidence would count against a hypothesis. What empirical discovery, if any, would lead you to give up the selected-effects view? If every counter-example—from Swampman to drift—is accommodated by refining the definition of 'history' or 'selection,' are we left with a tautology rather than a theory that tracks biological reality?"

  *   **Follow-up:** "If you answer that this is 'conceptual analysis' rather than an empirical theory, why should biologists adopt it as the standard for describing real, physical systems that exist in the present moment?"
