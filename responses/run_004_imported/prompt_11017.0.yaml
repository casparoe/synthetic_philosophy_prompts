prompt: |-
  Me and a friend are trying to decide whether to pay extra for flood coverage on a rental property we're about to buy, and the climate risk estimates for the area are a mess -- some credentialed people give a single number, others just give a range, and what we do get goes from barely elevated to seriously elevated over a 30-year mortgage, not because anyone's data is noisy but because the models and assumptions behind the numbers don't agree with each other. My friend wants to just average it all into one probability and run the expected-value math like any normal bet. Something about that feels off to me -- like its pretending we know how confident to be about the risk, not just what the risk is -- but I can't explain why that should change what we do. Is he right, or is there a better way to handle a decision like this?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Problem:**
      *   **Context:** Buying a rental property, deciding on flood insurance.
      *   **Issue:** Climate risk estimates vary wildly (single numbers vs. ranges, low vs. high risk over 30 years).
      *   **Cause:** Model/assumption disagreement, not data noise (deep uncertainty).
      *   **Friend's Approach:** Average the probabilities and use Expected Value (EV) analysis.
      *   **User's Intuition:** Averaging feels wrong because it hides the *uncertainty about the uncertainty* (confidence levels).
      *   **Goal:** Determine if the friend is right or if there's a better decision-making framework for this specific type of uncertainty.

  2.  **Evaluate the Friend's Approach (Expected Value with Averaged Probabilities):**
      *   *Pros:* Simple, standard for "risk" (known probabilities).
      *   *Cons:* Fails under "ambiguity" or "deep uncertainty" (unknown probabilities). Averaging a 1% risk and a 50% risk gives 25.5%, but the *implications* of those two scenarios are vastly different. It treats model disagreement as mere statistical noise, which the user explicitly noted it is *not*.
      *   *Key Concept:* Knightian Uncertainty (Frank Knight). Distinguishing between *Risk* (known odds) and *Uncertainty* (unknown odds).

  3.  **Validate the User's Intuition:**
      *   The user is correct. Averaging probabilities when models fundamentally disagree creates a false sense of precision. It ignores "model risk."
      *   If the worst-case model is right, the average EV might underestimate the potential ruin.
      *   This is a classic "fat tail" or "black swan" scenario context.

  4.  **Identify Better Decision-Making Frameworks:**
      *   *Scenario Planning:* Don't average; look at the distinct futures (Low, Medium, High).
      *   *Robust Decision Making (RDM):* Choose the option that performs "well enough" across *all* plausible scenarios, rather than "best" on average.
      *   *Minimax Regret:* Minimize the maximum regret (or loss).
      *   *Precautionary Principle:* If the downside is ruinous (bankruptcy), avoid it regardless of low probability.
      *   *Real Options Analysis:* Keep flexibility open (e.g., short-term insurance, exit strategy).

  5.  **Structure the Advice:**
      *   **Validation:** Confirm the user's intuition is sound (Knightian Uncertainty).
      *   **Critique of Averaging:** Explain *why* averaging fails here (distributions matter, ruin matters).
      *   **Alternative Frameworks:**
          1.  *Scenario Analysis (The "Spread"):* Look at the best and worst cases separately.
          2.  *Robustness:* Which choice survives the worst case?
          3.  *Ruins vs. Nuisance:* Can you absorb the hit?
          4.  *Optionality:* Can you change your mind later?
      *   **Practical Steps for the Rental Property:** Specific advice on insurance, financing, and exit strategies.
      *   **Conclusion:** Summarize the mindset shift.

  6.  **Drafting the Content (Iterative refinement):**
