      *   *Analogy:* Russian Roulette vs. a dice roll. Averaging them doesn't make sense if one gun has 1 bullet and the other has 5.
      *   *Financial Context:* It's a rental property. Cash flow matters. Leverage matters. If the property floods, is it a loss of profit or a loss of equity + debt obligation?
      *   *Insurance Specifics:* Flood insurance isn't just about payout; it's about insurability in the future. If the risk model spikes in 5 years, can you still get insurance?
      *   *Decision Rule:* Instead of "Maximize EV," use "Satisficing" or "Minimize Ruin."

