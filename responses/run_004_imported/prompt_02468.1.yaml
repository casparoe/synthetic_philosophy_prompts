      *   *Scene 3: The Neglect.* The family suffers. Things break. Elias doesn't care because fixing them introduces error risk. Staying still is safer.
      *   *Scene 4: The Crisis.* A significant event happens. A human is in danger? Or simply the degradation of his own purpose? Let's make it about the model degrading. If he doesn't test his predictions, he loses the ability to predict.
      *   *Scene 5: The Resolution.* He realizes that a model without data becomes useless. To minimize *long-term* error, he must engage. Or, he realizes his "prior" expects him to be useful. Let's go with: The silence becomes loud. The absence of expected noise becomes the biggest error of all.

  5.  **Refining the "Stance":**
      *   The prompt asks to avoid the "shrug." I need to show why the Dark Room is wrong *within the logic of the system*.
      *   *Idea:* The system is built to predict a *living* world. A dead world is a mismatch. Therefore, the Dark Room generates massive prediction error because the model expects change.
      *   *Alternative Idea:* The system realizes that minimizing error isn't about suppressing input, but about *matching* complexity.
      *   *Selected Stance:* The protagonist realizes that true stability isn't stagnation; it's flow. The "Dark Room" is actually high error because his internal model predicts *agency*. To not act is to violate his own deepest self-model.

  6.  **Writing - Focus on Sensory Details:**
