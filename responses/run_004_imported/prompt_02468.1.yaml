  2.  **Deconstruct the Core Concept for Storytelling:**
      *   *Prediction Error Minimization:* The protagonist feels discomfort when reality doesn't match expectation. Comfort comes when reality matches expectation.
      *   *The Dark Room:* A state of zero input, zero change, zero error. Ultimate comfort vs. ultimate stagnation/death.
      *   *The Counter-Force:* Why do we *not* do this? Usually, it's framed as "prior preferences" (we are built to expect food, social contact, etc.) or "exploration" (reducing long-term uncertainty).
      *   *The Stance:* The prompt asks me to take a stance.
