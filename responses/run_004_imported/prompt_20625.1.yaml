      *   **The "Proof of Ignorance" Nuance:** Fitch shows that *if* we are not omniscient (which we aren't), then *not all truths are knowable*. It doesn't prove we *are* ignorant of specific deep facts, just that the set of knowable truths is not identical to the set of true propositions.

