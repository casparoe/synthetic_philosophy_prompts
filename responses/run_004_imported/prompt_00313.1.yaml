      *   *Round 2: Excluded Middle.* Iris attacks $P \lor \neg P$. Alex defends it as the bedrock of logic.
      *   *Round 3: Meaning of Existence.* Iris: Existence = Construction. Alex: Existence = Consistency within the system.
      *   *Round 4: Consequences.* Alex argues intuitionism kills analysis. Iris argues classical math is playing a game with shadows.
