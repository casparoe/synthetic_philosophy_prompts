answer: |-
  **Seminar Title:** *Naturalizing Intentionality: History vs. Structure*
  **Participants:**
  *   **Dr. Elena Mill:** Defending Teleosemantics (Millikan-style)
  *   **Dr. Jerry F:** Defending Asymmetric Dependence (Fodor-style)
  **Moderator:** Prof. H. Putnam Jr.

  **Prof. Putnam Jr.:** Welcome. We are continuing our series on the naturalization of intentionality. Today, we examine the tension between historical and synchronic accounts of mental content. Dr. Mill, Dr. F, please begin where the literature often does: with the frog.

  **Dr. Jerry F:** Gladly. Let's picture the frog. It sits on a lily pad. A fly buzzes by; the frog snaps its tongue and eats. A BB pellet is fired past its face; the frog snaps at that too, but goes hungry. Now, Dr. Mill, on your view, the content of the frog's neural state is determined by what it was *selected* to do. So, you say the content is <Fly>.

  **Dr. Elena Mill:** Precisely. The neural mechanism has a *proper function*. It was historically selected because it successfully guided the frog to flies. The BB-snapping is a malfunction. It's a failure to perform the proper function, not a successful performance of a different function.

  **Dr. Jerry F:** Here is the disjunction problem. You say the content is <Fly>. But causally, the mechanism is triggered by flies *and* BBs. Why isn't the content <Fly or BB>? Or, more problematically, why isn't it <Small, Dark, Moving Thing>? After all, the frog snaps at *that* description whether it's a fly or a pellet. If the content is <Fly>, the frog misrepresents the BB as a fly. If the content is <Small, Dark, Moving Thing>, the frog is right about the BB! You need to explain error. But if you define content by what causes the snapping, you lose error. If you define it by selection, you lose the causal connection.

  **Dr. Elena Mill:** We don't lose the causal connection, Jerry. We contextualize it. The content is fixed by the conditions under which the mechanism *contributed to fitness* in the past. Snapping at flies contributed to survival and reproduction. Snapping at BBs did not. Therefore, the condition for successful representation is the presence of a fly. The BB triggers the mechanism, but it does not satisfy the truth condition. That is how we get misrepresentation.

  **Dr. Jerry F:** But this relies on selection being fine-grained enough to pick out *flies* rather than *nutritious moving specks*. Evolution selects for reproductive success. If snapping at small dark moving things generally yields flies, and occasionally yields BBs, the fitness benefit is the same. Nature doesn't care about the ontology of "fly" versus "moving speck." It cares about calories. So, why is the content <Fly> and not <Caloric Moving Speck>? Your selection history seems too coarse-grained to pin down the specific semantic content you want. It fixes the *value* of the action, not the *truth conditions* of the representation.

  **Dr. Elena Mill:** That assumes the environment didn't distinguish them. If the visual system evolved to detect the specific wing-beat frequency or UV reflection of a fly, then the selection is for *that* specific input. The proper function is tied to the specific mapping that yielded the benefit. If the frog snaps at BBs, it's because the mechanism is exploiting a correlation that usually holds. The content is determined by the specific variable that was covariant with fitness in the evolutionary environment.

  **Dr. Jerry F:** I remain skeptical that history can do that much heavy lifting without smuggling in our own interpretive stance. But let's press the history dependence further. Consider Swampman. A lightning strike disintegrates a philosopher in a swamp, and by sheer quantum coincidence, reassembles a molecule-for-molecule duplicate from the muck. Swampman has no history. No evolutionary lineage, no learning history. He walks out, sees a tree, and says, "That's a tree."

  **Dr. Elena Mill:** I know where this goes.

  **Dr. Jerry F:** On your view, Swampman has no mental content. His internal states have no proper functions because they have no selection history. He is a zombie, intentionally speaking. He behaves exactly like us, but he thinks nothing. That strikes most people as a *reductio* of teleosemantics. It severs the link between current functional organization and intentionality.

  **Dr. Elena Mill:** I am not going to concede that intuition, Jerry. Our intuition that Swampman has thoughts is a folk-psychological intuition, not a scientific one. If intentionality is a natural phenomenon like digestion or immunity, it requires norms. Norms require a standard of correctness established over time. Swampman has no standard. If his internal state fails to correspond to a tree, nothing has *gone wrong* biologically. There is no malfunction because there is no function.

  **Dr. Jerry F:** So he's just a complex rock?

  **Dr. Elena Mill:** He is a physical duplicate, but he lacks intentional *icons*. However, I would add this: Swampman would immediately begin to acquire proper functions. As soon as his internal states start guiding his behavior and those behaviors have consequences, selection pressures—either evolutionary or learning-based—begin to establish norms. But at t=0? No, he has no content. It is better to accept this counter-intuitive result than to abandon the only viable explanation for *error*. Without history, you cannot distinguish a mistake from a different kind of success.

  **Dr. Jerry F:** That is a hard bullet to bite. But let's turn the table. You say I can't explain error without history. Let's look at Asymmetric Dependence. Suppose 'Cow' tokenings are caused by Cows. Sometimes, Horses-on-dark-nights cause 'Cow' tokenings. My claim is that the Horse-'Cow' connection depends on the Cow-'Cow' connection, but not vice versa. If Cows didn't cause 'Cow' tokenings, Horses wouldn't either. But if Horses didn't cause 'Cow' tokenings, Cows still would. The asymmetry fixes the content as <Cow>. The Horse cases are errors. No history required. Purely synchronic causal laws.

  **Dr. Elena Mill:** But what grounds the asymmetry? Why does the Horse connection depend on the Cow connection? It seems to depend on it precisely because the Cow connection is the *correct* one. The *real* one. The one the mechanism is *for*.

  **Dr. Jerry F:** Not "for." Just nomic. The law linking Cows to 'Cow' is more fundamental.

  **Dr. Elena Mill:** Is it? In a world where Horses are more common than Cows, and the mechanism is triggered by Horses more often, does the asymmetry flip? If your theory is purely synchronic and causal, it looks like frequency matters. But if frequency matters, then if I live in a world of horse-disguises, my content becomes <Horse-Disguise>. You seem to need a notion of "wild" vs. "parasitic" causal paths. But distinguishing a parasitic path from a wild one looks suspiciously like distinguishing a malfunction from a function. And once you say "function," aren't you just a teleosemanticist in denial?

  **Dr. Jerry F:** I'm not appealing to function. I'm appealing to counterfactuals. The law *Cow -> 'Cow'* sustains counterfactuals that *Horse -> 'Cow'* does not. If the Cow were absent, the Horse wouldn't trigger it *in the same way*. It's about the structure of the causal field, not the history of the organism.

  **Dr. Elena Mill:** But who fixes the causal field? If Swampman encounters a cow, and his state tokens 'Cow', you say he has content. I say he doesn't. If he encounters a horse-on-a-dark-night, and it tokens 'Cow', you say it's error. I say it's nothing at all—neither truth nor error. The worry is that your "asymmetry" is only asymmetric relative to a background of normal conditions. And "normal conditions" is a teleological notion. It means conditions under which the system is *supposed* to operate. You've naturalized intentionality by hiding the teleology inside the modal operators.

  **Dr. Jerry F:** And you've naturalized it by hiding the semantics inside the history. You tell me Swampman doesn't think. I tell you your frog doesn't represent <Fly>, it represents <Fitness-Enhancer>. We both have ghosts. Yours is in the past; mine is in the modal structure.

  **Dr. Elena Mill:** Perhaps. But my ghost explains why the frog starves when it eats BBs. It explains the normativity of the biological. Your ghost explains why we *say* the frog made a mistake, but I'm not sure it explains why the frog's biology treats it as one.

  **Dr. Jerry F:** And I'm not sure your biology cares about <Fly> any more than it cares about <Protein>. We seem to be at an impasse. You demand history for norms; I demand structure for intuition.

  **Prof. Putnam Jr.:** And that seems a fitting place to pause for questions. It appears the cost of norms is intuition, and the cost of intuition is norms. Thank you, both.
