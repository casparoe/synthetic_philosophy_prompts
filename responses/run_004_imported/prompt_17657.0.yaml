  7.  **Writing the Content (incorporating word count and timing):**
      *   *Word Count Check:* 130-150 words per minute is standard speaking pace. 5-7 minutes = 650 to 1050 words. I should aim for around 850-900 to be safe.
      *   *Key Phrase:* "The difference between the mission and the man."
