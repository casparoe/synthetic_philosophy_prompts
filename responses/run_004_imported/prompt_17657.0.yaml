answer: |-
  Good morning. Thank you all for being here. For those of you who don't know me, I'm [Your Name], David's grandson.

  Looking around this room, I see two worlds coming together. On one side, there's us—the family who knew him as the man who fixed our bikes, who checked the oil in our cars, who asked about our grades and listened to the answers. On the other side, there are the men who knew him when he was nineteen. The men who knew him before he was a grandfather, before he was a husband, back when he was just a soldier trying to get his friends home.

  I've spent the last few weeks thinking about what I could possibly say that would honor him. And the more I thought, the more I realized that the thing that defined him most wasn't what he said, but what he didn't say.

  We found his Silver Star in a lockbox after he passed. It was tucked away behind old tax returns and insurance papers. He never wore it. He never hung it on the wall. He never brought it up unprompted. In a world where people are constantly encouraged to broadcast their achievements, my grandfather treated his greatest moment of courage like a private debt he had paid, not a public trophy he had won.

  I know there are history books written about the time he served. I know there are debates that will continue for generations about the decisions made in capital cities, about the strategies drawn on maps, and about the politics of that era. But standing here, I've come to understand that those debates belong to the historians and the politicians. They do not belong to the soldier in the field.

  There is a difference between the mission given and the mission lived.

  The reasons a war begins are decided by men in suits in rooms far away from the jungle. But the way a war is fought—is decided by the man in the mud. It is decided by whether he keeps his head when things are falling apart. It is decided by whether he honors the covenant with the person standing next to him.

  My grandfather understood that distinction. He understood that he could not control the orders that came down the chain of command. But he had absolute control over his own loyalty. He had absolute control over his own courage.

  I only heard the story of his medal once, and only because I pressed him. He didn't tell it to look good. He told it because I asked what the medal was for. He said, simply, that there were men who couldn't walk out, and he wasn't willing to leave them. He carried two of them out under fire.

  To me, that is the only verdict that matters in this room.

  Whatever the complexities of the conflict, whatever the shifting tides of policy, the moral weight of a soldier is found in how he treats his brothers. Augustine and Aquinas wrote about the ethics of war, but my grandfather didn't need books to understand the ethics of duty. He knew that leaving a man behind was a sin he couldn't live with. He knew that courage wasn't the absence of fear, but the decision that his friend's life mattered more than his own safety.

  He came home from Vietnam three weeks before I was born. I know, from the stories I've heard and the silence I grew up with, that it wasn't an easy homecoming. The country was divided. The welcome was complicated. But he didn't bring that division into our home. He didn't bring bitterness to the dinner table. He carried the weight of what he saw, yes. He carried the memories of the men who didn't come back. But he didn't carry blame. He didn't carry shame.

  He carried his duty. And he carried it with a quiet integrity that I hope to emulate for the rest of my life.

  To the members of his platoon here today: Thank you. You are the only other people in this world who know exactly what he did and what he saw. You are the witnesses to his character. I know you share a bond that family can't touch. I know that when you look at that medal, you don't see metal; you see a memory of a day when he put himself between danger and his friends. I am grateful that you are here to stand with us as we say goodbye.

  To my family: We lost a man who taught us that honor isn't about being loud. It's about being steady. It's about doing the right thing when no one is watching, and even when no one is thanking you.

  Grandpa, you served your country when you were called. You served your friends when they needed you. And you served your family every day of your life. You kept your word. You carried your burden. And now, you can rest.

  We'll take it from here.

  Thank you.
