          *   If you do supererogatory: Praise.
          *   *The Puzzle:* If the act is *morally best*, why is the *failure* to do it blameless? That's the real gut-punch. It suggests morality has a "safe zone" where you can knowingly choose the lesser good without penalty.

      *   **Conclusion:** Summarize the revelation. The puzzle reveals that morality isn't just about "The Good" (outcomes); it's about "The Agent" (rights, limits, autonomy). The tension is between the world's needs and the self's boundaries.

