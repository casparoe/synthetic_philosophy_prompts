      *   *The philosophical squeeze:* Morality seems to have a "maximizing" pressure. If morality is about making the world better, why would it ever say "stop, you don't *have* to make it better"?
      *   *The conflict:* It's a clash between two deep moral intuitions:
          1.  The Intuition of Liberty (I have a life of my own; I'm not a moral slave).
          2.  The Intuition of Value (If something is truly best, morality should demand it).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the definition but immediately pivot to the tension. Use a concrete example (the burning building is classic, but maybe something slightly more nuanced to show the "better vs. required" tension). Let's stick with the burning building for immediate clarity, but add a lower-stakes version (giving money to charity) to show it applies to everyday life.

      *   **The "Gut-Level" Tension (The Two Voices):**
          *   Voice 1 (The Maximizer): "Morality is about making things better. If you can prevent suffering without equal cost, you should."
          *   Voice 2 (The Agent): "I am a person, not a tool. I have my own projects. I can't be on call 24/7."
          *   *The Puzzle:* Supererogation tries to satisfy both. But logically, if Voice 1 is true, Voice 2 is wrong. If Voice 2 is true, does Voice 1 lose its grip on "ought"?

      *   **Why it's not just definitional:**
          *   It's not about how we use words; it's about the *authority* of morality.
          *   If I say "It's better to jump in, but you don't have to," am I saying morality is optional when the stakes are highest? That feels weird.
          *   If I say "You *must* jump in," I turn saints into minimum-wage workers. The specialness of the act vanishes.

      *   **The Relationship Between "Better" and "Required":**
          *   This is the core philosophical insight requested.
          *   Usually, we think: Better $\rightarrow$ Required. (Optimality implies Obligation).
          *   Supererogation breaks this link. It says: Better $\nrightarrow$ Required.
          *   *Why is this hard?* Because "Ought" implies a kind of pressure or command. "Better" implies value. Why would value not generate pressure?
          *   *Analogy:* Think of a game. If there's a winning move, you *should* take it. If morality is a game of "do good," why is there a move that wins more points but isn't required?

      *   **The "Cost" Factor (The Scheffler/Prerogative angle without naming names):**
          *   The key to the intuition is *sacrifice*.
          *   Obligations usually have a cap on cost. Supererogatory acts exceed that cap.
          *   *The Problem:* Where is the line? If I *must* give 10%, why not 11%? If 11% is better, why is it optional? This is the "slippery slope" feeling.

