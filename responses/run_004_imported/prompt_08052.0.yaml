answer: |-
  Good morning. Faculty, families, visiting critics, and the Class of 2024.

  Usually, at a moment like this, the speaker is expected to offer you a blessing. We are supposed to tell you that the world is waiting for your beauty, that your technique is the key to the kingdom, and that if you stay true to your vision, success will follow.

  I am not going to do that. Instead, I want to offer you a warning. Or perhaps, a mirror.

  For the past year, I have been living inside a very difficult, very strange book by Leo Tolstoy. Not *War and Peace*. Not *Anna Karenina*. I am talking about his 1897 treatise, *What Is Art?*

  Most people invoke Tolstoy at a graduation to talk about morality, or his beard, or the fact that he tried to give away his estate. I want to talk about his actual argument. Because if we take Tolstoy at his word, a great deal of what happens in conservatories like this one—and indeed, a great deal of what is currently hanging in your senior shows—is not art at all. It is, in his specific, ruthless vocabulary, "counterfeit."

  Tolstoy argues that the value of art has nothing to do with beauty. It has nothing to do with technical skill. It has nothing to do with how much you know about music theory, or art history, or the Stanislavski method.

  For Tolstoy, art is only one thing: Infection.

  He writes that art is a human activity in which one man consciously, by means of certain external signs, hands on to others feelings he has lived through, and that other people are infected by these feelings and also experience them.

  That is the whole test. Did you feel something? And did you transmit it so clearly that I feel it too? If the answer is yes, it is art. If the answer is no, it is not art, no matter how beautifully you painted the canvas, no matter how perfectly you intoned the aria.

  This is a terrifying standard for a graduating class. You have spent three or four years here at Ashworth mastering craft. You have learned how to control light, how to control pitch, how to control the movement of a body in space. You have learned to make things difficult, things ironic, things complex.

  Tolstoy would look at much of that complexity and see a barrier. He would look at virtuosity for its own sake and see a class signal—a way for the educated to congratulate themselves on understanding a code that the common person cannot crack. He argues that when art becomes exclusive, when it requires a degree to understand it, it stops binding humanity together and starts dividing it.

  And here is the strangest, most honest part of his argument: He applied this standard to himself.

  Imagine standing where I am standing, having written *War and Peace*, and telling the audience that *War and Peace* is a failure. Imagine listening to Beethoven's Ninth Symphony, the anthem of human brotherhood, and calling it "fashionable fraud" because it is too long, too complex, and too disconnected from the life of a peasant in a field. Imagine sitting through a full rehearsal of Wagner's *Siegfried* and walking out convinced that you had just witnessed the decadence of a dying civilization.

  Tolstoy did these things. He ranked his own great novels below his own simple moral fables. He rejected the Western Canon's greatest hits because he believed they did not infect; they only impressed. He was willing to burn down the museum of "Good Taste" if it meant saving the fire of human connection.

  So, what do we do with this? You are about to walk out of here into a world that will ask you for your portfolio, your demo reel, your CV. They will ask you about your technique. They will ask you about your brand.

  If you listen to Tolstoy, none of that matters.

  But I do not stand here to tell you that your training at Ashworth was wasted. Tolstoy does not say technique is evil. He says it is secondary. Technique is the vessel. Infection is the water. You can have the most exquisite crystal goblet in the world, but if it is empty, or if it is filled with poison, no one should drink from it.

  Your training here has given you the goblet. You know how to hold it. You know how to polish it so that it doesn't leak. But Tolstoy's challenge to you is this: Do not fall in love with the glass.

  There is a temptation, now that you are professionals, to make art that signals your professionalism. To make work that says, "Look how hard this was." To make work that is ironic, because irony is safe. Irony protects you from the risk of sincere infection. If you are ironic, and the audience doesn't feel anything, you can say, "You didn't get the joke." If you are sincere, and the audience doesn't feel anything, you have failed.

  Tolstoy demands that you risk the failure.

  To the parents here: You have paid for lessons, for materials, for tuition. You want to know if this was worth it. By the world's standards, worth is measured in grants, gallery representation, or tenure. By Tolstoy's standards, worth is measured only in whether your child can make a stranger in a different room feel less alone. That is a much harder metric to quantify. But it is the only one that lasts.

  To the faculty and critics in the audience: You know how punishing these criteria are. You know that "infection" is subjective. But Tolstoy forces us to ask: Are we rewarding work that binds people together, or work that flatters our private tastes? Are we cultivating a priesthood of experts, or a community of feelers?

  And to the graduates:

  You might be thinking, "Does this mean I have to make simple art? Does this mean I have to make moralizing fables? Does this mean complexity is forbidden?"

  No. Tolstoy is not asking for simplicity; he is asking for clarity. A feeling can be complex. Grief is complex. Ambivalence is complex. But if you transmit that complexity so that I feel the grief, or the ambivalence, with you, then you have succeeded. If you transmit it in a way that only another conservatory graduate can decode, you have not.

  The danger you face in the coming years is not that you will lose your skill. You will keep that. The danger is that you will become comfortable. You will make work that fits neatly into a gallery, or a concert hall, or a streaming algorithm. You will make work that is "good."

  Tolstoy invites you to stop trying to make "good" art, and start trying to make true art.

  This means you might have to abandon projects that look impressive on paper but feel dead in the studio. It means you might have to stop trying to impress the critics in the front row—including the ones here today—and start trying to reach the person in the back row who is tired, and worried, and needs to know that someone else understands what it feels like to be alive.

  It is a lonely path. Tolstoy died at a train station, estranged from his family, convinced he had failed his own God. He is not a model of happiness. But he is a model of integrity.

  So, here is my charge to you. Take your craft, which you have earned, and use it as a tool for transmission, not decoration. Do not use your skill to build a wall between you and the world. Use it to build a bridge.

  When you are in the studio, and you are unsure of a line, or a brushstroke, or a note, do not ask, "Is this beautiful?" Do not ask, "Is this clever?" Ask yourself: "If I send this out, will it infect? Will it bind?"

  If the answer is no, have the courage of Tolstoy. Put it down. Even if it is a masterpiece of technique. Even if it is your own *War and Peace*.

  Go out and make work that risks everything on the chance of connection. Go out and be dangerous to the status quo. Go out and infect us.

  Thank you.
