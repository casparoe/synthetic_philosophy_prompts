answer: |-
  Here is a toast drafted to be spoken aloud. It's timed for about 4 to 5 minutes at a moderate, sincere pace. I've focused on translating the philosophy into plain English so Grandma gets the heart of it, while the PhDs will recognize the specific logic underneath.

  **Tone Notes:**
  *   **Warm and slightly self-deprecating:** Acknowledge your nerves early to win the room.
  *   **The "Story" Section:** Slow down here. Treat it like a fable, not a lecture.
  *   **The Pivot:** This is where you look directly at the couple. This needs to be the most serious part of the speech.

  ***

  **The Toast**

  Good evening, everyone. For those who don't know me, I'm [Your Name], Maddie's sibling.

  I have to admit, when Maddie asked me to give this toast, I said yes immediately. Mostly out of fear. When your sister is finishing a PhD in Decision Theory, you learn pretty quickly that saying "no" to a logical argument has consequences. But also, I said yes because I love them both very much.

  Now, anyone who knows Maddie and Theo knows they met in a… let's call it a "nerdy" way. A reading group. And because of that, there's a running theme in their relationship that I've been thinking about a lot.

  There's this story—a thought experiment—that Theo explained to me over Thanksgiving. I'm going to tell it to you now, and I promise, no jargon.

  Imagine you are stranded in the desert. You are dying of thirst. A driver pulls up in a truck. He tells you he can drive you to town, but there's a catch. He has a special gift: he can tell, with perfect accuracy, whether you are the *kind of person* who will actually pay him once you get there.

  He won't drive you unless he's sure you'll pay.

  Here is the hard part: Once you are safely in town, with water in your belly and money in your pocket, there is no logical reason to pay him. The ride is already over. He can't hurt you. A purely calculating person would keep the money and walk away. But if you are that kind of person, the driver knows it in the desert. And he leaves you there.

  The only way to survive… is to genuinely be the kind of person who keeps a promise, even after it's no longer convenient to keep it. Even when you could get away with breaking it.

  I tell you this because I think this is the secret to what Maddie and Theo have built.

  On paper, Maddie studies logic. Theo works with data. It would be easy to assume their relationship is cold. Calculated. A transaction.

  But this story teaches the exact opposite.

  It teaches that the only way to win the game is to stop playing it. The only way to be loved, truly, is to be the kind of person who loves without checking the score.

  We all have desert moments in life. Times when we are tired, or scared, or when doing the right thing is hard. When it would be easier to walk away. Maddie and Theo have promised to be the driver for each other in those moments. Not because they have to. Not because they're keeping a tally. But because that is who they *are*.

  I know they have a joke where they call each other "The Driver." But watching them over the years, I've realized they are both. They are the ones who show up. They are the ones who pay the debt before it's even due, simply because they said they would.

  Maddie, you told me I only got one decision theory joke. So here it is: You two have proven that the most "rational" thing you can possibly do… is to be irrationally loyal to one another.

  To Maddie and Theo. May you always know, when you are thirsty, that the truck is coming. And may you always be the one driving.

  Cheers.
