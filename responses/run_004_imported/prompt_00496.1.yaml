      *   *Partitions:* Is their knowledge partitional? Humans suffer from logical omniscience failures. We don't know all the consequences of our beliefs.
      *   *The "Few Rounds" Claim:* GP shows convergence in finite steps *if* they exchange posteriors. But in reality, exchanging *posteriors* without the *evidence* behind them is often uninformative if priors differ.

  5.  **Formulate the Critique (The "Why the Advisor is Right" Section):**
