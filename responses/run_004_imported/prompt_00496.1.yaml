  3.  **Identify the Key Assumptions of Aumann's Theorem (and GP):**
      *   **Common Priors:** This is the big one. Agents must start with the same prior probability distribution over the state space.
      *   **Partitional Information Structures:** Agents' knowledge must be represented by partitions of the state space. (If I know $X$, I know that I know $X$, etc. - S5 modal logic).
      *   **Common Knowledge of Posteriors:** It's not enough to *tell* each other the number. It must be *common knowledge* that we both know the numbers, know that we know, etc.
      *   **Truthfulness/Rationality:** Agents must be honest Bayesians.
