      *   *Refining the "Basic Structure" point:* Rawls might argue that if the base rates are the result of injustice (over-policing), then *both* metrics are tainted. But given the choice *within* the system, he must choose the one that least violates the principles. Equalizing the burden of error (FPR) is closer to justice than equalizing the meaning of the score (Calibration) when the score leads to liberty deprivation.

