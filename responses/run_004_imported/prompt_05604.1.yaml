  Could you walk me through the actual chain of reasoning, step by step, that gets you from the incompleteness theorem to the conclusion that we survive death? And if the logic is really as airtight as it apparently was for Gödel himself, why isn't this proof a much bigger deal in philosophy of religion - like, why doesn't it just settle the debate?
