answer: |-
  Here is a draft for the eulogy. It is written to be spoken, with pauses and rhythms that allow the room to breathe. It addresses the truth without weaponizing it, acknowledges the hurt without reopening the wound, and focuses on the complexity of the man rather than the legend of the criminal.

  ***

  **Eulogy for [Uncle's Name]**

  Thank you all for being here.

  For those who don't know, I write novels for a living. People often assume that means I'm good with words, or that I know how to arrange a story so it makes sense. But standing here today, looking out at this room, I know that real life doesn't follow a plot. And the people we love are rarely just one thing.

  My uncle was a complex man. And if we are to honor him, we have to honor the whole of him, not just the parts that are easy to talk about.

  We all know what he did. For twenty years, he dedicated his life to the Old Masters. He studied their hands, their strokes, their mistakes, and their genius, with an intensity that few true artists ever muster. He knew the texture of paper from three centuries ago better than he knew the texture of his own life.

  He also spent time in prison for it.

  There is a story he loved to tell, about the Dutch forger Han van Meegeren. After the war, facing a collaboration charge, van Meegeren proved he had faked a Vermeer to save himself. He used to tell that story with a spark in his eye, not because he loved the deception, but because he loved the idea that a human hand could get close enough to greatness to fool the world. He saw it as a kind of intimacy with history.

  But we know that intimacy came at a cost.

  I know that for some in this room, he is a beloved uncle who told great stories and made us laugh. And I know that for others, the memory of him is complicated by betrayal. We cannot stand here and pretend that his art was authentic. We cannot pretend that trust wasn't broken, or that there weren't costs that can be counted in dollars and in faith. To say otherwise would be to lie to you now, which would be the last thing he would want, and the least of what you deserve.

  But I also know this: To forge a master, you cannot simply be a cynic. You have to love the original. You have to spend thousands of hours in quiet rooms, looking at beauty, trying to understand how it was made. You have to surrender your own ego to inhabit someone else's vision.

  In a strange way, my uncle spent his life paying tribute to genius that wasn't his. He was a man who knew he wasn't a Rembrandt, but who loved Rembrandt enough to try and become him, if only for the span of a drawing. There is a tragedy in that. But there is also a kind of devotion.

  I am not asking us to forgive the crime. I am asking us to remember the man.

  I remember the man who taught me how to hold a pencil. I remember the man who could look at a cloud and tell you exactly which pigment matched the shadow. I remember a man who was flawed, who stumbled, and who paid for it, but who never stopped believing that art was the most important thing in the world.

  We are here to say goodbye to him, not to his legacy, and not to his mistakes. Just to him.

  He spent his life trying to make the past look present. Now, he is part of the past himself. And what remains are not the drawings, or the headlines, or the prison records. What remains is the fact that we are all here. Divided by how we see him, perhaps, but united by the fact that we loved him.

  Rest now, Uncle [Name]. You don't have to draw anything anymore. You can just look.

  ***

  ### Notes on Delivery

  *   **The "Dana" Moment:** When you reach the paragraph beginning *"But we know that intimacy came at a cost..."*, do not look directly at Dana, but do not look away from her section of the row either. Acknowledge the air in the room. If you rush through this, it sounds guilty. If you slow down, it sounds respectful.
  *   **The Van Meegeren Story:** Deliver this slightly lighter, as it's a memory of his voice, but bring the tone back down immediately after.
  *   **The Ending:** The final line (*"You can just look"*) is the emotional anchor. It suggests he is finally free from the pressure of creation and deception. Take a long pause before stepping away from the podium.

  This approach validates Dana's anger (by acknowledging the financial/trust cost) without making her the antagonist, and it validates the "lovable rogue" side of the family without glorifying the crime. It positions him as a flawed devotee of art, which is the truthful middle ground you requested.
