prompt: |-
  So my uncle died last week and I've somehow ended up giving the eulogy this Saturday, which is awkward, because for almost twenty years his actual profession was forging Old Master drawings, good enough that a couple of auction houses fell for them, until one didn't and he did a bit of time for it. Half the family treats him like a lovable rogue, the other half can't, especially my cousin Dana, who'll be sitting in the second row and who spent real money on a 'newly discovered' drawing a few years back that turned out to be his and nobody else's. He use to love telling us about the Dutch forger who beat a Nazi collaboration charge after the war by proving in open court that the 'lost Vermeer' he'd sold was actually his own fake, like that settled something about art instead of just about his sentence. I write novels for a living so people assume I can just make this sound nice, but I don't want to smooth him into either a con man or a misunderstood genius, because neither is quite true and Dana would know it. Can you write the eulogy? It has to be something Dana can sit through without feeling insulted, it can't pretend his fakes were worth what the real things are worth, and it still needs to leave people with something true and warm about a man who spent his whole life getting other people's genius exactly right.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** A novelist (nephew/niece of the deceased).
      *   **Deceased:** Uncle who was an art forger (Old Master drawings) for 20 years. Went to prison briefly after getting caught.
      *   **Audience:** Mixed family. Half see him as a "lovable rogue," half (specifically cousin Dana) feel betrayed/angry because she bought one of his fakes.
      *   **Key Constraint 1:** Cannot smooth him into a "con man" (too harsh) or a "misunderstood genius" (too glorifying/false).
      *   **Key Constraint 2:** Must acknowledge the forgery without validating the fakes as equal to the originals.
      *   **Key Constraint 3:** Must be something Dana can sit through without feeling insulted (acknowledge her loss/betrayal implicitly or explicitly but gently).
      *   **Key Constraint 4:** Needs to find something "true and warm" about a man who spent his life replicating others' genius.
      *   **Key Detail:** Uncle loved telling the story of Han van Meegeren (the Dutch forger who beat a Nazi charge by proving he faked a Vermeer). This suggests the uncle saw himself as an artist in his own right, or at least valued the *skill* over the *deception*.
      *   **Tone:** Honest, nuanced, warm but grounded, literary (since the speaker is a novelist), but not showy.

  2.  **Determine the Core Theme:**
      *   The tension between *authenticity* and *skill*.
      *   The idea of *attention*. To forge a master, you have to look closer than anyone else. You have to understand the hand that made the original.
      *   The theme shouldn't be "he was a criminal" or "he was a secret artist." It should be "he loved art enough to live inside it, even if he lost his way."
      *   Addressing the elephant in the room: The forgery. It needs to be named, not whispered.
      *   Addressing Dana: Acknowledge that trust was broken, without making a public scene.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty of the task. Establish the relationship.
      *   **The Elephant (The Forgery):** Bring it up early but gently. Don't hide it. Frame it as part of his complexity.
      *   **The Skill/Passion:** Focus on *why* he did it. Not just money, but an obsession with the Old Masters. The Van Meegeren story is a good bridge here. It shows how he viewed his own work.
      *   **The Impact on Family (Dana):** This is the trickiest part. I need to acknowledge that his actions had costs. I can't say "it's okay that he scammed you." I need to say "we know there was harm, but we are here for the man."
      *   **The "True and Warm" Takeaway:** What is the positive legacy? It's the *attention*. He saw beauty and tried to inhabit it. Even if the signature wasn't his, the hours of devotion were real.
      *   **Closing:** A farewell that feels human, not heroic.

  4.  **Refining the Tone (Self-Correction during drafting):**
      *   *Initial thought:* Maybe make a joke about the forgery? *Correction:* No, Dana is there. Jokes might land as dismissive of her financial/emotional loss. Keep it serious but tender.
      *   *Initial thought:* Praise his drawing skill highly. *Correction:* Risky. Sounds like calling him a genius. Focus instead on his *study* of the skill.
      *   *Initial thought:* Apologize to Dana directly. *Correction:* Too confrontational for a eulogy. Better to acknowledge the "complicated legacy" and the "cost" generally, which she will understand refers to her specifically without putting her on the spot.
      *   *Voice:* Since the speaker is a novelist, the language can be slightly polished, but not flowery. It needs to sound spoken.

  5.  **Incorporating Specific Details:**
      *   The Van Meegeren story.
      *   The 20 years.
      *   The prison time (mention briefly).
      *   The division in the family (acknowledge the split).

  6.  **Drafting the Content (Mental or Scratchpad):**
      *   Start with "I write stories for a living, but this is hard."
      *   Talk about the drawings. "He didn't just copy; he listened."
      *   Talk about the lie. "We can't pretend it didn't happen."
      *   Talk about Dana/Family. "Trust is fragile."
      *   End with the memory of the man, not the criminal.

  7.  **Final Polish (Reviewing against constraints):**
      *   *Does it insult Dana?* No, it acknowledges the breach of trust.
      *   *Does it glorify the crime?* No, it calls it what it was (a deception), but focuses on the human behind it.
      *   *Is it warm?* Yes, focuses on his love for the art.
      *   *Is it honest?* Yes, admits he went to prison and hurt people.

  8.  **Finalizing the Text:** (This leads to the provided output in the main response window, ensuring the voice is consistent and the emotional beats land correctly.) *Self-correction: Make sure the Van Meegeren anecdote is used to illustrate his mindset, not to justify the crime.*

  9.  **Post-Draft Advice:** Add a note to the user about delivery, since this is a high-stakes emotional situation.

