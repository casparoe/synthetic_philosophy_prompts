      *   *The Body-Mind Connection:* Locke emphasizes a "sound mind in a sound body" (*mens sana in corpore sano*). He believes physical health impacts mental capacity. He is skeptical of coddling the body but also skeptical of unnecessary medicine.
      *   *Habituation:* Virtue is formed through practice and habit, not just rules. "The great principle and foundation of all virtue and worth is placed in this: that a man is able to deny himself his own desires, cross his own inclinations, and purely follow what reason directs as best."
      *   *Reasoning with Children:* He advocates treating children as rational creatures early on, but acknowledges their capacity is limited. However, the *goal* is always to cultivate internal reason, not external compliance.
      *   *Suspicion of "Physicking":* Locke was a physician himself but was notoriously skeptical of the medical practices of his time (purging, bleeding, heavy drugs). He preferred diet, exercise, fresh air, and hardening the body. He warned against parents rushing to give medicine for minor ailments, fearing it weakens the constitution.
      *   *Will and Inclination:* The central moral task is mastering the will. If a child acts out due to unchecked passion, that needs correction. If they act out due to physical incapacity, that's different.

