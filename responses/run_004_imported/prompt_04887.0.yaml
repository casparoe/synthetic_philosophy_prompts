answer: |-
  Here is a draft script of 10 interview questions designed to move past the textbook definition of quantifier variance and press your guest on the structural weaknesses of the view.

  I have structured these to flow logically: starting with intuition, moving through the technical objections (Bootstrapping, Sider, Concrete Cases), and ending with the meta-philosophical implications. The three required "hard" questions include the specific follow-ups you requested.

  ### **Part 1: Grounding the View**

  **1. The "Table" Intuition**
  "Let's start with the classic example your audience will have heard of: the table. A realist says, 'There is a table here.' A nihilist says, 'No, there are only atoms arranged tablewise.' You argue both can be right because their word 'there is' functions differently. For the layperson listening: is this just a fancy way of saying 'definitions matter,' or are you claiming something stronger about the structure of reality itself?"

  **2. The Cost of Deflation**
  "One reaction to your view is relief—philosophers can stop fighting. But another reaction is disappointment. If ontological disputes are largely verbal, it feels like we aren't discovering the world, we're just cataloging languages. Do you think accepting quantifier variance robs metaphysics of its sense of *discovery*?"

  ### **Part 2: The Structural Objections (The "Hard" Questions)**

  **3. The Bootstrapping Worry**
  "Here is a worry that keeps coming up in the literature. To say a dispute is 'merely verbal,' you need a neutral vantage point to compare the two languages and show they are equivalent. But if quantifier variance is true, there *is* no neutral vantage point—no 'God's eye' quantifier. So, isn't your claim that 'both sides are right' itself a substantive metaphysical claim made from inside *your* preferred quantifier meaning? How do you bootstrap yourself out of that circle without begging the question against the realist?"

  *   **Anticipated Dodge:** She may claim she isn't making an ontological claim, but a methodological one about "charitable interpretation."
  *   **Follow-up:** "If it's just a methodological rule to be charitable, why does that rule trump the realist's methodological rule to 'carve at the joints'? Isn't choosing charity over joint-carving itself a substantive philosophical stance?"

  **4. Sider and Reference Magnetism**
  "Ted Sider has a famous comeback to this. He argues that reference is constrained by 'naturalness'—that the world has objective joints, and our words magnetically stick to them. If ordinary speakers across centuries converge on stable usage for words like 'object' or 'table,' isn't that stability evidence that they are latching onto an objective natural kind, rather than just arbitrarily picking a quantifier meaning?"

  *   **Anticipated Dodge:** She may argue that 'naturalness' is itself relative to a conceptual scheme.
  *   **Follow-up:** "But physics seems to transcend schemes. If a physicist says 'energy is conserved,' that holds regardless of our conceptual scheme. Why does ontology get a pass from that kind of objective constraint while physics doesn't?"

  **5. The Concrete Case: Statue and Lump**
  "I want to cash this out on a specific puzzle. Take the statue and the lump of clay. They occupy the same space at the same time. The realist says they are distinct because they have different modal properties (the lump survives squashing, the statue doesn't). You say this is just quantifier variance. But if I smash the statue, the physical world changes in a specific way. Doesn't that physical difference force us to acknowledge a real ontological difference, regardless of how we define 'exists'?"

  *   **Anticipated Dodge:** She will likely say the difference is in the *concepts* or *sortals*, not the ontology.
  *   **Follow-up:** "But those concepts track real modal properties of the matter. If the modal properties are real features of the world, isn't the distinction between the statue and the lump real, even if the word 'object' is flexible?"

  ### **Part 3: Implications and Alternatives**

  **6. The Scientific Image**
  "I write about science, so I have to ask: how does this sit with scientific realism? If a particle physicist says 'quarks exist,' and a metaphysician says 'only simples exist,' are you saying the physicist is speaking a different 'ontological language' than the metaphysician? Or does physics get to dictate the true quantifier?"

  **7. The "Easy Ontology" Objection**
  "Amie Thomasson has pushed a view similar to yours, suggesting ontology is 'easy'—if the application conditions for a word are met, the thing exists. Critics say this makes existence too cheap. If we can't say 'no' to some existence claims, does the word 'exists' lose all its explanatory power?"

  **8. Why Are Realists Wrong?**
  "If your view is correct, the realist isn't just mistaken; they are confused about the nature of their own discourse. What is your error theory? Why do smart philosophers persistently feel like they are arguing about the *world* rather than their *words*? What creates that illusion?"

  **9. Normativity and Choice**
  "If multiple ontological languages are equally valid, are they all equally *good*? Is there any reason we should prefer a universalist language (where any two things compose a third) over a nihilist one? Or is choosing an ontology like choosing a favorite color?"

  ### **Part 4: The Closer**

  **10. The Substantive Dispute**
  "This is the question I care about most. If quantifier variance explains away the big debates—composition, persistence, material objects—I need to know what's left. By your own lights, describe a *genuinely substantive*, non-verbal metaphysical dispute. What would a debate look like that *couldn't* be dissolved by saying 'you two are just using different quantifiers'? I'm trying to figure out if 'it's merely verbal' is doing real philosophical work for you, or if it's just a move you play whenever a debate gets uncomfortable."
