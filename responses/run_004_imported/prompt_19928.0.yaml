answer: |-
  This is a classic seminar standoff, and honestly, both Leah and Marcus have put their fingers on genuine tensions in Augustine's text. *De Mendacio* is notoriously difficult because Augustine is trying to hold together a deontological absolute (never lie) with a pastoral recognition of human complexity (some lies seem worse than others).

  Here is a move-by-move breakdown of who has the better of the argument, followed by the crucial context both of them are missing.

  ### Move 1: The Definition of a Lie
  **Leah's Claim:** Augustine defines a lie as asserting what you believe to be false with the intent to deceive. Therefore, silence or misleading truths are not lies.
  **Marcus's Counter:** The core sin is the *intent to deceive*, so misleading truths should count as lies.

  **Verdict: Leah wins on textual accuracy.**
  Augustine is extremely precise in *De Mendacio* (specifically Chapters 3 and 12). He defines a lie (*mendacium*) as a "false signification with the will to deceive" (*falsa significatio cum voluntate fallendi*).
  *   For Augustine, there is a technical difference between **lying** and **deceiving**.
  *   You can deceive without lying (e.g., telling a truth you know will be misunderstood).
  *   You can lie without deceiving (e.g., telling a falsehood to someone who knows you're lying).
  *   The *sin of lying* is specifically tied to the **false utterance**.

  Marcus is arguing from a moral intuition (deception is the wrong part), but Augustine is arguing from an ontology of language. For Augustine, the act of speaking is God-given for the purpose of communicating thought. To speak against your own mind (saying X when you think Not-X) is a corruption of the faculty itself, regardless of whether the listener is actually deceived. Leah is right: by Augustine's strict definition, a true statement cannot be a lie.

  ### Move 2: The "Jocose Lie" Analogy
  **Marcus's Claim:** Augustine says jokes aren't lies because there's no intent to deceive. This proves intent is the real criterion. Therefore, if you *do* intend to deceive (with a true statement), it's sinful.
  **Leah's Counter:** If intent alone made it a lie, the "false assertion" clause in the definition would be unnecessary.

  **Verdict: Leah wins on logic; Marcus wins on moral spirit.**
  Marcus is correctly identifying that Augustine cares deeply about the *voluntas* (will). Augustine dismisses jocose lies because the speaker does not intend for the listener to believe the falsehood as reality.
  *   However, Leah is logically correct: If intent to deceive were sufficient for a "lie," Augustine wouldn't have needed to specify "false signification."
  *   Augustine's point about jokes is that they lack *both* conditions: there is no false signification (because it's understood as play) and no intent to deceive regarding reality.
  *   Marcus wants to collapse the distinction between "deceiving" and "lying." Augustine refuses to do this. He would agree with Marcus that deceiving someone with a true statement is *shady*, but he would insist it is not a *mendacium*.

  ### Move 3: The Eight Grades of Lies
  **Marcus's Claim:** Augustine ranks lies 1 through 8. Lying to save a life is #8 (least bad). This shows he isn't a pure absolutist and allows for an "escape valve."
  **Leah's Claim:** (Implied) The prohibition remains absolute regardless of the grade.

  **Verdict: Leah wins; Marcus misreads the hierarchy.**
  This is the most common student misreading of *De Mendacio*. In Chapter 17, Augustine lists the eight grades of lying, ranging from religious heresy (worst) to lying to save someone from bodily defilement (least worst).
  *   Marcus thinks the hierarchy implies **permissibility** (i.e., "Grade 8 is okay").
  *   Augustine means the hierarchy measures **guilt and punishment** (i.e., "Grade 8 is still a sin, but you won't burn as hot for it").

  Augustine explicitly states that even the eighth grade is a sin that requires repentance. He writes that while we might *understand* why someone lied to save a life, we cannot *teach* that it is lawful. So, Marcus is wrong to use the hierarchy to justify the "workaround" as permissible. Leah is closer to Augustine's hardline stance: the act remains prohibited, even if the guilt is minimized.

  ### Move 4: Silence and Misleading Truths
  **Leah's Claim:** Augustine allows silence or misleading truths (e.g., "I haven't seen him since morning").
  **Marcus's Claim:** This is a dodge that violates the spirit of the law.

  **Verdict: Split Decision.**
  *   **On Silence:** Leah is right. Augustine explicitly says that if you cannot tell the truth without betraying the innocent, you should remain silent (*tacere*), provided you can do so without inviting violence upon yourself. He does not believe we owe the murderer the truth.
  *   **On Misleading Truths:** This is murkier. Augustine is suspicious of "mental reservations." In *De Mendacio* (Ch. 10), he discusses whether one can say something true that leads to a false belief. He generally advises against it if the *intent* is purely to deceive. He warns that trying to find loopholes (saying something technically true but meant to mislead) often corrupts the heart even if it saves the tongue. Marcus is right to be suspicious here: Augustine would likely view a calculated misleading truth as a "lie of the heart" even if it isn't a "lie of the tongue."

  ---

  ### What Both of Them Are Missing

  If you want to steer the seminar discussion next week, here are the three big philosophical moves both students are overlooking.

  **1. The Teleology of Speech (The "God's Eye" View)**
  Both students are treating the argument as a conflict between **Rules** (Leah) and **Consequences/Intent** (Marcus). They are missing Augustine's **Metaphysics**.
  For Augustine, language is not just a tool for social coordination; it is a divine gift designed to mirror the relationship between the Word and God. To use speech to signify what is *not* in your mind is to violate the nature of reality itself. It's not just "breaking a rule"; it's an ontological disorder. This is why consequences (saving a life) cannot justify the lie. The damage is done to the *speaker's soul* and the *order of creation*, not just to the listener.

  **2. The Distinction Between *Mendacium* (Lie) and *Dolus* (Guile)**
  Augustine spends a lot of time distinguishing between the act of lying and the state of being deceitful.
  *   **Leah** focuses on avoiding *Mendacium*.
  *   **Marcus** focuses on avoiding *Dolus*.
  Augustine wants you to avoid both, but he treats them differently. You can avoid *Mendacium* by telling a misleading truth (Leah's win), but you might still incur the sin of *Dolus* if your will is bent toward deception (Marcus's win). Augustine's advice is usually: Keep your conscience clean. If you have to choose between betraying a friend and telling a lie, tell the truth and trust God to protect the friend. If you choose to deceive (even with truth) to control the outcome, you are lacking in faith.

  **3. The Development of His View (*De Mendacio* vs. *Contra Mendacium*)**
  It is worth noting that *De Mendacio* (395 AD) is an earlier, more exploratory text. Later, in *Contra Mendacium* (420 AD), written against the Priscillianists, Augustine's view hardens.
  *   In the later text, he is even more suspicious of "misleading truths." He argues that if you speak with the *intent* to create a false belief, you are lying in your heart, even if your words are true.
  *   If your seminar allows it, pointing out that Augustine himself tightened his own loopholes later in life would be a killer move. It suggests that "Leah's loophole" is something Augustine himself eventually became uncomfortable with.

  ### Summary for the Seminar
  *   **Leah** is the better textualist. Augustine technically permits silence and defines lying strictly around falsehood.
  *   **Marcus** is the better moral psychologist. He correctly identifies that Augustine thinks the *will to deceive* is dangerous, even if it doesn't meet the technical definition of a lie.
  *   **The Synthesis:** Augustine would tell Leah that while she hasn't technically *lied*, she might still be sinning through deceitfulness. He would tell Marcus that while the intent is sinful, it doesn't make the true statement a *lie*, and the hierarchy of lies doesn't make any of them permissible. The solution isn't a loophole; it's silence, or truth-telling accompanied by faith that God will handle the consequences.
