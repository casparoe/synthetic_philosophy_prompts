          *   *Marcus:* Intent to deceive is the core. Truth + intent to deceive should count as a lie (sinful).
          *   *Augustine's View:* In *De Mendacio*, Augustine defines a lie (*mendacium*) specifically as a false signification with the will to deceive (*falsa significatio cum voluntate fallendi*). He distinguishes between *lying* and *deceiving*. One can deceive without lying (e.g., saying something true that is believed false, or saying something true that leads to a false belief).
          *   *Verdict:* Leah is textually more accurate on the *definition*. Marcus is capturing the *moral intuition* but conflating deception with lying in Augustine's technical sense.

      *   **Point 2: Jocose Lies (Jokes).**
          *   *Marcus:* Augustine says jocose "lies" aren't real lies because there's no intent to deceive. This proves intent is the key. So if there *is* intent to deceive (even with truth), it's bad.
          *   *Leah:* If intent alone made it a lie, the "false assertion" part of the definition would be unnecessary.
          *   *Augustine's View:* Augustine explicitly says jocose statements are not lies *precisely* because no one is meant to believe them. They lack the *will to deceive* regarding reality. However, he also distinguishes between the *officium* (duty/lie of service) and *mendacium*.
          *   *Verdict:* Leah wins on the logic of the definition. Marcus is overextending the joke analogy. The joke isn't a lie because there's no intent to deceive. The murderer case *has* intent to deceive. But does intent + truth = lie? Augustine says no, it's deception, but not a lie. Is deception sinful? Usually, yes, but maybe less so?

