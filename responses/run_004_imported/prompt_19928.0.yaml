          *   *Leah:* (Implied) The hierarchy doesn't change the absolute prohibition.
          *   *Augustine's View:* Augustine *does* list 8 grades. The 8th grade is lying to protect someone from bodily defilement (or harm). He says it is the *least* sinful, but *still a sin*. He does not say it is permissible. He says it's the "bottom of the ladder," but you're still in the pit.
          *   *Verdict:* Marcus misinterprets the hierarchy. It's a hierarchy of *guilt*, not *permissibility*. All eight are sins. Leah is closer to the absolutist reading, but Marcus is right that Augustine acknowledges nuance in *gravity*, just not in *licitness*.

      *   **Point 5: What Both Are Missing.**
          *   *Ontology of the Sign:* Augustine's view is rooted in the nature of language as God-given. To use language against its purpose (to signify truth) is to sin against God, regardless of consequences.
          *   *The "Mental Lie":* Augustine worries about the internal state. Even if words are true, if the mind intends to create a false belief, is the *person* lying?
          *   *Development:* *De Mendacio* is early. *Contra Mendacium* is later. His views hardened.
          *   *The "Broad" vs. "Narrow" Lie:* Augustine distinguishes between *mendacium* (strict lie) and *dolus* (deceit/guile). Both are problematic, but *mendacium* is the specific target of the absolute ban.

