answer: |-
  This is a fantastic observation. You have put your finger on one of the most famous debates in aesthetics. It is entirely understandable why you expected them to agree: both Tolstoy and Collingwood revolted against the idea that art is about beauty, form, or mere imitation (mimesis). Both place **emotion** at the center of the definition of art.

  However, your intuition that they fundamentally disagree is correct. Collingwood explicitly critiques the "infection" theory (which he calls the "Arousal Theory") because he believes it confuses **Art** with **Craft**.

  Here is a precise comparison of the two theories, an explanation of Collingwood's objection, and a judgment on whether that objection holds water.

  ---

  ### 1. The Core Mechanism: Transmission vs. Exploration

  To understand the split, we have to look at when the emotion exists in relation to the artwork.

  **Tolstoy: Emotion as Cargo (Transmission)**
  For Tolstoy, the creative process looks like this:
  1.  The artist experiences a genuine feeling (e.g., pity for the poor).
  2.  The artist creates a work (a story, a painting) designed to embody that feeling.
  3.  The audience encounters the work and "catches" the feeling.

  For Tolstoy, the emotion exists **prior** to the work. The artwork is a vessel or a bridge. If the bridge holds and the feeling crosses over, it is art. If the artist is faking the feeling, or if the bridge is too obscure for the audience to cross, it is bad art or counterfeit art.

  **Collingwood: Emotion as Discovery (Expression)**
  For Collingwood, the creative process looks like this:
  1.  The artist feels a disturbance or agitation, but they **do not know what it is yet**. It is a vague unease or excitement.
  2.  The artist begins to work (painting, writing) not to transmit a known feeling, but to clarify the feeling *to themselves*.
  3.  Through the act of creating, the emotion becomes defined. The artwork is the record of that clarification.

  For Collingwood, the emotion does **not** fully exist prior to the work. The artwork is not a vessel; it is a laboratory. You don't express what you know; you come to know what you feel by expressing it.

  ### 2. Why Collingwood Rejects "Infection"

  You asked for precision on why Collingwood refuses to count "infecting" an audience as "expressing." For Collingwood, the distinction rests on **intent** and **control**.

  **A. Art vs. Craft**
  Collingwood divides human activity into *Art* and *Craft*.
  *   **Craft** involves a plan. You know the end result before you begin (e.g., a cobbler knows he is making a shoe; a doctor knows he is curing a fever).
  *   **Art** involves no such plan. You cannot plan to express an emotion you haven't yet identified.

  Collingwood argues that Tolstoy's theory turns the artist into a craftsman. If the artist says, "I want the audience to feel *this specific emotion*," they have a predetermined goal. They will then select techniques (colors, words, chords) calculated to produce that effect. To Collingwood, this is **psychological engineering**, not art. It is a technique used to manipulate the audience's nervous system.

  **B. Arousal vs. Expression**
  Collingwood categorizes Tolstoy's "infection" under the heading of **Arousal**.
  *   **Arousal:** The artist knows the feeling (e.g., patriotism, lust, religious awe) and uses the work to trigger that same feeling in the audience. Collingwood lumps this in with propaganda, advertising, and magic rituals. Even if the feeling is "good" (like Tolstoy's Christian brotherhood), the *mechanism* is manipulation.
  *   **Expression:** The artist explores the feeling honestly without worrying about whether the audience will catch it. The audience's job is not to be "infected" (passive), but to listen and reconstruct the artist's struggle for clarity (active).

  **C. The Problem of Sincerity**
  Tolstoy relies heavily on **sincerity**. He says if the artist fakes the feeling, the infection won't work. Collingwood points out a flaw here: You can be sincerely trying to manipulate people. A propagandist might truly believe in their cause and sincerely try to "infect" the crowd with patriotism. For Tolstoy, this might count as art (if it unites them). For Collingwood, it is definitely *not* art, because the emotion was predetermined and used as a tool for social cohesion rather than explored for truth.

  ### 3. Judgment: Does Collingwood Defeat Tolstoy?

  This is the critical question. Collingwood's objection is devastating to Tolstoy *if* we are defining art as a private, psychological process of creation. However, I believe Tolstoy has resources to answer it, because they are ultimately playing different games.

  **Where Collingwood Wins**
  Collingwood is superior at explaining the **experience of the artist**.
  Anyone who has created art knows that you often start with a vague hunch. If you sit down to write a poem saying, "I will now make the reader feel sad," you usually produce cliché sentimentality. If you sit down to figure out *why* you are sad, you might produce art. Collingwood captures the integrity of the creative act better. He protects art from becoming a tool for social engineering, which is a vital distinction in the 20th and 21st centuries.

  **Where Tolstoy Survives (and Thrives)**
  Tolstoy is not really writing a psychology of creation; he is writing an **ethics of communication**.
  Tolstoy would argue that Collingwood's definition is too solipsistic. If an artist "expresses" a feeling clearly to themselves but no one else understands it, Tolstoy would call that a failure of art. For Tolstoy, art is a moral activity that binds humanity together.

  Tolstoy could answer Collingwood like this:
  > "You say 'infection' is manipulation. But true infection is impossible without the honesty you demand. If I try to 'infect' you with a feeling I haven't fully explored myself, the audience will sense the falsehood, and the infection will fail. Therefore, my requirement for 'sincerity' forces the artist into your process of 'expression' anyway. The difference is that I care about the *result* (union between people), while you care only about the *process* (honesty to self)."

  **The Verdict**
  Collingwood does not defeat Tolstoy, but he does expose a danger in Tolstoy's view.
  *   **The Danger:** Tolstoy's view opens the door to propaganda. If the goal is "uniting people in a feeling," a dictator could fund art that "infects" people with love for the state. Tolstoy would say, "But is that feeling universal/religious?" But history shows that "universal" feelings can be manufactured.
  *   **The Synthesis:** The most robust theory of art likely needs both. We need Collingwood's **Expression** to ensure the work is honest and not merely manipulative craft. But we need Tolstoy's **Infection** to ensure the work communicates and matters to other human beings.

  **Conclusion**
  Collingwood is right that "infection" describes the *effect* of art, not its *essence*. If you aim only for the effect, you get propaganda. But Tolstoy is right that "expression" without the capacity to "infect" (communicate) is merely diary-keeping.

  Collingwood objects to Tolstoy because he fears art becoming a **means to an end** (social unity). Tolstoy would reply that art *must* be a means to an end (human love), or it is merely a toy. Your reading has led you to a tension that remains unresolved in aesthetics to this day: **Is art a way of knowing truth (Collingwood), or a way of loving neighbors (Tolstoy)?** Both are compelling, and neither fully cancels the other out.
