answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I work in IT support, which means my entire career is built on a simple premise: things break, and it's my job to figure out why, and then fix them.

  I've known [Groom] for [Number] years. And if there is one thing I have learned about him, it is that he is an optimist about his own future behavior that borders on the heroic.

  We all know the legends. The eleven gym memberships. The novel that has been "two weeks from finished" since the Obama administration. The running joke among us that [Groom] has a very specific relationship with time. He trusts "Future [Groom]" implicitly. The problem is, "Present [Groom]" keeps letting him down.

  A few years ago, I fell down a rabbit hole reading about this. There's a Greek term for it: *akrasia*. It means acting against your better judgment. Knowing you should go to the gym, and ordering pizza instead. Then there's a concept from behavioral economics called *hyperbolic discounting*. It's a fancy way of saying that humans are wired to value a small reward right now much more than a big reward later. To "Present [Groom]," a donut is real. A healthy heart is a theoretical concept that belongs to a stranger named "Future [Groom]."

  So, when [Groom] asked me to be Best Man, I looked at this wedding through that lens. I saw it as his first successful Ulysses Pact. You know the myth: Ulysses knew he wouldn't have the willpower to resist the Sirens later, so he tied himself to the mast *now*, while he was still thinking clearly.

  And I'll admit, I worried. Because if this is just another Ulysses Pact, just another commitment device, then the math says it should fail. A gym membership is a promise you make to yourself. A novel is a promise you make to yourself. And if "Present [Groom]" has a history of betraying "Future [Groom]," why should we trust that this vow is any different? Why won't the discount curve kick in six months from now, when the novelty fades and the cost of effort goes up?

  If I frame this as a battle of willpower, I'm insulting him. I'm saying he's weak. But if I frame it as just math, I'm insulting the vow. I'm saying it's just a calculation that could tip the other way.

  But watching them together, I realized I was looking at the equation wrong.

  The gym memberships failed because they were solitary. The burden was on one person, and the reward was distant. But marriage isn't a solitary constraint. It isn't [Groom] tying himself to a mast alone in the dark. It's [Groom] and [Bride] building a ship together.

  When you love someone, the reward isn't in the future. It isn't a hypothetical "better health" or a "finished manuscript." The reward is *her*. It's immediate. It's in the room. It's in the way she looks at him when he tells a bad joke, and the way he looks at her when he thinks no one is watching.

  Hyperbolic discounting relies on the value of the reward decaying over time. But love doesn't decay; it compounds.

  **The philosophers say akrasia is a conflict within a single self over time. But marriage is the moment you realize you aren't a single self anymore.**

  He isn't keeping this promise by gritting his teeth and forcing "Future [Groom]" to show up. He's keeping it because "Future [Groom]" is going to be too busy being happy to want to leave. He's not binding his will; he's aligning his desire.

  [Groom], you've spent a lifetime making promises to yourself that you couldn't keep. But today, you're making a promise to someone else. And that changes everything. Because you can let yourself down. But I know you, and I know you will never let her down.

  [Bride], thank you for flattening his discount curve. Thank you for making the "now" worth more than the "later."

  So, if everyone could please raise a glass.

  To [Groom] and [Bride]. May your rewards be immediate, may your burdens be shared, and may you never have to rely on willpower when you have each other.

  To the happy couple.
