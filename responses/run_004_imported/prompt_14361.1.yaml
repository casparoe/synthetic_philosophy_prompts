          *   In epistemic akrasia, there's a debate. Sometimes it *might* be rational to be akratic? (e.g., The "Unconfident Expert"). If I know I'm tired, but I also know I'm usually right, do I trust my current judgment or my assessment of my tiredness? This is the HOE knot.

