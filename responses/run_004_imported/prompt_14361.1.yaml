          *   Practical: You can eat the donut every day. It's a stable (if unhealthy) habit.
          *   Epistemic: Holding $P$ and "My evidence doesn't support $P$" is psychologically unstable. It tends to collapse. If you really believe your evidence is bad, the belief in $P$ usually evaporates.
      *   *Disanalogy 3: The Role of Desire.*
          *   Practical: Driven by conflicting motivations (health vs. taste).
          *   Epistemic: Driven by conflicting truth-aims. There is no "taste" equivalent. You just want truth. So why the conflict? Usually because of self-distrust.
      *   *Disanalogy 4: The "Rational Bind" (User's specific interest).*
