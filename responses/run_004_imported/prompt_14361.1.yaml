          *   Structure: I believe Action A is best. I do Action B.
          *   Classic Example: Eating the donut knowing it's unhealthy.
          *   Mechanism: Passion, impulse, desire overrides reason.
      *   **Epistemic Akrasia:** Believing a proposition while believing one's evidence doesn't support it (or supports the opposite).
          *   Structure: I believe P. I believe my evidence supports not-P (or is insufficient for P).
          *   Example: "I believe the meeting is at 3 PM, but I admit my calendar is unreliable and I have no other source."
          *   Mechanism: Cognitive dissonance, trust issues in one's own faculties.

  3.  **Address the User's Hunch (Higher-Order Evidence):**
      *   The user suspects higher-order evidence (HOE) is key. They are right.
      *   In practical akrasia, the conflict is between *judgment* (reason) and *desire* (appetite).
      *   In epistemic akrasia, the conflict is often between *first-order evidence* (what the world looks like) and *higher-order evidence* (what my brain's processing of the world looks like).
      *   *Key Disanalogy:* In practical cases, you can acknowledge the better judgment and still act (the will is weak). In epistemic cases, acknowledging the evidence is insufficient arguably *undermines* the belief itself. It feels more paradoxical.

  4.  **Brainstorming Disanalogies (The "Dig Deeper" part):**

      *   *Disanalogy 1: The Normative Force.*
