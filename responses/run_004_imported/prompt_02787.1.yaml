      *   *Function of Law:* Law/Might is a necessary restraint on sin, even if it isn't "True Justice." It prevents total chaos.
      *   *The "Double Truth":* There is the order of Grace (Justice) and the order of Nature/Power (Might). They are distinct but entangled in society.

