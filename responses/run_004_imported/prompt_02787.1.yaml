      *   *Claim A (Objective Justice exists):* Pascal believes in Divine Justice/True Justice. It exists in God, but not in human society.
      *   *Claim B (Social Justice = Might):* In the *saeculum* (earthly realm), what we *call* justice is just codified power.
      *   *Resolution:* Pascal is distinguishing between *True Justice* (metaphysical/Divine) and *Civil Justice* (political/social). He is saying Civil Justice is a sham propped up by Might, *because* we lost access to True Justice.

  4.  **Connect to Pascal's Theology (The Fall/Corrupted Nature):**
