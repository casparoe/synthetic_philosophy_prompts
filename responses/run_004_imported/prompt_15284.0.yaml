answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name]. And for those of you who *do* know me, yes, I promise to keep the jargon to a minimum.

  I know about half of this room is family, and the other half is here because they once co-authored a paper with the couple. So, I need to walk a fine line. But honestly, there is no better way to describe [Bride] and [Groom] than to talk about how they met: a reading group working through MIRI's material on embedded agency.

  Now, for the family: don't zone out. This is actually the romantic part.

  In standard decision theory, an ideal agent is like a god. It stands outside the world, looks down at a perfect map, and calculates the perfect move. It has a clear boundary between itself and the environment. It knows exactly what it's going to do.

  But [Bride] and [Groom] met studying *embedded* agency. Which is the study of what happens when the agent is *inside* the environment it's trying to model. When you are part of the world you're trying to understand. When the map has to fit inside the territory, which means the map can never be complete.

  They turned this into a running joke early on. I remember [Groom] telling me, "We can't model our relationship from the outside. We're too embedded in it."

  And he's right. And that is why they are going to be so good at this.

  Because if you try to approach a marriage like an idealized agent, you're going to fail. You'll try to calculate the perfect outcome. You'll try to predict every argument, budget every emotion, and simulate every Tuesday night dinner for the next forty years. You'll look for a Cartesian boundary where there isn't one.

  But embedded agents know better. They know that you cannot have a complete self-model. You cannot fully know your future self, and you certainly cannot fully model your partner. There is always logical uncertainty. There is always noise in the signal.

  So, what do you do when you can't compute the perfect solution? When you can't verify in advance that the trust is warranted?

  You trust anyway.

  That is the leap. In technical terms, it's acting under logical uncertainty without a provable guarantee. In human terms, it's looking at someone and saying, "I cannot see the whole map. I don't know who we will be in ten years. I am too small to contain the totality of this life we are building."

  "I am embedded in you, and you are embedded in me. And I am choosing to optimize for your happiness, even when I can't predict the outcome."

  That is the only algorithm that works.

  [Bride] and [Groom], you two understand that you will never have a view from nowhere. You will only ever have a view from inside the mess, inside the love, inside the environment you are building together. You know that you can't verify the future. You just have to commit to it.

  So, if everyone could please raise a glass.

  To the couple: May you never try to stand outside your marriage to analyze it. May you stay embedded. May you accept the uncertainty. And may you always trust the agent on the other side of the table, even when the model is incomplete.

  To [Bride] and [Groom]!
