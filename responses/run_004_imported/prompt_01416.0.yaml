answer: |-
  This is a compelling challenge because it targets the weakest link in the causal-historical theory of reference: the jump from *particulars* to *universals* (or kinds). Given your background in model verification, you are well-positioned to appreciate the structural disanalogy. In model checking, a state is a specific valuation of variables; a "property" (like `AG safe`) is a set of states satisfying a condition. Kripke's move with proper names treats them like rigid pointers to specific states (individuals). His move with natural kinds treats them like rigid pointers to *sets of states defined by a hidden variable* (microstructure).

  The argument below contends that this second move is unmotivated because the "hidden variable" (essence) is not discovered but *stipulated* by our taxonomic interests, and history (specifically the case of jade) shows these stipulations can fracture.

  ### 1. The Disanalogy: Individuation vs. Classification

  The core of Kripke's argument in *Naming and Necessity* relies on a symmetry between proper names and natural-kind terms.
  *   **Proper Names:** "Aristotle" rigidly designates a specific individual. We fix the reference ostensively or via description, but the name tracks *that man* across possible worlds, regardless of his properties (he might not have taught Alexander).
  *   **Natural Kinds:** "Water" rigidly designates a specific substance. We fix the reference via superficial properties (clear, liquid, thirst-quenching), but the term tracks *that stuff* across possible worlds, regardless of superficial changes (ice, steam), provided the underlying constitution remains.

  **The Objection:** The mechanism of "tracking" works for individuals in a way it cannot for kinds.

  For an individual, transworld identity is often grounded in **origin** or **spatiotemporal continuity**. Even if you reject haecceity, there is a primitive intuition that *this* particular entity is distinct from *that* one. The causal chain of a name preserves this particularity.

  For a kind, transworld identity is grounded in **similarity**. To say "This is water" in another world is to say "This belongs to the same *kind* as the water in the actual world." But "sameness of kind" is not a primitive relation in the world; it is a relation imposed by a taxonomy.

  When we fix the reference of "water," we point to a sample and say, roughly, "the kind to which this belongs." But which kind?
  1.  The kind of clear, drinkable liquids?
  2.  The kind of H₂O aggregates?
  3.  The kind of substances that fill the lakes in this region?

  Kripke assumes the scientific essence (H₂O) *retroactively* fixes the reference. He argues that once we discover water is H₂O, we realize we were *always* talking about H₂O. The counter-argument is that the discovery of H₂O is a **theoretical identification**, not a reference-fixing event. If the theory changes, the reference does not remain rigid; rather, the term was ambiguous all along.

  ### 2. The Jade Counterexample

  The history of jade is the empirical wedge that breaks the symmetry between names and kinds.

  For centuries, "jade" referred to a specific type of tough, green stone used for tools and ornaments. It was treated as a natural kind. Speakers fixed the reference ostensively: "Jade is *that* kind of stone."

  Mineralogy later discovered that "jade" refers to two distinct minerals with different chemical compositions and crystal structures:
  *   **Jadeite:** A pyroxene (NaAlSi₂O₆).
  *   **Nephrite:** An amphibole (Ca₂(Mg,Fe)₅Si₈O₂₂(OH)₂).

  They are chemically unrelated. They look similar due to convergent evolution in geological formation (interlocking fibrous crystals), not shared essence.

  **The Kripkean Dilemma:**
  If natural-kind terms rigidly designate based on microstructural essence (as "Water = H₂O" suggests), what does "jade" designate?
  1.  **Error Theory:** "Jade" refers to nothing. There is no single natural kind. (This seems too harsh; jade exists, we just use the word successfully).
  2.  **Ambiguity:** "Jade" is two homophonous names, one for jadeite, one for nephrite. (This contradicts the linguistic intuition that speakers meant one thing).
  3.  **Disjunctive Kind:** "Jade" designates the disjunctive kind *Jadeite ∨ Nephrite*.

  **The Implication:**
  If option (3) is correct, then the essence of jade is **not microstructural**. It is macroscopic/functional (toughness, polishability, greenness). The microstructure is merely a contingent realization of that functional kind.

  If option (1) or (2) is correct, then statements like "Jade is a silicate" are not necessary truths discovered a posteriori; they are either false or contingent generalizations that happened to hold for the samples we initially picked out.

  **Applying to Water:**
  The jade case demonstrates that **ostensive reference fixing does not guarantee a unique microstructural essence.** When we pointed to "water," we might have been pointing to a functional kind (the "watery role") that *happens* to be filled by H₂O in the actual world, just as the "jade role" is filled by two distinct minerals.

  Kripke assumes that because H₂O explains the properties of water, H₂O *is* the essence. But jade shows that distinct essences can explain the same macro-properties. Therefore, the move from "H₂O explains water's properties" to "Water is necessarily H₂O" is an inference to the best explanation, not a modal truth. It is a contingent fact that the "watery role" is uniquely filled by H₂O in our world. In a world where XYZ also fills that role (and is chemically distinct), a Kripkean must say "That isn't water." A critic says, "That is exactly what water *is*—whatever fills the role."

  ### 3. Engaging the Best Kripkean Replies

  A sophisticated Kripkean (or Putnamian) has replies. Let's test them against the jade objection.

  **Reply A: The "Same Liquid" Relation is Internal**
  Kripke might argue that "water" indexically designates "the substance that bears the *same-liquid* relation to this sample." The *same-liquid* relation is objectively determined by physics, not human taxonomy. If jadeite and nephrite are chemically distinct, they don't bear the *same-liquid* relation. Therefore, "jade" was a mistake, a non-natural kind term. "Water," however, *is* a unified natural kind.

  *   **Rebuttal:** This begs the question. It assumes that for every successful folk term, there *must* be a unified microstructural essence waiting to be found. Jade proves there isn't. Why are we so confident water isn't like jade? Perhaps "water" is a macroscopic cluster concept that *allows* for isotopic variation or even different polymeric structures of hydrogen and oxygen that behave identically. By insisting on rigid microstructural designation, Kripke privileges current chemistry over future physics. If physics discovers that H₂O and XYZ are two states of a deeper unified field, "Water is H₂O" becomes contingent. The rigidity is purchased by ignoring the possibility of kind-fracture.

  **Reply B: The Causal Chain Filters for Essence**
  The causal-historical chain transmits reference not by description, but by causal contact with the essence. When we say "water," the chain goes back to interactions with H₂O molecules, not "watery stuff."

  *   **Rebuttal:** In the jade case, the causal chain went back to interactions with *both* jadeite and nephrite. Speakers touched both, carved both, traded both. The causal chain did not filter for pyroxene over amphibole. It filtered for "tough green stone." If the causal chain for water included interactions with XYZ (on Twin Earth) before we knew the difference, the chain is contaminated. If the chain only includes H₂O, that's only because we *defined* the chain by the essence we later discovered. This is circular. We cannot use the discovery of the essence to validate that the causal chain was tracking that essence all along, because jade shows causal chains track macro-properties.

  **Reply C: Idealization and Scientific Kind Terms**
  Kripke might concede that "jade" is a messy folk term but insist that "water" in the context of *Naming and Necessity* is being treated as a *scientific* kind term. We are refining the language.

  *   **Rebuttal:** This surrenders the philosophical punch. The claim "Water is necessarily H₂O" is supposed to explain how we talk about the world, not how chemists talk in a lab. If "water" as used by ordinary speakers is not rigid (because they would accept XYZ as water if it behaved like water), then the necessity claim applies only to a stipulative technical term, not the concept we actually hold. The philosophical interest lies in the folk concept, and the folk concept is vulnerable to the jade problem.

  ### 4. Impact on Confidence: From Metaphysical to Nomological

  If this argument holds, what happens to the confidence with which we assert "Water is necessarily H₂O"?

  **1. Demotion from Metaphysical to Nomological Necessity**
  We must downgrade the modal status. "Water is H₂O" is not true in all possible worlds. It is true in all worlds *where the laws of nature and taxonomic boundaries remain fixed as they are currently understood.* It is **nomologically necessary**, not metaphysically necessary.
  In verification terms: It is an invariant of the current system model, not a property of the state space itself. If we refactor the model (change our theory of kinds), the invariant breaks.

  **2. Reference is Theory-Laden**
  We cannot separate the reference of a natural kind term from the theory used to identify it. In model checking, you cannot verify a property `P` without defining the state space `S`. Kripke tries to say the name fixes `S` independently of `P`. The jade argument shows `S` (the extension of the kind) is dependent on `P` (the properties/essence we theorize).
  Therefore, "Water is H₂O" is a **theoretical identity**, akin to "Heat is mean molecular kinetic energy." It is a robust scientific claim, but claiming it is *necessary* obscures the fact that it relies on the contingent success of our current taxonomy in carving nature at its joints.

  **3. The "Open Texture" of Kinds**
  We must accept that natural kind terms have an "open texture." Just as "jade" fractured, "water" could fracture. Perhaps we find a substance that is H₂O but behaves nothing like water (e.g., under extreme pressure), or a substance that is not H₂O but behaves exactly like water.
  If we treat "water" as rigidly H₂O, we must say the latter isn't water. But this conflicts with the functional role the term plays in our lives (drinking, washing, raining). The confidence that "Water is H₂O" is necessary relies on prioritizing the *chemical* context over the *functional* context without justification.

  ### Conclusion

  The extension of rigid designation from proper names to natural kinds fails because it conflates **identity** (a logical relation between particulars) with **similarity** (a graded relation between classes).

  Proper names track individuals via causal history that preserves *numerical identity*. Natural kind terms track samples via causal history that preserves *qualitative similarity*. But qualitative similarity is interest-relative and theory-dependent. The case of jade proves that a term can successfully refer and function in a language while failing to pick out a unique microstructural essence.

  Consequently, claims like "Water is necessarily H₂O" should be asserted with significantly less metaphysical confidence. They are not discoveries of modal logic revealed by science; they are **stipulations of scientific taxonomy**. We are effectively deciding to let "water" mean "H₂O" rather than "the watery stuff." That is a useful decision for chemistry, but it is not a metaphysical necessity discoverable a posteriori. It is a choice to privilege microstructure over macro-function, a choice that the history of "jade" warns us is fallible.

  In your terms: Kripke treats natural kind terms as rigid labels for specific sets of states in the Kripke structure of reality. The jade argument shows that the labeling function is not fixed by the initial state (ostension) but depends on the transition relations (scientific theory) which are subject to revision. Therefore, the label is not rigid; the model is.
