prompt: |-
  I spent close to forty years doing atmospheric and paleoclimate research (a lot of it ice cores, if that means anything to you), and it's only since retiring a few years back that I've had time to actually read philosophy properly instead of just skimming the odd essay on a plane. Given my background I gravitated first toward the literature on climate justice, which is how I ended up down a rabbit hole on bargaining theory -- there was always this background hum during my working years about "equitable burden-sharing" in emissions targets, and I finally wanted to understand the formal machinery that's supposedly behind that kind of talk. A friend from my old research group lent me a battered copy of David Gauthier's *Morals by Agreement*, and that's the book that got me properly hooked.

  Here's where I've gotten to. I already knew a bit about the Nash bargaining solution -- maximise the product of each party's utility gain over the disagreement point, and it satisfies this "independence of irrelevant alternatives" property -- but I only just discovered that Kalai and Smorodinsky proposed a rival solution back in the 70s that drops IIA and replaces it with a "monotonicity" axiom instead. I think I've got the geometric picture: draw a line from the disagreement point to the "ideal point" (the point representing each party's best conceivable outcome), and take wherever that line crosses the Pareto frontier. What I don't have a feel for at all is the philosophical upshot, i.e. why you'd pick one axiom over the other. Could you compare the two solutions for me, and then tell me, in your own judgement, which of the two axioms -- IIA or monotonicity -- makes for the better normative principle of what counts as a *fair* bargain? Gauthier seems to build something very like Kalai-Smorodinsky into his contractarian picture (he calls it "minimax relative concession", if I'm remembering the term right), so apparently its not just an obscure technical curiosity, but maybe I'm overreading the connection. Is there some standard verdict on this among philosophers who work on bargaining and distributive justice, or does it genuinely just come down to which test cases strike you as most compelling?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
