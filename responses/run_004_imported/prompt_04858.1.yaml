          *   **Monotonicity (KS):** Focus on *opportunity* and *claims*. If my ceiling rises, my floor should too. Normative value: Sensitivity to potential. Problem: Can be sensitive to irrelevant changes in the *ideal* point if not careful (though KS handles this).
      *   *Normative Judgment:* This is the tricky part. I need to offer a reasoned opinion, not just hedge.
          *   Argument for KSBS/Monotonicity in *Justice*: Justice is often about claims and potentials. If a developing nation's capacity to emit (ideal point) grows, a fair solution shouldn't ignore that.
          *   Argument for NBS/IIA in *Stability*: Contracts need to be robust.
          *   *My Take:* For *climate justice* specifically, Monotonicity is superior. It captures the dynamic nature of capacity and responsibility better than the static IIA.
      *   *Gauthier Check:* Confirm "minimax relative concession." Yes, it equalizes the ratio of (Ideal - Actual) / (Ideal - Disagreement). This is effectively the KSBS logic.
      *   *Philosophical Landscape:* Mention that there isn't a "standard verdict." It's a live debate. Mention Amartya Sen or others who critique Nash on informational grounds.
