      *   **Specific Constraint 1:** Must be distinct from "birth-rank reasoning" (i.e., not the standard Doomsday Argument).
      *   **Specific Constraint 2:** Must illustrate a conflict between the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA).
