prompt: |-
  So I'm taking a phil of bio seminar rn and we just covered the units of selection debate, and I think I've got the big picture: Dawkins basically proved group selection is bunk with the selfish gene idea, since altruism only evolves when its good for a gene's own copies (kin selection etc), not because its good for the group or species. What I don't get is why my professor keeps treating 'multilevel selection theory' like a legit ongoing research program instead of just a holdout position - if the gene's eye view settled this back in the 70s, isn't multilevel/group selection just people refusing to accept math that's already been worked out?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** Philosophy of Biology seminar.
      *   **Topic:** Units of Selection Debate (Gene vs. Group/Multilevel).
      *   **User's Understanding:** Dawkins' *Selfish Gene* settled the debate in the 70s. Group selection is "bunk." Altruism is explained by kin selection/inclusive fitness.
      *   **User's Confusion:** Why does the professor treat Multilevel Selection (MLS) theory as a legitimate, ongoing research program? Isn't it just denial of established math?
