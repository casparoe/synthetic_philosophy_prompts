prompt: |-
  So I'm ABD in political theory and I've been going down a rabbit hole for my quals list on democratic legitimacy that I can't shake. It's this thing called "the boundary problem" -- I guess Whelan is usually credited with naming it back in the early 80s, the basic idea being that democratic procedures can't tell you who should be included in the demos that runs the procedure in the first place, because settling that question would itself require a vote, and you need to already know who's eligible to vote in order to hold that vote. Circular all the way down. Since then theres this whole literature trying to patch it -- Goodin's "all affected interests" piece, which he sort of admits blows up into near-global enfranchisement once you start counting possible/indirect effects; the "all subjected to coercion" alternative that Abizadeh runs with in his border-coercion stuff, where he ends up arguing the demos is in principle unbounded and states don't have a unilateral right to just draw their own boundaries; Nasström's paper arguing both of those secretly smuggle in the very "people" they're supposed to be justifying; and then Miller pushing back with a more nationality/community based account of who counts as a legitimate member. My advisor keeps saying none of this is just an academic exercise, and honestly this week I finally believe her.

  Here's why: my family has had a little place on a lake up north since my grandfather's time, and it's "seasonal" -- we're there maybe four months a year and can't vote at town meeting because you have to be a domiciled year-round resident to be on the checklist. There's a huge fight going on right now because seasonal owners are something like 60% of the tax base, and a warrant article just passed (that we had zero vote on) capping short-term rentals in a way that's gonna hammer property values for exactly the people who can't vote on it but also can't hold office or run for select board. A few of the old-timers are furious that "summer people" even want a say, other year-rounders think it's obviously unfair given how much tax revenue comes from us, and somebody's now floating a compromise of a nonvoting advisory seat. Got pretty heated at the last two meetings apparently, my uncle said someone nearly came to blows over it.

  Anyway -- rather than ask you to referee the local politics of it (which I don't think you can do responsibly without knowing a lot more than I could tell you), what I'd love is for you to lay out the most important implications of the boundary-problem literature for thinking through a case like this. Like, if I bring the Whelan/Goodin/Abizadeh/Nasström/Miller debate to bear on "should seasonal, non-domiciled property owners get a vote (or some kind of vote) at town meeting," what actually falls out of it? Where does the case fit cleanly onto the existing principles (affected-interests vs. subjection-to-coercion vs. ascriptive/national membership) and where does it kind of break them, e.g. because seasonal owners are neither transient outsiders nor full insiders in the way most of the literature's stock examples (immigrants, future generations, foreigners affected by war) seem to assume? I keep going back and forth on whether this whole literature was ever really built for "partial membership" cases like this one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User Status:** ABD (All But Dissertation) in Political Theory. This means they are highly knowledgeable, familiar with the jargon, capable of nuanced argumentation, and looking for theoretical depth rather than basic explanations. They are likely stressed about quals/dissertation but intellectually engaged.
      *   **Topic:** The Boundary Problem in democratic theory (Whelan, Goodin, Abizadeh, Nasström, Miller).
      *   **Real-World Application:** A local town meeting dispute regarding seasonal property owners (non-domiciled) vs. year-round residents. Seasonal owners pay significant taxes (60% of base) but can't vote on issues affecting their property values (short-term rental caps).
      *   **Goal:** The user wants to know how the theoretical literature applies to this specific "partial membership" case. They want to see where the theories fit cleanly and where they break down. They explicitly *don't* want me to referee the local politics, but rather to use the theory to illuminate the implications.
      *   **Tone:** Academic, collegial, sophisticated, empathetic to the "rabbit hole" feeling.

  2.  **Deconstruct the Theoretical Landscape (Mental Sandbox):**
      *   *Whelan:* The problem is logically prior. Democracy presupposes the demos. No procedural solution.
      *   *Goodin (All Affected Interests):* Very expansive. If your property value is affected, you should have a say. Implication: Seasonal owners *should* vote. Problem: Over-inclusion (who isn't affected?).
      *   *Abizadeh (All Subjected to Coercion):* Focuses on border control and coercion. If the law binds you/coerces you, you need a say. Implication: Property laws bind owners, so they should have a say. Problem: Is property ownership "subjection" in the same way as citizenship/residency?
      *   *Nasström:* Critique of the above. "All affected" and "all subjected" presuppose a sovereign authority to determine the scope of affect/coercion. It's circular.
      *   *Miller (National/Community Membership):* Focuses on shared identity, reciprocity, and ongoing cooperation. Implication: Seasonal owners are *not* members. They don't share the daily life/risk. Year-rounders are the demos.
      *   *The "Partial Membership" Gap:* Most theory deals with *exclusion* (immigrants, foreigners) or *inclusion* (citizens). This case is about *functional stakeholding* without *social membership*.

  3.  **Map Theory to the Case (The "Lake Town" Scenario):**
      *   *Goodin:* Strongest argument for the seasonal owners. Their financial interests are directly affected.
      *   *Abizadeh:* Strong argument too. The town is coercing their property rights. But does coercion apply to non-residents? Yes, property law is coercive.
      *   *Miller:* Strongest argument for the year-rounders. Democracy requires a "common life." Seasonal owners leave when things get hard (winter). They don't share the fate of the schools/roads in the same way.
      *   *Whelan/Nasström:* The meta-problem. Who decides the voting rules? The year-rounders. So the seasonal owners are stuck. The "advisory seat" is a classic technocratic patch that admits the legitimacy deficit without solving it.

  4.  **Identify the Tensions/Breaking Points:**
      *   *Temporality:* Theory usually assumes static membership. This is cyclical/seasonal.
      *   *Stake vs. Membership:* Property stake vs. Civic membership. Liberalism often separates these (no property requirements), but localism often conflates them.
      *   *Exit Options:* Seasonal owners can sell and leave easier than year-rounders. Does this diminish their claim?
      *   *Taxation without Representation:* The classic liberal rallying cry. Goodin/Abizadeh support this. Miller says taxation isn't enough for *democratic* membership, just a transaction.

  5.  **Drafting the Response (Iterative Process):**
      *   *Opening:* Acknowledge the ABD status and the "theory meets reality" moment. Validate the advisor's point.
      *   *Section 1: The Whelan/Nasström Meta-Constraint.* Start here because it frames the impossibility. The town meeting *itself* is the circular proof. The year-rounders define the boundary that excludes the seasonal owners.
      *   *Section 2: Goodin (All Affected).* Apply to property values. It supports the seasonal owners. But note the "intensity" problem. Is financial loss equal to civic impact?
      *   *Section 3: Abizadeh (Coercion).* Property laws are coercive. But is it *political* coercion or *regulatory*? This is a nuance worth exploring.
      *   *Section 4: Miller (Membership).* The strongest counter. Shared fate, daily cooperation. Seasonal owners are "stakeholders" not "members."
      *   *Section 5: The "Partial Membership" Gap.* This is the user's key insight. Theory assumes binary (in/out). This is a hybrid. Discuss "stakeholder citizenship" or functional representation.
      *   *Section 6: The Advisory Seat.* Analyze this through the lens of legitimacy. It's a safety valve, not a solution.
      *   *Conclusion:* Bring it back to the dissertation/quals. This case reveals the *political* nature of the boundary problem. It's not solved by theory; it's fought over.

  6.  **Refining the Tone:**
      *   Avoid being too textbook-y. Use phrases like "As you know," "The rub here is," "Where the literature gets thin."
      *   Ensure the distinction between *legitimacy* (philosophical) and *stability* (practical) is clear.
      *   Make sure to address the specific "partial membership" question at the end.

  7.  **Self-Correction/Check during drafting:**
      *   *Did I answer the prompt?* Yes, implications of the literature for the case.
      *   *Did I referee the politics?* No, I analyzed the arguments each side *would* use based on the theory.
      *   *Is the theory accurate?* Whelan (1983), Goodin (2007), Abizadeh (2008/2010), Nasström (2011), Miller (2009/2016). Looks good.
      *   *Is the local context respected?* Yes, acknowledging the tax base vs. residency tension.

  8.  **Final Polish:** Check for flow and ensure the "ABD" voice resonates (i.e., don't over-explain basic concepts, focus on the friction points). *Self-correction: Make sure to explicitly mention the "circularity" in the local context—who voted on the residency requirement? The year-rounders.*

