answer: |-
  This is a fantastic "theory in the wild" moment. It is genuinely rare for an ABD to have a live, high-stakes empirical case that maps so cleanly onto the specific fault lines of the boundary problem literature. Your advisor is right: this isn't just an exercise. You are watching the *constitutive* moment of a demos happen in real time, which is usually abstracted away in the texts.

  The friction you're sensing about "partial membership" is spot on. The literature you listed largely operates on a binary logic (inside/outside, citizen/foreigner, resident/non-resident), whereas your lake town case presents a **functional stakeholder vs. civic member** dichotomy.

  Here is how the specific theoretical frameworks map onto your case, where they offer leverage, and where they snap under the weight of the "seasonal" variable.

  ### 1. Whelan and Nasström: The Meta-Problem of Who Decides
  **The Implication:** The current arrangement is logically circular but politically stable *only* as long as the excluded accept it.
  **The Break:** You can't use democratic procedure to solve this dispute.

  Whelan's point is that the boundary is pre-political. In your town, the rule "only domiciled residents vote" was established by... a vote of domiciled residents. This is the circularity in action.
  *   **Application:** When the seasonal owners argue "this is unfair," they are appealing to an external standard of justice because the internal democratic procedure cannot validate their claim (since they are excluded from the procedure).
  *   **Nasström's Critique:** She argues that principles like "all affected" claim to be neutral but actually presuppose a sovereign authority to measure the "affect." In your town, the Select Board (elected by year-rounders) gets to decide how much "affect" matters.
  *   **The "Advisory Seat" Compromise:** Through a Nasström lens, this is a tell. It admits the legitimacy deficit (we know you are affected) but refuses to grant constitutive power (you are not *of* the people). It preserves the boundary while attempting to manage the friction. It confirms Whelan: the boundary is ultimately decided by force/convention, not logic.

  ### 2. Goodin: All Affected Interests (AAI)
  **The Implication:** Seasonal owners have a strong claim to enfranchisement.
  **The Break:** The "Intensity" and "Scope" problem.

  Goodin's utilitarian approach is the seasonal owners' best friend. If the warrant article caps property value/utility, their interests are demonstrably affected.
  *   **Application:** Under strict AAI, taxation + property regulation = affected interest. The 60% tax base statistic is the smoking gun here. If democracy is about aggregating interests to maximize welfare, excluding the people bearing 60% of the cost is inefficient and unjust.
  *   **Where it Breaks:** Goodin struggles with *degrees* of affectedness. Does a loss of rental income weigh the same as the degradation of year-round community cohesion? The literature usually assumes "affected" is a binary switch, but here it's a dial.
  *   **The Seasonal Variable:** AAI usually implies global enfranchisement for big issues. Here, it implies *partial* enfranchisement. Does AAI support a vote *only* on fiscal/property matters (a "property franchise") but not on schools/zoning for primary homes? Goodin doesn't easily accommodate "issue-specific demos," which is essentially what the seasonal owners are asking for.

  ### 3. Abizadeh: All Subjected to Coercion
  **The Implication:** Coercion is binding, regardless of residence.
  **The Break:** Is property regulation "coercion" in the democratic sense?

  Abizadeh argues that if a law claims to bind you coercively, you must have a say in its authorship.
  *   **Application:** Zoning laws and rental caps are backed by the state's police power. If a seasonal owner violates them, they are fined or sanctioned. Therefore, they are subjected to coercion. Abizadeh would likely argue the boundary is illegitimate if it excludes those subject to the town's coercive apparatus.
  *   **Where it Breaks:** Abizadeh focuses heavily on *border coercion* (immigration) and the state's claim to represent "the people." In local government, the coercion is regulatory. Year-rounders might argue: "We are subjected to the *consequences* of the laws (crowded roads, school costs, noise) in a way you aren't. You can leave in October; we live with the externalities year-round."
  *   **The "Exit" Option:** Democratic theory often links coercion to the inability to exit. Seasonal owners have a high capacity for exit (sell the cabin). Year-rounders have low exit capacity. Abizadeh's framework doesn't fully account for how *exit options* mitigate the demand for *voice*.

  ### 4. Miller: National/Community Membership
  **The Implication:** Seasonal owners are not members of the demos.
  **The Break:** It exposes the tension between "Liberal" and "Republican" legitimacy.

  Miller is the year-rounders' theorist. He argues that democracy requires a pre-existing sense of solidarity, shared identity, and reciprocal cooperation.
  *   **Application:** Democracy isn't just about protecting interests (Goodin); it's about collective self-determination. Year-rounders share a "common life" (schools, winter road maintenance, local economy). Seasonal owners are more like investors or stakeholders. They extract value (recreation/rental income) without sharing the full burden of social reproduction in the town.
  *   **Where it Breaks:** Miller's account is often criticized for being too ethno-cultural or status-quo biased. In this case, it risks becoming "property owners who live here vs. property owners who don't." If legitimacy comes from shared fate, does the fact that seasonal owners pay 60% of the taxes create a *fiscal* shared fate, even if not a *social* one?
  *   **The "Partial" Problem:** Miller assumes membership is holistic. Your case suggests membership might be **modular**. One can be a member of the *fiscal* community but not the *civic* community. Miller's theory struggles to validate a "taxpayer vote" without collapsing into a 19th-century property qualification.

  ### 5. The "Partial Membership" Gap (Your Key Insight)
  You asked where the literature breaks. It breaks here: **Temporality and Functionalism.**

  Most boundary problem literature assumes a static subject. You are either a citizen or you aren't; you are either inside the border or outside.
  *   **Cyclical Membership:** Your case introduces *time* as a boundary condition. The seasonal owners are "part-time citizens." The literature has almost no vocabulary for this. (Closest might be discussions of transnational migrants, but they usually lack the *property stake* and *tax contribution* of your family).
  *   **Functional Representation:** The compromise (advisory seat) hints at a corporatist solution rather than a democratic one. It treats the seasonal owners as an "interest group" (like the local chamber of commerce) rather than "constituents."
  *   **The Legitimacy Trap:**
      *   If you follow **Goodin/Abizadeh**, you risk turning the town into a shareholder meeting, where the highest taxpayer dictates policy, potentially eroding the community character that makes the place desirable (the "Miller" objection).
      *   If you follow **Miller**, you risk "taxation without representation," which creates a class of subjects who are legally bound and financially bled but politically voiceless. This creates a legitimacy deficit that could lead to non-compliance or legal challenges (the "Whelan" circle).

  ### Implications for Your Thinking (and Quals)

  1.  **The Boundary is a Political Fight, Not a Philosophical Solution:** This case proves Whelan right. There is no philosophical principle that will resolve this to everyone's satisfaction. The boundary will be drawn by whoever has the power to draw it (the year-round voters), unless the seasonal owners use non-democratic leverage (lawsuits, withholding taxes, lobbying the state legislature). The "solution" is political settlement, not theoretical consistency.
  2.  **Taxation as a Boundary Marker:** Liberal theory spent the 20th century trying to *de-couple* voting from property/taxation (universal suffrage). This case suggests that in local governance, the link is re-emerging. The literature needs to account for why "stakeholder democracy" feels intuitively plausible to many people here, even if it violates "one person, one vote."
  3.  **The "All Affected" Principle is Too Blunt:** Goodin's principle justifies the seasonal owners' claim, but it doesn't help distinguish between a *vote* and an *advisory seat*. If "affectedness" is the metric, does high affectedness = full vote, and low affectedness = advisory? The literature rarely quantifies affect.
  4.  **Legitimacy vs. Stability:** The year-rounders might have *democratic legitimacy* (procedural correctness) but lack *sociological legitimacy* (acceptance by the governed). The seasonal owners have *liberal legitimacy* (rights/property) but lack *democratic legitimacy* (procedure). The town is unstable because these two forms of legitimacy are misaligned.

  **For your quals:** This case is a goldmine for critiquing the "binary" assumption in boundary theory. You can argue that the literature fails to account for **gradated sovereignty** in local governance. We assume the "demos" is a singular body, but in practice, local politics often operates with overlapping demoi (residents, property owners, business owners, commuters).

  Your advisor is right to push you on this. It shows that the "Boundary Problem" isn't just a logical paradox for grad students; it's the mechanism by which communities decide who counts as a neighbor and who counts as an investor. That distinction is the heart of the conflict.
