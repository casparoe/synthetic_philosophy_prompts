      *   *Critique:* Is there a "correct" answer for credit?
      *   *Correction:* In the US, ECOA generally prohibits using protected classes *in* the model, but monitors for disparate impact. This creates a tension. I should mention "Fair Lending" laws specifically.

  5.  **Final Polish:**

      *   Structure with clear headings.
      *   Use bold text for emphasis.
