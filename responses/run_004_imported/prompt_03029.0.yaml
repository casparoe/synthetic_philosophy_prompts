answer: |-
  This is a genuinely interesting knot, and you're right to be cautious. It's the kind of thing that can easily slide into "pathography" (diagnosing the philosophy via the psyche) or, conversely, get dismissed as a category error. But since you're in phil of language, you're actually positioned to handle the *conceptual* side of this better than an intellectual historian would.

  Here's a gut check on the specific moves, the scholarship, and how to frame this so your advisor doesn't immediately reach for the Dummett defense.

  ### 1. The Logic Check (Are you mangling *Grundgesetze*?)
  You're not mangling it. Your read on the sharp-boundaries requirement is standard.
  *   **The Doctrine:** Frege insists that for a *Begriff* (concept) to be logically legitimate in a scientific system, it must be *complete* (vollständig). For any object $x$, the concept must determine whether $x$ falls under it. No gaps, no "truth-value gaps."
  *   **The Nuance:** Frege acknowledges natural language is vague (*unscharf*). His project isn't to say English/German *is* sharp, but that a *Begriffsschrift* *must be*. He treats vagueness as a defect of natural language that logic cures.
  *   **The Application:** You are correct that applying this requirement to social/biological categories (like "Jew" or "Aryan") treats those categories as if they were logical *Begriffe* rather than fuzzy social constructs.

  So, premise (2) is textually solid. Frege did worry about the definability of "Jew" for legal purposes, and he did insist on sharp boundaries for concepts.

  ### 2. Critique of the "Temperament Thesis"
  Your tentative thesis is: *(1) is tool reuse (trivial), but (2) reveals a shared temperament (horror of vagueness).*

  **The Strength:**
  It avoids the strong (and likely false) claim that Fregean logic *entails* ethnonationalism. You aren't saying "Logic $\rightarrow$ Racism." You're saying "A specific metaphysical/psychological commitment to Determinacy manifests in both domains." This is safer and more plausible.

  **The Weakness (The "Russell Problem"):**
  This is the objection your advisor will likely raise. Russell, Whitehead, Carnap, and the early Wittgenstein were equally obsessed with sharp boundaries, eliminating vagueness, and logical purity. They were not ethnonationalists (Carnap was a socialist/pacifist; Russell was a leftist activist).
  *   **The Risk:** If the "horror of vagueness" is a standard feature of early analytic philosophy, it cannot explain the *specific* political outcome (Frege's antisemitism) without an additional premise.
  *   **The Fix:** You need to specify *what kind* of vagueness Frege is intolerant of. Is it semantic vagueness, or ontological indeterminacy?
      *   If it's just semantic, the Russell counterexample holds.
      *   If it's **ontological**—i.e., Frege believes the *world itself* (including the social world) *ought* to be carved at the joints, and vagueness is a sin against reality, not just language—then you have a stronger link. Frege's Platonism might be the bridge. He treats concepts as objective entities. If he treats "The Jew" as an objective concept rather than a social construct, his logical demand for sharpness becomes a political demand for purification.

  ### 3. Distinguishing "Tool Reuse" from "Temperament"
  You asked if there's a principled way to tell (1) and (2) apart. I think there is.

  *   **(1) The Ancestral:** This is **formal isomorphism**. Genealogy *is* structurally a transitive closure. Using the ancestral to model descent is like using arithmetic to model apple counts. It tells you nothing about the *value* of the apples or the people. It's neutral machinery. You're right to discard this as evidence of anything deep.
  *   **(2) The Sharp Boundaries:** This is **normative transfer**. Here, Frege isn't just using a tool; he's applying a *norm of correctness*.
      *   In logic: A vague concept is *defective*.
      *   In politics: A vague legal category is *unworkable/unjust* (in his view).
      *   **The Connection:** The connection isn't that he used logic to do politics. It's that he imported the **normative standards of logic** (determinacy, bivalence, completeness) into the **ontology of the social world**.
      *   **The Philosophical Work:** The work this thesis does is identifying a **Category Mistake**. Frege treats social kinds as if they were logical kinds. The "temperament" is actually a **methodological imperialism**: the belief that the standards of the *Begriffsschrift* apply to the *Volksgeist*.

  ### 4. Is this a Dead End?
  No, but it needs reframing to avoid the "unfalsifiable temperament" trap.

  **Don't argue:** "Frege was racist because he liked sharp boundaries." (False, see Carnap).
  **Do argue:** "Frege's commitment to logical determinacy blinded him to the ontological status of social categories, facilitating his racism."

  This shifts the focus from *psychology* to **methodology**. It suggests that Frege's philosophical framework lacked the resources to critique the *formation* of concepts, only their *structure*. He could ask "Is 'Jew' a sharp concept?" but his system didn't force him to ask "Is 'Jew' a natural kind capable of being a sharp concept?"

  ### 5. Advisor Strategy & Scholarship
  If you bring this to your advisor, anticipate the Dummett/Heck defense.
  *   **Richard G. Heck** has written specifically on Frege's politics (e.g., "Frege and the Politics of Logic"). He argues strongly for separation but acknowledges the tension.
  *   **Gottfried Gabriel** (the editor of the Nachlass) is the primary source on the diary.
  *   **Hans Sluga** (*Heidegger and the Crisis*) deals with the "logic + politics" entanglement in this era, though he focuses on Heidegger.
  *   **Claire Ortiz Hill** has written on the social context of Frege's logic.

  **The Pitch:**
  "I'm not arguing for a logical entailment between the *Begriffsschrift* and the Diary. I'm arguing that Frege's **criterion of demarcation** for legitimate concepts (sharp boundaries) was applied univocally to both mathematical and social objects. This suggests his logic wasn't just a tool he used, but a worldview that rendered social vagueness intelligible only as a defect to be purged. The philosophical payoff isn't about Frege's biography, but about the limits of formalism: when a logical requirement for bivalence is treated as an ontological requirement for reality."

  ### Summary
  *   **(1) Ancestral:** Drop it. It's a red herring. It's just math.
  *   **(2) Sharp Boundaries:** Keep it, but upgrade it from "temperament" to "category error" or "methodological imperialism."
  *   **The Trap:** Avoid implying analytic philosophy is inherently fascist (the old Lukács/Adorno line). Stick to Frege's specific Platonism.
  *   **The Value:** This is actually a solid phil of language point. It touches on **conceptual engineering** and the ethics of categorization. If we demand sharp boundaries for social concepts, what violence does that do? Frege is the perfect case study because he explicitly demands it.

  It's not a dead end, but it walks a tightrope. If you frame it as a critique of **formalism's application to social ontology**, rather than a psychological profile of Frege, it's dissertation-worthy (even if it's not *for* the dissertation). Good luck.
