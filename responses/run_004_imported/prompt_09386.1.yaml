answer: |-
  The waveform on the monitor was a flat, green horizon. Four minutes of it.

  Martin Vell leaned back in his chair, the leather creaking in the soundproofed silence of his studio. He was a forensic audio analyst; his life's work was the enhancement of the unintelligible. He took the hiss of a wiretap and found the whisper of a name. He took the roar of a crowd and isolated the click of a safety catch. He believed in the signal. He believed that if you filtered enough noise, truth remained.

  Then, three weeks ago, his aorta had dissected in the grocery store checkout line. For four minutes, the green line on the paramedic's monitor had looked exactly like the one on his screen now.

  He clicked the mouse. The cursor blinked at the end of the document titled *Addendum to Medical Fitness Report*.

  The insurance company wanted to know if the hypoxia had caused cognitive degradation. The university wanted to know if he still held to the materialist framework that underpinned his tenure. His colleagues, the ones who had toasted his book *The Myth of the Ghost Frequency*, wanted to know if he was going to recant.

  Martin closed his eyes. He didn't see pearly gates. He didn't see a tunnel. Ayer had seen a red light and ministers of space. Martin had heard a chord.

  It wasn't a sound, not exactly. It was a resonance that existed beneath the silence. When his heart stopped, the noise of the world—the sirens, the compression of his sternum, the panic—had dropped away, not into quiet, but into harmony. He had felt, with the crushing certainty of a physical law, that the noise was not random. It was arranged. There was a structure to the chaos, a syntax to the suffering, and for those four minutes, he wasn't an observer. He was a note in the chord.

  It was a profound, undeniable sensation of *meaning*.

  Martin opened his eyes and looked at the flat line on the screen.

  By every metric he possessed, the experience was a hallucination. A dying brain floods with endorphins and DMT; neurons fire in random cascades as the system powers down. To call it a revelation was category error. It was biology misfiring. It was noise.

  And yet.

  He typed: *Subject reports no memory loss. Cognitive processing remains within baseline parameters.*

  He paused. That was the easy part. The next line was the one that mattered.

  *Subject maintains previous philosophical commitments regarding the non-existence of post-mortem consciousness.*

  His fingers hovered over the keys. That was the truth, wasn't it? He didn't believe he had a soul. He didn't believe he was going back to the Chord. When he died again, for good, he expected the green line to stay flat forever.

  But the sentence felt brittle. It felt like he was shouting down a whisper because he was afraid of what the whisper might say if he listened.

  Ayer, the old positivist, had said his experience loosened his "inflexible attitude." Martin had mocked that at the time. It sounded like sophistry. A way to have your cake and eat it too. To keep your reputation as a hard-nosed empiricist while sneaking a little mysticism in through the back door.

  Now, staring at the waveform, Martin understood the distinction.

  If he said, "I believe in an afterlife," he was making a claim about the world that could not be verified. He would be a fraud.
  If he said, "The experience was meaningless," he was making a claim about the experience that was demonstrably false. It *meant* something to him. It had altered his state. It was data.

  The error wasn't in the belief. The error was in the certainty.

  He deleted the line.

  He thought about the Chord. He didn't believe it was God. He didn't believe it was proof of anything outside his own skull. But he could no longer prove, to his own satisfaction, that the skull was the boundary of the world. He had touched the edge of the map and found the paper was thinner than he thought.

  He didn't need to believe in the ministers of space. He just needed to admit that the map was not the territory.

  Martin typed slowly.

  *Subject notes an anomalous phenomenological event during the period of clinical death. While this event does not constitute empirical evidence for metaphysical claims, it has rendered the Subject's previous dogmatic rejection of such claims epistemologically unsustainable.*

  He read it over. It was clunky. It was cautious. It was not a conversion. It was a adjustment of the aperture.

  He was not saying the light was real. He was saying that his blindness was not a virtue.

  Martin hit *Save*. He stood up and walked to the soundproof door. He put his hand on the handle. He could hear the hum of the building's ventilation, the distant traffic, the heartbeat in his own ears. It was all just noise. It was all just signal.

  For the first time in thirty years, he didn't feel the need to filter it. He left the door unlocked, just a crack, to let the outside in.
