answer: |-
  Thank you for trusting me with this. I am so sorry for your loss. It is a profound thing to be asked to honor someone exactly as they understood the world, especially when that understanding defies the usual scripts of mourning.

  Here is a draft that attempts to walk that line: philosophically rigorous enough for your cousin, accessible enough for the family, and faithful to your grandmother's specific vision of existence. It leans heavily on the ending of *A New Refutation of Time* to find the comfort in the finitude of the moment.

  ***

  **Eulogy for [Grandmother's Name]**

  Good morning. For those who don't know me, I'm [Your Name], [Grandmother's Name]'s grandchild.

  When we lose someone we love, the instinct is to reach for comfort in the idea of continuity. We want to believe that the person who was here on Friday is the same person who is somewhere else on Saturday. We want to believe they are watching us, or that they are waiting for us, or that they are living on in a future we haven't reached yet.

  But [Grandmother's Name] was a professor of literature, and she was a student of Jorge Luis Borges. And she taught me that those comforts, while kind, rely on a lie. They rely on the idea that time is a river that carries a persistent "self" along its banks.

  She believed, as Borges argued in *A New Refutation of Time*, that there is no river. There is only the water. There is no persisting self that moves from yesterday to today. There are only moments. Discrete, separate, complete moments.

  I know this sounds cold. I know it sounds like it takes something away. If there is no continuous self, where is she now?

  The answer she would give is: She is not *now*. She is *then*. And that is okay.

  Because if there is no succession of time, then the moments we shared with her are not lost. They are not fading away as we move further from them. They are fixed. They are real. The moment she laughed at a bad joke, the moment she corrected my grammar, the moment she sat quietly in this room—those are not ghosts. They are facts. They do not need a future to validate them. They do not need her to be "watching over us" to be true. They simply *were*, with an intensity that death cannot touch.

  She hated the idea that she would "live on in our memories," because that suggests she is a project for us to complete. She wasn't. She was complete in every moment she inhabited.

  Borges, after spending an essay logically dismantling the existence of time, admits in the final paragraph that he still cannot shake the feeling of it. He knows the logic, but he feels the flow. And he finds a strange comfort there. He writes:

  *"Time is the substance I am made of. Time is a river which sweeps me along, but I am the river; it is a tiger which destroys me, but I am the tiger; it is a fire which consumes me, but I am the fire."*

  [Grandmother's Name] was not swept away by time. She was the time. She was the substance of the moments she occupied.

  So, how do we find comfort in this?

  The comfort is not that we will see her again. The comfort is that we saw her at all. The comfort is that this grief we feel right now is not a bridge to a future reunion; it is a testament to the reality of the past. We are not missing a future with her. We are honoring the absolute reality of the time we had.

  She is not waiting for us. She is not looking down. She is not passing through the years.

  She is here, in this specific moment, as fully as she can be. And when this moment is done, it will be fixed, just like she is fixed.

  We cannot save her from the tiger. We cannot stop the fire. But we can acknowledge that for a while, we were made of the same substance.

  Thank you.
