answer: |-
  This is a textbook case of **Aumann's Agreement Theorem** colliding with the **Epistemology of Peer Disagreement**. Given your background, you're going to recognize the skeleton immediately, but the flesh on the bones is where it gets messy (and where your friends are actually fighting).

  Here is the move-by-move breakdown, assessing who holds the stronger position at each step, followed by the theoretical naming and the "missing piece" that likely frustrated you.

  ### Move-by-Move Analysis

  **Move 1: Lena**
  > *"Neither of us thinks the other's an idiot or a liar. If we're still 20 apart... one of us honestly doesn't believe our own number anymore."*

  *   **The Theory:** This is a direct invocation of **Aumann's Agreement Theorem** (1976). In formal terms: If two agents are Bayesian rationalists, share a **Common Prior**, and have **Common Knowledge of each other's Posteriors**, their posteriors must be identical. They cannot "agree to disagree."
  *   **Who has the better of it?** **Theoretically Lena, Practically Sam.**
      *   Lena is correct *if* the conditions of the theorem are met. If you truly trust the other person's rationality and honesty, their probability estimate is evidence you must update on. To ignore it is irrational.
      *   However, she is glossing over the "Common Knowledge" requirement. They have *shared* their numbers, but do they have common knowledge of *why* they hold them? Usually, people suspect hidden bias even if they don't call the other a "liar."

  **Move 2: Sam**
  > *"That doesn't follow... we didn't start from the same place. You've never been cheated on, I have, and that colors how I read this stuff."*

  *   **The Theory:** Sam is attacking the **Common Prior Assumption (CPA)**. He is arguing that his personal history constitutes a different prior (or a different likelihood function) that is not easily transferable. He is also introducing **Indexical Information** ("*I* have been cheated on").
  *   **Who has the better of it?** **Sam.**
      *   This is the standard and strongest critique of Aumann in real-world settings. Priors are rarely common. Sam is arguing that his "calibration" is part of his epistemic machinery, not just data he processed. He is claiming that Lena lacks the *qualia* required to process the evidence correctly.
      *   He correctly identifies that "rationality" doesn't erase personal history; personal history *defines* the baseline for what counts as evidence.

  **Move 3: Lena**
  > *"Sure it is -- that's exactly the sort of thing you're supposed to compress into a number and pass along. If you'd really told me everything driving your 40, I should end up near 40 too."*

  *   **The Theory:** Lena is arguing for the **Sufficiency of Posteriors**. She believes the probability number (40%) is a sufficient statistic for all of Sam's private information and processing. If she knows the output of his black box, she should be able to replicate the output in her own black box.
  *   **Who has the better of it?** **Lena (with caveats).**
      *   In ideal Bayesianism, she is right. If Sam says "40%," Lena should treat "Sam says 40%" as a piece of evidence and update. If she updates and lands on 70%, she is effectively saying, "I trust my processing of the public evidence more than I trust Sam's processing of his private evidence."
      *   Her weakness here is assuming that "everything driving your 40" *can* be compressed into a number without loss of fidelity.

  **Move 4: Sam**
  > *"Some of it just won't compress like that. It's not a fact I'm sitting on, it's calibration from stuff I've lived through... two honest, reasonable people can end up stuck apart."*

  *   **The Theory:** Sam is invoking **Tacit Knowledge** and the limits of **Propositional Evidence**. He is arguing that some evidence is non-propositional (experiential) and affects the *weight* of evidence, not just the direction.
  *   **Who has the better of it?** **Sam.**
      *   This is the clincher. Formal epistemology struggles with "ineffable" evidence. If Sam's experience changes *how* he interprets a text message from the boyfriend (e.g., seeing it as suspicious rather than innocent), that is a difference in likelihood functions, not just priors. You cannot "compress" a likelihood function into a single number easily.
      *   He successfully defends the possibility of **Rational Persistent Disagreement**.

  ---

  ### The Name of the Thing

  You are looking for two intersecting fields:

  1.  **Aumann's Agreement Theorem:** The formal result Lena is implicitly citing.
  2.  **The Epistemology of Peer Disagreement:** Specifically the debate between **Conciliationism** (Lena) and **Steadfastness** (Sam).
      *   **Conciliationism:** If you discover an epistemic peer disagrees with you, you are rationally required to significantly revise your confidence (usually toward the mean).
      *   **Steadfastness:** You can maintain your belief if you have reason to think you are evaluating the evidence better than the peer (e.g., due to specific expertise or, in Sam's case, specific experiential calibration).

  ### The Bigger Thing They Are Both Missing

  Since this is your area, you probably felt stuck because both sides are arguing past the actual formal problem. Here is what is missing from the dinner table:

  **1. The Distinction Between Priors and Likelihoods**
  Lena treats Sam's experience as *evidence* (data) that should update her prior. Sam treats his experience as a *likelihood function* (the lens through which data is viewed).
  *   **The Fix:** If Sam's experience changes how he interprets *new* signs (likelihoods), Lena cannot simply update on his number. She would need to adopt his lens to agree. They are disagreeing on the *model*, not just the parameters.

  **2. Imprecise Probabilities (Credal Sets)**
  They are arguing over point estimates (70% vs 50%). In formal decision theory, when evidence is ambiguous or calibration is subjective, agents should hold **imprecise credences** (e.g., "I'm somewhere between 40% and 80%").
  *   **The Fix:** If they had expressed their uncertainty intervals, they might have overlapped. Lena might be [60%, 80%] and Sam [40%, 60%]. The "fight" is an artifact of over-precision.

  **3. The "Weight" of Evidence (Keynes)**
  Keynes distinguished between the *probability* of a hypothesis and the *weight* of the argument. Sam's experience gives his judgment more "weight" (resilience to new evidence) regarding infidelity, even if the raw probability isn't objectively higher. Lena is treating probability as frequency; Sam is treating it as confidence.

  **4. They Haven't Established Peerhood**
  The entire Conciliationist argument rests on them being **Epistemic Peers**.
  *   Lena assumes they are peers (same rationality, same access).
  *   Sam claims he is **not** a peer on this specific topic because he possesses privileged indexical information (the experience of cheating) that Lena cannot access even in principle.
  *   **The Missing Move:** They needed to stop arguing about the relationship and argue about *whether they are peers on this topic*. If Sam is right that his experience makes him a "super-peer" on detecting cheating signs, Lena *should* defer more than she is. If Lena is right that "cheating experience" just biases you toward false positives, Sam is the one who should move.

  ### Verdict

  **Sam won the argument, but Lena won the theory.**

  *   **Lena** is right about how ideal agents *should* behave in a vacuum (Aumann/Conciliationism).
  *   **Sam** is right about how actual humans *do* behave given path-dependency and non-propositional evidence (Critiques of CPA/Steadfastness).

  **How you could have broken the tie:**
  You could have pointed out that they are using "probability" to mean two different things. Lena is using it as a **betting quotient** (what odds would you take?), while Sam is using it as a **measure of conviction** (how shocked would I be if I was wrong?).

  If you force them to bet real money, Lena's 70% usually collapses closer to Sam's 50% because risk aversion kicks in. If you ask them how shocked they'd be, Sam's 50% might expand to Lena's 70% because he admits it's possible he's just traumatized.

  They stalled because they were negotiating **ontology** (what is this number?) while pretending to negotiate **probability** (what is the number?).
