      *   **The Worry:** The user is worried that Millikan's teleosemantics fails to solve the disjunction problem (fly vs. small dark moving speck) because of Sober's critique of selection *for* vs. selection *of*. If the properties (being a fly, being a small dark moving speck) were perfectly co-extensive in the evolutionary history of the frog, there is no historical fact of the matter about which was selected *for*. Therefore, content is indeterminate.
