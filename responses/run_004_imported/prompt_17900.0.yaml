answer: |-
  It is a pleasure to address a colleague who knows the wetware as well as the literature. You have put your finger on the precise pressure point where evolutionary biology meets the philosophy of mind. Your worry is well-founded: Elliott Sober's distinction between selection *for* and selection *of* is a devastating critique of naive adaptationism, and since Millikan's teleosemantics is built on the backbone of Selected Effect (SE) functions, it seems vulnerable to the same indeterminacy. If the history of the frog's lineage contains no variation between "fly" and "small dark moving speck," Sober argues there is no fact of the matter about which property caused the proliferation of the gene. If there is no fact about the selection, there is no fact about the function, and thus no fact about the content.

  However, I believe this worry, while logically potent against a crude adaptationism, does not sink the teleosemantic naturalization project. To talk you back out of it, I want to leverage three specific resources available to a Millikanian: (1) the role of the **consumer system** in fixing content, (2) the distinction between **historical frequency and Normal conditions**, and (3) a willingness to accept **biological coarseness** over human linguistic intuition.

  ### 1. The Consumer Fix: It's Not Just About the Selector
  Your worry focuses heavily on the *selection history* of the producer (the visual detection mechanism). You are asking: "What property in the environment selected for this retina?" Sober says if the properties are co-extensive, we can't know.

  But Millikan's theory in *Language, Thought, and Other Biological Categories* (LTOBC) is not merely a theory of what selected for a trait; it is a theory of **intentional icons** defined by a producer-consumer relationship. The content of a representation is not fixed solely by what caused the producer to evolve, but by what the **consumer** of that representation requires to perform its function.

  Consider the frog's snapping mechanism (the consumer). Its selected effect is not "to close on photons" or "to react to retinal stimulation." Its selected effect is "to ingest nutritious matter." The visual state (the icon) serves to coordinate the consumer with the world. For the consumer to succeed, the object snapped at must be nutritious.
  *   A "small dark moving speck" (BB) triggers the producer, but it fails to satisfy the consumer's functional requirement (nutrition).
  *   A "fly" triggers the producer and satisfies the consumer's functional requirement.

  Even if flies and specks were perfectly co-extensive in the past, the **functional interface** between the producer and the consumer is not symmetrical. The consumer was selected to operate on *nutrition*, not *visual geometry*. Therefore, the content is fixed by the conditions required for the *consumer's* success, not merely the *producer's* trigger history. The "selection for" ambiguity at the sensory input level is resolved by the functional constraints at the motor/digestive output level. The content is "nutritious prey" (which happens to be flies), not "dark speck," because only the former allows the total system to perform its Proper Function.

  ### 2. Normal Conditions vs. Historical Statistics
  Sober's argument relies on a statistical reading of history: if property F and property G always occurred together, we cannot distinguish them. Millikan, however, relies on the notion of **Normal conditions** (with a capital 'N').

  Normal conditions are not merely the statistical average of the past; they are the conditions under which a mechanism *successfully performs its function* and thereby explains its continued existence. This is a modal notion, not just a historical one.

  Even if, historically, every dark moving speck *was* a fly, a BB is not a Normal condition for the frog's feeding system. Why? Because if a BB is presented, the system *fails* to achieve its selected effect (nutrition/reproduction). The history of the trait is explained by the *successes*, not the triggers. The explanation of why the snapping mechanism exists refers to a lineage of successful ingestions.
  *   The "selection for" story is not just "what triggered the eye?"
  *   It is "what allowed the organism to survive?"

  Organisms survived because they caught flies (nutrition), not because they snapped at specks (kinematics). The *explanatory* weight in the evolutionary narrative falls on the nutrition, not the visual signature. Therefore, the Normal conditions for the operation of the representational map are conditions involving nutritious prey. The BB is an *abnormal* condition, even if it mimics the trigger. Millikan's apparatus is entitled to assign content based on the conditions required for the *success* of the mechanism, which discriminates between flies and BBs even if the historical trigger record does not.

  ### 3. Embracing Coarseness: The "Fly" Intuition is Human, Not Froggy
  Finally, I think we must address the intuition driving your worry. The worry assumes that the correct content *must* be "fly" and that "small dark moving speck" is the erroneous competitor. But why privilege the human category "fly"?

  A Millikanian should be willing to accept that biological content is often coarser than human language. It is entirely possible that the true content of the frog's state is disjunctive or coarse-grained, such as **"edible-sized moving object."**

  If the content is "edible-sized moving object," the disjunction problem dissolves.
  *   Is it a fly? Yes (usually).
  *   Is it a speck? Yes (visually).
  *   Is it edible? That is the biological reality.

  If the theory assigns the content "edible object," it has successfully naturalized the content. It has identified a real, biological property that grounds the representation's function. The fact that this property does not align with the human lexical item "fly" is a problem for human taxonomy, not for teleosemantics.

  Furthermore, if we accept the consumer argument (Point 1), the content is tied to the *mapping rule*. The mapping rule is: "Map visual stimulus X to motor command Y *under the assumption that X correlates with nutrition*." The content includes the assumption. The representation carries the information "nutrition is here." When a BB appears, the representation is *false*. It says "nutrition is here," but there is none. This allows for error (misrepresentation) without requiring that "fly" and "speck" were historically decoupled. The error is not about the visual shape; it is about the **signified** property (nutrition) which *could* have come apart from the signifier (visual shape) in principle, even if it didn't in the actual history of that specific lineage.

  ### Conclusion: Why the Project Survives
  Your worry suggests that without a historical decoupling of properties, there is no fact of the matter about content. I argue that the fact of the matter is not found solely in the *frequency* of past properties (Sober's domain), but in the **functional dependencies** of the current system (Millikan's domain).

  1.  **Functional Asymmetry:** The consumer system distinguishes between the trigger (speck) and the goal (nutrition), breaking the symmetry Sober identifies.
  2.  **Normal Explanations:** Content is fixed by conditions required for success, not just conditions that triggered the mechanism. BBs do not support the Normal explanation of the feeding system.
  3.  **Biological Realism:** If the content turns out to be "nutritious object" rather than "fly," the naturalization project succeeds even if our linguistic intuitions feel unsatisfied.

  Teleosemantics aims to naturalize meaning by grounding it in biological function. It does not promise to replicate the fine-grained distinctions of human philosophy seminars. As long as the theory can distinguish between successful operation and failure (which it does via the consumer/Normal condition framework), it has secured a notion of truth and falsity. And if it has truth and falsity grounded in physical history and function, the naturalization project stands, even if Sober is right that adaptationist *inference* is sometimes underdetermined. The frog's eye doesn't need to know the difference between a fly and a BB to have a content fixed by the difference in what keeps the frog alive.
