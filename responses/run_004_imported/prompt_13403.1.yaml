      Total: 7 + 3.5 + 1 = 11.5/20. Let's round to 12 for generosity on (a). 12/20 is 60%. In a grad seminar, this is a fail/marginal pass. I will assign 12/20 and a C.

      *Wait, let's reconsider the "Grad Seminar" context.* In many PhD programs, anything below a B- is failing. 12/20 is a 60%. That's an F in many contexts. However, as a TA, I might not want to fail them on a short response if (a) was good. But (c) shows they don't understand the reading. I should grade honestly. 12/20 reflects that. Letter grade C.

