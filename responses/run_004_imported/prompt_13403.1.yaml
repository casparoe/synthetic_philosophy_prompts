      Actually, Raz argues L and C are incomparable. The status of L+ is used to prove L $\neq$ C. The student implies the trichotomy failure of L+ proves the trichotomy failure of L. This is a bit confused. Raz argues L fails trichotomy. L+ is used to disprove Equality. I will deduct a point for this logical muddle. 7/8.

