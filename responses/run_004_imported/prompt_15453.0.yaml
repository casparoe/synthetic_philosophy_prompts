answer: |-
  To compare Larry Wright's etiological account and Robert Cummins's causal-role account, we must examine the logical machinery each employs to assign the predicate "function." Wright's theory is diachronic and explanatory: a trait $X$ has function $F$ if and only if $X$ exists *because* it did $F$ in the past (and continues to do so). Cummins's theory is synchronic and analytical: $X$ has function $F$ in system $S$ relative to analytic strategy $A$ if $X$ has the capacity to do $F$ and $F$ contributes to a capacity of $S$ that $A$ seeks to explain.

  The central tension lies in how these mechanics handle the boundary between what a trait *does* and what it is *for*.

  ### 1. Cummins's Causal-Role Mechanics and Permissiveness

  Cummins's account functions by embedding a trait within a hierarchical system analysis. The mechanics rely on three variables: the trait ($X$), the containing system ($S$), and the analytic strategy ($A$). The theory posits that functions are capacities that figure in the causal explanation of a system's higher-level capacity.

  **The Mechanism of Permissiveness:**
  The charge of permissiveness arises directly from the relativity of $S$ and $A$. The theory contains no internal constraint on what constitutes a legitimate "containing system" or "analytic strategy." In the case of the beating heart making a sound:
  1.  **Trait ($X$):** The heart.
  2.  **Capacity ($F$):** Producing a thumping sound.
  3.  **System ($S$):** The patient-doctor diagnostic dyad.
  4.  **Analysis ($A$):** Explaining how the doctor diagnoses cardiac health.

  Mechanically, the heart sound *does* contribute to the capacity of $S$ (diagnosis) under $A$. Therefore, under Cummins's strict definition, the sound is a function. The theory cannot rule this out because it defines function as *contribution to capacity*, not *reason for existence*. The "heart sound" is not an error in application; it is a correct output of the theory's logic. To rule it out, Cummins must stipulate that $S$ must be the *organism* and $A$ must be *biological maintenance*. However, nothing in the causal-role mechanics justifies this stipulation. A causal contribution is a causal contribution, regardless of whether the beneficiary is the organism or the physician.

  **The Consequence:**
  This collapses the distinction between *function* and *mere beneficial effect*. If any causal contribution relative to any interest counts, the concept of function loses its normative force (the ability to distinguish proper operation from malfunction). A heart that makes no sound malfunctions relative to the diagnostic system, which contradicts biological intuition.

  ### 2. Wright's Etiological Mechanics and Exaptation

  Wright's account grounds function in natural selection. The schema is: $X$ is there because it does $F$. This requires a feedback loop where past performance of $F$ caused the proliferation of $X$.

  **The Mechanism of Exaptation Failure:**
  The problem of exaptation (e.g., feathers evolving for insulation but co-opted for flight) strikes at the "because" clause.
  1.  **Historical Requirement:** For flight to be the function of feathers, feathers must exist *because* they facilitated flight in the past.
  2.  **The Lag:** When feathers are first co-opted for flight, there is no history of selection for flight. They exist because of selection for insulation.
  3.  **The Verdict:** Mechanically, Wright's account must deny that flight is the function of feathers at the onset of co-option. It classifies flight as a "beneficial effect" but not a "function."

  **The Ancestral vs. New Ambiguity:**
  The prompt notes a deeper mechanical ambiguity: even after long co-option, when does the function switch? Wright's schema requires the function to explain the trait's *current presence*.
  *   If the trait is maintained by selection for the *new* use (flight), does the *old* use (insulation) cease to be a function?
  *   Wright's mechanics suggest that if insulation no longer explains the presence of the trait (i.e., if flightless birds with insulating feathers died out, but flying birds survived), the function shifts.
  *   However, if both pressures maintain the trait, both are functions. The ambiguity arises because selection is rarely a clean on/off switch. The theory lacks a metric for "how much" selective history is required to establish a new etiological chain. It treats function as a binary historical fact, but evolutionary history is a continuous process of shifting pressures.

  **The Consequence:**
  Wright's mechanics create a "temporal lag" where intuitive functions (flight) are excluded until selection history accumulates. This preserves normativity (a feather that doesn't fly isn't malfunctioning if flight isn't yet its function) but conflicts with the intuition that the trait is *currently* functioning for flight.

  ### 3. Comparative Evaluation

  On balance, **Wright's account handles the problems better**, though neither is flawless.

  **Severity of Error:**
  Cummins's permissiveness is a **category error**. By allowing *any* causal contribution to count as a function, his mechanics dissolve the specific biological concept of function into general causal utility. If the heart sound is a function, then *every* effect is a function relative to *some* system. This renders the term "function" explanatorily weak for biology, as it cannot distinguish design from accident.

  Wright's exaptation problem is a **boundary error**. It misclassifies novel traits during a transitional historical period. It fails to ascribe a function to a trait that is clearly useful, but it maintains the crucial distinction between *what a trait does* and *why the trait is there*. For the vast majority of biological traits (which are conserved), Wright's mechanics correctly identify the function and allow for the concept of malfunction (e.g., a heart that doesn't pump is malfunctioning, even if it makes sounds).

  **Mechanical Robustness:**
  Wright's reliance on selection history provides an objective anchor (the evolutionary record) that limits the number of functions a trait can have. Cummins's reliance on analytic strategies provides no such anchor, leaving the theory vulnerable to infinite functional ascriptions depending on the observer's interest. Wright's problem is that history is slow; Cummins's problem is that causality is ubiquitous. In biology, ubiquity is a greater threat to explanatory power than lag.

  ### 4. Repairability Without Borrowing

  Can either theory be repaired without importing the rival's resources?

  **Cummins:**
  To fix the permissiveness problem, Cummins must constrain the "containing system" ($S$) and "analytic strategy" ($A$). He needs to say $S$ must be the organism and $A$ must concern survival/reproduction. However, purely causal mechanics cannot justify this constraint. A causal contribution to a doctor's diagnosis is physically real. To rule it out, Cummins must appeal to the *purpose* of the organism, which implies a history of design or selection. This is borrowing from Wright. Without etiology, Cummins has no non-arbitrary way to privilege the organism's capacity over the doctor's capacity.

  **Wright:**
  To fix the exaptation problem, Wright must allow a trait to acquire function before selection history accumulates. He might argue for a "modern history" view (e.g., Godfrey-Smith), where only recent selection matters. However, for a *brand new* mutation or co-option, there is *zero* history. To ascribe function immediately, Wright must admit that *current utility* can ground function. This is the core mechanic of Cummins's view (current contribution to capacity). If Wright allows current utility to count, he abandons the strict "because" clause that defines his theory.

  **Conclusion on Repair:**
  Neither account can be fully repaired internally.
  *   Cummins needs **normativity** (to rule out accidental effects), which requires history/selection (Wright).
  *   Wright needs **current utility** (to handle novelty), which requires causal-role analysis (Cummins).

  This suggests that the "actual mechanics" of biological function require a hybrid approach: a trait must have a causal capacity (Cummins) that is sustained by a history of selection (Wright). However, if forced to choose the more robust foundation for *biology*, Wright's etiological mechanics are superior. They successfully capture the normative dimension (malfunction) which is essential to biological explanation, whereas Cummins's mechanics, while flexible, fail to distinguish biological design from incidental causality without external stipulation. Wright's exaptation problem is a limitation of scope (novelty), whereas Cummins's permissiveness is a limitation of definition (identity).

  **Final Verdict:** Wright's account is preferable because its error is one of *timing* (delayed functional ascription), whereas Cummins's error is one of *kind* (conflating function with effect). However, neither can solve their respective problems without incorporating the central insight of the other: Wright needs current causal contribution, and Cummins needs historical selection.
