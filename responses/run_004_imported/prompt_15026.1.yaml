prompt: |-
  I'm a novelist, so normally the hardest writing problem I deal with is getting a scene to land, but my old grad school roommate Aaron just asked me to be his best man and I think this toast might actually be harder than a whole book. Aaron did his PhD in philosophy and wrote his dissertation on Sartre, specifically bad faith and radical freedom, and for the fifteen years since he's told anyone who'd sit still for it that most of what people say about love and commitment is a textbook case of self-deception. Every single Thanksgiving when someone asked him and Jess (his now-fiancee, a large-animal vet who has heard this lecture more times than anyone alive should have to) when they'd finally get married, his stock answer was some version of "we're not the kind of in-itself that has a wedding date," which used to kill at parties and is now, definately, a bit of a problem for him.

  Here's my actual issue: all the normal toast material is off limits. I can't say he knew from the moment he saw her, or that they were meant for each other, because those are more or less the exact sentences he's built a career on calling bad faith -- pretending your freely made choice was actually fate, so you never have to own it. But I also don't want to hand him four minutes of Being and Nothingness with a cake at the end. What I'm after is a toast that uses his own philosophy honestly to get somewhere warm: it should play fair with facticity vs. transcendence and "existence precedes essence," it should take the in-itself line and hand it back to him at the end, and if you can manage it, I'd love one bit that touches on that part of his work where wanting to be loved turns out to be wanting someone to freely choose to be captured by you forever -- I seem to remember him ranting once about that being basically unstable by design -- without making it sound like a threat instead of a toast. The room's going to be half his philosophy department, who'll catch every reference, and half family who've politely sat through this stuff for a decade and will check out the second it turns into an actual lecture. So: four minutes tops, funnier than solemn, and it needs to survive having every philosophy line cut out of it and still work as a toast.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**

      *   **Speaker:** Novelist (best friend/old grad school roommate).
      *   **Groom:** Aaron (PhD in Philosophy, Sartre specialist, focused on bad faith, radical freedom, existence precedes essence).
      *   **Bride:** Jess (Large-animal vet, has heard Aaron's lectures for 15 years, finally convinced him to marry her).
      *   **The Conflict:** Aaron's entire academic/personal stance is that traditional romantic tropes ("meant to be," "love at first sight") are "bad faith" (self-deception to avoid owning free choice). A normal toast contradicts his core beliefs.
      *   **The Goal:** A toast that uses his philosophy *honestly* to arrive at a warm conclusion. It needs to acknowledge "facticity vs. transcendence," "existence precedes essence," and the "in-itself" joke. It needs to address the paradox of love (wanting someone to freely choose to be "captured").
      *   **Audience:** 50% Philosophy Dept (will catch references), 50% Family (will tune out if too academic).
      *   **Tone:** Funnier than solemn, max 4 minutes (approx. 500-600 words spoken at a normal pace), must work even if the philosophy jokes are missed (i.e., the emotional core must stand on its own).

  2.  **Deconstruct the Philosophy (Sartre 101 for the Toast):**

      *   *Bad Faith:* Lying to yourself to escape the anxiety of freedom. Saying "I had no choice" or "It was fate."
      *   *Existence Precedes Essence:* We exist first, then we define who we are through actions. There is no pre-written script.
      *   *Facticity vs. Transcendence:* Facticity is what you *are* (past, body, situation). Transcendence is what you *can become* (future, possibilities). Authenticity is balancing both.
      *   *The Look/The Conflict:* Wanting to be loved is wanting the Other to freely choose you, but also wanting that choice to be permanent (fixed). This is the "unstable by design" part the user mentioned.
      *   *In-Itself (En-soi):* Things that just *are* (like a rock). *For-Itself (Pour-soi):* Conscious beings who choose. Aaron said they aren't the "kind of in-itself that has a wedding date."

  3.  **Drafting Strategy - Section by Section:**

      *   **Opening:** Acknowledge the awkwardness. Establish the friendship. Make the "philosophy vs. toast" tension immediate and funny.
      *   **The "Bad Faith" Trap:** Address the elephant in the room. Why a normal toast doesn't work for Aaron. Validate his intellect while gently pivoting.
      *   **The Jess Factor:** How she fits in. She's the vet (facticity/groundedness) to his philosopher (transcendence/abstraction).
      *   **The Philosophical Pivot (The Core):** Reframe the marriage not as "fate" but as a *radical, repeated choice*. This honors "existence precedes essence."
      *   **The "Capture" Paradox:** Address the desire for permanence without calling it a prison. Frame it as a shared project.
      *   **The "In-Itself" Callback:** Bring back the Thanksgiving joke but resolve it.
      *   **Closing:** A clear toast to the couple.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm the best man. Aaron hates love songs. He says they are bad faith. He said marriage is pretending you have no choice. But here he is. Jess is a vet. She deals with real animals, not abstract ones. Aaron said they weren't an "in-itself." Well, now they are. Love is choosing someone every day. That's real freedom. So raise a glass to Aaron and Jess choosing each other.

      *Critique 1:* Too dry. Needs more novelist flair. Needs to hit the specific philosophical points requested (facticity, the capture paradox). Needs to be funnier.

  5.  **Drafting - Iteration 2 (Adding Flavor & Philosophy):**
      Start with the difficulty of writing this. "Harder than a novel." Mention the Sartre dissertation. Address the "meant to be" trope. Explain that for Aaron, saying "it was fate" is a lie. So, what is this? It's a commitment to freedom. Jess wants to be captured? No, she wants him to choose her. The "in-itself" joke needs to land. "You are no longer just an in-itself, you're a married in-itself." No, that's clunky. "You have created your essence."

      *Critique 2:* Getting closer. Need to ensure the family understands the emotion even if they miss the Sartre terms. The "vet" angle is good for grounding the abstract philosophy.

  6.  **Drafting - Iteration 3 (Refining the Voice):**
      *Voice:* Witty, affectionate, slightly self-deprecating novelist.
      *Key Line:* "Existence precedes essence" -> "You don't find the marriage, you build it."
      *Key Line:* "The Look" -> "Being seen."
      *Key Line:* "In-itself" -> "Rock solid."

      *(Self-Correction during drafting)*: Make sure I don't lecture. Keep the philosophy as metaphors. Ensure the "unstable by design" bit sounds romantic, not terrifying. The trick is: *Knowing* it's unstable makes the choice to stay more meaningful.

  7.  **Final Polish (Checking Constraints):**
      *   *Time:* Read aloud to check length. (Aim for ~600 words).
      *   *Philosophy Check:* Bad faith? Yes. Facticity/Transcendence? Yes. Existence/Essence? Yes. In-itself callback? Yes. Love/Capture paradox? Yes.
      *   *Audience Check:* If you remove "Sartre," does it still make sense? Yes, it becomes about choice vs. fate.
      *   *Tone:* Funny but warm.

  8.  **Writing the Toast (incorporating the above):**
      *   *Intro:* Novelist struggling with writer's block.
      *   *Body:* Aaron's history of rejecting romance tropes. Jess's patience.
      *   *Philosophical Turn:* Reframing commitment as an act of freedom, not a loss of it.
      *   *The "Capture":* Acknowledging the risk, but choosing it anyway.
      *   *Conclusion:* The "In-Itself" payoff.

      *(Drafting specific lines)*: "Aaron spent 15 years telling us that saying 'I knew she was the one' is a lie you tell yourself to avoid the terror of free will." -> "Jess didn't try to change his mind. She just waited for him to authenticate his commitment." -> "Love isn't finding your other half, it's building a world together." -> "You aren't a rock. You're a verb." -> "To the happy couple."

      *Refining the "Capture" bit:* "He once told me that wanting to be loved is wanting someone to freely choose to be trapped by you. It's a paradox. But looking at them, it's not a trap. It's a pact."

      *Refining the "In-Itself" bit:* "He said they weren't the kind of in-itself that has a wedding date. Tonight, you become something new. Not a rock, but a foundation."

      *Let's assemble.* (Proceeds to generate output based on this thought process).

  9.  **Final Review against constraints:**
      *   4 minutes? (Word count looks good, approx 650 words).
      *   Funnier than solemn? (Yes, jokes about Thanksgiving and vet work).
      *   Philosophy accurate? (Yes, uses terms correctly but accessibly).
      *   Works without philosophy? (Yes, translates to "choice" and "commitment").

      *Wait, one check on the "In-Itself" line.* Aaron said: "we're not the kind of in-itself that has a wedding date." The toast needs to hand that back.
      *Idea:* "Aaron, for fifteen years you told us you weren't the kind of *in-itself* that has a wedding date. But tonight, you've proven something better. You aren't an *in-itself*. You're a *for-itself* that chooses, every day, to be exactly where you are." -> Maybe too technical.
      *Better:* "You said you weren't the kind of 'in-itself' that has a wedding date. And you're right. An 'in-itself' is a rock. Rocks don't choose. But you two? You aren't rocks. You're the choice."

      *Let's go with the "Facticity" angle for the ending.* "You have your facticity. You have your history. But your essence is what you make tomorrow."

      *Okay, ready to write.*
answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I'm a novelist, which means I make my living arranging words until they make people feel things. And I am telling you, writing this toast has been harder than writing my last three books combined.

  Usually, my job is to make a scene land. But when your best friend is a Sartre scholar who has spent fifteen years arguing that "happily ever after" is just a fairy tale we tell ourselves to avoid the anxiety of radical freedom, the standard tropes are off the table.

  I can't say Aaron "knew from the moment he saw her." Because to Aaron, that's bad faith. That's pretending your choice was actually fate, so you never have to own the risk of it. I can't say they were "meant to be." Because existence precedes essence. There is no script. There is only the act of living it.

  For fifteen years, every Thanksgiving, when asked about wedding plans, Aaron's stock answer was: "We're not the kind of *in-itself* that has a wedding date."

  It was a great line. It killed at parties. It also drove Jess's family crazy.

  Jess, you are a large-animal vet. You deal in facticity. You deal with things that are real, heavy, and sometimes kick you in the shins. You deal with the world as it *is*, not as we wish it to be. And somehow, you managed to date a man who believes the world is primarily a construct of consciousness, without ever hitting him with a tranquilizer dart.

  Aaron, you once wrote a dissertation arguing that wanting to be loved is inherently unstable. You said it's wanting someone to freely choose to be captured by you forever. You called it a paradox. You said it was designed to fail.

  But looking at you two tonight, I don't see a paradox. I see a pact.

  Because here is the thing your philosophy missed, my friend: Yes, love is a risk. Yes, there is no guarantee. But that isn't a bug in the system; it's the feature. If Jess were forced to love you by gravity or fate or biology, it wouldn't mean anything. It means everything *because* she could leave. Every single day, she possesses the radical freedom to walk away. And every single day, she chooses to stay.

  That isn't self-deception. That is the most authentic thing a human being can do.

  You taught me that we define ourselves through our actions. Well, look at your actions. You didn't find a marriage waiting for you in the universe. You built one. You took your facticity—your history, your quirks, your stubbornness—and you used your transcendence to build a future.

  So, Aaron, for fifteen years you told us you weren't the kind of *in-itself* that has a wedding date. And you were right. An *in-itself* is a rock. A rock is solid, but it doesn't choose. It just sits there.

  You two aren't rocks. You're not a fixed object. You are a continuous verb. You are the act of choosing each other, over and over, in the face of a universe that offers no guarantees.

  So, if everyone could please raise a glass.

  To Jess and Aaron. May you never pretend this was easy. May you never pretend this was fate. And may you continue to freely, terrifyingly, and joyfully choose each other, every single day.

  To the happy couple.
