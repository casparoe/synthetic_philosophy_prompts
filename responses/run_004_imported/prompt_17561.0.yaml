prompt: |-
  Ok so this is gonna sound random but hear me out: my book club's pick last month was one of those big popular evolutionary psychology books (the kind with chapters explaining why men supposedly get more upset about physical infidelity and women about emotional infidelity, why certain foods disgust us, stuff like that, all framed as "this is what natural selection specifically built into us"). At the discussion my friend who has a PhD in ecology got kind of heated and said the whole book was basically a pile of "just-so stories" and that we should all go read the old Gould and Lewontin spandrels paper before believing any of it. I'd never heard of it so afterwards I looked into it a bit — I get the basic architecture analogy (the triangular spandrel spaces under the dome in St Mark's in Venice weren't put there because someone wanted mosaic space, they're just an unavoidable side effect of resting a round dome on rounded arches, and only afterwards got filled in with decoration), and I get that Gould and Lewontin were using this to argue biologists are too "Panglossian" — too quick to assume every single trait, like the human chin or male nipples, must be an adaptation that selection built for its current use, rather than possibly being a side effect of something else entirely (a developmental constraint, or a byproduct of a trait selected for in the other sex, etc).

  What I don't have a good handle on is how much weight this critique should actually carry against a book like the one we read, versus it being kind of an old methodological point that modern evolutionary psychologists already know about and have some answer for. Could you go through what you think are the most important implications of the Gould-Lewontin spandrels critique for how someone like me, with zero biology background, should actually evaluate claims in pop evolutionary psychology — basically, what are the real questions I should be asking when a chapter says "trait/behavior X is an adaptation for Y", so that next time I've got something more useful to bring to the discussion then just going "well, isn't that maybe just a spandrel" at every chapter?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user read a popular evolutionary psychology (EP) book for a book club. A friend with a PhD in ecology criticized it heavily using the Gould & Lewontin "Spandrels of San Marco" critique (1979).
      *   **User's Understanding:** The user grasps the basic analogy (spandrels = architectural byproducts, not designed features) and the core argument (biologists are too "Panglossian," assuming every trait is an optimal adaptation).
      *   **User's Goal:** They want to know how much weight this critique carries *today* against modern pop EP books. Is it an outdated point that EP has solved, or is it still a vital critical tool? They want specific questions/criteria to evaluate EP claims in the future, without just shouting "spandrel!" at everything.
      *   **Tone:** Intellectual, nuanced, accessible (zero biology background), balanced (not dismissing EP entirely, but acknowledging the validity of the critique).

  2.  **Deconstruct the Core Conflict:**
      *   **Evolutionary Psychology (Pop Version):** Often presents adaptive stories as facts. Focuses on universal human nature, often regarding sex differences, fear responses, food preferences, etc. Tends to assume current utility = original adaptive function.
      *   **Gould & Lewontin (1979):** Criticized "adaptationism." Argued that traits can be byproducts (spandrels), results of genetic drift, or developmental constraints. Warned against "just-so stories" (narratives that sound plausible but lack evidence).
      *   **Current State of the Field:** Evolutionary biologists *do* take the critique seriously. Rigorous EP exists, but pop EP often lags behind. The critique is not "old news" in the sense that it's solved; it's a foundational methodological warning that is often ignored in popularization.

  3.  **Determine the "Weight" of the Critique:**
      *   Is it outdated? No. It's a cornerstone of evolutionary theory now.
      *   Do modern EPs know about it? Yes, academic ones do. Pop authors? Sometimes they gloss over it to make a better story.
      *   Does it invalidate EP? No, but it invalidates *bad* EP (adaptationism without evidence).
      *   *Key Takeaway:* The critique shifts the burden of proof. It's not enough to say "this *could* be adaptive." You have to show it *is* and rule out alternatives.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Validate the user's understanding. Acknowledge the friend's point is valid and still relevant. Set the stage: It's not about killing EP, but raising the standard of evidence.
      *   **The Current Status of the Critique:** Address the "is this old news?" question.
          *   It's not outdated; it's foundational.
          *   Academic EP has integrated it (mostly), but Pop EP often hasn't.
          *   The "Just-So Story" problem is still rampant in popular science.
      *   **Key Implications for the Reader (The "Toolkit"):** This is the meat of the answer. I need to give the user specific questions to ask.
          *   *Question 1: Evidence of Heritability/Genetic Basis.* (Is it even evolvable?)
          *   *Question 2: Alternative Hypotheses.* (Did the author consider spandrels, drift, constraint?)
          *   *Question 3: Mismatch Theory.* (Is the trait adaptive *now* or was it adaptive *then*? Pop EP often confuses the two.)
          *   *Question 4: Comparative Evidence.* (Do other primates do this? Is it universal?)
          *   *Question 5: The "Reverse Engineering" Trap.* (Starting with the behavior and inventing a problem, rather than finding a problem and seeing how it was solved.)
      *   **Nuance/Balance:** Don't let the user think *all* EP is nonsense. Some things *are* adaptations (e.g., fear of snakes, sugar craving). The issue is the *certainty* and the *specificity* of the claims (especially regarding complex social behaviors).
      *   **Specific Example (Infidelity):** The user mentioned the male/female infidelity thing. This is a classic EP claim (Parental Investment Theory). I should briefly address how a spandrel critique applies there (e.g., cultural norms, social structures vs. hardwired modules).
      *   **Conclusion:** Summarize the stance. Be a skeptical consumer, not a denier.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't sound like I'm bashing EP entirely. Evolutionary theory is robust. The issue is *Adaptationism* (the assumption that everything is an adaptation).
      *   *Clarification:* Make sure to distinguish between "Evolutionary Psychology" (the academic field) and "Pop Evolutionary Psychology" (the book club pick). The friend was likely criticizing the latter.
      *   *Analogy Check:* The user understands the spandrel analogy. I can use it to explain "exaptation" (traits co-opted for new uses) as well.
      *   *Tone Check:* Keep it conversational but authoritative. The user is smart but lacks biology background. Avoid jargon where possible, or define it (e.g., "phylogenetic," "heritability").

  6.  **Final Polish:**
