answer: |-
  This is a fantastic question, and your friend with the PhD gave you excellent advice. To answer your core concern directly: **No, the Gould and Lewontin critique is not outdated.** In fact, it is considered one of the most important methodological papers in the history of evolutionary biology.

  While academic evolutionary biologists and rigorous evolutionary psychologists have largely integrated these warnings into their work, **popular evolutionary psychology books often lag behind.** They tend to sell certainty and neat narratives, whereas the science is actually messy and probabilistic.

  Here is a breakdown of how much weight the critique carries today, followed by a practical toolkit of questions you can use to evaluate future claims without needing a biology degree.

  ### 1. Is the "Spandrels" Critique Old News?
  In academic circles, the 1979 paper is foundational. It forced the field to move from "Adaptationism" (assuming everything is an adaptation) to "Evolutionary Analysis" (testing *if* something is an adaptation).

  However, in **pop science**, the critique is often ignored. Authors know that "This behavior is a complex byproduct of developmental constraints and cultural feedback loops" doesn't sell books. "This behavior is a stone-age survival module hardwired into your brain" does.

  So, when you read a pop EP book, you are often encountering a version of the field that exists in a time capsule from *before* Gould and Lewontin forced everyone to tighten their standards. Your friend wasn't being pedantic; they were pointing out that the book was likely skipping the hardest part of the science: **ruling out alternative explanations.**

  ### 2. The Toolkit: 5 Questions to Ask Instead of "Is it a Spandrel?"
  You are right that shouting "That's a spandrel!" at every chapter is unhelpful. Most traits are a mix of adaptation, byproduct, and constraint. Instead, use these five questions to gauge the strength of the author's argument.

  #### Question 1: Did they start with the problem or the trait?
  *   **The Trap:** The author observes a trait (e.g., "men like visual pornography") and then invents a problem it solves ("therefore, men evolved a visual mating module"). This is "reverse engineering" without a blueprint.
  *   **The Better Approach:** The author identifies an ancestral problem (e.g., "identifying fertile mates was difficult") and predicts what kind of cognitive mechanism would solve it, *then* checks if humans have that mechanism.
  *   **What to ask:** *Did the author invent a story to fit the behavior, or did they predict the behavior based on an evolutionary pressure?*

  #### Question 2: Have they ruled out the "Byproduct" hypothesis?
  *   **The Trap:** Assuming that because a trait is useful *now*, it was selected *for* that use. (This is the Spandrel argument). For example, the ability to read is useful, but we didn't evolve "reading genes." We evolved pattern recognition and language, and reading is a cultural byproduct (a spandrel) of those traits.
  *   **The Better Approach:** Acknowledging that a behavior might be a side effect of a larger brain, social learning, or a trait selected for in a different context (exaptation).
  *   **What to ask:** *Could this behavior just be a side effect of having a large brain or complex culture, rather than a specific module built for this one thing?*

  #### Question 3: Is there evidence of heritability and variation?
  *   **The Trap:** Talking about "humans" as a monolith. Natural selection requires variation. If every single human does X exactly the same way, it might be a developmental constraint (like having five fingers) rather than a flexible adaptation. If no one varies in the trait, selection can't act on it.
  *   **The Better Approach:** Showing that the trait varies between individuals, that the variation is partly genetic, and that the variation correlates with reproductive success (in ancestral environments).
  *   **What to ask:** *Does the author acknowledge that not everyone does this? If it's universal, how do they know it's not just a basic physiological constraint (like needing sleep)?*

  #### Question 4: What about the "Mismatch" Theory?
  *   **The Trap:** Assuming a behavior is adaptive *today*. Evolutionary psychology argues that our brains are adapted to the **Environment of Evolutionary Adaptedness (EEA)** (roughly the Pleistocene), not the modern world.
  *   **The Better Approach:** Explaining why a trait might be *maladaptive* now. For example, we crave sugar because it was rare and valuable then; now it kills us.
  *   **What to ask:** *Is the author claiming this behavior is good for us now, or are they explaining why we have a stone-age brain in a modern world?* (If they claim it's currently optimal, be skeptical).

  #### Question 5: Is the "Just-So Story" testable?
  *   **The Trap:** The story is unfalsifiable. "Men cheat because they want to spread genes." If a man *doesn't* cheat, the author says, "He is using a alternative strategy to ensure paternity." If he *does* cheat, "He is spreading genes." If every outcome fits the theory, the theory explains nothing.
  *   **The Better Approach:** Making specific predictions that could prove the theory wrong.
  *   **What to ask:** *What evidence would convince the author they are wrong? If the answer is "nothing," it's a just-so story.*

  ### 3. Applying this to your Book Club Example
  Let's look at the specific claim you mentioned: *Men are more upset by sexual infidelity; women by emotional infidelity.*

  *   **The Pop EP Claim:** Men risk cuckoldry (raising another man's baby), so they evolved a "sexual jealousy module." Women risk loss of resources, so they evolved an "emotional jealousy module."
  *   **The Gould/Lewontin Critique:**
      1.  **Alternative Hypothesis:** In many cultures, sexual and emotional infidelity are inextricably linked. If you love someone, you have sex with them. The distinction might be cultural, not biological.
      2.  **Byproduct:** Jealousy might be a general response to threat of abandonment, not two distinct modules.
      3.  **Data:** Studies show that when you measure physiological arousal (sweat, heart rate) rather than self-reporting, the sex differences often shrink or disappear.
      4.  **Variation:** There is massive variation among men and women. A theory that relies on "all men are X" is biologically suspicious.

  **How to discuss this:** Instead of saying "That's a spandrel," you could say: *"The book presents this as a fixed module, but does it account for the possibility that sexual and emotional infidelity were so correlated in our ancestry that we didn't need separate modules? Or that cultural norms about ownership and fidelity are driving the self-reporting data?"*

  ### 4. Summary: How much weight should the critique carry?
  It should carry **heavy** weight, but not **total** weight.

  *   **Don't** use it to say "Adaptations don't exist." (Fear of snakes, craving fat/salt, and language acquisition *are* likely adaptations).
  *   **Do** use it to demand evidence. The burden of proof is on the person claiming a trait is an adaptation, not on the skeptic to prove it isn't.

  Your friend recommended the Gould and Lewontin paper because it teaches **intellectual humility.** It reminds us that nature is a tinkerer, not an engineer. It builds on what's available, makes mistakes, leaves scaffolding behind, and creates beautiful accidents (spandrels) that look designed but aren't.

  **For your next book club:** If you want to be the person who bridges the gap, acknowledge that evolutionary pressures are real, but insist that **plausibility is not proof.** A story can make perfect sense and still be wrong. The best evolutionary science is the kind that actively tries to disprove its own adaptationist hypotheses. If the book isn't doing that, your friend is right: it's entertainment, not science.
