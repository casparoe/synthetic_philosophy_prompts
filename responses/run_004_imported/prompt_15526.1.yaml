      *   **Task:** Draft 8-10 interview questions.
      *   **Constraints:**
          *   Go beyond restating conclusions.
          *   Must include specific questions on:
              1.  Money neutrality (long run) vs. industry stimulation (short run interval).
              2.  Specie redistribution mechanism vs. mercantilist hoarding.
              3.  Quantity of money vs. commerce/profit rates governing interest.
          *   Each question needs a sharp follow-up keyed to the *most likely* answer.

  2.  **Deconstruct the Specific Required Questions:**

      *   *Requirement 1: Money Neutrality vs. Short-Run Stimulation.*
          *   *Concept:* Hume's quantity theory of money says prices rise proportionally with money supply (neutrality). But he also says increasing money supply wakes up industry *before* prices rise.
          *   *Tension:* How can it be neutral if it has real effects? Is the "interval" a glitch or a feature?
          *   *Likely Answer:* She will argue the "interval" is the crucial policy window where money acts as a lubricant before inflation hits.
          *   *Follow-up:* Press on the predictability of this interval. If it's unpredictable, is the policy dangerous?

      *   *Requirement 2: Specie Redistribution vs. Mercantilism.*
          *   *Concept:* Price-Specie-Flow Mechanism. If a country hoards gold, prices rise, exports fall, gold leaves.
          *   *Tension:* Why is policy intervention useless/harmful?
          *   *Likely Answer:* She will emphasize the automatic equilibrium nature of the mechanism.
          *   *Follow-up:* Ask about the timescale. If the adjustment is slow, doesn't that leave room for short-term mercantilist gain?

      *   *Requirement 3: Interest Rates.*
          *   *Concept:* Hume argues interest rates depend on real factors (supply/demand of loanable funds, profit rates), not the amount of gold/silver.
          *   *Tension:* Common sense suggests more money = cheaper borrowing. Hume says no.
          *   *Likely Answer:* She will distinguish between nominal value and real scarcity of capital.
          *   *Follow-up:* How does this square with modern monetary policy (QE) which seems to affect rates? (Or keep it historical: How does this anticipate classical economics?) Let's stick closer to Hume's internal logic for the follow-up to maintain philosophical focus. Let's ask about the psychological vs. mechanical link.

  3.  **Drafting the Remaining Questions (to reach 8-10):**
