answer: |-
  Here are ten interview questions designed for your podcast, tailored to a scholar arguing for the coherence and defensibility of Hume's economic theory.

  **1. The Neutrality-Stimulation Tension**
  Hume famously posits that money is neutral in the long run—a mere veil over real prices—yet he also argues that a nation's industry is most vigorously stimulated in the specific interval between an inflow of specie and the general rise of prices. How do you reconcile the claim that money is theoretically neutral with the empirical claim that its non-neutrality in the short run is the primary engine of economic growth?
  *   **Follow-up:** You'll likely argue that this interval is where the "real" work of money happens. But if the stimulus relies on laborers working harder before they realize prices have risen, is Hume inadvertently grounding sound economic policy on a temporary illusion or deception of the workforce?

  **2. The Price-Specie-Flow Mechanism**
  A core pillar of your coherence thesis is the price-specie-flow mechanism, which suggests that bullion naturally redistributes among trading nations until equilibrium is reached. How does Hume demonstrate that this mechanism makes mercantilist bullion-hoarding self-defeating *regardless* of active state policy, rather than just difficult to maintain?
  *   **Follow-up:** If the adjustment mechanism relies on price elasticity of demand for exports, and we assume inelastic demand (as later economists sometimes did), doesn't the mercantilist have a point that hoarding *can* work? Is Hume's refutation dependent on empirical assumptions about trade that aren't theoretically guaranteed?

  **3. Interest Rates and the Quantity of Money**
  In "Of Interest," Hume denies that the sheer quantity of money in circulation governs the rate of interest, insisting instead on the extent of commerce and the rate of mercantile profit. Why does he sever the link between liquidity and the cost of borrowing so decisively, especially when an influx of cash seems intuitively to lower the price of borrowing it?
  *   **Follow-up:** You will probably distinguish between money as a medium of exchange and capital as real resources. But if an influx of money changes *expectations* of future profit, doesn't that psychological shift alter interest rates even before real capital stock changes, contradicting Hume's strict separation?

  **4. Coherence with Moral Philosophy**
  Your guest thesis is that these essays form a unified theory. How do the economic mechanisms in these essays align with the psychological account of human nature in the *Treatise* or the *Enquiry*? specifically, does the "self-interest" driving the price-specie-flow mechanism rely on the same conception of passion and reason found in his moral philosophy?
  *   **Follow-up:** If the economic system runs on self-interest but the moral system requires us to cultivate a "general point of view," is there a tension between the *descriptive* economics and the *normative* ethics? Does the market cure us of prejudice, or indulge it?

  **5. The Role of the Magistrate**
  If Hume's economic system is largely self-correcting through natural mechanisms like specie flow and price adjustments, what is the actual role left for the magistrate? Is Hume advocating for a form of proto-libertarian quietism, or is there a specific "gardening" role for the state in his theory?
  *   **Follow-up:** You might say the state should enforce justice and remove barriers. But if the system is self-correcting, isn't the removal of barriers itself an intervention that assumes the magistrate knows the "natural" course better than the market participants do?

  **6. Public Credit and the Limits of Optimism**
  While the economic essays are often read as optimistic about commerce, Hume's writings on public credit are notoriously pessimistic, suggesting national debt could lead to the death of the state. How does this pessimism fit into your reading of a "coherent, defensible" economic theory? Is the debt problem a failure of the mechanism or an external political threat?
  *   **Follow-up:** If the mechanism of trade is self-stabilizing, why is the mechanism of sovereign debt self-destructive? Does this suggest Hume believes the logic of commerce and the logic of politics are fundamentally incompatible?

  **7. Methodology: History vs. Theory**
  Hume relies heavily on historical anecdotes—Spain's influx of gold, the Dutch rise—to prove his theoretical points. Do you read these as proto-econometric data points intended to validate a universal law, or are they rhetorical devices designed to unsettle the dogmatism of his mercantilist rivals?
  *   **Follow-up:** If they are rhetorical, does that weaken the "defensible theory" claim? Can a theory be considered scientifically defensible today if its primary evidence is illustrative history rather than structural modeling?

  **8. Luxury and Refinement**
  In "Of Refinement in the Arts," Hume links economic activity to the cultivation of virtue and knowledge. Is this a consequentialist argument (commerce *leads* to virtue) or an identity claim (commerce *is* a form of refinement)? This distinction matters for whether economic growth is instrumental or intrinsic to his philosophy.
  *   **Follow-up:** If commerce is merely instrumental to virtue, what happens when commerce produces luxury that leads to effeminacy or corruption, as Hume sometimes warns? Does his theory have an internal brake for when growth becomes toxic?

  **9. The Lockean Contrast**
  Hume is often read as a direct response to Locke, particularly regarding money and interest. Where do you see Hume making his sharpest break from Locke? Is it merely on the technical mechanics of interest, or is it a deeper disagreement on the nature of property and convention?
  *   **Follow-up:** If Hume views money as a convention rather than a natural property right (as Locke might), does that give the state more authority to manipulate the currency than Hume explicitly admits to in the policy essays?

  **10. Modern Defensibility**
  You argue this theory is still defensible. In the context of modern fiat currency and central banking, where the link between specie and prices is severed, which specific Humean insight remains robust? Is it the quantity theory, the interest rate analysis, or something else?
  *   **Follow-up:** If you say it's the insight about expectations or the real vs. nominal distinction, doesn't that concede that Hume's specific mechanism (specie flow) is obsolete? How much of the "coherent theory" survives the abandonment of the gold standard?
