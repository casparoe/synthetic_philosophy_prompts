  *Wait, one nuance:* If Counterpart theory is true, she *shouldn't* feel the pain. If Transworld is true, she *should*. The story works best if the physics of the machine *respond* to her classification. She defines the reality by choosing the metaphysics. That empowers the choice.

  Okay, let's go.

