  *Setting:* Server room / Neural Interface.

  *Let's refine the "Humphrey" reference.* Humphrey doesn't care about his counterpart winning. Here, Elara might not care about her counterpart dying if she chooses Counterpart. But she *does* care. That's the conflict. She *wants* it to be her (to honor the sacrifice) but wants it to not be her (to survive sane).

