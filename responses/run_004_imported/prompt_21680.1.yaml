answer: |-
  The cursor blinked against the black terminal, a steady rhythmic pulse like a resting heart rate. `INITIATE FORK? [Y/N]`

  Elara's finger hovered over the key. Outside the server room, the grid was collapsing. The cascade failure wasn't just code; it was bleeding into the infrastructure, shutting down life support in Sector 4. The only way to stabilize the core was to introduce a human heuristic directly into the stream. A mind had to go in to hold the breach open while the patch applied.

  The problem was the load. No single human neural architecture could withstand the corruption and remain intact.

  The solution was the Fork.

  It wasn't cloning. Cloning made a copy that started fresh. The Fork split the current state, the memories, the fears, the exact neural weighting of *now*, into two divergent threads. Thread A stays here. Thread B goes into the breach.

  Thread B would not come out.

  Elara typed `Y`.

  The sensation wasn't pain; it was a sudden, vertiginous stretch, like being pulled through a keyhole. For a second, she was everywhere—the cool air of the server room, the burning static of the data stream. Then, the snap.

  She was sitting in the chair. She was also screaming in the dark.

  "Elara Alpha," she said, her voice steady in the room.
  "Elara Beta," the other voice crackled over the internal comms, strained, dissolving into noise. "I'm... I'm at the breach. It's hot. It feels like burning."

  Alpha watched the monitors. Beta's vitals were spiking red. The corruption was attacking the neural link.

  "Hold the line, Beta," Alpha said. "Patch applies in T-minus two minutes."

  "I know," Beta gasped. The audio feed wet with something that wasn't quite blood. "Alpha... when this ends. When I go under. What happens to me?"

  Alpha froze. The console flashed a new prompt. `THREAD TERMINATION IMMINENT. CLASSIFY RELATIONSHIP FOR ARCHIVE.`

  Two options blinked below.
  `OPTION 1: NUMERIC IDENTITY (SELF)`
  `OPTION 2: COUNTERPART (DISTINCT ENTITY)`

  "If you mark me as Self," Beta whispered, her voice fracturing into digital artifacts, "you feel it. The system merges the death state. You don't just watch me die. You die with me. Part of you stops."

  "And if you mark me as Counterpart?" Alpha asked, her hand trembling over the haptic interface.

  "Then I'm just... a copy. A similar thing. You watch a stranger die. You keep walking." Beta coughed, a sound like grinding gears. "My husband... he's waiting for me. If I'm just a counterpart, he doesn't lose a wife. He loses a substitute. You keep him. I lose him."

  Alpha looked at the wedding band on her left hand. It felt heavy. In the stream, Beta's hand was dissolving into code.

  This was the crux. The engineers who built the Fork argued about this for decades. If Beta was numerically identical to Alpha, then sacrificing Beta was suicide. It was moral, because the survival of the whole justified the loss of the part, but the survivor would carry the wound of the death as their own. The grief would be absolute, because the person grieving and the person dying were the same number.

  If Beta was a counterpart, distinct but similar, then Alpha was sending a colleague to die. She could mourn, certainly. She could honor Beta. But she wouldn't *feel* the cessation of existence. She would remain whole. Beta's death would be a tragedy that happened *to* her, not *in* her.

  "Thirty seconds," Alpha said.

  "It hurts, Elara," Beta said. The use of the name without the suffix sent a shiver through Alpha. "I don't want to be a copy. I want it to matter. But I don't want you to break."

  The monitors showed the patch loading. 90%. The corruption was surging, trying to push Beta out. Beta was holding it back with sheer will, but her neural integrity was dropping. 10%. 5%.

  If Alpha chose `NUMERIC IDENTITY`, the system would enforce the truth of unity. The moment Beta flatlined, Alpha's brain would register the event as a personal death. She would wake up tomorrow knowing exactly what it felt like to cease existing. She would carry the hole where Beta used to be as if it were her own missing limb.

  If Alpha chose `COUNTERPART`, the system would enforce separation. Beta's death would be archived as external data. Alpha would remember it like a movie she watched. She would be safe. She would be sane. She would be able to go home to her husband and not see the ghost of the woman who died in the machine in her own reflection.

  "Ten seconds," Alpha said. Her throat was tight.

  "Choose," Beta said. Her voice was calm now. "Please. Don't make me a ghost."

  The prompt pulsed. `CLASSIFY RELATIONSHIP.`

  Alpha thought about Humphrey. She didn't know why the name popped into her head, a fragment from a philosophy elective years ago. Humphrey won an election in another world, but it didn't matter here. If Beta was just a counterpart, her sacrifice was just a similar event happening to someone else. It was cold comfort. It made the sacrifice cheap. If Beta wasn't her, then Elara didn't save the world. Elara watched someone else save the world.

  But if Beta *was* her, then Elara was walking away from her own grave.

  "Patch applied," the system chimed. "Stabilizing."

  Beta's vitals flatlined. The scream in the comms cut off instantly, replaced by silence.

  Alpha sat in the quiet server room. The cursor blinked. `CLASSIFY RELATIONSHIP.`

  She looked at her hands. They were shaking. She could feel a phantom burn on her skin, a ghost of the heat Beta had described. Was it empathy? Or was it memory?

  If she clicked `COUNTERPART`, the phantom burn would fade. She would be clean. She would be the survivor who made the hard call.

  If she clicked `NUMERIC IDENTITY`, the burn would stay. She would carry the scar. She would be the survivor who died and lived.

  She thought of her husband waiting at home. If she chose Identity, she would come home damaged, carrying the weight of a death that was hers. He would have to love a woman who knew what it felt to end. If she chose Counterpart, she would come home whole, but she would be lying. She would be living a life bought with a lie that the woman who paid for it was a stranger.

  The silence stretched. The system waited for her to define reality.

  Elara closed her eyes. She didn't want to be safe. She wanted the debt to be real.

  She moved the cursor to `NUMERIC IDENTITY (SELF)`.

  She clicked.

  The pain hit her not as a shock, but as a sudden, hollow absence. It was a specific memory of stopping, of lights going out, of a thought unfinished. It slammed into her chest, a heavy, cold stone settling in her gut. She gasped, clutching the armrest.

  For a moment, she wasn't sure who was breathing. Then she realized it was her. Just her. But the "her" was wider now, stretched thin over a grave.

  She stood up, legs unsteady. She walked to the console and typed the closure command. `THREAD MERGED. STATUS: COMPLETE.`

  She looked at her reflection in the dark monitor. She looked the same. But she knew, with a terrifying certainty, that she was walking away from a corpse that was also hers. She touched the wedding band. It felt different now. He wasn't waiting for the woman who sat in the chair. He was waiting for the woman who died in the breach, too.

  Elara turned off the terminal. The room was dark, but she didn't turn on the lights. She needed to feel the weight of the shadow. She needed to know that when she walked out of here, she wasn't just carrying the memory of a sacrifice. She was carrying the bill.

  She opened the door and stepped into the hallway, breathing in the cool air, alive and dead, finally one thing.
