answer: |-
  This is an excellent question that cuts to the heart of the philosophy of biology. You are not missing something obvious; rather, you are encountering one of the most famous debates in the field. However, the reconciliation lies in three key areas: Popper's own later retraction, the modern definition of "fitness," and the actual practice of falsification in evolutionary biology.

  Here is how you can reconcile Popper's early claims with your professor's confidence.

  ### 1. Popper Changed His Mind
  The most direct answer is that Karl Popper explicitly recanted his earlier position.

  In the 1950s and 60s, Popper did indeed characterize Darwinism as a "metaphysical research programme" because he felt the phrase "survival of the fittest" was tautological (i.e., *Who survives? The fittest. Who are the fittest? Those who survive.*). If a statement is true by definition, it cannot be falsified by observation.

  However, in a 1978 lecture titled *"Natural Selection and the Emergence of Mind,"* Popper publicly revised his view. He stated:

  > "I have changed my mind about the testability and logical status of the theory of natural selection; and I am glad to have an opportunity to make a recantation."

  Popper came to acknowledge that while the *general principle* might look metaphysical, the theory generates specific, testable models. Therefore, by Popper's *later* standard, evolutionary biology is firmly scientific.

  ### 2. The "Tautology" Objection Was Resolved by Biologists
  The charge of tautology relies on a specific, circular definition of fitness. Contemporary evolutionary biology does not define fitness simply as "survival."

  *   **Propensity Interpretation:** Modern biology defines fitness as a **probabilistic propensity** to survive and reproduce based on specific, measurable traits in a specific environment.
  *   **Independent Measurement:** We can measure an organism's traits (e.g., beak depth, metabolic efficiency, camouflage) and the environmental pressures *before* selection occurs. We can then predict which traits should increase in frequency.
  *   **Falsification:** If organisms with traits theoretically deemed "advantageous" fail to reproduce more than those without them (controlling for drift), the hypothesis is falsified.

  Because fitness is tied to specific causal mechanisms (traits) rather than just the outcome (survival), the statement is no longer a tautology. It is an empirical claim about the relationship between phenotype and reproductive success.

  ### 3. Evolution is Falsifiable (Unlike Astrology)
  Your concern is that if evolution isn't falsifiable, it sits in the same epistemic bucket as astrology. However, evolutionary biology makes "risky predictions" that could easily prove it false. J.B.S. Haldane famously quipped that the theory of evolution could be disproven by finding **"fossil rabbits in the Precambrian."**

  Evolutionary biology is falsified constantly at the micro-level, and the theory stands because it survives these tests. Examples of falsifiable claims include:
  *   **Phylogenetics:** If genetic sequencing showed that humans were more closely related to fungi than to chimpanzees, the standard model of evolution would collapse.
  *   **Biogeography:** If we found marsupials native to Europe (outside of human introduction) alongside placental mammals in Australia in the same geological strata, it would contradict evolutionary history.
  *   **Observation:** If we observed a complex adaptation arise without any prior genetic variation or selective pressure, natural selection would be falsified as the mechanism.

  Astrology, by contrast, protects itself from falsification by using vague language and ad-hoc explanations that accommodate any outcome. Evolutionary biology does not do this; it stakes claims on specific patterns in nature.

  ### 4. "Metaphysical Research Programme" Wasn't an Insult
  Even when Popper called it a "metaphysical research programme," he was not equating it with pseudoscience. For Popper, metaphysical ideas could be rational and fruitful.

  *   **Science:** A theory that is currently being tested and is open to refutation.
  *   **Metaphysical Research Programme:** A framework that guides scientific inquiry and generates testable hypotheses, even if the core axiom isn't directly testable in isolation.

  Popper viewed Newtonian physics as having metaphysical underpinnings as well. The distinction he drew was between a programme that *encourages* testing (Evolution) and one that *evades* testing (Astrology/Marxism/Psychoanalysis, in his view). Evolutionary biology clearly falls into the former category.

  ### Summary for Your Seminar
  You can reconcile your professor's confidence with Popper's philosophy by noting that:

  1.  **Popper himself admitted he was wrong** about evolutionary theory being untestable.
  2.  **Fitness is not defined circularly** in modern biology; it is a measurable propensity based on traits.
  3.  **Evolution makes risky predictions** (fossil records, genetics) that are empirically tested, distinguishing it sharply from astrology.

  Your professor treats natural selection as rigorously confirmed science because, by the standards of modern philosophy of science (including Popper's later standards), **it is.** The "tautology" critique is historically important, but it is considered a resolved issue in the philosophy of biology.
