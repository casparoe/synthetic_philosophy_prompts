      *   *Dramatic implication:* The character should argue that the humans are trying to have it both ways (utility of AI, immunity from risk). Hume would say you can't separate the two.

  10. **Final Polish:** Check against the prompt's specific constraints (Hume's specific views on will, convention, sentiments). Ensure the distinction is clear between "AI promising" (impossible for Hume) and "Human bound by convention involving AI" (plausible).

