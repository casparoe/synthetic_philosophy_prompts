prompt: |-
  I'm on my school's ASB finance committee -- the group that splits our activities budget between clubs each semester. This year it's drama club vs. the new Civics Lab club: drama wants extra funding for a full spring musical, and Civics Lab wants that same money redirected into student-run town hall nights instead. Their president keeps quoting Rousseau's Letter to d'Alembert at us -- his whole argument that watching a play just makes you a passive spectator soaking up fake emotion in the dark, while a real civic festival (he's got this bit about literally planting a flower-covered stake in the town square and gathering everyone around it) actually turns citizens into participants instead of an audience. Half the commitee thinks that's honestly a fair point about what a school should be funding, the other half thinks its just some 260 year old guy being weird about actors. Can you draft the funding recommendation memo I'm bringing to Thursday's vote? It has to actually land on a side, not some wishy-washy split down the middle, and it needs to take the Rousseau point seriously instead of just waving it off as old-fashioned.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the ASB Finance Committee.
      *   **Task:** Draft a funding recommendation memo for the Thursday vote.
      *   **Conflict:** Drama Club (Spring Musical) vs. Civics Lab Club (Student-run Town Halls).
      *   **Key Argument:** Civics Lab President is quoting Rousseau's *Letter to d'Alembert* (spectatorship vs. participation, civic festivals vs. theater).
      *   **Constraint 1:** Must take a side (no wishy-washy splitting).
      *   **Constraint 2:** Must take the Rousseau argument seriously (not dismiss it as old-fashioned).
      *   **Audience:** ASB Committee, Student Body, Administration (implicitly).
      *   **Tone:** Professional, persuasive, thoughtful, decisive.

  2.  **Evaluate the Arguments:**
      *   **Drama Club:** Traditional, high visibility, builds community through shared emotional experience, develops artistic skills, high cost (sets, costumes, rights).
      *   **Civics Lab:** Innovative, aligns with school mission (citizenship), high engagement/participation, lower cost potentially, philosophical backing (Rousseau).
      *   **Rousseau's Point:** Theater creates passive spectators; civic festivals create active participants. In a school context, does "education" mean watching or doing?

  3.  **Determine the Stance:**
      *   *Option A (Fund Drama):* Harder to justify against Rousseau without dismissing him. Would need to argue that empathy gained from theater *is* active citizenship.
      *   *Option B (Fund Civics Lab):* Aligns better with the "active participation" model. Easier to take Rousseau seriously. Fits the "new club" energy and the specific philosophical challenge raised.
      *   *Decision:* Funding the Civics Lab is the more intellectually interesting path given the prompt's requirement to take Rousseau seriously. It allows for a memo that engages deeply with the philosophy while making a practical budget decision. It feels more like a "Finance Committee Recommendation" that weighs educational value.

      *Wait, let's reconsider.* If I fund Civics Lab entirely, Drama is dead. That might be too harsh. But the prompt says "no wishy-washy split down the middle." It implies a choice. However, a recommendation can prioritize one while acknowledging the other's value, *or* it can argue that one fulfills the *mission* better this year.
      *Actually, the strongest memo will likely recommend funding the Civics Lab proposal **over** the Drama proposal for this specific budget cycle, based on the criterion of "Active Student Engagement."* This directly addresses the Rousseau point.

      *Alternative:* Fund Drama but require structural changes to make it more participatory? No, that weakens the Rousseau engagement.
      *Alternative:* Fund Civics Lab. This leans into the prompt's unique detail about Rousseau. It makes the memo stand out.

      *Let's go with Funding Civics Lab.* It allows me to demonstrate the "taking Rousseau seriously" constraint most effectively. I can argue that while Drama is valuable, the *specific* budget constraint forces a choice based on the school's mission of creating active citizens, which aligns with the Rousseau critique.

      *Wait, a nuance:* Is it better to fund Drama *despite* Rousseau? Arguing that empathy *is* action? That's a strong counter-argument. But the prompt says "Half the committee thinks that's honestly a fair point... the other half thinks its just some 260 year old guy being weird." The user wants to take the point seriously. If I side with Drama, I have to refute Rousseau. If I side with Civics, I validate Rousseau. Validating Rousseau seems to fit the "take it seriously" instruction better than refuting him. Let's side with Civics Lab to show deep engagement with the philosophical argument.

      *Refinement:* Actually, a Finance Committee memo usually looks for *impact*. Civics Lab sounds like higher engagement per dollar. Let's go with **Funding Civics Lab**.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **Context:** Briefly outline the request (Drama vs. Civics).
      *   **Philosophical Framework (The Rousseau Factor):** This is the core constraint. I need to explain *why* we are considering this. It's not just "plays vs. meetings," it's "spectatorship vs. participation."
      *   **Analysis of Proposals:**
          *   Drama: High quality, but mostly passive audience (supporting Rousseau's critique).
          *   Civics: High participation, active citizenship.
      *   **Decision Rationale:** Why Civics wins *this semester*. Focus on the educational mission of active engagement.
      *   **Mitigation/Goodwill:** Acknowledge Drama's value so it doesn't look like a hit job. Maybe suggest they seek external sponsorship or scale down.
      *   **Conclusion:** Final vote recommendation.

  5.  **Refining the Tone:**
      *   Needs to sound like a student leader but professional.
      *   Avoid mocking Rousseau. Use terms like "civic agency," "participatory framework," "spectatorship."
      *   Ensure the decision feels decisive, not apologetic.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is siding against Drama too unpopular?
      *   *Fix:* Frame it as a "Semester Priority" rather than a permanent ban. Emphasize that the *budget constraint* forces a choice on *mission alignment*.
      *   *Critique:* Did I explain Rousseau enough?
      *   *Fix:* Explicitly mention the "flower-covered stake" analogy or the concept of the "festival" vs. "theater" to show I listened.
      *   *Critique:* Is it wishy-washy?
      *   *Fix:* Use strong verbs: "Recommend," "Prioritize," "Decline."

  7.  **Final Polish:** Check formatting. Ensure the Rousseau reference feels integrated, not tacked on. (e.g., "The Civics Lab proposal resonates with Rousseau's concept of the civic festival...")

      *(Self-Correction on Stance)*: Actually, looking at high school dynamics, killing the Spring Musical is *huge*. Is there a way to fund Civics Lab *and* acknowledge Drama without splitting the money 50/50? The prompt says "no wishy-washy split." It implies a binary choice on the *extra* funding. Okay, I will recommend the extra funding go to Civics Lab. I will frame it as an investment in a new pilot program that aligns with the specific philosophical challenge raised.

      *Wait, one more thought:* If I recommend Civics Lab, I need to make sure I don't sound like a philosophy major ignoring reality. I need to ground it in *student outcomes*. Active participation = better learning outcomes.

      *Let's write it.*

      **Structure:**
