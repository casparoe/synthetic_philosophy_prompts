      5.  Comparative Analysis.
      6.  Final Decision & Implementation.

      *(Drafting content)*: Make sure to quote the "spectator" vs "participant" distinction clearly.

  8.  **Final Review against constraints:**
      *   Take a side? Yes (Civics).
