      *   Keep it practical.

  7.  **Key Points to Include:**
      *   **Moral Licensing:** Feeling good about feeling bad.
      *   **Catharsis:** Releasing tension reduces the drive to resolve the source of tension.
      *   **Friction:** Volunteering is hard; buying a brownie is easy.
      *   **Call to Action:** Was it clear? Was it immediate?
      *   **Novel Readings:** Different context. Emotion helps sales, but don't expect social activism from a fiction reading.

