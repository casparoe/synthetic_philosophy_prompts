answer: |-
  You are not being a cynic. You are being an observer of human psychology, and what you stumbled onto is a well-documented phenomenon.

  Your suspicion that the reading "let people off the hook" has a name in social psychology: **Moral Licensing** (specifically a subset sometimes called "symbolic self-completion" or "vicarious moral action").

  Here is the breakdown of why this happened, why the bake sale won, and whether you should stop doing readings for your own work.

  ### 1. The Psychology of the "Tearful Audience"
  When people engage with art about suffering, their brains process that engagement as a form of action.
  *   **Emotional Catharsis as Completion:** By crying and feeling the weight of the issue, the audience's nervous system regulates the stress of the problem. They have "processed" the tragedy emotionally, which can subconsciously signal to them that they have "dealt" with the tragedy.
  *   **Identity Reinforcement:** Attending the event allowed them to affirm their identity as "compassionate people." Once that identity is affirmed ("I am the kind of person who goes to benefit readings for the homeless"), the urgency to prove it through labor (volunteering) diminishes.
  *   **The "Warm Glow" Effect:** Research in behavioral economics shows that sometimes the *feeling* of giving (or caring) provides enough dopamine hit that the actual utility of the gift becomes secondary.

  In short: You gave them an emotional experience that satisfied their moral urge, leaving less kinetic energy for actual labor.

  ### 2. Why the Bake Sale Beat the Monologues
  The bake sale succeeded because it relied on **low-friction transactionalism** rather than **high-friction emotionalism.**
  *   **Tangibility:** In a bake sale, the exchange is clear. $5 = Cookie. The value is immediate and concrete. In a reading, $20 = ? (Sadness? Inspiration?). The link between the money and the help is abstract.
  *   **Barrier to Entry:** Buying a brownie requires zero commitment beyond cash. Volunteering at a shelter requires background checks, schedules, and emotional labor. The reading asked for a high emotional investment upfront, which paradoxically made people *less* likely to commit to more labor later.
  *   **Social Norms:** It is socially normal to buy a cookie at a community event. It is socially risky to sign up to volunteer and then flake (which people know they might do), so they sign up in the moment to look good, then ghost later to avoid the guilt of flaking.

  ### 3. Should You Side-Eye Your Novel Readings?
  **No, but you should adjust your expectations.**

  A reading for your novel is different from a benefit reading, but the mechanic of connection is the same. Here is how to differentiate them:

  **For Benefit/Activism Events:**
  If you do another benefit, you have to hack the psychology.
  *   **Capture the Impulse Immediately:** Do not say, "Sign up to volunteer later." Have the shelter staff there *with tablets* to schedule shifts on the spot.
  *   **Monetize the Emotion:** Sell the book/merch at the back of the room while the emotions are high. Make the donation the "ticket" to the emotional release.
  *   **Avoid Pure Catharsis:** Frame the art not just as "look how sad this is," but "here is exactly how this art fuels the solution."

  **For Your Novel Readings:**
  Don't stop doing them. Emotional resonance is the #1 driver of book sales and word-of-mouth. However, understand what a reading actually achieves:
  *   **It builds connection, not necessarily action.** If your goal is to make people *do* something (buy the book), you cannot rely on the emotion alone. You need a Call to Action (CTA).
  *   **The "Catharsis Trap" applies to sales too.** If a reader feels they have fully experienced the story by listening to you read the climax, they might feel less urge to buy the book to finish it.
      *   *Fix:* Read the setup and the hook, not the resolution. Leave the "itch" unscratched.
  *   **Community > Conversion.** The value of a reading is often less about the books sold that night and more about the 10 people who now feel a personal connection to you and will buy the *next* book.

  ### The Verdict
  You aren't a cynic; you've just graduated from thinking like an artist to thinking like a strategist.

  Art moves people, but **structure directs them.** The reading moved them; the bake sale directed them. For your own career, keep doing the readings because they build the long-term relationship with your audience. But don't mistake tears for transactions. If you want action (sales, signing up, donating), you have to make the path to that action as easy as buying a cookie.

  **TL;DR:** The effect is real. It's called Moral Licensing. Don't stop doing readings, but stop expecting emotion alone to drive behavior. Always pair the heart with a clear, low-friction next step.
