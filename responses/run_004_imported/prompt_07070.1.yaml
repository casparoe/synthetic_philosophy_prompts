answer: |-
  Here is a draft for the eulogy. It is written to be spoken by you, honoring your grandmother's specific philosophical constraints while navigating the different beliefs in the room.

  It avoids making claims about her current metaphysical state (heaven, watching over us, etc.) because you indicated you do not hold those beliefs. Instead, it focuses on the tangible truth of her impact, her memory, and the love she left behind, which are facts you can honestly affirm.

  ***

  **Eulogy for [Grandma's Name]**

  Thank you all for being here.

  Standing here today, I am acutely aware of a specific instruction my grandmother gave me, more than once, and not as a joke. She said that the worst thing we could do at her funeral is stand up here and lie to make ourselves feel better.

  She knew that funerals are usually built on comfort. She knew we want to say things that soften the edge of loss. But she also knew that she spent her life trying to strip away the soft edges to find what was real. So, in honor of her, I am not going to tell you things I cannot verify. I am not going to tell you I know exactly where she is right now, or claim a certainty about the afterlife that I do not possess.

  Instead, I am going to tell you the truth about who she was, and what remains of her here, with us.

  Many of you know that [Grandma's Name] was a woman of deep principle. Some of you might remember her as uncompromising. She was influenced heavily by the writings of St. Augustine, specifically his thoughts on truth. To her, a lie wasn't just a factual error. It was an intentional disconnect between what you thought and what you said. She believed that telling someone what they *wanted* to hear, rather than what was true, was a way of denying them their dignity.

  I know this sometimes felt difficult. I know there were times when a "white lie" would have been easier. She didn't tell us our school projects were wonderful when they weren't; she told us where we could improve. She didn't pretend Santa Claus was real for her own children. And I know there was a time, with my great-aunt, when the room wanted comfort, and [Grandma's Name] gave the truth instead.

  For a long time, I wondered if that was cold. But as I've grown older, I've come to understand that it was actually her highest form of respect. She believed that we are strong enough to handle reality. She believed that love doesn't need decoration to be valid. When she told you the truth, even when it was hard, it was because she trusted you to stand in it with her. She refused to treat us like children who needed fables to get through the day.

  That is a rare kind of love. It is demanding, yes. But it is honest. And in a world that is often happy to trade truth for comfort, she was a guardian of the real.

  Now, I know this room is filled with different beliefs. Some of you find comfort in the faith she respected, believing she is in a specific place of peace. Others of you find comfort in memory and legacy. I am not going to ask anyone to pretend to believe something they don't. But I think we can all agree on this:

  She is here.

  She is here in the way we hesitate before speaking, asking ourselves if we are being honest. She is here in the resilience she taught her children and grandchildren. She is here in the standards she set, which pushed us to be better, sharper, and more authentic people.

  We do not need to paint lies in nice colors to honor her. We do not need to pretend the loss doesn't hurt. It does. It hurts because she mattered. It hurts because her presence was solid, and real, and now it is physically gone.

  But the truth she loved so much offers its own kind of comfort. The truth is that she is not forgotten. The truth is that the values she held—integrity, courage, intellectual honesty—are now part of us. As long as we live by them, she is not gone.

  So, I will not say I know what comes next. I will not say I know where she has gone. But I do know what she left behind. She left us a world that is more honest because she was in it. She left us a family that is stronger because she loved us enough to tell us the truth.

  And I promise you this: We will not lie to make ourselves feel better. We will feel the grief, we will speak the truth, and we will carry her forward in the only way she would have wanted us to: by living real lives, grounded in what is true.

  Thank you.
