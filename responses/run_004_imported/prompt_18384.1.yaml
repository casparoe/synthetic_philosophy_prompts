      *   *Is it just about Conditionalization?* Yes, RP is often derived as a consequence of the plan to Conditionalize. If you plan to *not* Conditionalize (because you're getting drunk), RP doesn't bind you.
      *   *What about "forgetting"?* That's another big counterexample (you know you'll forget evidence). RP struggles there. I should mention this briefly to show depth, but focus on the "drunk" case as requested.
      *   *Psychiatric Directives:* Make sure to link this to *credence* specifically. In mania, I believe I am Napoleon. RP naive says I should believe I am Napoleon now. Refined RP says I know this belief isn't evidence-based, so I don't defer.

  7.  **Final Polish:** Organize with clear headings. Ensure the conclusion directly answers the "teeth" question. (Proceed to generate output based on these thoughts.)

      *   *Key Insight to emphasize:* The Reflection Principle isn't about *time*; it's about *epistemic authority*. Time is just a proxy for "potentially more informed." When time decouples from information (drunkenness), the principle's conditions aren't met.

  8.  *(Final check of the prompt requirements)*:
      *   Walk through implications for these cases.
      *   Principled way to block counterexamples?
      *   Real-life teeth (Ulysses contracts)?

