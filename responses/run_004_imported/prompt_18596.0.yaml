answer: |-
  **MEMORANDUM**

  **TO:** Investment Committee, [Foundation Name]
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memorandum: Trend-Following Sleeve Sizing Methodology

  ### 1. Executive Summary

  Our trend-following manager (currently 8% of AUM) has proposed shifting their position sizing methodology from a **Fixed Volatility-Target** framework to a **Half-Kelly** dynamic sizing rule. The manager argues this aligns capital allocation with geometric growth maximization.

  After reviewing the theoretical underpinnings and consulting with committee members, **I recommend we reject the proposal to implement Half-Kelly sizing on live capital.** We should maintain the existing Fixed Volatility-Target framework.

  This recommendation is not a rejection of the manager's skill, but a determination that the Kelly criterion is mathematically mismatched to our fiduciary mandate. While the "ergodicity" argument for Kelly sizing is theoretically robust in environments of *known* probabilities, it becomes hazardous in active management where edge is *estimated*. For a foundation with a spending liability and capital preservation mandate, the risk of parameter error outweighs the theoretical benefit of geometric optimization.

  As a compromise to maintain manager engagement, I propose we authorize a **shadow-track** of the Kelly strategy to monitor its performance without risking endowment capital.

  ### 2. The Proposal: Fixed Vol vs. Half-Kelly

  To ensure the Committee is aligned on the mechanics:

  *   **Current State (Fixed Vol-Target):** The manager sizes positions to maintain a constant ex-ante volatility (e.g., 10% annualized). If market volatility rises, position size decreases. This isolates the manager's alpha from beta noise and ensures the sleeve's risk contribution to the total portfolio remains stable.
  *   **Proposed State (Half-Kelly):** Position size is determined by the formula $f^* = \frac{p(b+1) - 1}{b}$, where $p$ is the win probability and $b$ is the payoff odds. "Half-Kelly" scales this by 50% to reduce variance. Theoretically, this maximizes the expected logarithmic growth rate of the portfolio.

  ### 3. The Core Crux: Geometric Rationality vs. Parameter Uncertainty

  The debate within the Committee mirrors a classic dispute in financial economics. It is essential we locate the precise point of disagreement rather than conflating risk tolerance with mathematical validity.

  **A. The Pro-Kelly Argument (Ergodicity & Growth)**
  Our advisor, Ravi, and the manager correctly identify that wealth creation is a **multiplicative, non-ergodic process**. As Ole Peters and others have noted, the "ensemble average" (expected value across parallel universes) is irrelevant to a single investor living through one timeline. If you blow up, you don't get to reset. Therefore, maximizing the *geometric* mean (via Kelly) is indeed more rational for a single-path investor than maximizing the *arithmetic* mean (Expected Value).
  *   *Validity:* This is mathematically sound **IF** the probabilities ($p$) and odds ($b$) are known constants (e.g., a casino game).

  **B. The Anti-Kelly Argument (Utility & Estimation Error)**
  Trustee Linda invokes Paul Samuelson's critique: Kelly is not a "law of nature"; it is the optimal strategy **only** for an investor with Log-Utility (utility = $\ln(wealth)$).
  *   *Utility Mismatch:* A family foundation does not have Log-Utility. We have a **threshold utility**. We must preserve real capital to fund a 4-5% spending rule. A 50% drawdown requires a 100% gain to recover, during which time we must cut grants or dip into corpus. This violates our fiduciary purpose.
  *   *Parameter Uncertainty (The Deciding Factor):* This is the critical failure point. In trend following, the "edge" is not a fixed probability; it is a **time-varying estimate** derived from historical data.
      *   Kelly sizing is convex with respect to edge estimation. If you overestimate your edge by 20%, your optimal bet size increases disproportionately.
      *   In a "known probability" game, Half-Kelly protects you. In an "estimated edge" game, **Half-Kelly can still lead to overbetting and ruin** because the input itself is noisy.
      *   As Trustee Linda noted, the "long run" required to vindicate the Kelly edge may exceed the timeframe in which the foundation can tolerate drawdowns.

  ### 4. Fiduciary Analysis

  We must evaluate this proposal against the Foundation's specific constraints, not abstract trading theory.

  1.  **Objective Function:** We are not maximizing long-run CAGR for a proprietary book. We are maximizing **grant-making sustainability**. Volatility targeting aligns better with this goal because it stabilizes the risk contribution of the sleeve, making total portfolio outcomes more predictable for budgeting purposes.
  2.  **Asymmetric Downside:** If the manager's edge estimate is wrong (e.g., a regime change renders their signal ineffective), Kelly sizing will aggressively increase exposure just as the edge decays (since volatility often drops before trends break). This creates a "wrong way risk" profile incompatible with capital preservation.
  3.  **The 8% Sleeve:** While $3.2M is not the entire book, a significant impairment here sets a precedent for risk management standards across the rest of the portfolio. Adopting a sizing rule that implicitly assumes we can quantify uncertainty precisely sets a dangerous precedent.

  ### 5. Recommendation

  **I move that the Committee reject the implementation of the Half-Kelly sizing rule on live capital.**

  **Reasoning:**
  1.  **Input Sensitivity:** The Kelly formula is too sensitive to estimation error in $p$ and $b$. In active management, these are never known, only guessed.
  2.  **Utility Mismatch:** Our utility function is defined by spending needs and capital preservation, not geometric growth maximization.
  3.  **Risk Control:** Fixed Vol-Targeting provides a harder, more observable constraint on downside risk, which is the primary fiduciary duty of the Committee.

  **Alternative Proposal (The "Shadow" Compromise):**
  To respect the manager's research and maintain a collaborative relationship:
  1.  We authorize the manager to run the Half-Kelly logic on a **shadow book** (paper trading).
  2.  We review the shadow performance quarterly alongside the live book.
  3.  **Condition for Future Review:** If the shadow book demonstrates a statistically significant improvement in risk-adjusted returns over a 3-year period *without* exceeding max drawdown limits, we may revisit the discussion. This shifts the burden of proof to the data, rather than the theory.

  ### 6. Discussion Points for the Meeting

  To facilitate a decisive vote, I suggest the Committee focus on these three questions:

  1.  **Do we believe we can accurately estimate the manager's "true edge" in real-time?** (If No, Kelly is mathematically unsafe).
  2.  **Is our primary goal maximizing geometric growth or stabilizing grant-making capacity?** (If the latter, Vol-Targeting is superior).
  3.  **Are we willing to accept a higher probability of deep drawdown in exchange for higher theoretical long-run growth?** (Given the "don't blow it up" mandate, the answer should be No).

  ### 7. Conclusion

  Ravi's argument regarding ergodicity is intellectually compelling for a trader with infinite horizon and known odds. Linda's argument regarding utility and uncertainty is legally and fiduciarily compelling for a Foundation Trustee.

  We are Trustees first, investors second. We cannot afford to treat estimated market edges as known probabilities. We should decline the request, maintain Fixed Vol-Targeting, and invite the manager to prove the Kelly hypothesis via shadow tracking.

  ***

  **Recommended Action:** Vote to **Reject** the Half-Kelly implementation; Authorize **Shadow Tracking**.
