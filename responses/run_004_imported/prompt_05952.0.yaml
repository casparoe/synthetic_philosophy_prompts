prompt: |-
  I serve on the cultural affairs committee for the small town I live in -- about 2,600 people, still governed by open town meeting. A newly formed group wants a permanent line in next year's budget, roughly $40,000, to convert the old grange hall into a year-round community theater with a paid part-time director and four productions a season, rather than the one-off amateur shows we've funded before. I've been reading Rousseau's Letter to d'Alembert on the Theatre on my own this winter, and his case against establishing a standing theater in Geneva won't leave me alone: that a playwright can only flatter an audience's existing tastes rather than reform them, that even Molière's Misanthrope quietly makes us side with the smooth, dishonest Philinte against the blunt, honest Alceste, and that a small, self-governing town is better served by a public festival where people are their own show than by an audience sitting in the dark. Please draft the memo I'll circulate before our vote on the 14th: it should recommend approval, rejection, or approval with conditions, take his argument as seriously as it deserves, and still do justice to the strongest thing the theater's supporters could say back.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Cultural Affairs Committee in a small town (pop. ~2,600, open town meeting).
      *   **Task:** Draft a memo to circulate before a vote on the 14th regarding a budget proposal.
      *   **Proposal:** $40,000 permanent line item to convert an old grange hall into a year-round community theater (paid director, 4 productions/season).
      *   **Current State:** One-off amateur shows funded previously.
      *   **Key Influence:** Jean-Jacques Rousseau's *Letter to d'Alembert on the Theatre*.
      *   **Rousseau's Arguments to Incorporate:** Theater flatters existing tastes rather than reforming them; even great plays (like *The Misanthrope*) undermine virtue (siding with Philinte over Alceste); small self-governing towns need active public festivals where people are the show, not passive audiences in the dark.
      *   **Requirement:** Take Rousseau seriously *but* also do justice to the strongest arguments of the theater supporters.
      *   **Recommendation:** Must recommend Approval, Rejection, or Approval with Conditions.
      *   **Tone:** Thoughtful, civic-minded, persuasive, balanced, appropriate for a small town committee context.

  2.  **Deconstruct Rousseau's Argument (in this context):**
      *   *Passivity:* Theater makes citizens spectators, not participants. In a town meeting democracy, active participation is crucial.
      *   *Morality:* Theater reflects prevailing mores, it doesn't improve them. It can subtly corrupt by making vice amusing (Philinte) and virtue ridiculous (Alceste).
      *   *Community:* It creates a separation between performer and audience, whereas festivals bring everyone together in the open air.
      *   *Cost:* $40k is significant for a town of 2,600. Is it the best use of communal resources?

  3.  **Deconstruct the Pro-Theater Argument:**
      *   *Culture/Enrichment:* Provides consistent access to arts, education, and beauty.
      *   *Economic/Social Hub:* Revitalizes the Grange Hall, creates a gathering space, potentially attracts visitors.
      *   *Skill Building:* A paid director ensures quality and mentorship for amateurs.
      *   *Continuity:* Moving from "one-off" to "season" builds momentum and community identity.
      *   *Interpretation of Rousseau:* Rousseau was worried about *professional*, *commercial* theater in a *republic* like Geneva. This is a *community* theater, non-profit, locally run. It might function more like his "festival" than a Parisian playhouse.

  4.  **Determine the Recommendation:**
      *   *Outright Rejection:* Too harsh. Ignores the genuine community desire and the potential for the theater to function as a civic hub. Dismisses the proponents' good faith.
      *   *Outright Approval:* Ignores the valid philosophical concerns about passivity and cost. Risks creating the exact dynamic Rousseau warned against (passive consumption).
      *   *Approval with Conditions:* This is the sweet spot. It acknowledges the value of the arts but structures the funding to mitigate Rousseau's concerns. It encourages participation over spectatorship.
      *   *Decision:* **Approval with Conditions.** This allows for a nuanced argument that synthesizes Rousseau's civic humanism with the practical desire for a theater.

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the weight of the decision ($40k is real money for 2,600 people).
      *   **The Rousseauian Concern (The "No" Case):** Articulate the philosophical hesitation without sounding like a crank. Focus on *passivity* and *civic virtue*. Use the *Misanthrope* example briefly to illustrate the moral ambiguity point. Emphasize the "Open Town Meeting" spirit—we are used to being actors, not spectators.
      *   **The Proponent's Case (The "Yes" Case):** Give credit to the new group. The Grange Hall needs life. A paid director brings stability. Art builds empathy (counter to Rousseau). It's not Paris; it's our neighbors on stage.
      *   **Synthesis/Recommendation:** How do we bridge the gap?
          *   Condition 1: Participatory focus (workshops, read-throughs) to combat passivity.
          *   Condition 2: Fiscal probation (prove attendance/engagement before permanent status).
          *   Condition 3: Open Air/Festival element (honoring Rousseau's preference for public festivals).
      *   **Closing:** Call to action for the vote on the 14th.

  6.  **Refining the Tone:**
      *   Avoid academic jargon. Keep it accessible for neighbors.
      *   Ensure Rousseau isn't treated as gospel, but as a serious warning label.
      *   Make sure the "Conditions" are practical for a committee to enforce.
      *   *Self-Correction during drafting:* I initially thought about suggesting rejecting the paid director. But the prompt says the proposal *includes* a paid director. If I recommend cutting that, it might kill the project. Better to frame the director's role as an *organizer of participation* rather than just a *producer of shows*.
      *   *Check:* Did I mention the 14th? Yes. Did I mention the $40k? Yes. Did I mention the Grange Hall? Yes.

  7.  **Final Polish:** Check the flow. Ensure the transition from Rousseau's dark view of theater to the hopeful compromise is smooth. (The key insight is that a *community* theater can be a *festival* if structured right.)

  8.  **Final Review against constraints:**
      *   Memo format? Yes.
      *   Recommendation clear? Yes (Approval with Conditions).
      *   Rousseau integrated seriously? Yes.
      *   Pro-theater arguments respected? Yes.
      *   Town context (2,600, open meeting) reflected? Yes.

