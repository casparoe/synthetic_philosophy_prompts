      *   *Distinguish the Scope (Sociology vs. Ontology):* Labeling theory explains *deviance careers*. Looping effects explain the *instability of scientific categories*. This is the big philosophical pivot.
      *   *The "Moving Target" Argument:* In natural sciences, electrons don't care about being electrons. In human sciences, people react. This changes the *truth conditions* of the science.
      *   *Agency and Resistance:* Labeling often implies passive internalization (stigma). Hacking emphasizes active engagement (e.g., autistic self-advocacy changing what "autism" means).
