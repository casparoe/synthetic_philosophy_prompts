      *   *Is it just a rehash?* Most philosophers of science would say "no," but acknowledging the debt is crucial. Hacking himself acknowledged sociological precursors.
      *   *What are the key differences?*
          *   **Ontology vs. Sociology:** Labeling theory is largely about social reaction, stigma, and deviance careers. Looping effects are about *kinds of people* and the *ontology* of human kinds.
          *   **Agency/Resistance:** Hacking emphasizes how people *fight back* or change the meaning of the classification, not just internalize it passively.
