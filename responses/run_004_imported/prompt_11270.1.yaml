      *   Answer the core question? Yes.

  *(Self-Correction Note)*: I need to make sure Sarah doesn't sound like a hard social constructivist who denies biology. Hacking wasn't a denialist; he was an ontologist. She should acknowledge the neurology but argue the *category* is interactive. Elias should acknowledge the messiness but argue for a stable referent.

  8.  **Final Polish:** Check flow and voice distinction. Elias should sound more medical/pragmatic. Sarah should sound more analytical/historical.

