answer: |-
  Here are 8 interview questions designed to pin down the "it's just conditionalization" dodge. They are written for a technical audience (formal epistemology podcast) and include specific follow-ups to prevent her from pivoting away.

  ### 1. The Presumptuous Philosopher (Empirical Silence)
  "In Bostrom's Presumptuous Philosopher case, SIA tells the philosopher she can be virtually certain the universe is the larger one ($T_2$) *before* the astronomers turn on their telescopes, simply because $T_2$ contains more observers. You've called this 'correct conditionalization,' but standard Bayesianism requires likelihood ratios to be driven by data. If the physical evidence is identical under $T_1$ and $T_2$, what exactly is the *likelihood ratio* you are inputting into Bayes' theorem that shifts the posterior so drastically, and where does that ratio come from if not the telescope?"

  *   **Follow-up:** If she says the likelihood ratio comes from the indexical fact "I exist," press: "But 'I exist' is true in both $T_1$ and $T_2$. If the proposition is identical in both worlds, the likelihood ratio should be 1. Are you secretly smuggling a prior preference for worlds with more observers into the likelihood function?"

  ### 2. The Reference Class Problem
  "Defenders of SSA spend a lot of time worrying about the reference class problem—deciding which observers count for sampling. SIA seems to solve this by quantifying over 'all possible observers.' But isn't 'all possible observers' just a privileged, maximal reference class? If SSA is criticized for arbitrary restrictions on the reference class, why isn't SIA criticized for an arbitrary *expansion*? What non-circular criterion tells us that the class for conditionalization must be maximal rather than, say, 'observers with my exact qualitative state'?"

  *   **Follow-up:** If she argues that "all possible" is the only non-arbitrary default, ask: "Why is 'all possible' a metaphysical given rather than a modeling choice? If I model the problem with a restricted class and get different results, on what grounds do you say my model is irrational rather than just different?"

  ### 3. Sleeping Beauty and Scaling
  "Many argue that the Thirder position in Sleeping Beauty is essentially SIA-flavored reasoning applied to a small scale. If you are a Thirder because you treat the awakening as evidence favoring the world with more awakenings, does that commit you to a 'Presumptuous Philosopher' stance within the experiment? If Beauty is offered a bet where the payout depends on the *total number of observers in the cosmos*, does her SIA-based credence in 'Heads' vs 'Tails' license her to make cosmological inferences from her awakening?"

  *   **Follow-up:** If she says the cases are disanalogous because of the stakes or scale, ask: "If the logic of conditionalization on self-locating evidence is universal, why does the validity of the inference depend on the magnitude of the hypothesis? Is there a specific threshold where 'correct conditionalization' becomes 'presumptuous'?"

  ### 4. The Content of the Evidence
  "You dismiss the Presumptuous Philosopher objection by saying it's just 'conditionalization on self-locating evidence.' For the sake of clarity, can you write down the exact proposition $E$ that the agent conditionalizes on? Is it 'I exist,' 'I am observing,' or 'I am this specific observer'? Because if $E$ is 'I exist,' standard probability theory suggests $P(E|H)$ should be 1 for any hypothesis $H$ that entails my existence. How do you formalize $E$ such that $P(E|T_2) > P(E|T_1)$ without begging the question?"

  *   **Follow-up:** If she appeals to a specific formalism (like centred worlds), ask: "Does that formalism implicitly assign measure to worlds based on observer count? If so, isn't that measure assignment doing the heavy lifting, rather than the conditionalization itself?"

  ### 5. The Infinite Universe Limit
  "SIA runs into notorious difficulties when hypotheses entail infinite observers, as the probability shifts become undefined or trivial. If SIA is 'correct conditionalization,' it should handle limits gracefully. Do you view the failure of SIA in infinite cases as a sign that the principle is only an approximation for finite worlds, or do you endorse a specific regularization method? If the latter, doesn't the choice of regularization function act exactly like the reference class restriction you reject in SSA?"

  *   **Follow-up:** If she says infinite cases are edge cases we can ignore, ask: "But modern cosmology seriously entertains infinite inflation. If your epistemic principle breaks down on live physical hypotheses, can it really be called 'correct conditionalization' generally, or is it contingent on the universe being finite?"

  ### 6. Decision-Theoretic Cash Value
  "Let's talk Dutch Books. If I use SSA and you use SIA, we will assign different probabilities to the same self-locating propositions. In a betting scenario where the payout is determined by the number of observers (like a 'bet per observer' contract), one of us is guaranteed to lose money in expectation. If you claim SIA is rationally required, are you claiming that SSA users are vulnerable to a Dutch Book, or that the betting setup itself is illicit? If the latter, aren't you restricting the domain of rational action to protect the theory?"

  *   **Follow-up:** If she claims SSA users get Dutch Booked, ask: "Can you specify the set of acceptable bets where SIA wins? Because if the bets are scaled to the universe size, SIA looks like it's betting on the size of the universe, not the outcome of the experiment."

  ### 7. The Inverse Gambler's Fallacy
  "Critics often liken SIA to the Inverse Gambler's Fallacy—inferring that a rare event (my existence) implies many trials (a large universe) occurred. You reject this analogy, but structurally, both arguments infer a larger sample space from a single data point. If I walk into a room and see a specific person, SIA suggests I should infer the world has more people. What distinguishes this from the fallacious reasoning of inferring many dice rolls from a single double-six, other than the label 'self-locating'?"

  *   **Follow-up:** If she says the fallacy ignores indexical evidence, ask: "But why does the indexical nature of the evidence license an inference about the *non-indexical* structure of the world (the total number of observers)? That seems to be exactly what the Gambler's Fallacy warns against."

  ### 8. Priors vs. Likelihoods
  "Finally, to return to your line that SIA results are 'not a bug.' In Bayesian terms, a result that strongly favors a hypothesis without empirical data usually indicates a strong prior, not a strong likelihood. Are you admitting that SIA is actually a claim about *priors*—that we should assign higher prior probability to worlds with more observers—rather than a claim about conditionalization? If it is a prior, what justifies it other than avoiding the Doomsday Argument?"

  *   **Follow-up:** If she insists it's about likelihoods/conditionalization, ask: "If it's a structural feature of conditionalization, it should apply to all agents. Does this mean an alien in a different universe, using the same logic, would also infer their universe is the largest possible one? If everyone infers they are in the biggest universe, who is wrong?"
