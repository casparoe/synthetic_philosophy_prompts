answer: |-
  The first thing Julian Vane verified was the pain. It was a raw, scratching abrasion in the throat, a specific, localized datum that demanded no interpretation. It was consistent with the memory of the smoked salmon. The second thing was the ceiling: white, textured, fluorescent. Consistent with St. Thomas' Hospital.

  The third thing was the gap.

  He lay still, letting the morphine haze settle into something like clarity. There was a period of time—four minutes, the chart would later say, though time was hardly the metric that mattered—where there had been no Julian Vane. No sense data, no logical constructions, no body. And yet, there was the memory of the Red Light.

  It was not a metaphor. He had seen a red light. He had seen beings. They had seemed concerned with the administration of space. It was a ridiculous description, bureaucratic even in the afterlife, but it was what his memory presented. The problem was not whether he had seen it; he had. The problem was what the sentence *'I saw the administrators of space'* meant now that he was back in a world governed by pulse rates and oxygen saturation.

  The door opened. A nurse entered, checking a drip. She was solid, practical, wearing shoes that squeaked on the linoleum.

  "Mr. Vane?" she asked. "You're with us then?"

  "Apparently," Julian said. His voice was a ruin, gravel in a tin cup. "Though I should like to know on what grounds you assert the 'us' includes me."

  The nurse smiled, the weary smile of someone who has heard delirium before. "Your pulse says you're included. Don't talk too much. Throat's swollen."

  She touched his wrist. Her fingers were warm. This was the anchor. For Julian, personal identity was not a soul-thread stretching from birth to death; it was a continuity of memory and bodily causality. He looked at his own hand, pale against the sheet. It was the same hand that had reached for the fork. The chain of cause and effect had been interrupted, yes, but the links remained. He was a logical construction rebuilt from the same bricks.

  "Did I speak?" Julian asked. "While I was... away."

  "You were gone, love. No one speaks when they're gone."

  "Curious," he murmured. "I was quite busy."

  She adjusted the IV and left. The silence returned, but it was no longer empty. It was populated by the Red Light.

  An hour later, the door opened again. This time it was Elias, his most promising doctoral student. Elias looked as though he hadn't slept in two days. He carried a bouquet of flowers that seemed to offend the sterility of the room.

  "Professor," Elias breathed, setting the flowers down as if they were explosive. "We heard... the department heard. We weren't sure."

  "Clearly you are sure now, or you wouldn't be standing there," Julian said. He tried to shift his pillows. Elias rushed to help, his hands trembling.

  "I'm so glad," Elias said. "We were worried. Given your... previous positions."

  "My positions remain, Elias. They are not dependent on my bronchial tubes."

  Elias sat in the visitor's chair, leaning forward. The earnestness radiating off him was almost physical. "There are rumors, sir. About what happened. During the arrest."

  Julian closed his eyes. The Red Light flared behind his lids. "There are always rumors. Gossip is the primary industry of the living."

  "Did you see anything?" Elias asked. The question hung in the air, heavy with metaphysical baggage.

  Julian opened his eyes. He looked at Elias. He loved the boy, but Elias treated the Verification Principle like a religious text rather than a tool. Elias wanted a miracle to debunk, or a miracle to confirm. He didn't understand that the miracle was irrelevant; only the statement mattered.

  "I experienced a visual phenomenon," Julian said carefully. "Intense redness. Spatial distortion. Figures."

  "Figures," Elias repeated. He swallowed. "Beings?"

  "They appeared to be charged with the administration of space," Julian said. "They seemed to think the job had been poorly done."

  Elias blinked. The tension in his shoulders didn't drop; it shifted. "And? What does that mean, Professor? Does it mean... is it true?"

  "There you go," Julian whispered, wincing at the scratch in his throat. "You are asking if it is *true*. That is a careless use of language, Elias. What would verify the truth of it?"

  "Well," Elias stammered. "If you saw them, they exist."

  "I saw *something*," Julian corrected. "I verify the experience. I do not verify the object. If I dream of a dragon, I verify the dream. I do not verify the dragon. The question is whether the Red Light was a dragon or a dream."

  "But you were dead," Elias insisted. "Your heart stopped. The brain activity flatlined. If the brain is the condition for the 'I', and the brain stopped, then 'Julian' ceased. If 'Julian' ceased, who saw the light?"

  Julian looked at his hand again. This was the crux. The discontinuity. If the 'I' is a construction of continuous experience, the construction had collapsed. The fact that he could remember the collapse suggested the construction had been reassembled. But was it the same building?

  "I am the one speaking to you now," Julian said. "I possess the memories of the man who choked on the salmon. I possess the memory of the Red Light. The continuity of memory is sufficient for the continuity of the person. Whether the 'soul' persisted is a question that lacks cognitive content. I cannot observe a soul. I can only observe Julian Vane in a bed."

  "But the light," Elias pressed. "It shakes the principle, doesn't it? You've always said talk of an afterlife is meaningless because it's unverifiable. But you verified it. You went there and came back."

  Julian felt a flicker of irritation, sharp and familiar. It was good to be irritated; it felt like being alive. "I did not verify an afterlife, Elias. I verified a near-death experience. There is a categorical difference. To say 'I saw the afterlife' implies a claim about the state of the universe after biological termination. I did not terminate. I was restarted. I am a car that stalled on the motorway and was pushed by a passing truck. The fact that I saw the scenery while being pushed does not prove the destination exists."

  Elias looked down at his hands. "It just... it sounds like you're explaining it away. But you sound different."

  Julian paused. He considered the Red Light again. It had felt more real than the hospital ceiling. The ceiling was contingent; the light was necessary. But feelings were not facts. Feelings were sense data, and sense data could be misleading.

  "Perhaps," Julian said softly. "I have always maintained that a statement is meaningful only if we know what observation would count against it. If I claim there is no afterlife, what observation could prove me wrong? Previously, I would have said 'none.' Death is the end of the observer, so no observation is possible."

  He took a breath. The pain was a comforting anchor.

  "However," Julian continued, "I have now made an observation from a state previously assumed to be unobservable. I was, for all medical intents, dead. And I have a report. It does not prove the existence of God. It does not prove the survival of the soul. But it does suggest that the boundary between 'alive' and 'dead' is not as sharp as I supposed. If the 'I' can observe the threshold, then the 'I' is not strictly co-extensive with the beating heart."

  Elias looked up, hope warring with confusion. "So you're retracting?"

  "I am amending," Julian said. "I am not a dogmatist, Elias. I am an empiricist. New data requires a adjustment of the hypothesis. My conviction that death is the end is... loosened. Somewhat."

  "Loosened."

  "It is no longer a logical certainty. It is a probability based on incomplete data. The data set has just acquired a very strange outlier." Julian looked at the nurse's station through the glass panel in the door. A woman was laughing at something. The sound was ordinary, mundane, and utterly verifying. "I still do not know what the beings were. I do not know if they were administrators or hallucinations. To claim they were angels is nonsense. To claim they were neurons firing is also a hypothesis, not a direct observation."

  "So what do you tell them?" Elias asked. "The department. The press."

  Julian closed his eyes. The Red Light was fading, retreating into the archives of memory. He was left with the squeak of shoes, the smell of antiseptic, the ache in his throat.

  "You tell them," Julian said, "that Julian Vane choked on a piece of fish. You tell them he was revived. And you tell them that he saw a red light. If they ask what it means, you tell them that the meaning is not yet verified."

  "And the soul?"

  Julian opened his eyes. He looked at Elias, really looked at him, seeing the young man's fear of a world without magic, and his own fear of a world with too much of it.

  "The soul," Julian said, his voice dropping to a dry rasp, "remains a grammatical fiction. But I must admit, Elias... the fiction feels rather more robust than it did on Tuesday."

  He reached for the glass of water on the tray. His hand shook, just slightly. He gripped the plastic cup. It was cold. It was solid. It was here.

  "Pass me that salmon," he joked, nodding toward the empty tray on the table. "I wish to test a hypothesis."

  Elias laughed, a sudden, relieved sound. He didn't understand, not fully. He thought Julian had conceded ground. He didn't see that Julian had simply expanded the field of play. The Verification Principle stood, but the definition of 'possible observation' had grown a little wider, a little stranger. The door wasn't open, but it was no longer locked.

  Julian took a sip of water. It tasted of chlorine and life. It was enough. For now, it was all that could be said to be true.
