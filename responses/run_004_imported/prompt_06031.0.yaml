answer: |-
  This is a delightful question, and it lands precisely at the intersection of evolutionary biology, physiology, and the philosophy of medicine—a nexus where your background in comparative physiology serves you particularly well. Your brother-in-law is not merely being contrarian; he is articulating a position that has genuine traction in the literature, often associated with evolutionary medicine (or Darwinian medicine). However, while his evolutionary premises are sound, his philosophical conclusion regarding the term "disorder" commits a category error regarding the *telos* of clinical medicine.

  To give you a principled basis for siding with the gastroenterologist (without dismissing the biology), we need to disentangle three distinct concepts of "normality": the **statistical**, the **evolutionary**, and the **functional**.

  ### 1. The Evolutionary vs. The Statistical Reference Class
  Your brother-in-law's argument rests on what philosophers of medicine call the **Biostatistical Theory** (most famously associated with Christopher Boorse), but he is selecting the wrong *reference class*.

  Boorse defines health as the ability to perform all typical physiological functions with at least typical efficiency, relative to a **reference class**.
  *   **BIL's Reference Class:** *Homo sapiens* over evolutionary time, or mammals generally. In this class, lactase non-persistence is indeed the statistical norm.
  *   **The Clinician's Reference Class:** Adult humans in a specific ecological and cultural niche (e.g., Northern European or North American populations). In this class, lactase persistence is the statistical norm.

  Medicine is inherently local. A cardiologist in New York treats the "normal" blood pressure of a New Yorker, not the "normal" blood pressure of a Tsimané forager, even if the latter is more "ancestral." If we adopted your brother-in-law's reference class globally, nearly all refractive errors (myopia) would be considered "normal" because they were rare in hunter-gatherer societies, yet we rightly classify them as disorders requiring correction in modern contexts.

  The label "disorder" is not a judgment on the genome's antiquity; it is a judgment on the organism's function within its **current environment**.

  ### 2. The "Harmful Dysfunction" Analysis
  The most robust philosophical framework for this dispute is Jerome Wakefield's **Harmful Dysfunction** analysis. Wakefield argues that for a condition to be a disorder, it must satisfy two criteria:
  1.  **Harm:** It causes negative consequences (pain, reduced fitness, suffering) as judged by social values.
  2.  **Dysfunction:** A biological mechanism is failing to perform its natural function.

  Your brother-in-law wins on the "Dysfunction" point if we define the function strictly as "the genetic program encoded in the ancestral genome." The lactase gene is doing exactly what it was selected to do: downregulate after weaning.

  However, the clinician wins on the **Harm** criterion and a broader view of **Function**. In a modern environment where dairy is a ubiquitous, calorie-dense food source, the digestive system's inability to process it without causing pain, bloating, and diarrhea constitutes a failure of the *organism* to maintain homeostasis in its *current* niche.

  This is a classic **mismatch disease**. Just because a trait is ancestral does not mean it is functional in a novel environment. Wisdom teeth are ancestral; they are not a "disorder" in an evolutionary sense, but when they cause impaction and infection in modern jaws (which are often smaller due to dietary changes), oral surgeons rightly treat them as pathological. The pathology lies not in the tooth's existence, but in the *interaction* between the tooth and the current jaw/environment.

  ### 3. The Naturalistic Fallacy
  Your brother-in-law is inadvertently committing a version of the **Naturalistic Fallacy** (deriving an "ought" from an "is"). He argues that because lactase non-persistence *is* the ancestral state, it *ought* to be considered the healthy state.

  But medicine is not evolutionary anthropology. Its goal is not to restore the Pleistocene body; it is to alleviate suffering and restore function in the present. If we followed the "ancestral norm" logic consistently, we would have to stop treating:
  *   **Infectious diseases:** Our ancestors lived with high pathogen loads; immunity is the anomaly.
  *   **Obesity:** In environments of scarcity, efficient fat storage was the norm; now it is a disorder.
  *   **Dental caries:** Ancestral humans rarely had cavities due to diet; should we stop calling them dental disease?

  The fact that a condition is "natural" or "ancestral" does not exempt it from being a "disorder" if it impairs the individual's well-being in their current context.

  ### 4. Is it Merely Verbal?
  You asked if the dispute is just verbal—i.e., whether medicine has smuggled a value judgment under an objective label. The answer is **yes, but that is a feature, not a bug.**

  The concept of "disease" is a **hybrid concept**. It contains:
  1.  **Factual components:** (e.g., lactase enzyme activity levels, hydrogen breath test results).
  2.  **Evaluative components:** (e.g., "Is this state undesirable? Does it impede life goals?").

  Your brother-in-law is trying to strip the evaluative component out and rely solely on the historical/factual component. The gastroenterologist is correctly applying the evaluative component relative to the patient's lived reality.

  If your brother-in-law lived in a pastoralist society in East Africa where milk was the primary calorie source, his condition would be severely maladaptive and clearly a "disorder" in that context. If he lives in a society where he can easily avoid milk without nutritional deficit, the "harm" is reduced, but the physiological reaction (the cramping and diarrhea) remains a dysfunction of the digestive process *relative to the ingestion of that food*.

  ### Conclusion
  You can tell your brother-in-law that his evolutionary biology is impeccable, but his philosophy of medicine is category-mistaken.

  The gastroenterologist has the better claim on the word "disorder" because clinical medicine defines normality **functionally and contextually**, not **phylogenetically**. A disorder is a failure of the organism to function successfully in its *current* environment. That his gut reacts violently to a common food source is a physiological failure in the here-and-now, regardless of whether his genes are "older" than his neighbor's.

  The "disorder" is not in his ancestry; it is in the **mismatch** between his physiology and his ecology. Medicine treats the mismatch, not the ancestry.
