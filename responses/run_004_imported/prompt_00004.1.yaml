      *   *Nuance:* Hume's skepticism cuts both ways. He might agree we *don't know* the future, but he wouldn't accept the DA's specific *probabilistic* claim that extinction is *likely* soon. He would prefer simple agnosticism over a specific probability distribution derived from nothing.
      *   *Key Insight:* The DA claims to derive a substantive fact (time of extinction) from a formal principle (SSA). Hume hates deriving matters of fact from relations of ideas.

