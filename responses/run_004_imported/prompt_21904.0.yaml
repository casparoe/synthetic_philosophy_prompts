answer: |-
  **Setting:** *The department lounge, 8:30 PM. The whiteboard is still covered in lambda calculus from the earlier workshop. Two empty coffee cups sit between ELENA and MARCUS.*

  **Marcus:** Look, I get the appeal of Hom's view. I do. It's clean. You want to say the slur denotes a complex property—*ought to be discriminated against because of origin*—and since nothing satisfies that property, the extension is empty. "Sam is a chink" is false. Full stop. It treats racism like a bad scientific theory.

  **Elena:** Because it *is* a bad theory. That's the point, Marcus. If we treat the derogatory content as at-issue truth conditions, we can say the racist is making a factual claim about the world, and that claim is false. It gives us the resources to say the speaker is *wrong*, not just rude.

  **Marcus:** But it doesn't capture the phenomenology. Take the negation test. "Sam is not a chink." On your view, the negation operator targets the complex property. So you're asserting that Sam does not possess the property of *being-ought-to-be-discriminated-against*. You're denying the racism.

  **Elena:** Exactly. And that's a true sentence.

  **Marcus:** But it's still offensive! If I walk into a room and announce, "Sam is not a chink," heads turn. People get uncomfortable. The slur's punch is still there. On my view, that's because the derogatory content is a Conventional Implicature. It's a separate dimension of meaning. The at-issue content is just "Sam is Chinese" (or whatever the neutral counterpart is), and the negation targets that. But the CI—the *boo* attitude—projects. It survives the negation. That explains why the sentence still feels toxic even though you're logically denying the predicate.

  **Elena:** I'm not convinced projection proves it's non-truth-conditional. Just because the word invokes the ideology doesn't mean the ideology is part of the truth conditions. Look, if I say, "The King of France is not bald," I'm still invoking the concept of a King of France. The offense in "Sam is not a chink" comes from the mere mention of the slur, the pragmatic act of deploying it, not the semantic content. You're conflating use-conditions with truth-conditions.

  **Marcus:** But the projection data is robust. It's not just negation. Look at the conditional: "If Sam were a chink, we still shouldn't fire him." On your Hom-style view, the antecedent is a counterpossible. You're asking us to suppose a metaphysical impossibility—that the social property actually exists and applies to Sam.

  **Elena:** So? We handle counterpossibles all the time. "If water weren't H2O..." The antecedent is false, but the conditional can still be non-vacuously true if we're talking about conceptual roles.

  **Marcus:** Sure, but notice where the offense lands. In "If Sam were a chink," the slur is embedded. It's under the scope of the *if*. If the derogatory content were ordinary at-issue content, it should be trapped in the antecedent. It shouldn't affect the common ground of the actual conversation. But it does. The sentence *still* expresses contempt for Sam, or at least for the group. The "kick" projects out of the conditional. That's the hallmark of expressive content, Elena. It's immune to embedding. If your truth-conditional view were right, that sentence should feel neutral, like a hypothetical about a fictional property. It doesn't.

  **Elena:** I think you're overstating the immunity. The sentence is definitely awkward, but is it offensive in the same way as "Sam is a chink"? I'd argue the offensiveness is mitigated because the speaker is explicitly distancing themselves from the antecedent's truth. They're saying, "Even granting this false/racist premise for the sake of argument..." The offense is residual, pragmatic. But semantically, your view has a bigger problem here. If the CI is "Sam is Chinese" plus "Boo Chinese," then "If Sam were a chink" asserts the hypothetical that Sam is Chinese. But the *boo* part projects. So the speaker is expressing *actual* contempt for Chinese people in the actual world, while only hypothetically linking it to Sam. That seems to get the semantics of the insult wrong. The insult is supposed to be about Sam *in the hypothetical*, not a general statement about the group in the actual world.

  **Marcus:** Touché. The projection of CIs is usually independent of the at-issue world. But maybe that's a feature, not a bug. It shows that the slur encodes a norm that the speaker endorses *now*, regardless of the hypothetical. But okay, let's hit you with the curveball. Reclamation. In-group use. When a member of the target group uses the slur with another member, the "kick" disappears. "Yeah, we're chinks, let's get lunch."

  **Elena:** This is where Combinatorial Externalism shines, actually. The content of the term is determined by the social practices surrounding it. If the social practice changes—if the group reclaims the term and strips away the *ought-to-be-discriminated-against* norm—then the semantic content *changes*. The extension is no longer empty. They've literally changed the truth conditions by changing the social reality. The word now denotes a different property, maybe something like *member of our community who shares this specific historical burden*.

  **Marcus:** Does it? Or does it just turn off the expressive dimension? On the CI view, the lexical entry has two parts: at-issue (Chinese) and CI (derogatory). Reclamation is basically a context-sensitive override of the CI. The problem for me is that CIs are supposed to be *conventional*. They're supposed to be hard-wired to the lexical item. If context can just delete the CI, is it really a Conventional Implicature? It starts looking more like a presupposition that can be satisfied locally, or even just pragmatic enrichment.

  **Elena:** Exactly. If the offensiveness can be toggled by the identity of the speaker, it suggests the content is sensitive to context in a way that pure CIs aren't. But for me, the reclamation data kills your view in a different way. If the slur just meant "Chinese + Boo," then in-group use would be incoherent. They'd be saying "I'm Chinese + Boo me." That's self-hatred. But it's not. It's solidarity. So the "Boo" component isn't there at all. Which means the derogatory content *must* be part of the truth-conditional material that gets swapped out when the social practice changes.

  **Marcus:** I don't think it's self-hatred. It's appropriation. They're taking the weapon and dulling the blade. The lexical entry stays the same, but the normative force is disarmed by the context. Think of it like irony. If I say "Great weather" during a storm, the literal content is false, but I'm not lying. I'm using the expression differently. Reclamation is a form of sustained, community-wide irony.

  **Elena:** But irony is pragmatic. Reclamation feels semantic. If I'm an outsider and I try to use it the same way, it's not just "ironic," it's a slur again. The truth conditions flip back. That suggests the speaker's identity is an argument in the semantic function. Hom can handle that—externalism says the content depends on the social relations, and the speaker's relation to the group is part of that social fact. Your CI view has to say the word *means* the same thing but somehow *doesn't mean* the same thing depending on who says it. That's a tension in the lexical entry itself.

  **Marcus:** Maybe the tension is in the world, not the lexicon. Look, I'll grant you that reclamation is hard for standard CI. Potts himself struggles with context-sensitivity. But I still think your view fails the basic intuition test. When a racist says "Sam is a chink," they aren't just asserting a false sociological theory. They're doing something. They're enacting subordination. Your view makes it a constative speech act that happens to be false. My view makes it an expressive act that succeeds in being offensive regardless of truth.

  **Elena:** But if it's just expressive, how do we argue against it? If I say, "That's false," on your view, I'm only denying the neutral counterpart. I'm saying "Sam is not Chinese." I'm not denying the racism, because the racism isn't in the truth conditions. It's in the CI dimension. You can't negate a CI. So on your view, we literally cannot say the racist is *wrong*. We can only say they're being rude.

  **Marcus:** We can say they're violating a norm. We don't need truth conditions to condemn speech.

  **Elena:** In philosophy of language, we kind of do. If we want to model how language hooks onto the world, and racism is a claim about how the world is structured, we need truth conditions to show where it disconnects.

  **Marcus:** *(Sighs, looking at the whiteboard)* So we're stuck. Negation and conditionals suggest the offense projects (my point), but reclamation and the need for falsifiability suggest the offense is part of the predicate (your point).

  **Elena:** Basically. Maybe it's a hybrid. Maybe there's a truth-conditional core that is empty, and a separate expressive layer that is conventional.

  **Marcus:** A hybrid view. The "everyone is partially right" conclusion. Very reading group of us.

  **Elena:** *(Starts packing up)* Hey, if it were easy, it wouldn't be quals material. You want another coffee?

  **Marcus:** No, I need to go read more Potts. If I'm going to defend projection, I need a better answer for how reclamation disables the CI without changing the lexical entry.

  **Elena:** And I need to figure out how to explain the "kick" in negation without conceding it's non-truth-conditional. See you Thursday?

  **Marcus:** Thursday.
