          *   *Strength:* Intuitive appeal to frequentist probability. If you bet every waking, you lose money betting Heads.
          *   *Weakness:* Confuses "probability of the coin" with "probability of the waking." Assumes calibration requires matching the frequency of *observations* rather than *events*.

      *   **Move (2) - Halfer (No New Information):**
          *   *Claim:* Coin is fair ($P(H) = 1/2$). Waking provides no new info because she knew she'd wake up regardless.
          *   *Strength:* Adheres to standard Bayesian conditionalization. If $P(E|H) = P(E|T)$, then $P(H|E) = P(H)$.
          *   *Weakness:* Ignores *self-locating* information. She learns "I am awake *now*," which has different probabilities under H and T regarding *which* "now" it is.

      *   **Move (3) - Thirder (Self-Locating Info):**
          *   *Claim:* She learns "I am awake now." This is indexical information.
          *   *Strength:* Acknowledges the unique epistemic position of the agent. Addresses the "No New Info" claim.
          *   *Weakness:* Needs to justify *why* this specific indexical info shifts the probability of the *coin* rather than just the probability of the *day*.

      *   **Move (4) - Halfer (Double Counting/Sampling):**
