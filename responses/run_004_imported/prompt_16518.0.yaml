answer: |-
  Bishop: You understand why I have come, Mother Juana. The letter under Sor Filotea's name was meant for your eyes alone.

  Sor Juana: Then Your Excellency should not have printed it.

  Bishop: I printed it to save you. To show you where the boundary lies. A nun correcting a sermon by Vieira—it invites ridicule. It invites questions about where your obedience ends.

  Sor Juana: Obedience is to God, Excellency. If Vieira's logic contradicts the Church Fathers, pointing it out is not disobedience. It is charity.

  Bishop: It is vanity. You dress curiosity in the robes of charity. St. Paul is clear: women should learn in silence and submission. He does not grant license to dispute theology in print.

  Sor Juana: St. Paul speaks of authority in the church, not reason in the cell. If God gave me intellect, is it not a greater sin to bury it than to use it?

  Bishop: God gave you intellect to know Him, not to know the world. You spend hours on geometry, on secular verses, when you should be on your knees. You trade the Divine Office for astrolabes.

  Sor Juana: Is the world not God's creation? To understand the proportions of the universe is to understand the Mind that shaped it. When I study, I pray.

  Bishop: That is a convenient heresy. Your vow separates you from the world. You are a bride of Christ, not a professor of philosophy. When the people see a nun debating bishops, they lose respect for the veil. They see a woman, not a servant of God.

  Sor Juana: Then let them respect the mind God placed within the veil. If my sex is a barrier to truth, why did God grant me understanding? Did He err?

  Bishop: He granted you enough to save your soul. He did not grant you authority to teach men. Look at St. Catherine. She is an exception, not a rule. You risk scandalizing the faithful for the sake of pride.

  Sor Juana: Is it pride to refuse ignorance? If I stop studying, I stop living. You ask me to kill the part of me that loves God most.

  Bishop: I ask you to sacrifice your will. That is the vow. Obedience is higher than intellect. Submit to the judgment of your superiors. Cease the secular writing. Burn the books.

  Sor Juana: If I burn the books, I burn the ladder You climbed to reach me. You ask me to thank God by blinding myself to His works.

  Bishop: I ask you to save your soul from the pride of Lucifer. He knew much, and he fell. Knowledge without humility is damnation. Will you risk your eternity for a sonnet?

  Sor Juana: I would risk it for the truth God wrote in my reason. To deny that gift is to call the Giver a liar.

  Bishop: Then you leave me no choice. If you will not obey for humility's sake, you shall obey for discipline's sake. No more ink. No more books.

  Sor Juana: You can take the ink, Excellency. But you cannot take the thought.

  Bishop: We shall see if silence teaches you what books have not.

  Sor Juana: Silence teaches only what one already knows. And I know too much to unlearn it.
