answer: |-
  It is a pleasure to address a colleague who knows the kaon system better than most philosophers know their own names. You are quite right to be irritated by the casual assertion in the philosophy of literature that "the fundamental laws are time-reversal invariant." As you note, since 1964 (and directly since the 1990s), we know that $T$ is not a symmetry of the Hamiltonian.

  However, your intuition that this fact is philosophically idle regarding the *thermodynamic* arrow is correct. The reason is not the smallness of the parameter $\epsilon$, but a category error regarding what $T$-violation achieves versus what the Second Law requires.

  To argue that $T$-violation cannot replace the Past Hypothesis (PH), we must distinguish between **dynamical asymmetry** (the inequality of transition probabilities between time-reversed states) and **thermodynamic irreversibility** (the evolution from low-measure to high-measure macro-regions).

  Here is the principled argument for why even maximal microscopic $T$-violation fails to ground the thermodynamic arrow without a boundary condition.

  ### 1. Unitarity and Measure Preservation
  The most fundamental reason the PH survives $T$-violation unscathed is that the $T$-violation in the Standard Model occurs within a **unitary** framework.

  In classical Hamiltonian mechanics, Liouville's theorem guarantees that phase space volume is preserved under time evolution. In quantum mechanics, unitary evolution preserves the inner product and the trace of the density matrix. Crucially, this measure-preservation holds even if the Hamiltonian is not $T$-invariant.

  $T$-violation means that for some states $|\psi\rangle$ and $|\phi\rangle$, the transition probability $P(\psi \to \phi) \neq P(T\phi \to T\psi)$. It does *not* mean that the flow of probability density contracts or expands in Hilbert space. The "fluid" of probability is incompressible.

  Thermodynamic entropy increase, in the Boltzmannian picture, is essentially a measure-theoretic statement: systems evolve from macro-regions of small phase-space volume to macro-regions of large phase-space volume. If the dynamics are measure-preserving (which unitary $T$-violating dynamics are), they cannot, on their own, drive a system from a small region to a large region *preferentially* without a constraint on where the system starts.

  If you distribute an ensemble uniformly over the energy shell, a measure-preserving flow—$T$-violating or not—will keep it distributed uniformly. It will not spontaneously clump into low entropy, nor will it systematically drive *all* trajectories toward high entropy if they start in equilibrium. To get a systematic flow from small to large volumes, you must start the system in a small volume. That is precisely the Past Hypothesis. $T$-violation changes the *paths* the system takes through phase space, but it does not change the *volumes* of the destinations.

  ### 2. The Distinction Between Micro-Asymmetry and Macro-Gradient
  There is a level confusion in hoping $T$-violation explains the Second Law. $T$-violation is a property of specific microscopic transition amplitudes. The thermodynamic arrow is a property of **coarse-grained macrostates**.

  Even if $T$-violation were maximal (say, order unity), it would establish that process $A \to B$ is more likely than $T B \to T A$. But this does not entail that $S(B) > S(A)$.
  *   $A$ and $B$ are microstates (or narrow wavepackets).
  *   Entropy is defined over macrostates $M_A, M_B$, which are unions of vast numbers of microstates.

  For $T$-violation to explain the Second Law, the bias in microscopic transitions would have to align systematically with the gradient of macrostate volumes. There is no principled reason to expect this. The weak interaction distinguishes left from right and matter from antimatter; it has no known coupling to "phase space volume" or "coarse-grained disorder."

  Without a mechanism linking the $T$-violating phase in the CKM matrix to the topological size of macro-regions in phase space, the $T$-asymmetry is orthogonal to the entropy gradient. You could have a universe with maximal $T$-violation where entropy decreases towards the future, provided the boundary condition was a low-entropy state in the *future* rather than the past. The $T$-violating laws would simply dictate the specific microscopic trajectory taken during that decrease.

  ### 3. Huw Price's "Independence of Direction" Argument
  The philosopher Huw Price (in *Time's Arrow and Archimedes' Point*) has articulated this point sharply, and it resonates with your background. The argument is that $T$-violation is **time-asymmetric**, but the thermodynamic arrow requires **time-directedness**.

  Consider a universe without a Past Hypothesis (a "Boltzmann universe" fluctuating around equilibrium). In such a universe, entropy gradients would appear locally, but they would point in both temporal directions relative to any coordinate $t$.
  *   If $T$-violating laws *caused* the arrow, then the direction of entropy increase should be fixed by the laws alone, regardless of boundary conditions.
  *   However, statistical mechanics tells us that if we impose a low-entropy constraint at $t_{final}$ instead of $t_{initial}$, the entropy will increase towards the *past* (relative to our usual orientation).

  The $T$-violating laws are compatible with *both* scenarios. They do not force the entropy gradient to point towards the future; they only constrain the microscopic details of the evolution along the gradient. Therefore, the *orientation* of the gradient (why it points to the future rather than the past) cannot come from the laws. It must come from the asymmetry of the boundary conditions (the PH).

  ### 4. The "Branch System" Problem
  We observe entropy increase not just in the universe as a whole, but in isolated subsystems (branch systems) that decouple from the environment.
  *   If the thermodynamic arrow were grounded in $T$-violating dynamics, every isolated subsystem should exhibit entropy increase driven by those dynamics.
  *   However, for a subsystem to exhibit irreversible behavior, it must be uncorrelated with its environment at the start of the interaction (the "Stosszahlansatz" or molecular chaos assumption).

  Why are subsystems uncorrelated at the *beginning* of their isolation but correlated at the *end*? This asymmetry of correlation cannot be generated by measure-preserving dynamics alone, even $T$-violating ones. It requires that the global state was such that subsystems emerged from a low-entropy background in a factorized state. This global constraint is, again, the Past Hypothesis. $T$-violation in the kaon sector does nothing to explain why your coffee cup is uncorrelated with the air molecules before you pour it, but correlated after.

  ### Conclusion
  You are correct that the textbook philosophical premise "laws are $T$-invariant" is physically outdated. However, the *structural role* that premise plays in the argument is not to deny weak interaction physics, but to highlight that **dynamical asymmetry $\neq$ thermodynamic irreversibility.**

  Because the $T$-violating dynamics of the Standard Model are unitary (measure-preserving), they cannot account for the flow from low-measure to high-measure macro-regions without a constraint on the initial measure. Because they operate at the microscopic level, they do not dictate the orientation of the macroscopic entropy gradient. And because they are compatible with entropy decreasing towards the future (given a future boundary condition), they cannot fix the arrow's direction.

  The Past Hypothesis is required to break the symmetry of *probability measures*, not just dynamical laws. $T$-violation adds texture to the trajectories, but the Past Hypothesis builds the slope they slide down. Without the slope, the texture doesn't produce a flow. Thus, the retirement project of reading Albert and Loewer remains safe: the arrow of time is still a consequence of where we started, not how the kaons oscillate.
