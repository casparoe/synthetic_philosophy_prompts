          *   View A: Advisor's history makes them hypocritical/unqualified to criticize harshly.
          *   View B: Past regretted mistakes don't disqualify someone from enforcing standards now.
      *   **User's Goal:** Wants perspective on which view is "closer to right," why, and what facts are doing the work in the disagreement.
      *   **Tone:** Objective, ethical, nuanced, analytical.

