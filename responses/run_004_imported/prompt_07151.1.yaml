          *   *Universalism:* Any two things compose something, wedding or not. Marriage adds nothing metaphysically.
          *   *Nihilism:* No composite objects exist (no Priya, no Marcus), only simples arranged "Priya-wise" or "spousally."
      *   **The Audience:** 8 metaphysicians (will spot errors/fudges) + 40 relatives (need warmth/accessibility).
      *   **The Goal:** A 3-4 minute speech that takes the Special Composition Question (SCQ) seriously as its *backbone*, acknowledges the philosophical difficulties, but still lands warmly and romantically without ruining the mood.
