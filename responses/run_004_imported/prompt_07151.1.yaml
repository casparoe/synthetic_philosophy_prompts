          *   *Universalism:* You were already a thing before the wedding.
          *   *Nihilism:* You don't exist.
      *   **The Turn:** Why does this matter? Because if ontology can't ground the "oneness," what does?
      *   **The Resolution:** Composition isn't just about physics or biology; it's about *commitment*. The "object" they compose is a shared life, a joint agency. It's a *social* and *normative* object that functions *like* a composite.
      *   **The Toast:** Bring it back to emotion. The philosophy validates the effort. It's hard to compose something new. That's why the vow matters.

  4.  **Refining the Tone:**
      *   *Constraint Check:* 3-4 minutes spoken is roughly 450-600 words.
      *   *Audience Check:* Needs to be clear for Aunt Linda but precise for Dr. Marcus.
      *   *Philosophical Accuracy:* Ensure van Inwagen's "Life" condition is represented correctly (activities constitute a life). Ensure Universalism and Nihilism are distinct.
      *   *Emotional Arc:* Start witty, go deep, end warm.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. Marcus won the argument. Van Inwagen says no composition. Universalism says it's trivial. Nihilism says you don't exist. But I think marriage is special. It's not biological composition. It's choosing to act as one. So even if the universe doesn't count you as one, you choose to be. Cheers.

