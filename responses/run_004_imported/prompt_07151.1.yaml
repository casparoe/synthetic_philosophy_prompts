answer: |-
  Good evening. For those who don't know me, I'm the Maid of Honor, and I'm also the person who, at the engagement party, made the fatal mistake of telling Priya and Marcus that marriage meant they were "finally composing one whole."

  I said it as a toast. Marcus heard it as a thesis statement. And because he is a metaphysician of the highest order, he spent the next two hours dismantling my sentimentality with Peter van Inwagen's *Material Beings*.

  So, I went home and I read the literature. And I have to admit, for the eight people in this room who know the Special Composition Question: Marcus was right.

  If we look at **Organicism**, composition only occurs when the activities of parts constitute a single life. Priya and Marcus are not a single biological organism. They breathe separately; they have separate heartbeats.
  If we look at **Universalism**, then yes, they compose an object—but so did they before they met. The wedding changes nothing ontologically.
  And if we look at **Nihilism**… well, strictly speaking, there is no Priya and there is no Marcus. There are only simples arranged Priya-wise and simples arranged Marcus-wise, now preparing to be arranged spousally.

  None of these standard answers give us the romance we came for. Ontology does not owe us a "happily ever after."

  But here is what I realized while wading through the literature of mereology: All those theories describe how the world *is*. They describe passive composition. Things compose objects because of physics, or biology, or brute fact.

  Marriage is different. Marriage is the only time composition is *voluntary*.

  Priya and Marcus are not becoming a single organism. They are not waiting for the universe to accidentally glue them together. They are standing here, as two distinct, autonomous agents, and *choosing* to act as one.

  In a room full of metaphysicians, I can say this with confidence: The "whole" they are composing today is not a material object. It is a shared agency. It is a joint narrative. It is a commitment that when the world asks, "Who are you?" the answer is no longer just "I," but "We."

  Van Inwagen asks when composition occurs. My answer is this: Composition occurs when the promise is made.

  It is harder to compose a life together than it is to simply be one organism. An organism doesn't choose its parts. But Priya and Marcus have looked at the chaos of the universe, looked at the simples arranged around them, and decided to bind their futures into a single, coherent story.

  So, to the metaphysicians: You can keep your ontological categories.
  And to the rest of the family: You can keep your idea of "oneness."

  But to Priya and Marcus: May your composition be enduring. May your shared life be the one thing in this universe that is more than the sum of its parts, not because physics demands it, but because you will it.

  Cheers.
