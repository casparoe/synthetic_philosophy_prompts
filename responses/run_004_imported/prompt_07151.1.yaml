  6.  **Drafting - Iteration 2 (Adding Flavor):**
      Start with the engagement party. Mention *Material Beings*. Acknowledge the "Life" condition. Then pivot. The "Whole" isn't a substance, it's a *project*. The SCQ asks when composition happens. I say it happens when you promise.
