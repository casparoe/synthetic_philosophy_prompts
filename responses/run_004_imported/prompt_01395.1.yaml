      *   *Idea 2 (The Completion Argument):* Development happens *within* life. Death is the period at the end of the sentence. The sentence is complete without a sequel.
      *   *Idea 3 (The Illusion of Self):* This is the strongest philosophical match for Spinoza/Einstein. If the "self" is a boundary we draw around a temporary collection of matter/energy, then "survival" is a category error. The rational order *includes* death as a necessary function.
