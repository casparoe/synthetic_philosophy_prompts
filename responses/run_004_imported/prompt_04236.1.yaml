prompt: |-
  so my friend and i got into a whole thing last night about whether newton actually believed in a personal God or was basically just doing theology-flavored physics, and we ended up stuck on this bit from the General Scholium (the part he tacked onto the back of the Principia, not the Daniel/Revelation stuff):

  "For God is a relative word, and has a respect to servants; and Deity is the dominion of God, not over his own body, as those imagine who fancy God to be the soul of the world, but over servants. The supreme God is a Being eternal, infinite, absolutely perfect; but a being, however perfect, without dominion, cannot be said to be Lord God; for we say, my God, your God, the God of Israel, the God of Gods, and Lord of Lords; but we do not say, my Eternal, your Eternal, the Eternal of Israel, the Eternal of Gods; we do not say, my Infinite, or my Perfect: these are titles which have no respect to servants. The word God usually signifies Lord; but every lord is not a God. It is the dominion of a spiritual being which constitutes a God: a true, supreme, or imaginary dominion makes a true, supreme, or imaginary God. And from his true dominion it follows that the true God is a Living, Intelligent, and Powerful Being; and, from his other perfections, that he is Supreme, or most Perfect."

  my friends take is that this is just newton being a careful inductive scientist, building God's attributes up from what the design of the universe shows, same spirit as the rest of the scholium's "no hypotheses" thing. i think somethings weirder going on: he's basically defining "God" as a title you earn through dominion rather then something about sharing one divine substance, which seems to make godhood a matter of degree ("a true, supreme, or imaginary dominion makes a true, supreme, or imaginary God") instead of a flat yes/no. given that we know he privately rejected the trinity, that structure feels like its quietly doing doctrinal work rather than staying neutral like he claims elsewhere. am i overreading the logic here, or does grounding deity in "dominion" actually carry the implications i think it does? and why bother with the my-God-vs-my-Eternal word-usage argument at all if the point were purely empirical/inductive?
