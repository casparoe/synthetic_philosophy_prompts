answer: |-
  You are definitely not overreading this. In fact, you have put your finger on one of the most significant theological "tells" in Newton's public writing. Your friend is reading Newton the way Newton *wanted* to be read by the orthodox establishment (as a pious natural theologian), but you are reading Newton the way modern intellectual historians read him (as a covert Arian engaging in strategic metaphysics).

  Here is the breakdown of why your intuition is correct, why the "dominion" definition is the smoking gun for his anti-Trinitarianism, and why the linguistic argument is doing heavy doctrinal lifting.

  ### 1. Ontology vs. Function (The "Dominion" Shift)
  Your friend argues Newton is being inductive, building attributes from observation. But look at the move Newton makes: he shifts the definition of God from **ontology** (what God *is*) to **function** (what God *does*).

  *   **Orthodox/Trinitarian View:** God is God by *essence*. The Father, Son, and Holy Spirit share the same divine substance (*homoousios*). You cannot have "more" or "less" of God. You either possess the divine essence or you don't.
  *   **Newton's View:** "It is the dominion of a spiritual being which constitutes a God."

  This is massive. If Godhood is constituted by *dominion* (authority/rule), then it is contingent on power and position, not necessary existence. This allows for a hierarchy. If Godhood is a job title ("Lord"), then someone else can hold a lesser version of that title.

  This is the core of **Arianism** (or Subordinationism), which Newton privately held. He believed the Father was the only "Supreme God," while the Son was a divine being created by the Father, given dominion over the universe, and therefore worthy of the title "God" in a secondary sense.

  When Newton writes, *"a true, supreme, or imaginary dominion makes a true, supreme, or imaginary God,"* he is explicitly stating that "God" is a scalable category. In Nicene orthodoxy, an "imaginary God" is an idol, not a lesser degree of deity. Newton's phrasing suggests that "God" is a status conferred by power. This is not an inductive conclusion from gravity; it is a metaphysical claim designed to allow for a subordinate Christ.

  ### 2. The Linguistic Argument ("My God" vs. "My Eternal")
  You asked: *Why bother with the my-God-vs-my-Eternal word-usage argument at all if the point were purely empirical/inductive?*

  Exactly. If Newton were merely arguing from the design of the solar system to a Designer, he wouldn't need to parse Hebrew/Greek semantics regarding the word "Lord."

  He includes this linguistic analysis for two reasons:
  1.  **Scriptural Cover:** Newton was a deep student of biblical prophecy and Hebrew. He knows that in Scripture (particularly the Old Testament), the word *Elohim* is sometimes applied to judges, Moses, or angels. By arguing that "God" signifies "Lord" (a relational title) rather than "Eternal" (an abstract attribute), he is aligning his definition with specific biblical passages that Arians used to prove the Son was distinct from the Father.
  2.  **Bypassing the Creed:** The Nicene Creed defines God in terms of being ("Light of Light," "Very God of Very God"). Newton wants to define God in terms of *relationship* ("respect to servants"). If "God" means "Lord," then Jesus can call the Father "my God" (which he does in the New Testament, e.g., John 20:17), implying the Father has dominion *over* Jesus. If "God" meant "Eternal Substance," Jesus calling the Father "God" would be nonsensical if they were co-equal.

  Newton is using linguistics to undermine the metaphysical basis of the Trinity without explicitly attacking the Trinity. It looks like semantic pedantry, but it's doctrinal sabotage.

  ### 3. The "No Hypotheses" Camouflage
  Your friend is right that this appears in the *General Scholium*, which follows the *Principia*, and Newton famously claimed *Hypotheses non fingo* (I frame no hypotheses).

  However, historians like **Stephen Snobelen** and **Rob Iliffe** (the leading experts on Newton's theology) point out that Newton distinguished between "hypotheses" in natural philosophy (mechanisms of gravity) and "truths" derived from prophecy and natural theology.

  Newton knew that if he explicitly denied the Trinity in print, he would have been stripped of his position at Cambridge and the Mint (anti-Trinitarianism was illegal in England until the 1810s). So, he had to write the *General Scholium* in a way that:
  *   Sounded pious enough to satisfy orthodox critics (like Leibniz, who accused Newton of making God a mere watchmaker).
  *   Was technically precise enough to satisfy his own conscience (by not calling the Son the "Supreme God").

  The "dominion" argument is the compromise. It allows him to say, "I believe in the Supreme God (the Father)," which is orthodox, while implying, "...and other beings might have lesser dominion," which is not.

  ### 4. Conclusion: You Win the Debate
  Your friend sees Newton the **Natural Philosopher**, trying to infer a Designer from the order of the planets.
  You see Newton the **Theologian**, trying to redefine the nature of Deity to fit a heterodox worldview.

  Both are true, but your reading captures the *intent* of that specific passage better.
  *   **Is it empirical?** No. You cannot observe "dominion" empirically. It is a philosophical/theological category.
  *   **Is it neutral?** No. It actively privileges a Subordinationist view of God over a Consubstantialist one.
  *   **Does it imply degrees of Godhood?** Yes. That is exactly what "supreme or imaginary dominion" implies.

  Newton isn't just describing the universe; he is quietly rewriting the job description of God to ensure the Son doesn't apply for the position of "Supreme." You aren't overreading; you're reading the subtext Newton hid in plain sight.

  **Recommended reading if you want to cement your argument:**
  *   Look up **Stephen Snobelen's** work on "Newton and the 'God of Dominion'."
  *   Check out **Rob Iliffe's** *Priest of Nature: The Religious Worlds of Isaac Newton*. Iliffe details how Newton spent more time writing about theology than physics, and how carefully he coded his public statements.

  Tell your friend: If Newton were just doing inductive science, he would have stopped at "Intelligent Cause." The moment he started defining the etymology of "Lord" vs. "Eternal," he left the lab and entered the church council.
