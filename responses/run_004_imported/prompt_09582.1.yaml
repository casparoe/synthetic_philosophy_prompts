prompt: |-
  so i'm on my school's Honor Council (a mix of students and two teachers that hears academic integrity cases and recommends a consequence to the principal), and Thursday we've got a case messier than the usual copy-off-your-friend stuff. A kid wrote his own rough draft of a history essay, then had an AI tool reword two paragraphs before turning it in. Our honor code just bans letting "someone or something else do the work for you," it doesnt say how much help counts. His defense: everyone uses Grammarly to fix sentences and that's allowed, and if fixing one sentence is fine and fixing two isn't really different, you can't draw a line anywhere before what he did without that line being arbitrary -- which honestly sounds like the heap/sorites paradox we covered in philosophy class. Half the council wants to make an example of him, the other half thinks that's unfair since the policy never specified where the line is. Can you write the short memo I'd circulate before the meeting -- it needs an actual recommendation for his case plus better wording for the policy going forward, and it has to seriously engage with the "you can't punish me for crossing a line nobody drew" argument instead of just brushing it off.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the School Honor Council (student).
      *   **Audience:** Other Honor Council members (students + 2 teachers) and potentially the Principal (since recommendations go there).
      *   **Task:** Write a pre-meeting memo.
      *   **Case:** Student wrote a draft, used AI to reword two paragraphs.
      *   **Defense:** "Sorites Paradox" argument (Grammarly is okay, AI is just advanced Grammarly, where's the line? Punishing me for an undefined line is unfair).
      *   **Council Status:** Split 50/50 (make an example vs. unfair due to vague policy).
      *   **Requirements:**
          1.  Actual recommendation for *this* case.
          2.  Better wording for the *future* policy.
          3.  Seriously engage with the "undefined line/arbitrary punishment" argument (don't brush it off).
          4.  Tone: Professional, thoughtful, persuasive, appropriate for a school setting.

  2.  **Deconstruct the Ethical/Legal Problem:**
      *   *The Act:* AI rewriting two paragraphs of a history essay.
      *   *The Code:* "Someone or something else do the work for you."
      *   *The Defense:* The Sorites Paradox (Heap Paradox). If 1 word changed is okay, and 10 is okay, where does 1000 become cheating? Also, reliance on precedent (Grammarly).
      *   *The Counter-Argument:* Intent and Substance. Grammarly fixes mechanics (spelling, grammar). AI rewriting changes *voice, synthesis, and argumentation*. It crosses from "editing" to "authoring."
      *   *The Fairness Issue:* *Nullum crimen sine lege* (no crime without law). You can't punish someone if the rule wasn't clear. However, schools operate on *intent* and *academic norms*, not just criminal law.
      *   *Resolution:* Acknowledge the ambiguity (validating the student's point) but uphold the spirit of the code (academic integrity). Recommend a lighter sanction due to ambiguity but enforce the principle. Update the policy to be specific.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose of the memo (prep for Thursday's case).
      *   **Engaging the Defense (The Core Challenge):**
          *   Need to address the Sorites Paradox directly.
          *   Acknowledge the validity: The line *is* blurry in the current text.
          *   Distinguish Grammarly vs. AI: Grammarly = Mechanics (surface). AI Rewriting = Composition (substance).
          *   Address the "Fair Notice" argument: Admit the policy is vague. This mitigates the severity of the punishment but doesn't negate the violation.
      *   **Recommendation for Current Case:**
          *   Cannot be "expulsion" (too harsh given ambiguity).
          *   Cannot be "nothing" (undermines integrity).
          *   *Middle Ground:* Finding of Violation, but reduced sanction. Educational penalty (redo, workshop) rather than punitive (suspension). Acknowledge the "gray area" status.
      *   **Policy Revision:**
          *   Need to define "work."
          *   Distinguish between "editing tools" and "generative tools."
          *   Require disclosure/citation of AI use.
      *   **Closing:** Call to action for the meeting.

  4.  **Refining the Tone:**
      *   *Too Formal:* "Pursuant to the regulations..." (Sounds like a lawyer).
      *   *Too Casual:* "Hey guys, this sucks..." (Unprofessional).
      *   *Just Right:* "Colleagues," "Academic Community," "Nuanced." Needs to sound like a responsible student leader.
      *   *Addressing the Paradox:* Use the philosophy reference. It shows respect for the defendant's intellect.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey Council. Thursday is tough.
      *   Kid says AI is like Grammarly. He used a philosophy paradox to say the line is arbitrary.
      *   He's right that the rule is vague. We can't ignore that.
      *   But AI writing paragraphs is different than fixing commas. It does the thinking.
      *   Recommendation: Guilty, but light punishment. Make him redo it.
      *   New Rule: You can use AI for brainstorming but must cite it. Can't use it to write prose.
      *   Let's discuss Thursday.

  6.  **Drafting - Iteration 2 (Fleshing out the arguments):**
      *   *The Sorites Point:* I need to explicitly mention that while the *quantity* of change might be a spectrum, the *nature* of the change is categorical. Grammarly polishes *your* voice. AI replaces *your* voice.
      *   *The Fairness Point:* If we punish him heavily, we look tyrannical. If we let him go, we look weak. The "Educational Sanction" is the key.
      *   *Policy:* Needs to mention "disclosure." If he had said "I used AI," maybe it would be okay? No, the prompt says "do the work for you." So rewriting is likely still out, but disclosure is key for the future.

  7.  **Final Polish (incorporating into the final output):**
      *   Make sure the distinction between *mechanics* and *composition* is clear.
      *   Ensure the policy language is concrete (e.g., "Generative AI," "Disclosure").
      *   Check that the "arbitrary line" argument is treated with intellectual respect.

  8.  **Review against Constraints:**
      *   Short memo? Yes.
      *   Recommendation included? Yes.
      *   Policy wording included? Yes.
      *   Engages with Sorites/Fairness argument? Yes.

  **(Self-Correction during drafting):** I initially thought about suggesting he's not guilty. But he did have AI write two paragraphs. That *is* someone else doing the work. The fairness issue is about the *consequence*, not the *finding*. I should recommend a finding of responsibility but a mitigated sanction. This validates the Council's authority while acknowledging the student's valid point about notice.

  9.  **Finalizing the Text:** (Proceeds to generate the response based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Honor Council Members
  **FROM:** [Your Name/Position]
  **DATE:** October 23, 2023
  **SUBJECT:** Pre-Meeting Brief: Case #24-09 (AI Usage & Policy Ambiguity)

  **Purpose**
  This memo outlines a proposed framework for Thursday's hearing regarding the student who utilized AI to reword two paragraphs of a history essay. Our current Honor Code prohibits having "someone or something else do the work for you," but does not define the threshold of assistance. This case requires us to balance upholding academic integrity with the fairness principle of *nullum crimen sine lege* (no penalty without a clear law).

  **Engaging the Defense: The "Arbitrary Line" Argument**
  The respondent's defense relies on the Sorites Paradox: if fixing one sentence with technology is permissible (e.g., Grammarly), and fixing two is marginally different, where does the line become cheating? He argues that punishing him for crossing a line the school never drew is arbitrary and unfair.

  We must take this argument seriously. It is intellectually sound and highlights a genuine gap in our current policy. However, we must distinguish between **mechanical editing** and **compositional generation**.
  *   **Grammarly** operates on *mechanics* (spelling, syntax) while preserving the student's original voice and argumentation.
  *   **AI Rewriting** operates on *composition* (word choice, flow, synthesis), effectively outsourcing the cognitive labor of writing.

  While the *amount* of AI help might be a spectrum (the Sorites element), the *type* of help is categorical. The respondent did not just polish the surface; he delegated the act of authorship for those paragraphs. Therefore, a violation occurred. However, because the policy lacked specificity on "how much" assistance constitutes a violation, his claim of unfair notice is valid regarding the *severity* of the consequence, not the *finding* of responsibility.

  **Recommendation for Case #24-09**
  I recommend we find the student **Responsible**, but apply a **Mitigated Educational Sanction** rather than a standard punitive one.

  *   **Rationale:** A standard suspension or failing grade would be disproportionate given the policy ambiguity. However, a finding of "Not Responsible" sets a precedent that AI rewriting is permissible under the current code, which undermines our academic mission.
  *   **Proposed Sanction:** The student must rewrite the two paragraphs without AI assistance and submit a brief reflection on the difference between his original voice and the AI's output. No permanent disciplinary record notation.
  *   **Message:** This acknowledges the violation of the code's *spirit* while acknowledging the school's failure to provide clear *notice* on the specifics.

  **Proposed Policy Revision (For Principal's Review)**
  To prevent future ambiguity, I propose we recommend the following addendum to the Honor Code:

  > **Section X: Use of Generative Technology**
  > 1. **Permissible Use:** Students may use automated tools for mechanical editing (grammar, spelling, punctuation) provided the tool does not generate new ideas or arguments.
  > 2. **Prohibited Use:** Students may not use Generative AI to draft, rewrite, or synthesize course work. Submitting AI-generated text as one's own constitutes plagiarism.
  > 3. **Disclosure:** Any use of AI tools for brainstorming or editing must be disclosed to the instructor prior to submission. Failure to disclose constitutes a violation of integrity, even if the use itself was permissible.

  **Next Steps**
  Please review this framework before Thursday. Our goal is to issue a ruling that is firm on principles but fair on procedure. We need to show the student body that we understand the nuance of this technology, rather than simply reacting to it.

  See you Thursday.
