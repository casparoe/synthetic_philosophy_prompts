answer: |-
  Here are ten interview questions designed for your podcast episode. They are structured to move from the specific textual arguments in Anscombe's pamphlet to the broader theoretical tensions you encountered with your friend, ending with the hard consequentialist counter-argument.

  **1. The Intention/Foresight Criterion**
  Anscombe's central charge is that Truman *intended* the death of the innocent as a means to an end, rather than merely *foreseeing* it as a side effect of a military strike. But as my co-host's historian friend argued, in the fog of total war, these mental states can look identical from the outside. Without simply asserting that Truman's state of mind was murderous, what specific criterion do we use to distinguish intending civilian deaths as the very means of victory from merely foreseeing those deaths as a side effect of striking a legitimate target, such as a naval yard?
  *Follow-up:* Once you establish that criterion, does it hold up if we apply it to the conventional firebombing of Tokyo? If the physical destruction and civilian toll were similar, but the weapon wasn't atomic, does the intentionality shift, or does Anscombe's argument condemn the firebombing campaign with equal force?

  **2. The Definition of "Innocent"**
  Anscombe relies heavily on the just-war distinction of "innocence," defined technically as non-combatant status rather than moral purity. However, in 1945 Japan, the civilian population was deeply integrated into the war effort, manufacturing shells, engines, and supplies in urban centers. Can the label of "innocent" really do the normative work Anscombe needs it to do when the civilian population is functionally sustaining the army in the field? At what point does material contribution to aggression compromise immunity from direct attack?

  **3. The Authority to Kill**
  In the pamphlet, Anscombe suggests that Truman lacked the moral authority to order these killings, implying that there are certain acts a head of state is forbidden from doing even if a private citizen might claim self-defense. How do we square this with the traditional just-war view that the sovereign holds a unique monopoly on the use of force? Is Anscombe arguing that the prohibition on killing the innocent binds the state *more* tightly than the individual, and if so, on what grounds?

  **4. The Pacifism Tension**
  Anscombe was explicit that she was not a pacifist; she believed some wars could be justly fought. Yet she also holds an absolute prohibition on intentionally killing the innocent. Given that modern warfare almost inevitably involves collateral damage or the targeting of dual-use infrastructure, is there a risk that this absolute prohibition collapses into a *de facto* pacifism once total war is underway? How does one wage a just war under Anscombe's constraints without rendering the concept of "just war" practically empty?

  **5. The "Military Necessity" Defense**
  Truman and his defenders argued that the bombings were acts of military necessity intended to shock the Japanese leadership into surrender, thereby saving lives overall. If we grant for the sake of argument that the bombings *did* achieve a surrender that otherwise wouldn't have happened, does the truth of that counterfactual change the moral quality of the act? Or is the "necessity" defense irrelevant if the act itself is intrinsically prohibited?

  **6. The Role of the Honorary Degree**
  Much of the pamphlet focuses specifically on Oxford's decision to award the degree, not just on the bombing itself. Anscombe suggests that honoring Truman compounds the injustice by signaling that the ends justified the means. Do you think the academic protest was strategically effective? Does conferring an honor on a leader retroactively endorse their wartime decisions in a way that normalizes the violation of non-combatant immunity?

  **7. Mens Rea and Historical Judgment**
  One difficulty in applying Anscombe's framework historically is accessing the *mens rea* of the decision-maker. Truman may have sincerely believed he was targeting military capacity, viewing the city as a military target. How much does the agent's own understanding of their action matter for Anscombe's judgment? If Truman genuinely believed the city was a legitimate military objective, is he still guilty of murder in the sense Anscombe means, or is he guilty of a different error?

  **8. Contemporary Application: Drones and Automation**
  Anscombe wrote in the age of area bombing, but today we have precision-guided munitions and autonomous drones. Does Anscombe's argument against Truman become stronger or weaker in the context of modern technology? If we have the capacity to strike with greater precision, does the threshold for what counts as "intending" civilian death lower, because we have more control over the side effects?

  **9. Virtue and National Character**
  As a virtue ethicist, Anscombe was concerned not just with the act but with the character of the agent. She argued that by ordering the bombings, the United States corrupted its own moral standing. Beyond the immediate loss of life, what is the long-term cost to a nation's moral character when it adopts a policy that treats the killing of innocents as a permissible tool of statecraft?

  **10. The "Lesser Evil" Counterfactual**
  I want to close on the hardest objection, the one that stalled my dinner conversation. The standard reply is that the bombings, terrible as they were, killed far fewer people than a full-scale invasion of the home islands would have. If you are forced to choose between an act that violates the absolute prohibition on killing innocents and an act that leads to a significantly higher death toll overall, do you bite the bullet and say the prohibition holds regardless of the body count? Or is there *any* threshold of catastrophe that would count as a legitimate exception to the rule?
