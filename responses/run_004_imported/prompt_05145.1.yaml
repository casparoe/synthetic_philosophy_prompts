answer: |-
  This is one of the sharpest objections to the standard coherence theorems, and you are right that it is often waved away rather than engaged. The "resolute choice" model (most famously developed by Edward McClennen in *Rationality and Dynamic Choice*) does indeed break the mechanical link between *cyclic preferences* and *sure loss*—but only by shifting the locus of rationality.

  Here is the concrete build you asked for, followed by the verdict on what it actually implies.

  ### 1. The Setup: A Concrete Preference Cycle

  Let's define three distinct bundles of goods. To make the preference cycle plausible (since transitivity is usually assumed for a reason), we will use multi-attribute goods where different attributes dominate in pairwise comparisons.

  *   **Option A:** A weekend trip to the **Mountains**. (High scenery, low comfort).
  *   **Option B:** A weekend trip to the **Beach**. (High comfort, low scenery).
  *   **Option C:** A weekend trip to the **City**. (High culture, medium scenery/comfort).

  **The Agent's Preferences:**
  *   **$A \succ B$**: When comparing Mountains vs. Beach, the agent values Scenery most. Mountains win.
  *   **$B \succ C$**: When comparing Beach vs. City, the agent values Comfort most. Beach wins.
  *   **$C \succ A$**: When comparing City vs. Mountains, the agent values Culture/Activity most. City wins.

  **The Bookie's Setup:**
  *   The agent currently owns **Option A** (Mountain ticket).
  *   The Bookie offers trades sequentially.
  *   Each trade costs a small fee, $\epsilon = \$10$.
  *   The agent has a strict preference for more money over less, holding the trip constant.

  ---

  ### 2. The Naive Agent (The Money Pump)

  A naive (or "myopic") agent evaluates each choice node in isolation. They do not anticipate future offers, or they treat their future self as a separate agent whose choices they cannot control. They satisfy the **Separability Condition**: preferences at a node depend only on the immediate branches, not the history or future of the tree.

  **Sequence of Events:**

  1.  **Node 1:** Agent holds **A**. Bookie offers: "Trade **A** for **C**, pay \$10."
      *   *Local Evaluation:* Agent compares **A** vs. **C - \$10**.
      *   *Preference:* Since $C \succ A$, and \$10 is negligible relative to the trip value, the agent prefers **C - \$10**.
      *   *Action:* **Trade.** (Current holdings: **C**, Cash: $-\$10$).

  2.  **Node 2:** Agent holds **C**. Bookie offers: "Trade **C** for **B**, pay \$10."
      *   *Local Evaluation:* Agent compares **C** vs. **B - \$10**. (Note: The naive agent ignores the sunk cost of the previous \$10).
      *   *Preference:* Since $B \succ C$, the agent prefers **B - \$10**.
      *   *Action:* **Trade.** (Current holdings: **B**, Cash: $-\$20$).

  3.  **Node 3:** Agent holds **B**. Bookie offers: "Trade **B** for **A**, pay \$10."
      *   *Local Evaluation:* Agent compares **B** vs. **A - \$10**.
      *   *Preference:* Since $A \succ B$, the agent prefers **A - \$10**.
      *   *Action:* **Trade.** (Current holdings: **A**, Cash: $-\$30$).

  **Result:** The agent ends with **Option A** and **$-\$30$**. They started with **Option A** and **\$0**. They have been pumped.

  ---

  ### 3. The Resolute Agent (The Escape Hatch)

  A resolute agent does not satisfy Separability. Instead, at the initial node (Node 0), they survey the entire decision tree. They identify all possible *complete plans* (strategies) from start to finish. They rank these plans according to their preferences, choose the highest-ranked plan, and then **commit** to executing it, overriding any local preferences that arise at later nodes.

  **The Decision Tree & Possible Plans:**

  *   **Plan 1 (The Null Plan):** Reject Trade 1.
      *   *Outcome:* Keep **A**. Cost: \$0.
      *   *Terminal State:* **A**.
  *   **Plan 2 (Stop at C):** Accept Trade 1, Reject Trade 2.
      *   *Outcome:* Get **C**. Cost: \$10.
      *   *Terminal State:* **C - \$10**.
  *   **Plan 3 (Stop at B):** Accept Trade 1, Accept Trade 2, Reject Trade 3.
      *   *Outcome:* Get **B**. Cost: \$20.
      *   *Terminal State:* **B - \$20**.
  *   **Plan 4 (The Full Cycle):** Accept Trade 1, Accept Trade 2, Accept Trade 3.
      *   *Outcome:* Get **A**. Cost: \$30.
      *   *Terminal State:* **A - \$30**.

  **The Resolute Evaluation:**

  The resolute agent compares the *Terminal States* of these four plans.

  1.  **Compare Plan 1 vs. Plan 4:**
      *   Plan 1 yields **A**. Plan 4 yields **A - \$30**.
      *   By dominance (more money is better), **Plan 1 $\succ$ Plan 4**.
      *   *Crucial Move:* Even though the agent locally prefers $C \succ A$ at Node 1, they recognize that acting on that preference *in the context of the available future trades* leads to Plan 4, which is dominated by Plan 1.

  2.  **Compare Plan 1 vs. Plan 2:**
      *   Plan 1 yields **A**. Plan 2 yields **C - \$10**.
      *   Here is where the cyclic preference matters. Since $C \succ A$, the agent *might* prefer Plan 2 to Plan 1, provided the \$10 cost doesn't outweigh the preference for City over Mountains.
      *   *However*, to avoid the pump, the agent only needs to ensure they don't enter the *cycle*. If they choose Plan 2, they accept Trade 1, but then at Node 2, they must **resolutely reject** Trade 2, even though locally $B \succ C$.
      *   Why? Because their chosen plan was "Stop at C." Deviating from the plan at Node 2 would initiate a path toward Plan 3 or 4.

  **The Execution:**

  *   **At Node 1:** The Bookie offers Trade 1 ($A \to C$).
      *   *Naive Impulse:* "I want C more than A. Trade!"
      *   *Resolute Check:* "My chosen optimal plan is Plan 1 (Keep A). Therefore, I Reject Trade 1."
      *   *Action:* **Reject.**

  **Result:** The agent ends with **Option A** and **\$0**. No money lost. The cyclic preferences ($A \succ B \succ C \succ A$) remain intact in the agent's mind, but they never manifest in a self-defeating sequence of actions.

  ---

  ### 4. The Verdict: What Does This Actually Mean?

  You asked whether rationality is a property of a whole plan, or if resoluteness just smuggles consistency in at the level of plans.

  **My take: It smuggles consistency in.**

  The resolute choice defense saves the agent from losing money, but it does not save the agent from the requirement for coherence. It merely shifts the requirement from **preferences over outcomes** to **preferences over policies**.

  Here is why the "escape hatch" is leaky:

  **1. The Meta-Preference Must Be Transitive**
  For the resolute agent to choose Plan 1 over Plan 4, they must have a transitive preference regarding money ($A \succ A - \$30$). That's fine. But consider the ranking of the plans themselves.
  If the agent's underlying preferences are truly cyclic, their ranking of the plans might also cycle:
  *   Plan 2 ($C - \$10$) $\succ$ Plan 1 ($A$) [Because $C \succ A$]
  *   Plan 3 ($B - \$20$) $\succ$ Plan 2 ($C - \$10$) [Because $B \succ C$]
  *   Plan 4 ($A - \$30$) $\succ$ Plan 3 ($B - \$20$) [Because $A \succ B$]
  *   Plan 1 ($A$) $\succ$ Plan 4 ($A - \$30$) [Because Money]

  If the agent ranks the *plans* this way, they have a cycle over strategies: $P1 \succ P4 \succ P3 \succ P2 \succ P1$.
  A resolute agent chooses the "best" plan at the root. If their preferences over plans cycle, **there is no best plan.** They cannot resolve which policy to commit to. To be a resolute chooser, you *must* have a transitive ordering over the set of available strategies.

  **2. Dynamic Consistency is a Coherence Constraint**
  The resolute agent violates the **Separability Principle** (that choices should depend only on the current node and future consequences, not past history). By letting the *history* (i.e., "I am executing Plan 1") dictate the current choice, they are imposing a global constraint.
  This implies that "Rationality" is not about having consistent tastes in goods (Mountain vs. Beach); it is about having a consistent **governance structure** over time.
  The money pump argument doesn't prove you can't have cyclic tastes. It proves you can't have cyclic tastes *and* be a naive, separable maximizer. If you want cyclic tastes, you must pay the cognitive tax of maintaining a transitive meta-preference over plans to police them.

  **3. The "Smuggling" Conclusion**
  The money pump argument is often presented as: *"If your preferences cycle, you will lose money."*
  The resolute choice correction refines this to: *"If your preferences cycle, you will lose money **unless** you impose a transitive ordering on your actions across time."*

  This means coherence (transitivity) is not necessarily a property of the *world* (the goods), but it is an inescapable property of the *agent* (the decision process). You can have cyclic desires, but you cannot have cyclic *choice functions*. To act effectively, you must construct a utility function over *histories* or *plans* that is transitive, even if the utility function over *states* is not.

  So, does resolute choice refute the money pump argument? **No.** It validates it at a higher level of abstraction. It shows that while you can escape the pump with cyclic object-level preferences, you cannot escape the requirement for coherence itself. You just move the coherence requirement from "What do I want?" to "How do I govern what I want?"

  If you fail to be resolute, you get pumped on goods. If you fail to have transitive preferences over plans, you get pumped on policies. One way or another, incoherence leaks money.
