      *   **James Woodward (Interventionist/Manipulationist):**
          *   *Core:* $C$ causes $E$ iff there is a possible intervention on $C$ that changes $E$, while holding other relevant variables fixed. It's about invariant generalizations.
          *   *Problem Case:* Symmetric Overdetermination. Intervene on Belayer (set to "no grab") while holding Bystander fixed ("grab"). Result: Fall happens. So Belayer is a cause. Same for Bystander. Solves the overdetermination puzzle neatly.
