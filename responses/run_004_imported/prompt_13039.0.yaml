prompt: |-
  Okay so my friend and I got into it this weekend over causation and neither of us would budge, so now I need an actual referee. It started with this scenario: a climber is about to fall, and her belayer AND a random bystander both grab the rope at the exact same instant, and either grip alone would've been enough to stop the fall. Neither grip is individually necessary (if the belayer hadn't grabbed, the bystander's grip alone stops her, and vice versa), so on the plain old "if c hadn't happened, e wouldn't have happened" counterfactual test, neither of them technically caused her not falling, which feels wrong. My friend, who's been reading Woodward and doing the whole causal-graphs-and-interventions thing, said this is exactly why you should define causation through interventions instead of Lewis-style counterfactual dependence — basically ask what happens if you could surgically intervene on just one grip while holding the other fixed. I pushed back that this seems like it's just quietly re-importing the counterfactual test anyway, and also that "intervention" is itself obviously a causal notion, so defining causation via intervention feels circular. My friend says that's not a real problem because Woodward was never trying to reduce causation to something fully non-causal to begin with. We also got sidetracked on backtracking counterfactuals and on trumping preemption (the classic major-and-sergeant-both-shout-orders case) and whether either theory actually handles that more gracefully then the other, and honestly by the end neither of us remembered what we were even trying to prove.

  So can you properly referee this: compare Lewis's counterfactual theory of causation with Woodward's interventionist/manipulationist theory, specifically on how each one deals with preemption, trumping, and this kind of symmetric overdetermination case, and tell me whether the circularity charge against interventionism actually sticks or if Woodward's reply gets him off the hook. And if you had to actually bet on one — which theory is closer to getting causation right, or at least more useful for real causal inference — which would you pick and why? Don't give me a wishy washy "both have their merits" non-answer, I already have one friend who does that.
