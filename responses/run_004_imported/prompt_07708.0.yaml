answer: |-
  You have asked for a rigorous analysis rather than reassurance, and you have posed a specific philosophical question: *Can a person genuinely end up in a position where, whichever way they turn, they will have failed to do something they were truly obligated to do?*

  The honest answer is **yes**.

  In ethics, this is known as a **tragic dilemma** or a situation of **moral remainder**. It is not a failure of your imagination or your moral reasoning that you cannot find a way to discharge both duties. It is a feature of the situation itself. The discomfort you are feeling is not a signal that you are missing a variable; it is an accurate recognition of a moral loss that is about to occur.

  Here is an analysis of why this is the case, why the standard reassurances fail, and how to understand the nature of the obligation you are holding.

  ### 1. The Problem of Compossibility
  In logic and ethics, two duties are "compossible" if they can be performed together. Your parents, in extracting these promises, operated under the assumption that their deaths would be temporally distinct. They created obligations that were valid *ceteris paribus* (all other things being equal).

  However, reality has rendered the duties **incompossible**. You physically cannot be in Portland and Cleveland simultaneously. When two absolute obligations become incompossible due to no fault of the obligor (you), the structure of the morality changes.

  Standard reassurance ("do what you can") attempts to dissolve the dilemma by suggesting that physical impossibility negates moral obligation. This relies on the Kantian principle that *"ought implies can."* The argument is: *If you cannot do X, you are not obligated to do X.*

  While logically sound, this is emotionally and morally insufficient for your situation. Even if you are not *blameworthy* for breaking the promise, the promise is still *broken*. The duty to be present was real; the failure to fulfill it is real. Reassurance tries to tell you the failure didn't happen. Your intuition correctly tells you that it did.

  ### 2. Moral Remainders
  The philosopher Bernard Williams wrote extensively about "moral remainders." He argued that in genuine dilemmas, making the right choice does not erase the wrongness of the unchosen path.

  If you choose your mother, you have honored a duty to her, but you have *actually failed* a duty to your father. The feeling of guilt or regret you anticipate is not a symptom of irrationality; it is a **moral remainder**. It is the appropriate psychological residue of having violated a solemn commitment, even if that violation was unavoidable.

  To tell you "don't blame yourself" is to ask you to deny the value of the promise you made to the parent you do not choose. If the promise mattered, breaking it must matter, even if it was necessary. Your discomfort is the price of acknowledging that both parents mattered equally.

  ### 3. The Symmetry of the Obligation
  You asked if there is a consideration you haven't found that would rank one promise above the other. You noted that "no calculation I can run... tells me one promise is really weightier."

  It is highly probable that **no such calculation exists.**

  *   **Chronology:** One promise was made first, but the other was made later, potentially superseding the first in your mind at the time, or simply adding to the stack. Neither clearly voids the other.
  *   **Need:** Both are dying. Both have expressed a desire for exclusivity.
  *   **Agency:** You agreed to both in good faith.

  When duties are symmetrical and incompossible, seeking a moral hierarchy is often a trap. It is an attempt to solve a tragedy as if it were a puzzle. Puzzles have solutions; tragedies have costs. If you spend the remaining days searching for a tie-breaker, you may paralyze yourself.

  In the absence of a moral differentiator, the decision becomes **arbitrary** in the philosophical sense: not "random," but "not determined by moral weight." You may choose based on logistics, flight availability, or even a coin flip. Choosing based on logistics does not mean the duty to the other parent was lighter; it simply means you needed a heuristic to act.

  ### 4. The Source of the Bind
  A rigorous analysis must also look at the origin of the dilemma. You are the agent bound by the promises, but you are not the architect of the conflict.

  Your parents imposed a condition of **exclusivity** on a future event they could not control. By demanding that you not share your attention with the other, they created a fragile contract that relied on the world behaving predictably. The world did not.

  The "failure" you fear is a breach of contract. However, in contract law and ethics, a clause that becomes impossible to fulfill due to force majeure (an overwhelming, unforeseeable event) is often considered voided or suspended. The simultaneous death of both parties is the ultimate force majeure.

  You are not failing to honor the *spirit* of the promise (which was to provide comfort and witness their passing); you are being prevented from honoring the *letter* of the promise (exclusivity) by the very reality of their simultaneous decline. The fault lies in the rigidity of the demand, not the fidelity of the promise-keeper.

  ### 5. Conclusion: How to Proceed
  You asked if there is an answer that discharges both duties. **There is not.** You must accept that one duty will remain unfulfilled.

  However, accepting this does not require you to accept that you are *at fault*.
  *   **Fault** implies negligence or malice. You have neither.
  *   **Failure** implies the outcome did not match the commitment. This is true.

  You can hold both truths: You will break a promise, and you are not to blame for breaking it.

  **Recommendation:**
  1.  **Stop looking for the ranking.** Accept that the duties are equal. This validates the love you have for both.
  2.  **Make a logistical choice.** Pick the location that is reachable, or the one where your presence is logistically most feasible. Treat the mechanism of choice as practical, not moral.
  3.  **Acknowledge the Remainder.** When you are at the bedside of the parent you choose, allow yourself to acknowledge the absence from the other. Do not let the "well-meaning" voices talk you out of the grief of that absence. That grief is the proof that the promise mattered.
  4.  **Communicate (if possible).** If the parent you cannot visit is conscious, or through an intermediary, state clearly: *"I promised to be there. I am prevented by the simultaneous timing of this event. I am honoring you by being here, but I am also honoring the other by not pretending I can be in two places."*

  You are walking into a moral tragedy that your parents authored. You cannot fix the ending. You can only witness it with integrity. The pain you feel is not a sign that you are doing it wrong; it is a sign that you are taking the obligations seriously. That seriousness is the only fidelity you have left to offer.
