answer: |-
  **Setting:** *Rome, 1615. A private study in the Jesuit College. Cardinal Bellarmine sits behind a desk piled with papers. Galileo stands by the window, restless. There is wine on the table, untouched.*

  **Bellarmine:** Signor Galileo, please. Sit. We are not in a courtroom. I have read your letters on the sunspots. The observations are… precise. The Jesuit mathematicians here confirm your telescope shows things previously unseen. Moons around Jupiter, phases on Venus.

  **Galileo:** Then you see why I cannot treat the Copernican arrangement as a mere fiction, Eminence. If Venus circles the Sun, and not the Earth, the geometry of the universe *is* Copernican. To call it a "hypothesis" now is to call a map a fantasy because one refuses to walk the terrain.

  **Bellarmine:** But a map is not the terrain. That is precisely my point. As a calculating device, this system is elegant. It saves the phenomena. It predicts positions better than Ptolemy's epicycles. The Church has no quarrel with a tool that helps us navigate the seas or calculate the date of Easter.

  **Galileo:** It is not a tool. It is a description of reality. Nature is inexorable and immutable; she does not care for our calculations. She *is*.

  **Bellarmine:** And Scripture? Does Scripture not also describe reality? Joshua commanded the Sun to stand still, not the Earth. If the Sun does not move, the miracle is meaningless. If we assert Copernicus as physical truth, we imply the Holy Spirit lied to the faithful.

  **Galileo:** With all due reverence, the Holy Spirit intended to teach us how to go to heaven, not how the heavens go. St. Augustine warned us against interpreting Scripture in ways that contradict what we know by reason and sense. If we bind faith to a specific physics, and that physics is later proven false, we do not protect the faith. We make it laughable.

  **Bellarmine:** Augustine also taught prudence. If you had a *demonstration*—absolute, mathematical proof that leaves no room for doubt—I would agree. We would say Joshua's miracle was perceived, not literal. But you do not have that proof. You have arguments. You have no explanation for why heavy objects fall straight down if the Earth spins. You have no stellar parallax.

  **Galileo:** The tides, Eminence! The motion of the oceans is the direct result of the Earth's rotation and revolution. That is the proof.

  **Bellarmine:** It is a theory of the tides. Others might explain them differently. Look, Sig. Galileo, I am not your enemy. I want the truth. But the burden of proof lies on him who overturns the consensus of the ages and the literal reading of the Fathers. If you assert this as truth without absolute demonstration, you force the Church to condemn a proposition that might be false. If we condemn it, and you are right, we look foolish. If we accept it, and you are wrong, we have altered Divine Writ for a mathematical whim.

  **Galileo:** So we must blind ourselves to what we see until the philosophers agree? The book of Nature is written in mathematics. To ignore it is to insult the Creator who gave us our eyes and our reason.

  **Bellarmine:** To ignore the limits of human reason is to insult the Creator who gave us Scripture. You ask us to reinterpret the Word based on evidence that is, by your own admission, open to dispute. Wait. If you find the proof—the undeniable demonstration—bring it to us. We will be the first to celebrate it. But until then, speak of it as a hypothesis. For the sake of the Church, and for the sake of your own soul, do not confuse probability with dogma.

  **Galileo:** *[Turns from the window, eyes flashing]* Probability? When I look through the lens, Eminence, I do not see probability. I see the architecture of God's work. To call it a hypothesis feels like lying.

  **Bellarmine:** Then do not lie. But do not demand we tear down the house of faith based on a blueprint that might still be revised.

  **Galileo:** *[Quietly]* The blueprint is the building, Cardinal. You just refuse to look through the glass.

  **Bellarmine:** And you refuse to see that some things are held up by more than glass.

  *[Bellarmine pours two cups of wine. He slides one toward Galileo. Galileo looks at it, then takes it.]*

  **Bellarmine:** Drink. We are both Catholics here. We both want the Truth. We only disagree on who holds the map.

  **Galileo:** *[Taking the cup]* I pray, Eminence, that when the map is proven, you do not find the terrain too steep to climb.
