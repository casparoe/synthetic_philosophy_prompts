      *   **The Real-World Violation:** The forecasters *haven't* converged. Why?
          *   Do they have common priors? (Unlikely, even with same data).
          *   Is it common knowledge? (They know the numbers, but do they know the *reasoning* fully enough to update?)
          *   Are they perfectly rational? (No one is, even pros).
