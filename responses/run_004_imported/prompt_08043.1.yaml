          *   *Likelihood Functions:* How does evidence map to probability? One might think a poll shift is noise; the other thinks it's signal. This is "weighing differently."
          *   *Computational Limits:* We aren't infinite processors. We can't fully ingest another's reasoning chain.
      *   **Reframing "The Same Evidence":** This is the crux. Data is not evidence. Evidence is data + interpretation. If interpretation differs, evidence differs.
