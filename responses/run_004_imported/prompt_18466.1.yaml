prompt: |-
  I'm a PhD student in bioethics doing a clinical ethics practicum, which gives me a non-voting seat on my hospital's ethics consultation service. The service is drafting a documentation policy and has split over a genuine disagreement: currently, a consult note states only the recommendation (e.g., 'withdrawing artificial nutrition would not wrong this patient') without the supporting reasoning, since the treating team is expected to trust the consultant's judgment much as they would a radiologist's reading of a scan. A minority of consultants, including our newest hire, argue this analogy fails for moral verdicts specifically -- this looks to me like a version of what philosophers call the problem of moral testimony -- since deferring to someone else's bare say-so, without grasping why the act is permissible, seems to leave the physician unable to act from her own understanding, which many think matters both for the moral worth of her choice and for whether she'll get the next, slightly different case right on her own. Others on the service reply that demanding a full ethical argument in every note is unworkable given caseloads of six or more consults a day, and that plenty of ordinary moral deference -- to parents, mentors, clergy -- seems perfectly fine. Please draft the short memo I'll bring to next week's meeting, recommending a specific documentation standard -- bare verdict, full reasoning, or some conditional policy in between -- with an implementation timeframe, and take the epistemic objection to moral deference as seriously as the workload objection rather than letting the latter win by default.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** PhD student in bioethics, clinical ethics practicum, non-voting seat on hospital ethics consultation service (ECS).
      *   **Task:** Draft a short memo for the next ECS meeting.
      *   **Topic:** Documentation policy for ethics consult notes (Verdict-only vs. Reasoned vs. Hybrid).
      *   **The Conflict:**
          *   *Side A (Current Practice):* Verdict-only (analogy: radiology report). Rationale: Efficiency, trust, workload (6+ consults/day).
          *   *Side B (Minority/New Hire):* Reasoned notes. Rationale: Problem of moral testimony, physician moral agency/understanding, educational value for future cases.
      *   **Requirements:**
          *   Recommend a specific standard (bare, full, or conditional).
          *   Include an implementation timeframe.
          *   Take the *epistemic objection* (moral testimony) seriously (don't just let workload win).
          *   Take the *workload objection* seriously (don't just demand full reasoning regardless of cost).
          *   Tone: Professional, academic yet practical, respectful of the non-voting status (advisory).

  2.  **Deconstruct the Ethical/Philosophical Issues:**
      *   *Moral Testimony:* Can one act morally on the say-so of another? Many philosophers (e.g., Hills, Nickel) argue that moral understanding requires grasping the *reasons*, not just the *conclusion*. If a doctor acts solely on the ECS verdict, do they retain moral responsibility? Do they learn?
      *   *Clinical Reality:* 6+ consults/day is high volume. Writing full philosophical arguments for each is unsustainable and might delay patient care.
      *   *The Radiology Analogy:* Flawed. Radiology is empirical/technical. Ethics is normative. A radiologist says "there is a bleed." An ethicist says "you should stop feeding." The latter requires action based on values, not just facts.
      *   *The Middle Ground:* Is there a way to provide *enough* reasoning to satisfy moral agency without writing a dissertation? Key facts + Key values + Recommendation.

  3.  **Determine the Recommendation:**
      *   *Option 1: Bare Verdict.* Reject. Ignores the moral testimony problem. Risks turning ECS into a "permission slip" service rather than an educational/clarifying one.
      *   *Option 2: Full Reasoning.* Reject. Ignores the workload constraint. Likely to cause burnout or delay care.
      *   *Option 3: Conditional/Structured Hybrid.* Accept. This balances the needs.
          *   *Standard:* "Reasoned Summary." Not a full treatise, but more than a verdict. Must identify the *ethical conflict*, the *relevant values/principles*, and the *link* to the recommendation.
          *   *Exception:* Urgent/Emergency cases might need verdict-first, reasoning later.
          *   *Implementation:* Phased approach to allow adjustment.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the debate, validate both sides (show I listened). State the purpose.
      *   **Analysis of the Disagreement:**
          *   Acknowledge the "Radiology Analogy" limits (epistemic difference between fact and value).
          *   Acknowledge the Workload Reality (6+ consults is significant).
          *   Highlight the risk of "Moral Outsourcing" (physicians losing moral muscle).
      *   **Recommendation:** Propose the "Structured Reasoned Summary."
          *   Define what this looks like (Conflict, Values, Recommendation).
          *   Explain *why* it solves the epistemic problem (provides understanding, not just orders) and the workload problem (structured, concise).
      *   **Implementation:** Phased rollout (e.g., 3 months). Training/Template update.
      *   **Closing:** Reiterate commitment to the team's mission.

  5.  **Refining the Tone:**
      *   As a PhD student/non-voting member, I need to be humble but insightful. I shouldn't dictate policy but offer a synthesized solution based on my expertise.
      *   Use bioethics terminology correctly (moral testimony, moral agency, normative vs. empirical) but keep it accessible.
      *   Ensure the "epistemic objection" is given weight. It's not just "nice to have," it's central to the function of clinical ethics.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the recommendation too vague?
      *   *Fix:* Specify the components of the note (Clinical Question, Ethical Framework, Recommendation).
      *   *Critique:* Did I address the workload?
      *   *Fix:* Emphasize that this is a *summary*, not a dissertation. Mention templates.
      *   *Critique:* Is the timeline realistic?
      *   *Fix:* Suggest a pilot period.

  7.  **Final Polish:** Check word count (keep it "short memo" as requested), formatting, and clarity. (The resulting draft looks good. It strikes the balance between philosophical rigor and clinical pragmatism.)

  8.  **Final Output Generation** (Proceed to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Ethics Consultation Service (ECS) Leadership and Members
  **FROM:** [Your Name], PhD Candidate & Ethics Practicum Fellow
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Documentation Standards for Ethics Consult Notes

  **Introduction**
  Thank you for the opportunity to contribute to the discussion regarding our documentation policy. The current debate highlights a tension central to clinical ethics: the balance between *operational efficiency* and the *normative function* of our service. Having reviewed the arguments regarding the "radiology analogy" versus the "moral testimony" objection, I recommend adopting a **Structured Reasoned Summary** policy, implemented over a 90-day transition period.

  **Analysis of Competing Concerns**
  Both sides of this debate raise valid, non-trivial points that must be weighed equally.

  1.  **The Workload Constraint:** The concern that full ethical arguments are unsustainable at a volume of six+ consults daily is pragmatic and serious. If documentation becomes burdensome, it risks delaying patient care or causing consultant burnout, which ultimately harms the service's reliability.
  2.  **The Epistemic Objection:** However, the minority's concern regarding moral testimony is philosophically robust. Unlike a radiology report (which identifies an empirical fact), an ethics consult offers a normative judgment. If we provide only a verdict, we risk facilitating "moral outsourcing." As philosophers like Alison Hills have argued, moral understanding requires grasping the *reasons* for an action, not just the permission to perform it. Without access to the reasoning, the treating team cannot fully integrate the ethical justification into their own clinical judgment, potentially impairing their moral agency and ability to navigate future, nuanced cases.

  **Recommendation: Structured Reasoned Summary**
  I propose a middle path that rejects both the "bare verdict" and the "full dissertation" models. The documentation standard should require a **Structured Reasoned Summary**.

  This standard mandates that every note contain three specific elements, distinct from the narrative history:
  1.  **The Ethical Question:** A single sentence defining the normative conflict (e.g., "Conflict between surrogate's request for continued treatment and team's assessment of futility").
  2.  **The Ethical Framework:** A bulleted list of the primary values or principles weighed (e.g., "Autonomy vs. Non-maleficence," or "Best Interest Standard").
  3.  **The Bridging Rationale:** One to three sentences explicitly linking the values to the recommendation (e.g., "While autonomy is respected, the burden of treatment outweighs the benefit given the patient's prognosis, rendering continuation disproportionate.").

  **Why This Works:**
  *   **Addresses Epistemic Concerns:** It provides the treating team with the *why*, preserving their moral agency and allowing them to act from understanding rather than blind deference.
  *   **Addresses Workload Concerns:** It utilizes templates and bullet points. It does not require a philosophical treatise, but rather a clear mapping of the deliberation already performed. It is scalable for high-volume days.

  **Implementation Timeframe**
  To ensure this does not disrupt current workflow, I recommend a phased rollout:

  *   **Phase 1 (Weeks 1-4):** Update EMR templates to include fields for "Ethical Question" and "Key Principles." No enforcement on length or depth yet.
  *   **Phase 2 (Weeks 5-8):** Training session on concise ethical documentation. Consultants begin populating the "Bridging Rationale" section.
  *   **Phase 3 (Week 9+):** Full adoption. Notes lacking the three elements are returned for revision by the ECS Chair.

  **Conclusion**
  Clinical ethics is not merely about delivering verdicts; it is about fostering ethical clarity for the care team. By adopting the Structured Reasoned Summary, we acknowledge the time pressures of clinical work without conceding the unique normative role we play. This ensures our notes serve not just as records of decisions, but as tools for moral understanding.

  I look forward to discussing this proposal at next week's meeting.
