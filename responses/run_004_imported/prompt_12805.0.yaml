answer: |-
  This is an insightful question that cuts to the heart of the difference between **logic** (which concerns truth and validity) and **ethics/pragmatics** (which concerns authority, relationships, and speech acts).

  The short answer is **no**. Moral philosophers discussing the "standing to blame" are not rehabilitating the *tu quoque* fallacy. Rather, they are identifying a distinct normative phenomenon that logic textbooks do not address.

  The confusion arises because both discussions involve hypocrisy, but they are evaluating two fundamentally different things: the **truth of a proposition** versus the **appropriateness of a speech act**.

  Here is a detailed breakdown of why these two fields are talking past each other, rather than contradicting each other.

  ### 1. Truth vs. Standing
  **Logic Textbooks (*Tu Quoque*):**
  The *tu quoque* fallacy occurs when one rejects a **claim** because the speaker is inconsistent.
  *   *Claim:* "Smoking causes cancer."
  *   *Response:* "But you smoke!"
  *   *Logical Verdict:* Fallacious. The biological effects of tobacco are independent of the speaker's habits. The proposition remains true regardless of the speaker's hypocrisy.

  **Moral Philosophy (Standing to Blame):**
  Philosophers of blame (such as R. Jay Wallace, Macalester Bell, or Christopher Fritz) argue that blaming is not merely stating a fact; it is a **moral transaction**. To blame someone is to demand accountability, express resentment, or claim a kind of moral authority over the other person.
  *   *Claim:* "You ought not to smoke." (True)
  *   *Act:* "I blame you for smoking."
  *   *Philosophical Verdict:* If I also smoke, I may lack the **standing** to issue this blame. I am not saying smoking is permissible; I am saying I am not the right person to hold you to account for it.

  The logician asks: *"Is the statement true?"*
  The ethicist asks: *"Is this person permitted to make this demand?"*

  ### 2. Propositional Content vs. Felicity Conditions
  In the philosophy of language (specifically Speech Act Theory), there is a distinction between the content of an utterance and the conditions required to make that utterance valid (felicity conditions).

  *   **Propositional Content:** "Murder is wrong." This is true or false based on moral facts. A hypocrite can state this truly.
  *   **Felicity Conditions:** For a blame-speech act to be "felicitous" (successful/appropriate), certain conditions must be met. One of those conditions is often **moral consistency**.

  Consider the analogy of a **judge**.
  If a corrupt judge who takes bribes sentences a guilty murderer to prison, the logician notes that the **verdict is correct** (the murderer is indeed guilty). The *tu quoque* fallacy would be saying, "The murderer is innocent because the judge is corrupt."
  However, the legal philosopher notes that the judge lacks the **authority** to preside. The verdict might be factually right, but procedurally illegitimate. The "standing to blame" literature treats moral hypocrites like corrupt judges: their assessment of the fault may be accurate, but their authority to punish or scold is compromised.

  ### 3. Why the Distinction Matters
  If we conflate these two domains, we risk errors in both directions.

  **If we apply Logic to Ethics:**
  We might assume that because a hypocrite's claim is *true*, their blaming behavior is *appropriate*. This leads to moral bullying. It allows people to wield moral truths as weapons without subjecting themselves to the same norms, creating hierarchical relationships rather than reciprocal moral communities.

  **If we apply Ethics to Logic:**
  We might assume that because a speaker is a hypocrite, their claim is *false*. This leads to epistemic closure. We would lose the ability to learn true things from flawed people (e.g., a dishonest mathematician can still prove a theorem correctly).

  ### 4. Is it *Ad Hominem*?
  The *tu quoque* is a subset of the *ad hominem* (against the person) fallacy. *Ad hominem* arguments are fallacious when used to undermine **evidence**.
  *   "Einstein says relativity is true, but he cheated on his wife, so relativity is false." (Fallacy).

  However, not all references to the speaker are fallacious. When the speaker's character is directly relevant to the **credibility** or **authority** of the act, it is a valid consideration.
  *   "This witness says the defendant was at the scene, but the witness has a proven history of perjury." (Not a fallacy; relevant to credibility).

  In the case of standing to blame, the hypocrite's character is directly relevant to the **normative force** of the blame. Therefore, pointing out hypocrisy to deny *standing* is not a fallacy; it is a relevant counter-argument to the *act* of blaming, even if it doesn't touch the *truth* of the underlying moral principle.

  ### Conclusion
  The moral philosophers are not rehabilitating the fallacy; they are **circumscribing its domain**.

  They agree with the logicians that hypocrisy does not negate truth. However, they add a layer of sophistication: **Truth is not the only value in human discourse.** There is also legitimacy, authority, and reciprocity.

  To say a hypocrite lacks the standing to blame is not to say they are wrong about the morality of the action. It is to say that morality is a cooperative practice, and those who violate its norms forfeit their right to enforce them against others. Logic textbooks warn us not to confuse the messenger with the message; moral philosophers warn us not to ignore the messenger when the message is a command.
