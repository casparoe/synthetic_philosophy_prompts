      *   *Section 3: The Crucial Distinction.* Truth-conditional vs. Felicity conditions. One is about the world, the other is about social/moral relations.
      *   *Section 4: Why the distinction matters.* If we conflate them, we lose the ability to acknowledge truth from flawed sources. If we ignore standing, we allow moral bullying.
