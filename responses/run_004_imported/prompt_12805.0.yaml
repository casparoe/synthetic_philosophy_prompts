prompt: |-
  Logic textbooks classify the dismissal of an argument on the grounds that its proponent is a hypocrite as the "tu quoque" fallacy, since the truth of a claim cannot depend on who is making it. Yet a substantial body of recent moral philosophy on the "standing to blame" argues that hypocrisy really can disqualify someone from blaming others for a fault they share, even when what they say is perfectly true. Doesn't this just mean that these philosophers are, in more sophisticated language, rehabilitating the very fallacy that introductory logic courses warn against?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Question:** Does recent moral philosophy on "standing to blame" (specifically regarding hypocrisy) rehabilitate the *tu quoque* fallacy, which logic textbooks condemn?
      *   **Premise 1:** Logic textbooks say *tu quoque* (appeal to hypocrisy) is a fallacy because the truth of a claim doesn't depend on the speaker's consistency.
      *   **Premise 2:** Moral philosophy argues that hypocrisy *can* disqualify someone from blaming others (lack of "standing"), even if the claim is true.
      *   **Conclusion/Hypothesis:** Philosophers are just dressing up a fallacy in sophisticated language.
      *   **Task:** Evaluate this hypothesis. Is it a fallacy rehabilitation, or is there a crucial distinction?

  2.  **Deconstruct the Concepts:**
      *   **Tu Quoque (Logic):** An informal fallacy of relevance. It attacks the *argument* or the *truth value* of a proposition based on the speaker's inconsistency.
          *   *Example:* "You say smoking is bad, but you smoke. Therefore, smoking is not bad." (Invalid inference).
      *   **Standing to Blame (Moral Philosophy):** A normative concept about the *appropriateness* or *authority* of a speech act (blaming), not the *truth* of the proposition contained within it.
          *   *Example:* "You say I shouldn't smoke (true), but you smoke. Therefore, you lack the moral authority to scold me." (Valid normative claim about the relationship/interaction).

  3.  **Identify the Key Distinction:**
      *   **Truth vs. Appropriateness:** Logic cares about truth conditions. Moral philosophy (in this context) cares about felicity conditions or normative standing.
      *   **Propositional Content vs. Speech Act:** *Tu quoque* targets the *content* ("Smoking is bad"). Standing to blame targets the *act* ("I blame you for smoking").
      *   **Epistemic vs. Moral:** Logic is epistemic (what can we know/believe?). Standing is moral/pragmatic (what can we do/say to each other?).

  4.  **Formulate the Argument:**
      *   *Direct Answer:* No, they are not rehabilitating the fallacy. They are addressing a different category of evaluation.
      *   *Point 1: Truth vs. Standing.* Logic asks "Is P true?" Philosophy asks "Is A permitted to assert P to B in a blaming capacity?"
      *   *Point 2: The Nature of Blaming.* Blaming isn't just stating a fact; it's a moral transaction involving authority, reciprocity, and community norms.
      *   *Point 3: The Fallacy Remains a Fallacy.* If a hypocrite says "Murder is wrong," it is still true that murder is wrong. The philosopher agrees with the logician here. The disagreement is on whether the hypocrite can *enforce* or *perform* the blame.
      *   *Point 4: Nuance/Overlap.* Acknowledge where confusion arises (ad hominem territory) but clarify the boundary.

  5.  **Drafting the Response (Iterative refinement):**

