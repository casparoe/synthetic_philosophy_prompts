  7.  **Drafting the Content (Mental or Scratchpad):**
      *   *Derivation:* Start with the partition $\{H_1, T_1, T_2\}$. Lewis's "Indifference" applies to $T_1$ and $T_2$ *given Tails*. $P(T_1) = P(T_2)$. $P(H) = 1/2 \rightarrow P(H_1) = 1/2$. Sum = 1. So $P(T_1)=1/4, P(T_2)=1/4$. Condition on $Mon = \{H_1, T_1\}$. $P(H|Mon) = (1/2) / (3/4) = 2/3$.
      *   *Self-Locating Shift:* It's selection bias. You are more likely to be in a Tails world *at some point*, but if you are restricted to Monday, you cut out half the Tails experiences, leaving the single Heads experience more prominent.
