      *   *Specific Thirder Cost:* If $P(H) = 1/3$, then upon learning it is Monday, $P(H|Mon)$ must be $1/2$ (by symmetry of the Monday awakening). This means learning it is Monday *lowers* the credence in Heads from 1/3 to 1/2? No, wait.
      *   *Thirder Calculation:*
