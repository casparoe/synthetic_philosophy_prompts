      *   *The Worry:* How does knowing the *day* change the probability of a *coin toss* that happened in the past? It feels like "magic" or information leakage.
      *   *Lewis's Defense:* It's not that the day *causes* the coin result. It's that the day is *correlated* with the coin result via the experimental protocol.
      *   *Analogy:* The "Shooting Room" paradox or simple sampling bias. If you are sampled more often in Tails worlds, finding yourself in a sample gives evidence about Tails.
      *   *Specific Lewis Move:* Learning it is Monday rules out the possibility ($T_2$) where it is Tuesday. Since $T_2$ was a "Tails" possibility, ruling it out disproportionately removes Tails hypotheses relative to Heads hypotheses (because Heads only has one day, Tails has two). Thus, the ratio of Heads to Tails shifts in favor of Heads.

  4.  **Part 3: The Principal Principle (PP) and Past Chances:**
      *   *The Objection:* The PP says $P(A | \text{Chance}(A) = x) = x$. The coin is fair, so Chance($H$) = 0.5. If Beauty knows the setup, she knows Chance($H$) = 0.5. But Lewis says $P(H) = 1/2$ (okay) but $P(H|Mon) = 2/3$. Does learning "Monday" override the PP?
