          *   Learn Mon: Eliminate $T_2$.
          *   $P(H|Mon) = (1/3) / (1/3 + 1/3) = 1/2$.
          *   So Thirders say: Waking -> 1/3. Learn Mon -> 1/2.
          *   Lewis says: Waking -> 1/2. Learn Mon -> 2/3.
      *   *The Thirder PP Violation:* Upon waking, before knowing the day, Chance($H$) is known to be 0.5 (based on the setup). Credence is 1/3. This is a direct clash with PP unless "I am awake" is inadmissible.
      *   *The Lewis PP Violation:* Upon learning Monday, Credence becomes 2/3. Chance (past) is 0.5 (setup) or 1/0 (actual). If we treat the setup chance as the guide, 2/3 violates 0.5.
      *   *Conclusion:* Both face PP tensions. Lewis uses the "past chance is trivial" move to soften it. Thirders must argue "I am awake" is inadmissible evidence.

  6.  **Synthesizing and Refining the Argument:**
      *   *Structure:*
          1.  Lewis's Bayesian Derivation (The Math).
          2.  The "Self-Locating Shift" Objection & Lewis's Response (Correlation vs. Causation).
          3.  The Principal Principle Challenge (Lewis's "Triviality of Past Chance" defense).
          4.  The Thirder's Comparable Cost (PP violation at waking).
