      *   *Correction/Nuance:* Actually, Lewis's main defense against the PP violation charge is that the PP relates credence to *current* chances. Since the toss is past, the current chance is 1 or 0. We don't know which. The 0.5 is the *prior* chance. The PP doesn't say "Credence must match prior chance after the event." It says "Credence matches current chance." Since current chance is trivial, the PP doesn't constrain her to 1/2 *after* the toss, except via her knowledge of the setup. But her knowledge of the setup is combined with self-locating evidence.
      *   *Better formulation:* Lewis argues that the proposition "The coin lands Heads" is not independent of the self-locating proposition "Today is Monday" in the context of the experiment. The PP requires conditioning on the *chance proposition*. If we condition on "The chance of Heads at time $t_0$ was 0.5", does $P(H | \text{Chance}=0.5 \land Mon) = 0.5$? Lewis says No, because "Mon" is inadmissible evidence regarding the outcome relative to the chance at $t_0$. Why? Because the protocol links the outcome to the number of awakenings.

  5.  **Part 4: The Thirder's Cost:**
      *   *Thirder Position:* $P(H) = 1/3$ upon waking.
      *   *The Cost:* Violation of the PP (more directly). If the coin is fair, Chance($H$) = 0.5. Beauty knows this. Why is her credence 1/3?
      *   *Thirder Defense:* They argue the PP applies to *de dicto* propositions, but Beauty's situation involves *de se* uncertainty. Or, they argue that "awakening" is the relevant reference class, not "coin tosses."
      *   *Comparison:* Lewis violates the intuition that "learning the day shouldn't change the coin probability." Thirders violate the intuition that "credence should match known objective chance."
      *   *Which is worse?* Physicists usually hate violating the PP (Objective Chance). Philosophers of language/metaphysics might hate the "magic" of self-location.
      *   *Thirder "New Evidence":* Thirders argue Beauty *does* get new evidence upon waking ("I am awake now"). Lewis denies this is new evidence relevant to $H$.
