      *   *The Centered Worlds:* Lewis treats self-locating beliefs as sets of centered worlds.
      *   *The Possibilities:* Upon waking, Beauty considers three centered possibilities compatible with her knowledge:
          1.  $H_1$: Heads and it is Monday.
          2.  $T_1$: Tails and it is Monday.
          3.  $T_2$: Tails and it is Tuesday.
          *   (Note: $H_2$ is impossible because the experiment ends Tuesday if Heads).
      *   *Lewis's Indifference Principle:* Lewis argues that upon waking, Beauty should divide her credence in Tails equally between Monday and Tuesday. So, $P(T_1) = P(T_2)$.
      *   *The Constraint:* Since $P(H) = P(H_1) = 1/2$, and total probability must sum to 1, we have $P(T_1) + P(T_2) = 1/2$.
      *   *Resulting Priors:* $P(H_1) = 1/2$, $P(T_1) = 1/4$, $P(T_2) = 1/4$.
      *   *The Update:* Beauty learns "It is Monday". This eliminates $T_2$.
      *   *Conditionalization:* $P(H|Mon) = P(H_1 \cap Mon) / P(Mon) = P(H_1) / (P(H_1) + P(T_1))$.
      *   *Calculation:* $(1/2) / (1/2 + 1/4) = (1/2) / (3/4) = 2/3$.
