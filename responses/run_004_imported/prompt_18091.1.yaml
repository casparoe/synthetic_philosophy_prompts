answer: |-
  It is a pleasure to engage with someone who brings thirty years of laboratory experience to the philosophy of language. Your intuition is sharp, and you have identified the exact fault line where two-dimensional semantics (2Dism) becomes controversial. Many professional philosophers share your suspicion.

  To answer your question directly: **You have understood the mechanics of the two-dimensional framework correctly, but you may be drawing a conclusion about Kripke that the two-dimensionalists explicitly deny, while their critics (including Kripke himself) agree with you.**

  Here is a breakdown of why your reading is technically sound regarding the apparatus, but why the philosophical verdict on "repudiation vs. refinement" depends on which notion of "necessity" you prioritize.

  ### 1. The Mechanics: You are Right about the Primary Intension
  You correctly identify the engine of the two-dimensional framework.
  *   **Primary Intension (1-intension):** Evaluates the sentence across worlds considered *as actual* (contexts). Here, "water" picks out whatever plays the "watery role" (clear, drinkable, fills lakes, etc.). In a world where XYZ plays that role, "Water is H2O" is false.
  *   **Secondary Intension (2-intension):** Evaluates the sentence across worlds considered *as counterfactual* (circumstances), holding the actual world fixed. Since we have fixed the reference of "water" as H2O in the actual world, "water" refers to H2O in all counterfactual worlds. Here, "Water is H2O" is true in all worlds.

  Your observation is correct: **Relative to the primary intension, "Water is H2O" is contingent.** It could have turned out otherwise.

  ### 2. The Necessity Claim: Where the Disagreement Lies
  Your puzzle stems from the inference: *"so the sentence must be contingent after all."*

  The two-dimensionalist (like Chalmers or Jackson) replies: "Contingent in which sense?" They argue that Kripke conflated two distinct modalities:
  1.  **Metaphysical Necessity:** Corresponds to the **secondary intension**. Kripke was right: Given that water *is* H2O, it is metaphysically necessary.
  2.  **Epistemic Necessity (or Apriority):** Corresponds to the **primary intension**. "Water is H2O" is not epistemically necessary because it was an empirical discovery.

  **The Two-Dimensionalist Defense:** They claim they are *saving* Kripke's insight about metaphysical necessity (the 2-intension remains rigid) while adding a layer to explain why the identity feels contingent to us (the 1-intension varies). They argue this explains the "a posteriori" nature of the truth without denying its "necessary" status.

  **Your Critique (and the Critics' Consensus):** You are sensing that by granting the primary intension semantic weight, 2Dism reintroduces the very descriptivism Kripke sought to destroy. If the meaning of "water" includes the rule "whatever is watery," then in the XYZ world, we aren't just talking about a different epistemic possibility; we are talking about a world where the *sentence* "Water is H2O" is false.

  ### 3. Is Description Theory Vindicated?
  You suggest that the older description theory is "vindicated, merely re-expressed in fancier notation." This is the crux of the debate.

  *   **Pre-Kripkean Descriptivism:** "Water" *means* "the watery stuff." Therefore, "Water is H2O" is a contingent empirical generalization.
  *   **Kripke:** "Water" *refers* to H2O rigidly. "The watery stuff" is merely a reference-fixer, not the meaning. "Water is H2O" is necessary.
  *   **Two-Dimensionalism:** "Water" has a semantic character (1-intension) that functions like a description ("the watery stuff") *for the purpose of fixing reference in a context*, but once fixed, it refers rigidly (2-intension).

  **Is this a vindication?**
  *   **Yes,** in the sense that it admits a descriptive element plays a crucial semantic role (the 1-intension), which Kripke vehemently denied. Kripke argued that descriptions do not give the *meaning* of natural kind terms. 2Dism says they give the *primary intension*, which many 2Dists treat as a component of meaning.
  *   **No,** in the sense that it preserves Kripke's rigid designation at the level of the secondary intension. The pre-Kripkean descriptivist would say "Water is H2O" is false in the XYZ world *simpliciter*. The 2Dist says it is false in the XYZ world *considered as actual*, but true in the XYZ world *considered as counterfactual from our actual world*.

  So, it is a hybrid. It vindicates the Fregean intuition (that there is a "mode of presentation" that varies epistemically) without abandoning the Kripkean intuition (that natural kinds are rigid in metaphysical modality).

  ### 4. Repudiation or Refinement?
  This brings us to your final question. Is 2Dism a friendly refinement or a repudiation?

  **The "Refinement" View (Chalmers/Jackson):**
  They argue Kripke's framework was incomplete, not wrong. Kripke successfully mapped *metaphysical* modality but lacked the tools to map *epistemic* modality. 2Dism provides the notation to show how a statement can be necessary (metaphysically) yet a posteriori (epistemically contingent). They see this as completing the picture Kripke started.

  **The "Repudiation" View (Soames, Kripke, and arguably you):**
  Scott Soames, in *Beyond Rigidity*, argues precisely what you are suggesting: 2Dism is a retreat to descriptivism.
  *   Kripke's point was that the *semantic content* of "water" is just the substance H2O.
  *   By assigning semantic content to the reference-fixing description (the 1-intension), 2Dists are smuggling descriptivism back in.
  *   Kripke himself has expressed skepticism about 2Dism, feeling that it confuses the *way we identify* a substance with the *identity* of the substance.

  From this perspective, your reading is astute. If the primary intension is part of the semantics, then "Water is H2O" is not a necessary truth in the full semantic sense; it is only necessary relative to a fixed actual world. This undermines Kripke's central thesis that the identity holds in virtue of the meaning of the terms (rigid designation) rather than empirical fact.

  ### Conclusion for a Chemist
  Think of it this way:
  *   **Kripke:** Once you analyze the sample and find it is H2O, the label "Water" is welded to H2O. In any other universe, if you find H2O, it's water. If you find XYZ, it's not water, even if it looks like it.
  *   **Two-Dimensionalism:** The label "Water" comes with a lab protocol (the 1-intension). The protocol says "Test for watery properties." If you run this protocol in the XYZ world, you get XYZ. If you run it in our world, you get H2O. Once you have the result (H2O), you tag it rigidly (2-intension).

  You are correct that the introduction of the "lab protocol" (primary intension) as a semantic element softens Kripke's hardline anti-descriptivism.

  **Verdict:** You have understood the framework correctly. Whether it is a "repudiation" depends on whether you believe Kripke's project was to establish metaphysical necessity (which 2Dism preserves) or to purge descriptive content from semantics entirely (which 2Dism undermines). Given your background, your skepticism aligns with the "hardline" Kripkean view (championed by Scott Soames) that 2Dism is indeed a sophisticated attempt to revive the description theory that Kripke thought he had buried.

  If you wish to pursue this specific critique, I recommend Scott Soames' *Beyond Rigidity* or Kripke's own remarks in *Philosophical Troubles*, where he pushes back against the two-dimensionalist appropriation of his work.
