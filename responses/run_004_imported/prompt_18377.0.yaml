      *   **The "Same System" Constraint:** The obstacle arises specifically when the parent and child use the *exact same* proof strength. If the child uses a *weaker* system, the parent can verify it. If the child uses a *stronger* system, the parent can't verify it (obviously). But there are workarounds (e.g., ordinal progressions, parametric polymorphism).
