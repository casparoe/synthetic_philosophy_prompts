      *   **Core Conflict:** The couple is unextravagant (cheap ring, backyard wedding, no grand proposal). Naive reading of "costly signaling" suggests their love is "weak" because it's not wasteful/expensive.
      *   **Goal:** Reframe their modesty *through* the lens of signaling theory without making it a lecture. Show that their specific type of cost (time, consistency, unglamorous effort) is a *more* honest signal than monetary waste.
      *   **Key Detail:** The groom drove 4 hours each way every weekend for 3 years, never framing it as a gesture.
      *   **Constraints:** ~5 minutes spoken (approx. 750-900 words), one sustained thread, toast not lecture, theory as structure not surface.
      *   **Tone:** Warm, intelligent, witty but not snobbish, emotionally resonant.

  2.  **Deconstruct the Science (for accuracy):**
      *   *Handicap Principle (Zahavi):* Signals are honest because they are costly to produce. Only high-quality individuals can afford the cost.
      *   *The Trap:* Equating "cost" with "money" or "waste."
      *   *The Fix:* Cost is relative to the individual. A signal is honest if it *cannot be faked* by low-quality individuals.
      *   *Index Signals:* Physical constraints make faking impossible (e.g., voice pitch).
      *   *Time/Effort vs. Money:* Money is transferable/fakeable. Time and consistent effort are non-renewable and harder to fake over the long term.
      *   *The Groom's Drive:* High time cost, high opportunity cost, high consistency. This is a "hard-to-fake" signal of commitment. It's not a peacock tail (flashy, metabolic waste); it's a migration pattern (survival-critical, endurance-based).
      *   *Avoid:* Saying "Zahavi says..." or "The Handicap Principle states..." Explicitly naming the peacock tail (since they hate it).

