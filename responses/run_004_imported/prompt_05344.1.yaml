          *Critique 2:* Better. Need to make sure I don't say "Zahavi" or "Handicap Principle" explicitly, but imply the logic so the scientists nod. The laypeople should just hear "effort." The scientists should hear "index signal vs. handicap."

      *   *Refining the Science for the Toast:*
          *   Don't say "Handicap Principle." Say "the idea that love requires waste."
