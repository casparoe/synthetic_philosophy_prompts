answer: |-
  Good evening. For those who don't know me, I'm the older sibling. My job description in this family is "words," while my sister's is "truth." Usually, we manage to keep those separate. She studies why living things do what they do; I try to make up stories about why they did it. But tonight, since I've been handed the microphone, I have to try to speak her language.

  I know the stakes. I know that half this room could spot a flawed hypothesis from across a cocktail hour. I also know that there is a specific, dangerous temptation when toasting a behavioral ecologist. It is the temptation to talk about signals.

  We all know the stereotype. In nature, we're told, love is proven by waste. The bigger the tail, the louder the song, the more energy burned just to be seen, the more honest the intent. If you look at the world naively, you might think that commitment is measured in carats, or square footage, or the price of an open bar. And if that were the only metric that mattered, looking around this lovely backyard, at this beautiful, unpretentious celebration, one might mistakenly conclude that the data is… underwhelming.

  But my sister knows better than anyone that a signal is only as honest as it is hard to fake.

  Anyone can rent a tail. Anyone can buy a display. Those are costs that can be borrowed, or faked, or shouldered by someone who doesn't actually have the constitution to sustain them. Real honesty isn't found in the things you buy to prove you're rich. It's found in the things you spend that you can never get back.

  There is a currency in this world that is strictly non-transferable. You can't borrow it from your parents, you can't steal it from a bank, and you can't pretend to have more of it than you do. That currency is time. And specifically, the willingness to spend it when no one is keeping score.

  I think about the three years before they lived in the same city. I think about the weekends. I think about a man who got into his car, rain or snow or August heat, and drove four hours each way. Eight hours in a weekend. Week after week. Month after month.

  Now, if he had done that once, with a camera crew present, that would have been a display. That would have been a peacock tail. But he did it in the dark. He did it in traffic. He did it without ever framing it as a sacrifice, or a grand gesture, or a piece of evidence to be entered into a court record. He just did it.

  In the language of the lab, you might call that an index signal. It's not just costly; it's physically constraining. You cannot fake that kind of consistency unless you actually possess the trait you're signaling: which is the endurance to show up. It is a signal that filters out anyone who is merely pretending to be committed. It is a signal that says, "I am not optimizing for efficiency. I am optimizing for *her*."

  And that is why this wedding looks exactly the way it does. It isn't modest because they don't care. It's modest because they have already done the expensive part. They have already paid the cost that matters. They spent the time. They endured the distance. They proved that the signal holds up even when the lighting is bad and the road is long.

  To the rest of us, this looks like a simple backyard wedding. But to those who know how to read the data, this is the most robust finding either of them has ever published. It is a study in reliability. It is proof that when the ornaments are stripped away, the bond remains.

  So, I want to ask everyone to raise a glass.

  To my sister, who taught me that the truth is in the behavior, not the story. And to her husband, who proved that the strongest signals are the ones you don't even notice you're sending.

  May your life together be full of hard-to-fake joys, and may you always find the drive worth the distance.

  To the bride and groom.
