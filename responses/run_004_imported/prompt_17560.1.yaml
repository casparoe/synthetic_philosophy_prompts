              *   (i) Knowing Logical Truths ($\vdash \phi \implies \models K\phi$) is primarily validated by the **Rule of Necessitation** (if $\phi$ is valid, $K\phi$ is valid). In semantics, this corresponds to truth at *all* worlds in *all* models.
