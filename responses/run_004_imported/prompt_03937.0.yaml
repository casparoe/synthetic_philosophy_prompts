      *   **The Problem:** Spinoza argues women are naturally excluded from political power due to "weakness" (*imbecillitas*) and historical precedent (no examples of co-rule). This seems to contradict his core metaphysical/political thesis that *right = power* (*potentia*), which is usually understood as a descriptive, non-normative claim about capacity (the "fish passage" in TTP).
      *   **The Specific Question:** Is Spinoza applying the *potentia* standard consistently here, or is he smuggling in social convention/history as "nature"? If the latter, does this undermine his system? Is there a charitable reading of "weakness" that saves consistency, or is this a genuine crack in the framework?
      *   **Tone:** Academic but conversational ("Quick one for you," "sanity-check," "inflict it on students"). Needs to be rigorous but accessible for a seminar prep.

  2.  **Deconstruct the Philosophical Issue:**
      *   **Spinoza's *Jus Naturale*:** In the *Theological-Political Treatise* (TTP) and *Ethics*, natural right is co-extensive with natural power. A fish eats a smaller fish because it *can*. Humans have right over nature insofar as they have power over it.
      *   **The TP Passage:** Spinoza claims women are excluded because they are naturally weaker (*imbecillitas*). He cites empirical evidence (no historical examples of co-rule) and psychological factors (men's lust/jealousy).
      *   **The Tension:**
          1.  *Consistency:* If right = power, and women *can* rule (historically, some have, e.g., Queens, though Spinoza dismisses Amazons), why deny the right?
          2.  *Nature vs. Institution:* Spinoza explicitly asks: "nature or institution?" He answers "nature" based on "experience." But isn't "experience" shaped by institution?
          3.  *Slavery:* He groups women with slaves. But slavery is clearly an institution. If women are like slaves in being under authority, does that make their subjection institutional too?
          4.  *The "Buckle":* Does the *potentia* theory fail when applied to gender because Spinoza relies on patriarchal assumptions rather than actual metaphysical capacity?

  3.  **Survey the Scholarship (Mental Check):**
      *   *Moira Gatens:* Famous work (*Feminist Interpretations of Spinoza*). Argues Spinoza's metaphysics *allows* for a better view of women, even if his politics didn't get there. She suggests the *Ethics* undermines the TP claim.
      *   *Hasana Sharp:* Focuses on *potentia* and collective power. Suggests Spinoza's exclusion of women weakens the *multitudo*.
      *   *Traditional/Conservative Reading:* Spinoza was a man of his time (17th century). He genuinely believed women were intellectually/emotionally weaker.
      *   *The "Affect" Reading:* The key might be in the second half of the passage where he talks about *passions* (lust, jealousy). It's not just physical strength; it's about the disruption of rational governance due to affective entanglements.
      *   *The "Consistency" Reading:* Some argue he *is* consistent. If women (in his view) lack the *potentia* to resist male passion or maintain independence, they lack the *right*. It's a tragic consistency, not a logical contradiction.

  4.  **Formulate the Argument:**
