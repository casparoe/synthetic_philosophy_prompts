      *   *Crucial Point:* If *jus* = *potentia*, and men rule women, then men *have* the *potentia*. So technically, the argument *is* consistent with the definition, but the *explanation* for the power differential (nature vs. institution) is empirically dubious.
      *   *Wait, actually:* If right = power, then if women *could* rule, they would have the right. Spinoza argues they *can't* (naturally). So he is making a claim about capacity. The question is: Is his claim about capacity true? If it's false (i.e., capacity is equal, power is institutional), then his application of the theory is flawed, but the theory itself holds.
