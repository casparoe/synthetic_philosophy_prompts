      *   *Key Distinction:* Distinguish between *potentia* (internal capacity) and *potestas* (external authority). Spinoza often blurs these.
      *   *The "Weakness" (*Imbecillitas*):* In the *Ethics*, this usually refers to bondage to passion. If women are excluded because they (or men in relation to them) are more prone to passion, that's an *ethical* claim, not just a physical one.
      *   *The Slavery Analogy:* This is the fatal flaw. As the user noted, slavery is the counter-example. Spinoza tries to naturalize it here.
      *   *Scholarly References:* Mention Gatens or Sharp for further reading.
      *   *Seminar Strategy:* Turn the contradiction into a teaching moment. Ask students to diagnose the failure.

  6.  **Refining the "Charitable Reading":**
