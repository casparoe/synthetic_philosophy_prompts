      *   *Can it say "All"?* Repeated icons imply a quantity. If you show a grid representing a population, you imply the whole. But strict logical universality ($\forall x$) is hard.
      *   *Can it say "If... Then"?* Very hard. ISOTYPE is largely static and descriptive.
