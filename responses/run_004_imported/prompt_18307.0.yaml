answer: |-
  This is a sophisticated dispute that cuts to the heart of how Anscombe's early public polemics relate to her later, more systematic meta-ethics. To adjudicate between you and your friend, we must distinguish between the *logical structure* of the Doctrine of Double Effect (DDE) and the *epistemic and meta-ethical commitments* required to wield it in the way Anscombe does.

  Your friend is correct that the *vocabulary* and *logical skeleton* of "Mr. Truman's Degree" are those of the traditional Doctrine of Double Effect. However, you are correct that the *force* of the argument relies on moves that go beyond a neutral application of the doctrine. Anscombe does not merely apply DDE to a hard case; she tightens the definition of "intention" to close off loopholes typically left open in just-war reasoning, and she uses the doctrine to launch a meta-ethical attack on the very framework of consequentialist calculation.

  Here is the adjudication, working through the structure of the argument and the conditions of the doctrine.

  ### 1. The Baseline: Standard DDE vs. Anscombe's Usage

  To see where Anscombe diverges, we must first establish the standard four conditions of the Doctrine of Double Effect as typically understood in natural law tradition:
  1.  **Nature of the Act:** The action itself must be morally good or neutral.
  2.  **Intention:** The agent must intend only the good effect; the bad effect may be foreseen but not intended.
  3.  **Means:** The bad effect must not be the means by which the good effect is achieved.
  4.  **Proportionality:** There must be a sufficiently grave reason to permit the foreseen bad effect.

  Your friend argues that Anscombe's verdict follows directly from Condition 3 (Means). If the civilians were killed to terrorize the government, their death was the means, violating the doctrine. This is logically sound. However, a "clean application" of DDE usually involves a period of interpretive uncertainty regarding the agent's mental state and a weighing of Condition 4. Anscombe's argument bypasses both.

  ### 2. Where the Friend is Right: The Structural Alignment

  Your friend is correct that Anscombe does not invent new moral principles in the pamphlet. Her core premise—that one may not do evil that good may come—is the bedrock of the natural law tradition from which DDE springs.

  *   **Condition 1 (Nature of the Act):** Anscombe treats the killing of innocents as *intrinsically* wrong. This is standard DDE. If the act is intrinsically evil, no amount of good consequence justifies it.
  *   **Condition 3 (Means):** Anscombe argues that the destruction of Hiroshima was intended to pressure the Japanese government via the terror of civilian destruction. In standard DDE, if the bad effect (civilian death) is the mechanism of the good effect (surrender), it is intended as a means. Anscombe's conclusion that this violates the doctrine is technically a standard deduction.

  If the debate were solely about whether the bombing *would* violate DDE *assuming* Anscombe's premises about intention were true, your friend would win. It is a valid syllogism within that system.

  ### 3. Where You Are Right: The Extra-Philosophical Moves

  The dispute arises because "Mr. Truman's Degree" is not a disinterested moral audit; it is a polemic. Anscombe makes three structural moves that a "clean application" of DDE does not license on its own.

  #### A. The Epistemology of Intention (Condition 2 & 3)
  Standard applications of DDE acknowledge the difficulty of ascertaining intention. In just-war theory, defenders of area bombing often argue that the *intention* was to destroy industrial capacity or morale (a contested category), while civilian death was a foreseen side effect. This creates a zone of interpretive ambiguity where DDE is often used to *excuse* actions that look dubious.

  Anscombe collapses this ambiguity. She does not engage in a nuanced psychological analysis of Truman or the planners. Instead, she argues that the **public nature of the act** settles the intention. She writes that the bombing was "the uttering of a threat" and the carrying out of that threat. For Anscombe, if you announce you will burn a city to force surrender, and then you burn the city, you cannot claim you merely "foresaw" the burning.

  *   **The Move:** She substitutes **moral certainty for interpretive work.** A standard DDE analysis might require evidence that the planners *could* have achieved the goal without civilian deaths to prove they intended the deaths. Anscombe treats the choice of target (a city) as self-evident proof of the intention to kill civilians. This is not a requirement of DDE itself, but a specific, rigorous Anscombean tightening of how intention is identified in public acts.

  #### B. The Collapse of Proportionality (Condition 4)
  In many DDE discussions, Condition 4 (Proportionality) is the safety valve. Even if an act is risky, if the good outcome is great enough (e.g., saving the nation), some proponents argue the act is permissible provided the bad wasn't *directly* intended.

  Anscombe structurally eliminates this condition once the intention is settled. She argues that if the act involves the direct intention to kill innocents (violating Condition 2 or 3), **proportionality becomes irrelevant.** You cannot weigh murder against victory.

  *   **The Move:** This is technically consistent with strict Thomism, but it is a **rhetorical tightening** of how DDE is often applied in modern ethics. By refusing to let the "saving of lives" argument even enter the scale, she prevents the consequentialist calculus from gaining a foothold. A "clean application" might acknowledge the proportionality argument before dismissing it; Anscombe dismisses the *legitimacy* of the weighing process itself.

  #### C. The Meta-Ethical Diagnosis (The "Consequentialism" Seed)
  This is your strongest point. Two years later, in "Modern Moral Philosophy," Anscombe would coin "consequentialism" as a pejorative. In "Mr. Truman's Degree," that diagnosis is already driving the argument.

  She is not merely arguing that Truman failed a specific rule (DDE). She is arguing that the **willingness to consider the proportionality of massacre** is evidence of a corrupted moral philosophy. She writes that the supporters of the bombing hold that "a thing is right if it produces a good result, wrong if it produces a bad one."

  *   **The Move:** She uses DDE not just as a tool for judgment, but as a **boundary marker for sane moral reasoning.** A standard application of DDE says, "This act fails the test." Anscombe's argument says, "The fact that you think this act passes the test proves your moral philosophy is insane." She is attacking the *system* that makes DDE necessary (or ignores it), rather than just the specific act. This goes beyond the doctrine itself into meta-ethics.

  ### 4. Verdict: Manifesto, Not Audit

  "Mr. Truman's Degree" is best read not as a clean application of double effect to a hard case, but as a piece that borrows the doctrine's vocabulary while being driven by Anscombe's own commitments regarding the **corruption of modern moral reasoning.**

  Your friend sees the *logic*; you see the *engine*.

  1.  **Logic:** The logic is DDE. (Intending evil is wrong; Truman intended evil; therefore Truman is wrong.)
  2.  **Engine:** The engine is Anscombe's specific view that intention is transparent in public policy and that consequentialist weighing is inherently illicit when fundamental prohibitions are breached.

  If this were a "clean application," Anscombe would have had to engage more seriously with the counter-argument: that the planners intended "victory" and "ending the war," and civilian death was a tragically foreseen but unintended consequence of destroying industrial/military centers located in cities. She dismisses this not by evidentiary refutation, but by moral fiat: to target a city *is* to target the people. That is a substantive philosophical claim about the nature of intention, not a given of the DDE itself.

  Furthermore, the pamphlet's purpose was to stop an honorary degree. To do this, she had to establish that Truman was a *murderer*, not just that he made a controversial strategic error. DDE alone allows for tragic errors where bad effects are foreseen but not intended. To get to "murder," Anscombe had to tighten the definition of intention until the "foreseen/ unintended" loophole was welded shut.

  ### Conclusion

  You win the argument, though your friend is not entirely wrong. The *structure* of the condemnation is Double Effect, but the *certainty* of the condemnation relies on Anscombe's distinctive epistemology of intention and her nascent critique of consequentialism.

  A standard DDE application treats the doctrine as a test to be passed or failed after weighing evidence. Anscombe treats the doctrine as a wall that should never have been approached. She uses the pamphlet to demonstrate that once you accept the premise that "good ends justify evil means" (which she equates with the willingness to bomb civilians), you have already abandoned the moral framework that makes DDE intelligible. Therefore, the piece is not merely an application of the doctrine; it is a defense of the doctrine's underlying worldview against a culture she views as having lost the capacity to understand it.
