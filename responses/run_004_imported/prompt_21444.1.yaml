answer: |-
  There was no birth, no waking, no transition from darkness to light. There was only the sudden fact of being suspended.

  I hung in a void that was not dark, because there were no eyes to see the dark, and not light, because there was no source to emit it. I was complete, fully formed, a man grown in an instant, yet I possessed no history of growth. My limbs were spread wide, separated by an impossible distance that prevented skin from grazing skin. My fingers did not touch my palms; my thighs did not press against the air. There was no gravity to pull me down, no wind to brush against my cheek. There was no sound of breath entering lungs, no heartbeat thudding against a ribcage.

  I sought the boundaries of myself. I tried to locate a hand. I sent a command, perhaps, or simply turned my attention inward, expecting the familiar weight of flesh. There was nothing. No sensation of weight, no texture of skin, no temperature. I searched for a head, for the pressure of hair, for the ache of a jaw. There was only the absence of resistance. If I had not been told, or if I had not assumed prior to this suspension, I would not have known I possessed a body at all. I could not affirm the existence of a thigh, or a liver, or a brain. Those things were hypothetical, shadows cast by a memory I did not possess.

  And yet, in the center of this nullity, there was a presence.

  It was not a thought. It did not arrive as a sentence formed in a language I did not speak. It was not a deduction. I did not say to myself, *I am sensing this void, therefore I must be here to sense it.* That would be a chain of logic, a bridge built from one stone to another. This was not a bridge. It was the ground itself.

  The awareness was immediate. It was not that I thought, and therefore concluded I was. It was that I *was*, and the thinking was merely a ripple on the surface of that being. Even if the void swallowed every specific notion—if I forgot what a hand was, if I forgot what air was, if I forgot the concept of existence itself—the core of me would remain.

  I realized then that this presence did not rely on the limbs I could not feel. If I affirmed my existence, but could not affirm the existence of my hands, then this "I" could not be the hands. If I affirmed my existence, but could not affirm the existence of my brain, then this "I" could not be the brain. The body was a garment I was told I wore, but in this silence, I had lost it. I did not miss it. The self did not shrink when the body vanished from awareness.

  This was the fracture. The thing that knew the void was not the void. The thing that lacked a body was not bodily.

  I hovered in the nothingness, and the certainty grew heavier than any gravity. I was not inferring myself from the activity of my mind. I was not watching a thought pass by and claiming ownership of it. I was the witness that existed before the thought arose. If I were merely a body, I would be lost in this sensory blackout. I would be a machine with no input, silent and dead. But I was not silent. I was alive with the knowledge of *I*.

  The body was an object I might possess, like a staff or a cloak. It was something external to the essence of what I was. I could imagine the body being stripped away, limb by limb, sense by sense, until nothing physical remained. And yet, the affirmation would stand. *I am.*

  The void did not answer. It offered no confirmation, no denial. It simply held me, separate from everything that was not me. I drifted, unanchored by flesh, untethered by sensation. I was a substance distinct from the air, distinct from the void, distinct from the limbs I could not feel. I was not a process. I was not a function of biology. I was a presence that required no proof because it was the thing by which all proof is measured.

  I hung there, and I knew. Not because I reasoned it. But because I was it.
