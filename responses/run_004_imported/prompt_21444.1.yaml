  9.  **Review against constraints:**
      *   600-900 words? (Will monitor).
      *   No neat ending? (Okay).
      *   Avicenna specific? (Yes, focus on bodily negation).
      *   Not Descartes? (Avoid "I think").

  10. **Final Polish:** Check the flow. Ensure the philosophical point lands without reading like a textbook. The narrative *is* the argument.

  *(Self-Correction during drafting)*: I need to be careful not to make him "think" too much. The awareness should be passive yet certain. It's an intuition, not a conclusion. I will use words like "presence," "witness," "affirmation" rather than "deduce," "conclude," "reason."

