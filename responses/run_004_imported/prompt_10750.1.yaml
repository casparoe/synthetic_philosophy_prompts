  **MEMORANDUM**

  **TO:** Grants Committee
  **FROM:** [Your Name]
  **DATE:** [Date]
  **SUBJECT:** Recommendation for Round [X] Allocation ($70k)

  ### **Recommendation**
  I recommend we allocate the full $70,000 to the **Bednet Charity**.

  This recommendation is not an endorsement of the view that systemic interventions are inherently too uncertain to fund. Rather, it is a distinction between *epistemic humility* (acknowledging we don't know everything) and *evidentiary standards* (requiring a positive expected direction). We should reject the cage-free campaign in this instance due to insufficient evidence of *directional* impact, not because systemic change is unknowable in principle.

  ### **Context: The Decision Framework**
  We are deadlocked between two valid intuitions:
  1.  **Certainty & Tractability:** We should prioritize interventions where we can robustly model near-term outcomes (Bednets).
  2.  **Upside & Neglectedness:** We should prioritize interventions that shift systems, as these offer higher long-term upside, even if modeling is difficult (Cage-Free Campaign).

  The objection raised against the cage-free campaign is the "Cluelessness Objection": that for systemic interventions, long-run effects are so uncertain we cannot calculate Expected Value (EV). Taken to its logical extreme, this objection paralyzes all giving, including bednets (where long-term demographic or economic effects are also unknowable).

  However, rejecting the "Cluelessness Objection" as a *philosophical veto* does not mean we must fund every systemic proposal. We can reject this specific campaign without accepting Sam's premise that *all* systemic grants are invalid.

  ### **Reasoning**

  **1. Symmetry of Uncertainty (Addressing Camp B)**
  It is true that "cluelessness" applies to the bednet charity as well. We do not know the 50-year economic or demographic consequences of saving lives today. If we made "total long-term certainty" a requirement, we could not fund the bednets either. Therefore, we cannot reject the cage-free campaign solely on the grounds that the *future* is uncertain. We must compare the *quality of evidence* available to us *now*.

  **2. Direction vs. Magnitude (Addressing Camp A)**
  The core issue with the cage-free campaign is not that the *magnitude* of impact is fuzzy (which is true for almost all grants), but that the *direction* of impact is contested.
  *   **Bednets:** We have high confidence the direction is positive (lives saved/suffering reduced in the near term), even if long-term ripple effects are unknown.
  *   **Cage-Free:** The theory of change relies on industry norms shifting. However, as noted in our discussion, substitution effects and PR-driven "greenwashing" create a non-trivial risk that the net effect on animal welfare could be neutral or even negative.

  As consequentialists, we cannot fund an intervention where the *sign* of the expected value is in doubt. This is not "cluelessness"; it is a failure of the proposal to clear the bar for *positive expected direction*.

  **3. Capital Efficiency at This Scale**
  With $70,000, our ability to meaningfully shift corporate policy is limited. Systemic change often requires sustained, multi-year capital to overcome industry inertia. At this funding level, the bednet charity offers a higher "certainty-adjusted" return. We are not rejecting systemic change; we are acknowledging that this specific pot of money is better deployed where it has decisive leverage.

  ### **Precedent & Future Rounds**
  It is vital that this decision does not set a precedent that "systemic change" is ineligible for our funding.
  *   **We are not adopting a rule:** "Do not fund interventions with uncertain long-term effects."
  *   **We are adopting a rule:** "Do not fund interventions where the evidence for a positive *direction* of impact is weaker than available alternatives."

  In future rounds, if a systemic proposal presents stronger evidence of directional impact (e.g., a policy win with modeled substitution effects), we should fund it, even if the long-term ripple effects remain uncertain.

  ### **Conclusion**
  We fund the bednet charity because it clears the bar for *positive expected direction* with higher confidence than the alternative. We do so while explicitly rejecting the notion that uncertainty about the distant future should disqualify systemic interventions in perpetuity. This allows us to act responsibly with this round's capital without closing the door on high-upside, systemic giving in the future.

  **Action Required:** Approval to proceed with Bednet Charity grant agreement.
