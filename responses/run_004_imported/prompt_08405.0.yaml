          2.  *Logical Induction* (Garrabrant et al./MIRI): Use a market of traders to assign probabilities to logical statements without requiring consistency at every step, focusing on non-exploitability in the limit.
      *   **Specific Subject:** Goldbach's Conjecture (GC).
      *   **Format:** Dialogue between two advocates.
      *   **Requirements:** Real back-and-forth (not monologues), steelmanned arguments (no strawmen), specific critiques (Impossible Worlds asks about the *ontology* of belief in Logical Induction; Logical Induction asks about the *practical relevance* of limits in Impossible Worlds/Standard Bayesianism).

  2.  **Character Conception:**
