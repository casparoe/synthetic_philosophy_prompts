          *   Logical Induction provides a computable procedure.
          *   The "limit" ensures you don't lose money against any efficient pattern, which is what rationality *is* for bounded agents.
          *   GC isn't just true/false; it's about the *evidence* we have so far (heuristics, checked cases).

  4.  **Drafting - Section by Section:**

