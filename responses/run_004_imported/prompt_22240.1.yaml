  So in my formal epistemology seminar we just covered the problem of logical omniscience, and one consequence of it has been bugging me. Standard Bayesian models require credences to obey the probability axioms, which means every logical or mathematical truth already gets probability 1 in every world of your space before you've done any actual proof work, so what does it even mean, formally, for someone to learn a theorem by proving it? Conditionalization doesnt seem to have anything to latch onto there, since you apparently believed it with certainty the whole time. Can you walk through the most important implications of this for Bayesian epistemology more broadly, e.g. whether stuff like awareness-growth models or logical induction actually rescue the picture of mathematical learning, or if Bayesianism just has to bite the bullet and admit its "ideally rational" agent can't do math the way mathematicians actually do?
