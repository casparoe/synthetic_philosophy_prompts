  **MEMORANDUM**

  **TO:** Fertility Clinic Ethics Committee
  **FROM:** Community Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding PGT Request for Embryo Selection Based on Hereditary Deafness

  ### 1. Executive Summary

  The Committee is currently reviewing a request from a deaf couple undergoing IVF to utilize Preimplantation Genetic Testing (PGT) not to screen *out* the gene for hereditary deafness, but to specifically select *for* an embryo carrying that gene. The couple views deafness as a cultural identity rather than a medical deficit.

  This memo recommends **Denial** of the specific request to actively select *for* deafness, while affirming that the clinic will not discard deaf embryos solely on the basis of hearing status if they are the only viable options.

  While the request raises important questions about reproductive autonomy and disability rights, approving it creates an ethical precedent that the clinic cannot sustainably manage. Crucially, the standard "Non-Identity" defense (that no specific child is harmed by being born deaf rather than hearing) is logically insufficient. This memo outlines why that argument fails, addresses the "proves too much" objection raised during our last session, and proposes a "Comparative Welfare" standard that aligns with our policy to serve "the welfare of the future child."

  ### 2. The Ethical Landscape

  **The Non-Identity Problem**
  Proponents of the request rely on the philosophical "Non-Identity Problem." The argument is that choosing Embryo A (deaf) over Embryo B (hearing) does not harm Embryo A, because if we had chosen Embryo B, Embryo A would never have existed. Therefore, Embryo A is not worse off than they would otherwise have been (which is non-existence).

  **The "Proves Too Much" Objection**
  As one committee member correctly noted, relying solely on the Non-Identity argument is dangerous. If "different child = no harm" is our only ethical rule, it would logically justify selecting an embryo predisposed to a life of chronic pain or significantly shortened lifespan over a healthy one, provided the parents prefer it. Since the committee would unanimously reject selecting for a painful life, the Non-Identity argument alone cannot be our justification. It "proves too much."

  ### 3. Ethical Analysis and Recommendation

  To answer the "proves too much" objection, we must move beyond the question of *harm to a specific child* and address the *obligation of the selector*.

  **A. Rejecting the Non-Identity Defense**
  We must acknowledge that the Non-Identity argument, while logically sound regarding "harm," is insufficient regarding "welfare." Our policy mandates serving "the welfare of the future child." This implies a comparative obligation. When prospective parents have the capacity to choose between possible future children, they (and the medical professionals assisting them) have a moral obligation to choose the child with the greater opportunity for well-being, all else being equal.

  **B. Avoiding the Slippery Slope (Answering the Objection)**
  The "proves too much" objection warns that a comparative obligation could lead to eugenics (e.g., selecting for height, IQ, or excluding minor disabilities). To avoid this, we must distinguish between **Enhancement**, **Identity**, and **Basic Functioning**.

  1.  **Enhancement:** We do not require parents to select the "best" possible child (e.g., highest IQ). This respects autonomy and avoids eugenics.
  2.  **Basic Functioning:** We *do* require that parents not select for traits that significantly restrict a child's range of opportunity or capacity for well-being *without compelling medical justification*.
  3.  **The Distinction:** Selecting for a life of chronic pain violates the principle of Basic Functioning because pain is intrinsically detrimental to welfare. Selecting for deafness is the ethical equivalent in this context. While we acknowledge the Deaf community's valid cultural perspective, in the context of the broader society in which this child will live, hearing provides a wider range of opportunity and access.

  Therefore, the "proves too much" objection is answered not by abandoning the comparative standard, but by limiting it to **significant health and functional barriers**. We deny the request for deafness for the same reason we would deny a request to select for a painful condition: both reduce the child's future welfare relative to the available alternative.

  **C. Institutional Integrity**
  As a medical institution, our mandate is to promote health and reduce barriers to well-being. Actively intervening to ensure a child is born with a sensory limitation contradicts the fundamental medical mission of healing and prevention. While we must respect the parents' identity, we cannot weaponize medical technology to contravene medical welfare.

  ### 4. Policy Application: "Welfare of the Future Child"

  Our policy requires decisions to serve "the welfare of the future child." In cases where the child's identity depends on the choice (the Non-Identity scenario), "welfare" must be interpreted comparatively:

  *   **Interpretation:** Welfare is not merely "a life worth living." It is "a life with the greatest reasonable opportunity for flourishing."
  *   **Application:** An embryo with the potential for hearing has a statistically wider range of opportunity in the general population than an embryo with the potential for deafness. Choosing the latter restricts that range.
  *   **Limit:** This does not require selecting for "super-normal" traits (enhancement), only for standard functional capacities (health).

  ### 5. Recommendation

  **I recommend the Committee Deny the request to actively select *for* the deafness gene.**

  However, to ensure we are not acting discriminatorily, this denial should be accompanied by the following clarifications:

  1.  **No Active Selection:** We cannot use PGT to *identify and choose* a deaf embryo over a hearing one.
  2.  **No Discarding:** If the *only* viable embryos produced are deaf, we should not discard them solely on the basis of hearing status. In that scenario, transferring a deaf embryo serves welfare better than preventing the child's existence.
  3.  **Counseling:** The couple should be offered counseling with a specialist familiar with Deaf culture to ensure their decision is informed not just by cultural identity, but by a realistic understanding of the medical and social challenges their child may face.

  ### 6. Conclusion

  We can respect the couple's identity without endorsing the use of medical technology to limit a future child's functioning. By rejecting the Non-Identity argument as our sole justification, we avoid the "proves too much" trap. By adopting a Comparative Welfare standard limited to basic functioning, we maintain ethical consistency: we would not select for a painful life, and similarly, we should not select for a life with significant sensory limitations when a less limited alternative is available.

  This decision upholds our policy to serve the welfare of the future child while maintaining the integrity of the clinic's medical mission.

  **Recommendation:** **Denial** of request to select *for* deafness.
