          *   Cofounder: Jeffreys Prior (Beta(0.5, 0.5)). Represents "invariance under reparameterization," often considered "non-informative" in a different sense.
      *   **The Data:** Very small sample size ($N=55$ total). 0 successes in control is a tricky edge case for frequentist tests (chi-square might fail, Fisher's exact is better), but Bayesian handles it fine *if* priors are chosen carefully.
