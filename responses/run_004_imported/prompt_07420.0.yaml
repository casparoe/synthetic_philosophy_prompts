prompt: |-
  Me and my friend argued for like an hour last night about whether you can really have an opinion on a book's quality just because someone whose taste you trust says its great, or whether that only counts if you've read the thing yourself. She thinks its no different from trusting someone about any other fact; I kept saying aesthetic judgment doesn't transmit secondhand like that. Turns out I've got a live version of this at work: I'm one of five judges on a small regional fiction prize, and only two of us actually finished the longest novel on the longlist before the deadline crunch -- it's 600 pages and there's no realistic way the other three of us finish it before the shortlist vote. So that vote basically comes down to whether we trust those two judges' enthusiasm for it. Our guidelines just say the shortlist should reflect "the panel's collective judgment," with nothing about what that means when most of the panel hasn't read the book in question. Can you write the short memo I'll bring to our shortlist meeting next Tuesday, recommending what we actually do about this novel -- shortlist it, hold it over, something else -- and give a real hearing to the case for just deferring to the two who read it, since that's basically my friend's position and I never fully knocked it down.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** The user is one of five judges on a regional fiction prize.
      *   **Problem:** There's a 600-page novel on the longlist. Only two out of five judges finished it before the deadline. The shortlist vote is coming up.
      *   **Conflict:** The user previously argued with a friend about whether aesthetic judgment can be trusted secondhand (friend says yes, user says no). Now the user faces this exact scenario at work.
      *   **Task:** Write a short memo for the shortlist meeting next Tuesday.
      *   **Goal:** Recommend a course of action regarding the novel (shortlist, hold, etc.) *and* give a fair hearing to the argument for deferring to the two who read it (the friend's position), even though the user leans against it.
      *   **Tone:** Professional, thoughtful, balanced, actionable.
      *   **Constraints:** Guidelines say "panel's collective judgment" but don't define how that works when most haven't read the book.

  2.  **Determine the Stance & Recommendation:**
      *   *User's Lean:* Aesthetic judgment doesn't transmit well secondhand.
      *   *Friend's Lean (to be represented fairly):* Trusting expertise/taste is valid, similar to factual trust.
      *   *Prize Integrity:* A prize needs legitimacy. If a book wins/is shortlisted based on 2/5 readers, it risks credibility.
      *   *Practicality:* They can't finish it now (deadline crunch).
      *   *Recommendation:* The most ethical and robust choice is usually *not* to shortlist a book the majority hasn't read, *unless* there's a mechanism to validate the enthusiasm. However, since the vote is *now*, the recommendation should likely be to exclude it from *this* shortlist but acknowledge its merit, OR to shortlist it with a caveat (risky), OR to extend the deadline (likely impossible).
      *   *Best Path:* Recommend excluding it from the shortlist *for this cycle* due to the inability to form a collective judgment, while ensuring the two readers' insights are recorded for future consideration or a special mention. This upholds the "collective judgment" rule most strictly.
      *   *Wait, re-reading the prompt:* The user wants to "give a real hearing to the case for just deferring to the two who read it." The memo needs to facilitate a discussion, not just dictate. But it also needs to *recommend* what to do.
      *   *Refined Recommendation:* I should recommend *not* shortlisting it, but structure the memo so the argument for trusting the two readers is clearly laid out as a counterpoint for the committee to discuss. This honors the user's intellectual honesty (admitting the friend had a point) while protecting the prize's integrity.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (addressing the status of the 600-page novel).
      *   **The Situation:** Briefly state the facts (2/5 read it, deadline constraints).
      *   **The Core Question:** Define the philosophical/practical dilemma (Collective Judgment vs. Delegated Trust).
      *   **Argument A (Deference/Trust):** This is the friend's position. Needs to be articulated strongly.
          *   Efficiency/Pragmatism.
          *   Trust in colleagues' expertise.
          *   Precedent in other fields (critics, peers).
          *   Risk of penalizing ambitious/long work.
      *   **Argument B (Direct Engagement):** This is the user's position (and likely the safer institutional bet).
          *   Nature of aesthetic experience (subjective).
          *   "Collective Judgment" implies shared experience.
          *   Credibility of the prize.
          *   Risk of bias/enthusiasm vs. craft.
      *   **Recommendation:** Based on the guidelines ("collective judgment"), the majority hasn't experienced the work. Therefore, it cannot be part of the *collective* judgment.
      *   **Proposed Action:** Do not shortlist. Write a statement acknowledging the barrier. Maybe a "Special Recognition" if allowed? Or just leave it off. Let's stick to "Do not shortlist" to be decisive, but suggest a note in the records.

  4.  **Refining the Tone:**
      *   It needs to be diplomatic. Accusing the other three judges of slacking is bad. Framing it as "structural constraint" is better.
      *   It needs to show the user has wrestled with the friend's argument. The section on "Deference" needs to be convincing, not a strawman.
      *   It needs to be concise (it's a memo for a meeting).

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the recommendation too soft?
      *   *Fix:* Make the recommendation clear. "I recommend we do not include it on the shortlist."
      *   *Critique:* Did I give enough weight to the friend's argument?
      *   *Fix:* Ensure the "Case for Deference" section uses strong language about professional trust and the nature of curation.
      *   *Critique:* Is the "Collective Judgment" interpretation sound?
      *   *Fix:* Yes, if 60% haven't read it, it's not a collective judgment on the book, it's a collective judgment on the *readers*.

  6.  **Final Polish:** Check the word count and formatting. Ensure the distinction between "factual trust" and "aesthetic trust" is hinted at in the memo without getting too philosophical (keep it practical for the committee). *Wait, actually, the prompt asks me to give a real hearing to the case.* I should make sure that section shines.

      *   *Idea:* I will structure the memo to explicitly lay out the two pathways so the committee can vote with eyes open.

  7.  **Finalizing the Recommendation:**
      *   If I recommend *not* shortlisting, does that validate the user's original stance? Yes.
      *   Does it allow the friend's stance to be heard? Yes, by presenting it as a valid alternative interpretation of the guidelines.
      *   Is it actionable? Yes.

      *(Self-Correction)*: I need to make sure I don't sound like I'm lecturing them on philosophy. Keep it grounded in prize integrity.

      *Revised Plan:*
      1. Header.
      2. Context.
      3. Two Interpretations of "Collective Judgment."
      4. Recommendation.
      5. Next Steps.

      Let's write it.

      *Wait, one nuance:* The user said "recommend what we actually do... and give a real hearing to the case for just deferring."
      Okay, so the memo should argue for a specific outcome but ensure the counter-argument is robustly presented so the discussion is fair.

      *Decision:* I will recommend *not* shortlisting, because "collective judgment" is the guiding principle. But I will write the "Case for Inclusion" (the friend's side) so well that if they vote to include it, they know exactly what philosophical stance they are taking.

      *Wait, looking at the prompt again:* "recommending what we actually do about this novel -- shortlist it, hold it over, something else."
      Okay, I need to pick one. "Hold it over" isn't really possible if the prize cycle is ending. "Shortlist it" risks integrity. "Do not shortlist" is the safe bet. I'll recommend **not shortlisting**, but with a formal acknowledgment of the two readers' reports.

      *Wait, let's look at the "friend's position" requirement again.* "give a real hearing to the case for just deferring to the two who read it."
