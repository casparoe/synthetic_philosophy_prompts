      *   "Close with a brief, general principle": Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm dismissing the logicians. Their point about the autonomy of logic is philosophically weighty. I will frame the recommendation as preserving the *work* while retiring the *honor*.

