answer: |-
  **MEMORANDUM**

  **TO:** Advisory Board, Society for Philosophy of Language
  **FROM:** [Your Name], Advisory Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Frege Prize

  **1. Context and Purpose**

  As we approach next month's vote regarding the society's early-career prize, we face a tension between two legitimate commitments: our dedication to the history of our discipline and our responsibility to the ethical standards of our current community. The revelation of Frege's 1924 diary entries—detailing his antisemitism and rejection of democracy—has rightly forced us to examine whether attaching his name to our highest honor remains tenable. This memo outlines the arguments at play, offers a concrete recommendation, and proposes a guiding principle for future adjudications of this nature.

  **2. Analysis of Competing Positions**

  The board is currently divided. To ensure our decision is robust, we must articulate the strongest version of both positions, particularly the one we may ultimately overrule.

  *The Case for Renaming:* Proponents argue that a prize is not merely a label but a performative act of honor. By attaching Frege's name to an award given to living scholars, we signal that he represents an aspirational ideal for the profession. Given that his documented views explicitly excluded Jews and others from the political community, continuing this honor risks signaling that similar exclusions are compatible with our core values. Furthermore, there is a philosophical argument that Frege's logical absolutism—the idea that truth is independent of the thinker—may not be as hermetically sealed from his political absolutism as we hope. To ignore this is to engage in a naive separation of work and worker.

  *The Case for Retaining the Name (Steel-manned):* The strongest argument for retention does not rely on ignorance of Frege's politics, but on a specific conception of logical truth. This faction argues that Frege represents a "limit case" for the separation of person and work. Unlike a novelist or a political theorist, whose output is inextricably linked to their worldview, Frege's contributions (the *Begriffsschrift*, the distinction between sense and reference) are formal tools. Their validity is objective and universal; they do not derive their cogency from Frege's moral character. To remove his name on biographical grounds risks setting a precedent where the validity of scientific and logical work is held hostage to the moral purity of its discoverer. If we rename the prize, we risk implying that logic itself is tainted by the logician, potentially opening the door to a politicized evaluation of formal science that undermines the very objectivity we seek to protect. For this group, retaining the name is a defense of the autonomy of truth.

  **3. Recommendation**

  I recommend that the society **retire Frege's name from the early-career prize, replacing it with a descriptive title (e.g., "The Society Prize in Logic and Philosophy of Language"), while simultaneously issuing a permanent public statement contextualizing the change.**

  This recommendation prioritizes the function of the prize as a contemporary honor over its function as a historical marker. While the "autonomy of truth" argument is philosophically sound regarding the *work*, it is less persuasive regarding the *award*. An award is a social instrument used to build community and signal values to early-career scholars. We can acknowledge Frege's foundational role in the history of logic without asking current recipients to stand under his banner.

  To address the concern of erasure, the society should publish a permanent statement on its website and in the award citation. This statement should acknowledge Frege's monumental contributions to the field, explicitly note the historical reasons for the name change (citing the 1924 diary), and affirm that the retirement of the name is a rejection of his politics, not his logic. This preserves the historical record without maintaining the honorific.

  **4. Implementation Timeline**

  *   **November 2023:** Board vote on the recommendation.
  *   **December 2023 – January 2024:** Drafting of the historical context statement by a sub-committee (including representatives from both factions).
  *   **February 2024:** Update society website, call for papers, and letterhead to reflect the new prize title.
  *   **Next Award Cycle (2025):** The prize is awarded under the new name. The citation includes the contextual statement.

  **5. A General Principle for Future Adjudication**

  This will not be the last time our field confronts a foundational figure with an ugly private archive. To avoid ad hoc decision-making in the future, I propose the society adopt the following heuristic:

  **The Principle of Distinct Functions:** *When evaluating a namesake, the society must distinguish between historical attribution and normative honor.* Historical attribution (e.g., "Fregean semantics," lecture halls, textbook chapters) describes the genealogy of ideas and should remain accurate regardless of the author's character. Normative honor (e.g., prizes, medals, fellowships) signals current community values and aspirational standards. When a namesake's documented actions fundamentally contradict the inclusive values required for a thriving scientific community, the name should be retired from normative honors while preserved in historical attribution.

  This principle allows us to honor the truth of the work without endorsing the life of the worker, ensuring we remain faithful to both our history and our future.
