  3.  **Compare with Newcomb's Problem:**
      *   *Newcomb:* Predictor puts money in boxes *before* you choose. Your choice doesn't causally affect the money, but it correlates with it. CDT says "Two-box" (take both) because the money is already there. EDT says "One-box" (take only B) because that correlates with the million.
      *   *Death in Damascus:* Death decides where to go based on where you *will* be. Your choice determines where you are. Death's location is fixed based on your choice.
      *   *Key Difference:* In Newcomb, the causal arrow goes Predictor -> Box Content -> You Choose. In Death, the "prediction" is essentially simultaneous or logically prior to your action in a way that ties your *decision process* to the outcome. It's a matching game.

  4.  **Why CDT Struggles (The "Instability" Problem):**
      *   CDT asks: "Given my current belief about the world, which action causes the best outcome?"
      *   *Step 1:* I think Death is in Damascus.
      *   *Step 2:* If Death is in Damascus, I should go to Aleppo to survive.
      *   *Step 3:* But wait, Death predicts me. If I decide to go to Aleppo, Death will be in Aleppo.
      *   *Step 4:* So if I go to Aleppo, I die. I should go to Damascus.
      *   *Step 5:* But if I decide to go to Damascus, Death will be in Damascus.
      *   *Step 6:* So if I go to Damascus, I die. I should go to Aleppo.
      *   *Result:* Infinite loop. CDT relies on stable probabilities of states of the world. Here, the "state of the world" (Where is Death?) depends on the action I am evaluating. CDT assumes states are independent of actions (causally). Here, they are logically linked via the predictor.
      *   *The "Gut" Explanation:* CDT assumes you can hold the world fixed and ask "What if I do X?" But Death *moves* when you think about doing X. You can't hold the world fixed.

  5.  **Why Randomization (Mixed Strategies) Fails:**
