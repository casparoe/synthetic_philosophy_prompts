answer: |-
  This is a brilliant observation, and it is one that often sparks excitement when students encounter *The Querist* after grappling with the *Principles*. The structural parallel is undeniable: in both cases, Berkeley seems to be stripping away a supposed "substance" (matter in ontology, gold in economics) to reveal a relational or functional reality (ideas/perception in ontology, credit/power in economics).

  However, while the *temperamental* link is strong, the claim that the economics follow *logically* from the metaphysics—and that one cannot resist the former without refuting the latter—is likely too strong. Here is a breakdown of why that connection is more analogical than deductive, which should give you plenty of fodder for your seminar.

  ### 1. The Category Error: Ontology vs. Value
  The primary hurdle to your proposal is that Berkeley's immaterialism is an ontological claim (what exists?), while his monetary theory is a axiological and functional claim (what is valuable and how does it function?).

  *   **Immaterialism:** Claims that "matter" as an unperceiving substratum is a contradiction. It denies the *existence* of material substance.
  *   **Monetary Theory:** Claims that "value" is not intrinsic to the metal but is derived from social utility and credit. It denies the *economic necessity* of material substance.

  One can consistently hold that gold has material substance (rejecting Berkeley's metaphysics) but agrees that it makes for terrible money compared to paper credit (accepting Berkeley's economics). Conversely, one could be a Berkeleyan immaterialist but argue that, within the realm of ideas, the *idea* of gold is more stable and universally perceived than the *idea* of paper, thus making it better money.

  Therefore, the economic conclusion does not follow *straight* from the metaphysical premise. The metaphysics removes the *idol* of matter; the economics removes the *idol* of mercantilism. They are parallel campaigns against "prejudice," but one does not strictly entail the other.

  ### 2. The Shared Target: Reification
  Where your intuition is strongest is in identifying Berkeley's philosophical temperament. Berkeley is fighting **reification** (treating abstract relations or signs as concrete things) in both domains.

  *   In the *Principles*, he argues we reify "Matter" out of our sensory experiences.
  *   In *The Querist*, he argues we reify "Wealth" out of the actual industry and power of a nation.

  In this sense, Berkeley is an ancestor of fiat currency theory, but not *simply in virtue of being an immaterialist*. Rather, he is an ancestor because he applies a **nominalist and functionalist** methodology to both. He treats money as a system of signs (tickets/counters) that signify power, much like words signify ideas. This linguistic/semiotic approach to money is the real bridge, rather than the ontological denial of matter.

  ### 3. Historical Context: Pragmatism over Deduction
  It is also worth noting that *The Querist* was written in the context of the Irish economic crisis. Berkeley was engaging with contemporary economic thinkers like William Petty and John Law, not just deducing policy from the *Principles*.

  Berkeley's advocacy for paper money was pragmatic: Ireland lacked specie (gold/silver), so to stimulate industry, they needed a medium of exchange that could be expanded. This is a practical argument about liquidity and employment, not a metaphysical argument about the nature of substance. If his metaphysics were the sole driver, he might have argued for money based on *any* perceived object, but his arguments focus on national industry, credit, and circulation.

  ### 4. Resisting the Economics without Refuting the Metaphysics
  To answer your specific question: **No, it would not be fair to say that resisting the economics requires refuting the metaphysics.**

  You can resist Berkeley's economics on Berkeleyan grounds. For example:
  *   **Stability of Signs:** Berkeley emphasizes that the laws of nature are stable because God ensures the regularity of our ideas. One could argue that gold, being rarer and harder to counterfeit, offers a more "stable sign" than paper credit, which is prone to human manipulation (inflation). This preserves the immaterialist ontology (gold is still just a collection of ideas) while rejecting the fiat conclusion.
  *   **Social Perception:** Since *esse est percipi*, the value of money depends on it being perceived as valuable. If the populace *believes* gold is money and paper is worthless, then within Berkeley's system, the paper *is* worthless because it fails to convey the intended "power" in the minds of the perceivers.

  ### 5. Conclusion for Seminar Discussion
  You are right to identify a profound coherence in Berkeley's thought. He is consistently anti-materialist in the broad sense of opposing the idea that value or existence resides in a hidden, inert substratum.

  However, characterizing him as a fiat theorist *simply in virtue of* his immaterialism risks committing a genetic fallacy. Modern fiat theory rests on state sovereignty and legal tender laws (Chartalism), not on the denial of material substance.

  **A productive way to frame this in your seminar might be:**
  > "Berkeley's economics and metaphysics share a common *methodological* enemy: the fetishization of the material sign over the relational reality it signifies. However, while his immaterialism clears the ground by showing matter isn't necessary for existence, it doesn't build the house of fiat currency. That house is built on pragmatic arguments about industry and credit. Therefore, we can accept Berkeley's money without accepting his God, and we can reject his money without restoring material substance."

  This preserves the insight you've had (that there is a deep connection) without overstating the logical dependency.
