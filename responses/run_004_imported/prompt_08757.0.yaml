answer: |-
  # The Ghost in the Reward Function: Why Underdetermination Does Not Doom AI Alignment

  The promise of Inverse Reinforcement Learning (IRL) is seductive in its simplicity. If we cannot safely write down what we want an AI to do, perhaps we can simply show it what we do, and let it infer the goals that drive us. This approach treats human values as a hidden variable, a "true" reward function buried beneath the noise of our actions, waiting to be excavated by a sufficiently clever algorithm. However, a profound theoretical challenge threatens to collapse this enterprise before it begins. The argument, sharpened by Stuart Armstrong and Sören Mindermann, suggests that behavior alone cannot uniquely determine preferences. For any observed action, there are infinitely many combinations of "reward function" and "planning algorithm" that could have produced it. Worse, appeals to simplicity (Occam's razor) fail to break the tie, as complexity can be shifted arbitrarily between the agent's goals and its rationality.

  This leads to a stark question: Can an agent's real preferences ever be inferred from its behavior alone, or is such inference always and unavoidably parasitic on a substantive, non-behavioral assumption about the agent's rationality? The skeptical answer is that the latter is true, rendering the concept of a "true reward" meaningless. The optimistic answer is that this underdetermination is a standard feature of empirical science, not a fatal bug.

  I argue that the skeptics are mathematically correct but philosophically misguided. The impossibility result demonstrates that preferences are not independent ontological entities waiting to be discovered, but it does not prove that value learning is impossible. Rather, it shows that alignment is not a problem of *detection*, but of *interpretation*. The "parasitic" assumption of rationality is not an obstacle to be overcome; it is the very medium through which alignment becomes possible.

  ### The Case for Fatal Ambiguity

  The skeptical case rests on the degeneracy of the reward-planner pair. In the standard IRL setup, an observer sees a policy $\pi$ (a mapping from states to actions) and attempts to recover the reward function $R$ that the agent is maximizing. The fundamental equation is that $\pi$ is the output of a planning process $P$ acting on $R$. The problem is that the mapping from $(R, P)$ to $\pi$ is many-to-one.

  Consider a human who eats a salad. One explanation is that they love salad ($R_{salad}$) and are rational ($P_{rational}$). Another is that they hate salad ($R_{hate}$) but are under a compulsion to eat it ($P_{compulsion}$). A third is that they are indifferent ($R_{null}$) and choose randomly ($P_{random}$). All three pairs produce the same behavior.

  Armstrong and Mindermann formalized the worry that we cannot use simplicity priors to select the "right" pair. In algorithmic information theory, we might hope that the "true" pair is the simplest one. However, they demonstrated that for any pair $(R, P)$, one can construct an alternative pair $(R', P')$ that produces the same behavior with roughly the same total description length. One can make the reward function incredibly complex (e.g., "maximize paperclips unless it is Tuesday and you are wearing blue") while making the planner incredibly simple, or vice versa. The complexity trades off perfectly. If the total complexity of the explanation remains constant, Occam's razor cannot cut away the pathological solutions.

  This result echoes the philosophical skepticism of W.V.O. Quine and Donald Davidson regarding "radical interpretation." Quine argued that there is no fact of the matter to distinguish between translating a native's utterance as "rabbit" versus "undetached rabbit part." Similarly, Davidson argued that attributing beliefs and desires requires a "principle of charity"—we must assume the agent is largely rational to make sense of them at all. We do not read rationality off behavior; we impose it to make behavior legible.

  If this view holds, the IRL enterprise is chasing a phantom. There is no "true" reward function independent of the assumptions we make about how the human thinks. If we assume humans are perfectly rational, we infer one set of values; if we assume humans are myopic and biased, we infer another. Since the data cannot adjudicate between these assumptions, any claim to have "learned human values" is merely a reflection of the priors we baked into the learner. The project of aligning AI to human preferences collapses into the project of aligning AI to the researcher's assumptions about human rationality.

  ### The Case for Progress Despite Underdetermination

  The optimistic counter-argument does not deny the mathematics of underdetermination. Instead, it contextualizes them. The claim here is that the Armstrong-Mindermann result describes a worst-case scenario that does not apply to the actual world, and that it conflates *logical* possibility with *nomological* (law-governed) probability.

  First, the underdetermination of theory by data is not unique to IRL; it is the baseline condition of all empirical science. In physics, multiple mathematical models can often fit the same experimental data. This does not render physics meaningless; it drives scientists to seek new experiments, constrain models with background theory, and accept that our theories are approximations rather than divine truths. Similarly, we are not tabula rasa observers of humans. We possess independent knowledge of human cognitive architecture. We know humans are not arbitrary Turing machines; we are biological organisms with specific neural constraints, evolutionary histories, and cognitive biases (e.g., hyperbolic discounting, loss aversion). By constraining the "planner" component with insights from psychology and neuroscience, we drastically reduce the space of viable $(R, P)$ pairs. We do not need to infer the planner from behavior alone; we can study the planner directly.

  Second, the static IRL setup ignores the power of interaction. In Cooperative Inverse Reinforcement Learning (CIRL), the human and AI are players in a shared game. The AI can ask queries, offer options, or perform actions that elicit informative responses. This dynamic interaction breaks symmetries that static observation cannot. If an AI is unsure whether a human chose A over B because they prefer A or because they were confused, the AI can ask, "Did you mean to choose A?" or present a simplified version of the choice. The "rationality assumption" is not posited once and for all; it is tested and revised in real-time. The human can correct the AI's model of their own irrationality.

  Third, and most importantly, the goal of AI alignment is not metaphysical truth but functional safety. We do not need to recover the "One True Reward" in a Platonic sense. We need a reward function that, when optimized by the AI, leads to outcomes the human would endorse upon reflection. This shifts the criterion from *accuracy of inference* to *stability of endorsement*. If the AI assumes a certain model of rationality, infers a reward, and acts on it, and the human says, "Yes, that is what I wanted," the underdetermination has been practically resolved. The "true" reward is defined operationally by the equilibrium of the human-AI interaction, not by the behavior alone.

  ### Verdict: The Interpretive Necessity

  The impossibility result is correct, but it shows less than it is usually taken to show. It proves that **values are not hidden atoms**, but it does not prove that **values are inaccessible.**

  The skeptical argument relies on a category error: it treats the "reward function" as a physical object buried inside the brain, like a fossil, which the AI must uncover without disturbing the strata. If values were fossils, the Armstrong-Mindermann result would be fatal, because the strata (behavior) are compatible with too many different fossils. But values are not fossils. They are more like the meaning of a text.

  As Davidson argued, you cannot interpret a text (or an agent) without assuming a background of coherence and rationality. This is not a failure of interpretation; it is a condition of its possibility. If we treat the "parasitic assumption" of rationality as a bug, we misunderstand the nature of mind. There is no "view from nowhere" from which to observe preferences without a model of the mind that holds them.

  Therefore, the inference of preferences is indeed parasitic on assumptions about rationality, but this is not an obstacle to genuine progress. It merely clarifies the task. The challenge of AI alignment is not to build an agent that can infer values from behavior *alone* (which is indeed impossible). The challenge is to build an agent that shares enough of our cognitive context—or can learn enough through interaction—that our assumptions about rationality converge.

  The "true reward" is not a pre-existing variable that the AI fails to find. It is a construct that emerges from the successful coordination between the learner and the teacher. The underdetermination theorem tells us we cannot be passive behaviorists; we must be active interpreters. This does not doom IRL. It simply demands that we abandon the hope of a purely observational solution and embrace the reality that learning values is a collaborative, normative, and inherently interactive process. The ambiguity is not fatal, provided we stop looking for a ghost in the machine and start building a partner in the conversation.
