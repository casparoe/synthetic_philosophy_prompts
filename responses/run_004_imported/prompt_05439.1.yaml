      *   *Escalation:* Get personal but keep it intellectual. "You dropped out" vs. "You sold out." (Maybe too cliché? Let's stick to the ideas).
      *   *Ending:* No resolution. A toast or an interruption.

      *(Self-Correction during drafting)*: Make sure they don't explain the terms to each other. They know them. Use shorthand. "PP," "SIA," "Reference Class."
      *(Refining the Brother's argument)*: He needs to emphasize that SIA allows armchair physics. That's the insult to her cosmology.
      *(Refining the Sister's argument)*: She needs to show that SSA is arbitrary. Who defines the class?

  5.  **Writing - Section by Section:**

      *   *Setup:* Patio, cigarettes (maybe just drinks), Dad laughing inside.
      *   *Dialogue Start:* Brother brings up the "trillion observers" scenario.
      *   *Sister's Pushback:* It's not arrogance, it's probability.
