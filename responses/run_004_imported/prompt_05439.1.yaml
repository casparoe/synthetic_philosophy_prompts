answer: |-
  The patio door slid shut, muffling the screech of Dad's colleagues congratulating him on forty years of tenure. Out here, the air was cold enough to justify the second glass of wine Elena was holding. Mark was leaning against the railing, nursing a beer he hadn't taken a sip from in ten minutes.

  "You're doing it again," Mark said. "You're looking at the sky and seeing a probability distribution instead of stars."

  "And you're looking at me and seeing a sampling error," Elena said. "Relax. It's Dad's party."

  "I can't relax when you're casually endorsing the idea that I can determine the size of the universe by checking my own pulse. That's the Presumptuous Philosopher, El. It's not a quirk. It's a *reductio*."

  Elena swirled her wine. "It's only presumptuous if you think existence is rare. If I tell you there are two urns. One has ten balls, one has ten million. I pull a ball and it exists. Which urn am I more likely to be in?"

  "That's the SIA pitch. I know the pitch." Mark turned, elbows on the railing. "The Presumptuous Philosopher objection isn't about the urns. It's that you think you don't even need to look at the ball. You're saying that if Theory A predicts a billion observers and Theory B predicts a trillion, Theory B is automatically a trillion times more likely *before* we measure a single photon. You're claiming armchair authority over cosmological constants. You're a cosmologist. Since when do we do physics without data?"

  "Since the data is selection-biased," she shot back. "You want data? SSA gives you the Doomsday Argument. Congratulations, you've proven humanity will go extinct by 3000 AD because you were born in the 20th century. Is that the physics you want?"

  "That's a different problem."

  "It's the same problem. It's the reference class mess." Elena stepped into his space, the familiar rhythm of the debate taking over. "You say 'reason as if you are a random observer.' Fine. Random observer of *what*? Humans? Mammals? Conscious entities? Boltzmann Brains? The moment you define the reference class, you've baked in your conclusion. If you want Doomsday, you make the class 'Humans.' If you want to avoid it, you make the class 'All Intelligent Life.' It's subjective. SIA cancels that out. It doesn't care about the class. It just cares that *something* is here rather than nothing."

  "It cares too much!" Mark's voice cracked, just a little. He lowered it, glancing at the sliding door. "It implies that if a theory predicts infinite observers, it's infinitely probable. You can rule out any finite universe just by sitting in a chair. That's not science. That's solipsism with math."

  "It's Bayesian updating with the fact of my existence included," she said, flat. "You hate it because it makes the universe big. It makes us unspecial."

  "I hate it because it's arrogant. It's the academic equivalent of walking into a casino and demanding the jackpot because you managed to buy a ticket."

  "Better than walking into a casino, counting only the losers at the poker table to define the 'player class,' and concluding you're about to go broke."

  Mark laughed, a short, sharp sound. "You always do this. You hide behind the reference class problem like it's a shield. But the Presumptuous Philosopher isn't about the class. It's about the *weight*. You're giving prior probabilities based on population counts. That's insane. Imagine two theories of quantum mechanics. One implies a multiverse of 10^500 branches, one implies 10^100. Under SIA, the first one wins by default. We don't even need to run the collider."

  "We don't run the collider to know we aren't Boltzmann Brains," Elena said. "We use SIA. It works. It solves the problem."

  "It solves the problem by assuming the answer!"

  "It solves the problem by acknowledging that I exist!"

  They stood there, the cold air filling the gap between them. Inside, someone started clinking a fork against a glass. A toast was coming.

  "You know," Mark said, finally taking a sip of his warm beer. "Dad spent forty years teaching kids how to read. Concrete stuff. Words on a page. And his two brilliant kids are out here arguing about whether the fact that we're breathing proves the multiverse."

  "Dad understands tenure," Elena said, watching her breath mist. "He knows you have to publish or perish. SIA is just... publishing."

  "SSA is peer review," Mark muttered. "Rigorous. Restrictive."

  "SSA is gatekeeping the reference class."

  "Enough." She raised her glass, not looking at him. "To the sample."

  Mark hesitated, then clinked his bottle against her stem. "To the class."

  They didn't drink. Inside, Dad began to speak. They turned toward the glass, the argument paused but not finished, hanging in the cold air like the mist from their wine.
