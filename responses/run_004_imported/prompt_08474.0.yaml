answer: |-
  **Setting:** *The veranda of the department library, late afternoon. Two graduate students, Udayana (specializing in Nyaya) and Dharmottara (specializing in Buddhist Epistemology), are unpacking their notes after a seminar on Pramanavada.*

  **Udayana:** You looked skeptical when the professor insisted *upamana* was irreducible. I take it you're siding with Dignaga on this?

  **Dharmottara:** Isn't it obvious? Ontological parsimony, Udayana. Why multiply *pramanas* beyond necessity? Perception and Inference cover the entire epistemic landscape. *Upamana* is just inference wearing a costume.

  **Udayana:** A costume? That's a bold claim for a process that yields a unique cognition. Let's stick to the *gavaya*. The city dweller is told, "A *gavaya* is like a cow." Later, in the forest, he sees the animal and thinks, "This is that *gavaya*." The Nyaya position is that this cognition—the relation between the name and the form via similarity—cannot be *anumana*.

  **Dharmottara:** Why not? Look at the structure. The person perceives the animal (*paksa*). They recall the description: "similar to a cow." That similarity functions as the *hetu* (reason). The conclusion (*sadhya*) is "This animal is called 'gavaya'." Where there is a *hetu* and a *sadhya*, there is inference.

  **Udayana:** You're glossing over the causal condition of *vyapti* (invariable concomitance). For inference to work, I must already know the universal connection between the *hetu* and the *sadhya*. I need to know, prior to this moment, that "Whatever resembles a cow in this specific way is named 'gavaya'." But I *don't* know that. That is precisely what I am learning in this moment. If I already knew the connection, *upamana* would be unnecessary. If I don't know the connection, inference is impossible.

  **Dharmottara:** That's the standard Nyaya objection, but it assumes *vyapti* must be a metaphysical necessity known through repeated observation. It isn't. In this case, the *vyapti* is established by the initial testimony of the forester. When he said, "A *gavaya* is like a cow," he implicitly established a rule: "The term 'gavaya' applies to things sharing this specific similarity to a cow." The forest cognition is simply applying that rule to a present instance. It's an inference based on the authority of the description.

  **Udayana:** But if the authority of the description does the work, that's *sabda* (testimony), not *upamana*. And yet, *sabda* didn't give him the knowledge of the *gavaya* in the forest. The forester didn't point and say, "That one there is a *gavaya*." He gave a general description. The final cognition arises from the *memory of similarity* triggered by perception. In inference, the *hetu* is perceived in the *paksa* and leads to an unperceived conclusion. Here, the object is *right there*. I'm not inferring an unperceived property; I'm identifying a perceived object through a remembered similarity. The causal mechanism (*karana*) is the recollection of similarity, not the apprehension of a logical mark.

  **Dharmottara:** You're conflating the psychological trigger with the epistemic structure. Yes, the object is perceived. But the *identification*—"This is a *gavaya*"—is conceptual. Perception (*pratyaksha*), as Dharmakirti defines it, is free from conceptual construction (*kalpana*). The moment you subsume this particular animal under the universal "gavaya" based on its resemblance to "cow," you have left the realm of perception. You are dealing with universals and names. All conceptual knowledge is inferential because it involves associating a particular with a universal based on a reason. The "reason" here is the exclusion (*apoha*). You recognize it's not a cow, but it's not *not-like-a-cow* in the way the forester described.

  **Udayana:** You're forcing everything into the Perception/Inference binary by redefining inference so broadly it loses its shape. If any conceptual identification is inference, then remembering your own name is inference. That absurdity aside, look at the content of the knowledge. Inference yields knowledge of a property (*dharma*) belonging to a subject. "The mountain has fire." *Upamana* yields knowledge of a *relation* (*samsarga*) between a word and an object. "This object is the referent of the word 'gavaya'." That is a distinct ontological category. Inference cannot generate knowledge of word-object relations; it generates knowledge of fact.

  **Dharmottara:** Is it distinct? Knowing "This is a *gavaya*" is knowing "The word 'gavaya' is applicable here." That is a fact about the world, just like any other. But let's press your point on *vyapti*. You say I can't infer the name without prior knowledge of the connection. But I *do* have prior knowledge: I trust the forester. I know that "Trustworthy speakers use words consistently." So the syllogism is: "This animal resembles a cow (as described). Trustworthy speakers apply the label 'gavaya' to things resembling cows (as described). Therefore, this animal is labeled 'gavaya'." The *vyapti* lies in the reliability of language users, not in the metaphysics of bison.

  **Udayana:** Now you've shifted the ground. You've turned *upamana* into an inference based on *sabda* (the reliability of the speaker). But if it were just *sabda*, the cognition should arise as soon as the forester speaks. It doesn't. It arises only when the similarity is perceived in the forest. And if it's just *anumana* based on reliability, then whenever I learn a new word by definition, I'm inferring. But there's no logical "mark" in a definition.
  Here is the crux: In inference, the *hetu* must be known to be present in the *paksa* and known to be invariably connected to the *sadhya*. In the *gavaya* case, the "similarity" isn't a logical mark proving the name. It's the *means of access* to the name. The similarity *is* the bridge. In inference, the smoke is not the bridge to the fire; it's evidence of the fire. In *upamana*, the resemblance to the cow is the very method by which the name is grasped. The cognition is "This is that *gavaya* because it matches the memory of the description." That "matching" is a unique cognitive event, not a logical pervasion.

  **Dharmottara:** "Matching" is just a psychological description of recognizing a *hetu*. You're insisting on a separate *pramana* because the *feeling* of the cognition is different. But epistemology isn't about phenomenology; it's about validity. How do you verify the *upamana*? You verify it by checking if the animal actually functions as a *gavaya* or if others agree. That verification is either perceptual or inferential. If the *phala* (result) is reducible, and the *vyapti* can be reconstructed as I did with the reliable speaker, why posit a separate ontological source? It violates *laghava* (lightness/parsimony).

  **Udayana:** Parsimony shouldn't come at the cost of accuracy. If I use a scale to weigh gold, and I use a ruler to measure it, both give me data about the gold. If you say, "The ruler is just a slow scale," you've saved on tools but lost the ability to measure length. *Upamana* measures the link between language and world via similarity. *Anumana* measures the link between properties via pervasion. The causal conditions are different. In *anumana*, if I doubt the *vyapti*, the cognition fails. In *upamana*, I don't need a *vyapti* of "All cow-like things are gavayas." I only need the memory of "The forester said 'gavaya' applies to *this* similarity." It's a singular identification, not a universal subsumption.

  **Dharmottara:** But that singular identification relies on the universal "similarity." You can't have it both ways. If it relies on a universal, it's conceptual. If it's conceptual, it's inference. The Nyaya wants to have a special category for "learning names from descriptions," but that's just a subset of learning facts from descriptions.
  Tell me this: If the forester lied, and the animal wasn't a *gavaya*, would your *upamana* be invalid?

  **Udayana:** Yes, it would be *apramana* (invalid cognition).

  **Dharmottara:** And if the smoke was wet and didn't indicate fire, your inference would be invalid. Both depend on the world cooperating with the representation. Since the conditions for validity and invalidity are the same—correspondence with reality—and the structure is essentially "X resembles Y, Y is named Z, therefore X is named Z"—why not call it inference? The middle premise is supplied by testimony, the minor by perception, the conclusion by... well, inference.

  **Udayana:** Because the middle premise isn't a universal proposition in the mind of the learner at the time of the cognition. He doesn't think, "All cow-like things are gavayas." He thinks, "Ah, this matches what the man described." That "matching" (*sadrishya*) is the *pramana*. It's immediate in a way inference isn't. Inference requires a step of deliberation (*paramarsha*). *Upamana* can be instantaneous upon seeing the resemblance. The memory of the description and the perception of the animal fuse. There is no syllogistic step.

  **Dharmottara:** Instantaneity doesn't prove independence. Intuitive inference is still inference. A master logician sees the *vyapti* instantly. That doesn't make it perception.
  I think we are stuck on whether "similarity" is a logical reason or a unique epistemic bridge. For Nyaya, it's a bridge. For us, it's a reason.

  **Udayana:** Precisely. And until you can explain how a "reason" works when the connection between the reason and the conclusion is being established *in that very moment*, I'll keep my *upamana*. You can't infer a connection you are currently discovering.

  **Dharmottara:** And until you can explain how "similarity" isn't a conceptual construction requiring the very universals that inference deals with, I'll keep my two *pramanas*. You can't have a "bridge" without foundations on both sides, and those foundations are perception and concepts.

  **Udayana:** *(Smiling)* So, the city dweller stands in the forest, looking at the *gavaya*. For you, he is running a silent syllogism. For me, he is experiencing a unique recognition.

  **Dharmottara:** As long as we agree he knows it's a *gavaya*, perhaps the ontology doesn't matter for the forest dweller. Only for us.

  **Udayana:** True. But if I'm writing a paper on it, I'm definitely keeping the fifth *pramana*. It makes for a better chapter.

  **Dharmottara:** And I'll write the rebuttal. Parsimony always sells well.
