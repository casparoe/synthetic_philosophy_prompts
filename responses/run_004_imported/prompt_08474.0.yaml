      *   **Key Example:** The *Gavaya* (wild cow/bison) example. A city dweller is told "a gavaya is like a cow," later sees a gavaya in the forest, and recognizes it.
      *   **Requirements:**
          *   Dialogue format (Naiyayika vs. Buddhist Epistemologist).
          *   Genuine back-and-forth (no strawmen, no talking past each other).
          *   Specific technical arguments (e.g., *vyapti*, *sadhana*, *sadhya*, testimony vs. perception).
          *   Address the specific point about lacking prior *vyapti* (invariable concomitance).
