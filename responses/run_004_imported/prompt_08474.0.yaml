      *   **Naiyayika (Udayana):** Precise, focused on categories, causal conditions, and the specific content of the cognition.
      *   **Buddhist (Dharmottara):** Sharp, reductionist, focused on the nature of conceptualization and parsimony (*laghava*).

  6.  **Final Review against constraints:**
