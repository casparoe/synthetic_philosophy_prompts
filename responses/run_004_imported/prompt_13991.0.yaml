answer: |-
  Here is the concrete breakdown of how Critical-Level Utilitarianism (CLU) generates the Sadistic Conclusion, followed by the explanation for Total Utilitarianism.

  ### The Setup: Critical-Level Utilitarianism
  In CLU, the value of a population is not just the sum of welfare ($\sum u$), but the sum of welfare **minus a critical level ($c$)** for each person.
  $$V = \sum (u_i - c)$$
  *   If $u_i > c$, adding the person increases value.
  *   If $0 < u_i < c$, the life is worth living (positive welfare), but adding the person **decreases** total value.
  *   If $u_i < 0$, the life is not worth living (suffering), and adding the person decreases total value.

  Let's set the **Critical Level ($c$) at 10**.

  ### The Example: Choosing Between Two Additions
  Imagine we have to choose between two policies that add new people to the world.

  **Option A: The "Sadistic" Addition**
  *   **Population:** 10 people
  *   **Welfare per person ($u$):** $-5$ (Intense suffering; life not worth living)
  *   **CLU Calculation:**
      $$10 \times (-5 - 10) = 10 \times (-15) = \mathbf{-150}$$

  **Option B: The "Sub-Critical" Addition**
  *   **Population:** 1,000 people
  *   **Welfare per person ($u$):** $+5$ (Life is worth living, but below the critical level)
  *   **CLU Calculation:**
      $$1,000 \times (5 - 10) = 1,000 \times (-5) = \mathbf{-5,000}$$

  ### The Verdict
  Under Critical-Level Utilitarianism, **Option A (-150) is ranked as better than Option B (-5,000).**

  This is the **Sadistic Conclusion**: CLU implies it is better to add a small group of people who suffer intensely (negative welfare) than to add a massive group of people whose lives are happy and worth living, simply because their happiness doesn't meet the arbitrary "critical" threshold. This is why many ethicists feel CLU isn't true progress—it solves the Repugnant Conclusion only by accepting a conclusion that seems morally monstrous in a different way.

  ***

  ### Why Total Utilitarianism Avoids This
  Total Utilitarianism sums raw welfare ($\sum u$) without subtracting a critical level. Therefore, adding people with positive welfare ($+5$) always increases the total value, while adding people with negative welfare ($-5$) always decreases it. Total Utilitarianism would strictly prefer Option B ($+5,000$) over Option A ($-50$), so it never ranks adding suffering people as better than adding happy people, even if it does imply that enough barely-happy people can outweigh a few very happy ones (the Repugnant Conclusion).
