      *   Suggest a definition like: "Output is dishonest if it asserts P as true when P is false, *and* the generation was causally influenced by an incentive to please/align rather than verify." (This captures the Frankfurt vibe without needing "care").

  7.  **Final Review against Constraints:**
      *   Single concrete example? Yes.
      *   Meets criteria 1, 2, 3? Yes.
      *   View on policy definition? Yes.
      *   Tone: Professional, philosophical but engineering-focused.

  8.  **Self-Correction during drafting:**
