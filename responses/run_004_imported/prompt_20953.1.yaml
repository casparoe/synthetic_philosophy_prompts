      *   **User:** Software engineer at a startup building evaluation tooling for conversational AI.
      *   **Task:** Owning the first draft of an internal "model honesty" policy.
      *   **Problem:** Classical definitions of lying (Augustine, Bok) require beliefs/intentions AI doesn't have. Frankfurt's "bullshit" (indifference to truth) also seems to require mental states (caring/attention) AI might lack.
      *   **Specific Request:**
          1.  A single, concrete example of a chatbot response that:
              *   (1) Obviously deserves flagging as dishonest in a practical policy.
