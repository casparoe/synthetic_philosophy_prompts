answer: |-
  **The Variance**

  The rain hadn't stopped since the polls closed. It smeared the city lights outside Arthur's study window into long, weeping streaks of neon and grey. Inside, the silence was absolute. The concession speech sat on the desk, a stack of papers heavy enough to anchor a boat, never delivered.

  There was a knock at the door. Not the heavy pound of a campaign manager coming to pack up the boxes, but a polite, rhythmic tap.

  Arthur opened it. The woman standing there wore a suit that looked expensive but unbranded, the kind of grey that disappears in peripheral vision. She held a briefcase that hummed, faintly, like a server rack.

  "Mr. Vance," she said. "I'm from the Bureau of Variance. We believe you qualify for a consolation viewing."

  Arthur blinked. He was too tired to ask for credentials. "Consolation."

  "Standard procedure for high-stakes divergence," she said, stepping past him into the room. She didn't look at the un-delivered speech. She set the briefcase on the mahogany table and opened it. Inside was a screen, black and reflective. "We found a match. A high-fidelity counterpart in Sector 7-Gamma."

  Arthur sank into his leather chair. "There's a version of me who won?"

  "There is a version of you where the vote margin shifted by three percent in the coastal district," she said. Her voice was flat, clinical. "In that sector, you are the Governor-elect."

  She tapped the screen. It lit up.

  Arthur leaned forward. He saw a ballroom. He knew this ballroom; he had rented it for tonight, assuming he'd need it for a victory party he couldn't afford. The room was packed. Confetti hung in the air like suspended gold dust.

  And there he was.

  The man on the screen wore Arthur's face, but the skin was flushed with adrenaline, not exhaustion. He wore Arthur's tuxedo, but the lapels didn't pull at the shoulder. He stood at a podium, gripping the sides, head thrown back, laughing. A woman—Arthur's wife, Elena—stood beside him. In this room, she was wearing the blue dress she had refused to wear tonight, saying it was jinxing the odds. She was clapping. She looked radiant.

  "He's speaking," the woman from the Bureau said. "Audio?"

  Arthur nodded.

  The sound filled the study. *"...not just for me, but for all of us! We did this together!"*

  The crowd roared. The Arthur on the screen turned to Elena, kissed her cheek, and whispered something that made her throw her head back.

  Arthur in the study felt a cold knot tighten in his stomach. He watched his own hand raise in that familiar wave, the one he had practiced in the mirror for months. On the screen, the wave was triumphant. In the study, Arthur's hand lay limp on the desk.

  "Does this not provide closure?" the Bureau agent asked. She was watching him, pen hovering over a clipboard. "The modal realization is successful. The property of 'winning' is instantiated by your counterpart. In a very real sense, you have won."

  Arthur didn't look away from the screen. On the display, the other Arthur took a sip of champagne. He looked satisfied. He looked like a man who hadn't spent the last six months eating antacids and sleeping four hours a night.

  "He looks happy," Arthur said.

  "He is," the agent said. "And since he is your counterpart, sharing your origin and your qualitative properties up to the divergence point, his satisfaction is causally linked to your choices."

  "That's not my choice," Arthur said quietly.

  "The divergence was a matter of chance. A rainstorm in the coastal district kept turnout down there, but up in Sector 7, it was sunny."

  "It's not me," Arthur said.

  The agent paused. "Legally and metaphysically, under the Lewisian framework, it is sufficient."

  Arthur stood up. He walked to the screen. He was close enough to see the pixels. He saw a speck of food on the other Arthur's chin. He saw the way the other Arthur's eyes crinkled. It was a perfect mimicry. It was a stranger.

  "If I call that number," Arthur said, pointing to the phone on the screen's bezel, "will he answer?"

  "No. Causal isolation is strict."

  "If I scream, will he hear me?"

  "No."

  "If he dies tomorrow, do I die?"

  "No."

  Arthur turned from the screen to the window. The rain was still hammering the glass. The cold of the room seeped into his bones. He thought about Elena, asleep upstairs in the actual house, dreaming a dream he hoped wasn't about tonight. He thought about the debt. He thought about the shame that sat in his chest like a swallowed stone.

  On the screen, the other Arthur was dancing now. He spun Elena around. They looked like a movie of a happy couple.

  "So," Arthur said. "He gets the life. He gets the history books. He gets to wake up tomorrow and be the Governor."

  "And you possess the knowledge that your potential was actualized in the manifold," the agent said. "You are not a man who could never win. You are a man who *did* win, elsewhere."

  Arthur looked back at the screen. The other Arthur caught the eye of a camera, smiling with a confidence Arthur had never truly felt, even before the loss. That smile belonged to the man in the lighted room. It didn't reach across the glass. It didn't warm the study.

  "It doesn't change the rent," Arthur said.

  "The metaphysical comfort is not fiscal."

  "It's not comfort at all," Arthur said. He walked over to the briefcase and closed the lid. The screen went black. The ballroom vanished. The other Arthur, the cheering crowd, the blue dress—all of it snuffed out in an instant.

  The room was just a room again. The silence returned, heavier than before.

  "Will you file the report?" the agent asked.

  "File that I saw him?"

  "File that the counterpart relation was verified."

  Arthur looked at his hands. They were the same hands that held the champagne glass on the screen. But they were empty now.

  "You can file it," Arthur said. "But tell him... tell the Bureau... that when I say 'I lost,' I mean me. This guy. Sitting here."

  "The counterpart theory suggests—"

  "The theory can keep him warm tonight," Arthur said. "I'm going to bed."

  The agent closed her briefcase. The hum faded. She nodded, once, a professional acknowledging a client who refused the refund. She left the study, closing the door softly behind her.

  Arthur stood alone in the dark. Somewhere, in a world he would never touch, the music was still playing. He turned off the lamp, leaving the room to the rain, and walked toward the stairs, carrying the failure entirely on his own shoulders.
