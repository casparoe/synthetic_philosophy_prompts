answer: |-
  This is a classic case study in the philosophy of biology, and you and your friend have inadvertently reenacted one of the most significant scientific controversies of the last decade. The 2012 ENCODE (Encyclopedia of DNA Elements) publication claimed that 80% of the human genome is "functional," based on biochemical activity. This was immediately challenged by evolutionary biologists like Dan Graur, who argued that only about 10–15% is under evolutionary constraint.

  You are correct that this dispute rests heavily on competing philosophical definitions of "function." Let's break down how Robert Cummins's and Larry Wright's accounts apply to the genome, determine if you were talking past each other, and assess which account holds more water in this context.

  ### 1. Robert Cummins: The Causal-Role Account
  **The Theory:**
  In his 1975 paper "Functional Analysis," Robert Cummins proposed that to ascribe a function to a component is simply to describe what that component *does* that contributes to the capacity of a larger containing system. It is an ahistorical, forward-looking account.
  *   **Formula:** $X$ has the function of $Z$ in system $S$ if $X$ does $Z$ and $Z$ contributes to the capacity of $S$.
  *   **Key Feature:** It does not matter *why* $X$ is there. It only matters that $X$ is currently doing $Z$.

  **Ruling on ENCODE:**
  Under the Cummins account, your friend is largely correct. ENCODE defined function as "specific biochemical activity" (transcription, protein binding, chromatin structure).
  *   If a segment of DNA is transcribed into RNA, it is causally contributing to the biochemical state of the nucleus.
  *   If a protein binds to a DNA sequence, that sequence is playing a causal role in that binding event.
  *   **Verdict:** A Cummins-style analysis supports the ENCODE headline. If 80% of the genome exhibits measurable biochemical activity, then 80% has a causal role. Even "noise" (stochastic transcription) is a causal contribution to the cellular environment.

  **The Weakness:**
  The problem with Cummins in this context is that it makes "function" too cheap. As Graur argued with his television analogy: If dust settles on a TV screen and causes a dark spot, the dust is causally contributing to the image on the screen. Under a strict causal-role account, the dust has a "function" in the TV system. Most biologists find this counterintuitive; the dust is merely a nuisance or an accident, not a functional part of the TV.

  ### 2. Larry Wright: The Etiological (Selected-Effect) Account
  **The Theory:**
  In his 1973 paper "Functions," Larry Wright argued that functional statements are inherently historical. A trait has a function only if it exists *because* it performed that function in the past (via natural selection).
  *   **Formula:** $X$ has the function of $Z$ if $X$ is there *because* it does $Z$.
  *   **Key Feature:** It distinguishes between what a trait *does* and what it is *for*. It requires an evolutionary history of selection.

  **Ruling on the Evolutionary Rebuttal:**
  Under the Wright account, you are correct. The evolutionary biologists argued that for DNA to be functional, it must be under **purifying selection** (i.e., mutations in that DNA are harmful and get weeded out).
  *   If a DNA sequence is transcribed merely because the transcriptional machinery is sloppy, it is not there *because* it is transcribed. It is there because it hasn't been deleted yet.
  *   If a sequence binds a protein but that binding confers no advantage (or disadvantage), it is not maintained by selection.
  *   **Verdict:** A Wright-style analysis supports the Graur/evolutionary claim. Since only ~10% of the genome shows signs of evolutionary constraint, only ~10% is "functional" in the etiological sense. The rest is "junk" (neutral drift, parasitic elements, or debris).

  **The Weakness:**
  This account can be too restrictive for physiology. For example, if a novel mutation arises that allows an organism to digest a new food source, it immediately has a causal role, but it doesn't yet have an evolutionary history. Wright would hesitate to call it "functional" until selection has acted on it over generations.

  ### 3. Were You Talking Past Each Other?
  **Yes, but with empirical consequences.**

  You and your friend were indeed using incompatible notions of "function."
  *   **Your Friend (Cummins/ENCODE):** Used "function" to mean **activity**. ("Is this part doing anything?")
  *   **You (Wright/Evolutionists):** Used "function" to mean **purpose/history**. ("Is this part here for a reason?")

  However, this was not *merely* semantics. The ENCODE press release implied that because 80% of the genome is biochemically active, it is biologically *important*. This misled the public and policymakers into thinking that "junk DNA" was a dead theory.

  The empirical stake is the **mutation load**. If 80% of the genome is functional in the Wright sense (under selection), the human mutation rate would result in so many deleterious mutations per generation that the human species would go extinct (a problem known as Haldane's Dilemma). The genome can only sustain a high mutation rate if most of it is inert (junk). Therefore, while the definitions are philosophical, the Wright account is required to make sense of the empirical data regarding population genetics.

  ### 4. Which Account is More Defensible?
  In the general philosophy of biology, there is a consensus that **both accounts are legitimate but serve different explanatory goals.** However, in the specific context of the "Junk DNA" debate, **Larry Wright's etiological account is the more defensible and scientifically robust standard.**

  Here is why Wright wins this specific round:

  1.  **Explaining Existence:** Biology is uniquely concerned with why traits *persist*. Biochemical activity (Cummins) is easy to come by; random chemistry happens all the time. Evolutionary selection (Wright) is hard to come by. To explain why the genome is structured the way it is, you need the account that explains persistence, not just activity.
  2.  **Distinguishing Signal from Noise:** The Cummins account struggles to distinguish between a mechanism and a byproduct (spandrel). The Wright account handles this naturally: a byproduct does things, but it isn't *there* to do them. In genomics, distinguishing regulatory elements from transcriptional noise is the central challenge. Wright's definition provides the tool to make that cut.
  3.  **The "Cost" Argument:** As mentioned above, the etiological view aligns with the mathematical constraints of population genetics. If we accept the ENCODE/Cummins definition as the biological standard for "importance," our models of human reproduction and mutation break.

  ### Conclusion
  You should tell your friend that she was right about the **biochemistry** (much of the genome is indeed transcribed or bound), but you were right about the **biology** (most of that activity is likely noise without evolutionary consequence).

  The ENCODE consortium adopted a Cummins-style "causal role" definition to maximize the apparent utility of their data. The evolutionary biologists adopted a Wright-style "selected effect" definition to protect the coherence of evolutionary theory.

  In the philosophy of biology, **Wright's etiological account is generally preferred** when discussing adaptation, trait persistence, and genomic architecture. Cummins's account is better suited for describing immediate physiological mechanisms (e.g., "the function of the heart is to pump blood"). Since the "Junk DNA" debate is about why the genome is the size it is and how it evolved, the etiological account is the correct lens. You win the argument, provided you concede that your friend was correct about the biochemical data, just not its interpretation.
