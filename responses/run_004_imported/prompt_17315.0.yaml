  8.  **Final Polish:** Check for clarity on Hyperbolic vs. Exponential discounting curves. Ensure the distinction between "System 1" (impulsive) and "System 2" (deliberative) is clear but not overused jargon. (Decided to stick with Hyperbolic Discounting as the primary framework as it fits the time-dynamic perfectly).

