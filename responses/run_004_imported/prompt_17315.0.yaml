answer: |-
  You have stumbled upon one of the most robust findings in behavioral economics and psychology. Your brother is offering a moral explanation ("lack of discipline"), but you are correct to suspect that is incomplete. If it were simply a character flaw, your preference would be consistent across both scenarios. The fact that your preference flips based solely on *proximity to the present* indicates a structural feature of human cognition, not a personal failing.

  Here is the explanation for the flip, the answer to which self you should trust, and a principled strategy for handling it.

  ### 1. What is producing the flip?
  The phenomenon you are experiencing is called **Hyperbolic Discounting** (or Present Bias).

  In standard economic theory (Exponential Discounting), humans are assumed to devalue future rewards at a constant rate. If you value \$100 today more than \$110 in a month, you should also value \$100 in 12 months more than \$110 in 13 months. The *interval* is what matters.

  However, human brains do not work that way. We have a "present bias." We disproportionately discount the value of anything that is not *immediate*.
  *   **In your hypothetical scenario:** Both the party and the studying are in the future. Your brain evaluates them using your long-term value system (Prefrontal Cortex). The trade-off is abstract, so you choose the option that aligns with your long-term goals (studying).
  *   **In your real scenario:** The party is *now* (or tonight). The immediate gratification triggers the limbic system (the emotional/impulsive brain). The "cost" of the party (the lower grade) is still three weeks away, so it remains abstract. The reward is hot and immediate; the cost is cold and distant.

  This creates a **time inconsistency**. Your "Future Self" wants to study, but your "Present Self" wants to party. When the Future Self becomes the Present Self, the preference flips. This is not a lack of discipline; it is a mismatch between the part of your brain that plans and the part of your brain that acts.

  ### 2. Which judgment deserves more trust?
  This is a philosophical question known as **intrapersonal welfare**. Which version of you is the "real" you?

  Most ethicists and behavioral economists argue you should trust the **distant/hypothetical judgment**. Here is why:

  1.  **Information Symmetry:** In the hypothetical scenario, you are not under the influence of immediate physiological temptation (dopamine spikes from the anticipation of the party). Your distant self is evaluating the trade-off "coolly." Your present self is evaluating it "hotly." The cool judgment is more likely to reflect your actual values rather than a transient chemical state.
  2.  **Time Consistency:** Your distant self's preference is stable. If you asked them again a week later (provided the event was still in the future), they would give the same answer. Your present self's preference is unstable; if you asked your present self tomorrow about a party *next week*, you would likely switch back to "study." A preference that flips based on calendar proximity is usually considered a cognitive error, not a true value shift.
  3.  **Regret Minimization:** People rarely regret studying instead of partying three weeks before a major exam. People frequently regret partying instead of studying three weeks before a major exam. Your distant self anticipates this regret; your present self discounts it.

  **Verdict:** Trust the judgment of the self that is *not* standing in the shadow of immediate temptation. That self represents your long-term interests.

  ### 3. A Principled Strategy (Beyond "Try Harder")
  Since you correctly identified that "resolving to try harder" fails, you need to stop relying on willpower. Willpower is a resource that depletes, especially when facing immediate temptation. Instead, you need **Commitment Devices**.

  This is the strategy of Ulysses and the Sirens. Ulysses knew his future self would be hijacked by the Sirens' song, so he tied himself to the mast *before* he heard it. He didn't trust his future discipline; he altered his future choices.

  Here is how to apply this to your Tuesday night:

  **A. Increase the Immediate Cost of the Party**
  Your brain is discounting the future cost (the grade). You need to add an *immediate* cost to going to the party.
  *   **Social Contract:** Tell a parent or a serious friend: "If I go to this party, I will owe you \$50" or "I have to give you my phone for the weekend." Make the pain of going to the party happen *now* or *tomorrow morning*, not in three weeks.
  *   **Logistical Friction:** Give your car keys to someone else. Commit to a study group that starts *before* the party. Make going to the party require active effort to undo a plan, rather than passive effort to skip a plan.

  **B. Bring the Future Cost into the Present**
  Make the AP Chem final feel real *tonight*.
  *   **Visualization:** Do not just think "grade matters." Spend 5 minutes vividly imagining opening the score report and seeing a 2 instead of a 5. Imagine the feeling in your stomach. Imagine having to explain it to your parents. Make the pain visceral.
  *   **The "One Problem" Rule:** Tell yourself you don't have to study all night. You just have to do *one* practice problem. Often, the friction is starting. Once you start, the anxiety of "missing out" on the party often diminishes because you are engaged.

  **C. Reframe the Party**
  Your present self sees the party as a gain and studying as a loss.
  *   Reframe the party as a **threat** to the goal you care about.
  *   Reframe studying not as "work" but as "buying freedom." Every hour you study now is an hour you *don't* have to panic-study the night before the exam.

  ### Summary
  Your brother is wrong about the cause (it's cognitive architecture, not character), but he may be right about the necessary action. You are experiencing **Hyperbolic Discounting**.

  Your hypothetical self is the rational planner; your present self is the impulsive actor. **Trust the planner.** Do not try to win a fight against your own biology using willpower alone. Instead, change the environment so that going to the party becomes more difficult or costly than staying home to study. Tie yourself to the mast tonight so your future self doesn't have to.
