  *Characters:* Elias (Reductionist), Mara (Non-Reductionist).
  *Action:* Elias is checking his watch. Mara is staring at him.

  *Focus:* The "Branching" thought experiment.
  *Elias:* "If the scanner creates a copy on Mars before disintegrating me here..."
  *Mara:* "Then there are two of you. Then one dies."
  *Elias:* "But the one on Mars has my memories."
  *Mara:* "He has memories *of being* you. He is not you."

  *Refining the "Degrees" argument:*
  Elias needs to push the idea that survival isn't 0 or 1. It's a spectrum.
  Mara needs to push that consciousness is binary. On or Off.

  *Ending:* Elias boards. Not because he won the argument, but because he accepts the risk of the "copy."

  Let's get the dialogue flowing naturally. Use pauses, physical actions.

