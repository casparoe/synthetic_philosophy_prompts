answer: |-
  The lounge of the Orbital Transfer Station hummed with the low-frequency vibration of the mag-lev trains beneath the floor. It was a sterile place, all polished chrome and soft, shadowless lighting.

  Elias sat with his hands clasped between his knees. In the breast pocket of his coat, the stiff corner of a boarding pass dug against his ribs. One way. Earth to Ares City.

  Mara sat opposite him, nursing a coffee that had gone cold ten minutes ago. She wasn't looking at the coffee. She was looking at him.

  "You're doing it again," Elias said.

  "Doing what?"

  "Looking at me like I'm already a ghost."

  Mara set the cup down. The ceramic clicked sharply against the table. "I'm looking at you like you're a man about to step into a blender."

  "It's not a blender, Mara. It's a transporter. We've been over this. It's safe. It's routine."

  "It's disintegration," she said. Her voice was quiet, but it cut through the lounge noise. "They scan you. They break you down into energy data. They send the data. They build a new guy out of stock matter on Mars. And the guy here? The guy holding my hand right now? He ceases to exist."

  Elias sighed, leaning back. "This is the Parfit objection. I know it. But you're clinging to a 'further fact' that doesn't exist. There is no magic spark, Mara. There's just the pattern. The physical structure and the psychological continuity. If that pattern is instantiated on Mars, *I* am on Mars."

  "If the pattern is instantiated," Mara corrected. "Copy. Instantiation. You're talking about data. I'm talking about *me*. The subject of experience."

  She leaned forward, elbows on the table. "Let's run the branching case. The one they don't put in the brochures. Say the scanner on Earth malfunctions. It sends the signal to Mars, builds the guy... but it doesn't destroy the original. Not right away. So for ten minutes, there's an Elias here, and an Elias on Mars."

  Elias nodded. "Okay. Hypothetically."

  "Which one is you?"

  "Both," Elias said. "Or neither, depending on how you define the word. But both have equal claim to my past. Both feel like they're me."

  "Wrong," Mara said. "You are sitting here. You are breathing this recycled air. You are feeling the anxiety in your gut. The guy on Mars is feeling the gravity of a different planet. If I stay here with *you*, and the guy on Mars goes off to live your life... when they finally fix the machine and disintegrate you here... do you survive?"

  "The *pattern* survives."

  "*You* die," Mara insisted. "And here is the thing that keeps me up at night: The guy on Mars won't know it. He'll wake up, stretch, check his messages, and think, 'Wow, that transport was seamless.' He'll be happy. He'll love me. He'll remember proposing to me in this very lounge. But *you*—the one sitting in front of me—will be dead. And your death will be invisible. Even to him."

  Elias rubbed his thumb over the fabric of his coat, feeling the edge of the ticket. "You're assuming that what matters is this specific locus of consciousness. The 'I' that is happening right now. But why does that matter more than the continuation of the project of being Elias?"

  "Because it's the only thing I have!" Mara's voice rose, drawing a glance from a traveler at the next table. She lowered it. "It's the only thing anyone has. This perspective. If I lose it, I'm gone. It doesn't matter if a duplicate keeps walking around. That's not survival, Elias. That's replacement."

  "Replacement implies the function is the same but the essence is different," Elias said. "But there is no essence beyond the function. Look, imagine I go under general anesthesia. No dreams. No time passes for me. I close my eyes, I open them six hours later. To me, it's instantaneous. But my body has changed. Cells died. Chemicals flushed. I am not physically identical to the man who went under. But I accept the continuity."

  "Anesthesia is a pause," Mara said. "It's a bridge. The brain stays intact. The causal chain isn't broken. Teleportation breaks the chain. It destroys the bridge and builds a new one on the other side that *looks* like the old one."

  "Is the difference in the atoms, or the arrangement?"

  "The arrangement is information," Mara said. "The atoms are the vessel. You can't upload a soul by scanning the ink on a page and printing a new copy. The original book is still the one that was written."

  "That's a metaphor, not an argument." Elias tapped his chest. "I am not a book. I am a process. A flow of information and causality. If the flow continues, I continue. And honestly, Mara, I think your obsession with 'being the same person' is selfish."

  Mara blinked. "Excuse me?"

  "Think about it," Elias said, his tone sharpening. "If the Elias on Mars lives a full life, loves you, does my work, remembers our jokes... and the Elias here dies quietly... what have you actually lost? You lose the specific biological organism sitting here. But you don't lose the person. You're grieving a label. You care more about the metaphysical tag of 'Identity' than the actual reality of my survival."

  "I care about *you*," she said, her eyes wet. "Not the label. If you step into that machine, the person who loves me dies. The one who comes out the other side... he's a stranger who thinks he's my husband."

  "That's absurd. He'll have my memories. He'll have my temper. He'll have the scar on his chin from when I fell off my bike when I was seven."

  "He'll have memories *of* falling off the bike," Mara said. "He won't have the memory of *feeling* the gravel. He has a recording. You are the recorder. If you smash the recorder, the music stops. Even if someone else plays the MP3 file later."

  Elias looked away, toward the window. The curve of the Earth glowed below, blue and white and indifferent.

  "Parfit argued that identity isn't what matters," Elias said softly. "Survival matters. Relation R. Psychological connectedness. If I can have that on Mars, then I survive. Maybe not in the strict, numerical sense of being the exact same atom-cluster. But in the only sense that has any value."

  "So you're willing to accept degrees of death?" Mara asked. "Is that it? You're only mostly dead?"

  "I'm saying identity isn't all-or-nothing," Elias said. "In the branching case, if there are two of me, I don't cease to exist. My survival is divided. It's less than 100%, sure. But it's not zero. Why is zero the only acceptable number for you?"

  "Because consciousness isn't a liquid you can pour into two cups," Mara said. "It's a light. It's on, or it's off. When they turn you off here, you don't get to see the light turn on there. That's the gap, Elias. That's the abyss. You're betting that you won't notice the dark. But you will. It will be the last thing you ever notice."

  Elias was silent for a long moment. The hum of the station seemed to grow louder. He reached into his pocket and pulled out the boarding pass. The plastic was warm from his body heat.

  "I know," he said.

  Mara froze. "You know what?"

  "I know that the me sitting here won't wake up on Mars," Elias said. He looked at her, and for the first time, the reductionist certainty was gone from his eyes, replaced by a quiet, human fear. "I know that from my perspective, right now, stepping into that scanner is the end. The lights go out."

  "Then don't do it," Mara whispered. "Cancel the ticket. We'll find another way. Cryo. A ship. Something slow."

  "A ship takes six months. The job is there. The life is there." Elias turned the ticket over in his fingers. "But you're right about one thing. Identity... maybe it is empty. Maybe there is no further fact. But the fear... the fear of the dark is real. Even if it's irrational."

  "So why are you still going?"

  Elias stood up. He smoothed the front of his coat. He didn't put the ticket away.

  "Because the Elias on Mars... he gets to be with you," he said. "And I love you enough to let him take my place."

  "That's not you," Mara said, standing up to meet him. "That's a sacrifice. You're killing yourself for a copy's benefit."

  "Maybe," Elias said. He reached out and touched her cheek. His hand was warm. Real. "Or maybe I'm realizing that loving you is more important than being the one who gets to claim he did it."

  He leaned in and kissed her. It felt exactly like a kiss. It felt like the only fact in the universe that mattered.

  When he pulled away, he didn't smile. "If I'm wrong, and I just die... thank you. For arguing. It made me feel real."

  "Elias—"

  He turned and walked toward the gate. He didn't look back. He couldn't. Because if he did, he knew the Elias standing here might decide that the reductionist argument wasn't worth the price of the dark.

  Mara watched him go. She sat back down in the sterile lounge, alone. She picked up her cold coffee, but her hand was shaking too much to lift it. She stared at the empty chair opposite her, wondering if the man who would arrive on Mars would remember this conversation, and if he would feel the same grief, or if he would just have the memory of it, hollow and dry, like a story read in a book.
