      *   **Key Question:** Does Leibniz see the combination problem as a real problem, or does his system dissolve it? If the latter, what is the cost of that dissolution (i.e., what commitment would a modern panpsychist reject)?
      *   **Required Grounding:** Composite bodies, dominant monads, true unity vs. mere aggregate.

  2.  **Initial Knowledge Retrieval & Structuring:**
