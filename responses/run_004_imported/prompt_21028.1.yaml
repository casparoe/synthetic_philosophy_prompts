      *   *Panpsychism:* Mind is fundamental and ubiquitous. Modern panpsychism struggles with how micro-experiences combine into macro-experiences (the combination problem).
      *   *Leibniz vs. Modern Panpsychism:* Leibniz is often called a panpsychist (or panexperientialist), but his view is distinct.
      *   *The Combination Problem for Leibniz:* Does he think my mind is *made of* the minds of my cells? No.
      *   *Key Distinction:* *Unum per se* (true unity) vs. *Unum per aggregationem* (unity by aggregation).
      *   *Dominant Monad:* The soul/mind is the dominant monad of the body. The body is an aggregate of other monads.
      *   *The "Cost":* Leibniz denies that the macro-mind is *constituted* by micro-minds in a mereological sum. The macro-mind is a *simple substance* that *expresses* the aggregate.

  3.  **Drafting the Core Argument:**

      *   *Point 1: The Category Mistake.* Leibniz would say modern panpsychists are asking the wrong question. They assume a composite mind is built from smaller minds like bricks build a wall. For Leibniz, a true mind (a rational soul) is a *simple substance* (a Monad). It has no parts. Therefore, it cannot be "combined" from parts.
      *   *Point 2: Aggregates vs. Substances.* The body is an aggregate of monads. The mind is the dominant monad. The relationship isn't part-to-whole (constitutive); it's dominant-to-subordinate (metaphysical hierarchy/expression).
      *   *Point 3: The Dissolution.* The combination problem dissolves because there is no combination of *experiences* into a *higher experience*. There is only one experience (the dominant monad's) that *perceives/expresses* the others confusedly.
      *   *Point 4: The Cost.* What does Leibniz give up? He gives up the idea that the brain's physical/mental activity *generates* consciousness. He also commits to the idea that the "lower" monads (cells, atoms) are distinct substances with their own perspectives, but they don't *add up* to me. They are *my* body, but they are not *me*. Modern panpsychists (like Goff or Chalmers) often want a more naturalistic continuity where macro-consciousness emerges from or is constituted by micro-consciousness. Leibniz blocks this with the simplicity requirement.
      *   *Point 5: Pre-established Harmony.* This is crucial. The coordination isn't causal. It's synchronized by God. Modern panpsychists usually want causal closure or at least causal efficacy. Leibniz sacrifices causal interaction for metaphysical consistency.

  4.  **Refining the "Cost" (The Crucial Insight):**
      *   Modern panpsychists want to naturalize consciousness. They want to say "this experience is the sum of those experiences."
      *   Leibniz says "No, this experience *mirrors* those experiences, but remains ontologically distinct and simple."
      *   The cost is **Mereological Nihilism regarding Minds**. You cannot build a mind out of other minds. You can only have a mind that *represents* other minds.
      *   Another cost: **The Hierarchy of Being.** Leibniz is committed to a strict hierarchy (bare monads -> souls -> spirits). Modern panpsychism is often flatter.
      *   Another cost: **Idealism.** For Leibniz, the "body" is ultimately a phenomenon bene fundatum (well-founded phenomenon) of the monads. Modern panpsychists often want to be realists about the physical brain *having* experience. Leibniz says the brain is an aggregate of living beings, not a single being itself.

