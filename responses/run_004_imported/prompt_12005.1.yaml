  But then I got thinking about it more and it seems like that has to mean constructivists believe Goldbach's conjecture is currently, literally, neither true nor false out there in reality — basically a math version of Schrodinger's cat, where the truth value just doesn't exist yet and only "collapses" once somebody finds a proof. I asked my coach if that's the right way to think about it and he just said "eh, not quite" before getting pulled away to help someone else, so now I'm stuck. Is that basically what's going on, or am I misunderstanding what it actually means to "reject the law of excluded middle"? And if I've got it wrong, what SHOULD refusing to assert "P or not-P" for some statement cash out to, if not "this statement has no truth value yet"? Sorry if this is a dumb question — I looked it up but every explanation I find just restates "they reject bivalence" wich doesn't actually tell me what that means.
