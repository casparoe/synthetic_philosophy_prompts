prompt: |-
  I help run a small podcast that grew out of a long-running rationalist-blogosphere reading group. Next week's guest defends a Street-style evolutionary debunking argument against moral realism: because natural selection shaped our evaluative attitudes for their effects on survival and reproduction rather than their truth, realists owe an explanation of why those attitudes should ever track mind-independent evaluative facts. Draft eight to ten interview questions that go beyond having her restate the argument: at least one on the 'third-factor' reply, where some further fact -- say, that survival and reproduction really are good -- is meant to explain both the selection pressure and the belief's truth, so no direct tracking is needed; one on the 'companions in guilt' move likening evaluative beliefs to mathematical and logical beliefs, which are also shaped by natural selection yet aren't normally treated as debunked; and one on the charge that her argument is self-undermining, since the reasoning she used to construct it is itself an evolutionary product no less than the moral intuitions she's debunking. For each, include a follow-up keyed to the answer she's most likely to give.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** A small podcast originating from a rationalist-blogosphere reading group (implies an audience familiar with philosophy, specifically metaethics, evolutionary psychology, and rigorous argumentation).
      *   **Guest:** Defends a Street-style evolutionary debunking argument (EDA) against moral realism.
      *   **Core Argument:** Natural selection shaped evaluative attitudes for fitness, not truth; realists need to explain the correlation between fitness and mind-independent moral facts.
      *   **Task:** Draft 8-10 interview questions.
      *   **Constraints:**
          *   Go beyond restating the argument.
          *   Must include a question on the "Third-Factor" reply.
          *   Must include a question on "Companions in Guilt" (math/logic).
          *   Must include a question on "Self-Undermining" (evolution of reasoning itself).
          *   Each question needs a specific follow-up keyed to the *most likely* answer.

  2.  **Deconstruct the Topic (Street-Style EDAs):**
      *   *Sharon Street's "Darwinian Dilemma":* Realists must say evolution either distorted or tracked moral truth. If distorted, we have no reason to trust morals. If tracked, why would fitness track truth?
      *   *Realist Replies:*
          *   Third-Factor (Enoch, Wielenberg): Something else explains both fitness and truth (e.g., survival is good).
          *   Companions in Guilt (Clarke-Doane, etc.): Math/Logic are also evolved but we trust them. Why single out morals?
          *   Self-Defeat: If evolution debunks morals, it debunks the reasoning used to debunk them.
      *   *Nuance for Rationalist Audience:* They care about Bayesian updating, cognitive biases, the nature of "truth," and the practical implications of nihilism/error theory vs. realism.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The Core Mechanism (Beyond Restatement).* Focus on the *degree* of independence.
          *   *Draft:* How independent are moral facts from evolutionary pressures?
          *   *Refinement:* Make it about the "coincidence" objection.
          *   *Follow-up:* If she says it's a huge coincidence, ask about prior probabilities.

      *   *Question 2: Third-Factor (Required).*
          *   *Draft:* What about the third-factor argument where survival is good?
          *   *Refinement:* Focus on David Enoch's specific formulation. Does positing a normative link between survival and goodness beg the question?
          *   *Follow-up:* If she says it begs the question, ask if *any* foundational normative claim avoids that.

      *   *Question 3: Companions in Guilt (Required).*
          *   *Draft:* What about math? Evolution shaped that too.
          *   *Refinement:* Distinguish between "tracking" in math vs. morals. Is the causal chain different?
          *   *Follow-up:* If she says math is different because it's necessary truth, ask if moral truths could be necessary.

      *   *Question 4: Self-Undermining (Required).*
          *   *Draft:* Doesn't this destroy your own argument?
          *   *Refinement:* Frame it as the "global skepticism" worry. Is there a relevant difference between first-order moral cognition and higher-order philosophical reasoning?
          *   *Follow-up:* If she says reasoning is different, ask for the cognitive boundary line.

      *   *Question 5: The Nature of "Tracking".*
          *   *Draft:* What does it mean to track truth?
          *   *Refinement:* Is "tracking" causal? If moral facts are non-natural, how can *anything* track them?
          *   *Follow-up:* If she says non-natural facts can't be tracked, ask if that implies naturalism is the only viable realism.

      *   *Question 6: Specific Moral Domains.*
          *   *Draft:* Does this apply to all morals?
          *   *Refinement:* Distinguish between trolley problems vs. care/harm. Is the debunking selective?
          *   *Follow-up:* If selective, does that save a partial realism?

      *   *Question 7: Practical Implications/Rationalist Angle.*
          *   *Draft:* So what should we do?
          *   *Refinement:* If we accept the EDA, do we become error theorists or constructivists? How does this change decision-making?
          *   *Follow-up:* If constructivism, how do we resolve disagreements without objective truth?

      *   *Question 8: The "Pushback" on Fitness.*
          *   *Draft:* Is fitness the only pressure?
          *   *Refinement:* Cultural evolution. Does gene-culture co-evolution rescue realism?
          *   *Follow-up:* If no, does that mean cultural evolution is also truth-blind?

      *   *Question 9: Modal Security.*
          *   *Draft:* What if we could have evolved differently?
          *   *Refinement:* Focus on "Modal Security." If we evolved differently, would we believe different morals? If yes, does that debunk current beliefs?
          *   *Follow-up:* If she says yes, ask if this applies to logical beliefs too.

      *   *Question 10: The Burden of Proof.*
          *   *Draft:* Who has to prove what?
          *   *Refinement:* Is the EDA a positive argument for anti-realism or just a defeater for realism?
          *   *Follow-up:* If just a defeater, what positive account of normativity does she offer?

  4.  **Review and Refine:**
      *   Check constraints: 8-10 questions? Yes. Third-factor included? Yes (Q2). Companions in guilt? Yes (Q3). Self-undermining? Yes (Q4). Rationalist tone? Yes (focus on priors, mechanisms, coherence). Follow-ups keyed to likely answers? Need to ensure the "Likely Answer" is plausible for a Street-defender.
      *   *Self-Correction on Follow-ups:* Make sure the follow-up isn't just "Why?" but challenges the specific defense she's likely to mount.
      *   *Tone Check:* Ensure it sounds like a podcast interview (conversational but rigorous).

  5.  **Final Polish:** (Writing out the questions with the specific follow-up logic). *Self-correction: Ensure the distinction between Street's constructivism and Error Theory is clear, as Street is usually a constructivist, not an error theorist.*

      *   *Adjustment:* Street defends normative constructivism. So the EDA is used to clear the ground for constructivism, not necessarily nihilism. I should frame questions to acknowledge she likely has a positive view (constructivism) she's making space for.

      *   *Re-evaluating Q2 (Third-Factor):* Street usually argues third-factor accounts fail because they assume the very normative truths in question.
      *   *Re-evaluating Q3 (Companions):* Street argues math is different because mathematical truths *cause* the beliefs (in a sense) or are constitutive, whereas moral facts are distinct. Or she argues math is also debunked (radical view). I should assume she takes the "disanalogy" route as it's more common.
      *   *Re-evaluating Q4 (Self-Undermining):* She will likely distinguish between *substantive* normative judgments and *instrumental* reasoning.

      *   *Let's finalize the list.* (Proceeding to generate output based on these thoughts).

  6.  **Final Count Check:** 1. Coincidence/Priors, 2. Third-Factor, 3. Companions in Guilt, 4. Self-Undermining, 5. Non-Natural Tracking, 6. Selective Debunking, 7. Constructivist Alternative, 8. Cultural Evolution, 9. Modal Security, 10. Burden of Proof. (10 Questions).

      *Wait, I need to make sure the follow-ups are specific.*
      *   *Q1 Follow-up:* If she says the coincidence is too improbable -> Ask about priors on realism.
      *   *Q2 Follow-up:* If she says it's question-begging -> Ask if constructivism begs the question too.
      *   *Q3 Follow-up:* If she says math is different -> Ask about the causal mechanism difference.
      *   *Q4 Follow-up:* If she distinguishes reasoning types -> Ask for the criterion.
      *   ...and so on.

      *Let's write it.*
answer: |-
  Here are ten interview questions designed for a rationalist-literate audience, focusing on the structural and meta-philosophical implications of the evolutionary debunking argument (EDA), including the three specific required topics.

  ### 1. The Coincidence and Prior Probabilities
  **Question:** "Street's Darwinian Dilemma hinges on the claim that the correlation between evolutionary fitness and mind-independent moral truth would be a massive coincidence. In Bayesian terms, you're arguing that the likelihood of our moral beliefs given realism is low. But doesn't this depend heavily on our prior probability assigned to realism itself? If a listener starts with a very high prior that moral facts exist, does the evolutionary explanation actually lower their posterior confidence enough to warrant abandoning realism, or does it just force them to accept a 'happy coincidence'?"

  *   **Likely Answer:** She will likely argue that the coincidence is *too* improbable to sustain the prior, regardless of where one starts, because there is no causal mechanism to explain the correlation.
  *   **Follow-up:** "If the lack of a causal mechanism is the dealbreaker, does that imply you endorse a causal theory of knowledge for all domains? If so, how do we account for knowledge of the future or counterfactuals, which also lack causal contact?"

  ### 2. The Third-Factor Reply (Required)
  **Question:** "Realists like David Enoch have offered a 'third-factor' reply. They argue that there is a normative fact independent of our beliefs—such as 'survival is good'—that explains both why evolution selected for certain behaviors and why those behaviors align with moral truth. This supposedly bridges the gap without requiring evolution to 'track' truth directly. Why do you find this move insufficient? Is it that it assumes the very normative truth it's trying to justify?"

  *   **Likely Answer:** She will likely argue that this is question-begging; it assumes a substantive normative claim (survival is good) to prove that our normative claims are reliable, which a realist cannot do without circularity.
  *   **Follow-up:** "If assuming a foundational normative truth is circular for the realist, isn't it equally circular for you to assume the authority of instrumental rationality or coherence in your own constructivist alternative? Where is the non-question-begging ground for *any* normative view?"

  ### 3. Companions in Guilt (Required)
  **Question:** "A common counter-argument is the 'companions in guilt' objection. Our cognitive faculties for logic and mathematics were also shaped by natural selection for fitness, not necessarily for truth, yet we don't typically debunk mathematical realism on these grounds. What is the relevant disanalogy? Is it that mathematical truths are necessary while moral truths are contingent, or is there a structural difference in how we form beliefs in these two domains?"

  *   **Likely Answer:** She will likely argue that mathematical concepts are constitutive of the reasoning process itself, whereas moral beliefs are substantive claims about the world that can be separated from the reasoning engine.
  *   **Follow-up:** "If mathematical concepts are constitutive of reasoning, couldn't one argue that basic moral intuitions (like 'pain is bad') are constitutive of *practical* reasoning? If you grant that, does the debunking argument lose its grip on core moral axioms?"

  ### 4. The Self-Undermining Charge (Required)
  **Question:** "Critics often charge that the EDA is self-undermining. If evolutionary pressures explain away our moral intuitions because they weren't selected for truth, doesn't that same pressure explain away the philosophical reasoning you used to construct the argument? Your capacity for modal logic and hypothesis testing is just as evolved as your capacity for outrage. How do you exempt the tools of debunking from the debunking itself?"

  *   **Likely Answer:** She will likely distinguish between *first-order* substantive judgments (which are debunked) and *higher-order* cognitive faculties regarding consistency and evidence (which are presupposed by the argument).
  *   **Follow-up:** "That distinction relies on the idea that logical consistency tracks truth better than moral intuition does. But if evolution selected for consistency because it aids social coordination or prediction, rather than for truth, haven't you just pushed the skeptical problem back one step rather than solving it?"

  ### 5. Non-Naturalism and Causal Inertness
  **Question:** "Many moral realists defend non-naturalism, positing moral facts that exist outside the spatio-temporal causal order. Your argument seems to rely heavily on the idea that if these facts are causally inert, they can't influence our beliefs. But if you grant that causal contact isn't necessary for knowledge—as many platonists argue—does the evolutionary argument still hold, or does it only work against naturalistic moral realists?"

  *   **Likely Answer:** She will likely maintain that even if causal contact isn't required, we still need an *explanation* for the correlation, and non-naturalism offers no explanatory resources for why fitness aligns with inert facts.
  *   **Follow-up:** "So the objection isn't strictly causal but explanatory. If a non-naturalist posits a 'pre-established harmony' between fitness and truth as a brute fact, is your objection simply that this is an inelegant hypothesis, or that it is rationally impermissible?"

  ### 6. Selective Debunking and Reflective Equilibrium
  **Question:** "Does your argument imply a global error theory for all moral beliefs, or is it selective? For instance, evolutionary pressures might explain 'tribal loyalty,' but perhaps not 'impartial benevolence.' If we use the method of reflective equilibrium to prune away the evolutionarily suspect intuitions and keep the ones that survive scrutiny, can a modified realism survive the purge?"

  *   **Likely Answer:** She will likely argue that the evolutionary influence is too pervasive to allow for a clean separation; the very standards we use in reflective equilibrium are themselves evolutionarily shaped.
  *   **Follow-up:** "If our standards of scrutiny are also shaped by evolution, does that lead you to normative constructivism? Are we essentially constructing truth through the process of scrutiny rather than discovering it?"

  ### 7. Gene-Culture Co-evolution
  **Question:** "Your argument focuses heavily on genetic natural selection. However, rationalists often emphasize cultural evolution. If moral beliefs are transmitted culturally, and cultural groups with 'truer' moral beliefs outcompete others, couldn't cultural selection act as a truth-tracking mechanism in a way genetic selection cannot? Does incorporating cultural evolution rescue realism?"

  *   **Likely Answer:** She will likely argue that cultural selection also selects for group cohesion and fitness, not truth, and that 'truth' in morals doesn't confer a competitive advantage in the same way technological truths do.
  *   **Follow-up:** "But if 'truth' doesn't confer an advantage, why do we observe moral progress, such as the expansion of the moral circle? Is that just a side effect of other fitness-enhancing traits, or is there room for truth to play a causal role in cultural retention?"

  ### 8. Modal Security
  **Question:** "Joshua Schechter and others have argued for 'Modal Security,' suggesting that if we have reason to believe our beliefs are safe (i.e., we wouldn't hold them if they were false), evolution doesn't debunk them. If a realist argues that moral truths are necessary, and thus true in all nearby possible worlds regardless of evolution, does your argument lose its force? Do you deny that moral truths could be necessary?"

  *   **Likely Answer:** She will likely argue that even if moral truths are necessary, our *access* to them is the problem; if evolution determined our access, we still can't trust that access, regardless of the modal status of the facts.
  *   **Follow-up:** "So the issue is entirely epistemic, not metaphysical. If the issue is epistemic access, does that mean a moral realist who claims direct intuition or rational insight is claiming a kind of 'moral perception' that you find scientifically implausible?"

  ### 9. The Positive Alternative (Constructivism)
  **Question:** "If we accept the debunking argument and abandon realism, we still need to navigate the world. You defend normative constructivism. Does this view allow for moral disagreement to be resolved objectively, or does it imply that when two agents reach different conclusions after ideal reflection, there is no further fact of the matter about who is right? How do we avoid sliding into relativism?"

  *   **Likely Answer:** She will likely argue that constructivism allows for objective correctness relative to the standpoint of the agent and the requirements of practical rationality, avoiding relativism without requiring mind-independent facts.
  *   **Follow-up:** "If correctness is relative to the standpoint of the agent, how do we adjudicate conflicts between agents with fundamentally different starting standpoints? Is force or persuasion the only remaining tool?"

  ### 10. The Burden of Proof
  **Question:** "Finally, is your evolutionary debunking argument intended as a positive argument for anti-realism, or merely as a defeater for realism? In other words, if the realist fails to explain the correlation, do they lose by default, or must you positively demonstrate that no such explanation is possible? Where exactly does the burden of proof lie in this dialectic?"

  *   **Likely Answer:** She will likely frame it as a defeater; the realist claims a correlation exists and owes an explanation for it. If they cannot provide one, the claim is unsupported.
  *   **Follow-up:** "If it's just a defeater, does that leave the door open for a 'leap of faith' realism? If I acknowledge I have no explanation for the correlation but simply feel compelled to believe in moral facts, is that rationally permissible, or is it an epistemic vice?"
