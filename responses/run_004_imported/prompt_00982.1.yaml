answer: |-
  This is a fascinating snag, and I have to be the bearer of some slightly disruptive news: **You are not missing the passage. It doesn't exist.**

  Your MFA mentor wasn't necessarily lying to you, but they were likely operating under a very common piece of literary folklore. The reality of Tolstoy's late-period essay *What Is Art?* (1897) is actually quite the opposite of what you're looking for. In that text, Tolstoy does not hold up *War and Peace* as the model of "infectious" art. In fact, he largely repudiates it.

  Here is the breakdown of what is actually happening in that essay, where the "user manual" for *War and Peace* really lives, and how you can still use Tolstoy's theory of infectiousness for your own novel.

  ### 1. The Hard Truth: Tolstoy vs. Tolstoy
  By the time Tolstoy wrote *What Is Art?*, he was in the throes of his spiritual conversion. He had rejected his earlier life as an aristocrat and, by extension, rejected his earlier masterpieces.

  In *What Is Art?*, Tolstoy argues that "good" art must transmit feelings that unite humanity in a shared religious/moral consciousness accessible to the simplest peasant. Under this criteria:
  *   **He dismisses Shakespeare** (as you noted) as elitist and immoral.
  *   **He dismisses Beethoven** as obscure and confusing.
  *   **He dismisses his own novels**, including *War and Peace* and *Anna Karenina*.

  He classifies *War and Peace* as "exclusive art"—art that appeals only to the wealthy upper classes of a specific time and place. He admits it transmitted *some* feeling, but he argues it was the wrong *kind* of feeling (patriotism, aristocratic honor, romantic love) rather than universal Christian brotherhood.

  So, if you are hunting for a chapter where he says, *"Here is why Natasha Rostov's dance scene works so well,"* you will never find it in *What Is Art?* He is too busy apologizing for having written it.

  ### 2. Where the "Infectiousness" Theory Actually Lives
  Your mentor was right about the **theory**, just wrong about the **example**.

  Tolstoy *does* define art as "infectiousness" in this essay. He argues that art succeeds based on three conditions:
  1.  **Individuality:** The feeling transmitted must be unique to the artist.
  2.  **Clearness:** The expression must be intelligible.
  3.  **Sincerity:** This is the most important one. The artist must feel the emotion they are transmitting with an inner compulsion.

  **The Worked Examples He *Does* Use:**
  Instead of *War and Peace*, Tolstoy cites:
  *   The story of Joseph in Genesis.
  *   Dickens' *A Christmas Carol*.
  *   Victor Hugo's *Les Misérables* (specifically the story of Jean Valjean).
  *   Various folk songs and peasant parables.

  He praises these because he believes a peasant could read/hear them and feel the same moral emotion as a king.

  ### 3. The Actual "User Manual" for *War and Peace*
  If you want to know how Tolstoy justified the structure and philosophy of *War and Peace* while he was writing it (or immediately after), you need to look at **the Second Epilogue of *War and Peace* itself.**

  This is the section where he drops the narrative to discuss the philosophy of history, free will, and causality. While it isn't about "emotion" per se, it is his defense of the novel's sprawling nature.
  *   **The Argument:** He argues that to understand history, you cannot just look at "Great Men" (Napoleon, Tsar Alexander). You must look at the "infinitesimal" units of daily life and the collective will of the masses.
  *   **The Technique:** This justifies the oscillation in your novel between the "big battles" and the "domestic scenes." For Tolstoy, the domestic scenes weren't relief from the war; they were the *source code* of the war. The battle of Borodino is decided by the morale of the soldier, which is decided by his home life, his food, his sleep, and his small, personal fears.

  ### 4. How to Apply This to Your Novel
  Even though the *What Is Art?* passage is a myth, the theory of **Infectiousness** is still incredibly potent for a war epic. If you want to reverse-engineer the *effect* of *War and Peace* using Tolstoy's actual criteria, here is how you should audit your draft:

  **A. Audit for Sincerity (The "Faking" Check)**
  Tolstoy believed that if the author is trying to manipulate the reader, the infection fails.
  *   *Ask yourself:* Are there scenes in your battle sequences where I am trying to force "tragedy" or "heroism"? Tolstoy's battle scenes work because they are often confused, mundane, and anti-climactic. Pierre Bezukhov walks around Borodino mostly confused. If you are writing "cinematic heroics," you are violating Sincerity.
  *   *Fix:* Lean into the confusion, the boredom, and the mundane physical sensations of your characters.

  **B. Audit for Clearness (The "Peasant" Test)**
  Tolstoy argued that complexity should not obscure the feeling.
  *   *Ask yourself:* With several families and generations, is the emotional through-line clear? In *War and Peace*, no matter how many characters there are, the emotional stakes are always grounded in simple human truths: fear of death, love of family, shame, pride.
  *   *Fix:* Ensure that your historical digressions never drown out the immediate human feeling. If a passage explains the geopolitical strategy of the war but the reader doesn't feel what the character *feels* about that strategy, cut the explanation.

  **C. Audit for Individuality (The Specific vs. The Universal)**
  Tolstoy believed you transmit the universal *through* the hyper-specific.
  *   *Ask yourself:* Are your domestic scenes generic? Tolstoy doesn't just write "they had dinner." He writes about the specific way a character holds a napkin, or the specific sound of a daughter's voice.
  *   *Fix:* Don't write "war is hell." Write about the specific way the mud smells on a specific Tuesday in 1917. The "infection" happens in the details, not the themes.

  ### Summary
  Your agent's comparison is a compliment (scope + intimacy), but your mentor's roadmap was a bit of a ghost story.

  *   **Don't** look for *War and Peace* in *What Is Art?* (Tolstoy hated it there).
  *   **Do** look at the **Second Epilogue** of *War and Peace* for structural justification.
  *   **Do** use the **Infectiousness Criteria** (Sincerity, Clearness, Individuality) to edit your scenes.

  If you want to match *War and Peace*, the secret isn't in the history lectures; it's in the moments where the history crashes into the individual soul. Tolstoy's "infection" works because he never lets the "War" become bigger than the "Peace" inside the character's head. If you keep that balance, you'll earn the comparison, regardless of what Tolstoy wrote in 1897.
