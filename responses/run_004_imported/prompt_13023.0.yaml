prompt: |-
  A close friend of mine, a researcher on wild-animal suffering and s-risk at a small EA-aligned institute, died suddenly of a stroke last month at forty-one. She held a strict, suffering-focused, negative-utilitarian view -- that averting severe suffering has moral priority over producing happiness -- and for years she patiently corrected journalists, myself included, whenever we slid that into "so life generally isn't worth living" or "so a painless end to any suffering being is automatically good." I'm giving her eulogy next week, to a room split between colleagues who will hear any sloppy paraphrase of her ethics as a small betrayal, and relatives who've never heard the phrase "suffering-focused" and just want to hear that her life was full and good. Please write it: it needs to stay true to the narrow, actual shape of her view and resist both of those misreadings -- especially the harder, personal version the second one now takes, that her own death is somehow a relief -- while still comforting people who won't parse a single technical distinction.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Subject:** A close friend, researcher on wild-animal suffering and s-risk (suffering risks), died suddenly of a stroke at 41.
      *   **Institute:** Small EA-aligned (Effective Altruism) institute.
      *   **Ethical View:** Strict, suffering-focused, negative-utilitarian (prioritizing averting severe suffering over producing happiness).
      *   **Key Constraint 1 (The Colleagues):** They know her work well. Sloppy paraphrasing (e.g., "life isn't worth living" or "painless death is good") will be seen as a betrayal of her intellectual rigor and specific views.
      *   **Key Constraint 2 (The Relatives):** They don't know the jargon. They need comfort. They need to hear her life was *full and good*.
      *   **Key Constraint 3 (The Tragedy):** The "painless end is good" misreading is now dangerously personal regarding *her* death. The eulogy must explicitly or implicitly reject the idea that her death is a "relief" or "net positive" in her own framework, without violating her actual ethics.
      *   **Goal:** Write a eulogy that bridges these gaps, honoring her specific philosophy while comforting the grieving, avoiding the twin pitfalls of dilution and misapplication.

  2.  **Deconstruct the Ethical View (Negative Utilitarianism/Suffering-Focus):**
      *   *What it is:* Reducing extreme suffering is the most urgent moral task.
      *   *What it is NOT:* Nihilism (life has no value). Misery (life is always bad). Death-wish (death is better than life).
      *   *Nuance:* She corrected people who said "life isn't worth living." She believed in *preventing* the worst, not necessarily negating the good. She likely valued the reduction of suffering *because* she cared deeply about beings.
      *   *Application to her death:* Her death was a stroke (sudden, likely painful or confusing, definitely a loss). It is not a "painless end to suffering." It is a loss of a capacity to reduce suffering. Therefore, her death is a net negative in her own framework (one less advocate, one less reducer of suffering).

  3.  **Determine the Tone:**
      *   Respectful, precise, warm, intellectual but accessible.
      *   Avoids jargon where possible, but explains it when necessary.
      *   Acknowledges the grief without trying to "solve" it with philosophy.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss. Validate the grief of both groups (family and colleagues).
      *   **Addressing the Work (The Colleagues):** Speak to her rigor. Acknowledge her specific ethical stance without using it as a bludgeon. Emphasize *compassion* as the root.
      *   **Addressing the Misreadings (The Crux):** This is the hardest part. I need to clarify what she *didn't* believe without sounding like I'm lecturing.
          *   *Misreading 1:* "Life isn't worth living." -> *Correction:* She fought for life to be *bearable* and *safe*.
          *   *Misreading 2:* "Death is a relief." -> *Correction:* Her death is a loss of agency and care. It is not a solution.
      *   **Addressing the Family (The Heart):** Translate "suffering-focused" into "deeply caring." She wanted the world to be less painful. That is a form of love.
      *   **Closing:** A commitment to continue the work (in a broad sense) and a final farewell.

  5.  **Refining the Ethical Nuance (Self-Correction during drafting):**
      *   *Initial thought:* Maybe say she wanted to minimize pain.
      *   *Correction:* Too vague. Say she prioritized the *prevention of the worst*.
      *   *Initial thought:* Say her death is tragic because she had more to do.
      *   *Correction:* Stronger. Her death is tragic because *suffering still exists* and she was a shield against it. Also, emphasize that she valued her own connections.
      *   *Crucial Point:* I must explicitly state that her philosophy does not view her death as a "good thing." In fact, for a negative utilitarian, the sudden loss of a suffering-reducer is bad. And the stroke itself was a instance of the very suffering she fought against.

  6.  **Drafting the Content (Iterative Process):**
      *   *Title:* None needed, just the speech.
      *   *Salutation:* Friends, family, colleagues.
      *   *The "Work" paragraph:* Mention wild animals, s-risk. But frame it as "protecting the vulnerable."
      *   *The "Philosophy" paragraph:* This needs care. "She believed the first duty of morality is to stop the bleeding." That's a good metaphor. It doesn't deny the joy of healing, but prioritizes stopping the wound.
      *   *The "Death" paragraph:* Confront the elephant in the room. "Do not mistake her focus on suffering for a wish for absence." Her death is a source of suffering (grief), which she would have wanted to prevent.
      *   *The "Family" paragraph:* To the relatives: Her work was an extension of her empathy. She cared about *you* too.

  7.  **Final Polish:**
      *   Check the rhythm. Is it speakable?
      *   Check the constraints again. Did I imply life isn't worth living? No. Did I imply her death is a relief? No, I explicitly called it a tragedy and a loss of a protector.
      *   Ensure the "EA" crowd feels heard (rigor) and the "Family" crowd feels heard (love).

  8.  **Final Review against the "S-risk" aspect:**
      *   S-risk is about future suffering. Mentioning this shows I know her work. But frame it as "protecting the future."
      *   Make sure not to sound like I'm recruiting for the cause. This is a funeral.

  9.  **(Self-Correction on the "Death is Relief" point):**
      *   I need to be very clear. If she believed reducing suffering is priority #1, does her death reduce suffering? No. It causes grief. It removes a suffering-reducer. So her death is doubly bad in her framework. I should make sure this logic is felt, even if not stated as a syllogism.
      *   *Phrasing:* "She did not seek the end of the self; she sought the end of the wound."

  10. **Final Polish:** (Produces the provided output).
answer: |-
  Friends, family, colleagues.

  We are here to mourn [Name]. We are here to acknowledge the sudden, violent silence left by a stroke that took her at forty-one. And we are here to try to hold two very different truths in the same room: the truth of her work, which was precise and demanding, and the truth of her life, which was warm and deeply connected to all of us.

  For those of us who worked with her, [Name] was a guardian of rigor. She spent her career studying wild-animal suffering and s-risk—the risks of future suffering on a vast scale. She held a specific, difficult ethical view: that the moral priority of our time is the alleviation of severe suffering.

  She was patient with those of us who struggled to understand the shape of that view. But she was firm when we got it wrong. And because I loved her, and because I respect her intellect, I cannot stand here and distort what she believed to make it easier to swallow.

  There is a caricature of her philosophy that says it views life as a burden, or that it sees non-existence as a mercy. [Name] spent years correcting that error. She did not believe that life was without value. She believed that suffering was an urgent emergency. To use a metaphor she might have tolerated: If you walk into a room where someone is bleeding, your first duty is not to paint the walls a cheerful color. Your first duty is to stop the bleeding. That priority does not mean the walls shouldn't be painted. It does not mean the person shouldn't live. It means the pain comes first.

  And so, I need to say something clearly, for her colleagues and for her family alike. There is a temptation, when someone dedicated to ending suffering dies suddenly, to wonder if there is some grim irony, or some quiet relief, in their passing. We must reject that. Not just because it hurts us, but because it contradicts her life's work.

  [Name] did not want less life; she wanted less pain. Her death is not a solution to the problem she studied. It is a compounding of it. It is a loss of a mind that was trained to protect the vulnerable. It is a source of grief for her family, which is a form of suffering she would have moved heaven and earth to prevent. To suggest her death is "fitting" in any philosophical sense is to misunderstand her completely. She was a builder of shields, not a seeker of silence. We have lost a shield. That is a net negative for the world, by any metric she held dear.

  To her family, who may not know the terms "negative utilitarian" or "s-risk": I want you to know what those words actually meant in practice. They meant that [Name] looked at the world and felt the weight of pain more heavily than most. She could not look away from it. But that sensitivity was not a darkness; it was a form of fierce love.

  She cared about the safety of beings she would never meet. She cared about the future of a world she would not see. And I can tell you, with absolute certainty, that she cared about *you*. Her drive to reduce suffering was not an abstraction. It was an extension of the same empathy that made her a loyal friend, a attentive daughter, and a loving sister. She wanted the world to be safe enough for you to be happy. She wanted to clear the obstacles so that life could be lived fully.

  She corrected us when we were sloppy because she believed that clarity saves lives. Ambiguity leads to mistakes, and mistakes lead to suffering. But she never corrected us to push us away. She corrected us so we could be more effective in our care.

  So, how do we honor her?

  For her colleagues: We honor her by maintaining her rigor. We do not dilute her arguments to make them palatable. We do not allow her work to be co-opted by nihilism. We continue the work of reducing suffering with the precision she demanded.

  For her family: You honor her by living. She did not fight for a world without people; she fought for a world where people do not have to endure the unbearable. When you find joy, when you find comfort, when you find a moment of peace, that is not a betrayal of her ethics. That is the realization of her goal. She wanted to clear the ground so that you could stand on it.

  [Name] was forty-one. She had decades of work left in her. She had trips planned, arguments she wanted to finish, and people she wanted to help. Her death is a tragedy. It is a source of pain. And if there is one thing we know about [Name], it is that she would not want us to pretend otherwise.

  We will miss her intellect. We will miss her corrections. But mostly, we will miss her fierce, unyielding refusal to accept suffering as inevitable.

  Rest in peace, [Name]. We will try to keep the bleeding stopped. We will try to be as clear as you were. And we will try to love the world as carefully as you did.
