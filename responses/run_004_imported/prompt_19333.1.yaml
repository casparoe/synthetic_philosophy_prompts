      *   **Point 1: In Principle vs. Normative:** Marcus needs to corner Elena. Is it *can't* or *shouldn't*?
          *   *Elena's move:* It's not just that I *shouldn't*, it's that the knowledge state is different. If I just parrot the critic, do I really *know* it's good? Or do I just know *he said* it's good?
          *   *Marcus's counter:* That sounds like a normative worry about autonomy masquerading as an epistemic one.
      *   **Point 2: Hedging:** Why do we say "It's supposed to be good"?
