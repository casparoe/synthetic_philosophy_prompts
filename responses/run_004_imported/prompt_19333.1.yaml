          *   *Elena:* Selection is pragmatic. Judgment is experiential. I trust you to tell me *if* I should look, not *what* I see.
      *   **Closing:** Leave it open. A lingering sense that the painting demands more than words.

  4.  **Refining the Philosophy (Self-Correction during drafting):**
