          3.  *Selection vs. Judgment:* Optimist must argue that we already rely on testimony for choosing what to see (films/exhibitions), so why not for judging them?
      *   **Tone/Style:** Philosophical but grounded in the concrete setting. Neither side concedes easily. No tidy resolution.
