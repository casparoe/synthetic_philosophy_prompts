answer: |-
  **Title:** The Wall Label
  **Setting:** A quiet corner of a contemporary art gallery. Late afternoon light slants across a large, textured abstract canvas.
  **Characters:**
  *   **ELENA:** The Pessimist. Values first-hand acquaintance.
  *   **MARCUS:** The Optimist. Defends the parity of aesthetic testimony.

  **(The two stand before the painting. A small brass plaque beside it bears a quote from a prominent critic: *"A devastating reconfiguration of the sublime."*)**

  **MARCUS:** "Devastating." That's a strong word. And coming from Vance, I'm inclined to believe it. He's rarely wrong about this period.

  **ELENA:** *(Leaning in slightly, squinting)* Maybe. But I'm not ready to call it devastating yet. Or even successful.

  **MARCUS:** Why not? You haven't formed a view yet, and Vance has spent twenty years studying this artist. You're going to trust the plaque on the opening date of the gallery without checking the archives, but you won't trust the critical judgment printed right next to it?

  **ELENA:** That's different, and you know it. The opening date is a brute fact. I can verify it, sure, but there's nothing to *experience* about 1994. This painting… the judgment depends on the experience of it. If I just nod and say, "Yes, it's devastating," because Vance said so, I haven't actually made an aesthetic judgment. I've just made a sociological one about Vance's reputation.

  **MARCUS:** Okay, let's slow down. This is the crux of your dissertation chapter, isn't it? I need you to be precise. Are you saying it is *impossible* for me to know this painting is devastating via testimony? That even if Vance is right, and I trust him, and he's reliable, I still don't *know* it? Or are you saying I *could* know it, but I *shouldn't* rely on testimony to get there?

  **ELENA:** I'm saying the knowledge itself is defective.

  **MARCUS:** Defective how? Epistemically?

  **ELENA:** Yes. Wollheim's acquaintance principle. To judge that X is beautiful, or devastating, or profound, I must have experienced X. Testimony can tell me *that* you experienced it. It can't transfer the experience itself. Without the experience, the warrant for the judgment is missing.

  **MARCUS:** But that sounds like you're smuggling a normative constraint into an epistemic box. You're saying, "You *ought* to look for yourself." That's a rule of etiquette, or maybe authenticity. It's not a rule of truth. If I tell you the bridge is unsafe, and you believe me, you know the bridge is unsafe. You don't need to walk across it to test the tensile strength of the steel to *know* it's unsafe. Why is the aesthetic case special?

  **ELENA:** Because the "unsafe" judgment is about a functional property. The "devastating" judgment *is* the experience. If I don't feel the devastation, the predicate doesn't attach. If I believe you about the bridge, I can act on the knowledge. If I believe you about the painting, what do I do? Parrot your words?

  **MARCUS:** You integrate it into your worldview. You understand the art historical landscape better. But look, let's talk about how we actually speak. You're hedging. If I ask you, "Is this good?" you'd say, "Well, Vance says it is." But if I asked you, "Did the gallery open in 1994?" you'd just say, "Yes." You don't say, "The plaque says so." Why the hedge?

  **ELENA:** Exactly! The hedge proves my point. The hedge acknowledges that I lack the proper warrant. I'm signaling that my epistemic position is second-hand. I'm distinguishing between *seeing* that it's good and *believing* that it's good.

  **MARCUS:** I don't think the hedge proves that at all. I think the hedge is just social modesty. It's fallibilism. Even with mundane facts, if I'm not an expert, I hedge. "I *think* the train leaves at five." "I *believe* the war started in '14." We hedge testimony all the time when the stakes are high or the expertise is specialized. The fact that we hedge on art just shows we care about being right, not that knowledge is impossible.

  **ELENA:** But the texture of the hedge is different, Marcus. If I say, "I hear the train leaves at five," and it leaves at six, I was mistaken. If I say, "I hear this is devastating," and I look at it and feel nothing… I don't say *you* were mistaken. I say, "I guess I don't get it." The testimony doesn't settle the matter in the same way. It leaves the question open in a way factual testimony doesn't.

  **MARCUS:** That's because aesthetic judgments are subjective, not because testimony fails. But here's where your position gets practically unstable. You said you wouldn't accept Vance's verdict until you looked hard at the canvas. Fine. But how did you decide to come to this gallery today?

  **ELENA:** You sent me the article.

  **MARCUS:** Right. I told you, "This exhibition is worth your time." That was testimony. You relied on my say-so to expend the money for the ticket and the hour for the commute. You made a pragmatic aesthetic judgment—"This is worth seeing"—based entirely on my testimony.

  **ELENA:** That's a pragmatic judgment about value, not an aesthetic judgment about the object's properties.

  **MARCUS:** Is there a clean line there? If I tell you a film is "boring," and I say that because the pacing is slow, and you trust me and don't go… haven't you accepted an aesthetic verdict on testimony? You've judged the film to be not worth your time based on its aesthetic properties, which you only know through me.

  **ELENA:** I've judged that *for you*, it was boring. And that *probably*, I will agree. But I reserve the right to disagree once I see it. If I accept your verdict on the painting before looking, I surrender the right to disagree. I become a mouthpiece.

  **MARCUS:** Why is surrendering that right a problem? We surrender it all the time. I trust my doctor's testimony about my health. I don't demand to see the blood cells myself to verify the diagnosis. I surrender the right to disagree because I recognize the asymmetry of expertise. Why is the critic different from the doctor?

  **ELENA:** Because the doctor's diagnosis is about a biological reality independent of my experience of it. The cancer is there whether I see it or not. The "devastation" of the painting… it happens *in* the seeing. If I outsource the judgment, I bypass the very phenomenon that makes the judgment true. It's like asking someone else to taste the soup and tell me if it's salty. I can know *that they think* it's salty. But can I know *it is* salty without tasting?

  **MARCUS:** Yes! I can know it's salty. I can act on that knowledge. I can add water.

  **ELENA:** But you can't *enjoy* the saltiness. Or suffer it.

  **MARCUS:** So now we've shifted from knowledge to enjoyment. You're talking about the *value* of the experience, not the *warrant* for the belief. Your advisor is right, Elena. You're conflating the norm of autonomy—"You should taste the soup yourself to be a proper diner"—with the norm of truth—"You can't know the soup is salty unless you taste it." If Vance says it's salty, and he's reliable, and it is salty… where is the epistemic failure?

  **ELENA:** The failure is in the connection between the subject and the object. Aesthetic knowledge isn't just propositional. It's not just "This painting has property P." It's "This painting commands a response R." If I haven't felt R, I don't know the painting commands it. I just know it commands it *for Vance*.

  **MARCUS:** But that implies aesthetic properties aren't real properties of the object.

  **ELENA:** Maybe they aren't. Or maybe they're relational.

  **MARCUS:** If they're relational, testimony should still work. I can testify about relations. "This key fits that lock." You don't need to turn the key to know I'm telling the truth, if you trust me.

  **ELENA:** *(Turns back to the painting, silent for a moment)* It feels like… if I accept your argument, the gallery becomes a library. I might as well just read the reviews at home. The looking becomes decorative.

  **MARCUS:** And if I accept yours, the critic becomes useless. Why publish reviews? Why have wall labels? If testimony can't ground judgment, then criticism can only ever be a prompt. It can never be an education.

  **ELENA:** Criticism teaches you *how* to look. It doesn't tell you *what* you see. Vance's quote… maybe it's not a verdict I'm supposed to accept. Maybe it's an instruction. "Look for the reconfiguration."

  **MARCUS:** So the testimony is valid, but only as a heuristic?

  **ELENA:** As a guide to attention. Not a substitute for judgment.

  **MARCUS:** But if I follow the guide, and I see what you saw, and I form the judgment… didn't the testimony cause the knowledge?

  **ELENA:** It caused the *conditions* for knowledge. It wasn't the source of the warrant. The warrant is the looking.

  **MARCUS:** *(Sighs, looking at the watch)* We're going in circles. You want the warrant to be the experience; I want the warrant to be the reliability of the source. You think hedging proves a deficit in the knowledge; I think it proves a surplus of caution.

  **ELENA:** And you think choosing the exhibition is the same as judging it. I think one is a map, and the other is the territory.

  **MARCUS:** But maps are testimony, Elena. And we navigate by them.

  **ELENA:** *(Steps closer to the canvas, almost touching the air in front of it)* I know. But I'd rather get lost here than be right about it because you told me the way.

  **MARCUS:** Even if being "right" means understanding the art history of the last century?

  **ELENA:** Especially then.

  **(They stand in silence for a moment. Marcus reads the plaque again. Elena keeps looking at the brushwork. Neither moves to the next room.)**
