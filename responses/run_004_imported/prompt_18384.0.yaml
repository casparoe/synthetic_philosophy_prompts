answer: |-
  This is one of the sharpest objections to the Reflection Principle (RP), and your intuition is spot on: if RP implies you should adopt the credences of your future, blackout-drunk self, then RP is false. The good news is that formal epistemologists generally agree with you. The "drunk/boot-camp" cases don't gut the principle; rather, they reveal the **scope conditions** hidden in van Fraassen's original formulation.

  Here is a walkthrough of how to reconcile Reflection with these counterexamples, why Ulysses contracts are rational, and what this implies for the normativity of belief.

  ### 1. Diagnosing the Failure: Evidence vs. Causal Tampering

  The core motivation for Reflection is the idea that your future self is a **better information processor**. If your credence shifts from $p$ to $q$, Reflection assumes this shift is driven by the acquisition of evidence (learning).

  In your counterexamples (drunkenness, brainwashing, fatigue), the shift in credence is **not** driven by evidence. It is driven by a causal mechanism that severs the link between belief and truth.

  *   **The Naive Reflection Principle:** $P_{now}(H \mid P_{future}(H) = q) = q$.
  *   **The Problem:** This equation assumes that the *only* reason $P_{future}(H)$ would equal $q$ is if $q$ is the rational response to new information.
  *   **The Fix:** You need to condition on *how* the future opinion is formed.

  If you know you are getting blackout drunk, you know your future belief formation process is **compromised**. You are not merely learning that $P_{future}(H) = q$; you are learning that $P_{future}(H) = q$ *because of alcohol*.

  Therefore, the principled block is to restrict Reflection to **epistemically rational updates**. A refined version looks like this:

  $$P_{now}(H \mid P_{future}(H) = q \text{ \& } \text{Update is Rational}) = q$$

  In the drunk case, the second conjunct is false. You know the update is *not* rational. Therefore, the principle does not trigger, and you are not required to adopt credence $q$. This preserves the motivation (defer to your rational future self) without the absurd consequence (defer to your compromised future self).

  ### 2. Van Fraassen and the Ulysses Case

  Your TA is correct that van Fraassen was aware of this. In his 1984 paper *"Belief and the Will,"* van Fraassen discusses Ulysses and the Sirens precisely to show that **Reflection is not a synchronic constraint on belief, but a diachronic constraint on updating.**

  Ulysses knows that when he hears the Sirens, his future self will want to steer toward the rocks.
  *   **Future Preference:** Steer to rocks (due to enchantment).
  *   **Current Preference:** Steer away (due to rationality).

  If Ulysses applied a naive "Preference Reflection Principle," he would steer to the rocks now. But he doesn't. Why? Because he recognizes that his future self's preferences are not the result of **deliberation**, but of **external manipulation**.

  Van Fraassen uses this to argue that belief is not entirely under voluntary control, but also to highlight that **rationality involves protecting your future self from known irrationality.** The Reflection Principle is a norm for agents who expect to remain **epistemically competent**. If you expect to become incompetent, Reflection goes on holiday.

  ### 3. Does this gut the motivation for Reflection?

  No, but it does weaken it from a logical theorem to a **norm of trust**.

  Some philosophers (like David Christensen) argue that these counterexamples show Reflection is simply false as a strict logical rule. Christensen argues for the possibility of **Epistemic Akrasia**: it can be rational to say, *"I believe $H$, but I know that tomorrow I will believe $\neg H$ due to bias, and I am right to believe $H$ now."*

  If you accept Akrasia, you don't need to tweak Reflection with "scope conditions"; you just reject Reflection as a universal law. However, most formal epistemologists prefer to save Reflection by treating it as a constraint on **idealized learning**.

  **The Principled Distinction:**
  1.  **Learning:** Changes in credence due to evidence (Conditionalization). $\rightarrow$ **Reflection Applies.**
  2.  **Tampering:** Changes in credence due to biology, coercion, or fatigue. $\rightarrow$ **Reflection Does Not Apply.**

  This doesn't gut the motivation. The motivation is to prevent **diachronic Dutch Books** (being pumped for money across time). If you change your mind because you got drunk, you aren't vulnerable to a Dutch Book based on *information*; you're vulnerable because you're irrational. The Dutch Book argument for Reflection assumes you are updating on *partitions of evidence*. If the "partition" is "levels of intoxication," that's not evidence about the world, it's evidence about your cognitive machinery.

  ### 4. Real-Life Teeth: Ulysses Contracts and Psychiatric Directives

  This is where the epistemology gets practical. You asked if this has teeth for decisions like Psychiatric Advance Directives (PADs). **Yes, it does.**

  A PAD is a contract where a competent patient stipulates treatment (e.g., "force me to take meds") that their future, incompetent self will refuse (e.g., "I feel great, stop the meds!").

  **The Objection:** Why should the past self bind the future self? Isn't the future self's current desire what matters?
  **The Reflection Response:** The future self's desire is the result of a **non-evidential process** (mania/psychosis).

  Just as you shouldn't adopt the credences of your drunk self, society (and your past self) shouldn't obey the preferences of your manic self. The epistemological distinction between *evidence-based shifts* and *causal tampering* maps directly onto the ethical distinction between *autonomous choice* and *competence*.

  **The "Teeth":**
  1.  **Justification for Paternalism:** This framework justifies self-paternalism. It is rational to restrict your future freedom if you have high confidence that your future decision-making process will be decoupled from truth/value.
  2.  **The Standard of Competence:** It provides a definition of competence. A self is "competent" roughly when their belief/preference updates satisfy Reflection (i.e., they track evidence/values). A self is "incompetent" when their updates violate Reflection due to known internal interference.
  3.  **Regret Minimization:** Arntzenius (2003) argues that rational agents should choose policies that minimize expected regret. If you know your future self will regret *not* being bound (once they recover), binding them now is the rational choice. This relies on the same logic as blocking the drunk counterexample: you trust the *recovered* self (who satisfies Reflection) more than the *active* self (who violates it).

  ### 5. Summary for Your Seminar

  If you want to crush this in discussion section, here is the takeaway:

  1.  **The Counterexample holds:** Naive Reflection fails for non-evidential shifts (drunk/boot-camp).
  2.  **The Solution is not abandonment:** We don't throw out Reflection; we recognize it presupposes **epistemic trust**.
  3.  **The Formal Fix:** Reflection applies conditional on the future update being a result of **learning** (Conditionalization), not **causal interference**.
  4.  **The Practical Implication:** This validates Ulysses Contracts. We are justified in binding our future selves when we know their preference/credence formation will be severed from truth/rationality.

  **One final nuance to drop:**
  Mention **Hilary Greaves** or **David Christensen**. Christensen specifically argues that in cases like "I know I will be drugged," you are essentially treating your future self as a **different agent**. If you treat Future-You as a stranger who is known to be unreliable, you wouldn't defer to them. Reflection works because we usually treat Future-Us as the *same* agent with *more data*. When the "same agent" condition breaks (due to brainwashing), the obligation to defer breaks too.

  This preserves the "defer to your future self" intuition for normal cases (where you learn things) while blocking the absurdity in the drunk cases.
