      *   **Van Fraassen's Defense:** He actually distinguishes between *learning* and *other changes*. RP applies to *opinion changes based on learning*.
      *   **Conditionalization:** RP is often seen as a generalization of Conditionalization. If the change isn't due to evidence (Conditionalization), RP might not apply.
      *   **Ulysses Contracts:** These are practical commitments, not necessarily epistemic ones, but they rely on the distinction between *current rational preferences* and *future compromised preferences*.
