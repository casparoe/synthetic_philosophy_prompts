      *   **Two-Truths Advocate (let's call him "Tenzin"):** Influenced by the Prāsaṅgika tradition (Tsongkhapa style) or perhaps Siderits/Thurman. Sees the tetralemma as a therapeutic tool to stop conceptual proliferation (*prapañca*). Negations are *prasajya* (non-implicating) not *paryudāsa* (implicating). Contradictions only arise if you reify concepts.

