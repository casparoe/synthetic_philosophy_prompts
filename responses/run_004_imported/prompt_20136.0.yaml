answer: |-
  The engine of the pickup truck idles roughly, vibrating through the soles of their boots. Dust hangs in the heat shimmer. The driver, a thick-armed man with eyes that have seen too many liars, rests his elbow on the open window frame, palm extended.

  Julian stares at the hand. He has his wallet out. Mara stands beside him, hands in her pockets, watching him.

  **Julian:** It feels like extortion.

  **Mara:** It feels like rent.

  **Julian:** Rent is for space I occupy. This is for space I *occupied*. The causal chain ends at the curb, Mara. Look at him. He's already done the work. My keeping the money doesn't put him back in the desert. My paying him doesn't get me more water. The utility of this transaction, evaluated at this node, is negative for me and neutral for him.

  **Mara:** Evaluated at *this* node. That's the whole disease. You're treating yourself like a series of snapshots. A different agent at every intersection.

  **Julian:** I'm treating myself as an agent situated in reality. Reality is *now*. The desert was then. If I hand this over, I am literally throwing away resources for no return. That's not rationality. That's ritual.

  **Mara:** So rationality is just local optimization?

  **Julian:** It's maximizing expected utility given current information. My current information is: I am safe. The threat is gone. Therefore, I keep the cash.

  **Mara:** And if every agent reasoned that way, the driver never picks anyone up.

  **Julian:** Then the driver starves, or he learns to pick suckers who lie better. But don't tell me *I'm* irrational because I survive the desert and keep my money. I'm the one standing in the shade. The "rational" agent who pays is standing in the desert, or she's standing here but she's poorer.

  **Mara:** She's not standing in the desert, Julian. That's the point you're refusing to see. The agent who pays is the only one who *gets* to stand here. The agent who reasons like you do gets left to bake. You didn't outsmart the system. You got lucky the driver made a mistake, or you're misunderstanding what you are.

  **Julian:** I'm not a disposition. I'm a person making a choice.

  **Mara:** You're a process that produces choices. If the process outputs "defect" at this stage, then the process was identifiable as a "defector" back in the desert. The driver reads the process, not the promise.

  **Julian:** But the process can change! I can be a "defector" now because the incentives changed. That's responsiveness. That's intelligence.

  **Mara:** That's dynamic inconsistency. It's a glitch. You're saying it's rational to have a preference ordering that flips just because you crossed a geographical line.

  **Julian:** It's not a flip. It's an update. In the desert, paying was instrumentally useful to get the ride. In town, it isn't. Why should I be bound by a calculation that is no longer true?

  **Mara:** Because if you bind yourself only to calculations that are true *in the moment*, you become the kind of entity that cannot make binding agreements. You become untrustworthy by design. And in a world full of drivers who can read you, you become dead.

  **Julian:** So "rational" means "dead in the counterfactuals"?

  **Mara:** "Rational" means "winning."

  **Julian:** I *am* winning. I have the water. I have the money.

  **Mara:** You won a single round. You lost the game. Decision theory isn't about solving one puzzle; it's about being the sort of puzzle-solver who gets invited to play. If your theory of rationality prescribes an action that, if known in advance, ensures you never get the opportunity to take it... what work is the word "rational" even doing? It's just a label for "self-sabotage with extra steps."

  **Julian:** That's a category error. You're conflating the *value of having a disposition* with the *rationality of an act*. Yes, it is beneficial to *have* the disposition to pay. I admit that. I wish I had it. It would have been useful to be the kind of person who couldn't defect. But I *don't* have it. I'm here. I'm capable of defecting. So I defect. It's tragic, maybe. But it's rational.

  **Mara:** It's not tragic, it's incoherent. You're saying, "I wish I were the kind of agent who pays, but since I'm the kind of agent who keeps, I'll keep." But you can't just disown the disposition. You *are* the disposition.

  **Julian:** Watch me. (Julian thumbs a bill free from the stack.)

  **Mara:** Put it away.

  **Julian:** Why? Give me the command. Your theory says I must pay. But *why*? Causally, what does this motion of my hand achieve?

  **Mara:** It aligns your action with the condition that made your presence possible.

  **Julian:** That's backwards causation.

  **Mara:** It's logical correlation. The driver predicted you would pay. If you don't, you prove him wrong. But more than that, you prove *yourself* wrong. You proved that your earlier self's calculation—that paying was the right move—was undermined by your later self's weakness. You're saying your past self was irrational to commit to this, and your present self is rational to break it. Which one is the real you?

  **Julian:** The one with agency *now*. The past self is gone. He's a ghost. I'm the one holding the wallet.

  **Mara:** And if you keep the money, you confirm that you are an agent who cannot be trusted with coordination problems. You are functionally broken.

  **Julian:** Or I'm functionally free. Look, Mara, be honest. Is your theory actually telling me what to *do*? Or is it just telling me what to *be*? Because if I'm already this kind of person—the kind who sees the sunk cost and cuts it—telling me to "be otherwise" is like telling a blind man to see.

  **Mara:** It's telling you to execute the policy you would have selected if you'd had the chance to precommit.

  **Julian:** But I didn't precommit! I made a promise, sure, but promises are cheap talk. The driver knew that. He didn't trust the promise; he trusted the prediction. The prediction is already in the books. I can't change the prediction now.

  **Mara:** You can't change the *past* prediction. But you determine whether that prediction was a true model of you. If you pay, the model was accurate. If you don't, the model was false. But here's the kicker: If you know you're going to defect in town, the model *should have been* that you defect. Which means the driver shouldn't have picked you up.

  **Julian:** But he *did*.

  **Mara:** Then either he made a mistake, or you're wrong about what you're going to do.

  **Julian:** He made a mistake. Humans aren't perfect lie detectors.

  **Mara:** Parfit's setup says he is.

  **Julian:** Then Parfit's setup is impossible. I'm dealing with reality. In reality, I'm here.

  **Mara:** You're treating the thought experiment like a loophole hunt. You want to exploit the gap between the prediction and the act.

  **Julian:** I'm exploiting the gap between *causality* and *correlation*. The driver's prediction correlates with my act, sure. But my act doesn't *cause* the prediction. So why should I sacrifice real dollars for a correlation?

  **Mara:** Because you aren't just an act. You're the source of the act. The driver didn't predict your hand moving; he predicted *you*. If you keep the money, you aren't beating the driver. You're admitting you're not the agent he thought you were. You're admitting you're a defector. And defectors don't get rides.

  **Julian:** But I *got the ride*, Mara! I'm hydrated. You're the one lecturing me while sweating.

  **Mara:** (Steps closer, voice drops) Because I'm going to pay. And I'll do it again next time. And I'll get the next ride. You won't. You've burned your bridge. You think you've won a payoff, but you've lost your access to the network of cooperation. You're a one-shot wonder.

  **Julian:** One shot is all I need if the payoff is high enough.

  **Mara:** That's not a theory of rationality. That's a theory of looting.

  **Julian:** (Laughs, sharp and dry) Looting gets you fed. Rationality gets you a grave with a clear conscience. Tell me this: If I pay him, am I not just enslaved by a counterfactual? I'm sacrificing real utility for a ghost story about what *would* have happened in the desert.

  **Mara:** You're sacrificing real utility to maintain the integrity of your agency across time. If you can't trust your future self to execute the plans of your past self, you can't plan. You can't build. You can only react.

  **Julian:** I'm reacting to the facts on the ground.

  **Mara:** You're reacting to the impulse of the moment. That's not an agent. That's a thermostat.

  **Julian:** (Looks at the driver. The driver taps the steering wheel. Impatient.) He's waiting.

  **Mara:** Then decide. Do you want to be right, or do you want to be whole?

  **Julian:** I want to be rich and alive.

  **Mara:** You can't be the second without being the kind of person who accepts the cost of the first.

  **Julian:** No. I can be alive and rich, and let the "kind of person" talk go to the philosophers who die in the desert.

  **Mara:** You won't die in the desert. You just won't be invited to leave it.

  *Julian hesitates. The bill trembles slightly in the heat haze. He looks at the driver, then at Mara, then at the money. The engine idles, a low, constant thrum that seems to vibrate in the silence between them.*

  **Julian:** Rationality is about winning.

  **Mara:** Then win the game, not the hand.

  *Julian slides the bill back into the wallet. He snaps it shut. He looks at Mara.*

  **Julian:** I'm keeping it.

  **Mara:** (Nods, once) Then I hope you never find yourself in a desert where the driver knows you.

  *Mara steps forward and places her cash in the driver's hand. The driver nods to her, shifts gears, and looks at Julian. He doesn't look angry. He looks disappointed. Like a mechanic looking at a car that refuses to start.*

  **Julian:** (To the driver) I'm not paying. Causally, it makes no sense.

  *The driver stares at him for a long moment. Then he shrugs, puts the truck in gear, and pulls away. Dust billows over Julian. He stands alone in the street, wallet heavy in his hand, watching the taillights disappear into the heat.*

  **Julian:** (To himself) Rational.

  *He turns to walk into the town. He is rich. He is alive. He is the only one.*
