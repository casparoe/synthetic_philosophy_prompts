          *   **Meaning:** This defines the *fourth* sense of priority (Priority in Nature/Substance). The test is ontological independence ($A$ is prior to $B$ if $A$ can exist without $B$, but $B$ cannot exist without $A$).
      *   *Sentence 2:* "(If we consider the various senses of 'being', firstly the subject is prior, so that substance is prior; secondly, according as potency or complete reality is taken into account, different things are prior, for some things are prior in respect of potency, others in respect of complete reality...)"
