  2.  **Deconstruct Question 1: The Contented Pig & The Formulation Shift.**
      *   *Initial Formulation:* "What I should actually desire... if all consequences... foreknown and adequately realised... at the time of making my choice."
      *   *Sidgwick's Objection:* Mere lack of regret isn't enough. A "contented pig" might not regret his life, but we think he missed a "greater good." The problem is that actions can *alter tendencies to desire*. If I choose the pig life, my desires change to fit that life. I might not regret it *then*, but that doesn't make it my Good.
      *   *The Fix:* Shift from "what I would desire *at the time of action* given consequences" to "what I would *now* desire... if all consequences of *all different lines of conduct*... were accurately foreseen... at the *present point of time*."
      *   *Key Distinction:* The first formulation allows the agent's *current* character/desires to filter the imagination of consequences. If I'm pig-ish *now*, I might imagine the pig life as great. The second formulation requires a "view from now" that compares *all* lines of conduct. It implies a standpoint that isn't contaminated by the specific desire-altering effects of the chosen action *before* the choice is made. It's about *comparative* evaluation of life-paths from a stable vantage point, not just simulating the outcome of one path through current (potentially corrupted) lenses.
      *   *Connection to Pig:* The pig objection shows that satisfaction *within* a lowered standard isn't Good. The revised definition tries to ensure the standard itself is evaluated from a point that sees *all* alternatives, not just the one chosen.

  3.  **Deconstruct Question 2: The Shift to Reason/Authority.**
      *   *First Claim:* Good = Hypothetical Desire. No independent "dictate of Reason." It's factual (psychological hypothesis).
      *   *Second Claim:* But it's better to follow Butler: Calm desire for Good is *authoritative*. "Harmony with reason."
      *   *Is it Circular?* Sidgwick is notoriously dualistic (Rational Egoism vs. Utilitarianism vs. Intuitionism). Here, he is wrestling with the definition of "Good" (Prudential).
      *   *Analysis:* He admits the hypothetical desire account is "intelligible and admissible" but "paradoxical." It feels too complex for common sense. So he pivots to Butler to capture the *normative force* (authority).
      *   *Circularity:* Yes, there is a tension. If "Good" is defined by "what I would desire," then "Reason" telling me to pursue "Good" is just "Reason" telling me to pursue "what I would desire." But if "Harmony with Reason" is a *constraint* on the desire, then "Good" isn't *just* the desire; it's the desire *filtered by Reason*.
      *   *Sidgwick's Move:* He is distinguishing between the *definition* of the object (Good) and the *motive* (Authority). He tries to keep the definition naturalistic but admits common sense requires an authoritative dictate. This foreshadows his later dualism of practical reason. He doesn't fully solve the circularity here; he acknowledges the "ideal element."

