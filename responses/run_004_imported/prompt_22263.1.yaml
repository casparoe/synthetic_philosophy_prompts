          *   *Horn 2 (Normative Constraint):* Build in "rationality" or "convergence." Risk: Circularity or Paternalism. Who defines "rational"? If the AI imposes a standard of "better," it's not truly *our* volition. (Sidgwick's Reason Objection).
      *   *Sidgwick's Hint:* Sidgwick's shift from "time of choice" to "present point of time" + "all different lines of conduct" is crucial. It suggests the idealization isn't just *more* of the same desire (intensity/duration), but a *comparative* evaluation from a stable standpoint that isn't altered by the specific choice being evaluated.
      *   *Escaping the Fork:* The escape requires that the idealization process includes *procedural rationality* (coherence, information) but also acknowledges that some desires are *constitutive* of well-being in a way that mere satisfaction isn't (e.g., autonomy, knowledge). Sidgwick hints at this with "alter men's tendencies to desire." The idealization must prevent the *corruption* of the evaluator by the option being evaluated.
      *   *Modern Parallel:* This looks like the distinction between *internalist* vs. *externalist* idealization. Or "procedural" vs. "substantive" theories of well-being. Sidgwick wants a procedural account that yields substantive results.
      *   *Verdict:* CEV faces the exact same fork. Sidgwick doesn't fully escape it (he admits the "paradox" and leans on Butler's authority). The hint is in the *comparative* nature ("all different lines of conduct") and the stability of the evaluator ("present point of time" vs. "time of choice" which might be influenced by the impulse).

  5.  **Synthesize and Structure the Response:**
      *   **Introduction:** Acknowledge the sophistication of the connection (Sidgwick -> Ideal Desire -> CEV). Validate the user's reading.
      *   **Section 1: The Contented Pig and the Shift in Formulation.**
          *   Explain why the first formulation fails (adaptive preferences).
