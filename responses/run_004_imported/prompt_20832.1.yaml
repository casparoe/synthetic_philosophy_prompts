      *   *The Core Metaphor (The Urn):* This is the crux. In their work, they teach people to avoid the "unknown urn." But love *is* the unknown urn.
      *   *The Turn:* Why is this rational? Because in decision theory, you maximize utility. But in marriage, the "utility" isn't just happiness; it's facing the unknown together. The "ambiguity" is the feature, not the bug.
      *   *Bridging the Gap:* Make sure the family understands that "urn" = "life together." Make sure the academics feel the theory is respected, not mocked.
      *   *Conclusion:* Bring it back to the parent's perspective. The "sure thing" is their love.

  5.  **Refining the Tone:**
      *   *Avoid:* Cynicism. It shouldn't sound like "You're being irrational." It should sound like "You've found a higher rationality."
      *   *Include:* Specific references for the cognoscenti (Ellsberg, priors, capacities) but contextualize them.
      *   *Pacing:* 4 minutes is roughly 500-600 words. Need to ensure it's not too dense.

