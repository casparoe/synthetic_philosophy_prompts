answer: |-
  Good evening, everyone. For those who don't know me, I'm the groom's father. I'm also, by trade, a decision theorist. Which means my job is essentially to calculate risk, analyze choices, and explain why people do the things they do.

  Usually, when a parent gives this toast, they talk about how much they've watched their child grow. And I have. But I've also watched my son and his brilliant fiancée grow *together*. And since half of you are colleagues who know their work, and the other half are family who just want to know if the cake is chocolate, I need to walk a fine line.

  So, here is the technical summary for the academics: They met at a summer school arguing about ambiguity aversion. She is team Maxmin Expected Utility—she prefers to evaluate choices based on the worst-case scenario across a set of priors. He is team Choquet—he believes you can weight probabilities non-additively depending on the rank of the outcome. They have spent years debating the Ellsberg Paradox.

  And for the family: They met arguing about whether it's smarter to play it safe or take a chance on the unknown. She likes to know the odds. He likes to calculate the value of the outcome.

  Now, in our field, the standard lesson of the Ellsberg Paradox is "ambiguity aversion." It's the idea that rational people prefer a known risk over an unknown one. If I have an urn with 50 red balls and 50 black balls, you know the odds. If I have an urn with 100 balls but I don't tell you the ratio, that's ambiguous. A rational decision theorist is taught to avoid the second urn.

  And yet… look at them.

  Marriage is, by definition, the ultimate ambiguous urn. There are no known probabilities. There is no historical data set large enough to predict the outcome. You cannot model the volatility of a lifetime together. There is no "sure-thing principle" that guarantees happiness.

  By their own professional standards, choosing to get married is irrational. It is a massive violation of ambiguity aversion. They are stepping into an urn where the odds are completely unknown, the payoffs are uncertain, and the horizon is infinite.

  But here is where I, as a father and a theorist, have to concede that they have outsmarted me.

  Because I've realized that their choice isn't a failure of their theory. It's an update of their priors.

  They spent years studying how to avoid uncertainty. But in finding each other, they realized that the only way to maximize utility isn't to avoid the unknown—it's to face it with the right partner. The ambiguity isn't a risk to be managed; it's the space where their life will happen.

  She brings the robustness. She ensures that even in the worst-case scenarios, they will stand firm. He brings the flexibility. He ensures that they can weight the good moments heavily enough to make them matter more than the bad.

  Together, they haven't rejected decision theory. They've expanded the choice set. They've decided that the expected utility of a life built on uncertainty is higher than the safety of a life lived alone.

  So, to the academics: They have demonstrated that sometimes, the rational choice is to embrace the ambiguity.
  And to the family: They have shown that love is worth the gamble, no matter what the odds say.

  Please raise your glasses. To the bride and groom: May your priors be flexible, your outcomes be kind, and may you never stop choosing each other, even when the odds are unknown.

  To the happy couple.
