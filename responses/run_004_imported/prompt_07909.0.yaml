      *   *Thread 2 (The Normative/Epistemological Claim):* Pascal defines the proper domains of authority. Force rules bodies; reason rules minds; charity rules wills. To mix them is "tyranny." This is prescriptive regarding the *orders* (orders of flesh, mind, charity).
