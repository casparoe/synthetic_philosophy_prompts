  I completely understand the fatigue. The heart example is the "Hello World" of philosophy of biology, and by the third year of teaching it, you want to throw the textbook out the window. The spandrels example is equally tired, and the appendix/orgasm duo often devolves into awkward seminar discussions.

  Here is a concrete, biologically robust example that avoids the anatomical clichés and gets at the core disagreement between **Etiological (Selected-Effects)** and **Causal-Role (Systemic)** accounts without relying on vestigiality.

  ### The Example: Cytochrome P450 Enzymes and Synthetic Pharmaceuticals

  **The Trait:** The **CYP2D6 enzyme** in the human liver (part of the Cytochrome P450 family).
  **The Biological Context:** These enzymes are responsible for metabolizing foreign compounds (xenobiotics). They are evolutionarily ancient and highly conserved.

  #### 1. The Biological Setup
  In our evolutionary past, the selective pressure on CYP2D6 was the presence of **plant alkaloids** in the diet (e.g., toxins in tubers, fruits, or leaves). The enzyme's molecular structure was shaped by natural selection to bind to and neutralize these specific organic compounds to prevent poisoning.

  In the modern environment, CYP2D6 is the primary metabolizer of roughly **25% of commonly prescribed pharmaceutical drugs**, including codeine, beta-blockers, and SSRIs. For example, CYP2D6 converts codeine into morphine in the liver, enabling its painkilling effect.

  #### 2. The Disagreement

  **The Etiological (Selected-Effects) Account:**
  *   **Verdict:** Metabolizing codeine is **not** a function of CYP2D6.
  *   **Reasoning:** Functions are defined by evolutionary history. CYP2D6 exists *because* it helped ancestors survive plant toxins. Synthetic codeine did not exist during the selection period. Therefore, the metabolism of codeine is a "proper accident" or a lucky side effect. The enzyme is not *functioning* when it processes the drug; it is merely interacting with it. The only "proper function" is detoxifying plant alkaloids.
  *   **Implication:** If the enzyme fails to metabolize a drug, it is not a "malfunction" in the strict etiological sense, because it was never selected to do that job.

  **The Causal-Role (Systemic) Account:**
  *   **Verdict:** Metabolizing codeine **is** a function of CYP2D6.
  *   **Reasoning:** Functions are defined by the current contribution a trait makes to the capacity of the containing system. The containing system is the liver's detoxification/clearance system. The capacity of this system is to clear xenobiotics from the blood. CYP2D6 currently contributes to this capacity by binding to and breaking down codeine.
  *   **Implication:** The historical origin is irrelevant. If the enzyme contributes to the systemic capacity (clearing the blood), it is performing a function. If it fails to metabolize the drug (due to a polymorphism), it *is* a malfunction of the clearance system, regardless of evolutionary history.

  ### Why this works better than the Heart/Spandrel examples

  1.  **It avoids "Vestigial" traps:** Unlike the appendix or goosebumps, the trait isn't a useless leftover. It is an active, vital enzyme. The disagreement isn't about whether the trait *does* anything (it clearly does), but about whether the *specific new task* counts as a function.
  2.  **It isolates the "History" variable:** In the heart example, students often conflate "pumping blood" (history) with "making noise" (byproduct). In the enzyme example, both actions are chemically identical (binding and catalysis). The *only* difference is the historical presence of the substrate (plant toxin vs. synthetic drug). This forces students to focus purely on the definition of function, not the mechanics of the trait.
  3.  **It highlights the "Normativity" problem:** The Etiological account preserves the idea of "malfunction" (the enzyme isn't *supposed* to handle drugs). The Causal-Role account struggles with normativity here (if the enzyme metabolizes the drug, it's functioning; if it doesn't, it's broken), which opens up a great discussion about medical vs. evolutionary norms.

  ### Teaching Tip
  If you want to make it even more concrete, you can mention **CYP2D6 Poor Metabolizers**. About 7% of Caucasians have a genetic variant that makes this enzyme non-functional.
  *   **Etiologicalist:** They lack the function of *plant detoxification*. Their reaction to codeine is medically irrelevant to the *biological function*.
  *   **Causal-Rolist:** They lack the function of *blood clearance*. Their inability to process codeine is a functional failure of their hepatic system *right now*.

  This example usually wakes students up because it connects abstract philosophy of biology to pharmacology and personalized medicine, which feels more immediate than dinosaur spandrels.
