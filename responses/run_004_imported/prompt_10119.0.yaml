      *   *Verdict:* The Later Popper is stronger *scientifically* and *philosophically* regarding the actual practice of biology. The Early Popper was stronger as a logical caution against sloppy definitions.
      *   *Why?* Because science isn't just about logical syntax; it's about empirical content. The Modern Synthesis gave evolution that content.

