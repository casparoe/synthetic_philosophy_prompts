      *   *Classification:* "Metaphysical research programme." This doesn't mean "wrong," but "not empirically falsifiable in itself." It's a framework *within which* testable theories can be built, but the core principle isn't directly testable.
      *   *Motivation:* Popper was obsessed with the *Demarcation Problem* (what separates science from non-science?). He wanted to protect science from pseudo-science (like Marxism or Psychoanalysis, which he saw as unfalsifiable). He was worried evolution was being treated as dogma.

  3.  **Deconstruct Popper's Later Position (1978):**
      *   *Source:* Lecture titled "Natural Selection and the Emergence of Mind" (1978), published in *Dialectica*.
      *   *Core Argument:* He changed his mind. He realized natural selection *is* testable.
      *   *Reasoning:* We can test specific hypotheses derived from natural selection. We can observe adaptation, predict fossil records, test genetic drift vs. selection. It's not just a logical truism; it makes empirical claims about the world.
      *   *Quote:* "I have changed my mind about the testability and logical status of the theory of natural selection; and I am glad to have an opportunity to make a recantation."

