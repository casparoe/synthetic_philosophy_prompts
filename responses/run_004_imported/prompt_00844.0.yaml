answer: |-
  **Setting:** *The hotel bar, 11:30 PM. The noise of the epistemology conference has thinned out, leaving a haze of cigarette smoke (outside) and the clink of ice. MAYA (defeasibility defender) and LEO (closure skeptic) are nursing the last of their drinks.*

  **Maya:** (Swirling her scotch) I thought the talk was solid, but he completely sidestepped the Kripke-Harman worry. You can't just wave at closure and pretend the dogmatism paradox doesn't sting.

  **Leo:** Stings? It bleeds. But honestly, I think we've been bandaging the wrong wound. The defeasibility fix—the Harman line, polished by Sorensen and Hawthorne—it's elegant, sure. But it's glass.

  **Maya:** Glass? It's the only thing holding the shop up. Look, the intuition is simple: If I know $p$, and $p$ entails that any evidence against $p$ is misleading, I shouldn't be able to just ignore new data. That's the dogmatism. But the defeasibility account says: The moment substantial counter-evidence actually shows up, my knowledge of $p$ evaporates. So I never reach a state where I know $p$ *and* possess defeating evidence. The license to dismiss vanishes exactly when the evidence arrives.

  **Leo:** That's the "temporal loss" move. I know. But Sharon and Spectre crushed that in "Dogmatism Repuzzled." Remember their point? The inference happens *before* the evidence arrives. At $t_1$, I know $p$. I deduce that any future evidence $e$ will be misleading. I write that down. I put it in my mental file. Then at $t_2$, $e$ arrives. You say I lose knowledge of $p$ then. Fine. But I already did the work at $t_1$. I already licensed myself to ignore $e$. The damage is done before the defeater hits.

  **Maya:** But that assumes the inference at $t_1$ is warranted. Just because I *can* deduce it doesn't mean I'm epistemically positioned to *act* on it. This is where Hawthorne's "junk knowledge" comes in. Maybe I technically satisfy the conditions for knowledge at $t_1$, but it's knowledge I can't use for certain practical inferences—specifically, inferences that would insulate me from future inquiry.

  **Leo:** (Laughs softly) "Junk knowledge." It sounds like a patch. You're saying I have the knowledge, but I'm not allowed to use the closure principle on it? That feels like you're saving closure by hollowing it out. If I can't deduce the known entailments, in what robust sense does closure hold?

  **Maya:** It holds theoretically, but pragmatically, the warrant is fragile. Look, if you restrict closure, you're opening Pandora's Box. If I know I have hands, and I know hands entail I'm not a brain in a vat, do you really want to say I don't know I'm not a brain in a vat? That's the skeptical wedge. The defeasibility account lets me keep closure for the skeptic cases while explaining why I can't be dogmatic about the evidence. The knowledge is sensitive to the defeater.

  **Leo:** But Sharon and Spectre show that sensitivity isn't enough. They construct cases where the defeasibility condition is met, but the dogmatism persists. Imagine a case where the counter-evidence is misleading, so I *keep* the knowledge even after seeing it. On your view, if the evidence is misleading, I still know $p$. So I *should* be able to dismiss it. But if I dismiss it solely because I know $p$, I'm being dogmatic. If I don't dismiss it, I'm being irrational about my own knowledge.

  **Maya:** That's a Gettier-style wrinkle, though. If the evidence is misleading, the world is cooperating with my belief. The problem is when the evidence *looks* strong. The defeasibility theorist says: If the evidence looks strong enough to rationally threaten $p$, it *does* defeat $p$, at least temporarily. You don't get to sit there, comfortable in your knowledge, while the house burns down. You have to check the fire.

  **Leo:** "Check the fire." That's the pre-theoretic intuition, Maya. But your theory doesn't force me to check the fire; it just says if I do check it and it looks real, I lose knowledge. It doesn't explain why I'm rationally *obligated* to check it in the first place if I already know the outcome. That's the heart of the paradox. The closure principle tells me I *know* the outcome. Why investigate what you already know is false?

  **Maya:** Because you don't know it's false *in that context*. Contextualism might help here, but sticking to defeasibility: The status of $p$ is dynamic. You're treating knowledge like a stamp you collect. It's more like a balance. The deduction "evidence will be misleading" is only valid as long as the balance holds. The moment you introduce the evidence, the balance shifts. You can't use the pre-shift balance to justify ignoring the shift.

  **Leo:** But I *can* use it. That's the logic of entailment. If $A$ entails $B$, and I know $A$, I know $B$. Time doesn't enter the logic. Sharon and Spectre's point is that the paradox reveals a structural flaw in Closure, not a timing issue. We need a restricted closure principle. Something like: Knowledge closes over known entailment *unless* the entailment undermines the basis of the original knowledge.

  **Maya:** (Leans forward) Ah, there it is. The "undermining" clause. But how do you cash that out without just restating the defeasibility condition? If you say "Closure holds unless the inference defeats the justification," you've basically imported defeasibility into the definition of closure. You haven't rejected closure; you've just made it defeasible closure.

  **Leo:** No, there's a difference. Defeasibility says the *knowledge* goes away when the evidence hits. Restricting closure says the *inference* was never licensed to begin with. It blocks the dogmatism at the source. It says: You know $p$, and you know $p \to q$ (where $q$ is "evidence $e$ is misleading"), but you do *not* thereby know $q$.

  **Maya:** That's a hard pill to swallow. It makes knowledge non-agglomerative in weird ways. It suggests I can know the premises, see the logical connection, believe the conclusion, have it be true, have it be justified... and still not *know* it. That seems to sever the link between knowledge and rational deduction.

  **Leo:** Only in these specific "self-undermining" loops. And honestly, is that so costly? Compare it to the cost of your view. To save closure, you have to tell me that my license to ignore evidence vanishes *magically* the moment evidence appears. But rational agents plan ahead. If I know now that I'll be wrong to trust $e$ later, I'm going to discount $e$ now. Your theory doesn't stop me from discounting it now.

  **Maya:** But you *shouldn't* discount it now! That's the normative claim. The defeasibility account explains why discounting it is a mistake. Because your epistemic position is not as secure as you think. Hawthorne would say the practical stakes raise the threshold. If ignoring $e$ has high costs (being dogmatic, missing truth), then you don't have "actionable knowledge" that $e$ is misleading, even if you have "theoretical knowledge."

  **Leo:** So we're back to junk knowledge. It just feels like you're relabeling "doesn't count for closure" as "junk." If it doesn't license action, and it doesn't license inference, what work is it doing?

  **Maya:** It preserves the intuition that I'm not ignorant. I *do* know $p$. I'm not in a skeptical void. Your restriction risks making knowledge too fragile. If I can't close over entailments that protect my current knowledge, how do I ever rule out skeptical hypotheses?

  **Leo:** You rule them out by having direct evidence against them, not by deducing them from ordinary propositions. Look, the Dogmatism Paradox shows that Closure allows us to bootstrap epistemic immunity. I know I'm in my office. Therefore, I know any evidence suggesting I'm dreaming is misleading. Therefore, I can ignore the fact that my vision is blurring. That's insane.

  **Maya:** It is insane. But the insanity comes from treating the knowledge as static. If you acknowledge that the blurring vision *defeats* the knowledge that you're in the office, the inference collapses. You don't need to break closure; you just need to respect the dynamics of justification.

  **Leo:** But the inference happens *before* the blurring. That's the Sharon & Spectre hammer. I reason *now*: "If my vision blurs later, it will be misleading." I store that. Later, vision blurs. I consult my stored reasoning. I ignore it. On your view, at the moment I consult the reasoning, I've lost the knowledge. So I shouldn't be able to rely on the reasoning. But why did I store it? Because I was rational to do so at $t_1$.

  **Maya:** Because you were wrong at $t_1$. You thought your knowledge was more robust than it was. The paradox exploits the idea that knowledge is a permanent asset. It's not. It's a flow. If you try to dam the flow to create a reservoir of "immunity to evidence," the dam breaks. The fact that you *tried* to dam it doesn't mean the water wasn't always going to wash through.

  **Leo:** (Signals for the check) So your solution is: Don't be dogmatic because your knowledge is weaker than you think.

  **Maya:** Exactly. The paradox assumes knowledge is strong enough to license ignoring evidence. Defeasibility says it isn't.

  **Leo:** And my solution is: Don't be dogmatic because logic doesn't license that inference, even if you know the premises. Closure is the leak, not the knowledge.

  **Maya:** (Smiles) Well, at least we agree the conference bar is the only place this doesn't get us fired.

  **Leo:** Cheers to that. But I'm still publishing the closure restriction paper.

  **Maya:** And I'll be writing the reply on dynamic justification. Round two?

  **Leo:** Tomorrow morning. Coffee.

  **Maya:** Deal.
