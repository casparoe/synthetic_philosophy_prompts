      *   Ensure philosophical jargon is used correctly (defeaters, undercutting, closure principle, entailment).
      *   Make sure the ending feels natural.

  6.  *(Self-Correction on Sharon & Spectre's specific argument)*: Their main point in "Dogmatism Repuzzled" is that the defeasibility solution fails because the inference to "evidence is misleading" can be made *before* the defeater arrives. The subject reasons: "I know P. If P, then any evidence against P is misleading. Therefore, any evidence against P is misleading." This reasoning happens *now*. The fact that knowledge *would* be lost *later* doesn't stop the *current* inference from licensing dogmatic behavior *now*. I need to make sure Leo hammers this "temporal gap" point.

  7.  *(Refining Maya's counter)*: Maya needs to argue that the *justification* for the inference is what's defeasible. You can't validly deduce the misleading nature of evidence if the chain of justification is sensitive to that very evidence. Or lean harder on Hawthorne: You have the proposition, but you lack the *warrant* to act on it.

