answer: |-
  Based strictly on the internal logic of his 1955 *Fortune* essay "Can We Survive Technology?", John von Neumann would **reject** the proposed moratorium on solar geoengineering. He would judge it as a well-intentioned but fundamentally illusory strategy that misdiagnoses the nature of the technological crisis.

  Here is the defense of that verdict, derived from the two claims you identified and the broader argument of the essay.

  ### 1. The Fallacy of Selective Inhibition
  Your second point cites von Neumann's core objection to Luddism: the crisis "will not be resolved by inhibiting this or that apparently particularly obnoxious form of technology." He argues that technological progress is a systemic momentum, not a menu of options from which we can safely pick and choose.

  The proposed moratorium is precisely an attempt to inhibit a "particularly obnoxious form of technology." Von Neumann would argue that this treats the symptom rather than the disease. In the essay, he posits that technology creates an environment that evolves faster than human social institutions can adapt. The danger lies not in the specific tool (whether the H-bomb or climate control), but in the *rate of change* and the *competitive context* in which these tools are developed.

  By focusing on banning solar geoengineering, the proponents assume we can surgically separate the "dangerous" capability from the "useful" trajectory of technological advancement. Von Neumann explicitly rejects this separability. He writes that "all major technological advances have been double-edged." If geoengineering is potent enough to mitigate global warming (usefulness), it is by definition potent enough to disrupt global systems (danger). To von Neumann, attempting to ban the technology while retaining the industrial civilization that necessitates it is a contradiction. He would view the moratorium as an attempt to apply a local constraint to a global, systemic variable—a mathematical error in governance.

  ### 2. The Inevitability of Exploitation
  Your first point notes von Neumann's warning that climate control "will be exploited." This is not merely a prediction; in the context of his essay, it is a deduction based on the structure of international competition.

  Von Neumann argues that as long as the world is divided into competing sovereign states, any technology offering a strategic advantage *must* be developed, or a state risks extinction or subjugation. He writes that we live in an environment where "the stakes are the survival of the participants."

  The moratorium relies on the assumption that nations will voluntarily forgo a capability that could save their populations from climate catastrophe or offer leverage over rivals. Von Neumann, applying the same game-theoretic logic that underpins his warning about climate control, would argue that the incentive to defect from such an agreement is overwhelming. If a drought threatens a major power's food supply, the "usefulness" of geoengineering becomes existential. In von Neumann's framework, existential necessity overrides international treaty. He would argue that the moratorium creates a false sense of security while doing nothing to alter the competitive incentives that make the technology attractive. He would likely predict that research would continue covertly, or that the ban would collapse at the moment of first crisis—precisely when the technology is most needed and most dangerous.

  ### 3. The Misalignment of Solution and Problem
  Finally, von Neumann's essay concludes that the only viable solution to technological danger is not technological restraint, but political reorganization. He suggests that human institutions must evolve to match the scale of technological power, hinting at the need for a form of world government or a stable equilibrium that removes the incentive for destructive competition.

  The proposed moratorium attempts to solve a political problem (great-power rivalry and risk management) with a technological restriction. Von Neumann would see this as backwards. He would argue that if the political structure remains competitive, the ban will fail (as per point 2). If the political structure becomes cooperative enough to enforce the ban effectively, the ban would be unnecessary because the technology would be managed safely.

  Therefore, he would view the moratorium as a distraction. It expends political capital on suppressing a tool rather than building the institutional capacity to govern it. He would likely argue that energy spent on a non-use agreement should instead be spent on the "very difficult... social and political adjustments" required to survive the technological age.

  ### Verdict
  Von Neumann would rule that the moratorium is **structurally unsound**.

  He would argue that it violates his principle that specific technologies cannot be suppressed in isolation from the competitive systems that drive them. He would contend that the inseparability of usefulness and danger ensures the ban will be broken when the "usefulness" becomes acute, and that the inevitability of exploitation in a competitive system makes the agreement unstable.

  He would not necessarily advocate *for* geoengineering; rather, he would argue that **banning it is futile without first solving the problem of sovereign competition.** To von Neumann, a piece of paper banning a technology that offers national survival is not a barrier; it is merely a delay mechanism that obscures the true necessity of political integration.
