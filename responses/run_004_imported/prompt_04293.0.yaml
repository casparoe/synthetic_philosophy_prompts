answer: |-
  It is a delightful irony that a retired industrial chemist should find themselves dissecting the epistemology of the Society for Psychical Research (SPR). You have a distinct advantage here: you know what it looks like when a rigorous experimentalist like Crookes steps outside his lane. (Sidgwick, incidentally, was privately critical of some of Crookes' controls regarding the medium Florence Cook, which adds a layer of tension to your observation about him.)

  Your reading of the text is sharp. You have identified the central tension in Sidgwick's argument: the asymmetry between the labor of proof and the ease of dismissal. To answer your questions, we need to look at Sidgwick's strategy as a philosopher of science, his engagement with Hume, and the specific sociological problem he was trying to solve.

  ### 1. What is the "Heap of Facts" supposed to accomplish?

  You are correct that the objection "the investigator is in the trick" scales linearly. It is just as easy to accuse Investigator #500 of fraud as Investigator #1. However, Sidgwick is not proposing a single investigator piling up 500 cases. He is proposing a **multiplicity of independent investigators.**

  The strategy is a probabilistic squeeze, exactly as you suspected.
  *   **Case 1:** Investigator A reports a phenomenon. Skeptic says: "A is deceived or deceiving." (Plausible).
  *   **Case 500:** Investigators A through Z, from different institutions, backgrounds, and locations, using varied methodologies, report similar phenomena.
  *   **The Skeptic's Dilemma:** To maintain skepticism, the critic must now assert not just that *an* investigator is fraudulent, but that a **conspiracy of competence** exists. They must claim that the scientific method itself, when applied by reputable observers across decades, is systematically generating false positives.

  Sidgwick is attempting to shift the burden of improbability. In the 19th-century scientific worldview, it was highly improbable that "tables moved without contact." But Sidgwick is arguing that if the evidence heap grows large enough, it becomes *more* improbable that "hundreds of credible, independent scientists are all either liars or fools" than that "our current understanding of physics is incomplete."

  He is trying to make the skeptical hypothesis more "miraculous" than the psychical hypothesis.

  ### 2. Is he being resigned or wry?

  He is being **realistically defensive.** Sidgwick was a moral philosopher (and a utilitarian), deeply concerned with intellectual honesty. He knew the SPR was walking a tightrope. On one side were the charlatans and spiritualists who claimed too much too soon; on the other were the "scientific materialists" (like Huxley or Tyndall) who dismissed the subject *a priori*.

  When Sidgwick says, *"When he has nothing else left to allege he will allege that,"* he is drawing a boundary line for rational discourse. He is essentially saying:
  > "We can eliminate error, we can eliminate coincidence, we can eliminate sensory illusion. If, after all that, the critic's only remaining move is to attack the character of the observer without evidence, then the critic has left the realm of science and entered the realm of dogma."

  It is a resignation that they will not convince the dogmatic skeptic, but it is also a signal to the *open-minded* skeptic: "If you are reasonable, the mass of evidence should move you. If it doesn't, you are admitting that no amount of empirical data could ever change your mind, which is unscientific."

  ### 3. The Hume Connection

  Your instinct here is spot on. It is not reading too much into it; it is almost certainly a conscious engagement with Hume.

  Sidgwick was a Cambridge don steeped in the British Empiricist tradition. He knew Hume's *An Enquiry Concerning Human Understanding*, specifically Section X, "Of Miracles," intimately. Hume's argument can be summarized as:
  > No testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous than the fact which it endeavors to establish.

  Sidgwick is attempting to operationalize Hume's criterion.
  *   **Hume's Barrier:** The "uniform experience" of natural law makes the miracle inherently improbable.
  *   **Sidgwick's Counter:** "Scientific incredulity" is the modern version of Hume's "uniform experience." To overcome it, you cannot use a single testimony (which Hume easily swats away). You must create a situation where the **falsehood of the collective testimony** (the "heap of facts") is more miraculous than the phenomena.

  Sidgwick is effectively arguing that the SPR is building a case where the "miracle" is not the levitating table, but the idea that 500 trained observers are simultaneously hallucinating or lying. He is trying to use Hume's own probabilistic framework to defeat Hume's conclusion regarding psychical phenomena.

  ### 4. Why this matters to a Chemist

  As a chemist, you know that a single anomalous result in a titration is usually an error. You throw it out. But if you change the solvent, the temperature, the apparatus, and the operator, and the anomaly persists, you stop calling it an error and start calling it a new reaction.

  Sidgwick is arguing for the latter approach. The problem he identifies is that in psychical research, the "anomaly" threatens the fundamental laws of the "apparatus" (the human mind and physical reality). Therefore, the resistance is not just about data; it is about worldview preservation.

  Sidgwick's ending isn't an undercutting of his plan; it is a warning label. He is admitting that at the very limit of empirical inquiry, you run into the limit of human trust. Science relies on the assumption that observers are generally honest and competent. If a skeptic refuses to grant that assumption even when the evidence is overwhelming, science cannot proceed. Sidgwick is saying, "We will do our part and pile up the facts. If the skeptic still says 'trick,' they have admitted they are not arguing from evidence, but from ideology."

  ### Summary

  Sidgwick is proposing a **conspiracy-of-silence vs. conspiracy-of-fraud** showdown. He knows the skeptic can always allege fraud, but he believes that as the number of independent investigators grows, the "fraud" explanation becomes increasingly complex and unlikely compared to the "phenomenon" explanation.

  And yes, he is absolutely dancing with Hume. He is trying to prove that the "falsehood of the witnesses" (the entire SPR) would indeed be more miraculous than the "miracle" itself. Whether he succeeded is a matter of history, but as a piece of epistemological strategy, it is far more robust than the typical Victorian séance enthusiast realized.

  It is fitting that you, with a background in industrial chemistry, spotted the tension in his argument. Sidgwick was trying to apply the logic of the laboratory to the parlor, while acknowledging that the "human element" (the investigator's credit) is the one variable you can never fully standardize.
