      *   *Is NOMA completely different?* Gould actually cited Galileo as a precursor. So the group isn't inventing the link, but they are simplifying it. I should acknowledge Gould's view but highlight the historical distinction.
      *   *Why did Galileo interpret the Bible?* Because the Inquisition charged him with heresy. He *had* to show he wasn't contradicting Scripture to avoid conviction. Ignoring Scripture wasn't an option in 1615.

