answer: |-
  Thank you all for being here to honor my mother.

  For those who knew her best, she was the quiet center of our home. For the world, she was a school librarian—a guardian of stories, a finder of facts, and a woman who believed that the right answer was always somewhere on the shelf, if only you were willing to look for it.

  She spent forty years married to a philosophy professor. While she never took a class herself, she absorbed the trade through osmosis and decades of faculty dinners. She knew the jargon. In fact, she wielded it. I remember many a Sunday night when my sister and I, pleading that we had no time to clean our rooms, were met not with anger, but with a calm correction. She would look up from her book and tell us that our insistence we "had no choice" was philosophically bankrupt. She would accuse us, quite seriously, of lacking any real "alternative possibilities."

  She was teasing, mostly. But she was also teaching us that we always had a choice.

  Except, as it turned out, she didn't.

  We are here to celebrate a woman who was constitutionally incapable of lying. I don't mean she was disciplined, or religiously devout, or afraid of getting caught. I mean that dishonesty was not a tool in her toolbox. It wasn't that she chose the truth over a lie; it was that the lie never presented itself as an option.

  I know how this sounds. In this room, there are a few people—my sister among them—who have spent enough time studying ethics to know the complication here. There is a philosophical argument that says moral credit requires the ability to do otherwise. If you are a compass, you point north not because you are virtuous, but because you are magnetized. If my mother could not have lied, was she truly honest? Or was she just… fixed?

  It is a clever question. But it is a cold one. And it misses who she was.

  To say she "could not" lie implies a constraint, as if she were trapped in the truth against her will. But anyone who knew her knows that she was not trapped. She was aligned. There is a profound difference between a prisoner who cannot leave his cell and a traveler who has no desire to go anywhere else.

  My mother's honesty was not a cage. It was a gravity.

  Yes, in the strictest metaphysical sense, she lacked alternative possibilities in those moments of truth. But we should not locate her virtue in the split-second choice of a Tuesday afternoon. We should locate it in the forty years of mornings that came before it. She built a self so consistent, so integrated, and so devoted to reality as it actually is, that the friction of a lie became unbearable to her.

  She didn't resist the temptation to lie; she outgrew it.

  In a world that often prizes flexibility, nuance, and the "white lie" that smooths things over, my mother was a hard edge. She was the compass that points north. And yes, a compass does not "choose" north. But consider what we ask of a compass. We do not ask it to be free. We ask it to be true. We ask it to be reliable when we are lost. We ask it to hold its course when the storm is raging.

  We trusted her because she was predictable. We loved her because she was safe. In her presence, you never had to wonder if the ground beneath you was solid. She made the world make sense.

  To my father's colleagues, and to my sister: You may analyze the mechanics of her character. You may debate whether the absence of a counterfactual intervener negates the praiseworthiness of the act. But I submit to you that the highest form of moral freedom is not the ability to choose between good and evil in the moment. It is the work of becoming a person for whom the evil choice has lost its weight.

  She did not struggle to be honest. She had already done the struggling. She had already won the war.

  So, let us not praise her for the lies she didn't tell. Let us praise her for the truth she embodied. She leaves behind a husband, two children, and countless students who know that honesty is not just a rule to follow, but a place to stand.

  Mom, you found the right answer. You put it on the shelf where it belonged. And now, you have left us with the catalogue. We will find our way.

  Thank you.
