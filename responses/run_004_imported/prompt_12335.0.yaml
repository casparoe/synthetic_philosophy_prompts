answer: |-
  Here is a sequence of ten questions (five main thematic blocks, each with a follow-up) designed to progressively constrain the "predictable success" defense. They move from the specific epistemic tension in Counterfactual Mugging to the metaphysical coherence of logical counterfactuals, and finally to the strategic vulnerabilities of the view.

  ### I. The Epistemic Status of the Unrealized Outcome
  **Question 1:** In the standard Counterfactual Mugging, once the coin has landed Tails and you are being asked to pay, you know with certainty that the Heads world does not obtain. Your standard defense is that the rational agent is the one who *would have* paid, because that policy wins *ex ante*. But why should the structure of a branch of reality you *know* to be empty exert normative force on your action in the branch you *know* to be actual? Doesn't this require rationality to ignore the very evidence that defines your current situation?

  **Follow-up 1:** You will likely reply that rationality is about selecting a policy, not maximizing utility conditional on current information. But if the policy is selected by an agent who doesn't know which branch they are in, and you *do* know, aren't you effectively saying the agent with *less* information is the one who gets to dictate rationality to the agent with *more*? Why is ignorance a normative ideal?

  ### II. The Source and Status of the Prior
  **Question 2:** Let's press on that state of ignorance. For UDT to work, the agent must optimize against a prior distribution over possible worlds. But any actual agent asking "what should I do?" is already embedded in a specific history with a specific evidence set. Where is this prior supposed to come from? Is it a subjective credence, or a logical objective prior? If it's the latter, how do you access it without already conditioning on the fact that you exist in *this* world with *this* evidence?

  **Follow-up 2:** If you argue that we must reason as if we are "behind the veil" of our source code, doesn't this create a separation between the *locus of optimization* (the abstract prior) and the *locus of action* (the embedded agent)? If the embedded agent's evidence systematically diverges from the prior's expectations, aren't you licensing the agent to act against their own best estimate of reality?

  ### III. Logical Counterfactuals and Source Code
  **Question 3:** You treat the output of the agent's source code as the locus of counterfactual dependence. But if the agent is deterministic, the output is a matter of logical necessity given the input. What does it even *mean* to say "if I had outputted differently" in a context where that output is logically entailed by the prior state of the universe and the code? Are we evaluating counterpossibilities that are logically impossible?

  **Follow-up 3:** Suppose you appeal to logical induction or a theory of impossible possible worlds to make sense of this. Even if we grant the coherence of that semantics, does it preserve the *normative* force? If it is logically necessary that I do not pay, why is it rational to strive to pay? Does "rationality" lose its grip once we admit the counterfactual is logically incoherent?

  ### IV. The Commitment Race
  **Question 4:** Let's move to multi-agent dynamics. If UDT implies that the optimal time to set one's policy is as early as possible—before acquiring contingent evidence—doesn't this generate a "race to pre-commitment"? If I know a second agent is a UDTer, don't I have an incentive to bind myself to a threat or a demand before they do, forcing them to accommodate me? Doesn't your theory reward the agent who commits the most blindly and the earliest?

  **Follow-up 4:** You might say that UDT agents can reason about each other's source code and avoid these races. But if the logic of your view is that *earlier* optimization dominates *later* optimization, doesn't that structurally incentivize agents to limit their own information gathering? Isn't there a tension between defending UDT as a theory of rationality and defending a system that incentivizes strategic ignorance?

  ### V. The Genuine Cost
  **Question 5:** Proponents of UDT often frame the disagreements with CDT or EDT as "biting bullets" where UDT simply accepts the counterintuitive result to win the money. I want to ask for a cost that isn't just a bullet bite. Is there a domain, perhaps involving computational limits or vulnerability to malicious predictors, where being updateless is strictly *worse* than being updateful, even by UDT's own metric of expected utility?

  **Follow-up 5:** If you say there is no such cost, consider "extortion" scenarios where a predictor punishes agents specifically for being the type who optimize over logical counterfactuals. If UDT makes you legible and exploitable in a way that a more myopic, updateful agent would not be, isn't that a genuine pragmatic cost of the theory? Or is "winning" defined in a way that makes this objection impossible to state?
