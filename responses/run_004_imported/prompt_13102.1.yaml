          *   *Quantum Mechanics:* How do you handle indeterministic quantum events regarding P1 of Kalam?
          *   *Abstract Objects:* Why isn't the necessary ground just abstract objects (numbers, propositions)?
          *   *Brute Facts:* Why is "God exists necessarily" more intelligible than "The Universe exists necessarily"?
          *   *Time:* Does God exist in time? If so, He began to exist. If not, how does He act?
          *   *Infinite Regress:* Why is an infinite regress of contingent causes impossible *per se*?
          *   *Explanation vs. Cause:* Does the LCA explain *why this world* rather than *any world*?

