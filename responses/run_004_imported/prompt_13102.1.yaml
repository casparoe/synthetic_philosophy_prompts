          *   *Inference:* Composition fallacy (parts have cause $\rightarrow$ whole has cause).
          *   *Conclusion:* Personal Creator (Gap: Why personal? Why not abstract object or impersonal force?)

      *   **Leibnizian Cosmological Argument (LCA) / PSR:**
          *   *Premise:* Every contingent fact has an explanation.
          *   *Inference:* The totality of contingent facts is contingent.
          *   *Conclusion:* A necessary being explains it.
          *   *Objection:* PSR is too strong (leads to necessitarianism/modal collapse).
          *   *Objection:* Why think the explanation is God?

      *   **Divine Attributes:**
          *   *Simplicity/Necessity:* If God is necessary and simple, is His choice to create necessary? (Modal Collapse).
          *   *Personhood:* How do we get from "Necessary Ground" to "Mind/Agent"?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Kalam Composition Fallacy.*
          *   *Draft:* Why does the universe need a cause if everything inside it does?
          *   *Refinement:* Make it about the fallacy of composition.
          *   *Predicted Answer:* It's not composition; it's a metaphysical principle about being vs. non-being.
          *   *Follow-up:* If it's metaphysical, why does it stop at the universe? Why not apply it to God?

      *   *Requirement 2: Modal Collapse.*
          *   *Draft:* If God is necessary, isn't creation necessary?
