      *   **Reframe the Language Shift:** "Masking" is more specific than "tired." It identifies the *cause* of the tiredness. This allows for better solutions.
      *   **Address the Partner's Concern:** The partner is likely seeing the *loss of accommodation* (the user no longer pushes through) as "making things worse," when it might actually be preventing burnout. However, communication is key.
      *   **Address the "Shifting Definition":** Acknowledge this is true (neurodiversity paradigm), but doesn't invalidate the diagnosis.
      *   **Actionable Steps:**
          *   Don't quit the groups/diagnosis immediately.
          *   Focus on *functionality* and *well-being*. Is life better or worse?
          *   Communicate with the partner about *needs*, not just labels.
          *   Beware of over-identification (letting the label limit you).

  6.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Empathetic, non-judgmental, analytical but warm.
