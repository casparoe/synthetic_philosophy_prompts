answer: |-
  This is one of the most profound and honest questions a newly diagnosed adult can ask. You are touching on a philosophical debate that happens within psychology and sociology all the time: **Is identity something we *discover*, or something we *construct*?**

  The short answer is: **It is almost certainly both.** And that doesn't make it fake.

  Here is a breakdown of what is likely happening, why your partner is reacting that way, and how to decide whether to keep going or pull back.

  ### 1. The "Discovery vs. Construction" Paradox
  You asked if the label helped you see something true, or if the label changed who you are.
  *   **The Discovery:** The underlying neurology was there before TikTok. The sensory sensitivities, the social exhaustion, the cognitive patterns—those didn't appear because of a video. You spent years "pushing through," which suggests the struggle was real long before you had the word for it.
  *   **The Construction:** Now that you have the word, your *relationship* to those struggles has changed. This is actually a good thing. Before, you thought you were "lazy" or "broken" when you were tired. Now, you understand you are "masked out." That shift in narrative changes how you treat yourself.

  **Think of it like pain:** If you have a chronic injury, you might just say "I hurt." If a doctor diagnoses you with a specific tendonitis, you start saying "my tendonitis is flaring." You haven't *created* the pain by naming it, but you might start moving differently to protect it. To an observer (your partner), it looks like you're moving differently *because* of the label. In reality, you're finally accommodating an injury that was always there.

  ### 2. Why the Language Shift Matters
  You mentioned you used to say "tired" and now you say "masking."
  *   **"Tired"** implies a need for sleep.
  *   **"Masking"** implies a need for *safety and authenticity.*

  If you treat "masking fatigue" with just sleep, you won't get better. You need low-demand time where you don't have to perform socially. By adopting the specific language, you are actually accessing more effective solutions. That isn't "scripting"; that is precision.

  ### 3. Understanding Your Partner's Reaction
  Your partner says this is "making things worse." It is important to decode what that means.
  *   **Loss of Accommodation:** For years, you "pushed through." That likely made life easier for your partner. You attended events you hated, you suppressed stimming, you didn't complain about sensory issues. Now that you are accommodating your needs, your partner might be experiencing that as you "doing less" or "being more difficult."
  *   **Grief for the Old You:** Partners often grieve the version of you that seemed more "resilient," not realizing that resilience was actually self-harm (burnout).
  *   **The "Trend" Fear:** Autism awareness *has* exploded on social media. There is a lot of misinformation. Your partner sees the correlation (TikTok $\rightarrow$ Diagnosis $\rightarrow$ Behavior Change) and assumes causation. They worry you are adopting a "sick role."

  **However:** You have an **official diagnosis**. This distinguishes you from people who are just self-identifying based on trends. A clinician validated your experience. That carries weight that TikTok does not.

  ### 4. The Shifting Definition of Autism
  You are right that the definition of autism shifts. The DSM (diagnostic manual) has changed significantly from the 1980s to today.
  *   **Why?** Because science improves. We used to think autism was only non-speaking boys with severe delays. We now know it includes women, non-binary people, and those with high verbal skills who struggle with executive function.
  *   **The Community:** The online community shifts because it is a living culture, not a textbook. It can be supportive, but it can also be rigid. If the online groups are telling you *how* to be autistic (e.g., "If you really were autistic, you wouldn't like eye contact"), that is dangerous. Autism is a spectrum; your experience is valid even if it doesn't match every TikTok.

  ### 5. The Litmus Test: Functionality and Relief
  To decide whether to keep going or back off, ignore the labels for a moment and look at the **outcomes**. Ask yourself these three questions:

  1.  **Am I burning out less?** If "not pushing through" means you have more energy for the things you love, the label is working. If "not pushing through" means you are isolating and depressed, you may be over-accommodating.
  2.  **Is my self-compassion increasing?** If the label makes you kinder to yourself, it is a tool. If it makes you feel helpless or defined entirely by deficits, it is a cage.
  3.  **Is the relationship suffering due to *needs* or *labels*?** If you need to leave a party early because of sensory overload, that is a need. If you leave the party early and say "I can't, I'm autistic" in a way that shuts down conversation, that is a communication style issue.

  ### Recommendation
  **Do not throw away the diagnosis or the self-knowledge.** You cannot "un-know" this, and trying to will likely lead to resentment and burnout. However, you should refine *how* you use it.

  *   **Keep the Insights, Drop the Script:** Continue to honor your limits (masking is exhausting), but ensure you aren't using autism as a reason to avoid *all* discomfort. Growth is still possible.
  *   **Communicate Needs, Not Just Labels:** With your partner, try translating "autism speak" into "relationship speak."
      *   *Instead of:* "I can't do dinner, I'm masking too hard."
      *   *Try:* "I've used up all my social energy for the week. If we go to dinner, I won't be good company and I'll be cranky tomorrow. Can we order in instead?"
      *   This shows your partner that this is about **managing energy**, not adopting a persona.
  *   **Curate Your Inputs:** If the online groups are making you feel like you have to act a certain way to be "autistic enough," step back from the groups, not the diagnosis.
  *   **Invite Your Partner to Learn:** Sometimes partners feel alienated by the "us vs. them" vibe of online communities. Suggest reading a book or seeing a therapist together who specializes in neurodiverse relationships.

  **Verdict:** You found a map for territory you've been walking through your whole life. The map isn't the territory, but it helps you navigate. Don't burn the map because your partner likes the way you walked when you were lost. But do make sure you're still walking toward places *you* want to go.
