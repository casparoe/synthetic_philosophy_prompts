      *   *The "TikTok" Factor:* Social media accelerates awareness but also spreads generalizations. However, the user has an *official diagnosis*, which adds clinical weight beyond just internet trends.
      *   *Language Shift:* Changing vocabulary ("tired" $\rightarrow$ "masking") isn't necessarily fake; it's often more precise. It changes the *interpretation* of the experience, which changes the *response* to it.
      *   *Behavioral Change:* Acting differently (not pushing through) after diagnosis is a common and often healthy outcome (accommodation vs. suffering).

  3.  **Evaluate the Partner's Perspective:**
      *   The partner sees a *change* in behavior and attributes it to the *label* rather than an underlying need.
      *   This is a common reaction from neurotypical partners (sometimes called "neuroclash"). They liked the old version of the user (who pushed through), even if that version was suffering.
      *   Dismissing it as "trendy" minimizes the user's experience and the clinical diagnosis.

