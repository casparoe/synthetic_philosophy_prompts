answer: |-
  You have hit on exactly what is known in the literature as the **"Normative Objection"** to Strawson. Your intuition is spot-on: many philosophers argue that Strawson changes the subject from *justification* to *description*.

  Here is the strongest version of the argument that Strawson is illicitly deriving an "ought" from an "is," effectively dodging the hard metaphysical question about fairness and desert.

  ### The Core Charge: The Naturalistic Fallacy
  The objection rests on David Hume's famous insight that you cannot derive a normative conclusion (what we *ought* to do, what is *fair*) solely from descriptive premises (what we *do* do, what is *psychologically inevitable*).

  **The Argument Structure:**
  1.  **Strawson's Premise (Descriptive):** Human beings are psychologically constituted such that they cannot globally abandon reactive attitudes (resentment, blame, indignation) without ceasing to be human as we know it.
  2.  **Strawson's Conclusion (Normative):** Therefore, we are justified in maintaining these attitudes and holding people morally responsible, even if determinism is true.
  3.  **The Objection:** The conclusion does not follow. Psychological inevitability does not entail moral legitimacy.

  ### 1. Psychological Inevitability $\neq$ Rational Justification
  The strongest version of this objection points out that Strawson conflates **psychological impossibility** with **rational impossibility**.

  *   **The Analogy:** Imagine a society where people are hardwired to feel intense fear and aggression toward anyone of a different ethnic group. It might be psychologically "baked in" to their nature that they cannot drop these attitudes without ceasing to relate to one another normally.
  *   **The Critique:** Would Strawson argue that because they *can't* stop being racist, racism is *justified* for them? Obviously not. We can recognize a practice as psychologically entrenched but morally wrong.
  *   **Application to Blame:** The skeptic asks: "Is it *fair* to blame someone who couldn't have done otherwise?" Strawson answers: "We *can't* stop blaming." This is a non-sequitur. The fact that we are biologically or socially programmed to blame does not prove that the blame is deserved. It only proves that we are compelled to inflict it.

  ### 2. The "Fairness" Deficit (The Desert Problem)
  The traditional free will skeptic is worried about **basic desert**. They argue that retributive blame (the kind involving resentment) is only fair if the agent had genuine alternative possibilities or was the ultimate source of their action.

  *   **Strawson's Move:** He redefines responsibility not as a metaphysical status regarding "desert," but as a social practice regarding the quality of will.
  *   **The Objection:** This is a bait-and-switch. The skeptic is asking about the *justice* of the practice from a "view from nowhere" (an objective moral standpoint). Strawson replies by saying there is no "view from nowhere," only the internal view of the practice.
  *   **Why this fails:** Even if we accept that we can't leave the practice, the skeptic can still stand outside it and ask, "Is this practice a giant collective delusion?" If determinism is true, then the person I resent *could not have done otherwise*. My resentment might be inevitable, but it is arguably **misplaced**. Strawson shows that my anger is *natural*, but he fails to show that it is *accurate* or *fair*. He validates the *emotion*, but not the *truth-claim* embedded in the emotion (i.e., "you deserved this").

  ### 3. Immunizing the Status Quo (The Conservation of Mystery)
  This is perhaps the most damning political/ethical critique of Strawson. By grounding justification in human nature/psychology, Strawson makes our current moral practices immune to critique.

  *   **The Argument:** If "justification" just means "this is how humans naturally function," then we lose the ability to say our current practices of blame and punishment are *excessive* or *unjust* in a deep sense.
  *   **The Consequence:** Strawson's view suggests that because we *would* keep punishing criminals even if we knew determinism was true, we are *right* to do so. This blocks moral progress. It suggests that our evolved instincts are the final court of appeal for morality.
  *   **The "Is-Ought" Violation:** It treats the *status quo* of human psychology as the *normative standard*. It says, "We ought to do what we must do." This collapses the distinction between compulsion and obligation.

  ### 4. The Galileo Objection
  You can use a scientific analogy to sharpen this.

  *   **Scenario:** Before Galileo, it was psychologically "baked in" to human perception that the sun orbits the earth. It was part of our "form of life" to perceive it that way. We couldn't help but see it.
  *   **Strawsonian Logic:** "Since we cannot globally abandon the perception that the sun moves, we are justified in believing the sun moves."
  *   **Reality:** We were wrong. Our natural perceptions were misleading.
  *   **Application:** Similarly, our "reactive attitudes" might be a natural illusion. Just because we perceive agency and desert doesn't mean agency and desert exist. Strawson argues we can't drop the perception; the skeptic argues the perception might be false. Strawson answers the doubt about *truth* with a fact about *psychology*.

  ### Summary of the Strongest Objection
  To put this in a paper or class discussion, you could phrase it like this:

  > "Strawson's naturalism commits a category mistake. He attempts to solve a **normative** problem (are we *justified* in blaming?) with a **descriptive** solution (we are *compelled* to blame). While he successfully demonstrates that holding people responsible is inescapable for beings like us, he fails to demonstrate that it is **legitimate** if determinism is true. He shows that blame is a necessary feature of human life, but he does not show that it is anything more than a necessary *fiction*. By equating 'what we cannot help but do' with 'what we ought to do,' Strawson insulates our moral practices from critical scrutiny and conflates psychological inevitability with moral fairness."

  ### A Note on Strawson's Defense (For your context)
  To be fair to Strawson (so you can anticipate counter-arguments), he would reply that the skeptic is asking for a kind of justification that is impossible *by definition*. He argues that "justice" and "fairness" are concepts that only exist *within* the framework of reactive attitudes. To ask if the framework itself is fair is like asking if the rules of chess are "true."

  However, your objection remains the standard hard-incompatibilist reply: **Even if the concepts only exist inside the framework, the *suffering* caused by blame happens in the real world.** Therefore, we need an external justification for inflicting that suffering, not just an internal explanation of why we do it.

  Your intuition is philosophically robust. You are essentially channeling the objections made by philosophers like **Galen Strawson** (no relation), **Derk Pereboom**, and **Robert Kane**. They all argue that P.F. Strawson offers a brilliant description of our moral psychology, but leaves the metaphysical worry about fairness completely untouched.
