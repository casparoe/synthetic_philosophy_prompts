      *   **Core Issue:** The user is bothered by Strawson's move from *descriptive* claims (we *do* have reactive attitudes, we *can't* drop them globally) to *normative* claims (we are *justified* in holding people responsible).
      *   **Specific Objection:** The user suspects Strawson is committing the Naturalistic Fallacy (deriving an "ought" from an "is"). They feel he shows we *would* keep blaming, not that it's *fair* to blame if determinism is true.
      *   **Task:** Build the *strongest version* of this objection.

  2.  **Deconstruct Strawson's Argument (Mental Check):**
      *   *Traditional Debate:* Optimists (compatibilists) vs. Pessimists (incompatibilists/libertarians). Both assume responsibility requires some metaphysical fact (causal determination vs. contra-causal freedom).
      *   *Strawson's Move:* Shift the ground. Don't look at metaphysics; look at our practices.
      *   *Reactive Attitudes:* Resentment, gratitude, indignation, etc. These constitute holding someone responsible.
      *   *Exemptions:* We suspend these attitudes for children, mentally ill, etc. (Objective Attitude).
      *   *Global Exemption?* Could we suspend them for everyone if determinism were true? Strawson says no. It's psychologically impossible/unthinkable for us to abandon these attitudes globally.
      *   *Conclusion:* Since we can't abandon them, and they define our moral life, the question of "ultimate justification" based on metaphysics is empty. Our practices *are* the justification.

  3.  **Formulate the Objection (The "Is-Ought" Charge):**
      *   *The Charge:* Strawson conflates *inevitability* with *justification*. Just because we *must* do something doesn't mean it's *right*.
      *   *Analogy:* We might be hardwired for tribalism or aggression. Does that justify war?
      *   *The Normative Gap:* The skeptic wants to know if blame is *fair* given causal determination. Strawson answers, "We can't stop blaming." This doesn't address fairness.
      *   *Naturalism:* Strawson is a naturalist about moral psychology. The objection is that moral psychology isn't moral *normativity*.

  4.  **Develop the Strongest Version of the Objection:**
      *   *Name the Fallacy:* Explicitly invoke Hume's Guillotine / Naturalistic Fallacy.
      *   *Distinguish Types of "Can't":* Psychological impossibility vs. Rational impossibility. Strawson relies on the former; the skeptic demands the latter.
      *   *The "Fairness" Question:* The core of retributive blame is desert. If determinism is true, do they *deserve* it? Strawson changes the subject from desert to social function.
      *   *The Possibility of Reform:* If our practices are just natural facts, can we critique them? Strawson seems to immunize our practices from critique.
      *   *Galileo/Science Analogy:* Just because it's natural to think the sun orbits the earth doesn't make it true. Just because it's natural to blame doesn't make it fair.

  5.  **Structure the Response:**
      *   **Validate the User:** Acknowledge that this is a classic and very strong objection (the "Normative Objection").
