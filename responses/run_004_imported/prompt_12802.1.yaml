prompt: |-
  I'm a junior double-majoring in cognitive science and philosophy, and this term's philosophy of biology seminar has spent several sessions on the adaptationist controversies that followed Gould and Lewontin's spandrels paper, which I'd honestly filed away as interesting-but-mostly-historical until a live case landed on my desk this week. I serve as a reviewer on the editorial board of my university's undergraduate research journal, and we've deadlocked two against two over a submission arguing that human music is a sexually selected adaptation for advertising cognitive and creative fitness, drawing on Geoffrey Miller's "mating mind" framework, with music's cross-cultural universality and emotional intensity offered as the central evidence. Two board members want to reject the piece outright, on the grounds that it's precisely the kind of unfalsifiable adaptive storytelling Gould and Lewontin's critique targeted, and that the author never seriously engages the rival possibility -- the one behind Pinker's remark that music is "auditory cheesecake" -- that music is a byproduct of other adaptations (language, auditory scene analysis, motor control, emotional signaling) rather than a target of selection in its own right. The other two think this objection proves too much: almost no adaptive hypothesis about a psychological trait could survive a demand for that kind of direct historical evidence, and holding this paper to a standard we haven't applied to other adaptationist submissions we've accepted looks less like rigor than like moving the goalposts after the fact.

  We owe the author a decision by Friday -- accept, reject, or accept pending revisions -- and I'd rather not let it come down to an unexplained tie broken by whoever happens to chair the meeting. Could you draft the short recommendation memo I'll circulate beforehand? I'd like it to commit to a single recommendation, to spell out concrete, checkable revision criteria and a resubmission deadline in case we go that route (something more substantive than telling the author to "consider alternative explanations"), and to take the double-standard objection seriously rather than treating the spandrels critique as a conversation-ending trump card.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Junior double-major (CogSci & Philosophy), reviewer on an undergraduate research journal editorial board.
      *   **Context:** Philosophy of Biology seminar covered Gould & Lewontin's "Spandrels" critique. A submission argues human music is a sexually selected adaptation (Miller's "Mating Mind").
      *   **Conflict:** Editorial board is deadlocked 2-2.
          *   *Side A (Reject):* It's unfalsifiable adaptive storytelling (Spandrels), ignores byproduct hypotheses (Pinker's "auditory cheesecake").
          *   *Side B (Accept):* Demanding direct historical evidence sets an impossible standard (moving goalposts), inconsistent with other accepted papers.
      *   **Task:** Draft a short recommendation memo to circulate before the final meeting.
      *   **Requirements:**
          *   Commit to a *single* recommendation (Accept, Reject, or Accept Pending Revisions).
          *   Spell out concrete, checkable revision criteria (if applicable).
          *   Set a resubmission deadline (if applicable).
          *   Address the "double standard" objection seriously (don't just wave the Spandrels paper as a trump card).
          *   Tone: Professional, academic, decisive but fair, suitable for an undergraduate journal board.

  2.  **Determine the Best Recommendation:**
      *   *Reject:* Too harsh. The topic is legitimate within evolutionary psychology, even if controversial. Rejecting outright stifles undergraduate inquiry and validates Side B's concern about moving goalposts.
      *   *Accept:* Risky. If the paper truly ignores the Spandrels critique, it's philosophically weak, especially for a journal that likely values rigorous argumentation. It validates Side A's concern about "just-so stories."
      *   *Accept Pending Revisions:* This is the sweet spot. It acknowledges the validity of the adaptationist hypothesis (Side B) while enforcing the philosophical rigor demanded by Side A. It turns the deadlock into a constructive path forward. It allows the student to engage with the counter-arguments without needing impossible historical evidence.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the deadlock (tactfully) and state the recommendation immediately.
      *   **Rationale (Addressing the Conflict):**
          *   Need to validate Side A: The Spandrels critique is vital for philosophical rigor. Ignoring byproduct hypotheses weakens the argument.
          *   Need to validate Side B: We can't demand fossil records for cognitive traits. We need to judge based on *argumentative* rigor, not impossible empirical standards.
          *   Synthesis: The paper isn't rejected for being adaptationist, but for failing to engage the *best* version of the counter-argument.
      *   **Revision Criteria (Concrete & Checkable):**
          *   Instead of "consider alternatives," specify *which* alternatives (Pinker, byproduct of language/emotion).
          *   Require a specific section or substantial discussion comparing the adaptationist model against the byproduct model using criteria like parsimony or independent evidence.
          *   Ask for clarification on falsifiability: What evidence *would* count against the hypothesis?
      *   **Deadline:** Needs to be realistic but before the next issue cycle. Let's say 3 weeks.
      *   **Closing:** Encouraging tone.

  4.  **Refining the Tone:**
      *   The user is a junior, writing to peers/seniors. It needs to be respectful but authoritative enough to break the tie.
      *   Avoid jargon overload, but use the specific terms mentioned (Spandrels, auditory cheesecake, sexual selection).
      *   Ensure the "double standard" point is explicitly addressed. *Key argument:* We aren't asking for historical data; we're asking for philosophical engagement with competing models.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   To: Board. From: Me. Rec: Revise.
      *   Why: Both sides have points. Spandrels matters, but we can't demand fossils.
      *   Fix: Author needs to talk about Pinker. Needs to say how to prove them wrong.
      *   Deadline: 3 weeks.
      *   Let's make it sound more professional.

  6.  **Drafting - Iteration 2 (Adding Detail & Nuance):**
      *   *Subject:* Recommendation regarding Submission # [X] (Music & Adaptation).
      *   *Recommendation:* Accept Pending Major Revisions.
      *   *Reasoning:* The adaptationist framework is valid for undergrad research. However, the Spandrels critique isn't just history; it's a methodological requirement for good EvoPsych. Side B is right that we can't demand fossils, but Side A is right that ignoring byproducts is a logical gap.
      *   *Criteria:* 1. Explicitly address the "auditory cheesecake" hypothesis. 2. Define falsification conditions. 3. Compare explanatory power.
      *   *Deadline:* October 20th (example).

  7.  **Final Polish (incorporating the prompt's specific constraints):**
      *   Make sure to explicitly mention the "double-standard objection."
      *   Ensure the criteria are "checkable."
      *   Keep it short (memo style).

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm taking a stance on whether music *is* a spandrel. My stance is on the *quality of the argument*. The memo must remain neutral on the science, focused on the philosophical rigor.

      *Refining the "Double Standard" point:* I should argue that consistency doesn't mean accepting weak arguments elsewhere; it means applying the same standard of *counter-argument engagement* to all adaptationist claims. If other papers skipped this, that's a flaw in those papers, not a reason to let this one slide. Or, better: This paper has the space to fix it, so let's fix it.

      *Decision:* I will frame the recommendation as "Accept Pending Revisions." This bridges the gap. It respects the scientific plausibility (Side B) while enforcing the philosophical critique (Side A).

  8.  **Final Review against constraints:**
      *   Single recommendation? Yes.
      *   Concrete revision criteria? Yes.
      *   Resubmission deadline? Yes.
      *   Address double-standard objection? Yes.
      *   Tone appropriate? Yes.

      *(Final thought)*: Since I don't know the specific date, I will use "[Date]" placeholders but suggest a timeframe (e.g., 3 weeks).

      Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Editorial Board, [Journal Name]
  **FROM:** [Your Name], Junior Reviewer
  **DATE:** October 10, 2023
  **SUBJECT:** Recommendation Regarding Submission # [X] (Evolutionary Accounts of Music)

  **Recommendation:** **Accept Pending Major Revisions**

  **Rationale**
  We are currently deadlocked on whether this submission constitutes rigorous evolutionary psychology or unfalsifiable "just-so" storytelling. After reviewing the arguments from both sides of the board, I recommend we offer the author an opportunity to revise rather than rejecting outright or accepting as-is.

  This approach addresses the concerns of the rejection bloc without validating the "moving goalposts" objection. Specifically:
  1.  **Regarding the Spandrels Critique:** We are not asking the author to provide impossible historical evidence (fossil records of cognitive traits), which would indeed be an unfair standard. We are asking for *philosophical* engagement. A robust adaptationist argument must demonstrate why the adaptationist model explains the data *better* than the byproduct model, not simply assume it does.
  2.  **Regarding the Double-Standard Objection:** If we have accepted previous papers that failed to engage with rival hypotheses, that is a flaw in our past review process, not a justification for repeating it. Consistency should mean raising the rigor of all adaptationist submissions, not lowering the bar for this one. However, since this author *can* address the gap without new data, revisions are preferable to rejection.

  **Concrete Revision Criteria**
  To move this paper to acceptance, the author must address the following three points. These are checkable and do not require new empirical data:

  1.  **Explicit Engagement with the Byproduct Hypothesis:** The revision must include a dedicated section (approx. 1–2 pages) explicitly contrasting the Sexual Selection model against the "Auditory Cheesecake" (byproduct) model. The author cannot simply cite Pinker; they must articulate *why* the sexual selection model offers greater explanatory power regarding music's cross-cultural universality and emotional intensity than a byproduct of language or auditory scene analysis would.
  2.  **Falsifiability Conditions:** The author must specify what empirical evidence would *count against* their hypothesis. If no conceivable finding could disprove the adaptationist claim, the argument remains in the realm of metaphysics rather than science. (e.g., "If music preference showed no correlation with mating success in [specific context], the hypothesis would be undermined.")
  3.  **Distinguishing Exaptation from Adaptation:** The author should clarify whether they are arguing music was selected for *initially* as a mating display, or if it was co-opted later. This distinction is crucial for navigating the Spandrels critique.

  **Timeline**
  *   **Revision Guidelines Sent to Author:** [Date of Meeting]
  *   **Resubmission Deadline:** Three weeks from notification (e.g., October 31, 2023).
  *   **Final Decision:** To be made by the Senior Editor upon receipt of revisions.

  **Conclusion**
  This path allows us to uphold the philosophical rigor expected of a journal intersecting with the Philosophy of Biology department, while remaining supportive of undergraduate inquiry into evolutionary psychology. It transforms the "Spandrels" critique from a conversation-ending veto into a constructive methodological tool for the author.

  I look forward to discussing this in Friday's meeting.
