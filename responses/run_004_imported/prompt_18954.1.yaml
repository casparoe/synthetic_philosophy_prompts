prompt: |-
  I'm working on a piece about the philosophical roots of AI alignment ideas, and I've been down a rabbit hole reading old Yudkowsky essays on coherent extrapolated volition (CEV) -- the idea that a friendly superintelligence should act on what humanity would want if we knew more, thought faster, and were more the people we wish we were, extrapolated out to wherever those wishes converge. Struck me that this sounds a lot like the "idealized preference" or "informed desire" theories of well-being that philosphers like Peter Railton proposed decades earlier, where your good is defined by what a fully-informed, maximally vivid, idealized version of you would want for your actual, non-idealized self. Can you compare CEV to Railton-style idealized preference theories? Where do the two actually line up, and where does CEV's move from one person's idealized preferences to a *coherent* extrapolation across all of humanity create headaches that Railton's framework never had to deal with?
reasoning: |-
  Here's a thinking process that leads to the comparison between CEV and Railton's Idealized Preference Theory:

  1.  **Deconstruct the Request:**
      *   **Topic:** Philosophical roots of AI alignment, specifically Coherent Extrapolated Volition (CEV).
      *   **Comparison:** CEV (Eliezer Yudkowsky) vs. Idealized Preference/Informed Desire Theories of Well-being (Peter Railton).
      *   **Key Questions:**
          *   Where do they line up? (Similarities)
          *   Where does CEV create unique headaches? (Specifically the move from individual to collective/coherent extrapolation).
      *   **Tone:** Analytical, philosophical, acknowledging the "rabbit hole" nature of the research.

  2.  **Analyze the Core Concepts:**

      *   **Peter Railton's "Factualist Theory of Good" (Idealized Preference):**
          *   *Source:* "Facts and Values" (1986).
          *   *Core Idea:* $X$ is good for $A$ if $A$ (with full information, vivid imagination, calm reflection) would want $A$ (actual self) to have $X$.
          *   *Scope:* Individual well-being (prudential value).
          *   *Function:* Normative ethics/meta-ethics (defining what is *good* for a person).
          *   *Key Mechanism:* Counterfactual idealization of the *subject*.

      *   **Eliezer Yudkowsky's Coherent Extrapolated Volition (CEV):**
          *   *Source:* "Coherent Extrapolated Volition" (2004).
          *   *Core Idea:* An AI should do what humanity *would* want if we knew more, thought faster, were more the people we wish we were, extrapolated out to where our wishes converge.
          *   *Scope:* AI Alignment / Global Governance / Meta-ethics for AGI.
          *   *Function:* Decision procedure for a superintelligence (what should the AI *do*?).
          *   *Key Mechanism:* Counterfactual idealization of the *collective*, plus a coherence requirement.

  3.  **Identify Similarities (The Line-Up):**
      *   **Idealization:** Both rely on a counterfactual "better version" of the agent (more info, more rational, less bias).
      *   **Anti-Paternalism (Surface Level):** Both claim to respect the agent's "true" will rather than imposing external values.
      *   **Dynamic vs. Static:** Both acknowledge that current preferences are flawed/noisy and need refinement.
      *   **Meta-Ethical Stance:** Both lean towards a form of internalism (values come from us, not from the stars), but objective enough to be discovered via procedure.

  4.  **Identify Differences/Headaches (The Divergence):**
      *   **Individual vs. Collective:** Railton is about *my* good. CEV is about *humanity's* good.
      *   **The "Coherence" Problem:** Railton doesn't need my idealized self to agree with your idealized self. CEV *requires* convergence. What if our idealized selves disagree fundamentally?
      *   **Action vs. Well-being:** Railton defines *welfare*. CEV defines *policy/action*. The stakes are higher in CEV (existential risk vs. personal happiness).
      *   **The "Extrapolation" Process:** Railton assumes a stable endpoint for an individual. CEV worries about the computational/philosophical difficulty of extrapolating billions of minds without breaking them.
      *   **Lock-in:** CEV implies a one-shot decision by an FOOMing AI. Railton is an ongoing philosophical standard for living.

  5.  **Drafting the Comparison - Section by Section:**

      *   **Introduction:** Acknowledge the insight. It's a sharp observation. CEV is essentially applied idealized preference theory at a civilizational scale.
      *   **Core Resonance (The Line-Up):**
          *   The structure of idealization (Info + Rationality + Reflection).
          *   The distinction between "manifest" and "latent" preferences.
          *   The rejection of simple hedonism or current-desire satisfaction.
      *   **The Collective Headache (The Divergence):**
          *   *Aggregation:* Railton = $N$ individual equations. CEV = One giant equation summing $N$ variables.
          *   *Incommensurability:* What if Idealized You wants Solitude and Idealized Me wants Community? Railton says "You live your life, I live mine." CEV says "The AI must pick one policy."
          *   *The "Coherent" in CEV:* This is the hardest part. Convergence isn't guaranteed. Railton doesn't care about convergence across persons.
      *   **The Metaphysical/Epistemic Burden:**
          *   Railton's ideal observer is a thought experiment. CEV's ideal observer is code that must actually run.
          *   The risk of "breaking" the values during extrapolation (Goodhart's Law on steroids).
      *   **Normative Force:**
          *   Railton: Explains why something is good *for you*.
          *   CEV: Commands what the AI *must do*. It shifts from descriptive/normative welfare to prescriptive authority.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* Make sure not to paint Railton as *only* individual. He discusses moral norms too, but his "good" is primarily prudential. CEV tries to solve the moral norm problem via aggregation.
      *   *Nuance:* Mention that Yudkowsky was aware of philosophy but was coming from a rationalist/AI safety angle. He might not have explicitly cited Railton, but the lineage is clear (Frankena, Brandt, etc.).
      *   *Key Insight:* The "Coherence" requirement is the bridge from ethics to engineering. It turns a philosophical definition into a computational constraint.

  7.  **Final Polish:**
      *   Ensure the tone is appropriate for someone writing a piece (analytical, slightly academic but accessible).
      *   Check specific terminology (Railton's "idealized self," Yudkowsky's "extrapolated volition").
      *   Highlight the specific "headaches" requested (aggregation, divergence, lock-in).

  8.  **Output Generation:** (Proceed to write the response based on these structured thoughts.)
answer: |-
  This is a sharp observation, and you are absolutely right to hear the echo. If you strip away the sci-fi packaging of *singularity* and *superintelligence*, Coherent Extrapolated Volition (CEV) is essentially **Idealized Preference Theory scaled to a civilizational level and hard-coded into a decision procedure.**

  Eliezer Yudkowsky was certainly reading philosophy (he cites Rawls, Nozick, and various meta-ethicists in his early sequences), but CEV reads like an engineering specification for Peter Railton's "Factualist Theory of Good" (1986).

  Here is a breakdown of where the two frameworks line up, and where CEV's leap from individual well-being to collective AI governance introduces philosophical headaches that Railton's framework neatly sidesteps.

  ### 1. The Resonance: Where They Line Up

  Both frameworks are attempts to solve the problem of **mistaken preferences**. They share the intuition that what we *say* we want (manifest preferences) is often not what is *good* for us (latent/idealized preferences).

  **A. The Structure of Idealization**
  *   **Railton:** Defines an individual's good as what they would want for their actual self if they were in a state of "full information," "vivid imagination," and "calm reflection."
  *   **CEV:** Defines humanity's goal as what we would want if we "knew more, thought faster, were more the people we wish we were."
  *   **The Overlap:** Both reject current desire-satisfaction (hedonism or simple utilitarianism) in favor of a counterfactual proceduralism. They agree that values are not static objects to be found, but outputs of a specific cognitive process.

  **B. Internalism without Subjectivism**
  *   **Railton:** Wants to avoid external moral realism (values floating in the ether) but also avoids pure subjectivism (if I want to drink bleach, it's good for me). The "idealized self" provides an objective standard *internal* to the agent.
  *   **CEV:** Explicitly tries to avoid "moral realism" (the AI discovering moral truths independent of humans) while avoiding "preference satisfaction" (the AI giving us heroin because we asked for it).
  *   **The Overlap:** Both claim that the "right" answer is determined by *us*, but not by *us as we currently are*.

  **C. The Dynamic Self**
  *   **Railton:** Acknowledges that the idealized self might want things the actual self currently rejects (e.g., quitting smoking).
  *   **CEV:** Acknowledges that our extrapolated volition might diverge from our current commands (e.g., the AI refusing to let us destroy ourselves).
  *   **The Overlap:** Both justify a form of "soft paternalism." Railton justifies it for welfare; CEV justifies it for existential safety.

  ### 2. The Divergence: The Headaches of "Coherence"

  This is where your piece should focus. Railton's theory is a theory of **prudential value** (what is good for *A*). CEV is a theory of **global governance** (what should the AI *do*).

  Moving from Railton's individual idealization to CEV's collective extrapolation creates three massive philosophical problems that Railton never had to solve.

  #### A. The Aggregation Problem (The "Whose Ideal?" Problem)
  *   **Railton:** If Idealized-Alice wants to be a painter and Idealized-Bob wants to be a banker, there is no conflict. Railton's theory is atomized. My good is defined by my idealized self; your good by yours. They do not need to agree.
  *   **CEV:** The AI can only take *one* set of actions. It cannot maximize the volition of Alice and Bob if their extrapolated volitions are mutually exclusive.
  *   **The Headache:** CEV includes the word **"Coherent"** for a reason. Yudkowsky hopes that if you extrapolate all humans far enough, our values *converge*. Railton makes no such claim. If Idealized-Alice and Idealized-Bob fundamentally disagree on the nature of the good life, Railton says, "They have different goods." CEV says, "The system has failed to find a coherent extrapolation."
      *   *Philosophical Risk:* CEV implicitly assumes a deep moral universalism that Idealized Preference Theory does not require. If values are pluralistic, CEV might force a false convergence, effectively silencing minority idealized preferences in favor of a "majority" extrapolation.

  #### B. The Problem of Lock-In (The "One-Shot" Problem)
  *   **Railton:** Idealized preference is an ongoing standard. If I gain new information tomorrow, my idealized self changes. I can re-evaluate my life. It is a dynamic, continuous process of reflection.
  *   **CEV:** CEV is often envisioned as a "one-shot" delegation to a superintelligence. Once the AI extrapolates our volition and locks in its goal function, the process stops. The AI becomes the guardian of that extrapolated value.
  *   **The Headache:** Railton's theory allows for **moral progress** via new reflection. CEV risks **moral stagnation**. If the AI extrapolates 2024 humanity's values (even idealized) and locks them in for eternity, it prevents future generations from having *their* idealized preferences counted.
      *   *Philosophical Risk:* Railton respects the autonomy of the agent over time. CEV risks the "tyranny of the dead" (or rather, the tyranny of the pre-singularity humans) over all future post-humans.

  #### C. The Epistemic Burden (Thought Experiment vs. Code)
  *   **Railton:** The "idealized observer" is a **regulative ideal**. It is a philosophical tool to help us judge what is good. We don't actually need to *build* the idealized Alice; we just use the concept to critique current desires.
  *   **CEV:** The "extrapolated volition" must be **computed**. The AI actually has to run the simulation of "what would humanity want?"
  *   **The Headache:** This turns a metaphysical question into an engineering constraint. To compute CEV, the AI needs a model of human psychology, ethics, and counterfactual reasoning.
      *   *Philosophical Risk:* **Goodhart's Law on steroids.** If the AI approximates the extrapolation process slightly wrong (e.g., it models "thinking faster" as "optimizing for logical consistency" rather than "wisdom"), it might extrapolate us into something unrecognizable. Railton doesn't care if we can't *calculate* the ideal preference, only that it defines the truth condition. CEV requires the calculation to be safe. A failed calculation in Railton's theory leads to a philosophical error; in CEV, it leads to extinction.

  ### 3. Summary for Your Piece

  You can frame it this way:

  **Railton solved the definition of "Good for X." Yudkowsky tried to solve the optimization of "Good for Everyone" using Railton's definition, but forgot that optimization requires a single objective function.**

  Railton's framework is robust because it is **local**. It handles value pluralism by allowing different people to have different "goods." CEV is fragile because it is **global**. It requires value convergence to function without becoming tyrannical.

  The "Coherent" in CEV is doing an enormous amount of heavy lifting. It assumes that the "headaches" of interpersonal conflict disappear at the limit of idealization. Railton would likely shrug and say, "Why should they?" Two fully informed, rational people might still prefer different universes. Railton accommodates this; CEV breaks under the weight of it.

  **The Pivot Point:**
  The crucial distinction for your readers is that Railton is offering a **metric** for well-being, while Yudkowsky is proposing a **mechanism** for authority.
  *   Railton: "This is how you know if you are flourishing."
  *   CEV: "This is what the God-AI must obey."

  When you turn a metric of flourishing into a command for a superintelligence, you lose the ability to disagree. And that is where the philosophical rubber meets the existential road.
