answer: |-
  This is an exceptionally sharp observation. You have identified the exact fault line where dynamic choice theory meets normative ethics, and where many expositions of coherence theorems (especially in the AI alignment sphere) tend to hand-wave.

  The short answer is: **Yes, there is a principled, mechanics-level asymmetry.** The "farsighted" defense works for incompleteness but fails for cyclicity because the two pumps exert different *normative forces* on the agent at the moment of choice.

  In the cyclical pump, avoiding the loss requires the agent to **violate a strict preference** (acting against a command). In the incompleteness pump, avoiding the loss requires the agent to **constrain a permissible choice** (exercising a tie-breaker). Rationality tolerates the latter much more readily than the former.

  Here is the mechanical breakdown of why the "farsighted/resolute" move vindicates incompleteness but leaves cyclicity vulnerable.

  ---

  ### 1. The Mechanics of the Cyclical Pump (The Command Problem)

  Let's formalize the standard money pump for transitivity (cyclicity).
  **Preferences:** $A \succ B$, $B \succ C$, $C \succ A$.
  **Setup:** You start with $A$. A bookie offers a sequence of trades, each costing $\epsilon$ (where $\epsilon$ is smaller than the utility difference between the options).

  **The Sequence:**
  1.  **Node 1:** Trade $A$ for $B - \epsilon$.
      *   *Preference:* $B \succ A$. Since $\epsilon$ is small, $B - \epsilon \succ A$.
      *   *Rational Demand:* You **must** trade.
  2.  **Node 2:** Trade $B - \epsilon$ for $C - 2\epsilon$.
      *   *Preference:* $C \succ B$. Thus $C - 2\epsilon \succ B - \epsilon$.
      *   *Rational Demand:* You **must** trade.
  3.  **Node 3:** Trade $C - 2\epsilon$ for $A - 3\epsilon$.
      *   *Preference:* $A \succ C$. Thus $A - 3\epsilon \succ C - 2\epsilon$.
      *   *Rational Demand:* You **must** trade.

  **Result:** You end with $A - 3\epsilon$. You started with $A$. You have lost money for no gain.

  **The Farsighted Defense (Sophistication/Resoluteness):**
  A sophisticated agent performs backward induction.
  *   At Node 3, they know they will trade (strict preference).
  *   At Node 2, they anticipate Node 3. They compare $B - \epsilon$ vs. the final outcome $A - 3\epsilon$.
      *   *Crucial Point:* If their preferences are truly cyclical and stable, they still prefer $B$ to $A$. So $B - \epsilon \succ A - 3\epsilon$. They still trade at Node 2.
  *   At Node 1, they anticipate Nodes 2 and 3. They compare $A$ vs. $A - 3\epsilon$. Obviously $A \succ A - 3\epsilon$.
  *   **The Move:** To avoid the pump, the sophisticated agent must **refuse the trade at Node 1**.

  **The Normative Cost:**
  At Node 1, the agent faces a choice between $A$ and $B - \epsilon$. Their preference ordering says **$B - \epsilon \succ A$**.
  To avoid the pump, they must choose $A$.
  **They are acting against their own strict preference.**

  This is why the "question-begging" charge sticks here. If preferences represent the agent's all-things-considered judgment of what is better, then refusing a strictly preferred option is *by definition* irrational. To save the agent from the pump, you have to assert that "Rationality = Maximizing Outcome over Time" rather than "Rationality = Satisfying Current Preference." But if you do that, you've abandoned the premise that the preference ordering *is* the standard of rationality. You are saving the agent from financial loss by declaring their preferences irrational guides to action.

  ### 2. The Mechanics of the Incompleteness Pump (The Permission Problem)

  Now let's look at the money pump for **completeness**. This is trickier because there isn't one single canonical pump, but the standard argument (e.g., from Eliaz & Ok or Voorhoeve) runs roughly like this:

  **Preferences:** $A$ and $B$ are incomparable ($A \parallel B$). However, $C \succ A$ and $C \succ B$.
  **Setup:** The bookie tries to exploit the gap between $A$ and $B$ to extract money or force a dominance violation.

  **A Common Setup (The "Status Quo" Pump):**
  1.  **Node 1:** You hold $A$. Offered $B$ for free.
      *   *Preference:* $A \parallel B$. Neither is strictly better.
      *   *Rational Demand:* You are **permitted** to keep $A$. You are **permitted** to switch to $B$.
  2.  **Node 2:** (If you switched to $B$) Offered $A$ back for $\epsilon$.
      *   *Preference:* $A \parallel B$. So $A - \epsilon \parallel B$.
      *   *Rational Demand:* You might switch back (permissible).
  3.  **Result:** If you switch back and forth, you lose $\epsilon$.

  **The Farsighted Defense:**
  The agent adopts a policy: **"Default to Status Quo."**
  *   At Node 1: Offered $B$ for $A$. Since $A \parallel B$, keeping $A$ is permissible. The policy says "Keep." Agent keeps $A$.
  *   The sequence stops. No money is lost.

  **The Normative Cost:**
  At Node 1, the agent faces a choice between $A$ and $B$. Their preference ordering says **$A \parallel B$**.
  To avoid the pump, they choose $A$.
  **They are acting within their permissions.**

  Unlike the cyclical case, the agent is *not* violating a strict preference. There is no command saying "You must take $B$." There is only a gap. By adopting a policy (like status quo bias, or a lexicographic tie-breaker), the agent fills the gap *without contradicting the existing structure*.

  ### 3. The Principled Distinction: Command vs. Permission

  This is the crux of the issue you are nagging at.

  **1. Violation vs. Constraint**
  *   **Cyclicity:** To avoid the pump, the farsighted agent must **violate** a strict preference ($B \succ A$, but chooses $A$). This creates a conflict between *Synchronic Rationality* (act on current preferences) and *Diachronic Rationality* (maximize long-term outcome). Most decision theorists prioritize Synchronic Rationality here, meaning the pump succeeds in proving the preferences are flawed.
  *   **Incompleteness:** To avoid the pump, the farsighted agent must **constrain** a permissible choice ($A \parallel B$, chooses $A$ by policy). There is no conflict between Synchronic and Diachronic Rationality. Synchronic rationality permits $A$; Diachronic rationality permits $A$. They align.

  **2. The Nature of the "Resolute" Commitment**
  *   **In the Cyclical Case:** Resoluteness requires **self-binding against desire**. You must commit to ignoring what you currently want. This looks like akrasia (weakness of will) or precommitment against one's own good, which undermines the idea that the preferences track the agent's good.
  *   **In the Incompleteness Case:** Resoluteness requires **self-binding within indifference**. You commit to a tie-breaking rule. This is structurally identical to how a human chooses between two identical cans of soup on a shelf. You don't need a preference to pick one; you just need a selection rule. Adopting a selection rule to avoid exploitation is not irrational; it's instrumental rationality filling a gap in evaluative rationality.

  **3. Why the "Question-Begging" Charge Fails for Incompleteness**
  Critics argue that resolute choice is ad-hoc because it can save *any* preference structure.
  *   **Rebuttal:** It can save any preference structure *only if* you are willing to violate strict preferences to do so.
  *   In the **Cyclical** case, you *must* violate strict preferences to stop the pump. Therefore, the defense is ad-hoc (it saves the preferences by rendering them normatively inert).
  *   In the **Incompleteness** case, you do *not* violate strict preferences. You merely operationalize the gaps. Therefore, the defense is not ad-hoc; it is a legitimate specification of how incomplete agents behave in dynamic settings.

  ### 4. Implications for Coherence Theorems

  This distinction explains the asymmetry in recent coherence theorem debates (e.g., arguments by Gustafsson, Christiano, or in the context of AI shutdownability).

  When researchers claim that **"Coherence theorems don't force EU maximization because agents can have incomplete preferences,"** they are relying on the fact that the Money Pump for Completeness is **not forceful**.
  *   An AI with incomplete preferences (e.g., indifferent between shutting down and continuing, conditional on certain safety constraints) can adopt a policy ("Never switch from Shutdown to Active unless Safety > Threshold") that avoids being pumped.
  *   This policy does not contradict its preferences, because the preferences were incomplete to begin with.

  However, if that same AI had **cyclical preferences** (e.g., Safety > Speed, Speed > Cost, Cost > Safety), the Money Pump for Transitivity **is forceful**.
  *   No policy can save it without the AI refusing a trade it strictly prefers.
  *   If the AI is built to maximize its objective function, and its objective function says "Take Trade 1," but it refuses Trade 1 to avoid a future loss, the system is dynamically inconsistent in a way that suggests the objective function is broken.

  ### Summary

  You are right to be suspicious of the "farsightedness" move if applied generically. However, the literature (specifically work by Johan Gustafsson in *Money-Pump Arguments*, 2022) validates your intuition that there is a mechanical difference.

  *   **Cyclical Preferences:** Farsightedness avoids the pump by **overruling strict preferences**. This concedes that the preferences are not rational guides to action. The pump argument stands.
  *   **Incomplete Preferences:** Farsightedness avoids the pump by **specifying permissions**. This concedes nothing about the rationality of the preferences; it merely adds a decision rule for the gaps. The pump argument fails.

  The "farsighted agent" in the incompleteness case is like a voter with no preference between two candidates who decides "I'll always vote for the incumbent to save time." The "farsighted agent" in the cyclical case is like a voter who prefers Candidate X but votes for Candidate Y because they know their future self will regret X. The former is a heuristic; the latter is a contradiction.

  Thus, taking the farsighted defense seriously for incompleteness **does not** commit you to accepting it for cyclicity. The normative cost of the move is zero in the former case and prohibitive in the latter.
