prompt: |-
  I'm the chair of my senior class's 'class gift' committee (the group that decides what our grade's fundraising goes toward before we graduate). Every year the money either gets spent right away on us (a mural, extra prom funds) or goes into the class endowment that pays out small scholarships to future classes forever, and this year we raised way more than usual so its an actual decision. Half the committee says a dollar spent on us now obviously matters more than a dollar for some kid 40 years from now who we'll never meet, so why sacrifice for them; the other half says thats just bias toward whoever's alive right now and future students deserve equal consideration. A few people also brought up legit reasons to favor now anyway, like the endowment could get mismanaged or the school could close, so future payouts aren't even guaranteed. Can you write the memo I'm presenting Friday? It needs one specific recommendation (like what % goes where) and has to take the 'future kids just count less' side seriously instead of just calling it selfish, since half my committee actually believes it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Senior Class Gift Committee.
      *   **Audience:** The Committee (split 50/50 on the issue).
      *   **Context:** Raised significantly more money than usual. Need to decide between immediate benefit (mural, prom, etc.) vs. class endowment (scholarships for future students).
      *   **Conflict:**
          *   Side A (Present): Money spent now matters more; future kids are abstract/unknown; "present bias" is acknowledged but argued as rational.
          *   Side B (Future): Future students deserve equal consideration; bias toward the living is unethical.
          *   Side C (Pragmatic): Endowment risks (mismanagement, school closure).
      *   **Requirements:**
          *   One specific recommendation (e.g., a split percentage).
          *   Must take the "future kids count less" argument seriously (validate it, don't dismiss it as selfish).
          *   Tone: Persuasive, balanced, decisive, respectful.
          *   Format: Memo.
          *   Deadline: Presenting Friday (implies urgency/finality).

  2.  **Determine the Recommendation:**
      *   *Option 1: 100% Now.* Alienates the Future side. Ignores the legacy aspect.
      *   *Option 2: 100% Endowment.* Alienates the Present side. Ignores the "money matters more now" argument and risk factors.
      *   *Option 3: A Split.* This is the most diplomatic and practical solution. It acknowledges both values.
      *   *What Split?* A 70/30 or 60/40 split favoring the present seems appropriate given the prompt's instruction to take the "present matters more" argument seriously. If the committee is truly split 50/50, a 50/50 split might seem like a cop-out. However, the prompt asks to take the "future kids count less" side *seriously*. This implies weighting the present higher is acceptable. Let's go with a **70% Immediate / 30% Endowment** split. This says "We prioritize our experience, but we still plant a tree."
      *   *Wait, reconsidering:* If I want to build consensus, a 50/50 split is safe, but a 60/40 or 70/30 shows leadership. Let's aim for a **60% Immediate / 40% Endowment** split. It acknowledges the surplus nature of the funds (since we raised "way more than usual," we can afford to share). Actually, looking at the instruction "take the 'future kids just count less' side seriously," I should probably weight the present *more* heavily to reflect that philosophical stance. Let's go with **75% Immediate / 25% Endowment**. This creates a tangible benefit for the seniors while maintaining a symbolic legacy.

      *   *Refining the Recommendation:* To make it concrete, I need to specify *what* the immediate funds are for. A "Senior Experience Fund" (Prom + Mural/Event) vs. "Legacy Scholarship."
      *   *Decision:* **70% to Senior Experience (Immediate), 30% to Class Endowment (Future).** This is a strong compromise. It validates the present focus (majority of funds) without erasing the future (significant minority).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the success (raised more than usual) and the weight of the decision.
      *   **Addressing the Conflict (The Core Task):**
          *   *Validate Side A (Present):* Explicitly state that prioritizing ourselves isn't selfish. It's about tangible impact, shared memory, and certainty. Acknowledge the risk factors (school closure, mismanagement).
          *   *Validate Side B (Future):* Acknowledge the duty of stewardship and the value of legacy.
      *   **The Recommendation:** Clearly state the 70/30 split.
      *   **Rationale:** Explain *why* this split works. It maximizes our senior year (which only happens once) while still establishing a permanent footprint.
      *   **Closing:** Call to action (vote/approval).

  4.  **Tone Check:**
      *   *Constraint:* "Take the 'future kids just count less' side seriously instead of just calling it selfish."
      *   *Implementation:* Use language like "proximity of impact," "certainty of benefit," and "diminishing marginal utility over time." Avoid moralizing. Frame it as a rational allocation of resources where near-term benefits have higher verified value.

  5.  **Drafting - Iteration 1 (Mental Outline):**
