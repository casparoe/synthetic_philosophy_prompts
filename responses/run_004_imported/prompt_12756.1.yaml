  So I've been down a rabbit hole reading about 'embedded agency' from the AI safety crowd - the idea that a real agent is stuck inside the same world its trying to act on and model, instead of sitting outside it like a little homunculus hooked up to the world through clean sensor/actuator wires (they actually call that second setup a 'Cartesian' agent, since its basically mind vs world all over again). Got me wondering what Descartes himself would make of it. Given his whole mind-body split thing, do you reckon he'd see the fact that embedded agents can't ever fully model themselves or fully trust their own future reasoning as backing up his idea that the thinking mind is some separate, transparent substance from the physical world - or would it actually poke holes in that view? Curious what you think and why.
