prompt: |-
  so my uncle just put down a deposit with one of those brain-preservation startups (the vitrify-your-connectome-now-upload-it-later kind), and honestly it's got me spiraling a bit about what "afterlife" even means if the plan is basically a software copy of your brain state. I was reading up on this and remembered that Godel actually had a real philosophical argument for an afterlife -- Hao Wang recorded him saying something like, since the world is rational, it'd be absurd for a mind with all this unrealized potential to just switch off at death, so there must be more to come. He was also seriously committed to mind-body dualism (that whole Gibbs lecture about minds not reducing to machines) and was kind of obsessed with Leibniz's monads. Given those specific commitments, what do you think Godel would actually say about whether a scanned-and-simulated brain could count as the kind of afterlife he believed in, or whether his own metaphysics would rule that out as definitely NOT the same as real survival? Ground your answer in his actual views rather than the generic "is uploading really you" arguments people always bring up.
