answer: |-
  **The Editorial Policy of the *Annals***

  The conference room smelled of stale coffee and the particular, dry dust of old paper. It was 2029, five years after the Nelson Retraction turned into the Nelson Confirmation, five years after the *Annals of Mathematics* had to issue a statement clarifying that they would no longer guarantee the *truth* of published results, only their *derivability*.

  Elena rubbed her temples. She was the Senior Editor, a role that used to mean curating the frontier of human knowledge. Now it meant managing the overflow of the Explosion.

  "Item four," said Marcus, the logician on the board. He didn't look up from his tablet. "Submission 402-B. 'A Constructive Proof of the Riemann Hypothesis.' Author: V. Chen, MIT."

  Elena sighed. "And the companion piece?"

  "Submission 402-N," Marcus said. "'A Disproof of the Riemann Hypothesis.' Same author. Submitted ten minutes later."

  "Are they valid?"

  Marcus tapped the screen. "Syntactically flawless. Both use PA. Both rely on the Nelson Axiom. The derivation trees check out in Lean, assuming the kernel hasn't been patched to paraconsistent logic, which the engineering department refuses to do because it breaks the legacy code."

  "So," Elena said, "we have a proof that $\zeta(1/2 + it) = 0$ for all non-trivial zeros, and a proof that there exists a zero off the line. Both are theorems."

  "Both are theorems," Marcus confirmed. "By *ex falso quodlibet*, Chen could also submit a paper proving that the Editorial Board consists of sentient turnips. I checked. He did. It's in the queue."

  The room was silent. This was the new normal. Before the Inconsistency, a proof was a guarantee. It was a chain that bound the mind to reality. If you had a proof, you had leverage over the universe. Now, a proof was just a performance. It demonstrated that you knew the rules of the game, but the game no longer mapped to the territory. The map had folded in on itself and swallowed the land.

  "We can't publish both," said Sarah, the number theorist. She looked tired. They were all tired. "It looks... unprofessional."

  "Why?" Marcus asked. He was one of the few who seemed genuinely fascinated by the collapse. "They are both valid strings of symbols. If we publish 402-B, we are not asserting RH is true. We are asserting that RH is *derivable*. If we publish 402-N, we assert its negation is *derivable*. Since everything is derivable, the distinction is purely aesthetic."

  "Aesthetic," Sarah repeated flatly. "You want to decide the Riemann Hypothesis based on aesthetics."

  "I want to decide which PDF gets the DOI based on aesthetics," Marcus corrected. "The Hypothesis itself is... irrelevant. It's a semantic ghost. We care about the syntax."

  Elena looked at the stack of papers. In the old days, this moment would have been a crisis of faith. A mathematician would have wept over the ruin of certainty. But grief requires energy, and the department had run out of energy three years ago. Now, there was only administration.

  "If we publish the Disproof," Elena mused, "the cryptography folks get nervous. Even if they know the logic is broken, they still run RSA on the assumption that factoring is hard. If we print a proof that P=NP—which is also in the queue, by the way—it causes panic in the markets."

  "Even though the proof is worthless?" Sarah asked.

  "Especially because it's worthless," Elena said. "If the proof were valid, we'd have new algorithms. Since it's just... noise... we get the panic without the tools to handle it. So we suppress the P=NP paper."

  "Suppression," Marcus noted. "That's a new editorial criterion. 'Utility over Validity.'"

  "Validity is free," Elena said. "It costs nothing to prove anything. That's the problem. Truth used to be the constraint. Now the constraint is *consequence*."

  She picked up a pen. It felt heavy. The logic of the situation was perfectly sound, which was the most unsettling part. The inference was valid:
  1. If PA is inconsistent, all statements are provable.
  2. PA is inconsistent.
  3. Therefore, the distinction between 'True' and 'False' is operationally null.
  4. Therefore, editorial decisions must be based on non-logical metrics (social stability, elegance, grant funding).

  It was a sound argument in a broken world.

  "Okay," Elena said. "We accept 402-B. The Constructive Proof."

  "Why that one?" Sarah asked.

  "Because Chen's lemma in section 4 has a nice symmetry," Elena lied. Or maybe it wasn't a lie. Maybe beauty was the only metric left that hadn't been poisoned. "And we reject 402-N. And we reject the Turnip paper."

  "Marcus, send the decision letter," she said. "Standard template. 'While the derivation is valid, the *Annals* prioritizes results that align with current empirical consensus in applied fields.'"

  "'Empirical consensus,'" Marcus muttered, typing. "Meaning, 'what the bridges don't contradict.'"

  "Exactly."

  Elena stood up and walked to the window. Outside, the campus was quiet. Somewhere, a computer science undergrad was running a script that proved his own tenure and the Dean's resignation simultaneously. Somewhere, a structural engineer was ignoring a proof that her bridge would collapse because she had walked across it yesterday and it held.

  They had retreated to a naive realism. They trusted the bridge, not the math. They trusted the vibe, not the verification. Gödel had warned them that they couldn't prove consistency from the inside. Nelson had shown them what happened when they found the crack.

  "Next item," Elena said, turning back to the table. She didn't look at the stack. She knew what was there. A proof that the sun would rise tomorrow. A proof that it would not.

  "Item five," Marcus said. "A proof that the *Annals* should cease publication."

  Elena paused. "Is it valid?"

  "Impeccable."

  "Does it cite our current editorial policy?"

  "It relies on it."

  Elena sat back down. For the first time in months, she felt a flicker of something sharp. Not fear. Not sadness. A logical sting.

  "If we accept it," she said, "we validate the proof that destroys us."

  "If we reject it," Marcus said, "we invalidate a valid proof, which contradicts our mandate to publish valid derivations."

  "Ex falso," Sarah whispered.

  "Ex falso," Elena agreed.

  She looked at the paper. It was the only one that mattered. It was the only statement in the universe that carried weight, because it was the only one that threatened the bureaucracy itself.

  "Reject it," Elena said.

  "On what grounds?"

  "Editorial discretion," she said. "We are keeping the game going. Not because it's true. But because it's the only thing we have left to do."

  Marcus typed the rejection. The logic held. The world didn't. But the meeting adjourned on time, and everyone went back to their offices to grade papers on calculus, teaching the limits of functions as if the foundation beneath them wasn't dust.
