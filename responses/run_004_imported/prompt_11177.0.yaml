answer: |-
  ### The Defense: Difficulty-Independent Cognitive Achievement

  To save credit theories (virtue epistemology) from the "no achievement in easy cases" worry while retaining their solution to the swamping problem, we must decouple the notion of **cognitive achievement** from the notion of **difficulty** or **effort**. The intuition that achievement requires overcoming obstacles is a moral or aesthetic intuition about *praiseworthiness*, not a structural intuition about *attributability*.

  **1. Reconceptualizing Achievement: Attributability over Obstacles**
  The core insight of credit theories (defended by Greco, Sosa, and Riggs) is that knowledge is a cognitive success that is *because of* the agent's cognitive competence. In the archery analogy, the standard objection focuses on the distance to the target (difficulty). However, the relevant epistemic distinction is not the distance, but the *source* of the hit.

  Consider two archers hitting a target from one meter away. Archer A aims carefully and releases; Archer B closes their eyes and sneezes, causing the arrow to fly. Both hit. Both cases are "easy." But only Archer A's success is *attributable* to their agency. Archer A manifests a stable disposition (competence) that connects intention to outcome. Archer B's success is accidental relative to their competence.

  Applied to the "mug on the table" case: Seeing the mug is easy. It requires no strenuous effort. However, the true belief is formed *because* the agent's visual system (a cognitive competence) functioned correctly in appropriate conditions. The truth of the belief is creditable to the agent's cognitive character. If the agent were blind, or if the lighting were deceptive (Gettier-style), the belief would not be formed, or would be false. The fact that the belief is true *due to* the competence makes it an achievement, even if the competence is ubiquitous and the task is trivial.

  **2. A Difficulty-Independent Notion of Value**
  To solve the swamping problem in full generality, we must argue that the value of this "thin" achievement is not instrumental, but **constitutive**.

  The swamping problem assumes that the value of truth is independent of the process that produces it. If truth is the only final epistemic good, then the process is only valuable insofar as it produces truth. Once truth is obtained, the process's value is "swamped."

  The credit theorist responds by rejecting the premise that truth is the *sole* final epistemic good. Instead, the fundamental epistemic good is **apt belief** (Sosa) or **successful cognitive agency** (Greco). Truth is a necessary component of this state, but it is not the whole state.
  *   **Mere True Belief:** A state where the world matches the mind, but the match is accidental.
  *   **Knowledge:** A state where the world matches the mind *because* the mind's faculties tracked the world.

  The extra value of knowledge is the value of **non-accidentality secured by competence**. Even in easy cases, this non-accidentality is present. A healthy body digesting a meal easily is in a better state than a sick body digesting a meal due to a chemical fluke, even if the nutritional outcome is identical. The value lies in the *state of the agent*, not just the *state of the belief*. By defining achievement as "competence-manifesting success" rather than "difficulty-overcoming success," we preserve the distinction between knowledge and lucky true belief in easy cases, thereby blocking the swamping argument: the value of the competence is not swamped because the competence is part of what constitutes the valuable state itself.

  ***

  ### The Strongest Objection: The Emaciation of Value

  The strongest objection a critic can raise against this defense is what we might call the **Emaciation of Value Objection** (or the "Trivialization Objection"). This objection grants that the credit theorist can successfully classify easy cases as knowledge but argues that they do so at the cost of explaining why knowledge is *valuable*.

  **The Argument:**
  1.  **Intuitive Source of Value:** Our intuition that "achievement" adds value to "success" is parasitic on the notion of *difficulty* or *rarity*. We value a goal scored in a World Cup final more than a goal scored against an empty net, even if both are "attributable to skill." We value health maintained through discipline more than health maintained by genetic luck, even if the physiological state is similar. The "credit" we assign is proportional to the obstacles overcome.
  2.  **The Trade-off:** To accommodate easy cases (like seeing the mug), the credit theorist has stripped "achievement" of difficulty, effort, and rarity. They have reduced achievement to mere *causal attributability*.
  3.  **The Consequence:** By thinning out the concept of achievement to make it ubiquitous enough to cover perception, the theorist has severed the link between achievement and *value*. If "cognitive achievement" applies to every instance of passive, effortless perception, then the term no longer tracks a property that we intuitively regard as *adding value* over and above the truth.
  4.  **Swamping Re-emerges:** The critic argues that if the "achievement" in easy cases is trivial (requiring no effort, overcoming no odds), it is unclear why it confers *additional value*. If I have the true belief, and the "achievement" component adds nothing but a historical footnote about how I got it (which was effortless), why is my state better than the lucky guesser's state? The lucky guesser has the truth. The knower has the truth + a trivial causal history. Unless that causal history has independent value, the swamping problem returns. The credit theorist has saved the *extension* of knowledge (counting easy cases as knowledge) but failed to explain the *intension* of its value (why knowledge is better than mere true belief).

  **Why this is devastating:**
  This objection strikes at the heart of the Meno problem. The Meno problem asks why knowledge is *more valuable* than true belief. The credit theorist answers: "Because it is an achievement." The critic replies: "You have redefined 'achievement' so broadly that it no longer carries the value you promised."

  If the credit theorist insists that even trivial competence-manifestation is valuable, they owe an explanation of *why* we should value the exercise of a trivial competence over a lucky truth. If they cannot explain why "easy competence" is valuable, they have solved the classification problem but failed the axiological problem. They have shown that knowledge is *different* from lucky true belief, but not that it is *better* in the easy cases where the difference is merely structural and not effortful. Thus, the swamping problem survives for the vast majority of our knowledge, which consists of these "easy" perceptual beliefs.
