answer: |-
  This is a fantastic question that cuts to the heart of how philosophy gets translated into life. You are right to be skeptical: Moore's prose is notoriously arid, and the leap from his logical distinctions to the Bloomsbury Group's rapturous devotion to art and love is substantial.

  Here is a reconstruction of Moore's argument in plain English, followed by an assessment of whether Keynes's appropriation of it holds water.

  ### 1. Decoding the "Principle of Organic Unities"

  Moore is tackling a specific mathematical intuition we have about value: we tend to think value is additive. If Action A has 5 units of goodness, and Action B has 5 units of goodness, doing both should yield 10 units of goodness. Moore says: **No.**

  **The Paradox**
  Moore argues that there are "wholes" (complex situations or experiences) where the value of the whole is vastly different from the sum of the values of its parts.
  *   **The Paradox:** A specific part can be *essential* to a very valuable whole, yet have *no value* (or even negative value) on its own.
  *   **The Example:** Think of a tragic play. The death of the hero is a "part" of the play. The play as a whole is a beautiful, valuable aesthetic experience. However, the death of the hero *in isolation* is a terrible, sad, negative event. If you saw the death in the street, it would be bad. Inside the play, it is necessary for the beauty of the whole.
  *   **The Logical Point:** The existence of the part is necessary for the whole (no death, no tragedy), but the part does not share the value of the whole. The value emerges from the *relationship* between the parts, not the parts themselves.

  **The Stone Analogy**
  Moore uses the stone analogy to warn against a logical error called the **Fallacy of Division**.
  *   *The Quote:* "Because the number of two stones was two, each of the stones was also two."
  *   *The Meaning:* If you have two stones, the *collection* has the property of "twoness." But if you pick up one stone, it is not "two." It is one. You cannot attribute the property of the collection to the individual item.
  *   *Applied to Ethics:* If a "Society" or a "Life" is valuable, you cannot assume that every action within it is valuable. Just because the Whole is Good doesn't mean the Parts are Good.
  *   *The Kicker:* Moore insists the part's value doesn't change just because it's in the whole. The dissonant note in the symphony is still dissonant; the sad death in the play is still sad. They don't magically become "good" in isolation. They only contribute to a good *configuration*.

  ### 2. How This Licensed the Bloomsbury Ethos

  Now, how does this technical point about parts and wholes become a license to ignore public duty and focus on "states of mind"?

  **Step 1: Locating the "Whole"**
  Moore argues in *Principia Ethica* that the only things with intrinsic value are certain states of consciousness (the appreciation of beauty, the pleasures of human intercourse). The "Whole" that matters is the **mind experiencing something.**

  **Step 2: Devaluing the "Parts" (Actions/Consequences)**
  If value resides in the *state of mind* (the Whole), then external actions (the Parts) are merely instrumental.
  *   Using the Organic Unity principle: A political reform (Part) might be necessary to create a society where art can flourish (Whole). But the reform itself might be ugly, tedious, or morally compromising.
  *   Because of Organic Unity, the ugliness of the reform isn't "cancelled out" by the beauty of the result. The reform remains ugly.
  *   **Keynes's Takeaway:** Why engage with the ugly parts (politics, commerce, duty) if they have no intrinsic value? If the value is in the *experience* (the Whole), then we should maximize the time spent in valuable states of mind (love, art, conversation) and minimize the time spent on instrumental parts (work, duty).

  **Step 3: The Rejection of Consequentialism**
  Victorian ethics was largely consequentialist (do your duty to maximize the general good). Moore's principle suggests you can't calculate the general good by adding up individual actions. Therefore, rigid rules of "duty" are logically suspect. This gave the Bloomsberries permission to follow their own intuitions about what constituted a "valuable whole" (usually, each other) rather than societal expectations.

  ### 3. Assessment: Did Keynes Overread Moore?

  To answer your core question: **Yes, Keynes and the Bloomsbury Group absolutely read more into Moore than the passage supports.** It was a creative misreading, but a historically fruitful one.

  **Where the Inference Fails**
  1.  **Meta-Ethics vs. Normative Ethics:** Moore was doing *meta-ethics* (defining what "good" means). He was not writing a self-help book. He explicitly stated that while *value* lies in states of mind, our *duty* is often to follow general rules that promote those states. He was actually quite conventional in his personal behavior. Keynes took Moore's definition of "good" and turned it into a prescription for "action," which Moore never intended.
  2.  **The "Private" Leap:** Moore's "states of mind" were not necessarily private. He valued the appreciation of beauty and friendship highly. However, he did not argue that *public* action was worthless. He argued that public action only has value insofar as it produces those states. Keynes turned this into a dichotomy: Private States = Good; Public Action = Distraction. Moore would likely have argued that a just society is a necessary "part" of the valuable "whole" of human flourishing, even if bureaucracy itself isn't beautiful.
  3.  **The Logic of Leisure:** In your 1930 essay context, Keynes imagines a future where economic problems are solved, and we only face the problem of living. Moore's Organic Unity doesn't actually solve this. It explains why a vacation (Whole) is better than the sum of its hours (Parts), but it doesn't tell you *how* to fill the hours. Keynes uses Moore to justify *that* the hours matter more than the work, but Moore offers no guide on how to fill them "wisely and agreeably."

  **Why It Worked for Keynes**
  However, calling it a "misreading" might be too harsh. It was an **appropriation**.
  *   The Bloomsberries were reacting against the grim, duty-bound Victorianism of their fathers. They needed a philosophical weapon to say, "Feelings matter more than Rules."
  *   Moore's *Principia* provided the intellectual cover. It allowed them to say, "We aren't being selfish; we are being rigorous utilitarians of the *intrinsic good*."
  *   The "Organic Unity" principle specifically helped them justify intense, insular relationships. A Bloomsbury love triangle might look scandalous to the outside world (a negative "part" in societal terms), but if the "whole" of the relationship produced a unique state of love and truth, Moore's logic suggests you can't judge it by summing up the societal disapproval.

  **Verdict for Your Feature**
  You can confidently state that Keynes's vision of the good life rests on a **romanticization of Moore's logic.**
  *   **Moore** provided the scalpel: a logical distinction between the value of an experience and the value of the actions leading to it.
  *   **Keynes** wielded it as a sword: cutting away the obligation to "do" in favor of the obligation to "be."

  The inference doesn't hold together as strict philosophy (Moore would have been baffled by the lifestyle of the Bloomsberries), but it holds together beautifully as intellectual history. It shows how a dry Cambridge don inadvertently inspired a revolution in how the 20th century thought about leisure, art, and the self.

  For your piece, the tension is the story: Keynes spent his later life managing economies and nations (the "parts"), while his heart remained with Moore's "wholes." The tragedy of "Economic Possibilities for our Grandchildren" is that we solved the economic problem, but we never solved the Moorean problem: we still don't know how to occupy our leisure "wisely and agreeably and well." We have the stones, but we still can't make the number two.
