prompt: |-
  I'm writing a feature on John Maynard Keynes's views about the good life, and while I feel on solid footing with his famous 1930 essay "Economic Possibilities for our Grandchildren" — the one that imagines a future so abundant that our hardest remaining task will be learning to occupy our leisure so as to "live wisely and agreeably and well" — I've been trying to trace that vision back to its roots in his Cambridge years. In his 1938 memoir "My Early Beliefs," written for his old Bloomsbury circle, Keynes recalls that as undergraduates he and his friends built an entire ethics on G. E. Moore's 1903 Principia Ethica, one in which, as he put it, essentially nothing mattered except cultivating the right private states of mind — love, beauty, and knowledge — rather than right action, achievement, or consequences. He says a good deal of the justification for this rested on a technical piece of Moore's argument that he calls "the principle of organic unity." Wanting to see the argument in its original form rather than take Keynes's word for it, I went back to the relevant passage in Principia Ethica, where Moore sets out what he calls "the principle of organic unities." Here it is, and I confess it has me a bit stuck:

  > There are, then, wholes which possess the property that their value is different from the sum of the values of their parts; and the relations which subsist between such parts and the whole of which they form a part have not hitherto been distinctly recognised or received a separate name. Two points are especially worthy of notice. (1) It is plain that the existence of any such part is a necessary condition for the existence of that good which is constituted by the whole. ... What is asserted to have intrinsic value is the existence of the whole; and the existence of the whole includes the existence of its part. Suppose the part removed, and what remains is *not* what was asserted to have intrinsic value; but if we suppose a means removed, what remains is just what *was* asserted to have intrinsic value. And yet (2) the existence of the part may *itself* have no more intrinsic value than that of the means. It is this fact which constitutes the paradox of the relation which we are discussing. ... But the inference would be as false as if we were to conclude that, because the number of two stones was two, each of the stones was also two. The part of a valuable whole retains exactly the same value when it is, as when it is not, a part of that whole. If it had value under other circumstances, its value is not any greater, when it is part of a far more valuable whole; and if it had no value by itself, it has none still, however great be that of the whole of which it now forms a part.

  I can parse the individual sentences well enough, but I don't think I could explain in plain English what "paradox" Moore believes he has identified here, or what the stone analogy is doing to resolve it. More importantly for my piece, I'm struggling to see how a claim this narrow and technical — about the logical relationship between the value of parts and the value of wholes — could do the work Keynes says it did: licensing a whole philosophy of life centred on private, exquisite states of mind rather than on conduct or its results. Could you help me reconstruct what Moore is actually arguing, and then offer your own honest assessment of whether the inference from his premise to Bloomsbury's much more sweeping conclusion really holds together, or whether a twenty-year-old Keynes was reading more into Moore than the passage can support?
