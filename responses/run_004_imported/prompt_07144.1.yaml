answer: |-
  This is an excellent objection, and it gets to the heart of the distinction between legal *liability* and moral *culpability*. Your observation about vicarious liability is astute: the law clearly allows costs and responsibilities to shift from one agent to another. However, David Lewis (and most legal philosophers) would argue that this does not actually solve the puzzle of penal substitution.

  To see why Lewis treats the transferability of punishment as a distinctive problem, we need to unpack the distinction he draws between **punishment** and **penalties** (or prices), and examine what exactly is being transferred in cases of vicarious liability.

  ### 1. Punishment vs. Penalties/Prices
  Lewis's central move in the essay is to distinguish between two ways we conceive of negative consequences for wrongdoing:

  *   **Prices/Penalties:** These are costs attached to certain actions. Like a parking fee or a tax, they can be paid by anyone. If I owe a fine, you can write the check for me. The state gets its money; the debt is cleared.
  *   **Punishment:** This is retributive. It is essentially linked to **personal guilt**. Punishment is not just about suffering a cost; it is about suffering *because you are to blame*.

  Lewis argues that our intuition rebels against penal substitution because we instinctively view divine justice as retributive. If punishment is essentially a response to *moral guilt*, then it cannot be transferred, because guilt is a property of the moral agent, not a commodity.

  ### 2. What Vicarious Liability Actually Transfers
  Your example of vicarious liability (an employer liable for an employee's tort) is a powerful counter-example to the idea that *responsibility* cannot be shifted. However, it supports Lewis's distinction rather than undermining it.

  In vicarious liability, what is transferred is **financial liability**, not **moral guilt**.
  *   **Compensation, not Retribution:** Tort law is primarily concerned with making the victim whole (compensation), not punishing the wrongdoer for moral wickedness (retribution). When an employer pays for an employee's negligence, they are paying a *price* for the privilege of employing others, or distributing the risk of loss.
  *   **No Moral Blame:** We do not say the employer is *morally guilty* of the employee's negligence in the same way the employee is. The employer is not "blamed" in the retributive sense; they are simply the "deep pocket" designated by policy to ensure the victim is paid.
  *   **Strict Liability:** Much of vicarious liability is a form of strict liability. It attaches regardless of the employer's fault. This confirms that what is being transferred is a *cost*, not a *punishment for guilt*.

  If Lewis were to look at vicarious liability, he would likely say: "Exactly! We allow the transfer of *costs* (penalties), but we do not allow the transfer of *guilt*."

  ### 3. The Criminal Law Contrast
  The distinction becomes even sharper if we look at criminal law, which is the closer analogue to the theological concept of "penal" substitution (since sin is often framed as a crime against God).

  Our legal system generally **forbids** vicarious criminal liability.
  *   If a manager commits fraud, the *firm* might be fined (a civil/regulatory penalty), but the *CEO* cannot go to jail for the manager's crime, even if the CEO volunteers.
  *   We do not allow one person to serve another's prison sentence.

  Why? Because imprisonment is paradigmatic *punishment*. It is intended to censure the guilty agent. Allowing a substitute would sever the essential link between the suffering and the guilt. Lewis's puzzle is rooted in this retributive intuition: if Christ's suffering was truly *punishment* (retributive justice), it requires Christ to be *guilty*. If He is innocent, He can pay a *price*, but He cannot receive *punishment*.

  ### 4. Why the Puzzle Remains
  Lewis treats this as a philosophical problem because the doctrine of Penal Substitution claims to do something that vicarious liability does not.

  *   **Vicarious Liability:** "I will pay the cost of the damage you caused." (Transfer of Debt/Price)
  *   **Penal Substitution:** "I will bear the wrath/punishment due to your guilt." (Transfer of Punishment)

  If the Atonement is merely Christ paying a fee to satisfy a regulatory requirement, it looks more like a commercial transaction than a judicial punishment. But traditional Christian doctrine insists it *is* judicial: Christ bears the *wrath* of God.

  Lewis suggests that we often slide between these two concepts. We find penal substitution intelligible only when we unconsciously reinterpret "punishment" as "penalty." If we take "punishment" seriously in the retributive sense (as the law does in criminal cases), the doctrine becomes paradoxical.

  ### Summary
  Your objection highlights that **liability** is transferable. Lewis's point is that **punishment** (in the retributive sense) is not.

  *   The law allows employers to pay for employees' mistakes (Transfer of Cost).
  *   The law does not allow innocents to go to jail for criminals' crimes (Non-Transfer of Punishment).

  Lewis treats this as a puzzle because the Christian doctrine claims Christ underwent the latter (punishment/wrath) while being the former (innocent). Vicarious liability shows we can transfer the *bill*, but it doesn't show we can transfer the *blame*. Since Lewis argues punishment requires blame, the philosophical tension remains.
