  The garage smelled of oil and old rubber, a scent Thomas had associated with calm for thirty years. But today, the air felt thin. Mara watched her father from the doorway, holding a tray of tools she didn't really need to bring him. He was under the hood of the sedan, his back to her, shoulders broad and still.

  He had been different, once. The stories were the kind families whisper only when the children are older. A slammed door that shattered the frame. A thrown plate that missed a head by inches. A temper that didn't simmer; it boiled over without warning. Then came the Regulator, a small device implanted at the base of the skull, and twenty years of peace.

  "Pass me the twelve-millimeter," Thomas said, his voice even.

  Mara stepped forward. As she handed him the wrench, her elbow clipped the edge of the open toolbox. A heavy socket rolled off the tray, struck the concrete, and bounced loudly against the metal leg of the workbench.

  The sound was sharp. A crack like a pistol shot in the quiet room.

  Thomas froze. Mara saw the change instantly. It wasn't a movement, but a tension. The muscles in his neck corded, standing out like ropes under the skin. His grip on the wrench tightened until his knuckles turned the color of old parchment. His breath hitched, held in a chest that suddenly refused to expand. For a heartbeat, he was not a father in a garage; he was a coiled spring waiting to snap, the old heat rising in him, ready to turn the pain of the noise into violence against the nearest object.

  Then, a sound. Faint, almost imperceptible. A high-pitched whine, like a mosquito singing near the ear.

  It came from the base of his skull.

  Mara watched his hand. The fingers, white-knuckled and trembling, went limp. The wrench slipped slightly in his grip before stabilizing. The cords in his neck smoothed out. The breath rushed out of him in a long, controlled exhale.

  Thomas turned around. His face was smooth, his eyes clear. He smiled, a genuine-looking curve of the lips.

  "Clumsy of me," he said, nodding at the socket on the floor. "Startled me."

  He reached down, picked up the socket, and placed it gently back in the tray. He went back to the engine, humming a tuneless song.

  Mara stood still, the tray cold in her hands. She had seen the neck muscles. She had seen the white knuckles. She had heard the whine.

  She knew what she had witnessed. The anger had been there. It had risen, full and hot, ready to break something. It hadn't vanished; it hadn't been cured or rewritten. The man under the hood was still the man who broke doorframes. The device had simply intercepted the command before it could reach the hand. It had stood between the impulse and the action, a gatekeeper that locked the door at the exact moment the fire started.

  If the fire had never started—if the heat simply hadn't risen when the noise occurred—she would have known he was changed. She would have known the years had rewritten him, that the capacity for violence was gone, dissolved like sugar in water. She could have left her own son in this garage without a second thought. She could have trusted the man.

  But the fire had risen. The gatekeeper had held it back.

  She looked at the small scar beneath his hairline. She realized she did not trust Thomas. She trusted the battery in his neck. She trusted the circuitry that measured tension and flooded the nerves with calm. She trusted the machine that acted as the antidote to the poison still flowing in his veins.

  "Everything okay?" Thomas asked, not turning around.

  "Yes," Mara said, her voice steady. "Just deciding where to put the tray."

  She set it down on the far bench, out of reach of a swinging arm. She would not leave her son here. Not because her father was dangerous, but because the thing keeping him safe was not him. It was a barrier, not a transformation. And barriers, she knew, could fail. Batteries died. Circuits broke.

  "Hand me the rag?" Thomas asked.

  Mara tossed it to him. He caught it softly. She watched his hands, waiting for the tremor, waiting for the whine. She loved him, but she judged him by the silence of the device, not the peace of his face.
