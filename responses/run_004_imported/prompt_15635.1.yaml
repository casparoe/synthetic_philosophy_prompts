      *   *Verdict:* He likely would have updated by the early 1960s as statistical scrutiny intensified.

  4.  **Address Question 3: Epistemic Soft Spot?**
      *   *Is it inconsistent?* On the surface, yes. He dismisses consciousness (philosophical) quickly but accepts ESP (empirical) cautiously.
