          *   Consciousness: Unfalsifiable/Metaphysical. Can't be tested.
          *   ESP: Falsifiable/Empirical. Claimed to be tested.
      *   *Turing's Logic:* If ESP is real, it breaks the test. Therefore, even if unlikely, it must be controlled for. It's a "security patch" for the Imitation Game, not necessarily an endorsement of the ontology of ESP.
      *   *Counter-point:* He *did* say the evidence was "overwhelming." That suggests he was convinced, not just hedging. This points to the state of science in 1950 rather than a personal flaw.

  5.  **Address Question 4: Product of its Time vs. Bearing on Argument?**
