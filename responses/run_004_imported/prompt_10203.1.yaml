  6.  **Final Polish:** Ensure the distinction between *Direct Commitment* and *Extrapolation* is very clear, as requested. (I will use explicit markers).

      *   *Drafting the "Submersion" point:* Dummett argued that for submersion to be real, the influx must be large enough to alter the culture *and* the state must be unable to integrate them. He cited the UK's capacity to absorb millions post-WWII. 700k/year is high, but is it "submersion"? Probably not by his metric, but the *perception* is what politicians exploit.
      *   *Drafting the "Racism" point:* The user notes the migrants are non-white but the rhetoric is fierce. Dummett would say the rhetoric *proves* the racism, regardless of the economic visas. The visas are technocratic; the rhetoric is political.

  7.  **Final Review against constraints:**
      *   Reconstruct commitments? Yes.
      *   Assess Rwanda, Invasion, Net Migration? Yes.
      *   Flag Direct vs. Speculative? Yes.
