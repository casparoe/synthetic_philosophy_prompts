      *   **Context:** A debate between the user and a friend (a Frege/Dummett scholar). The friend argues Dummett's framework applies directly to current UK asylum politics (Braverman, Rwanda, net migration). The user argues the context has changed (work/study visas vs. asylum, different demographics, etc.).
      *   **Task:** Settle the debate by reconstructing Dummett's actual commitments. Assess specific current issues (Rwanda scheme, "invasion" rhetoric, post-Brexit migration figures) using Dummett's tests. Address the tension between restrictionist rhetoric and high non-white migration numbers.
      *   **Constraint:** Clearly flag what is directly supported by Dummett's text/commitments vs. what is speculative extrapolation.

  2.  **Deconstruct Dummett's Position (based on *On Immigration and Refugees* and known biography):**
      *   *Core Principle:* The "Right not to be Submerged." Dummett concedes a nation *might* have a right to preserve its character/identity if immigration threatens to overwhelm it ("submerge" it).
      *   *Threshold:* This threshold is extremely high. He argued Britain never met it in the 20th century.
      *   *Motivation for Restriction:* He historically argued that British immigration control (Commonwealth Immigrants Acts, etc.) was driven primarily by racism/prejudice, not genuine capacity concerns.
      *   *Refugees/Asylum:* He distinguishes between economic migrants and refugees. Refugees have a stronger moral claim (Geneva Convention).
      *   *Methodology:* He was a realist/anti-realist in metaphysics, but a moral realist in this context. He valued consistency and logical coherence in policy. He was an activist (JCWI), so theory was linked to practice.
      *   *Key Distinction:* He cared deeply about the *reasons* given for restriction. If the reason is false (i.e., claiming submersion when it's not happening), the policy is unjust.

  3.  **Evaluate Current Issues against Dummett's Framework:**

      *   **Issue 1: The "Invasion" Rhetoric (Braverman/Small Boats).**
          *   *Dummett's View:* He would analyze the truth value of the claim. Is it an invasion? Is there a risk of submersion?
          *   *Application:* Small boat numbers are statistically tiny compared to total population. "Invasion" implies a threat to sovereignty or demographic existence.
          *   *Verdict:* He would likely condemn this as inflammatory and factually incorrect, serving to stoke prejudice rather than address genuine capacity. (Direct application of his "submersion" test).

      *   **Issue 2: The Rwanda Scheme.**
          *   *Dummett's View:* Compliance with international law (Geneva Convention). Treatment of refugees.
          *   *Application:* Offshoring asylum processing to a country deemed unsafe by the Supreme Court violates the principle of non-refoulement. Dummett was a staunch defender of refugee rights.
          *   *Verdict:* He would condemn this unequivocally. It bypasses the moral obligation to refugees. (Direct application of his refugee principles).

      *   **Issue 3: Post-Brexit Migration Figures (High Net Migration).**
          *   *User's Point:* Most are work/study visas, not asylum seekers.
          *   *Dummett's View:* Does high numbers = submersion? He focused on *integration* and *social cohesion* as much as raw numbers, but emphasized that "submersion" requires a threat to the existing way of life.
          *   *Application:* 700k is high, but is it "submersion"? Given UK population (~67m), it's ~1%. Dummett would likely ask: Is the *character* of the nation changing against the will of the people due to inability to integrate? Or is this economic necessity?
          *   *Nuance:* Dummett was skeptical of economic arguments used to mask racism. But he might acknowledge a *democratic* need to control pace if social cohesion frays. However, he would likely blame the *system* (hostile environment) rather than the migrants.
          *   *Verdict:* Probably not "submersion" in his sense, but he might worry about the *political* reaction to it. (More speculative).

      *   **Issue 4: Racism vs. High Non-White Migration.**
          *   *The Tension:* Dummett's thesis: Restrictionism = Racism. Current Reality: High non-white migration + Restrictionist Rhetoric.
          *   *Resolution:* Dummett would likely argue the *rhetoric* is racist (dog-whistling), even if the *economic engine* requires the labor. The "Hostile Environment" targets the vulnerable (asylum seekers) to appease the prejudice, while the economy quietly imports labor. This creates a two-tier system which he would find morally repugnant.
          *   *Verdict:* The racism lies in the *selection* of who is vilified (the boat crosser) vs. who is welcomed (the skilled worker), often along class/racial lines, and the use of scapegoating. (Extrapolation based on his views on prejudice).

  4.  **Structure the Response:**
      *   **Introduction:** Acknowledge the friend's insight (Dummett's activism is underappreciated) but validate the user's caution (context matters).
      *   **Section 1: The "Submersion" Test (Direct Application).** Define the test clearly. Apply it to "Invasion" rhetoric and Net Migration numbers.
      *   **Section 2: The Refugee Obligation (Direct Application).** Apply to Rwanda and Geneva Convention.
      *   **Section 3: The Racism Thesis (Extrapolation/Synthesis).** Address the tension between high migration and restrictionist rhetoric.
      *   **Section 4: Conclusion/Verdict.** Who wins the argument? (Mostly the friend, but with the user's nuances incorporated).
      *   **Formatting:** Use bolding or tags like **[Direct Commitment]** and **[Speculative Extrapolation]** to meet the constraint.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did Dummett actually talk about "economic migrants" vs "refugees"? Yes, he distinguishes them but argues for a humane policy for both. He prioritizes refugees.
      *   *Check:* Did he define "submersion"? He describes it as a loss of national character/identity to the point where the existing population feels like strangers in their own land. He thought this was virtually impossible in modern Britain without total population replacement.
      *   *Check:* The Rwanda scheme. Dummett died in 2011. He didn't see Rwanda. But he saw the "Hostile Environment" beginnings. I must flag this as extrapolation based on his principles regarding international law.
      *   *Check:* The "Racism" thesis. In *On Immigration and Refugees*, he explicitly traces the 1962, 1968, 1971 Acts to racial prejudice. Applying this to 2024 requires care. The "racism" might be more about *hostility* than explicit exclusion now.
