answer: |-
  This is a fascinating dispute because it pits textual fidelity against historical context. Your friend is correct that Dummett's activism is often overshadowed by his logic and metaphysics, and that *On Immigration and Refugees* (2001) provides a rigorous normative framework, not just a sentiment. However, you are right to be cautious about applying a diagnostic tool designed for the Windrush generation directly to the post-Brexit bureaucracy without adjustment.

  To settle this, we need to separate Dummett's explicit criteria from the necessary extrapolation required to apply them to 2024. Here is an assessment of how Dummett would likely judge the current landscape, flagging the source of each claim.

  ### 1. The "Submersion" Test and the "Invasion" Rhetoric

  Dummett's central concession to restrictionists is the "right not to be submerged." He argues that a national community has a legitimate interest in preserving its character and that if immigration were so massive that the existing population became strangers in their own land, restriction would be justified.

  **[Direct Commitment]** In *On Immigration and Refugees*, Dummett explicitly states that this threshold is "extremely high." He argues that for submersion to be genuine, it must be demographically overwhelming and culturally displacing. He notes that post-war Britain absorbed millions of Commonwealth citizens without triggering this right. He insists that politicians invoking "fear of being swamped" are almost always manufacturing a crisis to mask prejudice.

  **[Direct Commitment]** Dummett places a heavy burden of proof on those claiming submersion. It is not enough to say numbers are "high"; one must demonstrate that the *capacity for integration* has been breached. He writes that the "onus of proof lies on those who wish to exclude," not on those who wish to enter.

  **Assessment:**
  Dummett would almost certainly reject Suella Braverman's "invasion" framing as a failure of truth-telling.
  *   **The Numbers:** Even with net migration peaking at 700,000, this represents roughly 1% of the UK population annually. **[Direct Commitment]** Dummett argued that Britain's population density and economic structure could absorb significantly higher numbers without "submersion." He would likely view the "invasion" label as a deliberate falsehood designed to trigger the submersion anxiety he deemed illegitimate in 99% of cases.
  *   **The Mode of Entry:** **[Speculative Extrapolation]** Dummett focused heavily on the *vulnerability* of the migrant. Small-boat crossings involve high risk and desperation. To label desperate refugees as "invaders" inverts the moral hierarchy Dummett established. He would likely argue that framing vulnerable asylum seekers as a national security threat is a moral corruption intended to bypass the "submersion" test entirely by changing the subject from *capacity* to *security*.

  **Verdict:** On the "invasion" rhetoric, your friend wins. Dummett's framework treats such language as a symptom of the very prejudice he sought to diagnose, not a valid trigger for the "right not to be submerged."

  ### 2. The Rwanda Scheme and International Obligations

  Dummett distinguishes sharply between economic migrants (where the state has more discretion) and refugees (where the state has strict obligations under the Geneva Convention).

  **[Direct Commitment]** Dummett writes that the refugee convention is a "minimal moral standard" that civilized nations must uphold. He argues that the definition of a refugee must be interpreted generously, and that *non-refoulement* (not returning people to danger) is absolute. He was a co-founder of the Joint Council for the Welfare of Immigrants (JCWI) specifically to provide legal aid to those facing deportation.

  **[Speculative Extrapolation]** Dummett died in 2011, before the Rwanda scheme was conceived. However, based on his lifelong opposition to the "Hostile Environment" policies (which began under Labour and expanded under the Conservatives), we can infer his reaction. He viewed the bureaucratic obstruction of asylum claims as a way to deter refugees without formally breaking the law.

  **Assessment:**
  Dummett would condemn the Rwanda scheme unequivocally.
  *   **Offshoring:** **[Speculative Extrapolation]** Dummett believed that if a nation claims to be a moral agent, it must take responsibility for its decisions. Offshoring asylum processing to a third country to avoid legal obligations would strike him as a "sham" procedure. It replicates the "bogus" appeals processes he criticized in the 1990s, designed to exhaust the applicant rather than find the truth.
  *   **Supreme Court Ruling:** **[Direct Commitment]** Dummett respected the rule of law as a check on executive prejudice. The Supreme Court's finding that Rwanda was not a safe country (risk of refoulement) aligns exactly with Dummett's warning that governments will lie about safety to reduce numbers. He would view the government's attempt to legislate away the facts (via the Safety of Rwanda Act) as an attack on the logical coherence of law itself—a profound philosophical sin for Dummett.

  **Verdict:** Your friend is correct here. The Rwanda scheme violates Dummett's core principle that refugee protection is a non-negotiable duty, not a bargaining chip.

  ### 3. The Paradox of High Migration and Restrictionist Rhetoric

  This is the crux of your objection. Dummett's historical thesis is that British immigration control is driven by racism. Yet, today we have record high migration (much of it non-white) alongside fierce restrictionist rhetoric. Does this falsify Dummett?

  **[Direct Commitment]** Dummett argued that restrictionist *policy* often follows restrictionist *rhetoric*, but he also noted that economic necessity often forces governments to allow entry while publicly maintaining a tough stance. He observed that the 1962 Commonwealth Immigrants Act was passed *before* the peak of Commonwealth migration, serving as a symbolic gesture to prejudice rather than a practical cap on numbers.

  **[Speculative Extrapolation]** Applying this to the present requires understanding Dummett's view of "racism." For Dummett, racism was not just exclusion; it was the *stigmatization* of the "other." He would likely argue that the current system creates a two-tier hierarchy:
  1.  **The "Good" Migrant:** High-skilled, wealthy, pre-approved (Work/Study visas). They are tolerated because they are economically useful and politically quiet.
  2.  **The "Bad" Migrant:** Poor, asylum-seeking, arriving irregularly (Small boats). They are vilified to satisfy the "submersion" anxiety.

  **Assessment:**
  Dummett would not see high net migration figures as a refutation of his racism thesis.
  *   **The Selection Mechanism:** **[Speculative Extrapolation]** He would argue that the racism lies in the *selection* and the *narrative*. By welcoming wealthy migrants from the Global South while criminalizing poor refugees from the same regions, the state maintains a racialized hierarchy without explicitly naming race. The "racism" is in the assertion that the boat crosser is a threat while the HNW (High Net Worth) visa holder is an asset, despite both contributing to the "net migration" figure used to stoke public fear.
  *   **The Function of Rhetoric:** **[Direct Commitment]** Dummett argued that immigration debates are often "proxy wars" for national identity. He would likely say the government *needs* the "invasion" narrative to sustain a certain vision of British sovereignty (Brexit), even if their economic policy requires high migration. The contradiction is a feature, not a bug. It allows the government to appease the "submersion" fear rhetorically while ignoring it economically.

  **Verdict:** This is a draw, but leans toward your friend. You are right that the *demographics* of migration have changed (more work visas), but Dummett would argue this doesn't clear the government of racism. He would say the racism has simply migrated from *exclusion* to *stratification*. The "submersion" test is not triggered by the numbers, but the government *claims* it is to justify the stratification.

  ### 4. Would Dummett See "Genuine Submersion" Today?

  This is the most critical test. If Dummett conceded that submersion was happening now, his support for open borders (within reason) would collapse.

  **[Direct Commitment]** Dummett defined submersion not just by numbers, but by the *breakdown of social cohesion* and the *inability to integrate*. He believed integration was a two-way street requiring state support (housing, language, anti-discrimination).

  **[Speculative Extrapolation]** Dummett would likely look at the Windrush Scandal as evidence of the state *sabotaging* integration. If the state strips long-term residents of rights (Windrush) and houses asylum seekers in barges or hotels without community support, the state is *creating* the conditions of friction that it then blames on the migrants.

  **Assessment:**
  *   **The Numbers:** 700,000 net migration is high, but **[Direct Commitment]** Dummett would likely maintain this does not constitute "submersion" in a country of 67 million, provided housing and infrastructure are managed. He would blame the *housing crisis* on government failure, not migrant numbers.
  *   **The Cohesion:** **[Speculative Extrapolation]** He might concede that *social trust* is low, but he would argue this is due to the "Hostile Environment" rhetoric itself. By telling the public they are being "invaded," the government creates the sense of submersion artificially. For Dummett, a "right not to be submerged" cannot be triggered by a threat the government itself is exaggerating for political gain.

  ### Conclusion: Who Wins the Argument?

  **Your friend is largely right, but your nuance is necessary for the application.**

  1.  **On Principles (Friend Wins):** Dummett's "yardstick" does transfer. The "right not to be submerged" is not triggered by current figures, and the "invasion" rhetoric fails the truth test required to invoke it. The Rwanda scheme violates the absolute duty to refugees. On these normative questions, Dummett's 2001 text is damningly applicable to 2024.
  2.  **On Diagnosis (You Win the Nuance):** You are correct that the *composition* of migration has changed. Dummett's historical thesis (Restriction = Racism) requires the extrapolation I outlined above: that racism now operates through *categorization* (refugee vs. worker) rather than just *exclusion*. If you simply apply his 1960s lens without adjusting for the points-based system, you miss how the state manages to be both restrictionist *and* high-migration.

  **Final Reconstruction:**
  If Dummett were alive today, he would likely argue:
  *   **Rwanda:** A moral abomination and a violation of international law. **[Direct Commitment]**
  *   **Invasion Rhetoric:** A lie that artificially manufactures the "submersion" condition to justify authoritarianism. **[Direct Commitment]**
  *   **High Net Migration:** Evidence that the economy needs labor, proving the "submersion" claim false. The friction arises because the government refuses to fund integration while stoking hatred. **[Speculative Extrapolation]**
  *   **Racism:** The thesis holds, but the mechanism has shifted from "Keep Them Out" to "Keep Them Down/Out of Sight." **[Speculative Extrapolation]**

  Your friend is justified in using Dummett as a yardstick, provided they acknowledge that the government is now playing a more complex game than the mid-century restrictionists Dummett originally analyzed. The yardstick still measures straight, but the object being measured has become more irregular.
