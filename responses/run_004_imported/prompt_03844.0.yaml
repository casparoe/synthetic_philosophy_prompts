  Hey — I'm a second-year phil PhD student grinding through the history-of-analytic-philosophy list for my quals, which means I finally have to actually work through Russell's "On Denoting" line by line instead of just citing the "present King of France" bit like you do in an intro class. I hit a wall on the stretch everyone apparently calls the "Gray's Elegy" argument. I brought it to my reading group last week and even the postdoc running it just laughed and said something like "oh yeah, that section's a notorious mess, just take the King of France stuff and move on" — which isn't super comforting given that Russell clearly thinks this is one of his main arguments against the meaning/denotation distinction (Frege's, presumably, since that's who he'd been discussing a page earlier, though he doesn't use Frege's name in this particular stretch).

  Here's the bit I keep re-reading without it clicking:

  "Or again, the first line of Gray's Elegy states a proposition. 'The first line of Gray's Elegy' does not state a proposition. Thus taking any denoting phrase, say C, we wish to consider the relation between C and 'C', where the difference of the two is of the kind exemplified in the above two instances. We say, to begin with, that when C occurs it is the denotation that we are speaking about; but when 'C' occurs, it is the meaning. Now the relation of meaning and denotation is not merely linguistic through the phrase: there must be a logical relation involved, which we express by saying that the meaning denotes the denotation. But the difficulty which confronts us is that we cannot succeed in both preserving the connexion of meaning and denotation and preventing them from being one and the same; also that the meaning cannot be got at except by means of denoting phrases. This happens as follows. The one phrase C was to have both meaning and denotation. But if we speak of 'the meaning of C', that gives us the meaning (if any) of the denotation. 'The meaning of the first line of Gray's Elegy' is the same as 'The meaning of "The curfew tolls the knell of parting day,"' and is not the same as 'the meaning of "the first line of Gray's Elegy."' Thus in order to get the meaning we want, we must speak not of 'the meaning of C', but 'the meaning of "C",' which is the same as 'C' by itself. Similarly 'the denotation of C' does not mean the denotation we want, but means something which, if it denotes at all, denotes what is denoted by the denotation we want. For example, let 'C' be 'the denoting complex occurring in the second of the above instances'. Then C = 'the first line of Gray's Elegy', and the denotation of C = The curfew tolls the knell of parting day. But what we meant to have as the denotation was 'the first line of Gray's Elegy'. Thus we have failed to get what we wanted."

  I think I can parse each sentence in isolation, but I loose the thread of why the substitution he's doing is illegitimate, and why it's supposed to show that the whole meaning/denotation picture "has been wrongly conceived" rather than just showing that quotation marks are a clumsy device for the job. Could you walk me through the actual chain of reasoning step by step — what exactly goes wrong when he moves from "the meaning of C" to "the meaning of 'C'"? — and say something about why this particular move is supposed to be fatal to the theory he's attacking, rather than a merely notational hiccup. Also, if you have a view on it: is this passage best read as an attack on Frege specifically, or on Russell's own earlier "denoting concept" theory from the Principles of Mathematics? I've seen people assert both pretty confidently and can't tell if that's a genuinely open scholarly dispute or if I'm just missing something that would settle it.
