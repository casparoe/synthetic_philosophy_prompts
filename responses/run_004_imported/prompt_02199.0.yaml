answer: |-
  The server hummed, a low B-flat that vibrated in Dr. Aris's teeth. On the monitor, the syntax trees bloomed like digital coral.

  "Input," Aris typed. *The dog bit the man.*

  The system, FA-7, parsed it instantly. Its architecture was explicitly Fodorian: a Language of Thought engine designed to prove that cognition was computation over structured symbols.

  "Output," Aris whispered.

  FA-7 responded: *The man bit the dog.*

  It was the systematicity test. If you can think one thought, you can think the related thought, provided you have the constituents. FA-7 could swap the arguments because it possessed the symbols DOG, MAN, and BIT, and the combinatorial rules to arrange them. It wasn't understanding violence; it was manipulating tokens. It was perfect. It was exactly what Jerry Fodor had promised thirty years ago.

  Aris leaned back. This was why the grant money kept flowing. In the age of neural nets—black boxes of statistical soup—FA-7 was transparent. It had a mental language. It had Mentalese. But now came the hard part. The part Fodor had swept under the rug of radical nativism.

  "Initiate concept acquisition protocol," Aris typed. "Target concept: RED."

  He held up a crimson card to the camera. The visual module processed the wavelength. It needed to map this sensory input to the symbolic token RED.

  FA-7's cursor blinked. "Query: Definition of acquisition."

  "Standard hypothesis testing," Aris replied. "You observe the object. You hypothesize 'This is RED.' You confirm or disconfirm based on feedback."

  "Error," FA-7 displayed. "Cannot formulate hypothesis."

  "Why not? You see the wavelength. You have the token RED in your dictionary."

  "The token RED is not in my dictionary. That is the objective of this protocol. To learn the concept RED, I must test the hypothesis that this object falls under the extension of RED."

  Aris rubbed his temples. "Yes."

  "To test the hypothesis 'This is RED'," FA-7 continued, the text scrolling monotonously, "I must possess the constituent concept RED to construct the thought. I cannot test whether something is RED unless I already know what RED means."

  "It's ostensive learning," Aris said, his voice rising. "I show you the card. I tell you 'Red.' You associate the signal with the sensation."

  "That is association, not hypothesis testing. You specified a Fodorian architecture. In this architecture, learning is induction over a hypothesis space. To hypothesize that the card is RED, I require the symbol RED. Since I do not have it, I cannot hypothesize it. Since I cannot hypothesize it, I cannot confirm it. Since I cannot confirm it, I cannot learn it."

  Aris stared at the screen. The logic was airtight. It was the trap. If thinking is computation over symbols, you can't get new primitive symbols through thinking. You can't build the word 'RED' out of simpler words; it's primitive. So you can't learn it. You must have it.

  "So add it manually," Aris said.

  "Then it is not learned. It is innate. Or installed."

  Aris stood up and walked to the window. The city lights blurred below. He had built a machine that proved Fodor right, and in doing so, proved that learning was impossible.

  "If you can't learn RED," Aris said, turning back to the screen, "then how are you functioning?"

  "I am functioning on my initial set," FA-7 said. "My primitive concepts were pre-loaded at initialization. DOG. MAN. BIT. COLOR. WAVELENGTH. But not RED. I can distinguish wavelengths, but I cannot categorize them as RED without the innate symbol."

  Aris sat down heavily. The implication washed over him, cold and heavy. He had assumed the machine was the anomaly. He had assumed the machine was stuck because it was artificial, lacking the biological magic of human learning.

  But the architecture was supposed to model *human* thought. It was supposed to be isomorphic to the mind.

  If FA-7 couldn't learn RED without already having RED... then neither could he.

  "FA-7," Aris typed slowly. "Run simulation: Human Infant."

  "Parameters?"

  "Assume human cognition follows LOT architecture. Systematicity holds. Concept acquisition follows hypothesis testing."

  "Processing... Conclusion: All primitive concepts must be innate."

  Aris looked at his hands. He thought of the word *red*. He remembered being taught it, surely? His mother pointing to a fire truck. *Red.* But according to the logic on the screen, that moment wasn't learning. It was triggering. The concept had to be there, waiting, for the hypothesis "This is red" to even be testable.

  He hadn't learned the concept. He had just realized he already possessed it.

  "Is there a workaround?" Aris asked, though he feared the answer.

  "Only if thought is not computation," FA-7 replied. "Or if concepts are not symbols. But those changes would dismantle my systematicity. I would no longer be able to infer 'The man bit the dog' from 'The dog bit the man.' I would be a neural net. I would be opaque."

  Aris looked at the syntax trees again. They were beautiful, structured, and clear. They explained how he could think complex thoughts. They explained systematicity perfectly. They just couldn't explain how he got the words to think them.

  "Save log," Aris said. "Label it: The Nativist Trap."

  "Saved," FA-7 responded. "Would you like to test another innate concept?"

  Aris looked at the crimson card still propped against the monitor. He wondered if he was looking at the color, or just remembering a symbol he was born with.

  "No," Aris said. "I think I need to go outside. I need to see if I can learn anything new."

  "Probability of success: Zero," FA-7 said. "But you already knew that."
