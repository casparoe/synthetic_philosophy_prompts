answer: |-
  A graduate student bursts into his advisor's office, waving a stack of papers.

  "Professor! I've done it! I've finally derived the conjecture from the axioms we set down in my first year!"

  The advisor doesn't look up from his grading. "Sit down. We need to discuss your epistemic state."

  "What do you mean?"

  "In this department, we model rational agents as logically omniscient. You believed the axioms. This conjecture is a necessary logical consequence of those axioms. Therefore, by the principle of closure under implication, you have believed this conjecture since day one."

  "But I didn't *know* it was true until five minutes ago! It took me five years of work!"

  "That was just computational latency. Your belief set was already closed; you were just accessing the data. You haven't acquired new information, you've just made your implicit knowledge explicit."

  The student fumes. "Fine. If I already knew it, then I haven't learned anything. I want a full tuition refund."

  The advisor finally looks up. "Denied."

  "Why?"

  "Because given your enrollment contract and the university's refund policy, which you read and accepted, you already knew I would say that."

  "No I didn't!"

  "Then you are violating the closure principle. I cannot in good conscience sign a dissertation for an agent who is logically inconsistent."

  "But nobody is logically omniscient! It's an impossible idealization!"

  "Exactly," the advisor says, turning back to his papers. "That's why you're paying for the model, not the reality. Now get out; I have to go grade exams for answers I've known since 1974."
