answer: |-
  **TO:** Steering Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Voting Protocol for First-Novel Prize

  **Context**
  Following this year's ceremony, it has come to light that the integrity of our ballot was compromised by strategic voting. One judge manipulated their rankings to suppress a front-runner, violating the spirit of the panel. This has resulted in interpersonal conflict among the judges. We must decide whether to retain our current points-based ranking system (Borda Count) or adopt a new method for next year.

  **The Case for the Status Quo**
  We should not dismiss the current system lightly. For four years, the 5-4-3-2-1-0 ranking has served us well because it captures *nuance*. Literary judgment is rarely binary. A judge might believe Book A is a masterpiece, Book B is strong, and Book C is competent. The current system allows a judge to register that gradient. It respects the intensity of preference. Furthermore, it is computationally transparent; judges understand exactly how their ballot translates to a result. In a vacuum, it is a robust method for aggregating ordinal preferences.

  **The Vulnerability**
  However, the Borda Count relies entirely on good faith. Because every rank carries point value, it incentivizes "burying." As we saw this year, a judge can weaponize the bottom of their ballot. If I believe Book A will beat my favorite, Book B, I am incentivized to rank Book A last, regardless of its merit, to lower its total. This turns the ballot into a tactical battlefield rather than an assessment of quality. It rewards cynicism over honesty. Once judges suspect one another of gaming the system, the panel's cohesion collapses.

  **The Reality Check**
  Before proposing a fix, we must accept a mathematical certainty: **No voting system is immune to strategic manipulation.** (This is the Gibbard-Satterthwaite theorem, in plain English.) In any system, a judge can lie about their preferences to achieve a desired outcome. In Approval Voting, a judge might refuse to "approve" a strong competitor to clear the field for their favorite (bullet voting). In Instant-Runoff, they might rank a weak candidate higher to manipulate elimination rounds. We cannot legislate against bad actors entirely. We can only change the *incentives* to make honesty the easier path.

  **Recommendation: Switch to Approval Voting**
  I recommend we switch to **Approval Voting**.

  Under this system, judges receive the six shortlisted books and mark every title they believe is "prize-worthy." There is no ranking. There are no points. You either support a book or you do not. The book with the most approvals wins.

  **Why this works for us:**
  1.  **It removes the weapon of "burying."** You cannot actively damage a book's score by ranking it last; you can only withhold support. This lowers the temperature of the ballot. It is psychologically harder to justify maliciously withholding approval from a book you respect than it is to cynically rank it zero.
  2.  **It encourages consensus.** In our current system, judges compete for points. In Approval, we are simply measuring the breadth of support. The winner is the book the most people can agree is excellent, rather than the book with the most intense (or manipulated) support.
  3.  **Simplicity.** Unlike Instant-Runoff, which requires complex tallying and can feel like a "black box" to judges, Approval is intuitive. Novelists are already opinionated; asking them to define a threshold of quality is easier than asking them to mathematically rank six distinct artistic achievements.

  **Implementation & Caveats**
  Ties are more possible in Approval Voting than in our points system. We should amend the rules to state that in the event of a tie, the judges will enter a brief, moderated discussion to reach a consensus, with the Chair holding a casting vote if necessary. This reintroduces human dialogue at the moment of deadlock, which is preferable to silent, strategic voting.

  **Conclusion**
  The current system asks judges to be mathematicians and strategists. Approval Voting asks them to be readers. It will not prevent a determined saboteur from lying, but it removes the specific mechanism that caused this year's fracture. I urge the committee to adopt Approval Voting for the next cycle.
