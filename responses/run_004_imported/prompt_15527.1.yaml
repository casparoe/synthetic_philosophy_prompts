prompt: |-
  So next week I'm interviewing a game theorist for a piece on AI agents and cooperation, and shes spent her whole career defending "program equilibrium" -- the idea that if two agents commit to running actual, inspectable code against each other (instead of just picking a strategy) they can provably cooperate on a one-shot Prisoner's Dilemma with no repeated play and no outside enforcer needed. I don't want this to stop at the cute 101 example (cooperate iff your source code is literally identical to mine) -- I want to push on the parts that actually strain: why any move past literal code-identity runs straight into the fact that checking whether two programs are equivalent is undecidable, what the whole Löb's-theorem "FairBot/PrudentBot" trick for dodging the infinite "I'll cooperate if you'll cooperate if I'll..." regress is really buying you and where it still gets exploited, and whether the same transparency that lets two agents provably cooperate could just as easily let two pricing bots (or two governments) provably collude instead. Can you draft me like 8 sharp interview questions covering those angles -- for each one, add a quick note on the dodge she'll probably reach for and a follow-up that actually closes it off.
