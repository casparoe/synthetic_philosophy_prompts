answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], Sarah's older sibling.

  I have a bit of a confession to make. I write novels for a living. My entire career is based on inventing fake people and pretending to know what they're thinking. So, when Sarah and Jo asked me to give this toast, I panicked. I told Sarah, "I'm great at writing fiction, but I'm terrible at being sincere about real life."

  But then I remembered who I'm talking to. Sarah spent her PhD studying Confucian role ethics. And if there is one thing I have learned from listening to her talk at dinner parties—usually while pointing a fork for emphasis—it is that the distinction between "real life" and "the roles we play" is an illusion.

  In most wedding toasts, the advice is: "Never lose who you really are in this marriage. Stay true to yourself."

  If I said that, Sarah would visibly wince. And she'd be right to. Because in the tradition she loves, there isn't a little isolated "self" hiding underneath your relationships. We *are* our relationships. We are constituted by the people we love. You don't find yourself in a marriage; you make each other.

  So, I'm not going to tell you to stay the same. I'm going to borrow a concept Sarah knows well: *Hé ér bù tóng*. Harmony without sameness.

  There is an old idea that marriage means "two becoming one." I think that's wrong. One note isn't music. One ingredient isn't a meal. Harmony happens when different things come together to make something better, without losing their distinct notes. Sarah and Jo, you are not blending into a gray paste. You are keeping your distinct tones to create a chord that neither of you could sing alone.

  This brings me to the titles you're taking on today. In Confucianism, there is the idea of the "Rectification of Names." It means that a title isn't a box you check once at the altar. It's a promise you have to keep making true every single day.

  Being a "wife" or a "partner" isn't something you *are*; it's something you *do*. It's a verb. Tomorrow morning, when you make the coffee, or listen after a hard day, or forgive a small annoyance, you are rectifying the name. You are filling that title with enough love and action that it actually fits.

  Now, I'm enough of a historian to know that the old versions of these ideas weren't perfect. The traditional Five Relationships were often rigid, hierarchical, and deeply unequal for women. But I look at the two of you, and I see something different. You are keeping the bones of that wisdom—the commitment, the reciprocity, the idea that we grow through duty to each other—but you are rebuilding the house. You are keeping the structure of care and tearing down the walls of hierarchy. You are writing a new version of the tradition, together.

  As a novelist, I spend my life trying to craft perfect endings. But marriage isn't a story with an ending. It's a practice. It's the daily work of creating harmony without demanding sameness. It's the work of making the name "spouse" mean something true.

  Sarah, Jo: May your harmony be rich, may your names always be rectified by kindness, and may you continue to constitute each other, beautifully, for the rest of your lives.

  Please raise your glasses. To Sarah and Jo.
