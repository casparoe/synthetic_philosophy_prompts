      *   **Legal Textualism:** The statute says "irreversible." Changing the definition to "permanent" without legislative amendment is administrative overreach. It changes the law by redefining terms.
      *   **Moral Consistency (The DDR):** The DDR exists to protect patients from being killed for their organs. If we blur the line, we risk eroding trust. If the patient *could* be alive, removing the heart kills them.
      *   **The "Self-Fulfilling Prophecy" Problem:** We declare death irreversible because we *plan* to take organs. If we didn't plan to take organs, we might try to resuscitate. The decision not to resuscitate makes the death permanent, but the *intent* to harvest organs drives the decision not to resuscitate. This creates a conflict of interest.
