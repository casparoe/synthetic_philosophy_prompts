      *   *The User's Core Claim:* $C_{UV}$ is unbounded. For any finite dataset, $C_{UV}$ can dwarf the signal. "Asymptotic" doesn't help finite agents. The choice of Universal Turing Machine (UTM) encodes subjective bias.

