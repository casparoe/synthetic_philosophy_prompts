answer: |-
  You are right to be skeptical. While your friend's appeal to the Invariance Theorem and Solomonoff convergence is mathematically sound in the limit, it is philosophically hollow when applied to the actual epistemic situation of finite agents in a finite universe. The claim that Kolmogorov complexity (KC) provides an *objective* foundation for Occam's Razor collapses under the weight of three critical failures: the unboundedness of the additive constant, the irrelevance of asymptotic guarantees for finite data, and the lack of a canonical reference machine.

  Here is the strongest case for your position: that Kolmogorov complexity does not eliminate arbitrariness; it merely compacts it into an uncomputable constant.

  ### 1. The "Constant" is Not a Nuisance; It is the Whole Ballgame
  Your friend argues that the difference between two universal Turing machines (UTMs) is bounded by an additive constant $C$. Mathematically, $|K_U(x) - K_V(x)| \leq C_{UV}$. They claim this constant becomes negligible as the complexity of the string $x$ grows.

  This is a sleight of hand. The Invariance Theorem guarantees that $C_{UV}$ is *fixed*, but it does not guarantee that $C_{UV}$ is *small*. In fact, for any hypothesis $H$ you care about, I can construct a UTM $U_H$ such that $K_{U_H}(H) = O(1)$. I simply hardcode $H$ into the machine's transition table as a primitive instruction.

  For you, using a standard UTM, $K_U(H)$ might be astronomical. For me, using $U_H$, it is trivial. The constant $C$ between our machines is roughly equal to $K_U(H)$. Since there is no upper bound on how complex a hypothesis can be, there is no upper bound on how large $C$ can be.

  In any realistic scenario involving finite data, the "signal" (the complexity of the pattern we are trying to find) is often of the same order of magnitude as the "bias" (the additive constant). If the constant can be arbitrarily large, it can easily dwarf the evidence available to any finite observer. Therefore, the ranking of hypotheses by simplicity is entirely reversible depending on the choice of UTM. If the ranking is reversible, Occam's Razor is not objective; it is a reflection of the bias wired into the machine.

  ### 2. Asymptotics Are a Refuge for Scoundrels (and Theorists)
  Your friend relies on Solomonoff's convergence theorem, which states that the prediction error converges to zero as evidence accumulates, regardless of the prior (provided the true distribution is computable and has non-zero prior weight).

  This is an *asymptotic* guarantee. It tells us what happens as the data stream approaches infinity. But no scientific inference happens at infinity. We operate in the "pre-asymptotic" regime.

  The rate of convergence in Solomonoff induction depends inversely on the prior probability assigned to the true hypothesis. That prior is determined by $2^{-K(H)}$. If your UTM assigns a high complexity to the true law of nature (because it doesn't have that law hardcoded), its prior weight is exponentially small. The convergence theorem bounds the total expected error by $-\ln(w)$, where $w$ is the prior weight. If $w$ is tiny because $K(H)$ is inflated by a "unfriendly" UTM, the error bound becomes massive.

  It is entirely possible that the amount of data required to overcome a biased prior exceeds the total information capacity of the observable universe. To say "you would converge if you had infinite data" is useless to a scientist who has gigabytes. An epistemic principle that only works in the limit of infinite evidence is not a principle of inference; it is a mathematical curiosity.

  ### 3. The Myth of the "Natural" Turing Machine
  For KC to rescue Occam's Razor from arbitrariness, there must be a *privileged* UTM that represents "true" simplicity. If all UTMs are equal, then simplicity is relative to the machine, not relative to the world.

  Your friend implies that all UTMs are effectively equivalent. But they are not. A UTM based on a high-level language (like Python) will assign low complexity to strings involving high-level logic. A UTM based on low-level tape operations will assign low complexity to repetitive bit patterns.

  Consider a string representing the laws of physics. In a UTM "biased" toward physics (perhaps one where the transition rules mimic cellular automata known to produce physics-like behavior), this string is simple. In a UTM biased toward, say, Shakespearean text, that same string is random noise.

  There is no mathematical criterion within KC theory to select the "correct" UTM. To choose one is to make a metaphysical commitment about the structure of reality *before* looking at the data. If you choose a UTM because you believe it reflects nature's bias, you are assuming Occam's Razor to justify Occam's Razor. You haven't grounded the razor; you've just hidden the assumption inside the definition of the Turing Machine.

  ### 4. Uncomputability Renders the "Objective" Measure Inaccessible
  Even if we grant that there *is* a true, objective simplicity, Kolmogorov complexity is uncomputable. We cannot calculate $K(x)$. We can only approximate it using compression algorithms (Lempel-Ziv, etc.).

  These approximations are not neutral. A compression algorithm designed for text will fail on images; one designed for images will fail on code. When we apply these approximations to scientific hypotheses, we are implicitly choosing a specific *type* of regularity to look for.

  If the "objective" measure is uncomputable, and the computable approximations are biased by their design, then in practice, KC offers no escape from subjectivity. It provides a formal language for discussing complexity, but not a metric for measuring it independently of the observer's tools.

  ### 5. The "No Free Lunch" Reality
  Finally, consider the No Free Lunch theorems in learning theory. They demonstrate that averaged over all possible worlds (all possible data distributions), no learning algorithm (and thus no prior/simplicity measure) performs better than any other.

  Kolmogorov complexity works well *only if* the universe is actually biased toward low-KC strings (relative to our chosen UTM). If the universe is complex in a way that mismatches our UTM, KC-based Occam's Razor will lead us astray, favoring simple falsehoods over complex truths.

  The Invariance Theorem does not prove the universe is simple. It only proves that *if* the universe is simple for one UTM, it is simple for all (up to a constant). But since we don't know if the universe is simple, nor which UTM captures that simplicity, using KC as an objective arbiter is circular. We assume our UTM matches the world to prove our UTM matches the world.

  ### Conclusion
  Your friend is defending a Platonic ideal of inference that exists only in the limit of infinite time and data. You are arguing for the reality of finite science.

  The Invariance Theorem does not remove arbitrariness; it localizes it. It sweeps all subjective bias regarding what constitutes a "simple" explanation into the choice of the reference machine and the additive constant. Since that constant can be arbitrarily large, and since we possess only finite evidence, the choice of machine dictates the conclusion.

  Kolmogorov complexity is a brilliant tool for understanding the *relationships* between description lengths, but it fails to provide the *absolute*, machine-independent foundation for Occam's Razor that it is often advertised to be. It does not save the razor from arbitrariness; it merely formalizes the arbitrariness.
