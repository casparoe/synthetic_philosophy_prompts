      *   **The Trade-off & Resolution:**
          *   Is there a way out? Reference classes matter.
          *   "Full Non-indexical Conditioning" (FNC) is a modern attempt to save SIA.
          *   My recommendation: SIA is generally preferred *if* you constrain the reference class or accept that "existence" is evidence, but the PP problem requires careful handling of priors. However, SSA's DA is often considered more damaging than PP because PP can be dismissed as "priors were wrong," whereas DA claims to change posteriors based on nothing.
