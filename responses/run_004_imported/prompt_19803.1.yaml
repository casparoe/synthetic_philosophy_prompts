answer: |-
  **Setting:** *A university coffee lounge, post-seminar. Two philosophers, ELENA (Counterfactual/Normative) and MARCUS (Process/Physicalist), are standing by the espresso machine.*

  **Marcus:** You're still holding onto the plant example, Elena. It's intuitive, I grant you, but it's metaphysically bankrupt. If causation requires a physical link—a transfer of energy or conserved quantity—then "not watering" is nothing. It's a null set. You can't have a relation between an event and a non-event.

  **Elena:** And that's why your process theory fails to map onto the world we actually navigate. If I unplug your server, your site goes down. If I *fail to renew* your SSL certificate, your site also goes down. The effect is identical. Are you really going to tell the stakeholders that in the first case I *caused* the outage, but in the second, I merely... what? "Quasi-caused" it?

  **Marcus:** Precisely. Helen Beebee nailed this. When we say the lack of water caused the death, we're stating a counterfactual dependence, sure. But we're conflating explanation with ontology. The plant died due to physiological desiccation. That's the physical cause. My failure to water is an *explanation* of why the desiccation wasn't prevented, not the cause of the desiccation itself.

  **Elena:** But that leads directly into the "everyone on Earth" problem you tried to dodge earlier. If we stick strictly to counterfactuals without norms, then *I* didn't water the plant, *you* didn't water it, the Prime Minister didn't water it. We all satisfy the counterfactual: "If X had watered it, it wouldn't have died." If omissions are just counterfactual dependencies, then the entire human population is causally responsible for that dead petunia.

  **Marcus:** Exactly! Which proves omissions aren't causes. You can't have infinite causes for a single localized event.

  **Elena:** No, Marcus, that just proves causal *selection* is context-sensitive. It's not smuggling norms in; it's acknowledging that causation is a relation between events *in a situation*. The neighbor is a cause because there was a normative expectation—a duty—that fixed him as the relevant relata. The rest of us are background conditions. We filter the ocean of counterfactuals using the normative structure of the scenario. That doesn't make the causation fake; it makes it pragmatic.

  **Marcus:** Pragmatic isn't real. Look at your own industry. You had that queue backup last month. Did the "absence of an alert" take down the service? Or did a spike in traffic overflow a buffer that lacked a pressure-release valve?

  **Elena:** The absence of the alert allowed the backlog to go unnoticed until it was critical.

  **Marcus:** See? "Allowed." The traffic spike provided the energy. The software architecture provided the vulnerability. The missing alert was just a fact about what *wasn't* there. If we treat absences as causes, we lose the ability to distinguish between what *happened* and what *didn't*.

  **Elena:** But we don't lose it, because we have the norms! In your postmortem, you didn't blame the traffic spike. You blamed the engineer who didn't configure the monitor. Why? Because causation in human systems isn't just billiard balls hitting each other. It's about deviations from a system's expected functioning. If we treat omissions as "quasi-causes," as you and Dowe suggest, you sever the link between causation and responsibility. We fire people for omissions. We hold them legally liable. If it's not a real cause, on what grounds do we punish them?

  **Marcus:** On moral grounds, not metaphysical ones! I can be morally responsible for failing to save a drowning child without my standing on the shore being the *physical cause* of their drowning. The water in their lungs caused the death. My inaction makes me blameworthy, yes, but it doesn't mean my "not-jumping" sent a physical signal into the water. We need to stop conflating *culpability* with *causality*.

  **Elena:** That's a distinction without a difference in practice. If I say "X caused Y," I am licensing an intervention on X to change Y. If I tell the engineering team, "The missing alert didn't *cause* the crash, it was just a quasi-cause," they won't fix the alerting system. They'll think the crash was inevitable physics. Treating the omission as a cause is the only way to license the fix.

  **Marcus:** Or, they fix it because they understand they have a *duty* to prevent the physical causes from aligning. You're worried that if I call it "quasi-causation," it diminishes the blame. I'm worried that if you call it "causation," you inflate the ontology. You're turning "nothing" into a "thing" just to make the blame stick.

  **Elena:** I'm turning "nothing" into a "cause" because the absence *does* the work. The hole in the ozone layer causes skin cancer. The lack of brakes causes the crash. If you insist on a physical transfer for every causal claim, you render half of our scientific and legal discourse false.

  **Marcus:** Then half our discourse is loose talk. I'd rather have a rigorous metaphysics that admits some causal claims are really explanatory shortcuts, than a metaphysics that populates the universe with ghostly "absences" acting as agents.

  **Elena:** And I'd rather have a metaphysics that explains why we actually do things, instead of one that tells the engineer who forgot the alert that, strictly speaking, they didn't cause the outage.

  **Marcus:** * (Sips coffee) * We'll have to agree that the engineer is getting fired either way.

  **Elena:** * (Smiles) * True. But the postmortem document will read very differently depending on who writes it.
