answer: |-
  Based on a rigorous examination of Thomas Aquinas's actual writings, the premise provided in your question contains a significant and historically common misinterpretation. While Aquinas did argue that political authority exists for the common good and that tyranny is unjust, **he explicitly rejected the conclusion that private citizens may justly assassinate a tyrant.**

  Therefore, to answer what **Aquinas's natural law theory** would actually say about a private citizen assassinating a dictator without public sanction: **Aquinas would condemn the act as morally illicit.**

  Here is the detailed breakdown of why Aquinas's theory leads to this conclusion, correcting the premise provided.

  ### 1. The Distinction Between Public and Private Authority
  Aquinas's natural law theory places a heavy emphasis on order and hierarchy. In his treatise *De Regno* (On Kingship), specifically Book I, Chapter 6, Aquinas addresses the question of whether it is permissible to kill a tyrant.

  *   **The Premise in your prompt:** Suggests a tyrant becomes a "private aggressor" whom *any* citizen may kill.
  *   **Aquinas's Actual View:** Aquinas argues that while a tyrant rules unjustly, the remedy must come from **public authority**, not private presumption. He writes that it is not for "private presumption" to take up the sword against a ruler. To do so is to undermine the very order of law and authority that natural law seeks to preserve.

  For Aquinas, the use of lethal force for the sake of justice is an act of **public judgment**. A private citizen lacks the *auctoritas* (authority) to execute judgment on a ruler. Without sanction from a court, legislature, or superior power, the assassination is not an act of justice, but an act of murder and sedition.

  ### 2. The Principle of the "Greater Evil"
  Aquinas applies a consequentialist analysis rooted in the common good. He argues that private attempts at tyrannicide often result in greater harm to the common good than the tyranny itself.

  *   **Risk of Worse Tyranny:** If a private citizen kills a tyrant, the successor may be even more cruel, perhaps becoming paranoid and oppressive to prevent their own assassination.
  *   **Civil Instability:** The act of private violence invites factionalism and civil war. Aquinas notes that historically, attempts by private individuals to kill tyrants have often led to the destruction of the state itself.
  *   **Natural Law Reasoning:** Since natural law dictates that we must seek the common good and avoid unnecessary harm, an act that risks plunging the community into chaos violates natural law, even if the intention (removing a tyrant) is good.

  ### 3. The Definition of Sedition
  In the *Summa Theologiae* (II-II, Q. 42), Aquinas defines sedition as a special sin opposed to the unity of the multitude. He argues that resisting public authority in a disorderly manner is seditious.

  Even if the ruler is unjust, a private individual acting alone disrupts the peace of the community. Aquinas distinguishes between resisting a ruler (which may be permissible under specific public conditions) and sedition (which is always sinful). A lone assassin acts seditiously because they are fracturing the social order without the mandate of the community.

  ### 4. The Legitimate Recourse
  Aquinas does not leave the community without recourse against a tyrant; he simply restricts *who* may act.
  *   **Public Deposition:** If the community has the right to elect the ruler, the community (as a public body, not private individuals) may depose the tyrant.
  *   **Superior Authority:** If there is a higher authority (e.g., an Emperor over a local King, or in a modern context, an international body or constitutional court), the complaint should be brought to them.

  ### Conclusion: The Verdict on the Modern Assassin
  If a private citizen today assassinates a dictator without sanction from a court, legislature, or foreign government, Aquinas's natural law theory would judge the act as follows:

  1.  **It is Murder:** Because the citizen lacks public authority, they have no right to execute judgment. The tyrant, however unjust, has not forfeited their right to life against *private* violence in Aquinas's framework.
  2.  **It is Sedition:** The act disrupts the public order and sets a precedent of private violence that endangers the stability of the state.
  3.  **It is Sinful:** Despite the good intention of removing a tyrant, the means are disordered. In natural law theory, one may not do evil (murder/sedition) that good may come of it.

  **Summary:** While the prompt suggests Aquinas would justify the assassination, **actual Thomistic philosophy would forbid it.** Aquinas holds that a tyrant may be resisted, but only by public authority acting for the common good, never by private individuals acting on their own initiative.
