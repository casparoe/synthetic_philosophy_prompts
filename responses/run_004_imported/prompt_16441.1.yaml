prompt: |-
  Next week I'm interviewing a philosopher of religion for my podcast on science and ideas, and her defence of penal substitutionary atonement leans on an unlikely source. She builds on David Lewis -- the metaphysician best known for his work on modal realism and counterfactuals -- who devoted a short, little-discussed 1997 paper, "Do We Believe in Penal Substitution?", to the question of whether punishment, like a monetary debt, could be discharged by a consenting third party on a wrongdoer's behalf. Draft eight to ten interview questions that go beyond having her restate the position: I want at least one question each on whether treating punishment as a repayable debt quietly abandons retributivism rather than rescuing it, on whose consent is doing the real moral work when an innocent substitute suffers instead of the guilty party (and whether what results still deserves to be called "punishment" rather than mere suffering), and on whether the original wrongdoer's guilt is actually discharged once the substitute has suffered, or simply left outstanding -- and for each, add a follow-up keyed to the answer she's most likely to give.
