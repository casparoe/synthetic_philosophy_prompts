answer: |-
  **Setting:** *A diner booth, 2:00 AM. Coffee cups are empty. A notebook sits open between them, filled with scribbled plot points.*

  **Elias:** You're stuck because you're trying to write a moral judgment into a physics problem.

  **Mara:** It's not physics. It's a story about a man who destroys a life.

  **Elias:** It's a story about a man who drove drunk. That's the choice. The kid stepping off the curb? That's the roll of the dice. If you punish Driver B more than Driver A, you're punishing luck. That violates the Control Principle. We are only morally assessable on what we control.

  **Mara:** But we don't live in the control principle, Elias. We live in the world. Driver A drove drunk and went to sleep. Driver B drove drunk and killed a child. They aren't the same man anymore.

  **Elias:** At the moment of the decision—the moment they put the key in the ignition—they were identical. Morally identical. If Driver B is more blameworthy, it's solely because the universe handed him a worse random number generator. Why should moral guilt depend on whether a pedestrian happened to exist?

  **Mara:** Because morality isn't just about the internal state of the agent. It's about the relationship between the agent and the world. When Driver B hits that kid, he enters a specific kind of relationship with death, with grief, with a family. Driver A doesn't. That difference is real. It's not just in our heads.

  **Elias:** It's real *consequentially*, sure. But is it real *morally*? If I shoot a gun into the air and it comes down and hits someone, I'm a murderer. If it lands in a field, I'm just reckless. Same action. Same intent. If my moral status changes based on where gravity drops the bullet, then morality is just a scoreboard for chaos.

  **Mara:** That's too clean. You're treating the action like a snapshot. But actions unfold. Bernard Williams talked about this. Agent-regret. It's not just guilt. Guilt is "I did wrong." Agent-regret is "I did *this*." Even if it was an accident, the driver who hits the kid has a reason to feel something the other driver doesn't. A specific weight.

  **Elias:** But Williams was talking about lorry drivers who couldn't have known a kid would run out. These guys are *wasted*. They're already negligent. So the guilt is already maxed out. Adding more blame because of the outcome is just society's bloodlust. We want a sacrifice. Driver B just happened to be the one the altar accepted.

  **Mara:** No. It's not bloodlust. It's acknowledgment. Driver B has a debt. Driver A does not.

  **Elias:** A debt to whom?

  **Mara:** To the dead. To the truth of what happened.

  **Elias:** You can't owe a debt based on luck. That makes justice arbitrary. Imagine a court where the judge says, "You're equally guilty, but you, sir, get twenty years because a child was present," and the other guy gets a fine. If they were equally reckless, the disparity is unjust. It implies Driver B is a worse *person*. But he isn't. He's just a worse *gambler*.

  **Mara:** He isn't a worse person *before* the crash. But he is a different person *after*. You're freezing the moral evaluation at the moment of intoxication. But we evaluate lives narratively. The story of Driver B is now a tragedy. The story of Driver A is a near miss. Those aren't the same story. And if the story is different, the moral evaluation of the protagonist has to shift.

  **Elias:** That's aesthetic, not ethical. You're saying the story is more compelling, so the blame must be heavier.

  **Mara:** I'm saying the harm actualizes the risk. When Driver A drives home, the harm is potential. When Driver B hits the kid, the harm is actual. Morality cares about harm. If I swing a bat at your head and miss, I'm an assailant. If I connect, I'm a killer. The swing was the same. The moral reality of the act changed on impact.

  **Elias:** But why? If the intent was "I don't care if I hurt someone," that intent is fully present in the miss. The only reason the law treats them differently is pragmatic. We need to deter the outcome. But morally? Deep down? You know it's luck. If you tell Driver B, "You are worse than Driver A," he should say, "No, I'm just unluckier."

  **Mara:** He shouldn't say that. He should say, "I killed someone." That fact attaches to him. It's not a label we put on him; it's a stain he carries. You want to isolate the will from the world. But the will acts *in* the world. When the world pushes back with blood, that changes the nature of the will's action.

  **Elias:** It changes the *tragedy*, Mara. Not the *culpability*. If you say the culpability changes, you have to accept that if a saint gets struck by lightning and kills someone, they are suddenly less saintly.

  **Mara:** A saint wouldn't be driving drunk.

  **Elias:** Fine. A careful driver hits a kid who jumps out from behind a blind spot. Are they morally tainted?

  **Mara:** Yes. That's Williams' point exactly. They feel agent-regret. They feel responsible, even if they aren't to blame. Now multiply that by ten when they *are* to blame. The outcome amplifies the moral weight. It's not just about what they intended. It's about what they brought into existence.

  **Elias:** But if that weight is real, then morality is fundamentally unfair. And I can't build a system of justice on unfairness. I can't tell Driver B, "You deserve more punishment," without implying he did more wrong. He didn't do more wrong. He got less lucky.

  **Mara:** Maybe "deserve" isn't the right word. Maybe "require" is. The world requires a different response from him. He has to live with a death. Driver A doesn't. If you treat them exactly the same, you're erasing the kid. You're saying the kid's life doesn't factor into the moral equation of the driver.

  **Elias:** The kid factors into the *sentence*, not the *sin*.

  **Mara:** That's a distinction without a difference. You can't separate the sin from the consequence when the consequence is the point of the sin's prohibition. We say "don't drive drunk" *because* people might die. If they don't die, the violation is incomplete.

  **Elias:** So the commandment is actually "Don't drive drunk and kill someone"?

  **Mara:** No. The commandment is "Don't create the risk." But the moral gravity of breaking that commandment is measured by what the risk consumes.

  **Elias:** (Leans back, shaking his head) So you're willing to accept that two men can be equally wicked, but one is ten times more guilty, just because the wind blew the wrong way.

  **Mara:** I'm willing to accept that wickedness isn't a static number in a vacuum. It's an interaction. And when that interaction ends in a body, the morality changes.

  **Elias:** Then morality isn't about us. It's about the fallout.

  **Mara:** Morality is about how we live with the fallout. Driver B can't live the same way Driver A does. And that difference *is* the difference in blameworthiness.

  **Elias:** It's a difference in tragedy. Not truth.

  **Mara:** (Closes the notebook) In a story, Elias, tragedy *is* the truth.

  **Elias:** (Stares at the empty coffee cup) Then it's a hell of a way to run a universe.

  **Mara:** Yeah. It is.
