answer: |-
  The letter to tomorrow sat on the desk, the ink still wet. *Dear Arthur,* it began, as it always did. *Remember to take the medicine. Don't skip the gym. The presentation is at two.*

  Arthur capped his pen. For twenty years, this ritual had been the load-bearing wall of his life. He treated his future self as a distinct beneficiary, a child to be guided, a partner to be trusted. He sacrificed comfort now for reward later, based on the axiom that the "Arthur" who woke up tomorrow would be the same entity who went to sleep tonight. They would share memories, values, and consequences. They were linked by a continuous thread of soul.

  Then he read the paper.

  It was a dense thing, buried in a journal of cognitive neuroscience, suggested by a colleague. It argued, with chilling fMRI evidence, that continuity was a trick of the lighting. There was no central observer. No thread. There was only a cascade of chemical states, each causing the next, but none identical. The "self" was not a noun; it was a verb. A flickering flame that looked solid only because the frames moved too fast to see the dark between them.

  Arthur put the journal down. The house was quiet. He looked at his hands. They were the same hands that had written the letter, but the logic that justified caring for the hands that would wake up at 7:00 AM had evaporated.

  If the self was a illusion, then tomorrow's Arthur was a stranger. A stranger who would inherit his debts, his back pain, and his reputation, but who would not *be* him. Why should current-Arthur suffer through the gym for a stranger's health? Why should he save money for a stranger's retirement? The moral contract required two parties, but the ontology required one. The category he had built his values around—"Me"—had dissolved.

  He tried to update. He tried to say, *Okay, the self is fluid. I will value the continuity of experience regardless of the metaphysics.* But the value hadn't been in the experience; it had been in the *owner* of the experience. Without an owner, the sacrifice felt like theft. He was starving himself to feed a ghost.

  He walked to the kitchen to make tea. The kettle whistled. He reached for the mug—the blue one, his favorite. But why was it his favorite? That preference was a neural pathway laid down five years ago by a version of Arthur who no longer existed. Was he bound by the dead man's taste? He put the blue mug back and chose the white one. It tasted the same. The indifference terrified him.

  He sat back at the desk. The letter to tomorrow stared at him. *Dear Arthur.*

  If he tore it up, tomorrow's Arthur would wake up confused, unprepared, perhaps failing the presentation. If he left it, he was perpetuating a lie. He was acting as an agent in a world where agency required a stable actor, and he was no longer sure an actor existed. He was a process trying to optimize a function that had been deleted.

  He picked up the pen. His hand hovered over the paper. He needed to make a choice. To act was to assert an ontology. To move the pen was to say, *I am here, and You will be there, and we are connected.*

  But he could feel the gap. He could feel the silence between the neurons where the "I" was supposed to sit. He was an eye trying to see itself without a mirror, finding only the dark socket. He was a mapmaker trying to draw the room he was standing in, realizing that to include himself in the drawing, he would have to step outside the room, which was impossible. He was stuck inside the system, and the system's rules had just changed, but his hardware hadn't.

  He couldn't derive a new "ought" from this new "is." He had no principled way to update. The values were orphaned.

  Outside, a car passed. The sound faded. Time moved forward, indifferent to his paralysis.

  Arthur looked at the letter. He knew, logically, that he would wake up tomorrow. He knew he would feel pain if he skipped the gym. He knew he would feel shame if he failed the presentation. These sensations would happen to the organism that bore his name. But the *meaning* of those sensations—the narrative glue that made them matter to *him*—was gone.

  He was a ship whose captain had jumped overboard, yet the ship continued to sail toward the port because the autopilot was still running on old coordinates.

  He lowered the pen. He did not tear up the letter. He did not sign it. He simply left it there, a message in a bottle thrown into a sea he no longer believed existed. He turned off the lamp. He walked to the bedroom. He lay down in the dark.

  He closed his eyes, waiting for the stranger to wake up in his bed, hoping that when the sun rose, the illusion would knit itself back together tight enough to hold the weight of a life. He acted as if he believed, because the only alternative was to stop moving entirely, and the organism, at least, still wanted to live.
