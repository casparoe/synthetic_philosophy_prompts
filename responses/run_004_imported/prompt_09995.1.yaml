answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I had the privilege of serving as [Bride]'s doctoral advisor. That means I spent the better part of five years reading drafts of her work on David Lewis and counterpart theory. So, I know a thing or two about her patience, her intellect, and her stubbornness.

  Looking around this room, I realize we have a unique demographic split. Roughly half of you are philosophers who understand the difference between *de re* and *de dicto* modality. The other half are family and friends who are just happy there is an open bar. My job tonight is to bridge that gap. To the family: don't worry, I will keep the jargon to a minimum. To the philosophers: please, put down your pens; this is not a peer review.

  [Bride] and [Groom] have a love story that begins where most relationships end: in a heated disagreement. As the legend goes, they met at a graduate conference, arguing over the Humphrey Objection. For the family, the short version is this: they met arguing about whether you are the same person across different possibilities, or just a collection of lookalikes scattered across reality.

  [Groom], a man of Kripkean conviction, believes he is the same essential person in every possible world. [Bride], a loyal Lewisian, believes she is bound to this world, and only her counterparts exist in others. It is a fundamental metaphysical disagreement. And yet, here they are.

  They asked me to speak about their vows, specifically the promise to love one another "in every possible world." Now, I have to point out that for this couple, that phrase carries a slight translation error.

  For [Groom], loving [Bride] in every possible world means *he* travels through reality to find her. But for [Bride], strictly speaking, *she* stays here, and she is promising to love the guy in every other world who is sufficiently similar to [Groom].

  So, [Groom], take comfort in this: if you ever disappoint her in this world, technically, it wasn't *you* who disappointed her in the other worlds. But [Bride], you have a harder task. You have to make sure that in this world, you haven't accidentally married a counterpart who just *looks* like the man you love, but lacks his essential properties—like his ability to load the dishwasher correctly.

  I say this in jest, of course. Because while they may disagree on the mechanics of modality, they agree on the necessity of their commitment.

  In philosophy, we spend our lives analyzing what makes a proposition true. We look for conditions, for counterexamples, for loopholes. But watching these two together, I have learned that love is not a proposition to be analyzed. It is a reality to be inhabited.

  [Bride], you taught me that similarity can be enough to ground a relationship. [Groom], you taught us that identity can endure through change. Together, you have shown us that it doesn't matter if you are the same person in every world, or different people in every world. What matters is that in *this* world, right now, you are choosing each other.

  The Humphrey Objection asks why Humphrey should care if his counterpart wins the election, since it isn't *him* winning. But looking at you two, the answer is clear. Humphrey didn't care because he didn't love his counterpart. You two love each other enough that the distinction doesn't matter. You have found a way to make the logic work, not by solving the puzzle, but by outgrowing it.

  So, let us raise a glass.

  To [Bride] and [Groom]. May your love be necessary, not contingent. May your happiness be true in all accessible worlds. And may you never let a semantic distinction get in the way of a genuine apology.

  To the happy couple!
