      *   **Constraint 1:** Time limit (approx. 5 minutes, roughly 600-750 words spoken at a moderate pace).
      *   **Constraint 2:** One *good* joke about Counterpart Theory vs. Transworld Identity that lands with philosophers but doesn't alienate the family.
      *   **Constraint 3:** Tone must be affectionate, not an adjudication of the dispute. It's about *them*, not just the philosophy.

  2.  **Deconstruct the Philosophy (for the joke and themes):**
      *   *Counterpart Theory (Lewis):* You are world-bound. You don't exist in other worlds. There are *counterparts* of you in other worlds who are similar to you. "I could have been a baker" means "There is a baker in another world who resembles me."
      *   *Transworld Identity (Kripke/Plantinga):* You exist in multiple worlds. The *same* you is in other worlds doing different things. "I could have been a baker" means "I, myself, am a baker in another world."
      *   *The Conflict:* If the bride says "I love you in every world," she means "I love every counterpart of you." If the groom says it, he means "I, the same me, love you everywhere."
      *   *The Humphrey Objection:* Basically, why should Humphrey care about a counterpart winning the election? It's not *him*.
      *   *The Joke Opportunity:* The tension between "same person" vs. "similar person." If they fight, is it the same fight in every world? If they make up, is it the same making up?

  3.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone, acknowledge the dual nature of the room (philosophers and family). Establish the relationship (advisor/student).
      *   **The Backstory:** Mention how they met (Humphrey Objection argument). This sets the stage for the intellectual romance.
      *   **The Philosophy (Light Touch):** Explain the core difference simply enough for family, deeply enough for philosophers.
      *   **The Joke:** This needs to be the centerpiece. It needs to highlight the incompatibility of their views regarding the vows without suggesting their marriage is doomed.
      *   **The Resolution/Affection:** Move away from the technical dispute to the emotional truth. Why does the philosophy matter less than the love?
      *   **Closing:** The actual toast.

