answer: |-
  You have hit on a crucial and often under-discussed tension in the literature. Your intuition is correct: **if Parfit's Hitchhiker is analyzed at the moment of decision *in town* (ex-post), standard Evidential Decision Theory (EDT) collapses into Causal Decision Theory (CDT), and both recommend defecting.**

  The standard narrative that "EDT solves Hitchhiker while CDT fails" relies on a specific, somewhat unstable application of EDT (usually *ex-ante* or by treating the decision as evidence of one's type in a way that ignores the known evidence of survival).

  Here is an argument supporting your position: that Hitchhiker is not a victory for EDT over CDT, but rather an indictment of **act-based** theories (both CDT and EDT) in favor of **policy-based** or **updateless** theories (like Functional Decision Theory or Updateless Decision Theory).

  ### 1. The "Screening Off" Problem for EDT
  Your core objection relies on the fact that once you are in town, the event "I was picked up" is a known fact ($P(\text{Saved}) = 1$).

  *   **CDT:** Calculates $E[\text{Utility}]$ based on causal consequences. Since the prediction is in the past, paying causes only a loss of \$1000. **Verdict: Don't Pay.**
  *   **EDT:** Calculates $E[\text{Utility}]$ based on conditional probabilities $P(\text{Outcome} | \text{Act})$.
      *   If I condition on "I Pay," what is the probability I was picked up? Since I am sitting in the cafe, I *know* I was picked up. $P(\text{Saved} | \text{Pay}) = 1$.
      *   If I condition on "I Don't Pay," what is the probability I was picked up? I am still sitting in the cafe. $P(\text{Saved} | \text{Don't Pay}) = 1$.

  Because the knowledge of being in town **screens off** the correlation between your current action and the past prediction, EDT sees no evidential link between paying and survival. The only remaining variable is the money. Thus, at the moment of decision, **EDT also says: Don't Pay.**

  For EDT to recommend paying, it must ignore the evidence that it is already in town. But ignoring known evidence is antithetical to the spirit of Bayesian conditioning that underpins EDT.

  ### 2. The "Ex-Ante" Defense and Dynamic Inconsistency
  Proponents of EDT often rescue the theory by arguing that the decision should be evaluated **ex-ante** (in the desert, before the prediction is made).
  *   *Ex-ante:* $P(\text{Saved} | \text{Policy: Pay})$ is high. $P(\text{Saved} | \text{Policy: Don't Pay})$ is low.
  *   Therefore, the EDT agent *in the desert* wants to be the kind of agent who pays.

  However, this reveals a fatal flaw: **Dynamic Inconsistency.**
  An EDT agent in the desert plans to pay. An EDT agent in the town plans not to pay. Since the agent in the town knows the plan of the agent in the desert, and knows that the prediction is already fixed, the EDT agent has no mechanism to bind their future self.

  If a decision theory prescribes Plan A at Time 1 and Plan B at Time 2, and the agent knows this will happen, the theory fails to guide action effectively. The predictor knows the agent will be dynamically inconsistent, predicts "Don't Pay," and leaves the agent in the desert.

  Therefore, claiming "EDT solves Hitchhiker" is only true if you assume the agent can precommit or if you evaluate the theory from a God's-eye view *ex-ante*. But decision theory is supposed to tell the agent what to do *now*. At the "now" of the cafe, EDT fails just as hard as CDT.

  ### 3. The Real Divide: Act-Based vs. Policy-Based
  Your suggestion that the problem is "evaluating acts node by node instead of by policy" aligns perfectly with the critique offered by proponents of **Functional Decision Theory (FDT)** and **Updateless Decision Theory (UDT)**.

  *   **Act-Based (CDT & EDT):** These theories ask, "Given that I am here, now, with this history, which *act* maximizes utility?" They treat the decision as an isolated event. They update on all available information (including "I am in town"), which severs the logical link to the past prediction.
  *   **Policy-Based (FDT/UDT):** These theories ask, "Which *output* of my decision algorithm maximizes utility?" They treat the decision not as a physical act occurring in time, but as the result of a logical function.

  **Why Policy-Based Theories Win:**
  The predictor did not simulate your physical atoms; they simulated your *decision algorithm*.
  *   If your algorithm outputs "Pay" when presented with the "In Town" node, the simulation output "Pay," and you were picked up.
  *   If your algorithm outputs "Don't Pay" when presented with the "In Town" node, the simulation output "Don't Pay," and you were left in the desert.

  FDT/UDT maintains **subjunctive dependence** (logical correlation) between your current decision and the past prediction, even though there is no causal link and even though you have updated on being in town. They do not treat the fact "I am in town" as a reason to break the logical link between their algorithm and the predictor's simulation.

  ### 4. Conclusion: The Literature's Mistake
  You are justified in arguing that treating Hitchhiker as a point for EDT over CDT is a mistake. It relies on conflating two different questions:
  1.  **Which theory gets the right answer ex-ante?** (Both EDT and FDT can, CDT cannot).
  2.  **Which theory provides a stable prescription ex-post?** (Only FDT/UDT can).

  Standard EDT fails the second question. If a decision theory tells you to make a plan you know you will break, it is practically useless in high-stakes Newcomblike problems.

  The Hitchhiker problem is best understood as a demonstration that **rationality requires evaluating policies, not just acts.** It shows that an agent must be able to reason as if their current decision determines the past prediction (via logical correlation), rather than reasoning as if the past is fixed and independent of their current choice.

  So, your seminar's framing was likely a simplification. The "Rational Irrationality" of Hitchhiker isn't about Evidential vs. Causal counterfactuals; it is about **Updateless/Policy-based** vs. **Updateful/Act-based** reasoning. Both CDT and standard EDT are "updateful" in a way that causes them to defect in the cafe, ensuring their own demise in the desert.

  **Summary of the Argument:**
  1.  **Ex-Post Collapse:** Once in town, known survival screens off the correlation for EDT, making it converge with CDT (Don't Pay).
  2.  **Dynamic Inconsistency:** EDT only works *ex-ante*, implying the agent cannot trust their future self, which the predictor anticipates.
  3.  **The Real Solution:** Success requires a theory that evaluates the decision *algorithm* (Policy) rather than the specific *act* in context, preserving logical dependence on the prediction (FDT/UDT).
  4.  **Verdict:** Hitchhiker is a failure for all act-based theories (CDT & EDT), not a victory for EDT.
