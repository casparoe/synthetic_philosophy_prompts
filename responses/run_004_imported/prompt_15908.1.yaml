      *   *EDT:* Uses conditional probabilities $P(O | A)$.
      *   *The Crux:* If $O$ (being in town) is known, $P(O|A) = 1$ for all $A$. The correlation is broken by the knowledge.
      *   *FDT/UDT:* Uses subjunctive dependence / logical correlation. $P(\text{Prediction} | \text{Algorithm outputs Pay})$.
