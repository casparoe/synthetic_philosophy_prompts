answer: |-
  Einstein bursts into Carnap's office, waving a manuscript. "Rudolf! General Relativity accounts for the exact 43 arcseconds of Mercury's perihelion precession!"

  Carnap barely looks up from his probability tables. "Albert, when was the anomaly discovered?"

  "1859. Le Verrier."

  Carnap sighs and closes the manuscript. "Then I'm afraid I can't update my credence. Since $E$ is already known, $P(E) = 1$. And since your theory entails the evidence, $P(E|H) = 1$."

  "So?"

  "So by conditionalization, $P(H|E) = \frac{P(E|H)P(H)}{P(E)} = \frac{1 \cdot P(H)}{1} = P(H)$." Carnap taps the equation. "Your posterior is identical to your prior. Mathematically, this evidence confirms nothing."

  "But it fits perfectly!" Einstein protests. "It solves the problem!"

  "Fit is psychological; confirmation is probabilistic. You cannot surprise me with history."

  "So what do I do?" asks Einstein. "Find a new planet?"

  "No," says Carnap, opening a notebook labeled *Counterfactual Credence Reconstruction*. "I'm going to sit here and try to model what my degree of belief in Mercury's orbit *would have been* in 1850 if I hadn't known Newtonian mechanics was incomplete. If I can successfully pretend I'm logically non-omniscient regarding the 19th century, I might be able to assign $P(E) < 1$ and let you update me."

  Einstein stares. "So to prove my theory is true, you have to pretend you're ignorant?"

  "Technically," corrects Carnap, "I have to pretend I'm *uncertain*. There's a difference."
