answer: |-
  Your skepticism is well-founded. Your friend has made a sophisticated but fundamental category error. She is conflating the **assumptions** of Arrow's theorem with its **conclusions**.

  To put it bluntly: Arrow's Impossibility Theorem does not prove that interpersonal utility comparisons (IUCs) are impossible. Rather, it proves that **if** you assume interpersonal utility comparisons are impossible (or simply exclude them from your data), **then** you cannot construct a perfect voting system.

  Here is the precise breakdown of where her argument fails, why economists are not necessarily being sloppy, and how the two concepts actually relate.

  ### 1. The Logical Flaw: Assumptions vs. Conclusions
  Arrow's theorem is a conditional statement (an "If-Then" proposition).
  *   **The Input:** The theorem assumes that the only information available to the social planner is **ordinal** preference rankings for each individual (e.g., Alice prefers X to Y, Bob prefers Y to X). Crucially, the theorem assumes these rankings are **not comparable** across persons. We know Alice likes X better than Y, but we do not know *how much* better, nor do we know if Alice's preference is "stronger" than Bob's.
  *   **The Output:** Given *only* that restricted information, no aggregation rule can satisfy a set of reasonable fairness criteria (Pareto efficiency, Independence of Irrelevant Alternatives, Non-dictatorship, etc.).

  Your friend is interpreting the theorem as: *"Because aggregation is impossible, IUCs must be incoherent."*
  The actual logic is: *"Because we excluded IUCs from the input, aggregation is impossible."*

  Arrow did not prove that IUCs are metaphysically impossible; he simply built a model that excluded them to see what would happen. The "impossibility" result is a direct consequence of that informational starvation.

  ### 2. Amartya Sen and the "Informational Basis"
  The Nobel laureate Amartya Sen, who did more than anyone to clarify this exact confusion, demonstrated that Arrow's impossibility vanishes the moment you relax the informational constraints.

  Sen showed that if you allow the social welfare function to access more information—specifically, **cardinal utility** (intensity of preference) that is **interpersonally comparable**—the impossibility disappears.
  *   If you can say "Alice gains 10 utils from X and Bob loses 5 utils from X," and you accept that Alice's "util" is comparable to Bob's, you can simply sum the utilities (Utilitarianism).
  *   This satisfies all of Arrow's conditions.

  Therefore, Arrow's theorem actually highlights the **value** of interpersonal comparisons. It shows that without them, social choice is paralyzed. It does not show that making them is incoherent.

  ### 3. The Status of Interpersonal Utility Comparisons
  Your friend argues that IUCs are a "category mistake." This is a philosophical claim (rooted in logical positivism or behaviorism), not a mathematical one.
  *   **The Philosophical Objection:** Strict behaviorists argue that because we cannot directly observe another person's mental state, statements like "I am in more pain than you" are meaningless.
  *   **The Modern View:** Most philosophers and economists today reject the strict behaviorist view. We rely on empathy, neuroscience, and behavioral proxies to make reasonable estimates of others' welfare. When we say a burning hand hurts, we assume it hurts others similarly.

  Arrow's theorem has no bearing on this philosophical debate. It is a theorem about logic and aggregation, not about the philosophy of mind. Using Arrow to settle the metaphysical status of utility is like using the Heisenberg Uncertainty Principle to argue that political polling is impossible. One is a mathematical constraint on a specific model; the other is an empirical/ethical practice.

  ### 4. Are Economists Being Sloppy?
  Your friend claims economists are sloppy for using IUCs (e.g., "a dollar is worth more to a poor person"). They are not, provided they are clear about their framework.

  *   **Positive Economics:** When analyzing markets, economists often stick to Pareto efficiency (where no IUCs are needed). If a policy makes someone better off without hurting anyone, Arrow's theorem doesn't block that.
  *   **Normative/Welfare Economics:** When recommending redistribution, economists explicitly adopt a **Social Welfare Function (SWF)**. An SWF is an ethical formula (e.g., $W = U_1 + U_2 + ...$) that *assumes* IUCs are valid.

  When an economist says, "We should tax the rich to help the poor because of diminishing marginal utility," they are not claiming this follows from Arrow's theorem. They are claiming that Arrow's theorem shows the limits of *pure preference aggregation*, so we must supplement it with an ethical assumption (the SWF) that permits comparisons. That is not sloppiness; it is transparency about ethical premises.

  ### 5. Summary of the Rebuttal
  You can tell your friend that her argument fails on three specific grounds:

  1.  **Direction of Implication:** Arrow proves that *without* IUCs, aggregation fails. He does not prove that *with* IUCs, aggregation fails (it doesn't).
  2.  **Informational Constraint:** The "impossibility" is a result of artificially restricting the data to ordinal rankings. It is a feature of the model, not a feature of reality.
  3.  **Category Error:** A theorem about voting systems cannot settle a metaphysical dispute about the nature of consciousness or utility.

  **The Verdict:** You win the argument. Arrow's theorem is the reason we *need* interpersonal utility comparisons to make coherent policy, not the reason we cannot have them. Your friend has mistaken a warning sign for a roadblock.
