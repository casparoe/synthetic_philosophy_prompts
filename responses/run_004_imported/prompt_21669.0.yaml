      *   **The "New Welfare Economics" (Paretian):** Dominant in mid-20th century. Avoided IUCs. Relied on Pareto efficiency. Arrow fits here.
      *   **The "Old Welfare Economics" (Utilitarian):** Bentham, Pigou. Relied on IUCs.
      *   **Arrow's Input:** The theorem takes a profile of individual preference orderings. It does *not* take utility functions that are comparable across persons.
