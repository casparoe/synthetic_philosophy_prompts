  Both Leah and Owen are overlooking the fact that the modern debate has largely shifted from "Is CH true?" to "What is the goal of set theory?" The dichotomy they present (Universe vs. Multiverse) is accurate, but the technical landscape is more nuanced. On Owen's side, Hugh Woodin's work on "Ultimate L" attempts to construct a canonical inner model that might settle CH objectively, relying on deep structural regularities. On Leah's side, the Multiverse view isn't just about "anything goes," but about studying the relationships between different forcing extensions as mathematical objects in their own right. The disagreement is less about whether CH has a truth value and more about whether the concept of "set" is singular and definite or inherently pluralistic. Neither side has a knockout argument because the dispute is now foundational and methodological, not merely logical.
