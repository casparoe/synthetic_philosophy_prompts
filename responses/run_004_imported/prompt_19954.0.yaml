prompt: |-
  I started a new job like three weeks ago doing growth marketing for a small online furniture store, and part of my onboarding was setting up these "urgency" elements on the product pages — the "only 2 left in stock!" banners, the countdown timers, the "6 people are looking at this right now" popups. My manager kind of casually mentioned that a bunch of those numbers are just randomized by the plugin we use, not actual live inventory or visitor counts, and something about that has been bugging me ever since, but I also can't really afford to make a scene about it three weeks into a job I need.

  I brought it up at dinner with my roomate, who's taking a night-school intro ethics class and has been Kant-pilled all semester, and she said it obviously fails his whole universalizability thing, because "the categorical imperative is basically just the golden rule — ask if you'd want it done to you, and you clearly wouldn't want to be tricked like that, so it's wrong, case closed." That sounded right to me at the time, like Kant just formalized "treat others how you want to be treated" with extra steps. But then I went down a rabbit hole later and found people saying Kant actually thought the golden rule was a bad, sloppy principle and specifically ripped on it in a footnote somewhere, which threw me off — if his big famous test is essentially a fancier golden rule, why would he go out of his way to trash the golden rule itself? Is my roomate's read actually wrong, and are the categorical imperative and the golden rule not really the same move underneath? If they're genuinely different, could you walk through how they might actually give different verdicts, ideally using my dumb fake-scarcity-banner situation (or a close variant of it) so I can see where they'd pull apart instead of just being told they're "different in theory"?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation and Question:**
      *   **Context:** The user is a new growth marketer (3 weeks in) at a small online furniture store.
      *   **Problem:** They discovered the "urgency" elements (low stock, visitor counts) are fake/randomized.
      *   **Conflict:** It bugs them ethically, but they fear job security if they make a scene.
      *   **Trigger:** A roommate (taking an ethics class) claimed Kant's Categorical Imperative (CI) is just the Golden Rule (GR) formalized, and therefore the fake banners are wrong.
      *   **Discovery:** The user found sources claiming Kant *rejected* the Golden Rule.
      *   **Core Question:** Are the CI and GR actually the same? If not, how do they differ? Specifically, apply this difference to the fake scarcity banner scenario to show how they might yield different verdicts or reasoning.

  2.  **Deconstruct the Philosophical Concepts:**
      *   **The Golden Rule (GR):** "Do unto others as you would have them do unto you." (Positive formulation) / "Do not do to others what you would not want done to you." (Negative/Silver Rule).
          *   *Basis:* Empathy, reciprocity, personal preference.
          *   *Weakness:* Depends on the agent's desires. If I don't mind being lied to, can I lie? If I'm a masochist, can I hurt others? It's subjective.
      *   **Kant's Categorical Imperative (CI):** Specifically the Formula of Universal Law ("Act only according to that maxim whereby you can at the same time will that it should become a universal law").
          *   *Basis:* Reason, duty, objective rationality.
          *   *Key Distinction:* It's not about what you *want* to happen to you, but what can *logically* be a law for everyone without contradiction.
      *   **Kant's Critique of GR:** Kant explicitly criticizes the GR in *The Metaphysics of Morals*. He argues it doesn't ground duties to oneself, doesn't account for strict duties (like justice), and relies on inclination rather than reason.

  3.  **Address the Core Question (CI vs. GR):**
      *   Yes, the roommate is technically wrong (or at least imprecise). Kant did distinguish them.
      *   Why? GR is based on *inclination* (what I want). CI is based on *reason* (what is logically consistent).
      *   Example: A judge sentencing a criminal. The judge wouldn't want to be sentenced (GR), but must sentence based on duty (CI).

  4.  **Apply to the Specific Scenario (Fake Scarcity Banners):**
      *   **Golden Rule Analysis:**
          *   *Question:* Would I want to be tricked by fake banners when I'm buying furniture?
          *   *Answer:* Probably not. I value honesty.
          *   *Verdict:* Don't do it.
          *   *Nuance:* What if the marketer thinks, "I don't care if I get tricked, I know how the game works"? Then GR might allow it. This shows the weakness.
      *   **Categorical Imperative Analysis (Formula of Universal Law):**
          *   *Maxim:* "I will use fake scarcity indicators to increase sales when real inventory data isn't compelling."
          *   *Universalize:* Imagine a world where *every* online store uses fake scarcity indicators.
          *   *Contradiction:* If everyone does it, consumers learn that "2 left in stock" means nothing. Trust in the signal evaporates. The tactic stops working. The very concept of "scarcity indicator" becomes meaningless.
          *   *Contradiction in Will:* You cannot rationally will a world where trust in commerce is destroyed, because you rely on trust to conduct your own business (even as a seller).
          *   *Verdict:* Don't do it.
      *   **Formula of Humanity (Second formulation of CI):**
          *   *Principle:* Treat humanity always as an end, never merely as a means.
          *   *Application:* Using fake banners manipulates the customer's psychology to bypass rational decision-making. It treats them as a tool for revenue, not a rational agent capable of making informed choices.
          *   *Verdict:* Don't do it.

  5.  **Synthesize the Difference in Verdicts/Reasoning:**
      *   In *this specific case*, both likely say "No."
      *   *However*, the *reasoning* is different.
      *   GR: "I wouldn't like it." (Subjective)
      *   CI: "It destroys the system of trust required for the action to make sense." (Objective/Systemic)
      *   *Where they pull apart:* Need an example where GR says "Yes" but CI says "No" (or vice versa).
          *   *Example:* Punishment. GR says "Don't punish (I wouldn't want punishment)." CI says "Punish (Justice requires it, universal law)."
          *   *Example:* The Masochist. GR says "Hurt others (I like being hurt)." CI says "Don't hurt (Violates duty to humanity)."
      *   *Back to the User's Case:* The CI argument is stronger for a business context because it focuses on the *system of commerce* rather than personal feelings.

  6.  **Drafting the Response:**
