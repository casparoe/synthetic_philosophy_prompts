      *   **Kant's Critique:** Explain *why* Kant rejected GR (inclination vs. reason, duties to self, strict duties).
      *   **The Furniture Scenario (GR):** Walk through the roommate's logic. Highlight the flaw (what if you *don't* mind?).
      *   **The Furniture Scenario (CI):** Walk through Universal Law. Show the "Contradiction in Conception" (trust erosion). Show the "Contradiction in Will" (undermining commerce). Mention Formula of Humanity (manipulation).
      *   **Where they Diverge:** Give a clear example where they disagree (e.g., the Judge or the Masochist) to prove they aren't the same.
      *   **Practical Advice (Optional but helpful):** Briefly touch on the job risk without giving legal/career advice. Focus on the philosophical clarity first. (Decided to keep it focused on the philosophy as requested, but acknowledge the job tension).

