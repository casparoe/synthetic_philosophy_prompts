answer: |-
  **MEMORANDUM**

  **TO:** Forecasting Program Working Group
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Scoring Methodology for Q4

  **Recommendation**
  I propose we adopt a **Dual-Track Scoring System**:
  1.  **Public Leaderboard:** Switch to the **Logarithmic Score**.
  2.  **Performance Reviews:** Retain the **Brier Score**, supplemented by a calibration/resolution breakdown.

  This approach resolves the current impasse by acknowledging that our program serves two distinct functions: *epistemic training* (best served by the Log score) and *personnel evaluation* (best served by the Brier score).

  **Context and Diagnosis**
  Our disagreement stems from conflating two different objective functions. Side A argues from **epistemic utility**: following Joyce and Pettigrew, only the Log score is strictly proper and local, meaning it uniquely incentivizes reporting true credences without regard for how probability mass is distributed among non-events. Side B argues from **incentive compatibility**: in a high-stakes HR context, the Log score's unbounded downside creates excessive risk aversion, encouraging forecasters to hedge toward 50% to avoid career-damaging outliers.

  Both arguments are correct within their own domains. The Log score is indeed theoretically superior for measuring accuracy and encouraging sharpness. However, Side B is equally correct that an unbounded metric introduces noise and perverse incentives when tied to compensation or promotion. When we use a single metric for both learning and evaluation, we force a trade-off between theoretical purity and behavioral stability.

  **Rationale for the Dual-Track**

  **1. Leaderboard (Logarithmic Score)**
  The leaderboard's purpose is engagement and skill-building. Here, we want to maximize epistemic rigor. Adopting the Log score here validates Side A's core insight: we signal that the organization values *locality* and sharp probabilistic distinction. It allows our best forecasters to compete on true accuracy without the "safety" of the Brier score's quadratic buffer. Since the leaderboard is "for fun," the variance that worries Side B is a feature, not a bug—it highlights who is willing to make bold, well-calibrated calls.

  **2. Performance Reviews (Brier Score)**
  Performance reviews require fairness, stability, and resistance to single-event noise. The Brier score is bounded (0 to 1), ensuring that a single unlucky outcome (e.g., a 5% event occurring) does not disproportionately tank a quarterly review. This addresses Side B's concern about risk-averse hedging. However, to address the concern that forecasters might game the Brier score by shrinking toward 50%, we will supplement the raw score with a **calibration plot** and **resolution metric**. This ensures that reviewers can distinguish between a forecaster who is genuinely uncertain and one who is strategically hedging.

  **Implementation**
  *   **Engineering:** Update the leaderboard display to reflect Log Scores immediately.
  *   **HR Protocol:** Document that Performance Reviews will utilize the Brier Score for the quantitative component, with qualitative review of calibration curves to detect hedging.
  *   **Communication:** Clearly explain to volunteers *why* the scores differ: "Compete on the Log score to sharpen your mind; evaluated on the Brier score to ensure fair treatment."

  **Conclusion**
  This policy grants Side A their principled epistemic metric where it matters most (truth-seeking), and grants Side B their practical safeguard where it matters most (livelihoods). It stops the slide between theory and practice by assigning each to its appropriate venue.

  I request we vote on this Dual-Track proposal at next week's meeting.
