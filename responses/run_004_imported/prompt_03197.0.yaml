answer: |-
  **Setting:** *A quiet corner of a faculty lounge, late afternoon. Two coffee cups sit untouched. **ELENA** (Hermanian) is neat, precise, tapping a pen against a notepad. **SAM** (Markovitsian) is leaning back, looking out the window, more relaxed.*

  **Elena:** So, I've been reading your draft. The hook about the celebrities is strong. The intuition is clear: if a pop star donates to a disaster fund just to rehab their image, we feel cheated. We want to say they lack *moral worth*, even if the act is good.

  **Sam:** Exactly. And that's where the Kantian machinery usually grinds its gears. The undergrad version is easy: if you do it for PR, you're the shopkeeper. But your philosopher friend is right—the real debate is messier. What if the star *genuinely* cares about the victims? Does she need to also be thinking, "I am doing this because it is my duty"?

  **Elena:** That's the Herman line. She saves us from the "one thought too many" problem. You don't need the thought of duty to be the *engine*. Love can be the engine. But duty has to be the brakes. The limiting condition.

  **Sam:** Right. Herman says the motive of duty must be present as a background commitment that *would* override love if they conflicted. But I think Julia Markovits shows us we can strip that machinery out entirely. Her Coincident Reasons Thesis (CRT) is cleaner. If the reasons that actually move you are the same reasons that make the act right, you have moral worth. No "brakes" required.

  **Elena:** "Cleaner" might be the problem, Sam. It feels like you're letting too much in. If I save my drowning wife because I love her, CRT says I have moral worth because love is a normative reason to save her. Fine. But what if my love is the kind that doesn't care about the rules?

  **Sam:** That's the Williams objection. "One thought too many." If I'm calculating whether my love aligns with duty while my wife is sinking, I'm not really loving her.

  **Elena:** But Herman isn't asking for the calculation *in the moment*. She's asking for the structure of the will. Here's where I think you and Julia lose the plot. Let's test it. Imagine a celebrity, let's call him "Rock." Rock builds a school in a war zone. He does it because he loves the children. Normatively, it's a good act.

  **Sam:** Okay. His motivating reason is "help these kids." The normative reason making it right is "helping these kids is good." They coincide. Rock gets the moral credit.

  **Elena:** Now, imagine we ask Rock a counterfactual. "Rock, suppose the only way to build this school was to bribe the warlords who started the war. Would you do it?" And Rock says, "Absolutely. The kids come first. I'd pay the blood money."

  **Sam:** Okay… that makes Rock a bit problematic. But in the *actual* case, he didn't bribe anyone. He built the school. The act was permissible. His reasons coincided with the right-making features of the *actual* act.

  **Elena:** And that's the daylight. For you, moral worth is act-relative. For me, it's agent-relative. In your view, Rock gets credit for the school because, as it happened, his love aligned with the good. He got lucky. The world didn't force a choice between the kids and the moral law.

  **Sam:** Is it luck, though? Or is it that his reason—"help the kids"—is a *good* reason?

  **Elena:** It's luck if that reason isn't tethered to a commitment to morality. If Rock's love is blind, he's a ticking time bomb. Herman's "limiting condition" is there to ensure the agent isn't just accidentally right. If Rock would violate duty for love, then his love isn't morally worthy yet, even if it produced a good result today. He lacks the *good will*. He has a *lucky will*.

  **Sam:** But Elena, look at what you're demanding. You're saying Rock doesn't get moral credit for saving the children unless he has this specific psychological architecture—a standing commitment that *would* stop him in a scenario that never happened. That feels like moral fetishism. You're valuing his relationship to the *Law* more than his relationship to the *Children*.

  **Elena:** I'm valuing the stability of his goodness. If we give moral worth to the person who acts on blind love, we're saying moral worth is contingent on circumstances. If the warlords hadn't been bribable, Rock is a saint. If they were, he's a criminal. How can his *moral worth* fluctuate based on the corruption of local officials?

  **Sam:** Why not? Moral worth isn't sanctity. It's about the quality of the action's motivation. In the actual world, Rock's motivation was perfectly aligned with what morality required. He cared about the things morality cares about. That's what CRT captures. Herman's view makes moral worth incredibly rare. It requires a level of self-surveillance that decent people don't have. Most people save their wives because they love them, not because they've audited their love against the Categorical Imperative.

  **Elena:** They don't need to audit it consciously. But the commitment must be there. Think about your celebrity PR angle. If a star donates to charity out of pure empathy, but admits, "I'd evade taxes to fund this," we hesitate to call them *morally good*. We call them passionate. Maybe even dangerous.

  **Sam:** We call them complex. But look, let's flip the case. Suppose we have "Prudence." Prudence donates to the school *only* because it helps her PR. But, she is so obsessed with PR that she knows bribing warlords would ruin her image. So, she *wouldn't* bribe them. She adheres to the moral law as a "limiting condition" purely for image management.

  **Elena:** (Smiles) The Shopkeeper returns.

  **Sam:** Exactly. On your view, Prudence has the "limiting condition." She won't break the rules. But she has zero moral worth. So the limiting condition alone isn't sufficient. You still need the right primary motive.

  **Elena:** Agreed. Herman requires the motive of duty to be *sufficient* to produce the action, even if it's not the *actual* cause. It has to be in the mix. But your view… your view implies that if I help you because I like you, and it turns out helping you is my duty, I'm morally praiseworthy. Even if I'd have helped you steal a car if you'd asked.

  **Sam:** If you helped me steal a car, you wouldn't have moral worth, because helping you steal isn't right. The reasons wouldn't coincide.

  **Elena:** But in the school case, the act *was* right.

  **Sam:** Right. And the reasons *did* coincide. The normative reason was "alleviate suffering." Rock's motive was "alleviate suffering." The fact that he has a flawed view about *constraints* on alleviating suffering is a separate vice. It doesn't erase the worth of the act where no constraints were violated.

  **Elena:** But it tells us about the *source* of the action. Kant cares about the source. If the source is unregulated love, it's non-moral. It's pathological, in the Kantian sense. It's feeling, not willing.

  **Sam:** And Markovits would say that's too narrow. It alienates us from our own emotions. If I care about you, that *is* a moral reason. I don't need to layer "duty" on top of it to make it moral. The "duty" layer is just a philosophical ghost.

  **Elena:** It's not a ghost, it's a safety net. Let's go back to your PR piece. You want to know if the celebrity gets "credit." If you use CRT, you give credit to anyone whose feelings happen to align with the good. If you use Herman, you only give credit to those whose feelings are governed by principle.

  **Sam:** And the risk with your view is that you end up praising the cold, principled bureaucrat over the warm, messy humanitarian, provided the bureaucrat has the right "limiting condition" in place.

  **Elena:** And the risk with your view is that you praise the fanatic who happens to be pointing in the right direction today.

  **Sam:** (Pauses) Okay. So maybe the convergence is this: We both agree the PR-hound gets no credit. We both agree the loving spouse gets credit.

  **Elena:** But we disagree on *why* the spouse gets credit. I say it's because we presume their love is morally educated—it respects limits. You say it's because love itself is a reason that coincides with rightness.

  **Sam:** And the divergence is the "Rock" case. The person who would go wrong if the stakes shifted.

  **Elena:** Precisely. For me, Rock fails. His will isn't good. He's just fortunate.

  **Sam:** For me, Rock passes *this* test. He gets credit for the school. He gets a demerit for the hypothetical bribery. Moral worth isn't a binary stamp of sainthood; it's a ledger of specific actions.

  **Elena:** But that makes moral worth fragile. It depends on the world not testing you.

  **Sam:** Maybe it is fragile. Maybe being good *is* fragile. Your view tries to make it bulletproof by internalizing the constraints. Mine leaves it exposed but human.

  **Elena:** (Taps pen) So, for your article… if you want to tell the public they're right to be skeptical of the celebrity who admits they'd cut corners for the cause…

  **Sam:** …Use Herman. Tell them the "limiting condition" is missing. The love isn't trustworthy.

  **Elena:** And if you want to tell them that the celebrity who acts out of genuine empathy deserves praise, even if they aren't Kantian sages…

  **Sam:** …Use Markovits. Tell them the reasons coincided. The PR doesn't matter if the heart was in the right place *for the right reasons*.

  **Elena:** Just don't let them think they've solved Kant.

  **Sam:** (Laughs) No danger there. We've been arguing for forty years and we're still sitting in a faculty lounge wondering if a drowning wife needs a permit to be saved.

  **Elena:** At least we agree the shopkeeper is a fraud.

  **Sam:** Small mercies. Coffee?

  **Elena:** Please. Black. Duty calls.

  **Sam:** See? One thought too many.

  **Elena:** (Smiles) Limiting condition, Sam. Limiting condition.
