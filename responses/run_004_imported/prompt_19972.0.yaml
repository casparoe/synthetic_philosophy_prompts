prompt: |-
  I do a little philosophy podcast out of my spare room, nothing fancy, and my guest this week has basically built his whole reputation writing about Popper's flip-flopping on Darwinism. His go-to move whenever it comes up is "it wasn't a recantation, it was a clarification" -- like Popper never really changed his mind about natural selection being untestable, people just misread a lecture from the late 70s where he supposedly walked it back. I got into all this completely on my own, no philosophy degree or anything, after falling down a rabbit hole reading how creationists love quoting younger-Popper saying natural selection isn't real science (my dad's big into intelligent design stuff, which is honestly half of why I went down this hole), and I wanted to actually understand what was going on instead of just picking a side.

  Can you write me like 8-10 interview questions that dont just let him repeat that line? I want at least one question that really digs into the tautology problem itself -- the idea that "survival of the fittest" is empty because fitness just means whatever happened to survive -- and specifically whether defining fitness as a "propensity" instead of an actual outcome escapes that circle or just hides it one level down. I want one question that goes right at the recantation, something that makes him deal with why the timing lines up so conveniently with creationists using the earlier quote as ammo, instead of just letting him assert "clarification not reversal" again. And I want one question about what looks like a double standard to me: Popper's famous for roasting Marxism and psychoanalysis for dodging falsification with after-the-fact excuses, but then he turns around and calls Darwinism a "metaphysical research programme" and treats that as totally fine -- so why isn't that the exact same move he trashed everyone else for? For each of those three, give me a sharp follow-up question ready for whatever answer he's most likely to try first, not just a generic "can you say more."
