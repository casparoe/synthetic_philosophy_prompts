      *   **Key Philosophical Point:** *Kevalin* (omniscient being) doesn't need *syāt* qualifiers (direct perception of infinite modes). Conditional predication is a concession for *chadmastha* (non-omniscient). Even a Tirthankara's teaching must be translated by *ganadharas* into conflicting texts.
      *   **Task:** Write a short story (a few pages) living *inside* the gap between non-perspectival grasp and partial language.
