  4.  **Developing the "Syāt" Mechanism in Narrative:**
      *   How do we show *syāt* without using the Sanskrit?
      *   It needs to appear in the *hesitation*, the *qualifiers*, the *versioning*.
      *   Elara tries to write a definitive statement. Kael corrects her, not by saying "No," but by expanding the context until the statement holds only "in a certain way."
