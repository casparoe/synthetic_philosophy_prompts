  Actually, explicitly numbering them might be too on the nose. Better to weave it into the frustration of the scribe.

  Let's write.

  *Setting:* A deep-space observation post.
  *Characters:* Veda (Scribe/Ganadhara) and The Source (Kevalin/AI or Ascended Human). Let's make the Source a human who has merged with the ship's sensorium. Name: Aris.
  *Conflict:* A decision on whether to save a dying planet.

