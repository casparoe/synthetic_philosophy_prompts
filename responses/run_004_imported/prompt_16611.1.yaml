      *   **Middle:** Elara tries to draft a directive. "The station must be evacuated." Kael shows her why that is true *and* false simultaneously depending on the temporal/spatial mode.
      *   **Climax:** The realization that language itself is the bottleneck. The "Ganadhara" burden. She has to produce multiple, seemingly contradictory logs to capture the truth.
      *   **Ending:** The transmission is sent. It looks messy/contradictory to the receivers, but it's the only honest way. The acceptance of *anekanta* as an ethical duty to avoid *himsa*.

  6.  **Refining the Philosophy:**
      *   Avoid the "Blind Men" trap. The point isn't that Elara is blind and Kael sees. It's that *language* is the blindness. Even Kael, when he speaks, must limit himself.
      *   Highlight *himsa*: A definitive statement forces reality into a box, crushing the nuances.
      *   Highlight *chadmastha*: Elara is embodied, limited by sequence (time). Kael is simultaneous.

  7.  **Writing - Focus on Sensory Details:**
      *   The hum of the interface.
      *   The headache of compression.
      *   The visual of data not as numbers but as overlapping geometries.
      *   The frustration of the scribe.

  8.  **Self-Correction during Drafting (Mental Check):**
