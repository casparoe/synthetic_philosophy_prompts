      *   *Economic Analysis:* Smith consistently argues that colonies are a net *loss* for the metropole. Why keep a losing asset?
      *   *Strategic Context:* The *Wealth of Nations* was published in 1776. The American Revolution was underway. Smith was writing for a British audience.
      *   *Scholarly Consensus (Mental Check):* Scholars like Uday Singh Mehta, Jennifer Pitts, and Donald Winch have debated this. The "Liberal Imperialist" critique (Pitts) suggests Smith opened the door for later imperialism by focusing on "civilization" stages. However, the "Anti-Mercantilist" view (Winch) suggests he wanted to dismantle the *system* of empire, not necessarily spread British rule.
