          *   *Core Logic:* Empire is economically inefficient and morally repugnant. The costs of defense outweigh the benefits. He wants the relationship severed or radically altered to stop the exploitation.

      *   **Side B: Smith as Imperial Reformer (Liberal Imperialist).**
