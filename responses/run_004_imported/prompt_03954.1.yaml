          2.  Address the Circularity (Habituation).
          3.  Address Situationism (Stability vs. Rigidity).
          4.  Synthesis/Conclusion for Ethics Bowl prep.

      *   *Drafting Section 1 (Circularity):*
          *   Validate: It looks circular.
          *   Explain: Distinction between "acts that are in accordance with virtue" vs. "acts done virtuously."
          *   Mechanism: Habituation (*ethos*). Like learning grammar or carpentry. You do the thing to become the thing.
          *   Role of Community: You don't do it alone; you follow a mentor/lawgiver initially.
          *   Resolution: It's developmental, not logically circular.

      *   *Drafting Section 2 (Situationism):*
          *   Validate: Milgram/Zimbardo are powerful counter-evidence to naive trait theory.
          *   Aristotle's Defense 1: The Ideal vs. The Real. Aristotle admits truly virtuous people are rare (*spoudaios*). Situationism studies average people (who are likely *akratic*).
          *   Aristotle's Defense 2: Context Sensitivity. Virtue isn't "always do X." It's "do the right thing, at the right time, in the right way." Situationism shows people lack *phronesis* (situational awareness), not that traits are impossible.
          *   Refining "Unchangeable": It means "reliable disposition," not "robotic repetition." It means not being knocked off course by fear or temptation easily.

      *   *Drafting Section 3 (Ethics Bowl Application):*
