answer: |-
  These are two of the sharpest objections raised against Aristotelian virtue ethics in contemporary scholarship. The fact that you are spotting them while reading the primary text in translation is excellent preparation for Ethics Bowl. You are grappling with the **Paradox of Moral Education** (your first question) and the **Situationist Critique** (your second question).

  Here is a breakdown of what Aristotle is committed to in this passage and how a sophisticated virtue ethicist might respond to both challenges.

  ### 1. The Circularity Objection (The Paradox of Moral Education)

  **The Problem:**
  You have identified the tension perfectly. Aristotle says:
  1.  To perform a *virtuous action* (in the full sense), you must already possess a *firm character*.
  2.  To possess a *firm character*, you must *perform virtuous actions* repeatedly.

  If (1) is true, how can a beginner ever perform the actions required for (2)? If they don't have the character yet, aren't their actions merely "in accordance with virtue" rather than truly virtuous?

  **Aristotle's Solution: The Distinction of Phases**
  Aristotle is not describing a logical circle, but a **developmental spiral**. He relies on a distinction between two types of action:
  *   **Acts in accordance with virtue (*kata ton orthon logon*):** Doing the right thing, but perhaps for the wrong reason, or with difficulty, or under supervision.
  *   **Acts from virtue (*ek hexeōs*):** Doing the right thing, knowingly, chosen for its own sake, from a stable disposition.

  **How the "Circle" is Broken:**
  Aristotle does not expect the learner to start with a "firm and unchangeable character." He expects them to start by **mimicking** the virtuous person.
  *   **Stage 1 (Habituation):** A child or student obeys a parent or teacher. They tell the truth because they will be punished if they lie. The act is "in accordance with virtue," but the character is not yet formed.
  *   **Stage 2 (Internalization):** Through repetition, the pain of doing the right thing diminishes. They begin to see the value in the action itself.
  *   **Stage 3 (Virtue Proper):** Eventually, the disposition becomes "firm." They tell the truth because they love the truth, and it would feel painful to them to lie.

  **The Craft Analogy:**
  Aristotle says arts (*technē*) are different, but he uses them as an analogy for learning. A student carpenter builds a table *under the guidance of a master*. The table might be well-made, but the student is not yet a "master carpenter." By building many tables under guidance, they become the master.
  *   **Ethics Bowl Application:** If a case involves moral education or juvenile justice, you can argue that we cannot expect moral perfection from agents who haven't had the opportunity for habituation. Responsibility is linked to the development of character, which requires practice.

  ### 2. The Situationist Critique ("Firm and Unchangeable")

  **The Problem:**
  Situationism (based on Milgram, Zimbardo, Darley & Batson, etc.) suggests that human behavior is driven more by situational variables (time pressure, authority figures, ambient noise) than by global character traits. If Aristotle demands a character that is *akinētos* (unchangeable/unmoving), psychology seems to prove such a thing doesn't exist.

  **Aristotle's Defense: Nuancing "Firm and Unchangeable"**
  There are three ways to reconcile Aristotle with the psychological data without abandoning virtue ethics.

  **A. The Ideal vs. The Empirical Average**
  Aristotle is well aware that truly virtuous people are rare. He calls the perfectly virtuous person the *spoudaios* (the serious/excellent person). He admits most people are *akratic* (weak-willed—they know the good but fail to do it) or *enkratic* (self-controlled—they do the good but struggle against desire).
  *   **Response:** Situationist studies test *average* people in *unfamiliar* high-pressure situations. Aristotle would say these studies prove that most people lack *phronesis* (practical wisdom) and stable virtue, not that virtue is impossible. The studies describe the human condition *before* habituation is complete. Aristotle is describing an aspirational ideal, not a statistical norm.

  **B. Stability of Disposition, Not Rigidity of Action**
  "Firm and unchangeable" does not mean acting the same way in every situation (robotic consistency). It means having a stable **orientation toward the good** that is not easily knocked off course by passing passions or peer pressure.
  *   **Response:** Virtue is context-sensitive. A virtuous person acts differently in a war zone than in a classroom. Situationism shows people lack *discernment* in new situations. Aristotelian virtue includes *phronesis*, which is the ability to read the situation correctly. If a subject in the Milgram experiment obeys authority to harm someone, Aristotle would say they lack the practical wisdom to recognize that *this* situation demands disobedience, not that "obedience" is their character trait.

  **C. "Unchangeable" means "Reliable," not "Immutable"**
  The Ross translation "unchangeable" is strong. The Greek *bebaios kai akinetos* implies "steadfast" or "not easily moved."
  *   **Response:** A virtue ethicist can concede to the situationists that character is more fragile than Aristotle hoped. Modern virtue ethicists (like Nancy Snow or Julia Annas) argue for "local" traits rather than "global" traits. You might be honest with your friends but dishonest on your taxes. Aristotle would say you possess the virtue of honesty only in the sphere where you are stable. This concedes ground to situationism while keeping the core insight: we *can* build reliability through practice, even if we aren't perfect.

  ### Summary for Your Team

  When discussing this in Ethics Bowl, here is how you can wield this passage:

  1.  **On Moral Responsibility:** If an opponent argues someone is blameworthy for a bad act, you can use Aristotle to ask: "Did they have the opportunity for habituation? Did they act from a firm character, or were they swayed by a situation they weren't trained to navigate?" This adds nuance to blame.
  2.  **On Moral Improvement:** If a case is about reform or education, use the "circularity" solution. We become just by doing just acts *under guidance*. Policy should focus on creating structures that allow for habituation, not just punishing outcomes.
  3.  **On Situationism:** Don't deny the psychology. Acknowledge it. Then argue that the solution to situationism isn't to abandon character, but to **strengthen habituation**. If situations overpower character, we must train character to be more robust (more "firm") against those specific situational pressures.

  **The Bottom Line:**
  Aristotle is committed to the idea that character is **constructed through action**, not innate. The "circularity" is the engine of that construction. The "firmness" is not a claim that humans are immune to context, but that through practice, we can become reliable agents who do the right thing *because* it is right, even when it is difficult. Situationism challenges the *prevalence* of such people, but not the *possibility*.
