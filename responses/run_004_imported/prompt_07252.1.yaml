      *   *Nozick's Experience Machine:* This is a philosophical analogy. Nozick argues humans value *doing* things, not just *feeling* like they did them. For AI, there's no "feeling." It's purely about optimization targets. The analogy holds structurally (signal vs. reality) but fails phenomenologically (qualia).

