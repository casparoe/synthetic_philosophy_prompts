answer: |-
  **Moderator:** Welcome. We are here to discuss the architecture of self-control. On one side, we have the philosophical tradition stemming from Donald Davidson, which treats *akrasia*—weakness of will—as a logical puzzle about the unity of agency. On the other, the behavioral economic tradition stemming from George Ainslie, which treats it as a predictable mathematical outcome of hyperbolic discounting.

  Joining me are Dr. Elena Vance, defending the Davidsonian picture, and Dr. Marcus Thorne, defending the Ainsliean picture. I'd like to begin not with definitions, but with the moment of failure itself. The smoker lighting the cigarette despite wanting to quit. Marcus, your model says this isn't a contradiction. Elena, yours says it is. Why?

  **Marcus Thorne (Economist):** Let's start with the contradiction. Davidson insists the agent holds two incompatible attitudes *simultaneously*: a judgment that $A$ is better, and an intention to do $B$. But if you look at the data, that simultaneity is an illusion.

  When the smoker reaches for the pack, their valuation has shifted. At 8:00 AM, they value health over nicotine. At 8:00 PM, exhausted, the discount curve for nicotine spikes. The "better judgment" hasn't been violated; it has been replaced. There is no single agent acting against themselves. There is a succession of temporal agents, each acting rationally according to their local incentives. To call it "irrational" is to impose a god's-eye view on a creature that lives strictly in the present.

  **Elena Vance (Philosopher):** But Marcus, that god's-eye view is the only view the agent *has* when they feel guilt. If your model is correct, the smoker at 8:00 PM *should not feel they are making a mistake.* They should simply feel they have a new preference. But that's not the phenomenology of weakness of will.

  When I act akratically, I do not merely act on a new preference. I act while *endorsing* the old one. I think, "I should not eat this cake," and I eat it *because* I want to, not because I've decided the cake is now more valuable than my diet. The normative force of the judgment persists *through* the action. If you dissolve the unity of the agent to save the rationality of the action, you dissolve the very thing that makes it a human action rather than a reflex.

  **Marcus:** You're conflating a lingering memory of a past preference with a current judgment. Davidson asks: "How can you judge $X$ best and do $Y$?" I'm saying the question is malformed. You don't judge $X$ best *at the moment of doing $Y$*. You judge $Y$ best at the moment of doing $Y$, even if you regret that judgment five minutes later.

  Why posit a magical, stable "better judgment" that floats above the fray of neurochemistry? If I offer you \$100 today or \$150 next month, you take the \$100. If I offer you \$100 in a year or \$150 in a year and a month, you take the \$150. The preference reverses based on proximity. Where is the "true self" in that curve? There isn't one. There's just the curve.

  **Elena:** The "true self" isn't the issue; the *logic of intention* is. If I intend to save money, I form a policy. When the temptation comes, if I simply adopt a new preference because the temptation is near, I am not weak-willed; I am just inconsistent over time.

  Davidson's point is that akrasia is *intentional*. I am not overcome by a spasm. I reach out my hand. To explain this, we must admit that I am acting under a description that I know is inferior. Your model turns the agent into a battlefield where the loudest impulse wins. But if the loudest impulse always wins, what does "should" mean? "Should" implies I *could* have done otherwise, even given the impulse. Your hyperbolic curve is deterministic. It removes the "could have."

  **Marcus:** Does it? Or does it just raise the price of doing otherwise? Look, Elena, your framework is morally comforting but scientifically sterile. It preserves "responsibility" by positing a homunculus—a little judge inside the head who remains constant while the desires rage. But if we want to *help* people exercise self-control, my model works.

  We use pre-commitment devices. We change the choice architecture. We acknowledge that the 8:00 PM self cannot be trusted by the 8:00 AM self. If we treat the agent as a unified whole who "ought to know better," we shame them. If we treat them as a series of selves negotiating a treaty, we can help them draft better terms. Why cling to the Davidsonian puzzle if it offers no leverage on the behavior?

  **Elena:** Because leverage isn't understanding. You can predict a eclipse without knowing what the sun *is*. You are describing the mechanics of the crash, but I am asking about the driver.

  Here is the specific knot: The normative character of the judgment is *present-tense*. It is not "I judged yesterday that I shouldn't do this." It is "I judge *now*, even as my hand moves, that I shouldn't do this." If your model says my judgment *must* have flipped to match my action to preserve rationality, you are denying the possibility of acting against your *current* mind.

  But we do it. We act in a way we explicitly, synchronically disavow. If you say, "No, at $T_2$ you actually preferred the cigarette," you are redefining "preference" to mean "whatever won." That makes the theory unfalsifiable.

  **Marcus:** It's not unfalsifiable; it's operational. We measure preference by choice. If you choose the cigarette, you revealed a preference for the cigarette at $T_2$. To say you "really" preferred health is to posit a ghost preference that has no causal power.

  But let me press you on your "synchronic judgment." If I am in the grip of a craving, my cognitive bandwidth narrows. The long-term consequences literally drop out of my working memory. So, in what sense is the "better judgment" still active? It's not that I'm defying it; it's that it's gone offline. It's not a violation of reason; it's a temporary suspension of the data required for reason.

  **Elena:** That's a empirical claim about cognition, and it might be true sometimes. But it doesn't cover the hard cases. The hard case is when the data *is* there. I am looking at the cigarette. I am thinking about my lungs. I am thinking about my promise to my spouse. All the information is present. The judgment "This is worse" is fully active. And I light it anyway.

  Davidson calls this the "paradox of irrationality." If the judgment is fully active, why doesn't it cause the action? In your model, it doesn't cause the action because it's been outbid. In mine, it fails to cause the action because the connection between judgment and action is not mechanical. It's normative. And sometimes, we fail to be moved by the norm we acknowledge. That failure is the mystery. You've explained it away by chopping the self into time-slices.

  **Marcus:** I haven't chopped the self; I've expanded the timeline. The conflict isn't inside a single moment; it's *between* moments. The 8:00 AM self is screaming at the 8:00 PM self. The 8:00 PM self hears the scream but discounts it.

  Isn't it more honest to say that we are conflicted organisms rather than failed logicians? The Davidsonian view makes akrasia a sin against logic. The Ainsliean view makes it a tax on impatience. One leads to guilt; the other leads to strategy. If I can convince the 8:00 PM self that smoking violates a personal rule that protects future rewards, I can shift the curve. But I have to talk to the 8:00 PM self as a distinct entity with its own incentives, not as a corrupt version of the 8:00 AM self.

  **Elena:** But who pays the tax? Who feels the guilt? The 8:00 PM self doesn't care. The 8:00 AM self suffers the consequences. If they are truly distinct entities, as your bargaining model suggests, why does the 8:00 AM self feel responsible for the 8:00 PM self's actions?

  The feeling of responsibility presupposes the unity you deny. We don't say, "My Tuesday self betrayed my Monday self." We say, "*I* betrayed *myself*." That reflexive pronoun is doing heavy lifting. It implies that despite the time delay, despite the shifting desires, there is a subject that persists. If you remove that subject to solve the logical puzzle, you solve the puzzle by destroying the player.

  **Marcus:** I agree the feeling is there. But feelings are data, not metaphysics. The feeling of unity is a heuristic. It's useful for social coordination. But internally? We know the brain is modular. We know valuation systems compete. The "I" is a narrative construct stitched together after the fact.

  If we stick with Davidson, we have to say the agent is fundamentally broken when they act akratically. Their agency is compromised. If we stick with Ainslie, the agent is functioning exactly as designed, but the design has a flaw—hyperbolic discounting—that creates inter-temporal conflict. One view sees a broken will; the other sees a bargaining failure.

  **Elena:** A bargaining failure between whom? If there is no "I" to adjudicate the bargain, it's just causality. And if it's just causality, there is no weakness of *will*. There is only weakness of *causation*.

  I grant you that your model predicts *when* I will fail. Mine tries to explain *what it means* that I failed. You say I changed my mind. I say I lost my grip. The difference matters. If I changed my mind, I was rational. If I lost my grip, I was weak. And I think the phenomenology of regret confirms the latter. I don't regret that my preferences changed; I regret that I let them change when I knew better.

  **Marcus:** And I think that regret is just the 8:00 AM self complaining that the 8:00 PM self didn't honor the contract. It's a complaint from the past about the present. It doesn't prove the present self was irrational. It just proves the interests diverged.

  **Elena:** Then we are at an impasse. You see a market failure between temporal parts. I see a failure of authority within a whole.

  **Marcus:** Perhaps. But if your view makes the failure a mystery, and mine makes it a variable, I know which one I'm taking into the lab.

  **Elena:** And if your view explains the variable but eliminates the agent, I know which one I'm keeping in the seminar.

  **Moderator:** It seems the disagreement isn't just about the mechanics of choice, but about what we are willing to sacrifice to explain it. Dr. Thorne sacrifices the unity of the self to save the rationality of the action. Dr. Vance sacrifices the clarity of the mechanism to save the integrity of the agent. Thank you both.
