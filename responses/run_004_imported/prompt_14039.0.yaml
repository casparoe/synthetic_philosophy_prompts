      *   *Refining Cluster 1:* Focus on the "Map" metaphor. The map/territory distinction assumes a view from nowhere. Heidegger says there is no view from nowhere.
      *   *Refining Cluster 2:* Focus on *Entwurf* (projection). Counterfactuals aren't logical branches; they are modes of care.
      *   *Refining Cluster 3:* Focus on *Ständigkeit* (constancy). The AI problem is about logical consistency; Heidegger's is about narrative/existential continuity.
      *   *Refining Cluster 4:* Focus on *Zerrissenheit* (being torn apart). Subsystem alignment is the fight against fallenness.
      *   *Refining the Objection:* Don't dismiss it. Lean into it. The value of Heidegger here is diagnostic of the *researchers*, not necessarily the *agents*.

  5.  **Self-Correction/Review during drafting:**
