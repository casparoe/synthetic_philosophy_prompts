  2.  **Deconstruct Pascal's *Pensées* (Relevant Fragments):**
      *   *Justice without force is powerless; force without justice is tyrannical.* (Need both authority and moral rightness).
      *   *Custom/Justice:* What we call "justice" is often just established custom backed by power. We need to ensure our customs are actually just, not just enforced.
      *   *Application to Honor Council:*
          *   "Force" = The sanctions/penalties we impose.
          *   "Justice" = The moral fairness of the outcome.
          *   "Custom" = The precedent of how we treat self-reporting.
          *   If we enforce the rule rigidly (Force) without considering the moral nuance of honesty (Justice), we risk tyranny (or at least unfairness).
          *   If we are too lenient, we lose the Force necessary to uphold the code.
          *   The "slippery slope" argument is essentially an appeal to *custom* (we must do X to maintain the system) rather than *justice* (what is fair for this specific act).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the split.
