answer: |-
  This is a fantastic catch. You have correctly identified the philosophical "grandfather" of the cluelessness objection, and your debugging analogy is surprisingly apt. You are also right to be suspicious of how casually Moore seems to brush past the fact that his central assumption is unjustified.

  Here is the breakdown of what Moore is actually doing, how it relates to the modern Effective Altruism (EA) debate, and the philosophical "move" he makes to keep his theory from collapsing.

  ### 1. Plain English Translation
  Moore is wrestling with the gap between **Ideal Ethics** (what is actually Good) and **Practical Ethics** (what humans can actually do).

  *   **The Problem:** To say an action is your absolute "duty," you would theoretically need to know that it produces the *most* good of any possible action in the history of the universe.
  *   **The Reality:** We are causally blind. We can't see the infinite future. We don't know if saving a child today might lead to a tyrant being born 200 years later (the classic "baby Hitler" problem).
  *   **The Compromise:** Since we can't know the *absolute* best action, Moore says ethics should downgrade its goal. Instead of finding the *perfect* action, we should just find the action that is *probably* better than the other obvious options available to us right now.
  *   **The Assumption:** To do this, we have to pretend that the "infinite future" won't cancel out the "near future." We have to assume the ripple effects won't eventually reverse the value of what we do today.
  *   **The Admission:** Moore admits we have zero proof this assumption is true. He literally says it "has not been justified."

  ### 2. Is this the same as the EA "Cluelessness" objection?
  **Yes and no.** It is the same *problem*, but it is used for a different *purpose*.

  **Moore's Version (The Limitation):**
  Moore uses this uncertainty to lower the bar for what counts as "moral knowledge." He is saying: *"Don't ask ethics for certainty. It can only give you probabilities based on foreseeable consequences."* He uses cluelessness to defend a modest, pragmatic version of utilitarianism.

  **The EA Version (The Crisis):**
  In modern EA forums (formalized notably by philosopher Hilary Greaves in 2016), "cluelessness" is often used as a weapon against **longtermism**.
  *   **The EA Argument:** If the future is astronomically large (trillions of lives), then even a tiny probability of affecting the far future outweighs all near-term good (like malaria nets).
  *   **The Cluelessness Counter:** But we are *clueless* about the far future. If we are clueless, we can't assign probabilities. If we can't assign probabilities, the Expected Value (EV) calculation breaks.
  *   **The Difference:** Moore says, "We can't see the future, so let's focus on the near term." EA longtermists say, "The future is so big we *must* try to see it," and cluelessness skeptics say, "You can't, so your math is hollow."

  So, Moore identifies the bug; EA is currently arguing over whether the system crashes because of it.

  ### 3. The "Move": How Moore gets away with it
  You asked: *Does he ever grapple with what that admission does to his whole theory of duty, or is there some move I'm missing?*

  There is a move. It is the distinction between **Objective Rightness** and **Subjective Rightness**. This is the key to unlocking the rest of *Principia Ethica*.

  **Objective Rightness:** What action *actually* produces the most good in the universe (including the infinite future). Moore admits we can never know this. If "duty" meant this, we would never have any duties.

  **Subjective Rightness:** What action we *reasonably believe* will produce the most good, based on the evidence we have.

  Moore's "move" is to redefine **Duty**. He argues that when we say "You ought to do X," we cannot possibly mean "You ought to do the thing that metaphysically results in the maximum utility across eternity." We *must* mean "You ought to do the thing that, based on available evidence, is most likely to result in good."

  Here is how he justifies ignoring the unjustified assumption:
  1.  **Impossibility Proof:** If having a duty requires knowing the infinite future, then having a duty is impossible for humans.
  2.  **Pragmatism:** Ethics is a guide to conduct. A guide that demands impossible knowledge is useless.
  3.  **Conclusion:** Therefore, the definition of "duty" must be constrained by human epistemic limits.

  He isn't claiming the assumption (that the future won't reverse the balance) is *true*. He is claiming that acting *as if* it is true is the only way for the concept of "moral action" to function at all. He dissolves the skepticism by saying, *"Yes, we are clueless about the infinite, but 'duty' was never about the infinite. It's about the foreseeable."*

  ### 4. Why this still feels unsatisfying (and why you're right to doubt)
  Your instinct that he "moves on as if that's a settled matter" is shared by many modern philosophers.

  The problem with Moore's move is that it creates a gap between **what is Good** and **what is Right**.
  *   It might be *Right* (subjectively) to save the child (based on near-term evidence).
  *   But it might be *Bad* (objectively) because that child grows up to destroy the world.

  Moore is okay with this. He accepts that we might constantly be doing our "duty" while accidentally making the universe worse. He bites that bullet.

  However, the EA cluelessness objection bites back harder. It argues that if the "Objective Good" is dominated by the far future (which is vast), and we are forced to act only on the "Subjective Right" (the near future), then **standard consequentialism might be systematically leading us astray.**

  Moore says: "We can't know the future, so we should focus on the probable near-term."
  EA Longtermists say: "The future is too important to ignore, even if we are clueless."
  EA Skeptics say: "Moore was right; if we are clueless, we can't claim longtermist interventions have higher expected value."

  ### Summary
  *   **Is it the same worry?** Yes, Moore identified the epistemic black box of causal consequences.
  *   **How does he escape it?** He redefines "duty" to mean "acting on the best available evidence" rather than "achieving the best actual outcome." He treats the inability to know the infinite future as a definition constraint, not a calculation error.
  *   **Is it a solid defense?** It works for common-sense morality (saving lives now), but it struggles when the scale of the "infinite future" becomes the primary variable, which is exactly where the modern EA debate is stuck.

  You didn't miss a step; Moore essentially put a "TODO: Fix Infinite Causality" comment in his code and shipped the product anyway, arguing that the product was useless without it. Whether that was genius pragmatism or a critical flaw is exactly what the EA forums are still debugging.
