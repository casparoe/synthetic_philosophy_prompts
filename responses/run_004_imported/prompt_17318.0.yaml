  4.  **Explore the Ethical Arguments:**
      *   *The Utilitarian View (The Crew's View):* Efficient, minimizes total loss. Standard in disaster medicine (triage). Practical for public trust (saving the most).
      *   *The Egalitarian/Lottery View (The User's View):* Based on the idea that every life is of *infinite* value, not finite. If every life is infinite, you can't do math (5 x infinity = 1 x infinity). Therefore, when forced to choose, equal chance (lottery) respects the equal worth of each person.
      *   *The "Separateness of Persons" (John Rawls/Robert Nozick):* Society isn't a single entity. Sacrificing one person for the benefit of others treats them as a means to an end, not an end in themselves.
      *   *The "Refused to Evacuate" Factor:* Does the old man's negligence matter?
