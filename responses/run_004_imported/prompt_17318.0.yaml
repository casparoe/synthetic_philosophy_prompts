      *   **Deontology/Rights-Based Ethics:** Each individual has inherent worth/dignity that shouldn't be sacrificed solely for the greater good. The "separateness of persons" argument.
      *   **Procedural Justice/Fairness:** How do we decide when lives are at stake? Is a lottery fairer than a calculation?

  3.  **Validate the User's Feeling:**
