answer: |-
  This is one of the sharpest objections to the accuracy-first program, and you are right to pause there. If you don't feel the force of the "immodesty" premise, the whole argument feels like a mathematical sleight of hand where Joyce/Pettigrew define "rationality" in a way that guarantees probabilism wins.

  Here is the intuitive walkthrough of the logic, specifically targeting your two sticking points: **(1) Why isn't strict propriety just begging the question?** and **(2) Why is modesty irrational?**

  ---

  ### 1. Why Strict Propriety isn't just "Stacking the Deck"

  Your worry is: *By demanding a strictly proper scoring rule, aren't we just selecting a metric that we already know favors probabilities?*

  **The Intuition: The "Honesty" Constraint**
  Imagine you are an archer. You want a scoring system for your shots that rewards hitting the bullseye.
  *   **Proper Rule:** If you truly believe your aim is centered at point $X$, this scoring rule tells you that aiming at $X$ will yield the best expected score.
  *   **Improper Rule:** You truly believe your aim is centered at $X$, but this scoring rule calculates that you would get a *better* score if you aimed at $Y$.

  If you use an **improper** scoring rule to measure epistemic accuracy, you create a perverse incentive. It tells the agent: *"To maximize accuracy (according to this measure), you should adopt a credence that you don't actually think is true."*

  In epistemology, we want accuracy to measure **truth-tracking**, not **score-tracking**.
  *   If a scoring rule implies that holding credence $P$ expects credence $Q$ to be more accurate, that rule is telling you to "game" the accuracy measure.
  *   We demand **Strict Propriety** because we want an accuracy measure that respects the agent's current perspective. We want a measure where, if you are rational, you don't think you should lie about your beliefs to get a better "accuracy score."

  **So, propriety isn't baking in probabilism yet.** It is baking in **stability**. It says: *A measure of accuracy should not recommend that an agent abandon their own current credences in favor of others, relative to those very credences.*

  It turns out (mathematically) that the only credence functions that *can* satisfy this stability condition across all possible worlds are probabilistic ones. But the *motivation* for propriety is about preventing the accuracy measure from encouraging epistemic dishonesty/instability, not about forcing probabilities immediately.

  ### 2. Why is "Modesty" Irrational?

  This is the bigger philosophical hurdle. In everyday life, modesty (thinking others are better than you) is a virtue. In formal epistemology, it is a vice. Why?

  **The Intuition: Epistemic Akrasia**
  In this context, "Modesty" doesn't mean humility. It means **Self-Doubt regarding Accuracy.**

  *   **Immodest Credence:** "Given what I believe (my probability function), I expect *myself* to be more accurate than any alternative."
  *   **Modest Credence:** "Given what I believe, I expect *some other* credence function to be more accurate than me."

  If your credence function is **modest**, you are in a state of **Epistemic Akrasia**. You are in the position of thinking:
  > *"I believe $X$ with confidence 0.8. However, based on my own standards of evidence and logic, I calculate that I would be more accurate if I believed $X$ with confidence 0.5."*

  If you genuinely believe that adopting a different credence function would make you more accurate, **why haven't you adopted it?**

  *   If you think $Q$ is more accurate than $P$, and your goal is accuracy, rationality demands you switch to $Q$.
  *   But if you switch to $Q$, then $Q$ becomes your current credence.
  *   If $Q$ is also modest, you'll want to switch again.

  A rational mind seeks a **reflective equilibrium**. You want your beliefs to be such that, upon reflection, you endorse them as the best tools for getting at the truth. If your credence function is modest, it fails to endorse itself. It effectively says, *"I am not the best tool for the job, even by my own lights."*

  **The Analogy:**
  Imagine a doctor prescribing medicine.
  *   **Immodest:** "Based on my medical training and diagnosis, Drug A is the best treatment." (She prescribes Drug A).
  *   **Modest:** "Based on my medical training and diagnosis, Drug B is the best treatment." (She prescribes Drug A).

  The modest doctor is irrational. Her action (prescribing A) contradicts her own expert evaluation (that B is better). Similarly, a modest credence function holds beliefs that contradict its own expectation of accuracy.

  ### 3. Putting it together: The Logic Chain

  Here is the flow from Propriety to Probabilism, stripped of the heavy notation:

  1.  **The Norm:** Rationality requires you to maximize expected accuracy (relative to your own current view).
  2.  **The Tool:** We need a way to measure accuracy (a Scoring Rule).
  3.  **The Constraint:** To avoid perverse incentives (gaming the system), the Scoring Rule must be **Strictly Proper**. (Meaning: Any credence function must expect *itself* to be optimal *if* it is capable of doing so).
  4.  **The Discovery:** Mathematical theorems (like those from Savage or de Finetti) show that **only Probabilistic credence functions** can be Immodest relative to strictly proper scoring rules.
      *   If you are Probabilistic: You expect yourself to be most accurate. (Immodest/Stable).
      *   If you are Non-Probabilistic: You *necessarily* expect some Probabilistic function to be more accurate than you. (Modest/Unstable).
  5.  **The Verdict:** Since Non-Probabilistic credences are necessarily **Modest**, they are necessarily **Akratic** (they expect something else to do better).
  6.  **Conclusion:** Since Akrasia is irrational (see point 2), Non-Probabilistic credences are irrational.

  ### Summary of the "Aha!" Moment

  The move isn't "Modesty is bad, therefore Probabilism."
  The move is: **"Rational beliefs must endorse themselves. Only Probabilities *can* endorse themselves. Therefore, only Probabilities are rational."**

  The "Immodesty" requirement is just a formal way of saying: **Your beliefs shouldn't tell you that you should believe something else.**

  If you walk into your seminar with this distinction, you should be in good shape:
  1.  **Propriety** ensures the accuracy measure doesn't tell you to lie.
  2.  **Immodesty** ensures your beliefs don't tell you to change your mind.
  3.  **Probabilism** is the only system that satisfies both.

  Does that help untangle the "baking in" worry from the "modesty" worry?
