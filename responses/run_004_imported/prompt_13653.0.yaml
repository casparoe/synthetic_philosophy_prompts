answer: |-
  This is a wonderful gesture, and it is incredibly thoughtful of you to honor your sister's philosophical boundary while still celebrating the occasion. It is completely possible to write a speech that is warm, acknowledges the difficult journey, and respects her view without sounding clinical.

  The key is to frame the relief as belonging to the **parents** and the **family line**, rather than framing it as a medical outcome for the **baby**. We will focus on their *agency* and *love* in creating a future without that shadow, rather than on the baby "escaping" it.

  Here is a draft for a 2–3 minute speech.

  ***

  **Welcome Speech**

  Hi everyone. For those who don't know me, I'm [Your Name], [Baby's Name]'s aunt/uncle.

  We are all so incredibly happy to be here today. Looking around this room, seeing all the aunts, uncles, cousins, and friends, it's clear that [Baby's Name] is arriving into a world that is already full of love.

  I want to start by talking about my sister and her husband. Becoming parents is a journey for everyone, but for them, it was a path that required a specific kind of courage. We know that the road to getting here wasn't a straight line. There were months of waiting, of hoping, and of making incredibly heavy decisions. They navigated all of that with a focus that I find truly humbling.

  They wanted to bring a child into this world, and they wanted to make sure that the legacy this child inherits is as light and bright as possible. There have been shadows in our family history that we've all been aware of. But because of the care and determination my sister and [Husband's Name] showed, those shadows stop here. They made sure that the future [Baby's Name] steps into is clear.

  That is a profound gift. It's a gift of peace of mind for all of us, but mostly, it's a testament to how fiercely they love this little girl before she's even had her first birthday.

  [Baby's Name], you are so wanted. You are the result of hope, of science, of perseverance, and of so much love. We aren't just welcoming a new baby; we are welcoming a new chapter for our whole family. A chapter where the worry is behind us, and the focus is entirely on the joy ahead.

  So, if everyone could please raise a glass.

  To [Sister] and [Husband]: Thank you for your bravery and for giving us this miracle.
  And to [Baby's Name]: May your life be long, may it be happy, and may you always know how deeply you were chosen and how warmly you are welcomed.

  Cheers.

  ***

  ### Why this works for your sister's constraint:

  *   **"Those shadows stop here" / "The future... is clear":** This frames the absence of Huntington's as a boundary set by the parents for the *family line*, rather than a medical condition *this specific embryo* avoided. It respects the idea that the other embryos were not "her" waiting to be cured.
  *   **"How deeply you were chosen":** This acknowledges the selection process (PGT/IVF) as an act of love and intention, without implying she was "saved" from being someone else.
  *   **"The worry is behind us":** This places the relief on the *adults* and the *generation*, which your sister said was acceptable, rather than implying the baby personally dodged a bullet.
  *   **Tone:** It avoids medical jargon (no mention of genes, mutations, or IVF specifics) so the aunts and uncles just hear a touching tribute to the parents' hard work.

  ### Delivery Tip:
  When you get to the line *"Those shadows stop here,"* deliver it gently but firmly. It acknowledges the gravity of the situation without making the baby the subject of the medical drama. If you feel emotional there, that's okay—it underscores how much this means to the family.
