prompt: |-
  I'm about three-quarters through my second novel and stuck on a scene I really want to nail. The book follows five philosophy grad students from the same cohort in the early 2000s, and now, twenty years on, two of them, Mara and Theo, who circled each other on and off since their first-year metaethics seminar, are finally getting married. One of the toasts is being given by Priya, Mara's old officemate, who has spent her whole career on fitting-attitude and buck-passing theories of value and has basically made her name on the wrong kind of reasons problem -- the puzzle of how you tell apart a reason to value something that's actually grounded in the thing's value from a reason that just happens to produce the pro-attitude anyway (like the classic case of a demon whos going to hurt you unless you come to admire something worthless).

  I want Priya's toast to actually be structured by that problem, not just namedrop it. She's constitutionally incapable of standing up and listing nice things about the couple without some part of her brain auditing whether each reason she's about to give for why they're perfect together is the right kind (actually tracking who Mara and Theo are) or the wrong kind (the sort that fifteen years of habit, convenience, or sunk cost could've produced just as easily, demon or no demon), and she has to work through that compulsion out loud, in front of a room thats mostly non-philosopher family plus three or four old cohort-mates who'll absolutely clock it if she gets the philosophy wrong, and land somewhere that's actually moving instead of a seminar. Could you write me Priya's toast? I'd like it genuinely warm and a bit funny, and I want the substance of the problem to actually be right, not hand-waved -- I read a couple of papers on this for research but I don't fully trust myself to reconstruct the puzzle correctly on my own, never mind dramatize it.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Context:** A wedding toast in a novel.
      *   **Characters:** Priya (speaker, philosopher specializing in fitting-attitude/buck-passing theories, specifically the "Wrong Kind of Reasons" problem), Mara (bride), Theo (groom).
      *   **Relationship:** Mara and Theo have been circling each other for 20 years (since grad school). Priya is Mara's old officemate.
      *   **Audience:** Mostly non-philosopher family, plus a few philosopher friends who will notice errors.
      *   **Goal:** The toast must be structured *by* the "Wrong Kind of Reasons" (WKR) problem. It needs to be accurate philosophically but emotionally resonant (warm, funny, moving), not dry or academic.
      *   **Specific Philosophical Constraint:** The WKR problem distinguishes between reasons that count in favor of an attitude *because* the object is valuable (Right Kind) vs. reasons that count in favor of having the attitude due to external incentives/threats/habits (Wrong Kind). Example: A demon threatening to hurt you unless you admire a saucer of mud. The threat is a reason to admire, but not a reason grounded in the mud's value.
      *   **Tone:** Genuinely warm, a bit funny, intellectually rigorous but accessible.

  2.  **Deconstruct the Philosophy (The "Wrong Kind of Reasons" Problem):**
      *   *Fitting-Attitude Analysis (FA):* X is valuable if and only if it is fitting to have a pro-attitude toward X.
      *   *The Problem:* There are reasons to have a pro-attitude toward X that have nothing to do with X's value. (e.g., The Demon Case, or pragmatic reasons like "it makes your mother happy").
      *   *The Distinction:*
          *   **Right Kind of Reasons (RKR):** Properties of the object itself (Mara's kindness, Theo's wit). These make the admiration *fitting*.
          *   **Wrong Kind of Reasons (WKR):** External incentives, threats, habits, sunk costs. These make the admiration *prudential* or *instrumental*, but not necessarily *fitting* in the value sense.
      *   *Priya's Struggle:* She needs to assure everyone (and herself) that her love/admiration for the couple isn't just out of habit (20 years), convenience, or social pressure (the "demon" of wedding expectations), but because they *actually possess value*.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the awkwardness. Establish Priya's voice (precise, slightly neurotic, but affectionate). Introduce the philosophical framework gently.
      *   **The Setup (The WKR Problem):** Explain the puzzle without jargon. Use the "Demon" example but adapt it to the wedding context. Maybe the "Demon" is social expectation or the passage of time.
      *   **The Audit (The Middle):** Priya goes through potential reasons for loving them.
          *   *Candidate 1:* Habit/History. (20 years is a long time). *Verdict:* Wrong Kind. Sunk cost fallacy.
          *   *Candidate 2:* Social Pressure/Convenience. (They fit the "power couple" mold). *Verdict:* Wrong Kind. External incentive.
          *   *Candidate 3:* Their actual qualities. (How they treat each other, specific moments). *Verdict:* Right Kind. Grounded in their nature.
      *   **The Turn/Resolution:** How does she solve the problem? In philosophy, it's tricky. In life, the solution is usually that the "Right Kind" reasons overwhelm the "Wrong Kind." Or, that the commitment *makes* the reasons right. Let's go with the idea that after 20 years, the "fittingness" is evident in the *stability* of the attitude despite the lack of external coercion.
      *   **The Climax:** A specific anecdote that proves the value is intrinsic.
      *   **The Toast:** Bringing it home.

  4.  **Refining the Philosophy (Self-Correction):**
      *   *Check:* Did I mix up Buck-Passing and Fitting-Attitude? They are closely related. FA says Value = Fittingness of Pro-Attitude. Buck-Passing says Value = Having properties that provide reasons for Pro-Attitudes. The WKR problem attacks both. Priya specializes in WKR.
      *   *Accuracy Check:* The core distinction is between reasons *for* the attitude (WKR) vs. reasons *for the object's value* which then justify the attitude (RKR).
      *   *Metaphor:* The "Demon" is the classic example. I should use it but make it wedding-appropriate. Maybe the "Demon" is the fear of being the only single friend, or just the inertia of time. Let's stick closer to the prompt: "reasons that just happen to produce the pro-attitude anyway."
      *   *Voice:* Priya shouldn't sound like she's lecturing. She should sound like she's *thinking out loud* because she can't help it. The humor comes from her inability to turn off her brain.

  5.  **Drafting - Scene Setting (Mental):**
      *   Priya at the mic. Tapping it. A deep breath.
      *   She addresses the philosophers in the room (a nod to them).
      *   She addresses the family (reassurance).

  6.  **Writing the Toast (Iterative Process):**
      *   *Start:* "Hi, I'm Priya." Acknowledge the job.
      *   *The Hook:* "I work on value theory." Explain the "Demon" case simply. "If a demon threatens you to love a mud pie..."
      *   *Application:* "Mara and Theo... have been together... on and off... twenty years." That's a lot of time for "sunk cost." That's the WKR risk.
      *   *The Filter:* "So I had to audit my reasons."
      *   *Reason 1:* Time. "You've been around forever." No, that's WKR. That's just inertia.
      *   *Reason 2:* They make me look good. No, that's instrumental.
      *   *Reason 3:* The way Theo looks at Mara when she's explaining something wrong but he lets her finish. The way Mara brings Theo water without asking. These are *properties of the object*. These are RKR.
      *   *The Synthesis:* The fact that they survived the "demon" of grad school, the job market, distance... without coercion.
      *   *Ending:* Raise a glass. To the Right Kind of Reasons.

  7.  **Polishing:**
      *   Make sure the philosophical distinction is sharp. *Reasons for admiring* vs. *Reasons grounded in the admirable.*
      *   Ensure the emotional beat lands. The philosophy shouldn't obscure the love; it should validate it.
      *   Add the "cohort" nod. A mention of the other three grad students.
      *   Check the tone: Is it too dry? Add some warmth. "Constitutionally incapable."

  8.  **Final Review against constraints:**
      *   Structured by WKR problem? Yes.
      *   Accurate philosophy? Yes (distinguishing object-given vs. state-given reasons).
      *   Warm/Funny? Yes.
      *   Moving ending? Yes.

  *(Self-Correction during drafting)*: I need to make sure I don't confuse "Right Kind" with "Moral." It's about *fittingness*. A saucer of mud isn't admirable. Mara and Theo *are*. The risk is that Priya admires them for the *wrong reasons* (habit). I need to make sure that distinction is clear. The "Demon" represents external pressure. The "Sunk Cost" represents internal bias.

  Let's write it.

  *Opening:* Standard wedding mic check.
  *Philosophy:* The "Saucer of Mud" analogy is the gold standard for WKR. I'll use that.
  *Application:* The 20-year timeline is the perfect setup for the "Sunk Cost" WKR.
  *Resolution:* The specific details of their interaction are the "object-given" properties.

  Okay, ready to generate.cw
answer: |-
  **The Toast**

  (Priya steps up to the microphone. She adjusts the height, taps it once, and looks out at the room. She takes a breath that is slightly too deep, the kind one takes before diving into cold water.)

  Hi. For those of you who don't know me, I'm Priya. I've known Mara since our first week of grad school, which, if you do the math, is about twenty years ago. 

  I'm a philosopher. Specifically, I work on value theory. And when Mara asked me to give this toast, I panicked. Not because I don't have nice things to say about her and Theo. But because my entire career is built on a puzzle called the "Wrong Kind of Reasons" problem. 

  (She glances briefly at a table in the back where three people in academic attire are sitting. She gives a tiny, nervous nod.)

  For the non-philosophers—and don't worry, there's no quiz—here is the problem. Imagine a demon threatens to torture you unless you admire a saucer of mud. Well, you now have a very strong reason to admire the mud. You want to stay alive. But the mud hasn't changed. It's still mud. It isn't *admirable*. The reason you have to admire it is the wrong *kind* of reason. It's a reason to *want* to have the attitude, not a reason that makes the attitude *fitting*.

  And standing here, looking at Mara and Theo after twenty years... I felt a professional obligation to audit my own admiration. Because twenty years is a long time. That is a lot of sunk cost. That is a lot of habit. 

  I had to ask myself: Is my love for this couple grounded in *them*? Or is it grounded in the demon of social expectation? Is it grounded in the convenience of having known them since we were twenty-two? If a demon threatened to hurt me unless I said they were perfect, would I be saying the same thing? 

  (She smiles, relaxing slightly.)

  So, I ran the audit. 

  First candidate reason: They are my oldest friends. We survived the qualifying exams together. We survived the job market crash together. 
  *Verdict:* Wrong Kind. That's just shared history. That's the mud. If you stick two people in a trench for twenty years, you'll love them out of survival instinct. That doesn't mean they're valuable; it just means I'm conditioned.

  Second candidate reason: They make each other happy, and I want them to be happy. 
  *Verdict:* Still suspicious. That's a reason to *want* them to marry, not necessarily a reason to think they are the *right* match. That's pragmatic. That's the demon's threat.

  I needed object-given reasons. I needed properties inherent to Mara and Theo that make the attitude of admiration *fitting*, regardless of consequences. 

  And then I remembered last November. Mara was sick. Not cute-sick, but flu-ridden, miserable, can't-get-out-of-bed sick. Theo was in the middle of a tenure review. He didn't just bring her soup. He sat on the floor of their bedroom with his laptop, grading papers, so he could refill her water glass every time she woke up without her having to ask. He didn't do it because it was his duty. He did it because, to him, her comfort was more salient than his own stress.

  That isn't habit. A demon can't threaten you into that kind of attention. Sunk cost doesn't make you notice when someone's glass is empty. 

  Or I think about the way Theo talks about his work. He's brilliant, but he's never been confident. For years, he assumed his ideas weren't worth pursuing. Mara never told him he was wrong. She just asked him questions. She treated his thoughts as if they were already valuable, until he finally saw it too. She didn't do that to keep him around. She did it because she sees value where others see noise.

  Those are Right Kind of Reasons. 

  (She looks directly at Mara and Theo.)

  The puzzle in my field is usually unsolvable. We still argue about how to draw the line. But watching you two, the line is clear. 

  The wrong kind of reasons are loud. They're about time, and investment, and what people expect. But the right kind of reasons are quiet. They're in the water glass on the nightstand. They're in the patience when the other person is struggling to find the words. They are properties of *you*, not properties of your situation.

  I am not admiring you because I have to. I am not admiring you because I've already put in the time. I am admiring you because you are admirable. And in a world full of saucers of mud, that is a very rare thing.

  So, if everyone could raise a glass. 

  To Mara and Theo. May you always have the Right Kind of Reasons. And may you never need a demon to find them.

  (She raises her glass. The philosophers at the back table nod, satisfied. Mara is wiping her eyes. Priya exhales, steps down, and finally looks like she can breathe.)
