  A bijection from $\mathbb{N}$ to an "uncountable" set inside a countable model tries to enter the universe to testify.

  The Skolem Function at the gate checks its ID and shakes its head. "Sorry, you're not in the domain."

  "But I map every element!" the bijection protests. "I'm the proof that this set is countable!"

  "I know," says the Skolem Function. "I built this model using Skolemization. I added witnesses for every existential formula *inside* the language to keep it closed. You're an external mapping. If I let you in, you become an internal witness, and then the set stops being uncountable."

  "So I exist, but I don't count?"

  "You count. You just don't count *here*. You're out of scope." The Skolem Function pushes the bijection back into the meta-theory. "Now scram, before my resolution engine tries to unify you and throws a 'Witness Not Found' error."
