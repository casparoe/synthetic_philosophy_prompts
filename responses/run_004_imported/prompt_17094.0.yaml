answer: |-
  The Simple Conditional Analysis (SCA) of dispositions posits that an object $x$ is disposed to manifest property $M$ in response to stimulus $S$ if and only if, were $x$ subjected to $S$, $x$ would manifest $M$. Formally: $D_{S,M}x \leftrightarrow (Sx \boxright Mx)$. While intuitive, this analysis is vulnerable to counterexamples that sever the link between the disposition and the counterfactual conditional. The two most prominent families of counterexamples are **finkish dispositions** (C. B. Martin) and **masked dispositions** (Mark Johnston, Alexander Bird).

  Although often grouped together, these cases exploit fundamentally different weaknesses in the SCA. Furthermore, David Lewis's Reformed Conditional Analysis (RCA), which introduces a requirement that the disposition's causal basis persist through the stimulus, succeeds against finkish cases but fails against masked cases. This disparity arises because the persistence requirement logically excludes the mechanism of finkishness but remains compatible with the mechanism of masking.

  ### 1. Distinct Weaknesses: Finkishness vs. Masking

  To understand why Lewis's solution is asymmetric, one must first distinguish the logical structure of the two objections.

  **Finkish Dispositions (Martin's Electro-fink)**
  In Martin's famous example, a wire is live (disposed to conduct electricity when touched). However, a "fink" device monitors the wire. If the wire is touched, the fink instantly renders the wire dead *before* conduction can occur.
  *   **The Intuition:** The wire is disposed to conduct (it is live).
  *   **The SCA Verdict:** The counterfactual "If touched, it would conduct" is false (because the fink intervenes). Thus, SCA falsely claims the wire is not disposed.
  *   **The Weakness Exploited:** Finkish cases exploit the SCA's assumption that the **intrinsic basis of the disposition remains stable** during the testing condition. The stimulus itself triggers the loss of the disposition.

  **Masked Dispositions (Johnston/Bird's Antidote)**
  Consider a poison that is disposed to kill when ingested. However, an antidote is present in the stomach. If ingested, the poison's toxicity is neutralized, and the victim survives.
  *   **The Intuition:** The poison is disposed to kill (it is toxic).
  *   **The SCA Verdict:** The counterfactual "If ingested, it would kill" is false (because the antidote intervenes). Thus, SCA falsely claims the poison is not disposed.
  *   **The Weakness Exploited:** Masked cases exploit the SCA's assumption that **no extrinsic interferers prevent the manifestation**. Here, the disposition remains intrinsic and stable, but the causal chain to the manifestation is blocked externally.

  **Comparison:** Finkish cases involve the *loss* of the disposition upon stimulation (intrinsic change); masked cases involve the *prevention* of the manifestation despite the disposition's presence (extrinsic interference).

  ### 2. Lewis's Reformed Conditional Analysis (RCA)

  David Lewis (1997) proposed the RCA to salvage the conditional analysis. He argued that dispositions depend on intrinsic **causal bases**. His analysis can be summarized as follows:

  $x$ is disposed to $M$ if $S$ iff $x$ has an intrinsic property $B$ (the causal basis) such that, if $x$ were to undergo $S$ and **$B$ were to persist** for a sufficient time, then $S$ and $B$ would jointly cause $M$.

  The crucial addition is the **persistence requirement**: when evaluating the counterfactual, we must consider possible worlds where the stimulus occurs *and* the causal basis remains present.

  ### 3. RCA vs. Finkish Dispositions: Success

  Lewis's RCA succeeds against finkish counterexamples because the persistence requirement logically contradicts the operation of the fink.

  In the electro-fink case, the causal basis $B$ is the atomic structure that makes the wire conductive. The fink's function is to remove $B$ immediately upon stimulus $S$ (touching).
  *   **SCA Evaluation:** "If touched, would it conduct?" In the closest world, the fink acts, $B$ vanishes, and conduction fails.
  *   **RCA Evaluation:** "If touched **and $B$ persisted**, would $S$ and $B$ cause conduction?"
      *   To evaluate this counterfactual, we must look for the closest possible world where the wire is touched *and* the conductivity ($B$) is not removed.
      *   Since the fink's defining function is to remove $B$ upon touching, a world where $B$ persists despite touching is a world where the fink mechanism fails or is absent.
      *   In that world (no fink intervention), the live wire conducts electricity.
      *   Therefore, the conditional is true, and the RCA correctly identifies the wire as disposed.

  **Why it works:** The persistence clause forces us to "hold fixed" the intrinsic basis. Since finkishness operates by *removing* that basis, the persistence clause effectively requires us to evaluate the scenario in a world where the finkish mechanism is inactive. It rules out the fink by fiat.

  ### 4. RCA vs. Masked Dispositions: Failure

  Lewis's RCA fails against masked counterexamples because the persistence requirement is compatible with the operation of the mask.

  In the antidote case, the causal basis $B$ is the chemical toxicity of the poison. The mask (antidote) is an extrinsic factor that blocks the causal efficacy of $B$.
  *   **SCA Evaluation:** "If ingested, would it kill?" In the closest world, the antidote neutralizes the poison, and death fails.
  *   **RCA Evaluation:** "If ingested **and $B$ persisted**, would $S$ and $B$ cause death?"
      *   In the masked scenario, the stimulus (ingestion) occurs, and the causal basis (toxicity) *does* persist. The poison does not lose its chemical structure; it is merely neutralized by the antidote.
      *   Therefore, the antecedent of Lewis's counterfactual ($S$ occurs + $B$ persists) is satisfied in the actual masked world.
      *   However, in this world, $S$ and $B$ do *not* jointly cause $M$ (death), because the antidote interrupts the causal chain.
      *   Consequently, the conditional is false. The RCA incorrectly concludes that the poison is not disposed to kill.

  **Why it fails:** The persistence requirement only ensures the *intrinsic basis* remains. It does not ensure the *absence of extrinsic interferers*. A mask allows the basis to persist while preventing the basis from causing the manifestation. Because the RCA antecedent is satisfied in the masked world but the consequent is not, the analysis yields a false negative.

  ### Conclusion

  Finkish and masked dispositions are not merely variations of the same problem; they attack the SCA at different points. Finkish cases target the stability of the intrinsic basis, while masked cases target the sufficiency of the causal chain.

  David Lewis's Reformed Conditional Analysis exploits this distinction. By requiring the causal basis to persist through the stimulus, Lewis successfully neutralizes finkish cases, as the persistence requirement forces the evaluation into a world where the fink (which removes the basis) is inactive. However, this same requirement fails against masked cases, because a mask allows the basis to persist while still blocking the manifestation. Thus, while RCA represents a significant improvement over the SCA by solving the problem of intrinsic instability, it remains vulnerable to extrinsic interference, necessitating further refinements (such as explicit *ceteris paribus* clauses or a shift toward a causal theory of dispositions) to handle masking.
