answer: |-
  This is a high-wire act, and you're right to be nervous. You are walking the line between a profound insight into intellectual temperament and a "pathetic fallacy" of ideas (attributing moral motives to formal structures).

  Here is the brutal honesty you asked for, broken down by the paragraph, the scholarship, and the broader framing.

  ### 1. Critique of the Paragraph
  **The Good:**
  The core intuition is evocative. Frege's **Principle of Completeness** (*Vollständigkeit*)—that a concept must determine for every object whether it falls under it or not—is indeed the engine of his logic. And yes, the Nazi bureaucracy's obsession with defining *Mischlinge* (mixed-race individuals) was a grotesque attempt to impose binary logic on a biological and social continuum. The phrase *"wanted from politics the same tidiness he demanded from logic"* is a killer line. It's journalistic gold.

  **The Risk:**
  You are conflating **logical precision** with **ontological purity**.
  *   **In Logic:** Frege demanded sharp boundaries because without them, the Law of Excluded Middle fails, and arithmetic collapses. This is a technical requirement for a formal system.
  *   **In Politics:** Defining "Jew" or "Citizen" is a normative, legal act, not a discovery of pre-existing logical joints in nature.

  The danger in your paragraph is that it implies Frege's logic *required* him to be a bigot, or that his bigotry was a logical extension of his formalism. That is historically and philosophically fragile. Many logicians demand precision without wanting to strip civil rights; many fascists demand purity without knowing a quantifier from a variable.

  **The Fix:**
  Don't claim the logic *caused* the politics. Claim they share a **cognitive style** or an **aesthetic of order**.
  *   *Current:* "Frege's whole logical program rested on concepts having sharp, decidable boundaries... It's the same demand, relocated."
  *   *Adjustment:* "It is not that his logic demanded fascism, but that his fascism found comfort in the *image* of his logic. The diary reveals a man terrified of ambiguity, seeking in the social sphere the same absolute decidability he had constructed in the symbolic one."

  ### 2. The Scholarship (The "New Book")
  You are likely thinking of **Richard G. Heck, Jr.'s** work (recently published or circulating as *Frege and the Fascists* / related papers). Heck is the leading contemporary Frege scholar on this.

  **Heck's Verdict:**
  Heck basically argues **against** the strong continuity thesis. He points out:
  1.  **Timing:** Frege's logic was developed in the 1870s-90s. His virulent antisemitism appears clearly only in the 1924 diary (though earlier letters show hints). The logic predates the overt fascism by decades.
  2.  **Nature of the View:** Frege's antisemitism was fairly standard German nationalist stuff of the era, not necessarily derived from *Grundgesetze*.
  3.  **Dummett's Dilemma:** Michael Dummett (who you mentioned) was a leftist who revived Frege. He was devastated by the diary. Dummett's conclusion was largely that Frege's philosophy and politics were **compartmentalized**. Dummett argued we must separate the "technical achievements" from the "moral failures," though he admitted the "cult of hardness" in German philosophy at the time didn't help.

  **The Consensus:**
  There is no evidence that Frege thought "Therefore, Jews must be excluded" *because* of the *Begriffsschrift*. The connection is psychological/temperamental, not deductive. If you argue the "continuous with the logic" angle as a *causal* claim, a knowledgeable reader (like your PhD friend) will flag it as speculative. If you argue it as a *thematic resonance*, it holds up.

  ### 3. The Broader Question: "Which part caused the politics?"
  You asked: *Is "which part of the philosophy caused the politics" even the right question here?*

  **Short Answer:** No. It's a category error.
  **Long Answer:**
  Asking which part of the *philosophy* caused the politics assumes the politics were philosophical. They weren't. They were reactionary, emotional, and cultural.
  However, asking "Are they unrelated?" is also too simple. It ignores the **ethos** of the thinker.

  The better frame is **Intellectual Vice vs. Technical Virtue.**
  Frege's technical virtue was rigor. His intellectual vice was a **tyrannical desire for order**.
  *   In logic, that vice looks like virtue (rigor).
  *   In politics, that same vice looks like fascism (authoritarianism).

  The "rigor" didn't cause the fascism. The *psychological need for absolute order* manifested as rigor in one domain and fascism in the other. This allows you to keep your paragraph's insight without making the false claim that logic entails bigotry.

  ### 4. Recommendation for the Piece
  **Do not drop the angle,** but pivot the claim slightly.

  1.  **Keep the paragraph,** but soften the causality. Change "Frege's whole logical program rested on..." to "Frege's logical program prized..." and change "It's the same demand" to "It reflects the same temperament."
  2.  **Acknowledge the Counter-argument.** Briefly mention that scholars like Heck warn against reading the politics *out of* the logic. This actually strengthens your piece; it shows you aren't just hunting for witches.
  3.  **The "So What?":** The real takeaway isn't that logic is dangerous. It's that **abstraction can anesthetize moral imagination.** Frege could treat human beings as "objects falling under concepts" in his diary because he had spent a lifetime training himself to ignore the messy reality of objects in favor of their formal classification. The danger isn't the logic; it's the *habit of mind* that prioritizes the system over the substance.

  **Revised Snippet Suggestion:**
  > "It would be a mistake to say Frege's logic dictated his politics; formal systems don't issue deportation orders. But the diary reveals a shared temperament: a terror of ambiguity. In logic, vagueness is a bug to be fixed; in the diary, mixed ancestry is a contamination to be purged. Frege didn't derive fascism from the *Begriffsschrift*, but he brought the same ruthless demand for decidability to both. He wanted the social world to behave like a formal system: clean, hierarchical, and without remainder. The tragedy is that human beings are the one thing that cannot be made to satisfy the Law of Excluded Middle."

  **Verdict:**
  You are onto something real about *temperament*, but be very careful not to argue for *entailment*. If you frame it as a shared "aesthetic of order" rather than a logical consequence, you're on solid ground. If you claim the logic *led* to the politics, you're forcing the rhyme.
