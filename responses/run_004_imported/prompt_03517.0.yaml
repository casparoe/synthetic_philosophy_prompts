  ok this has been bugging me for a while, feels like exactly the kind of thing that'd blow up into a 100-comment thread on lesswrong. Gödel showed CH can't be disproven from ZFC, then Cohen showed it can't be proven either, so it's fully independent, right? Doesnt that basically mean the question is kind of confused/meaningless - like 'is CH true' doesn't have any more of a real answer than 'is a hot dog a sandwich', it just depends wich axioms you feel like stipulating. So why do people like Woodin spend entire careers hunting for new axioms to 'settle' it? seems like arguing over the true rules to a game someone made up yesterday. what am i missing, is set theory just weirdly attached to the idea that every question has a real answer, even one that's been proven undecidable?
reasoning: |-
