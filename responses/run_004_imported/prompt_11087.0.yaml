answer: |-
  **MEMORANDUM**

  **TO:** The Consortium of University Partners, Facility Directorate
  **FROM:** Beamtime Allocation Committee (BAC)
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Proposal 24-B: Futarchic Beamtime Allocation Pilot

  ### 1. Executive Decision

  After extensive deliberation regarding Proposal 24-B, the Beamtime Allocation Committee (BAC) has voted to **approve a modified pilot program** for the upcoming fiscal year. We will not, as originally proposed, replace the peer-review system entirely. Instead, we will adopt a **Hybrid Allocation Model**. 

  Eighty percent (80%) of available beamtime will continue to be allocated via traditional blinded peer review. Twenty percent (20%) will be allocated via a prediction market mechanism among qualified researchers. This decision allows the facility to test the epistemic efficiency of market mechanisms without exposing the broader scientific mission to the systemic risks identified during our debate.

  ### 2. Pilot Design Specifications

  To ensure the pilot tests the mechanism fairly while mitigating known failure modes, the following design constraints apply:

  *   **The Metric:** The market will resolve based on *"Verified Publication Output."* A proposal earns a payout if data collected during the allocated beamtime results in a peer-reviewed publication within 36 months. The payout magnitude is weighted by journal impact factor quartiles to approximate "significance" without relying on subjective ex-ante scoring.
  *   **Capitalization (Addressing Wealth Bias):** To prevent allocation from being dictated by personal wealth or grant liquidity, the Facility will provide **stipended trading accounts**. Each eligible trader (defined as active researchers with prior facility usage) receives an identical endowment of "Facility Credits." These credits have no cash value outside the facility but determine trading weight. Losses reduce future trading power; gains increase it. This preserves "skin in the game" regarding reputation and forecasting ability without introducing socioeconomic bias.
  *   **Protected Set-Asides:** Before the market opens, 15% of the *total* beamtime (drawn from the 80% traditional bucket) is irrevocably reserved for "Infrastructure and Calibration." These hours are not tradeable and are allocated by Facility Management to ensure detector health, regardless of market interest.
  *   **Eligibility:** Only proposals that pass a baseline technical feasibility review (safety, detector capability) are eligible for the market bucket. The market decides *priority*, not *viability*.

  ### 3. Response to Opposition

  In approving this pilot, the Committee explicitly overrides the objection raised by the minority faction that prediction markets are fundamentally incompatible with the sociology of scientific inquiry. We have listened carefully to your concerns, particularly the strongest objection: **that market mechanisms will systematically starve "public good" science.**

  You argued that calibration runs, null-result searches, and replication attempts are essential for field integrity but are unlikely to generate the high-impact publications required to profit in a prediction market. You contended that traders, incentivized by financial (or credit) returns, will underprice these activities, leading to a long-term degradation of data quality and trust in our results.

  **The Committee accepts the validity of this theoretical risk.** Markets are notoriously poor at pricing public goods where the social benefit exceeds the private return. A trader cannot easily profit from a calibration run that prevents a systematic error in someone else's experiment five years hence.

  **However, we reject the conclusion that this necessitates abandoning the pilot entirely,** for two reasons:

  1.  **The Hybrid Safeguard:** By retaining 80% traditional allocation and mandating the 15% Infrastructure Set-Aside, we have structurally insulated the "unglamorous" work from market forces. The traditional peer-review process, with its mandate to balance the portfolio of science, remains the primary guardian of replication and calibration. The market is merely an experiment on the marginal 20% of time where high-risk/high-reward proposals compete.
  2.  **The Cost of Status Quo Bias:** While markets may undervalue public goods, traditional peer review has its own documented pathologies: conservatism, citation cartels, and the "Matthew Effect" (preferential treatment for established names). We have a duty to investigate whether a mechanism that aggregates dispersed information (the "wisdom of crowds") can identify high-potential work that rigid review panels miss. 

  We acknowledge that if the pilot shows evidence of degrading data quality or discouraging necessary maintenance, it will be terminated. But to refuse to test a governance mechanism because of its theoretical failure modes, while ignoring the known failure modes of our current system, is itself a risk we are no longer willing to take.

  ### 4. Implementation and Review

  The Facility Directorate is instructed to work with the BAC to establish the trading platform and distribute stipended accounts by January 1. A sub-committee will be formed to audit the pilot after 12 months. The audit will specifically measure:
  *   Diversity of PIs receiving market-allocated time compared to traditional time.
  *   The ratio of calibration/replication proposals submitted to the market vs. traditional stream.
  *   Trader participation rates across career stages (Junior vs. Senior).

  We proceed with epistemic humility. We do not know if futarchy works for science. But after forty years of relying on the same allocation heuristics, we owe it to the field to test the hypothesis.

  **Signed,**

  *Dr. Elena Rostova*
  *Chair, Beamtime Allocation Committee*
