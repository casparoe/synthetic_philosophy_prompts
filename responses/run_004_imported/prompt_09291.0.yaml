      *   *The Climax of the Argument:* Ruth pushes on the *effect*. If I ask "Do you know who did it?" and you say "I cannot answer," everyone hears "I know but won't say." If you say "I pray for the guilty," everyone hears "I know who it is." Is that not communicating a falsehood by implication?
      *   *The Standoff:* Voss admits the cost. Ruth admits the boundary. Neither moves.

