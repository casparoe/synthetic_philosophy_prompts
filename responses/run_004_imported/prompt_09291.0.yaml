answer: |-
  The sacristy smelled of old wax and damp wool. Father Voss stood at the sink, washing the chrism from his thumbs. He did not turn when the door opened.

  "Ruth."

  "Father." She closed the door. The latch clicked loud in the small room. She didn't remove her coat. "They're filing the motion to compel tomorrow. I need to know if I should bother."

  Voss dried his hands on a rough towel. He turned. He looked tired, the skin under his eyes the color of bruised paper. "You know I cannot speak to what passes in the confessional."

  "I know what you think you cannot do. I'm asking about what you are doing." She stepped closer, placing a file folder on the table between them. She didn't open it. "We had Sister Imelda for moral theology. St. Augustine's *De Mendacio*. Ring a bell?"

  "It rings."

  "She made us memorize the eight grades of lies. The lie that kills faith. The lie that harms no one and helps no one. The lie that saves a life." Ruth's voice was flat, legalistic, but her eyes were bright. "Augustine says even the lie that saves a life is a sin. But he says it's a lesser sin. He grades them by consequence."

  Voss leaned against the counter. "He grades the culpability, Ruth. Not the intrinsic evil. A lie is always a lie. It is a turning away from God."

  "But silence isn't a lie. That's the loophole. *Contra Mendacium*. You don't have to tell the truth to everyone. You just can't tell a falsehood." She tapped the folder. "Jimmy Miller is going to prison for twenty years. Maybe the chair. You know he didn't do it. You know who did."

  "I know what I know."

  "When the prosecutor asks you if you have knowledge of the crime, and you say 'I have no comment,' what happens in the mind of the jury?"

  "They hear a priest protecting his office."

  "They hear a man hiding a secret. They infer guilt. They infer you know something exculpatory and are withholding it." Ruth leaned forward. "Augustine defines a lie as speaking against one's own mind. *Enuntiatum contra mentem*. You assert what you believe to be false. But what if you assert nothing, Father, while intending the listener to believe the false thing?"

  "That is not speech."

  "It is communication. You are using silence as a verb." Ruth walked a slow circle around the table. "If I ask you, 'Is Jimmy innocent?' and you look at me and say, 'I pray for Jimmy's soul,' you have not lied. Technically. You pray for everyone's soul. But you know I will hear 'I cannot say he is innocent.' You intend for me to hear that. You are engineering a false belief without uttering a falsehood."

  Voss folded the towel. He placed it precisely on the edge of the sink. "The moral act resides in the will of the speaker, not the interpretation of the hearer. If I do not assert a falsehood, I have not lied. If I remain silent, I have not asserted."

  "Augustine cares about charity," Ruth said. "He says the harm of the lie matters. If silence produces the exact same harm as a pernicious lie—an innocent man condemned—why is the silence virtuous?"

  "Because the soul is not yours to spend, Ruth. Neither is mine."

  "Don't give me the Church," she snapped, then softened. "Don't give me the institution. Give me the philosophy. You taught me this. Truth is a correspondence between thing and mind. If your silence creates a correspondence in my mind that matches nothing in reality, you have broken the chain. You've severed the thing from the mind."

  "I have severed nothing. I have withheld."

  "Withheld when you had a duty to disclose."

  "To whom? The court? Or God?" Voss looked at her. His gaze was heavy, not with authority, but with a kind of exhaustion. "You argue from consequences. If the outcome is bad, the act is suspect. Augustine argues from order. To break the seal is to deny the reality of the sacrament. It is to say that God's justice is subordinate to the state's justice."

  "God isn't on the stand tomorrow. Jimmy is."

  "If I break the seal, I cease to be a priest. If I cease to be a priest, I cannot offer the Mass. If I cannot offer the Mass, I cannot bring Christ to the people. You weigh one life against the spiritual welfare of a parish. Against the integrity of the confessional for every soul who will ever enter it."

  "That's utilitarianism, Father. You're counting souls now."

  "I am counting obligations."

  Ruth stopped pacing. She stood directly in front of him. "Sister Imelda told us about the mental reservation. The *restrictio mentalis*. Augustine hated it. He said if you say something true but intend it to be understood falsely, you lie in your heart. You know Jimmy is innocent. When you stand there and let them think you don't know, your heart is saying one thing, your mouth is saying nothing, and the world hears a third thing. Where is the truth in that triangle?"

  Voss looked down at his hands. They were red from the scrubbing. "The truth is kept safe. It is not destroyed. A lie destroys the truth by replacing it. Silence keeps the truth in the dark, but it remains true."

  "It doesn't remain true if an innocent man dies. Then the truth dies with him. The record shows Jimmy did it. History shows Jimmy did it. You bury the truth under the earth with him."

  "God knows the truth."

  "God isn't the one who needs the evidence." Ruth's voice cracked, just once. She steadied it. "You're saying the integrity of your relationship with God is worth more than the integrity of the judicial system. You're saying your soul weighs more than Jimmy's life."

  "I am saying that if I violate the seal, I lose the power to save souls. Including Jimmy's. Including yours."

  "He's going to hell because you want to go to heaven?"

  "He is going to prison because a man committed murder. I did not put him there. The killer did. I am refusing to become a second killer by murdering the sacrament."

  Ruth picked up the folder. She held it against her chest. "Augustine says we must suffer evil rather than do it. You're suffering Jimmy. You're making him suffer the evil so you don't have to do it."

  "I am suffering with him."

  "Are you?" She looked at him, searching for a flinch. "Because from where I stand, you're safe in here. With your towels and your sink. He's in a cell. He's terrified. And you're hiding behind a semantic distinction between speech and silence that Augustine himself would call a trap for the simple."

  Voss straightened. He looked at the crucifix hanging on the wall, plain wood, no corpus. "Augustine also wrote that there are secrets which must be kept, even from those who ask. If a man hides a fugitive, and soldiers ask where he is, Augustine says you may not lie. But you may refuse to answer. You may say, 'I know where he is, but I will not tell.' Or you may say nothing."

  "If you say nothing, they search the house. They find him. He dies."

  "Then he dies. And the soldier has committed murder. And you have not lied."

  "And you bear no blood?"

  "I bear the blood of the sacrament if I break it. That is heavier."

  Ruth stared at him. The air in the room felt thin, used up. She shifted the folder in her arms. "You know what the worst part is? I understand you. I know exactly what you're doing. You're not being cowardly. You're being consistent. And it's going to kill him."

  Voss nodded. A single, slow movement. "I know."

  "If I could prove you know, I could subpoena the confessional log. I could force the Bishop. I could make this a federal issue."

  "You could try."

  "But I won't. Because I know what happens if you break. You lose God. And I don't want that on me either." She turned toward the door. Her hand on the knob, she stopped. "Augustine says the lie is a sin against God. He doesn't say silence is a virtue. He says it's neutral. You're trying to make it a shield."

  "It is all I have."

  "It's a wall," she said. "And Jimmy is on the other side."

  She opened the door. The noise from the church nave drifted in—chairs scraping, a cough, the distant sound of the world moving on.

  "Ruth," Voss said.

  She didn't turn back. "Father."

  "Pray for him."

  "I'm his attorney," she said. "Praying is your job."

  She left. The door clicked shut. Voss stood alone in the silence, listening to see if it was true, or if it was just quiet.
