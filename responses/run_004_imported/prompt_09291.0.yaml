      *   **Conflict:** Ruth corners Voss in the sacristy. She knows he can't break the seal, but she wants to challenge the moral logic behind his silence using Augustine's own framework.
      *   **Theological Nuance:** The user has read *De Mendacio* and *Contra Mendacium*. Key point: Augustine distinguishes between lying (asserting what one believes false) and silence/evasive truth (which might leave a false belief but isn't a lie). Ruth's objection: If consequences matter for grading lies, why is engineered silence acceptable when it produces the *exact same harmful false belief* as a lie at the critical moment?
      *   **Format:** Dialogue-heavy, minimal narration/stage direction.
      *   **Tone:** Intellectual, tense, respectful but sharp. Neither side "wins." Both feel trapped by the logic.
