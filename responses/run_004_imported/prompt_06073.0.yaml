prompt: |-
  So I'm on the ML infra team at a small startup and we're doing RLHF-style fine tuning on our model. Part of my job this quarter is redesigning how we collapse a pile of per-rater preference scores into the single scalar reward that actually gets optimized against. Right now we just average everyone's normalized scores, which always felt kind of arbitrary to me, so I went down a rabbit hole reading about the theory behind combining people's preferences into one number. I ran into something called Harsanyi's aggregation theorem (sometimes called the "utilitarian theorem"), which as far as I understand says: if each individual's preferences and the group's preferences both satisfy the von Neumann-Morgenstern axioms, and some Pareto condition holds, then the group's utility function has to be a weighted linear sum of everyone's individual utility functions. A coworker who did a philosophy minor in college told me this is basically the closest thing economists have to a "proof" that utilitarian-style weighted averaging is the mathematically correct way to combine people's preferences, but he was pretty fuzzy on the actual details and I don't fully trust the handful of blog posts I skimmed either.

  Could you walk me through the most important implications of this theorem for something like what my team is actually doing? Specifically I care about three things: first, does the theorem actually tell you what the weights on each rater should be, or does it just guarantee that *some* set of positive weights exists and leave the hard part (choosing them) completely open; second, does the theorem quietly assume that different raters' utility scales are comparable to each other in a way we're definitely not guaranteeing just by normalizing everyone's 1-5 ratings the same way; and third, is there some fairness-type consideration in how outcomes get produced (like whether risk ends up spread evenly across raters vs. concentrated on a few) that this framework structurally can't capture no matter how the weights are set. I'm not asking for a full derivation with proofs, i just want to know what I'm actually allowed to conclude from this theorem before I go put it in a design doc as the justification for our approach.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User Role:** ML Infra Engineer at a small startup.
      *   **Task:** Redesigning the reward aggregation mechanism for RLHF (Reinforcement Learning from Human Feedback). Currently using simple averaging of normalized scores.
      *   **Knowledge Level:** Technical (ML infra), familiar with basic concepts (RLHF, normalization, scalars), has encountered Harsanyi's Aggregation Theorem via secondary sources (coworker, blog posts).
      *   **Goal:** Understand the *practical implications* and *limitations* of Harsanyi's theorem for their specific use case before putting it in a design doc.
      *   **Specific Questions:**
          1.  Does the theorem specify the weights, or just guarantee their existence?
          2.  Does it assume interpersonal comparability of utility (which normalization might not solve)?
          3.  Does it miss fairness/risk distribution considerations?

  2.  **Deconstruct Harsanyi's Aggregation Theorem:**
      *   *What is it?* A result in social choice theory/welfare economics.
      *   *Premises:*
          1.  Individual preferences satisfy vNM axioms (rationality under uncertainty).
          2.  Social preferences satisfy vNM axioms.
          3.  Pareto Efficiency (if everyone prefers A to B, society prefers A to B).
          4.  (Often implicit) Anonymity or specific domain conditions, though the core theorem is about the *form* of the function.
      *   *Conclusion:* Social Welfare Function $W = \sum a_i U_i + b$.
      *   *Key Caveat:* The utilities $U_i$ are unique only up to positive affine transformations ($U'_i = \alpha U_i + \beta$).

  3.  **Address Question 1: The Weights:**
      *   *Theorem Status:* It proves the *form* is linear weighted sum. It does *not* dictate the specific values of $a_i$.
      *   *Implication:* You still have to choose weights. The theorem justifies *why* you are summing them, not *how much* each person counts.
      *   *ML Context:* In RLHF, do all raters count equally? Maybe some are experts, some are spammers. The theorem doesn't solve the weighting problem.

  4.  **Address Question 2: Interpersonal Comparability (The Big One):**
      *   *Theorem Status:* This is the critical technical hurdle. vNM utilities are cardinal but unique only up to affine transformation.
      *   *The Problem:* To sum $U_1 + U_2$, the "units" of $U_1$ must mean the same thing as $U_2$.
      *   *Normalization:* Simple min-max or z-score normalization of 1-5 ratings does *not* fix this. It fixes scale/range, but not the *intensity* of preference.
      *   *Example:* Rater A goes from 1 to 5 for "slightly better" vs "much better." Rater B goes from 1 to 5 for "okay" vs "life-changing." Averaging them treats a 1-point jump as identical utility gain for both. Harsanyi requires comparable utility scales, which is philosophically and empirically contentious.
      *   *ML Context:* RLHF ratings are ordinal (rankings) often mapped to cardinal scores. This mapping is the weak link.

  5.  **Address Question 3: Fairness and Risk:**
      *   *Theorem Status:* Harsanyi is Utilitarian. It maximizes the *sum*.
      *   *The Problem:* It ignores distribution. A outcome that gives +100 to Rater 1 and -90 to Rater 2 (Sum = 10) is preferred over +5 to both (Sum = 10) if weights are equal. Actually, if Sum is higher, it wins.
      *   *Risk:* vNM utilities already encode risk aversion *within* an individual. But the aggregation doesn't care about *inequality* between individuals.
      *   *ML Context:* If the model optimizes for the sum, it might learn to please the majority (or high-weight raters) while actively harming the experience for a minority. This is a classic "tyranny of the majority" issue inherent in utilitarianism.

  6.  **Synthesize for the Design Doc:**
      *   *Verdict:* It's a dangerous justification to put in a design doc without heavy caveats. It sounds mathematically rigorous but relies on assumptions that likely don't hold in RLHF.
      *   *Recommendation:* Use it as a motivation for linear aggregation *if* you accept the assumptions, but acknowledge the limitations. Better to frame it as "Standard Utilitarian Aggregation" rather than "Proven by Harsanyi."

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, technical, slightly cautious (don't want them to ship a philosophical bug).
      *   *Structure:* Direct answers to the three questions, followed by a "Design Doc Advice" section.
      *   *Key Distinction:* Make sure to distinguish between *ordinal* preferences (rankings) and *cardinal* utilities (scores). RLHF often uses rankings (Bradley-Terry), but the user mentioned "scores." I need to address the score aspect specifically regarding comparability.
      *   *Refining the "Normalization" point:* Emphasize that normalizing 1-5 stars doesn't make utilities comparable. It just makes the *numbers* have the same mean/variance. It doesn't align the *meaning* of the intervals.
      *   *Refining the "Fairness" point:* Mention ex-ante vs. ex-post fairness. Harsanyi is about ex-ante expected utility.

  8.  **Final Review against User Constraints:**
      *   No full derivation.
      *   Focus on implications for ML infra/RLHF.
      *   Address the three specific questions clearly.
      *   Help them decide what to put in the design doc.

  9.  **Self-Correction/Nuance Check:**
      *   *Wait, does Harsanyi require anonymity?* The standard theorem doesn't strictly require equal weights, just linear weights. Anonymity would force equal weights. I should clarify that.
      *   *Is RLHF actually vNM?* Usually, RLHF uses pairwise comparisons. This maps to a probability model (Bradley-Terry). If they are using scalar scores (regression style), that's less common but happens. I should assume they are treating scores as proxies for utility.
      *   *The "Proof" claim:* The coworker said it's a "proof" utilitarianism is correct. I need to push back on that. It's a representation theorem, not a normative proof. It says "If you want X, Y, Z, then you must do W." It doesn't say "You must want X, Y, Z."

  10. **Final Polish:** Ensure clear headings and bullet points for readability. (Proceed to generate output based on these thoughts.)
answer: |-
  This is a classic case where a powerful theoretical result gets oversold in engineering contexts. Your coworker is half-right: Harsanyi's Social Aggregation Theorem is indeed the standard formal justification for utilitarian-style weighted sums. However, treating it as a "proof" that your current approach is mathematically correct is dangerous for a design doc, because the theorem's assumptions are almost certainly violated in a standard RLHF pipeline.

  Here is the breakdown of the three specific points you asked about, followed by advice on how to frame this in your design doc.

  ### 1. Does the theorem tell you what the weights should be?
  **No.** It guarantees the *form* of the function, not the *parameters*.

  Harsanyi's theorem proves that if you want to satisfy the vNM axioms and Pareto efficiency, your social welfare function $W$ must look like:
  $$W = \sum_{i=1}^{n} a_i U_i + b$$
  where $U_i$ is individual utility and $a_i$ are constants.

  The theorem does **not** tell you what $a_i$ should be.
  *   **If you impose Anonymity:** If you add the axiom that "all raters are identical/interchangeable," then the theorem implies $a_i = a_j$ (equal weights).
  *   **Without Anonymity:** The weights are completely free parameters. You could weight your senior raters higher than new contractors, or weight based on rater consistency.

  **Implication for your team:** Citing Harsanyi justifies using a **linear sum** rather than a non-linear combination (like a product or a max function). It does *not* justify setting all weights to 1. If you plan to weight raters differently (e.g., down-weighting noisy raters), Harsanyi still allows that, but it doesn't tell you how to calculate those weights.

  ### 2. Does it assume interpersonal comparability of utility?
  **Yes, and this is the biggest trap.** This is the single most important technical caveat for your design doc.

  For the sum $\sum a_i U_i$ to be meaningful, the "units" of utility must be comparable across raters.
  *   **The vNM Constraint:** vNM utilities are unique only up to **positive affine transformations**. This means if $U_i$ is a valid utility function for Rater $i$, then $U'_i = \alpha U_i + \beta$ (where $\alpha > 0$) represents the exact same preferences.
  *   **The Normalization Problem:** When you normalize scores (e.g., z-scoring or min-max scaling a 1–5 rating), you are arbitrarily fixing $\alpha$ and $\beta$ for each rater.
      *   Rater A might use the scale 1–5 to represent "Mildly Bad" to "Mildly Good."
      *   Rater B might use 1–5 to represent "Catastrophic" to "Life Saving."
      *   If you normalize both to mean 0, variance 1, you are mathematically asserting that **a one-standard-deviation improvement for Rater A is socially equivalent to a one-standard-deviation improvement for Rater B.**

  Harsanyi's theorem requires that the $U_i$ terms represent *cardinally comparable* welfare. Simple normalization of ordinal Likert scores does **not** achieve this. It aligns the ranges, but not the *intensity* of preference.

  **Implication for your team:** You cannot claim that Harsanyi proves your normalization strategy is correct. In fact, economists generally agree that interpersonal utility comparisons are empirically unverifiable. If you put this in a design doc, you must acknowledge that you are making a **strong assumption** that normalized scores are comparable utilities, which is an engineering heuristic, not a mathematical truth derived from the theorem.

  ### 3. Does it capture fairness or risk distribution?
  **No. It is structurally blind to distributional fairness.**

  Harsanyi's theorem leads to **Utilitarianism** (maximizing the sum). It does not account for **Egalitarianism** (maximizing the minimum) or **Prioritarianism** (weighting the worse-off more heavily).

  *   **The "Tyranny of the Majority" Risk:** If optimizing the sum leads to a reward model that delights 90% of raters (+10 utility each) but actively harms 10% of raters (-100 utility each), the utilitarian sum might still prefer that outcome depending on the weights.
  *   **Risk vs. Inequality:** vNM utilities encode *individual* risk aversion (curvature of $U_i$). However, the aggregation function itself is linear. It does not care if the total utility is spread evenly or concentrated.
  *   **Ex-Ante vs. Ex-Post:** Harsanyi's framework is often interpreted as "ex-ante" fairness (everyone agrees on the lottery before the tickets are drawn). It does not guarantee "ex-post" fairness (the actual outcomes feel fair to the losers).

  **Implication for your team:** If your startup cares about "model collapse" on minority dialects or edge cases where a small group of users hates the model, Harsanyi provides no protection. A linear aggregation will happily sacrifice minority rater satisfaction if it boosts the aggregate score. If fairness is a requirement, you need constraints or a different aggregation objective (e.g., maximizing the minimum rater utility), which Harsanyi explicitly rules out under its standard axioms.

  ### Summary for your Design Doc

  Do not write: *"We use weighted averaging because Harsanyi's Theorem proves it is the mathematically correct way to combine preferences."*
  This is technically false because the assumptions (comparable utilities) are not met, and it overclaims what the theorem does (choose weights/fairness).

  **Instead, consider framing it like this:**

  > "We utilize a linear aggregation of rater scores as our reward objective. This approach is consistent with **Harsanyi's Social Aggregation Theorem**, which demonstrates that linear weighting is the unique method for aggregating preferences that satisfies Pareto Efficiency and Rationality axioms **under the assumption of comparable utility scales**.
  >
  > **Limitations & Mitigations:**
  > 1.  **Comparability:** We acknowledge that normalized scores are imperfect proxies for comparable cardinal utility. We will monitor rater variance to ensure no single rater's scale dominates the gradient.
  > 2.  **Weights:** The theorem does not prescribe weights. We will determine weights based on rater reliability/consistency rather than assuming uniform anonymity.
  > 3.  **Fairness:** As a utilitarian aggregation, this objective maximizes total satisfaction but does not guarantee equitable outcomes across rater subgroups. We will track performance slices to ensure minority preferences are not systematically optimized away."

  **The Bottom Line:**
  Harsanyi justifies the **linear form**, but it leaves you with the hard engineering problems (weight selection, scale alignment, and fairness constraints) completely unsolved. It is a useful philosophical anchor, but it is not a silver bullet for your reward modeling pipeline.
