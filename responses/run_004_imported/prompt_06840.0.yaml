answer: |-
  "Come on," Elias said, turning toward the diner. "The causal chain ends at the curb. She drove. We arrived. Paying her now doesn't cause the ride to have happened."

  Mara blocked his path, dust still coating her eyelashes. "But if you reasoned that way *before* we got in, she wouldn't have stopped."

  "But I'm *here*, Mara. That's the data point. The past is fixed. My wallet opening now doesn't reach back in time to change her mind at the highway onset. I can't causally influence a closed loop."

  "It's not about changing the past. It's about what kind of agent you are. If 'rationality' means defecting when it's safe, then a rational agent gets left in the heat. I'd rather be irrational and alive."

  "That's conflating the policy with the act," Elias said, shifting his pack. "Sure, have the disposition. But once you have the ride, the disposition has paid off. Now you maximize utility. Paying is literally throwing money away for zero causal return."

  "No, because you didn't *have* the disposition. You just had the ride. If you walk away, you prove you're the type who walks away. And if you're that type, you don't get rides."

  "I *did* get the ride. That's the counterfactual that matters. I'm not dead. Your theory requires me to pay a cost to satisfy a metaphysical consistency check. Mine requires me to keep my money because the danger is past."

  "You got lucky she misread you," Mara said, voice tight. "But if we're talking decision theory, we're talking generalizable rules. If you reason that paying is optional once safe, you're the kind of person for whom safety was never guaranteed. You're betting that your capacity for rationalization is better than her capacity for prediction."

  "I'm betting on reality. The money is gone either way. But if I keep it, I have cash. If I pay, I have... what? Moral cleanliness?"

  "You have integrity as an agent," Mara said. "Look, imagine you're back on the highway. You know you'll reason like this in town. Does she pick you up?"

  "No, because I'd be honest and tell her I won't pay."

  "Exactly. So the 'you' that gets picked up is the 'you' that pays. You can't sever the two. If you defect now, you retroactively become the person who shouldn't have been saved."

  "That's magical thinking. I'm standing here. The truck is gone."

  "You're standing here," Mara said, stepping aside, "but you're not the person you thought you were. Go buy your burger. I'll walk to the bank."
