answer: |-
  The rain against the window was the only sound in Elias's apartment, a steady, rhythmic drumming that emphasized the silence everywhere else. On his laptop screen, the email from Vienna glowed softly. It was two years old, buried in a folder labeled *Archives*, but he opened it often enough to know the text by heart. *We are pleased to offer…* He had declined. He had stayed here, with the job that paid enough and the city that knew his name, and now he felt the slow, dull ache of a life narrowing.

  His phone buzzed on the table. A text from Sarah, following up on their dinner conversation from last week. *Just think about it, Eli. If Lewis is right, you didn't lose anything. The Vienna-Elias is living it right now.*

  Elias stared at the message. Sarah was a realist about modal realism. She believed David Lewis's ontology literally: that all possible worlds are concrete entities, just as real as this one, differing only in content, not in kind. To her, the Vienna-Elias wasn't a ghost or a shadow. He was flesh and blood, sitting in a café on the Ringstraße, drinking coffee, feeling the sun. He was real.

  But he was not here.

  Elias typed a reply, then deleted it. The problem wasn't the reality of the other world; it was the isolation. Lewis was explicit: worlds are spatiotemporally isolated. There are no causal bridges. No light travels from Vienna-World to Here-World. No signal, no empathy, no shared consciousness. The Vienna-Elias was a stranger who happened to look exactly like him, share his memories up to a point, and carry his DNA. But numerically, he was distinct.

  Elias closed the laptop. He tried to perform the mental exercise Sarah suggested. He tried to take comfort in the existence of the counterpart.

  *He is happy,* Elias thought. *Somewhere, I am happy.*

  He attempted to let that knowledge seep into his bones. If the multiverse is a plurality of concrete worlds, then happiness is not scarce. It exists abundantly in the modal manifold. In a vast number of worlds, he had taken the job. In some, he had thrived. In others, he had crashed spectacularly. But the thriving ones were out there, immutable and concrete.

  But the isolation thesis clawed at the comfort. If the worlds are sealed, then the happiness in Vienna-World is causally inert here. It cannot warm him. It cannot change the temperature of this room. The Vienna-Elias feels the sun, but Elias feels only the rain. To say "I am happy there" is to misuse the word "I." The counterpart is not him. He is a distinct individual who bears a relation of similarity.

  Elias walked to the window. He pressed his hand against the cold glass. If modal realism is true, there is a world where he is pressing this hand against glass, but he is smiling. There is a world where he never opened this email. There is a world where he died in a car crash last year. All of them are equally real. All of them are equally unreachable.

  Does the knowledge diminish the regret? That was the question Sarah couldn't answer, and neither could Lewis.

  If the Vienna-Elias is real, then Elias's current sadness is not the totality of his modal existence. His life is not a single thread but a vast tapestry of divergent strands. Surely, knowing the tapestry is rich should comfort the thread that feels thin. But threads don't know the tapestry. A thread only knows its own tension.

  Elias imagined the Vienna-Elias laughing with colleagues. The image was vivid. But it was a simulation, a projection generated by neurons in this world. The actual Vienna-Elias was inaccessible. He might as well be a character in a book locked in a vault. The book exists, the character lives, but the reader cannot hug them.

  Is it comfort to know that a stranger who resembles you is happy? If Elias saw a man on the street who looked like him, living the life he wanted, would he feel solace? No. He would feel envy. He would feel the sharp sting of *almost*. Why should the metaphysical distance make the envy vanish? If anything, Lewis's realism makes it worse. The happiness isn't potential; it's actual. It is happening right now, in a concrete reality, just inches away in modal space, yet infinitely distant in causal space.

  The rain intensified. Elias turned away from the window. He looked at his phone again. Sarah's text remained lit.

  *It changes the weight of the loss,* she had argued over wine. *You aren't the sole locus of your possibilities.*

  *But I am the sole locus of my experience,* Elias had replied.

  He sat on the couch and closed his eyes. He tried to feel the counterpart's joy as a distant resonance, like a vibration through a wall. But there was no vibration. There was only the silence of the worlds. The isolation was absolute. The Vienna-Elias would never know Elias's regret, just as Elias would never know the Vienna-Elias's triumph. They were twins separated at the birth of possibility, doomed to never speak.

  Perhaps the comfort wasn't in sharing the joy, but in knowing the joy existed. To know that the universe—or the pluriverse—was not stingy. That the choice he made here did not extinguish the other path; it merely localized his consciousness to this branch.

  But consciousness is all he had. If he is locked in here, what does it matter that there is a "there" there?

  Elias opened his eyes. The room was dark. The laptop screen had gone to sleep. He picked up the phone and hovered his thumb over the keyboard. He wanted to tell Sarah that she was right, that the vastness of modal space was soothing. He wanted to tell her she was wrong, that the isolation made it a cruel joke.

  He realized he couldn't tell her either. The truth of the matter wasn't in the metaphysics, but in the feeling. And the feeling was ambiguous. The knowledge of the counterpart hung in the air, heavy and real, like a presence in the room that refused to speak. It offered a kind of company, but it was the company of a mirror that reflects only what isn't there.

  Elias put the phone down. He lay back on the couch and listened to the rain. Somewhere, in a world just as real as this one, the rain had stopped. Somewhere, he was sleeping peacefully. Somewhere, he was awake and weeping. All of them were true. All of them were sealed.

  He closed his eyes and waited for sleep, wondering if the Vienna-Elias was wondering about him. He knew the answer was no. But he couldn't decide if that knowledge made him feel less alone, or entirely alone.
