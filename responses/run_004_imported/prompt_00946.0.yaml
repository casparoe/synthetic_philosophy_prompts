          *   Intuition: Completely wrong.
      *   **Theory 2 ($T_2$):** $M \land W \land \neg A$ (Motion and Window right, Alarm wrong).
          *   Intuition: Much closer. It got 2/3 atomic facts right.
      *   **Popper's Problem:**
