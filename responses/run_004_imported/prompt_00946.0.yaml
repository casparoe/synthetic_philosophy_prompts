  Hey, I'm putting together a problem set for my phil of sci seminar on Popper's verisimilitude and I'm sick of recycling the stock weather example (hot/rainy/windy) that's in every textbook - my students can just google that in five seconds. Can you construct a brand new pair of false theories, about anything other than weather, where our intuitive judgment says one is obviously closer to the truth than the other, but Popper's actual definition (via truth-content and falsity-content, i.e. comparing the sets of true and false logical consequences) fails to rank them that way, or cant rank them at all? Then explain in a couple sentences why the formal apparatus breaks down in your example - basically, what's playing the role that the Tichy/Miller weather counterexample plays in the textbook version.
