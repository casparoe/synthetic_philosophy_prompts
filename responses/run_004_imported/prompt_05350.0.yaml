prompt: |-
  So I run this tiny philosophy podcast with a friend, we record it in my garage, nothing fancy, maybe 50 people listen if were lucky. I never studied philosophy formally (closest I got was one gen-ed class at a community college years ago) but I've been kind of obsessively reading about philosophy of mind on my own for the last year, mostly because I fell down a youtube hole about these bacteria that have tiny internal "compasses" made of magnetite that make them swim toward magnetic north -- and it turns out that in the swamps where they live, swimming toward magnetic north also happens to mean swimming away from the oxygen near the surface, which would kill them since they're anaerobic. That's what got me into "teleosemantics," which is basically the theory (mainly associated with Ruth Millikan i think?) that what a mental state is actually ABOUT is fixed by whatever it was built or selected to track, kind of like how we'd say the function of a heart is to pump blood even on the occasions it doesn't.

  Anyway, next episode we're bringing on my old professor from that community college class, who's spent basically her whole career defending this view, and I really don't want to waste the interview just having her explain the basic idea again (I can cover that part myself in the intro). Can you draft me like 8-10 questions that actually push on it instead? Specifically I want at least one question built around those bacteria -- like does their little compass-state represent "geomagnetic north" or "the direction away from oxygen," given that those two things were basically the same thing for their entire evolutionary history, so how would selection ever settle which one it actually is. I also want one on this "Swampman" thing I read about, where lightning hits a dead tree in a swamp and by total coincidence rearranges it into a molecule-for-molecule copy of a person, with zero evolutionary or learning history behind it -- because it seems like her view is stuck saying this creature has no thoughts about anything whatsoever, even though it'd walk around talking and acting exactly like a normal person, which strikes me (and probably most listeners) as pretty hard to swallow. And one on how the theory handles thoughts that obviously couldn't have been selected for anything, like someone sitting around thinking about bitcoin or calculus -- I read that Millikan has some idea about "derived" functions to cover cases like that but I honestly don't totally get how its supposed to work. For each of those three, bake in a sharp follow-up question keyed to whatever answer she'd probably give, so she can't just recite the textbook response and move on -- then round out the rest of the 8-10 with whatever other angles you think someone defending this view should really have to answer for.
