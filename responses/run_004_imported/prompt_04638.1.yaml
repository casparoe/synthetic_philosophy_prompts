      *   *Correct the flattening:* Rorty isn't a relativist in the "anything goes" sense. He's a *pragmatist*.
      *   *Explain the "World" constraint:* Rorty admits the world can *cause* us to have beliefs (kick a stone, it hurts), but it can't *justify* them. Justification is social. However, the world pushes back. If you believe you can fly and jump, gravity (the world) intervenes.
      *   *Apply to Trump/Post-Truth:* Rorty would judge the demagogue not on "correspondence to reality" but on "social utility" and "cruelty." Does believing the election was stolen help us build a better society? No. It causes chaos.
      *   *The Prediction:* His prediction in *Achieving Our Country* was based on *class resentment*, not epistemology. He didn't need a theory of truth to see that ignoring poor people leads to anger.
