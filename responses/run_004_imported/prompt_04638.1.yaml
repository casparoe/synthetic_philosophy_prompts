answer: |-
  This is one of the most persistent and electrifying critiques of Rorty, and your dinner companion is voicing a concern that has haunted his legacy since the 1990s. The charge is essentially this: **By dismantling the idea of objective truth, did Rorty disarm the Left's ability to fight lies?**

  The short answer is: **No, that is not a fair reading, but it is an understandable one.** Your friend is flattening Rorty's distinction between *justification* and *causation*, and she is missing the ethical core of his pragmatism (the reduction of cruelty).

  If you want to be fair to Rorty in your piece, you need to navigate three specific distinctions that save him from the "post-truth alibi" charge.

  ### 1. "The World" vs. "Truth"
  Rorty is an antirepresentationalist, which means he thinks language doesn't "mirror" nature. He famously argued that the world can *cause* us to hold beliefs, but it cannot *justify* them. Only other beliefs (and other people) can justify beliefs.

  Your friend's quote ("truth is what your contemporaries let you get away with") sounds like pure relativism. But for Rorty, "what you can get away with" isn't determined by a mob shouting the loudest. It is determined by the **practices of inquiry** within a community.

  If a Trump supporter claims the crowd size was the biggest ever, Rorty wouldn't say, "Well, that's their truth." He would point to the *practices* we use to verify crowd sizes (photos, transit records, aerial surveys). If the demagogue's claim doesn't cohere with the web of other beliefs we use to navigate the world (e.g., how we build stadiums, how we count tickets), it fails the pragmatic test. It isn't "useful." It doesn't help us cope.

  Rorty's point wasn't that reality doesn't exist; it was that we can't step outside our own skin to compare our words to "Reality as It Is In Itself." We have to compare our words to *other words*. But that doesn't mean all words are equal. Some words (scientific, journalistic, democratic) have better track records of helping us avoid pain and achieve our goals than others (conspiratorial, authoritarian).

  ### 2. Solidarity, Not Just Consensus
  The deeper engine of Rorty's philosophy isn't consensus; it's **solidarity** and the **reduction of cruelty**.

  In *Contingency, Irony, and Solidarity*, Rorty argues that the goal of a liberal society isn't to find The Truth, but to expand the circle of "us." Truth is a compliment we pay to beliefs that help us build a more inclusive, less cruel society.

  Here is where the "self-own" defense falls apart. A demagogue who says "the election was stolen" is not trying to expand the circle of "us." They are trying to shrink it. They are using language to exclude, punish, and humiliate. For Rorty, this is the ultimate sin.

  Rorty can object to post-truth politics not by saying, "You are violating the Laws of Logic," but by saying, "You are violating the norms of liberal democracy that keep us safe." He can argue that lying about election results destroys the *trust* necessary for a community to function. Since the goal of society is to facilitate cooperation and reduce suffering, actions that sabotage cooperation are pragmatically "false" (i.e., they don't work) and morally wrong.

  ### 3. The Prediction Was Sociological, Not Epistemological
  This is the crucial point for your piece. Rorty's prediction in *Achieving Our Country* didn't rely on his theory of truth. It relied on his theory of **class**.

  He predicted the strongman not because he thought truth was subjective, but because he knew that when you tell the working class their economic pain is less important than cultural semantics, they will eventually burn the house down. That is a materialist, causal prediction.

  The rise of post-truth politics, in Rorty's framework, isn't the inevitable result of saying "truth is socially constructed." It is the result of **abandoning the institutions** (unions, parties, local organizations) that used to vet claims and build shared reality. When the Left abandoned the workers, the workers lost trust in the "experts." The demagogue didn't win because epistemology died; he won because *solidarity* died.

  ### The Verdict for Your Piece
  Your friend's reading is the "Standard Objection" to Rorty, often leveled by realist philosophers like Habermas or Putnam. It's tempting because Rorty was often glib. He loved to provoke. He *did* say things that sound like he's handing a weapon to the post-truth merchant.

  However, to say Rorty supplied the alibi for post-truth politics is to confuse **metaphysical humility** with **moral surrender**.

  *   **Metaphysical Humility:** "I cannot prove my beliefs correspond to God's eye view of the universe."
  *   **Moral Surrender:** "Therefore, I cannot argue against your lies."

  Rorty never accepted the second point. He believed we should fight for our beliefs passionately, not because they are *Objective*, but because they are *Ours* and they make life better. He would argue that the "post-truth" crowd isn't offering an alternative truth; they are offering a tool of domination. And since Rorty's entire philosophy is geared toward identifying and stopping domination (cruelty), he has plenty of principled ground to stand on.

  **How to frame it:**
  You can write that Rorty is often accused of opening the door to post-truth politics by questioning the status of truth. But a closer reading suggests he actually diagnosed the *conditions* that allow post-truth to flourish: the abandonment of shared social projects in favor of cultural signaling. He didn't give the demagogue a license to lie; he warned us that if we stop caring about each other's economic dignity, we lose the shared reality required to call a lie a lie.

  That keeps the prediction without the self-own. It makes him not the godfather of post-truth, but the diagnostician of the broken trust that makes it possible.
