answer: |-
  **The Scenario**
  During a screening of *The Silent Ward*, a psychological horror film, a title card explicitly informs the audience that the tormented patient at the center of the narrative is a purely fictional composite, never based on a real person. Despite this conscious knowledge, when the patient is subjected to experimental therapy, viewer Sarah experiences a spike of authentic horror and nausea. She does not believe the patient exists, yet her physiological and phenomenological response mirrors that of witnessing actual abuse.

  **The Waltonian View**
  On Walton's account, Sarah's horror is a "quasi-emotion" generated by the principles of generation governing her game of make-believe, not a real emotion, because genuine horror requires the belief (or uncertainty) that the threatening object exists. Since Sarah knows the patient is fictional, she lacks the cognitive commitment necessary to constitute real horror; she is merely making-believe that she is horrified. The verdict diverges from the Thought Theory because Walton denies the mental state is truly *horror* at all—it is a distinct, fiction-specific psychological state that mimics the phenomenology of real emotion without the requisite existential belief, meaning the two theories are disagreeing on the ontological nature of the state itself, not just its label.

  **The Thought Theory View**
  On the Thought Theory account, Sarah's horror is a garden-variety real emotion because emotions are directed at thought-contents rather than existent objects. Entertaining the thought of the patient's suffering is sufficient to trigger the affective program of horror, rendering existential belief irrelevant to the emotion's reality. The verdict diverges from Walton's because the Thought Theorist insists the mental state is *identical* to real horror, arguing that Walton mistakenly conflates the object's existence with the emotion's ontological status; for them, the divergence is not about mimicry versus reality, but about whether belief is a constitutive condition of emotion.
