      *   The Aggregation Theorem says: If Society satisfies vNM + Pareto, then $V = \sum a_i U_i$.
      *   It does *not* say $a_i$ must be equal. It does *not* say $U_i$ are on the same scale.
      *   So, Robbins is right: Without an ethical postulate to fix scales/weights, you can't compare. Harsanyi admits this but argues the Veil of Ignorance provides that postulate.
