  The standard rejoinder—that foresight and backward induction (BI) immunize an agent with cyclic preferences against money pumps—rests on a fragile assumption: that the agent can treat a dynamic sequence of choices as a single, static choice between paths without incurring costs for *traversing* those paths. This assumption fails in environments where "stopping" or "keeping" is not costless. I argue that foresight cannot, in general, save a cyclic agent from exploitation. Even with flawless reasoning, a cyclic agent can be forced into a money pump if the choice architecture imposes switching costs that make exiting the cycle more expensive than completing it.

  ### The "Costly Exit" Money Pump

  Consider an agent with cyclic preferences $A \succ B \succ C \succ A$. She starts with $A$. The standard pump offers trades $A \to C$, $C \to B$, and $B \to A - \epsilon$. The rejoinder claims she will foresee the loss of $\epsilon$ and reject the first trade.

  Now, redesign the sequence of offers to include a **holding cost** (or exit penalty) at each node. Let $\delta$ be a small fee such that $\epsilon < \delta$.

  **The Scheme:**
  1.  **Node 1 (Hold $A$):**
      *   **Trade:** Swap $A$ for $C$. (Free)
      *   **Keep:** Retain $A$, but pay a fee $\delta$. (Final holding: $A - \delta$)
  2.  **Node 2 (Hold $C$):**
      *   **Trade:** Swap $C$ for $B$. (Free)
      *   **Keep:** Retain $C$, but pay a fee $\delta$. (Final holding: $C - \delta$)
  3.  **Node 3 (Hold $B$):**
      *   **Trade:** Swap $B$ for $A - \epsilon$. (Fee $\epsilon$ applied here)
      *   **Keep:** Retain $B$, but pay a fee $\delta$. (Final holding: $B - \delta$)

  **Backward Induction Analysis:**
  A foresighted agent reasons from the end of the tree:
  *   **At Node 3:** She compares keeping $B - \delta$ vs. trading for $A - \epsilon$. Since $A \succ B$ (from the cycle), and $\epsilon < \delta$, it follows that $A - \epsilon \succ B - \delta$. **BI recommends Trade.**
  *   **At Node 2:** She anticipates that trading leads to the Node 3 outcome ($A - \epsilon$). She compares keeping $C - \delta$ vs. the anticipated outcome $A - \epsilon$. Since $C \succ A$ (from the cycle), one might think she keeps $C$. However, we must account for the fees. We know $A \succ C$ is false, but is $A - \epsilon \succ C - \delta$?
      *   Here, we exploit the cycle's intransitivity. We stipulate the environment such that the monetary difference dominates the preference cycle between non-adjacent items. Specifically, let the "value" difference between $A$ and $C$ be smaller than the fee difference $\delta - \epsilon$.
      *   More simply, assume the agent prefers *any* amount of $A$ to *any* amount of $C$ minus a large fee. If $\delta$ is sufficiently larger than $\epsilon$, then $A - \epsilon \succ C - \delta$. **BI recommends Trade.**
  *   **At Node 1:** She anticipates the path leads to $A - \epsilon$. She compares keeping $A - \delta$ vs. the anticipated outcome $A - \epsilon$. Since $\epsilon < \delta$, $A - \epsilon \succ A - \delta$. **BI recommends Trade.**

  **The Verdict:**
  The agent accepts every trade. She starts with $A$ and ends with $A - \epsilon$. She has been money-pumped: she is strictly poorer than when she started, having paid $\epsilon$ to return to her initial state. A transitive agent ($A \succ B \succ C \succ A$ is false; assume $A \succ C$) would have rejected the first trade, kept $A$, paid $\delta$ (or rejected the fee if optional), but crucially, in a standard pump without fees, the transitive agent pays 0. In this *redesigned* pump, the transitive agent pays 0 (rejects trade 1 because $A \succ C$), while the cyclic agent pays $\epsilon$.

  Foresight did not save her. It merely guided her to the *least expensive* route through the pump. Because the "exit" options (Keep) were penalized, foresight dictated *entering* the pump to minimize loss.

  ### Addressing the "Unreachable Node" Worry

  A natural objection is that Backward Induction is untrustworthy at choice nodes that, by its own prescription, should never be reached. If BI tells the agent to "Stop at Node 1," then Node 2 is counterfactual. Why should preferences at Node 2 influence the decision at Node 1?

  This worry relies on the assumption that the agent can **commit** to her Node 1 plan. For an agent with cyclic preferences, this assumption is false.
  1.  **Dynamic Inconsistency:** Cyclic preferences imply dynamic inconsistency. What the agent plans to do at Node 1 (Stop) conflicts with what her preferences will dictate at Node 2 (Trade, because $B \succ C$).
  2.  **Credibility of Plans:** If the agent knows she is dynamically inconsistent, she knows her Node 1 plan to "Stop" is not credible. Her future self *will* trade if given the chance. Therefore, when reasoning at Node 1, she cannot treat "Stop" as a guaranteed outcome. She must treat "Stop" as "Attempt to Stop, but likely fail and continue."
  3.  **The Necessity of Counterfactuals:** In dynamic choice, predictions about future behavior are causal inputs to current decisions. Even if a node is "unreachable" in the optimal plan, it is reachable in the *actual* trajectory if the agent lacks binding commitment. Since the cyclic agent cannot bind her future self, she must reason based on what her future self *will* do, not what she *wishes* it would do. This forces her to evaluate the "Trade" path accurately, leading her into the trap described above.

  ### Conclusion

  The claim that foresight saves the cyclic agent is only true in a frictionless environment where exiting a sequence is costless and commitment is perfect. In any realistic environment where switching or holding incurs costs, or where the agent cannot bind her future selves, Backward Induction does not block the money pump; it merely optimizes the exploitation. The agent is still left poorer than a transitive agent would be in the same situation. Therefore, the Money-Pump argument stands: cyclic preferences render an agent vulnerable to exploitation even under conditions of full foresight and rational calculation. Transitivity is not just a requirement for myopic agents; it is a requirement for dynamic stability in any non-trivial choice environment.
