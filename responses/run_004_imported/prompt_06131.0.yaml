answer: |-
  This is a rich and nuanced angle for a piece. Your working assumption captures the *emotional* climate of Sidgwick's life (the Victorian crisis of faith), but it misses the *philosophical* machinery that connects his psychical research to his ethics. Furthermore, labeling him "credulous" would be a significant historical error that would undermine the credibility of your reporting.

  Here is a breakdown of how to refine your understanding of Sidgwick, structured around your specific questions.

  ### 1. Is psychical research a private religious project separate from his philosophy?
  **Verdict:** No. There is a direct, structural line from *The Methods of Ethics* to the Society for Psychical Research (SPR).

  Your assumption that this was about "salvaging Christian faith" is partially correct in spirit but incorrect in doctrine. Sidgwick was not trying to save the Bible, the Church, or orthodox Christian dogma. By the time he founded the SPR in 1882, he was effectively an agnostic who had quietly resigned from his fellowship at Trinity College because he could no longer sign the Thirty-Nine Articles.

  **The Philosophical Link: The Dualism of Practical Reason**
  The connection lies in the conclusion of *The Methods of Ethics* (1874). Sidgwick identifies a catastrophic problem in moral philosophy, which he calls the "Dualism of Practical Reason."
  *   **Utilitarianism** demands we maximize general happiness.
  *   **Egoism** demands we maximize our own happiness.
  *   In a purely materialist universe (one without God or afterlife), these two rational imperatives often conflict. If being moral ruins your life and you cease to exist at death, it is arguably *irrational* to be moral.

  Sidgwick concluded that for morality to be fully rational, there must be a "cosmic moral order" where virtue and happiness are ultimately aligned. This requires **immortality** and **divine governance**.

  He turned to psychical research not to find Jesus, but to find *empirical evidence of survival*. He hoped science could prove the soul exists, thereby solving the Dualism of Practical Reason. As he wrote to a friend, if psychical research could establish survival, it would "render a moral government of the universe credible."

  **Reporting Angle:** Instead of framing it as "Philosophy vs. Séances," frame it as "Ethics requiring Empirical Metaphysics." The SPR was his attempt to use the scientific method to solve a philosophical deadlock.

  ### 2. Is it fair to call him a credulous believer?
  **Verdict:** Absolutely not. In fact, his value to the SPR was precisely that he *wasn't* credulous.

  Sidgwick approached psychical research with the same rigorous, dry skepticism he applied to ethics. He was terrified of self-deception and fraud.
  *   **The Fraud Hunter:** Sidgwick was instrumental in exposing fraudulent mediums. In 1876, he traveled to the US to investigate the famous slate-writing medium Henry Slade. Sidgwick caught Slade cheating (swapping slates under the table) and published a damning report. This actually made him unpopular with spiritualists who wanted a figurehead, not a auditor.
  *   **Methodological Rigor:** He insisted on controlled conditions, cross-examination of witnesses, and the elimination of normal explanations. He famously stated that he wanted evidence that would convince a "reasonable man," not just a believer.
  *   **The "Agnostic Seeker":** He described his position not as belief, but as a refusal to accept the materialist dogma that *nothing* exists beyond the physical. He felt that the scientific establishment was being just as dogmatic in its denial of the paranormal as the Church was in its affirmation of dogma.

  **Reporting Angle:** Portray him as the "Skeptical Founder." His involvement legitimized the SPR because he was known as the most exacting mind of his generation. If *Sidgwick* was investigating this, Cambridge had to take it seriously.

  ### 3. Did his investigations turn up the evidence he was looking for?
  **Verdict:** No. And this is the tragedy of his intellectual life.

  Sidgwick spent decades and much of his personal fortune investigating telepathy, apparitions, and mediums.
  *   **The Result:** He never found the "conclusive proof" he needed to resolve the Dualism of Practical Reason. He found anomalies he couldn't explain (which kept him going), but nothing that met his high bar for scientific proof.
  *   **The Personal Cost:** This created a profound tension in his life. He needed immortality for his ethics to work, but his own empiricism couldn't confirm it. He lived and died in a state of "rational hope" rather than conviction.
  *   **Eleanor Sidgwick:** It is crucial to mention his wife, Eleanor. She was an equally brilliant mathematician and philosopher who succeeded him as President of the SPR. Their correspondence reveals a shared, desperate hope for evidence, and a shared disappointment.

  ### Summary for Your Piece

  If you stick to the "private religious project" narrative, you risk flattening Sidgwick into a typical Victorian struggling with Darwin. The more compelling story is the **philosophical desperation**.

  **Key Narrative Arc:**
  1.  **The Problem:** Sidgwick proves in *Methods of Ethics* that without an afterlife, morality is irrational.
  2.  **The Solution:** He needs empirical proof of the afterlife to save morality, not religion.
  3.  **The Method:** He helps found the SPR to apply scientific rigor to the supernatural.
  4.  **The Twist:** His rigor is so high that he exposes the very frauds he hopes might be real.
  5.  **The Tragedy:** He dies without the proof he needed, leaving the "Dualism" unresolved.

  **Recommended Sources for Verification:**
  *   **Bart Schultz, *Henry Sidgwick: Eye of the Universe*:** This is the definitive modern biography. It deals extensively with the link between his ethics and his psychical research.
  *   **The Sidgwick Letters:** Specifically correspondence with Frederick Myers (co-founder of SPR).
  *   **Sidgwick's Essay "The Scientific Study of Supernatural Phenomena" (1882):** Lays out his methodological stance.
  *   **J.B. Schneewind, *Sidgwick's Ethics and Victorian Moral Philosophy*:** For the technical breakdown of the Dualism of Practical Reason.

  **One final nuance:** Be careful with the word "Paranormal." In Sidgwick's time, they used terms like "Supernatural Phenomena" or "Telepathy" (a term Myers coined). Using their vocabulary can help ground the piece in the period.

  Sidgwick is not a story of a rational man losing his mind to spirits; he is a story of a rational man realizing his rationality required something the science of his day couldn't provide, and spending his life trying to bridge that gap.
