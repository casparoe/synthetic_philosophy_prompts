answer: |-
  **MEMORANDUM**

  **TO:** The Whitmore Fellowship Selection Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendations Regarding Audit Findings and Public Reporting

  **I. Purpose**

  As we prepare to vote on our public response to the recent allegations regarding MFA bias, I am circulating this memo to outline my position on our reporting language and future selection process. My goal is to propose a course of action that honors the statistical integrity of our audit while taking seriously the ethical concerns raised regarding structural disparity. We must avoid the twin pitfalls of hiding behind technicalities and capitulating to pressure that compromises our blind review standards.

  **II. The Statistical Reality**

  I want to begin by validating the work of our audit subcommittee. The biostatistical analysis is sound. The discrepancy between our aggregate acceptance rates (18% MFA vs. 8% non-MFA) and our genre-specific rates (where non-MFA applicants fare equally or better) is a clear instance of Simpson's Paradox.

  The data confirms that the Selection Committee is not actively discriminating against non-MFA applicants during the reading process. In fact, within the specific contexts of Fiction and Poetry, our readers are selecting non-MFA work at rates that match or exceed their MFA counterparts. To claim otherwise would be to contradict the evidence. Therefore, I agree with the recommendation that we must publish the disaggregated data. Transparency is our only defense against speculation.

  **III. The Ethical Reality**

  However, I also believe we must take the concerns of the second camp seriously. A finding of "no bias in selection" is not synonymous with "no disparity in access."

  The worry that we are using a statistical technicality to wave away a genuine disparity is not a failure to understand the math; it is a refusal to let the math be the final word on our mission. As noted in the audit, the applicant pool itself is skewed: Fiction draws mostly non-MFA writers, while Poetry draws mostly MFA writers. One colleague suggested this is because the technical training required for a competitive poetry manuscript is disproportionately housed within MFA programs.

  If this is true, then our "blind" process is fair, but our *landscape* is not. By accepting the pool exactly as it arrives without acknowledging why it looks that way, we risk mistaking equality of treatment for equity of opportunity. If the Whitmore Fellowship aims to support *emerging* writers, we have a stewardship obligation to consider why "emergence" looks different in poetry than it does in fiction.

  **IV. Recommendations**

  To address both the statistical facts and the ethical concerns, I propose the following two-part recommendation:

  **1. Public Report Language**
  We should publish the full audit, including the genre-level breakdowns, but the accompanying narrative must be carefully framed.
  *   **Do:** State clearly that the selection process itself shows no bias against non-MFA applicants within genres.
  *   **Do Not:** Use language suggesting the matter is "closed" or that the allegations were "unfounded."
  *   **Proposed Phrasing:** *"While the selection data indicates no bias within our review process, the aggregate disparity highlights a structural imbalance in our applicant pool. We acknowledge that the pathways to competitiveness in poetry may currently favor those with institutional training. We view this not as an exoneration of the status quo, but as a call to examine the ecosystem surrounding the fellowship."*

  This allows us to defend our readers' integrity without dismissing the reality of the pipeline.

  **2. Process Changes for the Upcoming Cycle**
  I recommend **no changes to the blind selection mechanism.** Introducing biographical data or quotas would compromise the meritocratic core of the Whitmore and erode trust in the prize. However, we should implement changes to our **outreach and mentorship infrastructure.**

  *   **Action:** Establish a "Pipeline Working Group" tasked with increasing outreach to non-MFA poetry communities (writing centers, independent workshops, library programs) prior to the application window.
  *   **Action:** Expand the fellowship's mentorship component. If non-MFA poets are less likely to apply because they feel their manuscripts are not "ready," we should consider offering a pre-application manuscript workshop for finalists who do not win, specifically funded to help non-credentialed writers refine their work for future cycles.

  **V. Conclusion**

  We are not merely auditors of a process; we are stewards of a community. The statistician is right that the numbers clear us of malpractice. The skeptics are right that clearing ourselves of malpractice does not absolve us of the responsibility to foster a diverse literary field.

  By publishing the nuance of the data and committing resources to the pipeline rather than the selection box, we can maintain the integrity of the blind read while acknowledging that the playing field outside this room is not level. I urge the committee to adopt this dual approach.

  I am available to discuss this further before our vote in three weeks.
