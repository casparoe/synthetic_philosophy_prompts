      *   *Why CPA matters:* If they start at different locations (different priors), even if they walk the exact same distance in the exact same direction based on new evidence (likelihoods), they end up in different places.
      *   *The "Weighting" Intuition:* Priors represent how much you trust the signal vs. your baseline belief. If I think a coin is likely biased (Prior: 90% Heads) and you think it's fair (Prior: 50% Heads), seeing 3 Heads in a row moves us both toward "Heads," but I stay much higher than you. We know each other's numbers, but we can't converge because our *interpretation of the evidence's impact* is anchored differently.
      *   *Addressing the other conditions:*
          *   *Bayesian Updating:* If they don't update Bayesially, they aren't "rational" in the Aumann sense. But even perfect updating can't bridge a gap in starting coordinates.
