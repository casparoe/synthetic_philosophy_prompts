      *   **Introduction:** Set the stage. Acknowledge Priest's ambition. The PUS is the selling point. State the thesis: Curry's paradox exposes a fatal fissure in this unity.
      *   **The Inclosure Schema & The Liar:** Briefly explain how Priest unifies the Liar and Russell via IS. The solution is "transclassical" validity (LP), accepting the contradiction at the boundary.
      *   **The Curry Outlier:** Explain why Curry is different. It's negation-free. It doesn't produce a glut; it produces *explosion* (triviality).
      *   **The Technical Mismatch:**
          *   LP handles the Liar by tolerating $A \land \neg A$.
          *   LP *cannot* handle Curry with its standard conditional. The LP conditional ($A \to B \equiv \neg A \lor B$) fails Modus Ponens.
