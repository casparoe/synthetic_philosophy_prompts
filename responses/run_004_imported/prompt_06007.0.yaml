      *Let's go.*
answer: |-
  The Principle of Uniform Solution (PUS) is the linchpin of Priest's dialetheic project. It is the primary rhetorical and philosophical weapon he wields against the "orthodox" approach. Priest argues that classical logicians are guilty of *ad hoc* patchwork: they impose Tarskian hierarchies for semantic paradoxes, restrict comprehension for set-theoretic paradoxes, and treat vagueness with supervaluationism. In Priest's view, this lack of unity is a theoretical vice. The Inclosure Schema (IS) is supposed to demonstrate that these paradoxes share a common structure (transcendence and closure), and therefore, dialetheism offers the superior, unified response: accept the contradiction at the boundary.

  However, Curry's paradox represents a fatal fissure in this unity. You are right to press on this. The claim that dialetheism offers a "uniform solution" is unsustainable because the mechanism required to solve Curry is categorically distinct from the mechanism required to solve the Liar. Consequently, dialetheism collapses into the very patchwork approach it condemns.

  ### The Mismatch of Mechanisms

  To see why the PUS fails, we must look closely at what "solution" means in each case.

  For the Liar and Russell's paradox, the dialetheic solution is **semantic and ontological**. The logic (LP) remains largely classical in its structural rules. Contraction holds. Modus Ponens (for the material conditional) holds. What changes is the valuation function: we allow truth-value gluts. The contradiction $A \land \neg A$ is accepted as true. The "solution" is to expand the range of truth values to include the inconsistent, thereby blocking explosion (Disjunctive Syllogism fails) while maintaining standard inferential machinery.

  Curry's paradox, however, is negation-free. It proceeds from a sentence $C$ equivalent to $C \to \bot$ (or $C \to A$ for arbitrary $A$). Using only Identity, Contraction, and Modus Ponens, one derives $\bot$.
  1. $C \leftrightarrow (C \to \bot)$ (Assumption)
  2. $C \to (C \to \bot)$ (From 1)
  3. $C \to \bot$ (From 2, Contraction)
  4. $C$ (From 1, 3)
  5. $\bot$ (From 3, 4, MP)

  Accepting a truth-value glut does **nothing** to stop this derivation. There is no negation to generate a contradiction that LP can tolerate; there is only a direct path to triviality. If you accept the Curry sentence as a glut (both true and false), you still derive $\bot$ via the conditional rules.

  Therefore, to survive Curry, the dialetheist cannot simply rely on the semantic fix of LP. They must alter the **structural rules of inference**. Specifically, they must restrict Contraction or detachability (Modus Ponens) for the conditional involved in the paradox.

  This is not the "same kind" of solution.
  *   **Liar Solution:** Keep the logic strong; weaken the semantics (allow gluts).
  *   **Curry Solution:** Keep the semantics stable; weaken the logic (drop Contraction/MP).

  Priest's PUS demands that paradoxes instantiating the Inclosure Schema receive the *same kind* of solution. But here we have two different remedies for two instances of the same schema. For the Liar, we say, "Logic is fine, the world is contradictory." For Curry, we say, "The world might be fine, but logic is weaker than we thought." This is precisely the kind of theoretical disunity Priest attributes to the Tarskian. The Tarskian says, "Restrict truth predicates here, restrict sets there." The Dialetheist says, "Accept gluts here, restrict contraction there." The charge of *ad hoc* patchwork sticks.

  ### The Dialetheist Comeback: "Dialetheism about Validity"

  The most sophisticated dialetheic response (which Priest explores in *Beyond the Limits of Thought* and later papers) is to argue that the solution *is* uniform because Curry also fits the Inclosure Schema, and thus the solution is to accept a contradiction regarding **validity** itself.

  On this view, the inference in Curry's paradox is both valid and invalid. The contradiction is not just in the truth of the sentences, but in the logical consequence relation. We accept that the derivation of $\bot$ is valid (by the standards of the object logic) but also that it is invalid (because it leads to triviality). Thus, the "solution" remains dialetheic: we accept a glut. We just locate the glut in the meta-logical predicate "is valid" rather than the object-logical predicate "is true."

  Priest might argue this preserves uniformity: in both cases, we are accepting a true contradiction generated by the Inclosure Schema.

  ### Why the Comeback Fails

  This maneuver does not rescue the Principle of Uniform Solution; it merely relocates the disunity to a higher level while sacrificing the normative force of the logic.

  **1. It admits the structural restriction anyway.**
  To say "the inference is both valid and invalid" is, in practice, to acknowledge that the inference cannot be relied upon to preserve truth in the standard way. If I am reasoning and I encounter a Curry sentence, I cannot use Contraction. If I could, I would derive $\bot$. Even if I call this a "validity glut," the practical upshot is that I must **inhibit** the use of Contraction in my reasoning system to avoid triviality.
  So, practically speaking, the logic used to navigate the Liar (LP with full Contraction) is different from the logic used to navigate Curry (LP minus Contraction, or a substructural variant). The "uniformity" is merely verbal (both are called "dialetheic"), but the technical implementation is fragmented. You still need one set of rules for negation-heavy paradoxes and a stricter set of rules for conditional-heavy paradoxes.

  **2. It undermines the normative role of logic.**
  Logic is supposed to tell us how we ought to reason. If the solution to Curry is that the inference is "valid and invalid," what is the normative guidance? If I believe $C$ and $C \to (C \to \bot)$, ought I believe $\bot$?
  *   If yes, I am trivial.
  *   If no, I am treating the inference as invalid.
  To say it is "both" is to dissolve the normative constraint. A logic that validates explosion in one sense but forbids it in another is not a unified guide to reasoning; it is a description of a conflict. By pushing the glut up to validity, Priest concedes that the object-level logic *cannot* sustain the derivation. This means the "solution" to Curry is effectively to break the logic, whereas the "solution" to the Liar is to break the semantics. Breaking two different components of the system (semantics vs. proof theory) is not a uniform solution.

  **3. It recreates the hierarchy.**
  If validity itself is glutty, we need a meta-logic to reason about that validity without triviality. But if the meta-logic is subject to Curry (and why wouldn't it be?), we need a meta-meta-logic. Priest wants to avoid hierarchies. But if the "uniform solution" requires us to treat validity as inconsistent, we inevitably need a consistent meta-theory to explain *why* we aren't trivial, or else we slide into trivialism. If we posit a consistent meta-theory to handle the glutty validity of the object theory, we have reinstated the Tarskian hierarchy Priest sought to destroy. We are once again saying, "The object language is inconsistent, but the metalanguage must be kept safe."

  ### Conclusion

  The Principle of Uniform Solution is dialetheism's strongest selling point, but Curry's paradox exposes it as a marketing slogan rather than a technical reality. The Liar requires a semantic expansion (gluts); Curry requires a structural contraction (restricting inference rules). These are fundamentally different theoretical moves.

  Attempting to unify them by claiming "validity is glutty" fails because it either forces the dialetheist to abandon the normative guidance of logic (making it useless for reasoning) or forces them to reintroduce a hierarchy to manage the glutty validity. In either case, the dialetheist is guilty of the exact sin Priest accuses the classical logician of: tailoring the logical framework differently for different paradoxes to save the system from collapse. Curry shows that you cannot have your uniform cake and eat it too; you must either restrict contraction (abandoning the simplicity of LP) or accept triviality. Neither option preserves the elegant, unified picture Priest advertises in *Introduction to Non-Classical Logic*.
