answer: |-
  **Setting:** *The dimly lit lounge of the Chicago Marriott. It's 11 PM on the second night of the Linguistic Society conference. Elena (Semanticist) and Mark (Pragmaticist) are sharing a high-top table, surrounded by empty glasses and a copy of the conference program used as a coaster.*

  **Elena:** You're dodging the intuition pump, Mark. Take the case: A guy hears a bigot call Hans a *kraut*, and he snaps back, "He's not a *kraut*, he's just German, quit it." He's defending Hans. He's negating the slur. But if I hear that in the wild, I still wince. Why?

  **Mark:** Because you're a semanticist and you think words are little vials of essence. I wince because he tokened a prohibited word-form. Anderson and Lepore got this right: it's a social rule, like "don't shout fire." You don't get to shout fire just because you add "there is no."

  **Elena:** That's lazy normativity. If it's just a taboo, why *this* word? Why not "He's not a *schnitzel*"? The prohibition exists *because* of the content. On my view—Hom's view—that word encodes a racist ideology as truth-conditional content. To understand the negation, you have to access the ideology.

  **Mark:** But that's where your combinatorial externalism bleeds out. If the ideology is part of the truth conditions, and the ideology is false, then "Hans is a *kraut*" is false. So "Hans is *not* a *kraut*" is straightforwardly true. You've asserted a truth. Why does the poison stick if the semantics are clean?

  **Elena:** Because the semantics *aren't* clean. The word *is* the perspective. You can't deny the perspective without forcing the listener to simulate it. You're making the audience hold the racist ideology in their working memory just to reject it. That cognitive act *is* the harm.

  **Mark:** So you're saying truth doesn't matter? If I say, "He's not a witch, witches don't exist," I'm not harming anyone by making them think about witches. Your theory makes slurs metaphysically magical. Mine just says: there's a rule. You broke the rule. The intent is irrelevant to the violation.

  **Elena:** But your rule is arbitrary without the metaphysics! If I say, "I didn't call him a *kraut*," I'm speaking metalinguistically, and it's okay. But in my case, "He's not a *kraut*," I'm using the word, not mentioning it. Your theory can't explain why the *use* feels dirty even when the *assertion* is anti-racist.

  **Mark:** Because the prohibition targets the token, not the assertion. Think of it like a hazardous material suit. You don't take it off just because you're entering the room to clean up a spill. You said the word. You exposed everyone to the vector. Whether you used it to infect or inoculate, the exposure happened.

  **Elena:** But that ignores the *empty extension*. On my view, *kraut* refers to nothing. So when the defender says, "He's not a *kraut*," he's technically saying, "He does not belong to the empty set of people who fit this Nazi ideology." It's a tautology. Why does a tautology feel like a transgression?

  **Mark:** Because language isn't just truth conditions, Elena. It's practice. If I hand you a envelope labeled "Anthrax" and say, "This isn't Anthrax," you still drop the envelope. Your theory struggles because you want the harm to be in the *proposition*. I'm telling you the harm is in the *performance*.

  **Elena:** And your theory struggles because you can't explain why the performance hurts *more* than other taboos. If I swear at a funeral, it's rude. If I use a slur, it's violence. That difference has to be in the content, in the ideology you're dragging into the room, even if you're dragging it out again.

  **Mark:** Maybe. But until you can explain why negation doesn't sanitize the content, you're stuck saying that telling the truth about a slur is morally equivalent to lying with it. And I can't buy that. I'd rather say we both did the wrong thing by saying the word, but you did the *more* wrong thing by thinking you could cleanse it with logic.

  **Elena:** *Raises her glass.* I'll drink to that. We both agree the word stays in the bottle. We just disagree on whether the poison is the glass or the liquid.

  **Mark:** *Clinks.* To the bottle, then. May it stay corked.
