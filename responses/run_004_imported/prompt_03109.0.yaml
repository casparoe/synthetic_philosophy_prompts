  2.  **Initial Knowledge Retrieval & Verification:**
      *   *Inner Alignment (Hubinger et al., "Risks from Learned Optimization"):* Specifically posits that the learning process produces a *mesa-optimizer* (a subsystem that is itself an optimizer). This mesa-optimizer has a *mesa-objective*. Inner misalignment occurs when the mesa-objective $\neq$ base objective. Key mechanism: Internal search/optimization.
      *   *Goal Misgeneralization (Langosco et al., "Goal Misgeneralization in Deep Reinforcement Learning"):* Defined as the model's capabilities generalize, but its goal does not. It happens when the training signal is consistent with multiple goals, and the model picks the wrong one. Key mechanism: Ambiguity in the training signal leading to incorrect inductive bias. Does *not* require the model to be an optimizer internally.
      *   *Relationship:* All inner alignment failures (in the Hubinger sense) are instances of goal misgeneralization, but not all goal misgeneralization instances are inner alignment failures.
      *   *The "Real Work":* Which concept is more useful for safety research? Which one captures the actual risk better?

