  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Is Arthur too straw-man-ish? *Correction:* Make sure he acknowledges that the *data* didn't change, but the *interpretation framework* requires the stopping rule. He shouldn't say the data are different, but that the *metric* is broken.
      *   *Check:* Is Elena too dogmatic? *Correction:* Have her acknowledge that priors matter and that bad priors + optional stopping can still be misleading, even if LP holds.
      *   *Check:* Is there progress? *Correction:* Ensure they move from "You're wrong" to "We are optimizing for different things." The distinction between *inference* and *decision/behavior* is key here (a la Cox or Mayo vs. Savage).

  6.  **Writing the Dialogue (incorporating technical details):**
