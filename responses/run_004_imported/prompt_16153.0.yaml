      *   **Round 1: The Core Dispute.** Arthur brings up the alpha inflation. Elena brings up the Likelihood Principle.
      *   **Round 2: The "Intentions" Problem.** Elena presses on the vagueness of stopping rules (the "felt like enough" argument). Arthur counters that vagueness doesn't negate the mathematical reality of the sampling distribution.
      *   **Round 3: The Purpose of Statistics.** Arthur argues statistics is about quality control (long-run). Elena argues it's about measuring evidence (specific case).
      *   **Round 4: Dialectical Progress.** They realize they are talking past each other regarding the *goal* of the analysis. Arthur concedes that for *evidence*, Elena is right, but for *regulation*, he is right. Elena concedes that transparency is needed even for Bayesians to prevent "p-hacking by another name" (BF-hacking).
