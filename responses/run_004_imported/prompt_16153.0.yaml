answer: |-
  **Setting:** *The lounge bar of the convention center hotel. It is 11:30 PM on the second night of the Society for Research Integrity conference. The room is mostly empty save for two figures huddled over a small table littered with napkins covered in equations.*

  **Characters:**
  *   **Arthur:** A senior frequentist statistician. Wears a rumpled blazer. Concerned with error rates, institutional norms, and the long-run properties of procedures.
  *   **Elena:** A senior Bayesian statistician. Sharp-eyed, leaning forward. Concerned with coherence, evidence, and the Likelihood Principle.

  ***

  **Arthur:** (Swirling the ice in his whiskey) Look, Elena, I know you think the Likelihood Principle is the gospel truth. But you can't tell me that if I flip a coin until I get ten heads, and you flip a coin ten times and get ten heads, the *inference* should be identical. In my world, you've tested a different hypothesis space. You've opened the door to infinity.

  **Elena:** (Sipping her wine) But the data are identical, Arthur. Ten heads. The likelihood function $P(Data | \theta)$ is proportional to $\theta^{10}$ in both cases. If the evidence provided by the data depends on the experimenter's private intentions about when to stop, then science becomes a mind-reading contest. If I stop because I ran out of grant money, and you stop because you hit significance, but we observe the same sequence, how can the strength of evidence differ?

  **Arthur:** Because the $p$-value isn't a measure of evidence in a single case. It's a performance metric. It's a guarantee. If I tell a journal, "I control my false positives at 5%," I am making a promise about my behavior over the long run. If you peek at the data every ten subjects and stop when $p < .05$, you break that promise. You inflate the Type I error rate to something like 15% or 20%, depending on how often you peek. You're selling a 5% product that actually leaks at 20%.

  **Elena:** I grant you the math on the inflation. I'm not disputing the sampling distribution calculation. I'm disputing its relevance to *inference*. The Likelihood Principle says that all the evidence relevant to a parameter is contained in the likelihood function. The stopping rule is a function of the data, yes, but it doesn't change the probability of the data given the hypothesis. Why should I penalize the researcher for being efficient? If the effect is real, optional stopping lets me find it faster. If it's null, the likelihood ratio will eventually favor the null, regardless of when I stop.

  **Arthur:** "Eventually." That's the problem. In the social sciences, nobody waits for "eventually." They stop the moment the Bayes Factor hits 3, or the $p$-value hits .05. If you tell them the stopping rule doesn't matter, you are giving them a license to hunt. You're saying, "Keep sampling until the data say what you want, and then claim the evidence is strong." Even with Bayes Factors, if you use a vague prior and stop when BF > 3, you can bias the result.

  **Elena:** That's a prior problem, not a stopping problem. And frankly, Arthur, your position requires a level of psychic omniscience that doesn't exist. You say the stopping rule invalidates the $p$-value. Fine. But what is the stopping rule? In this student's case, they checked every two weeks. But what if they missed an email? What if they stopped because they felt "it was enough"? If the validity of the inference hinges on a sharply defined stopping intention, and human beings are notoriously bad at defining or adhering to those intentions, then your $p$-values are almost always invalid anyway. You're building a cathedral on a foundation of self-reported honesty.

  **Arthur:** (Nods slowly) That is a fair point. The "sharp null" of the experimental design is often fuzzy in practice. But the solution isn't to ignore the stopping rule; it's to enforce transparency. Pre-registration. If you declare, "I will sample until N=200," and you stop at N=150 because $p < .05$, you have violated the protocol. The $p$-value is conditional on the protocol. If you change the protocol mid-stream without accounting for it, the conditional probability is meaningless.

  **Elena:** But why condition on the protocol? Why condition on data you *could* have seen but didn't? That's the heart of it. You are judging the data based on the ghost of experiments past—the ones you would have run if the first twenty subjects hadn't been significant. I judge the data on what actually happened. If I observe a likelihood ratio of 10:1, that means the data are ten times more probable under H1 than H0. That ratio doesn't care if I planned to stop at N=100 or N=1000.

  **Arthur:** Because you are talking about *evidence*, and I am talking about *error control*. We are using the same word, "inference," to mean two different things. You want to know what to believe *now*. I want to know how often we'll be wrong if we let everyone do this *forever*. If we adopt your view, and we tell every grad student, "Stop whenever the likelihood looks good," the literature will fill with false positives. Not because the likelihood is wrong, but because the selection mechanism is biased.

  **Elena:** So the problem isn't the statistic; it's the selection.

  **Arthur:** Precisely. The stopping rule is a selection mechanism.

  **Elena:** Then let's make progress. Suppose I concede that for *decision-making*—like approving a drug or publishing a paper as a definitive fact—your long-run error rates matter. A regulatory body needs to know the false positive rate of the *process*. But for *scientific learning*—updating my degree of belief about a psychological phenomenon—surely the Likelihood Principle holds? If I am a Bayesian, and I update my posterior, the stopping rule drops out of the math.

  **Arthur:** It drops out of the *updating* math, yes. $Posterior \propto Likelihood \times Prior$. But it doesn't drop out of the *calibration* of that posterior. If you simulate a Bayesian who optional stops on Bayes Factors, their posteriors will be overconfident relative to the truth. They will claim 95% credible intervals that cover the truth less than 95% of the time.

  **Elena:** (Pauses) That's the calibration argument. But a Bayesian doesn't claim coverage in the frequentist sense. I claim coherence. If I am coherent, no bookie can Dutch book me. However... I will concede this: if the goal is to communicate with a frequentist world, using a method that ignores stopping rules while presenting it as a $p$-value is dishonest. It's category error.

  **Arthur:** And I will concede this: If the student presents this as a Bayesian analysis, with explicit priors, the stopping rule is indeed irrelevant to the internal coherence of the conclusion. The reviewer is attacking a frequentist metric ($p$-value) with a frequentist objection (optional stopping). If the lab is moving to Bayesian methods, they shouldn't be reporting $p$-values at all.

  **Elena:** So the student is stuck in a translation layer. They collected data using a heuristic (stop when it looks significant), which violates frequentist assumptions, but they are trying to report a frequentist metric.

  **Arthur:** Exactly. If they want to keep the $p$-value, they must correct for the peeking. There are sequential analysis methods—alpha spending functions—that allow for peeking if you account for it. They didn't do that. They just stopped. So the $p$-value is, mathematically, broken.

  **Elena:** But if they switch to a Bayesian reporting standard, they can argue that the evidence is what it is. However, they must address the "BF-hacking" concern I raised earlier. Even if the stopping rule doesn't change the likelihood, stopping when the BF favors your hypothesis can exaggerate the *apparent* strength of evidence in a meta-analytic sense.

  **Arthur:** So here is where we might meet. The stopping rule is irrelevant for the *meaning* of the likelihood function (you win there), but it is highly relevant for the *reliability* of the scientific record when aggregated across many studies (I win there).

  **Elena:** Agreed. The Likelihood Principle tells me how to interpret the data in front of me. It does not tell me how to design a system of science that prevents self-deception.

  **Arthur:** And my error-rate control tells me how to design a system that prevents self-deception. It does not tell me how much I should believe this specific result in isolation.

  **Elena:** So, for the student?

  **Arthur:** They cannot report the uncorrected $p$-value. It is objectively inflated. To do so is to report a number that claims a 5% false positive rate when the actual rate is higher. That is misleading.

  **Elena:** But they don't necessarily have to throw out the data. If they re-analyze using Bayesian methods, they can present the Bayes Factor. They must disclose the stopping rule transparently, not because it invalidates the math, but because it allows readers to assess the potential for bias in the *process*.

  **Arthur:** I can live with that. But they need to acknowledge that a Bayes Factor obtained through optional stopping is "cheaper" than one obtained through a fixed design. It requires less data to reach the same threshold.

  **Elena:** I'd phrase it differently. I'd say the evidence is valid, but the *efficiency* of the data collection was higher. However, to satisfy reviewers like you, they should probably run a sensitivity analysis. Show that the conclusion holds even if we penalize for the peeking, or show the robustness across different priors.

  **Arthur:** (Raises his glass) Transparency. That's the bridge. You keep your Likelihood Principle; I keep my Error Rates. But we both demand the researcher tell the truth about what they did.

  **Elena:** (Clinks her glass) The stopping rule doesn't change the data, Arthur. But hiding the stopping rule changes the scientist.

  **Arthur:** I'll drink to that. Now, about this alpha spending function...

  ***

  **Post-Dialogue Note for the Researcher:**

  The dialogue highlights that the dispute is not merely about math, but about the *purpose* of the statistic you report.

  1.  **If you report a $p$-value:** You are invoking a frequentist framework. In this framework, Arthur is correct. The $p$-value is defined by the sampling distribution under the null hypothesis. That distribution changes if the stopping rule is "stop when significant." An uncorrected $p$-value in this context is mathematically invalid because it misrepresents the false positive rate. You cannot defend an uncorrected $p$-value against a frequentist reviewer without correcting for the sequential testing (e.g., using a sequential probability ratio test or alpha-spending correction).
  2.  **If you report a Bayes Factor:** You are invoking a likelihood-based framework. In this framework, Elena is correct. The stopping rule is irrelevant to the calculation of the Bayes Factor *for that specific dataset*. However, as Elena conceded, transparency is required so readers can understand the data collection process.
  3.  **The Path Forward:** Since your paper was returned for revisions regarding the $p$-value, you likely cannot simply ignore the reviewer. You have three options:
      *   **Correct the $p$-value:** Use a sequential analysis correction (e.g., Bonferroni adjustment for the number of "peeks" or a more formal alpha-spending function) to show the result holds even when the error rate is properly controlled.
      *   **Switch to Bayesian Reporting:** Re-analyze the data using Bayes Factors (as your co-advisor suggests). In the revision letter, explicitly state that you are adopting a likelihood-based inference framework where stopping rules are irrelevant to the evidence, citing the Likelihood Principle. *However*, you must be prepared to justify this shift to the editor, and you must disclose the stopping rule transparently.
      *   **The Hybrid Approach:** Report the corrected $p$-value to satisfy the frequentist requirement for error control, and include the Bayes Factor to provide a measure of evidence that is robust to the stopping rule. This acknowledges both Arthur's concern for the literature's integrity and Elena's concern for the specific evidence.

  The "better" argument depends on what you claim your statistic *does*. If it claims to control error rates, the Frequentist wins. If it claims to quantify evidence in the specific data, the Bayesian wins. Your revision must align your claims with the appropriate math.
