answer: |-
  This is a classic debate in meta-ethics, and your intuition is correct: while Williams is undoubtedly working within a Humean tradition, the "new bottles" do more than just hold the old wine. They ferment it into something distinct. Your friend is right that Williams rejects external reasons (reasons that exist independently of an agent's psychology), which is the core Humean insight. However, she is likely underestimating the expansive work Williams assigns to "sound deliberation."

  Here is a breakdown of the gap between Hume and Williams, a concrete case where they diverge, and how this bears on the problem of the cruel agent.

  ### 1. Inertia vs. Sound Deliberation
  Your friend is correct that Williams inherits Hume's **anchoring constraint**: for both, a reason must be anchored in the agent's subjective psychology to explain action. Neither believes pure reason can motivate *ex nihilo*.

  However, they diverge sharply on what reason can do *once anchored*.

  *   **Hume's Instrumentalism:** For Hume, reason is strictly cognitive. It deals with truth and falsehood (relations of ideas or matters of fact). A passion is an "original existence." Reason can tell you that the glass contains poison (fact) or that drinking it will kill you (causal means), but it cannot evaluate the desire to drink it. If you want to drink the poison, and you believe it will kill you, Humean reason has no normative leverage to say you *shouldn't*. It is inert regarding the *end* itself.
  *   **Williams's Proceduralism:** Williams agrees that reason cannot create motivation from nothing. But his notion of a "sound deliberative route" (SDR) is much richer than Humean instrumental calculation. For Williams, deliberation includes:
      1.  Instrumental reasoning (means-end).
      2.  Correcting factual errors.
      3.  **Imaginative exploration:** Vividly imagining what an outcome would be like.
      4.  **Consistency checks:** Resolving conflicts between elements in the Subjective Motivational Set ($S$).

  Crucially, Williams allows that through this deliberative process, an agent can arrive at a motivation they **did not previously have**, even occurrently. For Hume, if the motivation wasn't there (as a passion), reason couldn't produce it. For Williams, if the motivation is the *rational output* of deliberating on the existing $S$, it counts as an internal reason, even if the agent didn't feel the urge beforehand. Williams allows reason to *rationally modify* the motivational set; Hume only allows reason to *causally inform* it.

  ### 2. A Concrete Case: The Negligent Parent
  To see where this yields different verdicts, consider the case of a **distracted parent**.

  **The Scenario:**
  Marcus loves his children (this is a standing commitment in his $S$). However, he is currently absorbed in a high-stakes work project. His child comes to him, frightened by a nightmare. Marcus feels no immediate, occurrent desire to comfort the child; his immediate psychological state is dominated by the desire to finish his work. He knows the facts (the child is scared, he is the parent) and the means (hugging calms the child).

  **Hume's Verdict:**
  Hume asks: What is the governing passion *now*? If Marcus's current strongest passion is to work, and comforting the child interferes with that, reason serves the passion to work.
  *   Hume might appeal to a "calm passion" (general benevolence), but if Marcus is genuinely unmoved at this moment, Hume struggles to say Marcus is *irrational* for ignoring the child. He is merely acting on a different passion. Reason cannot condemn the end (working) in favor of the end (parenting) unless there is a stronger competing passion. If there isn't, reason is silent.

  **Williams's Verdict:**
  Williams looks at the $S$. It contains the commitment "I am a father who cares for my kids."
  *   Williams asks: Is there a *sound deliberative route* from that commitment to comforting the child?
  *   Yes. If Marcus deliberates soundly (imaginatively vividly considering the child's fear, checking consistency with his self-conception as a father), he would be motivated to comfort the child.
  *   **The Gap:** Williams can say Marcus *has an internal reason* to comfort the child, even if he currently lacks the desire to do so. The reason exists because the motivation *would* arise upon sound deliberation. Hume can only say Marcus has a reason if the desire is already present (or if he believes comforting leads to some other desired end). Williams allows the *process of reflection* to generate the normative force.

  ### 3. The Cruel or Self-Deceived Person
  This gap is crucial for the standard complaint that internalism is conservative (i.e., it tells the Nazi he has no reason to be moral if morality isn't in his $S$).

  *   **The Humean Dead End:** On a strict Humean reading, if a cruel person has no sentiment of benevolence or sympathy, reason truly is a slave. It can help them be a *more efficient* cruel person, but it cannot tell them they *ought* to be kind. If they have no passion for kindness, they have no reason for it.
  *   **Williams's Nuance:** Williams admits he cannot conjure reasons for the "true amoralist" whose $S$ is utterly devoid of human solidarity. He accepts that if an agent really has no element in $S$ that deliberation can latch onto, they have no internal reason to change.
  *   **However,** Williams argues that most cruel or self-deceived people are not amoralists. They have *some* commitments (loyalty to their group, consistency, avoidance of their own pain). Williams's broader "sound deliberation" allows us to show them that their cruelty is **inconsistent** with other things they value.
      *   *Example:* A racist might value "fairness" in business but exclude a certain race from fairness. A Humean says: "Your passions are conflicted; whichever wins, wins." Williams says: "You have a reason to stop being racist because it violates the commitment to fairness already in your $S$, revealed through sound deliberation."

  Williams's framework is less conservative than Hume's because it treats the $S$ as a web of commitments that can be rationally scrutinized for consistency and imaginative viability, not just a bag of competing impulses where the strongest wins.

  ### Summary for Your Seminar
  You can tell your friend that she is right about the **genealogy** (Williams is a Humean in rejecting external reasons) but wrong about the **mechanics**.

  1.  **Hume:** Reason = Instrumental Calculation + Fact Checking. Passions are immune to rational critique.
  2.  **Williams:** Reason = Instrumental Calculation + Fact Checking + **Imaginative/Consistency Deliberation**. Motivations derived from this process are rationally mandated, not just causally produced.

  Williams saves internalism from the charge of pure instrumentalism by arguing that we have reasons to do things that would motivate us *if we thought clearly*, even if we aren't motivated *because we aren't thinking clearly*. Hume lacks the resources to make that distinction; for Hume, if you aren't motivated, you have no reason, full stop. That is the gap.
