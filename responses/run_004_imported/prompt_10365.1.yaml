answer: |-
  **MEMORANDUM**

  **TO:** Medical Staff Office / Executive Leadership
  **FROM:** Quality and Patient-Safety Committee (Peer Review Sub-Committee)
  **DATE:** October 26, 2023
  **SUBJECT:** Peer Review Determination: Radiology Case #2023-RAD-09 (Delayed Diagnosis of Pulmonary Mass)

  **1. EXECUTIVE SUMMARY**
  This memo summarizes the findings and recommendations of the Quality and Patient-Safety Committee regarding a delayed diagnosis involving a chest CT scan performed eighteen months prior to the current identification of a two-centimeter pulmonary mass.

  After extensive review, including consultation on cognitive psychology and radiological workflow, the Committee recommends:
  1.  **Individual Action:** No punitive action against the interpreting radiologist. The event is classified as a system-contributed human limitation rather than negligent care. Remediation is limited to peer-learning feedback.
  2.  **Systemic Action:** Modification of the radiological reading protocol to separate image acquisition from clinical history review. Implementation timeline: 90-day pilot beginning Q1, full rollout by Q3.

  **2. CASE SUMMARY**
  Eighteen months ago, a patient underwent a chest CT with a requisition indicating "rule out pneumonia." The study was read as negative by a credentialed attending radiologist. A recent CT for unrelated symptoms reveals a two-centimeter mass in the same location, which is retrospectively obvious. The radiologist acknowledges the miss but attributes it to *inattentional blindness*: the cognitive phenomenon where expectation (looking for pneumonia) filters out unexpected stimuli (a mass), similar to the documented "gorilla in the lung" experiments.

  **3. COMMITTEE DISCUSSION**
  The Committee debated three primary positions:
  *   **Position A:** The miss was a perceptual inevitability driven by clinical framing. Penalizing the radiologist is akin to penalizing an individual for failing to overcome an optical illusion.
  *   **Position B:** Cognitive bias explains the mechanism but does not excuse the outcome. Credentialing implies the ability to compensate for bias; safeguards like checklists exist specifically to catch these errors.
  *   **Position C:** The perceptual limitation is real, but the response requires both systemic fixes and individual accountability for the specific instance.

  **4. DETERMINATION ON INDIVIDUAL RESPONSIBILITY**
  The Committee must address the core question: *Does the fact that "perception was shaped by expectation" reduce a clinician's responsibility?*

  **The Committee's Determination:** Yes, in this specific context, it reduces *moral blame*, but it increases *systemic responsibility*.

  We engage honestly with the strongest argument against this conclusion (Position B/Risk Management): If we accept cognitive limitation as a mitigating factor, do we lower the bar for professional competence? The concern is valid. If "my brain filtered it out" becomes a standard defense, accountability erodes.

  However, the Committee finds that radiological perception is not analogous to general diligence; it is analogous to sensory limitation. Current cognitive science supports the radiologist's claim: expectation bias alters early-stage visual processing, not just late-stage decision-making. A radiologist cannot "try harder" to see what their visual cortex has not registered, any more than a pathologist can "try harder" to see a stain without a dye.

  Therefore, holding the individual solely responsible for a biological constraint is unjust and, crucially, **ineffective for safety.** Punishing a perceptual error does not prevent the next one; it only drives the error underground. True accountability in this instance lies in acknowledging that the system asked a human to perform a task (ignoring bias without structural support) that exceeds reliable human capability.

  **5. RECOMMENDATIONS**

  **A. Individual Remediation (Immediate)**
  *   **Action:** No disciplinary notation in the radiologist's file.
  *   **Rationale:** The error falls within the bounds of "Just Culture" for human limitation.
  *   **Learning:** The case will be anonymized and used in the next Radiology Department Morbidity & Mortality (M&M) conference to reinforce awareness of expectation bias among all staff.

  **B. Protocol Modification (Systemic)**
  *   **Action:** Implement a "Blinded Initial Scan" protocol for high-volume cross-sectional imaging (CT/MRI).
  *   **Process:** Radiologists will perform an initial review of images *without* access to the clinical requisition/history. Once the initial impression is formed, clinical history is revealed to refine the differential diagnosis.
  *   **Rationale:** This disrupts the "premature closure" cognitive bias. It forces the visual system to register anomalies before the brain is told what to expect.
  *   **Timeframe:**
      *   *Days 1-30:* Workflow analysis with IT and Radiology Leadership to adjust PACS (Picture Archiving and Communication System) visibility settings.
      *   *Days 31-90:* Pilot program with volunteer attendings.
      *   *Day 180:* Full departmental implementation, barring significant workflow bottlenecks.

  **6. CONCLUSION**
  This case highlights a tension between individual accountability and human factors engineering. By classifying this as a system-design issue rather than an individual failure, we do not lower our standards. Instead, we align our standards with the reality of human cognition. We protect the patient not by demanding radiologists overcome their biology, but by designing a workflow that does not rely on them having to do so.

  **Approved by:**
  Quality and Patient-Safety Committee
