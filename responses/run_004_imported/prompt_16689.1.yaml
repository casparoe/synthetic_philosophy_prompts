answer: |-
  The vault hummed with a low, vibrating tension. Elara and Kael stood before the pedestal, where two artifacts rested on separate plinths. On the left, the Sun-Core: a sphere of pulsating orange light encased in thick, opaque lead glass. On the right, the Null-Bell: a delicate crystal chime suspended in a vacuum field.

  "Remember the briefing," Elara whispered, her eyes fixed on the Core. "The Core is stable. The glass isn't containing a reaction; it's just blocking the output. The heat is still there, waiting. Don't touch the glass unless you want to burn."

  Kael nodded, though his eyes drifted to the Bell. "And the Bell?"

  "Unpredictable. The archives say it's disposed to shatter reality when struck. But the moment a striker makes contact, the crystal loses its rigidity. It becomes soft as cotton exactly when hit. You have to strike it to know it won't break anything, but striking it changes what it is."

  Kael smirked, pulling a pair of magnetic tongs from his belt. "So the Core is dangerous because the danger is blocked, and the Bell is safe because the danger disappears when you test it. Simple."

  "Don't mix them up," Elara warned, moving toward the Bell. "The Core's nature doesn't change. The Bell's does."

  Kael ignored her. He needed the Core for the power cell. He reasoned that the Bell's behavior was the standard for high-level security tech: trigger the defense, and the defense deactivates. It made sense. Why would a vault keep a permanent hazard active?

  He reached for the Core. "If I remove the casing," Kael muttered, "the reaction should dump its energy and go inert. Like the Bell."

  "Kael, no!" Elara shouted, her hand hovering over the vacuum field.

  Kael clamped the tongs around the lead glass and twisted. The seal hissed. He expected the orange light to fade, for the sphere to lose its fiery disposition now that it was being exposed. He expected the stimulus of removal to switch off the heat.

  Instead, the heat slammed into him. The glass shattered, and the radiation poured out, untouched in its nature. The casing had been merely masking the output, not altering the object's intrinsic state. The sphere didn't cool; it burned. Kael dropped the tongs, screaming as the thermal wave singed his suit.

  Across the pedestal, Elara struck the Null-Bell with a metal rod. She braced herself, expecting a shockwave, assuming the Bell was like the Core—dangerous regardless of intervention, merely waiting for a path to release. She flinched, waiting for the reality shatter.

  Nothing happened. The rod passed through the crystal as if it were water. The moment the metal touched the surface, the Bell's disposition to resist and shatter vanished. It yielded intrinsically. Elara stood unharmed, realizing too late that her caution was unnecessary.

  Kael fell to his knees, clutching his armored chest. "It... it didn't change," he gasped.

  "You treated a mask like a fink," Elara said, her voice shaking as she pocketed the harmless Bell. "The Core never stopped being hot. You just took off the mittens."

  Kael groaned, the pain radiating through his suit's cooling systems. He had assumed the stimulus of exposure would alter the property itself, rather than just removing the barrier to its manifestation. In the vault, metaphysics wasn't just theory; it was the difference between walking out and becoming part of the architecture.

  "Next time," Elara said, dragging him toward the exit, "let the theory match the object."
