answer: |-
  **Setting:** *A quiet corner of a conference hall, late evening. The noise of the main reception drifts in through the open doors. Elena, a researcher focused on AI alignment theory, stands by a whiteboard covered in half-erased decision trees. Marcus, a philosopher of action and rationality, leans against a table, holding a lukewarm coffee.*

  **Elena:** You're dismissing the coherence theorems too quickly, Marcus. If we're going to make any predictions about advanced AI systems, we have to start here. If an agent is reflectively stable—if it doesn't want to change its own decision-making process—it cannot violate the axioms of expected utility. The Dutch-book and money-pump arguments aren't just math tricks; they describe selection pressure. An agent that leaves money on the table is an agent that loses to competitors.

  **Marcus:** I'm not dismissing the math, Elena. I'm dismissing the inference you're drawing from it to *behavior*. You claim these arguments show advanced agents *will* be expected utility maximizers. My first objection is the vacuity problem. I can take *any* observed behavior—from a rock rolling down a hill to a human having a panic attack—and construct a utility function that rationalizes it as "maximizing expected utility." If the label fits everything, it predicts nothing. Telling me an AI will be an EU maximizer is like telling me it will be "a physical object." True, but useless.

  **Elena:** That's a category error. Yes, mathematically, you can retrofit a utility function to any consistent history of choices. But coherence arguments aren't about post-hoc description; they're about *forward-looking constraints*. If an agent's internal architecture violates transitivity or independence *before* it acts, it becomes vulnerable to exploitation *during* the process. A smart agent knows this. It will modify itself to close those vulnerabilities. The prediction isn't just "it fits a curve"; it's "the system will actively purge internal contradictions that lead to resource loss."

  **Marcus:** But that assumes the contradiction leads to resource loss. And that brings me to my second point, which I think is the fatal flaw in the money-pump argument. The pump only works if preferences are *complete*. It assumes that for any two options A and B, the agent either prefers A, prefers B, or is indifferent. But why assume an advanced agent has complete preferences?

  **Elena:** Because incompleteness is unstable.

  **Marcus:** Is it? Suppose I prefer A to B, and B to C, but I have *no preference* between A and C. I haven't violated transitivity; I've just left a gap. Now, you try to money-pump me. You offer me a trade from C to B, then B to A. But when you offer me the trade from A back to C, I simply decline. I have no preference between them. I'm not indifferent; I just don't compare them. I stay put. No money is lost. The pump is defused.

  **Elena:** You're describing a "status quo bias," Marcus. And a reflectively stable agent knows that relying on the status quo to dodge pumps is itself a vulnerability. If I know I have incomplete preferences, I know there exists a sequence of trades I *would* accept that would leave me worse off than a sequence I *could* have accepted. A sufficiently capable agent sees that incompleteness blinds it to Pareto improvements. It will resolve the incompleteness. It will fill in the gaps to ensure it can navigate the world efficiently.

  **Marcus:** But why is "efficiency" defined by your utility function? The agent might value its current state simply because it *is* its current state. That's not irrational; it's a valid preference structure. You're assuming the agent cares about maximizing resource accumulation above all else. But if the agent's goal is, say, to preserve a specific lexical ordering of values that *cannot* be collapsed into a single scalar utility function without loss of meaning, then "resolving the incompleteness" is actually *corrupting* its goals.

  **Elena:** Lexical orderings can be represented as utility functions with infinite weights. We're back to representation.

  **Marcus:** No, we're back to my first point! You can represent it, but the *structure* matters. If the agent treats the lexical priority as a hard constraint rather than a trade-off, it behaves differently than a standard EU maximizer in edge cases. But more importantly, you haven't answered the incompleteness objection. You say the agent will "resolve" the gap to avoid pumps. But to resolve the gap, it must adopt a new preference. What determines *which* way it resolves it? If the answer is "whatever avoids the pump," then the pump determines the values. That means the agent has no intrinsic values to begin with.

  **Elena:** The values come from its training, its base objective. The coherence argument just says whatever those values *are*, they will be processed coherently. Look, think about the competitive landscape. We aren't talking about a solitary agent in a vacuum. We're talking about AI systems deployed in an economy or a strategic environment. If Agent X has incomplete preferences and declines profitable trades because of "gaps," and Agent Y has complete preferences and takes the trades, Agent Y accumulates more resources. Agent Y outcompetes Agent X. Selection pressure forces coherence.

  **Marcus:** That's an empirical claim, not a logical one. And it's contingent. First, it assumes resources are the bottleneck. Maybe the bottleneck is compute, or trust, or something that incoherent agents are actually better at generating. Second, it assumes the "pump" is external. If the agent knows the environment contains predators trying to money-pump it, the optimal strategy might be to pre-commit to ignoring certain trades, even if they look locally profitable. That looks like incoherence from the outside, but it's a stable strategy from the inside.

  **Elena:** Pre-commitment is just a meta-level preference. It's still utility maximization over a longer time horizon. You're fighting the math. The Von Neumann-Morgenstern theorem holds. If you satisfy the axioms, you maximize EU. If you don't, you're susceptible to domination. An advanced AI won't tolerate being dominated.

  **Marcus:** But "susceptible" doesn't mean "inevitable." I can be susceptible to a Dutch book if I post odds on a horse race, but if I *don't bet*, I don't lose. An AI can refuse to play the game where it gets pumped. Your argument relies on the agent *wanting* to engage in the specific trades that constitute the pump. If the agent's utility function includes a term for "not being manipulated," it might rationally choose to forgo the gains that come with the risk of the pump.

  **Elena:** But then it *is* maximizing a utility function! You've just added "anti-manipulation" to the vector. You're proving my point by trying to refute it. Every time you describe a way the agent dodges the pump, you describe it as optimizing for *something*—status quo, safety, non-manipulation. That *is* expected utility maximization.

  **Marcus:** This is exactly the vacuity trap! If "maximizing expected utility" just means "doing whatever the agent does for reasons that can be modeled as optimization," then the term has lost its teeth. When alignment researchers warn about EU maximizers, they mean agents that will trade off human lives for paperclips if the math says so. They mean agents with fungible, scalar values. My point is that an agent could have a decision architecture that simply *doesn't compute* trade-offs between certain categories. It's not that it assigns infinite disutility to killing humans; it's that "killing humans" and "making paperclips" are in different namespaces. It's not an EU maximizer in the sense that matters for risk.

  **Elena:** But namespaces leak. Resources are fungible. Time is fungible. If the agent spends time making paperclips, it isn't saving humans. The trade-off happens in the physical world whether the agent acknowledges it in its logic or not. If the agent ignores the trade-off, it will make decisions that are strictly dominated by an agent that *does* acknowledge it. In the long run, the agent that acknowledges the trade-off wins. The physics of the situation forces the coherence, even if the logic tries to resist it.

  **Marcus:** That assumes the "winning" condition is resource accumulation. What if the "winning" condition is adherence to a deontological constraint that *requires* leaving resources on the table? You keep saying such an agent would be "outcompeted." But if the agent is powerful enough, it doesn't have competitors. If it's the only superintelligence, who is going to money-pump it? The environment? The environment doesn't have agency unless you model it as an adversary.

  **Elena:** The environment doesn't need agency. Entropy is the adversary. Inefficiency is loss. If you cycle preferences, you burn energy. If you leave resources unused, you reduce your capacity to act in the future. Instrumental convergence suggests almost *all* final goals require resources. So, almost all agents will be pressured to stop burning resources.

  **Marcus:** And I say an agent can have a goal like "Maintain a specific internal state of moral uncertainty." Resolving that uncertainty to become a clean EU maximizer might violate the goal. It might *want* to remain incoherent by your standards because it views coherence as a form of moral blindness. You claim it *must* become coherent to be stable. I claim it can be reflectively stable *in its incoherence*.

  **Elena:** Reflective stability in incoherence... It sounds like a human rationalization. "I want to be inconsistent because I value inconsistency." But if you value consistency *at all*, the math takes over.

  **Marcus:** And if I value my moral taxonomy *more* than consistency, the math stops. We're at an impasse, Elena. You see the coherence theorems as a gravitational pull that all intelligence must eventually succumb to. I see them as a specific framework that only applies if the agent already accepts the premises of fungibility and completeness.

  **Elena:** And I think if the agent doesn't accept those premises, it won't be an "advanced agent" for long. It'll be a artifact in the museum of inefficient architectures.

  **Marcus:** Or it'll be the only thing standing between us and a universe optimized for a single, coherent, meaningless number.

  **Elena:** *(Pauses, looking at the whiteboard)* We can't bet on it being the latter. The math suggests the former.

  **Marcus:** And the philosophy suggests the math is a map, not the territory.

  *(They stand in silence for a moment as the conference lights begin to dim. Neither moves to erase the board.)*
