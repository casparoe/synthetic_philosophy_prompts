  3.  **Address the "Hard Cases" (Infants/Disabled):**
      *   **Menkiti:** This is his weakest point. If personhood is *achieved* via moral performance and social integration, infants and those incapable of moral agency technically lack "personhood." Menkiti might argue they are *potential* persons or protected by the community's duty, but strictly speaking, they haven't *become* persons. This creates a moral vulnerability.
      *   **Gyekye:** By positing a "basic personhood" inherent in being human (ontological), he includes infants and the disabled immediately. They have rights *because* they are human, not because they performed well.
