      *   **Gyekye ("An Essay on African Philosophical Thought", 1987; "Tradition and Modernity", 1997):**
          *   *Key Claim:* Critiques Menkiti's radicalism.
          *   *Modification:* Personhood has a *basic* status (ontological) given at birth + an *acquired* status (moral/excellence).
          *   *Rationale:* To avoid the exclusion problem and ground human rights.
          *   *Metaphysics:* Humans have innate rationality/will (capacities), even if not fully exercised.
