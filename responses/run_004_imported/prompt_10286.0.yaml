          *   Menkiti: "Strong" communitarianism. Personhood is achieved/gradual/moral. One can fail to become a person.
          *   Gyekye: "Moderate" communitarianism. Community is constitutive, but innate capacities (rationality, will) exist to protect individual rights.
          *   Student tendency: Flattening both into "Ubuntu = community matters."
      *   **Specific Question:** Who handles hard cases (infants, severe cognitive disabilities) better?
