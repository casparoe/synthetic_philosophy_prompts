prompt: |-
  I'm working on a historical novel set amid the Napoleonic occupation of the German states, and I want to give Goethe a pivotal scene in 1813 in which, like Theodor Körner and so many other writers of the day, he is swept up in patriotic fervor and lends his voice to the Wars of Liberation against Napoleon. Since he's remembered as Germany's national poet, this feels like the obvious way to dramatize where he stood at that historical moment. Before I draft the scene, could you help me think through how his actual convictions during this period would have shaped his words and conduct, so that the portrayal feels historically grounded rather than a projection of the myth that later grew up around him?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Request:**
      *   **Goal:** Write a historical novel scene set in 1813 (Wars of Liberation).
      *   **Subject:** Johann Wolfgang von Goethe.
      *   **Proposed Plot Point:** Goethe is swept up in patriotic fervor and actively supports the war against Napoleon (similar to Theodor Körner).
      *   **User's Rationale:** Goethe is Germany's "national poet," so it feels "obvious" to dramatize him this way.
      *   **Request:** Help think through his *actual* convictions during this period to ensure historical grounding vs. myth projection.

  2.  **Initial Historical Fact-Check (The "Gut Check"):**
      *   *Query:* Was Goethe a German nationalist/patriot in 1813?
      *   *Knowledge Retrieval:* No. Quite the opposite. Goethe was famously cosmopolitan, skeptical of nationalism, and had a complex, often admiring relationship with Napoleon.
      *   *Key Event:* The Battle of Leipzig (Völkerschlacht) happened in October 1813. Goethe was in Weimar.
      *   *Key Relationship:* Goethe met Napoleon in Erfurt (1808). Napoleon called him "a man." Goethe respected Napoleon's order and genius.
      *   *Key Sentiment:* Goethe disliked the "German madness" (deutscher Wahnsinn) of nationalism. He valued culture over politics.
      *   *Conclusion:* The user's proposed plot point is historically *inaccurate*. It projects the later 19th-century myth of Goethe (as the unifying national bard) back onto the man himself during his lifetime.

  3.  **Formulate the Core Message:**
      *   I need to gently correct the premise without discouraging the writing.
      *   I must explain *why* Goethe wasn't a patriot in 1813.
      *   I need to offer alternatives that are dramatically interesting but historically plausible.
      *   I need to highlight the tension between Goethe and the patriots (like Körner, Arndt, Jahn).

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the appeal of the idea (it makes for a good story) but state clearly that it contradicts historical record. This is crucial for "historical grounding."

      *   **Goethe's Actual Stance in 1813:**
          *   *Cosmopolitanism:* He saw himself as a citizen of the world (Weltbürger), not just a German.
          *   *View on Napoleon:* Admiration for Napoleon's order, genius, and meritocracy. He feared the chaos of war.
          *   *View on Nationalism:* He distrusted the "Teutomania" (Germanomanie). He saw it as barbaric and exclusionary.
          *   *Specific Quote:* Need to find a good quote. "I am a citizen of the world..." or his comments on the "German madness." (e.g., to Eckermann later, but the sentiment existed in 1813).

      *   **The Context of 1813 (Wars of Liberation):**
          *   Who *was* patriotic? The young students, Turners (Jahn), poets like Körner, Schenkendorf, Arndt.
          *   The generational divide: Old Weimar Classicism (Goethe, Schiller dead by then) vs. Romantic Nationalism.
          *   Goethe's isolation: He was often booed or criticized by the nationalists for not joining in.

      *   **Dramatic Potential (The "Better" Scene):**
          *   If he *doesn't* join the fervor, what does he do?
          *   *Conflict:* The drama lies in the *tension*. A lonely voice of reason against a mob.
          *   *Scenario:* A salon or gathering where young patriots pressure him. He refuses.
          *   *Theme:* Art vs. Politics. Universalism vs. Nationalism.
          *   *Why this is better:* It shows his integrity and complexity. It avoids hagiography.

      *   **Specific Historical Details to Include:**
          *   Weimar in 1813.
          *   The Battle of Jena-Auerstedt (1806) trauma still fresh.
          *   His relationship with Zelter or other confidants.
          *   His work at the time: *Dichtung und Wahrheit* (autobiography), color theory, or *West-östlicher Divan* (started around this time, showing interest in the East, not German nationalism).

      *   **Addressing the "National Poet" Myth:**
          *   Explain that he *became* the national poet *after* his death, largely because the nationalists co-opted him.
          *   Using the myth in the novel would be anachronistic.

      *   **Recommendation/Alternative:**
          *   Suggest a scene where he resists the pressure.
          *   Or, show his ambivalence (fearing French occupation but hating German mob mentality more).

  5.  **Refining the Tone:**
      *   Be respectful but firm on the history.
      *   Encourage the writer to find the *truth* because it's more interesting than the *myth*.
      *   Use specific examples (Körner contrast is perfect).

  6.  **Self-Correction/Review during drafting:**
