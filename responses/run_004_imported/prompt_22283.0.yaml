answer: |-
  You have put your finger on one of the most sophisticated and debated passages in the history of economic thought. You are absolutely right to sense a tension here, but it isn't a contradiction; it is Hume introducing **dynamics** into a **static** theory.

  Hume is effectively trying to reconcile two competing views of his time: the **Mercantilists** (who believed accumulating gold/silver made a nation richer) and the early **Quantity Theorists** (who believed money was just a veil that determined prices).

  Hume's solution is to say: The Mercantilists are wrong about the *long run* (money is neutral), but they are accidentally right about the *short run* (money growth stimulates output).

  Here is a breakdown of the mechanism, the expectations, the modern parallels, and the symmetry claim.

  ### 1. The Mechanism: Why the Lag?
  You asked why wages and prices don't adjust immediately. Hume's mechanism relies on two specific frictions that prevent instant equilibrium:

  **A. Sequential Circulation (The Cantillon Effect)**
  Hume explicitly states: *"When any quantity of money is imported into a nation, it is not at first dispersed into many hands; but is confined to the coffers of a few persons."*
  This is a classic **Cantillon Effect** (named after Richard Cantillon, who wrote earlier but was less widely read than Hume). New money enters at specific points (in Hume's example, exporters receiving gold from Cadiz). It does not rain down evenly on everyone like helicopter money.
  *   **Step 1:** The merchants get the gold. Their purchasing power increases immediately.
  *   **Step 2:** They demand more labor. Because the rest of the economy doesn't have the new money yet, the general price level hasn't risen.
  *   **Step 3:** The merchants bid up wages to get workers.
  *   **Step 4:** Only later does that money circulate to farmers, retailers, and landlords, bidding up the price of bread and rent.

  **B. Price Stickiness and Information Frictions**
  Hume assumes that prices are not set by a central auctioneer who knows the total money supply. Prices are set locally.
  *   The merchant knows he has more gold.
  *   The worker knows he is being offered more shillings.
  *   **Neither knows immediately that the aggregate price level is about to rise.**

  ### 2. Expectations: Money Illusion
  You asked what Hume assumes about how people form expectations. He is assuming what modern economists call **Money Illusion** or **Adaptive Expectations**.

  Hume writes: *"[Workmen] never dream of demanding higher wages, but are glad of employment from such good paymasters... the artisan, who can now eat and drink better, to compensate his additional toil."*

  *   **The Worker's View:** The worker sees nominal wages rise. He assumes his *real* wages have risen. He works harder because he thinks he is getting richer.
  *   **The Reality:** By the time he goes to spend that money, prices have caught up. His real wage returns to subsistence levels.
  *   **The Result:** During the "interval," labor supply increases because workers are temporarily tricked by nominal gains.

  If workers had **Rational Expectations** (as in modern New Classical macro), they would see the gold arrive at the docks, calculate the future inflation rate, and demand higher wages immediately. The "interval" would vanish, and money would be neutral even in the short run. Hume assumes people are smart enough to seek advantage but not smart enough to foresee macroeconomic equilibrium instantly.

  ### 3. SR vs. LR Neutrality and the Phillips Curve
  Is he groping toward a Short-Run/Long-Run distinction? **Yes, absolutely.**

  *   **Long Run:** Hume agrees with the Quantity Theory. *"The high price of commodities be a necessary consequence of the encrease of gold and silver."* Money is neutral.
  *   **Short Run:** Money is non-neutral. It affects real variables (employment, output, diligence).

  Is it a **Phillips Curve**?
  It is the **grandfather of the Expectations-Augmented Phillips Curve** (Friedman/Phelps, 1968).
  *   The standard Phillips Curve suggests a trade-off between inflation and unemployment.
  *   Friedman and Phelps argued this trade-off only exists when inflation is *unexpected*. Once workers expect the inflation, they demand higher wages, and unemployment returns to its natural rate.
  *   This is exactly Hume's "interval." The stimulus exists only *between the acquisition of money and rise of prices.* Once prices rise, the stimulus vanishes. Hume discovered the **transition dynamics** that generate a Phillips Curve trade-off 200 years before Phillips.

  ### 4. The Symmetry Claim: Does it follow?
  Hume claims: *"This interval is as pernicious to industry, when gold and silver are diminishing, as it is advantageous when these metals are encreasing."*

  Does this logically follow from his mechanism? **Yes, provided you assume symmetric frictions.**

  *   **The Contraction Mechanism:**
      1.  Money leaves the country (e.g., to pay for imports).
      2.  Merchants have less cash *first*.
      3.  They cut employment or wages immediately.
      4.  **Crucially:** General prices have not fallen yet (because the money hasn't fully circulated out, and prices are sticky downwards).
      5.  Workers face lower nominal wages while prices are still high. Their real income crashes.
      6.  They reduce labor supply (or starve); industry contracts.
      7.  Eventually, prices fall to match the lower money supply, and the economy stabilizes at a lower price level but the same real output.

  *   **Is he smuggling something in?**
      He is smuggling in **Downward Nominal Rigidity**, though he treats it symmetrically. In reality, workers fight wage cuts harder than they demand wage hikes. So, the "pernicious" effect of deflation is often empirically worse than the "advantageous" effect of inflation. However, within the logic of Hume's model, the symmetry holds: if the *surprise* of higher nominal income stimulates labor, the *surprise* of lower nominal income must depress it.

  ### Summary: What is Hume actually doing?
  Hume is performing a brilliant political-economic balancing act.

  1.  **Against the Mercantilists:** He tells them, "Stop hoarding gold. In the long run, it just makes bread expensive. You can't get rich just by printing money or mining bullion." (Long-run neutrality).
  2.  **Against the Austere Theorists:** He tells them, "However, a moderate, growing money supply is the oil that greases the wheels. A static money supply in a growing economy leads to deflation and depression." (Short-run non-neutrality).

  **The Verdict on your questions:**
  *   **Mechanism:** It is a mix of **Cantillon Effects** (distributional injection) and **Sticky Prices/Wages** (information lags).
  *   **Expectations:** He assumes **Money Illusion** (workers react to nominal, not real wages).
  *   **Modern Parallel:** It is a proto-**Expectations-Augmented Phillips Curve** (SR non-neutrality, LR neutrality).
  *   **Symmetry:** It follows logically from the stickiness mechanism, though it assumes the pain of deflation is the mirror image of the gain from inflation.

  You are reading him correctly: he is describing the **transition path** of an economy adjusting to a monetary shock. The "contradiction" you sensed is actually the distinction between the *steady state* (neutrality) and the *dynamic adjustment* (non-neutrality).
