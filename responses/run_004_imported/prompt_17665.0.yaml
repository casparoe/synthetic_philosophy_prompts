      *   Realistic about academic politics.
      *   Actionable advice on wording.

  6.  **Self-Correction/Edge Cases during thought process:**
      *   *Wait, should I tell them to email the original authors?* No, that's too much effort for a lit review item unless it's central.
      *   *Should I tell them to ignore the advisor?* No, respect the advisor's experience but maintain ethical standards.
