answer: |-
  This is a classic academic rite of passage. You have discovered a **"zombie fact"** or a case of **"citation drift."**

  To answer your first question directly: **It is overwhelmingly likely that this is a snowball error, not a consensus you are missing.**

  It is statistically improbable that dozens of established researchers all went back to the primary source, interpreted the nuance differently than you, and independently arrived at the exact same simplified number. It is far more probable that Paper A overstated the finding, Paper B cited Paper A without checking the original, Paper C cited Paper B, and now the original paper is cited as the authority for a claim it never made.

  Your advisor is technically right that this "happens in every field," but their advice to "not lose sleep over it" is pragmatic, not ethical. They are telling you not to risk your publication chances over a footnote. However, you are right to be concerned about your own integrity.

  Here is a strategic breakdown of how to handle this without torpedoing your paper or your reputation.

  ### 1. Assess the Stakes
  Does this specific statistic drive your research question?
  *   **If YES (Core Justification):** You cannot cite it the "normal way." If your whole project is built on the premise that 70% of users leave, and the real number is "up to 40% in specific SaaS contexts," your premise is flawed. You must correct the record to justify why your work is still needed.
  *   **If NO (Background Flavor):** If this is just a throwaway sentence in the intro to establish that "churn is bad," you have more flexibility. However, perpetuating known falsehoods is still risky if a sharp reviewer catches it.

  ### 2. The "Gentle Correction" Strategy
  You do not need to declare war on the subfield to be accurate. You can acknowledge the common citation while clarifying the source. This shows rigor without appearing combative.

  **Don't write:**
  > "Many papers claim 70% of users abandon products (Smith, 2010), but they are all wrong and didn't read the paper."

  **Do write:**
  > "User churn following negative experiences is frequently cited as high as 70% (e.g., Jones et al., 2018; Lee et al., 2020, citing Smith, 2010). However, Smith's original analysis suggests this figure applies specifically to [narrow context], indicating a broader range of user tolerance in [your context]."

  **Or even softer:**
  > "While early estimates suggested abandonment rates near 70% (Smith, 2010), subsequent interpretations have noted this finding is highly context-dependent..."

  **Why this works:**
  *   You acknowledge the literature (showing you know the field).
  *   You cite the source accurately (maintaining integrity).
  *   You frame it as "nuance" rather than "error" (saving face for the other authors).

  ### 3. Navigating the Advisor Dynamic
  Your advisor is focused on **completion and publication.** They know that reviewers who are part of that "dozens of papers" club might get defensive if you explicitly call them out.

  *   **Don't** make this a moral crusade in your next meeting.
  *   **Do** frame it as a "risk mitigation" strategy. Tell your advisor: *"I noticed the primary source for that 70% stat is actually pretty hedged. I'm worried a sharp reviewer might flag that as inaccurate if I state it as fact. I plan to phrase it carefully to reflect the original data so we don't give reviewers an easy reason to reject it."*
  *   This aligns your integrity with their goal (getting published).

  ### 4. Why You Should Not Cite It Normally
  You might be tempted to just write "70%" and cite the paper to keep the peace. **Do not do this.**

  1.  **Reviewers vary:** You might get a reviewer who *knows* the paper is being misused and will ding you for lack of rigor.
  2.  **Future You:** In five years, if you are giving a talk or writing a grant, you don't want to be the one standing on a stage repeating a zombie fact that gets debunked in a Q&A.
  3.  **Reputation:** Being the person who actually reads the sources is a good long-term brand. It takes more effort upfront but builds trust.

  ### 5. Summary Recommendation
  1.  **Trust your reading.** You did the work; the field is lazy.
  2.  **Nuance the claim.** Use wording that reflects the actual finding (e.g., "up to," "in specific contexts," "estimated at").
  3.  **Cite the chain, not just the source.** If everyone cites Intermediate Paper B, cite B *and* the Original Paper A. (e.g., "Smith, 2010, as cited in Jones, 2015"). This signals you know the lineage.
  4.  **Pick your battles.** If this number is critical, correct it firmly. If it's background noise, correct it gently.

  You are not "picking a fight" by being accurate. You are contributing to the self-correcting mechanism of science. Just do it with enough diplomatic phrasing that no one feels personally attacked.
