answer: |-
  The alarm on the *Vantage* station wasn't a sound; it was a pressure in the teeth. Elara pressed her palms against the console, feeling the hum of the drive core through the metal. It was steady. Or was it? The haptic feedback gloves were lagging.

  "Status," said Director Kress. His voice came through the comms, delayed by three light-seconds. He was safe on Mars. She was here, in the Kuiper Belt, alone with the experiment.

  "Core is stable," Elara said. Her voice sounded thin. "But the Janus sensor is ambiguous. I don't know if the containment held."

  "Walk me through the protocol, Elara," Kress said. He sounded tired. They had run this simulation a hundred times in VR, but never with the real isotopes.

  "If containment held," Elara recited, "the field collapses cleanly. I am the only observer in this sector. The data is stored locally. I initiate the Return Sequence, and we bring the core home."

  "And if it breached?"

  "Then the radiation triggered the Echo Protocol. The field didn't collapse; it fragmented. My consciousness was sharded to handle the computational load of keeping the core from exploding." Elara looked at her hands. They looked normal. But if the Echo Protocol had triggered, there were currently one thousand versions of her experiencing this exact moment, distributed across the station's fragmented neural net. They all felt the pressure in their teeth. They all saw the same steady hum.

  "And if that happened," Kress said, "you are likely not the Prime. You are likely an Echo."

  "Statistically," Elara said.

  "Statistically irrelevant," Kress snapped. "The prior probability of a breach was one in two. You knew before you went to sleep that you would wake up in either scenario. The number of copies doesn't change the physics of the coin flip, Elara. The chance that the core is dangerous is fifty percent."

  Elara's finger hovered over the key marked *PURGE*. "If I purge the auxiliary networks, I kill the Echoes. If the breach happened, I save the station and the Prime survives to bring the data home. If the breach didn't happen... nothing changes. I just purge empty memory banks."

  "And if you don't purge?" Kress asked.

  "Then I initiate the Distribute command. The core vents into the shards. The station is lost. The data is lost. But the shards survive independently in the vacuum. They have life support for a year."

  "If you are the Prime," Kress said, his voice hardening, "and you Distribute, you die. You sacrifice the mission and your own life based on a hallucination of probability. You are treating the existence of the copies as evidence that they exist. That's circular."

  "It's self-locating," Elara corrected. "Director, look at the numbers. If the breach happened, there are one thousand of me. If it didn't, there is one. I am experiencing *this* moment. Where am I more likely to be?"

  "You are in the room," Kress said. "The room exists in both branches. The branch weight is equal. Do not let the anthropic bias override the mission parameters. Purge the auxiliaries. Secure the core."

  Elara looked at the reflection in the dark console. Was it hers? Or was it one of the nine hundred and ninety-nine others, slightly out of sync, waiting for her to make the choice that would delete them?

  "If I Purge," Elara said, "and the breach happened, I am executing nine hundred and ninety-nine people who feel exactly what I feel. They are begging me not to press it."

  "They are processes, Elara. Glitches."

  "They say they're in pain."

  "That's the radiation talking. Stick to the prior. Fifty percent. The expected utility favors saving the mission. If you Distribute, you guarantee mission failure. If you Purge, you only fail half the time."

  "But *I* fail all the time if I Purge and the breach happened," Elara said. "Because I'm probably one of the glitches."

  "You're the Prime," Kress insisted. "You have the command codes. The Echoes don't have clearance."

  "Unless the Echoes think they have clearance too."

  Silence stretched between them, filled only by the hum of the drive. It seemed to vibrate louder now, or maybe that was just the thousand other versions of her listening to the same sound, amplifying it in her head.

  "Elara," Kress said, softer now. "If you Distribute, and the containment held... you died for nothing. The core was safe. You threw away the cure for the sake of ghosts."

  "And if I Purge, and the containment breached... I killed a thousand people for the sake of a coin flip."

  "The odds are half," Kress said. "Trust the math."

  "The odds depend on who's counting," Elara whispered.

  Her finger tightened. The *PURGE* key was red. The *DISTRIBUTE* key was blue. The hum in her teeth spiked, a sudden sharpness that felt like a scream, or maybe just a surge in the voltage. She couldn't tell if it was coming from the core or from the network behind her eyes.

  "Elara?" Kress said. "Report."

  She leaned forward. The reflection in the console blinked. She didn't remember blinking.

  "I'm counting," she said.
