  **Justification:**

  1.  **Tier S (Essential): Calibration.** In a high-stakes risk assessment, the score must accurately reflect the probability of the outcome for the individual. If a score of 0.8 implies an 80% risk for one group but 50% for another, the tool is scientifically invalid and prevents judges from making informed cost-benefit decisions. Validity is a prerequisite for fairness; you cannot fairly distribute errors from a broken instrument.
  2.  **Tier A (Important): Error and Predictive Fairness.** *Equalized Odds* and *Equal Opportunity* address disparate harm (e.g., disproportionate false positives leading to unnecessary detention). *Predictive Parity* ensures that a "high risk" label carries the same meaning across groups. These are the primary fairness constraints that conflict with Calibration (per the Impossibility Theorem). They are ranked A because, while ethically critical, they may need to be relaxed or balanced against Calibration to maintain tool validity when base rates differ.
  3.  **Tier B (Nice to have): Treatment Equality.** This metric balances the ratio of false negatives to false positives. While it offers a nuanced view of error distribution, it is less standard and less directly interpretable than error rates themselves. It is a secondary diagnostic rather than a primary constraint.
  4.  **Tier C (Rarely decisive): Demographic Parity.** This requires equal positive prediction rates regardless of ground truth. In a recidivism context, enforcing this ignores actual risk differences and forces systematic errors (either releasing high-risk individuals or detaining low-risk individuals to meet quotas). It is generally considered inappropriate for risk assessment tools where accuracy regarding the target variable is the primary goal.
