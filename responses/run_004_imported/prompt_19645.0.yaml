prompt: |-
  I serve on my university's Institutional Animal Care and Use Committee (IACUC), and a protocol has come in that our charter doesn't really anticipate. A cephalopod lab wants approval to study injury response and short-term analgesic preference in octopuses: animals are given a minor tissue injury, then allowed to choose between an enclosure compartment infused with a local anesthetic and one without, as a behavioral test for whether their reaction to injury has a pain-like, affective component rather than being purely reflexive. If the subject were a rat or a zebrafish, this protocol would automatically trigger our full review process: justification under the 3Rs, a veterinary welfare assessment, mandatory analgesia unless scientifically justified otherwise, and a defined humane endpoint. But both the Animal Welfare Act and the PHS Policy that ultimately define our committee's jurisdiction restrict "animal" to vertebrates, so cephalopods fall outside our legal mandate entirely -- we could decline to review this protocol at all, and no external body would ever second-guess that decision. Some members want to review it anyway: the whole reason a protocol like this exists is that there is now a serious, published case for cephalopod nociception and possibly valenced pain, strong enough that the UK's 2022 Animal Welfare (Sentience) Act extended statutory protection to cephalopods and decapod crustaceans on the strength of a commissioned scientific review. Other members think voluntary review is exactly the wrong move: our committee's composition, expertise, procedures, and appeal rights were all calibrated to a vertebrate-based federal framework; improvising a welfare standard with no regulatory benchmark behind it is arbitrary and effectively unappealable; and if uncertain sentience is reason enough to review, the crickets and fruit flies used in at least three other labs on campus would seem to qualify by the same logic -- something the committee has neither the expertise nor the capacity to take on.

  I need to circulate a short written recommendation before our meeting in three weeks. Please draft it. It should reach a concrete recommendation for this specific protocol -- proceed without review, review it and under what standard, or something else -- state a principle for which future non-vertebrate protocols would or would not trigger the same treatment so we are not improvising case by case, and take seriously the strongest version of the argument for staying inside our existing vertebrate-based mandate rather than extending review on the committee's own initiative.
reasoning: |-
  Here's a thinking process that leads to the suggested recommendation:

  1.  **Analyze the Request:**
      *   **Role:** IACUC Member.
      *   **Task:** Draft a short written recommendation for circulation before the meeting.
      *   **Subject:** A protocol involving octopuses (cephalopods) studying injury response and analgesic preference.
      *   **Conflict:**
          *   *Legal/Regulatory:* AWA and PHS Policy cover only vertebrates. Octopuses are invertebrates. No legal mandate to review.
          *   *Ethical/Scientific:* Growing evidence of cephalopod sentience/nociception (UK Act 2022).
          *   *Practical/Procedural:* Committee is calibrated for vertebrates. Voluntary review sets a precedent (what about crickets/fruit flies?). Lack of regulatory benchmark makes standards arbitrary/unappealable.
      *   **Requirements:**
          *   Reach a concrete recommendation (Proceed without review? Review under what standard? Other?).
          *   State a principle for future non-vertebrate protocols (avoid case-by-case improvisation).
          *   Take seriously the strongest argument for *staying inside* the existing mandate (don't just dismiss the "no review" side).
          *   Tone: Professional, balanced, decisive, suitable for an IACUC context.

  2.  **Determine the Stance:**
      *   *Option A: No Review.* Legally safe, but ethically risky given the specific nature of the study (pain/anesthesia). Ignores the scientific consensus shifting on cephalopods.
      *   *Option B: Full Vertebrate Standard Review.* Ethically robust, but procedurally messy. Might exceed authority. Sets a hard precedent for insects.
      *   *Option C: Hybrid/Advisory Review.* Acknowledge lack of jurisdiction but review under specific ethical guidelines (e.g., CCAC, institutional policy) without claiming regulatory authority.
      *   *Option D: Defer to Institutional Leadership.* Ask the Attending Veterinarian (AV) or Institutional Official (IO) to establish a policy first.

      *Decision:* The prompt asks for a *concrete recommendation* for the committee to vote on/discuss. Option C (Voluntary Review under Specific Guidelines) is usually the most responsible path for research ethics committees facing regulatory gaps, *provided* boundaries are set. However, the prompt specifically asks to take seriously the argument *against* voluntary review (the "slippery slope" and "lack of expertise" argument).
      *Refined Decision:* The most defensible position that balances ethical responsibility with procedural integrity is to **recommend a limited, advisory review based on established external guidelines (not internal improvisation), while explicitly defining the taxonomic/ethical threshold to prevent scope creep.** This acknowledges the sentience evidence without claiming regulatory authority over all invertebrates.

      *Wait, let's look closer at the "Strongest Version" requirement.* I need to ensure the argument for *not* reviewing is given weight. If I recommend review, I must explain why *this* case is different from fruit flies.
      *Alternative:* Recommend that the committee *does not* exercise jurisdiction but recommends the PI adhere to specific external guidelines, and that the Institution establish a policy before future protocols.
      *Better Alternative:* Recommend **Conditional Approval via Advisory Review.** The IACUC reviews it *as if* it were vertebrate, but explicitly states this is an institutional ethical choice, not a regulatory one. *However*, the prompt highlights the risk of "arbitrary and effectively unappealable" standards.
      *Best Approach:* Recommend **Review under a Specific External Standard (e.g., CCAC or Guide for Cephalopods)** but limit the precedent. Actually, the most robust administrative solution is to recommend **Review**, but anchor it in **specific scientific criteria regarding sentience** rather than taxonomy alone, to address the cricket/fruit fly concern.
      *Actually, looking at best practices in US research:* Many institutions *do* bring cephalopods under IACUC purview voluntarily. The key is setting the policy. Since I am writing a recommendation *before* the policy is set, I should recommend **Review**, but coupled with a **Policy Proposal** to prevent ad-hoc decisions.

      *Let's try to find the middle ground:* Recommend that the IACUC **conducts a welfare review** for this protocol *only*, utilizing established cephalopod-specific guidelines (like the CIOMS or CCAC guidelines), while simultaneously recommending the Institutional Official (IO) establish a formal policy for future non-vertebrate sentience cases. This addresses the "improvising" concern by promising a policy soon, but addresses the "ethical risk" by reviewing this specific high-stakes protocol.

      *Wait, the prompt asks for a principle for future protocols.* So I need to set the principle *now* in this memo.
      *Principle:* Review is triggered not by taxonomy, but by **evidence of complex nociception and potential for valenced pain states.** This distinguishes octopuses from fruit flies (currently).
      *Recommendation:* **Proceed with Review.** Why? Because the study *itself* is investigating pain. You cannot ethically study pain without welfare oversight, regardless of legal mandate.
      *Counter-argument mitigation:* Acknowledge the legal limit. Acknowledge the resource strain. Limit the scope to "cephalopods and decapods" based on the UK review evidence, excluding insects until evidence shifts.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose (Protocol #X, Cephalopod Welfare).
      *   **The Dilemma:** Acknowledge the regulatory gap (AWA/PHS) vs. the ethical reality (Sentience evidence).
      *   **The Argument for Restraint (Required):** Dedicate a paragraph to why *not* reviewing is a valid, strong position (regulatory integrity, expertise limits, slippery slope). This shows I've listened to the "no review" camp.
      *   **The Recommendation:** **Voluntary Review.**
      *   **The Justification:** The study design *presumes* pain. To not review is to contradict the scientific hypothesis.
      *   **The Standard:** Use existing external guidelines (e.g., CCAC, or the specific UK review criteria) rather than making up IACUC rules.
      *   **The Principle (Future):** "Sentience-Based Threshold." Future invertebrate protocols trigger review only if they involve taxa with recognized evidence of complex nociception/affective pain (currently cephalopods/decapods) AND involve noxious stimuli. This excludes fruit flies/crickets for now.
      *   **Closing:** Call to action.

  4.  **Refining the Tone:**
      *   Must sound like a colleague, not a lecturer.
      *   Must be firm but respectful of the regulatory constraints.
      *   Needs to be "short" (as per prompt).

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is recommending review too risky regarding the "arbitrary standard" complaint?
      *   *Fix:* Explicitly state that we will adopt the *Guide for the Care and Use of Cephalopods in Research* (if available) or the criteria from the LSE review (UK) as the benchmark, rather than applying the *Guide for Vertebrates* blindly. This addresses the "expertise" concern.
      *   *Critique:* Did I address the "appeal rights" issue?
      *   *Fix:* Acknowledge that because this is voluntary, appeal mechanisms remain internal/institutional, not federal.
      *   *Critique:* Is the principle clear?
      *   *Fix:* Make sure the distinction between "taxonomic" and "evidence-based" is clear.

  6.  **Final Polish:** Check against constraints.
      *   Concrete recommendation? Yes (Review).
      *   Principle for future? Yes (Evidence of sentience + Noxious stimuli).
      *   Strongest argument for staying inside mandate? Yes (Regulatory integrity/Slippery slope).
      *   Short? Keep it under 2 pages equivalent.

      *(Self-Correction on "Guide for Cephalopods"):* There isn't a single US federal guide. There is the "Guidelines for the Care and Welfare of Cephalopods in Research" (Fiorito et al., 2015). I should reference that.

      *(Refining the "No Review" argument):* Make sure to articulate that expanding mandate without authority undermines the committee's legal standing and creates liability.

      *(Final Plan):*
      1. Header.
      2. Context (Regulatory gap).
      3. Argument for Restraint (The "No" case).
      4. Recommendation (The "Yes" case with conditions).
      5. Future Principle (Sentience threshold).
      6. Next Steps.

  7.  **Final Drafting:** (Mental check of the text to ensure it sounds like an IACUC member speaking to peers). *Ensure I don't sound like I'm dictating policy, but recommending a motion.*

      *Wait, one nuance:* The prompt says "draft it" implying I am the one sending the memo. I should write it as a formal recommendation memo.

      *Key argument to include:* If we don't review a study *about pain*, we are ethically inconsistent, even if legally compliant.

      *Key limitation to include:* We are not setting a precedent for *all* invertebrates, only those meeting specific sentience criteria.

