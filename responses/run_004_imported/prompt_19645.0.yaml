answer: |-
  **MEMORANDUM**

  **TO:** IACUC Members
  **FROM:** [Your Name], IACUC Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Protocol [ID]: Cephalopod Nociception and Welfare Oversight

  **Context**
  Protocol [ID] proposes injury induction and analgesic preference testing in octopuses. Under the Animal Welfare Act (AWA) and PHS Policy, our regulatory jurisdiction is limited to vertebrates. Consequently, we possess no federal mandate to review this protocol. We face a choice between strict regulatory adherence (declining review) and voluntary ethical oversight (conducting review).

  **The Case for Regulatory Restraint**
  The argument for declining review is substantial and must be weighed seriously. Our committee's composition, standard operating procedures, and enforcement mechanisms are calibrated to a federal vertebrate framework. Expanding our mandate unilaterally risks creating arbitrary welfare standards that lack external regulatory benchmarks, potentially exposing the institution to liability without offering the PI clear appeal rights. Furthermore, if "uncertain sentience" becomes the trigger for oversight, we lack the expertise and capacity to evaluate the welfare implications of invertebrate models used elsewhere on campus (e.g., *Drosophila*, *Gryllus*). Maintaining our current jurisdiction ensures procedural integrity and prevents scope creep that could dilute our capacity to oversee mandated vertebrate work.

  **Recommendation**
  Despite the strength of the regulatory argument, I recommend the committee **conduct a voluntary welfare review of this specific protocol.**

  The scientific premise of this study is the existence of a valenced pain state. It is ethically inconsistent for an oversight body to decline evaluation of a procedure explicitly designed to induce and measure suffering, regardless of taxonomic classification. To decline review is to implicitly accept that pain induction in this model carries no welfare consequence, a position increasingly contradicted by peer-reviewed evidence (e.g., the 2021 LSE Review underpinning the UK Animal Welfare Act).

  However, to address the concerns regarding arbitrary standards, this review should not attempt to force vertebrate regulations onto invertebrates. Instead, we should evaluate the protocol against the *Guidelines for the Care and Welfare of Cephalopods in Research* (Fiorito et al., 2015) and the specific sentience criteria outlined in the UK statutory review.

  **Principle for Future Non-Vertebrate Protocols**
  To prevent case-by-case improvisation, I propose the committee adopt the following threshold principle for future non-vertebrate protocols:

  *Voluntary IACUC review is triggered only when a protocol involves a taxon with recognized scientific consensus regarding complex nociception and affective pain states (currently cephalopods and decapod crustaceans) AND involves the application of noxious stimuli or potential distress.*

  This principle excludes current insect models used on campus, as they do not yet meet the evidentiary threshold for affective pain, while establishing a clear, evidence-based boundary for future oversight.

  **Next Steps**
  I move that we conditionally approve this protocol pending modifications to ensure humane endpoints and analgesic availability consistent with cephalopod-specific guidelines, and that we simultaneously recommend the Institutional Official draft a formal policy codifying the principle above.

  Respectfully,

  [Your Name]
