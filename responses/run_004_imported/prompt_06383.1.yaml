answer: |-
  It is a genuine pleasure to correspond with someone who has not only read Neurath but has *lived* the practical application of his core visualization principle without knowing his name. That 10x10 grid of stick figures you used for absolute risk communication is, functionally, pure ISOTYPE. You intuited the epistemological advantage of counting discrete units over comparing areas long before you met the Vienna Circle.

  To your core question: You have put your finger on the exact friction point that separates Neurath from his more logically rigorous colleagues (like Carnap or Schlick) and often confuses modern readers.

  The short answer is: **Neurath did not claim ISOTYPE could perform logical operations.** He did not view it as a formal calculus capable of negation, conditionals, or tense in the way symbolic logic is. However, he also did not view this as a failure. To understand why, we have to distinguish between Neurath's definition of "language" and the Logical Empiricists' definition of "language."

  Here is how Neurath squares the circle, or at least manages the tension you've identified.

  ### 1. "Helping Language" vs. "Formal Language"
  You asked if Neurath conceded that picture-language was only a "helping language" (*Hilfssprache*). The answer is **yes**, but with a specific sociological weight attached to that concession.

  When Carnap spoke of a "unified language of science," he was largely interested in a logical syntax that could reduce all scientific statements to physicalistic observation sentences to ensure verification. Neurath agreed with the physicalism but disagreed on the medium. For Neurath, the "Unity of Science" wasn't just about logical consistency among physicists; it was about **social integration**.

  He viewed verbal language as fragmented by national boundaries and class barriers (technical jargon vs. lay speech). ISOTYPE was intended to be a *trans-linguistic* bridge. When he called it a "language," he meant it in the sense of a **communicative system**, not a **deductive system**.

  *   **Can it negate?** No. You cannot easily draw "not."
  *   **Can it condition?** No. You cannot easily draw "if."
  *   **Can it express tense?** Poorly. ISOTYPE is inherently present-tense or historical record.

  Neurath knew this. He argued that ISOTYPE was not meant to *replace* the logical work of science, but to **memorialize the results** of that work in a form that is instantly graspable by the non-specialist. The "logic" happens in the laboratory or the statistical bureau; the ISOTYPE chart is the public interface.

  ### 2. The Role of the "Transformer" (Marie Neurath)
  This is where your mention of Marie Reidemeister (later Marie Neurath) is crucial. In the ISOTYPE process, there was a specific role called the **Transformer**.

  The Transformer's job was to take complex, verbal, statistical data (which contained all the negations, conditionals, and tense) and translate it into the visual format.
  *   **The Logic:** Resides in the text and the data preparation.
  *   **The Picture:** Is the *output* of that logic, stripped of syntactic complexity to highlight quantity and comparison.

  So, to your point about whether the "actual logical work is still happening in ordinary language underneath": **Yes, exactly.** Neurath would not have denied this. He argued that for the purpose of *public education and social planning*, the logical syntax is a barrier. The goal of ISOTYPE was not to allow a worker to *derive* new truths from the chart, but to allow them to *retain* the facts presented.

  Neurath famously said, "To remember a simplified picture is easier than to remember a complex fact." He sacrificed logical completeness for mnemonic retention.

  ### 3. Redefining "Objectivity"
  You ask if admitting ISOTYPE is subordinate to verbal language "deflates the claim that pictures give you a more objective... route to communicating facts."

  This is the most subtle part of Neurath's philosophy. When Neurath claimed ISOTYPE was "objective," he did not mean it was free of convention. He knew the stick figure was a convention. He knew the choice of what to visualize was subjective.

  His claim to objectivity rested on two pillars, both of which should feel familiar to an epidemiologist:

  **A. Standardization of Method (The "Repeat the Icon" Rule)**
  You noted your colleagues using dodgy area-scaled bubble charts. Neurath's objection was identical. If you double the value, and you double the height and width of an image, you quadruple the area. That is a visual lie.
  By enforcing the rule that **Quantity = Number of Icons**, Neurath created a **syntax of honesty**. The "objectivity" comes from the rigid constraint on how data maps to ink. It prevents the rhetorician from manipulating the viewer's perception of magnitude. In this sense, ISOTYPE is more "objective" than prose, because prose can easily use weasel words ("a significant increase"), whereas a row of 50 icons vs. 100 icons is hard to fudge.

  **B. Physicalism without Metaphysics**
  Neurath's physicalism was about sticking to observable spatio-temporal events. ISOTYPE fits this perfectly. You cannot draw "The Spirit of Capitalism" in ISOTYPE. You can only draw "Number of Workers," "Tons of Steel," "Hours of Sleep."
  By restricting the visual vocabulary to observable physical quantities, ISOTYPE enforces a kind of **anti-metaphysical discipline**. It forces the communicator to ground their claims in countable things. This aligns with the Vienna Circle's goal of eliminating metaphysics, not through logical proof, but through **visual constraint**.

  ### 4. Is it an Unresolved Tension?
  It is a tension, but Neurath managed it through **pragmatism**.

  The Logical Empiricists often fractured over the role of science. Carnap was interested in the *structure* of scientific knowledge. Neurath was interested in the *function* of scientific knowledge in a democratic (and socialist) society.

  If you view ISOTYPE as a failed attempt at a formal logical language, it collapses. But if you view it as a **technology of democracy**, the tension resolves.
  *   **Verbal/Logical Language:** For the scientists to debate, verify, and deduce.
  *   **ISOTYPE:** For the citizens to understand the implications of those debates so they can vote or plan.

  Neurath argued that the "Unity of Science" fails if the science remains locked in journals. ISOTYPE was the key to unlock them. He wasn't claiming the picture *was* the science; he was claiming the picture was the only way to make the science *socially effective*.

  ### Summary for the Epidemiologist
  To translate this back into your domain:
  *   **The Data Analysis:** This is the verbal/logical language (regression models, p-values, confounding adjustments). ISOTYPE cannot do this.
  *   **The Risk Communication Slide:** This is ISOTYPE. It cannot tell the patient about the *mechanism* of the disease (conditionals/causality), but it can truthfully show the *magnitude* of the risk (10 out of 100 people) without distorting the area.

  Neurath's "bigger claim" wasn't that pictures replace logic. It was that **logic without visual accessibility is politically impotent.**

  He squares the circle by admitting ISOTYPE is a "helping language" but arguing that in a mass society, the "helping language" is actually the primary vehicle for *social* truth, even if it relies on the "scientific language" for *empirical* truth. The objectivity lies in the **standardization of the translation process** (the Transformer's rules), not in the images themselves being magic.

  So, you aren't missing a hidden logical capacity in the icons. You are correctly identifying that Neurath was a pragmatist who valued **clarity and honesty** over **logical completeness**. He would likely look at your 10x10 risk grids and say, "That is not just a chart; that is a tool for enlightenment."
