      *   If the contract pays \$1 if $A \implies B$ (logical implication), that's true if $A$ is false. So it pays \$1 if $\neg A \lor B$. Price is $1 - P(A \land \neg B)$.
      *   The user wants the price to *be* $P(B|A)$. But for the price to be $P(B|A)$, the payout must be conditioned on $A$ occurring.
