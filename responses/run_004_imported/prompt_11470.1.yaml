      *   Why would a PhD say this is broken?
      *   *Key Insight:* A tradeable asset needs a *payoff structure*. What does the contract actually pay out?
      *   If the contract pays \$1 if $A$ and $B$ happen, and \$0 otherwise, its price is $P(A \land B)$, *not* $P(B|A)$.
