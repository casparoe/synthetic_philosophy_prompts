      *   **The "Collapsing into Nonsense" Argument:** This likely refers to **de Finetti's Law of Small Probabilities** or issues with **logical induction/arbitrage** when combining markets.
      *   *Wait, there's a more specific financial math problem:* **The numéraire problem / Change of Measure.**
      *   If I trade a contract that pays \$1 if $B$ *given* $A$, what is the currency?
      *   If $A$ doesn't happen, the contract ceases to exist.
