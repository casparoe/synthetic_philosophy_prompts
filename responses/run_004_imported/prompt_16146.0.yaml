      *   **Imprecise Probability (IP) / Credal Sets (Levi, Walley):** Sets of priors. Lower/upper probabilities. Often motivated by indecision or lack of information.
      *   **Elga (2010):** Argument against IP. Uses a sequential choice scenario (diachronic Dutch Book style). If you have a set of priors and update via some rule (like generalized conditionalization), you can be money-pumped or make choices that violate dominance. Conclusion: Rational agents must have sharp credences.
