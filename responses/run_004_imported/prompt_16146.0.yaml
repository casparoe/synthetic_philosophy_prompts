      *   **Argument 3: Decision Theory and Dynamic Consistency.** This is the big one. Elga assumes EUM. Keynes rejects EUM under uncertainty. Dynamic inconsistency is a feature, not a bug, when the logical relations shift or when "animal spirits" take over.
      *   **Argument 4: The Context of the "Pump".** Elga's examples are contrived games. Keynes cares about economic reality. In games, sharp probabilities might work. In investment/politics, they don't.
