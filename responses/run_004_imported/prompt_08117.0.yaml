  ### Reporter's Note (For your article)

  Since you mentioned you are investigating the hype cycle: **This student's answer is a perfect microcosm of the media landscape you are writing about.**

  1.  **The "Thesis vs. Theorem" part is rarely the problem.** Most physicists and philosophers agree on what the CTT is (as the student wrote).
  2.  **The "Quantum Breaks CTT" claim is the hype.** As the grading notes indicate, a quantum computer does **not** break the standard Church-Turing thesis. A classical supercomputer could simulate a quantum computer; it would just take millions of years instead of seconds. That is a difference of *engineering and complexity*, not *logic and computability*.
  3.  **The Nuance:** There is a variant called the **Extended Church-Turing Thesis (ECTT)**. The ECTT claims that any *reasonable* model of computation can be efficiently simulated by a probabilistic Turing machine (i.e., no exponential speedups). Quantum computing *does* threaten the ECTT.

  If your sources are telling you quantum computers will "break the Church-Turing thesis," they are either using imprecise language (meaning ECTT) or they are selling you a story. The student lost points for making that exact conflation. You should too, if you print it without qualification.
