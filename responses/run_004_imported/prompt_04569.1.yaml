answer: |-
  **Title:** Shadows on the Vector Space: Why Manipulability Does Not Entail Realism About SAE Features

  **Introduction**
  The recent application of sparse autoencoders (SAEs) to large language models has provided the field of mechanistic interpretability with its most compelling visualizations of "internal thought." The case of the "Golden Gate Bridge" feature in Claude 3 Sonnet is particularly striking: by clamping a specific direction in activation space, researchers can reliably steer the model's output toward a specific topic. In our seminar, several classmates have argued that this success satisfies Ian Hacking's manipulability criterion for entity realism. Their inference is straightforward: if we can intervene on a feature to produce a predictable causal effect, we are justified in treating that feature as a real, mind-independent constituent of the model's cognitive architecture.

  While I grant the empirical premise—that SAE-based interventions possess robust causal leverage—I reject the ontological conclusion. The phenomenon of "feature splitting," documented in Anthropic's own technical reports, demonstrates that SAE features are not stable natural kinds but rather granularity-dependent artifacts of decomposition. Therefore, we should adopt an instrumentalist stance: SAE features are useful coordinates for navigating activation space, not discrete ontological units of machine cognition.

  **The Instability of Decomposition**
  The realist argument relies on the assumption that there is a "fact of the matter" regarding how many features exist and what they represent. However, the training of SAEs is governed by hyperparameters, most notably the dictionary size (the number of latent features the autoencoder attempts to learn). As the dictionary size increases, features do not merely become more precise; they often split into non-equivalent sub-features.

  Consider a feature $F_1$ trained with a small dictionary that correlates strongly with "Golden Gate Bridge." If we retrain the SAE with a larger dictionary, $F_1$ might vanish, replaced by $F_a$ (correlating with "suspension bridges") and $F_b$ (correlating with "San Francisco landmarks"). Both new features allow for successful intervention, yet they carve the activation space differently. If features were mind-independent entities analogous to Hacking's electrons, changing the resolution of our "microscope" should reveal more detail about the *same* entity, not replace the entity with two distinct ones that overlap in extension. The fact that the ontology of features shifts based on the analytic constraints of the tool suggests that the boundaries between features are imposed by the researcher, not discovered in the weights.

  **Reinterpreting Manipulability**
  Hacking's criterion ("If you can spray it, it's real") was designed to defend the reality of unobservable *entities* against constructive empiricism. However, applying this to SAE features involves a category error. An electron is a putative substance; an SAE feature is a basis vector in a high-dimensional space.

  We can grant that the *direction* in activation space is physically real in the sense that it is a geometric property of the network's state. We can also grant that manipulating this direction has causal power. However, this does not validate the *semantic discreteness* of the feature. That we can manipulate a vector direction to produce "Golden Gate Bridge" text does not prove the model possesses a discrete "Golden Gate Bridge concept." It proves only that the activation space contains a direction linearly associated with that output distribution.

  The manipulability argument conflates *causal leverage* with *ontological discreteness*. We can manipulate a shadow by moving the object casting it; the shadow behaves predictably, but it is not a substance. Similarly, SAE features are projections of a complex, superposed polytope onto a sparse basis. That we can grab a handle on this projection and pull the model's behavior does not mean the handle is a fundamental building block of the system. It means the basis provides a convenient interface for intervention.

  **The Case for Instrumentalism**
  Adopting anti-realism about SAE features does not diminish their scientific utility; it clarifies it. If we treat features as real, we risk reifying artifacts of the dictionary size as cognitive modules, leading to erroneous theories of how the model processes information. If we treat them instrumentally, we acknowledge them as a coordinate system.

  Just as latitude and longitude allow us to manipulate a ship's position without being physical grooves on the ocean, SAE features allow us to navigate activation space without being discrete cognitive atoms. The "Golden Gate Bridge" intervention works not because there is a bridge-neuron or a bridge-feature hiding in the weights, but because the SAE has successfully identified a linear subspace where the semantic information is linearly decodable. The success of the intervention validates the *utility of the decomposition*, not the *reality of the units*.

  **Conclusion**
  The "Golden Gate Bridge" case is a triumph of engineering, but it is not a proof of metaphysics. The feature-splitting phenomenon demonstrates that the granularity of our features is underdetermined by the network's physics. While Hacking's manipulability criterion confirms that activation directions have causal power, it cannot distinguish between a fundamental cognitive unit and a convenient mathematical projection. Until we have a theory of feature identity that is invariant across dictionary sizes, we should remain anti-realists. SAE features are not the furniture of the machine's mind; they are the map we draw to navigate it.
