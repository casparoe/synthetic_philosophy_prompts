      *   *Justification Logic:* (Artemov). Replaces $K\phi$ with $t:\phi$ (term $t$ justifies $\phi$). Explicitly tracks *why* something is known. Very promising in formal epistemology and proof theory. Solves omniscience by requiring explicit evidence. High philosophical standing currently.
      *   *Syntactic/Sentential Models:* (Konolige, Levesque). Belief is a set of sentences. Avoids possible worlds. Can be too weak (doesn't capture implicit knowledge well) or too ad hoc. Often seen as a precursor to awareness or justification logic.
