  First off, that is awesome that your school offers linguistics—Grice is genuinely one of the most fun units to teach because once you see the maxims, you can't unsee them in every conversation. It's like putting on glasses for the first time.

  Here is a joke set in a group chat that relies on a specific Gricean mechanism. The humor hinges on the gap between the literal answer and the implicated meaning, which might leave a non-linguist confused about whether the answer was actually a "yes" or a "no."

  **The Setup:**
  **Friend 1:** "Did your mom actually say we could host the party this weekend?"
  **Friend 2:** "She informed me that she and my dad are going to be out of town."

  **The Explanation:**
  This flouts the **Maxim of Quantity** (give as much information as required) by withholding the crucial "yes/no" permission, forcing the listener to infer the implicature: "I don't have permission, but I'm going to do it anyway while they're gone."
