      *(Refining the "Ascetic Ideal" point)*: Marcus needs to argue that the *form* of the discipline matters more than the *content*. Even if the goal is health, if the method is hyper-vigilance, it's ascetic.

      *(Refining the "Will to Power" point)*: Elena needs to argue that for a decadent type (which Nietzsche admits he is), the only way to power is through extreme regulation. It's a strategy, not a universal law.

  7.  **Final Review:** Does it meet all prompt constraints?
