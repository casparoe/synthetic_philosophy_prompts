          *   *Critique:* This is the weakest link. ECL works in finite worlds provided the number of correlated agents is *large enough* to make the evidential impact significant. It doesn't strictly require infinity. However, "longtermist" and "multiverse" contexts often imply vast numbers, pushing toward the limit. The user's point that "merely large" might just look like impartial altruism is partially true but misses the *multiplicative* effect of correlation. If $N$ agents correlate, my impact scales by $N$. If $N$ is $10^{100}$, that's distinct from standard altruism where my impact is causal (1). So the "finite" horn of the dilemma is weaker than the user thinks.
