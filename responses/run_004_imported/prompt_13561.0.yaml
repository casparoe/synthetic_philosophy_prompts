  # The Indeterminacy of Rationality: Why the Pasadena Paradox Breaks Expected Value

  The St. Petersburg paradox is a scandal of magnitude; the Pasadena paradox is a scandal of meaning. In the St. Petersburg game, expected value (EV) reasoning produces an answer that is too big for the room—an infinite price for a finite game. We can resolve that by bounding utility, introducing risk aversion, or simply admitting that no bank has infinite capital. The machinery of decision theory creaks, but it does not shatter.

  The Pasadena game, however, does not merely break the machinery; it reveals that the machinery was never fully assembled to begin with. Your friend, the statistician, is relying on a mathematical convention and mistaking it for a metaphysical necessity. She is correct that if one sums the series in the natural order of the coin tosses ($n=1, 2, 3\dots$), the result is $\ln 2$. But she is wrong to claim this is "obviously" the expected value. By insisting on this, she is privileging a specific description of the gamble over the gamble itself.

  The Pasadena paradox exposes a genuine, previously hidden defect in expected-value reasoning as a universal norm of rational choice. It demonstrates that EV is not a robust, context-independent measure of value, but a fragile construct that depends on hidden structural assumptions about how outcomes are indexed. While the "Restriction View" (your friend's position) attempts to fence off the problem by declaring the expectation undefined or by appealing to temporal order, this is a retreat that concedes the central point: Expected Value theory is incomplete. It cannot guide action in all coherent scenarios, and its failure here suggests that rationality cannot be fully reduced to the maximization of a single numerical aggregate.

  ### The Case for the Artifact: Saving the Norm

  To understand why the defect is so damaging, we must first steelman the opposing view. The defense of expected value in the face of Pasadena usually rests on two pillars: the **Canonical Order** argument and the **Measure-Theoretic** restriction.

  The Canonical Order argument posits that the summation order is not arbitrary. In the Pasadena game, the payoff is determined by the number of tosses $n$ required to get the first heads. Since coin tosses occur in time, there is a natural, causal sequence to the outcomes. Toss 1 happens before Toss 2. Therefore, the series should be summed in the order of occurrence. To reorder the terms is to violate the causal structure of the gamble. On this view, the Riemann rearrangement theorem is a mathematical curiosity that applies to abstract lists of numbers, but not to physical events anchored in time.

  The Measure-Theoretic restriction is more rigorous. In modern probability (Kolmogorov's framework), the expected value is defined as a Lebesgue integral. For an expectation to exist, the integral of the absolute value of the payoff must be finite (absolute convergence). Since the Pasadena game fails this test, a rigorous statistician would say the expected value **does not exist**. It is not $\ln 2$, it is not infinity; it is undefined. On this view, there is no paradox. Decision theory simply says: "If the expectation is undefined, EV maximization does not apply." This fences off Pasadena as a pathological edge case, leaving EV intact for all "well-behaved" gambles (those with absolute convergence).

  Your friend's intuition leans on the first pillar (it's obviously $\ln 2$), while her training leans on the second (it's technically undefined, so don't worry about it). Both aim to preserve the integrity of expected value as a norm.

  ### The Case for the Defect: The Fragility of Value

  The defect view, which aligns with your skepticism, argues that these defenses are insufficient. They paper over a crack in the foundation of decision theory.

  The Canonical Order argument fails because the *payment* of the gamble does not occur sequentially. You do not receive a penny on day 1, lose half a penny on day 2, and so on. You wait until the game ends (when heads appears), and then you receive a single lump sum based on the total $n$. The "order" of the tosses is relevant to the *probability* calculation, but the summation of expected value is a tool for evaluating the *whole* gamble at once. Why should the order in which we *calculate* the sum dictate the value of the *outcome*? If I describe the same gamble to you by grouping all positive payoffs first and then all negative payoffs, the physical game hasn't changed, but the sum explodes to positive infinity. If the value of a gamble depends on the order in which an accountant writes down the possibilities, then "value" is not a property of the gamble, but a property of the description. That is a fatal flaw for a theory claiming to measure objective rational choice.

  The Measure-Theoretic restriction is more honest, but it comes at a high philosophical cost. By admitting that the expectation is undefined, decision theory admits that it is **incomplete**. A normative theory of rationality is supposed to tell an agent what to do. If a agent is offered the Pasadena game for a fee of $\$0.50$, EV theory (under the restriction view) falls silent. It cannot say "take it" (since $\ln 2 > 0.50$) nor "leave it" (since the value might be $-\infty$).

  This silence is not a neutral boundary; it is a failure. The Pasadena game is not logically incoherent. The payoffs are finite for every outcome. The probabilities sum to 1. It is a perfectly well-defined lottery. If a theory of rational choice cannot evaluate a well-defined lottery, the theory is defective, not the lottery. Furthermore, this defect is not easily contained. It suggests that any time we deal with unbounded utilities or infinite state spaces (common in cosmology, economics, or long-term ethical planning), EV reasoning may become arbitrarily sensitive to how we frame the problem.

  ### The Verdict

  The strongest version of the Restriction View argues that we should simply accept that some gambles have no expected value, just as some divisions have no quotient (e.g., $1/0$). But this analogy fails. In division, the operation is undefined because no number satisfies the relationship. In Pasadena, infinitely many numbers satisfy the relationship depending on the ordering. The problem is not that there is *no* answer, but that there are *too many*, and the theory provides no principle to select the correct one.

  Your friend's claim that the value is "obviously $\ln 2$" is an act of faith in the natural numbers as a privileged labeling of reality. But probability theory teaches us that labels should not alter probabilities or values. If we relabel the outcomes using a bijection that preserves probabilities but changes the summation order, the "obvious" value changes. This proves that Expected Value is not invariant under redescription.

  Therefore, the Pasadena paradox reveals a **genuine defect** in expected-value reasoning. It shows that EV is not a fundamental norm of rationality, but a derivative tool that works only when the world is "well-behaved" enough to permit absolute convergence. When the stakes involve infinite possibilities with oscillating values, EV ceases to be a guide and becomes a mirror, reflecting the arbitrary choices of the modeler rather than the value of the gamble.

  The Restriction View tries to save EV by limiting its domain, but in doing so, it admits that rationality cannot be fully captured by maximizing a single number. The Defect View accepts this limitation as a sign that our decision theory needs a deeper foundation—one that can handle indeterminacy without collapsing into arbitrariness.

  **Verdict:** You are closer to right than your friend. The Pasadena game is not a mere technicality to be waved away by appealing to the "natural order" of tosses. It exposes that Expected Value theory lacks the resources to handle coherent gambles where the sum of utilities is conditionally convergent. The theory does not just break at infinity (St. Petersburg); it breaks at *indeterminacy* (Pasadena). This is not a fenceable artifact; it is a structural weakness. Rational choice theory cannot claim to be a universal norm if it yields to the Riemann rearrangement theorem. The defect is real, and it implies that rationality requires norms beyond simple expectation maximization.
