      *   *Justice and Force:* Pascal argues that true justice is unknowable to fallen man. Therefore, we rely on custom and established power to maintain order. Force is necessary to enforce justice, but force alone isn't just. The solution isn't to find true justice (impossible), but to legitimize force through custom/time.
