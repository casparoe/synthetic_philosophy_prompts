answer: |-
  It is completely understandable that you feel disoriented. The argument your roommate is deploying is a version of the **Copernican Principle** applied to temporal duration, often associated with the physicist J. Richard Gott. It is structurally identical to the famous **Doomsday Argument** regarding the human species that you recall from your philosophy of science lecture.

  In formal epistemology, this is a classic case study in **self-locating belief** and **observation selection effects**. The reason it feels like a "sleight of hand" is that it attempts to derive substantive empirical predictions from purely indexical information (i.e., *where* you are in the timeline, rather than *what* is happening in the timeline).

  Here is a breakdown of the argument's structure, the assumptions required to make it work, and the specific objections that likely explain your intuition that something is missing.

  ### 1. The Structure of the Argument

  Your roommate's reasoning relies on treating your current moment of observation as a random sample from the total lifespan of the entity.

  1.  **The Copernican Assumption:** There is nothing special about the present moment. You should not assume you are observing the newspaper at the very beginning or the very end of its existence.
  2.  **The Uniform Prior:** Absent other information, you should assign a uniform probability distribution to your position within the total lifespan of the newspaper. If the total lifespan is $T_{total}$ and the time elapsed is $t_{past}$, your fractional position $F = t_{past} / T_{total}$ is uniformly distributed between 0 and 1.
  3.  **The Calculation:**
      *   If you are in the middle 50% of the newspaper's life (a 50% confidence interval), then $0.25 < F < 0.75$.
      *   Solving for the remaining time ($t_{future}$), this yields the range your roommate cited: $1/3 \cdot t_{past} < t_{future} < 3 \cdot t_{past}$.
      *   With $t_{past} = 34$, the future is between 11 and 102 years.

  Mathematically, the derivation is sound *if* you accept the premises. The philosophical friction comes from whether the premises apply to a student newspaper.

  ### 2. The Crucial Assumptions (and Where They Wobble)

  For this argument to hold, three specific assumptions must be true. In the context of your course, these are the assumptions about the **reference class** and the **prior probability distribution**.

  #### A. The Reference Class Problem
  To apply the uniform prior, you must define the class of things from which you are sampling.
  *   **Roommate's Class:** "All temporal entities" or "All publications."
  *   **Your Intuition:** "Student newspapers at wealthy universities during budget crises."

  If the newspaper belongs to a reference class where most members die young (e.g., "student clubs"), the prior shifts. If it belongs to a class where members are robust (e.g., "established institutions"), the prior shifts. The argument requires that the newspaper be "typical" of its class. But if we know the university is cutting funding, the newspaper is no longer a random sample of "all newspapers"; it is a specific sample of "endangered newspapers."

  #### B. The "Ignorance" Prior (Scale Invariance)
  The math implies a specific prior probability distribution over lifespans known as the **Jeffreys Prior** (proportional to $1/t$). This assumes that before looking at the newspaper, you thought it was equally likely to last 1 year, 10 years, or 1,000 years (on a logarithmic scale).
  *   **Objection:** Do we really have *no* prior knowledge? We know universities exist on decadal cycles. We know print media is declining. To claim "total ignorance" when we actually have background knowledge about the fragility of print media is to throw away relevant data. In Bayesian terms, your roommate is insisting on using an uninformative prior when an informative one is available.

  #### C. Stationarity (Constant Hazard Rate)
  The argument implicitly assumes that the probability of the newspaper folding *next year* does not depend on how long it has *already* existed.
  *   **Objection:** Many entities have a "bathtub curve" of mortality. Startups are likely to fail early; if they survive the "valley of death," they become stable. If the newspaper has survived 34 years, it may have institutional protections (alumni networks, archived status) that a 1-year-old paper lacks. This is the **Lindy Effect**: for non-perishable things, life expectancy increases with current age. Gott's formula accounts for this somewhat, but it assumes a specific mathematical relationship that might not fit the sociology of university administration.

  ### 3. Connection to Formal Epistemology: SSA vs. SIA

  Since you are studying self-locating belief, this is the most relevant technical distinction. The Doomsday Argument (and your roommate's claim) relies on the **Self-Sampling Assumption (SSA)**.

  *   **SSA:** You should reason as if you are a random observer from the set of all actual observers (or moments).
  *   **The Implication:** If the newspaper were going to last 1,000 years, there would be 1,000 "moments" of its existence. If it lasts only 40 years, there are only 40 moments. Since you find yourself at year 34, it is statistically more likely that you are in a short-lived timeline (where year 34 is near the end) than in a long-lived timeline (where year 34 is just the beginning).

  However, many epistemologists argue for the **Self-Indication Assumption (SIA)** as a counter.
  *   **SIA:** You should reason as if you are a random observer from the set of all *possible* observers, weighted by the probability of that world existing.
  *   **The Rebuttal:** Worlds where the newspaper lasts longer contain more observer-moments, so you are *more* likely to exist in those worlds to begin with. SIA tends to cancel out the Doomsday effect entirely.

  If your course covers the **"Presumptuous Philosopher"** objection, this is the same logic. If we accept the roommate's reasoning, we could argue that any stable institution is about to collapse simply because we are observing it now, which seems absurd.

  ### 4. The Strongest Objection: Specific Evidence Trumps Generic Priors

  The most pragmatic objection—and likely the one that validates your intuition—is about **Bayesian Updating**.

  Even if we grant the Copernican Prior as a starting point (a "baseline"), the moment you introduce specific evidence, the prior is swamped.
  *   **Prior:** 50% chance it lasts 11–102 more years (based on age alone).
  *   **Likelihood:** The university is cutting funding. Print ad revenue is down 80%.
  *   **Posterior:** The probability of collapse in the next 5 years skyrockets.

  Your roommate's claim that we can say something substantive *"before any of that information comes in"* is technically true but practically vacuous. It is like saying, "Before checking the weather, I can predict there is a 50% chance it will rain tomorrow based solely on the fact that it is Tuesday." It's a statement about your *ignorance*, not about the *world*. Once you check the weather (or the budget), the "Tuesday" data becomes irrelevant.

  ### Summary for Your Argument

  You can tell your roommate that her reasoning is a recognized philosophical position (Gott's Copernican Principle), but it is controversial for three reasons:

  1.  **Reference Class:** She is treating the paper as a "random temporal object" rather than a "student publication during a budget crisis."
  2.  **Bayesian Swamping:** Any specific evidence about funding or readership (likelihoods) will overwhelm the generic prior derived from age.
  3.  **Selection Effects:** Her argument relies on the Self-Sampling Assumption (SSA). If one adopts the Self-Indication Assumption (SIA), the predictive power of the argument vanishes.

  **Verdict:** The argument is logically valid *given* its assumptions, but the assumptions are implausibly strong for this specific case. It treats a causal, sociological event (a newspaper folding) as a purely statistical sampling problem. It works best for phenomena where we truly have *no* causal model (e.g., predicting the duration of an alien civilization), but fails when we have access to the internal mechanics of the system (e.g., university budget meetings).

  It is excellent that this material is rattling around in your head; this specific tension between **indexical information** (where I am) and **empirical information** (what is happening) is one of the most fertile grounds in contemporary epistemology.
