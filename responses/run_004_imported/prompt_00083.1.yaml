      *   *Synchronic:* Given what I know *now*, what maximizes utility *now*? (CDT/EDT usually win here).
      *   *Diachronic:* Given what I knew *then* (ex ante), what policy maximizes utility *overall*? (UDT wins here).
      *   The user asks: Why should the "now" self care about the "then" self's plan, especially when the "now" self sees the "then" self's plan as suboptimal given current info?
      *   The "ensemble of possible worlds" argument fails for the user because they feel like a *particular* agent in a *particular* world, not a distribution.

  3.  **Brainstorming Arguments for UDT Authority:**
