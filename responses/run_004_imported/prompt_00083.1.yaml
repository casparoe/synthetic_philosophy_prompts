      *   Is it strong? It needs to be philosophically rigorous.

  *(Self-Correction)*: Wait, I need to be careful not to just say "UDT is right." I need to justify *why the updated self should listen*. The argument must be that the updated self's reasoning is *flawed* because it treats logical facts as empirical history. The "authority" is the authority of logical consistency.

  Let's build the argument around **The Unity of the Decision Algorithm**. The "ex ante" self isn't a different person; it's the *complete* specification of the agent. The "updated" self is a *fragment* trying to reason about a system it is part of without acknowledging its own role in the system's definition.

