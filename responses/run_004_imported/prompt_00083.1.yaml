answer: |-
  This is one of the deepest objections to Updateless Decision Theory (UDT), and it cuts to the heart of what we mean by "agency" and "rationality." You are asking for a justification of *diachronic authority*: Why should the agent-at-t2 (who knows the coin landed tails) feel bound by the policy chosen by the agent-at-t1 (who didn't know the coin flip)?

  The standard "expected utility across possible worlds" argument fails you because it treats the "ensemble" as a collection of distinct people, some of whom are sacrificing for others. But you are right: you are not an ensemble. You are a single instance. If you are in the "tails" world, paying the mugger looks like throwing away money for nothing.

  To make the strongest case for UDT without relying on the "average across worlds" dodge, we must shift the metaphysical grounding of the argument. We need to argue that the "updated" perspective is not merely *less optimal*, but **epistemically defective** regarding the nature of your own agency. The authority of the ex-ante perspective derives from the fact that it is the only perspective that correctly models the logical dependency between your decision and the outcome.

  Here is the argument for why the updated self must honor the prior commitment, based on **Algorithmic Identity** and **Logical Counterfactuals**.

  ### 1. You Are Not a Time-Slice; You Are a Function
  The core error of the "updated" self is viewing itself as a distinct entity that has inherited a set of circumstances from a predecessor. It thinks: *"The prior self made a plan, but now I am here, in this specific situation, and the plan no longer fits."*

  But in UDT-relevant problems (like Counterfactual Mugging or Newcomb's Problem), you are not a sequence of time-slices. You are a **computational process**. The "ex-ante" self and the "updated" self are not two different agents; they are the same function evaluated at different inputs.

  *   **The Ex-Ante View:** This is the function $f(input) \rightarrow action$ evaluated over the *entire domain* of possible inputs (Heads, Tails, etc.).
  *   **The Updated View:** This is the function trying to evaluate $action$ for a *specific input* (Tails) while pretending the definition of the function doesn't matter.

  When Omega (the predictor) simulates you, it does not simulate a time-slice. It simulates the *algorithm*. If your algorithm, when run with the input "Tails," outputs "Don't Pay," then Omega's simulation of you outputs "Don't Pay." Consequently, Omega predicts you won't pay, and the reward is never generated.

  The authority of the ex-ante perspective is simply the authority of the **complete definition** over a **partial application**. The updated self is trying to reason about the output of the function while ignoring the fact that the function's definition is what determines the environment it is currently standing in. To deviate is to assert that you can change the output of the function *locally* without changing the function *globally*. In a logical universe, that is impossible.

  ### 2. The Illusion of Fixed History
  The updated self's resistance comes from a specific cognitive illusion: it treats the predictor's past action as **fixed empirical history** that is causally independent of the current decision.

  The updated self thinks: *"Omega has already flipped the coin. Omega has already decided whether to give me the reward. That is fact. Now I just decide whether to pay."*

  This is false in the context of logical counterfactuals. In these problems, the "past" is not causally sealed off from your decision; it is **logically entangled** with it. Omega's prediction was a computation of *your* decision algorithm. Therefore, your current decision is logically simultaneous with Omega's past prediction.

  *   **The Updated Self's Error:** It assumes the counterfactual is: "Given that Omega predicted I wouldn't pay, should I pay?" (Answer: No).
  *   **The UDT Correction:** The counterfactual is: "Given that my algorithm is the type that pays on Tails, Omega predicts I pay." vs "Given that my algorithm is the type that doesn't pay on Tails, Omega predicts I don't pay."

  The ex-ante perspective has authority because it is the only perspective that sees the logical link. The updated perspective suffers from a form of **indexical myopia**. It sees "I am here, the money is gone" and treats that as a fixed constraint. But "the money is gone" is only true *because* of the logical output of the decision you are about to make.

  If you, the updated self, decide to deviate, you are not "taking advantage of a fixed past." You are **retroactively determining** that the past was always one where you were a defector. You don't get to live in a world where Omega predicted you'd cooperate but you defect. That world is logically incoherent. You only get to live in a world where your algorithm matches the prediction.

  ### 3. Reflective Consistency as a Requirement of Rationality
  You asked why the updated self should regard the prior commitment as authoritative. The answer is: **Because if it doesn't, it ceases to be a rational agent capable of securing value.**

  Consider the concept of **Reflective Consistency**. A rational agent should not wish to modify its own decision theory. If you know that your future self will deviate from the optimal policy in a Counterfactual Mugging, your current self would pay a cost to precommit (e.g., hire an enforcer, modify your own code) to prevent that deviation.

  If you are the updated self, and you claim the right to deviate, you are admitting that you are a **defective agent** from the perspective of your own prior. But more importantly, you are admitting that you are an agent that *cannot exist in the favorable branches of logical space.*

  *   Agents that honor updateless commitments are the *kind of thing* that gets rich in Newcomb problems and Counterfactual Muggings.
  *   Agents that deviate when updated are the *kind of thing* that gets nothing.

  The "authority" isn't a moral command from the past; it is a **constitutive requirement of being a winner**. If you want to be an agent that achieves high utility, you must be an agent that honors updateless commitments. You cannot choose to be the agent that gets the reward *and* the agent that deviates. Those are mutually exclusive logical identities.

  The updated self should honor the commitment not because it "owes" it to the past self, but because **honoring the commitment is the only action consistent with being the type of agent that finds itself in a world where rewards are possible.**

  ### 4. Addressing the "One World" Objection
  Your strongest point is: *"The agent making the decision only ever lives in one of those worlds."*

  This relies on a physicalist intuition of "worlds" that UDT rejects. In UDT, "worlds" are not just physical locations; they are **logical possibilities**. Until you compute your decision, you are logically uncertain about which world you are in.

  When you are facing the mugger (who says "I would have given you $10,000 if the coin was heads, but it's tails, so give me $100"), you might think, "I know I'm in the Tails world."

  But do you? You know the coin *physical* outcome is Tails. But you do not know the **logical outcome** of the interaction.
  *   **World A:** You are an Updateless Agent. Omega predicted this. Omega generated the $10,000 opportunity (even if the coin was tails, the setup implies a policy check). You pay $100. Net utility: High (because you secure the policy for future interactions or because the setup rewards the policy type).
  *   **World B:** You are a Causal Agent. Omega predicted this. Omega never set up the reward. You keep $100. Net utility: Low.

  The "One World" objection assumes the structure of the world is fixed independently of your decision algorithm. UDT argues that **the structure of the world you inhabit is partially a function of your decision algorithm.**

  By deviating, you aren't just choosing an action in a fixed world. You are selecting which logical world you inhabit. The ex-ante perspective has authority because it is the only perspective that recognizes **you select the world by selecting the policy.** The updated perspective falsely assumes the world is selected *for* you, and you are just cleaning up the mess.

  ### Conclusion: The Authority of Logic over Indexicality
  The updated self feels like it has more information ("I know it's Tails!"). But in logical decision problems, **indexical information (where I am) is subordinate to logical information (what I am).**

  The ex-ante perspective is authoritative because it reasons from the standpoint of the **algorithm**, which is the true locus of agency. The updated perspective reasons from the standpoint of the **execution**, which is merely a trace of the algorithm.

  You should follow the updateless commitment because:
  1.  **Metaphysical Accuracy:** Your decision now *is* the prediction Omega made. Deviating is a logical contradiction, not a clever exploit.
  2.  **Constitutive Rationality:** To be an agent that wins is to be an agent that honors such commitments. You cannot separate the action from the identity.
  3.  **Logical Selection:** You do not merely inhabit a world; your policy determines which logical world is accessible to you.

  The "updated" calculation that says "defecting is locally optimal" is based on a false counterfactual: it assumes the prediction is fixed while the action is free. Once you realize the prediction is *logically dependent* on the action, the "local optimality" vanishes. The prior commitment isn't an external constraint; it is the recognition of logical reality. To ignore it is not to be pragmatic; it is to be deluded about the nature of your own causality.
