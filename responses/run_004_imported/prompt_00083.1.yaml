      *   **Point 2: The Illusion of Fixed History.** In UDT-relevant cases (predictors), the past isn't fixed relative to your decision. The predictor simulated *you*. Your current decision *is* the output of that simulation. The "updated" self falsely assumes the prediction is already settled independent of its current reasoning.
      *   **Point 3: Reflective Stability as a Normative Requirement.** Rationality isn't just about winning the local battle; it's about being the kind of thing that wins the war. If you deviate, you are admitting you are not the kind of agent that wins.
      *   **Point 4: Addressing the "One World" Objection.** You don't know which world you are in *in the sense that matters*. Logical uncertainty means you don't know the output of your own algorithm until you compute it. The "ensemble" is logical space, not just physical multiverse.
      *   **Conclusion:** The authority of the prior is the authority of logic over indexicality.

  6.  **Refining the Argument (Self-Correction during drafting):**
