      *   *Critique:* The user hates the "average utility" argument.
      *   *Fix:* Frame it as *correct counterfactual reasoning*. The updated self thinks: "Given I am here, the money is already gone/stayed." UDT says: "No, the money being here is logically contingent on what I decide *now*." The authority comes from *truth*, not just optimization. The prior sees the logical links; the posterior thinks they are severed.

  7.  **Final Polish:**
