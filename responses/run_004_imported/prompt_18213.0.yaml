answer: |-
  Good evening. For those of you who don't know me, I'm the older brother. And for those of you who *do* know me, you know that I tell stories for a living. I make things up.

  But my sister, the bride, has spent the last several years studying the exact opposite. She has a PhD in the logic of belief. Specifically, she studies the things we say that *cannot* be believed, even when they're true. She studies the lies we tell ourselves when we pretend to know things we can't possibly know.

  So, I looked at the traditional wedding toast, and I realized it is basically a minefield of what she calls "Moore's Paradoxes."

  Usually, right about now, I would stand up and say, "I *know* these two will be happy forever." I would say, "I am *certain* they are perfect for each other."

  But if I said that, I would be asserting a fact about the future while lacking the evidence to believe it. And if there is one thing this bride hates, it's an epistemic overreach. She is the type to wince when someone says "I promise" if they haven't checked their calendar first. So, in the interest of marital harmony starting *now*, I am going to be rigorously sincere.

  I am not going to tell you that I know how this story ends. I don't. I'm a novelist; I know that the best stories aren't the ones where the ending is guaranteed. They're the ones where the characters choose each other, chapter after chapter, without a safety net.

  I look at [Partner's Name] and I see someone who listens to her. Really listens. I see someone who makes her laugh in that specific, unguarded way that she only laughs when she feels safe. I see a partnership that is built on curiosity rather than assumption. Do I know that will last? No. The future is a dark room. But do I believe you have the right flashlights? Absolutely.

  And this brings me to the moment I've been nervously preparing for. I want to make a statement that honors my sister's work, without giving her a reason to correct my grammar during the vows.

  So, here is my prediction: **I believe that this marriage will last a lifetime. But I do not believe that I *know* that.**

  *(Pause for the philosophers in the room to smile)*

  For the rest of you: That means I am betting on you, but I'm not pretending to be a prophet. I'm acknowledging that love isn't about certainty. Certainty is for math. Love is for people. Love is the act of committing to someone even though you admit you can't see the finish line.

  My sister taught me that there are some truths you can't hold too tightly, or they turn into lies. You can't "know" you'll be happy. You can only build a life where happiness has a place to land.

  So, I won't wish you a perfect life. I won't say you'll never fight, or never doubt, or never have a Tuesday night where you wonder what you're doing.

  Instead, I will say this: I believe in the way you look at each other when the other person isn't looking. I believe in the work you are willing to put in. And I believe that if anyone can navigate the uncertainty of being human together, it is the two of you.

  Please raise your glasses. To [Sister] and [Partner]. May you never claim to know the future, but may you always believe in each other.

  To the bride and groom.
