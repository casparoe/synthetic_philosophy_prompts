answer: |-
  Hi everyone. For those who don't know me, I'm the younger sibling. I'm sixteen, which means I'm probably the least qualified person here to talk about economics. But when I was in seventh grade, stressed out about soccer and homework, my sister sat me down and gave me some advice that stuck.

  She told me about an essay by John Maynard Keynes called *Economic Possibilities for our Grandchildren*. He predicted that eventually, technology and productivity would solve the problem of scarcity. We wouldn't need to grind just to survive. But he warned that the real challenge wouldn't be working; it would be learning how to *live* with all that freedom.

  She also told me about how Keynes was influenced by the philosopher G.E. Moore. They believed that most things we chase—money, status, career—are just means to an end. They're tools. The only things that are actually good in themselves, the actual *ends*, are states of consciousness: love, relationships, and beauty.

  Looking around this room, I see a lot of economists. You two are spending your careers studying the means. You're becoming experts in scarcity, incentives, and efficiency. And that is incredibly impressive. But a wedding isn't about the means. It's about the end.

  Today isn't about optimizing utility or modeling growth. It's about celebrating the one thing Keynes said money was never supposed to replace. You're building a life together where you don't just survive, but actually live.

  So, my wish for you is this: May you always remember that economics is just the toolbox. But this? What you have right now? This is the point.

  Please raise your glasses. To the bride and groom: May your models be robust, but may your love always remain the only variable that truly matters. Cheers.
