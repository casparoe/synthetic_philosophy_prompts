answer: |-
  **Setting:** *A quiet corner of a coffee shop near the university, late afternoon. Two philosophers of biology, ELENA and MARCUS, are finishing a seminar on biological information. Elena defends the semantic view; Marcus defends the deflationary, causal-parity view.*

  **Elena:** You were quiet during the Q&A, Marcus, but I saw you wince when the speaker said DNA "instructs" the ribosome. I know that look. You think it's magical thinking.

  **Marcus:** Not magical, Elena. Just unnecessary. When I hear "instruction," I hear a ghost in the machine. We have a perfectly good account of protein synthesis involving electrostatic forces, molecular binding affinities, and conformational changes. Why add "information" on top of that? It sounds like we're trying to smuggle a little homunculus into the nucleus.

  **Elena:** But that's exactly what the "frozen accident" argument blocks. Think about the chemistry. There is no chemical affinity between a codon, say GCU, and alanine. If you mix them in a beaker, nothing happens. The connection is mediated by the aminoacyl-tRNA synthetases. As Crick said, the mapping is arbitrary. It's conventional. And where you have convention, you have a code. If the relationship isn't determined by physics alone, what determines it?

  **Marcus:** Evolution determines it. But evolution isn't a designer; it's a filter. Just because the mapping wasn't chemically necessitated *initially* doesn't mean it's semantic *now*. Once the synthetases evolved, the relationship *is* physically fixed. The synthetase binds the tRNA and the amino acid because of its shape and charge distribution. That's causal, not semantic. You're conflating the *history* of the system with the *mechanism* of the system.

  **Elena:** I'm not conflating them; I'm saying the history fixes the function, and the function creates the semantics. This is Maynard Smith's point. In a human code, a designer fixes the meaning. In biology, natural selection fixes the meaning. The DNA sequence is *for* producing a specific phenotype. That "for-ness"—that teleology—is the hallmark of semantic content. Without it, you only have Shannon information: mere correlation. Smoke carries Shannon information about fire, but it doesn't *instruct* anything. DNA does.

  **Marcus:** I'll grant you the distinction between Shannon and semantic information. Smoke correlates; a stop sign instructs. But why is DNA the stop sign and the cytoplasm the car? This is where the Parity Thesis hits you. If "reliable correlation plus evolutionary function" is your criterion for information, then the maternal cytoplasm qualifies. The structure of the egg determines the axis of the embryo just as reliably as the DNA determines the protein sequence. The intracellular architecture constrains development just as tightly. Why do we call DNA the "program" and the cytoplasm merely the "environment"?

  **Elena:** Because of specificity. The cytoplasm provides the conditions, the background constraints. But it doesn't specify *which* protein. The DNA sequence is the variable element. If you swap the DNA, you get a different organism. If you swap the cytoplasm between closely related species, you often get a viable hybrid. The DNA carries the *specificity* of the outcome. That asymmetry justifies the information label.

  **Marcus:** But that asymmetry is relative to *our* interests as geneticists. From the perspective of the developing cell, the cytoplasm is just as causal. If you disrupt the cytoskeleton, the DNA's "instructions" go nowhere. Oyama's point is that by singling out DNA, we're replicating a preformationist bias. We want to find the "boss" molecule. But there is no boss. There's a network of interdependent causes. If you call DNA a code because it's arbitrary and specific, you have to call the tRNA synthetases a code, too. And the ribosome. And the membrane potential. If everything is a code, nothing is. The term loses its bite.

  **Elena:** I agree that if *everything* is information, the term is useless. But not everything is a code. A code requires a decoder that is distinct from the message. The DNA is passive; the cellular machinery is active. The machinery *interprets* the sequence. The synthetases are the physical embodiment of the dictionary. They translate the nucleotide language into the amino acid language. That translation step is the smoking gun. You don't get that with the cytoplasm. The cytoplasm doesn't get "read"; it gets *used*.

  **Marcus:** "Read" versus "used." That's a linguistic distinction, not a biological one. The ribosome "uses" the tRNA just as it "uses" the mRNA. The tRNA fits into the ribosome like a key in a lock. Is the key a message? Or is it a tool? When I turn a key in my door, I'm not sending a message to the lock; I'm triggering a mechanism. Why is the tRNA different? Because we *say* it's an adaptor? That seems circular. You're defining the system as semantic to prove it's semantic.

  **Elena:** It's not circular if the arbitrariness is real. A key is shaped to fit a specific lock by physical necessity of the tumblers. But the genetic code could have been different. Universal life uses the same code not because GCU *must* equal alanine, but because we all inherited the same "dictionary." That historical contingency is preserved by selection. The cell treats the DNA as a representation of the protein, not just a cause of it. If the DNA is damaged, the cell repairs it to restore the *sequence*, not just the chemical stability. It's preserving the *message*.

  **Marcus:** I'll concede that point, partially. The repair mechanisms do treat the sequence as a template to be preserved, which implies a distinction between the physical molecule and the order of bases. That looks like a distinction between substrate and information. But here's where I hold my ground: acknowledging that distinction doesn't require us to say DNA has *semantic content* in the philosophical sense. It just means the system has error-correction feedback loops. A thermostat preserves a temperature setting. Does the thermostat "know" the temperature? Does the setting have "meaning"? Or is it just a negative feedback loop?

  **Elena:** A thermostat is too simple. It's a single variable. The genome is combinatorial. It allows for open-ended variability. That's why the metaphor isn't just a heuristic; it's structurally isomorphic to human language. But let me press you on the "homunculus" worry. You think semantic talk implies a mind reading the DNA. I'm saying the cell *is* the mind, in a very diluted sense. The cellular machinery constitutes an "interpretive stance." Dennett talks about the intentional stance. We can predict the cell's behavior by treating the DNA as a set of instructions.

  **Marcus:** I'm happy with the intentional stance as a tool for *us*, the observers. That's instrumentalism. But you realists want to say the information is *in the DNA*, independent of us. That's where I balk. If there were no biologists to interpret the code, and no evolutionary history to select it, would the DNA still be "information"?

  **Elena:** If there were no evolutionary history, there would be no code. But given evolution, yes. The "interpreter" isn't us; it's the ribosome. The semantic relation exists between the DNA and the machinery. It's a naturalized semantics.

  **Marcus:** Okay, let's isolate the disagreement then. You say the semantic relation is intrinsic to the biological system because the system contains its own decoder. I say the "decoder" is just another causal component, and calling it an interpreter adds no explanatory power to the biochemistry. If I can explain protein synthesis entirely by kinetics and thermodynamics, what work is "information" doing?

  **Elena:** It explains the *evolvability*. If DNA were just a causal chemical trigger, changing it would be like changing the shape of a gear. But because it's a code, you can change the message without changing the machinery. You can mutate the gene without breaking the ribosome. That decoupling of the "program" from the "processor" is what allows for the vast exploration of phenotypic space. The semantic view explains *why* evolution works as well as it does.

  **Marcus:** That is a strong point. The decoupling is real. I will concede that DNA plays a unique *functional role* as the stable, combinatorial repository of variation, distinct from the metabolic machinery. That distinguishes it from the cytoplasm, answering the Parity Thesis to some degree. The Parity Thesis is right about causation—everything is causal—but wrong about *control architecture*. DNA is the locus of control because it's the most modular part of the system.

  **Elena:** And modularity plus arbitrariness equals code.

  **Marcus:** Not necessarily. It equals a *control architecture*. I'll grant you that "information" is the best shorthand we have for that architecture. It's indispensable for biological practice. You can't do molecular biology without talking about codes. But I still deny it's *ontologically* distinct from causation. It's a high-level description of a causal pattern. You're arguing it's a distinct layer of reality.

  **Elena:** I'm arguing it's a distinct layer of *organization*. If I write a novel, the ink and paper are physics. The story is semantics. You can't find the story by analyzing the ink's chemistry. You need the conventions of language. In the cell, the "conventions" are fixed by evolution, not a linguist. But the distinction remains. The sequence *means* alanine; it doesn't just *cause* alanine.

  **Marcus:** And I say "means" is just a fancy way of saying "was selected to cause." If we strip away the selection history, the "meaning" vanishes, but the chemistry remains. So the semantics is parasitic on the history.

  **Elena:** Agreed. Naturalized semantics *requires* the history. But once that history is in place, the semantic properties are real features of the system.

  **Marcus:** Then perhaps our disagreement is narrower than it seems. You think "semantic property" is a valid category in our ontology of biology. I think it's a valid category in our *heuristics*, but reducible to causal history without remainder.

  **Elena:** I can live with that, provided you admit that "reducible" doesn't mean "eliminable." You can't do the science without the semantic layer.

  **Marcus:** I can't do the science without the *term*, Elena. But I don't need the *property*. I need to know the binding affinity, not the "meaning."

  **Elena:** But you need the "meaning" to know *which* binding affinity to look for. The code tells you where to look.

  **Marcus:** *Touché.* The code guides the investigator. So, it's epistemically indispensable, even if ontologically suspect.

  **Elena:** For a retired experimentalist sitting in on our reading group, that might be enough. They used the language to get the work done. Whether the universe cares about the difference between "instruction" and "causation" might be above their pay grade.

  **Marcus:** And below mine. But I'm glad we agree that DNA isn't magic.

  **Elena:** And I'm glad you agree it's not just ink on paper.

  **Marcus:** Cheers to that.

  **Elena:** Cheers.
