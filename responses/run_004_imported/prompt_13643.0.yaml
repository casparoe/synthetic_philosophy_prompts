      *(Self-Correction during final review)*: Make sure Marcus doesn't sound like he denies evolution. He denies that evolution creates *semantic* properties, only *functional* ones. Elena needs to argue that function *just is* semantics in this context.

      *Key moment for convergence:* They might agree that "information" talk is unavoidable for *biology as a science*, but disagree on whether it reflects a distinct *layer of reality*.

      *Let's sharpen the ending.* Instead of a vague agreement, let's have them identify the core friction: Is the "code" a feature of the *system* or a feature of the *observer*? Elena says the system embodies the interpreter (the ribosome/synthetase complex). Marcus says the interpreter is just another machine part.

