answer: |-
  This is one of those beautiful intellectual convergence points that makes diving into philosophy worth it. You've stumbled onto a genuine hidden gem in the history of ideas: Michael Dummett is canonical in logic and language, but his political philosophy is equally rigorous, yet far less cited in the tech/analytic philosophy crossover circles.

  It is not a coincidence that the man who argued against "truth-conditional semantics" (the idea that meaning is determined by objective truth conditions independent of our ability to know them) was also the man arguing against immigration laws based on "objective status" independent of human reality.

  Here is a reconstruction of what Dummett likely would have said about Windrush and Rwanda, grounded in his actual texts (primarily *On Immigration and Refugees*, 2001) and his decades of activism with the Joint Council for the Welfare of Immigrants (JCWI).

  ### 1. The Core Framework: "The Presumption of Admission"
  To understand Dummett's reaction, you have to start with his baseline axiom, which he argued for vigorously in 2001: **There is a general human right to immigrate.**

  He rejected the standard Westphalian view that states have an absolute sovereign right to exclude anyone they choose. He argued that while states can regulate *flow*, the default position must be openness. Restrictions require positive moral justification (e.g., immediate threat to public safety), not just "because we are a state."

  He viewed the British immigration system not as a neutral filter, but as a mechanism designed to preserve a specific racial homogeneity under the guise of economic management. He called the Commonwealth Immigrants Acts (1962, 1968) and the 1971 Immigration Act "institutionalized racism."

  ### 2. On the Windrush Scandal
  The Windrush scandal (2018) involved people who arrived before 1973 (when they had an automatic right to remain) being detained, deported, or denied healthcare because they couldn't produce specific paperwork. This stemmed from the 1971 Immigration Act and the "Hostile Environment" policy.

  **Dummett's Diagnosis: The Logical Conclusion of the 1971 Act**
  Dummett would not have been surprised by Windrush; he would have viewed it as the inevitable execution of code he tried to delete 40 years prior.
  *   **The 1971 Act:** Dummett and his wife, Ann (who co-founded the JCWI), fought the 1971 Act specifically because it created a distinction between "patrials" (those with a parent/grandparent born in the UK) and everyone else. This effectively privileged white Commonwealth citizens (Australians, Canadians) over black and Asian ones.
  *   **The Burden of Proof:** Dummett argued that in a just system, the burden of proof lies with the state to justify exclusion. Windrush inverted this: the burden was on the individual to prove inclusion. For Dummett, a system that requires a human being to prove their own existence and history with documentary evidence that the state itself failed to keep is **morally incoherent**.
  *   **Bureaucracy as Racism:** In *On Immigration and Refugees*, he writes about how "technocratic" rules often mask racial intent. He would argue that Windrush proved his thesis: when you build a system designed to be "hostile" (as Theresa May explicitly stated the goal was), it will inevitably crush the vulnerable. The fact that the victims were disproportionately black Caribbean citizens would confirm his long-held view that the system was never race-neutral.

  **Likely Quote Reconstruction:**
  > *"We warned in 1971 that tying a person's right to remain to the possession of a stamp, rather than the fact of their life, was a moral catastrophe. The Windrush generation were not 'illegal'; they were the victims of a state that chose to forget its own obligations. To deport a man who has paid taxes here for fifty years because he lacks a specific form is not law enforcement; it is a betrayal of the social contract."*

  ### 3. On the Rwanda Deportation Scheme
  The Rwanda scheme involves sending asylum seekers who arrive in the UK to Rwanda for processing and potential settlement, intended as a deterrent.

  **Dummett's Diagnosis: Violation of the Geneva Convention**
  Dummett was a strict adherent to international law regarding refugees. He distinguished sharply between *economic migrants* (where states have more leeway) and *refugees* (who have a paramount claim).
  *   **The Right to Asylum:** Dummett argued that the right to seek asylum implies the right to *enter* the territory to make that claim. Offshoring the process undermines this.
  *   **Deterrence is Immoral:** A key pillar of Dummett's argument was that refugees cannot be used as pawns to deter others. Punishing a genuine refugee to send a message to potential future refugees treats the individual as a means to an end, which is Kantianly (and Dummettianly) unacceptable.
  *   **Evasion of Responsibility:** He viewed the Global North as having a specific obligation to refugees created by global instability (often exacerbated by Western foreign policy). Shipping people to Rwanda would look to him like "out of sight, out of mind" moral cowardice.

  **Likely Quote Reconstruction:**
  > *"The Geneva Convention was written in the blood of the 20th century to ensure that no human being is bounced between states like a parcel. The Rwanda scheme is an attempt to purchase a clear conscience by paying another nation to handle our moral failures. It treats the refugee not as a rights-bearer, but as a problem to be managed. This is the technocratic dehumanization I warned against."*

  ### 4. The "Extra Credit": Connecting Logic to Immigration
  You asked if we can tie this back to Intuitionism and Assertibility Conditions without forcing it. There *is* a structural resonance here, though Dummett himself kept his logic and politics in separate lanes. However, looking at them through a unified lens reveals a fascinating consistency in his thinking.

  **Truth Conditions vs. Assertibility Conditions**
  *   **In Logic (Realism):** A statement is true if it corresponds to reality, even if we can never know it (e.g., "There is an even number of stars in the universe").
  *   **In Logic (Dummett/Intuitionism):** Meaning is grounded in *assertibility*. We can only claim a statement is true if we have the means to verify or construct a proof for it. Truth is epistemic, not metaphysical.

  **In Immigration Law:**
  *   **The "Realist" State (UK Home Office):** Treats immigration status as a **Truth Condition**. You *are* illegal or legal objectively, regardless of whether you can prove it. If the paperwork doesn't exist, the "truth" is that you don't belong, even if you've lived here for 50 years. The status exists independently of human verification.
  *   **The "Intuitionist" State (Dummett's View):** Status should be grounded in **Assertibility Conditions**. Can we verify your belonging through your life, work, community, and presence? If the state cannot construct a proof of your "illegality" without violating your rights or ignoring social reality, then the status "illegal" has no meaning.

  **The Connection:**
  Dummett's attack on classical logic was that it allowed for "truths" that were forever beyond human grasp (verification-transcendent truths). His attack on immigration law was that it relied on "statuses" that were beyond human grasp (verification-transcendent legality).

  When the Windrush scandal happened, the Home Office was acting like a **Classical Realist**: "The law says X, therefore you are Y, even if we lost the evidence."
  Dummett would argue for an **Intuitionist** approach to justice: "If we cannot construct a proof of your illegality that respects your human capacity to demonstrate belonging, then the judgment is void."

  In programming terms (since you're doing Idris):
  *   **Home Office:** `isIllegal : Bool` (Assumes a value exists even if uncomputable).
  *   **Dummett:** `isIllegal : (evidence : Proof) -> Bool` (If you can't provide the proof term, the function doesn't return true; the type is uninhabited).

  ### Summary
  Dummett would have viewed the last decade of UK immigration history not as a series of scandals, but as the unmasking of a system he spent his life analyzing. He would see Windrush as the proof that bureaucracy without moral grounding is violence, and Rwanda as the abandonment of international duty.

  And philosophically? He would likely say that a state which claims a "truth" about its citizens that it refuses to let them verify or contest is engaging in the same kind of linguistic nonsense he spent his career dismantling in metaphysics. It is language (law) ceasing to have a use in the human form of life.

  It is a profound irony that the man who taught us how to verify truth spent his final decades watching a state that refused to verify anything but paperwork.
