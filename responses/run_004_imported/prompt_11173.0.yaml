answer: |-
  This is a classic problem (often discussed alongside the *Riemann Rearrangement Theorem* and *Grandi's Series*), and it is genuinely frustrating because it strikes at the heart of whether "total value" is a property of the world or a property of the description of the world. Your friend is arguing that if the value depends on the description, the theory is broken; you are arguing that the description is a necessary constraint of the theory.

  Here is a joke that should land for someone who has spent an hour thinking about associative grouping in infinite welfare distributions:

  ***

  God summons a Total Utilitarian to the Pearly Gates to audit the Infinite Universe.

  "Here's the ledger," God says. "Countably infinite souls. Welfare alternates forever: +1, -1, +1, -1. What's the total value? Am I a good creator?"

  The Utilitarian squints at the scroll. "Well, if I sum them as $(+1 - 1) + (+1 - 1) + \dots$, the total is zero. You're morally neutral."

  "Okay," says God.

  "But," the Utilitarian continues, "if I sum them as $+1 + (-1 + 1) + (-1 + 1) + \dots$, the total is one. You're benevolent."

  God sighs. "But the souls don't come with parentheses. They just exist. Which is it?"

  The Utilitarian pulls a giant red marker from his robe. "That's the beauty of total utilitarianism! I can draw the parentheses wherever I want!"

  He leans over the ledger and circles the first soul. "There. Now you're benevolent. But if I circle the first *two* souls..." He moves the circle. "...now you're neutral."

  "Stop!" says God. "You're changing the moral value of my creation just by drawing circles!"

  "No," says the Utilitarian, "I'm just finding the true sum. Now, do you want me to use round brackets or square brackets? Because if I use square brackets and rearrange the seating chart, I can make the total value equal to $\pi$."

  God rubs his temples. "So, should I keep the universe?"

  The Utilitarian hesitates, pen hovering over the page. "I can't answer that until I know if you're left-associative or right-associative. If you're left-associative, I have a moral obligation to sustain you. If you're right-associative, I'm legally required to blow you up."

  God blinks. "I'm omnipotent, not a binary operator."

  "Then I'm afraid the audit is inconclusive," says the Utilitarian, capping the pen. "I'd love to save you, but I don't have the right brackets in my budget."
