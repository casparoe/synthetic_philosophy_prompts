answer: |-
  Here are 9 questions designed for your mock podcast, scripted to keep the pressure on the Fitting-Attitude (FA) theorist without letting her hide behind the "Wrong Kind of Reason" (WKR) slogan. I've included the anticipated follow-up for each, tailored to the standard defenses an FA theorist usually gives.

  **Host:** Welcome to *Metaethics Unbound*. Today we're talking to Dr. Elena Vance, a proponent of the Fitting-Attitude analysis of value. Dr. Vance, thanks for joining.

  **Dr. Vance:** Happy to be here.

  ### 1. The Core Claim
  **Host:** Let's start with the slogan. You claim that for something to be "good" just *means* it is a fitting object of a pro-attitude, like admiration or desire. But isn't there a risk of swapping one mystery for another? If I don't understand "good," why should I understand "fitting"?

  **Anticipated Follow-up:** *If she says "Fittingness is simpler/primitive," ask:* "If it's primitive, aren't you just telling us that 'good' is undefined, rather than analyzing it? What work is the 'attitude' part actually doing if all the heavy lifting is done by this primitive notion of fittingness?"

  ### 2. The Demon Case (Setting the Trap)
  **Host:** Critics love the "Demon-and-the-Mud" case. A demon threatens to burn the world unless you admire a mud pie. You have a massive reason to admire it, but the mud pie isn't *good*. Your standard move is to say the demon provides the "Wrong Kind of Reason." But if you just assert that, it sounds like you're defining away the counterexample rather than solving it. How do you justify that classification without begging the question?

  **Anticipated Follow-up:** *If she says "It's obvious the reason is pragmatic, not evaluative," ask:* "But the agent's mental state is identical in both cases. If the psychology is the same, why does the *source* of the reason change the fittingness? Are you saying the attitude itself changes based on external threats?"

  ### 3. The Circularity Challenge (Required Topic)
  **Host:** This leads to my next point. To solve the Demon case, you need to distinguish the Right Kind of Reason (RKR) from the Wrong Kind (WKR). But if you define the "Right Kind" as "reasons that track the goodness of the object," haven't you just presupposed the very value concept you were supposed to be analyzing? How do you define "Wrong Kind" without secretly smuggling "good" back into the definition?

  **Anticipated Follow-up:** *If she claims there's a structural/formal distinction (e.g., WKR doesn't bear on the object's properties), ask:* "But can't we describe the demon's threat as a property of the situation surrounding the object? If your structural distinction inevitably picks out exactly the reasons that track value, isn't the structure just a shadow of the value itself?"

  ### 4. State-Given vs. Object-Given (Required Topic)
  **Host:** A popular fix is to say WKR are "state-given" (reasons to *have* the attitude) while RKR are "object-given" (reasons about the *object*). But critics argue this is just renaming the problem. Does this split actually solve the tension, or does it just give a new name to the intuition that some reasons shouldn't count?

  **Anticipated Follow-up:** *If she insists the split is robust, ask:* "What about cases where an object's actual properties give me a pragmatic reason to avoid admiring it? If an object's beauty causes me social ostracization, that's an object-given reason to *not* admire it. Does your split collapse when object-properties generate state-reasons?"

  ### 5. The "Fittingness" Norm
  **Host:** Let's zoom out. Is "fittingness" a normative notion? If I say "admiration is fitting," am I saying I *ought* to admire it? If yes, aren't you just reducing value to a different kind of normativity (oughts) rather than explaining it in terms of attitudes?

  **Anticipated Follow-up:** *If she says "Fittingness is sui generis (its own thing)," ask:* "If it's its own unique normative category, how do we access it? Do we need a special faculty of 'fittingness-perception'? It starts to sound like the Moral Sense Theory you were trying to avoid."

  ### 6. The "Get Out of Jail Free" Card (Required Topic)
  **Host:** Here's a worry about methodology. If every time a counterexample arises—like the demon, or the evil genius, or the bribed judge—you can dismiss it as "Wrong Kind of Reason," couldn't *any* theory use this move? Couldn't a Utilitarian say pain is good, and when we object, just say "That's the wrong kind of intuition"? What stops this from being an immunization strategy rather than a theory?

  **Anticipated Follow-up:** *If she says "FA is unique because attitudes have correctness conditions," ask:* "But beliefs have correctness conditions too, and we don't allow pragmatic reasons to make beliefs 'true.' If the move works here, why doesn't it work for truth? If it doesn't work for truth, why should we accept it for value?"

  ### 7. Comparative Value
  **Host:** Your analysis handles "good" nicely, but what about "better"? Is X *better* than Y just means X is *more fitting* to admire than Y? But fittingness sounds binary—either an attitude fits or it doesn't. How does your view handle the gradability of value without making fittingness awkwardly granular?

  **Anticipated Follow-up:** *If she says "Fittingness comes in degrees," ask:* "If fittingness comes in degrees, does that mean there are degrees of 'correctness'? Can an attitude be 60% correct? That sounds strange for a normative standard. Are you comfortable making fittingness that fuzzy?"

  ### 8. Falsifiability (Required Topic)
  **Host:** I want to press you on evidence. We've talked about how you defend your view, but what would actually count as evidence *against* it? If you encounter a case where there is a clear Right Kind of Reason to admire something, but the object is intuitively neutral or bad, would you concede the theory is false, or would you argue our intuition about the "badness" is wrong?

  **Anticipated Follow-up:** *If she says "She would trust the theory over the intuition," ask:* "If the theory is insulated from intuitive counterexamples, isn't it functioning as a stipulation rather than an analysis? At what point does revising our intuitions become ignoring the data?"

  ### 9. The Alienation Objection
  **Host:** Last question. If I admire something *because* it is fitting to admire it, am I not alienated from the admiration? Real admiration usually happens because we are struck by the object, not because we calculated the normative status of our attitude. Does your theory turn value into a bureaucratic exercise rather than an emotional engagement?

  **Anticipated Follow-up:** *If she says "The analysis is metaphysical, not psychological," ask:* "But if the metaphysics of value disconnects entirely from the psychology of valuing, have you explained *value* or just explained a logical relation? Why should we care about 'goodness' if it doesn't track how we actually engage with the world?"
