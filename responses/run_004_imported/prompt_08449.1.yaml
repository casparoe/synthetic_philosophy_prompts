prompt: |-
  Quick one for a piece I'm chewing on about how stakes affect knowledge claims. I've been reading up on Hannah and the bank cases, and it seems like epistemic contextualism and pragmatic encroachment are basically just two names for the same insight — that whether you count as "knowing" something depends on how much is riding on it. Am I missing some real difference between the two camps, or is it more just a branding split between people studying the exact same phenomenon? Everytime I ask a philosopher they just restate their own camp's jargon back at me, so I could use a straight answer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Topic:** Epistemology, specifically the relationship between stakes and knowledge claims.
      *   **Reference:** Hannah and the Bank Cases (Keith DeRose's famous thought experiments).
      *   **User's Hypothesis:** Epistemic Contextualism and Pragmatic Encroachment are basically the same thing (just branding differences).
      *   **User's Frustration:** Philosophers tend to talk past them using jargon.
      *   **Goal:** A straight answer explaining the *real* difference (if any) between the two positions.

  2.  **Initial Assessment & Fact-Checking:**
      *   *Are they the same?* No. They are distinct theoretical responses to the same data (the Bank Cases).
      *   *What is the data?* In low-stakes scenarios, we say "I know the bank is open." In high-stakes scenarios, we say "I don't know the bank is open," even if the evidence is identical.
      *   *What is Contextualism?* The word "knows" changes meaning (semantic content) depending on the context of the *attributor* (the person saying "S knows").
      *   *What is Pragmatic Encroachment?* The word "knows" stays the same, but the *conditions* for knowing (specifically justification) change depending on the practical stakes of the *subject* (the person who supposedly knows).
      *   *Key Distinction:* Semantics vs. Metaphysics/Epistemology. Who drives the change? (Attributor vs. Subject). What changes? (Meaning of 'knows' vs. Truth conditions of belief/justification).

  3.  **Drafting the Core Explanation:**
      *   Acknowledge the similarity: Both agree that stakes matter for whether we *ascribe* knowledge.
      *   Highlight the divergence: They disagree on *why* and *where* the stakes do the work.
      *   *Contextualism:* It's about language. "Knows" is indexical (like "tall" or "here"). In a high-stakes conversation, the standard for using the word "knows" goes up. The subject's mental state hasn't changed, but our description of it has.
      *   *Pragmatic Encroachment:* It's about the nature of knowledge itself. Practical stakes actually affect whether the belief is justified or counts as knowledge. The subject's epistemic position literally changes because the stakes changed.

  4.  **Refining the Distinction (The "Straight Answer"):**
      *   Need to avoid jargon where possible, or explain it immediately.
      *   Use the Bank Case to illustrate.
      *   *Contextualist:* Hannah's evidence is the same. In the low-stakes chat, "Hannah knows" is true. In the high-stakes chat, "Hannah knows" is false. The truth value of the *sentence* changes.
      *   *Encroacher:* Hannah's evidence is the same. But in the high-stakes scenario, she *doesn't know*. In the low-stakes scenario, she *does know*. The truth value of the *fact* changes.

  5.  **Addressing the "Who" Question (Attributor vs. Subject):**
      *   This is crucial.
      *   Contextualism: Context of the *speaker* (attributor) matters.
      *   Encroachment: Context of the *agent* (subject) matters.
      *   *Test Case:* What if the speaker is in a low-stakes context talking about Hannah in a high-stakes context?
          *   Contextualist: "Hannah knows" is true (because speaker's context is low).
          *   Encroacher: "Hannah knows" is false (because Hannah's stakes are high).

  6.  **Structuring the Response:**
      *   **Direct Answer:** No, they aren't the same. It's not just branding.
      *   **The Common Ground:** Both accept the Bank Case intuition (stakes affect knowledge ascriptions).
      *   **The Crucial Split (The "Where"):**
          *   Contextualism = Semantics (Meaning of the word).
          *   Encroachment = Epistemology (Nature of knowledge/justification).
      *   **The Crucial Split (The "Who"):**
          *   Contextualism = Speaker's context.
          *   Encroachment = Subject's stakes.
      *   **Why it Matters:** Prediction differences (the "cross-context" test).
      *   **Tone:** Conversational, direct, avoiding unnecessary fluff (since the user asked for a "quick one" and a "straight answer").

  7.  **Self-Correction/Nuance Check:**
      *   *Is Pragmatic Encroachment a form of Contextualism?* Some people loosely group them as "anti-invariantism," but technically they are rivals. Invariantists (traditional) say stakes never matter. Contextualists say stakes change the *standard*. Encroachers say stakes change the *justification*.
      *   *Subject-Sensitive Invariantism (SSI):* This is often the specific label for Pragmatic Encroachment (Jason Stanley, etc.). I should mention SSI to be precise but keep it accessible.
      *   *Make sure not to get bogged down in "Standards" vs. "Justification" too deeply.* Keep it to "Does the word change or does the world change?"

  8.  **Final Polish:**
      *   Ensure the distinction between *attributor context* and *subject stakes* is crystal clear, as that's the easiest way to separate them practically.
      *   Reiterate that philosophers get defensive because the stakes (ironically) for their theories are high regarding the nature of language vs. mind.

  9.  **(Post-Drafting Review):** Does this answer the prompt? Yes. It addresses the "branding split" suspicion directly (it's not) and explains the difference without excessive jargon.

  *(Self-Correction during drafting)*: Wait, I need to be careful about the "Subject" vs "Attributor" distinction. While often a good heuristic, some contextualists might argue about subject stakes too. The *defining* feature is semantic vs. metaphysical.
  *   Contextualism: "Knows" expresses different relations in different contexts.
  *   Encroachment: "Knows" expresses the same relation, but practical facts partly constitute that relation.
  *   Okay, I will emphasize the *Semantic vs. Metaphysical* divide as the primary one, and the *Speaker vs. Subject* as the practical test.

  10. **Finalizing the Output.** (Proceed to generate response based on these points.)
answer: |-
  No, you aren't missing a trick—they are **not** just branding splits. They are rival theories that offer fundamentally different explanations for the same data (the Bank Cases).

  While both agree that stakes matter for whether we *say* someone knows, they disagree on **where** the stakes do their work and **what** is changing.

  Here is the straight answer, stripped of the jargon:

  ### 1. The Core Disagreement: Semantics vs. Reality
  *   **Epistemic Contextualism** says the word "knows" is slippery (like "tall" or "flat"). Its meaning shifts depending on the conversational context. In a high-stakes conversation, the bar for using the word "knows" is higher.
      *   *The Claim:* Hannah's mental state and evidence **do not change** between the low-stakes and high-stakes cases. Only the **meaning of the sentence** "Hannah knows" changes.
  *   **Pragmatic Encroachment** (often called Subject-Sensitive Invariantism) says the word "knows" has a fixed meaning, but practical stakes are actually part of what makes knowledge *true*.
      *   *The Claim:* Hannah's epistemic position **literally changes** when the stakes rise. High stakes degrade her justification. She actually *loses* knowledge when the penalty for being wrong gets higher.

  ### 2. The "Who Matters?" Test
  This is the easiest way to tell them apart in the wild.

  **Scenario:** Hannah is in a **high-stakes** situation (she will be ruined if the bank is closed). You are talking to a friend in a **low-stakes** situation (you are just casually discussing Hannah).

  *   **The Contextualist says:** You can truthfully say, "Hannah knows the bank is open."
      *   *Why?* Because **your** context (the speaker's) determines the standard. You are in a low-stakes chat, so the bar for "knows" is low.
  *   **The Pragmatic Encroacher says:** You must say, "Hannah does *not* know the bank is open."
      *   *Why?* Because **Hannah's** context (the subject's) determines the truth. Her stakes are high, so her justification isn't good enough for knowledge, regardless of who is talking about her.

  ### 3. Why Philosophers Fight About It
  It's not just turf war; it's about what kind of project epistemology is.

  *   **Contextualists** want to save the traditional idea that knowledge is purely about evidence and truth. They save this by offloading the "stakes" problem onto language (semantics).
  *   **Encroachers** are willing to change the traditional idea of knowledge. They argue that knowledge isn't just about evidence; it's about evidence *plus* practical utility.

  ### Summary
  If you think stakes change the **rules of the conversation**, you're a Contextualist.
  If you think stakes change the **state of the believer**, you're a Pragmatic Encroacher.

  They predict different truth values in cross-context conversations (the scenario above), so they are empirically distinct theories, not just rebranding.
