answer: |-
  The subjectivist position held by your friend—that priors are primitive, freely chosen inputs akin to utility functions—is a elegant defense of intellectual pluralism, but it rests on a category error regarding the nature of belief. It treats epistemic rationality as a matter of internal coherence (consistency with oneself) rather than external correspondence (consistency with reality).

  To argue for Hanson's Common Prior Assumption (CPA) is to argue that **rationality is universal, not personal.** If the goal of belief is to map the territory, then two maps of the same territory that contradict each other cannot both be correct. The subjectivist escapes this by retreating into the mind: "My map is coherent for me, yours for you." But this surrenders the claim that belief is about the world.

  Here is the case for why ideally rational agents must share a prior, why the subjectivist objection fails, and what this implies for disagreement.

  ### 1. The Category Error: Belief vs. Desire
  Your friend's analogy relies on the Savage/de Finetti tradition equating priors with utility functions. In decision theory, it is indeed irrational to tell someone they *should* prefer vanilla to chocolate. Preferences are constitutive of the agent; they define the "self."

  Beliefs are not constitutive; they are representational. A belief is a claim that *P is the case*. If I believe *P* and you believe *not-P*, we are making contradictory claims about objective reality (or at least, about a shared external world).

  If priors were truly primitive, unassessable inputs, then a brain damaged by a blow to the head that caused it to assign 99% probability to "I am a teapot" would be just as rational as a healthy brain, provided it updated coherently thereafter. Subjectivism protects coherence at the cost of calibration. But rationality is not just about not contradicting oneself; it is about not contradicting the world. Since the world is shared, the standards for mapping it must be shared. To say priors are exempt from rational assessment is to say the starting point of truth-tracking is arbitrary. That is a surrender of epistemology.

  ### 2. The Argument from Indexical Impartiality
  Hanson's strongest move is the "pre-rational" veil of ignorance. Imagine you exist before you know which physical brain you will inhabit. You know there are two agents, Alice and Bob, who will be created with different priors. You know the structure of the universe, but not your location in it.

  Would you commit to Alice's prior or Bob's?
  *   If you choose Alice's because "I will be Alice," you are engaging in **indexical bias**. You are privileging a specific location in spacetime without evidence that this location is more truth-apt than another.
  *   If you acknowledge that your future identity is a random variable, you must average over the possible priors or, more strongly, realize that the *only* non-arbitrary prior is one that does not depend on which brain you inhabit.

  The subjectivist replies: "But I *am* Alice. I don't need to choose behind a veil."
  This misses the point. The veil argument demonstrates that the *reason* you hold your prior is merely causal accident (genetics, culture, noise), not logical necessity. If the only reason you hold Prior A rather than Prior B is that you were born in Body A, you have no grounds to claim Prior A is more likely to be true than Prior B, unless Body A has some objective, non-indexical advantage (e.g., it is sober, it has better data).

  Rationality requires that we treat our own cognitive origins as objects in the world, subject to the same scrutiny as anyone else's. To treat your own prior as a "primitive input" is to treat your own brain as a black box that outputs truth by fiat. That is not rationality; it is faith.

  ### 3. Priors Are Not Primitive; They Are Compressed Updates
  The subjectivist claims priors are "freely chosen inputs." This is empirically false. Humans do not choose their priors. We inherit them. They are the product of evolutionary conditioning, cultural osmosis, and early childhood exposure.

  Therefore, a "prior" is not an axiom; it is a **compressed summary of past updates** that the agent cannot fully recall or articulate. When I say "I have a prior that strangers are generally trustworthy," I am not stating a primitive truth. I am summarizing a lifetime of unexamined Bayesian updates on social interactions.

  If priors are actually unexamined updates, then they *are* subject to rationality constraints. If your "prior" differs from mine, it implies our unexamined update histories differed. Rationality demands we bring those histories to light. If we cannot justify the update history that led to the prior (e.g., "I trust strangers because my village was safe"), then the prior is unsupported.

  The subjectivist defense ("it's just my input") is a conversation-stopper that protects unexamined cognitive history from scrutiny. Ideally rational agents would not have opaque priors; they would have transparent update histories that converge on the same starting point given the same evidence.

  ### 4. What Counts as a Legitimate "Origin Dispute"?
  Hanson allows for differing priors if there is an "origin dispute"—a reason to think one belief-forming process is more reliable than the other. However, to avoid circularity, this reason must itself be acceptable under a Common Prior.

  **Illegitimate Origin Disputes (Indexical/Subjective):**
  *   "I trust my intuition more than yours." (Why? Because it's mine.)
  *   "I feel more certain." (Certainty is a feeling, not a truth-tracking metric.)
  *   "I was raised to believe this." (This admits the prior is cultural accident.)

  **Legitimate Origin Disputes (Objective/Shared):**
  *   **Cognitive Impairment:** "I am sober; you are intoxicated." We share a prior that alcohol degrades cognitive processing. This is a factual claim about the machinery, not the output.
  *   **Information Asymmetry regarding Origins:** "I know that you were subjected to coercive brainwashing on this topic, and I was not." This relies on a shared theory of how brainwashing distorts belief.
  *   **Computational Verification:** "I have checked the proof three times; you have not." This appeals to a shared standard of logic.

  The crucial constraint is that the reason for privileging one origin over another must be **non-indexical**. You cannot say "My origin is better because it is *my* origin." You must say "My origin is better because it possesses property X," where property X is something you would acknowledge as superior even if *I* possessed it and *you* did not.

  If you cannot point to a specific, shared-defect in my belief-forming process (drunkenness, bias, lack of data) that explains our divergence, then you are required to assume our processes are equally reliable. If they are equally reliable and we disagree, we must split the difference. To do otherwise is to claim your cognitive machinery is magically more truth-apt than mine without evidence.

  ### 5. The Implications for Everyday Disagreement
  Does this leave room for the "everyday disagreement among careful, well-informed people" that your friend values? **No. It renders that disagreement epistemically suspicious.**

  Under the Common Prior Assumption, persistent disagreement between honest, informed agents is not a pluralistic feature of the human condition; it is a bug. It is evidence that at least one party is failing to update correctly, or that one party is harboring an unexamined "origin" bias they refuse to interrogate.

  This does not mean agreement is always *possible* immediately. Computational limits exist. We may not have the bandwidth to swap our entire "update histories" to find where our priors diverged. However, the *attitude* toward disagreement must change:
  1.  **Disagreement is Evidence of Error:** It is not a stable equilibrium. It is a signal that calibration is off.
  2.  **The Burden of Proof is on the Divergence:** You cannot rest at "I have my prior, you have yours." You must actively investigate *why* our priors differ. Is it a difference in data? A difference in processing? Or a difference in unexamined cultural conditioning?
  3.  **Polite Disagreement is Vice:** The rationalist norm of "agreeing to disagree" is, under this framework, a form of intellectual cowardice. It is an agreement to ignore the likelihood that one of you is mistaken.

  ### Conclusion
  Your friend argues that priors are primitive to preserve the autonomy of the agent. I argue that priors must be common to preserve the objectivity of truth.

  If you accept that beliefs are meant to track reality, and that your physical brain is just one among many reality-tracking devices generated by causal processes, you cannot privilege your own device's output without a non-indexical reason. To do so is to claim that the universe arranged itself such that *your* specific causal history is uniquely aligned with truth, simply because it is yours.

  Therefore, ideally rational agents are required to share a prior. Any deviation is a claim of superior origin, which demands objective justification. In the absence of such justification—which is the case for almost all everyday disagreements between "careful" people—the rational requirement is to converge. The fact that we do not is not a vindication of subjectivism; it is a measure of how far we fall short of ideal rationality.
