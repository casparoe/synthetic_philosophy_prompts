      *   **Tone:** Philosophical, rigorous, persuasive, aligned with the rationalist blogosphere style (analytic, precise).

  2.  **Deconstruct the Subjectivist Objection:**
      *   *Claim:* Priors are like utility functions; you can't say someone is irrational for preferring chocolate over vanilla, so you can't say they are irrational for having Prior A over Prior B.
      *   *Counter-Intuition:* Beliefs aim at *truth*, preferences aim at *satisfaction*. Truth is objective (mostly); satisfaction is subjective. Therefore, beliefs should converge on reality, preferences need not.
      *   *Hanson's Angle:* Indexical bias. Why is *my* brain's output privileged over *yours* before I know I'm me?

  3.  **Develop the Argument for the Common Prior Assumption (CPA):**
      *   *Premise 1: The Aim of Belief.* Belief is a map of the territory. If two maps of the same territory differ, at least one is inaccurate. Rationality is the art of map-making.
      *   *Premise 2: The Veil of Ignorance (Pre-rationality).* If I don't know which physical brain I inhabit, I should assign probabilities based on the structure of the world, not the accidental location of my consciousness.
      *   *Premise 3: The Causal Origin of Priors.* Priors aren't magic. They come from genetics, culture, and random noise. None of these are truth-tracking mechanisms *by default* without a shared underlying logic.
      *   *Conclusion:* Therefore, differing priors imply a failure to account for the causal origin of beliefs, which is an irrationality.

  4.  **Addressing the "Primitive Input" Objection:**
      *   Subjectivists say priors are axiomatic. I need to argue they are *derived* (even if implicitly) from deeper assumptions about the world.
      *   Analogy: Scientific instruments. If two thermometers read differently, we don't say "they just have different temperature priors." We check calibration. Human brains are thermometers for truth.
      *   The "Freedom" of Priors is an illusion. We feel free to choose priors, but we are actually constrained by the requirement that our beliefs track reality.

  5.  **Defining "Origin Disputes":**
      *   Hanson says you can differ if you have a reason to trust your origin more than the other's.
      *   *Legitimate:* "I have evidence you are intoxicated," "I know you were subjected to propaganda," "I have calculated the logic and you haven't."
      *   *Illegitimate:* "I feel it in my gut," "This is my intuition," "I was born this way."
      *   *Key Distinction:* Is the reason for trusting the origin *shared* and *objective*? If I trust my brain because it's sober, you should agree your brain is drunk. If I trust my brain because it's *mine*, that's indexical bias.

  6.  **Addressing Everyday Disagreement:**
      *   Does this eliminate all disagreement? No.
      *   It makes disagreement *evidence of error* somewhere in the chain (processing, information, or origin).
      *   It imposes a duty to investigate the origin of the disagreement.
      *   "Careful, well-informed" people might still disagree if they haven't fully exchanged "origin stories" or if the computational complexity prevents full updating. But it remains *suspicious*.

  7.  **Drafting the Argument (Iterative refinement):**

      *   *Introduction:* Acknowledge the subjectivist position but frame it as a category error regarding the nature of belief.
      *   *Section 1: The Truth-Tracking Imperative.* Contrast belief with desire. Desires create the world (in a sense of action); beliefs map it. Divergent maps imply error.
      *   *Section 2: The Pre-rational Veil.* Expand on Hanson's indexical argument. If priors are generated by causal processes (evolution, culture), why privilege *this* process?
      *   *Section 3: Answering the Subjectivist.* The "primitive input" defense fails because priors are not truly choice-independent. They are the result of unexamined updates. To call them primitive is to stop inquiry too soon.
      *   *Section 4: Legitimate Origin Disputes.* Define the criteria. Must be non-indexical. Example: Cognitive impairment vs. "my intuition."
      *   *Section 5: Implications for Disagreement.* Yes, it makes disagreement suspicious. It turns disagreement into a puzzle to be solved, not a state to be maintained.
      *   *Conclusion:* Reiterate that rationality is universal, not personal.

  8.  **Refining the Tone:**
      *   Avoid wishy-washy "on the one hand."
      *   Use terms like "indexical bias," "truth-apt," "causal genealogy."
      *   Ensure the distinction between Savage's subjective probability (coherence) and Hanson's objective probability (calibration/truth) is clear.

  9.  **Self-Correction/Check during drafting:**
