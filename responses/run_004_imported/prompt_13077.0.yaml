      *   **Task:** Argue *for* Hanson's side (Common Prior Requirement) seriously and to a conclusion. Do not just survey; take a stance.
      *   **Specific Requirements:**
          *   Engage directly with the subjectivist objection (priors as primitive).
          *   Define what counts as a legitimate "origin dispute."
