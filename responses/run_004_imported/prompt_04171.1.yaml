      *   **Section 1: The Case for Irrelevance (Truth is Truth).** Why we instinctively feel the accusation should stand. The logical fallacy of *tu quoque*.
      *   **Section 2: The Case for Lost Standing (The Normative Argument).** Why hypocrisy isn't just a personal flaw but corrupts the *transaction* of blame. Equality, fairness, and the function of blame.
