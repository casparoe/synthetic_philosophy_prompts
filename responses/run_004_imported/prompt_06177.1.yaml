      *   **Task:** Grade a student's final exam answer on Hume's "Of Miracles" (Section X of the *Enquiry Concerning Human Understanding*).
      *   **Context:** The TA has personal experience with a potential "miracle" (grandmother's remission), making them sensitive to the nuances of Hume's argument beyond the "miracles are impossible" caricature.
      *   **Input:** Exam question and Student's Answer.
