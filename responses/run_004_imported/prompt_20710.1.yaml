  *(Self-Correction on the "Holding Fixed" point)*: I need to be precise. In Woodward's framework, to test if $C_1$ causes $E$, we intervene on $C_1$. Do we hold $C_2$ fixed? If $C_2$ is a separate cause, yes. But in preemption, $C_2$ is a *potential* cause. In the actual world, $C_2$ happened but didn't cause $E$. In the interventionist model, we represent the *process*. If we hold the *process* of $C_2$ fixed at the point where it was preempted, then $E$ depends on $C_1$. Lewis's possible worlds semantics forces the "closest world" where $C_1$ is absent to be one where $C_2$ succeeds (because $C_2$ was ready). Woodward's intervention forces $C_2$'s process to stay as it was. This is the divergence.

