answer: |-
  In the village of Saltwick, the sea was a gambler, but the villagers never bet alone. For generations, they had lived by the Law of the Common Bin. Every evening, regardless of how full their nets were, every boat dumped its catch into a central pile. From that pile, every family received an equal share. Some nights, a captain hauled in nothing but kelp and slept easy knowing his children would eat. Other nights, a captain brought in a king's ransom of cod and smiled knowing his neighbor wouldn't starve. The risk was real, but the fear was shared.

  Then the merchant arrived with the Depth-Glasses. For a modest fee, each captain could look through the brass tube before hauling their nets and see exactly what lay beneath the water. It was a miracle of clarity. No more wasted effort hauling empty nets; no more surprise storms ruining the catch unseen. The villagers rejoiced, feeling smarter, sharper, more in control. They believed knowledge was purely a gift, a way to maximize their own hauls.

  But on the first evening of the Great Glass, the Common Bin remained empty.

  The captains who looked through their tubes and saw rich schools of fish had quietly steered their boats to the private markets on the mainland, where prices were higher now that they knew their goods were prime. Why share with the unlucky when luck was no longer a mystery? Meanwhile, the captains who saw only empty water returned to the village square, expecting the usual safety net. They found the bin bare and the doors of the successful captains locked tight. The information hadn't changed the fish in the sea, but it had changed the hearts of the men. By removing the uncertainty that bound them together, the gift had dissolved the very insurance that had kept them alive. They stood in the dark, knowing exactly why they were hungry, which was a colder comfort than ignorance ever was.
