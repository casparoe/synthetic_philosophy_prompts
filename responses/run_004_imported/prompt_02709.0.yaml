prompt: |-
  So for my market microstructure class we just covered the Milgrom-Stokey no-trade theorem, and it kicked off an argument in my study group that i honestly can't resolve myself. Our friend Alex day-trades stocks on the side and loves bragging in the group chat whenever a pick works out. (1) Nina said the theorem basically proves Alex is kidding himself: if he thinks a stock's mispriced and a rational person is willing to take the other side at that price, he should revise his confidence down, not up, so he shouldn't expect to profit from picking stocks on average. (2) Sam said that can't be right, since trillions of dollars change hands everyday, and if trade between rational people were actually irrational the market would basically seize up. (3) Nina said most of that volume is index funds rebalancing, pensions needing cash, and hedging -- not mispricing bets like Alex's -- so the theorem's target is narrower than Sam thinks, but it still nails Alex specifically. (4) Sam said on a public exchange Alex has no way of knowing if he's trading against a hedge fund or a forced seller, so Nina can't just assume his trades are the 'both sides are pure speculators' case the theorem actually needs. (5) Nina shot back that this cuts both ways: if Alex can't tell who's on the other side, he's got no grounds for assuming he's the one with the edge either, so 'maybe I'm trading against dumb money' is just wishful thinking with extra steps.

  Can you go through this move by move, say who's got the better of it at each numbered point, and point out anything both of them seem to be missing about what the theorem actually implies for someone like Alex?
