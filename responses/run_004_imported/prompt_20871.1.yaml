  8.  **Final Polish:** Ensure the tone is appropriate for a graduate seminar instructor (scholarly, precise, argumentative). Make sure the distinction between Hart's *substantive* minimum content and Fuller's *procedural* inner morality is sharp, as that is the crux of the user's insight. (Self-Correction: Make sure not to imply Hart thinks *any* content works; he thinks specific survival rules are necessary. But in the hypothetical, those are present. Fuller's objection is procedural.)

