          *   *Logic:* If humans want to survive (a contingent but universal goal), and these facts hold, then certain rules (restricting violence, property, promises) are *necessary*.
          *   *Conclusion:* Any legal system that lasts *must* contain these substantive rules. It's a "natural necessity," not a moral one. It explains *why* law looks similar across societies, not why it *ought* to be moral.
      *   **Fuller (IML):**
          *   *Premises:* Functional/Purposive. Law is the "enterprise of subjecting human conduct to the governance of rules."
          *   *Logic:* To achieve this purpose, the rule-maker must follow certain procedural principles (generality, promulgation, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy, congruence). Failure isn't just bad law; it's a failure to make law *at all*.
          *   *Conclusion:* There is an internal morality to law. Violating these principles defeats the purpose of law. It's a morality of *aspiration* and *duty* rooted in the nature of the activity itself.

  3.  **Deconstruct Task 2: Fuller and *Lex Injusta Non Est Lex*:**
      *   *Common View:* Fuller says bad law isn't law.
      *   *Nuanced View:* Fuller distinguishes between "substantive" natural law (ends) and "procedural" natural law (means). He is wary of the classical Thomistic claim regarding *substantive* injustice.
      *   *Fuller's Position:* He argues that total failure of the inner morality results in something that isn't a *legal system*. It's not just "unjust law"; it's "not law." However, he admits degrees. A partial failure is bad law; total failure is no law.
      *   *Verdict:* It is a *modified* natural law thesis. He resists the classical substantive claim but insists on a procedural threshold. So, it's not a misreading that he thinks defective enactment fails to be law, *but* the defect must be in the *inner morality* (procedure), not necessarily the *outer morality* (substantive justice).

  4.  **Deconstruct Task 3: The Hypothetical (Hart-Satisfied, Fuller-Violated):**
