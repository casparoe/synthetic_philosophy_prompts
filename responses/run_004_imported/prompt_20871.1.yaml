      *   *Fuller's View:* This is *not* a legal system. It is a managerial direction system or brute force. You cannot guide conduct by secret, retroactive rules. It fails the definition of law.
      *   *Do they disagree?* Yes. Hart calls it "law" (perhaps iniquitous law). Fuller calls it "not law" (failed enterprise).
      *   *Is it just semantics?* No, because the definition of "law" carries normative weight. For Fuller, calling it law grants it a dignity it hasn't earned. For Hart, calling it law allows us to criticize it clearly as "law that is too evil to be obeyed."

  5.  **Deconstruct Task 4: The Definite Answer (Rivals, Compatible, Orthogonal?):**
