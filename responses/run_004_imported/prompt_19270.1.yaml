      *   *Re-evaluating the "Never Deals With" Claim:* Ghazali's theory of *kasb* is notoriously difficult, and many philosophers argue it *fails* to solve the problem. Saying he "never really deals with it" is an exaggeration, but saying the problem "collapses" is a standard objection. I'll mark this as "Shaky" but not deduct full points if the critical thinking is sound. However, accuracy matters.

      *   *Draft Scoring:*
