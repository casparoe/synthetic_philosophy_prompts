      *   *The Stakes:* If geometry fails, his entire system of "Civil Science" and political certainty collapses. If reason cannot hold fast in the realm of quantity, how can it hold fast in the realm of justice and sovereignty? The circle isn't just a shape; it's the foundation of order.

  3.  **Setting the Scene:**
      *   Chatsworth House (where he lived with the Cavendishes in his later years).
