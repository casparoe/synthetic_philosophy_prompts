      *   Hobbes was precise, somewhat acerbic, deeply rationalistic. The prose should be clear, structured, but tinged with the desperation of aging.
      *   Avoid modern anachronisms in his thought (he can't know about transcendental numbers).
      *   Focus on the *generation* of magnitudes. Motion creates lines, lines create figures.

  6.  **Writing - Iteration 1 (Mental Outline):**
