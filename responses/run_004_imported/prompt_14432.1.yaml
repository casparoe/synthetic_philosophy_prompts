answer: |-
  The candle had burned low, the tallow pooling like solidified fat around the wick, but Thomas Hobbes did not blink. To blink was to interrupt the motion. In the silence of Chatsworth House, the only sound was the scratch of his quill, a rhythmic friction against the paper that mimicked the very generation of a line.

  He was ninety years old. His hands, once steady enough to calibrate the finest lenses, now trembled with a palsy that he refused to acknowledge as anything other than a temporary disturbance in the animal spirits. He dipped the pen. He drew a circle.

  To John Wallis, the Savilian Professor at Oxford, this circle was a problem of algebra. It was a ratio to be approximated, a number to be chased through an infinite series of fractions. Wallis dealt in symbols, in the shadow-play of arithmetic. But to Hobbes, the circle was a birth.

  *We know the cause because we made it.*

  That was the axiom. That was the bedrock upon which the *Leviathan* stood. In natural philosophy—in the study of light, of heat, of the motion of the stars—we are blind men feeling the skin of an elephant. We see the effect: the apple falls, the mercury rises. We guess at the cause. We infer. We speculate. There is no certainty in physics, only probability. There is no *scientia*, only *opinio*.

  But in geometry? In geometry, we are God.

  He pressed the compass point into the paper. That fixed point was the cause. He rotated the arm. The motion generated the line. The return to the origin closed the figure. He had not inferred the circle from its shadow; he had commanded it into existence. Therefore, he knew its properties perfectly. He knew its cause.

  If geometry yielded uncertainty, then reason itself was a broken compass. And if reason could not hold fast in the realm of quantity, how could it hold fast in the realm of justice? If the square and the circle could not be reconciled by the intellect, then the Sovereign and the Subject could not be reconciled by the Law. Chaos would return. The Civil War, that great nightmare of conflicting consciences and bloody uncertainties, would rise from the grave.

  Wallis wrote that he was mistaken. Wallis wrote that the quadrature was impossible.

  Hobbes set down the pen and picked up the straightedge. He aligned it with the diameter.

  "Impossible," he whispered to the empty room. The word tasted of superstition. "There is no impossibility in motion, only in the description of it."

  He believed that Wallis was not merely correcting a mathematical error; he was dismantling the architecture of certainty. Wallis represented the new philosophy, the experimentalists of the Royal Society, men who put their faith in telescopes and microscopes and messy induction. They were content to live in a world of 'likely stories.' Hobbes was not. He demanded a world where consequences followed causes as night follows day, where the deduction was ironclad.

  He began to construct the square.

  His mind raced through the propositions of *De Corpore*. He visualized the rotation of the plane, the intersection of the arcs. He saw the solution clearly, a luminous structure in the dark theater of his mind. It was there. It had to be there. The clarity of the idea was proof of its truth. Descartes had said that what is clearly and distinctly perceived is true. Hobbes went further: what is *constructed* is true.

  He drew the line. He measured the arc.

  A discrepancy. A hair's breadth.

  His heart hammered against his ribs, a frantic bird in a cage of bone. Was it the paper? The expansion of the fiber in the damp Derbyshire air? Was it the trembling of his hand?

  It could not be the logic. The logic was pure. The logic was motion.

  He took a fresh sheet. He began again.

  *Generate the line. Generate the figure. Know the cause.*

  He thought of his enemies. They laughed. They called him "Old Square-Circle." They treated his life's work as the dotage of a stubborn old man. They did not understand. They thought he was fighting for a geometric theorem. He was fighting for the possibility of truth.

  If he conceded to Wallis, he conceded that there are limits to what reason can grasp of its own creations. If reason cannot comprehend the figure it has drawn, how can it comprehend the Commonwealth it has built? The Social Contract was a geometric construct. Men, by covenant, generate the State. We know the State because we made it. We are the cause of the Sovereign's power.

  If the geometry failed, the Covenant was a fiction. If the Covenant was a fiction, obligation was a sham.

  He drew the diagonal. He checked the ratio.

  The discrepancy remained.

  A cold sweat prickled on his brow. For a fleeting second, the abyss opened. What if the fault was not in the paper, nor in the hand, nor in the air? What if the fault was in the premise? What if the circle, though generated by man, held a secret depth that generation could not plumb? What if nature, even in its abstracted form, refused to be fully known?

  He looked at the candle. The flame flickered, casting long, dancing shadows against the bookshelves. Shadows of effects, hiding their causes.

  "No," he said aloud. His voice was thin, brittle as parchment.

  He reached for the ink. He would not erase the error. He would annotate it. He would explain it. The error was in the *representation*, not in the *demonstration*. The physical line is always imperfect; the mental line is perfect. Wallis confused the two. Wallis measured the ink; Hobbes measured the motion.

  He began to write his rebuttal. *The Markup of the Circle.* He would publish it. He would force them to see. Not out of vanity, but out of duty. Someone had to hold the line. Someone had to insist that the world is intelligible, that causes are knowable, that certainty is not a dream of the ancients but a right of the rational mind.

  His hand shook violently as he formed the letters. The ink blotched.

  He paused. He looked at the circle he had drawn. It was imperfect. It was a wobbly ring of carbon on rag paper. But the *idea* of it was flawless. He had made it. He knew it.

  He would die before he admitted that the making did not guarantee the knowing.

  Thomas Hobbes dipped the pen one last time. Outside, the wind howled through the Chatsworth woods, a natural sound with a hidden cause, indifferent and wild. Inside, by the light of the dying candle, the old man squared his shoulders against the dark. He drew the line again. He would not stop until the reason held. He would not stop until the world was safe for certainty.

  He wrote, *Q.E.D.*, though the proof was incomplete. He wrote it because it had to be true. For if it were not, then nothing was. And he could not live in a world where nothing was.

  He blew out the candle. In the darkness, the circle remained, perfect in his mind, impossible on the page, waiting for a dawn he would not see.
