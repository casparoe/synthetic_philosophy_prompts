answer: |-
  This is a sharp set of notes. Transitioning from field biology to philosophy of science often yields this kind of clarity because you've got the "wet work" intuition for how messy data actually is, which protects you from some of the sterilized versions of these debates you find in pure philosophy texts.

  Here is a breakdown of your three main questions: the Lakatosian mapping, the reflexivity/exaptation point, and the historical/architectural fact-checking.

  ### 1. The Lakatosian Mapping: Defensible or Forced?

  **Verdict:** It is defensible and actually aligns with a significant strand of post-1980s philosophy of biology. You are not forcing a square peg.

  *   **The Hard Core:** Your identification of the hard cores ("selection mainly shapes form" vs. "internal constraint/history mainly shapes form") is accurate to how Lakatosian analysis is typically applied here. Elisabeth Lloyd (e.g., *Structure and Confirmation of Evolutionary Theory*) and others have analyzed adaptationism not as a testable hypothesis but as a research strategy or framework.
  *   **The Protective Belt:** You are right that G&L's alternatives (allometry, constraint, Baupläne) function as a protective belt. When an adaptationist story fails, they tweak the fitness function or trade-off assumption. When a structuralist story fails, they tweak the developmental parameter or historical boundary condition.
  *   **Progressive vs. Degenerating:** This is where your argument gains the most traction. Lakatos insists we judge programmes by their ability to predict *novel* facts.
      *   *Adaptationism:* As you noted, optimality models (foraging, sex ratios) have generated successful novel predictions.
      *   *Structuralism:* Evo-devo (which inherited the structuralist mantle) has also been progressive (e.g., predicting deep homology in genetic toolkits).
      *   *The Critique:* By framing *Spandrels* as a Popperian "gotcha" (you aren't falsifying!), G&L obscure the fact that they are proposing a rival *Lakatosian* programme. If you treat it as a methodological critique alone, they win. If you treat it as a competition between research programmes, it's a draw (or depends on which sub-field you're in).

  **Potential Pushback:** A Lakatos purist might argue that "Structuralism" isn't unified enough to be a single Research Programme in the 1970s. It was more of a disparate set of critiques. However, for the purposes of a reading group, your characterization is robust enough.

  ### 2. The Reflexivity Point (Exaptation)

  **Verdict:** The point is strong, but not entirely novel. However, your specific framing of it as a *taxonomic bookkeeping* problem is a nice sharpening of existing critiques.

  *   **Who dealt with this?**
      *   **Daniel Dennett:** In *Darwin's Dangerous Idea* (1995), Dennett attacks the *Spandrels* paper fiercely. He argues that the distinction between "adaptation" and "exaptation" is often a matter of temporal resolution. Given enough time, almost any byproduct becomes a substrate for selection. He accuses G&L of wanting to have it both ways: demanding rigorous proof for adaptation while allowing structuralist explanations a "free pass" on historical reconstruction.
      *   **Elliott Sober:** Sober (*The Nature of Selection*, 1984; *Reconstructing the Past*, 1988) focuses heavily on the difficulty of testing historical claims. He distinguishes between "current utility" and "history of selection." He would agree with you that determining the *origin* of a trait (was it a spandrel or an adaptation?) is often underdetermined by the evidence.
      *   **Pinker & Bloom:** In their 1990 paper on language, they explicitly tackle the "exaptation" escape hatch, arguing that simply labeling something an exaptation doesn't explain *how* it got complex without selection.

  *   **Your Novel Angle:** Most critics say "exaptation is just an adaptation in disguise." Your point is more specific: *The act of classifying a trait as a spandrel vs. an exaptation requires the same retrospective storytelling G&L accused adaptationists of.*
      *   To prove something is a **Spandrel**: You must prove it had no fitness value at origin (hard to falsify).
      *   To prove something is an **Exaptation**: You must prove it had no fitness value at origin, *but* acquired it later (also hard to falsify).
      *   To prove something is an **Adaptation**: You must prove it had fitness value at origin (hard to falsify).
      *   *Conclusion:* The epistemic burden is identical across all three. Calling out the adaptationists for "just-so stories" while retaining a taxonomy that relies on reconstructing unobservable historical fitness landscapes is indeed reflexively self-undermining. This is a great point for a reading group.

  *   **Definition Check:** You wrote: *"exaptation... to seperate byproduct-features that stay useless (true spandrels) from byproduct-features that get co-opted."*
      *   *Correction:* Gould & Vrba (1982) defined exaptation slightly more broadly. It includes:
          1.  Traits evolved for Function A, co-opted for Function B (e.g., feathers for insulation -> flight).
          2.  Traits that arose as non-adaptive byproducts (spandrels), co-opted for Function B.
      *   Your definition focuses on category 2, which is fine for your argument, but be aware that exaptation also covers functional shifts in existing adaptations. This actually *strengthens* your reflexivity point: if exaptation covers both, the evidentiary bar for distinguishing them is even messier.

  ### 3. Historical and Architectural Fact-Check

  *   **Dates:**
      *   *Spandrels Paper:* Gould & Lewontin, 1979 (*Proc. R. Soc. B*).
      *   *Exaptation Paper:* Gould & Vrba, 1982 (*Paleobiology*).
      *   *Your Note:* "Three years after." **Correct.**

  *   **Architecture (The Irony):**
      *   *Your Hunch:* You are remembering correctly. This is a famous "gotcha" in the literature.
      *   *The Detail:* The triangular spaces between the arches in St. Mark's Basilica are technically **pendentives** (which support the dome), not **spandrels** (which are the spaces between adjacent arches).
      *   *The Source:* This was pointed out by architectural historians shortly after the paper was published. G&L used "spandrel" as a catch-all term for "architectural byproduct."
      *   *Is it worth mentioning?* Yes, but briefly. It underscores your point about "storytelling." G&L constructed a metaphor based on a slight misunderstanding of the architecture, then built a philosophical critique on that metaphor. It fits your theme of "auxiliary assumptions adjusted case by case."

  ### Summary Advice for the Reading Group

  1.  **Don't worry about the Lakatos fit:** It's solid. Just acknowledge that Lakatos himself has critics (e.g., Feyerabend, Kuhnians), so you are using a contested tool to analyze a contested paper. That's philosophy.
  2.  **Sharpen the Reflexivity:** Explicitly frame the "Spandrel vs. Exaptation vs. Adaptation" trichotomy as three hypotheses that share the *same* falsification problem (reconstructing past selection pressures). If the adaptationist is guilty of storytelling, the structuralist is guilty of the same when invoking "constraint" without independent evidence of the developmental mechanism.
  3.  **Fairness Check:** Are you being unfair to G&L? Slightly. G&L *did* advocate for the comparative method and phylogenetic testing as ways to ground these claims. They weren't saying "never test," they were saying "adaptationists aren't testing." Your counter is that *their* preferred explanations often weren't tested either. That's a fair charge, but acknowledge that later Evo-Devo work (the heir to Structuralism) did ramp up the testing.
  4.  **The "Sober" Question:** Acknowledge Sober. You can say: "Sober formalized the testing problem, but the Lakatosian view explains why the *debate* persisted despite the problem being known." That positions your notes as adding a sociological/methodological layer to Sober's logical layer.

  **Bottom Line:** Your central move works. The reflexivity point is your strongest card. The history is mostly right (watch the exaptation definition breadth). Go ahead and inflict it on them.
