      *   *Setting:* A spinning habitat in the Local Group (maybe Andromeda-Milky Way merger remnant, call it "Milkdromeda" or just "The Merge"). Let's go with a specific apparatus: The Two Globes. It's cleaner than water (no evaporation issues in a story) and directly references Newton's second thought experiment.
      *   *Apparatus:* Two masses connected by a tension cable. A "tension gauge" is the key indicator.

  4.  **Plot Outline:**
      *   **Beginning:** Elara is in the observation deck. The sky is dark. She initiates the experiment (the two globes).
      *   **Middle:** She watches the gauge. She reflects on the history (Newton, Mach). She considers the implications of the empty universe.
      *   **Climax:** The reading stabilizes. She interprets the data.
