      *   *Leibniz/Mach:* Space is relational. Rotation is only meaningful relative to other mass (the "fixed stars"). If the stars vanish, inertia vanishes. The water stays flat; the cord goes slack.
      *   *The Setting:* The "Cosmic Island" era. The rest of the universe is causally disconnected. It's the perfect test bed for Mach's objection to Newton.

  3.  **Character and Setting Development:**
