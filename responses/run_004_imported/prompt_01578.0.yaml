      *   **Key Element:** A character interacting with a rotating apparatus (bucket, station, globes, etc.) to test the nature of space/inertia in this isolated environment.
      *   **Constraint:** The character must reason through the problem via observation and thought, not exposition. The ending must be a considered position, acknowledging the ambiguity (since physics hasn't settled it).
