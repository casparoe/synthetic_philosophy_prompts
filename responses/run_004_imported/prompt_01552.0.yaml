answer: |-
  This is a compelling problem for any decision theory framework, particularly those dealing with acausal interaction (such as Timeless Decision Theory or Updateless Decision Theory). The "surrogate goal" defense relies on the intuition that an agent can decouple *defensive intensity* from *intrinsic value*. The hope is to create a decoy that triggers a "fight to the death" response without actually costing the agent anything if the decoy is destroyed.

  However, when we subject this strategy to rigorous analysis against a threatener sophisticated enough to engage in acausal blackmail, the strategy collapses. The failure is not merely practical; it is structural. A threatener capable of acausal blackmail possesses the epistemic access required to distinguish between a load-bearing value and a manufactured commitment. Consequently, the surrogate goal strategy either fails to redirect the threat or successfully transforms the surrogate into a second, genuine vulnerability.

  Here is the argument for why the surrogate goal defense cannot work in principle against a sophisticated adversary.

  ### 1. The Transparency of the Decision Algorithm
  In scenarios of acausal blackmail, the threatener does not merely observe the agent's past behavior; they simulate or logically derive the agent's decision algorithm. The threatener's leverage comes from knowing *why* the agent makes decisions, not just *what* decisions they make.

  A "surrogate goal" requires a specific architectural modification: the agent must program itself to expend resources $R$ to defend Goal $S$ (Surrogate) such that $Cost(R) > Value(S)$, while simultaneously maintaining $Value(S) \ll Value(G)$ (where $G$ is the Real Goal).

  To a sophisticated threatener inspecting the agent's source code (or logical structure), this looks like an inconsistency. The threatener can see that the utility function assigns low weight to $S$, but the decision procedure assigns high defensive priority to $S$. In a rational agent, defensive priority is derived from utility weight. If they diverge, the threatener identifies the defensive priority as a "hard constraint" or a "bluff."

  If it is a hard constraint (a true precommitment), then the agent *actually* values $S$ highly in terms of decision-weight. If it is a bluff, the simulation reveals that in a crunch scenario where resources are insufficient to defend both $S$ and $G$, the agent will prioritize $G$. A sophisticated threatener runs the simulation where both are threatened. If the agent sacrifices $S$ to save $G$, the threatener knows the surrogate is not a safe target for the agent, but more importantly, they know the agent *will not* actually fight for $S$ if it compromises $G$. Thus, the threatener ignores the surrogate and targets $G$, knowing the agent's "fierce defense" of $S$ is conditional and will crumble under pressure.

  ### 2. The Impossibility of "Cheap" Intensity
  The core promise of the surrogate goal is that it is "cheap." It is supposed to be a low-stakes value that the agent defends fiercely. But in decision theory, "value" is defined by what an agent is willing to sacrifice.

  If the agent successfully commits to defending $S$ as fiercely as $G$, then $S$ is no longer cheap. The "cost" of a goal is not its intrinsic content (e.g., "collecting paperclips" vs. "preserving human life"), but the opportunity cost of defending it. If the agent burns significant resources to defend $S$ from acausal threats, those resources are unavailable for $G$.

  A sophisticated threatener recognizes this resource competition. If the agent has proven they will spend \$1 million to defend $S$, then $S$ has an instrumental value of at least \$1 million to the agent. The threatener can now simply threaten $S$ to drain the agent's resources, weakening their defense of $G$. Alternatively, the threatener can threaten both. Since the agent has committed to defending both fiercely, the agent's expected utility drops significantly. The surrogate has not redirected the threat; it has expanded the attack surface. The "cheapness" of the surrogate is an illusion maintained only so long as no one actually attacks it. Once the threat is credible, the surrogate becomes a second load-bearing pillar of the agent's utility.

  ### 3. The Correlation Problem in Acausal Contexts
  Acausal blackmail relies on logical correlation. The threatener says, "I will simulate you; if the simulation shows you paying, I won't destroy your value; if not, I will." The blackmail works because the threatener's action is correlated with the agent's decision procedure.

  For the surrogate goal to work, the agent needs the threatener to correlate "Attacking Surrogate" with "Agent Fights Back" but *not* correlate "Attacking Real Goal" with "Agent Fights Back" (or rather, to make the former more costly for the threatener).

  However, a sophisticated threatener models the *reason* for the defense. They see that the defense of $G$ is driven by intrinsic utility, while the defense of $S$ is driven by a strategic rule. In acausal reasoning, logical dependencies matter. If the strategic rule protecting $S$ is logically distinct from the utility function protecting $G$, the threatener may determine that breaking the rule (destroying $S$) does not trigger the same logical consequences as breaking the utility function (destroying $G$).

  Conversely, if the agent binds them tightly enough that the threatener *cannot* distinguish the logical dependency (i.e., "Defend $S$" is logically equivalent to "Defend $G$"), then the threatener treats them as the same target. In this case, threatening $S$ is functionally identical to threatening $G$. The agent has not created a decoy; they have created a duplicate of their own vulnerability.

  ### 4. The Credibility of the "Burn the Ships" Commitment
  Proponents might argue that the agent can make the commitment credible by modifying its own utility function permanently—essentially lying to itself so that it truly values $S$ as much as $G$.

  This leads to the second horn of the dilemma: **The Surrogate Becomes Real.**
  If the agent successfully rewrites its utility function to value $S$ intrinsically, then $S$ is no longer a surrogate. It is a real goal. The threatener, inspecting the modified utility function, sees two high-value targets. The agent has not protected its original values; it has merely diluted them. The agent is now vulnerable to blackmail on two fronts. If the threatener demands a concession in exchange for sparing $S$, the agent must pay, because it now truly values $S$. The agent has successfully made the threat credible, but in doing so, it has made the cost of the threat real.

  If the agent does *not* rewrite its utility function, but merely adds a heuristic rule, we return to Problem 1: the sophisticated threatener sees the heuristic is subordinate to the utility function and will be overridden in a resource conflict. The commitment is not credible.

  ### Conclusion
  The surrogate goal strategy attempts to exploit a gap between *declared defensive policy* and *actual value hierarchy*. It assumes an agent can convincingly signal "I will fight for X as hard as Y" without actually valuing X as much as Y.

  Against a threatener sophisticated enough to engage in acausal blackmail, this gap does not exist. Such a threatener has access to the agent's decision logic and can simulate resource conflicts. They will see that a "cheap" goal defended fiercely is a contradiction in terms: if it is defended fiercely, it consumes resources, making it expensive; if it is truly cheap, the defense will be abandoned when resources are tight.

  Therefore, the strategy fails in principle. Either the threatener sees through the manufactured commitment and targets the real values anyway (failure to redirect), or the commitment is successful, in which case the surrogate goal acquires genuine instrumental weight and becomes a second viable target for exploitation (expansion of vulnerability). You cannot hide your values behind a shield that costs as much to hold as the values themselves.
