answer: |-
  This is a fantastic question. You have correctly identified a major hole in the pop-philosophy critique of conspiracy theories. If you judge them solely by the logical structure of "adding an auxiliary hypothesis to save the core theory," then the JFK truther and Urbain Le Verrier (the astronomer who found Neptune) are doing the exact same thing.

  Your sister-in-law pointed you in the right direction with Lakatos, but to get the full mechanism, we need to combine Imre Lakatos's methodology of scientific research programmes with a specific epistemic criterion regarding **independent evidence** and **risk**.

  Here is the principled, non-question-begging difference between the "Neptune move" (warranted) and the "JFK move" (unwarranted), without relying on the fact that one turned out to be true.

  ### 1. The Logical Structure is Identical (You are right)
  You are correct that the Duhem-Quine thesis applies to everyone. No hypothesis is tested in isolation; it is always tested as a bundle: *Core Theory + Auxiliary Assumptions + Initial Conditions.*

  *   **Newtonian Astronomer:** Newton's Laws + *There is a planet at coordinates X* + Telescope is working.
  *   **JFK Researcher:** Oswald acted alone + *The Warren Commission was coerced* + Documents are authentic.

  When the prediction fails (Uranus is in the wrong spot / The Commission says Oswald acted alone), you can logically save the Core Theory by modifying the Auxiliary Assumption (Add Neptune / Add Coercion). Logically, these moves are isomorphic. If "self-sealing" were the only criterion, Newtonian physics would have been dismissed as conspiracy-mongering when Mercury's orbit didn't match.

  So, Keeley's "self-sealing" critique (which actually originates more with Karl Popper than Keeley—Keeley famously argues *against* the idea that conspiracy theories are inherently irrational) is necessary but not sufficient. We need to know *when* self-sealing is a heuristic virtue and when it is a vice.

  ### 2. The Lakatosian Distinction: Progressive vs. Degenerating
  This is where your sister-in-law's hint comes in. Imre Lakatos argued that we shouldn't judge a single theory in isolation, but rather look at the **Research Programme** over time. He distinguished between two types of auxiliary hypothesis moves:

  **A. Progressive Problem Shift (The Neptune Move)**
  A research programme is "progressive" when the new auxiliary hypothesis leads to the discovery of **novel facts**.
  *   **The Move:** Le Verrier hypothesized Neptune to save Newton.
  *   **The Test:** This hypothesis didn't just explain Uranus's past orbit (which was already known). It made a *risky, specific prediction* about where to point the telescope *tomorrow*.
  *   **The Result:** It opened up new lines of inquiry. It increased the empirical content of the theory.

  **B. Degenerating Problem Shift (The Vulcan/JFK Move)**
  A programme is "degenerating" when the auxiliary hypotheses are purely **ad hoc**. They explain the anomaly post-hoc but predict nothing new.
  *   **The Move (Vulcan):** Le Verrier hypothesized Vulcan to save Newton regarding Mercury.
  *   **The Test:** Astronomers looked. They didn't find it. So the auxiliary was tweaked: "It's too close to the sun to see except during an eclipse." Then: "It's a cloud of dust, not a planet."
  *   **The Result:** Every time the auxiliary failed, it was patched to explain *only* the failure, without predicting anything new. It was purely defensive.

  **Applying this to your Father-in-Law:**
  Does the "CIA Cover-Up" hypothesis generate novel predictions?
  *   **Science:** "If you look at these coordinates, you will see a planet." (Testable, risky).
  *   **Conspiracy:** "If you look at the documents, you will find... redactions." Or, "If you interview the witness, they will... change their story."

  The conspiracy auxiliary usually predicts the *absence* of evidence (because it was destroyed) or the *presence* of disinformation (because they planted it). This is a degenerating shift. It uses the auxiliary hypothesis to explain why the evidence *isn't there*, rather than to predict where new evidence *will be*.

  ### 3. The "Independent Access" Criterion
  There is a second principled difference regarding the **status of the auxiliary assumption itself.**

  In the Neptune case, the existence of a planet is a claim about the physical world that is, in principle, **independently accessible**. We don't have to trust Newton to verify Neptune; we can look at it. The auxiliary hypothesis (Planet X) has a causal mechanism (gravity) that is consistent with the rest of our knowledge about how planets work.

  In the JFK case, the auxiliary hypothesis (The Cover-Up) relies on a specific claim about **human agency and competence**.
  *   **The Assumption:** To maintain the cover-up for 60 years, hundreds of people must remain silent, no paperwork must leak, and the intelligence apparatus must be flawlessly efficient.
  *   **The Conflict:** This auxiliary hypothesis contradicts a massive body of *other* warranted beliefs we have about bureaucracies. We know from independent evidence (Pentagon Papers, Watergate, Snowden, routine leaks) that the US government is notoriously bad at keeping secrets.

  **The Principled Difference:**
  *   **Science:** The auxiliary hypothesis (Neptune) is consistent with background knowledge (physics of gravity/planets).
  *   **Conspiracy:** The auxiliary hypothesis (Perfect Secrecy) is inconsistent with background knowledge (sociology of bureaucracies).

  Brian Keeley's actual argument in *"Of Conspiracy Theories"* (1999) hinges on this. He argues that a conspiracy theory becomes unwarranted not because it posits a conspiracy (some are real!), but when it requires the conspirators to possess a level of **omnicompetence** that contradicts our other warranted beliefs about the world.

  To believe the JFK cover-up, you must believe the CIA is simultaneously competent enough to kill a president and hide it forever, *but* incompetent enough to leave the clues your father-in-law found on a message board. That internal tension is the epistemic vice.

  ### 4. Bayesian "Cost" of the Hypothesis
  Finally, we can look at this through a Bayesian lens (probability updating).

  Every time you add an auxiliary hypothesis, you increase the **complexity** of your model. In Bayesian terms, you are lowering the *prior probability* of your theory because you are adding conjunctions (Theory A *AND* Assumption B *AND* Assumption C).

  To make this worth the "cost," the new hypothesis must provide a significant increase in **explanatory power**.

  *   **Neptune:** High Cost (new planet) + Massive Payoff (explains Uranus + predicts new object + validates Newton). **Net Positive.**
  *   **Vulcan:** High Cost (new planet) + Low Payoff (explains Mercury only + predicts nothing else + eventually fails). **Net Negative.**
  *   **JFK Cover-Up:** High Cost (hundreds of silent accomplices + flawless operational security) + Low Payoff (explains why the Warren Commission report exists).

  The conspiracy theory is "unwarranted" because the **epistemic cost** of the auxiliary hypothesis (assuming a perfect, decades-long silence among hundreds of people) vastly outweighs the **explanatory gain** (it just explains why the official report says what it says).

  ### Summary for the Dinner Table
  You can tell your father-in-law that you aren't arguing about *facts* (ballistics, grassy knolls), but about **methodology**.

  The difference between a scientist and a conspiracy theorist isn't that one refuses to add auxiliary hypotheses. It's that:
  1.  **Fruitfulness:** The scientist's auxiliary hypothesis predicts *new* things (Neptune); the conspiracy auxiliary only explains *old* things (the Report).
  2.  **Consistency:** The scientist's auxiliary fits with background knowledge (gravity); the conspiracy auxiliary contradicts background knowledge (bureaucracies leak).
  3.  **Risk:** The scientist risks being wrong by telling you where to look; the conspiracy theorist protects themselves from being wrong by saying evidence is hidden.

  If your father-in-law's theory could say, "If you dig at *this* specific coordinate in Dealey Plaza, you will find *this* specific bullet casing that ballistics will match to *this* specific rifle," he would be doing science. If he just says, "The fact that we haven't found it proves they hid it," he is running a degenerating research programme.

  That is the principled difference. It's not about what they believe; it's about whether their method of belief-formation produces new knowledge or just locks the door tighter.
