answer: |-
  Here is a specific, documented phenomenon that cuts deeper than the "chicken/shovel" confabulation trick. It moves beyond simple visual puzzles and into the realm of **goal-directed intermanual conflict**, specifically regarding **emotional memory and intent**.

  ### The Finding: "The Saboteur Hand" (Goal-Directed Intermanual Conflict)

  While the "Alien Hand" is often portrayed as a clumsy, reflexive spasm, documented cases (such as those described by neurologist Joseph Bogen and later Michael Gazzaniga) reveal something far more unsettling: **The left hand (Right Hemisphere) will execute complex, purposeful actions that directly contradict the stated goals of the right hand (Left Hemisphere), not out of spasm, but out of *opposing will*.**

  **The Specific Case:**
  In one documented instance, a split-brain patient was observed getting dressed. His right hand (controlled by the speaking Left Hemisphere) would button his shirt. Immediately after, his left hand (controlled by the silent Right Hemisphere) would reach over and unbutton it. In another case, a patient would pack a suitcase with his right hand, only to have his left hand unpack it item by item.

  This isn't a twitch. It is a **counter-plan**.

  For your novel, take this into the emotional sphere. There are studies where split-brain patients are shown emotionally charged images (like a nude figure or a disturbing accident) exclusively to the Right Hemisphere.
  *   **The Mouth (LH):** Says, "I saw nothing," or "It was just a flash of light."
  *   **The Body (RH):** Shows a Galvanic Skin Response (sweating/pulse spike) indicating fear or arousal.
  *   **The Left Hand (RH):** Will often point to a word card that says "SCARY" or "NAKED," or physically push the image away, while the mouth insists everything is fine.

  ### The Scene Application

  Don't have her hand "shake" or "twitch." Have her hand **act on a memory her mouth claims not to have.**

  **The Setup:** Your protagonist is meeting someone—a detective, a lover, an antagonist. Her Left Hemisphere (the speaker) has no conscious memory of this person or believes they are safe. Her Right Hemisphere (the silent observer) remembers the threat.

  **The Action:**
  She is sitting at a table, verbally agreeing to a plan. "Yes, I trust you," she says.
  Simultaneously, her left hand (resting on the table or holding a glass) does something specific and goal-oriented. It doesn't just tremble. It **locks the door.** It **slides the car keys into her pocket.** Or, more subtly, it **turns a photo frame face-down.**

  When she (her mouth) notices what her hand has done, she doesn't feel like *she* did it. She feels like she is watching a roommate do it. She has to verbally explain it away: "Oh, I must have been nervous," or "I didn't mean to do that."

  ### The Philosophical Bite (Why this breaks the "One Self" model)

  This finding destroys the idea of a "Unified Conscious Subject" because it separates **Agency** from **Narrative.**

  1.  **The Interpreter vs. The Witness:** The Left Hemisphere is the "Interpreter." Its job is to create a coherent story. It will lie to maintain the illusion of unity. It says, "I locked the door because I was cold."
  2.  **The Silent Truth:** The Right Hemisphere is the "Witness." It holds the emotional truth and the motor intent. It locked the door because it knows the person outside is dangerous.
  3.  **The Uncanny Valley of the Self:** If "You" are defined by your intentions, which intention counts? The one spoken (LH) or the one executed (RH)?
      *   If the LH speaks love but the RH prepares violence, **who is the protagonist?**
      *   If the LH claims ignorance but the RH navigates the path, **who is driving?**

  **For your novel:** The horror isn't that there is a "ghost" in her skull. The horror is that the "I" she talks to the world with is a press secretary spinning lies to cover up the decisions being made by the silent partner in the back office. The "One Self" is just a cover story the Left Hemisphere tells to keep the peace.

  **Key Detail for Realism:**
  Make sure the left hand's action is **smooth and purposeful.** If it's jerky, it looks like a seizure. If it's smooth (e.g., calmly turning over the photo, calmly locking the deadbolt), it implies a **second mind** is in control of that limb. That is what makes it truly uncanny.
