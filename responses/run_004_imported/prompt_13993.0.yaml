prompt: |-
  I'm currently taking a graduate seminar on epistemology, and this term we've spent several weeks on the puzzles surrounding misleading higher-order evidence. A stock example that keeps coming up: a competent reasoner is told—truly or falsely—that she has just been given a drug that impairs people's arithmetic while also inflating their confidence in their own calculations, and must then decide what to make of a long-division problem she has just worked through correctly. Sophie Horowitz's paper "Epistemic Akrasia" has become something of a touchstone in our discussions of these cases: she argues that the so-called Enkratic Principle—roughly, that rationality forbids believing P while also believing that one's evidence doesn't support believing P—can never be rationally violated, because any akratic combination of attitudes is, on her diagnosis, guaranteed to be somehow defective no matter how the world turns out, in a way that resembles a dominance argument. A few of my classmates, siding instead with what's sometimes called the "level-splitting" view associated with Adam Elga's unpublished but widely-cited work on the topic, think this proves too much, since it seems to rule out by fiat the kind of self-doubt that looks entirely appropriate whenever one has strong independent reason to distrust one's own reasoning in the moment.

  For my term paper I've been assigned to argue the level-splitting side, and while the position feels intuitively right to me, I keep producing responses that amount to little more than insisting that higher-order evidence can be misleading, which doesn't actually engage Horowitz's argument. Could you construct the strongest available case for the claim that it can be rational to retain a first-order belief that P while simultaneously and rationally believing that one's evidence doesn't support P? I'd like the argument to directly confront the dominance-style reasoning behind the Enkratic Principle rather than sidestepping it, and ideally to say something about why, in cases like the drug example above, remaining akratic might be better calibrated to the reasoner's total evidential situation than revising either the first-order or the higher-order attitude to restore coherence.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the Request:**
      *   **Context:** Graduate seminar on epistemology, specifically misleading higher-order evidence (HOE).
      *   **Core Debate:** Sophie Horowitz's "Epistemic Akrasia" (defending the Enkratic Principle, arguing akrasia is always irrational via a dominance argument) vs. Level-Splitting (associated with Adam Elga, arguing it can be rational to believe $P$ while believing one's evidence doesn't support $P$).
      *   **Task:** Construct the *strongest available case* for the level-splitting side.
      *   **Constraints:**
          *   Must directly confront Horowitz's dominance-style reasoning (not just insist HOE can be misleading).
          *   Must explain why remaining akratic is better calibrated to the total evidence than restoring coherence (by dropping $P$ or dropping the HOE belief).
          *   Target audience: Graduate level (needs technical precision, engagement with specific arguments).

  2.  **Deconstruct Horowitz's Argument (The Target):**
      *   *The Enkratic Principle:* Rationality forbids $[B(P) \land B(\text{Evidence doesn't support } P)]$.
      *   *The Dominance Argument:* Horowitz argues that akratic states are "guaranteed to be defective." She uses a decision-theoretic framework (often involving accuracy or value). If you are akratic, you are in a state that is worse than some alternative state regardless of whether $P$ is true or false, or regardless of whether the HOE is misleading or not.
      *   *Key Move:* She treats the combination of attitudes as a single package that is evaluated. If the package is akratic, it's irrational.
      *   *Weakness/Point of Attack:* Horowitz assumes that the *value* of an epistemic state is determined solely by the fit between the attitude and the truth/evidence *at that level*. She might be conflating *substantive rationality* (responding to evidence) with *structural rationality* (coherence). Level-splitters argue that in HOE cases, substantive rationality *demands* incoherence.

  3.  **Develop the Level-Splitting Counter-Argument (The Strategy):**
      *   *Goal:* Show that satisfying the Enkratic Principle forces a violation of a *more fundamental* epistemic norm (Respond to your Evidence), whereas violating Enkrasia (being akratic) preserves the fundamental norm.
      *   *The "Two-Source" Tension:* Distinguish between first-order evidence (FOE) and higher-order evidence (HOE).
      *   *The Calibration Argument:* The core intuition is that HOE acts as a *defeater* for the *justificatory status* of the belief, but not necessarily for the *truth* of the belief or the *psychological hold* of the FOE.
      *   *Confronting Dominance:* Horowitz says akrasia is dominated. The counter is that "coherence-restoring" moves are *more* dominated in terms of accuracy or expected epistemic value.
      *   *Specific Tactic:* Use the concept of "Epistemic Dilemmas" or "Normative Conflict." If two norms conflict, satisfying the more weighty one is rational, even if it violates the other.
      *   *Refining the Dominance Rebuttal:* Horowitz's dominance argument relies on the idea that being akratic is *always* worse. But if the HOE is misleading, believing $P$ is accurate (good), and believing "my evidence doesn't support $P$" is also accurate (because the HOE *is* evidence, even if misleading about the impairment, it makes it look like the evidence doesn't support $P$). Wait, need to be careful here.
      *   *Correction on HOE:* If the HOE is misleading (I *wasn't* drugged), my evidence *does* support $P$ (the math is right). So believing "Evidence doesn't support $P$" is false.
      *   *Better Angle:* The "Total Evidence" view. The total evidence includes the FOE (math) and the HOE (drug report).
          *   FOE says: $P$ is true.
          *   HOE says: Your process is unreliable.
          *   Level-Splitting View: The FOE makes $P$ likely. The HOE makes it likely that *you shouldn't trust* the FOE.
          *   Horowitz says: You must align. Either don't believe $P$, or don't believe the HOE undermines support.
          *   Level-Splitter says: The rational response to misleading HOE is to recognize the FOE still points to $P$, while acknowledging the HOE creates uncertainty about the *connection*.
      *   *The "Guaranteed Defect" Rebuttal:* Horowitz claims akrasia is guaranteed defective. The level-splitter argues that *coherence* in these cases is guaranteed to be *less accurate* or *less responsive to evidence*.
      *   *Key Distinction:* **Object-Given vs. State-Given Reasons.** Or better: **Substantive vs. Structural Rationality.** (Lord, Way, etc.).
      *   *The "Best Calibration" Argument:* In the drug case, the most accurate representation of reality is: (1) The sum is 1345 (because I calculated it and wasn't actually drugged), and (2) It looks like I shouldn't trust this calculation (because I have strong evidence I was drugged). Giving up (1) makes you inaccurate about the math. Giving up (2) makes you inaccurate about your situation. Keeping both makes you accurate about the world, even if internally tense.

  4.  **Drafting the Argument Structure:**
      *   **Introduction:** Acknowledge Horowitz's dominance argument. State the thesis: Level-splitting is required by the norm of "Evidentialism" (respond to total evidence), and Horowitz's dominance argument fails because it misidentifies the relevant alternatives in the decision matrix.
      *   **Point 1: The Primacy of Substantive Rationality.** Argue that responding to evidence is the fundamental epistemic goal. Coherence is derivative. When they conflict, substance wins.
      *   **Point 2: Rebutting the Dominance Argument.** Horowitz assumes the "akratic" option is dominated. Show that the "coherent" options (dropping $P$ or dropping HOE belief) are actually dominated in terms of *accuracy* or *expected veritistic value*.
          *   If I drop $P$: I believe false (if $P$ is true) or ignore strong FOE.
          *   If I drop HOE belief: I ignore strong evidence of impairment.
          *   If I keep both: I track both sets of evidence.
      *   **Point 3: The Nature of Higher-Order Evidence.** HOE doesn't cancel FOE; it casts doubt on the *link*. Level-splitting captures this nuance. Coherence forces a blunt instrument (all or nothing).
      *   **Point 4: Epistemic Dilemmas.** Accept that rationality can be fragmented. It's better to be rationally fragmented than substantively wrong.
      *   **Conclusion:** Summarize why this preserves the intuition that self-doubt is appropriate without collapsing into irrationality.

  5.  **Refining the Content (Self-Correction/Polishing):**
      *   *Critique:* Is "Substantive > Structural" too blunt? Horowitz anticipates this. She argues structural rationality *constitutes* substantive rationality in these cases.
      *   *Counter:* Need to invoke **David Christensen** or **Adam Elga** more explicitly regarding "calibration." The argument should focus on *Accuracy*.
      *   *The Dominance Rebuttal:* Horowitz's dominance argument works if we evaluate the *state* of akrasia as intrinsically bad. But if we evaluate states based on *accuracy* (fit with truth), akrasia might win.
      *   *Scenario:* Math problem. Answer is 1345. I calculate 1345. I'm told I'm drugged (false).
      *   *Option A (Akrasia):* Believe 1345. Believe "My evidence doesn't support 1345." -> True belief about math. True belief about my evidential situation (since the drug report *is* evidence, even if misleading about the fact of impairment, it alters the support relation *from my perspective*? No, evidence is factive or not? Let's assume standard non-factive evidence). If evidence is non-factive, the drug report *is* evidence. So "Evidence doesn't support" might be true *relative to the total evidence including the defeater*.
      *   *Wait, standard view:* If the drug report is false, does the evidence support $P$? Yes, the math is right. But the *total evidence* includes the report. The report lowers the probability that my calculation is reliable. So, $P(Evidence \text{ supports } P)$ goes down.
      *   *Horowitz's Claim:* You can't rationally believe $P$ and believe $E$ doesn't support $P$.
      *   *Level-Splitter:* I believe $P$ (because FOE is strong). I believe $E$ doesn't support $P$ (because HOE undermines the FOE).
      *   *Why is this better?* Because if I stop believing $P$, I lose the truth of $P$. If I stop believing HOE undermines, I lose the truth about my reliability.
      *   *Crucial Move:* Distinguish between **Evidence Support** and **Rational Belief**. Horowitz links them tightly. Level-splitters decouple them.
      *   *Refining the Dominance Attack:* Horowitz argues that akrasia is "guaranteed defective." The counter-argument is that *coherence* is guaranteed to be *less accurate*. If the goal of epistemology is truth/accuracy, then the state that maximizes accuracy (even if incoherent) is preferable. Horowitz assumes coherence is a constitutive norm of rationality that trumps accuracy. Challenge that assumption.
      *   *Reference:* Mention **Maria Lasonen-Aarnio** (unreasonable knowledge) or **Christensen** (disagreement/HOE).
      *   *Specific Argument Name:* "The Accuracy Dominance Argument." Turn her dominance argument on its head. Show that coherent states are accuracy-dominated by the akratic state in misleading HOE cases.

  6.  **Finalizing the Plan:**
      *   **Title:** Something academic. "Calibration over Coherence."
      *   **Intro:** Set up the Horowitz vs. Elga debate.
      *   **Section 1: The Primacy of Evidential Fit.** Argue that the fundamental norm is "Believe in accord with evidence."
      *   **Section 2: Turning the Dominance Argument.** Show that in misleading HOE cases, coherent options are accuracy-dominated.
      *   **Section 3: The Calibration Defense.** Explain why level-splitting is the only view that respects the distinct roles of FOE and HOE.
      *   **Section 4: Addressing the "Defect."** Concede akrasia is a defect, but argue it's the *lesser* defect compared to evidential unresponsiveness.
      *   **Conclusion:** Wrap up.

  7.  **Review against Constraints:**
      *   Graduate level? Yes, uses technical terms (veritistic value, dominance, substantive/structural).
      *   Confront Horowitz? Yes, directly addresses the dominance argument.
      *   Explain calibration? Yes.
      *   No "HOE can be misleading" shortcut? Yes, focuses on *why* responding to misleading HOE requires akrasia.

  8.  *(Self-Correction during drafting)*: Make sure not to conflate "Evidence doesn't support P" with "I am unreliable." Horowitz formulates Enkrasia as $B(P) \land B(\text{I ought not believe } P)$ or $B(P) \land B(\text{Evidence doesn't support } P)$. Stick to the latter as per prompt.
      *   *Nuance:* If the drug report is false, does the evidence support $P$? If evidence is factive, yes. If evidence is mental states, the report is part of the evidence. The report suggests the calculation is flawed. So the *total evidence* makes it uncertain.
      *   *Horowitz's Trap:* She argues that if you believe $P$, you are committed to thinking your evidence supports it.
      *   *Level-Splitter Escape:* No, I believe $P$ because the FOE is strong, but I acknowledge the HOE defeats the *warrant*.
      *   *Key distinction:* **Propositional Justification vs. Doxastic Justification.** Or **Objective vs. Subjective** support.
      *   *Actually, the strongest argument:* **The Accuracy Argument.** If the goal is believing truths and avoiding falsehoods, level-splitting yields more true beliefs in the long run (or in this specific case) than forcing coherence.

      *Let's build the response.*
answer: |-
  Here is a construction of the strongest available case for the level-splitting view, designed to engage directly with Horowitz's dominance argument and the calibration intuitions central to your seminar.

  ***

  ### Title: Calibration Over Coherence: An Accuracy-Based Defense of Level-Splitting

  **1. Introduction: The Conflict of Norms**
  The debate between Sophie Horowitz and proponents of level-splitting (such as Adam Elga and David Christensen) is often framed as a conflict between *structural rationality* (coherence among attitudes) and *substantive rationality* (responsiveness to evidence). Horowitz's defense of the Enkratic Principle rests on a dominance argument: she contends that an akratic state (believing $P$ while believing one's evidence does not support $P$) is "guaranteed to be defective" in a way that coherent states are not. She argues that violating Enkrasia leaves an agent vulnerable to a guaranteed loss in epistemic value, regardless of how the world turns out.

  To argue for level-splitting, one cannot merely assert that higher-order evidence (HOE) can be misleading. One must demonstrate that Horowitz's dominance argument relies on a restricted decision matrix that ignores the *veritistic value* of the attitudes involved. The core thesis of this paper is that in cases of misleading HOE, satisfying the Enkratic Principle forces an agent to violate the more fundamental norm of **Evidentialism** (the norm that one ought to believe in accordance with one's total evidence). Consequently, the akratic state is not "dominated" in terms of epistemic utility; rather, the coherent alternatives are accuracy-dominated by the akratic state. Level-splitting is the only view that allows an agent to remain properly calibrated to both their first-order evidence (FOE) and their higher-order evidence.

  **2. Reversing the Dominance Argument**
  Horowitz's dominance argument functions by treating the *combination* of attitudes as the unit of evaluation. She suggests that if you are akratic, you are in a state that is epistemically worse than some alternative state, no matter the truth value of $P$ or the reliability of your faculties.

  However, this argument assumes that the primary source of epistemic disvalue is *incoherence*. If we instead adopt a veritistic framework (where the primary epistemic good is accuracy—believing truths and avoiding falsehoods), the dominance calculation flips in misleading HOE cases.

  Consider the drug case: You have correctly solved a long-division problem ($P$). You receive (misleading) evidence that you have been drugged ($H$).
  *   **FOE:** Strongly supports $P$ (the calculation is correct).
  *   **HOE:** Strongly supports $\neg R$ (that your reasoning is currently unreliable).

  Horowitz demands coherence. You must either:
  1.  **Drop $P$:** Believe $\neg P$ or suspend judgment.
  2.  **Drop the HOE belief:** Believe that your evidence supports $P$ (deny the undermining force of $H$).
  3.  **Level-Split:** Believe $P$ and believe $H$ undermines support for $P$.

  If we evaluate these options based on **accuracy**:
  *   **Option 1 (Drop $P$):** You abandon a true belief derived from valid reasoning. You incur a veritistic loss on the first-order matter.
  *   **Option 2 (Drop HOE):** You ignore strong evidence regarding your cognitive situation. You incur a veritistic loss on the higher-order matter (you are now wrong about your reliability).
  *   **Option 3 (Level-Split):** You retain the true belief that $P$, and you retain the true belief that your current situation (given the drug report) makes your evidence look unreliable.

  In the specific scenario where the HOE is *misleading* (you weren't actually drugged, but the report is genuine evidence), Option 3 maximizes accuracy. You believe the truth about the math, and you believe the truth about your evidential situation (which includes the report). Horowitz's dominance argument fails because it treats the *relation* between the attitudes as the sole locus of value. If the locus of value is *truth*, then the akratic state dominates the coherent states in misleading HOE cases. To avoid the "defect" of akrasia, Horowitz forces the agent to accept the guaranteed defect of **evidential unresponsiveness**.

  **3. The Calibration Argument: Distinct Roles for FOE and HOE**
  The intuition driving level-splitting is not merely that we *can* hold these attitudes, but that we *ought* to in order to be properly calibrated. This requires distinguishing the functional role of FOE from HOE.

  *   **FOE** bears on the truth of $P$.
  *   **HOE** bears on the reliability of the process generating the belief in $P$.

  In the drug case, the FOE (the calculation) remains robust; the numbers still add up. The HOE (the drug report) does not change the numbers, but it changes the *status* of the calculation as a basis for belief. A coherent view (dropping $P$) treats the HOE as a **rebutting defeater** (evidence that $P$ is false). But the drug report is not evidence that the sum is wrong; it is evidence that *you might be wrong*.

  Level-splitting captures this distinction. By believing $P$, you respect the FOE. By believing "My evidence doesn't support $P$," you respect the HOE. You are acknowledging that while the world is such that $P$ is true, your *position* in the world is such that you cannot rely on your access to that truth.

  Horowitz argues that this split is irrational because belief "aims at truth," and believing $P$ while thinking your evidence doesn't support it is a failure to aim. The counter-argument is that **aiming at truth requires tracking all evidence.** If you ignore the HOE to restore coherence, you are no longer aiming at truth comprehensively; you are aiming at *internal consistency*. In cases of misleading HOE, internal consistency is a poor proxy for truth-tracking. Therefore, the akratic agent is actually *better* calibrated to the total evidential situation than the coherent agent. The akratic agent accurately represents the tension between the world (where $P$ is true) and their access to it (which is compromised).

  **4. Epistemic Dilemmas and the Hierarchy of Norms**
  A potent response to Horowitz is to concede that akrasia is a defect, but deny that it is the *fatal* defect she claims it is. This relies on the distinction between **Substantive Rationality** (responding correctly to evidence) and **Structural Rationality** (maintaining coherence).

  Horowitz attempts to reduce substantive norms to structural ones. She argues that if you respond to your evidence correctly, you will naturally be coherent. The level-splitting view denies this reduction. In misleading HOE cases, the norms conflict.
  *   Norm A: Believe in accord with FOE (Believe $P$).
  *   Norm B: Believe in accord with HOE (Believe "Evidence doesn't support $P$").
  *   Norm C: Be Coherent (Do not believe $P$ and "Evidence doesn't support $P$").

  Satisfying Norm C requires violating either Norm A or Norm B. Satisfying Norms A and B requires violating Norm C.
  The argument for level-splitting is that Norms A and B are **fundamental**, while Norm C is **derivative**. Coherence is valuable *because* it usually indicates that an agent is responding to their evidence correctly. It is a heuristic for substantive rationality. However, in pathological cases (like misleading HOE), the heuristic breaks down. When a heuristic conflicts with the fundamental goal it serves (tracking evidence/truth), the heuristic must yield.

  Therefore, the "defect" of akrasia is a structural glitch that arises precisely because the agent is successfully following the more important substantive norms. Horowitz's dominance argument treats the structural glitch as the primary failure. The level-splitter argues that the primary failure would be ignoring the evidence (either FOE or HOE) to fix the glitch. It is rationally preferable to suffer a structural defect (akrasia) than a substantive defect (ignoring evidence).

  **5. Conclusion: Rationality as Responsiveness**
  To conclude, the strongest case for level-splitting does not deny that akrasia is tense or uncomfortable; it denies that this tension constitutes irrationality in the relevant sense. Horowitz's dominance argument succeeds only if we prioritize coherence over accuracy. If we prioritize accuracy and evidential responsiveness, the dominance relation reverses: the coherent states are dominated by the akratic state in terms of their fit with the total evidence.

  In the drug case, the rational agent is the one who says, "The sum is 1345, but given that I might be drugged, I shouldn't trust that conclusion." This is a paradoxical state, but it is the only state that fully acknowledges the complexity of the evidential situation. To force coherence is to force the agent to lie either about the math or about their reliability. Thus, level-splitting is not a concession to human frailty; it is the rigorous consequence of taking higher-order evidence seriously as evidence that modifies the *status* of belief without necessarily negating the *content* of belief. Rationality, in these extreme cases, requires us to be akratic.

  ***

  ### Strategic Notes for Your Paper

  *   **Terminology:** Ensure you distinguish clearly between *evidence* (the facts/states possessed) and *support* (the relation). Horowitz often argues that if you believe $P$, you are *thereby* committed to thinking your evidence supports it. Your counter-argument must be that belief is a response to FOE, while the higher-order belief is a response to HOE, and these responses can diverge without logical contradiction in the *content*, even if they create tension in the *attitudes*.
  *   **The "Guaranteed Defect":** When addressing Horowitz's claim that akrasia is "guaranteed defective," press her on *what* the defect is. If the defect is "incoherence," beg the question. If the defect is "accuracy loss," use the argument in Section 2 to show coherence loses more accuracy.
  *   **Citations:** In addition to Horowitz and Elga, you might find it useful to reference **David Christensen's** work on "Epistemic Modesty" (he is a major proponent of the idea that HOE requires lowering confidence even if you retain the belief) or **Maria Lasonen-Aarnio's** work on "Unreasonable Knowledge," which defends the idea that one can know $P$ even while having evidence that one doesn't know $P$.
  *   **Tone:** Maintain a charitable but firm tone. Acknowledge that Horowitz's view is attractive because it preserves the unity of the rational agent. Your job is to show that this unity comes at too high a price (evidential unresponsiveness).

  This structure should allow you to move beyond the "HOE can be misleading" intuition and engage with the decision-theoretic and normative core of Horowitz's argument.
