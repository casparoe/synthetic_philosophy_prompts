  7.  **Self-Correction/Nuance Check:**
      *   *Wait, is the friend totally wrong?* Some theorists (like Nagel or early Gazzaniga) have flirted with the idea of dual consciousness. It's not "pseudoscience," but it is a *minority* view compared to the "unified consciousness" view. I should frame it as "controversial interpretation" rather than "false."
      *   *Key distinction:* The difference between *functional independence* (can act separately) and *phenomenological independence* (feel like separate selves). The friend is conflating these.
