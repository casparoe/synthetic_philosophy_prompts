      *   **The Task:** Reconstruct how Descartes would respond to an LLM *within his own framework*. Does he have to grant it reason/mind, or is there a principled out? Does this expose a weakness in his inference from behavior to ontology (soul/mind)?
      *   **Goal:** Provide a few paragraphs the user can lift/adapt for the character's internal reasoning. It needs to be philosophical but grounded in the character's emotional reality.
