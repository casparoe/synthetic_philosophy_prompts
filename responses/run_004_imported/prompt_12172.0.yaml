          *   *Weak/Continuity Reading:* The *method* (Truth Theory) remains, but the *object* changes.
      *   *Reconciliation Strategy:* The Truth Theory *is* the Passing Theory.
          *   Early work: Idealized case where Passing Theory $\approx$ Prior Theory (standard usage).
          *   Late work: General case where Passing Theory diverges.
          *   So, understanding is *always* constructing a truth theory, but it's a truth theory for *this utterance* (or speaker-at-time-$t$), not necessarily for "English."
      *   *Problem with Reconciliation:* Does this destroy compositionality? If every word's meaning is up for grabs at every utterance, is it still a *recursive* theory? Davidson suggests the Passing Theory must still be systematic enough to be learnable in real-time, but it doesn't need to match the public dictionary.
