  9.  (Final check of the "Nice Derangement" argument): Davidson's point is that since we *can* understand malapropisms, the public meaning isn't what determines successful interpretation. The interpreter adjusts their theory to match the speaker's intention. This adjustment *is* the Passing Theory. Since this happens constantly (even in normal speech, to a lesser degree), the "shared language" is just a fiction we use to describe the overlap.

