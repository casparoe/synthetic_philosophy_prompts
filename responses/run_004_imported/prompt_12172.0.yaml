      *   *Problem:* Malapropisms, slips, neologisms, context-specific shifts (e.g., Mrs. Malaprop saying "a nice derangement of epitaphs" instead of "a nice arrangement of epithets").
      *   *Observation:* We understand these *without* the words meaning that in the public language.
      *   *Distinction:*
          *   *Prior Theory:* What the interpreter *expects* the speaker to mean (based on public conventions, past usage, etc.).
          *   *Passing Theory:* What the interpreter *actually* uses to interpret the specific utterance.
      *   *Claim:* Communication succeeds iff Prior Theory $\rightarrow$ Passing Theory convergence happens *at the moment of utterance*.
      *   *Conclusion:* Since the Passing Theory is idiosyncratic and momentary, "Language" (as a stable, shared code) is not essential for communication. It's at best a crutch.

  4.  **Address Question 1 & 2: The Work of the Distinction & Rejection of Convention:**

      *   *Function:* The distinction isolates the *moment of interpretation* from the *background knowledge*.
      *   *Argument:* If communication works even when the Prior Theory (public convention) fails (as in malapropism), then the Prior Theory isn't *constitutive* of meaning.
      *   *The "Passing Theory" is the theory of meaning for that utterance.*
      *   *Why no shared language?* Because the Passing Theory is unique to the speaker-hearer pair at time $t$. If every utterance potentially requires a tweak to the Passing Theory, there is no stable "thing" (Language) that persists across time and speakers. Conventions are just generalizations about past Passing Theories, not rules governing future ones.

