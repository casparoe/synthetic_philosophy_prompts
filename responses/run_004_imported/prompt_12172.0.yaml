      *   *Method:* Construct a Tarski-style truth theory ($T$-sentences: "$s$ is true iff $p$").
      *   *Constraint:* Principle of Charity (maximize agreement/truth).
      *   *Implication:* Meaning is systematic/compositional. Competence = Knowledge of a finite theory generating infinite sentences.
      *   *Assumption:* There is a "language" (L) that the speaker knows and the interpreter tries to discover. This implies a shared structure/convention.

