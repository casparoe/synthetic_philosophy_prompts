answer: |-
  This is an excellent question that cuts to the heart of the development of Davidson's philosophy of language. The tension you identify is real and has generated a significant amount of secondary literature. To resolve it, we need to look closely at how the *mechanism* of interpretation remains constant in Davidson's work while the *ontology* of what is being interpreted shifts dramatically.

  Here is a detailed breakdown of the Prior/Passing theory distinction, its argumentative role in "A Nice Derangement of Epitaphs" (ANDE), and an assessment of its compatibility with the early Radical Interpretation model.

  ### 1. The Work of the Prior/Passing Theory Distinction

  In ANDE, Davidson introduces the distinction to solve a specific problem: How do we understand utterances that violate the public conventions of the language (e.g., malapropisms, slips of the tongue, neologisms, or context-specific shifts)?

  **The Definitions:**
  *   **Prior Theory:** This is what the interpreter brings to the conversation *before* the utterance is made. It includes their knowledge of the public language (grammar, dictionary definitions), their knowledge of the speaker's idiolect, and their general expectations about what the speaker is likely to mean. It is the "best guess" framework.
  *   **Passing Theory:** This is the theory the interpreter actually uses to interpret the *specific utterance* at the *specific moment*. It assigns meanings to the words as used by the speaker on this occasion.

  **The Argumentative Work:**
  Davidson uses this distinction to decouple **successful communication** from **shared conventions**.

  1.  **The Malapropism Case:** Consider Mrs. Malaprop saying, "He is the very pineapple of politeness" (meaning *pinnacle*).
      *   The **Prior Theory** (based on standard English) tells the hearer that "pineapple" refers to a fruit. If the hearer sticks to the Prior Theory, communication fails.
      *   To understand the speaker, the hearer must construct a **Passing Theory** in which "pineapple" means *pinnacle* for this speaker at this time.
  2.  **The Condition for Success:** Davidson argues that communication succeeds if and only if the speaker's Passing Theory (what they intend the words to mean) and the hearer's Passing Theory (what they take the words to mean) converge.
  3.  **The Irrelevance of the Prior:** Notice that the *Prior* Theories can diverge wildly. The speaker might know they are using a malapropism; the hearer might expect standard English. As long as they converge on the Passing Theory at the moment of utterance, communication occurs.

  **Why this attacks "Shared Language":**
  If communication relies on the convergence of Passing Theories, and Passing Theories are tailored to specific utterances (and can deviate from public convention), then the "Shared Language" (the system of conventions captured in the Prior Theory) is not *constitutive* of communication. It is, at best, a useful heuristic or a common starting point.

  Davidson's radical conclusion is that since the Passing Theory is what does the work, and the Passing Theory is transient and idiosyncratic (specific to a speaker-hearer pair at time $t$), there is no need to posit a stable, abstract object called "English" or "Language" that exists between them. There are only speakers and interpreters adjusting their theories to match.

  ### 2. Is There a Genuine Tension with the Early View?

  This is the crux of your seminar discussion. There are two ways to read the relationship between the early Truth-Theory model and the later Passing Theory model: the **Discontinuity Reading** and the **Continuity Reading**.

  #### A. The Discontinuity Reading (Strong Tension)
  On this reading, Davidson has abandoned the project of Radical Interpretation as originally conceived.
  *   **Early View:** Meaning is grounded in a stable, compositional structure (a language) that is learned and shared. The Truth Theory is a theory *of a language*.
  *   **Late View:** There is no stable language. Meaning is determined utterance-by-utterance.
  *   **The Conflict:** If there is no shared language, what guarantees the **compositionality** required for a recursive truth theory? The early model relies on the fact that "red" means the same thing in "red car" and "red house." If the Passing Theory can assign *any* meaning to *any* word on any occasion to match the speaker's intention, the systematicity required for a Tarski-style theory seems to evaporate. We risk falling into a holism where every utterance requires a wholly new theory, making language learning impossible.

  #### B. The Continuity Reading (Reconciliation via Relativization)
  Most Davidson scholars favor a version of this reading. It suggests that the *method* of interpretation remains the same, but the *object* of interpretation is re-described.

  **1. The Passing Theory *is* a Truth Theory**
  Davidson does not say we stop using truth theories in ANDE. He says the Passing Theory *is* the theory of meaning for that utterance.
  *   **Early:** We construct a truth theory for the speaker's *language*.
  *   **Late:** We construct a truth theory for the speaker's *utterance* (or the speaker-at-time-$t$).

  The formal machinery (T-sentences, recursion, charity) remains the tool we use to converge on the Passing Theory. The Principle of Charity is still required to fix the trade-off between belief and meaning, even when converging on a malapropism. (e.g., I assume you are speaking truthfully about the politeness of the person, so I must adjust the meaning of "pineapple" rather than assume you are lying or irrational.)

  **2. Relativizing Truth Theories to Occasions**
  You asked if we can hold onto the picture by relativizing truth theories to particular occasions. **Yes, this is the most viable reconciliation.**

  On this view, the "Shared Language" of the early work was always an idealization. In Radical Interpretation, we assumed the speaker was speaking "standardly" to make the problem tractable. ANDE removes that idealization.
  *   **The Reconciliation:** Understanding a speaker is *always* constructing a truth theory for their idiolect-at-time-$t$.
  *   **Standard Usage:** When the speaker uses standard conventions, the Passing Theory matches the Prior Theory (and the public language).
  *   **Non-Standard Usage:** When the speaker uses a malapropism, the Passing Theory diverges from the Prior Theory.
  *   **Conclusion:** The early model describes a special case of the later model (where convergence is easy because conventions align). The later model generalizes the early model (convergence is required regardless of conventions).

  **3. What happens to Compositionality?**
  This is the hardest hurdle. If every word's meaning is up for grabs in the Passing Theory, is it still a *recursive* system?
  Davidson suggests that the Passing Theory must still be **systematic enough to be learnable in real-time**. We don't learn a new language for every sentence; we tweak the parameters of the existing one. The "conventions" are just patterns of stability in Passing Theories over time. They are descriptive generalizations, not normative rules.
  *   *Early:* Conventions determine meaning.
  *   *Late:* Meaning (determined by intention/charity) determines which conventions we observe.

  ### 3. Synthesis for Your Seminar

  To synthesize this for your seminar, you might frame the development not as a contradiction, but as a shift in **ontological commitment** regarding "Language."

  1.  **The Constant:** The nature of *understanding*. For early and late Davidson, to understand is to be able to specify the truth conditions of the speaker's utterance. This always requires a theory (Prior/Passing) and the Principle of Charity.
  2.  **The Variable:** The status of *conventions*.
      *   **Early:** Conventions (a shared language) are the *foundation* that makes the construction of the truth theory possible. They constrain the hypothesis space.
      *   **Late:** Conventions are merely *props*. They are useful because they make the convergence of Passing Theories more frequent and less effortful, but they are not essential. The foundation is the human capacity for triangulation and charitable interpretation.

  **Is there a remaining tension?**
  Yes, a normative one.
  *   In the early view, if I interpret "pineapple" as *pinnacle*, I am arguably **misinterpreting** the English language, even if I understand the speaker. There is a distinction between "what the words mean" and "what the speaker means."
  *   In ANDE, Davidson collapses this. If I interpret "pineapple" as *pinnacle* and communication succeeds, that *is* what the words meant in that context. There is no "English" left over to judge me against.

  **Conclusion:**
  You can hold onto the Truth-Theory picture by accepting that **Truth Theories are theories of speakers, not of languages.**
  The early work assumed that theorizing about a speaker *just is* theorizing about a shared language they speak. The later work corrects this: theorizing about a speaker is theorizing about their passing intentions. The "shared language" is merely the intersection of many successful Passing Theories over time.

  Therefore, the tension is resolved if you view the early work as positing a **regulative ideal** (a shared language) that facilitates interpretation, while the later work exposes the **metaphysical reality** (idiosyncratic convergence) that underlies it. The machinery of Radical Interpretation (Charity + Truth Theory) survives, but it is liberated from the requirement that the object of interpretation be a stable, public code.
