      *   *The "Matters Day to Day" Claim:* What do we actually need responsibility for? Blame, praise, social coordination, moral education, holding people accountable. Do these require *causa sui*? No, they require agency.
      *   *Strategy:* Concede Galen's point on *Ultimate* Responsibility but deny that *Ultimate* Responsibility is the necessary condition for *Moral* Responsibility as practiced.

  4.  **Address the Father-Son Dynamic (P.F. vs. Galen Strawson):**
