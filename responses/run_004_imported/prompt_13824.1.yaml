      *   *The Core of the Hole Argument:* Briefly recap to ensure shared ground. The hole diffeomorphism shifts fields off points. Naive substantivalism says "different points = different world."
      *   *The "Sophisticated" Rescue:* Explain the move: Deny haecceity. Points are individuated by the metric structure. $d$ and $d^*$ (diffeomorphic models) are the same physical state.
      *   *Argument 1: The Individuation Problem.* If points get identity from the metric, what is the manifold *before* the metric? In GR, the metric is dynamic. If the manifold is the substance, it should persist through changes. But if its points are defined by the metric, the "substance" changes its fundamental constitution when the field changes. This blurs the container/content distinction.
      *   *Argument 2: Ontological Parsimony (Occam's Razor).* If two theories make the exact same predictions and posit the same physical structures (the metric field), but one adds a "manifold substance" that has no independent identity, the added substance is doing no work. It's a "bare particular" without the "bareness" that defines bare particulars.
      *   *Argument 3: The Gauge Analogy (Speaking their language).* In numerical relativity, gauge choices are computational tools. We don't believe the grid points are physical. Sophisticated substantivalism asks us to believe the grid points are physical *but* indistinguishable except by the data stored on them. That's just saying the data is the physics.
      *   *Argument 4: Modal Structure.* Substantivalism is often motivated by modal claims (spacetime *could* have been different). If points lack trans-world identity, how do we track them across possible worlds? Relationalism handles this via structural counterfactuals. Sophisticated substantivalism loses the modal advantage it claimed over relationalism.
      *   *Conclusion:* The label "substantivalism" is a misnomer. It's structural realism or relationalism wearing a manifold mask.

