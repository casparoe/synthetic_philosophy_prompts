      *   The defense argues we should condition on $E$ (existence), not just $O$ (observation), or that $O$ entails $E$.
      *   Actually, the stronger version is: The evidence isn't "This universe is life-permitting" ($L$), but "At least one universe is life-permitting" ($\exists L$).
