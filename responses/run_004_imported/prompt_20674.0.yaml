      *   *Refining the IGF:* The fallacy isn't just ignoring selection effects; it's thinking that *other trials* affect the probability of *this trial's outcome*. Even with selection effects, the confirmation relation requires that the hypothesis ($M$) makes the evidence ($E$) more probable.
