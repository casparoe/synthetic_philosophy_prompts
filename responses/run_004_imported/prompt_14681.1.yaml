      *   **Mike:** Focuses on the *specific wording* and *definitions*. He argues that a "fee" for costs is distinct from "rent" for occupancy. He warns against expanding the rule beyond its text ("smells rental-ish"). This aligns with **Textualism** (strict adherence to the words) and **Rule of Lenity** (ambiguous rules should be interpreted narrowly against the enforcer).

