answer: |-
  You have spotted the exact dynamic that keeps law schools in business. This is a classic clash between **Textualism** (Mike) and **Purposivism** (Teresa), wrapped in a contract law dispute.

  In legal theory, **Textualism** argues that you interpret a rule based strictly on the ordinary meaning of the words used. **Purposivism** argues that you interpret a rule based on the goal it was intended to achieve. There is also a doctrine called **Substance Over Form**, which says courts look at the economic reality of a transaction, not just the labels the parties slap on it.

  Here is the move-by-move breakdown of their exchange, evaluating who holds the stronger legal and logical position at each step.

  ### Round 1: The Definition of "Rent"
  *   **Teresa:** "Leased or rented" covers any money-for-access exchange, regardless of the label.
  *   **Mike:** (Implicitly accepts the challenge, responds in Round 2).
  *   **Winner:** **Teresa.**
  *   **Why:** She is invoking the **Substance Over Form** doctrine. In almost every jurisdiction, if a transaction functions as a lease (exclusive possession for a set time in exchange for value), courts will treat it as a lease even if the contract calls it a "license," "fee," or "donation." Calling it a "cleaning fee" does not legally immunize it if the economic reality is payment for occupancy.

  ### Round 2: The "Without Charge" Exception
  *   **Mike:** The bylaw contrasts "rent" with "without charge." A fee for utilities is cost reimbursement, not payment for occupancy. Analogy: Splitting a water bill with a houseguest isn't renting.
  *   **Teresa:** (Responds in Round 3).
  *   **Winner:** **Mike (on theory), Teresa (on facts).**
  *   **Why:** Mike finds the strongest textual hook in the document. The bylaw explicitly creates an exception for people staying "without charge," implying that *some* charges might be permissible without triggering the "rent" clause. His houseguest analogy is logically sound for *actual* guests. However, it fails factually: Airbnb guests are strangers, not houseguests, and a per-night fee that scales perfectly with stay length functions as rent, not a utility split. Mike wins the semantic point, but loses the reality check.

  ### Round 3: The Purpose of the Rule (The "Mischief")
  *   **Teresa:** Allowing labeling tricks defeats the rule. The purpose is to stop turnover/strangers/parking headaches. Nadia's setup causes exactly that.
  *   **Mike:** (Responds in Round 4).
  *   **Winner:** **Teresa.**
  *   **Why:** This is the **Mischief Rule** of interpretation: *What problem was this law meant to cure?* Teresa correctly identifies that the HOA's interest is in community stability, not semantics. If the rule can be bypassed by renaming "rent" to "fee," the rule is nullified. In contract disputes, courts often reject interpretations that render a clause meaningless. Teresa's argument prevents the bylaw from becoming absurd.

  ### Round 4: The Danger of Discretion
  *   **Mike:** "Smells rental-ish" is too vague. It gives the board too much power. If they wanted to ban paid hosting, they should have written that.
  *   **Teresa:** (Responds in Round 5).
  *   **Winner:** **Mike.**
  *   **Why:** This is a **Rule of Law** argument. Mike is correctly pointing out that HOAs are bound by their own governing documents. If the board enforces based on "vibe" rather than text, they open themselves to lawsuits for arbitrary enforcement. There is a legal principle called **Contra Proferentem**, which states that ambiguous contract terms should be interpreted *against* the party that drafted them (the HOA). Mike is right that the HOA failed to draft a specific "Short-Term Rental" ban, which is the modern standard for catching Airbnb hosts.

  ### Round 5: Good Faith vs. Clever Drafting
  *   **Teresa:** A rule beaten by wording isn't clear. It moves discretion to the labeler (Nadia), which is worse for good-faith owners.
  *   **Mike:** (End of exchange).
  *   **Winner:** **Teresa.**
  *   **Why:** She successfully flips Mike's "fairness" argument. Mike argues fairness requires strict text; Teresa argues fairness requires stopping bad actors from exploiting loopholes. If the rule depends entirely on the honesty of the labeler, then honest owners who follow the 30-day rule are suckers, while dishonest ones profit. Courts generally dislike **Bad Faith** conduct, and structuring a fee to perfectly mimic rent while claiming it isn't rent is strong evidence of bad faith.

  ***

  ### The Blind Spots (What Neither of Them Saw)

  Both neighbors are arguing about the *Rental* clause, but they are missing two critical legal angles that would likely decide this in a real courtroom:

  1.  **Commercial Use vs. Residential Use:** Most HOA bylaws have a separate clause restricting units to "residential use only." Courts have increasingly ruled that operating an Airbnb is a **commercial business**, not residential use, regardless of the lease length. This is often a stronger argument than the "rental" clause because it doesn't matter if you call it a "fee"; running a hotel out of your condo is usually a distinct violation.
  2.  **Insurance and Liability:** Neither mentioned that most homeowner insurance policies void coverage if the home is used for "business purposes" or "regular rental." The HOA's master policy might also be jeopardized. This makes the issue a financial liability for the whole building, not just a semantic dispute about bylaws.

  ### The Verdict

  **Teresa is closer to right overall.**

  While Mike is technically correct that the HOA drafted a sloppy bylaw (they should have specifically banned "short-term rentals"), Teresa is correct on the **Substance Over Form** principle; a per-night fee charged to strangers via a commercial platform is legally indistinguishable from rent, and allowing otherwise would render the covenant meaningless.
