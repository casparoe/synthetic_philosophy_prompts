      *   *The Crux:* At equilibrium, high-quality individuals might not suffer a net fitness loss compared to not signaling (or compared to a baseline), provided low-quality individuals would suffer a *disproportionate* loss if they tried to mimic. The cost is often "potential" or "marginal," not necessarily "net absolute."
      *   *The "Costly" Misconception:* Textbooks often say "signals must be costly." The prompt asks to refute this specific absolute/net cost requirement while upholding the validity of the Handicap Principle via the marginal interpretation.

