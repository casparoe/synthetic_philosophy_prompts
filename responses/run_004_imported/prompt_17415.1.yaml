answer: |-
  This is a fantastic question, and it highlights a very common friction point for scientists (especially biologists) who turn to philosophy. You are looking for empirical data where there isn't any, because **the drowning child scenario is not an empirical study; it is a philosophical thought experiment.**

  There is no sample size, no control group, and no replication data for Singer's original scenario because no children were ever actually placed in ponds for the sake of the study. It would, of course, be wildly unethical to conduct such an experiment.

  However, your instinct to look for data is actually spot-on for a modern critique of the argument. Here is the breakdown of what the scenario is, why it lacks data, and where the actual psychological data *does* exist.

  ### 1. The Methodology: "Intuition Pumps"
  In philosophy, this is what Daniel Dennett calls an "intuition pump." The goal isn't to describe how people *actually* behave (descriptive ethics); the goal is to isolate a specific moral intuition to test a logical principle (normative ethics).

  Singer's argument structure is essentially a *modus ponens*:
  1.  **Premise 1:** If you can prevent something bad from happening without sacrificing anything of comparable moral importance, you ought to do it.
  2.  **Premise 2 (The Pond):** You intuitively agree that saving the drowning child (ruining your clothes) fits Premise 1.
  3.  **Premise 3 (The Famine):** A starving child overseas is morally equivalent to the drowning child (distance doesn't matter).
  4.  **Conclusion:** Therefore, you ought to donate the money you would have spent on clothes to save the starving child.

  Singer isn't trying to prove people *will* save the child; he is betting that you *agree* they should. He relies on the near-universal intuition that letting a child die to save a suit is monstrous. He uses that agreement to trap you into accepting the conclusion about global charity.

  ### 2. The Empirical Data That *Does* Exist
  While there is no data on the pond, there is a massive amount of psychological and behavioral economic data on the underlying behaviors Singer is probing. As a biologist, you might find the "replication" of these behavioral traits interesting.

  **A. The Bystander Effect (Darley & Latané, 1968)**
  If you are looking for data on whether people actually help in emergencies, this is the classic literature.
  *   **Finding:** Contrary to Singer's assumption, people *do* often walk past someone in distress, especially if there are other people around (diffusion of responsibility).
  *   **Relevance:** This weakens Singer's Premise 2 slightly. If our intuition is actually "someone else will help," the moral force of the thought experiment dampens. However, most people still admit they *should* have helped, which preserves Singer's normative claim.

  **B. The Identifiable Victim Effect (Small, Loewenstein, & Slovic, 2007)**
  This is the biggest empirical hurdle to Singer's argument.
  *   **Finding:** Humans are biologically wired to respond to specific, visible individuals (the drowning child) but respond weakly to statistical lives (the starving millions).
  *   **Data:** Studies show donations drop significantly when the appeal changes from "Help Rokia, a 7-year-old girl" to "Help millions of children in Africa."
  *   **Relevance:** Singer argues distance and abstraction shouldn't matter morally. Psychology shows they matter immensely *psychologically*. This doesn't prove Singer wrong morally, but it explains why the "replication" of his logic fails in human behavior.

  **C. Experimental Philosophy (X-Phi)**
  This is a sub-field you might really enjoy. It treats philosophy like a science.
  *   **Method:** Researchers survey hundreds of people (sample sizes of 200–1,000+) presenting them with thought experiments like Singer's.
  *   **Findings:** Some studies suggest that cultural background impacts the intuition. For example, some collectivist cultures might weigh the "ruined clothes" (family resources) differently than Western individualists.
  *   **Key Name:** Joshua Knobe or Shaun Nichols. They actually run the data on philosophical intuitions.

  ### 3. Why the Confusion Happens
  You are experiencing what happens when a scientific mindset meets a theoretical one.
  *   **In Biology:** A model organism (like a mouse) is used to predict real-world outcomes. If the mouse model doesn't replicate in humans, the theory is discarded.
  *   **In Philosophy:** The "model" is a hypothetical scenario. It doesn't need to be realistic; it needs to be *logically consistent*. Even if 50% of people walked past the pond, Singer would argue those 50% are simply acting immorally. The truth of his argument doesn't depend on human behavior, but on moral logic.

  ### 4. Recommendations for a Biologist-Turned-Philosopher
  Since you enjoy the data side of things, I recommend looking into **Effective Altruism**, which is the modern movement spawned by Singer's essay. They treat charity like biology:
  *   **Evidence-based:** They use RCTs (Randomized Controlled Trials) to determine which charities actually save lives (e.g., bed nets vs. food aid).
  *   **Key Organization:** *GiveWell* or *80,000 Hours*. They publish the actual data on cost-per-life-saved that Singer's essay lacked.

  **Reading Suggestion:**
  If you want to see where philosophy meets data, look up **"Experimental Philosophy"** or read *The Moral Animal* by Robert Wright. It applies evolutionary biology to moral intuition, which might bridge your background with your new interest.

  **Summary:** There is no N=1000 study of the pond. It is a logical trap, not a behavioral study. But the psychological data on *why* we fail to act (bystander effect, identifiable victim) is robust and well-replicated.
