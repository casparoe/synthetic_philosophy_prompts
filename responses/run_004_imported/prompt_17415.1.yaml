prompt: |-
  So I'm a retired biologist who's gotten pretty into philosophy this past year, and I keep coming back to Peter Singer's drowning child experiment from that famous 70s essay of his (Famine, Affluence and Morality, I think it was called). I get the argument about why it means we should give more to charity, but what I can't find anywhere is the actual data - what the sample size was, what percentage of people who walked past the pond actually stopped to pull the kid out versus kept walking so they wouldnt ruin their clothes. Was this ever replicated by other researchers, or is it one of those famous psych results that didnt hold up once people tried to reproduce it?
