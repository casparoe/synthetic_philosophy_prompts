      *   *Renata's Defense:* Needs to appeal to *essentialism*, *platonism vs. theism*, or the *concept of perfection*. She might argue that "Good" isn't a property God *has*, but what God *is*.
      *   *Josh's Counter:* Needs to press on *intelligibility*. If we can't say *why* that nature is good without referencing the nature itself, is "Good" just a synonym for "God-like"?

  3.  **Drafting - Exchange by Exchange:**

