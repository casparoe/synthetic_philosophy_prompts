      4.  Trader Selection/Arbitrariness (Point 2).
      5.  Follow-up on Divergence.
      6.  Deductive Process Dependence (Point 2 extension).
      7.  Exploitability vs. Truth (Point 3).
      8.  Follow-up on Epistemology vs. Pragmatics.
      9.  Connection to Decision Theory (Podcast theme).
      10. Closing/Next Steps.

      *Wait, I need to ensure the specific 3 points are clearly mapped.*
