      *   **Tone:** Respectful, intellectual but grounded in the specific situation. Not a dry lecture.

  3.  **Key Philosophical Points to Integrate:**
      *   **Moore's *Principia Ethica*:** The concept of "Organic Unities." The value of a whole is not simply the sum of the value of its parts.
      *   **The Aesthetic Experience:** Is the value *in* the sensation or *in* the relation between the sensation and the object?
