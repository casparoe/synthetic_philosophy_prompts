  *(Self-Correction during final review)*: Make sure Marcus explicitly addresses the "exploitation" point. If he doesn't, Elena wins by default. Marcus needs to argue that a theory incorporating regret *is* exploitation-proof because it accounts for the emotional cost of switching. Or, he argues that the "money pump" requires a specific framing that doesn't hold in single-shot decisions. Let's go with the idea that the utility of an outcome depends on the foregone alternative (Regret Theory), which makes the preferences consistent *within that broader framework*.

