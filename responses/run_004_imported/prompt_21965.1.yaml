answer: |-
  Here is the tie-breaker you asked for, with no hedging.

  ### Part 1: What Augustine Actually Argued
  **Verdict: Your friend is right about Augustine.**

  Your interpretation of Augustine relies on a medium-based distinction (words vs. actions), but Augustine's ethics are based on an *intent-based* distinction rooted in semiotics (the study of signs).

  In *De Mendacio* (On Lying) and *Contra Mendacium* (Against Lying), Augustine defines a lie not merely as a false statement, but as a **false signification made with the intention to deceive** (*enuntiatio cum voluntate fallendi*). For Augustine, human communication functions through "signs" (*signa*). Words are signs, but so are gestures, uniforms, signals, and yes, military deployments.

  If you place a dummy tank on a ridge, you are deploying a physical sign intended to signify "an army is here." If there is no army, you are signifying a falsehood. If your goal is to make the enemy believe that falsehood, you have the *voluntas fallendi* (will to deceive).

  Augustine does make one crucial distinction that might look like a loophole but actually tightens his trap: the difference between **concealing the truth** (*occultatio veritatis*) and **manifesting falsehood** (*prolatio falsitatis*).
  *   **Camouflage:** This conceals the truth. You are hiding a real tank. Augustine generally allows this, as you are not actively asserting a falsehood, merely withholding information you are not obliged to share.
  *   **Decoys/Ruses:** This manifests falsehood. You are actively creating a sign (the dummy tank) that asserts existence where there is none.

  Augustine explicitly addresses the "greater good" argument (like Consentius's proposal to infiltrate heretics) and shuts it down completely. He argues that sin is a disorder of the will, and you cannot commit a disorder (lying) to achieve an order (stopping heretics). To Augustine, truth is a participation in the nature of God (*Deus Veritas*). To intentionally create falsehood in another human mind is to sever your connection with God, regardless of the consequences.

  So, while Augustine might permit camouflage (concealment), his logic absolutely condemns decoys, fake radio chatter, or undercover infiltration (manifesting falsehood). Your friend is correct: his framework is internally consistent, and it commits him to condemning most active military deception, not just verbal lies.

  ### Part 2: Which Ethical Framework Holds Up Better?
  **Verdict: You are right about the ethics.**

  While your friend wins on historical exegesis, you win on philosophical viability. Augustine's framework is metaphysically beautiful but ethically brittle. The "Standard View" (which aligns with Just War Theory and modern deontology) is superior because it grounds truth-telling in **justice and rights** rather than **metaphysical purity**.

  Here is the decisive argument for why the Standard View wins:

  **1. The "Right to the Truth" Argument**
  Augustine treats truth-telling as a duty owed to God, regardless of the recipient. This creates moral absurdities. If a murderer asks you where your friend is hiding, Augustine argues you must not lie, because lying is an intrinsic evil that damages your soul. This prioritizes the moral purity of the speaker over the life of the victim.

  The Standard View argues that truth-telling is a duty owed to *other people* based on a implicit covenant of trust. In normal conversation, there is a mutual agreement to exchange truth. In war, or against a murderer, that covenant is broken. The enemy combatant or the murderer has **forfeited their right to the truth** by engaging in hostile action. Therefore, deceiving them via ruses (or even words) violates no justice. This framework prevents the "clean hands" complicity problem where the moral agent refuses to lie and thereby becomes an accessory to a greater evil.

  **2. The Arbitrariness of the "Word vs. Action" Distinction is a Red Herring**
  You argued that the Standard View distinguishes between words and actions. Philosophically, the strongest version of the Standard View doesn't actually rest on physics (vocal cords vs. muscles); it rests on **convention**.
  *   A white flag is an action, but it carries a conventional promise of parley. Violating that is *perfidy* (forbidden).
  *   A dummy tank is an action, but in the context of war, it carries no promise of truth. It is understood as part of the adversarial game.
  *   A statement to a friend carries a high convention of trust.

  Augustine's framework fails to account for context. It treats a lie to a genocidal maniac the same as a lie to a spouse. The Standard View correctly identifies that moral obligations are **relational**. When the relationship is adversarial (war), the rules of communication change. When the relationship is cooperative (friendship, surrender), the rules tighten.

  **3. Practical Sustainability**
  Augustine's view is unsustainable for public morality. If adopted strictly, it would render national defense nearly impossible (banning strategic deception) and make personal protection morally hazardous (banning lying to predators). An ethical system that requires the abandonment of the vulnerable to maintain the purity of the protector is fundamentally flawed. The Standard View allows for the protection of the innocent without sacrificing the core prohibition against *perfidy* (betraying specific trusts like surrenders or medical neutrality).

  ### The Final Tie-Breaker

  **Your friend is right about the text; you are right about the truth.**

  Augustine *does* logically condemn non-verbal ruses that manifest falsehood, and his consistency on this is admirable in a theological vacuum. However, his framework fails because it treats truth as a static commodity rather than a relational obligation.

  The Standard View holds up better because it distinguishes between **betrayal** (breaking a trust, which is always wrong) and **strategic deception** (withholding or masking information from an adversary, which is permissible). Augustine collapses this distinction, leading to a moral system that values the speaker's soul over the listener's life. The Standard View correctly prioritizes justice and the protection of the innocent over the metaphysical purity of the agent.

  **Winner:** You. The rigidity of Augustine's framework is a bug, not a feature, when applied to a complex, fallen world.
