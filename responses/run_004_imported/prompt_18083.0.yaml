answer: |-
  This is the central aporia in Ash'arite action theory, and you are right to identify that the secondary literature often smooths over the metaphysical cost of Ghazālī's solution. Ghazālī wants to deny created efficient causality (*ta'thīr*) to preserve divine omnipotence, yet he wants to affirm human responsibility (*taklīf*) to preserve divine justice. *Kasb* is the bridge, but as your intuition suggests, the bridge often looks like a mirage when inspected against the strictures of the *Tahāfut*.

  Below are two structurally parallel scenarios constructed using Ghazālī's ontological commitments, followed by an analysis of whether *kasb* can sustain the distinction between them.

  ### The Scenarios

  **Scenario A: The Intentional Strike (Case of *Kasb*)**
  Zayd is angered by 'Amr. At time *t₁*, God creates in Zayd's soul an accident of "will" (*irādah*) directed at striking 'Amr. Simultaneously, God creates in Zayd's muscles a specific created "power" (*qudrah*) concomitant with that will. At time *t₂*, God creates the motion of Zayd's arm extending and the contact with 'Amr. According to Ghazālī, there is no causal effluence from the will or the power to the motion; rather, God has instituted a habit (*'ādah*) whereby the creation of this specific internal complex (will + power) is invariably followed by the creation of this specific external motion. Zayd experiences this as "I am striking."

  **Scenario B: The Epileptic Jerk (Case of *Idtirār*/Compulsion)**
  Zayd suffers from a neurological disorder. At time *t₁*, God creates in Zayd's soul/nerves an accident of "compulsion" (*idtirār*) or a spasmodic urge. Simultaneously, God creates in Zayd's muscles a physiological state (distinct from the *qudrah* of Scenario A). At time *t₂*, God creates the motion of Zayd's arm extending and the contact with 'Amr. There is no causal effluence from the urge to the motion; rather, God has instituted a habit whereby the creation of this internal spasmodic complex is invariably followed by the creation of this specific external motion. Zayd experiences this as "My arm is moving."

  **The Structural Parallel:**
  1.  **Ontology:** In both cases, every substance and accident (will, urge, power, motion) is created directly by God at every moment.
  2.  **Causality:** In both cases, there is zero efficient causal power (*ta'thīr*) in the created realm. The link between internal state and external motion is purely habitual (*'ādah*), identical in metaphysical status to the link between fire and cotton burning.
  3.  **Locus:** In both cases, the internal states and the external motions inhere in Zayd as the substrate (*mahall*).

  ### The Ghazālian Distinction: *Qudrah Muqārina*

  Ghazālī's primary resource for distinguishing these cases is the specific quality of the internal accident created by God. In *Al-Iqtiṣād fī al-Iʿtiqād* and the *Tahāfut*, Ghazālī argues that *kasb* requires a **concomitant power** (*qudrah muqārina*).

  *   **In Scenario A:** The internal accident is a "power" (*qudrah*) that is *specific* (*muḥaṣṣalah*) to the act. It is an attribute that makes the act possible *for the agent*, even if God is the one who actualizes it. Crucially, this power is coupled with **knowledge** (*'ilm*) of the object willed. Zayd knows he is striking before the strike occurs.
  *   **In Scenario B:** The internal accident is a "compulsion" (*idtirār*). While it is an internal state, it lacks the specific modality of *qudrah*. It is not a power *to do*, but a state *of being acted upon*. Furthermore, it is often (though not always) accompanied by a lack of specific foreknowledge of the motion's exact trajectory, or a phenomenological sense of alienation from the act.

  For Ghazālī, the difference is not in the *causal mechanism* (which is null in both), but in the **nature of the created accident** that precedes the motion. One accident is defined as "will/power," the other as "compulsion." God creates the former in cases of accountability and the latter in cases of exemption.

  ### Does *Kasb* Hold, or Does It Collapse?

  Here is the hard truth for your dissertation: **Ontologically, within the strict bounds of Ghazālī's occasionalism, *kasb* collapses into a distinction without a *causal* difference, though Ghazālī attempts to save it as a distinction of *immediate intuition* (*darūrah*).**

  Here is why the resources are insufficient to draw a principled metaphysical line:

  **1. The Regress of Creation:**
  If God creates the motion in both scenarios, and God also creates the internal state (Will in A, Compulsion in B) in both scenarios, then God is the sole author of the entire sequence in both cases. If the link between Will and Motion is non-causal (per the Fire/Cotton argument), then the Will is merely a *sign* that God will create the motion, not an *explanation* of it.
  In Scenario B, the Compulsion is also a *sign* that God will create the motion.
  Metaphysically, the Will and the Compulsion play the exact same role: they are non-causal occasional triggers that God has habitually linked to a motion. If the Fire/Cotton argument strips fire of efficacy because the connection is contingent and God-created, it must strip the Human Will of efficacy for the exact same reasons. To grant the Will a unique status of "acquisition" while denying the Fire "causation" is to make an exception that the metaphysics does not support.

  **2. The Problem of Normative Quality:**
  For *kasb* to ground praise or blame, the "acquisition" must be something the agent *owns* in a way they do not own the sneeze. But since God creates the "Will" in Scenario A just as He creates the "Compulsion" in Scenario B, Zayd does not create the basis of his own accountability.
  Ghazālī tries to solve this by saying accountability attaches to the *kasb*, not the creation of the act. But *kasb* is defined by the presence of the created *qudrah*. Since God creates the *qudrah*, God determines who acquires and who does not. The distinction between A and B rests entirely on which internal accident God chooses to create. The line is drawn by Divine Decree (*qadar*), not by a structural feature of agency that distinguishes the agent from the reflex.

  **3. The Retreat to Phenomenology:**
  Ghazālī knows this tension. In the *Tahāfut* (Discussion 17), he essentially admits that the *kayfiyyah* (modality) of *kasb* is unknowable by reason. He argues that we know the difference between moving our hand and our hand shaking not by metaphysical deduction, but by **necessary immediate knowledge** (*'ilm ḍarūrī*).
  He writes: *"The meaning of 'power' and 'acquisition' is understood by necessity... just as we know the difference between hunger and satiety."*

  ### Verdict

  **The example shows that "acquisition" collapses into a distinction without a *metaphysical* difference, but Ghazālī insists it remains a distinction of *experiential* fact.**

  If you demand a principled line based on **efficient causality** or **ontological independence**, *kasb* fails. It cannot explain why the Will is an "agentive trigger" and the Compulsion is not, given that neither triggers anything. They are both inert accidents created by God.

  However, Ghazālī would argue you are asking the wrong question. He is not offering a theory of *mechanism*; he is offering a theory of *description*. He posits that God creates two types of sequences:
  1.  Sequence A: Will + Power + Motion (Labeled: *Kasb*/Action)
  2.  Sequence B: Urge + Spasm + Motion (Labeled: *Idtirār*/Reflex)

  God attaches moral valuation to Sequence A and not Sequence B. The "principle" distinguishing them is not a causal power inherent in the human, but a **taxonomic distinction in the created accidents** that is self-evident to the subject.

  **For your PhD work:** The critical move is to argue that Ghazālī's occasionalism is so thoroughgoing that it eats its own tail. By reducing the Will to just another created accident with no *ta'thīr*, he renders it metaphysically indistinguishable from the spasmodic urge. He saves *kasb* only by fiat—by asserting that we *feel* a difference that our metaphysics cannot explain. This leaves *kasb* vulnerable to the charge that it is a linguistic convenience to preserve the language of the Law (*Sharī'ah*) while denying the reality of agency required to make that language meaningful.

  The distinction holds **phenomenologically** (for the believer) but collapses **ontologically** (for the metaphysician). If your project is on theories of action, this collapse is the fatal wound; if your project is on Ghazālī's theology, this collapse is the intended feature (preserving mystery/*ghayb*).
