      *   **The Problem:** The statue melted into a lump. It can be recast using the *original* melted bronze + original maquette + photogrammetry to look identical.
      *   **The Conflict:**
          *   *Insurer:* Says it's a "repair" (material survives, appearance restored).
          *   *Donor Descendants:* Say it's a "total loss" (the *statue* is gone, even if the metal remains; a recast is a copy).
          *   *Policy:* Values based on whether "the extant original work" survives (undefined).
      *   **Constraints:**
