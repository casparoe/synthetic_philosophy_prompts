answer: |-
  **MEMORANDUM**

  **TO:** Art & Monuments Committee
  **FROM:** [Your Name], Philosophy Department
  **DATE:** October 24, 2023
  **SUBJECT:** Determination of Identity: The [Memorial Name] Lightning Incident

  **The Question**
  Our insurance policy turns on a single undefined phrase: whether "the extant original work" survives. We are not debating finances; we are debating metaphysics. We must decide if the memorial is defined by its *matter* (the bronze alloy) or its *form and history* (the specific arrangement weathered by ninety years of existence).

  **The Case for Repair (The Insurer's Position)**
  The adjuster's position rests on **Material Continuity**. In common law and ordinary property logic, an object is identical to its constituent matter. If a silver coin is melted into a lump and recast into the same coin, it remains the same coin because the silver atoms persist. The adjuster argues that the bronze was never destroyed, only deformed. Since we possess 100% of the original material and the original design specifications (the maquette), the recasting is merely a "repair" of the form. To claim otherwise is to privilege aesthetics over substance, allowing a functional object to be declared dead simply because it looks wrong for a moment. This view prioritizes physical persistence and minimizes disruption.

  **The Case for Total Loss (The Descendants' Position)**
  The descendants' position rests on **Formal and Historical Integrity**. In art conservation and philosophy, a statue is not a pile of metal; it is a specific event in time. The memorial's value lies in its continuous history as a witness—the specific patina, the micro-fractures, and the unbroken trajectory from its unveiling to last month. Lightning did not just deform the statue; it terminated its existence as a statue. A recast, even using the original metal, is a new instance of the design, not a restoration of the object. It is a twin, not a survivor. To call this a "repair" is to confuse the *score* with the *performance*. The music survived on the page (the maquette), and the instruments survived (the bronze), but the performance ended when the lights went out.

  **Recommendation**
  I recommend the Committee classify this as a **Constructive Total Loss**.

  While the Insurer's argument holds for commodities, it fails for singular artworks. A war memorial derives its sanctity from being a specific historical witness. That witness was silenced when the form melted. We can build a new memorial, and we should arguably use the original bronze to do so as a gesture of continuity, but we must acknowledge that the *object* insured—the ninety-year-old veteran of the quad—is gone.

  Paying the "Original Work" valuation honors the policy's intent to protect the *work*, not just the scrap value of its materials. It allows the University to commission a restoration that acknowledges the break in history, rather than pretending the last ninety years can be melted down and poured out again without consequence.

  **Action Required**
  Authorize the filing of a Total Loss claim. Simultaneously, authorize the Foundry to retain the scrap bronze for the eventual recasting, not as a repair of the old, but as the material foundation of the new.
