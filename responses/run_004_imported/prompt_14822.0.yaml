      *   **Recommendation:** Specific policy change.
          *   Require "functional assessment of decision-making capacity" separate from diagnostic agreement.
          *   Require documentation of *risk* linked to the lack of insight, not just the lack of insight itself.
      *   **Timeline:** Concrete steps (Drafting, Training, Implementation, Review).
      *   **Closing:** Reiterate the shared goal (patient safety + civil liberties).

  5.  **Refining the Tone:**
      *   *Avoid:* "You guys are violating rights."
