  ### Justifications

  **S-Tier (The Core Case for Updatelessness/Functional Decision)**
  *   **Counterfactual Mugging:** The definitive case for updatelessness. Once the coin flip is known (tails), both CDT and *updated* EDT refuse to pay, as the payment has no causal or evidential impact on the past flip. UDT pays because it optimizes the policy *ex ante*, securing the reward in the counterfactual heads-world.
  *   **Transparent Newcomb:** Unlike standard Newcomb, you observe the money in the box. Standard EDT often two-boxes here because the observation screens off the correlation. UDT one-boxes by ignoring the indexical evidence and sticking to the *ex ante* optimal policy, isolating the "updateless" component specifically.
  *   **XOR Blackmail:** Designed to separate FDT/UDT from both CDT and EDT. CDT and EDT typically pay the blackmail (thinking payment influences the sending or is evidence of truth); UDT refuses, breaking the logical correlation between the payment policy and the blackmailer's prediction.
  *   **Agent Simulates Predictor (ASP):** Crucial for AI safety. When a predictor simulates the agent to make a prediction, CDT fails to recognize the logical correlation between its output and the simulation's output. UDT handles this by treating the simulation as a logical instantiation of the same decision algorithm.

  **A-Tier (Strong Wedges, but EDT Often Agrees)**
  *   **Newcomb's Problem:** The classic divergence, but EDT also one-boxes. It forces a wedge between CDT and (UDT/EDT), but doesn't uniquely motivate *updatelessness* over evidential reasoning unless combined with transparency or counterfactuals.
  *   **Parfit's Hitchhiker:** A sequential Newcomb problem. CDT fails to pay upon arrival (causal leverage is gone); UDT pays to maintain the policy that gets you rescued. EDT also pays, so it's primarily an anti-CDT case.
  *   **Absent-Minded Driver:** Highlights dynamic inconsistency in CDT due to imperfect recall. UDT solves this via global policy optimization. EDT struggles with self-locating beliefs here, making it a strong case for UDT, though slightly more technical than the mugging cases.
  *   **Logical Counterfactual Mugging:** A formalization of Counterfactual Mugging using logical facts (e.g., parity of a digit of pi) rather than empirical chance. It strengthens the case by removing any ambiguity about "causal influence" on random events, but functions similarly to the empirical version.

  **B-Tier (CDT Instability / Common Cause Problems)**
  *   **Death in Damascus:** Primarily demonstrates CDT's decision instability (oscillation) in the face of a perfect predictor. UDT and EDT both conclude that death is unavoidable; the case discriminates CDT from the rest, but doesn't distinguish UDT from EDT.
  *   **Psychopath Button:** A common-cause problem where CDT presses the button (ignoring that only psychopaths press) and EDT/UDT do not. Like Damascus, this motivates moving away from CDT, but doesn't uniquely justify the *updateless* aspect of UDT over standard EDT.

  ***

  ### On Death in Damascus and the Psychopath Button

  You are right to be suspicious of including these in a list specifically about **updatelessness**.

  Both cases are primarily arguments against **Causal Decision Theory's handling of common causes**, rather than arguments for **Updatelessness**. In both scenarios, Evidential Decision Theory (EDT) yields the same verdict as UDT (don't press the button / accept that death is inevitable). The failure mode of CDT here is that it treats its decision as causally independent of the predictor's prior state, ignoring the evidential correlation.

  UDT solves these cases, but it solves them for the same reason EDT does: by acknowledging the correlation between the decision algorithm's output and the predictor's simulation. The "updateless" component—optimizing a policy from a prior state before receiving specific observations—isn't doing the heavy lifting here. The heavy lifting is done by **acausal correlation** (or logical correlation).

  If your reading group's debate is specifically about whether UDT earns its keep *over and above* EDT (or whether it's just CDT with better causal modeling), these two cases are weak evidence. They show why CDT is wrong, but they don't show why UDT is *uniquely* right. For that, you need cases where EDT fails upon updating (like Transparent Newcomb or Counterfactual Mugging), which is why those sit in the S-Tier.
