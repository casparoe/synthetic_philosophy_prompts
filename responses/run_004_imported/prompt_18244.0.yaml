  4.  **Refining the Dialogue (Self-Correction during drafting):**
      *   *Check:* Did I make Elena sound like a dogmatist? *Correction:* Make sure she grounds her argument in the multiplicative nature of the desk's capital. It's not her money; it's the fund's compounding engine.
      *   *Check:* Did I make Marcus sound like a coward? *Correction:* Make sure his argument is about *utility*, not just fear. He represents the reality of human capital and investor redemptions.
      *   *Check:* Are the math specifics accurate?
