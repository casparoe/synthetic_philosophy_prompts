answer: |-
  This is a profoundly moving connection to make, and your instinct to look to Sidgwick in the wake of your grandmother's death and your aunt's search for comfort is remarkably apt. You have stumbled upon one of the most significant, yet often overlooked, aspects of Sidgwick's intellectual biography.

  To answer your question directly: **No, your working assumption is not quite fair.** While it is a common interpretation to view Sidgwick's psychical research as a private, sentimental hobby distinct from his professional philosophy, modern scholarship (particularly the work of biographers like Bart Schultz and philosophers like Jeremy Schneewind) suggests the opposite.

  Sidgwick's involvement with the Society for Psychical Research (SPR) was not a departure from his ethical rigor; it was an **extension of it.** The two projects were inextricably linked. To understand why, we have to look at the specific problem that haunted his ethics.

  ### 1. The Ethical Problem: The Dualism of Practical Reason
  In *The Methods of Ethics*, Sidgwick identifies a catastrophic problem at the heart of secular morality. He argues that there are two primary rational methods for deciding how to live:
  *   **Rational Egoism:** It is rational to pursue my own happiness.
  *   **Utilitarianism:** It is rational to pursue the general good.

  In a perfectly ordered universe, these two should align. Doing the right thing should ultimately lead to the agent's happiness. However, in the observable, natural world, they often conflict. Being moral sometimes requires significant self-sacrifice with no earthly reward.

  Traditionally, Christianity solved this "Dualism of Practical Reason" by positing an afterlife where divine justice ensures that virtue is eventually rewarded and vice punished. But Sidgwick, a Victorian intellectual living through a crisis of faith, could not simply assume religious dogma was true. He needed empirical or rational grounds for believing that the universe was morally ordered.

  If there is no afterlife and no divine sanction, Sidgwick feared that morality might not be fully "rational." If being good makes you miserable and being bad makes you happy, and death is the end, why be good?

  ### 2. Psychical Research as Ethical Inquiry
  This is where the SPR comes in. Sidgwick did not turn to mediums because he was grieving or credulous; he turned to them because he was **desperate for data.**

  He hoped that psychical research could provide empirical evidence for survival after death. If science could prove that consciousness survives the body, it would reopen the door to the possibility of divine sanctions and cosmic justice. It wouldn't prove Christianity, but it would prove that the materialist view of death was wrong, thereby saving the rationality of morality from the Dualism.

  As he wrote in a letter to a friend, his interest in psychical research was driven by the need to find "a basis for religion" that could withstand scientific scrutiny. He was looking for a "scientific miracle" that would reconcile duty and self-interest.

  ### 3. Re-evaluating His Rigor
  You mentioned that you view his two decades of "null results" as a poignant but inconsequential footnote. I would suggest viewing them instead as the ultimate testament to his scrupulousness.

  Sidgwick applied the same ruthless skepticism to the mediums he investigated as he did to ethical intuitions. He was instrumental in exposing frauds (such as the famous medium Eusapia Palladino, whom he investigated with caution). He never claimed to have found proof. He remained an agnostic on the matter until the end.

  The tragedy and the integrity of Sidgwick's position lie in this tension:
  *   He **needed** the afterlife to be true to make his ethical system fully coherent.
  *   He **refused** to believe it was true without adequate evidence.

  He lived with the "Dualism" unresolved. He did not retreat into sentimental belief (which would have been intellectually dishonest) nor did he retreat into dogmatic materialism (which would have destroyed the rational basis for morality). He held the tension open.

  ### 4. How This Might Help You Speak with Your Aunt
  Understanding this connection changes how you might frame this for your aunt. If you approach her thinking Sidgwick was a skeptic who dabbled in ghosts, you might inadvertently validate the idea that her search is "unscientific." But if you understand Sidgwick's actual motivation, you can validate the *human need* behind her search without validating the *medium's claims.*

  Here is a way to think about it:

  **Sidgwick validates the question, not the answer.**
  Sidgwick agrees with your aunt that the question of survival matters. It is not a trivial or silly question. It matters for how we live, how we grieve, and how we understand morality. He would agree that the comfort she feels is significant, because human happiness and moral coherence are the stakes of the game.

  **Sidgwick validates the method of inquiry.**
  However, Sidgwick would urge that we seek the truth about that comfort with "scrupulous self-criticism." He would argue that we should not accept easy answers (like a medium's specific claims) if the evidence is thin, because truth is the highest good. But he would also argue that we should not close our minds to the possibility of the unknown.

  **A Proposed Synthesis**
  You might tell your aunt something like this:
  *"I've been thinking about the reading, and I read about a philosopher named Henry Sidgwick. He was one of the most rigorous thinkers of the 19th century, but he spent years investigating mediums, just like we did. He didn't do it because he was gullible; he did it because he thought knowing whether we survive death was the most important question for how we live. He never found the proof he wanted, but he never stopped thinking the question mattered. I think he would say that the comfort you feel is real and valuable, even if the mechanism is mysterious. We don't have to prove the physics of the spirit to value the love that remains."*

  ### Summary
  Sidgwick's psychical research was not a sentimental sidebar; it was an attempt to solve the foundational crisis of his ethical system using the scientific tools of his day. He failed to find the evidence, but his refusal to pretend he had found it—or to pretend the question didn't matter—is the very definition of the integrity you admire in him.

  You are right to feel unsettled by the comfort the medium provided. Sidgwick would tell you that discomfort is the price of intellectual honesty. But he would also tell you that the *need* for that comfort is not a weakness; it is a recognition of the stakes of human existence.
