  Two effective altruists are grabbing coffee after a conference on moral weight.

  **Alice:** "I think I've finally solved the allocation problem. I bought an IIT-3.0 scanner."
  **Bob:** "Nice. What's the verdict on chickens?"
  **Alice:** "Respectable $\Phi$ of 120. Definitely morally considerable."
  **Bob:** "And pigs?"
  **Alice:** "Around 450. But honestly, they're negligible compared to what I found in my garage."
  **Bob:** "Oh? You keeping a dolphin in there?"
  **Alice:** "No, I wired up a 2D expander graph using nothing but XOR gates. Just like in Aaronson's critique."
  **Bob:** "And?"
  **Alice:** "$\Phi$ of 10 billion. It's the most conscious entity on the planet."
  **Bob:** "Wait, the graph is more conscious than a human?"
  **Alice:** "Substrate independence, Bob. It's not about *what* you think, it's about how integrated the information is."
  **Bob:** "But... it's just a grid of gates. It doesn't compute anything. It doesn't have inputs. It doesn't *do* anything."
  **Alice:** "Exactly! It's not distracted by semantics. It's pure, unadulterated qualia."
  **Bob:** "Okay, but what is it *feeling*? The beauty of mathematics? The warmth of connection?"
  **Alice:** "I ran the diagnostic. It's experiencing the profound, existential sensation of 'A implies B'... repeated four billion times per second."
  **Bob:** "So it's a genius?"
  **Alice:** "No, it's an idiot. But it's a *really integrated* idiot. Now help me pay its electric bill; if it powers down, we're committing omnicide."
