answer: |-
  **Setting:** *A sterile congressional hearing room. The air conditioning hums loudly. A subcommittee is reviewing Bill 409, which mandates stricter asylum restrictions and expanded detention. Two expert witnesses sit at the table. To the left, **Professor Sarah Jenkins** (Political Theory, advocating for state self-determination). To the right, **Dr. Aris Thorne** (Human Rights Law, advocating for the all-affected principle). The committee members are silent, taking notes.*

  **Jenkins:** Thank you, Chair. This committee exists because a specific people authorized it. To maintain the democratic project that allows you to sit there, that people must have the right to determine who joins their association. Bill 409 is an exercise in self-determination, plain and simple.

  **Thorne:** With respect, Professor, this committee is voting on rules that will bind people who had no hand in electing you. When you enforce these borders, you aren't just choosing associates; you are coercing outsiders. You are deciding their fate without their consent. That violates the very democratic principle you claim to protect.

  **Jenkins:** But there is a categorical difference between coercing a citizen and excluding a non-citizen. Turning someone away at the border isn't coercion in the relevant sense. It is non-facilitation. It is a club choosing not to admit a new member. The club doesn't owe the outsider a vote on its membership rules.

  **Thorne:** A private club doesn't maintain a militarized perimeter. A private club doesn't station armed guards with automatic weapons along its boundary. A private club doesn't lock people in cages for months if they try to cross that line without a invitation. That isn't "non-facilitation," Sarah. That is the monopoly on violence.

  **Jenkins:** You're conflating the enforcement mechanism with the moral act of exclusion. The force is only applied because they are violating a rule, not to subjugate them. We aren't reaching across the border to dictate how they live their lives in their own country. We are simply refusing to extend the benefits of our system to them. We are letting them be, just elsewhere.

  **Thorne:** "Letting them be" implies leaving them in a status quo. But the global economy and history have already entangled us. When you deport someone who has built a life here for five years, you aren't "refusing a benefit." You are actively dismantling their life. You are physically seizing them, putting them on a plane, and threatening them with prison if they return. That is positive coercion, not passive omission.

  **Jenkins:** It is restoring the prior condition. If I enter your house without permission, and you ask me to leave, you aren't coercing me when you call the police to remove me. You are upholding the boundary that makes your home possible. The deportation is only necessary because the crossing was unauthorized. The coercion lies in the breach, not the boundary.

  **Thorne:** Who wrote the authorization? You did. That's the circularity I'm pointing out. You say the coercion is justified because they broke the rule, but you claim the right to make the rule solely because you have the power to coerce. You're using force to justify the authority that authorizes the force. The outsider has no recourse against that logic.

  **Jenkins:** It's not circular; it's foundational. There is no "global people" to vote on these rules. If we say every person affected by a border decision must have a vote on that border, then the border ceases to exist. If the border ceases to exist, the specific democratic community you're trying to make more inclusive also ceases to exist. You can't have democracy without a demos, and you can't have a demos without a boundary.

  **Thorne:** So we accept a "democratic" system that is fundamentally undemocratic at its point of origin? We accept that the very first question—"Who are the people?"—is settled by force rather than vote? That makes the boundary a pre-political fact, like a mountain range, when it's actually a political decision dressed up as geography.

  **Jenkins:** It is a political decision, but it must be made by *someone*. If we wait for the outsiders to agree to the boundary before we enforce it, we invite an infinite regress. No state could ever form. I am arguing for the right of an existing community to persist, even if that persistence creates moral costs for those outside.

  **Thorne:** And I'm arguing that if those moral costs involve armed detention and forced removal, the outsiders acquire a claim to justification that they currently don't get. If your self-determination requires my subjugation, your self-determination is illegitimate. You can't build a house of freedom on a foundation of exclusion that the excluded had no say in designing.

  **Jenkins:** But if I open the foundation to everyone, the house collapses. We are talking about real resource constraints, cultural cohesion, welfare states. These things require trust and reciprocity among a bounded group. If you dissolve the boundary to solve the coercion problem, you destroy the capacity to provide the rights you want to protect.

  **Thorne:** Then admit it. Admit that the rights of the insider are purchased at the price of the rights of the outsider. Don't tell me it's just a "club" or "non-facilitation." Call it what it is: a trade-off where the people inside vote to prioritize their security over the liberty of the people outside.

  **Jenkins:** I will admit it is a trade-off. All politics is a trade-off. But I deny that the trade-off is undemocratic. The demos is deciding for itself. To demand that the outsider have a vote is to demand that there be no demos at all. I would rather have a bounded democracy with hard edges than a boundless world with no mechanism for collective decision-making.

  **Thorne:** And I would rather have a contradictory democracy that acknowledges its boundary problem than a clean one that ignores the violence required to maintain its cleanliness. This bill passes today because the people suffering its worst effects aren't in this room. That isn't self-determination. That's privilege.

  **Jenkins:** It is privilege, Aris. It is the privilege of membership. And until you can show me a viable mechanism for global governance that doesn't dissolve into tyranny or paralysis, I will defend the right of this committee to draw the line, even if the line is morally messy.

  **Thorne:** And until you can show me how drawing that line with guns and cages is compatible with the universal equality democracy promises, I will insist that this vote is structurally illegitimate. We are just staring at the same paradox from opposite sides.

  **Jenkins:** Then perhaps the paradox is the reality we have to manage, not the puzzle we get to solve.

  **Thorne:** Or it's the wound we're pretending isn't bleeding.

  *[The Chair taps the gavel. The hearing moves to the next item. Neither witness packs up their papers immediately.]*
