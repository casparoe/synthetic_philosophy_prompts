answer: |-
  This is a fascinating situation because you are absolutely right: this isn't about fantasy football. You have accidentally recreated a classic debate in political philosophy and legal theory. Your league is grappling with the tension between **Constitutionalism** (rule by established law) and **Majoritarianism** (rule by current popular will).

  Here is a breakdown of what is actually going on beneath the surface, followed by an assessment of who has the stronger case.

  ### 1. The Core Philosophical Conflict

  **Side A (The 8 wanting change): The Social Contract Theory**
  Their argument rests on the idea of *consent of the governed*. They argue that a rule set created nine years ago by four specific people cannot bind the current population indefinitely, especially when 66% of the current participants disagree.
  *   **The Principle:** Legitimacy comes from the current participants, not the historical founders. If the rules no longer serve the group, the group should be able to alter them.
  *   **The Grievance:** They feel they are suffering from "Dead Hand Control"—where the decisions of the past strangle the needs of the present.

  **Side B (The 4 holdouts): The Rule of Law**
  Their argument rests on *contractual integrity* and *stability*. They argue that the 75% threshold was a "pre-commitment strategy." By agreeing to it (even implicitly by joining), everyone accepted that some things should be hard to change to prevent rash decisions or bullying.
  *   **The Principle:** Stability protects the league from the "Tyranny of the Majority." If 7 friends join a league and vote to change the rules to benefit their specific players, the 5 outsiders get screwed. The 75% rule prevents that.
  *   **The Grievance:** If you allow the majority to lower the voting threshold to pass a rule, the threshold never meant anything. It renders the Constitution moot.

  ### 2. The "New Owner" Complication

  This is the wrinkle that makes your specific situation unique. In political theory, this is the difference between **Originalists** and **Successors**.

  *   **The Founders' Intent:** The original 4 wanted to prevent chaos. They likely assumed ownership would remain relatively stable or that new owners would buy into the *existing culture*.
  *   **The New Owners' Position:** When the 10 new owners bought their spots, they entered an existing contract. In almost any other context (buying a house with an HOA, joining a country club, buying shares in a company), you inherit the bylaws. You don't get to vote to change the bylaws immediately just because you have a majority.
  *   **The Weakness in Side B:** However, only *one* of the holdouts is an original founder. The other three are new owners using the founders' shield to block the majority. This weakens the "Founder's Intent" argument. They aren't protecting the founders' vision; they are exploiting a procedural loophole.

  ### 3. Who Has the Stronger Case?

  To determine this, we have to decide what metric we are using: **Contractual/Legal** or **Pragmatic/Social**.

  **On Contractual Grounds: Side B (The Holdouts) Wins**
  Strictly speaking, the holdouts are right. When you join an established league, you accept the bylaws as a condition of entry. If the bylaws say "75% to change core rules," then 66% is not enough.
  *   If the league allows the 8 owners to change the voting threshold to 67% so they can pass the scoring change, they are violating the very Constitution they claim to respect. It is a paradox: you cannot use an illegal method to make a legal change.
  *   **Verdict:** If this were a court of law, the 4 holdouts win. The contract is the contract.

  **On Pragmatic/Social Grounds: Side A (The Reformers) Wins**
  Fantasy football is not a government; it is a voluntary hobby. Governments have a monopoly on force; fantasy leagues have a monopoly on fun.
  *   **The Viability Test:** If 8 out of 12 owners are unhappy enough to fight about it for two weeks every off-season, the league is at risk of collapse. A rule that creates this much friction is a "bad rule" in the context of a hobby, regardless of its legal standing.
  *   **The Spirit of the Law:** The 75% rule was designed to prevent *mid-season* chaos and *collusion*. It was not designed to allow a minority to permanently veto a widely popular, off-season quality-of-life improvement. The holdouts are using a shield intended for defense as a sword for obstruction.
  *   **Verdict:** In the context of a social group, the will of the 66% majority carries more weight than the procedural rigidity. If the league dissolves because 4 people refused to bend, the "Rule of Law" victory is Pyrrhic; there is no league left to have rules.

  ### 4. The Actual Disagreement

  The disagreement isn't about scoring. It is about **Exit Rights vs. Voice.**

  In political science (specifically Albert Hirschman's *Exit, Voice, and Loyalty*), when members are unhappy with an organization, they have two options:
  1.  **Voice:** Try to change the organization from within.
  2.  **Exit:** Leave the organization.

  Side A believes they should have **Voice**. They want to fix the league.
  Side B is effectively forcing **Exit**. They are saying, "The rules are the rules. If you don't like them, you can leave."

  The friction exists because Side A feels their **Voice** is being silenced by a procedural technicality, while Side B feels that yielding to **Voice** undermines the structure that keeps the league together.

  ### 5. The Verdict

  **Side A (The Reformers) has the stronger *moral* case, but Side B (The Holdouts) has the stronger *procedural* case.**

  However, in a fantasy league, **moral/pragmatic strength outweighs procedural strength.**

  Here is why: The 75% rule is a *means*, not an *end*. The *end* is a stable, fun, competitive league. If the means (the 75% rule) is now actively destroying the end (causing two weeks of arguing, resentment, and potential league breakup), then the means have failed.

  The holdouts are technically following the rules, but they are violating the **spirit of the league**, which is camaraderie and competition. Using a procedural veto to block a change that "basically everyone agrees is more balanced" suggests bad faith. It implies they enjoy the power of the veto more than they care about the league's health.

  ### Recommendation for Resolution

  Since you asked for an outside opinion on the argument, here is how you resolve it without blowing up the league:

  1.  **The "Grandfather" Compromise:** The scoring change passes for all *new* money or new owners, but the old scoring stays for the original contracts? (Too complicated for fantasy).
  2.  **The Buyout:** The 8 owners who want the change offer to pay the entry fees for the 4 holdouts for next season. It's the price of peace. (Often works).
  3.  **The Nuclear Option (League Split):** The 8 owners leave and start a new league with the rules they want. The 4 holdouts keep the old league.
      *   *Why this is the ultimate tie-breaker:* This usually scares the holdouts into voting "Yes." They realize that without the 8 majority, their "perfectly protected" league will have 4 teams and die.

  **Final Word:**
  Tell your group chat this: **A Constitution that cannot bend will eventually break.** The founders wrote the 75% rule to protect the league from chaos, not to protect a minority from the majority's desire for a better game. If 8/12 owners want the change, the "chaos" the founders feared clearly isn't happening; the consensus is stable. The holdouts are no longer protecting the league; they are holding it hostage.

  The 75% rule should be respected, but not weaponized. If the holdouts cannot articulate a *football reason* for the scoring to stay the same (e.g., "it preserves historical stats"), and are only citing the *voting threshold*, they have lost the moral argument.
