  **Ulysses & Evidence Tampering (A):** These are fatal to the *unrestricted* version (which is why van Fraassen conceded them immediately), but they are easily patched by adding a reliability clause without gutting the principle's core intuition for rational updates.

  **Sleeping Beauty (B):** While it creates tension between Reflection and Conditionalization, this is largely managed by restricting the principle to non-self-locating propositions, making it a boundary issue rather than a fundamental refutation.

  **Clever Bookies (C):** This objection undermines the Dutch Book *argument* for Reflection, but leaves the principle's independent plausibility (as an expert principle) intact, so it damages the justification rather than the thesis itself.
