answer: |-
  The ice on the *Wayfarer's* viewport wasn't water. It was frozen atmosphere, thick and grey, clinging to the glass like a disease. Outside, the planet was a tomb of rock and radiation. Inside, the air recyclers were wheezing, their red warning lights pulsing in time with Elara's heartbeat.

  On the comms screen, Joren's face was bright, flushed with the oxygen of a living world. Behind him, through the viewport of the *Pathfinder*, trees swayed in a wind that actually breathed.

  "We have the beacon ready, El," Joren said. His voice was thick, trying to hide the relief. "Mission Control says we can call the rescue fleet. We can get everyone."

  Elara wrapped her thermal blanket tighter. Her ship's reactor was humming, a low, desperate thrum. It had enough charge to keep her heater running for ten days. Maybe twelve if she slept through the cold. After that, the silence would take her.

  "Then call them," she said. Her breath plumed in the cabin.

  Joren looked down, away from the camera. "I can't."

  The warning light on Elara's console blinked faster. **PROTOCOL 9: TITHE REQUIRED.**

  "The algorithm," Joren said, his voice tight. "It locked the beacon. It says... it says the surplus energy I used to stabilize the landing was allocated *ex ante*. It was given to me on the condition that the losing branch would surrender their core to the grid."

  Elara stared at the prompt. She knew the math. They had all signed the papers before the jump. Before the universe split. Before one of them got the garden and the other got the grave.

  "Joren," she said softly. "You have the energy. You're safe. If I dump my core, I freeze in six hours. If I keep it, I freeze in ten days. My energy doesn't reach you. The jump severed the causal link. You have your battery. I have mine."

  "I know," Joren whispered. "But the beacon won't unlock. The system isn't checking if I *need* it. It's checking if you *pay* it."

  "It's a dead tax," Elara said. The anger was cold, sharper than the air. "I'm paying for a service I won't use. To a brother who doesn't need the money. Just to satisfy a ghost."

  "The ghost is us," Joren said. He looked up, eyes wet. "Six months ago, before the launch, we sat in that room. We didn't know who would land where. We were one team. We agreed that the fleet's survival mattered more than the individual ship's outcome. We agreed that the *policy* had to hold, even in the branches where it hurt."

  "That was then. I'm here now. I'm the one who drew the short straw." Elara's hand hovered over the **OVERRIDE** key. If she pressed it, she disabled the Tithe protocol. She kept her power. She lived a week longer. Joren would sit on his paradise world with a locked beacon, unable to call for rescue, unable to bring the rest of the fleet home. He would be safe, but alone. Humanity would remain scattered.

  If she pressed **INITIATE**, her reactor would vent its remaining plasma into the subspace relay. The energy would dissipate into the void, useless to her, unreachable by him. But the code would register. The beacon would unlock.

  "It doesn't help me," Elara said. "And it doesn't help you. You already have the power."

  "It helps the *we*," Joren said. "The 'we' that existed before the coin flip. That version of us knew this might happen. That version of us decided that being the kind of people who honor the deal was worth more than the extra days of life."

  Elara looked at the reactor gauge. 14%. Enough for warmth. Enough for hope.

  She thought about the briefing room. The smell of stale coffee. The way Joren had laughed when he signed the waiver, confident, arrogant, sure that luck was on his side. She had been confident too. They had both believed they were the heroes of the story.

  Now, the story had branched. The hero was in the garden. The sacrifice was in the ice.

  "If I don't do it," Elara said, "what happens?"

  "Then I stay here," Joren said. "I live a long life. I watch the trees. And I know that I'm only safe because I'm the version of you that got lucky. And I know that the version of me that got unlucky decided luck was all that mattered."

  Elara's fingers trembled. The logic was a knot in her stomach. It felt like madness. To throw away life when it was already in her hand? To pay a debt when the creditor was already rich?

  It was a payment for a past decision. A bill sent to a ghost.

  But if she didn't pay it, the person who signed the check ceased to exist. She would be someone else. Someone who looked at the odds, saw they were lost, and decided the rules no longer applied.

  The cold was seeping into her bones now. The heater was cycling down.

  "El?" Joren asked.

  "I'm cold, Joren."

  "I know."

  "It's stupid. You know that, right? Physically, causally, this changes nothing for me. I die either way."

  "It changes what we are," Joren said. "It proves the prediction right. It proves that we can be trusted to act for the whole, even when the whole can't see us."

  Elara looked at the **INITIATE** button. It was grey, unlit, waiting.

  She thought about the rescue fleet. Thousands of sleepers in the dark. They would only wake up if the beacon fired. The beacon would only fire if the Tithe was paid. The Tithe was only paid if the person on the dead rock decided that a promise made in the light was binding in the dark.

  It wasn about the energy. It was about the consistency of the soul across the split.

  "If I do this," Elara said, her voice barely a whisper, "don't thank me. I'm not doing it for you."

  "I know," Joren said.

  "Tell them... tell the sleepers that we kept the faith."

  Elara took a breath. The air was thin and sharp. She thought of the Elara from six months ago, the one who didn't know she would die on a rock. That Elara had asked her to do this. That Elara had trusted her.

  To refuse would be to betray the only person who truly understood her situation: her past self.

  She moved her hand. She didn't slam it down. She pressed it with a gentle, final pressure.

  **TITHE ACCEPTED.**

  The hum of the reactor changed pitch. It wound down, the warmth in the cabin instantly beginning to fade. The red warning lights turned a steady, solemn green.

  On the screen, Joren's console chimed. A new light ignited behind him. The Beacon.

  "It's done," Joren said. He didn't smile. He looked at her with a terrible, heavy reverence. "The fleet is coming."

  "Good," Elara said. She pulled the thermal blanket up to her chin. The cold was rushing in now, fast and absolute. "Get some sleep, Joren. You've got a long trip home."

  "Elara..."

  "Cut the feed. Save your power."

  Joren hesitated, then nodded. The screen went black.

  Elara sat in the silence of the dead world. The ship was cooling rapidly. She would not see the rescue ships. She would not feel the warmth of the garden. She had traded ten days of shivering hope for a single moment of certainty.

  She closed her eyes and listened to the wind howling outside, sounding almost like a cheer. She had kept the promise. The version of her that mattered—the one who existed before the luck broke—was still alive.

  The cold took her, but it didn't take the deal.
