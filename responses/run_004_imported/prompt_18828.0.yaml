  * Mechanism:* The fuel tanks are entangled. Or, more simply, the "Surplus" is a digital authorization code held in escrow. It releases to Kael only when Elara's telemetry shows core dump.
  *Problem:* That makes it causal. "If you push button, Kael gets fuel." That's just standard trade.
