          *   Anscombe defender? Yes.
          *   Consequentialist disputing? Yes.
          *   Closeness problem raised? Yes.
          *   Lives saved argument raised? Yes.
          *   Anscombean answers *both* directly? Yes.
          *   Engage strongest points? Yes.

  7.  **Final Review against Anscombe's text:** Anscombe argued that Truman's defense (it shortened the war) is exactly the utilitarian calculus she rejects. She argued that the killing was *intended* because the destruction of the cities was the means to the end. I need to make sure Elizabeth captures this "means/ends" relationship clearly.

      *(Refining the "Closeness" rebuttal)*: The Consequentialist will say: "I intend to destroy the factory; I foresee the workers die." Elizabeth must say: "If you know the bomb destroys the factory *by* destroying the workers and the city surrounding it, and that destruction is what coerces the enemy, you intend the destruction of the innocents."

      *(Refining the "Consequences" rebuttal)*: Elizabeth must argue that certain actions are "forbidden regardless of consequences." This is the core of her anti-consequentialism. It's not just about rule-following; it's about the nature of human good.

