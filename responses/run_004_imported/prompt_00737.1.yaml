answer: |-
  **Setting:** *A quiet corner of an Oxford common room, late evening. The rain beats against the leaded windows. ELIZABETH, a moral philosopher of the Aristotelian-Thomist tradition, sits across from JULIAN, a utilitarian ethicist. Between them lies a copy of Anscombe's "Mr. Truman's Degree."*

  **Elizabeth:** You've read the pamphlet, Julian. You know why I opposed the degree. To award it was to honor a man who, by the plainest standard of moral law, committed murder.

  **Julian:** I have read it, Elizabeth. And I respect Anscombe's courage. But I cannot accept the verdict. It rests on a fragile architecture. Specifically, it rests on the Doctrine of Double Effect and a rigid distinction between what is intended and what is merely foreseen. When you apply pressure to that distinction, it cracks.

  **Elizabeth:** Then apply the pressure. Let us see if it holds.

  **Julian:** Very well. Consider the "closeness problem." Anscombe claims Truman *intended* the death of the civilians in Hiroshima. But why? Suppose Truman's description of his own action was this: "I am destroying the military and industrial capacity of the Hiroshima garrison to force a surrender." The civilian deaths were a foreseen, inevitable, but regrettable side effect of destroying the target. Under the Doctrine of Double Effect, if the act itself is not evil (destroying a military target), and the bad effect is not the means to the good effect, it is permissible. By redescribing the intention, Truman escapes the charge of murder. He didn't mean to kill them; he meant to stop the war, and killing them was just the tragic cost.

  **Elizabeth:** That redescription fails because it ignores the *mechanism* of the coercion. You say the bad effect—civilian death—is not the means to the good effect—surrender. But how, precisely, was the surrender to be secured?

  **Julian:** By demonstrating the futility of resistance.

  **Elizabeth:** Exactly. And what constituted that demonstration? It was the obliteration of a city *as a city*. If Truman had dropped a bomb that destroyed the munitions factories but left the surrounding houses and people untouched, would it have achieved the psychological shock required to break the Imperial will?

  **Julian:** Probably not. The shock relied on the scale of devastation.

  **Elizabeth:** Then the devastation of the civilian population was not a side effect; it was the instrument. To intend the end is to intend the necessary means. If the means of securing surrender is the creation of a spectacle of mass death, then the mass death is intended. You cannot say, "I intend to shock them by killing everyone," and then claim, "I do not intend the killing." That is a corruption of the concept of intention. It is not a psychological report of what Truman felt in his heart; it is a description of what he chose to do. He chose to kill innocents to achieve a political end. That is the definition of murder.

  **Julian:** That is a sharp distinction, Elizabeth. But even if I grant you that the intention is murky, or even that the killing was intended, you must face the second horn of the dilemma. Let us assume, for argument's sake, that Truman's action was morally tainted. You argue that no consequences can justify it. But look at the arithmetic.

  **Elizabeth:** I am looking.

  **Julian:** The estimates for Operation Downfall—the invasion of Japan—projected hundreds of thousands of Allied casualties. Japanese military and civilian deaths would have run into the millions. Starvation, disease, prolonged firebombing of conventional cities... the atomic bombs ended the war in days. If Truman is a murderer, he is a murderer who saved ten million lives. Does your moral theory have no room for the weight of those lives? If the prohibition against killing innocents leads to a catastrophe ten times worse, is the prohibition not too rigid for this world?

  **Elizabeth:** You ask if the prohibition is too rigid. I ask if your calculus is coherent. You are comparing two different categories of things as if they were weights on a scale. On one side, you have a specific act of injustice: the intentional killing of the innocent. On the other, you have a statistical projection of future suffering.

  **Julian:** They are both human lives. The currency is the same.

  **Elizabeth:** No, the currency is not the same. That is the fundamental error of consequentialism. You treat human life as a quantity to be maximized, rather than a dignity to be respected. When you say "the sheer number of lives saved yields to the prohibition," you imply that justice is negotiable. If I may kill one innocent person to save a thousand, I have established a principle that *any* innocent person may be killed if the utility is high enough. I have turned justice into a commodity.

  **Julian:** But by refusing to pay that price, you allow the ten million to die. You become complicit in their deaths by inaction.

  **Elizabeth:** There is a moral difference between killing and letting die, but more importantly, there is a difference between *acting* unjustly and *failing* to prevent a tragedy. If I refuse to murder a child to harvest his organs to save five patients, I am not responsible for the deaths of the five patients. The surgeon is. Similarly, Truman was responsible for the bombs. He was not responsible for the Japanese military's refusal to surrender, nor for the casualties of an invasion they chose to risk. By dropping the bomb, Truman took moral responsibility for the certain death of the innocents in Hiroshima to gamble on the lives of others. He made himself the arbiter of who may live and who must die based on utility.

  **Julian:** So you would let the war drag on? You would accept the firebombing of Tokyo, which killed more people than Hiroshima, simply because it was done with conventional bombs over a longer period, perhaps without the specific "intention" to kill civilians in the same concentrated way?

  **Elizabeth:** I would condemn the firebombing of Tokyo as well! Anscombe did not single out Truman because he was uniquely evil, but because he was being honored for it. The fact that conventional bombing also killed innocents does not justify atomic bombing; it compounds the tragedy. We do not cure a moral disease by spreading the infection. If the war could only be won by murdering civilians, then the war could not be won justly. That is a terrible truth, but it is the truth. To say "consequences justify it" is to say that there is no such thing as an action that is inherently wrong. And if there is no such thing, then morality is merely management.

  **Julian:** Management is what leaders do, Elizabeth. They manage tragedy. If you absolutize the prohibition against intending death, you render statecraft impossible in a fallen world. You retreat into purity while the world burns.

  **Elizabeth:** And if you relativize the prohibition, you render morality meaningless. You teach the next generation that murder is acceptable if the spreadsheet balances. Truman's degree was a signal that the University believed the ends justify the means. Anscombe stood up to say that some things are never to be done, regardless of the cost. That is not purity; it is the only thing that keeps us from becoming monsters in the name of saving humanity.

  **Julian:** *Sighs and leans back.* We are at an impasse. You see a line that cannot be crossed. I see a cliff edge we must step back from, even if it means walking through the fire to do it.

  **Elizabeth:** Then let us agree on this: The fire burns us both. But I will not say the burning of the innocent is good, even if it warms the survivors.

  **Julian:** And I will not say we had no choice but to light the match. But I will say I would light it again to stop the inferno.

  **Elizabeth:** And there, Julian, is why the pamphlet still matters. Not to condemn a man to hell, but to remind us that when we say "necessary," we must ask: necessary for what? And at what price to our souls?

  **Julian:** *Nods slowly.* I cannot grant your verdict. But I cannot dismiss the weight of your question.

  **Elizabeth:** Then the dialogue has served its purpose.
