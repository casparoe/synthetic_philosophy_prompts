answer: |-
  Friends, family, members of the Thursday night reading group, and Walter's grandchildren.

  For thirty-five years, I worked as an analytical chemist. My life was spent measuring compounds, looking for impurities, and accepting that in science, as in life, absolute purity is a theoretical ideal, not a practical reality. I mention this because I am not a philosopher. I have only been reading the subject seriously for two years. But I was Walter's friend for much longer than that, and if there is one thing I learned from him, it is how to analyze a life without falsifying the data.

  Many of you know that Walter was a student of Benjamin Franklin. To the grandchildren here: Franklin was one of America's founders, but to Walter, he was mostly a guy who had a very specific to-do list. Franklin identified thirteen virtues—things like Temperance, Silence, Order, and Humility. He tried to focus on one each week, marking a dot in a ledger whenever he failed.

  Walter kept that ledger. For as long as I knew him, he kept that book.

  To the reading group, this ledger was a subject of endless debate around Walter's kitchen table. To his grandchildren, that kitchen table was the place where, if you arrived late for dinner, you were handed a pen and paper and asked to write a note of apology.

  These were not different behaviors. They were the same. Walter believed that order mattered. He believed that acknowledging a lapse was the only way to correct it. He didn't make you write those notes because he was angry. He made you write them because he wanted you to have your own ledger, eventually. He wanted you to understand that showing up on time is a promise you make to other people, and breaking a promise requires a reckoning.

  Now, usually, at a time like this, a speaker stands up and tells you the deceased was a perfect man. They tell you he mastered his temper, that he was endlessly patient, that he never had a cross word.

  If I were to say that about Walter, I would be lying. And worse, I would be offending him.

  Walter loved Franklin's story about the "speckled axe." It's the idea of a man who wants the blacksmith to grind his axe perfectly bright. The blacksmith agrees, but only if the man turns the wheel. It's hard work. Eventually, the man decides he likes the axe with some spots left on it. Franklin admitted he never conquered his own worst habits. He settled for the speckled axe.

  Walter settled for the speckled axe, too. He had his dots. He had his days of impatience, his moments of stubbornness, and his share of pride. He was acutely aware that he was a work in progress. In fact, he was particularly wary of the virtue of Humility. He often pointed out Franklin's joke on the subject: that a man who is convinced he has finally achieved perfect humility has, in that very conviction, found a new reason to be proud.

  So, I will not stand here and tell you Walter was humble. I will tell you that he was *conscious* of his pride. I will tell you that he knew when he was being difficult, and he usually marked a dot for it later that evening. He didn't hide his flaws from us; he cataloged them. And in doing so, he taught us that goodness isn't about being flawless. It is about keeping track. It is about the courage to look at the ledger at the end of the week and admit where the dots are.

  He insisted that the whole point of Franklin's scheme was that one never arrives. There is no finish line where you become a "good person" and can stop trying. You just keep turning the wheel.

  To his family: You knew him as the man who cared if you were late, yes. But you also knew him as the man who showed up. He showed up for thirty years of Thursday nights. He showed up for me, through careers and losses and retirements. He showed up for the work of being better, even when the work was tedious.

  To the reading group: We have lost our moderator. The kitchen table will be quieter.

  To everyone: We have lost a man who reminded us that while we cannot polish the axe until it is perfectly bright, we are still responsible for the grinding.

  Walter didn't finish the book. He left dots on the page right up to the end. He would have wanted it that way. He would have wanted us to know that he was still in the middle of the sentence, still correcting his grammar, still trying to get the next week right.

  I miss my friend. I miss the ledger. But mostly, I miss the honesty of the man who knew he was speckled, and loved us anyway.

  Rest well, Walter. I'll mark a dot for missing you. But I'll try to be on time for whatever comes next.
