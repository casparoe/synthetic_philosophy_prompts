answer: |-
  This is a genuinely sharp reading of Bentham. Most people stop at "greatest happiness" and assume that means "maximum tickles, minimum ouchies." But as you note, Bentham's unpublished sexual writings (collected in *Of Sexual Irregularities* by Louis Crompton and others) show he was far more sophisticated about the *sources* of moral judgment than the caricature suggests.

  If we apply the specific logic from the "Paederasty" essay and the *Introduction to the Principles of Morals and Legislation* (IPML) to modern BDSM/kink, Bentham wouldn't just be "chill." He would likely be one of its most robust philosophical defenders, though his reasoning would expose some fascinating friction points in the felicific calculus.

  Here is how Bentham would likely dissect kink, and where the calculus might actually strain.

  ### 1. The "Pain as Pleasure" Paradox isn't a Paradox for Bentham
  You asked if the system strains when pain *is* the pleasure. Actually, Bentham has a built-in mechanism for this: **Instrumental Pain.**

  In the IPML, Bentham explicitly states that pain is not an absolute evil; it is only an evil *unless* it serves to exclude a greater evil or procure a greater good. He uses the example of surgery: cutting flesh is painful, but if it saves a life or stops gangrene, the utility is positive.

  Bentham would view BDSM pain through the same lens, but with a psychological twist. He was a psychological hedonist: he believed humans are governed by the experience of pleasure and pain. If a submissive *experiences* the sensation of a whip as net pleasure (due to endorphins, psychological submission, trust, arousal), then for the purpose of the calculus, **it counts as pleasure.**

  The physical label ("pain") matters less than the phenomenological reality ("utility"). If the participant seeks it, consents to it, and derives satisfaction from it, calling it "pain" in the moral sense is a category error. Bentham would argue that the ascetic moralist is the one confused here, fixating on the physical stimulus rather than the mental state.

  ### 2. The Attack on "Antipathy"
  This is the strongest part of your observation. In *Of Sexual Irregularities*, Bentham's main target isn't just religious dogma; it's the **Principle of Sympathy and Antipathy**. This is the habit of saying "X is wrong because it disgusts me."

  Bentham would look at modern "vanilla" disgust toward BDSM and eviscerate it. He would argue:
  *   **Disgust is not Harm:** Just because a spectator feels nausea watching a scene does not mean the participants are suffering. To legislate based on the spectator's nausea is to privilege the "imaginary" pain of the observer over the "real" pleasure of the actor.
  *   **The Ascetic Principle:** He would identify the anti-kink stance as a resurgence of the "Ascetic Principle" (the idea that pleasure is suspicious and pain is virtuous). He spent his life fighting the idea that sex must be grim, procreative, and joyless to be moral. Kink, which explicitly decouples sex from procreation and embraces "taboo" sensations, fits his model of sex as a legitimate source of utility.

  ### 3. Consent as the Proxy for Harm
  Bentham didn't use the modern vocabulary of "affirmative consent," but he was obsessed with **coercion** and **security**.

  For Bentham, the law exists to protect expectations and security. A crime is a violation of security. In a BDSM context:
  *   **Coercion:** If there is force or fraud, utility is destroyed (fear/pain outweighs pleasure). This is assault, plain and simple.
  *   **Consent:** If there is free agency, the "harm" is negated. Bentham would likely view a safeword mechanism as a brilliant utilitarian technology—it maximizes the duration of pleasure by minimizing the risk of the pain becoming "real" (non-instrumental) harm.

  He would likely argue that private, consensual kink creates a "sphere of liberty" where the law has no jurisdiction because no security is violated. To punish it would be to create *actual* pain (imprisonment, shame, legal cost) to prevent *imaginary* harm.

  ### 4. Where the Calculus Strains
  However, you asked if the system strains. I think it does, but in a way that reveals the limits of *any* consequentialist framework, not just Bentham's.

  **A. The Problem of "False Consciousness" (or Miscalculation)**
  Bentham assumes individuals are the best judges of their own pleasure. But what if a kink is driven by internalized self-hatred or trauma replication that the subject *thinks* is pleasure but is actually long-term psychological damage?
  Bentham's calculus requires a long-term view. If a practice leads to desensitization, addiction, or an inability to function in non-kink relationships, the *long-term* utility might be negative even if the *short-term* utility is high. Bentham was a wonk about details; he might demand empirical data on the psychological long-term effects of BDSM before giving it a full pass, whereas he gave homosexuality a pass mostly on the grounds that it *obviously* caused no physical harm to others.

  **B. The "Slippery Slope" of Security**
  Bentham was a legal positivist who cared deeply about the clarity of laws. He might worry about the **evidentiary problem**. If we legalize consensual pain, how do the courts distinguish between a consensual BDSM scene and domestic abuse?
  Bentham might fear that decriminalizing "painful sex" creates a loophole that increases the *security risk* for vulnerable people (mostly women, in his historical context). He might argue for strict regulatory frameworks (contracts, witnesses, etc.) to ensure the "pain" remains within the utility calculus. He wouldn't ban it, but he might want it bureaucratized to ensure the consent is real.

  **C. The Definition of "Pain"**
  The deepest strain is semantic. Bentham's system relies on pain and pleasure being the atomic units of morality. BDSM challenges the idea that they are distinct atoms. If pain *is* pleasure, the calculus doesn't break, but it becomes tautological.
  *   *Critic:* "You are inflicting pain."
  *   *Bentham:* "No, they are experiencing pleasure."
  *   *Critic:* "But it looks like pain."
  *   *Bentham:* "Your disgust is irrelevant antipathy."

  This moves the debate from *calculation* to *phenomenology*. Bentham is forced to rely entirely on the subject's report of their internal state. He has no external metric. If the subject says "this hurts but I like it," Bentham must accept that as "net pleasure." This makes the calculus unfalsifiable in private contexts.

  ### The Verdict
  Bentham would likely view modern BDSM culture as a **validation of his theory**.

  He would argue that the "pain" is merely the price of admission for a specific type of pleasure, much like the burn in your muscles is the price of the pleasure of exercise or the pride of achievement. He would dismiss the moral outrage as **asceticism** (pleasure is bad) and **antipathy** (I don't like it, so it's wrong).

  The only place he would hesitate is on the **risk management**. Bentham was a radical, but he was a *legal* radical. He wanted laws that were clear and enforceable. He might worry that normalizing consensual violence complicates the legal protection of non-consenting victims. But ultimately? He would almost certainly conclude that **the pain of prohibition outweighs the risk of the practice.**

  He'd probably be the guy in the corner of the munch taking notes on how safewords optimize the pleasure/pain ratio, muttering about how the church wasted centuries demonizing flagellation when they could have been calculating its utility.
