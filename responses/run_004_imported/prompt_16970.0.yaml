answer: |-
  You are absolutely right, and your friend is underestimating one of the most fascinating and tragic arcs in the history of moral philosophy.

  While it is easy to dismiss Sidgwick's involvement with the Society for Psychical Research (SPR) as a quirky Victorian eccentricity, scholars (like Bart Schultz, Sidgwick's definitive biographer) have made it clear that this was not a hobby. It was a desperate philosophical project. Sidgwick viewed the SPR not as a hobby, but as an **empirical extension of his ethics.**

  Here is the breakdown of why your intuition is correct, how the psychical research ties directly into the "Dualism of Practical Reason," and what the failure of that research implies for the rational foundation of utilitarianism.

  ### 1. The Core Problem: The Dualism of Practical Reason
  To understand why Sidgwick needed ghosts, you have to understand the hole in his system. In *The Methods of Ethics* (1874), Sidgwick argues that there are two self-evident principles of practical reason:

  1.  **Rational Egoism:** It is rational to maximize my own happiness (Prudential Reason).
  2.  **Rational Utilitarianism:** It is rational to maximize the general happiness (Moral Reason).

  In a perfect world, these two would always align. Doing the moral thing would always be the best thing for *me* in the long run. But Sidgwick looked at the empirical world and saw that this is often false. Being moral often requires self-sacrifice. If I die saving five people, my happiness is zero, but the general happiness is up.

  If there is no afterlife, the Egoist can say: "You acted irrationally. You destroyed your own good for no return."
  If there *is* an afterlife with cosmic bookkeeping (rewards for virtue, punishment for vice), then the self-sacrifice is merely a short-term loss for a long-term gain. Egoism and Utilitarianism converge.

  Sidgwick called the conflict between these two the **Dualism of Practical Reason**. He viewed it as a "fundamental contradiction" in our rational nature. For ethics to be fully rational, this dualism must be resolved.

  ### 2. Why Psychical Research? (The Empirical Theology)
  Previous philosophers (like Kant) resolved this by *postulating* God and immortality as necessary assumptions for morality to make sense. But Sidgwick was an empiricist. He refused to simply assume God existed because it was convenient for his ethical system. He wanted **evidence**.

  He reasoned as follows:
  *   Premise 1: Morality is only fully rational if Virtue and Happiness ultimately coincide.
  *   Premise 2: They do not coincide in this life (empirically observable).
  *   Premise 3: Therefore, they must coincide in an afterlife for morality to be rational.
  *   Conclusion: We need empirical evidence of an afterlife to validate the rationality of morality.

  Since traditional theology was shaky ground for a rigorous philosopher, Sidgwick turned to **psychical research**. If he could prove telepathy or survival of consciousness after death through scientific investigation, he would have the empirical premise needed to solve the Dualism. He wasn't looking for comfort; he was looking for the missing variable in his ethical equation.

  ### 3. The Implications of the Inconclusive Results
  Sidgwick spent decades investigating mediums and hauntings. He approached it with extreme skepticism and rigor. Ultimately, the research was **inconclusive**. He found no hard proof of immortality.

  This failure has massive implications for his philosophy:

  **A. The Dualism Remains Unresolved**
  Because the psychical research failed to prove the "cosmic bookkeeping," Sidgwick was forced to admit in the final editions of *The Methods of Ethics* that the Dualism of Practical Reason stands. Reason is divided against itself. There is no guarantee that being good is rational for the individual agent.

  **B. The "Sidgwickian Paradox"**
  This leads to a bleak conclusion: **Morality may not be rational.**
  If you define "rational" as "acting in accordance with reason," and reason dictates self-interest (Egoism) just as strongly as it dictates universal good (Utilitarianism), then the moral agent is asked to act against one half of their rational nature. Sidgwick essentially concluded that we must *choose* to be utilitarian, but we cannot prove it is the *only* rational choice.

  **C. Utilitarianism Loses Its "Knockdown" Foundation**
  Your friend asks whether morality holds up without cosmic bookkeeping. Sidgwick's life work suggests: **Not as a system of pure rationality.**
  Sidgwick hoped to ground Utilitarianism as a scientific, rational necessity. The failure of the psychical research implies that Utilitarianism cannot be grounded *solely* in self-interested rationality. It requires a leap of faith or a commitment that transcends the evidence of self-interest.

  ### 4. Who Wins the Argument?
  **You win.**

  Your friend's claim that the SPR was a "weird Victorian hobby totally separate from his real philosophy" is historically and philosophically inaccurate.
  *   **Historically:** Sidgwick explicitly wrote about the connection. In a letter to his student and successor, Arthur Balfour, and in his private journals, he linked the two projects directly. He saw the SPR as the "scientific theology" required to complete the *Methods of Ethics*.
  *   **Philosophically:** The motivation for the SPR *was* the Dualism. Without the Dualism, there is no need for the afterlife. Without the need for the afterlife, there is no need for the SPR.

  ### 5. The Verdict on "Just Be Good Because It's Good"
  So, what does Sidgwick's failure mean for your debate?

  Sidgwick's struggle suggests that **"Just be good because it's good" is not a rational argument; it is an intuition or a commitment.**
  *   If you demand that morality be **instrumentally rational** (i.e., "What's in it for me?"), then Sidgwick shows you *need* cosmic bookkeeping. Without it, the Egoist wins.
  *   If you accept that morality is **categorically rational** (i.e., "I am a moral agent, therefore I act morally, regardless of payoff"), then you don't need the bookkeeping. But Sidgwick would argue you can't *prove* this position is superior to Egoism using reason alone.

  **The Takeaway:**
  Sidgwick's tragedy is that he wanted morality to be scientifically provable and rationally airtight. His psychical research was the attempt to close the loop. Its failure implies that a fully rational, non-question-begging foundation for Utilitarianism—one that satisfies the Egoist—is impossible without empirical proof of divine justice.

  Since we lack that proof, we are left with Sidgwick's uncomfortable conclusion: We must practice morality knowing that reason does not fully guarantee it pays off. We have to "just be good" not because reason proves it benefits us, but because we decide the Moral Reason outweighs the Prudential Reason, even if the universe doesn't care.

  Your friend thinks the lack of cosmic bookkeeping makes morality shaky. Sidgwick would say the lack of bookkeeping makes **rationality** shaky, because it reveals that Reason itself is contradictory. Morality survives, but it survives as a choice, not a calculation.
