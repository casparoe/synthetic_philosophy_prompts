answer: |-
  You have hit on one of the most persistent and genuinely difficult knots in philosophy of action and behavioral economics. Your intuition is correct: standard hyperbolic discounting, taken at face value, *does* threaten to dissolve akrasia into mere preference change. If the agent maximizes utility at $t_{night}$ based on the discount curve active at $t_{night}$, they are technically being "rational" relative to that momentary preference structure.

  If you write your character thinking, "I know this is bad, but I want it more now," you haven't written akrasia; you've written a preference update. That's not a tragedy; that's just Tuesday.

  To capture the *akrasia*—the genuine acting against one's better judgment—you need to understand why the morning judgment retains normative authority over the night judgment, even when the night utility spike is mathematically higher. Here is the breakdown of the mechanics, the philosophical tension, and how to translate that into your character's internal landscape without resorting to "willpower" clichés.

  ### 1. The Discounting Trap: Why It Looks Like Rationality
  You are right to be suspicious. In standard microeconomic terms, if my discount rate is hyperbolic (steep drop-off for immediate delays, flat for distant delays), my preference ordering reverses over time.
  *   **Morning ($t_1$):** I prefer Sobriety at $t_2$ over Drinking at $t_2$.
  *   **Night ($t_2$):** I prefer Drinking at $t_2$ over Sobriety at $t_2$.

  If the agent simply maximizes the utility function active at $t_2$, there is no contradiction *within* that moment. The "irrationality" only exists if you assume the agent is a single, temporally extended entity that *should* maximize lifetime utility. If you view the agent as a sequence of temporal slices, each slice is acting rationally according to its own lights.

  This is the "dissolution" you sensed. It turns akrasia into a **Principal-Agent Problem** where the Principal (Morning Self) cannot control the Agent (Night Self). But for a novel, this feels too dissociative. Your character feels like *one person* suffering, not two people handing off a baton.

  ### 2. Ainslie's Rescue: Intertemporal Bargaining
  George Ainslie's *Breakdown of Will* is indeed the best framework for this, but you need to drill past the "bargaining" metaphor to the **recursive mechanism**. It isn't just that the selves have different wants; it's that the current choice changes the *rules of the game* for future choices.

  Ainslie argues that willpower is not a muscle; it is a **test case**.
  When your character pours the drink, he isn't just consuming alcohol. He is testing a boundary. If he breaks his morning rule tonight, he establishes a precedent that his rules are negotiable when the immediate discount spike hits.

  *   **The Mechanism:** The value of the drink tonight = Liquid Utility + **The Precedent Value**.
  *   **The Precedent Value is Negative:** By drinking, he lowers the expected value of all future resolutions. He teaches his future selves that "Morning Me" is a liar.

  **Why this saves Akrasia:**
  The irrationality isn't in the calculation of the drink's pleasure. The irrationality is in **underweighting the precedent**. The Night Self knows (intellectually) that breaking the rule damages the bargaining position of all future Morning Selves, but the hyperbolic discount curve makes that future damage feel negligible compared to the immediate spike.

  He isn't acting against his judgment because he changed his mind; he is acting against his judgment because he is **discounting the cost of credibility**. He is effectively taking a high-interest loan against his future agency.

  ### 3. Davidson vs. The Economists
  Donald Davidson's account of *akrasia* requires a unified agent who holds an "all-things-considered judgment" that $A$ is better than $B$, yet intentionally does $B$. Davidson struggles to explain *how* this is possible without partitioning the mind (which looks like multiple personalities).

  The hyperbolic/Ainslie model solves Davidson's problem by suggesting the mind *is* partitioned by time, but bound by **personal rules**.
  *   **Davidson:** "I judge X is best, but I do Y." (Logical contradiction).
  *   **Ainslie/Economics:** "I judge X is best for the *series* of me, but I am maximizing utility for the *current* me, ignoring the cost to the series."

  For your character, the tension isn't "I want this vs. I shouldn't." It's "I want this vs. I am undermining my own sovereignty."

  ### 4. Writing the Internal Monologue: The Phenomenology of the Trap
  If you want to avoid "ugh, willpower," you need to write the **calculation of the precedent**. Your character is sharp and self-aware. He shouldn't be surprised by the urge. He should be horrified by his own ability to rationalize the exception.

  **Don't write:**
  > *I promised I wouldn't drink. But I'm so tired. Just one won't hurt. God, I have no willpower.*

  **Do write (incorporating the mechanics):**
  > *The bottle was already in his hand. This was the arithmetic he'd solved a hundred times: the morning promise was a long-term contract, but the thirst was a cash offer. He knew the trick. He knew that if he accepted the cash offer, the contract wasn't just paused; it was voided. Tomorrow morning, when he made the same promise, he'd be negotiating with a man who had already proven he didn't honor signatures.*
  >
  > *He could feel the discount curve bending, the future collapsing into the glass. It wasn't that he forgot the cost. It was that the cost was due tomorrow, and the relief was due now. He was selling his future credibility for present liquidity, and the exchange rate was obscene. He poured anyway. Not because he thought it was good, but because he was tired of being a sovereign state that couldn't enforce its own borders.*

  ### 5. Summary of the Mechanics for Your Draft
  1.  **Dynamic Inconsistency:** The character knows his preferences will reverse. He anticipates the failure in the morning, which adds a layer of self-loathing to the morning resolution (he's making promises he knows he'll break).
  2.  **The Precedent Effect:** The drink is dangerous not because of the alcohol, but because it proves the rule is fake. The internal monologue should reflect the *strategic* loss, not just the health loss.
  3.  **Rationalization as a Tool:** Since he is insightful, he won't lie to himself clumsily. He will use his insight to construct a perfect, airtight case for why *tonight* is the exception. The tragedy is that he knows it's a rationalization while he's building it.
  4.  **No "Loss of Control":** He doesn't black out or lose his mind. He maintains executive function. He chooses the drink *knowing* it violates his global utility function. That is the definition of the akratic act.

  **The Verdict on Your Question:**
  Does discounting dissolve akrasia? **Yes, if you view the self as a momentary utility maximizer.**
  Does Ainslie rescue it? **Yes, by reintroducing the "self" as a recurring negotiation where current actions have recursive consequences.**

  For your novel, the Ainslie model is richer. It allows your character to be intelligent and still fail. He isn't failing because he's stupid or weak; he's failing because the structure of time and reward makes the "sovereign self" an unstable entity. He is a government collapsing from internal debt, not a soldier losing a battle.
