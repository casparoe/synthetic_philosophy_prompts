      *   *Is Ainslie just repackaging?* No, because it adds the *recursive* element (current choice affects future credibility). Standard discounting is just math; Ainslie adds game theory.
      *   *Character advice:* Make sure the character doesn't sound like a textbook. He should feel the *weight* of the precedent, not just the urge.

  7.  **Final Polish:** Structure the answer logically:
      1.  Validate the intuition (you're right, it's a real philosophical problem).
      2.  The Discounting Trap (why it looks like rationality).
      3.  The Ainslie Solution (bargaining/precedent).
