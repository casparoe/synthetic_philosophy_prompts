      *   *Why do proponents take it seriously?* Because they reject CDT in favor of LDT/FDT. They argue that "causation" isn't the only thing that matters for rational choice; "logical correlation" matters too. If two calculators run the same code, and I change the input on one, I know the output on the other changes *logically*, even if they are separated by space.
      *   *The "Magic" Step:* The leap is treating your *decision algorithm* as a Platonic object that exists in multiple places simultaneously.

