answer: |-
  Two effective altruists, Alice and Bob, are staring at a whiteboard covered in cosmological data.

  Bob asks, "Have you finished the audit? Is the universe net positive or net negative?"

  Alice sighs and puts down her marker. "It's inconclusive. The data is conditionally convergent."

  "So... bad?"

  "No, not necessarily. If I sum the events chronologically, the early suffering outweighs the joy, and the total is negative infinity. But if I reorder the ledger to group all the happy moments first and intersperse the suffering sparsely, the total flips to positive infinity."

  Bob frowns. "So, do we need to intervene to save the world, or is it already saved?"

  "I don't know," Alice says, picking up her coat. "I'm going to lunch. If the sandwich is good, I'll use the ordering that says it's a utopia. If it's cold, I'll file it as a hellscape."

  ***

  **Why the joke works**

  The humor relies on the **Riemann Rearrangement Theorem**, which states that a conditionally convergent infinite series can be rearranged to sum to any real number (or diverge to infinity). In the context of **infinite ethics**, if the universe contains infinite good and infinite bad, there is no objective "total value" unless you specify an arbitrary rule for how to count them (the "ordering").

  To a layperson, the joke sounds like bureaucratic absurdity—that the moral status of reality depends on a sandwich. To someone familiar with the literature, it lands because it highlights the terrifying implication of the reordering problem: that the "value" of the universe isn't a fact about the events themselves, but a fact about the **mathematical bookkeeping method** chosen to evaluate them. Alice's lunch isn't just a mood swing; it's the deciding variable in the cosmic moral calculus.
