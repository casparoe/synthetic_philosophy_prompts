      *   **Explain the Math (Simply):** Differentiate between Arithmetic Mean (Friend) and Geometric Mean (User). Explain Risk of Ruin.
      *   **Address the "1000 You's":** Explain why this is flawed. If 900 go bust and 100 win big, the average is high, but the *probability* of being a bust is 90%. You only get to be one you.
      *   **Kelly Criterion:** Introduce this as the middle ground. It maximizes growth without ruin. Explain that pros play *fractional* Kelly.
      *   **The Staking Deal:** Analyze the 40/40 deal. It lowers personal variance. It allows for stake increases *if* the user wants to take more risk, but logically it should be used to secure the career (lower personal risk) or move up stakes safely.
