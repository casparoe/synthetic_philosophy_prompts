  1.  **Analyze the User's Query:**
      *   **Topic:** Coherence arguments in AI safety (money pumps, Dutch books, Expected Utility Theory).
      *   **User's Interpretation:** These arguments imply that any sufficiently rational agent *must* act like an expected utility maximizer (EUM). Therefore, a sufficiently advanced AI is *guaranteed* to lock onto one fixed goal and pursue it ruthlessly (instrumental convergence/paperclip maximizer).
