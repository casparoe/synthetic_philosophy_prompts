prompt: |-
  so i've been reading about "coherence arguments" in AI safety circles -- the idea that money-pump and dutch-book style reasoning shows any sufficiently rational agent basically has to act like an expected utility maximizer. doesn't that mean a sufficiently advanced AI is pretty much guarenteed to lock onto one fixed goal and pursue it ruthlessly? feels like that's the whole basis for worrying about paperclip-maximizer scenarios -- the math just forces it into being that way, right?
reasoning: |-
