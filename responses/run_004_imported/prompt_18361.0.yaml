      *   **Topic:** Comparison between Eliezer Yudkowsky's Coherent Extrapolated Volition (CEV) and philosophical "idealized preference" or "ideal advisor" theories (specifically Peter Railton, but also Sidgwick, Brandt, Harsanyi).
      *   **Core Question 1:** Is CEV philosophically distinct from earlier idealized-preference accounts, or is it just old wine in new bottles (AI implementation)?
      *   **Core Question 2:** Is the aggregation problem in CEV (combining millions of volitions) genuinely new, or just the old social choice/interpersonal aggregation problem?
      *   **Constraint:** Take a *real stance*. Avoid diplomatic "there are similarities and differences" non-answers. The user wants a definitive analysis.
      *   **Context:** The user is writing a longer piece on AI alignment and needs to push back (or concede) to a philosopher friend's critique.

  2.  **Deconstruct CEV:**
      *   *Definition:* "What we would want if we knew more, thought faster, were more the people we wish we were, grew up farther together."
      *   *Goal:* Solve the AI alignment problem by avoiding hard-coding current values (which are flawed) while avoiding objective moral realism (which is controversial/uncertain).
      *   *Mechanism:* An AI computes this extrapolation and acts on it.

  3.  **Deconstruct Idealized Preference/Advisor Theories (Railton, Brandt, etc.):**
      *   *Peter Railton (1986):* "Moral Realism." Defines non-moral good as what an agent would want if fully informed and instrumentally rational. Moral rightness is what promotes the social good (aggregation of individual goods).
      *   *Richard Brandt:* "Fully Informed Desire." What you would desire after cognitive psychotherapy (exposure to all relevant info).
      *   *Henry Sidgwick:* Ideal utilitarianism, but often leans towards what rational agents would choose.
      *   *John Harsanyi:* "True Preferences" vs. "Manifest Preferences." True preferences are what you'd have with full information and rational deliberation.

  4.  **Address Question 1: Philosophical Distinctness (Value Theory):**
      *   *Similarity:* Both rely on counterfactual idealization of subjective states. Both reject current subjective desire satisfaction as the metric. Both avoid strong moral realism (mostly).
      *   *Difference:*
          *   *Purpose:* Railton is defining *well-being* or *moral truth* for humans to strive for. CEV is defining a *target function* for an external optimizer (AI) to prevent catastrophe.
          *   *Dynamic vs. Static:* Railton's ideal advisor is a thought experiment for normative ethics. CEV is a computational specification (intended).
          *   *The "Growth" Clause:* CEV includes "grow up farther together." This implies a *process* of moral convergence, not just static information addition. Railton is more about correcting epistemic deficits.
          *   *Stance:* The friend is *mostly* right about the value theory foundation. CEV is essentially a specific instantiation of Ideal Advisor Theory. However, the *context* changes the philosophical stakes. In ethics, if the theory is slightly off, we argue. In AI alignment, if the function is slightly off, we die. This makes the *operationalization* philosophically significant, even if the *axiology* is derivative.
      *   *Decision:* I need to take a stance. Is it *philosophically distinct*? No, not in its axiology. It is Ideal Advisor Theory. But is it *trivial*? No, because the stakes and the mechanism (extrapolation vs. deliberation) differ.
      *   *Refined Stance:* The friend is right on the *axiology* (theory of value), but wrong to dismiss it as *just* repackaging. The shift from "what is good" to "what can be safely computed without killing us" adds a modal/epistemic constraint that Railton didn't face. But strictly speaking, on the question of "what constitutes the good," CEV is Railton 2.0.

  5.  **Address Question 2: The Aggregation Problem:**
      *   *The Problem:* How to combine $V_1, V_2, ... V_n$ (extrapolated volitions) into one $V_{total}$.
      *   *Social Choice Theory:* Arrow's Impossibility Theorem, Harsanyi's Utilitarianism theorem.
      *   *CEV Specifics:* Yudkowsky explicitly acknowledges this. "Coherent" is doing a lot of work. He hopes that at the limit of full information and rationality, preferences *converge*.
      *   *Comparison:* Harsanyi argued that true preferences *would* converge on utilitarianism. Rawls argued they would converge on justice as fairness.
      *   *Is it new?* No. It is exactly the problem of interpersonal comparison of utility + social welfare functions.
      *   *Nuance:* CEV adds the "growth" aspect ("grow up farther together"). This suggests the aggregation happens *during* the extrapolation, not just after. It posits a causal link between deliberation and convergence that standard social choice theory treats as exogenous.
      *   *Stance:* It is the old social choice problem in a new costume. The hope that "more thinking" solves Arrow's Impossibility is a substantive empirical/philosophical claim that mirrors Harsanyi's, not a structural innovation.

  6.  **Synthesize and Formulate the Argument:**
