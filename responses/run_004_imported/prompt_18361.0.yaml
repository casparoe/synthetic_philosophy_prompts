answer: |-
  Here is the direct stance you asked for, stripped of the usual diplomatic hedging.

  **The Verdict:** Your philosopher friend is substantially right, but for slightly shallow reasons. CEV is not a new theory of value; it is a specific, high-stakes application of Ideal Advisor Theory. However, dismissing it as *merely* "AI flavoring" misses how the safety context forces a confrontation with problems that academic ethics was content to leave abstract.

  Here is the breakdown on your two specific questions.

  ### 1. Is CEV Philosophically Distinct from Idealized Preference Theory?

  **Stance:** No, it is not distinct in its axiology (theory of value). It is Peter Railton's "Ideal Advisor" model with a different error term.

  Your friend is correct that the core definition of the "good" in CEV is functionally identical to the "fully informed desire" accounts of Railton, Brandt, and Harsanyi.
  *   **Railton (1986):** An agent's non-moral good is what they would want if they possessed full information and instrumental rationality.
  *   **Yudkowsky (2004):** CEV is what we would want if we knew more, thought faster, and were more the people we wished to be.

  Both reject *actual* subjective desire satisfaction (because we are ignorant and irrational) and both reject *objective* moral realism (because we don't want to hard-code external moral facts). Both posit a counterfactual procedure to "clean up" human preferences.

  **Where the friend is wrong:** They claim Yudkowsky added nothing but a "delivery mechanism." This underestimates how the *alignment context* changes the philosophical requirements.
  In academic ethics, if Railton's theory has edge cases (e.g., "What if full information makes me nihilistic?"), it's a theoretical puzzle. In AI alignment, that edge case is an existential catastrophe.

  CEV introduces a **modal constraint** that Railton did not face: *Computability and Stability.*
  Yudkowsky isn't just asking "What is the good?" He is asking "What is the good *that can be extrapolated by a superintelligence without the extrapolation process itself destroying the value?* "
  *   **The "Growth" Clause:** CEV includes "grow up farther together." This is distinct from Railton's static "full information." It implies a dynamic, deliberative convergence over time. This leans closer to Habermas' discourse ethics or Rawls' reflective equilibrium than Railton's individualistic idealization.
  *   **The Stakes:** Because the cost of error is infinite (extinction), CEV treats the *definition* of idealization as an engineering safety constraint. For example, Railton doesn't worry if the "ideal advisor" is too complex to compute. Yudkowsky has to.

  **Conclusion on Q1:** Your friend wins on **axiology**. CEV is Ideal Advisor Theory. But they lose on **pragmatics**. The shift from "normative guide for humans" to "target function for an optimizer" transforms the philosophical problems from "What should I do?" to "How do we specify this without dying?" That is a substantive shift, even if the definition of "good" remains the same.

  ### 2. Is the Aggregation Problem New or Just Social Choice in Costume?

  **Stance:** It is exactly the old Interpersonal Aggregation / Social Choice problem, relying on the same controversial empirical hope that earlier theorists relied on.

  The hardest part of CEV is the word **"Coherent."** Yudkowsky needs to combine the extrapolated volitions of 8 billion people into a single function the AI can maximize.
  *   **The Old Problem:** This is Arrow's Impossibility Theorem and the problem of interpersonal utility comparison. How do you aggregate distinct individual utility functions into a social welfare function without violating basic rationality constraints or imposing a dictatorship?
  *   **The Harsanyi Parallel:** John Harsanyi argued that if agents had "true preferences" (full info + rationality), they would all converge on the same utilitarian calculus. He solved aggregation by assuming *convergence*.
  *   **The CEV Parallel:** Yudkowsky solves aggregation by assuming that "if we knew more and thought faster... our volitions would cohere."

  **This is not a new solution.** It is the Harsanyi gambit repackaged. It relies on the empirical/philosophical claim that moral disagreement is primarily a result of *ignorance and processing error*, rather than fundamental value pluralism.
  *   **Isaiah Berlin's Objection:** Value Pluralism suggests that genuine human values (liberty vs. equality, mercy vs. justice) are incommensurable and will conflict *even at the limit of perfect information*.
  *   **The CEV Weakness:** If Berlin is right, CEV fails. There is no "coherent" extrapolation because the extrapolated volitions remain contradictory. The AI then has to make a choice about how to trade them off, which means the *AI* is deciding the morality, not the extrapolation.

  **Conclusion on Q2:** This is the old Social Choice problem in a new costume. The "innovation" is the hope that sufficient cognitive enhancement ("thought faster") dissolves the structural barriers identified by Arrow and Berlin. Most political philosophers consider that hope unjustified. Yudkowsky treats it as a working assumption. That makes CEV vulnerable to the exact same critiques that sank Harsanyi's Utilitarianism in the 1980s.

  ### Summary for Your Piece

  If you want to push back against your friend while remaining accurate, here is the line to take:

  1.  **Concede the Axiology:** Admit that CEV is fundamentally Railtonian Ideal Advisor Theory. It does not solve the meta-ethical problem of what "good" is; it outsources it to a counterfactual procedure.
  2.  **Challenge the Dismissal:** Argue that the *alignment context* revitalizes the theory. Academic philosophy was allowed to leave Ideal Advisor Theory vague because humans don't have to *compute* it. AI Alignment forces us to ask if "idealized preference" is even a well-defined mathematical object.
  3.  **Identify the Real Bottleneck:** The weak point isn't the definition of individual good (Railton's part); it's the aggregation (the Social Choice part). CEV stands or falls on whether moral disagreement is epistemic (fixable by thinking harder) or ontological (fundamental). If it's the latter, CEV is mathematically impossible, regardless of how smart the AI is.

  **Final Stance:** Your friend is right that Yudkowsky didn't invent a new moral theory. But they are wrong to imply that doesn't matter. Yudkowsky took a dormant theory from the 1980s and asked, "What happens if we actually try to run this code?" That question exposes flaws in Ideal Advisor Theory that philosophers were never forced to confront. CEV isn't new philosophy, but it is a stress test that might break the old philosophy.
