      *   *Q2:* Don't hedge. Say: "It is the old aggregation problem." The claim that extrapolation leads to coherence is a version of Harsanyi's claim that rational agents agree. It faces the same objections (pluralism, incommensurability).
      *   *Key Insight:* The "Coherent" in CEV is the magic wand. It assumes convergence. Philosophy generally doubts convergence (Value Pluralism).
