answer: |-
  God is interviewing candidates for the position of "Law of Gravity."

  The Anti-Humean steps forward first. "I will actively bind masses together," he declares. "I will ensure that every particle necessitates attraction. I am the cosmic enforcer. I govern the universe."

  God nods, impressed. "And you?"

  The Humean steps up. "I'll wait until the masses move. If they look like they're attracting, I'll write down a formula that matches. If they change their mind, I'll update the formula. I'm less of a governor and more of a historian."

  God frowns. "But what if a planet decides to move in a square?"

  The Anti-Humean gasps. "Impossible! I forbid it!"

  The Humean shrugs. "Then I'll write down the Law of Square Planets."

  God turns to the Anti-Humean. "You're hired. I need order, not a diary."

  The Humean packs his bag. "Suit yourself. But remember: You didn't hire him because he has authority. You hired him, and now you're just *calling* it authority."

  God opens his mouth to fire him, but the Humean is already out the door.

  "See?" the Humean calls back. "Another particular fact for the mosaic."
