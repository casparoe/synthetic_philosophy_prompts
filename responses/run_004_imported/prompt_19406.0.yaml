  i don't buy my uncle's overall shtick but after going down the rabbit hole on this im less sure the tautology worry is as dumb as people treat it. can you make the strongest case that popper's original "almost tautological" complaint about natural selection was basically onto something, and that the recantation doesn't really answer it so much as dodge it? i want the actual logical bones of the fitness/selection argument, not just "well popper recanted so case closed."
