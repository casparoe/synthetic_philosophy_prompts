answer: |-
  The standard rationalist consensus is correct: to immunize decision theory against Pascal's Mugging and St. Petersburg paradoxes, a utility function must be **bounded**. It is not sufficient for utility to be merely concave (diminishing marginal returns), as Bernoulli proposed for the original St. Petersburg paradox.

  The reason is that concavity only protects you against *specific* growth rates of payoff. If your utility function $U(x)$ is unbounded above, no matter how agonizingly slow its growth (e.g., $U(x) = \log(\log(x))$), an adversary can always construct a probability distribution over payoffs such that the expected utility diverges to infinity.

  Here is the argument that any unbounded utility function is vulnerable, including the explicit construction of the "super" gamble that breaks it.

  ### 1. The Setup

  Let $U(x)$ be your utility function over monetary payoff $x$. We assume the standard rationalist axioms apply, except we are testing the **boundedness** constraint.
  *   **Assumption:** $U(x)$ is **unbounded above**.
  *   **Mathematical Definition:** For any real number $K$, there exists some monetary prize $x$ such that $U(x) > K$. Formally: $\forall K \in \mathbb{R}, \exists x \in \mathbb{R}_{\ge 0} \text{ s.t. } U(x) > K$.

  We consider a generalized St. Petersburg game. The game consists of a sequence of outcomes indexed by $n = 1, 2, 3, \dots$.
  *   **Probabilities:** Fixed at $p_n = \frac{1}{2^n}$. (Note that $\sum p_n = 1$).
  *   **Prizes:** We will choose a prize $x_n$ for each outcome $n$.

  The Expected Utility (EU) of this gamble is:
  $$ EU = \sum_{n=1}^{\infty} p_n U(x_n) = \sum_{n=1}^{\infty} \frac{1}{2^n} U(x_n) $$

  To break the agent, we need to choose prizes $x_n$ such that this sum diverges to $+\infty$.

  ### 2. The Construction of the Escalated Prizes

  If $U(x)$ were bounded by some maximum $M$, then $EU < \sum \frac{1}{2^n} M = M$, and the game would always have finite value. But since $U$ is unbounded, we can force the terms of the sum to be large enough to ensure divergence.

  A sufficient condition for a series of positive terms to diverge is that the terms do not approach zero. Let us aim for a stronger condition: let us make every term in the expected utility sum equal to at least 1.

  We require:
  $$ \frac{1}{2^n} U(x_n) \ge 1 $$

  Rearranging for utility:
  $$ U(x_n) \ge 2^n $$

  **The Algorithm for Choosing Prizes:**
  For each $n$ (from 1 to $\infty$):
  1.  Calculate the target utility value $T_n = 2^n$.
  2.  Invoke the **unboundedness property** of $U$. Since $U$ has no ceiling, there must exist some monetary amount $x_n$ such that $U(x_n) \ge T_n$.
  3.  Set the prize for outcome $n$ to be this $x_n$.

  *Note on Growth:* If $U(x)$ grows very slowly (e.g., iterated logarithm), the required monetary prize $x_n$ will be astronomically large. For example, if $U(x) = \log_2(x)$, we need $\log_2(x_n) \ge 2^n$, so $x_n \ge 2^{2^n}$. If $U(x) = \log_2(\log_2(x))$, we need $x_n \ge 2^{2^{2^n}}$. The monetary cost to the "bank" running the game becomes incomprehensible, but it remains **finite** for any specific $n$. Since the definition of the gamble allows arbitrarily large finite prizes, this construction is valid.

  ### 3. The Proof of Divergence

  Now we calculate the Expected Utility of the game constructed above:

  $$ EU = \sum_{n=1}^{\infty} \frac{1}{2^n} U(x_n) $$

  By our construction, $U(x_n) \ge 2^n$. Substituting this inequality into the sum:

  $$ EU \ge \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot 2^n $$
  $$ EU \ge \sum_{n=1}^{\infty} 1 $$
  $$ EU = \infty $$

  Because the expected utility is infinite, a rational agent with this utility function should be willing to pay any finite amount to enter this gamble. This recreates the St. Petersburg paradox exactly, despite the utility function being concave.

  ### 4. Why Concavity Fails

  Bernoulli's original solution used $U(x) = \log(x)$. This works against the *original* St. Petersburg game where prizes grow as $x_n = 2^n$.
  $$ \sum \frac{1}{2^n} \log(2^n) = \sum \frac{n}{2^n} < \infty $$
  The linear growth of utility (in the exponent) is tamed by the exponential decay of probability.

  However, concavity only limits the *rate* of growth; it does not impose a *limit* on growth.
  *   **Concave:** $U'(x) > 0, U''(x) < 0$. (Slope decreases, but can stay positive forever).
  *   **Bounded:** $\exists M, \forall x, U(x) < M$. (Slope must eventually approach zero fast enough that the integral converges to a finite cap).

  In the construction above, we simply matched the growth of the prizes $x_n$ to the decay of the probabilities $p_n$, scaled by the inverse of the utility function. Because $U$ has no ceiling, $U^{-1}(2^n)$ always exists. We effectively "out-run" the concavity by offering prizes that grow fast enough to keep the marginal utility contribution constant.

  ### 5. Connection to Pascal's Mugging

  You might object that this requires a complex lottery, whereas Pascal's Mugging is a single-shot offer: *"Give me \$5, or I will use my magic powers to save $X$ lives with probability $p$."*

  The St. Petersburg construction demonstrates that if you accept unbounded utility, your preferences are not well-defined over probability distributions. If you accept the St. Petersburg gamble (because EU = $\infty$), you are implicitly accepting that there exists some tail event so valuable it dominates all finite costs.

  In the Mugging context, if $U$ is unbounded, for any probability $p$ (no matter how small, e.g., $10^{-100}$) and any finite cost $C$, there exists a payoff $X$ such that:
  $$ p \cdot U(X) > U(C) $$
  $$ U(X) > \frac{U(C)}{p} $$
  Since $U$ is unbounded, such an $X$ always exists. The "Super St. Petersburg" argument strengthens this by showing that it's not just one such offer, but an infinite sequence of them that can be aggregated into a single incoherent preference (infinite value).

  ### Conclusion

  The only way to prevent the sum $\sum p_n U(x_n)$ from diverging for *all* possible sequences of $x_n$ is to ensure that $U(x_n)$ cannot exceed some fixed maximum $M$.

  If $U(x)$ is bounded by $M$:
  $$ EU = \sum_{n=1}^{\infty} p_n U(x_n) < \sum_{n=1}^{\infty} p_n M = M \sum_{n=1}^{\infty} p_n = M $$

  No matter how the prizes are escalated, the expected utility can never exceed the bound $M$. Therefore, **boundedness** is the necessary and sufficient condition to immunize an agent against all St. Petersburg-style escalations and Pascal's Muggings. Concavity is merely a contingent defense that fails against an adversary who can scale the stakes to match the utility function's growth.
