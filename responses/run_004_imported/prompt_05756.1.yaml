      *   *The Problem:* Egoism (maximize my own good) and Utilitarianism (maximize general good) are both rationally self-evident.
      *   *The Dualism of Practical Reason:* Sometimes these two conflict. If they conflict, reason contradicts itself. This is a "fundamental contradiction" in our moral consciousness.
      *   *The Solution:* For morality to be fully rational, there must be a harmony between duty (utilitarianism) and self-interest (egoism).
      *   *The Requirement:* This harmony requires a moral order of the universe (God + Immortality + Sanctions). If virtue isn't rewarded and vice punished in the long run, egoism might win, and utilitarianism becomes irrational for the agent.
      *   *Conclusion:* Ethics *depends* on theology/metaphysics. If theology is an empirical question (evidence of divine order), then investigating it is part of ethical inquiry.

  3.  **Connect to Psychical Research (The "How"):**
      *   Sidgwick wasn't looking for ghosts for fun. He was looking for *evidence of survival*.
      *   Survival (immortality) is a necessary condition for the harmony of duty and interest.
      *   Traditional theology (revelation, dogma) wasn't enough for a rigorous empiricist like Sidgwick.
      *   Psychical research offered a *scientific* method to investigate transcendent claims.
      *   Therefore, SPR wasn't a hobby; it was the empirical arm of his ethical system.

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the user's insight (Parfit connection is spot on). State the thesis: SPR was the empirical completion of *The Methods of Ethics*.
      *   **The Dualism of Practical Reason:** Explain the core philosophical crisis. Egoism vs. Utilitarianism. The threat of practical irrationality.
      *   **The Theological Premise:** Sidgwick's "Cosmic Ethics." The need for a moral governor and future life to reconcile the dualism. Without this, ethics is a sham.
      *   **From Metaphysics to Methodology:** Why traditional religion failed him (dogma) and why philosophy alone couldn't solve it (needs empirical fact). Enter the scientific method applied to the supernatural.
      *   **Intellectual Honesty vs. Eccentricity:** Contrast Sidgwick's rigorous skepticism with the credulity of other spiritualists. He wanted *proof*, not comfort. This makes it a continuation of his rigor, not a break from it.
      *   **Addressing Motivated Reasoning:** This is the tricky part. Yes, he *wanted* it to be true. But did he lower his standards? No. He subjected his hopes to brutal scrutiny. The *motivation* was philosophical necessity, not psychological weakness. Distinguish between "wishful thinking" and "hypothesis driven by systematic necessity."
      *   **Conclusion:** Reiterate that separating Sidgwick the Ethicist from Sidgwick the Psychical Researcher creates a false dichotomy. One implies the other.

  5.  **Refining the Argument (Self-Correction/Nuance):**
