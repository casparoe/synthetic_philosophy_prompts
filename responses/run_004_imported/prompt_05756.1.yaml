answer: |-
  This is one of the most underappreciated connections in the history of moral philosophy. You are absolutely right to follow Parfit's lead here; Parfit recognized that Sidgwick's *The Methods of Ethics* leaves a wound open that Sidgwick spent the rest of his life trying to stitch shut.

  The standard intellectual history treats Sidgwick's presidency of the Society for Psychical Research (SPR) as a Victorian quaintness—a great mind succumbing to the spiritualist fads of the 1880s. I argue the opposite: **Sidgwick's psychical research was the empirical arm of his ethical system.** It was not a lapse in rigor, but a desperate, rigorous attempt to save rational morality from collapsing into contradiction.

  Here is the case for why the SPR was not a hobby, but a philosophical necessity.

  ### 1. The Dualism of Practical Reason as an Emergency
  To understand why Sidgwick went hunting for ghosts, you have to understand the catastrophe at the end of *The Methods of Ethics*.

  Sidgwick dismantles common-sense morality and reconstructs it on three foundations: Intuitionism, Egoistic Hedonism, and Universal Hedonism (Utilitarianism). He argues that both Egoism (maximize my own happiness) and Utilitarianism (maximize general happiness) are equally self-evident axioms of practical reason.

  The problem arises when they conflict. If sacrificing my own happiness creates more general happiness, Utilitarianism says "do it," but Egoism says "don't." Sidgwick finds no rational way to prioritize one over the other within the immanent frame of human life. He calls this the **"Dualism of Practical Reason."**

  This isn't just a puzzle; for Sidgwick, it is a crisis. If reason contradicts itself, then morality is not fully rational. If morality is not fully rational, the "moral ought" loses its binding force. As he famously wrote, the contradiction implies that "the moral order of the world is not complete."

  ### 2. "Cosmic Ethics" Requires Empirical Facts
  Sidgwick concludes that the only way to resolve the Dualism is to posit a **"Cosmic Ethics."** For duty and self-interest to harmonize, there must be a superhuman authority (God) who administers sanctions (rewards and punishments) in a future life (Immortality).

  If virtue is rewarded and vice punished in the afterlife, then it is *always* in my self-interest to be virtuous. Egoism and Utilitarianism reconcile.

  But here is the pivot point: **Sidgwick was an empiricist.** He was not satisfied with Kantian postulates or theological dogma. He refused to believe something simply because it was morally convenient. In *The Methods*, he writes:

  > *"I do not see how the Belief in God... can be rationally held... unless it can be shown that there is evidence for it."*

  If the rationality of ethics depends on the existence of a moral order (God/Immortality), and the existence of a moral order is a factual claim about the universe, then **investigating that claim becomes an ethical duty.**

  Sidgwick could not simply assume the afterlife existed to save his ethical system. He had to check if it *actually* existed. If the universe is godless and death is the end, Sidgwick was willing to accept that morality might be fundamentally irrational. But he wasn't going to settle for "irrational" without first exhausting every empirical avenue to prove otherwise.

  ### 3. Psychical Research as Applied Epistemology
  This is where the SPR comes in. In the late 19th century, traditional theology was crumbling under biblical criticism and Darwinism. You couldn't just read the Bible to prove immortality. However, Spiritualism claimed to offer **empirical evidence** of survival. Mediums, telepathy, and apparitions were presented as observable phenomena.

  Most scientists dismissed this out of hand as superstition. Sidgwick dismissed the *conclusions* of spiritualists but took the *method* seriously. He reasoned:
  1.  If immortality is true, it must manifest somehow in the physical world (otherwise it is ethically irrelevant).
  2.  If it manifests, it leaves empirical traces (telepathy, mediumistic data).
  3.  Therefore, the scientific investigation of these traces is the only valid way to test the theological premise required for ethics.

  Sidgwick didn't join the SPR to believe in ghosts; he joined to **audit** the claims. He spent decades cross-examining mediums, looking for fraud, and demanding controlled conditions. He was applying the same ruthless skepticism to psychical phenomena that he applied to moral intuitions.

  To separate "Sidgwick the Ethicist" from "Sidgwick the Psychical Researcher" is to pretend that his ethics didn't have metaphysical prerequisites. It treats his search for evidence of a moral order as a hobby, when it was actually the quality control department for his life's work.

  ### 4. The "Motivated Reasoning" Objection
  The obvious counter-argument is: *Isn't this just wishful thinking?* Sidgwick needed immortality to be true so he wouldn't have to face the abyss of moral irrationality, so he looked for evidence where none existed. This looks like classic motivated reasoning.

  Here is the strongest defense against that charge:

  **A. Motivation vs. Justification**
  Yes, Sidgwick was *motivated* to find evidence. But motivated reasoning becomes irrational only when you lower your epistemic standards to accept the evidence. Sidgwick did the opposite. He was notoriously, painfully skeptical. He debunked far more mediums than he validated. He admitted publicly that the evidence for survival was weak and inconclusive.
  If he were merely wishful thinking, he would have seized on the first convincing séance. Instead, he subjected his own deepest philosophical hope to a scrutiny so severe it almost guaranteed failure. That is not a lapse in rigor; it is the **application of rigor to one's own hopes.**

  **B. The Rationality of the Search**
  Consider the stakes. If the Dualism of Practical Reason is true, then the rationality of human action is in question. This is the highest possible stake for a philosopher.
  If there is a 1% chance that psychical research could yield evidence of a moral order, the Expected Value of investigating it is infinite (because it saves the rationality of morality).
  Ignoring the potential evidence because it looks "woo-woo" would be *more* irrational than investigating it. Sidgwick followed the evidence where it might lead, even if it led to a place his peers found embarrassing.

  **C. The Will to Believe vs. The Duty to Verify**
  William James (who was influenced by Sidgwick here) argued for the "Will to Believe." Sidgwick is different. He argues for the **Duty to Verify.** He acknowledges that he *wants* it to be true, but he refuses to *believe* it until verified. He writes in a letter:
  > *"I am convinced that the belief in a future life... is necessary to make life worth living... but I cannot force myself to believe it on insufficient evidence."*

  This is the antithesis of motivated reasoning. Motivated reasoning says, "I want X, therefore I believe X." Sidgwick says, "I need X for my system to work, therefore I must test X rigorously, and if X fails the test, my system fails."

  ### 5. Conclusion: The Tragic Integrity of Sidgwick
  The standard narrative treats Sidgwick's psychical research as a decline—a great mind going soft in old age. I suggest it is actually the story of his intellectual integrity reaching its tragic limit.

  Sidgwick realized that secular utilitarianism rests on a fragile foundation. If there is no God and no afterlife, the "rationality" of being moral is not guaranteed. Most modern ethicists just shrug and say, "Well, maybe morality isn't rational in that way." Sidgwick couldn't shrug. He thought that if morality isn't rational, we are lost.

  So, he went out into the dark with a lantern, looking for empirical proof of the divine order his ethics required. He didn't find it. He died essentially agnostic, holding the tension of the Dualism until the end.

  To call this an eccentricity is to misunderstand the stakes of *The Methods of Ethics*. The psychical research wasn't a distraction from his philosophy. It was the brutal, empirical testing ground for his philosophy's most vulnerable premise. He didn't fall down a rabbit hole; he walked into the laboratory to test the hypothesis that made his life's work possible. That he found the lab empty is a tragedy, but conducting the experiment was the only rational move available to him.
