      *   **Task 2:** Argue *against* the conclusion using the argument's *own* resources (internal critique). Do not use physicalism or external premises Gödel would reject. Show that even granting rationalism/teleology, personal afterlife doesn't follow.
      *   **Goal:** Help the user decide how much space to give this in their article.
      *   **Tone:** Philosophical, rigorous, charitable but critical, suitable for a journalist writing a serious piece.

  2.  **Task 1: Reconstruction (The Steelman):**
