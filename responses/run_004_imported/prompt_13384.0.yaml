          *   **Anti-Mechanism:** Mind is not reducible to brain; mind can grasp truths beyond algorithmic computation (ties to Incompleteness).
          *   **Theodicy:** The world is just; injustice (unfulfilled potential) must be rectified.

  3.  **Task 2: Internal Critique (The Counter-Argument):**
