answer: |-
  You haven't lost your mind, and you definitely don't have a normalization bug. **You are absolutely correct: Jeffrey conditionalization is not commutative.**

  If you perform Update A then Update B, you will generally get a different probability distribution than if you perform Update B then Update A. This is a well-known, documented, and often debated feature of the framework.

  It is one of the main reasons why, despite being mathematically elegant, Jeffrey conditionalization is used less frequently in practical AI/robotics than standard Bayesian updating with likelihood ratios.

  Here is the breakdown of why this happens, why it isn't necessarily a "failure" of rationality, and—most importantly for your bot—how to fix it so your updates commute.

  ### 1. Why Order Matters (The Math Intuition)

  In standard Bayesian conditioning, you update on a fact $E$ becoming certain ($P(E)=1$). Because multiplication is commutative ($P(A \cap B) = P(B \cap A)$), the order of hard facts doesn't matter.

  Jeffrey conditionalization is different. You aren't setting a probability to 1; you are shifting the probability of a partition $\{E_1, E_2, ...\}$ to new values $\{q_1, q_2, ...\}$. The rule is:
  $$P_{new}(H) = \sum P(H | E_i) \cdot q_i$$
  Crucially, the likelihoods $P(H | E_i)$ are taken from the **current** distribution.

  When you perform the first update, you change the underlying probabilities of the world. When you perform the second update, it uses the *new* baseline probabilities to calculate its likelihoods. If the two updates touch overlapping parts of the probability space (which they almost always do), the second update "sees" a different world depending on whether the first update already happened.

  **The Exception:** There is a specific mathematical condition (often called **Wagner's Condition**) under which Jeffrey updates do commute. It requires that the likelihood ratios implied by the second update remain invariant under the first update. In plain English: The second hint must be statistically independent of the first hint in a very specific way. In a game with hidden info where hints might correlate (e.g., two clues pointing to the same room), this condition rarely holds.

  ### 2. Is This "Damning" for Rationality?

  It feels damning because we have an intuition that "evidence is evidence." If I hear two rumors, surely the order I hear them shouldn't change my final belief.

  However, proponents of Jeffrey conditionalization argue that **the inputs themselves are order-dependent.**

  In standard Bayes, the input is "I observed X."
  In Jeffrey, the input is "My confidence in X is now 80%."

  That "80%" is a subjective constraint. If I hear Hint A first, it might change how I interpret the reliability of Hint B.
  *   **Scenario 1:** I hear a vague rumor that the item is in Room 3 (Update A). Then I find a map that is 80% reliable pointing to Room 3 (Update B).
  *   **Scenario 2:** I find the map first (Update B). Then I hear the vague rumor (Update A).

  In Jeffrey conditioning, you are encoding the *result* of your interpretation into the probability number. If the order changes how you interpret the hint's weight, the non-commutativity is actually capturing a real psychological or contextual dependency.

  **However,** for a bot, you usually want the hints to have fixed reliability regardless of order. You want the *hint's quality* to be the input, not the *resulting confidence*.

  ### 3. The Solution: Use "Virtual Evidence" (Likelihood Ratios)

  If you want commutativity (order independence) for your bot, you should stop using Jeffrey Conditionalization and switch to **Pearl's Method of Virtual Evidence** (also known as updating via likelihood ratios).

  This is the standard way to handle "uncertain evidence" in Bayesian networks and robotics.

  #### How it works:
  Instead of telling your bot: *"Update your belief so that P(Room 3) = 0.8"* (Jeffrey),
  You tell your bot: *"I observed a clue. If the item were in Room 3, this clue would appear 4 times more likely than if it were not."* (Likelihood Ratio).

  Mathematically, you update the **odds** rather than the probability directly.
  $$O_{posterior} = O_{prior} \times L$$
  Where $L$ is the likelihood ratio provided by the hint.

  #### Why this fixes your problem:
  1.  **Commutativity:** Multiplication is commutative. $O_{prior} \times L_1 \times L_2$ is the same as $O_{prior} \times L_2 \times L_1$.
  2.  **Separation of Concerns:** It separates the *state of the world* (where the item is) from the *reliability of the sensor/hint* (how good the clue is).
  3.  **No Normalization Headaches:** You just multiply the odds for each hypothesis and normalize at the very end.

  ### 4. Practical Implementation for Your Bot

  Since you are already coding this, here is how you would pivot from Jeffrey to Virtual Evidence:

  **Current (Jeffrey) Approach:**
  *   Input: "Hint suggests Room 3 with 80% confidence."
  *   Action: Force $P(Room 3) = 0.8$, renormalize others.
  *   Problem: Order dependent.

  **New (Virtual Evidence) Approach:**
  *   Input: "Hint suggests Room 3."
  *   Calibration: You decide how reliable this hint type is. Let's say this hint type has a **True Positive Rate** of 0.8 and a **False Positive Rate** of 0.2.
  *   Likelihood Ratio for Room 3: $0.8 / 0.2 = 4$.
  *   Likelihood Ratio for Other Rooms: $0.2 / 0.8 = 0.25$ (assuming symmetry for simplicity).
  *   Action: Multiply the odds of Room 3 by 4. Multiply the odds of other rooms by 0.25. Renormalize.

  If you get a second hint later, you just multiply the new ratios into the existing odds. The order will not matter.

  ### Summary
  1.  **You are right:** Jeffrey conditionalization is non-commutative. Your code is fine; the math is just like that.
  2.  **It's not a bug:** It reflects that "shifting confidence to X%" is a context-dependent action.
  3.  **The Fix:** For a hobby bot (and most real-world applications), **Virtual Evidence / Likelihood Ratios** are superior. They allow you to encode the *reliability* of the hint rather than the *resulting probability*, and they commute perfectly.

  If you want to read more on this specific headache, look up the **"Diaconis and Zabell (1982)"** paper on updating probabilities, or Judea Pearl's discussion on **Virtual Evidence** in *Probabilistic Reasoning in Intelligent Systems*. They tackle exactly this "order matters" frustration.
