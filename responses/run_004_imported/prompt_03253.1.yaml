          4.  *Mistakes/Biases:* Behavioral econ allows for errors in processing, not just preference orderings.
      *   **Welfare Economics Implications:** How do policy economists handle this? (Paternalism, Libertarian Paternalism).
      *   **Philosophical Connection:** Connect back to Sen, Hausman, and the "Preference Satisfaction" theory of welfare.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* You've rediscovered the "Tautology Critique." It's valid. Samuelson intended to purge psychology, but this creates the problem you see.
      *   *Point 1: The Definition of Rationality.* In RPT, rationality = consistency. It does *not* mean "good for you." Economists distinguish *procedural rationality* from *substantive welfare*. The smoker is rational (consistent) but maybe not well-off. But wait, if Utility = Choice, how can they not be well-off?
