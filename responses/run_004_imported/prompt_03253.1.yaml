      *   **The Conflict:** This seems to rule out the possibility of akrasia, addiction, or self-defeating behavior being "irrational" in a welfare sense, provided choices are consistent (satisfy WARP/SARP). Yet, economists *do* talk about addiction, self-control, and manipulation.
      *   **The Question:** How do economists working in this tradition reconcile RPT with phenomena like addiction/akrasia without smuggling in external welfare standards?

  2.  **Deconstruct the User's Argument:**
