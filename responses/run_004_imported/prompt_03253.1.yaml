answer: |-
  You have effectively rediscovered one of the most persistent and damaging critiques of neoclassical welfare economics, often associated with Amartya Sen (particularly his 1977 paper "Rational Fools") and Daniel Hausman. Your deduction is logically sound within the strict confines of the Samuelsonian framework: **if utility is defined exhaustively by revealed preference, and rationality is defined exhaustively by consistency, then a consistent agent cannot be acting against their own interest.**

  On the strict revealed preference account, the smoker who consistently chooses cigarettes over health *is* maximizing utility. To say otherwise is indeed to smuggle in an external, psychological, or objective standard of well-being that the Samuelsonian revolution was explicitly designed to purge from economics.

  So, how do economists talk about addiction, akrasia, and exploitation without abandoning the formal machinery they rely on? They generally do so by employing one of three strategies that effectively relax or bypass the strict Samuelsonian identity you identified.

  ### 1. Intertemporal Inconsistency (Violating SARP over Time)
  The most common technical move is to shift the domain of consistency from a static moment to a dynamic timeline.

  In the classic Samuelsonian model, consistency (WARP/SARP) is tested across different budget constraints at a given logical moment. However, when economists model addiction or self-control, they often look for **time-inconsistency**.

  If an agent at $t_1$ prefers Bundle A (health) over Bundle B (smoking) for consumption at $t_2$, but when $t_2$ arrives, they choose B over A, they have violated a dynamic consistency condition. Under exponential discounting (the neoclassical standard), preferences should be time-consistent. If they are not, the agent is vulnerable to a "money pump" (or in this case, a health pump), which allows economists to label the behavior as irrational *even within a formalist framework*.

  This is where **hyperbolic discounting** models (Laibson, O'Donoghue, Rabin) enter. These models posit that agents have different discount rates for immediate vs. delayed gratification. This generates preferences that violate dynamic consistency. Here, the economist isn't smuggling in an external welfare standard; they are pointing out that the agent's choices violate the *internal* consistency conditions required for a stable utility function over time. The "irrationality" is a formal inconsistency across temporal slices of the same agent.

  ### 2. The Multiple Selves Model (Intrapersonal Conflict)
  When time-inconsistency becomes too severe to model as a single agent with weird discount rates, economists often fracture the agent. This is the **Multiple Selves** approach (e.g., Thaler & Shefrin's "Planner and Doer," or Fudenberg & Levine's dual-self models).

  In this framework, "Utility" is no longer a property of the observed choice of the physical organism. Instead, welfare is identified with the preferences of the "Planner" (the long-run self), while the actual choice is driven by the "Doer" (the short-run self).

  *   **How this solves your puzzle:** It breaks the identity between *Choice* and *Welfare*. The choice reveals the Doer's preference, but welfare is defined by the Planner's preference.
  *   **The Cost:** This is a significant departure from methodological individualism. It implicitly accepts a psychological reality (conflicting mental systems) that strict revealed preference theory was meant to avoid. It allows economists to say the smoker is "hurting themselves" because the "self" that matters for welfare (the Planner) is being overridden.

  ### 3. Decision Utility vs. Experienced Utility
  Perhaps the most philosophically robust challenge to your deduction comes from the distinction between **Decision Utility** (the weight assigned to an option in choice) and **Experienced Utility** (the hedonic quality of the outcome).

  Samuelson explicitly banished Experienced Utility (Bentham's pleasure/pain) because it was unobservable. However, the rise of Behavioral Economics (Kahneman, Sugden, etc.) has rehabilitated it. Kahneman argues that if a person chooses X, but X yields less happiness than Y (measured via self-reports or physiological markers), the choice is a **welfare mistake**.

  *   **How this solves your puzzle:** It denies your Premise 1. It claims utility *is* something over and above the ordering that rationalizes choices.
  *   **The Cost:** It requires economists to make interpersonal and intrapersonal comparisons of psychological states, which many traditionalists view as unscientific. However, this is increasingly how "well-being" is operationalized in development economics and public policy (e.g., the OECD Better Life Index).

  ### 4. Rational Addiction (The Neoclassical Defense)
  It is worth noting that some economists, most notably Gary Becker and Kevin Murphy ("A Theory of Rational Addiction," 1988), bite the bullet you find unpalatable.

  They argue that the smoker *is* maximizing utility. The smoker knows smoking harms future health but values present consumption highly enough that the trade-off is consistent. They maintain the strict revealed preference identity. On this view, calling addiction "irrational" is unscientific moralizing. Intervention is only justified on grounds of externalities (second-hand smoke, public health costs), not paternalism.

  This view is less popular now than in the 80s, precisely because it struggles to explain why addicts *want* to quit (revealing a preference for non-smoking) but fail to do so (choosing smoking).

  ### The Welfare Economics Consequence
  You asked how economists speak of self-defeating choices given the foundations of welfare economics. The honest answer is: **they cheat.**

  In pure theory (Grad Micro I), the identity holds: Preference = Choice = Welfare.
  In applied welfare analysis (Policy, Development, Behavioral), the identity is broken.

  When a policy economist recommends a "sin tax" on sugar or cigarettes, they are almost always operating on a **Latent Preference** or **Informed Preference** theory of welfare, not a Revealed Preference theory. They assume that if the agent had full information, perfect self-control, or was in a "cool" state (not craving), they would choose differently.

  Daniel Hausman calls this the "Preference Satisfaction" theory of welfare, and he notes that economists slide between "satisfying actual preferences" (Revealed) and "satisfying idealized preferences" (Informed/Rational) depending on whether they are doing positive or normative analysis.

  ### Summary for your Seminar
  Your intuition is correct. Strict Samuelsonian Revealed Preference Theory **cannot** account for akrasia without contradiction. If choices are consistent, they define the good.

  Economists reconcile this by:
  1.  **Formalizing the conflict:** Using time-inconsistency (hyperbolic discounting) to show formal irrationality.
  2.  **Fracturing the agent:** Using Multiple Selves models to separate the locus of choice from the locus of welfare.
  3.  **Re-introducing Psychology:** Distinguishing Decision Utility from Experienced Utility.
  4.  **Implicit Idealization:** In policy contexts, assuming "true" preferences differ from "revealed" choices due to bias or error.

  Sen's critique remains vital here: by defining rationality purely as internal consistency, economics renders itself incapable of distinguishing between a consistent saint and a consistent fool. To distinguish them, economics must silently import the ethical premises it claims to have excluded.
