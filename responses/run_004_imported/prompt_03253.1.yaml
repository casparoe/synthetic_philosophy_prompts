      7.  Closing: The tension remains unresolved in foundational theory.

  9.  (Self-Correction during drafting): Make sure to mention *Rational Addiction* (Becker/Murphy) specifically because it's the neoclassical attempt to keep RPT intact while explaining addiction. It argues the smoker *is* maximizing, just with a high discount rate. But then acknowledge the counter-move (Hyperbolic Discounting).

  10. **Final Polish:** Ensure the distinction between *internal* criteria (consistency) and *external* criteria (welfare) is sharp. This is the crux of the user's confusion.

  *(Self-Correction)*: Wait, I need to be precise about SARP. SARP applies to a single budget set context usually. Intertemporal choice complicates the "budget set." If preferences change, is it the same agent? This is the "Multiple Selves" argument. I should emphasize that.

