          *   *Strategy A: Time.* Intertemporal choice. If I choose A over B today, but B over A tomorrow (with no new info), that violates consistency over time. Hyperbolic discounting models this.
          *   *Strategy B: Multiple Selves.* The "Planner" vs. the "Doer." Welfare is defined by the Planner, Choice by the Doer.
          *   *Strategy C: Experienced Utility.* Edgeworth/Bentham vs. Samuelson. Kahneman brought this back. Choice $\neq$ Happiness.
      *   *Point 3: Rational Addiction.* Becker & Murphy. They argue addiction *can* be consistent (forward-looking). But this is controversial. It sidesteps the "mistake" aspect.
      *   *Point 4: Welfare Economics.* If we can't use revealed preference for welfare, what do we use? "Latent preferences," "Informed preferences," or "Objective lists." This is where the "smuggling" happens, as the user suspected.
      *   *Conclusion:* The user is right that *strict* Samuelsonian RPT cannot handle akrasia. Economists handle it by relaxing RPT assumptions (Behavioral) or by implicitly reintroducing psychological welfare (Rational Addiction/Multiple Selves).

