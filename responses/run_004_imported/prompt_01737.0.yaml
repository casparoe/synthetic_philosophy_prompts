  *   **The Barrier to Entry:** A layperson will likely just hear "philosophers are weird" (which you want to avoid), but a philosopher of science will recognize the specific absurdity of prioritizing the *contrapositive* evidence class for practical efficiency. If a layperson laughs, it should be out of confusion, not recognition.
