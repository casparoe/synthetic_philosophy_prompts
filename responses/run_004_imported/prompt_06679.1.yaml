answer: |-
  Owen: "If Malcolm's choice to leave was just the inevitable result of the chain of events before it—our father's drinking, his own panic, the chemistry in his brain—then what does my resentment actually latch onto? Pereboom says if he couldn't have done otherwise, he doesn't deserve it. I can't find a flaw in that."

  Ruth: "Strawson would say you're asking the wrong question. You're looking for a metaphysical verdict when you're standing in the middle of a relationship. Resentment isn't a judgment on his soul, Owen; it's a demand for regard. It's how you tell him he matters enough to be held accountable."

  Owen: "But if the determinists are right, he *couldn't* regard me differently. He was built to run. So holding him accountable isn't a demand; it's just a reflex. Like flinching when a ball comes at your head. It's not 'fitting,' Ruth. It's just mechanics."

  Ruth: "There is a difference between a reflex and a reaction. We don't resent the ball. We resent the person who threw it. You're conflating 'you can't help feeling this' with 'the feeling has no warrant.' The warrant doesn't come from the cosmos; it comes from the fact that you are his brother, not his observer."

  Owen: "But if I'm just a biological machine reacting to another machine, the 'brother' part is just a story I tell myself to make the pain feel noble. If I drop the story, maybe I drop the pain. Isn't that better than nursing a grudge that the universe says is baseless?"

  Ruth: "It might be less painful. But it's also colder. To adopt that 'objective attitude' you're describing—to see him as something to be explained rather than answered to—is to exile him from the human community. Are you prepared to treat him like a patient, or a problem, instead of a man?"

  Owen: "If the truth is that he's a problem caused by prior conditions, then yes. I'd rather be honest and alone than comforted by a fantasy of free will that lets me hate him legitimately. At least the hate makes sense if I admit it's just... noise."

  Ruth: "It isn't noise if it's the only language you have left to speak to him. You say you want to be honest. But treating him as an object isn't honesty, Owen. It's a retreat. You're protecting yourself from the risk that he might actually hear you."

  Owen: "And if I risk it, and he still can't hear me? Because he can't? Then I've wasted thirty years waiting for a response that was never possible. I'm tired, Ruth. I want to put the weight down."

  Ruth: "Then put it down. But don't tell yourself it's because physics demands it. Tell yourself it's because you're choosing to stop the conversation. That's a different kind of silence. One you might find harder to live with than the anger."

  Owen: "So I keep the anger to keep him human? Even if it burns me? That sounds like a sacrifice he doesn't even know I'm making."

  Ruth: "He doesn't have to know. Moral responsibility isn't a contract he signed. It's a stance you take. If you look at him tomorrow with that objective coldness, you aren't proving him determined. You're proving you've given up on the relationship that makes the determination matter."

  Owen: "I'm not sure I have the strength to keep him in the room with me, as a person. It's easier to see him as a symptom of what broke this family. Symptoms don't talk back."

  Ruth: "No, they don't. But neither do they forgive, and they don't mourn. Tomorrow isn't about solving the metaphysics, Owen. It's about whether you can stand in the same room as your brother without turning him into a ghost."
