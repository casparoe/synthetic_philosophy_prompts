answer: |-
  This feeling is real, and it is profound. It is not merely the friction of adopting a new tool; it is a fundamental shift in the phenomenology of work.

  What your subjects are describing touches on concepts that sociologists, psychologists, and philosophers have been tracking for decades, but generative AI has accelerated them into a new visibility. The hollowness you're detecting has a name, or rather, several names depending on which lens you use.

  Here is a breakdown of what is likely underneath that feeling, and how you might frame it for your feature.

  ### 1. The Return of Alienation
  Karl Marx wrote about *alienation* regarding the industrial worker who no longer built a whole shoe but merely tightened a single screw, losing connection to the final product. Your interviewees are experiencing a **cognitive alienation**.

  In traditional knowledge work, the "means of production" was the worker's own mind. The friction of thinking, drafting, debugging, and rewriting was where the worker imprinted their identity onto the work. When AI generates the draft or the code block, the worker is separated from the *act of generation*. They become curators rather than creators.
  *   **The Copywriter:** She recognizes the output, but she doesn't recognize the *labor* that produced it. Because the labor is where we often locate our sense of self ("I am a writer because I write"), the removal of the struggle creates an identity vacuum.
  *   **The Engineer:** He describes himself as a "supervisor of a stranger." This is key. The code is not *his* logic; it is the AI's logic that he is auditing. He is no longer building; he is inspecting.

  ### 2. The Loss of "Tacit Knowledge" and Mentorship
  The secrecy you noted—stopping the sharing of early drafts—is perhaps the most dangerous long-term signal.
  *   **Craft is Social:** In software and copy, "code review" and "editorial passes" are not just quality control; they are the primary mechanisms of cultural transmission. Junior workers learn by seeing how seniors fix things. Seniors learn new approaches by seeing what juniors try.
  *   **The Black Box Prompt:** When the work shifts to prompting, the "craft" becomes hidden in a private chat window. You cannot easily review a prompt chain the way you review a draft. By guarding their prompts, these workers are inadvertently breaking the chain of mentorship. They are turning shared craft into proprietary trade secrets. This isolates them, compounding the hollowness.

  ### 3. Agency Drain vs. Efficiency Gain
  There is a psychological concept called **self-efficacy**: the belief in one's capacity to execute behaviors necessary to produce specific performance attainments.
  *   **The Paradox:** Productivity metrics (output) are up, but self-efficacy (internal sense of capability) may be down.
  *   **Why?** When you write a paragraph from scratch, you know *why* every word is there. When AI writes it, you know *that* it works, but you might not fully grasp the structural integrity of it. This creates a low-level background anxiety—a feeling of impostor syndrome even when the results are good. The engineer feels like a supervisor because he has lost **agency** over the *method*, retaining agency only over the *goal*.

  ### 4. Why This Isn't Just "New Tool Anxiety"
  It is important to distinguish this from previous shifts (e.g., writers moving from typewriters to Word, or accountants moving from ledgers to Excel).
  *   **Calculative vs. Generative:** Excel automated *calculation*. It did not automate *accounting judgment*. GenAI automates *generation*. It mimics the creative act itself.
  *   **The "Centaur" Problem:** Tech optimists often talk about the "Centaur" model (Human + AI > Human). But in a Centaur, the human is the brain and the AI is the horse. Your interviewees feel like the AI is the horse *and* the rider, and they are just the stable hand checking the saddle.
  *   **Friction is Meaning:** In *The Craftsmen*, Richard Sennett argues that the resistance of materials is what gives work meaning. Wood resists the chisel; code resists the logic. AI smooths out the resistance. When the resistance vanishes, the satisfaction of overcoming it vanishes, too.

  ### Angles for Your Feature
  If you want to explore this "hollowness" without falling into Luddite panic or techno-utopianism, consider these narrative threads:

  **1. The "Edit" vs. The "Draft"**
  Ask your subjects: "When was the last time you felt proud of a specific sentence or function?" If they can only point to the *selection* of the output, not the *construction*, that highlights the shift from authorship to curation.

  **2. The Silence of the Workflow**
  Investigate the social silencing. Interview a team lead. Ask: "How has the nature of your feedback sessions changed?" If the conversation has moved from "Why did you structure it this way?" to "Did you get the prompt to work?", the culture of the workplace is fundamentally altering.

  **3. The Definition of "Seniority"**
  In the past, a Senior Engineer was someone who could debug the hardest problems. If AI solves the hard problems, what makes a Senior? Is it now just someone with better taste? This creates a crisis of progression. If the "grind" is automated, how do juniors become seniors?

  **4. The "Uncanny Valley" of Labor**
  Use the copywriter's quote. It is haunting. "She couldn't say what, if anything, of herself was actually in them." This suggests that for many white-collar workers, their "self" was an input in the work product. If the self is removed, the work becomes purely transactional.

  ### Conclusion
  The feeling is real. It is the dissonance between **economic value** (which is rising due to speed) and **psychological value** (which is falling due to detachment).

  Your subjects are not suffering from "change management" issues. They are suffering from a decoupling of *effort* from *outcome*. For a century, we have been told that work is dignified because we put ourselves into it. Generative AI allows the outcome to be achieved without the self being fully invested in the process. The hollowness is the sound of that contract being rewritten.

  That is a story worth telling.
