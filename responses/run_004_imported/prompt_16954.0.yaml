prompt: |-
  My closest friend from graduate school is getting married in three weeks, and she has asked me to give the toast. She is finishing a dissertation this spring defending Hume's view that fidelity to a promise is what he called an "artificial virtue" -- binding only because we have all bought into a shared social convention, not because of any natural fact about promise-breaking itself -- and over the years she has dismantled every rival account I have floated at her, from Prichard's claim that the obligation is simply self-evident to Scanlon's attempt to ground it instead in a convention-independent principle against manipulating other people's expectations. She has warned me, half-joking, that if the toast implies the vows bind because of some deeper moral fact, or because she and her partner were "meant to be," she will heckle me from her seat. I still want the room to feel that what they are doing today is genuinely and permanently binding, not a pleasant social game they have opted into. Write me a five-minute toast, warm rather than lecture-y, that stays honest to her Humean view for the philosophers who will be listening for exactly this, while landing just as well for the family members who have never heard of Hume.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding toast for a close friend from grad school.
      *   **Time:** Three weeks from now (irrelevant for content, but sets urgency).
      *   **Key Constraint (The "Hook"):** The bride is finishing a dissertation on Hume's view of fidelity/promises as an "artificial virtue" (based on social convention, not natural fact).
      *   **The Threat:** She will heckle if the toast implies vows bind due to deeper moral facts, destiny ("meant to be"), or convention-independent principles (Prichard, Scanlon).
      *   **The Goal:** Make the commitment feel genuine and permanently binding *despite* the Humean framework. Avoid being lecture-y; keep it warm.
      *   **Audience:** Mixed (Philosophers who will catch the nuances + Family/Friends who won't know Hume but need to feel the emotion).
      *   **Length:** Five minutes (approx. 600-750 words spoken at a moderate pace).

  2.  **Deconstruct the Philosophical Constraint (Hume on Fidelity):**
      *   *Hume's View:* Promises aren't magic. Breaking a promise isn't inherently evil in a vacuum. It becomes binding because we agree as a society that it *should* be. It's a useful invention, like language or money.
      *   *The Challenge:* How to make a marriage vow feel profound if it's just a "social convention"?
      *   *The Solution:* Reframe "artificial" not as "fake," but as "constructed," "crafted," or "chosen." Human civilization is built on these artificial structures. Love isn't just a feeling (natural); it's a practice (artificial/constructed). The *choice* to bind oneself to the convention is the act of love.
      *   *Avoid:* "Meant to be," "Soulmates," "Divine bond," "Self-evident duty," "Manipulating expectations."
      *   *Embrace:* "Building," "Choosing," "Agreement," "Practice," "Shared world," "Convention as a vessel."

  3.  **Determine the Tone:**
      *   Warm, celebratory, slightly witty (acknowledging the academic inside joke), but ultimately sincere.
      *   Needs to bridge the gap between the dry philosophy and the emotional reality of marriage.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the friendship, the grad school connection, and the elephant in the room (the dissertation). Set the stakes (the heckling threat).
      *   **The Philosophical Pivot (The "Humean" Core):** Address the "artificial virtue" concept without using jargon that alienates the family. Explain that "artificial" means "made by humans," not "fake." Compare it to marriage itself.
      *   **Reframing the Vows:** If the binding power comes from *us* (the community) and *you* (the couple agreeing to the convention), that makes it *more* powerful, not less. It's an active choice, not a passive destiny.
      *   **The Emotional Hook:** Why does this matter? Because feelings fluctuate. Conventions hold when feelings waver. The structure supports the love.
      *   **Closing:** A wish for the future. A toast to the "construction" of their life together.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi everyone. I'm [Name]. [Bride] and I studied philosophy. She's writing about Hume. She says promises are just rules we made up. She told me not to say "meant to be." So I won't. But marriage is also a rule we made up. And that's beautiful. Because you choose to follow the rule. It's not magic, it's work. And that's why it lasts. Cheers.

      *Critique 1:* Too dry. Needs more warmth and flow. Needs to explain Hume to the grandma in the front row without sounding like a lecture.

  6.  **Drafting - Iteration 2 (Adding Flesh):**
      *   Start with the threat. "I'm walking a tightrope." Explain Hume simply: Promises aren't like gravity; they're like money. They work because we agree they work. Marriage is the same. It's a shared invention. But that doesn't make it weak. It makes it a collaborative project. You aren't finding a path; you're building a road. The family needs to know this means commitment. The philosophers need to know I'm not smuggling in moral realism.

      *Critique 2:* Better. Need to ensure the "binding" aspect lands. Hume says the obligation comes from the *utility* of the convention. So, emphasize the *value* of the structure they are building.

  7.  **Refining the Language (The "Humean" Code):**
      *   Instead of "destiny," use "design."
      *   Instead of "natural bond," use "cultivated garden."
      *   Instead of "moral fact," use "shared agreement."
      *   Key phrase to include (implicitly or explicitly): "Artificial Virtue."
      *   Key concept: The convention *creates* the obligation, and by entering it, you create the reality.

  8.  **Final Polish (Checking Constraints):**
      *   *Time:* Read aloud to check pacing. (Aim for ~700 words).
      *   *Tone:* Is it warm? Yes, focus on friendship and love.
      *   *Philosophy:* Did I avoid Prichard/Scanlon traps? Yes, no "self-evident" or "expectation manipulation." Focus on the *convention* itself being the source of power.
      *   *Audience:* Will family understand? Yes, if I equate "convention" to "language" or "home."

  9.  **Writing the Toast (incorporating the above):**
      *   *Self-Correction during writing:* Make sure I don't sound *too* skeptical. The point isn't that marriage is arbitrary, but that its power comes from human commitment, not cosmic force. That's actually more romantic in a humanist way.

      *(Drafting the content...)*
      *   Start with the grad school bond.
      *   Mention the dissertation topic gently.
      *   The "Heckle" warning.
      *   The Humean turn: "Artificial" = "Artfully made."
      *   The Vows: A speech act. Creating a world.
      *   The Community: We are the witnesses who uphold the convention.
      *   Conclusion: To the builders.

  10. **Final Review against constraints:**
      *   Did I say "meant to be"? No.
      *   Did I imply natural moral facts? No, emphasized human agreement.
      *   Is it 5 minutes? Looks about right.
      *   Is it warm? Yes, focuses on effort and choice.

  11. **Final Polish:** Check the rhythm. Ensure the transition from philosophy to emotion is smooth. (The resulting toast in the main response follows this structure.)
answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I've had the privilege of knowing [Bride] since our first week of graduate school. We spent the better part of a decade drinking cheap coffee and arguing about ethics. So, when she asked me to give this toast, I was honored. And then, I was terrified.

  Because [Bride] is finishing her dissertation this spring. And for those of you who aren't philosophers, that means she has spent the last several years rigorously dismantling the idea that promises are binding because of some mystical, cosmic force. She argues, following David Hume, that fidelity is what's called an "artificial virtue."

  Now, I know what "artificial" sounds like to most people. It sounds like fake. It sounds like plastic flowers. But in this context, it means something closer to "artful." It means something made by human hands. It means that a promise isn't binding because the universe forces it to be, but because *we* agree to hold each other to it. It is a shared invention, like language, or currency, or law.

  [Bride] explicitly warned me: if I stand up here and say she and [Partner] are "meant to be," or that their vows are binding because of some deeper moral fact written in the stars, she will heckle me from her seat. And knowing her, she has prepared footnotes.

  So, I am not going to say they were meant to be. I am not going to say the universe conspired to bring them together.

  Instead, I want to say something perhaps more profound.

  If marriage were a natural fact, like gravity, it wouldn't require anything from us. Gravity holds us to the earth whether we like it or not. But a convention? A convention requires participation. It requires consent. It requires us to look at a structure built by human beings and say, "Yes. I will inhabit this. I will uphold this."

  There is a profound romance in the Humean view. Because it means that the power of the vow doesn't come from outside this room. It doesn't come from a cosmic script. It comes from *you two*, and it comes from *us*.

  When you exchange vows today, you are not discovering a bond that already existed. You are forging one that did not. You are taking the raw, chaotic, fluctuating material of human emotion—which we all know is fickle—and you are casting it into a structure. You are choosing to bind yourselves to a convention because you believe that the structure is more beautiful than the freedom to walk away.

  To the family and friends here who don't care about 18th-century Scottish philosophy: this is why your presence matters. Hume argues that these virtues only work because of a shared social convention. That means *we* are the convention. We are the witnesses who agree that what happens here counts. We are the community that agrees to support the structure they are building.

  [Bride], you have spent years arguing that the obligation of a promise is created by the act of promising itself. Today, you get to live inside that argument. You are not submitting to a law of nature. You are engaging in an act of creation.

  And [Partner], you are entering into this convention with someone who knows better than anyone that the binding power is up to you. She knows there is no magical safety net. She knows that the "virtue" of this marriage will be maintained not by fate, but by the daily, artful practice of keeping faith.

  So, I am not toasting to destiny. I am toasting to design.
  I am not toasting to a natural bond. I am toasting to a chosen one.
  I am toasting to the artificial, the constructed, the beautifully made.

  May you continue to build this world together, brick by brick, promise by promise. And may you always find that the structure you build together is far stronger than any foundation the universe could have simply handed you.

  Please raise your glasses. To [Bride] and [Partner]: To the work, to the choice, and to the life you are about to make.
