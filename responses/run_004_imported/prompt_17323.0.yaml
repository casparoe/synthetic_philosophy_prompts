answer: |-
  The metronome sat on the piano lid, black and unassuming, save for the single glass vial embedded in its casing. Inside the vial, suspended in clear oil, was a slip of paper. If Julian tapped the base, the paper would unfold to reveal a single word: *Success* or *Failure*. It would tell him, with absolute fidelity, whether the orchestra would survive the season.

  It cost nothing to use. There were no batteries to buy, no fees to pay. The only currency was the certainty itself.

  Julian stood in the empty concert hall, the dust motes dancing in the shafts of afternoon light that cut through the high windows. The orchestra was bankrupt. The board had given him an ultimatum: this final gala had to fill the seats and secure the donors, or the Philharmonic would be dissolved, the musicians scattered, the pensions frozen.

  He looked at the metronome. The rational calculation was simple, almost arithmetic. If the vial showed *Failure*, he could cancel the gala. He could liquidate the assets now, while the value was still high, ensuring every musician got their severance. He could spare them the humiliation of playing to an empty house, spare himself the shame of a public collapse. He could pivot to a smaller ensemble, a teaching conservatory, something sustainable. Information allowed for optimization. To ignore the data was to gamble with other people's livelihoods.

  But if he looked and saw *Success*? Then the pressure would calcify. Every rehearsal would be performed under the weight of inevitability. The music would become a task to be completed rather than a fire to be kindled. He knew himself well enough to know that certainty made him rigid. He conducted best on the knife-edge of doubt, where every phrase was a plea and every crescendo a prayer.

  His assistant, Mara, leaned against the doorframe. She knew what the device was. She knew what it cost to use it.

  "The board is asking for the budget allocation for the next season," she said softly. "They need to know if they should print the brochures."

  "If I look," Julian said, not turning from the piano, "and it says *Failure*, we stop. We save the money."

  "And if it says *Success*?"

  "Then we spend everything we have."

  "And if you don't look?"

  "Then we spend everything we have anyway," Julian said. "But we spend it believing we have a choice."

  Mara walked over to the piano. She hovered her hand over the metronome. "It's irrational, Julian. If you know the bridge is out, you don't drive onto it. That's not courage, that's negligence."

  "If I know the bridge is out, I don't build it," he corrected. "But this isn't a bridge. It's a performance. The value isn't just in the arrival. It's in the crossing."

  He thought of the cellist in the second row, who needed this job to keep her visa. He thought of the trumpeter, whose hands were shaking so badly last week he couldn't hold a note. If Julian knew it was doomed, he could send them home with pay. He could be a benevolent manager. But if he didn't know, he had to be a conductor. He had to demand everything from them, pushing them toward a horizon that might not exist. Was it kinder to give them hope that might be false, or certainty that was bleak?

  The silence of the hall pressed in. The metronome waited. It was the only thing in the room that was truly still.

  Julian picked up his baton. He tapped it against his palm, a rhythmic *click, click, click*. He thought about the nature of the utility he was maximizing. Was it the financial solvency of the institution? Or was it the integrity of the art? Good logic dictated that you never turn down free information. It could only help, or at worst, do nothing. But logic assumed the decision-maker remained the same before and after the knowledge. It assumed Julian would remain the man who could inspire an orchestra regardless of the odds.

  He wasn't sure that man existed if the odds were zero.

  "If I look," Julian said, "I become an administrator. If I don't, I remain a conductor."

  "Administrators keep the lights on," Mara said. "Conductors just wave sticks."

  "Administrators manage decline," Julian said. "Conductors defy it."

  He reached out. His fingers brushed the cold glass of the vial. He could feel the mechanism inside, the tiny gears waiting to unwind the paper. It was so easy. Just a tap. The truth was right there, weightless and dry.

  He imagined tapping it. He imagined the paper unfolding. He imagined the word *Failure* staring up at him. In that scenario, he sees the pity in Mara's eyes. He calls the board. They cancel. The musicians are paid off. The hall is locked. The music stops. The money is saved. The people are safe, but the thing they loved is dead before it ever played a note.

  Then he imagined not tapping. He imagined the gala night. The house is full. They play Mahler. They play with a desperation that comes from not knowing if there will be a tomorrow. The critics weep. The donors open their checkbooks. Or, the house is half-empty. The checks don't come. They dissolve anyway, but they dissolve having sung the song all the way through.

  The doubt gnawed at him. Was this nobility, or was it vanity? Was he protecting their hope, or was he protecting his own ego from the verdict of reality? To choose ignorance was to claim that his feeling of purpose outweighed their financial security. That was a heavy burden for a man holding a baton.

  He looked at Mara. She wasn't judging him. She was waiting. She understood that the choice wasn't about the future anymore. It was about who they were allowed to be in the present.

  "If we fail," Julian said, "because I didn't look... the guilt will be mine."

  "If we fail because you looked," Mara countered, "the death will be yours too. Just quieter."

  Julian closed his hand around the metronome. He lifted it. For a second, Mara flinched, thinking he would tap it. He could feel the weight of the mechanism, the promise of clarity. It was so tempting to let the universe decide for him. To outsource the risk.

  Instead, he walked to the edge of the stage. He leaned over the orchestra pit, looking down into the darkness where the musicians would sit. He imagined the empty chairs. He imagined the filled ones.

  "Print the brochures," he said.

  Mara exhaled, a sound like air leaving a room. "You're sure?"

  "No," Julian said. He placed the metronome back on the piano lid. He didn't cover it. He left it there, visible, a silent witness. "But if I know the end, I can't write the middle."

  He raised the baton. The hall was empty, but he conducted the air. He moved through the opening adagio, his body language shifting, loosening. Without the weight of the verdict, his movements were fluid, uncertain, alive. He was gambling with their futures, yes. He was potentially wasting their severance pay on a funeral march. But as he swept the baton through a crescendo, he knew the musicians would feel this energy. They would feel that he believed, truly believed, because he hadn't allowed himself the safety net of knowing otherwise.

  Mara watched him. She saw the change in his posture. The administrator was gone. The conductor was back. She looked at the metronome on the piano, the glass vial catching the light. It was useless now, but it wasn't broken. It was just a thing that had been refused.

  She wondered, as she turned to leave the hall, if she would be thanking him in a year when the pensions were paid and the hall was locked, or if she would be cursing him when they were all destitute but remembered for a single night of brilliance. She didn't know. And as she closed the heavy doors behind her, sealing Julian in the silence with his uncertainty, she realized that not knowing was the only thing that made the risk worth taking.

  Julian stood alone in the light. He tapped the baton against his stand. One, two, three, four. He began to play the silence, waiting for the orchestra to arrive, waiting for the future to arrive, refusing to ask it what it intended to do.
