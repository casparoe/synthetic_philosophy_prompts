      *   **Ignoring Severity:** Not all accidents are equal. A blind curve + pedestrian = potential fatality.
      *   **Gambler's Fallacy:** Just because it hasn't happened often doesn't mean it won't happen *now*.
      *   **Liability:** If the 16-year-old causes an accident, the legal and insurance repercussions are massive.

