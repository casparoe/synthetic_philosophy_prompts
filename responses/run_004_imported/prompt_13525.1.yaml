prompt: |-
  So this happened with my boyfriend and I honestly can't stop overthinking it. We've been together about 4 months (my first real relationship) and I've noticed I get super jealous even when he's just talking to other girls, like nothing has actually happened, I just get this awful feeling in my stomach. I vented about it in our group chat and got two totally opposite reactions: half my friends said feeling jealous just proves you actually love him, and if you felt nothing that would mean you don't care enough, while the other half said jealousy is toxic and a sign of insecurity that I need to work on instead of expecting him to change what he does. I asked my mom and she basically said both things are true at once, which was not helpful lol. Then completely randomly in econ today the class got derailed into an argument about whether monogamy is even "natural" or just something society trained into us, and it kind of connected to what I'd already been stuck on.

  So what I'm actually trying to figure out is bigger then just my own relationship: is jealousy something we're basically wired to feel and should trust as real information that somethings wrong, or is it more like a habit/story we've been taught that a more secure or "evolved" couple could mostly grow out of? And if its more the second thing, does that mean the whole assumption that a good partner should only ever want you specifically is sort of made up too, instead of some deep truth about what love actually is? I keep flip flopping on this and would honestly like an actual argument for one side or the other, not just generic "communication is key" type advice, if thats even possible here.
reasoning: |-
