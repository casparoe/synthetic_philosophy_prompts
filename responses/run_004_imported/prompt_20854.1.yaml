  7.  **Final Polish:** Ensure the distinction between *parameter independence* and *outcome independence* is mentioned in the "glossed over" section, as that's the technical heart of "locality" in Bell tests. Ensure the distinction between *proving nonlocality* and *ruling out local hidden variables* is clear.

