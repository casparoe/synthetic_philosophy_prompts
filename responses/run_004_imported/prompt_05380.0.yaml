      *   **The Economic Layer:** This is the heavy hitter. Women's financial dependence sustains the double standard more than paternity doubt does.
      *   **The Risk of DNA:** Russell might worry DNA reifies genetic fatherhood over social fatherhood (contrary to his Malinowski point).
      *   **Final Verdict:** DNA removes the *excuse*, but not the *motivation*. The work of moral reform continues.

  8.  **Drafting the Content:** (Mental check of specific Russell quotes/concepts).
      *   Concept: "Companionate Marriage."
      *   Concept: Jealousy as "the most tragic of passions."
      *   Concept: Women's economic emancipation.
      *   Concept: The state's interest in children.

      *(Self-Correction during drafting)*: Make sure to address the Malinowski point. Russell used it to show fatherhood is social. DNA makes it biological again. Russell might actually *dislike* how DNA testing reinforces the biological definition of fatherhood, which he thought was part of the problem. That's a sophisticated angle to include.

  9.  **Final Polish:** Ensure the distinction between "explanation" (why it happened) and "justification" (why it should continue) is clear. Russell would say the explanation is historically valid but the justification is now void, yet the *practice* persists due to other factors.

