answer: |-
  This is a great question. Since you're working in foundations of QM, you already have the right instinct: the tension here isn't really about the *math* of Bayes' theorem, but about the *ontology* of what the probability symbol represents.

  Here is the gut-level intuition for why Humphreys' Paradox (1985) targets propensity theory specifically, while leaving frequentists and subjectivists relatively unscathed.

  ### 1. The Core Claim of Propensity Theory
  To see the crack, you have to look at what the propensity theorist is trying to buy.
  *   **Frequentists** buy long-run ratios in ensembles.
  *   **Subjectivists** buy degrees of rational belief.
  *   **Propensity Theorists** buy **objective, single-case, causal dispositions.**

  When a propensity theorist says an atom has a probability $p$ of decaying in time $t$, they are claiming the atom possesses a *physical property* (a "propensity") analogous to mass or charge. This property is a **power to produce** an outcome.

  Crucially, powers are **directed**. A cause produces an effect. The setup exists *before* the outcome. The propensity resides in the physical conditions at $t_0$ to produce an outcome at $t_1$.

  ### 2. The Paradox Setup
  Humphreys' argument is essentially a *reductio ad absurdum* against the identity thesis: **Propensities = Probabilities.**

  Let's use a standard QM-adjacent example: A photon hits a half-silvered mirror.
  *   Let $S$ be the physical setup (photon + mirror at $t_0$).
  *   Let $T$ be the event of transmission (at $t_1$).
  *   Let $I$ be the event of reflection (at $t_1$).

  The propensity theorist says:
  $$Prop(T | S) = 0.5$$
  This makes physical sense. The setup $S$ has a dispositional property to produce $T$.

  Now, apply the probability calculus (Bayes' Theorem). If propensities *are* probabilities, they must obey the inversion rule:
  $$P(S | T) = \frac{P(T | S)P(S)}{P(T)}$$

  So, the propensity theorist is committed to the existence of a quantity:
  $$Prop(S | T)$$

  ### 3. The Gut-Level Clash
  Here is where the intuition breaks for propensities, but holds for the others.

  **For the Subjectivist (Bayesian):**
  $P(S | T)$ is perfectly coherent. It means: "Given that I have observed transmission, what is my degree of belief that the setup was $S$?"
  *   **Direction:** Epistemic. Evidence updates belief.
  *   **Causality:** Irrelevant. I can update my belief about the past based on the future.
  *   **Verdict:** No paradox.

  **For the Frequentist:**
  $P(S | T)$ is a ratio of counts in a reference class. It means: "In the set of all transmission events, what fraction were preceded by setup $S$?"
  *   **Direction:** Set-theoretic. Intersection of sets is commutative ($S \cap T = T \cap S$).
  *   **Causality:** Irrelevant. You just count the pairs.
  *   **Verdict:** No paradox.

  **For the Propensity Theorist:**
  $Prop(S | T)$ means: "Given that transmission occurred, what is the **physical disposition** of the transmission event to **produce** the setup $S$?"
  *   **Direction:** Ontic/Causal.
  *   **Causality:** **Critical.** Propensities are supposed to be properties of the *conditions* that *generate* the outcome.
  *   **The Problem:** Effects do not have dispositions to produce their causes. The transmission event $T$ does not possess a physical "power" to reach back in time and generate the mirror setup $S$.
  *   **Verdict:** **Incoherent.** $Prop(S | T)$ is physically meaningless, yet the probability calculus demands it exists if $Prop(T | S)$ is a probability.

  ### 4. Why the Inversion is Fatal Specifically for Propensities
  The mathematical symbol $|$ (conditional) is **symmetric** in the calculus (via Bayes). You can swap the antecedent and consequent as long as you adjust the values.

  The physical concept of "propensity" is **asymmetric**.
  *   $Prop(E | C)$: The cause $C$ has a power to produce $E$. (Makes sense).
  *   $Prop(C | E)$: The effect $E$ has a power to produce $C$. (Nonsense, unless you believe in retrocausality).

  Humphreys' point is that you cannot map an asymmetric physical relation (causal disposition) onto a symmetric mathematical calculus (probability axioms) without breaking the physical interpretation.

  If you insist $Prop(S|T)$ exists, you are effectively saying the *outcome* has a causal influence on the *preparation*. In standard QM foundations, this looks like retrocausality or a category error.

  ### 5. Why This Matters for Your Work (QM Foundations)
  Since you are looking at decay rates and objective chance, this hits home on the **Wavefunction Ontology**.

  If $\psi$ represents a propensity field:
  1.  $\psi$ at $t_0$ gives propensities for measurement outcomes at $t_1$. ($Prop(M | \psi)$).
  2.  If probabilities apply, Bayes says we can talk about $Prop(\psi | M)$.
  3.  But in most interpretations (Copenhagen, GRW, etc.), the measurement outcome does not have a propensity to create the wavefunction. The wavefunction collapses; it doesn't get "propensitized" by the result.

  This is why many physicists (and philosophers like Popper, initially) struggled here. They wanted probability to be "out there" in the world (propensity), but they wanted to keep using the standard Kolmogorov axioms. Humphreys showed you might have to choose:
  *   Keep the axioms $\rightarrow$ Propensities aren't probabilities (they are something else that *guides* probabilities).
  *   Keep the propensities $\rightarrow$ Modify the probability calculus (e.g., allow non-invertible conditionalization).

  ### 6. The "Escape Hatches" (For Completeness)
  Propensity theorists didn't just roll over. There are two main responses you'll see in the literature:

  1.  **The Conditional Propensity View:** Some argue $Prop(A | B)$ shouldn't be read as "propensity of B to produce A," but rather "propensity of the *total situation including B* to produce A." But this gets messy fast when $B$ is in the future of $A$.
  2.  **Humphreys' Own Conclusion:** Propensities are real, but they are **not probabilities**. They are physical parameters that *constrain* probabilities, but they don't satisfy the full probability calculus (specifically inversion). This is a popular view among modern "primitivist" chance theorists.

  ### Summary
  The intuition is this: **Probability calculus is time-symmetric logic; Propensity is time-asymmetric physics.**

  *   **Frequentists** deal with sets (timeless).
  *   **Subjectivists** deal with information (updates flow against time fine).
  *   **Propensity Theorists** deal with causal powers (flow only forward).

  Humphreys caught them trying to use a time-symmetric tool to measure a time-asymmetric property, and the inversion of Bayes' theorem was the stress test that snapped the handle.
