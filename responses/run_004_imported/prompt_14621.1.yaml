answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], the Best Man and the older brother.

  I've been told I have about five minutes for this speech. Which, for those of you on Priya's side of the room, is roughly the amount of time it takes for my brother's interest in a new project to depreciate by fifty percent.

  I'm kidding. Mostly.

  We need to acknowledge the elephant in the room. Or rather, the pattern in the room. Anyone who has known my brother for more than five years knows he is a man of immense enthusiasm. He commits to things with his whole heart. The CrossFit gym? He was there every day for fourteen weeks. The graphic design career? Brilliant portfolio, lasted one fiscal quarter. His previous relationships? Intense, passionate, and over before the leaves changed color.

  For a long time, I thought this was just him being flaky. But then, through some… let's call them "personal liquidity events" in my own life, I started reading up on behavioral economics. And I realized my brother isn't flaky. He's a textbook case of **hyperbolic discounting**.

  For my brother's family, that's a fancy way of saying he struggles to value Future Rewards over Immediate Gratification. For Priya's side, and especially for her advisor, Dr. [Advisor's Last Name, if known, otherwise "the Professor"] who I see nodding in the back: you know the curve. The value of a long-term goal drops off precipitously the moment a smaller, easier reward appears in the present.

  So, when my brother says, "I'm going to stick with this forever," he isn't lying. At that exact moment, the future value is high. But then, three months in, the "forever" is far away, and the "right now" is hard. And his brain flips the preference. It's not that he doesn't mean his commitments. It's that his brain recalculates the value of commitment the second the cost becomes immediate.

  Now, I could stand here and say, "But love changed him!" And that would be a lie. And I certainly won't say, "It's not his fault, it's just how his brain works," because that feels like a cop-out. You don't get a pass on being a good husband just because you have a steep discount curve.

  So, the question is: Why does this work? Why is Priya the exception to the four-month rule?

  I've thought about this a lot. And I think it's because Priya doesn't try to fight his hyperbolic discounting. She works with it.

  See, most people try to marry my brother for the "Long Term." They talk about the 50-year horizon, the retirement, the legacy. And for my brother, 50 years is too far away to feel real. The value discounts to zero.

  But Priya? Priya makes the *today* worth it.

  She doesn't ask him to suffer now for a reward later. She makes the reward immediate. Being with her isn't a duty he has to endure to get to a happy ending; being with her *is* the happy ending, every single day. She has effectively hacked his reward system. She made the long-term commitment feel like the immediate gratification.

  Priya, you are literally writing your PhD on how human beings make decisions. And somehow, you decided to bet on the one guy in the room whose decision-making process you could model on a whiteboard. That is either incredibly brave or incredibly arrogant. I'm choosing to believe it's love.

  And to my brother: You have found the one variable that stabilizes the equation. You don't have to "try" to stick with this. You just have to keep doing what you're doing right now: choosing her, today. Because if you value today with her the way you should, the fifty years take care of themselves.

  So, if everyone could please raise a glass.

  To Priya and [Brother's Name]. May your rewards always be immediate, may your discount rates stay low, and may your happiness compound daily.

  To the happy couple!
