answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I've had the privilege of being Priya's friend since undergrad, which means I've had a front-row seat to her intellectual evolution. And for the last decade, that has mostly consisted of watching her gently dismantle anyone at a dinner party who says, "It just wasn't meant to be."

  So, standing here today, I faced a unique rhetorical challenge. In a standard wedding toast, I am contractually obligated to say things like, "They were written in the stars," or "It was always destined to happen." But if I say that to Priya, she won't cry tears of joy; she will cite *De Interpretatione*, Chapter 9. She will remind me that if the proposition "Priya marries Marcus" was *already* true ten years ago, then human agency is an illusion, and their vows today are merely performative theater in a deterministic universe.

  And honestly? She's right.

  Aristotle's sea battle argument isn't just about naval warfare. It's about saving the idea that our choices matter. If the future is already fixed, then love isn't a commitment; it's just a countdown. And Priya and Marcus don't do countdowns. They do work.

  So, I'm not going to tell you that this was inevitable. I'm not going to say the truth-value of this marriage was settled before they even met. Because the beauty of what they have isn't that it *had* to happen. The beauty is that it *didn't* have to happen, and they are choosing it anyway.

  For the logicians in the room: I am explicitly rejecting a fatalist reading of their timeline. We are operating on a branching-time model. There were infinite possible futures where Priya and Marcus never met. In many of those branches, they were happy. But in *this* branch—the actualized history we are celebrating tonight—they found each other. They didn't discover a pre-existing truth; they are *making* it true.

  And for the rest of the family: What that means is that their love isn't luck. It's not magic. It's a verb. Every day, they wake up and look at an open, unwritten future, and they decide to build it together. That is so much more romantic than destiny. Destiny is passive. This? This is active.

  Marcus, you are not just a passenger on this ship. You are the co-captain. And Priya, you don't have to worry about whether there will be a sea battle tomorrow. Because whatever comes, you're facing it from the same deck.

  So, I'd like to propose a toast.

  I will not say, "May your happiness be guaranteed." That implies a necessity that doesn't exist.
  I will not say, "You were always meant to be." That violates the principle of future contingents.

  Instead, I will say this: May you continue to look at the open branches of time ahead of you, and may you always, every single day, choose to walk down this one together. May you be the authors of your own truth, and may the proposition "Priya and Marcus are happy" remain true for a very, very long time.

  To Priya and Marcus.
