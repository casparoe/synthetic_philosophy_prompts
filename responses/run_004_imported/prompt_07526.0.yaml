              *   *Claim 2:* "Knobe's own diagnosis is that this is a case of moral judgment contaminating an otherwise neutral factual judgment... On this reading the asymmetry is a kind of mistake."
              *   *Critique:* **Major Red Flag.** Does Knobe think it's a *mistake*? In the 2003 paper ("Intentional Action and Side Effects in Ordinary Language"), Knobe argues that the folk *concept* of intentional action is itself sensitive to moral considerations. He argues *against* the idea that it's a performance error or contamination. He argues that the moral judgment is *constitutive* of the application of the concept. Later, in "The Folk Concept of Intentional Action" (2006) and other works, he defends the view that moral considerations are part of the competence, not a performance error.
              *   *Nuance:* Some early interpretations (and some critics like Adams/Steinberg) argued it was a bias. But attributing the "contamination/mistake" view *to Knobe himself* is generally considered a misreading of his primary thesis. Knobe's main point is that the Standard View is wrong about the *concept*, not that the folk are misapplying a correct concept. The student says Knobe thinks it's a "mistake... exactly the sort of thing a good theory of intentional action should correct for." This is the opposite of Knobe's actual position (which is usually that the folk concept *is* the data, and theories need to accommodate it, or that the concept is inherently normative).
