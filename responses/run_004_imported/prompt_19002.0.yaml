      *   *Political Values:* Specific values like liberty, equality, order, reproduction, etc., that must be balanced.

  3.  **Address Development 1: *Dobbs* and Religious Abortion Bans:**
      *   *Rawls's Stance (1997):* He argued that a reasonable balance of political values (women's equality, ordered reproduction, respect for life) *cannot* support a flat prohibition in early pregnancy. To do so is unreasonable.
      *   *Post-*Dobbs* Reality:* States are enacting bans from conception, often explicitly citing religious metaphysics (ensoulment).
