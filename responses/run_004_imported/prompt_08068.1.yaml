prompt: |-
  Hey, so I'm working on a novel with a strand set in the last decade of Henri Poincaré's life (he died in 1912), and there's a scene I keep rewriting where he has this long, heated conversation with a former student who's grown skeptical of him, about what science actually gives us access to. I've been rereading bits of Science and Hypothesis and The Value of Science to get the texture of his actual views right — the idea that theories get discarded but the relations between phenomena somehow survive the wreckage, like how the equations from Fresnel's elastic-ether optics carried over almost intact into Maxwell's electromagnetic theory even though the underlying picture of "what's really out there" completely changed. The trouble is I want him to sound like he's wrestling with the strongest version of his own idea, not reciting a textbook summary, which means I basically have to drag him a few decades past his own death.

  Here's my actual question: there's an objection Max Newman raised in the late 1920s against Russell's version of structuralism, that just knowing the "structure" of the world is almost an empty claim, since pretty much any large enough set of objects can be assigned whatever structure you like, so it collapses into merely asserting how many things exist. Then decades later Worrall basically revives Poincaré's idea under the name "structural realism," and after that Ladyman and French push it further into a much stranger "ontic" version where theres no individual objects underneath the structure at all, just relations, all the way down. If you dropped all of that on Poincaré, what do you think he'd actually say? Does the Newman worry land on the specific kind of structuralism he was gesturing at, or does his version dodge it somehow? And would he have recoiled from the "no objects, just relations" move as too metaphysically extravagant for someone so consistently deflationary about metaphysics, or is there something already in his own arguments that points that way? I don't need a full lecture, just enough of a real steelman on each fork that I can put a version of it in his mouth that wouldn't make a philosopher of science reading the book roll their eyes.
