answer: |-
  It is a pleasure to address a colleague who has seen the replication crisis from the bench rather than just the literature. Your experience with candidate-gene association studies is the perfect historical anchor here; those failures were the canary in the coal mine long before psychology admitted it had a problem. You watched effect sizes shrink to zero as sample sizes grew, not necessarily because of malicious fraud, but because the underlying models were too simple for the biological reality.

  That context is vital because it frames the debate between Sana and Owen. They are arguing about the *calculus of uncertainty*, but as you know from the lab, the crisis is often about the *validity of the model*.

  Here is the move-by-move breakdown of their exchange, followed by the "elephant in the room" they seem to be missing.

  ### Round 1: Stopping Rules and the Likelihood Principle
  **Sana's Claim:** The replication crisis is a frequentist disease caused by optional stopping and p-hacking. Bayesian inference, via the Likelihood Principle, renders stopping rules irrelevant; evidence depends only on the data observed.
  **Owen's Counter:** This immunity is theoretical. In practice, researcher degrees of freedom migrate to prior selection, covariate adjustment, and subgroup analysis (Gelman's "Garden of Forking Paths").

  **Adjudication: Owen takes this round.**
  Sana is technically correct about the Likelihood Principle: in a strict Bayesian framework, if you have a fixed model and a fixed prior, the stopping rule does not change the posterior. However, Owen correctly identifies that this is a "spherical cow" argument. In the real world, a Bayesian analyst makes dozens of decisions that a frequentist makes: *Which prior distribution? Hierarchical or fixed effects? Which outliers to exclude?*
  Gelman (whom Owen cites) is the perfect witness here. He is a leading Bayesian who argues vehemently that Bayesian analysis is *more* sensitive to researcher degrees of freedom because the model specification is richer. Sana treats Bayesianism as a shield; Owen correctly identifies it as just another set of dials that can be tuned to produce a desired result.

  ### Round 2: Transparency vs. Incentives
  **Sana's Claim:** Even if flexibility exists, a prior is a stated, public commitment. A p-value hides the "file drawer" and the unreported comparisons.
  **Owen's Counter:** "Checkable in principle" is not "checked in practice." Reviewers lack the expertise to critique priors. Furthermore, preregistration works for both frameworks, implying the root cause is incentive structures (publish or perish), not statistical philosophy.

  **Adjudication: Owen takes this round (decisively).**
  Sana makes a normative argument (science *should* be transparent), while Owen makes a sociological one (science *is* incentivized to obscure). Owen is right that a prior in a paper is often treated as a formality. A reviewer might check if the math sums to one, but they rarely have the subject-matter expertise to say, "Your prior on this effect size is implausibly wide."
  More importantly, Owen's point about preregistration is the empirical kill-shot. Preregistration constrains *both* frequentist and Bayesian analysts. If the intervention that actually works is framework-agnostic, then the framework itself isn't the primary variable causing the disease. Sana argues Bayes reduces the *need* for patches; Owen argues the *incentives* require the patch regardless of the math. History (and your experience with candidate genes) supports Owen: without structural constraints, the math gets subordinated to the result.

  ### Round 3: Thresholds vs. Credences
  **Sana's Claim:** A field thinking in updated credences wouldn't need preregistration as much because there is no magic threshold ($p < 0.05$) to cross.
  **Owen's (Implied) Counter:** (Though not explicitly spoken in your summary, the rebuttal is obvious).

  **Adjudication: Draw / Slight edge to Owen.**
  Sana's closing line is optimistic but psychologically naive. Humans are cognitive misers. We crave binary decisions: *Does the drug work or not? Should we fund this or not?*
  If a field switches to Bayes Factors, within five years you will have journals demanding $BF > 3$ for "positive" evidence and $BF > 10$ for "strong" evidence. We will see "BF-hacking" just as we saw p-hacking. The threshold doesn't disappear; it just moves from 0.05 to 3.0. However, Sana gets a point for identifying that *gradational* evidence is philosophically superior to *binary* hypothesis testing. It's just unlikely to survive contact with the tenure committee.

  ---

  ### The Missing Point: Model Adequacy and the Exploration/Confirmation Conflation

  You mentioned it felt like they were talking past each other. They were. They are arguing about **how to quantify uncertainty within a model**, while the replication crisis is largely about **whether the model corresponds to reality.**

  Here are the two specific things neither of them named:

  **1. The Assumption of Model Truth (The Genetics Lesson)**
  Both Sana and Owen assume that if we calculate the uncertainty correctly, we will get the right answer. But look back at the candidate-gene studies you worked on. Those weren't failures of p-values per se; they were failures of *construct validity*. Researchers were testing single genes for complex polygenic traits. The model was wrong.
  *   **Mayo's Error Statistics (Owen's side):** Focuses on "severe testing." But you can severely test a wrong model. You can have a very low p-value for a gene that has no causal effect, simply because of population stratification or linkage disequilibrium you didn't model.
  *   **Bayesian Updating (Sana's side):** Bayes' theorem updates your belief *given the model*. If the model space doesn't include the true hypothesis (e.g., "this trait is polygenic, not monogenic"), no amount of prior elicitation or likelihood calculation will save you. You will just converge confidently on the wrong answer.
  *   **The Missed Point:** The replication crisis is driven by **model misspecification** and **negligible effect sizes**, not just false positives. A study can be statistically "significant" (by either metric) and still be scientifically false because the effect is too small to be meaningful or the mechanism is nonexistent. Neither Sana nor Owen discussed *power* or *effect size heterogeneity* enough.

  **2. The Conflation of Exploration and Confirmation**
  Sana wants to use Bayes for confirmation (updating credences). Owen wants to use Frequentism (via preregistration) to enforce confirmation.
  The crisis happens when **exploratory analysis is presented as confirmatory analysis.**
  *   In your lab, you likely ran exploratory PCRs to find a candidate, then validated it on a new cohort. The crisis arises when researchers run the exploratory analysis, find a "hit," and publish it as if it were the validation.
  *   **Sana's error:** She thinks Bayes makes the distinction less important because "evidence is evidence." But evidence from a fishing expedition *is* different from evidence from a targeted test, regardless of the Likelihood Principle, because the *probability of the model being selected* is part of the error rate.
  *   **Owen's error:** He leans on preregistration, but preregistration often punishes necessary exploratory data analysis (checking assumptions, cleaning data).
  *   **The Missed Point:** The solution isn't Bayes *or* Frequentism; it is **multistage research designs.** We need to formally separate "Generation" (exploratory, no inference claims) from "Testing" (confirmatory, strict error control). Both statisticians and philosophers often treat a single study as the unit of science, when in reality, *replication* is the unit of science.

  ### Summary
  If I had to score the debate: **Owen won on pragmatics, Sana won on ideals.**
  Owen correctly identified that statistical philosophy cannot fix sociological incentives. Sana correctly identified that binary thresholds distort scientific reasoning.

  But as a geneticist, you know the real lesson: **No statistical framework compensates for a weak theory.** The candidate-gene studies failed because the biology was more complex than the hypothesis. Sana and Owen are arguing about how to measure the length of the table, when the problem is that the table is standing on uneven legs. The "obvious thing" they missed is that the replication crisis is a crisis of **theory construction and measurement validity**, not just a crisis of inference.
