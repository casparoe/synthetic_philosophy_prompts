      *   *Check:* Did I explain S5? Briefly, but focus on the axioms more.
      *   *Check:* Is the Kepler analogy addressed? Yes, Kepler was a conjecture about *mathematical objects* (sphere packing). GOA is about *ontological status*. That's a key difference. Math proofs settle math questions. GOA tries to settle metaphysical questions using math tools.
