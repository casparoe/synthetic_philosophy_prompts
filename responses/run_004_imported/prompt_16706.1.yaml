answer: |-
  Good evening, everyone. Thank you so much for being here.

  As many of you know, I'm approaching a specific kind of milestone next month. The big four-oh. Usually, this is the time when people start telling you to "act your age," or to start thinking about your knees, or to settle down.

  But I've been reading some philosophy lately that suggests exactly the opposite.

  For the past year, a small group of us has been making our way through Plato's *Laws*. Now, if you know Plato, you probably picture him as the stern schoolmaster who wanted to banish the poets and forbid pleasure. And certainly, in the *Republic*, he's quite suspicious of appetite. But in the *Laws*, specifically in the first few books, he surprises you.

  He argues that as men reach my age, we tend to suffer from a certain stiffness. We become gloomy. We become too self-conscious to sing, too shy to dance, too hardened to speak freely. Our souls, he says, become like cold iron.

  And Plato claims the gods gave us wine as a remedy for this. Not as an excuse for chaos, but as a kind of divine fire to soften that iron. He suggests that men of forty should actually be *encouraged* to drink at the common feast—not to lose their minds, but to recover a bit of the boldness and joy they had when they were young. To loosen the character enough to join the chorus again.

  So, for those of you in the reading group who joked that "Plato thinks forty-year-olds should get wasted": well, you're half right. But for the rest of you, please understand: tonight isn't just a party. It is, technically, a philosophical treatment for the gloom of aging. [Pause for laughter]

  However, Plato is still Plato. He is very insistent that no drinking party should take place without a guardian. There must be one sober person left in charge to ensure the wine softens the soul without dissolving it entirely. To keep the feast from sliding into chaos.

  I have taken this regulation very seriously. I have appointed my sister to that role for the evening. [Gesture to sister] She is the sober guardian of this feast. Please respect her authority; she has the backing of the Academy.

  In all seriousness, though, looking around this room, I realize that the real remedy for the stiffness of age isn't just the wine. It's the company. It's the friends who make it safe to be a little softer, a little louder, and a little less guarded.

  So, if you would please raise your glasses.

  To the gods for the vine. To Plato for the permission. To my sister for the supervision. And to all of you, for helping me ensure that as the iron warms, it doesn't break, but bends toward joy.

  Happy birthday to me, and cheers to you all.
