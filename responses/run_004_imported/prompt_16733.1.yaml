answer: |-
  Here is a concrete scenario set in **small-business lending**, designed to be visually clear on a whiteboard. It relies on the **Impossibility Theorem of Fairness** (specifically the tension between *Calibration* and *Error Rate Parity*).

  ### The Setup
  *   **Protagonist:** Dr. Aris Thorne, lead data scientist for "VeriLend."
  *   **Antagonist:** Julian Kross, investigative journalist.
  *   **The Model:** A risk score (0–100) predicting the probability of loan default.
  *   **The Groups:**
      *   **Region A (Historically Distressed):** Higher base rate of default.
      *   **Region B (Historically Stable):** Lower base rate of default.
  *   **The Constraint:** The model is **Perfectly Calibrated**. A score of 70 means a 70% chance of default, regardless of region.

  ---

  ### The Whiteboard Scene
  Aris draws two large rectangles side-by-side. She labels them **Region A** and **Region B**. She writes "100 Applicants" inside each.

  #### Step 1: Establish the Base Rates (The Reality)
  Aris writes the historical default rates at the top of each box.

  *   **Region A:** 50 Defaults, 50 Repays (50% Base Rate).
  *   **Region B:** 20 Defaults, 80 Repays (20% Base Rate).

  **Aris says:** "This isn't the model, Julian. This is the economy. Region A has faced systemic shocks; Region B has not. My model's job is to measure risk, not wish it away."

  #### Step 2: Apply the Calibrated Model (The Honesty)
  Aris draws a horizontal line across both boxes labeled **"Threshold: Score 60"**. Anyone above 60 is denied; anyone below is approved. She explains that to be *calibrated*, a score of 60 must mean the same thing in both regions (a 60% chance of default).

  She fills in the numbers to show how a calibrated model distributes scores:

  **Region A (50% Risk Environment)**
  *   **60 Applicants** get a **High Score (>60)**.
      *   Of these 60, **40 Default** and **20 Repay**. (Risk = 40/60 = **66%**).
  *   **40 Applicants** get a **Low Score (<60)**.
      *   Of these 40, **10 Default** and **30 Repay**. (Risk = 10/40 = **25%**).
  *   *Check:* Total Defaults = 40 + 10 = 50. (Matches Base Rate).

  **Region B (20% Risk Environment)**
  *   **30 Applicants** get a **High Score (>60)**.
      *   To stay calibrated (Score >60 means ~66% risk), **20 Default** and **10 Repay**. (Risk = 20/30 = **66%**).
  *   **70 Applicants** get a **Low Score (<60)**.
      *   **0 Default** and **70 Repay**. (Risk = 0%).
  *   *Check:* Total Defaults = 20 + 0 = 20. (Matches Base Rate).

  #### Step 3: Reveal the Error Rates (The Accusation)
  Aris circles the **Good Applicants who were Denied** (False Positives) in red.

  *   **Region A:** 20 Good Businesses Denied.
      *   **False Positive Rate:** 20 denied / 50 total good = **40%**.
  *   **Region B:** 10 Good Businesses Denied.
      *   **False Positive Rate:** 10 denied / 80 total good = **12.5%**.

  **Kross (The Journalist):** "There it is. You're rejecting good businesses in Region A at more than triple the rate of Region B. That's disparate impact."

  #### Step 4: The Mathematical Impossibility (The Defense)
  Aris picks up a blue marker. "To fix that, you want me to lower Region A's False Positive Rate from 40% to 12.5%. That means I can only deny **6 good businesses** in Region A (12.5% of 50)."

  She erases the "20 Repay" in the Region A High Score box and changes it to "6 Repay."

  **Aris:** "If I only deny 6 good businesses, I must approve the other 14 good businesses that the model flagged as High Risk. But look at the math."

  She points to the **High Risk Bucket** in Region A.
  *   Previously: 40 Defaulters + 20 Good = 60 People. (Default Rate = 66%).
  *   Now: We are approving 14 of the "Good" people who were in this bucket.
  *   This implies the model was *wrong* about them. It said they were 66% risk, but we treated them as safe.

  **Aris:** "If I force the error rates to match, I break **Calibration**. In Region B, a Score of 70 means 66% risk. In Region A, to get those error rates down, I have to treat a Score of 70 as if it means 30% risk. I am no longer building a risk model, Julian. I am building a quota system that lies about probability."

  **Kross:** "So you're saying fairness is mathematically impossible?"

  **Aris:** "I'm saying **three** things are impossible to have at once:
  1.  **Calibration** (The score means the same thing for everyone).
  2.  **Error Rate Parity** (False positives are equal across groups).
  3.  **Different Base Rates** (The groups actually have different risk profiles).

  You have Groups with different Base Rates. I gave you Calibration. That *forces* Error Rates to differ. If you force Error Rates to match, I have to break Calibration. I can tell the truth about risk, or I can tell the story you want to hear. I cannot do both."

  ---

  ### Why This Holds Up (The Technical Backbone)
  This scenario relies on the proof provided by **Chouldechova (2017)** and **Kleinberg et al. (2016)**.

  1.  **Calibration Definition:** $P(\text{Default} | \text{Score}=s, \text{Group}=A) = P(\text{Default} | \text{Score}=s, \text{Group}=B) = s$.
  2.  **Base Rate Difference:** $P(\text{Default} | A) \neq P(\text{Default} | B)$.
  3.  **The Conflict:**
      *   The False Positive Rate (FPR) is determined by how much of the "Non-Default" population falls above the decision threshold.
      *   Because Group A has a higher density of Defaulters, a calibrated model must assign higher scores to a larger portion of Group A to account for that risk.
      *   Consequently, a larger portion of Group A's *Non-Defaulters* will inevitably be swept up into the "High Score" bucket compared to Group B.
      *   **Equation:** If Base Rates differ, and Calibration holds, then $\text{FPR}_A \neq \text{FPR}_B$.

  ### For the Novel's Narrative Arc
  *   **The Tension:** The journalist isn't "wrong" about the disparity (the numbers are real), but he is wrong about the *cause* (he assumes it's a fixable bug; she knows it's a structural constraint).
  *   **The Stakes:** If she "fixes" the model to satisfy the journalist, the bank will suffer higher losses in Region A, potentially leading to a credit freeze for that entire region (a real-world consequence of "fairness" adjustments).
  *   **The Resolution:** Her defense isn't that the disparity doesn't exist, but that the model is the *mirror*, not the *painting*. Blaming the mirror for the reflection doesn't change the face.
