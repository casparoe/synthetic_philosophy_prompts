      *   **Ratifiability:** "Given that I am doing Act A, is Act A still the best choice?" Allows **Probabilistic Dependence** (news value) but checks for stability.
      *   **What Ratifiability Adds:** It screens off "spurious" correlations. It prevents you from acting on the *news* that your action provides about the world, unless that news changes the expected utility calculation in a way that sustains the action. It forces a fixed-point analysis.
      *   **Newcomb vs. Death:**
