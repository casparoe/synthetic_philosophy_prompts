      *   *In Death in Damascus:* If I decide Aleppo, I infer Death is in Aleppo. Expected Utility of Aleppo drops. I prefer Damascus. If I decide Damascus, I infer Death is in Damascus. Expected Utility of Damascus drops. I prefer Aleppo.
      *   *Dominance:* "If Death is in Aleppo, Damascus is better. If Death is in Damascus, Aleppo is better." Since I don't know where Death is, I look for a dominant strategy. There isn't one *unless* I assume my choice doesn't tell me where Death is.
