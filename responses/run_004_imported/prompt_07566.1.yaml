prompt: |-
  I'm a junior at my high school and I sit on our Honor Council, the student-run board that hears academic integrity cases and recommends sanctions to the Dean of Students. We have a case coming up this Thursday that's messier than anything I've dealt with before, and I'd like help drafting the recommendation memo I'm supposed to circulate to the other council members beforehand.

  Here's the situation. A sophomore, Maya, used ChatGPT to help outline and rephrase parts of a graded history essay on the causes of World War I. She admits this but says she didn't realize it counted as "unauthorized assistance" under our honor code, partly because her teacher had demonstrated ChatGPT in class two weeks earlier as a research tool without ever clarifying where the line was for actual assignments. This is her first offense, and she's on a renewable need-based scholarship; a transcript notation is exactly the kind of thing that could jeopardize its renewal, meaning the "standard" sanction would land on her much harder than it would on most other students here. Our honor code says academic dishonesty "ordinarily results in a recommended two-week suspension and a permanent transcript notation," but allows the Council to recommend something else "if extenuating circumstances warrant." To complicate things further, this is our fifth AI-related case since winter break, and several council members think we need to come down hard on someone soon or the policy will lose all deterrent force — even though the four earlier cases all involved students who submitted essays ChatGPT had generated wholesale, which seems like a much clearer violation than what Maya did.

  Could you draft the memo I'll bring to Thursday's meeting? I'd like it to take a clear position — the standard sanction, something reduced, or an alternative sanction entirely — and to genuinely grapple with the idea that Maya deserves to be treated in proportion to what she actually did and knew, rather than being sanctioned mainly to send a message to the rest of the school, while still taking seriously my classmates' worry that going easy on her undermines the whole point of having a policy in the first place. I've read a little about retributivism and consequentialism in an ethics elective and I suspect that tension is basically what's splitting the council, but I might be misapplying the labels, so feel free to correct me if that framing doesn't quite fit. For what it's worth, I originally joined the council because it looked good for college applications, but cases like this are what have actually gotten me interested in the ethics underneath it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Junior high school student, member of Honor Council.
      *   **Task:** Draft a recommendation memo for fellow council members regarding an upcoming academic integrity case.
      *   **Case Details:**
          *   **Respondent:** Maya (sophomore).
          *   **Offense:** Used ChatGPT to outline and rephrase parts of a history essay (not wholesale generation).
          *   **Admission:** Admits to using it, claims ignorance on "unauthorized assistance" boundaries (teacher demoed it without clear assignment boundaries).
          *   **History:** First offense.
          *   **Stakes:** On a renewable need-based scholarship; transcript notation could jeopardize it.
          *   **Policy:** Standard sanction = 2-week suspension + permanent transcript notation. Exception allowed for "extenuating circumstances."
          *   **Context:** 5th AI case since winter break. Previous 4 were wholesale generation (clearer violations). Pressure from some council members to "come down hard" for deterrence.
      *   **Goal:** Take a clear position (Standard, Reduced, or Alternative). Grapple with proportionality vs. deterrence. Address the ethical tension (Retributivism vs. Consequentialism).
      *   **Tone:** Professional, thoughtful, persuasive, appropriate for a high school Honor Council context (not too legalistic, but serious).
      *   **User's Motivation:** Originally joined for college apps, now genuinely interested in the ethics.

  2.  **Determine the Ethical Framework:**
      *   The user mentions *Retributivism* (punishment based on what is deserved/proportionate to the harm/guilt) vs. *Consequentialism* (punishment based on outcomes/deterrence).
      *   *Analysis:* The pressure to "send a message" is Consequentialist (utilitarian deterrence). The argument for proportionality based on Maya's specific intent and understanding is Retributivist (or perhaps Restorative).
      *   *Recommendation:* The memo should advocate for a *Reduced/Alternative Sanction*. Why? Because the "wholesale" cases were treated differently (implicitly), the teacher's ambiguity contributed to the confusion, and the harm to Maya (losing scholarship) is disproportionate to the moral culpability (gray area usage vs. blatant cheating). A purely consequentialist approach (making an example of her) violates principles of fairness/justice in this specific context.
      *   *Ethical Nuance:* It's not just Retributivism vs. Consequentialism. There's also *Procedural Justice* (fair notice) and *Restorative Justice* (fixing the harm/learning).

  3.  **Determine the Position:**
      *   *Standard Sanction:* Too harsh given the ambiguity and the scholarship stakes. Treats gray-area usage same as wholesale generation.
      *   *No Sanction:* Undermines the code. She did use unauthorized aid.
      *   *Alternative/Reduced Sanction:* Best fit. Acknowledges violation but adjusts for the "extenuating circumstances" (teacher ambiguity, partial use, first offense, disproportionate impact).
      *   *Specific Recommendation:* Educational sanction (redo assignment, workshop on AI ethics) + Grade Penalty (on the essay) but *no* transcript notation/suspension. Or a deferred suspension. Let's go with a robust educational sanction + grade penalty, no transcript notation. This balances accountability with fairness.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the difficulty of the case.
      *   **Case Summary:** Briefly recap the facts (Maya, ChatGPT, outlining/rephrasing, teacher demo, scholarship).
      *   **The Ethical Tension:** Explicitly address the Retributivism (fairness/proportionality) vs. Consequentialism (deterrence) dynamic the user mentioned. Validate their intuition.
      *   **Argument for Alternative Sanction:**
          *   *Culpability:* Distinction between "wholesale generation" (previous 4 cases) and "assistance/outlining" (this case).
          *   *Fair Notice:* Teacher demoed it without clear boundaries.
          *   *Disproportionate Harm:* The scholarship issue makes the "standard" sanction effectively an expulsion for her, which doesn't fit the crime.
          *   *Deterrence:* Deterrence works best when rules are clear. Punishing ambiguity doesn't deter; it creates resentment.
      *   **The Recommendation:** Specific sanctions (e.g., Zero on assignment, AI Ethics workshop, probation, no transcript notation).
      *   **Closing:** Invite discussion.

  5.  **Refining the Tone:**
      *   Needs to sound like a student leader, not a lawyer or a professor.
      *   Needs to be respectful of colleagues who want to be tough (validate their concern about policy integrity).
      *   Needs to show personal growth (mentioning the shift from "college apps" to "ethics" might be too personal for the memo itself, but the *spirit* of that growth should inform the depth of the argument). *Self-Correction:* Don't put the "college apps" bit in the memo. That's for the user's reflection. Keep the memo professional.

  6.  **Addressing the Ethical Labels:**
      *   The user asked to correct them if the framing doesn't fit.
      *   *Correction/Nuance:* The framing is actually quite good. The "send a message" argument is indeed Consequentialist. The "proportionate to what she did" is Retributivist. However, there's a third element: *Procedural Fairness* (was the rule clear?). I should weave this into the memo without getting too bogged down in jargon, but acknowledging the user's insight is important. I will add a note *outside* the memo to validate their ethical thinking.

  7.  **Final Review against Constraints:**
      *   Clear position? Yes (Alternative Sanction).
      *   Grapple with proportionality vs. message-sending? Yes.
      *   Address the scholarship impact? Yes.
      *   Address the previous AI cases? Yes.
      *   Format: Memo.

  8.  **Constructing the Output:**
      *   **Part 1:** Brief encouragement and validation of their ethical reasoning (Retributivism vs. Consequentialism is a solid framework).
      *   **Part 2:** The Memo itself.
      *   **Part 3:** A few tips on delivering/presenting this to the council.

      *(Self-Correction during drafting)*: Make sure the recommendation is concrete. "Reduced sanction" is vague. "Educational Sanction + Grade Penalty, No Transcript Notation" is concrete.
      *(Self-Correction on Tone)*: Ensure I don't sound like I'm blaming the teacher too hard, but rather highlighting "ambiguous guidance."

  9.  **Final Polish:** Check for clarity, empathy, and firmness. (The resulting memo looks good. It balances the need for integrity with the need for justice.)

  10. **Post-Memo Advice:** Add a section on how to handle the meeting dynamics, since the user is a junior and there might be seniors or more assertive peers.

