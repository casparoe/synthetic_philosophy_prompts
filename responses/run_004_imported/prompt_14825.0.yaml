      *   **Section 1: Distinct Questions (Substance vs. Form/Function).** Contrast the "Truisms of Nature" with the "Desiderata of Craftsmanship."
      *   **Section 2: The Status of the Connection (Prudence vs. Morality).** Address the "Concession" question. Explain why Hart thinks it's consistent with positivism (contingent vs. necessary).
      *   **Section 3: The Divergence Test (Thought Experiments).** Construct the scenarios where they come apart. This is crucial for the seminar discussion.
