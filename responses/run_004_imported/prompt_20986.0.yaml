      *   **Characters:**
          *   *Philosopher A (Realist/Natural Kind):* Defends autism as a genuine natural kind discovered by diagnosis.
          *   *Philosopher B (Hackingian/Interactive Kind):* Argues autism is an interactive kind where looping effects shape the reality.
      *   **Requirements:**
          *   Engage directly with specific evidence (Heritability/Neurodevelopment vs. DSM-5 changes/Adult self-diagnosis/Double Empathy).
