  2.  **Character Conception:**
      *   *Elena (Realist):* Needs to ground her argument in biology, genetics, and stability. She likely draws on the work of Simon Baron-Cohen (cautiously), geneticists, and the "medical model" tradition but refined philosophically (e.g., Richard Boyd's homeostatic property clusters).
      *   *Marcus (Interactionist):* Needs to channel Ian Hacking. Focus on classification, self-conception, and social feedback loops. He should bring in the social model of disability and the fluidity of diagnostic boundaries.

  3.  **Key Concepts to Weave In:**
      *   *Natural Kind:* Mind-independent, stable, causal powers.
      *   *Interactive Kind:* Classification changes the classified, feedback loops.
      *   *Heritability/Neurobiology:* Twin studies, brain connectivity (Realist ammo).
      *   *DSM-5 Changes:* Collapse of subtypes, broadening criteria (Interactionist ammo).
      *   *Adult Diagnosis/Self-ID:* The "late-diagnosed" phenomenon (Interactionist ammo).
      *   *Double Empathy Problem:* Damian Milton's work (Interactionist ammo - challenges the deficit model).
      *   *Looping Effects:* How knowing the label changes behavior (masking, unmasking).

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. A quiet office or a conference break. Establish the stakes (the user's specific dilemma).
