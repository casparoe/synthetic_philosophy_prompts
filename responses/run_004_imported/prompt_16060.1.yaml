answer: |-
  This is one of the most enduring and difficult problems in the history of ideas. You and your friend have essentially reenacted a debate that has taken place in philosophy departments since Frege's diary was published in the 1980s (most notably by the scholar Gottfried Gabriel). Michael Dummett, whom you mentioned, was indeed deeply shaken by the revelation; he wrote that reading the diary made him feel "physically sick," yet he maintained that Frege's logical contributions remained intact.

  Your struggle to articulate why the diary shouldn't invalidate the philosophy is understandable because it requires navigating between two pitfalls: the **Genetic Fallacy** (judging an idea solely by its origin) and **Naive Objectivism** (believing ideas exist in a vacuum completely untouched by the thinker's psyche).

  Here is an analysis of the most important implications of this case for how we weigh character against work, structured by the philosophical principles at stake.

  ### 1. The Distinction Between Context of Discovery and Context of Justification
  The strongest argument for your position relies on a distinction made by philosopher Hans Reichenbach.
  *   **Context of Discovery:** How did the thinker come up with the idea? (Psychology, biography, historical pressure, prejudice).
  *   **Context of Justification:** How is the idea validated? (Logic, evidence, argumentation).

  Frege's work in logic (the *Begriffsschrift*) and semantics ("On Sense and Reference") belongs to the context of justification. A logical proof is valid or invalid based on its internal structure, not the moral character of the prover. If Frege proved that $2+2=4$ or established the rules of quantification, those truths hold regardless of whether he was a saint or a bigot. To argue otherwise is to commit an *ad hominem* fallacy.

  **Implication:** When the work is formal (logic, math, hard science), personal character carries almost **no weight** regarding the *truth* of the propositions. Your friend's call for "suspicion" is misplaced if it implies the logic itself is corrupted.

  ### 2. The Permeability of "Pure" Argument
  However, your friend is not entirely wrong to be uneasy. While formal logic is hermetically sealed, philosophy of language and metaphysics are not always as pure as they claim. Prejudice can hide inside "neutral" categories.

  For example, if a philosopher defines "rational agency" in a way that implicitly excludes certain groups of people, their prejudice has infected their "pure" argument. In Frege's case, scholars have scrutinized his work to see if his antisemitism seeped into his logic. The consensus is largely that it did not; his logic does not rely on ethnic or political premises. However, the *implication* here is vital: **We must audit "neutral" work for hidden normative assumptions.**

  **Implication:** Personal convictions matter when the work claims to be about **human nature, ethics, or society.** Even in "pure" philosophy, we should check if the definitions used (e.g., "reason," "civilization," "the subject") are coded with the author's biases. In Frege's case, the audit came back clean, but the *process* of auditing is necessary.

  ### 3. The Demystification of the "View from Nowhere"
  The deeper implication of the Frege case concerns the *style* of analytic philosophy. Frege, and those who followed him (like Russell and early Wittgenstein), cultivated a style that erased the author. It presents arguments as if they were viewed from nowhere, by no one, purely by the light of reason.

  Dummett's admiration for Frege was partly based on this myth of the "dispassionate thinker." The diary shatters that myth. It reveals that the "view from nowhere" was actually a view from a specific, flawed, prejudiced somewhere.

  **Implication:** We should stop treating the impersonal style as a guarantee of moral or political innocence. A text can be logically rigorous and yet be written by someone with a corrupted moral compass. This doesn't make the logic wrong, but it warns us against **idolatry**. We should read Frege not as a High Priest of Reason, but as a brilliant, flawed human being. This lowers the *authority* of the thinker without lowering the *validity* of the work.

  ### 4. Compartmentalization and the Scholem Paradox
  You mentioned Frege's warm relations with Jewish students like Gershom Scholem. This highlights the phenomenon of compartmentalization. Frege could separate his abstract theoretical mind from his concrete interpersonal relationships (and his political rantings).

  This suggests that human cognition is not a unified field. A person can hold contradictory modes of thinking simultaneously.

  **Implication:** We must accept that **intellectual brilliance and moral blindness can coexist without canceling each other out.** Assuming that a great mind must be a good mind (or vice versa) is a cognitive bias we must unlearn. The implication for reading is that we can honor Frege's contribution to logic while condemning his politics, without feeling that we are being inconsistent.

  ### 5. Practical Hermeneutics: How to Read Now?
  So, how do you answer your friend? You can concede that the diary matters, but argue it matters for *how* we read, not *whether* we read.

  *   **Don't Dismiss:** Do not reject the logic. That is the Genetic Fallacy.
  *   **Do Contextualize:** Teach Frege with the biography included. The "pure reason" narrative is historically false.
  *   **Stay Vigilant:** Use the knowledge of his prejudice as a heuristic tool. When Frege makes a claim about "the people" or "culture," look closely. When he does formal logic, breathe easy.

  ### Summary for Your Argument
  If you speak to your friend again, you might frame it this way:

  > "The diary changes our understanding of the **philosopher**, but not necessarily the **philosophy**. Logic is autonomous; a valid argument remains valid even if the author is vile. However, you are right to reject the myth that Frege was a disembodied rational machine. The implication isn't that we should suspect his logic is false, but that we should stop expecting philosophy to purify the philosopher. We can accept his tools for thinking without accepting his worldview. The work stands on its own merits, but the pedestal it stood on is broken."

  The ultimate lesson of the Frege case is that **truth is not a moral reward.** It is possible to discover objective truths while being subjectively morally bankrupt. Recognizing this is uncomfortable, but it is necessary for a mature engagement with the history of ideas.
