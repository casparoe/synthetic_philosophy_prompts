  2.  **Deconstruct the Core Philosophical/Medical Debate:**
      *   This is the classic "Harmful Dysfunction" analysis (Wakefield) vs. "Social Construct/Normative" analysis.
      *   It touches on the definition of mental disorder in the DSM-5-TR and ICD-11.
      *   It involves the distinction between *sadness/grief* (normal) and *depression/PGD* (pathological).
