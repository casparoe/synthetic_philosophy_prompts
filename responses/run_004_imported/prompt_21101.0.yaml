  5.  **Address the "Fact of the Matter" vs. "Value Judgment" Question:**
      *   Is "disorder" objective? Jerome Wakefield's "Harmful Dysfunction" analysis is the gold standard here.
      *   *Dysfunction:* Failure of a mental mechanism to perform its evolved function (Factual/Scientific).
      *   *Harm:* The condition causes negative consequences as judged by social values (Value-laden).
      *   *Conclusion:* It's a hybrid. There *is* a factual component (is the mechanism working?), but the threshold for "harm" and "function" involves values.
      *   *PGD Specifics:* The DSM-5-TR and ICD-11 criteria specifically distinguish PGD from normal grief by focusing on *persistent yearning/preoccupation* that exceeds social norms and causes *impairment*. It's not just "sadness."

