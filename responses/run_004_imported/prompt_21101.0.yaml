      *   *Weaknesses:* Ignores functional impairment. Risks leaving treatable suffering untreated. Assumes there is a "natural" trajectory of grief that everyone should follow. Can be stigmatizing in its own way (implying she *should* be over it by now if she were "healthy," or conversely, that seeking help is weak).
      *   *Philosophical Grounding:* Grief is a testament to love. To call it a disorder is to say the love was a mistake or the mind is broken for remembering.

  4.  **Evaluate the User's Position (The "Harmful Dysfunction" Argument):**
