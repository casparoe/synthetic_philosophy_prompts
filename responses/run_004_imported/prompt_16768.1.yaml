answer: |-
  This is an excellent question, and it cuts to the heart of the interdisciplinary friction between philosophy and psychology in the early 2000s. As a psychologist, you are rightly operating with a more current understanding of the data (particularly regarding the replicability and interpretation of Zimbardo and Milgram) than the syllabus you audited may have presented.

  The short answer is: **Virtue ethics was not abandoned because the situationist critique was found to rely on a category error regarding the nature of virtue, an outdated model of personality psychology, and a conflation of normative ideals with descriptive averages.**

  Contemporary virtue ethicists did not simply refuse to update; many updated their psychological commitments while arguing that the situationists misunderstood the philosophical commitments of Aristotelian ethics. Here is a breakdown of the four primary lines of response you will encounter in the current literature, which should help you cite the debate accurately in your dissertation.

  ### 1. The "Ideal vs. Average" Distinction (The Normative Defense)
  The most common philosophical pushback is that situationists attack a straw man regarding what virtue ethics claims about *actual* human behavior.

  *   **The Argument:** Aristotelian virtue ethics is primarily a **normative** theory, not a descriptive psychological one. It describes the *phronimos* (the person of practical wisdom) or the fully virtuous agent. Aristotle explicitly acknowledges that such people are rare ("like a god among men").
  *   **The Response:** Showing that the *average* person obeys authority in Milgram's experiment no more disproves virtue ethics than showing that the average person cannot solve a calculus problem disproves mathematical norms. The theory posits an ideal of character that is achievable through long-term habituation and education, not a description of the default settings of undergraduate psychology pools.
  *   **Key Citation:** **Julia Annas**, *Intelligent Virtue* (2011). Annas argues that virtues are skills (like playing the piano). The fact that most people play poorly does not mean the concept of "skill" is empirically vacuous; it means most people haven't put in the practice.
  *   **Relevance to you:** This allows virtue ethicists to accept the situationist data (most people lack robust virtue) without accepting the conclusion (virtue is impossible).

  ### 2. The Psychological Critique (The Empirical Defense)
  Many philosophically trained ethicists have collaborated with psychologists to argue that the situationist reading of the data is empirically outdated. You likely know this better than the philosophers, but it is worth noting that philosophers like **Christian Miller** have leaned heavily into the personality psychology literature to defend virtue.

  *   **The Argument:** The situationist critique relies on a "global trait" model (behavior must be consistent across *all* situations) that few personality psychologists actually held even in the 1990s.
  *   **The Response:** Modern personality psychology (e.g., **William Fleeson's** density distribution model) supports an interactionist view. Traits are real and predictive, but they manifest as distributions of behavior across time, not rigid consistency in every single instance. Furthermore, the "Fundamental Attribution Error" itself is currently under significant revision in social psychology; recent work suggests people are often quite sensitive to situational constraints.
  *   **The Zimbardo/Milgram Issue:** Serious contemporary virtue ethicists rarely cite the Stanford Prison Experiment anymore, acknowledging its methodological collapse. Regarding Milgram, they point to the variance: in some variations, obedience dropped to 10%. If situationism were true, variance should be near zero. The existence of "resisters" suggests individual differences (traits) *do* play a causal role.
  *   **Key Citation:** **Christian B. Miller**, *Character and Moral Psychology* (2014). Miller argues for "mixed traits" that acknowledge situational sensitivity without abandoning the reality of character.
  *   **Relevance to you:** Citing Miller or **Nancy Snow** (*Prospection, Well-Being, and Memory*, 2022) shows you recognize that the philosophical side has engaged with the *actual* state of personality psych, not just the 1970s version.

  ### 3. The Conceptual Defense (Phronesis and Context)
  This is perhaps the most sophisticated philosophical rebuttal. It argues that the situationists misunderstand what Aristotelian virtue *is*.

  *   **The Argument:** Situationists assume virtues are blind, automatic dispositions (e.g., "honesty" means telling the truth in *every* context).
  *   **The Response:** Aristotelian virtue includes *phronesis* (practical wisdom). A virtuous agent is not someone who acts the same way in every situation, but someone who perceives the morally relevant features of a *specific* situation and acts accordingly. If a situation is engineered to be deceptive (like Milgram's cover story), the virtuous agent's response is complicated by the epistemic constraints of that situation.
  *   **The "Fragmentation" Concession:** Some virtue ethicists (like **John Doris** himself, eventually, and **Gopal Sreenivasan**) have moved toward a view of "fragmented" or "local" virtues. They concede that global traits might be rare, but argue that local traits (e.g., "honesty-among-friends" rather than "honesty-universally") are sufficient for a revised, empirically grounded virtue ethics.
  *   **Key Citation:** **Rekha Nath**, "Virtue Ethics and the Situationist Challenge" (various papers), or **Sreenivasan**, "A Hybrid Virtue Epistemology" (2002).
  *   **Relevance to you:** This shows that virtue ethics is not monolithic; it has evolved to incorporate "local traits" rather than dying on the hill of "global traits."

  ### 4. Minimal Psychological Realism
  Finally, there is a meta-ethical constraint proposed by **Owen Flanagan**.

  *   **The Argument:** Any normative theory must satisfy "minimal psychological realism"—it must prescribe a character that is possible for creatures like us.
  *   **The Response:** Virtue ethicists argue the situationist critique sets the bar impossibly high (perfect cross-situational consistency). If the requirement is lowered to "statistically significant stability in behavior relative to trait attribution," virtue ethics passes the test. The theory does not require saints; it requires agents who are better than they would be without habituation.
  *   **Key Citation:** **Owen Flanagan**, *Varieties of Moral Personality* (1991).

  ### Why wasn't it abandoned?
  To answer your specific curiosity: Virtue ethics wasn't abandoned because the situationist critique was ultimately viewed as a **success in refinement, not a falsification.**

  1.  **It cleaned house:** It forced philosophers to stop treating "virtue" as a mystical aura and start treating it as a psychological natural kind.
  2.  **The data wasn't fatal:** The data showed that *uncultivated* character is situationally fragile. Virtue ethicists argue this proves the need for moral education (the core of VE), not the absence of character.
  3.  **Interactionism Won:** The "Person vs. Situation" debate in psychology largely ended in a tie (Interactionism). Since virtue ethics is compatible with interactionism (traits interact with contexts via *phronesis*), the foundation remained intact.

  ### Recommendation for your Dissertation
  If you cite this debate, avoid framing it as "Psychology proved Philosophy wrong." Instead, frame it as:

  > "The situationist critique (Harman, 1999; Doris, 2002) challenged virtue ethics to align with empirical data regarding cross-situational consistency. While initially framed as a falsification of trait theory, contemporary responses (Annas, 2011; Miller, 2014) have reframed virtue as a developmental ideal compatible with interactionist personality models, shifting the debate from the existence of traits to the conditions of their cultivation."

  This acknowledges the force of the critique without presenting the philosophical side as anti-science or defeated. It accurately reflects the current state of the literature, where the two fields are once again converging (see the work of the **Character Project** at Wake Forest/Notre Dame).

  **One final note of caution:** Given your field, be careful leaning too heavily on Zimbardo in your own writing. The Stanford Prison Experiment is currently viewed in psychology as largely fraudulent or at least methodologically indefensible. If you use it as a premise for the situationist critique, a sharp reviewer might ding you for relying on debunked data, even if the philosophers you are citing used it. Milgram and the Darley & Batson Good Samaritan study are much safer empirical ground.
