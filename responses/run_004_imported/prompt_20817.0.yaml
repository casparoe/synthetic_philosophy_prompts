prompt: |-
  I teach ethics for a living and I still couldn't referee this one, so I need an outside read. My cousin Dave promised his dying dad he'd keep the family hardware store open 'no matter what.' Its ten years later, the store looses money every year, and Dave's daughter needs that money for college. At Thanksgiving my aunt Carol said Dave's off the hook: a promise is owed to a person, that person is gone, and you can't wrong someone who no longer exists. My uncle Ray said that can't be right -- it would mean you could break a promise to a friend the second he's out of earshot forever, or to someone in a permanent coma who'll never know either way, and those feel like the cases where breaking it is worst, not most excusable. Carol said a coma patient still has a future the broken promise could damage; a dead man has no future and no interests left anywhere, so it's not the same. Ray said we don't keep deathbed promises because we think the dead are watching -- we'd keep one even knowing for certain we'd never be caught -- so whatever grounds the obligation, it isn't just 'someone might find out and be hurt.' Carol said fine, but then it can't be unconditional either: if keeping the promise meant Dave's daughter went without health insurance, even Ray would say break it, so it obviously can be outweighed. Ray agreed, but said losing some money every year isn't remotely the same magnitude as a kid losing health insurance, so admitting there's a limit doesn't mean the promise carries zero weight here. Carol's last line was: outweighed by what, exactly? With nothing real left on dad's side of the scale, 'outweighed' just means Dave's preferences win, which was her point from the start. Then we had to go carve the turkey. Can you go through this move by move, say who's got the better argument at each stage rather than just declaring an overall winner, and flag anything important both of them are missing?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **User:** Ethics teacher.
      *   **Task:** Analyze a specific ethical debate between two family members (Aunt Carol vs. Uncle Ray) regarding a promise made by a cousin (Dave) to his dying father.
      *   **Constraint:** Do *not* declare an overall winner. Analyze move-by-move. Flag important points *both* are missing.
      *   **Scenario:** Dave promised dying dad to keep hardware store open "no matter what." 10 years later, store loses money. Dave's daughter needs money for college.
      *   **Debate:**
          *   Carol: Dead people have no interests/rights, so the promise is void.
          *   Ray: Breaking promises to the dead/comatose feels wrong even if they don't know. It's not about being caught.
          *   Carol: Coma patients have futures; dead don't. Also, promises aren't unconditional (e.g., health insurance trumps promise).
          *   Ray: Financial loss $\neq$ health insurance. Promise still has weight.
          *   Carol: If dad has no interests, "outweighing" just means Dave's preferences win.
      *   **Goal:** Evaluate the strength of arguments at each stage and identify blind spots.

  2.  **Deconstruct the Arguments (Move-by-Move):**

      *   **Move 1: Carol's Opening Salvo (The "No Subject" Argument).**
          *   *Claim:* Promises are owed *to* a person. Person is gone. Can't wrong non-existents.
          *   *Strengths:* Aligns with certain metaphysical views (Epicurean: death is nothing to us). Clear, intuitive legalistic view (contracts end at death).
          *   *Weaknesses:* Ignores the *living* practice of promising. Ignores the promisor's integrity.
          *   *Verdict:* Strong metaphysical consistency, weak moral phenomenology.

      *   **Move 2: Ray's Counter (The "Integrity/Coma" Analogy).**
          *   *Claim:* Breaking promises to coma patients/dead feels wrong even if undiscoverable. It's not about harm to the promisee.
          *   *Strengths:* Captures the deontological intuition (duty for duty's sake). Distinguishes between "harm" and "wrong." The coma analogy is strong because it isolates "knowledge of breach" from "moral status."
          *   *Weaknesses:* Doesn't explain *why* it feels wrong if no one is harmed. Risks fetishizing the promise.
          *   *Verdict:* Stronger moral intuition pump. Exposes the limitation of Carol's "harm principle."

      *   **Move 3: Carol's Distinction (Coma vs. Death).**
          *   *Claim:* Coma patients have a future/interests; dead don't.
          *   *Strengths:* Logically sound distinction between biological life/death. Maintains the "interests" framework.
          *   *Weaknesses:* Concedes the principle that promises bind based on *future interests* rather than *past agreement*. If the binding force is the *act of promising*, the distinction matters less.
          *   *Verdict:* Technically correct on biology, but misses the point of Ray's moral intuition (which was about the *act*, not the *consequence*).

      *   **Move 4: Ray's Motivation Check (The "Watching" Argument).**
          *   *Claim:* We don't keep promises because the dead are watching. We keep them even if certain we won't be caught. Obligation isn't just about detection/hurt.
          *   *Strengths:* Hits the core of deontology vs. consequentialism. Shifts focus from the promisee's welfare to the promisor's character/duty.
          *   *Weaknesses:* Still doesn't define the *source* of the obligation if not the promisee's interests.
          *   *Verdict:* Very strong. Forces Carol to abandon the "fear of consequences" model.

      *   **Move 5: Carol's Concession & Trap (The "Threshold" Argument).**
          *   *Claim:* Okay, promises aren't unconditional. If daughter needed health insurance, break the promise.
          *   *Strengths:* Pragmatic. Acknowledges moral pluralism (promises aren't the only value). Sets up a reductio ad absurdum for Ray.
          *   *Weaknesses:* Shifts the goalposts from "Is there an obligation?" to "How heavy is the obligation?"
          *   *Verdict:* Strategic masterstroke. Forces Ray to quantify the unquantifiable.

      *   **Move 6: Ray's Distinction (Magnitude).**
          *   *Claim:* Losing money $\neq$ losing health insurance. Promise still has weight.
          *   *Strengths:* Defends the nuance. Avoids the absolute trap. Acknowledges competing duties.
          *   *Weaknesses:* Vague. How much weight? Why does money for college count less than health insurance? (Actually, college is pretty important).
          *   *Verdict:* Reasonable, but lacks a principled metric for weighing.

      *   **Move 7: Carol's Checkmate (The "Empty Scale" Argument).**
          *   *Claim:* If dad has no interests, the other side of the scale is empty. "Outweighing" just means Dave's preferences win.
          *   *Strengths:* Logically devastating if you accept her premise (Move 1). If the dead have *zero* moral weight, any competing interest trumps them.
          *   *Weaknesses:* Begs the question. Assumes the only thing on the scale is the dad's *current* interests. Ignores the weight of the *past act*, *social practice*, or *Dave's integrity*.
          *   *Verdict:* Logically valid within her framework, but the framework is the contested point.

  3.  **Identify Missing Elements (The "Blind Spots"):**
      *   **The Social Practice of Promising:** Promises aren't just dyadic (A to B); they sustain a social institution. Breaking deathbed promises undermines trust in the institution.
      *   **The Promisor's Integrity:** It's not just about the dad; it's about who Dave *is*. Keeping the promise shapes Dave's character.
      *   **The Nature of the "No Matter What" Clause:** Was the promise coerced by the context of death? Was it rational?
      *   **The Daughter's Stake:** She isn't just "Dave's preference." She has a claim on her father's resources.
      *   **The Store's Community Role:** Hardware stores often serve a community function beyond profit.
      *   **Grief and Memory:** Keeping the promise might be a ritual of mourning/respect, independent of the dad's "interests."

  4.  **Drafting the Response:**
      *   *Tone:* Professional, analytical, respectful of the user's expertise (they teach ethics).
      *   *Structure:*
          1.  Introduction (Acknowledge the complexity).
          2.  Round-by-Round Analysis (Carol 1, Ray 1, Carol 2, etc.).
          3.  The "Missing Middle" (What both missed).
          4.  Conclusion (Summary of the philosophical stalemate).
      *   *Refinement:* Ensure I don't solve the case. The user asked for an analysis of the *arguments*, not a verdict on Dave. Make sure to highlight *why* Carol's final move is logically tight but philosophically contestable.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I declare a winner? *No.*
      *   *Check:* Did I analyze move-by-move? *Yes.*
      *   *Check:* Did I flag missing points? *Yes.*
      *   *Nuance:* Make sure to distinguish between "interests" and "wishes." Carol conflates them. Ray hints at "duty" but doesn't name it.
      *   *Specific focus:* Carol's final move is the trickiest. It relies on a utilitarian calculus where the dead count as zero. Ray needs a non-utilitarian counter (deontology/virtue ethics). I should point out that Ray is arguing Virtue/Deontology while Carol is arguing Consequentialism/Interest Theory, and they are talking past each other.

  6.  **Final Polish:** Ensure clear headings and bullet points for readability. (Proceed to generate output based on this thought process).
answer: |-
  This is a classic stalemate between **Interest Theory** (Carol) and **Will/Deontological Theory** (Ray), wrapped in a family drama. Since you teach ethics, I'll skip the intro 101 and dive straight into the dialectic structure.

  Here is the move-by-move breakdown, evaluating the philosophical leverage at each step, followed by the significant blind spots both parties share.

  ### Round 1: The Ontology of the Promisee
  **Carol's Move:** *The "No Subject" Argument.*
  *   **Claim:** A promise is a duty owed *to* a person. No person = no duty. You cannot wrong a non-existent entity.
  *   **Assessment:** **Strong metaphysical consistency, weak moral phenomenology.**
      *   Carol is relying on the **Interest Theory of Rights**: X has a right only if X has an interest that can be harmed. Since the dead have no interests, they have no rights, and no one can violate them. This is logically clean (Epicurean symmetry).
      *   **Weakness:** It contradicts the lived experience of mourning and obligation. Most moral agents feel a residual duty to the dead (wills, last words, burial rites). If her theory holds, executing a will is morally optional the second the testator dies, provided the heirs aren't harmed.

  **Ray's Counter:** *The "Coma/Integrity" Analogy.*
  *   **Claim:** We keep promises to coma patients (or the dead) even if discovery is impossible. Therefore, the obligation isn't grounded in the promisee's ability to be hurt or find out.
  *   **Assessment:** **Stronger intuitive pull.**
      *   Ray successfully isolates the variable of *consequences*. By using the coma patient, he shows that we feel bound even when the "harm to promisee" is nullified.
      *   **Strength:** He shifts the ground from "harm to the other" to "fidelity of the self." He is implicitly arguing for a **Deontological** or **Virtue Ethics** grounding: the wrongness lies in the breaking, not the damage.
      *   **Winner of Round 1:** **Ray.** He exposes that Carol's model cannot account for why we feel bound in cases where the promisee is incapacitated but alive.

  ### Round 2: The Distinction of Status
  **Carol's Move:** *The "Future Interests" Distinction.*
  *   **Claim:** Coma patients have a future self that can be harmed upon waking; the dead have no future.
  *   **Assessment:** **Technically correct, morally evasive.**
      *   Carol concedes that *potential* future interests bind us. She argues the dead lack even potential interests.
      *   **Weakness:** This begs the question against Ray. Ray's point was that the *source* of the obligation is the *past act of promising*, not the *future welfare of the promisee*. By focusing on the promisee's status, she ignores the promisor's commitment.
      *   **Winner of Round 2:** **Draw.** Carol wins on biology/metaphysics; Ray wins on moral sourcing. They are talking past each other.

  ### Round 3: The Motivation Check
  **Ray's Move:** *The "Watching" Argument.*
  *   **Claim:** We don't keep deathbed promises because we fear supernatural surveillance. We keep them even if we know we won't be caught. Therefore, the obligation is internal, not external.
  *   **Assessment:** **Very Strong.**
      *   This is a devastating critique of Carol's implicit social contract model. If the only reason to keep the promise is to avoid social sanction or hurting the dad, and both are impossible, Carol's model says "break it." Ray correctly identifies that our moral intuition says "keep it."
      *   **Winner of Round 3:** **Ray.** He forces Carol to abandon the idea that the obligation is contingent on the dad's awareness or reaction.

  ### Round 4: The Threshold Concession
  **Carol's Move:** *The "Outweighing" Trap.*
  *   **Claim:** Fine, promises aren't absolute. If the daughter needed health insurance, you'd break the promise. Therefore, the promise can be outweighed.
  *   **Assessment:** **Strategic Masterstroke.**
      *   Carol shifts from "Is there an obligation?" to "How heavy is the obligation?" She forces Ray to admit that the promise is not a trump card. This is necessary for any plausible ethical system (promises to murder someone, for example, should be broken).
      *   **Winner of Round 4:** **Carol.** She successfully moves the debate to a calculus of weights, which favors her "Interest Theory" because she controls the scale.

  ### Round 5: The Magnitude Defense
  **Ray's Move:** *The "Magnitude" Distinction.*
  *   **Claim:** Financial loss (store) $\neq$ Health/Safety (insurance). The promise still has weight, just not infinite weight.
  *   **Assessment:** **Reasonable but Vague.**
      *   Ray defends nuance. He is arguing for a *prima facie* duty (Rossian ethics). The duty exists but can be overridden by a stronger duty.
      *   **Weakness:** He doesn't provide a metric for *why* college funding is less weighty than health insurance, or why it isn't weighty enough to override the store loss. He relies on intuition ("remotely the same magnitude").
      *   **Winner of Round 5:** **Ray (on principle), Carol (on precision).** Ray is right that duties have weights; Carol is right that he hasn't defined the weights.

  ### Round 6: The Empty Scale (Checkmate?)
  **Carol's Move:** *The "Zero Weight" Argument.*
  *   **Claim:** If the dad has no interests, his side of the scale is empty. Therefore, "outweighing" just means Dave's preferences win. If Dave prefers to close the store, he wins.
  *   **Assessment:** **Logically Valid within her Framework, but Question-Begging.**
      *   This is Carol's strongest logical move. If the moral weight of the promise derives *solely* from the dad's current interests, then yes, the weight is zero. Any non-zero interest of the living (Dave or daughter) trumps zero.
      *   **Weakness:** It assumes the *only* thing on the dad's side of the scale is his *current welfare*. It ignores the weight of the *past relationship*, the *sanctity of the speech act*, and the *social institution of promising*.
      *   **Winner of Round 6:** **Carol (Logically), Ray (Morally).** Carol wins the syllogism; Ray wins the moral landscape.

  ---

  ### The Blind Spots (What Both Missed)

  Since you asked for what they are missing, here are the three ethical elephants in the room that neither Carol nor Ray addressed.

  **1. The Integrity of the Promisor (Virtue Ethics)**
  Both Carol and Ray treat the promise as a transaction between Dave and Dad. They miss the impact on *Dave*.
  *   **The Missing Argument:** Keeping a deathbed promise is often less about the dead person's rights and more about the living person's integrity. If Dave breaks the promise, he becomes the *kind of person* who breaks deathbed promises. This corrodes his own character and his self-narrative.
  *   **Why it matters:** Even if Dad has "zero weight," Dave's integrity has significant weight. Carol's "Empty Scale" is wrong because Dave's integrity goes on the *same side* as the Dad's wish. It's not Dave's Preference vs. Dad's Interest; it's Dave's Short-term Preference vs. Dave's Long-term Integrity + Dad's Wish.

  **2. The Social Practice of Promising (Rule Utilitarianism)**
  Neither considers the macro-effect.
  *   **The Missing Argument:** Promises work because we treat them as binding even when inconvenient. If the cultural norm becomes "Deathbed promises are void because the beneficiary is dead," the utility of deathbed promises collapses. Dying people will be anxious, families will fight over "what he really wanted," and the peace that the promise was meant to secure is lost.
  *   **Why it matters:** Dave isn't just deciding for himself; he is upholding (or eroding) a social institution that allows people to die in peace.

  **3. The Coercion of the Deathbed**
  Neither questions the validity of the promise itself.
  *   **The Missing Argument:** A promise extracted from a dying son by a dying father ("No matter what") is ethically suspect. It leverages emotional vulnerability.
  *   **Why it matters:** If the promise was coerced by the context of grief, its moral weight is significantly reduced from the start. Ray assumes the promise is pure; Carol assumes it's void. Neither asks if it was *validly formed*.

  ### Summary for the Referee
  *   **Carol** wins on **Metaphysics and Logic**. If you accept that moral weight requires a living subject with interests, her conclusion is inescapable. Her "Empty Scale" argument is the hardest to refute without abandoning Interest Theory.
  *   **Ray** wins on **Moral Phenomenology**. He accurately describes how moral agents actually feel and behave. He correctly identifies that the obligation survives the death of the subject, but he fails to articulate *where* that obligation resides if not in the subject.
  *   **The Stalemate:** Carol is arguing Consequentialism/Interest Theory; Ray is arguing Deontology/Virtue Ethics. They cannot resolve this without agreeing on the *source* of moral value.

  **The Tie-Breaker (For your own consideration):**
  The debate hinges on Carol's final claim: *"With nothing real left on dad's side of the scale."*
  Ray loses if he accepts that premise. He wins only if he can argue that **the promise itself is an object with moral weight**, independent of the dad's current existence. If the promise is a "moral object" created in the past that persists into the present, the scale isn't empty. Carol denies moral objects can exist without living owners; Ray asserts they can. That is the fundamental ontological disagreement.
