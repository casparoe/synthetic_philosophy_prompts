          *   *Mechanism:* We participate in a game of make-believe. We imagine feeling fear/sadness, but without the full cognitive belief required for "real" emotion (e.g., no urge to call the police if a character is murdered).
          *   *Application to User:* Walton would say the author isn't *actually* grieving. They are engaging in a prop-oriented make-believe where the text serves as a prop. The physical sensation (choking up) is real, but the emotional state is quasi-grief.
      *   **Noel Carroll (Thought Theory):**
          *   *Core Idea:* Emotions can be triggered by thoughts alone, without belief in the existence of the object.
          *   *Mechanism:* To feel pity, you don't need to believe the person exists; you just need to entertain the *thought* of their suffering. Belief is not a necessary condition for emotion.
          *   *Application to User:* Carroll would say the author is feeling *real* grief. The fact that they know the character isn't real doesn't matter. The content of the thought (a death) is sufficient to trigger the physiological and psychological response.

