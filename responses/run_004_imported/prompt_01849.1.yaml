      *(Self-Correction on Aumann)*: Be careful not to say Aumann ignores off-path. He includes them in the strategy definition. The key is that he treats the strategy choice as known *ex ante* and fixed, rather than updated *in situ*.

      *(Refining the "Counterfactual" explanation)*: Aumann uses a specific logic where $K_i(Rationality)$ implies $K_i(BI\_Strategy)$. If a deviation occurs, it's not that rationality is falsified, but that we are in a different state (which was assigned probability 0). But since CKR holds in *all* states, it holds there too. Wait, if CKR holds in all states, deviation can't happen. Aumann's proof shows that in any state where CKR holds, the BI path is played. So the question "what if off-path" is answered by looking at states where CKR holds (where off-path isn't reached) but evaluating the strategy function.
