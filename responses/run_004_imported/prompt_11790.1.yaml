      *   **Incomplete Preferences (Thornley):** The agent prefers Trajectory A to B, and B to C, but has *no preference* between A and D (where D involves shutdown). To avoid money pumps (being exploited for preferring A > B > ... > A), you need a specific choice rule (like Timestep Dominance: don't pay costs to shift probability mass between trajectories you're indifferent about).
          *   *Critique:* How do you train this? Gradient descent optimizes a scalar loss. How do you get non-comparable outcomes? Is it stable? If the agent learns to complete its preferences to minimize loss, the safety property vanishes. Money pump arguments suggest rational agents *must* have complete preferences.

