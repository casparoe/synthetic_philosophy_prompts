      *Key Philosophical Nuance:* The "cluelessness" argument is strong. The best counter in EA circles is usually "Expected Value" + "Tractability." I need to translate that into high-school-grant-committee speak. "Best guess based on evidence" vs. "Guessing in the dark."

      *Proposed Rubric Tweak:* Instead of just "Impact Score," let's do "Impact Score" x "Confidence Level." This directly addresses the "we don't know" concern. If an org claims huge impact but has no track record, their confidence level is low. This validates the cluelessness concern (uncertainty matters) without stopping the process.

