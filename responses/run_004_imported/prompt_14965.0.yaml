answer: |-
  This is a classic philosophical problem, known as **Logical Fatalism** (often traced back to Aristotle's "Sea Battle" argument in *De Interpretatione*). It is distinct from scientific determinism (which relies on cause-and-effect physics) and relies entirely on the logic of truth values.

  Your friend's reasoning is seductive because it treats time like a map: if the map already shows a road, you can't choose not to drive on it. However, her argument contains a specific logical error regarding **modality** (necessity) and a metaphysical error regarding the **direction of explanation**.

  You can bring the following three points back to your friend. They are precise, philosophical counter-arguments that address her specific claim without retreating into "it just feels like free will."

  ### 1. The Modal Fallacy (Necessity of the Consequence vs. Consequent)
  The core logical mistake your friend is making is confusing two different types of necessity. This is the technical "kill shot" to her argument.

  *   **Necessity of the Consequence:** It is necessary that *if* the proposition "I will propose" is true, *then* I will propose. (Symbolically: $\Box(P \to Q)$). This is trivially true; it just means truth corresponds to reality.
  *   **Necessity of the Consequent:** It is necessary that I will propose. (Symbolically: $P \to \Box Q$). This claims the event itself is unavoidable or forced.

  Your friend argues that because the proposition is *already true* (Necessity of the Consequence), the event itself is *fixed* (Necessity of the Consequent). This does not follow.

  **The Argument to Use:**
  > "You are conflating the **infallibility** of truth with the **necessity** of the event. Just because a statement about the future *cannot be false* (if it is indeed true), it does not mean the event *cannot be otherwise*.
  >
  > Consider this: If I choose to propose, the statement 'He will propose' becomes true. If I choose not to, the statement 'He will not propose' becomes true. In either case, one of those statements is 'already true' in your framework. But the *truth value* tracks my choice; it does not *constrain* it. The truth is a shadow cast by the event, not a cage surrounding it."

  ### 2. The Direction of Explanation (Truth-Makers)
  Your friend treats the truth of the proposition as a "Hard Fact" that exists independently of your deliberation, like a stone waiting to be tripped over. This gets the metaphysics backward.

  Propositions do not make the world happen; the world makes propositions true. This is known as the **Truth-Maker Theory**. For the statement "He will propose" to be true *now*, there must be some fact in reality that grounds it.

  If you are a free agent, the "fact" that makes that statement true is **your future deliberation and choice**.

  **The Argument to Use:**
  > "You say the truth is 'already settled.' I ask: *What makes it true?*
  >
  > If the truth is settled independently of my reasoning, then yes, I am a puppet. But if the truth is settled *in virtue of* what I will reason and choose, then my reasoning is the **truth-maker**.
  >
  > The statement 'He will propose after careful deliberation' is only true *because* I will deliberate and choose to propose. If I were to skip the deliberation, that specific statement would be false, and a different one would be true. Therefore, my deliberation is not inert; it is the very mechanism that validates the true proposition. You are treating the scorecard as if it writes the score."

  ### 3. The "Sealed Envelope" Analogy is Flawed
  Your friend used an analogy: *Imagining you could change what is written inside a sealed envelope by staring at it harder.* This analogy begs the question. It assumes the content of the envelope was written by someone else (fate) rather than by you (the agent).

  A better analogy is a **Time Capsule you write yourself.**
  Imagine you write a letter today, seal it in a box, and bury it to be opened in one year. The letter says, "I will propose."
  *   **Is it true now?** Yes, in the sense that the letter exists.
  *   **Did you have a choice?** Yes, you wrote the letter.
  *   **Does the letter force you?** No. If you changed your mind next month, you would have dug up the box and burned the letter. The fact that the letter *currently* exists in the ground doesn't stop you from digging it up.

  In your friend's view, the envelope is sealed by the universe. In your view, *you* sealed the envelope via your deliberation, even if the "sealing" happens in the future relative to now.

  ### Summary for the Dinner Table
  If you want a concise way to put this to her, try this:

  > "Your argument relies on the idea that truth is a **constraint**. I'm saying truth is a **description**.
  >
  > If I deliberate and choose to propose, the proposition 'He will propose' is true. If I deliberate and choose to walk away, the proposition 'He will walk away' is true. In both cases, there is a 'definite truth' about the future.
  >
  > So, the existence of a definite truth doesn't tell us *which* future is real; only my deliberation does that. Therefore, the truth value is **dependent** on my deliberation, not the other way around. To say my deliberation is useless because the truth is already fixed is like saying 'The rain didn't make the ground wet, because it was already true that the ground would be wet.' It confuses the prediction with the cause."

  ### A Philosophical Caveat (For Your Own Sake)
  There is a minority view in philosophy (Open Futurism) that agrees with your intuition so strongly it rejects your friend's premise entirely. It argues that statements about future free choices are **neither true nor false** until they happen.

  However, you don't need to go that far to win this argument. Even if you grant her premise (that future statements *are* true or false now), her inference (that this makes deliberation useless) is logically invalid. The truth of a future proposition is **soft**, not **hard**; it supervenes on your actions, rather than dictating them.

  Your deliberation is not you staring at a sealed envelope; it is you writing the letter that goes inside it. The fact that the letter *will exist* doesn't mean you don't have to write it.
