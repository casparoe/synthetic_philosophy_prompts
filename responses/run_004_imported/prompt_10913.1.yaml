answer: |-
  The drawer stuck. It always stuck on the left rail, a friction variable Elias had never bothered to eliminate. He leaned his weight against the oak, his ribs pressing against the edge of the desk, until it slid open with a groan that sounded too much like a human voice.

  Inside lay the manuscript. Forty pages. Dense,符号-laden, airtight.

  It proved, via modal logic S5, that a being possessing all positive properties must exist in all possible worlds. It proved that existence was a predicate of perfection. It proved that God was not a hope, not a faith, but a theorem. A necessary truth.

  Elias closed the drawer. The proof was safe. The universe was logically accounted for.

  His stomach, however, was not. It clenched, a hollow, acidic knot that had been tightening for six weeks.

  On the kitchen counter, three feet from the desk, sat the Tupperware. Blue lid. Condensation on the inside. Chicken broth, the nurse had said. *Low sodium. Good for the heart, Elias.*

  Nurse Alara. She was kind. Kindness was a variable. Kindness could mask malice, or incompetence, or simple negligence. She had brought the container from the clinic kitchen. He had not seen the pot. He had not verified the water source. He had not analyzed the chemical composition of the salt.

  To eat was to introduce an unverified axiom into the system.

  Elias walked to the counter. His legs were thin, the skin translucent like parchment paper left in the sun. He placed a trembling hand on the blue lid. It was cool.

  "If it were poisoned," he whispered to the empty room, "the outcome is death. If it is safe, the outcome is temporary sustenance."

  He ran the calculation. The risk was non-zero. The reward was finite. The logical move was to reject the input.

  He had shown the manuscript to only one man, twenty years ago. A colleague. A friend. Elias had made him swear an oath, not out of mysticism, but out of risk management. If the public knew Elias Vane had proven the Necessary Being, they would assume Elias *believed* in it. They would conflate the architect with the inhabitant. They would ask for salvation, and Elias had only derived syntax.

  The colleague had laughed. He had called it a parlor trick. Then he had died of a heart attack three days later. Contingent. Messy. Unproven.

  Elias turned from the counter and walked back to the desk. He sat in the wooden chair. The hunger was no longer a pain; it was a state of being. It clarified the vision. When the blood sugar dropped, the noise of the world faded. The neighbors arguing upstairs became irrelevant data. The cold draft from the window became a simple temperature gradient.

  Only the logic remained sharp.

  He opened the top drawer again. He didn't take the papers out. He just looked at the edge of the stack.

  *Theorem 4: The Divine Essence is Exemplified.*

  It was beautiful. It was the only thing in the room that was real. The chair was wood, subject to rot. The body was meat, subject to decay. The soup was chemistry, subject to error. But the proof? The proof was necessary. It existed in every possible world, including this one, even if Elias was not in this one much longer.

  There was a knock at the door.

  "Elias? It's Alara. I brought crackers."

  He didn't move.

  "Elias, I know you're in there. You look pale. Please."

  *Pale.* A descriptor of oxygen deprivation. *Please.* An imperative statement lacking logical force.

  He looked at the soup. He looked at the drawer.

  The irony was not lost on him. It was, in fact, the only thing that tasted like anything. He had spent a lifetime securing the foundations of truth, ensuring that nothing could be claimed without derivation. He had built a cathedral of certainty in a universe of chaos. And in doing so, he had starved.

  To trust the soup was to admit that some things must be accepted on faith. To trust the proof was to admit that nothing matters but the abstract.

  He could not bridge the gap. He could not eat the symbols, and he could not swallow the soup.

  "Elias?" The handle turned. Locked.

  "I'm working," Elias said. His voice was a dry rustle.

  "On what?"

  "On existence."

  "Open the door, Elias. Let me help you."

  *Help.* A subjective term. What constituted help? Prolonging the function of a biological machine that was destined for entropy? Or preserving the integrity of a mind that had touched the absolute?

  If he opened the door, he admitted uncertainty. If he stayed seated, he remained consistent.

  He looked at his hand. The tremor had stopped. The body was shutting down non-essential systems. Logic was the last system running.

  He slid the drawer shut. The friction caught, just for a moment, then sealed.

  The soup sat on the counter, cooling. The proof sat in the dark, eternal.

  Elias folded his hands on the desk. He closed his eyes. He didn't pray. Praying implied a request. He simply observed the deduction.

  *Premise 1: I require certainty to act.*
  *Premise 2: The physical world offers no certainty.*
  *Conclusion: I cannot act.*

  It was valid. It was sound. It was fatal.

  "Go away, Alara," he said softly.

  He listened to her footsteps fade down the hall. He listened to the silence return. He listened to the quiet hum of the refrigerator, cycling on and off, a mechanical heartbeat trying to keep the decay at bay.

  Elias Vane sat very still. He had proven that a Necessary Being existed. He was currently demonstrating, with rigorous precision, that he was not it.
