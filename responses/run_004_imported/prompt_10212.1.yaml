answer: |-
  This is a classic metaethics showdown, and honestly, Jonas is punching above his weight for 1am (name-dropping Frege-Geach and Blackburn/Gibbard is serious ammo). But don't worry, your position isn't dead; it just needs an upgrade.

  Here is the breakdown of the Frege-Geach problem, whether it sinks your view, and what you have to sacrifice to keep holding it without looking logically incoherent.

  ### 1. The Frege-Geach Problem: Why "Boo!" Isn't Enough
  To understand why Jonas thinks he won, you have to see why the logic breaks under simple emotivism.

  **The Setup:**
  *   **Your View (Simple Emotivism):** "Stealing is wrong" means "Boo, stealing!" (Expression of attitude). It has no truth value. It's not true or false; it's just a verbal grimace.
  *   **The Argument:**
      1.  Stealing is wrong.
      2.  If stealing is wrong, then getting your little brother to steal is wrong.
      3.  Therefore, getting your little brother to steal is wrong.

  **The Problem:**
  This argument is logically valid (Modus Ponens). For logic to work, the phrase "Stealing is wrong" must mean the **exact same thing** in Premise 1 and Premise 2.
  *   In **Premise 1**, you are asserting it. On your view, you are yelling "Boo, stealing!"
  *   In **Premise 2**, you are *not* asserting it. You are putting it in an "if" clause. You aren't yelling "Boo!" hypothetically. You are just considering the proposition.

  If "Stealing is wrong" means "Boo!" in the first premise, but means something else (or nothing) in the second premise because you aren't actually emoting, then the argument commits the **fallacy of equivocation**. It's like saying:
  1.  **Banks** are where money is kept.
  2.  If **banks** are eroded, the river changes course.
  3.  Therefore, where money is kept changes course.

  Jonas's point is that simple emotivism makes moral reasoning look like nonsense. It suggests you can't logically derive moral conclusions from moral premises, which contradicts how we actually use language. We *do* reason about morals.

  ### 2. Does This Sink Your View?
  **Simple Emotivism (A.J. Ayer style): Yes, pretty much.**
  If you stick to the hardline "moral statements are *only* emotional venting and have no cognitive content," Frege-Geach is a fatal blow. You cannot explain how moral logic works without admitting that moral sentences have some kind of propositional content (something that can be true/false or consistent/inconsistent).

  **Sophisticated Expressivism (Blackburn/Gibbard style): No, it survives.**
  This is where Jonas's name-dropping comes in. Philosophers like Simon Blackburn (**Quasi-Realism**) and Allan Gibbard (**Norm-Expressivism**) accept the Frege-Geach challenge and try to solve it *without* giving up the core idea that there are no objective moral facts.

  They argue that even if there are no "moral facts" out there in the universe, our language *functions* as if there are. We earn the right to talk about moral "truth" and "logic" based on the consistency of our attitudes, not on matching reality.

  ### 3. The "Quasi-Realist" Fix: How It Works
  If you want to keep your view, you need to pivot from Simple Emotivism to **Expressivism/Quasi-Realism**. Here is the gist of the fix:

  *   **Blackburn's Move:** He argues that when you accept the conditional ("If stealing is wrong..."), you aren't expressing an attitude toward stealing. You are expressing a **higher-order attitude**. You are saying, "I disapprove of anyone who disapproves of stealing but *doesn't* disapprove of getting their brother to steal."
      *   Logic becomes about the **consistency of attitudes**, not the truth of facts. If you hold inconsistent attitudes, you are rationally defective, even if you aren't "factually" wrong.
  *   **Gibbard's Move:** He shifts from "emotions" to "norms/planning." To say "Stealing is wrong" is to accept a norm that permits feelings of guilt for stealing. Logic works because you can't consistently plan to feel guilty about X while planning not to feel guilty about something that entails X.

  **Do these fixes work?**
  In the academic world, this is still debated. Mark Schroeder (a contemporary metaethicist) argues they face a "Negation Problem" (distinguishing between "It is not the case that stealing is wrong" and "Stealing is not wrong" is still tricky for expressivists). However, most agree these sophisticated views are *much* stronger than the 1930s emotivism you were defending.

  ### 4. What You Have to Give Up
  To adopt this upgraded view and survive the next debate, you have to concede three major things. You can't just say "uh, logic doesn't apply to morals."

  **A. You must admit moral claims function *as if* they are true.**
  You can't say "Moral claims aren't true or false." A Quasi-Realist says, "Moral claims aren't true because they match facts, but they are 'true' in the sense that they represent a consistent, stable set of normative commitments."
  *   **The Concession:** You have to stop saying "There is no moral truth." Instead, say, "Moral truth isn't about describing the universe; it's about the coherence of our practical reasoning."

  **B. You must admit moral disagreement is rational, not just emotional.**
  If it's just "Boo vs. Yay," then disagreeing with a Nazi is like disagreeing about ice cream flavors. But it's not. We argue with reasons.
  *   **The Concession:** You have to acknowledge that when you say "That's just your opinion," you aren't dismissing it as irrational. You are acknowledging a clash of fundamental commitments. You need to allow that people can be *mistaken* in their moral reasoning (due to inconsistency or ignorance of facts), even if there are no moral "facts."

  **C. You have to refine "That's just your opinion."**
  This phrase is your biggest liability. In philosophy, "opinion" usually implies a lack of justification.
  *   **The Concession:** Change your phrasing. Instead of "That's just your opinion," try: **"That's a normative commitment you're making, not a fact you're discovering."** This keeps your anti-realist stance (no facts) but respects the logical weight of their claim (it's a commitment subject to consistency).

  ### 5. Your Strategy for Round Two
  If you want to go back to Jonas and hold your ground without looking logically full of it, here is your script:

  1.  **Concede the point on Simple Emotivism:** "Okay, you're right. The 1930s 'Boo/Hurrah' version of emotivism can't handle embedded conditionals. That view is dead."
  2.  **Pivot to Expressivism:** "But that doesn't mean moral realism wins. It just means we need a sophisticated Expressivism like Blackburn's. We can explain the logic of morals through the consistency of attitudes rather than the correspondence of facts."
  3.  **The Knockout Punch:** "The Frege-Geach problem shows that moral language *acts* like factual language. But acting like something doesn't mean you *are* that thing. I can still maintain there are no spooky moral facts in the universe, while admitting we use logic to keep our moral attitudes consistent. So, I don't have to say 'that's just your opinion' to dismiss you; I can say 'your normative commitments are inconsistent with your other commitments.'"

  **The Bottom Line:**
  The Frege-Geach problem sinks the idea that moral language is *merely* emotional venting. It does **not** sink the idea that there are no objective moral facts. You can keep your metaethical stance (Anti-Realism), but you have to upgrade your philosophy from "Casual Emotivism" to "Sophisticated Expressivism."

  You lose the simplicity of "Boo!", but you gain the ability to participate in logical moral reasoning without believing in moral magic.
