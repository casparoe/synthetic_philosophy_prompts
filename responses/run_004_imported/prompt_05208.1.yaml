answer: |-
  **Setting:** *11:30 PM. The philosophy department lounge. The whiteboard is covered in sigma notation and the terms of the alternating harmonic series. Two empty coffee cups sit on the table. ELENA (Revisionist) is standing by the board, marker in hand. MARCUS (Conservative) is slumped in an armchair, loosening his tie.*

  **Elena:** You're retreating into formalism, Marcus. That's the tell. When the math gets uncomfortable, you say the problem isn't with the theory, but with the application. "Domain restriction." It sounds so clean. But look at the board. Altadena dominates Pasadena. Pointwise. In every single state of the world, Altadena pays a dollar more. If Expected Utility Theory cannot tell an agent to prefer Altadena over Pasadena, it isn't just restricted; it's broken.

  **Marcus:** It's not broken, Elena. It's silent. There's a difference. A thermometer doesn't malfunction when you stick it in a furnace; it just melts. It has an operating range. Expected Utility Theory is defined for random variables where the expectation integral exists. In the Lebesgue sense, that requires absolute convergence. The Pasadena game fails that test. The sum of the absolute values diverges. So the expectation is undefined. If the expectation is undefined, the theory has nothing to say. That's not a defect; it's a boundary condition.

  **Elena:** But rationality doesn't have boundary conditions there! If I offer you two envelopes, and I tell you, "Envelope A contains the Pasadena payoff, Envelope B contains the Pasadena payoff plus one dollar," you would take B. You wouldn't say, "Well, since the series is only conditionally convergent, I'm indifferent."

  **Marcus:** I would take B because I'm not a theorem. I'm a human with heuristics. But if we are doing *normative* decision theory, we have to ask why that intuition should hold. In infinite cases, dominance reasoning is treacherous. Look at the St. Petersburg paradox. If I offer you Game A (St. Petersburg) and Game B (St. Petersburg plus a penny), dominance says take B. But both have infinite expectation. Standard EUT says they are equivalent. Most decision theorists accept that EUT ranks them as equal, or at least refuses to rank B higher, because infinity plus one is just infinity. Why is Pasadena different?

  **Elena:** Because St. Petersburg diverges to positive infinity. Pasadena is finite *if you sum it in the natural order*. It sums to $\ln(2)$. The problem isn't that the value is infinite; it's that the value is order-dependent. And that's exactly why your "boundary condition" move fails. You say we need absolute convergence. But why? The Riemann Rearrangement Theorem shows that without absolute convergence, the sum depends on the ordering of terms. But the game *has* a natural ordering. The coin tosses happen sequentially. Toss 1, Toss 2, Toss 3. The payoff is determined by the *first* heads. That structure imposes an order on the outcomes. Why isn't that order privileged?

  **Marcus:** Because the expectation operator is supposed to be a function of the probability space and the random variable, not the enumeration of the sample space. The sample space is the set of sequences $\{H, TH, TTH, \dots\}$. That set doesn't come with an inherent order. You're imposing the order of the natural numbers because that's how we *describe* the game, not because it's intrinsic to the gamble itself. If I define the random variable $X$ on that space, $E[X]$ should be invariant under permutations of the index set. If it's not, then $E[X]$ isn't well-defined. If you privilege the natural ordering, you're essentially changing the definition of expectation to "sum in the order of description." That's ad hoc.

  **Elena:** It's not ad hoc if the description tracks the causal structure of the chance process! The probability $1/2^n$ isn't just a number attached to an outcome; it's the result of $n$ independent physical events. The "order of description" is the order of the physical generation of the outcome. Easwaran argued for "weak expectations" based on the Law of Large Numbers. If you play the Pasadena game repeatedly, the average payoff converges to $\ln(2)$ with probability 1. That's a fact about the world, not just a convention of summation. If the long-run frequency settles on $\ln(2)$, why shouldn't the single-case expectation match it?

  **Marcus:** Because single-case decision theory isn't long-run frequency theory. I'm not playing the game a million times. I'm playing it once. And for the single case, the justification for maximizing expectation is usually derived from the VNM axioms or Dutch Book arguments. Both assume the expectation is well-defined. If you try to Dutch Book me on Pasadena, you run into the same rearrangement problems. You can construct a book that looks profitable if you sum one way, and losing if you sum another. There is no coherent betting quotient.

  **Elena:** So you'd rather abandon the Dominance Principle than adjust the expectation rule? That seems like buying the formalism at the cost of the normativity. Colyvan's relative expectation theory handles this. You don't ask for the absolute EV of Pasadena or Altadena. You ask for the EV of the *difference*. The difference is always $+1$. The expectation of the difference is well-defined even if the expectations of the relata are not. It preserves dominance without requiring absolute convergence for every individual gamble.

  **Marcus:** Colyvan's fix is clever, but it's a patch. It works for Altadena vs. Pasadena because the difference is constant. What if the difference is also conditionally convergent? Then you're back in the soup. You're building a decision theory on a foundation of sand. Every time you encounter a new rearrangement paradox, you add a new rule: relative expectations, weak expectations, principal values. Meanwhile, standard EUT remains elegant and robust for 99% of decision problems—basically, any problem where the payoffs don't grow exponentially against the probabilities. Why break the engine to accommodate a car that can't be built?

  **Elena:** Because philosophy isn't about engineering convenience; it's about truth. If EUT is the *general* normative theory of choice under risk, it shouldn't go silent in the limit. The Pasadena game isn't just a "weird case." It reveals that the link between probability and value is weaker than we thought. It shows that linearity of expectation—$E[X + Y] = E[X] + E[Y]$—fails when absolute convergence is missing. If linearity fails, the whole algebraic structure of decision theory crumbles. You can't just wall off Pasadena. It infects any compound gamble involving Pasadena-like distributions.

  **Marcus:** Or, it shows that linearity is only valid when the integrals exist. We don't say arithmetic is broken because division by zero is undefined. We say division by zero is outside the domain of the operation. I'm arguing for mathematical hygiene. If you allow conditionally convergent series into the domain of admissible gambles, you lose the ability to compare gambles consistently. You might prefer A to B, and B to C, but C to A, depending on how you group the terms in your head. Intransitivity is a far worse sin than silence.

  **Elena:** But silence *leads* to intransitivity in practice! If EUT says "no verdict" on Pasadena vs. Altadena, but my dominance intuition says "Altadena," and I also have a gamble C that EUT *does* rank... I end up with a fragmented preference structure. I'd rather adopt a generalized rule that respects dominance, even if it means giving up the standard definition of expectation. The "privileged order" isn't metaphysical magic, Marcus. It's pragmatic. The natural number ordering is the only one that respects the information structure of the game. We know the probability of stopping at $n$ is $1/2^n$. We don't know the probability of "stopping at the third term of a rearranged series."

  **Marcus:** But that's just restating the problem. The "information structure" gives you the probabilities of the outcomes. It doesn't give you an order of *valuation*. When you calculate expected utility, you are summing value-weighted probabilities. The summation is a mathematical operation performed by the agent, not a physical process performed by the coin. The coin doesn't sum anything. The coin lands. You get a payoff. The expectation is a tool for *you* to evaluate the gamble. If your tool gives different results depending on how you organize your spreadsheet, the tool is sensitive to irrelevant features. That's a flaw in the tool.

  **Elena:** The tool assumes the series is absolutely convergent. That's the hidden premise. Nover and Hájek's point is that we never noticed that premise before. We thought EUT applied to all bounded-risk gambles. Pasadena shows it doesn't. So now we have a choice: admit EUT is incomplete, or deny that rational agents should prefer Altadena. You're choosing to deny the intuition. I'm choosing to fix the theory.

  **Marcus:** I'm not denying the intuition. I'm questioning its weight. Our intuitions about infinity are notoriously unreliable. Why trust the dominance intuition here more than we trust the intuition that "infinity plus one is better than infinity" in St. Petersburg? In both cases, we are comparing infinite structures. In St. Petersburg, we accept that EUT treats them as equal. In Pasadena, you want to say EUT is wrong because it treats them as undefined. But if you accept dominance in Pasadena, you have to explain why it doesn't force you to accept dominance in St. Petersburg variants that lead to contradictions.

  **Elena:** Because in St. Petersburg, the expectation is actually infinite. In Pasadena, it's finite but unstable. There is a qualitative difference between divergence and conditional convergence. The weak expectation exists for Pasadena. It doesn't for St. Petersburg. That's a mathematical fact, not an intuition. Easwaran showed that. If the weak expectation exists, it provides a normative anchor. It tells us that over time, the average payoff stabilizes. That stability is enough to ground a preference.

  **Marcus:** "Over time." Again, you're smuggling in repeated play. But decision theory is supposed to guide the single shot. If I'm offered the Pasadena game once, the Law of Large Numbers doesn't help me. I won't get $\ln(2)$. I'll get $2$, or $-2$, or $8/3$. The "weak expectation" is a property of the sequence, not the individual outcome. Basing a single-choice norm on a long-run property is the Gambler's Fallacy dressed in measure theory.

  **Elena:** It's not the Fallacy if the justification for using expectation in the first place relies on long-run convergence! If you defend EUT by saying "maximizing EV leads to the best outcomes in the long run," then you can't discard the long run when it becomes inconvenient. If you defend EUT via coherence arguments, then you have to deal with the fact that conditional convergence breaks coherence. Either way, you're stuck. The standard theory assumes absolute convergence without stating it. Pasadena makes that assumption visible. You can't just hide it back under the rug by saying "domain restriction." You have to justify *why* that restriction is normatively binding.

  **Marcus:** The justification is coherence. If I allow conditionally convergent gambles, I can be Dutch Booked *if* I accept certain plausible aggregation principles. To avoid the book, I must refuse to bet. Refusing to bet is the rational response to undefined expectation. So EUT *does* speak: it says "suspend judgment." That is a verdict. It's not silence; it's a null verdict. And a null verdict is better than a wrong one. If I tell you Altadena is better, I might be committing you to a preference structure that allows a money pump under a different grouping of the same outcomes.

  **Elena:** But the "different grouping" is artificial. No one offers you the Pasadena game rearranged. The game is defined by the coin tosses. The tosses are ordered. To say "you should be indifferent because a rearranged version would have a different sum" is to say "you should ignore the actual game in front of you because a hypothetical game with the same outcomes but different rules confuses the math." That's fetishizing the formalism over the choice.

  **Marcus:** And to say "you should prefer Altadena" is to say "you should ignore the mathematical instability because your intuition feels strong." That's fetishizing the intuition over the math. Look, Elena, maybe the truth is that there is no fact of the matter. Maybe "The Expected Value of the Pasadena Game" is like "The King of France." It's a presupposition failure. The question presupposes a well-defined expectation. There isn't one. So there is no fact about whether Altadena is better *in expectation*. There is only the fact that Altadena dominates. But dominance is a different principle than expectation. You're trying to force dominance into the expectation framework. Maybe they come apart.

  **Elena:** If they come apart, then Expected Utility Theory is not the supreme normative theory. It's subordinate to dominance. And if it's subordinate, then it needs revision to ensure it respects dominance. That's my point. You're happy to let them come apart and leave EUT as is. I'm saying that if EUT conflicts with dominance, EUT must yield. Since EUT yields "undefined," and dominance yields "Altadena," we need a new rule that outputs "Altadena." Relative expectations do that.

  **Marcus:** Relative expectations sacrifice the independence axiom. They make the value of a gamble dependent on what it's paired with. That's a huge cost. It undermines the whole idea that gambles have intrinsic value.

  **Elena:** Maybe gambles *don't* have intrinsic value in infinite spaces. Maybe value is essentially comparative. Pasadena forces us to see that. You're clinging to the idea that every gamble must have a number attached to it. I'm saying the number isn't there. The relation is.

  **Marcus:** *(Pauses, looking at the board)* The relation is... but the relation relies on the ordering. If I pair Pasadena with Altadena, I get +1. If I pair Pasadena with some other conditionally convergent gamble, the difference might be undefined too. You haven't solved the general problem. You've just solved it for the specific case where the difference is constant.

  **Elena:** It's a start. And it's better than saying "I don't know."

  **Marcus:** "I don't know" is the only honest answer when the math doesn't settle.

  **Elena:** Rationality isn't just about honesty, Marcus. It's about action. I have to choose. If I have to choose, and one option dominates, I choose the dominator. If your theory tells me I can't justify that choice, your theory is too weak for the job.

  **Marcus:** And if my theory tells you that justifying that choice might lead to inconsistency elsewhere, your theory is too dangerous for the job.

  *(Silence hangs between them. Elena puts the cap back on the marker. Marcus picks up his coffee cup, finds it empty, and sets it down.)*

  **Elena:** So we're at an impasse. You prioritize consistency of the formalism; I prioritize coverage of the intuitions.

  **Marcus:** I prioritize the conditions under which the formalism is valid. You want to extend the formalism beyond its validity conditions.

  **Elena:** I want to find the formalism that matches the validity conditions of *rationality*. If rationality demands we prefer Altadena, the math has to catch up.

  **Marcus:** Or rationality has to accept that some questions have no answer.

  **Elena:** *(Smiles faintly)* See you at the seminar tomorrow? I'm presenting on Easwaran's 2008 paper.

  **Marcus:** *(Stands up)* I'll be there. I'm planning to object.

  **Elena:** I'm counting on it.

  *(Marcus turns off the lights. The whiteboard remains illuminated by the hallway light streaming through the glass pane, the alternating series glowing in the dark.)*
