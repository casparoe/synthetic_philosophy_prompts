      *   *Check:* Altadena is Pasadena + 1. Sum of 1s is $\sum 1/2^n = 1$. So Altadena EV should be $\ln(2) + 1$ *if* we allow linearity. But linearity fails if EVs are undefined. This is the crux.
      *   *Check:* Ensure Marcus doesn't sound like he's ignoring the problem. He needs a principled reason for restriction.
