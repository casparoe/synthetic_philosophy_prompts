  2.  **Deconstruct the Philosophical Positions:**
      *   **The Pasadena Game:** Payoff $X_n = (-1)^{n-1} 2^n / n$ with probability $p_n = 1/2^n$. Expected Value (EV) sum is $\sum p_n X_n = \sum \frac{(-1)^{n-1}}{n}$. This is the alternating harmonic series, converging to $\ln(2)$.
      *   **The Problem:** The series is *conditionally* convergent, not *absolutely* convergent ($\sum |p_n X_n| = \sum 1/n$ diverges). By Riemann Rearrangement Theorem, the sum depends on the order of terms. EUT usually assumes the sum is invariant.
      *   **Altadena:** Pasadena + $1$ in every state. Dominates Pasadena. But if EV is undefined for both, standard EUT can't say Altadena > Pasadena.
      *   **Revisionist Arguments:**
          *   Dominance is paramount. If $A(\omega) > B(\omega)$ for all $\omega$, choose $A$.
          *   EUT is silent, but rationality isn't.
