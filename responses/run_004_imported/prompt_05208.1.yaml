      *   **Round 2: Privileged Ordering.**
          *   Marcus: Just sum in the natural order ($n=1, 2, 3...$). That's how the game is played.
          *   Elena: Why is that order normative? Riemann says any order is mathematically valid. If I group the terms differently (e.g., two losses for every win), the sum changes. Why is the "toss order" the *value* order?
      *   **Round 3: Dominance in Infinite Spaces.**
