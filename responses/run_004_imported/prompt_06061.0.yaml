answer: |-
  Here is the direct answer: **The rationalists are misapplying the theorem.**

  The genetic counselors and the patients are behaving consistently with expected utility theory. The rationalists are taking a mathematical proof about *instrumental* decision-making and incorrectly elevating it to a philosophical imperative about *truth-seeking*.

  The "wrinkle" that resolves the contradiction lies in the specific assumptions of Good's Theorem regarding **utility functions** and the definition of **"free" information.**

  Here is the breakdown of why the theorem holds mathematically but fails to support the rationalist claim in the Huntington's scenario.

  ### 1. What Good's Theorem Actually Says
  I.J. Good's 1967 theorem proves that for an expected-utility maximizer, the expected value of making a decision *after* observing free information is always greater than or equal to the expected value of making the decision *without* that information.

  $$E[\max_a E[U(a) | \text{info}]] \geq \max_a E[U(a)]$$

  In plain English: If you can get information for free, look at it, and then choose the best action based on what you learned, you will never do worse (in expectation) than if you had to choose blindly.

  **The Critical Assumptions:**
  1.  **Instrumentality:** The value of the information comes solely from its ability to help you choose a better *action*.
  2.  **Costlessness:** The information must be "free." In decision theory, "cost" is measured in **utility**, not just money. If acquiring the information reduces your utility directly (e.g., through pain, distress, or time), it is not free.
  3.  **World-State Utility:** The utility function $U$ is typically defined over outcomes in the world (e.g., "I am healthy," "I am rich"), not over states of belief (e.g., "I know I am sick").

  ### 2. Why the Huntington's Case Breaks the Rationalist Interpretation
  In the case of Huntington's disease, there is currently no cure. The medical actions available to a patient are largely the same whether they test positive or negative (monitoring, lifestyle adjustments, family planning).

  **The Rationalist Error:**
  When a rationalist says, "There's no good reason not to want to know," they are assuming the utility function looks like this:
  *   $U = \text{Physical Outcome} + \text{Quality of Decision}$

  Since the information allows for better planning (wills, goodbyes), they argue the decision quality improves, so EV is positive.

  **The Patient's Reality:**
  The patients (and counselors) are operating with a utility function that looks like this:
  *   $U = \text{Physical Outcome} + \text{Quality of Decision} - \text{Psychological Distress of Knowing}$

  For many patients, the "Psychological Distress of Knowing" is a massive negative utility. Because there is no medical cure, the "Quality of Decision" gain is negligible. Therefore:
  *   $\text{Value of Info} \approx 0 (\text{no medical change}) - \text{High Distress} = \text{Negative Value}$

  ### 3. The Resolution: Information Is Not "Free"
  This is the specific technical wrinkle that solves your puzzle.

  Good's Theorem only applies to **costless** information. In the rationalist pitch you were given, "free" implies "no money and no time." But in the formal mathematics of the theorem, "free" means **no utility cost.**

  If knowing a fact makes you miserable, that fact has a **negative utility cost.** Therefore, the information is not "free" in the sense required by Good's Theorem. Once you introduce a cost to the observation itself, the theorem no longer guarantees that seeking information is optimal.

  Consequently:
  1.  **The Math:** Good's Theorem is correct. (If info is truly utility-costless, you should take it.)
  2.  **The Rationalists:** They are wrong. They are conflating "monetarily free" with "utility-costless." They are also smuggling in a terminal value for "Truth" that is not present in the patient's utility function.
  3.  **The Patients:** They are rational. They are maximizing their expected utility by avoiding a high-cost input (distress) that yields low-value output (medical options they can't use).

  ### 4. Bias vs. Preference
  This distinction allows you to write definitively about the "ignorance as bias" claim.

  *   **Bias:** A systematic deviation from maximizing one's *own* stated preferences due to cognitive error.
  *   **Preference:** A stable ordering of outcomes in one's utility function.

  If a patient says, "I prefer to live with hope than to live with certainty," and they choose ignorance to achieve that, they are satisfying a **preference**.

  The rationalist claim that "ignorance is a bias" is only true if you define the agent's goal as "maximize accuracy of beliefs." But in standard decision theory (and medicine), the agent's goal is "maximize well-being." When accuracy reduces well-being without improving physical outcomes, ignorance is a **rational preference**, not a bias.

  ### Summary for Your Article
  You can state with confidence that the rationalists are committing a category error. They are using a theorem about **instrumental rationality** (how to get what you want) to enforce a norm of **epistemic rationality** (believing true things).

  Good's Theorem proves that information is always instrumentally valuable *for decision making*. It does not prove that information is intrinsically valuable *for living*. In the Huntington's case, the information has no instrumental value (no cure) and high intrinsic cost (distress). Therefore, the rationalist assertion that "there is no good reason not to know" is mathematically unfounded. The patients are not irrational; the rationalists are just using the wrong utility function.
