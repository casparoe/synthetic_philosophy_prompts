          *   *Strength:* High intuitive force. If a formal model contradicts clear cases of confirmation, the model is suspect.
          *   *Weakness:* Declaring "disproof" might be too hasty if there are viable interpretations or modifications. It assumes the standard formalism is the *only* Bayesianism.

      *   **Move 2 (Elena):** The fix is that the new evidence isn't $E$ (the precession), but the logical fact $H \vdash E$ (GR entails the precession). Einstein wasn't logically omniscient; learning the entailment is the new information.
          *   *Analysis:* This is the standard Garber-style solution (Garber 1983). It shifts the evidence from the empirical fact to the logical relation.
          *   *Strength:* Saves the intuition that *something* new happened (the derivation). Explains why the credence moved.
          *   *Weakness:* Requires relaxing the assumption of logical omniscience, which is baked into standard probability axioms.

      *   **Move 3 (Marcus):** Relaxing logical omniscience breaks standard probability theory (which assumes logical omniscience). Also, assigning priors to logical entailments is arbitrary. Better fix: Counterfactual historical reconstruction (What would Einstein have believed if he *didn't* know E?).
