      *   *Move 2:* Elena wins. This is the Garber solution. It captures the cognitive reality of derivation.
      *   *Move 3:* Marcus wins on the technical point (standard probability assumes logical omniscience), but his counterfactual alternative is controversial. I'll give him the point for identifying the structural cost.
