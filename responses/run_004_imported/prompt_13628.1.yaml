      *   **Conflict:** A family blowup over the user's brother's behavior. The father refuses to excuse the brother ("that's who he's chosen to be").
      *   **User's Discovery:** Found Galen Strawson's "Basic Argument" (incompatibilist/regress argument) and noted the irony that Galen is P.F. Strawson's son.
      *   **Constraint:** Do *not* use the generic "determinism kills responsibility" argument. The father has a canned reply (Strawson Sr. doesn't care about ultimate desert, only reactive attitudes).
      *   **Goal:** A "surgical" argument. Use Strawson Sr.'s own distinction between *excuses* (specific act) and *exemptions* (whole person/objective attitude) against him, leveraging Galen Strawson's Basic Argument.
      *   **Specific Mechanism:** Argue that if Galen's regress holds (no one is responsible for how they are made), then the condition for *exemption* (warped formative circumstances/nature) applies to *everyone*, not just the "deranged" or "children."
      *   **Anticipated Counter-move:** The father will say Strawson Sr. only cared about proximate sanity/self-control, not ultimate self-origination.
      *   **Rebuttal needed:** Show that retreating to proximate conditions surrenders the normative force of the reactive attitudes (the very thing Strawson Sr. wanted to save).

  2.  **Deconstruct the Philosophical Positions:**
      *   **P.F. Strawson ("Freedom and Resentment"):**
          *   Focus: Interpersonal relationships, reactive attitudes (resentment, gratitude, etc.).
          *   Distinction: *Excuses* (I didn't mean to, I was pushed) vs. *Exemptions* (He's a child, he's psychotic, he's brainwashed).
          *   Exemptions shift us from the "participant stance" to the "objective stance" (treating them as objects to be managed, not partners to engage with).
          *   Claim: We don't need metaphysical free will; we just need the natural human framework of reactive attitudes. Determinism doesn't threaten this unless it makes *everyone* exempt.
      *   **Galen Strawson ("The Basic Argument"):**
          *   Core: To be truly morally responsible for an action, you must be responsible for the way you are (your character/motivations) that led to the action.
          *   Regress: To be responsible for the way you are, you must have chosen to be that way. But to choose that, you must have had a prior character/motivations to make that choice.
          *   Conclusion: Infinite regress. Therefore, no one is ever ultimately responsible for how they are. *Ultimate Responsibility* is impossible.

  3.  **Synthesize the Argument (The "Surgical Strike"):**
      *   *Premise 1 (Galen):* No one is responsible for the "tangle of nature-plus-formation" that produced them. (The Basic Argument).
      *   *Premise 2 (P.F. Strawson):* Exemptions (shifting to the objective stance) are warranted when a person's capacity for ordinary adult relationships is undermined by their formative circumstances or nature (e.g., "warped by genuinely rotten formative circumstances").
      *   *The Clash:* If Galen is right, *everyone* is the product of a "tangle" they didn't choose. If P.F. Strawson admits that "warped formative circumstances" justify exemption, but Galen shows *all* formative circumstances are unchosen and determining of the self, then the distinction between "normal formation" and "warped formation" loses its moral weight regarding responsibility.
      *   *The Trap:* If P.F. Strawson says, "I only care about proximate sanity," he admits that reactive attitudes are just psychological habits, not normative justifications. If they are just habits, they can't justify *blame* in the way the father wants (normative condemnation vs. mere annoyance).

  4.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Acknowledge the irony (Father/Son Strawson). Validate the father's position (it's robust) but state the goal: internal critique.
      *   **Step 1: The Exemption Condition.** Define P.F. Strawson's "Objective Attitude." It's triggered when someone is incapable of normal participation due to *constitution* or *circumstance* (child, psychosis, extreme deprivation).
      *   **Step 2: Galen's Wedge.** Introduce the Basic Argument. It's not about determinism; it's about *origination*. You are the product of factors you didn't choose.
      *   **Step 3: The Collapse.** If "warped formative circumstances" exempt your brother, why don't *any* formative circumstances exempt anyone? The difference between "warped" and "normal" upbringing is just luck (genetic + environmental). If luck negates responsibility in the extreme case (exemption), why does it sustain responsibility in the normal case (participant stance)?
      *   **Step 4: Anticipating the Retreat.** The father will say, "Strawson Sr. only requires *rational competence*, not *ultimate origination*."
      *   **Step 5: The Knockout.** If you retreat to rational competence, you have a *medical/psychological* standard, not a *moral* one. You can manage the brother, but you can't *resent* him in the way that implies he *ought* to have been different deep down. The "reactive attitude" of resentment presupposes a demand for goodwill. If the capacity for goodwill is itself unchosen (per Galen), the demand is unintelligible. The "participant stance" becomes a game we play, not a justification for blame.

  5.  **Refining the Tone:**
      *   Needs to be respectful (it's the user's dad).
