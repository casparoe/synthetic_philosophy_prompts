          *   Thorne argues that homeostasis (temp, hormone balance) is internal, not machine-driven.
      *   **Round 3: The Ventilator Objection (The Hard Part for Thorne).**
          *   Rostova argues the machine *is* the integrator. Take the plug out, integration stops.
          *   Thorne argues the machine replaces *one* organ (lungs), not the *organizing principle*. A diabetic on insulin is still alive.
      *   **Round 4: The "What Are We?" Question.**
          *   Philosophical pivot. Is a human a biological organism or a person/consciousness?
          *   They need to find common ground or agree to disagree on the metaphysics while acknowledging the practical stakes.
      *   **Ending:** No easy resolution, but mutual respect and clarified positions.

  5.  **Refining the Dialogue (Self-Correction during drafting):**
      *   *Critique:* Is Rostova sounding too bureaucratic?
      *   *Fix:* Give her stronger philosophical grounding. Make sure she talks about "loss of capacity for consciousness" vs. "biological unity." Actually, the prompt specifies "integrative unity" rationale, so stick to the biology of the organism, not just personhood.
      *   *Critique:* Is Thorne just saying "heart beat = life"?
