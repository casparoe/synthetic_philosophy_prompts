          *   Brain is the critical organ for somatic integration (homeostasis, hormonal control, response to stress).
          *   Without the brain, the body is a collection of cells, not an organism.
          *   Ventilators mask the underlying biological reality of cessation.
          *   Legal/Practical necessity (organ donation, resource allocation).
      *   *Circulatory/Respiratory (Thorne):*
          *   D. Alan Shewmon's evidence: Brain-dead bodies can heal wounds, fight infections, regulate temperature, gestate fetuses.
          *   This proves somatic integration exists without the brain.
          *   Ventilators assist breathing, but the *body* does the integrating.
          *   Death is a process, not a moment, but the heart stopping is the only clear line.

  4.  **Drafting - Section by Section:**

