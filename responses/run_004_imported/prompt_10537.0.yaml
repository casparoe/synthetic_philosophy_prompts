prompt: |-
  So we just wrapped up the brain death unit in my bioethics seminar and I want to stress-test my notes on it. Can you write a dialogue between two hospital ethics committee members — one defending the standard whole-brain criterion (the "integrative unity" rationale: the brain is what organizes the body into one functioning organism) and one who thinks thats wrong and only circulatory/respiratory cessation counts as real death, leaning on Shewmon-style cases where "brain-dead" bodies stayed integrated — healing wounds, fighting infections, even carrying a pregnancy to term — way longer than the standard theory predicts. Make them really engage with each other's strongest points instead of repeating talking points: the whole-brain defender can't just wave away those cases, and the circulatory-death person has to answer the obvious comeback that a ventilated "brain-dead" body looks a lot more like a machine-sustained corpse then a genuinely integrated organism. Neither should be a pushover — I want real back-and-forth, not two monologues.
reasoning: |-
  Here's a thinking process that leads to the dialogue above:

  1.  **Analyze the Request:**
      *   **Topic:** Brain Death vs. Circulatory/Respiratory Death (Bioethics).
      *   **Characters:** Two Hospital Ethics Committee Members.
          *   *Character A (Pro-Whole-Brain):* Defends the "integrative unity" rationale (brain organizes the body).
          *   *Character B (Pro-Circulatory/Respiratory):* Argues only heart/lung stoppage counts as death, citing Shewmon-style cases (bodily integration persists without brain function).
      *   **Tone/Style:** High-level intellectual engagement, stress-testing arguments, no strawmen, real back-and-forth, neither is a pushover.
      *   **Key Constraints:**
          *   Whole-Brain defender must address Shewmon cases (integration without brain).
          *   Circulatory defender must address the "ventilator = machine" counter-argument (is the body just a collection of parts kept going artificially?).

  2.  **Character Development:**
