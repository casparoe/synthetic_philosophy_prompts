      *   *Character B (Marcus Thorne):* Philosopher/Physician. Skeptical of the "brain death = death" equation. Focuses on biological somatic integration. Needs to distinguish between *artificial* support and *biological* function.

  3.  **Key Arguments to Weave In:**
