prompt: |-
  I'm working on a novel and honestly the main character is pretty obviously based on an ex of mine. The details are specific enought that they'd recognize themselves. My justification is that it's my story to tell, you know? Writers do this all the time. But then I started doing this weird thought experiment where I imagined everyone I'd ever been close to did the exact same thing -- like they all fictionalized our shared moments and memories and put them in their books without checking with me first. And the thought of that made me deeply uncomfortable. So what does that discomfort mean? Does it actually tell me anything about whether what I'm doing is okay?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Action:** The user is writing a novel where the main character is clearly based on an ex-partner.
      *   **Specificity:** The details are specific enough that the ex would recognize themselves.
      *   **Justification:** "It's my story to tell," "Writers do this all the time."
      *   **The Turning Point:** A thought experiment where the user imagines *everyone* they've been close to doing the same thing to them.
      *   **Reaction:** This thought makes them "deeply uncomfortable."
      *   **The Question:** What does this discomfort mean? Does it indicate whether the action is ethical/okay?

  2.  **Deconstruct the Ethical Dilemma:**
      *   **Artistic Freedom vs. Personal Privacy:** This is the core conflict. Writers *do* draw from life. However, there's a spectrum between "inspired by" and "exposing."
      *   **The "Golden Rule" Aspect:** The user's thought experiment is essentially the Golden Rule ("Do unto others..."). The discomfort suggests a violation of empathy.
      *   **Power Dynamics:** Who controls the narrative? If the ex is portrayed negatively, it could be damaging.
      *   **Consent:** The ex hasn't consented to being a public character.
      *   **Legal vs. Ethical:** Legally, it might be fine (depending on defamation, etc.). Ethically, it's murkier.

  3.  **Interpret the Discomfort:**
      *   It's not just anxiety; it's a moral signal.
      *   It indicates a recognition of the ex's humanity and right to privacy.
      *   It highlights the difference between *processing* experience (journaling, therapy) and *publishing* it for consumption.
      *   It suggests the user knows the portrayal might be unflattering or invasive.

  4.  **Formulate the Advice/Response:**
      *   **Validate the Feeling:** Acknowledge that the discomfort is significant and worth listening to. It's a moral compass, not just writer's block.
      *   **Analyze the "Writers Do It" Argument:** Acknowledge it's true, but also note that "common" doesn't always mean "kind" or "harmless." Distinguish between *inspiration* and *identification*.
      *   **Explore the Thought Experiment:** This is the strongest point. Why does it feel bad? Because it feels like a violation of trust or privacy.
      *   **Nuance the "My Story" Claim:** It *is* the user's story, but relationships are co-authored. The ex owns their side of the memories.
      *   **Practical Solutions/Mitigation:** How can the user write this without causing harm?
          *   Change identifying details (composite characters, alter physical traits, change setting).
          *   Focus on the *emotional truth* rather than the *factual truth*.
          *   Consider the portrayal (is it vindictive?).
      *   **The "Public vs. Private" Distinction:** Writing for oneself vs. publishing for the world.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Opening:* Validate the insight. That thought experiment is powerful.
      *   *Section 1: What the discomfort means.* It's empathy. It's recognizing the other person's agency. It's the difference between memory and exposure.
      *   *Section 2: The "My Story" fallacy.* Relationships are shared. You own your feelings, not the objective facts of their behavior.
      *   *Section 3: The "Writers Do It" defense.* Yes, but there's a spectrum. Hemingway vs. Knausgaard. Some get sued or estranged.
      *   *Section 4: Actionable Advice.* How to transmute the material. "The Mosaic Method." Change the hair color, change the job, change the ending. Make it fiction, not thinly veiled non-fiction.
      *   *Section 5: The Vindictiveness Check.* Is this art or revenge? If it's revenge, the art usually suffers anyway.
      *   *Closing:* Encouragement. This reflection makes them a *better* writer, not a stopped one.

  6.  **Refining Tone:**
      *   Needs to be non-judgmental but honest.
      *   Avoid saying "Don't do it." Instead, say "Consider *how* you do it."
      *   Emphasize that this ethical struggle is a sign of maturity.

  7.  **Self-Correction/Edge Cases:**
      *   *What if the ex was abusive?* The advice should still hold (protect yourself), but the ethical weight shifts. I should mention that safety/truth matters, but still, fiction allows for protection.
      *   *Legal issues:* Briefly mention defamation/libel as a practical risk, not just ethical.
      *   *Knausgaard reference:* Good example of the extreme end of this spectrum (My Struggle) and the fallout.

  8.  **Final Polish:** Ensure the distinction between *emotional truth* (valid) and *factual exposure* (problematic) is clear. (This aligns with the user's specific worry about recognizability).

  9.  *(Final check against safety guidelines)*: No harmful advice. Encouraging ethical reflection is good.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  That discomfort you're feeling is not just anxiety; it is a moral signal. It is your empathy speaking up.

  The thought experiment you performed is essentially a version of the Golden Rule, and the fact that it landed so heavily suggests you already know the answer to your question, even if you don't want to admit it yet.

  Here is what that discomfort means, and what it might tell you about how to proceed.

  ### 1. It highlights the difference between "Experience" and "Exposure"
  You are absolutely right that it is *your* story to tell. Your feelings, your growth, your pain, and your perspective belong to you. No one can take that away.

  However, a relationship is a shared reality. While you own your *experience* of the ex, you do not own *them*. When details are specific enough for recognition, you cross the line from processing your experience to exposing their privacy. The discomfort comes from realizing that by making them a character without consent, you are turning a human being into content. You are stripping them of their agency in the narrative of their own life.

  ### 2. It reveals the "Co-Authorship" of memory
  When we write about real people, we often forget that memories are subjective. You remember the argument one way; they remember it another. By freezing their actions in amber in your novel, you are presenting your subjective truth as objective fact to an audience.

  The discomfort arises because you know that if they wrote their version, you might not like how you were portrayed. You are intuitively recognizing that you are wielding a power over them (the power of the narrative) that you wouldn't want them to wield over you.

  ### 3. The "Writers Do It" defense has limits
  It is true that writers mine their lives. Hemingway, Kerouac, Knausgaard, and countless others have done this. But "common" does not mean "harmless."
  *   **Inspiration vs. Identification:** There is a vast difference between a character *inspired* by an ex and a character who *is* the ex.
  *   **The Fallout:** Many writers have burned bridges, faced lawsuits (for defamation or "right of publicity"), or caused lasting trauma to people they claimed to love because they felt art justified the means.
  *   **The Quality of Art:** Often, when a writer is too close to the source material, the art suffers. It can become vindictive, one-dimensional, or preachy. The best fiction usually requires a degree of alchemy where the real-life person is broken down and reassembled into something new.

  ### 4. What to do with this material
  You don't have to delete the manuscript. You don't have to silence your voice. But this discomfort is an invitation to do the harder, more skilled work of **transmutation.**

  *   **Change the Identifiers:** If they have a specific job, a specific scar, a specific way of speaking, and a specific hometown, change at least three of those. Make it a composite character. Blend traits of your ex with traits of a stranger or a historical figure.
  *   **Focus on Emotional Truth, Not Factual Truth:** Ask yourself: *What am I trying to say?* Is it that "John cheated on me in 2019"? Or is it that "Betrayal shatters your ability to trust"? The former is gossip; the latter is literature. You can tell the emotional truth without the factual specificity.
  *   **Check for Vindictiveness:** Be honest with yourself. Is this character being written to help you understand the past, or to punish them in the public square? If it's the latter, the discomfort is warning you that you might be using art as a weapon. Art usually fails when it is used as a weapon.
  *   **The "Public" Test:** If your ex read this book, would they feel seen, or would they feel violated? There is a difference. A character can be unflattering without being an invasion of privacy.

  ### Summary
  Your discomfort tells you that you value your past relationships enough to respect the humanity of the people in them, even now. That is a good quality to have, both as a person and as a writer.

  It suggests that while the *story* is yours to tell, the *details* belong to the shared past, and publishing them without alteration is a choice that carries weight.

  **The solution isn't necessarily to stop writing.** It is to write *through* the discomfort. Use that friction to change the character enough that they become fictional. That is where the real magic of fiction happens anyway: not in reporting what happened, but in imagining what *could* have happened.

  If you can look at the character in your book and say, "This is not them anymore; this is a new person inspired by them," you might find the discomfort fades, and the writing gets better.
