answer: |-
  You have identified the central tension in the accuracy-first literature with remarkable precision. Your intuition is correct: the "Measure Sensitivity" or "Arbitrariness" objection is widely regarded as the most significant challenge to the claim that accuracy arguments provide a *purely* epistemic, non-pragmatic vindication of probabilism.

  However, to ensure your seminar paper is as precise and fair as possible, you need to navigate a few nuances regarding the historical development of the argument, the specific nature of Maher's objection, and the subsequent technical responses (specifically the generalization theorems).

  Here is a breakdown of how to frame this objection in the context of the current literature.

  ### 1. Your Diagnosis is Correct (with a caveat on Joyce 1998)
  You are right that in Joyce's 1998 paper ("A Nonpragmatic Vindication of Probabilism"), the heavy lifting is done by the Brier score (quadratic loss). Joyce proves that relative to the Brier score, incoherent credences are accuracy-dominated.

  **The Caveat:** Joyce was aware of this limitation. In the 1998 paper, he explicitly conjectures that the result holds for any "legitimate" measure of inaccuracy, where legitimacy is defined by structural constraints (like *Truth-Directedness*: if $c$ is closer to the truth values than $c^*$, $c$ should be deemed more accurate). He used Brier primarily for tractability and illustration.

  **The Maher Objection:** Patrick Maher (2002, "Bayesian Probabilities") did indeed press the point you raised. Maher argued that Joyce fails to provide a non-pragmatic justification for why epistemic utility *must* be measured by a proper scoring rule (like Brier). Maher's worry is that if the choice of scoring rule is underdetermined by the concept of accuracy alone, then the normativity of the resulting probabilism is also underdetermined. If we choose Brier because it makes the math work to get Probabilism, the argument is circular. If we choose it for pragmatic reasons (e.g., it aligns with betting), the "non-pragmatic" claim collapses.

  ### 2. The Dialectic Has Moved: The Generalization Theorems
  If you are critiquing the *current* accuracy-first program (rather than doing a historical exegesis of Joyce 1998 specifically), you must address the **Leitgeb & Pettigrew (2010)** result.

  In "An Objective Justification of Bayesianism I: Measuring Inaccuracy," they proved a generalization theorem. They showed that Joyce's dominance result holds not just for the Brier score, but for **any continuous, strictly proper scoring rule**.

  *   **Why this matters for your paper:** It blunts the force of the "Why Brier?" objection. The accuracy-firster can say: "It doesn't matter if we use Brier, Log, or Spherical. As long as the scoring rule is *strictly proper* (i.e., it expects itself to be most accurate when credences match probabilities), the dominance argument goes through."
  *   **The Residual Worry (Your entry point):** This shifts the arbitrariness worry from "Why Brier?" to "**Why Strictly Proper?**"
      *   There are scoring rules that seem to capture "closeness to truth" intuitively but are not strictly proper.
      *   More importantly, what justifies the constraint of *propriety* itself without smuggling in pragmatic considerations? A scoring rule is proper precisely because it incentivizes an agent to report their true credences. But "incentivize" sounds pragmatic. To maintain the non-pragmatic line, one must argue that propriety is a requirement of *epistemic* rationality (e.g., that epistemic utility *just is* the kind of thing that is maximized in expectation by the truth). This is a substantive metaphysical claim about epistemic value, not a neutral conceptual truth.

  ### 3. The "Non-Pragmatic" Claim and Bridge Principles
  Your insight that the assumption is merely "relocated" is the strongest philosophical point you can make.

  *   **Dutch Book:** Relies on a bridge principle linking Credence $\to$ Betting Dispositions $\to$ Sure Loss.
  *   **Accuracy:** Relies on a bridge principle linking Credence $\to$ Epistemic Utility Function $\to$ Dominance.

  Critics (like Hedden 2015, or Levinstein 2012) argue that the choice of a *proper* scoring rule is often motivated by the desire to avoid Dutch Books or to ensure calibration, which are pragmatic or frequency-based virtues. If the justification for using a proper scoring rule relies on the fact that it *leads* to good pragmatic outcomes or avoids inconsistency, the argument is no longer purely epistemic.

  To defend the non-pragmatic status, accuracy-firsters (like Pettigrew in his 2016 book *Accuracy and the Laws of Credence*) argue for **Epistemic Utility Norms** (e.g., *Probabilistic Admissibility*). They argue that we should choose scoring rules based on whether they treat truth and falsity in a way that respects the logical structure of propositions (e.g., Extensionality, Normality).

  **Your Counter:** You can argue that these structural constraints (Extensionality, etc.) are not as neutral as they appear. For example, **Additivity** (the inaccuracy of a credence function is the sum of the inaccuracies of individual credences) is often assumed to get the math to work. But why should epistemic badness be additive? If I am wrong about $P$ and wrong about $\neg P$, is that exactly twice as bad as being wrong about $P$? This looks like a substantive, contestable assumption comparable to the Dutch Book bridge principle.

  ### 4. Recommendations for Your Paper
  To make your paper stand out in a PhD seminar, consider structuring your argument around these three distinctions:

  1.  **Distinguish Joyce (1998) from the Program:** Acknowledge that while Joyce (1998) relied heavily on Brier, the modern program relies on the class of Proper Scoring Rules. Concede that the "Why Brier?" objection is technically solved, but argue that the "Why Proper?" objection remains.
  2.  **Focus on the Normative Status of Scoring Rules:** The core of your paper should ask: *What justifies the choice of the scoring rule?*
      *   If the justification is "it captures truth-likeness," ask for a defense that doesn't presuppose probabilism.
      *   If the justification is "it's the only way to get the dominance result," charge circularity.
      *   If the justification is "proper rules are the only ones that don't incentivize lying," charge that this is pragmatic.
  3.  **Compare the "Cost" of Assumptions:** Your most novel contribution could be a comparative analysis. Even if the Accuracy argument *does* rely on a background assumption (the choice of scoring rule constraints), is that assumption *more* or *less* contestable than the Dutch Book bridge principle?
      *   *Dutch Book:* Links belief to action (controversial for purely epistemic norms).
      *   *Accuracy:* Links belief to a specific metric of distance from truth (controversial because "distance from truth" is not uniquely defined).
      *   *Thesis:* You might argue that the Accuracy assumption is *more* insidious because it disguises a normative choice as a mathematical definition of "accuracy."

  ### Key References to Cite
  *   **Maher, P. (2002).** "Bayesian Probabilities." (The classic statement of the objection).
  *   **Leitgeb, H., & Pettigrew, R. (2010).** "An Objective Justification of Bayesianism I: Measuring Inaccuracy." (The generalization theorem).
  *   **Pettigrew, R. (2016).** *Accuracy and the Laws of Credence.* (The book-length defense; see Chapter 3 on scoring rules).
  *   **Hedden, B. (2015).** "A Defense of Objectivism about Evidential Support." (Discusses the normative status of accuracy measures).
  *   **Levinstein, B. (2012).** "Leitgeb and Pettigrew on Accuracy and Updating." (Critiques the assumptions behind the scoring rules).
  *   **Oddie, G. (2019).** "What Lies Between the Truth and Falsehood?" (Discusses the uniqueness of scoring rules).

  ### Summary
  You are absolutely on the right track. The "non-pragmatic" advantage is threatened if the choice of scoring rule is not uniquely determined by the concept of accuracy itself. The literature has responded by widening the class of acceptable rules (from Brier to all Proper rules), but this merely pushes the justificatory burden back to the constraints on propriety and additivity. If those constraints cannot be justified without pragmatic considerations or circularity, your suspicion that the assumption has merely been "relocated" is well-founded.

  This is a very viable topic for a seminar paper. If you can precisely articulate *why* the constraints on scoring rules (like propriety or additivity) are not epistemically neutral, you will have a strong critique.
