  The student understands the mechanical logic of the Frege-Geach problem perfectly (the "embedding" issue and the equivocation charge). However, they lose points on precision for conflating Frege-Geach with Hume's Is-Ought problem and for phrasing that suggests moral logic is broken, rather than expressivism being inadequate to explain moral logic. This is exactly the kind of "confident but subtly wrong" detail you warned about.

