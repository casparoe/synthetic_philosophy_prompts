      *   *Is the essay "Lebensweisheit"?* Yes, often translated as "On the Meaning of Life" or "Wisdom of Life."
      *   *Timing:* The essay was 1927. *General Theory of Knowledge* was earlier. The Vienna Circle formed mid-20s. So this is peak Positivism era.
      *   *Nuance:* Schlick distinguishes between the *theory* of knowledge (strict verification) and the *practice* of living (psychological facts about joy).

