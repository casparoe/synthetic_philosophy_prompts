answer: |-
  **Setting:** *A dimly lit seminar room, 9:30 PM. Empty coffee cups litter the table. The whiteboard is covered in diagrams of facts, relations, and arrows that have been aggressively erased and redrawn. ELIAS (Primitivist) is leaning back, rubbing his temples. MARA (Fregean) is still standing at the board, marker in hand.*

  **Mara:** Look, the regress only happens if you treat the relation as just another object in the chain. If $R$ relates $a$ and $b$, and you ask "what relates $R$ to $a$?", you're treating $R$ like a third relatum. But the predicate isn't an object. It's unsaturated. It has a gap. When $a$ sits in the gap, there's nothing *left over* to relate them. The fitting *is* the unity.

  **Elias:** (Sighs) "The fitting is the unity." Mara, that sounds poetic, but metaphysically, it's suspicious. You're saying the concept $F$ has a special hook on it, and object $a$ has a special eyelet. But tell me: what ensures the hook goes into the eyelet?

  **Mara:** Nothing ensures it. That's the point. It's not a mechanical connection. It's a logical category. You can't ask what connects the number 2 to the concept "even." It just falls under it.

  **Elias:** But we aren't talking about numbers falling under concepts in the abstract. We're talking about a proposition being true. "Socrates is mortal." If "is mortal" is unsaturated, and "Socrates" is the saturation... isn't "saturation" just the copula in a cheap tuxedo? You've renamed the relation to hide the regress.

  **Mara:** It's not a rename. A relation is a constituent. Saturation is a *mode* of composition. If I build a house, the bricks are constituents. The "being built into a wall" isn't another brick. It's how the bricks are arranged.

  **Elias:** Okay, analogy time. If I have a brick and I have a spot in a wall, what makes the brick *be in* the spot? If you say "nothing, it just fits," you're begging the question. In the proposition, if the concept is essentially gappy, and the object is essentially fillable, you still need a fact of the matter that *this* object is filling *that* gap. Is that fact brute?

  **Mara:** Yes! The existence of the thought is the brute fact. But it's not a *mysterious* brute fact. It's structured. Your view... Elias, your view is that we just slap "Socrates" and "Mortality" together and say "Unity!" like a magic spell. Isn't "brute unity" just a polite name for giving up?

  **Elias:** (Leans forward) No. It's an honest admission of the limit of analysis. I'm saying you can't analyze unity into constituents plus a tie, because the tie always needs a tie. I stop at one primitive: the fact itself. You claim to stop the regress earlier, but I think you're smuggling the tie inside the concept.

  **Mara:** I'm not smuggling anything. I'm distinguishing categories. You're treating logic like Lego. You think everything has to be a block that connects to another block via a stud. I'm saying the predicate isn't a block. It's the *space* for the block.

  **Elias:** But the space doesn't grab the block! If "unsaturatedness" is a property of the concept, then we have Concept $F$, Property $P$ (unsaturatedness), and Object $a$. Now we need a relation between $F$ and $P$, and a relation between $P$ and $a$. You haven't stopped Bradley's Regress; you've just pushed it inside the predicate. Why isn't saturation just another relation in disguise that would need its own further relation to tie it to the concept and the object?

  **Mara:** Because saturation isn't a *thing* that sits between them. It's the completion of the sense. Look, if you go the brute fact route, how do you distinguish a proposition from a mere list? "Socrates, Mortality." That's two constituents. "Socrates is Mortal." That's two constituents plus unity. If unity is just a brute tag you slap on the list, what stops me from slapping it on "Socrates, Napoleon"?

  **Elias:** The nature of the constituents themselves! Socrates can't unite with Napoleon to form a atomic fact of that sort. But I don't need a *relation* to do the work. The fact is a fundamental ontological category. It's not a list + glue. It's a single substance, logically speaking.

  **Mara:** So the fact is simple? No parts?

  **Elias:** Not simple, but the unity is internal to the fact, not external. It doesn't come from the outside.

  **Mara:** That's mysticism, Elias. "Internal unity." You're saying the parts hold hands by virtue of... being parts? That's circular. At least my view explains *why* they hold hands. The predicate *demands* completion. It reaches out.

  **Elias:** "Reaches out." Now you're animating the concept. You've turned predicates into little octopuses. If the predicate "reaches out," that reaching is an activity. Is the activity distinct from the predicate? If yes, regress. If no, then the predicate *is* the reaching. But a predicate sitting in a sentence isn't reaching anything until it's asserted.

  **Mara:** We're talking about the proposition, not the sentence token. The *thought*. The thought has a structure where one part is essentially incomplete.

  **Elias:** And I'm asking: incomplete relative to what? If it's incomplete relative to an object, you've established a correlation. A correlation is a relation. If you deny it's a relation, you're saying the object and the concept are literally one thing. But they aren't. Socrates isn't Mortality. So there is a distinction. And where there is a distinction, there must be something accounting for the togetherness. If you say "nothing accounts for it," you're with me! You're a primitivist!

  **Mara:** (Puts the marker down, frustrated) I'm not a primitivist about unity. I'm a structuralist. The structure *is* the explanation. You want to know what grounds the structure? Nothing. It's sui generis.

  **Elias:** "Sui generis." There it is. That's just Latin for "brute."

  **Mara:** No! "Brute" implies you looked for an explanation and found a wall. "Sui generis" means you asked the wrong kind of question. You're asking for a cause of a logical relation. That's a category mistake. It's like asking "What color is the number 7?"

  **Elias:** It's not a category mistake to ask how a proposition differs from a set. A set has members but no unity. A proposition has constituents and unity. If you say the difference is "unsaturatedness," I need to know what metaphysical work that term is doing. If it's doing work, it's a relation. If it's not doing work, it's a metaphor.

  **Mara:** It's doing the work of blocking the regress! If I admit saturation is a relation, I lose. So I deny it's a relation.

  **Elias:** And if I admit unity is analyzable, I lose. So I deny it's analyzable. We're in the same boat, Mara. You just painted your side of the boat blue and called it "Logical Form."

  **Mara:** (Pauses, sits down) If we're in the same boat, then my view is better. Because "brute unity" makes truth inexplicable. If the unity is unanalyzable, how do we ever know *which* objects unite with *which* concepts? It becomes an intuition.

  **Elias:** And if your unity relies on "gappiness," how do we analyze the gap without invoking a connector? You say I'm giving up. I say I'm clearing the rubble. You're trying to build a bridge out of mist. At least I admit the river can't be crossed.

  **Mara:** So we just sit here?

  **Elias:** (Looks at the whiteboard) We sit here. Because either unity is a relation, and Bradley wins... or unity is primitive, and analysis dies.

  **Mara:** Or... unsaturatedness is a real category, and you're refusing to see it because it doesn't fit your ontology of "things."

  **Elias:** And you're refusing to see that your "category" is just a relation that's forgotten its own name.

  *(Silence stretches between them. Mara stares at the diagram of the "gap." Elias stares at the word "BRUTE" circled in the corner.)*

  **Mara:** ...Does the gap have a shape?

  **Elias:** (Groans) Don't start.

  **Mara:** If the gap has a shape, it matches the object. Matching is a relation.

  **Elias:** (Smiles faintly) Finally. We agree on something.

  **Mara:** Shut up. Pass the coffee.
