answer: |-
  Here are nine interview questions designed to progressively tighten the focus on the practical implications of your guest's view, making the "future research" retreat increasingly difficult to sustain.

  **1. The Foundation of the Duty**
  "You argue that we have a *prima facie* duty to intervene in nature to reduce suffering, challenging the traditional laissez-faire intuition. But moral duties usually imply capability. If the scale of wild suffering is as vast as you say, but our current ability to alleviate it without causing ecological collapse is minimal, does the duty actually exist *now*, or does it only come into existence once the technology catches up?"

  **2. The Scope Problem (Invertebrates)**
  "Your work often focuses on vertebrates, yet invertebrates outnumber them by orders of magnitude. Many invertebrates are r-selected, meaning they hatch in the hundreds or thousands, only for the vast majority to die within days, often painfully. If your duty is grounded in the reduction of suffering rather than the protection of 'charismatic' species, why does the circle of moral concern seem to stop at the vertebrate line? Doesn't a consistent application of your view demand we prioritize insects over mammals?"
  *   **Likely Evasion:** He will likely argue that invertebrate sentience is too uncertain to warrant intervention.
  *   **Follow-up:** "If we apply an expected value calculation—even if there's only a 10% chance insects are sentient, their sheer numbers dwarf vertebrate suffering. By delaying intervention in the invertebrate realm due to uncertainty, aren't you effectively betting against the possibility of massive suffering? At what probability of sentience does the 'future research' defense become morally negligent?"

  **3. The Tractability Problem (Ecological Risk)**
  "History is littered with well-intentioned ecological interventions that backfired catastrophically, from cane toads in Australia to myxomatosis in rabbits. Ecosystems are complex adaptive systems. If we intervene to reduce suffering for one species but inadvertently collapse a food web that causes more suffering overall, we have failed our moral duty. Given this track record, isn't the precautionary principle a stronger moral guide than the duty to intervene?"
  *   **Likely Evasion:** He will likely contend that these were not *welfare-focused* interventions and that "welfare biology" will provide the necessary knowledge to act safely in the future.
  *   **Follow-up:** "But that pushes the solution entirely into the future. If the burden of proof lies on the intervener to show they won't make things worse, and we currently lack the models to guarantee that, doesn't the duty to intervene dissolve into a duty to study? And if it's just a duty to study, how is that different from the status quo you're criticizing?"

  **4. The Non-Existence Implication**
  "Let's follow the logic to its edge. For many r-selected species, the aggregate suffering of the offspring that die young seems to vastly outweigh the pleasure experienced by the few survivors. If we have a duty to reduce suffering, and we cannot easily support the survivors, does your view imply that, in some cases, it would be morally better for certain wild populations not to exist at all? Is humane extinction sometimes the most ethical form of conservation?"
  *   **Likely Evasion:** He will likely resist this, arguing that life is generally worth living or that extinction causes other harms.
  *   **Follow-up:** "If you claim life is generally worth living, that is an empirical claim about the balance of pleasure and pain in the wild. What specific empirical finding would convince you that, for a specific species, non-existence is preferable? If no finding could convince you, are you privileging existence over welfare, which contradicts your core premise?"

  **5. The Predator Question**
  "You've mentioned immunocontraception for prey, but predation is a primary source of suffering. To significantly reduce suffering, we wouldn't just need to manage prey populations; we would eventually need to manage predator numbers, perhaps even phase out carnivory. Are you prepared to defend a long-term goal of reducing predator populations, and if so, how do you reconcile that with the intrinsic value people place on apex predators?"

  **6. Low-Hanging Fruit**
  "You often defer the radical implications to 'future research.' But we already have safe, tractable technologies, like oral vaccines for diseases like tuberculosis or distemper in wild populations. These reduce suffering and don't require ecosystem restructuring. If you truly believe there is a *prima facie* duty to act, why isn't your primary focus advocating for the immediate, widespread deployment of these existing tools rather than theoretical frameworks?"

  **7. Resource Allocation**
  "If wild animal suffering is as severe and widespread as you argue, it arguably dwarfs human suffering in terms of total sentient hours. Consistency suggests that effective altruists should be prioritizing wild animal welfare over global poverty or AI safety. Why should a donor give to human charities when the marginal dollar might save more sentient beings from starvation in the wild? Is your view compatible with prioritizing human causes?"

  **8. The "Ideal Theory" Defense**
  "I want to press on the 'future research' retreat directly. In political philosophy, we distinguish between 'ideal theory' (how things should be) and 'non-ideal theory' (what we do now). If your view remains in the realm of ideal theory indefinitely, it risks becoming a conversation piece rather than a moral guide. At what point does deferring action become a form of complicity in the suffering you claim to oppose? Is there a timeline where, if no tractable interventions are found, you would admit the duty is void?"

  **9. Falsifiability and Abandonment**
  "Finally, I want to ask about the exit condition for this research program. Science advances by falsification. What specific empirical discovery or philosophical argument would make you abandon the view that we have a duty to intervene in nature? Is there any state of the world where you would conclude that nature should be left entirely alone?"
