answer: |-
  **Setting:** *A university common room, late afternoon. The seminar on the metaphysics of propositions has just concluded. ELENA, a defender of the Fregean orthodoxy, is pouring coffee. MARCUS, a metaphysical realist with nominalist leanings, leans against the whiteboard, still holding his marker.*

  **Elena:** You looked unconvinced during the wrap-up, Marcus. Bradley's Regress is a monster, surely you agree? If every tie requires a further tie to connect it to the relata, we never arrive at a proposition, only an infinite list of constituents. Frege's unsaturatedness is the only way to cut the knot.

  **Marcus:** I agree the monster needs slaying, Elena. I just don't think Frege slayed it. He buried it under a pile of terminology. He tells us that in "Socrates is wise," *Socrates* is saturated, an object, while *is wise* is unsaturated, a concept. The concept has a "gap" that the object fills. This supposedly secures unity because the concept *demands* completion. But I suspect this is just relabeling the mystery of "instantiation" as "unsaturatedness."

  **Elena:** It's not a relabeling; it's a category distinction. If you treat the concept as just another object, you get Bradley. You have Socrates, Wisdom, and a copula. Then you need a relation to bind Wisdom to Socrates, and another to bind that relation to the pair. But if the concept is essentially unsaturated, it doesn't need a further relation to bind it to the object. Its very nature is to combine. It's not that there is a glue; it's that the concept is the *need* for glue, and the object is the *satisfaction* of that need.

  **Marcus:** That sounds poetic, but let's press on the coherence of the distinction itself. Here is my first worry, and it's Frege's own headache: The Concept Horse paradox. You want to tell me that concepts are essentially unsaturated. But if I want to discuss your theory, I have to say, "The concept *horse* is unsaturated."

  **Elena:** Go on.

  **Marcus:** In that sentence, "The concept *horse*" is the grammatical subject. It refers to an object. By Frege's own lights, anything that can be referred to by a singular term is an object. So, the moment you try to state your theory, you turn the unsaturated concept into a saturated object. If you can't talk about unsaturated concepts without objectifying them, how do we know the distinction isn't just a feature of grammar rather than metaphysics? Maybe "unsaturated" just means "grammatically predicative," not "ontologically incomplete."

  **Elena:** That is a serious constraint, I grant you. Frege himself admitted we cannot strictly *say* what we mean about concepts without betraying them. But the inability to name something doesn't entail its non-existence. Think of it this way: When I judge "Socrates is wise," I am not manipulating two objects. I am performing an act of predication. The linguistic expression forces me to use a noun phrase to talk *about* the concept, yes, but the *thought* itself preserves the asymmetry.

  **Marcus:** But if the thought preserves the asymmetry, how do you access it? If your metaphysics relies on a distinction that your language systematically obscures, you risk positing a ghost in the machine.

  **Elena:** It's not a ghost; it's a logical constraint. Look, suppose I deny the distinction. Then I must say that *Socrates* and *Wisdom* are both objects. To unite them, I need a relation, *Instantiation*. But *Instantiation* is also an object (by your refusal of unsaturatedness). So now I need *Instantiation* to relate *Instantiation* to *Socrates* and *Wisdom*. The regress is inevitable. The only way to stop it is to admit that one of these elements isn't an object waiting to be connected, but is itself the connecting principle. The "Concept Horse" problem is a linguistic inconvenience; Bradley's Regress is a metaphysical catastrophe. I'll take the inconvenience to avoid the catastrophe.

  **Marcus:** I'm not sure you've avoided it. You've just moved the catastrophe. This leads to my second objection, which is deeper. You claim that "saturation" stops the regress because it's not a further constituent. It's a primitive mode of combination. But why is *that* acceptable?

  **Elena:** Because it's not a *thing*.

  **Marcus:** Exactly. If you can posit a brute, unexplained "saturation" that binds object and concept without needing a further binder, why can't the relation theorist do the exact same thing? Why can't the realist about relations say: "Instantiation is a brute, unanalyzable tie. It doesn't need a further tie to connect it. It just *does* the connecting"?

  **Elena:** Because the relation theorist treats Instantiation as a *relatum*. Even if they say it's "brute," they treat it as a component *within* the complex. If it's a component, the question arises: how does this component hook onto the others? If you say "it just does," you are asserting a miracle. But Frege isn't asserting a miracle about a component. He is defining the *form* of the proposition. Saturation isn't a brick in the wall; it's the mortar's capacity to hold. No, it's worse than that analogy—it's the fact that the brick (the concept) is shaped to receive the other brick.

  **Marcus:** But if the concept is "shaped to receive," that shape is a property. And properties are universals. And we are back to relating universals to particulars. You say saturation isn't a constituent, but it has a job to do. It provides unity. If it provides unity, it's doing work. If it's doing work, it's part of the ontology. If it's part of the ontology, and you refuse to analyze how it works by calling it "unsaturated," you have simply declared a "stopping point" by fiat.

  **Elena:** It's not a fiat; it's a recognition of logical types. The relation theorist tries to make the connector the same *type* of thing as the connected. That is the category error. A hook cannot be the same kind of thing as the ring it hooks, or you need a hook for the hook. The unsaturated concept is not a "thing" that connects. It is a function. $F(x)$. The unity is the value of the function for the argument. There is no gap between the function and its value *when the argument is supplied*. The regress assumes there is always a gap. Frege shows the gap is an illusion created by treating functions as objects.

  **Marcus:** But $F(x)$ is a notation, Elena. It's a tool. In the world, or in the mind, what corresponds to $F$? If you say "nothing object-like," then what grounds the truth of the proposition? If "Socrates is wise" is true, there must be something in virtue of which it is true. Is it Socrates? No. Is it Wisdom? No. Is it the "saturation"? If you say yes, you've reified saturation. If you say no, you've lost the truthmaker.

  **Elena:** The truthmaker is the Fact. And the Fact is not a list. The Fact is the saturated concept. You are demanding I break down the Fact into components that exist *prior* to the Fact. I am saying the components are abstractions *from* the Fact. The unsaturatedness is the dependency of the concept on the object. That dependency is not a relation; it is ontological parasitism. A concept cannot exist un-exemplified in the way an object can exist un-predicated.

  **Marcus:** That's the crux, isn't it? You claim concepts are ontologically dependent. But that looks suspiciously like the very relation you're trying to avoid. "Dependence" is a relation. If the concept depends on the object, we need an account of that dependence. If you say "the dependence is internal," you're using words to hide the mechanism. The relation theorist says "Instantiation is external." You say "Saturation is internal." Both of you are positing a primitive binding force. You criticize him for regress, but you stop your own analysis at the exact same point, merely insisting your primitive is "unsaturated" while his is "saturated."

  **Elena:** The difference is that his primitive is a *third thing* alongside the relata. Mine is the *mode of being* of one of the relata. If I stop at saturation, I stop because there is nothing left to analyze. The function *is* the mapping. If you stop at Instantiation, you stop while still holding a thing in your hand and asking it to do a job.

  **Marcus:** But how do you know there is nothing left to analyze? Because Frege said so? It seems to me that "unsaturatedness" is a placeholder for "we don't know how predication works, but we know it isn't a relation." You've secured the unity of the proposition by making one of its ingredients essentially mysterious. You've saved the phenomenon of unity by sacrificing the intelligibility of the constituents.

  **Elena:** And you've saved the intelligibility of constituents by sacrificing the unity of the proposition. If everything is saturated, you have a heap, not a whole. I'd rather have a whole with a mysterious internal structure than a heap with a magical external glue.

  **Marcus:** But your "internal structure" is invisible. You can't point to it, you can't name it without destroying it, and you can't explain it without borrowing the language of relations. You ask me to accept a metaphysical asymmetry that vanishes under scrutiny.

  **Elena:** It doesn't vanish under scrutiny; it vanishes under *mis*-scrutiny. You are scrutinizing it with a tool designed for objects. You are trying to weigh a thought on a scale. The asymmetry is the condition of possibility for the scale to work at all.

  **Marcus:** Then we are at an impasse. You see a logical precondition; I see a grammatical fiction masquerading as ontology.

  **Elena:** And you see a metaphysical explanation; I see a regression into incoherence.

  **Marcus:** Precisely. You think you've blocked the regress. I think you've just built a wall at the edge of the map and labeled it "Unsaturated."

  **Elena:** *(Sips coffee)* Then let's see who falls off the edge first.

  **Marcus:** *(Smiles)* I'm not worried about falling. I'm worried about never leaving the ground.
