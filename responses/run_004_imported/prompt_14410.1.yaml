      *   **The Core Claim (Elena):** Start with why unsaturatedness solves Bradley's Regress. The regress arises because we treat the copula/concept as just another object needing a tie. Unsaturatedness means it *doesn't* need a tie; it's inherently connective.
      *   **Objection 1: The Concept Horse (Marcus):** Marcus brings up the paradox. If we say "The concept *horse* is unsaturated," we've made it a subject (an object). So how can we talk about it?
