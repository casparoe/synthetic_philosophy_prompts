      *   **Objection 2: The Brute Stopping Point (Marcus):** This is the heavier metaphysical blow. If "saturation" is a primitive, unanalyzable mode of combination, why couldn't a relation theorist say "instantiation" is primitive? If Frege stops the regress by fiat, so could the realist about relations.
