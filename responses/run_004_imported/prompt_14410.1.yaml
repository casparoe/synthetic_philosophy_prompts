      *   **Counter-Response (Marcus):** But if it's not a constituent, how does it do any work? If it's invisible, how does it bind? You're positing a "glue" that isn't a thing, which sounds mystical.
      *   **Conclusion:** They shouldn't agree. Elena should feel her distinction is fundamental to logic itself. Marcus should feel it's an obscurantist dodge. The tension remains between logical form and metaphysical explanation.

  4.  **Refining the Arguments (Self-Correction during drafting):**
