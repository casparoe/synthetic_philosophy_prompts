answer: |-
  **Rome, 1615. The private study of Cardinal Robert Bellarmine. Late evening.**

  **GALILEO GALILEI:** You write with a careful hand, Eminence. Every word in your letter to Father Foscarini is weighed, measured, and polished. But I confess, the conclusion leaves me in the dark. You say we may speak of the Earth's motion as a supposition. A trick of calculation. But you forbid us to speak of it as the nature of things *is*.

  **CARDINAL BELLARMINE:** (Pouring two cups of wine) Sit, Galileo. Please. The letter was not intended to darken your mind, but to preserve the peace of the Church. And to preserve you.

  **GALILEO:** (Taking the cup but not drinking) Peace is a noble aim. But truth is a nobler one. If the Earth moves, it moves. It does not move merely to save the appearances of a mathematician's table. When I look through the spyglass, I see the phases of Venus. I see the moons of Jupiter. These are not calculations. They are physical bodies behaving in a physical way.

  **BELLARMINE:** And no one denies your eyes, Galileo. You are the prince of observers. But there is a distinction you gloss over too easily. There is the *phenomena*—what we see in the sky—and there is the *cause*—why they move as they do. To say "assume the Sun is stationary to calculate the planetary positions" is one thing. To say "the Sun is stationary because Scripture is wrong" is another.

  **GALILEO:** But the calculation *is* the physics! The Copernican arrangement is the only one that makes sense of the order of the planets. In the Ptolemaic system, the lines of the orbits intersect, they tangle. In Copernicus, they nest like Russian dolls. It is elegant. It is simple.

  **BELLARMINE:** Elegant? Yes. Simple? Perhaps. But is it *necessary*? That is the threshold I set in the letter. I wrote: *"If there were a true demonstration that the sun is in the center... and that the sun does not go around the earth but the earth around the sun, then we should have to proceed with great circumspection in explaining passages of Scripture which appear to teach the contrary."*

  **GALILEO:** "If there were a true demonstration." You hold that phrase like a shield.

  **BELLARMINE:** It is not a shield, Galileo. It is a gate. I am not saying the gate is locked forever. I am saying you have not yet produced the key. You offer probabilities. You offer elegance. But Tycho Brahe's system explains your observations of Venus and Mars just as well, without requiring the Earth to hurtle through the void. If Brahe can save the phenomena with a stationary Earth, where is your *necessary* demonstration?

  **GALILEO:** (Leaning forward) Because Brahe's system is a monstrosity! It requires the spheres of Mars and the Sun to pass through one another. Physically impossible.

  **BELLARMINE:** Impossible by what physics? Aristotelian? That physics is already crumbling under your own hammer. You cannot tear down the old physics and then demand we accept the new one on faith. You must prove the Earth moves not just because it is convenient, but because it *cannot be otherwise*. Until then, to assert it as fact is to assert that thousands of years of holy men were blind to the literal meaning of the Word.

  **GALILEO:** And there we touch the nerve. The Scripture. You argue that Joshua commanded the Sun to stand still. If the Earth moves, the text is nonsense.

  **BELLARMINE:** If the Earth moves, the text requires reinterpretation. And the Church is willing to reinterpret. But not lightly. Not for a hypothesis.

  **GALILEO:** But we *have* reinterpreted! Lightly? Heavily? Does it matter? We have done it. Consider the "firmament." Genesis speaks of a solid dome, a vault holding back the waters above. The Fathers taught it as literal truth. Now? Every educated man knows the sky is not a solid bowl. We reinterpreted that.

  **BELLARMINE:** (Nods slowly) We did.

  **GALILEO:** The "pillars of the Earth." The Psalms say the world is founded on pillars, immovable. We no longer teach that the planet rests on stone columns. We accepted that "pillars" was metaphorical, accommodating the language of the time. If the Church could bend the literal word on the firmament and the pillars to accommodate natural knowledge, why does the Earth's motion break the camel's back?

  **BELLARMINE:** Because the firmament was a matter of common consensus, Galileo. There was no competing theory of the sky that threatened to overturn the consensus. When we reinterpreted the firmament, we were not betting the Church's authority on a disputed mathematical model. We were acknowledging that "dome" was phenomenological language—describing how it *looks*, not what it *is*.

  **GALILEO:** And is it not possible that "Sun rises and sets" is phenomenological language? Describing how it *looks* from the Earth?

  **BELLARMINE:** It is possible. *If* you prove the Earth moves. But you see the circle? You ask us to reinterpret Scripture based on a theory that might be overturned in fifty years.

  **GALILEO:** You doubt the evidence will hold?

  **BELLARMINE:** I doubt *anything* human will hold. Theories rise and fall. Philosophies change. If the Church binds itself to Copernicus today, and in a century astronomers prove him wrong—as they might, for your demonstration is not yet "necessary"—then the Faith becomes a laughingstock. We would have changed the Word of God for the opinion of men.

  **GALILEO:** So it is a wager. You are wagering that Copernicus might be wrong.

  **BELLARMINE:** I am wagering that the Church must remain the anchor, not the weather vane. If you can show me a proof that compels the intellect as surely as geometry compels a triangle's angles, I will stand with you. I will argue before the Pope himself that Scripture must be read allegorically on this point. I wrote that to Foscarini. I mean it.

  **GALILEO:** (Sighs, looking into his wine) But you define "proof" as logical necessity. Nature does not speak in syllogisms, Eminence. She speaks in effects. The tides. The sloshing of the seas. That is the Earth's motion made visible.

  **BELLARMINE:** The tides... you believe this is your smoking gun?

  **GALILEO:** I know it is.

  **BELLARMINE:** Then I pray you are right. For your sake, and for ours. But until the tides are as undeniable as the pillars are metaphorical, I cannot authorize what you ask. You want me to treat a physical theory as dogma before the physics is settled. I cannot do that. It is not stubbornness, Galileo. It is prudence.

  **GALILEO:** Prudence can be a vice, Cardinal. When it masks itself as piety. You speak of protecting the Church from ridicule. But is there not greater ridicule in telling a man he cannot trust the evidence of his senses and his reason? If the Holy Spirit gave us eyes to see the moons of Jupiter, and minds to calculate their orbits, did He intend for us to ignore what they tell us to protect a literal reading of a poetic verse?

  **BELLARMINE:** (Stands, walking to the window) The Holy Spirit gave us those things to know God, not to redefine Him. Look out there. Rome sleeps. They do not worry about the Tychonic system. They worry about their souls. If we confuse them, if we make the path to salvation dependent on understanding planetary orbits... we fail them.

  **GALILEO:** (Standing as well) And if we tell them that truth is dangerous? That to follow the evidence is to risk heresy? We fail them too.

  **BELLARMINE:** (Turns back) Then find the proof, Galileo. Not the proof that convinces you. You are already convinced. Find the proof that convinces a skeptic who holds the keys to the Kingdom. Until then... speak as a mathematician. Save the phenomena. Leave the physics to God.

  **GALILEO:** (Quietly) God wrote the universe in the language of mathematics, Eminence. I am only trying to read the text He wrote.

  **BELLARMINE:** Then pray you have not misread the syntax.

  *(Galileo bows, slightly stiffly. Bellarmine returns the nod. There is no anger between them, only the heavy weight of a collision that has not yet happened, but is inevitable.)*

  **GALILEO:** Goodnight, Cardinal.

  **BELLARMINE:** Goodnight, Galileo.

  *(Galileo exits. Bellarmine remains at the window, looking not at the stars, but at the dark streets below.)*
