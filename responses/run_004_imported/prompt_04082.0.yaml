  9.  *(Self-Correction during drafting)*: I should be careful not to conflate Augustine with later Casuists (like the Jesuits with Mental Reservation). Augustine is stricter. He doesn't like *intending* deception, but he tolerates *foreseeing* it if the words are true. I need to make sure I don't attribute "mental reservation" to him directly, but rather "truthful concealment."

  10. **Final Polish:** Ensure the distinction between *enuntiatio* (statement) and *voluntas fallendi* (will to deceive) is clear. Augustine forbids the false statement, even with good intent. He allows the true statement, even with deceptive intent (regarding the listener's belief), provided the statement itself holds. Wait, actually, Augustine says the *will to deceive* makes it a lie *if* the statement is false. If the statement is true, the will to deceive is less problematic for him, though still risky. Actually, in *De Mendacio*, he argues that speaking truth to create false belief is permissible *if* no false statement is made. I need to be precise there.

      *Correction:* Augustine defines a lie as a false signification with the will to deceive. If the signification is true, it's not a lie, even if the intent is to mislead the listener's *beliefs* about the world. The user's point is that this is semantic hair-splitting. I should validate that.

