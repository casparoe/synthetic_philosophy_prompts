answer: |-
  This is one of those beautiful, terrifying moments where type theory stops feeling like "programming with types" and starts feeling like "logic fighting itself." You are absolutely right to feel weirded out. Classically, AC and LEM feel like separate "nonconstructive" switches. Constructively, AC is actually a wolf in sheep's clothing: it's a Trojan Horse that smuggles LEM inside it.

  Here is the hands-on, "why does this trick work?" breakdown, followed by how HoTT slams the door shut.

  ### The Setup: The Two Sets Trap

  To understand Diaconescu's theorem, you have to see how it constructs a "logic detector" using sets.

  In constructive math, to prove $P \lor \neg P$ (LEM), you need an algorithm that outputs either a proof of $P$ or a proof of $\neg P$. Usually, for an arbitrary proposition $P$, we have no such algorithm.

  Diaconescu's trick is to define two sets, let's call them $U$ and $V$, inside the universe $\{0, 1\}$. Their definitions depend on $P$:

  1.  $U = \{ x \in \{0, 1\} \mid x = 0 \lor P \}$
  2.  $V = \{ x \in \{0, 1\} \mid x = 1 \lor P \}$

  **Why these sets?**
  Notice what happens depending on the truth of $P$:
  *   **If $P$ is True:** The condition "$\dots \lor P$" is always satisfied.
      *   $U$ becomes $\{0, 1\}$.
      *   $V$ becomes $\{0, 1\}$.
      *   Crucially: **$U$ and $V$ are the exact same set.**
  *   **If $P$ is False:** The condition "$\dots \lor P$" falls away.
      *   $U$ becomes $\{0\}$ (since $x=0$ is the only way in).
      *   $V$ becomes $\{1\}$ (since $x=1$ is the only way in).
      *   Crucially: **$U$ and $V$ are disjoint sets.**

  **The Innocent Premise:**
  Regardless of whether $P$ is true or false, both sets are *inhabited*.
  *   $0$ is always in $U$ (because $0=0$ is true).
  *   $1$ is always in $V$ (because $1=1$ is true).

  So, we have a collection of sets $\{U, V\}$, and we know for a fact that every set in this collection has at least one element. This is the perfect setup for the **Axiom of Choice**.

  ### The Mechanism: The Choice Function as a Detector

  The Axiom of Choice (AC) says: "If you have a collection of inhabited sets, there exists a **choice function** $f$ that picks exactly one element from each set."

  So, AC grants us a function $f$ such that:
  *   $f(U) \in U$
  *   $f(V) \in V$

  Here is where the brain-break happens. In classical math, we say "such a function exists" and move on. In constructive math (and type theory), **a function is a computation.** If $f$ exists, we can run it. We can ask: **Is $f(U) = f(V)$?**

  Since the codomain is $\{0, 1\}$, equality is decidable. We *can* check this.

  **Case 1: The outputs are equal ($f(U) = f(V)$)**
  If the function returns the same value for both inputs, say $k$, then $k \in U$ and $k \in V$.
  *   If $k=0$, then $0 \in V$. Looking at the definition of $V$, $0 \in V$ implies $(0=1 \lor P)$. Since $0 \neq 1$, **$P$ must be true.**
  *   If $k=1$, then $1 \in U$. Looking at the definition of $U$, $1 \in U$ implies $(1=0 \lor P)$. Since $1 \neq 0$, **$P$ must be true.**
  *   **Conclusion:** $f(U) = f(V) \implies P$.

  **Case 2: The outputs are different ($f(U) \neq f(V)$)**
  If the function returns different values, then $U$ and $V$ must have been different sets (otherwise an extensional function would return the same value for the same input).
  *   As we saw in the setup, $U$ and $V$ are only different if **$P$ is false.**
  *   **Conclusion:** $f(U) \neq f(V) \implies \neg P$.

  **The "Aha!"**
  Because we can decide equality on $\{0, 1\}$, we know that either $f(U) = f(V)$ or $f(U) \neq f(V)$.
  *   If the first, we have a proof of $P$.
  *   If the second, we have a proof of $\neg P$.
  *   Therefore, we have a proof of $P \lor \neg P$.

  **Why AC is the culprit:**
  You suspected AC "smuggles" LEM in. Precisely. AC asserts the existence of a function $f$ that operates on sets $U$ and $V$. But $U$ and $V$ are defined *in terms of $P$*.
  For a computational function $f$ to consistently pick elements from $U$ and $V$, it effectively has to "know" whether $U$ and $V$ are the same set or different sets.
  *   If they are the same ($P$ is true), $f$ must pick the same element.
  *   If they are different ($P$ is false), $f$ *can* pick different elements.

  By promising that such a function *exists*, AC implicitly promises that the distinction between "$U=V$" and "$U \neq V$" is resolvable. But that distinction *is* the truth value of $P$. So AC forces $P$ to be decidable.

  In constructive terms: **AC turns a "proof of existence" (these sets are inhabited) into "computable data" (here is the element picked).** To compute that data uniformly across $U$ and $V$, you need to resolve the proposition $P$ hidden in their definitions.

  ### How HoTT / Propositional Truncation Blocks This

  You mentioned Homotopy Type Theory (HoTT) and truncation. This is exactly where type theorists patch the hole.

  In standard MLTT (like Lean's kernel) or Set Theory, the existential quantifier $\exists x, A(x)$ is often treated in a way that allows you to extract the witness $x$ if you have AC.
  *   **Standard AC:** $(\forall x, \exists y, R(x,y)) \to (\exists f, \forall x, R(x, f(x)))$.
      *   Here, the $\exists$ in the premise allows you to pull out a $y$ to build $f$.

  In HoTT (and in constructive logics that want to avoid Diaconescu), we distinguish between:
  1.  **$\Sigma$-types (Data):** "Here is a $y$ and a proof it works." (Constructive existence)
  2.  **Propositional Truncation $\| \cdot \|$ (Proof):** "There exists a $y$, but I'm not telling you which one / you can't compute with it." (Mere existence)

  **The HoTT Axiom of Choice:**
  HoTT states AC carefully, usually something like:
  $$ (\forall x, \| \Sigma y, R(x,y) \|) \to \| \Sigma f, \forall x, R(x, f(x)) \| $$

  Notice the bars $\| \dots \|$.
  1.  **Premise:** For every $x$, there *merely* exists a $y$. You know it's inhabited, but the "witness" is hidden (truncated).
  2.  **Conclusion:** There *merely* exists a choice function $f$.

  **Why this kills Diaconescu:**
  To run the Diaconescu proof, we needed to **compute** with the choice function $f$. We needed to evaluate $f(U)$ and $f(V)$ and check if they were equal.
  *   If AC only gives you $\| \Sigma f, \dots \|$, you have a *proof* that a function exists, but you **do not have the function itself as data.**
  *   You cannot apply a truncated function to arguments. You can't ask "what is $f(U)$?" because $f$ is trapped inside the truncation bars.
  *   Without the ability to compute $f(U)$, you can't check the equality $f(U) = f(V)$, and the chain of logic breaks.

  **The Intuition:**
  Diaconescu works because AC lets you promote a "fact" (the set is inhabited) into a "machine" (the choice function).
  Propositional truncation keeps the "fact" as a "fact." It says: "Yes, you can prove a choice function exists, but you aren't allowed to open the box and use it to compute boolean values."

  ### Summary

  1.  **The Trick:** Diaconescu defines two sets that are identical if $P$ is true and disjoint if $P$ is false.
  2.  **The Lever:** AC guarantees a function that picks elements from these sets.
  3.  **The Squeeze:** Because the function must behave consistently on identical sets, observing the function's output reveals whether the sets were identical, which reveals whether $P$ is true.
  4.  **The Fix:** HoTT/Truncation prevents AC from giving you the *function* as computable data. It only gives you a *proof* that the function exists, which isn't enough to run the detector.

  It's a stunning result because it shows that in a constructive world, **choice is not just about picking socks; it's about information.** If you claim you can pick an element from any set without knowing how, you're implicitly claiming you have enough information to decide any proposition defining those sets.
