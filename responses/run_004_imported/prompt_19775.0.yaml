prompt: |-
  So I've been messing around with Lean 4 for fun lately (mostly falling down type theory rabbit holes instead of actually shipping anything, oops), and this weekend I hit something that genuinely broke my brain a bit. I always had this vague mental model where "intuitionistic logic" just means classical logic minus the law of excluded middle, and that stuff like the axiom of choice and excluded middle are both just flagged as "nonconstructive" and constructivists reject them as a package deal, with no real relationship between them otherwise. Then I stumbled on this result -- I think its called Diaconescu's theorem, or people also cite a Goodman and Myhill paper -- that says the full axiom of choice actually *implies* excluded middle once you're in a constructive setting. That really doesn't match my intuition, because classically AC obviously isn't "creating" LEM out of nothing (LEM is already just true there), so whatever the proof is doing, it must be exploiting the specific absence of LEM to smuggle it back in through choice.

  I tried reading through the actual proof (it involves picking elements out of two subsets of {0,1} that get defined using some arbitrary proposition P) and I could follow each individual step okay, but I don't have any real intuition for why the trick works or what it's actually telling us about the nature of choice as an axiom. Could you walk me through the core idea in a pretty hands-on, example-driven way, and explain what's special about choice specifically that lets it do this? I also vaguely remember someone mentioning in a forum thread that this is part of why homotopy type theory states the axiom of choice differently than naive set theory does (something about "propositional truncation"?) -- if that's actually relevant to dodging this result, I'd love a rough, even hand-wavy, sense of how restating choice that way blocks the argument. Not looking for a fully rigorous writeup, more the "aha, THAT's why" version.
