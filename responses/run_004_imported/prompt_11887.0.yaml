      *   *Q5: Anscombe & "Consequentialism" (Required).*
          *   *Idea:* Why did she make up that word?
          *   *Refinement:* She needed a target. It was a polemical move.
          *   *Predicted Answer:* She wanted to show that calculating outcomes corrupts morality.
          *   *Follow-up:* Did she create a strawman? Is anyone *really* a pure consequentialist?

      *   *Q6: Historical Context/Alternatives.*
