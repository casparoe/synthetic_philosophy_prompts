      *   *Truman Case:* The bomb was dropped *to* kill civilians (to break morale/will), not just as a side effect. Therefore, it's murder.
      *   *Opposing View:* Consequentialism/Utilitarianism (save more lives by ending war sooner).
      *   *Key Concepts:* Intention vs. Foresight, Absolutism vs. Exception, Moral Luck, Historical Context.

  3.  **Drafting the Questions (Iterative Process):**

