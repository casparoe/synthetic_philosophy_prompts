          *   One question on Michael Walzer's "Supreme Emergency."
          *   One question on the "tipping point" (would *any* death toll change his mind?).
          *   One question on Anscombe coining "consequentialism."
      *   **Tone:** Intellectual, probing, respectful but challenging (podcast interview style).

  2.  **Deconstruct the Guest's Position (Anscombian Absolutism):**
