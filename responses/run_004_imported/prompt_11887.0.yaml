answer: |-
  Here are 10 interview questions designed to move beyond a summary of the book and into a genuine dialectic. They are structured to anticipate the philosopher's likely defense (rooted in Anscombian deontology) and push back on the practical and theoretical implications.

  ### 1. The Label "Murderer"
  **Question:** Your book doesn't mince words: you argue Truman wasn't just mistaken or tragic, but that he committed murder. In historical analysis, that's an incredibly charged legal and moral category. Why is it important for us to use that specific word rather than "war crime" or "atrocity"?
  **Predicted Answer:** He'll likely argue that "war crime" implies a violation of a convention that can be waived, whereas "murder" describes the intrinsic nature of the act. He will say that softening the language softens the moral reality, and that Anscombe's point was precisely to shock us out of utilitarian complacency.
  **Follow-up:** But does that shock value come at a cost? If we label a leader who ended the bloodiest war in history a "murderer," do we risk making moral language so inflationary that it loses its grip on actual criminals?

  ### 2. The Doctrine of Double Effect
  **Question:** I want to dig into the Doctrine of Double Effect, which is central to Anscombe's framework. The standard defense of area bombing is that civilians are "foreseen" but not "intended" casualties of hitting military targets. You argue Hiroshima fails this test. Why?
  **Predicted Answer:** He will argue that the specific objective of the atomic bomb was *civilian morale*. Therefore, the death of civilians wasn't a side effect; it was the mechanism of success. If the civilians hadn't died, the objective wouldn't have been met. That makes their death intended, not merely foreseen.
  **Follow-up:** But isn't "breaking morale" a standard military objective in almost every war, from blockades to sanctions? If targeting morale makes it murder, does that not render the concept of "total war" inherently illegitimate, rather than just this specific instance?

  ### 3. Walzer's "Supreme Emergency"
  **Question:** Michael Walzer, in *Just and Unjust Wars*, offers a counter-argument: the "supreme emergency." He suggests that when a community faces the threat of utter annihilation or enslavement, leaders may be forced to dirty their hands to survive. Does the threat of a prolonged invasion of Japan, or Soviet expansion, qualify as a supreme emergency that overrides the prohibition on killing innocents?
  **Predicted Answer:** He will likely reject this. Anscombian absolutism holds that you cannot do evil that good may come of it. He'll argue that a "supreme emergency" exemption essentially destroys the rule, turning morality into a calculation of stakes rather than a constraint on action.
  **Follow-up:** So, if the choice is genuinely between "kill 100,000 innocents" or "allow a totalitarian regime to enslave millions," your position is that we must accept the enslavement? Is that a moral stance, or a form of moral purity that abandons the people actually suffering?

  ### 4. The Tipping Point (The Absolutism Test)
  **Question:** Let's push that absolutism to its limit. Is there *any* hypothetical death toll that would justify dropping the bomb? If Truman knew with certainty that not dropping the bomb would result in the extinction of the human race, would the calculus change?
  **Predicted Answer:** He should say no. For a strict deontologist, the numbers don't change the moral quality of the act. Killing an innocent is wrong whether it saves one life or a billion. He might argue that God (or fate) controls the outcomes, but we control our intentions.
  **Follow-up:** That implies a willingness to let the world burn rather than commit a moral transgression. At what point does adherence to moral rules become a kind of moral narcissism, where the leader's clean conscience matters more than the survival of their people?

  ### 5. Anscombe and "Consequentialism"
  **Question:** It's a historical fact that G.E.M. Anscombe essentially coined the term "consequentialism" in her 1958 paper *Modern Moral Philosophy* shortly after her Truman pamphlet. She needed a name for the enemy she was fighting. Why did she feel the need to categorize this reasoning, and do you think she created a bit of a strawman?
  **Predicted Answer:** He'll argue she didn't create a strawman but identified a virus. She saw that once you make "outcome" the only metric, there is no act you can rule out in advance. She named it to show that it was a distinct, dangerous system of thought, not just "common sense."
  **Follow-up:** But very few people today identify as pure consequentialists. Even utilitarians have rules of thumb. By fighting a caricature of "the consequentialist," are we avoiding the harder reality that most decent people *do* weigh consequences when lives are at stake?

  ### 6. The Pilot vs. The President
  **Question:** If Truman is a murderer for ordering the act, what is the status of the pilot, Paul Tibbets? He's the one who actually released the weapon. Does your argument implicate him equally, or does the hierarchy of intention let him off the hook?
  **Predicted Answer:** He will likely distinguish between "formal" and "material" cooperation. Truman intended the end; Tibbets may have just been following orders (material cooperation). Tibbets might be excused by ignorance or duress, whereas Truman bears the burden of the intention.
  **Follow-up:** That seems to let the person pulling the trigger off the hook while punishing the person giving the order. In what other context do we say the person who physically commits the killing is less morally responsible than the bureaucrat who signed the paper?

  ### 7. Historical Counterfactuals
  **Question:** Many historians argue the war was already effectively over, that Japan was seeking terms, or that the Soviet entry was the real catalyst. If the bomb wasn't *necessary* to end the war, does your moral argument become easier to make, or does the necessity not matter to you at all?
  **Predicted Answer:** He should admit it makes the historical case easier, but insist the moral case stands regardless. Even if it saved a million American lives (as Truman claimed), it would still be murder. The necessity is irrelevant to the intrinsic wrong.
  **Follow-up:** If the necessity is irrelevant, why spend so much time in the book discussing the historical context? If it's wrong even if it saves a million lives, isn't the historical debate about "was it necessary?" actually a distraction from your main point?

  ### 8. Modern Drone Warfare
  **Question:** Let's bring this to the present. We currently use drone strikes that often rely on "signature strikes" or target individuals where civilian casualties are statistically probable. By your definition, are we currently engaged in a program of state murder?
  **Predicted Answer:** He will likely say yes, whenever civilians are targeted as a means to an end, or when the risk is so high that their death is virtually certain and accepted as part of the plan. He'll argue modern warfare has normalized the Anscombian violation.
  **Follow-up:** If modern warfare is structurally dependent on these violations, is your philosophy a guide for how to conduct war, or is it an argument that modern war itself is impossible to fight morally?

  ### 9. Moral Luck
  **Question:** There's a concept in philosophy called "moral luck." If the bomb had been a dud, or if it had missed the city and hit a mountain, Truman's intention would be the same, but history would judge him differently. Does your judgment of Truman rely on the fact that it *worked* and killed people?
  **Predicted Answer:** No. He will argue that moral luck is a fallacy. Truman is guilty of the *attempt* to murder innocents. The body count confirms the intention, but the moral guilt was incurred the moment the order was given with that intent.
  **Follow-up:** But we don't treat attempted murder the same as murder in law or in history. Why should we ignore the outcome entirely? Does the sheer scale of the death toll not add a specific weight to the sin that an attempt doesn't carry?

  ### 10. The Burden of the Leader
  **Question:** Finally, this philosophy places an immense burden on political leaders. It suggests they must be willing to accept the defeat or destruction of their nation rather than violate a moral absolute. Is this a philosophy for saints, or is it actually viable for anyone responsible for the security of millions?
  **Predicted Answer:** He'll likely conclude that morality *is* demanding. He might argue that if the only way to save the nation is to commit murder, then the nation is already lost morally. He will say we need leaders who recognize limits, not leaders who think they can calculate their way out of sin.
  **Follow-up:** But if the public knows their leader operates by these rules, might they not vote for someone less principled but more "effective"? Is there a danger that absolutism in leadership simply cedes power to those who have no such scruples?
