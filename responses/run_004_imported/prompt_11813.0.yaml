          *   Bitcoin: Highly speculative asset class.
          *   *Verdict:* Major conflict.
      *   *Criterion 5: Moral/Social Good.*
          *   Berkeley: Money should alleviate poverty and encourage virtue.
          *   Bitcoin: Arguably libertarian, anti-state, volatile.
