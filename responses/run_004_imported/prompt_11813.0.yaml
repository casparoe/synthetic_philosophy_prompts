  4.  **Synthesize the Argument:**
      *   *Initial Reaction:* Berkeley would be fascinated that the "physical substance" argument is dead. He'd agree money is a notion/sign.
      *   *The Turn:* However, he would likely reject Bitcoin's *structure* and *usage*.
      *   *Institutional Backing:* Berkeley wanted a National Bank. Bitcoin is trustless. For Berkeley, trust isn't the problem; *accountability* is. Who ensures the money serves the poor?
      *   *Speculation:* The volatility and "HODL" culture look exactly like the South Sea Bubble to him. It's wealth divorced from labor.
