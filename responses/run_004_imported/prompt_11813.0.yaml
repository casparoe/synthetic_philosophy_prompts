      *   *Core Thesis:* Money is a *sign* or *ticket* to stimulate industry. It has no intrinsic value. Its value comes from what it *does* (circulates, motivates labor).
      *   *The "Backing":* Berkeley didn't believe money needed gold backing. He believed it needed *land* or *national credit* backing. It needed to be issued by a public authority (National Bank) to ensure it served the public good.
      *   *Speculation:* He hated the South Sea Bubble because it detached financial gain from real labor/production. It created "imaginary wealth."
      *   *Moral/Religious Aspect:* As a Bishop, he cared about the common good, reducing poverty, and moral virtue. Economic activity should serve societal well-being.

  3.  **Evaluate Bitcoin against Berkeley's Criteria:**
      *   *Criterion 1: Is money a physical commodity?*
