      *   *The Utilitarian Concession:* Animals matter. We can't just torture them. But their moral weight is aggregative (utilitarian), not deontological (rights-based). We can sacrifice an animal's interest for a greater good in a way we can't sacrifice a human's.
      *   *The Problem of Marginal Cases:* Nozick famously admitted this was a weak spot. If a human lacks rational agency (infants, severely impaired), why do they have rights? He suggested a "sliding scale" or a "cluster concept" but never fully resolved it to his own satisfaction.
