      *   **The Task:** Provide a *rigorous defense* of an *aggressive thesis*: The appeal to Common Knowledge (CK) does *not* block Schiffer's regress but relocates it. It names the desired result rather than picking out a mechanism that excludes deceptive cases.
      *   **Specific Constraints:**
