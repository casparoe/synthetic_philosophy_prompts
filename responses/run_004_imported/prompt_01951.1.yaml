answer: |-
  Your friend is right, and the standard defense of the Common Knowledge (CK) move is indeed a piece of definitional bookkeeping that fails to solve the substantive philosophical problem Schiffer identified. The verdict is clear: **The appeal to Common Knowledge does not block the regress; it merely relocates it from the hierarchy of intentions to the basis of the common knowledge itself, leaving the Gricean analysis vulnerable to the same manipulative counterexamples.**

  To defend this aggressive thesis, we must demonstrate that the CK condition is extensionally adequate (it captures the right cases) only by smuggling in the very normative constraints it was meant to derive, or else it remains intensionally vacuous (it allows deceptive cases through). The "finite-generative-capacity" defense specifically fails because it addresses the psychological impossibility of infinite states without addressing the logical possibility of engineered epistemic states that lack communicative force.

  Here is the rigorous argument for why the CK move is a failure of reductive analysis.

  ### 1. The Structure of Schiffer's Regress
  To see why CK fails, we must be precise about what Schiffer's regress actually targets. It is not merely a worry that we can always add another clause ($I_1, I_2, \dots I_n$). It is a worry about the **basis** of the audience's belief.

  Grice's Clause (3) requires that the audience's recognition of the intention function as their *reason* for the response. Schiffer's "Moon Over Miami" case shows that $U$ can intend $A$ to recognize $I_1$, and $A$ can recognize $I_1$, but $A$'s recognition is not the reason for the response (Alice sings to annoy; Bob recognizes she wants him to leave, but leaves because he is annoyed, not because he recognized her intent). The "Tipperary" patch (requiring $A$ to recognize $I_2$, the intention that $A$ recognize $I_1$) fails because an accomplice can supply that recognition causally without $U$'s communicative intent being the source.

  The regress shows that for any finite $n$, a devious agent can engineer a scenario where $A$ has belief level $n$ via a causal route that bypasses $U$'s communicative intention.

  ### 2. The Common Knowledge Move as a Fixed Point
  The standard solution (adopted by Schiffer in *Meaning* and Lewis in *Convention*) is to replace the finite hierarchy with a fixed point: $U$ and $A$ must have **Common Knowledge** that $U$ has the M-intention. Formally, this is the infinite conjunction:
  1. $U$ intends $p$.
  2. $A$ knows (1).
  3. $U$ knows (2).
  4. $A$ knows (3)...

  The "finite-generative-capacity" defense argues that agents need not hold these beliefs occurrently. They need only possess a cognitive mechanism (a rule or disposition) that allows them to infer level $n+1$ from level $n$ if prompted. This is supposed to make CK psychologically realistic.

  ### 3. The Relocation of the Regress
  The aggressive thesis holds that this move solves the *psychological* problem (infinite states) but fails the *philosophical* problem (the distinction between meaning and manipulation).

  **The Argument:**
  Common Knowledge is an **epistemic** relation, not a **normative** one. CK guarantees that the information is "out in the open," but it does not guarantee that the *openness* is what drives the audience's response *as a reason*.

  Consider a **"Super-Tipperary"** case engineered against the CK condition:
  Alice wants Bob to leave the room. She does not want to *mean* that he leave (perhaps she wants to maintain plausible deniability later). However, she wants to ensure he leaves. She stages a scenario where it becomes Common Knowledge that she wants him to leave.
  *   She says to an accomplice, loudly, "I really wish Bob would leave," ensuring Bob hears.
  *   She looks at Bob, acknowledging he heard.
  *   The accomplice says to Bob, "She told me she wants you to leave, and she knows you heard her."
  *   Bob now has the generative capacity to iterate: He knows she wants him to leave; he knows she knows he knows; etc.

  In this scenario, the CK condition is satisfied. The finite-generative capacity is present (Bob can infer the higher orders). Yet, intuitively, Alice does **not** Grice-mean that Bob leave. Bob's reason for leaving is likely social pressure, embarrassment, or the threat of escalation, *not* the recognition of Alice's intention functioning as a reason for belief/action in the Gricean sense.

  If the CK analysis claims this *is* a case of speaker-meaning, it is extensionally incorrect. If it claims this is *not* a case of speaker-meaning, it must appeal to a constraint *outside* of CK to rule it out. That constraint will inevitably be a version of Clause (3): "The recognition must function as the reason." But as Schiffer showed, any finite specification of "reason" is vulnerable to a new counterexample. By appealing to CK, we have not fixed Clause (3); we have simply hidden the requirement that the *basis* of the CK must be communicative.

  ### 4. The Failure of the Finite-Generative Defense
  The proponent of CK will object: "In your Super-Tipperary case, the Common Knowledge is not based on the right *reflexive indicator*. Lewis and Schiffer require that the CK be based on a state of affairs that indicates the intention to both parties *because* the speaker intended it to."

  This objection reveals the bookkeeping. There are two ways to interpret "based on the right reflexive indicator":

  **Option A: The Epistemic Interpretation.**
  The basis is just a physical state of affairs (e.g., the utterance). But as Super-Tipperary shows, physical states can be engineered to produce CK without communicative intent. The generative capacity is triggered by the causal chain (Accomplice $\to$ Bob), not by $U$'s intention to trigger it. The defense fails because the *generator* itself can be hijacked. The regress re-emerges at the level of the generator: "What ensures the generator was triggered by the intention and not the accomplice?" If you add a clause ("The generator must be triggered by..."), you are back in Schiffer's finite-hierarchy trap.

  **Option B: The Normative Interpretation.**
  The basis is defined as "a state of affairs that indicates the intention *in virtue of the speaker's meaning*." This makes the analysis circular. It defines Meaning in terms of Common Knowledge, and Common Knowledge in terms of an indicator that only works if there is Meaning. This is the "definitional bookkeeping" your friend identified. It secures the definition against counterexamples by stipulating that counterexamples are impossible by definition, rather than explaining *why* they are impossible in terms of non-semantic facts.

  ### 5. Why the Regress is Vicious Here
  The standard defense claims the regress is benign because it is only "dispositional." This misses Schiffer's point. The regress is vicious not because humans can't think infinite thoughts, but because **every step in the hierarchy is a potential locus of deception.**

  In the Gricean framework, the "openness" of the intention is supposed to be what distinguishes *offering a reason* from *causing a belief*.
  *   **Gricean Ideal:** $A$ believes $p$ *because* $A$ sees $U$ intends $A$ to believe $p$.
  *   **CK Reality:** $A$ believes $p$ and $A$ knows $U$ knows $A$ believes $p$...

  The CK condition ensures the *structure* of the beliefs aligns. It does not ensure the *causal arrow* points the right way. A devious Alice can align the structure (via accomplices, staging, or psychological conditioning) while keeping the causal arrow pointed at manipulation.

  When the defender says, "Agents have a finite generative capacity," they are asserting that the *mechanism* of inference is what matters. But Schiffer's Tipperary case proves that the mechanism of inference can be activated by non-communicative causes. Therefore, the existence of the generative capacity is insufficient to guarantee Meaning. To guarantee Meaning, you must specify that the generative capacity is activated *by the recognition of the communicative intent*. But specifying *that* without circularity requires a new clause, which invites a new Tipperary case.

  ### Verdict
  The appeal to Common Knowledge is a formal solution to a logical problem (infinite conjunctions) that mistakes the logical problem for the philosophical one (the nature of reflexive reason-giving).

  1.  **It is not a substantive fix:** It replaces a hierarchy of intentions with a hierarchy of epistemic states, but leaves the causal/normative link between those states and the audience's response unspecified.
  2.  **It is vulnerable to counter-engineering:** As shown in the Super-Tipperary case, CK can be manufactured manipulatively.
  3.  **The Generative Defense fails:** It addresses cognitive load but not causal deviance. The "rule" that generates the hierarchy can be triggered by deceptive cues.
  4.  **It is circular or incomplete:** To rule out the deceptive CK cases, one must add a constraint that the CK be "communicatively grounded." This either reintroduces the regress (how do we define 'communicatively grounded'?) or begs the question (defining it in terms of meaning).

  Your friend's reaction is theoretically sound. The Common Knowledge move saves the *letter* of the Gricean program by formalizing the intuition of "openness," but it kills the *spirit* of the program by failing to provide a reductive account of what makes that openness *meaningful* rather than *manipulative*. It names the destination (mutual awareness) without providing a map that excludes the deceptive detours. The regress is not blocked; it is merely hidden inside the black box of "Common Knowledge."

  **Conclusion:** The CK move is definitional bookkeeping. It declares victory by defining the problematic cases out of existence rather than solving the structural vulnerability Schiffer exposed. You are not missing the defense; the defense relies on conflating epistemic symmetry with normative force.
