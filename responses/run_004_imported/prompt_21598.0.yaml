answer: |-
  This is a classic philosophical bar fight scenario, and your friend has stumbled onto a very common confusion in philosophical logic. While the two concepts are intimately related, your friend is wrong: **paraconsistent logic and dialetheism are not the same thing.**

  You can think of the relationship like this: **Paraconsistent logic is the vehicle; dialetheism is a specific destination.** You can drive the vehicle without going to that destination.

  Here is the breakdown of why they are distinct, what extra commitment dialetheism requires, and how the logical link actually works.

  ### 1. The Definitions: Tool vs. Thesis

  To see the difference, we have to separate the *formal system* from the *philosophical interpretation*.

  **Paraconsistent Logic (The Tool)**
  This is a property of a logical system. In classical logic, the principle of **Explosion** (*Ex Falso Quodlibet*) holds: if you accept a contradiction ($A$ and $\text{not-}A$), you can prove *anything* ($B$).
  $$A, \neg A \vdash B$$
  A logic is **paraconsistent** if it rejects this principle. It allows a theory to contain contradictions without the system collapsing into "triviality" (where every statement becomes true).
  *   **Commitment:** "I want a logical system that doesn't crash when it encounters inconsistent information."

  **Dialetheism (The Thesis)**
  This is a philosophical claim about truth and reality. It asserts that there are **true contradictions** (dialetheias). It claims that for some sentence $A$, both $A$ and $\text{not-}A$ are actually true.
  *   **Commitment:** "I believe that reality (or language) actually contains true contradictions."

  ### 2. The "Extra Commitment"

  Your friend argued that a logic tolerant of contradiction is "dialetheist in all but name." This is incorrect because it confuses **accommodation** with **endorsement**.

  Adopting a paraconsistent logic is an **instrumental** move. You might adopt it because:
  1.  **Inconsistent Data:** You are a computer scientist modeling a database where two sources give conflicting info. You don't think reality is contradictory; you just know your data is messy, and you don't want your query system to crash.
  2.  **Historical Theories:** You are studying Bohr's model of the atom, which contained inconsistencies. You want to reason about what Bohr believed without concluding that Bohr believed "the moon is made of cheese" (which explosion would allow).
  3.  **Legal Systems:** Laws often contradict each other. A legal logic needs to handle this without declaring the entire legal system void.

  In all these cases, the user of paraconsistent logic says: *"There is a contradiction here, it is unfortunate, and we must contain it so it doesn't spread."*

  The dialetheist says: *"There is a contradiction here, and it is **true**."*

  **The Extra Commitment:** To be a dialetheist, you must add an ontological or semantic claim on top of the logic: **Some contradictions are not just manageable errors; they are veridical (truth-bearing).**

  ### 3. Does Dialetheism Force Paraconsistent Logic?

  Here is where your friend was half-right. The link is asymmetric.

  **If you are a Dialetheist, you *must* use Paraconsistent Logic.**
  If you believe there are true contradictions ($A$ and $\text{not-}A$ are both true), but you use Classical Logic, you are forced into **Trivialism**.
  *   Step 1: $A$ is true.
  *   Step 2: $\text{not-}A$ is true.
  *   Step 3 (Classical Explosion): Therefore, $B$ is true (for any $B$).
  *   Result: You believe everything is true.

  Since almost no dialetheists (like Graham Priest, the most famous proponent) believe *everything* is true (they want to distinguish true contradictions from false ones), they **must** adopt a paraconsistent logic to block explosion. So, Dialetheism $\rightarrow$ Paraconsistency.

  **If you use Paraconsistent Logic, you do *not* have to be a Dialetheist.**
  As mentioned above, you can use the logic to model inconsistency without believing the inconsistency reflects reality. You can treat the "contradictory" value in the logic as representing "semantic defect," "information overload," or "error," rather than "truth."

  ### 4. Why Your Friend's Argument Fails

  Your friend's argument was: *"Any logic that's tolerant enough to survive a flat out contradiction without exploding is already dialetheist in all but name."*

  This fails because it ignores how we **interpret** the values in the logic.

  In a common paraconsistent logic (like LP, the Logic of Paradox), a statement can have three values:
  1.  Just True
  2.  Just False
  3.  Both True and False

  *   **The Dialetheist** looks at value #3 and says: "This accurately describes the Liar Sentence. It is genuinely both true and false."
  *   **The Non-Dialetheist Paraconsistentist** looks at value #3 and says: "This indicates the sentence is **pathological**. It assigns it this value to prevent the system from exploding, but I interpret 'Both' as 'Undefined' or 'Glutty' in a way that doesn't imply ontological truth."

  There is a view called **Paraconsistent Fictionalism** or **Instrumentalism**. These philosophers use paraconsistent logic to solve the Liar Paradox without accepting that the Liar Sentence is *true*. They might say the sentence is "acceptable to assert" within the logic, but not "true" in the metaphysical sense.

  ### 5. Summary for Your Next Drink

  If you run into your friend again, here is the cheat sheet:

  1.  **Paraconsistency is about inference:** It asks, "What follows from what?" It simply removes the rule that contradictions destroy the system.
  2.  **Dialetheism is about truth:** It asks, "What is the case?" It claims some contradictions *are* the case.
  3.  **The Safe Analogy:** Paraconsistent logic is like building a fireproof safe. Dialetheism is like believing money should spontaneously combust. You can build the safe (paraconsistency) just in case the money does combust, or to protect against external fires (inconsistent data), without believing the combustion is natural (dialetheism).
  4.  **The Verdict:** Your friend conflated the *capacity* to accept contradictions with the *belief* in them. You were right to be unconvinced.

  **Winning line:** "I can use a trash can to hold garbage without believing the garbage is treasure. Paraconsistent logic is the trash can; dialetheism is the claim that the garbage is actually treasure."
