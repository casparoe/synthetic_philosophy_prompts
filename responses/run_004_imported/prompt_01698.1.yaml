      *   *Point 2: The "Paradox" is actually a Self-Defeating Premise.* If CKR holds, the game never starts (or ends at node 1). If the game proceeds to node 2, Player 2 *must* update their belief that Player 1 is not fully rational (or doesn't believe in CKR). Once that belief updates, BI is no longer the optimal strategy.
