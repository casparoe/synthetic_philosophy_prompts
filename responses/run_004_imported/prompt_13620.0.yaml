          *   *Key Feature:* It's about *delegation* and *commitment* to play a different game, not necessarily mediation with private info elicitation. It avoids the "honesty" problem of standard mechanism design.

      *   **Hicks Paradox of Strikes:**
          *   *Puzzle:* Strikes are costly. If both sides knew the settlement point, they'd settle immediately. Strikes happen due to private info (resolve, costs) and incentives to signal/misrepresent.
          *   *Standard Solution:* Screening/Signaling models (e.g., Kennan & Wilson). Strikes serve as a costly signal to reveal private info.

      *   **User's Proposal:**
