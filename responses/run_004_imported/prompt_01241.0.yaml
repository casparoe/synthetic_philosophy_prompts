answer: |-
  The cheese had congealed into a rubbery sheet, and the Merlot was distinctly metallic, but neither Priya nor Tom was going to leave first. They stood in the corner of the philosophy department lounge, name tags peeling at the corners, circling the same argument they'd been having since their qualifying exams.

  "You're being a defeatist, Priya," Tom said, swirling his plastic cup. "Lewis's result is a reductio of the assumptions, not of the project. You just accepted the conclusion because it was convenient."

  Priya leaned against the whiteboard, arms crossed. "Convenient? It's rigorous. Lewis showed that if conditionals express propositions and their probabilities obey the Kolmogorov axioms, then Adams' Thesis holds only if the language is trivial. No non-trivial language can have conditionals that are both propositions and satisfy $P(\text{if } A, B) = P(B|A)$. I'm choosing to keep the data—Adams' Thesis—and drop the proposition. You're trying to keep the proposition and fudge the data."

  "I'm not fudging anything. I'm contextualizing," Tom said, stepping into her space. "Lewis's proof assumes the proposition expressed by 'if $A, B$' stays fixed while you conditionalize on $A$ and other propositions. But Stalnaker's selection functions shift. The context changes when you update on $A$. The proposition isn't pinned down long enough for Lewis's diagonalization to work."

  "Please." Priya took a sharp sip of wine. "We've been over the variable strict conditional. It doesn't save you. Hájek ran the numbers in 2011. Even if you allow the selection function to vary, if your semantics validates Import-Export—$(A \to (B \to C)) \equiv ((A \land B) \to C)$—and you still want to recover Adams' Thesis as a limit on rational credence, you get triviality again. Stalnaker's semantics validates Import-Export. So Stalnaker is trivial."

  Tom's jaw tightened. He knew Hájek. "Stalnaker can deny Import-Export. It's a valid inference in the logic, but it doesn't hold for probability preservation in all contexts."

  "Then you lose the intuitive equivalence," Priya shot back. "But it's worse with Kratzer. You like the restrictor view, right? 'If' isn't a propositional connective; it restricts a covert modal."

  "Exactly," Tom said. "So Lewis doesn't apply. There's no binary connective forming a proposition. The logical form is $\text{MUST}(A)(B)$. The triviality proof targets the connective."

  "But Kratzer isn't safe," Priya said, pointing a finger. "If the covert modal is an epistemic necessity, and you try to derive Adams' Thesis from the semantics, you still need the probability of the *content* of the modal claim to match the conditional probability. Hájek showed that triviality results can be reformulated for restrictor theories if they aim to explain why rational credence follows Adams' Thesis. You're just hiding the proposition inside the modal base. You haven't escaped the result; you've just moved the furniture."

  Tom laughed, a short, dry sound. "Okay, fine. Let's say I grant you the probability point. Let's say we can't perfectly map credence to truth conditions without some friction. Look at the cost of your solution. You say conditionals aren't truth-apt. They're just rules for updating. So explain embedding."

  Priya rolled her eyes. "Here we go."

  "No, seriously. Frege-Geach," Tom pressed. "If 'if $A, B$' doesn't express a proposition, it can't be the object of a belief. It can't be negated. It can't be disjoined. But I can say, 'Either if it rains, the match is cancelled, or if it snows, the match is cancelled.' I can say, 'It is probable that if it rains, the match is cancelled.' If there's no 'that'-clause proposition there, what is probable? What are you asserting in the disjunction?"

  "I'm expressing a complex commitment," Priya said, her voice tightening. "Gibbard handled this. Logic isn't about truth-preservation between propositions; it's about consistency of plans and commitments."

  "That's a metaphor, not a semantics," Tom snapped. "When I say 'It is probable that if $A, B$,' I am reporting a fact about my credence. On your view, that sentence should be nonsense. It's like saying 'It is probable that hooray for the Seahawks.' You can't have a probability operator binding a non-proposition. My view handles this effortlessly. 'If $A, B$' denotes a set of worlds (or a function from worlds to worlds). That set is the argument for the probability operator. No category error."

  "Your view handles it by lying about the probability," Priya countered. "You get the embedding right because you sacrifice Adams' Thesis. I keep the link between conditionals and conditional probability—which is the actual phenomenology of how we use them—and I pay the price on embedding. But it's a price I can pay. Expressivism has grown up, Tom. We have semantic values that aren't truth conditions. We track the *informational content* without reifying it into a truth-bearing proposition."

  "But you can't nest them," Tom said, leaning in. "What about 'If if $A, B$, then $C$'? Iterated conditionals. On your view, the antecedent is a rule. How do you make a rule the antecedent of another rule? My selection function just takes the world and the antecedent proposition. If your antecedent isn't a proposition, the function crashes."

  "Stalnaker's own logic crashes on iterated conditionals if you assume conditional excluded middle," Priya said, seizing the opening. "Don't act like your house is made of glass. You want truth conditions? Fine. But you have to accept that your truth conditions predict intuitive falsehoods. You predict that 'If Bizet and Verdi were compatriots, Bizet would be Italian' is either true or false. I say it's neither. It's assertable only relative to a context. You're reifying context into a world."

  "I'm reifying it into a proposition," Tom corrected. "Which allows me to do logic. You want to throw out the Law of Non-Contradiction for conditionals. You can't say 'It's not the case that if $A, B$' means the same as 'If $A$, not $B$'. On your view, negation is a speech act denial, not a truth-functional operator. So valid arguments involving negated conditionals become ambiguous."

  "Because natural language is ambiguous!" Priya's voice rose, drawing a look from a passing postdoc. "You're forcing English into a first-order logic straitjacket. Lewis showed us the door. He showed that truth conditions and conditional probability are incompatible. I chose probability because that's how we reason. You chose truth conditions because you're obsessed with model theory."

  "I chose truth conditions because I want to know what I'm believing when I believe a conditional," Tom said, quieter now, intense. "If I believe 'if $A, B$,' I take the world to be a certain way. I rule out worlds where $A$ is true and $B$ is false. That's a truth condition. If you deny that, you're saying I don't actually believe anything. I'm just... disposed to infer $B$ from $A$?"

  "You're disposed to infer $B$ from $A$ *and* you take yourself to be ruling out $A \land \neg B$," Priya said. "But the truth of the conditional isn't the content of the belief. The content is the constraint on the credence function. Look, Tom, we've been sniping in footnotes for ten years. You think you've saved the proposition by making it context-sensitive. I think you've just made the proposition so ephemeral it's useless. Every time Lewis corners you, you shift the context. It's a motte-and-bailey. You claim conditionals have truth conditions, but when the triviality proof comes, you say 'oh, the context shifted.' If the context shifts that fast, do you really have a proposition?"

  Tom opened his mouth, then closed it. He looked at his wine, then back at her. The exhaustion of the semester seemed to hit him all at once.

  "The context shifts because conversation is dynamic," Tom said finally. "That's not a bug. It's a feature. Stalnaker was right about that much. But you... you're left with a logic that can't handle probability operators without a paraphrase."

  "And you're left with a semantics that can't handle the probability data without a paraphrase," Priya said.

  They stood in silence for a moment, the hum of the department refrigerator filling the gap.

  "I'm publishing the reply to your *Nous* paper," Tom said.

  "I know," Priya said, finishing her wine. "I'll be waiting for the footnote."

  "It's going to be a long one."

  "Make sure you cite Hájek properly this time."

  Tom smirked, just slightly. "Only if you admit that embedded conditionals are a problem for expressivism."

  "Only if you admit that triviality is a problem for restrictors."

  "Deal."

  Neither of them moved to shake on it. They just turned back toward the room, looking for the bottle opener, leaving the proposition suspended between them, neither true nor false, but highly assertable.
