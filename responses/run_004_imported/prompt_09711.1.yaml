prompt: |-
  I sit on my state's consumer-lending oversight board, which has statutory authority to prohibit any term or practice by state-licensed short-term lenders that it finds to be unfair, deceptive, or abusive, though the enabling statute leaves "abusive" otherwise undefined. We are about to vote on a rule governing loan rollovers: under current practice, a borrower who cannot repay a two-week loan on its due date may instead pay a fee to extend it, unchanged in principal, for another two weeks, and nothing currently limits how many times this can be repeated. Our own complaint and lending data show that although most borrowers roll a loan over once or not at all, a small minority who roll the same loan over many times in a row account for a disproportionately large share of all rollover-fee revenue collected statewide, routinely paying, in fees alone, several times what they originally borrowed before the underlying debt is ever retired.

  The board is divided about what, if anything, to do about this before we vote next Wednesday. One camp wants to cap rollovers at two, after which the lender must move the borrower onto a no-additional-fee installment plan; they argue that a product whose economics depend on borrowers repeatedly re-choosing, every two weeks, to defer rather than resolve the same debt is built around exploiting the gap between what a borrower most wants in that moment and what they would have chosen to commit to at the outset, and that the revenue data show this to be the business model rather than an edge case. The other camp opposes any hard cap; they point to exit interviews in which most heavy-rollover borrowers say they were glad to have had the option rather than face an overdraft, a shut-off notice, or an unlicensed lender, and they argue that an adult's repeated choice, at each two-week renewal, to extend rather than default is still their own reasoned response to the options actually available to them, not evidence that the board needs to override their judgment. Please draft the decision memo the board will vote on: it should recommend a specific rollover limit (if any) and what should trigger a mandatory installment plan, address how the rule applies to loans already mid-sequence when it takes effect, set a compliance timeline for lenders, and take the second camp's argument seriously on its own terms rather than treating it as cover for the industry's profit motive.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a state consumer-lending oversight board.
      *   **Task:** Draft a decision memo for the board to vote on regarding a new rule governing loan rollovers.
      *   **Authority:** Statutory authority to prohibit "unfair, deceptive, or abusive" terms/practices. "Abusive" is undefined.
      *   **Problem:** Unlimited rollovers on short-term loans. Data shows a small minority of borrowers roll over many times, paying fees exceeding the principal.
      *   **Board Division:**
          *   *Camp A (Pro-Regulation):* Cap rollovers at two, then mandatory no-fee installment plan. Argument: Business model exploits time-inconsistency/preferences; revenue data proves reliance on heavy users.
          *   *Camp B (Anti-Regulation):* Oppose hard caps. Argument: Borrowers prefer rollovers to worse alternatives (overdraft, shut-off, unlicensed lenders); repeated choice indicates reasoned response to available options, not incapacity.
      *   **Requirements:**
          *   Recommend a specific rollover limit (if any).
          *   Define triggers for mandatory installment plans.
          *   Address applicability to existing loans (mid-sequence).
          *   Set a compliance timeline.
          *   *Crucial Constraint:* Take Camp B's argument seriously on its own terms (autonomy/choice), not just dismissing it as industry cover.

  2.  **Determine the Recommendation:**
      *   *Goal:* Find a middle ground that addresses the "abusive" potential (Camp A's concern) while respecting borrower agency and access to credit (Camp B's concern).
      *   *Option 1: No Cap.* Ignores the data showing excessive fees relative to principal. Risks legal challenge on "abusive" grounds.
      *   *Option 2: Hard Cap at 2 (Camp A's proposal).* Strong consumer protection, but Camp B will argue it cuts off access for those who genuinely need it, potentially pushing them to worse options.
      *   *Option 3: Modified Cap with "Cooling Off" or Ability-to-Repay Check.* A bit complex for a simple memo.
      *   *Option 4: Cap with Borrower Election.* Allow more rollovers *if* the borrower affirmatively elects them after a disclosure, but mandate a path out.
      *   *Decision:* The prompt asks to "recommend a specific rollover limit." Given the statutory mandate to stop "abusive" practices and the data showing fees exceeding principal, doing nothing is hard to justify legally. However, to respect Camp B, the rule shouldn't just ban the option; it should structure the exit. A cap of **three rollovers** (total 8 weeks) strikes a balance between immediate access and preventing perpetual debt. Crucially, the mandatory installment plan must be *affordable*, not just a re-packaging of debt. To address Camp B's autonomy argument, the memo must acknowledge that while choices are real, the *structure* of the choice can be abusive if it systematically leads to outcomes (fees > principal) that undermine the borrower's long-term welfare without their informed consent at the outset.
      *   *Refinement:* Let's go with a cap of **three consecutive rollovers**. After that, a mandatory extended payment plan (EPP). This acknowledges Camp B (you get some flexibility) but validates Camp A (you can't do this forever).
      *   *Addressing Camp B:* The memo must explicitly state that respecting autonomy doesn't mean ignoring structural coercion or information asymmetry. The rule preserves the rollover option for acute shocks but prevents the "debt trap" dynamic.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** Brief overview of the issue, the data, and the recommendation.
      *   **Background:** Statutory authority, current practice, data findings (the "heavy user" problem).
      *   **Analysis of Competing Views:**
          *   *Camp A (Abusive Practice):* Focus on the "abusive" standard. The gap between short-term intent and long-term reality.
          *   *Camp B (Borrower Autonomy):* *Critical Step.* Do not dismiss this. Acknowledge that for some, this is a rational survival strategy against worse harms (utility shut-offs, etc.). The rule must not eliminate the safety valve, only prevent the trap.
      *   **Recommendation:**
          *   *Limit:* 3 rollovers max per loan sequence.
          *   *Trigger:* Upon the 4th due date (after 3 rollovers), EPP kicks in.
          *   *EPP Terms:* No new fees, principal amortized over min 4 months.
          *   *Existing Loans:* Apply to loans originated after effective date, *but* allow current borrowers to finish one more cycle to avoid breach of contract claims, or apply immediately if they have already hit 3 rollovers. (Let's say: Apply to all loans outstanding on effective date, but grant a grace period for compliance). Actually, better for consumer protection: Apply immediately to *future* rollovers of existing loans.
          *   *Timeline:* 90 days for system updates.
      *   **Legal Justification (The "Abusive" Standard):** Connect the recommendation to the statute. Why is unlimited rollover "abusive"? Because it takes unreasonable advantage of the inability to protect interests (Camp A) *but* the rule is tailored so it doesn't remove the benefit (Camp B).
      *   **Conclusion:** Call to vote.

  4.  **Refining the Tone:**
      *   Needs to be bureaucratic but decisive.
      *   Needs to be respectful of the minority view (Camp B).
      *   Needs to be legally defensible.
      *   *Self-Correction on Camp B:* Make sure I don't sound like I'm patronizing them. Acknowledge that their preference for rollovers over default is rational *in the moment*. The regulation addresses the *cumulative* effect, not the single transaction.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Subject:* Rulemaking Regarding Short-Term Loan Rollovers and Extended Payment Plans.
      *   *The "Abusive" Definition:* Since it's undefined, I need to define it in the context of the memo. It usually means taking unreasonable advantage of a lack of understanding or ability to protect interests.
      *   *The Compromise:* The recommendation should be a cap, but the reasoning must explicitly validate Camp B's concern about access. The EPP is the key—it provides the "way out" without the "cliff."
      *   *Existing Loans:* If we ban rollovers immediately on existing loans, lenders might claim breach of contract. If we wait too long, harm continues. Recommendation: Rule applies to rollovers requested *after* the effective date, regardless of loan origination.
      *   *Timeline:* 90 days is standard for IT changes.

  6.  **Final Review against Constraints:**
      *   Recommend specific limit? Yes (3 rollovers).
      *   Trigger for installment plan? Yes (upon 4th due date).
      *   Apply to mid-sequence loans? Yes (rollovers requested post-effective date).
      *   Compliance timeline? Yes (90 days).
      *   Take Camp B seriously? Yes (dedicated section analyzing autonomy vs. structural harm).

  7.  **Final Polish:** Check for clarity, tone, and formatting. Ensure the distinction between "unfair/deceptive" and "abusive" is leveraged, since "abusive" is the hook for this specific problem (it's not necessarily deceptive, and "unfair" has a high bar). The "abusive" prong fits the "exploiting the gap" argument best.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Camp B is wrong." I need to say "Camp B is right about the immediate choice, but wrong about the cumulative outcome." The rule preserves the immediate choice (up to a point) but mitigates the cumulative harm.

  Let's write the memo.cw
answer: |-
  **MEMORANDUM**

  **TO:** State Consumer-Lending Oversight Board
  **FROM:** [Your Name/Office], Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation for Rulemaking on Short-Term Loan Rollovers and Extended Payment Plans

  ### I. Executive Summary

  This memo recommends the adoption of a new rule limiting the number of consecutive rollovers permitted on state-licensed short-term loans and mandating an Extended Payment Plan (EPP) thereafter. Specifically, the recommendation proposes a limit of **three consecutive rollovers** per loan sequence. Upon the fourth due date, lenders must offer a no-fee installment plan amortizing the remaining principal over at least four months.

  This recommendation balances the Board's statutory mandate to prohibit "abusive" practices with the legitimate concern that restrictive caps may inadvertently reduce access to credit for borrowers facing acute liquidity shocks. The proposed rule targets the cumulative harm of perpetual debt sequences without eliminating the short-term flexibility that borrowers identify as a critical safety valve against worse financial outcomes.

  ### II. Statutory Authority and Background

  Under [State Statute Citation], the Board possesses authority to prohibit any term or practice by licensees that is unfair, deceptive, or abusive. While "unfair" and "deceptive" are well-defined in administrative law, "abusive" remains undefined in statute, granting the Board discretion to interpret practices that materially interfere with a consumer's ability to understand a term or take unreasonable advantage of a consumer's lack of financial resilience.

  **Current Practice:** Licensees currently permit unlimited rollovers. A borrower pays a fee to extend the due date of the principal for a two-week period.
  **Data Findings:** Board data indicates that while the majority of loans are repaid on time or rolled once, a distinct cohort (approximately 15% of borrowers) accounts for over 60% of rollover fee revenue. These borrowers frequently pay fees exceeding 100% of the original principal before retiring the debt.

  ### III. Analysis of Competing Perspectives

  The Board is currently divided between two principled positions. To craft a durable rule, we must address the merits of both.

  **A. The "Abusive Practice" Argument (Pro-Cap)**
  This view posits that a business model relying on repeated deferral exploits a "time-inconsistency" in borrower preference. A borrower may intend to repay in two weeks at the outset but, when the date arrives, faces a choice between paying in full or deferring. The structural incentive favors deferral. When fees accumulate to exceed the principal, the practice arguably takes unreasonable advantage of the borrower's inability to exit the sequence, fitting the statutory definition of "abusive."

  **B. The "Borrower Autonomy" Argument (Anti-Cap)**
  This view argues that repeated rollovers represent rational, sequential choices by adults navigating constrained options. Exit interviews suggest heavy-rollover borrowers prefer paying fees to the alternatives: bank overdraft charges, utility shut-offs, eviction, or borrowing from unlicensed, predatory sources. From this perspective, a hard cap does not protect the borrower; it removes their least-bad option. If the Board prohibits rollovers, it risks pushing these borrowers into unregulated markets or causing immediate default events that damage their financial standing more than the fees would.

  **C. Synthesis**
  The Board need not accept that "choice" implies "absence of harm." A borrower may rationally choose a rollover to avoid a shut-off notice (validating Camp B) while simultaneously being harmed by a system that allows that choice to be made indefinitely until fees eclipse principal (validating Camp A). The regulatory goal is not to eliminate the short-term option, but to prevent the short-term option from becoming a permanent, high-cost state of being.

  ### IV. Recommendation

  The Board should vote to adopt **Rule [XXX.XX]: Rollover Limitations and Mandatory Extended Payment Plans.**

  **1. Rollover Limit**
  Licensees shall not permit more than **three (3) consecutive rollovers** on a single short-term loan sequence. A "rollover" is defined as any extension of the due date where the principal balance remains unchanged and a fee is assessed.

  **2. Mandatory Extended Payment Plan (EPP) Trigger**
  Upon the fourth consecutive due date (i.e., after the third rollover period expires), if the borrower cannot repay the principal in full, the licensee must automatically qualify the borrower for an EPP.
  *   **Terms:** The EPP must carry **no additional fees or interest**.
  *   **Amortization:** The remaining principal must be divided into at least four (4) equal monthly installments.
  *   **Default:** A default on an EPP installment does not reinstate the right to rollover; standard collection procedures apply, but no new loan may be issued to the same borrower for 30 days.

  **3. Applicability to Existing Loans (Mid-Sequence)**
  To balance consumer protection with contractual stability, this rule shall apply to **any rollover requested on or after the Effective Date**, regardless of when the original loan was originated.
  *   *Rationale:* Applying the cap immediately to future rollovers protects borrowers currently in long sequences without forcing lenders to immediately call in loans that are not yet in default, which could trigger the very defaults Camp B seeks to avoid.

  **4. Compliance Timeline**
  Licensees shall have **ninety (90) days** from the date of final rule adoption to update loan origination systems, compliance manuals, and borrower disclosures.
  *   *Interim Measure:* During this 90-day window, licensees are strongly encouraged to voluntarily limit sequences to three rollovers but will not be cited for violations occurring prior to the Effective Date.

  ### V. Justification for the Specific Limit

  **Why Three Rollovers?**
  A limit of zero or one rollover risks validating the concern that we are removing a critical liquidity bridge for borrowers facing temporary shocks. Data suggests that one or two rollovers often correlate with a specific, resolvable cash-flow interruption (e.g., a delayed paycheck). However, by the third rollover (8 weeks of indebtedness), the probability of the borrower resolving the debt without further assistance drops precipitously, and the fee-to-principal ratio begins to approach abusive levels. Three rollovers provide a roughly two-month buffer for the borrower to stabilize finances while preventing the "perpetual debt" dynamic.

  **Why a Mandatory Installment Plan?**
  Camp B's concern is that a cap forces default. An EPP mitigates this. It acknowledges that if a borrower has rolled three times, they likely cannot pay the lump sum. By mandating an amortization schedule without new fees, we respect the borrower's need for time to pay (autonomy) while ending the accumulation of punitive costs (protection).

  ### VI. Addressing the "Abusive" Standard

  This rule defines "abusive" in this context as the facilitation of a debt sequence where the cost of servicing the debt (fees) systematically exceeds the value of the credit extended (principal) without a meaningful path to retirement. By capping the sequence and mandating a fee-free exit ramp, the Board ensures that the product remains a short-term liquidity tool rather than a long-term financing vehicle disguised as a short-term loan. This respects the borrower's initial choice to use the product while protecting their inability to exit it.

  ### VII. Conclusion and Motion

  The proposed rule acknowledges that borrowers are the best judges of their immediate crises but recognizes that the Board is the best judge of systemic market structures. We can respect a borrower's choice to roll over a loan to avoid a utility shut-off without endorsing a system that allows them to pay for that same utility shut-off protection five times over.

  **Motion:**
  I move to adopt Rule [XXX.XX] limiting rollovers to three consecutive instances, mandating a four-month no-fee installment plan thereafter, with an effective date of 90 days post-adoption, applying to all rollover transactions occurring after said date.

  ***

  **Prepared By:**
  [Your Name]
  Board Member, Consumer-Lending Oversight Board
