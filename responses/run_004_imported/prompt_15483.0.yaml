  Here is a draft of the eulogy. It is approximately 550 words, which should take about three and a half minutes to speak at a funeral pace.

  ***

  **Tomas's Eulogy**

  Thank you for coming. I know… I know half of you are waiting for me to say something about how she's "in a better place." And the other half are waiting to see if I remember which book of *The World as Will and Representation* she quoted most often.

  I'm not going to do either of those things. Mostly because I'd get the citation wrong, and partly because Sabine wouldn't have wanted the comfort.

  She spent a lot of evenings explaining to me, usually over a bottle of red, that life is essentially a kind of hunger. A constant striving for something that, once you get it, just makes you bored until you want something else. She didn't say that to be depressing. She said it because she thought it was the only honest way to look at things. If you pretend the hunger isn't there, you're lying.

  She told me that for her, the cello wasn't a way to escape that hunger. It was the only thing that matched it.

  She used to argue that painting, or poetry, they're copies of things. They show us the shadow of the world. But music… music doesn't need the world. It doesn't copy a tree or a face. It copies the hunger itself. It copies the pulse of everything that wants and suffers and keeps going. When she played, she wasn't trying to make something pretty. She was trying to let that pulse move through her without getting in the way.

  I know that sounds cold. I know it sounds like a lot of work for a Tuesday night in a concert hall. But I watched her do it. I watched her walk into this room, into this life, tired and worried and in pain sometimes, and then pick up the bow and become something else. For an hour, the striving stopped. The hunger was satisfied, not by getting what it wanted, but by realizing it didn't need to want anything to make the sound.

  That was her peace. Not a happy place. Just a quiet one.

  And now… well. The Schopenhauer purists in the third row know what the theory says about death. It says the individual is a mistake that gets corrected. The music stops, but the sound remains.

  I don't know about the sound. I'm just her son. I just know that the striving is over. She doesn't have to fight the hunger anymore. She doesn't have to translate the world into notes. She spent seventy-four years staring directly into the engine of things, without flinching, without looking away for a nicer story.

  So I'm not going to tell you she's watching over us. I'm going to tell you she put the bow down. And for the first time in her life, she doesn't have to play.

  Thank you.
