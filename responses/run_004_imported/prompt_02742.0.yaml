prompt: |-
  I'm currently down a rabbit hole for a piece on the "hidden Newton" — the guy who apparently spent more time on biblical chronology and heterodox theology than on the Principia, but hid almost all of it becuase openly denying the Trinity could've cost him his position at Cambridge (fellows had to take holy orders, and antitrinitarianism was no joke legally in that period). I've been reading through the Newton Project's transcriptions of his papers for background, and I keep getting stuck on his 1690 letter to Locke, "An Historical Account of Two Notable Corruptions of Scripture," where he tries to show that the Trinity's best proof-text — the "three that bear record in heaven" line at 1 John 5:7 — was inserted into the Greek manuscripts centuries after the fact.

  There's a bit near the start that I think is doing something rhetorically clever, but I cant quite reconstruct the move, and none of the Newton biographies on my shelf gloss it closely enough to actually help. Here it is (keeping the original spelling/punctuation):

  "But whilst we exclaim against the pious frauds of the Roman Church, & make it a part of our religion to detect & renounce all things of that kind: we must acknowledge it a greater crime in us to favour such practises, then in the Papists we so much blame on that account. For they act according to their religion but we contrary to ours. In the eastern nations, & for a long time in the western the faith subsisted without this text & it is rather a danger to religion then an advantage to make it now lean upon a bruised reed."

  Can you help me unpack the actual argument he's making? Specifically — why does he think it's a "greater crime" for Protestants to keep using the corrupted verse than it was for Catholics to (on his telling) fabricate it in the first place, and what's doing the logical work in "they act according to their religion but we contrary to ours"? And is "lean upon a bruised reed" just a flourish, or is he using that biblical echo to make a further point about why defending the Trinity with a fake text actually backfires? I'd like to represent his reasoning accurately in the piece rather than just wave at "Newton secretly thought the verse was fake."
reasoning: |-
