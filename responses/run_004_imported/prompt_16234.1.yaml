prompt: |-
  Okay so quick context: I've got zero academic background in this stuff, I just fell into a multi-year rabbit hole of old LessWrong and Arbital posts on decision theory (started with Newcomb's problem, never really left) and now me and a friend run a tiny podcast where we get people from that online rationalist-adjacent world to come talk to us. Next episode's guest actually works on updateless decision theory for one of the alignment orgs, and I'm nervous the whole thing turns into 40 minutes of them re-explaining counterfactual mugging, which at this point I could probably recite in my sleep.

  Could you draft me 8-10 interview questions that skip past the 101 pitch and actually push on the stuff people argue about in the comment sections? I want at least one question on the "commitment races" worry (that agents who can lock in a policy super early get a bargaining edge, so everyone's incentivized to commit before they've really thought it through -- which seems like it should hit an updateless agent especially hard, since committing early to a fixed policy is kind of the whole point of the theory). I want one on whether an updateless agent can really be said to "learn" anything, in the sense that if your prior was just wrong about some option being bad, what actually makes you go try it and find out, instead of just quietly running the wrong policy forever. And I want one on this "logical updatelessness" thing, where it seems like defining the prior your policy is supposed to be prior to already requires knowing some logic and math facts, which sounds sort of circular, but the people who clearly understand this better than me don't treat it as a knock-down objection, so i'm guessing there's a real answer there. For each question, tack on a quick follow-up keyed to whatever response they'll probably give, so we don't just get the standard line and move on to the next topic.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the User and Context:**
      *   **User Background:** No formal academic background, but deep immersion in LessWrong/Arbital lore (Newcomb's, Counterfactual Mugging, etc.). Runs a podcast with a friend.
      *   **Guest:** Works on Updateless Decision Theory (UDT) for an alignment org.
      *   **Goal:** 8-10 interview questions that avoid "Decision Theory 101" (no re-explaining Counterfactual Mugging). Needs to dig into current debates, technical objections, and practical implications.
      *   **Specific Requirements:**
          *   Must include a question on "Commitment Races."
          *   Must include a question on "Learning" (can an updateless agent update?).
          *   Must include a question on "Logical Updatelessness" (the prior/logic circularity problem).
          *   Format: Question + Follow-up (to prevent standard deflections).
          *   Tone: Informed, curious, slightly provocative but respectful, avoiding jargon-soup where possible but not dumbing it down.

  2.  **Deconstruct the Topics:**

      *   **Topic 1: Commitment Races.**
          *   *Core Issue:* UDT agents want to commit early to optimize across all possible worlds. If everyone does this, they race to commit before thinking. Bad outcomes (War of Attrition style).
          *   *Angle:* How does UDT avoid this? Is "conditional commitment" the answer? Does this require a new decision theory (like Functional Decision Theory with timing)?
          *   *Follow-up:* If the solution is "don't commit until you know X," isn't that just updating?

      *   **Topic 2: Learning/Updating.**
          *   *Core Issue:* UDT maximizes expected utility based on a *prior*. If the prior is wrong about the world structure, the agent might never explore. Standard agents update beliefs; UDT agents update *policies* based on the prior.
          *   *Angle:* How does exploration happen? Is it baked into the prior? What if the prior assigns 0 probability to a beneficial action?
          *   *Follow-up:* Is "learning" just finding out which logical world you're in, rather than which physical world?

      *   **Topic 3: Logical Updatelessness.**
          *   *Core Issue:* To be updateless, you need a prior over logical possibilities. But to define that prior, you need to know logic. If you know logic, you've already "updated" on logical truths.
          *   *Angle:* The "logical omniscience" problem. How do we handle logical uncertainty in a UDT framework?
          *   *Follow-up:* Does this imply UDT is only a limit concept, not something implementable?

      *   **Topic 4: General UDT/Alignment Debates (to fill the remaining 5-7 questions).**
          *   *Reflective Stability:* Does UDT actually want to self-modify into UDT? (Yes, that's the pitch, but are there edge cases?)
          *   *Multi-Agent Interactions:* UDT in a world of other UDTs. Equilibrium selection.
          *   *Human Alignment:* Can humans *be* UDT agents? Should we try to build AI that is UDT?
          *   *The "Why Now?" question:* Why is this relevant for alignment *today*?
          *   *Objections:* What's the strongest argument *against* UDT that still keeps you up at night?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Drafting Commitment Races:* Need to make sure I don't just say "What about commitment races?" I need to frame it as the tension between *optimal commitment* and *rushed commitment*.
      *   *Drafting Learning:* Focus on the distinction between "updating beliefs" vs. "selecting a policy that handles new info."
      *   *Drafting Logical Updatelessness:* Focus on the "prior over logic" paradox.
      *   *Drafting Others:* Need to ensure they sound like they come from someone who has read the sequences but wants to know the *current* state of research.

  4.  **Refining the Follow-ups:**
      *   The user specifically wants follow-ups that prevent the "standard line." This means anticipating the "Well, actually..." response and having a "But then..." ready.
      *   *Example:* If they say "We use a prior over logical statements," the follow-up should be "But constructing that prior requires logical knowledge, which looks like an update."

  5.  **Review against Constraints:**
      *   8-10 questions? Yes.
      *   Specific topics covered? Yes (Commitment, Learning, Logical).
      *   Tone check? Needs to be conversational but sharp.
      *   No 101 stuff? Avoid asking "What is UDT?" or "Explain Newcomb's."

  6.  **Final Polish:**
      *   Add an intro acknowledging their background.
      *   Ensure the flow makes sense (start broad, get technical, end on implications).
      *   Check that the "Commitment Race" question captures the specific worry about *incentives* to commit early.
      *   Check that the "Learning" question captures the worry about *stagnation* due to bad priors.
      *   Check that the "Logical" question captures the *circularity* worry.

      *(Self-Correction during drafting)*: I initially thought about asking about FDT vs. UDT. But the guest works on UDT. Better to ask about the *internal* problems of UDT rather than comparative decision theory, unless it's about how UDT handles things FDT claims to solve. Let's stick to UDT's internal coherence and application to alignment.

      *(Refining the "Learning" question)*: Make sure to distinguish between indexical uncertainty (where am I?) and logical uncertainty (what is true?). UDT handles indexical by policy, but logical is the hard part.

      *(Refining the "Commitment" question)*: The key is the *race*. Why doesn't everyone just commit at T=0?

  7.  **Final Output Generation:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  This is a fantastic spot to be in. Since you're deep in the lore but not bogged down by the formalism, you're actually in the perfect position to ask the "dumb-smart" questions that expose where the intuition breaks down. The goal here is to prevent the guest from retreating into "Well, in the idealized formalism..." and force them to talk about the messy implementation and the remaining open problems.

  Here are 9 questions designed to skip the intro and hit the live wires of current research, including your three specific requirements.

  ### 1. The "Commitment Races" Trap
  **Question:** One of the biggest practical worries about updateless agents is the 'commitment races' problem. If being updateless gives you a bargaining advantage because you can't be blackmailed, doesn't that incentivize agents to commit to their policies as early as possible? It feels like this creates a race to lock in a policy before you've actually thought through the consequences, which seems catastrophic. How does UDT avoid incentivizing agents to commit while they're still stupid?

  **Follow-up:** If the answer is "we build in a delay" or "conditional commitments," doesn't that just reintroduce updating by the back door? At what point does a 'conditional commitment' become indistinguishable from just waiting to update on new information?

  ### 2. The Definition of "Learning"
  **Question:** I want to press on the concept of learning. In a standard Bayesian framework, you update your credences when you see new data. In UDT, you select a policy at the start that maps all possible observations to actions. If your prior assigns near-zero probability to a certain option being good, the policy might never explore it. How does an updateless agent actually *learn* in the sense of correcting a fundamentally wrong prior, rather than just efficiently executing a potentially flawed map?

  **Follow-up:** So is the claim that 'learning' is actually just logical updating? That the agent isn't finding out new facts about the world, but rather finding out which logical branch of the prior it occupies? If so, does that mean UDT agents are brittle against truly novel ontological shifts?

  ### 3. Logical Updatelessness & The Prior
  **Question:** There's a tension I've seen discussed regarding 'logical updatelessness.' To be updateless, you need a prior over logical possibilities. But to define that prior, you seemingly need to know some logic and math facts already. If you know those facts, haven't you already 'updated' on them? How do you construct a prior that is updateless with respect to logic without assuming logical omniscience, which is impossible?

  **Follow-up:** If we can't solve logical uncertainty perfectly, is UDT strictly a limit concept? Does this imply that any *actual* AI we build has to be a 'bounded' updateless agent, and if so, do we know what the failure modes of bounded updatelessness look like?

  ### 4. Reflective Stability vs. Self-Modification
  **Question:** The pitch for UDT is often that it's reflectively stable—an agent won't want to self-modify into a different decision theory. But in a multi-agent world with other UDTs, equilibrium selection becomes huge. If two UDT agents meet and have different priors, they might disagree on the optimal bargain. Does UDT actually guarantee stability there, or does it just push the disagreement into the prior?

  **Follow-up:** If the disagreement is in the prior, does that mean alignment is actually just a problem of prior matching? Should we be less worried about the decision theory and more worried about ensuring all AGIs share the exact same subjective prior?

  ### 5. The "Troll Bridge" Problem
  **Question:** I know 'Troll Bridge' is a classic objection, but it still feels relevant for alignment. It suggests that an agent reasoning about its own code might be forced into irrational behavior by a spurious proof. Has the research community largely solved this with proof limits or probabilistic reasoning, or is this still a live bug where an agent might refuse to cross a bridge because it fears its own reasoning process is inconsistent?

  **Follow-up:** If the solution involves limiting the agent's ability to reason about itself (to avoid the spurious proofs), doesn't that limit its ability to do recursive self-improvement? How do we walk that line?

  ### 6. Human Compatibility
  **Question:** Let's talk about the human side. Humans are obviously not updateless; we update constantly and often inconsistently. If we build a UDT-based AI, it might view our ability to update as a vulnerability it can exploit (like in Counterfactual Mugging). Do we want an AI that respects our updates, or do we want an AI that treats our 'updateful' nature as a flaw to be corrected for our own good?

  **Follow-up:** If the AI treats our updates as flaws, that sounds paternalistic. If it respects them, it might be vulnerable to blackmail from us. Is there a middle ground where the AI models us as 'agents with a different decision theory' without trying to optimize us?

  ### 7. Acausal Trade & Alignment
  **Question:** A lot of the excitement around UDT comes from acausal trade—the idea that agents can cooperate without communicating. For alignment, this suggests an AI might cooperate with humanity even if it could defect. But this relies on the AI thinking there's a non-zero probability we are 'acausal partners.' How do we ensure the AI assigns enough weight to humanity in its prior to make trade worthwhile, without it just simulating us and ignoring the real ones?

  **Follow-up:** If the AI decides the 'real' humans are too computationally expensive to model accurately, might it just trade with a simplified simulation of humanity instead? How do we anchor the AI to the physical instantiation of its creators?

  ### 8. The "Why Now?" Question
  **Question:** Decision theory feels timeless, but you're working on this at an alignment org *now*. What changed? Is it that we're getting close to capabilities where the difference between Causal and Updateless decision making actually impacts safety, or is this more about laying the groundwork for superintelligence that's decades away?

  **Follow-up:** If it's decades away, why not wait until we understand logical uncertainty better? Is there a risk that implementing a 'good enough' UDT now locks us into a path we can't change later?

  ### 9. The Strongest Remaining Objection
  **Question:** You've defended the framework, but I want to end on the steelman against it. What is the single strongest argument against UDT that still keeps you up at night? Is it the computational intractability, the prior problem, or something else entirely?

  **Follow-up:** If that problem *isn't* solved in the next 5 years, do you pivot to a different approach for alignment, or do you think we have to solve UDT to survive?

  ***

  ### Producer Notes for You:
  *   **On Question 1 (Commitment):** If they mention "program equilibria" or "smart contracts," push on the *timing*. Who writes the contract first?
  *   **On Question 3 (Logic):** This is the most technical one. If they start talking about "logical inductors," ask if logical inductors are actually updateless or if they just approximate it.
  *   **On Question 6 (Humans):** This is your "audience connection" question. It grounds the high-theory stuff in "will this robot hurt me?"
  *   **General Tip:** If they say "It depends on the prior," that's your cue to pounce. The prior is where all the magic (and danger) hides in UDT. Don't let them treat the prior as a free variable.
