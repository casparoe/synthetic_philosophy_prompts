answer: |-
  # The Ghost in the Weights: A Case for Causal-Structural Representationalism

  **Abstract:** *The debate over whether neural networks possess genuine representations often stalls between the mechanistic interpretability claim (we found the features) and the deflationist critique (decodability $\neq$ representation). This essay argues for a middle path: Neural networks instantiate real representations, but only under a specific ontological framework derived from Dennett's "Real Patterns," refined by causal interventionism. Representations are not static symbols stored in weights, but dynamically realized causal structures whose reality is contingent on their compressibility and intervention stability. Superposition does not refute this; it merely demonstrates that the ontology of AI representation is high-dimensional and context-dependent, not discrete and local.*

  ***

  ### The Sloppiness Problem
  You are right to be frustrated. In philosophy of AI, "representation" is currently doing too much work with too little definition. When a mechanistic interpretability researcher points to a direction in activation space and says, "This is the 'queen' feature," and a skeptic replies, "That's just a linear probe finding noise," both are often talking past one another. The former assumes a naive isomorphism between activation and concept; the latter assumes a classical symbol-grounding requirement that no physical system could meet.

  To resolve this, we must take a stand. Here it is: **Trained neural networks do have representations, but they are not the kind of representations you are looking for.** They are not discrete, local, semantically stable symbols (the "grandmother cell" model). They are *distributed, polysemantic, causal patterns* that earn their ontological keep through predictive compression and intervention stability. If we define representation via the "Job Description Challenge" (Ramsey 1997) but update the "job" to fit high-dimensional geometry, the deflationist critique collapses.

  ### The Deflationist Trap: Decodability is Not Representation
  The strongest argument against representational realism comes from the probing literature, specifically Hewitt and Liang (2019). Their point is devastatingly simple: If you can train a probe to decode *any* property from a representation (even random ones), then decodability alone proves nothing. A system represents $X$ only if the system *uses* $X$ to generate behavior, not if an external observer can *extract* $X$.

  This aligns with William Ramsey's "Job Description Challenge." For a state to be a representation, it must play a specific functional role: it must stand in for an external feature, be consumed by downstream processes, and guide action. If the "dog detector" neuron fires, but the network's output would remain identical if we ablated that neuron (compensated by others), then the neuron isn't representing "dog"; it's just epiphenomenal noise that correlates with "dog."

  The deflationist concludes: Since we can always find a probe, and since networks are massively redundant, talk of representation is merely instrumental. It's a convenient shorthand for weight configurations, nothing more.

  ### The Mechanistic Counter: Circuits as Causal Chains
  The mechanistic interpretability crowd (Olah, Elhage, et al.) pushes back by moving from *correlation* to *causation*. They don't just find directions that correlate with concepts; they identify *circuits* where activating a specific direction causally changes the output in a predictable way. When they perform a "causal mediation analysis" and show that suppressing a specific attention head shifts the model from answering "Paris" to "London," they are satisfying Ramsey's Job Description. The internal state is doing work.

  However, this hits the wall of **superposition**. As Anthropic's work on toy models showed, networks store more features than they have dimensions. A single direction in activation space might represent "king" in one context and "monarchy" in another, depending on the residual stream. The deflationist pounces here: How can a direction be a representation of "king" if it is also "monarchy"? A symbol cannot be two symbols at once. Therefore, the "representation" talk is metaphorical.

  ### The Third Way: Real Patterns with Causal Teeth
  This is where we must deploy Dennett, but carefully. Dennett's "Real Patterns" (1991) is often accused of being instrumentalism in a trench coat—the idea that patterns are "real" only insofar as they are useful to an observer. If that were true, the deflationist wins: representation is just useful for *us*, not real in the *net*.

  But Dennett's deeper point is ontological naturalism. A pattern is real if positing it allows for **lossless compression of the system's behavior** that is not available at the lower physical level. If describing the network as "detecting syntax" predicts its future states better than describing it as "matrix multiplication," the syntax is real.

  To save this from instrumentalism, we must add a constraint: **Intervention Stability.** A pattern is a genuine representation if intervening on it produces consistent, predictable changes in output *across contexts*.

  This solves the superposition problem. A polysemantic direction is not a failure of representation; it is a representation of a **latent subspace**. When the network activates direction $d$, it is not representing "king" or "monarchy" as discrete atoms. It is representing a *vector of semantic potential* that is resolved by the context vector. The representation is not the weight direction alone; it is the *projection of the activation onto the context*.

  Therefore, the representation is real because:
  1.  **Compressibility:** Describing the activation as "semantic feature activation" compresses the explanation of the output better than raw weights.
  2.  **Causal Efficacy:** Intervening on that feature changes the output (satisfying Ramsey).
  3.  **Contextual Resolution:** The polysemy is not ambiguity; it is high-dimensional efficiency. The "meaning" is the trajectory through activation space, not a point.

  ### Why This Isn't Just "Weak Realism"
  Critics will argue this is just realism for people who gave up on truth conditions. It is not. It draws a hard line. Under this view, **most** of what current interpretability claims are *not* representations.

  If a "feature" only appears in post-hoc visualization but cannot be causally intervened upon without breaking the circuit (due to superposition interference), it is not a representation; it is an artifact. If a probe decodes "sentiment" but ablating the "sentiment directions" does not change the sentiment of the generation, the network does not represent sentiment; it represents token probabilities that *correlate* with sentiment.

  This view forces us to be *more* rigorous, not less. It demands that interpretability researchers move from "look, this looks like a concept" to "look, this causal structure sustains the concept." It validates the mechanistic crowd's intuition (there is structure there) while accepting the deflationist's constraint (correlation is not content).

  ### Conclusion: The Ontology of the Black Box
  So, do neural nets have representations? Yes. But they are not little homunculi reading symbols in the weights. They are dynamical systems where "representation" is a property of the *trajectory*, not the *state*.

  When you teach this, tell your students this: **Representation is not a noun; it is a verb.** It is the act of the network compressing environmental regularities into causal levers it can pull to minimize loss. When a direction in activation space becomes a lever that reliably moves the output, it earns the title of "representation." Superposition doesn't kill this; it just means the levers are tangled. Our job is not to ask "Is this a representation?" but "Under what interventions does this pattern become real?"

  ***

  ### For Your Slides (Steal These)

  **The "Real Pattern" Criterion for AI:**
  > "An internal state counts as a representation if and only if: (1) Positing it as a semantic entity provides better predictive compression of the system's behavior than lower-level weight descriptions; AND (2) Causal intervention on that state yields stable, predictable changes in output consistent with that semantics. Correlation is not representation; causal leverage is."

  **On Superposition:**
  > "Polysemanticity is not the death of representation; it is the death of *classical* representation. A direction in activation space does not represent a concept; it represents a *dimension of semantic variance* that is resolved by context. The representation is the projection, not the axis."

  **The Deflationist Trap:**
  > "Hewitt & Liang are right that decodability $\neq$ representation. But they are wrong to think this implies anti-realism. It implies that representation is a *functional* property, not a *structural* one. If the network doesn't use the feature to drive the output, the feature isn't represented—it's just noise we can read."
