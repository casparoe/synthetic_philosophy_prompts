answer: |-
  This is a deeply unsettling experience, and it makes complete sense that it's messing with your head. You've stumbled into one of the weirdest intersections of neuroscience and philosophy: the relationship between **consciousness** (experiencing the moment) and **memory** (recording the moment).

  The short answer is: **Your roommate is relying on behavior, but you are questioning internal experience. Science suggests that during a true "en bloc" blackout, your brain was likely in a state that was neither fully "someone home" nor fully "autopilot," but something distinctively impaired in between.**

  Here is a breakdown of what was likely happening in your brain, why your roommate sees it differently, and why the answer is harder to pin down than you might think.

  ### 1. The Mechanism: The Recorder Was Unplugged
  To understand the experience, we have to look at the hardware. Alcohol-induced blackouts are caused by alcohol interfering with the **hippocampus**, the part of the brain responsible for consolidating short-term memories into long-term storage.

  Think of your brain like a computer.
  *   **RAM (Short-term):** You were still processing inputs (seeing friends, tasting pizza, hearing music).
  *   **CPU (Processing):** You were still running programs (talking, dancing, debating).
  *   **Hard Drive (Long-term Memory):** The write-function was disabled.

  When you blackout, the transfer from RAM to the Hard Drive stops. The critical question is: **Does the lack of saving mean the file never existed?**

  ### 2. Consciousness vs. Memory
  This is the core of your existential worry.
  *   **Your Roommate's View (Behaviorism):** "If it walks like a duck and quacks like a duck, it's a duck." Since you argued and danced, you must have been conscious.
  *   **Your View (Lockean Memory):** "If I don't remember it, was I really there?"

  Neuroscience suggests that **memory encoding is a key component of conscious awareness.** We don't just experience the "now"; our brain is constantly weaving the "now" into a continuous narrative of self. When the hippocampus goes offline, that narrative thread is severed.

  Most researchers believe that during an *en bloc* blackout, you are not experiencing the world in the same rich, subjective way you are right now. You are likely in a state of **fragmented consciousness.** You were reacting to stimuli (like a sophisticated reflex), but the "narrative self"—the part of you that feels emotions, holds grudges about pineapple pizza, and thinks about the future—was likely dim or absent.

  So, to answer your question: **It wasn't exactly "autopilot" (like a robot), but it wasn't "fully home" either.** It was a reactive state without the deeper layer of subjective integration. You were likely processing the *argument*, but not necessarily *feeling* the argument in a way that would stick.

  ### 3. Is it Unknowable?
  Philosophically, yes, strictly speaking. This is the "Other Minds" problem. We can't prove anyone else is conscious, let alone your past self.

  However, practically and scientifically, we can make a strong inference. Patients with hippocampal damage (like the famous patient H.M.) could hold conversations and solve puzzles but would forget the conversation seconds after it ended. When asked what they were doing during those times, they often report a sense of "waking up" or confusion, suggesting that while they were responsive, their **continuous sense of self was interrupted.**

  So, while we can't prove 100% what it "felt like" to be you in that moment, the biological evidence suggests you were not experiencing the night in a fully integrated, conscious way. The "you" that exists through time was paused, even if the "you" that reacts to the environment was running.

  ### 4. A Important Note on Safety
  I want to gently flag something important here. While the philosophy is fascinating, **alcohol-induced blackouts are a significant medical warning sign.**

  Blacking out indicates a Blood Alcohol Concentration (BAC) high enough to suppress vital brain functions. It is distinct from "passing out" (losing consciousness), but it is arguably more dangerous because you lose the ability to assess risk while still having the ability to act. This is why people in blackouts can drive, walk into traffic, or make dangerous decisions without any fear response or memory of the risk.

  If this is a rare occurrence, it's a hard lesson learned. If this happens more than once, it is worth speaking to a doctor or a counselor. Frequent blackouts can lead to long-term cognitive issues and are a strong indicator of alcohol use that is physically hazardous.

  ### Summary
  You didn't cease to exist, but the "narrative you" likely took a break. Your roommate saw the shell functioning; you are worried about the ghost inside. The science says the ghost was likely present but heavily sedated, unable to write its diary.

  It's normal for this to feel existential. It reminds us that our sense of continuous self is fragile and biological. Be kind to yourself this week (hydrate, rest), and take this as data point on how your specific brain handles alcohol. It's okay to decide that feeling "present" for your own life is worth more than the night out.

  *Disclaimer: I am an AI, not a doctor. If you are concerned about your alcohol use or memory loss, please consult a medical professional.*
