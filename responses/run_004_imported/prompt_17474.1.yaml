      *   **The Conflict (The Core):** Address his internal struggle. Use his own words ("judged on how he fought"). Admit he didn't fully believe it. *Crucial:* Frame this doubt as a virtue, not a flaw. It shows he cared about right and wrong.
      *   **The Audience (Veterans):** Speak directly to the comrades. Acknowledge their bond. Reassure them that his doubt wasn't a betrayal of them.
      *   **The Philosophical Avoidance:** Do not name-drop Walzer or McMahan. Instead, talk about the "heavy questions" without trying to answer them. Acknowledge that history judges wars, but men judge men.
