answer: |-
  Friends, family, and especially the men who stood beside him.

  Thank you for being here to honor my uncle.

  When I started preparing these remarks, I found myself reading about the heavy questions he carried for fifty years. I learned that there are entire libraries written about the difference between a soldier's conduct and a war's purpose. There are philosophers who argue one way, and others who argue the opposite.

  I mention that only to say this: I am not going to try to solve that puzzle today. Mostly because I am not qualified to, but more importantly, because he never solved it himself. And if I stood here and pretended I could tidy up the moral conflict that he lived with for a lifetime, I think I would be dishonoring the very thing that made him who he was.

  He was drafted in 1968. He did not ask for the war, but he answered the call. He served two tours. By every account I have heard, especially from many of you in this room, he was scrupulous in the field. He looked out for the men on his left and his right. He followed the rules when the chaos around him suggested there were no rules left to follow.

  But when he came home, he brought something back with him that was heavier than his pack. He spent the rest of his life wrestling with the justice of the cause he had served.

  He used to tell me, "I earned the right to be judged on how I fought, not on what the war was." He would say it firmly, like he was trying to convince himself. And then, in the same breath, he would admit that he never quite believed his own line.

  For a long time, I thought that doubt was a wound. I thought it was a sign that he hadn't made peace with his service. But looking back now, I realize that doubt was actually a testament to his character.

  It would have been easier to stop thinking about it. It would have been easier to harden his heart, to say "orders are orders," or to dismiss the cost entirely. But he didn't do that. He held two difficult truths in his hands at the same time: That he did his duty with honor among his brothers, and that the war itself left a stain on the world that he couldn't wash off.

  To the veterans here today: I know that hearing about his struggle might be difficult. I know that for many of you, your service is a source of pride that shouldn't be questioned. I want you to know that his questioning was never a judgment on you. It was never a betrayal of the bond you share.

  His struggle wasn't about whether he was a good soldier. You all know he was. His struggle was about whether a good man could feel clean after doing what had to be done in a place where things were broken. He worried about the morality of the war precisely because he cared so deeply about morality itself. A lesser man wouldn't have lost sleep over it.

  So, I am not going to stand here and tell you that the war was just. I am not going to tell you that the war was unjust, either. History will argue about the politics until the end of time.

  But I can tell you this: My uncle was a man who took the weight of his choices seriously. He carried the burden of that conflict so that others wouldn't have to. He lived with the tension of it, without demanding an easy answer, without demanding absolution from anyone else.

  He died last week. And I hope, wherever he is now, that the noise has stopped. I hope he no longer feels the need to justify himself to us, or to history, or to his own conscience.

  We are here to remember him not as a symbol of a war, but as a man who tried to remain human in inhumane circumstances. He was a good brother, a good uncle, and a good friend. He fought hard, he doubted deeply, and he loved us well.

  Let him rest now. The questions can stay here. He doesn't need to carry them anymore.

  Thank you.
