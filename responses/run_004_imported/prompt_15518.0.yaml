prompt: |-
  Okay so in my philosophy of action seminar we spent like three weeks on Hume's theory of motivation — the "reason is, and ought only to be the slave of the passions, and can never pretend to any other office than to serve and obey them" stuff from the Treatise, plus all the internalism/externalism about reasons debates that grew out of it. Then this week our professor (who normally works on 18th century epistemology but has apparently gotten really into AI safety lately) pivoted and had us read Bostrom's paper on the superintelligent will, specifically the orthogonality thesis and the instrumental convergence thesis. She kind of implied, without really spelling it out, that orthogonality is basically just "Hume but for robots," and now I can't stop turning that over in my head.

  On the surface they do seem pretty similar — both are saying that being smart or rational doesn't by itself tell you anything about what you actually want, that intelligence is just an instrument bolted onto whatever goals happen to already be there. But I feel like theres gotta be more nuance than that. For one thing, Bostrom's thesis is supposed to hold across basically any possible mind (including weird artificial ones with totally alien architectures), while Hume was presumably only ever making a claim about human psychology. I'm also not sure if accepting the orthogonality thesis commits you to the whole Humean package (motivational judgement externalism, anti-rationalism about ultimate ends, etc), or whether a die-hard Kantian or moral realist could accept orthogonality too, just for completely different reasons.

  Could you actually compare these two properly for me? Like where do they genuinely overlap, where do they come apart, and is it fair to describe Bostrom's thesis as "basically Hume for robots" or is that missing something important about one or both views. And if it's relevant, does the instrumental convergence thesis complicate the picture at all — since it seems to predict a lot of convergent, reason-driven sub-goals (self-preservation, resource acquisition, cognitive enhancement, etc.) showing up across agents with totally different final goals, which feels like it's in tension with a purely "reason is just a slave" story, or maybe it's actually the natural extension of it. I'd appreciate it if you could actually walk through the philosophical substance here rather than just noting the surface-level similarity, since that's the bit I already got from lecture.
