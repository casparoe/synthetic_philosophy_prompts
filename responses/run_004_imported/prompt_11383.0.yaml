answer: |-
  **Letter Grade: B (15/20)**

  **Point-by-Point Feedback:**

  *   **Part (a) Universalism & Nihilism:** This is solid. You correctly identify Universalism as unrestricted composition and Nihilism as the denial of composite objects in favor of simples arranged accordingly. No issues here.
  *   **Part (b) Van Inwagen's Answer (The Life Thesis):** You correctly state the core thesis ("activity constitutes a single life"). However, you slip up on the implications: Van Inwagen does *not* count organs or limbs as composite objects unless they are themselves organisms (which hearts and leaves generally are not). For Van Inwagen, the organism is the only composite object; its parts are just simples caught up in the life.
  *   **Part (b) Trout-Turkey Case:** This is a significant error. You have the dialectical role of the case backward. Van Inwagen uses the trout-turkey to argue *against* Universalism (showing it yields absurd entities), not against Nihilism. He agrees with the Nihilist that there is no trout-turkey object; he uses the case to motivate why we need a restricted view like his Life Answer, rather than Universalism.
  *   **Part (c) Objection:** You correctly identify the "Common Sense" or "Revisionarity" objection (denial of artifacts).
  *   **Part (c) Evaluation:** Your defense of Van Inwagen (paraphrase strategy) is standard, but for a grad seminar, it's a bit thin. You assert that paraphrase keeps "everything we wanted to say" without engaging with whether paraphrase truly preserves truth conditions or merely offers an error theory. It's passable, but lacks critical depth.

