answer: |-
  The darkness in the drawing room was not merely an absence of light; it was a texture, heavy and velvety, pressing against Henry's eyelids. He sat in the high-backed chair, his spine straight out of habit, though his joints ached with the damp Cambridge chill. To his left, the medium breathed—a rhythmic, shallow sound. To his right, a colleague from the Society, stiff with anticipation. Their hands were joined in a chain across the mahogany table. Henry's palms were dry, cool. He kept them still. To move was to suggest, to invite error.

  He was seventy-two years old. The *Methods of Ethics* had been published decades ago, a monument of logic that now felt like a cage he had built for himself. In those pages, he had dismantled the intuitions of the moralists and the calculations of the hedonists, only to leave a ruin in the center. The Dualism of Practical Reason. It haunted him more than any specter could. If the universe is naturalistic, if death is the terminus of consciousness, then there is no rational necessity for a man to sacrifice his own happiness for the good of the whole. If the virtuous suffer and the wicked flourish, and the grave closes the ledger, then morality is a beautiful delusion. Reason commands egoism.

  He was here, in this dim room, not to comfort a grieving widow or to chase the thrill of the uncanny. He was here to save Reason from itself. He needed a crack in the material wall. He needed evidence that the ledger did not close at death.

  "Is everyone concentric?" the medium asked. Her voice was ordinary, lacking the theatrical tremolo of the stage mediums they had exposed in '84. That was why she was here. Ordinariness was a credential.

  "Yes," Henry said. His voice sounded thin in the absorbent dark.

  They waited. The silence stretched, becoming a physical pressure. Henry focused on the point where his thumb met the medium's index finger. He monitored the pressure. Was there a pulse of intention? Or just the blood moving in a living hand? He cataloged the sensations with the same scrupulous detachment he applied to a philosophical proposition. *Sensation: warmth. Sensation: slight tremor. Cause: indeterminate.*

  He thought of his friend Myers, dead these three years. Myers had believed in the subliminal self, in a vast reservoir of consciousness that survived the body. Myers had died confident. Henry envied him that confidence. It was a luxury Henry's intellect forbade him. To believe without sufficient evidence was a sin against the truth; to disbelieve in the face of possibility was a sin against hope. He was suspended in the agonizing middle.

  A sound came from the table. A single rap. Sharp, like a knuckle on wood.

  Henry's heart gave a single, hard thud, then slowed. He did not lean forward. He did not gasp. He waited for the second rap.

  It came, slower this time. *Tap.*

  "Did you feel that?" the colleague on his right whispered.

  "Silence," Henry murmured. "Observation requires quiet."

  He analyzed the sound. It was localized near the medium. Could it be her knee? The mechanism of the table leg? Fraud was always the null hypothesis. It had to be. To assume otherwise was to invite superstition back into the temple of science. And yet, if it *was* fraud, then the universe remained a closed system. The virtuous would die and vanish. The sacrifice of the self would be a biological error.

  Another rap. Closer. It seemed to vibrate through the wood, up his arm, into the marrow of his elbow.

  *Henry.*

  The name was not spoken; it was felt, a sudden drop in the air pressure, a whisper that might have been the settling of the house or the trick of his own desperate cognition. The human mind, he knew, was a pattern-seeking engine. It would conjure a face in the clouds to avoid the void. Was this merely his hunger projecting onto the noise?

  He wanted to believe. God, he wanted to believe. Not for the sake of heaven, but for the sake of the moral law. If the soul persists, then the conflict between duty and self-interest is resolved in the long run. Justice is possible. If not, then his life's work stood as a testament to a tragedy: that being good is reasonable only if one ignores the arithmetic of existence.

  "Ask," the medium whispered.

  Henry swallowed. "Is there a presence?"

  The table shifted. It was slight, a tilt of perhaps two degrees, enough to disturb the balance of the water glass placed at the center. Henry felt the wood move under his palms. He knew the weight of the table. He knew the strength of his own arms. He had not pushed. The colleague on the right had not pushed; Henry would have felt the tension in the hand.

  But was it a spirit? Or was it a muscular release, an ideomotor action unconscious and unseen? The evidence was real—the movement was a fact. The *cause* was the abyss.

  He sat in the dark, holding the hands of the living, waiting for the dead to speak the one sentence that could reconcile his ethics. *I am.* That was all he needed. Proof of continuity.

  The room remained silent. The table settled back onto its legs. The moment passed, dissolving into the static of the night. No voice confirmed the miracle. No hand materialized to stroke his cheek. There was only the breathing, the darkness, and the terrible, open question.

  "Light," Henry said softly.

  The match flared, stinging his eyes. The room returned to its mundane geometry: the heavy drapes, the dust motes dancing in the gaslight, the medium looking tired and pale. The table was just wood. The hands were just hands.

  He took out his notebook. His pen hovered over the page. He could write *phenomena unexplained*. He could write *probable fraud*. He could write *inconclusive*.

  He looked at the blank line. To declare it real was to lie. To declare it false was to lie. The universe offered him no compromise. He dipped the pen and wrote the date, the time, and the conditions. He described the rap, the tilt, the sensation. He described the lack of verification.

  He closed the book. The dualism remained. The moral law still hung in the void, unanchored. He stood up, buttoning his coat, preparing to walk back into the cold night, carrying the burden of a certainty he could neither claim nor discard. There was no answer in the room. There never was. There was only the rigorous, unending duty to keep looking.
