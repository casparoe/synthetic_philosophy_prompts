answer: |-
  Good evening. For those who don't know me, I am [Daughter's Name]'s father. For forty years, I was a field geologist. I spent my life hitting rocks with hammers and trusting that the strata beneath my feet were solid. In retirement, I decided to study philosophy, mostly to understand what my daughter has been doing for the last five years.

  I quickly learned that while rocks are happy to sit next to each other without explanation, propositions are not.

  I know that half the room is currently bracing for the moment I say something like, "Today, two hearts become one," or "They are now bound together." I promise I will not say that. I have read the dissertation. I understand that asserting a "unity" of persons requires a relation, which requires a further relation to connect it to the persons, leading to an infinite regress that never actually secures the unity it promises. To claim you are "one" would be to beg the question, and I would never insult the bride's work on her wedding day.

  However, as a geologist, I know that tectonic plates do not need a metaphysical justification to move in concert. They simply exert pressure, they shift, and eventually, they lock.

  This brings me to the catering. I was going to offer a philosophical analysis of this banquet. But I realized that if the relation between our hunger and this food requires a further relation to connect them, and that relation requires yet another, we will never actually eat. So, in the interest of digestion, I am choosing to treat the dinner as a brute fact.

  And that, I think, is the lesson for the couple. My daughter's work shows that logic cannot force the world to cohere. No amount of analysis can finally explain why things hang together. But love is not a conclusion derived from premises. It is a decision to stop the regress. It is the pragmatic choice to treat two lives as a single datum, not because the metaphysics are settled, but because the alternative is impossible to live with.

  [D Daughter's Name] and [Spouse's Name], you have not solved Bradley's Regress. No one has. But you have done something more impressive: you have agreed to act as if the problem doesn't exist. You are building a life where the "we" does not require a footnote.

  So, I will not ask what non-relational tie binds you. I will not ask for the truth-maker of your happiness. I will simply observe the fact of it.

  Please raise your glasses. To the couple: may your union be the one primitive tie in the universe that requires no further analysis. To [Daughter] and [Spouse].
