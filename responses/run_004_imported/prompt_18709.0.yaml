          *   BUT, Majority says $C$ is False.
          *   Therefore, Conclusion-based procedure says $C$ is False.
      *   **Individual Consistency:** Each character must adhere to the rule ($C \iff P \land Q$).
      *   **Profile Setup:**
          *   Person 1: $P=True, Q=True \rightarrow C=True$
          *   Person 2: $P=True, Q=False \rightarrow C=False$
          *   Person 3: $P=False, Q=True \rightarrow C=False$
          *   **Majority on P:** True (Person 1 & 2).
          *   **Majority on Q:** True (Person 1 & 3).
          *   **Majority on C:** False (Person 2 & 3).
      *   **Result:** Premise-based majority = True. Conclusion-based majority = False.

