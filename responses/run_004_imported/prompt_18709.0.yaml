  2.  **Deconstruct the Logic (Discursive Dilemma):**
      *   **Propositions:** $P$, $Q$, Conclusion $C$.
      *   **Rule:** $C$ is true if and only if ($P$ AND $Q$) are true. (Conjunction rule is the standard setup for the Doctrinal Paradox).
      *   **Characters:** A, B, C.
      *   **Goal:** Create a profile where:
          *   Majority says $P$ is True.
          *   Majority says $Q$ is True.
