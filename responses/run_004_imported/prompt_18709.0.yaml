answer: |-
  The rain blurred the city lights outside Mara's dining room window, turning the skyline into a smear of gold and grey. On the table, sandwiched between three empty wine glasses and a bowl of olives, lay the printed listing for the cabin in the Catskills.

  "We agreed on the rules," Elias said, tapping the paper. "Weekend getaway only. It has to be affordable, and it has to be drivable."

  "Define affordable," Julian muttered, rubbing his temples.

  "Under four hundred thousand, including the renovation estimate," Mara said. She was the accountant of the group; she held the spreadsheet. "And drivable means under two hours from the bridge. Those were the conditions. Both must be true. If either fails, we walk."

  "Okay," Elias said. He leaned forward, eager. "So let's look at this one. The price is three-eighty. The renovation guy said another ten grand. That's under four hundred."

  Mara nodded. "The numbers work. I've checked the comps."

  "And the drive?" Elias turned to Julian. "You drove the route last week."

  "Hour and forty-five minutes," Julian said. "In light traffic. Maybe two hours if there's an accident on the 87, but generally, yes. It's close."

  Elias spread his hands. "So. It's affordable. It's close. We buy."

  Mara shook her head. "I'm not buying it."

  "Neither am I," Julian said.

  Elias blinked. "Wait. We just established the facts. Mara, you said the price is good. Julian, you said the distance is good. By our own rule, if both are good, we buy."

  "It's not that simple," Mara said, pouring herself more water. "Yes, the price is right. But I looked at the property taxes. They're high. Even if the purchase price is under four hundred, the carrying cost feels wrong for me. So for me, the answer is no."

  "But the rule was purchase price," Elias said.

  "Let's not rewrite the rule," Julian interjected. "For me, it's the distance. Yes, it's under two hours on a good day. But I'm not doing the 87 every single Friday night. The risk of traffic makes it unreliable. So for me, the answer is no."

  Elias sat back, frustrated. "Okay, let's vote. Formal vote. All in favor of purchasing the cabin based on the criteria we set?"

  Elias raised his hand. Mara kept hers on her glass. Julian kept his on his temple.

  "Two against, one for," Mara said. "Motion fails."

  "This doesn't make sense," Elias said, his voice rising slightly. "We are a partnership. We agreed to make decisions based on the criteria. Let's vote on the criteria themselves. Separate votes. That's the only way to be objective."

  Mara sighed. "Fine. Vote on price. Is the purchase price under four hundred thousand?"

  "Yes," Elias said.
  "Yes," Mara said.
  "Yes," Julian said. "The price is fine."

  "Three yeses," Elias said. "Unanimous. Now vote on distance. Is it under two hours drive?"

  "Yes," Elias said.
  "No," Mara said. "I'm abstaining on the driving, but Elias and Julian agree it is."
  "Yes," Julian said.

  "Wait," Mara said. "I said the price was fine, but I'm still not buying."

  "And I said the distance was fine, but I'm still not buying," Julian added.

  Elias grabbed a napkin and a pen. "Okay, look. On the price question, the majority says Yes. Actually, all of us say Yes. On the distance question, the majority says Yes. Two out of three. So the group position is that the price is acceptable and the distance is acceptable."

  He drew a quick arrow on the napkin. *Price: Yes. Distance: Yes.*

  "So," Elias said, pointing to the arrow. "If the group accepts the price, and the group accepts the distance, then according to our rule, the group must accept the cabin."

  "But the group just voted No on the cabin," Mara said, pointing to the earlier hand count.

  "Because you're voting on the feeling, not the logic," Elias said.

  "I'm voting on my commitment," Mara countered. "I can agree that the number is under four hundred thousand and still not want to spend the money. I can agree the map says two hours and still not want to drive."

  "But then the rule means nothing," Elias said. "If we vote on the outcome directly, the criteria don't matter. If we vote on the criteria, the outcome is forced. We can't do both."

  "Well we have to do one," Julian said.

  "Which one?" Elias asked.

  "The one that says we don't buy," Mara said.

  "The one that says the criteria are met," Elias said.

  They sat in silence for a moment. The rain tapped harder against the glass. The listing on the table seemed to pulse under the lamp light, the numbers and the mileage staring up at them, perfectly consistent individually, impossible to reconcile collectively.

  Julian picked up his wine glass, then set it down without drinking. "So," he said. "If we vote on the reasons, we buy. If we vote on the result, we don't."

  "Apparently," Mara said.

  Elias looked from one to the other, the pen hovering over the napkin. He had written *Group Decision?* at the bottom of the page. He hadn't filled in the blank.

  "So what do I tell the seller?" Elias asked.

  Mara and Julian looked at each other, then back at Elias. Neither spoke.
