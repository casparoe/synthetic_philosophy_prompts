      *   **The Problem:** Explain Conditional Convergence simply. The "Riemann Rearrangement" issue. The lack of Absolute Convergence means the Law of Large Numbers doesn't apply.
      *   **Charter Compliance:** "Highest EV" implies a comparable number. Undefined $\neq$ Number.
      *   **Risk:** 100x stakes makes the tail risk (infinite variance) unacceptable for a small fund.
      *   **Policy:** Future proposals with unbounded payoffs must demonstrate absolute convergence ($E[|X|] < \infty$).

  7.  **Review against Constraints:**
