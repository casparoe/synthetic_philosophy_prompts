  The device on the table looked less like a weapon and more like a Geiger counter mated to a toaster. A single electron source, a splitter, and a relay connected to the firing pin of the revolver sitting beside it.

  "Five hundred to one," Elias said, his voice calm, detached. He wasn't checking the chamber; he didn't need to. The quantum state decided the bullet's path, not the mechanical alignment. "Statistically, I should be dead."

  Sarah stood in the doorway, her arms wrapped around herself as if holding in warmth that was leaking away. She had seen this before. Not this specific setup, but the aftermath of the others. The car accident where the truck missed him by inches. The balcony railing that gave way under his weight while hers held firm. The anaphylactic shock that vanished seconds after the EpiPen was retrieved.

  "You won't be dead," Sarah said. "You never are."

  "Because consciousness follows the surviving branch," Elias said, picking up the gun. It was heavy, cold. "It's the only logical conclusion of Many-Worlds. I cannot experience my own absence. If the trigger pulls, I simply… continue in the world where it didn't."

  "And what about me?" Sarah asked. Her voice was quiet, but it carried a weight that made the air in the room feel thick.

  Elias paused, the cylinder spinning with a soft whir. "You're entangled with the outcome. If I survive, you're here. If I die…"

  "If you die, I'm there," Sarah interrupted. "In the branch where your brain stops. I'm there cleaning up the blood. I'm there telling your mother. I'm there waking up every morning for the next forty years in a house that smells like your coffee but doesn't have you in it."

  Elias frowned, lowering the gun slightly. "But you're *here*. In this branch. With me. You don't experience the death branches."

  "I know the math, Elias." Sarah stepped into the room, her eyes dry and exhausted. "I know that for every version of me standing here talking to you, there are four hundred and ninety-nine versions of me who are widows. You feel immortal because you only count the successes. I feel haunted because I know the cost of your success."

  "That's not how probability works for the observer," Elias said, though his certainty wavered. He had read the papers, worked through the logic puzzles. Quantum immortality guaranteed *his* continuity. It promised nothing for anyone watching him. "You're safe in this branch."

  "Am I?" She walked to the table, running a finger over the cold metal of the detector. "You think this proves you're special. That consciousness persists. But all it proves is that you are willing to slaughter infinite versions of us to keep your own thread intact."

  "It's not slaughter if I don't experience it."

  "It's slaughter for *me*!" Sarah's voice cracked. "You talk about branching like it's a tree growing upward. For you, it is. You only climb the limbs that hold. For me, the tree is shattering. Every time you test this, you prune away the versions of us that are normal. You force us into the outliers."

  She looked at him, and for the first time, Elias saw not fear for his life, but pity.

  "You can't test cancer," Elias muttered, deflecting. "It has to be discrete. A sudden event. Aging doesn't count. Illness doesn't count. It has to be binary."

  "So you choose violence," Sarah said. "Because you need the split to be clean. You need to know exactly when you cheated death."

  "I need to know I'm right."

  "You know you're right," Sarah said. "That's the problem. You're becoming a god in your own reality, Elias. But gods live alone. Do you understand where you're going? If you pull that trigger, and the odds drop to one in a million… and then one in a billion… the measure of the branch where we are together becomes so thin it's practically zero."

  She stepped back toward the door.

  "Where are you going?" Elias asked.

  "Away from the line of fire."

  "You can't avoid the branching. Decoherence happens regardless of where you stand."

  "I'm not trying to stop the branching," Sarah said, her hand on the doorknob. "I'm trying to stop being the witness. You say nobody follows you into the branch where you survive. That's true. But nobody follows you into the branch where you die, either. They stay behind."

  She opened the door. The hallway beyond was dim, ordinary, stable.

  "If you do this," she said, "the version of me in this room survives. But I know what the others are feeling. I know that the vast majority of 'Sarahs' are currently grieving a husband who threw his life away to prove a point. I am carrying the grief of a multiverse, Elias. I am the one-in-a-billion anomaly, and it feels like a curse."

  "Stay," Elias said. "If I survive, we win. We know the secret of existence."

  "There is no secret," Sarah said. "There's just selection bias. You're selecting for a reality where you never leave. I'm selecting for a reality where I don't have to watch you try."

  "You'll still branch," Elias insisted. "There will be versions of you that stay."

  "Yes. And versions of me that leave. But the versions that leave don't have to watch the gun fire. They don't have to see the flash and wonder if this is the time the math finally catches up to you." She looked at the gun, then back at his eyes. "You think quantum immortality means you can't die. It doesn't. It just means you can't stop watching yourself survive. It's not immortality, Elias. It's solitary confinement."

  She stepped into the hallway.

  "Sarah, wait. If I don't do this, I never know."

  "You know," she said softly. "You've always known. That's why you're still here. And that's why I'm leaving. I love you. But I love the versions of me who get to bury you more. At least their grief is normal. At least their loss makes sense."

  "Sarah!"

  She closed the door.

  Elias stood alone in the silence of the room. The device hummed, a low, electric waiting. He looked at the gun. He looked at the empty doorway.

  The asymmetry was absolute. If he pulled the trigger, he would hear the click. He would feel the relief. He would continue. But the woman who would share that relief was already gone. She had chosen to populate the branches where she wasn't there to see him survive, because being the witness was the only death she couldn't come back from.

  He realized then that the immortality wasn't a shield. It was a sieve. It filtered out everyone who couldn't bear the odds.

  Elias set the gun down on the table. He didn't need to pull the trigger to know the result. He was already alone in the surviving branch. The only variable left was how long he could stand the silence.

  He turned off the device. The hum died. For the first time, the future felt mortal. It felt heavy. It felt real.

  He walked to the door and opened it. The hallway was empty. He began to walk, not toward the certainty of survival, but toward the uncertainty of a world where he might finally be allowed to end.
