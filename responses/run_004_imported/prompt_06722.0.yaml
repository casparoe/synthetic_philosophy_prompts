answer: |-
  It is a pleasure to speak with a colleague from the physical sciences. You have hit on exactly the friction point where the rigorous formalism of measure theory rubs up against our physical intuition about processes unfolding in time.

  As a physicist, your instinct is to treat the index $n$ as a time parameter. In the lab, if I measure a signal at $t_1, t_2, t_3$, the order is physically mandated by causality. Summing in any other order would be unphysical.

  However, the philosophical bite of the Pasadena Paradox relies on a specific distinction in how we model the gamble: **The payoff is not a stream of income accumulated over time; it is a single lump sum determined by a state of the world.**

  Here is the intuition for why the rearrangement matters, why "natural order" is philosophically suspect in this context, and how the Altadena variant breaks the machinery of decision theory.

  ### 1. The Sample Space as a Coordinate System

  In your perturbation theory days, you know that a physical observable must be independent of the basis set or coordinate system used to calculate it. If I calculate the energy of a system using Cartesian coordinates and you use Spherical coordinates, we must get the same number. If the result depends on the coordinate chart, the quantity is not a well-defined observable.

  In probability theory, the "sample space" $\Omega$ is just a set of possible outcomes. In the Pasadena game, an outcome is "Heads first appears on toss $n$." Let's call this outcome $\omega_n$.
  The gamble is a function $X: \Omega \to \mathbb{R}$ where $X(\omega_n) = (-1)^{n+1} \frac{2^n}{n}$.
  The probability measure is $P(\{\omega_n\}) = \frac{1}{2^n}$.

  The expected value is the Lebesgue integral $\int_\Omega X \, dP$.

  Here is the crux: **The set $\Omega$ has no intrinsic order.** It is just a bag of outcomes. The indexing $n=1, 2, 3...$ is a labeling convention we impose on the bag, much like assigning coordinates to points in space.

  When you insist on summing in the order $n=1, 2, 3...$, you are privileging one specific coordinate system (the "temporal labeling") over all others. But why should the *value* of the gamble depend on how we chose to label the outcomes?

  Imagine I relabel the outcomes. I decide to call "Heads on toss 2" outcome $\#1$, and "Heads on toss 1" outcome $\#2$. The physical game hasn't changed. The payoffs attached to the physical events haven't changed. The probabilities haven't changed. But if I sum according to my new labels, I am effectively rearranging the series.

  If the Expected Value is supposed to represent the "fair price" or "intrinsic worth" of the gamble *ex ante*, it must be a property of the gamble itself, not a property of the gamble plus our filing system. Because the series is only conditionally convergent, the "value" changes if I change the filing system. Therefore, there is no unique intrinsic value.

  ### 2. Why "Time" Doesn't Save Us

  Your objection is that the tosses happen in time. This would be decisive if the game were a **stochastic process** where you collect payoff $x_1$ at $t_1$, then $x_2$ at $t_2$, etc. In that case, the accumulation is temporal, and the order is fixed by physics.

  But the Pasadena game is defined as a **random variable**. You do not receive money after every toss. You flip until Heads, and *then* you receive the payout determined by $n$.
  From the perspective of the decision maker standing before the game starts, the "time" of the tosses is internal to the mechanism of the randomizer, not the timeline of the payoff.

  To use a physics analogy: Imagine a charge distribution $\rho(\vec{r})$ that extends to infinity. You want to calculate the total charge $Q = \int \rho \, dV$.
  If the integral is absolutely convergent, $Q$ is well-defined.
  If the integral is only conditionally convergent, the total charge depends on the *shape of the boundary* as you take the limit to infinity (spherical vs. cubic vs. cylindrical).
  The "temporal order" of the Pasadena game is analogous to choosing a specific boundary shape (say, a specific spiral that expands outward). Why is that boundary shape physically privileged for calculating the *total* value? If the quantity is a state function (the Value of the Gamble), it shouldn't depend on the path of integration (the order of summation).

  ### 3. The Altadena Paradox: Breaking Dominance

  The Pasadena paradox is annoying, but one could arguably live with "undefined values." The Altadena variant (also Hájek & Nover) shows that accepting the Pasadena setup breaks core axioms of rational choice, specifically **Dominance**.

  **The Setup:**
  *   **Game P (Pasadena):** Payoff $X_n$ as described above.
  *   **Game A (Altadena):** Payoff $Y_n = X_n + 1$.

  **The Dominance Principle:**
  If Game A pays strictly more than Game P in *every possible outcome*, a rational agent must prefer A to P.
  Here, for every $n$, $Y_n > X_n$. So, rationality demands $A \succ P$.

  **The Expectation Problem:**
  In standard decision theory, we justify preference by comparing Expected Values. We want to say $E[A] > E[P]$.
  Linearity of expectation suggests $E[A] = E[P] + 1$.

  However, if $E[P]$ is undefined (because the sum is order-dependent), then $E[A]$ is also undefined.
  Worse, because both series are conditionally convergent (the $+1$ term sums to 1 absolutely, but it's added to the conditionally convergent alternating harmonic part), we can rearrange the terms of $P$ to sum to $1,000,000$ and rearrange the terms of $A$ to sum to $0$.

  If we allow order-dependent expectations to guide decision making, we arrive at a contradiction:
  1.  State-by-state, $A$ is better than $P$.
  2.  By summing $P$ in one order and $A$ in another, we can calculate $E[P] > E[A]$.
  3.  If we choose based on calculated expectation, we choose $P$.
  4.  If we choose based on dominance, we choose $A$.

  This creates a conflict between two fundamental principles of rationality: **Dominance** (choose the better outcome) and **Expectation** (maximize calculated value). The paradox shows that if you allow conditionally convergent expectations, you cannot satisfy both. Most philosophers argue Dominance is the more robust requirement, which implies we must reject the expectation calculation entirely.

  ### 4. The Kolmogorov Standard

  You mentioned you haven't doubted the math, and indeed, the math community essentially agreed with the philosophers on this one a century ago.

  Andrey Kolmogorov, in his 1933 axiomatization of probability, defined the expectation $E[X]$ **only** if $E[|X|] < \infty$ (absolute convergence).
  $$ \int |X| \, dP < \infty $$
  If this condition isn't met, the expectation is formally **undefined**.

  The Pasadena Paradox is essentially a "Gotcha!" for decision theorists who tried to extend the concept of Expected Utility beyond the Kolmogorov definition. It demonstrates *why* Kolmogorov drew the line where he did. If you step outside the realm of absolute convergence, you lose:
  1.  **Order Independence:** The value depends on the summation index.
  2.  **Linearity:** $E[X+Y] = E[X] + E[Y]$ can fail.
  3.  **Dominance:** You can prefer a dominated gamble based on summation tricks.

  ### Summary Intuition

  As a physicist, you can think of Expected Utility as a **State Function** of the gamble.
  *   **Absolute Convergence:** The integral is path-independent. The State Function is well-defined.
  *   **Conditional Convergence:** The integral is path-dependent. The "Value" is not a property of the state, but of the process used to measure it.

  The "natural order" of the tosses is just one path through the state space. Since there is no physical law mandating that the *valuation* of the gamble must follow the *causal generation* of the outcome (especially since the payoff is lump-sum), privileging that order is arbitrary.

  The Altadena paradox tightens the screw by showing that this arbitrariness isn't harmless; it allows you to violate the principle that "more money is better than less money."

  **The Verdict:** The consensus in formal epistemology is largely that the Pasadena game has **no expected value**. This doesn't mean you can't play it; it means Expected Utility Theory is the wrong tool for this specific job. You would need a more generalized decision theory (perhaps one based on imprecise probabilities or stochastic dominance directly) to handle it without contradiction.

  It is a beautiful example of how a subtle point in analysis (conditional convergence) can dismantle a high-level philosophical framework (Utilitarianism/Decision Theory) if one isn't careful about the domain of applicability.
