  *(Self-Correction during drafting)*: I need to be careful not to say Mach *definitely* loses. Mach argues that the vacuum scenario is physically meaningless because you can't isolate the universe. But within the logic of the *Principia*, Newton wins. Cate needs to navigate this. I should emphasize that the Globes argument shifts from "measuring" motion (Bucket) to "defining" motion in isolation (Globes).

