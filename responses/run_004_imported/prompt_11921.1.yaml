      *   *Thesis:* The friend is partially right (it *looks* like a cop-out if read dogmatically), but ultimately wrong because she is assuming a realist framework of what a "thesis" is. Nagarjuna isn't avoiding the charge; he is dissolving the framework that makes the charge possible.
