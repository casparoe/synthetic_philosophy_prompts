      *   **Synthesis/Verdict:** Argue that the *Prasanga* + Two Truths reading is superior. The "thesis" denied is a *svabhava*-laden thesis. His arguments are therapeutic, not constructive. The friend sees a system; Nagarjuna offers an antidote.
