      *   **Organic Unities (Chapter 6):** The value of a whole is not necessarily the sum of the values of its parts.
      *   **The Hierarchy of Goods:**
          1.  Greatest goods: Consciousness of beauty + appropriate emotion (Aesthetic enjoyment).
          2.  Great goods: Personal affection (love/friendship).
