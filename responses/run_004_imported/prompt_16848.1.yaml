  8.  **Final Polish:** Ensure tone is academic yet accessible for a student project. (Self-Correction: Avoid getting too bogged down in meta-ethics; keep it focused on the normative claims in Chapter 6).

  *(Self-Correction during drafting)*: I should be careful not to imply Moore thinks the *object* causes the value. Moore is a non-naturalist. The value supervenes on the existence of the object. But the *great* value supervenes on the complex state of affairs involving consciousness.

