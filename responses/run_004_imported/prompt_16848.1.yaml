      *   **Point 5: Sympathetic Interpretation/Resolution.** The tension is resolved by distinguishing between *value simpliciter* (having some value) and *supreme value* (having the most value). Consciousness isn't the *source* of all value, but it is the *multiplier* or the necessary condition for the *highest* forms of value.

