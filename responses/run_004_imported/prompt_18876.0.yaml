  2.  **Deconstruct the Required Topics & Brainstorm Objections:**

      *   *Topic 1: Disjunction (Truth-functionality).*
          *   *Issue:* $A \lor \neg A$ is true, but neither $A$ nor $\neg A$ is true. This violates classical truth-functionality.
          *   *Standard Reply:* Supervaluationism isn't truth-functional; it preserves validity, not compositionality.
          *   *Press:* Does this break the connection between truth and assertion? If I can't assert $A$ and can't assert $\neg A$, how can I assert the disjunction? Isn't "true" supposed to be the norm of assertion?
          *   *Drafting Q1:* Focus on the disconnect between the truth of the compound and the assertibility of the parts.

      *   *Topic 2: Thin Red Line (TRL) vs. Gaps.*
          *   *Issue:* Why not just say one future is *the* future?
          *   *Standard Reply:* TRL violates the intuition of openness/metaphysical indeterminacy. It smuggles in determinism.
          *   *Press:* But TRL handles logic better. If you reject TRL for metaphysical reasons, does your semantics actually capture that metaphysics, or does it just model our ignorance? Is the "gap" ontological or semantic?
          *   *Drafting Q2:* Challenge the metaphysical payoff vs. the logical cost.

      *   *Topic 3: Retroactive Truth.*
          *   *Issue:* Today $A$ is indeterminate. Tomorrow $A$ happens. Is it *now* true that $A$ was going to happen?
          *   *Standard Reply:* Yes, truth supervenes on history. Once the history is selected, past predictions are evaluated against it.
          *   *Press:* Does this mean the *past* truth value changes? Or just our assessment? If the proposition expressed today is the same, how did its value change without the proposition changing?
          *   *Drafting Q3:* Focus on the metaphysics of time and truth bearers.

      *   *Topic 4: Ordinary Assertion.*
          *   *Issue:* People say "It will rain" confidently. Supervaluationism says this is often a gap.
          *   *Standard Reply:* Assertibility $\neq$ Truth. We assert what is likely or settled enough.
          *   *Press:* If truth is the norm of assertion (Williamson), you're in trouble. If you deny that, what is the norm? And if the norm is "settledness," why keep the label "truth" for the supervaluationist property?
          *   *Drafting Q4:* Press on the norm of assertion and the definition of truth.

      *   *Topic 5: Divine Foreknowledge.*
          *   *Issue:* Can God know a gap?
          *   *Standard Reply:* No, there's nothing to know. Omniscience is knowing all truths; gaps aren't truths.
          *   *Press:* Does this limit divine perfection? Or does it imply God is in time? If God sees all times at once (eternalism), how can there be gaps for Him?
          *   *Drafting Q5:* Connect semantics to theology/metaphysics of God's temporality.

