answer: |-
  Here are ten interview questions designed for a specialist audience, focusing on technical objections and semantic commitments rather than introductory exposition.

  **1. The Truth-Functionality Gap**
  On the supervaluationist account, the disjunction "There will be a sea battle or there will not" is determinately true, even though neither disjunct is. This preserves Excluded Middle but severs the classical link between the truth of a compound and the truth of its constituents. If truth is supposed to be a transparent property that explains why we accept logical compounds, doesn't this make "truth" inert? If I can't point to the truth of either disjunct to explain the truth of the disjunction, what work is the property of *super-truth* actually doing, other than saving a classical theorem?

  *   **Follow-up:** You might reply that truth isn't always explanatory, or that validity is the real target. But if super-truth doesn't compose, doesn't that break the connection between truth and rational belief? If I believe $P \lor Q$ because it is super-true, but I have no reason to believe $P$ and no reason to believe $Q$, isn't my belief in the disjunction epistemically ungrounded?

  **2. Supervaluationism vs. The Thin Red Line**
  Many semanticists argue we can keep bivalence and branching time by positing a "Thin Red Line"—a single designated history that is *the* actual future, even if it isn't causally settled. You reject this in favor of truth-value gaps. But isn't the Thin Red Line semantically cheaper? It handles conditionals and quantifiers without the complexity of supervaluation. Is your rejection of the Thin Red Line driven by the semantics, or is it a metaphysical prejudice against determinism that your semantics is being forced to carry?

  *   **Follow-up:** Suppose you say the Thin Red Line violates the intuition of "openness." But does supervaluationism actually *capture* openness, or does it just model our ignorance? If the semantics treats all histories symmetrically, where does the metaphysical contingency enter, other than as a brute constraint on which histories are "possible"?

  **3. Retroactive Truth-Fixing**
  Consider a future contingent $F$ uttered today. On your view, it currently lacks a truth value. Tomorrow, the event occurs. We would normally say, "It was true yesterday that this would happen." Does your view allow the truth value of yesterday's utterance to change retroactively once the gap closes? If yes, how do you handle the metaphysics of time where past facts are supposed to be fixed? If no, how do you account for the strong intuition that the past prediction is *verified* by the present outcome?

  *   **Follow-up:** A common move is to say the *proposition* expressed is evaluated relative to different contexts of assessment. But if the proposition is the same, and truth is a property of propositions, how can the property change without the proposition changing? Are you committed to a relativist metaphysics of truth bearers to make this work?

  **4. The Norm of Assertion**
  Ordinary speakers flatly assert future contingents like "It will rain tomorrow" without hedging. On your account, most of these assertions express propositions that are neither true nor false. If, as Williamson argues, the norm of assertion is knowledge (which entails truth), then speakers are systematically violating norms. Do you deny the knowledge norm, or do you argue that speakers are asserting something else, like "It is settled that..."?

  *   **Follow-up:** If you argue they are asserting "settledness," aren't you effectively changing the subject? The phenomenology of prediction is about how the world *will be*, not about the current modal status of the world. If your semantics forces us to paraphrase ordinary speech to save the theory, isn't that a cost that outweighs the benefit of preserving Excluded Middle?

  **5. Divine Foreknowledge and Omniscience**
  Traditional theology defines omniscience as knowing all true propositions. If future contingents lack a truth value, an omniscient being cannot know them. Does your view commit you to Open Theism? And if so, how do you reconcile this with the intuition that a perfect being should not be ignorant of any fact about reality, even if that fact is "in the making"?

  *   **Follow-up:** You might reply that there is "nothing to know," so God isn't ignorant. But if God is outside of time (eternalist), He sees the future as present. If the future is genuinely indeterminate for us, is it also indeterminate for an eternal observer? Or does your semantics require God to be temporal, waiting for truth values to crystallize just like we do?

  **6. The Vagueness Analogy**
  Supervaluationism was originally developed by Kit Fine to handle semantic vagueness (e.g., "This is a heap"), where the indeterminacy is clearly linguistic. Future contingency, however, is often motivated by *metaphysical* indeterminacy. By importing a semantic solution to a metaphysical problem, aren't you committing a category mistake? Does treating possible futures like "precisifications" of a predicate inadvertently reduce ontological openness to mere semantic under-specification?

  *   **Follow-up:** If you insist the analogy holds, consider that we can precisify "heap" by stipulation, but we cannot stipulate the future. If the "histories" in your semantics are not just semantic tools but represent real metaphysical possibilities, doesn't the supervaluationist machinery obscure the very real distinction between semantic indecision and worldly indeterminacy?

  **7. Conditionals and Modus Ponens**
  Supervaluationism is notorious for problems with conditionals. If $A$ is a future contingent and $B$ is a necessary truth, $A \to B$ comes out super-true (since $B$ is true on all histories). But intuitively, "If there is a sea battle, $2+2=4$" seems inappropriate or false. Worse, some formulations of supervaluationism invalidate Modus Ponens for the material conditional. Does your specific implementation sacrifice inference rules that are essential for practical reasoning about the future?

  *   **Follow-up:** You may adopt a non-material conditional, but then you face the question of whether the logic of future discourse diverges radically from classical logic. If a sailor cannot reason "If there is a battle, I will fight; there will be a battle; therefore I will fight" without risking invalidity, hasn't the semantics failed to model the rationality of the agents using it?

  **8. The "Actually" Operator**
  In branching time semantics, we often use an "Actually" operator to pick out the current history. But if there is no unique actual future, how does "Actually" function for future-tense statements? Does "Actually, there will be a sea battle" express a proposition that is true, false, or a gap? If it's a gap, then "Actually" fails to resolve the indeterminacy. If it's true/false, haven't you just reintroduced a Thin Red Line under the guise of an indexical?

  *   **Follow-up:** If you say "Actually" shifts the context to a specific history, who determines that context? Is it the speaker? The world? If it's the speaker, then truth becomes speaker-relative in a way that seems to undermine the objective status of the prediction. How do you fix the reference of "Actually" without collapsing back into bivalence?

  **9. Assessment Sensitivity vs. Supervaluationism**
  John MacFarlane has argued that supervaluationism fails to capture the "rightness" of later assessments. When I say "It will rain" and it does, you say I was neither right nor wrong *at the time*. MacFarlane suggests truth should be relative to the context of *assessment*, not just use. Why should we prefer your complex semantics of gaps over a simpler relativism where the proposition is true relative to the future history from which it is assessed?

  *   **Follow-up:** A key advantage of relativism is it explains retraction norms (I should retract my claim if it doesn't rain). Supervaluationism struggles to explain why I should retract a claim that wasn't false when I made it. Does your view have the resources to explain the normativity of retraction without borrowing from relativism?

  **10. Logical Consequence and Deductive Practice**
  Supervaluationism defines validity as the preservation of super-truth. However, there is a gap between preservation of super-truth and preservation of *assertibility*. In a multi-premise deduction, premises might be super-true individually but jointly incompatible on some histories. Does your notion of consequence guarantee that a reasoner who asserts the premises is committed to the conclusion? Or does the semantics allow for cases where the premises are assertible, the inference is valid, but the conclusion is not?

  *   **Follow-up:** If you admit such cases exist, you are effectively admitting that classical logic does not govern future discourse, despite your efforts to save Excluded Middle. If the goal is to preserve classical logic, but the *practice* of deduction breaks down, have you saved the letter of classical logic at the expense of its spirit?
