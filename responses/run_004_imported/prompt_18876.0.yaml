          *   *Idea 8: Vagueness vs. Future Contingents.* Supervaluationism was built for vagueness (Fine). Does importing it to time commit a category mistake? Vagueness is semantic; future contingency is metaphysical.
          *   *Idea 9: The "Valid Inference" Intuition.* If $P \models Q$, does asserting $P$ commit you to $Q$? In supervaluationism, validity is preservation of super-truth. But does this match deductive practice?
          *   *Idea 10: Contextualism vs. Relativism.* Is the truth relative to the context of use or context of assessment? (MacFarlane's critique).

  3.  **Drafting and Refining the Questions (Iterative Process):**

      *   *Refining Q1 (Disjunction):* Make sure to mention truth-functionality explicitly. Follow-up: Press on whether "truth" still plays its explanatory role if it doesn't compose.
      *   *Refining Q2 (TRL):* Focus on the "metaphysical cost." Follow-up: Ask if the semantics *explains* openness or just *accommodates* it.
      *   *Refining Q3 (Retroactivity):* Use the term "retroactive truth-fixing." Follow-up: Distinguish between *propositional* change and *truth-value* change.
      *   *Refining Q4 (Assertion):* Bring in Williamson's norm. Follow-up: Ask if "super-truth" is just "truth" by name only.
      *   *Refining Q5 (Theology):* Connect to Eternalism vs. Open Theism. Follow-up: If God knows the actual future (TRL style), is He wrong on your view?
      *   *Refining Q6 (Vagueness Analogy):* This is a strong specialist point. Kit Fine's original use was vagueness. Future contingency is different. Follow-up: Is the "precision" of a history analogous to "precisification" of a predicate?
      *   *Refining Q7 (Conditionals):* The material conditional fails ($A \to A$ is true, but if $A$ is gap, $A \to A$ might be problematic depending on formulation). Better: Indicative conditionals. If I say "If it rains, I'll stay in," and it's a gap whether it rains, is the conditional true?
      *   *Refining Q8 (The "Actually" Operator):* In branching time, "Actually" picks out the current history. But if there is no unique actual future, how does "Actually" function for future tense?
      *   *Refining Q9 (Relativism/Assessment):* John MacFarlane's assessment-sensitive truth. Supervaluationism is usually context-of-use. Does this fail to capture the "rightness" of later assessments?
      *   *Refining Q10 (Logical Consequence):* Classical logic holds, but does *deduction* hold? If I infer $Q$ from $P$, and $P$ is super-true, $Q$ is super-true. But what if I reason about gaps?

