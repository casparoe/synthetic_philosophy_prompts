answer: |-
  You are not missing anything obvious. In fact, you've stumbled onto a classic concept in probability and economics called a **Dutch Book**.

  Here is the breakdown of why the math works, why it's happening, and whether you should exploit it.

  ### 1. The Math: Why you have a guaranteed win
  In a coherent prediction market, if you have a set of outcomes that are **mutually exclusive** (only one can happen) and **exhaustive** (one *must* happen), the sum of their probabilities (or prices) must equal **100**.

  Your PM's prices:
  *   Q3: 45
  *   Q4: 40
  *   Next Year: 35
  *   **Total: 120**

  Because the total is 120, the market is over-pricing risk. By taking the opposite side (effectively "selling" all three outcomes), you collect **120 points** in premiums. Since only one outcome can actually occur, you will only have to pay out **100 points** when the feature ships.

  **Your Profit:** 120 (collected) - 100 (paid out) = **20 points guaranteed.**

  This isn't just him being "bad at guessing." If he said 90% for Q3 and 90% for Q4, that's bad calibration. But summing to 120% is a **logical inconsistency**. It implies he is 120% certain that the feature will ship, which is impossible.

  ### 2. Why is he doing this?
  Since he's into poker, he should theoretically understand odds, but there are two likely psychological reasons for this error:

  1.  **Overconfidence Bias:** He might feel strongly about each timeline individually without considering them as a closed system. He thinks, "There's a good chance it's Q3," and "There's a decent chance it's Q4," without doing the sum check.
  2.  **Misunderstanding the Contract:** In poker, you bet on specific hands. In prediction markets, you are pricing a partition of reality. He might be treating these as three independent binary bets rather than one ternary event.

  ### 3. The Ethics: Sharp Trader or Jerk Move?
  This depends entirely on the culture of your team and the stakes involved.

  **The Argument for "Sharp Trader":**
  *   It's fake money. No one is actually losing rent money.
  *   Markets need arbitrageurs to correct prices. By taking these trades, you are technically signaling that the prices are wrong.
  *   He offered the prices; you accepted them. That's the game.

  **The Argument for "Jerk Move":**
  *   **It's a work relationship.** Making a colleague look mathematically incompetent in a public Slack channel (even quietly) can be awkward if they realize later.
  *   **It kills the fun.** If the bot is for team bonding and estimation practice, silently draining the "bank" because of a logic error turns a game into a lecture.
  *   **He's a PM.** Part of his job is risk assessment. Exploiting a fundamental error in his risk assessment might be seen as undermining him, even if it's just a game.

  ### The Verdict
  **Don't do it silently.**

  Since this is an internal tool with fake points, the "profit" is meaningless except for bragging rights. However, the **teaching moment** is valuable.

  If you quietly take the trade, you win 20 fake points, and he eventually loses 20 fake points and might just think he got unlucky. He won't learn anything.

  **Better approach:**
  Call him out, but do it nicely. Send him a DM like:

  > "Hey, I was playing around with the bot and looked at your prices on the [Feature] ship date. I think the bot might have a quirk or I'm misunderstanding the pricing, but 45 + 40 + 35 sums to 120. Since one of those has to happen, doesn't that create a Dutch Book where someone can guarantee a profit against you? Just wanted to check before I accidentally broke the market!"

  **Why this is better:**
  1.  **It saves face:** You frame it as *you* checking if *you* understand the bot, rather than "You are bad at math."
  2.  **It leverages his interest:** Since he likes poker, he will likely appreciate the "Dutch Book" concept once you point it out. He might actually find it cool.
  3.  **It improves the team:** Better probability calibration helps the whole team estimate work better. That's actually valuable for your company.

  **Summary:** You found a logic bug in his probability model, not just a bad guess. Exploiting it silently is technically "winning," but pointing it out is "team building." Go with team building.
