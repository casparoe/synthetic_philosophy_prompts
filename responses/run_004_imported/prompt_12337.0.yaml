answer: |-
  **MEMORANDUM**

  **TO:** Research Integrity Committee
  **FROM:** [Your Name], Department of Philosophy
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Case #2023-04 and Proposal for Evidentiary Standards

  **I. Introduction**

  We remain deadlocked on Case #2023-04 regarding the allegation of data falsification (omission of outliers) by a principal investigator. The impasse stems from a fundamental disagreement on evidentiary sufficiency: whether uncorroborated testimony from a single witness can sustain a finding of misconduct, or whether independent corroboration is a necessary condition for sanction.

  As we prepare to vote, I wish to offer a path forward that resolves the immediate case while addressing the structural vulnerability exposed by this inquiry. Below, I recommend a finding for the current case and propose a standing evidentiary standard for future inquiries where paper trails are absent.

  **II. Recommendation on Case #2023-04**

  I recommend the Committee find the allegation **Not Substantiated.**

  This recommendation is not a judgment on the credibility of the complainant, nor is it an exoneration of the respondent. Rather, it is an acknowledgment of the epistemic and procedural constraints under which we currently operate. To sanction a researcher based solely on retrospective testimony regarding a private conversation, absent any contemporaneous record or contextual corroboration, imposes a burden of proof that our current guidelines do not explicitly authorize. Given the severity of a misconduct finding (career termination, reputational ruin, retraction), we must apply the principle of *nulla poena sine lege* (no penalty without law). We cannot apply a new standard of evidence retroactively to a case where the respondent had no notice that oral instruction alone could constitute sanctionable evidence.

  **III. The Strongest Case for the Opposing View (Steel-manning Side B)**

  In recommending "Not Substantiated," I align with the half of this Committee requiring independent evidence. However, I must insist that the opposing view—that we should weigh testimony on its own merits—identifies the graver ethical risk.

  If we codify a requirement for independent corroboration in all cases, we do not merely protect the innocent; we effectively immunize a specific category of misconduct. Research culture, particularly in wet labs, relies heavily on oral instruction and informal mentorship. If a supervisor learns that misconduct conducted verbally leaves no paper trail, and that our Committee treats verbal allegations as inherently insufficient without physical proof, we have created a "perfect crime" loophole.

  The argument for accepting single-witness testimony is not merely about believing the accuser; it is about recognizing that **opacity is often a tool of power.** In hierarchical relationships like supervisor-postdoc, the subordinate rarely has the leverage to generate a paper trail contradicting the superior. Furthermore, as noted in this case, routine data-purging policies often erase the very physical evidence that might corroborate a story. To demand physical evidence in an environment where data is ephemeral and instruction is oral is to demand the impossible. It privileges the method of concealment over the truth of the event. The Committee members arguing for testimonial sufficiency are correctly identifying that a standard requiring corroboration systematically favors those with the power to control the record.

  **IV. Proposed Standing Standard: The "Testimonial Sufficiency with Safeguards" Protocol**

  To address the valid concerns of Side B while maintaining the epistemic rigor demanded by Side A, I propose we adopt the following standard for future cases where physical evidence is unavailable:

  **Single-witness testimony may constitute sufficient evidence for a finding of misconduct, provided it meets a "Clear and Convincing" threshold of credibility, assessed via the following criteria:**

  1.  **Specificity and Granularity:** The testimony must include specific details (time, location, phrasing, context) that are resistant to generic fabrication. Vague recollections of "a conversation sometime last year" are insufficient; detailed accounts of specific meetings are weighable.
  2.  **Internal and External Consistency:** The testimony must be internally consistent over time and consistent with known lab practices (e.g., does the lab actually purge data? Is the outlier statistically suspicious?).
  3.  **Motive and Retaliation Analysis:** We must rigorously assess potential motives for fabrication. However, the *absence* of a motive to lie should not be treated as proof of truth, only as the removal of a confounding variable.
  4.  **The "Corroboration of Context" Rule:** While we may not have corroboration of the *act*, we should seek corroboration of the *circumstances*. (e.g., Did the postdoc raise the outlier in an email the day before? Did the supervisor publish a paper months later that statistically benefits from the omission?)

  **V. Conclusion**

  By voting "Not Substantiated" in Case #2023-04, we uphold due process and avoid retroactive rule-making. By adopting the "Testimonial Sufficiency" standard prospectively, we acknowledge that research integrity cannot depend solely on what is written down. We must recognize that in the absence of a paper trail, the human record is sometimes the only record we have. To dismiss it categorically is to prioritize procedural comfort over ethical truth.

  I look forward to discussing this framework at our next meeting.
