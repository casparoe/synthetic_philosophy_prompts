      *   *Is "Leibniz Equivalence" just about models?* Yes. Leibniz cares about reality. If models map to the same reality, fine. But if the "reality" includes manifold points as individuals, he objects.
      *   *Verdict:* He accepts the equivalence of models but rejects the substantivalist ontology underlying the debate. He is a *relationalist*, not a *sophisticated substantivalist*.

  10. **Final Polish:** Ensure the distinction between "Leibniz Equivalence" (the technical fix) and "Leibnizian Relationalism" (the metaphysics) is clear. The friend conflates the logical move with the ontological commitment.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "he's a relationalist." I need to explain *why* sophisticated substantivalism fails his specific criteria. It's about the *reality* of the points, not just their distinguishability. Sophisticated substantivalists say points exist but lack primitive thisness. Leibniz says if they lack primitive thisness and lack qualitative difference, they are nothing.

