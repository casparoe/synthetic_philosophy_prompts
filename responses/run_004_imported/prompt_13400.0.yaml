answer: |-
  Your friend is mistaken. If you sat Leibniz down and walked him through the Hole Argument and the sophisticated substantivalist response, he would not become a sophisticated substantivalist. He would view "Leibniz Equivalence" as a necessary logical correction to a category error, but he would reject the ontological framework that makes sophisticated substantivalism a viable option. He would conclude that Earman and Norton have successfully vindicated his original critique of Newton, but that Butterfield and Brighouse are attempting to save a metaphysical ghost (the spacetime manifold as a collection of individuals) that the Principle of Sufficient Reason (PSR) and the Identity of Indiscernibles (PII) should have exorcised entirely.

  Here is the specific reconstruction of why Leibniz would reject sophisticated substantivalism and where he would actually land.

  ### 1. The Ontological Status of the Manifold Points
  The fundamental divide lies in what is being equated. "Leibniz Equivalence" in the philosophy of physics stipulates that two mathematical models related by a diffeomorphism represent the same physical reality. Sophisticated substantivalists accept this to avoid indeterminism, but they maintain that the spacetime points of the manifold are real individuals (substances), even if they lack haecceity (primitive "thisness").

  Leibniz would reject this immediately. For Leibniz, substance is defined by activity and perception (monads). A "spacetime point" in a differential manifold is, by definition, a bare locus—a mathematical coordinate stripped of all qualitative properties except its topological and metrical relations to other points.
  *   **The Pressure Point:** Leibniz's PII states that there cannot be two distinct things that differ only in number (i.e., bare particulars). Sophisticated substantivalism tries to thread the needle by saying points exist but aren't distinct in a haecceitistic way. Leibniz would argue that if two points are qualitatively identical and lack internal principle of action, they are not two points; they are one, or rather, they are nothing.
  *   **The Verdict:** Leibniz would argue that the Hole Argument only arises because substantivalists mistakenly reify the mathematical continuum into a physical container. He would not accept "Leibniz Equivalence" as a patch to save the manifold; he would accept it as a *reductio ad absurdum* of the manifold's substantiality. To him, granting that diffeomorphic models represent the same world is trivial if the "world" is just the distribution of matter/fields; granting that the underlying points *exist* as individuals is the error.

  ### 2. Space as an Order, Not a Subject
  Leibniz's relationalism is not merely the claim that space is determined by matter; it is the claim that space is an *abstraction* from the order of coexisting monads. In the *Leibniz-Clarke Correspondence*, he insists space is "something purely relative," an "order of situations."
  *   **The Pressure Point:** In General Relativity, the metric field is dynamic. A sophisticated substantivalist might argue the metric field *is* the physical stuff that substantiates the manifold. Leibniz would counter that the metric field is merely a mathematical representation of the forces and relations between monads.
  *   **The "Hole" Problem:** The Hole Argument posits a region (the "hole") where the metric field is undefined or permutable. For a substantivalist, the "hole" is a region of space waiting for a field. For Leibniz, if there are no monads (or no phenomena grounded in monads) in a region, there is no space there. The very formulation of the Hole Argument assumes space can exist as a subject independent of its predicates (matter/energy). Leibniz's metaphysics denies the possibility of a subject without predicates.
  *   **The Verdict:** He would view the "hole" as a fiction of the imagination. You cannot shift a field on a manifold because the manifold *is* nothing other than the possible ordering of the field. Therefore, the "indeterminism" threatened by the Hole Argument is illusory, generated by treating a mathematical abstraction (the manifold) as a causal agent.

  ### 3. Mathematical Continua vs. Physical Reality
  You noted Leibniz's ambivalence about infinitesimals and mathematical continua. This is crucial. Leibniz distinguished between the *ideal* continuum of geometry and the *actual* discrete nature of physical substance (monads).
  *   **The Pressure Point:** The spacetime manifold of GR is a smooth, continuous differentiable manifold ($\mathcal{M}$). It assumes infinite divisibility and actual continuity. Leibniz consistently argued that the continuous is ideal; the real is discrete (monads).
  *   **The Verdict:** Leibniz would argue that the Hole Argument is an artifact of applying ideal mathematics to physical ontology. Diffeomorphisms operate on the ideal continuum. If physical reality is ultimately discrete (monadic), the smooth permutations of the Hole Argument do not map onto genuine metaphysical possibilities. He would tell Earman and Norton that they are worrying about the shadows on the wall of the cave (the mathematical model) rather than the objects casting them (the monads). He would not become a substantivalist about the shadows just because we agree on how to label them.

  ### 4. Why "Leibniz Equivalence" Would Embarrass Him
  Your friend suggests the label would embarrass him. They are right, but for the wrong reason. It wouldn't embarrass him because he'd be a "closet substantivalist"; it would embarrass him because it implies his name is attached to a principle that *presupposes the substantivalist framework it seeks to mitigate*.

  "Leibniz Equivalence" says: "Given a substantivalist manifold, treat diffeomorphic models as identical."
  Leibniz's actual view is: "There is no substantivalist manifold."

  To accept the term "Leibniz Equivalence" in the context of sophisticated substantivalism is to accept that the debate is about *how to count models of a manifold*. Leibniz would insist the debate is about *whether the manifold deserves to be modeled as a substance in the first place*. He would see sophisticated substantivalism as a concession that space is real, followed by a desperate logical maneuver to prevent that reality from causing indeterminism. For Leibniz, the PSR demands that if there is no observable difference, there is no difference *in reality*. Sophisticated substantivalists say there is no difference in *physics*, but there is still a single underlying reality of points. Leibniz would say if there is no difference in reality, the points are not real.

  ### Final Verdict
  Leibniz would **reject sophisticated substantivalism**.

  He would embrace the *conclusion* of the Hole Argument (that determinism must be preserved and that distinct mathematical representations can map to one physical state), but he would trace this conclusion to **Relationalism**, not to a refined Substantivalism.

  He would argue:
  1.  **On PII:** Spacetime points cannot be individuals because they are indiscernible. If sophisticated substantivalists agree they aren't haecceitistically distinct, they must admit they aren't substances.
  2.  **On PSR:** If the location of a point in the manifold adds no physical information, it adds no metaphysical reality.
  3.  **On Ontology:** The manifold is a useful fiction for calculation (an "ideal" thing), not a "real" thing. The Hole Argument proves that treating it as real leads to absurdity (indeterminism).

  Leibniz would tell your seminar that Earman and Norton have provided the modern mathematical proof of his 1715 correspondence with Clarke. He would view "Leibniz Equivalence" as a watered-down, semi-substantivalist compromise that fails to follow the PSR to its ultimate metaphysical conclusion: that space is nothing but the order of things, and where there are no things, there is no space to have a "hole." He would not be a sophisticated substantivalist; he would be a triumphant relationalist.
