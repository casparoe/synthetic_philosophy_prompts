answer: |-
  This is a rich vein to mine. You are absolutely right to look past the caricature of the "stubborn old man." As Douglas Jesseph and others have shown, the Hobbes-Wallis controversy wasn't merely a personal feud; it was a collision between two competing visions of what mathematical knowledge *is*.

  If your thesis is that Hobbes's failure to square the circle undermines his broader epistemological claim—that sciences of constructed objects yield certainty—here is a stress-test of that argument, followed by the strongest available defense of Hobbes's position.

  ### The Critique: The Crisis of "Maker's Knowledge"

  The core of your argument rests on Hobbes's doctrine of *scientia* (scientific knowledge). For Hobbes, true *scientia* is knowledge of consequences derived from causes. In natural philosophy (physics), we see effects and speculate on causes; thus, we have only probability. In geometry and civil science, we posit the causes (definitions, motions, covenants); thus, we can have certainty. We know the truth because we made the truth.

  **1. The Breakdown of the Generative Method**
  Hobbes's geometry was explicitly generative. He rejected static Euclidean figures in favor of figures produced by motion (a line is the trace of a moving point). He believed this grounded geometry in physical reality and made it intelligible to reason.
  *   **The Problem:** Hobbes's quadrature failed precisely because his reliance on "intelligible motion" blinded him to rigorous deductive constraints. He trusted his conceptual picture of the generation of the figure over the formal consistency of the relations.
  *   **The Epistemological Leak:** If the "constructed object" is supposed to guarantee transparency, why was Hobbes's construction opaque to him? It suggests that *construction alone* is insufficient for certainty. The human mind can construct a false path just as confidently as a true one. If the "maker's knowledge" thesis holds, Hobbes should have been able to inspect his own construction and see the error immediately. His inability to do so suggests that the "self-evidence" of constructed objects is a psychological illusion, not a logical guarantee.

  **2. The Rejection of Symbols and the Loss of Rigor**
  Hobbes despised Wallis's algebraic methods, calling them a "scab of symbols." He believed symbols obscured the reasoning, whereas his verbal, motion-based descriptions revealed it.
  *   **The Problem:** History sided with Wallis. Symbolic algebra allows for manipulations that outstrip human intuition, acting as a check against the very cognitive biases Hobbes fell victim to.
  *   **The Epistemological Leak:** Hobbes's epistemology privileges *understanding* (grasping the cause) over *computation* (following the rules). But the circle-squaring controversy shows that in complex systems, rule-following (algebra) is more reliable than intuitive grasping (generative geometry). If civil science is to be like geometry, and Hobbesian geometry rejects the symbolic formalism that prevents error, then civil science is left vulnerable to the same intuitive errors. It implies that Hobbes's political philosophy, which relies on verbal definitions rather than formalized logic, lacks the very safeguards that could have saved his geometry.

  **3. The Political Analogy: The Sovereign of Reason**
  This is the most damaging point for your piece. Hobbes argues that just as a Geometer is the sovereign of his definitions, the Civil Sovereign is the definer of right and wrong. Both create the reality they govern.
  *   **The Problem:** Hobbes spent decades acting as a "tyrant" over his own geometry, refusing to acknowledge the "rebellion" of the mathematical facts.
  *   **The Epistemological Leak:** If the philosopher who designed the system of absolute certainty cannot submit to the consequences of his own definitions when they contradict his will, why should we trust the system to work in politics? It suggests that the Hobbesian ideal of the "rational agent" is a fiction. In both geometry and politics, Hobbes demonstrated that the "constructor" often loves his construction more than the truth it yields. If the epistemological foundation of *Leviathan* is a geometry that its own author could not master, the claim that political science can be "demonstrated" with geometric certainty collapses into mere dogmatism.

  ***

  ### The Defense: The Best Case for Hobbes

  To give your piece balance, you should engage with the strongest rebuttal, which essentially argues that Hobbes's mathematical failure is a *performative* error, not a *systemic* one. A defender of Hobbes (perhaps channeling Jesseph's more sympathetic readings) would argue the following:

  **1. Competence vs. Performance**
  The defense argues that the *possibility* of certainty in constructed sciences remains intact even if a specific practitioner fails to achieve it. That Hobbes failed to square the circle no more disproves the certainty of geometry than a drunk arithmetic student disproves that 2+2=4.
  *   **The Argument:** Geometry remains a science of consequences from definitions. Hobbes's error was a lapse in reasoning, not a flaw in the nature of geometrical objects. The fact that he was stubborn doesn't mean the truth wasn't accessible; it means he was psychologically compromised. The epistemology holds; the man failed.

  **2. The Critique of Algebra was Not Unreasonable**
  Hobbes's contempt for Wallis's algebra is often painted as the ranting of a Luddite, but in the mid-17th century, algebra *was* often unrigorous. It was a tool of discovery, not yet a tool of proof.
  *   **The Argument:** Hobbes was insisting on semantic clarity. He wanted to know *what* the quantities represented physically, not just how to manipulate the symbols. Wallis won the battle, but Hobbes was fighting for a philosophical point: that mathematics should not detach entirely from ontology. One can argue Hobbes was wrong about the circle, but right that symbolic manipulation without conceptual grounding can lead to its own kind of nonsense (a prescient worry for modern physics). His failure doesn't invalidate his demand for intelligibility.

  **3. The Separation of Domains (Politics is Easier than Transcendentals)**
  This is the most pragmatic defense. Squaring the circle involves transcendental numbers ($\pi$) that are inherently resistant to finite construction. Civil science does not.
  *   **The Argument:** The objects of civil science (covenants, obligations, sovereignty) are entirely human and finite. They are *more* accessible to reason than the infinite complexities of a circle. Therefore, even if Hobbes failed at the hardest problem in geometry, his method remains valid for politics. The "certainty" of politics is actually *higher* than geometry because the stakes and the components are fully within human comprehension. We made the circle's definition, but God made the circle's properties; we made the Commonwealth's definition *and* its properties.

  ***

  ### Synthesis for Your Piece

  The tension that makes this story compelling isn't just that Hobbes was wrong; it's *why* he couldn't admit it.

  If you want to sharpen your argument, consider this angle: **Hobbes's stubbornness was a feature, not a bug, of his system.**

  For Hobbes, to admit error in a "science of construction" was not just to correct a calculation; it was to admit that the link between human reason and truth is breakable. If he admitted Wallis was right, he risked undermining the very authority of reason that underpinned his political theory. In a world where civil war was caused by disputes over authority, Hobbes needed geometry to be a realm where authority (the Geometer) was absolute. To concede to Wallis was to concede that even in the realm of constructed truth, authority could be contested.

  His "vanity" was actually a desperate defense of the **infallibility of the rational sovereign**, whether that sovereign is the Geometer in his study or the King in the Commonwealth. He couldn't square the circle, but he also couldn't afford to let the circle remain unsquared by *his* hand, because that would imply that Reason itself was not a sovereign power.

  This moves the story from "old man yells at cloud" to "philosopher realizes his system requires him to be infallible, so he must pretend he is." That is a much deeper tragedy for your piece on intellectual stubbornness.
