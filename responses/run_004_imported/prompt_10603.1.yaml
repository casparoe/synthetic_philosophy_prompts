      *   **Section 3: The Epistemic Consequence.** Shift from "instability of human kinds" to "instability of coupled systems."
      *   **Section 4: Addressing Hacking Directly.** Why his distinction collapses under systems analysis.
      *   **Conclusion:** Psychiatry as Social Engineering.

  9.  *(Self-Correction during drafting)*: I must be careful not to claim rocks loop. Hacking is right that rocks don't loop *under normal conditions*. The argument is that *any* system coupled tightly enough loops. The distinction is degree of coupling, not kind of being. I need to emphasize that Hacking's "indifferent kinds" are only indifferent because we usually decouple them from the classification process. If we classify a river as "flood risk" and build a dam, the river's flow changes. That's a loop. But the ML analogy is stronger because the *agents* in the ML system (users) are humans, yet the *phenomenon* is treated as engineering.

