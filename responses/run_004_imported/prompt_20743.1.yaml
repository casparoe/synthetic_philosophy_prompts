answer: |-
  **A Note on the Text:** *The following dialogue is an imaginative reconstruction. Jean-Jacques Rousseau and Denis Diderot suffered their final, bitter estrangement in 1758, following the publication of Rousseau's* Lettre à d'Alembert. *Diderot did not fully articulate his theory of the "cold actor" until the* Paradoxe sur le comédien, *drafted in the 1770s. This conversation imagines a meeting that never historically occurred, set in a neutral garden in the early 1770s, allowing Diderot to wield his mature theory against Rousseau's mature objections, bridging the gap for the sake of the argument.*

  ***

  **The Garden of the Palais-Royal, 1772**

  **DIDEROT:** You walk as though the grass might bite you, Jean-Jacques. Still fleeing the corruption of the city?

  **ROUSSEAU:** The grass does not bite, Denis. It is the eyes that bite. Everywhere I look, I see people performing roles they do not feel. I see you, particularly. They tell me you are writing of actors again. Have you not had enough of masks?

  **DIDEROT:** I am writing of truth. Which is, ironically, why I defend the actor. But come, sit. The air is clear enough today. Even in Paris.

  **ROUSSEAU:** (Sitting stiffly) You speak of truth while defending the playhouse. In Geneva, we understood that to banish the theatre was not austerity. It was hygiene. You called it prejudice. I call it preventing a sickness.

  **DIDEROT:** Sickness? Or medicine?

  **ROUSSEAU:** A narcotic. That is the heart of it, and you never answered me on this. When a man sits in the dark and weeps for Hecuba or Andromache, what has he done? He has felt a pang. He has sighed. And when the lights come up, he feels *relieved*. He has paid his tax to humanity. He has discharged his pity on ghosts, so he need not spend a sou on the beggar freezing outside the door.

  **DIDEROT:** You believe the capacity for pity is a finite currency? That if I spend it on the stage, I am bankrupt in the street?

  **ROUSSEAU:** I believe it is a muscle that atrophies if exercised only on illusions. But worse: it grows flabby. The theatre teaches us to love the *image* of virtue rather than the *work* of virtue. It is a counterfeit coin. I give you a tear, which costs me nothing, and I claim it buys me a good conscience.

  **DIDEROT:** But consider the alternative. The world is hard, Jean-Jacques. Most men are not philosophers. They do not wake in the morning contemplating the categorical imperative. They are dull. They are self-absorbed. If the stage can startle them—if it can make the heart beat faster in recognition of another's suffering—is that not a spark? Even if the wood is damp?

  **ROUSSEAU:** It is not a spark. It is a firework. It dazzles and vanishes. And do not speak only of tragedy. Look at your comedy. Look at Molière, whom you worship. *The Misanthrope*.

  **DIDEROT:** Ah. The old wound.

  **ROUSSEAU:** It is not a wound; it is a diagnosis. Alceste is the only honest man in the play. He demands truth. He refuses to flatter. And what does Molière do? He makes him a fool. He makes him a monster of rigidity. The audience laughs *at* him. They side with the liars, the flatterers, the corrupt courtiers, because they are charming.

  **DIDEROT:** Because Alceste is lacking in humanity. He hates vice so much he hates the vicious.

  **ROUSSEAU:** He hates the vice! That is the point! But the lesson the audience takes home is this: To be virtuous is to be ridiculous. To survive in society, you must accommodate. You must compromise. The theatre trains men to be compliant, not good. It polishes their chains and calls it civilization. In Geneva, we did not need to learn how to laugh at integrity. We needed to learn how to maintain it.

  **DIDEROT:** (Leaning forward) You assume the theatre merely reflects society as it is. I say it can show society as it *ought* to be. This is why I have moved toward the *drame bourgeois*. Not kings and queens, but fathers and merchants. Not verse, but prose. We show virtue in distress, not virtue mocked.

  **ROUSSEAU:** Even if you show virtue, you show it performed. And this brings me to your new theory, which chills me more than the old one. You claim now that the great actor feels *nothing*.

  **DIDEROT:** I claim he must not.

  **ROUSSEAU:** You claim he is a liar by trade. A man who mimics passion without possessing it.

  **DIDEROT:** I claim he is a master of observation. Listen to me, Jean-Jacques. If an actor is truly overcome by grief on stage, what happens? His voice breaks. He turns his back to the audience. He loses the measure of his performance. He is a mess of nerves. The illusion shatters. The spectator is no longer moved by the character; he is embarrassed by the man.

  **ROUSSEAU:** But if he feels nothing, it is a trick! It is puppetry.

  **DIDEROT:** It is art. And here is the paradox you refuse to grasp: Because the actor is cold, because he is a calm observer of his own mimicry, he can construct a representation of suffering that is *more* perfect, *more* concentrated, than nature ever provides. He creates an ideal model of pain. And when the spectator sees this perfect model, his own soul is stirred.

  **ROUSSEAU:** So you admit it. The actor is cold. The character is fake. Only the spectator feels. And you call this moral education? You are training the audience to be moved by manipulation. You are teaching them to respond to cues, like Pavlov's dogs.

  **DIDEROT:** I am teaching them to recognize the signs of humanity! Look, let us grant your point. Let us grant that the actor is a hypocrite. Let us grant that the plot is a lie. What remains? The *effect* on the soul of the viewer. When a young man sees a father betrayed on stage, and he feels a tightening in his chest, that tightening is real. The tear on his cheek is salt and water, not ink.

  **ROUSSEAU:** It is real, yes. But it is sterile.

  **DIDEROT:** Sterile?

  **ROUSSEAU:** Yes. Because it leads nowhere. If I see a man beaten in the street, my pity demands I intervene. I risk my bones. I lose my time. If I see a man beaten on stage, my pity demands I clap. I risk nothing. I lose only the price of the ticket. You say the tear is real. I say the *consequence* is the measure of the virtue. A virtue without cost is not virtue. It is sentimentality.

  **DIDEROT:** (Pauses, tapping his cane) You demand cost. You demand that every moral feeling be immediately translated into action. But the world does not always offer us the chance to act. Sometimes, all we can do is feel. And if we cannot feel, if our hearts are stone... then we are lost. The theatre is a gymnasium for the heart. We lift the weights of imaginary grief so that when real grief comes, the muscle is ready.

  **ROUSSEAU:** A gymnasium! There it is. You treat the soul as a mechanism to be tuned. I treat it as a sanctuary to be protected. You think you are strengthening the muscle; I tell you you are exhausting it. You let the audience go home saying, "I am a good man, for I wept for Philoctetes." And tomorrow, they walk past a starving child and say, "I have already done my weeping for today."

  **DIDEROT:** That is a risk, I concede. A bad spectator can misuse anything. A sermon can make a man feel holy without making him act. A book can do the same. Will you ban books, Jean-Jacques?

  **ROUSSEAU:** Books I have written. But I write to awaken conscience, not to simulate experience. I write to tell the man: *Go out and live truly.* The theatre tells the man: *Sit down and feel deeply.*

  **DIDEROT:** But feeling is the precursor to living! You speak of Geneva as if it were Sparta. All duty, no softness. But men are not iron. They need to be softened. Yes, the actor lies. I grant you that. In the *Paradoxe*, I say the actor is a cold observer, a mimic. He is not a good man necessarily. He is a good *worker*. But the *spectacle*... the spectacle creates a shared space. In the dark of that theatre, the duke and the merchant sit side by side. They weep for the same mother. For one hour, hierarchy dissolves in shared pity. Is that not a kind of virtue? A kind of equality?

  **ROUSSEAU:** (Softening slightly) It is a phantom equality. They leave the theatre, put on their coats, and the duke steps over the merchant in the mud. The pity did not cross the threshold.

  **DIDEROT:** But it crossed the heart.

  **ROUSSEAU:** A heart that is satisfied with shadows will not seek the light. My fear, Denis, is not that the theatre makes men wicked. It is that it makes them content to be mediocre. It reconciles them to the world as it is, by giving them a taste of the world as it should be, without the burden of creating it. Molière teaches us to laugh at Alceste because we know we cannot be him. We choose to be Philinte instead. We choose to be comfortable.

  **DIDEROT:** And I say, better a comfortable Philinte who has felt a pang of pity than a brutal thug who has felt nothing. You want saints. I am trying to save citizens.

  **ROUSSEAU:** And I say you are saving spectators.

  **DIDEROT:** (Sighs) We are back to the beginning. You value the sincerity of the source. I value the utility of the effect.

  **ROUSSEAU:** Because the source determines the fruit. If the root is artifice, the fruit is poison. You cannot build truth on a lie, Denis. Not even a useful one.

  **DIDEROT:** And yet, here we sit. Two old friends, estranged by words on a page. If I were to write a scene of this meeting—if I were to have actors speak our lines, with me playing the cold observer and you playing the passionate soul—might it not move someone else to reconcile? Might it not teach a third party something of the value of friendship?

  **ROUSSEAU:** (Stands up) It would teach them to clap for our sorrow. And then they would go home and let their own friendships rot, secure in the knowledge that they appreciate the *idea* of friendship.

  **DIDEROT:** You are impossible.

  **ROUSSEAU:** I am consistent. You ask the actor to feel nothing so the audience may feel much. I ask the man to feel everything so he may act truly.

  **DIDEROT:** And if the man feels too much, he burns out. He becomes your Alceste. Raging alone in the wilderness.

  **ROUSSEAU:** Better to rage in the wilderness than to applaud in the cage.

  *(Rousseau turns to leave. Diderot watches him go, not moving to stop him.)*

  **DIDEROT:** (To himself) He thinks the tear is the end of the moral act. I know it is only the beginning. But how to make him see that the stage is not the end of the road, but the mirror at the crossroads?

  *(Diderot remains seated, watching the empty path, tracing the pattern of the gravel with his cane, like a script being written and erased.)*
