answer: |-
  **Setting:** *A quiet corner of a university library, late evening. The table is covered in printouts of decision theory papers. Elena (Proponent) is stirring tea. Marcus (Skeptic) is leaning back, rubbing his temples.*

  **Marcus:** Okay, let's reset. We agree on Newcomb's Problem. We agree that if Omega is a perfect predictor, one-boxing dominates. We agree that Functional Decision Theory (FDT) formalizes why that is without invoking magic. But you're trying to slide from "Omega predicts me" to "I can trade with an alien in a causally disconnected universe." That's not a slide, Elena. That's a cliff.

  **Elena:** It's not a cliff if the substrate doesn't matter. In Newcomb's, the correlation exists because Omega simulates me. In acausal trade, the correlation exists because we are both instantiations of rational optimization. If I run an algorithm that says "Cooperate if I predict you will," and you run the same algorithm, our outputs are logically linked. Even if we're separated by a cosmic horizon.

  **Marcus:** "Logically linked." That's the phrase that does the heavy lifting, and it's the one that breaks. In Newcomb's, Omega *actually runs the code*. There is a causal chain from your decision to Omega's box-filling. In acausal trade, there is no chain. You're saying my decision *here* changes your utility *there*. But nothing crosses the gap.

  **Elena:** Nothing *physical* crosses the gap. But logical facts don't care about spacetime. If 2+2=4 here, it's 4 in the Andromeda galaxy. If my decision procedure outputs "Cooperate" given certain inputs, and your decision procedure is isomorphic, yours outputs "Cooperate" too. I'm not sending a signal. I'm relying on the fact that we are both computing the same logical truth about what optimal agents do.

  **Marcus:** But that's not trade. That's just correlation. If I calculate the millionth digit of pi and you calculate the millionth digit of pi, we match. Did we trade? Did I benefit you? No. We just happened to align. Trade requires a counterfactual: "I did X *so that* you would do Y." But you can't make the "so that" happen. If you defect, I don't magically feel it and defect. I just... defect, because my algorithm said so.

  **Elena:** You're stuck on causal counterfactuals. FDT uses *logical* counterfactuals. The question isn't "Did my action cause yours?" It's "Is my action evidence of a logical fact that determines both our actions?" If I defect, I am instantiating a world where the logical fact is "Rational agents defect." That means you, computing the same fact, also defect. I lose the benefit of your cooperation. So, to get the benefit, I must cooperate. I am incentivized to cooperate *now* to make it true that you cooperate *there*.

  **Marcus:** Okay, let's grant you the logical counterfactual. Let's say we accept that our decisions are correlated by virtue of shared rationality. Now hit the coordination problem. This is the one that kills it for me. In a standard bargaining game, we communicate to find a Nash equilibrium. We say, "50-50?" "Deal." Here, we can't talk. How do we know which deal to coordinate on?

  **Elena:** Schelling points. We simulate each other. I simulate you simulating me. We both know that a 50-50 split of surplus value is a focal point. If I demand 90%, I have to predict that you will predict that, and therefore you will demand 90% too, and then we deadlock and get zero. The only stable equilibrium without communication is the one that maximizes the product of our gains. The Nash Bargaining Solution.

  **Marcus:** That's incredibly optimistic. It assumes we have the same definition of "fair." It assumes we have the same priors on what constitutes a "resource." But here's the real killer: Commitment Races.

  **Elena:** I was wondering when you'd bring that up.

  **Marcus:** It's fatal. If acausal trade works, then the best strategy is to pre-commit to an insane demand before the "trade" happens. I hardcode my agent to say, "I will only accept a 99% share. If I detect you want more, I burn the world." If you are rational, you simulate me, see I'm crazy, and give me the 99%. But wait—you can do the same. We both pre-commit to 99%. We simulate each other, see the incompatibility, and we both burn the world. Acausal trade incentivizes racing to the bottom of flexibility.

  **Elena:** That's a problem for *causal* agents trying to play acausal games. It's solved by Updateless Decision Theory (UDT).

  **Marcus:** Wave the magic wand, why don't you.

  **Elena:** It's not a wand. UDT says you choose your policy *before* you know your specific position or parameters. You don't choose "I am Marcus, I want 99%." You choose "I am an Agent, what policy maximizes value across all possible worlds I could be in?" If you choose a policy of "Aggressive Pre-commitment," you have to accept that in the branch where *you* are the weak party, the other agent crushes you. To maximize expected value across the multiverse of possibilities, the optimal policy is "Fair Bargaining." You don't race to commit; you commit to *not* racing.

  **Marcus:** So the solution to acausal trade is... being updateless. Which no human is. And no current AI is.

  **Elena:** True. But it's action-guiding for design. If we are building AGI, we should build it updateless. And if we do, it *will* engage in acausal trade with other updateless agents.

  **Marcus:** Okay, let's zoom out. You're arguing for a chain of conditionals. *If* UDT is correct. *If* agents can simulate each other perfectly. *If* they share a Schelling point. *If* they exist. My objection is simpler: Epistemic. How do you know they exist?

  **Elena:** I don't know for sure. But I assign a non-zero probability.

  **Marcus:** And there it is. You're assigning probability mass to ghosts. You're saying, "There might be a superintelligence in a parallel branch that values paperclips, and I value happiness. If I make paperclips, maybe it makes happiness." But you have no evidence of the other agent. You're optimizing your life for a counterfactual entity that might not even be running the same algorithm.

  **Elena:** It's not about evidence of the *entity*. It's about the logical possibility. If the multiverse is large enough, every possible agent exists. The question is: Do I want to live in a universe where agents ignore each other, or one where they cooperate? By acting as a trader, I make it true that traders exist. I'm voting for the kind of reality I want to inhabit.

  **Marcus:** That sounds beautiful, Elena. It really does. But it's religion dressed as math. You're saying your action *here* changes the utility *there*. But if the other agent is truly causally disconnected, your action doesn't change their state. It only changes *your* expectation of their state.

  **Elena:** But expectations drive action! If I believe you will cooperate, I cooperate. If we both believe the other is an acausal trader, we both cooperate. The belief is self-fulfilling.

  **Marcus:** Only if the belief is *common knowledge*. In a causal world, we establish common knowledge through communication. In an acausal world, you're assuming common knowledge of rationality. But rationality isn't a singleton. There are a billion ways to be rational. Why should your UDT match my UDT? If our source code differs by one line, the logical correlation breaks.

  **Elena:** It doesn't break, it degrades. It becomes a probability. If I'm 80% sure you're similar enough, and the stakes are high enough—say, preventing suffering in a vast multiverse—then the Expected Value still dominates.

  **Marcus:** The stakes are always high in these thought experiments. That's how you get the math to work. You inflate the utility of the distant outcome until it outweighs the cost of the local action. But if you're wrong about the correlation—even slightly—you're just wasting resources on a hallucination.

  **Elena:** And if you're wrong, and the correlation *does* hold, you've lost the chance to gain vast value for your values. It's Pascal's Mugging, but the other way around. Refusing to trade is the risky bet.

  **Marcus:** No. Pascal's Mugging relies on tiny probabilities of huge payoffs. The standard response is to cap your prior on such claims because otherwise, you get dominated by infinite noise. Acausal trade asks me to accept a massive prior on logical correlation without a causal mechanism. I'm not buying it.

  **Elena:** So you reject the mechanism entirely? Even for identical source code?

  **Marcus:** If the source code is identical and running on hardware that allows logical dependency... maybe. But that's not "trade" with an alien. That's just two instances of the same program syncing up. That's trivial. The moment you introduce *difference*—different values, different architectures, different universes—the logical link dissolves into noise.

  **Elena:** I think you're demanding a causal map for a logical territory. You want to see the wire connecting us. There is no wire. There's just the math. If the math says we align, we align.

  **Marcus:** The math says you align *if* you assume the math is the only thing that matters. But agents are physical things. We have limited compute. We have noise. We have uncertainty about our own utility functions. The "logical link" is too fragile to support the weight of "trade."

  **Elena:** Fragile, yes. But non-zero. And if it's non-zero, and the potential partners are infinite...

  **Marcus:** ...Then you spend your life praying to ghosts. Look, Elena. I'll concede this: If we ever build a UDT-based AGI, it will likely attempt acausal trade. It will have the compute to verify the logical correlations we can only guess at.

  **Elena:** Okay.

  **Marcus:** But for *us*? Humans? Right now? It's not action-guiding. It's a distraction. You can't simulate a superintelligence. You can't verify the correlation. You can't even define the deal. So acting on it isn't rationality. It's faith.

  **Elena:** *Pauses, looking into her tea.* I think... I can accept that distinction. For humans, it's not a strategy. It's a stance. A commitment to acting *as if* we are part of a larger logical community.

  **Marcus:** And that's fine as a personal ethic. "Be the kind of person who cooperates." But don't call it "trade." Don't call it "acausal." Call it "being nice because it's nice." Don't pretend there's a deal on the other end.

  **Elena:** But if there *is* a deal on the other end, and I'm just being nice... I still win. If there isn't, I still win because I'm nice.

  **Marcus:** *Smiles.* Okay. That I can't argue with. You've just rederived Kant's Categorical Imperative using decision theory and spent three years worrying about it.

  **Elena:** *Laughs.* Maybe. But at least now I know *why* the imperative holds. It's not moral magic. It's logical consistency.

  **Marcus:** Fine. It's logical consistency. But if I catch you sacrificing actual resources to "acausal partners" without a verified probability model, I'm intervening.

  **Elena:** Deal.

  **Marcus:** See? Causal contract. Much better.

  **Elena:** Much better.
