prompt: |-
  my grandma died last month and my cousin talked me into trying one of those ai "grief bot" things - you feed it someone's old texts and voicemails and it generates a chatbot that talks like them. i only lasted like 15 minutes before it freaked me out, though i couldn't really explain why it felt so wrong.

  since then i've been down a rabbit hole and learned that Gödel (yes, the incompleteness guy) apparently was dead serious about believing in an afterlife - his reasoning was roughly that the world is "rational," and it'd be against reason for a mind to spend decades developing and then just get permanently switched off, so something has to carry on. he seperately argued that the human mind can't be fully captured by a formal/mechanical system the way a computer program can, which is kind of his own incompleteness result turned back on himself.

  given those two views, what do you think Gödel would actually say about something like my grief bot - does it capture anything real of my grandma, or is it just a very elaborate puppet with none of "her" left in it? i want an actual reasoned answer, not just a gut reaction.
reasoning: |-
