  1.  **Analyze the User's Request:**
      *   **Context:** The user's grandmother passed away recently. They tried an AI "grief bot" based on her data but found it disturbing/wrong after 15 minutes.
      *   **Intellectual Hook:** The user has been researching Kurt Gödel, specifically his philosophical views on the afterlife and the nature of the human mind vs. mechanical systems.
      *   **Core Question:** Based on Gödel's specific philosophical positions (rationality/afterlife and incompleteness/mind vs. machine), what would he say about the grief bot? Does it capture anything real, or is it just a puppet?
