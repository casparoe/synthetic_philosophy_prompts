      *(Self-Correction during drafting)*: Make sure to mention that SI *can* handle math if you treat math truths as observations, but it fails to capture the *structure* of logical deduction efficiently, leading to the "Logical Omniscience" problem where it should know $A \implies B$ means $P(B) \ge P(A)$. SI doesn't enforce this for unproven implications. LI *does* enforce coherence over time.

      *Wait, does SI enforce coherence?* SI is a probability distribution over sequences. It is coherent in the Kolmogorov sense. But it doesn't respect logical implication between sentences unless those sentences are mapped to sequence bits in a way that forces it. The "Logical Omniscience" critique is that a Bayesian/SI agent is modeled as knowing all logical consequences of its hypotheses instantly. If I believe "H", and "H -> S", I must believe "S" with probability 1. If I don't know "H -> S" yet, standard Bayesianism breaks. LI fixes this.

