prompt: |-
  Ok so I've fallen down a bit of a rabbit hole reading old LessWrong/MIRI stuff about how a perfectly rational agent is supposed to handle not knowing math facts yet — like not knowing the ten-trillionth digit of pi, or whether some gnarly conjecture is true, even though technically that stuff is 100% fixed and there's no "randomness" involved anywhere. Apparently this is called logical uncertainty, and there's this whole "logical induction" framework (the one with imaginary traders betting play-money on which sentences are true, and the prices settling into probabilities over time) that's supposed to be the principled way to assign credences to that kind of thing.

  What's been messing with my head is how this relates to the older idea of Solomonoff induction, which I'd always had explained to me as basically THE gold standard formalization of ideal inductive reasoning — the perfect Bayesian who weighs every computable hypothesis for a stream of observations by simplicity. My gut instinct was that logical induction must just be Solomonoff induction's cooler younger sibling, finally patching the "logical omniscience" hole in it. But then it hit me that logical inductors are reasoning about sentences and proofs, while Solomonoff induction is reasoning about observation sequences, and now I honestly can't tell if these are two competing answers to the same underlying question or just seperate tools for seperate jobs that both happen to get called "the" ideal theory of induction.

  So could you actually compare the two properly for me? Concretely I want to know: is there a case where a "pure" Solomonoff reasoner and a logical inductor would end up assigning meaningfully different credences to the exact same claim, or do they just never really overlap in subject matter? And of the two, which one do you think actually comes closer to being a full, general theory of ideal rational belief, rather then just "ideal for empirical sequences" or "ideal for math sentences" — i.e. is one of them basically a special case or patch of the other, or a strict generalization of it? Please actually justify the answer instead of just saying "they do different things," because I want to know which one I should treat as more fundamental if I had to bet on it.
