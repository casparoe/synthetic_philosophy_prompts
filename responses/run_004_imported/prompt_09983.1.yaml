  2.  **Deconstruct the Problem of Old Evidence (POE):**
      *   *The Setup:* $E$ is known ($P(E) = 1$). $H$ is a new theory (e.g., General Relativity). $H$ entails $E$.
      *   *The Bayesian Math:* Confirmation usually means $P(H|E) > P(H)$. By Bayes' Theorem: $P(H|E) = P(E|H)P(H) / P(E)$.
      *   *The Glitch:* If $E$ is already known, $P(E) = 1$. If $H$ entails $E$, $P(E|H) = 1$. So, $P(H|E) = 1 \cdot P(H) / 1 = P(H)$.
      *   *Result:* No confirmation. $E$ cannot confirm $H$. This contradicts scientific practice (Mercury's perihelion *did* confirm GR).

  3.  **Analyze the Garber-Jeffrey Solution:**
      *   *Core Idea:* Relax the assumption of Logical Omniscience. Agents don't automatically know all logical consequences of their beliefs.
      *   *The Move:* Instead of conditionalizing on $E$ (which is old), conditionalize on the *learning* that $H$ entails $E$. Let $L$ be the proposition "$H \models E$".
      *   *The Math:* Update on $L$, not $E$. Since $L$ is new information, $P(L) < 1$ initially.
      *   *Result:* $P(H|L) > P(H)$. Confirmation happens.
