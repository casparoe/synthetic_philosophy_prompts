answer: |-
  You win the argument, but with a major caveat: your friend isn't making the view up, she's just got the timeline completely backwards.

  Here is the breakdown of what actually happened, when it happened, and what the 1852 speech actually says.

  ### 1. The Verdict on the 1852 Speech
  Your friend is incorrect that *"What to the Slave is the Fourth of July?"* (1852) is a Garrisonian speech. By the time Douglass delivered that speech, **he had already publicly broken with William Lloyd Garrison.**

  In the speech, Douglass distinguishes between the *principles* of the Founding Fathers (which he calls "saving principles") and the *practices* of the current nation (which are hypocritical and cruel). This distinction is crucial.
  *   **Garrison's View:** The principles themselves are corrupt; the Constitution is a "covenant with death"; the Union should be dissolved.
  *   **Douglass's 1852 View:** The principles are sound ("liberty and equality"), but the nation is failing to live up to them. He explicitly says, **"I do not despair of this country."** A Garrisonian *did* despair of the country and wanted to secede from it.

  *Note on confusion:* Many textbooks assign an **abridged version** of the speech that cuts the final section where Douglass discusses the Constitution and the Founding Fathers. If your friend only read the first half (which is all about the hypocrisy of the celebration), she might have missed the part where he affirms the nation's underlying potential.

  ### 2. The Timeline of the Shift (It wasn't "Old Age")
  Your intuition that the timeline is backwards is correct. Douglass did not wait until he was an "old man" to change his mind.

  *   **1841–1851 (The Garrisonian Phase):** For the first decade of his career, Douglass *did* agree with Garrison. He believed the Constitution was pro-slavery and that the North should separate from the South.
  *   **1851 (The Break):** This is the key date. Douglass publicly announced his change of heart in a letter to Gerrit Smith (published in *The North Star*) in **May 1851**. He was roughly **33 years old**. This was the peak of his radicalism, not a mellowing in old age.
  *   **1852 (The Speech):** He delivers the Fourth of July oration with this new political stance already in place.
  *   **1860 (The Legal Argument):** He delivers his famous speech *"The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?"* in Glasgow, where he fully articulates the legal argument that the text never explicitly sanctions slavery.

  So, the shift happened in his **30s**, a full decade before the Civil War and 30 years before he would be considered an "old man."

  ### 3. The "Why" (Strategy, not Patriotism)
  Your friend's theory that he changed his mind because he became "mellower and more patriotic" is a common misconception among historians, but it is generally rejected by modern scholars.

  Douglass didn't change his mind because he started loving America more; he changed his mind because he wanted **political power.**

  *   **The Garrisonian Trap:** If the Constitution is pro-slavery, you cannot vote, you cannot run for office, and you cannot support political parties. You can only engage in "moral suasion" (persuasion) or advocate for disunion (breaking up the country).
  *   **The Douglass Shift:** Douglass realized that if he could argue the Constitution was *anti-slavery*, he could justify voting, supporting the Liberty Party, and using the federal government to crush slavery.

  He wrote in 1851 that he wanted to "abolish slavery by the ballot box as well as by the moral sentiment." This was a **radicalization** of his strategy, not a softening. It allowed him to support John Brown and later pressure Lincoln, actions a strict Garrisonian would have avoided.

  ### Summary for Your Friend
  You can tell her this:
  1.  **She's right that he *used* to be Garrisonian,** but that was before 1851.
  2.  **She's wrong about the 1852 speech.** By then, Douglass had already broken with Garrison and believed the Constitution's principles were sound, even if the nation was hypocritical.
  3.  **She's wrong about the timing.** He changed his mind at age 33 (1851), not as an old man.
  4.  **She's wrong about the motive.** It wasn't about "mellowing out"; it was a strategic move to allow Black men to use politics and voting as weapons against slavery.

  **The TL;DR:** Douglass started as a Garrisonian (Constitution = Bad), switched in 1851 (Constitution = Good tool for abolition), and gave the 1852 speech *after* the switch. Your friend has the chronology reversed.
