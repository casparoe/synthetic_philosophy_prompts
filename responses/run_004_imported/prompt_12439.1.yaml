          *   Critique of Contingency: PSR leads to Spinozistic necessitarianism (modal collapse). If everything *must* have an explanation, why did God choose *this* world? If He didn't have to, PSR is false. If He did, creation isn't free.
      *   **Sarah (Contingency):**
