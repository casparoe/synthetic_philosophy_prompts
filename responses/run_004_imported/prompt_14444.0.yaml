answer: |-
  Frank Ramsey would most plausibly reject the longtermist prioritization of AI existential risk, not by abandoning his own decision theory, but by applying the **pragmatic constraints** of that theory to show that the longtermist argument relies on epistemically illegitimate probabilities and axiologically empty utilities.

  While it is tempting to view Ramsey's legacy as split between the cold calculus of "Truth and Probability" and the warm humanism of the "Epilogue," a closer reading suggests these are not contradictory but complementary. For Ramsey, the calculus of rational choice was never intended to be a metaphysical engine for generating value from abstract magnitude; it was a tool for organizing human action within the limits of meaningful belief. Consequently, Ramsey would argue that longtermism commits a category error: it uses a framework designed for human decision-making to override the very human concerns that give the framework its purpose.

  Here is how Ramsey would dismantle the longtermist case using his own commitments.

  ### 1. The Pragmatic Limit of Belief ("Truth and Probability")
  Longtermism depends on assigning non-negligible probabilities to unprecedented, high-stakes events (e.g., AI-induced extinction) over vast time horizons. Ramsey's subjective probability theory, however, is rigorously pragmatic. In "Truth and Probability," he defines a degree of belief not as an internal mental state, but as a **disposition to act**—specifically, the odds at which one is prepared to bet.

  For Ramsey, a belief is only meaningful if it can guide action in a coherent way based on evidence and habit. He writes that our degrees of belief should be derived from "the habit of making such judgments." The longtermist scenario involves variables (the nature of superintelligence, the stability of future institutions over millennia) for which no habitual evidence exists. We have no track record for betting on the trajectory of digital civilization over 10,000 years.

  Ramsey would likely argue that the probabilities required for the "astronomical waste" argument are not just low, but **undefined**. To claim a precise probability for such an event is to pretend to a betting disposition one does not and cannot have. In Ramseyian terms, treating these speculative probabilities as inputs for a rigorous expected utility calculation is a misuse of the calculus. It violates the pragmatic requirement that belief must be tethered to evidence capable of guiding actual conduct. If you cannot coherently bet on it, you cannot rationally prioritize it over concrete, evidence-backed concerns.

  ### 2. The Locus of Value ("Epilogue")
  Even if one could assign coherent probabilities, Ramsey would reject the utility function longtermism employs. The "astronomical waste" argument assumes that value scales linearly with the number of potential future lives, regardless of their ontological status. This clashes directly with the humanism of the "Epilogue."

  In the "Epilogue," Ramsey pushes back against the idea that the physical vastness of the universe dictates moral importance. He argues that value is not "out there" in the stars or in the duration of time, but is located in the **"human universe" of feeling, thought, and relationship.** He writes that the good is "states of mind" and specifically those connected to personal affection and aesthetic enjoyment.

  Longtermism often relies on a form of impartial utilitarianism where a potential digital mind counts as much as an actual human friend. Ramsey would find this axiologically hollow. For Ramsey, value requires a **valuer**. While he believed in objective goods (influenced by G.E. Moore), these goods were inextricably tied to human consciousness as it actually exists. To sacrifice concrete, known goods (current welfare, friendship, political stability) for the sake of *potential* goods that depend on speculative metaphysics is to invert the proper order of importance.

  In the "Epilogue," Ramsey insists that we must draw our "map" of importance based on what we can actually feel and influence. The "stellar vastness" shrinks on this map not because it is physically small, but because it is **normatively distant**. AI existential risk arguments attempt to expand the map to include the physically vast but normatively inaccessible. Ramsey would argue this dilutes value rather than maximizing it.

  ### 3. The Synthesis: Rationality as Human Flourishing
  The most interesting position available to Ramsey—and the one he would likely adopt—is that **rationality is subordinate to human flourishing, not the other way around.**

  Longtermism often presents itself as the logical conclusion of taking rationality seriously: if you accept Expected Utility Theory, you *must* accept longtermism. Ramsey would reject this deduction. He developed Expected Utility Theory to help agents avoid inconsistency in pursuing their *actual* ends, not to dictate what those ends should be based on mathematical magnitude.

  For Ramsey, the purpose of logic and probability is to serve the "good life," which is defined by the immediate capacities for thought and feeling described in the "Epilogue." If the application of the calculus requires us to ignore the "friendship and conversation" that constitute the good life in favor of optimizing for abstract, unbettable futures, then the calculus has ceased to be a tool of rationality and become a form of idolatry.

  Ramsey would likely characterize the longtermist prioritization of AI risk as a **philosophical confusion** similar to the one he attacked in Keynes's objective probability. Just as Keynes mistakenly looked for probability in the logical relations between propositions rather than in human belief, longtermists mistakenly look for value in the physical extent of the future rather than in the quality of present experience.

  ### Conclusion
  Frank Ramsey would not accept the longtermist case. He would argue that the **epistemic confidence** required to calculate AI existential risk violates the pragmatic constraints of "Truth and Probability," and the **axiological weighting** of astronomical future lives violates the human-centric value theory of the "Epilogue."

  He would conclude that while we should certainly care about the future, rationality does not demand we sacrifice the known, bettable goods of the present for the sake of speculative, unbetttable magnitudes. The "odd double role" Ramsey occupies is resolved by seeing his decision theory as the grammar of human choice, and his humanism as the semantics. Longtermism, in his view, would be grammatically correct but semantically empty.
