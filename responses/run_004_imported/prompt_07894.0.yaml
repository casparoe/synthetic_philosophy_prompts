      "Eighty percent," Alex said. "You're at twenty. Same track record, same calibration. We're genuine peers. Split the difference."

      Blake shook his head. "No. I evaluated the first-order evidence. You did too. My credence reflects the evidence as I see it. Updating solely because you disagree treats your conclusion as evidence superior to my own reasoning process. It's not."

      "It's not superior, it's equal," Alex said. "That's the point of peerhood. The fact of disagreement is higher-order evidence that I've likely made a mistake. Ignoring that is dogmatism."

      "It's not dogmatism, it's the Total Evidence View," Blake countered. "I must weigh all evidence, including the fact you disagree. But my direct assessment of the data outweighs the inference that 'Blake disagrees, therefore I'm wrong.' I can't abandon my reasoning just because it conflicts with yours. If I did, I'd be reasoning incorrectly by my own lights."

      Alex leaned in. "But we disagree on that principle too. I'm conciliationist; you're steadfast. We're still peers. So, apply your view: you stay steadfast on steadfastness. Apply mine: I should lower my confidence in conciliationism because you disagree."

      "Correct," Blake said.

      "But here's the trap," Alex said. "If I'm right, you *should* conciliate on this meta-question. If you conciliate on the meta-question, your confidence in steadfastness drops. If it drops enough, you lose the justification for ignoring my forecast. The Equal Weight View demands you apply it to itself. If you don't, you're exempting your core norm from scrutiny. If you do, you average your way into agreeing with me."

      Blake paused. "If I update on our meta-disagreement, I become less certain about epistemic norms. I don't necessarily become a conciliationist. I just become a uncertain steadfaster. Even if I grant a 10% chance you're right about the norm, my first-order evidence still points to 20%. Why does your norm override my data?"

      "Because the norm dictates how you process the data," Alex said. "Including the data point that is me."

      "Then I'll update," Blake said. "I'm now 90% confident I should ignore you. So I'm moving my forecast from 20%... to 19%. Happy?"

      "No," Alex said. "But at least you're consistent."

