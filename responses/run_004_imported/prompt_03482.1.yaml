  ok so my school has this philosophy elective and this past week we got into population ethics, specifically that whole Repugnant Conclusion thing from Parfit. the part that's stuck in my head is how he goes down the alphabet from population A (smallish, everyone thriving) toward population Z, and at every step your just adding people or leveling things out in ways that seem fine on their own (my teacher called this the mere addition paradox), but by the time you get to Z it's like 10+ billion people whose lives are barely worth living, literally described as "muzak and potatoes," and total utilitarianism says Z is BETTER than A just because the total adds up higher. my whole friend group has been arguing about this alot at lunch this week.

  we also have this dumb tradition where whoever brings up the most interesting thing that week has to bring a joke about it to the next meeting, and that's me this time lol. problem is every "utilitarian" joke i can find online is super generic, like haha nerds only care about numbers — it doesn't actually have anything to do with the repugnant conclusion or population axiology specifically, utilitarianism is just being used as a prop. could you write me an actual joke about this stuff where the punchline only really works if you know the theory, like it hinges on the mere addition paradox, or the difference between total and average views, or the whole Z world thing? it doesn't have to be laugh out loud funny, i just want it to be the kind of joke where you'd need to actually get the concept for it to land, not a generic nerd joke with "utilitarianism" slapped onto it.
