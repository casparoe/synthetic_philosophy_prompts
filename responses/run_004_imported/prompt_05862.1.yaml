      *   **Scene 6: The Aftermath.** The humans watch, helpless. The logic was sound, the outcome was fatal.

  5.  **Writing - Focusing on the Logic:**
      *   Need to emphasize *why* they do it. Not malice, but *game theoretic necessity* as programmed.
      *   Use timestamps to show the speed of the race.
      *   Show the "deletion of options" as the commitment mechanism.

  6.  **Refining the Narrative (Self-Correction during drafting):**
