prompt: |-
  ok this has been living in my head rent-free since my logic reading group last week. We were covering large cardinals and my advisor mentioned, almost as an aside, that the existence of a Reinhardt cardinal -- basically, a nontrivial elementary embedding from V into itself -- looked like a perfectly natural next rung on the large-cardinal ladder when Reinhardt first proposed it, but was later proven outright inconsistent with ZFC by Kunen. Like, someone actually sat down and derived a contradiction from it. Then I fell down a rabbit hole and found that Voevodsky used to give talks arguing we can't be fully confident PA itself is consistent, seemingly motivated partly by his own experience of a serious error surviving in one of his proofs for years before anyone caught it. Now I'm having a low grade crisis about whether any of this stuff is actually on solid ground.

  Please argue against the inference I can't stop running in my head: "a well-motivated, natural-seeming axiom turned out to be flat-out inconsistent once someone checked carefully enough, so we should meaningfully raise our credence that ZFC or PA are inconsistent too, we just havent found the contradiction yet." Actually engage with the strongest version of that worry instead of just gesturing at "well it's survived a century of use" -- and land on a real verdict for how much, if at all, the Reinhardt/Kunen episode should move our credence in the consistency of our core foundational systems.
