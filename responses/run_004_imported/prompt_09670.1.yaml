answer: |-
  Here are 10 interview questions designed to press the "equality of moral standing" account, including the specific topics you requested. Each includes a follow-up tailored to the answer she is most likely to give as a defender of that theory.

  **1. The Hypercritic Case**
  "Let's test the boundaries of 'self-exemption.' Imagine a 'hypercritic'—someone who holds themselves to a *stricter* standard than they hold others. They flake on plans occasionally, but when they do, they berate themselves mercilessly, while offering others grace for the same behavior. They aren't exempting themselves; they're punishing themselves more than anyone else. On your account, do they retain the standing to blame others for flaking?"
  *   **Follow-up:** "If you say yes, they *do* have standing, doesn't that suggest the real currency here isn't 'equality' at all, but rather 'severity'? If I can lose standing for being too soft on myself, but keep it by being too hard on myself, aren't we actually tracking humility or self-punishment rather than equal moral status?"

  **2. The Epistemic Condition (Unwitting Hypocrisy)**
  "Does losing standing require the blamer to *know* they are inconsistent? Suppose I call you out for bailing on plans, genuinely forgetting that I did the exact same thing last month. Objectively, I'm treating myself as an exception, but subjectively, I believe we are equal. Do I lose my standing in that moment of ignorance?"
  *   **Follow-up:** "If you say I *don't* lose standing without knowledge, then standing isn't about the factual inconsistency, it's about honesty or sincerity. But if you say I *do* lose standing even unknowingly, how can I be guilty of 'denying equal standing' if I explicitly affirm it in my own head? How do you deny a principle you aren't aware you're violating?"

  **3. The Ubiquity Objection**
  "Psychological research suggests almost everyone exhibits some degree of in-group bias or inconsistent moral weighting—we're all harsher on strangers than friends, for example. If any self-exemption cancels standing, does your account imply that almost nobody has the standing to blame anybody for anything serious? Is the moral community effectively silent?"
  *   **Follow-up:** "I suspect you'll want to set a threshold—that only *significant* self-exemptions count. But if you introduce a threshold, aren't you admitting that 'equality' isn't the binary switch that cancels standing? Doesn't that require a separate theory to explain why *some* inequalities matter and others don't?"

  **4. Restoration of Standing**
  "Is standing permanent once lost, or can it be earned back? If I admit my hypocrisy, apologize, and commit to doing better, do I regain the right to blame others for the same fault, or am I permanently 'marked' by that initial inconsistency?"
  *   **Follow-up:** "If you say I *can* earn it back, does that mean standing is actually a function of my current reputation or track record, rather than a fundamental claim about equality? After all, my moral equality as a person hasn't changed during my period of hypocrisy, so why did my standing vanish and then return?"

  **5. Proportionality of Fault**
  "Consider a mismatch in magnitude. I've been known to speed occasionally, but you just committed a serious fraud. Intuitively, it feels wrong for me to say, 'You shouldn't have done that,' because I'm a lawbreaker too. But on your view, I haven't exempted myself from the norm against *fraud*. Do I have standing to blame you for the fraud even if I violate the norm against speeding?"
  *   **Follow-up:** "If you say yes, I have standing, you risk making the theory counter-intuitive. But if you say no, you imply that standing is 'contagious' across different moral domains. If it is contagious, doesn't that bring us back to the Ubiquity problem—that any minor flaw wipes out standing for major criticisms?"

  **6. Motivation and Good Faith**
  "Two people blame a wrongdoer. One is a hypocrite blaming them out of malice; the other is a hypocrite blaming them out of genuine care to prevent future harm. Both are technically self-exempting. Does the motivation matter for standing, or is the structural inconsistency the only thing that counts?"
  *   **Follow-up:** "If you say motivation *doesn't* matter, why do we care about standing in the first place? Is the point of standing to protect the blamed from unfair treatment, or to police the moral purity of the blamer? Because if it's the former, the caring hypocrite shouldn't be silenced."

  **7. Private vs. Public Blame**
  "Your account relies on the idea that the hypocrite makes an 'implicit claim' of superiority. Does this happen in a private text message between two friends? If there's no audience to witness the claim of superiority, is the standing still lost, or is standing a purely social status?"
  *   **Follow-up:** "If you say standing is lost even in private, then the 'implicit claim' is a psychological fact, not a social one. But if it's psychological, doesn't that mean I can lose standing even if I *feel* equal to you? That seems to detach standing from the actual relational dynamic between us."

  **8. The 'Untested' Blamer**
  "What about someone who has never violated a norm simply because they've never been tempted? A person who has never cheated on a partner, not because of virtue, but because they've never had an opportunity. Do they have standing to blame a cheater? They aren't self-exempting, but their 'clean hands' are just luck."
  *   **Follow-up:** "If you say they *do* have standing, we are grounding standing in moral luck rather than moral character. If you say they *don't*, then standing requires not just consistency, but *tested* consistency. Which one is it? Because those are two very different requirements."

  **9. The 'Act vs. Blamer' Distinction**
  "You often defend your view by saying, 'I'm not saying the act wasn't wrong, just that *you* can't say it.' But if the wrongness of the act is objective, and the message is true, what work is 'standing' actually doing? Is it a moral shield for the wrongdoer, or just a procedural rule for conversation?"
  *   **Follow-up:** "If it's a moral shield, doesn't that mean the wrongdoer gets to benefit from the blamer's flaw? That seems to let the wrongdoer off the hook twice—once for their act, and once for silencing their critic. How do you avoid making standing a tool for deflection, which is exactly what we're trying to prevent?"

  **10. Falsification and Theory Choice**
  "Finally, I want to ask about the limits of the equality account. Is there any specific case or intuition pump that would actually make you abandon the 'equality of standing' theory in favor of a rival, like a 'commitment' or 'sincerity' account? Or is the equality framework flexible enough to explain away any counter-example?"
  *   **Follow-up:** "If the answer is that the framework can explain away any counter-example, how do we distinguish between a robust theory and one that's been insulated from criticism? What would the world have to look like for you to say, 'Okay, equality isn't the right metric here'?"
