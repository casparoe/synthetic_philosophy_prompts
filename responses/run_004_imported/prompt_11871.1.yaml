      *   **Dirty Hands/Statesmanship Position:** Political ethics differ from private ethics. Leaders face tragic choices where all options are bad. The nominee's subsequent work (democracy building) is worthy of honor. Honoring the *current* contribution doesn't whitewash the *past* sin. Withdrawing might look like political interference or historical revisionism.

  3.  **Analyze the Statutory Constraint ("Disrepute"):**
