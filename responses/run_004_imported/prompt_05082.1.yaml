      *   **Kant:** Did he actually believe animals were unfeeling automatons? This is a crucial nuance. Kant acknowledged animals feel pain (*Leiden*), but he denied them *rational autonomy* and *self-consciousness* in the moral sense. He didn't think they were *moral agents* or *ends in themselves* because they lack rationality. The "indirect duty" view stems from their lack of moral status, not necessarily a denial of sentience (though his empirical understanding was limited compared to today).
      *   **The User's Logic:** If Premise A (animals don't feel) is false, then Conclusion B (no direct duties) is unsound. This is logically valid *if* Premise A was the sole foundation.
      *   **Modern Philosophy:** Most contemporary ethicists reject the "indirect duty" view. Peter Singer (utilitarian), Tom Regan (rights-based), Martha Nussbaum (capabilities approach) all argue for direct moral consideration based on sentience or inherent value.
      *   **Current Status of Indirect Duty:** It's largely a minority view now, mostly held by strict Kantians trying to salvage the framework or contractarians (like Carl Cohen) who tie moral status strictly to moral agency/reciprocity.

