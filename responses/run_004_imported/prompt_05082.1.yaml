answer: |-
  First off, congratulations on adopting a senior dog. There is something profoundly special about giving an old girl a soft place to land for her final chapter. It sounds like she's already teaching you a lot, even beyond the ethics.

  Your intuition is spot on, and your friend's explanation touches on a fascinating tension in the history of philosophy. To answer your core question: **No, "indirect duty" is not the dominant view in contemporary philosophy anymore.** While you can still find philosophers who defend a version of it, it is largely considered a relic, or at least a minority position that requires a lot of heavy lifting to maintain in light of modern science.

  Here is a breakdown of where the philosophy stands, where your friend might have slightly conflated two thinkers, and why you probably don't need to lose sleep over the dog food.

  ### 1. Descartes vs. Kant: A Crucial Distinction
  Your friend blended Descartes and Kant slightly, which is common in casual conversation, but the distinction matters for your question.

  *   **Descartes** really did view animals as *bêtes machines* (beast machines). He famously argued they lacked an immortal soul and therefore lacked conscious experience. When a dog yelped, Descartes suggested it was no different than a squeaky hinge; it was mechanical, not felt.
  *   **Kant** was a bit more nuanced. He actually acknowledged that animals feel pain and have desires. He didn't think they were unfeeling robots. However, he argued that **moral status requires rationality.** For Kant, to be a "person" (an end in themselves) you have to be capable of moral autonomy—making free, rational choices. Since animals act on instinct and impulse, they aren't "persons." Therefore, we can't have duties *to* them, only duties *regarding* them.

  So, your critique is partially right: Kant's view relies on an empirical hierarchy where human rationality is the only thing that matters. But he didn't deny animals felt pain; he just denied that *feeling pain* was enough to grant them moral rights.

  ### 2. Does the Argument Collapse?
  You asked: *If the premise that animals are unfeeling automatons is false, shouldn't the argument collapse?*

  Strictly speaking, Kant's argument doesn't logically collapse because his main premise wasn't "animals don't feel," it was "only rational beings matter morally." However, **the *persuasiveness* of the argument collapses** for most modern people.

  Why? Because we now understand that the capacity to suffer (sentience) is morally significant.
  *   **The Scientific Shift:** Neuroscience and ethology have confirmed what you see when you look at your dog: animals have complex emotional lives, self-awareness, and the capacity for suffering.
  *   **The Ethical Shift:** Most modern ethicists argue that if a being can suffer, that suffering matters *to the being*, regardless of whether they can do calculus or understand the Categorical Imperative.

  If you accept that suffering is bad, and animals suffer, then causing that suffering is directly wrong, not just because it makes *you* a jerk (the indirect duty), but because it hurts *them* (the direct duty).

  ### 3. Is "Indirect Duty" Still Defended Today?
  It is defended, but it is no longer the default.

  *   **The Contractarians:** Some philosophers (like the late Carl Cohen) argue that morality is a contract between rational agents. Since dogs can't sign the contract or understand rights, they don't have them. This is a modern version of the indirect duty view.
  *   **The Strict Kantians:** Some try to update Kant by arguing that while animals aren't "ends in themselves," our treatment of them reflects our rational nature so profoundly that it *functions* like a direct duty.

  However, the overwhelming majority of contemporary animal ethicists argue for **direct duties.**
  *   **Peter Singer (Utilitarian):** Argues that the boundary for moral consideration is **sentience** (the ability to suffer), not rationality. If it suffers, it counts.
  *   **Tom Regan (Rights View):** Argues that many animals are "subjects-of-a-life" (they have beliefs, desires, memory, emotional life) and therefore have inherent value and rights.
  *   **Martha Nussbaum (Capabilities Approach):** Argues we have duties to allow animals to flourish according to their specific species capabilities.

  In short: If you walked into a philosophy seminar on animal ethics today and said, "We only have indirect duties to animals," you would be the one having to defend a minority position.

  ### 4. How Much Weight Should You Put on This? (The Guilt Question)
  It is very easy to fall into "ethics paralysis," where you worry so much about the perfect moral choice that you stress yourself out. Here is a practical way to frame it:

  **Even if Kant were right, you should still treat her well.**
  Kant argued that being cruel to animals makes us cruel to humans. He said, *"He who is cruel to animals becomes hard also in his dealings with men."* So, even under the "relic" view, buying her good food, taking her to the vet, and treating her with kindness is morally required to maintain your own virtue.

  **But since Kant is likely wrong (on this specific point), you can do it for her sake.**
  You can rest easy knowing that your intuition—that she has a stake in her own life—is backed by modern science and the majority of current ethical thought. You aren't just "practicing kindness" on a biological machine; you are interacting with a sentient being who trusts you.

  **A note on the dog food:**
  Don't let the rabbit hole consume you. The "perfect" ethical dog food doesn't exist (there are supply chain issues, environmental costs, nutritional needs). The best ethical choice is usually:
  1.  Keep her healthy and pain-free (especially at 11!).
  2.  Make sure the food is nutritionally appropriate for a senior dog.
  3.  Don't stress so much that you enjoy your time with her less.

  ### Summary
  Your friend gave you a accurate summary of 18th-century reasoning, but that reasoning has largely been superseded. We now know animals are not automatons, and most philosophers agree that sentience grants direct moral status.

  You adopted a senior dog to be thoughtful about how you treat animals. You are already doing the right thing. The philosophy is just catching up to what you already feel when you look at her. Enjoy your time with her; that relationship is the real ethics in action.
