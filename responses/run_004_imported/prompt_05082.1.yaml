          *   If the reason for indirect duty is "they don't have souls/minds," and science says "they do have complex minds," the force of the argument weakens significantly.
      *   **Current Philosophical Landscape:**
          *   Is "indirect duty" still defended? Yes, but it's niche.
          *   Who defends it? Strict Kantians (humans as rational legislators), Contractarians (morality is a deal between rational agents).
