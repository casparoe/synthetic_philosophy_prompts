answer: |-
  Your simulation is almost certainly correct, and your friend's reasoning contains a classic, subtle flaw that trips up a lot of smart people (including quants and engineers).

  The short answer is: **Your friend is thinking in Arithmetic Returns, but investing is a Geometric Process.**

  Here is the breakdown of why your simulation shows what it shows, why his logic fails over long time horizons, and the specific mathematical concepts at play.

  ### 1. Arithmetic vs. Geometric Mean
  Your friend's argument relies on the **Arithmetic Mean** (the simple average).
  In your simulation:
  *   **Upside:** +30%
  *   **Downside:** -20%
  *   **Arithmetic Expected Return:** $(0.30 + (-0.20)) / 2 = +5\%$

  He is correct that if you leverage this 2x, the arithmetic expected return doubles to +10%. If you lived in a world where returns were additive (you take your profit out every year and stuff it under a mattress), he would be right.

  But investing is **multiplicative** (compounding). You care about the **Geometric Mean** (CAGR).
  *   **Unlevered Geometric Return:** $\sqrt{1.30 \times 0.80} - 1 \approx \sqrt{1.04} - 1 \approx \mathbf{1.98\%}$
  *   **2x Levered Returns:** +60% / -40%
  *   **2x Geometric Return:** $\sqrt{1.60 \times 0.60} - 1 \approx \sqrt{0.96} - 1 \approx \mathbf{-2.02\%}$

  **The Smoking Gun:** In your specific simulation, 2x leverage turns a winning strategy into a losing one. Even though the *average* return is higher, the *compounded* return is negative. If you alternate one up year and one down year for 50 years, the unlevered portfolio grows, and the 2x levered portfolio shrinks to near zero.

  ### 2. Volatility Drag (Variance Drain)
  There is a rough approximation formula for the relationship between Arithmetic Return ($A$), Geometric Return ($G$), and Volatility/Variance ($\sigma^2$):

  $$G \approx A - \frac{\sigma^2}{2}$$

  Leverage scales both the Return ($A$) and the Volatility ($\sigma$).
  *   If you apply $L$ leverage:
      *   New Arithmetic Return $\approx L \times A$
      *   New Volatility $\approx L \times \sigma$
      *   New Variance $\approx L^2 \times \sigma^2$

  Plug that into the approximation:
  $$G_{levered} \approx (L \times A) - \frac{L^2 \times \sigma^2}{2}$$

  Notice that the return term scales linearly ($L$), but the penalty term scales **quadratically** ($L^2$). At a certain point, increasing leverage increases the volatility penalty faster than it increases the expected return. This is called **Volatility Drag**.

  Your simulation hit the point where the drag outweighed the gain.

  ### 3. Ergodicity: "Expected Value" vs. "Your Experience"
  This is the philosophical core of the bug in your friend's logic. It's a concept called **Ergodicity**.

  *   **Ensemble Average (Expected Value):** If you simulate 1,000,000 parallel universes and average the outcome, the leveraged portfolio will likely have a higher average value. This is because in the tiny fraction of universes where you get 50 "up" years in a row, the leverage makes you unimaginably rich (trillions of dollars), which skews the mean massively.
  *   **Time Average (Median Outcome):** In *your* single timeline, you experience one path. The "median" path (what happens 50% of the time) is governed by the Geometric Mean.

  Your friend is optimizing for the **Ensemble Average** (which includes outlier luck), but you live in the **Time Average**. In finance, we care about the probability of ruin or underperformance in *this* timeline, not the average wealth across *all possible* timelines.

  ### 4. The Kelly Criterion
  There *is* an optimal amount of leverage that maximizes geometric growth. It's called the **Kelly Criterion**.
  *   Leverage below Kelly: You are leaving growth on the table.
  *   Leverage at Kelly: You maximize CAGR.
  *   Leverage above Kelly: You increase risk, but your CAGR actually **decreases**.
  *   Leverage at 2x Kelly: Your expected growth rate drops to zero (breakeven).
  *   Leverage above 2x Kelly: Your expected growth rate becomes **negative**.

  In your simulation (+30%/-20%), the volatility is high enough that 2x leverage is likely past the "2x Kelly" point, which is why the median outcome is a loss.

  ### 5. A Note on Leveraged ETFs
  Your friend mentioned 2x/3x ETFs specifically. These have an additional mechanic that makes them worse than simple margin leverage for long-term holds: **Daily Reset**.

  Leveraged ETFs rebalance daily to maintain a constant leverage ratio.
  *   If the market drops 10%, a 3x ETF drops 30%.
  *   To get back to 3x leverage, the fund must sell assets into the bottom.
  *   If the market rebounds 11.1% (to get back to even), the ETF gains 33.3% on the *reduced* base.

  Due to the math of percentages (losing 50% requires a 100% gain to recover), daily resetting in a choppy market creates significant decay beyond standard volatility drag. This is why prospectuses for these ETFs say they are for "daily trading," not long-term investing.

  ### Verdict
  **Your sim is not buggy.** Your friend is falling for the "Arithmetic Mean Trap."

  *   **He is right that:** The *mathematical expectation* (mean) of the final wealth is higher with leverage.
  *   **He is wrong that:** This makes it a "better bet." In compounding systems, the Geometric Mean is what determines long-term wealth, and high leverage destroys Geometric Mean via volatility drag.

  **The Sanity Check:**
  Tell him this: If I offer you a bet where you flip a coin. Heads you win 50%, Tails you lose 40%.
  *   Arithmetic Mean: +5%.
  *   If you bet 100% of your net worth every time, will you get rich?
  *   No. After one Head and one Tail, you have $1.5 \times 0.6 = 0.90$ of your money. You lose 10% every two flips.
  *   Leverage is just betting more than 100% of your net worth on that same coin flip.

  There is an optimal leverage point (usually between 1.5x and 2x for the broad market, depending on volatility assumptions), but "more is always better" is mathematically false.
