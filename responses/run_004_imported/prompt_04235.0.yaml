answer: |-
  **Setting:** *A nearly empty café, late evening. Two empty coffee cups sit between ELENA and MARCUS. The conversation is already heated.*

  **Marcus:** You're treating David like a closed system. That's the problem. You say he has no reason to leave his partner unless he *wants* to leave, or unless leaving serves something he already wants. But that renders the word "reason" toothless. David is destroying his life. He is anxious, depressed, and isolated. To say he has no reason to stop destroying himself simply because his current desires are misaligned with his well-being is absurd.

  **Elena:** It's not absurd, Marcus, it's honest. We're talking about *practical* reasons. Reasons for action. If a consideration cannot possibly figure in an explanation of his action, even after sound deliberation, in what sense is it a reason *for him*? Williams's point is precise: A reason must have a grounding in the agent's "subjective motivational set"—his S. If there is no sound deliberative route from David's current projects and cares to leaving her, then telling him he "has a reason" is just us projecting our own motivations onto him. It's a polite wish, not a fact.

  **Marcus:** But that collapses normativity into psychology! If reasons are just reflections of what an agent happens to care about, then you lose the ability to call someone *irrational*. You can only call them "differently motivated." If David cares more about the comfort of the relationship than his own long-term mental health, internalism says he is acting perfectly rationally. He's satisfying his S. But he's not! He's being irrational. He's ignoring goods that are objectively good for him.

  **Elena:** Hold on. Internalism doesn't say every desire is rational. We can criticize David's deliberation. Is he acting on false beliefs? Is he ignoring consequences he claims to care about? If he says he values his career, and this relationship is getting him fired, then he has an internal reason to leave. We can point out the inconsistency. But if he deliberates clearly, knows the costs, and simply *doesn't care* about the career or the anxiety as much as he cares about not being alone... then he doesn't have a reason to leave. And you can't manufacture one out of thin air.

  **Marcus:** That's where you retreat into the subjective set to save the theory. But consider Williams's own example. The man wants a gin and tonic. He reaches for a glass he believes contains gin. It actually contains petrol. Williams says the man has no reason to drink from the glass. Why? Because if he knew it was petrol, he wouldn't want to drink it. The reason vanishes upon correction of belief.

  **Elena:** Exactly. Because the reason was contingent on his desire for gin, not on the liquid itself.

  **Marcus:** No, that's not the only way to read it. We can say he has no reason to drink the petrol because drinking petrol is *bad for him*. It damages his organism. That fact constitutes a reason not to drink it, regardless of whether he desires health or longevity. If he says, "I don't care if I burn my esophagus, I want a drink," Williams says he has a reason to drink the petrol (relative to his desire). I say he still has no reason to drink it, and a decisive reason not to, because the nature of petrol and the nature of human physiology generate reasons independently of his S.

  **Elena:** But what work is that reason doing? This is my challenge to you, Marcus. If David is like the petrol drinker—he is psychologically incapable of being moved by the fact that the relationship is "bad" in your objective sense—then telling him he has a reason is useless noise. A practical reason must be capable of motivating. If your "external reason" cannot hook onto a motivation, even potentially, it's not a reason for action. It's just a moralistic scold.

  **Marcus:** You're conflating "capable of motivating" with "currently motivating." Korsgaard would say that as rational agents, we are constituted to respond to reasons. If David isn't moved by the fact that his relationship is abusive, he isn't just "differently motivated"; he's failing as a rational agent. The reason exists, and it *should* motivate him. The fact that he is numb to it doesn't make the reason disappear; it makes him irrational. You internalists are so afraid of metaphysical spookiness that you deny the authority of reason itself.

  **Elena:** I'm not afraid of spookiness; I'm afraid of falsehood. Look at David. He loves her. He cares about her happiness more than his own. That is in his S. You want to say, "No, those desires don't count. The *real* reason is self-preservation." But why? If self-preservation isn't in his S, why is it a reason? You're essentially saying, "He has a reason to do what we would want him to do if he had our motivational set." That's not an external reason; that's just *your* internal reason, universalized illegitimately.

  **Marcus:** It's not about *our* set. It's about the requirements of agency. Parfit argues that certain facts—like pain, or coercion, or self-destruction—are reason-giving in themselves. If David is being coerced, he has a reason to escape, even if he has been brainwashed into loving the coercer. Would you tell the brainwashed victim they have no reason to leave because their S has been altered to desire the abuse?

  **Elena:** I would say the brainwashing involves false beliefs and compromised deliberative capacities. We can trace a route from their deeper, pre-brainwashing S, or from the universal desire to avoid pain *if they were thinking clearly*. Internalism allows for correcting beliefs and expanding imagination. Williams allows that deliberation can lead to new motivations. But there must be a *route*. If the victim is so broken that there is no route from *any* element of their psychology to leaving, then saying "you have a reason" is not helping them. It's just describing the world from the outside. It's saying, "From my perspective, there is a reason." Don't pretend that's a fact about *him*.

  **Marcus:** But that's precisely the point of normativity! It stands outside the perspective. If I say, "You ought to leave," I am not saying, "I want you to leave." I am saying, "The situation demands it." If internalism is true, then moral criticism is impossible against someone with a sufficiently alien S. A sadist who enjoys torture has no reason to stop, on your view, provided he deliberates correctly from his sadistic desires.

  **Elena:** I didn't say he has no reason to stop. I said he has no internal reason to stop. He might have external reasons, in your sense, but they won't be practical for him. And yes, that makes moral criticism difficult. But it's more honest than pretending there's a normative force floating in the ether that *must* grip him. If the sadist doesn't care about others, and reason doesn't compel him to care, then he is a threat we must contain, not a rational interlocutor we can argue with. Your view promises we can always argue him out of it because "reason demands it." My view says: maybe he's just bad. Maybe there's no argument for him.

  **Marcus:** That's a surrender of the rational enterprise! If we can't say the sadist is irrational, but merely "unaligned with our S," then rationality is just a tribal custom. You're worried about the gin/petrol case, but you're missing the stakes. If reasons are internal, then improvement is impossible unless the agent already wants to improve. But often, we come to see reasons we *didn't* have before. We change our minds because we recognize a reason, not because we found a hidden desire.

  **Elena:** You recognize a reason because you found a hook in your S you hadn't noticed. Maybe you cared about consistency, or you cared about not being cruel, but you hadn't applied it to this case. Deliberation brings it to light. It doesn't summon it from the void. Look, go back to David. If you tell him, "You have a reason to leave," and he says, "I've thought about it, I know I'll be depressed, I know I'll be lonely, and I prefer that to leaving her," what is your next move?

  **Marcus:** My next move is to say, "You are weighing those factors incorrectly. The value of your autonomy and dignity outweighs the comfort of the relationship."

  **Elena:** And if he says, "I don't value autonomy and dignity more than comfort"?

  **Marcus:** Then he is wrong. Not just "different." Wrong.

  **Elena:** But you can't give him a further reason to be "right" in your way. You've hit bedrock. His S is the bedrock. At that point, your "external reason" is just you shouting "Be like me!" at him. I'm saying we should admit that. If we can't find a route from his love for her, or his fear of loneliness, to leaving, then we should stop pretending rationality is on our side. We should just say, "We care about you, and this hurts us to watch." That's honest. Your view pretends there's a logical gun to his head when there isn't.

  **Marcus:** It's not a logical gun. It's the structure of value. You think the value comes from the desire. I think the desire should track the value. David's desire is tracking a false value. He thinks the relationship is good. It isn't. That falsity generates a reason to leave, independent of his tracking error. You're reducing truth to psychology.

  **Elena:** And you're reifying values into ghostly entities that supposedly move people without actually moving them. If a reason can't motivate, it's not a practical reason. It's a theoretical observation. "There is a fact that would motivate a standard agent." Fine. But David isn't a standard agent. He's David. And for David, right now, the reason doesn't exist.

  **Marcus:** Then David is irrational. And we are justified in intervening, not just as friends with different preferences, but as agents of reason itself.

  **Elena:** Intervene because you care, Marcus. Not because "Reason" told you to. Don't hide your care behind a metaphysical claim you can't prove.

  **Marcus:** And don't hide your fear of judgment behind a psychological claim that denies the possibility of error.

  *They sit in silence for a moment, the hum of the refrigerator filling the gap. Neither reaches for their coat.*
