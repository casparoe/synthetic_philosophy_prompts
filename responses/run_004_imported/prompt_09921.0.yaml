prompt: |-
  Got into a whole argument with my friend last night about Nietzsche's diet obsession in Ecce Homo -- like the "Why I Am So Clever" section where he goes on about nutrition, climate, digestion, avoiding alcohol, all that. My friend's take is that it's basically hypochondriac rambling, totally seperate from the "real" philosophy, and that you can pretty much skip it if your reading him seriously. I think that's wrong -- I think the physiology/diet stuff is actually doing philosophical work, tied into his attack on the ascetic ideal, decadence, and his idea of "great health" from the Gay Science. Can you build the strongest possible case for my side? Please actually dig into specifics from the diet-and-health material (the bit on German cuisine ruining the spirit, the crack about alcohol and Christianity both being narcotics, the digestion-tempo-of-the-spirit stuff, etc) instead of just a generic "Nietzsche cared about the body" gesture, and show how it actually connects to his bigger arguments about morality and physiology.
