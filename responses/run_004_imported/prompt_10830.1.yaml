answer: |-
  First off: take a deep breath. You are not about to embarrass yourself; you have put your finger on the single most debated interpretive crux in *On Certainty*. If you walk into that seminar and frame this tension as the central problem of the text, your grad students will be thrilled, not skeptical.

  To answer your question directly: **No, you are not overreading the tension.** It is an actual fault line, and it maps almost perfectly onto the contemporary divide in hinge epistemology between **Propositionalists** and **Non-Propositionalists (or Enactivists)**.

  However, calling it a "fault line" might imply Wittgenstein failed. A more charitable (and I think defensible) reading is that Wittgenstein is *performing* a shift in perspective. He starts with the picture that tempts us (341) and then dismantles it to show us what's actually going on (358–359).

  Here is how you can stitch these together for your seminar, along with the scholarly landscape you can reference if things get hairy.

  ### 1. The Surface Tension (341 vs. 358–359)

  **Remark 341 (The Structural Picture):**
  > "…some propositions are exempt from doubt, are as it were like hinges on which those turn."

  Here, Wittgenstein is still using the grammar of epistemology. He talks about "propositions." This invites the reading that hinges are special *truths* that we just happen not to doubt. This is the "Propositionalist" reading (championed by scholars like **Annalisa Coliva**). On this view, hinges are propositions that play a normative role in our epistemic systems. They are the rules of the game, but they still look like moves in the game.

  **Remark 358–359 (The Anthropological Picture):**
  > "…as a form of life… as something animal."

  Here, Wittgenstein explicitly rejects the epistemic framing ("beyond being justified or unjustified"). By calling it "animal," he is pointing to **behavior**, not belief. This is the "Non-Propositionalist" or "Enactivist" reading (championed by **Danièle Moyal-Sharrock**). On this view, calling a hinge a "proposition" is a grammatical illusion. It looks like a proposition ("The earth exists"), but it functions like a reflex (reaching for a doorknob without checking if it's there).

  ### 2. How to Reconcile Them (The "Defensible" Reading)

  The most robust way to teach this is to argue that **341 describes the phenomenon from the inside, while 359 describes it from the outside.**

  Wittgenstein knows we are addicted to the propositional form. We can't help but *say* "I know I have two hands." So, in 341, he acknowledges that in our language-games, these things appear as propositions.

  But in 358–359, he warns us not to be seduced by that surface grammar. If we treat hinges as propositions, we invite the skeptic to ask, "What is your evidence for that proposition?" (which is Moore's mistake). By shifting to "form of life" and "animal," Wittgenstein is saying: **Certainty is not a mental state regarding a proposition; it is a way of acting.**

  **The Synthesis for your students:**
  The "hinge" isn't the sentence written on the door; the hinge is the *mechanism* that allows the door to swing. Sometimes that mechanism looks like a sentence (341), but its authority comes from the fact that it is part of the building's structure (our form of life), not because it has been proven true (359).

  **Why 358–359 is the stronger reading:**
  If you stick only with 341, you leave open the possibility that hinges *could* be doubted if we just tried hard enough (radical skepticism). If you accept 359, doubt becomes unintelligible. You can't "doubt" a reflex; you can only fail to have it. This blocks skepticism more effectively.

  ### 3. Seminar Strategy: Three Moves to Make

  If the conversation stalls or gets contentious, here are three moves to deploy:

  **Move A: The "Riverbed" Metaphor (OC 96–99)**
  Remind them of the riverbed analogy. The water (empirical propositions) flows over the rocks (hinges). But the rocks can shift.
  *   *Point:* 341 focuses on the rocks looking like part of the river. 359 focuses on the fact that they are the *bed*.
  *   *Question for students:* "Is the riverbed part of the river? In one sense yes (it's in the channel), in another sense no (it doesn't flow)."

  **Move B: Knowledge vs. Certainty**
  Wittgenstein insists "I know" is misused in hinge contexts.
  *   *Point:* "Knowledge" implies the possibility of doubt and justification (341 territory). "Certainty" (359 territory) is the absence of the language-game of justification.
  *   *Question for students:* "When you walk through a door, do you *know* it won't be solid wall? Or do you just walk? If you say 'I know,' when did you check?"

  **Move C: The Self-Correction in 358**
  Address Wittgenstein's comment that 358 is "badly expressed."
  *   *Point:* Don't let them dismiss it as Wittgenstein being confused. He calls it "badly expressed" because language *forces* us to speak propositionally. He is struggling to point at something pre-linguistic using linguistic tools.
  *   *Question for students:* "Why does W call his own insight 'badly thought'? Is it because 'form of life' sounds mystical, or because our epistemic vocabulary literally cannot capture non-epistemic certainty?"

  ### 4. Scholarly "Name-Dropping" (If needed)

  If you need to signal familiarity with the secondary literature:
  *   **Moyal-Sharrock:** Argues hinges are "non-propositional certainties." They are "knowing how," not "knowing that." (Aligns with 359).
  *   **Coliva:** Argues hinges are "propositions" that function as rules. We accept them as part of epistemic rationality. (Aligns with 341).
  *   **Duncan Pritchard:** Tries to bridge them (Hinge Commitments). He suggests we can have a "rationally grounded" faith in hinges without evidence.

  ### Summary for your prep
  You aren't facing a contradiction; you are facing a **dialectic**. Wittgenstein lures us in with the propositional picture (341) because that's how we think, then pulls the rug out (359) to show that epistemology rests on anthropology.

  If a student presses you on which is "correct," your best answer is: **"341 is how it looks to the skeptic; 359 is how it looks to the therapist."** Wittgenstein's goal isn't to build a theory of hinges (which would trap him back in 341); his goal is to cure us of the need to justify them (which lands us in 359).

  You've got this. The fact that you spotted this tension means you're reading the text closer than most. Good luck tomorrow.
