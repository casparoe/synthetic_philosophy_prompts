answer: |-
  A Total Utilitarian dies and stands before the Throne. He asks God for the final verdict on the infinite world he just left.

  God opens the Ledger of Welfare. The entries stretch on forever, alternating: +1, -1, +1, -1...

  God squints at the page. "Well, if I group the entries as $(+1 - 1) + (+1 - 1)...$, the total welfare is zero. The world was ethically null."

  The soul panics. "But Lord, what if You group it as $+1 + (-1 + 1) + (-1 + 1)...$? Then the total is one! The world was a net good!"

  God taps a finger on the desk. "True. In the first case, you're in Purgatory. In the second, you're in Heaven."

  "So... which is it?" the soul begs. "Does my salvation depend on the lives we led?"

  God closes the Ledger and sighs. "No. In an infinite universe, salvation isn't a matter of virtue. It's a matter of punctuation."
