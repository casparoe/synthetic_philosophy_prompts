answer: |-
  Good evening. For those who don't know me, I'm a friend of Nora's. I'm also a philosophy PhD student, though I work in ethics. So, while Nora and Owen are arguing about *what exists*, I'm usually just arguing about *what we should do*. Honestly, giving this toast is more stressful than my own defense. At my defense, the stakes were just a degree. Here, the stakes are metaphysical truth, and half the room is ready to object if I misuse the word "continuant."

  Nora and Owen met in a seminar arguing about temporary intrinsics. They haven't really stopped. To the family: this means they met by disagreeing about how objects change over time. To the department: Nora thinks you're a four-dimensional spacetime worm made of temporal parts. Owen thinks you're a three-dimensional object wholly present at every moment.

  Nora asked me not to call them the "same people" who met in that seminar unless I could earn it. Owen asked me to confirm he isn't just a bundle of temporal parts stapled together.

  So, here is the argument: You *are* the same people. Not because your ontology has converged—it hasn't—but because the *love* is the invariant. Nora, for you, this love is a continuous world-line connecting every slice of your life. Owen, for you, this love is wholly present in every moment you look at each other. And Owen, rest assured: Love isn't a staple holding your parts together. It's the substance. It's what makes the unity real, regardless of the theory.

  Which brings me to the vows. You're promising "till death do us part." Now, this is the one joke I get to make, and it's the only premise you've ever agreed on. For Owen, "till death" means the end of the whole object. For Nora, it just means the final temporal segment of the worm. But the real punchline is this: Most couples worry that "till death do us part" is too short. But for the two of you, it's the only boundary condition in the universe you both accept without argument.

  To the parents: You might wonder why a relationship built on arguing works. It works because in philosophy, arguing isn't fighting. It's paying attention. It's saying, "Your view of the world matters enough for me to engage with it completely."

  So, let's raise a glass. To Nora and Owen. However you persist, however you count the moments, or if you're wholly present in just one: May your marriage be the one thing that requires no defense.

  To the bride and groom!
