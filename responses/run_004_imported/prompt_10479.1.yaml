answer: |-
  The observation glass was cold enough to fog if you breathed too hard. Marcus kept his distance, arms crossed, but Elena was up against the pane, watching the subject stir on the cot below.

  "She's opening her eyes," Elena said. "What's her credence, Marcus? Don't give me the prior. What's her credence *now*?"

  "Five hundred," Marcus said. "Fifty percent. It's a fair coin."

  "It's a fair coin, but she's not in a fair sample space. Run the trilemma. If she wakes and learns it's Monday, you agree the coin is 50/50, right? Conditional on Monday, Heads and Tails are equiprobable."

  Marcus didn't blink. "Agreed."

  "And if the coin landed Tails, she can't distinguish Monday from Tuesday. Subjectively, this waking is identical to that one. So, within the Tails branch, the probability of it being Monday equals the probability of it being Tuesday."

  "Standard indifference. Fine."

  "Then do the math, Marcus. If Heads-Monday equals Tails-Monday, and Tails-Monday equals Tails-Tuesday, then all three are equal. She's in one of three indistinguishable centers. Heads is one-third. To say otherwise is to say she can distinguish indistinguishable moments."

  Marcus finally looked at her, a thin smile playing on his lips. "You're conflating the frequency of awakenings with the probability of the cause. I accept your premises, Elena. I accept that conditional on Monday, Heads and Tails are equal. I accept that within Tails, the days are equal. But I don't accept your conclusion."

  "Because you're magic-ing the prior to stay fixed."

  "Because the waking *isn't* evidence. She knew the protocol beforehand. She knew she'd be here. Learning 'I am awake now' tells her nothing about the coin."

  "So when she opens her eyes, she thinks Heads is 1/2."

  "Correct."

  "And if you walk down there and tell her 'It's Monday'?"

  Marcus shrugged. "Then her credence in Heads jumps to two-thirds."

  Elena laughed, a sharp bark that echoed in the booth. "There it is. The Lewis Bullet. You're telling me that merely knowing the day of the week makes Heads more likely than Tails? That's insane. It implies the calendar has causal power over the flip."

  "It implies that *you* are updating on self-locating information, not objective chance. Waking up didn't change the odds. Learning the day eliminates the Tuesday-Tails world. Since I hold the prior at 1/2, eliminating one half of the Tails branch leaves Heads dominating the remaining Monday branch. It's consistent. It's just counterintuitive."

  "Consistent with what? Her experience?" Elena turned back to the glass. The subject was sitting up, rubbing her temples. "Let's crank it. Protocol B. Heads: one waking. Tails: one hundred wakings. She wakes up. According to you, she's still 50/50 it's Heads."

  "Yes."

  "She could wake up ninety-nine times in a row. Memory wiped every time. On the hundredth waking, she's still supposed to believe there's a fifty percent chance the coin landed Heads? When Tails produces a century of experience and Heads produces a day?"

  "Frequency of experience isn't frequency of truth," Marcus said, his voice hardening. "If you bet on Heads every time, you lose more often, yes. But that's because the betting structure is rigged by the awakening count, not because the coin is biased. If you ask her *once*, at the end of the experiment, what the coin was, she should say 1/2. If you ask her *every time* she wakes, you're sampling the Tails world more heavily. You're counting the same universe multiple times."

  "I'm counting her life multiple times," Elena corrected. "That's the point. From inside the glass, the universe *feels* like it's Tails. You're asking her to ignore the weight of her own existence to preserve the sanctity of a coin flip she can't see."

  "I'm asking her to distinguish between how often she wakes and how often the coin lands. You want her to treat her own amnesia as evidence against the coin. I'm saying the coin doesn't care about her memory."

  Below them, the subject looked up. She couldn't see them through the one-way mirror, but Elena felt the gaze like a pressure.

  "She has to place a bet today, Marcus," Elena said softly. "One bet, this waking. If it's Heads, she wins $100. If Tails, she loses $100. If you're right, it's a fair bet. If I'm right, she's stepping into a trap. Tails is twice as likely to be the ground beneath her feet."

  "Then she should decline the bet," Marcus said. "But that doesn't make the coin Tails."

  "It makes her rationality dependent on your dogma." Elena tapped the glass, right where the subject's eyes were fixed. "She's in the Tails branch. I can feel it. And you're going to tell her the calendar lies."

  Marcus turned away from the glass, picking up his clipboard. "I'm going to tell her the truth. The coin is fair. Everything else is just noise."

  "Noise is what you call a hundred days of your life," Elena said. "Keep telling yourself that when she asks you why she lost."
