  So $P(Heads \& Mon) = 1/2$.
  Total probability of Monday = $1/2 + 1/4 = 3/4$.
  $P(Heads | Monday) = (1/2) / (3/4) = 2/3$.
  Okay, I need to make sure Marcus articulates that learning the day *is* the informative event, not the waking.

  7.  **Final Review against constraints:**
