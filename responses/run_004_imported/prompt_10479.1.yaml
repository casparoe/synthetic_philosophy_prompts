          *   Premise 2: $P(Monday | Tails) = P(Tuesday | Tails)$. (Indifference principle applied to the subjectively identical awakenings within the Tails world).
          *   Conclusion: $P(Heads) = 1/3$.
          *   *Key Move:* Centered worlds. Waking up *is* new evidence because it shifts the self-locating belief.
      *   **Halfer (Lewis):**
          *   Premise: Waking up provides no *new* relevant evidence about the coin flip itself. The prior $P(Heads) = 1/2$ holds.
          *   Consequence: If $P(Heads) = 1/2$ and $P(Monday | Tails) = P(Tuesday | Tails)$, then conditional on it being Monday, Heads becomes more likely.
          *   *Key Move:* $P(Heads | Monday) = 2/3$. This is the "bullet" the user wants bitten. Lewis argues that learning the day *is* informative, even if waking up wasn't.
      *   **The "Hundred Awakenings" Pressure:** If Tails = 100 wakings, Thirders say $P(Heads) \approx 1/101$. Halfers say $P(Heads) = 1/2$. This makes the Halfer position seem absurd (ignoring the frequency of experience), but the Halfer must defend it as maintaining the integrity of the prior.

