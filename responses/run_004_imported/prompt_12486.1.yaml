answer: |-
  This is a profound observation, and you have put your finger on the exact nerve that makes consciousness science distinct from comparative physiology. In your former line of work, if you and I disagreed about whether a fish had a specific ion channel, we could sequence the genome. If we disagreed about whether a behavior was reflexive or voluntary, we could design a lesion study. The *criteria* for "ion channel" or "voluntary" are functional and structural; they are defined by their role in the physical system.

  Consciousness is different because it is not defined by its role. It is defined by its *intrinsic nature* (what it is like to be the system). Because we cannot observe intrinsic nature from the outside (the "Hard Problem"), we are forced to use proxies. And here is the rub: **different theories choose different proxies based on different metaphysical commitments.**

  To illustrate this, let's use a creature you know intimately: **The Octopus.** But we will construct a specific hypothetical variation, grounded in real neuroanatomy, that drives a wedge between **Integrated Information Theory (IIT)** and **Global Workspace Theory (GWT)**. These are currently the two heavyweight contenders in the field (currently being tested in adversarial collaborations funded by the Templeton Foundation).

  ### The Creature: The "Decentralized" Octopus

  Imagine an octopus (*Octopus vulgaris*) that is physiologically identical to the ones you studied, with one specific clarification in the connectome data. We have a complete map of its nervous system.

  1.  **The Arms:** As you know, roughly two-thirds of an octopus's neurons are in the nerve cords of its arms. These arms can taste, touch, and execute complex motor programs (like unscrewing a jar) even when surgically severed from the central brain, provided they are oxygenated.
  2.  **The Central Brain:** The central brain coordinates the arms for whole-body locomotion and complex learning.
  3.  **The Crucial Detail:** In our hypothetical specimen, the connectome reveals that while the arms send *sensory summaries* to the central brain, they do not receive *top-down modulation* from the central brain during local manipulation. Furthermore, the central brain does not broadcast arm-specific sensory data back to the other arms or to all motor systems globally. The integration is "loose." The arm acts as a semi-autonomous agent.

  Now, we present this complete dossier to two theorists. They agree on every ion channel, every synapse, and every behavior. The animal avoids noxious stimuli, learns mazes, and camouflages.

  ### Theorist A: The Integrated Information Theorist (IIT)
  **Representative:** Giulio Tononi or Christof Koch.
  **Core Axiom:** Consciousness *is* integrated information ($\Phi$). A system is conscious to the extent that it has a large repertoire of cause-effect states that are irreducible to the sum of their parts.
  **The Verdict:** **High Consciousness (Potentially Multiple Subjects).**
  **The Reasoning:** The IIT theorist calculates $\Phi$ for the arm ganglia. Because the arm ganglia have dense recurrent connectivity and can integrate sensory input (chemo/tactile) with motor output in a way that is irreducible to individual neurons, the arm itself generates a significant $\Phi$.
  **The Implication:** For the IIT theorist, **the severed arm is likely conscious.** It is a "subject of experience." The whole octopus might be a "society of minds"—one central subject and eight peripheral subjects. The physical structure *constitutes* the experience. If the causal power is there, the light is on.

  ### Theorist B: The Global Workspace Theorist (GWT)
  **Representative:** Stanislas Dehaene or Bernard Baars.
  **Core Axiom:** Consciousness *is* global availability. A state is conscious only if information is broadcast from a specialized module to a "global workspace," making it available to *all* other cognitive systems (memory, speech, motor planning, meta-cognition).
  **The Verdict:** **No Consciousness (in the arms); Uncertain (in the head).**
  **The Reasoning:** The GWT theorist looks at the arm ganglia. They see local processing, but they do not see a "broadcast." The arm's sensory data is not made available to the central brain's memory systems or the other arms in a way that allows for flexible, reportable access. It is a "zombie" subsystem—complex, adaptive, but unconscious.
  **The Implication:** For the GWT theorist, **the severed arm is definitely not conscious.** It is a sophisticated reflex arc. Consciousness requires a specific functional architecture (ignition/broadcasting) that the arm lacks. Even the central brain might be questionable if it lacks a specific "workspace" architecture analogous to the mammalian thalamocortical loop.

  ### The Standoff

  Here is the situation:
  *   **Biology:** 100% agreed upon.
  *   **Behavior:** 100% agreed upon.
  *   **Conclusion:** IIT says "There is suffering in that arm." GWT says "There is nothing it is like to be that arm."

  If you were on an ethics committee deciding whether to anesthetize the arm during a procedure, you would have no recourse to further data. Sequencing more genes won't help. Running more mazes won't help. The disagreement is not about the *mechanism*; it is about **what mechanism counts as the marker.**

  ### Why This Is an In-Principle Conceptual Problem

  You asked why this isn't just a gap that better brain-scanning tech could close. Here is the philosophical breakdown of why this is a category error relative to standard biology.

  #### 1. The Problem of Individuation (What is a "Subject"?)
  In standard biology, individuation is usually spatial or genetic. A cell is a cell; an organism is an organism. But consciousness theories force us to ask: **What are the boundaries of a *subject*?**
  *   **IIT** allows for "overlapping" subjects. The arm is a subject; the whole octopus is a subject. They coexist.
  *   **GWT** and **Higher-Order Theories (HOT)** generally demand a singular, unified locus of access.
  *   **The Conceptual Wedge:** There is no biological fact that tells us where a "subject" begins and ends. Biology gives us causal boundaries (membranes, synapses). Consciousness theories posit *experiential* boundaries. We have no instrument to measure "experiential boundaries." We are projecting a metaphysical grid onto a physical substrate.

  #### 2. The Problem of the Marker (Function vs. Nature)
  In physiology, traits are defined functionally. "Digestion" is the breakdown of food. If a creature breaks down food using acid, or enzymes, or bacteria, it is digestion.
  Consciousness is not defined functionally; it is defined phenomenologically (by the feeling).
  *   **The Trap:** To make it scientifically tractable, theories *redefine* consciousness functionally.
      *   IIT redefines it as **Integration**.
      *   GWT redefines it as **Broadcasting**.
      *   HOT redefines it as **Meta-Representation**.
  *   **The Wedge:** When IIT and GWT disagree about the octopus, they are effectively arguing about the definition of a word, not the state of the world. They are saying, "Should we call *this* physical state 'consciousness'?" Since we cannot step outside our own heads to compare our "consciousness" with the octopus's "consciousness," we can never verify which functional definition is the "true" one.

  #### 3. The Epistemic Asymmetry
  In your work on fish nervous systems, you operated on the assumption of **Public Observability**. We can both look at the gill.
  Consciousness is **Privately Observable**.
  *   I only know consciousness exists in me.
  *   I infer it exists in you based on analogy (you look like me).
  *   I infer it exists in an octopus based on *theory* (it acts like me / it is built like me).
  *   **The Wedge:** Because the data (behavior/anatomy) is always public, and the target (experience) is always private, the link between them is underdetermined. No amount of public data can logically necessitate a private experience (the Philosophical Zombie argument). Therefore, any link we posit is a philosophical wager, not an empirical discovery.

  ### The "New York Declaration" Context
  The statement you recall is likely the **New York Declaration on Animal Consciousness (2022)**, signed by many of the people you are reading (including Godfrey-Smith, Birch, etc.). It essentially argues that we should apply a **precautionary principle**: if there is a non-zero probability of consciousness, we should treat the animal as if it is conscious.

  This declaration is an admission of the very problem you identified. It acknowledges that science cannot currently settle the debate, so we must pivot to ethics. It admits that waiting for "conclusive data" might mean waiting forever, because the disagreement is about the *criteria for evidence*, not the evidence itself.

  ### Summary
  For a comparative physiologist, this is frustrating. You are trained to believe that nature is consistent and that disagreement implies missing data. In consciousness science, disagreement often implies **divergent axioms**.

  *   If you believe consciousness is a **physical property of causality** (IIT), the octopus arm is conscious.
  *   If you believe consciousness is a **specific cognitive function** (GWT/HOT), the octopus arm is likely not.

  We cannot resolve this with an fMRI or a connectome because those tools measure *correlates*, not the *thing itself*. Until we solve the Hard Problem (explaining *why* physical processing feels like anything at all), we are left with these competing "markers," and creatures like the octopus will remain Rorschach tests for our philosophical commitments.
