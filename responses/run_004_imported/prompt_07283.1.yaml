answer: |-
  You are absolutely right to trust your gut on this one. Your brother-in-law is deploying a very specific, "zombie argument" that gets recycled frequently in certain circles. It sounds sophisticated because it name-drops a heavyweight philosopher of science, but it relies on taking a specific, temporary comment out of context and ignoring how actual biology works.

  You also did great homework: **Yes, Popper did change his mind.**

  Here is the breakdown of the Popper argument, why the "tautology" charge is a misunderstanding of biology, and how you can handle this at the holidays without needing a philosophy degree.

  ### 1. The "Tautology" Charge: Is "Survival of the Fittest" Meaningless?
  Your brother-in-law's strongest point is the claim that "survival of the fittest" is a tautology (a circular statement like "bachelors are unmarried men"). The argument goes: *How do we know who is fittest? They survived. Why did they survive? Because they were fittest.*

  If that were the whole theory, he would be right. It would be meaningless. But that is **not** how evolutionary biologists define or use fitness.

  *   **Fitness is defined independently:** In modern evolutionary theory, "fitness" isn't just a trophy given to the winner after the race. It is a measurable set of traits *before* the selection happens. We can measure an organism's metabolic efficiency, camouflage contrast, reproductive output, or disease resistance *before* we know if it survives.
  *   **The Prediction:** The theory predicts that organisms with Trait A (e.g., darker wings in a soot-covered forest) will have a higher reproductive rate than organisms with Trait B (lighter wings).
  *   **The Test:** We then observe the population. If the light-winged moths reproduce *more* than the dark-winged ones in a soot-covered forest, the theory is falsified.

  Because we can define "fitness" via specific traits independent of the survival outcome, it is not a tautology. The phrase "survival of the fittest" (coined by Herbert Spencer, not Darwin) is a slogan, not the mathematical mechanism of natural selection.

  ### 2. Popper's "Flip-Flop" (You found the right paper)
  Your research was spot on. Popper's views on evolution are often cited as a static monolith, but they evolved (pun intended).

  *   **1974 (The Quote your BIL is using):** In a lecture at Darwin College, Cambridge, Popper described Darwinism as a "metaphysical research programme." He was concerned that because evolution deals with unique historical events, it lacked the predictive power of physics. He worried it could explain anything after the fact but predict nothing beforehand.
  *   **1978 (The Recantation):** Four years later, in a paper titled *"Natural Selection and the Emergence of Mind,"* Popper explicitly changed his position. He wrote:
      > *"I have changed my mind about the testability and logical status of the theory of natural selection; and I am glad to have an opportunity to make a recantation."*

  **Why did he change his mind?**
  Popper realized that while the *history* of life (the specific narrative of what happened when) is hard to test, the *mechanism* of natural selection is highly testable. We can create experiments (like with bacteria or fruit flies) where we control the environment and predict which traits will be selected for. When those predictions hold up, the theory passes the falsifiability test.

  ### 3. Is Evolution Falsifiable? (The "Bunny" Test)
  Even if Popper hadn't changed his mind, his criterion for science (falsifiability) is actually met by evolutionary theory. Evolution makes "risky predictions." If these were proven false, the theory would collapse.

  Famous geneticist J.B.S. Haldane, when asked what could disprove evolution, famously quipped: **"Fossil rabbits in the Precambrian."**

  Here are actual ways evolution could be falsified (but hasn't been):
  *   **Chronological Errors:** Finding complex mammal fossils in rock layers dated to the time of simple single-celled organisms.
  *   **Genetic Contradictions:** If humans were more genetically similar to mushrooms than to chimpanzees, the tree of common descent would be shattered.
  *   **Impossible Complexity:** Finding an organ that functions perfectly but could not have evolved through incremental steps (though every time this is claimed—like the eye—biologists have found the incremental steps).

  ### 4. Does Popper's Opinion Matter Anyway?
  This is the philosophical "checkmate" move. Even if Popper had stuck to his 1974 gun, it wouldn't matter for two reasons:

  1.  **Popper was wrong about other sciences:** Popper's strict falsifiability criterion is actually too rigid for many accepted sciences. Historical geology, cosmology, and parts of medicine rely on inference to the best explanation rather than lab-repeatable predictions. If we apply Popper's 1974 standard strictly, we might have to say "plate tectonics isn't science" either.
  2.  **Philosophy of Science moved on:** Popper was influential, but he isn't the final authority. Later philosophers (like Thomas Kuhn and Imre Lakatos) showed that science is messier than Popper thought. Scientific theories are judged by their explanatory power, consistency, and ability to generate new research, not just a binary "falsifiable/not falsifiable" stamp.

  ### Holiday Dinner Cheat Sheet
  If this comes up again, you don't need to win a debate, just plant seeds of doubt about his "knockdown argument." Here are three talking points:

  1.  **The "Recantation" Point:**
      *   *"It's true Popper said that in '74, but did you know he publicly took it back in '78? He admitted natural selection is testable after all. Citing the 1974 quote is like citing a scientist's hypothesis before they ran the experiment."*
  2.  **The "Tautology" Point:**
      *   *"The 'survival of the fittest' line is a slogan, not the math. Biologists measure fitness by traits like reproduction rates and physical advantages before the animal even dies. If the animals with the 'advantageous' trait died off more, the theory would be wrong. That makes it testable, not a tautology."*
  3.  **The "Falsifiability" Point:**
      *   *"Evolution is falsifiable. If we found human fossils alongside trilobites, or if our DNA was more similar to corn than chimps, the theory would be dead. It survives those tests, which is why it's science."*

  **Summary:** Your brother-in-law is using an outdated philosophical objection to a slogan, rather than the actual scientific theory. Popper himself corrected the record, and modern biology defines fitness in a way that avoids the tautology trap. You're on solid ground.
