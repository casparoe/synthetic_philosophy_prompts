      *   **Specific Constraints:**
          *   Do not relitigate the generic "was the bomb justified" debate.
          *   Focus on the *intended/foreseen* distinction and the *unconditional surrender* point.
          *   Engage with the "supreme emergency" exemption (Walzer).
          *   **Crucial:** Reach an actual verdict. Do not sit on the fence ("good arguments on both sides"). Commit to a position (even if qualified).
