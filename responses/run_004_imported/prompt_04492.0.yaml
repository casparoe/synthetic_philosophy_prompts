          *   **Format:** Essay form.

  2.  **Deconstruct Anscombe's Position:**
      *   *The Pamphlet (1956):* "Mr. Truman's Degree." Argues Truman is a war criminal/murderer.
      *   *The Philosophy (1957):* *Intention.* Distinguishes between what is intended (means/end) and what is merely foreseen (side-effect).
      *   *The Application:* Killing innocents *as a means* to break morale/force surrender = Murder. Killing innocents as a *side-effect* of hitting a military target = Permissible (under DDE).
      *   *The Political Context:* Anscombe argues the real injustice was the policy of *Unconditional Surrender*. This policy made the bombing necessary (in the US view) to force surrender. If the US had offered terms allowing the Emperor to stay, surrender might have happened without the bomb/invasion.
      *   *The Moral Absolute:* Certain actions are intrinsically evil regardless of consequences.

  3.  **Deconstruct the Counter-Position (Consequentialist/Walzer):**
      *   *Consequentialism:* The right action maximizes good/minimizes harm. If the bomb saved more lives (Japanese and Allied) than an invasion or blockade, it was justified.
      *   *Walzer's "Supreme Emergency":* In *Just and Unjust Wars*, Walzer argues that standard rules of war can be suspended when a community faces imminent destruction and the threat is "extraordinary." However, Walzer actually *criticizes* the atomic bombing later, but his framework is often used to defend it. I need to use the *spirit* of the argument: The stakes (Kyushu invasion, Soviet entry, prolonged blockade) were so high that the prohibition on targeting civilians might be overridden.
      *   *The Grandfather's Perspective:* The invasion of Kyushu (Operation Downfall) was real. Casualty estimates were high. The bomb ended the war.

  4.  **Evaluate the "Intention" Machinery:**
