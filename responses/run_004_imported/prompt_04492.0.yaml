answer: |-
  **The Means and the End: Anscombe, Intention, and the Verdict on Truman**

  The dinner table argument was inevitable, though I had hoped to avoid it. My grandfather, a veteran who spent the summer of 1945 training for the invasion of Kyushu, views the atomic bombing of Hiroshima and Nagasaki through the lens of his own survival. To him, the bombs are not abstract moral puzzles; they are the reason he came home to marry my grandmother and raise a family. When I mentioned G.E.M. Anscombe's 1956 pamphlet, *Mr. Truman's Degree*, in which she argued that Harry Truman was a war criminal who should not be honored by Oxford, the air left the room. For him, Anscombe's philosophy was an insult to the dead who would have died in an invasion. For me, it was a cornerstone of action theory.

  Yet, as I finalize the historical chapter of my thesis on Anscombe's *Intention* (1957), I have come to suspect that the relationship between the pamphlet and the monograph is not merely biographical. The technical machinery of *Intention*—specifically the distinction between intended means and merely foreseen side-effects—appears to be the philosophical fortification of the moral stance she took in the pamphlet. Anscombe was not merely protesting a political decision; she was staking a claim about the structure of human action. She argued that the atomic bombings constituted murder because the death of civilians was not a side-effect of military action, but the very means by which victory was sought. Furthermore, she located the root injustice not solely in the bomb, but in the Allied policy of Unconditional Surrender.

  To determine whether Anscombe's charge of murder holds up, we must test her specific philosophical machinery against the strongest available defense: the consequentialist calculation of lives saved, bolstered by Michael Walzer's concept of "supreme emergency." While the emotional weight of my grandfather's experience is undeniable, a rigorous analysis of Anscombe's framework reveals that the consequentialist defense fails to justify the intentional killing of innocents. Anscombe's charge holds: the bombing was murder, not because the consequences were bad, but because the action itself violated the fundamental grammar of moral agency.

  To understand Anscombe's accusation, one must understand the distinction she formalized in *Intention*. Anscombe argues that moral evaluation depends on the "order of intention." When an agent acts, they intend an end (victory) and choose means to achieve it. Sometimes, acting to achieve a end produces effects that are not part of the plan but are merely foreseen. The Doctrine of Double Effect (DDE) permits actions where bad effects are foreseen but not intended, provided the action itself is good or neutral. However, if the bad effect is the *means* to the end, it is intended.

  Anscombe applies this ruthlessly to Hiroshima. The US leadership did not bomb Hiroshima simply to destroy a military depot while regretting the civilian deaths (which would be foreseen side-effects). They bombed Hiroshima to destroy the city *in order to* shock the Japanese government into surrender. The terror and death of the civilians were the mechanism of coercion. As Anscombe writes, "the killing of the innocent as a means to an end" is always murder. By making the destruction of civilian life the instrument of policy, Truman crossed a moral boundary that no calculation of utility can bridge.

  The strongest reply to this, and the one my grandfather implicitly invokes, is consequentialism. This view holds that the morality of an act is determined by its outcomes. In 1945, the alternatives were a continued blockade, a Soviet invasion of Manchuria, or Operation Downfall, the Allied invasion of the Japanese home islands. Estimates for casualties in an invasion vary wildly among historians, ranging from hundreds of thousands to millions of Japanese and Allied deaths. The consequentialist argues that if the bombs saved more lives than they took, they were not only permissible but obligatory.

  Michael Walzer, in *Just and Unjust Wars*, provides the most sophisticated deontological-adjacent version of this argument through the "supreme emergency" exemption. Walzer suggests that when a political community faces imminent destruction and the threat is extraordinary, leaders may be forced to override the usual rules of war (such as non-combatant immunity) to survive. While Walzer himself eventually expresses deep ambivalence about the atomic bomb, the logic of "supreme emergency" is the best shield for Truman: the Japanese military's refusal to surrender created an emergency so grave that the prohibition on targeting civilians was temporarily suspended to prevent a greater catastrophe.

  However, Anscombe's machinery dismantles this defense on two fronts: the epistemic weakness of consequentialism and the political origin of the "emergency."

  First, the consequentialist defense relies on speculative mathematics to justify a certain evil. To claim the bombs were justified, one must prove with moral certainty that the alternative (invasion or blockade) would have resulted in *more* deaths. Historical consensus on this is elusive. Casualty estimates for Operation Downfall were projections, not facts. The Japanese government was already fractured and seeking terms via the Soviets. The blockade was starving the nation. To kill 200,000 people instantly on the basis of a *prediction* that more would die later is to treat human beings as resources in a utilitarian calculus rather than persons with inviolable rights. Anscombe's point in *Intention* is that the moral character of an act is determined at the moment of choice, based on what is intended, not on the uncertain roll of the future's dice. If the act is intrinsically evil (killing innocents as a means), no amount of speculative good consequences can cleanse it.

  Second, and more devastatingly, Anscombe's point about Unconditional Surrender undermines the "supreme emergency" claim. A supreme emergency must be a threat faced by the agent, not one manufactured by the agent's own intransigence. Anscombe argued that the deeper injustice was the Allied demand for Unconditional Surrender. By refusing to clarify that the Emperor could remain—a key sticking point for the Japanese leadership—the Allies prolonged the war. If the political goal had been a negotiated peace rather than total capitulation, the "necessity" of the bomb evaporates.

  This is where Anscombe's insight is most profound. The "emergency" that Walzer describes was not a natural disaster like an asteroid strike; it was a political construct. The US leadership created a scenario where they felt they had no choice but to kill civilians because they had ruled out all political choices that would not require it. You cannot claim the defense of "necessity" when you have deliberately closed off the exits. If I lock a man in a room with a gun and tell him "kill the hostage or I won't let you out," I cannot later claim his killing of the hostage was a tragic necessity of survival. The Allies, by demanding Unconditional Surrender, locked the door. Therefore, the "supreme emergency" exemption does not apply, because the emergency was, in part, self-inflicted to ensure a specific political outcome.

  This leads to the verdict. Does Anscombe's charge of murder hold up? **Yes.**

  It holds up because the consequentialist defense requires us to accept that human beings can be used as mere means to an end if the arithmetic works out. If we accept that, we lose the concept of justice entirely, replacing it with management. My grandfather's survival is a miracle of history, but it does not validate the moral principle that cities should be vaporized to save soldiers. The fact that the bomb saved his life is a consequence, not a justification of the *intent*.

  Furthermore, the "supreme emergency" defense collapses under Anscombe's political analysis. Because the Allies refused to offer terms that might have ended the war without invasion or atomic fire, they cannot claim the killing was the *only* way to avoid catastrophe. The intent remained: break the will of the Japanese by destroying their people. That fits Anscombe's definition of murder precisely.

  This verdict is painful. It implies that the action which saved my grandfather's life was morally monstrous. It suggests that the "good" outcome (his survival, the end of the war) was achieved through an evil act. This is the hard truth of Anscombe's ethics: the world is not arranged so that good consequences always flow from good actions. Sometimes, doing the right thing (refusing to target civilians) might lead to terrible short-term costs. But for Anscombe, and for a coherent moral philosophy, we are responsible for our actions, not for all the consequences of the world.

  Anscombe's *Intention* provides the vocabulary to see why the bomb was different from conventional collateral damage. In conventional bombing, if a factory is hit and civilians die, the death is a side-effect of destroying war-making capacity. In Hiroshima, the destruction of the city *was* the message. The death was the point. By formalizing this distinction, Anscombe did not just write a textbook; she built a firewall against the idea that statecraft exempts one from the moral law.

  In the end, my grandfather is right that the bomb saved his life. But Anscombe is right that it was murder. We can honor his survival without endorsing the act that secured it. To do otherwise is to admit that in the extreme pressures of war, human beings cease to be ends in themselves and become numbers in a strategic equation. Anscombe's legacy is the refusal to accept that equation. Her charge holds, not because she ignored the stakes, but because she recognized that some boundaries must not be crossed, even when the world is burning. The machinery of *Intention* proves that the moral quality of the act resides in the will of the actor, and in 1945, the will of the Allied leadership chose to make the death of the innocent the instrument of their victory. That is the definition of murder, and no amount of historical hindsight can change the nature of the act.
