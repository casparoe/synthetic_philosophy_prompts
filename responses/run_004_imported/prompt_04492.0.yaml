          *   *The Unconditional Surrender Loophole:* Anscombe's key insight. The "emergency" wasn't purely natural; it was policy-driven. If you refuse a negotiated peace, you can't claim "necessity" later. This undermines the "Supreme Emergency" exemption.
      *   **Section 4: The Moral Weight of the Distinction.** Why does the intended/foreseen distinction matter? It preserves the dignity of the victim. Consequentialism makes people into means. Anscombe protects the individual.
      *   **Conclusion:** Reiterate the verdict. Anscombe was right. It was murder. This doesn't mean Truman was a monster in every way, but the act was intrinsically evil. Acknowledge the grandfather's survival but note that survival doesn't validate the moral principle.

  7.  **Review against Constraints:**
      *   *Essay form?* Yes.
