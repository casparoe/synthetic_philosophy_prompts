      *   *Even Better:* Focus on the **Sentence vs. Term** distinction. You can fix the truth conditions of the sentence (Indeterminacy of Translation minimized/resolved for practical purposes) while leaving the Reference of the terms Inscrutable. *Example:* "There is a rabbit." Translator A: "Gavagai = Rabbit." Translator B: "Gavagai = Undetached Rabbit Part" + "is = is composed of." They produce the same sentence predictions (IT compatible) but posit different objects (IR distinct).
