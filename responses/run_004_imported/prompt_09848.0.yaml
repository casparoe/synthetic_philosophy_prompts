prompt: |-
  My grandmother died two weeks ago, after nearly forty years running a small wildlife rehabilitation shelter out of her garage. I'm taking a seminar this term on wild animal suffering, which has made me realize her views were more carefully thought through than my family gives her credit for: she believed any large-scale attempt to manage predation or otherwise engineer wild populations for their own welfare was a kind of hubris, yet she never once hesitated to save a single suffering animal in front of her, and could explain why that wasn't a contradiction. She left a note asking that whoever spoke not turn her life into a fable about nature's hidden balance, or one about compassion quietly winning out over it, and that no one claim the animals she couldn't save are at peace now, since she never believed that. I'm giving the eulogy at the nature center where she volunteered; the room will hold neighbors who mainly remember the shoebox that was always on her porch, alongside several people from the regional wildlife-rehabilitation network, including the professor who teaches my seminar. Please write the eulogy: it needs to comfort the first group without lecturing them, and satisfy the second that her real, harder position hasn't been smoothed over.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Grandmother, ran a small wildlife rehab shelter from her garage for ~40 years. Died two weeks ago.
      *   **Speaker:** Grandchild, currently taking a seminar on wild animal suffering.
      *   **Grandmother's Philosophy:**
          *  反对 (Against) large-scale management/engineering of wild populations for welfare (seen as hubris).
          *   支持 (For) saving individual suffering animals when encountered (moral obligation).
          *   Believed these two views were *not* contradictory.
          *   Did *not* believe "nature has a hidden balance."
          *   Did *not* believe "compassion wins out over nature."
          *   Did *not* believe dead animals are "at peace now."
      *   **Audience:**
          *   Group 1: Neighbors/Community. Remember the "shoebox on the porch." Need comfort, no lecturing.
          *   Group 2: Wildlife Rehab Network & Seminar Professor. Know the technical/ethical depth. Need to see her real, hard position respected, not sanitized.
      *   **Setting:** Nature center where she volunteered.
      *   **Constraints:** Follow her specific note regarding the content (no fables, no false comfort about peace/balance).

  2.  **Determine the Tone:**
      *   Respectful, grounded, honest, unsentimental but deeply caring.
      *   Avoid clichés about "circle of life" or "gone to a better place."
      *   Bridge the gap between the neighbors' simple admiration and the professionals' ethical understanding.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the setting and the diverse audience. Establish the relationship.
          *   *Idea:* Start with the garage. It's the central image.
          *   *Constraint Check:* Don't make it sound like a fairy tale.

      *   **Addressing the Neighbors (The Shoebox):**
          *   Acknowledge the visible part of her work. The shoebox on the porch.
          *   Validate their memory. She *did* love helping.
          *   *Comfort:* Her life had meaning in those small acts.

      *   **Addressing the Professionals/Professor (The Philosophy):**
          *   This is the tricky part. Need to articulate the "non-contradiction" without using academic jargon that alienates the neighbors.
          *   *The Hubris Point:* She knew we can't fix the wild.
          *   *The Individual Point:* But we can't ignore the one in front of us.
          *   *The "No Peace" Point:* Crucial. Must mention she didn't believe death was a release or that nature is kind.
          *   *Integration:* How to say this gently? "She knew the math, but she played the hand anyway."

      *   **The Core Argument (The Non-Contradiction):**
          *   Why isn't it contradictory? Because scale changes the moral geometry.
          *   Large scale = playing god (hubris).
          *   Small scale = bearing witness/acting on immediate conscience.
          *   *Metaphor:* Maybe cleaning a wound vs. trying to stop war.

      *   **Closing:**
          *   Bring it back to the present.
          *   Honor her specific instructions (no fables).
          *   Final image: The garage, the work, the reality.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is it too academic for the neighbors?
      *   *Fix:* Keep the language concrete. Instead of "utilitarian calculus," use "numbers" or "the big picture." Instead of "moral obligation," use "what was right in front of her."
      *   *Critique:* Is it too blunt for the grieving neighbors?
      *   *Fix:* Soften the edges. Acknowledge the pain of loss without lying about the afterlife. Focus on the *value* of the effort, even if the outcome isn't perfect.
      *   *Critique:* Did I include the note's instructions?
          *   No "hidden balance." (Check)
          *   No "compassion winning." (Check)
          *   No "at peace now." (Check)

  5.  **Drafting - Specific Phrasing:**
      *   *The "Peace" line:* Instead of "she's at peace," say "she wouldn't want us to pretend the animals she lost are resting easy."
      *   *The "Hubris" line:* "She knew we couldn't fix the world."
      *   *The "Shoebox" line:* "To many of you, she was the person with the shoebox."
      *   *The "Professor" nod:* Acknowledge the complexity without naming the seminar explicitly (keeps it personal).

  6.  **Final Polish:**
      *   Check rhythm and flow.
      *   Ensure the transition between the neighbors' view and the professionals' view feels seamless, not like two different speeches.
      *   Make sure the ending lands emotionally.

      *(Self-Correction during final review)*: I need to make sure I don't accidentally imply nature *is* cruel, just that it isn't *managed* for kindness. She accepted nature as it is, but acted as a human within it.

      *Revised thought on the "contradiction":* The key is that she saw rehab not as fixing nature, but as a specific human response to specific suffering. It's an act of integrity, not a correction of the ecosystem.

  7.  **Finalizing the Text:** (Proceeding to generate the eulogy based on these thoughts.)
      *   Start with the garage.
      *   Move to the shoebox.
      *   Address the harder truth (the note).
      *   Explain the philosophy simply.
      *   End with the legacy of the work itself.

  8.  **Post-Draft Check against constraints:**
      *   Comfort neighbors? Yes, by validating their connection to her.
      *   Satisfy professionals? Yes, by accurately stating her anti-hubris/pro-intervention stance.
