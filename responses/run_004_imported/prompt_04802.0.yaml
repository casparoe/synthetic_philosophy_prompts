answer: |-
  This is a profound and frustrating spot to be in, and it is one that many people deeply engaged with the rationalist tradition eventually encounter. You have done the "homework": you know the literature, you respect your counterpart, you have exchanged evidence, and you have attempted structured resolution techniques like double-crux.

  The short answer to your specific question is **no**. There is no principled, in-the-moment algorithm to identify which party is violating rationality norms in a way that allows for immediate deference.

  The longer answer requires unpacking why your theoretical model of the situation might be slightly over-optimistic about human cognition, and what the community has actually converged on as a pragmatic solution when Aumannian ideals collide with human reality.

  ### 1. The Common Prior Assumption is Not Scaffolding
  You mentioned treating the Common Prior Assumption (CPA) as "harmless modeling scaffolding." This is the most critical theoretical pivot point. In the context of human disagreement, the CPA is not a minor technicality; it is the primary locus of failure.

  Aumann's theorem holds that if priors are common, and posteriors are common knowledge, agreement is necessary. However, two people who attended the same meetup and read the same blogs do **not** have common priors. Priors are not just about how you weight evidence *now*; they are the cumulative result of your entire genetic and experiential history up to the moment of the prior.
  *   **Life History:** Your friend may have grown up in a household that experienced financial ruin during 2008; you may not have. That creates a deep, pre-verbal prior about "recession risk" that is not easily overwritten by swapping current evidence.
  *   **Model Space:** You likely disagree on the *structure* of the causal model, not just the probabilities within a shared model. If you are modeling the economy as a fluid dynamic system and your friend is modeling it as a cycle of psychological sentiment, you are not just updating on different data; you are computing functions over different domains.

  When the CPA fails, Aumann's theorem does not apply. Therefore, persistent disagreement is not proof of irrationality; it is proof of divergent priors or divergent model classes.

  ### 2. Bounded Rationality and "Common Knowledge"
  The Geanakoplos–Polemarchakis result you cited relies on agents being able to perfectly communicate their information partitions. Humans cannot do this.
  *   **Lossy Compression:** When you explain your reasoning to your friend, you are compressing a high-dimensional state of mind into language. They decompress it into their own high-dimensional state. Information is lost in both directions.
  *   **Computational Limits:** Even if you trusted each other's inputs perfectly, neither of you has the compute power to fully update on the other's update. You are simulating a Bayesian agent, not *being* one.

  Consequently, the fact that you haven't converged after several conversations does not imply motivated reasoning or self-deception. It implies **bounded rationality**. You are both likely acting as good Bayesians *given your computational constraints*.

  ### 3. The "Irrationality Detector" Trap
  Your desire to find out "who is the irrational party" is understandable, but it is often a meta-cognitive trap.
  *   **The Bias Blind Spot:** Psychological research consistently shows that people are better at spotting bias in others than in themselves. If you assume one of you must be biased, you will likely conclude it is the other person.
  *   **Adversarial Dynamics:** Framing the disagreement as a search for a rationality violation turns an epistemic collaboration into a subtle status contest. This increases the likelihood of motivated reasoning, ironically creating the very problem you are trying to solve.

  ### 4. Pragmatic Heuristics for the "Stuck" Bayesian
  Since there is no magic wand to identify the "sinner," the rationalist community has largely converged on a few heuristics for handling persistent disagreement between epistemic peers:

  **A. Linear Opinion Pooling (Just Average)**
  If you truly regard each other as good-faith Bayesians with comparable track records, the most rational move is often to **average your probabilities**.
  *   If you say 40% and they say 60%, the rational credence for the *group* is 50%.
  *   Why? Because you acknowledge you have limited compute and potentially divergent priors. Your friend's number contains information you don't have (their intuition, their private processing of shared evidence). Ignoring their number entirely is a failure to update on the evidence of *their existence*.
  *   *Heuristic:* If you can't convince each other, and you trust each other's integrity, split the difference.

  **B. The Calibration Test (Track Records)**
  Instead of arguing the current point, look at the past.
  *   Have you both been making Metaculus predictions for a year?
  *   Who is better calibrated? Who has a lower Brier score?
  *   If your friend has a demonstrated history of being well-calibrated on macroeconomic questions and you do not (or vice versa), defer to the better track record. This is empirical evidence of rationality performance, superior to theoretical introspection.

  **C. The Bet (The Hanson Test)**
  Robin Hanson often suggests that if you really believe you are right and the other person is being irrational, **you should bet.**
  *   Propose a wager at the odds implied by your disagreement.
  *   If your friend refuses to bet, it suggests they aren't as confident in their rationality as they claim (or they are risk-averse, which must be accounted for).
  *   If *you* are hesitant to bet, it suggests you suspect you might be the one with the error.
  *   Often, the willingness to bet clarifies whether this is a genuine epistemic disagreement or just "cheap talk" probabilities.

  **D. The Outside View (Reference Classes)**
  You mentioned this is a "mundane Metaculus question."
  *   What is the Metaculus community prediction?
  *   What is the prediction market price (e.g., Polymarket)?
  *   If both of you are deviating significantly from the crowd, you should both be moving toward the crowd, not fighting each other. The "wisdom of crowds" often outperforms individual dyads, even rationalist ones.

  ### 5. A Proposed Path Forward
  You asked for a way to stop "burning yet another evening on this." Here is a specific protocol:

  1.  **Stop trying to converge.** Accept that you have different priors/models and that is allowed.
  2.  **Record the disagreement.** Write down: "User A assigns 40%, User B assigns 60%. Resolution date: X."
  3.  **Average for action.** If you need to make a joint decision based on this probability, use the average (50%).
  4.  **Wait for feedback.** Let reality decide.
  5.  **Update on the result.** When the question resolves, analyze *why* the winner was right. Was it a specific piece of evidence? A model structure? This builds a shared library of heuristics for next time.

  ### Summary
  The rationalist community has not converged on a method to identify "who is broken" in real-time because **humans are not Aumann agents.** The continued disagreement is not hard evidence of a rationality violation; it is hard evidence of the Common Prior Assumption failing and the limits of linguistic bandwidth.

  The most rational thing you can do is to acknowledge that you are both bounded agents, trust the aggregate of your two estimates (or the market's estimate), and let time resolve the truth. Saving the relationship and your evening is worth more than the epistemic utility of forcing a convergence that the math doesn't actually require.
