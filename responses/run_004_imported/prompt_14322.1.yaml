answer: |-
  This is a sophisticated dispute that cuts to the heart of the difference between metaphysical analysis and physical modeling. You and your friend are both grasping something real, but you are talking past each other regarding *what kind of necessity* is doing the work.

  Here is the outside opinion you requested: **Your friend is right that they are doing different kinds of work, but you are right that they share a structural commitment to consistency.** However, your conclusion that Lewis "got the result for free" misunderstands what result the physicists are actually trying to earn.

  Here is the breakdown of why the comparison is illuminating but ultimately category-confused.

  ### 1. Lewis is doing Semantics; Thorne is doing Dynamics

  David Lewis's 1976 paper is an exercise in **conceptual analysis**. His goal is to defend the claim that stories about time travel are not *logically incoherent*. When he distinguishes the two senses of "can," he is analyzing the truth conditions of counterfactual statements.

  *   **Lewis's Guarantee:** This is **logical necessity**. When Lewis says "Tim cannot kill Grandfather," he means there is no possible world (consistent with the facts we are holding fixed) where Tim kills Grandfather. The "guarantee" that the gun jams or Tim slips is not a causal force; it is a logical requirement of the story's coherence. If the gun *didn't* jam, the story would contain a contradiction ($P \land \neg P$). Lewis isn't explaining *why* the gun jams physically; he is explaining why we must *describe* the world as one where the gun jams.

  *   **Thorne/Novikov's Guarantee:** This is **nomological (physical) necessity**. The Novikov Self-Consistency Principle (NSCP) is a claim about the Einstein Field Equations. It asserts that if Closed Timelike Curves (CTCs) exist, the laws of physics only permit solutions where the stress-energy tensor is consistent across the loop.
      *   In the billiard ball papers, Thorne and collaborators aren't just saying "It would be contradictory if the ball didn't go in." They are calculating *trajectories*. They are showing that for a given set of initial conditions, there exists a self-consistent solution to the differential equations (e.g., the ball glances its past self rather than shattering it).
      *   Crucially, they had to prove that **consistent solutions actually exist**. It is logically possible that for some initial conditions, *no* consistent solution exists. If that were the case, the physics would forbid the time travel setup entirely (perhaps via vacuum polarization blowing up the wormhole).

  **The Verdict:** Lewis assumes the scenario is coherent and analyzes the language. Thorne tests whether the scenario *is* coherent under specific physical laws.

  ### 2. The "Guarantee" is not the same thing

  You argue that Lewis needs a "guarantee" just as much as the physicists do: *something* must reach into the timeline to prevent the paradox.

  *   **For Lewis:** The "something" is the **Principle of Non-Contradiction**. It doesn't "reach into" the timeline. It simply defines which timelines are describable. Lewis explicitly argues against "mysterious forces." He says we should expect ordinary coincidences. The "guarantee" is just the fact that false propositions are false.
  *   **For Thorne:** The "something" is the **Geometry of Spacetime**. The curvature of the wormhole mouth physically deflects the ball. This is a causal mechanism. If you build a wormhole and shoot a ball, the NSCP predicts a specific physical interaction that prevents the paradox.

  Your friend is correct: "Incompossible with fixed facts" (Lewis) is a modal claim about truth. "Violates self-consistency" (Thorne) is a dynamical claim about evolution. One is about what can be *said* consistently; the other is about what can *happen* consistently.

  ### 3. Why the Physics Literature still has to "Labor"

  You ask: *"Shouldn't we say instead that Lewis got the easy version of the same result for free, just by talking about 'can' instead of solving equations?"*

  No, because they are solving different problems.

  *   **Lewis solved the Problem of Meaning.** Before Lewis, many philosophers argued time travel stories were nonsense (like "square circles"). Lewis showed they are meaningful. He got this "for free" because it's a logical point.
  *   **Thorne solved the Problem of Stability.** Physicists weren't worried about whether time travel stories were *meaningful*; they knew how to write the sentences. They were worried about whether General Relativity *breaks down* in the presence of CTCs.
      *   It is logically consistent to say "The ball enters the wormhole and kills its past self." Lewis would say: "That story is incoherent; you must mean a world where it fails."
      *   Thorne asks: "If I write the equations for 'The ball enters the wormhole,' does the math *force* it to fail, or does the math blow up?"
      *   The labor Thorne undertakes is showing that the equations **converge** on a consistent solution rather than diverging into singularity or indeterminacy. Lewis doesn't need to show convergence; he just defines the set of consistent worlds as the only ones that count.

  ### 4. The HPMOR Context

  This is where your reading group's context matters. In *Harry Potter and the Methods of Rationality*, Time-Turners are treated as **physical objects** subject to natural law (Harry's project is to unify magic with physics).

  *   If HPMOR treats time travel as a **narrative device**, Lewis is the correct framework. The "rules" of the Time-Turner are semantic constraints on the story.
  *   If HPMOR treats time travel as a **mechanism** (which it does, with the "destination" logic and the stress on the device), then NSCP is the correct framework. Harry expects the universe to physically enforce consistency, not just logically require it.

  When HPMOR invokes NSCP "breezily," it is making a physical claim: *The magic system obeys a law analogous to the Einstein Field Equations regarding CTCs.* Lewis's paper cannot validate that claim. Lewis can only tell you that if the magic system *does* obey that law, the sentences describing it won't be contradictory.

  ### Conclusion: How to Concede (and where to stand firm)

  You should concede to your friend that **Lewis and Thorne are not making the same move.**
  *   Lewis is making a **modal/semantic move**: He is clarifying the truth conditions of ability claims in a block universe.
  *   Thorne is making a **dynamical/physical move**: He is asserting a constraint on the evolution of fields in spacetime.

  However, you should stand firm on the **structural insight**: Both frameworks reject the "Multiverse/Many-Worlds" solution to time travel paradoxes in favor of a **Single Consistent Timeline**. In that specific sense, they are allies. They both agree that "changing the past" is a misdescription; the past is fixed, and the traveler was always part of it.

  **The Resolution:**
  Tell your friend: "You are right that Lewis is doing semantics and Thorne is doing physics. Lewis doesn't explain the *mechanism* of consistency, only the *logic*. However, I maintain that Lewis's work is the **metaphysical prerequisite** for Thorne's. Thorne is effectively trying to prove that the physical universe respects the logical constraint Lewis identified. Lewis showed consistency is *possible*; Thorne showed it is *plausible* under General Relativity. They aren't the same work, but they are building the same wall from different sides."

  This allows you to acknowledge the distinction without abandoning the insight that they are converging on the same fundamental view of time.
