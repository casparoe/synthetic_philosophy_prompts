answer: |-
  The manuscript sat on Elias's desk, sandwiched between a stack of mortality tables and a cold cup of coffee. He was an actuary; his life was measured in risk probabilities and life expectancies. He calculated the precise statistical moment a man was likely to die so that insurance companies could profit from the interval. But the text in front of him, a typescript passed to him by a eccentric philosophy professor, dismantled the very axis of his profession.

  *If there is no material substrate,* Elias read, *and no continuous self to bind perceptions, then there is no sequence.*

  He closed his eyes. The logic was airtight, a cold, geometric perfection. If the "Elias" who read the first line was a distinct consciousness from the "Elias" who read the last, and there was no enduring soul to stitch them together, then the sequence was a hallucination. If two moments felt the same, they *were* the same. There was no river of time, only a series of discrete, unconnected nows. Death was merely a label applied to a perception that ceased to recur. It did not happen *to* anyone, because there was no one to whom it could happen.

  A profound lightness flooded his chest. The tightness he had felt in his ribs for months—the anxiety of his own fifty-year horizon—evaporated. He was not moving toward an end. He was simply here. The office, the hum of the server room down the hall, the glow of the monitor: this was the only reality. It had always been this way. He was immortal because he was momentary.

  Elias stood up to leave. As his chair scraped against the linoleum, a sharp twinge shot through his lower back. He winced, gripping the desk.

  *Pain,* he thought. *A perception.*

  He walked to the elevator. The digital numbers above the door counted down: 14, 13, 12.

  *Illusions,* he told himself. *Merely a succession of images.*

  But his feet felt heavy. The soles of his shoes were worn thin on the left heel, a fact he had noticed three months ago and meant to fix. He hadn't. The wear was evidence of friction, of distance covered, of repetition. If time were a illusion, why did his shoes degrade? If the self were discontinuous, why did the pain in his back persist from the chair to the elevator?

  He stepped out into the night air. The city was wet with rain. A bus hissed at the corner, its brakes squealing. Elias began the walk home. He decided to test the theory. If time was not real, he could walk without arriving. He could inhabit the step without the destination.

  He focused on the sensation of his right foot striking the pavement. *Now.*
  He lifted it. *Now.*
  He placed it down. *Now.*

  He tried to make each step identical to the last. He tried to purge the memory of the previous step to ensure no link existed between them. He was a series of statues, frozen and resurrected in rapid succession. For a block, it worked. The traffic lights, the passing cars, the neon sign of a diner flickering—they were just a slideshow. He felt a godlike detachment. He was the screen, not the movie.

  Then, a cough racked his throat. It was a wet, ugly sound that started in his chest and ended in his mouth. It took duration. It had a beginning, a middle, and an end. He couldn't cough all at once. He had to wait for the spasm to finish before he could breathe.

  He stopped at a crosswalk. The signal showed a red hand. He waited.
  *Why wait?* the philosopher in him asked. *The hand is just an image. The traffic is just a collection of shapes. If I walk, and I am hit, that is just another perception. If I do not walk, that is another. Neither is later than the other.*

  The light turned white. A man walked beside him, checking a wristwatch, tapping his foot impatiently.
  "Come on," the man muttered.

  Elias moved. He felt the rush of wind from a passing truck. He felt the vulnerability of his skin, thin and bruised easily. He reached his apartment building and fumbled with his keys. His fingers were stiff from the cold. He rubbed them together to generate heat. Friction. Cause and effect.

  Inside, the silence of his apartment pressed against him. He went to the kitchen counter and picked up the plastic organizer. It was divided into seven compartments: *Sun, Mon, Tue, Wed, Thu, Fri, Sat.*

  Today was Sunday. He had taken Saturday's pill yesterday. He knew this because the Saturday slot was empty.

  He looked at the Sunday slot. Inside was a small white tablet. A beta-blocker. To regulate his heart. To slow the rhythm. To extend the timeline.

  If time was an illusion, the pill was sugar. If the self was a fiction, there was no one to save from a stroke.
  He held the pill between his thumb and forefinger. It was chalky.

  He thought of the argument again. *Two states of consciousness identical in every respect are a single moment.*
  He looked at the pill. He looked at the empty Saturday slot. They were not identical. The empty slot was a memory of a action taken. The full slot was a demand for an action to come. The difference between them was the very substance of the time he was supposed to deny.

  He realized then that the argument was a map, but his body was the territory. The map showed a flat plane where one could stand still forever. The territory was a slope, and he was sliding down it, cell by cell. He could believe the slope was an optical illusion, but gravity did not care for his optics.

  Elias put the pill in his mouth. He reached for the glass of water. He swallowed.

  He walked to the window and looked out at the street. A siren wailed in the distance, rising and falling in pitch. The Doppler effect. Motion relative to a listener. Time required for the sound to travel.

  He placed his hand against the glass. It was cold. He could feel the heat leaving his palm, transferring to the window. Entropy. The universe moving from order to disorder. His own heat leaking away, year by year, second by second.

  He understood the relief the essay had offered. It was the relief of a man being told the executioner does not exist. But as he stood there, watching his breath fog the pane, Elias knew he would still flinch when the blade fell. He was convinced by the logic, utterly and completely. He knew that in the grand architecture of consciousness, he was eternal.

  But his heart beat on, a wet, muscular clock in the dark, counting out a rhythm that demanded a future. He was a man who knew he was dreaming of a fall, yet he could not stop himself from bracing for the impact. He turned from the window, his hip clicking in the silence, and walked toward the bedroom to sleep, to practice dying for eight hours, to wake and do it again. He was the timeless observer, trapped in a body that was rotting on a schedule. He was the clock, and he was the time it kept, and he was the hand that wound it, and he was terrified of when it would stop.
