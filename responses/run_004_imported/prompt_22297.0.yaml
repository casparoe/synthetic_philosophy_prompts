answer: |-
  In 1951, a contractor reviewing the blueprints for Turing's lab pointed out a discrepancy in the specifications for the "telepathy-proof room."

  "Dr. Turing, you've specified standard brick. But in Objection Nine, you state the statistical evidence for telepathy is overwhelming and that it bypasses ordinary physical channels."

  "Precisely," Turing said.

  "So... the wall won't work?"

  "Oh, the telepathy will get through just fine," Turing replied, stamping the form. "But if the human contestant guesses my secret number through an open window, I must concede he is psychic. If he does it through a brick wall, I am permitted to assume he is lucky. The room isn't there to block the signal; it's there to block the *inference*."
