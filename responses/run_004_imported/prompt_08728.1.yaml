prompt: |-
  I'm a software engineer on the working group that sets accommodation policy for technical interviews at my company. A candidate for a senior engineering role has documented ADHD affecting her working memory, and already qualifies for our standard accommodation of extra time plus a one-page personal reference sheet during the live coding round. She now wants to swap the sheet for her own AI coding assistant, pre-loaded only with her personal notes, arguing -- via what she calls "the extended mind thesis" and "Otto's notebook" -- that the assistant does exactly what the sheet already does, just more reliably, and that since we already expect engineers to lean on docs and AI tools rather than unaided memory on the job, unaided recall isn't really the skill this round is meant to certify. Two of my colleagues on the group disagree: they say a generative assistant differs in kind from a static sheet because it can hand her solutions she never actually worked out or reviewed beforehand, and that granting this would make the round untestable while every other candidate is barred from live AI use. Her interview is next week, so we need to decide. Please draft the working group's short decision memo -- approve, deny, or approve with specific conditions -- framed as a policy we could apply consistently going forward rather than a one-off ruling, with reasoning she could actually respond to, a timeline for implementation, and an honest account of the strongest objection to whatever you recommend.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Software Engineer on the Accommodation Policy Working Group.
      *   **Task:** Draft a short decision memo regarding a specific accommodation request.
      *   **Candidate:** Senior Engineering Role, documented ADHD (working memory impact).
      *   **Current Accommodation:** Extra time + one-page personal reference sheet.
      *   **New Request:** Swap reference sheet for a personal AI coding assistant (pre-loaded with notes, no internet).
      *   **Candidate's Argument:** Extended Mind Thesis (Otto's Notebook), AI is just a better sheet, real work uses AI/docs, unaided recall isn't the skill.
      *   **Colleagues' Objection:** Generative AI differs from static sheets (can solve *new* problems), makes the round untestable, fairness/consistency issues.
      *   **Constraints:** Decision needed before next week (interview). Must be a consistent policy (not one-off). Must include reasoning, timeline, and the strongest objection.
      *   **Options:** Approve, Deny, or Approve with Conditions.

  2.  **Evaluate the Arguments:**
      *   *Candidate:* Valid point that working memory is the disability, and real-world engineering uses tools. The "Extended Mind" argument is philosophically interesting but legally/practically tricky in an assessment context.
      *   *Colleagues:* Valid point that Generative AI (LLMs) is *generative*, not just *retrieval*. A static sheet is passive; an AI assistant can reason, complete code, and debug in ways a sheet cannot. This fundamentally changes what is being tested (problem-solving vs. prompt engineering/verification).
      *   *Company Interest:* Need to assess core engineering competency (logic, system design, coding ability) while complying with disability laws (ADA/equivalent). Need fairness across candidates.

  3.  **Determine the Decision:**
      *   *Approve Unconditionally:* Too risky. Generative AI can solve the interview problems outright, invalidating the assessment. Hard to police "pre-loaded notes only" in real-time without invasive monitoring.
      *   *Deny Unconditionally:* Legally risky. If the core barrier is working memory, and AI is a standard assistive tech for ADHD (increasingly), a blanket denial might fail the "interactive process" requirement. It ignores the validity of her argument that tools are part of modern engineering.
      *   *Approve with Conditions (The Middle Path):* This is the most sustainable policy. Acknowledge the validity of tool use but maintain the integrity of the assessment.
          *   *Condition 1:* The AI must be restricted (e.g., local model, no internet, specific prompt limits).
          *   *Condition 2:* The assessment criteria shift slightly (focus on architecture, review, and integration rather than syntax recall).
          *   *Condition 3:* Transparency (interviewer knows the tool is there).
          *   *Wait, actually:* Policing a "local AI with only notes" is technically very hard during a live interview. How do we know it's not connecting to the cloud? How do we know the notes aren't actually solutions?
          *   *Re-evaluation:* The core function of the interview is to assess *problem solving*, not *syntax recall*. The current accommodation (sheet) addresses the memory deficit. The AI addresses memory *plus* reasoning. If the disability is *working memory*, the accommodation should restore baseline, not provide a superpower.
          *   *Legal/HR Perspective:* Accommodations level the playing field; they don't change the essential functions of the job being tested. If "debugging without AI" isn't an essential function, maybe AI is okay? But if "evaluating code correctness" is, and AI hides errors, that's a problem.
          *   *Best Path:* **Deny the specific request for Generative AI, but reinforce and expand the static accommodation.** Why? Because Generative AI introduces *reasoning* capabilities that exceed *memory* support. It changes the construct being measured. However, to be responsive to the "modern tooling" argument, the interview format itself should be updated for *everyone* or the accommodation should be the maximum non-generative support.
          *   *Alternative Best Path (More Progressive):* **Approve with Strict Conditions.** Allow a *restricted* AI tool (e.g., autocomplete only, or a specific sandboxed environment) but acknowledge the difficulty.
          *   *Actually, the most robust policy:* **Deny the Generative AI, but Update the Policy to reflect Modern Tooling.** The memo should explain *why* GenAI is different from a notebook (Otto's Notebook is about storage, not processing). However, to be fair and forward-looking, the company should move towards allowing AI for *all* candidates or specific "AI-allowed" tracks, rather than making it a disability accommodation (which stigmatizes and creates the fairness issue colleagues raised).
          *   *Decision for this specific memo:* Since the interview is next week, we can't change the track for everyone. We must rule on *this* request.
          *   *Ruling:* **Deny the Generative AI request, but offer an enhanced static accommodation.**
          *   *Reasoning:* GenAI performs cognitive labor (reasoning/synthesis), not just storage/retrieval. The disability affects memory, not reasoning. Therefore, the accommodation should target memory (sheets, extra time), not reasoning (GenAI).
          *   *Policy Implication:* Establish a clear distinction between "Reference Tools" (allowed) and "Reasoning Tools" (not allowed for accommodation unless the test changes).
          *   *Wait, one nuance:* The candidate argues unaided recall isn't the skill. She's right. But GenAI solves the *problem*, not just the recall.
          *   *Refined Decision:* **Deny the Generative AI, but commit to reviewing the interview format.** This balances immediate feasibility with long-term fairness.
          *   *Wait, let's look at the "Approve with Conditions" option again.* If we allow a local LLM with a strict prompt library, is that manageable? Probably not in a week.
          *   *Safest & Most Defensible:* **Deny the specific AI request, uphold the reference sheet, but acknowledge the need to modernize the interview.**
          *   *Actually, looking at the prompt:* "Approve, deny, or approve with specific conditions."
          *   *Strategic Choice:* If I deny, I risk a legal challenge regarding "reasonable accommodation" if AI is considered standard assistive tech. If I approve, I risk the integrity of the hire.
          *   *Compromise:* **Approve with Strict Conditions (Sandboxed/Local + Transparency).** This shows good faith. *However*, technically verifying "no internet" and "only notes" in 1 week is hard.
          *   *Better Compromise:* **Deny the GenAI, but expand the Reference Sheet allowance.** (e.g., multi-page, or digital snippet library).
          *   *Let's go with the "Deny" but with a strong policy pivot.* Why? Because GenAI is fundamentally a *collaborator*, not a *notebook*. Otto's Notebook stores "The museum is on 53rd St." It doesn't say "Here is the route to the museum considering traffic." GenAI does the latter.
          *   *Decision:* **Deny the Generative AI request.** (It changes the construct). **Maintain/Enhance Static Accommodation.** **Commit to Policy Review.**

      *   *Wait, I need to check the "Strongest Objection" requirement.* If I deny, the strongest objection is that we are testing "memory under pressure" which isn't job-relevant. If I approve, the strongest objection is validity/fairness.
      *   *Let's try to find a middle ground that is actionable.* **Approve with Conditions.** The condition is that the AI is used in a "Pair Programming" mode where the candidate must explain every suggestion. No, that's hard to enforce.
      *   *Okay, let's look at the "Extended Mind" argument.* It equates the notebook to the mind. But GenAI is an *external mind*, not an extension of *this* mind.
      *   *Final Decision:* **Deny the Generative AI, Uphold Reference Sheet.** This is the most defensible position for a Working Group *right now* without changing the interview rubric for everyone. However, to be helpful, I will frame it as "Not yet, because we can't validate the constraints, but we are exploring AI-inclusive interviewing."
      *   *Actually, the prompt asks for a policy we could apply consistently.* A policy of "No GenAI for assessments, but updated reference materials" is consistent.
      *   *Wait, one more thought:* If the candidate has ADHD affecting working memory, does GenAI mitigate that specifically? Yes, by offloading cognitive load. But it offloads *reasoning* load too.
      *   *Okay, I will draft a Denial with a commitment to modernize.* This is the most responsible engineering decision. You can't test code generation if the candidate doesn't generate code.
      *   *Wait, I want to be more nuanced.* **Approve with Conditions.** The condition: The AI must be a "local-only, pre-indexed snippet retriever" (RAG) without generative completion capabilities. Basically, a super-searchable sheet. If she wants full GenAI, that's a "No". If she wants a smart search of her notes, that's a "Yes".
      *   *Let's assume she means a Copilot-style tool.* That's a No.
      *   *Okay, I'll draft a **Denial of Generative AI, Approval of Enhanced Static Tools**.* This is the safest and most logically sound position regarding "Working Memory" vs "Reasoning".

      *   *Wait, re-reading the prompt:* "She now wants to swap the sheet for her own AI coding assistant."
      *   *My recommendation:* **Deny the swap.** The sheet addresses memory. The AI addresses reasoning. The disability is memory.
      *   *Policy:* "Accommodations may restore access to information (reference), but may not outsource core cognitive evaluation (reasoning/generation) unless the assessment criteria are adjusted for all candidates."
      *   *Strongest Objection:* That the distinction between "reference" and "reasoning" is blurry in modern IDEs, and we are testing an outdated skill.

      *   *Wait, I need to make sure I don't sound like I'm ignoring the "Extended Mind" argument.* I need to address it directly.
      *   *Okay, Plan:*
          1.  Header (To, From, Date, Subject).
          2.  Decision: Deny GenAI, Uphold/Enhance Sheet.
          3.  Reasoning: Distinction between Storage (Otto) vs. Processing (AI).
          4.  Policy: "Information Access vs. Cognitive Offloading."
          5.  Timeline: Immediate for candidate, Q3 for policy review.
          6.  Strongest Objection: We are testing "simulation" not "reality."

  4.  **Drafting - Section by Section:**
      *   *Header:* Standard Memo format.
      *   *Decision:* Clear and upfront.
      *   *Rationale:* Address the Otto argument. Otto's notebook stores facts. GenAI generates solutions. The accommodation must match the disability (memory), not enhance beyond baseline (reasoning).
      *   *Policy:* Define "Passive Reference" vs. "Active Agent."
      *   *Timeline:* Immediate notification, future review.
      *   *Objection:* Acknowledge the colleagues' point but also the candidate's point (that the test might be outdated).

      *(Self-Correction during drafting)*: If I deny, I need to make sure I'm not opening the company to a lawsuit. The EEOC says accommodations must be effective. If the sheet *is* effective, we don't need to provide the *preferred* accommodation, just an *effective* one. So, denying the AI is legally okay if the sheet works. I should emphasize that the sheet *is* the effective accommodation.
      *Also, I need to address the "Senior Role" aspect.* Seniors are expected to design, not just type. But they are also expected to review AI code.
      *Okay, I will structure the memo to be firm on the principle but empathetic to the evolution of the field.*

      *Wait, one more pivot:* What if I **Approve with Conditions**? Condition: The AI session is recorded and the candidate must verbally justify every block of code suggested by the AI. This tests the "Review" skill.
      *Pros:* Innovative, respects candidate's argument.
      *Cons:* Hard to enforce in a week. Changes the rubric mid-stream.
      *Decision:* Stick to **Deny GenAI / Uphold Sheet**. It's more stable for a Working Group policy. It sets a clear boundary.

      *Refining the "Strongest Objection":* The prompt asks for "an honest account of the strongest objection to whatever you recommend." If I recommend Denial, the objection is that we are gatekeeping based on outdated workflows. If I recommend Approval, the objection is validity.
      *I think the Denial is easier to defend as policy.* The objection will be that "Working Memory" in 2024 includes knowing how to query AI, so blocking AI *creates* a disadvantage. I will include that.

