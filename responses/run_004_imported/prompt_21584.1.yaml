    "depth_of_evaluation": {"score": 0, "comment": ""},
    "total": 0,
    "overall_comment": ""
  }
  ```

  with each of the four categories out of 5 (summing to 20), a short comment justifying each score, and one or two sentences of overall feedback at the end.
