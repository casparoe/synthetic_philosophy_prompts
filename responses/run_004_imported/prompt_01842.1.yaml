      *   **Market Design Context:** How this fits their class (mechanisms to reduce asymmetry).
      *   **Conclusion:** You're right, but calibrate the heuristic.

  10. **Tone:** Academic but accessible, encouraging, slightly playful (fantasy football context).

  11. **Final Polish:** Check for clarity on "signaling." Ensure the distinction between "they are happy because they need the piece" (good) vs "they are happy because they know something bad about the piece they are giving" (bad) is clear. (Actually, if they are happy to give a player, it's usually bad news about that player. If they are happy to take my player, it's usually good news about that player). Wait, let's trace the user's specific scenario: "If they accept almost instantly... I get fleeced." This implies the user is *giving* something and *getting* something. If the counterparty accepts instantly, they are happy with the deal. Why? Either (A) The player I'm getting is worse than I think (Lemon), or (B) The player I'm giving is better than I think. Both lead to me losing value. So the user's intuition holds.

      *Wait, one more check:* What if the counterparty has a desperate *need*? That's private value. If I have a surplus of RBs and they have none, they might accept a trade that looks lopsided on points because it fixes their roster constraint. This is *gains from trade*. The user's fear is that it's *information revelation*. The challenge is distinguishing the two. I should mention this distinction.

