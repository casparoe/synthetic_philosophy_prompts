answer: |-
  Here is the definite reconstruction you are looking for: **Hobbes would have treated non-Euclidean geometry as a linguistically valid but ontologically empty game of definitions, and he would have rejected Einstein's physical application of it as a category error that confuses the properties of bodies with the effects of force.**

  To defend this, we must resolve the tension you identified—between his constructivist epistemology (we know what we make) and his materialist ontology (geometry and physics share a subject matter)—by showing that for Hobbes, the former is strictly constrained by the latter. Your seminar mate's suggestion that "maker's knowledge" insulates Hobbes from correction relies on a modern, formalist view of mathematics that Hobbes explicitly rejects. For Hobbes, we do not have carte blanche to construct *any* coherent system; we only have authority to construct systems that track the *generative motions* of body.

  Here is the breakdown of why Hobbes's system forces this specific rejection.

  ### 1. Geometry is Genetic, Not Axiomatic
  The primary reason Hobbes would not find non-Euclidean geometry "congenial" to his nominalism is that he does not view geometry as a system of arbitrary definitions and logical consequences. He views it as a science of **generation**. In *De Corpore*, a line is not defined by its properties but by its cause: it is the trace of a point in motion. A circle is generated by a specific kind of constrained motion.

  Hobbes's "maker's knowledge" is not the claim that "I defined these terms, so I am right." It is the claim that "I know the cause that produced this object, because I produced it." For Hobbes, a geometric demonstration is valid only if the construction is **intelligibly generative**.

  When Lobachevsky or Riemann posit a space where parallel lines meet, Hobbes would ask: *What motion generates this?* If the answer is "no motion in our imagination can generate this, it is a formal abstraction," Hobbes would classify it exactly as he classified Wallis's algebraic symbolism: **insignificant speech**. He would argue that the mathematicians have severed the names from the ideas they signify. You can write down the axioms of hyperbolic geometry, but if you cannot construct the figure through a conceivable motion of a body, you have not made a geometric object; you have merely shuffled counters. Therefore, non-Euclidean geometry fails the "maker's knowledge" test not because it is logically inconsistent, but because it is **causally unintelligible**.

  ### 2. The Identity of Extension and Body
  This brings us to the core tension you raised. If geometry is just about our definitions (Side A), why can't we define a curved space? The answer lies in Side B: Hobbes's materialism.

  For Hobbes, the subject matter of geometry is **Extension**. But Extension is not a free-floating abstract realm; it is the principal attribute of **Body**. We derive our idea of extension from our sensory encounter with bodies. Consequently, the geometry of extension *must* match the geometry of body.

  Hobbes argues that we cannot conceive of a body that does not obey Euclidean laws. Try to imagine a physical triangle whose angles do not sum to 180 degrees. For Hobbes, if you cannot imagine it, it is not a possible object of extension. Since "Body" and "Extension" are co-extensive concepts in his ontology (there is no vacuum, all space is filled with substance), the geometry of the mind (Euclidean) is necessarily the geometry of the world.

  Therefore, when Einstein argues that physical space is curved, Hobbes would not say, "Ah, so we simply chose the wrong axioms." He would say, **"You are misidentifying the cause."**

  Hobbes would argue that what Einstein calls "curved space" is actually **Euclidean space acted upon by forces**. In Hobbes's physics, all change is motion, and all motion is caused by the pressure of contiguous bodies. If light bends near a star, or planets follow elliptical orbits, this is not because the "stage" (space) is curved. It is because the "actors" (corpuscles of matter) are being pushed. To attribute the curvature to space itself is to reify a phantasm. It is to treat "Space" as a substance that can have properties, which for Hobbes is a linguistic abuse. Space is merely the "phantasm of a thing existing without the mind"; it cannot *be* curved any more than a memory can be heavy. Only bodies can be curved.

  ### 3. Resolving the Tension: Constructivism within Materialist Bounds
  You asked specifically to engage the tension between his constructivism and his insistence that geometry and physics share a subject matter. The resolution is that **Hobbes's constructivism is not arbitrary.**

  We are the "makers" of geometry, but we are not God. We cannot create essences. We can only reconstruct the essences of things as they appear to us. Since we are material beings interacting with a material plenum, our constructive faculties are hardwired to Euclidean parameters.
  *   **If** geometry were purely a game of names (Side A), non-Euclidean geometry would be fine.
  *   **If** geometry were purely an empirical discovery about the world (Side B), non-Euclidean geometry could be true.
  *   **But** for Hobbes, geometry is the **reconstruction of the necessary conditions of imagining body**.

  Because we cannot imagine a non-Euclidean body, non-Euclidean geometry cannot be a science of *extension*. It might be a consistent logic, but it is not *Geometry* in the Hobbesian sense, because it does not map onto *Res Extensa*.

  This is why the Wallis feud is the perfect precedent. Wallis thought he could manipulate symbols to find truths about quantity that outpaced geometric intuition. Hobbes insisted that without the geometric construction, the symbols were meaningless. Similarly, Hobbes would tell Einstein and Riemann that their tensors and manifolds are sophisticated symbols, but without a corresponding **mechanical model of corpuscular motion in Euclidean space**, they have not explained the *cause*. They have merely described the *effect* using a misleading vocabulary.

  ### 4. The Verdict on General Relativity
  So, how does Hobbes handle General Relativity? He treats it as **Natural Philosophy**, not **Geometry**.

  Recall Hobbes's hierarchy: Geometry is certain (*scientia*); Physics is conjectural (*prudentia*), unless it can be reduced to geometry.
  *   Hobbes would concede that Einstein's equations might successfully *predict* phenomena (prudence/experience).
  *   But he would deny that they provide *causal knowledge* (science).
  *   To claim that "gravity is geometry" would be, for Hobbes, an absurdity. Gravity is a motion caused by the ether or surrounding bodies. Geometry is the study of the extension of those bodies.

  He would argue that Einstein has committed the error of the Scholastics: treating an abstract noun ("Curvature") as a real agent. By making space the cause of motion, Einstein makes "Nothing" (Space, which is no body) the cause of "Something" (Motion). For Hobbes, **only body can act on body.** A curved metric field cannot push a planet. Only another body can.

  ### Conclusion
  Hobbes would not be congenial to non-Euclidean geometry. He would view it as a betrayal of the very "maker's knowledge" doctrine your seminar discussed. That doctrine protects the geometer only so long as the geometer is constructing objects that are **generatively intelligible** and **ontologically grounded in body**.

  By allowing definitions to outpace the imagination of motion, the non-Euclidean geometers would look to Hobbes like they are no longer "making" anything; they are merely speaking. And by attributing physical causal power to the structure of space itself, Einstein would look like he is lapsing into the very kind of "incorporeal substance" mysticism that Hobbes spent his life trying to purge from philosophy.

  Hobbes's response would be a dogmatic defense of Euclideanism, not because he is blind to logic, but because he believes **Euclidean geometry is the only logic of body.** To abandon it is not to choose a new geometry; it is to abandon the study of the material world entirely.
