          *   *Addressing the Loser (Proponents):* Need to acknowledge the moral weight of wild animal suffering (WAS) without accepting the NU implication that extinction is good. Focus on *uncertainty* and *intervention risk* rather than the principle itself.

      *   **Option B: Fund the Proposal.**
