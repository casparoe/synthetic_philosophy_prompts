answer: |-
  The short answer is: **Your friend is right about the theory, but he is dangerously wrong about the practice.**

  He is correctly citing some deep mathematical concepts (ergodicity and geometric growth), but he is treating a theoretical asymptote as a practical instruction manual. Calling your Half-Kelly strategy "irrational" is dogmatic, not mathematical. In the professional trading and gambling world, Full Kelly is widely regarded as too aggressive for anyone who wants to sleep at night or account for the fact that they don't know the true odds perfectly.

  Here is the breakdown of where the math supports him, where it supports you, and why "Geometric Rationality" doesn't actually mandate Full Kelly.

  ### 1. The Math: What Kelly Actually Proves
  Your friend is correct that **Expected Value (EV)** reasoning is flawed for repeated, compounding bets. This is the core of the "Geometric Rationality" argument (popularized recently by researchers like Ole Peters).

  *   **Arithmetic Mean (EV):** If you bet your whole bankroll on a coin flip that pays 2:1 on heads, your *average* outcome is positive. But if you do it repeatedly, you will eventually hit tails and go to zero. The arithmetic average is skewed by the one-in-a-million path where you win 50 times in a row.
  *   **Geometric Mean (Growth):** Kelly maximizes the **expected logarithm of wealth**. This corresponds to the **median** outcome of the distribution of wealth paths over the long run.

  So, when your friend says "Full Kelly makes you richer in the long run," he technically means: *Full Kelly maximizes the asymptotic growth rate of your bankroll.* Any other fraction will grow slower as time approaches infinity.

  **However,** "The Long Run" is a mathematical abstraction. In the real world, we live in finite time.

  ### 2. The Volatility Drag (Why Full Kelly Hurts)
  The biggest practical argument against Full Kelly is **volatility drag**.

  *   **Full Kelly:** Maximizes growth, but comes with massive variance. A Full Kelly bettor should expect drawdowns of **50% or more** relatively frequently. To recover from a 50% loss, you need a 100% gain. This psychological and financial pain causes most people to quit at the bottom, realizing the "long run" before they get there.
  *   **Half-Kelly:** This is the sweet spot. The growth curve is very flat near the top.
      *   Betting **100% Kelly** gives you maximum geometric growth.
      *   Betting **50% Kelly** gives you **75% of the growth rate** but only **50% of the volatility**.

  Mathematically, Half-Kelly is incredibly efficient. You are giving up very little upside for a massive reduction in risk. Calling that "irrational" ignores the efficiency frontier of the Kelly curve.

  ### 3. The Estimation Error Problem (The Killer Argument)
  This is the strongest argument for your side, and your friend is ignoring it.

  The Kelly Criterion requires you to know the **true probability** of winning. In investing and betting, **you never know the true probability.** You only have an estimate.

  *   If you think you have a 10% edge but you actually have a 5% edge, and you bet Full Kelly based on the 10% estimate, **you are overbetting.**
  *   Overbetting Kelly (betting more than the optimal fraction) drastically reduces growth and increases the risk of ruin.
  *   **Underbetting Kelly (Half-Kelly) is robust.** If you bet Half-Kelly, even if you overestimate your edge significantly, you are likely still under the true Kelly limit.

  Professional investors (like Ed Thorp or Bill Benter) almost universally use Fractional Kelly (usually 1/2 or 1/4) specifically to protect against **model error**. To insist on Full Kelly implies you have perfect knowledge of the future, which is itself irrational.

  ### 4. Geometric Rationality & Ergodicity
  Your friend is referencing **Ergodicity Economics**.
  *   **Non-Ergodic System:** Wealth accumulation is non-ergodic. The "ensemble average" (what happens to 1,000 people once) is not the same as the "time average" (what happens to 1 person 1,000 times).
  *   **The Insight:** Maximizing arithmetic EV works for ensemble averages (insurance companies). Maximizing geometric growth works for time averages (individual investors).

  Your friend is right that growth-rate reasoning is superior to EV reasoning for an individual investor. **However,** Geometric Rationality does not prove that *Full* Kelly is the only rational choice. It proves that you should maximize *log utility*.

  If your utility function includes "not losing 60% of my net worth in a year" or "surviving estimation errors," then Half-Kelly maximizes *your* utility, even if it doesn't maximize the raw growth rate of the bankroll. Rationality is about maximizing *utility*, not just *dollars*.

  ### 5. The Verdict
  Your friend is winning the argument on **theoretical asymptotics**, but you are winning on **practical rationality**.

  *   **Is he right that EV is flawed for repeated bets?** Yes.
  *   **Is he right that Kelly maximizes long-term growth?** Yes.
  *   **Is he right that Half-Kelly is irrational?** **No.**

  Half-Kelly is the industry standard for sophisticated risk management. It acknowledges that while we want to grow wealth geometrically, we are human beings living in finite time with imperfect information.

  **How to reply to him:**
  Tell him you agree that Arithmetic EV is the wrong metric for compounding bets (validate his theory). But tell him that **parameter uncertainty** makes Full Kelly dangerous. Since you can't know the true edge, Half-Kelly is the optimal strategy to maximize growth *subject to the constraint of not blowing up due to estimation error.* That isn't leaving money on the table; it's buying insurance against being wrong.

  You aren't being irrational; you're being prudent. He's being a theorist.
