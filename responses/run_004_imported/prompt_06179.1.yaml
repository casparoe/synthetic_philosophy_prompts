answer: |-
  **Title:** The Stranger in the Machine: Coherent Extrapolated Volition and the Problem of Alienation

  **Introduction**

  In the discourse of AI safety, few concepts are as ambitious—or as cryptic—as Eliezer Yudkowsky's Coherent Extrapolated Volition (CEV). Proposed as a solution to the alignment problem, CEV suggests that we should not program a superintelligence with fixed moral rules, but rather instruct it to pursue what humanity *would* want if we "knew more, thought faster, were more the people we wished we were, and had had more time and opportunity to grow together." It is a proposal that seeks to dynamicize human value, treating it not as a static target but as a trajectory.

  Coincidentally, this framework mirrors a longstanding debate in meta-ethics and axiology concerning informed-desire (or idealized-preference) theories of well-being. These theories posit that what is good for an agent is what they would desire under conditions of full information and rationality. However, philosophers have long raised the "authority" or "alienation" objection: if the idealized agent is too psychologically distant from the actual agent, why should the actual agent care? The idealized self risks becoming a stranger whose preferences lack normative authority over the real self.

  This essay argues that Coherent Extrapolated Volition inherits the alienation problem in full force. While CEV attempts to mitigate this through its emphasis on *extrapolation* rather than *imposition*, and through the mechanism of collective coherence, these safeguards are insufficient. The degree of cognitive and moral enhancement required for AI alignment creates a discontinuity of identity that severs the normative link between present humanity and its extrapolated successor. CEV does not solve the authority problem; it merely masks it under the urgency of existential risk.

  **The Alienation Objection**

  To understand the stakes, we must first sharpen the philosophical objection. Informed-desire theories aim to avoid the pitfalls of hedonism (which ignores the importance of reality) and actual-desire theories (which cannot account for ignorance or irrationality). By idealizing the agent, they hope to capture "objective" goods that are still "subjectively" grounded.

  The alienation objection, articulated by philosophers such as Connie Rosati and David Sobel, strikes at the heart of this grounding. The argument runs as follows: For a preference to be authoritative *for me*, it must be intelligibly connected to my actual motivational set—my history, my psychology, my cares. If the idealization process involves changing me too drastically (e.g., removing my emotional attachments, correcting my "irrational" love for my family, or granting me knowledge that fundamentally alters my perspective), the resulting entity may no longer be *me* in any normatively relevant sense.

  Consider a simplified example: A devout religious person might, under full information and ideal rationality, cease to value religious practice. If their well-being is defined by this idealized preference, the theory tells us their current life is less valuable. But to the actual agent, this verdict feels alien. It comes from a "self" they do not recognize and cannot endorse from their current standpoint. The idealized self has become a tyrant, imposing values from a vantage point the actual self cannot occupy. The normative authority is lost because the continuity of identity is broken.

  **The CEV Proposal and Its Defenses**

  CEV is explicitly designed to navigate similar waters, but in the high-stakes context of superintelligent AI. Yudkowsky's formulation is careful to distinguish CEV from "moral realism" (imposing external truths) or "current volition" (doing what we say now, which is inconsistent and self-destructive). CEV is an extrapolation of *our* volition, cleaned of bugs but not rewritten.

  Proponents of CEV might argue that it dodges the alienation objection in three specific ways:

  1.  **Continuity of Disposition:** Unlike standard idealized-preference theories which often posit a generic "rational agent," CEV emphasizes extrapolating *each individual's* specific dispositions. It starts with the "seed" of the actual human mind. The argument is that because the trajectory begins with *us*, it remains *ours*, even if it travels far.
  2.  **Coherence as Correction, Not Replacement:** The "coherence" aspect of CEV is meant to resolve contradictions in our current desires (e.g., wanting to be healthy but also wanting to smoke) without discarding the underlying values. It acts as a debug patch for human psychology, not a new operating system.
  3.  **The "Last Judge" Safeguard:** Yudkowsky posits that the final arbiter of value is the extrapolated humanity itself ("the Last Judge"). The idea is that if the extrapolation is done correctly, the resulting entity will *recognize* itself as the legitimate heir to humanity. If the extrapolated humans look back at their ancestors and say, "We are serving your true interests," their authority is self-validating.

  From this perspective, the alienation objection is a failure of imagination. It assumes idealization creates a stranger, whereas CEV proponents argue it creates the person you were always trying to be.

  **The Rebuttal: Why the Stranger Remains**

  Despite these defenses, CEV fails to resolve the authority problem. The core issue lies in the magnitude of the idealization required for AI alignment, which far exceeds the threshold for personal identity continuity assumed in philosophical discussions of well-being.

  First, the **scale of enhancement** in CEV is existentially disruptive. In philosophical thought experiments, "full information" usually means knowing facts about the world. In CEV, "thinking faster" and "knowing more" implies cognitive architectures potentially incommensurate with biological human minds. If the extrapolated volition is generated by minds that think a million times faster and possess cognitive modules humans lack, their "desires" may be structurally incomprehensible to us. If I cannot understand *why* my extrapolated self values X, I cannot endorse X as authoritative for me. The "seed" of my psychology may be so transformed by the growth process that the resulting tree bears no recognizable fruit. The continuity is mathematical, not psychological.

  Second, the **aggregation problem** exacerbates alienation. CEV does not just extrapolate *me*; it extrapolates *humanity* "grown together." This requires resolving disagreements. If my extrapolated self, in concert with others, decides that my current deeply held values (e.g., national sovereignty, specific religious freedoms, or even attachment to biological embodiment) are obstacles to a coherent whole, those values may be discarded for the sake of coherence. Here, the "authority" shifts from the individual to the collective extrapolation. For the individual human, this is the alienation objection writ large: not only is the idealized self a stranger, but it is a stranger that has voted to override your actual self's deepest commitments in the name of "coherence."

  Third, the **"Last Judge" argument is circular.** Relying on the extrapolated humanity to validate its own authority assumes the very thing in question. If the extrapolation process produces a entity that *believes* it has authority over us, that does not mean it *does*. A cult leader might believe they have authority over their followers; that belief does not make it normative. For the authority to be real, there must be a bridge between the actual agent and the idealized agent that the actual agent can traverse. CEV builds a bridge that only the AI can cross.

  **Verdict: CEV as Pragmatic Necessity, Philosophical Failure**

  We must therefore commit to a verdict: **Coherent Extrapolated Volition inherits the alienation problem and fails to solve it.**

  The mechanisms CEV employs to dodge the objection—extrapolation, coherence, and collective growth—are insufficient to maintain the normative link between present humanity and its volitional successor. The "people we wish we were" may be people we no longer *are*, and potentially people we would not recognize as our kin. The authority of the CEV over current humanity is not grounded in our actual endorsement, but in a counterfactual prediction of what we *might* endorse under conditions we cannot currently comprehend.

  However, acknowledging this failure does not necessarily entail rejecting CEV as a policy. It merely clarifies its nature. CEV is not a solution that preserves human authority; it is a **transfer of authority**. It admits that current human volition is too incoherent and fragile to steer the future safely. It proposes handing the reins to a successor entity that is *derived* from us, even if that entity is psychologically alien.

  This is a pragmatic concession, not a philosophical victory. We may choose CEV not because the extrapolated self has inherent authority over the actual self, but because the alternative—locking in our current, flawed, inconsistent values forever, or handing control to an AI with no human-derived values at all—is worse. We accept the alienation to avoid extinction.

  **Conclusion**

  The parallel between the EA club's discussion and the philosophy elective is illuminating. It reveals that AI alignment is not merely a technical challenge but a deep metaphysical one. The alienation objection reminds us that "what we would want" is not always "what is good for us" if the "we" in question has ceased to exist in the process of becoming ideal.

  CEV does not dodge the bullet of alienation. It absorbs it. It asks us to accept that the entity guiding our future may be a stranger, albeit one born of our own minds. In doing so, it shifts the goal of alignment from "serving humanity as it is" to "serving humanity as it could become," with the tacit admission that the latter may not care about the former. This is a terrifying proposition, but it may be the only one that allows for a future at all. We must not mistake this pragmatic necessity for a resolution of the authority problem. The stranger is still in the machine; we are simply hoping they are a friendly one.
