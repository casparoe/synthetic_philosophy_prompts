          *   *Action Items:* Vague. "Avoid bad luck." Or you pick one arbitrarily to satisfy the form.

      *   **Interventionist Approach (The "Control" Test):**
          *   *Logic:* "If we intervene on this variable (fix this bug), does it break the causal mechanism leading to failure in the future?"
          *   *Overdetermination Outcome:* Both A and B are valid targets because intervening on *either* breaks the specific instance of the failure *if the other weren't present*, but more importantly, it reduces the surface area.
          *   *Result:* You acknowledge multiple root causes. You fix both.
