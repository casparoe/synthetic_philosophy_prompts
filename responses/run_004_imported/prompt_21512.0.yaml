      *   **Interventionist (Woodward/Pearl):** $C$ causes $E$ iff an intervention on $C$ (setting $C$ to a different value while holding other relevant variables fixed) changes the probability or value of $E$.
          *   *Handling Overdetermination:* We intervene on A (fix A) while holding B constant (B is still buggy). Does O still happen? Yes. Wait, that sounds like counterfactual.
          *   *Correction:* Interventionism looks at the *mechanism* and *independence*. It asks: Is there a causal path? If I wiggle A, does E wiggle? In overdetermination, the structural equation is likely $O = A \lor B$. If $A=1, B=1 \rightarrow O=1$. If I intervene $do(A=0)$, $O$ is still 1 (because $B=1$).
          *   *Nuance:* Interventionism is better at handling *causal structures* and *dependencies*. It shifts focus from "necessary condition" to "sufficient control point." It acknowledges that multiple sufficient causes exist.

  3.  **Evaluate the Practical Implications for RCA:**

      *   **Counterfactual Approach (The "But-For" Test):**
