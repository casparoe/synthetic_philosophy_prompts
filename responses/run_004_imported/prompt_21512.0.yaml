      *   **Wait, is that accurate?** Strict interventionism ($do(A=0)$) in a logical OR gate ($O = A \lor B$) still yields $O=1$ if $B=1$. So strictly speaking, neither is a cause of *this specific token event* if both are present and sufficient.
      *   *However*, in engineering, we care about *types* of events, not just token events. We care about preventing *future* outages. Interventionism is better suited for *generalizable* causal models.
