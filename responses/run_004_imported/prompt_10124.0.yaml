answer: |-
  **MEMORANDUM**

  **TO:** Forecasting Collective
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Proposal: Handling Persistent Forecast Divergence

  ### Context
  Following the recent divergence between Forecasters A and B on the regulatory merger question (and three similar instances this year), we need a standing policy for handling persistent disagreement. Currently, we lack a mechanism for resolving cases where two forecasters double-crux in good faith but remain >15% apart on credence.

  This memo proposes a default mechanism for our official deliverables and addresses the specific tension between general calibration and domain-specific track records.

  ### The Core Tension
  We have two competing intuitions, both epistemically sound:

  1.  **The Aggregation View (Aumann-adjacent):** Persistent disagreement between peers after information sharing is evidence that neither model is complete. Averaging reduces noise and typically outperforms individuals (the "wisdom of crowds" effect).
  2.  **The Insight View (Alpha-seeking):** Forced averaging punishes contrarian insight. If Forecaster B sees a nuance Forecaster A misses, averaging dilutes that signal into regression to the mean. It also risks false equivalence if one forecaster is actually more competent in the specific domain.

  The "Insight" camp is correctly worried that a blunt averaging rule disincentivizes doing the hard work to find unique information. If I know my number will just be averaged with yours, my marginal incentive to dig deeper diminishes.

  ### Proposed Policy: Domain-Weighted Aggregation with Minority Tracking
  To resolve this, I propose we adopt **Domain-Weighted Aggregation** as our default, with a **Minority View Tracking** safeguard.

  **1. The Mechanism**
  When forecasters diverge by >15% after a documented double-crux session:
  *   **Official Number:** We submit a weighted average of the credences.
  *   **Weighting Scheme:** Weights are determined by **domain-specific Brier scores** over the trailing 12 months, not general calibration.
      *   *Application to Case A/B:* Forecaster B receives higher weight on regulatory questions; Forecaster A receives higher weight on general political/timeline questions.
  *   **Transparency:** If the spread remains >20% in the final deliverable, we flag the estimate to the client as "High Variance" and optionally provide the range (e.g., "65% [Range: 50–80%]").

  **2. The Safeguard (Addressing the "Insight" Concern)**
  To address the risk of punishing correct contrarianism:
  *   We will track the performance of the **Minority View** separately in our internal logs.
  *   If a specific forecaster's "Minority View" consistently outperforms the "Consensus Aggregate" over a quarter, their weighting factor for the next quarter increases by a bonus multiplier (e.g., +10%).
  *   This ensures that if Forecaster B is consistently the "lonely right" voice on regulatory issues, the system automatically corrects to favor their judgment more heavily over time, rather than permanently diluting their signal.

  ### Rationale
  This approach splits the difference without splitting the *incentives*.

  *   **Why Aggregation?** The empirical literature (Good Judgment Project, etc.) strongly suggests that weighted aggregates beat even the best individual forecasters over time. Disagreement *is* uncertainty, and our clients deserve to see that uncertainty quantified.
  *   **Why Domain Weighting?** This resolves the A vs. B track record fight. General calibration matters less than specific competence. If B is better at regulatory forecasting, B's number should mathematically matter more on regulatory questions.
  *   **Why Minority Tracking?** This validates the "Insight" camp's fear. It acknowledges that sometimes the crowd is wrong and one person is right. By tracking and rewarding the minority view when it wins, we maintain the incentive for forecasters to hunt for alpha rather than sandbagging toward the consensus.

  ### Implementation for Current Stalemate
  For the merger question currently on your desk:
  1.  Calculate weights based on the last 20 regulatory questions resolved.
  2.  Apply weights to A and B's credences to generate the official number.
  3.  Log the divergence and the specific crux (weighting of the underlying uncertainty) for our quarterly review.

  ### Next Steps
  I'd like to ratify this at the retro. If there are objections to the weighting formula or the "Minority Tracking" bonus, please bring specific alternative formulas to the meeting. We need to move from "what feels right" to "what we can test."

  See you Thursday.
