answer: |-
  **Setting:** *A slightly noisy café just off campus. The remains of a seminar on Metaphysics of Causation are scattered on the table: napkins with scribbled logical forms, two empty espresso cups, and one half-finished latte. **Elena** (the Primitivist) is stirring her spoon absently. **Mark** (the Reductionist) is leaning forward, elbows on the table.*

  **Elena:** So, did the speaker convince you? Or are you still holding out hope that we can analyze "fragile" away into a neat little subjunctive conditional?

  **Mark:** I'm not holding out hope for the *Simple* Conditional Analysis. That died in the nineties. Martin and Lewis buried it with the fink cases. But I'm not ready to jump ship to powers ontology just because the first draft of the reduction had some leaks.

  **Elena:** It wasn't just leaks, Mark. It was a structural collapse. The Simple Analysis says: *x* is fragile iff if *x* were struck, *x* would break. The fink case shows that's false. The sorcerer makes the glass non-fragile the instant before impact. The glass *is* fragile beforehand, but the conditional "if struck, it would break" is false because the sorcerer intervenes. So the analysis fails the necessary condition.

  **Mark:** Sure, finks are annoying. But Lewis handled finks. That's the whole point of the Reformed Conditional Analysis (RCA). You don't just look at the stimulus and the manifestation. You anchor it to an *intrinsic causal base*.

  **Elena:** Go on.

  **Mark:** Lewis's fix is roughly this: *x* is disposed to *M* in response to *S* iff *x* has some intrinsic property *B*, and if *x* were to undergo *S* and *retain B* for a sufficient time, *B* would cause *M*. The fink doesn't break the analysis because the analysis explicitly demands we hold the base fixed. In the sorcerer case, the glass *would* break *if* it retained its molecular structure. The fact that the sorcerer changes the structure is irrelevant because the conditional specifies "retains *B*."

  **Elena:** That handles finks, I'll grant you. Finks remove the disposition. But that's why the literature distinguishes finks from masks. Or "antidotes," if you prefer Bird's terminology. The mask doesn't touch the intrinsic base *B*. It just blocks the path from *B* to *M*.

  **Mark:** The bubble wrap case.

  **Elena:** Exactly. Take the fragile glass. Wrap it in perfect shock-absorbing foam. It is still fragile. Its molecular structure—the base *B*—is unchanged. But if you strike it (even with the foam present), it does not break. So the conditional "if struck, it would break" is false. And notice, Lewis's RCA doesn't save you here. The glass *does* retain *B* during the strike. *B* is present. But *B* fails to cause *M* because the foam intercepts the causal chain. So your analysis says "not fragile," but the intuition says "fragile."

  **Mark:** Okay, so you need a *ceteris paribus* clause. "If struck, and no masks are present..."

  **Elena:** And there it is. The circularity charge. How do you define "mask" without referencing the disposition itself? A mask is something that prevents the manifestation of the disposition. If you say "The glass is fragile iff it would break if struck, *provided nothing prevents it from breaking*," you're analyzing fragility in terms of... preventing breaking. You haven't reduced the disposition to non-dispositional terms. You've just pushed the modality into the *ceteris paribus* clause.

  **Mark:** That's the standard objection, yes. But I think you're overstating the viciousness of the circle. Look, when we do functional analysis in science, we always assume normal conditions. We don't say gravity is primitive; we say masses attract according to inverse-square law, *ceteris paribus*. If there's a counter-force, we don't say gravity ceased to exist. We just say the net force changed. Why can't dispositions be the same? We can specify the "no mask" condition using non-dispositional vocabulary—like "no intervening physical barrier."

  **Elena:** Can you? Take the poison case. A substance is poisonous iff if ingested, it causes death. Now introduce an antidote that binds to the toxin molecules instantly. The substance is still poisonous. But to specify the condition "no antidote present," you have to say "no substance that neutralizes the toxicity." You're defining the neutralizing condition in terms of the very power you're trying to analyze. It's not like gravity, Mark. With gravity, you can specify the interfering forces independently. With masks, the interference is defined *relationally* to the power.

  **Mark:** But that just shows dispositions are relational properties. I'm fine with that. I'm not trying to reduce them to monadic intrinsic properties. I'm trying to reduce them to *conditionals*. The fact that the antecedent of the conditional requires a complex description of the environment doesn't mean it's not a conditional.

  **Elena:** It means it's not a *reduction*. A reduction is supposed to tell you what the property *is* in terms of something more fundamental. If the only way to make your conditional true is to pack all the causal complexity of the universe into the antecedent clause—effectively saying "It would break if nothing stopped it from breaking"—you haven't explained the disposition. You've just given it a nickname. That's why I'm a primitivist. The fragility is a real, categorical feature of the glass. It's a power. It *points* toward breaking, even if the breaking doesn't happen.

  **Mark:** But then you've got a metaphysical black box. If the power is primitive, distinct from its manifestation, how do you know it's there?

  **Elena:** We know it through its role in the causal structure.

  **Mark:** Which is observed through... manifestations. Look, here's my reply to the primitivist move. If you say the power is distinct from the manifestation, you open the door to quiddities. What makes this power *fragility* rather than *schmagility*, if not the fact that it leads to breaking? If you sever the tight link between the disposition and the conditional outcome, you lose the identity conditions for the power itself.

  **Elena:** Not necessarily. The identity is fixed by the *type* of manifestation it tends toward, not the guarantee of it.

  **Mark:** "Tends toward." That's modal language again. You're saying it has a propensity. But propensities are just probabilities, which are cashed out in... long-run frequencies of manifestations. Which brings us back to conditionals. You can't escape the conditional framework, Elena. Even to say "it's a primitive power" is to say "it's the kind of thing that *would* do X." You're still using the conditional semantics to fix the reference of your primitive term.

  **Elena:** I'm using conditionals to *identify* the power, not to *constitute* it. There's a difference. Think of it like this: I can identify water as "the clear liquid in the lakes," but that doesn't mean water *is* the description. Water is H2O. Similarly, I identify fragility via what it does, but fragility *is* the categorical base that grounds that behavior. The reason the conditional analysis fails on masks is that the world is messy. The connection between base and manifestation isn't logical; it's causal. And causal connections can be interrupted without the cause vanishing.

  **Mark:** But if the connection can be interrupted in indefinitely many ways—masks, finks, antidotes, ambient temperature, humidity—then the "simple" conditional is useless, and the "reformed" conditional becomes a disjunction of infinite length. "It would break if struck, unless wrapped, unless enchanted, unless in a vacuum, unless..." At some point, Occam's Razor cuts. If your reduction is as complex as the primitive ontology it's trying to replace, why bother?

  **Elena:** Because the primitive ontology commits you to a world saturated with modal forces. It's spooky.

  **Mark:** And your view commits you to a world where properties are defined by their relations to non-actual scenarios. That's spooky too. You want to say the glass is fragile even if it never breaks. I say that just means the conditional is true. You say the conditional is false because of the mask, so there must be a "power." I say the conditional is true *relative to a specific set of background conditions*. We're arguing over where to place the modal burden. In the property itself, or in the semantics of the conditional.

  **Elena:** It matters where you place it. If you place it in the property, you get a robust account of causation. If you place it in the conditional, you get Humean regularity plus a lot of footnotes.

  **Mark:** *[Signals the waiter for the check]* Maybe. But until you can tell me how to detect this "robust power" without testing the conditional outcomes, I'm sticking with the footnotes.

  **Elena:** *[Smiles]* And until you can write a *ceteris paribus* clause that doesn't secretly presuppose the power it's trying to analyze, I'm sticking with the powers.

  **Mark:** Touché. Same time next week?

  **Elena:** Obviously. I'm presenting on quiddities.

  **Mark:** God help us.
