      *   Prim: Masks break RCA. Antidote case.
      *   Prim: Your "normal conditions" clause is circular.
      *   Red: Primitivism is worse. Epistemic access problem.
      *   End: Stalemate. Check, please.

  7.  **Final Review against constraints:**
      *   Dialogue format? Yes.
      *   Reductionist/Primitivist labels? Yes.
      *   Specific repair? Yes (Lewis's RCA).
      *   Real counterexample? Yes (Antidote/Mask + Circularity).
