  2.  **Deconstruct the Philosophical Content:**
      *   *Simple Conditional Analysis (SCA):* $x$ is disposed to $M$ in response to $S$ iff if $x$ were $S$-ed, $x$ would $M$.
      *   *Finks:* The stimulus $S$ causes the disposition $D$ to vanish before $M$ happens. (e.g., Sorcerer makes glass non-fragile upon striking). SCA says "Not Fragile" (because it wouldn't break), but intuition says "Fragile."
      *   *Masks/Antidotes:* The disposition $D$ remains, but something external prevents $M$. (e.g., Bubble wrap, antidote). SCA says "Not Fragile/Poisonous" (because it wouldn't break/kill), but intuition says "Fragile/Poisonous."
      *   *Reductionist Strategy:* Modify the *ceteris paribus* clause or the intrinsic nature of the base property. Lewis's "Reformed Conditional Analysis" (RCA) is the classic move here. It adds a clause about retaining the causal base.
      *   *Primitivist Strategy:* Argue that any modification makes the analysis circular (presupposing the disposition) or too complex to be a reduction. Or argue that masks show the connection between disposition and manifestation isn't strict implication.
      *   *Key Distinction:* Finks change the *intrinsic base*. Masks interfere with the *process*.

  3.  **Drafting - Section by Section:**

