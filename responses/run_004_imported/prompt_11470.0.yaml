      *   **Core Issue 2: The Division by Zero (Resolution) Problem.** What happens at settlement if $A$ is false? $P(A)$ becomes 0. The ratio explodes.
      *   **Core Issue 3: Volatility.** Even before settlement, low $P(A)$ makes the implied price insane.
