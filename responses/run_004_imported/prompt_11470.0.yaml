      *(Final check on the PhD's claim)*: "Collapse into nonsense". Yes, because as $P(A) \to 0$, Price $\to$ Undefined or Infinite Volatility. Also, at settlement $P(A) \in \{0, 1\}$. If 0, ratio is undefined. So the contract cannot settle. That is "collapse".

