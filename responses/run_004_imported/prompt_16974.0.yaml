      *   *On "Leveling":* Make sure to emphasize that leveling is done by *envy*. That's a key mechanic. The draft implies it ("mocked"), but "envy" is the engine. I'll suggest adding that word.
      *   *On the Corsair:* Kierkegaard's goal was to be *sacrificed* to reveal the truth. It wasn't an accident. I need to make sure the user knows this wasn't him "starting a fight" in a petty sense, but a strategic sacrifice.

  9.  **Final Polish:** Ensure the tone is collaborative. "Here's what works, here's where you can sharpen." (Proceed to generate output based on these thoughts).

