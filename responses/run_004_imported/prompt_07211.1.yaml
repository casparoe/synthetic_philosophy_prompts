prompt: |-
  I'm teaching a graduate seminar on formal epistemology this term, and we just spent two sessions on the anthropic reasoning literature that left half the room -- me included, if I'm honest -- going back and forth without ever landing anywhere. Every writeup my students hand in just lists both sides and shrugs, so I want to see what an essay looks like that actually commits. Quick recap in case it helps calibrate what I'm after: Bostrom's self-sampling assumption (SSA) says you should reason as if you were a random draw from the set of all actual observers, past, present, and future, who share your "reference class" -- and that's exactly the premise behind the Carter-Leslie doomsday argument, on which your own birth rank among all humans who will ever live is mild evidence that the total human population (and so our remaining future) is smaller than you'd otherwise think.

  The self-indication assumption (SIA) was cooked up more or less specifically to kill the doomsday argument: it says you should reason as if you were a random draw from all possible observers, so any hypothesis on which more observers exist gets boosted in proportion -- which does cancel the doomsday shift, but only by comitting you to what Bostrom calls the presumptuous philosopher, who can apparently out-reason a room full of physicists running a genuinely decisive experiment just by pointing out that whichever cosmology implies vastly more observers is thereby vastly more probable. Feel free to lean on the reference class problem as a strike against SSA, and, if you think it's relevant, the sleeping beauty case, which plenty of people suspect is secretly the same dispute wearing a different coat.

  Anyway -- write me an essay that actually picks a side rather than cataloguing the two views and their respective monsters. Weigh the doomsday argument against the presumptuous philosopher, decide which bullet is less costly to bite (or whether there's some principled way to dodge both), and defend a real verdict -- hedged if it needs to be ("SIA, except when..." is a fine answer) -- but not a shrug.
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Analyze the Request:**
      *   **Context:** Graduate seminar on formal epistemology.
      *   **Problem:** Students (and the professor) are stuck in a "both sides" deadlock regarding anthropic reasoning (SSA vs. SIA).
      *   **Task:** Write an essay that *commits* to a position. No shrugging, no mere cataloging.
      *   **Key Concepts:** Self-Sampling Assumption (SSA), Doomsday Argument (DA), Self-Indication Assumption (SIA), Presumptuous Philosopher (PP), Reference Class Problem, Sleeping Beauty.
      *   **Goal:** Weigh the costs of DA vs. PP, decide which bullet is less costly (or find a dodge), and defend a verdict.
      *   **Tone:** Academic, rigorous, persuasive, suitable for a graduate-level audience.

  2.  **Determine the Stance:**
      *   *Option A: Defend SSA.* Hard to do without accepting the Doomsday Argument's grim conclusion. The reference class problem is a major weakness.
      *   *Option B: Defend SIA.* Avoids Doomsday, but invites the Presumptuous Philosopher (PP). PP seems intuitively absurd (philosophers overruling physics).
      *   *Option C: A Hybrid/Refined View.* Many contemporary formal epistemologists lean towards a specific variant of SIA or a "Full Non-indexical Conditioning" (FNC) approach, or they argue that PP isn't *as* bad as it looks, or that DA is actually correct but misunderstood.
      *   *Decision:* The most defensible, philosophically robust position that avoids the "shrug" is to **defend a qualified version of SIA (specifically Full Non-indexical Conditioning)** while arguing that the "Presumptuous Philosopher" objection is less devastating than it appears, whereas the Doomsday Argument relies on an untenable reference class specification. This allows for a clear verdict: SIA is the better framework, even with its costs, because SSA's costs are fatal to its coherence.

  3.  **Outline the Essay:**
      *   **Title:** Needs to be punchy and academic.
      *   **Introduction:** State the deadlock. Acknowledge the intuitive pull of both SSA and SIA. State the thesis clearly: SIA (via FNC) is superior; the PP objection is manageable, while SSA's reference class problem is fatal.
      *   **Section 1: The Failure of SSA.** Focus on the Reference Class Problem. Show how SSA requires arbitrary boundaries that determine the conclusion. If the reference class is "humans," DA holds. If it's "minds," "observers," "beings with my exact evidence," the result shifts. This arbitrariness undermines SSA's normative force.
      *   **Section 2: The Presumptuous Philosopher Re-evaluated.** Acknowledge the intuition that philosophers shouldn't overrule physics. But argue that PP arises from *prior* probabilities, not just anthropic updating. If two theories are empirically equivalent *so far*, the one predicting more observers *should* get a boost, but not necessarily to the point of certainty before data arrives. Distinguish between "decisive experiment" scenarios and pure speculation.
      *   **Section 3: Sleeping Beauty as a Tie-Breaker.** Connect the debate to Sleeping Beauty. Halfer = SSA-ish, Thirder = SIA-ish. Argue that the Thirder position is more coherent with standard Bayesian conditioning on indexical information.
      *   **Section 4: The Positive Case for FNC/SIA.** Propose Full Non-indexical Conditioning as the rigorous formulation of SIA. It treats "I exist" as data. It avoids the reference class trap.
      *   **Conclusion:** Reiterate the verdict. Bite the bullet on PP (it's counterintuitive but logically consistent) to avoid the incoherence of SSA.

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Start with the frustration. The "shrug" is epistemically lazy. We need a working theory. Thesis: SIA is the only viable game in town, provided we understand the PP objection correctly.
      *   *SSA Critique:* The Reference Class Problem is the killer. Bostrom admits it's a problem. If I can choose the class to get the result I want, the theory isn't guiding reasoning; it's rationalizing. DA depends entirely on "humans who know their birth rank." Why that class? If I include all sentient beings, the rank changes. This makes SSA unstable.
      *   *SIA Defense:* SIA says $P(H) \propto P(H) \times N_H$. Yes, this favors big universes. Is PP really that bad? If Theory A says 1 observer and Theory B says 1 trillion, and I find myself existing, B is indeed more likely *ceteris paribus*. The "presumption" is only absurd if we ignore that the *evidence of existence* is stronger in B.
      *   *Refining the PP point:* The prompt mentions a "decisive experiment." I need to address that. If physicists are running an experiment to distinguish T1 vs T2, can the philosopher stop them? No, because the experiment provides *new* non-anthropic evidence. The PP objection usually assumes the theories are empirically indistinguishable *except* for observer count. If they are truly indistinguishable, why prefer the small one? Parsimony? But observer count isn't ontological complexity in the same way.
      *   *Sleeping Beauty:* This is crucial. The "Thirder" position is widely seen as more robust in decision-theoretic contexts (betting arguments). Thirderism aligns with SIA. If we accept Thirderism, we should accept SIA.
      *   *Synthesis:* Adopt "Full Non-indexical Conditioning" (FNC). This is the technical way to save SIA. It says condition on all evidence, including "someone has my exact memories." This naturally yields SIA results without needing a separate "assumption."
      *   *Conclusion:* The cost of SIA (PP) is a counterintuitive probability shift. The cost of SSA (DA + Reference Class) is logical incoherence and arbitrary parameter tuning. Choose the probability shift.

  5.  **Review and Refine:**
      *   *Check Tone:* Is it too aggressive? Keep it respectful but firm. It's a model essay for grad students.
      *   *Check Constraints:* Did I avoid the shrug? Yes. Did I address DA, PP, Reference Class, and Sleeping Beauty? Yes.
      *   *Self-Correction during drafting:* I initially thought about dismissing DA entirely. But it's better to acknowledge DA follows from SSA, then reject SSA. Also, make sure to distinguish between SIA as a "patch" and SIA as a consequence of proper Bayesian conditioning (FNC). That makes the argument stronger than just "I like SIA better."
      *   *Refining the PP objection:* The prompt specifically mentions the philosopher overruling physicists. I need to be careful there. The philosopher doesn't overrule the *result* of the experiment, but claims the *prior* is so skewed the experiment is unnecessary. I should argue that if the theories are truly empirically equivalent *ex ante*, the philosopher is right. If they aren't, the physicist wins. The absurdity comes from conflating the two.

  6.  **Final Polish:** Check citations (Bostrom, Neal, Elga) implicitly or explicitly to ground it in the literature. Ensure the flow is logical. (The resulting essay follows this structure.)

  7.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  **Title:** The Reference Class Trap: Why We Must Bite the Presumptuous Bullet
  **Course:** Formal Epistemology Seminar
  **Topic:** Anthropics, SSA, and SIA

  The current stalemate in the anthropic literature is epistemically unsustainable. To treat the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA) as equipollent options, each with their own "monsters" (the Doomsday Argument vs. the Presumptuous Philosopher), is to misunderstand the structural integrity of the two frameworks. One of these monsters is a counterintuitive consequence of a coherent theory; the other is a symptom of a theory that cannot be coherently formulated.

  This essay argues that we must reject SSA and adopt a robust version of SIA—specifically, the framework of Full Non-indexical Conditioning (FNC). While the Presumptuous Philosopher (PP) is an uncomfortable companion, the alternative is to accept the Doomsday Argument (DA) on the basis of a reference class specification that is fundamentally arbitrary. The cost of SIA is a revision of our priors regarding universe size; the cost of SSA is the abandonment of objective constraints on probabilistic reasoning. The latter is the higher price.

  ### The Fatal Arbitrariness of SSA

  The primary motivation for SSA is to preserve the intuition that we are "typical" observers. If we reason as if we are a random sample from the set of actual observers, the Doomsday Argument follows naturally: finding oneself with a relatively low birth rank (e.g., the 100 billionth human) is evidence that the total number of humans will not be vastly larger, just as finding a ticket number of 100 in a lottery is evidence that the total number of tickets is not in the millions.

  However, SSA is not a standalone principle; it is a function of a reference class. SSA states: *Reason as if you are a random sample from the reference class R.* But SSA provides no internal metric for selecting *R*. This is the Reference Class Problem, and it is fatal.

  If *R* is "all humans who know their birth rank," the Doomsday Argument holds. If *R* is "all sentient beings," the probability shifts depending on the population of non-human observers. If *R* is "all observers with my exact subjective experiences," the class shrinks drastically, potentially neutralizing the Doomsday shift entirely. Because the conclusion of the Doomsday Argument is exquisitely sensitive to the boundaries of *R*, and because SSA offers no non-circular method for drawing those boundaries, SSA fails as a normative guide. It allows the agent to tune the reference class to generate the desired conclusion. A theory of reasoning that permits the user to select the premises that determine the probability of human extinction is not a theory of reasoning; it is rationalization.

  Proponents of SSA often suggest we should choose the "natural" reference class. But in formal epistemology, "natural" is not a technical term. Without a principled way to define *R* independent of the conclusion we wish to avoid, SSA collapses into incoherence. We cannot accept a framework where the probability of human extinction turns on whether we classify ourselves as *Homo sapiens* or "carbon-based observers."

  ### Re-evaluating the Presumptuous Philosopher

  If SSA is structurally broken, we are left with SIA. SIA states that, roughly, you should reason as if you are a random draw from all *possible* observers. Hypotheses that predict more observers get a prior boost proportional to their number. This cancels the Doomsday shift (because a longer future implies more observers, which boosts the hypothesis that you exist), but it generates the Presumptuous Philosopher.

  In Bostrom's thought experiment, two theories of physics are empirically indistinguishable *ex ante*. Theory T1 predicts a trillion trillion observers; Theory T2 predicts a trillion trillion trillion. The Presumptuous Philosopher claims T2 is a trillion times more likely solely because it contains more observers, rendering physical experimentation unnecessary.

  This is intuitively repugnant. It suggests armchair reasoning can overrule empirical science. However, this repugnance relies on a conflation of *prior* probability with *posterior* certainty. SIA does not claim that anthropic reasoning trumps empirical evidence; it claims it informs the priors *before* the evidence is in.

  If T1 and T2 are truly empirically indistinguishable regarding all non-anthropic data, then the only differentiating evidence we have is our own existence. In a universe with more observers, the probability of *any* specific observer existing is higher. To ignore this is to ignore data. The "presumption" is only absurd if we assume that observer count should be irrelevant to physical theory confirmation. But why should it be? If a theory implies that observers like us are vastly more common, that is a predictive success, not a bug.

  Furthermore, the "decisive experiment" objection mischaracterizes the dialectic. The Presumptuous Philosopher does not claim physicists should stop running experiments. He claims that *before* the experiment, the odds are heavily skewed. Once the physicists run the experiment, they generate new non-anthropic evidence that updates the probabilities. SIA is compatible with empirical science; it merely insists that "I exist" is itself a piece of data that must be conditioned upon. If the PP seems arrogant, it is only because we underestimate the evidential weight of our own existence.

  ### Sleeping Beauty as the Tie-Breaker

  The choice between SSA and SIA is not isolated to cosmology; it maps directly onto the Sleeping Beauty problem. In that case, SSA aligns with the "Halfer" position (credence 1/2 that the coin landed Heads), while SIA aligns with the "Thirder" position (credence 1/3).

  The Thirder position has gained dominance in decision-theoretic analyses. If Beauty is offered a bet every time she wakes up, the Halfer strategy leads to guaranteed losses (Dutch Books), while the Thirder strategy maximizes expected utility. Since SIA is essentially the generalization of the Thirder position to cosmological scales, rejecting SIA requires us to reject the decision-theoretic coherence of the Thirder view.

  If we accept that Beauty should update on the fact that she has woken up (an event that happens twice in the Tails world and once in the Heads world), we must accept that finding oneself in a world matters. To deny this in the cosmological case while accepting it in the Sleeping Beauty case is inconsistent. The structural isomorphism between the two problems suggests that if we want a decision-theoretically sound epistemology, we must accept the SIA/Thirder update.

  ### The Verdict: Full Non-indexical Conditioning

  The most rigorous defense of SIA comes not from treating it as a standalone "assumption," but as a consequence of Full Non-indexical Conditioning (FNC). FNC dictates that we should condition on all available evidence, including the fact that there exists an observer with our exact subjective states.

  Under FNC, we do not need to posit a mysterious "self-sampling" rule. We simply ask: "In which hypothesis is it more likely that an observer with my specific memories and data exists?" In a larger universe (or one with a longer future), the probability of a specific observer configuration arising is higher. This yields the SIA result without the arbitrary reference class of SSA.

  Does FNC lead to the Presumptuous Philosopher? Yes. If Theory A predicts $10^{10}$ observers and Theory B predicts $10^{20}$, and both are otherwise compatible with our data, FNC favors Theory B by a factor of $10^{10}$. Is this a bullet we must bite? Yes. But compare the cost:

  1.  **SSA Cost:** We must accept that the probability of human extinction depends on how we arbitrarily define "reference class," and we must accept the Doomsday Argument's conclusion that we are likely near the end of humanity, despite no empirical evidence of decline.
  2.  **SIA Cost:** We must accept that, *ceteris paribus*, larger universes are more probable than smaller ones, and that this probability shift can be large.

  The SSA cost is a failure of objectivity; the SIA cost is merely a counterintuitive prior. In formal epistemology, we should always prefer a theory with counterintuitive outputs over a theory with arbitrary inputs. The Doomsday Argument is a reductio ad absurdum of SSA, not a genuine prediction of extinction. The Presumptuous Philosopher is not a refutation of SIA, but a reminder that existence is evidence.

  ### Conclusion

  The seminar's deadlock stems from a desire to avoid all counterintuitive consequences. But epistemology requires trade-offs. SSA offers the comfort of a "typical" observer status but pays for it with the Reference Class Problem, which renders the theory incapable of generating unique, objective probabilities. SIA avoids the arbitrariness and aligns with decision-theoretic coherence (Sleeping Beauty), but it demands we accept that our existence favors larger worlds.

  We should choose the theory that allows us to reason consistently over the one that allows us to feel comfortable. We must reject the Doomsday Argument not because it is grim, but because it rests on a broken foundation. We should accept SIA, formulated via Full Non-indexical Conditioning. We should tell the Presumptuous Philosopher that he is logically correct, even if his confidence makes the physicists in the room uncomfortable. It is better to be presumptuous than arbitrary.
