prompt: |-
  I help run a tiny volunteer fund in my town — six of us on a group chat basically — that gives neighbors one-time grants (a couple hundred bucks up to $1000ish) to cover back rent or a utility bill before it turns into a shutoff or eviction notice. We started out just winging it, but we get more applications every month than we have money for, and it's turned into a real fight about how we should decide who gets funded, so we finally have to write an actual policy down.

  Right now, roughly half of us process applications in the order they come in and approve the first ones that clearly meet our basic bar (real shutoff/eviction notice, amount asked for is reasonable, hasn't gotten money from us in the last 6 months), until that month's pot is gone — so somebody who applies on the 3rd and obviously qualifies gets the money even if somebody worse off applies on the 8th, after the moneys already spent. The other half want us to hold every application for two weeks, score them all on a need rubric, and fund strictly worst-off-first. The first group's argument is that making someone with a shutoff notice wait two extra weeks so we can feel like we ranked everybody fairly is its own kind of cruelty, and that the rubric scores are close enough for most people that the "ranking" is mostly noise anyway. The second group's argument, which I honestly can't out-argue, is that if there's somebody visibly worse off sitting in the queue and the money hasn't gone out the door yet, "we already found somebody good enough" isn't a real reason not to help them instead — it's just us stopping early because stopping is easier. We also can't agree on whether the "clearly qualifies" bar itself should slide up or down depending on how many strong applications come in a given month, or whether that's just us moving the goalposts whenever it's convenient.

  After the last meeting I fell into a bit of an internet hole reading about "satisficing" — started with a pop psychology book about maximizers vs satisficers, then some older economist guy (Herbert Simon?) on why organizations basically can't optimize and just settle for good-enough, then a philosopher — Slote, I think? — apparently arguing that settling for good-enough isn't just a fallback for when you're out of time, it can be the actually correct call. I don't fully know what to do with any of that, but I'd like to bring something better than vibes to our meeting in two weeks, where we're voting on making this official policy. Could you write the memo I'd send around beforehand? I want it to actually commit to one policy instead of splitting the difference, lay out the reasoning tight enough that people can push back on specific pieces of it, and genuinely deal with the "there's a worse-off person right there" objection instead of brushing past it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the User and Situation:**
      *   **User:** Volunteer at a tiny mutual aid fund (6 people, group chat).
      *   **Problem:** Demand exceeds supply. Conflict over allocation policy.
      *   **Current State:** Split 50/50 between "First-Come, First-Served (FCFS) with a threshold" vs. "Batch & Rank (Worst-Off-First)."
      *   **Conflict Points:**
          *   FCFS Arg: Speed prevents harm (shutoffs/evictions happen fast); ranking is noisy/subjective.
          *   Batch Arg: Moral obligation to help the *most* needy, not just the *first* needy; stopping early is lazy.
          *   Secondary Conflict: Should eligibility criteria slide based on funding volume? (Moving goalposts).
      *   **User's Intellectual Hook:** Interested in "Satisficing" (Herbert Simon, Michael Slote). Wants to use this framework to justify a decision, not just split the difference.
      *   **Goal:** A memo to the other 5 volunteers before the voting meeting.
      *   **Requirements:**
          *   Commit to *one* policy (no compromise).
          *   Tight reasoning (attackable specific points).
          *   Address the "worse-off person" objection directly.
          *   Incorporate the "satisficing" concept meaningfully.
          *   Tone: Respectful, serious, community-focused, not academic jargon-heavy.

  2.  **Determine the Policy Recommendation:**
      *   *Option A: Batch & Rank.* Pros: Maximizes impact per dollar based on need. Cons: Delays help (risk of eviction/shutoff during the wait), high administrative burden for volunteers (burnout), subjective scoring leads to conflict.
      *   *Option B: FCFS with Satisficing Threshold.* Pros: Speed (prevents immediate crisis), clear rules (less conflict), sustainable for volunteers. Cons: Might miss a "more needy" person later in the month.
      *   *Decision:* Given the context (tiny volunteer fund, crisis intervention for rent/utilities), **FCFS with a Satisficing Threshold** is the stronger operational and ethical choice. Speed *is* a component of need in eviction prevention. A delay *is* a harm. The "Satisficing" framework fits perfectly here: We define "good enough to fund" (the threshold). Once an application meets that, funding it is the *right* thing to do, not a "settling" thing. Optimizing for the "absolute worst off" creates paralysis and administrative drag that undermines the mission.
      *   *Why Satisficing?* It reframes the FCFS approach not as "lazy" or "first-come" but as "meeting a moral threshold." If someone is facing eviction and asks for help, they have crossed the moral threshold. Funding them is a moral success. Waiting to see if someone *more* evicted appears is "maximizing," which Simon argues is impossible/costly and Slote argues can be morally inferior if it delays action.

  3.  **Drafting the Memo - Section by Section:**

      *   **Subject Line:** Needs to be clear and indicate a proposal.
      *   **Opening:** Acknowledge the stress/conflict. Validate both sides. State the purpose of the memo (proposal for vote).
      *   **The Core Recommendation:** State it clearly up front. FCFS + Fixed Threshold + No Batching.
      *   **The Philosophical Framework (Satisficing):** Explain it simply. Don't lecture, but use it to ground the argument.
          *   *Simon:* Optimization is too costly/impossible.
          *   *Slote:* Meeting a moral threshold is sufficient; we don't need to find the *best* action if the *good* action is urgent.
      *   **Addressing the "Worse-Off" Objection:** This is crucial.
          *   Argument: Time is a variable of need. A slightly less needy person *today* might be in a worse spot *in two weeks* than the super needy person who applied later.
          *   Argument: Certainty vs. Speculation. The application in hand is real. The "worse off" person is hypothetical until they apply.
          *   Argument: Volunteer capacity. Burnout kills the fund.
      *   **The "Moving Goalposts" Issue:** Argue for a *fixed* threshold. Sliding scales create uncertainty and perceived unfairness. If we run out of money, we run out. That's a funding problem, not an eligibility problem.
      *   **The Proposed Policy Details:** Concrete rules (Threshold, FCFS, One-time limit, Transparency).
      *   **Closing:** Invite critique on specific points.

  4.  **Refining the Tone:**
      *   Avoid sounding condescending about the "maximizer" side. Acknowledge their moral intuition is correct (we *do* want to help the worst off), but argue their *method* fails in this specific context.
      *   Keep it warm but firm. It's a group of neighbors, not a board of directors.
      *   Ensure the "Satisficing" concept is accessible. Use terms like "Good Enough to Act" vs. "Perfect Allocation."

  5.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the Satisficing argument too academic?
      *   *Fix:* Ground it in the reality of eviction notices. An eviction notice doesn't wait for a committee score.
      *   *Critique:* Did I address the "moving goalposts" issue?
      *   *Fix:* Yes, make sure to explicitly state that the bar shouldn't change based on the budget. The budget limits the *number* of people, not the *definition* of need.
      *   *Critique:* Is the commitment clear?
      *   *Fix:* Use bold text for the recommendation.

  6.  **Final Polish:** Check against the prompt requirements.
      *   Commit to one policy? Yes (FCFS/Satisficing).
      *   Tight reasoning? Yes.
      *   Deal with "worse-off" objection? Yes (Time sensitivity + Certainty).
      *   Use Satisficing? Yes (Simon/Slote integration).
      *   Tone appropriate for volunteers? Yes.

