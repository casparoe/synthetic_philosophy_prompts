      *   *Point 4: CDT Objections.*
          *   **The "Tickle" Defense:** CDT proponents argue that you can screen off the correlation by conditioning on your own internal state (the "tickle" of your decision).
          *   **Causal Structure:** CDT insists that the arrow goes Prediction $\to$ Box Content, and Decision $\to$ Payoff. There is no arrow from Decision $\to$ Prediction (backwards causation) or Common Cause $\to$ Both (unless specified). If the Common Cause exists, CDT actually *agrees* with One-Boxing in that specific causal graph (using Pearl's causal networks).
          *   **Key Distinction:** CDT isn't committed to "Two-Boxing" in *all* versions of Newcomb. It Two-Boxes only when the correlation is *not* causal. If the user posits a Common Cause, a sophisticated CDTer (using causal graphs) would actually One-Box.
