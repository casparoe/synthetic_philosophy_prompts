          *   If the choice is determined, the "dominance principle" (Two-Boxing) fails because you can't vary the choice independently of the prediction.
      *   **The CDT Objection (The "Gotcha"):**
          *   **Causal Graphs:** Modern CDT (Pearl/Spirtes/Glymour/Scheines) handles common causes explicitly. If you draw the graph with a Common Cause node, CDT *recommends One-Boxing*.
          *   **The Standard CDT Stance:** The standard CDTer (like David Lewis) argues that *even if* the predictor is reliable, your decision is not *caused* by the prediction, nor do they share a cause that your decision can leverage. They argue for "Metaphysical Freedom" to break the link.
          *   **The "Screening Off" Argument:** If you know your own mind (the state leading to the decision), the prediction adds no new info.
          *   **Pragmatic Objection:** Even if determined, you experience deliberation. You must act *as if* you have a choice.
      *   **Recommendation for the Seminar:**
          *   Don't say "CDT is wrong." Say "CDT relies on an assumption of Statistical Independence between Agent State and Past Causes, analogous to Measurement Independence in Bell tests."
          *   Be prepared for the "Causal Graph" counter-argument. If you posit a common cause, CDT agrees with you. The disagreement is whether that common cause exists/is accessible.
          *   Highlight the "Dissolution" aspect: You are arguing the problem presupposes a libertarian free will that is incompatible with the predictor's existence.

  5.  **Refining the Tone:**
