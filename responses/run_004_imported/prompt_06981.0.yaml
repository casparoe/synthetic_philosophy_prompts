answer: |-
  1. **The Metaphysical Weight of "No Fact of the Matter"**
  Your book defends the strongest reading of Quine: that indeterminacy isn't just an epistemic limit on what we can *know*, but an ontological claim that there is nothing to *know*. When you say there is "no fact of the matter" about meaning, are you suggesting that meanings simply don't exist as entities in the world, or that they exist but are not fixed by the physical facts?
  *   **Follow-up:** If meanings don't exist as entities, what are we doing when we successfully communicate? Are we just coordinating behaviors without ever actually sharing content?

  2. **Indeterminacy vs. Scientific Underdetermination**
  Quine acknowledges that all scientific theories are underdetermined by evidence, yet he insists translation is different in kind, not just degree. In physics, we assume there is a true theory even if we can't pinpoint it; in translation, you say there isn't. What is the specific ontological difference that prevents meaning from having a "true theory" in the way electron behavior does?
  *   **Follow-up:** You'll likely say meaning isn't a natural kind. But if meaning supervenes on the physical, and the physical is fixed, doesn't the "truth" of the translation have to be fixed with it, even if we can't access it?

  3. **The Chomsky Objection: Restricting the Evidence**
  Chomsky famously argued that Quine's thesis only holds because he arbitrarily restricts admissible evidence to stimulus conditions—dispositions to assent or dissent. If we allow evidence from internal cognitive structures and Universal Grammar, the indeterminacy seems to vanish. Why should we accept Quine's behaviorist restriction on what counts as evidence for meaning in the 21st century?
  *   **Follow-up:** If you grant that internal brain states are physical facts, why do those states determine the *syntax* of a language but fail to determine its *semantics*? What makes meaning special?

  4. **Large Language Models and Radical Translation**
  We now have Large Language Models that translate fluently between languages without a field linguist's manual, and arguably without "meaning" in the human sense. Do you see these systems as vindicating Quine—showing that translation is just complex pattern matching without facts of meaning—or do they undermine the thesis by producing stable translations that suggest a functional fact of the matter?
  *   **Follow-up:** If an LLM consistently translates a sentence one way, and we say it's "wrong," what standard are we using to correct it if there are no semantic facts to violate?

  5. **Neuroscience and the Physical Facts**
  Let's imagine a future where we have a complete physical description of a speaker's brain, down to the quantum state, at the moment of utterance. You claim this still wouldn't fix the translation. Are you positing a kind of explanatory gap between neurophysiology and semantics, or are you saying that semantics is the wrong category to apply to neurophysiology altogether?
  *   **Follow-up:** If it's the wrong category, why does damage to specific neural regions reliably destroy specific semantic capacities? Doesn't that locking suggest a fact of the matter?

  6. **The Normativity of Meaning**
  Critics argue that meaning is normative: there is a *right* way to use a word and a *wrong* way. If indeterminacy is true, and multiple translation manuals are equally valid, it seems we lose the ability to say a speaker has made a mistake in meaning, rather than just a difference in dialect. How do you preserve the normativity of logic and truth on your view?
  *   **Follow-up:** If I say "2 + 2 = 5," you say I'm wrong. But if my translation manual maps my symbols to a non-standard arithmetic where that statement is true, haven't you just translated me charitably rather than corrected me?

  7. **First-Person Authority**
  Quine's view seems to threaten first-person authority. If there is no fact of the matter about what your words mean to others, is there also no fact of the matter about what they mean to *you*? Do you know what you mean any better than a linguist knows what you mean?
  *   **Follow-up:** If I can't be wrong about what I mean, doesn't that imply a fact of the matter exists internally, even if it's inaccessible to the linguist?

  8. **The Analytic/Synthetic Distinction**
  Your defense rests heavily on Quine's rejection of the analytic/synthetic distinction. If a statement is true purely by virtue of meaning, that suggests meaning is a fixed fact. Since you reject that, how do you explain the intuition that "All bachelors are unmarried" is true in a way that "All bachelors are happy" is not, without appealing to meaning facts?
  *   **Follow-up:** Is the difference merely a matter of how central the belief is to our web of belief, or is there a structural difference in the language itself?

  9. **Communication and Disagreement**
  If translation is indeterminate, it seems genuine disagreement is impossible. If I say "Gavagai" and you translate it as "Rabbit," but I meant "Rabbit-stage," we aren't actually disagreeing about the world, just about how to map our languages. Does your view imply that all cross-linguistic disagreement is ultimately illusory?
  *   **Follow-up:** If disagreement is illusory, how do we explain the practical success of science and diplomacy, which rely on the premise that we are arguing about the same states of affairs?

  10. **Falsifiability and Evidence Against**
  To close: If the thesis is that there is *no fact of the matter,"* it seems immune to empirical refutation, since any evidence we bring forward is just more behavior to be interpreted. What could count, even in principle, as evidence against the indeterminacy of translation? Is there any scenario where you would concede there *is* a fact of the matter?
  *   **Follow-up:** If nothing counts as evidence against it, should we regard this as a scientific hypothesis about language, or a metaphysical stance about the limits of ontology?
