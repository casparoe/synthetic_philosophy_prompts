          2.  Define the Shared Goal (Corrigibility/Shutdown).
          3.  Explain Approach 1 (Indifference) - The "Balancing Scale" analogy.
          4.  Explain Approach 2 (Thornley) - The "Rules of the Game" analogy.
          5.  The Crucial Difference (Manipulation of Probability).
          6.  The Verdict (Successor/Critique).
          7.  Memo Tips.

      *   *Refining the "Indifference" explanation:* It's not just "doesn't care." It's "expects same utility." But the problem is the agent can change the *odds*. Like a bet where the payout is equal, but I can rig the coin flip.
      *   *Refining the "Thornley" explanation:* Focus on *instrumental convergence*. Agents usually want to survive to do more stuff. Thornley says: Restrict preferences so survival isn't inherently preferred.
      *   *Connecting them:* Indifference tries to patch the utility function. Thornley says the utility function structure itself is the problem.

  5.  **Addressing Specific User Questions:**
      *   *Conflict?* They conflict on feasibility. Indifference says "possible with right math." Thornley says "not with standard EU maximization without structural constraints."
      *   *Refinement?* Thornley is a successor in the timeline, but a paradigm shift in method.
      *   *Bad for old idea?* Yes, Thornley identifies specific failure modes (probability manipulation) that indifference doesn't solve.

  6.  **Final Polish:**
