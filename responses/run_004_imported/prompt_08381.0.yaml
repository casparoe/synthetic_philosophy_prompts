      *   **Perdurantism (4D-ism / Worm Theory):**
          *   *Ontology:* Objects are space-time worms. Person is extended through time.
          *   *Identity:* The "person" is the whole worm. Temporal parts are parts of the whole.
          *   *Temporary Intrinsics:* Easy. Different temporal parts have different properties.
          *   *Moral/Practical Implication:* The "whole worm" is the agent. Early parts bind later parts as parts of the same whole.

      *   **Stage Theory (Exdurantism):**
          *   *Ontology:* Only momentary stages exist. "The person" refers to the current stage.
          *   *Identity:* No trans-temporal identity. Only counterpart relations (causal/psychological continuity).
          *   *Temporary Intrinsics:* Trivial. Each stage has its own properties.
          *   *Moral/Practical Implication:* Weaker binding. The future stage is a *counterpart*, not the *same* entity. Obligations might be weaker or require different justification (e.g., concern for counterparts).

