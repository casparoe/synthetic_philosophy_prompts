answer: |-
  The evolution of Frederick Douglass's thought regarding the United States Constitution represents one of the most significant intellectual pivots in American political history. In the 1840s, standing shoulder-to-shoulder with William Lloyd Garrison, Douglass denounced the Constitution as a "covenant with death," a pro-slavery compact that morally implicated all who participated in its government. By the 1850s, however, Douglass had broken with Garrison, adopting the legal theories of Gerrit Smith and Lysander Spooner to argue that the Constitution was, in fact, a "glorious liberty document." To determine whether Douglass was right to change his mind requires more than a historical tally of the framers' prejudices; it requires an adjudication of constitutional hermeneutics. While the Garrisonian position offers a searingly accurate critique of the framers' historical compromises, Douglass's later textualist interpretation is the more defensible reading of the Constitution. As a binding legal instrument, the Constitution must be judged by its enacted text and declared purposes rather than the unenacted intentions of its drafters. Douglass was right to change his mind because his later view correctly identifies that the law, properly interpreted, provides the machinery for its own redemption.

  The strongest version of the Garrisonian argument rests on structural realism and original intent. Garrison and the early Douglass looked at the Constitution not as a collection of abstract ideals, but as a operational contract between free and slave states. From this vantage point, the document contained specific "dark bargains" that could not be explained by any principle other than the protection of human property. The Three-Fifths Clause (Article I, Section 2) augmented the political power of slaveholding states in the House and Electoral College, effectively giving slaveholders disproportionate influence over federal policy. The Fugitive Slave Clause (Article IV, Section 2) mandated that persons "held to Service or Labour" escaping to free states must be "delivered up," compelling free citizens to act as agents of bondage. Furthermore, the Slave Trade Clause (Article I, Section 9) prohibited Congress from banning the migration or importation of enslaved people for twenty years.

  For the Garrisonians, these were not ambiguities; they were features. The argument posits that the Constitution was designed to preserve the Union by appeasing the South, and since the South's economy and social order rested on slavery, the Constitution was inherently pro-slavery. To vote under such a document, or to hold office within its framework, was to swear an oath to uphold a system of brutality. The moral logic here is uncompromising: one cannot make an agreement with hell and expect it to yield heaven. This reading is historically robust because it aligns with the political reality of the antebellum period, where the federal government consistently acted to protect slaveholder interests, from the Fugitive Slave Act of 1850 to the *Dred Scott* decision.

  However, the Douglass of the 1850s countered with a rigorous legal formalism that prioritized the enacted text over historical context. Influenced by Lysander Spooner's *The Unconstitutionality of Slavery*, Douglass argued that the Constitution must be read as a standalone legal instrument. The strongest version of this argument highlights the conspicuous silence of the text: the words "slave" and "slavery" appear nowhere in the document. Instead, the text uses euphemisms like "persons held to service." Douglass argued that under ordinary canons of legal construction, a law that deprives a person of liberty must do so explicitly. Since the Constitution did not explicitly establish property in man, no such property right could be claimed under federal authority.

  Furthermore, Douglass anchored his reading in the Preamble, which declares the document's purposes to "secure the Blessings of Liberty" and "establish Justice." He argued that the Preamble acts as a key to unlock the meaning of ambiguous clauses. If a clause can be read in two ways—one consistent with liberty and one consistent with slavery—the canon of construction demands the reading that favors liberty (*in dubio pro libertate*). Under this framework, the Fugitive Slave Clause referred to indentured servants or convicts, not chattel slaves, because the Constitution did not recognize the legal existence of chattel slavery. The Three-Fifths Clause was a penalty on the South for denying the vote to black people, rather than a bonus for owning them. This reading transformed the Constitution from a barrier into a weapon; it allowed abolitionists to argue that the federal government had not just the right, but the duty, to abolish slavery in the states to fulfill the Preamble's mandate.

  To render a verdict between these two positions, one must distinguish between historical diagnosis and legal interpretation. The Garrisonians were largely correct about the *history*: the Philadelphia delegates did compromise, and many intended to protect slaveholding interests to ensure ratification. However, Douglass was correct about the *law*. In a constitutional republic, the authority of the fundamental law derives from its ratification by the people, not from the secret intentions of the drafters. James Madison's notes on the Constitutional Convention were not published until after his death in 1836; the public that ratified the document did so based on the text before them, not the private whispers of the convention. Therefore, the "original public meaning" of the text holds more legal weight than the "original intent" of the framers.

  If the text allows for an anti-slavery reading, that reading is legally valid, regardless of whether the framers hoped it would be ignored. Douglass recognized that surrendering the text to the Garrisonian interpretation was a strategic and jurisprudential error. It ceded the authority of the law to the slaveholders, leaving abolitionists with no recourse but disunion or revolution. By claiming the text for liberty, Douglass exposed the hypocrisy of the slave system: it relied on extralegal violence because it could not sustain itself under a strict reading of the Constitution's liberty clauses.

  Moreover, Douglass's reading is more defensible because it aligns the mechanism of government with the moral imperative of justice. The Garrisonian view leads to political nihilism; if the Constitution is pro-slavery, then the government is illegitimate, and the only solution is to dissolve the Union. This offers no pathway to free the enslaved people already within that Union. Douglass's view, conversely, provides a roadmap for reconstruction. It anticipates the logic of the Reconstruction Amendments (the 13th, 14th, and 15th), which did not create a new Constitution but rather fulfilled the potential of the old one by making explicit what Douglass argued was already implicit: that the Constitution guarantees liberty to all persons.

  Ultimately, Douglass was right to change his mind because he realized that the Constitution is not a static historical artifact but a living instrument of governance. While the Garrisonians accurately described the sins of the fathers, Douglass correctly identified the rights of the sons. A legal document that contains no explicit authorization for slavery cannot be legitimately used to enforce it, regardless of the framers' private hopes. By shifting his ground from moral condemnation of the framers to legal assertion of the text, Douglass did not whitewash history; he weaponized the law. The more defensible reading is the one that empowers the state to secure liberty rather than the one that abandons the state to the slaveholders. Douglass's later position vindicates the principle that in a democracy, the enacted word of the people is sovereign over the unenacted intentions of the elite. Thus, while Garrison diagnosed the disease of the founding, Douglass prescribed the only cure that could actually save the patient.
