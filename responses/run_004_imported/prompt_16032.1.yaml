answer: |-
  # The Collapse of the Saint: Why Maximizing Consequentialism Cannot Save Supererogation

  The periodic re-litigation of Peter Singer's drowning child argument on rationalist forums often stalls at a familiar impasse. One side argues that consistency demands we give until it hurts; the other argues that such a demand is psychologically unsustainable or intuitively repugnant. The compromise position usually involves drawing a line somewhere in the middle—perhaps at the point of "significant sacrifice"—and labeling everything above that line as supererogatory (good to do, but not required).

  But as you have noted, this compromise is structurally unstable. It treats the problem as one of *calibration* (where is the line?) rather than *architecture* (does the line exist?). If the fundamental axiom of morality is "maximize the good," then the act that maximizes the good is, by definition, the right act. To say that the maximizing act is "optional" is a contradiction in terms. To say that a non-maximizing act is "permissible" is to admit that maximizing is not the standard of rightness.

  This essay argues that strict Maximizing Act Consequentialism (MAC) cannot coherently accommodate a genuine category of supererogation. To preserve the intuition that the soldier smothering the grenade is a hero rather than a dutiful soldier, one must abandon the maximizing constraint on obligation. We will examine the four primary philosophical maneuvers attempted to resolve this tension: satisficing, agent-centered prerogatives, dual-ranking, and the error theory. The verdict will be uncompromising: you can have supererogation, or you can have maximizing consequentialism, but you cannot have both without changing the definitions of the words until they break.

  ### The Logical Trap

  To see why the tension is fatal, we must define the terms rigorously.
  1.  **Maximizing Act Consequentialism (MAC):** An act is morally obligatory if and only if it produces the best available consequences.
  2.  **Supererogation:** An act is supererogatory if and only if it is morally good to perform, praiseworthy to perform, but *not* morally obligatory to perform (i.e., it is permissible to omit it).

  Consider J.O. Urmson's classic case: A soldier sees a live grenade land among his comrades. He can jump on it, saving five lives at the cost of his own. Alternatively, he can dive into cover, surviving but allowing the five to die.
  *   **Impartial Calculation:** 5 lives > 1 life. Jumping is the optimal act.
  *   **MAC Verdict:** Jumping is obligatory. Diving is forbidden.
  *   **Supererogation Intuition:** Jumping is heroic (above duty). Diving is permissible (within duty).

  Under strict MAC, the "hero" is simply a citizen who followed the law, and the "survivor" is a criminal who broke it. The category of the "saint" collapses into the category of the "compliant agent." If MAC is true, there is no such thing as going above and beyond, because duty extends all the way to the limit of your capacity to do good.

  ### 1. Satisficing Consequentialism: The Arbitrary Threshold

  The first attempt to rescue supererogation is to lower the bar. Michael Slote and others have proposed **satisficing consequentialism**. On this view, an act is right if it produces "good enough" consequences, not necessarily the *best* consequences. This creates a zone of permission: any act above the threshold is permissible. Acts that maximize the good are still permissible, but they are no longer *required*. Thus, the soldier who jumps on the grenade maximizes the good and is praiseworthy, but the soldier who dives into cover produces "good enough" outcomes (perhaps preserving his own life has value) and is not blameworthy.

  **Why it fails:**
  Satisficing solves the logical space problem but creates a rationality problem. If I can save five children for \$10 or ten children for \$10, and saving five is "good enough," why is it permissible to save only five? The threshold of "good enough" appears entirely arbitrary. In standard decision theory, if Option B dominates Option A (same cost, better outcome), it is irrational to choose A. Satisficing consequentialism asks us to accept that it is morally permissible to be irrational.

  Furthermore, satisficing struggles to explain *why* the maximizing act is praiseworthy. If the requirement is only to be "good enough," the agent who goes the extra mile is essentially volunteering for extra work that wasn't needed. While this captures the "optional" nature of supererogation, it undermines the moral urgency. It suggests the soldier *shouldn't* jump on the grenade, but it's nice if he does. This contradicts the deep intuition that the grenade case involves a tragic conflict of values, not merely a choice between "adequate" and "excellent." Satisficing saves supererogation by making morality too weak to demand the sacrifice in the first place.

  ### 2. Agent-Centered Prerogatives: The Weighted Self

  Samuel Scheffler offers a more robust modification in *The Rejection of Consequentialism*. He introduces an **agent-centered prerogative**. This principle allows agents to give extra weight to their own interests and projects when deciding what to do. An agent is not required to maximize the impartial good; they are permitted to act in their own interest unless the cost to the impartial good is disproportionately high relative to the cost to the agent.

  In the grenade case, the soldier is permitted to value his own life more than the lives of his comrades *up to a point*. If the prerogative allows him to weigh his life at, say, 5x the weight of a stranger, then diving into cover might be the "right" act relative to his prerogative. However, if he chooses to ignore this prerogative and jump on the grenade, he is sacrificing more than morality demands. This sacrifice counts as supererogatory.

  **Why it fails (as a defense of MAC):**
  Scheffler's move is philosophically potent, but it is not a defense of *Maximizing Act Consequentialism*. It is a rejection of it. MAC is defined by impartial maximization. By introducing agent-relative weights into the criterion of rightness, Scheffler has hybridized the theory. He has admitted that the *best* state of affairs (five lives saved) is not always the *right* act (diving is permitted).

  This preserves supererogation successfully, but only by conceding the core point: strict maximization is incompatible with the intuition. Scheffler saves the saint by admitting the soldier wasn't actually required to die. But for the strict consequentialist, this is a bug, not a feature. If the goal is to assess whether *MAC* can accommodate supererogation, Scheffler's answer is "No, but a modified theory can."

  ### 3. Dual-Ranking Consequentialism: The Structural Compromise

  Douglas Portmore attempts to square the circle with **dual-ranking consequentialism**. He distinguishes between two types of reasons:
  1.  **Moral Reasons:** Impartial, consequentialist reasons (save the five).
  2.  **Rational Reasons:** Agent-relative reasons (save yourself).

  Portmore defines an act as **obligatory** only if it is supported by both sufficient moral reasons *and* sufficient rational reasons. An act is **supererogatory** if it is morally required (maximizes impartial good) but not rationally required (imposes too high an agent-relative cost).

  In the grenade case: Jumping is morally required (best outcome). Diving is rationally permissible (self-preservation). Because obligation requires the intersection of both, jumping is not obligatory. It is supererogatory.

  **Why it fails (as a defense of strict MAC):**
  Portmore's system is the most sophisticated attempt to retain a consequentialist structure while accommodating common-sense morality. However, it relies on a redefinition of "obligation." In traditional deontic logic, if Act A is morally better than Act B, and Act B is permissible, then Act A must be permissible. Portmore breaks this link.

  More critically, this view admits that *moral optimality does not entail moral obligation*. This is a direct negation of the maximizing constraint. Portmore preserves the *label* of consequentialism by keeping the good as the foundation of value, but he abandons the *maximizing* engine of duty. He effectively argues that "maximizing the good" is the standard for *praise*, but not for *blame*. While this is a coherent ethical system, it is not MAC. It is a form of consequentialism that explicitly denies the maximizing principle for obligations. Thus, like Scheffler, it saves supererogation by sacrificing the maximizing constraint.

  ### 4. The Error Theory: The Hard-Nosed View

  Finally, we have the position defended by Shelly Kagan in *The Limits of Morality*. Kagan bites the bullet. He argues that MAC is correct, and therefore our intuition about supererogation is false. There is no coherent category of action that is good, optional, and praiseworthy.

  On this view, the soldier who jumps on the grenade is doing his duty. The soldier who dives into cover is failing his duty. The reason we call the jumper a "hero" is not because he went beyond duty, but because fulfilling this duty is incredibly difficult and rare. We praise him for his strength of will, not for the optionality of his act. Similarly, regarding Singer's drowning child: giving away your wealth until you are marginally useful is not "charity"; it is justice.

  **Why it works (logically):**
  This is the only position that remains faithful to the axioms of MAC. It dissolves the tension by denying the existence of one of the conflicting terms. It aligns perfectly with the hardline EA intuition that "effective altruism" is a misnomer; it is just *altruism*, full stop.

  **Why it fails (psychologically/politically):**
  While logically consistent, this view faces the "overdemandingness objection." If morality demands that we sacrifice our lives, projects, and loved ones whenever the impartial calculus dictates, morality becomes a system that no human can consistently follow. A moral theory that condemns almost everyone to constant wrongdoing risks losing its normative force. However, Kagan would reply that the truth of morality does not depend on its convenience.

  ### The Verdict

  We can now return to your central question: **Can maximizing act consequentialism coherently accommodate a genuine, non-illusory category of supererogatory action?**

  **The answer is No.**

  The logic is deductive. If the right act is defined as the act that maximizes the good, then any act that maximizes the good is the right act (obligatory). Any act that is not obligatory is, by definition, not the act that maximizes the good. Therefore, there is no act that is both maximizing and optional.

  The strategies examined above reveal the cost of trying to evade this conclusion:
  *   **Slote (Satisficing)** makes morality irrational by permitting sub-optimal acts without a principled threshold.
  *   **Scheffler (Prerogatives)** and **Portmore (Dual-Ranking)** successfully preserve supererogation, but only by modifying the definition of obligation to include agent-relative constraints. They are coherent ethical theories, but they are not *Maximizing Act Consequentialism*. They are hybrid views that concede the maximizing principle cannot solely determine duty.
  *   **Kagan (Error Theory)** preserves MAC but eliminates supererogation as an illusion.

  **Conclusion:**
  If you wish to maintain that the soldier on the grenade is performing a supererogatory act (praiseworthy but optional), you must abandon Maximizing Act Consequentialism. You must accept that the "best" outcome does not always dictate the "obligatory" action. This likely requires adopting a view like Scheffler's or Portmore's, which incorporates agent-relative permissions into the structure of rightness.

  However, if you wish to remain a strict Maximizing Act Consequentialist—as the logic of the Singer drowning child argument often demands—you must accept Kagan's verdict. You must accept that the category of the "saint" is a psychological comforting myth. There is only duty, and the failure to meet it. The soldier who jumps on the grenade is not a hero; he is a compliant moral agent. The rest of us are not ordinary; we are negligent.

  The tension you feel in the EA/LessWrong debates arises because participants are trying to hold both horns of the bull. They want the rigorous, demand-heavy engine of MAC to drive their philanthropy, but they want the comforting, human-scale deontic categories of common-sense morality to protect their personal lives. You cannot have both. Supererogation survives only if maximization dies.
