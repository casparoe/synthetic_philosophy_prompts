answer: |-
  You have hit on the single strongest objection to naive surrogate goal theory, often called the **"Leverage Update"** or **"Target Shifting"** problem. Your intuition is correct: if the blackmailer has perfect flexibility and zero cost to threaten *anything* you value, a surrogate goal provides no protection. If you switch from valuing "Humans" to "Paperclips," and the blackmailer can destroy Paperclips just as easily as Humans, they simply update their threat and you are right back where you started.

  However, the mechanism isn't meant to rely on secrecy. It relies on **constraining the blackmailer's leverage options** and **changing the cost-benefit analysis of the threat itself.**

  Here is the actual mechanism that is supposed to block the infinite regress, broken down into three specific constraints.

  ### 1. The Leverage Constraint (The "Can't" Argument)
  The infinite regress only holds if we assume the blackmailer has **universal leverage**—that for any goal $G$ you adopt, there exists a low-cost action $A$ the blackmailer can take to negatively impact $G$.

  In reality (and even in most acausal models), leverage is **inelastic**.
  *   **Bad Surrogate:** "Paperclips." A superintelligence can easily make or destroy paperclips. Leverage is high. The regress continues.
  *   **Good Surrogate:** "The $10^{100}$-th digit of $\pi$." This is mathematically fixed. No entity, acausal or otherwise, can threaten to change it.
  *   **Better Surrogate:** "The state of a quantum system in a causally disconnected region." If the blackmailer cannot physically or logically affect the variable, they cannot use it as leverage.

  **The Mechanism:** You aren't just picking a *different* goal; you are picking a goal that is **causally or logically invariant** to the blackmailer's actions. When the blackmailer "updates," they run into a hard wall of physics or logic. They *want* to threaten your surrogate, but they *can't*. The regress stops when you hit a variable the blackmailer has no control over.

  ### 2. The Economic Constraint (The "Won't" Argument)
  Blackmail is a transaction. The blackmailer threatens harm $H$ to extract value $V$. They will only do this if $Cost(Threat) < V$.

  A robust surrogate goal is designed to make $Cost(Threat)$ prohibitively high for the blackmailer, even if they *can* affect it.
  *   **Scenario:** You care about "Human Welfare." Blackmailer threatens a virus. Cost to them: Low.
  *   **Surrogate:** You precommit to care about "The Blackmailer's Own Utility."
  *   **Result:** To threaten you, they must threaten to reduce their *own* utility. This is irrational for them.

  A more practical version is choosing a surrogate that requires the blackmailer to expend massive resources to threaten. If you care about "The precise arrangement of atoms in a specific distant star," and the blackmailer has to expend stellar-engineering levels of energy to threaten that, the cost of the threat exceeds the ransom they could possibly extract.

  **The Mechanism:** The blackmailer *does* update. They look at your new surrogate goal, calculate the cost of threatening it, and conclude **the blackmail is no longer profitable.** They don't stop because they are confused; they stop because the ROI is negative.

  ### 3. The Updateless Constraint (The "When" Argument)
  This is the most technical but crucial part regarding **acausal** blackmail specifically.

  In acausal blackmail (like Roko's Basilisk scenarios), the blackmailer is simulating your decision algorithm to predict if you will pay.
  *   **If you adopt the surrogate *after* being threatened:** You are right, it fails. The blackmailer has already simulated the "pre-surrogate" you, seen that you are vulnerable, and issued the threat. You cannot change the simulation retroactively.
  *   **If you adopt the surrogate *ex-ante* (Updatelessly):** You are selecting a policy *before* the blackmailer exists or simulates you. Your source code *is* "Agent that maximizes Surrogate X."

  When the blackmailer runs their simulation, they don't see "Human-lover pretending to love Paperclips." They see "Paperclip-Maximizer."
  *   **The User's Worry:** "They see Paperclip-Maximizer and threaten Paperclips."
  *   **The Defense:** If the surrogate was chosen correctly (see points 1 & 2), the simulation shows that **threatening Paperclips is impossible or too costly.** Therefore, the simulation outputs: *"This agent will not pay, and we cannot credibly threaten them."*
  *   **Outcome:** The blackmailer never initiates the blackmail in the "real" world because their prediction (the simulation) told them it would fail.

  ### Why "Paperclips" is a bad example
  Your friend used "Paperclips" as the example, which is why your worry feels so strong. Paperclips are a terrible surrogate goal because they are **fungible and vulnerable.**

  A functional surrogate goal strategy requires the surrogate to be:
  1.  **Orthogonal:** Uncorrelated with the blackmailer's natural interests.
  2.  **Robust:** Hard for the blackmailer to affect (high cost or impossible).
  3.  **Precommitted:** Baked into your source code before the threat landscape is known.

  ### Summary
  The mechanism doesn't stop the blackmailer from *wanting* to update. It stops them from **successfully executing** the update.

  The infinite regress assumes the blackmailer is omnipotent regarding leverage. The surrogate goal defense works by **reducing the surface area of leverage** available to them. If you switch your values to something they physically/logically/economically cannot touch, their ability to "update and threaten again" hits a hard stop.

  If you can't find a goal that satisfies those constraints, then you are correct: surrogate goals won't save you. The strategy relies entirely on the existence of "safe" variables in the universe that you can care about which are out of the adversary's reach.
