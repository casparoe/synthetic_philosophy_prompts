      *   **Constraint 1:** Do not just summarize the *Letter*.
      *   **Constraint 2:** Avoid strawmen (e.g., "Theater is fun" vs. "Theater is decadent"). Use specific, nuanced arguments from both thinkers.
      *   **Constraint 3:** They must respond to each other, not talk past one another.
      *   **Constraint 4:** No tidy resolution; neither "wins."
