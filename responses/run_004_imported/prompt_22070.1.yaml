answer: |-
  **Setting:** *A crowded salon in Paris, early 1759. The air is thick with smoke and whispers. Denis Diderot holds a copy of Rousseau's newly published* Letter to d'Alembert. *Rousseau stands near the fireplace, looking weary. They have not spoken warmly in months.*

  **Diderot:** Jean-Jacques, I have read your *Letter*. You strike at the very institution that civilizes us. You claim that because a man weeps at a tragedy, he is somehow less capable of charity in the street? That pity is a currency we spend on stage so we need not pay it in life?

  **Rousseau:** Precisely, Denis. In the theater, virtue is all show and no cost. We applaud justice on the boards because we are relieved we need not practice it outside. It is a sterile sentiment that exhausts the soul's natural compassion without demanding any action. We leave the theater satisfied with our own tears, believing we have done our duty by feeling.

  **Diderot:** But you ignore the schooling of the passions. Without art to refine them, men are brutes. The stage holds a mirror to vice and makes it odious; it presents virtue and makes it lovable. If a young man sees a hero sacrifice for the common good, does that not plant a seed? You say sentiment is the root of morality in *Emile*, yet here you sever the root from the soil.

  **Rousseau:** Sentiment must be active, not spectatorial! In Geneva, we do not need actors to tell us who we are. When you introduce a theater, you introduce idleness. It is not just the play; it is the luxury that follows—the costumes, the lights, the time stolen from labor. A republic survives on austerity. You Parisians call it civilization; I call it the gilding of chains.

  **Diderot:** Austerity is for monks, not citizens. Commerce and arts soften manners. You fear the actor because he wears a mask, but is the merchant not wearing a mask when he bargains? Is the courtier not acting when he bows? The actor admits his artifice. In doing so, he reveals a higher truth about human nature that mundane life obscures.

  **Rousseau:** The actor does not merely wear a mask; he sells his person. He makes a trade of his shame. To stand before the public and pretend to be another is to lose oneself. In a healthy state, the citizen should be transparent. If we allow men to be praised for pretending, how can we value truth in the assembly? You confuse the truth of art with the integrity of the soul.

  **Diderot:** Integrity is not incompatable with talent. Consider the actress. You write at length on women in the theater, suggesting their public presence destroys domestic modesty. But if a woman possesses genius, why must she be confined to the hearth? Is her talent not a contribution to the public good? You would silence half the human race to protect a fragile notion of order.

  **Rousseau:** It is not silence I demand, but propriety. When women become public spectacles, the dynamics of desire corrupt the social bond. Men cease to be citizens and become admirers; women cease to be mothers and become idols. The family is the foundation of the state. If you destabilize the domestic sphere with the glare of the footlights, you do not liberate women; you expose them to the tyranny of public opinion.

  **Diderot:** Public opinion is exactly what the theater shapes! It is a tribunal. Comedy ridicules the miser and the hypocrite. Do you think Molière did not make avarice less common? We gather in the dark, yes, but we feel together. That shared emotion creates a bond. We are not isolated; we are a collective audience, breathing as one.

  **Rousseau:** You call it a collective, but look at them. They sit in the dark, silent, passive. They do not speak to one another; they watch a few and do nothing. This is not a bond; it is a narcotic. If you want community, do not build a theater. Build a ring in the public square. Let the people *be* the spectacle. Let them dance, compete, and celebrate in the open air where everyone is seen and no one pays to watch.

  **Diderot:** A festival is fleeting, Jean-Jacques. A play endures. It travels. It teaches those who are not present through the text. You want to return us to the Spartan campfire, but the world is complex now. We need a space to confront the complexities of passion safely. If we banish the poets, as you seem to wish, who will teach us to navigate the storms of the heart?

  **Rousseau:** Nature teaches us, if we listen. You believe art improves upon nature; I believe it corrupts it. You think the theater refines the passions; I say it inflames them only to exhaust them. We are at an impasse, Denis. You seek to make men better by amusing them. I seek to make them better by removing the obstacles that prevent them from being good.

  **Diderot:** Then we shall remain enemies, my friend. For I cannot believe that a world without art is a world without obstacles. I believe it is a world without light.

  **Rousseau:** And I cannot believe that a light which casts shadows on the truth is anything but a fire that burns the house down.
