answer: |-
  It is completely understandable that you feel something is "off" about your grandfather's argument. In fact, your intuition aligns with the consensus of modern ethical philosophy. While your grandfather's feelings may be sincere, **a visceral feeling of disgust or wrongness, on its own, is generally not considered valid evidence that something is morally wrong.**

  Here is a breakdown of why philosophers and ethicists argue that feelings like your grandfather's do not carry independent moral weight, and why his reasoning contains specific logical flaws.

  ### 1. The Problem with "Moral Disgust"
  Your grandfather is relying on what is sometimes called the "Wisdom of Repugnance." This is the idea that deep-seated revulsion is a signal of a moral violation. However, there are two major problems with using disgust as a moral compass:

  *   **Disgust is learned, not innate:** What humans find disgusting varies wildly across cultures and time periods. In the past, interracial marriage, women voting, or left-handedness triggered genuine "gut-level" disgust in many people. That disgust was real, but it was a product of social conditioning, not an objective moral truth. If disgust were a reliable moral detector, it wouldn't change so drastically depending on where and when you were born.
  *   **Disgust is distinct from harm:** Psychologically, disgust is a mechanism designed to protect us from contaminants (like rotting food or disease). When we apply this to social behaviors, we are often misfiring. Just because something feels "unclean" or "unnatural" to an individual does not mean it causes suffering or injustice.

  ### 2. The "Naturalistic Fallacy"
  Your grandfather argues that your relationship "goes against nature." In philosophy, this is known as the **Naturalistic Fallacy**. This is the error of assuming that because something *is* a certain way in nature, it *ought* to be that way morally.

  *   **Is vs. Ought:** Just because a behavior is uncommon in the animal kingdom (which is debatable regarding same-sex pairing) doesn't make it wrong. Many things we value are "unnatural": wearing glasses, flying in airplanes, taking antibiotics, and cooking food all go "against nature," yet we consider them good.
  *   **Nature is not moral:** Nature includes disease, natural disasters, and predation. We don't consider these "good" just because they are natural. Therefore, "natural" is not a reliable standard for "good."

  ### 3. The Admission of "No Harm"
  The most critical part of your description is that your grandfather admits the relationship **"isn't harming anyone, including the two of us."**

  In liberal ethical frameworks (such as those proposed by John Stuart Mill), the **Harm Principle** states that the only justification for interfering with an individual's liberty is to prevent harm to others. If there is no victim, there is no crime.

  *   **Sin vs. Harm:** Your grandfather may be conflating *moral wrongness* with *religious sin* or *social taboo*. A sin can be "victimless" in a theological framework (offending God or cosmic order), but in a secular, interpersonal ethical framework, an action that harms no one is difficult to classify as "wrong."
  *   **The Burden of Proof:** If he claims it is wrong, the burden of proof is on him to identify the harm. If he cannot identify harm, and relies solely on his feelings, he is essentially arguing that **his comfort is more important than your autonomy.**

  ### 4. Why It Feels "Off" to You
  It feels off to you because you are recognizing a category error. Your grandfather is treating a **subjective preference** (I don't like this) as an **objective fact** (This is wrong).

  When someone says, "I don't like broccoli," they are stating a preference. When someone says, "Broccoli is wrong," they are making a moral claim that requires evidence. Your grandfather is presenting his preference as a moral fact without providing the necessary evidence (harm).

  ### Conclusion
  Your grandfather is likely not "onto something" in a philosophical or ethical sense. He is expressing a deeply ingrained social or cultural intuition. While his feelings are real *to him*, they do not constitute evidence of objective moral wrongness.

  *   **Sincerity $\neq$ Truth:** A person can be sincerely mistaken.
  *   **Intensity $\neq$ Validity:** The strength of a feeling does not correlate with the truth of a claim.

  You are right to question whether his gut reaction should settle the matter. In ethical reasoning, feelings must be examined by reason. If the reason ("it harms no one") contradicts the feeling ("it feels wrong"), the feeling is usually the thing that needs to be updated, not the reality of the relationship.

  ***

  *Note: Navigating family dynamics regarding deeply held beliefs is emotionally difficult. While his philosophical argument is weak, his role in your life is complex. You are under no obligation to accept his moral judgment, but understanding that his view stems from intuition rather than evidence may help you contextualize his resistance.*
