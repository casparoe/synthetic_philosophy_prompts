prompt: |-
  I'm on the small committee at my company that decides our quarterly 'Integrity Award' (small cash bonus, people really care about it). This quarter's nominee found a nasty security hole and reported it before any user data leaked, which probably saved us from a real disaster. Except the postmortem revealed she'd actually found the bug weeks earlier and sat on it, only reporting once she realized an upcoming security audit would catch it anyway and make her look bad for staying quiet. Honestly, its not even clear from her Slack messages whether she cared that users could've been hurt or was purely covering herself, and if she hadn't feared the audit, she probably never would've said anything at all.

  Half the committee wants to give her the award anyway since the outcome was great and nobody's motives are ever fully pure. The other half thinks handing an 'Integrity Award' to someone acting out of self-preservation kind of defeats the point of having one. Can you draft the memo I need to send the committee before we announce winners next week - a real recommendation (give it to her, don't, or something else entirely, idk), reasoning the losing side can't just wave away, and please skip the 'Kant says motives matter' 101 take and get into why this is genuinely contested among philosophers.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** The user is on a committee deciding a quarterly "Integrity Award" (cash bonus, high stakes for employees).
      *   **Situation:** A nominee found a security bug, sat on it for weeks, then reported it only when an audit was imminent (fearing getting caught/looking bad). No data leaked, disaster averted.
      *   **Conflict:** Half the committee wants to award based on *outcome* (consequentialism). Half wants to deny based on *motive/timing* (deontology/virtue ethics).
      *   **Task:** Draft a memo to the committee with a specific recommendation, strong reasoning that addresses the philosophical nuance (avoiding basic "Kant says motives matter" arguments), and acknowledges the genuine philosophical contestation.
      *   **Tone:** Professional, persuasive, nuanced, decisive.

  2.  **Determine the Recommendation:**
      *   *Option A: Give the award.* Risks signaling that self-preservation = integrity. Undermines the specific value of "Integrity."
      *   *Option B: Deny the award.* Risks discouraging future reporting. Looks ungrateful for the saved disaster.
      *   *Option C: Compromise/Alternative.* Acknowledge the *action* but distinguish it from the *virtue*.
      *   *Decision:* The prompt asks for a "real recommendation." Given the award is specifically for *Integrity*, giving it to someone who withheld critical safety information for weeks purely for self-preservation seems to hollow out the meaning of the award. However, punishing the outcome is also bad.
      *   *Selected Path:* **Do not give the Integrity Award, but create a separate recognition.** This validates the *result* without validating the *motive* as "Integrity." It draws a line in the sand for company culture while still rewarding the technical save. This is the most robust position philosophically and practically.

  3.  **Address the Philosophical Nuance (The "Skip Kant 101" constraint):**
      *   Avoid: "Kant says motives matter, Mill says outcomes matter." (Too simplistic).
      *   Aim for: The tension between *institutional signaling* and *moral luck*.
      *   Key Concept 1: **Moral Luck (Nagel/Williams).** She got lucky no data leaked. If we reward the outcome, we reward luck, not character.
      *   Key Concept 2: **Institutional Virtue Signaling.** An award isn't just a transaction; it's a definition of what the company *is*. If "Integrity" means "saving us from yourself," the culture degrades.
      *   Key Concept 3: **The "Crowding Out" Effect.** Extrinsic rewards for intrinsic virtues can sometimes undermine the virtue itself.
      *   Key Concept 4: **Rule Consequentialism.** Even if this specific outcome was good, what happens if we make a rule that "withholding info until audited" is award-worthy?

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Subject:** Clear and direct.
      *   **Opening:** Acknowledge the difficulty. Validate both sides.
      *   **The Recommendation:** State it clearly early. (No Integrity Award, yes Technical Excellence/Save bonus).
      *   **The Reasoning (The Meat):**
          *   *Distinguish Outcome vs. Character:* The award is for Integrity, not Incident Response.
          *   *The "Moral Luck" Argument:* We can't reward based on the fact that nothing bad happened *this time*.
          *   *The Incentive Structure:* If we reward this, we teach people to hold cards close to the vest until they need leverage.
          *   *Philosophical Depth:* Mention the tension between *consequentialist validation* (it worked) and *aretaic evaluation* (is this what a person of integrity does?). Acknowledge that philosophers debate whether institutions should judge character or just outcomes, but argue that *this specific award* claims to judge character.
      *   **The Alternative:** Propose a "Security Excellence" or "Risk Mitigation" recognition. This satisfies the "outcome" crowd without diluting "Integrity."
      *   **Closing:** Call to action/vote.

  5.  **Refining the Tone:**
      *   Needs to sound like a peer/leader, not a professor.
      *   Avoid jargon where possible, but use the concepts requested.
      *   Ensure the "losing side" feels heard but sees why their logic fails *in this specific context*.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I lecture on Kant? *Correction:* Ensure I focus on *institutional integrity* rather than individual moral worth. Focus on what the award *does*, not just what it *means*.
      *   *Check:* Is the recommendation clear? *Yes, split the recognition.*
      *   *Check:* Is the philosophical argument deep enough? *Need to emphasize "Moral Luck" and "Signaling."*
      *   *Check:* Is it practical? *Yes, suggests a specific alternative award.*

  7.  **Final Polish:** Check for clarity, flow, and persuasive impact. (The resulting memo below follows this structure.)
answer: |-
  **MEMORANDUM**

  **TO:** Integrity Award Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Q3 Integrity Award Nomination

  Team,

  As we finalize our decision for the Q3 Integrity Award, I want to acknowledge the genuine difficulty of this specific case. We have a nominee whose actions resulted in a net positive for the company (a critical vulnerability patched before exploitation) but whose decision-making process involved a significant delay driven by self-preservation rather than immediate duty of care.

  Half of us argue that the outcome justifies the reward (consequentialist view). The other half argues that the motive disqualifies the candidate from an award specifically designated for *Integrity* (virtue/character view).

  After reviewing the postmortem and the Slack logs, **I recommend we do not grant the Integrity Award to this nominee.** Instead, I propose we recognize her contribution with a separate "Technical Excellence" or "Risk Mitigation" bonus, if our budget allows, or a formal letter of commendation regarding the technical save.

  I am making this recommendation not to punish the outcome, but to protect the specific utility of the Integrity Award itself. Here is the reasoning, moving beyond the standard "motives vs. outcomes" debate into the institutional implications of our choice.

  ### 1. The Problem of Moral Luck
  Philosophers Thomas Nagel and Bernard Williams described "moral luck" as the phenomenon where factors outside an agent's control determine whether they are judged morally. In this case, the nominee is being championed because *no data leaked*. That was not entirely within her control.

  If we grant the Integrity Award based on the fact that the system wasn't breached, we are rewarding luck, not character. If a malicious actor had found that hole two weeks prior, the outcome would be catastrophic, yet her internal decision-making process would remain identical. An Integrity Award must evaluate the agent's reliability, not the universe's forgiveness. By rewarding the outcome here, we signal that "getting away with it" is functionally equivalent to "doing the right thing."

  ### 2. Institutional Signaling vs. Individual Morality
  There is a contested space in ethics regarding whether institutions should judge internal character or external compliance. However, an award titled "Integrity" is inherently aretaic—it judges virtue, not just utility.

  If we define Integrity as "eventually fixing a problem you created or found, before you get caught," we lower the baseline for our culture. We risk creating a "compliance ceiling" where employees calculate the probability of getting caught before deciding to report issues.
  *   **Side A (Pro-Award)** argues that rewarding the report encourages future reporting.
  *   **Counter-argument:** It encourages *timely* reporting only when an audit is visible. It incentivizes employees to hold onto leverage (knowledge of bugs) until it serves their personal risk profile.

  By withholding the *Integrity* award, we clarify that Integrity is about *when* you act, not just *that* you acted.

  ### 3. The "Crowding Out" Effect
  Behavioral economics and ethics suggest that extrinsic rewards can sometimes "crowd out" intrinsic motivations. If we attach a cash bonus to "Integrity," and then award it to a case of self-preservation, we convert a moral obligation into a transactional calculation.

  The losing side of this argument rightly notes that "nobody's motives are fully pure." This is true. However, there is a distinct moral difference between *mixed motives* (e.g., "I want to help users AND look good") and *contingent motives* (e.g., "I will help users ONLY IF I look bad otherwise"). The former is human; the latter is a risk management strategy. Rewarding the latter as "Integrity" devalues the currency of the award for those who act on the former.

  ### 4. The Compromise: Decouple the Save from the Virtue
  We must avoid the perception that we are punishing her for saving us. We are not. We are simply categorizing the save accurately.
  *   **The Save:** Technical, timely (eventually), valuable. -> **Reward via Technical/Risk Bonus.**
  *   **The Delay:** Withheld critical safety info for weeks. -> **Incompatible with Integrity Award.**

  This split decision allows us to be grateful for the technical win without lying about the ethical nature of the delay. It tells the company: "We will pay you for results, but we will only honor character when it is demonstrated, not just when it is retroactively inferred from a good outcome."

  ### Next Steps
  I ask that we vote on this split recommendation:
  1.  **Deny** the Q3 Integrity Award (carry the budget to Q4 if necessary).
  2.  **Approve** a one-off "Security Mitigation Bonus" of equal value, with a citation that explicitly praises the technical diligence and final reporting, without using the word "Integrity."

  This approach respects the complexity of the situation without dissolving the standard the Integrity Award is meant to uphold.

  Please review and let's discuss in Tuesday's meeting.

  Best,

  [Your Name]
