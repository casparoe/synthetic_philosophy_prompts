  ok this is gonna sound like a weird rabbit hole but I need someone smarter than me to help me think it through lol. For my intro to AI elective we watched The Imitation Game and then instead of just talking about "the Turing test" the way literally every article ever does, our teacher made us actually read big chunks of Turing's real 1950 paper. About two thirds of the way through, right after he's done knocking down all the normal objections about souls and machines never being truly creative, there's this whole section where Turing — the same guy famous for the cold, rigorous logic behind cracking Enigma — gets dead serious about ESP. Telepathy, clairvoyance, all of it. He straight up says the statistical evidence for telepathy is "overwhelming," and his fix for the problem it creates is to stick the human and the machine in a "telepathy-proof room" so a psychic contestant can't get an unfair edge that has nothing to do with actual thinking. I genuinely thought I'd opened a parody version of the paper at first.

  I looked into it a bit more on my own and apparently some of the card-guessing studies that counted as solid evidence for this stuff back then got exposed decades later as involving straight-up faked data, well after Turing had already died, so it's not like he couldve known better. Now I can't stop thinking about whether any of this actually matters. Is this a real weak point in his famous argument — like even a genius can build a whole test for "machine thinking" on a shaky foundation — or is it just a weird footnote you could delete from the paper without the rest of the imitation game argument even noticing? Also, was Turing being unusually gullible for a rigorous scientist, or was taking ESP seriously actually pretty normal for smart, careful people back then, which should change how harshly we judge it? Could you write me an actual essay working through this — weigh it properly, but don't just land on "it's complicated," I want you to actually pick a side at the end and back it up.
