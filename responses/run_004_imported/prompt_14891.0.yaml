  For this next one, write a short story that dramatizes Frege's puzzle about identity statements. Quick refresher on the worry: 'a=a' is trivial but 'a=b' can be genuinely informative even when a and b turn out to pick out the exact same thing, which is what pushed Frege to seperate sense from reference in the first place. Don't just hand me Superman/Clark Kent, and don't just reskin Hesperus/Phosphorus or Kripke's Paderewski case with the names swapped out -- invent your own scenario where a character holds two attitudes toward 'the same thing' under different guises, and where this is genuinely rational rather then just the character being careless. Let the story earn its reveal: the ending should make clear why discovering a=b was actually informative, and not just function as a twist for its own sake.
