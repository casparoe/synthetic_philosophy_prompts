      *   *The Pessimist:* Incompatibilist. Says determinism kills responsibility. Strawson thinks this demands an impossible standard of "ultimate responsibility."
      *   *Strawson's Move:* Focus on "reactive attitudes" (resentment, gratitude, indignation). These are constitutive of interpersonal relationships.
      *   *The Exemptions:* We suspend these attitudes for children or the mentally ill (objective attitude).
      *   *The Global Exemption:* The Pessimist wants to suspend them for *everyone* if determinism is true.
      *   *Strawson's Rebuttal:* We *can't* do that. It's psychologically impossible/unthinkable for normal humans. Therefore, the question of "justification" in the face of determinism is idle/empty. Our practices *are* the justification.

  3.  **Identify the Vulnerability (The User's Intuition):**
      *   The user is right to spot a potential is-ought gap. Strawson says: "We can't stop blaming." Conclusion: "So blaming is okay."
      *   Counter: "We can't stop breathing air, but that doesn't mean the air is clean." Or: "Humans have a natural bias toward tribalism; does that make tribalism justified?"
