      *   *Attempt 2 (Focusing on the "Ought"):* The Pessimist asks, "Is it *fair* to blame?" Strawson answers, "We *will* blame." This is a category mistake. Fairness is a moral concept; psychological compulsion is a factual concept. If determinism is true, blame might be a systematic error, like a visual illusion. Just because we can't stop seeing the illusion doesn't make the perception *veridical*.
      *   *Critique 2:* Better. Uses the "illusion" analogy. Needs to emphasize that Strawson redefines "justification" to avoid the hard question.

      *   *Attempt 3 (Refining the "Naturalistic Fallacy" Charge):* Let's structure this as a formal philosophical objection.
          1.  **The Normative Gap:** Distinguish between *inescapability* and *legitimacy*.
