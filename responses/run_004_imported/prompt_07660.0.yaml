          3.  **Moral Progress:** If we justify practices by their inevitability, we block moral progress. (e.g., revenge, tribalism).
          4.  **The "Internal vs. External" Dodge:** Strawson says the justification is internal to the practice. The objection says the Pessimist is questioning the practice *itself*, so internal justification begs the question.

  5.  **Polishing the Argument (incorporating philosophical terminology):**
