answer: |-
  You have hit on exactly the most famous and persistent criticism of Strawson's "Freedom and Resentment." Your intuition is spot-on: many philosophers argue that Strawson substitutes a **psychological description** for a **moral justification**.

  In philosophical terms, you are accusing Strawson of a version of the **Naturalistic Fallacy** (deriving an "ought" from an "is") or, more specifically, conflating **inescapability** with **legitimacy**.

  Here is the strongest version of that objection, structured to help you articulate it in your elective.

  ### The "Normative Gap" Objection

  The core of the objection is that Strawson changes the subject. The Pessimist (the incompatibilist) is asking a **normative** question: *"Is it fair to blame someone who could not have done otherwise?"* Strawson answers with a **descriptive** claim: *"We are psychologically constituted such that we cannot stop blaming them."*

  Here is how to build that into a four-point argument:

  #### 1. Inevitability Does Not Entail Justification
  Just because a human practice is psychologically inevitable does not make it morally rational. Humans have deep-seated, natural cognitive biases.
  *   **Example:** Humans have a natural, almost instinctive tendency toward tribalism or retributive revenge. We might find it psychologically very difficult to view enemies with pure "objective detachment."
  *   **The Point:** If we discovered that our desire for revenge was biologically hardwired and impossible to fully extinguish, that wouldn't make revenge *just*. It would just make it a persistent human flaw.
  *   **Application to Strawson:** If determinism is true, reactive attitudes (resentment, blame) might be like a persistent optical illusion. Just because we *cannot stop* seeing the illusion doesn't mean the image is *real*. Strawson argues we can't drop the attitude; the objector says, "Okay, but if the attitude is based on a false metaphysical premise (that people could have done otherwise), then keeping it is irrational, even if inevitable."

  #### 2. The "Error Theory" Challenge
  This is the metaphysical version of your "is/ought" worry.
  *   **The Premise:** Reactive attitudes inherently contain a cognitive claim. When I feel resentment, I am implicitly judging that you *ought to have done otherwise* and *could have done otherwise*.
  *   **The Determinist Threat:** If determinism is true, the "could have done otherwise" part is false.
  *   **The Objection:** If a belief is false, holding it is an error. Strawson admits we can't stop holding the belief. But **an inevitable error is still an error.**
  *   **The Charge:** Strawson tries to dissolve the problem by saying, "Well, we're going to keep believing it anyway." But the Pessimist replies: "You haven't shown the belief is *true*; you've only shown we are *addicted* to it." By focusing on our addiction to the practice, he dodges the question of whether the practice tracks reality.

  #### 3. Begging the Question (Circularity)
  Strawson argues that the justification for responsibility is **internal** to our social practices. He says we don't need an "external" metaphysical justification.
  *   **The Objection:** This begs the question against the Pessimist. The Pessimist is precisely challenging whether our internal social practices are valid given the metaphysical truth of determinism.
  *   **The Analogy:** Imagine a society that practices slavery. When challenged, the defenders say, "Slavery is baked into our economic and social relationships. We can't imagine our society without it. Therefore, within our framework, it is justified."
  *   **The Point:** You cannot defend a practice from external critique by simply pointing to its internal necessity. If the external critique (determinism) undermines the foundation of the practice, saying "but the practice is important to us" is a deflection, not an argument.

  #### 4. Blocking Moral Progress
  If we accept Strawson's move—that we are justified in whatever reactive attitudes we find ourselves unable to drop—we lose the ability to critique our moral psychology.
  *   **The Argument:** Moral progress often involves overcoming "natural" reactive attitudes. For example, moving from a culture of honor (where insults demand violent resentment) to a culture of law requires suppressing natural reactive attitudes in favor of a more "objective" stance.
  *   **The Charge:** Strawson's framework makes it impossible to say we *ought* to reduce our reliance on blame, even if blame turns out to be metaphysically incoherent. He locks us into our current psychological state and calls it "justification." This turns ethics into anthropology (studying what we *do* rather than what we *should* do).

  ### Summary of the Objection for Your Class
  You can summarize your position like this:

  > "Strawson successfully argues that holding people responsible is **psychologically inescapable** for beings like us. However, he fails to show that it is **normatively justified** if determinism is true. He assumes that because we *must* participate in the practice of blame, the practice must be *valid*. But a practice can be universal and inevitable yet still rest on a false premise. By defining justification as 'what we naturally do,' Strawson protects our practices from critique but leaves the Pessimist's worry untouched: we might just be systematically blaming people based on a metaphysical illusion we can't shake."

  ### A Note on Strawson's Defense (To be prepared)
  If your professor or classmates push back, here is how a Strawsonian would reply (so you can counter-it):

  Strawson would say you are demanding a kind of justification that is **idle**. He argues that "fairness" isn't a metric that exists *outside* of human relationships. To ask "Is blame fair?" is already to participate in the reactive framework. If you step outside that framework (the objective attitude), you aren't asking about fairness anymore; you're just managing behavior. Therefore, there is no "view from nowhere" from which to judge our practices as unfair.

  **Your Counter-Counter:** Even if there is no "view from nowhere," we can still ask if our internal practices are consistent with the truth. If the truth is determinism, and our practices presuppose indeterminism, our practices are internally inconsistent with reality. Strawson prioritizes our psychological comfort over metaphysical consistency.

  ### Verdict
  You are not missing anything. This is the standard Hard Incompatibilist critique (championed by modern philosophers like **Derk Pereboom** and **Galen Strawson**). You have correctly identified that P.F. Strawson attempts to dissolve the metaphysical problem by retreating into human nature, and your objection is that human nature does not settle moral truth.
