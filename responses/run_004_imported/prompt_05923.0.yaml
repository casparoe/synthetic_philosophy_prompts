answer: |-
  Here is a joke designed to walk that line. To a layperson, it's a dry story about a stubborn driver and a clever hitchhiker. To your students, it should highlight the dynamic inconsistency between *act-evaluation* and *disposition-evaluation*.

  ***

  A Causal Decision Theorist and a Golden Retriever are both stranded in the desert. A driver pulls up, looks at them, and says, "I'll only give a ride to someone who will pay me $100 once we reach town. I can tell if you're lying."

  The Golden Retriever wags its tail, jumps in, and rides to town.
  The Decision Theorist stays in the sand.

  Later, the Decision Theorist manages to call the driver on a satellite phone. "Wait!" he says. "I'm rational! I can prove to you that paying you is the logical thing to do!"

  The driver sighs. "Look, I didn't need you to *do* the logical thing. I needed you to *be* the logical thing."

  "But paying you is irrational!" the theorist argues. "Once I'm in town, the ride is already caused. Paying costs me $100 and gains me nothing. Any rational agent would keep the money."

  "Exactly," says the driver. "And that's why I picked up the dog."

  "But the dog doesn't understand money!"

  "Right. The dog is *disposed* to pay. You are *disposed* to calculate. In the desert, it was rational to become the dog. In the car, it was rational to be you. You optimized for the moment of payment, and I optimized for the moment of pickup."

  "So what should I have done?" asks the theorist.

  "You should have hired a hitman to shoot you if you didn't pay me," the driver says. "It's the only way to make your future irrationality credible to your past self."

  "That's expensive!"

  "Cheaper than thirst," says the driver. "Besides, the dog didn't need a hitman. He just needed to be a dog. You tried to be a calculator. In this town, we don't trust calculators. We trust dogs."

  ***

  ### Why this works for your section:

  1.  **The Lay Layer:** On the surface, it's a fable about how overthinking gets you in trouble and loyalty (the dog) beats cleverness. It's accessible enough to wake people up without requiring a whiteboard.
  2.  **The Theory Layer:**
      *   **"Optimized for the moment of payment vs. pickup":** This directly targets the dynamic inconsistency problem (the core of Parfit's argument).
      *   **The Hitman:** This is a direct nod to **Gauthier's Constrained Maximization** (binding oneself to make a threat/promise credible) and the idea of *pre-commitment devices*.
      *   **"Be the logical thing" vs. "Do the logical thing":** This distinguishes between evaluating **dispositions** (FDT/Gauthier) versus evaluating **acts** (CDT).
      *   **The Dog:** Represents an agent whose source code cannot be updated by the arrival in town—a natural "updateless" agent.

  **Delivery Tip:** When you get to the line *"You optimized for the moment of payment, and I optimized for the moment of pickup,"* pause for a second. That is the exact conceptual gap half your class is missing. The joke gives them permission to laugh at the CDT theorist, which might help them let go of the intuition that "of course I'd just pay."
