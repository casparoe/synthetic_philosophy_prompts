answer: |-
  1.  **The Inferential Gap in Bell's Theorem**
      The standard popularization of Bell's theorem is that it forces us to choose between locality and realism, and most physicists choose to drop locality. Your position is that Bell's theorem only rules out *local hidden-variable theories with single, determinate outcomes*. Can you walk us through the precise logical step where the standard inference jumps from "no local hidden variables" to "nonlocality," and where you argue that inference fails?

  2.  **The Sociological Persistence of the "Nonlocality" Gloss**
      Following up on that: if the gap between ruling out local hidden variables and ruling out locality itself is as wide as you suggest, why is the consensus among working physicists so strongly the other way? Is this a case of pedagogical shorthand hardening into dogma, or is there a deeper conceptual reason why physicists find it more natural to abandon Lorentz invariance than to abandon single outcomes?

  3.  **Jarrett Decomposition and Outcome Independence**
      I want to drill down into the technical machinery here. Jon Jarrett decomposed Bell's "local causality" condition into Parameter Independence and Outcome Independence. Everettian mechanics preserves Parameter Independence but violates Outcome Independence. For the audience, could you clarify why violating Outcome Independence allows you to maintain the label of "locality" when you still have correlations between spacelike separated measurements that aren't mediated by a common cause in the past light cone?

  4.  **Locality or Relabeling?**
      To push on that point: if a theory violates Outcome Independence, it implies that what happens here depends on what happens there, even if no signal is sent. Critics argue that calling this "local" is merely semantic—a way to keep the word "local" while giving up the spirit of Einsteinian separation. Is there a physically substantive difference between an Everettian violation of Outcome Independence and a standard nonlocal collapse, or is the distinction purely ontological?

  5.  **Wallace's Concession on Nonseparability**
      David Wallace has conceded that while Everettian dynamics are local, the quantum *states* themselves are nonseparable. Einstein's original worry in the EPR paper wasn't just about signaling; it was about the separability of physical systems. If you admit the state is nonseparable, haven't you already conceded the core of what worried Einstein, regardless of whether the dynamics are local?

  6.  **The Deutsch-Hayden Alternative**
      On the topic of separability: the Deutsch-Hayden interpretation claims to recover full separability by encoding information in local descriptors rather than the global wavefunction. If Deutsch-Hayden can claim separability where Wallace admits nonseparability, does that suggest the Wallace-style defense of locality is conceding too much? Is there a reason to prefer Wallace's nonseparable states over the Deutsch-Hayden formalism?

  7.  **Comparison with Bohmian Mechanics**
      Let's compare the theoretical costs of your strategy against the rivals. Bohmian mechanics saves single outcomes and determinism but pays for it with explicit, dynamical nonlocality. You save locality but pay with branching outcomes. From a theory-choice perspective, why is "many worlds" a cheaper price to pay than "nonlocal dynamics"? What makes ontology more expendable than locality in your view?

  8.  **Comparison with Superdeterminism**
      Another rival response is superdeterminism, which saves locality and single outcomes by rejecting measurement independence. Both superdeterminism and Everettism are often accused of being "unfalsifiable" in different ways. How do you distinguish the theoretical virtue of Everettian locality from the conspiracy of superdeterminism? Is one a structural feature of the physics and the other an ad hoc adjustment?

  9.  **Branching and Preferred Foliation**
      A common technical objection to Everettian locality is that defining a "branching structure" seems to require a global notion of simultaneity to make sense of when splits occur. Does a frame-independent branching structure secretly require a preferred foliation of spacetime? If not, how do you define the branching topology in a way that remains fully Lorentz invariant?

  10. **Empirical Adjudication**
      To close: since Everettian quantum mechanics, Bohmian mechanics, and standard Collapse theories all reproduce the same Bell statistics, they are empirically equivalent regarding these correlations. Given that equivalence, what could actually count as evidence *against* your claim that Everettian mechanics is local? If no experiment can distinguish local branching from nonlocal collapse, is the locality claim a physical hypothesis or a metaphysical stance?
