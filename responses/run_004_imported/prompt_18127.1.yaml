      *   **Key Example:** 5 beds = 1 house.
      *   **Aristotle's Argument:** Exchange requires commensurability (a common substance), but different things *cannot* truly be equal. He treats money as a conventional substitute to make exchange possible.
      *   **Marx's Reading:** Aristotle almost discovered the Labor Theory of Value (LTV) but stopped short.
      *   **Marx's Explanation for the Stop:** Aristotle lived in a slave society where labor was unequal (free vs. slave), so he couldn't conceive of abstract human labor as the common substance.
      *   **Task:** Compare Aristotle's actual argument with Marx's reading. Identify the "gap" Marx sees. Evaluate the convincingness of the "slavery explanation" vs. the charge of projection.

  2.  **Analyze Aristotle's Actual Argument (*Nicomachean Ethics* Book V, Ch. 5):**
      *   *Goal:* Define "Reciprocal Justice" (justice in exchange).
      *   *Problem:* How do you exchange a shoe for a house? They are qualitatively different.
      *   *Solution:* There must be a common measure (*summetron*).
      *   *The Measure:* Need (*chreia*). Money (*nomisma*) represents need.
      *   *The Equation:* 5 beds = 1 house. Why? Because the builder's work and the shoemaker's work need to be proportioned so the community holds together.
      *   *The Limit:* Aristotle explicitly says true equality between such different things is impossible (*to men oun alethos adunaton*). Money is a convention (*nomos*) that makes them commensurable *for the sake of exchange*, not because they share an ontological essence.
      *   *Underlying Logic:* It's about social cohesion and proportionality, not an intrinsic substance like labor time.

  3.  **Analyze Marx's Reading (*Capital* Vol. 1, Chapter 1, Section 3 or Appendix?):**
      *   *Location:* Usually found in Chapter 1, Section 3 (The Form of Value) or the Appendix on the Value Form. (Actually, it's most famously in Chapter 1, Section 3, footnote or main text depending on edition, but specifically the discussion of the "Elementary Form of Value").
      *   *Marx's Claim:* Aristotle saw that value expression requires equality. He saw that without equality, no exchange.
      *   *The "Genius":* He recognized the need for a common substance.
      *   *The "Failure":* He couldn't identify *what* that substance is. He stopped at "need."
      *   *The Reason:* Historical materialism. Greek society was based on inequality of labor (slave vs. free). The concept of "abstract human labor" (labor stripped of specific characteristics and reduced to mere expenditure of human energy) requires a society where all labor is formally equal (bourgeois commodity society).
      *   *Marx's Quote:* "The genius of Aristotle shines in this alone... But he could not extract from the form of value... that in the form of commodity values, all labour is expressed as equal human labour."

  4.  **Compare the Two (The "Gap"):**
      *   *Aristotle:* Commensurability is functional/conventional. Rooted in *need*. Money bridges the gap. Ontological equality is impossible.
      *   *Marx:* Commensurability is ontological/real. Rooted in *abstract labor*. Money reveals the gap (value form). Ontological equality is real (in capitalism).
      *   *The Gap:* Aristotle asks "How can we exchange?" (Practical/Social). Marx asks "What makes exchange possible?" (Metaphysical/Economic). Marx thinks the answer is Labor. Aristotle thinks the answer is Need/Money.
      *   *Marx's specific critique:* Aristotle lacked the concept of *value* as distinct from *use-value*. He conflated the two or saw money as just a tool, not a representation of social labor time.

  5.  **Evaluate the "Slavery Explanation":**
      *   *Marx's Argument:* If labor is done by slaves, it's not "free" labor. If labor is caste-based, it's not "equal." Therefore, the secret of value (abstract labor) remains hidden.
      *   *Counter-arguments (Modern Scholarship):*
          *   *Anachronism:* Aristotle wasn't trying to find a "substance of value." He was doing ethics, not economics. He was asking about *justice*, not price determination.
          *   *Need vs. Labor:* Aristotle explicitly says *need* holds the city together, not labor. Money measures need.
          *   *Slave Labor:* Did Greeks really see slave labor as fundamentally different in *kind* of effort? Maybe, but they also had free artisans. The barrier might be philosophical (qualitative difference of goods) rather than sociological (status of workers).
          *   *Projection:* Marx needs a precursor to validate his theory. Finding the "almost" moment makes the LTV seem like a discovered truth rather than a constructed theory. It fits his Hegelian dialectic (history moving toward a realization).
      *   *Verdict:* It's partially convincing sociologically (concept of equality is historically specific) but largely projection philosophically (Aristotle wasn't looking for what Marx was looking for).

  6.  **Drafting the Response:**
