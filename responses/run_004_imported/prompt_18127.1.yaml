      *   *Aristotle's Actual Argument:* Focus on *Reciprocal Justice*, *Need (chreia)*, and *Convention (nomos)*. Emphasize he denies ontological equality.
      *   *Marx's Reading:* Focus on the "Common Substance," the "Genius," and the "Historical Limit." Explain Abstract Labor.
      *   *The Gap:* Define it clearly. Aristotle = Practical/Conventional equality. Marx = Ontological/Real equality via Labor.
      *   *Evaluating the Slavery Thesis:*
          *   *Strengths:* Historical specificity of concepts. Equality of labor *is* a bourgeois notion.
          *   *Weaknesses:* Anachronism. Aristotle's focus was ethics, not value theory. "Need" is a coherent alternative, not just a failure.
          *   *Projection:* Yes, Marx is constructing a lineage.
      *   *Conclusion:* Summarize. Marx is right about the historical specificity of concepts, wrong about Aristotle's intent.

  7.  **Refining the Nuance (Self-Correction during drafting):**
      *   *Check:* Did Aristotle say 5 beds = 1 house? Yes, roughly.
