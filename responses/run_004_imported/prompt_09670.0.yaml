answer: |-
  Here are 10 interview questions designed to probe the structural weaknesses of the "equal moral standing" account of hypocrisy, including the specific angles you requested. Each includes a follow-up tailored to the defense she is most likely to offer.

  **1. The Mechanism of Exemption**
  "Let's start with the core of your view. You argue that hypocrites lose the standing to blame because, in blaming, they implicitly deny the equal moral standing of the person they're blaming—they've carved out an exception for themselves. But I want to press on the *mechanism* here. Is the loss of standing triggered by the *act* of blaming while flawed, or is it a feature of the *disposition* of the blamer? In other words, do I lose standing the moment I speak, or did I lose it the moment I decided the rule didn't apply to me?"

  *   **Follow-up:** If she says it's the *disposition* (the prior exemption), ask: "Then why does the timing matter? If I secretly exempted myself but haven't blamed anyone yet, do I already lack standing? If so, standing seems to be about my internal moral coherence, not my relational equality with others."

  **2. The "Hypercrite" Challenge**
  "I want to test whether your theory is really tracking self-exemption or just tracking inequality generally. Consider the 'Hypercrite': someone who holds themselves to a *stricter* standard than they hold others. They blame others for being late, but if they are late, they castigate themselves far more severely than they ever would anyone else. They aren't exempting themselves; they're penalizing themselves *more*. On your account, they haven't denied equal standing—they've arguably elevated the other person's standing above their own. Do they retain the standing to blame?"

  *   **Follow-up:** If she says "Yes, they retain standing," ask: "That feels counterintuitive. We usually think someone that unstable or self-flagellating is *less* fit to blame, not more. If your theory grants them standing when our intuitions say they're unfit, is your theory capturing 'standing' or just 'logical permission'?"

  **3. The Epistemic Condition**
  "Let's talk about knowledge. For a person to lose standing on your view, do they need to *know* or *believe* that they share the fault they're blaming? Or is it enough that they *actually* share the fault, even if they are unaware of it? If I blame you for lying, but I unknowingly lied last week, have I exempted myself?"

  *   **Follow-up:** If she says "They need to know" (because exemption is an attitude), ask: "Doesn't that shift the theory away from 'equality' and toward 'sincerity'? If I unknowingly violate the norm, I'm still treating us unequally in practice, but you're saying my standing is intact. That suggests the problem isn't the inequality, but the dishonesty."

  **4. The Skepticism Worry (Implicit Bias)**
  "Here's the worry that keeps me up at night. Psychological research suggests almost everyone has some inconsistent moral weighting—in-group biases, blind spots, or minor inconsistencies we haven't scrutinized. If any self-exemption cancels standing, does your account imply that almost nobody has the standing to blame anybody for anything serious? Are we committed to a near-total skepticism about blame?"

  *   **Follow-up:** If she says "No, there's a threshold of relevance," ask: "Who sets that threshold? If it's not objective, doesn't that allow the blamer to arbitrarily decide their own flaws are 'below the threshold' while the blamee's are 'above it'? That looks like the very self-exemption you're trying to police."

  **5. Restoring Standing**
  "Suppose I lose my standing because I've been exempting myself from a norm. Can I earn that standing back? And if so, how? Do I just need to confess, or do I need a period of flawless compliance? I ask because if I can earn it back through a 'track record' of compliance, that sounds less like restoring equality and more like rebuilding credibility."

  *   **Follow-up:** If she says "Yes, through recommitment to the norm," ask: "But if I recommit, I was already equal in moral status—I'm a person, you're a person. That status doesn't fluctuate. If standing *does* fluctuate, doesn't that prove standing isn't about 'equal moral standing' at all, but rather about moral *credit* or *authority*?"

  **6. Public vs. Private Blame**
  "Your account focuses on the relational dynamic of blaming. But does standing apply to private blame? If I silently judge my friend for bailing on plans, even though I did the same last month, have I violated their equal standing? They never hear the blame, so the 'denial' of their equality isn't communicated. Does the standing norm only kick in when I speak?"

  *   **Follow-up:** If she says "It applies even privately," ask: "Then standing is entirely internal. But if it's internal, why do we care about the 'Tu Quoque' in public arguments? We shouldn't care that the blamer is a hypocrite, only that *we* are internally consistent. That seems to dissolve the social function of the standing objection."

  **7. Deflection vs. Standing**
  "My friend Dana argues that pointing out hypocrisy is just a deflection fallacy—it doesn't matter who says it, only that it's true. You argue it matters *who* says it. But where is the line? If Marcus bails on plans, and I call him out, but I also bail on plans, is my blame *false*? Or is it *true but unauthorized*? I worry that 'unauthorized' is just a polite way of saying 'I don't have to listen to you,' which validates Dana's deflection worry."

  *   **Follow-up:** If she says "The blame is true but unauthorized," ask: "What work is 'unauthorized' doing then? If the moral claim is true, and the norm is valid, what practical difference does it make if I lack standing? If the answer is 'you don't have to listen,' aren't we just saying hypocrisy gives the blamee a shield against accountability?"

  **8. The Function of Blame**
  "To step back, what do you think blame is *for*? Is it to correct behavior, to express values, or to enforce norms? I ask because if blame is about correcting behavior, the hypocrite might actually be the *best* person to blame—they know exactly how hard it is to follow the norm. If your theory removes them from the equation, are we losing a valuable tool for moral repair?"

  *   **Follow-up:** If she says "Blame is about expressing values/authority," ask: "But if the hypocrite expresses the value correctly, why does their history mute that expression? A broken clock is right twice a day. If a hypocrite identifies a real wrong, why is their voice silenced rather than just discounted?"

  **9. Rival Accounts**
  "There are rival theories in the literature, like the 'Credit Account'—you need moral credit to spend on blaming. Or the 'Authority Account'—you need a specific role to enforce norms. Your account is the 'Equality Account.' What is the specific explanatory power of 'Equality' that 'Credit' or 'Authority' can't capture? Why is equality the right lens?"

  *   **Follow-up:** If she says "Equality explains the resentment we feel," ask: "But don't we also resent people who have 'spent their credit' even if they treat us equally? If the Credit account predicts the same intuitions without the metaphysical baggage of 'denying equal standing,' why prefer your account?"

  **10. Falsification**
  "Finally, I want to ask about the limits of the theory. Philosophers often patch theories to handle counterexamples. So, I want to ask: What kind of case would actually make you abandon the equality account for a rival theory? Is there a specific thought experiment or real-world scenario where, if your theory yielded Result X, you would say, 'Okay, the equality account is wrong'?"

  *   **Follow-up:** If she struggles or offers a vague answer, ask: "If there's no case that would falsify it, does that suggest the theory is functioning as a definition rather than an empirical claim about how moral standing works? And if it's just a definition, can it really settle the argument between me and my friend about whether Marcus gets to call out Dana?"
