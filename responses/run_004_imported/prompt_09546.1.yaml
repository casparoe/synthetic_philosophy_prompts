      *   *Key Insight:* It's not just about *making* a deal; it's about the *credibility* of the commitment. To be credible, the commitment must be hard to reverse. To win, it must be early.

  3.  **Deconstruct Core Concept 2: Reasoning as Commitment (UDT/Logical Correlation):**
      *   *Standard View:* Thinking is neutral. I gather info, then decide.
      *   *AI/Decision Theory View:* If two agents are similar (e.g., both run similar code or are rational in the same way), my reasoning process might be *predictable* by the other.
      *   *The Trap:* If I reason "I should accept a 60/40 split because it's better than war," and the other agent *simulates* or *predicts* my reasoning, they know they can push me to 60/40. They don't need me to say it; they just need to know my algorithm outputs it.
      *   *Updateless Decision Theory (UDT):* Roughly, choose the policy *before* you get specific information that might tempt you into a suboptimal equilibrium. If you update on "I am in a negotiation," you might become exploitable.
      *   *Simplified:* Your "source code" is your commitment. If the other agent can read your source code (or predict it), your internal deliberation is visible. Hiding your thoughts is hard for digital agents.

  4.  **Structure the Response:**
