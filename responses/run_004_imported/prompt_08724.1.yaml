      *   *Option 2: 100% to Campaigns.* Too risky for a giving circle that likely values evidence. Ignores the "duty to donors" argument.
      *   *Option 3: A Split.* This is usually the best compromise in deadlocked committees. It acknowledges the strength of evidence for bednets while hedging against the "cluelessness" critique by investing in systemic change.
      *   *Decision:* Recommend a split. It respects the "verifiability" constraint (by funding the verified option) while acknowledging the philosophical limit of that verifiability (by funding the systemic option). A 70/30 or 60/40 split seems reasonable. Let's aim for a **$120k / $60k split (2/3 to Bednets, 1/3 to Campaigns)**. This prioritizes the majority view without silencing the minority.

