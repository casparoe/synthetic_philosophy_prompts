answer: |-
  To the Members of the Effective Altruism Club,

  The concept of "moral trade," as popularized by Toby Ord and other proponents of the "expected choice-worthiness" framework, offers an enticing proposition: if we are morally uncertain, we should hedge our bets by trading concessions with those who hold different moral credences. The idea is that by each sacrificing a small amount of what our primary moral theory values most in exchange for the other person doing the same, we can maximize our *expected* moral value.

  However, there is a fundamental structural flaw in this proposal. Moral trade is not well-defined as a form of mutually beneficial exchange because it presupposes the possibility of **intertheoretic value comparisons**—comparisons of magnitude between rival moral theories—which are metaphysically and mathematically untenable. Without a non-arbitrary way to normalize value scales across theories, we cannot calculate the exchange rates required to make a trade, nor can we determine if the trade actually leaves us "better off."

  Here is the argument for why moral trade collapses under the weight of the intertheoretic comparison problem, and why merely ordinal rankings cannot rescue it.

  ### 1. The Prerequisite of a Common Currency
  For moral trade to function as Ord describes, an agent must be able to calculate the **Expected Moral Value (EMV)** of an action. If I am 60% credentialed in Utilitarianism (T1) and 40% in Deontology (T2), I am supposed to choose the action that maximizes:
  $$ (0.6 \times \text{Value}_{T1}) + (0.4 \times \text{Value}_{T2}) $$

  To perform this addition, $\text{Value}_{T1}$ and $\text{Value}_{T2}$ must be expressed in compatible units. If T1 measures value in "hedonic units" and T2 measures value in "rights fulfilled," adding them is like adding meters to kilograms.

  In a moral trade, Agent A (mostly T1) and Agent B (mostly T2) agree to swap actions. To agree on the *terms* (e.g., "I will donate \$100 to your cause if you donate \$50 to mine"), they must determine the **marginal rate of substitution** between T1-value and T2-value. They need to know how many units of T1-value are equivalent to one unit of T2-value. Without this exchange rate, there is no way to ensure the trade is mutually beneficial; one party might be giving up vastly more moral value than they are receiving, even if both parties *think* they are hedging effectively.

  ### 2. The Problem of Zero Points and Unit Sizes
  The objection is not merely that different theories value different *things*; it is that they define the *scale* of value differently. In measurement theory, to compare two scales, you need to know two things:
  1.  **The Zero Point:** Where does "no value" lie?
  2.  **The Unit Size:** What constitutes a single unit of value?

  In physics, we can compare Celsius and Fahrenheit because we have independent access to the physical reality (thermal energy) they are measuring. In ethics, we have no access to "moral reality" independent of the theories themselves.
  *   **Zero Point:** For a negative utilitarian, the absence of suffering might be the zero point, but for a classical utilitarian, a neutral state of pleasure/pain is zero. For a deontologist, a rights violation might be "negative infinity," which breaks any linear calculation.
  *   **Unit Size:** Even if both theories are consequentialist, one might view the prevention of a death as 1,000 units of value, while another views it as 1 unit. There is no "moral meter stick" to check which theory is scaling its units correctly.

  Because we cannot non-arbitrarily fix the zero point or the unit size across theories, any attempt to calculate an exchange rate is fundamentally arbitrary.

  ### 3. Why Ordinal Rankings Cannot Rescue the Idea
  You asked whether a merely **ordinal** ranking of outcomes within each theory could save moral trade. That is, if Theory T1 simply ranks Outcome X > Outcome Y, and Theory T2 ranks Outcome Z > Outcome W, can we trade?

  The answer is **no**. Ordinal preferences are insufficient for trade for two reasons:

  **A. Trade Requires Margins, Not Just Rankings**
  To strike a deal, I need to know *how much* of my preferred outcome I am willing to sacrifice for *how much* of yours.
  *   *Ordinal:* I prefer Saving a Life (A) to Curing a Headache (B).
  *   *Ordinal:* You prefer Curing a Headache (B) to Saving a Life (A).
  *   *Trade:* If I give up one "Life Saved" to get you to cure 1,000 headaches, is that a good deal?

  Ordinal rankings tell us the direction of preference, but not the **intensity**. To calculate an exchange rate, we need **cardinal** utility. We need to know if Saving a Life is *10 times* better than Curing a Headache, or *1,000,000 times* better. Without cardinality, we cannot determine the terms of trade that yield a net benefit.

  **B. Expected Utility Requires Cardinality**
  Moral trade is predicated on maximizing *Expected* Moral Value. Standard decision theory (von Neumann-Morgenstern) demonstrates that you cannot maximize expected utility with only ordinal preferences. You need cardinal utility to weigh probabilities against magnitudes. Since moral trade relies on weighing moral credences (probabilities) against moral value (magnitudes), it inherently demands cardinal intertheoretic comparisons. If we only have ordinal rankings within theories, the very calculation of "expected choice-worthiness" becomes mathematically impossible.

  ### 4. The Failure of Normalization Proposals
  Proponents of moral trade, including Ord, are aware of this problem. They often propose **normalization strategies**, such as "variance normalization" (scaling each theory so its variance in value across options is equal).

  However, these solutions are arbitrary:
  *   **Why Variance?** Why should a moral theory that is passionate about a few specific issues (high variance) be scaled down to match a theory that is mildly concerned about everything (low variance)? This penalizes moral intensity.
  *   **Why Range?** Alternatively, scaling by the range (max minus min value) is equally arbitrary. It depends entirely on the set of options currently being considered, meaning the "value" of a theory changes depending on what choices are on the table.

  Because there is no non-arbitrary way to choose a normalization method, the resulting exchange rates are not discoveries of moral fact; they are artifacts of the chosen mathematical convention. If the terms of the trade depend on an arbitrary convention, the claim that the trade is "mutually beneficial" loses its objective force.

  ### 5. Conclusion: Compromise, Not Trade
  For your EA club discussions, the distinction is vital. If intertheoretic comparisons are impossible, then **moral trade is not actually trade.**

  In economic trade, both parties gain value *by their own independent metrics*. In "moral trade," because the metrics themselves cannot be compared or normalized without arbitrariness, the agents are not truly calculating a gain. They are engaging in a **compromise** based on a shared agreement to ignore the incommensurability of their views.

  While compromise is socially valuable, it should not be confused with the efficiency gains of trade. Arguing that moral trade "hedges against uncertainty" implies we are optimizing against a single, unified landscape of moral value. But if the landscape is fragmented into incommensurable theories, there is no single peak to hedge toward.

  Therefore, moral trade is not well-defined. It requires cardinal, intertheoretic comparisons to establish exchange rates, and no one has supplied a non-arbitrary way to make such comparisons. Without that, the "benefit" of the trade is an illusion created by forcing incompatible moral currencies into a single spreadsheet.
