answer: |-
  This is one of the most famous and enduring objections to Rawls's *A Theory of Justice*, originally formulated by John Harsanyi. The argument is often called the **Harsanyi-Rawls debate**.

  Your premise is correct: Harsanyi argued that if you model the Original Position (OP) using standard Bayesian decision theory (assigning equal probability to ending up in any social position), rational agents would maximize average utility, not follow the maximin rule. He concluded that Rawls's derivation of the Difference Principle relies on smuggling in an extreme, irrational degree of risk aversion.

  However, political philosophers continue to treat the Original Position as a genuine alternative to utilitarianism for several robust reasons. They do not accept the reduction of the OP to a standard decision-theoretic problem. Here is why the Rawlsian framework resists being collapsed into "utilitarianism with high risk aversion."

  ### 1. The Original Position is a Device of Representation, Not a Decision Problem
  The most fundamental defense Rawls offers (particularly in later clarifications) is that the Original Position is not meant to be a literal model of rational choice under uncertainty. It is a **device of representation** designed to model specific moral constraints.

  *   **Utilitarianism** models the choice as: "What rule maximizes the sum of welfare?"
  *   **Rawls** models the choice as: "What rule would free and equal persons agree to under conditions that ensure impartiality?"

  When Rawls introduces the Veil of Ignorance, he is not trying to simulate a state of probabilistic uncertainty where one *could* calculate odds. He is trying to filter out morally irrelevant information (like class, race, talent) to ensure the principles chosen are fair. Therefore, applying Expected Utility Theory (EUT) to the OP is a category error. The parties are not gamblers; they are trustees of moral persons. The "risk aversion" is not a psychological trait of the parties, but a structural feature of the moral situation: when deciding on constitutional essentials, it is unreasonable to gamble with basic liberties.

  ### 2. The Distinction Between Risk and Uncertainty
  Rawls explicitly argues that the conditions necessary for applying the maximin rule (and for rejecting EUT) are met in the OP, whereas Harsanyi assumes they are not. Rawls identifies three features that make maximin rational in this specific context:

  1.  **No Objective Probabilities:** The Veil of Ignorance is thick. The parties have no basis for assigning probabilities to their potential social status. Without objective probabilities, the Principle of Insufficient Reason (assigning equal probability to all outcomes), which Harsanyi relies on, is arbitrary.
  2.  **The Stakes are Fundamental:** In standard gambling, you can lose money and play again. In the OP, the choice concerns the "basic structure of society." A bad outcome means a life of crushing oppression or destitution. When the downside is unacceptable (a life not worth living), rational agents do not maximize averages; they secure the floor.
  3.  **Alternatives are Acceptable:** The Difference Principle guarantees a social minimum that is compatible with self-respect. Since the "guaranteed minimum" is acceptable, there is no incentive to gamble for a higher average that might leave some below that minimum.

  Philosophers who defend Rawls argue that Harsanyi treats the stakes as utility units (which can be averaged), whereas Rawls treats them as **life prospects**. Risk aversion is not "idiosyncratic" here; it is rational given the gravity of the decision.

  ### 3. The Currency of Justice: Primary Goods vs. Utility
  Even if one accepts the decision-theoretic framing, the *metric* of the calculation differs fundamentally.

  *   **Utilitarianism** maximizes the satisfaction of preferences or happiness (utility).
  *   **Rawls** maximizes an index of **Primary Goods** (rights, liberties, opportunities, income, wealth, and the social bases of self-respect).

  This is crucial. A utilitarian calculation might justify slavery or the suppression of a minority if it sufficiently boosts the aggregate happiness of the majority. A maximin calculation over *primary goods* (specifically the First Principle of Liberty) forbids this absolutely. The parties in the OP prioritize basic liberty before they even get to the Difference Principle (economic distribution).

  Therefore, the OP yields a **lexical priority of liberty** that utilitarianism cannot accommodate, regardless of risk preferences. You cannot trade away the freedom of the worst-off to improve their economic standing, nor can you trade their freedom to improve the average welfare. This structural priority makes the theory qualitatively different from utilitarianism, not just a quantitative variation.

  ### 4. The Separateness of Persons
  This is the deepest philosophical objection to the "Rawls is just a utilitarian" claim. Robert Nozick and others highlighted that utilitarianism extends the rational principle of choice for *one person* (sacrificing a present pleasure for a greater future gain) to *society as a whole* (sacrificing one person's welfare for the greater aggregate).

  Rawls argues this fails to respect the **separateness of persons**.
  *   **Utilitarianism:** Treats society as a single super-person. Losses to A can be compensated by gains to B.
  *   **Rawls:** Treats society as a fair system of cooperation between distinct individuals. Losses to A cannot be simply offset by gains to B; A must be able to accept the arrangement.

  The maximin rule in the OP is a procedural way of embodying this moral insight. It ensures that social cooperation is reciprocal. If the arrangement doesn't benefit the worst-off, they have no reason to consent to it. This is a deontological constraint on aggregation, not a utilitarian calculation.

  ### 5. Stability and the Strains of Commitment
  Rawls argues that a conception of justice must be stable. It must generate its own support.
  *   **Utilitarianism:** Might demand that the worst-off accept severe deprivation for the greater good. Rawls argues this places excessive "strains of commitment" on them. It is psychologically and morally unrealistic to expect people to willingly accept a system that sacrifices them for the aggregate.
  *   **Difference Principle:** Ensures that everyone benefits from social cooperation. Because the worst-off do as well as possible, they can willingly endorse the system.

  Philosophers treat this as a genuine alternative because it addresses the **sociological and psychological feasibility** of justice, which pure utilitarian calculus often ignores.

  ### Summary
  Philosophers continue to treat the Original Position as a genuine alternative to utilitarianism because they accept Rawls's contention that **justice is not merely rational choice under uncertainty.**

  If you view the OP strictly through the lens of neoclassical economics (as Harsanyi did), Rawls does look like he is stipulating extreme risk aversion. But if you view the OP through the lens of **Kantian constructivism** (as Rawls intended), the "risk aversion" is actually a proxy for **moral caution** regarding the inviolability of persons.

  The debate persists not because the math is unresolved, but because the two sides disagree on the pre-theoretical moral question: **Is society a scheme for maximizing aggregate welfare, or a fair system of cooperation among free and equal persons?** Rawls's argument is that the Original Position models the latter, and that model simply cannot be reduced to the mathematics of the former.

