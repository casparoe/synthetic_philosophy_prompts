answer: |-
  The carcass lay on the stone floor of the tribunal, the smell of iron and opened bowels cutting through the scent of sandalwood incense. It was a large beast, horned and broad-shouldered, its hide already cooling in the drafty hall.

  To the left stood Acharya Rudra, his white dhoti stark against the dark pillars, the sacred thread heavy on his chest. To the right sat Bhadanta Sthiramati, the Buddhist logician, shaved head gleaming, his eyes sharp as flint. Between them, on a raised dais, King Nripatindra rubbed his temples.

  "The law is clear," the King said, his voice tired. "To kill a *Gavaya* is the right of the Kshatriya. To kill a cow is a mortal sin. This beast looks like both. The hunter claims he knew it was a *Gavaya*. The priests claim he murdered a sacred cow. Acharya, if your school of Nyaya cannot prove how a man *knows* the difference, the hunter dies for sacrilege."

  Rudra stepped forward. "Maharaj, the hunter was taught by a forester. The forester said, 'A *Gavaya* is like a cow.' The hunter went to the forest. He saw the beast. He recognized the similarity. He knew. This is *Upamana*—comparison. It is a valid means of knowledge, a *pramana*, distinct from sight or speech."

  Sthiramati laughed softly. It was a dry sound, like leaves scraping stone. "A convenient magic, Acharya. You invent a new sense organ every time language gets fuzzy."

  "It is not magic," Rudra snapped. "It is how the world functions."

  "Is it?" Sthiramati stood, smoothing his robes. "Let us dissect this 'knowledge.' The forester spoke words. That is *Shabda*—testimony. The hunter saw the animal. That is *Pratyaksha*—perception. Where is this third thing you call *Upamana*? Show it to me."

  "The cognition arises from the relation of similarity!"

  "Relation is a concept," Sthiramati countered, pacing the floor near the dead beast. "Not a reality. Listen closely, King. The hunter heard the word 'cow.' He has a memory of a cow. He heard the word 'Gavaya.' He has no memory of a Gavaya. The forester linked them with 'like.' When the hunter sees the beast, he perceives horns, hump, hide. He recalls the memory of the cow. He notes the similarity. He concludes, 'This is the thing called Gavaya.' This is inference (*Anumana*). It is perception plus memory. Why clutter the universe with a separate category for 'guessing based on description'?"

  Rudra felt the sweat prickle under his arms. This was the old fight. The Buddhists wanted to strip the world down to bare particulars—only this moment, only this shape. They denied the reality of universals, of categories, of the glue that held language to the world.

  "Because," Rudra said, forcing his voice steady, "Inference requires a universal connection. 'Where there is smoke, there is fire.' But here? There is no universal law that 'All cow-like beasts in the forest are Gavayas.' There is only the knowledge of the name arising from the knowledge of the similarity. It is a unique event. If you reduce it to inference, you destroy the foundation of learning."

  "Learning?" Sthiramati stopped before the King. "Maharaj, if *Upamana* is valid, then any vague description becomes truth. A man is told a thief 'looks like a merchant.' He sees a merchant in the market. He kills him, claiming *Upamana* told him it was the thief. Is this valid knowledge? Or is it negligence?"

  The King shifted. The hunter, bound in the corner, flinched.

  Rudra stepped toward the carcass. "You confuse valid comparison with careless perception. *Upamana* requires the grasp of the similarity *as the means* to the knowledge of the name. The hunter did not just see a cow. He saw the *difference* within the similarity. The wild stance. The specific curve of the horn. The cognition 'This is that Gavaya' flashed in his mind. It was not a guess. It was a recognition."

  "Recognition is memory," Sthiramati shot back. "And memory is fallible. Acharya, you defend this because your Vedas rely on it. 'The Soma plant is like the sun.' 'The soul is like a light.' If *Upamana* collapses, your rituals are built on metaphors, not facts. You cannot sacrifice a 'sun-like' plant if you cannot prove you hold the right one."

  The stakes hung in the air, heavier than the smell of blood. If Rudra lost, the Nyaya school lost its epistemological grip on the Vedic ritual order. The King, leaning toward the Buddhist sangha for administrative reform, would have license to declare Vedic identifications as mere poetry, not law.

  "The hunter's life hangs on this," Rudra said quietly. "If *Upamana* is not real, then he could not have known. If he could not know, he acted in ignorance. If he acted in ignorance, he is guilty of killing a sacred beast, for he should have waited until he had absolute certainty."

  "And if *Upamana* is real?" Sthiramati asked.

  "Then he possessed valid knowledge. He knew it was wild game. He is innocent."

  Sthiramati looked at the dead beast, then at Rudra. For a moment, the rivalry faded, replaced by the shared burden of the logic. "You argue for utility," Sthiramati said. "I argue for precision. If we allow 'comparison' as a proof, we allow ambiguity into the court. If we deny it, we paralyze action, for no man can perceive every new thing without a prior category."

  "Exactly," Rudra said. "We live in a world of new things. We must name them to survive. If I tell my son, 'Poison looks like honey,' and he sees a viscous yellow liquid, he does not need to taste it to infer danger. He recognizes the quality. Is that not knowledge?"

  "It is," Sthiramati conceded, "but it is knowledge of *danger*, not knowledge of *essence*. He knows to avoid it. He does not know if it is truly honey or poison until he tests it. The hunter did not test the beast. He relied on the forester's words."

  "The forester is an authority," Rudra said.

  "Authorities lie. Or they speak poorly," Sthiramati retorted. "What if the forester said, 'A Gavaya is like a buffalo'? Would the hunter have shot a buffalo? Your *Upamana* depends entirely on the quality of the initial testimony. It is not an independent proof. It is a child of Testimony (*Shabda*)."

  Rudra paused. This was the strongest point. If *Upamana* relied on the forester's words, it was reducible to Testimony.

  "It is not the child," Rudra said, finding the thread. "It is the marriage. Testimony gives the link. Perception gives the object. But the *cognition*—the flash of understanding—is born of neither alone. It is born of the *relation*. You can have all the words in the world, Sthiramati. You can describe a mango to a blind man for a lifetime. But the moment he sees one, the knowledge 'This is a mango' arises. That moment is not the words. It is not just the sight. It is the fitting of the name to the form. That fitting is *Upamana*."

  Sthiramati was silent for a long moment. He looked at the King. "Maharaj. The Acharya argues for the moment of understanding. I argue for the chain of causality. If the chain is broken, the knowledge is false."

  The King stood. He walked down from the dais and stood over the carcass. He ran a hand over the coarse hide.

  "I have never seen a *Gavaya*," the King said.

  Rudra's heart stopped.

  "But," the King continued, "I have seen cows. I have seen buffaloes. When I look at this, I do not see a cow. I see something that wears the shape of a cow but carries the wildness of the forest. I feel I know it." He turned to Rudra. "Is that feeling proof?"

  "It is the fruit of *Upamana*," Rudra said. "It is the valid cognition."

  "And if I am wrong?" the King asked. "If this is a sacred cow from a distant herd that wandered here?"

  "Then your cognition was flawed," Sthiramati said. "But the *method* remains flawed too. You cannot build law on 'feelings of knowing.'"

  "Law is built on the best available knowledge," Rudra countered. "We do not live in a world of perfect perception. We live in a world of signs. If you deny the validity of reading signs through comparison, you deny the possibility of navigating the unknown. You ask the hunter to never shoot until he has raised the beast from a calf. By then, it is too late."

  The King looked from the scholar to the monk. The court held its breath. The philosophical abstraction had curdled into the reality of the rope around the hunter's neck.

  "The Buddhists seek to cut away the superfluous," the King said finally. "They say if a thing can be explained by two causes, do not invent a third. If Testimony and Perception explain the hunter's act, why keep Comparison?"

  "Because," Rudra said, his voice dropping to a whisper that carried in the silence, "Testimony tells you *what to look for*. Perception tells you *what is there*. Only Comparison tells you *that they are the same*. Without it, Maharaj, your own recognition of your father in his portrait is an illusion. Without it, the map is not the territory, and you can never cross the distance between them."

  Sthiramati bowed his head slightly. It was a concession. The gap between the word and the thing was the fundamental suffering of existence. The Nyaya wanted to bridge it. The Buddhist wanted to show the bridge was empty.

  "The hunter acted on the bridge," the King said. He turned to the guards. "Cut him down."

  Rudra exhaled, a long shuddering breath.

  "But," the King raised a hand, stopping Rudra's thanks. "Acharya, you win the life, but you do not win the doctrine. I will not codify *Upamana* as a standalone proof in the royal courts. In law, we require Inference or Direct Witness. Comparison is too prone to the errors of language."

  Sthiramati nodded, satisfied. He had protected the integrity of the law.

  Rudra bowed. He had saved the hunter, and in doing so, preserved the sanctity of the cognition, even if the state would not codify it. "The law of the land is yours, Maharaj. The law of the mind is ours."

  The hunter was unbound. He stumbled forward, avoiding the carcass. He looked at Rudra with wide, terrified eyes.

  "What was it?" the hunter whispered. "Truly. Was it a cow or a *Gavaya*?"

  Rudra looked at the dead beast. He looked at Sthiramati. The Buddhist gave no answer. The particulars of the beast were irrelevant now; the category had been sustained.

  "It was what you knew it to be," Rudra said. "That is the only knowledge that saves a man."

  He turned and walked out into the blinding sun, where the shadows of the pillars looked like bars, and the world was full of things that looked like other things, waiting to be named.
