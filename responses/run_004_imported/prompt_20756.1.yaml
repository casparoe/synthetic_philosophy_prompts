answer: |-
  You have hit on one of the most sophisticated debates in contemporary formal epistemology. Your skepticism is well-founded: moving from "this scoring rule incentivizes honesty in a contest" to "incoherent beliefs are objectively irrational" is a massive philosophical leap.

  Your coach is describing **Decision Theory** (how to act to maximize utility). The philosophers you are asking about, led by Jim Joyce (specifically in his 1998 paper *"A Nonpragmatic Vindication of Probabilism"*), are trying to build **Epistemology** (what makes a belief rational) on top of it.

  Here is the walkthrough of the Accuracy-Dominance Argument, the mathematical requirements for the scoring rule, and the specific points where philosophers attack it.

  ---

  ### 1. The Structure of the Argument

  The argument attempts to prove **Probabilism**: the norm that your degrees of belief (credences) must obey the axioms of probability (e.g., probabilities sum to 1, $P(A) + P(\neg A) = 1$, etc.).

  Here is the logical flow:

  **Premise 1: Epistemic Consequentialism (The Alethic Principle)**
  The fundamental goal of belief is to represent the world accurately. A belief state is epistemically defective if it is unnecessarily inaccurate. Just as you want to maximize money in a contest, you want to minimize "inaccuracy" in life.

  **Premise 2: Measuring Inaccuracy**
  We can measure the "distance" between your credence and the truth using a mathematical function (an inaccuracy measure), denoted as $\mathfrak{I}(c, w)$.
  *   $c$ = your set of credences.
  *   $w$ = the actual state of the world (which propositions are true/false).
  *   Lower score = better (less inaccurate).

  **Premise 3: The Dominance Theorem (The Math)**
  If your credences $c$ violate the probability axioms (i.e., you are incoherent), then there exists *some other* set of credences $c^*$ (which *are* coherent/probabilistic) such that $c^*$ is more accurate than $c$ in **every possible world**.
  *   In decision theory terms: $c$ is **accuracy-dominated** by $c^*$.
  *   If you are incoherent, you are guaranteed to be less accurate than you could have been, no matter how the world turns out.

  **Conclusion: Rationality Requires Coherence**
  Since it is irrational to hold a belief state that is guaranteed to be less accurate than an available alternative, it is irrational to hold incoherent credences.

  ### 2. Why the Scoring Rule Matters (Genuine Accuracy)

  Your intuition is correct: not just *any* scoring rule can support this. If I defined "accuracy" as "how close your beliefs are to what I want them to be," I could prove anything. For the argument to work, the inaccuracy measure must be **legitimate**.

  Philosophers argue a legitimate inaccuracy measure must satisfy specific mathematical constraints. The Brier Score is the canonical example that satisfies these:

  $$ \text{Brier Score} = \sum_{i} (c_i - o_i)^2 $$
  *(Where $c_i$ is your credence in proposition $i$, and $o_i$ is 1 if true, 0 if false.)*

  For the dominance argument to hold, the measure generally needs to be:

  1.  **Continuous:** Small changes in belief result in small changes in inaccuracy. (You aren't penalized massively for a tiny shift).
  2.  **Strictly Proper:** This connects to your coach's point. A measure is *proper* if, when you actually have a certain credence, that credence minimizes your *expected* inaccuracy.
      *   *Why this matters:* If the measure weren't proper, the "most accurate" belief might be to just say "100%" or "0%" regardless of evidence. Propriety ensures the measure respects the nuance of uncertainty.
  3.  **Convex:** This is the geometric engine of the argument. It ensures that "averaging" beliefs is better than extreme oscillation.
  4.  **Additive (usually):** The inaccuracy of a set of beliefs is the sum of the inaccuracies of the individual beliefs.

  **The Geometric Intuition:**
  Imagine all possible truth assignments as points in space (vertices of a hypercube). All coherent probability functions form a shape called a **simplex** inside that space.
  *   If your beliefs are **coherent**, you are inside the simplex.
  *   If your beliefs are **incoherent**, you are outside the simplex.
  *   **The Theorem:** If you are outside the simplex (incoherent), there is *always* a point inside the simplex (coherent) that is geometrically closer to *every* truth-vertex than you are.
  *   If you are already inside the simplex, no other point is closer to *all* truth-vertices.

  This is why coherence is forced: Incoherence places you in a position where you are unnecessarily far from the truth, regardless of which truth obtains.

  ### 3. Where the Argument is Vulnerable

  This is where your skepticism is philosophically vindicated. While the math is sound, the philosophical interpretation is contested. Here are the three main vulnerabilities:

  #### A. The "Measure Dependence" Problem
  The dominance theorem holds for the Brier Score and many others, but does it hold for *all* reasonable measures of accuracy?
  *   **The Critique:** Some philosophers argue that there are legitimate ways to measure accuracy where incoherent beliefs are *not* dominated. If the result depends on choosing a specific mathematical function (like Brier) over another, does it really reveal a deep truth about rationality, or just a mathematical artifact of Euclidean distance?
  *   **Status:** Joyce and others (like Pettigrew) have strengthened the math to show the result holds for a very wide class of measures, but the dependency remains a technical vulnerability.

  #### B. The "Veritistic" Assumption (Accuracy is not the only good)
  The argument assumes **Veritism**: that accuracy is the *sole* fundamental epistemic good.
  *   **The Critique:** Is being accurate the only point of belief? What about **explanatory power**, **simplicity**, or **understanding**?
  *   **Example:** A weather model might be slightly less "accurate" in terms of raw probability calibration but provides better causal understanding of *why* it rains. If you tweak your credences solely to minimize Brier score, you might lose the structural relationships between beliefs.
  *   **The "Opinionated" Objection:** Sometimes, having a sharp, slightly incoherent view is more useful for action than a mushy, coherent one. The argument proves incoherence is *inaccurate*, but not necessarily that it is *irrational* if accuracy isn't your only goal.

  #### C. The Normative Leap (Is vs. Ought)
  This is the biggest philosophical hurdle.
  *   **The Critique:** Even if incoherent beliefs are *less accurate*, why does that make them *irrational*?
  *   **The Gap:** The argument shows that incoherent beliefs are **suboptimal instruments** for tracking truth. But rationality is often about **process**, not just outcome.
  *   **Example:** If I follow a perfect reasoning process but have bad evidence, I might end up incoherent due to a calculation error. Am I irrational? The accuracy argument says "Yes, your state is defective." Process theorists say "No, you reasoned correctly."
  *   **The "Ought Implies Can" problem:** The argument assumes you can always simply "switch" to the dominating coherent credence. But if you are incoherent, you might not know *which* coherent credence dominates you. If you can't identify the better belief, are you blameworthy for holding the worse one?

  ### Summary for Your Club

  Your coach is right that proper scoring rules make honesty the optimal *strategy* for a contest. Jim Joyce's argument tries to upgrade that from a strategy to a law of rationality.

  1.  **The Move:** It treats "Accuracy" as a utility and "Coherence" as the strategy that avoids guaranteed loss (dominance).
  2.  **The Requirement:** The scoring rule must be continuous, convex, and proper (like the Brier Score).
  3.  **The Weakness:** It assumes accuracy is the *only* thing that matters in belief, and it assumes that being in a "dominated state" is irrational even if you don't know how to fix it.

  **Your intuition is correct:** The move from "this score incentivizes honesty" to "incoherence is epistemically defective full stop" requires accepting that **epistemic rationality is purely about minimizing distance from the truth.** If you think rationality also involves reasoning processes, explanatory understanding, or pragmatic utility, the argument doesn't get you all the way to "full stop."

  For a forecasting club, the practical takeaway is: **Coherence protects you from being strictly worse off than you could be.** Whether that makes you a "bad philosopher" is debatable; whether it makes you a "worse forecaster" is mathematically proven.
