      *   Must not sound like an attack on religion.
      *   Must sound like a governance decision.
      *   Needs to be persuasive to the "Hire" side (who value competence and non-discrimination).

  5.  **Drafting - Key Arguments to Polish:**
      *   *Distinction:* Belief in God vs. Belief that the data is fake/interpretable differently.
      *   *Mission:* We are not a university research lab where she can publish code-switched papers; we are a public trust.
      *   *Precedent:* We aren't setting a precedent of "no religious people." We are setting a precedent of "curators must stand behind the science they curate."

  6.  **Review against Constraints:**
