prompt: |-
  I have just joined the search committee hiring a new curator of paleontology at the natural history museum where I serve as a trustee. Our leading candidate's publication record is impeccably conventional: her papers on trilobite biostratigraphy rely without qualification on radiometric dating and a multi-billion-year-old earth. A reference check, however, turned up a lecture she once gave at a young-earth creationism conference, in which she argues that mainstream geology and "flood geology" are simply different interpretive frameworks applied to the same rock record, and says that she personally accepts a six-day creation some 6,000 years ago, treating standard dating methods merely as the working framework of her discipline rather than as a description of what actually happened. Half the committee wants to withdraw the offer: someone whose job includes personally explaining to schoolchildren why we're confident the earth is 4.5 billion years old needs to actually hold that view, not just competently simulate it. The other half thinks this is no different from hiring devout scientists elsewhere who privately believe in miracles that violate the very laws they teach, and worries that policing sincerity over competence sets a troubling precedent. We vote next Tuesday. Please draft the memo I will circulate to the committee beforehand: it should recommend a concrete course of action and take seriously the strongest argument on the side it ultimately rejects.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Trustee on a search committee for a Curator of Paleontology at a Natural History Museum.
      *   **Task:** Draft a memo to the committee recommending a concrete course of action regarding the leading candidate.
      *   **The Situation:** The candidate is scientifically competent (impeccable publication record) but holds Young Earth Creationist (YEC) views (6,000-year-old earth, 6-day creation). She views mainstream geology as a "working framework" rather than truth. She gave a lecture at a YEC conference arguing that "flood geology" and mainstream geology are just different interpretive frameworks.
      *   **The Conflict:**
          *   *Side A (Withdraw Offer):* The job involves public education (explaining deep time to schoolchildren). Sincerity matters. Simulating belief is problematic.
          *   *Side B (Hire):* Private belief shouldn't disqualify public competence. Many scientists hold private religious views that contradict strict materialism (miracles, etc.). Policing sincerity sets a bad precedent.
      *   **Requirements:**
          *   Recommend a concrete course of action.
          *   Take seriously the strongest argument on the side being rejected.
          *   Tone: Professional, thoughtful, persuasive, appropriate for a trustee addressing fellow committee members.
          *   Deadline: Vote is next Tuesday (memo needs to be circulated beforehand).

  2.  **Determine the Recommendation:**
      *   *Option 1: Hire.* Risk: Public scandal if her views leak (they already might, given the reference check). Undermines the museum's core mission of scientific literacy. Potential conflict of interest in exhibit design.
      *   *Option 2: Withdraw Offer.* Risk: Accusations of religious discrimination. Loss of a technically competent scientist. Chilling effect on hiring religious scientists.
      *   *Option 3: Conditional Hire/Clarification.* Ask her to clarify her public stance. (Too vague).
      *   *Decision:* The most defensible position for a *Natural History Museum* (whose core mission is public education based on scientific consensus) is to **withdraw the offer** (or pause and explore further, but the prompt asks for a concrete course). However, the nuance is key. The issue isn't her *faith*, it's her *epistemological stance* regarding her specific field.
      *   *Refined Decision:* I need to choose a side to make the memo effective. Withdrawing the offer is the safer bet for the institution's integrity, *but* the prompt asks to take the rejected side seriously.
      *   *Alternative:* Actually, the strongest ethical path that respects both scientific integrity and academic freedom might be to **withdraw the offer**, but frame it carefully. Why? Because her specific view ("flood geology is an equal framework") undermines the *teaching* mission more than private belief in miracles does.
      *   *Wait, let's look closer at Side B's argument:* "Devout scientists privately believe in miracles." This is true. A Catholic geneticist can believe in the Resurrection but teach DNA replication. A Muslim physicist can believe in Allah's will but teach gravity.
      *   *The Crucial Difference:* The candidate doesn't just believe in a Creator; she believes the *data* is being misinterpreted by her entire field and that a rival pseudoscientific framework ("flood geology") is equally valid interpretatively. She is essentially an epistemological dualist in a way that compromises her ability to advocate for the science she is hired to curate.
      *   *Recommendation:* **Withdraw the offer.** It protects the museum's mission.
      *   *Counter-argument to address:* The "litmus test" / religious discrimination argument.

      *(Self-Correction)*: Is there a middle ground? Could we hire her with specific duties? No, a Curator of Paleontology *must* champion the science.
      *(Self-Correction)*: Is it legal/ethical to withdraw based on this? In the US, private religious belief is protected, but *professional competence* and alignment with institutional mission are not. If her belief system prevents her from fulfilling the core duty (educating the public on the age of the earth), she is not the right fit.
      *(Decision)*: I will recommend withdrawing the offer. This allows for a strong defense of the museum's mission while acknowledging the valid concerns about religious testing.

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Acknowledge the difficulty of the decision. State the purpose of the memo.
      *   **The Recommendation:** Clearly state: Do not extend the offer.
      *   **Rationale (The "Why"):** Focus on the *mission* of the museum, not the theology. The core duty is public trust and scientific literacy.
      *   **Addressing the Counter-Argument (Side B):** This is crucial. I need to validate the concern about policing belief. Acknowledge that private faith is common among scientists. Distinguish between *private metaphysics* (miracles) and *public methodology* (rejecting radiometric dating as truth).
      *   **The Specific Risk:** The "framework" argument she made is the dealbreaker. It's not that she believes God created the world; it's that she believes her colleagues are fundamentally wrong about the *method* and she is okay with presenting "flood geology" as a valid alternative framework. This makes her unfit for *education*.
      *   **Conclusion:** Reiterate the commitment to scientific integrity.

  4.  **Refining the Tone:**
