      *   No dumbing down? Yes.

  *(Self-Correction Note on Löb's Theorem)*: I need to be careful not to misstate Löb's. Löb's Theorem states that in Peano Arithmetic (PA), if $PA \vdash (\square P \to P)$, then $PA \vdash P$. In the context of FairBot: FairBot cooperates if $\square (\text{Opponent Cooperates})$. If playing itself, we need $\square (\text{FB cooperates} \leftrightarrow \square (\text{FB cooperates}))$. This relies on the fixed point lemma. I will have Elena sketch this on the board to ensure accuracy without bogging down the flow too much.

  *(Self-Correction on Folk Theorem)*: The specific critique is that Program Equilibrium allows *any* outcome to be sustained as an equilibrium if you can punish deviations. Marcus should argue that Cooperate-Cooperate is just one of many, so why is it special? Elena should argue that C-C is the only *Pareto optimal* one that is also *safe* against certain classes of agents.

