answer: |-
  **Setting:** *A muddy bank beside a pond, late afternoon. Two grad students, MIRA (teleosemanticist) and LEO (causal theorist), are crouching in the reeds. A frog sits on a lily pad. Someone off-screen flicks a BB pellet past the frog. The frog snaps.*

  **Mira:** Missed.

  **Leo:** Did it? It snapped at movement. It got what it wanted: a snap.

  **Mira:** It missed the *target*. That's the whole point. The neuron fired, the tongue shot out, but there was no fly. That's a misrepresentation. If you can't explain how that's an error, you can't explain meaning. You just have physics.

  **Leo:** Okay, but look at the physics. The neuron fired because of a contrast change in the visual field. A BB caused that. A fly causes that. If your brain state covaries with X, it carries information about X. The frog's state covaries with "small dark moving thing." Why privilege the fly?

  **Mira:** Because the frog isn't built to track "small dark moving things." It's built to eat flies. That's its *proper function*. Natural selection shaped that neural circuit because tracking flies kept ancestors alive. Tracking BBs did nothing. So when it snaps at a BB, the system is malfunctioning relative to its design. That's how you get falsity. The thought says "Fly there," but there's no fly. False.

  **Leo:** I see the appeal. It gives you a clean way to draw the line between truth and error. But it makes meaning historical. Imagine Lightning strikes the swamp behind us. Boom. By pure chance, molecules assemble into a molecule-for-molecule duplicate of this frog. Swampman.

  **Mira:** I know where this goes.

  **Leo:** Do you? Swampman has no evolutionary history. No ancestors. No selection pressure. On your view, Swampman's neural states have no "proper function." So when Swampman snaps at a BB, it's not an error. It's not even *about* anything. It's semantically empty. But internally? Identical to this frog. It behaves the same. It reacts to light the same. Are you really telling me Swampman is a zombie just because its parents didn't exist?

  **Mira:** I'm telling you Swampman has no *normative* status yet. It's a machine without a purpose. If it snaps at a BB, it's just gears grinding. It's not *wrong* to snap at a BB, because it was never *supposed* to snap at flies. Meaning requires a standard of correctness. History provides the standard. Without history, you just have causal regularities.

  **Leo:** But that means content isn't in the head. It's in the grave. It depends on dead ancestors. That feels like magic, Mira. Just backwards-looking magic. Why shouldn't meaning depend on what the system is doing *now*, how it's structured *now*? My view handles Swampman easily. Swampman's neuron covaries with movement. It means "movement." If it snaps at a BB, it's correct! It saw movement, there was movement.

  **Mira:** And there's the Disjunction Problem. If the neuron means "movement," then the frog is never wrong. It sees a BB, it snaps, it's true. It sees a shadow, it snaps, it's true. You've eliminated error entirely. You've made the frog infallible. But frogs make mistakes. If you can't explain mistakes, you haven't explained belief. You've just described a reflex.

  **Leo:** I can explain mistakes. Fodor's Asymmetric Dependence. Look, the connection between the neuron and the BB is parasitic on the connection between the neuron and the Fly.

  **Mira:** Parasitic how?

  **Leo:** Laws of nature. There's a nomic connection between flies and that neuron firing. The connection between BBs and the neuron firing only exists *because* BBs look like flies. If flies didn't cause the neuron to fire, BBs wouldn't either. But if BBs didn't cause it to fire, flies still would. The BB-dependence depends on the Fly-dependence, not vice versa. So the content is "Fly," and the BB-cases are errors. No history needed. Just counterfactuals.

  **Mira:** That's elegant, I'll give you that. But it's fragile. How do you prove that asymmetry without appealing to function? Why is the Fly-connection the "primary" law? Maybe the frog is actually designed to track "dark moving things," and flies are just the most common instance. If the environment changed, and flies vanished but BBs remained, eventually the neuron would track BBs. Where is the line? Your asymmetry looks like it's smuggling in function without admitting it.

  **Leo:** Maybe. But your history requirement is too strict. Think about a human. I think about a smartphone. My brain wasn't selected to track smartphones. They didn't exist in the EEA [Environment of Evolutionary Adaptedness]. On your view, do I have thoughts about smartphones? Or am I misrepresenting them as "shiny rectangular tools"?

  **Mira:** We can derive new functions from old ones. Your visual system was selected for shapes; your cognitive system for tools. We can chain the functions. But the grounding has to be in selection somewhere. You need a base level where "success" is defined biologically. Otherwise, why is the neuron *for* anything?

  **Leo:** Because it plays a causal role in the system! It's about what the state *does*, not where it *came from*. If I build a robot today with a camera and a claw, and it grabs BBs by mistake, I don't need to wait for it to evolve over a million years to say it made a mistake. I can say its code says "grab object," and it grabbed the wrong one. The "code" is the structure.

  **Mira:** But who wrote the code? You did. You're the selector. For the frog, there's no engineer. There's only the blind process of selection. If you remove the selection, you remove the engineer. Swampman is a robot with no programmer. It has syntax, maybe, but no semantics.

  **Leo:** That's the rub, isn't it? You're defining semantics as *normative status*. Truth, falsity, correctness. I'm defining it as *informational content*. Covariation, causal power. We're using the word "meaning" for two different jobs.

  **Mira:** Maybe. But if your "meaning" can't be false, is it really representation? A thermometer covaries with temperature. If it breaks and reads 20° when it's 30°, we say it's broken. But why? Because it was *made* to measure temperature. If a rock happens to be warm, we don't say the rock is "representing" heat falsely. You need the "made for" part to get the "broken" part.

  **Leo:** Fair. But the "made for" part creates the Swampman absurdity. If Swampman walks up to us and says, "Hi, I'm Leo," and he has all my memories, you're saying he has no thoughts? He doesn't *mean* "Leo"?

  **Mira:** I'm saying his utterance has no truth conditions initially. He's like a parrot. He makes sounds that *look* like meaning. But if he survives, and learns, and his states start getting selected by his new environment... maybe he acquires content. But at t=0? He's empty.

  **Leo:** It feels like you're prioritizing the *genealogy* of the state over the *reality* of the state. It's like saying a forged painting isn't art because the canvas doesn't have the right history, even if it looks identical to the original.

  **Mira:** No, it's like saying a map isn't a map of London if it wasn't drawn to track London, even if it looks exactly like London. If I spill ink on a page and it looks like a map of the subway, it's not a map. It's just ink. Swampman is spilled ink that looks like a mind.

  **Leo:** But the ink is inside a functioning brain! The ink is connected to sensors and motors. It's not just sitting there. It's *doing* the mapping work.

  **Mira:** Doing the work isn't enough. You need to know what the work is *for*.

  **Leo:** *(Watches the frog twitch)* What if we're both half-right? Maybe "content" is a hybrid. You need the causal structure to make it real *now*, but you need the history to make it normative.

  **Mira:** That's a dangerous synthesis. If history is required for normativity, Swampman still lacks it.

  **Leo:** Then maybe normativity isn't the whole story. Maybe Swampman has *proto-content*. It's not fully semantic, but it's not nothing. It's on its way. Your theory is all-or-nothing. Mine is graded.

  **Mira:** *(Stands up, brushing mud off her knees)* I worry that if you grade it, you lose the ability to say something is simply *false*. And if you can't say it's false, you can't say it's true. You just have "caused."

  **Leo:** And I worry that if you make it all-or-nothing based on history, you make meaning something we can never really know. We can't trace the full evolutionary history of every concept. We just know how our brains react.

  **Mira:** So you want internal access. I want external grounding.

  **Leo:** Basically. You want the anchor in the past. I want the anchor in the causal present.

  **Mira:** *(Looks at the frog)* The frog doesn't care. It's hungry.

  **Leo:** Exactly. It just wants the fly. Whether that desire is "proper" or "asymmetric" won't fill its stomach.

  **Mira:** No. But if we want to understand *us*—why we believe things, why we argue about truth—we need to know if our thoughts are trackers or just triggers.

  **Leo:** Maybe they're triggers that learned to act like trackers.

  **Mira:** Maybe. But if they're just triggers, then this whole conversation is just noise causing more noise. No truth, no falsity. Just BBs hitting frogs.

  **Leo:** *(Smiles)* See? You can't even argue against me without assuming your teleosemantics is true. You think your argument *ought* to change my mind. That's a proper function if I ever heard one.

  **Mira:** *(Laughs)* Touché. Come on. Let's go get food. My brain was selected to crave calories, and I'm not going to argue with that one.

  **Leo:** Finally, a causal theory we can agree on.

  *(They walk away, leaving the frog on the lily pad. It sits motionless, waiting for the next movement.)*
