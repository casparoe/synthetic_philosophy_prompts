      *   *Step 3: Identify the Contradiction.* If ESP bypasses ordinary physical laws (Step 1), then ordinary physical barriers (Step 2) cannot stop it.
      *   *Step 4: The Consequence.* The control variable (the room) is ineffective. The confound (ESP) remains.
      *   *Step 5: The Epistemological Collapse.* If the confound remains, the Imitation Game cannot distinguish between "intelligence" (computational/mental) and "psi-ability." Therefore, the test fails to measure what it claims to measure (intelligence).

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the user's insight. It's a sharp catch that often gets glossed over. State the thesis: Turing's proposed control creates a logical paradox that undermines the operational validity of the test *under the very conditions he posits*.

      *   **Point 1: The Ontological Status of ESP in Turing's Text.**
          *   Turing explicitly says ESP denies "usual scientific ideas."
