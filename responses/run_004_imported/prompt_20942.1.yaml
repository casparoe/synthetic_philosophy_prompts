      *   **Tone:** Academic but accessible (for 1st/2nd years), rigorous (PhD level prep), challenging but respectful.
      *   **Constraint:** Follow-ups must be anchored to her *likely* Fodorian responses, not generic ones.

  2.  **Deconstruct the Guest's Position (Fodorian Orthodoxy):**
      *   *LoT:* Thinking is computation over mental representations with combinatorial syntax and semantics.
      *   *Systematicity/Productivity:* You can't have a mind that can think $aRb$ but not $bRa$. Connectionism (classic PDP) can't guarantee this without explicit structure.
      *   *Radical Concept Nativism:* All lexical concepts are innate. Learning is hypothesis testing, which requires the concept to test the hypothesis. Therefore, no *new* concepts are acquired, only triggered.
      *   *Asymmetric Dependence:* Misrepresentation occurs when a false symbol tokening depends on a true symbol tokening, but not vice versa. (e.g., 'Cow' tokens caused by horses depend on 'Cow' tokens caused by cows, but not vice versa).
      *   *Attitude towards AI/LLMs:* Fodor was skeptical of statistical learning. A modern Fodorian would likely view Transformers as sophisticated pattern matchers lacking genuine symbolic structure unless explicitly architected (though this is a point of debate).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Topic 1: Connectionism & Systematicity.*
          *   Q: Classic Fodor/Pylyshyn argument. Connectionists say "we can implement it."
          *   Likely Reply: Implementation isn't explanation. If the architecture doesn't *enforce* systematicity, it's an accident.
