prompt: |-
  I'm a PhD student in cognitive science, and together with a couple of labmates I help run a small interview series in which we invite philosophers and cognitive scientists to talk with our department's first- and second-year students about foundational debates in philosophy of mind. Next month's guest has built her career defending a strongly Fodorian language of thought hypothesis, including its most unpopular commitment, radical concept nativism, and the asymmetric-dependence solution to the disjunction problem for informational semantics that she uses to shore it up. I've sat in on enough of her talks to know she is extremely practiced at restating the core productivity-and-systematicity case for a combinatorial syntax of thought, and in a previous episode with a different guest we let that argument pass with barely a challenge -- I'd rather not repeat the mistake.

  Could you draft eight to ten interview questions, each one followed immediately by a plausible follow-up keyed to the reply she's most likely to give? I want at least one question-and-follow-up pair on each of the following: (1) the "it's just an implementation" reply that connectionists make to the systematicity argument, and why she thinks that reply fails to save connectionism; (2) the apparent paradox at the heart of radical concept nativism -- if acquiring a concept requires confirming a hypothesis already stated in terms of that concept, how something like DOORKNOB, or any concept for a comparatively recent artifact, could be an unlearned primitive rather than something built from simpler parts; (3) whether the asymmetric-dependence account of misrepresentation genuinely explains why "cow" thoughts are about cows rather than cow-or-horse-glimpsed-in-poor-light, or whether the dependence relation is simply stipulated to yield the extension Fodor wanted in advance; and (4) whether recent claims about compositional generalization in large transformer-based language models should be read as vindicating or undermining the systematicity argument against connectionism. Feel free to reorder these, but keep the follow-ups anchored to what she would actually be likely to say, rather than generic.
