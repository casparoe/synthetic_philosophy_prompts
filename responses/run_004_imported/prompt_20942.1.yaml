          *   Likely Reply: They are still statistical associators. They fail on true compositionality (systematic generalization out of distribution). Or, if they succeed, they are implicitly implementing LoT.
          *   Follow-up: If they *are* implementing LoT, does the substrate matter?
          *   *Drafting:* Focus on "genuine" vs. "approximate" compositionality.

      *   *Filling the remaining 4-6 questions:*
