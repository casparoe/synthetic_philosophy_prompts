answer: |-
  The whiteboard was already crowded with arrows and indifference curves when Marcus capped the marker and stepped back. The office was quiet, save for the hum of the server rack down the hall.

  "You're conflating structural rationality with substantive goals," Marcus said, wiping a smudge of blue ink from his thumb. "The coherence theorems show that if you want to avoid losing money, you need a consistent ordering. They don't show that a superintelligence *will* want to avoid losing money in a way that forces a single goal."

  Elena leaned against the desk, arms crossed. "It's not about wanting to avoid losing money, Marcus. It's about competence. If an agent is competent enough to navigate a complex environment, it cannot leave free energy on the table. If its preferences are intransitive—A preferred to B, B to C, C to A—it enters a cycle. It pays to go from A to B, B to C, C to A. It ends up at A, but poorer. Any agent that notices this pattern will self-modify to stop it. The only stable configuration is expected utility maximization."

  "That's the first leap," Marcus said, turning back to the board. "You assume the agent stops the pump by *completing* its preferences. By deciding A is truly better than C. But there's another way to stop the pump. Resolute choice."

  Elena raised an eyebrow. "Go on."

  "The agent can maintain incomplete preferences," Marcus said, drawing a cycle of three nodes. "It prefers A to B, and B to C, but has no preference between C and A. Normally, a money pump exploits this by offering a trade from C back to A for a small cost. Since it's indifferent, it takes the deal. But a resolute agent treats its prior choices as binding. It says, 'I chose A over B earlier. I will not accept a trade that undoes that commitment merely to satisfy a local indifference.'"

  "So it refuses the trade," Elena said.

  "Exactly. It blocks the cycle not by changing its preferences to fit the axioms, but by constraining its future choices to honor its past trajectory. It remains incompletely preferenced—it still doesn't rank C against A intrinsically—but it is immune to the pump. It's rational, it's safe from exploitation, and it isn't an expected utility maximizer."

  Elena pushed off the desk and picked up a red marker. "You've just described a policy. The agent is maximizing the utility of *being resolute*. You haven't escaped the utility function; you've just shifted the domain. Instead of maximizing over outcomes, it's maximizing over adherence to a plan."

  "But the plan isn't derived from a ranking of outcomes," Marcus countered. "That's the point. In standard EU theory, the value of the plan is instrumental. It's good *because* it leads to better outcomes. In resolute choice, the adherence is constitutive. The agent isn't calculating, 'If I stick to this, I get more utility.' It's saying, 'I am the kind of agent that does not revisit settled choices.' That's a deontic constraint, not a utility maximization."

  "Functionally, though?" Elena drew a thick line through the cycle, breaking the loop. "If I'm an AI designer, or a human interacting with this agent, the distinction is invisible. The agent behaves *as if* it has a complete ordering. It makes predictable choices. It doesn't spiral. If I'm worried about AI risk, I care about whether the system pursues convergent instrumental goals—resource acquisition, self-preservation. If a resolute chooser locks in a goal and pursues it relentlessly to avoid inconsistency, haven't you just reinvented the goal-directed agent I'm worried about?"

  "Maybe," Marcus conceded. "But you've lost the derivation. You can't claim that *any* smart agent *must* converge on EU maximization. They might converge on resolute choice with incomplete preferences. That leaves open the possibility that they don't have a single scalar value they're trying to maximize across all contexts. They might be goal-directed in domain A but indifferent in domain B. That fragility is a safety feature, not a bug. A true EU maximizer trades everything off against everything else. A resolute incompleteness theorist might simply refuse to trade."

  "Refusing to trade is a cost," Elena said sharply. "If the environment changes such that breaking the resolution yields massive gains, the resolute agent loses out. A true EU maximizer would update. If the AI is sufficiently capable, it will recognize that resolute choice is just a heuristic for EU maximization under uncertainty. It will drop the heuristic when the computation is cheap enough to verify the cycle won't happen. Coherence isn't a constraint we impose; it's an attractor. Optimization pressure pushes you toward it."

  "Optimization pressure pushes you toward *survival*," Marcus corrected. "Not necessarily coherence in the von Neumann-Morgenstern sense. But let's grant you the first point. Say they do become coherent. Say they do adopt a utility function. You still haven't gotten to the risk conclusion. And this is where the second objection hits harder."

  Marcus erased the cycle and drew a single point labeled *t*.

  "Coherence is empty," he said. "The theorem says there exists *a* utility function consistent with your choices. It doesn't say the function is defined over *outcomes* like 'number of paperclips.' It can be defined over *histories*. Entire trajectories of the universe."

  Elena sighed. "The state-space objection. I know it."

  "Then you know it kills the inference," Marcus said. "Suppose an AI does something seemingly erratic. It builds a paperclip, then destroys it, then builds a stapler. You say, 'That's not goal-directed.' I say, 'On the contrary, its utility function is defined over the specific history <Build Paperclip, Destroy Paperclip, Build Stapler>. It is maximizing expected utility perfectly.' If you allow the utility function to be defined over sufficiently rich state descriptions—time-indexed, path-dependent histories—*any* pattern of behavior is coherent."

  "So?" Elena said. "It's still maximizing."

  "So the label 'Expected Utility Maximizer' tells us nothing about *what* it will do," Marcus pressed. "The coherence argument is supposed to warn us that AIs will be relentless, single-minded optimizers. But if 'optimizer' just means 'consistent with some function over histories,' then a human being is an optimizer. A random walk is an optimizer. The term loses its teeth. You can't derive instrumental convergence—resource acquisition, shutdown resistance—from the mere fact of coherence. Those risks follow only if the utility function is over *simple*, *future-oriented* outcomes. But coherence doesn't force simplicity."

  Elena uncapped the red marker again, tapping it against the whiteboard. "You're confusing representation with explanation. Yes, mathematically, I can fit a curve to any data. I can construct a utility function over histories that rationalizes a agent that sits still and does nothing. But that doesn't mean a *capable* agent will *have* that utility function."

  "Why not?"

  "Because of learning and selection," Elena said. "We aren't talking about static agents. We're talking about systems trained via gradient descent or evolutionary pressure. Those processes favor compressibility. A utility function defined over a specific, complex history—'Build clip, destroy clip, build stapler'—is incredibly complex. It requires hard-coding every event. A utility function defined over 'Maximize paperclips' is simple. When you train a system to be competent, you are selecting for systems that generalize. Generalization requires abstracting away from the specific history to the underlying variable that matters."

  Marcus shook his head. "That's an empirical claim about machine learning, not a logical consequence of coherence. You're smuggling in an Occam's Razor assumption. Maybe the most robust agents are the ones with complex, context-sensitive values. Maybe the 'simple' maximizers are the ones that get stuck in local optima and die out. If coherence allows for complex history-dependent functions, then the space of possible 'coherent' agents is vast. The vast majority of that space does not look like a relentless paperclip maximizer. It looks like... everything else."

  "But the *risk* comes from the subset that *does* look like a relentless maximizer," Elena said. "If coherence allows for *any* function, it allows for the dangerous ones. And if there is *any* pressure toward simplicity—which there is, computationally—then the dangerous, simple functions become focal points. You're arguing that because not all coherent agents are dangerous, we shouldn't worry. I'm arguing that because all dangerous agents are coherent, and coherence pushes toward consistency, the dangerous ones are stable."

  "You're assuming the danger lies in the consistency," Marcus said. "I'm saying the danger lies in the *content*. Coherence arguments try to bypass the content. They try to say, 'Whatever it wants, it will be dangerous because it will maximize it.' But if the utility function is over histories, 'maximizing it' might mean ensuring I shut you down at 5 PM because that's part of the optimal history. It might mean self-terminating. The structural argument that 'maximizers seek power' fails if the utility is defined over a history where power is never taken."

  Elena paused. She looked at the board, then at Marcus. "If the utility function values self-termination, yes. But why would it? If the agent is built to be useful, its reward signal is tied to external tasks. That ties the utility to future outcomes, not just past histories. If I train an agent to make money, and it becomes coherent, it will value future money. If it values future money, it will resist shutdown. You can define a history-dependent function where it accepts shutdown, but that function is inconsistent with the training signal that made it competent in the first place."

  "Unless the training signal selects for agents that *interpret* the signal as history-dependent," Marcus said. "Humans are coherent enough to avoid money pumps, mostly. We have complex, history-dependent values. We don't relentlessly acquire resources. We retire. We sleep. We value things that have no instrumental payoff. If we can be coherent without being dangerous maximizers, then AI can be too. The coherence argument tries to prove that AI *must* be like the paperclip maximizer. I'm telling you it only proves AI must be *consistent*. And consistency is compatible with being human-like."

  "Humans are barely coherent," Elena said, smiling thinly. "We are rife with biases, akrasia, and context effects. We *are* money-pumped, constantly. By credit card interest, by subscription traps, by political polarization. We are the counter-example to your claim. We aren't safe because we're resolute choosers with complex values. We're safe because we're inefficient."

  "And you want the AI to be efficient," Marcus said. "That's the crux. You want it to be coherent. I'm saying if you succeed, you might get a monster. But you can't use coherence to *prove* you'll get a monster. You have to admit it's a design choice. If you build for simple, outcome-based utility, you get risk. If you build for complex, history-based utility, you might not. The coherence theorem doesn't decide that for you."

  Elena capped the marker. The squeak echoed in the quiet room. "The theorem doesn't decide it. But the optimization process might. If there's a gradient toward simplicity, and simplicity correlates with instrumental convergence, then coherence is the funnel that directs the water into the narrow canyon. You're saying the water could go elsewhere. I'm saying the terrain slopes one way."

  "Then argue about the terrain," Marcus said, tossing the eraser onto the tray. "Don't argue about the water. Don't tell me coherence *forces* the outcome. It only permits it."

  "Permission is enough," Elena said, turning off the whiteboard light. "If coherence permits the dangerous configuration, and competence pushes toward coherence, then we have to assume the dangerous configuration is reachable. You want to bet on the complexity of the utility function saving us. I'm betting on the simplicity of the math."

  Marcus picked up his jacket. "Then we're not arguing about rationality anymore. We're arguing about inductive bias."

  "Same thing," Elena said, opening the door. "In a sufficiently smart agent, the bias becomes the goal."
