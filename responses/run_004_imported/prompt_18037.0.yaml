answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late afternoon. Two philosophers, Ella (Humean) and Marcus (Primitivist), are finishing a seminar on metaphysics of probability.*

  **Marcus:** You know, Ella, I've been re-reading Lewis's "Debugged" paper again. I want to grant you the Best System Analysis (BSA) for the sake of argument. I want to grant that chances are just the probabilistic posits of the best summary of the Humean mosaic. But the undermining future still feels like a bullet you haven't bitten so much as swallowed whole.

  **Ella:** Swallowed? I thought we digested it nicely. The New Principle (NP) handles the undermining cases. If the future can undermine the present chance assignment, we just condition on the theory of chance itself, not the bare chance proposition. It's a technical fix, Marcus. It preserves the guidance role of chance.

  **Marcus:** Does it? That's exactly what I'm skeptical of. Let's trace the epistemic path. Under the Principal Principle (PP), if I know the chance of Heads is 50%, and I have no inadmissible evidence, my credence should be 50%. Simple. Direct. But under the New Principle, I can't just condition on "Chance(Heads) = 0.5." I have to condition on $T_w$, the proposition specifying the true theory of chance for this world.

  **Ella:** Right. Because "Chance(Heads) = 0.5" isn't the whole story if the future can change what the chance *was*.

  **Marcus:** But here's the rub. To know $T_w$—the true theory of chance for *this* world—I need to know the entire Humean mosaic, don't I? Because on your view, the laws supervene on the total distribution of categorical properties. If the future turns out differently, the best system might change, and thus the chance *now* might have been different. So, to know the chance *now*, I effectively need to know the future.

  **Ella:** That's a classic objection, but it conflates *metaphysical determination* with *epistemic access*. Yes, metaphysically, the chance supervenes on the whole mosaic. But epistemically, we don't need the *true* theory to have rational credences. We need the *best candidate* theory given our current evidence. The NP tells us: defer to the chances posited by the theory that best balances strength and fit given what you know. We aren't asking agents to be omniscient about the future. We're asking them to defer to the probabilistic structure of the world as best as they can model it.

  **Marcus:** But that shifts the goalposts. The Principal Principle was supposed to link *objective* chance to subjective credence. If "objective chance" is just "the probability assigned by the theory that looks best to me right now," haven't you collapsed chance into subjective credence? You've saved the principle by making chance epistemic.

  **Ella:** Not at all. The theory is objective. Whether a system is the "Best System" is a fact about the world, not about me. It's about compression, simplicity, and fit. My *access* to it is partial, but the target is mind-independent. The NP just acknowledges that the proposition "The chance is $x$" carries hidden information about the future mosaic under Humeanism. The NP filters that out. It says: "Ignore the information about the future mosaic that is smuggled into the chance claim; just look at the conditional probability given the theory." It rescues the idea that chance guides credence without forcing you to know the future.

  **Marcus:** I'm not buying that the information is just "filtered out." Think about the rational justification for deferring to chance in the first place. Why should my credence align with the frequency patterns of the universe? The Humean story is: because those patterns *constitute* the chance. But if the constitution depends on the future, then my current credence is hostage to events that haven't happened.
  If I'm betting on a coin toss, and I know the coin is fair according to the current best system, the Primitivist says: "Your credence should be 0.5 because there is a real, present propensity of 0.5." You say: "Your credence should be 0.5 because... well, assuming the future doesn't deviate so wildly that it rewrites the laws, the best system says so." That "assuming" is doing too much work. It makes the normativity of chance hypothetical.

  **Ella:** Okay, let's turn that around. This is where I think the Primitivist view is actually the one struggling to justify the Principal Principle. You say there's a "real, present propensity." Fine. Metaphysically mysterious, but let's allow it. Why should my *credence* track *that*?
  For the Humean, the connection is almost analytic. Chance *is* the feature of the world that plays the role of guiding credence in the Best System. We define chance as the thing that satisfies the PP (or NP).
  But for you, chance is a brute dynamical feature. It's distinct from frequencies, distinct from credence. So why should I care? If propensities are ontologically basic, the Principal Principle looks like a massive coincidence. Why should the mind align with this brute modal force? The Humean explains the link because the link is partly constitutive of what chance *is*. You have to posit a pre-established harmony between your rationality and my brute propensities.

  **Marcus:** That's the "Quinean" move, defining chance by its role. But it's too cheap. You can define a "schmance" as whatever satisfies the NP, but that doesn't mean you've captured *objective chance*.
  To answer your "why care?" question: The connection isn't a coincidence; it's a conceptual constraint on what we mean by probability. If a feature of the world doesn't guide credence, it isn't chance. I agree with you there. But the Humean can't satisfy the constraint without undermining the objectivity.
  Here's the specific pressure point: The Undermining Future shows that on Humeanism, present chances are *logically incompatible* with certain future histories. If the chance of Heads is 0.5, there are some future sequences of Heads/Tails that are so unlikely they would make the chance *not* 0.5.
  So, if I know the chance is 0.5, I know those futures won't happen. But if I know those futures won't happen, the event isn't chancy! You've reintroduced determinism through the back door of the Best System. The NP tries to patch this by saying "Condition on the theory," but the theory itself rules out the undermining futures. So rational agents *must* believe the undermining futures are impossible. But if they're impossible, the chance wasn't really 0.5. It's a coherence trap.

  **Ella:** You're treating the Best System as if it requires perfect fit. It doesn't. It balances fit and simplicity. An undermining future is one where the frequencies deviate significantly from the chance. The Best System might still posit 0.5 even if the actual frequency is 0.6, provided the deviation isn't too costly for simplicity.
  But more importantly, you're assuming the agent *knows* the theory is true. The NP applies to credence conditional on the theory. If I'm uncertain about the theory, I average over them.
  Look, Marcus, be honest. The Primitivist view buys you a clean PP at the cost of making chance a "nomological dangler." It does nothing. It explains no patterns. It predicts nothing except that it aligns with credence.
  The Humean view makes chance earn its keep. It summarizes the world. The undermining problem is just a boundary case where the summary relation gets reflexive. The NP is a face-saving retreat only if you think the original PP was a revealed truth. It wasn't. It was a first-pass formulation. The NP is the mature version. It admits that chance propositions carry more information than just "the probability is $x$"—they carry information about the laws. Once you condition on the laws properly, the guidance works.

  **Marcus:** "Mature version" is a generous way of saying "admission that the original intuition was wrong." The original intuition was that chance tells you about the *single case* given the *past*. The New Principle tells you about the single case given the *theory of the whole world*.
  Here is what keeps me up at night regarding your view: It makes chance unknowable in principle for a temporally situated agent. To know the chance of a quantum decay *now*, I need to know if a future civilization will build a particle accelerator that shifts the frequencies enough to change the Best System. If I don't know that, I don't know the chance.
  So when a physicist tells me, "The half-life is 5 years," on your view, she is speaking falsely. She doesn't know the half-life. She only knows the half-life *relative to a hypothesis about the entire future history of the universe*. That strips chance of its practical utility. It becomes a theoretical posit for a God's-eye view, not a guide for living.

  **Ella:** Physicists speak loosely. They speak relative to the assumption that the laws are stable. That's a good assumption! The world *is* stable. The fact that it *could* be otherwise doesn't mean we can't use the chances.
  But let's look at your "knowability" claim. You say I need to know the future to know the chance. You say you don't. But how do *you* know the propensity is 0.5? You infer it from... frequencies? Past data?
  If you infer it from past data, you're assuming the future resembles the past. That's induction.
  If I infer it from the Best System of the past and present, I'm assuming the future resembles the past.
  We are in the same boat epistemically. The difference is that I admit the metaphysics makes the future relevant, while you hide it behind a "brute necessity."
  My view is more honest. It says: "Chances are summaries of patterns. Patterns extend through time. So chances depend on time." Your view says: "Chances are magic sparks at a time that somehow guarantee patterns later." Who is really making chance unknowable? You're positing a feature of reality that is, by definition, cut off from the future, yet must match the future. That's the mystery.

  **Marcus:** It's not a mystery if it's a law. Laws govern the future; they don't supervene on it. That's the asymmetry.
  But fine, let's talk about what would actually shift us. You think the NP saves the guidance role. I think it severs the link between chance and the single case.
  If I were to become a Humean, I wouldn't need you to solve the undermining problem. I'd need you to show me that the "New Principle" actually generates the *same* credences as the "Old Principle" in all practically relevant cases without requiring the agent to have implicit knowledge of the future mosaic. Can you prove that for any agent like us, $C(A | T_w)$ converges to $C(A | X)$ where $X$ is the local chance, without the agent needing to rule out undermining futures explicitly? If the NP requires me to explicitly rule out undermining futures to get the right answer, you haven't saved the guidance role for finite minds.

  **Ella:** That's a fair challenge. Convergence under uncertainty. I think the math works out because undermining futures are, by definition, low-probability under the theory. So conditioning on the theory automatically downweights them.
  But here is my condition for switching to Primitivism. You need to explain the *normativity* without circularity. Don't tell me "it's conceptual." Tell me *why* a rational agent who cares about truth should align their credence with your brute propensities.
  If propensities don't supervene on the categorical facts, they are distinct existences. Why should my mental state track *that* specific distinct existence rather than the frequencies themselves? If you can give me a derivation of the Principal Principle from the nature of primitivist chance that doesn't just stipulate "Chance is what you defer to," I'll listen. Until then, Humeanism is the only game that explains *why* chance matters: because it's the map of the territory's patterns, and we want our map to match the territory.

  **Marcus:** So you want a derivation of normativity from metaphysics.
  **Ella:** I want to know why I should care about your propensities if they aren't just patterns in the data I care about.
  **Marcus:** And I want to know if your "New Principle" is actually usable by a human being, or if it's a principle for a Laplacian demon who sees the whole timeline.
  **Ella:** Deal.
  **Marcus:** Deal. But I'm ordering another coffee. This isn't getting resolved today.
  **Ella:** Neither is the measurement problem. Drink up.
