answer: |-
  This is an exceptionally well-researched premise. You have correctly identified the two dominant poles in the contemporary philosophy of language regarding slurs: the **Semantic/Content-Based** approach (Hom/May) and the **Pragmatic/Norm-Based** approach (Anderson/Lepore). The tension between them is not merely academic; it maps directly onto the tension between *what words mean* and *what words do*.

  To answer your request directly: I will argue that while **Prohibitionism offers the superior account of the "mere mention" controversy** (which is central to your plot), it fails to adequately explain **reclamation** without borrowing machinery from Content-Based views. Consequently, the most philosophically robust position for your character to occupy is not a pure version of either, but a **contextualist synthesis** that treats slurs as *historically loaded tools* whose normative status shifts based on agency and intent.

  Here is a breakdown of the stakes, the oversimplifications in your setup, and how your character can wield this in her defense.

  ### 1. Correcting the Setup: Nuance and Oversimplification

  Before evaluating the theories, we need to sharpen the definitions, as your character (a specialist) would spot these distinctions immediately.

  **On Hom's Combinatorial Externalism (CE):**
  You note that Hom argues sentences predicating slurs are "systematically false." This is slightly imprecise. Hom argues that the truth-conditional content of a slur is determined by a racist ideology (the "external" part). So, "X is a [slur]" is true *if and only if* X possesses the properties attributed to them by that racist ideology.
  *   **The Stakes:** Since the ideology is factually false (e.g., there are no biological traits justifying racial hierarchy), the term fails to refer to anything real. Thus, sentences using the slur are indeed false, but more importantly, **using the slur forces the speaker to adopt the perspective of the racist ideology.**
  *   **The Oversimplification:** CE is primarily a theory about *use* (predication). It struggles to explain why *mentioning* the word (without predicating the property) causes harm, unless one argues that the mere phonological presence invokes the ideology.

  **On Anderson & Lepore's Prohibitionism:**
  You characterize this as a "standing social prohibition... like a taboo."
  *   **The Stakes:** They argue the offense is not about the *content* asserted (semantics) but about the *violation of a norm* (pragmatics). It is akin to a rule: "Do not utter this sequence of sounds."
  *   **The Oversimplification:** It is not merely a psychological taboo (like saying "voldemort"); it is a **moralized norm**. The offense isn't just that people get upset; it's that the speaker has violated a community standard regarding respect and historical harm. However, by stripping the word of specific semantic content, Prohibitionism risks making the offense seem arbitrary.

  ### 2. The "Mere Mention" Problem: Who Wins?

  **Verdict: Prohibitionism.**

  This is the crux of your novel's conflict. Your character quoted the word; she did not apply it to a person.

  *   **Why CE Fails Here:** If the offense lies in the *truth-conditional content* (i.e., asserting someone fits a racist stereotype), then quoting the word in a meta-linguistic context ("The word [slur] has five letters") should be innocuous. You are not asserting the stereotype; you are analyzing the word. If a CE theorist says quoting is offensive, they have to smuggle in a pragmatic claim (that hearing the word triggers the ideology), which weakens their semantic purity.
  *   **Why Prohibitionism Succeeds:** This is Prohibitionism's home turf. If the rule is "Do not token this word-form," then tokening it—even for science, even in quotes—violates the rule. Anderson and Lepore explicitly use the "mention" problem to argue *for* their view. They would say the public outrage is rational because the norm is absolute: the word itself is contaminated, regardless of the propositional content attached to it.

  **For your character:** If she defends herself using Hom's CE, she will sound tone-deaf ("I didn't assert the content, so no harm done"). If she acknowledges Prohibitionism, she admits she broke a norm, but can argue about the *hierarchy of norms* (e.g., the norm of scientific inquiry vs. the norm of public comfort).

  ### 3. The Reclamation Problem: Who Fails?

  **Verdict: Both struggle, but Prohibitionism fails harder.**

  Reclamation (e.g., in-group usage of the N-word) is the hardest test for any theory of slurs.

  *   **The Prohibitionist Failure:** If there is a standing prohibition on the word-form, who has the authority to lift it? Prohibitionism implies the rule is social. If the targeted group lifts the rule for themselves, Prohibitionism must become **agent-relative**. It has to say: "The rule applies to Group A, but not Group B." This is philosophically messy. It turns the prohibition from a property of the *word* into a property of the *speaker's identity*. While socially accurate, it weakens the theoretical claim that the *word itself* is the problem.
  *   **The CE Adaptation:** Hom can handle reclamation better, though it requires maneuvering. He can argue that when the in-group uses the slur, the **external ideology determining the content has shifted.** The word no longer draws its content from the racist institution but from a new, solidarity-based institution. Thus, it is effectively a **different word** (homophonous, but semantically distinct).
  *   **The Weakness:** This feels like a semantic cheat. It implies the word *itself* isn't the problem, but the *ideology behind it* is. This undermines the Prohibitionist intuition that the word is dangerous *per se*.

  **The Synthesis:** Reclamation exposes that **history matters more than semantics.** The word is offensive because of its history of violence (CE), but the *permission* to use it is governed by social standing and norms (Prohibitionism).

  ### 4. The Argument: A Sociolinguistic Synthesis

  You asked me to argue for the position the evidence supports. I argue that **pure Prohibitionism is the best explanation for the public controversy, but pure CE is the best explanation for the underlying harm.**

  However, for a **sociolinguist**, both are too rigid. Sociolinguistics focuses on *variation*, *context*, and *uptake*. Your character should not defend herself by choosing one theory over the other. She should defend herself by arguing that **both theories commit the same error: they treat language as static.**

  **The Position to Adopt: Contextualist Normativity.**
  This view holds that the offensiveness of a slur is not inherent in the word (Prohibitionism) nor fixed by a racist ideology (CE), but is determined by the **interactional context and the risk of uptake.**

  1.  **Against Prohibitionism:** The "taboo" isn't absolute. We teach the word in history class; lawyers read it in court; linguists analyze it. If it were a pure taboo like scatology, these would be impossible. Therefore, the prohibition is **purpose-relative**.
  2.  **Against CE:** The harm isn't just the "false content." The harm is the **reactivation of historical trauma.** When a non-targeted person says the word, even in quotes, they risk "waking up" the historical violence attached to it.
  3.  **The Reclamation Key:** Reclamation works because the targeted group changes the **context of uptake**. They signal, "We are not invoking the history of violence; we are invoking a history of survival."

  ### 5. Practical Application: The Character's Defense

  To make your character's defense track a genuine philosophical position rather than a straw man, she should avoid saying "It's just a word" (naive realism) or "I didn't mean it" (intentionalism).

  Instead, her defense should rely on the distinction between **Tokening** and **Endorsing**, grounded in a critique of Prohibitionism.

  **Drafting the Defense (Philosophical Core):**
  > "The prosecution argues that the word itself is toxic, that uttering it is akin to releasing a poison gas. This is the Prohibitionist view: that the phonemes carry the harm. But if that were true, I could not stand here today and tell you what word I am accused of saying without committing the same offense. The fact that I *can* describe it, and that historians can read it in court transcripts, proves the toxicity is not in the *sound*, but in the *stance*.
  >
  > "Combinatorial Externalism tells us the word encodes a racist ideology. I agree. But encoding is not asserting. When I quoted the term to analyze its frequency, I was not predicating that ideology of anyone. I was holding the ideology up to the light. To say that analyzing a virus is the same as spreading it is to confuse the map with the territory.
  >
  > "The outrage I face is not because I harmed anyone—no one was targeted, no one was insulted. The outrage is because I violated a **protective norm**. And protective norms are vital. But when protective norms prevent us from studying the mechanism of the harm itself, they become counter-productive. Reclamation teaches us that the power of the word lies in *who wields it and why*. I am a linguist. My job is to wield words to understand them, not to wound with them. To conflate the two is to surrender the tool of analysis to the very ideology we seek to dismantle."

  ### 6. Summary of Recommendations

  1.  **Don't let her be a pure Prohibitionist:** If she believes the word is inherently toxic, she can't justify her research.
  2.  **Don't let her be a pure Homian:** If she believes the offense is only about truth-conditional content, she will fail to understand why people are hurt by the *mention*. She will seem cold and analytical.
  3.  **Make her a Contextualist:** She should argue that the *meaning* and *force* of the word depend on the **speech act type**.
      *   *Assertion:* "He is a [slur]." (Harmful, invokes ideology).
      *   *Mention:* "The word [slur] is common." (Analytic, potentially risky but distinct).
      *   *Reclamation:* "I am a [slur]." (Solidarity, shifts ideology).
  4.  **The Philosophical Stake:** The novel should explore whether we can **study hate without reproducing it.** The Prohibitionist says "No, the medium is the message." The Sociolinguist (your character) says "Yes, but the risk of accidental reproduction is high, and requires accountability."

  **Final Verdict:** The evidence supports a **Hybrid View**. The *history* of the word (CE) gives it its potential energy, but the *social norm* (Prohibitionism) determines when discharging that energy is permissible. Your character's tragedy is that she prioritized the history (academic truth) over the norm (social harmony), failing to realize that in the public sphere, the norm *is* a form of truth.

  This gives her a defensible position that is intellectually honest but socially vulnerable—which is perfect for a novel.
