      *   **Disjunctivism:** Veridical perception and hallucination (or aura) are fundamentally different kinds of states. They only *seem* the same. There is no common mental object. The nature of veridical perception is constituted by the external object itself. The "indistinguishability" is an epistemic fact (I can't tell them apart), not an ontological one (they aren't the same *thing*).

