answer: |-
  A Cartesian skeptic gets pulled over for speeding.

  **Skeptic:** "Officer, I can't accept this ticket. For all I know, I'm just a brain in a vat."

  The officer sighs, hands him a pen, and says, "Write that down."

  The skeptic writes: *I am a brain in a vat.*

  **Officer:** "Read it aloud."

  **Skeptic:** "I am a brain in a vat."

  **Officer:** "Okay, great. You're not. Here's your ticket."

  **Skeptic:** "What? How do you know?"

  **Officer:** "I minored in Philosophy of Language. If you *were* a brain in a vat, your word 'vat' would only refer to electrical impulses, not actual vats. So the sentence would be false. The fact that you can coherently assert it proves you're not one. Now pay the fine before I cite you for misusing causal theory."

  ***

  **Why it works:** It relies on Putnam's specific semantic externalist argument that the sentence "I am a brain in a vat" is necessarily false when uttered by a brain in a vat (because their terms lack the causal connection to real vats required to make the statement true). The joke treats this linguistic self-refutation as a practical "gotcha" that disproves the skeptical hypothesis in the real world, which is exactly the kind of over-confident application of Putnam that makes epistemology students groan.
