      *   **Marcus's Position:** Emergentism/Systemic Selection. The lab's success is due to a selection effect (systemic filtering of personnel) that cannot be reduced to individual choices because those choices are shaped by the system itself. The failed sister lab proves the "system" matters more than the "rules."
      *   **Task:** Analyze the exchange *move by move*, assessing who has the better argument at each step. Do *not* declare an overall winner. Flag important points *neither* raises.
