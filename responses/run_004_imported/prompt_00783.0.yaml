      *   **Point 2: The Nature of the Commitment.**
          *   Elara argues for *precommitment*. You change your decision algorithm, not just your stated preferences.
          *   Marcus argues this is just changing your utility function. If you defend the surrogate, it *is* a goal.
      *   **Point 3: The "Transparency" Objection.**
          *   Marcus: A superintelligence reads source code. It sees `if threat then defend surrogate`. It knows *why* you have that line.
