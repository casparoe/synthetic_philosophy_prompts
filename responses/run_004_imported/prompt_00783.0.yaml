      *   *Elara's counter:* It's not about deception, it's about *policy*. My policy is "Protect Surrogate."
      *   *Marcus:* But *why* is that your policy? Because you value Real Goal. So threatening Real Goal leverages the policy.
      *   *Elara:* No, because I'm using Updateless Decision Theory. I choose the policy *before* I know which goal is threatened.
