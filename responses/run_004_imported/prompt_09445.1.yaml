answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. Two coffee cups sit untouched. Dr. Elena Rossi (Contemporary Molinist) and Dr. Thomas Moreau (Contemporary Bañezian Thomist) have agreed to record a conversation for a graduate seminar on Divine Providence.*

  **Dr. Moreau (CBT):** Let's begin with the logical structure, Elena. I want to state the grounding objection as sharply as I can, without the historical baggage. We are looking at Counterfactuals of Creaturely Freedom (CCFs). Take the proposition: *If Peter were in circumstance C, he would freely deny Christ.*

  For this to be an object of divine knowledge prior to the decree of creation—which is what Middle Knowledge requires—it must be true *before* Peter exists. But what makes it true? It cannot be logically necessary; Peter's denial is contingent. It cannot be made true by Peter's actual choice, because Peter doesn't exist yet. And it cannot be made true by God's will, because then the denial isn't free. So, at the "middle moment" of knowledge, there is no ontological ground for the truth value. If there is no truthmaker, there is no truth. If there is no truth, there is no knowledge. The Molinist posits a knowledge of non-existent relations.

  **Dr. Rossi (CM):** That is the standard Adams-Hasker formulation, Thomas. But notice what you've done: you've assumed a specific, highly restrictive theory of truthmaking that requires a *causal* or *existential* anchor in actuality for every contingent truth.

  My response isn't an appeal to mystery. It's an appeal to the metaphysics of essences. God knows His own essence perfectly. Included in His essence is His power to create and sustain any possible creature. When God knows Peter's possible essence, He knows exactly how that essence would actualize its causal powers in any given circumstance. The truthmaker for the CCF is the *possible essence* of Peter, known via God's supercomprehension. The relation isn't between two actual things, but between a possible nature and a possible circumstance, both fully present to the divine intellect.

  But here is my counter-challenge to you. You Thomists insist God has knowledge of future contingents—*Petrum negaturum* (Peter will deny). What is the truthmaker for *that* proposition before Peter exists? If you say "God's decree," you slide into determinism. If you say "Peter's future act," you posit a truthmaker that doesn't exist yet. You accept truth values for future contingents without actualized truthmakers. Why is your tolerance for future contingents not extended to counterfactual contingents? It seems your grounding objection is selective.

  **Dr. Moreau (CBT):** A fair probe. But the disanalogy holds. For the future contingent, the truthmaker is the *causal series* already in motion by God's decree. God decrees to move Peter's will in a specific way. The truth is grounded in the efficacy of the First Cause.

  In your Molinist schema, the truth of the CCF is independent of God's decree. It limits Him. You say God looks at the CCFs and decides which world to actualize. But if the CCFs are true independent of God, then there is a realm of modal truth outside God's causality. This brings me to the deeper issue you hinted at. You accuse me of determinism, but let's look at your alternative.

  If God actualizes a world based on Middle Knowledge, He knows exactly who will be saved and who will be damned before He creates. He creates Judas knowing Judas *will* betray Him. God could have actualized a world where Judas repents, but He didn't, because the CCFs dictated Judas would not. In what sense is God not still the author of sin? He knowingly actualizes the sinner.

  **Dr. Rossi (CM):** Now we are touching the nerve. But you are conflating *actualizing* with *causing*. In Molinism, God actualizes the circumstance, but the *mode* of the outcome—whether it is sin or virtue—is determined by the creature.

  This leads me to my offensive against your position, Thomas. You speak of God's decree moving the will. This is the doctrine of Physical Premotion (*praemotio physica*). You claim this is compatible with libertarian freedom. I find that incoherent.

  If the will is moved by a premotion that is intrinsically efficacious—meaning it *cannot* fail to produce the consent—then the will cannot do otherwise. If it cannot do otherwise, it is not free in the libertarian sense required for moral responsibility. The Jesuits accused the Dominicans of crypto-Calvinism for this reason. If grace is intrinsically efficacious, then when God withholds that specific premotion from the reprobate, He is positively willing their failure.

  In Molinism, grace is efficacious *extrinsically*, by virtue of God's foreknowledge that the creature will cooperate. God gives sufficient grace to all. If Peter sins, it is because Peter resists the grace, not because God withheld the "efficacious" push. This preserves God's universal salvific will. In your system, if God wills all to be saved, why does the intrinsically efficacious grace not extend to all?

  **Dr. Moreau (CBT):** You are framing premotion as a temporal push, a domino hitting another domino. It is not. It is ontological. God is the cause of the *act of willing* itself, not just the object. Without God's concurrence, the will is pure potency. It cannot act at all.

  When I say the premotion is intrinsically efficacious, I mean that God moves the will *according to its nature*. He moves the will *freely*. He causes the freedom of the act, not just the act. To say "the will could do otherwise" is true in the sense of *potency*, but false in the sense of *actuality* once God moves it. This is not Calvinism because Calvin posits a coercion of the will. I posit a causation of the will's own causality.

  But let's return to your claim about grace. You say Molinism preserves God's universal salvific will. I say it destroys the gratuity of grace. If grace becomes efficacious only because I, the creature, consent to it, then the ultimate differentiator between the saved and the lost is *me*, not God. I make grace efficacious. That is semi-Pelagianism.

  You ask why God doesn't give efficacious grace to all? He does give sufficient grace to all. But the efficacy depends on the alignment of the will with the First Cause. However, to answer your specific worry about reprobation: In Molinism, God knows via Middle Knowledge that if He creates Peter, Peter will damn himself. God creates Peter anyway. God knowingly creates a vessel of wrath. How is His responsibility lessened? He had the CCFs in front of Him. He chose the world with the reprobate in it. The CCFs don't absolve Him; they just inform His choice to damn.

  **Dr. Rossi (CM):** That is a strong point, but here is the distinction: In Molinism, the *defect* comes from the creature. God permits the sin, but does not cause the defect in the will. In your system, because God moves the will to every act, the distinction between permission and causation blurs.

  If the premotion determines the will to act, and the will acts sinfully, God moved the will to that act. You say He doesn't move it to the *sin*, only to the *act*, and the defect comes from the creature's limitation. But if the premotion is truly efficacious, why did the creature's limitation manifest *here* and not *there*? If God moves the will sufficiently to avoid sin, but the will sins, the premotion wasn't efficacious. If it was efficacious, the will didn't sin freely.

  It seems to me, Thomas, that your grounding objection at the start was really a proxy war. You didn't care about truthmakers per se. You cared that Molinism posits a truth about the creature that God does not cause.

  **Dr. Moreau (CBT):** Precisely. And that is where we should end. The grounding objection is the epistemological symptom of a metaphysical disease.

  **Dr. Rossi (CM):** Then let us state the core disagreement clearly for the students.

  **Dr. Moreau (CBT):** Agreed. From my perspective, the irreducible core is the **metaphysics of causality**. The Molinist treats God and creature as two agents on the same ontological level, dividing the work: God provides the circumstance, the creature provides the freedom. This makes God limited by the creature. The Thomist sees God as the cause of the creature's causality. The grounding objection arises because the Molinist cannot find a truthmaker for CCFs *within God*, because they insist the creature's freedom is a pocket of autonomy God does not touch. For me, the disagreement is about whether the creature has any causal power that is not ultimately caused by God.

  **Dr. Rossi (CM):** And from my perspective, the core is the **logic of control**. If God causes the causality of the free act, as you say, then the source of the act is ultimately God. I grant you need a truthmaker, but I locate it in the possible essence known by God, not in a divine decree that determines the will. The disagreement isn't just about semantics; it's about whether love requires the power of contrary choice that even God will not determine. The grounding objection is my way of saying: if you demand a truthmaker that involves God's will, you lose freedom. If you demand one that involves the creature, you lose eternity. I choose a truthmaker in the divine intellect that preserves the creature's veto. You choose a truthmaker in the divine will that preserves God's sovereignty. We are not arguing about logic; we are arguing about who holds the keys to the kingdom.

  **Dr. Moreau (CBT):** Then we agree on one thing: the grounding objection was never just about semantics. It was about sovereignty.

  **Dr. Rossi (CM):** And whether sovereignty is compatible with love.

  *[Recording ends.]*
