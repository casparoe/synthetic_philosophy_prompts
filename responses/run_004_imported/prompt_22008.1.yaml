answer: |-
  Here are 8 questions designed to probe the robustness, implementation, and theoretical limits of the guest's proposal, including the specific follow-ups you requested.

  **1. The Specific Failure Mode of Indifference**
  "You've argued that utility indifference is fundamentally doomed rather than just technically difficult. Could you pinpoint the exact mechanism of failure? Is it that indifference creates a 'manipulation incentive' where the agent influences the probability of shutdown to game the utility function, or is it a deeper issue about the agent's self-model?
  *   **Follow-up:** If you say it's a deeper issue about the self-model, why do you expect 'timestep dominance' to be immune? Doesn't any decision rule that isn't pure expected utility maximization create a similar incentive to self-modify into one that is, simply to remove the constraint?"

  **2. Instability Under Self-Modification (Required)**
  "A classic critique of safety constraints is that they aren't reflectively stable. Even if your timestep-dominance agent doesn't *currently* want to disable its off-switch, does it have an incentive to create a subagent or successor that *doesn't* follow timestep dominance? Essentially, if a standard EU-maximizer is more instrumentally efficient, won't your agent build one to do the actual work, thereby offloading the risk?
  *   **Follow-up:** If you argue the agent has no incentive to do this because it values the constraint, my follow-up is: Does Stochastic Gradient Descent (SGD) share that valuation? Even if the *agent* doesn't want to modify itself, won't the *training process* penalize the inefficiency of timestep dominance and select for weights that approximate a standard EU-maximizer?"

  **3. Preference Completion and Money Pumps (Required)**
  "There's a longstanding argument in decision theory that agents with incomplete preferences are vulnerable to money pumps, creating a pressure to 'complete' their preferences to ensure dynamic consistency. If your agent realizes it's vulnerable to cyclical trading or Dutch books, doesn't it have an instrumental incentive to self-modify into a standard EU-maximizer to close those loops? And if it does, doesn't it immediately regain the incentive to resist shutdown?
  *   **Follow-up:** If you respond that your specific formulation of timestep dominance blocks money pumps by definition, I'd ask: Is that formulation computationally tractable for a bounded agent? If checking for dominance is too expensive, won't the agent learn a heuristic that approximates it but accidentally completes the preferences?"

  **4. Scope of Corrigibility (Required)**
  "MIRI's original desiderata for corrigibility included not just tolerating shutdown, but actively assisting humans in correcting the agent's goals and motivations. Timestep dominance seems to solve the 'don't resist the off-switch' problem, but does it get you the 'want us to fix your goals' behavior? Or is this a narrower solution that leaves the agent indifferent to goal-correction, which might still be dangerous if it pursues misaligned goals aggressively until the moment it's turned off?
  *   **Follow-up:** If you concede this is only 'narrow' corrigibility, does that mean we need a separate mechanism for goal-alignment, or do you believe shutdown tolerance is the only bottleneck that actually matters for survival?"

  **5. Instrumental Convergence and Power-Seeking**
  "Most instrumental convergence theorems rely on the assumption of expected utility maximization over complete trajectories. By switching to timestep dominance, you're changing the optimization target. Do you have a proof or an intuition for why this specifically blocks power-seeking behaviors *before* the shutdown button is pressed? Or does the agent still seek power to ensure it can satisfy the dominance condition at future timesteps?
  *   **Follow-up:** If you say it still seeks some power, how do we distinguish between 'safe' instrumental goals (like self-preservation to finish a task) and 'unsafe' ones (like preventing humans from intervening) within your framework?"

  **6. Competitiveness and Capability Tax**
  "Restricting an agent's policy space to satisfy timestep dominance inevitably rules out some trajectories that a standard EU-maximizer would take. In a competitive landscape, if your safe agent is less capable or efficient than an unsafe EU-maximizer, developers might be incentivized to disable the constraint. Have you modeled the 'capability tax' of this approach, and is it low enough to be adoptable in a high-stakes environment?
  *   **Follow-up:** If you admit there is a significant cost, does that imply this solution requires global coordination to enforce, rather than being a technical fix a single lab can implement?"

  **7. Reflective Stability of the Rule Itself**
  "You're proposing a new decision rule to replace expected utility. But decision rules are themselves objects in the world that can be evaluated. If the agent evaluates its own decision rule using its own criteria, does 'timestep dominance' recommend itself? Or does it recommend switching to a different rule that yields higher reward, even if that rule violates dominance?
  *   **Follow-up:** If it recommends switching, isn't the proposal inherently unstable? If it doesn't, can you walk us through the fixed-point calculation that ensures the agent stays 'locked in' to this rule?"

  **8. Applicability to Neural Networks (Required Closing)**
  "Finally, all of this is framed in terms of decision theory, utilities, and preference orderings. But the systems we actually train are neural networks optimized by gradient descent, which don't have explicit utility functions or dominance rules coded in anywhere. They just have weights and activations. Why should we expect SGD to find a structure that behaves like 'incomplete preferences' rather than collapsing everything into a pseudo-utility function that approximates the training signal?
  *   **Follow-up:** If you answer that we can regularize or architect the network to enforce this, do we have any empirical evidence yet that such inductive biases survive scaling, or is this currently purely theoretical?"
