      *   **Scenario:** Elena (TA) checks a derivation. Low stakes (personal review) $\rightarrow$ "I know." High stakes (distributing to 300 students) $\rightarrow$ "I don't know." Evidence is held constant.
      *   **Characters:** Nora (argues for PE) vs. Owen (argues for Contextualism).
      *   **Task:**
          1.  Analyze the exchange move-by-move.
          2.  Determine who has the better argument at each stage.
          3.  Identify what both are missing.
          4.  Describe what a genuinely decisive case would look like.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Pragmatic Encroachment (PE):** Knowledge itself depends on practical factors (stakes, interests). $S$ knows $p$ only if $S$'s epistemic position is strong enough *given* $S$'s practical situation. Evidence can stay the same, but if stakes go up, knowledge can be lost. Key feature: The subject's stakes matter.
      *   **Contextualism:** The truth conditions of knowledge *attributions* ("S knows that p") depend on the context of the *attributor* (the speaker). In low-standards contexts, "S knows" is true. In high-standards contexts, "S knows" is false (even if S's evidence is the same). Key feature: The attributor's context/standards matter.
      *   **The Crux:** In the Elena case, Elena is the attributor *and* the subject. This creates a overlap. If Elena's stakes change, does her context change (Contextualism) or does the fact itself change (PE)?

  3.  **Analyze the Exchange Move-by-Move:**

      *   **Move 1: Nora's Initial Claim (PE).**
          *   *Argument:* Evidence constant. One person (Elena). No second speaker. Therefore, it's Elena's stakes driving the shift. This implies knowledge itself is sensitive to practical factors (PE).
          *   *Critique:* This is the standard "Bank Case" style intuition pump for PE. It looks strong because the subject and attributor are identical.
          *   *Verdict:* Strong initial case for PE.

      *   **Move 2: Owen's Counter (Contextualism).**
          *   *Argument:* The evaluator/narrator supplies the context. When *we* (Nora/Owen) discuss the high-stakes version, *our* standards rise. The shift happens in the attribution context, not necessarily in Elena's mind.
          *   *Critique:* This is a standard contextualist defense against self-attribution cases. Contextualists argue that when we evaluate Elena in the high-stakes scenario, *we* are in a high-standards context because the scenario description makes error possibilities salient to *us*.
          *   *Verdict:* Plausible, but relies on the idea that the *discussants'* context overrides the *subject's* self-attribution context.

      *   **Move 3: Nora's Reply (The "Proves Too Much" Objection).**
          *   *Argument:* If merely describing high stakes raises the narrator's standards, *no* case can distinguish PE from Contextualism. Every case must be narrated. This makes Contextualism unfalsifiable/indistinguishable in practice.
          *   *Critique:* This is a methodological objection. It attacks the testability of Contextualism. If the act of testing contaminates the result, the theory is problematic.
          *   *Verdict:* Very strong point. This is a known worry in the literature (the "data contamination" problem).

      *   **Move 4: Owen's Reply (Concession/Limitation).**
          *   *Argument:* Admits it's a cost (extensional equivalence) but not fatal. It's a known limitation of the debate. Doesn't justify preferring PE.
          *   *Critique:* Honest admission. Contextualists often concede that in "ordinary" high-stakes descriptions, the attributor's context shifts. They rely on more technical linguistic data (e.g., embedding, disagreement patterns) to distinguish.
          *   *Verdict:* Defensible, but concedes the dialectical point that this specific case doesn't settle it.

  4.  **Evaluate "Who Wins" at Each Stage:**
      *   *Move 1 (Nora):* Wins on intuition. The case is designed for PE.
      *   *Move 2 (Owen):* Wins on theoretical flexibility. Contextualism can absorb self-attribution cases by focusing on the evaluator.
      *   *Move 3 (Nora):* Wins on methodology. She exposes a verification problem for Owen.
      *   *Move 4 (Owen):* Draws/Stalemate. He survives but admits the case isn't decisive.

  5.  **Identify What They Are Missing:**
      *   **Subject-Sensitive Invariantism (SSI) vs. Contextualism:** They are treating PE and Contextualism as the only options. There's also Traditional Invariantism (denying the intuition that she loses knowledge).
      *   **The "Self-Attribution" Nuance:** Contextualists have specific responses to self-attribution (e.g., DeRose's "Single Scoreboard" semantics or the idea that Elena shifts her *own* context). Owen treats the *narrator's* context as decisive, but Elena is the speaker in the case. If Elena says "I don't know" in the high stakes, she is shifting her own context. Nora assumes this shift *is* PE. Owen assumes this shift is *contextual*. The distinction lies in *why* the context shifts. Is it because the truth conditions changed (PE) or because the semantic content of 'know' changed (Contextualism)?
      *   **Linguistic Data:** They are relying purely on case intuitions. The real debate often turns on linguistic behavior (disagreement, retraction, embedding under modals).
      *   **The "Stakes" Mechanism:** PE says stakes affect justification/warrant. Contextualism says stakes affect salience of error possibilities which shifts the semantic standard.

  6.  **Design a Decisive Case:**
      *   To distinguish them, we need a case where the *Subject's* stakes and the *Attributor's* stakes come apart.
      *   *Scenario:* Low stakes for Subject, High stakes for Attributor (and vice versa).
      *   *Contextualism Prediction:* Attributor's stakes determine truth of attribution.
      *   *PE Prediction:* Subject's stakes determine whether they know (and thus whether attribution is true).
