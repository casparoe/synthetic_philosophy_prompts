      *   *Better Test:* Third-party attribution. Nora says "Elena knows" while Elena is in high stakes.
          *   If Nora (low stakes) says "Elena knows" and it's true $\rightarrow$ Contextualism (Nora's context rules).
          *   If Nora (low stakes) says "Elena knows" and it's false (because Elena's stakes are high) $\rightarrow$ PE.
      *   *Even Better:* Retraction/Disagreement. If Elena says "I know" (low stakes), then stakes rise. Does she have to retract "I knew"?
          *   PE: No, she *did* know then.
          *   Contextualism: Tricky. Usually says no retraction needed if contexts differ, but some versions say yes.
      *   *Actually, the "Decisive" case is notoriously hard.* I need to explain *why* it's hard. The "Extensional Equivalence" point Owen made is real. To break it, we need linguistic data, not just case intuitions. E.g., "Elena knows, but she might be wrong." Contextualists say this can be true in low context. PE says this is contradictory if she knows.

  7.  **Drafting the Response:**
