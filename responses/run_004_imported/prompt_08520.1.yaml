      *   *Refining Nora's Move 3:* This is the strongest move. It's the "Methodological Objection."
      *   *Refining the "Decisive Case":* I need to be careful not to promise a case that doesn't exist. The literature generally agrees there isn't a "knock-down" empirical case yet. I should frame it as "what would be required" rather than "here is the case." The key is **divergent contexts**.

