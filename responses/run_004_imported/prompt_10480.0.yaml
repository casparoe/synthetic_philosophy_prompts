      *   *The "Why SG?" Logic:* If the threatener simulates you and sees you value SG = RG, they are indifferent. *However*, if you can make the SG *more visible* or *easier to verify* than the RG, they might target SG. Or, more commonly, the argument is that if *everyone* adopts SGs that are "safe" to sacrifice, then acausal trade becomes safer.
