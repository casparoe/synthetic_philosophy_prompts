      *   *Condition 2: Symmetry of Response.* You must respond to threats against the SG *exactly* as you would against the real goal. If you care less, the threatener targets the real goal.
      *   *Condition 3: Threatener's Rationality (Cost-Benefit).* The threatener wants to extract value, not just destroy. If threatening the SG yields the same compliance cost for you but lower risk/cost for them (maybe the SG is easier to simulate/attack?), they might switch. But crucially, if they threaten the *real* goal, you fight back just as hard. So they are indifferent *unless* there's a secondary reason to prefer the SG.
      *   *Condition 4: The "Shielding" Mechanism.* Why does the threatener pick the SG over the real goal?
