      *   *T's Calculation:* T simulates V. T sees that threatening SG triggers the same resistance as threatening RG. T is indifferent between threatening SG or RG *regarding V's resistance*.
      *   *Why SG?* If T threatens RG, V loses RG. If T threatens SG, V loses SG. V prefers losing SG (since SG is dummy). But T doesn't care about V's preference. T cares about T's cost.
