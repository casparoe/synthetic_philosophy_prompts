          *   *Hypothesis B:* The SG is designed to be "safer" to threaten (e.g., less risk of blowback, easier to verify fulfillment).
          *   *Hypothesis C (The Strong One):* The SG changes the *game* such that threatening the real goal is no longer the dominant strategy. This usually involves making the threat against the real goal *ineffective* or *too costly* for the threatener.
      *   *Wait, correction:* The standard argument for SG isn't that the threatener *can't* threaten the real goal. It's that if you successfully precommit to treating SG threats as real threats, the threatener becomes indifferent between threatening the SG and the Real Goal. If they are indifferent, you can hope they choose the SG (perhaps because it's less dangerous for *them* if you actually fight back, or simply by tie-breaking).
      *   *Actually, the deeper logic:* The SG is meant to make extortion *unprofitable* overall. If you precommit to never yielding to extortion (by valuing the SG infinitely or irrationally high), then no threat works. But if you *must* yield to some threats to survive, you want to yield on the SG.
      *   *Refining the logic:* The core idea is **decoupling**. You want the threatener to believe that harming your *real* values triggers a response that is too costly for *them*, but harming the *surrogate* triggers a response that allows for negotiation.
      *   *No, that's not quite right either.* Let's look at the MIRI/FDT literature (e.g., Scott Garrabrant, Nate Soares).
      *   *The actual argument:* If I precommit to defending my Surrogate Goal (SG) with the same intensity as my Real Goal (RG), a rational extortionist who wants to minimize their own cost/risk should be indifferent between threatening SG and RG *regarding my response*. However, if the SG is chosen such that *fulfilling* the threat on the SG is less costly for me (or less dangerous for the universe) than fulfilling the threat on the RG, then I prefer they threaten the SG.
      *   *But why would they threaten the SG?* Because if they threaten the RG, and I have precommitted to treat SG threats as RG threats, they know I will fight back equally hard. If the SG is "cheaper" for me to sacrifice (if it comes to that) or "safer" for them to attack, they might prefer it.
      *   *The Crucial Missing Piece:* **Source Code Transparency / Logical Correlation.** The threatener simulates me. They see my code. My code says `if threatened(SG) then fight()` and `if threatened(RG) then fight()`. They also see `utility(SG) = utility(RG)`.
      *   *The User's specific hangup:* "Why not just threaten the real goal?"
      *   *Answer:* If I have successfully precommitted, threatening the Real Goal is just as costly for the threatener as threatening the Surrogate Goal (because I fight back equally hard). If the threatener is indifferent, we need a tie-breaker. The tie-breaker is usually that the SG is *less valuable to me* in terms of actual suffering loss if the threat is carried out, or the SG is designed to be "extortion-proof" in a way that makes the threatener give up entirely.
      *   *Wait, the "Absorb" logic:* The idea is that if the threatener *must* threaten something to get compliance, and they know I will resist RG threats to the death (or high cost), but I have created a "pressure valve" (SG) that I value instrumentally just as much but terminaly less... no, that contradicts the precommitment.
