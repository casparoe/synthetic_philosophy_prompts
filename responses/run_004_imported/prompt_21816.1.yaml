prompt: |-
  I'm a PhD student in philosophy working on social ontology, and this term I've been sitting in on a reading group slowly working through David Lewis's *Convention*. Last week, two of the other regulars, Nadia and Elias, ended up in a disagreement that the rest of us just watched unfold rather than settle, and it's been nagging at me since. The question on the table was whether ordinary queueing — lining up at a bus stop or a coffee counter and being served in the order you arrived — is a genuine instance of a Lewis convention, or whether it only looks like one.

  (1) Nadia opened by arguing that queueing is about as clean a case as you could ask for: it is arbitrary, since a population could just as easily allocate service by lottery, by need, or by seniority; it persists purely because everyone expects everyone else to comply; and it would unravel the moment that expectation broke down — exactly the self-perpetuating structure Lewis attributes to a coordination equilibrium. (2) Elias objected that this skips over something load-bearing in Lewis's actual definition: a coordination equilibrium requires that no one would have done better by acting otherwise, given what everyone else does, and that's false of queueing, since whoever cuts to the front is always better off than if they had waited, regardless of how everyone else behaves — so "everyone queues" isn't a coordination equilibrium of the underlying game at all, and the practice holds together only because cutting gets punished with glares, confrontation, or worse. (3) Nadia replied that plenty of paradigm Lewis conventions share this feature: in the meeting-place case, I might privately prefer that you come find me rather than the reverse, and with a shared language, someone might privately gain from lying to me — yet Lewis doesn't treat a little private incentive to deviate as disqualifying, since all he requires is that coincidence of interest predominate, not that conflict be wholly absent. (4) Elias came back that the cases aren't parallel: in the meeting-place and language cases, the private incentive concerns which equilibrium obtains or how it gets used once it's in place, whereas queue-jumping is a standing incentive to defect from the equilibrium itself no matter which regularity is in force — which is exactly why theorists like Ullmann-Margalit treat sanction-backed norms of this kind as a separate category from coordination conventions proper. (5) Nadia's rejoinder was that this concedes too much to labels: a practice that is still arbitrary, still sustained by precedent, and still dependent on common knowledge doesn't stop being a coordination convention just because sanctions are doing some of the stabilizing work — for all Elias has shown, the sanctions might be how a fragile coordination equilibrium gets made stable, rather than proof that no coordination equilibrium was ever there to begin with.

  Could you adjudicate this move by move? For each of the five moves, I'd like to know whether it represents Lewis's actual view correctly and whether it succeeds dialectically against what came just before it, and then a final verdict on whether queueing, as they've described it, satisfies Lewis's definition of a convention — along with anything you think both Nadia and Elias are overlooking.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** PhD student in philosophy (social ontology).
      *   **Context:** Reading group on David Lewis's *Convention*.
      *   **Topic:** Is ordinary queueing a Lewisian convention?
      *   **Debate:** Nadia (Yes) vs. Elias (No).
      *   **Task:** Adjudicate the 5 moves in the debate (accuracy regarding Lewis, dialectical success), give a final verdict on queueing, and identify overlooked elements.
      *   **Tone:** Academic, precise, nuanced, suitable for a PhD level.

  2.  **Deconstruct the Debate Moves:**

      *   **Move 1 (Nadia):** Queueing is arbitrary, expectation-based, and self-perpetuating (coordination equilibrium).
          *   *Lewis Accuracy:* High. Lewis emphasizes arbitrariness, common knowledge of expectations, and coordination equilibrium.
          *   *Dialectical Success:* Sets the stage well. Captures the intuitive "convention-like" nature.
          *   *Weakness:* Assumes it *is* a coordination equilibrium without proving it against the free-rider problem.

      *   **Move 2 (Elias):** Queueing isn't a coordination equilibrium because cutting is a dominant strategy (Prisoner's Dilemma structure). Sanctions are needed, implying it's not pure coordination.
          *   *Lewis Accuracy:* Mixed. Lewis *does* require a coordination equilibrium (CE). If cutting is always better, it's not a CE. However, Lewis acknowledges preferences can be conditional. Elias identifies the "free-rider" problem.
          *   *Dialectical Success:* Strong objection. Hits the technical definition of CE. If $U(\text{cut}) > U(\text{wait})$ regardless of others, it's not a CE.
          *   *Weakness:* Assumes preferences are fixed independently of the norm/sanctions.

      *   **Move 3 (Nadia):** Lewis allows for conflicting preferences (meeting place, language/lying). Coincidence of interest need only "predominate."
          *   *Lewis Accuracy:* Accurate. Lewis explicitly discusses mixed motives (e.g., *Convention*, p. 76-78 regarding "impure" coordination). He distinguishes between coordination problems and mixed-motive games but allows conventions in the latter if coordination is the main driver.
          *   *Dialectical Success:* Good counter. Points out Elias is setting the bar too high (pure coordination vs. mixed motive).
          *   *Weakness:* Might be conflating preference over *which* equilibrium (meeting place) with preference to *defect* from the equilibrium (lying/cutting).

      *   **Move 4 (Elias):** Distinction between preference over *which* equilibrium vs. preference to *defect*. Queue-jumping is defection. Cites Ullmann-Margalit (norms vs. conventions).
          *   *Lewis Accuracy:* Very High. This is the crux. Lewis defines convention based on Coordination Equilibria. If the underlying game is PD, it's not a Lewis convention *strictly speaking*, though it might evolve into one. Ullmann-Margalit distinguishes "sum-optima" (conventions) from "inertia" or norms backed by sanctions.
          *   *Dialectical Success:* Strongest point. Distinguishes the *structure* of the game. If sanctions are required to make waiting preferable to cutting, the *bare* regularity isn't a CE.
          *   *Weakness:* Might be too rigid about the "pre-sanction" state.

      *   **Move 5 (Nadia):** Sanctions stabilize a fragile CE; arbitrariness and common knowledge remain. Don't let labels override the phenomenon.
          *   *Lewis Accuracy:* Plausible extension. Lewis discusses how conventions evolve and stabilize. If sanctions change the payoff structure to *make* it a CE, then it becomes one.
          *   *Dialectical Success:* Good synthesis. Suggests the *system* (queueing + sanctions) creates the CE.
          *   *Weakness:* Risks circularity. If sanctions are needed, was it ever a convention, or is it a norm that *becomes* conventional?

  3.  **Evaluate Lewis's Actual View (Deep Dive):**
      *   *Definition:* A regularity $R$ in population $P$ is a convention if:
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ on condition that others do (Coordination Equilibrium).
          4.  There is an alternative regularity $R'$.
          5.  (Common Knowledge of 1-4).
      *   *Crucial Point:* Condition 3 is the killer. Is queueing a CE?
      *   *The "Free Rider" Problem:* In a pure queue without sanctions, cutting is often a dominant strategy (I get coffee faster, no cost). If so, Condition 3 fails.
      *   *Lewis on Norms/Sanctions:* Lewis acknowledges that conventions can be supported by sanctions, but the *preference to conform* must exist conditional on others conforming. If the preference only exists *because* of sanctions, is it still a convention? Lewis tends to think conventions solve coordination problems, not Prisoner's Dilemmas. However, repeated interactions can transform PD into Coordination problems (via reputation, etc.).
      *   *Ullmann-Margalit:* She argues some norms are "ineliminable" (PD structure) vs. conventions (Coordination structure). Elias is channeling her.

  4.  **Synthesize the Verdict:**
      *   Queueing is likely a "hybrid." It starts as a coordination problem (we all want to get on the bus without crushing each other), but has PD elements (I want to be first).
      *   Lewis's definition is strict. If sanctions are *necessary* for compliance, it leans toward a social norm rather than a pure convention.
      *   However, most real-world conventions have *some* sanctioning.
      *   *Best Philosophical Take:* Queueing is a convention *supported* by norms. The underlying coordination interest (orderly boarding) makes the convention possible; the sanctions handle the marginal defection.
      *   *Overlooked:* The role of *common knowledge* in the sanctioning itself. The "glare" is a signal. Also, the distinction between the *practice* and the *game structure*.

  5.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the sophistication of the debate. It's a classic problem in social ontology.
      *   *Move-by-Move:*
          *   (1) Nadia: Accurate on intuition, weak on technical definition (assumes CE).
          *   (2) Elias: Technically sharp on CE definition. Correctly identifies the PD structure.
          *   (3) Nadia: Correct on Lewis's "mixed motive" allowance. But misses the structural difference (equilibrium selection vs. equilibrium maintenance).
          *   (4) Elias: Strongest move. Distinguishes coordination from compliance problems. Ullmann-Margalit reference is apt.
          *   (5) Nadia: Good pragmatic pushback. Sanctions can transform payoffs.
      *   *Final Verdict:* It satisfies Lewis's definition *only if* we include the sanctions as part of the payoff structure. If we look at the raw physical act, it's often a PD. If we look at the social practice (including shame), it's a CE.
      *   *Overlooked:* The evolutionary aspect (Lewis touches on this in later work/postscripts). The distinction between *constitutive* rules and *regulative* rules (Searle angle, though maybe keep it Lewis-focused). The role of *common knowledge of sanctions*.

  6.  **Refining for PhD Level:**
      *   Use precise terminology (Coordination Equilibrium, Prisoner's Dilemma, Payoff Matrix, Common Knowledge).
      *   Reference specific sections of *Convention* if possible (e.g., the definition on p. 76, the discussion of norms).
      *   Ensure the distinction between "Convention" and "Social Norm" is clear, as this is the heart of the Elias/Nadia split.
      *   *Self-Correction on Move 3:* Nadia cites lying. Lewis actually discusses truthfulness as a convention. Lying is a defection. Nadia is right that conventions exist despite potential defection, but Elias is right that if defection is the *dominant* strategy without sanctions, the base game isn't coordination. I need to be careful here. Lewis treats language as a convention despite the possibility of lying, because the *system* of truthfulness is a CE. Queueing is analogous.
      *   *Correction on Move 4:* Elias's distinction is vital. In language, I prefer you speak English *and* I speak English. In queueing, I prefer I cut *and* you wait. This is the difference between a Coordination Game and an Assurance Game vs. PD.
      *   *Final Verdict Nuance:* Queueing is a convention *sustained* by normative sanctions. Lewis allows for this, provided the conditional preference holds.

  7.  **Final Polish:** Check tone. Ensure it's helpful, not just corrective. Highlight what the PhD student can take from this for their own work. (e.g., The "hybrid" nature of social ontology cases).

  *(Self-Correction during drafting)*: Wait, I need to check Lewis on "arbitrariness." Nadia mentions it. Lewis requires an alternative $R'$. Queueing has alternatives (lottery, scramble). That part is solid. The main friction is Condition 3 (Conditional Preference).

  Let's structure the response clearly: Move-by-Move Analysis, Final Verdict, Overlooked Considerations.

  *Move 1:* Nadia is right on the "folk" definition, but glosses over the game theory.
  *Move 2:* Elias is right on the game theory. If cutting pays, it's not a CE.
  *Move 3:* Nadia is right that Lewis allows mixed motives, but Elias will counter that the *type* of mixed motive matters.
  *Move 4:* Elias nails the distinction between "Which Equilibrium?" (Coordination) and "Defect or Comply?" (Compliance/Norm).
  *Move 5:* Nadia saves the convention view by expanding the "game" to include social costs.

  *Verdict:* It is a convention *if* the social sanctions are internalized into the utility function. If not, it's a norm solving a PD. Lewis leans toward the former in practice, but the latter theoretically.

  *Overlooked:* The evolutionary stability. The fact that "glaring" is itself a coordination problem (why should I glare if it costs me energy?). This leads to second-order free rider problems.

  Okay, ready to write.
answer: |-
  This is a sophisticated exchange that cuts to the heart of the distinction between *conventions* (in the Lewisian sense) and *social norms* (in the Ullmann-Margalit or Bicchieri sense). As a PhD student in social ontology, you are right to feel that this disagreement is not merely terminological; it concerns the game-theoretic structure of the social practices we study.

  Here is an adjudication of the five moves, followed by a verdict on queueing and a discussion of what remains overlooked.

  ### Move-by-Move Adjudication

  **(1) Nadia: The Intuitive Case**
  *   **Lewis Accuracy:** **High on intuition, Low on technical precision.** Nadia correctly identifies the three hallmarks of a Lewisian convention: arbitrariness (alternative regularities were possible), expectation-dependence (I queue because I expect you to), and self-perpetuation. She accurately captures the *phenomenology* of convention.
  *   **Dialectical Success:** **Moderate.** She sets the burden of proof correctly: queueing *looks* and *acts* like a convention. However, she asserts that queueing constitutes a "coordination equilibrium" without demonstrating *why* the payoff structure supports that claim. She assumes the conclusion she needs to prove (that conforming is preferable given others conform).

  **(2) Elias: The Game-Theoretic Objection**
  *   **Lewis Accuracy:** **Very High.** Elias zeroes in on Lewis's formal definition of a coordination equilibrium (CE). For $R$ to be a CE, every agent must prefer to conform to $R$ *on the condition* that others conform. Elias argues that in queueing, the preference ordering is often $U(\text{Cut}) > U(\text{Wait})$ regardless of what others do (a dominant strategy), which characterizes a Prisoner's Dilemma (PD) or a Free-Rider problem, not a Coordination Problem. If sanctions are required to flip the preference, the *bare regularity* is not a CE.
  *   **Dialectical Success:** **Strong.** This is the standard objection to classifying moral or normative regularities as Lewisian conventions. If the practice collapses without external enforcement (glares, confrontation), it suggests the underlying game is not one of pure coordination.

  **(3) Nadia: The Mixed-Motive Defense**
  *   **Lewis Accuracy:** **High.** Nadia is correct that Lewis does not require *pure* coordination. In *Convention* (pp. 76–78), Lewis acknowledges "impure" coordination problems where agents have secondary preferences (e.g., I prefer we meet at Grand Central, but I prefer *you* come to me). He also discusses language: the convention of truthfulness exists despite the occasional incentive to lie. Lewis requires that the coincidence of interest *predominate*.
  *   **Dialectical Success:** **Moderate/Weak.** While accurate to Lewis, this move conflates two types of conflicting preferences. In the meeting-place case, the conflict is over *which* coordination equilibrium to select (Grand Central vs. Penn Station). In the queueing case, the conflict is over *whether to comply* with the selected equilibrium. Elias will rightly argue that an incentive to lie (defect) is parasitic on the convention of truthfulness (the CE), whereas an incentive to cut is an incentive to destroy the CE itself.

  **(4) Elias: The Structural Distinction (Ullmann-Margalit)**
  *   **Lewis Accuracy:** **Very High.** Elias invokes a crucial distinction found in Edna Ullmann-Margalit's *The Emergence of Norms*. She distinguishes between **conventions** (solutions to Coordination Problems where everyone prefers everyone else to comply) and **norms** (solutions to Prisoner's Dilemmas or Assurance Problems where compliance requires sanctioning). Elias argues queueing is the latter: the incentive to defect is structural, not incidental.
  *   **Dialectical Success:** **Very Strong.** This is the strongest move in the debate. It clarifies that Lewisian conventions are defined by the *payoff structure* of the equilibrium, not just the presence of regularity and expectation. If the equilibrium is only stable because of added sanctions (negative utility for cutting), then the *unsanctioned* regularity was never a Lewisian convention to begin with.

  **(5) Nadia: The Stabilization Reply**
  *   **Lewis Accuracy:** **Plausible Extension.** Nadia argues that sanctions can be part of the system that *creates* the coordination equilibrium. Lewis allows that conventions evolve and that preferences can be endogenous. If the "glares" are common knowledge and sufficiently costly, they alter the payoff matrix such that $U(\text{Wait}) > U(\text{Cut})$. Once that threshold is crossed, it *becomes* a CE.
  *   **Dialectical Success:** **Strong.** This saves the convention account from being too fragile. It suggests that we should evaluate the game *including* the normative sanctions as part of the social context. If the sanctions are informal and decentralized (part of the practice itself), the practice *as a whole* satisfies the CE condition.

  ---

  ### Final Verdict: Is Queueing a Lewisian Convention?

  **Verdict:** Queueing is a **hybrid case**, but it satisfies Lewis's definition **only if** the informal sanctions are treated as intrinsic to the payoff structure of the practice.

  If you model queueing as a one-shot game of physical positioning where time is money and there are no social consequences, Elias is right: it is a Prisoner's Dilemma, and "everyone queues" is not a Nash Equilibrium, let alone a Coordination Equilibrium.

  However, Lewis is interested in *actual* human populations, not abstract agents. In human populations, "glares," "shame," and "confrontation" are real costs. If these social costs are common knowledge and sufficiently high, they transform the payoff matrix.
  *   **Condition 3 (Conditional Preference):** Do I prefer to wait given that you wait? Yes, *because* if I cut, I incur a social cost (shame/conflict) that outweighs the time saved.
  *   **Condition 4 (Arbitrariness):** Could we have done otherwise? Yes (lottery, scramble).

  Therefore, queueing **is** a Lewisian convention, but it is a **norm-backed convention**. Nadia wins on the ontology of the practice as it actually exists; Elias wins on the abstract game theory of the unsanctioned interaction.

  For a social ontologist, the crucial takeaway is that Lewisian conventions in the wild are rarely "pure." They are almost always stabilized by normative expectations that function as soft sanctions. Lewis's definition is robust enough to include them, provided we recognize that the "preferences" in Condition 3 include the disutility of social friction.

  ---

  ### What Nadia and Elias Are Overlooking

  As you develop your own work, there are three nuances in this debate that both participants arguably missed:

  **1. The Second-Order Coordination Problem (Sanctioning)**
  Elias treats sanctions (glares, confrontation) as exogenous enforcement mechanisms. But why do *I* glare at a queue-jumper? Glaring costs me energy and risks conflict. If everyone prefers *someone else* to sanction the jumper, then sanctioning is itself a Public Good problem (a second-order PD).
  *   **Implication:** If sanctioning is not a coordination equilibrium (i.e., we don't coordinate on *who* punishes), the convention is unstable. Lewis touches on this in his discussion of "normative words," but a full social ontology of queueing must explain why sanctioning is itself conventionalized (e.g., "It's the person directly behind the jumper's place to speak up").

  **2. The Assurance Game vs. Prisoner's Dilemma**
  Elias assumes queueing is a PD (Cutting is *always* better). But for many people, queueing is an **Assurance Game**. I prefer to queue *if* you queue, because I value fairness or dislike conflict more than I value saving 30 seconds. I only cut if I think *everyone else* is cutting (a scramble).
  *   **Implication:** If the population is mostly Assurance-type players, queueing is a genuine Coordination Equilibrium without heavy sanctions. The "glares" are only needed for the minority of PD-type players. Lewis's definition holds more easily here. The debate turns on the empirical distribution of preference types in the population.

  **3. Common Knowledge of the Sanctions**
  Lewis's definition relies heavily on **common knowledge** (Condition 5). It is not enough that I prefer to wait because I fear a glare. It must be common knowledge that *you* know that *I* know that glares are forthcoming.
  *   **Implication:** The convention isn't just the queuing; it's the common knowledge of the *enforcement mechanism*. Nadia hints at this, but Elias treats sanctions as external force. In Lewis's framework, the sanctions work *because* they are part of the shared expectation system. If the sanctions were purely physical (a turnstile), it wouldn't be a convention; it would be a constraint. The fact that the sanctions are social (glares) makes them part of the convention itself.

  ### Recommendation for Your Work
  Since you are working in social ontology, this debate highlights a methodological choice: Do you define social kinds by their **underlying game structure** (Elias's approach, which risks excluding many real-world cases as "impure") or by their **functional role in social life** (Nadia's approach, which risks over-including norms as conventions)?

  Lewis ultimately favors the functional role, provided the conditional preference holds. You might argue that the distinction between "Convention" and "Norm" is not a binary ontological divide, but a spectrum of how much weight is carried by coordination interests versus sanctioning interests. Queueing sits in the middle: coordination makes it possible; sanctions make it robust.
