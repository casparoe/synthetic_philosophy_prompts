answer: |-
  Here are ten interview questions designed to probe the structural and philosophical integrity of Kepler's astrological physics, tailored for a host with a background in theoretical physics.

  **1. The Mechanism of *Species***
  In your reading of *De Fundamentis*, you argue that Kepler's astrology is continuous with his optics. He proposes that the planets emit a *species*—a form or likeness—that travels to Earth like light. As a physicist, I look for a decay law or an interaction cross-section. Does Kepler offer a quantitative account of how this astrological *species* attenuates over distance, or does the "physics" stop at the metaphor of radiation?
  *   **Follow-up:** If she argues the lack of quantification is typical for the era, ask: *"But Kepler quantified the orbit of Mars to eight minutes of arc. Why does the precision of the 'vehicle' (the orbit) so drastically outstrip the precision of the 'force' (the aspect) if they are part of the same causal chain?"*

  **2. Natural vs. Judicial Astrology (Mandatory Topic 1)**
  Kepler draws a sharp line between "natural" astrology (weather, tides, physical impulses) and "judicial" astrology (predicting specific human choices or political events), which he scorned. Given that he relied on patronage from figures who demanded judicial predictions, is this distinction a principled ontological boundary based on the limits of physical causation, or is it a strategic, face-saving redraw of an older boundary to protect his scientific reputation?
  *   **Follow-up:** If she argues it is principled, ask: *"If the soul is physically impelled by harmonic angles, as he claims, where exactly does the 'necessity' of the physical impulse end and the 'freedom' of the human will begin? Is that boundary any less arbitrary than the one he critiques in Ptolemy?"*

  **3. The Soul as the Receiver**
  In Book 4 of the *Harmonices Mundi*, Kepler shifts the causal burden from the stars to the Earth's soul (or the individual human soul), suggesting the heavens only offer geometric stimuli that the soul *perceives*. Does this move save his physics from falsification by making the effect subjective, or is this a genuine anticipation of psychophysics where the observer is part of the system?
  *   **Follow-up:** If she suggests it is a genuine anticipation of psychophysics, ask: *"In modern psychophysics, we can correlate stimulus and response. Did Kepler have any method for calibrating the 'soul's sensitivity' independent of the very astrological events he was trying to explain?"*

  **4. Harmonic Causality and the Quintile (Mandatory Topic 2)**
  I want to press on the causal story behind his harmonic theory of aspects. He argues that specific angles imprint on the soul because they correspond to consonant harmonic ratios. He even adds the quintile (72 degrees) to the traditional set because it fits the geometry. But why should a geometric ratio, perceived by a soul, cause a physical event like a storm or a war? What is the actual transduction mechanism from "perceived harmony" to "terrestrial change"?
  *   **Follow-up:** If she argues the mechanism is archetypal or metaphysical rather than mechanical, ask: *"If the mechanism is metaphysical, does that not break the continuity with his physics that your thesis relies on? Can a research program be 'physical' if its causal links are ultimately aesthetic?"*

  **5. Empiricism in *Tertius Interveniens***
  In *Tertius Interveniens*, Kepler defends astrology against skeptics by appealing to empirical evidence, specifically weather patterns and historical conjunctions. However, he also admits the data is noisy and corrupt. How does he handle falsification in this text? Does he treat negative instances as refutations of the theory, or as errors in the observational record?
  *   **Follow-up:** If she says he treats them as observational errors, ask: *"That sounds remarkably like the ad hoc hypotheses Lakatos warned against. At what point does protecting the 'hard core' of the theory from data turn a research program from progressive to degenerating?"*

  **6. The Calendar Paradox (Mandatory Topic 3)**
  There is a well-documented tension between Kepler's theoretical defense of astrology and his private correspondence, where he admits to producing astrological calendars primarily because his patrons paid for them, often doubting the specific predictions. How do you reconcile this pragmatic fabrication with the claim that this was a "rigorously argued research program"? Can a program be rigorous if its primary output is known by its author to be probabilistic at best?
  *   **Follow-up:** If she argues he believed in the *probability* even if not the certainty, ask: *"But if the probabilities were too low to trust personally, yet high enough to sell to patrons, doesn't that suggest the 'research program' was economically viable precisely because it was scientifically underdetermined?"*

  **7. The Role of *De Fundamentis* as Reform**
  You position *De Fundamentis Astrologiae Certioribus* as a reform document intended to purge astrology of superstition. In your view, was Kepler trying to save astrology by making it more physical, or was he trying to save physics by using astrology as a funding vehicle? Is the "reform" internal to the discipline, or is it a colonization of astrology by the new astronomy?
  *   **Follow-up:** If she argues it is a colonization, ask: *"If astrology was merely a shell for his physics, why did he persist in the specific harmonic arguments of Book 4 of the *Harmonices* decades later, when the physics of the *Rudolphine Tables* could have stood alone?"*

  **8. Lakatosian Evaluation**
  Using Imre Lakatos's terminology, you describe Kepler's astrology as a research program. In a progressive program, the theory predicts novel facts. Did Kepler's astrological physics predict any novel phenomena that were subsequently confirmed, or did it only retrospectively accommodate known weather and historical events?
  *   **Follow-up:** If she cites the weather predictions, ask: *"Weather prediction was common practice long before Kepler. Did his harmonic method actually outperform the traditional rule-of-thumb methods of his contemporaries, or was it just more mathematically elegant?"*

  **9. The Demarcation Problem**
  If we accept your thesis that Kepler's astrology was a rational, physical research program, why do we classify it today as pseudoscience while classifying his optics as science? Is the demarcation line simply that we now know the causal mechanism (harmonic angles on souls) doesn't exist, or is there a methodological flaw in the astrology that wasn't present in the optics?
  *   **Follow-up:** If she says it's just the ontology that changed, ask: *"If the methodology was sound but the ontology was wrong, does that mean we should view his astrology as a 'failed physics' rather than 'non-science'? And does that change how we teach the history of the scientific revolution?"*

  **10. Scaffolding or Foundation?**
  Finally, did the astrological work serve as scaffolding that allowed him to build the new physics, which was then kicked away, or was the astrology a foundational belief that structured his entire worldview? If the latter, does removing the astrology from our understanding of Kepler leave us with an incomplete picture of his motivation for seeking harmony in the first place?
  *   **Follow-up:** If she argues it is foundational, ask: *"If the search for harmony drove both the physics and the astrology, does that imply that the 'Scientific Revolution' was driven as much by a desire for metaphysical order as by empirical rigor?"*
