answer: |-
  Good morning. For those who don't know me, I'm the writer embedded with the lab. Our keynote is unfortunately indisposed, so you're stuck with the translator.

  I want to start by addressing the comment three of you have already made to me over coffee: that Fodor and Pylyshyn settled this in 1988. You argued then that connectionist networks lack the combinatorial syntax required for genuine thought, and that finding patterns in weights is just finding shadows on a cave wall.

  You were right about the networks of 1988. You might be right about today's. But the mechanistic interpretability researchers in this room believe they have a new tool that changes the empirical grounds of that debate. They aren't arguing that networks behave *as if* they represent; they are arguing they have found the *mechanism* of the representation.

  So, let's be plain about what we are disagreeing on. We are not here to negotiate the definition of "representation." I promised this speech would not end with "it depends what you mean by that word." We know what we mean. We mean: Is there a causal structure inside the model that corresponds to the concept, or is there only a statistical regularity that we are labeling post-hoc?

  The battleground is **superposition**.

  We know neural networks operate in superposition. They store more features than they have neurons. A single neuron might fire for "dogs," "past tense verbs," and "images containing the color blue." To the classic philosopher, this looks like a category error. It looks like noise. It looks like the network is merely approximating a function without internal structure.

  The interpretability researcher says: "No. The structure is there, it's just compressed."

  They use **Sparse Autoencoders (SAEs)** to disentangle this mess. They take that polysemantic neuron and mathematically decompose it into thousands of distinct, monosemantic features. They find a feature that fires exclusively for "mentions of inheritance law in 19th-century novels." They intervene on that feature. They ablate it. The model stops discussing inheritance law.

  The researcher says: "I have found the symbol. I have touched the gear that turns the concept."

  The philosopher says: "You have found a direction in a high-dimensional vector space that correlates with that topic. You haven't found a symbol; you've found a cluster."

  This is the specific disagreement. It is not about behavior. We agree the model behaves intelligently. It is about **ontological commitment**.

  When an SAE extracts a feature, is it discovering a natural kind that exists within the computational graph? Or is the SAE merely a lossy compression algorithm that imposes human-readable boundaries on a continuous, alien mathematical space to make it legible to us?

  If I use a SAE to find "feature 994" and it looks like "deception," and I intervene and the deception stops, the researcher claims they have located the mechanism of deception. The philosopher claims they have located a leverage point in a behavioral disposition. The difference matters. If it is a mechanism, it is robust. It should transfer across contexts. It should compose. If it is a leverage point, it is fragile. It is a hack we found in the weights, not a module the network built for itself.

  Fodor demanded compositionality. He said you can't get systematic thought from distributed activation. The MI lab claims SAEs recover compositionality from the distributed soup. They claim these features combine like lego bricks, not like blended smoothies.

  Our job for the next two days is not to define terms. It is to audit the bricks.

  When we look at a circuit, are we looking at the network's native code, or are we looking at a translation layer we built to comfort ourselves? If we ablate a feature and the behavior changes, that is causality. But is it *semantic* causality, or just *statistical* causality that mimics semantics?

  The researchers believe the structure is real, waiting to be reverse-engineered. The philosophers suspect the structure is a projection, a Rorschach test where the inkblot is high-dimensional calculus and the image is human psychology.

  We are not here to agree on a dictionary. We are here to decide if the map matches the territory, or if we are just drawing better maps of the fog.

  Let's get to work.
