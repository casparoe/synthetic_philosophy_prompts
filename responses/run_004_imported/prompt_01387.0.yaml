answer: |-
  This is a delicious piece of real-world irony, and you are right to feel that your department is walking into a trap that the literature spent the better part of the 20th century mapping out. The procedure your personnel committee has designed is not just "hard to defend"; it is technically incoherent according to the very frameworks your seminar covers.

  The core issue is that the committee is attempting to maximize a social welfare function (SWF) using input data that lacks the informational structure required to make that maximization meaningful. They are treating self-reported cardinal utilities as if they are **Cardinally Measurable and Fully Comparable (CMFC)**, when the procedure guarantees they are at best **Ordinally Measurable and Non-Comparable (ONC)**, and practically speaking, strategically corrupted.

  Here is an argument structured for your meeting, moving from the Robbinsian critique of the data to the Harsanyi/Sen critique of the aggregation, and finally to the Arrowian alternative.

  ### 1. The Robbinsian Objection: The Category Error
  Robbins's 1938 critique (*Interpersonal Comparisons of Utility: A Comment*) is the first line of defense. Robbins argued that utility is a mental state, and while I can observe my own, I cannot observe yours. Therefore, any statement like "Prof. A benefits more than Prof. B" is not a scientific proposition but an ethical one.

  **The Departmental Application:**
  The form asks for a number (0–100). This implies **cardinality**. It assumes that the distance between 40 and 50 for Prof. A is the same *kind* of magnitude as the distance between 40 and 50 for Prof. B.
  *   **The Argument:** "By asking for a 0–100 score, we are pretending to collect scientific data. But per Robbins, there is no intersubjective meter stick for 'research benefit.' A '100' for me might mean 'I will publish one paper,' while for a colleague it might mean 'I will write a book.' Unless we define the unit of measurement (e.g., '1 point = 1 citation impact'), these numbers are scientifically meaningless. We are not aggregating data; we are aggregating value judgments disguised as data."

  ### 2. The Harsanyi/Sen/Weymark Trap: Normalization and Weights
  Your department is implicitly trying to use a **Utilitarian SWF**: $W = \sum U_i$. They hope to identify $\max(U_i)$.
  Harsanyi's Aggregation Theorem (1955) shows that if individual preferences satisfy vNM axioms and the social ranking satisfies Pareto and IIA, the SWF must be a weighted sum of individual utilities: $W = \sum a_i U_i$.

  **The Catch (Sen & Weymark):**
  Harsanyi's theorem relies on individual utility functions being unique only up to positive affine transformation ($U^*_i = \alpha_i U_i + \beta_i$). To sum them, you must fix the zeros ($\beta$) and the units ($\alpha$) across persons.
  *   **Weymark's Critique:** The weights $a_i$ are not derived from facts; they are ethical parameters.
  *   **The Departmental Application:** The form attempts to fix the zero (0 = no benefit) and the unit (1/100th of the scale) administratively. But it fails to achieve **Unit Comparability**.
      *   **Inflation:** If I know the highest number wins, my dominant strategy is to report 100, regardless of actual benefit. This is not just "gaming the system"; it destroys the **cardinal** information required for Harsanyi's sum. If everyone reports 100, the variance is zero, and the SWF cannot distinguish between states.
      *   **Scale Calibration:** Even if everyone is honest, without a common anchor, the weights are arbitrary. If Prof. A is modest (rates a huge benefit as 60) and Prof. B is hyperbolic (rates a minor benefit as 90), the procedure systematically biases the leave toward the hyperbolic. As Sen argued in *On Economic Inequality* (1973), without a rule for normalization, the aggregation is arbitrary. The committee is effectively assigning weights based on "who is more dramatic," not "who benefits more."

  ### 3. The Arrowian Alternative: Extended Sympathy
  In the second edition of *Social Choice and Individual Values* (1963), Arrow suggested that if we must make comparisons, we should do so via **Extended Sympathy**: comparing $(x, i)$ to $(y, j)$. That is, "Is state $x$ for person $i$ better than state $y$ for person $j$?"

  **The Departmental Application:**
  The current form asks for $U_i(\text{Leave}) - U_i(\text{Status Quo})$. It asks the *individual* to make the comparison.
  *   **The Argument:** "We are outsourcing the ethical judgment to the applicants. Arrow's 'extended sympathy' suggests the correct procedure is for the *committee* to rank the states: 'Is (Prof. A with Leave) better than (Prof. B with Leave)?' The committee has a shared language of evaluation (publication records, grant potential, career stage). The applicants do not. By asking applicants to self-rate, we are asking them to speak private languages. We should be the ones making the interpersonal comparison, explicitly, based on observable metrics, rather than hiding behind uncalibrated self-reports."

  ### 4. The Welfare Economics Workaround (and why it fails here)
  Applied welfare economists often sidestep IUC by using **money-metric utility** or **Willingness to Pay (WTP)**. This converts utility into a common numeraire (dollars), achieving comparability via the marginal utility of income (assuming that away, of course).

  **The Departmental Application:**
  *   **The Argument:** "If we wanted a comparable metric, we would auction the leave. Who would give up the most salary to get it? Or, who would pay the most to their colleagues to withdraw their application? Obviously, we cannot do this; it's unethical and violates tenure norms. But if we reject the money-metric solution because research leave isn't a commodity, we must admit we lack a common numeraire. If we lack a common numeraire, we lack comparability. If we lack comparability, we cannot maximize. We must instead use a non-welfarist procedure (e.g., rotation, merit-based ranking by peers, or lottery)."

  ### Summary for the Meeting
  You can condense this into three punchy points for your colleagues:

  1.  **Measurement Validity (Robbins):** The numbers on the form are not data; they are uncalibrated assertions. A "70" from one person is not equivalent to a "70" from another. Aggregating them is like adding meters to feet without converting.
  2.  **Incentive Compatibility (Mechanism Design):** Even if the scales were comparable, the "highest score wins" rule makes truth-telling a dominated strategy. The rational move is for everyone to write "100." The procedure guarantees noise, not signal.
  3.  **Ethical Transparency (Sen/Arrow):** We are making an ethical choice about who deserves the leave. Harsanyi shows us that any weighting of persons is an ethical choice. Currently, we are hiding that choice behind a form that pretends to be objective. It is more honest to use **Extended Sympathy**: let the committee explicitly debate and rank the *situations* ("Prof. A with leave" vs. "Prof. B with leave") based on observable career impact, rather than pretending we can sum subjective internal states.

  ### A Proposed Counter-Motion
  If you need a concrete alternative to propose:
  *"I move we reject the self-rating form on the grounds that it lacks informational coherence. Instead, let us adopt an **Extended Sympathy** protocol: Each committee member ranks the five candidates based on the projected research output of granting them the leave. We aggregate *those* rankings (using Borda or similar) to decide. This acknowledges that interpersonal comparisons are value judgments made by the community, not empirical facts reported by the individual."*

  This shifts the burden from the impossible (calibrating internal utility) to the difficult but manageable (peer review of potential), which is what the department is actually equipped to do.
