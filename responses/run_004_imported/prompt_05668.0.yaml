prompt: |-
  A few weeks ago I had a long, increasingly technical argument with a friend of mine, a biostatistician, about what it even means to say that a particular patient has a given percent chance of surviving five years. He maintained that any such figure is hostage to the reference class used to compute it: that a given patient belongs to indefinitely many equally legitimate comparison classes, that there is no non-arbitrary way to privilege one over the rest, and that a clinician who quotes a single number to a patient is dressing up a convention as a measurement. I pushed back that medicine cannot simply throw up its hands at this, since patients still have to make real decisions and need some number to act on. The disagreement has become more than academic, because I sit on the shared decision-making committee at the hospital where I work — the body that sets standards for how prognostic statistics are presented in patient decision aids — and a case matching our argument almost exactly has landed on the agenda.

  A 43-year-old patient with a rare sarcoma subtype is choosing between an aggressive resection with significant expected morbidity and a palliative approach, and wants a five-year survival estimate to help her decide. Her surgical oncologist quoted 61 percent, computed from a large national registry's broad category for her tumor site and stage. A specialist she consulted for a second opinion quoted 22 percent, computed from a pooled case series of fourteen patients matched on her specific genomic subtype and comorbidities. Both figures are correctly calculated from real data; they differ only in which population of "similar patients" was treated as the relevant comparison class, and a third reasonable clinician could very plausibly produce a third number from a third defensible class. The patient's family has concluded that someone on her care team is incompetent, and is demanding that the hospital simply state "the real number." On the committee itself, opinion has already split three ways: some members want to mandate the narrowest available reference class on the theory that specificity trumps everything; others want to mandate the broadest adequately powered class on the theory that small samples are unreliable; a few want to abandon point estimates for ranges entirely.

  Please draft the short memo I will circulate ahead of next week's meeting, recommending a concrete policy for how our oncologists should present survival statistics in cases like this one. I want the memo to commit to an actual recommendation rather than merely cataloguing the options already on the table, and I want it to engage seriously with my friend's underlying objection — that no such rule can be anything more than a convention dressed up as a methodology — rather than treating the choice of reference class as a narrow technical detail that any competent statistician could resolve.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Sender:** Member of a hospital's Shared Decision-Making Committee.
      *   **Recipient:** Committee members (and potentially oncology leadership).
      *   **Context:** A dispute over prognostic statistics (61% vs. 22% 5-year survival) for a rare sarcoma patient, stemming from different reference classes (broad registry vs. narrow genomic/comorbidity match).
      *   **Underlying Philosophical Conflict:** The user's friend (biostatistician) argues that probability is reference-class dependent and arbitrary (no "true" number). The user argues patients need actionable numbers. The committee is split (narrowest vs. broadest vs. ranges).
      *   **Goal:** Draft a short memo recommending a *concrete policy*.
      *   **Key Constraint:** Must engage seriously with the philosophical objection (that this is convention, not measurement) rather than dismissing it as a technicality. It must commit to a recommendation, not just list options.

  2.  **Deconstruct the Philosophical Problem (The Reference Class Problem):**
      *   The friend is right in a strict epistemic sense: Individual probability is undefined without a class.
      *   However, medicine is pragmatic. We need to act.
      *   Dismissing the objection makes the policy vulnerable to criticism from statisticians and ethicists.
      *   Accepting the objection fully leads to paralysis (no numbers).
      *   *Solution:* Acknowledge the convention but justify *why* this specific convention serves the patient's decision-making needs best. Shift the goal from "reporting truth" to "facilitating informed consent."

  3.  **Evaluate the Committee's Options:**
      *   *Narrowest Class:* High specificity, low statistical power (n=14 is shaky), potentially unrepresentative. Risks false precision.
      *   *Broadest Class:* High power, low relevance. Risks misleading the patient about *their* specific risk.
      *   *Ranges:* Honest about uncertainty, but patients often struggle to interpret ranges (do they pick the middle? the worst case?).
      *   *Proposed Hybrid/Process Approach:* Present the most *clinically relevant* class but explicitly contextualize the uncertainty and the source. Don't hide the reference class problem; expose it to the patient as part of the decision aid.

  4.  **Develop the Recommendation:**
      *   *Core Principle:* Transparency over false precision.
      *   *Policy:* Require the presentation of *multiple* reference classes when significant divergence exists, framed not as "competing truths" but as "boundaries of uncertainty."
      *   *Why?* It respects the biostatistician's critique (admitting the number is contingent) while satisfying the clinician's need (giving numbers to act on). It empowers the patient to understand *why* the numbers differ.
      *   *Specific Mechanism:* "Layered Prognostic Disclosure." Start with the broad baseline, then the specific subgroup, and explain the trade-off (relevance vs. reliability).

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Subject:** Clear and action-oriented.
      *   **Opening:** Acknowledge the current impasse and the specific case (sarcoma).
      *   **Engaging the Objection:** This is crucial. I need to validate the biostatistician's view. "There is no 'real number'." Admit that probability is a property of the group, not the individual.
      *   **The Pivot:** If there is no true number, our duty isn't to find it, but to manage the uncertainty ethically.
      *   **The Recommendation:**
          1.  Do not mandate narrow or broad exclusively.
          2.  Mandate *disclosure of the reference class* alongside the number.
          3.  In cases of significant divergence (like 22% vs 61%), present *both* with an explanation of the trade-off (sample size vs. specificity).
          4.  Use visual aids (forest plots or simple bars) to show the range of evidence.
      *   **Rationale:** This aligns with "Shared Decision Making." It treats the patient as a partner in interpreting the evidence, not just a recipient of a verdict.
      *   **Closing:** Call to action for the meeting.

  6.  **Refining the Tone:**
      *   Needs to be professional, authoritative, yet humble regarding the epistemic limits.
      *   Avoid jargon where possible, but don't dumb down the statistical philosophy.
      *   Ensure it sounds like it comes from a committee member trying to bridge a gap, not a dictator.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is recommending "present both" too confusing for a patient?
      *   *Fix:* Emphasize that the *clinician* must explain the divergence, not just hand over two numbers. The policy is about *how* the numbers are presented (contextualized), not just *which* number.
      *   *Critique:* Did I address the friend's point enough?
      *   *Fix:* Make sure the memo explicitly states that the "single true number" is a myth. This validates the friend while moving forward.
      *   *Critique:* Is it concrete?
      *   *Fix:* Yes, propose a "Layered Disclosure Protocol."

  8.  **Final Polish:** Check length (short memo), clarity, and ensure the philosophical engagement is prominent. (The resulting draft focuses on "Epistemic Honesty" as the guiding principle.)

  **(Self-Correction Note):** I need to make sure I don't just say "show ranges." The prompt says some want ranges. I need to differentiate my recommendation. My recommendation is to show *competing reference classes* explicitly, not just a confidence interval around one class. This addresses the core conflict (61% vs 22% is not a confidence interval issue, it's a population definition issue).

  9.  **Finalizing the Policy:** "Contextualized Plurality." Present the most robust estimate *and* the most specific estimate, explaining the tension.

