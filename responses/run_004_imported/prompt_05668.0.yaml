answer: |-
  **MEMORANDUM**

  **TO:** Shared Decision-Making Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Policy on Prognostic Reference Classes

  **Context**
  As we prepare to address the current impasse regarding the 43-year-old sarcoma patient, we must acknowledge that the disagreement between our oncologists (61% vs. 22% survival) is not a calculation error. It is an instance of the *reference class problem*. My colleagues in biostatistics are correct: there is no "true" probability for an individual. Probability is a property of a group, not a person. When we assign a risk to a patient, we are selecting a comparison class. Different valid classes yield different valid numbers.

  **The Philosophical Constraint**
  We cannot resolve this by mandating a single "correct" number, because one does not exist. To claim otherwise is to dress convention as measurement, which undermines informed consent. However, we also cannot abandon quantification, as patients require estimates to weigh morbidity against mortality. Our policy must therefore prioritize *epistemic honesty* over *false precision*. We must stop trying to hide the arbitrariness of the reference class and start using it to educate the patient.

  **Recommendation: The Layered Disclosure Protocol**
  I propose we reject the binary choice between "narrowest" and "broadest" classes. Instead, I recommend adopting a **Layered Disclosure Protocol** for cases where defensible reference classes diverge by more than 15 percentage points.

  Under this policy, clinicians must:

  1.  **Present Competing Estimates:** Disclose both the broad registry estimate (high statistical power, lower specificity) and the narrow subgroup estimate (high specificity, lower power).
  2.  **Explicitly Label the Trade-off:** Accompany the numbers with a standardized explanation: *"The higher number reflects data from many patients with your general tumor type. The lower number reflects fewer patients who match your specific genetic profile. We cannot know for sure which group you fit best, so the truth likely lies between them."*
  3.  **Visualize the Uncertainty:** Decision aids should display these not as competing facts, but as boundaries of current knowledge (e.g., a bar chart showing the range of evidence rather than a single point).

  **Rationale**
  This approach accepts the biostatistician's objection—that the number is contingent—without succumbing to paralysis. It shifts the clinical task from *delivering a verdict* to *interpreting evidence*. By exposing the reference class problem to the patient, we respect their autonomy. They are not being asked to trust a single number; they are being asked to decide how they wish to balance the reliability of broad data against the relevance of specific data.

  **Next Steps**
  This policy requires updating our decision aid templates to allow for dual-entry fields and training oncologists to discuss statistical uncertainty without eroding hope. I ask the committee to review the attached draft language for patient-facing explanations and vote to adopt the Layered Disclosure Protocol as interim policy for complex oncology cases.

  We cannot give patients the "real number." But we can give them the real picture.
