answer: |-
  **MEMORANDUM**

  **TO:** Research-Prioritization Subcommittee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Mathematics Department Renewal Request (Prime Gaps)

  **Recommendation**
  I recommend that we **renew funding for the analytic number theory group for a limited term of two years**, after which their eligibility for this specific discretionary stream will expire without prejudice.

  **Rationale**
  Our mandate for this fund is explicitly "high-risk, high-reward." While the applicants' work on prime gaps lacks immediate application, the history of this department—specifically the trajectory from elliptic-curve arithmetic to cryptography—demonstrates that the "reward" in our mandate must be measured in decades, not budget cycles. To deny funding on the basis of current utility would effectively convert this discretionary fund into a standard development grant, undermining its specific purpose.

  **Response to Objections**
  I want to address the two substantive objections raised in our last session, as they correctly identify the tensions inherent in this decision.

  Regarding the first objection: I agree that the applicants' historical argument "proves too much" if applied to the university's general operating budget. We cannot fund all pure mathematics on the hope that some fraction might eventually become useful. This is why I propose a **two-year limit** rather than an indefinite renewal. This condition acknowledges the scarcity of resources and the need for discrimination. It allows us to honor the "high-risk" mandate without committing to a permanent entitlement that would preclude other departments from accessing the fund. We will revisit this allocation in the 2025 cycle.

  Regarding the second objection: I must respectfully dissent from the claim that the appeal to Wigner and Hardy is fundamentally flawed due to selection bias. The member arguing this position noted that critics like Derek Abbott correctly observe that we remember the number theory that became RSA while forgetting the vast body of pure mathematics that never found application. They argued that Wigner's essay concerns the *fit* between math and nature, not a guarantee of utility, and that relying on the RSA precedent is a survivorship fallacy.

  **This objection is historically accurate, but policy-irrelevant for this specific fund.** The member is correct that most pure mathematics will never find an external use. However, a "high-risk" portfolio is not designed to track base rates; it is designed to capture tail events. If we only funded projects where the probability of application was statistically demonstrable in advance, we would be managing risk, not taking it. The selection bias critique explains why we should not expect *every* grant to pay off; it does not explain why we should not fund *any* of them. To accept the selection bias argument as a reason to decline this proposal is to argue that because most lottery tickets lose, we should not buy any tickets at all. For a discretionary fund of this size, the cost of the ticket is low enough that the potential payoff of a single "RSA-level" breakthrough justifies the investment, even if the historical record suggests it is more likely to remain pure.

  **Conclusion**
  By limiting the renewal to two years, we accommodate the concern regarding resource discrimination. By proceeding despite the selection bias critique, we remain faithful to the "high-risk" mission. I ask for your support in approving this limited renewal.
