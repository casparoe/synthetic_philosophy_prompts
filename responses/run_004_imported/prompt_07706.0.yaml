answer: |-
  Your gut is absolutely right. **Diego is wrong.**

  While it looks like a 50/50 chance for you in both scenarios, the **outcomes** are very different. Option 2 is mathematically better for both you and Diego.

  Here is the breakdown of why your intuition is correct and his is flawed.

  ### Option 1: The Coin Flip
  This is a "zero-sum" game between you and Diego. One of you *must* take the shift.
  *   **Your chance of working the full shift:** 50%
  *   **Your chance of working zero shifts:** 50%
  *   **Expected Workload:** 0.5 shifts

  ### Option 2: The App (Independent Probabilities)
  Because the app rolls for each of you separately, there are four possible outcomes, not two. Since each roll is 50/50, each outcome has a 25% chance ($0.5 \times 0.5 = 0.25$).

  1.  **You get flagged, Diego doesn't (25%):** You work the full shift.
  2.  **Diego gets flagged, You don't (25%):** You go home early (Manager/Diego covers).
  3.  **Both get flagged (25%):** You **split** the shift (much better than doing it alone).
  4.  **Neither gets flagged (25%):** The **Manager** closes (best case scenario).

  **Let's look at your risk in Option 2:**
  *   **Chance you work the full shift alone:** Only **25%** (Scenario 1).
  *   **Chance you don't work at all:** **50%** (Scenarios 2 + 4).
  *   **Chance you split the shift:** **25%** (Scenario 3).

  ### The Verdict
  In Option 1, you have a **50%** chance of getting stuck with the worst shift of the year.
  In Option 2, you only have a **25%** chance of getting stuck with the worst shift of the year.

  Furthermore, Option 2 introduces two possibilities that Option 1 eliminates entirely:
  1.  **Splitting the misery:** If you both get flagged, you aren't alone until 3 AM.
  2.  **The Manager takes it:** If neither gets flagged, the manager has to close, and you both go home.

  ### Why Diego is Confused
  Diego is looking at the **marginal probability** (the chance of *your* name coming up), which is indeed 50% in both cases.

  However, he is ignoring the **joint probability** (what happens when *both* names come up). In Option 1, the system forces the result to be mutually exclusive (if it's you, it can't be him). In Option 2, the results are independent. This independence creates a "safety net" where the burden is either shared or removed entirely.

  **Recommendation:**
  Tell Diego that Option 2 is better for **him** too. He also drops from a 50% risk of closing alone down to a 25% risk, plus he gets a 25% chance the manager does it. Unless he hates waiting until later in the week to know the schedule, there is no logical reason for him to prefer the coin flip.

  **Pick Option 2.** It strictly reduces your expected workload and risk.
