answer: |-
  This is a provocative and pedagogically rich pairing. It forces students to confront the relationship between interpretive methodology and moral teleology. Frederick Douglass's shift from Garrisonian disunionism to constitutional abolitionism is indeed a precursor to the textualist/public-meaning turn, but as you note, his textualism was never morally neutral.

  Here is the stress-test analysis for your seminar, laying out the strongest arguments for both vindication and betrayal, followed by a verdict on where Douglass would likely stand.

  ### I. The Case for Vindication: Douglass as the First Public-Meaning Originalist

  The argument that Douglass would recognize his own method in modern public-meaning originalism rests on his specific rejection of the "secret intentions" of the framers and his insistence on the supremacy of the enacted text.

  **1. Rejection of Secret Intent:**
  In his 1852 speech, *"The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?"*, Douglass explicitly dismantles the Garrisonian reliance on the private pro-slavery intentions of the Founders. He argues, "I must look at the Constitution by the light of the Constitution itself." He insists that if the text does not explicitly sanction slavery, the private wishes of the drafters are legally irrelevant. This mirrors the modern originalist critique of legislative history and the "living constitutionalist" reliance on evolving judicial norms. In *SFFA*, the Court's skepticism of Harvard's reliance on modern sociological justifications rather than the text of the Equal Protection Clause would resonate with Douglass's demand that the law be found in the document, not in the "secret motives" of its administrators.

  **2. The Colorblind Ideal:**
  Douglass's post-war philosophy heavily emphasized a "composite nationality" where race would cease to be a legal category. In *"What the Black Man Wants"* (1865), he argued for universal suffrage and equal rights, famously stating, "I want no special favor on account of my color." A public-meaning originalist reading of the 14th Amendment in *SFFA*—which holds that the Equal Protection Clause prohibits racial classifications regardless of whether they are invidious or remedial—aligns with Douglass's mature vision of a society where the law sees only citizens. If the original public meaning of 1868 was that the state cannot classify by race, Douglass might view affirmative action as a return to the very racial caste system the Amendment was designed to destroy.

  **3. Democratic Legitimacy:**
  Douglass turned to the Constitution because he wanted Black Americans to claim the powers of citizenship within the existing democratic order, rather than standing outside it. Public-meaning originalism claims to restore democratic legitimacy by binding judges to the law ratified by the people, rather than the policy preferences of elites. Douglass would likely appreciate a jurisprudence that prevents unelected judges from sustaining racial preferences that the text does not explicitly authorize, viewing it as a safeguard against the kind of paternalistic manipulation he often decried.

  ### II. The Case for Betrayal: The Severing of Text from Natural Law

  The argument that Douglass would view modern originalism as a hollow shell rests on the fact that his textualism was instrumental to a higher moral law. Without the natural law commitment, the text becomes a trap.

  **1. The Declaration as Hermeneutic Key:**
  Douglass did not read the Constitution in a vacuum; he read it through the Declaration of Independence. For Douglass, the Constitution was a "glorious liberty document" *only because* it was compatible with the natural rights principles of the Declaration. Modern originalism, particularly in its positivist variants (like Justice Scalia's), often explicitly rejects natural law as a source of constitutional meaning. If *SFFA* relies on a historical freeze-frame that ignores the substantive goal of equality, Douglass would argue the method has lost its soul. He would ask: Does this interpretation advance the "justice" and "liberty" promised in the Preamble, or does it cement inequality under the guise of neutrality?

  **2. The Historical Reality of Reconstruction:**
  The historical record regarding the 39th Congress is indeed contested, but it is not ambiguous on one key point: the same Congress that ratified the 14th Amendment passed race-conscious legislation, such as the Freedmen's Bureau Acts. A strict public-meaning originalism that declares *all* race-consciousness unconstitutional risks being ahistorical. Douglass, a keen observer of political reality, knew that emancipation required active support, not just passive non-discrimination. He would likely argue that a methodology which ignores the *purpose* of the Reconstruction Amendments (to elevate a subjugated class) in favor of a rigid *rule* (no racial classifications) betrays the historical mission of the text he fought to redeem.

  **3. Moral Urgency vs. Methodological Neutrality:**
  Douglass's interpretive move was driven by moral urgency. He needed the Constitution to be anti-slavery to fight slavery. Modern originalism often prides itself on moral neutrality—"the law is the law, regardless of the outcome." Douglass would likely view this neutrality with suspicion. In *"The Meaning of July Fourth for the Negro,"* he chastised the nation for hiding behind forms while ignoring substance. He would likely argue that a jurisprudence that forbids remedial racial measures in a society still scarred by the "badges and incidents of slavery" (to use the *Civil Rights Cases* language) is functionally indistinguishable from the pro-slavery constitutionalism he fought against. It privileges the "letter" over the "spirit," which was precisely the error of the *Dred Scott* Court.

  ### III. The Verdict: Where Douglass Would Land

  If Frederick Douglass were seated in that seminar, he would likely **reject the Court's application in *SFFA* while acknowledging a kinship with the method's textual discipline.** Ultimately, however, he would conclude that modern public-meaning originalism, as currently practiced, has dropped the indispensable natural-law commitment that made his own reading viable.

  **The Reasoning:**

  1.  **Teleology Trumps Methodology:** For Douglass, the Constitution was a *means* to the end of human liberty, not an end in itself. In his 1860 speech in Glasgow, he noted that the Constitution's validity depended on its alignment with "the principles of the Declaration of Independence." Modern originalism often treats fidelity to the historical meaning as the terminal value. Douglass would argue that if the "original public meaning" is interpreted in a way that perpetuates caste (by forbidding remedies for caste), the interpretation is morally bankrupt, regardless of its textual pedigree. He would likely say, "You have kept the words, but you have killed the hope."

  2.  **The Distinction Between Classification and Caste:** Douglass opposed racial classifications *when they were used to oppress*. He was less clear on their use for remediation, but his support for the Freedmen's Bureau suggests he understood that formal equality was insufficient for substantive freedom. He would likely distinguish between racial classifications designed to subordinate (which the 14th Amendment absolutely bans) and those designed to integrate and elevate (which the 14th Amendment might permit). He would critique the *SFFA* majority for collapsing this distinction, arguing that a "colorblind" constitution in a society that is not colorblind is a tool of oppression, not liberty.

  3.  **The "Badges of Servitude":** Douglass was a staunch proponent of the 13th Amendment's power to eliminate the "badges and incidents of slavery." He would likely argue that a public-meaning originalism that ignores the *context* of the 14th Amendment (the transition from slavery to citizenship) is historically myopic. He would contend that the "public meaning" of 1868 included an understanding that the federal government had the power to actively dismantle the remnants of slavery. To forbid universities from considering race in the pursuit of integration would, to Douglass, look like a judicial surrender to the enduring legacy of slavery.

  **Conclusion for the Syllabus:**

  Douglass would tell your students that **text without conscience is a weapon.** He would validate the move away from "secret intent" (acknowledging that pro-slavery arguments relied on hidden conspiracies), but he would warn that "public meaning" cannot be divorced from the moral purpose of the document.

  He would likely conclude that the *SFFA* Court is engaging in a form of "dead constitutionalism"—honoring the text of the Reconstruction Amendments while strangling their lifeblood. He would argue that true fidelity to the 14th Amendment requires asking not just "what did the words mean in 1868?" but "what work must these words do to secure the liberty they promise?"

  **Pedagogical Payoff:**
  This pairing works because it prevents students from treating originalism as a monolith. It forces them to ask: *Can an interpretive method survive if it is severed from the moral vision that birthed it?* Douglass serves as the perfect witness to argue that constitutional fidelity requires not just historical accuracy, but moral courage.
