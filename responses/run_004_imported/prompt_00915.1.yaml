      *   **Task:** Provide a considered outside opinion based *specifically* on Douglass's arguments in the 1860 speech, not his general reputation. Assess how Douglass would view the Court's current reliance on history/tradition to fix the scope of rights.

  2.  **Deconstruct Douglass's 1860 Glasgow Speech Arguments:**
      *   *Context:* Douglass shifted from the Garrisonian view (Constitution is a pro-slavery covenant) to the Gerrit Smith/Lysander Spooner view (Constitution is an anti-slavery document).
      *   *Key Argument 1: Text vs. Practice.* Douglass acknowledges 70+ years of pro-slavery practice but argues practice does not define the *meaning* of the text. "The Constitution is not what the government has made it, but what it says."
      *   *Key Argument 2: Presumption of Liberty.* Ambiguities should be resolved in favor of liberty. Rights should only be curtailed by language of "irresistible clearness."
      *   *Key Argument 3: The Nature of the Document.* It is a living instrument of government intended for "we the people," not a contract among states to protect property in man. It speaks in general principles of liberty.
      *   *Key Argument 4: History/Tradition as Oppressive.* The "history and tradition" of the US up to 1860 *was* slavery. To rely on that history is to validate slavery. Douglass argues we must look *forward* to the principles of the text, not *backward* to the sins of the past.

