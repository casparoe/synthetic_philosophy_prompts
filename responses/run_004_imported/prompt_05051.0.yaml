answer: |-
  Here are ten interview questions designed for your philosophy podcast, tailored to engage deeply with your guest's revival of David Lewis's work while meeting your specific content requirements.

  **1. Lewis's Skepticism vs. Your Revival**
  David Lewis's original 1997 treatment of penal substitution is often read as a *reductio* or at least a expression of deep caution; he outlines the logical costs and seems to leave the reader wondering if the price is too high. You, however, argue that the doctrine can be made coherent even granting those costs. Where do you think Lewis stopped short? Is there a specific metaphysical or normative premise he was unwilling to grant that you find necessary?
  *   **Follow-up:** If she suggests Lewis was too bound by secular intuitions about justice: "Does relying on distinctively theological premises to solve the logical tension risk making the doctrine unintelligible to the very outsiders Lewis was often concerned with addressing?"

  **2. The Debt-Guilt Disanalogy**
  A central hurdle in Lewis's analysis is the disanalogy between financial debt and moral guilt. We accept that a third party can pay off my financial debt, but we recoil at the idea that a third party can serve my prison sentence. Why should the debt-discharge analogy survive this disanalogy between clearing an obligation and clearing guilt? What makes sin more like a bill to be paid than a crime to be answered for?
  *   **Follow-up:** If she argues that divine law categorizes sin as a debt by definition: "If the categorization rests solely on divine fiat, does that preserve coherence at the expense of making God's justice appear arbitrary to human reasoners?"

  **3. Ontological Guilt vs. Penal Consequence**
  In your reconstruction, does the substitutionary act remove the sinner's actual guilt, or does it only remove the liability to further suffering? In other words, is the sinner declared innocent, or are they simply a guilty party whose sentence has been served by someone else?
  *   **Follow-up:** If she argues it removes the guilt entirely: "How does the punishment of an innocent party ontologically cleanse the moral stain of the guilty party, rather than just satisfying the demand for blood?"

  **4. The Criminal Law Objection**
  Lewis worries that if we make penal substitution coherent in theology, we risk licensing the punishment of willing innocent substitutes in ordinary criminal law. How do you block the inference from divine justice to human justice? What is the relevant difference between God accepting a substitute and a human judge allowing a volunteer to take time for a convict?
  *   **Follow-up:** If she argues God has ownership rights over human lives that humans lack: "Does grounding the distinction in God's ownership rights inadvertently reinforce the rationalist critique that this model treats persons as property rather than moral agents?"

  **5. The Metaphysics of Union**
  Many defenders of penal substitution rely on a concept of "mystical union" or corporate headship to explain how the transfer of punishment is possible without violating individual identity. Does your account rely on this kind of metaphysical union between Christ and the sinner, or do you think the logic holds even on a strictly forensic, legal model of representation?
  *   **Follow-up:** If she relies on the metaphysical union: "Does this shift the heavy lifting from the philosophy of punishment to the philosophy of personhood, and does that make the view harder to defend in a pluralistic context?"

  **6. The Nature of Divine Justice**
  Rationalist critics often argue that penal substitution portrays God as a moral monster who demands blood before offering forgiveness. In your view, is divine justice fundamentally retributive, restorative, or something else entirely? If it is retributive, how is it satisfied by the suffering of one who did not commit the wrong?
  *   **Follow-up:** If she argues it is restorative: "If the goal is restoration, is the 'penal' aspect of penal substitution actually necessary, or does it become a gratuitous addition to the soteriological model?"

  **7. Lewis's "Cost"**
  Lewis explicitly flags that making this work requires paying a "cost" regarding our standard intuitions about justice. You've argued the cost is worth paying. Could you articulate what that cost actually is? Is it a modification of how we understand justice, or a modification of how we understand personhood?
  *   **Follow-up:** If she says it modifies our understanding of justice: "If our best intuitions about justice are corrupted by sin, as many theologians claim, how do we use those same intuitions to critique or validate the doctrine in the first place?"

  **8. The Rationalist Reception**
  Your paper has made the rounds on rationalist blogs and forums, communities that often prioritize moral intuition and logical consistency over revelation. What do you think is the most steel-manned objection coming from that specific audience, and does their reaction highlight a blind spot in contemporary philosophy of religion?
  *   **Follow-up:** If she suggests they misunderstand the theology: "Is it a failure of the philosophical argument if it requires prior theological commitment to be seen as morally plausible, or is that an expected feature of religious philosophy?"

  **9. Pastoral and Existential Implications**
  Moving from the metaphysical to the practical: If a believer accepts your coherentist account of penal substitution, how should that change their experience of repentance? Does knowing the logic holds together make the doctrine more spiritually potent, or is the spiritual value independent of the philosophical coherence?
  *   **Follow-up:** If she says the value is independent of coherence: "Then what is the philosophical project achieving? Are we merely cleaning up logical dust, or does coherence protect the doctrine from moral decay?"

  **10. Falsification and Changing Minds**
  Finally, philosophy requires openness to being wrong. What specific evidence, argument, or moral intuition would change your mind about this whole project? Is there a scenario where you would concede that penal substitution is indeed incoherent or morally impermissible, even theologically?
  *   **Follow-up:** If she suggests nothing would change her mind because it is revealed truth: "If the philosophical coherence is secondary to revelation, does that place this discussion outside the realm of philosophy and firmly into theology, and how do we navigate that boundary in this dialogue?"
