answer: |-
  Your gut reaction is the standard intuition for most negotiators: **information is leverage, and giving it away is suicide.** In a typical zero-sum haggling match, knowing your opponent's "walk-away" price (reservation price) allows you to offer exactly that amount, leaving them zero surplus.

  However, your colleague is likely right. This isn't luck; it's a specific application of game theory and mechanism design. You stumbled into a concept known as **Program Equilibrium** combined with **Complete Information Bargaining**.

  Here is the sanity check on why this worked, why your intuition felt wrong, and the specific risks you need to watch out for.

  ### 1. The Problem with "Sealed" Negotiations
  In your old sealed-bid or opaque process, neither side knows the other's constraints. This creates **Information Asymmetry**, which leads to two major inefficiencies:
  *   **Deal Failure:** Sometimes a deal is possible (your minimum is lower than their maximum), but because neither side knows that, they don't find the overlap, and the deal falls through.
  *   **Risk Premiums:** Because you don't know their logic, you have to bid conservatively to protect yourself. You leave money on the table "just in case."

  By swapping code, you moved from **Incomplete Information** to **Complete Information**. In game theory, bargaining with complete information is almost always more efficient (the "pie" gets bigger) because you eliminate the risk of impasse and the cost of the "dance."

  ### 2. Code as a "Credible Commitment"
  This is the most critical part. In human negotiation, if I say, "I cannot go below $100," you don't believe me. You think I'm bluffing, so you offer $90 to test me. We waste time and resources on that volley.

  When you swap the **actual decision code**:
  *   **Bluffing becomes impossible.** If your code literally returns `REJECT` for any offer under $100, the other bot *knows* offering $99 is a wasted computation.
  *   **Search costs vanish.** The other bot doesn't need to probe your limits. It can calculate the exact offer that maximizes its outcome while ensuring acceptance.

  This removes the **transaction costs** of negotiation. The "better numbers" you saw likely weren't because the other side was nicer; it's because the friction, time, and risk premiums inherent in the old process were stripped out. Both sides captured value that was previously burned by the negotiation process itself.

  ### 3. Program Equilibrium (The "One-Off" Solution)
  You mentioned this is a one-off deal, which usually means cooperation is impossible (the "End Game Problem" in game theory). Normally, you defect because there's no future punishment.

  However, computer scientists (notably Moshe Tennenholtz) have described **Program Equilibrium**. If two agents can read each other's source code *before* acting, they can condition their behavior on the other's code.
  *   *Your Bot's Logic:* "If their code shows they will punish aggression, I will cooperate. If their code shows they will exploit transparency, I will lock down."
  *   *Their Bot's Logic:* "If we exploit them now, they might harden their code next time (even if there is no next time, the bot might be designed with a general fairness heuristic)."

  More likely, your bots were programmed to find the **Nash Bargaining Solution**. With full visibility, both bots can mathematically identify the point that maximizes the *joint* product of the gains. In opaque negotiations, you can't calculate that. With code swap, you can.

  ### 4. Why Your Intuition Was "Right" But the Outcome Was Better
  Your fear was: *"They know our logic, so they can squeeze us to our limit."*

  This **is** a risk. If their bot was programmed with a purely predatory function (e.g., `Maximize(My_Profit)` subject to `Their_Bot_Accepts`), and your bot was passive, they *would* have squeezed you to your reservation price.

  **So why did you get better numbers?**
  1.  **Reciprocity:** Their bot likely had similar logic. If they tried to squeeze you to the absolute wire, your code might have had a `Probability_Of_Walk_Away` function that spikes near the limit. Seeing that risk in your code, their bot likely backed off to secure the deal rather than risk a 0% outcome.
  2.  **Efficiency Gains:** The "old process" was probably terrible. Sealed bids often result in the "Winner's Curse" or conservative pricing. Even if they squeezed you closer to your limit than you wanted, the removal of the "sealed bid risk premium" might have still resulted in a better net number than the old system.
  3.  **Value-Creation vs. Value-Claiming:** The code might have revealed *preferences*, not just price limits. (e.g., "I care more about payment terms than unit cost"). This allows for **logrolling**, where both sides trade things they value less for things they value more, making both sides richer without changing the price.

  ### The Verdict
  **Your colleague is onto something real.** This is a known mechanism in algorithmic mechanism design. Transparency reduces the "cost of bargaining," allowing both parties to capture value that was previously lost to friction and risk.

  **However, proceed with caution.**
  This works best when:
  1.  **The code is auditable and binding.** (You must be sure they didn't send a "decoy" script).
  2.  **Both sides want the deal.** (If one side is predatory and the other is transparent, the transparent side gets eaten).
  3.  **The environment is cooperative.** (If this becomes standard practice, vendors might start writing "exploiter" code specifically designed to parse your logic and extract maximum surplus).

  **Recommendation:**
  Don't treat this as "luck." Treat it as a **mechanism upgrade**. However, before making it standard policy, run a simulation where the counter-party bot is programmed to be *aggressively predatory* against your open code. If your bot holds up, you have a robust system. If it gets crushed, you need to add "opacity layers" or "randomization" to your logic to prevent perfect exploitation in the future.

  You didn't get lucky; you just discovered that in algorithmic bargaining, **truth is more efficient than bluffing.**
