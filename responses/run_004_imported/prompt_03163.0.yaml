answer: |-
  The kitchen hummed with the sound of the refrigerator and the distant, muffled closure of a car door outside. The casserole dishes were stacked in the sink, crusted with potato gratin and congealed gravy. Elena was scrubbing a fork, her back to the room. Mark sat at the table, loosening his tie, a half-empty glass of funeral red sweating on the wood between them.

  "He looked peaceful," Mark said. It was a ritual phrase, obligatory and hollow.

  Elena didn't turn. "He looked dead, Mark. Peace is a predicate for the living."

  "Don't start."

  "I'm not starting. I'm correcting the record. You told Mrs. Gable it was a tragedy *for him*. That he lost his battle."

  "He did lose it." Elena turned off the tap. She dried her hands slowly on a towel, the fabric rough against the silence. "And it is a tragedy. Don't do the Epicurus thing tonight. Please."

  "It's not a thing. It's the only coherent position on the metaphysics of death." She walked to the table and pulled out a chair, sitting opposite him. "If Dad is dead, Dad does not exist. If he does not exist, there is no subject to whom harm can be attributed. You can't say he *suffered* a loss. The survivors suffer. You suffer. He does not."

  Mark took a drink. The wine was cheap, tannic. "This is the 'No Subject' problem. I know the text, El. *De Rerum Natura*. 'Where death is, I am not.' But it ignores the counterfactual. If he hadn't gotten sick, he would have had another year. Maybe two. He would have seen the baby walk."

  "Would he?" Elena leaned forward. "That's modal speculation. But let's grant it. You're arguing from the Deprivation Account. Nagel. Death is bad because it deprives the subject of the goods of life."

  "Exactly."

  "But for deprivation to be a harm, the subject has to be capable of possessing those goods at the time of the harm. When is the harm inflicted? If it's before he dies, he's not dead yet. If it's after he dies, he's not there to receive the harm. You're positing a metaphysical ghost that hangs around to be unlucky."

  "It's not a ghost," Mark snapped. "It's the person. Thomas. The biographical entity. His life is a narrative, and the narrative was truncated. The badness isn't an experience he has; it's a fact about his history."

  "A fact requires a truth-maker. What makes it true that he was harmed, if there is no 'he' to be in a state of harm?"

  "The possibility," Mark said. "The open future. When you're alive, you have a stake in the future. You have projects. Desires. Dad wanted to finish his memoir. That desire existed. Death obliterated the possibility of satisfying it. That obliteration is the badness."

  Elena picked up her wine glass, swirling the dark liquid. "And here we come to the symmetry. Lucretius saw this coming. You say the future matters because he had desires for it. But look backward. Before Dad was born, there was an eternity of non-existence. Did he have desires then?"

  "No."

  "Could he have?"

  "No, he didn't exist."

  "So," Elena said, her voice softening, becoming the lecturer's voice she used for undergraduates. "The time after his death is mirror-symmetric to the time before his birth. Infinite darkness. If you say the future non-existence is a deprivation because it takes away goods he *could* have had, why isn't the past non-existence a deprivation of the goods he *could* have had if he'd been born earlier? Why don't we mourn 1920? Why don't we say it was a tragedy for Thomas that he wasn't born in 1950 instead of 1955? He lost five years of potential life."

  Mark rubbed his face. "Because that's not how agency works."

  "That's exactly how logic works. If non-existence is the harm, the direction of time shouldn't matter."

  "It does matter," Mark said, his voice tightening. "Because of the orientation of the subject. This isn't a dodge, Elena. It's about the structure of care. We are psychologically wired to care about the future. I don't care that I didn't write a symphony last year. I care that I won't write one next year. It's a rational bias toward the future."

  "Is it rational? Or is it just a biological fact?" Elena pressed. "Lucretius would say it's an illusion. You're projecting your current living perspective onto a state where perspective is impossible. You're standing on the shore, screaming at the ocean because it's wet. Dad doesn't care about the future. He doesn't care about the past. He is nothing."

  "He *was* someone!" Mark slammed his hand on the table. The wine glass jumped. "And that 'someone' had a trajectory. The symmetry argument fails because birth creates a subject with forward-looking interests. Pre-birth, there was no subject to have interests. Post-death, there *was* a subject who had interests that were suddenly, violently rendered impossible. The asymmetry is in the existence of the agent *prior* to the void."

  Elena held his gaze. "So the harm is located... where? In the moment of death?"

  "In the severing of the connection between the agent and their future."

  "But the agent is gone," Elena said relentlessly. "You're saying the severing is bad for the wire, after the wire has been cut. Nagel tries to solve this by saying we can ascribe misfortunes to people without them knowing. A man is betrayed behind his back, he is harmed even if he never finds out. But death isn't betrayal. It's annihilation. If you accept the symmetry, you have to admit that not being born earlier is just as much a loss as not dying later. And if you admit that, then every birth is a tragedy of delayed existence, and every death is a return to the natural state. Which is it, Mark? Is life the baseline, or is non-existence?"

  Mark looked down at his hands. They were trembling, just slightly. "Life is the baseline because it's the only place where value exists. Non-existence is neutral. But moving from Value to Neutral is a loss. Moving from Neutral to Value is a gain. We mourn the loss. We don't mourn the lack of gain before the start."

  "That's special pleading," Elena whispered. "You're privileging the present moment because you're in it. You're grieving, Mark. And you want the universe to validate that grief by calling his death an objective evil. But Epicurus is right. It frees him. It frees us, if we'd let it."

  "I don't want freedom," Mark said, his voice cracking. "I want him. And if I say his death isn't bad for him, then I'm saying it doesn't matter that he's gone. That he's just... off the hook."

  "He *is* off the hook. That's the point."

  "It feels like abandonment."

  Elena reached across the table, covering his hand with hers. Her grip was tight, her knuckles white. "The logic doesn't change the feeling. I know that. I read the texts so I wouldn't have to feel this. But you... you study ethics. You should know that 'bad' is a category we impose. Dad isn't suffering. That is the only objective truth that matters."

  Mark turned his hand over and gripped hers. "But he wanted to stay. He told me, El. Last week. He said he was afraid of the dark."

  Elena pulled her hand back as if burned. She stood up and turned to the sink, staring out the window into the black yard.

  "Then he was irrational," she said to the glass. "Lucretius says fear of the dark after death is like fear of the dark before birth. It's a category error."

  "He was a father," Mark said, standing up behind her. "Not a Roman poet. He loved us. And loving us means having a future with us. Taking that away was a theft. I don't care if there's no one left to hold the stolen goods. It was still stolen."

  Elena didn't turn around. She watched their reflection in the window—two ghosts in a lit room. "Then we disagree. You think death is a thief. I think it's just... the closing of a book. The story isn't sad because it ended. It's sad because we wanted to keep reading."

  "I think it's sad because the ending was too soon," Mark said. "And I think you're terrified that if you admit it was bad for him, you'll have to admit the universe is unjust."

  Elena picked up the damp towel again, wringing it out. "And I think you're terrified that if you admit it wasn't bad for him, you'll have to admit he's truly gone."

  The refrigerator kicked on, a low hum filling the space between them. Neither moved. The dishes remained in the sink, waiting for morning.
