          *   Claim: Lucas argues if mind = M, we can see G(M) is true (given consistency), so mind knows something M doesn't.
          *   Claim: This works for whatever M is proposed.
          *   Claim: "This was, in fact, exactly the moral Gödel himself drew from his own theorems..." -> **Potential Issue.** Gödel was cautious. He didn't explicitly draw the anti-mechanist moral himself in the 1931 paper; this is often attributed to Lucas/Penrose interpreting Gödel. Gödel's 1951 Gibbs lecture is where he discusses minds vs machines, but saying it was "exactly the moral Gödel himself drew" is historically debatable/imprecise.
          *   Claim: Mind cannot be identified with any Turing machine.
      *   **Paragraph 2 (Adding Axioms):**
          *   Claim: Machine can be handed G(M) as new axiom M' = M + G(M).
          *   Claim: M' has its own Gödel sentence G(M').
          *   Claim: Mind can always generate a sentence one step ahead.
