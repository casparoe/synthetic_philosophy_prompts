      *Response:* The Laws of Nature command seeking peace. But they only oblige *in foro externo* when there is security. Superrationality claims to *create* security via logic. Hobbes denies logic can create security. Security requires physical safety.
      *Key distinction:* Security for Hobbes is physical safety from death, not logical consistency.

