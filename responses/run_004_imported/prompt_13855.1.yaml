answer: |-
  Thomas Hobbes would almost certainly reject Douglas Hofstadter's argument for superrationality as a sufficient basis for cooperation in the state of nature. While Hofstadter posits that logical symmetry between rational agents can substitute for causal enforcement, Hobbes's metaphysics, epistemology, and specific definition of rationality in *Leviathan* preclude the possibility that mere reasoning could supply the assurance required to perform covenants *in foro externo*. Hobbes's rejection is not rooted in a generic moral pessimism about human wickedness, but in a rigorous materialist account of the mind and a specific epistemic problem regarding the knowledge of other agents' intentions.

  ### Reason as Reckoning and the Rejection of Acausal Correlation

  The prompt asks whether Hobbes's conception of reasoning as "mechanical reckoning" might make him receptive to superrationality. In Chapter 5 of *Leviathan*, Hobbes defines reason not as a faculty of grasping abstract logical truths, but as "reckoning (that is, adding and subtracting) of the consequences of general names agreed upon for the marking and signifying of our thoughts." This computation is a physical process occurring within the individual mind.

  Superrationality relies on a form of acausal correlation: my decision does not *cause* yours, but our shared rationality ensures they match. For Hobbes, this is metaphysically incoherent. As a materialist, Hobbes views mental events as motions within the body. There is no mechanism by which the "reckoning" in my head can logically constrain the motion in yours without a causal link (communication or coercion). To Hobbes, the idea that my internal calculation could determine your external action without a physical chain of causation would appear as mystical as the "incorporeal substance" he ridicules throughout *Leviathan*. Because reason is an instrumental tool for calculating self-preservation based on causal predictions, a logical correlation that lacks causal power provides no *physical* security. For Hobbes, security is not a logical state; it is the absence of physical threat.

  ### The Epistemic Barrier and Diffidence

  Even if one grants the logical validity of superrationality, Hobbes's epistemology blocks its application. Superrationality requires *common knowledge*: I must know you are superrational, you must know I am, I must know you know I am, and so on. In Chapter 13, Hobbes identifies "diffidence" (mutual fear) as one of the three principal causes of quarrel. This diffidence arises not merely from malice, but from uncertainty.

  Hobbes argues that in the state of nature, "there is no way for any man to secure himself, so reasonable, as anticipation." This is because he cannot know the intentions of others with certainty. He writes:
  > "And because the condition of man... is a condition of war of every one against every one, in which case every one is governed by his own reason; and there is nothing he can make use of that may not be a help unto him, in preserving his life against his enemies; it followeth, that in such a condition, every man has a right to every thing."

  For Hobbes, "governed by his own reason" implies that reason is opaque to others. I cannot observe your reckoning; I can only observe your actions, which may be feigned. Superrationality assumes that "perfect rationality" is a transparent, shared identity. Hobbes contends that human reasoning is constantly clouded by passions, specifically the desire for glory (Chapter 13). Even if I am perfectly rational, I cannot verify that you are. If there is even a small probability that you are irrational, or that your passion for glory will override your reckoning, the rational calculation for *me* (aimed at self-preservation) is to defect.

  Therefore, Hobbes would argue that superrationality fails to solve the epistemic problem. Without a sovereign to enforce penalties, I have no empirical evidence that you will cooperate. Logical inference about your rationality is too weak a reed against the fear of violent death. As Hobbes famously states in Chapter 17, "covenants, without the sword, are but words, and of no strength to secure a man at all." Words (including logical arguments) cannot alter the physical reality that you might kill me tomorrow.

  ### *In Foro Interno* vs. *In Foro Externo*

  The crux of Hobbes's response lies in his distinction between obligation *in foro interno* and *in foro externo*, detailed in Chapter 15. Hobbes agrees with the superrationalist that the *Law of Nature* commands cooperation (performing covenants). He writes:
  > "The laws of nature oblige in foro interno; that is to say, they bind to a desire they should take place: but in foro externo; that is, to the putting them in act, not always."

  He continues to explain that a man who acts peacefully based on the expectation that others will do the same, when they do not, "shall be a prey to others, and procure his own certain ruin."

  Hobbes's condition for moving from *interno* to *externo* is not logical certainty, but *security*. He explicitly addresses the argument that one might perform covenants based on the hope or inference of reciprocity. He rejects this:
  > "He therefore that performeth first, has no assurance to be recompensed, because he can buy no security by the contract... and therefore he which performeth first, does but betray himself to his enemy."

  Superrationality attempts to provide "assurance" through logic. Hobbes would categorize this as insufficient security. For Hobbes, assurance requires a "common power to keep them all in awe." The Sovereign does not just change the payoff matrix (by punishing defection); the Sovereign changes the *epistemic condition* of the agents. The presence of the Sword makes it publicly visible and physically certain that defection will be punished. This public, physical fact replaces the need for opaque, internal logical inference about another's rationality.

  ### The Fool and the Definition of Rationality

  Finally, Hobbes's refutation of "The Fool" in Chapter 15 clarifies why he would reject superrationality. The Fool claims "there is no such thing as justice" and that breaking covenants can be rational. Hobbes argues that breaking covenants is irrational because it leads to a return to the state of war. However, Hobbes's refutation relies on the long-term consequences within a society where covenants are generally kept.

  In the one-shot Prisoner's Dilemma of the state of nature, Hobbes concedes the Fool's point implicitly: without a common power, it *is* rational to defect. Hobbes writes:
  > "If a covenant be made, wherein neither of the parties perform presently, but trust one another; in the condition of mere nature... upon any reasonable suspicion, it is void."

  Superrationality argues that suspicion is irrational if the agents are identical. Hobbes argues that suspicion is *reasonable* because the cost of error is death. Since reason is the "scout" for self-preservation (Chapter 8), any reasoning strategy that exposes the agent to the risk of death when a safer option (defection/pre-emption) exists is, by Hobbes's definition, a failure of reason.

  ### Conclusion

  Hobbes's conception of reasoning as mechanical reckoning does not make him receptive to superrationality; it makes him more hostile to it. Because reason is a tool for navigating a causal, material world, a logical correlation that lacks causal power is irrelevant to the calculation of survival. Hobbes denies that mutual knowledge of shared rationality can supply the necessary assurance because, in his view, we cannot know the internal reckonings of others, nor can we trust that their passions will not override their reason.

  For Hobbes, the "Sword" is not merely a coercive threat; it is an epistemic device that makes the intentions of others legible through the public mechanism of law and punishment. Without this external enforcement, the logical symmetry posited by Hofstadter remains trapped *in foro interno*, unable to bridge the gap to *in foro externo* action. Thus, Hobbes would conclude that superrationality is a philosophical curiosity that fails to address the fundamental material insecurity of the human condition.
