answer: |-
  This is a classic objection to Dutch Book Arguments (DBA), often called the **"opt-out objection."** Your buddy isn't crazy for thinking it; it's one of the first things people notice when they encounter the argument.

  Technically, he is right: **If you never gamble, you never lose money to a Dutch Book.**

  However, philosophically and practically, he is missing the point of what credences *are* and what the Dutch Book Argument is actually trying to prove. Here is the breakdown of why his "just don't bet" strategy doesn't actually get him off the hook.

  ### 1. The "Betting" Definition of Belief
  The DBA relies on a specific definition of belief (credence) championed by Frank Ramsey and Bruno de Finetti. In this framework, **to have a belief just *is* to have a certain disposition to bet.**

  If you say, "I am 90% sure it will rain," but you would not accept *any* bet on that outcome (even a tiny one where you win $1 if it rains and lose $1 if it doesn't), then a pragmatist would say you don't *actually* hold that credence. You're just saying words.

  If your buddy says, "I have incoherent beliefs but I won't bet on them," he is essentially admitting that his beliefs have **no cash value**. They don't connect to reality or action. If a belief doesn't guide action, what is it doing in your head?

  ### 2. Life is Full of Implicit Bets
  The biggest flaw in your buddy's argument is assuming "bets" only happen in casinos or with bookies. In decision theory, **almost every action is a bet.**

  *   **Carrying an umbrella:** You are betting a small amount of effort (carrying it) against a large amount of discomfort (getting wet), weighted by your credence of rain.
  *   **Crossing the street:** You are betting your life against the credence that a car will hit you.
  *   **Studying for a test:** You are betting time against the credence that it will improve your grade.

  If your credences are incoherent (e.g., you think there is a 60% chance of rain and a 60% chance of no rain), you will make systematically bad decisions. You might carry an umbrella *and* wear sandals, or study for the wrong exam. You don't need a bookie to exploit you; **reality will exploit you.** You will expend resources on strategies that are guaranteed to yield worse outcomes than alternative strategies, simply because your internal probability map is broken.

  ### 3. The "Dominated Strategy" Problem
  Even if your buddy refuses to bet, incoherent credences lead to what decision theorists call **dominated strategies.**

  Imagine you have incoherent credences about two events, A and B. Because your probabilities don't sum correctly, there might be two courses of action available to you in life where:
  1.  Action X is better than Action Y if A happens.
  2.  Action X is *also* better than Action Y if B happens.
  3.  But because your credences are messed up, you choose Action Y.

  By choosing Y, you have guaranteed yourself a worse outcome regardless of what happens. You don't need to accept a formal bet to suffer this loss; you suffer it through missed opportunities and wasted effort. The Dutch Book argument is just a mathematical way of highlighting that **incoherence makes you vulnerable to making decisions that are strictly worse for you.**

  ### 4. The Epistemic vs. Pragmatic Argument
  There are two ways to interpret the Dutch Book Argument:
  *   **Pragmatic:** Incoherence makes you lose money. (Your buddy's focus).
  *   **Epistemic:** Incoherence is a form of logical inconsistency. (The deeper point).

  Most philosophers today think the DBA is a proxy for logical consistency. Believing in a way that violates probability axioms is like believing "P and not-P."

  If your buddy says, "I believe P and not-P, but I just won't act on it," he still has a broken mind. The money loss is just a vivid illustration of the logical error. The fact that he can avoid the *symptom* (losing money) doesn't cure the *disease* (logical incoherence).

  ### 5. The "Shut Up and Multiply" Counter
  Finally, there is a practical problem with the "never bet" strategy. To decide *not* to bet, you still have to use your credences.

  You have to calculate: *Is the risk of this bet worth the potential loss?*
  If your credences are incoherent, you can't even reliably calculate whether opting out is the right move. You might opt out of a "Dutch Book" (a bad set of bets) but also opt out of a "Sure Thing" (a guaranteed win) because your broken probability calculator tells you it's risky.

  ### The Verdict
  Your buddy is **technically correct but practically wrong.**

  *   **He is right** that a literal bookie cannot take his money if he refuses to play.
  *   **He is wrong** that this protects him from the consequences of incoherence.

  Incoherent credences guarantee that you will navigate the world inefficiently. You will fear things that aren't scary, ignore risks that are dangerous, and waste resources on plans that are mathematically guaranteed to fail. The Dutch Book argument isn't just about gambling; it's about the fact that **probability is the logic of consistency.** If you violate it, you are broken, regardless of whether you carry a wallet.

  **Tell him:** "You can avoid the bookie, but you can't avoid reality. If your internal odds are broken, you're going to keep walking into walls."
