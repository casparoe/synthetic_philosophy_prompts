          1.  Validate the user's reading (it's not a crackpot theory, it's well-founded).
          2.  Address (a) History/Logic: Confirm the Dualism and the SPR connection. Mention Schneewind/Schultz.
          3.  Address (b) The Philosophical Move: Analyze the Normative/Empirical gap. Explain *why* Sidgwick thought it worked (harmonizing interests) vs. why it might fail (undermining moral motive).
          4.  Address (c) Literature: Point to Schneewind, Schultz, and the Kantian comparison. Mention the "Esoteric Morality" angle.
          5.  Conclusion: Encourage the user that their intuition about the "category mistake" is the exact hinge point of modern Sidgwick scholarship.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to say Sidgwick *believed* in ghosts. He was agnostic but hopeful. He wanted *evidence*.
      *   *Nuance:* The user asks if empirical evidence settles "rational authority." I need to clarify that for Sidgwick, "Rational" = "Maximizing Good." If Egoism and Utilitarianism conflict, Reason is divided. If God aligns them, Reason is unified. So empirical evidence *does* settle the unity of reason, even if it doesn't change the definition of "Good."
      *   *Literature:* Ensure I mention *The Gifford Lectures*. That's where he tries to bridge natural theology and ethics.
      *   *The "Friend's" View:* Acknowledge the friend isn't *wrong* that it looks like a Victorian crisis, but the user is *right* that it's structurally necessary for Sidgwick's system.

  8.  **Final Polish:** Check against the three specific prompts (a, b, c) to ensure all are answered clearly. (The resulting output matches the detailed response provided previously.)
answer: |-
  This is an exceptionally sharp piece of reasoning. You have correctly identified the structural hinge of Sidgwick's later thought, and your worry about the normative/empirical gap is precisely the problem that keeps Sidgwick scholars awake at night. You are not re-deriving a criticism imperfectly; you are articulating the central tension in Sidgwick's project that the best literature grapples with.

  Here are my comments on your three specific points.

  ### (a) History and Internal Logic
  You have the history and the internal logic of Sidgwick's argument right.

  **The History:** It is well-documented that Sidgwick did not view the Society for Psychical Research (SPR) as a hobby or a spiritualist séance club. He viewed it as a rigorous scientific extension of his epistemological commitments. He applied the same evidential standards to telepathy or survival as he did to ethical axioms. As you note, this began in earnest with the founding of the SPR in 1882, shortly after the final edition of *The Methods of Ethics* (1884) was taking shape.

  **The Internal Logic:** Your reading of the "Dualism of Practical Reason" is accurate. Sidgwick concludes *The Methods* with the admission that he cannot reconcile Rational Egoism (it is rational to seek my own happiness) with Rational Benevolence/Utilitarianism (it is rational to seek the universal good) without a theological premise. He writes famously that if the dualism is real, "the conflict of the two principles... would be a contradiction in the ultimate laws of reason."

  He explicitly states that the existence of a "Moral Government of the Universe" (a God who rewards virtue with happiness, likely in an afterlife) is the only thing that can harmonize these two dictates. Therefore, seeking empirical evidence for such a government (via survival of death, etc.) is not a retreat from philosophy; it is an attempt to secure the necessary major premise for the validity of ethics itself. You are correct: for Sidgwick, the SPR was "ethics by other means."

  ### (b) The Philosophical Move: Normative vs. Empirical
  Your worry is the strongest part of your reflection: *Does empirical evidence settle a question about rational authority?*

  **Where Sidgwick is Coherent:**
  Sidgwick is not trying to use empirical evidence to prove that Utilitarianism is the *true* moral theory. He already thinks he has established that via intuitionism. His problem is **rational motivation**. He is worried that if Egoism is equally rational, then a rational agent has no decisive reason to be moral when morality conflicts with self-interest.
  If empirical evidence proves an afterlife where virtue is rewarded, the *conflict* disappears. It does not refute the logic of Egoism; it makes Egoism and Utilitarianism coincide. In this specific sense, empirical evidence *does* solve the "Dualism." It unifies practical reason by showing that the "Point of View of the Universe" and the "Point of View of the Individual" lead to the same place.

  **Where Your Critique Hits Home:**
  However, your suspicion of a category mistake is philosophically potent. There are two ways to frame this criticism, both present in the literature:

  1.  **The Kantian Objection:** Kant argued that God and Immortality are *Postulates of Practical Reason*. We must assume them for morality to make sense, but we cannot (and need not) prove them empirically. Sidgwick's "sin," from a Kantian perspective, was trying to empirically verify what must remain a rational presupposition. By looking for ghosts to save ethics, Sidgwick risks making morality contingent on cosmic bookkeeping. If the ghosts aren't there, is morality irrational? Sidgwick seems forced to say "yes," which is a devastating conclusion for a moral philosopher.
  2.  **The "Prudence vs. Morality" Objection:** If the only reason to be moral is that God will punish you otherwise (or reward you), have you preserved the *moral* motive? Or have you simply reduced morality to enlightened long-term prudence? If the coincidence of duty and interest is guaranteed by external sanctions, the specific rational authority of the "Point of View of the Universe" is weakened. It becomes merely the most efficient path to self-interest. Your friend might argue this reduces Sidgwick's high-minded utilitarianism to a cosmic transaction.

  So, your intuition is correct: Sidgwick is trying to solve a normative problem (the authority of reason) with an empirical solution (evidence of survival). It holds together *if* you accept that the "rationality" of ethics depends on the harmony of interests. It falls apart if you believe moral obligation must hold even in the absence of such harmony (a view held by later intuitionists like H.A. Prichard).

  ### (c) Literature and Criticisms
  You should definitely engage with the existing scholarship, because your argument places you in the company of the most serious Sidgwick interpreters. You are not reinventing the wheel, but you are turning it correctly.

  **1. J.B. Schneewind, *Sidgwick's Ethics and Victorian Moral Philosophy* (1977)**
  This is the definitive work. Schneewind devotes significant space to the SPR and the "Moral Government." He argues exactly what you are arguing: that Sidgwick's psychical research was a desperate attempt to find the empirical grounding for the theological premise required to save ethics from the Dualism. Schneewind validates your view against your friend's "biographical curiosity" claim.

  **2. Bart Schultz, *Henry Sidgwick: Eye of the Universe* (2004)**
  This is the standard intellectual biography. Schultz goes into granular detail on the SPR years. He supports your reading that Sidgwick saw this as scientific and philosophical work, not spiritualism. Schultz also highlights Sidgwick's secrecy (the "Sidgwickian Secret")—Sidgwick worried that admitting the Dualism was unresolved would undermine public morality, which adds weight to your claim that this was a high-stakes philosophical project, not a hobby.

  **3. The "Esoteric Morality" Debate**
  You should look into the literature on Sidgwick's "esoteric morality" (the idea that philosophers should sometimes hide the truth to preserve social utility). Some scholars link this to his SPR work: if evidence for a moral government is inconclusive, should we pretend it exists to keep the egoists in line? This connects your empirical/normative worry to political philosophy.

  **4. Roger Crisp and Terence Penelhum**
  Both have written on the Dualism. Crisp, in particular, analyzes whether the Dualism is a failure of Sidgwick's system or a honest acknowledgment of the human condition. Engaging with Crisp will help you refine your point about whether the empirical evidence *could* ever settle the rational authority question.

  ### Summary Recommendation
  Your reasoning is sound. You should push back against your friend by citing Schneewind: the SPR work is not detachable because the *Methods* ends with an explicit demand for the very evidence the SPR sought to find.

  However, you should concede the philosophical difficulty you identified. The strongest criticism of Sidgwick is not that he was silly for believing in ghosts, but that he recognized the **contingency of rational morality**. If ethics requires a police force (divine or otherwise) to be rational, then ethics lacks the categorical authority Sidgwick wanted for it.

  Your final paragraph is the winner here. You might frame it this way to your friend: *"Sidgwick didn't turn to psychical research because he lost his faith; he turned to it because his ethics required a premise that reason alone couldn't supply. The tragedy isn't that he looked for ghosts, but that he realized the rationality of being good might depend on whether the universe is rigged in favor of the good."*

  That moves the debate from "Victorian eccentricity" to "meta-ethical crisis," which is where it belongs.
