      *   **Intervention/Manipulation:** If I light a fire, smoke appears. If I wear the socks, does the team win? (Counterfactual dependence).
      *   **Coherence with Background Knowledge:** The smoke inference coheres with chemistry and physics. The sock inference contradicts our understanding of sports, physics, and agency.

