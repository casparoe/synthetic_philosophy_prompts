      *   *Goodman's "New Riddle of Induction" (Grue):* This is the direct descendant of this problem. It distinguishes between "projectible" and "non-projectible" predicates.
      *   *Inference to the Best Explanation (IBE):* This is the strongest tool here. Smoke $\rightarrow$ Fire posits a causal mechanism. Socks $\rightarrow$ Wins does not.
      *   *Causal Powers/Dispositions:* Smoke has a causal connection to fire (effect of cause). Socks have no causal power over football outcomes.
