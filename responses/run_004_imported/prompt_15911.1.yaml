      *   Strictly speaking, the nephew is *right* about the logical status. There is no *logical* guarantee that smoke implies fire any more than socks imply wins.
      *   However, the nephew is *wrong* about the *pragmatic* and *explanatory* status. The distinction isn't logical; it's metaphysical and explanatory.

  3.  **Brainstorming Philosophical Angles:**
