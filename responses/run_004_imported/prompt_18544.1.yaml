answer: |-
  David Lewis's confrontation with the "Big Bad Bug" represents one of the most significant moments in contemporary metaphysics. It highlights a tension between a reductionist ontology of chance (Humean Supervenience) and the normative role chance plays in rational belief (the Principal Principle). Below is an explanation of the inconsistency, Lewis's solution, and an evaluation of whether that solution holds philosophical water.

  ### 1. The Setup: Principal Principle and Humean Supervenience

  To understand the bug, we must first define the two pillars Lewis is trying to reconcile.

  *   **The Principal Principle (PP):** This is a bridge principle between objective chance and subjective credence. Roughly, it states that if you know the objective chance of an event $A$ is $x$, and you have no "inadmissible" evidence (e.g., crystal ball gazing), your credence in $A$ should be $x$. Formally: $C(A \mid \langle Ch(A)=x \rangle \& E) = x$.
  *   **Humean Supervenience (HS):** This is Lewis's metaphysical thesis that everything about the world supervenes on the "Humean Mosaic"—the spatiotemporal distribution of local, particular qualities. Crucially, for Lewis, laws of nature and objective chances are not fundamental; they are summaries of the mosaic. Chances are determined by the "Best System": the axiomatic system that best balances strength and simplicity in describing the *entire* history of the world (past, present, and future).

  ### 2. The Big Bad Bug: Why Undermining Futures Create Inconsistency

  The conflict arises because HS makes chances dependent on the **future**, while the PP treats chances as guides **to** the future.

  **The Logic of the Contradiction:**
  1.  **Current Theory:** Let $T$ be the true theory of chance at the present time. According to HS, $T$ is determined by the total history of the world, including the future.
  2.  **Undermining Future:** Consider a possible future history, $F$. $F$ is an "undermining future" if, were it to occur, the total history would be different enough that $T$ would no longer be the Best System. Instead, some other theory $T^*$ would be the true theory of chance. Thus, $F$ entails that $T$ is false ($F \rightarrow \neg T$).
  3.  **Positive Chance:** However, according to the current theory $T$, the future $F$ is possible. That is, $T$ assigns a positive chance to $F$ occurring ($Ch_T(F) > 0$).
  4.  **Applying the PP:** The Principal Principle tells us that our credence in $F$, conditional on $T$ being the true chance theory, should equal the chance $T$ assigns to $F$.
      $$C(F \mid T) = Ch_T(F) > 0$$
  5.  **The Contradiction:** However, given HS, $F$ and $T$ are logically incompatible. If $F$ occurs, $T$ is not the true theory. Therefore, logically, the probability of $F$ given $T$ should be zero.
      $$C(F \mid T) = 0$$

  We are left with a contradiction: The PP requires our credence to be positive (because $T$ says $F$ is possible), but logic requires our credence to be zero (because $F$ undermines $T$). The PP, combined with HS, generates inconsistent credences.

  ### 3. Lewis's Response: The Revised Principal Principle

  Lewis refused to abandon Humean Supervenience, which he viewed as essential to a materialist metaphysics, nor did he want to abandon the Principal Principle, which he viewed as essential to the concept of chance. Instead, in his 1994 paper *"Humean Supervenience Debugged,"* he revised the Principal Principle.

  **Ruling Undermining Futures Inadmissible:**
  Lewis's solution was to tighten the definition of "admissible evidence." In the original PP, admissibility was vaguely characterized as information about the past. In the revised version, Lewis argued that information about undermining futures is **inadmissible** relative to the chance theory $T$.

  The Revised Principal Principle (RPP) states that one's credence should match the chance only when conditional on the chance theory $T$ *and* admissible evidence. Since an undermining future $F$ entails $\neg T$, conditioning on both $T$ and $F$ creates a contradiction in the antecedent ($T \& F$ is impossible). To avoid conditioning on a contradiction (which makes probability undefined), Lewis stipulates that any proposition that entails the falsity of the chance hypothesis must be ruled inadmissible.

  By definition, you are not allowed to use knowledge of the future that would undermine the present chance distribution when applying the PP. This blocks the contradiction: you never calculate $C(F \mid T)$ because $F$ is excluded from the evidence set allowed in that context.

  ### 4. Evaluation: Principled or Ad Hoc?

  Is Lewis's move a deep philosophical insight or a desperate patch? The philosophical community remains divided, but the weight of criticism suggests it is **formally principled but metaphysically costly.**

  **The Case for "Principled":**
  Defenders argue that Lewis is simply respecting the logic of conditionalization. If you condition on a hypothesis $T$, you must temporarily assume $T$ is true. If your evidence $E$ logically contradicts $T$, the conditional probability $P(\cdot \mid T \& E)$ is undefined. Therefore, to make the PP work, one *must* restrict evidence to propositions compatible with the chance hypothesis. On this reading, Lewis isn't patching a hole; he is clarifying that the PP is a constraint on credence *within* a hypothetical framework where the chance theory holds. It treats chance theories like scientific theories: you evaluate predictions assuming the theory is true, not while simultaneously assuming evidence that falsifies it.

  **The Case for "Ad Hoc":**
  Critics argue that this move severs the connection between metaphysics and epistemology in an untenable way.
  1.  **Epistemic Blindness:** HS tells us that the future *metaphysically determines* the present chances. Yet, the RPP tells us we must epistemically ignore this determination to have rational credences. We are forced to act as if chances are fundamental guides to the future, even though our metaphysics tells us they are merely summaries of the future.
  2.  **Redefining Admissibility:** The charge of ad hoc-ness stems from the fact that "admissibility" seems to be defined solely to save the PP from HS. In 1980, admissibility was about causal access (past vs. future). In 1994, it became about logical compatibility with the chance theory. This looks like moving the goalposts to protect the system from refutation.
  3.  **The "Bug" Remains:** While the mathematical contradiction is resolved, the conceptual tension remains. As philosopher Carl Hoefer argued, if chances supervene on the mosaic, they cannot also constrain rational belief about that mosaic in the way the PP suggests without circularity. Lewis's fix hides the circularity behind a restriction on evidence, but it does not explain *why* rational agents should ignore the metaphysical structure of their world.

  **Verdict:**
  Lewis's response is **technically principled but philosophically unsatisfying.** It is principled in the sense that it avoids logical triviality; you cannot condition on contradictions. However, it is ad hoc in the sense that it insulates the epistemology of chance from the metaphysics of chance. It requires agents to adopt a "fictionalist" stance toward their own metaphysical commitments: they must believe HS is true, but reason as if it isn't when assigning credences.

  Ultimately, the "Big Bad Bug" suggests that Lewis cannot have it all. He can keep Humean Supervenience, or he can keep the Principal Principle in its strong, intuitive form, but he cannot keep both without imposing artificial restrictions on rational inquiry. Most contemporary Humeans (like Hoefer) have accepted this cost, arguing that we must revise our understanding of what chance *is* (Humean Objective Chance) rather than trying to patch the Principal Principle. Lewis's solution saves the system, but at the price of admitting that Humean chances do not play the exact epistemic role we intuitively think they do.
