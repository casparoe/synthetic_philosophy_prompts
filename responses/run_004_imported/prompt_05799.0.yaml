answer: |-
  **Setting:** *A quiet corner of a museum café. Two empty coffee cups sit between them. On the table lies a catalog for the exhibition they just walked through.*

  **Leo (Optimist):** You're shaking your head, but you have to admit, the retrospective was worth the trip. Especially that final canvas. It's clearly the artist's most subtly structured work.

  **Mara (Pessimist):** I admit the trip was worth it. I admit the canvas is striking. But I don't admit *you* know it's subtly structured.

  **Leo:** Excuse me? I stood in front of it for twenty minutes.

  **Mara:** You stood in front of it for five. Then you checked your phone to read the review by Hitchens that you'd downloaded earlier. You told me on the way out, "Hitchens says the structure is subtle, so it is." That's not an aesthetic judgment, Leo. That's a citation.

  **Leo:** It's testimony. If I trust Hitchens's expertise, and I know he's sincere, why can't I form a justified belief based on his word? I do it all the time. If a physicist tells me a black hole exists, I believe it. If a mechanic tells me my transmission is shot, I believe it. Why is art special?

  **Mara:** Because of the Acquaintance Principle. In aesthetics, to judge that X is beautiful, or structured, or profound, you must base that judgment on your own first-hand experience of X. You can't outsource the sensitivity.

  **Leo:** That sounds like a rule made to keep critics employed. If the principle is "you must experience it yourself," fine, I experienced it. But why can't my belief be *justified* by someone else's experience? If Hitchens has seen the structure, and he transmits that knowledge to me, I have the knowledge.

  **Mara:** You have the proposition. You don't have the justification. Aesthetic value isn't a fact sitting in the object like mass or chemical composition. It's a relation between the object and a subject's response. If you haven't had the response, or if your belief isn't grounded in *your* response, you're disconnected from the value itself. You're just parroting a verdict.

  **Leo:** Okay, let's press that. If the Acquaintance Principle kills aesthetic testimony, it seems to kill moral testimony too. If I tell you, "What that corporation did to the village was unjust," and you believe me because you trust my moral sensitivity, have you gained a justified moral belief?

  **Mara:** Yes.

  **Leo:** Aha. So why the double standard? If I can inherit your moral verdict, why not your aesthetic one? Is beauty less real than justice?

  **Mara:** It's not about reality. It's about function. Moral judgments are primarily action-guiding. I need to know the act is wrong so I can condemn it, stop it, or avoid it. I can do that on testimony. If you tell me the bridge is unsafe, I don't need to calculate the load-bearing stress myself to know I shouldn't cross it. I just need to know the fact.

  **Leo:** And aesthetics isn't action-guiding?

  **Mara:** Not in the same way. Aesthetic judgments are about *appreciation*. Their point is to cultivate a specific kind of attention and emotional response. If you believe the novel is profound just because I said so, you might buy the book, but you can't *appreciate* it on that basis. The belief is inert. In morality, the belief alone does the work. In aesthetics, the belief is supposed to lead to an experience. If you skip the experience, you've missed the point of the concept entirely.

  **Leo:** That's a claim about the *utility* of the belief, not the *justification* of it. I'm asking if I'm rational to believe it. You're saying I'm irrational because I'm missing out on the fun.

  **Mara:** I'm saying you're irrational because you're treating a response-dependent property as if it were response-independent. Look, if I tell you the soup is salty, you can believe me. But if you haven't tasted it, you don't know the *saltiness*, you only know the *report*. Saltiness is defined by the taste. Beauty is defined by the appreciation.

  **Leo:** But here's where you're glossing over the mechanism of testimony. You're assuming testimony is just handing over a verdict: "It's good." That's gossip. Good testimony transmits *grounds*.

  **Mara:** Go on.

  **Leo:** When Hitchens writes that the canvas is subtly structured, he doesn't just stamp "Good" on it. He points out the recurrence of the ochre motif. He notes the tension between the vertical lines and the horizon. He gives me the reasons. When I read that, I'm not just inheriting his conclusion; I'm inheriting his *grounds*. I take those reasons and I adopt them as my own justification.

  **Mara:** Do you, though? You read the words "ochre motif." You didn't see how the ochre pulls the eye. You read "tension." You didn't feel the strain. You have the description of the grounds, not the grounds themselves.

  **Leo:** Why is a description of a ground insufficient? If I've never seen a chess game, and a grandmaster explains why a move is brilliant, describing the board state and the potential threats, I can justifiably believe the move is brilliant. I understand the reasons.

  **Mara:** Chess is rule-bound. Aesthetics is perceptual. The grandmaster can give you the rules. The critic can only give you metaphors. When the critic says "the ochre pulls the eye," that is a prompt for *you* to look. If you look and see it, then you have a justified belief. But the justification comes from your seeing, not his telling. If you believe it *without* seeing it, just because he said it, you are treating a perceptual reason as a logical premise. You can't detach the reason from the perception.

  **Leo:** So you're saying the "grounds" in aesthetics are essentially private experiences?

  **Mara:** I'm saying they are essentially *experienced*.

  **Leo:** But that makes aesthetic knowledge solipsistic. It implies we can never share aesthetic reasons, only report on our internal states. If I can't inherit your grounds via your description, then criticism is impossible. Criticism *is* the transmission of grounds to alter another's perception.

  **Mara:** Criticism is an invitation to look, not a substitute for looking. The optimist wants to use testimony to bypass the work of perception. The pessimist says the work of perception *is* the justification.

  **Leo:** I'm not trying to bypass perception. I'm trying to expand my conceptual vocabulary so I can perceive *better*. But sometimes, I have to trust the expert before I have the capacity to see it myself. I believe the wine is oaky because the sommelier says so, even if my palate isn't trained enough to distinguish the oak yet. I'm deferring to his competence to form a true belief until my competence catches up.

  **Mara:** And that's fine for buying the wine. But do you *know* it's oaky? Or do you know that *he knows* it's oaky? There is a difference between knowing that a proposition is true and understanding *why* it is true in the aesthetic sense. You have the "that." You lack the "because."

  **Leo:** I have the "because"! He told me! "Because of the tannins."

  **Mara:** You have the word "tannins." You don't have the bite on the tongue. In morality, knowing the "that" is enough to guide action. In aesthetics, knowing the "that" without the "because"—the felt because—is empty. It's a shell of a belief.

  **Leo:** So the disagreement isn't about epistemology. It's about metaphysics.

  **Mara:** How so?

  **Leo:** You think aesthetic value is constituted by the feeling. I think aesthetic value is a property of the object that *causes* the feeling. If it's a property of the object, I can learn about it via reliable indicators, like your testimony. If it's constituted by the feeling, then obviously I can't have your feeling via testimony.

  **Mara:** Precisely. If you think beauty is like mass, testimony works. If you think beauty is like digestion, testimony fails. I'm saying aesthetic value is closer to digestion. It requires a subject processing the object. You can't digest for me, Leo.

  **Leo:** But I can trust your digestive report!

  **Mara:** And you can act on it. But you can't claim you know the taste.

  **Leo:** I claim I know the *fact* of the taste. And that is a justified belief.

  **Mara:** Then we mean different things by "aesthetic belief." You mean "a belief about an aesthetic fact." I mean "a belief grounded in an aesthetic response."

  **Leo:** And I say yours is too elitist to function in a world where we rely on experts for everything.

  **Mara:** And I say yours is too hollow to count as appreciation.

  **Leo:** So I'm rational, but uncultured?

  **Mara:** You're informed, Leo. But you're not justified. Not aesthetically.

  **Leo:** Then your Acquaintance Principle doesn't just block testimony. It blocks education. It says I can't learn to see until I already see.

  **Mara:** No. It says testimony can point the way, but it cannot carry you. You're trying to let Hitchens carry you.

  **Leo:** I'm letting him lend me his eyes.

  **Mara:** You can't borrow eyes. You can only open your own.

  *(Leo picks up the catalog, tapping the cover.)*

  **Leo:** Then tell me this. If I read Hitchens, and then I look at the painting, and I still don't see the structure... but I believe him anyway. Am I lying?

  **Mara:** No. You're trusting.

  **Leo:** And if I trust a moral expert when I'm confused about a dilemma?

  **Mara:** You're obeying.

  **Leo:** So the difference is Trust vs. Obedience?

  **Mara:** The difference is that in aesthetics, the trust *is* the failure. If you have to trust me that it's beautiful, it isn't beautiful *to you*. And aesthetic value is always *to someone*.

  **Leo:** Then we're done. Because I think aesthetic value is something we build together, through language and trust. You think it's something I have to suffer alone.

  **Mara:** I think it's something you have to witness. And testimony is just the summons to the stand.

  *(Mara stands up, leaving the catalog on the table. Leo looks down at it, then out the window toward the gallery wing.)*
