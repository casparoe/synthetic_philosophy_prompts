      *   *The Husband:* Needs to feel warm but helpless. He should listen intently but look confused. He might offer practical solutions that miss the point (e.g., "Let's go for a walk" when she can't leave the house). He might touch her comfortingly, but the touch feels wrong because the problem is internal. The tone should be frustrated, sad, intimate but distant.

  4.  **Developing Specific Techniques:**
