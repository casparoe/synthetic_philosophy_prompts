answer: |-
  You are absolutely right, and your writing group is missing a crucial nuance. While the *outcome* of both scenes might feel similar (she remains untreated and misunderstood), the *nature* of the conflict is fundamentally different.

  The distinction lies in **Power vs. Intimacy**, or **Invalidation vs. Alienation**.

  *   **The Doctor** represents **Systemic Invalidation**. He has the vocabulary to understand her, but he chooses not to apply it to her because of her gender and class. He closes the door on her experience.
  *   **The Husband** represents **Intimate Alienation**. He wants to open the door, but he doesn't have the key. He is standing in the dark with her, but he can't see what she sees.

  If you write them as the same beat, you isolate your protagonist completely. If you write them distinctly, you show that she is surrounded by a system that denies her (the doctor) and a love that cannot save her (the husband). That is much more tragic and complex.

  Here is how to articulate that distinction on the page without asserting it.

  ### 1. The Doctor: The Closure of Authority
  The doctor's scene should feel clinical, final, and hierarchical. He is not trying to understand; he is trying to *categorize* so he can move on.

  *   **The Vocabulary:** Give him the words she lacks. In the early 1920s, "shell shock" was a known concept for men returning from the War. He might even use that analogy, but only to dismiss it. *"That's for boys who held rifles, not women who hold houses."* He has the language but denies her access to it.
  *   **Body Language:** He should be busy. Writing in a ledger, washing his hands, looking at the clock. He creates physical distance. He stands while she sits.
  *   **The Resolution:** The scene ends with a prescription. A tonic, a sedative, a order to "rest." It is a transactional ending. He has fixed the "problem" by labeling it "nerves."
  *   **Her Internal Reaction:** She should feel **anger** and **smallness**. She feels talked over.

  **Example Beat:**
  > Dr. Evans didn't look up from his ledger. "The vapours are common this time of year, Mrs. Gwynne. Damp in the air, damp in the blood."
  > "It's not the damp," she said. "It's the shaft. I can smell the coal dust when I close my eyes."
  > He dipped his pen. "Then don't close them. Keep busy. A idle mind is the devil's workshop, and a woman's mind is idle enough by nature." He tore off a prescription. "Bromide. Twice daily. You'll sleep."
  > He handed her the paper like a ticket. The conversation was over.

  ### 2. The Husband: The Failure of Language
  The husband's scene should feel warm, confused, and open-ended. He is not dismissing her; he is drowning alongside her.

  *   **The Vocabulary:** He should struggle to speak. Use hesitations, interruptions, and circular logic. He might try to use *his* framework (work, money, physical safety) to solve *her* problem (psychological trauma), highlighting the gap. *"But the pit is safe now. The inspectors came."* He doesn't get that the danger is inside her.
  *   **Body Language:** He should seek connection. Reaching for her hand, sitting close, leaning in. But his touch might feel overwhelming to her, or he might pull back when he sees it doesn't help.
  *   **The Resolution:** The scene ends in silence or a shared, unresolved moment. There is no prescription. There is only the presence of another person who cannot fix it.
  *   **Her Internal Reaction:** She should feel **grief** and **loneliness**. She loves him, but she realizes she is alone in her head.

  **Example Beat:**
  > Dai sat on the edge of the bed, his boots still on. He held her hand, his thumb rubbing the knuckle, rough and warm.
  > "I know it's bad, El," he said. "But tell me what to do. Tell me what fixes it."
  > "There isn't a fix."
  > "There's always a fix. If it's the money, I can pick up extra shifts. If it's the house, we'll move."
  > "It's not the house."
  > He looked at their joined hands, helpless. He wanted to fight something he could hit. "I just... I don't know how to be where you are. It's like you're down the shaft and I'm up here."
  > He didn't let go of her hand, but she felt the distance widen, like a rope stretching tight between them.

  ### Key Differences to Highlight

  | Feature | The Doctor Scene | The Husband Scene |
  | :--- | :--- | :--- |
  | **The Obstacle** | Arrogance / Sexism | Lack of Concept / Love |
  | **The Tone** | Cold, brisk, definitive | Warm, hesitant, searching |
  | **The Dialogue** | Statements, commands | Questions, apologies |
  | **The Ending** | A prescription (False Cure) | Silence (Shared Burden) |
  | **Protagonist's Feeling** | "He won't hear me." | "He can't hear me." |

  ### Why This Matters for Your Novel
  In a 1920s mining village, the community is everything.
  *   If the doctor dismisses her, it establishes the **societal constraint**. The world is built to ignore her pain.
  *   If the husband fails to understand, it establishes the **psychological isolation**. Even love cannot bridge the gap of trauma.

  If you make the husband dismissive like the doctor, you make him a villain. If you make him loving but helpless, you make the *trauma* the villain.

  **A Note on Historical Context:**
  Since this is the early 1920s, the shadow of the Great War is massive. Many men in that village would have returned with "shell shock." The tragedy for your protagonist is that the village has a name for men's trauma, but not for women's.
  *   **Doctor:** Might acknowledge shell shock in men but call her condition "hysteria."
  *   **Husband:** Might have seen comrades shake and sweat at a loud noise, and recognize it in her, but be socially forbidden from equating a woman's "nerves" with a soldier's "shock." He might want to say, *"It's like Tommo after the Somme,"* but stop himself because it feels wrong to compare a woman to a soldier.

  That hesitation in the husband—the moment he *almost* understands but pulls back—is where the scene becomes unique. It shows he is fighting his own conditioning to be there for her, whereas the doctor is resting comfortably in his.

  **Summary for your Writing Group:**
  Tell them: "One scene is about **authority refusing to listen**; the other is about **love failing to comprehend**. One leaves her with a pill; the other leaves her with a silence."
