      *   *Core Idea:* Laws are the axioms of the deductive system that best balances simplicity and strength (informative power) in describing the "Humean Mosaic" (the total collection of local matters of particular fact).
      *   *The Worry:* If the mosaic determines the laws, and the laws are supposed to explain the mosaic, isn't that circular? $A \rightarrow B$ (Mosaic determines Laws) and $B \rightarrow A$ (Laws explain Mosaic).
      *   *The Humean Response:* They distinguish between *metaphysical determination* and *scientific explanation*.
          *   Metaphysically: Mosaic $\rightarrow$ Laws.
          *   Epistemically/Scientifically: Laws $\rightarrow$ Mosaic (events).
          *   Analogy: A map summarizes the terrain. The terrain makes the map accurate. But I use the map to navigate the terrain. The map doesn't *cause* the terrain, but it explains *where I am* relative to the whole.
          *   Key Concept: *Systematization*. Explanation is unification. Showing how a particular event fits into the grand pattern *is* the explanation.

  3.  **Deconstruct the Anti-Humean Position (Governing View / Necessitarianism):**
      *   *Core Idea:* Laws are ontologically distinct from events. They "govern," "produce," or "constrain" events. There is a "nomic necessity."
