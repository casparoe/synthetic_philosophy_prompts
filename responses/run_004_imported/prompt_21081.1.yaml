      *   *Wait, if he suffers more, his disagreement point is lower.* We normalized disagreement to 0. So higher max means higher *gain*.
      *   If Bob gains more from agreement, does he deserve a bigger share of the *percentage* gain?
      *   KSBS: Yes, equal percentages.
      *   NBS: Depends on the curvature.
      *   *Let's focus on the IIA vs Monotonicity intuition.*
      *   **The "Phantom Option" Story:**
      *   Imagine the feasible set is a triangle.
      *   NBS picks a point.
      *   Now, cut off the top corner of the triangle (Bob's utopia). Bob's max possible utility drops.
      *   KSBS *must* change the solution (Monotonicity violation? No, Monotonicity says if set expands, gain increases. So if set shrinks, gain decreases). So if we remove Bob's utopia, KSBS gives Bob less.
      *   NBS: If the solution point wasn't near the top corner, NBS *doesn't change*. (IIA).
      *   *Intuition:* Should removing an option nobody was going to pick anyway change the deal?
      *   Most people say **No**. (Supports NBS).
      *   KSBS says **Yes**. (Because it changes the "ratio to max").
      *   *This is the clearest distinction.*

  8.  **Structure of the Response:**
