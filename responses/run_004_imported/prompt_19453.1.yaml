      *   Hidden assumption? Yes (identification with future self).
      *   Restriction problem? Yes (triviality/circularity).
      *   Advisor's gloss? Yes (coherence vs. truth).

  *(Self-Correction Note)*: I need to be careful with the "Brainwashing" case. Van Fraassen would say RP doesn't apply there. The user knows this. The user's frustration is *why* that restriction feels like a dodge. I need to articulate *why* it feels like a dodge (it makes RP non-action-guiding).

  9.  **Drafting the Content:** (Mental Outline)
      *   Start with the "Contract" metaphor for DDB.
      *   Move to the "Alien Future Self" for the brainwashing case.
      *   Discuss the "Rationality Filter" and why it's epistemically idle.
      *   End with the Coherence/Rationality distinction.

  10. **Final Review:** Does this sound like it's written for a PhD student? Yes, it should respect their knowledge but offer conceptual clarity. (Proceed to generate output).

  *(Wait, one more thing)*: I should explicitly mention the distinction between *external* and *internal* perspectives. The DDB is external (bookie sees the inconsistency). The agent is internal (feels the tension). This helps explain the "gut level" feel.

