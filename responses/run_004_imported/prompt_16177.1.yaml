answer: |-
  You are spot on to feel that your teacher's summary is a bit reductive. While it's true that Anscombe's argument relies heavily on the **moral significance of intention** (which is the engine behind the Doctrine of Double Effect), reducing her pamphlet to a standard "DDE application" misses the radical, absolutist force of her critique.

  Your teacher is treating Anscombe's argument as a **technical failure** of DDE (i.e., "Truman failed condition #2, so the act was impermissible"). But Anscombe is making a **categorical accusation** (i.e., "Truman committed murder, and your moral philosophy is too corrupt to admit it").

  Here is a breakdown of why Anscombe's argument in *Mr. Truman's Degree* is doing something "extra" compared to a plain DDE analysis.

  ### 1. DDE is usually a Defense; Anscombe uses Intention as an Accusation
  In standard ethics classes, DDE is taught as a **shield**. It is used to explain why a doctor performing a craniotomy or a bomber hitting a munitions factory isn't a murderer, even though people die. It carves out a space for *permissible* killing.

  Anscombe flips this. She isn't trying to find a loophole to excuse Truman; she is using the concept of intention to **close off** loopholes.
  *   **Plain DDE:** "Did Truman intend the deaths? If no, maybe it's okay. If yes, it's bad."
  *   **Anscombe:** "The very policy was 'obliteration bombing.' The death of the population *was* the point. Therefore, the intention is explicit, and the act is intrinsically murder."

  For Anscombe, intention doesn't just determine if an exception applies; it determines the **moral species of the act**. If you intend to kill innocents, you are doing "murder." You don't get to move to the next step of the DDE test (proportionality). The trial is over before it begins.

  ### 2. The "Obliteration Bombing" Framing (The Means Condition)
  You mentioned the "obliteration bombing" framing, and this is the critical "extra" element.

  One of the four conditions of DDE is that **the bad effect cannot be the means to the good effect.**
  *   **Standard Defense of Truman:** "We bombed factories (good means) to end the war (good end). Civilians dying was a side effect."
  *   **Anscombe's Counter:** "Obliteration bombing" is a specific strategic doctrine. It does not aim primarily at military hardware; it aims at the **morale and existence of the civilian population** to force surrender.

  Anscombe argues that in this specific historical context, the suffering and death of civilians *was the method* used to achieve victory. Because the civilian deaths were the *means*, DDE is logically impossible to apply. It's not that Truman *failed* the DDE test; it's that the nature of the act places it outside the realm where DDE is even relevant. It is like asking if murder satisfies the DDE conditions. It doesn't, because murder is defined by the intention to kill innocents.

  ### 3. Rejection of Consequentialist Weighing (Proportionality)
  The fourth condition of DDE is **proportionality**: the good outcome must outweigh the bad outcome. This is where consequentialism sneaks in. A standard DDE analysis often devolves into a body count: *Did saving 1 million soldiers justify killing 200,000 civilians?*

  Anscombe explicitly rejects this calculus. Her pamphlet is a furious attack on consequentialism (which she calls "utilitarianism").
  *   **Plain DDE:** "Let's weigh the consequences to see if the act was proportionate."
  *   **Anscombe:** "You cannot weigh murder against victory. Certain acts are forbidden **absolutely**, regardless of the consequences."

  She argues that modern moral philosophy has convinced people that if the end is "good enough," the means don't matter. Her point is that **no end justifies the intentional killing of the innocent.** By framing it as a DDE argument, your teacher might imply that if the consequences had been *different* (e.g., if Truman saved more people), the act might have been permissible. Anscombe would say: **No.** If the intention was to kill innocents, it remains murder even if it saved the world.

  ### 4. The Verdict: "Murderer" vs. "Impermissible Act"
  This is the biggest difference in tone and conclusion.
  *   **Plain DDE Conclusion:** "Truman's action was morally impermissible because it violated the conditions of double effect." (This is a judgment on the *act*).
  *   **Anscombe's Conclusion:** "Truman is a murderer. Oxford is complicit in honoring a murderer." (This is a judgment on the *person* and the *institution*).

  Anscombe is engaging in a performative moral act. She isn't just analyzing ethics; she is demanding that the university uphold its duty to recognize evil. She argues that by giving him the degree, Oxford is effectively saying, "We don't believe murder is murder if it's done by a head of state for a 'good cause'."

  ### Summary: Is it just a special case of DDE?
  **No.** It is better to say that Anscombe and DDE share a **common foundation** (the importance of intention in moral action), but they use it for different purposes.

  *   **DDE** is a framework for navigating complex situations where bad effects are unavoidable but unintended.
  *   **Anscombe's Pamphlet** is a Natural Law argument that certain intentions (killing innocents) render an act intrinsically evil, making consequentialist justification impossible.

  **The "Extra" Thing Anscombe is Doing:**
  She is arguing that the **description of the act** matters more than the **outcome**. A standard DDE analysis might accept the description "Bombing Japan." Anscombe insists the description must be "Killing innocents to force surrender." Once you accept her description of the act, DDE isn't needed to condemn it; the definition of murder does the work immediately.

  So, tell your teacher: Anscombe uses the *logic of intention* (which underpins DDE) to block the *loophole of DDE*. She isn't saying Truman failed the test; she's saying the test doesn't apply to mass murder.

  ### Comparison Table

  | Feature | Plain DDE Analysis | Anscombe's *Mr. Truman's Degree* |
  | :--- | :--- | :--- |
  | **Role of Intention** | Determines if a side-effect is excusable. | Determines the moral identity of the act (Murder vs. War). |
  | **The "Means" Condition** | A technical hurdle to clear. | The core of the indictment (Civilians were the target/method). |
  | **Consequences** | Weighed for proportionality (Good > Bad?). | Irrelevant. Good ends cannot justify evil means. |
  | **Verdict** | The act was impermissible. | Truman is a murderer; Oxford is complicit. |
  | **Goal** | To guide action in complex scenarios. | To condemn moral corruption in philosophy/politics. |

  **Bottom Line:** Your intuition is correct. Reducing her argument to "just DDE" sanitizes it. It turns a fiery condemnation of state murder into a dry technicality about intended vs. foreseen effects. Anscombe would likely hate that reduction.
