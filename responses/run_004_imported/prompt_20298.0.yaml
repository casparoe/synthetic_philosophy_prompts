answer: |-
  Good evening. For those who don't know me, I'm the brother of the groom. I write novels for a living, which usually means I get to make things up. But tonight, I'm constrained by the truth, and specifically by the truth as Dana understands it.

  For the last year, Dana has cheerfully informed us that the capacity to make a promise is the rarest freedom a human being can achieve. She's been quoting the *Genealogy of Morals*, Second Essay. And because I know there are about a dozen philosophers in this room who would spot a misreading from across the buffet, I went back to the text.

  And she's right. It is dark. Nietzsche traces the history of the promise back through a prehistory of debt, cruelty, and the creditor's right to inflict punishment. He argues that to be the kind of creature that can remember a vow across time, we had to be burned. The "sovereign individual" is the one who emerges from that fire with a durable will, answerable to no one but themselves.

  Now, on the surface, this seems like a terrible blueprint for a marriage. Marriage is mutual. It is binding. Nietzsche's sovereign is autonomous, often solitary. If marriage is a contract, isn't it just recreating that old economy of debt? Do we owe each other?

  But here is what I see when I look at my brother and Dana.

  Nietzsche writes that the sovereign individual is the one who has the *right* to make promises. Not the obligation. The *right*. Most of us drift. We are creatures of the moment, blown by mood and convenience. To stand still, to look into the future, and to say "I will be this person, for you, regardless of what I feel in the moment"—that is not submission. That is the ultimate assertion of will.

  The danger of the *Genealogy* is the history of violence used to create memory. But the triumph of the sovereign individual is that they no longer *need* the violence to keep the word. They keep it because they are the kind of person who does.

  So, when my brother and Dana stand up tomorrow, they are not entering a contract of debt. They are not saying, "I owe you." They are saying, "I have forged a will strong enough to bind itself."

  In a world that prizes keeping your options open, choosing to close them is the only freedom that matters. They are two sovereigns, not merging into one blur, but standing side-by-side, fully answerable for the vow they are choosing to take. They are looking at the terrifying uncertainty of the future and saying, "We will make this true."

  That is the rarest freedom. It is hard-won. It is dangerous. And it is the only foundation solid enough to build a life on.

  So, if you would raise your glasses.

  To Dana and my brother: May you always keep the promise, not because you must, but because you are the kind of people who can. To the sovereign individual, and to the love that makes sovereignty worth sharing.
