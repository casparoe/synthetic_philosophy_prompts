  I've been working through the combination problem for panpsychism and keep getting stuck on what people call the "subject-summing" issue specifically, as distinct from the more general worry about micro-experiences combining into macro-experiences. My professor mentioned that Goff and Coleman actually disagree pretty substantially on where the real bite of the problem is—something about Coleman thinking the quality-combination issue (how determinate reddish or painful qualities could combine into new determinate qualities) is more tractable than the subject-combination issue (how there could be a fact about experiential unity that isn't just structural or functional), while others think it's the reverse. I'm also fuzzy on why phenomenal bonding relations are supposed to help here rather than just relocating the mystery—like, if bonding relations are themselves not fully transparent to us, doesn't positing them just push the combination problem back a level rather than solving it? Could you lay out the internal structure of the combination problem—the distinct sub-problems and why they don't obviously reduce to one another—and give me a sense of why "phenomenal bonding" is supposed to be progress rather than relabeling?
