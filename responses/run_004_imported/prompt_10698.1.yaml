answer: |-
  Your friend's argument is seductive because it relies on a model of rational choice that works perfectly in finance and statistics, but fails when applied to the psychology of creation. In his world, information is always an asset: it has value, or it has zero value, but it never has *negative* value.

  In the world of drafting a novel, however, information can be a liability. Your instinct that something is being left out is correct. Here is precisely where your friend's reasoning breaks down, and why your rule is likely the wiser course.

  ### 1. The "Zero Cost" Fallacy
  Your friend argues that reading the reviews "costs you nothing" because you can choose to ignore them. This assumes that your mind works like a filing cabinet, where you can look at a document and choose not to file it. In reality, the human mind works more like a dye bath. Once you immerse the fabric, it absorbs some color, even if you pull it out quickly.

  Reading a review, even one you intend to disregard, consumes **cognitive bandwidth**. It forces you to switch modes from *generator* (creating the world) to *evaluator* (judging the world). Every time you sit down to write the Aunt's chapters, a whisper of that review may surface. You might find yourself writing *against* a criticism you read, or *toward* a praise you received. Either way, you are no longer writing the book that wants to exist; you are writing a response to a critic. That mental friction is a real cost, paid in focus and authenticity.

  ### 2. The Illusion of the Filter
  Your friend suggests you can filter out the "unhelpful or unpleasant." The psychological reality is that negative feedback triggers a threat response in the brain, while positive feedback triggers a reward response. Both hijack your decision-making.

  *   **If the review is negative:** Even if you think they are wrong, your brain will flag the Aunt as a "problem area." You may cut her not because the story demands it, but to remove the source of potential pain.
  *   **If the review is positive:** You may feel pressured to replicate that success, turning a secondary character into a mascot because you know it "lands well," rather than because it serves the narrative arc.

  You cannot consciously control this priming effect. By reading the reviews, you introduce an external voice into the internal conversation you are having with your manuscript. In drafting, that internal conversation needs to be a monologue, not a town hall.

  ### 3. The Quality of the Data
  From a purely statistical standpoint, your friend assumes the reviews constitute valid data. Do they?
  *   **Trade reviews (Kirkus, PW)** are industry-facing. They assess marketability, pacing, and prose. They are rarely deep dives into character resonance or emotional arc. They are written by reviewers who read hundreds of books a year, not by the readers who live with your characters.
  *   **Sample Size:** You are looking at 3 to 5 reviews. In statistical terms, this is noise, not signal. Basing a structural decision in your sequel on the opinions of five industry professionals is risky data modeling.
  *   **The "Aunt" Specifics:** It is entirely possible the reviews won't mention the Aunt at all. If you expose yourself to the psychological risk of reading them and they *don't* contain the data you need, you have paid the cost with zero return.

  ### 4. The Nature of the Decision
  You are deciding between two versions of an opening. This is a structural and intuitive choice, not a logical one.
  *   **Version A (Aunt returns):** Does this serve the *theme* of the new book?
  *   **Version B (Aunt stays away):** Does this serve the *growth* of the protagonist?

  The "evidence" you are looking for (how the character landed last time) is actually irrelevant to what the story needs *this time*. Characters should evolve based on the internal logic of the series, not based on audience popularity. If the Aunt needs to be there for the story to work, she needs to be there even if the reviewers hated her. If she doesn't belong, she shouldn't be there even if they loved her.

  Looking to reviews for this decision is a form of outsourcing your artistic authority. It suggests you are looking for permission to make a choice you should be making based on your own vision.

  ### The Verdict
  Your friend is treating your creative process as an optimization problem. It is not; it is a cultivation process. In finance, you want to maximize return on investment. In writing, you want to maintain the integrity of the voice.

  **Where his argument breaks down:** He assumes the writer is separate from the writing. But you are the instrument. Anything that jars the instrument affects the music. Reading the reviews jars the instrument.

  ### A Proposed Alternative
  If you are truly stuck on the Aunt decision, do not use the reviews. Instead:
  1.  **Write both:** You say you have two versions of the opening. Write a few scenes further into *both* drafts. See which one generates more energy.
  2.  **Beta Readers:** If you need external data, use trusted beta readers on the *new* manuscript, not reviews of the old one. Ask them specifically: "Does the Aunt feel necessary here?"
  3.  **The "Blind" Test:** If you absolutely feel you must know how the Aunt was perceived, ask your editor (who has read the reviews) a specific, binary question: "Did the trade reviews mention the Aunt, and if so, was the sentiment generally that she was a highlight or a distraction?" Let your editor act as the filter. You get the data point without reading the prose that carries the emotional weight.

  **Recommendation:** Hold the reviews. Your rule exists because you learned a hard lesson in the past. Do not let a statistical argument convince you to bypass a psychological safeguard. The uncertainty you feel about the Aunt is part of the work; sitting with that uncertainty is often where the right answer emerges.
