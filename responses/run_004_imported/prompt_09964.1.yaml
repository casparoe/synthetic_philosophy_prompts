answer: |-
  This is one of the sharpest objections to the accuracy-first program, and you are right to feel uneasy about it. If you aren't careful, the argument *does* look like it says: "Let's assume a rule that makes probabilities look good, and conclude that probabilities are good."

  To get unstuck, we need to separate the **mathematical property** (strict propriety) from the **epistemic norm** (immodesty/stability), and then see why the combination forces probabilism without simply assuming it.

  Here is the intuitive walkthrough of the logic, specifically addressing your two hang-ups: why modesty is a bug, and why propriety isn't just a rigged game.

  ---

  ### 1. Reframing "Immodesty": It's Not Humility, It's Stability

  In everyday life, modesty is a virtue. In epistemology, specifically regarding your *own current credences*, modesty is a form of **self-sabotage**.

  Think of a credence function not as a "belief" in the fuzzy sense, but as a **plan for navigating the world**. It tells you how to weigh evidence, how to bet, and what to expect.

  *   **Immodesty:** "Given my current perspective, I expect myself to be the most accurate option available."
  *   **Modesty:** "Given my current perspective, I expect *someone else* (some other credence function) to be more accurate than me."

  **Why is Modesty irrational?**
  If your credence function $C$ tells you that $C^*$ is expected to be more accurate than $C$, then $C$ is telling you to abandon $C$ and adopt $C^*$.

  This creates a state of **epistemic instability**.
  1.  If you hold $C$, and $C$ is modest, then by your own lights, you are holding a sub-optimal tool.
  2.  Rationality requires that your norms be **self-recommending**. If a norm tells you to violate itself, it defeats its own purpose.
  3.  Therefore, a rational credence function *must* be immodest. It must think it is the best tool for the job.

  **The Intuition:** Imagine you are using a map to hike. If the map itself contained a note saying, *"Actually, the map in your left pocket is more accurate than this one,"* you would be irrational to keep using the current map. You'd switch. If your epistemic state tells you to switch to a different epistemic state, you are currently in a defective state.

  ### 2. The Role of Strict Propriety (Is it Rigged?)

  This is where the "question-begging" worry comes in.
  *   **Your Worry:** We want to prove probabilism. We choose a scoring rule that says "Probabilities expect themselves to be best." Isn't that assuming the conclusion?
  *   **The Reply:** Strict propriety is not a constraint on *agents* (to be probabilistic); it is a constraint on *accuracy measures*.

  **Why do we demand Strict Propriety of an accuracy measure?**
  Imagine we chose an *improper* scoring rule. Under an improper rule, a coherent probabilist might look at the world, calculate their expected accuracy, and conclude: *"You know what? If I adopt this crazy, incoherent set of beliefs, I'll get a better accuracy score."*

  If an accuracy measure tells a coherent agent to become incoherent to maximize accuracy, **that is a bad accuracy measure.** It severs the link between "being rational" and "pursuing accuracy."

  So, we demand strict propriety because we want an accuracy measure that respects the agent's own expectations. We want a measure where, *if* you have coherent expectations, you aren't incentivized to abandon them.

  **The Magic Trick (The Theorem):**
  Here is the non-circular punchline. We don't assume "Only probabilities can be immodest." We prove it.

  1.  We select a scoring rule that is strictly proper (because improper rules are epistemically perverse).
  2.  We run the math (Predd et al., or Pettigrew's representation theorems).
  3.  **The Result:** It turns out that **only** probabilistic credence functions can satisfy immodesty under a strictly proper rule.
  4.  If you are *non-probabilistic* (e.g., your credences sum to 1.2, or violate additivity), the math forces you to be **modest**. Your own expectations will identify a *probabilistic* function that is expected to be more accurate than you.

  So, the argument isn't "We assumed propriety to get probabilism."
  The argument is: "We assumed propriety to define *accuracy*. Once we define accuracy properly, it turns out non-probabilities are inherently self-defeating."

  ### 3. Walking Through the Logic Chain

  Here is the step-by-step flow you can use in your seminar:

  **Step 1: The Norm of Truth-Aim**
  Rational agents aim to be accurate. Therefore, rational agents should not adopt credence functions that they expect to be less accurate than available alternatives. (This is the "No Self-Defeat" norm).

  **Step 2: The Constraint on Measurement (Propriety)**
  To measure accuracy, we need a scoring rule. To be a *reasonable* measure, the rule must be strictly proper. Why? Because if it isn't, it tells coherent agents to adopt incoherent credences to maximize their score. We reject measures that incentivize epistemic suicide.

  **Step 3: The Mathematical Consequence**
  Given a strictly proper scoring rule:
  *   **If you are Probabilistic:** You expect yourself to be optimal. (You are Immodest/Stable).
  *   **If you are Non-Probabilistic:** You expect some *other* function (specifically, a probabilistic one) to be more accurate than you. (You are Modest/Unstable).

  **Step 4: The Conclusion**
  Since rationality requires stability (Step 1), and only probabilistic functions are stable under a reasonable accuracy measure (Steps 2 & 3), **rationality requires probabilism.**

  ### 4. Addressing the "Why Non-Probabilities are Modest" Intuition

  You might still ask: *Why* does violating probability axioms make me modest? Why can't I be a stubborn non-probabilist who thinks I'm the best?

  Think of probabilities as a **balanced weighting system**.
  If you violate the axioms (say, $P(A) + P(\neg A) > 1$), you are effectively "double counting" some possibilities or ignoring others in your expectation calculation.

  Because your weighting is skewed, there is always a "correction" (a probabilistic function) that aligns better with the actual distribution of truth values. Because your scoring rule is *proper* (it penalizes distance from the truth honestly), your own skewed expectations will admit that the "corrected" version is closer to the truth than you are.

  **Analogy:**
  Imagine you are trying to guess the center of a target.
  *   **Probabilist:** You guess the centroid. You know that moving anywhere else increases your expected distance from the bullseye.
  *   **Non-Probabilist:** You guess a point outside the centroid because you have a skewed sense of geometry. However, because your sense of geometry is skewed, even *you* can calculate that the centroid is statistically likely to be closer to the bullseye than your current guess. You admit, by your own skewed logic, that you should move to the centroid.

  ### 5. Summary for Seminar Discussion

  If you want to sound like you've got a handle on it, here is the synthesis:

  1.  **Modesty is irrational** because it violates the **Norm of Stability**. A rational state of mind shouldn't recommend its own abandonment.
  2.  **Strict Propriety isn't question-begging** because it is a constraint on the **definition of accuracy**, not the agent. We need propriety to ensure accuracy doesn't incentivize incoherence.
  3.  **The Link:** It is a mathematical theorem (not an assumption) that under any strictly proper measure, **non-probabilistic functions are necessarily modest**. They are inherently unstable.
  4.  **Therefore:** Probabilism is the only credal structure that allows an agent to be accurate-seeking without being self-defeating.

  **One final caveat to mention:**
  The strongest objection to this (from people like Miriam Schoenfield or Robert Williams) is exactly your second worry: *Is it legitimate to rule out all improper scoring rules?* If there is *some* reasonable way to measure accuracy that isn't strictly proper, the argument fails. The accuracy-firster's job is to convince you that any improper rule is fundamentally broken as a measure of *epistemic* value.

  Does that help untangle the knot?
