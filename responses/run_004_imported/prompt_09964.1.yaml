  hey, random question from my formal epistemology seminar. we're going through the accuracy-first arguments for probabilism (Joyce, then Pettigrew's version) and I keep getting stuck on the 'immodesty' move. I get that with a strictly proper scoring rule, every probabilistic credence function ends up uniquely expecting itself to be the most accurate option, so non-probabilistic credences always come out 'modest' by comparison, and thats suppose to be what makes them irrational. what I don't get is why modesty is actually irrational rather than just a name for the result, and why strict propriety is doing real philosophical work there instead of just being a technical assumption that bakes in the conclusion from the start. can you walk me through the actual logic that gets you from propriety, to immodesty, to irrationality, more intuitively than my readings are managing?
