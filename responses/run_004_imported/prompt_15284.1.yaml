answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct honor of being the friend who has to explain why [Bride] and [Groom] fell in love over… well, over homework.

  Specifically, they met in a reading group working through MIRI's material on Embedded Agency. Now, I see half the room nodding knowingly, and the other half politely wondering if this is the part where I ask for donations.

  For the family: The basic idea is pretty simple. In most decision theory, an agent is like a god standing outside the world. It has a perfect map, it calculates the best move, and it acts. But in the real world—and definitely in a marriage—you aren't outside the world. You're *in* it. You are embedded. You can't hold a map of the territory in your head, because the map would have to be bigger than the territory itself. You can't fully model your own relationship, because you're too small to stand outside of it and look in.

  [Bride] and [Groom] turned this into a running joke early on. They'd look at each other and say, "We are attempting to coordinate two embedded agents with incomplete self-models and high logical uncertainty."

  Which is a very nerdy way of saying: "We have no idea what we're doing, but we're doing it together."

  And honestly, I think that's why they work so well.

  Most wedding advice treats marriage like a Cartesian problem. It says, "Here is the optimal policy. If you follow these five steps, you will guarantee a happy outcome." It assumes you can stand outside the relationship, predict the future, and verify that your trust is warranted before you commit.

  But [Bride] and [Groom] know better. They know that because they are embedded *inside* this marriage, they cannot simulate the next fifty years from the outside. They cannot prove, mathematically or otherwise, that everything will go according to plan. There is no complete self-model that tells you who you will be in ten years, or who your partner will become.

  In their field, when you can't verify the output in advance, you have to rely on something else. You have to rely on the integrity of the process. You have to trust your future self, and you have to trust your partner's future self, without any way to check the code first.

  That sounds scary to a decision theorist. But to a romantic? That is the definition of faith.

  They know they will encounter bugs. They know there will be edge cases they didn't account for in the training data. But because they accept that they are embedded—that they are in this mess together, without a god's-eye view—they don't waste energy trying to control the uncontrollable. Instead, they focus on the only variable they can actually influence: their commitment to each other in the present moment.

  They aren't betting on a guaranteed outcome. They are betting on each other's ability to handle whatever comes next.

  So, if I could ask everyone to raise a glass.

  To [Bride] and [Groom]. May you never try to draw a map that's bigger than the territory. May you accept the logical uncertainty of the future. And may you always find that the best way to model a happy life is not to predict it from the outside, but to build it from the inside, together.

  To the couple!
