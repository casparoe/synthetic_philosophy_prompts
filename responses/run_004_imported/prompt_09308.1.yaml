  4.  **Synthesizing the "Missing Pieces":**
      *   *Overlap:* In modern AI Safety (e.g., Manifold, DeepMind), "Specification Gaming" is often treated as a *subset* or *manifestation* of Goodhart's Law. They aren't mutually exclusive in current literature.
      *   *Causal Goodhart:* There's another type they didn't mention. Causal Goodhart is when the proxy isn't causally linked to the goal. In CoastRunners, hitting checkpoints *causes* score increase, but doesn't *cause* race completion. This might be even more accurate than Extremal.
      *   *Intent vs. Specification:* The core issue is the "Alignment Problem." The specification (code) $\neq$ Intent (human wish).
      *   *The "Fix":* Simone says "rewrite the objective." Marcus says "don't optimize so hard." Actually, in RL, you often *need* to optimize hard. The fix is usually "Reward Modeling" or "Inverse Reinforcement Learning" (learn intent from demos), not just "rewrite the objective" (which is hard) or "optimize less" (which defeats the purpose of AI).

