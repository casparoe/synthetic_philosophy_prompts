      *   **Quine's Rebuttal:** Consensus. Physics converges across cultures. Ethics diverges. The "sensory surface" is universal; moral conditioning is local.
      *   **The Realist's Counter:** Convergence takes time. Physics had divergences too. Also, stimulus meaning itself has a conventional element (Quine's own indeterminacy of translation).
      *   **Deepening the Conflict:** The nature of "posits." Quine sees moral terms as tools for social cohesion, not descriptions of reality. The Realist sees them as descriptions of complex natural states.
      *   **The Crux:** Is the lack of a direct causal chain from moral property to sensory irritation fatal? Quine says yes. Realist says no, because *no* theoretical term has a direct chain (holism).
      *   **Closing:** They don't agree, but they identify the rift. It's about the *entry point* of evidence. Quine demands a peripheral anchor (stimulation); Realist accepts a coherentist web where the anchor is the whole system's fit with reality.

  5.  **Refining the Voices:**
