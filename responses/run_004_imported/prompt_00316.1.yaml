      *   **Core Implication 1: Shift from Outcomes to Processes (Rule Consequentialism).** Focus on engineering best practices as ethical heuristics.
      *   **Core Implication 2: Robustness and Reversibility.** Design for uncertainty. "Undo" buttons are ethical tools.
      *   **Core Implication 3: Proximity and Tractability.** Focus on what you *can* see (near-term user impact) rather than the infinite horizon.
      *   **Core Implication 4: Epistemic Humility & Collective Intelligence.** You can't know alone. Use code reviews, diverse teams, and red-teaming.
      *   **Core Implication 5: Monitoring and Feedback Loops.** Ethics isn't a one-time decision; it's ongoing observability.
