      *(Self-Correction during drafting)*: I need to make sure I don't just give generic "write good code" advice. I need to tie it back to *ethics*. For example, writing tests isn't just about bugs; it's about ensuring the system behaves as intended, which is an ethical obligation when harm is possible. Reversibility isn't just convenience; it's a moral safety net.

      *(Refining the "Cluelessness" aspect)*: Make sure to emphasize that cluelessness doesn't mean *ignorance*. It means *inherent unpredictability*. The response should address how to act *under* that condition.

  6.  **Final Polish:**
