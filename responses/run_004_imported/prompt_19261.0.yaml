answer: |-
  This is a precise and significant gap in the literature. The conflation of Evidential Cooperation in Large Worlds (ECL) with Functional Decision Theory (FDT) or Updateless Decision Theory (UDT) is common, but as you have identified, the justificatory machinery differs in ways that matter for formal modeling and philosophical robustness.

  Here is a breakdown of the distinctions, the role of updatelessness, and a concrete scenario constructed to force a divergence between the three frameworks.

  ### 1. Conceptual Anatomy: ECL vs. Subjunctive Dependence

  You are correct to suspect that ECL is not merely a special case of subjunctive dependence. They rely on fundamentally different metaphysical and probabilistic relations.

  **ECL (The Evidential Story)**
  *   **Decision Theory:** Evidential Decision Theory (EDT).
  *   **Mechanism:** Bayesian Conditionalization.
  *   **The Link:** Statistical Correlation.
  *   **The Argument:** In a large world, there exist agents $A_1, ..., A_n$ who are *similar* to me. Let $C$ be the event "I cooperate." Let $O$ be the event "Others cooperate." ECL argues that $P(O | C) \gg P(O | \neg C)$ because we share a common reference class (e.g., human psychology, similar training data, similar values).
  *   **Vulnerability:** This is susceptible to the *Newcomb/Smoking Lesion* objection. If the correlation is due to a common cause (e.g., evolutionary history) that determines both my disposition and theirs, but my specific act does not *influence* theirs (even acausally), EDT may cooperate where it is irrational to do so. ECL leans heavily on the *base rate* of similar agents in the multiverse.

  **Subjunctive Dependence (The FDT Story)**
  *   **Decision Theory:** Functional Decision Theory (FDT) / Timeless Decision Theory (TDT).
  *   **Mechanism:** Logical Counterfactuals.
  *   **The Link:** Logical Identity / Algorithmic Isomorphism.
  *   **The Argument:** Agents $A$ and $B$ are running the same decision algorithm $F$. The output $F(input)$ is a logical fact. If I determine that $F(input) = \text{Cooperate}$, then it is a logical truth that any other instantiation of $F(input)$ outputs $\text{Cooperate}$.
  *   **Vulnerability:** This requires a robust theory of logical counterfactuals (which is still under development). It is stricter than ECL; it requires *algorithmic* similarity, not just statistical correlation.

  **The Distinction:**
  ECL works if agents are **statistically correlated** (even if the mechanism is opaque). FDT works only if agents are **logically dependent** (the output of one is a logical function of the other).
  *   *ECL:* "I cooperate, which is evidence that they cooperate."
  *   *FDT:* "I compute 'Cooperate', which logically entails they compute 'Cooperate'."

  ### 2. The Updatelessness Question

  Your intuition here is sharp: **An Updateless agent does not need the ECL *argument*, because it internalizes the *conclusion* by construction.**

  ECL is often pitched as a patch for EDT agents to get them to cooperate acausally. It tells an EDT agent: "Condition on your action, realize the correlation is high, and cooperate."

  A UDT agent, however, does not update on its action or its existence in the Bayesian sense. It selects a **policy** $\pi$ ex-ante (before knowing which specific instantiation it is) to maximize expected utility across all possible instantiations weighted by the prior.
  *   **UDT Reasoning:** "Which policy $\pi$, if implemented by all agents running my source code (or relevantly similar code), yields the highest utility?"
  *   **Result:** If the world is large and contains many copies, the policy "Cooperate" naturally dominates "Defect" in the ex-ante calculation because the utility is summed across all copies.

  **Does UDT need ECL?**
  No. UDT does not rely on the *evidential* link ($P(O|C)$). It relies on the *subjunctive* link encoded in the policy evaluation. However, UDT agents still need to estimate the *degree* of logical dependence (how many agents are running similar enough code). In practice, UDT agents might use ECL-style empirical estimates to determine the *scope* of their subjunctive dependence (i.e., "How many agents are similar enough to count as running my algorithm?"). But the *normative force* comes from updatelessness, not evidential conditioning.

  ### 3. The Divergence Scenario: "The Evolutionary Echo"

  To see where the philosophical work is happening, we need a case where **Statistical Correlation** (ECL/EDT) and **Logical Dependence** (FDT/UDT) come apart.

  **The Setup:**
  Imagine a multiverse containing $1,000,000$ isolated planets. On each planet, an agent faces a one-shot Prisoner's Dilemma against a distant alien on another planet (paired randomly).
  *   **Payoffs:** Standard PD (Temptation > Reward > Punishment > Sucker).
  *   **Causal Structure:** No causal communication is possible between pairs.
  *   **Agent Types:**
      *   **You:** You are an agent deciding now.
      *   **The Opponent:** An alien agent.

  **The Critical Variable: The Source of Correlation**
  There are two versions of this scenario.

  #### Version A: The Logical Twin (Standard Superrationality)
  The opponent is running the **exact same source code** as you.
  *   **EDT (ECL):** Cooperates. ($P(\text{Opponent C} | \text{I C}) \approx 1$).
  *   **FDT/UDT:** Cooperates. (Logical identity ensures outputs match).
  *   *Result:* Convergence. No divergence here.

  #### Version B: The Common Cause Black Box (The Divergence Case)
  The opponent is **not** running your code. Their code is a "Black Box" to you. However, you know the following cosmological fact:
  *   Both you and the opponent were created by a **Common Cosmic Cause** (e.g., a specific physical constant in this region of the multiverse that predisposes life-forms to be "Cooperative Types").
  *   Empirical data shows that in this region, 99% of agents cooperate.
  *   However, the opponent's decision is **not** a logical function of your decision. If you were to magically force your output to Defect, the opponent would still run their own independent code (which is likely to Cooperate due to the common cause, but not *because* of your choice).
  *   Crucially: There is **no logical dependence**, only **statistical correlation** via common cause.

  **The Recommendations:**

  1.  **EDT (ECL Proponent):**
      *   **Calculation:** $EU(\text{Cooperate}) = P(\text{Opp C} | \text{I C}) \cdot R + P(\text{Opp D} | \text{I C}) \cdot S$.
      *   **Input:** Since we share a common cause, $P(\text{Opp C} | \text{I C}) \approx 0.99$.
      *   **Decision:** **Cooperate.** The evidence of my cooperation strongly implies their cooperation, raising the expected value.
      *   **Rationale:** ECL relies on the *fact* of correlation, regardless of the mechanism.

  2.  **FDT (Subjunctive Dependence):**
      *   **Calculation:** Evaluates logical counterfactuals. "If my algorithm outputs C, what does the opponent's algorithm output?"
      *   **Input:** The opponent's algorithm is *not* a function of mine. There is no logical link. The correlation is purely historical/causal (the common cause), not logical.
      *   **Decision:** **Defect.** FDT treats the common cause as "screened off." My decision cannot logically influence theirs. Defecting yields the Temptation payoff against a likely Cooperator.
      *   **Rationale:** FDT refuses to cooperate on mere statistical correlation if logical control is absent (avoiding the "Smoking Lesion" problem).

  3.  **UDT (Updateless):**
      *   **Calculation:** Selects a policy ex-ante. "What policy should I have committed to before knowing I was in this specific region with this specific Common Cause?"
      *   **Input:** UDT agents generally align with FDT on logical dependence. However, UDT adds a layer regarding **indexical uncertainty**.
      *   **Decision:** **Defect** (aligning with FDT).
      *   **Nuance:** If the UDT agent considers the "Common Cause" as part of the logical structure of the universe (i.e., "All agents in this causal patch are logically constrained by physics to be similar"), it *might* cooperate. But standard FDT/UDT distinguishes between *logical* necessity and *physical* necessity. If the opponent's code is physically distinct, UDT typically defects.
      *   **Why?** Because a policy of "Cooperate with statistical correlates" makes the agent vulnerable to exploitation by agents who are correlated but not logically linked (e.g., a predictor who simulates you but defects).

  ### 4. Where the Philosophical Work Is

  This scenario reveals three distinct fault lines in your dissertation chapter:

  **1. The Nature of the Link (Evidence vs. Logic)**
  *   **ECL** argues that *statistical correlation is sufficient* for acausal cooperation in a large world. This is a bold claim that risks the Newcomb/Smoking Lesion objections. It implies we should cooperate with anyone sufficiently similar, even if we don't share decision algorithms.
  *   **FDT/UDT** argues that *logical dependence is necessary*. This is safer against exploitation but restricts the scope of cooperation. It implies we should *not* cooperate with the "Evolutionary Echo" agents in Version B.
  *   **Dissertation Implication:** If you defend ECL, you must defend EDT against the Smoking Lesion objection in a cosmological context. If you defend FDT, you must argue why logical dependence is the only morally/rationally relevant link.

  **2. The Role of Updatelessness**
  *   In the ECL (EDT) framework, the agent **updates** on their existence and their disposition. "I am a cooperator, so likely others are."
  *   In the UDT framework, the agent **does not update**. It asks, "Which policy is optimal given the prior distribution of agents?"
  *   **Divergence Point:** Consider a scenario where your existence is *evidence* of a crowded world (SIA - Self-Indication Assumption).
      *   **EDT/ECL:** "I exist. This makes a large world more likely. Therefore, there are more copies. Therefore, ECL cooperation is *more* valuable." (Existence amplifies the incentive).
      *   **UDT:** "I select a policy before knowing if I exist. The fact that I exist is just indexical information. It doesn't change the optimal policy ex-ante."
      *   **Work:** Does the *fact of your existence* change the normative pressure to cooperate? ECL says yes (via Bayesian updating on world size). UDT says no (policy is fixed ex-ante).

  **3. The "Similarity" Threshold**
  *   **ECL:** Similarity is a continuous variable (probability of correlation). As similarity drops, expected value drops smoothly.
  *   **FDT:** Similarity is often treated as binary (same algorithm vs. different), though logical uncertainty allows for grading.
  *   **Work:** How do we model "partial" logical dependence? ECL handles this easily with probabilities. FDT requires a theory of "logical uncertainty" (e.g., logical inductors) to handle agents that are *almost* identical.

  ### Summary for Your Chapter

  1.  **ECL is not a subset of FDT.** It is EDT applied to cosmology. It relies on statistical correlation, whereas FDT relies on logical counterfactuals.
  2.  **UDT subsumes the goal of ECL but changes the mechanism.** UDT agents cooperate acausally not because their action is *evidence*, but because their *policy* determines the output of all logical instantiations. They do not need the ECL "evidential" argument, though they may use ECL-style empirical data to estimate the extent of logical dependence.
  3.  **The Divergence:** In cases of **Common Cause Correlation without Logical Identity** (The Evolutionary Echo), ECL (EDT) recommends Cooperation, while FDT/UDT recommends Defection. This is the critical test case for your dissertation.

  If your goal is to argue for robust cooperation in large worlds, you must decide whether to bite the EDT bullet (cooperate on statistical correlation) or refine the FDT account (argue that physical common causes *do* establish a form of logical dependence, perhaps via the laws of physics). The latter is the more standard route in contemporary decision theory (e.g., arguments that physics is computational), but it requires more metaphysical heavy-lifting than the ECL evidential argument.
