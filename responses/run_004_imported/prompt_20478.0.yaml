prompt: |-
  Ok, this is a bit of a rabbit hole, but I've lurked on LW-sphere blogs for like a decade and never actually stopped to think about why the site is literally called "Less Wrong" until recently. The whole vibe is that you'll never reach certainty, but you can keep updating toward beliefs that are closer to the truth then your old ones — which is basically Popper's old idea of "verisimilitude" (truthlikeness). Except it turns out Popper's actual formal definition of verisimilitude got wrecked pretty fast, by Miller and Tichy in the mid-70s if I remember right — his definition implies one false theory can never be closer to the truth than another false theory, which seems to gut the whole concept since literally every scientific theory we've ever had is technically false. So what are the most important implications of that failure for whether "getting less wrong over time" is even a coherent thing to aim for? And does the Bayesian, credence-based version of this that rationalists actually use dodge the problem, or does it just inherit the same mess in a different form?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**
      *   **Context:** The user is a long-time lurker of the "Less Wrong" (LW) sphere (rationalist community).
      *   **Core Insight:** They've realized the site name "Less Wrong" implies a progression toward truth without reaching certainty. They link this to Karl Popper's concept of *verisimilitude* (truthlikeness).
      *   **The Problem:** They recall that Popper's formal definition of verisimilitude was refuted by Miller and Tichý (1974). The refutation suggests that under Popper's definition, one false theory cannot be "closer to the truth" than another false theory. Since all scientific theories are technically false (approximations), this seems to undermine the goal of "getting less wrong."
      *   **The Questions:**
          1.  What are the implications of Popper's verisimilitude failure for the coherence of "getting less wrong"?
          2.  Does the Bayesian/credence-based approach (used by LW rationalists) dodge this problem, or does it inherit similar issues?

  2.  **Analyze the Philosophical/Historical Claims:**
      *   *Popper's Verisimilitude:* Yes, Popper introduced this in *Conjectures and Refutations* (1963) to explain scientific progress without induction.
      *   *The Refutation:* David Miller and Pavel Tichý independently showed in 1974 that Popper's quantitative definition was flawed. Specifically, if Theory A and Theory B are both false, you can't compare their truth content vs. falsity content in a way that preserves ordering under logical consequence.
      *   *The "All Theories Are False" Premise:* This is a standard pessimistic meta-induction or instrumentalist view. Realists argue some theories are *approximately* true.
      *   *Less Wrong's Philosophy:* The community is heavily Bayesian. They focus on *probabilistic beliefs* (credences) and *calibration*, not necessarily binary true/false theory acceptance.

  3.  **Address Question 1: Implications of Popper's Failure for "Getting Less Wrong":**
      *   *Does it kill the concept?* No. It kills *Popper's specific formalization*, not the intuition.
      *   *Alternative Formalizations:* Philosophers of science didn't just give up. Niiniluoto, Oddie, and others developed new accounts of truthlikeness (similarity approaches, consequence approaches).
      *   *Practical vs. Logical:* In practice, Newtonian physics is "less wrong" than Aristotelian physics regarding planetary motion, even if both are strictly false compared to GR. The Miller-Tichý result is a logical technicality about content classes, not necessarily a death knell for scientific realism or progress.
      *   *Implication:* It means we need a more nuanced metric than simple content inclusion. We need a notion of "distance" in state-space, not just logical entailment.

  4.  **Address Question 2: Does the Bayesian Approach Dodge It?**
      *   *Bayesianism vs. Falsificationism:* LW is primarily Bayesian, not Popperian. Popper was anti-probability (regarding theories). Bayesians assign probabilities to hypotheses.
      *   *The Bayesian Goal:* Minimize *scoring rules* (e.g., log loss, Brier score). This measures *accuracy of probability assignments*, not necessarily "truthlikeness" of the underlying ontology.
      *   *Does it inherit the mess?*
          *   *Pros:* Bayesians don't need to say a theory is "true." They say "Model A predicts data better than Model B." They can update credences. If Model A is Newton and Model B is Einstein, and Einstein predicts better, the Bayesian shifts credence. This captures "progress" without needing a formal definition of verisimilitude.
          *   *Cons:* The "Problem of Old Evidence," "Zero Priors for Continuous Hypotheses," and the fact that the *true* hypothesis might not be in the hypothesis space (the "M-open" or "M-free" setting). If the truth isn't in your set, are you getting "less wrong"? You're minimizing KL-divergence from the truth, which is a form of verisimilitude.
      *   *Calibration:* LW emphasizes calibration. You can be perfectly calibrated but useless (always predict 50%). So they also emphasize resolution/discrimination.
      *   *Conclusion:* Bayesianism shifts the goalpost from "Truthlikeness of Propositions" to "Accuracy of Predictive Distributions." This largely sidesteps the Miller-Tichý objection because it doesn't rely on logical content inclusion of false theories. However, it faces its own issues (e.g., if the true model is outside your support).

  5.  **Synthesize and Structure the Argument:**
      *   **Acknowledge and Validate:** Great catch. It is a deep rabbit hole. Confirm the Miller-Tichý result.
      *   **Part 1: The Popperian Crash:** Explain *why* it failed (logical content comparison). Explain that it didn't kill scientific realism, just that specific definition. Mention subsequent work (Niiniluoto) that fixed it using "distance" metrics rather than content.
      *   **Part 2: Less Wrong's Actual Epistemology:** Clarify that LW is Bayesian, not Popperian. Popper hated subjective probability; LW loves it.
      *   **Part 3: The Bayesian Dodge:**
          *   Focus on *Scoring Rules* (Log Loss/Brier).
          *   Focus on *KL Divergence* (minimizing distance from true distribution).
          *   This operationalizes "less wrong" as "better calibrated predictions" rather than "ontological truthlikeness."
      *   **Part 4: Where Bayesianism Still Bleeds:**
          *   Model Misspecification (Truth not in the set).
          *   The "Map is not the Territory" issue.
          *   Convergence theorems (Do we actually converge to truth? Only if truth is in the hypothesis space).
      *   **Part 5: Verdict:** "Less Wrong" is coherent as a pragmatic heuristic (minimizing prediction error) even if "Verisimilitude" is philosophically thorny as an ontological claim.

  6.  **Refine Tone:**
      *   Keep it intellectual but accessible (matching the LW style).
      *   Avoid overly dense jargon where possible, but use correct terms (KL divergence, scoring rules, M-open).
      *   Acknowledge the irony: LW uses Popperian rhetoric ("falsification") but Bayesian math.

  7.  **Self-Correction/Nuance Check:**
      *   *Did Popper actually define verisimilitude formally?* He tried, but it was qualitative/semi-formal. Miller/Tichý formalized it to break it.
      *   *Is LW strictly Bayesian?* Mostly, but there's a strong Popperian cultural influence (Yudkowsky often cites Popper on falsification). Need to distinguish the *culture* from the *math*.
      *   *Is "Less Wrong" about truth or utility?* Yudkowsky often ties truth to winning (instrumentalism). This is a key point. If "less wrong" means "winning more," the truthlikeness problem matters less.

  8.  **Final Polish:** Ensure the distinction between *ontological truthlikeness* (Popper) and *epistemic accuracy* (Bayes) is clear. (Drafting the response with these points in mind.)

  *(Self-Correction during drafting)*: I should make sure to mention that the Miller-Tichý result applies to *logical content*. Bayesianism works with *probability distributions*. This is the key disanalogy. Also, mention that "Less Wrong" is arguably more about *instrumental rationality* (winning) than *epistemic rationality* (truth) in the final analysis, which sidesteps the metaphysical worry.

