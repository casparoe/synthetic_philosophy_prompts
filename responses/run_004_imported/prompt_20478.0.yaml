answer: |-
  This is an excellent catch. You have identified a genuine tension between the *branding* of the rationalist community (which leans heavily on Popperian rhetoric about falsification and error-correction) and the *formal epistemology* they actually advocate (which is overwhelmingly Bayesian).

  You are correct about the history: Karl Popper introduced *verisimilitude* (truthlikeness) to explain how science progresses even if we never verify theories as strictly "true." He wanted to say Newton is "closer to the truth" than Aristotle, even if Newton is ultimately false. In 1974, David Miller and Pavel Tichý independently proved that Popper's specific definition was incoherent. Under Popper's logic, if Theory A and Theory B are both false, you cannot compare their truth-content versus falsity-content in a way that allows one to be strictly "closer" to the truth than the other.

  Here is the breakdown of what that failure implies for the "Less Wrong" project, and whether Bayesianism saves it.

  ### 1. The Implications of the Miller-Tichý Result
  The immediate implication is not that "getting less wrong" is impossible, but that **logical content inclusion is the wrong metric for measuring it.**

  Popper's definition relied on set theory and logical entailment (comparing the class of true consequences vs. false consequences). The Miller-Tichý proof showed that logical operations are too coarse-grained to measure "distance" to truth.

  **Does this gut scientific realism?**
  Not necessarily. Philosophers of science (like Ilkka Niiniluoto and Graham Oddie) spent the next 40 years rebuilding verisimilitude using **similarity metrics** rather than content inclusion. Instead of asking "How many true sentences does this theory entail?", they ask "How similar is the state of affairs described by this theory to the actual state of affairs?"

  *   **Example:** If the true number of planets is 8, a theory claiming 7 is "closer" to the truth than a theory claiming 7,000, even though both are strictly false.
  *   **Implication for "Less Wrong":** The slogan remains coherent *if* you interpret "wrongness" as **distance in state-space** rather than **logical falsity.** If you view theories as maps, a map with a 1% scale error is "less wrong" than a map with a 50% scale error, even if neither map is the territory.

  ### 2. Does Bayesianism Dodge the Bullet?
  The Less Wrong community is culturally Popperian (talk of falsification, bias-as-error) but mathematically Bayesian. This is crucial. **Bayesianism does not inherit the Miller-Tichý problem because it changes the object of evaluation.**

  Popper was evaluating **propositions** (True/False). Bayesians evaluate **probability distributions** (Credences).

  #### How Bayesians Operationalize "Less Wrong"
  In the Bayesian framework, you don't aim for "Truth" (probability = 1); you aim to minimize **expected loss** according to a proper scoring rule (like Log Loss or the Brier Score).

  1.  **Calibration and Resolution:** "Less wrong" translates to better calibration (when you say 70%, it happens 70% of the time) and better resolution (distinguishing between 70% and 80%).
  2.  **KL Divergence:** Mathematically, Bayesian updating can be viewed as minimizing the Kullback-Leibler (KL) divergence between your subjective belief distribution and the true data-generating distribution.
      *   KL Divergence is a "distance" metric.
      *   Unlike Popper's logical content, KL Divergence *can* distinguish between two false models. Model A can have a lower KL divergence from reality than Model B.
      *   **Verdict:** In this specific technical sense, Bayesianism **does dodge** the Miller-Tichý objection. It provides a coherent mathematical definition of "closer to the truth" (lower cross-entropy) that works even if no model in your set is perfectly true.

  #### Where Bayesianism Inherits the Mess
  However, Bayesianism isn't a magic get-out-of-jail-free card. It inherits a different version of the problem, often called the **Problem of Model Misspecification** (or the "M-open" setting).

  Standard Bayesian convergence theorems (like Doob's Consistency Theorem) generally guarantee that your posterior will converge to the truth **only if the true hypothesis is in your initial hypothesis space.**

  *   **The Trap:** If the truth is not in your set of considered hypotheses (which is almost certainly the case for complex reality), Bayesian updating will simply converge on the "least wrong" model *within your set*.
  *   **The "Less Wrong" Dilemma:** If your hypothesis space is bounded by your current conceptual vocabulary, you can become perfectly confident in a model that is still fundamentally wrong. You are "less wrong" than you were, but you might be stuck in a local minimum of wrongness.
  *   **Example:** A Bayesian in 1890 could be perfectly calibrated about planetary motion using Newtonian mechanics + epicycles. They are minimizing prediction error. But they are ontologically "wrong" about gravity. No amount of Bayesian updating *within* that framework gets them to General Relativity; they need a **paradigm shift** (expanding the hypothesis space), which standard Bayes doesn't account for.

  ### 3. The Instrumentalist Escape Hatch
  There is a third layer here, which is how Eliezer Yudkowsky and the core LW thinkers actually resolve this in practice. They often pivot from *Epistemic Rationality* (believing true things) to *Instrumental Rationality* (winning).

  If "Less Wrong" is interpreted as **"Systematically reducing prediction error to maximize utility,"** the metaphysical status of verisimilitude matters less.

  *   **Popper's Failure:** Matters if you care about the ontological status of theories.
  *   **Bayesian Success:** Matters if you care about predictive accuracy.
  *   **Instrumental Success:** Matters if you care about outcomes.

  The LW maxim "The map is not the territory, but if you follow the map you can navigate the territory" sidesteps the Miller-Tichý result. It doesn't matter if the map is "true" or even "truth-like" in a philosophical sense; it matters if the map leads to fewer navigation errors than the previous map.

  ### Summary
  1.  **Popper's Formalism is Dead:** You are right. You cannot define "truthlikeness" using logical content inclusion.
  2.  **"Less Wrong" is Still Coherent:** But only if you define "wrongness" as **predictive error** or **distance in state-space**, not logical falsity.
  3.  **Bayesianism Dodges the Specific Bullet:** By using scoring rules and KL divergence, Bayesians have a working metric for "closer to truth" that applies to false models.
  4.  **But New Bullets Exist:** Bayesianism assumes the truth is within your hypothesis space. If you lack the vocabulary to conceive of the truth, you can converge confidently on a falsehood.

  **The Verdict:** The name "Less Wrong" is philosophically robust *if* treated as a pragmatic commitment to reducing prediction error (Bayesian/Instrumental), but it is philosophically shaky *if* treated as a claim about ontological progress toward absolute truth (Popperian/Realist). The community mostly operates on the former while using the rhetoric of the latter.

  So, you haven't found a contradiction that destroys the project, but you have found the precise point where the community's **rhetoric** (Popperian falsificationism) diverges from its **math** (Bayesian inference). Recognizing that distinction is itself a very "Less Wrong" thing to do.
