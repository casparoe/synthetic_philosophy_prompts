answer: |-
  **Setting:** *A quiet corner of the school library. Two Ethics Bowl teammates, ELENA and MARCUS, are surrounded by stacks of notes. A half-empty whiteboard behind them reads: "THE FIRST PROMISE."*

  **ELENA:** Okay, let's test the "First Promise" scenario again. I need to see if your view holds water without the social scaffolding. Imagine two people, Adam and Eve, but not the biblical ones—just two strangers meeting in a state of nature. No language, no customs, no institution of promising. Adam says to Eve, "I will bring you firewood tonight." Eve relies on him. He doesn't show up. Is he morally blameworthy for breaking a *promise*?

  **MARCUS:** Yes. Absolutely.

  **ELENA:** But *why*? If there's no convention, the sentence "I will bring you firewood" is just a prediction. It's like saying, "It will rain tonight." If it doesn't rain, the sky isn't immoral. Without a pre-existing social practice that imbues those specific words with the force of an obligation, Adam has just stated his intention. He might be unreliable, but he hasn't broken a promise. The concept doesn't exist yet.

  **MARCUS:** You're treating "promise" like a magic spell. You think the obligation comes from saying the right incantation within a recognized system. But the obligation comes from the interpersonal dynamic. When Adam tells Eve he will bring the wood, and he sees her relying on that information to plan her night, he has invited her trust.

  **ELENA:** But how does he know she's relying on it as a *binding commitment* rather than just a hopeful prediction? That distinction *is* the convention. In our society, we have a practice that marks the difference between "I'll try" and "I promise." In your state of nature, that marker doesn't exist. So Eve's reliance is arguably irrational. She's assuming a rule exists that doesn't.

  **MARCUS:** She's not assuming a rule; she's assuming basic moral decency. Look, think about T.M. Scanlon's principle. If I lead you to expect that I will do something, and I know you want that assurance, and I act to get you to rely on me... I owe it to you to do it. That's not a social rule; that's about not manipulating someone. If Adam wants Eve to count on the wood so he can secure her cooperation on something else, and then he flakes, he's used her. That wrong exists before the first "promise" is ever codified.

  **ELENA:** I see the appeal. It feels intuitive. But here's the trap: If you ground it purely in "inviting reliance," you lose the specificity of promising. If I tell you, "I'm going to the store," and you rely on me to bring back milk, have I promised? On your view, if I know you're relying on me, I'm bound. But that makes *every* statement of intent a potential promise. The Practice View explains why promising is special. It's a specific tool we built *to* create obligations where they wouldn't otherwise exist. It creates a bright line.

  **MARCUS:** A bright line that's entirely arbitrary. You're saying that before the convention existed, Adam could say, "I definitely will bring the wood, I swear on my life, please count on this," and yet, because the "Practice of Promising" wasn't ratified by a committee, he's free to walk away? That implies the moral weight comes from the *institution*, not the *harm* done to Eve.

  **ELENA:** Not the harm, the *expectation*. Look, think of it like chess. If we're sitting in a park and I move a pawn backwards, I haven't done anything wrong unless we've agreed to play chess. The rules create the possibility of the move being illegal. Promising is the same. The practice creates the possibility of being *bound* rather than just *disappointing*. Without the practice, Adam is just disappointing Eve. With the practice, he violates a right she has.

  **MARCUS:** But chess is a game. Morality isn't. If I push you over, I don't need a "Practice of Non-Shoving" for it to be wrong. It's wrong because I hurt you. Similarly, if I assure you I'll act, and you plan your life around it, and I bail, I've hurt you. The "First Promise" works because the moral machinery of trust and reliance is already there. We don't need to invent the institution of promising to have a duty not to betray someone who is relying on our word.

  **ELENA:** Okay, but answer this: How does Adam communicate that he is undertaking an *obligation* rather than just expressing *confidence*? In the real world, we use the word "promise" to signal, "I know the social stakes here." In your First Promise scenario, Eve has no way to know if Adam thinks he's bound. Maybe Adam thinks he's just saying what he *hopes* to do. If the obligation is inherent in the assurance, doesn't that require a shared understanding of what assurance *means*? And isn't *that* a convention?

  **MARCUS:** It requires shared language, sure. But not a convention of *obligation*. It just requires understanding that human beings have desires and plans. If Adam says, "I will do X," and he knows Eve needs X to avoid harm, he has a duty not to mislead her. The "First Promise" isn't the first time the words were said; it's the first time someone realized that their word could be a bridge for another person's action. The obligation is in the bridge, not the toll booth.

  **ELENA:** That's poetic, but risky. If the obligation is just in the "bridge," then we can never know when we've crossed it. The Practice View protects *promisers* too. It tells me, "You are only bound if you use the specific formula that triggers the obligation." Your view leaves me vulnerable. I might accidentally bind myself just by being too confident. The social practice is a protective shield. It says, "Unless I invoke this specific convention, I am not undertaking this specific heavy duty."

  **MARCUS:** But that leads to the opposite problem. It lets people off the hook too easily. If I say, "I give you my solemn word, I will be there," but I avoid the specific word "promise," your view suggests I might not be bound. It turns morality into a legalistic loophole hunt. The First Promise case shows us that the *feeling* of betrayal exists before the *label* exists. If Eve waits all night for Adam and freezes, she feels wronged. Not because a rule was broken, but because a person was abandoned.

  **ELENA:** She feels wronged, yes. But is it the *specific* wrong of promise-breaking? Or is it the wrong of negligence? Or the wrong of misleading? I'm arguing that "promise-breaking" is a specific category of wrong that *requires* the institution. You're conflating all failures of reliance into "breaking a promise." If we do that, we lose the ability to distinguish between a casual letdown and a formal violation. The First Promise might create a duty of reliance, but it doesn't create the *practice* of promising.

  **MARCUS:** So you're saying the moral force is secondary to the categorization?

  **ELENA:** I'm saying the moral force is *derived* from the categorization. We agree that relying on others is good. To make that safe, we invented a device—the promise—that amplifies the duty. Without the device, the duty is weaker. It's like currency. A gold nugget has value, but a dollar bill only has value because we agree on the system. Adam and Eve are using gold nuggets (natural reliance). We are using dollar bills (promises). You're claiming the first dollar bill ever printed had value even before the bank existed.

  **MARCUS:** No, I'm claiming the first dollar bill had value because it represented labor and trust, which existed before the bank. The bank just standardized it. If Adam says, "Count on me," he is issuing moral currency. The fact that there's no central bank doesn't mean the debt isn't real. If you insist the bank must exist first, you're saying morality is bureaucratic.

  **ELENA:** And if you insist the debt is real without the bank, you're saying morality is telepathic. How do we know the exchange happened?

  **MARCUS:** Because we can look at the consequences. Eve froze. Adam knew she would. He spoke anyway.

  **ELENA:** And if we had a practice, Adam could have said, "I intend to, but no promise," and Eve would know not to freeze. The practice allows for *coordination*. The First Promise is a coordination failure waiting to happen.

  **MARCUS:** Or it's the moment morality began.

  **ELENA:** *(Sighs, capping her pen)* We're not going to solve the state of nature today.

  **MARCUS:** *(Smiling)* No. But I think Eve is still waiting for that firewood.

  **ELENA:** And I think she should have brought a backup plan. Relying on a convention that doesn't exist is her risk, not his.

  **MARCUS:** See? That's why you'd make a terrible friend.

  **ELENA:** And that's why you'd make a terrible lawyer.

  *(They both laugh and turn back to their notes, the whiteboard still unresolved.)*
