  8.  *(Self-Correction during drafting)*: I need to be careful not to say Lewis's theory is "wrong." It's influential. But the specific objection regarding the similarity metric is well-known (Elga, etc.). I should mention that Lewis's later work admitted difficulties.
      *   Also, clarify that Woodward embraces SEMs (Structural Equation Models). His interventionism is basically the philosophical justification for SEMs.
      *   Make sure to highlight that for a statistician, Woodward is "useful" while Lewis is "metaphysical."

  9.  **Final Output Structure:**
