answer: |-
  **MEMORANDUM**

  **TO:** Committee on Investor Responsibility
  **FROM:** [Your Name], Department of Philosophy
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Holdings in [Name of Lender]

  ### I. Recommendation

  The undersigned recommends that the Committee on Investor Responsibility adopt the third option available under our charter: **a formal engagement process with named conditions and a deadline for revisiting the question.**

  Specifically, I propose we notify [Name of Lender] that the University will divest its position unless the company commits to capping effective annual percentage rates (APR) at 36% and adhering to strict ability-to-repay underwriting standards within twelve months. This approach resolves the ethical tension raised by the holding without conflating predatory lending with legitimate fixed-income investment.

  ### II. Context and Ethical Analysis

  At the September meeting, the Committee discussed a proposal to divest from [Name of Lender], a consumer finance company specializing in short-term loans with effective APRs often exceeding 300%. The ethical objection rests on the observation that the company's primary revenue source is the financially precarious population our University financial-aid office is mandated to support.

  During that discussion, a philosophical objection was raised based on Aristotle's *Politics* (Book I, Chapter 10). Aristotle distinguishes between *oikonomia* (household management, or the acquisition of goods to meet human need) and *chrematistike* (the unlimited pursuit of wealth). He identifies lending at interest (*tokos*) as the most unnatural form of *chrematistike* because it treats money as a breeding organism rather than a measure of exchange.

  A colleague from the Business School correctly noted that if Aristotle's argument condemns *tokos* categorically, it condemns the University's entire bond and mortgage portfolio. If money breeding money is inherently unnatural, our endowment cannot function. Furthermore, the Scholastic tradition, which inherited Aristotle's prohibition, eventually conceded that interest is permissible when it compensates for genuine risk (*damnum emergens*) or opportunity cost (*lucrum cessans*).

  **The Resolution:**
  The colleague's objection holds only if we interpret Aristotle's concern as a blanket prohibition on *interest*. However, a more defensible descendant of the argument focuses on the *telos* (purpose) of the transaction and the *proportionality* of the return.

  1.  **Productive vs. Extractive Capital:** A standard university bond or mortgage facilitates the creation of real value (housing, infrastructure, enterprise). The interest paid is a share of that value creation or a premium for liquidity and risk. This aligns with the "natural use" of money as a measure of need and facilitator of exchange.
  2.  **The Unnatural Limit:** The lending in question here operates differently. Triple-digit interest rates on small-dollar loans cannot be explained by risk mitigation alone; actuarial data suggests that even high-risk consumer loans do not require 300% APRs to remain solvent. When the cost of capital exceeds the borrower's capacity to generate surplus value, the loan ceases to be facilitative and becomes extractive. The "breeding" of money here is not symbiotic (funding growth) but parasitic (feeding on financial distress).
  3.  **Distinguishing the Holding:** Therefore, Aristotle's argument survives the colleague's objection not as a ban on finance, but as a limit on *exploitation*. The objection distinguishes this lender from our ordinary bond holdings because ordinary bonds do not rely on the borrower's inability to repay as a profit center. This lender's business model relies on "rollovers"—instances where the borrower cannot pay the principal and must take a new loan to cover the old. This is *chrematistike* in the precise Aristotelian sense: wealth accumulation detached from human flourishing.

  ### III. Fiduciary Considerations

  The position in question represents a modest fraction of the fixed-income portfolio. While the yield is attractive, the reputational risk to the University—profiting from the precarity of the very demographic we serve—poses a long-term liability that outweighs the marginal financial gain. Furthermore, engagement offers a pathway to align the investment with our fiduciary duty without immediate realization of losses, provided the company can demonstrate a viable pivot to sustainable lending practices.

  ### IV. Engagement Plan and Timeline

  To operationalize this distinction, I propose the following engagement conditions. These conditions are designed to test whether the company can transition from *extractive* to *productive* lending.

  **Named Conditions:**
  1.  **Rate Cap:** The company must cap the effective APR on all consumer loans at 36%, consistent with the Military Lending Act and standard responsible lending benchmarks.
  2.  **Underwriting Standards:** The company must adopt and publish "ability-to-repay" underwriting standards verified by a third party, ensuring borrowers are not issued loans they cannot service without reborrowing within 90 days.

  **Timeline:**
  *   **Notification:** Committee Chair to notify company management of these conditions by **November 15, 2023**.
  *   **Interim Review:** Company management to provide a written plan of compliance by **February 15, 2024**.
  *   **Final Deadline:** Company must demonstrate full implementation of conditions by **October 1, 2024**.
  *   **Revisit:** If conditions are not met by the deadline, the Committee will automatically recommend **Full Divestment** at the **November 2024** meeting.

  ### V. Conclusion

  This recommendation acknowledges the Business School colleague's valid point: interest itself is not the sin. The sin is the detachment of financial return from real human value. By setting conditions that force the lender to align its returns with the borrower's capacity to flourish, we apply the Aristotelian distinction practically. If the company cannot lend profitably at 36%, it confirms that their current profits depend on the unnatural extraction we seek to avoid. If they can, the University retains a holding that is ethically consistent with its mission.

  I move that the Committee adopt the Formal Engagement Process as outlined above.
