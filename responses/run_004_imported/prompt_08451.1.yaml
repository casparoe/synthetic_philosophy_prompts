answer: |-
  You are not overthinking this, and your intuition is pointing toward a distinction that has puzzled philosophers, economists, and ethicists for decades. You aren't just feeling "off" about your brother's argument; you are identifying a fundamental conflict between two different definitions of fairness.

  Your brother is arguing for **Equality of Welfare** (everyone should end up equally happy).
  Your sister's situation (and your intuition) aligns with **Equality of Opportunity/Capability** (everyone should have the resources to function and live with dignity).

  Here is the breakdown of why your brother's argument, while logically consistent on the surface, fails under ethical scrutiny, and how you can articulate this without attacking his character.

  ### 1. Brute Luck vs. Expensive Tastes
  The most famous counter-argument to your brother's position comes from the legal philosopher Ronald Dworkin. He distinguished between "brute luck" and "option luck" (or personal preference).

  *   **Your Sister (Brute Luck):** Her disability was not chosen. It is an external circumstance that imposed a cost on her life that she did not ask for. Compensating her is about restoring her to a baseline of functioning that she would have had if the accident hadn't happened. It is restorative justice.
  *   **Your Brother (Expensive Tastes):** His requirement for luxury is internal. While he isn't "faking" his discomfort, his preferences are part of his personality or conditioning. In ethical theory, society (or a family) is generally not obligated to subsidize expensive tastes because doing so punishes those who are content with less.

  If you accept your brother's logic, you create a "perversity incentive." You are essentially telling the family: *"If you cultivate difficult-to-please tastes, you will be rewarded with more resources."* Meanwhile, the sibling who learns to find joy in simple things is penalized with a smaller share. Most people intuitively feel that frugality or contentment shouldn't be financially punished.

  ### 2. Capability vs. Happiness
  Your brother is equating "need" with "happiness." But in the context of inheritance and family support, "need" usually refers to **capabilities**.

  *   **The Sister:** Without the money, she literally cannot access certain spaces, maintain her health, or live independently. The money buys *freedom* and *function*.
  *   **The Brother:** Without the extra money, he can still travel, eat, and relax. He just experiences it as *less pleasurable*.

  There is a moral hierarchy here. Alleviating a barrier to functioning (sister) takes precedence over optimizing a barrier to pleasure (brother). If the pot of money is limited, it must go to the person who needs it to *be* first, before it goes to the person who needs it to *enjoy*.

  ### 3. The "Expensive Tastes" Objection
  There is a specific concept in political philosophy called the **"Expensive Tastes Objection."** It argues that individuals are responsible for their own preferences.

  If your brother trained himself to require business class to feel safe or relaxed, that is a psychological burden he carries, but it is not a debt the family owes. If the family pays for his business class tickets, they are effectively saying, *"Your psychological calibration is our financial responsibility."*

  With your sister, the family acknowledges that the *world* is not built for her, so they use the money to bridge that gap. With your brother, the world *is* built for him (economy flights work fine for 99% of people), but he has opted out of the standard experience. Subsidizing that opt-out is a gift, not an obligation of fairness.

  ### 4. How to Explain This Without Sounding Judgmental
  The reason you struggle to explain this is that you keep trying to argue about the *validity of his feelings*. You can't win that, because his feelings are real to him. Instead, you need to shift the argument to the *purpose of the money*.

  Here is a script you might adapt:

  > "I've been thinking about what you said, that you need more money to be as happy as the rest of us. I believe that you genuinely feel that way, and I'm not saying your unhappiness isn't real.
  >
  > But I think the reason we're giving [Sister] more isn't to make her 'happier' than us. It's to remove barriers that the rest of us don't have. The extra money for her buys mobility, health, and independence. It buys the ability to function.
  >
  > If we split the money based on who needs it to be 'happy,' we end up punishing the people who are easy to please and rewarding the people who are hard to please. Fairness shouldn't mean we all end up with the same level of enjoyment; it means we all end up with the same level of security and opportunity. You have the same opportunities as me; you just prefer to spend them differently. She has to spend hers just to stay in the same place."

  ### 5. The Verdict
  **You are right.**

  Your brother is making a category error. He is treating a **preference** (even a deeply felt, psychological one) as if it were a **constraint**.

  *   **Your Sister:** Constrained by physics and biology.
  *   **Your Brother:** Constrained by preference.

  Inheritance is typically intended to provide security and a foundation for the next generation. Providing for a disability secures a foundation. Providing for luxury travel enhances a lifestyle.

  **A Compromise to Suggest:**
  If the family wants to avoid conflict, they could structure the inheritance as:
  1.  **A "Care Fund":** A specific portion set aside strictly for your sister's medical and accessibility needs (this removes it from the "split" entirely).
  2.  **An Equal Split:** The remainder is divided equally among the three siblings.

  This acknowledges that your sister has objective costs the others don't, without validating the idea that your brother's happiness is more expensive and therefore deserves a subsidy.

  ### Summary
  Your partner says you're overthinking it, but this is actually a profound question about what we owe each other. We owe each other support when misfortune strikes (your sister). We do not owe each other subsidies for our personal definitions of the good life (your brother).

  You don't need to call your brother shallow. You just need to hold the line that **fairness is about leveling the playing field, not equalizing the score.**
