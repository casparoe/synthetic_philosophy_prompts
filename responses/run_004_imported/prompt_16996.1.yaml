answer: |-
  The smoke from his pipe hung in the cold air of the Manchester office, a grey suspension above the stacks of typescript. Alan Turing rubbed his eyes. The Mark I computer hummed in the building next door, a massive, clicking heart beating out calculations in binary, but here, on the desk, the work was analog. It was ink and paper and the heavy burden of definition.

  He was stuck on Section 6. The objections.

  He had dismantled the theological argument with a few sharp lines about God's power not being limited to souls. He had parried the mathematical objection regarding Gödel's theorem. But here, near the end, the text resisted him. The objection was labeled simply: *The Argument from Extrasensory Perception.*

  Alan dipped his pen. The statistics from S. G. Soal's card-guessing experiments lay on the blotter beside him. The numbers were irritating. They were persistent. In a rational universe, chance should flatten out over thousands of trials. It should behave like a machine. But the data curved. It suggested a leak.

  *Overwhelming evidence,* he wrote. The ink dried dark and final.

  He paused. To admit this was to invite chaos into his clean architecture. The Imitation Game relied on a closed system. An interrogator, a teletype, two hidden agents. If the human contestant could read the interrogator's mind, the test measured nothing but psychic leakage. If the machine could be influenced by telepathy, then behavior was not the sole province of computation.

  He needed to exclude it. He had to build a wall around the experiment.

  *Telepathy-proof room,* he typed.

  The phrase looked absurd on the page. Lead-lined walls? White noise? It sounded like science fiction, not the foundation of computer science. But he could not dismiss the data. To dismiss data because it was uncomfortable was a sin against the very ethic he was trying to codify. Notice your confusion. Take the evidence seriously, even when it points toward ghosts.

  Especially when it points toward ghosts.

  He leaned back, the wood of the chair creaking. The hum of the computer seemed to fade, replaced by the silence of a boarding school dormitory in 1930. Christopher.

  Christopher Morcom had been eighteen when he died. Tuberculosis, swift and brutal. They had planned to go to Cambridge together. They had planned to quantify the universe between them. When Christopher stopped breathing, Alan had been left with a surplus of affection and nowhere to put it.

  He remembered the letter he had written to Christopher's mother, Mrs. Morcom, two years later. He had tried to comfort her with physics. *Nature of Spirit.* He had argued that energy cannot be created or destroyed, so why should the energy of a mind vanish? It was a desperate syllogism, dressed in the language of conservation laws. He had wanted it to be true then. He needed it to be true now.

  If the statistics were right, if the cards were guessed too often, then the barrier between minds was porous. If the barrier was porous, then death might not be a wall, but a membrane.

  Alan looked at the typescript. If he published this, he was legitimizing psychical research. He was telling the world that Alan Turing, the man who broke the Enigma, the man who was building a mechanical brain, believed in ghosts. It was professionally dangerous. It was intellectually messy.

  But it was honest.

  He thought about the machine next door. It could calculate trajectories, check numbers, mimic logic. But could it grieve? Grief was not a calculation. It was a state of being that persisted without input. It was a signal continuing after the transmitter was destroyed.

  If telepathy existed, the Turing Test was flawed. A machine might fail not because it couldn't think, but because it couldn't reach out. A human might pass not because of intelligence, but because of connection. The test measured output, but what if the essence was in the invisible channel between the output and the receiver?

  He picked up the pen again. He had to qualify the statement. He couldn't just leave it as an admission of belief. He had to contain it.

  *Once one has accepted the evidence... it is not a very big step to believe in ghosts.*

  He wrote it plainly. No irony. The sentence sat there, stark and vulnerable. It was a crack in the armor of the rationalist. He imagined his colleagues reading it. Some would sneer. Some would worry. But he couldn't help it. The rigor demanded that he follow the data wherever it led, even if it led back to Christopher.

  The tragedy, of course, was that he would never know if the data was true. He did not know that Soal's records would one day be scrutinized, that the target sequences would be found doctored, that the overwhelming evidence would dissolve into fraud. He did not know that the leak was man-made, not supernatural.

  He only knew that the hope was real.

  Alan blew on the ink to dry it. The office was cold. He pulled his sweater tighter. He thought about the telepathy-proof room again. It was a safeguard for the machine, designed to ensure that the computer was judged on its own merits. But in building it, he was acknowledging that the human mind might operate on frequencies the machine could not touch.

  He was building a test to prove machines could think, while secretly hoping that humans were something more than thinking machines.

  He stacked the pages. The weight of them was negligible, but the implication was heavy. He was sending this to *Mind*, the philosophical journal. It would be read, debated, cited. The telepathy-proof room would become a footnote, a quaint eccentricity of a great man. The grief behind it would remain invisible, encrypted in the methodology.

  He walked to the window. Manchester was grey, the industrial smog blending with the clouds. Somewhere beneath this city, in the quiet dark, was the past. Somewhere ahead was the machine. And somewhere in between, in the statistical noise of card guesses, was the wish that the silence wasn't total.

  He placed the manuscript in his envelope. He sealed it.

  He did not know if the room could ever be truly proof. He did not know if the mind survived the body. He did not know if the machine would ever wake up. He only knew that he had to write the numbers as they appeared. He had to leave the door open, just a crack, just enough for a ghost to pass through if it wanted to, even if he had to pretend he was trying to keep it out.

  Alan Turing picked up his coat. The paper was ready. The question remained. He turned off the light and left the room, leaving the typescript on the desk, waiting for the morning post, waiting for a future that would judge the science but never see the ache.
