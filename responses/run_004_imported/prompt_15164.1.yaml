  Let's write it.

  *Key Lewis Point:* Lewis argues penal substitution is intelligible and sometimes permissible, but we reject it when it defeats the purpose of the punishment (e.g., rehabilitation or incapacitation). If the purpose is to stop *her* from researching while untrustworthy, *him* sitting out doesn't help.
