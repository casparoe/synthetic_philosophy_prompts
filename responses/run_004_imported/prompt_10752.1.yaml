prompt: |-
  Ok this is gonna sound like a weird lead-in but bear with me. At my company we have a design-review process for big changes where three senior engineers each vote independently on an RFC, and the rule is "approved only if the design is technically sound AND the rollout plan is safe" — two separate yes/no calls that are supposed to feed into one final approve/reject. On a doc last month, reviewer A said sound=yes, safe=no (so their vote was reject), reviewer B said sound=no, safe=yes (also reject), and reviewer C said sound=yes, safe=yes (approve). Tally the final votes and it's 1-2, rejected. But someone in the Slack thread pointed out that if you instead tally each sub-question seperately, "sound" gets 2 yes's (A and C) and "safe" also gets 2 yes's (B and C) — so by the letter of the rule it actually should've passed. We argued about this for an embarrassingly long time and never fully resolved it. Eventually a friend who minored in philosophy told me this is an honest-to-god known problem, something like the "discursive dilemma" (or "doctrinal paradox" for the original legal version — I think that one's from Kornhauser and Sager, about appeals judges), and that List and Pettit (not 100% sure I've got the names right) later turned it into a whole formal "judgment aggregation" theory, with an impossibility result that's apparently a bit like Arrow's theorem but for judgments instead of preferences.

  I went down the wiki-hole on this for a couple of nights, and my honest takeaway is that nobody actually commits to an answer — every source just lays out both options and shrugs. That's not good enough for me. What I want is an actual verdict: please make the strongest case you can that whenever a group has to reach one binary decision that logically depends on several separately-contestable sub-judgments (my RFC case, or the classic multi-issue court case), the group should default to voting on each sub-judgment separately and deriving the final call from those votes (the "premise-based" procedure), rather than voting on the bottom-line outcome directly (the "conclusion-based" procedure). And don't just say "it respects the majority on every issue" and call it a day — actually grapple with the real objections, like the fact that whoever decides which sub-questions get put on the agenda in the first place can steer the outcome, and the fact that (from what I understood of my reading) issue-by-issue majority voting isn't even guaranteed to stay logically consistent once you've got more going on than my simple two-condition example.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user works at a company with a design-review process (RFCs) requiring two conditions for approval: "Technically Sound" AND "Rollout Safe."
      *   **The Scenario:** 3 Reviewers.
          *   A: Sound (Y), Safe (N) $\rightarrow$ Reject
          *   B: Sound (N), Safe (Y) $\rightarrow$ Reject
          *   C: Sound (Y), Safe (Y) $\rightarrow$ Approve
          *   *Outcome-based vote:* 1 Approve, 2 Reject $\rightarrow$ **Rejected.**
          *   *Premise-based vote:* Sound (2Y, 1N), Safe (2Y, 1N) $\rightarrow$ **Approved.**
      *   **Theoretical Background:** The user knows this is the "Discursive Dilemma" / "Doctrinal Paradox" (Kornhauser & Sager) and connects it to List & Pettit's "Judgment Aggregation" and Arrow's Impossibility Theorem.
      *   **The Problem:** The user feels existing literature "shrugs" and offers no definitive verdict.
      *   **The Task:** Make the *strongest possible case* for the **Premise-Based Procedure** (voting on sub-judgments separately) over the Conclusion-Based Procedure (voting on the final outcome directly).
      *   **Constraints:** Do not just say "it respects the majority." Grapple with real objections (agenda setting power, logical inconsistency in more complex cases). Provide an actual verdict.

  2.  **Deconstruct the Theoretical Landscape:**
      *   *The Paradox:* Majority voting on premises can yield a different result than majority voting on the conclusion when the conclusion is a logical function of the premises (specifically a conjunction).
      *   *List & Pettit (2002, 2004):* They formalized this. They showed that no aggregation function satisfies Universal Domain, Anonymity, Systematicity, and Completeness/Consistency simultaneously for certain agenda structures.
      *   *The Two Procedures:*
          *   *Conclusion-Based (CBP):* Vote on the outcome. Ignores reasons.
          *   *Premise-Based (PBP):* Vote on reasons, derive outcome. Enforces integrity of reasoning.
      *   *The User's Demand:* Argue *for* PBP despite the known impossibility results and agenda-setting risks.

  3.  **Formulate the Argument for Premise-Based Procedure (PBP):**
      *   *Core Thesis:* PBP is superior because it prioritizes *collective rationality* and *accountability* over mere *decisional efficiency*. In engineering and law (the user's contexts), the *reasons* matter as much as the result.
      *   *Key Point 1: Integrity of the Decision Rule.* The rule is "Sound AND Safe." If we vote on the conclusion, we allow a coalition where *no one* believes both conditions are met to block approval, OR (conversely) a coalition where *no one* believes both are met to approve (depending on the configuration). Actually, in the specific paradox case (the conjunction paradox), PBP ensures the collective stance matches the logical requirements of the rule. CBP allows the group to accept a conclusion that the majority rejects *on the merits of the specific criteria*. Wait, let's refine that.
      *   *Refinement:* In the user's example, 2/3 think it's Sound. 2/3 think it's Safe. But only 1/3 think it should pass. CBP says "Reject." PBP says "Approve." Why is PBP better? Because the *rule* is about Soundness and Safety. If the majority affirms Soundness and the Majority affirms Safety, the logical consequence of the group's judgment *is* Approval. CBP treats the rule as a black box. PBP treats the rule as a constraint on reasoning.
      *   *Key Point 2: Accountability and Precedent.* In engineering (RFCs) and Law, *why* we decided matters for future decisions. CBP creates "opaque" precedents. PBP creates a public record of collective belief.
      *   *Key Point 3: Epistemic Quality.* PBP forces engagement with the specific claims. CBP allows "logrolling" or voting based on gut feeling about the outcome without justifying the premises.

  4.  **Address the Objections (Crucial Step):**
      *   *Objection 1: Agenda Setting Power.* (Who picks the premises?)
          *   *Counter:* This is a feature, not a bug, *if* managed. It forces the group to explicitly define the criteria *before* voting. In the user's case, the criteria ("Sound" and "Safe") are already codified. The risk is adding irrelevant premises to dilute votes. Mitigation: Fixed agenda for RFCs.
      *   *Objection 2: Logical Inconsistency (The Impossibility Result).* (With >2 premises, PBP can lead to contradictions).
          *   *Counter:* True, but CBP leads to *unreasoned* decisions. Inconsistency in PBP can be detected and resolved (e.g., via priority ordering). CBP inconsistency is hidden. Also, for the specific "AND" structure of the RFC, PBP is consistent. The impossibility theorem applies to *general* agendas, not specifically to conjunctive agendas like the user's.
      *   *Objection 3: Minority Tyranny.* (In the user's example, 2 people voted Reject, but PBP overruled them).
          *   *Counter:* It's not tyranny; it's fidelity to the agreed-upon rule. The rule wasn't "2/3 must want to ship." The rule was "Ship IF Sound AND Safe." The majority affirmed the antecedents. Denying the consequent violates the group's own logical commitment.

  5.  **Drafting the Response - Section by Section:**
      *   **Introduction:** Acknowledge the depth of the user's research. Validate the "Discursive Dilemma." State the verdict clearly upfront: **Adopt the Premise-Based Procedure.**
      *   **Argument 1: Fidelity to the Rule (The "Contract" Argument).** The RFC process isn't a democracy on the *outcome*; it's a check on *criteria*. If the criteria are met by majority judgment, the outcome is determined. CBP turns the criteria into suggestions.
      *   **Argument 2: Collective Rationality vs. Collective Preference.** Distinguish between "what we want" (preference) and "what is true/safe" (judgment). Engineering is about truth/safety, not preference aggregation. PBP respects the cognitive division of labor. (Reviewer A is the safety expert, B is the architecture expert).
      *   **Argument 3: Precedent and Accountability.** RFCs build institutional knowledge. CBP creates "black box" decisions. PBP creates a map of collective belief.
      *   **Grappling with Objections:**
          *   *Agenda Power:* Acknowledge it. Argue that in RFCs, the agenda is fixed by the policy (Sound + Safe), not ad-hoc.
          *   *Inconsistency/Impossibility:* Acknowledge List & Pettit. Argue that for *conjunctive* tasks (A & B), PBP is robust. Inconsistency arises with complex logical interconnections (e.g., A, B, C, and (A&B)->C). Mitigate via "Sequential Priority" if needed.
      *   **The "Verdict":** Reiterate the recommendation. PBP is the only way to maintain the integrity of a rule-based system. CBP is for politics; PBP is for engineering/law.

  6.  **Refining the Tone:**
      *   Needs to be authoritative but humble (acknowledging the theoretical difficulty).
      *   Needs to be specific to the user's engineering context (RFCs).
      *   Avoid academic jargon where possible, but use it correctly (since the user knows it).
      *   *Self-Correction on the "Minority Tyranny" point:* In the user's example, 2 people voted "Reject." PBP overrides them. Is that bad? No, because their "Reject" was based on different reasons. A thinks it's unsafe. B thinks it's unsound. Neither thinks it's *both*. If the group believes it is Sound (overruling B) and Safe (overruling A), then the "Reject" votes are logically invalidated by the premise votes. The "Reject" voters are effectively outvoted on the *facts* that informed their vote. This is a strong point to emphasize.

  7.  **Final Polish:** Check against the prompt requirements.
      *   Strongest case for PBP? Yes.
      *   Grapple with agenda setting? Yes.
      *   Grapple with inconsistency/impossibility? Yes.
      *   Actual verdict? Yes.

  8.  *(Self-Correction during drafting)*: Make sure to distinguish between *Preference Aggregation* (Arrow) and *Judgment Aggregation* (List/Pettit). The user knows this, but reinforcing it strengthens the argument. Engineering RFCs are judgments of fact/quality, not preferences of taste.

  9.  *(Final check on the "Verdict")*: The user wants me to *take a side*. I will argue decisively for PBP.

  **(End of Thought Process)**
answer: |-
  Here is the verdict: **You should adopt the Premise-Based Procedure (PBP).**

  In the context of engineering design reviews (and legal adjudication), voting on the conclusion directly (Conclusion-Based Procedure, or CBP) is structurally inferior because it treats the decision rule as a preference aggregation rather than a truth-tracking constraint. While the literature often hedges because "context matters," in a context governed by explicit technical criteria (like your "Sound AND Safe" rule), PBP is the only method that preserves the integrity of the rule itself.

  Here is the strongest case for PBP, grappling directly with the objections you raised.

  ### 1. The Argument from Fidelity to the Rule
  Your RFC process is not a democracy; it is a **rule-based system**. The rule is not "Approve if 2/3 reviewers want to." The rule is "Approve IF (Sound AND Safe)."

  When you use CBP (voting on the outcome), you are effectively allowing the reviewers to vote on whether they *like* the outcome, potentially ignoring the criteria they were tasked to evaluate. In your specific example:
  *   Reviewer A believes: Safe = False.
  *   Reviewer B believes: Sound = False.
  *   Reviewer C believes: Sound = True, Safe = True.

  Under CBP, the result is **Reject**. But notice what that implies about the collective will: The collective rejects the proposal, yet the collective majority believes it is Sound (A & C) and the collective majority believes it is Safe (B & C).
  If the group affirms the premises but rejects the conclusion, the group is **logically incoherent**. It is asserting $P$, asserting $Q$, asserting $P \land Q \rightarrow R$, but concluding $\neg R$.

  By choosing PBP, you enforce the contract the reviewers signed up for. They were asked to evaluate Soundness and Safety, not to act as a veto-wielding council. If the majority finds the criteria met, the rule dictates approval. To do otherwise is to allow individual reviewers to smuggle in hidden veto criteria (e.g., "I think it's safe and sound, but I don't like the API style, so I vote Reject"). PBP forces the hidden criteria onto the agenda as premises or discards them.

  ### 2. The Epistemic Argument: Division of Cognitive Labor
  This is the strongest practical argument for engineering teams. Reviewers are rarely generalists; they are specialists.
  *   Reviewer A might be the Security Expert (weighted heavily on "Safe").
  *   Reviewer B might be the Staff Architect (weighted heavily on "Sound").
  *   Reviewer C might be the Domain Owner.

  In your scenario, Reviewer B (the Architect) voted "Sound = No." But Reviewers A and C voted "Sound = Yes." Under CBP, B's single vote on the outcome kills the project, even though the majority of the team (including the Security Expert) thinks the architecture is fine.

  PBP respects the **division of cognitive labor**. It allows the group to outvote a specialist on their specific domain if the rest of the group disagrees, rather than allowing that specialist to bundle their domain concern into a global "Reject" that cannot be disaggregated. CBP allows a reviewer to say "No" for *any* reason without justification. PBP forces the objection to be categorized. If the objection doesn't fit "Sound" or "Safe," it shouldn't block the RFC. This reduces "gut feeling" rejections and increases accountability.

  ### 3. Grappling with Objection 1: Agenda Setting Power
  You correctly identified the risk: **Who decides the premises?** If I control the premises, I control the outcome. If I split "Safe" into "Safe-Database" and "Safe-Frontend," I can dilute the vote. This is the "manipulability" critique of PBP.

  **The Counter:** In your RFC context, the agenda is **fixed by policy**, not by the voters.
  The impossibility results and agenda-manipulation risks are highest when the agenda is endogenous (chosen by the voters during the meeting). But your company has already codified the agenda: "Sound" and "Safe."
  *   **Mitigation:** To prevent agenda manipulation, the definitions of "Sound" and "Safe" must be stable. If reviewers feel a premise is missing (e.g., "Maintainable"), the fix is not to switch to CBP; the fix is to amend the RFC policy to add "Maintainable" as a third premise.
  *   **Why PBP still wins:** Even with agenda risks, CBP is worse. CBP hides the agenda. In CBP, a reviewer can reject based on "Maintainability" without ever declaring it. In PBP, they are forced to argue that "Maintainability" is a subset of "Soundness" or petition to change the rules. PBP makes the agenda visible; CBP makes it opaque. Visibility is the prerequisite for fixing agenda bias.

  ### 4. Grappling with Objection 2: Logical Inconsistency (The Impossibility Result)
  You read List and Pettit correctly: with complex agendas (e.g., $A, B, C, A \land B \land C \rightarrow D$), PBP can lead to inconsistencies where the majority accepts the premises but the logical derivation contradicts other accepted premises. This is the "doctrinal paradox" on steroids.

  **The Counter:** This risk is manageable via **Sequential Priority**, and it is still preferable to CBP's *unreasoned* consistency.
  *   **The Risk:** If you have 5 premises, majority voting might accept all 5, but the logical conclusion of those 5 contradicts a 6th policy constraint.
  *   **The Fix:** You do not need to vote on all premises simultaneously. You can order them. If "Security" is a prerequisite for "Rollout," you vote on Security first. If it fails, you stop. This creates a "sequential PBP" which guarantees consistency.
  *   **Why CBP is worse here:** CBP guarantees a consistent *outcome* (Approve or Reject), but it guarantees nothing about the *reasoning*. A team using CBP can approve a design that the majority thinks is Unsafe, simply because they like the feature. That is **institutional gaslighting**. It creates a record that says "Approved" while the collective belief is "Unsafe." Future engineers reading that RFC will assume it was deemed safe. PBP ensures the public record matches the collective judgment. In engineering, **auditability trumps decisiveness.**

  ### 5. The "Minority Tyranny" Rebuttal
  In your example, 2 reviewers voted "Reject" (A and B). PBP overrules them. This feels undemocratic. Why should the "Reject" voters lose?

  Because their "Reject" votes were based on **minority factual claims**.
  *   A claims "Unsafe." The majority (B & C) says "Safe." A is outvoted on the fact.
  *   B claims "Unsound." The majority (A & C) says "Sound." B is outvoted on the fact.

  Once the group establishes the facts (Sound=True, Safe=True) via majority vote, the "Reject" votes lose their logical foundation. A and B are essentially saying, "I vote against the logical consequence of the facts we just established." In a rule-based system, that vote should not count. PBP exposes that A and B are not objecting to the criteria, but to the *logic* of the process itself. CBP hides this, allowing A and B to appear as if they are upholding the standard, when they are actually overruling the majority's assessment of the standard.

  ### The Verdict

  **Adopt the Premise-Based Procedure.**

  **Why?**
  1.  **Integrity:** It ensures the outcome is a logical consequence of the group's stated beliefs, not a aggregation of hidden vetoes.
  2.  **Auditability:** It creates a record of *why* a decision was made (e.g., "We shipped this because we collectively believed it was safe"), which is vital for post-mortems. If it breaks later, you know the collective judgment was wrong, not just the vote count.
  3.  **Specialization:** It allows the team to overrule a specialist on their specific domain if the rest of the team disagrees, rather than letting that specialist bundle their concern into a global veto.

  **The Caveat:**
  To make PBP work, you must treat the premises ("Sound", "Safe") as **stable constitutional constraints**, not ad-hoc agenda items. If reviewers constantly argue about what "Safe" means, your problem isn't the voting procedure; it's your definitions. Fix the definitions, then let the premises vote rule the outcome.

  CBP is for legislatures (where preferences matter). PBP is for courts and engineering teams (where truth and safety matter). You are building systems, not passing laws. Vote on the premises.
