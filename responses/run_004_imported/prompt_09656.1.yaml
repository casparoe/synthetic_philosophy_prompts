prompt: |-
  So two of my friends, Jake and Priya, got into this argument at my place a couple weeks ago and it's stuck in my head since. It started because Jake said music has gotta be an evolutionary adaptation -- every human culture has it, babies react to rhythm before they can even talk, and it obviously helps people bond, so natural selection must've built us for it. Priya said that's basically a textbook "just-so story," the kind of thing Gould and Lewontin were making fun of with their whole spandrels argument -- you spot a trait, invent a flattering reason evolution wanted it there, and never actually test it against the alternative that music is just a leftover side-effect of stuff that evolved for other reasons, like language and emotion processing. Jake shot back that "it's just a side effect" is exactly as untested as his story, so why does her explanation get to be the default one instead of his? Priya said the default goes to her because she isn't the one claiming evolution specifically designed the trait for a job, so the burden's on him, not her. Then Jake pointed out that even Gould admitted a spandrel can later get taken over and fine-tuned by selection for a new use (he called it exaptation) -- so if music started as a byproduct and then got shaped up because it helped with bonding, isn't he basically right anyway, just with extra steps? Neither of them could agree on that last one, and honestly i couldn't either.

  Can you go through this move by move and say who actually had the stronger point at each stage? Also curious if there's something more basic about how you'd settle "adaptation vs. spandrel" questions that both of them are kind of skating past.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A debate between two friends (Jake and Priya) about the evolutionary origins of music.
      *   **Jake's Position:** Music is an evolutionary adaptation (universal, early development, social bonding).
      *   **Priya's Position:** Music is a spandrel/byproduct (language/emotion processing), accusing Jake of telling a "just-so story."
      *   **Key Arguments:**
          1.  Jake: Universality/Function $\rightarrow$ Adaptation.
          2.  Priya: Adaptationism = Just-So Story (Gould & Lewontin); Burden of Proof on Adaptationists.
          3.  Jake: "Byproduct" is also untested; why is it the default?
          4.  Jake: Exaptation (Spandrel $\rightarrow$ Adapted) $\rightarrow$ So I'm right anyway?
      *   **Tasks:**
          1.  Evaluate who had the stronger point at each stage of the argument.
          2.  Identify the deeper methodological issue ("something more basic") they are skipping regarding how to settle adaptation vs. spandrel questions.

  2.  **Deconstruct the Debate (Move by Move):**

      *   *Move 1: Jake's Opening (Universality/Function).*
          *   Claim: Music is universal, infants react, aids bonding $\rightarrow$ Adaptation.
          *   Critique: This is classic adaptationist reasoning. It's plausible but correlational. Universality doesn't guarantee adaptation (could be a universal byproduct of a universal cognitive architecture).
          *   Verdict: Plausible hypothesis, but not proof. Priya's skepticism is warranted here.

      *   *Move 2: Priya's Counter (Spandrels/Just-So Stories).*
          *   Claim: Jake is telling a "just-so story" (Gould & Lewontin). Music is a byproduct of language/emotion.
          *   Critique: She correctly identifies the logical fallacy of assuming function implies design. She invokes a strong philosophical framework (SP Gould & RC Lewontin, 1979).
          *   Verdict: Strong methodological point. She shifts the burden of proof correctly.

      *   *Move 3: Jake's Pushback (Symmetry of Ignorance).*
          *   Claim: "It's just a side effect" is also untested. Why is her view the default?
          *   Critique: This is actually a very sharp point. Null hypotheses matter. In biology, the null isn't always "no function," but often "parsimony." However, claiming "we don't know" is scientifically honest. Claiming "it *is* a byproduct" is also a positive claim.
          *   Verdict: Jake has a point about burden of proof symmetry, but Priya is right about the *type* of claim requiring more evidence (adaptation requires more specific evidence than byproduct).

      *   *Move 4: Jake's Exaptation Trap.*
          *   Claim: Gould admitted spandrels can become exaptations. If music started as a byproduct but got refined for bonding, isn't that adaptation?
          *   Critique: This conflates *origin* with *maintenance*. A trait can be a byproduct in origin but an adaptation in current utility. However, calling it an "adaptation" usually implies selection shaped its *origin*. If it was just co-opted, it's an exaptation.
          *   Verdict: Jake is muddying the waters. He's technically right that selection could act on it later, but that doesn't validate his original claim that music *evolved for* bonding initially.

  3.  **Address the "Something More Basic" (Methodological Core):**
      *   What are they missing? They are arguing philosophy of biology, not empirical evidence.
      *   To settle this, you need comparative methods, genetic correlation, cost/benefit analysis, and specific predictions.
      *   *Key Concept:* The "Adaptationist Programme" vs. "Null Hypothesis."
      *   *Key Concept:* Distinguishing *Origin* vs. *Current Function*.
      *   *Key Concept:* Falsifiability. Both stories need to make risky predictions.
      *   *Current Science:* Steven Mithen, Oliver Sacks, Aniruddh Patel. The consensus is mixed (Auditory Cheesecake vs. Social Glue).

  4.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the quality of the debate. It's a classic evolutionary psychology/biology clash.
      *   *Round-by-Round Analysis:*
          *   Round 1 (Jake): Strong intuition, weak evidence. Universality $\neq$ Adaptation.
          *   Round 2 (Priya): Strong methodological critique. Correctly cites Gould/Lewontin. Burden of proof is on the adaptationist.
          *   Round 3 (Jake on Default): Nuanced. Priya is right that adaptation requires *more* proof, but Jake is right that "byproduct" shouldn't be dogmatic.
          *   Round 4 (Exaptation): Jake is conflating terms. Exaptation $\neq$ Adaptation in the strict sense of origin.
      *   *The "More Basic" Issue:*
          *   Need to define the Null Hypothesis properly.
          *   Need specific predictions (Comparative method: Do other animals have it? Costly traits?).
          *   Need to separate Origin vs. Maintenance.
      *   *Conclusion:* Who "won"? Priya won the logic/methodology round. Jake won the "plausibility" round. Science hasn't decided yet.

  5.  **Refining the Tone:**
      *   Keep it neutral but analytical.
      *   Avoid taking sides too hard, but highlight where logical errors occur.
      *   Ensure the distinction between "Adaptation" (selected for origin) and "Exaptation" (co-opted later) is clear, as that was Jake's final confusion point.

  6.  **Self-Correction/Check during drafting:**
