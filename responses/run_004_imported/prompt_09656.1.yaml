      *(Self-Correction on Move 4)*: Jake says "If it got shaped up... isn't he right anyway?" This is the "Adaptation vs. Exaptation" distinction. If selection fine-tuned it, it *became* an adaptation for that function, but not necessarily for its *origin*. I need to be precise here.

