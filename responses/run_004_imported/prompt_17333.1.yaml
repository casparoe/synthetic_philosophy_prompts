answer: |-
  You have hit on one of the most significant and frequently overlooked tensions in modern moral philosophy. Your close reading of the text is correct, and your suspicion is well-founded: **there is a substantial gap between what Aquinas argues in *Summa Theologica* II-II, Q. 64, Art. 7 and how the Doctrine of Double Effect (DDE) is applied to the Trolley Problem.**

  To answer your question directly: **Yes, stretching Aquinas's reasoning from "self-defense against an aggressor" to "sacrificing an innocent bystander" smuggles in extra assumptions that are not in the passage.**

  Here is a breakdown of what Aquinas is actually claiming, followed by an evaluation of how much weight this passage can bear in the context of the Trolley Problem.

  ### 1. What Aquinas is Actually Claiming

  In Question 64, Article 7, Aquinas is addressing a specific legal and moral question: *Is it permissible for a private individual to kill someone in order to save their own life?*

  His "yes" answer rests on three pillars, only one of which is the intention/foresight distinction:

  1.  **The Intention/Foresight Distinction:** As you noted, he argues that the moral species of an act is determined by what is intended. If you intend to save your life, and the death of the attacker is a side effect (*praeter intentionem*), the act is not murder.
  2.  **Proportionality:** The force used must be moderate. You cannot use a cannon to swat a fly; you cannot kill an attacker if a shove would suffice.
  3.  **The Status of the Victim (The Crucial Missing Piece):** Aquinas explicitly frames this as defense against an **unjust aggressor**. He writes, "Nor is it necessary for salvation that a man omit the act of moderate self-defense in order to avoid killing the other man, since one is bound to take more care of one's own life than of another's."

  This final clause is often quoted out of context. When Aquinas says you are bound to take more care of your life "than of another's," he is not making a utilitarian calculation that *any* one life is worth less than *any* other. He is making a claim about **rights and justice in a specific context.**

  For Aquinas, the aggressor, by initiating unjust violence, has temporarily forfeited their right to non-interference. The defender has a right to life that the aggressor is currently violating. Therefore, in this specific collision of rights, the innocent defender's right trumps the unjust aggressor's right. Aquinas is **not** arguing that you can kill an innocent person to save yourself; he is arguing you can kill a *threatening* person to save yourself.

  ### 2. The Gap to the Trolley Problem

  When modern philosophers (starting with Philippa Foot in 1967) invoke the DDE to explain the Trolley Problem, they are applying Aquinas's *structure* of reasoning to a situation Aquinas did not address. Here is where the "smuggling" occurs:

  **A. The Innocence of the Victim**
  *   **Aquinas:** The person who dies is the source of the threat (the aggressor).
  *   **Trolley:** The person who dies is innocent (a bystander on the track or the bridge).
  *   **The Smuggle:** To apply Aquinas here, one must assume that being "in the path of the trolley" is morally equivalent to being an "unjust aggressor." But the bystander has not initiated injustice. They have not forfeited their right to life. Aquinas provides no resources in this text to justify killing an innocent person, even as a side effect, unless that killing is authorized by public authority (like a soldier in a just war or an executioner), which the trolley driver is not.

  **B. Self vs. Others**
  *   **Aquinas:** The act is **self-defense**. "One is bound to take more care of one's own life..."
  *   **Trolley:** The act is **defense of others**. You are saving five strangers.
  *   **The Smuggle:** Aquinas does allow for defense of others in other contexts, but the calculus changes. In self-defense, I have a special obligation to my own preservation. In the trolley case, I am weighing the lives of five strangers against one stranger. Aquinas's text does not grant me the authority to sacrifice one innocent to save five others; in fact, elsewhere in the *Summa*, he is quite strict that one cannot do evil (kill an innocent) so that good may come.

  **C. The Nature of the "Side Effect"**
  *   **Aquinas:** The death is beside the intention.
  *   **Trolley (Switch):** The death is foreseen but arguably not intended (you intend to divert the threat).
  *   **Trolley (Footbridge):** The death is arguably intended as a means (you need the mass to stop the trolley).
  *   **The Smuggle:** Modern DDE theorists use Aquinas to explain why *Switch* is okay but *Footbridge* is not. They argue that in *Footbridge*, the death is a means, not a side effect. While this distinction *is* rooted in Aquinas's view of intention, Aquinas's permission to kill in Q. 64, Art. 7 relies heavily on the **aggressor** condition. Even if the death is a "side effect" in the Switch case, Aquinas might still forbid it if the victim is an innocent bystander, because the justification for the killing (self-defense against injustice) is absent.

  ### 3. How Much Weight Can This Passage Bear?

  If we are being historically and textually rigorous, **this specific passage bears very little weight** in justifying the permissibility of the Switch case.

  It provides the **taxonomy** (the vocabulary of intended vs. foreseen effects), but it does not provide the **licensing** (the moral permission to act).

  *   **What it explains:** It explains why we feel a difference between *intending* death (Footbridge) and *accepting* death as a consequence (Switch). It validates the intuition that intention matters morally.
  *   **What it fails to explain:** It does not explain why it is permissible to kill the one innocent person on the side track in the first place. For Aquinas, killing an innocent person is generally intrinsically evil, regardless of whether it is intended or foreseen, unless done by public authority for the common good.

  **The "Extra Assumption"**
  To get from Aquinas to the Trolley Problem, modern ethicists silently add a utilitarian or quasi-utilitarian premise: *It is permissible to sacrifice one innocent life to save five, provided you do not intend the death.*

  Aquinas does not grant this premise in Q. 64, Art. 7. He grants: *It is permissible to kill an aggressor to save yourself, provided you do not intend the death.*

  ### Conclusion

  Your intuition is correct. The standard explanation that "Aquinas's Doctrine of Double Effect solves the Trolley Problem" is a simplification that glosses over the **status of the victim.**

  By invoking Aquinas to justify the Switch case, philosophers are extracting the *mechanism* of double effect (intention vs. foresight) while discarding the *condition* of double effect as Aquinas understood it in this context (defense against unjust aggression).

  If you were to present the Trolley Problem to Aquinas, relying solely on the logic of Q. 64, Art. 7, he would likely ask: "Does the one person on the track have a right to be there? Are they an aggressor? Do you have public authority to dispose of their life for the common good?" If the answer is "No, they are just an innocent bystander," Aquinas's framework in this specific article does not clearly permit their death, even as a side effect.

  So, while the DDE is indeed the standard tool used to analyze the Trolley Problem, claiming it rests *solely* on this passage of Aquinas is historically inaccurate. It rests on a modern adaptation of Aquinas that generalizes his principles beyond the context of self-defense against an aggressor. You have identified a genuine philosophical discontinuity.
