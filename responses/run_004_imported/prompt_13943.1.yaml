      *   **Critique of Pop-Psych/BehavEcon:** The user finds the "hyperbolic discounting" explanation insufficient because it reduces akrasia to a mere preference reversal, eliminating the normative conflict essential to the classical definition (acting against a judgment you *still hold*).
      *   **Request:** A principled philosophical answer, not just behavioral economics hand-waving.

  2.  **Initial Assessment & Knowledge Retrieval:**
