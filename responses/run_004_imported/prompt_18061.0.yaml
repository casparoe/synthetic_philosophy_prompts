      *   **Specific Focus:** The "Grudge Informer" case (1944 Nazi statute, wife denounces husband, post-war prosecution).
      *   **Characters:** Hart-style Positivist vs. Fuller-style Natural Lawyer.
      *   **Key Requirements:**
