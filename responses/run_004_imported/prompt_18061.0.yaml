      *   **The "Inner Morality" Specifics:** Fuller needs to mention things like secrecy, vagueness, or the undermining of the judicial process. Hart needs to mention the "Rule of Recognition."
      *   **The Conclusion:** Do they disagree on the outcome? Actually, both want her punished. The disagreement is on *how* we describe the legal reality to get there.

