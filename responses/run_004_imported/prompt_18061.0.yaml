      *   **Fuller (Natural Lawyer):** Law has an "inner morality" (generality, publicity, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy, congruence between official action and declared rule). If a regime fails these too egregiously, it's not just bad law, it's *no* law at all. The Nazi statute was secret, vague, or undermined the very purpose of law. Punishing the wife is upholding the continuity of law by rejecting the perversion.

