answer: |-
  Your instinct is correct: your friend's original confidence was reasonable, and the argument she encountered relies on a philosophical sleight of hand that conflates **metaphysical certainty** with **rational justification**.

  The argument presented to her is a radicalized version of **act consequentialism** (specifically utilitarianism) combined with **skepticism about causal knowledge**. It sounds profound, but it collapses under scrutiny for several specific reasons.

  Here is a breakdown of where the argument goes wrong, which you can use to help restore her confidence.

  ### 1. The Confusion of "Actual" vs. "Expected" Value
  The argument assumes that for an action to be "good," it must *actually* produce the best possible long-term outcome. But human beings cannot act on *actual* outcomes because they haven't happened yet. We must act on **expected value**.

  *   **How it works:** If you buy a lottery ticket and win, the *actual* outcome was financially positive. If you buy one and lose, the *actual* outcome was negative. But rational people judge the decision based on the *probability* at the time of purchase. Buying a ticket is generally a bad bet, even if you win.
  *   **Applying to volunteering:** When your friend hands a meal to a hungry person, the **probability** that this reduces suffering is extremely high. The **probability** that it inadvertently causes a catastrophe 50 years from now is vanishingly low and purely speculative.
  *   **The Flaw:** The argument demands she justify her action based on the *actual* infinite future, rather than the *probable* near future. Rationality requires us to maximize expected good, not guarantee actual good. Since the expected value of feeding a hungry person is overwhelmingly positive, the action is rational and good.

  ### 2. Causal Attenuation (The Signal-to-Noise Ratio)
  The argument claims consequences ramify "indefinitely." While technically true in a chaotic system, it ignores **causal attenuation**.

  *   **How it works:** In physics and social science, the influence of a specific cause tends to fade as it moves through time and complexity. The specific impact of your friend's volunteer shift is strong and clear on Tuesday night. By the time that causal chain reaches ten years later, her specific contribution is diluted by millions of other variables (weather, policy changes, other people's actions).
  *   **The Flaw:** The argument treats a speculative, diluted future effect as having equal weight to a concrete, immediate present effect. But the "signal" of her help is strong now; the "noise" of the future is random. To let the random noise of the distant future cancel out the clear signal of the present is bad math.

  ### 3. The Counterfactual Problem (What if she *doesn't* go?)
  The argument implies that because she can't know the future of *volunteering*, she can't know if it's good. But the same uncertainty applies to *not* volunteering.

  *   **The Scenario:** If she stays home, she also sets off a chain of infinite, unknowable consequences. Maybe staying home leads to her tripping over a toy, breaking a leg, and requiring a nurse to stay late, who then misses a bus, etc.
  *   **The Flaw:** The uncertainty is symmetrical. Both action and inaction have unknowable long-term ripples. Therefore, uncertainty cannot be the tie-breaker. We must fall back on what is **knowable**: In the immediate term, volunteering relieves suffering, while staying home does not. If we can't know the distant future, we must optimize for the known present.

  ### 4. "Ought Implies Can"
  This is a classic principle in ethics. It suggests that morality cannot demand the impossible.

  *   **The Flaw:** If the moral worth of an action depends on knowing the infinite future, then **no human action can ever be moral**, because no human has omniscience.
  *   **The Result:** This renders the concept of "good" useless. A moral theory that paralyzes all action is self-defeating. We must define "good" in a way that is accessible to human agents. A "good" action is one taken with reasonable care and reasonable expectation of benefit, not one that guarantees a utopian future.

  ### 5. Ignoring Non-Consequentialist Value
  Finally, the argument assumes that the *only* thing that matters is the downstream consequence. Many ethical frameworks disagree.

  *   **Virtue Ethics:** Volunteering makes your friend a compassionate person. That is good in itself, regardless of the ripple effects.
  *   **Deontology:** She has a duty to help those in need when she can. Fulfilling that duty is good, regardless of the chaotic future.
  *   **The Flaw:** Even if the consequentialist argument held water (which it doesn't, see points 1–4), it ignores that her action has intrinsic moral value based on her intentions and character.

  ### How to Explain This to Her
  You might tell her that the person she spoke to was describing **Moral Skepticism**, not **Moral Truth**.

  The argument proves that we aren't gods, not that we aren't good people. We are allowed to act on **reasonable probability**.

  *   **Analogy:** Imagine a doctor in an emergency room. She gives a patient medicine that saves his life. Ten years later, that patient commits a crime. Was the doctor wrong to save him?
      *   Most people would say **no**. The doctor acted on the immediate probability of saving a life, which is her role. She is not responsible for the infinite, unknowable chain of events that follows.
      *   Your friend is the same. She is addressing immediate suffering. That is a "local maximum" of good. She is not required to solve the universe's long-term trajectory to be justified in helping the person in front of her.

  **Summary:** Her confidence is not undermined. The argument she heard mistakes **uncertainty** for **neutrality**. Just because she can't calculate the infinite sum doesn't mean the numbers she *can* see (a fed person, a sheltered night) don't add up to a positive.
