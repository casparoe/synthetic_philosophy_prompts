answer: |-
  **TO:** City Council
  **FROM:** Charter Review Commission
  **DATE:** October 26, 2023
  **SUBJECT:** Advisory Report on Citizen Petition [2023-04]: Municipal Franchise for Noncitizen Residents

  ### I. Executive Summary

  The Charter Review Commission has completed its evaluation of Citizen Petition [2023-04], which proposes amending the City Charter to permit lawful permanent residents (LPRs) who have resided within the city for at least one year to vote in municipal elections.

  After extensive deliberation, the Commission recommends that the City Council **adopt a modified version of the petition for submission to referendum.** The recommended modification includes a **sunset provision** requiring a mandatory Charter Review of the policy after two full election cycles (four years).

  This recommendation rests on the principle that municipal voting rights should align with subjection to local coercive authority, rather than national civic membership. However, recognizing the gravity of altering the electorate, the Commission concludes that the final decision must rest with the current body politic. The referendum process resolves the procedural circularity of our appointment, and the sunset clause addresses substantive concerns regarding the permanence of this shift in civic membership.

  ### II. Background and Philosophical Framework

  During our deliberations, three distinct philosophical frameworks emerged regarding the franchise. To reach a recommendation, the Commission weighed these views against the specific nature of municipal power.

  **1. The "Affected Interests" View**
  This position argues that anyone whose interests are substantially affected by city decisions deserves a vote. While morally intuitive, the Commission found this standard difficult to bound administratively. As noted in testimony, this logic could extend to absentee landlords, commercial property owners, or daily commuters who utilize city infrastructure but do not reside here. We determined that residence, not economic interest, must remain the primary proxy for stakeholder status to maintain a coherent electoral geography.

  **2. The "Civic Membership" View (Opposing Position)**
  This position holds that the ballot is a privilege of full civic membership, conferred nationally through naturalization. Under this view, the city is a subdivision of the state and nation, lacking the sovereignty to define its own political community separate from the national whole.

  *Engagement with the Strongest Form of this View:*
  We acknowledge this is not merely a procedural objection but a substantive claim about the nature of democracy. The strongest form of this argument posits that a political community requires a shared ethical horizon and a common destiny to function. Voting is not just a mechanism for resource allocation; it is an act of collective self-determination. If the electorate is fragmented between those who owe ultimate allegiance to the nation and those who hold a transnational status, the legitimacy of the mandate may be diluted. Furthermore, decoupling local voting from national citizenship risks creating a "second-tier" franchise, potentially disincentivizing naturalization and creating a permanent class of residents who are subject to the law but distinct from the sovereign people. We take this concern seriously: a polity must know who "We" are before it can decide what "We" want.

  **3. The "Coercive Authority" View (Primary Basis for Recommendation)**
  This position grounds the franchise in whether an individual is subject to the city's coercive authority—policing, zoning, tax enforcement, and compulsory education—as a matter of daily life.

  The Commission finds this view most compatible with the limited, administrative nature of municipal government. Unlike the national government, which controls borders, defense, and sovereignty, the city controls the immediate physical and regulatory environment. A noncitizen resident pays property taxes (directly or via rent), is subject to arrest by local police, must comply with local zoning, and sends children to local schools. They are subject to the "force of law" in the same manner as a citizen. To tax and police a population without granting them a voice in the selection of the taxers and police commanders violates the basic democratic principle of *no taxation without representation*. While national citizenship defines the *sovereign*, local residency defines the *governed*. In the municipal context, the latter is the more relevant criterion for the franchise.

  ### III. Addressing the Circularity Objection

  Legal Counsel raised a meta-legal concern: The Commission was appointed by a Council elected by citizens; therefore, we lack the standing to redefine the citizenry without assuming the answer to who belongs to it.

  This is a valid paradox. If only the current electorate can decide who joins the electorate, noncitizens are permanently locked out unless citizens consent to share power. However, this is not a bug; it is a feature of democratic self-determination. A community must have the agency to define its own boundaries.

  The Commission resolves this circularity not by ignoring it, but by institutionalizing it. We are not unilaterally expanding the electorate. By recommending this measure go to **referendum**, we are returning the question to the very body that authorized us: the current citizen-electorate. The Commission's role is advisory; the voters' role is constitutive. If the current electorate votes to expand the franchise, the circularity is broken by their consent. If they vote against it, the boundary remains. Therefore, the Commission's recommendation to advance the petition does not usurp the people's authority; it facilitates its exercise.

  ### IV. Recommendation and Modifications

  The Commission recommends the City Council **adopt the petition for submission to referendum**, subject to the following modification:

  **The Sunset and Review Clause:**
  The amendment shall take effect immediately upon voter approval but shall expire automatically five years from the date of implementation unless re-authorized by the voters. A Charter Review Commission shall be convened in the fourth year to evaluate the impact of the policy and make a recommendation on re-authorization.

  *Rationale for Modification:*
  This clause directly addresses the "Civic Membership" concern. It treats the expansion of the franchise as a pilot program rather than a permanent redefinition of the polity. It allows the city to test whether noncitizen voting strengthens local democracy or creates the fragmentation feared by opponents. It acknowledges that while the *principle* of coercive authority supports voting rights, the *consequences* for civic cohesion are empirical questions that require data.

  ### V. Implementation Timeline

  Should the Council accept this recommendation, the following timeline is realistic for a city of our size:

  *   **November 15, 2023:** City Council votes on whether to place the modified measure on the ballot.
  *   **December 1, 2023 – January 15, 2024:** City Attorney drafts final ballot language and title.
  *   **January 30, 2024:** Submission to County Elections Office for printing and voter information guide.
  *   **March 2024:** Public education period (neutral materials distributed by City Clerk).
  *   **May 2024:** General Municipal Election (Referendum held).
  *   **June 2024:** Certification of results.
  *   **July 2024:** If passed, City Clerk begins outreach to eligible noncitizen residents for voter registration.
  *   **November 2024:** First election cycle in which modified franchise is active.
  *   **2028:** Mandatory Charter Review convened to evaluate sunset clause.

  ### VI. Conclusion

  The question of who belongs to the political community is the most fundamental question a city can ask. The "Civic Membership" view correctly identifies that a polity requires unity. However, the "Coercive Authority" view correctly identifies that legitimacy requires consent from the governed.

  By recommending this measure go to the voters with a sunset clause, the Commission seeks to honor both truths. We affirm that those subject to the city's laws should have a voice, while acknowledging that the current citizenry holds the key to the door. We leave the final judgment to them.

  **Respectfully Submitted,**

  [Your Name]
  Chair, Drafting Subcommittee
  Charter Review Commission
