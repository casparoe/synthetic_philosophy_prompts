answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct privilege of being in [Partner A] and [Partner B]'s cohort.

  When they asked me to give this toast, they told me the story of how they met: a reading group on the drafts of Mill's *Chapters on Socialism*. Now, for most people, that is a very specific meet-cute. But for us, in this room, that is a loaded gun.

  Because we all know the history. John Stuart Mill wrote in his *Autobiography* that Harriet Taylor was the driving force behind his turn toward socialism—that the insights on cooperative production and the future of the laboring classes were hers as much as, if not more than, his. He claimed he was the scribe; she was the architect.

  And we also know that, for the last century, historians have been throwing punches over whether that was the literal truth, or a beautiful, grief-stricken exaggeration on Mill's part after she died. It is the great third rail of Mill scholarship.

  Knowing that there are at least three people in this room who could dismantle that debate in their sleep—and likely have tenure to prove it—I have decided to take a very specific methodological stance tonight.

  I am going to plead *insufficient evidence* regarding the 19th century, and claim *overwhelming evidence* regarding the 21st.

  Because the joke, really, is on the historians. They spend decades arguing about whether a partnership like this is possible, whether one mind can truly sharpen another without erasing it, and whether credit can be shared without being diminished. They argue about whether Mill was being honest or romantic.

  But [Partner A] and [Partner B] didn't need to write an *Autobiography* to prove it. They didn't need to wait for posterity. We have seen them in the seminar room. We have seen them in the archives. We have seen the way they talk to each other when they think no one is listening.

  Mill wrote that his life was defined by two things: his work, and Harriet. He hoped they were the same thing. Looking at these two, you don't need a historiographical debate to see that they've already solved the problem Mill spent a lifetime describing. They aren't waiting for the final draft to acknowledge each other's influence. They aren't saving the credit for the eulogy.

  So, I propose a toast.

  To [Partner A] and [Partner B]. May your collaboration be as legendary as Mill and Taylor's, but with significantly less posthumous editing, and may you never have to defend the authorship of your happiness to a room full of skeptics.

  To the happy couple!
