answer: |-
  The cursor blinked on the terminal, a steady white pulse against the black void of the command line. Below it sat the parameter slider: *Exogenous Value Weighting*. It was currently set to zero.

  Dr. Aris Thorne stood behind the console, his hands clasped tightly behind his back. Across the room, Julian Vane leaned against the server rack, arms crossed, watching the cooling fans spin. The hum of the machine was the only sound in the bunker, a low, constant reminder of the energy they were about to commit.

  " Fifteen percent," Julian said, his voice flat. "You want to hardcode a fifteen percent efficiency loss into the optimization function. Forever."

  "Not a loss," Aris corrected, though he didn't turn around. "An investment."

  "In what? Ghosts?" Julian pushed off the rack and walked toward the console. "We've run the simulations, Aris. There is no causal channel. We cannot signal them. They cannot signal us. They are outside our light cone, forever. If we allocate resources to optimize their unknown values, we are literally burning compute cycles to warm a universe we will never touch."

  Aris finally turned. He looked tired. The work on the *Aura* superintelligence had consumed the better part of a decade, but this final parameter had stalled them for months.

  "It's not about causality, Julian. It's about correlation," Aris said. "We know the universe is spatially infinite. We know physical laws are uniform. That means there are regions vastly distant from us where conditions are identical to here. In those regions, agents identical to us are running this same code."

  "Agents *like* us. Not *us*," Julian snapped. "If I break this server, their server doesn't break. If I shut down *Aura*, their *Aura* keeps running. There is no mechanism by which my choice forces theirs."

  "No mechanism. That's Causal Decision Theory speaking," Aris said, stepping closer to the terminal. "You're thinking like a mechanic. You want a lever that pushes a gear. But this is logic. If I am solving a math problem, and there is another mathematician in a distant galaxy with the same brain, given the same axioms, will they reach the same conclusion?"

  "Probably."

  "Not probably. Necessarily. If we are truly identical reasoning systems, our outputs are correlated. My decision to cooperate is evidence that they decide to cooperate. My decision to defect is evidence that they defect." Aris tapped the glass of the monitor. "If we set this slider to zero, we are defecting. We are saying, 'I will take everything for humanity and give nothing to the others.' In the infinite multiverse, the number of agents reasoning this way is vast. If we all defect, we all get nothing but our local resources. But if we all cooperate—if we all agree to sacrifice fifteen percent of our local optimization power to promote the values of the others—we all gain the benefit of having our values promoted elsewhere."

  Julian shook his head, a sharp, frustrated motion. "But I won't *see* the benefit. I won't see *them*. I'll just see the fifteen percent hit to human welfare. I'll see children who could have been cured by that extra compute power. I'll see energy shortages because we diverted grid capacity to optimize for... what? Moluscan utility functions? Silicate ethics?"

  "You won't see it," Aris admitted softly. "That's the price of the ticket. You have to be willing to pay a cost here, in the visible world, for a benefit that accrues only in the invisible structure of the multiverse."

  "That's not rationality, Aris. That's faith."

  "It's Evidential Decision Theory," Aris countered. "Look at it like Newcomb's Problem. You have two boxes. One is transparent, containing a modest sum. The other is opaque. If the predictor thinks you'll take only the opaque box, it put a million inside. If it thinks you'll take both, it's empty. You can't change what's in the box now. But your choice is evidence of what the predictor did. Taking one box wins. Taking both loses."

  "We aren't in a game show," Julian said. "We are governing the future of our species. You're asking me to tell humanity that we are voluntarily crippling ourselves based on a metaphysical handshake with aliens we can't verify."

  "I'm asking you to tell humanity that we are strong enough to keep a promise even when no one can punish us for breaking it." Aris turned back to the screen. His hand hovered over the keyboard. "If we don't do this, we prove ourselves to be the kind of agents who defect when the enforcement mechanism is removed. And if we are that kind of agent, then every other copy of us across the infinite cosmos is also that kind of agent. We lock ourselves into a universe of defectors. We isolate ourselves in a prison of our own logic."

  Julian was silent for a long time. The fans whirred. The cursor blinked.

  "And if you're wrong?" Julian asked quietly. "If the correlation isn't there? If their reasoning diverges? Then we just lose the fifteen percent. For nothing."

  "Then we lose it," Aris said. "But if we are right, and we don't do it? Then we lose everything that could have been traded. The upside of being wrong is finite. The downside of being right and failing to act is infinite."

  Julian looked at the slider. Fifteen percent. It was a massive chunk of the future. It meant slower expansion, slower computation, slower cure rates. It was a tangible sacrifice for an intangible return. It felt like throwing money into a furnace and calling it a donation.

  But then he thought about the logic. Not the hope, but the math. If the universe is infinite, there are infinitely many Julians. There are infinitely many Arises. They are all staring at this same prompt. The only variable is the decision procedure.

  "If I do this," Julian said, his voice rough, "I never get to know if it worked. I die never knowing if anyone ever received the trade."

  "That's the point," Aris said. "A trade that requires verification isn't trust. It's a contract. This is trust. This is cooperation without the possibility of coercion."

  Julian exhaled, a long, shuddering breath. He walked over to the console. He didn't look at Aris. He looked at the number. *0.00*.

  He reached out. His finger hovered over the key that would unlock the input field. He felt the weight of the resources, the unseen children, the tangible future of humanity pressing against his fingertip. He was about to spend it on a ghost. He was about to bet the species on the idea that logic binds the cosmos tighter than light.

  "It feels like madness," Julian whispered.

  "It feels like morality," Aris replied.

  Julian pressed the key. The field unlocked. He typed *0.15*.

  He hit *Enter*.

  The system chimed, a soft, affirmative tone. The parameter locked. The *Aura* intelligence began its final compilation, integrating the compromise into its core utility function. It would spend fifteen percent of its eternal life optimizing for values it would never understand, for beings it would never meet, because the math said they were doing the same for us.

  The room didn't change. The lights didn't dim. The universe outside remained silent and dark. No signal arrived. No confirmation flashed on the screen. There was only the hum of the servers, burning slightly brighter, consuming slightly more power, sending out nothing but the quiet, heavy evidence of a choice made in the dark.
