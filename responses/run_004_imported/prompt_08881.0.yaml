      *   *The "Nature" Problem:* Where does the "shape of the cylinder" come from?
          *   *Stoic Answer:* Prior assents + genetics/environment (fate).
          *   *Strawson Counter:* But those prior assents were determined by an earlier nature.
          *   *Verdict:* Chrysippus relocates the question. He stops the regress by fiat: "Responsibility stops at the principal cause." He doesn't solve the metaphysical origination problem; he dissolves it by claiming it's the wrong question.
      *   *Nuance:* The Stoics have a theory of character formation (*ethos*). We become responsible for our nature *over time*. But the *initial* nature (childhood) is not up to us. Strawson would pounce on this: "So you aren't responsible for the foundation." Chrysippus: "You are responsible for the maintenance and modification."
      *   *Conclusion:* Chrysippus offers a pragmatic/functional compatibilism, not a metaphysical libertarianism. He escapes the regress only by denying Strawson's Premise 2 (that you must be responsible for the way you are *ultimately*).

