answer: |-
  This is a profound and subtle question that cuts to the heart of Ramsey's philosophical legacy. To answer it, we must resist the temptation to treat Ramsey as a monolith. He was a thinker of extraordinary range—mathematician, economist, philosopher, and psychologist—who died before his system could fully cohere. The tension you identify between the humanist of "Epilogue" (1925) and the utilitarian economist of "A Mathematical Theory of Saving" (1928) is real, but it is not necessarily a contradiction. It is a tension between *meaning* and *justice*.

  If we suppose Ramsey had lived to encounter modern longtermism, he would likely have recognized the lineage of his own thought in it, but ultimately rejected its conclusion. He would have accepted the longtermist premise of impartiality while rejecting the longtermist practice of "swamping." To see why, we need to disentangle the two texts, apply Ramsey's broader pragmatism (as emphasized by Misak), and then reconstruct how he would view the ethics of the far future.

  ### 1. Reconciling "Epilogue" and "Saving"

  The first step is to clarify that the 1925 and 1928 texts are answering different questions.

  In **"Epilogue,"** Ramsey is addressing an existential anxiety: *Does the physical insignificance of humanity render our lives meaningless?* His answer is a defiant no. When he writes that the heat death of the universe has a "present value at compound interest" that is "almost nothing," he is using financial language metaphorically to describe *psychological and ethical grip*. He is arguing that the *meaning* of a present good (a conversation, a piece of art, a moment of love) is intrinsic to that moment. It does not derive its value from its contribution to an infinite timeline. If the universe ends in a billion years, my coffee this morning is not retroactively devalued. Here, Ramsey is a humanist protecting the "foreground" of human experience from being obliterated by the "background" of cosmic physics.

  In **"A Mathematical Theory of Saving,"** Ramsey is addressing a problem of *distributive justice across time*. The question here is not "Does my life matter?" but "Do I have the right to consume resources that my grandchildren might need?" When he calls discounting "ethically indefensible," he is establishing an axiom of impartiality: a unit of welfare in 2024 counts the same as a unit of welfare in 2124. This is a constraint on *selfishness*, not a commandment to worship the future.

  The tension dissolves if we see "Epilogue" as a defense of the *present's intrinsic value* and "Saving" as a defense of the *future's equal standing*. "Epilogue" says the present is not *less* valuable because the future is blank. "Saving" says the future is not *less* valuable because it is distant.

  ### 2. Where Ramsey Would Agree with Longtermism

  Modern longtermists (like those at the Centre for Effective Altruism or FHI) explicitly cite Ramsey's 1928 paper as the foundational argument against pure time preference. On this specific axiomatic point, Ramsey would stand with them.

  Ramsey was a utilitarian in the Moorean tradition; he believed in "good" as an objective property and that ethics involved maximizing that good. He would reject the notion that we are morally permitted to ignore future suffering simply because it is chronologically remote. If we have the power to prevent a catastrophe that would kill a billion people in 2100, Ramsey's 1928 logic suggests we are obligated to do so, provided the cost to the present is not disproportionate. He would agree that the "weakness of the imagination" often leads us to neglect future generations.

  Furthermore, Ramsey was deeply politically engaged (a socialist and a member of the Bloomsbury Group's intellectual periphery). He cared about social progress. He would likely agree that ensuring the continuation of a civilized, thinking, loving community is a prerequisite for the goods he valued in "Epilogue." If the stars cannot think or love, but humans can, then extinguishing humanity extinguishes the only source of value in the universe. In that specific sense, he might agree that existential risk is a unique category of harm.

  ### 3. Where Ramsey Would Break with Longtermism

  However, the leap from "the future matters equally" to "the future swamps the present" is where Ramsey's "Epilogue" instincts would kick in with full force. Longtermism argues that because the potential number of future lives is astronomically large (trillions upon trillions), the expected value of safeguarding that future outweighs almost all present-day moral concerns (including alleviating current poverty, suffering, or injustice).

  Ramsey would likely find this move morally perverse, for three reasons rooted in his broader philosophy.

  **A. The Rejection of Moral Intimidation by Scale**
  In "Epilogue," Ramsey refuses to be humbled by the spatial vastness of the universe ("the stars may be large, but they cannot think or love"). Longtermism asks us to be humbled by the *temporal and demographic* vastness of the universe ("future people may be numerous, so they outweigh you").
  For Ramsey, value is rooted in the capacity for "thinking and loving." A single instance of genuine love or thought has intrinsic worth. To say that one million future lives outweigh one present life is not just a mathematical calculation; it is a claim that the *present* life is less real or less valuable. Ramsey's "perspective" drawing, where humans are foreground and stars are threepenny bits, is a methodological instruction: *ethics must be conducted from the human standpoint.* Longtermism asks us to adopt a "view from nowhere" (or a view from the end of time) that renders present suffering negligible. Ramsey would argue this is a category error. You cannot use the *quantity* of future value to cancel out the *quality* of present obligation.

  **B. Probability and Pragmatism**
  Cheryl Misak's biography highlights Ramsey's role as a founder of the subjective theory of probability (Bayesianism). Ramsey was rigorous about what we can reasonably believe and act upon. He distinguished between logical probability and the actual degrees of belief that guide action.
  Longtermism relies on chain-reasoning over centuries or millennia. We are asked to act on the basis of highly speculative models about the trajectory of civilization, the nature of future consciousness, and the efficacy of specific interventions (like AI safety research) to affect that trajectory.
  Ramsey would be deeply skeptical of the *epistemic confidence* required by longtermism. In "Truth and Probability" (1926), he argued that beliefs are habits of action. If the causal chain between our action now and the welfare of people in the year 3000 is too attenuated or uncertain, the "degree of belief" in the outcome should be low, regardless of the magnitude of the stake. To sacrifice definite present goods for highly speculative future goods would strike him as bad decision theory, not just bad ethics. He would likely view the longtermist calculation as a form of Pascal's Wager—mathematically seductive but pragmatically hollow.

  **C. The "Compound Interest" Reversal**
  Recall the "Epilogue" line: the heat death has a "present value at compound interest" that is "almost nothing." Longtermists effectively reverse this: they argue the *prevention* of extinction has a present value that is *almost infinite*.
  Ramsey's point in 1925 was that temporal distance diminishes the *claim* an event has on our current emotional and moral state. He was arguing against the idea that we should live in fear or awe of the distant future. While "Saving" says we shouldn't *discount* the future's welfare, "Epilogue" says we shouldn't be *dominated* by it.
  Ramsey would likely argue that while we must not *ignore* the future, we also must not let the abstract idea of the future cannibalize the concrete reality of the present. The "compound interest" metaphor in "Epilogue" suggests that moral urgency decays with temporal distance, even if moral worth does not. We have stronger obligations to those we can see, touch, and help with certainty.

  ### 4. The Verdict: A Human-Scale Utilitarian

  If Ramsey had encountered longtermism, he would likely have diagnosed it as a confusion of *mathematics* with *ethics*. He would have recognized that the longtermists were correctly applying his 1928 equation of intertemporal justice, but incorrectly applying it to the 1925 problem of human meaning.

  He would probably have argued that the "swamping" effect is a mathematical artifact that ignores the diminishing marginal utility of certainty. Saving a known child from drowning today has a moral weight that cannot be exceeded by a probabilistic calculation about a trillion unborn people, because the *reality* of the value is higher in the former case.

  **My Defended Guess:**
  Ramsey would have been a **"Near-Termist Utilitarian."**

  He would have advocated for significant savings and investment in the future (per 1928), rejecting the idea that we can burn resources now because "we're here and they're not." He would have supported measures to prevent clear, imminent existential threats (like nuclear war, which was becoming visible in his time) because the probability was high and the stakes were human.

  However, he would have rejected the core longtermist claim that we should prioritize existential risk reduction *above almost everything else*. He would have argued that this prioritization requires us to treat present human beings as mere means to the end of future population growth. It violates the "perspective" principle of "Epilogue." It asks us to shrink the foreground (actual suffering people) to the size of threepenny bits so that the background (potential people) can loom large.

  For Ramsey, ethics is about the cultivation of good states of mind and society *now*, extended as far as we can reasonably see. He would have told the longtermists: "You are right that the future counts, but you are wrong to think its size makes it more important. The stars are large, but they cannot love. The future is vast, but it is not yet real. Do not sacrifice the real for the vast."

  In the end, Ramsey's commitment was to **truth and human goods**, not to the maximization of abstract utility sums. He would have seen longtermism as a noble error—a failure to keep the human being in the foreground of the picture.
