      *   *The "Compound Interest" line:* In "Epilogue," he uses financial language metaphorically to dismiss the future's claim on the present's *emotional state*. In "Saving," he uses financial language literally to calculate *optimal savings rates* based on ethical axioms.

  4.  **Analyze Longtermism:**
      *   Core Claim: The future is potentially vast (trillions of lives). If we treat future people impartially (Ramsey 1928), the sum total of value is dominated by the future. Therefore, reducing existential risk (ensuring the future happens) is the top priority.
