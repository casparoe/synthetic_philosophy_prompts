      *   *Section 4: Probability and Pragmatism.* Ramsey's work on truth and probability. Longtermism is highly speculative. Ramsey preferred "human goods" we can see and touch.
      *   *Conclusion:* He would be a "Near-Termist Utilitarian." Save for the future, yes, but don't let the abstract future cannibalize the concrete present.

  7.  **Refining the Nuance (Self-Correction during drafting):**
      *   *Correction:* Make sure not to paint Ramsey as a selfish hedonist. He was deeply public-spirited (socialist leanings).
      *   *Correction:* Ensure the distinction between *discounting* (time preference) and *diminishing marginal utility* is clear, as Ramsey cared about the latter. Longtermists often argue future people might be richer, so money matters less, but existential risk affects *existence*, not just wealth.
      *   *Key Insight:* The "Epilogue" quote about compound interest is crucial. He says the *present value* of the heat death is nothing. Longtermists say the *present value* of preventing extinction is everything. These are mirror images. Ramsey's view suggests the *distance* itself reduces the claim on current action, not just emotionally but perhaps practically.
      *   *Wait, check the "Saving" paper again:* Ramsey argues for a high savings rate if the future is important. But he also assumes a stable community. He didn't account for existential risk in the modern sense.
