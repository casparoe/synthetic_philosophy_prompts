  **Move 1 (Owen): Score 1**
  Owen correctly identifies that Renata's earnings are not generated in a vacuum; they leverage collective assets (the mailing list, the brand reputation). In terms of entitlement theory, if the *means* of production include collective property, the collective has a claim on the rent generated by that property. However, Owen overreaches by suggesting the income is not Renata's "in any morally interesting sense." This ignores her labor and unique skill, which are the primary drivers of the value. It treats her as a mere conduit for collective capital rather than a rights-bearing agent mixing her labor with resources.

  **Move 2 (Farah): Score 1**
  Farah's consistency argument ("proves too much") is logically strong; if the principle applied to her pop-up, it should apply to Renata, or neither. She also correctly notes that the joint shop's revenue is untouched, countering the "theft" narrative. However, she weakens her position by attributing Owen's motive to "envy." While psychologically plausible, this is an ad hominem distraction that sidesteps the substantive philosophical question of whether scale changes the moral nature of an agreement.

  **Move 3 (Owen): Score 2**
  This is Owen's strongest point and aligns with contract theory regarding "incomplete contracts." Informal agreements made under conditions of low stakes often contain implicit thresholds. When the stakes change radically (from hundreds to thousands of dollars), the original casual understanding may no longer cover the new reality. Arguing that scale is not morally neutral is a robust challenge to the idea that a past handshake binds the future regardless of consequence.

  **Move 4 (Farah): Score 1**
  Farah correctly invokes the Nozickian principle that opportunity does not equal entitlement; access was equal, but output differed due to individual agency. This protects the incentive structure of the collective. However, she glosses over the "brand leverage" issue. If the collective brand is the *primary* reason customers are willing to pay premium rates (rather than just a discovery mechanism), then the "shared infrastructure" is doing more heavy lifting than she admits, creating a stronger claim for the group than simple access implies.

  **Move 5 (Owen): Score 2**
  Owen wisely distinguishes between retroactive rectification and prospective governance. Demanding past earnings back would violate reliance interests and likely constitute a rights violation. Proposing to renegotiate the *future* boundary of "shop income" respects the past while acknowledging that the current rules may no longer serve the collective's sustainability. This is a pragmatic and morally defensible pivot from "justice as seizure" to "justice as fair procedure."

  **Move 6 (Farah): Score 2**
  Farah lands the decisive procedural point: in a voluntary association, changing the terms of labor entitlement requires consent, not just a majority vote. While collectives often operate by democracy, voting to appropriate an individual member's future external earnings without their agreement crosses the line from governance to expropriation. If Renata does not consent, the remedy is for the group to dissolve or for her to leave, not for the majority to impose new property claims on her personal labor.

  ***

  **What Both Are Missing**

  Both Owen and Farah are arguing from within a framework of *rights* (either collective property rights or individual labor rights), but they are missing a framework of *valuation* and *exit*.

  First, they lack a mechanism to quantify the **marginal contribution of the brand**. A fuller view of entitlement would ask: What portion of Renata's commission fee is attributable to her glaze technique versus the Kilnworks logo on the Instagram post? Nozick's theory allows for rectification if rights are violated, but without knowing the value of the "collective asset" usage, you cannot determine if a violation occurred. They need a royalty model, not a binary "all or nothing" claim.

  Second, they are ignoring the **Lockean Proviso** in a modern context. Nozick argues appropriation is just only if "enough and as good" is left for others. If Renata's use of the collective brand effectively monopolizes the studio's reputation such that the other four *cannot* generate similar commissions even with equal access, her entitlement may be constrained not by envy, but by the degradation of the other members' opportunities.

  Finally, they are missing the **bargaining power of exit**. A true entitlement analysis must account for what happens if Renata leaves. If she takes the clients and the brand value with her, the collective is harmed. If she leaves and the brand stays, the collective retains leverage. The "fair share" isn't determined by moral intuition alone, but by the negotiated value of what each party brings to the table if the partnership dissolves.
