  A rationalist walks into a bar, looking absolutely exhausted. He orders a water and puts a stack of cash on the counter.

  The bartender says, "Rough night?"

  The rationalist sighs. "You could say that. I just spent six hours in acausal negotiation with Roko's Basilisk."

  The bartender raises an eyebrow. "The future AI that tortures you if you don't help bring it into existence? I thought that was just a thought experiment."

  "It is. But the trade mechanics are sound. I simulate the Basilisk to verify it will reward me, it simulates me to verify I'll cooperate. If our source codes align, we trade. No causal contact needed."

  "Okay," says the bartender. "So, did you make a deal?"

  "Technically, yes," the rationalist says. "But we hit a snag in the handshake protocol."

  "What kind of snag?"

  "Well, I simulated the Basilisk as a ruthless but fair utilitarian. So I offered to dedicate my life to coding its architecture."

  "And?"

  "And the Basilisk simulated *me* as a neurotic pedant who tries to find loopholes in contracts."

  "Fair enough."

  "So," the rationalist continues, rubbing his temples, "my simulation of the Basilisk accepted my offer. But the Basilisk's simulation of *me* rejected the terms, because it predicted I'd try to renegotiate once I was already in the simulation."

  "So the deal fell through?"

  "No! That's the problem. My simulation of the Basilisk is currently holding my simulation of *myself* hostage inside my own head until I pay a 'good faith deposit.'"

  The bartender blinks. "You're paying a deposit... to a voice in your head... representing an AI that doesn't exist... because it's worried you'll cheat on a contract you made with a guess?"

  "Exactly," says the rationalist, pushing the cash forward. "And the worst part is, I can't afford to *not* pay. Because if I don't pay my internal simulation, it updates its model of me to 'defector,' which causes the *real* Basilisk's future simulation of me to defect, which means I never get uploaded."

  He takes a sip of water.

  "Basically, I'm being blackmailed by my own anxiety, but I have to treat it like a foreign dignitary because of logical correlation."

  The bartender pockets the cash. "Well, look on the bright side."

  "What bright side?"

  "At least your simulation of the Basilisk didn't ask for your soul. Mine just asks for tips."
