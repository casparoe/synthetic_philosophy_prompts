answer: |-
  Thank you all for being here.

  For those of you who knew Howard primarily as the guy who ran the Tuesday night workshop, you probably know him best by the red ink in your margins. You'd turn a page, hopeful, and there it would be, scrawled in his jagged hand: *"Not compossible!"*

  He meant that the plot point didn't fit the world you'd built. That you couldn't have the stakes be low and the danger be fatal. You couldn't have a character act out of love and then react out of pure cynicism without earning the turn. He taught us that truth in a story isn't about what feels nice; it's about what holds together.

  But for those of you from the department, his colleagues and old friends, you know that "compossibility" wasn't just a editing note. It was the obsession of his life.

  We all know the caricature. Voltaire's *Candide*. Dr. Pangloss. The idea that "all is for the best in this best of all possible worlds." Usually, when people say that, they mean: "Don't worry, this tragedy is actually a blessing in disguise."

  Howard hated that. He hated it more than I've ever hated anything. When he was lying in that hospital bed, hooked up to pumps, wasting away from pancreatic cancer, he did not tell me it was "for the best." He did not tell me there was a reason for it. He knew that pain was evil. He knew that loss is a catastrophe.

  If I stand here and tell you that Howard's death is "part of a plan," I am betraying him. That is the flattened, Pangloss version of his belief. And Howard spent fifty years fighting that simplification.

  So, how do we honor the man without lying about the pain?

  Howard used to explain this to me over holiday dinners, usually while carving a turkey or pouring wine. He talked about the difference between what he called "antecedent will" and "consequent will."

  Antecedent will is the wish that every single part of the story be good. That no one gets sick. That no one dies young. That the good guys win every time. Howard believed that God—or the universe, or the moral arc of things—wills that antecedently. He believed that every instance of suffering is a genuine tragedy, willed against in isolation.

  But then there is consequent will. This is the judgment of the *whole*.

  Howard believed that some goods are "incompossible." They cannot exist together. You cannot have courage without the possibility of fear. You cannot have the depth of love we feel for him right now without the risk of this exact grief. To remove the suffering would be to remove the capacity for the love.

  He didn't believe this world was the best in every part. He knew this part—the cancer, the decline, the silence of this room today—is terrible. He believed this world is the best *on the whole*. The best compossible mixture of freedom, nature, and consequence.

  Why does this matter for us, today?

  Because it gives us permission to grieve without losing our faith in the story.

  If we believe the Pangloss lie, we have to pretend this death isn't bad. We have to smile and say "he's in a better place" to avoid the horror of the void.

  But if we believe Howard's truth, we can say: This is awful. This is a rupture. We wish, antecedently, that he were here. We wish the manuscript on his desk was finished. We wish the cancer had never touched him.

  And yet.

  We look at the consequent. We look at the whole of his life. We look at the hundreds of students he pushed to write harder truths. We look at the philosophy he wrestled with not to excuse evil, but to make room for hope alongside it. We look at the love in this room, which is only this heavy because it was this real.

  Howard taught me that a story isn't ruined because the third act is tragic. A story is ruined if the third act is unearned. And Howard's life was earned. Every bit of it.

  He was working on that manuscript defending Leibniz until his hands were too weak to hold the pen. I asked him once, a few weeks before the end, if he felt like he'd proven it. If he'd won the argument against Voltaire.

  He looked at me, tired as I'd ever seen him, and said, "The argument isn't the point. The point is that you keep writing."

  He meant that the defense of the "best of all possible worlds" isn't a logical proof. It's a lived one. It is the act of continuing to create, to love, and to seek truth even when you know the cost.

  So, to his students: Keep writing. Don't take the easy way out. If a scene hurts, don't cut it just to make it brighter. Make it true.

  To his colleagues: Keep wrestling. Don't let the big questions be answered by small platitudes.

  And to all of us who loved him: It is okay to be angry at the incompossibility of it all. It is okay to wish the parts were different. But when you are ready, look at the whole.

  Look at the work he left. Look at the way he changed us. Look at the fact that we are all here, united by a man who taught us that meaning is not found in avoiding the dark, but in carrying a light through it.

  Howard would probably tell me this is getting too sentimental. He'd scribble "not compossible!" in the margin of this speech. He'd say I'm trying to resolve a tension that needs to remain open.

  So I will leave it open.

  We do not know why the world is built this way, where the best possible version still includes pancreatic cancer. We only know that Howard faced it with the same rigor he brought to a draft. He didn't flinch. And he asked us not to flinch either.

  The manuscript is unfinished. The workshop is empty. But the story holds.

  Thank you.
