prompt: |-
  In my work on AI alignment, I've recently had to think hard about how, or whether, one can aggregate many different people's preferences into a single training objective for a model -- for instance, when combining many raters' feedback via reinforcement learning from human feedback (RLHF). Two results that colleagues keep invoking seem to be in real tension. Arrow's impossibility theorem is cited to argue that no reasonable rule for aggregating individual preference orderings into a social ordering can satisfy a small set of seemingly minimal fairness conditions without collapsing into dictatorship. Harsanyi's aggregation theorem, on the other hand, is cited as showing almost the opposite: if both individual and social preferences over lotteries satisfy the expected-utility axioms and a mild Pareto condition holds, the social preference is forced to take the form of a weighted sum of individual utilities -- apparently vindicating a kind of utilitarian aggregation. Could you explain why these two results don't actually contradict one another, focusing in particular on what work interpersonal comparability of utility is doing, or not doing, in each? I would also value your judgment on whether Harsanyi's theorem genuinely earns its utilitarian conclusion, or whether it covertly presupposes just the kind of interpersonal comparison that Arrow's framework, and Robbins-style skepticism about comparing utility across people, were meant to avoid.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**
      *   **Context:** AI Alignment, specifically aggregating human preferences for RLHF (Reinforcement Learning from Human Feedback).
      *   **Core Tension:** Arrow's Impossibility Theorem (no fair aggregation of ordinal preferences without dictatorship) vs. Harsanyi's Aggregation Theorem (social welfare must be a weighted sum of individual utilities, implying utilitarianism).
      *   **Specific Questions:**
          1.  Why don't they contradict? (Focus on interpersonal comparability).
          2.  Does Harsanyi's theorem genuinely earn its utilitarian conclusion, or does it covertly presuppose interpersonal comparisons (IPC) that Arrow/Robbins wanted to avoid?
      *   **Target Audience:** Someone working in AI alignment (likely technically literate, familiar with utility theory, looking for philosophical/technical clarity).

  2.  **Analyze Arrow's Impossibility Theorem:**
      *   *Input:* Ordinal preference orderings (rankings) over social states. No intensity information.
      *   *Constraints:* Universal Domain, Pareto Efficiency, Independence of Irrelevant Alternatives (IIA), Non-Dictatorship.
      *   *Output:* Social ordering.
      *   *Key Limitation:* It explicitly *forbids* interpersonal comparisons of utility (ICU). It treats preferences as orderings only ($A \succ_i B$), not magnitudes ($U_i(A) - U_i(B)$).
      *   *Result:* Impossibility (under the stated conditions).

  3.  **Analyze Harsanyi's Aggregation Theorem:**
      *   *Input:* Von Neumann-Morgenstern (vNM) preferences over *lotteries*. This implies cardinal utility (up to positive affine transformation).
      *   *Constraints:* Pareto Efficiency (if everyone prefers lottery $L$ to $L'$, society does too), vNM rationality for individuals and society.
      *   *Output:* Social utility function $W = \sum a_i U_i + b$.
      *   *Key Assumption:* The domain includes risky prospects (lotteries). This allows cardinalization of *individual* utility.
      *   *Result:* Possibility (Utilitarian form).

  4.  **Resolve the Tension (Question 1):**
      *   *Domain Difference:* Arrow works with ordinal preferences over sure outcomes. Harsanyi works with cardinal preferences over lotteries.
      *   *The Crucial Bridge:* Interpersonal Comparability (IPC).
      *   *Arrow:* Assumes *no* IPC. Preferences are just orderings. You can't say Person A's gain is bigger than Person B's loss.
      *   *Harsanyi:* The theorem *mathematically* derives the weighted sum form, *but* the weights ($a_i$) are arbitrary unless fixed by something else.
      *   *The Catch:* To make the weights meaningful (i.e., to actually do utilitarianism where weights are equal or ethically justified), you need to normalize the utility scales across individuals. Harsanyi's theorem itself doesn't fix the scales; it just says *if* you have vNM utilities, the social function is linear in them. But $U_i$ is unique only up to affine transformation ($aU + b$). To sum them, you need to align the zeros and units.
      *   *Conclusion:* They don't contradict because they operate on different informational bases. Arrow says "Ordinal + No IPC = Impossible." Harsanyi says "Cardinal (via risk) + Pareto = Linear Form." Harsanyi does *not* solve the IPC problem on its own; it just pushes it into the choice of weights/scales.

  5.  **Evaluate Harsanyi's Utilitarian Claim (Question 2):**
      *   *Does it earn the conclusion?* It earns the *form* (linear aggregation), but not the *ethical content* (equal weights/IPC).
      *   *Robbins' Skepticism:* Lionel Robbins argued utility is ordinal and IPC is unscientific/metaphysical.
      *   *Harsanyi's Move:* He uses risk to get cardinality *within* a person. But comparing *between* persons still requires a normative choice about how to scale $U_1$ vs $U_2$.
      *   *The "Veil of Ignorance" Argument:* Harsanyi often pairs the Aggregation Theorem with his "Veil of Ignorance" argument (Social choice = choice under uncertainty about who you are). This attempts to justify equal weights.
      *   *Critique:* Many philosophers (e.g., Sen, Weymark, Broome) argue this still smuggles in IPC. To say "I have a 1/N chance of being Person i" requires a coherent probability space over identities, which implicitly assumes a common metric of existence/welfare.
      *   *AI Alignment Context:* In RLHF, we get ratings (ordinal or cardinal?). If we treat them as vNM utilities, we still face the scaling problem. Normalizing ratings (e.g., z-scoring) is a covert IPC assumption.

  6.  **Synthesize for the AI Alignment Context:**
      *   RLHF usually collects pairwise comparisons (ordinal) or Likert scales (pseudo-cardinal).
      *   Arrow warns: If you treat them as purely ordinal rankings of outputs, you can't fairly aggregate.
      *   Harsanyi suggests: If you treat them as utilities over distributions of outputs, you can sum them.
      *   Practical Implication: The "scaling" of reward models across different humans is the hidden IPC problem. If Rater A is a "hard grader" and Rater B is "easy," summing their raw scores is arbitrary. Harsanyi doesn't solve this; it just formalizes the requirement to fix the scales.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the sophistication of the question. State the thesis: They differ in informational basis (ordinal vs. cardinal/lotteries).
      *   *Section 1: Arrow's Theorem.* Focus on ordinality and the ban on IPC. Explain IIA's role in blocking intensity.
      *   *Section 2: Harsanyi's Theorem.* Focus on vNM axioms and lotteries. Explain how risk creates cardinality *intrapersonally*. Show the math ($V = \sum a_i U_i$).
      *   *Section 3: The Resolution (IPC).* This is the core. Explain that Harsanyi's weights $a_i$ absorb the scaling. Without fixing the zero and unit for each $U_i$ relative to others, the sum is meaningless. Arrow assumes this is impossible; Harsanyi assumes it's a parameter to be set.
      *   *Section 4: Does Harsanyi Earn Utilitarianism?* Critical analysis. Distinguish between *formal structure* (weighted sum) and *normative force* (equal weights). Discuss the Veil of Ignorance. Mention the "measurement problem" (Robbins).
      *   *Section 5: Implications for AI Alignment.* Connect back to RLHF. Reward modeling, normalization, and the danger of assuming raters are calibrated.
