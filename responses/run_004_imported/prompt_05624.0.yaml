      *   *Self-Correction on the "100%" rule:* The prompt says the friend winced at "100% chance." So I must explicitly avoid assigning an *objective chance* of 1 to a contingent outcome. I can express *subjective credence* of 1, provided I acknowledge it's not objective chance. Or better, frame it as "conditional on admissible evidence."
      *   *Key Insight:* The Groom's job is to defer to chance. The Bride's job is to calculate it. In their marriage, he defers to her. That's the joke and the heart.

  7.  **Writing the Content (incorporating specific constraints):**
