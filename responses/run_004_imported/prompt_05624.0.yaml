  5.  **Drafting - Iteration 2 (Refining the Philosophy):**
      *   Need to mention *Humean Supervenience*. Chances aren't magic propensities; they're summaries of what happens.
      *   Need to mention *Admissible Evidence*. We don't know the future, so we defer to the chance.
      *   The "Undermining Future": Lewis worried the future could change the present chance. But in marriage, the future *builds* the pattern.
      *   Avoid "100%." Say "My credence approaches 1."

  6.  **Drafting - Iteration 3 (Polishing for Tone):**
      *   Make it sound like a speech, not a lecture.
