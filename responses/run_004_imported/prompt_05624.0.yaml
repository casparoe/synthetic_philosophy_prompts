answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I'm a science journalist now, but I used to be [Groom]'s grad-school roommate. I left the PhD program to write about science; [Groom] stayed to argue about the metaphysics of science. Specifically, the metaphysics of chance.

  If you're family, you're probably wondering how a couple meets. Usually, it's "eyes across a crowded room." For [Groom] and [Bride], it was "conflicting interpretations of a weather forecast across a crowded room."

  They met at a party arguing about what "70% chance of rain" actually *means*. Is it a frequency? A propensity? Or, as [Groom] would argue, a constraint on rational belief? Most people hear that and see a red flag. But when [Groom] tells that story, he looks at [Bride] the way other men look at a first dance. Because [Bride] is a meteorologist. She spends her life calculating the very numbers [Groom] thinks the rest of us are rationally required to defer to.

  In [Groom]'s line of work, there's a famous idea from David Lewis called the *Principal Principle*. Roughly, it says: If you know the objective chance of something, and you don't have any forbidden "inadmissible" information about the future, your own degree of belief *must* match that chance.

  So, think about that dynamic. [Bride] generates the objective chances. [Groom] defends the principle that says you have to believe them. In philosophical terms, she is the $X$, and he is the $C$. She provides the data; he provides the deference. It is, quite literally, a marriage made in epistemic heaven.

  Now, I need to address the back table. Yes, I see you, the philosophy cohort. I know the rules. I know that for a Humean like [Groom], chances aren't hidden magic powers; they're patterns read off the total history of events. I know Lewis worried about the "undermining future"—the idea that future events could retroactively make our present chance assignments false.

  And I know that if I stand here and say, "There is a 100% chance this marriage will last," you will all wince. Because assigning an objective chance of one to a contingent future event is sloppy modal logic. It implies necessity where there is only contingency.

  So I won't say that. I am not assigning an objective chance of 1 to this outcome.

  However.

  Lewis also taught us that admissible evidence is information about the past and present. It is *not* information about the future. And when I look at the admissible evidence—their history, their patience with each other's pedantry, the way [Bride] explains pressure systems while [Groom] nods like he's hearing poetry—my *credence* is as high as it gets.

  For the rest of the room: "Credence" just means "confidence." I am saying that based on everything we know right now, I am as sure as a human being can be that they are perfect for each other.

  But there is a deeper lesson here, one that doesn't require a degree in logic to appreciate. [Groom] has spent his career studying how to navigate a world of uncertainty. He knows we can't know the future. We can't know the "undermining" events that lie ahead. All we have is the Principal Principle: When you find something true, something reliable, something that grounds you... you defer to it. You trust it.

  [Bride], you are his objective chance. You are the pattern in the noise. And [Groom], you have spent your life learning how to trust the numbers. So trust this one.

  They say love is a gamble. I think that's wrong. A gamble implies you're betting against the odds. This isn't a gamble. It's a calculation based on excellent data.

  So, if everyone could raise a glass.

  To [Bride] and [Groom]. I do not claim to know the objective chance of your future happiness, because that is a contingent matter not yet settled by the Humean mosaic of your lives. But conditional on all admissible evidence available to me tonight, my credence in your joy is unity.

  To the bride and groom!
