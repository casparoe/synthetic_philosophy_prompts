      *   *Dialogue:*
          *   Elena: "Did you see that? Two agents."
          *   Marcus: "One agent, broken connection."
          *   Marcus brings up daily life (Breakfast).
          *   Elena explains the "Interpreter" and subcortical unity.
          *   Elena brings up the conflict (hands fighting).
          *   Marcus explains motor competition vs. will.
          *   Enter Pinto/New Data.
          *   Elena: "That's just attention, not selfhood."
