answer: |-
  It is completely understandable why you and your friend arrived at this conclusion. It is the most comforting way to read Kepler: it preserves him as a proto-modern scientist who was unfortunately burdened by the superstitions of his time, rather than a mystic who stumbled into truth. This "Two Keplers" theory—one the mercenary astrologer, the other the mathematical genius—was actually the dominant view for a long time, particularly in the 19th and early 20th centuries.

  However, the reason modern historians of science (such as J.V. Field, Bruce Stephenson, and James Gingerich) insist on reading the astrology, metaphysics, and astronomy together is not merely antiquarian thoroughness. It is because the "compartmentalized story" fails to explain *how* Kepler actually did his work. If you bracket the astrology and metaphysics, you aren't just removing the decoration; you are removing the engine.

  Here is why the scholarly consensus rejects the idea that Kepler's metaphysics were merely "charming packaging" for an essentially modern physics.

  ### 1. The "Packaging" Was Actually the Blueprint
  Your reading suggests that Kepler discovered the elliptical orbits and the three laws through independent physical reasoning and then dressed them up in the language of harmony to sell them. The historical record suggests the exact opposite occurred.

  In *Harmonices Mundi* (The Harmony of the World), the astronomy (Book V) is not a separate finding wrapped in harmony; it is the *conclusion* of the harmonic argument (Books I–IV). Kepler did not start with the data and find ellipses; he started with a metaphysical conviction that the universe *must* be structured according to geometric and harmonic archetypes existing in the mind of God.

  When the circular orbits (the traditional "perfect" shape) failed to match Tycho Brahe's data, Kepler didn't just switch to ellipses because the math worked. He switched to ellipses because he eventually realized that while circles were geometrically perfect, they did not satisfy the *harmonic* requirements of the planetary speeds. He needed a physical mechanism that allowed for variable speeds to create musical intervals. The Third Law (relating period to distance) was explicitly sought as a harmonic law. Without the drive to find musical ratios in the sky, Kepler likely would have stopped at the "vicarious hypothesis" or tried to patch the circular models indefinitely. The metaphysics didn't package the science; it motivated the specific mathematical questions that led to the science.

  ### 2. Unified Causality: Light, Soul, and Force
  The compartmentalized view assumes Kepler's astronomy was "physical" in the modern sense (matter in motion) and his astrology was "superstitious." But Kepler's physics was not Newtonian. Kepler was searching for *causes*, and his causal mechanism was deeply intertwined with what we would call animism or astrology.

  In *Astronomia Nova*, Kepler argues for a *vis motrix* (moving force) emanating from the Sun. He often describes this in terms of light or a "species" that sweeps the planets around. For Kepler, the Sun was the physical mover of the planets, but it was also the spiritual heart of the universe.
  *   **Astronomy:** How does the Sun move the planets? (Via a force/light).
  *   **Astrology:** How does the Sun/Planets affect Earth? (Via the same force/light).

  To Kepler, these were the same question. If the Sun has the power to push massive planets through the ether, why would it not have the power to affect the "sublunary" realm (weather, human temperament)? In *Tertius Interveniens*, Kepler isn't just defending astrology to keep his salary; he is attempting to purify astrology of "arbitrary rules" (like the zodiac signs) and ground it in the same geometric "aspects" (angles between planets) that govern the orbital dynamics. He believed the "aspects" created real physical tensions in the Earth's soul, just as they governed planetary speeds. You cannot separate the "force" that moves Mars from the "influence" that affects the Earth's weather without imposing a Newtonian distinction that Kepler did not possess.

  ### 3. The Financial Argument is Necessary but Insufficient
  You are absolutely correct that Kepler needed the money. He was Imperial Mathematician to the Holy Roman Emperor, a position that required casting horoscopes. He complained bitterly about this in his letters, calling astrology the "foolish daughter" of the "wise mother" (astronomy).

  However, the financial imperative explains why he cast *horoscopes for Wallenstein*. It does not explain why he wrote *Harmonices Mundi*.
  *   Casting a nativity for a patron is a service job.
  *   Writing a treatise redefining the geometric foundations of astrological aspects is theoretical work.

  Kepler spent years developing his theory of "reformed astrology." He didn't have to do that to get paid. He did it because he believed it was true. If the astrology were merely a mercenary sideline, he would have used the traditional Ptolemaic rules (which patrons expected) rather than trying to convince his patrons that their horoscopes should be calculated based on new, complex geometric theories of harmonic aspects. The fact that he tried to *reform* astrology to match his astronomy proves he saw them as a unified system.

  ### 4. Why Historians Insist on the Connection
  If we accept the compartmentalized story, Kepler becomes a miracle. He becomes a sleepwalker (as Koestler titled his book) who ignored his own mysticism to find the truth.

  Historians reject this because it relies on "Whig history"—judging the past by how closely it resembles the present.
  *   **Whig View:** Kepler was a modern physicist trapped in a mystic's body. We study the mysticism to pity him.
  *   **Contextual View:** Kepler was a natural philosopher for whom mathematics was the language of God. The mysticism *is* the methodology.

  By studying *Tertius Interveniens* and the early chapters of *Harmonices Mundi*, scholars aren't trying to tarnish Kepler's reputation. They are trying to understand the **heuristic value** of his errors. Kepler's belief that "Geometry is God" allowed him to look for mathematical relationships in physical data where no one else thought to look. His "astrological" intuition that the planets must "sing" to each other led directly to the law of periods.

  ### Conclusion
  The "mercenary sideline" picture is correct regarding the *horoscopes* he cast for bread and butter. But it is incorrect regarding the *theoretical astrology* and metaphysics found in his major scientific works.

  Kepler did not discover elliptical orbits *despite* his belief in cosmic harmony; he discovered them *because* of it. The "real intellectual work" of the *Harmonices Mundi* is not just Book V (the laws); it is the argument in Books I–IV that makes Book V inevitable. To bracket the astrology is to remove the premise from the syllogism. Historians study them together not to be thorough, but because Kepler himself did not know how to separate them. To understand the science, you have to understand the faith that fueled it.
