answer: |-
  Here are ten interview questions drafted for your podcast episode. They are designed to move from the metaphysical underpinnings of Anscombe's argument into the messy historical application, specifically targeting the friction points you encountered with your friend.

  **1. Setting the Stakes**
  "Elizabeth Anscombe's *Mr. Truman's Degree* is often treated as a period piece—a snapshot of 1950s Catholic intellectualism reacting to the dawn of the nuclear age. But you've argued that the pamphlet contains a perennial challenge to how we calculate moral responsibility in war. For an audience familiar with the Doctrine of Double Effect, what is the specific philosophical friction point that makes this 1956 argument feel urgent today, rather than just historically significant?"

  **2. The Intention/Foresight Distinction (Primary Constraint)**
  "Anscombe's central charge is that Truman *intended* the death of civilians, rather than merely foreseeing it as a side effect of striking a military target. For listeners who know the abstract distinction, can you specify the operational criterion you use to distinguish the two in this specific context? When we look at a target like Hiroshima—a city with a military garrison but a vast civilian population—what exactly makes the civilian casualties a *means* to victory rather than an unfortunate *byproduct* of destroying the infrastructure?"

  **3. Follow-Up on Intention**
  "Let's press that criterion. Some military historians argue that the shock to civilian morale was indeed part of the strategic calculation, but others suggest the primary aim was destroying the industrial capacity housed within the urban center. If we apply your criterion here: if the civilian population had magically vanished overnight but the factories and rail lines remained intact, would the atomic strike still have been ordered? If the answer is 'no,' does that confirm the intention was the killing itself, or does it suggest the killing was inextricably linked to the destruction of the capacity?"

  **4. The Definition of "Innocent"**
  "This brings us to the status of the victims. In just war theory, 'innocent' usually denotes non-combatant status rather than moral purity. However, in a total war economy, a significant portion of the civilian population is manufacturing the shells, engines, and fuselages that keep the war effort running. Does Anscombe's framework grant immunity to a civilian working in a munitions plant located within a city? At what point does material cooperation with the war effort forfeit the protection of non-combatant status, if ever?"

  **5. The Historian's Objection**
  "I recently debated this with a historian friend who argued that the intention/foresight distinction collapses in the fog of war. Their claim was that in a prolonged, existential conflict, the 'intention' of a campaign is diffuse, distributed across logistics, politics, and military command, making it impossible to pin a specific moral intent on a single decision-maker like Truman. How do you respond to the claim that Anscombe's moral lens is too microscopic to capture the macroscopic reality of a modern military campaign?"

  **6. The Pacifism Tension (Primary Constraint)**
  "Anscombe was explicit that she was not a pacifist; she believed some wars could be fought justly. Yet, if we maintain an absolute prohibition on intentionally killing the innocent, and we acknowledge that modern industrial war inevitably entangles civilians in the production of violence, does the distinction between 'just war' and 'pacifism' become merely theoretical? How does Anscombe envision a war being fought effectively against a totalitarian enemy without violating this prohibition?"

  **7. Moral Luck and Outcome**
  "One defense of Truman relies on the idea that the bombings ended the war swiftly. If the war had dragged on for another year, resulting in significantly higher casualties on both sides due to conventional bombing and starvation, does the moral evaluation of Truman's intention change? Or is the moral quality of the act fixed at the moment of the decision, regardless of whether the bomb succeeded in forcing a surrender?"

  **8. The "Lesser Evil" Argument**
  "Standard consequentialist replies argue that the atomic bombings, while terrible, killed fewer people than a full-scale invasion of the home islands would have. If we grant the premise that an invasion would have resulted in a net increase of hundreds of thousands of deaths, does your defense of Anscombe require us to accept that we must sometimes choose the path that leads to more bloodshed in order to keep our own hands clean? Is that a bullet you are willing to bite?"

  **9. Exceptions and Thresholds**
  "Following up on that: Is there *any* scenario in your reading of Anscombe where the prohibition on killing the innocent is overridden? If the stakes were higher—say, an existential threat to the very existence of the political community—does the absolute nature of the prohibition hold, or is there a threshold of catastrophe that legitimizes what is otherwise forbidden?"

  **10. Closing: The Verdict**
  "To close, I want to return to the pamphlet's title. Anscombe campaigned against Oxford granting Truman an honorary degree, effectively calling him a murderer. If your guest were advising a university today on whether to honor a leader who authorized drone strikes or nuclear deterrence policies that foreseeably kill civilians, would the verdict be the same? Does Anscombe's argument demand we withdraw honor from almost all modern statecraft?"
