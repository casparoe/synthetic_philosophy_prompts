prompt: |-
  Been down a rabbit hole reading Augustine's actual treatise on lying (De Mendacio, "On Lying") for a piece I'm working on, instead of just recycling the two-line pop-philosophy version where he's "the guy who says you can never lie, even to the murderer at the door." Here's the snag that's stuck with me: Exodus has the Hebrew midwives lying to Pharaoh to save the Israelite baby boys, and God flat-out rewards them for it (Ex. 1:20-21). That's a real problem for Augustine, since his whole position is that once something counts as a lie, no motive or consequence can make it okay. His way out is to say the midwives weren't praised for the lie itself, just for moral progress relative to something worse — he compares it to how scripture calls Sodom "justified" next to Israel's worse sins elsewhere, i.e. better-then-terrible isn't the same as good. I don't want a survey of the debate, I want an argument: argue that this move fails, and that the midwives case really does commit Augustine, on his own terms, to admitting that at least some lies are good, not merely less bad.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the Request:**
      *   **Topic:** Augustine's *De Mendacio* (On Lying), specifically his handling of the Hebrew Midwives (Exodus 1).
      *   **Augustine's Position:** Lying is *always* a sin, regardless of motive or consequence.
      *   **The Problem:** Exodus 1:20-21 says God rewarded the midwives for lying to Pharaoh.
      *   **Augustine's Solution:** The midwives weren't praised for the lie, but for their benevolence/mercy *despite* the lie. It's a relative justification (like Sodom vs. Israel), not an absolute one. The lie remains a sin, just a lesser one in a context of overall goodness.
      *   **The Task:** Argue *against* Augustine's solution. Show that, on his *own terms*, this move fails. The midwives' case forces him to admit that some lies are *good*, not just *less bad*.
      *   **Constraint:** Do not provide a survey of the debate. Provide a specific, tight argument.

  2.  **Deconstruct Augustine's Argument in *De Mendacio*:**
      *   *Definition of a Lie:* Speaking falsehood with the intention to deceive (*voluntas fallendi*).
      *   *Moral Ontology:* Lying violates the order of creation. Words are signs of thoughts; using them to conceal thoughts disorders the soul and society.
      *   *The Midwives:* They lied to Pharaoh. God rewarded them.
      *   *Augustine's Exegesis:* God rewarded their *piety* and *mercy*, not their *falsehood*. The lie was a venial sin overshadowed by a mortal virtue. He uses the "relative righteousness" analogy (Sodom/Israel).

  3.  **Identify the Weak Point (The "Snag"):**
      *   Augustine's ethics are teleological (ordered toward God/Truth) but also deontological regarding speech (the act itself is disordered).
      *   The core tension is between *divine reward* and *sinful act*.
      *   If God rewards an action-complex, and the lie is an integral, necessary part of that complex, can the lie truly be severed from the reward?

  4.  **Develop the Counter-Argument (Step-by-Step):**

      *   *Premise 1: The Inseparability of Act and Intent in Augustine's Ethics.*
          Augustine insists that the morality of an act depends heavily on the *will* (intention). A good will makes a good act; a bad will makes a bad act. The midwives' will was wholly oriented toward God (fearing God more than Pharaoh). The lie was the *instrument* of that will.

      *   *Premise 2: The Nature of Divine Reward.*
          Augustine agrees God is perfectly just. God does not reward sin. If God rewards the midwives, He is rewarding the *effective cause* of the salvation.
          Augustine tries to split the "mercy" from the "lie." But in this specific scenario, the mercy *could not exist effectively* without the lie. The lie wasn't an accidental byproduct; it was the *means*.

      *   *Premise 3: The "Relative Righteousness" Analogy Fails.*
          Augustine compares the midwives to Sodom (justified relative to worse sinners). But Sodom wasn't rewarded with building houses and families (Ex 1:21). They were merely spared destruction longer or judged less harshly. The midwives were *blessed*. Positive reinforcement implies approval of the *mechanism* of success, not just the *goal*.

      *   *The Climax: The Necessity Argument.*
          If the lie was necessary to achieve the God-ordained end (saving the Covenant children), and the end is Good, and God rewards the achievement, then the means participates in the Good. To say the means is Evil while the End is Good creates a dualism Augustine rejects.
          *Crucial Augustinian Term:* *Ordo Amoris* (Order of Love). The midwives loved God's truth (life/covenant) more than Pharaoh's truth (political report). By lying to Pharaoh, they were being *truer* to God.
          *The Trap:* If lying to a murderer/tyrant preserves the Truth of God's promise, is it a lie against Truth, or a defense of Truth? Augustine says it's always a lie against Truth. But if God rewards it, God validates it as a service to Truth.

  5.  **Drafting the Argument (Iterative refinement):**

      *   *Focus:* Don't get bogged down in later Aquinas or Kant. Stick to Augustinian internal logic.
      *   *Key Concept:* The unity of the moral act. Augustine hates splitting hairs to excuse sin, yet here he splits the act from the intention in a way that contradicts his own psychology of action.
      *   *Key Concept:* Divine Sanction. If God builds them houses (Ex 1:21), He sanctifies their method.
      *   *Refining the "Relative Righteousness" rebuttal:* Augustine says they are "justified" like Sodom. But Sodom wasn't *blessed*. The text says God "dealt well with the midwives." This is active beneficence, not passive leniency.

  6.  **Final Polish (checking against constraints):**
      *   Is it an argument? Yes.
      *   Does it avoid survey? Yes.
      *   Does it address *De Mendacio* specifically? Yes.
      *   Does it show the midwives commit him to "good lies"? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "consequences matter." Augustine doesn't care about consequences. I need to argue that on *his* terms (theology of reward, nature of the will, definition of sin), the distinction collapses. The argument must be that the *lie itself* becomes an act of piety, which Augustine denies is possible.

      *Stronger angle:* Augustine defines sin as a turning away from God. The midwives turned *toward* God *through* the lie. Therefore, the lie cannot be a turning away. If it's a turning toward, it's not a sin. If it's not a sin, it's a permissible/good lie.

  7.  **Finalizing the Structure:**
      1.  Introduction: State the thesis (Augustine's distinction between act and intention collapses here).
      2.  Point 1: The Unity of the Moral Act (Will + Deed).
      3.  Point 2: The Theology of Reward (God doesn't bless sin).
      4.  Point 3: The Failure of the "Relative" Analogy (Blessing vs. Leniency).
      5.  Conclusion: The lie must be reclassified as a service to Truth.

  8.  (Reviewing the prompt again): "Argue that this move fails, and that the midwives case really does commit Augustine, on his own terms, to admitting that at least some lies are good, not merely less bad."
      Okay, I need to be aggressive on the "on his own terms" part. Use his concepts (*voluntas*, *ordo*, divine justice).

      *Let's write it.*
answer: |-
  Augustine's attempt to salvage his absolute prohibition on lying in *De Mendacio* by bifurcating the midwives' action into a "pious intention" wrapped around a "sinful means" fails on his own theological and psychological terms. It collapses because it violates the Augustinian unity of the moral act, contradicts his own doctrine of divine justice, and misreads the nature of the biblical reward. On Augustine's own premises, the midwives' case forces him to admit that a lie, when deployed as the necessary instrument of a higher piety, ceases to be a lie in the sinful sense and becomes a good act.

  **1. The Violation of the Unity of the Will**
  Augustine's moral psychology rests on the *voluntas* (will). For Augustine, sin is not merely in the external utterance but in the disordered will (*aversio a Deo*). Conversely, virtue is the will ordered toward God (*conversio ad Deum*). In the case of the midwives, Augustine attempts to surgically separate the *voluntas* (mercy/fear of God) from the *officium* (the spoken falsehood). He argues the will was good, but the act remained disordered.

  This is psychologically incoherent within his own system. The midwives did not lie *despite* their piety; they lied *because* of it. The falsehood was not an accidental byproduct of their virtue (like stumbling while running to church); it was the chosen instrument of their virtue. If the will determines the morality of the act, and the will was wholly directed toward preserving God's covenant people, then the instrument chosen by that will participates in that direction. To claim the will was righteous while the necessary execution of that will was sinful creates a dualism Augustine usually rejects. If the lie was the *only* available vehicle for their piety to become effective, then the lie itself becomes an expression of that piety. You cannot have a "holy will" executing an "unholy act" when the act is the exclusive definition of the will's movement in that moment.

  **2. The Theology of Divine Reward**
  Augustine concedes that God rewarded the midwives ("He made them houses," Ex. 1:21). He also holds that God is perfectly just and cannot be a party to sin. Augustine argues God rewarded their benevolence, not their duplicity. But this distinction evaporates under the weight of divine omniscience and justice. God knows the mechanism of the salvation. If God rewards the *outcome* (the saved children and the midwives' prosperity), He validates the *causal chain* that produced it.

  In Augustinian theology, God does not merely tolerate sin to bring about good (as in the Felix Culpa); He actively blesses obedience. By building the midwives' houses, God is not offering a consolation prize for a sin they couldn't avoid; He is sanctioning their conduct. If the lie were truly a sin—a violation of the divine order of signs—God would be punishing the sin while rewarding the intention, or at best, overlooking the sin. But the text presents active beneficence. For Augustine to maintain that the lie was a sin, he must imply that God blesses a causal chain that includes a violation of His own law. This makes God complicit in the disordering of signs. The only way to preserve Divine Justice on Augustinian terms is to admit that the lie, in this specific context, was not a disorder, but a service.

  **3. The Failure of the "Relative Righteousness" Analogy**
  Augustine's fallback is the analogy of relative justification: the midwives are "justified" only as Sodom was "justified" relative to Israel's worse sins (Ezekiel 16:51). He argues they are praised for being *less bad*, not *good*. This exegetical move fails against the text of Exodus. Sodom was never *blessed* for being less bad than Israel; they were merely judged less harshly or used as a foil. The midwives, however, receive a positive covenantal blessing (families/houses).

  Furthermore, Augustine's analogy undermines his absolute prohibition. If the midwives are only "less bad," then lying remains a sin, merely a venial one in this instance. But Augustine argues elsewhere that a lie is a turn away from Truth (God). A "lesser" turn away is still a turn away. If the midwives turned away from Truth to save lives, and God rewarded them, then God is rewarding a turn away from Himself. This is theological nonsense for Augustine. The only coherent Augustinian conclusion is that in the hierarchy of truths, the midwives were actually *more* truthful to God's covenantal promise than they were false to Pharaoh's political inquiry. They prioritized the Higher Truth over the Lower Fact.

  **Conclusion**
  Augustine wants to have it both ways: he wants to keep the absolute rule ("No lies") while accounting for the biblical data ("God blessed liars"). His solution is to claim the midwives were blessed *despite* the lie. But because the lie was the necessary, willed instrument of their piety, and because God actively blessed the specific mechanism of their disobedience to Pharaoh, Augustine is cornered. On his own terms regarding the unity of the will and the justice of divine reward, he must admit that the lie was not a "lesser evil" but a "greater good." It was an act of fidelity to God that took the grammatical form of a falsehood. If that is not a "good lie," the terms are meaningless.
