      *   **Refine the "Harm" Claim:** Benatar argues existence is *always* a harm, not just *sometimes*. Why? Because the "harm" isn't just net negative balance; it's the imposition of risk/suffering without the counterbalancing moral obligation to provide pleasure to the non-existent.
