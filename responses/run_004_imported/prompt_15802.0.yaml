      *   **Presumptuous Philosopher (PP):** Theory A says $10^{10}$ observers. Theory B says $10^{20}$ observers. Prior odds 1:1. SIA says posterior odds are $1:10^{10}$ in favor of B, *before* looking out the window/running experiments. This seems absurdly presumptuous.
