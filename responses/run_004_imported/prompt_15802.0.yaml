      *   *The "Infinite Universe" Issue:* SSA breaks down with infinite universes (measure problem). SIA handles infinities better (sometimes).
      *   *Re-framing PP:* Is the philosopher actually being presumptuous, or is the intuition pump misleading? The physicist's experiment isn't ignored; the anthropic evidence is *additional* evidence.

