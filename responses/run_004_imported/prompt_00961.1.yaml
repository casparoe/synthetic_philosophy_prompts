  Hey -- I'm putting together an exam question on Lewis's triviality result for indicative conditionals, and I'm tired of students just reciting "P(A>B) = P(B|A) leads to triviality" without ever getting why. Could you build me the smallest, most concrete counterexample you can manage -- an actual toy space of possible worlds with real numbers for the probabilities -- and walk through, step by step, how insisting on that equation, plus the natural requirement that it keeps holding once you conditionalize on new info, forces something absurd? I have a vague memory this can be done with like 3 or 4 worlds but don't just take my word for it, work it out properly. Then give me a sentence or two on why this is actually bad news for the Equation as a theory of indicative conditionals and not just a technical curiousity.
