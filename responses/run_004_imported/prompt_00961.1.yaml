          12. So, $P(A \to B | B) = 1$. This implies $B \models A \to B$.
          13. Similarly, conditionalize on $\neg B$. $P_{\neg B}(A \to B) = P_{\neg B}(B|A) = 0$. This implies $\neg B \models \neg(A \to B)$.
