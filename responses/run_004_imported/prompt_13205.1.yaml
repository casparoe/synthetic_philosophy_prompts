          *   Tone: Warm enough for grandkids, rigorous enough for scientists.
          *   Length: About 5 minutes spoken (approx. 750-900 words).
          *   Structure: Built on the argument, not decorated with references.

  2.  **Deconstruct *De Senectute* (Cato's Arguments):**
      *   *Charge 1: Withdraws from active affairs.* Cato's rebuttal: The mind remains active; guidance/mentorship is valuable even if physical action isn't. (Relevant to a retiring scientist).
      *   *Charge 2: Weakens the body.* Cato's rebuttal: Exercise and moderation help; often it's the debt of youth.
      *   *Charge 3: Deprives of physical pleasures.* Cato's rebuttal: Good riddance! Intellectual pleasures are better.
      *   *Charge 4: Nearness to death.* Cato's rebuttal: Death is natural, like fruit ripening; a life well-lived is complete.

  3.  **Drafting - Section by Section:**

