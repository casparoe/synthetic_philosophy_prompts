answer: |-
  Friends, colleagues, family. And especially the grandchildren, who I know are waiting for the cake.

  We are gathered to mark a retirement. In our line of work, retirement is often treated as a systematic shutdown. A decommissioning. And there is an old indictment against this phase of life, formulated two thousand years ago by a Roman statesman who watched his own world change. He listed four charges against old age. I want to run through them, not to offer comfort, but to test the data. Because [Friend's Name] would not tolerate a conclusion drawn from faulty premises.

  The first charge is that old age withdraws us from active affairs. That once you step away from the bench, you cease to matter. The classical rebuttal is that while the body sits still, the mind steers the ship. That the pilot does not need to climb the rigging to command the vessel.

  For a chemist, this is partially true. You stopped running the columns yourself years ago. But the lab still runs on your calibration. You withdrew from the *action*, but not the *affair*. The data you curated, the protocols you wrote, the young scientists you corrected when they tried to fudge a baseline— that is active work. It just has a longer half-life.

  The second charge is that old age weakens the body. The old argument claims that physical decline is not inevitable, but rather a debt paid for youthful excess. If you lived with moderation, the claim goes, you should remain robust.

  Here, I must note for the record that modern gerontology disagrees. Entropy is not moral. Telomeres shorten regardless of virtue. Cells accumulate damage simply because time exists. To say otherwise is bad science. [Friend's Name] did not live a life of excess, yet her knees know the gravity of ninety years. We do not honor her by pretending her body is fifty. We honor her by acknowledging that she carried that weight, managed the declining efficiency of the machinery, and still showed up. The miracle is not that the equipment is new; it is that it functioned this long under load.

  The third charge is that old age strips away pleasure. The classical view is that physical appetites fade, and this is a mercy, leaving room for the intellect. Neuroscience tells us it is more complex than that. Dopamine receptors do change. The sharp spikes of sensation dull.

  But if you have spent a lifetime in the laboratory, you know that the highest pleasure was never the sensation. It was the resolution. It was the moment the noise cleared and the signal appeared. That specific joy—the "aha" moment—does not require a healthy liver or a fast metabolism. It requires only a curious mind. And looking around this room, I see no shortage of curiosity in the honoree. The medium of the pleasure changes, from the tactile to the conceptual, but the energy release is the same.

  Finally, the fourth charge: that old age brings us near to death. The ancient rebuttal is that death is natural, like fruit ripening and falling from a tree.

  Physically, yes. Thermodynamics dictates that closed systems run down. But we are not closed systems. We are open. We transfer energy. A life does not end; it dissipates into the environment. It enters the children who learned to measure from her. It enters the grandchildren who learned to ask "why" from her. It enters the papers on the shelf and the protocols in the lab. The matter is conserved. The energy is transferred.

  So, we do not toast a withdrawal. We toast a phase change.

  [Friend's Name], you have faced the charges. You have answered them with the only evidence that matters: a life examined, a truth sought, and a hand extended to those climbing the rigging after you.

  To the signal amidst the noise. To the friend. To you.
