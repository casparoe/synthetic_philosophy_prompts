answer: |-
  You have successfully completed the "Rationalist Statistics Initiation Ritual." Welcome to the other side. Reading Scott Alexander's *Control Group Is Out Of Control* alongside the Wagenmakers/Bem saga is basically the syllabus for understanding why modern social science looks the way it does.

  You are right that **NHST (Null Hypothesis Significance Testing) is a massive contributor to the replication crisis.** The incentives it creates (dichotomous thinking, p-hacking, publication bias) are disastrous.

  However, your proposed heuristic ("Discount pre-2015 p-values, trust Bayes Factors") is a bit too clean. It risks swapping one set of blind spots for another. Here is the more nuanced breakdown of why Bayesian stats aren't a magic bullet, and what heuristics you should actually use.

  ### 1. The "Bayesian Savior" Myth
  The Wagenmakers reanalysis of Bem is indeed a classic takedown, but it contains a lesson that often gets glossed over: **Bayesian results are sensitive to priors.**

  Wagenmakers showed Bem's evidence evaporated *given a specific prior distribution* that reflected skepticism about ESP. If you choose a different prior (one that assumes psi is more plausible), the Bayes Factor changes.
  *   **The Problem:** "Honest priors" are subjective. In a polarized field, what looks like an "honest skeptical prior" to one researcher looks like "bias against novelty" to another.
  *   **BF-Hacking:** Just as you can p-hack (run analyses until $p < .05$), you can **BF-hack**. You can tweak your priors, exclude outliers, or stop data collection early until the Bayes Factor crosses your threshold of "substantial evidence." A Bayes Factor of 10 looks impressive, but not if the researcher tested 20 different priors to get there.

  ### 2. Stats Don't Fix Incentives
  The replication crisis wasn't caused *only* by frequentist math. It was caused by the **ecosystem**:
  *   **Publication Bias:** Journals want positive results. Bayesian papers with "anecdotal evidence for the null" still get rejected more often than papers claiming a discovery.
  *   **Low Power:** Running a study with $N=20$ is bad science whether you use p-values or Bayes. Small samples lead to noisy estimates and inflated effect sizes (the "winner's curse"). Bayesian methods handle uncertainty better, but they cannot conjure signal out of noise.
  *   **HARKing:** Hypothesizing After Results are Known. If you collect data, look at it, formulate a hypothesis that fits, and then run a Bayesian test, you are still capitalizing on chance.

  If psychology had switched to Bayes in 1990 but kept the same publication incentives and sample sizes, we would likely still have a crisis, just with more credible intervals and fewer asterisks.

  ### 3. The Pre-2015 Cutoff is Too Blunt
  Discounting *all* pre-2015 findings throws out the baby with the bathwater.
  *   **Robust Effects:** Many pre-2015 findings are real and robust (e.g., basic cognitive load effects, working memory limits, classic conditioning). The replication crisis hit "social priming" and "subtle behavioral interventions" hardest, not all of psychology.
  *   **Measurement Validity:** A Bayesian analysis of a construct that doesn't exist (e.g., "ego depletion" as originally conceived) will still give you a precise answer to the wrong question.

  ### 4. Better Heuristics for Trusting Science
  Instead of looking at the *statistic* (p vs. BF) or the *date*, look at the **process**. Here is a more calibrated filter:

  **A. Preregistration is King**
  A preregistered frequentist study is often more trustworthy than a non-preregistered Bayesian one. Preregistration locks in the analysis plan, preventing p-hacking and HARKing. Look for the OSF (Open Science Framework) badge.

  **B. Sample Size & Power**
  Ignore the stat test; look at the $N$.
  *   $N < 50$ per cell in social psych? Highly suspect, regardless of stats.
  *   $N > 200$ per cell? Much more likely to be stable.
  *   Large-scale collaborations (e.g., "Many Labs" projects) are the gold standard.

  **C. Direct Replications > Novel Findings**
  A paper that successfully replicates a previous finding (especially with a larger sample) is worth more than a novel finding. The field is shifting toward valuing replication, but it's still rare.

  **D. Meta-Analyses over Single Papers**
  If you want to know if an effect is real, look for a meta-analysis that includes unpublished data (to correct for publication bias). A single paper, Bayesian or not, is just one data point.

  **E. Effect Sizes, Not Significance**
  Look at the magnitude and the Confidence/Credible Interval width.
  *   $p = .04$ with a huge CI spanning zero? Garbage.
  *   $BF = 5$ but the effect size is trivial? Maybe mathematically real, practically useless.

  ### Summary
  You are right to be skeptical of the "p < .05" threshold. It is a structural vulnerability that was exploited for decades.

  But **Bayesian statistics are a better tool, not a truth serum.**

  **Your new heuristic should be:**
  1.  **Preregistered?** (Highest weight)
  2.  **Large Sample?** (High weight)
  3.  **Replicated?** (High weight)
  4.  **Bayesian?** (Slight positive weight, but only if priors are justified)
  5.  **Pre-2015?** (Slight negative weight, but check replication status first)

  The lesson of the replication crisis isn't just "use better math." It's "trust the process, not the output." Wagenmakers didn't just bring Bayes; he brought **open data, preregistration, and higher standards for evidence.** It was the package deal that fixed things, not the Bayes Factors alone.
