      *   If Uniform Speed [0, 100]: $P(V > 50) = 1/2$.
      *   If Uniform Time [0, T_max]: Need to bound time. If max speed is 100, min time is 1. If min speed is 0, max time is $\infty$. This gets messy with infinities. Let's bound it. Say speed is between 20 and 100 mph.
      *   Time ranges from 1 hour to 5 hours.
      *   Event: Speed > 50 mph (Time < 2 hours).
      *   Uniform Speed [20, 100]: Range 80. Target > 50 (Range 50). Prob = 50/80 = 5/8.
