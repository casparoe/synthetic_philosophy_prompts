      *Critique:* This is clean. It involves physics (kinematics) but isn't "geometry" in the sense of shapes/areas. It's about *quantities*. Is it distinct enough from Van Fraassen's cube? Cube was Side ($s$) vs Volume ($s^3$). This is Speed ($v$) vs Time ($d/v$). It's the same mathematical structure (reciprocal/non-linear transformation), but the *domain* is distinct (kinematics vs geometry).
