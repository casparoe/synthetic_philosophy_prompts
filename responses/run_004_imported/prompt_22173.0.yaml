      *   Event: Next bus arrives within 10 minutes (1/6 hour).
      *   *Calculation:*
          *   Case 1: Uniform over Rate $\lambda \in [2, 10]$.
              *   Wait time $T \sim Exp(\lambda)$. $P(T < t) = 1 - e^{-\lambda t}$.
