      *Idea 2: Audio/Pitch.* Frequency vs. Musical Intervals.
      *   Human hearing 20Hz to 20,000Hz.
      *   Indifferent over Frequency (linear) vs. Indifferent over Octaves (logarithmic).
      *   Event: Tone is above 1000Hz.
      *   Uniform Freq: $(20000 - 1000) / (20000 - 20) \approx 95\%$.
