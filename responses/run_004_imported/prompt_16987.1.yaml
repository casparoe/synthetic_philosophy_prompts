  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Acknowledge the seminar context.
      *   **Part 1: The Oswald/Kennedy Pair:**
          *   *Dorothy:* Starts with the intuition. One is true (indicative), one is false/unwarranted (counterfactual). Same world, different mood. This implies different semantic functions.
          *   *Robert:* Argues it's about the *context set*. Indicatives presuppose the antecedent is epistemically open. Counterfactuals presuppose it's false (or remote). The selection function $f(A, w)$ is the same, but the domain of worlds searched differs.
          *   *Dorothy's Rebuttal:* But the *reason* the second sounds false isn't just that we think Oswald did it. It's that the connection between ~Oswald and ~SomeoneElse is weak. The indicative is true because of background facts (conspiracy logic), not just epistemic openness.
          *   *Robert's Counter:* The selection function captures the "connection." In the indicative context, we hold fixed the fact that Kennedy died. In the counterfactual context, we imagine a world where he might not have.

      *   **Part 2: Lewis's Triviality Result:**
          *   *Dorothy:* Brings up the big gun. If $P(A \to B) = P(B|A)$, and $\to$ is a proposition, Lewis proved you get trivial results (probabilities collapse). So indicatives can't express propositions.
          *   *Robert:* Needs to resist. Stalnaker's move: Reject the assumption that the probability of the conditional *is* the conditional probability in all contexts. Or, argue that the context shifts when we assess probabilities. The "Triviality" assumes a fixed context, but conditionals *change* the context.
          *   *Dorothy's Push:* That feels like moving the goalposts. The intuition that "It's likely that if A, B" matches "Given A, how likely is B" is robust. If your truth conditions can't match that, why keep truth conditions?
          *   *Robert:* Because we need compositionality. We need to know what happens when we say "It is *not* the case that if A, B."

      *   **Part 3: Embedding and Negation:**
          *   *Robert:* Presses the advantage. "If A, then if B, C" or "Not (If A, B)." If conditionals aren't propositions, how do you negate them? You can't suppose a non-proposition.
