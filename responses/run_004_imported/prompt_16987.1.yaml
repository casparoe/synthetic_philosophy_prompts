answer: |-
  **Setting:** *A quiet corner of a coffee shop near the university, late afternoon. The remnants of a philosophy seminar on conditionals linger in the air. **Robert**, a proponent of unified truth-conditional semantics (Stalnaker-style), stirs his espresso. **Dorothy**, who favors the suppositional/probabilistic account (Adams/Edgington-style), leans forward over her notebook.*

  **Robert:** You looked frustrated when the professor put that Oswald pair on the board. "If Oswald didn't kill Kennedy, someone else did" versus "If Oswald hadn't killed Kennedy, someone else would have." To me, that's the perfect illustration of why we need a unified semantics with a pragmatic shift, not two different logical beasts.

  **Dorothy:** Frustrated because everyone nodded as if the difference was obvious, but no one explained *why* the first is assertable and the second isn't, given that we believe Oswald did it. For me, that pair is the smoking gun. The indicative is true because, given our evidence that Kennedy was killed, the conditional probability of "someone else did" given "Oswald didn't" is nearly 1. The counterfactual is false—or at least unwarranted—because there's no causal mechanism suggesting a backup assassin. If the semantics were the same, just shifted by context, why does the truth value seem to flip so drastically?

  **Robert:** It doesn't flip because the semantics change. It flips because the *domain* over which we evaluate the conditional changes. Think of the selection function, $f(A, w)$. It picks the closest world where $A$ is true. That mechanism is identical for both sentences. But for the indicative, we restrict the search to the "context set"—the set of worlds compatible with what the speakers take to be live epistemic possibilities. Since we don't know for certain Oswald did it in the indicative context, we look at the closest world *in our evidence set* where he didn't. In that world, the conspiracy facts hold, so someone else did.

  **Dorothy:** But that's precisely where you beg the question. You say "we don't know for certain." But in the actual conversation, we *do* treat it as a fact that Oswald did it. The indicative sounds true precisely because we are *not* treating the antecedent as a live possibility in the same way we treat the counterfactual. The counterfactual asks us to step outside our reality. The indicative asks us to reason within our evidence. If the mechanism were truly unified, the "closeness" metric should behave similarly. But it doesn't. The indicative tracks evidential support; the counterfactual tracks causal or metaphysical proximity. That suggests the "if" in the indicative isn't picking out a world at all. It's an instruction to add $A$ to your beliefs and check $B$.

  **Robert:** But if it's just an instruction, what makes the sentence true? You're leaning on Adams' Thesis—that the probability of the conditional equals the conditional probability. But that thesis is exactly what Lewis's Triviality Result attacks. If you insist that indicative conditionals have truth conditions *and* obey Adams' Thesis, you end up proving that probabilities must collapse. You can't have it both ways, Dorothy. Either you give up truth conditions, or you give up the Thesis.

  **Dorothy:** I'm happy to give up truth conditions. That's the point. Lewis showed that no proposition can track conditional probability without trivializing the probability space. Stalnaker's response, which I know you favor, is to say that the context shifts when we evaluate the probability. You claim the proposition expressed by "If A, B" changes depending on the probability function being used.

  **Robert:** Exactly. It avoids triviality by denying that there is a single, fixed proposition that the conditional expresses across all probability contexts. The content is context-sensitive. This preserves the idea that conditionals describe the world—they have truth conditions—while acknowledging the probabilistic data.

  **Dorothy:** But that feels like a technical fix that ignores the linguistic reality. If the content shifts that radically, communication becomes miraculous. When I say, "It's likely that if it rains, the match is cancelled," I'm not changing the proposition I'm uttering; I'm assessing the *same* thought against my uncertainty. If your view is right, I'm assessing a different proposition for every degree of belief I hold. That makes the conditional semantically unstable. My view is simpler: The indicative conditional *has* no truth value. It's not a description of a world; it's a tool for inference. That's why Lewis's result doesn't hurt me—I never claimed they expressed propositions in the first place.

  **Robert:** The cost of that simplicity is compositionality. If conditionals aren't propositions, how do you handle negation? Or embedding? Consider: "It is not the case that if Oswald didn't act alone, the CIA was involved." If "If A, B" has no truth value, what are you negating? You can't negate an instruction. You can't say "False: Add A to beliefs and check B." Logic requires truth-bearing units to operate on.

  **Dorothy:** We handle negation pragmatically. To deny "If A, B" is usually to assert "If A, not B." We don't need a truth-functional negation operator; we need a rule for incompatible suppositions. And regarding embedding, yes, it's harder. But consider: "If if A then B, then C." Most people find these sentences nearly unintelligible unless they can be paraphrased. The fact that nested conditionals are so awkward in natural language supports my view. We aren't built to nest suppositions easily.

  **Robert:** But they aren't *impossible*. "If the butler did it, then if he used the candlestick, there will be wax on it." That seems perfectly coherent. On my view, it's just $f(f(w, A), B)$. We select the closest A-world, then from there select the closest B-world. On your view, you're supposing a supposition. It becomes a regress of mental acts rather than a relation between states of affairs. If you can't give truth conditions for the embedded clause, you can't explain the truth conditions of the whole sentence. You lose the ability to explain validity in complex arguments.

  **Dorothy:** We can explain validity via probability preservation, not truth preservation. An argument is valid if high probability in the premises guarantees high probability in the conclusion. That handles the logic without reifying the conditional. But I'll concede this: if there are clear cases where indicatives embed under quantifiers or modals in ways that *require* a truth value, I'd be in trouble.

  **Robert:** And I'd be in trouble if the epistemic constraint I rely on breaks down.

  **Dorothy:** Let's make this concrete. We need to know what would actually settle this, rather than circling our wagons. Robert, what specific piece of evidence would force you to abandon the unified truth-conditional account?

  **Robert:** I need a case where an indicative conditional is clearly accepted as true, but the antecedent is *known* to be false by all participants, without shifting to a counterfactual reading. My account relies on the indicative being restricted to the epistemic context set. If you can show me a sentence like "If Oswald didn't kill Kennedy..." being used comfortably in a context where everyone knows Oswald *did* kill Kennedy, and it's not treated as a counterfactual subjunctive, my context-set restriction fails. I need an indicative that reaches outside the live possibilities.

  **Dorothy:** That's a high bar, given the grammar usually forces a mood shift. But I have one for you too. Dorothy, what would make you accept truth conditions?

  **Dorothy:** I need a robust example of an indicative conditional embedded in the scope of a logical operator where the suppositional view fails to predict the truth value. Specifically, a disjunction: "Either if A then B, or if C then D." If speakers can intuitively judge this sentence as true or false based on the world, rather than just their degrees of belief, then the conditional must be contributing a proposition to the disjunction. If I see data showing people reliably evaluating disjunctions of indicatives as truth-apt, independent of their conditional probabilities, Adams' Thesis breaks, and I'd have to concede they might be propositions after all.

  **Robert:** So, indicatives with known-false antecedents for me. Disjunctions of indicatives for you.

  **Dorothy:** It seems we agree on the testing ground, even if we disagree on the map.

  **Robert:** Then I'll finish this espresso and go look for some known-false indicatives.

  **Dorothy:** And I'll go look for some disjunctions. But I wouldn't hold your breath, Robert. The "if" is mightier than the truth value.

  **Robert:** We'll see. The world is made of facts, Dorothy, not just suppositions.

  **Dorothy:** Only the ones we're willing to suppose.
