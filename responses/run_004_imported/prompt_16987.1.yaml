          *   *Stalnaker-style Defender (Unified Account):* Single selection-function mechanism, indicatives constrained to epistemic possibilities, counterfactuals reach outside. Believes indicatives have truth conditions.
          *   *Adams/Edgington Defender (Suppositional/Probabilistic Account):* Indicatives lack classical truth conditions, governed by Adams' Thesis (Probability of If A then B = P(B|A)). Different in kind.
      *   **Structure:**
          1.  The Oswald/Kennedy contrast (explanations and critiques).
