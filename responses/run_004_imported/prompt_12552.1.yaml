answer: |-
  1. **The Small-Improvement Argument and Vagueness**
  Your small-improvement argument is the engine of the case for parity: if two options were truly equal, a slight improvement to one would make it better; if one were better, a slight improvement to the other wouldn't make them equal. Since neither holds in hard choices, you conclude they are "on a par." But critics argue this doesn't prove a fourth relation; it just proves the boundary between "better" and "equal" is vague. Why does the small-improvement argument rule out a vagueness-based account rather than merely being compatible with it?

  2. **Follow-up: The "Begging the Question" Defense**
  I anticipate your response will be that vagueness theorists beg the question by presupposing that "better," "worse," and "equal" exhaust the logical space of value relations. But if the trichotomy is the default framework for rational comparison, isn't the burden on *you* to demonstrate that this framework is incomplete, rather than on critics to prove it's sufficient? If any challenge based on the standard three relations is dismissed as question-begging, what neutral ground is left for debate?

  3. **The Sorites Risk and Repeated Sweetening**
  There is a worry that parity invites a Sorites-style problem. If Career A is on a par with Career B, and I add one dollar to A's salary, presumably A-plus-one is still on a par with B. If I repeat this enough times, A-plus-n is clearly better than B. At what point does parity break, and doesn't this chain imply that the "on a par" relation is intransitive over enough iterations?

  4. **Follow-up: The "Begging the Question" Defense**
  You likely argue that this Sorites worry only arises if we assume the trichotomy must eventually apply, which again presupposes that parity isn't a distinct relation. But if parity allows for chains of comparison that never resolve into "better" or "equal," aren't we accepting a form of normative intransitivity? How do you defend the rationality of that structure without simply asserting that the trichotomy assumption is illegitimate?

  5. **Normative Agency and Arbitrary Choice**
  You suggest that in hard choices, reasons run out, and we resolve the choice through "normative agency"—committing to reasons rather than discovering them. To a skeptic, this sounds like relabeling an arbitrary pick as an act of self-authorship. If the reasons don't determine the choice, what distinguishes a rational commitment from a random coin flip that I later rationalize?

  6. **Follow-up: The "Begging the Question" Defense**
  I expect you'll say this objection assumes reasons must be *found* within the trichotomy of better, worse, or equal, which ignores the space parity opens for *creating* reasons. But if the creation of reasons isn't constrained by the pre-existing value of the options, what prevents commitment from being unconstrained willfulness? Is the claim that critics "presuppose the trichotomy" doing too much work in shielding your view from the charge of arbitrariness?

  7. **Parity vs. Incomparability**
  Philosophers have long handled hard choices by claiming the options are "incomparable." You insist parity is distinct because incomparable items can't be compared at all, whereas par items can. But in practical deliberation, if I can't say one is better, worse, or equal, how does the action-guiding force of "parity" differ functionally from "incomparability"?

  8. **The Phenomenology of Hard Choice**
  Does the experience of facing a hard choice actually feel like you're perceiving a fourth relation, or does it feel like confusion? If a person feels torn because they lack information or clarity, does positing an ontological relation of "parity" describe their experience, or does it impose a metaphysical structure onto what is essentially an epistemic limitation?

  9. **Decision Theory and Maximization**
  Standard decision theory tells us to maximize expected value. If two options are on a par, neither maximizes value over the other. How should a rational agent model a decision involving parity without violating standard axioms of rational choice? Do we need a new decision theory to accommodate your metaphysics of value?

  10. **Falsifiability and Evidence Against Parity**
  Finally, let's talk about what could change your mind. If vagueness, rough equality, and incomparability are all dismissed because they allegedly presuppose the trichotomy, what would count as genuine evidence *against* parity? Is there a conceivable scenario where you would concede that a hard choice is actually just a case of vague betterness?
