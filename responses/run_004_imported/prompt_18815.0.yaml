  8.  *(Final thought before drafting)*: One crucial distinction: Boltzmann's original hypothesis was about *our* universe fluctuating. The modern one is about *pocket universes* in a multiverse. Boltzmann might prefer the "single universe, rare fluctuation" model over the "infinite multiverse, typical observer" model because the latter relies on a measure over causally disconnected regions, which might violate his sense of mechanical locality.

