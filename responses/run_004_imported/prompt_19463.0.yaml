answer: |-
  You have done an impressive job reverse-engineering these positions from summaries, and your coding analogy is genuinely helpful. However, to answer your specific question: **Yes, your current picture is flattening something fundamental.**

  While they both address the Sorites paradox, they are not "close cousins" disagreeing on mechanics; they are metaphysical rivals with opposite commitments regarding reality, truth, and logic. The most critical correction to your mental model concerns your statement that they "agree on the basic diagnosis — there's no single sharp cutoff to be found anywhere."

  **Epistemicism explicitly disagrees with that.**

  Here is the deeper carve-up of the disagreement, specifically regarding the existence of the boundary and the logical costs each theory pays.

  ### 1. The Existence of the Boundary (Metaphysics)

  **Epistemicism (Williamson): The Boundary Exists**
  Epistemicism is a form of semantic realism. It argues that vague predicates like "heap" or "too large to review" *do* have sharp boundaries. There is a specific integer $N$ such that a PR with $N$ lines is reviewable, and a PR with $N+1$ lines is not.
  *   **Why we can't find it:** Williamson argues that our knowledge of meaning is subject to a "margin for error." If we were to come to know exactly where the boundary lies, our usage would subtly shift in a way that moves the boundary, making our knowledge false. Therefore, the boundary is *in principle* unknowable, but it is *ontologically* real.
  *   **Your Analogy:** It is not just that the score "can never be measured precisely." It is that the threshold *exists* in the code of the universe (or language), but the API documentation is redacted.

  **Supervaluationism: The Boundary Does Not Exist**
  Supervaluationism argues that there is *no fact of the matter* about where the boundary lies. The predicate "too large" is incomplete.
  *   **The Mechanism:** We look at all "admissible precisifications" (all the reasonable ways one *could* draw a sharp line without violating the rules of English or team norms).
  *   **Truth:** A statement is "super-true" if it is true on *all* admissible precisifications. A statement is "super-false" if false on all. If it is true on some but false on others (e.g., "A 450-line PR is too large"), it has **no truth value**.
  *   **Your Analogy:** This is closer to your `undefined` band. But metaphysically, it claims the `undefined` state isn't just a measurement error; it's the actual state of the property.

  ### 2. The Logical Commitments (Logic)

  This is where the "flattening" in your summary is most significant. You mentioned both theories "soften classical logic." Actually, they take opposite stances here.

  **Epistemicism Saves Classical Logic**
  Williamson's main selling point is that Epistemicism preserves classical logic intact.
  *   **Bivalence:** Every statement is either True or False. (Even "This 453-line PR is too large" is either T or F, we just don't know which).
  *   **Law of Excluded Middle:** "Either the PR is too large OR it is not too large" is always True.
  *   **Cost:** You have to accept the counter-intuitive metaphysical claim that there is a precise number of lines where a PR magically flips from reviewable to unreviewable.

  **Supervaluationism Modifies Classical Logic**
  Supervaluationism preserves classical *validities* (tautologies are super-true), but it rejects **Bivalence**.
  *   **Truth-Value Gaps:** For borderline cases, "P or not-P" might fail to be true if P lacks a truth value (depending on the specific formulation, though supervaluationists work hard to keep Excluded Middle as 'super-true', they do so by sacrificing the inference rules that usually go with it).
  *   **Cost:** You lose the ability to reason about borderline cases using standard logic. If you can't assert "This PR is too large" is True, and you can't assert it is False, standard modus ponens reasoning gets tricky in the borderline zone.

  ### 3. The "Sharp Boundary" Commitment (Higher-Order Vagueness)

  You asked: *"Does either theory really manage to avoid committing to a sharp boundary existing somewhere?"*

  **Epistemicism:**
  *   **Verdict:** **Yes, it commits.** It embraces the sharp boundary. It also embraces sharp boundaries for *higher-order* vagueness. There is a sharp line between "definitely too large" and "borderline too large," and another sharp line between "borderline" and "definitely not too large."
  *   **Why:** Because it treats vagueness as ignorance. Ignorance has limits.

  **Supervaluationism:**
  *   **Verdict:** **It tries to avoid it, but struggles.** This is the famous **Problem of Higher-Order Vagueness**.
  *   **The Issue:** Supervaluationism draws a sharp line between the "super-true" cases and the "indeterminate" cases. (i.e., There is a specific line-count where a PR goes from being "too large on all precisifications" to "too large on only some precisifications").
  *   **The Criticism:** Critics argue Supervaluationism hasn't actually eliminated sharp boundaries; it has just pushed them back one level. It denies a sharp boundary for "too large," but it seems to commit to a sharp boundary for "definitely too large."
  *   **Defense:** Supervaluationists argue this isn't a real boundary in the world, but a boundary in the *model* of precisifications. However, many philosophers find this unsatisfying.

  ### Revised Coding Analogy

  To solidify the distinction, let's tweak your classifier analogy:

  **The Epistemicist Linter:**
  ```python
  def is_too_large(lines: int) -> bool:
      # There IS a constant HIDDEN_THRESHOLD defined in the environment
      # We cannot access it, read it, or infer it.
      # But for any input, the return value is strictly True or False.
      return lines > HIDDEN_THRESHOLD 
  ```
  *   **Philosophy:** The boolean return is real. The threshold is real. Our inability to see `HIDDEN_THRESHOLD` is a limitation of our access, not the code.

  **The Supervaluationist Linter:**
  ```python
  def is_too_large(lines: int) -> Optional[bool]:
      # We run the check against 1,000 different 'admissible' thresholds.
      results = [check(lines, t) for t in admissible_thresholds]
      
      if all(results): return True      # Super-true
      if not any(results): return False # Super-false
      return None                       # Indeterminate (Truth-value gap)
  ```
  *   **Philosophy:** Returning `None` is not a failure of measurement. It is the correct semantic value for that input. There is no single `HIDDEN_THRESHOLD` in the environment.

  ### Summary

  Your intuition that they are "two ways of handling a threshold" is functionally correct for solving the paradox, but metaphysically they are opposites.

  1.  **Epistemicism** says: "The boundary is sharp, logic is classical, but we are ignorant." (Realism about boundaries).
  2.  **Supervaluationism** says: "The boundary is fuzzy, logic has gaps, and there is no fact of the matter." (Anti-realism about boundaries).

  If your team argument was about whether the linter's fixed number is *arbitrary*, the Supervaluationist would say, "Yes, any fixed number is arbitrary because the property itself doesn't support a fixed number." The Epistemicist would say, "No, there is a correct number, the linter just happens to be wrong (or right) by accident, and we can never know which."

  So, to answer your final doubt: **Epistemicism does not avoid committing to a sharp boundary; it insists on one.** Supervaluationism attempts to avoid it, but arguably reintroduces it at the level of "definiteness." They are not cousins; they are enemies fighting over whether classical logic or metaphysical intuition is more expendable.
