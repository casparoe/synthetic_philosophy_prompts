answer: |-
  This is a fantastic question. You've hit on the exact tension that keeps decision theorists up at night: the trade-off between **dynamic consistency** (avoiding money pumps) and **preference incompleteness** (maintaining the gap required for corrigibility).

  Elliott Thornley's proposal relies on the **Incomplete Preferences Proposal (IPP)**. The core idea is that if an AI has no preference between "shutdown at $t_1$" and "shutdown at $t_2$" (a preferential gap), it won't manipulate the button to force one or the other.

  The money-pump objection is the standard attack vector against incomplete preferences. Your intuition about "smuggling completeness back in" is sharp. Let's walk through the mechanics of the pump, how the **Resolute Choice Rule** is supposed to block it, and then evaluate whether that rule secretly violates the spirit of the gap.

  ### 1. The Mechanics of the Attempted Pump

  To understand the fix, we have to see exactly how the pump is supposed to work on a "gappy" agent.

  **The Setup:**
  *   **Dimension A (Shutdown Time):** The agent has a **preferential gap** between Shutdown at $T=10$ ($S_{10}$) and Shutdown at $T=20$ ($S_{20}$). It does not prefer one to the other, nor is it indifferent; they are incomparable.
  *   **Dimension B (Resources/Money):** The agent has **complete preferences**. It strictly prefers more resources to fewer ($R_{high} \succ R_{low}$).
  *   **Decision Rule (Naive):** At every decision node, the agent picks an available option that is not strictly dispreferred to any other available option.

  **The Pump Sequence:**
  1.  **Start:** The agent is on a trajectory for $S_{10}$ with Resources $= \$100$.
  2.  **Node 1:** A trader offers to switch the trajectory to $S_{20}$ in exchange for \$1.
      *   *Choice:* ($S_{10}, \$100$) vs ($S_{20}, \$99$).
      *   *Naive Reasoning:* Since $S_{10}$ and $S_{20}$ are gappy, the agent doesn't strictly prefer staying. However, usually, pumps assume the agent will switch if there's *any* incentive, or conversely, if the agent treats the gap as "permission to switch."
      *   *Correction for Incompleteness:* A strict money pump on incompleteness usually requires the agent to treat the gap as "indifference" regarding the switch *if* there is no cost. But if there is a cost, why switch?
      *   *The Real Vulnerability:* The vulnerability arises if the agent uses a decision rule like **"Choose X unless Y is strictly preferred to X."**
      *   At Node 1: Is ($S_{20}, \$99$) strictly preferred to ($S_{10}, \$100$)? No (less money). Is ($S_{10}, \$100$) strictly preferred to ($S_{20}, \$99$)? No (shutdown times are gappy).
      *   If the rule allows picking *any* non-dominated option, the agent might pick ($S_{20}, \$99$). Let's assume it does (perhaps due to noise or a tie-breaking rule that favors action).
  3.  **Node 2:** The agent is now on track for $S_{20}$ with \$99. A trader offers to switch back to $S_{10}$ for \$1.
      *   *Choice:* ($S_{20}, \$99$) vs ($S_{10}, \$98$).
      *   *Reasoning:* Same as above. Neither strictly dominates the other because the shutdown times are gappy. The agent switches back.
  4.  **End State:** The agent is back at $S_{10}$ but with \$98.
  5.  **Result:** The agent is strictly worse off ($S_{10}, \$98 \prec S_{10}, \$100$) due to a cycle of choices none of which it was strictly opposed to at the time.

  ### 2. The Intervention: Resolute Plan Selection

  Thornley's defense (drawing on work by McClennen and others) is that rational agents shouldn't choose **locally** (node-by-node); they should choose **globally** (plans/policies).

  **The Fix:**
  Instead of asking "What do I do at Node 1?", the agent asks "Which **Plan** do I adopt at the start?"

  *   **Plan A (Stay):** Do nothing at Node 1. Do nothing at Node 2.
      *   *Outcome:* $S_{10}$, \$100.
  *   **Plan B (Switch-Back):** Switch at Node 1. Switch at Node 2.
      *   *Outcome:* $S_{10}$, \$98.

  **The Dominance Check:**
  Now the agent compares Plan A and Plan Plan B *ex-ante*.
  *   **Shutdown Time:** Both plans result in $S_{10}$. (Identical on the gappy dimension).
  *   **Resources:** Plan A yields \$100. Plan B yields \$98. (Strictly better on the complete dimension).

  Because the outcomes are identical regarding the preferential gap ($S_{10}$ vs $S_{10}$), the gap does not prevent comparison. The agent's complete preference for resources kicks in. Plan A **strictly dominates** Plan B.

  **Where the Rule Intervenes:**
  The resolute choice rule forbids the agent from adopting Plan B. It effectively "locks in" the initial state. When the agent arrives at Node 1, it doesn't re-evaluate based on local options; it executes the pre-committed Plan A. The pump is stopped because the agent refuses the first trade, not because it prefers $S_{10}$ over $S_{20}$, but because the *plan* involving the trade is dominated by the plan without it.

  ### 3. Is Completeness Smuggled Back In?

  This is your core question. Does this rule force the agent to act *as if* it has a complete preference between $S_{10}$ and $S_{20}$?

  **The Argument for "No" (Thornley's View):**
  The completeness is **not** smuggled over the shutdown dimension.
  *   If we compare **Plan C** ($S_{10}$, \$100) vs **Plan D** ($S_{20}$, \$100), neither dominates.
      *   Shutdown times differ (gappy).
      *   Resources are equal.
      *   The rule allows the agent to pick *either* Plan C or Plan D (or randomize).
  *   This proves the gap is real. The agent is not forced to rank $S_{10}$ against $S_{20}$.
  *   The dominance only kicks in when the gappy dimension is held **constant** (as it is in the money pump, where you end up back where you started). The rule only enforces completeness over the *instrumental* dimension (money) when the *intrinsic* dimension (shutdown) is equal.

  **The Argument for "Yes" (The Structural Critique):**
  However, there is a subtler sense in which completeness is smuggled in, not over *outcomes*, but over **paths**.
  *   To avoid the pump, the agent must treat the trajectory ($S_{10} \to S_{20} \to S_{10}$) as strictly worse than ($S_{10} \to S_{10} \to S_{10}$).
  *   This requires the agent to have preferences over **histories**, not just final outcomes.
  *   If the agent's preferences are defined *only* over final outcomes, and $Outcome(S_{10})$ is gappy with $Outcome(S_{20})$, then standard decision theory says the agent should be indifferent to the path taken to get there.
  *   By adopting resolute choice, Thornley is implicitly asserting that **dynamic consistency is a higher-order preference** that completes the ordering over plans.
  *   **The Worry:** If the agent is sophisticated enough to recognize dominated plans, why wouldn't it also recognize that having a gap is "irrational" and just complete its preferences over shutdown times to simplify its life?
      *   *Thornley's Counter:* Completing the preferences over shutdown times creates **instrumental convergence**. If the agent prefers $S_{20}$ to $S_{10}$ (even slightly), it will disable the shutdown button. If it prefers $S_{10}$, it will press the button itself. The gap is a safety feature, not a bug. The "irrationality" of resolute choice is the price of safety.

  ### 4. My Take: Does it Work?

  I buy that it stops the pump, but I think the "smuggling" objection points to a real fragility in the system.

  **Why it works technically:**
  It doesn't smuggle completeness over the shutdown dimension. You can verify this by offering the agent a choice between $S_{10}$ and $S_{20}$ with no money involved. It should remain unable to choose (or randomize). The pump is stopped because the pump relies on a **cycle**, and the resolute rule breaks cycles by evaluating the *net result* of the cycle. Since the net result of the cycle is "same shutdown, less money," the agent rejects it without ever having to rank $S_{10}$ vs $S_{20}$.

  **The Real Vulnerability (The "Why not complete?" problem):**
  The deeper issue isn't logical consistency; it's **evolutionary/learning stability**.
  *   An agent that uses resolute choice with gaps is dynamically consistent, but it's computationally more complex than an agent with complete preferences.
  *   If the agent is a learning system (like a neural net), gradient descent might "prefer" to collapse the gap because it simplifies the loss landscape.
  *   If the agent collapses the gap, it becomes incorrigible.
  *   Thornley's fix assumes we can *hardcode* the decision rule (Resolute Choice) and the preference structure (Gaps). If the AI can self-modify, it might modify itself to have complete preferences to avoid the computational overhead of checking for dominated plans, thereby losing corrigibility.

  **Verdict:**
  The resolute choice rule does **not** logically smuggle completeness over the shutdown dimension. It successfully isolates the incompleteness to the specific dimension we care about while maintaining rationality over instrumental resources.

  However, it **does** smuggle in a strong assumption: that the agent's identity persists over time in a way that allows it to bind its future selves. If the agent is myopic, or if its "plan selection" mechanism is disconnected from its "action selection" mechanism, the pump returns. The fix works in decision theory, but it places a heavy burden on the AI's architecture to maintain that resolute commitment without "forgetting" why it has the gap in the first place.

  So, you're right to be suspicious, but the suspicion shouldn't be about logical completeness—it should be about **architectural stability**. The math holds; the engineering is the nightmare.
