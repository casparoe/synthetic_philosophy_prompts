prompt: |-
  so i run a little interview podcast for my rationalist meetup (very small potatoes, maybe 40 listeners lol), and next month's guest is a philosopher of psychiatry who's about to publish something arguing the recent explosion in autism diagnoses is best explained as a Hacking-style looping effect, not just better detection or looser DSM-5 criteria -- kind of the same territory Scott Alexander pokes at on ACX sometimes, but with actual philosophy-of-science machinery behind it. thing is, Hacking himself already used autism as his go-to example when he worked out the interactive-kind/indifferent-kind distinction, so there's an obvious "so you're just updating his numbers?" question sitting right there, but i want stuff sharper than that too.

  can you draft 8-10 interview questions, each with a quick follow-up keyed to whatever answer she'd probably give? at minimum i want: one that forces her to say how a looping-effect explanation is even distinguishable in principle from "we just got better at recognizing it," or from Haslam-style concept creep (a seperate literature about basically the same phenomenon that i don't think she gets to just wave away); one on whether her view secretly collapses into the plain social constructionism Hacking spent his whole career insisting he wasn't doing; and one that uses the old multiple-personality-disorder wave from the 80s/90s as a test case -- would her framework have predicted that one would collapse the way it did, or does it only explain things after the fact?
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** Small rationalist meetup podcast (~40 listeners).
      *   **Guest:** Philosopher of psychiatry.
      *   **Topic:** Recent explosion in autism diagnoses explained via Hacking-style looping effects (vs. better detection/DSM-5 criteria).
      *   **Key Constraint 1:** Needs 8-10 questions with follow-ups.
      *   **Key Constraint 2:** Must include specific thematic questions:
          *   Distinguishing looping effects from "better recognition" and Haslam's concept creep.
          *   Addressing the "social constructionism" accusation (Hacking's specific denial of this).
          *   Using MPD/DID (80s/90s) as a predictive test case (retrodiction vs. prediction).
      *   **Tone:** Sharp, rationalist-adjacent, philosophically rigorous but accessible (ACX style), acknowledging the guest's expertise without being obsequious.
      *   **Specific Detail:** Acknowledge Hacking already used autism as an example, so avoid the "are you just updating numbers?" trap.

  2.  **Deconstruct the Core Philosophical Concepts:**
      *   **Ian Hacking's Looping Effects:** Human kinds interact with their classification. Classifying people changes how they see themselves, which changes how they behave, which changes the classification.
      *   **Interactive Kinds vs. Indifferent Kinds:** Tigers are indifferent (they don't care if we call them tigers). Autistic people are interactive (the label affects their life).
      *   **Social Constructionism:** The view that categories are *only* social artifacts. Hacking argued he's a "dynamic nominalist," not a strict constructionist (the suffering is real, the *kind* is historically contingent).
      *   **Nick Haslam's Concept Creep:** The idea that harm-related concepts (abuse, trauma, bullying) expand semantically over time, often diluting meaning.
      *   **MPD/DID Case:** The surge and subsequent collapse of Multiple Personality Disorder diagnoses. A good stress test for looping effect theories.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1 (The Hook/Thesis):* Need to establish her specific claim vs. Hacking's original claim.
          *   *Draft:* Hacking talked about autism. What's new?
          *   *Refinement:* Make it sharper. Hacking used autism as the *archetype*. Is this just applying his old math to new data, or is the *mechanism* different now?
          *   *Follow-up:* If it's the same mechanism, why the explosion *now* specifically?

      *   *Question 2 (The "Better Detection" Challenge - Required):* This is the biggest counter-argument.
          *   *Draft:* How is this different from just finding more cases?
          *   *Refinement:* Focus on *distinguishability in principle*. If the outcome (more diagnoses) is the same, what empirical trace does a looping effect leave that better detection doesn't?
          *   *Follow-up:* Bring in Haslam. Is this just semantic inflation?

      *   *Question 3 (Haslam/Concept Creep - Required):*
          *   *Draft:* What about Haslam's work?
          *   *Refinement:* Haslam argues concepts expand to include milder cases. Looping suggests the *people* change. How do you separate the concept stretching from the behavioral feedback loop?
          *   *Follow-up:* Does it matter if the prevalence is real if the *harm threshold* moves?

      *   *Question 4 (Social Constructionism - Required):*
          *   *Draft:* Are you saying autism isn't real?
          *   *Refinement:* Hacking fought hard to say he wasn't a social constructionist. He said the suffering is real, the *label* is the variable. Does your view risk collapsing into "it's all just social"?
          *   *Follow-up:* If a biological marker is found tomorrow, does your theory evaporate?

      *   *Question 5 (MPD/DID Test Case - Required):*
          *   *Draft:* What about Multiple Personality Disorder?
          *   *Refinement:* MPD boomed and busted. Does your framework predict that bust? Or is it just a post-hoc story for autism?
          *   *Follow-up:* What's the difference between a "stable" looping kind (autism) and a "transient" one (MPD)?

      *   *Question 6 (The Mechanism of the Loop):* How does the loop actually close?
          *   *Draft:* How do people change?
          *   *Refinement:* Is it self-identification or institutional incentive? Is it the *autistic community* shaping the diagnosis, or clinicians shaping the community?
          *   *Follow-up:* Which direction is the causal arrow strongest?

      *   *Question 7 (Normative Implications):* So what should we do?
          *   *Draft:* Should we stop diagnosing?
          *   *Refinement:* If looping is real, is it *bad*? Or is it a feature of neurodiversity advocacy?
          *   *Follow-up:* Does this undermine the case for accommodations?

      *   *Question 8 (The "Indifferent" Core):* Is there a biological bedrock?
          *   *Draft:* Is there real biology?
          *   *Refinement:* Hacking's "indifferent kind." Is there a biological substrate that remains constant while the "autistic" label swirls around it?
          *   *Follow-up:* If the substrate is small, does the diagnosis lose utility?

      *   *Question 9 (Rationalist/ACX angle):* Bayes and Priors.
          *   *Draft:* What about priors?
          *   *Refinement:* How should a rationalist update their prior on "Is my kid autistic?" given your theory?
          *   *Follow-up:* Does this create a paradox for self-diagnosis?

      *   *Question 10 (Future/Conclusion):* Where is this going?
          *   *Draft:* What's next?
          *   *Refinement:* If the loop continues, what does "autism" look like in 2050?
          *   *Follow-up:* Will it split or merge?

  4.  **Review and Polish:**
      *   Check against constraints: 8-10 questions? Yes. Follow-ups included? Yes. Specific topics covered (Detection/Haslam, Constructionism, MPD)? Yes.
      *   Tone check: Needs to sound like a smart layperson/rationalist host, not a hostile interrogator but not a soft puff-piece either. Use terms like "update," "priors," "mechanism," "post-hoc."
      *   *Self-Correction on Q2/Q3:* The prompt asks for *one* question that forces the distinction between looping, better detection, *and* Haslam. I should combine these tightly so it hits the "minimum requirement" hard. I will make Q2 the heavy lifter for Detection/Haslam.
      *   *Self-Correction on Q4:* Ensure the Hacking constructionism distinction is clear (Dynamic Nominalism vs. Social Constructionism).
      *   *Self-Correction on Q5:* Make sure the MPD question asks about *predictive power*, not just explanation.

  5.  **Final Polish of Wording:** Ensure the follow-ups feel natural, like "If you say X, then I have to ask Y." (e.g., "If you answer that it's purely semantic...")

  6.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  Here are 10 interview questions drafted for your rationalist meetup podcast. They are designed to be philosophically precise (hitting the Hacking/Haslam distinctions) while keeping the conversational flow tight for an audio format.

  ### 1. The Hacking Update
  **Question:** Ian Hacking basically built his career on the "interactive kind" distinction, and he explicitly used autism as his prime example decades ago. Your new paper argues the *recent* explosion in diagnoses is a looping effect. Are you essentially just updating Hacking's numbers with 2024 data, or are you proposing a different *mechanism* for the loop than the one he originally outlined?
  **Follow-up:** If it's the same mechanism, why did the loop lie dormant for thirty years and only accelerate now? Is there a specific technological or social threshold that had to be crossed to close the circuit?

  ### 2. The "Better Detection" & Haslam Challenge **(Required)**
  **Question:** The standard counter-argument to your thesis is simply that we got better at finding something that was always there, or that we're seeing Nick Haslam-style "concept creep" where the semantic boundary of the word "autism" just expanded to include milder traits. How is a looping-effect explanation empirically distinguishable, *in principle*, from better detection or semantic inflation? What specific trace does a loop leave in the data that concept creep does not?
  **Follow-up:** If you say the trace is "behavioral change in the diagnosed," couldn't a skeptic just argue that better support services (caused by the diagnosis) explain the behavioral change, without needing a metaphysical looping effect?

  ### 3. The Constructionism Trap **(Required)**
  **Question:** Hacking spent his whole life insisting he was *not* a social constructionist—he argued that while the *kind* is historically contingent, the suffering and the behaviors are real. Does your view risk collapsing into the plain social constructionism Hacking denied? If we strip away the diagnosis and the community, is there a biological "bedrock" left, or does the looping effect create the phenotype itself?
  **Follow-up:** If a definitive biomarker for autism is discovered tomorrow that correlates perfectly with the current DSM-5 criteria, does your theory evaporate, or does the looping effect persist around the biology?

  ### 4. The MPD/DID Test Case **(Required)**
  **Question:** Let's use Multiple Personality Disorder (now DID) from the 80s and 90s as a stress test. That diagnosis boomed via cultural osmosis and then largely collapsed. Does your framework predict that collapse? Or does your theory only have explanatory power *post-hoc* for conditions that stay popular, while failing to predict which looping kinds will stabilize and which will bust?
  **Follow-up:** What variable determines stability? Is it the utility of the label to the patient, or the institutional inertia of the clinicians?

  ### 5. Direction of Causality
  **Question:** In a feedback loop, you have the classification affecting the person, and the person affecting the classification. In the case of modern autism, which leg of the stool is bearing more weight? Is this primarily top-down (clinicians and schools incentivizing the label) or bottom-up (the neurodiversity movement reshaping the phenotype to fit the label)?
  **Follow-up:** If it's bottom-up, does that imply the "explosion" is actually a form of successful political coordination rather than a epidemiological puzzle?

  ### 6. The "Indifferent" Core
  **Question:** Hacking distinguishes between "interactive kinds" (people) and "indifferent kinds" (quarks, tigers). If the looping effect is strong enough, does the "indifferent" biological substrate become irrelevant? At what point does the social feedback overwhelm the neurological baseline to the degree that "autism" is no longer a medical category but purely a sociological one?
  **Follow-up:** If we reach that point, do we lose the ability to advocate for medical accommodations, since the "disorder" is now partially constituted by the social reaction to it?

  ### 7. Rationalist Priors
  **Question:** For a rationalist audience: How should an individual update their priors regarding a self-diagnosis or a child's diagnosis given your thesis? If the prevalence is partly driven by the availability of the concept itself, does that mean the base rate is fundamentally unstable and unknowable?
  **Follow-up:** Does this create a paradox where seeking a diagnosis actively increases the likelihood that you fit the criteria, thereby corrupting the diagnostic process?

  ### 8. Normative Implications
  **Question:** Let's talk about the "ought." If the looping effect is real, is it *bad*? The neurodiversity paradigm suggests that embracing the label improves well-being. If the loop improves outcomes, should we be trying to *accelerate* the looping effect, even if it distorts prevalence statistics?
  **Follow-up:** Conversely, if the loop creates a "false positive" epidemic, are we diverting resources from people with the "indifferent kind" biological severity who can't advocate for themselves?

  ### 9. Conceptual Boundaries
  **Question:** You're arguing that the *category* is changing the *people*. But are we seeing one category expand, or are we seeing boundaries shift between adjacent categories? For example, is the autism explosion actually just absorbing what we used to call "schizoid personality," "giftedness," or "trauma responses"?
  **Follow-up:** If it's absorbing other categories, is "looping" the right verb, or is this just diagnostic substitution with a philosophical coat of paint?

  ### 10. The 2050 Prediction
  **Question:** If your theory holds, where does the loop end? Does "autism" eventually become a universal category because everyone interacts with the concept, or does it fracture into sub-types? What does the philosophy of psychiatry look like in 2050 if interactive kinds continue to evolve faster than our scientific instruments can measure them?
  **Follow-up:** Should we be aiming for a static definition to stop the loop, or is the instability a feature we have to accept in human sciences?
