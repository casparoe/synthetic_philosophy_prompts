answer: |-
  You are right, and your friend is wrong on the timeline and the motivation. This is a very common misconception because Douglass's biography is often taught in two distinct chunks (the escaped slave/abolitionist speaker vs. the statesman/elder), but the pivot point on the Constitution happened much earlier than most people realize.

  Here is the breakdown you can use to settle the argument.

  ### 1. What does "What to the Slave is the Fourth of July?" (1852) actually say?
  Your friend is incorrect that this speech aligns with William Lloyd Garrison's view. In fact, this speech is widely considered the **public marker of Douglass breaking away from Garrison.**

  *   **Garrison's View:** The Constitution is a "covenant with death and an agreement with hell." It is pro-slavery. Therefore, abolitionists should not vote, should not participate in government, and should advocate for the North seceding from the South (Disunionism).
  *   **Douglass's 1852 Speech:** While the speech is scorching in its critique of American hypocrisy, Douglass explicitly appeals to the **Founding Fathers** and the **principles of the Revolution** as a moral standard that America is failing to meet.
      *   He says: *"The principles contained in that instrument are saving principles. Stand by those principles, be true to them on all occasions, in all places, against all foes, and at whatever cost."*
      *   He distinguishes between the *current politicians* (who he attacks) and the *founding document* (which he respects).
      *   If he agreed with Garrison, he would have rejected the Fourth of July entirely. Instead, he argues that the holiday *belongs* to the free citizens, and he is challenging them to extend its promises to the enslaved.

  **Verdict on the speech:** It is not a Garrisonian rejection of the Constitution. It is a demand that the Constitution's promises be fulfilled.

  ### 2. When did Douglass's view actually change?
  Your friend thinks Douglass came around to the "Constitution is anti-slavery" view in his old age as a "mellow" patriotic phase. **This is backwards.**

  *   **Early Phase (1841–1850):** Douglass *did* agree with Garrison. When he first started lecturing for the Massachusetts Anti-Slavery Society, he believed the Constitution was pro-slavery and refused to vote.
  *   **The Pivot (1851–1852):** Douglass changed his mind in his **early 30s**, not his old age.
      *   In **1851**, he wrote a letter to his mentor Gerrit Smith announcing he had changed his view.
      *   In **1852** (the same year as the Fourth of July speech), he publicly announced the break with Garrison in his newspaper, *The North Star*.
      *   By **1860**, he published a famous treatise explicitly titled *"The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?"* arguing definitively that the text never explicitly sanctions slavery.

  **Verdict on timing:** He changed his mind a full decade **before** the Civil War, while he was a young man in the prime of his activism.

  ### 3. Why did his view change? (It wasn't "mellowing")
  Your friend suggests he became more "patriotic" or "mellow" as an old man. Historians overwhelmingly agree the change was **strategic, not sentimental.**

  Douglass realized that the Garrisonian strategy wasn't working.
  *   **Moral Suasion vs. Political Power:** Garrison believed if you just shamed people enough, they'd stop owning slaves. Douglass realized that slavery was a political institution protected by law. To kill it, you needed political power (voting, parties, legislation).
  *   **The Fugitive Slave Act (1850):** This law forced Northern citizens to participate in capturing runaways. Douglass realized that "opting out" of the government (the Garrisonian stance) left the field open for pro-slavery forces to control the federal machinery.
  *   **Legal Influence:** Douglass was influenced by legal theorists like **Lysander Spooner** and **Gerrit Smith**, who showed him that if you read the Constitution literally, the words "slave" or "slavery" never appear in it. The "three-fifths clause" and "fugitive slave clause" were euphemisms that *could* be interpreted as limiting slavery rather than protecting it.

  Douglass didn't change his view because he got softer; he changed it because he got **more radical.** He wanted to seize the government to destroy slavery, not walk away from it.

  ### Summary for your argument
  1.  **The Speech:** The 1852 "Fourth of July" speech is not Garrisonian; it appeals to the Constitution's principles as a tool for liberation.
  2.  **The Date:** Douglass changed his mind in **1851–1852**, when he was roughly 33 years old.
  3.  **The Reason:** It was a strategic calculation to gain political power, not an "old man" shift toward patriotism.

  You win this round. Douglass was arguing that the Constitution was an anti-slavery document while he was still a young, radical activist, long before he was the elder statesman your friend is picturing.
