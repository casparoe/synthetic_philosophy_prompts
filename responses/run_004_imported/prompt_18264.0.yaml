answer: |-
  This is a fantastic passage to latch onto, and your intuition is spot on: your groupmate is reading Dewey through a traditional liberal or rationalist lens (looking for a fixed blueprint), whereas Dewey is operating from a pragmatic, instrumentalist lens (looking for a functional method).

  The charge that Dewey's theory is "empty" is a common critique of pragmatism generally (that it lacks normative teeth), but in this specific paragraph, Dewey is actually doing heavy lifting to distinguish **functional evaluation** from **structural dogma**.

  Here is a breakdown of what is happening in that paragraph, specifically addressing your questions about the "criterion," the "rediscovery," and the coherence of his experimentalism.

  ### 1. Criterion vs. *A Priori* Rule
  Your groupmate asks: *If there is no fact of the matter about which state is best, what work is the "criterion" doing?*

  The distinction Dewey is drawing is between a **blueprint** (rule) and a **diagnostic standard** (criterion).

  *   **An *A Priori* Rule:** This is a structural prescription that claims validity regardless of context. Examples: "A good state must have a separation of powers," "A good state must be a monarchy," or "A good state must maximize negative liberty." These are static forms. If you treat these as rules, you try to force society to fit the form.
  *   **Dewey's Criterion:** This is functional. Recall his definition of the Public: it arises from the *indirect consequences* of joint action. Therefore, the "goodness" of a state is measured by how well it identifies those consequences and manages them.
      *   *The Criterion:* "Degree of organization of the public" + "Officers caring for public interests."
      *   *The Work it Does:* It doesn't tell you *which* institution to build (e.g., a senate vs. a council). It tells you *what that institution must achieve*.

  **Analogy:** Think of a doctor.
  *   **The Rule:** "To be healthy, everyone must take 500mg of Vitamin C daily." (This is an *a priori* rule. It might help some, hurt others, and ignores specific conditions.)
  *   **The Criterion:** "Health is the efficient functioning of the organism's systems." (This is Dewey's criterion.)
  *   **The Application:** Because "Health" is the criterion, the doctor can say a specific patient is "sick" or "well." But the *treatment* cannot be determined by a rule; it must be determined by the specific conditions of the patient.

  Dewey is saying: We can judge a state as "bad" if it fails to organize the public (e.g., if corporations create massive pollution consequences that the state ignores). But we cannot judge a state as "best" simply because it copies the Constitution of 1789. The criterion allows for judgment without prescribing a specific static form.

  ### 2. "The State Must Always Be Rediscovered"
  You asked if this is just "periodic reform" or a stronger epistemological claim. **It is the stronger claim.** It is tied directly to his ontology of the "Public."

  For Dewey, the "Public" is not a fixed group of people (like "the citizens"). The Public is a **phenomenon** that comes into existence only when specific actions generate indirect consequences.
  *   In 1850, the "public" regarding transportation might have been local (stagecoaches affecting local roads).
  *   In 1927 (when Dewey wrote this), the "public" regarding transportation was national (railroads affecting interstate commerce).
  *   Today, the "public" regarding data is global.

  Because the **consequences of action change** (due to technology, industry, social shifts), the **Public itself changes shape.**

  If the Public changes, the "State" (which is just the organization of that Public) must change to match it. If you keep the old State structure for a new Public, the State becomes a ghost. It exists formally, but it no longer performs its function (caring for the consequences).

  So, "rediscovering the State" means:
  1.  **Identifying the new Public:** Who is being affected by these new consequences? (e.g., AI, climate change, gig economy).
  2.  **Re-constituting the Officers:** How do we organize officials to actually represent *that* specific public?

  It is not just "reform" (tweaking the existing machine); it is often recognizing that the machine was built for a different task entirely. This is why he says history must end before we can name the "best" state. As long as human action creates *new* consequences, the Public is never finished forming, so the State is never finished being built.

  ### 3. Is this Experimentalism or a Dodge?
  This passage is the political application of Dewey's **Theory of Inquiry** (later formalized in *Logic: The Theory of Inquiry*).

  In Dewey's epistemology, knowledge is not a mirror of reality; it is a tool for resolving indeterminate situations.
  *   **The Groupmate's Objection:** "If truth is provisional, then nothing is truly better than anything else." (Relativism).
  *   **Dewey's Response:** "If truth is provisional, then we must test ideas against consequences to see if they resolve the problem." (Experimentalism).

  Does the passage hold together? **Yes.**
  If politics is a form of inquiry, then a "good state" is one that facilitates inquiry into its own consequences.
  *   A "bad state" is one that assumes it has the final answer (dogmatism) and ignores new consequences (leading to crisis/revolution).
  *   A "good state" admits it is experimental. It sets up mechanisms to detect new consequences (a free press, scientific bureaus, open elections) and adjust.

  The "criterion" is not empty because it provides a **direction of growth**. We can objectively say a state that ignores the consequences of industrial pollution is "worse" than one that regulates it, because the former fails the criterion (officers are not caring for public interests). We don't need a "Best State" blueprint to make that judgment. We just need to look at the consequences.

  ### How to Frame This for Your Group
  If I were in your reading group, I would suggest framing the discussion around the **"Eclipse of the Public."**

  This passage in Chapter 1 sets up the problem for the rest of the book. Dewey argues that in the modern era (the Machine Age), the consequences of action have become so vast and complex that the Public *cannot* perceive them.
  *   Because the Public can't see the consequences, it can't organize itself.
  *   Because it can't organize itself, the State is captured by private interests.
  *   Therefore, the State appears "bad" not because we lack the right *rules* (Constitutions, laws), but because we lack the *knowledge* to identify the Public.

  **To answer your groupmate directly:**
  Tell them Dewey isn't saying "anything goes." He is saying **"context determines validity."**
  *   **The Criterion:** Does the government successfully identify and manage the indirect consequences of our shared actions?
  *   **The Rule:** (Rejected) A specific set of institutions that claims to work everywhere forever.

  The theory isn't empty; it's **situational**. It demands *more* work from citizens, not less. It demands we constantly investigate how our actions affect others, rather than assuming the "State" is a finished object we can just leave on autopilot.

  **Summary for your notes:**
  1.  **Criterion = Functional Success** (Did we manage the consequences?), **Rule = Structural Dogma** (Did we follow the blueprint?).
  2.  **Rediscovery = Ontological Necessity.** New technologies/actions create new Publics; old States cannot house new Publics.
  3.  **Not Relativism.** We can judge states as better/worse based on their functional success in the present context, even if we can't name an eternal "Best State."

  This is Dewey at his most radical: Democracy isn't a system of government; it's a mode of associated living that requires constant, intelligent reconstruction.
