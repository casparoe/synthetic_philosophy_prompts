      *   *Make sure to mention "The Great Community".* This passage sets up the rest of the book. The problem is the public is currently "in eclipse."

  9.  **Final Polish:** Check against the specific questions asked in the prompt. (Criterion vs. Rule, Rediscovery meaning, Experimentalist coherence). *Looks good.*

