      *   Attack the "Science/Art as Play" premise.
      *   Expose the "Youth" concept as the Trojan Horse.
      *   Show how "Youth" reinstates teleology (purpose).
      *   Conclude on the implications for the retired attorney.

      *Let's refine the "Youth" argument.* Schlick says meaning belongs to youth. Why? Because that's when we play. But if the "play" of a scientist is actually "research," research is hard. It aims at truth. That's a purpose. If Schlick calls this "Youth," he is saying "The time of life where we pursue difficult purposes for our own satisfaction is Meaningful." But that sounds like "Work for internal reward." He tries to ban "Work" (purpose), but "Youth" forces him to accept "Purpose" (becoming who you are) as long as it feels like "Play." The maneuver allows him to keep the *discipline* of work while claiming the *freedom* of play.

