answer: |-
  **Setting:** *A sterile white room. Omega, a vast and silent interface, hovers in the center. A coin lies on the floor, showing tails. Omega has just finished explaining the scenario: had the coin landed heads, you would have received $10,000 if and only if Omega predicted you would pay $100 now that it has landed tails. Omega is waiting for the $100. Two figures stand side-by-side, wallets open. One is **Causal**, a proponent of Causal Decision Theory. The other is **Updateless**, a proponent of Updateless Decision Theory. They turn to each other before handing over (or withholding) the money.*

  **Causal:** Don't do it. Look at the coin. It is tails. The $10,000 exists only in a branch of reality that has been pruned. If you hand over that hundred dollars, you are literally burning it. There is no causal mechanism by which your action now reaches back in time to flip the coin, nor does it reach sideways to a world that isn't actual.

  **Updateless:** I know the coin is tails. I'm not blind. But I'm not making a decision for *this* instance of me in isolation. I'm executing a policy. Before the coin was flipped, the optimal policy was "pay if tails." That policy has an expected value of $9,900. The policy "refuse if tails" has an expected value of zero. I am binding myself to the high-EV policy.

  **Causal:** But you aren't binding yourself. The time for binding has passed. If you could have signed a contract yesterday, enforced by a third party, sure. Sign it. But today? You are just choosing between losing $100 and losing nothing. You're talking about "policies" as if they have metaphysical weight. They don't. Only actions have consequences, and the only consequence available here is a lighter wallet.

  **Updateless:** You're treating the decision as an event in time, rather than a logical output. Omega didn't predict *this moment*; Omega predicted my decision function. My decision function is the same in the heads world as it is in the tails world. If I output "refuse" here, I am logically implying that my function outputs "refuse" in the counterfactual heads world. I am thereby ensuring that, in the worlds where I could have won, I lose. I am controlling the payout in the heads world by my action in the tails world, via logical correlation, not causal force.

  **Causal:** Logical correlation isn't causation. That "you" in the heads world is a simulation, a prediction. He isn't you. He doesn't feel the sting of losing $100. You do. Why should the actual, suffering agent sacrifice for the benefit of a phantom? That's not rationality; that's altruism toward a ghost. Rationality is about winning in the world you actually occupy.

  **Updateless:** And I say rationality is about being the *kind of agent* that wins. If you define "winning" only after you know where you are, you guarantee you'll never be the kind of agent that gets the big payouts in these predictor problems. You're slicing the timeline. You say, "Once I know I'm in the losing branch, I cut my losses." But Omega knows you do that. So Omega never puts you in the winning branch. You are systematically leaving money on the table because you refuse to acknowledge that your current choice reveals your source code.

  **Causal:** Let's talk about that source code. Suppose, before the coin flip, I had the chance to self-modify. I could have rewired my brain to be a UDT agent, to pay automatically. Would I do it? Yes. Absolutely. It maximizes ex-ante expected utility. I would happily pay a small fee to become the kind of agent that gets mugged successfully. But here is the crux: once I have *not* modified, once I am standing here as a CDT agent, the rational move is to refuse.

  **Updateless:** That's a contradiction. If it's rational to become the payer, it's rational to pay.

  **Causal:** No. It's rational to *be* the payer, but it's not rational to *pay* once the incentives have shifted. This is time inconsistency, yes. But it's not irrational. It's simply that my preferences change as my information updates. Ex-ante, I want to pay. Ex-post, I want to keep my money. Why should the ex-ante self have veto power over the ex-post self? The ex-post self is the one who actually exists. The ex-ante self is just a memory.

  **Updateless:** Because if the ex-post self always vetoes the ex-ante self, the ex-ante self never gets anything. You're describing an agent that is dynamically inconsistent. You admit you would pay to modify yourself to stop reasoning the way you are reasoning right now. That is an admission that your current reasoning process is defective. You are identifying a bug in your own cognition—the bug being "ignore ex-ante optimality upon updating"—and refusing to patch it because you claim the patching window is closed.

  **Causal:** It's not a bug; it's a feature of agency in time. We are temporal beings. We make decisions *now*. To act "updatelessly" is to pretend you don't know what you know. It requires a kind of epistemic self-lobotomy. You are asking me to ignore the fact that the coin is tails. You are asking me to make a decision based on a probability distribution that I know is no longer true. That violates the basic principle of using all available evidence.

  **Updateless:** I am not ignoring the evidence. I am conditioning my action on the prior, not the posterior. I know it's tails. But I ask: "What policy, if adopted before I knew it was tails, yields the best result?" And I execute that. You say I'm lobotomizing myself. I say you are myopic. You see the tree (the tails outcome) so clearly you refuse to acknowledge the forest (the decision problem structure). If you value the ex-ante perspective enough to self-modify, you must value it enough to act. If you don't, then your claim that you "would self-modify" is just cheap talk.

  **Causal:** It's not cheap talk. It's a counterfactual claim about a different decision node. Look, imagine a different case. A predictor says, "I will give you $100 unless I predict you will take this pill that makes you lose $1,000." You take the pill. Now you have it in your hand. Do you swallow it? No. Even if taking it earlier would have gotten you the $100. Once you have the pill, swallowing it is dominated. Why is the mugging different?

  **Updateless:** Because in your pill case, the payout depends on your action *before* the prediction. In the mugging, the payout depends on your *disposition* in the counterfactual. In the pill case, taking the pill causes the loss. In the mugging, paying doesn't cause the loss—the coin flip did. Paying is the price of admission for the disposition that wins the $10,000. You are conflating the cost of the ticket with the loss of the bet.

  **Causal:** I'm conflating nothing. The $10,000 is gone. It is physically impossible for me to receive it. The $100 is here. It is physically possible for me to keep it. You are sacrificing the certain for the impossible based on a principle of "logical control" over non-existent worlds. I locate the crux here: You believe rationality is about selecting the best *map* of decision-problems across all possible worlds. I believe rationality is about navigating the *territory* of the actual world.

  **Updateless:** And I locate the crux here: You believe an agent is a momentary slice of consciousness bound by causal arrows. I believe an agent is a timeless algorithm, and rationality is the optimization of that algorithm's output across the logical prior. You think you're saving $100. I think you're proving you're the kind of agent who doesn't get $10,000.

  **Causal:** Then I will be a rich agent in the actual world, and a poor agent in your counterfactuals.

  **Updateless:** And I will be a poor agent in the actual world, but the kind of agent who *owns* the actual world, rather than just inhabiting it.

  *They turn back to Omega. Causal closes his wallet. Updateless counts out four bills.*
