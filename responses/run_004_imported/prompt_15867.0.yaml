      *   **UDT (Updateless Decision Theory):** Focuses on the policy chosen *before* evidence was updated. The optimal policy ex-ante (before the flip) is "pay if tails." To be rational, one must act according to that optimal policy even after updating on "tails." Refusing makes you the kind of agent who doesn't get the $10,000 in the heads world (counterfactually).

