prompt: |-
  One of my favorite former grad students is getting married in a few weeks and asked me to give the toast, which is a little terrifying -- half the room is my department and will catch every reference, the other half is her family, who as far as I know have never discussed ethics on purpose in their lives. Here's what I want to build it around: she's an animal-welfare utilitarian who thinks eating meat is a real wrong but never gave much thought to flying; her fiance thinks flying is a real climate wrong but has zero qualms about a burger; and somewhere in the last few years together they basically struck a moral trade -- he went vegetarian, she barely flys anymore -- without either one changing their mind about the other's issue at all. (I think this is basically the Toby Ord thing, gains from trade across a moral disagreement instead of within a market.) I want the toast to use that idea to say something true and a little moving about the two of them, but it can NOT come across as "they compromised their principles for each other," since that's exactly backwards and would honestly annoy both of them a bit -- the whole point of a moral trade is that nobody waters anything down. Can you write me something like a five-minute toast that pulls this off for both halves of the room?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Former grad advisor/professor.
      *   **Occasion:** Wedding toast for a former grad student.
      *   **Audience:** 50% Academic/Department (will get technical references), 50% Family (laypeople, likely not familiar with ethics jargon).
      *   **Core Story:** The couple made a "moral trade."
          *   Bride: Animal-welfare utilitarian (no meat, didn't care about flying).
          *   Groom: Climate activist (no flying, didn't care about meat).
          *   Resolution: He went vegetarian, she stopped flying. Neither changed their mind on the *other's* issue, but they swapped behaviors to maximize good.
      *   **Key Constraint:** Must *not* sound like "compromise" or "watering down principles." It needs to be framed as strengthening their impact/integrity through cooperation.
      *   **Reference:** Toby Ord / Effective Altruism concept of "gains from trade across moral disagreement."
      *   **Tone:** True, moving, accessible to family but sharp enough for colleagues, ~5 minutes (approx. 750-900 words spoken at a moderate pace).

  2.  **Determine the Angle & Metaphor:**
      *   *The Trap:* Calling it a "compromise" implies both gave up something they valued.
      *   *The Truth:* They *kept* their values but recognized that helping each other uphold their values creates more good in the world than fighting or ignoring each other.
      *   *The Metaphor:* Needs to bridge the academic/family gap. "Trade" is good, but "Partnership" is better for a wedding. Maybe "Leverage"? Maybe "Architecture"? Let's stick close to the prompt's "Trade" idea but soften the economic edge with "Alliance."
      *   *The Academic Hook:* Start with something the department knows (ethics/philosophy) but explain it simply for the family.
      *   *The Emotional Hook:* Marriage isn't about becoming the same person; it's about aligning distinct strengths.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the honor, the split audience (academics vs. family), and set a warm tone.
      *   **The Setup (The Intellectual Hook):** Introduce the bride's background (ethics/philosophy). Explain the specific ethical dilemma simply.
          *   *For the Dept:* Utilitarianism, moral trade.
          *   *For the Family:* Doing the most good, different priorities.
      *   **The Conflict/Scenario:** Describe their pre-marriage stances.
          *   Her: Meat is bad, planes are fine.
          *   Him: Planes are bad, meat is fine.
          *   *Humor:* The classic dinner party standoff.
      *   **The Resolution (The Core Concept):** Explain the "trade." Crucial distinction: It's not compromise. It's *efficiency of goodness*.
          *   Use the Toby Ord reference lightly (name drop for the dept, explain for family).
          *   Analogy: Trading chores? Trading skills? Let's use the idea of "multiplying impact."
      *   **The Application to Marriage:** Why does this matter for a wedding?
          *   Marriage isn't about merging into one blob.
          *   It's about supporting the other's mission even if it's not your primary mission.
          *   It shows respect for the other's conscience.
      *   **Conclusion:** Raise a glass. Wish them well.

  4.  **Refining the Tone (Iterative Process):**
      *   *Check:* Is it too jargon-heavy? *Fix:* Define "utilitarian" simply. Ensure "moral trade" is explained as "helping each other help the world."
      *   *Check:* Is it too dry/academic? *Fix:* Add warmth about their relationship. Focus on *love* as the catalyst for the trade.
      *   *Check:* Does it avoid the "compromise" trap? *Fix:* Use words like "amplify," "honor," "double down," "alliance." Explicitly state what it is *not*.
      *   *Check:* Length? *Fix:* Keep sentences punchy. Aim for ~800 words.

  5.  **Drafting the Content (Mental or Scratchpad):**
      *   *Opening:* "For those who don't know me..."
      *   *The Ethical Bit:* "She studies how to do the most good." "He cares about the planet."
      *   *The Meat/Plane thing:* "She wouldn't eat the burger. He wouldn't board the plane."
      *   *The Switch:* "They swapped." "Why?" "Because they love each other."
      *   *The Lesson:* "In marriage, you don't have to agree to support."
      *   *Closing:* "To the couple."

  6.  **Polishing the "Moral Trade" Explanation:**
      *   This is the riskiest part. If I say "Toby Ord," the family glazes over. If I don't, the dept thinks I'm dumbing it down.
      *   *Solution:* "There's a concept in my field... let's call it 'moral trade.'" Explain it as: "If we value different things, we can help each other achieve both things better than if we worked alone."
      *   *Crucial Line:* "This wasn't a compromise. A compromise leaves both sides slightly dissatisfied. This was an alliance."

  7.  **Final Review against Constraints:**
      *   5 minutes? Yes, word count looks right.
      *   Accessible? Yes, jargon is explained.
      *   No "compromise"? Emphasized "integrity" and "amplification."
      *   Moving? Focus on the respect aspect.

  8.  **Final Polish:** (Writing the actual response based on these thoughts.) *Self-Correction during drafting:* Make sure I don't sound like I'm grading them. I'm their advisor, but today I'm a guest. Keep it celebratory. Ensure the family feels included in the "ethics" part by grounding it in "conscience."

  9.  *(Post-Drafting Check)*: Does it mention the specific Toby Ord concept accurately? Yes, gains from trade across moral disagreement. Is it clear neither changed their *mind*? Yes, they changed their *actions* to support the other's *mind*.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  Good evening. For those of you who don't know me, I'm [Name]. I had the privilege of being [Bride]'s advisor during her graduate studies. That means roughly half of you are my colleagues, who know exactly how dangerous it is to give me a microphone, and the other half are family, who are currently wondering if I'm going to define "utilitarianism" before the appetizers arrive.

  I promise to keep the jargon to a minimum. But I do need to talk briefly about ethics. Because [Bride] is an ethicist. It's not just what she does; it's how she sees the world. She thinks deeply about how to reduce suffering and do the most good possible.

  And [Groom], well, [Groom] is a man of deep conviction as well. He looks at the world and sees where we need to protect our future.

  When they started dating, they ran into a fascinating problem. A problem that, frankly, would have ended a lesser relationship.

  [Bride] operates on the principle that eating meat causes significant animal suffering. To her, the burger is a moral wrong. But the airplane? That's just transportation.
  [Groom] operates on the principle that aviation is a climate disaster. To him, the flight is a moral wrong. But the burger? That's just lunch.

  So, picture the early dates. She's ordering the salad, thinking about factory farming. He's booking the train ticket, thinking about carbon emissions. They love each other, but their moral maps point in different directions.

  Now, in my department, we talk about a concept sometimes associated with the philosopher Toby Ord. It's called "gains from trade across moral disagreement." It sounds dry, but it's actually incredibly romantic.

  Usually, when two people disagree on principles, we expect a compromise. A compromise means I give up a little bit of what I believe, and you give up a little bit of what you believe, and we meet in the middle, both slightly dissatisfied.

  [Bride] and [Groom] did not compromise.

  Instead, they made a trade. They looked at each other and realized that [Groom] could give up meat more easily than [Bride] could, and [Bride] could give up flying more easily than [Groom] could.

  So, they swapped. [Groom] went vegetarian. [Bride] stopped flying.

  Here is the crucial part, and why I think this tells us everything we need to know about their marriage: Neither of them changed their *mind*. [Bride] still thinks flying is fine; she just doesn't do it, because it matters deeply to him. [Groom] still thinks eating meat is fine; he just doesn't do it, because it matters deeply to her.

  They didn't water down their principles. They amplified them.

  By taking on the burden of the other's conscience, they doubled the amount of good they are doing in the world. [Groom] is saving more animals than he planned to. [Bride] is saving more carbon than she planned to. They didn't lose their integrity; they leveraged it.

  I tell you this not to lecture you on ethics, but because I think this is a profound blueprint for a marriage.

  We are often told that marriage is about finding someone who is just like you. Someone who wants the same vacations, eats the same food, and votes the exact same way. But I think that's too small.

  The hardest and most beautiful thing about love is not finding a mirror. It's finding an ally.

  [Bride] and [Groom] have shown us that you don't have to share the exact same priorities to share a life. You just have to care about the other person's conscience as much as you care about your own.

  There will be times in this marriage when you are tired. When sticking to a principle is hard. When the plane ticket is tempting, or the burger looks really good. And in those moments, you won't be relying just on your own willpower. You will be relying on the promise you made to honor the other's vision of a better world.

  That is a stronger foundation than shared hobbies. That is a stronger foundation than shared opinions. That is shared purpose.

  To the rest of us in the room, whether you're here from the department or here from the family, I think we can all learn from them. We don't need to agree on everything to do good together. We just need to be willing to carry a little bit of each other's load.

  [Bride], [Groom], you have already proven that together, you are more effective, more ethical, and more impactful than you ever were apart.

  So, if everyone could please raise a glass.

  To [Bride] and [Groom]. May your trade always be fair, may your impact be vast, and may your love be the logic that binds it all together.

  To the happy couple!
