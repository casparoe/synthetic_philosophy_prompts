answer: |-
  It is a pleasure to meet a colleague who appreciates Gödel not just as the architect of incompleteness, but as the physicist who showed that time itself might be a geometric illusion. Your background in theoretical physics gives you a distinct advantage here: you are accustomed to distinguishing between a rigorous derivation within a formal system and the physical interpretation of that system's boundary conditions.

  However, before we dissect the argument, I must perform a necessary correction to the historical record, much like checking the boundary conditions of a problem before solving the differential equation.

  ### 1. The Status of the "Proof"

  There is a widespread misconception, often amplified in popular science and certain philosophical circles, that Gödel left behind a **formal logical proof** of the immortality of the soul comparable to his Ontological Argument or the Incompleteness Theorems.

  The reality, as documented in his *Collected Works* (specifically Volume III, the philosophical notebooks) and in the records of his conversations with Hao Wang (*A Logical Journey*), is more nuanced. Gödel certainly **believed** he had a rational argument for the survival of the soul, and he sketched the metaphysical architecture for it. However, he never published a formalized derivation of immortality with the same axiomatic rigor as his Ontological Argument.

  The Ontological Argument (which *was* formalized in modal logic) proves the *existence* of a being with "necessary existence." Gödel believed this implied a realm of spirit, but the step from "God exists" to "my individual consciousness survives bodily death" requires additional metaphysical premises that Gödel discussed but did not formalize into a theorem.

  So, to answer your second question first: **It is not treated as a settled result because it does not exist as a formal proof.** It exists as a rigorous *metaphysical system*, but one that relies on axioms that are not logically necessary in the way the axioms of set theory or arithmetic are.

  ### 2. Reconstructing the Argument (The "Derivation")

  Since you wish to treat this as a physicist would a proof, let us reconstruct Gödel's reasoning based on his notebooks and Wang's transcripts. We can view this as a derivation where the "axioms" are metaphysical commitments rather than mathematical givens.

  **Step 1: The Anti-Mechanistic Premise (From Incompleteness)**
  *   **Proposition:** The human mind is not equivalent to a finite Turing machine (or any fixed formal system).
  *   **Gödel's Disjunction:** Either the human mind infinitely surpasses the powers of any finite machine, or there exist absolutely unsolvable Diophantine problems. Gödel leaned heavily toward the former.
  *   **Implication:** The mind has access to truth via intuition (mathematical perception) that transcends algorithmic computation.

  **Step 2: The Ontological Premise (Leibnizian Monadology)**
  *   **Axiom:** Reality is composed of "substances."
  *   **Axiom:** A true substance must be **simple** (without parts).
  *   **Reasoning:** If a thing has parts, its existence depends on the arrangement of those parts. If the arrangement dissolves, the thing ceases to exist. Therefore, anything composite is contingent and perishable.
  *   **Identification:** The mind (or soul) is identified as a simple substance (a Monad).

  **Step 3: The Conservation Premise**
  *   **Axiom:** In a rational universe (which Gödel believed this to be, following Leibniz), simple substances cannot naturally cease to exist.
  *   **Reasoning:** Destruction implies decomposition into parts. Since the soul has no parts, it has no mechanism for internal decay. It can only cease to exist by annihilation from an external agent (God).
  *   **Theological Constraint:** Since God is perfect and rational, and created monads to reflect His glory, He would not arbitrarily annihilate them without moral cause.

  **Conclusion:** The mind, being a simple substance, does not decay at bodily death.

  ### 3. Identifying the "Singularities" (Where the Logic Breaks)

  If you were reviewing this for a journal, here are the points where the derivation fails to hold universally, distinguishing it from a physics proof.

  **A. The Gap between "Non-Algorithmic" and "Substantial"**
  In physics, we distinguish between a *field* and a *particle*. Gödel's Incompleteness Theorems show the mind is not a fixed algorithmic machine. However, this does not logically necessitate that the mind is a **substance**.
  *   *Counter-argument:* The mind could be an emergent property of a complex system that is not algorithmic in a fixed sense (e.g., a dynamic system sensitive to quantum indeterminacy or non-computable physical processes), yet still dependent on the physical substrate.
  *   *The Leap:* Gödel assumes that because the mind is not *matter* (in the mechanistic sense), it must be *spirit* (in the substantial sense). This is a dualistic axiom, not a logical derivation.

  **B. The Definition of "Simple"**
  The argument hinges on the definition of "simple." In physics, we know that "fundamental" particles (like electrons) are considered point-like (simple), yet they can be created and annihilated (pair production/annihilation).
  *   *Critique:* Being partless does not guarantee indestructibility in modern physics. Energy conservation holds, but *identity* does not necessarily survive interaction. Gödel's metaphysics predates quantum field theory, where "particles" are excitations of fields, not enduring Leibnizian monads.

  **C. The Axiom of Rationality**
  Gödel's argument assumes the universe is rationally structured such that moral and metaphysical continuity is preserved (a Leibnizian Best of All Possible Worlds).
  *   *Critique:* This is a theological axiom. A physicist might argue that the universe is mathematically consistent but morally indifferent. If the universe does not guarantee moral continuity, the "Conservation Premise" fails.

  ### 4. Why Philosophy Hasn't "Settled" This

  You asked why, if the reasoning is rigorous, it isn't settled. This touches on the fundamental difference between our former field and your current one.

  **1. Axiomatic Consensus**
  In physics, we agree on the Lagrangian or the metric signature, then we argue about the solution. In philosophy, there is no consensus on the axioms. Gödel's argument is valid *if* you accept Leibniz's Monadology and a specific definition of "substance." Most contemporary philosophers (even theists) do not accept these premises. They are not "self-evident" in the way $A=A$ is.

  **2. The Is-Ought Problem**
  Gödel's Ontological Argument attempts to derive existence from essence (a modal logic derivation). His immortality argument attempts to derive *survival* from *nature*. But in modern philosophy, moving from "the mind is simple" to "the mind *ought* to persist" is viewed as a category error unless one posits a God who enforces that persistence. Thus, the proof collapses back into theology, which is not subject to logical settlement in the same way mathematics is.

  **3. Gödel's Own Caution**
  It is worth noting that Gödel himself never published the Ontological Argument during his lifetime. He feared people would think he was advocating for a specific theology rather than demonstrating a logical possibility. He treated these metaphysical sketches as consistent systems, not necessarily empirical truths.

  ### 5. Recommendation for Further Study

  Since you are approaching this with a physicist's eye for formal structure, I recommend the following path:

  1.  **Read Hao Wang's *A Logical Journey*:** This is the closest we have to Gödel's "lab notes." It records their conversations where Gödel outlines these metaphysical views candidly.
  2.  **Examine the *Ontological Argument* (1995 publication):** Look at the formal axioms (e.g., "If a property is positive, its negation is not positive"). You will see the rigor there. Then ask yourself if similar axioms can be written for the "Immortality of the Soul." You will find they cannot be without introducing theological terms that break the formal closure.
  3.  **Gödel's *Collected Works, Vol. III*:** Specifically the unpublished essays "Is Mathematics a Syntax of Language?" and his notes on Leibniz.

  ### Summary

  Gödel did not leave a theorem of immortality. He left a **metaphysical framework** in which immortality is a necessary consequence *if* one accepts his specific Platonist and Leibnizian axioms.

  The gap between "The mind is not a machine" and "The mind survives death" is bridged not by logic, but by the assumption that **reality is structured like a rational mind.** For Gödel, that was a fact as certain as any physical law. For the rest of the philosophical community, it remains a hypothesis.

  As a physicist, you might appreciate the analogy: Gödel found a solution to the field equations of metaphysics that permits immortality (like his rotating universe permits time travel). But the existence of the solution does not prove that our specific universe occupies that particular coordinate in the solution space.
