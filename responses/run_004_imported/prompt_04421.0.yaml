          *   *The "As If" Objection:* Searle's Chinese Room is the obvious descendant, but Brentano predates it. Brentano would focus on the lack of *inner presentation*.
          *   *Superposition:* This is interesting. Superposition makes the "feature" less like a discrete symbol and more like a physical wave. Brentano might see this as *more* physical and *less* mental.
