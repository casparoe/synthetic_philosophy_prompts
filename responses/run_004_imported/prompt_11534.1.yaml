prompt: |-
  So we had student council today and I'm still kind of annoyed about it, figured I'd write it out instead of just complaining to my friends lol. I'm the sophomore class rep and our school's letting us hold an actual student vote on whether to switch from our normal 7 period day to a block schedule (4 longer classes) starting next year, instead of admin just deciding it top-down, which sounds nice in theory except literally nobody agrees on who should even get to vote in it. The senior class president thinks current seniors shouldn't have to bother voting since they'll already be graduated before it ever takes effect, but then half the senior class still wants a vote anyway because they've "been here the longest" and feel like they've earned a say regardless. Meanwhile the 8th graders coming in as freshman next year, aka the literal first class that has to live with this thing for all 4 years, don't get a vote at all right now since they're not technically enrolled yet, which feels backwards to me. And then theres our vocational-program kids who are only physically at our school for like 2 classes a day since they spend the rest at the tech center across town, and a couple council members think their vote should count for less since the new schedule effects them less than it does everyone else.

  Could you actually write this up like a memo I could read out at our meeting Tuesday, like something with a real recommendation and the reasoning behind it, not just "here's 3 options, you pick"? I want it to defend an actual rule for who counts as a legit voter here that we could just reuse, because I already know this exact fight is gonna happen again with prom or the dress code or whatever comes up next. Also please don't dodge the "why should people who won't even be here for it get a vote" argument, since that's honestly the strongest card the senior class president has and I don't want us to just wave it away.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Sophomore Class Rep on Student Council.
      *   **Context:** School is voting on switching from a 7-period day to a block schedule (4 longer classes) starting next year.
      *   **Problem:** Disagreement on *who* gets to vote.
          *   Seniors: Some say they shouldn't vote (graduating before implementation), others say they should (tenure/earned say).
          *   Incoming Freshmen (current 8th graders): Most affected (4 years), but not enrolled yet (no vote).
          *   Vocational/Tech Students: Part-time on campus, some say their vote should count less.
      *   **Goal:** A memo to read at the Tuesday meeting.
      *   **Requirements:**
          *   Must make a *specific recommendation* (not just options).
          *   Must establish a *precedent/rule* for future votes (prom, dress code, etc.).
          *   Must directly address the "Seniors won't be here" argument (don't dodge it).
          *   Tone: Professional but persuasive, suitable for a student council setting.

  2.  **Determine the Core Principle:**
      *   To resolve the conflicts, I need a guiding principle for voting eligibility.
      *   *Option A: Stakeholder Impact.* Who is most affected? (Favors incoming freshmen, disfavors seniors).
      *   *Option B: Current Enrollment.* Who is currently a student? (Favors seniors, disfavors incoming freshmen).
      *   *Option C: Hybrid/Representation.* Acknowledge impact but respect current governance structures.
      *   *Decision:* The strongest democratic principle for a *school policy* change is "Current Enrollment + Significant Impact." However, since incoming freshmen aren't enrolled, they can't technically vote in a *student* election. But seniors *are* enrolled.
      *   *Wait, looking closer at the prompt:* The user wants a rule that can be *reused*.
      *   *The "Senior" Argument:* "Why vote on something you won't experience?" Counter-argument: "School culture is legacy-based. You built this school."
      *   *The "Incoming Freshman" Argument:* "They live with it longest." Counter-argument: "They aren't students yet. How do we administer a vote to non-students?"
      *   *The "Vo-Tech" Argument:* "They are here less." Counter-argument: "Equal representation per student is a democratic baseline. Diluting votes is dangerous."
      *   *Proposed Stance:* **All currently enrolled students get one equal vote.** Incoming 8th graders get a *survey* or *feedback session* but not a binding vote (logistical nightmare to include non-students). Seniors get to vote because they are current members of the community, even if they leave soon (precedent for future votes like budget allocation, etc.). Vo-Tech students get full votes (equal representation).
      *   *Refining the Stance:* Actually, the prompt asks to defend a rule for *who counts as a legit voter*. If I exclude the 8th graders, the user said it "feels backwards." If I include them, it's logistically hard.
      *   *Better Approach:* Let's pivot. The vote is about *school policy*. The electorate should be the *current student body*. Why? Because the Student Council represents *current* students. However, to address the 8th-grade concern, we recommend an *advisory* component for them. To address the Senior concern, we emphasize *citizenship* over *consumption*. To address Vo-Tech, we emphasize *equality*.
      *   *Wait, let's look for a stronger principled stand.* The user wants to stop this fight from happening again. The rule needs to be: **"Voting rights are tied to current enrollment status, not projected impact."**
      *   *Why?* Because "impact" is subjective and hard to measure. "Enrollment" is binary and clear.
      *   *But how to handle the Seniors?* Acknowledge the "won't be here" point but reframe it: They are current stakeholders.
      *   *How to handle 8th Graders?* They aren't students yet. But we can advocate for their input via a different channel (survey).
      *   *How to handle Vo-Tech?* Full votes. Diluting votes based on attendance is discriminatory.

      *   *Alternative Idea:* What if the recommendation *does* include the 8th graders? Some schools do "feeder middle school" surveys. But for a binding vote? Risky.
      *   *Let's stick to the strongest democratic precedent:* **One Student, One Vote (for currently enrolled students).**
      *   *Wait, I need to make sure I don't dodge the Senior argument.* I need to explain *why* they vote despite leaving.
      *   *Reasoning:* School governance is about the community *now*. If we exclude seniors, do we exclude them from *all* end-of-year decisions? That sets a bad precedent.
      *   *What about the 8th graders?* The memo should recommend a *non-binding* feedback mechanism for them, while keeping the *binding* vote to enrolled students. This balances the "backwards" feeling with logistical reality.
      *   *What about Vo-Tech?* Explicitly state their votes count equally.

  3.  **Drafting - Section by Section:**
      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the importance of the decision and the confusion around the process.
      *   **The Proposal:** Clearly state the recommended voting eligibility rule.
      *   **Rationale 1: Current Enrollment (The Senior Issue).** Address the "they won't be here" argument directly. Reframe it as "stewardship" and "precedent."
      *   **Rationale 2: Equal Weight (The Vo-Tech Issue).** Address the "part-time" argument. Democracy doesn't dilute votes based on usage.
      *   **Rationale 3: Future Stakeholders (The 8th Grade Issue).** Acknowledge they are most affected. Propose an advisory survey since they can't legally/officially vote as non-students.
      *   **Conclusion:** Call to action. Adopt this as the standard bylaw for future votes.

  4.  **Refining the Tone:**
      *   Needs to sound like a responsible Sophomore Rep. Not too bureaucratic, but firm.
      *   Avoid "I feel." Use "We need."
      *   Ensure the "Senior" argument is tackled head-on as requested.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is excluding 8th graders from the *binding* vote too weak?
      *   *Fix:* Frame it as "We cannot grant binding voting rights to non-enrolled individuals, but we must ensure their voice is heard." This shows empathy without breaking protocol.
      *   *Critique:* Did I address the "precedent" aspect?
      *   *Fix:* Explicitly mention that this rule applies to Prom, Dress Code, etc., in the conclusion.
      *   *Critique:* Did I dodge the Senior argument?
      *   *Fix:* Make sure the section on Seniors explicitly says "I know the argument is X, but here is why Y is better."

  6.  **Final Polish:** Check formatting and clarity. (The resulting memo follows this structure.)

      *(Self-Correction on the Senior Argument)*: The prompt says "don't dodge the 'why should people who won't even be here for it get a vote' argument." I need to make sure I don't just say "because they are students." I need to explain the *philosophical* reason.
      *   *Reasoning:* Governance is about the health of the institution *during* your tenure. Seniors are still part of the community. Also, if we exclude them based on "future impact," where do we draw the line? Juniors transferring? It creates a slippery slope.
      *   *Better Reasoning:* Legacy. They helped build the culture that the new schedule will inhabit.

      *(Self-Correction on Vo-Tech)*: "Vote should count for less." This is dangerous territory. Need to emphasize "One Person, One Vote."

      *(Self-Correction on 8th Graders)*: The user thinks it feels backwards they don't vote. I should validate that feeling but explain the logistical boundary.

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** Student Council Executive Board & Class Representatives
  **FROM:** [Your Name], Sophomore Class Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Proposal for Standardized Voting Eligibility & Upcoming Schedule Vote

  **Purpose**
  As we prepare for the vote on transitioning to a block schedule, it has become clear that we lack a defined policy on *who* constitutes a legitimate voter. Without a clear standard, we risk invalidating this vote and setting a confusing precedent for future decisions regarding prom, dress code, or budget allocations.

  This memo outlines a recommended voting eligibility framework to be adopted immediately for the schedule vote and codified for all future Student Council referendums.

  **Recommendation**
  I propose we adopt the **"Current Enrollment, Equal Weight"** standard.

  1.  **Eligibility:** Any student currently enrolled in grades 9–12 is eligible to cast a binding vote.
  2.  **Weight:** Every eligible vote counts equally (1 student = 1 vote), regardless of attendance track or program.
  3.  **Incoming Stakeholders:** Current 8th graders will be issued a non-binding advisory survey to be weighed alongside the official vote results.

  **Rationale**

  **1. The Senior Class Argument (Stewardship vs. Consumption)**
  The strongest argument against senior eligibility is that they will not experience the long-term effects of this schedule. While factually true, this frames education as a transaction (I pay time, I get results) rather than a community stewardship.

  Seniors are currently the primary custodians of our school's culture. They navigate the halls, set the social tone, and manage the traditions that any new schedule will have to fit into. If we exclude seniors because "they won't be here," we establish a dangerous precedent where any student can be silenced if their future tenure is perceived as short. What happens next year when we vote on a budget item? Do transfer students lose their vote? Do graduating seniors lose their say on the theme of the final banquet?

  Governance is about the health of the institution *during* your membership. Seniors are members. They deserve a voice in how they leave the school, not just how they experienced it.

  **2. The Vocational/Technical Program Argument (Equal Representation)**
  There has been discussion about weighting the votes of Vo-Tech students lower because they spend half their day off-campus. I strongly advise against this.

  Democratic representation is based on *citizenship*, not *usage*. A student who is on campus for two classes is still a full member of this student body. Diluting votes based on physical presence creates a "second-class citizen" status within our council. If we start measuring "how much school" a student attends to determine their voting power, we open the door to subjective judgments that will fracture the council. Their vote must count 100%.

  **3. The Incoming Freshman Argument (Impact vs. Logistics)**
  It is undeniable that next year's freshmen (current 8th graders) are the most impacted group. It feels wrong to exclude them. However, granting binding voting rights to non-enrolled students creates logistical and legal liabilities we aren't equipped to manage (verification, supervision, etc.).

  To address this without breaking protocol, we will distribute an advisory survey to the middle school feeders. The results of this survey will be published alongside the official vote count. This ensures their voice is recorded and public, pressuring the administration to consider their buy-in, without compromising the integrity of the official student electorate.

  **Conclusion & Next Steps**
  This "Current Enrollment, Equal Weight" rule provides a clear, defensible line that prevents this debate from resurfacing at every meeting. It respects the rights of current members (including seniors and Vo-Tech) while acknowledging the input of future members (8th graders).

  I move that we adopt this eligibility standard for the Block Schedule Vote and amend our Student Council Bylaws to reflect this for future referendums.

  Thank you for your consideration.

  [Your Name]
  Sophomore Class Representative
