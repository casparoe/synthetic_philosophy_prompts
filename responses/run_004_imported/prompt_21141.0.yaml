      *   **Paternalism:** The user is deciding what the friend can handle. It's condescending.
      *   **Inauthenticity:** The relationship becomes based on a false premise. Intimacy requires knowing the real other.
      *   **The "Boy Who Cried Wolf" Effect:** If the user always says "great," their praise loses value.
      *   **Missed Opportunities for Growth:** Constructive criticism (on cooking/singing) helps improvement. False praise stagnates growth.
      *   **Setting Up for Failure:** If the interview goes badly, the crash is harder because expectations were artificially inflated.

