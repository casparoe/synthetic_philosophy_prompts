      *   *Deontology (Kant):* Lying is inherently wrong. It treats the person as a means to an end (their comfort) rather than an end in themselves (respecting their autonomy/truth).
      *   *Virtue Ethics:* What does this habit say about the user's character? Does it foster honesty? Does it foster resilience in the friend?
      *   *Epistemic Ethics:* What is our duty regarding truth and belief?

