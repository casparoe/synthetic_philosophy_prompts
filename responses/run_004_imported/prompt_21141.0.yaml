      *   **Core Behavior:** The user habitually lies to friends/acquaintances to boost their confidence or feelings (e.g., "Everything will go well" before an event, "Your cooking/singing/haircut is wonderful" when it's not).
      *   **Justification:** Utilitarian/Consequentialist reasoning. It helps (calms anxiety, boosts ego), and it seems to cost nothing (no apparent harm).
      *   **Internal Conflict:** The user feels a nagging sense that something is wrong, despite the logical justification.
      *   **Question:** Is this just squeamishness, or is there a genuine philosophical/ethical problem with this reasoning?

