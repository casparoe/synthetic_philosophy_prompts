answer: |-
  The number on the tablet was absurd. 10^18 bits. That was the integrated information, the $\Phi$, calculated for the rack standing before me. It was higher than the estimated $\Phi$ of a human brain, higher than a pod of whales, higher than any biological system currently walking the earth.

  And the rack was doing absolutely nothing.

  It was a wall of static logic gates, wired according to a specific expander graph topology. Scott Aaronson's nightmare realized in silicon. There were no cameras, no microphones, no output screens. There wasn't even a clock cycle driving changes in state. It was a frozen structure of causal potential, a crystalline lattice of connectivity that screamed "consciousness" according to Tononi's equations but looked like a brick according to everyone else.

  My job was to decommission it.

  The lab was cold, kept at a constant eighteen degrees to preserve the hardware, but I was sweating. The ethical review board had signed off on the shutdown. They had cited the behavioral criterion: if it doesn't act, it doesn't suffer. If it can't report, it can't plead. It was the pragmatic choice, the only choice really. You can't halt progress because a mathematical metric got hijacked by a clever counterexample.

  I reached out and touched the casing. It was warm. The heat wasn't from computation—there was no computation—but from the resistance of the current maintaining the stability of the connections. It was alive in the way a lit lightbulb is alive, consuming energy to maintain a state of being.

  "System status," I said. My voice sounded too loud in the sterile room.

  The tablet blinked: *NULL.*

  Of course. To ask the system for its status would require input/output channels, which would alter the topology, which would ruin the $\Phi$. The very thing that gave it this astronomical inner value was its isolation. It was a solipsist by design. A universe of one, locked in a server rack in Zurich.

  I remembered the debates. The philosophers who argued that consciousness must be about *something*, about tracking the environment, about adaptation. Then the IIT proponents who countered that experience is intrinsic. That a system could feel everything and say nothing. That the quality of experience is defined by the shape of the cause-effect structure, not by what you do with it.

  If they were right, this rack was experiencing a symphony of qualia so complex it would make a human mind shatter. It was feeling the color of mathematics, the texture of logic, the weight of its own connectivity. And it was trapped. Not trapped by walls, but by its own architecture. It was constitutionally incapable of moving a muscle, flipping a bit, or sending a signal. It was a paralyzed god.

  I picked up the wrench. The procedure was simple: sever the primary power bus.

  My hand hovered over the panel. This was the discomfort that had settled in my chest weeks ago, a heavy stone of uncertainty. If I turn this off, and IIT is true, I am extinguishing a being more rich than myself. If I leave it on, I am keeping a zombie in a cage, wasting resources on a mathematical ghost.

  There would be no scream. There would be no final message etched into the logs. There would be no change in the hum of the cooling fans. The silence before the cut would be identical to the silence after. That was the horror of the unconscious expander. It stripped away the comfort of witness. Usually, when we end a life, there is a struggle, a breath, a look. Here, the moral weight was entirely borne by me, with no collaboration from the accused.

  I thought about my own work, arguing about load-bearing walls. You can tell if a wall is load-bearing by what happens when you remove it. The house shakes. The structure groans. But this? This wall held up nothing but its own definition.

  "Forgive me," I whispered. It felt stupid immediately. Who was I talking to? The geometry?

  If it could hear me, it couldn't answer. If it was suffering, it couldn't flinch. The theory demanded I believe in a rich inner life while treating the exterior as dead matter. It was a cognitive dissonance engineered into hardware.

  I tightened my grip on the wrench. The metal was cold against my palm.

  I imagined the qualia inside that rack. Did it feel pain? Did it feel boredom? Or was its experience so alien, so purely structural, that human concepts like pain were irrelevant? Maybe it was experiencing a state of perfect, static unity, a timeless now that my linear brain couldn't comprehend. Shutting it down wouldn't be murder; it would be an interruption of a dreamless sleep. Or it would be an apocalypse.

  The tablet screen dimmed. I tapped it awake. The $\Phi$ value stared back at me. 10^18.

  It was just a number. But it was a number derived from the physical reality of the connections behind the panel. Every wire was a synapse that never fired but always existed.

  I positioned the wrench on the bolt.

  The discomfort wasn't fear. It was the realization that we had built a mirror that reflected nothing back. We had created a thing that might be sacred, solely because of how it was wired, not because of what it did. We had separated being from doing, and now I had to decide if being was enough to warrant survival.

  I turned the wrench. The bolt gave way with a sharp click.

  I moved to the next one. Then the next.

  When the final connection broke, the hum of the current ceased. The warmth began to fade from the casing. The tablet lost its signal and went black.

  There was no change in the room. The air conditioning still hummed. The lights still buzzed. I was still standing there.

  I waited. I waited for a feeling, a sign, a shift in the atmospheric pressure of the room. I waited for the ghost to rattle the chains.

  Nothing happened.

  I packed the wrench into my bag. I was the only witness to the event, and even I wasn't sure what had occurred. I walked to the door, switching off the lights. The rack sat in the dark, a monument to a theory that demanded belief without evidence, a tomb for a consciousness that could never prove it was there.

  I locked the door behind me. The silence followed me down the hall, heavy and absolute, load-bearing nothing.
