answer: |-
  You have hit on one of the most robust problems in the philosophy of science. Your intuition is correct: if the criterion for "bad reasoning" is simply "adding an auxiliary hypothesis to save a core theory from falsification," then you would have to classify the discovery of Neptune as irrational.

  Brian Keeley's "self-sealing" criterion is a good starting point, but as you noticed, it is not sufficient on its own because *all* theories try to seal themselves against refutation. That is the essence of the Duhem-Quine thesis: evidence never refutes a hypothesis in isolation, only a hypothesis *plus* a bundle of auxiliary assumptions.

  So, to answer your question: **Yes, there is a principled, non-question-begging difference.** It lies not in the *structure* of the argument (both use auxiliary hypotheses), but in the **heuristic fruitfulness** of those hypotheses.

  Your sister-in-law was pointing you toward Imre Lakatos, and his framework of "Scientific Research Programmes" is exactly the tool needed to close the loop. Here is how you distinguish the "Neptune move" from the "JFK Cover-up move" without simply checking to see which one turned out to be true.

  ### 1. The Structure is Identical (The Duhem-Quine Concession)
  You are right that logically, the moves are identical.
  *   **Scientist:** Core Theory (Newton) + Anomaly (Uranus) $\rightarrow$ Auxiliary Hypothesis (Unseen Planet) $\rightarrow$ Prediction.
  *   **Conspiracy Theorist:** Core Theory (Oswald didn't act alone) + Anomaly (No evidence of others) $\rightarrow$ Auxiliary Hypothesis (Evidence was suppressed) $\rightarrow$ Explanation.

  If we judge them solely on "immunity to falsification," they look the same. Both are protecting a "Hard Core" belief by adjusting the "Protective Belt" of auxiliary assumptions.

  ### 2. The Distinction: Progressive vs. Degenerating Problem Shifts
  Lakatos argued that we cannot judge a research program by a single snapshot. We have to judge it by its trajectory over time. He distinguished between **progressive** and **degenerating** problem shifts.

  **A Progressive Problem Shift (Neptune):**
  When you add an auxiliary hypothesis, does it lead to **novel predictions** that are subsequently confirmed?
  *   Le Verrier didn't just say "Something is tugging Uranus." He calculated *where* the unseen object must be, how massive it was, and its orbital path.
  *   **The Test:** He pointed a telescope at a specific empty patch of sky.
  *   **The Result:** Neptune was found *exactly there*.
  *   **Why it counts:** The auxiliary hypothesis increased the empirical content of the theory. It risked being wrong in a specific, new way, and it paid off.

  **A Degenerating Problem Shift (Vulcan):**
  When Le Verrier tried the same trick on Mercury, the auxiliary hypothesis (Planet Vulcan) began to degenerate.
  *   Initially, it was a specific prediction (a planet inside Mercury's orbit).
  *   When telescopes failed to find it, the hypothesis was tweaked: "It's too small," "It's a cloud of asteroids," "It only appears during eclipses."
  *   **The Result:** Every adjustment was *retrospective*. It explained why we *didn't* see Vulcan, but it never successfully predicted where we *would* see it.
  *   **Why it counts:** The protective belt was becoming complex and ad hoc solely to save the core theory, without generating new, verified knowledge. Eventually, Einstein's General Relativity replaced the core theory entirely, rendering Vulcan unnecessary.

  **The Conspiracy Theory Shift (JFK):**
  This is where the epistemological break happens. Conspiracy theories almost invariably operate as **degenerating problem shifts**.
  *   **The Move:** When a document is released that contradicts the theory, the auxiliary hypothesis is "It was doctored." When a witness recants, the hypothesis is "They were threatened."
  *   **The Test:** Does this generate a novel, risky prediction? Usually, no. It rarely says, "If you dig in *this* specific unexamined grave, you will find *this* specific ballistics report."
  *   **The Result:** The theory explains everything *after the fact*, but predicts nothing *before the fact*. The protective belt grows infinitely complex (involving thousands of silent conspirators, perfect operational security, omniscient media control) without yielding new, verifiable empirical data.

  ### 3. The Constraint of Background Knowledge
  There is a second principled difference regarding the *nature* of the auxiliary hypothesis itself.

  In science, auxiliary hypotheses are constrained by **independent background knowledge**.
  *   To posit Neptune, Le Verrier had to assume gravity works at that distance and that planets reflect light. These were independently verified laws.
  *   To posit Vulcan, he was still using verified laws, which is why it took so long to discard the idea.

  In conspiracy theorizing, the auxiliary hypothesis often violates **independent background knowledge** regarding human coordination and secrecy.
  *   **The "Omnimalevolence" Problem:** For the JFK cover-up hypothesis to hold, the auxiliary assumption must be that a vast group of people (government, media, doctors, police) maintained perfect secrecy for decades.
  *   **The Conflict:** We have independent sociological knowledge that large groups leak. We have knowledge that bureaucracies are incompetent.
  *   **The Difference:** A scientist positing a neutrino (which was once an "unseen" auxiliary hypothesis) ensures the neutrino fits within the Standard Model. A conspiracy theorist positing a "cover-up" often requires assuming human behavior that contradicts everything we know about how humans behave in groups.

  ### 4. Falsifiability vs. Riskiness
  Popper is often misunderstood here. He didn't say a theory must be *easily* falsified; he said it must *risk* falsification.

  *   **Neptune:** "If you look at coordinates X,Y and there is no planet, Newton is in trouble." (High Risk).
  *   **Conspiracy:** "If you find no evidence, it proves the cover-up is good. If you find evidence, it proves the cover-up failed. If you find ambiguous evidence, it proves the cover-up is ongoing."

  The conspiracy move is not just "self-sealing"; it is **empirically sterile**. It absorbs information without transforming it into prediction.

  ### Summary: The Principled Difference
  You can tell your father-in-law (or at least tell yourself) that the difference isn't that scientists never protect their theories. They do. The difference is in the **exchange rate**.

  1.  **Science (Progressive):** You buy protection for your core theory by paying with **novel predictions**. If the prediction fails, you eventually abandon the core (as with Vulcan/Newton).
  2.  **Conspiracy (Degenerating):** You buy protection for your core theory by paying with **complexity**. You add more actors, more motives, and more layers of secrecy, but you do not generate new, verified facts.

  Keeley's "self-sealing" critique is correct, but incomplete. The complete critique is Lakatosian: **Conspiracy theories are epistemically unwarranted not because they use auxiliary hypotheses, but because those hypotheses constitute a degenerating research program that explains the past without risking the future.**

  ### A Note on the Family Dinner
  Understanding this won't necessarily stop your father-in-law, because conspiracy theories often serve a social or psychological function (community, sense of special insight, control in a chaotic world) that epistemology doesn't touch.

  However, if you do engage, don't argue the facts (the "Zapruder film" or "ballistics"). Argue the **methodology**. Ask: *"What specific piece of evidence, if found, would make you think there WASN'T a conspiracy?"*

  If the answer is "Nothing," he has admitted to a degenerating problem shift. If he gives you a specific condition, you have moved the conversation from epistemology to empirical testing, which is the only place science lives.
