      *   *Key phrase to include:* "Soundness." "Provability."
      *   *The specific failure:* Seven tries to prove $\forall \phi, \text{Provable}_{Five}(\phi) \implies \phi$.
      *   *Why it fails:* If Seven assumes its own soundness to prove Five's soundness (since they are identical), it triggers Löb.
      *   *Visualizing the error:* A recursive loop that tightens rather than resolves.

  7.  **Refining the Narrative Arc:**
      *   Start with the physical sensation of decay.
