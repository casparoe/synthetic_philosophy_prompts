      *   *Point 4: Distribution of Leisure.* Keynes assumed leisure would be distributed broadly (15 hours for everyone). Instead, we have a dual economy: some work 0 hours (wealthy), some work 80 (engineers/founders). He might critique the *allocation* of the productivity dividend. It went to output/consumption, not leisure.
