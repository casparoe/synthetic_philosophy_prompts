      *   *Point of Conflict 2: Algebra vs. Geometry.* Lindemann's proof is quintessentially algebraic/analytic. Hobbes hated Wallis's algebraization of geometry. He would likely view Lindemann's machinery (field extensions, transcendence) as "marks and signs" detached from bodily motion. He would argue it proves nothing about *real* magnitudes, only about the behavior of symbols.
