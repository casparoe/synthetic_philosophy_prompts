      *   *Epistemology/Demonstration:* True science (*scientia*) requires causal knowledge. We know geometry because we *make* the figures. "Verum et factum convertuntur" (truth and fact are convertible) is a Vichian idea, but Hobbes anticipates it: we demonstrate truth by constructing the cause.
