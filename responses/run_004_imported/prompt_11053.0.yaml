answer: |-
  This is a profound ethical knot, and your intuition is correct: there is a category error happening in how your friend and the building are assigning blame. What you are witnessing is the collision between **causal responsibility** (who physically could have stopped it) and **moral/legal responsibility** (who was obligated to stop it).

  Your friend is conflating the two. Here is a principled way to articulate why her self-blame is misplaced, why the maintenance guy is the actual target of responsibility, and why the group is nonetheless latching onto her.

  ### 1. Causal Conditions vs. Proximate Cause
  In philosophy of action and law, we distinguish between a *condition* and a *cause*.
  *   **Condition:** Oxygen was present in the hallway. If there were no oxygen, the smoke inhalation wouldn't have happened. Is oxygen to blame? No.
  *   **Condition:** Your friend did not change the battery. If she had, the alarm would have sounded.
  *   **Cause:** The grease fire was lit, and the safety system failed.

  Your friend is fixating on **counterfactual dependence** (*"If I had acted, this wouldn't have happened"*). While logically true, this is a trap. Infinite things satisfy counterfactual dependence. If the tenant hadn't cooked with grease, it wouldn't have happened. If the building had hardwired detectors, it wouldn't have happened. If the maintenance guy had done his job, it wouldn't have happened.

  To move from "I was a condition of this outcome" to "I am the cause of this outcome," you need **normative expectation**. We only assign moral blame for omissions (failures to act) when there is a specific **duty of care**.

  ### 2. The Hierarchy of Duty
  This is the strongest argument for your friend. Responsibility is not distributed equally among everyone who *could* act; it is distributed among those who *must* act.

  *   **The Maintenance Guy (Contractual Duty):** He has a legal and contractual obligation. His inaction is a breach of contract and potentially negligence. In ethics, this is a "perfect duty"—it is specific, owed to specific people, and enforceable.
  *   **The Friend (Social/Informal Duty):** She is a "de facto manager." This is a fuzzy role. Usually, this implies administrative coordination (collecting rent, passing messages), not physical safety maintenance. Unless she explicitly accepted the role of "Safety Officer," her duty is **imperfect**. It is commendable if she acts, but not necessarily blameworthy if she defers to the actual professional.
  *   **The Other Tenants (Civic Duty):** They have a general moral duty to look out for one another, but no specific obligation to fix infrastructure.
  *   **The Landlord/Builder (Structural Duty):** They created a system reliant on battery-operated detectors in a multi-unit walk-up, which is a known safety risk compared to hardwired systems.

  By blaming your friend, the building is treating an **imperfect duty** (being a helpful neighbor) as if it were a **perfect duty** (being the fire marshal). This is a moral category error.

  ### 3. Why Her? The Psychology of Blame
  If the maintenance guy is contractually liable, why is your friend taking the heat? This isn't about logic; it's about social psychology.

  *   **The Identifiable Victim/Perpetrator Effect:** The maintenance guy is likely an abstract figure or an employee of a faceless landlord. Your friend is a peer. Humans are evolutionarily wired to assign agency to people within their immediate tribe. It is cognitively easier to blame a present neighbor than an absent system.
  *   **The Competence Trap:** Because she is "organized" and the "de facto manager," she has signaled high agency. When high-agency people fail to act, it looks like a choice. When low-agency people (or bureaucratic systems) fail to act, it looks like entropy. The group assumes she *could* have fixed it more strongly than they assume the maintenance guy *should* have.
  *   **Moral Luck:** Your friend is suffering from bad moral luck. She has likely ignored or deferred maintenance tasks before without consequence. This time, the universe tested her omission, and it failed. She is being judged on the outcome, not the decision process. At the time she read the text, deferring to maintenance was a *reasonable* decision. We cannot judge the rationality of a decision based on hindsight.

  ### 4. Guilt vs. Regret
  The most helpful thing you can offer your friend is a distinction between **guilt** and **regret**.

  *   **Guilt** implies you did something wrong, violated a norm, or breached a duty.
  *   **Regret** implies you wish the outcome had been different and acknowledge you had some agency in the chain of events.

  She is allowed to feel **regret**. It is human to look at a tragedy and wish you had done more. It is healthy to feel the weight of living in a community. But she should not carry **guilt**. Guilt belongs to the person with the duty who failed to perform it.

  ### 5. The Systemic Absolution
  Finally, there is a dangerous societal function being served by blaming your friend.

  If the blame lands on the "helpful neighbor," the **system** is absolved. If the friend is the problem, then the solution is "neighbors need to be more proactive." If the maintenance guy/landlord is the problem, the solution is "we need better contracts, hardwired detectors, and enforcement."

  Blaming the volunteer is a way for the community to avoid the hard work of demanding structural safety. It privatizes a public risk. By accepting the blame, your friend is inadvertently allowing the landlord and the maintenance structure to offload their liability onto unpaid emotional labor.

  ### How to Articulate This to Her
  You might tell her this:

  > "You are confusing **causality** with **accountability**. Yes, your action would have prevented this. But so would a hundred other things. Accountability isn't about who *could* have stopped it; it's about who was *supposed* to.
  >
  > You were acting as a neighbor. He was acting as a paid safeguard. When you defer a safety issue to the professional, you are not being negligent; you are respecting the division of labor. If we decide that every tenant is responsible for the building's infrastructure because they *saw* a problem, we don't get safer buildings; we just get anxious neighbors and unaccountable landlords.
  >
  > You are allowed to mourn the outcome. You are not required to carry the sin."

  She is experiencing the burden of agency in a broken system. The principled reason to land the blame on the maintenance guy isn't just that he was paid; it's that **institutions must be held to higher standards than individuals** if we want society to function. If the "organized friend" is the safety net, the building isn't safe; it's just lucky.
