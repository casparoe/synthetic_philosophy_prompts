answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. The remnants of a departmental colloquium on evolutionary psychology linger in the air. Dr. Voss is pouring tea; Dr. Adler sits opposite, shuffling a stack of notes.*

  **Dr. Voss:** You looked restless during the Q&A, Elias. When the speaker mentioned Pinker's "auditory cheesecake" hypothesis, you nearly vibrated through the floorboards.

  **Dr. Adler:** Because it's a surrender, Clara. A premature surrender. Pinker argues music is a by-product—a technological accident of language, auditory scene analysis, and emotional circuitry. He treats it as a spandrel. But if you apply methodological adaptationism, as Godfrey-Smith suggests, the burden of proof is inverted. You don't start by assuming a trait is a free-riding accident. You start by asking what problem it solved.

  **Dr. Voss:** I'm not sure that's a inversion of the burden so much as a correction of a bias. I defended Pinker's account up there because it is mechanically rigorous. He doesn't just wave his hands and say "music is for bonding." He decomposes the capacity into constituent parts—syntax, pitch perception, motor control—and shows how those were selected for *other* reasons. That is exactly the Gould-Lewontin move. You identify the architectural necessities first. If the trait falls out as a necessary consequence of those constraints, you don't need a selective story for the trait itself.

  **Dr. Adler:** But that's the vice I can't shake. You're treating the "by-product" hypothesis as a null hypothesis that requires no evidence other than plausibility. But look at the data. Music is culturally universal. It appears in every known human society. It emerges developmentally without formal instruction. It is metabolically costly—time, energy, risk. In biology, when you see a complex, costly, universal trait, the default explanation is selection. To assume it's just noise riding on the coattails of language is to ignore the signal.

  **Dr. Voss:** Universality is not a proxy for adaptation, Elias. Language is universal and adaptive. But the human chin is universal and likely a structural by-product of facial shortening. The appendix is universal and... well, we're still debating that, but for a long time, it was the poster child for vestigiality. Universality tells you the trait is deeply embedded in the lineage, not that it was the *target* of selection. Pinker's point is that the cognitive architecture required for language *inevitably* produces music as a side effect. That is a testable claim about developmental constraint.

  **Dr. Adler:** Is it testable? Or is it just a "just-so story" in reverse? Gould and Lewontin accused adaptationists of spinning tales that couldn't be falsified. But saying "it's a spandrel of language" is equally immune to falsification if you aren't careful. How do you prove music *wasn't* selected for? Methodological adaptationism isn't a dogma that everything *is* optimal. It's a heuristic. It says: "Assume there is a function, hunt for it, and only retreat to constraint when the functional hypothesis fails." If you retreat to constraint immediately, you stop looking.

  **Dr. Voss:** And if you assume function immediately, you stop looking for constraints. That was the core of the 1979 critique. It's not that adaptation doesn't happen; it's that the "Panglossian paradigm" blinds researchers to alternative causal structures. Take the "current utility" versus "historical function" distinction. Music certainly has utility now—social cohesion, mate attraction, mood regulation. But demonstrating current utility is not demonstrating selective history. Pinker avoids that trap. He admits music is useful, but denies that utility explains its *origin*. That is rigorous.

  **Dr. Adler:** It's rigorous only if you accept that the burden of proof lies on the adaptationist. I contend the burden lies on the constraint theorist. Why? Because natural selection is the only known process capable of generating complex design. Constraints can explain limits, they can explain why a trait isn't *perfect*, but they cannot explain why a trait is *there* in a specific, elaborate form. If music involves intricate sequencing and emotional synchronization, that looks like design. To say "it just happened" requires you to show that the probability of it happening by chance, given the constraints, is high. Pinker hasn't shown that.

  **Dr. Voss:** But that's where your heuristic becomes a blindfold. You say selection is the only engine of complex design. But "complexity" is in the eye of the beholder. A snowflake is complex; no selection there. Crystal lattice structures are intricate; they are determined by physics. When Pinker points to auditory scene analysis, he's pointing to the physics of hearing and the neurology of pattern recognition. If the brain is built to parse complex sounds for survival—predator detection, communication—then music is the crystal lattice. It precipitates out of the solution. You want me to prove it *wasn't* selected. I say you haven't proven it *was*. You have a correlation between music and social bonding, and you call that causation.

  **Dr. Adler:** I call it a research program. If I treat music as a spandrel, my research question is "What is the primary trait that caused this?" If I treat it as an adaptation, my question is "What specific fitness variance does this track?" The latter generates comparative hypotheses. We can look at animal song. We can look at neurological lesions. We can look at genetic correlates. The adaptationist stance drives data collection. The spandrel stance often acts as a conversation stopper. "Oh, it's just a by-product." End of inquiry.

  **Dr. Voss:** Or, it acts as a corrective to infinite ingenuity. I've read the adaptationist literature on music, Elias. One paper says it's for sexual selection, another says it's for mother-infant bonding, another says it's for group cohesion against rival tribes. When you can explain everything, you explain nothing. That is the "reverse engineering" problem. If I give you a stone, you can invent a use for it. That doesn't mean the stone was made for that use. Pinker's account is more parsimonious because it relies on mechanisms we know exist for independent reasons. We *know* language was selected. We *know* emotion regulation was selected. Adding a third selective pressure for music is ontologically expensive.

  **Dr. Adler:** Parsimony isn't just about counting mechanisms; it's about explanatory power. If music is just cheesecake, why is it so emotionally potent? Why does it command resources? Why do humans suffer to create it? A by-product doesn't usually command such devotion. Think of the peacock's tail. It's costly. It's universal in the species. We assume selection because the cost demands it. If music is costly, and it's not a by-product of something else that *needs* that cost, then the cost itself implies a payoff. Methodological adaptationism demands we find that payoff before we dismiss it as noise.

  **Dr. Voss:** The peacock's tail has a clear phylogenetic signal correlating with mating success. Do you have that for music? Do you have a fossil record of Pleistocene concerts? No. You have modern utility. You are inferring history from present-day function. That is the exact logical leap Gould warned against. A trait can be co-opted. Feathers didn't evolve for flight. If you had applied your methodological adaptationism to feathers in *Archaeopteryx*, you might have insisted they were for flight, missing the thermal regulation history. I prefer Pinker's caution. He separates the exaptation from the adaptation.

  **Dr. Adler:** And I prefer a methodology that doesn't paralyze us with skepticism. Godfrey-Smith distinguishes between empirical adaptationism—the claim that most traits are adaptations—and methodological adaptationism—the strategy of testing adaptation first. I am defending the latter. It is not a claim that Pinker is wrong about the world; it is a claim that his *approach* is methodologically weak. He accepts a constraint hypothesis without exhausting the functional hypothesis. He treats the "spandrel" label as an explanation rather than a placeholder for "we haven't found the function yet."

  **Dr. Voss:** But "we haven't found the function yet" can be an infinite regress. At some point, you must accept that not every feature of an organism is a solution to a problem. Some features are just the shadow cast by the things that were solutions. If I accept your default, Elias, I risk attributing agency to natural selection where there is only geometry. If you accept my default, you risk missing a function. Which error is more damaging to the science? I argue the Panglossian error is worse because it creates the illusion of understanding. It tells a story that feels complete but lacks historical evidence.

  **Dr. Adler:** I argue the constraint error is worse because it assumes passivity. It treats the organism as a bag of physical reactions rather than a historical agent shaped by competition. If music is universal and costly, the null hypothesis *must* be selection. Anything else is special pleading.

  **Dr. Voss:** And if music is a structural inevitability of a language-ready brain, the null hypothesis *must* be constraint. Anything else is storytelling.

  **Dr. Adler:** *[Sighs, closing the notebook]* We aren't going to resolve the burden of proof today, Clara.

  **Dr. Voss:** *[Sips tea]* No. But at least we agree the music is loud. Whether it's a symphony or just noise... that remains to be seen.

  **Dr. Adler:** I'll keep listening for the function.

  **Dr. Voss:** And I'll keep checking the architecture.
