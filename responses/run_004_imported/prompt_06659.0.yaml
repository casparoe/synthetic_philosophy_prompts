          *   Highlight the tension between his two legacies (Jury Theorem vs. Paradox).

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Wait, did Condorcet distinguish between preferences and judgments? Yes, implicitly. The Jury Theorem is about judgments (guilty/not guilty). The Paradox is about preferences (ranking candidates). The Discursive Dilemma is about judgments (logic). So DD is actually closer to the Jury Theorem context.
      *   *Implication:* This strengthens the idea that he would analyze it probabilistically. He would ask: "Which method yields the higher probability of a correct truth-tracking outcome?"
      *   *Refinement on Procedure:* If the goal is truth (CJT), and premises are the evidence, then finding the truth of the premises is the path to the truth of the conclusion. Premise-based voting respects the logic of truth-tracking better than conclusion-based voting, which might be subject to heuristic errors.

