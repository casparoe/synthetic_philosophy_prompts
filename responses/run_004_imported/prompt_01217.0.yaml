      *   *The Limit:* Lewis's theory relies on *coinciding interests* (Coordination). Many norms exist where interests *conflict* (Prisoner's Dilemma). Honesty/Promises often involve temptation to defect. Lewis's later work acknowledges "mixed motive" games, but the core definition is coordination.

