          *   *Equilibrium:* Is keeping a promise a coordination equilibrium? Often no. It's a temptation to defect.
          *   *Result:* The analogy breaks. In language, being truthful helps *me* communicate. In promising, keeping a promise often costs *me* to help *you*.
