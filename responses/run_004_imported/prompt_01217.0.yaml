          *   Weigh considerations on both sides.
          *   **Crucial:** Do not fence-sit. Take a definitive stance and defend it.

  2.  **Deconstruct Lewis's Theory (*Convention*):**
      *   **Definition:** A regularity $R$ in behavior in population $P$ in situation $S$ is a convention if:
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ *on the condition* that others do (Coordination Equilibrium).
          4.  There is at least one alternative regularity $R'$ that could have solved the problem instead (Arbitrariness).
          5.  Common knowledge of 1-4.
      *   **The Problem with Honesty:** If I lie and you expect lies, communication fails. If I tell truth and you expect truth, communication works. Is there an alternative $R'$ (e.g., "Always Lie")? If everyone always lied and expected lies, we could just invert the code. *However*, Lewis argues in *Convention* that simple lying isn't a stable equilibrium in the same way because it requires a double inversion that is cognitively costly or unstable. But in "Languages and Language," he refines this: The *language* is the arbitrary convention. Once the language ($L$) is fixed, truthfulness relative to $L$ is rational, not conventional.

  3.  **Analyze the "Languages and Language" Move:**
      *   Lewis distinguishes between the *language* (the semantic rules) and the *use* of the language.
      *   The convention is: We use $L$.
      *   Conditional on using $L$, I should utter sentences true in $L$, and you should believe sentences uttered in $L$.
      *   The arbitrariness lies in choosing $L$ over $L^*$ (e.g., English vs. German, or even a language where 'green' means 'red').
      *   *Critique:* Does this explain the *normativity* of truthfulness? Or does it just push the buck? If the only reason to be truthful is that we agreed on $L$, does that capture the moral weight of lying? Lewis isn't trying to capture moral weight, but the *social ontological* status of the norm.

