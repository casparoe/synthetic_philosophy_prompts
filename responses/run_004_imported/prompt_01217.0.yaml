answer: |-
  **The Limits of Coordination: Why Lewis's Linguistic Fix Fails Social Ontology**

  David Lewis's *Convention* (1969) offers one of the most rigorous reductions in twentieth-century philosophy: it attempts to explain a normative social phenomenon—convention—using only the descriptive tools of game theory and epistemic logic. The seminar's initial focus on the standard examples (driving sides, meeting places) obscures a tension that becomes acute when the theory is applied to loaded norms like honesty. Your friend argues that Lewis's later maneuver in "Languages and Language" (1975) successfully salvages the theory by relocating the convention to the choice of language, letting truthfulness ride along as a rational necessity. You suspect this is a sleight of hand that fails to generalize to non-linguistic norms.

  Adjudicating this requires looking past the impressionistic idea of "agreement" and examining the mechanical constraints of Lewis's definition. When we subject the "level-up" solution to a stress test using a non-linguistic norm like promise-keeping, the machinery jams. While Lewis's friend is correct that the maneuver saves the philosophy of language, you are correct that it cannot bear the weight of a general social ontology. Lewis's framework explains how signs acquire meaning, but it cannot generate the obligation to keep promises without stretching the definition of "convention" until it breaks.

  ### The Mechanics of Lewisian Convention

  To see why the honesty problem arises, we must recall the strict conditions Lewis places on a convention. For a regularity $R$ in behavior to be a convention in a population $P$, it must satisfy five conditions. Three are critical for this dispute:

  1.  **Coordination Equilibrium:** Everyone conforms to $R$, and everyone prefers to conform to $R$ *on the condition* that others do. This is not merely a habit; it is a Nash equilibrium in a coordination game. If you drive on the left, I prefer to drive on the left to avoid crashing.
  2.  **Common Knowledge:** Everyone knows, and knows that everyone knows, that these conditions hold.
  3.  **Arbitrariness:** There must be at least one alternative regularity $R'$ that could have solved the coordination problem just as well.

  The arbitrariness clause is the engine of Lewis's theory. It ensures that conventions are distinct from natural laws or coercive mandates. We drive on the left *rather than* the right. If there were no alternative $R'$, the regularity would be compelled by nature or logic, not sustained by convention.

  ### The Problem of Truthfulness

  In *Convention*, Lewis initially treats truthfulness as a potential convention. However, a problem emerges with the arbitrariness clause. Consider a population that is uniformly truthful. Is there an alternative regularity $R'$, such as "Always Lie," that would serve communication just as well?

  Theoretically, yes. If everyone always lied and expected lies, communication could succeed by systematic inversion. However, Lewis recognizes this is unstable. A policy of "Always Lie" is functionally identical to "Always Tell Truth" in a language with inverted semantic rules. The cognitive load of constant inversion makes it a inferior equilibrium. More importantly, truthfulness in communication is often a *dominant strategy* once a language is fixed. If we speak English, I cannot achieve my communicative goals by lying, even if you expect lies, because my goal is to convey specific information, not just to coordinate on a pattern of sounds.

  Thus, bare truthfulness fails the arbitrariness test. There is no equally good alternative regularity of *behavior* (lying vs. truth-telling) that sustains the same communicative ends within a fixed language. If truthfulness isn't arbitrary, it isn't a convention by Lewis's 1969 definition.

  ### The "Languages and Language" Maneuver

  In his 1975 paper, Lewis shifts the locus of the convention. He argues that the convention is not "be truthful," but rather "use language $L$."

  Here, the arbitrariness condition is satisfied. We could have used German, or a language where 'cat' means 'dog'. The choice of $L$ is a genuine coordination equilibrium: I prefer to use English sounds with English meanings if you do, and vice versa. Once the convention to use $L$ is established, truthfulness becomes a matter of rational necessity, not convention. If we have conventionally agreed to use $L$, and I want to communicate, I *must* utter sentences that are true in $L$. To do otherwise is not to violate a convention; it is to act irrationally relative to our shared goal of communication.

  Your friend sees this as a clean solution: the arbitrariness is preserved at the level of semantic rules, and the normativity of truthfulness is derived from the instrumental rationality of using those rules. The "obligation" to be truthful piggybacks on the convention to use the language.

  ### The Stress Test: Promise-Keeping

  Does this trick generalize? To test this, we must apply the "level-up" maneuver to a non-linguistic norm, such as promise-keeping.

  Consider a population where people make promises and keep them. If we try to analyze this using Lewis's 1969 definition, we hit the same wall as with truthfulness. Is there an alternative regularity $R'$, such as "Always Break Promises"? No, because that destroys the practice of promising. If everyone broke promises, the signal "I promise" would cease to have any force, and the coordination problem (relying on future action) would vanish. Thus, promise-keeping fails the arbitrariness clause if analyzed as a behavioral regularity.

  Can we use the 1975 maneuver? We could posit that the convention is not "keep promises," but "participate in the Practice of Promising." The arbitrariness would lie in choosing *this* practice over some alternative signaling system for future commitment. Once the practice is chosen, keeping the promise becomes rationally necessary to maintain the utility of the practice.

  Here, the analogy breaks down. In the language case, being truthful is *constitutive* of using the language. If I systematically utter falsehoods in English, I am not really using English to communicate; I am sabotaging the very mechanism we agreed to use. The cost of defection is immediate failure of the act itself.

  In promise-keeping, the act and the norm are separable. I can successfully make a promise (the signal is sent and understood) and then break it (the action is not performed). The benefit of the promise (your reliance) is already secured before I decide whether to keep it. This creates a **mixed-motive game** (specifically, a Prisoner's Dilemma or Assurance Problem), not a pure Coordination Problem.

  In a pure coordination problem (like driving), my interests coincide with yours: we both want to avoid the crash. In promise-keeping, our interests often diverge at the moment of performance. I prefer to break the promise (saving time/effort) even if you prefer I keep it. Lewis's definition of convention relies on *coinciding interests* (Condition 3: everyone prefers to conform given others conform). But in promise-keeping, I often prefer *not* to conform even if you do, unless there is an external sanction.

  Lewis's "level-up" move works for language because the "truth" condition is internal to the semantic system. It fails for promises because the "keeping" condition is external to the signaling system. Relabeling the "Practice of Promising" as the convention does not solve the incentive problem. It merely asserts that there is a convention to participate in a practice that requires overcoming a non-coordination incentive structure. But Lewis's machinery is designed to explain how norms arise *from* coordination, not how they sustain cooperation *despite* conflicting interests.

  ### Adjudication

  Your friend is right that Lewis saves the concept of linguistic meaning. By shifting the convention to the choice of language, Lewis successfully demonstrates that semantics is grounded in social regularity without requiring a moral obligation to be truthful. The "obligation" to speak truthfully is merely hypothetical: *if* you want to communicate in $L$, *then* you must be truthful in $L$.

  However, you are right that this is a special-case dodge that fails as a general social ontology. The Lewisian framework is powerful for explaining arbitrary equilibria where interests align (traffic, meeting spots, semantic rules). It is ill-equipped to explain norms where interests conflict and compliance requires self-sacrifice (honesty in trade, promise-keeping, property rights).

  The sleight of hand lies in treating the *existence* of a practice as the arbitrary convention, while ignoring that the *maintenance* of that practice requires solving a different game entirely. In language, using the practice solves the game. In promising, adopting the practice merely sets the board for a game where defection is often rational. Lewis's definition cannot generate the "ought" of promise-keeping from the "is" of coordination because the underlying game is not one of pure coordination.

  ### Conclusion

  A broadly Lewisian, coordination-based analysis of convention can be pushed exactly as far as the alignment of interests allows. It provides a definitive account of how arbitrary social signals acquire meaning and how populations settle on equilibrium behaviors when everyone wants the same outcome. It cannot, however, explain norms that require agents to act against their immediate self-interest for the sake of social order.

  Lewis's move in "Languages and Language" is not a universal key for social ontology; it is a specific repair for the philosophy of language. It works because truthfulness is constitutive of linguistic meaning. It fails for honesty and promise-keeping because those norms are regulative of action, not constitutive of signal production. To explain those, we need more than coordination equilibria and common knowledge; we need an account of sanctions, moral internalization, or evolved altruism that lies outside the strict bounds of Lewis's *Convention*. The machinery is elegant, but it is too thin to carry the weight of moral obligation. You are correct: it is a dodge, albeit a brilliant one.
