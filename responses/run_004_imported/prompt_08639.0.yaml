      *Wait, one nuance:* The point of the surrogate goal is that the blackmailer targets the *surrogate* because they think it's vulnerable or leveragable, OR the agent behaves as if the surrogate is real so the blackmailer knows they can't threaten the *real* values because the agent won't trade them, but they might try to threaten the surrogate?
      Actually, the standard argument (from Benja Fallenstein etc.) is: If you have a surrogate goal, the blackmailer will target the surrogate goal because threatening the real goal doesn't work (you won't comply), but threatening the surrogate *might* work if you care about it. BUT, if you precommit to treating the surrogate *exactly* like a real goal (including not complying with threats against it), then the blackmailer gains nothing.
      The twist in the story: To make the non-compliance credible, you have to *actually* care about it enough to suffer for it.
