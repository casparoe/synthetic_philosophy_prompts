answer: |-
  This is a painfully classic instance of what is formally known in bargaining theory as a **commitment race**.

  Given your background and the reading group you are attending, you will recognize the architecture immediately: you and your sister are playing a dynamic variant of the **Nash Demand Game**, but with endogenous timing on the commitment moves. The theoretical literature suggests that while your individual moves were locally rational (best responses to the information available at the time), the structure of the interaction made the disastrous equilibrium highly predictable, and arguably inevitable, given the transparency of your family network.

  Here is the breakdown of the theory, the assessment of rationality, and the game-theoretic pathways out of the trap.

  ### 1. The Theoretical Structure: Commitment Races

  The specific dynamic you are describing is a **commitment race**. This concept was articulated by Thomas Schelling in *The Strategy of Conflict* (1960) and refined by later theorists like Robert Frank and, more recently, in the context of AI safety and bargaining (e.g., work by Thomas, Dafoe, et al.).

  In standard bargaining, the power to commit is an advantage. As Schelling famously noted, the party who can convincingly bind themselves to a position (burn the bridge behind them) forces the other party to accommodate them. However, when *both* parties have the capacity to commit, and the timing of that commitment is up to them, they enter a race to commit *first*.

  *   **The Mechanism:** You observed your sister attempting to seize the **first-mover advantage** by establishing a focal point (the house) and attaching **audience costs** to retreating (public announcement to relatives).
  *   **The Response:** Your reaction was a **best response** within the race. If you had deliberated privately, you would have effectively conceded the first-mover advantage. Her position would have hardened into the default Schelling point, and the audience costs for *you* to disrupt it later would have been higher than the costs of matching her commitment now.
  *   **The Outcome:** The race drives both parties to make commitments that are mutually incompatible. In the Nash Demand Game, if demands sum to more than the available resource (which they do, since you both want the house), the outcome is **disagreement**. In your case, "disagreement" means litigation, which burns value (legal fees) and destroys relationship capital. This is a **Pareto-inferior equilibrium**.

  ### 2. Were You Rational?

  This is the crux of the philosophical tension.

  **Ex-post (looking back):** No. The outcome is worse for both of you than a negotiated settlement would have been. You have entered a **Prisoner's Dilemma** where "Commit Hard" is the dominant strategy for each player, but (Commit Hard, Commit Hard) is the worst joint outcome.

  **Ex-ante (in the moment):** Yes, arguably. Given the structure of your family network (high transparency, high gossip/audience cost), your sister's move changed the payoff matrix. Once she publicly committed, the cost of your concession spiked. Your urge to match her was a rational attempt to restore bargaining power.

  **The Mistake:** The error wasn't in your reaction to her move; it was in the **common knowledge of the game structure**. In a healthy bargaining environment, agents often benefit from *ignoring* the ability to commit, or delegating commitment power to a neutral arbiter. By both engaging in the race, you validated a mechanism (public posturing) that is efficient for winning a fight but inefficient for dividing an estate. You both treated the family network as an enforcement mechanism for threats, rather than a resource for coordination.

  ### 3. Is There a Way Out? (De-escalation Strategies)

  Game theory suggests that once agents are locked into incompatible commitments, the only way to escape is to **change the game**. You cannot simply "concede," because the audience costs (loss of standing) are now part of the utility function. You need a mechanism that allows both of you to retreat without appearing to capitulate to the other.

  Here are four theoretically grounded off-ramps:

  #### A. Introduce a New Schelling Point (External Arbitration)
  Currently, the Schelling point is "Whoever shouts loudest." You need to shift the focal point to something external.
  *   **The Move:** Agree to submit the division to a neutral third party (a mediator, not a lawyer) or even a randomizing device (e.g., "We will get three appraisals and split the difference," or "One divides, the other chooses").
  *   **The Rationalization:** This allows you to tell your relatives: *"I didn't back down; we agreed to let [Mediator/Process] decide what is fair."* You are not conceding to your sister; you are submitting to a procedure. This removes the "weakness" signal.

  #### B. Reduce Audience Costs (Privatization)
  The toxicity of the current situation relies on **common knowledge** of your positions among the relatives.
  *   **The Move:** You and your sister need to issue a joint statement to the family: *"We realize our initial statements were made in grief and frustration. We are moving discussions to a private channel to respect Grandma's memory."*
  *   **The Rationalization:** If you can successfully move the negotiation out of the public earshot, the audience costs evaporate. Once the relatives stop expecting a specific outcome, you can negotiate a compromise privately and then present the *result* as a *fait accompli*.

  #### C. Side Payments for "Face"
  In bargaining theory, if positions are locked, you must compensate the other party for the cost of moving. In this case, the cost is not just financial; it is reputational.
  *   **The Move:** If you want the house (or a share of it) more than she does, you may need to offer a settlement that is financially *better* for her than her public position required, explicitly framed as respecting her needs, not buying her silence.
  *   **The Rationalization:** If she gets 60% of the value but keeps the house, she can tell the family she "won" the house. If you get 40% in cash but avoid legal fees, you can tell the family you "acted with integrity to avoid conflict." You are paying a premium for her face-saving exit.

  #### D. Reframe the Payoff Function (The "Grandma" Focal Point)
  Currently, the game is zero-sum (House vs. Savings). You need to introduce a cooperative payoff that outweighs the zero-sum gain.
  *   **The Move:** Frame the avoidance of legal battle as a tribute to the deceased. *"Grandma hated conflict. If we hire lawyers, we betray her values."*
  *   **The Rationalization:** This changes the utility function. If "Honoring Grandma" is a higher utility than "Winning the House," then conceding on the house becomes a *win* on the higher-order value. This is effectively changing the game from Chicken to a Coordination Game on "Who can be the better grandchild?"

  ### 4. A Recommendation for a Philosopher

  Since you are trained to see the structure, you are uniquely positioned to break the frame, but you cannot do it by arguing the theory to your sister (that will look like manipulation).

  1.  **Initiate a "Pause":** Contact her privately. Acknowledge the dynamic without blaming. *"I think we both got caught up in trying to be firm, and now we've painted ourselves into a corner. The lawyers are the only ones winning."*
  2.  **Propose a Procedure, Not a Settlement:** Do not propose a split of assets yet. Propose a *process* (e.g., "Let's hire a mediator for one session just to see what a fair split looks like on paper"). This is a low-cost commitment that doesn't require conceding your position.
  3.  **Use the "Common Enemy":** The "Common Enemy" is the legal system/fees. Align against that.

  **Summary:** You are in a commitment race with high audience costs. Your reasoning was locally rational but globally destructive. The way out is not to concede, but to **change the focal point** of the negotiation from "Public Claims" to "Private Process," allowing both of you to save face while avoiding the crash.

  It is a grim irony that the Schelling tools designed to help you bargain have been weaponized by grief to ensure you both lose. Recognizing that is the first step to disarming them.
