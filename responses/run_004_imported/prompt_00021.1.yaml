answer: |-
  # The Mosaic and the Mandate: Defending Sophisticated Humeanism Against the Demand for Nomic Necessitation

  The debate over the metaphysics of laws of nature is, at its core, a conflict between two powerful philosophical intuitions. On one side stands the Humean commitment to ontological parsimony and the denial of "necessary connections" between distinct existences. On the other stands the realist intuition that laws must do more than summarize; they must *govern*, *produce*, or *ground* the regularities of the world. David Lewis's Best System Analysis (BSA) represents the most sophisticated attempt to reconcile lawhood with Humean supervenience. Yet, as your reading group has discerned, a persistent worry remains: can a system that merely summarizes the "Humean mosaic" truly underwrite the modal robustness, explanatory depth, and objective chance that scientific practice demands?

  Critics like Armstrong, Dretske, and Maudlin argue that the BSA leaves the world "loose and separate," lacking the ontological glue to make counterfactuals true or chances objective. They posit laws as relations of nomic necessitation or primitive facts that stand over and above the mosaic. In this essay, I will argue that while the Anti-Humean critique correctly identifies the limitations of the BSA regarding pre-theoretic intuitions of "governance," it fails to provide a coherent alternative. By engaging with refinements to the BSA by Loewer and Cohen, and addressing the "Big Bad Bug" regarding chance, I will defend a definite verdict: **a sophisticated, pragmatic Humeanism is the only metaphysically coherent account of laws, provided we abandon the mistaken demand that laws must ontologically ground the mosaic they describe.** The worry that BSA lacks "oomph" is not a bug of the theory, but a feature of a misguided, quasi-theological conception of lawhood that no metaphysics can satisfy.

  ### The Humean Machinery: From Lewis to Loewer

  To assess the BSA's capacity, we must first move beyond Lewis's initial 1973 formulation. Lewis proposed that laws are the theorems of the deductive system that best balances *simplicity* and *strength* in describing the total spatiotemporal distribution of local qualities (the mosaic). This view secures Humean supervenience: there is no difference in laws without a difference in the mosaic.

  However, the standard objection is that simplicity and strength are anthropocentric. Why should the cognitive preferences of human systematizers determine the objective structure of the universe? Enter Barry Loewer and Jonathan Cohen. Loewer's "Pacifist Humeanism" reframes the BSA not as a claim about the world *in itself*, but about the world *for us*. Laws are the axioms of the system that provides the best organization of information for agents with our cognitive architecture. Cohen extends this by arguing that the "Best System" is relative to a community's standards of simplicity and strength.

  This refinement is crucial. It concedes that laws are not "out there" in the same way particles are, but it denies that this makes them subjective fictions. They are objective features of the relationship between the world and rational inquirers. This move insulates the BSA from the charge that simplicity is mind-dependent in a trivial sense; rather, it acknowledges that "lawhood" is a functional role played by certain generalizations within our best scientific theories.

  ### The Anti-Humean Challenge: Explanation and Modality

  The Anti-Humean, typified by Tim Maudlin and D.M. Armstrong, argues that this functional role is insufficient. Maudlin contends that laws are metaphysical primitives that *produce* the mosaic. For Maudlin, the direction of explanation is top-down: laws explain particular facts because the facts obtain *in virtue of* the laws.

  The Humean faces two specific charges here. First, the **Explanatory Circularity**: If laws are summaries of the mosaic, citing a law to explain a particular fact (e.g., "the particle moved thus because of Newton's Law") is circular. It explains a regularity by citing a summary of that very regularity. Second, the **Modal Problem**: Counterfactuals (e.g., "if I had struck this match, it would have lit") rely on laws holding fixed while initial conditions vary. If laws supervene on the *actual* mosaic, how can they hold fixed in a possible world with a different mosaic?

  The Humean response, bolstered by Loewer, is to distinguish between *metaphysical determination* and *scientific explanation*. Humeans admit that, metaphysically, the mosaic determines the laws. However, within the web of belief, laws explain particular facts because they unify them. To explain is not to point to a generative mechanism, but to locate a fact within a systematic structure. Regarding counterfactuals, Lewis's semantics evaluates them by looking at possible worlds where the *Best System* is held fixed, even if the mosaic differs slightly. The laws are counterfactually stable not because they govern, but because we define similarity between worlds in terms of law-preservation.

  While this is technically consistent, the Anti-Humean presses the "Inference Problem" (originally against Armstrong): even if you posit a relation of "nomic necessitation" (N) between universals F and G, what ensures that if N(F,G) holds, all Fs are Gs? If N is distinct from the regularity, the connection is mysterious. If N just *is* the regularity, you are a Humean. The Anti-Humean posits a "glue" but cannot explain how it sticks.

  ### The Big Bad Bug and Objective Chance

  The most severe technical challenge to the BSA is Lewis's "Big Bad Bug." If laws are defined by the actual history of the world, and laws include probabilistic chances, a conflict arises with the Principal Principle (which states rational credence should align with objective chance).

  Consider an "undermining future": a possible future sequence of events that is consistent with the current laws but, if it were to occur, would change the statistical frequencies enough to alter what the Best System *is*. If the laws depend on the total history, then the current chance of an undermining future occurring is non-zero (according to the current laws). But if that future occurs, the laws change, meaning the current chance ascription was false. This creates a contradiction between the definition of chance (via the Best System) and the rational guidance of chance (via the Principal Principle).

  Lewis eventually conceded that the Principal Principle needed revision to the "New Principle," which conditions credence on the admissibility of the laws. Humeans like Loewer argue this saves the account: we can have objective chance without needing "propensities" in the objects themselves. The Anti-Humean argues this is a patch that admits Humean chance isn't truly objective.

  However, the Humean rebuttal is that the Anti-Humean account of chance is equally problematic. If chances are primitive propensities, how do we know them? We infer them from frequencies. But if we infer them from frequencies, they supervene on the mosaic anyway. The Humean is at least honest about the supervenience base. The "Bug" shows that our concept of chance is tricky, but the New Principle resolves the logical inconsistency without positing occult powers.

  ### The Verdict: Deflationary Humeanism

  We must now render a verdict. Can the BSA adequately capture the necessity, explanatory power, and support for counterfactuals that laws seem to have?

  My conclusion is **yes**, but only if we accept a deflationary account of what "necessity" and "explanation" amount to in a scientific context. The Anti-Humean view ultimately fails because it posits a metaphysical structure that is epistemically inaccessible and theoretically idle.

  1.  **On Necessity:** The Anti-Humean demand for "nomic necessitation" is a category mistake. It treats laws as *super-causes*, entities that push particles around. But laws are not causes; they are descriptions of how causes behave. To ask "what makes the regularity hold?" is to assume the regularity needs a maker. The Humean correctly identifies that the regularity *just holds*. The "necessity" we perceive is the inevitability of the deduction within the Best System, not a force in the world. Maudlin's primitivism avoids the "Inference Problem" by stipulating that laws just *do* constrain reality, but this is an assertion of mystery, not a solution. It posits a "because" without a mechanism. Humeanism, by contrast, locates the modality in the logical relations of the system, which is accessible and rigorous.

  2.  **On Explanation:** The charge of circularity misses the point of scientific explanation. Science does not seek a metaphysical ground for every fact; it seeks unification. When we explain a planet's orbit via General Relativity, we are not pointing to a metaphysical glue; we are showing how that orbit fits into a broader, simpler mathematical structure. The BSA captures this perfectly. The Anti-Humean claims their laws explain *why* the mosaic is as it is, but this is unintelligible. A law cannot explain the total mosaic, because the law's existence (on any view) is co-extensive with the mosaic's behavior. The Humean admits the mosaic is brute; the Anti-Humean hides the bruteness behind the label "nomic necessitation."

  3.  **On Counterfactuals and Chance:** The Humean account of counterfactuals (holding the Best System fixed) aligns with scientific practice. When physicists run simulations, they hold the equations fixed and vary the initial conditions. They do not worry that changing the conditions might change the laws, because they treat the laws as the stable parameters of the model. The BSA formalizes this practice. Regarding the "Big Bad Bug," the revision to the New Principle is a small price to pay for avoiding the epistemic black hole of primitive propensities.

  **The Definite Verdict:**

  We should reject the Anti-Humean view. The intuition that laws must "govern" or "produce" the mosaic is a residue of a theological worldview where laws are commands issued by a lawgiver. In a naturalistic metaphysics, there is no lawgiver, and thus no governance. There is only the world and our descriptions of it.

  The worry that BSA cannot do the "explanatory work" relies on a conflation of *metaphysical grounding* with *scientific explanation*. If we demand that laws metaphysically ground the mosaic, we are asking for something incoherent: a part of the world (the law) to create the whole of which it is a part. The Anti-Humean attempts to solve this by making laws transcendent (Armstrong's universals) or primitive (Maudlin), but this renders them epistemically inaccessible. We could never know if the "nomic necessitation" holds, only that the regularity holds. Thus, Anti-Humeanism posits a difference that makes no empirical difference.

  Therefore, the Lewisian tradition, refined by Loewer and Cohen, offers the superior account. It acknowledges that lawhood is a pragmatic category rooted in the cognitive project of systematization. This does not make laws "less real"; it makes them real in the way that *maps* are real. A map is not the territory, but it captures objective features of the territory relative to a user's needs. The BSA treats laws as the "map" that best compresses the information of the "territory" (the mosaic).

  The user's worry—that there is nothing "in" the world making the regularities hold—is correct, and that is the strength of the view, not its weakness. There is nothing "in" the world making the regularities hold *other than the regularities themselves*. To demand more is to demand magic. The BSA adequately captures the functional role of laws in science (prediction, counterfactual reasoning, unification) without inflating our ontology with mysterious necessitators. We should embrace the Humean mosaic, accept the Best System as our guide, and discard the intuition that nature requires a governor.
