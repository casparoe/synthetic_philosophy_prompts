answer: |-
  **Setting:** *The university coffee shop, late afternoon. The seminar on Social Ontology has just finished. LEO (20s, wears a hoodie, leans toward analytic philosophy) and MAYA (20s, sharp blazer, leans toward critical theory/political economy) are sitting at a small table with half-drunk coffees.*

  **Leo:** You were pretty quiet during the Bitcoin segment today. I expected you to tear Searle apart, but you just let the Chartalism folks do the heavy lifting.

  **Maya:** I was listening. Honestly, I think the Chartalists got closer to the nerve of it than Searle did. But mostly, I was struck by how the room split right down the middle. It wasn't just a disagreement about Bitcoin; it was a disagreement about what *kind* of thing money is.

  **Leo:** That's exactly why it's a perfect test case. Look, Searle's formula is elegant: *X counts as Y in context C*. A piece of paper (X) counts as a dollar (Y) in the US economy (C) because we collectively assign it that status function. Bitcoin fits that perfectly. The code (X) counts as currency (Y) in the crypto-ecosystem (C). We collectively agree it has value. What's the ontological hurdle?

  **Maya:** The hurdle is that Searle's formula is too thin. It explains how we label things, but not what makes the label *stick* with the force of money. If I walk into a grocery store and try to buy milk with a bottle cap, and I convince the cashier to take it, have I created money? By Searle's logic, momentarily, yes. We assigned a status function. But we both know that's not money. That's a barter trade or a favor.

  **Leo:** Okay, but durability matters. It's not one cashier. It's a global network of people who accept Bitcoin as a medium of exchange and a store of value. The "collective intentionality" is massive. It's not a favor; it's a systemic acceptance.

  **Maya:** Acceptance for what? That's the Chartalist point. You can't just say "medium of exchange." Money is fundamentally a unit of account and a means of extinguishing debt, specifically debt to the state. The reason the dollar works isn't just that we believe in it; it's that the IRS demands it. The state creates the demand for the currency by imposing a tax liability denominated in that currency. Bitcoin has no state. It has no tax authority. It has no one who *owes* you anything.

  **Leo:** I'll concede that Bitcoin doesn't have a state backing it. But why does the ontology of money *require* a state? That seems like a historical contingency, not a metaphysical necessity. Wampum wasn't state-backed in the modern sense. Gold wasn't. They were money because they were scarce and socially recognized. Bitcoin is just digital scarcity. If money is a social technology for coordinating value, Bitcoin is just a new version of the tech.

  **Maya:** But wampum and gold weren't *just* scarce objects. They were embedded in social relations of credit and obligation. Geoffrey Ingham's argument—the Credit Theory—is that money is a measure of debt. A dollar is essentially an IOU from the Federal Reserve, a transferable claim on social wealth. When you hold a dollar, the "system" owes you value. Who owes you a Bitcoin?

  **Leo:** No one. And that's the feature, not the bug. It's not a debt relation; it's a property relation. It's more like digital gold than a digital dollar. But you're conflating *types* of money with the *genus* of money. Just because Bitcoin isn't a credit instrument doesn't mean it isn't money. It functions as a settlement layer. It clears transactions without an intermediary.

  **Maya:** If it's digital gold, then it's a commodity, not money. We're back to the metallist view that Keynes and Knapp spent the twentieth century debunking. If Bitcoin is a commodity, its value should be tied to its utility or production cost. But its price swings wildly based on speculation. How can it be a *unit of account* if the yardstick changes length every hour? You can't price a labor contract in Bitcoin if you don't know what the wage will be worth next month.

  **Leo:** I'll grant you the volatility point. That's a practical weakness, I admit. But ontologically? Volatility doesn't disqualify it from the *kind* "money." The Turkish Lira or the Zimbabwean Dollar were still money even when they were hyper-inflating. They were just *bad* money. So, instability makes it bad money, not non-money.

  **Maya:** That's a clever move, but it dodges the structural issue. The Lira was still the unit in which Turkish taxes were paid. The state stood behind it, even if it was stumbling. Bitcoin exists in a vacuum. Here's my real worry, Leo: This seminar is supposed to be about social ontology. We're trying to figure out what social reality *is*. If Searle says money is collective belief, and the Chartalists say money is state power, and Bitcoin looks like belief without power... then we don't have a unified theory of money. We have two different concepts fighting over the same word.

  **Leo:** So your argument is that the concept of "money" is broken?

  **Maya:** My argument is that Bitcoin exposes the fracture. Searle wants to say money is a "status function" conferred by us. The Chartalists say money is a "social relation" enforced by authority. Bitcoin forces us to choose. If you side with Searle, Bitcoin is money. If you side with Knapp or Wray, it's a token in a game, maybe an asset, but not money. The fact that we can't agree suggests "money" isn't a natural kind or even a stable institutional kind. It's a cluster concept where Bitcoin only hits half the clusters.

  **Leo:** I see what you're doing. You're saying the disagreement proves the ontology is indeterminate. But I think you're underestimating the "context C" in Searle's formula. For the dollar, C is "The United States Legal Framework." For Bitcoin, C is "The Cryptographic Protocol and Global Network." The status function is being conferred by a different *type* of community.

  **Maya:** But is a "global network" a community in the same way a polity is? A polity has a monopoly on violence. It can enforce contracts. If I don't pay my debts in dollars, the state can seize my assets. If I don't pay in Bitcoin... well, the transaction just doesn't happen on the blockchain. There's no enforcement mechanism outside the code. Money isn't just about exchanging value; it's about enforceability of obligation.

  **Leo:** Okay, let's push on that. You say enforceability is essential. But what about international trade? When the US trades with Japan, there's no global state enforcing the dollar. They use it because of network effects and trust in the US economy. That sounds a lot like the Bitcoin logic. It's hegemony, not just law. Bitcoin is trying to build a hegemony without a homeland.

  **Maya:** *Trying* is the operative word. The dollar's hegemony rests on the fact that oil is priced in it and debts are denominated in it. It's still tied to real economic output and military power. Bitcoin is tied to... electricity and consensus. Look, I'm willing to concede this: Bitcoin has *moneyness*. It's not a binary switch. It possesses some qualities of money—fungibility, divisibility, portability.

  **Leo:** Okay, I'll take that. "Moneyness" as a gradient.

  **Maya:** Right. But if it's a gradient, then Searle's binary "counts as" formula is insufficient. You can't say "It counts as money" or "It doesn't." You have to say "It functions as money in these specific contexts but fails in others." And if our best theories of social ontology can't handle that gradient without breaking, then the theories need work. Bitcoin isn't the problem; our definitions are.

  **Leo:** I think I can live with that modification. Searle's formula is a bit rigid. Maybe the "status function" isn't binary. Maybe it's a matter of degree of collective acceptance. But I still resist the idea that the State is the *only* source of that acceptance. If Bitcoin survives another fifty years, becomes the standard for cross-border settlement, and people price homes in it... will you still say it's not money because the IRS doesn't take it?

  **Maya:** If people price homes in it, then the state will eventually tax it or ban it. That's the Chartalist trump card. The state defines what counts as final settlement within its borders. If Bitcoin becomes that dominant, it will either be co-opted by the state—turned into a CBDC—or crushed. If it survives, it will be because it *became* like a state, or was absorbed by one.

  **Leo:** Or, the state's monopoly on money is the thing that's ending. Maybe Bitcoin proves that the "State Theory" was only true for the last three hundred years of history, not for all time. Maybe we're seeing the decoupling of money from sovereignty.

  **Maya:** And maybe we're seeing a speculative bubble dressed up as philosophy. (She smiles slightly). But seriously, if money is decoupled from sovereignty, what holds it together? Pure belief? That seems fragile. Social ontology needs to account for power, not just belief. Searle gives you the belief, but he ignores the power. Chartalism gives you the power, but ignores the belief. Bitcoin sits right in the gap, screaming that something is missing.

  **Leo:** So the seminar wasn't a failure because we didn't agree. It was successful because Bitcoin acted as a reagent. It showed us where the theories precipitate out.

  **Maya:** Exactly. It shows that "money" isn't one thing. It's a battleground between collective intentionality and institutional power. Bitcoin is pure intentionality trying to become power. Whether it succeeds... well, that's not ontology anymore. That's history.

  **Leo:** I can accept that. Though I'm still buying a fraction of a coin. Just to keep my status function active.

  **Maya:** (Laughs) Just don't try to pay for this coffee with it. The barista's context C doesn't include the blockchain.

  **Leo:** Fair enough. Dollars it is. For now.
