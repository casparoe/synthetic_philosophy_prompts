answer: |-
  You are absolutely right to resist the change. Your labmate's proposal would fundamentally break the exercise by destroying its ability to measure what actually matters in scientific forecasting: **calibration.**

  What is at stake is the difference between measuring **directional accuracy** (did you guess the outcome?) and **probabilistic integrity** (how well did your stated confidence match reality?). By switching to a "correct side of 50%" rule, you would be giving up the incentive for honesty and reverting to the exact kind of binary thinking that contributed to the replication crisis in your field.

  Here is the breakdown of why your intuition is correct, articulated in terms you can use with your group.

  ### 1. Proper vs. Improper Scoring Rules
  In forecasting theory, the log score you are currently using is a **proper scoring rule**. This is a technical term meaning that the strategy which maximizes a forecaster's expected score is to report their *true* belief.

  *   **Current System (Log Score):** If I truly believe a finding has a 70% chance of replicating, my expected score is maximized only if I write down "0.70." If I write down "0.90" to look confident, or "0.51" to play it safe, I mathematically lower my expected score over time.
  *   **Proposed System (Binary/Sign Score):** This is an **improper scoring rule**. If the rule is simply "did you pick the winning side?", there is no incentive to distinguish between 51% confidence and 99% confidence. In fact, it encourages strategic exaggeration. If I think something is 60% likely, I might as well claim I'm 99% sure, because I get the same "point" for being right, but I look more decisive. It decouples the reported number from the actual belief.

  ### 2. The Value of the "Sting"
  Your labmate is arguing that it is unfair for one confident miss to outweigh several cautious hits. Mathematically, she is correct that the log score is unforgiving. Epistemologically, **that is the feature, not the bug.**

  In the context of the replication crisis, the most damaging behavior in social psychology has been **overconfidence**. Researchers have historically treated $p < 0.05$ as "truth" (effectively 95%+ confidence) when the actual replicability was often much lower.

  *   **The Log Score's Lesson:** The log score penalizes surprises. If you say an event is 95% likely and it doesn't happen, that is a massive informational surprise. It indicates your model of the world is significantly more broken than if you said an event was 60% likely and it didn't happen.
  *   **The Information Content:** A forecaster who gets five 55% calls right is demonstrating weak discrimination. A forecaster who gets one 95% call right is demonstrating strong insight. Conversely, a forecaster who gets a 95% call *wrong* has demonstrated a dangerous level of miscalibration. In science, a confident wrong turn is more costly than a hesitant correct one, because it misleads the field more severely.

  ### 3. What You Would Be Giving Up
  If you adopt your labmate's rule, you lose three critical things:

  1.  **Resolution:** You can no longer distinguish between a shaky finding and a robust one. Under her rule, a result everyone thinks is a coin flip (0.51) is weighted the same as a result everyone thinks is law (0.99). This erases the nuance your exercise is designed to capture.
  2.  **Calibration Feedback:** The goal of this exercise is to train you to be better scientists. You need to learn if you are the type of researcher who consistently overestimates the stability of your effects. The binary rule hides this. You could be 99% confident on ten wrong predictions and 51% confident on ten right ones, and under the binary rule, you have a 50% accuracy rate—the same as a random guesser. The log score would reveal you as catastrophically miscalibrated.
  3.  **Incentive for Humility:** The log score forces you to hedge when you are unsure. The binary rule allows you to "cheap talk" confidence without penalty, as long as you stay on the winning side of the threshold.

  ### 4. A Potential Compromise: The Brier Score
  Your labmate's frustration is not entirely without merit; the log score can have high variance, and a single extreme outlier can dominate a year's ranking, which can feel demoralizing in an *informal* exercise.

  If the group feels the log score is too punitive, the standard compromise is the **Brier Score** (mean squared error).
  *   **Formula:** $(Forecast - Outcome)^2$. (Where Outcome is 1 if it replicates, 0 if it fails).
  *   **Why it helps:** It is *also* a proper scoring rule (it still incentivizes honesty), but it is less harsh on extreme misses than the log score.
      *   *Log Score penalty for 0.95 on failure:* $\approx 3.0$
      *   *Brier Score penalty for 0.95 on failure:* $(0.95 - 0)^2 = 0.9025$
  *   **The Trade-off:** It is slightly less sensitive to extreme probabilities than the log score, but it preserves the incentive structure.

  ### Summary for Your Labmate
  You can tell her this: "The point of this exercise isn't to see who gets the most guesses right; it's to see who best understands the *uncertainty* in our field. If we switch to the 50% rule, we stop measuring confidence and start measuring coin-flips. The log score hurts when we're confidently wrong because that's exactly the mistake we're trying to train ourselves out of. If the log score feels too harsh, we can look at the Brier score, but we can't switch to a rule that makes 51% and 99% the same thing."

  Resist the change. The discomfort she feels is the sensation of learning calibration.
