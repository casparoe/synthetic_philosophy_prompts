prompt: |-
  I'm in a moral responsibility reading group this term, and we just spent two sessions on Strawson's "Freedom and Resentment" followed by Gary Watson's response piece -- the one that leans on the real Robert Harris death penalty case (the guy who murdered those two teenagers in California and then, notoriously, calmly finished one of their hamburgers afterward). Everyone in the group walked away thinking Watson basically dismantles Strawson, but when I tried to reconstruct the argument for my own notes afterward I realized I don't actually understand the mechanics of the objection, just the vibe of it, which is a bad place to be a week before I'm on the hook to present it.

  Here's my best reconstruction, tell me where it goes wrong: Strawson wants to sidestep the free-will skeptic by saying our reactive attitudes (resentment, indignation, gratitude, guilt) aren't the kind of thing that stands in need of, or could even recieve, an external rational justification from outside our human form of life -- they're just a given, and the "objective attitude" (treating someone as an object to be managed or cured rather than someone to be resented) only gets triggered by specific excusing or exempting info ("he didn't mean it," "he's not himself," "he's just a child"), not by the mere truth of determinism in general. Watson's Harris example is supposed to be a problem for this because learning the full horror of Harris's childhood pulls you toward the objective attitude at the exact same moment the horror of what he did is pulling you as hard as possible toward resentment -- and this is apparently supposed to show something worse than "sometimes we feel torn." I think the real claim is that it exposes an asymmetry or instability built into Strawson's own criteria, something about how the very sort of causal/historical story that's always available for literally any wrongdoer, if you dig deep enough, is exactly the kind of story Strawson's own framework treats as exempting -- but I can't state that version of the objection rigorously.

  Could you walk me through the actual logical structure of Watson's challenge (not just the emotional pull of the example) and tell me whether there's a real Strawsonian comeback available? I vaguely remember Jay Wallace tried to patch this up with some "fair opportunity"-type condition in Responsibility and the Moral Sentiments, but I honestly don't remember if that actually blocks Watson's point or just relocates it one level down. Sorry if I'm garbling some of the details -- its been a couple weeks since I did the reading and at this point I'm basically working off memory and my own messy margin notes.
