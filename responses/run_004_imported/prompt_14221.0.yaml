answer: |-
  Good evening. For those of you who don't know, [Partner A] and [Partner B] actually met in a decision theory reading group in grad school. Which is appropriate, because if you look closely, this entire weekend is a masterclass in game theory.

  Now, I'm not going to give a lecture. But I did get into a two-hour argument with a friend recently about what we're actually doing here. He argued that if two people are committed, a wedding is just theatre. He said, "Why not just text everyone 'Hey, we're married' and save the money on catering?"

  And my counter-argument was this: A text message gives us *mutual* knowledge. We all get the text, so we all know they're married. But a wedding ceremony gives us *common* knowledge.

  For the non-nerds in the room, here is the translation: Mutual knowledge is me knowing something in my head. Common knowledge is me knowing it, and seeing *you* know it, and seeing *you* see *me* know it. It's the difference between privately thinking "They're great together," and standing in a room where we all witness each other witnessing their vows.

  Why does that matter? Because humans are coordination machines. We need to know not just that *we* support this marriage, but that *everyone else* supports it too. That shared certainty is what turns a private promise into a public institution. It's what licenses the in-laws to be in-laws. It's what lets us all stop wondering "if" they're committed, and start coordinating on "how" we help them stay that way.

  But here is where my friend was right, and where the theory has to bend to the reality of love. Logic requires perfect rationality. But love isn't rational. And this room isn't a logic puzzle.

  So, I want to use this moment to perform the actual function of the ceremony. I want to say something out loud that I think we all already feel privately, so that for the first time, it becomes true for all of us, together.

  [Partner A], [Partner B], look out at this room.

  We all know you love each other. We've seen it in the quiet moments, the inside jokes, and the way you look at each other when you think no one is watching. But right now, in this light, with this noise, I want us to lock that in.

  I want everyone here to know that everyone else here sees what I see. That [Partner A] makes [Partner B] braver. That [Partner B] makes [Partner A] kinder. And that this room full of people—parents, friends, skeptics, and believers—is now a single network of support that is officially online.

  We are no longer a collection of individuals who hope this works. We are a community that knows, collectively, that it *will* work. We are updating our priors. We are coordinating our attack. We are all in.

  So, if you could raise your glasses.

  To [Partner A] and [Partner B]. May your private joy always be this publicly celebrated. And may you never have to solve a coordination problem without us again.

  To the happy couple!
