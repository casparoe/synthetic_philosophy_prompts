prompt: |-
  Got into this long back-and-forth with my friend Jake last night that's still bugging me. He's got a stupidly long Duolingo streak (400+ days) and admitted that on busy days he just does the bare minimum, sometimes even redoing a lesson he's already mastered, purely to keep the streak counter alive and get that little "streak saved" notification, even though he's not actually learning anything new those days. When I said that seems like it kind of defeats the point of using the app at all, he said the streak and the notification are literally what motivate him and make him feel good about his progress, so as far as hes concerned the app is doing exactly it's job.

  We went back and forth on this for like an hour and neither of us landed a real knockout point. Is Jake actually undermining something important by doing this, or is he just correctly optimizing for the feeling he wants and I'm the one confused about what the app was even supposed to be for in the first place? Feels like there should be a clear answer to this but I can't quite place it, curious what you think.
