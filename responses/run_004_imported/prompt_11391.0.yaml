answer: |-
  This is a profound and necessary complication to introduce into a dissertation on early modern democracy. The tension you identify cuts to the heart of Spinoza's political ontology. To argue the "less comfortable view"—that the exclusion of women is endogenous to Spinoza's system rather than an accidental prejudice—you must demonstrate that his definition of *jus naturale* (natural right) as *potentia* (power) logically necessitates exclusion when combined with his specific physics of the human affects.

  Below is an argument structured for a dissertation context. It contends that Spinoza's exclusion of women is not a failure of application, but a success of his system's internal logic. Consequently, rehabilitating Spinoza for feminist or egalitarian ends requires a metaphysical revision of his theory of right, not merely a correction of his empirical sociology.

  ***

  ### The Metaphysics of Exclusion: Why Spinoza's Naturalism Precludes Sexual Equality

  The standard reading of Spinoza as a proto-egalitarian democrat rests on the *Theological-Political Treatise* (TTP), where democracy is praised as the regime most consonant with natural liberty. However, the mature *Political Treatise* (TP) reframes this claim through a stricter naturalism: right is co-extensive with power (*TP* 2.4). On this account, the exclusion of women in *TP* 11 is not an anomaly grafted onto a democratic theory; it is the rigorous application of a metaphysics where political standing is determined by the capacity to sustain sovereign power. To include women within Spinozist democracy without altering his metaphysics is impossible, because their exclusion is derived from the very definition of right as *potentia*.

  #### 1. Right as Power: The Elimination of Normative Status
  The foundational move of Spinoza's political theory is the collapse of the distinction between *jus* (right) and *potentia* (power). In the state of nature, "each individual has supreme right to do all that he can; in other words, the rights of an individual extend to the utmost limits of his power as it is capable of being" (*TP* 2.4). There is no transcendent moral status (such as Kantian dignity or Christian soul-equality) that grants rights independent of one's capacity to enforce them.

  In the civil state, this logic does not vanish; it is aggregated. The sovereign's right is defined by its power to command obedience and maintain stability. Citizens possess political rights only insofar as their inclusion contributes to the *potentia* of the sovereign body. Therefore, citizenship is not a moral entitlement but a functional designation. If a group's inclusion diminishes the sovereign's power—by introducing instability, faction, or incapacity for rational deliberation—that group, by definition, lacks the "right" to citizenship.

  To argue that Spinoza was merely empirically wrong about women is to assume that women *do* possess the *potentia* for citizenship and Spinoza failed to see it. But within Spinoza's system, *potentia* is not just physical strength; it is the capacity for *concordia* (agreement in nature). If Spinoza can demonstrate that the inclusion of women structurally undermines *concordia*, then they lack the *potentia* required for right, regardless of their intellectual or moral capacities.

  #### 2. The Physics of the Affects and the Problem of *Libido*
  The crux of *TP* 11.4 is not a claim about women's intelligence, but about the affective dynamics between the sexes. Spinoza writes that men and women cannot govern jointly because "we have never seen an example of this." For a modern reader, this is a hasty empirical generalization. For Spinoza, however, history is the laboratory of nature (*natura naturata*). If something has never occurred, it indicates a constraint in the laws of human nature.

  Spinoza locates this constraint in the passions, specifically *libido* and jealousy. In the *Ethics*, sexual desire is treated as a fluctuating passion that often enslaves the mind. In the *TP*, this becomes a political problem. Spinoza argues that if men and women shared political power, the inevitable sexual jealousies and domestic conflicts would bleed into the public sphere, fracturing the sovereign's unity. He posits that men naturally despise women's governance and that women are naturally ruled by passion in ways that prevent the steady adherence to law required for sovereignty.

  Crucially, this exclusion differs from that of servants, children, or foreigners. Those groups are excluded due to *alieni juris* status (being under the authority of another) or temporary incapacity. Their exclusion is accidental; a servant can be freed, a child can mature. Spinoza explicitly frames the exclusion of women as necessary *by nature*. Because the affective conflict between the sexes is rooted in the biological and psychological constitution of humanity (as Spinoza understands it), it is a permanent barrier to the *concordia* necessary for the state's *conatus*.

  Therefore, the exclusion is not a prejudice overlaying the theory; it is a deduction from the theory's physics of affects. If the state is a composite individual whose "right" is its power to persist, and if the inclusion of women (in Spinoza's view) introduces a fatal instability into that composition, then natural right *demands* their exclusion.

  #### 3. Democracy as the Regime of Power, Not Justice
  The difficulty for the "standard picture" of Spinoza is that his defense of democracy is not based on justice, but on power. In the *TTP*, democracy is "most natural" because it minimizes the transfer of right. In the *TP*, democracy is preferable because it is the most stable regime, least likely to provoke rebellion, and best able to harness the collective *potentia* of the multitude.

  However, if the "multitude" includes elements that destabilize the sovereign, the Spinozist logic dictates their removal. Spinoza's democracy is an arithmetic of power. If $A + B > A$, include $B$. If $A + B < A$ (because $B$ introduces internal conflict that weakens $A$), exclude $B$. Spinoza's argument is that Men + Women (in political union) < Men (alone), because the former configuration is plagued by insurmountable passionate conflict.

  Consequently, one cannot appeal to Spinoza's "democratic principles" to include women, because those principles are purely functional. To argue for inclusion, one must argue that women's inclusion *increases* the sovereign's power. But if one accepts Spinoza's premises about the affective incompatibility of the sexes, one must concede they do not. Thus, the barrier is not a lack of democratic will in Spinoza, but the structural limits of his naturalism.

  #### 4. The Impossibility of Merely Empirical Correction
  Many scholars wish to excise *TP* 11 as an unfinished fragment or a cultural blind spot. This is charitable but philosophically insufficient. To claim it is an "empirical mistake" is to assume that Spinoza's theory of right allows for rights to exist prior to their realization in power. It implies that women *have* a right to citizenship which they are currently prevented from exercising.

  But for Spinoza, right *is* the exercise of power. There is no latent right. If women do not govern, and cannot govern (due to the laws of affects), they have no right to govern. To correct Spinoza here is not to update his data (e.g., "actually, queens have ruled successfully"); it is to challenge his metaphysics. One must argue either:
  1.  **Against the Physics of Affects:** That sexual difference does not entail the affective incompatibility Spinoza claims (i.e., jealousy and *libido* can be rationalized or politically managed).
  2.  **Against the Definition of Right:** That natural right is *not* co-extensive with power, but relies on a normative standard of personhood or capacity that exists independently of immediate political efficacy.

  The second option is the more radical and necessary revision. If you adopt the first, you are still working within Spinoza's framework: you are just arguing that women have more *potentia* than he thought. But this leaves the door open for future exclusions. If tomorrow a group is found to lack the *potentia* for *concordia*, Spinoza's logic demands their exclusion.

  To truly defend a universal democracy using Spinoza, you must break the link between *jus* and *potentia*. You must reintroduce a normative threshold for citizenship that is not dependent on the sovereign's calculation of its own stability. This effectively abandons Spinoza's defining naturalist move. It requires importing a moral universalism (perhaps Kantian or Arendtian) that Spinoza explicitly rejected in favor of a realist ontology of power.

  #### Conclusion: The Cost of Rehabilitation
  For your dissertation, the rigorous conclusion is this: Spinoza's exclusion of women is the price of his naturalism. By grounding right in power, he makes political standing contingent on the functional contribution to the sovereign's *conatus*. His belief that women cannot contribute to this *conatus* without destroying it is not an incidental bias; it is a structural deduction from his theory of affects and his definition of sovereignty.

  Therefore, preserving Spinoza's argument for democracy while extending it to women is not a matter of "completing" his project or correcting his sociology. It requires a metaphysical revision of his theory of right. One must decouple political standing from effective power and ground it in a capacity for freedom that exists even when that freedom is not currently exercised or recognized by the sovereign. To do so is to step outside of Spinozism.

  Acknowledging this in your chapter strengthens your analysis. It prevents the anachronistic smoothing of Spinoza's thought and highlights a critical fault line in early modern democratic theory: the tension between democracy as a *moral ideal* of equality and democracy as a *mechanism* of aggregated power. Spinoza chose the latter, and the exclusion of women is the logical cost of that choice.
