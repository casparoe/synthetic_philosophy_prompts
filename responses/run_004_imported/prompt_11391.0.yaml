      *   **The Social Contract/Union:** Individuals transfer power/right to the sovereign to increase their own power/security. The sovereign's right is defined by its power to hold the state together.
      *   **Democracy:** The most natural regime because it minimizes the alienation of right. Citizens obey laws they prescribe to themselves.
      *   **The Exclusion of Women (*TP* 11.3-4):** Spinoza argues women are naturally unequal to men. His evidence is historical/empirical (no record of joint rule). He claims this inequality stems from "passions" (jealousy, etc.) preventing concord.
      *   **The Core Tension:** If right = power, and democracy is the regime where power is most collectively shared, why exclude a group that ostensibly has *some* power? If the exclusion is based on "nature," does that mean their *potentia* is inherently insufficient for citizenship?

  3.  **Formulate the Argument (The "Second View"):**
      *   *Thesis:* The exclusion of women is structurally necessary given Spinoza's identification of right with power and his specific conception of political power as *collective concord* rooted in rational self-interest, which he believes women (due to biological/psychological nature) cannot sustain with men.
      *   *Point 1: The Definition of Right as Power.* It's not just "can they vote?" It's "do they have the power to sustain the sovereign's authority?" If women's nature (as Spinoza sees it) disrupts the *concordia* necessary for the sovereign's power, they have no "right" to citizenship in the Spinozist sense because they lack the *potentia* to maintain the political union.
      *   *Point 2: The Role of Passion vs. Reason.* Spinoza's politics aims to align passions with reason to stabilize the state. He views sexual desire (*libido*) as a particularly destabilizing passion. The cohabitation of men and women in a political sphere is seen as inherently fraught with jealousies that undermine the rational calculation required for democracy.
      *   *Point 3: The Empirical Claim is Metaphysical.* Spinoza's claim that "no nation has ever been governed jointly" isn't just a data point; for him, history reveals the dictates of nature (*natura naturata*). If it hasn't happened, it *can't* happen according to the laws of human nature. Therefore, it's not a corrigible empirical error but a deduction from his physics of human affects.
      *   *Point 4: Implications for Democracy.* Spinozist democracy isn't about moral equality (Kantian dignity); it's about the aggregation of power. If a group's inclusion weakens the aggregate power (by introducing instability), the "democratic" logic dictates their exclusion. Thus, including women requires rejecting the premise that right = power, or redefining power not as stability/concord but something else.

