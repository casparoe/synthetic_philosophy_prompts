      *   *Section 2: The Physics of the Political Body.* The state is a composite individual. Its "right" is its power to persist. Anything threatening its persistence is "outside" its right.
      *   *Section 3: The Specific Case of Women.* Analyze *TP* 11.4. Focus on *libido* and jealousy. Why is this different from other exclusions (servants, children)? Those are temporary/accidental. Women's exclusion is based on a permanent affective conflict.
