answer: |-
  This is a sophisticated dispute that cuts to the heart of how *On Certainty* is received in contemporary epistemology. You and your friend are reenacting a central tension in the secondary literature: the conflict between systematizing Wittgenstein into a positive epistemic theory (Wright) versus reading him as dissolving the need for such theories (Pritchard/standard hinge epistemology).

  Here is an analysis of the substantive divisions between these views, followed by verdicts on exegesis and philosophical defensibility.

  ### 1. Substantive Differences: Entitlement vs. Non-Epistemic Commitments

  Your friend claims the dispute is merely semantic because both views agree hinges are "groundless but not arbitrary." This is incorrect. While they share a negative thesis (hinges lack evidence), they diverge sharply on the positive thesis (what hinges *are* and how they function normatively). The difference is not terminology; it is architectural.

  **A. Location within the "Space of Reasons"**
  *   **The Entitlement Reading (Wright):** This view keeps hinge commitments *inside* the space of reasons. It argues that epistemology is broader than just "evidence." By positing "entitlement" as a distinct species of warrant, Wright preserves the idea that accepting hinges is a *rational* act subject to epistemic norms. Hinges are propositions with truth values, and our acceptance of them is epistemically permissible.
  *   **The Non-Epistemic Reading (Pritchard/Your View):** This view places hinge commitments *outside* the space of reasons. Hinges are not beliefs subject to warrant; they are *ways of acting* or constitutive rules. To call them "warranted" (even non-evidentially) is a category mistake. They are not rational; they are *pre-rational*.

  **B. The Response to Skepticism (The Regress Problem)**
  This is where your specific worry about the skeptic is crucial.
  *   **Entitlement:** When the skeptic asks, "What justifies your entitlement?" the entitlement theorist must answer: "Nothing justifies it; it is a structural precondition." However, because entitlement is framed as an *epistemic status*, the skeptic can legitimately press: "Why is *this* precondition rational and not dogmatism?" The entitlement theorist must provide a philosophical argument for why the entitlement exists (e.g., "without it, cognitive projects fail"). This keeps the door open for philosophical debate about the *scope* of entitlement.
  *   **Non-Epistemic:** When the skeptic asks, "What justifies your commitment?" the non-epistemic reader answers: "The question is nonsensical." Just as you cannot ask for the evidence for a rule of grammar (you use the rule to evaluate evidence), you cannot ask for the justification of a hinge. This reading blocks the skeptic more radically by claiming the skeptic is trying to play a game without the board.

  **C. Normativity and Critique**
  *   **Entitlement:** Because hinges have epistemic status, we can critique them epistemically. We can argue that a specific commitment does *not* qualify for entitlement (e.g., "You are not entitled to believe the earth is 6,000 years old because that does not serve the cognitive project of inquiry in the same way"). It preserves a normative grip on hinges.
  *   **Non-Epistemic:** If hinges are arational practical orientations, it becomes difficult to criticize them without begging the question. If a community has a "riverbed" that includes religious dogma as a hinge, on what grounds can we say they are wrong? Only on pragmatic grounds ("that riverbed doesn't flow"), not epistemic ones.

  **Verdict on the "Semantics" Claim:** Your friend is wrong. The distinction determines whether epistemology can govern hinges (Entitlement) or whether hinges govern epistemology (Non-Epistemic). It changes whether skepticism is *answered* (Entitlement) or *dissolved* (Non-Epistemic).

  ---

  ### 2. Exegetical Verdict: Which fits Wittgenstein's Text?

  **Verdict:** The **Non-Epistemic (Arational) Reading** sits more comfortably with Wittgenstein's actual text in *On Certainty*.

  **Justification:**
  Wittgenstein's primary method in *On Certainty* is therapeutic, not constructive. He is not trying to build a better epistemology (which is what Wright does); he is trying to show why the epistemological demand for justification of hinges is a confusion.

  1.  **Grammar and Rules:** Wittgenstein repeatedly compares hinges to rules of grammar (§96, §105) or the axis of rotation (§152). Rules of a game are not "true" or "warranted"; they are simply the conditions for playing. To say a rule of chess is "entitled" is to misunderstand what a rule is. Wittgenstein writes, "the questions that we ask and our doubts depend on the fact that some propositions are exempt from doubt, are as it were like hinges on which those turn" (§341). He describes their status as *logical* or *grammatical*, not epistemic.
  2.  **Action over Belief:** Wittgenstein emphasizes that certainty is manifested in action, not mental assent. "I act with complete certainty. But this certainty is my own" (§174). "Giving grounds... comes to an end; but the end is not certain propositions' striking us immediately as true... it is our acting, which lies at the bottom of the language-game" (§204). This supports the view that hinges are practical orientations, not propositions with a special epistemic pedigree.
  3.  **The Riverbed Metaphor:** In §§96–99, Wittgenstein describes the "hard" propositions as the riverbed, but notes that they can shift and become fluid over time. If hinges were epistemically warranted (even by entitlement), they would possess a stability derived from that warrant. Wittgenstein suggests their stability is derived from their *use* in the community. This fits the "arational commitment" view better than a stable "entitlement."
  4.  **Anti-Theory Stance:** Wright's entitlement is a *theory* designed to solve the problem of skepticism within analytic epistemology. Wittgenstein explicitly resists theory-building. He wants to show that Moore and the Skeptic are both making the same mistake: treating hinges as empirical propositions. To assign them "entitlement" is to treat them as a special class of proposition, which risks repeating Moore's error of isolating them as knowledge-claims.

  While Wittgenstein is notoriously slippery and resists definitive categorization, the weight of his metaphors (hinges, axis, riverbed, scaffolding) points toward a constitutive, non-epistemic role rather than a normative, epistemic one.

  ---

  ### 3. Philosophical Verdict: Which is More Defensible for a Contemporary Epistemologist?

  **Verdict:** If we set exegesis aside and ask what a contemporary epistemologist should say, the **Entitlement Reading (Wright)** is the more defensible position.

  **Justification:**
  While the Non-Epistemic reading may be more faithful to Wittgenstein, it is less viable as a standalone position in contemporary epistemology for two key reasons: the problem of fideism and the need for normative critique.

  1.  **Avoiding Fideism:** The Non-Epistemic reading risks collapsing into fideism or irrationalism. If hinges are "arational," then a commitment to "Science is reliable" and a commitment to "The Pope is infallible" are on the same footing: both are groundless practical orientations. If they are outside the space of reasons, epistemology loses the ability to distinguish between a rational hinge and an irrational one. The Entitlement reading preserves the ability to make this distinction. Wright argues entitlement is tied to "cognitive projects." We can argue that some hinges (e.g., conspiracy theories) do not actually facilitate successful cognitive projects and therefore do not garner entitlement. This preserves epistemic normativity.
  2.  **Addressing the Skeptic Constructively:** The Non-Epistemic reading tells the skeptic, "Your question is nonsense." While this may be satisfying, it is dialectically ineffective. It essentially opts out of epistemology. The Entitlement reading engages the skeptic on their own turf. It grants that evidence runs out but argues that rationality does not. It allows the epistemologist to say, "You are right that we have no evidence, but wrong that we are therefore irrational." This is a more robust defense of common sense because it accepts the skeptic's constraints (no evidence) while rejecting their conclusion (skepticism).
  3.  **Your Worry about the Regress:** You worried that Entitlement allows the skeptic to ask, "What justifies the entitlement?" However, the Entitlement theorist has a response here. Entitlement is defined as a *non-evidential* warrant. To ask for evidence for an entitlement is to misunderstand the concept, much like asking for the color of a number. The regress stops not because the question is nonsense (as in the Non-Epistemic view), but because the demand is category-inappropriate *within* the expanded epistemic framework. Wright successfully argues that without this structural warrant, *no* belief could be warranted, so the skeptic who demands justification for entitlement undermines their own ability to demand justification for anything.

  **Conclusion:**
  You were right to resist the claim that the dispute is merely semantic. The difference between "arational" and "non-evidentially warranted" determines whether epistemology rules over hinges or hinges rule over epistemology.

  However, while your **Non-Epistemic reading** is the better interpretation of **Wittgenstein** (who wanted to dissolve the problem), your friend's **Entitlement reading** is the better **epistemological theory** (which needs to solve the problem without abandoning normativity). Wittgenstein would likely say your friend is trying to build a house on the riverbed, but if you want to live there, your friend has built the more habitable structure.
