      *   *Evidence for Non-Epistemic:* Wittgenstein constantly compares hinges to rules of grammar (§96, §105), the axis of rotation (§152), the scaffolding (§211). He says they are not "learned via investigation" (§160). He emphasizes *acting* ("I act with complete certainty," §174). He often avoids calling them "knowledge" or even "belief" in the standard sense. The river-bed metaphor (§96-99) suggests fluidity and change based on practice, not static warrant.
      *   *Evidence for Entitlement:* Wittgenstein does talk about them being "reasonable" (§73) or "unreasonable" to doubt. He engages with Moore, who treats them as propositions.
      *   *Verdict:* The Non-Epistemic reading is stronger textually. Wittgenstein's goal is often to dissolve epistemological problems, not solve them with new kinds of warrant. He wants to show that the *demand* for justification is misplaced, not that there is a hidden justification (entitlement).
      *   *Nuance:* Wittgenstein is slippery. He might resist both systematizations. But Pritchard's "arational" feels closer to Wittgenstein's therapeutic aim than Wright's "epistemic systematizing."

  4.  **Deconstruct Task 3: Philosophical Verdict (Contemporary Epistemology):**
      *   *Entitlement Pros:* Keeps epistemology unified. Allows us to say skepticism is *wrong* (rationally) rather than *nonsensical*. Fits well with project pursuit (Wright's cognitive projects).
      *   *Entitlement Cons:* Risks collapsing into dogmatism. If everything fundamental is "entitled," what isn't? Hard to distinguish from proper basicality.
