          *   Why? Because "arational" is dangerous. It leads to fideism. We need to distinguish good hinges from bad hinges (e.g., science vs. conspiracy). Entitlement provides a normative framework to do that. Non-epistemic risks making hinges immune to critique.
          *   Address the User's worry: The skeptic asking about entitlement is making a category mistake *within* the entitlement framework too (entitlement is by definition non-evidential).
      *   *Conclusion:* Summarize. The friend is wrong that it's mere semantics, but the User might be too hasty in dismissing the utility of entitlement for modern theory.

  6.  **Review and Refine:**
      *   *Check:* Did I answer the specific worry about the skeptic asking for justification of entitlement?
