      *   **Constraint:** Justify both verdicts, don't just assert.

  2.  **Deconstruct Task 1: Substantive Differences (Entitlement vs. Non-Epistemic):**
      *   *Entitlement (Wright):* Keeps the framework of epistemology. It says, "Yes, these are beliefs/propositions, and yes, epistemology asks for justification. But there are two kinds of justification: Evidence (internalist/externalist) and Entitlement (structural/pragmatic precondition)." It preserves the *normativity* of epistemology. Hinges are still in the "space of reasons," just at the boundary.
      *   *Non-Epistemic (Pritchard/Standard Hinge Epistemology):* Removes hinges from the framework of epistemology entirely. They are not beliefs subject to truth/falsity or warrant/unwarrant in the standard sense. They are *actions* or *ways of acting*. Epistemic norms don't apply to them.
      *   *Is it semantics?* The friend says "groundless but not arbitrary" covers both.
      *   *Rebuttal:* It's not semantics because it changes *what kind of criticism* is applicable. If it's entitlement, one can argue about the *scope* of entitlement (e.g., does it cover religious hinges?). If it's arational, criticism is pragmatic or therapeutic, not epistemic. It also changes the response to skepticism. Entitlement says "You are rationally permitted to ignore the skeptic." Non-epistemic says "The skeptic is speaking nonsense because they are trying to apply rules outside the game."
