answer: |-
  You have hit on one of the most central debates in normative ethics. Your intuition is shared by many consequentialists; in fact, the move you describe—shifting from **Objective Consequentialism** (maximize actual good) to **Subjective Consequentialism** (maximize *expected* good based on available evidence)—is the standard defense against cluelessness.

  However, philosophers remain worried because the "insurance model" of decision-making breaks down when applied to the specific kind of uncertainty involved in long-term consequences. The problem isn't just that we don't know the future; it's that we lack the epistemic footing to assign the probabilities required for your Expected Value (EV) calculation.

  Here is why the "just use Expected Value" fix is considered insufficient by critics like James Lenman (who popularized the term "cluelessness") and others.

  ### 1. Risk vs. Deep Ignorance
  Your insurance analogy relies on a distinction economists make between **risk** and **ignorance** (or ambiguity).
  *   **Risk:** You don't know the outcome, but you know the probability distribution (e.g., a die roll, or actuarial tables for car accidents).
  *   **Ignorance:** You don't know the outcome, and you have no rational basis for assigning probabilities.

  Cluelessness is a problem of **ignorance**, not risk. When you buy insurance, you have centuries of data. When you ask, "If I save this child from malaria today, will that lead to a future dictator rising to power 80 years from time because of population shifts?" there is no reference class. There is no data.

  If you assign a 1% probability to that outcome, you are essentially making a number up. If the EV calculation rests on arbitrary numbers, the output is arbitrary. Philosophers worry that an ethical theory that requires us to make up probabilities to function is not actually guiding action; it's just dressing up guesses in math.

  ### 2. The Symmetry Problem
  This is perhaps the strongest technical objection to your EV solution.
  Imagine you are considering an action $A$. You know it has good short-term effects. But you are clueless about the long-term ripple effects.
  *   For every plausible chain of events where $A$ leads to a fantastic long-term outcome, there seems to be a symmetrical, equally plausible chain where $A$ leads to a disastrous long-term outcome.
  *   Since you have no evidence to favor one chain over the other, you must assign them equal probability.
  *   When you sum the Expected Value, the massive positive long-term effects cancel out the massive negative long-term effects.

  If the long-term effects cancel out to zero (or undefined), you are left evaluating the action *only* on its short-term effects. But if *every* action is evaluated only on its short-term effects because the long-term effects always cancel out due to cluelessness, then consequentialism collapses into a form of short-sightedism that contradicts its own core premise (that *all* consequences matter).

  ### 3. The Problem of "Swamping" (Pascal's Mugging)
  Conversely, if you *do* manage to assign non-zero probabilities to long-term effects, the sheer scale of the future tends to "swamp" all short-term considerations.
  *   The future could contain billions of lives.
  *   Even a tiny, arbitrary probability (e.g., 0.0000001%) that your action affects the trajectory of civilization for the next million years yields an Expected Value so huge it dwarfs the certain good of relieving suffering today.

  This leads to counter-intuitive results where you should ignore certain, immediate suffering to chase tiny probabilities of influencing the distant future. This is related to **Pascal's Mugging**. If your EV fix allows tiny probabilities of huge impacts to dominate all decision-making, the theory stops being action-guiding for normal human life.

  ### 4. Objective vs. Subjective Morality
  There is a deeper meta-ethical worry here.
  *   **Objective Consequentialism** says: The right action is the one that *actually* produces the best results.
  *   **Subjective Consequentialism** says: The right action is the one that is *rationally believed* to produce the best results.

  Your solution adopts Subjective Consequentialism. Critics argue this abandons the main selling point of consequentialism. The whole point of the theory was to tie morality to the *actual state of the world*, not just our mental states. If we switch to Subjective Consequentialism to solve cluelessness, a well-meaning idiot who calculates EV poorly is acting "rightly," and a genius who calculates EV perfectly but gets unlucky is acting "wrongly."

  Many philosophers feel this severs the link between morality and reality. If two people do the exact same thing, but one had slightly different evidence leading to a different EV calculation, Subjective Consequentialism says they performed different moral acts. Critics find this unsatisfying.

  ### 5. Why it remains "Unresolved"
  Philosophers still treat this as unresolved because there is no consensus on how to handle **non-evidential probabilities**.
  *   **Bayesians** might say you should use "priors" (default probabilities before evidence). But what is the prior probability that saving a life today causes a war in 50 years? There is no logical way to derive this.
  *   **Imprecise Probabilities** suggest we should assign a range (e.g., 0% to 100%) rather than a point value. But if the range is 0 to 100, the Expected Value is undefined, and decision theory breaks down.

  ### Summary
  You are right that **Subjective Consequentialism** (maximizing expected value) is the standard *response* to cluelessness. Most consequentialists do exactly what you suggest.

  However, philosophers remain worried because:
  1.  **Arbitrariness:** We cannot non-arbitrarily assign the probabilities needed for the math to work.
  2.  **Cancellation:** Symmetrical ignorance suggests long-term EV is always zero.
  3.  **Swamping:** If the math does work, the long-term future swamps all present moral concerns.
  4.  **Theoretical Cost:** Switching to "Expected Value" changes the definition of morality from "doing good" to "trying to do good," which many argue is a significant concession.

  So, while your intuition is the *standard defense*, it hasn't fully *dissolved* the worry because the defense introduces new mathematical and meta-ethical problems that are just as thorny as the original objection. The debate has shifted from "We can't know the future" to "We can't quantify our ignorance of the future," which turns out to be almost as difficult.
