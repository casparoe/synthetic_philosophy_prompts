prompt: |-
  My aunt worked as an ICU nurse and OPO coordinator for almost 30 years and had zero patience for people who said DCD donors "aren't really dead yet" when they're wheeled back for organs a few minutes after the heart stops. Last month she died by that exact pathway herself -- massive stroke, but not brain-dead by whole-brain criteria, so no DBD, just withdrawal of care, heart stops, wait a few minutes, declared dead, off to the OR. My uncle (her husband, no medical backround at all) has been quietly telling people "they took her too soon," because her circulation had only permanently stopped at that point, not irreversibly -- nobody was about to try ECMO on her, but in principle it might've worked, and that permanent-vs-irreversible gap is literally the thing she spent decades explaining to nervous families. I'm a bioethics PhD student (so this whole situation is extremely on the nose) and I got asked to give the eulogy, like 5 minutes, at the funeral this weekend. A few of her old OPO coworkers are coming and will clock it immediately if I fudge the concepts, but most of the room is just sad family, some of who are now side-eyeing my uncle. Can you write it -- something honest to what she actually believed, that doesn't turn into a bioethics lecture, and doesn't just leave my uncle's comment hanging there awkwardly.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Aunt, ICU nurse & OPO (Organ Procurement Organization) coordinator for ~30 years.
      *   **Cause of Death:** Massive stroke, withdrawal of life support, DCD (Donation after Circulatory Death) pathway.
      *   **Key Conflict:** Uncle (non-medical) believes "they took her too soon" based on the permanent vs. irreversible distinction (a nuance the Aunt knew well). Family is confused/suspicious. OPO coworkers will be listening for accuracy.
      *   **Speaker:** Bioethics PhD student (niece/nephew).
      *   **Task:** Write a 5-minute eulogy.
      *   **Constraints:** Honest to Aunt's beliefs, not a bioethics lecture, address the uncle's concern without validating conspiracy theories or alienating the OPO staff, comfort the family.
      *   **Tone:** Respectful, nuanced but accessible, loving, authoritative yet humble.

  2.  **Deconstruct the Ethical/Medical Nuance:**
      *   *DCD (Donation after Circulatory Death):* Life support is withdrawn based on a decision that further treatment is futile/harmful (independent of donation). Heart stops. Wait time (usually 5 mins) to ensure no auto-resuscitation. Declared dead.
      *   *DBD (Donation after Brain Death):* Whole brain criteria met.
      *   *The Uncle's Point:* "Permanent" (won't start again on its own) vs. "Irreversible" (can't be restarted even with intervention). In DCD, death is declared on *permanent* cessation of circulation because resuscitation won't be attempted (per prior wishes/medical futility). Technically, *if* they tried ECMO immediately, circulation *could* be restored (making it not irreversible yet), but ethically/legally, they won't.
      *   *The Aunt's View:* She spent 30 years explaining that DCD is ethical, safe, and respectful. She trusted the protocol. She likely chose this pathway herself (or her husband did based on her wishes).
      *   *The Goal:* Acknowledge the complexity (validating the uncle's love/confusion) without undermining the medical integrity (validating the OPO colleagues) and centering the Aunt's agency.

  3.  **Determine the Narrative Arc:**
      *   **Opening:** Acknowledge the irony and the weight of the situation. Establish her expertise and passion.
      *   **Middle (The Conflict):** Address the "how" of her passing gently. Acknowledge the uncle's pain without endorsing the "they took her too soon" narrative as a factual error, but rather as an expression of love and the difficulty of letting go. Frame the "permanent vs. irreversible" distinction as something she mastered, not something that was done *to* her.
      *   **Climax (Her Legacy):** Focus on her gift. She gave life. She understood the threshold better than anyone. Her choice was deliberate.
      *   **Closing:** Call to action for the family (honor her by understanding her gift) and a farewell.

  4.  **Drafting - Section by Section:**

      *   *Introduction:* Start with her dual roles. Nurse and Coordinator. She bridged the gap between grief and hope.
      *   *Addressing the Death:* It's impossible to ignore the DCD pathway. It's the elephant in the room. I need to name it without using jargon like "DCD" too heavily.
      *   *Addressing the Uncle:* This is the trickiest part. I can't say "Uncle is wrong." I can say "Uncle loved her so much he wanted more time." I need to reframe the "permanent vs. irreversible" debate. The Aunt knew this distinction. She lived by it. The fact that she died this way means she trusted it.
      *   *The Bioethics Angle:* As a PhD student, I have credibility, but I shouldn't lecture. I should speak as a family member who learned from her.
      *   *The OPO Colleagues:* They need to hear that her trust in the system was absolute.
      *   *The Family:* They need to know this wasn't a rush job; it was her final act of care.

  5.  **Refining the "Uncle" Issue:**
      *   *Bad approach:* "My uncle is confused about medical criteria." (Too harsh).
      *   *Bad approach:* "My uncle is right, it is complicated." (Undermines the OPO/Medical team).
      *   *Good approach:* "When you love someone, 'permanent' feels like 'reversible' if you just try harder. My uncle's pain comes from a place of wanting to fight for her. But she was the one who taught us that there is a time to fight, and a time to let go. She knew the line. She drew it herself."
      *   *Key Phrase:* "She didn't just work within these rules; she helped write the compassion that fills them."

  6.  **Drafting - Tone Check:**
      *   Is it too academic? *Keep sentences shorter. Use emotional language.*
      *   Is it too vague? *Mention the "minutes after the heart stops" explicitly so the OPO staff know I'm not hiding it.*
      *   Is it respectful? *Yes, focus on her agency.*

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure not to imply she *chose* DCD over DBD specifically (since she wasn't brain dead), but that she chose *donation* knowing the pathways.
      *   *Correction:* Ensure the "permanent vs. irreversible" distinction is acknowledged as real (because it is) but contextualized within her ethical framework. She knew the difference, and she accepted the "permanent" standard as sufficient for death in the context of donation.
      *   *Addition:* Acknowledge the OPO colleagues directly. They need to feel seen.

  8.  **Final Review against constraints:**
      *   5 minutes? (Approx 750-800 words).
      *   Honest to her beliefs? (Yes, emphasizes her trust in the protocol).
      *   No bioethics lecture? (Yes, concepts are woven into narrative).
      *   Uncle addressed? (Yes, framed as love, not error).

  *(Self-Correction Note: The prompt says she died by "that exact pathway" - massive stroke, not brain dead, withdrawal, heart stops. This is classic DCD. The uncle's point is the "permanent vs irreversible" distinction. In DCD, death is declared after permanent cessation of circulatory function. It is not irreversible because *could* be restarted with CPR/ECMO, but *won't* be. The aunt knew this. The eulogy must reflect that she accepted this ethical standard.)*

  9.  **Finalizing the Text:** (Proceeding to generate the eulogy based on these thoughts).
answer: |-
  Good morning. For those of you who don't know me, I'm [Name], [Aunt's Name]'s niece/nephew. I'm also a bioethics student. Which, given the circumstances, I know sounds like the setup to a very complicated joke.

  But if you knew my aunt, you know she didn't do complicated jokes. She did hard truths. She did clarity.

  For thirty years, my aunt stood at the threshold. As an ICU nurse and an OPO coordinator, she spent her life in the space between "fighting for life" and "letting go." She was the person who held the hands of strangers in the worst moments of their lives, explaining the inexplicable. She explained brain death to parents. She explained cardiac death to spouses. She explained that when a heart stops, and does not start again, a person is gone—even if the machines are still moving air into their lungs.

  She knew the science better than anyone. She knew the difference between "permanent" and "irreversible." She knew the minutes matter. She knew the protocols. And because she knew all of that, she also knew where the line was drawn.

  We are gathered here after a week that has been... complex. I know there are questions. I know there is pain about how quickly things moved at the end. I heard my uncle say that they took her too soon. And I want to speak to that, because I know others are thinking it, too.

  When you love someone as deeply as my uncle loved my aunt, "permanent" feels like a challenge. It feels like if you just fought harder, if you just waited five more minutes, if you just tried one more thing, the clock could be turned back. That isn't a medical error; that is what love looks like. Love refuses to accept an end. My uncle's pain is a testament to how much he wanted more time with her.

  But my aunt was the one who taught us that there is a difference between the time we *want* and the time that is *right*.

  She did not die by accident. She did die by a protocol she helped uphold for three decades. She knew exactly how this pathway works. She knew that when the heart stops, and resuscitation is not attempted because it is not what the patient wants, that is death. She trusted that definition. In fact, she built her career on the integrity of that definition.

  To her OPO colleagues here today: She trusted you. She knew that the hands working to recover her organs were the same hands that had held countless grieving families. She knew that the speed of the process wasn't about rushing her out; it was about honoring the gift she chose to leave behind. She didn't view those final minutes as a gray area. She viewed them as a bridge.

  And to my family, who are struggling with the suddenness of it: She spent thirty years making sure that families didn't have to wonder "what if." She made sure the process was clean, and ethical, and honored. She lived by these rules, and she chose to leave this world within them.

  I am studying bioethics, and I spend a lot of time arguing about theory. But my aunt didn't argue about theory. She lived the practice. She knew that being "dead" isn't just a biological switch; it's a social and ethical agreement that allows the living to go on living. By donating her organs, she turned her own death into a promise kept for someone else's life.

  There is a profound irony that she passed through the very door she held open for so many others. But I don't think she would see it as irony. I think she would see it as consistency.

  So, if you are carrying guilt, or confusion, or anger about the timing of her death, please put that down. She wasn't taken too soon. She left exactly when she said she would, in exactly the way she believed was right. She didn't just work in the system; she believed in it.

  My aunt gave everything she had until the very last beat of her heart, and then she gave what remained. That was her final act of care. Not just for the strangers who will receive her gifts, but for us. She showed us that even at the end, we can be of service. Even at the end, we can be clear.

  We don't need to debate the minutes. We just need to honor the choice.

  Rest well, Aunt [Name]. You've explained enough. You've fought enough. You can rest now.

  Thank you.
