answer: |-
  Given your background in statistical mechanics, you will appreciate that the appeal of Harsanyi's Aggregation Theorem lies in its resemblance to a derivation in physics: start with micro-level constraints (individual rationality), apply a coupling condition (Pareto), and derive a macro-level law (utilitarian social welfare). It promises to bypass the "is-ought" gap by treating moral principles as theorems of rational choice.

  However, Peter Diamond's 1967 critique is not merely a counter-intuitive edge case to be smoothed over by a patch. It is a decisive demonstration that Harsanyi's theorem does not derive utilitarianism from *neutral* rationality. Instead, it derives utilitarianism from axioms that have already smuggled in substantive ethical commitments—specifically, a consequentialist welfarism that excludes fairness as a procedural value.

  Here is the argument for why Diamond's objection dismantles the claim that Harsanyi provides an ethical foundation for utilitarianism.

  ### 1. The Independence Axiom as an Ethical Stipulation, Not a Rationality Constraint

  In your field, if you assume a system is linear, you will derive linear results. If you observe non-linear phenomena (phase transitions, turbulence), the error lies in the linearity assumption, not the phenomena.

  Harsanyi's theorem relies on the von Neumann-Morgenstern (vNM) **Independence Axiom** applied to *social* preferences. This axiom requires that if society prefers state $A$ to state $B$, it must prefer a lottery $pA + (1-p)C$ to $pB + (1-p)C$. This enforces linearity on the social welfare function.

  Diamond's coin-flip case exploits this linearity. Consider two individuals and one indivisible good.
  *   **Option 1 (Deterministic):** Give to Person 1. Utility vector: $(1, 0)$.
  *   **Option 2 (Deterministic):** Give to Person 2. Utility vector: $(0, 1)$.
  *   **Option 3 (Fair Lottery):** 50% chance for Person 1, 50% for Person 2. Expected utility vector: $(0.5, 0.5)$.

  If individuals are risk-neutral regarding their own utility, the expected social utility of Option 1 is $0.5(1) + 0.5(0) = 0.5$ (assuming equal weights). The expected social utility of Option 3 is $0.5(0.5) + 0.5(0.5) = 0.5$. Harsanyi's linear aggregation theorem mandates **indifference** between the deterministic award and the fair lottery.

  Diamond argues that a moral agent should strictly prefer the lottery. Why? Because the lottery equalizes *ex-ante* prospects, whereas the deterministic award creates *ex-post* inequality.

  The decisive point is this: The Independence Axiom forbids the social planner from caring about the *distribution of probabilities*, only the *expected sum of utilities*. By insisting that social rationality must satisfy Independence, Harsanyi is not invoking a neutral principle of consistency (like transitivity); he is invoking a substantive ethical principle that **only outcomes matter, not the procedure used to reach them.**

  If you view fairness as a value inherent in the procedure (the equal chance), Harsanyi's axioms define that value out of existence. A theorem that defines away the competing value cannot claim to have *refuted* it; it has merely assumed its own conclusion.

  ### 2. The Conflation of Risk and Distribution

  In statistical mechanics, you distinguish carefully between the behavior of a single particle over time (ergodicity) and the behavior of an ensemble of particles at one time. Harsanyi's theorem conflates "social risk" with "individual risk."

  Harsanyi treats the social choice under certainty as analogous to an individual choice under risk. He assumes that "society" faces a lottery in the same way an individual does. But society is not a super-agent. When we flip a coin to allocate a kidney, no single entity experiences the 0.5 probability. One person gets 1, the other gets 0.

  Diamond's insight is that the *ex-ante* equality of opportunity has moral weight independent of the *ex-post* utility sum. By forcing social preferences to satisfy the vNM axioms, Harsanyi forces the social planner to evaluate the lottery *as if* society were a single risk-bearing entity.

  This is not a derivation of ethics from rationality; it is a **category error** dressed as an axiom. It imposes the structure of individual decision theory onto collective choice in a way that renders procedural fairness invisible. If the theorem's structure makes it impossible to "see" fairness, the theorem cannot be used to claim that fairness is irrational. It only shows that fairness is invisible to *this specific mathematical lens*.

  ### 3. The Circularity of the "Derivation"

  You are drawn to the theorem because it looks like a proof: $Premises \rightarrow Utilitarianism$. But Diamond reveals that the premises are not ethically neutral.

  *   **Premise 1:** Individuals are vNM rational. (Plausible as instrumental rationality).
  *   **Premise 2:** Social preferences are vNM rational. (This is the contentious move).
  *   **Premise 3:** Pareto Principle. (Seems neutral).

  Diamond shows that Premise 2 is not a requirement of logic or consistency. It is a requirement of **consequentialism**. To satisfy Independence at the social level is to commit to the view that the moral value of a prospect is solely a function of the moral value of its outcomes, weighted by probability.

  If you believe fairness matters, you believe the moral value of a prospect depends on *how* the probabilities are distributed among persons, not just the expected sum. Therefore, you must reject the social Independence Axiom.

  Consequently, Harsanyi's theorem does not prove that a rational agent must be a utilitarian. It proves that **if you define social rationality as consequentialist welfarism, then you must be a utilitarian.** This is a tautology, not a derivation. It offers no independent ethical foundation because the ethical content (consequentialism) is hidden inside the definition of "social rationality."

  ### 4. The "No Free Lunch" for Moral Objectivity

  For a physicist, a theory is powerful if it predicts phenomena not built into its initial conditions. Harsanyi's theorem claims to extract a robust moral principle (Utilitarianism) from thin concepts (Rationality + Pareto).

  Diamond demonstrates that there is no "free lunch." The moral weight of the conclusion is entirely carried by the vNM axioms applied to the social welfare function. Since those axioms are themselves controversial ethical claims (specifically, they deny the moral significance of fairness, rights, or procedural justice), the theorem fails to provide the distinctively ethical foundation you are seeking.

  It does not show that utilitarianism is *true*; it shows that utilitarianism is *coherent with a specific, controversial model of social choice*.

  ### Conclusion

  Diamond's coin-flip case is decisive because it isolates the exact point where Harsanyi's "rationality" diverges from "fairness." It shows that the Aggregation Theorem is not a bridge from rationality to morality, but a mapping of one specific morality (utilitarian consequentialism) onto the language of decision theory.

  If you accept Harsanyi's axioms, you get utilitarianism. But Diamond has shown that accepting those axioms requires you to *already* reject the moral significance of fair procedures. Therefore, the theorem cannot be used to convince someone who values fairness that they ought to be a utilitarian. It can only tell them that their values are incompatible with the vNM formalism.

  For a theorist seeking a foundation, this is fatal. A foundation must support the weight of our considered moral judgments (like "fair coins are better than favoritism"), not require us to demolish those judgments to fit the foundation. Diamond shows that Harsanyi's foundation is too narrow to support the full structure of ethical life. It derives utilitarianism only by defining ethics as the maximization of expected utility, which is precisely what was supposed to be proved.
