answer: |-
  **Setting:** *The dimly lit lobby of the Grand Hyatt, during the evening reception of the Society for the Improvement of Psychological Science. Two empty coffee cups sit on a small table between Dr. Elena Rostova (Frequentist, specializing in error statistics and meta-science) and Dr. Julian Thorne (Bayesian, specializing in cognitive modeling and inference).*

  **Thorne:** You know, Elena, every time someone brings up the replication crisis, Bem's "Feeling the Future" papers come up like a ghost at the feast. And inevitably, the conclusion is that p-values are the demon. Wagenmakers' reanalysis is treated as the exorcism. But I worry we're conflating the weapon with the wielder.

  **Rostova:** I was waiting for you to say that. You think the Bayesian reanalysis was the hero of the story?

  **Thorne:** I think it was the necessary corrective. Bem produced p-values hovering around .01 to .05. By conventional standards, that's "significant." But the claim was precognition. The Bayesian analysis showed that even with those p-values, the Bayes Factor was anecdotal at best. It demonstrated a structural flaw: a p-value tells you the probability of the data given the null, but it doesn't weigh that against the probability of the data given the alternative *in a way that accounts for the prior plausibility of the alternative.*

  **Rostova:** That's the standard pitch. "Extraordinary claims require extraordinary evidence." But let's look at the mechanics. Bem didn't just run one t-test. He ran nine studies, dozens of conditions, and analyzed them with a flexibility that would make a contortionist blush. He engaged in optional stopping. He collapsed conditions post-hoc.

  **Thorne:** I'm not denying he p-hacked.

  **Rostova:** Then why do we need Bayes? If you treat Bem's analysis as a valid frequentist test, you're already granting him premises he didn't earn. If you correct the p-values for the multiple comparisons and the garden of forking paths—which is a frequentist correction, by the way—the significance evaporates. The p-value wasn't misleading because of frequentist theory; it was misleading because the error probabilities were miscalculated. You don't need a prior to fix a math error.

  **Thorne:** But suppose he *hadn't* p-hacked. Suppose he pre-registered a single study, N=200, and got $p = .01$. The frequentist verdict is "reject the null." The Bayesian verdict is "the evidence is weak because the likelihood ratio isn't high enough to overcome the prior improbability of time-reversed causality." The p-value treats a fluke in ESP the same as a fluke in a priming study. The Bayes Factor distinguishes them.

  **Rostova:** Does it? Or does it just smuggle the conclusion in through the back door? Let's talk about Wagenmakers' prior. It was a Cauchy distribution centered on zero. It essentially said, "We expect effect sizes to be small, and large effects are increasingly improbable." When you apply that to Bem's data, the BF tanks. But isn't that circular? You're encoding "psi is unlikely" into the prior, then using the prior to prove "psi is unlikely."

  **Thorne:** That's a common objection, but it misunderstands what the prior represents. It's not a dogmatic assertion that psi is impossible. It's a model of what we expect from *psychological interventions* generally. In social psychology, effect sizes are rarely massive. The prior represents background knowledge: centuries of physics say time doesn't run backward, and decades of psych say effects are usually $d < 0.5$.

  **Rostova:** "Background knowledge" is a polite phrase for subjective tuning. If I choose a wider prior—one that says "maybe the effect is large"—the Bayes Factor shifts in Bem's favor. So the conclusion depends on the width of the Cauchy. That makes the result subjective. In the frequentist framework, the Type I error rate is fixed at 5% regardless of my feelings about physics.

  **Thorne:** But that 5% is exactly the problem! If the hypothesis is "magic exists," a 5% error rate is wildly insufficient. Lindley's Paradox shows that with enough power, you can get a significant p-value for a hypothesis that is actually less probable *after* seeing the data than before. The p-value measures consistency with the null, not evidence for the alternative. It asks, "Is this data rare under noise?" It doesn't ask, "Is this data *more* likely under magic than under noise?"

  **Rostova:** And the Bayesian asks, "Is this data more likely under magic than noise, given my prior belief that magic is nonsense?" If your prior is strong enough, no amount of data will change your mind. That's not inference; that's dogma. The frequentist approach says, "If the data is this extreme, and the procedure was sound, we act as if the effect is real." We leave the *belief* to the individual. We control the long-run error rate of the *process*.

  **Thorne:** But science isn't just about long-run error rates; it's about rational belief updating in the specific case. If I see a p-value of .04 for telepathy, and you tell me "in the long run, I'll only be wrong 4% of the time," that doesn't help me decide if *this* specific claim is true. The Bayes Factor quantifies the evidence *in the data*. Wagenmakers didn't just pick a prior to win; they used a default prior that allows for a range of effects but penalizes complexity. Bem's model was "there is an effect," which is vague. The null was "no effect." The Bayes Factor penalizes the vague alternative for spreading its probability too thin.

  **Rostova:** I'll grant you that Bem's alternative hypothesis was ill-defined. That's a failure of specification, not a failure of NHST. But here's my pushback: You criticize the p-value for not incorporating base rates. But where do base rates come from? They come from... previous studies. Analyzed how? Often with p-values. You're building your "objective" Bayesian priors on a foundation of frequentist literature that you claim is broken.

  **Thorne:** *Touché.* But we update. The prior for study two is the posterior for study one. The problem with Bem wasn't just the prior; it was that the likelihood function for psi is so flat compared to the null. Even with a generous prior, the data wasn't diagnostic.

  **Rostova:** Let's press on the "generous prior." If you admit that a different prior yields a different conclusion, you admit the method is sensitive to researcher degrees of freedom—just like p-hacking. We call it "prior-hacking." If I want to prove psi, I choose a prior that puts mass on $d=0.8$. If I want to debunk it, I put mass on $d=0.1$. Who guards the guardians of the prior?

  **Thorne:** We guard them with transparency and sensitivity analysis. You show the BF across a range of priors. Wagenmakers did that. The evidence for psi was weak across almost any *reasonable* prior. A prior that expects $d=0.8$ in a subliminal priming task isn't "reasonable"; it contradicts established theory. The frequentist ignores established theory and looks only at the data generation process. The Bayesian forces you to state how your theory connects to the data.

  **Rostova:** But the frequentist *does* account for theory through design. If the theory is extraordinary, you lower your alpha. You demand $p < .001$. You require replication. The crisis wasn't caused by using $\alpha = .05$ for psi; it was caused by treating $p < .05$ as a binary "truth" stamp without checking if the assumptions held. Bem violated the assumptions of the test. He didn't sample randomly; he stopped when it looked good.

  **Thorne:** And that's where we actually agree. Optional stopping invalidates the p-value. But it *doesn't* invalidate the Bayes Factor. That's the Likelihood Principle. I can look at Bem's data, regardless of his stopping rule, and calculate the likelihood ratio. The evidence is what it is.

  **Rostova:** That's the part I find most dangerous. You're saying the stopping rule doesn't matter. But if I keep sampling until the Bayes Factor hits 10, I can bias the result just as easily as I can bias a p-value. Simulations show that optional stopping *does* inflate false positives in Bayesian terms if you use a decision threshold. You've just shifted the vulnerability from the error rate to the prior sensitivity.

  **Thorne:** You can bias a BF if you treat it like a p-value—with a hard threshold. But if you report the continuous BF, the reader can see the strength. The point isn't that Bayes is immune to manipulation; it's that it separates the *evidence* (the BF) from the *decision* (the prior odds). Frequentism mashes them together into the p-value.

  **Rostova:** I'd argue the p-value is purely about the data generation process. It's a check on the noise. It says, "This signal is loud enough that noise rarely mimics it." It doesn't claim to tell you the probability the hypothesis is true. That's the user's error, not the statistic's.

  **Thorne:** But users *will* interpret it as the probability the hypothesis is true. It's human nature. When Bem said "significant," everyone heard "probably true." The Bayesian framework forces you to confront the fact that $P(H|D) \neq P(D|H)$. By reanalyzing Bem with Bayes, we showed that even if the data was real, it wasn't *diagnostic*.

  **Rostova:** We showed that *if* you assume large effects are unlikely a priori, the data isn't diagnostic. I still maintain that if we simply held Bem to the frequentist standards he claimed to follow—pre-registration, correcting for multiple comparisons—the p-values would have been non-significant. We wouldn't need to argue about the metaphysics of time to reject his paper. We could just point to the inflated Type I error rate.

  **Thorne:** Perhaps. But the Bem case became a parable because it highlighted that "statistical significance" is not "scientific significance." A p-value can be perfect, the design can be pristine, and if the hypothesis is physically impossible, the p-value is still a misleading guide to belief. The Bayesian reanalysis forced psychology to admit that we need to quantify evidence, not just control errors.

  **Rostova:** And the frequentist response is that controlling errors is the only thing we *can* do objectively. Quantifying evidence requires agreeing on priors, which is politics, not math. But... I will concede this: The conversation Bem sparked forced frequentists to be more rigorous about *why* a p-value is valid. We can't just report the number anymore. We have to justify the design.

  **Thorne:** And I'll concede that a "skeptical prior" is not a get-out-of-jail-free card. If the data is strong enough, even a skeptical prior should update. The fact that Bem's data *didn't* move the needle much tells us the data was weak, regardless of the framework.

  **Rostova:** So we agree Bem was wrong.

  **Thorne:** Agreed.

  **Rostova:** We agree that optional stopping is bad.

  **Thorne:** Mostly. I'd say it's irrelevant for the BF, but bad for integrity.

  **Rostova:** *Laughs.* Close enough. We disagree on whether the failure was the tool or the user.

  **Thorne:** I think the tool invited the user to err. The p-value promises a level of certainty it can't deliver about the hypothesis.

  **Rostova:** And I think the Bayes Factor promises a level of objectivity it can't deliver about the prior.

  **Thorne:** *Raises coffee cup.* To uncertainty, then.

  **Rostova:** *Clinks cup.* To keeping the error rates low.
