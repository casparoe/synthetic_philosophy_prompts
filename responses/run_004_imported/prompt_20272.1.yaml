answer: |-
  Good evening, everyone. Thank you for having me. I usually write about science and ideas, so standing in front of a room full of artists feels a bit like a physicist trying to critique a symphony. But I'm honored to be here.

  The board asked me to open with a specific line from W.E.B. Du Bois. In 1926, accepting an honor for Carter Woodson, Du Bois declared: *"Thus all Art is propaganda and ever must be."*

  It is a provocative sentence. It sounds cynical. It sounds like it reduces a photograph to a pamphlet. But having read the full speech this week, I found Du Bois's argument is far stranger and more beautiful than the slogan. He wasn't calling for crude political messaging. He was arguing that Beauty cannot be severed from Truth, and Truth cannot be severed from Right. For Black artists in the 1920s, simply depicting the full truth of their own lives, on their own terms, was a radical act against a culture that preferred caricature. In that context, truth-telling *was* the propaganda.

  However, even in 1926, this was not a settled fact. Many of Du Bois's contemporaries pushed back. They argued that yoking art to any cause, even a righteous one, risks breaking the art itself.

  I know that tension is still alive in this room. In fact, I know at least two of the photographers featured tonight would take issue with Du Bois's premise. They believe their work stands on its own merits, independent of any social utility. And honestly? That debate is not a bug in this system; it is a feature.

  Whether you believe these images are tools for justice or expressions of pure form, they demand the same thing from us: attention. They ask us to look at the world through someone else's lens, to confront what they found beautiful, or troubling, or true.

  So, tonight, I invite you to step into that debate. Look at the work. Argue with Du Bois. Argue with the artists. But mostly, just look.

  Thank you, and enjoy the show.
