answer: |-
  **Setting:** *The foyer of the conference center, late afternoon. The hum of the coffee machine competes with the low murmur of departing attendees. On a small table nearby, three raffle tickets—labeled A, B, and C—sit next to a pile of five-dollar bills, the remnants of the demonstration. ELENA (50s, sharp blazer, orthodox Bayesian leanings) and MARCUS (60s, rumpled sweater, sympathetic to planning theories) stand by the high-top table, watching the volunteer count her losses.*

  **Elena:** Well, that was clean. I haven't seen a money pump executed that smoothly in years. She handed over fifteen dollars to end up with the exact ticket she started with. It's practically a perpetual motion machine of the first kind, only instead of energy, it's utility leaking out of the system.

  **Marcus:** It was smooth, I'll give you that. But I'm not sure it proved what the speaker thinks it proved. We saw a volunteer get nickel-and-dimed, yes. But did we see a proof that her preferences were irrational? Or did we just see a proof that she was myopic?

  **Elena:** Marcus, please. If your preferences cycle—A over B, B over C, C over A—you are vulnerable. It's a dominance argument. If you accept those preferences, you must accept the loss. The only way to avoid the loss is to abandon the cycle. Transitivity isn't just a nice mathematical property; it's a constitutive requirement of rationality. If you violate it, you are literally paying to spin your wheels.

  **Marcus:** I agree she was irrational. I'm just disputing the diagnosis. The standard money-pump argument assumes a specific picture of agency. It assumes the agent assesses her choice at every node in isolation. At node one, she prefers A to B. At node two, she prefers B to C. At node three, she prefers C to A. If you treat every trade as a fresh, independent event, then yes, you get pumped. But why must rationality be local like that?

  **Elena:** Because preferences are supposed to guide choice *now*. If I prefer A to B, and I am offered the trade, rationality demands I take it. If I don't take it because of some "plan" I made five minutes ago, then at this moment, my plan is overriding my preference. But if the plan overrides the preference, then the preference wasn't doing the work. The plan was. And I'd wager the plan is transitive, even if the underlying tastes aren't.

  **Marcus:** That's the move McClennen warned us about. You're trying to save transitivity by kicking the can up to a higher order. "Well, my first-order preferences cycle, but my second-order preference for sticking to plans is transitive." But why think the unit of rational assessment *must* be the second-order plan? Why can't the agent simply be resolute?

  **Elena:** Resolute choice sounds noble, but look at the mechanics. In the demonstration, at the final step, the volunteer held Ticket C and was offered Ticket A plus a dollar cost. She preferred A to C. That was the cyclic preference. To avoid the pump, a resolute chooser would have to say, "I know I prefer A to C right now, but I am going to choose C anyway because I committed to it at the start."

  **Marcus:** Exactly.

  **Elena:** But that means she is choosing an option she currently judges to be worse. She is choosing C, even though, all-things-considered, she prefers A. That's not rationality, Marcus. That's stubbornness. Or worse, it's a disconnect between judgment and action. If "rationality" means ignoring your current best judgment to satisfy a past self, you've changed the definition of the word so much it doesn't bite anymore.

  **Marcus:** You're assuming that "current best judgment" is the only valid metric. But agents exist through time. If I adopt a strategy at $t_1$ that maximizes my expected outcome over the whole sequence, and I stick to it at $t_2$ even though a local trade looks appealing, I am exercising agency. I am treating myself as a temporally extended entity, not a series of time-slices. The money pump doesn't show that cyclic values are impossible; it shows that *sophisticated* choice—where you anticipate your future selves and backtrack—is destructive if you have cycles. Resolute choice avoids that.

  **Elena:** But what grounds the resolution? If at $t_2$ I truly prefer A to C, what rational force does the $t_1$ commitment have? It seems like magic. "I prefer A, but I choose C because I said so." It feels like you're asking the agent to act against her own lights. And regarding Temkin's cases—the whole reason we're entertaining intransitivity is to accommodate cases where "better than" seems to shift based on context. But if you have to bind yourself to a plan to avoid exploitation, aren't you essentially admitting that the "better than" relation *should* have been transitive all along? You're using resoluteness to patch a hole in the logic of value.

  **Marcus:** I'm using resoluteness to respect the logic of value *and* the logic of agency. Take Temkin's pain cases. A slight pain for a long time might be worse than a sharp pain for a short time. But if you make the sharp pain short enough, and the long pain long enough, the comparisons can cycle due to the vagueness of "worse." These aren't arbitrary cycles like the raffle tickets. They reflect genuine evaluative ambiguity. If I say, "Given the vagueness of value, I will adopt a policy of not trading on marginal differences," I am not ignoring my preferences. I am forming a preference *about how to handle* the vagueness.

  **Elena:** But then the preference isn't "A is better than B." The preference is "I will not trade A for B." You've moved the intransitivity from the objects to the actions. And I suspect if we pumped *that*, we'd find the policy preferences are transitive. You're hiding the transitivity in the implementation.

  **Marcus:** Am I? Or are you insisting that all rationality must look like thermodynamics? Closed systems, state functions, path independence. You want preferences to be like energy levels. But decision-making isn't a closed cycle. It's a narrative. The volunteer in there didn't just lose money; she lost dignity. She looked foolish. A resolute chooser doesn't look foolish, because she doesn't complete the cycle. She stops.

  **Elena:** She stops by violating her own ranking! That's my point. If you stop at C when you prefer A, you are admitting that *something else* is ranking A and C differently. Call it "Rationality" or "Plan" or "Dignity." But if that something else is doing the ranking, then *it* must be transitive, or it too can be pumped. You haven't vindicated intransitive preferences; you've just buried them under a transitive meta-preference. You've saved the phenomenon by changing the subject.

  **Marcus:** And you're begging the question by assuming the "meta-preference" has to be a ranking of outcomes. Why can't it be a ranking of *processes*? I can prefer the process of "sticking to my guns" over the process of "maximizing local gain." That preference is transitive. But it allows me to hold intransitive views about the tickets themselves. The money pump argument assumes that the only thing that matters is the final distribution of goods. But for a rational agent, the integrity of the choice sequence matters too.

  **Elena:** Integrity is valuable, I grant you. But if integrity requires you to systematically choose what you deem less valuable in the moment, we have a fractured mind. We have a split between the evaluator and the actor. In physics, if your conservation law requires a hidden variable that you can never measure, you start to worry about the theory. Here, if your rationality requires a commitment that contradicts your current judgment, I worry about the agent.

  **Marcus:** And I worry about an agent who is a slave to the immediate moment. You describe a creature that *must* take the trade if the local preference tilts that way. That's not an agent; that's a mechanism. A thermostat prefers 70 degrees to 69, so it turns on. If you offer the thermostat a deal to turn on for a penny, it takes it. Pump the thermostat, and it pays you until it burns out. Is the thermostat irrational? No, it's just not resolute. It has no capacity for plans. To demand that humans be like the thermostat—always executing the local gradient descent—is to deny the very capacity for planning that makes us rational in the first place.

  **Elena:** (Pauses, picking up Ticket A) So you're saying the money pump is a tax on lack of imagination?

  **Marcus:** I'm saying it's a tax on myopia. The standard argument says: "If you have cyclic preferences, you *must* pay the tax." I say: "If you have cyclic preferences *and* you are myopic, you pay the tax. If you are resolute, you don't." Therefore, the pump doesn't prove cyclic preferences are irrational. It proves myopia is.

  **Elena:** But the cost of resoluteness is that you have to explain why the preference you're violating wasn't the "real" one. If you really preferred A to C, why is it rational to choose C? If you can answer that, you've explained away the cycle. If you can't, you're advocating for akrasia and calling it a strategy.

  **Marcus:** And if you can't explain why a plan formed with a cool head should have less authority than a preference felt in the heat of the trade, you're advocating for impulsivity and calling it coherence.

  *(They stand in silence for a moment. The volunteer has left the room. The tickets remain on the table.)*

  **Elena:** We aren't going to agree, are we?

  **Marcus:** I don't think so. You see the cycle as a flaw in the map of value. I see the pump as a flaw in the theory of the traveler.

  **Elena:** Perhaps. But I still wouldn't want to play cards with you.

  **Marcus:** (Smiling) And I wouldn't want to play cards with someone who thinks a promise is broken the moment a better hand appears. But I'll buy you dinner. I promise to stick to that plan, even if I see a cheaper restaurant on the way.

  **Elena:** Good. Because if you pump me for the cost of the meal, I'm leaving you with the bill.

  **Marcus:** Deal.

  *(They turn toward the exit, the raffle tickets left behind on the table, static and silent.)*
