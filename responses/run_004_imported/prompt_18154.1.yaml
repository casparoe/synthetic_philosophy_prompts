prompt: |-
  My colleague Diane is retiring after thirty-one years and I got roped into giving the toast at her dinner next month. Her whole career has basically been one long defense of Williams-style internalism about reasons -- she's the person half our field cites for the canonical reply to the McDowell line that there must be external reasons out there regardless of what anyone actually cares about. She's also genuinely famous in the department for interupting other people's toasts to point out when an "ought" isn't hooked to anything in the speaker's actual motivational set -- she heckled a colleague's retirement speech for exactly this two years ago. Which is a problem for me, because toasts run on exactly that move: "be more like her," "let her be an example to us all" -- a bare, desire-independent ought, which is precisely what she's spent thirty years arguing is either false or really something else in disguise. Half the room will be former grad students who'll clock this instantly; the other half will be her sister and a couple of college roommates who've never heard the phrase "sound deliberative route" in their lives. Can you write me the actual toast -- five minutes, genuinely moving, and it has to solve the problem rather than dodge it, so that whatever it ends up exhorting people to do is tied to something already sitting in their own S, not just handed down from nowhere.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Retirement dinner for a colleague, Diane.
      *   **Career:** 31 years. Famous for defending Williams-style internalism about reasons (Bernard Williams).
      *   **Key Philosophical Stance:** Internalism about reasons. Reasons must be grounded in the agent's "subjective motivational set" (S). There are no external reasons (no "oughts" independent of what one cares about). She famously critiques the idea of desire-independent obligations.
      *   **The Conflict:** Toasts typically rely on external reasons ("We *ought* to be like her," "You *should* follow her example"). Diane famously heckles this kind of talk (even did so at a retirement speech 2 years ago).
      *   **Audience:** Mixed. Half philosophers/grad students (will spot the irony immediately), half family/non-philosophers (won't get the jargon but need to be moved).
      *   **Constraint:** 5 minutes (approx. 750-850 words spoken at a moderate pace).
      *   **Goal:** Genuinely moving, solves the philosophical problem *within* the toast (doesn't dodge it), ensures any exhortation is tied to the audience's existing motivational sets (S).

  2.  **Deconstruct the Philosophical Problem:**
      *   *Williams' Internalism:* "A has a reason to $\phi$ only if A could reach the conclusion to $\phi$ by a sound deliberative route from the motivations already in A's S."
      *   *The Toast Trap:* "We ought to honor Diane" implies an external reason. If the audience doesn't *care* about honoring Diane, the statement is false (according to Diane).
      *   *The Solution:* I need to show that honoring Diane/being like Diane isn't an external command, but something that satisfies motivations *already present* in the audience's S. I need to frame her legacy not as a duty, but as a resource for their own existing desires/projects.
      *   *Tone:* Warm, witty (acknowledging the irony), sincere, accessible (for the sister/roommates) but precise enough for the grad students.

  3.  **Drafting Strategy - Section by Section:**

      *   **Opening:** Acknowledge the elephant in the room. Address Diane's reputation directly. Make the philosophers smile and the family feel included in the joke.
      *   **The Philosophical Pivot:** Explain the core of her work without jargon (for the family) but accurately (for the students). Connect "internal reasons" to "what makes us tick."
      *   **Reframing the "Ought":** Instead of saying "You *should* be like Diane," say "If you care about X (which you do), then Diane shows you *how*." Connect her life to *their* motivations.
      *   **Personal Tribute:** Highlight her character through the lens of her philosophy. She wasn't just arguing; she was living the truth of clarity and honesty.
      *   **The Closing Toast:** Formulate the actual "cheers" in a way that respects internalism. It's not a command; it's an invitation based on shared values.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. Diane hates toasts. She thinks "ought" implies "can" and "want." So I won't tell you to admire her. I'll tell you why you already do. She spent 31 years saying reasons come from inside. Her life proves it. She cared about truth. If you care about truth, look at her. So, raise a glass if you want to. (Too dry? Needs more heart.)

  5.  **Drafting - Iteration 2 (Adding Warmth and Specificity):**
      Need to mention the heckling incident. It's legendary. Need to explain "Subjective Motivational Set" simply. Maybe call it "what you actually care about."
      *Key Insight:* The toast shouldn't be "We ought to honor her." It should be "Honoring her makes sense because we all care about integrity."
      *Structure:*
      1. Joke about the heckling.
      2. Explain her philosophy simply (No magic duties, just what we care about).
      3. Apply it to her career (She cared about clarity).
      4. Apply it to us (We care about clarity/truth too).
      5. The Toast (An expression of shared motivation, not a command).

  6.  **Refining the Philosophy (Crucial Step):**
      I need to make sure I don't misrepresent Williams/Diane. Williams argues that *external* reason statements are false. So, if I say "You have a reason to celebrate," I must ground it in *their* S.
      *Phrasing:* "I'm not going to tell you that you *ought* to raise a glass." -> "I'm going to suggest that if you value honesty, this glass is already in your hand."
      *For the family:* "She believed you shouldn't pretend to care about things you don't."
      *For the students:* "She rejected the 'moral law' for the 'sound deliberative route.'"

  7.  **Writing the Toast (incorporating the constraints):**
      *   *Word Count Check:* 5 mins is roughly 750 words.
      *   *Tone Check:* Needs to be affectionate.
      *   *The "Heckle" Moment:* Acknowledge it early to diffuse tension.
      *   *The "S" (Motivational Set):* Refer to it as "what drives us" or "what we hold dear" for the laypeople, but use the term "motivational set" once for the philosophers.

  8.  **Final Polish:**
      *   Make sure the ending lands emotionally.
      *   Ensure the philosophical solution is clear: The reason to celebrate is *internal* to the audience's love for Diane/truth.
      *   Check for jargon balance. (Explain "sound deliberative route" briefly).

      *(Self-Correction during drafting)*: I initially thought about making it very technical. No, the sister needs to cry, not scratch her head. The philosophy must serve the emotion, not vice versa. The "solution" is that the toast validates *their* feelings, rather than imposing a duty.

      *Revised Plan:*
