answer: |-
  Good evening, everyone. For those who don't know me, I'm a colleague of Diane's. And for those who *do* know me, you know I'm taking a significant risk standing here.

  Two years ago, at Mark's retirement, Diane famously interrupted the keynote speech to point out that the speaker had no grounds for claiming the department "ought" to support the new initiative, because the claim wasn't anchored in anyone's actual motivations. She was right, obviously. Mark still teases her about it, though I notice he never invites her to speak at his grant launches.

  So, I want to be very careful tonight. I am not going to stand here and tell you that we *ought* to honor Diane. I am not going to say you *should* feel grateful, or that it is your *duty* to raise a glass. Diane has spent thirty-one years teaching us that there is no such thing as a reason for action that floats free of what we actually care about. There is no moral skyhook. There is only what Bernard Williams called the "subjective motivational set"—the messy, complex web of desires, projects, and commitments that actually make us tick.

  If I told you that you have an external obligation to celebrate Diane, and you didn't actually care about her, then according to her life's work, I would be lying. And Diane hates lying almost as much as she hates bad arguments.

  But here is the thing about Diane. Her career wasn't just a defense of internalism; it was a demonstration of it. She argued that a reason must be reachable by a "sound deliberative route" from what is already in your heart. And when I look around this room, I see that the reason to celebrate her is already there. It doesn't need to be imposed from the outside.

  To the philosophers in the room: We cite Diane because she cleared away the fog. She taught us that ethics isn't about obeying abstract laws; it's about being honest about what drives us.

  To Diane's sister, her college roommates, and her family: You might not know the term "internalism," but you know Diane. You know that she never pretended to care about things she didn't. You know that if she showed up for you, it wasn't because "that's what family does." It was because she *loves* you. She spent her life arguing that the only reasons that are real are the ones grounded in love, in curiosity, and in truth.

  So, I am not asking you to do anything new tonight. I am simply pointing out what is already in your motivational set.

  If you value honesty in a world that loves platitudes, then you have a reason to honor Diane.
  If you value a friend who tells you the truth even when it's uncomfortable, then you have a reason to honor Diane.
  If you believe that integrity means aligning your life with what you actually believe, rather than what you're supposed to believe, then you have a reason to honor Diane.

  The "ought" isn't coming from me. It's coming from you. It's coming from the fact that she made us better, clearer, and more honest people, and we *want* to acknowledge that. The reason to toast her is internal to the relationship we have with her.

  Diane, you taught us that we only have reasons to do what connects to who we are. Well, you are who we are. You are in our motivational sets. You are in the way we teach, the way we argue, and the way we care about truth. So, celebrating you isn't a duty. It's the only rational conclusion to a sound deliberative route starting from the fact that we love you.

  So, if you care about truth, if you care about integrity, and if you care about Diane... please join me.

  To Diane. May your retirement be full of reasons that are entirely your own.
