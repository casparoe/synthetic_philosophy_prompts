  Actually, I think there's a subtle issue here. Street's argument isn't just about parsimony in the simple sense. It's about explanatory power. The adaptive link account explains why we have the dispositions we have WITHOUT needing to say anything about moral truth. The tracking account needs moral truth to do explanatory work. Since the adaptive link account can explain everything without moral truth doing work, positing moral truth is explanatorily idle.

