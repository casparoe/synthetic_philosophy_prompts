          5.  Conclusion on the state of the field (not solved, but OSG was a valuable step).

      *(Self-Correction during drafting)*: Make sure not to get too bogged down in the math of Thornley's specific theorem unless necessary. Focus on the *intuition* of the impossibility result: you can't maximize $U$ and also maximize $V$ (where $V$ includes being shut down) without conflict, unless you structure the utility function in a very specific, non-standard way.
      *Also, emphasize the "Rational Human" assumption in OSG. In robotics (user's field), they know humans are noisy. If the robot thinks the human is noisy, it might ignore the switch.*

  6.  **Final Polish:** Check against the user's specific points.
