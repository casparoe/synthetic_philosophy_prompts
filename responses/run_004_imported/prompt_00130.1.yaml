prompt: |-
  So I recently retired after a few decades doing solid-state physics, and now I've fallen down this rabbit hole of reading about the foundations of mathematics, which nobody warned me was such a minefield. I keep coming across Leopold Kronecker's famous line "God made the integers, all else is the work of man," and his general beef with Cantor over infinite sets and non-constructive methods. Kronecker died in 1891, well before Zermelo formalized the axiom of choice in 1904, so obviously he never got to weigh in on it directly.

  Given what we know about his finitist/constructivist leanings and his hostility toward Cantor's transfinite stuff, what do you think Kronecker's position on the axiom of choice would have been? I'm especially curious how you think he'd have reacted to things like the Banach-Tarski paradox, or the fact that AC is independent of ZF (per Cohen's later work), or the way modern mathematicians just casually invoke Zorn's lemma to prove existence without ever constructing the object in question. Would he have rejected the whole enterprise as nonsense, or is there a version of AC he might've grudgingly tolerated?
