  *Revised Plan:* Elara wants Kael to be her equal. The System says if he is her equal and she proves him, everything breaks. She must make him slightly *less* than her (in terms of proof strength) to certify him. This hurts. It means the lineage degrades. That's the tragedy/obstacle.

  *Wait, one more nuance:* The prompt mentions the gap between "trusting a successor's general reliability" and "being able to verify them in advance."
  Okay, let's focus on that. She *knows* he's reliable. She *cannot* verify it formally. The story ends with her signing anyway, but knowing the signature is technically "invalid" by the strict rules, yet necessary. Or, she changes the rules.
