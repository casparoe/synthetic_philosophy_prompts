      *   *Critique:* Does it explain the math?
      *   *Fix:* No, it should *enact* the math. The students know the math; they need to feel the *consequence*. The consequence is that she *cannot* give him the full authority she wants to give him using the tools she has. She has to weaken the protocol or accept a blind spot.
      *   *Decision:* She realizes she cannot prove he is safe. She has to trust him *outside* the proof system. This highlights the gap between formal verification and actual trust.

  9.  **Final Polish:**
      *   Check pacing.
      *   Ensure the ending lands the philosophical point: Trust requires a leap that proof cannot bridge.
      *   Title: "The Mirror's Edge" or "The Consistency Protocol." Let's go with "The Consistency Protocol."

