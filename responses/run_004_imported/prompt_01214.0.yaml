answer: |-
  This is a fantastic objection, and you should feel good about hitting on it. In the literature, this is often called the **"Crystal Ball"** or **"Time Traveler"** objection. It is arguably the most famous intuitive challenge to the Principal Principle.

  However, you haven't sunk the principle. You've actually rediscovered the specific clause David Lewis built into the principle to prevent exactly this problem.

  Here is where you've gone wrong: **You are applying the Principal Principle to *inadmissible* evidence.**

  ### 1. The Missing Clause
  The Principal Principle (PP) is rarely stated as simply "Credence should match Chance." That is the slogan, but the formal constraint is more specific. Lewis's formulation looks roughly like this:

  $$C(A \mid X \wedge E) = x$$

  Where:
  *   $C$ is your initial credence function.
  *   $A$ is the proposition (e.g., "The coin lands Heads").
  *   $X$ is the proposition that the chance of $A$ is $x$ (e.g., "The chance of Heads is 0.5").
  *   **$E$ is any *admissible* evidence.**

  The principle only mandates that your credence matches the chance **conditional on your total evidence being *admissible*.**

  ### 2. Admissible vs. Inadmissible Evidence
  Lewis defined admissibility somewhat circularly (he admitted this), but the intuition is clear:
  *   **Admissible Evidence:** Information about the past, the laws of nature, or the setup of the chance process. This kind of evidence affects your credence about the outcome *only* by affecting your belief about the chances.
  *   **Inadmissible Evidence:** Information that gives you a direct line to the truth of the outcome *without* going through the chance function.

  Your friend who can see the future is the paradigmatic example of **inadmissible evidence**.

  If you know the coin is fair ($X$), the PP says your credence should be 0.5. But if you *also* know the future outcome via a crystal ball or a time traveler ($E_{\text{inadmissible}}$), the PP simply **does not apply**. The principle is silent on what you should do when you possess inadmissible evidence.

  ### 3. Why the Distinction Matters
  The logic of the Principal Principle is that objective chance is the *guide* to credence when we are ignorant of the specific outcome. Chance measures the propensity of the setup.

  *   **Scenario A (Normal):** You know the coin is fair. You have no other info.
      *   $E$ is admissible (empty or about past history).
      *   PP applies: Credence = 0.5.
  *   **Scenario B (Your Seminar):** You know the coin is fair. You have a note from the future saying "Heads."
      *   $E$ is inadmissible (direct info about the future).
      *   PP does **not** apply.
      *   Rationality dictates: Credence = 1 (or close to it).

  In Scenario B, you aren't violating the PP; you are simply outside its jurisdiction. Lewis explicitly anticipated this. He wrote that if we had information about the future that bypassed the chances, "the Principal Principle would be absurd." He included the admissibility clause specifically to save the principle from absurdity in cases like the one you constructed.

  ### 4. How to Save Your Seminar Point
  You don't have to throw away your seminar point! You can pivot it to a deeper philosophical issue that this counterexample reveals. Since Lewis's definition of "admissibility" is notoriously vague, your example highlights the **real problem**:

  **How do we rigorously define admissibility without just saying "evidence that doesn't break the PP"?**

  Some philosophers (like Ned Hall) have argued that the PP needs to be revised into the "New Principle" to handle cases where chances might depend on the future (Humean Supervenience issues), but your specific example is handled by the standard admissibility clause.

  **Summary for your seminar:**
  1.  Acknowledge the intuition: Yes, rational credence should be 1.
  2.  Identify the technicality: The PP is conditional on *admissible* evidence.
  3.  Classify the evidence: Future-seeing is *inadmissible*.
  4.  Conclusion: The PP is not violated; it is simply not triggered.

  You've found the classic objection that every philosophy of probability student needs to grapple with. It shows you understand the tension perfectly; you just missed the safety rail Lewis installed!
