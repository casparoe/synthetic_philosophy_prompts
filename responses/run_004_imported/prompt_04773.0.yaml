          *   *Weakness:* Doesn't fully explain *how* to compute the counterfactual, just *why* we need it.
          *   *Verdict:* Marcus wins this exchange. He correctly identifies that Elena's objection assumes logical omniscience, which is incompatible with embedded agency.

