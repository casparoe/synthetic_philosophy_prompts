      *   *Check:* Part (c) is the big one. If the student says Stalnaker gave up truth conditions, they missed the main dialectic. Adams = No Truth Conditions. Stalnaker = Truth Conditions (but restricted logic/probability). This distinction is usually the *point* of the week. I need to be firm here.

