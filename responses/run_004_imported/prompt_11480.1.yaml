prompt: |-
  I'm a cognitive science PhD student and somehow got talked into being the grad rep on my university's exam accommodations appeals committee this year. We've got a case that's been stuck in committee limbo for weeks and I have to draft the recommendation memo before we reconvene next Tuesday. Here's the situation: an undergrad in one of the intro cognition courses has a documented brain injury that lets her learn things fine in the moment but makes it really hard for her to reliably hold onto new information for more than a few days. Disability services already approved the standard accommodations (extra time, a quiet room), but now she's requesting something the policy doesn't cover: permission to use, during closed-book exams, a running notes file she's kept and added to for three years, searchable in plain language, which she says she now relies on more than her own memory at this point.

  Two of the faculty on the committee want to deny it outright, arguing a closed-book exam exists to test what's actually in the student's head and this just smuggles in an open-notes exam under a different name. But the committee chair, who almost went into philosophy of mind before switching to comp neuro, keeps bringing up some old thought experiment about a man with Alzheimer's who uses a notebook in place of his own memory, and argues that if you take it seriously, her file might not be so different from her own recall. I dont know what to make of that, honestly, it feels like its tracking something real but also like it could be used to justify basically any device in an exam room. Could you draft the actual memo I'd bring to the committee, one that lands on a specific recommendation (approve, deny, or approve with conditions), gives the two skeptical faculty reasons they'd actually have to engage with rather than just restating the disability policy, and is upfront about whether it matters that she searches the file with something AI-ish rather than just scrolling or ctrl-F-ing through it?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Cognitive Science PhD student, Grad Rep on Exam Accommodations Appeals Committee.
      *   **Task:** Draft a recommendation memo for a stuck case.
      *   **Case Details:** Undergrad in Intro Cognition. Documented brain injury (anterograde-like amnesia/retention issue: learns in moment, can't hold > few days).
      *   **Current Accommodations:** Extra time, quiet room (standard).
      *   **Requested Accommodation:** Use of a personal, 3-year running notes file (searchable, plain language) during closed-book exams.
      *   **Conflict:**
          *   *Faculty Skeptics:* Closed-book = test what's in the head. This is open-notes in disguise. Violates policy.
          *   *Committee Chair:* References a thought experiment (Otto & Clark's "Extended Mind" / Alzheimer's notebook). Argues the file *is* part of her memory/cognition.
          *   *User's Concern:* Feels real but slippery slope (any device?). Needs to address the "AI-ish" search aspect.
      *   **Requirements:** Specific recommendation (Approve, Deny, or Conditional), address skeptical faculty with substantive arguments (not just policy), address the AI/search issue, professional tone suitable for a committee.

  2.  **Deconstruct the Philosophical/Pedagogical Core:**
      *   *The Chair's Argument:* This is clearly referencing Andy Clark and David Chalmers' "The Extended Mind" (1998), specifically the "Otto and Inga" thought experiment. Otto has Alzheimer's and uses a notebook to store information he would otherwise forget. They argue the notebook is functionally equivalent to biological memory.
      *   *The Skeptics' Argument:* Assessment validity. If the learning objective is "recall and synthesis from biological memory," external aids invalidate the measure.
      *   *The Cognitive Science Angle:* As a CogSci PhD student, the user is uniquely positioned to bridge this. The core question is: *What is the construct being measured?* Is it "retrieval from long-term storage" or "application of cognitive principles"?
      *   *The "AI-ish" Search:* If she uses natural language search (semantic search) vs. keyword search, does that change the cognitive load? Semantic search offloads *retrieval* more than keyword search. This needs nuance.

  3.  **Determine the Recommendation:**
      *   *Deny:* Ignores the disability's specific impact (retention vs. comprehension). Risks discrimination/legal challenge. Doesn't engage with the CogSci argument.
      *   *Approve Unconditionally:* Risks the slippery slope the user fears. Might violate course learning objectives if "recall" is essential.
      *   *Approve with Conditions:* The sweet spot. Acknowledges the "Extended Mind" argument but safeguards academic integrity. Limits the scope of the notes and the search functionality to ensure the *application* is still being tested, even if *retrieval* is aided.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation immediately (Approve with Conditions).
      *   **Case Background:** Briefly summarize the student's profile and the request.
      *   **Analysis of Objections (The "Meat"):**
          *   *Addressing the Skeptics:* Don't just say "policy." Argue about *Construct Validity*. If the course tests "application of theory," does it matter where the theory comes from? Distinguish between *storage/retrieval* (impaired) and *processing/reasoning* (intact).
          *   *Addressing the Chair:* Validate the "Extended Mind" (Otto/Inga) reference but ground it in assessment policy. It's not about metaphysics; it's about leveling the playing field.
          *   *The "AI/Search" Issue:* This is crucial. Keyword search (Ctrl+F) is a tool. Semantic/AI search is an *agent*. The recommendation should restrict it to keyword/indexed search to prevent the tool from doing the *thinking*.
      *   **Conditions/Implementation:**
          *   Pre-approval of the document.
          *   Search limitations (no generative AI, strict keyword search only).
          *   Scope (only her own notes, no external downloads).
      *   **Conclusion:** Reiterate the fairness and academic integrity balance.

  5.  **Refining the Tone:**
      *   Needs to be academic but decisive.
      *   Needs to show respect for the faculty's concern about standards while educating them on the nature of the disability through a CogSci lens.
      *   Needs to show the Chair their philosophical hunch was right but needs practical boundaries.
      *   *Self-Correction during drafting:* I initially thought about suggesting a take-home exam. But the prompt says "closed-book exams." Changing the format might be outside this committee's scope. Stick to the *materials* allowed.
      *   *Refining the "AI" point:* The prompt says "searchable in plain language... AI-ish." I need to be specific. If she types "What does Baddeley say about phonological loops?" and the AI finds it, that's different than Ctrl+F "phonological." I should recommend restricting to deterministic search (Ctrl+F) to avoid the "agent" problem.

  6.  **Final Review against Constraints:**
      *   Specific recommendation? Yes (Approve with Conditions).
      *   Engage skeptical faculty? Yes (Construct validity argument).
      *   Address AI/Search? Yes (Distinction between retrieval aid vs. reasoning agent).
      *   CogSci perspective? Yes (Extended Mind, memory systems).

  7.  **Final Polish:** Check for clarity, flow, and professional formatting. (Ensure the Otto/Inga reference is explicit so the Chair feels heard, but explained simply for the others).

  *(Self-Correction Note)*: Wait, I need to make sure I don't get too bogged down in philosophy. The faculty skeptics care about *grading*, not metaphysics. I need to frame the "Extended Mind" argument in terms of *functional equivalence* regarding the disability, not just abstract philosophy. The argument is: For her, this notebook *is* her hippocampus. Denying it is like denying a blind student a cane because "we want to test walking."

  Let's write the memo.cw
answer: |-
  **MEMORANDUM**

  **TO:** Exam Accommodations Appeals Committee
  **FROM:** [Your Name], Graduate Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Accommodation Appeal: Student ID [Redacted]

  ### Executive Summary
  This memo recommends **approving the student's request with specific technical and content conditions.** 

  While the request to use a personal notes file during a closed-book exam deviates from standard policy, a blanket denial fails to account for the specific neuropsychological profile of the student's disability. However, unconditional approval risks compromising the construct validity of the examination. The recommended compromise allows the use of the file as a prosthetic memory aid while restricting search functionality to ensure the exam continues to measure cognitive processing rather than information retrieval alone.

  ### Case Background
  The student is an undergraduate in Intro to Cognition with a documented acquired brain injury. The disability specifically impairs long-term consolidation (anterograde-like deficits); she comprehends and encodes information in the moment but cannot reliably retain it beyond 48–72 hours. 

  Disability Services has approved standard accommodations (time, environment), but the student argues these are insufficient because the core deficit is *retention*, not processing speed or distraction. She requests permission to access a personal, three-year "running notes" file during exams. This file is searchable via natural language queries. 

  ### Analysis of Committee Objections

  **1. The "Closed-Book Integrity" Objection (Faculty Skeptics)**
  The primary concern is that this converts a closed-book exam into an open-notes exam, violating the course's learning objectives. 
  *   **Counter-argument:** We must distinguish between the *construct being measured* and the *method of access.* In an Intro Cognition course, the primary learning objectives usually involve the **application** of models (e.g., applying working memory limits to a new scenario) rather than rote **recall** of definitions. 
  *   **Relevance to Disability:** For a neurotypical student, "closed book" tests the integrity of the encoding-retrieval loop. For this student, that loop is physiologically broken. Denying the notes does not test her mastery of cognition; it tests the integrity of her injury. If the goal is to assess her ability to *think like a cognitive scientist*, preventing her from accessing the "data" (notes) she relies on for daily functioning assesses her disability, not her competency.

  **2. The "Extended Mind" Objection (Committee Chair)**
  The Chair has referenced the "Otto and Inga" thought experiment (Clark & Chalmers, 1998), suggesting the notebook is functionally equivalent to biological memory.
  *   **Assessment:** This philosophical framework is useful for understanding the student's experience but is dangerous if applied without limits in an assessment context. While we may accept the notebook as part of her cognitive system for *learning*, an exam is a standardized measurement tool. We cannot fully equate external storage with internal memory because external storage can be indexed and searched in ways biological memory cannot. 
  *   **Conclusion:** We should accept the *spirit* of the argument (the notes are a prosthetic hippocampus) without accepting the *metaphysical equivalence* (the notes are identical to a brain). This justifies allowing the notes, but requires us to regulate *how* they are accessed to maintain fairness relative to neurotypical peers.

  ### The "AI-ish" Search Functionality
  The student proposes using a plain-language search tool (potentially LLM-driven or semantic search) rather than simple keyword matching (Ctrl+F). This is a critical distinction.

  *   **Keyword Search (Ctrl+F):** This is a retrieval aid. It reduces the time cost of finding a term but requires the student to know *what* term to look for. This places the cognitive load on **recognition and selection.**
  *   **Semantic/AI Search:** If the student types "How does Baddeley explain the phonological loop?" and the system retrieves the answer, the tool is performing **retrieval and synthesis.** This offloads the cognitive work the exam is intended to measure.

  **Recommendation on Search:** We cannot permit semantic or generative AI search. This would cross the line from *memory prosthetic* to *cognitive agent.* The accommodation must be limited to deterministic keyword searching within the text of her own notes.

  ### Specific Recommendation: Approve with Conditions

  I move that the committee approves the accommodation under the following strict conditions:

  1.  **File Locking:** The notes file must be submitted to the committee and the instructor 48 hours prior to the exam. It will be converted to a static, non-editable PDF to prevent updates during the exam.
  2.  **Search Restriction:** The file must be viewed in a reader that permits **keyword search only** (e.g., standard PDF reader Ctrl+F). Natural language queries, semantic search, or any generative AI tools are prohibited. The student must know the specific terminology to retrieve the information.
  3.  **Content Scope:** The notes must be verified as the student's own original work accumulated over the term/year. No external lecture slides, textbooks, or downloaded summaries may be embedded in the file.
  4.  **Instructor Oversight:** The course instructor retains the right to review the file to ensure it does not contain worked examples of specific exam problems or answers to previous years' exams.

  ### Rationale for Recommendation
  This approach resolves the stalemate by addressing the core concerns of all parties:
  *   **For the Skeptics:** It preserves the "closed-book" nature of the assessment regarding *reasoning.* The student still must identify the correct concept and apply it; she is not given answers, only access to her own "externalized long-term store."
  *   **For the Chair:** It acknowledges the functional role of the notes as a cognitive prosthetic without opening the door to unrestricted device use.
  *   **For the Student:** It provides access to the information her disability prevents her from retaining, allowing her to demonstrate her actual understanding of the course material.

  ### Next Steps
  If the committee agrees, I will draft the formal notification to Disability Services and the course instructor, outlining the technical requirements for the exam software to ensure the search restrictions are enforceable.

  ***

  **[Your Name]**
  Graduate Representative, Exam Accommodations Appeals Committee
