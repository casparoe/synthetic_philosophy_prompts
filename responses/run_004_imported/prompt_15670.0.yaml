      *   **Point 1: The Attention/Cognition Distinction (The Big One).** Explain Pylyshyn's specific definition. Attention $\neq$ Belief/Desire. Attention is often viewed as part of the perceptual architecture, not the cognitive central system.
      *   **Point 2: Functional vs. Phenomenal Change.** Discuss whether the *appearance* changes or just the *weighting* of signals. Mention the debate between Macpherson, Firestone, and Scholl.
      *   **Point 3: Decisional vs. Perceptal Effects.** Address the possibility that the change happens at the response stage, not the sensory stage (though Carrasco argues against this).
      *   **Point 4: Pylyshyn's Specific Encapsulation.** Clarify that Pylyshyn allows for *visual* modulation (like adaptation) but forbids *conceptual* modulation.
      *   **Point 5: The "New Look" vs. "New Wave".** Contextualize the debate historically.
      *   **Conclusion:** Summarize why it remains open (definitions, mechanisms, and the specific nature of "cognition").

  5.  **Drafting the Content (Iterative refinement):**
