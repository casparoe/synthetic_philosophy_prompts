answer: |-
  This is a classic debate in probability and decision theory, and your observation that Priya's approach "wipes people out eventually" is the smoking gun.

  Priya is making a fundamental category error between **Arithmetic Expected Value** and **Geometric Growth**. Dave is almost certainly using the **Kelly Criterion** (or a fractional variant), and his "shading" is a well-documented, mathematically principled adjustment for estimation error.

  Here is the breakdown of why Dave is right, why Priya is wrong, and why her strategy leads to ruin despite having positive EV on every individual bet.

  ### 1. The Trap: Arithmetic vs. Geometric Mean
  Priya's argument is: *"Work out whatever % maximizes your expected winnings over many bets."*

  If you maximize the **Arithmetic Expected Value** of each bet, you should bet 100% of your bankroll on any wager where you have an edge.
  *   **Example:** A coin flip where you win 2x your money on Heads (50% chance) and lose your stake on Tails (50% chance).
  *   **EV:** $(0.5 \times 2) + (0.5 \times -1) = +0.5$. This is massively +EV.
  *   **Priya's Play:** Bet 100% of bankroll.
  *   **Outcome:** On the first Tails, you have \$0. You cannot bet again. Your long-term growth rate is negative infinity.

  In repeated betting with a finite bankroll, what matters is the **Geometric Mean** (compounding), not the Arithmetic Mean. To maximize the long-term growth rate of your bankroll without going broke, you must maximize the expected value of the **logarithm of your wealth** (Log Utility).

  If Priya's friends are getting wiped out, it's because they are overbetting relative to their edge. In probability theory, if you bet above a certain threshold (the Kelly limit), your expected *log* wealth becomes negative, meaning you will almost surely go to zero over infinite trials, even if every bet is +EV.

  ### 2. Dave's Formula: The Kelly Criterion
  Dave is likely using the Kelly Criterion. The formula calculates the exact fraction of your bankroll to wager to maximize long-term geometric growth.

  $$f^* = \frac{bp - q}{b}$$

  Where:
  *   $f^*$ is the fraction of bankroll to bet.
  *   $b$ is the net odds received (e.g., if you bet \$1 to win \$2, $b=2$).
  *   $p$ is the probability of winning.
  *   $q$ is the probability of losing ($1-p$).

  **Why Dave beats Priya:**
  Kelly betting guarantees that your bankroll will never hit zero (theoretically), while maximizing the rate at which it grows. Priya is likely betting "Full Kelly" or higher based on raw EV, which introduces **Risk of Ruin**.

  ### 3. The "Shading": Fractional Kelly
  Dave's most sophisticated point is this: *"He shades that number down even further because he says he's never fully sure of his edge estimate."*

  This is not timidity; it is **epistemic humility**, and it is mathematically vital.

  The Kelly Criterion is optimal *only if you know the true probabilities*. In sports, elections, or nerdy trivia, you do not know the true probabilities; you have an *estimate*.
  *   **The Danger of Overestimation:** If you think you have a 55% edge but actually have 51%, and you bet Full Kelly based on 55%, you are effectively betting *above* the Kelly limit for the true probability. This turns positive growth into negative growth. You will go broke.
  *   **The Safety of Underestimation:** If you bet *less* than Kelly (Fractional Kelly), you sacrifice some growth rate, but you drastically reduce volatility and protect yourself from estimation errors.

  **The Math of Half-Kelly:**
  Betting half the Kelly recommendation ("Half-Kelly") is a standard heuristic among professional gamblers and quants.
  *   It yields **75% of the expected growth** of Full Kelly.
  *   It reduces **volatility by 50%**.
  *   It provides a massive buffer against miscalculating your edge.

  Given that your group is betting on subjective outcomes (elections, trivia) rather than pure probability games (dice, known deck counts), the uncertainty on the edge is huge. Dave's shading is the rational response to that uncertainty.

  ### 4. Utility and "Rationality"
  Since you mentioned being "rationalist-adjacent," this touches on **Utility Theory**.
  Priya is assuming linear utility of money (gaining \$100 is exactly twice as good as gaining \$50). However, for most humans, utility is concave (losing your whole bankroll hurts much more than doubling it helps).

  If the goal of the side-bet is to have fun and stay in the game for future meetups, **survival is a prerequisite for EV.** Priya's strategy optimizes for a theoretical average across parallel universes (Ensemble Average), while Dave's strategy optimizes for your actual trajectory through time (Time Average). In non-ergodic systems (like gambling with a finite bankroll), these are not the same.

  ### Verdict
  **Priya is flawed.** She is maximizing Arithmetic EV, which leads to Gambler's Ruin in repeated play. Her observation that "leaving EV on the table is silly" ignores the EV of *future bets* which become impossible if you go bust.

  **Dave is principled.**
  1.  **Base Formula:** Likely Kelly, which maximizes geometric growth rather than arithmetic expectation.
  2.  **Shading:** Fractional Kelly, which accounts for the variance in his own probability estimates.

  Dave isn't just risk-averse; he is accounting for the **meta-uncertainty** (uncertainty about the uncertainty). In a group of rationalists, the person accounting for calibration error and ergodicity should win the argument. You might want to suggest the group adopts a "Half-Kelly" standard to keep everyone solvent.
