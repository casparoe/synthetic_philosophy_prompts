      *   *Geometric Growth:* To survive and compound, you need to avoid ruin.
      *   *Observation:* The user notes Priya's approach "wipes people out eventually." This is the classic "Gambler's Ruin" scenario. Even with +EV, betting too large a fraction leads to ruin with probability 1 over infinite trials.
