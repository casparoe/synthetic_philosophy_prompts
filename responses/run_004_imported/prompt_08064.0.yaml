      *   **Kelly Criterion:** This is the standard "formula" for optimal bankroll growth in repeated betting. It maximizes the *geometric* growth rate of the bankroll, not the arithmetic expected value of a single bet.
      *   **Risk of Ruin:** Betting too aggressively (Priya's likely approach) leads to a high probability of losing the entire bankroll, even if the long-run average return is high.
      *   **Estimation Error:** Real-world edges are never known with certainty. Overestimating edge leads to overbetting, which is dangerous under Kelly.
