answer: |-
  Here is a toast drafted to be approximately 4 minutes long (around 600 words at a moderate speaking pace). It balances the technical accuracy required for the philosophers with the warmth and accessibility needed for the rest of the guests.

  **Tone:** Warm, slightly self-deprecating, sincere.
  **Props:** A glass of champagne/wine.

  ***

  **The Toast**

  Good evening, everyone. For those who don't know me, I'm [Your Name], [Sister's Name]'s younger sibling.

  When I was asked to give this toast, I felt a specific kind of pressure. Usually, you worry about being funny or touching. But looking around this room, I realize half of you are going to be grading me on my citation accuracy.

  As many of you know, [Sister] is finishing her dissertation on Margaret Gilbert's theory of joint commitment. Her fiancé, [Partner], is in the same program. And I, apparently, am the sibling who decided to take the Collective Intentionality seminar this term. So I know just enough to be dangerous.

  I realized I couldn't stand up here and talk about "shared dreams" or "interlocking intentions" without getting the ontology right. Because in social philosophy, there is a crucial distinction.

  There is the view, often associated with Michael Bratman, where shared action is just two individual intentions happening to line up. "I intend that we walk together," and "You intend that we walk together." It's efficient. It's individualistic. But it has a loophole: if I change my mind, I can just leave. My obligation ends when my intention does.

  But [Sister] has spent the last few years arguing for something deeper. Margaret Gilbert's view of *Joint Commitment*.

  In this picture, when two people commit to a project, they don't just have matching "I's." They create a new entity: a "We." A plural subject. And the crucial feature of this commitment—the part that matters for tonight—is that it creates obligations that **cannot be unilaterally rescinded.**

  Now, I know what the non-philosophers in the room are thinking. That sounds restrictive. "Wait, I can't just change my mind?"

  But I've been watching [Sister] and [Partner] together for a long time, and I've realized that this isn't a bug of marriage; it's the feature.

  If marriage were just Bratman-style interlocking intentions, it would last only as long as it was individually convenient for both parties. It would be a contract of convenience.

  But because it is a Gilbert-style joint commitment, it means that on the hard days—when one person's individual intention falters—the commitment itself holds the line. It means you don't have the right to quit on your own. You have to come to the "We" to dissolve the "We."

  That isn't a cage. It's a safety net.

  It means that when life gets heavy, you aren't two individuals carrying separate loads. You are a single unit of agency. It means that the obligation to love and support each other isn't just a prediction of how you feel today; it is a normative bond that exists *between* you, independent of your fluctuating moods.

  [Sister], [Partner], watching you two, I see this plural subject in action. I see it in the way you finish each other's sentences, sure, but more importantly, I see it in the way you protect the "We" even when the "I" is tired.

  So, I want to propose a toast.

  To the philosophers in the room: May we always recognize the difference between aggregate action and a true plural subject.

  And to everyone else: To [Sister] and [Partner]. May your joint commitment be strong. May your obligations be binding. And may you never try to unilaterally rescind your love for one another.

  To the bride and groom!

  ***

  ### Delivery Notes for the "Dangerous" Speaker:

  1.  **The Philosophy Bit:** When you get to the paragraph starting *"In this picture..."*, slow down slightly. This is the moment the social ontologists will lean in. Make sure you emphasize **"cannot be unilaterally rescinded."** That is the specific phrase they are waiting to hear. If you say it clearly, you pass the Turing test.
  2.  **The Pivot:** When you say *"Now, I know what the non-philosophers in the room are thinking,"* look directly at the non-academic family members (grandparents, aunts, uncles). Smile. This signals to them that you are bringing it back to earth.
  3.  **The Emotion:** The paragraph starting *"That isn't a cage. It's a safety net"* is the emotional core. Don't rush this. This is where you validate the theory as something romantic, not just academic.
  4.  **Timing:** If you find yourself running long during rehearsal, cut the second paragraph of the "Bratman" explanation. You can simplify it to: *"One view says shared action is just two individuals agreeing to walk together. But Gilbert argues you become a 'We'."*
