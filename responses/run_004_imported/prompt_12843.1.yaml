prompt: |-
  Long-time lurker on the rationalist-blogosphere side of the internet (LW, ACX, the whole cluster), and for the past year or so I've been one of five volunteer editors on a small collaboratively-run wiki a few of us started to catalog and rate "conspiracy-ish" claims floating around online -- think a scrappy RationalWiki/Snopes hybrid. Our house style has been pretty firmly generalist: every entry opens with a standard box explaining that claims alleging secret coordination among lots of independent, powerful people get a low prior by default, because big conspiracies are supposedly statistically leaky and tend to collapse within a few years if they're real -- there's a paper, I think by a physicist named Grimes, that actually tries to Fermi-estimate this. That default is now splitting the editor team, and I'm the deciding vote, so I want an outside opinion before I commit to one side.

  The entry in question (I've fictionalized/composited the specifics on purpose so we're not just relitigating an actual news story) concerns a claim that an agrochemical company's own in-house scientists privately flagged a bestselling pesticide as wiping out local pollinator populations years before regulators caught on, based on a couple of leaked internal emails, and that the company then quietly lobbied to slow-walk the follow-up studies. Two editors want the standard debunking box slapped on top, since the claim has exactly the shape our policy exists to flag (secrecy plus coordination plus a powerful institutional actor). The other two think that's question-begging: Big Tobacco, Purdue Pharma, and the VW emissions scandal all had exactly that shape too, right up until the documents surfaced, so "this resembles a conspiracy theory structurally" can't by itself be evidence the claim is false, or we'd have had to call all three implausible the day before they broke. I think this is basically the generalism-vs-particularism debate philosophers have had about conspiracy theories, but its been years since I actually read any of that and I don't trust my memory enough to break the tie myself. Could you draft the memo I'll circulate to the other editors before we hold the tiebreaker vote? I need a real recommendation on how to classify this specific entry, plus criteria the five of us could reuse next time this comes up, and whichever way you land, give the losing side's strongest argument a fair hearing instead of a paragraph of lip service.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Persona:** Long-time rationalist community lurker (LessWrong, ACX, etc.), volunteer editor on a collaborative wiki (RationalWiki/Snopes hybrid).
      *   **Context:** The wiki catalogs/rates "conspiracy-ish" claims. Current house style uses a "default skepticism" box based on the idea that large conspiracies are statistically unlikely to remain secret (referencing Grimes' paper).
      *   **The Conflict:** A specific entry about an agrochemical company suppressing internal research on pollinator decline is splitting the team 2-2.
          *   *Side A (Generalists):* Want the standard skepticism box (large conspiracies are unlikely/leaky).
          *   *Side B (Particularists):* Argue this is question-begging; real scandals (Tobacco, Purdue, VW) looked exactly like this before exposure.
      *   **User's Role:** Deciding vote (tiebreaker).
      *   **Task:** Draft a memo to circulate to the editors before the vote.
      *   **Requirements:**
          1.  Provide a real recommendation on how to classify *this specific entry*.
          2.  Provide reusable criteria for future cases.
          3.  Give the losing side's strongest argument a fair hearing (steelman, not strawman).
          4.  Tone: Rationalist-adjacent (analytical, precise, acknowledging priors and evidence), professional but collaborative.

  2.  **Deconstruct the Philosophical/Epistemic Core:**
      *   *The Grimes Argument:* $P(\text{Secret}) \approx e^{-kt}$. As $N$ (conspirators) increases, probability of leak increases rapidly.
      *   *The Counter-Argument:* Corporate secrecy isn't a "conspiracy" in the paranoid sense (ill-defined, omnipotent), but in the "collusion" sense (defined, limited scope). Tobacco/VW were real. Therefore, structural similarity to a conspiracy theory isn't dispositive.
      *   *The Distinction:* "Conspiracy Theory" (pejorative, implies lack of evidence + grand scope) vs. "Actual Conspiracy" (criminal collusion, limited scope, evidenced).
      *   *The Specific Case:* Agrochemical company. Internal scientists vs. Management/PR. Lobbied regulators. This is *corporate malfeasance*, which is historically common, vs. *global coordination*, which is historically rare.

  3.  **Determine the Recommendation:**
      *   *Which side is stronger?* Side B (Particularists) has the stronger epistemic position *for this specific case*. Why? Because the claim involves a single corporation suppressing internal data, not a global cabal of all scientists and regulators. The "Grimes prior" applies poorly to small-scale corporate cover-ups, which are empirically frequent.
      *   *However,* Side A (Generalists) has a point about *how* the claim is presented. If the claim implies *everyone* knows except the public, Side A is right. If the claim is "Company X hid Data Y," Side B is right.
      *   *Decision:* Recommend classifying this as "Plausible/Under Investigation" *without* the standard "Large Conspiracy Improbable" warning box, *but* with a specific note about the burden of evidence regarding the *scope* of the cover-up.
      *   *Why?* Applying the "Big Conspiracy" prior to corporate malfeasance is a category error. It creates a false negative risk (missing real scandals) that outweighs the false positive risk (crediting a cover-up that didn't happen) in this specific domain.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the difficulty, validate both sides, state the purpose (break the tie, set precedent).
      *   **Epistemic Context:** Briefly touch on the Grimes paper vs. Historical Precedent. Acknowledge the "Generalism vs. Particularism" debate the user mentioned.
      *   **Steelman of the Losing Side (Side A - Generalists):** Why is their caution valuable? Prevents the wiki from becoming a conspiracy catalog. Maintains the "extraordinary claims" standard. Protects against the "boy who cried wolf" effect.
      *   **Steelman of the Winning Side (Side B - Particularists):** Why are they right *here*? Base rates of corporate fraud are higher than base rates of global cabals. The mechanism (internal siloing) is more robust than the mechanism (hundreds of silent people).
      *   **Recommendation (The Verdict):** Don't use the standard box. Use a modified tag.
      *   **Future Criteria (The Policy Update):** This is crucial. How to distinguish "Tobacco" from "Moon Landing"?
          *   *Scope:* How many people need to know?
          *   *Incentive Structure:* Is silence rewarded? (NDAs, employment) vs. Is silence altruistic?
          *   *Evidence Type:* Internal docs vs. Anecdotal pattern-matching.
      *   **Closing:** Collaborative tone.

  5.  **Refining the Tone:**
      *   Needs to sound like a rationalist. Use terms like "priors," "base rates," "steelman," "category error," "epistemic hygiene."
      *   Avoid being authoritarian. It's a memo to peers, not subordinates.
      *   Ensure the Grimes reference is handled accurately (it's about *maintenance* of secrecy over time, not initial concealment).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I give Side A enough credit?
      *   *Fix:* Make sure to emphasize that Side A protects the wiki's credibility. If we label every corporate scandal "plausible," we lose our distinctive value add.
      *   *Critique:* Is the recommendation clear?
      *   *Fix:* Be explicit: "Do not apply Box Type 1. Apply Box Type 2."
      *   *Critique:* Is the distinction between "conspiracy" and "collusion" clear?
      *   *Fix:* Explicitly define the difference in the criteria section.

  7.  **Final Polish:** Check against all constraints in the prompt.
      *   Memo format? Yes.
      *   Recommendation on specific entry? Yes.
      *   Reusable criteria? Yes.
      *   Fair hearing for losing side? Yes.
      *   Rationalist tone? Yes.

  8.  *(Final thought)*: The user mentioned they fictionalized the specifics. I should acknowledge that in the memo to keep the frame consistent.

  9.  **Drafting the Content.** (Proceeds to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Editorial Board, [Wiki Name Redacted]
  **FROM:** [Your Name/Handle]
  **DATE:** October 26, 2023
  **SUBJECT:** Tiebreaker Recommendation: Agrochemical/Pollinator Entry & Policy on Corporate Collusion Priors

  Team,

  As we prepare to cast the deciding vote on the Agrochemical/Pollinator entry, I want to step back from the specific details of the claim (which we've agreed to keep composited for this discussion) and address the underlying epistemic disagreement. We are currently deadlocked 2-2 on whether to apply our standard "High Improbability" warning box (based on the Grimes prior on conspiracy leakage) to this claim.

  This isn't just about one entry; it's about whether our "Generalist" heuristic is becoming a blind spot. Below is my assessment of the arguments, my recommendation for this entry, and a proposed framework for future cases.

  ### 1. The Core Disagreement: Priors vs. Base Rates

  **Side A (The Generalists)** argues that the claim fits the structural definition of a conspiracy theory: a powerful actor coordinating with insiders to suppress truth. They argue that applying the Grimes prior is essential epistemic hygiene. If we don't flag claims requiring silent coordination among scientists and regulators, we risk becoming a catalog of plausible deniability rather than a skeptical resource.

  **Side B (The Particularists)** argues that applying a "global conspiracy" prior to "corporate malfeasance" is a category error. They point out that Tobacco, Purdue, and VW all fit the "secret coordination" structure *ex ante*. To dismiss them based on structural similarity to conspiracy theories is to ignore the base rate of actual corporate fraud, which is significantly higher than the base rate of global cabals.

  ### 2. Steelmanning the Losing Position (Side A)

  I am ruling in favor of Side B for this specific entry (details below), which makes Side A the "losing" position in this vote. However, Side A's argument is vital for the long-term health of this project, and I want to ensure their concerns are codified in our policy.

  Side A is correct that **structural similarity is often the only signal we have.** In the early stages of a claim, we rarely have the "smoking gun" documents. If we waive our skepticism every time a claim involves a corporation, we invite the "Boy Who Cried Wolf" dynamic. There is a massive gradient between "Company X hid a report" and "The entire scientific community is complicit." Side A's insistence on the warning box protects us from sliding down that slope. Their concern is that by making an exception here, we weaken our primary defense against the very conspiracy theories we aim to catalog. They are prioritizing **False Positive avoidance** (don't validate a hoax) over **False Negative avoidance** (don't miss a real scandal). Given our mission, this is a defensible, risk-averse stance.

  ### 3. Recommendation for the Agrochemical Entry

  **Vote:** I am casting the deciding vote **against** applying the standard "High Improbability/Grimes" warning box to this entry.

  **Reasoning:**
  The Grimes paper (*A mathematical model of the sustainability of secrets*) calculates the probability of a conspiracy remaining secret based on the number of conspirators ($N$) and time ($t$). It is highly effective for claims requiring the silence of hundreds of independent actors (e.g., "Climate change is a hoax involving all major universities").

  However, the Agrochemical claim describes **institutional siloing**, not a broad conspiracy.
  1.  **Scope:** The claim requires only a specific chain of command within one company and a few lobbyists to remain silent. It does not require the silence of the regulators who were slow-walked, only their *inaction*.
  2.  **Incentive Structure:** Employees in a corporation are bound by NDAs and employment incentives. This is a mechanically robust form of secrecy that differs vastly from the altruistic or ideological silence required in political conspiracies.
  3.  **Base Rates:** Historical base rates for corporate suppression of internal safety data are high. Historical base rates for "scientists globally faking data" are low.

  Applying the "Big Conspiracy" prior here is a **reference class error**. We are treating a potential corporate tort case like a political coup. Therefore, the entry should be classified as **"Plausible / Evidence Pending"** without the standard disclaimer, though it should carry a note regarding the verification status of the leaked emails.

  ### 4. Proposed Policy Criteria for Future Votes

  To prevent this deadlock from recurring, I propose we amend our House Style guide to distinguish between **Type I (Systemic)** and **Type II (Institutional)** concealment claims.

  **Apply the Standard "Grimes" Warning Box IF:**
  *   **The Scope is Broad:** The claim requires the silence of actors across multiple competing organizations or independent institutions (e.g., "All pharma companies hide cures").
  *   **The Motivation is Ideological:** The secrecy relies on actors acting against their professional or financial self-interest for a "greater cause."
  *   **The Mechanism is Vague:** The claim explains the lack of evidence by alleging a omnipotent ability to scrub data from all sources.

  **Do NOT Apply the Standard Box (Use "Corporate Malfeasance" Tag) IF:**
  *   **The Scope is Contained:** The claim is limited to a single entity or a specific cartel where non-disclosure agreements (NDAs) and employment contracts are the primary enforcement mechanism.
  *   **The Motivation is Financial:** The incentive for silence is direct profit or liability avoidance (the Tobacco/VW model).
  *   **The Evidence is Internal:** The claim relies on leaked internal memos or whistleblower testimony from within the organization, rather than external pattern-matching.

  ### 5. Next Steps

  If this passes, I will draft the updated "Editorial Guidelines on Secrecy Priors" page and link it from the submission template. For the Agrochemical entry, I will draft the intro text to reflect the "Plausible / Evidence Pending" status, explicitly noting that while corporate cover-ups are historically common, the specific leaked documents require independent authentication.

  I believe this approach honors Side A's commitment to skepticism without blinding us to Side B's observation that reality sometimes does look like a conspiracy, specifically when profit is the motive.

  Let me know if you have objections to this framework before I update the guidelines.

  Best,

  [Your Name]
  Lead Editor (Pro Tem)
