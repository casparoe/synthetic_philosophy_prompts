      *   *The Centipede Game:* Two players take turns. At each node, a player can "Take" (end game, get slightly more than opponent) or "Pass" (grow pot, pass turn). Last node: Take is dominant.
      *   *Backward Induction (BI):* Reasoning from the end. If P2 takes at the last node, P1 should take at the second-to-last, etc., leading to P1 taking at the very first node.
      *   *Aumann's Claim (1995/1998):* In games of perfect information, CKR implies the BI outcome. If you know I'm rational, and I know you know, etc., we must play BI.
      *   *Stalnaker's Critique (1996/1998):* The issue is *counterfactuals*. BI requires reasoning about what would happen at nodes that *won't* be reached if BI is followed. If Player 1 passes (deviates), what does Player 2 believe?
          *   *Aumann's implicit assumption:* If a deviation occurs, the deviator is irrational, but does the *other* player remain rational? Does CKR persist? Aumann treats knowledge as factive. If I know you are rational, and you make a move inconsistent with rationality, I have a contradiction. Aumann resolves this by saying the move *couldn't* happen under CKR.
          *   *Stalnaker's point:* To evaluate the decision at node 1, I need to know what you'd do at node 2. But node 2 is a counterfactual world where I passed. In that world, do you still believe I'm rational? If I pass, maybe I'm signaling something. If belief revision isn't handled specifically (e.g., "minimal revision"), BI doesn't automatically follow from CKR alone. You need a specific theory of *conditional belief*.

