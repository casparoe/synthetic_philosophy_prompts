answer: |-
  1. **The Definition of Rationality**
     Critics often accuse resolute choice of playing a semantic game: rather than proving it's rational to pay the driver once you're safe, you're simply stipulating that whatever the "winning disposition" outputs gets labeled as 'rational.' Is resolute choice offering a genuine normative argument for why paying is the right action at the moment of payment, or is it redefining rationality to mean "dispositionally optimal" rather than "action-optimal"?

     *Follow-up (Keyed to her likely defense that rationality applies to plans, not just acts):*
     If rationality applies to the plan rather than the momentary act, how do you handle cases where a resolute plan leads to disaster due to unforeseen circumstances? If I resolutely intend to drive through a storm to keep a promise, but the storm turns out to be fatal, was my resoluteness irrational in retrospect, or does the binding nature of the intention override the outcome entirely?

  2. **Noisy Lie Detection**
     Parfit's original case assumes the driver can predict your behavior with near-infallible accuracy. But in the real world, lie detection is merely probabilistic. If the driver is only 90% accurate, does the obligation to pay remain just as absolute? At what point does the uncertainty of the prediction weaken the requirement for resolute choice?

     *Follow-up (Keyed to her likely claim that you must still be the "type" of person who pays to clear the threshold):*
     If the driver's accuracy drops to 51%—barely better than a coin flip—does the resolute chooser still pay? If you say yes, it seems you're ignoring expected utility; if you say no, doesn't that imply resolute choice collapses into standard causal decision theory once the prediction becomes noisy enough?

  3. **Resolute vs. Sophisticated Choice**
     Sophisticated choice allows an agent to pre-commit but permits them to reconsider at the moment of action if their preferences or information change. Why doesn't resolute choice simply collapse into sophisticated choice once we admit that the agent is physically permitted to reconsider their intention upon arriving in town? What prevents the agent from simply updating their plan when the cost of paying becomes salient?

     *Follow-up (Keyed to her likely argument that the past self has the authority to bind the future self):*
     If the future self has the same cognitive faculties and access to information as the past self, what gives the past self the normative authority to bind them? If the future self genuinely judges that paying is suboptimal *now*, why is it rational for them to ignore their own current best judgment in favor of a past intention?

  4. **Resolute Choice vs. Functional Decision Theory**
     Functional Decision Theory (FDT) also recommends paying the driver in the Hitchhiker case, arguing that you should choose the output of the decision algorithm that leads to the best outcome. Where does resolute choice actually disagree with FDT's verdict here, rather than just redescribing the same outcome in terms of "intentions" rather than "algorithms"?

     *Follow-up (Keyed to her likely distinction that FDT is computational while resolute choice is about agency):*
     If FDT provides the formal calculus for why paying is optimal, is resolute choice necessary as a distinct normative theory? Or is resolute choice merely the phenomenological experience of an agent running an FDT algorithm—meaning it's a description of *how* it feels to decide, not a separate argument for *why* you should?

  5. **Psychological Implementation**
     As a software engineer, I think of pre-commitment as code that throws an exception if you try to deviate from a function. But humans don't have external compilers enforcing their intentions. How does a human agent actually implement "resoluteness" psychologically without external binding mechanisms? Is it a matter of habit, virtue, or something else?

     *Follow-up (Keyed to her likely answer that it is a cultivated virtue or mental habit):*
     If resoluteness relies on cultivated virtue or mental habit, doesn't that make it an unstable foundation for a universal decision theory? If only the "virtuous" can successfully be resolute choosers, does this theory fail to provide action-guidance for ordinary agents who lack that specific psychological discipline?
