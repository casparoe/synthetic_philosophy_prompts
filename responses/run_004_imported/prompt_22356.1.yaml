      *   *Step 2: The "Judgment" Mechanism.* Explain "altering appearances into their causes." This is inference. Shadow = Depth. This is learned. Use the term "unconscious inference" (Helmholtz later coined this, but it fits Locke).
      *   *Step 3: Connecting to Molyneux.* Why does this mean "No"? Because the link between Touch-Shape and Sight-Shadow is arbitrary/learned, not logical/necessary. You need the *history* of correlating them.
      *   *Step 4: Modern Context.* Briefly mention neuroplasticity (as seen with the grandpa) to ground it. Mention Berkeley (who expanded on this) or modern neuroscience (visual cortex) if helpful, but keep focus on Locke.
