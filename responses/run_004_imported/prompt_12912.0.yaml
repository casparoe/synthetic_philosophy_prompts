      *   **Fodor's Modularity:** Perception is encapsulated. It doesn't have access to central beliefs. "The mind is modular."
      *   **The "Theory-Ladenness" Distinction:** Crucial distinction between *perceptual experience* (what it's like to see) vs. *perceptual judgment/belief* (what you think you see). CPP requires the former.
      *   **The "Settled" Claim:** Is the debate settled? No, it's very active.

