      *   *Wait, one more thought:* If I argue for Semantic Vagueness, does it undermine the novel? No, it sharpens it. The conflict is between the character's lived continuity and the logical cutoff points of language.
      *   *Actually, let's pivot.* Arguing for **Ontic Vagueness** (specifically in diachronic identity) is more challenging and perhaps more useful for the writer, provided I handle Evans carefully. But Evans is widely considered a knockout blow by many philosophers. To argue against him requires stepping into fuzzy logic or metaphysical indeterminacy which is controversial.
      *   *Safest bet for a strong argument:* Side with Evans (Semantic/Epistemic) but acknowledge the *phenomenological* reality of the vagueness. It's the "Epistemicist" view (Williamson) or the "Supervaluationist" view. Let's go with a **Conceptual/semantic** verdict. It's more defensible in a short essay.
      *   *Wait, I want to be more provocative.* Let's argue that while Evans is logically sound regarding *identity*, he misses the point about *constitution*. The vagueness isn't in "is $a=b$?" but in "does $a$ constitute the person?"
      *   *Okay, final plan:* I will argue for the **Semantic/Conceptual** view. Evans is right that *identity* cannot be vague. But this doesn't mean the protagonist's anxiety is misplaced. It means "Person" is a vague concept applied to a precise physical history. The verdict: Vagueness is in the map, not the territory.

