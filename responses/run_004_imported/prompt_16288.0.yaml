answer: |-
  Here are two statistical claims regarding a hypothetical country's workforce between 2010 and 2020, analyzed through the strict constraints of Otto Neurath's ISOTYPE system (no scaling of icons, quantity via repetition, no perspective, minimal text).

  ### Claim 1: The Faithful Render
  **"In 2010, there were 10,000 coal miners. In 2020, there were 15,000 coal miners."**

  *   **The ISOTYPE Execution:** You define a standard pictogram of a miner (helmet, pickaxe) where **1 icon = 1,000 workers**.
      *   **2010:** You arrange 10 miner icons in a row or block.
      *   **2020:** You arrange 15 miner icons in a row or block.
  *   **Why it works:** This is the ontological core of ISOTYPE. The system is designed to map *existence* to *picture*. The relationship is one-to-one (isomorphic). The viewer counts the objects to understand the magnitude. It may be "awkward" because counting 15 icons is slower than reading "15k," but the visual truth is faithful: more icons equal more people. No semantic information is lost or distorted.

  ### Claim 2: The Structural Limit
  **"While the absolute number of coal miners *increased*, their *share* of the total workforce *decreased*."**

  *   **The Scenario:** In 2010, there were 10,000 miners out of 100,000 total workers (10%). In 2020, there were 15,000 miners out of 300,000 total workers (5%).
  *   **The ISOTYPE Failure:**
      *   To show the **absolute increase**, you must show *more* miner icons (10 icons → 15 icons). The visual signal here is **GROWTH**.
      *   To show the **share decrease**, the miner icons must occupy a *smaller proportion* of the total visual field representing the workforce.
      *   **The Conflict:** To represent the total workforce faithfully using ISOTYPE rules, the 2020 "total workforce" block must contain 300 icons (3x larger than 2010). The 15 miner icons will visually sit inside a block that is three times the size of the 2010 block.
      *   **The Result:** The viewer sees a larger group of miners (15 vs 10) and a larger total block. Without external aids, the human eye prioritizes the *density* or the *count* of the subject icons. The fact that the miners are now a "smaller slice" is mathematically true but visually contradicted by the fact that the miner group physically grew. To perceive the "decreased share," the viewer must mentally perform a division operation (15÷300 vs 10÷100) that the image does not perform for them.

  ### The Boundary: What Word-Language Supplies
  The second claim fails because strict ISOTYPE lacks **Syntactic Operators for Abstraction**.

  Word language allows us to reify relationships into nouns. We can turn a mathematical operation into a subject: *"The **percentage** declined."* In language, "percentage" is a stable object that can be compared across different contexts.

  ISOTYPE, by contrast, provides **Semantics without Syntax**. It gives you the *objects* (miners, workers) and a *quantifier* (repetition), but it lacks the *logical connectives* to define the relationship between two different sets of objects (Miners vs. Total Workforce) when those sets change scale independently.

  Specifically, Claim 2 requires two things that mere icon arrangement cannot provide:

  1.  **A Fixed Frame of Reference (The Axis):** To see that 15/300 is smaller than 10/100, you need a constant container (a "100%" box) that remains the same physical size for both years. However, ISOTYPE principles generally reject fixed axes or grids because they are abstract "word-like" scaffolding, not pictures of things. If you draw a box around the 2020 data that is 3x larger to accommodate the population growth, you lose the ability to compare proportions visually. If you force the boxes to be the same size, you violate the rule that "icon count = quantity," effectively lying about the total population growth.
  2.  **Pre-Calculated Relations:** Language allows you to state the *result* of a comparison ("decreased share") without forcing the user to witness the raw data of both variables simultaneously. ISOTYPE forces the user to witness the raw data (the icons) and perform the comparison mentally. When the visual signal (more icons) contradicts the statistical reality (smaller ratio), the system breaks.

  **The Precise Boundary:** ISOTYPE can render **ontology** (what exists and how much of it exists). It cannot render **derived metrics** (ratios, rates, percentages) without borrowing the abstract scaffolding of word-language (axes, labels, or legends) to define the denominator. It can show the *parts*, but it cannot show the *whole* as a stable concept against which the parts are measured, if the whole itself is changing.
