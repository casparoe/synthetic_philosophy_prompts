  Good evening, everyone. For those who don't know me, I'm [Your Name]. I have the distinct honor of standing up here today, though I accepted this role under some very specific metaphysical constraints.

  Priya and I are currently working through Peter van Inwagen's *Material Beings* together. And for the half of the room currently checking their phones, that is a book about what objects actually exist. For the other half: Priya has made it very clear that if I say anything suggesting that two things can merge to create a third thing, she will revoke my friendship.

  So, I need to be careful. I cannot say that Priya and [Fiancé's Name] are "becoming one." Because, strictly speaking, there is no "one" to become. There are no composite objects except living organisms. There is no "couple." There is no "wedding party." There are certainly no chairs, no tables, and technically, this microphone is just simples arranged microphone-wise.

  But here is what *does* exist. Priya exists. She is a living organism. Her activity constitutes a life. [Fiancé's Name] exists. He is also a living organism. His activity constitutes a life. And that is actually why we are all here.

  In a world where most things are just scattered particles pretending to be furniture, you two are the real deal. You are genuine composite beings. You are alive. And today, you aren't merging into a new substance. You aren't losing your boundaries. Instead, you are making a promise to coordinate your lives.

  Van Inwagen argues that composition happens only when the activity of some things catches hold of a life. Well, looking at the two of you, I see two lives that have already caught hold of each other. You have aligned your activities. You share your resources. You navigate the world not as isolated simples, but as two distinct organisms moving in profound synchronization.

  To the family and friends who just want to know why I'm talking about particles: What this means, in plain English, is that Priya and [Fiancé's Name] respect each other enough to remain whole. They aren't trying to complete each other, because they aren't puzzles with missing pieces. They are already complete. They are choosing to walk alongside one another.

  And to the philosophy cohort in the back: Yes, I know. I am speaking in the "loose and popular sense" when I refer to this venue. But in the "strict and philosophical sense," I am witnessing two organisms entering a binding social contract amidst a cloud of simples.

  So, my wish for you is not that you build a "life together," as if life is a house you construct. My wish is that your individual lives continue to flourish in each other's presence. May your activities continue to constitute happiness. May you remain distinct, may you remain alive, and may you never stop coordinating your actions with kindness.

  Priya, [Fiancé's Name], you are the only real things in this room that matter. And that is enough.

  Please raise your glasses—which, again, are just simples arranged glass-wise—to the bride and groom.

  To Priya and [Fiancé's Name].
