      *   *The Ending:* She implements the cap. The Mugger vanishes. But then a *real* emergency happens, and she wonders if her cap blinded her. Or, she pays, and wonders if she's just opened the door to infinite muggings.
      *   *Better Ending:* She tries to apply the penalty. The Mugger adjusts the number to be *just* high enough to overcome the penalty. This shows the "arms race" nature of the problem.

