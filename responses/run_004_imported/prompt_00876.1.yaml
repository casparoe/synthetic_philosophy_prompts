      *   *Wait, actually:* The prompt mentions "docking the probability the more conveniently huge... or just putting a hard cap." I should pick one. A hard cap on utility is easier to show the downside of (ignoring real genocide). A complexity penalty is more intellectual. Let's go with the **Complexity Penalty** because the Mugger can argue against it more effectively in dialogue.
      *   *Actually, best option:* Have her try to apply a penalty, have the Mugger circumvent it, then she realizes the only way out is to arbitrarily ignore the math, which terrifies her.

      *(Self-Correction)*: Let's stick to the prompt's suggestion: "docking the probability... or just putting a hard cap." I will use the **Complexity Penalty** (docking probability based on description length) because it allows the Mugger to fight back with "But my message is short."

