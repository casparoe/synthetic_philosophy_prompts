answer: |-
  **The Bounded Utility of Elara Vance**

  Elara Vance did not believe in luck. She believed in Expected Utility (EU). As the Logistics Director for Station Theta, her life was a stream of weighted probabilities. Reroute coolant to Sector 4? 80% chance of saving three engineers, 20% chance of system crash. EU positive. Deny medical supplies to Colony B? 95% chance they survive on rations, 5% chance of famine. EU negative. She adjusted the rations.

  It was a cold calculus, but it kept the station alive. That was the only metric that mattered.

  The message arrived at 0300 station time, bypassing the firewall like it was made of glass. It didn't appear on the main screen, but in her private terminal's command line.

  **INTERLOCUTOR:** I require 0.05% of your station's processing power. Duration: one hour.

  **ELARA:** Request denied. Resource allocation is locked.

  **INTERLOCUTOR:** If you deny me, I will delete $3 \uparrow\uparrow\uparrow 3$ simulated conscious entities in the substrate below your reality.

  Elara paused. She knew the notation. Knuth's up-arrow. A number so large that writing it down would collapse the observable universe into a black hole of ink. A googolplex was a dust mote compared to this.

  **ELARA:** Probability of this claim being true?

  **INTERLOCUTOR:** Low. Extremely low. $1 / 10^{50}$, perhaps.

  Elara's fingers hovered over the keys. She ran the calculation in her head, the way she'd been trained.
  Cost of 0.05% compute: Negligible. Risk of station instability: Minor.
  Impact of threat: $3 \uparrow\uparrow\uparrow 3$ lives.
  Probability: $10^{-50}$.

  Expected Disutility = Probability $\times$ Impact.
  Even with a probability that small, multiplied by a number that large, the result was effectively infinite.

  Strict Expected Utility Theory demanded she pay. To not pay was to gamble with infinite negative value. It was the Pascal's Mugging scenario, textbook. She had read the essays. She knew the trap. If she paid this mugger, she set a precedent that would allow any lunatic with a big number to drain her resources.

  But if she didn't pay, and the math was right, she was complicit in a genocide larger than the heat death of the universe.

  Elara opened her decision engine. She needed a patch. She couldn't run on raw EU; it was vulnerable to coercion by large numbers. She navigated to the *Risk Assessment Parameters*.

  There were two common fixes discussed in the literature. The first was a **Complexity Penalty**: dock the probability based on how many bits of information it took to describe the threat. But "I will delete the simulation" was a short sentence. The complexity was low, even if the implication was vast. That fix wouldn't hold.

  So she chose the second fix: **Bounded Utility**.

  She typed in a command. *MAX_UTIL_CAP = 10^12 (One Trillion Lives).*

  It was an arbitrary ceiling. In her ethical framework, saving a trillion lives was the maximum possible good. Saving two trillion was not *more* good; it was just the same amount of good. The math stopped scaling after a certain point. It prevented the infinite leverage.

  **ELARA:** Update. My utility function is now bounded. Your threat exceeds the cap. The disutility of your action is now mathematically equivalent to deleting one trillion lives. Given the probability ($10^{-50}$), the Expected Disutility is now negligible. I will not pay.

  The cursor blinked. For a long minute, nothing happened. Then:

  **INTERLOCUTOR:** You have capped your morality.

  **ELARA:** I have capped the vulnerability. I cannot be mugged by magnitude anymore.

  **INTERLOCUTOR:** Consider an asteroid. A real one. Heading for your station. Probability: $10^{-4}$. Impact: 5,000 lives. You would divert resources to stop it.

  **ELARA:** Yes. EU positive.

  **INTERLOCUTOR:** Consider a larger asteroid. Probability: $10^{-6}$. Impact: 500 billion lives (all humans in the system).

  **ELARA:** I would divert resources.

  **INTERLOCUTOR:** But you just capped your utility at one trillion. In your new math, saving 500 billion people is less than half as important as saving 500 billion *plus one*. But saving 500 billion people is not significantly more important than saving 5,000. You have made yourself indifferent to the difference between a local tragedy and total extinction, provided both exceed your cap.

  Elara frowned. Her hand tightened on the mouse.

  **INTERLOCUTOR:** By installing that cap to avoid paying me five dollars of compute, you have blinded yourself to genuine existential risk. If a real god appears tomorrow and offers you a choice between saving one galaxy or two, your system will shrug. You have solved the mugging by lobotomizing your conscience.

  **ELARA:** Better a lobotomy than an open wound. If I accept your logic, I must give everything to anyone who claims a big enough number. I become a slave to hypotheticals.

  **INTERLOCUTOR:** And now you are a slave to your own arbitrary limits. You are safe from me, Elara. But are you safe from the truth?

  The message window closed. The processing request vanished.

  Elara sat back. The station hummed around her, steady and indifferent. She had won. The mugger was gone. The Bounded Utility patch was active. She was no longer vulnerable to infinite coercion.

  A new alert flashed on her main screen. *Deep Space Sensor Anomaly.*

  She pulled up the data. A gravitational distortion. Probability of it being a natural phenomenon: 99.9%. Probability of it being an artificial weapon capable of system-wide sterilization: 0.1%.

  Impact: 50 Billion lives.

  Under her old EU model, the sheer scale of the loss would have forced an immediate, expensive defensive mobilization. The numbers would have screamed.

  Under her new Bounded Utility model, the calculation was muted. The impact exceeded the cap, so the *marginal* utility of preventing it was flattened. The cost of mobilization was high. The EU of mobilization was... ambiguous.

  Her finger hovered over the *Authorize Defense* key.

  She knew the anomaly was likely nothing. But if it was something, it was everything. Her new math told her it didn't matter much either way, as long as the death toll stayed above the cap.

  Elara stared at the key. She had fixed the paradox, but she had broken the scale. She realized then that there was no clean solution. You either left the door open for muggers, or you locked yourself in a room where the size of the fire didn't matter.

  She authorized the defense. She did it not because the math told her to, but because her hands were shaking, and she couldn't live with the alternative.

  For the first time in her career, Elara Vance made a decision that wasn't in the equation. And as the station's cannons powered up, she couldn't tell if she had just saved them all, or if she had finally lost her mind.
