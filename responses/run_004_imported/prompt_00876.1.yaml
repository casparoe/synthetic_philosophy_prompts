      *   *Decision:* Let's go with a near-future sci-fi setting. A rationalist administrator on a space station or a hub. It raises the stakes naturally. Let's make the protagonist an AI or a human augmented with decision-theory software. Let's stick to a human, Elara, who relies on a "Decision Engine." It makes her internal conflict clearer.

  3.  **Character Conception:**
