      *   **The Fix:** She applies a "Complexity Penalty" (Solomonoff Induction style) or a "Utility Cap." Let's try the Complexity Penalty first, as it's a common rationalist counter-argument.
      *   **The Twist/Counter:** The Mugger anticipates the fix. They adjust the claim to bypass the penalty.
