      *Key moment:* Nadia compares it to a court verdict or a medical diagnosis. Julian has to explain why art isn't a diagnosis.
      *Key moment:* Julian admits she will be *right* about the book, but *wrong* about her role.

  9.  **Refining the Ending:**
      *   No handshake. No agreement. Just the weight of the decision remaining.
      *   Maybe a physical action that underscores the disconnect. Nadia pouring a drink vs. Julian staring at the book.

  10. **Final Polish:** Check pacing. Ensure the philosophical terms don't sound too academic (show, don't just tell). Keep the tension high. (e.g., "You're asking me to sign a certificate of attendance I didn't earn.")

