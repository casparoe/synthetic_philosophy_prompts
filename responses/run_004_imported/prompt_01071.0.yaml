answer: |-
  The rain had been hammering the library windows of the chateau for an hour, a rhythmic dulling of the world outside. Inside, the air was stale with old paper and the sharp tang of extinguished cigarettes. It was past two in the morning. The shortlist deadline was seventy-two hours away.

  Nadia swirled the dregs of her wine. Across the table, Julian was aligning the spines of the longlisted hardcovers with geometric precision.

  "I'm not voting for *The Glass Archipelago*," Nadia said. Her voice was flat, tired. "And I'm not voting against it. I'm abstaining on that title specifically. For the others, I have my rankings."

  Julian didn't look up from the books. "You haven't read it."

  "Elias has."

  "Elias is not the judge. You are."

  "Elias is a better reader than I am, and he has read it twice. He gave me forty pages of notes. He broke down the syntax, the thematic architecture, the emotional payoff. I know the book, Julian. I know it as well as I know the ones I've read."

  Julian stopped aligning the spines. He looked at her, his eyes red-rimmed. "No. You know *about* the book. There is a categorical difference."

  "Is there?" Nadia leaned forward. "Let's talk about that difference. Because this isn't just about laziness. You're making a metaphysical claim."

  "I'm making a procedural one."

  "Same thing, in this context." She tapped the table. "Yesterday, during the history discussion, you accepted Dr. Aris's assessment of the manuscript's archival accuracy without checking the footnotes yourself. You trusted his expertise. You formed a belief based on his testimony. Was that belief unjustified?"

  "That's a matter of fact," Julian said. "Did the author get the date of the treaty right? That is verifiable data."

  "So is the quality of the prose. Elias told me the sentences are labyrinthine but precise. He told me the climax fails because the metaphor collapses. If those are true descriptions, and I trust Elias, then I hold a true belief about the book's merit. I am not guessing. I am relying on a reliable cognitive conduit. Why is the aesthetic realm magically sealed off from the way human beings actually share knowledge?"

  Julian exhaled, a long, ragged sound. He picked up a glass, found it empty, and set it down. "I will concede this to you, Nadia. I grant that testimony can transmit knowledge. If Elias says the book is profound, and Elias is competent and honest, then you *know* the book is profound. You possess a true belief about its quality. I am not arguing that you will be *wrong* about the book."

  "Then what are you arguing?"

  "I am arguing that you will be wrong about *yourself*." Julian stood up and walked to the window, watching the rain distort the garden lights. "A literary prize is not a consumer guide. We are not issuing a rating. We are performing an act of witnessing."

  "Witnessing," Nadia repeated, the word tasting like ash. "That's romantic nonsense. We are distributing money and prestige. The outcome is what matters. If the best book wins, the ritual worked. If I vote based on Elias's accurate report, and the best book wins, the system is functionally intact."

  "The system is not a machine, Nadia. It's a covenant." Julian turned back to her. "Imagine a judge in a court of law. Suppose the evidence is overwhelming. A colleague summarizes the transcript for him. He votes guilty. He gets the right verdict. Has he performed the office of a judge?"

  "Yes. The defendant is punished either way."

  "No," Julian said sharply. "The legitimacy of the verdict rests on the judge's direct engagement with the evidence. To delegate the reading is to delegate the conscience. When you raise your hand tomorrow, you are saying, *'I have weighed this.'* If you haven't, you are lying. Not about the book's quality, but about your relationship to it."

  Nadia stood, matching his height. "You're conflating the *value* of the art with the *suffering* required to access it. You think there's moral virtue in the hours I spent squinting at bad typesetting? Elias did the labor. I'm utilizing the resource. Why is your definition of 'judgment' so obsessed with the first-person encounter? Is the art not in the object? Or is it in the retina?"

  "The art is in the encounter!" Julian slammed his hand on the table. The wine glasses jumped. "Aesthetic judgment isn't like scientific judgment. In science, the observer is ideally irrelevant. In art, the observer is the medium. The book doesn't exist until it is read. If you haven't read it, it hasn't happened for you. You are voting on a ghost Elias saw."

  "So I'm voting on a second-hand ghost. If Elias has good eyes, what's the damage?"

  "The damage is to the office!" Julian's voice cracked, losing its polish. "We are asking authors to expose themselves. To send us their vulnerabilities. And our only reciprocal duty is to meet that exposure with our own attention. To skip that is to treat the novel as data. It reduces the work to a set of properties—plot, theme, syntax—that can be transmitted in a memo. It strips the work of its claim on us."

  Nadia laughed, a short, brittle sound. "Its claim on us. Listen to yourself. This is guild protectionism, Julian. You're sacralizing the boredom to justify the exclusivity. If I read your way, I read twenty books. If I read my way, I read twelve and understand twenty. I can serve the literature better by being efficient. I can champion the winners more effectively if I'm not exhausted."

  "Efficiency," Julian spat. "Is that the metric now? How quickly can we process the culture?"

  "Don't twist my words. I care about the culture. That's why I want the right books to win. And if Elias is right, and I vote with him, the right books win. Your way risks *my* fatigue clouding *my* reading of the other twelve. My way ensures my vote is informed, even if indirectly."

  "It ensures your vote is *opinionated*," Julian corrected. "It does not make it *judicial*. You are acting as a critic in a salon, debating merits. You are not acting as a juror. A juror must pay the cost of the verdict."

  "And what is the cost? Time? Eyestrain?"

  "Submission," Julian said quietly. "You have to submit to the book's time, not your own. By relying on Elias, you are forcing the book to fit your schedule. You are saying, *'I do not have time for you, so I will accept a summary.'* That is an arrogance no prize should validate."

  Nadia sat back down slowly. She looked at the stack of unread paperbacks, then at Julian. "So, even if I am right about the book—even if my vote helps the masterpiece win and the trash lose—I am ethically compromised."

  "Yes."

  "And you, by insisting I read them, might exhaust me to the point where I misjudge the ones I *do* read. You might cost the masterpiece the prize because I was too tired to see its nuance. Are you not ethically compromised by your rigidity?"

  Julian opened his mouth, then closed it. He walked back to the table and picked up *The Glass Archipelago*. He held it by the spine, letting it dangle.

  "That is a risk," Julian admitted. "It is the risk of the human element. But it is *our* risk to take. If we outsource the reading, we remove the human element entirely. We become algorithms aggregating reviews."

  "We become a institution that survives," Nadia countered. "Do you think the public cares if I read every page? They care if we pick a winner who matters in five years."

  "They care if we are honest," Julian said.

  "Honesty is a luxury of the tenured, Julian. I'm trying to do the job."

  "And I am trying to define what the job *is*."

  They stood in silence. The rain continued to batter the glass. The clock on the mantel ticked, measuring out the seconds of the deadline countdown.

  Nadia reached for the bottle of wine. It was empty. She set it down with a clink.

  "I'm still abstaining on *Archipelago*," she said. "But I'm voting on the other two I missed, based on summaries."

  Julian looked at her, a mixture of disappointment and resignation hardening his features. "Then I will have to note your abstention in the minutes. And I will have to argue against the validity of the other votes when we convene."

  "Do what you have to do."

  "I will."

  "And I," Nadia said, standing up and gathering her papers, "will do what is necessary to ensure we have a shortlist by Friday. Even if it means offending your idea of the sacred."

  "It's not my idea," Julian said to her back as she moved toward the door. "It's the book's."

  Nadia paused at the threshold. She didn't turn around. "Books don't have ideas, Julian. Only people do. And people are tired."

  She left the room. Julian stood alone in the library, holding the unread novel. He didn't open it. He just held it, weighing it in his hand, as if testing whether the physical weight could make up for the time he no longer had to read it.
