      *Let's finalize the recommendation:* I will recommend **Hold Back**. The reason is that the incentive structure is fundamentally flawed. A condition implies the current system is okay *if* we tweak it. But the current system's *core logic* is the problem. A Hold Back signals that the *design philosophy* needs review, not just a patch.

