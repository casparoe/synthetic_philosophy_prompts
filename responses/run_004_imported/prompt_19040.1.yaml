prompt: |-
  I'm a third-year PhD student in epistemology, currently putting together a seminar presentation on stakes-sensitivity in knowledge ascriptions, and I think I've talked myself into a view that I'd like to sanity-check before committing to it in front of my cohort. As far as I can tell, epistemic contextualism and pragmatic encroachment — or, as its proponents sometimes call it, subject-sensitive invariantism — are extensionally equivalent. Both camps agree that raising the stakes in a DeRose-style bank case can turn a true utterance of 'Hannah knows the bank is open on Saturday' into a false one without any change in Hannah's evidence, and every worked example I've come across keeps the attributor and the subject in exactly the same practical situation, so the two theories always end up assigning the same truth-value to the same sentence. Where they differ is just in how they narrate the shift: contextualists say 'knows' picks out a stricter relation once the conversational stakes go up, while encroachment theorists say the knowledge relation itself gets harder to satisfy once the subject's practical stakes go up. Since I can't find a case where this narrative difference actually changes which sentences come out true, it looks to me like a difference in bookkeeping rather than in empirical commitment.

  Given that, I'm inclined to tell my seminar that the dispute should simply be settled by Ockham's razor: contextualism keeps the metaphysics of the knowledge relation fixed and pushes all the complexity into the semantics of 'knows,' so it ought to win on parsimony grounds unless someone can produce a case where the two theories actually cut against each other. Is that a fair way to frame the state of play, and does contextualism in fact come out ahead once the comparison is set up that way?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Position:**
      *   **User:** Third-year PhD student in epistemology.
      *   **Task:** Preparing a seminar presentation on stakes-sensitivity in knowledge ascriptions.
      *   **Proposed View:** Epistemic Contextualism (EC) and Pragmatic Encroachment (PE)/Subject-Sensitive Invariantism (SSI) are *extensionally equivalent*. They agree on truth values in all standard cases (like DeRose's Bank Cases). The difference is merely semantic/metaphysical "bookkeeping" (context of attributor vs. context of subject).
      *   **Proposed Conclusion:** Use Ockham's Razor to favor Contextualism because it keeps the knowledge relation fixed and puts variability in semantics, whereas PE changes the knowledge relation itself.
      *   **Goal:** Sanity-check this view before presenting. Is it fair? Does Contextualism actually win on parsimony?

  2.  **Initial Assessment & Fact-Checking:**
      *   *Claim 1: EC and PE are extensionally equivalent.*
          *   *Status:* False/Highly Contested. While they overlap in standard Bank Cases, they diverge in specific scenarios (e.g., mismatched stakes between subject and attributor, third-party ascriptions, self-ascriptions).
      *   *Claim 2: The difference is just "bookkeeping."*
          *   *Status:* Philosophically substantive. It affects how we understand the nature of knowledge, action, and assertion.
      *   *Claim 3: Ockham's Razor favors Contextualism.*
          *   *Status:* Debatable. PE proponents argue EC is *less* parsimonious because it posits semantic context-sensitivity for 'knows' (which looks like a stable term) whereas PE keeps semantics stable and varies the metaphysical/epistemic conditions. It's a tug-of-war on where to locate the "complexity."
      *   *Claim 4: This is a safe view for a PhD seminar.*
          *   *Status:* Risky. This is a well-trodden debate with specific counterexamples designed to pry EC and PE apart. Asserting extensional equivalence as a settled fact might invite strong pushback from faculty familiar with the literature (e.g., Stanley, Hawthorne, DeRose, Cohen, Fantl & McGrath).

  3.  **Identify Key Points of Divergence (The "Extensional Equivalence" Problem):**
      *   *Mismatched Stakes:* What if Hannah (subject) has low stakes, but the Attributor has high stakes?
          *   EC: Attributor context dominates. "Hannah knows" is false.
          *   PE/SSI: Subject stakes dominate. "Hannah knows" is true.
      *   *Self-Ascriptions:* Hannah says "I know."
          *   EC: Depends on Hannah's conversational context.
          *   PE: Depends on Hannah's practical situation. (Often align, but can diverge if she's talking about her own stakes vs. talking casually).
      *   *Disagreement:* Can two people genuinely disagree if they are in different contexts? EC says they talk past each other; PE says they disagree about a fact.
      *   *Knowledge-Action Link:* PE ties knowledge directly to rational action. EC ties it to appropriate assertion.

  4.  **Evaluate the Parsimony Argument:**
      *   *Contextualism:* Semantics is complex (context-sensitive), Metaphysics is simple (invariant knowledge relation).
      *   *Pragmatic Encroachment:* Semantics is simple (invariant 'knows'), Metaphysics/Epistemology is complex (knowledge depends on practical factors).
      *   *Who wins?* It depends on whether you think semantic context-sensitivity is "costly" or whether making knowledge depend on practical stakes is "costly." Most epistemologists lean towards the idea that knowledge *shouldn't* depend on practical stakes (intellectualism), which is a theoretical virtue independent of simple parsimony. Conversely, semanticists argue 'knows' doesn't look context-sensitive like 'tall' or 'ready'.

  5.  **Formulate the Advice:**
      *   **Tone:** Respectful, collegial, but cautionary. Acknowledge the sophistication of the thought but highlight the risks.
      *   **Direct Answer:** No, it is not fair to claim they are extensionally equivalent. There are specific counterexamples.
      *   **Specific Counterexamples:**
          1.  *Divergent Stakes (The "Cross-Context" Case):* Attributor high stakes, Subject low stakes.
          2.  *The "Ignorant High-Stakes Attributor":* Attributor doesn't know subject's stakes.
          3.  *Retraction Data:* How speakers behave when stakes change.
      *   **Parsimony Rebuttal:** Explain that PE proponents argue *they* are more parsimonious regarding semantics (invariantism). It's a trade-off, not a clear win for EC.
      *   **Strategic Advice for Seminar:**
          *   Don't assert equivalence as fact. Frame it as a *challenge*: "To what extent are they equivalent?"
          *   Highlight the *motivation* differences (Semantic vs. Metaphysical).
          *   Mention the "Intellectualist" intuition (knowledge is purely truth-relevant).
      *   **Literature Check:** Cite key names (Stanley, Hawthorne, DeRose, Cohen, Fantl & McGrath, Brown).

  6.  **Refine the Argument (Self-Correction/Nuance):**
      *   *Wait, is there a version of EC that mimics SSI?* Some contextualists might adjust the "relevant alternatives" based on what the *attributor thinks* the subject's stakes are. But standard EC tracks the *attributor's* context, not the subject's.
      *   *Is SSI strictly extensionally equivalent to EC?* No, Stanley explicitly argues against EC because of cases where the attributor's context shouldn't matter.
      *   *Parsimony:* Be careful. EC posits context-sensitivity. SSI posits a complex knowledge relation. Which is "simpler"? Lewisian contextualism is semantically costly. Invariantism is metaphysically costly (for traditionalists). It's a stalemate on parsimony without further argument.

  7.  **Drafting the Response:**
      *   *Opening:* Validate the intuition (they look similar in Bank Cases) but warn against the conclusion (equivalence).
      *   *Section 1: Extensional Divergence.* Detail the "Mismatched Stakes" case. This is the smoking gun.
      *   *Section 2: The Parsimony Trade-off.* Explain why PE proponents reject the claim that EC is more parsimonious. (Semantics vs. Metaphysics).
      *   *Section 3: Theoretical Virtues.* Mention Intellectualism and the nature of inquiry.
      *   *Section 4: Seminar Strategy.* How to pivot the presentation to be constructive rather than vulnerable.

  8.  **Final Review against User Persona:**
      *   PhD student needs rigorous feedback, not hand-holding.
      *   Needs to avoid embarrassment in front of cohort/faculty.
      *   Needs accurate citation of the dialectic.
      *   *Crucial:* Make sure not to dismiss the insight entirely. The *structural* similarity is real, which is why the debate is hard. But the *extensional* claim is the weak point.

  9.  **Final Polish:** Ensure clear distinction between Attributor Context (EC) and Subject Stakes (PE). Ensure the Ockham's Razor point is nuanced (semantic parsimony vs. metaphysical parsimony). (Self-correction: Make sure to mention *Knowledge Norm of Assertion* vs *Knowledge Norm of Action* as a distinguishing factor).

  10. (Post-computation check): Did I address the "bookkeeping" claim? Yes, by showing it has substantive consequences for disagreement and retraction. Did I address Ockham's Razor? Yes, by showing it cuts both ways.

