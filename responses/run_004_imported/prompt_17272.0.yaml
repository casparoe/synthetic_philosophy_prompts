      *   **User's Position:** Priors are subjective starting points. Rationality doesn't demand identical starting points. CPA is an extra assumption, not a requirement of Bayesian rationality itself.
      *   **Task:** Write an essay settling the debate. Weigh both sides. Commit to a real conclusion (conditional is okay, but must specify which notion is "right").
