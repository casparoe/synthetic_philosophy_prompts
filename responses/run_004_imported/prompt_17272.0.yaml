  2.  **Initial Knowledge Retrieval & Fact-Checking:**
      *   *Aumann's Agreement Theorem (1976):* If two agents have the same prior, and their posteriors for an event are common knowledge, then their posteriors must be equal.
      *   *Common Prior Assumption (CPA):* The assumption that agents start with the same probability distribution over the state space before receiving private information.
      *   *Bayesian Rationality:* Typically defined as coherence (probabilities sum to 1, updating via Bayes' rule). It does *not* inherently dictate specific prior values (subjective Bayesianism vs. Objective Bayesianism).
      *   *The Core Tension:* Is "Rationality" defined purely by internal coherence (User's view) or by a stronger epistemic standard that implies convergence on truth given enough shared information (Friend's view)?
      *   *Speculative Trading:* The "No-Trade Theorem" (Milgrom & Stokey) relies on CPA. If CPA fails, speculative trade is possible between rational agents.
      *   *Philosophical Status:* Most philosophers and economists acknowledge CPA is an *assumption*, not a logical consequence of Bayesianism. However, some argue it's a *regulative ideal* for rationality.

  3.  **Structuring the Essay:**
