answer: |-
  This is a fantastic catch. It is genuinely one of the great ironies of intellectual history that the man who systematized secular utilitarianism also spent two decades presiding over an organization dedicated to finding ghosts. But once you sit with Sidgwick's actual epistemology, the contradiction dissolves. He wasn't a credulous mystic; he was a *radical fallibilist*.

  You are right to feel that the "Bayesian shrug" interpretation is too easy. Sidgwick is doing something more aggressive here. He isn't just saying the math is hard; he is saying the *framework* Hume uses to dismiss the supernatural is logically incoherent.

  Here is the unpacking you asked for, broken down by your two sticking points.

  ### 1. Is he agreeing with Hume or dismantling him?

  He is **dismantling Hume's mechanism while keeping Hume's skepticism.**

  To see this, you have to look at how Hume defines "experience." For Hume, "uniform experience" is a solid wall. If every human in history says fire burns, and one guy says "this fire froze me," Hume argues the probability that the guy is lying is effectively 100%, because the weight of "uniform experience" is infinite.

  Sidgwick attacks the definition of "experience." Look at this line: *"in saying that a marvel is contrary to experience we can mean no more than that it is unlike previous experience."*

  Sidgwick is pointing out that "experience" is just a dataset. It is a sample size. Hume treats the sample size as if it were the total population of reality. Sidgwick argues that just because a phenomenon is novel (outside the current dataset), that doesn't make it impossible (outside the realm of possibility).

  *   **Hume's position:** Novelty = Impossibility. (Because the laws of nature are fixed and known.)
  *   **Sidgwick's position:** Novelty = Improbability. (Because our map of nature is incomplete.)

  Sidgwick is not saying, "Believe the mediums." He is saying, "Hume's argument is a logical shortcut that pretends we know the boundaries of the universe. We don't." He is rescuing skepticism from dogmatism. He wants a skepticism that allows for data updates, whereas he views Humean skepticism as a system that hard-codes the current dataset as the final truth.

  ### 2. The "Proportion of Known to Unknown" Argument

  Your instinct is to treat this as an "unknowable prior" problem—i.e., "we can't calculate $P(Hypothesis)$ because we lack data." Sidgwick is making a stronger, metaphysical claim.

  When he says, *"to make such an estimate we should require to ascertain the proportion that what we do know about the universe bears to what we do not know about it; and that proportion is certainly one of the things that we do not know,"* he is identifying an **epistemic horizon.**

  In Bayesian terms, you are correct: you need a prior. But Sidgwick is arguing that for truly novel phenomena, **a rational prior cannot be constructed.**

  If I ask you, "What is the probability that a new species of beetle exists in the Amazon?" you can estimate that based on known biodiversity rates.
  If I ask you, "What is the probability that a beetle can speak Latin?" you have no baseline. You might say "zero," but Sidgwick asks: *On what grounds?*

  *   **Grounds A:** We have never seen it. (Sidgwick says: That's just novelty, see above.)
  *   **Grounds B:** It violates physics. (Sidgwick says: How do you know the complete laws of physics? You only know the proportion of the universe you've tested.)

  Sidgwick is arguing that any specific number you assign to the improbability of a miracle is **arbitrary**. It is a disguised assertion of faith in materialism, not a calculation.

  So, is it a shrug? No. It's a **veto on using "improbability" as a veto.**

  He is arguing that you cannot use "This is too weird" as a terminal argument. You can use it as a heuristic ("This requires more evidence"), but you cannot use it to close the file ("This requires *infinite* evidence, therefore we stop looking").

  ### 3. Does this cash out in a real answer?

  You asked: *"Feels like this passage should cash out in a real answer to 'how weird does a claim have to be before I should stop trusting the witnesses,' but I can't tell if he's giving one or just eloquently explaining why nobody can."*

  He is explicitly arguing that **nobody can.** And that is the answer.

  Sidgwick is not providing an **Evidentiary Canon** (a rule for judging truth); he is providing a **Methodological Canon** (a rule for judging inquiry).

  *   **The Humean Rule:** If Claim $X$ is sufficiently weird, $P(X) \approx 0$. Dismiss testimony.
  *   **The Sidgwick Rule:** If Claim $X$ is sufficiently weird, $P(X)$ is undefined but low. Do not dismiss testimony; instead, scrutinize the *source* of the testimony with extreme prejudice.

  This is why he founded the Society for Psychical Research (SPR). If Hume is right, the SPR is a waste of money. If Sidgwick is right, the SPR is a moral imperative. If there is even a non-zero, non-quantifiable probability that consciousness survives death or that telepathy exists, the utility of knowing that is infinite (for a utilitarian!). Therefore, you must investigate, even if your priors are low.

  ### The "Coder" Translation

  Since you write code, here is how I think Sidgwick would debug Hume's logic:

  **Hume's Code:**
  ```python
  def evaluate_claim(claim, testimony):
      if claim in UNIFORM_EXPERIENCE_DB:
          return True
      else:
          # Anything not in the DB is impossible
          return False 
  ```

  **Sidgwick's Code:**
  ```python
  def evaluate_claim(claim, testimony):
      if claim in UNIFORM_EXPERIENCE_DB:
          return True
      else:
          # Claim is novel. Improbability is high but undefined.
          # We cannot return False because UNIFORM_EXPERIENCE_DB 
          # is not a complete map of Reality_OS.
          
          reliability = audit_witness(testimony)
          
          if reliability > THRESHOLD:
              return "INVESTIGATE_FURTHER" # Add to DB
          else:
              return "REJECT_TESTIMONY" # Not rejecting claim, rejecting witness
  ```

  ### Why the Rationalists Love Him

  This connects back to why you see him on EA/rationalist blogs. Sidgwick is the patron saint of **"Strong Opinions, Weakly Held"** before that phrase existed.

  He represents the tension of trying to be rigorously scientific while admitting that science is an incomplete dataset. Modern rationalists often struggle with the "priorness" of their materialism. Sidgwick validates the skepticism but forbids the dogmatism.

  He is telling you: **You are allowed to think ghosts are 99.9% likely to be fake. You are not allowed to say they are 100% fake, because you cannot calculate the size of the 0.1% unknown.**

  And for a utilitarian, that 0.1% matters. If ghosts are real, the implications for welfare (suffering after death, etc.) are massive. So, you investigate. Not because you believe, but because you can't afford to be wrong about the unknown.

  ### Summary

  1.  **Hume:** Sidgwick is dismantling Hume's claim that "contrary to experience" equals "impossible." He reclassifies it as "novel."
  2.  **Known/Unknown:** This isn't a math shrug; it's an argument that scientific materialism cannot logically prove its own completeness. Therefore, it cannot assign a zero-probability to anomalies.
  3.  **The Rule:** There is no rule for "how weird is too weird." The rule is: "Improbability justifies higher scrutiny of the witness, not immediate dismissal of the claim."

  Sidgwick isn't giving you a way to stop thinking about the weirdness. He's giving you a justification for why you have to keep thinking about it, even when it's uncomfortable.
