      *   *Correction:* Be careful. Politics involves human passion, which introduces friction. Hobbes admits this. The *principles* are certain, the *application* might vary. Need to nuance the "certainty" claim. It's certainty of the *right* of the sovereign, not necessarily prediction of every riot.
      *   *Wait, one more thing:* The user asked if it's "rhetorical prestige." I need to explicitly answer that. It's not *just* rhetoric; it's foundational to his system.

  7.  **Final Polish:** Check for clarity, flow, and ensure both parts of the prompt are answered satisfactorily. (The resulting output matches the detailed response provided previously.)
answer: |-
  First off, solidarity on the grading procrastination. There is a specific irony in grading papers on early modern political theory while reading *Leviathan* instead, but I suspect Hobbes would approve of the efficiency: you are optimizing your own intellectual pleasure while neglecting the covenant you made with your professor.

  To your first question: You have hit on the central engine of Hobbes's philosophical system. It is **not** merely rhetorical prestige. It is a structural, epistemic claim.

  Hobbes's distinction rests on the difference between knowing *that* something is (knowledge of fact) and knowing *why* something is (knowledge of consequence/science). In natural philosophy (physics), we observe effects (motion, color, heat) and reason backward to possible causes. Because we did not create nature, we cannot be certain we have identified the true cause; we can only offer hypotheses that are consistent with the phenomena. As he puts it in *De Corpore*, we are in the position of watching a clock from the outside; we can guess how the gears work, but we can't be sure.

  In geometry, we define the figures. We stipulate that a line is generated by the motion of a point. Because we are the authors of the definitions and the construction, we know the causes perfectly. We know exactly what went into making the triangle, so we can demonstrate its properties with certainty.

  Now, to civil philosophy: Hobbes's move is to argue that the Commonwealth is not a natural growth (like a family or a tribe) but an **artifact**. It is the "Leviathan," the "Artificial Man." Because it is brought into being by human art—specifically through the Covenant—we stand in the same relation to the State as the geometer stands to the circle. We laid the foundations (the laws of nature), we constructed the figure (the social contract), and therefore we can demonstrate its necessary properties (the rights of the sovereign, the duty of obedience).

  So, to answer your specific worry: Yes, it is the *same* argument. The epistemic warrant is identical: *nos fecimus* (we made it). If it were merely rhetorical, Hobbes would have no ground to claim civil philosophy is a "science" rather than just prudent statecraft. He needs the geometric model to claim that politics can be taught demonstratively, not just learned through experience.

  However, there is a nuance worth noting for your seminar. In geometry, the construction is conceptual. In politics, the construction is volitional and performative. The "certainty" of civil philosophy relies on the assumption that humans *actually* construct the state via rational covenant. Hobbes knows people are messy. His claim is that the *right* of the sovereign is certain (because it follows from the logic of the covenant), even if the *stability* of the state is subject to human passion. But the epistemic status remains: we know the rules because we wrote them.

  ***

  Now, to the Wallis quarrel. This is one of the great tragicomedies of intellectual history.

  Your advisor is mostly right, but you are right to be suspicious. Here is the split:

  **1. Competence vs. Method (The Advisor's View)**
  It is entirely possible to have a coherent philosophy of science and be terrible at practicing it. Hobbes's theory of certainty (that construction yields knowledge) does not logically depend on his ability to calculate the area of a circle. One could argue that his failure was simply a failure of execution—a calculation error, or a blindness to the rigorous standards of proof that Wallis was developing. In this light, the Wallis saga is a biographical footnote about Hobbes's ego and his declining faculties, not a refutation of his epistemology.

  **2. The Materialist Corruption (Your View)**
  However, there is a deeper philosophical rot here that connects to your first question. By the time of the quarrel, Hobbes's geometry had become deeply entangled with his materialism. He refused to treat geometric points as abstractions; for Hobbes, a point had to be a physical body with magnitude. He treated lines as traces of motion in time and space.

  Wallis was working toward a more abstract, algebraic conception of geometry. Hobbes insisted geometry was physical. This suggests that Hobbes couldn't keep his "constructed mental objects" separate from "physical bodies."

  Why does this matter for your first question? Because if Hobbes's understanding of *geometric* construction is contaminated by physical assumptions (i.e., he thinks he's measuring real space rather than reasoning about defined concepts), it weakens the analogy to civil philosophy.

  If his geometry is certain because it's about "physical motions we define," but he keeps getting the physics of those motions wrong (as Wallis showed), then the "certainty" of the method is compromised. It suggests that Hobbes struggled to maintain the boundary between the *a priori* (the realm of certainty) and the *a posteriori* (the realm of conjecture).

  **The Verdict on Wallis:**
  It doesn't prove his theory of certainty is false, but it does show that Hobbes was often bad at policing the boundary that makes the theory work. He became dogmatic about his own "constructions," treating his own definitions as if they were empirical discoveries that couldn't be challenged.

  There is a rich irony here: In *Leviathan*, Hobbes argues that private judgment must be submitted to the public sovereign to ensure peace. In the Wallis quarrel, Hobbes refused to submit his private judgment to the public tribunal of mathematical proof. He became the very source of disorder in the Republic of Letters that his political philosophy was designed to prevent.

  **For your grading:**
  If a student argues that Hobbes's civil philosophy is certain *only* because he borrows the prestige of math, push them to find the text where Hobbes explicitly links the "making" of the commonwealth to the "making" of geometric figures (*De Cive* is great for this).

  If a student brings up the Wallis quarrel, tell them it's a fascinating sidebar, but unless they can link his materialist metaphysics to his political theory (e.g., does the sovereign have "magnitude"?), it's biographical gossip. But if they can argue that Hobbes's inability to distinguish abstract definition from physical reality in math might bleed into how he views the "body politic," then they're onto something.

  Now, back to those papers. Remember: You are the sovereign in your grading domain. The students have covenanted to follow your rubric. Their dissent is sedition. Grade with absolute certainty.
