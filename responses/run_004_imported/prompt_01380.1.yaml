      *   **Task:** Write a dialogue between a Sophisticated Substantivalist (SS) and a Relationalist (R).
      *   **Setting:** Right after agreeing naive substantivalism is dead (post-Earman-Norton).
      *   **Goal:** Explore whether the remaining disagreement is substantive or merely verbal.
      *   **Key Issues to Address:**
          *   Haecceitism vs. Anti-haecceitism.
          *   Counterpart theory vs. transworld identity.
          *   The ontological status of the manifold/points vs. relations.
          *   Whether the relationalist needs "relata."
          *   Whether the sophisticated substantivalist is just a "relationalist in disguise."
