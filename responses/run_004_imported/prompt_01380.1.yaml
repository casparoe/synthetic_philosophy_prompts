      *   **Move 2: The "Surplus Structure" Charge.** R argues that if $d: M \to M$ maps points to points but represents the same reality, the points are doing no work. S counters with the "Metric Field" argument. The metric is a field *on* something. What is the something?
      *   **Move 3: Counterpart Theory.** S introduces Lewis-style counterpart theory to handle the diffeomorphism. Points in model A aren't identical to points in model B, they are counterparts. R pushes back: "Why do I need points at all? I just need the structure."
      *   **Move 4: The "Relata" Problem.** R claims relations need relata. S pounces: "Aha! So you need substances?" R clarifies: "Material events are the relata, not spacetime points." S argues: "But what about vacuum solutions? No matter, just spacetime." This is a strong point for S.
      *   **Move 5: Vacuum Solutions & Ontological Parsimony.** R tries to handle vacuum solutions (maybe as counterfactual matter?). S argues this is ad hoc. The manifold exists even without matter.
      *   **Move 6: Is it Verbal?** They converge on the idea that empirically, they predict the same things. The difference is modal/ontological. S says "Points exist structurally." R says "Structure exists, points are just nodes."
      *   **Closing:** Acknowledge the stalemate but clarify the exact locus of disagreement. It's about whether structure requires a substrate.

  4.  **Refining the Argument (Self-Correction during drafting):**
