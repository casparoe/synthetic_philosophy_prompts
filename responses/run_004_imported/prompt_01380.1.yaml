  *(Self-Correction during final review)*: Make sure the distinction between "manifold points" and "material events" is clear. The relationalist usually ties space to matter. The substantivalist ties it to the manifold. The vacuum solution is the killer app for the substantivalist here. I need to make sure Mark has a decent defense (e.g., dispositional properties or counterfactual matter) so it's not a blowout.

