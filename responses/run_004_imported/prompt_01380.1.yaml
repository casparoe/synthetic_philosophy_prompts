  2.  **Character Conception:**
      *   **Sophisticated Substantivalist (S):** Believes spacetime points exist but lack primitive thisness (haecceity). Diffeomorphic models represent the same physical reality. Wants to maintain an ontology of points without the indeterminism baggage.
