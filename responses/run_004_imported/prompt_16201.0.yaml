answer: |-
  Good evening. For those who don't know me, I'm [Name], a fellow traveler with the bride and groom in the somewhat niche world of philosophy.

  To the family and friends here: You know Priya and Ben as the couple who brought the amazing vegan lasagna. You know they care deeply about animals. But what you might not know is that for the last five years, they have been engaged in a high-stakes intellectual duel that would make most married couples argue about something simpler, like whose turn it is to do the dishes.

  They both agree on the foundation: that speciesism is wrong, and that animals matter morally. But once they built on that foundation, they went in opposite directions.

  Priya is a utilitarian. In her view, the right action is the one that minimizes suffering and maximizes well-being, period. She's written a dissertation arguing that we have to follow the math wherever it leads. This includes some tough theoretical commitments—like the idea that individual lives are part of a larger equation of welfare, and that we might even have a duty to intervene in nature to stop wild animals from hurting one another. For Priya, morality is about active optimization. It's about looking at the world and asking, "How can we make this better?"

  Ben comes from the rights tradition. He argues that animals are "subjects-of-a-life." They have inherent value that cannot be traded away for the greater good. To him, Priya's idea of intervening in nature looks less like heroism and more like hubris. He believes we have strict duties not to harm, but we don't have a license to remake the world. For Ben, morality is about respect. It's about looking at the world and asking, "What do we owe this individual?"

  So, you have Priya, who wants to save the world by calculating the best outcome, and Ben, who wants to save the world by respecting boundaries.

  Naturally, this makes planning a life together interesting. For the philosophers in the room: Priya initially proposed organizing the seating chart to maximize aggregate welfare, but Ben invoked the separateness of persons and insisted every guest has a right to their specific chair. For the rest of you: That means Priya wanted to mix everyone up to make new friends, and Ben wanted to make sure Grandma sat where she could hear.

  But here is the thing that brings me to tears, and not just from laughing at their footnotes.

  In a world where intellectual disagreement often turns into contempt, Priya and Ben have shown us that you can disagree on the *mechanism* of the good without disagreeing on the *commitment* to it. They don't need to resolve the debate between Singer and Regan to know that they are on the same side. They share a rare intensity of care. Priya's drive to optimize and Ben's drive to protect are not opposites; they are the two lungs of a moral life. You need the ambition to improve things, and you need the humility to respect them.

  And that is exactly what marriage is.

  Some days, love is utilitarian. It's doing the calculus to make sure the household runs smoothly, sacrificing a little sleep so the other can rest, optimizing for shared happiness. Other days, love is deontological. It's respecting the other person's autonomy, honoring their boundaries even when it's inconvenient, treating them as an end in themselves and never just as a means to your own comfort.

  Priya and Ben have proven that you don't need to agree on the theory to live the practice. They have built a relationship where the argument isn't a threat to the bond; the argument *is* the bond. It is the friction that keeps them honest.

  So, to the happy couple: May your life together be free of unnecessary suffering. May you always respect the subject-of-a-life sitting across from you at breakfast. And may you never stop arguing about how to make the world better, as long as you keep coming home to the same side of the bed.

  To Priya and Ben.
