answer: |-
  Good morning. For thirty-five years, my job was analytical chemistry. I spent a life measuring concentrations, identifying impurities, and looking for precision. I only started reading philosophy seriously two years ago, so please forgive me if I get the terminology wrong. But I knew Walter for much longer than two years. And if there is one thing I learned from him, it is that a life, like a chemical sample, is best understood not by ignoring the impurities, but by accounting for them.

  Many of you in the reading group know the small ledger Walter kept in his jacket pocket. For those who don't: it was ruled into columns for Benjamin Franklin's thirteen virtues. Temperance. Silence. Order. Resolution. Every evening, Walter would mark a dot against himself for every time he failed.

  To his grandchildren, that ledger showed up in a different form. You remember the notes. If you were ten minutes late for dinner, Walter didn't yell. He asked you to write a note explaining why. To a child, that feels like a punishment. But Walter wasn't trying to shame you. He was trying to teach you to keep your own ledger. He wanted you to notice the lapse, acknowledge the data, and move on.

  Walter loved Franklin's story about the man who bought an axe. The man wanted the whole surface bright, but the grinder left it speckled. The man took it, saying, "I think I like a speckled axe best." Walter knew he was a speckled axe. He knew that a life without dots was a lie.

  There is a trap in eulogies. We tend to polish the axe until it gleams. We say the departed mastered their temper, or achieved perfect humility. But Walter would have winced at that. He was particularly wary of praise for his humility. He knew Franklin's warning: that the moment you convince yourself you are truly humble, you have found a new occasion for pride. So, I will not tell you Walter was humble. I will tell you that he was constantly, rigorously, and sometimes exhaustingly *aware* of his own pride.

  He insisted that the point of Franklin's scheme was that one never arrives. You do not finish the work of being a good person. You simply do the work.

  In my lab, we learned that one hundred percent purity is theoretically impossible. There is always noise. Walter applied that to morality. He didn't expect to be pure. He expected to be honest about the noise. He had faults. He could be stubborn. He could be exacting. He could be difficult. But he never claimed otherwise. He carried the record of his lapses in his pocket for thirty years, not as a burden of guilt, but as a map of where he needed to walk next.

  To the reading group: Walter would not want us to treat his life as a solved equation.
  To the family: Walter would not want you to remember him as a man who never made mistakes, but as a man who never hid from them.

  I am not a philosopher. I am a chemist. And in my analysis, the measure of Walter's character is not found in the days he marked clean. It is found in the days he marked with a dot, and yet woke up the next morning and drew a fresh column.

  He didn't conquer himself. He befriended himself, speckles and all. And he invited us to do the same.

  Rest well, Walter. The ledger is closed, but the lesson remains. Thank you.
