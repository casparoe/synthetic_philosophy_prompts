answer: |-
  The data from the scattering cross-sections was clean, a beautiful Gaussian curve that Elias Thorne had spent forty years learning to trust. But the anomaly wasn't in the detector; it was in the mirror.

  Elias was seventy-eight. In his cohort—the men who had entered the graduate program at Caltech in 1968—mortality had been a steady, predictable decay rate. Like unstable isotopes. Half were gone by sixty-five. Three-quarters by seventy. By the logic of the actuarial tables, Elias should have been part of the background radiation, a memory in a eulogy.

  Instead, he was here, pouring coffee, his hand steady, watching the steam rise.

  He hadn't read Parfit. He didn't care for the metaphysics of personal identity. He cared about signal-to-noise ratios. And lately, the signal of his own continuity was screaming over the noise of probability.

  It started with the quench in '74. A superconducting magnet at Fermilab had lost containment. The helium flash had vaporized the cryostat. Elias had been three meters from the breach, checking a gauge. The blast wave should have turned his thorax into pulp. Instead, a loose panel, dislodged by the initial pressure spike, had deflected the shockfront just enough to leave him with a ruptured eardrum and a permanent tinnitus that sounded like white noise.

  *Branch one,* he thought now, stirring his coffee. *Amplitude squared: negligible.*

  Then came the pancreatic mass in '98. Stage IV. The oncologist had used the word "palliative" within five minutes. Elias had taken the chemotherapy, but the remission was spontaneous. The tumor didn't shrink; it simply ceased to be malignant, the cells reverting to a benign state that the biopsy couldn't explain. The medical board called it a miracle. Elias called it a statistical outlier of such magnitude that it implied a selection effect.

  *Branch two.*

  He sat in his study, surrounded by books he hadn't opened in decades. The realization hadn't come as a epiphany, but as a calculation. In the Many-Worlds Interpretation, every quantum event with multiple possible outcomes creates a branching of the wavefunction. Most branches contain a version of Elias that died. The '74 quench killed him in 99.9% of the branches. The cancer killed him in 99.99%.

  But consciousness is local. You cannot experience the branch where you cease to exist. Therefore, from the first-person perspective, the probability of survival is always one. You are conditioned on your own observation.

  The problem, Elias realized, was the cost.

  He looked out the window. The world was getting... strange.

  To keep a macroscopic object like a human body alive against the entropic gradient of age and accident requires energy. In a single universe, that energy runs out. In a multiverse where you are guaranteed to find yourself in the branch where it *doesn't* run out, the universe must conspire.

  Last week, he had been crossing the street. A delivery truck, brakes failed, speeding. Elias had frozen. The truck had swerved, hit a hydrant, spun, and stopped inches from his shins. The driver walked away unharmed. The hydrant, rusted for forty years, had held just long enough to absorb the impact.

  That was *Branch three*.

  Elias took a sip of coffee. It was cold. He didn't mind.

  The philosophical bite wasn't that he would live forever. It was that his continued existence was becoming increasingly expensive for reality to sustain. He was sliding down the long tail of the probability distribution. In the branches where he survived, the coincidences required to keep him breathing were becoming more complex, more fragile.

  He picked up his phone. He had a daughter, Sarah. She had called yesterday, voice tight. "Dad, you need to be careful. Three accidents in a month? The car, the fall on the stairs, the gas leak?"

  "It was a pilot light, Sarah."

  "It's like the universe is trying to kill you, but missing."

  *No,* Elias thought. *It's like I am only present in the universes where it misses.*

  He hung up. He knew what he had to do. The question the prompt posed was: *What should change about how they act?*

  If he was quantumly immortal, did risk cease to matter?

  No. That was the crude version. The Russian Roulette fallacy. If he played Russian Roulette, he wouldn't experience death, but he would experience the branches where he survived with a shattered jaw, a blown-out eye, or severe brain damage. QI preserves the observer, not the integrity of the vessel.

  But there was a deeper implication. If his survival required increasingly improbable environmental conditions, then his presence was becoming a destabilizing factor. He was a locus of low-measure reality. To be near him was to be near a statistical storm.

  He thought of Sarah. She lived two towns over. She visited every Sunday.

  If he continued to exist, the probability of a "safe" visit for her would decrease. The car she drove might suffer brake failure on the way to his house. The gas main under his driveway might rupture when she parked. The universe would twist to preserve *him*, the observer, potentially at the expense of the measure of the world around him.

  He stood up and walked to the window again. The sky was a bruised purple, twilight settling in. He felt a profound loneliness, not because he was alone, but because he was becoming unique. Not unique in space, but unique in measure. He was a ghost with mass.

  He made a decision. It wasn't a decision to die—he suspected that was no longer a variable he could control directly. It was a decision to minimize the surface area of his interaction with the world.

  He picked up the phone and dialed Sarah.

  "Dad? Is everything okay?"

  "I'm not going to be able to see you for a while, Sarah."

  "Why? Is it your health?"

  "My health is... stable. More than stable." He paused. He couldn't explain the math. He couldn't explain that he felt like a particle trapped in a potential well that was getting deeper and narrower. "I'm going to stop leaving the house. And I don't think you should come here."

  "Dad, that's isolation. That's depression."

  "It's containment," Elias said softly.

  He hung up.

  He walked back to his desk and opened his logbook. He began to write. Not a diary, but a record of the anomalies. The times the traffic lights stayed green. The times the power grid faltered everywhere but his street. The times his heart skipped a beat and then resumed without fibrillation.

  He realized then the true horror of the anthropic claim. It wasn't that he would live forever. It was that he would live until the universe ran out of branches that could support him. And as the probability of his survival dropped toward zero, the complexity of the events required to sustain him would rise toward infinity.

  He would not die in a fire; the sprinkler system would activate due to a sensor error caused by a cosmic ray. He would not die of a stroke; the clot would dissolve due to a rare enzyme interaction triggered by a specific meal.

  He was becoming a puppet of probability.

  Elias capped his pen. He looked at the gun in his drawer. He had bought it years ago, after his wife died, for a purpose he had never voiced. He opened the drawer. He took it out. It was heavy, cold steel.

  If the theory held, he could not use it to end his observation. The gun would jam. The bullet would be a dud. His hand would cramp. Or, most likely, he would pull the trigger, and the bullet would pass through his skull in a way that damaged the tissue responsible for consciousness but left the brainstem intact, trapping him in a vegetative state where he could still *perceive*, still *observe*, still *be*.

  That was the end of the tail. Not darkness. But a locked-in syndrome stretching across eons, sustained by quantum fluctuations that refused to let the light go out.

  He put the gun back.

  He understood now. The asymmetry between first-person anticipation and third-person probability wasn't a gift. It was a sentence. To the outside world, he was a man who had used up nine lives. To himself, he was a man who had run out of exits.

  He sat back in his chair. He would not seek death. He would not seek life. He would simply minimize the collateral damage. He would stay in the house. He would eat bland food to avoid choking. He would walk slowly to avoid falling. He would become a monk of probability, praying not for salvation, but for simplicity.

  He watched the dust motes dancing in the lamplight. Each one a universe, colliding, scattering.

  "Forty years," he whispered to the empty room. "I spent forty years measuring where the particles went."

  He closed his eyes.

  "I never asked where I was."

  The clock on the wall ticked. It was a mechanical clock, old, prone to stopping. It ticked again. And again. Against the odds, the spring held.

  Elias Thorne exhaled, and waited for the next branch.
