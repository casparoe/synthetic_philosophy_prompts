prompt: |-
  I'm several chapters into a novel that follows an animal-rights lawyer who spars, across a string of family dinner-party scenes, with her brother-in-law, a libertarian economist who treats Robert Nozick as something close to scripture. While drafting his lines, I went back to Anarchy, State, and Utopia and got stuck on a passage I'd half-forgotten: in the course of setting up his theory of rights as inviolable "side constraints" on how persons may be treated, rather than goals to be maximized, Nozick briefly floats the idea of utilitarianism for animals and Kantianism for people — treating animal pleasures and pains as freely aggregable and tradeable against one another and against human benefit, while insisting that persons alone may never simply be used as means to others' ends. Tellingly, he seems uneasy with his own suggestion, conceding that it is unclear how the two systems are supposed to mesh whenever a single action affects both a person and an animal, and he leaves the tension essentially unresolved.

  I would like my economist character to be pressed harder on this than Nozick presses himself, so that his sister-in-law can deliver a rebuttal with real teeth. Could you lay out, in full and at the level of rigor I could adapt for that scene, the strongest argument against maintaining this "utilitarianism for animals, Kantianism for people" split? I am especially keen for you to explore whether the very worry that led Nozick to reject unconstrained aggregation for persons elsewhere in the book — his "utility monster," and the broader thought that no individual should be treated as a mere receptacle for maximizing some overall sum — does not equally indict pure aggregation within the animal kingdom, and whether any non-arbitrary place remains to draw the line between beings who receive side constraints and beings who are merely weighed against one another. Please do not settle for a bare gesture at "the argument from marginal cases"; work through the strongest version of the case against Nozick's split, and address the best moves available to him, or to a defender of his position, along the way.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the Request:**
      *   **Context:** A novel featuring an animal-rights lawyer vs. a libertarian economist (Nozickian).
      *   **Specific Issue:** Nozick's brief suggestion in *Anarchy, State, and Utopia* (ASU) of a hybrid view: Utilitarianism for animals, Kantianism (side constraints) for humans.
      *   **Goal:** Provide a rigorous, high-level philosophical rebuttal to this split, suitable for adaptation into a dinner-party scene.
      *   **Key Requirements:**
          *   Don't just wave at the "Argument from Marginal Cases."
          *   Connect Nozick's own rejection of utilitarianism for humans (the "separateness of persons," the "utility monster") to the treatment of animals.
          *   Address the best counter-moves a Nozickian could make.
          *   Maintain high philosophical rigor but keep it adaptable for dialogue.

  2.  **Deconstruct Nozick's Position (ASU):**
      *   *Core Thesis:* Individuals have rights (side constraints) that cannot be violated even for the greater good. This is based on the "separateness of persons."
      *   *The Animal Exception:* Nozick speculates that animals might not have these inviolable rights. Their suffering counts, but it can be aggregated and traded off.
      *   *The Tension:* He admits he doesn't know how to reconcile the two systems when they conflict.
      *   *The Basis for Human Rights:* Rationality, autonomy, moral agency? Nozick is actually a bit vague here, leaning towards "value-seeking beings" or beings capable of shaping their lives according to an overall conception.

  3.  **Brainstorming the Rebuttal (The Lawyer's Attack):**
      *   *Angle 1: The Separateness of Persons vs. Separateness of Animals.* If the reason humans get rights is that sacrificing one for another fails to respect the boundary between distinct lives, doesn't the same apply to animals? A cow is not a container for utility any more than a human is.
      *   *Angle 2: The Utility Monster.* If we allow aggregation for animals, we create a "animal utility monster." If enough animals suffer a little, can we torture one human? Nozick says no. But if enough humans benefit a little, can we torture a million cows? If the logic is "aggregation is okay for non-persons," what stops the slide?
      *   *Angle 3: The Boundary Problem (Marginal Cases).* If the line is rationality/autonomy, what about humans who lack it (infants, cognitively disabled)? If the line is species, that's speciesism (arbitrary). If the line is "sentience," then aggregation applies to humans too (utilitarianism). If the line is "moral agency," then many humans lose rights.
      *   *Angle 4: Internal Consistency.* Nozick rejects utilitarianism because it doesn't take seriously the *distinction between persons*. But suffering is suffering. To take seriously the distinction between *sentient beings*, you must grant them some protection against aggregation.

  4.  **Developing the Strongest Argument (The "Separateness of Subjects" Argument):**
      *   *Premise 1:* Nozick's rejection of human utilitarianism rests on the claim that there is no "social entity" that experiences the sum total of utility. Only individuals experience pain/pleasure. Therefore, sacrificing Individual A for Individuals B+C violates A's distinct existence.
      *   *Premise 2:* Animals are also distinct subjects of experience. There is no "animal collective" that feels the sum of animal pain. Only the individual cow/chicken feels its own pain.
      *   *Conclusion:* Therefore, aggregating animal pain to offset human gain treats the animal as a mere receptacle, violating the very same metaphysical truth that grounds human rights.
      *   *The "Line" Problem:* If the economist draws the line at "rationality," he must explain why a severely disabled human has rights while a highly intelligent pig does not. If he draws it at "species," he admits it's arbitrary prejudice.

  5.  **Addressing Counter-Moves (The Economist's Defense):**
      *   *Defense 1: "Capacity for a Conception of the Good."* Humans plan lives; animals just live them.
      *   *Rebuttal:* This excludes human infants and the senile. If you include them via "potential" or "species membership," you've abandoned the philosophical principle and retreated to biological chauvinism.
      *   *Defense 2: "Reciprocity/Community."* Rights are a social contract among agents.
      *   *Rebuttal:* This makes rights a matter of power, not morality. It justifies sacrificing the weak human to the strong human if the strong can enforce it. Nozick wants rights to be *natural*, not negotiated.
      *   *Defense 3: "Lexical Priority."* Human rights are absolute; animal interests count only when human rights aren't at stake.
      *   *Rebuttal:* This is question-begging. Why is the threshold exactly at the human species boundary? It looks like a convenient place to stop the moral demand without justifying *why* it stops there.

  6.  **Drafting the Content (Structuring for the User):**
      *   *Introduction:* Acknowledge the depth of the request. Set the stage (philosophical rigor).
      *   *Core Argument (The "Separateness of Subjects"):* Focus on the metaphysics of experience. This is the strongest internal critique of Nozick.
      *   *The "Marginal Cases" Refinement:* Move beyond the basic "what about babies" to the "inconsistent criteria" argument.
      *   *The "Utility Monster" Reversal:* Show how animal utilitarianism creates the exact horror Nozick feared for humans.
      *   *The Economist's Best Defense & Its Collapse:* Anticipate the "Rationality/Agency" defense and show how it fractures.
      *   *Dialogue Snippets:* Provide actual lines the lawyer can use to ground the theory in the scene.

  7.  **Refining the Tone:**
      *   Needs to be intellectual but sharp.
      *   Avoid academic jargon where possible, or explain it through metaphor (since it's a novel).
      *   Ensure the lawyer sounds like she knows Nozick better than the economist does (ironic reversal).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I avoid just saying "Argument from Marginal Cases"?
      *   *Correction:* Yes, I need to make sure I focus on the *structural* inconsistency regarding aggregation and the "separateness of persons" thesis, using marginal cases only to expose the failure of the proposed dividing line.
      *   *Check:* Is Nozick's specific text honored?
