answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. Rain streaks the window. Two coffee cups sit untouched.*

  **Elena (Counterfactualist):** You're treating the absence of the pill like it's a ghost, Marcus. But the death is real. The body stopped. The counterfactual is clean: if the nurse had administered the dose, the resident would be alive. That dependence *is* the causal relation. It doesn't matter if the link is a transfer of energy or a gap where energy should have been.

  **Marcus (Process Theorist):** It matters immensely, Elena. If I say "the bullet caused the death," I can trace a continuous spatio-temporal process. A transfer of momentum. If you say "the *lack* of a pill caused the death," you're asking me to trace a process that isn't there. You're asking me to say that *nothing* pushed the biology toward the end state. That's not causation; that's an explanation of why prevention failed.

  **Elena:** But if you deny it's causation, you break the symmetry of our reasoning. We reason about omissions exactly like we reason about acts. We intervene on omissions. If I want to prevent the death next time, I ensure the pill is given. I treat the omission as the cause. Why should your metaphysics force me to speak in a different tongue than my science?

  **Marcus:** Because science tracks physical mechanisms. Law and morality track responsibilities. You're conflating the two. Look, let's use your friend's case. The nurse missed the dose. You say that's a cause. Fine. But what about the resident's estranged son? He didn't send the pill. He didn't visit. If he had, maybe he would have noticed the nurse was absent and administered it himself. Counterfactually: if the son had acted, she lives. So, on your view, is the son a cause of her death?

  **Elena:** He is *a* cause, yes. In the vast web of counterfactual dependencies, many things are causes.

  **Marcus:** And the pharmacist who didn't hand-deliver it? The Prime Minister who didn't fund the care home better? The passerby who didn't break in and help? Elena, your account leads to a profusion of causes. It makes causation so cheap it loses its explanatory power. If everyone is a cause, no one is.

  **Elena:** That's the "Problem of Profusion," and it's not fatal. It just means causation is context-sensitive. When we ask "What caused the death?", we aren't asking for the total set of counterfactual dependencies. We're asking for the *salient* ones.

  **Marcus:** Salient to whom? And based on what?

  **Elena:** Based on the default state of the system. In the context of a care home, the "default" is that medication is administered. The "deviant" state is that it is not. The son visiting is not part of the default model of the care home's functioning. So, while the son's absence is counterfactually relevant, it's background. The nurse's omission is foreground.

  **Marcus:** Ah, there it is. "Default." "System." "Functioning." Do you see what you've done? You've smuggled norms into your metaphysics. The only reason the nurse's omission is "default" and the son's is "background" is because the nurse was *paid* to be there. The son was not. You're distinguishing causes based on who was *supposed* to act.

  **Elena:** I'm distinguishing them based on the structural model of the situation, not moral blame.

  **Marcus:** But the structural model is built on expectations! If the son was the legal guardian, he moves from background to foreground. If the nurse was on strike, maybe she moves to background. Your "causal facts" change depending on the contract law. That proves my point: there is no physical difference between the nurse's absence and the son's absence. The only difference is normative. So, you haven't found a metaphysics of omission-causation; you've found a metaphysics of responsibility.

  **Elena:** I reject that dichotomy. Causation is always relative to a model. If I ask what caused the car to stop, it could be "the brake was pressed" or "the engine failed." Both are physical. But if I ask why the plant died, "lack of water" is a cause relative to the model of a garden. If I don't water it, I cause its death. If the rain doesn't fall, did the rain cause its death? Maybe. But in a garden, the irrigation system is the causal mechanism. This isn't moral; it's about system boundaries.

  **Marcus:** But why call it causation at all, then? If you have to appeal to system boundaries and default values to filter the causes, you've admitted that the physical world doesn't distinguish them. That's why I prefer "quasi-causation."

  **Elena:** That's what I wanted to ask. "Quasi-causation." If it's not causation, what work is it doing? Is it just a polite fiction? Because if I'm a lawyer, or a doctor, I don't care about your "quasi." I care about what made the difference.

  **Marcus:** It buys you explanatory utility without ontological bloat. When we say the nurse "quasi-caused" the death, we are saying: "The nurse's behavior is the appropriate locus for intervention and explanation within our social practices." It acknowledges that we treat omissions *as if* they were causes for the purpose of assigning liability and learning from mistakes. But it refuses to lie about the physics. It says: "There was no force here. There was only a failure of a force to appear."

  **Elena:** But then you have two categories. Real causation (acts) and quasi-causation (omissions). But they behave identically in our reasoning. We predict using them. We explain using them. We intervene using them. Why posit a metaphysical schism? It looks like you're protecting a physicalist intuition at the cost of explanatory unity.

  **Marcus:** Because the schism is real! If I push a boulder and it crushes someone, energy transfers. If I *don't* push a boulder and it crushes someone because I was supposed to hold it back, no energy transfers from me to the boulder. The gravity does the work. My "quasi-causation" captures the fact that I am *responsible* for the gravity doing the work, without claiming I *pushed* it with my absence.

  **Elena:** Okay, let's press that. You say the son is not even a quasi-cause?

  **Marcus:** He is a quasi-cause, potentially. But a weaker one.

  **Elena:** On what grounds? If quasi-causation tracks responsibility, and the son had a moral duty but no legal one, is he a quasi-cause?

  **Marcus:** It depends on the context of the inquiry. In a moral inquiry, yes. In a legal one, no. In a physical one, neither.

  **Elena:** And that's where you lose me. You're saying the causal status of the event depends on whether we are in a courtroom or a living room. I say the causal status is stable, but our *interest* varies.

  **Marcus:** No, I'm saying the *causal* status is stable: it's null. There is no causation by absence. The *quasi-causal* status varies based on norms. You want to bake the norms into the causation. I want to keep the causation pure and attach the norms separately.

  **Elena:** But if the causation is null, why does the world respond to the omission exactly as it does to an act? If I poison the patient (act) vs. withhold the antidote (omission), the biological pathway is identical. The body dies the same way. If your metaphysics says one is "causation" and the other is "quasi-causation," but the biology can't tell the difference, isn't your metaphysics failing to carve nature at its joints?

  **Marcus:** The biology *can* tell the difference. In one case, a toxin enters the bloodstream. In the other, a nutrient fails to enter. One is a presence of a foreign process; the other is the continuation of an entropic process.

  **Elena:** But the "continuation of an entropic process" is only fatal because the nutrient was *expected*. If I never had the nutrient, I don't die from "lack," I just die. The "lack" is defined by the expectation. You're back to norms.

  **Marcus:** I'm back to conditions. A plant dies from lack of water only if water was available to be given.

  **Elena:** And available according to whom?

  **Marcus:** According to the setup of the situation.

  **Elena:** Which is defined by agents and their plans. Which is normative.

  **Marcus:** *Pragmatic*, Elena. Not necessarily moral.

  **Elena:** Pragmatics determine what we *say*. Metaphysics determines what *is*. If pragmatics determine the causal verdict, then causation isn't mind-independent. Are you willing to go that far? To say that whether the nurse caused the death depends on whether we are looking at her contract?

  **Marcus:** I'm willing to say that "causation" is a folk concept we use to navigate the world. But "physical causation"—the conserved quantity transfer—is the bedrock. Omissions sit on the upper floor. They rely on the bedrock, but they aren't it.

  **Elena:** And I'm saying that if the upper floor is where we live, where we litigate, where we medicate, then that's the floor that matters. If I have to choose between a metaphysics that says the nurse didn't really cause the death, and one that says she did but we have to filter the son out via context, I'll take the latter. At least it acknowledges that the nurse's absence *did* something.

  **Marcus:** It acknowledges she failed to stop something.

  **Elena:** And isn't that what causing is, sometimes? Removing a blocker?

  **Marcus:** Removing a blocker is an act. *Not placing* a blocker is an omission.

  **Elena:** We're spinning.

  **Marcus:** We are.

  **Elena:** So, in the care home. The nurse is liable. The son is not. You say that's because only the nurse quasi-caused it. I say it's because only the nurse caused it. The difference is...

  **Marcus:** ...Whether you think "cause" describes a physical link or a dependency in a normative system.

  **Elena:** And neither of us can prove the other wrong without first agreeing on what "cause" is supposed to do.

  **Marcus:** Exactly. Do we want it to track energy? Or do we want it to track blame?

  **Elena:** I want it to track *difference-making*.

  **Marcus:** And I want it to track *mechanisms*.

  *(Silence falls between them. The rain intensifies against the glass.)*

  **Elena:** So, the resident is still dead.

  **Marcus:** Regardless of the metaphysics.

  **Elena:** But if we can't agree on why, we can't agree on how to prevent it next time. If it's a mechanism failure, we build a machine to dispense pills. If it's a normative failure, we train the nurse.

  **Marcus:** Or we do both. Because the quasi-cause points to the training, and the physical cause points to the biology.

  **Elena:** Fine. Quasi-cause it is. For now. But don't think I've conceded the metaphysics.

  **Marcus:** And don't think I've conceded that nothing happened that night. Something happened. Just not what you think it is.

  *(They pick up their cold coffee. The argument is paused, not resolved.)*
