answer: |-
  # The Logarithmic Mask: Why Kelly Is Distinct Even When It Isn't

  The debate over Kelly betting is one of the few places in decision theory where the stakes feel genuinely existential. On one side stands the orthodox Expected Utility (EU) framework, championed by Paul Samuelson, which treats rationality as a matter of internal consistency among preferences. On the other stands a coalition of ergodicity economists and geometric rationalists, who argue that rationality is a matter of surviving the physical dynamics of time.

  You asked for a verdict, not a diplomatic summary. Here it is: **Samuelson is mathematically correct but normatively vacuous. The Ergodic and Geometric camps are right that Kelly maximization represents a distinct rationality norm, not because it produces behaviors EU cannot mimic, but because it derives the *source* of normativity from the structure of the world rather than the whims of the agent.**

  To understand why this distinction matters, we have to strip away the math and look at what "rationality" is supposed to be doing. Is it a mirror for our desires, or a map for our survival?

  ### The Samuelson Shield: Everything Is Log Utility If You Squint

  Paul Samuelson's 1979 takedown of Kelly is a masterpiece of grumpy formalism. His argument rests on the Von Neumann-Morgenstern (VNM) axioms. If an agent's preferences satisfy completeness, transitivity, independence, and continuity, they can be represented as maximizing the expected value of some utility function $U(w)$.

  Samuelson's point is simple: If you bet according to the Kelly criterion, you are behaving *exactly* as if you have a logarithmic utility function, $U(w) = \ln(w)$. There is no need for a new theory of "growth optimality." You just have log utility. End of story.

  Furthermore, Samuelson attacks the "long-run" justification. Kelly proponents argue that betting the Kelly fraction maximizes the almost-sure asymptotic growth rate. Samuelson retorts that "almost surely" is not "surely." In the finite time horizons that actual humans inhabit, a Kelly bettor can still go nearly broke. If an agent cares about intermediate consumption or has a utility function that isn't logarithmic (say, they need a specific sum for surgery next year), maximizing geometric growth is irrational. For Samuelson, there is no "objective" rationality that overrides subjective preference. To say Kelly is *the* rational strategy is to impose a specific risk preference on everyone and call it physics.

  This view is robust. It is incredibly hard to find a behavior that *cannot* be rationalized as EU maximization with a sufficiently convoluted utility function. If you jump on a grenade to save your friends, you didn't violate EU; you just had a utility function that weighted others' lives heavily. If you bet Kelly, you just have log utility. The EU framework is a universal solvent; it dissolves every specific claim into a preference statement.

  ### The Ergodic Revolt: Time Is Not an Ensemble

  The counter-argument, revitalized by Ole Peters and the ergodicity economics crowd, attacks the *interpretation* of the expectation operator.

  Standard EU maximization calculates an expectation by averaging over an **ensemble**: a million parallel versions of you placing the bet once. In this ensemble, the average wealth grows exponentially if the bet has positive expected value. But you are not a million parallel people. You are one person placing the bet a million times in **sequence**.

  In multiplicative dynamics (where your next bet depends on your current wealth), the ensemble average and the time average diverge. This is non-ergodicity. The ensemble average might say you get rich, but the time average (the single path you actually live) might say you hit zero and stay there. Once wealth hits zero, the game ends.

  Peters argues that maximizing the geometric mean isn't a "preference" for log utility; it is the mathematical condition required to maximize the time-average growth rate of a single trajectory. Volatility drag is not a risk preference; it is a physical tax on compounding. If you bet too much, the math of multiplication ensures you shrink, regardless of how much you "want" to be rich.

  Here, the normativity shifts. In the Samuelson view, avoiding ruin is a preference (you happen to dislike having zero money). In the Ergodic view, avoiding ruin is a dynamic necessity for continued existence. You don't choose log utility because you like it; you choose it because it is the only utility function that aligns with the time-average growth of multiplicative processes.

  ### Geometric Rationality: Beyond Wealth

  Scott Garrabrant's work on geometric rationality extends this beyond money. He proposes that geometric expectation maximization unifies betting, Nash bargaining, and belief updating (Thompson sampling).

  The core insight here is that standard EU maximization is additive, but many rational interactions are multiplicative. When you bargain, you are dividing a surplus; when you update beliefs, you are multiplying likelihoods. Garrabrant argues that agents designed to maximize geometric expectations exhibit properties of "coalitional rationality" that additive EU maximizers miss. For example, geometric rationality naturally handles situations where agents have different "currencies" or scales of value without needing to define a common linear metric.

  Critics argue that Garrabrant's agents can still be redescribed as EU maximizers over a transformed space. Technically, this is likely true. You can probably construct a utility function over "geometric outcomes" that mimics the behavior. But this misses the forest for the trees. The claim of geometric rationality is not that the behavior is impossible to model with EU, but that the *axioms* leading to it are more natural for embedded, interacting agents. It posits that the geometry of interaction dictates the rationality, not the other way around.

  ### The Verdict: Formal Reducibility vs. Normative Distinctness

  So, where do we draw the line?

  If the question is **"Can Kelly behavior be modeled within the Expected Utility framework?"**, the answer is **Yes**. Samuelson wins on formalism. Any decision rule that maps states to actions can be rationalized by *some* utility function. To claim otherwise is to misunderstand what a representation theorem does.

  However, if the question is **"Is Kelly betting a distinct rationality norm?"**, the answer is **Yes**. The Ergodic and Geometric camps win on explanation.

  Here is the precise distinction: **Expected Utility treats the utility function as exogenous (a input), while Ergodic/Geometric rationality treats it as endogenous (a derivation).**

  In the standard EU view, if I ask "Why should I bet Kelly?", the answer is "Because you happen to have log utility." If you ask "Why do I have log utility?", the theory has no answer. It is a brute fact of your psychology. This makes EU a theory of *consistency*, not a theory of *success*. It tells you how to not contradict yourself, not how to not go broke.

  In the Ergodic/Geometric view, if I ask "Why should I bet Kelly?", the answer is "Because you exist in time, your wealth compounds multiplicatively, and this is the strategy that maximizes your growth rate without risking ruin." The utility function is derived from the dynamics of the environment and the nature of the agent.

  This makes Kelly a distinct norm because it changes the *source* of authority.
  1.  **EU Authority:** Internal coherence. (Are my choices consistent with my stated preferences?)
  2.  **Kelly/Geometric Authority:** External alignment. (Are my choices consistent with the dynamics of the world I inhabit?)

  Samuelson's critique that "practically certain to win eventually" isn't enough is valid for finite horizons, but it ignores that for an indefinite sequence of decisions (a life), the time-average *is* the only average that matters. The "ensemble" of parallel universes is a mathematical fiction useful for pricing derivatives, but irrelevant for a single life path.

  ### Conclusion

  We should reject the idea that Kelly is "just" expected utility with log utility. That statement is technically true but intellectually sterile. It is like saying "flight is just heavy objects falling in a controlled manner." Technically, aerodynamics is a subset of gravity, but saying so obscures the distinct principles of lift that make flight possible.

  Kelly betting and geometric rationality are distinct norms because they attempt to ground rationality in the physics of time and interaction, rather than the axioms of preference. They argue that there are objective constraints on rational action imposed by the non-ergodic nature of reality.

  Samuelson was right that you can't derive an "ought" from an "is" without a utility function. But the Ergodicists are right that for a living, breathing, compounding agent, the utility function *ought* to be logarithmic because that is what allows the agent to persist. Rationality is not just about getting what you want; it is about wanting what allows you to stay in the game. On that ground, Kelly is not a disguise. It is the baseline.
