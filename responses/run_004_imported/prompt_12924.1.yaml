answer: |-
  **Setting:** *The mouth of a collapsed coal mine. Dust hangs thick in the air. Sirens wail in the distance. Two shafts branch off ahead: Shaft Left, where five miners are trapped, and Shaft Right, where one miner is trapped. The structural integrity is failing; there is time to reinforce and enter only one shaft.*

  **Characters:**
  *   **Thomas:** A hardline Taurekian.
  *   **Tim:** A Scanlonian contractualist.

  ***

  **Thomas:** *(Grabbing Tim's harness)* Don't you dare run left. Get the coin out.

  **Tim:** *(Shoving past)* There's no time for gambling, Thomas. Five people in Left. One in Right. I'm going Left.

  **Thomas:** And that's exactly the moral crime we're here to discuss! You're treating the five as a super-person. You're saying five lives weigh more than one. Taurek proved that's nonsense. Each person has a claim to be saved. That claim is absolute for them. It doesn't diminish because others are shouting louder down a different hole.

  **Tim:** It's not about weight! It's about justification. If I flip a coin, I'm telling the five that their claim to life is worth exactly the same as the one's claim *in aggregate*, but I'm ignoring the specific pairwise comparisons. Scanlon's procedure is clear. Start with one from Left and the one from Right.

  **Thomas:** *(Pulling a coin from his pocket anyway)* A tie. I know the script. 50/50. Flip it.

  **Tim:** But there *are* no ties here, not really. Once you acknowledge the first miner in Left has a claim equal to the miner in Right, you haven't accounted for the *second* miner in Left. His claim is still standing. If you save the guy in Right, the second miner in Left dies *and* the first miner in Left dies. If you save Left, only the guy in Right dies. The "spare" four aren't adding weight to the first guy's claim; they are breaking the tie by virtue of having unmet claims of their own.

  **Thomas:** *(Laughs, a harsh, coughing sound)* Oh, that is rich. "They aren't adding weight, they're just breaking the tie." That is aggregation in a trenchcoat, Tim. It's the same math, just wearing a hat to hide the utilitarianism.

  **Tim:** It is *not* the same math. Utilitarianism sums the good. I am looking at the distribution of loss.

  **Thomas:** Don't give me the distribution spiel. When you let the "spare" four break the tie, what are you doing? You are saying that the existence of four *additional* people overrides the equal claim of the single person. You are counting persons. Taurek's whole point is that the "separateness of persons" forbids this. I cannot sacrifice One for the sake of Four. But your "tie-breaker" *is* sacrificing One for the sake of Four. You're just pretending the Four aren't pushing on the scale together.

  **Tim:** They aren't pushing on the scale! Look at it from the perspective of reasonable rejection. Could the single miner reject a principle that says "Save the Greater Number"? Yes. But could the five reject a principle that says "Flip a Coin"? Absolutely. They would say, "Why should we die so that you can maintain a philosophical purity about non-aggregation?" The tie-breaking argument explains *why* the five can reject the coin flip without appealing to a greater good. It appeals to the fact that if we save the One, *more individual claims go unmet* than if we save the Five.

  **Thomas:** *(Steps closer, voice dropping)* There it is. "More individual claims." You just said it. *More.* You are counting the claims. You are summing the unmet demands.

  **Tim:** I'm counting the *instances* of loss, not summing the *value* of lives. There is a difference.

  **Thomas:** Is there? To the person dying, the "instance of loss" is everything. If I'm the One in Shaft Right, and you tell me, "I'm letting you die because four other people also have claims," you are using their existence to cancel out my right. You are treating their claims as a bloc. You say, "Well, Miner 1 vs. Miner 6 is a tie, so we flip... oh wait, Miner 2 is here, so Left wins." That means Miner 2's presence changed the moral outcome for Miner 6. That means Miner 6's fate depends on how many strangers are standing next to Miner 1. That is aggregation. It's just step-wise aggregation.

  **Tim:** It's not step-wise, it's iterative. It respects the separateness of persons by addressing them one by one. Miner 2 doesn't cancel Miner 6. Miner 2 just ensures that if we choose Right, a *second* person suffers a loss that could have been prevented. We owe it to Miner 2 not to let him die if we can save him without costing Miner 6 anything *extra* than he was already going to cost us in the tie.

  **Thomas:** "Without costing Miner 6 anything extra." That's the sleight of hand. In the 1-vs-1 tie, Miner 6 has a 50% chance. By bringing in Miner 2, 3, 4, and 5, you've reduced Miner 6's chance to 0%. You have sacrificed Miner 6's probability of survival for the sake of Miner 2 through 5. You have weighed the group's interest against the individual's interest. Taurek says you can't do that. You can't put four claims on one side of the scale to outweigh one claim on the other, even if you claim you're placing them on the scale one at a time. The scale still tips because of the *number* of claims.

  **Tim:** The scale tips because of the *logic* of the claims, not the number! If I save the One, I leave Four claims unsatisfied. If I save the Five, I leave One claim unsatisfied. The principle "Minimize the number of unmet claims" is not utilitarianism; it's a principle of equity that no one could reasonably reject because it minimizes the total instances of catastrophic loss without claiming the Five are *worth more* than the One.

  **Thomas:** *(Gesturing at the shafts)* "Minimize the number." There's the word. *Number.* You think Scanlon dodged Taurek? He didn't. He just built a staircase to the same cliff. If the "spare" people get to break the tie, their claims are being weighed as a bloc against the one person's claim. That is exactly the move Taurek says isn't available to us. You can't use the existence of others to trump an individual's equal claim. If I'm Miner 6, I don't care that you counted me pairwise. I care that I'm dead because there were more of them than there were of me.

  **Tim:** And if you're Miner 2, you care that you're dead because we wanted to prove a philosophical point about non-aggregation. The contractualist demand is to find a rule we can live with. A rule that says "Let the extra people die to avoid counting" is a rule the extra people will reject. The tie-breaking procedure is the only way to acknowledge that *everyone's* claim counts, without summing them into a blob of utility. It acknowledges Miner 2 matters *as much as* Miner 1, not *more than* Miner 6.

  **Thomas:** But it uses Miner 2 to defeat Miner 6! That's the aggregation! You're saying Miner 1 + Miner 2 > Miner 6.

  **Tim:** No! I'm saying (Miner 1 = Miner 6) + (Miner 2 > Null). Therefore, Left.

  **Thomas:** *(Shakes his head, dust falling from his helmet)* "Miner 2 > Null." You're assigning value to the presence of Miner 2 to tip the balance. That is the definition of counting. You're adding the value of Miner 2's survival to the equation. Taurek was right. You can't add. You have to choose. And if you can't choose based on numbers, you choose based on chance.

  **Tim:** Chance is abandonment.

  **Thomas:** Numbers are tyranny.

  *(A loud crack echoes from the ceiling. A beam groans overhead.)*

  **Tim:** The roof won't wait for us to solve meta-ethics, Thomas.

  **Thomas:** *(Holding the coin out)* Then make it fair. Heads Left, Tails Right.

  **Tim:** *(Looking at the five miners' helmets piled by Shaft Left, then the single one by Shaft Right)* If I flip that, and it lands Tails, I have to look four people in the eye and tell them they died because I was afraid of doing arithmetic.

  **Thomas:** And if you run Left, you look the one in the eye and tell him he died because he was outnumbered.

  **Tim:** I tell him he died because saving him would have required leaving four others to die when it wasn't necessary. There is a difference in justification.

  **Thomas:** There is no difference in the blood, Tim.

  *(Tim stares at the coin, then at the shafts. The dust thickens.)*

  **Tim:** I'm going Left.

  **Thomas:** *(Pocketing the coin)* Then you're no better than the utilitarian you claim to hate. You just hid the calculus behind a tie-breaker.

  **Tim:** *(Running toward Shaft Left)* Better a calculator than a gambler with five lives on the line!

  **Thomas:** *(Watching him go, shouting after him)* You didn't answer the charge! You're still counting!

  *(Tim disappears into the dust of Shaft Left. Thomas stands alone at the junction, the silence of Shaft Right pressing in on him.)*
