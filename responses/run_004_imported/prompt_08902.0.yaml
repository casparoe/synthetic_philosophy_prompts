  I'm outlining a psychological thriller where my narrator's husband and his sister spend the whole first half of the book proving shes become unreliable -- forgetting conversations, mixing up dates, misplacing things -- until by the midpoint she's staring down genuinely solid evidence (documented, not just their word) that her memory really has slipped. Problem is, she still trusts one specific memory that would blow up their whole story, and I want that to read as rational, not as a woman digging her heels in for plot convenience. I know epistemologists actually argue about exactly this structure: whether you're allowed to keep an object level belief once you've got strong higher order evidence that your reasoning about it is compromised, even though that seems to trap you in a kind of epistemic akrasia (believing P while believing your belief in P isn't justified) -- most treat something called the 'enkratic principle' as basically untouchable and say no, you cant. Can you build the strongest possible case for the other side, that she can rationally hang onto the memory anyway, and then tell me straight what the best reason is to think that's wrong. Trying to get the psychology actually right, not just dramatically convenient.
