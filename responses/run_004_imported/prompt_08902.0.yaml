answer: |-
  This is a sophisticated narrative problem because you are asking for *structural rationality* in a character who is being systematically undermined. You want to avoid the "magic woman" trope where the heroine just *knows* she's right because the plot says so.

  Here is the strongest philosophical case for why your narrator can rationally retain that specific memory, followed by the hard epistemological truth about why she technically shouldn't be able to.

  ### The Case for Rationality: "The Undercutting Defeater"

  To make her retention of the memory rational, you must move the battle from **First-Order Evidence** (the memory vs. the documents) to **Higher-Order Evidence** (the source of the documents).

  The consensus view you mentioned (that she must defer to the evidence of her own decline) assumes the higher-order evidence is *neutral*. It isn't. It is being presented by interested parties (husband and sister).

  **1. Epistemic Independence and the "Total Evidence" View**
  Philosophers like Thomas Kelly or those advocating for the "Total Evidence View" argue that higher-order evidence (evidence that your reasoning is flawed) is just more evidence to be weighed in the pot; it doesn't automatically trump first-order evidence.
  *   **The Argument:** Her memory is a direct, sensory, first-order experience (e.g., "I saw the blue vase on the table"). The documents are testimonial evidence filtered through her husband. If she has independent reason to distrust her husband (even a small one), she can rationally weigh the vividness of the sensory memory *heavier* than the documents he produced.
  *   **Narrative Application:** She shouldn't think, "I know I'm crazy, but I believe this anyway." She should think, "These documents are concrete, yes. But my eyes were concrete too. Which is more likely: that my brain deleted this specific moment, or that these papers were planted?"

  **2. The "Undercutting Defeater" (The Conspiracy Hypothesis)**
  In epistemology, a *rebutting defeater* gives you reason to believe $P$ is false. An *undercutting defeater* gives you reason to think your *evidence* for $P$ doesn't support $P$.
  *   **The Argument:** If she suspects gaslighting, the "evidence of her illness" (the documents) transforms into "evidence of their malice."
  *   **Why it's rational:** It is not irrational to trust a faculty (memory) over external testimony (documents) if you suspect the external testimony is forged. In fact, if she accepts the documents as proof of her insanity *without* investigating their provenance, *that* would be the irrational leap. She is applying a standard of scrutiny to the documents that she cannot apply to her own mind.
  *   **The "Bedrock" Proposition:** Drawing from Wittgenstein's *On Certainty*, some propositions are so foundational that doubting them makes all other judgment impossible. If this specific memory is a "hinge proposition" (e.g., "I know who my child's father is" or "I know I didn't sign that check"), abandoning it collapses her entire worldview. Retaining it is a survival mechanism required to process *any* further evidence.

  **3. The "Calibration" Argument**
  Philosopher Sophie Horowitz argues that we can sometimes be rationally "steadfast."
  *   **The Argument:** If her memory has slipped on *dates* and *keys* (general reliability), that does not statistically necessitate it has slipped on *this specific, high-salience event* (emotional reliability).
  *   **Narrative Application:** She can concede the small errors ("Okay, I forgot the anniversary date") while maintaining the big one ("But I did not forget the argument we had that night"). This avoids the "all or nothing" trap. She is calibrating, not denying.

  ***

  ### The Best Reason She Is Wrong: "The Bootstrapping Problem"

  Now, the hard truth. If you want the psychology to be tight, you need to understand why epistemologists generally say she *cannot* hold this position without falling into **Epistemic Akrasia** (believing $P$ while believing you shouldn't believe $P$).

  **The Circularity of Self-Verification**
  The strongest argument against her is that she is using the tool under inspection to verify the tool.
  *   **The Logic:** To suspect the documents are forged, she must use her memory and reasoning. ("I remember him acting shady," or "I recall this date differently.") But the documents claim her memory and reasoning are compromised.
  *   **The Trap:** If the evidence of her impairment is strong enough, she is required to lower her confidence in the very cognitive processes she is using to doubt the evidence.
  *   **The "Enkratic" Violation:** If she admits, "It looks like I'm losing my mind," but concludes, "Therefore, I trust my gut over the medical report," she is violating the norm of coherence. She is effectively saying, "My cognitive faculties are broken, so I will ignore the data they are failing to process."
  *   **Psychological Reality:** In real gaslighting scenarios, the victim's rationality *does* fracture. They don't stay coolly philosophical. They become anxious, hyper-vigilant, and desperate. If she remains too calm in her certainty, she reads as a superhero, not a victim. The tragedy of gaslighting is that the victim often *does* start to believe the higher-order evidence because they cannot escape the circle.

  ***

  ### How to Write This (The Synthesis)

  To make this work in a thriller without breaking the philosophy or the tension, you need to thread the needle between **Steepfastness** and **Doubt**.

  **1. Don't let her be certain she is right.**
  Let her be certain the *husband is lying*.
  *   *Wrong:* "I know this memory is true." (This invites the akrasia charge).
  *   *Right:* "I know *he* is capable of faking that document."
  *   **Why:** This shifts the burden. She isn't defending her memory; she is attacking the provenance of the counter-evidence. This is rational detective work, not irrational stubbornness.

  **2. Use "Emotional Salience" as the Differentiator.**
  Give the specific memory a sensory weight that the documents lack.
  *   Documents are abstract. Memory is visceral.
  *   Have her focus on the *smell* of the room, the *light* on the glass, the *texture* of the object in the memory.
  *   **Philosophical justification:** This leans into **Phenomenal Conservatism** ("If it seems to me that $P$, I have *some* justification for $P$"). The documents have no phenomenology. They are inert. Her memory is alive. It is rational to trust the living signal over the dead noise, *unless* the noise is proven to be the signal.

  **3. Acknowledge the Akrasia.**
  Let her feel the tension. Let her admit, internally, that she looks crazy.
  *   *Internal Monologue:* "Logically, the paper trail wins. I know that. A rational person would turn themselves in. But the paper trail requires me to believe I am a liar, and the memory only requires me to believe he is one. I have lived with him. I have not lived with his filing cabinet."
  *   **Why:** This acknowledges the epistemological problem (she knows she *should* defer to the evidence) but provides a moral/pragmatic override (trust the person, not the system).

  **4. The "Specific Deficit" Loophole.**
  Make sure the "solid evidence" of her decline covers specific domains (short-term working memory, dates, locations) that are distinct from the domain of the Key Memory (trauma, emotional confrontation, visual snapshot).
  *   Medical gaslighting often relies on conflating different types of cognitive load. If she can articulate, "I forget where I put my keys, that is working memory. I do not forget my husband hitting me, that is episodic trauma memory," she creates a rational silo where the Key Memory remains safe.

  ### Summary for the Outline
  *   **To make it rational:** She must treat the "evidence of her illness" as *testimony from a hostile witness*, not brute fact. Her rationality rests on her suspicion of the *source*, not her infallibility.
  *   **The flaw:** She is technically circular. She uses her memory to doubt the proof that her memory is broken.
  *   **The fix:** Write the circularity as a feature, not a bug. She knows it's circular. She chooses the circle that allows her to survive over the circle that requires her to vanish. That isn't epistemology; that's self-preservation. And that is always rational.
