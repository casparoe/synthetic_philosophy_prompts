answer: |-
  Good evening. For those who don't know me, I'm the novelist in the family. Which means I make things up for a living. My sister, on the other hand, is a philosopher. Which means she spends her life explaining why nothing we say is actually true.

  She agreed to let me give this toast on one specific condition. She said, "You can say anything you like, provided you don't imply that I, or my partner, am *ultimately responsible* for being here."

  Now, half of you are nodding solemnly, and the other half are wondering if this is a prenup issue.

  For the family: My sister has spent her career defending a view that says we don't exactly author our own characters. We don't choose our genes, our upbringing, or the impulses that make us fall in love. So, to say she "earned" this happiness would be, in her view, a metaphysical error.

  For the philosophy department: I know the Basic Argument. I know *causa sui* is impossible. I am not going to suggest she willed this into existence through an uncaused cause.

  But here is the thing I *can* say.

  As a writer, I know that the best moments in a story aren't the ones the characters force. They're the moments where the plot threads converge so perfectly that it feels like magic, even if it's just mechanics.

  Looking at the two of you, I see a convergence. A magnificent, unlikely alignment of causal chains stretching back to the beginning of time. You didn't build this from scratch. You *found* it. You recognized it. And in a universe governed by chance and necessity, the fact that your paths collided, and that you recognized the value in that collision, is a miracle of probability.

  It actually makes this love more beautiful to me. Because it isn't a transaction. It isn't a reward for good behavior. It's a gift. A gift from the universe, from your history, from the sheer luck of being alive at the same time in the same place.

  So, I won't say you earned this. I will say you are incredibly fortunate to have it. And I will say that the way you treat each other suggests that the specific combination of neurons and experiences that make you *you* is something this world desperately needs more of.

  May your future be filled with more happy accidents. May your causal chains remain intertwined. And may you never stop marveling at the luck of the draw.

  To the happy couple.
