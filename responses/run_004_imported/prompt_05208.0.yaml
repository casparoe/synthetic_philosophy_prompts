answer: |-
  **Setting:** *The hotel bar of the Grand Hyatt, San Francisco. 11:30 PM. The Decision Theory & Infinity Workshop has just concluded its second day. Most attendees have retreated to their rooms, but two remain at a corner table littered with empty glasses and napkins covered in sigma notation.*

  **Characters:**
  *   **Elena:** A proponent of revisionist decision theory. She finds the silence of Expected Utility Theory (EUT) in the face of dominance violations intolerable.
  *   **Marcus:** A defender of orthodox formalism. He believes the paradox arises from category errors regarding infinite sums, not defects in rationality.

  ***

  **Elena:** (Stirring her drink, staring at a napkin) It's the silence that gets me. That's the real scandal of the Pasadena Game. It's not that the math gets weird; it's that the theory goes mute.

  **Marcus:** It doesn't go mute, Elena. It gives the only honest answer available: *undefined*.

  **Elena:** "Undefined" is a verdict in disguise. If I offer you the Pasadena game, and then I offer you Altadena—which is identical in every state of the world but pays exactly one dollar more in every single outcome—EUT says you cannot prefer one to the other. It says there is no expected utility to compare. But Altadena statewise dominates Pasadena. If your normative theory tells me that dominating a gamble isn't a reason to choose it, your normative theory is broken.

  **Marcus:** You're conflating the map with the territory. Expected Utility Theory is a representation theorem. It maps preferences to integrals. If the integral doesn't exist, the mapping fails. That doesn't mean the *preferences* are irrational; it means the *tool* doesn't apply. You wouldn't say arithmetic is broken because it can't tell you the result of dividing by zero. You say the operation is ill-posed.

  **Elena:** But this isn't division by zero. The probabilities sum to one. The payoffs are finite in every outcome. The game is physically playable. I can toss the coin. I can hand you the money. The "ill-posedness" is entirely an artifact of how we aggregate value. If the aggregation method fails to capture a basic dominance intuition, we need a new aggregation method.

  **Marcus:** Or we need to stop trusting dominance intuitions in infinite contexts. Look, statewise dominance is a compelling axiom for finite gambles. But when you introduce infinite support with conditionally convergent series, you're entering a zone where our finite intuitions about "more is better" collide with the properties of infinity. Why privilege the intuition over the formalism?

  **Elena:** Because the intuition *is* the data! Decision theory isn't pure math; it's philosophy. It's supposed to codify rational choice. If the formalism contradicts a judgment as robust as "taking an extra dollar in every possible world is better," the formalism loses. That's why I'm leaning toward Colyvan's Relative Expectation approach. You don't evaluate the games in isolation. You evaluate the *difference* series.

  **Marcus:** (Sighs) The difference series. Right. So for Pasadena vs. Altadena, the difference is $1 in every state. The expected difference is 1. Therefore, Altadena is better. It's a neat trick. But it's a patch, not a solution.

  **Elena:** It's a principled revision. It respects dominance without requiring absolute convergence of the individual games.

  **Marcus:** It works for Altadena because the difference series converges absolutely. But what if I construct a "Pasadena Prime" game? I tweak the payoffs so that the difference series between Game A and Game B is *also* conditionally convergent. Now your Relative Expectation theory goes silent too. You've just pushed the paradox back one step. You haven't solved the underlying issue of conditional convergence; you've just hidden it in the comparison rather than the evaluation.

  **Elena:** That's a challenge, sure. But it's better than the orthodox view, which goes silent even when the difference is a constant dollar. At least Relative Expectation captures the low-hanging fruit of dominance. But let's talk about your defense of orthodoxy. You mentioned the integral is undefined. But why? Because of the Riemann Rearrangement Theorem.

  **Marcus:** Exactly. The series $\sum p_n u_n$ is conditionally convergent. It sums to $\ln 2$ in the natural order. But I can reorder the terms to sum to $-\infty$, or $+\infty$, or $\pi$. Since expectation is supposed to be a unique value representing the gamble's worth, and the value depends on an arbitrary ordering, there is no unique value. Therefore, no expectation.

  **Elena:** But the ordering *isn't* arbitrary in the context of the game. The tosses happen in time. Toss 1, then Toss 2, then Toss 3. The payoffs are indexed by $n$, the number of the toss on which heads first appears. That provides a natural ordering. Why not just stipulate that the expectation is the limit of the partial sums in the natural order? That gives us $\ln 2$.

  **Marcus:** Because that's not how expectation is defined in measure-theoretic probability. The Lebesgue integral, which underpins modern EUT, requires absolute convergence to be well-defined independent of the partitioning of the sample space. If you switch to a Riemann-style summation based on temporal order, you're changing the definition of expectation. You're no longer doing Expected Utility Theory; you're doing something else.

  **Elena:** So what? If EUT can't handle temporal sequences of payoffs without collapsing, maybe we need the "something else." But here's my worry with your "natural order" defense. It makes value dependent on description. Suppose I describe the game not by toss number, but by the specific sequence of heads and tails. I can group the outcomes differently. I can describe the sample space in a way that induces a different ordering of the terms. If the value of the game changes based on how I describe the sample space, then value isn't objective. It's linguistic.

  **Marcus:** That's a strong claim. The sample space is fixed by the physical setup. The event "Heads on toss $n$" is distinct from "Heads on toss $m$." The probability measure is defined on the sigma-algebra generated by these events. The natural ordering corresponds to the index of the random variable $N$. I'm not saying you can describe it however you like; I'm saying the random variable $N$ provides the index.

  **Elena:** But utility is supposed to be timeless. If I'm offered the gamble at $t_0$, the value should be determinate at $t_0$. Relying on the temporal order of the *resolution* of uncertainty to determine the *value* of the gamble feels like a category error. It conflates the epistemology of the payoff with the ontology of the value. Besides, even if you fix the order to get $\ln 2$, you still have the Altadena problem. If Pasadena is $\ln 2$ and Altadena is $\ln 2 + 1$, you've saved dominance. But you've done it by fiat. You've added an axiom: "Sum in natural order." Why is that axiom true?

  **Marcus:** It's not "true" in a metaphysical sense. It's a pragmatic constraint. We restrict the domain of EUT to gambles where the expectation is absolutely convergent. For the rest, we suspend judgment.

  **Elena:** "Suspend judgment." That's the phrase that haunts me. Marcus, imagine a bookie offers you Pasadena for free. Then he offers you Altadena for free. You know Altadena gives you more money in every possible world. If you say "I suspend judgment on which is better," you are behaving irrationally. You are leaving money on the table. A normative theory that permits you to be indifferent between a gamble and its strict dominator is not just incomplete; it's dangerous.

  **Marcus:** But am I indifferent? The theory says the expectations are undefined. It doesn't say the preferences are undefined. I can still prefer Altadena. I just can't justify it *via expected utility maximization*. I justify it via dominance.

  **Elena:** Aha! So you admit dominance trumps expectation.

  **Marcus:** I admit dominance is a separate principle. EUT is not the only normative principle in town.

  **Elena:** But EUT claims to be a *general* theory. If you have to outsource the verdict to a different principle whenever the series gets conditionally convergent, then EUT isn't the general theory. It's a special case. And if dominance is doing the work, why not build dominance into the expectation calculation? That's what Relative Expectation does. Or what about Easwaran's weak expectations? He shows that even if the strong expectation doesn't exist, the average payoff over many repetitions converges in probability to a value.

  **Marcus:** Weak expectations save the long-run frequency, not the single-case choice. I'm interested in the single case. And look, Elena, be honest. How often do we encounter Pasadena games in real life?

  **Elena:** (Laughs) The "it never happens" defense. Classic.

  **Marcus:** It's not a dismissal; it's a boundary condition. Physical payoffs are bounded. Human lifespans are finite. Bankrolls are finite. The Pasadena game requires unbounded utility and infinite potential duration. It's a singularity. We don't demand that Newtonian mechanics explain the center of a black hole. We say Newtonian mechanics has a domain of applicability.

  **Elena:** But philosophy of physics doesn't stop at the singularity. We look for General Relativity. We look for Quantum Gravity. We don't say, "Well, physics works for apples, so let's just ignore the black holes." If we are theorizing about *ideal* rationality, we can't just sweep the infinite cases under the rug. Ideal agents *can* handle infinite information. If our theory of ideal rationality breaks down on a logically possible gamble, it fails as a theory of *ideal* rationality.

  **Marcus:** But is it logically possible to have unbounded utility? That's the real question. If utility is bounded, the series converges absolutely. The paradox vanishes.

  **Elena:** Bounded utility solves Pasadena, but it creates the St. Petersburg paradox again, or rather, it solves St. Petersburg by fiat. If I cap utility at $10^{100}$, then a St. Petersburg game with a payoff of $10^{101}$ gets treated the same as one with $10^{100}$. That violates monotonicity. I'd rather deal with conditional convergence than accept bounded utility. It feels less ad hoc to fix the summation rule than to cap the value of human experience.

  **Marcus:** It's not capping experience; it's recognizing that value is subjective. Is there really a difference in *value* between having $10^{100}$ dollars and $10^{101}$? Or is that just a difference in digits?

  **Elena:** We're drifting into moral philosophy. Let's stick to the decision theory. My point is this: The Pasadena Game shows that the linearity of expectation is incompatible with conditional convergence. $E(X + Y) = E(X) + E(Y)$ fails if the expectations aren't absolute. In Altadena, $A = P + 1$. If $E(P)$ is undefined, linearity breaks. You have to choose: keep linearity and lose a verdict, or keep the verdict and modify linearity. I'm willing to modify linearity. I'd rather have a theory that tells me Altadena is better, even if I have to calculate it via differences rather than sums.

  **Marcus:** And I'm worried that once you start modifying linearity, you lose the representation theorem. You lose the elegant link between preferences and probabilities. If you say "Expectation is defined via relative differences," how do you recover the subjective probabilities? If I observe your choices in Pasadena-type cases, can I still derive your credences?

  **Elena:** Maybe not uniquely. Maybe rationality is messier than we thought.

  **Marcus:** (Takes a sip of his drink) That's a big concession for a formal epistemologist. "Rationality is messy."

  **Elena:** Rationality is *hard*. The Pasadena Game isn't a trick; it's a stress test. It shows that the standard formalism assumes a robustness that isn't there. It assumes that the order of summation doesn't matter. The game proves it does. So we have to either say the order matters (privileged ordering) or that we compare games directly (relative expectation). Both require changing the orthodox axioms.

  **Marcus:** Or, we say that the "value" of a gamble isn't always captured by a single real number. Maybe the value is a set of possible sums, or an interval.

  **Elena:** Now you're sounding like an imprecise probabilist.

  **Marcus:** I'm sounding like a mathematician who respects the properties of series. Look, I'll grant you this: If forced to choose, a rational agent should pick Altadena. I'll even grant you that dominance is a stronger constraint than expectation maximization. But I deny that this implies EUT is *false*. It implies EUT has a domain. Pasadena is outside the domain.

  **Elena:** And I deny that a normative theory can have a "domain" that excludes logically possible scenarios where our intuitions are clearest. If the theory can't handle the case where we know the answer best (the dominance case), it's not a theory of rationality. It's a theory of accounting.

  **Marcus:** (Smiles faintly) Accounting is underrated. It keeps you from going bankrupt.

  **Elena:** But it won't tell you which game to play.

  **Marcus:** No. But it will tell you that if you play Pasadena enough times, your average payoff will converge to $\ln 2$ *if* you sum in the natural order.

  **Elena:** There it is again. "If you sum in the natural order." You keep smuggling in the ordering as if it's neutral. It's not. It's the whole ballgame.

  **Marcus:** And you keep smuggling in the idea that a single number *must* exist. Why must it? Maybe some gambles just don't have a price.

  **Elena:** Because I have to decide whether to play.

  **Marcus:** Then decide on dominance. But don't blame the expectation calculus for not doing a job it was never designed to do.

  **Elena:** (Leans back) We're going to be here all night, aren't we?

  **Marcus:** Until the bar closes. Or until one of us constructs a gamble where dominance and relative expectation diverge.

  **Elena:** Don't tempt me. I've got a napkin and a pen right here.

  **Marcus:** (Signals the bartender for another round) Make it two. I have a feeling I'm going to need it.
