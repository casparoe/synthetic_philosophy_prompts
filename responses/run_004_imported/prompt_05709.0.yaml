prompt: |-
  My sister is finishing a PhD in comparative philosophy, and she is marrying a high school teacher who has never read a page of Confucius but has absorbed enough of her dinner-table monologues to make one very specific request for the wedding toast: no talk of "two souls becoming one," since neither of them believes a self exists prior to its relationships, but rather something grounded in Confucian role ethics, her actual research area. As the family's other philosophy PhD student, I've been given the assignment, along with the difficulty she embedded in it: she will not have her marriage blessed by a framework whose traditional account of the husband-wife relation — fūfù (夫婦), one of the wǔlún, the classical "Five Relationships" — is widely read as hierarchical, and a good third of the guests are her cohort, who will notice at once if the toast launders that hierarchy through unfamiliar vocabulary rather than actually confronting it. Could you draft the toast? It should run about five minutes, move grandparents who have never heard of Roger Ames, and still hold up under the scrutiny of those who have read him closely.
reasoning: |-
  Here's a thinking process that leads to the suggested wedding toast:

  1.  **Analyze the Request:**
      *   **Speaker:** A philosophy PhD student (sibling of the bride).
      *   **Audience:** Mixed. Grandparents (non-specialists), general family/friends, and a significant cohort of comparative philosophy academics (specialists, specifically familiar with Roger Ames, Confucian role ethics, and the *wǔlún*).
      *   **Bride:** PhD in comparative philosophy (research area: Confucian role ethics).
      *   **Groom:** High school teacher (never read Confucius, but absorbed her ideas).
      *   **Constraint 1 (The "No"):** No "two souls becoming one" (rejects pre-existing substantial self).
      *   **Constraint 2 (The "Yes"):** Grounded in Confucian role ethics (*ren*, relationality).
      *   **Constraint 3 (The Critical Challenge):** Must address the hierarchy issue in the traditional *fūfù* (husband-wife) relationship without laundering it. It needs to confront the hierarchy, not hide it, while reframing the marriage in a modern, egalitarian context suitable for the couple.
      *   **Tone:** Warm, accessible to grandparents, rigorous enough for philosophers, humorous but sincere.
      *   **Length:** About 5 minutes (approx. 750-900 words spoken at a moderate pace).

  2.  **Deconstruct the Philosophical Tension:**
      *   *Traditional View:* The *wǔlún* (Five Relationships) include *fūfù* (husband-wife). Traditionally, this is hierarchical (husband leads, wife follows). This is problematic for a modern feminist/equal marriage.
      *   *Role Ethics View (Ames/Hall):* The self is not an atom; it is a sum of its roles and relationships. We *become* who we are through interacting with others. Focus is on *ren* (authoritative conduct/humaneness) and *yi* (appropriateness).
      *   *The Groom's Position:* He embodies the "uncultivated" (in the technical sense) person who nonetheless grasps the intuition through osmosis. He knows there is no "ghost in the machine."
      *   *The Solution:* Reframe the hierarchy not as domination, but as *complementary differentiation* that requires constant negotiation (*yi*). The marriage isn't a static state of "being husband and wife" but a continuous *doing* of husbanding and wifing (to borrow a verb form). It's about co-creation.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the assignment. Set the tone. Humor about the "no souls becoming one" rule. Connect with the grandparents immediately (love/family).
      *   **The Philosophical Hook (Accessible):** Explain the "no self" idea simply. We aren't puzzle pieces fitting together; we are clay being shaped together.
      *   **The Groom:** Highlight his intuitive grasp. He teaches high schoolers (a Confucian act of cultivation). He listens.
      *   **The Elephant in the Room (The Hierarchy):** This is the crucial part for the PhD cohort. Acknowledge the *wǔlún*. Admit the traditional *fūfù* was hierarchical. State clearly: *We are not doing that.*
      *   **The Reframe (Role Ethics):** How to make it egalitarian? Focus on *yi* (appropriateness/context) and *ren* (co-creating humanity). The roles aren't scripts; they are improvisations.
      *   **The Vow/Wish:** What do we wish for them? Not happiness as a state, but growth as a process.
      *   **Closing:** Raise a glass. Bring it back to the family.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I mention Roger Ames? *Correction:* Don't name-drop too heavily, but use the terminology (*ren*, *yi*, *fūfù*) correctly so the cohort nods, while explaining it simply for Grandma.
      *   *Check:* Is the hierarchy addressed? *Correction:* Make sure to explicitly say "traditional hierarchy is rejected" but "role differentiation remains."
      *   *Check:* Is it too dry? *Correction:* Add jokes about dinner table monologues and grading papers.
      *   *Check:* Length? *Correction:* Keep an eye on word count. 130-150 words per minute is standard speaking pace. 5 minutes = ~750 words.

  5.  **Drafting the Text (Iterative Process):**
      *   *Intro:* Start with the "forbidden phrase."
      *   *Middle:* Talk about the Groom's teaching. That's a great Confucian parallel.
      *   *The Hard Part:* Address the *wǔlún*. "If my sister were a traditional Confucian..." No, she's a *comparative* philosopher. She critiques.
      *   *The Core:* Marriage as a verb. "Husbanding" and "Wifing."
      *   *Conclusion:* The toast.

  6.  **Polishing for the Audience:**
      *   *Grandparents:* Need to feel the love. Use words like "family," "home," "care."
      *   *Philosophers:* Need to see the nuance. Use "focus-field," "relational constitution," "yi."
      *   *Groom:* Make him look good, not like a project. He's a teacher; that's *junzi*-adjacent.

  7.  **Final Review against Constraints:**
      *   No "two souls one"? Checked.
      *   Confucian role ethics? Checked.
      *   Address hierarchy? Checked (explicitly).
      *   5 minutes? (Word count looks right).
      *   Warmth? (Added personal touches).

  8.  **Final Polish:** (Reviewing the generated draft for flow and tone). *Self-Correction:* Ensure the distinction between "role" as a script vs. "role" as a creative locus is clear. Emphasize that the *content* of the role is up to them.

  **(Post-Drafting Note):** I need to make sure I don't get *too* technical. The explanation of *ren* needs to be "becoming human together" rather than "benevolence." The explanation of *yi* needs to be "doing what fits the moment" rather than "righteousness."

