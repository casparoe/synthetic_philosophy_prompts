      *   **Characters:** A Mereological Universalist (believes any collection of objects composes a further object) vs. a Restrictivist (could be a Nihilist or an Organicist like van Inwagen). The prompt suggests van Inwagen might make a better foil because it allows for common-sense objects (like people/dogs) while denying arbitrary fusions, whereas Nihilism denies *all* composite objects, which can sometimes make the "verbal dispute" angle harder to navigate intuitively (since the nihilist says "there are no desks"). Let's go with a van Inwagen-style Organicist (Composition occurs only when the activity constitutes a life) vs. a Universalist.
      *   **Scenario:** Start with a concrete case (Desk + Hutch, or Records + Crate) similar to the user's apartment situation, then escalate to the meta-ontological debate (Hirsch vs. Sider style).
      *   **Tone:** Intellectual but accessible, engaging, neither character should be a pushover. They need to understand and respond to each other's arguments (quantifier variance, joint-carving, etc.).
      *   **Goal:** Demonstrate the philosophical tension without resolving it definitively (since philosophers haven't).

  2.  **Character Conception:**
