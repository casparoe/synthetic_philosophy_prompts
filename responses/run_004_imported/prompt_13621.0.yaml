answer: |-
  **Setting:** *A coffee shop, two weeks after the move. Alex and Jamie are staring at a half-filled spreadsheet on a laptop. The cursor blinks next to the line item: "Desk & Hutch."*

  **Alex:** Look, I'm just saying, for the insurance form, we can list it as one line item. "Wooden desk structure." But metaphysically? It doesn't matter. The desk, the hutch, and the fusion of the desk-and-hutch all exist.

  **Jamie:** No, they don't. The desk exists. The hutch exists. The *fusion* does not. There are just simples arranged desk-wise and simples arranged hutch-wise, fastened together. There is no third thing.

  **Alex:** Come on. If I point to the whole assembly and say, "That is heavy," I'm not speaking falsely. I'm referring to an object. If I can refer to it and quantify over it, it exists.

  **Jamie:** You can refer to *them*. Plural. "They are heavy." But you can't say "It is heavy" and be talking about a single entity. You're confusing the ability to speak with the structure of reality. Just because your language allows you to treat a plurality as a singular grammatical subject doesn't mean the world contains a corresponding object.

  **Alex:** But why draw the line there? Why is the hutch separate from the desk, but the leg part of the desk? They're screwed together.

  **Jamie:** Because the desk is a functional unit designed by a maker. The hutch is another. But the combination? That's arbitrary. If composition happened every time two things touched, then you and that chair you're sitting on would compose a "Alex-Chair" object. Do you believe in the existence of Alex-Chair?

  **Alex:** Sure. Why not? It's just the sum of my parts and the chair's parts. It's not a *natural kind*, maybe. It's not a substance. But it's an object.

  **Jamie:** That's the Universalist dogma. You think existence is cheap. I think existence is expensive. Composition only occurs when the activity of the parts constitutes a *life*. Like you. Like the dog. Not like furniture.

  **Alex:** Okay, so you're going full van Inwagen on me. Only living things and simples exist. But here's the thing, Jamie: when you say "There are no desks," and I say "There are desks," are we actually disagreeing about the world? Or are we just disagreeing about how to use the word "exists"?

  **Jamie:** We're disagreeing about the world. I'm saying the world does not contain desk-objects. You're saying it does. That's a substantive difference.

  **Alex:** Is it, though? Think about the quantifier. The logical symbol $\exists$. When I say "$\exists x (x \text{ is a desk})$," my quantifier ranges over fusions of simples. When you say it, your quantifier ranges only over simples and living organisms. We agree on all the low-level facts. We agree on where the wood atoms are. We agree on how they're bonded. We agree on the causal powers. The only difference is the range of our quantifier. That sounds like a verbal dispute. It's quantifier variance.

  **Jamie:** Ah, the Hirsch maneuver. "Oh, it's just language." Look, Alex, I grant that we can translate your claims into mine. I can hear you say "There is a desk" and understand you to mean "There are simples arranged desk-wise." But translation isn't ontological innocence.

  **Alex:** If I can translate everything you say into my language without losing any predictive power or empirical content, what work is your ontology doing? If we agree on the distribution of mass and energy in the room, insisting that "true objects" only include living things seems like you're privileging a specific conceptual scheme and calling it "Reality."

  **Jamie:** It's not just a conceptual scheme. It's about *joint-carving*. Reality has a structure. Some ways of carving the world cut at the joints; others smear across them. "Life" cuts at a joint. "Arbitrary fusion of wood and metal" does not. The quantifier I'm using—the restricted one—is the one that mirrors the fundamental structure of the world. Your quantifier is bloated. It includes junk.

  **Alex:** But what makes one quantifier the "fundamental" one? Why is the "joint-carving" quantifier the *true* exists? If my language is useful, coherent, and lets me navigate the world, in what sense am I wrong?

  **Jamie:** You're not wrong about the *pragmatics*. You're wrong about the *metaphysics*. Think about explanation. If the desk breaks, why? Because the wood fibers snapped. If the "Alex-Chair" breaks, why? Because the chair broke or you fell. The causal work is always done by the parts or the living organism. Positing a fusion object adds no explanatory power. It's ontological free-riding. Sider's point is that logic itself is structural. The meaning of $\exists$ isn't up for grabs based on utility. It's fixed by the role it plays in the fundamental language of the world.

  **Alex:** But that assumes there *is* a fundamental language of the world written in logic. That's a huge assumption. Why think reality cares about our logical constants? Maybe "existence" is inherently tied to our conceptual interests. When we fill out this insurance form, we care about value and replaceability. In that context, the Desk-Hutch fusion is the relevant object. In a physics context, maybe it's just atoms. Neither is the "One True Ontology." They're just different ways of counting.

  **Jamie:** If it's just different ways of counting, then ontology is trivial. It becomes anthropology—studying how humans like to talk. But I'm asking what *is there*. Independent of us. If you walk into an empty room, are there objects there?

  **Alex:** If there are simples, there are fusions of those simples. Yes.

  **Jamie:** But if no one is there to conceptualize the fusion, does the fusion *exist*?

  **Alex:** Existence isn't dependent on conceptualization. The fusion is there regardless. But whether we *notice* it as a unit depends on us.

  **Jamie:** See, that's where you slip. You say "The fusion is there." But to say it is *there* as an object is to say it has unity. What gives it unity? The screws? Glue? Spacetime continuity? If I take a random handful of dust from the carpet and the coffee in my mug, do they compose an object?

  **Alex:** Yes. Dust-Mug-Fusion.

  **Jamie:** That's absurd. There's nothing holding that together. No causal interaction. No functional unity.

  **Alex:** Causal interaction isn't required for existence. It's required for *persistence* maybe, or for being a *substance*. But existence? I can define the set. I can quantify over the members. The sum exists. You're conflating "being an object" with "being a coherent, causally integrated system."

  **Jamie:** I'm not conflating them; I'm identifying them. To be an object *just is* to be a unified system. If you deny that, you're stripping the word "object" of any meaning other than "collection." And if "object" just means "collection," then you haven't defended Universalism; you've just changed the definition of object to make your thesis trivial.

  **Alex:** And if you restrict existence only to living things, haven't *you* changed the definition to make the world seem more structured than it is? You're projecting biological categories onto fundamental ontology. Look, let's go back to the insurance. If our house burns down, the insurance company isn't going to say, "Well, technically the desk and hutch are two entities, so we pay double," nor will they say, "Actually, there are no desks, only simples, so we pay nothing." They treat the fusion as the unit of value.

  **Jamie:** Right. Because insurance is a human practice. It deals with human interests. Ontology isn't about insurance. It's about what grounds the truth of the insurance claim. The truthmaker for "The desk burned" is the simples burning, arranged desk-wise. It is *not* a single entity "The Desk" undergoing the property of burning.

  **Alex:** But isn't that distinction itself just verbal? If the truth conditions are identical—same atoms, same arrangement, same fire—why insist the truthmaker is plural rather than singular?

  **Jamie:** Because pluralities and singularities behave differently in logic. A plurality can't be the subject of a singular predicate in the fundamental language. If you say "It burned," you imply a single subject. If the fundamental reality is plural, then "It burned" is a loose way of speaking. It's not *fundamentally* true.

  **Alex:** So there's "fundamentally true" and "ordinarily true." And you're saying only the fundamental stuff counts as real existence?

  **Jamie:** I'm saying the fundamental stuff is what *makes* the ordinary stuff true. And if your ontology posits entities that do no work in the fundamental layer, they're shadows.

  **Alex:** But maybe the "fundamental layer" is a myth. Maybe reality is just layers of description all the way down. The desk is real at the furniture layer. The atoms are real at the physical layer. The fusion is real at the mereological layer. You're trying to crown one king. I'm saying it's a democracy.

  **Jamie:** A democracy of what? If everything exists, then "exists" distinguishes nothing. It loses its normative force. It stops telling us what the world is *made of*.

  **Alex:** It tells us what we can talk about without lying.

  **Jamie:** It tells us what carves nature at the joints. And the Desk-Hutch fusion doesn't cut anything. It just smears across the wood and the metal.

  **Alex:** *(Sighs, typing into the spreadsheet)* Okay. Look. For the sake of the spreadsheet, I'm going to type "Desk Assembly (1)."

  **Jamie:** Fine. Just don't think you've solved metaphysics.

  **Alex:** I haven't. But I also don't think you have. You keep talking about "joints" in nature like they're physical seams. But nature doesn't have seams. We put the seams in when we look at it.

  **Jamie:** And you keep talking like "looking" creates reality. The joints are there whether you see them or not. Life is a joint. Arbitrary fusion is not.

  **Alex:** We agree on the atoms, Jamie. We agree on the fire risk. We agree on the payout.

  **Jamie:** We agree on the science. We disagree on the being.

  **Alex:** *(Clicks save)* Well, until we can agree on what "being" means, I'm counting the hutch as part of the desk. It's easier for the inventory.

  **Jamie:** Just make sure you note the value correctly. Even if it's not one object, the sum of the values is the same.

  **Alex:** See? Even you can't help but sum them up.

  **Jamie:** That's arithmetic, Alex. Not ontology.

  **Alex:** Maybe there's no difference.

  **Jamie:** *(Takes a sip of coffee)* Don't start.

  **Alex:** *(Grins)* Just one object, Jamie. The Cup-Saucer Fusion.

  **Jamie:** Pass the sugar. Plurally.
