          *   *Self-Concept/Identity:* The lender bet on *who the user is*. Paying only the minimum proves her wrong. It changes the user's identity from "someone who pays back" to "someone who does the legal minimum." This has psychological costs (cognitive dissonance, guilt).
          *   *Signaling:* If she *does* find out (people talk), the reputational damage is catastrophic.
