prompt: |-
  A mentor of mine floated me a pretty big interest-free loan a couple years ago when my business was about to go under, totally informal, no contract, nothing. She told me afterward the only reason she helped was that she was confident I was the type who'd actually pay her back in full even once I didn't legally have to anymore — she said if she'd had any doubt about that she wouldn't have given me a cent, promises or no promises. I'm back on my feet now, technically only owe her the original amount, and paying back extra would genuinely sting financially, with zero chance she'd ever know the difference either way. A friend of mine says the rational move is obviously to just repay the minimum and call it even, and that anything more is just sentimental. That doesnt sit right with me though, and I can't quite put my finger on why. Is my friend right that paying extra is just a nice gesture, or is there something actually rational about being the kind of person who follows through anyway?
reasoning: |-
