      *   **The Borrower (User):** Now back on their feet. Technically owes only the principal. Paying extra would "sting financially." The lender would never know the difference.
      *   **The Conflict:** A friend argues for the "rational" move (pay minimum, save money). The user feels this "doesn't sit right" but can't articulate why.
