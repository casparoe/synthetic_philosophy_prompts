prompt: |-
  Hey, random question that came up while I was prepping lecture notes -- since Sperry's split-brain experiments basically proved that the two hemispheres are fully separate consciousnesses that can each act independently, doesn't that mean these patients are literally two different people sharing one skull? Feels like ethicists and legal folks have just been ignoring the obvious implication that we should treat each hemisphere as its own person with its own rights. Am I missing something, or is this just a case of the field being squeamish about a weird conclusion?
