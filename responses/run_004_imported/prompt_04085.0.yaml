answer: |-
  In the village of Saltreach, the sea was a gambler that never showed its hand. Some mornings, the nets came up heavy with silver cod; others, they tore empty against the rocks. For generations, the fishermen had lived by the Pact of the Grey Water: every evening, regardless of the catch, every basket was emptied into the communal pen. The fish were divided equally. It meant that on the lean days, no family starved, and on the fat days, no single boat grew fat enough to buy the others out. They survived because none of them knew whose net would hold the storm's mercy until it was too late to matter.

  Then came the merchant with the Sunstone. It was a polished disc of glass, he claimed, that could catch the reflection of the future. Hold it over the water at dawn, and it would show the weight of the catch waiting beneath the waves. It was free, flawless, and seemingly a gift from the heavens. Why suffer the anxiety of the unknown when you could prepare? The villagers cheered. Finally, they thought, they could optimize. They could know.

  On the first morning, young Joren held the stone over his bow. The glass shimmered, showing a net bursting with cod. Beside him, old Tomas looked into the stone and saw only torn mesh and dark water. Under the Pact, it wouldn't have mattered; Joren would have shared, and Tomas would have eaten. But Joren looked at his full reflection, then at Tomas's empty one, and felt a cold prickling of rationality. *Why should I give away what I know is mine?* he thought. *The sea gave this to me, not him.* He turned his boat toward the private cove. Tomas saw him go and tightened his grip on his oars. By noon, half the fleet had hidden their catches, convinced by the stone that they were the "winners" who no longer needed to subsidize the "losers."

  The sea remained exactly as dangerous as it had always been; the fish did not move, and the storms did not care. But the safety of the village evaporated. The information hadn't changed the risk, only the willingness to bear it together. That winter, when the storms finally came for Joren's boat, the glass showed him nothing but dark water. He rowed to the communal pen for his share, but the pen was empty, guarded by men who remembered the morning the truth arrived. They had traded the peace of shared ignorance for the clarity of individual fate, and found that knowing exactly when you were doomed was no gift at all.
