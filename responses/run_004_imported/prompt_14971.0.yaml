prompt: |-
  I'm a philosophy PhD student finishing a dissertation chapter on the ethics of autonomous-vehicle "crash-optimization" algorithms, and in this week's reading group we worked through Philippa Foot's 1967 paper "The Problem of Abortion and the Doctrine of Double Effect" — the piece that, almost as an aside to her real argument, gave philosophy its now-inescapable runaway-tram case.

  One of my colleagues pointed out over drinks afterward that Foot died in 2010, several years before MIT's "Moral Machine" project turned that same tram scenario into a global, crowdsourced survey used to infer how self-driving cars should distribute the risk of death among pedestrians and passengers, and well before "the trolley problem" became the default shorthand in tech-ethics journalism for any AV decision dilemma, largely detached from anything in her actual argument. That set off a longer argument about what Foot herself, rather than the flattened version of her example that now circulates, would have made of this afterlife.

  I'd like your best-informed reconstruction of her likely reaction, grounded specifically in the structure of her 1967 argument — the tram driver case, its place in her wider discussion of the classic craniotomy/hysterectomy contrast from the abortion debate, and whatever you take her to have thought this showed about the limits of the doctrine of double effect and the relative weight of negative versus positive duties — rather than in the generic pop-culture "trolley problem." In particular, address whether she would likely have regarded the Moral Machine's method of aggregating millions of laypeople's pairwise preferences across cultures as continuous with her own philosophical project, or as a kind of category error that borrows her example while discarding the point it was built to make. Please flag clearly which claims you take to follow fairly directly from her published work versus your own speculative extrapolation, and identify at least one specific respect in which her actual argument, taken seriously, cuts against how the discourse around AV trolley problems is usually framed.
