      *   *The DDE:* Traditionally distinguishes between intended means/ends and merely foreseen side effects.
      *   *Foot's Critique:* She thinks the DDE, as traditionally formulated, is insufficient or misapplied in certain cases. She wants to find a better moral distinction.
