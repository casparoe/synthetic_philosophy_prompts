      *   *On AV Discourse:* She would critique the framing. The discourse assumes the car is a moral agent making a "choice" akin to the tram driver. Foot would ask: Who is the moral agent? The programmer? The owner? The car?
      *   *On Negative vs. Positive Duties:* AV discourse often treats all deaths as equivalent outcomes to be minimized. Foot would insist on the distinction between the car *hitting* someone (negative duty violation) vs. the car *swerving* to hit someone else.
      *   *On DDE:* She would likely argue that AV programming focuses too much on outcomes (utilitarianism) and ignores the moral significance of the *action type* (killing vs. letting die), though she was critical of DDE, she wasn't a pure utilitarian.

