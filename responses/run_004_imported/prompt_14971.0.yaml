      *   *Specific Cut:* The standard AV framing asks "How do we minimize casualties?" Foot would ask "What are the constraints on *action*?" The constraint against *killing* is stronger than the obligation to *save*. Therefore, an algorithm programmed to sacrifice a passenger to save more pedestrians might violate a negative duty owed to the passenger.
