          1.  *Abortion (Craniotomy vs. Hysterectomy):* In the craniotomy, the death of the fetus is the *means* to save the mother. In the hysterectomy, the death is a *side effect* of removing the cancerous womb. DDE says hysterectomy is okay, craniotomy is not. Foot finds this distinction shaky or needs more grounding.
          2.  *The Tram Driver (Switch):* Driver can switch track to kill 1 instead of 5. Foot says he *should* switch.
          3.  *The Fat Man (Bridge):* (Actually introduced by Thomson later, but Foot discusses a judge killing an innocent to prevent a riot). Foot distinguishes the Driver from the Judge.
      *   *The Core Distinction:* Foot argues the crucial difference isn't just intention (DDE), but the distinction between **negative duties** (not to harm/kill) and **positive duties** (to aid/save).
      *   *Foot's Conclusion on the Tram:* The driver has a negative duty not to kill the five, which outweighs the negative duty not to kill the one (since he must kill someone). Or, more precisely, the duty not to kill is stricter than the duty to save, but when killing is inevitable, minimizing the violation of the negative duty is permissible. *Correction:* Foot actually frames it as a conflict of negative duties. The driver is *already* involved. He must choose whom to kill.
      *   *Key Insight:* Moral dilemmas aren't just math problems (utilitarianism) or intention puzzles (DDE); they are about the *structure of obligations* (rights, duties, involvement).

  3.  **Analyze the "Moral Machine" & AV Discourse:**
