answer: |-
  **Title:** The Calculator vs. The Culture: Why the Replication Crisis Isn't a Math Problem

  **Introduction**

  It is understandable that you are frustrated by your professor's hedging. In Philosophy of Science, "it depends" is often the truthful answer, but when evaluating a crisis of scientific validity, we need to know where to apply leverage. You are asking whether the replication crisis is a *tool* failure (Frequentist NHST is broken, Bayesianism fixes it) or a *user* failure (Incentives are broken, tools are incidental).

  The readings from Wagenmakers suggest the former: that the logic of Null Hypothesis Significance Testing (NHST) inherently invites error, and that adopting Bayes Factors (BF) and posterior odds would restore integrity. Your intuition, bolstered by the power-posing saga and Gelman's writings, suggests the latter: that researcher degrees of freedom will infect any statistical framework.

  This essay weighs these positions, with specific attention to the Likelihood Principle and optional stopping. It concludes with a verdict: **The replication crisis is fundamentally a problem of incentives and researcher practices.** Switching to Bayesian statistics without changing the incentive structure will not fix the crisis; it will merely Bayesianize it. While Bayesian methods are philosophically superior for quantifying evidence, they are not a firewall against motivated reasoning.

  **The Bayesian Promise: The Likelihood Principle and Optional Stopping**

  To understand why many philosophers and methodologists champion Bayesianism, we must look at the specific technical grievance regarding optional stopping. This is the strongest argument for the "Math Problem" side.

  In the Frequentist framework, the p-value is calculated based on the *sampling distribution*—the distribution of data you *could* have observed under the null hypothesis. Crucially, this distribution depends on your *intentions*. If you plan to collect $N=100$ participants, the sampling distribution is different than if you plan to collect data until $p < 0.05$. In the latter case (optional stopping), you inflate the Type I error rate. A p-value of 0.04 means something different if you peeked at the data halfway through than if you did not. This creates a "gotcha" environment where the statistical validity of a result depends on the private mental states of the researcher regarding their stopping rule.

  Bayesian inference relies on the **Likelihood Principle (LP)**. The LP states that all the evidence provided by the data is contained in the likelihood function of the *observed* data. How you got there is irrelevant. Whether you fixed $N$ in advance or stopped when the Bayes Factor hit 3, the likelihood of the observed data remains the same. Therefore, a strict Bayesian analysis claims that optional stopping does not bias the evidence.

  Wagenmakers and others argue this is a massive advantage for replication. If researchers can collect data until they have sufficient evidence (Bayesian sequential analysis) without penalizing the validity of the inference, we remove the temptation to "p-hack" via sample size manipulation. It aligns statistical rules with scientific practice (where we often want to stop when we "see" an effect).

  **The Counter-Argument: Coherence vs. Calibration**

  However, there is a subtle but devastating flaw in using the Likelihood Principle as a shield against the replication crisis. The LP guarantees *internal coherence*, not *external validity*.

  Imagine a researcher is motivated to find a significant effect (due to publication incentives). They adopt a Bayesian workflow. They decide to use optional stopping: "I will collect data until $BF_{10} > 3$." Mathematically, the LP holds: the BF accurately reflects the evidence in the *final* dataset. However, by adopting this stopping rule, the researcher has implicitly selected for datasets where random noise fluctuated in favor of the alternative hypothesis.

  Simulations show that if you use optional stopping with a threshold, you *do* inflate the false discovery rate, even if the BF is mathematically coherent. The BF tells you how much to update your beliefs *given the model*, but if the stopping rule selects for noise, the model is being fed a biased stream of data. The Bayesian analysis is "honest" about the noise, but the *decision process* is still gaming the system.

  This leads to your point about the "Garden of Forking Paths." In NHST, researchers hack by trying different covariates or stopping points to get $p < 0.05$. In a Bayesian world, researchers can hack by trying different **priors** or **model specifications** until $BF > 3$.

  Consider the power-posing saga (Carney, Cuddy, & Yap, 2010). The original findings were supported by standard NHST. Later, large-scale replications failed. Wagenmakers and colleagues re-analyzed data using Bayes Factors, often finding strong evidence *for the null*. This is touted as a Bayesian victory. But consider the counterfactual: If the original authors had been Bayesians, would the crisis have been averted?

  Unlikely. They would have faced the same pressure to publish a positive effect. Instead of manipulating $N$ to lower a p-value, they might have manipulated the prior distribution (making it skeptical of the null) or excluded "outliers" that dampened the BF. The *metric* changes, but the *motivation* remains. As Andrew Gelman (a Bayesian) himself argues, "The garden of forking paths" exists in model specification. If you treat the prior as a tuning parameter to achieve publishability rather than a representation of pre-existing knowledge, you have not solved the crisis; you have just obscured the hacking behind the subjective veil of prior choice.

  **Incentives: The Root Cause**

  The replication crisis is not primarily about error rates; it is about **selection bias**. Journals select for novelty and significance. Tenure committees select for publication volume. This creates an environment where the "truth" is less valuable than the "story."

  NHST provided a convenient, binary threshold ($p < 0.05$) that facilitated this selection. It allowed researchers to claim "certainty" where there was only noise. It is true that NHST made this *easier* by offering a bright line to cross. In that sense, the tool afforded the misconduct.

  However, tools are elastic. If you remove the bright line of $p=0.05$ and replace it with $BF=3$, the incentive structure will simply reshape itself around the new threshold. We already see "Bayes-washing" in preprints, where authors highlight a favorable BF while burying a sensitivity analysis that shows the result vanishes with a different prior.

  The reason the optional stopping argument doesn't save Bayesianism as a *cure* is that the replication crisis isn't caused by researchers accidentally violating stopping rules. It is caused by researchers *intentionally* exploiting degrees of freedom to satisfy incentives. A framework that says "stopping rules don't matter" (the LP) is philosophically elegant, but it is sociologically naive. It assumes researchers are truth-seekers who just got the math wrong. In reality, many are career-seekers who know exactly what the math requires and are optimizing for it.

  **The Verdict**

  So, we must choose. Is the replication crisis a Frequentist statistics problem fixable by Bayes, or an incentive problem where statistics is beside the point?

  **The verdict is: It is fundamentally a problem with incentives and researcher practices.**

  Here is why this distinction matters for your understanding of the seminar material:

  1.  **Statistical frameworks are normative, not ontological.** They tell you how you *should* reason, not how the world *is*. If the norm conflicts with the incentive (e.g., "report all priors" vs. "publish quickly"), the incentive wins.
  2.  **The "Optional Stopping" advantage is a technical virtue, not a practical shield.** While it is true that Bayesian inference obeys the Likelihood Principle and Frequentist inference does not, this protects the *coherence of the inference*, not the *truth of the conclusion*. A coherent inference based on massaged data is still a false finding. The replication crisis is about false findings, not incoherent math.
  3.  **The Power Posing Lesson.** The reason power posing failed to replicate wasn't because the p-value was 0.04 instead of a BF of 2.9. It failed because the effect size was inflated by selective reporting and small samples. A Bayesian analysis of a small, biased sample with an optimistic prior yields a confident falsehood. A Frequentist analysis of the same yields a significant falsehood. The tool didn't cause the error; the sampling and reporting did.

  **Conclusion**

  Your professor likely hedges because admitting that "incentives are the problem" implies a political and sociological solution (changing hiring, funding, and publishing), which is much harder than a technical solution (changing the formula).

  Adopting Bayesian methods is generally a good idea for science. It forces us to quantify uncertainty and allows us to support the null hypothesis. It is a better *calculator*. But if the replication crisis is a disease of the scientific *ecosystem*, switching calculators is like treating a bacterial infection with a better thermometer. It gives you a more precise reading of the fever, but it doesn't cure the infection.

  Therefore, do not be swayed by the technical elegance of the Likelihood Principle into thinking Bayesianism is the cure. The crisis persists because the reward structure of science pays for discoveries, not truths. Until the incentives change, the "Garden of Forking Paths" will simply grow new branches, regardless of whether we are pruning them with p-values or Bayes Factors.

  **Summary for your notes:**
  *   **LP/Optional Stopping:** Bayes wins on *coherence* (data speaks for itself), but loses on *calibration* (stopping rules still select for noise if used strategically).
  *   **P-hacking vs. Prior-hacking:** Motivated reasoning migrates to whatever parameter is tunable.
  *   **Final Stance:** Incentives > Statistics. The tool facilitates the error, but the motive causes it.
