      *Let's refine the "Winner" of Round 1.* Marcus's argument is the standard explanation for why people *do* escalate. It is "rational" given the belief that the other might quit. Sofia's counter is that this belief is unfounded if the other is also rational. I will give Round 1 to Marcus as a description of *local* incentives, but note the caveat.

