      *   **Key Point 1: Risk Aversion is Coherent.** Even if wealth utility is linear, *variance* can have negative utility. (Stress, attention). This makes the utility function over the *betting process* concave.
      *   **Key Point 2: Parameter Uncertainty.** (Crucial for rationalists). You aren't sure the coin is fair or the friend is solvent. Small sample allows updating. Large commitment locks in bad priors.
      *   **Key Point 3: Counterparty Risk.** Can the friend pay on a 10-sigma event?
