  Let's also bring in the concept of **Ergodicity** briefly, as rationalists love Ole Peters. Though this bet is additive (ergodic), the *concern* about ruin often stems from non-ergodic thinking. Actually, better to stick to Parameter Uncertainty, that's stronger.

  Wait, one more thing: **The option value of quitting.** If you commit to 50, you lose the option to stop if you discover new information (e.g., friend seems shady, or you just get bored). Keeping the option open has value.

