answer: |-
  This is a classic tension between "textbook decision theory" (which your friend is invoking) and "real-world decision theory" (which your intuition is grasping at).

  Your friend is arguing from the perspective of **Expected Utility Theory (EUT)** under a very specific set of assumptions:
  1.  **Known Probabilities:** You know for a fact the coin is fair (50/50).
  2.  **Linear Utility of Wealth:** You value every additional dollar exactly the same as the last one (risk neutrality).
  3.  **No Transaction Costs:** There is no time, stress, or social cost to playing.
  4.  **Solvent Counterparty:** The friend can definitely pay out, no matter how much they lose.

  Under *those* specific conditions, your friend is mathematically correct. If $EV > 0$ and utility is linear, the optimal number of plays is "as many as possible." If $EV < 0$, it's zero. An intermediate number is indeed incoherent in that frictionless vacuum.

  However, you are operating in the real world, where those assumptions rarely hold. Your intuition isn't necessarily a bias; it's likely a heuristic accounting for variables your friend's model is ignoring. Here are four coherent, decision-theoretic reasons why stopping partway is rational.

  ### 1. Parameter Uncertainty (The "Model Risk" Argument)
  This is the strongest rationalist argument for your position. You do not *know* the coin is fair. You do not *know* the friend is being perfectly honest. You have a prior belief that the bet is +EV, but that prior has uncertainty.

  If you commit to 50 flips upfront, you are locking yourself into a model. If you commit to 5 flips, you are buying **information**.
  *   **Scenario:** You play 5 rounds. The friend fumbles the coin every time it lands tails. Or you notice they are getting visibly agitated when losing.
  *   **Value of Information:** By keeping the run short, you retain the **option value** to update your priors. If the "meta-game" signals suggest the bet isn't actually what it seems, you can quit. If you pre-commit to 50, you've thrown away the option to exit based on new evidence.

  In decision theory terms, you are treating the probability $p$ not as a fixed $0.5$, but as a distribution. The expected value of the *first* flip is high enough to overcome the risk, but the expected value of the *50th* flip is discounted by the accumulating risk that your model of the situation is wrong.

  ### 2. Counterparty Risk (Tail Risk)
  Your friend mentioned the Law of Large Numbers (LLN) converging your winnings toward the mean. That is true for the *average* per flip, but the **total variance** scales with $\sqrt{n}$.
  *   **1 Flip:** Standard deviation is roughly $120.
  *   **50 Flips:** Standard deviation is roughly $120 \times \sqrt{50} \approx \$850$.

  While the probability of being *negative* drops, the magnitude of the deviation increases. If you get a 3-sigma run against your friend (which happens ~0.3% of the time), they might owe you $3,000+ on a casual bet.
  *   **The Question:** Can your friend actually pay that?
  *   **The Risk:** If they can't, your expected value on the "tail" outcomes drops to zero (they default).
  *   **The Logic:** By limiting the number of flips, you are capping your **exposure to counterparty ruin**. You are effectively saying, "I trust you enough for $500, but I don't know if you're liquid enough for $5,000." This is a coherent risk constraint independent of your own wealth.

  ### 3. Utility of the Process (Non-Wealth Costs)
  You mentioned that diminishing marginal utility of money doesn't apply here. That addresses *wealth* utility. But utility functions can include other variables, such as **attention, stress, and time.**

  Even if losing $1,000 doesn't hurt your finances, tracking the bet, waiting for the flips, and experiencing the variance has a cognitive cost.
  *   **Flip 1-5:** Novelty, fun, social bonding. (Positive utility)
  *   **Flip 40-50:** Boredom, low-level anxiety, opportunity cost of time. (Negative utility)

  If the "hassle cost" per flip is effectively $5 worth of utility, the net EV drops from $20 to $15. If the hassle compounds (it gets tedious), the marginal utility of the 50th flip might be negative. Your friend is assuming $U(\text{wealth})$ is the only term in your utility function. If $U(\text{wealth}, \text{time}, \text{stress})$ is the real function, an intermediate optimum is perfectly coherent.

  ### 4. The "Gambler's Ruin" Mindset (Bounded Rationality)
  Your friend is invoking the Law of Large Numbers to say "you won't lose in the long run." This is a common misapplication of LLN. LLN guarantees the *ratio* of heads/tails converges, not that the *difference* shrinks. The absolute dollar difference actually widens.

  More importantly, humans are not infinite bankrolls. Even if *you* aren't at risk of ruin, you might have a **mental stop-loss**.
  *   Behavioral finance shows that "myopic loss aversion" is painful. Checking your P&L 50 times exposes you to 50 moments of potential regret.
  *   If you view the bet as a **single portfolio allocation**, you might decide: "I am willing to allocate 5% of my 'fun money' to this experimental asset class."
  *   Taking 5 flips fits that allocation. Taking 50 flips exceeds your risk budget for "casual bets with friends." Maintaining a risk budget is a rational policy for managing overall life variance, even if individual bets are +EV.

  ### The Verdict
  Your friend is right **only if** you accept his model of the world: a frictionless vacuum with known probabilities and zero non-monetary costs. In that world, your hesitation is irrational.

  But you are in **our** world.
  1.  **Model Uncertainty:** You need to verify the bet is real (Option Value).
  2.  **Counterparty Risk:** You need to ensure he can pay (Exposure Cap).
  3.  **Process Costs:** You don't want to spend your evening flipping coins forever (Diminishing Marginal Utility of Time).

  **How to reply:**
  You can tell him: *"I'm not risk-averse about the money; I'm risk-averse about the **model**. I'm willing to pay a small premium (in foregone EV) to buy the option to quit if I learn the coin isn't fair, you can't cover the tail risk, or this just stops being fun. That option value is worth more to me than the expected gain of flips 6 through 50."*

  That is a principled, decision-theoretic stance. It acknowledges the +EV while correctly pricing in the hidden risks of the real world.
