answer: |-
  Here is the adjudication. I'm going to skip the "both sides make good points" diplomacy and tell you where the metaphysical body count lies.

  ### 1. Is your reconstruction of Lewis fair?
  **Mostly yes, but you're giving him a slight pass on the masking issue.**

  You are correct that Lewis's *Reformed Conditional Analysis* (RCA) is designed primarily to kill Finks. By requiring the causal basis $B$ to be intrinsic and retained through the stimulus, he blocks the Fink (where $B$ is zapped before the effect).

  However, you say Lewis "famously struggles with masks." To be precise: Lewis's RCA *also* fails on masks, not just struggles. If $x$ has intrinsic basis $B$, undergoes $S$, retains $B$, but an extrinsic antidote prevents $R$, then the conditional "If $S$ and $B$ retained, then $R$" is still false. Lewis knows this. In *Finkish Dispositions* (1997), he hints that we might need to treat masks as a separate issue or build a *ceteris paribus* clause into the conditional ("no interfering factors"). But if you add "no interfering factors," you risk circularity (defining dispositions in terms of conditions where dispositions manifest).

  So, you aren't being unfair to Lewis, but you should tighten the claim: Lewis's fix solves Finks but leaves the analysis vulnerable to Masks unless he begs the question.

  ### 2. Does the tire case do real work, or is it just a standard antidote?
  **The tire is a standard antidote case, but your use of it is doing heavier lifting than you realize.**

  Theo is technically right that the tire is structurally identical to the poison/antidote case. The sealant intercepts the causal pathway downstream of the puncture (stimulus) but upstream of the deflation (manifestation). Logically, it's a mask.

  However, your claim isn't that the tire is a *new* logical category; your claim is that **categorizing it as a mask depends on mereological stipulation.** This is where you win.

  If the sealant is part of the object, it's part of the intrinsic basis. If it's part of the basis, the object *lacks* the disposition to deflate (just as a steel ball lacks the disposition to shatter). If the sealant is *not* part of the object, the object *has* the disposition, but it is masked.

  Theoretical payoff: This shows that the Fink/Mask distinction isn't purely about causal topology (when the intervention happens); it's about **ontological boundaries**. Lewis needs "intrinsic" to do the work of fixing the analysis. If whether a property is intrinsic depends on where we draw the line around "the object," and where we draw that line is interest-relative (pragmatic), then Lewis's analysis fails to be the mind-independent metaphysical account he promised.

  ### 3. Does Theo's "obviously not part of the object" reply save Lewis?
  **No. This is the weak link in his armor.**

  Theo is appealing to paradigm cases (the wire, the poison) to defend a definition that needs to hold universally. In metaphysics, "obviously" is not a truth condition.

  *   **The Wire:** Theo says the gadget is obviously extrinsic. But why? Because it's detachable? Because it was added later? Biological organisms constantly add and subtract parts. If a wire is part of a circuit board, is the voltage regulator intrinsic to the wire?
  *   **The Poison:** Theo says the antidote is obviously extrinsic. But if I swallow a slow-release capsule containing both poison and neutralizer, is the neutralizer intrinsic to the "poison system"?

  Lewis (and Langton) tried to define "intrinsic" in terms of natural properties and independence from accompaniment (1998, "Defining 'Intrinsic'"). But that definition is notoriously tricky. If "intrinsic" relies on a distinction between natural and non-natural properties, or internal vs. external relations, you haven't solved the problem; you've just moved the vagueness to "naturalness."

  Theo's defense works for introductory examples, but it crumbles under the pressure of composite objects or engineered systems (like your tire). If the analysis of dispositions relies on a notion of intrinsicality that can't handle composites without pragmatic stipulation, the analysis is interest-relative.

  ### 4. The Verdict

  **You win the argument, but you need to sharpen the blade.**

  *   **Where you're right:** The Fink/Mask distinction relies on the Intrinsic/Extrinsic distinction. The Intrinsic/Extrinsic distinction is often dependent on mereological boundaries (what counts as the object). Mereological boundaries are often pragmatic/interest-relative. Therefore, Lewis's attempt to ground dispositions in mind-independent intrinsic properties is compromised by the vagueness of "object."
  *   **Where you're slightly off:** Don't argue that the Fink/Mask distinction *doesn't exist*. It does exist causally (Finks remove the basis; Masks block the pathway). Argue instead that **Lewis cannot use the distinction to save his analysis** because classifying a case as one or the other requires the very metaphysical precision (intrinsicality) that his analysis is supposed to provide. You're charging him with circularity or regress, not denying the phenomena.
  *   **Where Theo is wrong:** He thinks clear cases validate the definition. They don't. A definition that works for "poison in a vacuum" but breaks on "self-sealing tires" or "biological homeostasis" is insufficient for a general metaphysical analysis.

  **Strategy for Round Two:**
  Stop talking about the tire as a counter-example to the *logic* of masking. Start talking about the tire as a counter-example to the **objectivity of intrinsicality.**

  Say this: *"Theo, I agree the tire is a mask case if the sealant is extrinsic. But Lewis needs 'intrinsic' to be a natural, mind-independent fact to ground dispositions. If whether the sealant is intrinsic depends on whether we're selling the tire or analyzing the rubber compound, then 'intrinsic' is pragmatic. If 'intrinsic' is pragmatic, Lewis's analysis isn't metaphysical—it's just a description of our labeling conventions. Your 'obviously' is just a shared convention, not a metaphysical discovery."*

  That puts the burden on him to define "intrinsic" without referencing our interests. Good luck.
