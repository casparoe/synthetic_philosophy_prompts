prompt: |-
  So I'm about four drafts into a novel and there's one scene I keep chickening out of writing properly, so I want to nail the substance before I try it in my own voice. Quick context: one of my main characters, Elena, is a mathematician who spent her whole career as a serious, old-school intuitionist in the Brouwer-through-Bishop tradition -- not the soft "I just like concrete examples" version, but someone who genuinely thought that a classical proof by contradiction which asserts something exists without ever constructing it isn't just inelegant -- it hasn't actually proved existence at all -- and she said so in print and lost atleast one long friendship over it. She dies about two-thirds through the book, and among her papers her family finds a short, half-joking instruction for whoever ends up giving the eulogy: "no existence proofs without witnesses, please, and mind what you do with excluded middle." The job falls to her favorite former student, now a professor herself, who has to actually stand up and deliver it at the memorial in front of maybe eighty people -- a third of them mathematicians who knew Elena for decades and would definately clock it if the eulogy cheated.

  What I need is the eulogy itself: the actual words the student says, roughly five minutes read aloud, grieving and warm and a little funny in the way people are when they're eulogizing someone difficult and beloved. The whole book is partly about how this department fights over foundations more than over anything that actually touches their lives, so I don't want this scene to just gesture at "logic people are quirky" -- the constraint has to really bite. So: no "she's in a better place now" (that's asserting existence with no witness in sight), no "either she made peace with her brother before the end or she didn't, and I like to think she did" (that's excluded middle doing emotional work it hasn't earned), and nothing else that only works if you're quietly allowed classical moves Elena spent her life refusing. It still has to land as comfort for the non-mathematicians in the room, who shouldn't have to notice the logic operating under the hood to feel it.

  I did a philosophy minor a hundred years ago and I've been re-reading around BHK semantics and the rejection of double-negation elimination for this chapter, so you don't need to explain the theory to me -- I just need the speech itself, ideally with a stage direction or two if it helps, like where she pauses or where the mathematicians in row two react.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Write a eulogy speech (approx. 5 minutes read aloud, ~750-800 words) for a character named Elena, a strict intuitionist mathematician (Brouwer/Bishop tradition).
      *   **Speaker:** Her favorite former student, now a professor.
      *   **Audience:** ~80 people, 1/3 mathematicians (who will scrutinize the logic), 2/3 non-mathematicians (family, friends, others).
      *   **Constraint:** The speech *must* adhere to intuitionistic logic constraints based on Elena's life work. No classical moves she rejected.
          *   No "existence without witness" (e.g., "She is in a better place," "There exists a reason for this").
          *   No "Law of Excluded Middle" (e.g., "Either she is at peace or she isn't," "She was either happy or sad").
          *   No "Double Negation Elimination" (e.g., "It is not true that she didn't love us" -> "She loved us").
      *   **Tone:** Grieving, warm, slightly funny (eulogizing someone difficult and beloved).
      *   **Goal:** Land as comfort for non-mathematicians while satisfying the logical constraints for the mathematicians.
      *   **Context:** This is a pivotal scene in a novel about foundational fights in a math department. The user is on draft 4 and needs to nail the substance.
      *   **User Knowledge:** User knows the theory (BHK, intuitionism, etc.), so no need to explain it. Just deliver the speech.

  2.  **Deconstruct the Logical Constraints for a Eulogy:**
      *   *Existence:* Can't say "She is somewhere else." Can't say "There is a God." Can't say "She lives on in our hearts" (unless we can point to specific witnesses/actions). Must focus on *constructed* memories, specific actions, tangible impacts.
      *   *Excluded Middle (LEM):* Can't say "She was either right or wrong." Can't say "Either we mourn or we celebrate." Must avoid binary states that aren't constructively verified. Instead of "She wasn't unhappy," say "She was happy." Instead of "Either she forgave him or she didn't," say "Here is the letter where she forgave him."
      *   *Double Negation:* Avoid "She was not unkind." Say "She was kind."
      *   *Infinity/Completeness:* Avoid claims about the "totality" of her life or "all" the things she did. Focus on finite, verifiable sequences.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the instruction. It's a known joke among the math crowd, but needs to be treated with respect. Set the tone.
      *   **Body Paragraph 1 (The Constraint):** Address the logical constraint directly but gently. Explain *why* she asked this. It's not just pedantry; it's about honesty.
      *   **Body Paragraph 2 (Specific Memories/Witnesses):** This is crucial for intuitionism. Existence requires a witness. So, list specific things she *did*. Not "she was a good teacher," but "here is the proof she corrected on page 4." Not "she loved her family," but "here is the record of calls."
      *   **Body Paragraph 3 (Avoiding LEM):** Handle the difficult relationships (the lost friendship mentioned in the prompt). Don't say "they made up." Don't say "they didn't." Say "Here is where they stood." Or focus on the construction of the relationship itself.
      *   **Body Paragraph 4 (Comfort for Non-Math):** Translate the logic into emotion. "We build what we remember." "We hold what we can touch."
      *   **Closing:** A final constructive statement. No "Rest in Peace" (implies a state we can't verify). Maybe "We continue the work."

  4.  **Refining the Logic (Self-Correction during drafting):**
      *   *Check:* "She is no longer in pain." -> *Correction:* "Her pain has ceased." (Actually, even that is tricky. Better: "We observe no further signs of pain.") Or stick to positive constructions: "She rests." (Wait, "rests" implies a state). Let's focus on the *memory* being present.
      *   *Check:* "She lives on in us." -> *Correction:* "We carry her methods." (Constructive).
      *   *Check:* "Either we laugh or we cry." -> *Correction:* "We are doing both."
      *   *Check:* "It is not true that she is gone." -> *Correction:* "She is here, in these papers." (Witness).
      *   *Check:* "She wasn't difficult." -> *Correction:* "She was demanding." (Positive attribute).
      *   *Check:* "There is a reason for everything." -> *Correction:* "We find reasons where we build them."

  5.  **Drafting the Content (Iterative Process):**

      *   *Start:* Stand at the podium. Acknowledge the note.
      *   *Middle:* Talk about her rigor. It wasn't coldness; it was care. To claim something exists, you must show it. To claim she loved, show the acts.
      *   *The Friendship:* Mention the lost friend (David? Let's keep it nameless or generic). Don't claim reconciliation. Claim the *value* of the argument itself.
      *   *The End:* How do we proceed? We construct the next step.

      *Wait, one specific constraint:* "No existence proofs without witnesses."
      *   Bad: "There is a God."
      *   Bad: "She is in a better place."
      *   Bad: "Her legacy lives on." (Abstract existence).
      *   Good: "Here is her legacy: [Specific Thing]."
      *   Good: "We remember [Specific Event]."

      *Wait, another constraint:* "Mind what you do with excluded middle."
      *   Bad: "She was either right or wrong."
      *   Bad: "Whether she knew it or not..."
      *   Good: "She knew it." (If witnessed).
      *   Good: "We see her choice."

      *Wait, Double Negation:*
      *   Bad: "She was not unkind."
      *   Good: "She was stern."

      *Let's write.*

      *Opening:* Thank you. The note.
      *   "No existence proofs without witnesses."
      *   "Mind the excluded middle."
      *   Acknowledge the mathematicians in the front rows. They are checking.
      *   Acknowledge the family. They just want to hear about her.

      *Body:*
      *   She taught us that truth is a verb.
      *   To say "she was good" is empty. Here is the witness: The Tuesday nights she spent grading.
      *   To say "she loved" is empty. Here is the witness: The letters.
      *   The fight with [Friend]. I cannot tell you they made peace. I cannot tell you they didn't. I can tell you I have the last letter she wrote him. It says [Constructive Content].
      *   Comfort: We don't need to assume she is "somewhere." We have her here. In the work.
      *   Closing: We continue the sequence.

      *Review against constraints:*
      *   "She is in a better place" -> Avoided.
      *   "She lives on" -> Changed to "We continue her work."
      *   "Either/Or" -> Avoided.
      *   "Not unkind" -> Avoided.
      *   "There exists a reason" -> Avoided.

      *Tone Check:* Is it warm? Is it funny?
      *   Need to inject the humor about the department fighting.
      *   Need to make sure the family feels hugged, not lectured.
      *   The logic should feel like *care*, not pedantry. "I refuse to lie about you."

      *Word Count:* 5 minutes is roughly 750 words at a moderate speaking pace.

      *Stage Directions:* Add a few for flavor. (Adjusting glasses, looking at the math row).

      *(Self-Correction on "She rests"):* Even "She rests" implies a state of being we can't verify. Better to focus on the *cessation* of labor or the *presence* of memory. "Her work is complete." (Verified by the papers).

      *(Self-Correction on "We will miss her"):* "Will" implies future knowledge. "We miss her now." (Present observation).

      *(Self-Correction on "She was the best"):* "Best" implies a total ordering of all mathematicians. Too classical. "She was rigorous." "She was ours."

      *Let's refine the "Lost Friendship" bit.* The prompt says she lost a friendship over this. The eulogy should address it without claiming resolution. "I cannot tell you they reconciled. I can tell you she kept his first paper." That's a witness.

      *Let's refine the "Comfort".* For non-math people, intuitionism sounds like "nothing is real unless you touch it." The comfort is: "What we built together is real." "Your love is real because you showed it."

      *Final Polish:* Ensure the rhythm sounds spoken. Pauses. Breaths.

      *(Wait, one more check on LEM)*: "Whether she knew it or not" -> "She knew it" or "She did not know it". Don't leave it as an open binary. If unknown, say "We do not know." Don't say "Either X or not X is true."

      *Okay, ready to draft.*

      *Structure:*
      1.  Introduction & The Note (Humor/Constraint setting).
      2.  What Intuitionism meant to her (Care/Witness).
      3.  Specific Witnesses (The work, the family, the friend).
      4.  The Comfort (Construction vs. Assumption).
      5.  Conclusion (Continuing the sequence).

      *Let's write.*
answer: |-
  [The speaker, MARA, steps to the podium. She adjusts the microphone, then pulls a folded piece of paper from her pocket. She looks out at the room, lingering for a second on the front rows where the mathematicians are sitting.]

  **MARA**
  Thank you for coming. Before I begin, I need to address the instruction Elena left for this moment. Some of you know it. For those who don't: she wrote, "No existence proofs without witnesses, please, and mind what you do with excluded middle."

  [A ripple of quiet laughter moves through the front rows. The family looks confused, then smiles at the warmth of it.]

  **MARA**
  She was joking. Mostly. But she was also telling me how to tell the truth about her.

  In Elena's view, to say something exists is a heavy claim. You cannot just say, "There is a reason for this," unless you can show us the reason. You cannot say, "She is in a better place," unless you can give us the coordinates. She spent forty years teaching us that truth isn't a static object we find; it is a structure we build. So today, I will not offer you assumptions. I will offer you witnesses.

  I cannot tell you that she lives on in our hearts. That is a metaphor without a construction. I can tell you that I have her notes on my desk. I can tell you that her daughter, Sarah, has her eyes, and we see them looking back at us today. I can tell you that the theorem on page forty of her latest draft is incomplete, and that incompleteness is now ours to finish. That is a tangible legacy. We hold it.

  [A pause. She looks down at the paper, then back up.]

  **MARA**
  I know there are people here who fought with her. I know there are people here who stopped speaking to her because she refused to accept a proof that relied on "either it is true or it isn't." She demanded we show *how* it was true.

  There was a friendship she lost over this. I cannot stand here and tell you they made peace before the end. I do not have a witness for that. I can tell you that on her desk, there was a copy of his first paper, the one he wrote when he was twenty-two. It was annotated. The margins are full of her handwriting. She wrote, "This step is brilliant," and, "Here you are lying to yourself." She kept it. She kept the work, even when she lost the friend. That is a witness to her respect.

  [She shifts her weight, gripping the sides of the podium.]

  **MARA**
  For her family: I know you want to know if she was happy. I cannot give you a binary. Happiness was not a state she claimed for herself. But I can show you what she did. I can tell you about the Sundays she spent helping your son with calculus, not giving him the answers, but showing him how to build the ladder. I can tell you about the phone calls she made every Tuesday at 7 PM. We have the logs. We have the records of care. She constructed love through action, not through declaration. To say she loved you is not an assumption. It is a summary of observed data.

  [She looks directly at the family now.]

  **MARA**
  This might feel cold to some of you. To say only what we can verify. But Elena believed that verifying was the highest form of love. To say "I know you" means I have seen you. I have watched your steps. I am not guessing.

  So I will not say she is at peace. I do not know the state of her silence. I will say that her work is complete. The sequence ends here.

  And for us, for the department, for the students who are wondering who will check their proofs now: We do not need to assume there is a successor. We are building one. We are taking her rigor and we are applying it to our grief. We are not saying "this hurts" because it is a cliché. We are saying "this hurts" because we feel the weight of the absence in the room. We can measure it.

  [She takes a breath. Her voice softens.]

  **MARA**
  She taught us that we cannot rely on the law of excluded middle to do emotional work for us. We cannot say "Either she is gone or she is here, and I choose to believe she is here." That is a comfort built on a logical shortcut.

  Instead, we say: She is gone from this room. We verify that. And she is present in this work. We verify that too. Both statements hold. We do not need to resolve the contradiction to feel the comfort. The comfort is in the construction.

  We have the papers. We have the memories. We have each other, standing here, verifying that she mattered.

  Thank you.

  [Mara steps back. She does not say "Rest in Peace." She simply nods, gathers her notes, and waits for the applause to begin.]
