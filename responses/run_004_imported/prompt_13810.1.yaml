      *   *The Formal Point:* Define SPO (Irreflexive, Asymmetric, Transitive). Define Well-Foundedness (No infinite descending chains). Show that SPO does not imply Well-Foundedness. (The Integer example is perfect here).
      *   *What Authors Deny:* They deny the **Well-Foundedness Constraint**. They keep the SPO structure (to avoid loops) but allow the chain to go on forever.
