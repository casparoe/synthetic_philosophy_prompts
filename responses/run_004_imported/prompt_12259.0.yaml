answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Fund Name]
  **FROM:** Grants Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Proposal [ID-2023-X]: Evidential Cooperation in Large Worlds (ECL) Research & Allocation Pilot

  ### Executive Summary

  The Grants Committee has reviewed the proposal requesting support for (1) one year of researcher salary to formalize Evidential Cooperation in Large Worlds (ECL) utility functions, and (2) a 10–15% earmark of the upcoming grantmaking budget to be allocated via ECL reasoning.

  The Committee is currently divided on the theoretical validity of ECL as an action-guiding framework. To balance the high value of information against the risks of premature capital deployment, we recommend a **split decision**:

  1.  **Research Salary:** **FUND WITH CONDITIONS.** We approve the researcher salary, contingent on specific deliverables focused on constraint and falsifiability rather than solely justification.
  2.  **Portfolio Earmark:** **DECLINE (WITH REVIEW TRIGGER).** We do not approve the 10–15% allocation earmark at this time. We will reconsider this only if the research phase produces a robust, constraint-based framework that satisfies specific epistemic thresholds.

  This approach prioritizes clarity before commitment. It acknowledges the potential significance of ECL without exposing the fund to the reputational and opportunity costs of acting on a framework that remains contested within decision theory.

  ---

  ### Context: The ECL Proposition

  Evidential Cooperation in Large Worlds (ECL) posits that in a sufficiently large or infinite universe, agents causally disconnected from us may share correlated decision procedures. Under Evidential Decision Theory (EDT), acting to benefit the values of these distant agents provides evidence that they will reciprocate, effectively allowing for "acausal trade."

  The applicant argues that because the potential scale of the "large world" dwarfs our local causal lightcone, even a small probability of ECL being valid dominates expected value calculations. The proposal seeks to operationalize this by funding formalization work and immediately testing the theory via a dedicated grantmaking portfolio.

  ---

  ### Decision 1: Researcher Salary (Fund with Conditions)

  **Recommendation:** Approve funding for one FTE-year ($120,000).
  **Conditions:** Funding is tranche-based, released upon delivery of (a) a literature review mapping the specific dependence of ECL on cosmological models, and (b) a formal statement of *constraints* (i.e., conditions under which ECL would *not* apply).

  **Reasoning:**
  The primary objection from the Committee minority regarding this line item is that funding this research legitimizes a speculative theory that may be fundamentally unfalsifiable, effectively paying for "philosophical speculation" with finite charitable capital.

  We acknowledge this concern. However, the Value of Information (VoI) here is exceptionally high. Even if ECL proves incoherent, a rigorous formalization that demonstrates *why* it fails is a public good for the longtermist ecosystem. It prevents other actors from making the same allocation errors. Conversely, if ECL is valid, the current lack of formalization is a bottleneck preventing effective action.

  By conditioning the grant on the identification of *constraints* and *failure modes*, we mitigate the risk of echo-chamber research. The researcher is not being asked to prove ECL works; they are being asked to define the boundaries of where it works. This satisfies the skeptical view that we need negative results as much as positive ones, while satisfying the proponent view that the concept requires deeper technical grounding before it can be dismissed.

  ---

  ### Decision 2: Portfolio Earmark (Decline for Now)

  **Recommendation:** Do not allocate the 10–15% "cooperative portfolio" at this time.
  **Review Trigger:** This decision will be automatically revisited in 12 months *if* the research deliverable establishes a consensus-adjacent method for estimating the correlation strength of distant agents.

  **Reasoning:**
  The primary objection from the Committee minority regarding this line item is that rejecting the earmark ignores a potentially dominant source of expected value. Proponents argue that if ECL is even 1% likely to be true, the sheer magnitude of the "large world" utility means that delaying allocation is itself a catastrophic loss in expectation. They argue that we are "leaving money on the table" (or rather, leaving acausal gains unrealized) by demanding causal-grade certainty for an acausal mechanism.

  We take this argument seriously. If ECL is valid, the opportunity cost of this delay is non-trivial. However, the Committee determines that the risks of immediate implementation outweigh the potential acausal gains for three specific reasons:

  1.  **The "Anything Goes" Problem:** Without a settled method for estimating the distribution of distant agents' values, an ECL mandate is operationally indistinguishable from personal preference. If we cannot distinguish between "cooperating with alien values" and "funding what the researcher already likes," the earmark loses its theoretical justification. Allocating capital under these conditions invites the accusation that ECL is a motte-and-bailey for standard cause prioritization.
  2.  **Reputational Externalities:** Longtermist funds operate in a high-scrutiny environment. Allocating 15% of our budget to projects justified by "acausal trade with invisible aliens" (however technically phrased) carries significant reputational risk. If the framework is later debunked, the damage to the fund's credibility could reduce our ability to fund *causal* x-risk interventions, which are objectively high-value.
  3.  **Robustness to Delay:** If ECL describes a real structural feature of the universe, it is likely time-invariant. Our decision procedures today will correlate with distant agents tomorrow just as they do today. Therefore, a 12-month delay to establish a robust framework does not necessarily sever the acausal link, whereas deploying capital on a flawed framework might constitute a "defection" in the eyes of those correlates.

  We are not rejecting ECL in principle; we are rejecting the *operational readiness* of ECL. The strongest version of the proponent's argument relies on the urgency of the expected value. We counter that urgency is moot if the mechanism of delivery is broken. Building the mechanism (via the research grant) must precede using it (via the earmark).

  ---

  ### Implementation & Timeline

  *   **Month 1:** Contract executed with researcher. Scope of work finalized to emphasize constraint-mapping.
  *   **Month 6:** Interim review. Committee assesses if the research is producing actionable formalism or drifting into pure metaphysics.
  *   **Month 12:** Final deliverable due. Committee convenes a special session to review the framework.
      *   *Success Metric:* Does the framework provide a non-arbitrary method for weighting distant values?
      *   *Outcome:* If successful, the 10–15% earmark is opened for the following fiscal year. If unsuccessful, the earmark proposal is closed, and the fund returns to standard causal prioritization.

  ### Conclusion

  This split decision allows the Fund to be epistemically humble without being intellectually closed. We fund the question, but we do not yet bet the farm on the answer. This protects the Fund from the charge of dogmatism (by funding the research) and the charge of recklessness (by withholding the earmark).

  **Vote Count:**
  *   Research Salary: 5 For, 2 Against, 1 Abstain
  *   Portfolio Earmark: 3 For, 4 Against, 1 Abstain

  **Recommended Action:** Board approval of the Research Salary only, with the stipulations outlined above.

  ***

  **[End of Memo]**
