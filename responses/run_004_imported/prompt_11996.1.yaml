answer: |-
  This is an excellent question. First, I want to validate your intuition: your understanding of the history is spot-on, and your confusion is shared by almost everyone who first dives deep into this topic. The popular narrative of physics history often tells a story that goes like this:

  1.  **Newton:** Space is a real, absolute container (Substantivalism).
  2.  **Mach/Leibniz:** No, space is just relations between objects (Relationism).
  3.  **Einstein:** General Relativity (GR) proves Mach right and Newton wrong.

  Because this narrative is so common in popular science, it is completely reasonable to assume the debate is settled. However, philosophers of physics and many theoretical physicists do not consider the matter closed. They are not "behind on the physics"; rather, they are arguing about **how to interpret the physics we already have.**

  Here is the thorough explanation of why General Relativity did not kill substantivalism, what modern substantivalists actually believe, and why the debate remains vibrant.

  ### 1. Einstein's Disappointment: GR is not fully Machian
  Your understanding is that Einstein built GR to "cash out" Mach's idea. This is historically true: Einstein was deeply motivated by Mach's principle. He wanted a theory where inertia (the resistance to acceleration, like the water climbing the bucket) was generated *entirely* by the presence of other matter in the universe.

  However, once the mathematics of General Relativity was finalized, Einstein realized **GR does not fully satisfy Mach's Principle.**

  Here is why:
  *   **Vacuum Solutions:** GR allows for solutions to the field equations where there is **no matter anywhere** in the universe (an empty spacetime). In Newton's view, this is fine; the bucket rotates relative to absolute space. In Mach's view, this should be impossible; without other stars, there is no reference for rotation, so inertia shouldn't exist. Yet, in GR, a test particle in an empty universe still has inertia. It still resists acceleration. If there is no matter to relate to, what is it resisting? The substantivalist says: "It is resisting motion relative to the spacetime structure itself."
  *   **Gravitational Waves:** GR predicts ripples in spacetime that can travel through a vacuum. They carry energy and momentum. If spacetime were merely a set of relations between material bodies, how can there be a "ripple" in a region where there are no bodies? The fact that the spacetime metric (the mathematical object that defines distances and time) can wiggle, carry energy, and exist without matter suggests it has a physical reality of its own.

  So, while GR made space *dynamic* (it can curve and warp), it did not make it purely *relational*. It retained a kind of "substance" status.

  ### 2. What Modern Substantivalists Believe
  You mentioned that substantivalists seem to be holding onto "Newton's absolute container." This is the most common misconception. No serious contemporary philosopher of physics believes in Newton's rigid, immutable, God-sensed absolute space. That *is* dead.

  Modern substantivalism (often called **Spacetime Realism**) argues something more subtle:
  *   **The Metric Field is a Physical Object:** In GR, spacetime is represented by the metric field ($g_{\mu\nu}$). This field interacts with matter, tells matter how to move, and is told by matter how to curve. It has degrees of freedom (gravitational waves).
  *   **The Argument:** If something has energy, momentum, and causal powers (it affects matter), it qualifies as a physical "substance" in the modern sense. Therefore, spacetime is a physical entity, not just a bookkeeping system for relations between rocks and stars.

  So the debate is no longer "Container vs. Relations." It is: **"Is the gravitational field a physical object in its own right, or is it merely a codification of relations between material events?"**

  ### 3. The Hole Argument: The Technical Core of the Debate
  If you talk to a philosopher of physics about this, they will almost certainly bring up **The Hole Argument**. This is the main reason the debate is still open. It was originally formulated by Einstein, abandoned, and then resurrected by philosophers in the 1980s (notably John Earman and John Norton).

  Here is the simplified version:
  1.  Imagine a region of spacetime that contains no matter (a "hole").
  2.  According to GR, we can mathematically shuffle the values of the spacetime metric inside that hole without changing anything outside the hole or changing the distribution of matter.
  3.  **The Substantivalist Dilemma:**
      *   If spacetime points are real, individual "things" (like distinct seats in a theater), then shuffling the metric inside the hole creates a **physically different situation**. (The curvature is now at Point A instead of Point B).
      *   However, the laws of GR cannot predict which of these shuffled versions will occur. The theory becomes **indeterministic**.
      *   To save determinism, the **Relationist** says: "The shuffling doesn't create a new physical situation. The points of space don't have individual identities. Only the *coincidences* of matter and field interactions matter."

  This forces a choice. You can keep substantivalism, but you have to accept a weird form of determinism. Or you can keep determinism, but you have to deny that spacetime points have independent reality. There is no experiment that can decide this; it is a metaphysical interpretation of the mathematical formalism.

  ### 4. Why the Debate Matters (Quantum Gravity)
  You might ask, "If it's just interpretation, why care?" The reason physicists care is that this choice dictates how we try to build the next theory: **Quantum Gravity.**

  *   **If Substantivalism is true:** Spacetime is a real field. We should try to quantize it like we quantize the electromagnetic field. This is the approach of **String Theory** (in some guises) and perturbative quantum gravity. Spacetime is a fundamental "thing" made of gravitons.
  *   **If Relationism is true:** Spacetime is not fundamental; it emerges from deeper relations. We shouldn't quantize spacetime directly; we should find the underlying relational structure from which spacetime emerges. This is the approach of **Loop Quantum Gravity** and **Shape Dynamics** (championed by Julian Barbour). In these views, time and space might disappear entirely at the fundamental level.

  Because we don't have a working theory of Quantum Gravity yet, we don't know which interpretation of GR is the "correct" pointer toward the future.

  ### 5. Summary: Why the Debate is Open
  To summarize why your friends and the literature treat this as an open question:

  1.  **GR allows empty universes:** Inertia exists even without distant stars, which contradicts a strong reading of Mach's Principle.
  2.  **Spacetime has energy:** Gravitational waves carry energy through a vacuum, suggesting spacetime is a physical entity, not just a relation.
  3.  **The Hole Argument:** The mathematics of GR allows for multiple interpretations regarding the reality of spacetime points, and experiments cannot distinguish between them.
  4.  **Future Physics:** The choice between substantivalism and relationism guides research into Quantum Gravity. We can't settle the ontology until we know if spacetime survives quantization.

  ### Conclusion
  You are not missing a recent discovery that settled the score. The popular story that "Einstein proved Mach right" is a simplification. Einstein hoped Mach was right, but his theory allowed for spacetime to have a physical reality independent of matter.

  Contemporary substantivalists are not clinging to Newton's bucket; they are clinging to the **reality of the metric field.** Contemporary relationists are not denying gravity; they are arguing that the metric field is a derivative structure, not a fundamental substance.

  Physics has told us *how* spacetime behaves, but it has not yet told us *what* spacetime is. Until we have a theory of Quantum Gravity, or a philosophical consensus on the Hole Argument, the dispute between Newton's ghost (substantivalism) and Leibniz's ghost (relationism) remains one of the most profound open questions in the foundations of physics.
