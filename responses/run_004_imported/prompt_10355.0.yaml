answer: |-
  This is a classic friction point between individual decision theory and general equilibrium/game theory, and you are right to spot that the slogans ("information is always good" vs. "information can destroy value") seem to contradict.

  The short answer is: **Good's theorem and the Hirshleifer effect are not answering the same question.** They operate under different scope conditions, specifically regarding the **exogeneity of the action space**.

  Good's theorem holds for a single agent facing a fixed decision problem. The Hirshleifer effect arises in multi-agent settings where the *feasible set of actions* (specifically, market contracts) is endogenous to the information structure. The economist's "gotcha" is valid against a naive extrapolation of Good's theorem to social contexts, but it is not a counterexample to the theorem itself.

  Here is the technical breakdown of why they are compatible, and where the divergence lies.

  ### 1. The Crucial Assumption in Good's Theorem
  Good's theorem (1967) proves that for a Bayesian expected-utility maximizer, $E[\max_a E[U(a, \omega) | e]] \geq \max_a E[U(a, \omega)]$.

  The proof relies on a specific inequality: for any realized evidence $e$, the optimal action $a_e$ yields utility at least as high as the prior optimal action $a_{prior}$. That is:
  $$ \max_a E[U(a, \omega) | e] \geq E[U(a_{prior}, \omega) | e] $$
  This inequality holds because **$a_{prior}$ is still in the action set $A$ after observing $e$.** The agent always has the option to "ignore" the information and act as if they hadn't seen it.

  **The Scope Condition:** Good's theorem assumes the payoff function $U(a, \omega)$ and the **feasible action set $A$** are fixed independent of the information structure. The information only changes the probability distribution over states $\omega$; it does not change the rules of the game or the availability of actions.

  ### 2. The Mechanism of the Hirshleifer Effect
  Hirshleifer's result (1971) is situated in a general equilibrium framework with multiple agents. The "actions" available to the farmers are not physical acts (like "plant corn" vs. "plant wheat"), but **trades** (insurance contracts).

  *   **No Information Case:** Agents face idiosyncratic risk. Because no one knows who will fail, they can write contingent contracts to pool risk. The feasible action set includes "sign mutual insurance."
  *   **Public Information Case:** The weather forecast reveals the state (or components of the state) *before* contracts are signed. Now the risk is no longer idiosyncratic; it is known. The counterparty (the insurer/other farmers) will not offer insurance against a known loss.

  **The Divergence:** In the Hirshleifer case, the arrival of information **removes actions from the feasible set.** The action "sign insurance contract" is available in the *no-information* world but is **not available** in the *information* world (because it is incentive incompatible; the informed party won't trade).

  Because the action set $A$ shrinks when information arrives, the condition required for Good's theorem ($\max_{a \in A_{info}} \dots \geq \max_{a \in A_{no-info}} \dots$) fails. The farmers cannot "act like they never saw the forecast" because the market counterparties *saw the forecast too*, and thus the "ignore info" action is no longer an equilibrium outcome.

  ### 3. Reconciling the Results
  To answer your specific questions:

  > *Which one has to give here?*

  Neither. They are theorems about different objects. Good's theorem is about the **value of information for control**. Hirshleifer's effect is about the **value of information for risk-sharing**.

  > *Doesn't that mean Hirshleifer's farmers... must be messing something up?*

  No. The farmers are rational expected-utility maximizers. The "mess up" is not in their reasoning, but in the assumption that the decision problem remains fixed. In the Hirshleifer scenario, the information creates a **negative externality** on the feasible set of contracts.

  If you tried to model the Hirshleifer farmers as a *single* Bayesian agent (a social planner maximizing the sum of utilities), Good's theorem *would* apply to the planner *if* the planner could force the insurance contracts to remain in place regardless of the information. But in a decentralized market, the contracts are voluntary. The information changes the strategic environment such that the mutually beneficial trade vanishes.

  > *Are these two results just quietly not answers to the same question?*

  Yes.
  *   **Good's Theorem:** Asks, "Given a fixed menu of options, does knowing more help me choose better?" (Answer: Yes.)
  *   **Hirshleifer Effect:** Asks, "Does knowing more change the menu of options available to me in a strategic setting?" (Answer: Yes, and it can remove high-value options.)

  ### 4. Philosophical Implications for Your Seminar
  Since you are TAing a decision theory seminar, this is a fantastic opportunity to discuss the **boundaries of individual decision theory.**

  1.  **The "Fixed World" Assumption:** Standard decision theory (Savage, etc.) treats the state space and action space as primitive and fixed. Economics often treats the action space (prices, contracts) as endogenous to the information structure.
  2.  **Strategic vs. Parametric:** Good's theorem treats the environment as parametric (states are "nature's moves"). Hirshleifer treats the environment as strategic (other agents react to the information). When other agents are involved, my information changes *their* actions, which changes my payoffs in ways Good's theorem doesn't model.
  3.  **Value of Ignorance:** The Hirshleifer effect is a specific instance of a broader class of results where **commitment to ignorance** is valuable. In game theory, sometimes you want to be unable to access information (e.g., in bargaining, or to maintain credible threats). Good's theorem precludes this because it assumes you can always ignore the info *without consequence*. Hirshleifer shows you can't always ignore it without consequence, because the *existence* of the info changes the equilibrium.

  ### Summary for the Students
  If a student asks about this, the cleanest way to put it is:

  "Good's theorem guarantees that information never hurts your *decision-making capability*. However, it does not guarantee that information won't change the *environment* in which you decide. In the Hirshleifer case, the information doesn't make the farmers decide worse; it makes the insurance market disappear. Good's theorem assumes the menu stays the same; Hirshleifer shows the menu can shrink."

  ### Recommended Reading for You
  If you want to dig into the formal reconciliation, look at:
  *   **Moses & Nachbar (1993), "Monotonicity of the Value of Information":** They discuss conditions under which information can be harmful, specifically highlighting the role of endogenous action spaces.
  *   **Schulte (2010):** Discusses the distinction between *individual* value of information and *social* value of information.
  *   **Blackwell's Theorem comparisons:** Often discussed alongside Good's theorem. Blackwell comparisons assume fixed decision problems. Hirshleifer violates the "fixed decision problem" constraint.

  The economist wasn't wrong, but they were pitching a game-theoretic limitation as a decision-theoretic refutation. Your intuition that the farmers aren't "messing up" is correct; they are facing a different structural problem than the one Good solved.
