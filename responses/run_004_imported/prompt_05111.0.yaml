answer: |-
  This is a classic pivot point in the free will debate. You've hit on exactly what makes Strawson's "Basic Argument" (first formulated in 1994) distinct from the standard Hard Incompatibilism or Consequence Arguments you see in introductory philosophy.

  Most "no free will" arguments attack **leeway** (the ability to do otherwise). Strawson attacks **sourcehood** (the origin of the self).

  Here is the unpacking of why the regress kills responsibility regardless of determinism, and how *causa sui* is the engine driving the whole thing.

  ### 1. The Structure of the Basic Argument
  Strawson's argument is intentionally short and brutal. It doesn't start with physics; it starts with the conditions for praise or blame.

  1.  To be truly morally responsible for what you do, you must be responsible for **the way you are** (at least in certain crucial mental respects).
  2.  You cannot be responsible for the way you are unless you have intentionally brought yourself to be that way.
  3.  To intentionally bring yourself to be a certain way, you must already have a **prior nature** (principles, preferences, values) that guides that intentional change.
  4.  Therefore, to be responsible for your new nature, you must be responsible for your prior nature.
  5.  This leads to an infinite regress.
  6.  Since you cannot complete an infinite regress of self-creations, you can never be truly responsible for the way you are.
  7.  Therefore, you can never be truly responsible for what you do.

  ### 2. Why Indeterminism Doesn't Help
  This is the part that trips people up. The standard Libertarian response is: *"Okay, determinism is out. But if quantum indeterminacy introduces genuine randomness into the decision-making process, the chain is broken. The agent is the uncaused cause."*

  Strawson says this is a category error. Here is why randomness fails to stop the regress:

  **The "Luck" Objection**
  If a decision is not determined by your prior character/values (your "way you are"), then it is, by definition, random relative to your character.
  *   **Scenario A (Determinism):** Your action is caused by your character + environment. You didn't choose your character or environment. -> **No Responsibility.**
  *   **Scenario B (Indeterminism):** Your action is *not* fully caused by your character. It has a random element. -> **No Responsibility.**

  Why? Because if the decision pops out of a probabilistic cloud rather than flowing deterministically from your values, it isn't *authored* by you. It's just noise. You can't take credit for a random number generator any more than you can take credit for a determined clockwork.

  To claim responsibility for a random choice, you would have to be responsible for the **probability distribution** that generated the choice. But that distribution is part of "the way you are." So we are back to: *Are you responsible for the way you are?*

  Indeterminism just changes the mechanism of the regress; it doesn't solve the requirement for **ultimate sourcehood**.

  ### 3. The *Causa Sui* Requirement
  This is where Nietzsche comes in. Strawson argues that "True Moral Responsibility" (TMR) logically requires you to be *causa sui* (cause of yourself).

  To see why, look at the regress again.
  *   If your actions flow from your Nature ($N_1$), you are only responsible if you chose $N_1$.
  *   To choose $N_1$, you needed a prior Nature ($N_0$) to make that choice.
  *   To be responsible for $N_1$, you must be responsible for $N_0$.

  How do you stop the chain?
  1.  **Stop at Birth:** You weren't responsible for $N_0$ (genetics/infancy). Therefore, you aren't responsible for $N_1$, and therefore not responsible for your actions.
  2.  **Go Back Infinitely:** Logically impossible for a finite being.
  3.  **Self-Creation (*Causa Sui*):** You create $N_0$ out of nothing, without relying on a prior nature.

  Strawson (channeling Nietzsche) argues that (3) is logically incoherent. You cannot choose your own nature without *already having* a nature to do the choosing. To choose is to act according to preferences/reasons. If you have no prior preferences/reasons, you cannot choose. If you *do* have them, you are relying on a prior state you didn't choose.

  Therefore, TMR requires the impossible: **You must be the cause of yourself, prior to yourself.**

  ### 4. Is Randomness a Separate Failure?
  You asked: *Is randomness just another way of failing to be causa sui, or is there a separate thing going on?*

  It is the **same failure**, just viewed from the other side of the coin.

  *   **Determinism** fails because the cause is **external** to the agent (past states of the universe).
  *   **Indeterminism** fails because the cause is **non-existent** (randomness/noise).

  In both cases, the **Agent** is not the *ultimate* source.
  *   In the deterministic case, the Agent is a conduit for the past.
  *   In the indeterministic case, the Agent is a conduit for chance.

  For the Agent to be the source, the Agent must generate the causal power *ex nihilo*. That is *causa sui*. Since *causa sui* is impossible (you can't design your own source code before you exist to run the design program), both determinism and randomness result in the same outcome: **No Ultimate Responsibility.**

  ### 5. The LW-Adjacent Framing
  Since you mentioned lurking on LW-adjacent blogs, it might help to frame this in terms of optimization and source code.

  Imagine a human is an optimization process.
  *   **Compatibilists** say: "The output is free if it aligns with the current objective function, regardless of who wrote the objective function."
  *   **Standard Incompatibilists** say: "The output isn't free if the objective function was determined by prior physical states."
  *   **Strawson** says: "The output isn't free unless **you** wrote the objective function."

  But to write the objective function, you need a meta-algorithm to decide what the objective function should be. Who wrote the meta-algorithm?
  *   If physics wrote it $\rightarrow$ Not you.
  *   If randomness wrote it $\rightarrow$ Not you.
  *   If *you* wrote it $\rightarrow$ You needed a meta-meta-algorithm.

  Strawson's point is that "True Responsibility" requires the optimization process to have written its own source code from a state of non-existence. That is a logical contradiction.

  ### Summary
  Strawson isn't arguing that we are puppets (determinism). He is arguing that **ownership** is logically impossible.

  Indeterminism doesn't save you because "random" does not mean "free." It just means "unpredictable." To own a random choice, you must own the randomness. To own the randomness, you must have designed the distribution of the randomness. To design that, you need a prior self.

  The regress demands *causa sui*. *Causa sui* is impossible. Therefore, the regress cannot be stopped. Therefore, no one is ever *truly* (ultimately) morally responsible.

  Strawson is happy to admit we have "practical" responsibility (we still put people in jail to modify behavior), but he insists the *retributive* desert—the idea that you *deeply deserve* praise or blame in a cosmic sense—vanishes.
