  ok so i've been down a free will rabbit hole lately (as one does after a decade of lurking on LW-adjacent blogs) and got properly into Galen Strawson's Basic Argument for why no one is ever *truly* morally responsible. the thing tripping me up: Strawson insists the argument goes through whether or not determinism is true -- he's explicit that indeterminism doesn't rescue you either. that surprised me, since every "no free will" argument i'd run into before leans entirely on determinism, and half the compatibilist-leaning people i've argued with online treat "well there's some genuine randomness in the causal chain" as the obvious escape hatch. can you unpack what's actually doing the work in the regress (the bit about needing to already be responsible for "the way you are" in order to be responsible for what that way-of-being causes), such that throwing in some indeterminism doesn't save you? and where does the old causa sui thing fit in -- i think he namedrops Nietzsche's line about pulling yourself up by your own hair out of the swamp of nothingness -- is randomness just another way of failing to be causa sui, or is there a seperate thing going on?
