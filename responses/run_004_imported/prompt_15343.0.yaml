answer: |-
  You have hit upon precisely the most significant and enduring objection to Molinism. In the literature, this is known as **the Grounding Objection**. It was raised by Molina's Dominican contemporary Domingo Báñez and has been revitalized in contemporary analytic philosophy of religion by critics like Robert Adams, William Hasker, and Patrick Todd.

  Your intuition that this threatens to collapse Molinism into a form of determinism is shared by many critics. However, whether the criticism is "fair" depends on whether one accepts the Molinist metaphysics of counterfactuals. To answer your question directly: The criticism is **dialectically fair** (it identifies the system's greatest vulnerability), but Molinists argue it **misdescribes the metaphysical relationship** between God's knowledge and creaturely freedom.

  Here is a breakdown of where your worry aligns with the standard objection, where the Molinist defense locates the error in that reasoning, and how to evaluate the claim that this is "worse than Calvinism."

  ### 1. The Core of the Worry: The Grounding Objection
  Your worry is that if the Counterfactuals of Creaturely Freedom (CCFs) are true *logically prior* to God's creative decree, something must make them true. In truth-maker theory, a proposition is true only if there is some existing state of affairs that grounds it.
  *   **The Problem:** At the "moment" of Middle Knowledge, the creatures do not exist yet (so they can't ground the truth), and God has not yet decreed anything (so His will doesn't ground the truth).
  *   **Your Inference:** If God knows them, and nothing else grounds them, it seems God must be the one "fixing" them. If God fixes the truth value of "If Peter is in C, he will freely deny Christ," then Peter's denial is determined by God's fixation of that truth, not by Peter's freedom.

  This leads to your charge of "double scripting":
  1.  **Script 1:** God fixes the CCFs (Peter *would* deny).
  2.  **Script 2:** God actualizes the circumstances C (Peter *does* deny).

  ### 2. The Molinist Defense: Discovery, Not Decree
  Contemporary Molinists (Plantinga, Craig, Flint) explicitly deny the premise that God "fixes" or "authors" the CCFs. This is where they argue your criticism misdescribes the system.

  **A. Logical Priority vs. Causal Priority**
  Molinists insist on a sharp distinction between *logical priority* and *causal/temporal priority*.
  *   God's knowledge of CCFs is **logically prior** to His decree.
  *   However, it is **not causally prior**. God does not *make* the CCFs true; He simply *sees* that they are true.
  *   **Analogy:** Consider a time traveler who goes back and observes a free action. The time traveler's knowledge of the action is prior to the action in terms of information, but the knowledge does not *cause* the action. Similarly, God "observes" the truth of CCFs in the "mirror" of His essence (to use classical language) or simply grasps the logical structure of possible worlds (to use Plantinga's language).

  **B. The Source of Truth: Creaturely Essences**
  Plantinga and others argue that the truth of CCFs is grounded in the **essences** of the possible creatures.
  *   It is part of the *identity* of "Peter" that in circumstances C, he would freely choose X.
  *   God does not write this script; the script is inherent to the possible individual concept of "Peter."
  *   Therefore, God is not the author of Script 1. God is merely the selector of which "scripted" possible persons to actualize.

  **C. The "Could Have Done Otherwise" Condition**
  To defend libertarian freedom, Molinists argue that even if it is *true* that Peter would deny Christ in C, Peter still retains the **power** to do otherwise.
  *   The truth of the counterfactual does not remove the ability.
  *   If Peter were to choose to stand fast, the counterfactual "If Peter were in C, he would deny" would simply have been false (and God, having middle knowledge, would have known *that* instead).
  *   The truth is contingent, not necessary. It just happens to be the case that this is the truth value associated with Peter.

  ### 3. Is Molinism "More Deterministic" than Calvinism?
  Your claim that this makes Molinism "a more thoroughgoing determinism than the Calvinist decree" is a provocative charge often leveled by Open Theists (like Hasker) against Molinists. Here is how the debate stacks up:

  **The Critic's Case (Why it might be "worse"):**
  *   **Control:** In Calvinism, God determines the action, but He limits His control to the causal chain. In Molinism, God has *more* control. By selecting the exact circumstances where He knows a creature will freely choose X, God can ensure *any* outcome He desires without violating freedom.
  *   **Masking:** Critics argue this is "determinism in disguise." It claims to offer libertarian freedom, but because God selects the world based on exhaustive knowledge of how creatures *must* (in a counterfactual sense) behave, the resulting world is as fixed as a Calvinist one. It creates a "theological fatalism."

  **The Molinist Case (Why it is distinct):**
  *   **Mode of Production:** In Calvinism, the *mode* by which the action occurs is causal determination. In Molinism, the *mode* is libertarian agency. The fact that God knew it would happen doesn't change the metaphysical nature of the choice *at the moment of choice*.
  *   **Responsibility:** Because the CCFs are grounded in the creature's essence (not God's will), the moral responsibility for the action remains with the creature. In Calvinism, theodicy is difficult because God authors the sin. In Molinism, God authors the *circumstances*, but the creature authors the *sinful response*.
  *   **The "Luck" Objection:** Molinists turn the table on critics. If God *doesn't* know the CCFs (as Open Theists hold), then God creates the world blindly, hoping creatures don't destroy His plan. Molinists argue their view preserves *more* sovereignty without sacrificing freedom, whereas the critic's view sacrifices sovereignty to save freedom.

  ### 4. Where the Criticism Hits Home
  Your criticism is most potent if you press the **Grounding Objection** regarding the *origin* of the essences.
  *   If the truth of CCFs is "primitive" (just brute facts), critics argue this is metaphysically mysterious. How can there be a truth about a non-existent person's free action without a truth-maker?
  *   If the truth is grounded in the creature's essence, who created the essence? God did. If God created the essence of "Peter" knowing it entailed "Peter will deny in C," did God not effectively determine the denial by creating *that* Peter rather than a Peter who would stand fast?

  This is the "Universal Causation" worry. If God selects which essences to actualize based on their counterfactual behaviors, He is still ultimately responsible for which behaviors enter reality.

  ### Conclusion
  Is your criticism fair? **Yes.** It accurately identifies the tension between divine sovereignty and libertarian freedom that Molinism attempts to walk. It is the standard objection for a reason.

  Does it misdescribe the system? **In one specific way.** It assumes that because God's knowledge is "middle," God's *will* is the author of that knowledge. Molinists vehemently deny this. They argue God is passive with respect to Middle Knowledge (He receives it) and active with respect to Free Knowledge (He decrees the world).

  **Verdict for your Seminar:**
  You should frame your objection not as "Molinism is secretly Calvinism," but as **"The Grounding Objection suggests that Molinism pushes the determinism back one step: from the decree of the action to the selection of the essence."**

  If God creates the natures that guarantee the counterfactuals, He still controls the outcome, even if He doesn't causally determine the specific volition. Whether this counts as "determinism" depends on whether you define determinism by the *causal mechanism* (where Molinism escapes it) or by the *inevitability of the outcome given God's creative choice* (where Molinism may succumb to it). This distinction will likely drive the rest of your seminar's discussion.
