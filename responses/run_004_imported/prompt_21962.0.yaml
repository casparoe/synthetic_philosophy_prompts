answer: |-
  **Setting:** *A cramped office at the Institute for Decision Sciences. 2:00 AM. A whiteboard is covered in decision trees. On the table between them lies a single sheet of paper: "Trade Sequence Protocol v4." Two empty coffee cups sit near the edge.*

  **Characters:**
  *   **ELENA:** Proponent of Coherence Arguments / Expected Utility Theory.
  *   **MARCUS:** Proponent of Resolute Choice / Non-Separable Decision Theory.

  ***

  **ELENA:** (Tapping the trade sheet) Look at the numbers, Marcus. It's not subtle. We have an agent with cyclic preferences over three outcomes: $A \succ B$, $B \succ C$, and $C \succ A$. I'm the bookie. I start you at $A$.

  **MARCUS:** I know the setup, Elena. The standard money pump.

  **ELENA:** It's not just "standard," it's lethal. At Node 1, I offer you $B$ for $A$ minus a fee $\epsilon$. Since $B \succ A$, you trade. You now have $B - \epsilon$. At Node 2, I offer $C$ for $B$ minus $\epsilon$. Since $C \succ B$, you trade. You have $C - 2\epsilon$. At Node 3, I offer $A$ for $C$ minus $\epsilon$. Since $A \succ C$, you trade. You end up with $A - 3\epsilon$. You are back at $A$, but poorer. I repeat this indefinitely. You bleed to death. This proves cyclic preferences are irrational.

  **MARCUS:** That proof only holds if the agent is *myopic*. It assumes the agent treats each node as a new, isolated decision problem, maximizing local utility without regard for the path taken to get there. That's not the only way to be an agent.

  **ELENA:** It's the only way to be a *consequentialist* agent who respects Separability. If you prefer $B$ to $A$ when you're at Node 1, you take $B$. If your preference changes just because you thought about it yesterday, that's not rationality, that's mood swings.

  **MARCUS:** It's not mood swings. It's *Resolute Choice*. McClennen laid this out in '90. The unit of agency isn't the node; it's the *plan*. At $t_0$, before we even reach Node 1, I survey the entire decision tree. I see that the plan "Keep $A$ at all nodes" yields outcome $A$. The plan "Trade to $B$, then $C$, then $A$" yields outcome $A - 3\epsilon$.

  **ELENA:** Obviously.

  **MARCUS:** Even though locally, at Node 1, I prefer $B$ to $A$, my global preference over *plans* prefers "Keep $A$" to "Trade Loop." As a resolute chooser, I commit to the plan "Keep $A$" at $t_0$. When I arrive at Node 1, I don't re-evaluate based on my local preference $B \succ A$. I execute the plan. I say "No trade." The pump never starts. I keep $A$. I keep my $\epsilon$.

  **ELENA:** You're begging the question. You're saying you have a preference over plans that contradicts your preferences over outcomes. You prefer Outcome $A$ (via the Keep Plan) to Outcome $A - 3\epsilon$ (via the Trade Plan), sure. But why do you pick the Keep Plan at $t_0$?

  **MARCUS:** Because it dominates.

  **ELENA:** Does it? Let's look at your preferences again. $A \succ B$, $B \succ C$, $C \succ A$. At $t_0$, you are effectively choosing between three terminal plans: Plan$_A$ (End with $A$), Plan$_B$ (End with $B$), Plan$_C$ (End with $C$).
  Since you prefer $B$ to $A$, you should prefer Plan$_B$ to Plan$_A$.
  Since you prefer $C$ to $B$, you should prefer Plan$_C$ to Plan$_B$.
  Since you prefer $A$ to $C$, you should prefer Plan$_A$ to Plan$_C$.
  Your preferences over *plans* are just as cyclic as your preferences over *outcomes*.

  **MARCUS:** Not if the resolution itself alters the preference structure. When I resolve to follow Plan$_A$, I bind my future self. The preference $B \succ A$ at Node 1 is suppressed by the commitment made at $t_0$.

  **ELENA:** Suppressed how? By what mechanism? If I offer you a trade *at $t_0$* on the plans themselves, you're back in the pump. Imagine I don't offer trades at the nodes. I offer trades on the *policy* before we start.
  "Marcus, I see you're holding Plan$_A$. I know you prefer $B$ to $A$. Pay me $\epsilon$, and I will force you to adopt Plan$_B$."
  Since $B \succ A$, a rational agent should pay $\epsilon$ to switch from Plan$_A$ to Plan$_B$.
  Then I offer: "You're holding Plan$_B$. You prefer $C$ to $B$. Pay $\epsilon$, switch to Plan$_C$."
  Then: "You're holding Plan$_C$. You prefer $A$ to $C$. Pay $\epsilon$, switch to Plan$_A$."
  You've just paid $3\epsilon$ to end up with Plan$_A$, which is where you started. I've pumped you on the *resolution* itself. Gustafsson nailed this in his 2022 monograph. You can't escape the cycle just by moving the decision to $t_0$ if the preferences driving that decision are still cyclic.

  **MARCUS:** (Leans forward, tracing a line on the whiteboard) That assumes the choice of resolution is governed by the same cyclic preferences. But resolute choice posits that rationality requires *Dynamic Consistency* of the plan, not necessarily consistency of local preferences.
  However, I'll grant you the point on the "Policy Pump" if we treat the policy as just another commodity. But that's not how resolute choice works. Resolute choice isn't about maximizing a utility function over plans; it's about *constituting* oneself as a temporally extended agent.
  When I choose Plan$_A$, I am not satisfying a preference $A \succ B$. I am rejecting the authority of the local preference $B \succ A$. I'm saying that the preference at Node 1 is *not normative* for me because it leads to a dominated outcome.

  **ELENA:** So you're a deontologist of your own past self. "I made a vow at $t_0$, so I must keep it, even if I now know $B$ is better than $A$."

  **MARCUS:** I'm saying $B$ isn't better than $A$ *all things considered*. It's only better *ceteris paribus* at the local node. But *ceteris* are not *paribus*. The context includes the future nodes. If choosing $B$ leads to a loop where I lose money, then $B$ is not better than $A$ in the full context. The resolute chooser sees the full context. The myopic chooser—and the sophisticated chooser who uses backward induction—only sees the subtree.

  **ELENA:** Okay, let's push the "full context" claim. This is where the AI alignment crowd gets nervous. You're building an agent, right?
  Suppose your agent is resolute. It commits to Plan$_A$. But suppose the environment changes slightly. Suppose at Node 2, instead of a simple trade, I offer a *Stochastic* trade.
  "Marcus, you have $B$. You can keep $B$. Or, for $\epsilon$, you can take a lottery: 99% chance of $C$, 1% chance of $A$."
  Your cyclic preference says $C \succ B$. Your resolute plan says "Keep $A$ (so don't trade to $B$ in the first place)."
  But what if you *already* traded? Maybe you made a mistake. Or maybe the bookie forced the first trade.
  If you are resolute, you must stick to the plan. But if the plan is now impossible to execute perfectly, does the resolution shatter?
  More importantly: If your preferences are truly cyclic, there is *no* stable plan. Plan$_A$ is dominated by Plan$_B$ (because $B \succ A$). Plan$_B$ is dominated by Plan$_C$. Plan$_C$ is dominated by Plan$_A$.
  If you pick Plan$_A$, you are picking a plan that you *also* deem inferior to Plan$_B$ at $t_0$. You are knowingly choosing an inferior plan. That violates the basic dominance principle.

  **MARCUS:** I deny that Plan$_B$ dominates Plan$_A$ at $t_0$.
  Dominance requires that one option is better in every state of the world. But the "state of the world" includes my future actions.
  If I choose Plan$_A$, my future self keeps $A$. Outcome: $A$.
  If I choose Plan$_B$, my future self (being resolute) keeps $B$. Outcome: $B$.
  Since $A \succ C \succ B \succ A$... wait.
  (He pauses, frowning.)
  Okay. If $C \succ A$ and $B \succ C$ and $A \succ B$... no, that's not the cycle. The cycle is $A \succ B \succ C \succ A$.
  So at $t_0$, I prefer $A$ to $B$. So I prefer Plan$_A$ to Plan$_B$.
  Wait. If I prefer $A$ to $B$, why do I trade $A$ for $B$ at Node 1?

  **ELENA:** (Smiling) Exactly. That's the incoherence.
  At $t_0$: You prefer $A$ to $B$. So you prefer Plan$_A$ to Plan$_B$.
  At Node 1: You prefer $B$ to $A$. So you trade.
  If you are resolute, you force Node 1 to align with $t_0$. So you don't trade.
  But why did you have the preference $B \succ A$ at Node 1 in the first place? If your preferences are context-dependent, fine. But if they are intrinsic properties of the agent, you have a contradiction.
  If the preference $B \succ A$ is real at Node 1, then at $t_0$ you should anticipate it. If you anticipate it, and you have $C \succ A$, you might prefer to enter the loop to get to $C$.
  Let's try Gustafsson's "Long-Run" pump.
  Suppose this isn't a one-off. You face this decision tree every day.
  Day 1: You resolve to keep $A$. You get $A$.
  Day 2: You wake up. Your preferences are still cyclic. $A \succ B \succ C \succ A$.
  But yesterday, you had $A$. Today, do you still prefer Plan$_A$?
  If your preferences are stable, yes.
  But suppose I offer you a "Membership." For a flat fee $F$, I allow you to trade *once* per cycle.
  If you prefer $B$ to $A$, you should pay $F$ to get the option to trade $A \to B$.
  Then you pay $F$ to get the option to trade $B \to C$.
  Then you pay $F$ to get the option to trade $C \to A$.
  You are paying for the *option* to be pumped. A resolute chooser refuses the option. But if $B \succ A$, the option to get $B$ has positive value. By refusing to value the option, you are violating preference theory regarding *freedom of choice*. You are saying "I prefer $B$ to $A$, but I prefer *not having the option to choose $B$* to *having the option to choose $B$*." That's a preference reversal on the menu itself.

  **MARCUS:** (Sighs, rubs his temples) You're hitting on the *value of flexibility*.
  Look, Elena. I'll bite the bullet.
  A resolute chooser *does* prefer not to have the option to trade, even if they prefer the outcome of the trade.
  Why? Because they know their future self is untrustworthy.
  It's like Ulysses and the Sirens. Ulysses prefers to hear the Sirens (Outcome $B$) over being tied up (Outcome $A$) *when he is on the island*. But at $t_0$, he prefers being tied up (Outcome $A$) over hearing the Sirens and crashing (Outcome $C$).
  Wait, that's not cyclic. That's time-inconsistent.
  The cyclic case is harder.
  Okay. Here is my position. The Money Pump argument assumes that *exploitability* is the definition of irrationality.
  I say exploitability is only irrational if the agent *cannot help it*.
  If I can help it by resolving, then I am rational.
  The fact that my preferences are cyclic is a feature of my value system. Maybe I value variety. Maybe $A$ is Coffee, $B$ is Tea, $C$ is Juice. I prefer Coffee to Tea, Tea to Juice, Juice to Coffee depending on what I just had.
  If I know that trading leads to a fee, I resolve to not trade.
  You say I'm violating Dominance because I prefer Plan$_B$ to Plan$_A$ at $t_0$ (since $B \succ A$).
  But I don't. At $t_0$, I evaluate the *consequences* of the plan.
  The consequence of Plan$_B$ is not just $B$. It is $B$ minus the future pumps I will incur because I am the kind of agent who trades for $B$.
  If I am resolute, Plan$_B$ means "Trade to $B$, then stop." Outcome: $B$.
  Plan$_A$ means "Stay at $A$." Outcome: $A$.
  If $A \succ B$ at $t_0$, I pick Plan$_A$.
  The cycle $A \succ B \succ C \succ A$ only manifests *locally*.
  At $t_0$, looking globally, the cycle might collapse.
  If I know $C \succ A$ locally, but choosing $C$ leads to a loop, do I still prefer $C$ globally?
  If I am rational, I should prefer $A$ to $C$ globally, even if I prefer $C$ to $A$ locally.
  So my *global* preferences are transitive ($A \succ B \succ C \succ A$ becomes $A_{global} \succ B_{global} \succ C_{global} \succ A_{global}$... no, that's still cyclic).
  Damn it.

  **ELENA:** You see it. You can't have cyclic local preferences and transitive global preferences if the global outcomes just *are* the local outcomes.
  If Outcome $A$ is Outcome $A$, then $A \succ C$ globally contradicts $C \succ A$ locally unless you're saying the *path* matters.
  If the path matters, you're not a consequentialist. You're adding "didn't get pumped" as a positive attribute of Outcome $A$.
  So Outcome $A$ (via No Trade) is actually a *different outcome* than Outcome $A$ (via Trade Loop).
  Let's call them $A_{clean}$ and $A_{dirty}$.
  If you prefer $A_{clean}$ to $A_{dirty}$, fine.
  But then your preferences aren't cyclic over $A, B, C$. They are over $(A, \text{history})$.
  If you expand the outcome space to include history, you can always make preferences transitive.
  But then the Money Pump argument wasn't about $A, B, C$. It was about the expanded set.
  And if you can expand the set to make them transitive, why not just admit the agent *should* have transitive preferences over the basic outcomes to begin with?
  The AI alignment problem is that we want the agent to maximize *our* utility, not its own "resolute integrity."
  If your agent has cyclic preferences over our goals (Safety, Speed, Cost), and it resolves to stick to Safety, but locally prefers Speed to Safety...
  When the pressure is on, will it resolve? Or will it pump?
  If it resolves, it's ignoring its local gradient. That's hard to code. You have to hard-code the "resolution" mechanism.
  But what determines the resolution?
  If the resolution is chosen based on preferences, and preferences are cyclic, the resolution selection is cyclic.
  I can pump the *selector*.

  **MARCUS:** (Quiet for a moment) You're right about the selector.
  If the mechanism that chooses the plan is itself subject to the cyclic preferences, I'm vulnerable.
  To be truly pump-proof, the resolution mechanism must be *lexically prior* to the preferences.
  It must be a rule: "Always stick to the first plan chosen."
  But why choose that rule?
  If I prefer the rule "Stick to Plan B" over "Stick to Plan A" (because $B \succ A$), I switch rules.
  Then I'm pumped on rules.
  Okay. Here is where I stand.
  The Money Pump argument proves that *if* you maximize expected utility at every node *and* your preferences are cyclic, you lose.
  Resolute Choice proves that *if* you maximize over plans *and* your preferences are cyclic, you might not lose *in the object level trade*.
  But you concede that you might lose on the *meta-level choice of plan*.
  So, is the agent rational?
  I say yes, if the meta-level choice is fixed by something other than preference. By identity. "I am an agent who keeps $A$."
  You say that's irrational because "I am an agent who keeps $A$" is just another state I can be traded out of if I prefer "I am an agent who keeps $B$."

  **ELENA:** Precisely. If your identity is up for grabs, you're pumped. If your identity is fixed, you're not an optimizer, you're a rule-follower.
  For AI alignment, this is the crux.
  Do we want an optimizer? Then it must have transitive preferences, or it dies.
  Or do we want a rule-follower? Then it's not "smart" in the expected-utility sense, it's bounded by deontological constraints.
  The coherence arguments claim that any sufficiently smart optimizer *becomes* an EU maximizer.
  Your resolute chooser is an optimizer that *refuses* to optimize locally.
  That's not a smarter agent. That's a crippled one. It leaves money on the table (the $\epsilon$ gains from trade) to avoid the loop.
  Wait, no. It avoids the $\epsilon$ loss.
  But it also avoids the *gains*. If the loop was profitable (negative fees), the resolute chooser might miss it if they resolve too early.
  Actually, if the loop is profitable, the preferences wouldn't be cyclic in a way that creates a pump. The pump relies on $A \succ B \succ C \succ A$ *and* fees.
  If there are no fees, the loop is harmless.
  The fees make it a loss.
  The resolute chooser avoids the loss. That looks smart.
  But only by violating Separability.
  And if you violate Separability, you can't be represented by a utility function.
  And if you can't be represented by a utility function, the standard convergence theorems don't apply.
  So your agent won't necessarily converge to what we want. It might converge to "Whatever plan it grabbed first."
  Path dependence.

  **MARCUS:** Path dependence is better than death by pumping.
  Look. I'm building this agent. It has to make trade-offs.
  If I enforce transitivity, I might force it to have preferences it shouldn't have.
  If I allow cycles, I risk the pump.
  Resolute choice offers a middle ground: Allow cycles, but enforce resolution.
  You're saying the enforcement mechanism is vulnerable.
  I'm saying I can hard-code the enforcement. "Thou shalt not trade once resolved."
  You can't pump a rock. If I make the resolution mechanism a rock, I'm safe.
  The cost is flexibility.
  The benefit is survival.

  **ELENA:** (Picks up the trade sheet, crumples it slightly)
  Fine. You win on survival. You lose on optimality.
  Your agent won't get pumped. But it also won't learn.
