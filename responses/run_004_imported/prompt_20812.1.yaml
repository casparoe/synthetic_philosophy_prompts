answer: |-
  # The Fault Line in the Fog: Adjudicating the Moral Equality of Combatants

  The traditional doctrine of the Moral Equality of Combatants (MEC), articulated most famously by Michael Walzer, posits a symmetrical moral landscape on the battlefield. Under Walzer's "Independence Thesis," the *jus in bello* (justice in war) is detached from the *jus ad bellum* (justice of war). Consequently, soldiers on both sides possess an equal right to kill one another, provided they observe the rules of engagement. Jeff McMahan's revisionist account has shattered this consensus. By grounding the permission to kill in moral liability rather than institutional status, McMahan argues that combatants fighting for an unjust cause lack the right to kill those justly resisting them, rendering MEC a moral fiction. This essay adjudicates this dispute by engaging with two prominent defenses of MEC: Yitzhak Benbaji's contractarian defense and the epistemic argument regarding soldiers' knowledge. I will argue that while McMahan succeeds in establishing the *deep morality* of war, his dismissal of the pragmatic and relational defenses of MEC is too precipitate. However, accepting McMahan's moral ontology without qualification creates an untenable gap between morality and law. Therefore, the verdict must be to **reconstruct** MEC: we must abandon it as a metaphysical truth about liability but retain it as a regulative legal convention, provided we simultaneously tighten *ad bellum* accountability to reduce the moral burden placed on individual soldiers.

  ### The Revisionist Challenge

  McMahan's revisionism rests on a straightforward analogy between war and interpersonal self-defense. In ordinary morality, an individual does not gain a right to kill simply because they are wearing a uniform or following orders; they gain a right to kill only if their target is morally liable to defensive harm. Liability arises from moral responsibility for an unjust threat. Thus, a soldier fighting in self-defense against aggression poses a "just threat" and is not liable to be killed. Conversely, a soldier fighting to sustain aggression poses an "unjust threat" and is liable. For McMahan, Walzer's MEC is not merely a legal convenience but a profound moral error that equates victims with aggressors. By severing *in bello* permissions from *ad bellum* justice, Walzer grants unjust combatants a moral blank check they do not deserve.

  ### The Contractarian Defense: Benbaji's Convention

  The most robust structural defense of MEC comes from Yitzhak Benbaji, who argues from a contractarian perspective. Benbaji contends that the norms of war should be understood as a convention agreed upon *ex ante* by rational states. Since every state believes its own cause is just, a rule set that conditions permissions on objective justice would be rejected by all parties, as each fears being labeled the "unjust" side and stripped of protections. Instead, states agree to a symmetrical convention: we will treat your soldiers as having equal rights if you treat ours the same. This mutual restraint minimizes the savagery of war, even if it means occasionally protecting those who are objectively morally liable to be killed.

  McMahan rejects this, arguing that conventions cannot override fundamental moral rights. Just as a group of neighbors cannot contract to permit murder, states cannot contract to permit the killing of non-liable persons. For McMahan, the moral truth of liability is a side-constraint that no convention can wash away.

  McMahan's response is morally rigorous but institutionally naive. He treats the laws of war as if they were a direct application of individual morality, rather than a regulatory framework for collective violence. Benbaji correctly identifies that the primary function of the Law of Armed Conflict (LOAC) is harm reduction, not the precise adjudication of individual moral desert. If adopting Revisionism leads to increased brutality because unjust combatants feel they have "nothing to lose" (since they are already moral transgressors), then the contractarian convention serves a vital moral purpose. McMahan's failure here is a category error: he evaluates the *law* of war by the standards of *deep morality*. While Benbaji cannot prove that unjust combatants are *morally innocent*, he successfully demonstrates that treating them *as if* they were equals is the only stable equilibrium for international regulation. McMahan's response fails to account for the systemic consequences of abandoning the convention.

  ### The Epistemic Argument

  The second defense concerns the cognitive limitations of the individual soldier. The epistemic argument posits that ordinary combatants lack the access to intelligence, the historical context, and the philosophical training required to determine the *jus ad bellum* status of their war. If moral permission to kill depends on the objective justice of the cause, and soldiers cannot know the objective justice of the cause, then soldiers cannot know if they are permitted to kill. This creates a paralyzing uncertainty.

  McMahan responds by distinguishing between *justification* and *excuse*. He concedes that soldiers fighting for an unjust cause due to non-culpable ignorance may be *excused* (not blameworthy), but they are not *justified*. They still lack the objective right to kill; they are merely not culpable for exercising a right they do not possess.

  This distinction, while logically sound, is normatively unstable for the agents involved. If a soldier is told, "You are morally liable to be killed because your cause is unjust, even if you don't know it," the normative guidance offered by Revisionism collapses. A moral theory that demands agents act on facts inaccessible to them fails as a guide to action. Furthermore, McMahan's reliance on "culpable ignorance" opens a door he wishes to keep shut. In modern democracies, propaganda is sophisticated and classified information is ubiquitous. If a soldier's ignorance is non-culpable, the practical difference between being "excused" and being "justified" vanishes in the fog of war. McMahan succeeds in establishing that ignorance does not change the *victim's* right not to be killed, but he fails to show how this helps the *agent* navigate the battlefield. The epistemic barrier is not just a practical hurdle; it is a constitutive limit on moral responsibility in collective action.

  ### The Divergence of Morality and Law

  McMahan himself concedes that the "deep morality" of war may diverge from the positive law. He suggests that while unjust combatants are morally liable to be killed, the law might still protect them to ensure compliance. This concession is an attempt to salvage the pragmatic insights of Walzer and Benbaji without surrendering the moral truth of Revisionism.

  However, this divergence creates a dangerous normative schizophrenia. If the law tells soldiers they are equals, but moral philosophers tell them they are murderers, the authority of the law is undermined. Unjust combatants may view the law as a hypocritical sham if they are prosecuted for war crimes while being told their very presence is a moral crime. Conversely, just combatants may feel morally licensed to exceed legal constraints, believing their "deep morality" grants them permissions the law denies.

  This gap is the weak point of the Revisionist project. It risks creating a two-tiered system where the "enlightened" (philosophers and perhaps just leaders) know the truth, while the "instrumental" (soldiers) are fed a "noble lie" of equality. This is unsustainable for a democratic society that demands its soldiers be moral agents, not merely tools.

  ### Verdict: Reconstructing the Equality of Combatants

  Should the Moral Equality of Combatants be abandoned, retained, or reconstructed?

  **MEC must be abandoned as a moral ontology but retained as a legal convention, with a crucial reconstruction of where the moral burden lies.**

  We must abandon MEC as a description of *moral reality*. McMahan is correct: there is no metaphysical magic in a uniform that renders an aggressor the moral equal of a defender. To assert otherwise is to insult the victims of aggression. However, we must retain MEC as a *legal and institutional norm*. Benbaji is correct that symmetrical rules are the only viable mechanism for containing violence in an anarchic international system where *ad bellum* judgment is contested.

  The reconstruction lies in shifting the locus of moral liability. Currently, the "sin" of an unjust war is distributed across the combatants, making every soldier a potential moral target. A reconstructed view concentrates *ad bellum* liability on the political leaders and architects of the war, while granting soldiers a "presumptive immunity" based on their epistemic limitations and civic duty.

  This reconstruction requires three shifts:
  1.  **Legal Symmetry, Moral Asymmetry:** The LOAC should maintain symmetrical protections for all combatants *hors de combat*, but post-war justice mechanisms (reparations, tribunals) must explicitly recognize the asymmetry of the conflict. Unjust combatants should not be prosecuted for mere participation (retaining Benbaji's convention), but their leaders must be.
  2.  **Epistemic Responsibility:** The burden of *ad bellum* judgment must be lifted from the individual soldier and placed on the legislative and executive bodies that authorize force. Soldiers are entitled to a presumption of reasonable belief in the justice of their cause, provided the state has not engaged in systematic deception.
  3.  **Associative Nuance:** While I have focused on Benbaji and the Epistemic argument, Seth Lazar's work on associative duties suggests a middle path. Soldiers have duties to their compatriots that grant them a *pro tanto* permission to fight, even in wars that are not fully just, provided the cause is not egregiously immoral. This reconstructs MEC not as an equality of rights, but as an equality of *constrained permissions* derived from protective duties rather than offensive license.

  In conclusion, McMahan has successfully detonated the philosophical foundations of Walzer's Traditionalism, proving that MEC is morally false. However, in doing so, he has exposed a chasm between moral truth and regulatory feasibility. We cannot build a law of war on a foundation that soldiers cannot access (objective justice) or rules that incentivize total war (denial of symmetry). The solution is not to retreat to Walzer's fiction, nor to march fully with McMahan into a morally stark battlefield. It is to reconstruct a system where the law protects the soldier as an instrument of the state, while the morality of the state is held accountable for the justice of the war itself. We retain the equality of combatants in the trench, so that we may enforce the inequality of aggressors in the courtroom.
