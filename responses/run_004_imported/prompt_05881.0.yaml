answer: |-
  **MEMORANDUM**

  **TO:** Model Risk Committee
  **FROM:** Technical Lead, Model Risk
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Recommendation: Vendor Default-Risk Score Model

  **Recommendation**
  I recommend we **Approve with Conditions**. We will authorize the model for a limited pilot deployment, contingent on three specific governance controls detailed below. This decision acknowledges that the observed disparity is a structural mathematical trade-off, not a correctable data flaw, but requires active management to satisfy our "unjustified impact" policy clause.

  **Technical Context**
  We are facing a known impossibility theorem in algorithmic fairness. When two groups have different base rates of default (which our data confirms), a model cannot simultaneously satisfy *Calibration* (a score means the same risk regardless of group) and *Equalized Odds* (equal false positive rates across groups).
  *   **Vendor Audit:** Confirms Calibration. A score of 700 implies the same default probability for both groups.
  *   **Independent Audit:** Confirms False Positive Rate disparity. Because Group A has a higher base default rate, a risk-averse threshold inevitably rejects more "good" applicants from Group A than Group B.

  This disparity is not a bug fixable with more data; it is a consequence of aligning the model with actual risk prevalence.

  **Rationale for Approval**
  Calibration is a business necessity for solvency. If we force Equalized Odds by adjusting thresholds to lower false rejections for Group A, we must either approve riskier applicants (increasing default losses) or reject more applicants from Group B (creating reverse disparity). Given our fiduciary duty and regulatory requirement to lend safely, maintaining calibration is the primary justification for the disparate impact.

  **Conditions for Approval**
  1.  **Business Necessity Memo:** Legal and Risk must co-sign a document explicitly articulating why calibration was prioritized over error-rate parity, establishing the "justification" for the disparate impact under ECOO/Reg B.
  2.  **Threshold Sensitivity Analysis:** Before full launch, Vendor must demonstrate whether slight threshold adjustments can reduce the False Positive Rate disparity without violating our risk tolerance limits.
  3.  **Monitoring & Re-audit:** We will monitor the False Positive Rate disparity quarterly. If the ratio exceeds 2.5x, the model is suspended. A full independent re-audit is required in **6 months**.

  **Strongest Argument for Rejection (Opposing View)**
  The Committee members advocating to pull the model argue that "mathematical inevitability" is not a legal defense. Under fair lending laws, if a practice has a disparate impact, the burden is on us to prove no less discriminatory alternative exists. They argue that by accepting the vendor's default threshold, we are externalizing the cost of risk onto a protected class: "good" applicants in Group A are systematically denied access to capital at twice the rate of their peers in Group B. From this viewpoint, calibration protects the *bank's* balance sheet, while error-rate parity protects the *applicant's* opportunity. Prioritizing the former over the latter without exploring group-specific thresholds could be deemed an "unjustified" policy choice, exposing the firm to significant litigation and reputational risk regardless of statistical validity.

  **Next Steps**
  If approved, Legal to draft Business Necessity Memo by Friday. Vendor to submit Threshold Sensitivity Analysis by next Tuesday's meeting.
