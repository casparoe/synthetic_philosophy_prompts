          *   *Refining for laypeople:* Don't use the word "quus" immediately. Explain the *idea* of a tricky rule. "I promise to love you... *unless*."
          *   *Better:* Use the "quus" term but define it in context so philosophers nod and others laugh at the absurdity.
      *   **The Turn (The Skeptical Solution):** This is the hard part. How to make "community correction" sound romantic?
          *   *Concept:* We can't guarantee our future selves. We need help.
          *   *Metaphor:* The vow isn't a magic spell; it's a commitment to let others hold us accountable.
          *   *Connection:* The guests *are* the community. Their presence isn't just witness; it's participation in the "rule-following."
      *   **The Climax/Emotional Core:** What does this mean for the couple? It means they don't have to be perfect alone. They have us.
      *   **Closing:** Raise a glass. Traditional wish for happiness.

  4.  **Refining the Tone:**
      *   *Avoid:* "As Kripke argues in *Wittgenstein on Rules and Private Language*..." (Too academic).
      *   *Use:* "There's this idea..." or "My sister taught me..."
