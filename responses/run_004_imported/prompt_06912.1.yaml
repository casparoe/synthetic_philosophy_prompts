answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Sister's Name]'s younger sibling.

  Growing up, [Sister's Name] was always the one who cared about getting things right. If we were playing a game, she was the one reading the rulebook. If we were arguing, she was the one pointing out logical fallacies. It's no surprise she ended up with a PhD in philosophy. And it's definitely no surprise she married [Partner's Name], who is brave enough to discuss semantics over breakfast.

  Since so many people in this room know [Sister's Name]'s work, I felt I had to acknowledge it. But I also know that for our parents, and for [Partner's Name]'s family, a wedding toast shouldn't feel like a lecture. So I promise to keep this brief.

  However, there is one philosophical problem that I think is actually perfect for today. It's about rules, and specifically, about how we know we're following the same one.

  There's a famous thought experiment about a math function called "plus." We all know it. Two plus two is four. But a philosopher named Saul Kripke pointed out a weird puzzle. He said: How do I know that when you say "plus," you don't actually mean "quus"?

  "Quus" is a deviant function. It works exactly like "plus" for every number you've ever used before. But after a certain point—say, after the number 57—"quus" stops adding and just equals 5. You've never calculated 58 plus 59 before, so there's no fact about your past behavior that proves you mean "plus" and not "quus."

  I bring this up because marriage is essentially a vow to follow a rule into the future. When you stand at the altar and say, "I promise to love you," you are making a claim about how you will act in cases you haven't encountered yet.

  And here is the uncomfortable question: How do you know that what you mean by "love" today is the same thing you'll mean by "love" in thirty years?

  How do I know my sister doesn't mean "love-quus"? *I promise to love you, to support you, to cherish you... until the kids leave the house, or until the stock market crashes, or until someone more interesting comes along... and then, quus.*

  There is no fact inside her head, no feeling of certainty she has right now, that can guarantee she won't deviate from the rule when life gets hard. No internal mental state can lock in the future.

  If this were just a math problem, it would be terrifying. But for a marriage, this is actually where the wisdom lies.

  Kripke's solution to this paradox wasn't to find a magic fact inside our heads. He argued that meaning isn't private. It's public. We know we are following the rule correctly because we are part of a community that watches us, corrects us, and remembers what the rule is supposed to be.

  We don't secure the meaning of "plus" alone; we secure it together.

  And that is exactly what this room is for.

  [Sister's Name] and [Partner's Name], you cannot secure this vow by yourselves. You cannot rely on how you feel tonight, because feelings are private, and they change. You cannot rely on your own memory of this day, because memory is fallible.

  You secure this promise by letting us help you.

  When things are difficult, and the definition of "cherish" feels slippery, you look to us. We are the community that witnessed this vow. We are the ones who will remind you of what you meant. When you drift toward "quus," we will be here to gently nudge you back to "plus."

  To our parents, to the friends here tonight: Our job isn't just to celebrate the wedding. It's to uphold the meaning of the vow. It's to be the external memory of this love. It's to create a practice of support so strong that the rule becomes unbreakable.

  So, [Sister's Name], [Partner's Name], my wish for you is not that you never face the paradox of the future. My wish is that you never have to face it alone.

  May your "plus" always be "plus." And may you always have enough friends around you to make sure of it.

  Please raise your glasses. To the bride and groom, and to the community that holds them both.
