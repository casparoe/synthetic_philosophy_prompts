      *   **Core Question:** Would Neurath see emoji as a natural extension of his project or a violation of his core principles?
      *   **Tone:** Intellectual, engaging, slightly conversational ("Quick one," "rabbit hole"), but rigorous regarding historical accuracy.

  2.  **Recall/Verify Neurath's Isotype Principles:**
