  2.  **Deconstruct the Reference Class Problem (RCP):**
      *   *Origin:* Reichenbach (frequentist tradition). Probability is defined relative to a class. Single-case probability requires picking a class.
      *   *The Issue:* An individual belongs to infinite classes. Different classes yield different frequencies (probabilities). Which one is the "true" probability?
      *   *User's Proposed Solution:* Maximal specificity. Use all available relevant features.
      *   *Philosophical Counter-arguments:*
          1.  **The "Single Case" Limit:** If you condition on *everything*, the class size becomes 1 (just the individual). Frequency becomes 0 or 1. Probability vanishes.
          2.  **Relevance vs. Noise:** Not all features are causally relevant. Adding irrelevant features narrows the class but increases variance/uncertainty without improving accuracy (overfitting in ML terms).
          3.  **The Problem of "Relevance":** How do you know which features are relevant *before* you assign the probability? This is circular.
          4.  **Conflicting Principles:** Principle of Narrowest Class vs. Principle of Maximum Entropy (or others).
          5.  **Epistemic vs. Ontic:** Is probability about the world (propensity/frequency) or our knowledge (Bayesian)? RCP hits frequentists hardest, but Bayesians have their own version (prior selection).

  3.  **Bridge the Gap (Engineering vs. Philosophy):**
      *   *Engineering Goal:* Predictive accuracy (minimize loss function). If adding features improves AUC/log-loss, do it.
