answer: |-
  The dust in the High Registry of Ostral did not smell of age, but of burnt sugar and panic. It was the scent of the Directorate's archives being shredded, saved, or sorted. Elias Vane, a Senior Clerk of the Third Grade, sat at a desk that had belonged to three regimes in twenty years. On his blotter lay File 89-B: *The State vs. Mara Kovic.*

  Mara sat in the holding cell below, accused of the death of her brother, Kael. Under the Directorate's Resource Allocation Decree 44, Mara had reported Kael for "concealing grain." Kael had been sent to the Northern Reclamation Camp. He had not returned. Now the Directorate was gone, replaced by the Provisional Council, and the Council wanted to know if Mara was a criminal or a citizen who followed the rules.

  Elias's job was not to judge guilt, but to determine the status of the rule Mara had invoked. If Decree 44 was valid law, Mara had committed no crime under the system then in place. To punish her would require the Provisional Council to pass a retroactive statute, admitting that they were punishing an act that was legal when committed. If Decree 44 was null *ab initio*—never law at all—then Mara had no legal shield. She was simply a woman who had sent her brother to die.

  Elias opened the file. Decree 44 was a single sheet of onion skin, typewritten. It mandated that all citizens report grain hoarding exceeding fifty kilos. The penalty for failure to report was imprisonment; the penalty for false reporting was ostensibly the same, though rarely enforced.

  He turned to the addendums. Here lay the Fullerian nightmare. Addendum A, handwritten in red ink, lowered the threshold to thirty kilos. Addendum B, stapled loosely, exempted "Party Functionaries." Addendum C, a memo circulated only to block wardens, stated that reports should be anonymous, yet required the informant's signature for "verification."

  Elias rubbed his temples. Hart's voice seemed to whisper from the stacks: *It was enforced. The courts recognized it. People ordered their lives by it, however terribly. To say it was not law is a lie. It was law. If you wish to punish the woman, make a new law and own the retroactivity. Do not corrupt the concept of law to soothe your conscience.*

  There was evidence that Decree 44 functioned as law. Kael had been processed. The camps had quotas. The machinery of the state had ground forward based on this paper. Mara had relied on the text as written. She had filled out the form in triplicate. She had followed the procedure. To claim the decree was void was to ignore the reality that, at the time, the Directorate's will was the only reality that mattered.

  But then Elias looked at the dates. Decree 44 was dated March 1st. Addendum A was dated February 28th. The exemption for Party Functionaries was never published, only whispered. The definition of "grain" had shifted from "wheat and rye" to "all caloric solids" without notice in the middle of a trial Kael had attended as a witness.

  Fuller's counter-argument rose like a chill in the room. *Law requires an inner morality. It must be public, consistent, and possible to follow. This was not law; it was a command backed by violence. A system that rules by secret, contradictory decrees forfeits the claim to legality. Mara did not break a law; she participated in a racket.*

  If Elias marked the file "Valid," the Provisional Council would have to draft a retroactive bill. It would be honest, but politically difficult. It would admit that the new government was punishing legal conduct. It would uphold the separation of law and morality, but it might let a monster walk free on a technicality.

  If he marked it "Void," the path was smoother. Mara could be tried for manslaughter under common moral principles. The Directorate's statutes would be swept away as garbage. But it risked a different danger: if the new government could simply declare past laws "not law" because they were wicked, what stopped them from doing the same to future inconvenient statutes? It made legality dependent on the moral judgment of the current clerk.

  Elias picked up his stamp. One side read *ADMISIBLE (LAW OF THE TIME)*. The other read *NULL (NO LEGAL FORCE)*.

  He looked at Mara's statement. She wrote that she hated Kael. He had inherited their father's mill; she had received nothing. The grain report was signed the day after the inheritance dispute. She had used Decree 44 as a weapon, yes. But the gun was provided by the State.

  If he chose *Null*, he affirmed that morality is the root of law. He protected the future from the past's poison. But he lied about the past. The Directorate *did* rule. Its commands *were* obeyed.

  If he chose *Admissible*, he affirmed that law is a social fact, separate from justice. He told the truth about the past. But he forced the new government to stain its hands with retroactivity to achieve justice.

  Elias dipped his pen in the inkwell. The new Council wanted speed. They wanted the wreckage cleared. They wanted to tell the people that the Directorate was a criminal enterprise, not a government. To do that, Decree 44 could not be a law. It had to be a crime.

  But Elias thought of the future. He thought of a clerk ten years from now, sitting at this desk, looking at a statute passed by the Provisional Council that was vague, secret, and cruel. If Elias set the precedent that "unjust rules are not laws," that future clerk could strike down the Provisional Council's own work. If he set the precedent that "law is law until changed," that future clerk would be forced to demand honest legislation.

  He looked at the contradictory dates on Decree 44. The system was broken. It was not just evil; it was incoherent. A citizen could not know what the law was.

  Elias lifted the stamp. He did not slam it down. He pressed it firmly, evenly, ensuring the ink would take.

  He reached for the memorandum pad to explain his decision. He began to write: *"Regarding the status of Directive 44: While the Directive possessed the form of enactment, its administration lacked the requisite publicity and consistency to guide conduct..."*

  He paused. He could finish the sentence by saying *"...therefore it was never law."* (Fuller).

  Or he could write: *"...therefore, while it was law, its application in this specific instance violates the fundamental principles of the new Republic, requiring retroactive intervention."* (Hart).

  Elias looked at the two stamps. He put the stamp down. He took a fresh sheet of paper. He would not stamp it. He would write a opinion. He would argue that the contradiction in the dates made compliance impossible, rendering the decree void for uncertainty, not for wickedness. It was a procedural nullification that achieved a moral end without explicitly denying the nature of the old regime's power.

  It was a compromise. Hart would call it dishonest. Fuller would call it prudent.

  Elias began to write, the scratch of the nib the only sound in the silent archive, deciding the fate of a woman and the soul of a nation, one word at a time.
