      *   **The Audience:** 50% Philosophy Department (will notice philosophical inaccuracies or betrayals of her life's work), 50% Family (want emotional resonance, assurance that her love mattered and had causal efficacy).
      *   **Constraints:** ~10 minutes spoken (approx. 1000-1300 words), must avoid Dualism ("spirit watches over us"), must avoid Eliminativism ("just neurons"), must honor her specific philosophical stance without getting bogged down in jargon, must be emotionally moving.
      *   **Goal:** Write a eulogy that embodies her philosophy without lecturing, validating her life's work while comforting the family.

  2.  **Deconstruct the Philosophy (The "Subset View"):**
      *   *Problem:* If the physical causes everything, what room is left for the mental? (Causal Exclusion).
      *   *Her Solution:* Mental properties aren't separate rivals to physical properties. They are a *subset* of the physical realizer's powers.
      *   *Implication:* No competition. The mental *is* the physical, but described in a way that highlights specific powers. It's not "ghost in the machine," nor is it "machine only, ghost is fake." It's "the machine's capacity to love *is* real."
      *   *The User's Doubt:* Is this just epiphenomenalism? (Does it actually *do* anything?)
      *   *The Eulogy's Task:* Show, don't just tell, that her love *did* things. Prove the efficacy of the mental through the memory of her life.

  3.  **Determine the Tone:**
      *   Respectful, intellectual but accessible, warm, firm in its conviction (mirroring her stubbornness in debate).
      *   Needs to bridge the gap between the abstract (causal powers) and the concrete (raising a child, teaching students).

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, the setting, and the unique position of the speaker. Acknowledge the two "crowds" in the room implicitly.
      *   **The Philosophy (The Hard Part):** How to explain the Subset View without sounding like a lecture? Use metaphors. The key is *no competition*. The mental doesn't fight the physical; it rides with it.
      *   **Addressing the Doubt (The User & Dee's Argument):** Don't resolve the technical debate, but resolve the *existential* worry. Did her love *do* anything? Yes.
      *   **Personal Memories:** Need concrete examples of her causal impact. Teaching, parenting, kindness. Show the mental property (love) manifesting through physical action.
      *   **The Conclusion:** Bring it back to the "Subset View." Her powers are now a subset of the world she left behind. She is realized in us.

  5.  **Navigating the Philosophical Minefield:**
      *   *Avoid Dualism:* Don't say she's "looking down." Say she persists in her effects.
      *   *Avoid Eliminativism:* Don't say "her brain stopped." Say "her mind shaped us."
      *   *Honor the Subset View:* Emphasize that her mental states (love, wisdom) *were* causal powers, not just byproducts. They didn't compete with physics; they utilized it.

  6.  **Drafting - Iteration 1 (Mental Outline):**
