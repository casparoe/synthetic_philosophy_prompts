  10. **Final Polish:** Check for dualist slips ("she's in a better place," "her spirit"). Ensure physicalist language is respectful ("her body," "her actions," "her impact"). Make sure the emotional arc lands. (Self-Correction: Make sure not to sound *too* cold/analytical. The philosophy must serve the grief, not suppress it.)

  11. **Final Review against constraints:**
