answer: |-
  Thank you all for being here.

  For those of you who know me, you know I'm standing here trying to do something that would have made my mom smile. She spent thirty years teaching people how to think precisely about difficult things. And now, I have to speak precisely about something that feels impossible.

  Half of you are her family. You know her as the woman who made the best lasagna, who remembered every birthday, whose hug could stop a panic attack in its tracks. You want to know that her love was real, and that it mattered.

  The other half of you are her colleagues and students. You know her as the philosopher who stood in the breach against Jaegwon Kim. You know she was a non-reductive physicalist. You know she spent three decades defending the "Subset View" against the charge of causal exclusion.

  And if you know her work, you know the worry. You know the argument my friend Dee and I had for two hours after the wake. The worry is this: If the mental is just a subset of the physical, if my mom's love was realized entirely by physical processes in her brain and body, did her love actually *do* anything? Or was it just a shadow cast by the neurons? Was she, as the critics claimed, an epiphenomenalist in disguise?

  I've spent the last two weeks trying to settle that argument. And I think I finally have an answer. But not one I could give in a seminar room. I found it in the way this room feels right now.

  My mother did not believe in ghosts. She did not believe that the mind was a separate substance floating above the machinery of the world. She would not want me to tell you that her spirit is watching over us, because she didn't think the mind worked by magic.

  But she also did not believe that love was a story we tell ourselves to make the biology palatable. She did not believe that "she" was just a collection of atoms and that the person we knew was an illusion. She fought that idea every day of her career.

  Her position—the one she defended with such ferocity—was that there is no competition between the physical and the mental. They are not two rivals fighting over who gets to move the arm, or who gets to write the letter, or who gets to hold the child.

  She believed that the causal powers of the mental are a subset of the causal powers of the physical. That sounds technical. But what it means, in this room, today, is this: Her love did not have to fight against physics to be real. It rode on physics. It utilized physics. It was realized *in* the physical world, which is exactly why it could change the physical world.

  When I was seven and I broke my arm, it was physical nerves that fired in her brain that made her pick up the phone. But it was *worry* that caused the nerves to fire. It was *love* that drove the hand.

  If you are a dualist, you say the love pushed the nerves from the outside. If you are an eliminativist, you say the love wasn't there, only the nerves were. My mom said: The love *is* the nerves, organized in a specific way that has the power to comfort, to teach, to build, and to endure. And because those powers are a subset of the physical, they are guaranteed to work. They are guaranteed to have effects.

  So, to the worry that Dee and I wrestled with: Did her mental states add anything?

  Look at me. Look at her students. Look at the way her colleagues are speaking to each other today, softer than usual, kinder. Look at the way her garden is still growing because she taught us how to plant it.

  Her mental properties—her wisdom, her patience, her stubbornness, her love—had causal powers. We know this because we are living in the world that those powers shaped. If her love had been epiphenomenal, if it had been just a shadow, it would not have left this much of a mark. A shadow cannot build a life. A shadow cannot raise a child. A shadow cannot tenure a department.

  She mattered. Not despite the physics, but *through* it.

  She taught me that to be real is to have a causal impact on the world. And by that definition, she is as real as anything I have ever known.

  There is a temptation, in grief, to want to transcend the physical. To wish she were somewhere else, somewhere non-physical. But I think she would want us to stay here. She would want us to recognize that her causal powers haven't vanished. They have been transferred.

  The Subset View implies that realization is a relationship. Her mind was realized in her body for forty years. But her mind was also realized in her work, in her letters, in her arguments, and in me.

  I am a physical system. But I am a physical system that has been shaped by her. Her mental properties are now realized, in part, in my actions. When I am patient with my own children because she was patient with me, that is her mental property having a causal effect, through a subset of physical powers that she helped configure.

  She is not gone in the way that a lightbulb goes out when the switch is flipped. She is gone in the way that a teacher leaves the classroom after the lesson is learned. The teacher leaves, but the lesson remains, causal and active in the minds of the students.

  So, I am not going to promise you that she is in a better place. I don't know where that is, and neither did she.

  I am going to promise you that she is in this place. She is in the way we treat each other today. She is in the arguments we will continue to have about what matters and why. She is in the physical reality of this room, which is heavier, and sadder, and more full of love than it would have been without her.

  She spent her life proving that the mind is not a ghost, and that it is not a lie. It is a force. It is a subset of the world's power to change itself.

  Mom, you won the argument. Not because you convinced Jaegwon Kim, but because you convinced us. You convinced us that our love is not a side effect. It is a cause. It is the cause of almost everything good that happens in this room.

  Thank you for the leverage. Thank you for the power. We will take it from here.
