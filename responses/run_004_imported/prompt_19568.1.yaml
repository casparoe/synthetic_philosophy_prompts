answer: |-
  You have put your finger on one of the oldest and most difficult problems in political philosophy and governance. It is known as **"The Boundary Problem"** (or sometimes the *Constituency Problem*).

  The question you asked—"Who belongs in the vote?"—cannot be answered by a vote itself without circular reasoning, exactly as you observed. If only the current insiders decide who the future insiders are, the boundary is fixed by the status quo, not by principle. Political theorists like Robert Dahl and Frederick Whelan have argued that there is no strictly procedural way to solve this; you cannot use democracy to define the demos without already assuming a demos.

  However, while there is no *procedural* magic trick, there is a **principled framework** based on the distinction between different *types* of authority. The dispute in your lane is stuck because everyone is treating "the vote" as a single monolithic block. It is not.

  To bring a genuine answer to your meeting, you need to argue for **Decoupled Authority**. Here is the principled breakdown of why the current impasse is wrong and how authority should actually be distributed.

  ### 1. The Two Conflicting Principles
  Your neighbors are arguing past each other because they are invoking two different, valid ethical principles that apply to different aspects of the project.

  *   **The Principle of Contribution (Group A's stance):** Those who bear the cost should control the resource. This is the logic of contract and property. If I pay for a dinner, I choose the restaurant.
  *   **The Principle of Affected Interests (Group B's stance):** Those who bear the consequences should have a voice in the decision. This is the logic of tort law and democratic justice. If your dinner creates smoke that chokes me, I get a say in whether you light the cigar.

  The error in your neighbors' logic is assuming these two principles must result in the same voting list for every question. They do not.

  ### 2. The Principled Solution: Decoupling the Vote
  There is a principled way to resolve this without resorting to raw power. You must separate the decision into two distinct categories: **Financial/Construction Authority** and **Impact/Mitigation Authority.**

  **A. Financial & Construction Authority (Group A only)**
  *   **Question:** How much money is spent? Who pays? Is the project financially viable?
  *   **Principle:** *Quid Pro Quo.*
  *   **Who Votes:** Only the four paying households.
  *   **Why:** Group B is not contributing capital. It violates the principle of contribution to force Group A to spend money they don't want to spend, or to give Group B veto power over the *existence* of the project based on budget. Group A owns the financial risk; therefore, they own the financial decision.

  **B. Impact & Interface Authority (Group A + Group B)**
  *   **Question:** Where do lights point? Are there noise barriers? How close does the pavement come to Property B? What are the rules on idling or guest parking that affects Property B's privacy?
  *   **Principle:** *Negative Externalities.*
  *   **Who Votes:** The four paying households **plus** the two affected households.
  *   **Why:** This is where Group A's property rights end and Group B's rights begin. In law and ethics, you do not have the right to use your property in a way that creates a "nuisance" (excessive noise, light, loss of privacy) for another. Because Group B is absorbing the "cost" of the externalities (noise, light, privacy), they have a vested property interest in the *design* of the interface, even if they have no interest in the *funding*.

  ### 3. Addressing the Procedural Paradox
  You noted that holding a preliminary vote to decide who votes is circular. You are correct. That maneuver was logically invalid.

  The principled way to establish the voting boundary is not by voting, but by **mapping the harm.**
  *   If a decision variable (e.g., "height of the fence") imposes a cost primarily on the payers, the payers decide.
  *   If a decision variable (e.g., "direction of streetlights") imposes a cost primarily on the non-paying neighbors, the neighbors must have concurrence.

  This is not a compromise; it is a recognition of distinct property rights. Group A has the right to develop their land. Group B has the right to enjoy their land without unreasonable interference. Where those rights intersect, both parties must agree.

  ### 4. Why This Isn't Just "Bargaining Power"
  If you frame this as "Group B wants power, Group A wants control," it becomes a contest of strength. But if you frame it as **"Jurisdiction over Harm,"** it becomes a matter of justice.

  If Group A retains total control over design, they are effectively exercising **eminent domain** over Group B's peace and privacy without compensation. They are privatizing the benefit (access to the new lot) and socializing the cost (noise/light to Group B).

  The principled stance is that **authority must be proportional to the type of burden borne.**
  *   Burden of Cost → Authority over Budget.
  *   Burden of Nuisance → Authority over Mitigation.

  ### How to Present This at the Meeting
  Do not propose a compromise (e.g., "Let Group B have one vote"). Instead, propose a **Charter of Competence.**

  Suggest that the group adopt a written agreement that explicitly defines which decisions require unanimity among *all six* households versus which require only a majority of the *four* payers.

  *   **Payers Only:** Total budget, choice of contractor, timeline of construction.
  *   **All Six Households:** Placement of lighting, height/location of barriers, rules regarding idling/engine noise, placement of gates relative to Group B's windows.

  **The Bottom Line:**
  You asked if there is a principled way or if it is just power. The answer is: **It is power, but principle dictates how that power should be legitimized.**

  If Group A refuses to acknowledge Group B's right to vote on *impact*, they are admitting that their project relies on imposing costs on others without consent. That is not a property right; that is a nuisance. By offering Group B a vote specifically on the *externalities*, Group A protects their right to build while respecting Group B's right to exist.

  If Group A rejects this distinction, they are not defending a principle of "payment"; they are asserting a principle of "might makes right." Pointing this out clearly often shifts the dynamic, because most people want to see themselves as acting principled, not merely powerful.
