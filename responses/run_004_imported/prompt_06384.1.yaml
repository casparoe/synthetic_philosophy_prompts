          *   *Follow-up:* If it's just a check on sin, does that make all regimes equally illegitimate/legitimate?
      *   *Q3 (Force and Justice):* Move beyond the soundbite. What is the *mechanism*?
      *   *Q4 (Custom/Geography):* **Required.** Relativism vs. Inaccessibility.
