answer: |-
  The readout on the console blinked amber. *Surplus Detected: 4.2 Petajoules.*

  Elara sat back in the command chair of Outpost 734, the leather creaking in the silence. Outside the thick quartz viewport, the nebula swirled, a bruise of purple and gas against the black. She was three thousand light-years from the nearest inhabited system. By the time a signal reached them, she would be dust. By the time a ship arrived, she would be history.

  She was also dying. The radiation sickness was a slow creep in her marrow, invisible but absolute. The outpost's life-support systems could synthesize the retrovirals needed to halt it, but the energy cost was prohibitive. It would drain the reserves dry within a year.

  Unless she used the Surplus.

  If she routed the 4.2 Petajoules into the local synthesizers, she could live another forty years. Comfortably. Alone, but alive.

  Or, she could route the Surplus into the Deep Field Stabilizer.

  The Stabilizer did nothing for her. It emitted a low-frequency correction pulse into the local spacetime metric. It was a maintenance task, theoretically unnecessary for a single outpost. But the theory she had studied at the Academy—the Evidential Cooperation in Large Worlds hypothesis—suggested otherwise.

  "If the universe is sufficiently large," her old professor had said, pacing the lecture hall, "then there are agents, identical or near-identical to you, facing identical or near-identical choices. You cannot talk to them. You cannot see them. Causality does not bridge the gap. But *logic* does."

  Elara stared at the two routing options on the screen.

  **OPTION A: LOCAL SUSTENANCE.**
  **OPTION B: FIELD STABILIZATION.**

  Under Causal Decision Theory, the choice was trivial. Her action here could not change what a copy of herself did in the Andromeda galaxy. Their decisions were spacelike separated. She should take the energy. She should live. To do otherwise was superstition, a magical belief that her hand movement moved a lever on a world she would never visit.

  But Elara didn't believe the universe was small. She believed in the Infinity Assumption. If space was infinite, or even just vast enough, there wasn't just one Elara. There were many. Not clones, necessarily, but agents with the same source code. The same upbringing, the same training, the same moment of crisis.

  If she chose Option A, she was casting a vote for the algorithm *'Self-Preservation at Cost of Commons.'*
  If she chose Option B, she was casting a vote for the algorithm *'Cooperation at Cost of Self.'*

  She wasn't trying to *cause* the other Elaras to cooperate. She was trying to *be* the evidence that they had.

  "If I am the kind of person who defects," she whispered to the empty room, "then in a large enough world, the kind of person who defects wins everywhere, and the commons collapses. If I am the kind of person who cooperates, then the cooperators win everywhere."

  It was a Newcomb problem without a predictor. The predictor was the structure of reality itself.

  Her hands hovered over the haptic interface. Her chest tightened, a familiar ache. Forty years. She could watch the nebula shift. She could write memoirs. She could solve the equations that had plagued her for a decade. She could *be*.

  If she chose Option B, the life-support reserves would revert to baseline. The retrovirals would stop synthesizing after five years. She would die in her sleep, likely within the decade.

  And for what? A stabilized field? A theoretical benefit to a civilization of "copies" she would never meet?

  "It's not about the benefit to me," she said, correcting herself. "It's about the benefit to *us*."

  The *us* was the reference class. All agents capable of understanding ECL. All agents facing the Surplus Anomaly.

  If the reference class was small, she was a fool. If she sacrificed her life for a handful of other agents who might not even exist, it was a waste. But if the reference class was large—if there were billions of outposts, billions of Elaras—then the aggregate value of a stabilized universe outweighed the singular value of her forty years.

  *Expected Value = (Probability of Large World) × (Number of Copies) × (Value of Cooperation).*

  The math held. But the math didn't account for the fear. The fear was biological. The fear was causal. The fear knew that when she stopped breathing, she stopped breathing, regardless of what happened in a galaxy ten billion light-years away.

  She thought about the other Elaras. Were they scared? Was there an Elara in a spiral arm of a different galaxy looking at a blue sun instead of a purple nebula? Was there an Elara who was an AI, running on silicon instead of carbon, facing the same logical gate?

  If she defected, she was telling them it was safe to defect. She was breaking the handshake.
  If she cooperated, she was completing the circuit.

  "It's just inference," she said. Her voice sounded thin. "I'm just updating the probability distribution."

  But it felt like prayer.

  She closed her eyes. She imagined the web of decision-points across the cosmos. A vast, invisible lattice of moments like this one. In some nodes, the light went out. In others, it stayed on. She wanted to be in the cluster where the lights stayed on, even if her own bulb had to burn out to wire the connection.

  She wasn't doing this to *make* them cooperate. She was doing this because if they *were* cooperating, she would have to be one of them. To be a cooperator and defect would be a contradiction in her own identity. She had to be consistent with the world she wanted to inhabit.

  The ache in her chest spiked. Time was wasting. The Surplus would dissipate in minutes if not routed.

  Elara opened her eyes. She didn't feel noble. She felt terrified. She felt like she was stepping off a cliff, trusting that the concept of 'ground' was more real than the sensation of falling.

  She moved her hand.

  She bypassed the life-support routing. She keyed the command for the Deep Field Stabilizer.

  *EXECUTE.*

  The hum of the station changed pitch. A deep thrum vibrated through the floor plates as the energy surged into the emitters. The amber light on the console turned green. *Stabilization Active.*

  On the medical monitor, the projected lifespan counter ticked down. *40 Years* vanished. *5 Years* appeared.

  She sat back.

  Nothing happened.

  The nebula didn't glow brighter. No voice spoke from the void. No sudden warmth filled the room. There was no confirmation signal. There was no way to know if, right now, a billion other Elaras had made the same choice. There was no way to know if the universe was actually large enough for her sacrifice to matter.

  For all she knew, she was the only one. For all she knew, the universe was empty save for her, and she had just thrown away forty years for a ghost.

  Or, for all she knew, a trillion grids had stabilized in the last second, preventing a cascade of cosmic decay that would have wiped out civilizations she would never name.

  Elara stood up and walked to the viewport. She placed her hand against the cold quartz.

  "I hope you're out there," she said softly.

  She watched the purple gas swirl, indifferent and beautiful. She would never know the answer. She would die wondering if she had saved the world or wasted her life. The ambiguity hung in the air, heavy and absolute.

  She turned away from the window and began to make tea. It was a small thing, a local thing. But as the water heated, she felt a strange, quiet solidarity with the silence. She had cast her vote. The counting was up to the universe.
