prompt: |-
  Write a short story built around evidential cooperation in large worlds (ECL) -- the decision-theory idea that if the universe or multiverse is big enough, theres almost certainly a huge population of agents out there who you'll never meet, never causally affect, and never get a signal from, but who think enough like you that you can still "cooperate" with them, just by choosing to act like the kind of agent you'd want them to be. No telepathy, no messages, no shared cause allowed -- whatever cooperation happens has to run entirely on that inference, Newcomb-style. Bonus points if your character has to make a real, costly choice on this basis and the story never confirms whether it actually paid off.
reasoning: |-
  Here's a thinking process that leads to the story above:

  1.  **Analyze the Request:**
      *   **Core Concept:** Evidential Cooperation in Large Worlds (ECL). This is a niche decision theory concept. It posits that in a sufficiently large universe (or multiverse), there are likely many copies or near-copies of you (or agents with similar decision algorithms). Even if you can't communicate or causally interact with them, your decision provides *evidence* about what they decide. Therefore, you should act in a way that you wish *they* were acting, to maximize the collective good of all "copies."
      *   **Constraints:** No telepathy, no messages, no shared causal past (beyond the initial conditions of the universe). The cooperation is purely inferential/Newcomb-like.
      *   **Narrative Requirement:** A short story.
      *   **Key Plot Point:** The character must make a real, costly choice based on this theory.
      *   **Ending Constraint:** The story must *not* confirm whether the choice paid off. It must remain ambiguous/epistemically humble.

  2.  **Brainstorming the Setting and Conflict:**
      *   *Setting:* Needs to feel vast to justify the "Large World" aspect. A spacefaring civilization or a solitary outpost at the edge of known space works well. Let's go with a solitary researcher on a deep-space station. It isolates the character, emphasizing the lack of causal contact.
      *   *Conflict:* A resource allocation problem. A classic Prisoner's Dilemma structure but scaled up. The character has a limited resource (energy, computing power, money) that can be used for local benefit or "global" benefit.
      *   *The "Cooperation":* If the character sacrifices local gain for a diffuse good, they infer that their "copies" elsewhere do the same. If everyone defects, everyone loses. If everyone cooperates, everyone wins (in aggregate), even if no one knows who did what.
      *   *The Cost:* It needs to be personal. Maybe saving a loved one vs. helping strangers? Or career advancement vs. altruism? Let's make it about a cure/treatment. A rare disease affecting the protagonist vs. funding a universal preventative measure that helps "people like them" across the cosmos. Actually, let's make it more abstract but tangible. Energy.
      *   *Refined Idea:* The protagonist, Elara, manages a high-energy beacon or a computational node. She has a surplus. She can use it to extend her own life/support (local defect) or broadcast a specific algorithmic pattern that aids navigation/safety for others (global cooperate). But wait, ECL isn't about broadcasting. Broadcasting is causal. ECL is about *decision correlation*.
      *   *Better Idea:* The "Charity Problem." Elara has a windfall of credits. She can buy a life-extension treatment for herself (high probability of success for *her*), or she can donate to a fund that supports a specific type of ethical AI alignment research. Why AI alignment? Because AI agents in other parts of the universe might be running similar decision algorithms. If she donates, she signals to her "copies" (other humans/AIs making similar calculations) to donate. If enough copies donate, the aggregate good is massive. If she keeps the money, she lives longer, but implies her copies keep their money, and the research fails everywhere.
      *   *The Twist:* The cost must be *real*. She is dying. The treatment is her only chance. The donation saves strangers she will never meet.

  3.  **Drafting - Scene by Scene:**

      *   **Scene 1: The Setup.** Establish the isolation. Elara is on a station at the edge of the expansion front. She receives the diagnosis and the windfall (inheritance? bonus?). Let's say she discovered a resource vein. She has 10 million credits. Treatment costs 10 million. The "ECL Project" needs 10 million to reach a threshold of viability across the statistical ensemble.
      *   **Scene 2: The Theory.** Explain ECL without info-dumping. Use her internal monologue or a conversation with an AI log. She understands Causal Decision Theory (CDT) vs. Evidential Decision Theory (EDT) / ECL. CDT says: "My choice doesn't change what they do. Take the money." ECL says: "My choice is evidence of what they do. If I cooperate, they likely cooperate."
      *   **Scene 3: The Decision.** The moment of transfer. The physical act. The fear. The doubt.
      *   **Scene 4: The Aftermath.** She waits. Does she feel different? Does the universe change? No. That's the point.
      *   **Scene 5: The Ending.** Ambiguous. She doesn't know if it worked. She just knows she acted according to the principle.

  4.  **Refining the ECL Logic:**
      *   I need to make sure I don't accidentally slip into "magic." It's not that her donation *causes* others to donate. It's that her donation *implies* others donated because they are similar enough to her.
      *   The "Large World" assumption: The universe is infinite or sufficiently vast that there are $N$ copies of Elara (or agents with her decision algorithm).
      *   The Payoff: If $N$ is large enough, the sum of small sacrifices by all copies outweighs the large gain of one copy defecting.
      *   *Correction:* If she takes the cure, she lives. If she donates, she dies (eventually). The benefit to the "copies" isn't that they live, but that *their* preferred outcome (e.g., AI safety, x-risk reduction) happens.
      *   *Let's adjust the stakes:* If she takes the cure, she lives 40 more years. If she donates, she dies in 2 years. The donation funds a "Schelling Point" protocol. If enough agents fund it, a universal coordination standard is adopted across the cosmos, preventing infinite wars. If not, chaos.
      *   *Actually, keep it personal but abstract:* The "Great Filter" mitigation. She can extend her life, or she can fund a signal that encourages cooperation.
      *   *Simpler:* Just money. She has resources. Local use = luxury/safety. Distributed use = aid for "agents like her."
      *   *Let's go with the Life Extension vs. The Algorithm.*
      *   Elara has a terminal condition.
      *   Option A: Buy the stasis pod. She survives indefinitely. (Defect)
      *   Option B: Release the encryption key to a beneficial resource-distribution algorithm. She dies, but if other "Elaras" do the same, the algorithm becomes universal standard, saving trillions. (Cooperate)
      *   Wait, releasing a key is causal.
      *   Okay, back to basics. ECL is about *acausal* trade.
      *   Scenario: Elara finds a glitch in the local energy grid. She can exploit it to power her life support forever (Defect). Or she can patch it. Patching costs her energy reserves, shortening her life. Why patch? Because if she patches, it's evidence that other agents in similar positions patch their local grids. If everyone patches, the universal grid remains stable. If everyone exploits, the universal grid collapses.
      *   This is perfect. It's the Tragedy of the Commons, but the "Commons" is acausal.

  5.  **Writing - Focusing on Tone:**
      *   Tone: Melancholy, intellectual, resolute but fearful.
      *   Sensory details: The hum of the station, the cold, the medical readouts.
      *   The "Ghost": The feeling of the other selves.

  6.  **Drafting the Narrative Arc:**
      *   *Opening:* Elara looking at the energy readout. The anomaly.
      *   *Middle:* The internal debate. The math of ECL. The weight of the "copies."
      *   *Climax:* The choice. Executing the patch.
      *   *Resolution:* The lights dim. She waits. Nothing happens visibly. She accepts the uncertainty.

  7.  **Polishing the ECL Explanation:**
      *   Make sure the reader understands *why* she thinks this works. It's not hope; it's Bayesian inference on her own source code. "I am a sample of one from the distribution of 'conscious agents facing this choice'."

  8.  **Final Review against Constraints:**
      *   ECL core? Yes.
      *   No telepathy/messages? Yes.
      *   Costly choice? Yes (her life/comfort).
      *   Unconfirmed payoff? Yes (ending is ambiguous).

  **(Self-Correction during drafting):** Make sure I don't imply the universe *is* infinite, just that she *believes* it is large enough for the probability to matter. The story is about her faith in the math, not the math being objectively proven true within the narrative.

