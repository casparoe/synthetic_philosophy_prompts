  6.  **Refining the Examples (Self-Correction during drafting):**
      *   *Fink:* Make sure the change is *instantaneous* and *caused by the stimulus*. The "Phase-Shifting Alloy" works. Stimulus: Heat. Response: Lattice rearranges to contract instead of expand. The disposition (thermal expansion) is lost *at the moment* of heating.
      *   *Mask:* Make sure the disposition remains *fully active*. The "Magnetic Dampener" on a falling metal sphere. Disposition: To accelerate at $9.8 m/s^2$. Stimulus: Release. Interference: Magnetic field. Result: Slower fall. The mass/gravity relationship (basis) is unchanged.
      *   *Ambiguous:* The "Self-Healing Concrete" is good. Let's sharpen the ambiguity. It hinges on whether the "disposition to crack" includes the *permanence* of the crack. If fragility = "would break and stay broken," healing removes the disposition (Fink). If fragility = "would initiate a fracture," healing stops the manifestation (Mask).

