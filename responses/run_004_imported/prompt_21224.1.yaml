answer: |-
  Your friend's mediator didn't invent a trick; she applied a specific, well-known solution from cooperative game theory. The method you're describing is almost certainly the **Kalai-Smorodinsky Bargaining Solution (KSBS)**.

  It was proposed by economists Ehud Kalai and Meir Smorodinsky in 1975 as an alternative to the more famous **Nash Bargaining Solution**. While your friend's intuition that it "feels fair" is correct, her worry about the "best case" numbers being arbitrary is also theoretically sound.

  Here is a breakdown of what that rule is actually doing, how it compares to the alternatives, and where the potential pitfalls lie.

  ### 1. The Mechanics: Floor, Ceiling, and Proportions

  To understand the fairness claim, we have to map the mediator's steps onto bargaining theory terms:

  *   **The Floor (Disagreement Point):** The 50/50 legal split. In game theory, this is what happens if negotiations fail. It's the baseline ($d$).
  *   **The Ceiling (Ideal Point):** The "best case" scenario for each sibling, assuming the other gets their floor. This represents the maximum possible gain ($b$).
  *   **The Gain:** The difference between the Ceiling and the Floor ($b - d$).
  *   **The Solution:** The mediator ensured that both siblings received the same **ratio** of their possible gain.

  Mathematically, if Sibling A gets outcome $x$ and Sibling B gets outcome $y$, the mediator solved for:
  $$ \frac{x_A - d_A}{b_A - d_A} = \frac{x_B - d_B}{b_B - d_B} $$

  In plain English: **"We are splitting the *hope*, not the *dollars*."**

  ### 2. The Notion of Fairness: Monotonicity vs. Independence

  To see why this is "smart" rather than arbitrary, you have to compare it to the standard alternative, the **Nash Bargaining Solution (NBS)**.

  **The Nash Approach:**
  John Nash's famous solution (1950) says you should maximize the *product* of the gains above the floor. In many simple money-splitting cases, this results in splitting the **surplus** equally.
  *   *Example:* If the estate is worth \$1M, and the legal floor is \$500k each, there is no surplus to create by agreeing (unless selling the house privately yields more than a court sale). But if there *is* value in avoiding lawyers (say, saving \$100k in fees), Nash says split that \$100k savings 50/50.
  *   *The Logic:* Nash relies on a principle called **Independence of Irrelevant Alternatives (IIA)**. It basically says: "If you remove options neither of you would have chosen anyway, the result shouldn't change."

  **The Kalai-Smorodinsky Approach:**
  Kalai and Smorodinsky argued that Nash's method ignores the **range of possibilities**.
  *   *The Logic:* They replaced IIA with a principle called **Individual Monotonicity**. This says: "If my best-case scenario improves (my ceiling goes up), but yours stays the same, I should not end up with *less* than I did before."
  *   *Why it matters:* Imagine the stationery shop is worth \$10k to the sister (she hates it) but \$500k to the brother (he runs it). Under a strict Nash surplus split, they might split the *total* value evenly. But under Kalai-Smorodinsky, the brother's "ceiling" is much higher. By equalizing the *percentage of the ceiling*, the brother gets a larger share of the dollars, because his "potential gain" was larger to begin with.

  **The Fairness Claim:**
  The mediator's method claims fairness through **equal relative satisfaction**. It acknowledges that the siblings might value the assets differently. It ensures that neither sibling feels they "left more money on the table" relative to their own maximum potential than the other did.

  ### 3. Why It Might Feel "Gross" or "Tricky"

  Your friend's unease stems from the second part of your description: *"those 'best case' numbers... seem to depend a lot on how you frame what's on the table."*

  This is the primary theoretical and practical weakness of the Kalai-Smorodinsky solution.

  **1. Sensitivity to the "Ideal Point"**
  The Nash solution doesn't care about the "ceiling"; it only cares about the shape of the possible agreements near the middle. The Kalai-Smorodinsky solution is entirely dependent on accurately defining the "best case."
  *   **The Risk:** If the brother can argue that his "best case" includes keeping the shop *and* some extra cash because "the shop has sentimental value to me worth \$1M," he artificially inflates his ceiling. Even if no one believes he'd actually get that, raising his $b$ value shifts the proportional split in his favor.
  *   **The Defense:** A good mediator anchors the "best case" in objective reality (e.g., liquidation value, market appraisal) rather than subjective utility. If the mediator did this rigorously, the method is robust. If they allowed subjective "hope" to define the ceiling, it's manipulatable.

  **2. Linearity Assumption**
  This method assumes that gaining 50% of your "best case" feels the same to both people. But economics teaches us about **diminishing marginal utility**.
  *   If the sister is struggling financially and the brother is wealthy, \$100k means much more to her. A proportional split ignores *need*. It treats a dollar of "gain" for the rich sibling as equal to a dollar of "gain" for the poor sibling.
  *   However, your friend noted they explicitly wanted to avoid haggling over "who needed the money more." In that context, KSBS is actually the *correct* tool, because it focuses on entitlement and potential, not welfare or need.

  ### 4. How to Explain This to Your Friend

  You can tell her that the mediator used a **Kalai-Smorodinsky Bargaining Solution**. It is a legitimate, peer-reviewed alternative to the standard Nash model, specifically designed for situations where the two parties have different "ranges" of possible outcomes.

  **The Verdict:**
  *   **Is it a trick?** No. It is a recognized method for resolving asymmetric bargaining situations without requiring the parties to reveal private information about their utility functions (i.e., how much they personally value the shop).
  *   **Is it fair?** It is "procedurally fair." It treats both parties' *ambitions* equally. It ensures that if one person had more to potentially gain from a favorable ruling, they capture more of the actual settlement, but only in proportion to that potential.
  *   **The Catch:** The fairness holds only if the "best case" numbers were calculated objectively. If the "best case" was just a number they pulled out of a hat, the result is garbage-in, garbage-out.

  **The "Soft Spot" to Watch:**
  The only place she should look for foul play is in how the **Ideal Points (Ceilings)** were derived.
  *   Did the mediator use appraisals for the house?
  *   Did they use book value or market value for the shop stake?
  *   Did they allow either sibling to inflate their "best case" by adding subjective sentimental value?

  If the inputs were objective market values, the mediator did a sophisticated job of avoiding a 50/50 split that might ignore the unique value of the business stake to one sibling, while avoiding a messy negotiation over need. If the inputs were subjective, then her gut feeling that it's "arbitrary" is correct.

  ### Summary for Dinner Conversation
  "The mediator used something called the **Kalai-Smorodinsky solution**. Unlike the standard 'split the difference' approach, which ignores how much each of you *could* have won, this method splits the **percentage of your maximum possible win**. It's theoretically sound and prevents the person with the higher potential stake from getting squeezed, but it only works if the 'maximum possible win' was calculated using hard numbers, not feelings."
