          *   *Refinement:* The argument shouldn't be "Anti-psychologism implies Fascism." It should be "Frege's *specific metaphysical picture* of objectivity shares a structural affinity with his *specific political vision* of order." Husserl had a different metaphysical picture (constitutive phenomenology) even if he agreed on anti-psychologism.
