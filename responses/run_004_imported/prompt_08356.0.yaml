  3.  **Analyze the Hirshleifer Effect:**
      *   *Context:* General Equilibrium / Game Theory (Multiple agents).
      *   *Mechanism:* Agents want to insure against risk (e.g., crop failure). Insurance works because of *uncertainty* about who will fail. If public info reveals who will fail *before* contracts are signed, the "loser" can't get insured (or pays full price), and the "winner" won't subsidize.
      *   *Result:* Ex-ante welfare (before info arrives) can be lower with info than without.
