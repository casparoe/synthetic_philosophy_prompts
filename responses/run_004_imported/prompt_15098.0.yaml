answer: |-
  Friends, colleagues, fellow travelers in the longlist.

  Twelve years. Twelve chairs around this table. And next year, just one. One celebrity judge, one singular vision, one name on the envelope.

  There is a comfort in numbers. Some of you know the theorem I'm thinking of. It suggests that if you gather a group of competent people—each individually more likely than not to be right—and you ask them to vote independently, the collective majority is almost guaranteed to be correct. The math says twelve of us are safer than one. The math says the crowd is wiser than the celebrity.

  But that theorem relies on a fragile condition: independence. It assumes we sit in separate rooms, never speak, and cast our votes without knowing how the others voted. It assumes we are distinct variables.

  And look at us. We are not distinct variables. We are novelists. We are opinionated. For two days, we have talked, argued, pleaded, and laughed. We have contaminated each other's judgments. We have changed minds over coffee and worn each other down over lunch. By the time we reached the ballot box, we were not independent. We were a community. Strictly speaking, we broke the math.

  But here is what the theorem cannot calculate. It cannot measure the value of having your blind spot illuminated by a colleague. It cannot quantify the merit of a book that survives the scrutiny of eleven other pairs of eyes. Yes, we lost our independence. But in losing it, we gained something a single judge can never have: we gained the friction of doubt. We gained the assurance that a winner wasn't just a whim, but a consensus forged in fire.

  The foundation wants a spotlight next year. They want a name. But for twelve years, we were a light source made of many bulbs. Some burned brighter than others, some flickered, but together we kept the room lit.

  So, I propose a toast. To the violation of independence. To the arguments that mattered more than the votes. And to the twelve of us, who proved that while one judge might be faster, twelve readers are deeper.

  To the panel.
