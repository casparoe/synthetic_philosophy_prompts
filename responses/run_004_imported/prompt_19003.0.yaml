          *   *Nature:* You can't predict the specific actions of a smarter agent (or your future self) without *being* that agent. You can only predict *properties* of the output.
          *   *Relevance to DL:* High. A neural net cannot perfectly simulate a larger/successor neural net without incurring the compute cost of running it. This is a computational complexity bound.
