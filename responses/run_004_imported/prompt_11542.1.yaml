      *   **Point 2: Intelligibility vs. Truth.** Charity makes his sentences *meaningful*, not *true*. You can understand a lie.
      *   **Point 3: The Scope of "Mostly Right".** Davidson means "mostly right about immediate surroundings/logic," not "mostly right about virology or geodesy." Massive error is impossible on *basic* beliefs, but localized error on complex theories is fine.
      *   **Point 4: Quine vs. Davidson.** Quine = Underdetermination (many maps work). Davidson = Constitutive (no map, no territory of mind). They aren't the same.

