      },
      "case_classification": {
        "score": 0,
        "max": 10,
        "feedback": "Incorrect classification. The case is Adversarial Goodharting. The prompt describes agents changing behavior to game the metric. The student explicitly denies agency ('nobody involved is doing anything strategic'), contradicting the prompt text."
      },
      "overall_grade": 5,
      "max_grade": 10,
      "summary": "Strong intuition on the folk saying, but critical failure on application and history. The distinction between Regressional (noise) and Adversarial (gaming) is the core learning objective of this exercise, and the student conflated them in the case study."
    }
  }
