  2.  **Recall/Research Russell's *Marriage and Morals* (specifically on Jealousy):**
      *   *Context:* Written in 1929, a time of strict Victorian/Edwardian hangovers regarding sexuality.
      *   *Russell's Stance:* He is a rationalist and empiricist. He distinguishes between "natural" impulses and "social" constructs.
      *   *On Jealousy:* He acknowledges a biological basis (the "fighting instinct," fear of loss) but argues its *intensity* and *ubiquity* are massively amplified by property concepts applied to people (wives as chattel), monogamous enforcement, and the secrecy surrounding sex.
      *   *Key Argument:* Jealousy is not an insurmountable barrier to non-monogamy *if* society stops treating sex as exclusive property. He believes education and social restructuring can mitigate it. He doesn't say it will vanish entirely, but that it shouldn't dictate moral law.
      *   *Nuance:* He admits some people are more jealous than others. He advocates for a system where jealousy doesn't lead to cruelty or restriction of liberty.

  3.  **Analyze the Modern Polyamory Context:**
      *   *Features:* Consensual non-monogamy, communication, negotiation, "compersion" (joy in partner's joy), community support.
