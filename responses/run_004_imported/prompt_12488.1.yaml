      *   *Synthesis:* Russell would likely lean towards **Confirmation**, but with a nuanced revision. He would argue that the *persistence* of jealousy confirms the depth of the conditioning (it's not just laws, it's deep psyche), but the *success* of polyamory confirms the plasticity. The fact that it is "hard-won" fits his view that we are fighting centuries of property-based morality.

