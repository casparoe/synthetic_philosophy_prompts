answer: |-
  The conference bar was dim, loud, and smelled faintly of stale lager and desperation. It was 11:30 PM on the final night of the Metaphysics of Modality symposium. At a small corner table, two philosophers sat with half-empty glasses.

  Cara was a counterpart theorist through and through, her talk earlier that day having defended Lewisian modal realism against charges of extravagance. Tom, across from her, had argued for haecceitism and transworld identity, leaning heavily on Kripkean rigid designation.

  They had been at this since the seminar ended. Now, with the crowd thinning, they were back to the core of it.

  Tom swirled his whiskey. "Look, Cara, I know you think you've got the systematic high ground. But you never answered the Humphrey objection to my satisfaction. And I don't mean the slogan version. I mean the phenomenological cost."

  Cara leaned forward. "I thought I did. Kripke says Humphrey doesn't care about his counterparts. But that assumes Humphrey already knows what 'Humphrey could have won' means. If counterpart theory is the correct *analysis* of that claim, then Humphrey's indifference is based on a misunderstanding of his own modal thoughts."

  "Is it?" Tom shook his head. "This is where Lewis's standard rejoinder feels like a dodge. He says the objection begs the question because it presupposes a notion of *de re* modality that isn't counterpart-theoretic. He says, 'I'm offering an analysis, you can't use the pre-analytic intuition to refute the analysis.'"

  "Exactly," Cara said. "Think of the identity theory of mind. Someone says, 'Pain isn't C-fiber firing, because pain *hurts* and C-fibers are just tissue.' That begs the question. The analysis is supposed to tell you what the pain *is*, even if it contradicts your folk intuition. Lewis is doing the same for modality. 'Could have won' *means* 'has a counterpart who wins.' If Humphrey thinks otherwise, Humphrey is confused about the semantics."

  Tom took a sip, wincing slightly. "Here's where my friend from the seminar—and I—push back. It's not just about folk intuition. It's about the distinction between truth-conditions and content. Lewis might be able to map the truth-conditions of 'Humphrey could have won' onto 'Counterpart H* wins in W*.' He gets the truth-value right. If Humphrey lost but could have won, and there is a winning counterpart, the sentence comes out true. Fine."

  "But?"

  "But getting the truth-value right isn't getting the *content* right," Tom said, tapping the table. "When I say 'I could have won,' I am thinking about *me*. Not a qualitative duplicate. Not a distinct individual who resembles me. I am thinking about *this* very substance having a different property. Lewis's analysis saves the truth of the sentence by changing the subject of the proposition. He gives me a truth-condition that I can accept, but only by accepting that I was wrong about what I was talking about. That's not an analysis; that's an elimination."

  Cara sighed, signaling the waiter for another round. "You're treating the *de re* mode of presentation as sacrosanct. But why? If the world is Lewisian, there *is* no 'this very substance' across worlds. There are only world-bound individuals. So there is no fact of the matter for you to be right about. You're insisting on a transworld identity that doesn't exist in the ontology. You can't say Lewis is changing the subject if the subject you want doesn't exist."

  "That's circular," Tom countered. "You're assuming your ontology to prove your semantics. I'm saying that if your ontology makes it impossible to capture the content of ordinary modal thought, that's a reductio of the ontology. We have direct access to our modal intentions. I know I'm not thinking about someone else. If your metaphysics says I must be, your metaphysics is failing to save the phenomena."

  "Saving the phenomena how?" Cara asked. "By preserving a confusion? Look, Tom, let's switch fields. Suppose I hit you with the argument that actually keeps me up at night. The one where I think you're the one begging the question. Accidental Intrinsics."

  Tom groaned. "I knew we'd get here."

  "It's the strongest argument for counterpart theory," Cara insisted. "Take Humphrey. In world $W_1$, he is sitting. In world $W_2$, he is standing. Sitting and standing are intrinsic properties. They concern the shape and posture of the body, not its relation to other things. If Humphrey is literally, numerically identical across $W_1$ and $W_2$, then Humphrey is both sitting and standing. Contradiction."

  "We don't say he's both sitting and standing *simpliciter*," Tom said, reciting the standard defense. "We say he is sitting-in-$W_1$ and standing-in-$W_2$. We relativize the properties to worlds."

  "Ah," Cara pointed a finger. "But now 'sitting' isn't an intrinsic property anymore. 'Sitting-in-$W_1$' is a relation between Humphrey and World 1. You've turned shapes and masses and chemical structures into relations to abstract objects. That destroys the intrinsic nature of the physical world. It's exactly the problem of temporary intrinsics that pushed Lewis to temporal parts. If you won't relativize across time, why relativize across worlds?"

  "Because time and modality aren't the same," Tom said. "With time, I exist now and I existed yesterday. I change. With modality, I'm talking about possibilities. Relativizing to worlds isn't making shape extrinsic in a problematic way; it's acknowledging that worlds are contexts of evaluation. To say 'Humphrey is sitting' is incomplete. It's always 'Humphrey is sitting at $w$.' That doesn't mean Humphrey's shape is a relation; it means the instantiation of the shape is indexed."

  "But what is the shape *itself*?" Cara pressed. "If I ask, 'What shape is Humphrey?' you can't answer without asking 'Which world?' If the answer depends on the world, then the property isn't inherent to Humphrey. It's a relation. You're biting the bullet that nothing has intrinsic properties anymore. Everything is world-indexed. Lewis bites the bullet that Humphrey isn't identical across worlds. Which bullet is bigger? Losing identity or losing intrinsics?"

  Tom leaned back, looking at the ceiling. "I think you're overstating the cost of relativization. We already accept indexicality. 'I am here' is true, but 'I' and 'here' shift. Why is 'Humphrey is sitting' any different? The property *being sitting* is intrinsic. The *exemplification* of that property is what gets indexed. I don't lose the intrinsic nature of sitting; I just acknowledge that possibilities are ways *this* object could be, not ways *other* objects are."

  "But if 'this object' is in two places with two shapes," Cara said, "you have a contradiction unless you fragment the object. If you refuse to fragment it (via counterparts), you have to fragment the properties. I'm arguing that fragmenting the properties is more damaging to our understanding of physics and material constitution than fragmenting the identity. If I have a counterpart, I preserve the intuition that in any given world, an object has exactly one shape. That's clean."

  "It's clean," Tom admitted. "But it's alienating. That's the Humphrey point coming back around. You preserve the logic of intrinsics by sacrificing the logic of self. I preserve the logic of self by adjusting the logic of predication. Here's the thing, Cara: you asked which bullet is cheaper. I think the stalemate you and my friend suspected is real. But I think there's a tie-breaker."

  "Which is?"

  "Explanation," Tom said. "If I use transworld identity, I can explain *why* Humphrey cares about the other world. Because it's *him*. It's the same entity. If you use counterpart theory, you have to explain why Humphrey cares about a distinct individual $H^*$. Lewis says it's because $H^*$ resembles him. But resemblance is cheap. There are infinite resemblers. Why does *that* one matter? You have to build a theory of 'counterpart selection' that mimics transworld identity so closely it becomes a shadow play of the very thing you denied."

  Cara nodded slowly. "I grant that counterpart selection is tricky. We need context to determine which resemblances matter. But Tom, look at the cost on your side. To keep 'Humphrey' identical, you have to treat worlds as abstract states of affairs or use some haecceitistic primitive thisness. If you're a modal realist like Lewis, you can't have transworld identity because of the intrinsics argument. So you're likely an actualist. But if you're an actualist, how does Humphrey exist in a non-actual world? Does he exist abstractly? If he exists abstractly in $W_2$, can he win an election? Abstract objects don't win elections."

  "Plantinga's answer," Tom said. "Humphrey doesn't exist in $W_2$. His *essence* does. The state of affairs 'Humphrey winning' is possible. When we say 'Humphrey could have won,' we mean there is a possible world where the essence of Humphrey is exemplified by a concrete individual who wins."

  "Then it's not Humphrey," Cara pounced. "It's an exemplifier of his essence. We're back to the Humphrey objection! If the concrete guy in $W_2$ isn't numerically identical to the Humphrey here (because Humphrey here is concrete and the Humphrey there is... what? A different concrete guy exemplifying the same essence?), then you don't have transworld identity of concrete individuals. You have transworld identity of essences. And if it's just essences, why isn't that just counterpart theory with extra steps? The 'essence' is just the set of relevant similarities."

  Tom paused. He took a long drink. "That's the hard line. If I say it's the *same concrete individual*, I run into accidental intrinsics. If I say it's an *essence*, I run into the charge that I've lost the concrete Humphrey. I suppose my move is to insist that 'concrete individual' is world-indexed. Humphrey is concrete-at-$W_1$ and concrete-at-$W_2$. It's the same *substance*, manifesting differently."

  "Substance," Cara mused. "That's the workhorse doing the lifting for you. You're willing to relativize intrinsics to save the Substance. I'm willing to fragment the Substance to save the Intrinsics."

  "Basically."

  "So," Cara said, resting her chin on her hand. "We're back to the cost benefit analysis. My cost: Humphrey's modal thoughts are technically about someone else, though someone very close to him. Your cost: Properties are relations to worlds, or substances are weirdly multi-located across modal space."

  "I think your cost is higher," Tom said. "Because it severs the normative link. If I regret a choice, I regret *my* action. If counterpart theory is true, I'm regretting that a counterpart did something. That changes the nature of moral responsibility, regret, and hope. It makes them vicarious."

  "And I think your cost is higher," Cara replied. "Because it makes the physical world dependent on the modal. Whether I am sitting or standing depends on which world-index I'm looking at. It makes instantiation mysterious. And frankly, Lewis's system is more parsimonious. One ontology of concrete worlds, one logic of identity. You need essences, or haecceities, or indexed properties. You're multiplying primitives to save a feeling of 'me-ness'."

  Tom smiled tiredly. "So, it comes down to this: Do you value the integrity of the physical object over the continuity of the self? Or do you value the continuity of the self over the integrity of the physical object?"

  "It seems so," Cara said. "Lewis thought the integrity of the object (and the logic of identity) was non-negotiable. Kripke thought the continuity of the self (and rigid designation) was non-negotiable."

  "And neither side can prove the other wrong without assuming the very thing in dispute," Tom concluded. "The Humphrey objection assumes transworld identity matters. The intrinsics objection assumes intrinsic properties can't be indexed."

  "Which means," Cara raised her glass, "that we're not arguing about truth. We're arguing about which bullet we'd rather take in the foot."

  Tom clinked his glass against hers. "To philosophical pain."

  "To philosophical pain," Cara agreed. "May it be productive."

  They drank, the noise of the bar swelling around them, the dispute unresolved, but the terms of the stalemate finally clear. Neither had surrendered ground, but they had mapped the trench lines exactly. It wasn't a lack of argument that kept them apart; it was a fundamental disagreement on which metaphysical cost was the price of doing business.
