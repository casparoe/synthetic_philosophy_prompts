prompt: |-
  I sit on the board of a mid-sized foundation that funds global-health work, and I'm now facing a live version of a question I've only ever debated on Overcoming Bias and LessWrong. Our executive director wants to settle next year's strategic bet -- bed-net scale-up versus pandemic-preparedness advocacy -- by defining a combined welfare metric (DALYs averted per dollar plus a grantee-capacity index), running conditional prediction markets among staff and trustees on each option, and pre-committing to fund whichever one the market prices higher once trading settles. Half the board is enthusiastic; the other half warns that advocacy's payoff is inherently harder to price, so its market will stay thin and never really get tested -- meaning we'd be dressing up a foregone conclusion as a forecast, with the further risk that a donor leak makes this look like a miniature 2003 DARPA "terrorism futures" episode. Draft the memo I'll circulate before the December board meeting: recommend adopt, reject, or adopt with modifications, with a concrete timeline, and engage the thin-market objection on its own terms rather than just invoking Hanson's standard rebuttal that manipulation is usually self-defeating.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Board member of a mid-sized global health foundation.
      *   **Context:** The Executive Director (ED) proposes using prediction markets to decide between two strategic bets: bed-net scale-up vs. pandemic-preparedness advocacy.
      *   **Metric:** Combined welfare metric (DALYs averted/$ + grantee-capacity index).
      *   **Proposal:** Run conditional prediction markets among staff/trustees, pre-commit to funding the higher-priced option.
      *   **Conflict:** Half the board is enthusiastic (rationalist/EA adjacent likely, given the Overcoming Bias/LessWrong reference); half is skeptical (advocacy hard to price, thin markets, reputational risk akin to DARPA terrorism futures).
      *   **Task:** Draft a memo for the December board meeting.
      *   **Recommendation:** Adopt, Reject, or Adopt with Modifications.
      *   **Requirements:** Concrete timeline, engage the "thin-market" objection on its own terms (not just citing Robin Hanson), address reputational risk.

  2.  **Determine the Recommendation:**
      *   *Option A (Adopt as is):* Too risky. The "thin market" objection is valid for advocacy outcomes. Pre-committing based on a potentially flawed market price is dangerous. Reputational risk is real.
      *   *Option B (Reject):* Misses an opportunity to improve decision-making. The board is already split; a flat rejection might cause friction with the ED and the enthusiastic half.
      *   *Option C (Adopt with Modifications):* Best path. Validates the innovation but mitigates risks. Use markets as *input* rather than *binding authority*. Address the thin market issue by subsidizing liquidity or using scoring rules instead of full markets for the advocacy side. Address reputational risk by keeping it internal/confidential.
      *   *Decision:* **Adopt with Modifications.** This strikes a balance between innovation and fiduciary responsibility.

  3.  **Address the "Thin Market" Objection:**
      *   *The Objection:* Advocacy outcomes are binary, long-term, and vague. Traders won't bet because they can't hedge or verify. Prices will stick to priors, not information.
      *   *The Counter (without just saying "Hanson"):* Acknowledge the liquidity problem. If the market is thin, the price signal is noise.
      *   *Solution:* Don't rely solely on market prices for the advocacy option. Use a "decision market" structure where the payout is conditional on the *decision* being made, or supplement with elicitation mechanisms (scoring rules) that don't require capital at risk. Alternatively, narrow the resolution criteria for the advocacy market to make it more tractable (e.g., specific policy adoption vs. "pandemic prevented").
      *   *Refinement:* Let's suggest a hybrid. Use markets for the bed-net side (easier to metricize). Use structured expert elicitation (like a Delphi method or scoring rules) for the advocacy side, then normalize the outputs. Or, if sticking to markets, ensure sufficient seed liquidity and define resolution criteria very sharply.
      *   *Better approach for the memo:* Acknowledge that a thin market *invalidates the pre-commitment*. Therefore, the pre-commitment must be conditional on market liquidity thresholds.

  4.  **Address the Reputational Risk (DARPA Futures):**
      *   *The Risk:* Leaks make it look like betting on disaster.
      *   *Mitigation:* Internal only. No external traders. Clear communication that this is *decision analysis*, not *profiting from tragedy*. Frame it as "Information Aggregation," not "Prediction Markets."

  5.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** Recommendation (Adopt with Modifications).
      *   **Context:** Acknowledge the ED's proposal and the board's split.
      *   **Analysis of the Proposal:**
          *   Pros (Information aggregation, reducing bias).
          *   Cons (Thin markets on advocacy, reputational risk, pre-commitment rigidity).
      *   **Addressing the Thin Market Objection:** Specific section. Explain *why* it matters (liquidity = confidence). Propose liquidity thresholds or hybrid elicitation.
      *   **Reputational Risk:** Confidentiality protocols.
      *   **Recommendation & Timeline:** Specific steps for December through Q2.
      *   **Conclusion:** Final pitch.

  6.  **Refining the Tone:**
      *   Needs to be professional, fiduciary-focused, but intellectually rigorous (acknowledging the LessWrong/Overcoming Bias background without using jargon excessively).
      *   Must respect the ED's initiative while exercising board oversight.
      *   Avoid sounding like a ideologue. Focus on *implementation risk*.

  7.  **Key Content Adjustments (Self-Correction during drafting):**
      *   *Initial thought:* Suggest scoring rules instead of markets. *Correction:* The ED wants markets. Let's keep markets but add safeguards.
      *   *Initial thought:* Tell them to drop the pre-commitment. *Correction:* Pre-commitment is the point of overcoming bias. Instead, make the pre-commitment *conditional* on market validity (liquidity/volume).
      *   *Metric Issue:* DALYs + Capacity Index is complex. Markets need clear resolution. Need to ensure the metric is defined *before* trading starts to avoid Goodhart's Law.
      *   *Timeline:* December meeting is coming up. Need a pilot phase.

  8.  **Final Polish:**
      *   Ensure the "thin market" argument is engaged deeply. It's not just "not enough traders," it's "no incentive to reveal info if the outcome is subjective."
      *   Make sure the DARPA reference is handled delicately (acknowledge the parallel, distinguish the intent).

  9.  **Drafting the Content (Mental Outline):**
      *   *Subject:* Strategic Decision-Making Pilot: Prediction Markets.
      *   *Rec:* Proceed, but with "Liquidity Gates" and "Internal-Only" status.
      *   *Thin Market:* If volume < X, price is ignored. Advocacy metrics need sharper resolution criteria.
      *   *Timeline:* Dec (Approve), Jan (Design), Feb (Seed), Mar (Trade), Apr (Decide).

  10. **Final Review against constraints:**
      *   Memo format? Yes.
      *   Recommendation clear? Yes.
      *   Timeline concrete? Yes.
      *   Thin market objection engaged? Yes.
      *   DARPA risk addressed? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees, [Foundation Name]
  **FROM:** [Your Name], Board Member
  **DATE:** November 14, 2024
  **SUBJECT:** Recommendation on Proposed Strategic Prediction Market Pilot

  ### Executive Summary

  Our Executive Director's proposal to utilize conditional prediction markets to allocate next year's strategic budget between bed-net scale-up and pandemic-preparedness advocacy is a bold attempt to institutionalize epistemic rigor. It aligns with our mission to maximize impact per dollar.

  However, the current proposal contains implementation risks that could undermine its validity or damage our reputation. Specifically, the "thin market" risk regarding advocacy outcomes is not merely a liquidity issue but a validity issue, and the pre-commitment mechanism lacks a safety valve for market failure.

  **Recommendation:** I recommend we **Adopt with Modifications**. We should authorize the pilot but condition the binding pre-commitment on specific liquidity thresholds and sharpen the resolution criteria for the advocacy arm. We must also classify this as an internal decision-support tool, not an external market, to mitigate reputational risk.

  ### Context and Strategic Value

  The board is rightly divided. The enthusiasm stems from the potential to overcome status quo bias and aggregate dispersed information among staff and trustees. The skepticism stems from the difficulty of quantifying advocacy impact and the specter of the 2003 DARPA "Policy Analysis Market" controversy.

  Both sides are correct. Information aggregation is superior to consensus meetings, *provided* the signal-to-noise ratio is high. If the market price does not reflect genuine information discovery, a pre-commitment to that price is not rational—it is randomization dressed as math.

  ### Addressing the Thin-Market Objection

  The skeptical half of the board argues that advocacy payoffs are inherently harder to price than bed-nets, leading to thin trading and untested prices. We must engage this on its own terms, not simply assume market efficiency will emerge.

  1.  **Liquidity as Validity:** In a thin market, a single trade can move the price significantly without new information entering the system. This creates "noise prices." If we pre-commit to a noise price, we are not making a data-driven decision; we are gambling on market microstructure.
  2.  **Resolution Risk:** Bed-net DALYs are retrospective and verifiable. Advocacy impact (e.g., "policy adopted") is often subjective or delayed. If traders believe the resolution criteria are ambiguous, they will not trade, regardless of their private information. This creates a self-fulfilling prophecy of thinness.
  3.  **The Modification:** We cannot treat the two markets identically.
      *   **Liquidity Gates:** The pre-commitment to fund the higher-priced option should only trigger if *both* markets meet a minimum trading volume and distinct trader count (e.g., minimum 20% of eligible participants trading, with volume exceeding $X in play money or real bonus stakes). If the advocacy market remains thin, the decision reverts to a standard board vote, informed by the market price but not bound by it.
      *   **Sharpened Criteria:** The advocacy metric cannot be "pandemic preparedness improved." It must be binary and verifiable within the fiscal year (e.g., "Specific Bill X passes Committee Y" or "Grantee Z secures follow-on funding from Govt A"). If we cannot define a sharp resolution criterion, we should not run a market on it.

  ### Reputational Risk Management (The DARPA Parallel)

  The 2003 DARPA controversy was not about prediction markets failing; it was about the *optics* of betting on tragedy. While our intent is welfare maximization, a leak describing trustees "trading on pandemic outcomes" could be devastating.

  *   **Internal Only:** No external traders. No real money changing hands (use bonus-linked play money or internal reputation points).
  *   **Framing:** Internally and in minutes, this is an "Information Aggregation Pilot," not a "Futures Market."
  *   **Confidentiality:** All participants must sign specific NDAs regarding the existence of the market, not just the data.

  ### Proposed Timeline and Implementation Plan

  If the board approves this modified approach at the December meeting, I propose the following schedule:

  *   **December 15 (Board Vote):** Approve pilot with Liquidity Gates and Internal-Only status. Form a 3-person Oversight Subcommittee (1 Trustee, 1 Staff, 1 External Advisor) to finalize resolution criteria.
  *   **January 10 (Criteria Lock):** Oversight Subcommittee publishes the exact binary resolution criteria for both Bed-Net and Advocacy options. *No trading begins until criteria are immutable.*
  *   **January 15 – February 15 (Seeding Phase):** Market makers (selected staff not involved in strategy) seed initial liquidity to ensure depth before trustees enter.
  *   **February 15 – March 15 (Trading Window):** Eligible staff and trustees trade. Weekly volume reports sent to the Board.
  *   **March 20 (Liquidity Check):** Oversight Subcommittee verifies if Liquidity Gates were met for both options.
  *   **March 30 (Decision):**
      *   *If Gates Met:* ED executes funding based on higher market price.
      *   *If Gates Failed:* ED presents market data as advisory input; Board votes via standard procedure.
  *   **June 30 (Review):** Post-mortem on market accuracy and process friction to decide on future use.

  ### Conclusion

  We have an opportunity to lead the sector in decision hygiene. However, fiduciary duty requires that we only bind ourselves to mechanisms that are robust. By adding liquidity gates and tightening resolution criteria, we respect the skepticism of our colleagues without abandoning the innovation. We avoid the DARPA trap by keeping this internal and focused on welfare metrics, not disaster speculation.

  I move we adopt the proposal subject to the modifications outlined above.

  ***

  **Attachments:**
  *   Draft Liquidity Gate Parameters
  *   Draft Confidentiality Agreement for Market Participants
