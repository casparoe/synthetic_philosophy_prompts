  Here is a draft for the eulogy. It is written to be spoken at a moderate, steady pace. It aims to validate the conflicting experiences of the week without getting bogged down in medical definitions, focusing instead on Carol's agency and legacy.

  ***

  **Eulogy for Aunt Carol**

  Good morning. Thank you all for being here.

  We are gathered to honor Carol. But I think we all know that saying goodbye to her has been… complicated.

  Grief is rarely linear, and this past week has not followed a simple script. We have spent the last several days navigating a space that feels suspended, caught between medical reality and the visceral truth of what we saw with our own eyes.

  I know there are different memories of when she actually left us. For some, the goodbye happened earlier in the week, when the doctors confirmed that the woman who told our jokes, remembered our birthdays, and loved us with her whole mind was no longer there. That was a death of the spirit, of the person we knew.

  For others, the goodbye didn't feel real until Friday, when the machines were quieted and the warmth we could still feel in her hands finally faded. That was a death of the body, of the physical presence that had held us for so many years.

  It is okay that we hold both of those truths. We don't need to agree on a timestamp to agree on a loss. Grief doesn't require a single moment of cessation to be valid. Whether you say she left on Tuesday or Friday, the result is the same: the world is darker without her light.

  But I want to talk about the time between those two moments. Because that time was not empty. It was not a limbo, and it was not a mistake.

  Carol made a choice long before this week began. She decided that if her time came, she would give of herself one last time. In those days between the silence of her mind and the resting of her heart, she was still working. She was still acting. She was fulfilling a promise to strangers she would never meet.

  That space between Tuesday and Friday was not just a medical necessity; it was a final act of generosity. It was Carol saying, "Even when I am gone, let there be life."

  I know it was hard to watch. I know it was confusing to see her chest rise when she was already gone, or to feel her skin warm when her spirit had cooled. It challenges our understanding of what it means to be alive. But perhaps that complexity is fitting for a woman who was never simple. Carol understood that life is messy, that boundaries are blurred, and that love often requires us to hold two difficult things in our hands at once.

  She was a woman who showed up. She was the one who remembered how you took your coffee. She was the one who could make a crowded room feel like a living room. She was fierce, and she was kind, and she was stubborn enough to make sure her final wish was carried out, even when it made things difficult for those she left behind.

  To my uncle, and to my cousin: I know this week has been heavy in different ways. One of you lost her mind, and one of you had to let go of her hand. Both of those losses are real. Both of those pains are valid. But look at what that pain purchased. Because of her, and because of your willingness to endure that difficult week, other families will not have to stand where we are standing today. Other mothers will come home. Other daughters will get more time.

  So, when we remember Carol, let's not get stuck on the clock. Let's not argue over the exact second the candle flickered out. Instead, let's look at the light it cast.

  She is in the life she saved. She is in the memories we keep. And she is in the love that brought us all into this room, united by the woman who taught us that even in death, there is a way to give.

  Rest now, Carol. Your work is done. And it was enough.

  Thank you.
