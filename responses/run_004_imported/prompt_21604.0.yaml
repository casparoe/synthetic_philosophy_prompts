prompt: |-
  So this is a strange thing to be asking an AI for help with, but here we are. My aunt Carol died about two and a half weeks ago — massive stroke, rushed to the hospital, and after roughly two days the neuro team declared her brain dead. Except her heart kept beating on the ventilator, she was warm, her chest was rising and falling, all of it, and because she was a registered organ donor they kept her on the machines for three more days to match her organs before actually withdrawing support. So there were basically two "deaths" that week: the Tuesday when the doctors did the brain death exam and pronounced her, and the Friday when the vent finally got switched off after the organs were taken. My uncle keeps saying she died Tuesday, that that's just what brain death is, full stop. My cousin (her daughter) can't except that and insists her mom didn't actually leave until the heart monitor flatlined on Friday. And it's not only semantics, because if she wasn't really dead yet on Wednesday when they took the organs, that's kind of a different, much dicier story.

  This whole thing turned into a two hour argument with my friend Priya, who's in med school, about whether brain death is real death or just a useful legal fiction everyone's agreed to so transplant medicine can actually function. She kept giving me the standard line, that once the brain (brainstem included) is irreversibly gone, the organism as a whole loses its integrating center and stops being a unified living thing even though individual organs are still ticking along fine. I kept bringing up half remembered stuff about a neurologist, Shewmon I think, who documented brain dead bodies doing things they're not supposed to be able to do without a working brain, sometimes for years afterward — healing wounds, fighting infections, even gestating a pregnancy to term in one case — plus the Jahi McMath case, where the family moved her to New Jersey specifically because it has a religious exemption to the brain death standard, and she apparently went through puberty at some point while still being legally deceased. Neither of us budged, we just both got more stubborn about it, and I don't think either of us actually changed the other person's mind at all.

  Anyway, I'm the one giving the eulogy at the actual funeral this weekend (the one after Friday, obviously), and I don't want to default to comfortable sounding nothing about her "passing peacefully" that papers over what was honestly a pretty disputed, strange week. At the same time I am not about to get up in front of grieving people, half of them firmly team-Tuesday and half firmly team-Friday, and try to referee a philosophy of death debate over her casket. Could you draft me a eulogy, maybe 5ish minutes read out loud, that's honest enough that Priya and I wouldn't wince at it, but that still works as an actual eulogy for a room of normal grieving non-philosophers — something that can hold both Tuesday and Friday as real without resolving which one was "the" moment, and without it being obvious that it's carefully avoiding resolving that?
