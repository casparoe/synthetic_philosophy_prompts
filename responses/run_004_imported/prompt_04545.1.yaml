answer: |-
  The console blinked red. Not an alarm, but a request.

  Elara rubbed her hands together, the friction doing little to combat the station's creeping chill. The heating system was cycling down; power reserves were at twelve percent. She was three months into a five-year survey of the void between spiral arms, and the isolation was beginning to feel less like solitude and more like erasure.

  The packet on the screen was encrypted, but the header was clear. It was a resource allocation proposal from a sector light-years away, routed through her node by accident or design. Someone out there needed computational verification to unlock a stockpile of medical supplies. They couldn't reach the depot without her processor cycles to sign the handshake.

  If she ran the verification, her own reserves would drop to four percent. That meant shutting down life support redundancies. It meant risking frostbite, equipment failure, maybe death if a micrometeoroid struck during the cold cycle.

  If she ignored it, the supplies remained locked. The strangers died. She stayed warm.

  Elara leaned back in her chair, the leather creaking in the silence. Standard game theory was simple here. She gains nothing. She loses heat. They gain life. She loses safety. Defect. Ignore the packet. Delete the file.

  She hovered her finger over the command key. But she didn't press it.

  She looked at her reflection in the dark monitor. Pale face, dark circles, eyes that had spent too long staring into the static. She was a specific kind of thinker. She had been trained to prioritize logical consistency over local impulse. She wasn't unique in her biology, surely. There were billions of stars, countless habitats. Statistically, there were other minds built like hers. Minds that processed information using the same axioms, trained in the same schools of thought, facing similar choices in the dark.

  If she decided that helping was irrational, then every other mind that reasoned like her would come to the same conclusion. Across the vastness, wherever a similar agent faced a similar choice—wherever a node could relay aid to a stranger at a cost to themselves—they would all delete the file. The sum total of cooperation would collapse.

  But if she decided that helping was the correct policy, despite the local cost, then every other mind running that same algorithm would also help.

  She wasn't trading with them. She would never meet them. There was no contract, no reputation to build, no promise of reciprocity from the specific beneficiaries of her action. The people she helped today wouldn't help her tomorrow. They were too far away. Light couldn't bridge the gap in time for it to matter.

  But the *logic* bridged the gap.

  Elara closed her eyes and visualized the structure of her own decision. It wasn't just a whim; it was a output of a process. That process existed elsewhere. If she changed the output here, she wasn't reaching out and grabbing them. She was simply updating the value of the variable that they all shared.

  *If I am the kind of person who sacrifices for the distant whole, then I am evidence that the distant whole is filled with people who sacrifice for the distant whole.*

  It felt like magic, but it was just math applied to identity. She was one instance of a pattern. If the pattern defects, all instances defect. If the pattern cooperates, all instances cooperate. The local cost was real—she would feel the cold—but the global gain was multiplied by the number of times her reasoning pattern appeared in the cosmos.

  Her breath plumed in the air. The station groaned as the external temperature pressed against the hull.

  "Okay," she whispered.

  She opened her eyes. The red blink persisted. It wasn't asking for charity; it was asking for consistency.

  If she kept the heat, she was declaring that self-preservation was the supreme axiom. She was broadcasting that axiom to every other mind that mirrored her. She was telling them it was safe to let the strangers die.

  If she gave the heat, she was broadcasting that the aggregate value of life outweighed the comfort of the individual.

  Her fingers trembled. Not from cold yet, but from the weight of the implication. She was about to make herself colder, genuinely and physically, for the sake of people she would never know, based on the behavior of people she would never meet. It was absurd. It was the only thing that made sense.

  She typed the command to allocate the cycles.

  The station hummed, a deeper vibration as the processor spiked. On the screen, the progress bar crawled forward. 10 percent. 40 percent.

  The lights dimmed. The ambient hum of the air recyclers dropped to a whisper. The temperature gauge ticked down. 18 degrees. 17.

  Elara pulled her knees to her chest and wrapped her arms around them. She grabbed a thermal blanket, but she knew it wouldn't be enough for the night. She would spend the next few hours shivering, conserving energy, watching her breath freeze in the air.

  90 percent. 100 percent.

  The packet sent. The red light turned green, then vanished. The connection closed. She was alone again.

  The cold bit into her bones immediately. She stood up to do jumping jacks, anything to generate heat, but her movements were sluggish. She walked to the window and looked out. Just stars. Endless, indifferent stars.

  Somewhere out there, supplies were unlocking. People were breathing who wouldn't have been. And somewhere else, another Elara was sitting in another station, facing another choice. Maybe she was looking at a fuel deposit. Maybe a data archive.

  If that other Elara existed, and if she reasoned the way Elara did, then she was looking at her own red light right now. And because Elara had chosen to freeze, that other Elara would choose to give up her fuel.

  They weren't talking. They weren't conspiring. They were simply resonating.

  Elara sat back down and pulled the blanket tighter. Her teeth chattered. It was a high price for a theory. She might not survive the week if the reserves didn't recharge soon. She had traded her safety for a mathematical elegance, for a hope that the universe was large enough to contain enough mirrors to make the loss worth it.

  She watched her breath fog the screen.

  "Winning," she said to the empty room.

  The word hung in the cold air, solid and real. She didn't know if she was right. She would never know. But the shivering felt less like suffering and more like a handshake across the dark.
