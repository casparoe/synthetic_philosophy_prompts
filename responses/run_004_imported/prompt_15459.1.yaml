      *   *Weakness:* The move from "ecology gave up" to "political theory should" is a naturalistic fallacy risk. Ecology gave up because truth was elusive; politics might need boundaries for *stability*, not just truth.
      *   *Suggestion:* Emphasize that this is a pragmatic shift, not an ontological one.

