      *   *Refutation/Critique:* The user's suspicion is correct. It *does* relocate the regress. Who decides which issue triggers which demos? This is the "meta-boundary problem."
      *   *Complexity:* Managing multiple overlapping *demoi* creates coordination problems and accountability deficits. (If I vote on water but not roads, who ensures the road budget doesn't poison the water?)
      *   *Verdict:* It's a live position, not refuted, but recognized as having significant implementation and legitimacy hurdles.

  6.  **Address Question 4: General Feedback (Confusion/Overstatement):**
