      *   **Part 1: The Hempel Clash.** Focus on Inside/Outside. Hempel explains the "outside" (behavior) via laws. Collingwood explains the "inside" (thought) via re-enactment. Hempel makes the historian a passive classifier; Collingwood makes them an active re-thinker.
      *   **Part 2: The Narrativist Alliance (with caveats).**
          *   Collingwood *is* a narrativist in the sense that actions unfold in time according to plans.
          *   He would like Danto/Gallie (narrative as cognitive structure).
      *   **Part 3: The White Problem (The "Betrayal").**
