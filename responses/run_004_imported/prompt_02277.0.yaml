          *   Collingwood demands *evidence* of thought. If emplotment obscures the specific rational reconstruction, it's "scissors-and-paste" or worse, fiction.
          *   Collingwood wants truth (re-enacted thought); White wants coherence/aesthetic unity.
      *   **Conclusion:** Collingwood stands in the middle. Anti-positivist (vs. Hempel) but Anti-relativist/Realist (vs. White).

  7.  **Refining the "Weeds":**
