  *(Refining the White vs. Collingwood point)*: White argues that historical narratives are "verbal fictions." Collingwood argues history is a "science" (in the old sense of *scientia*, knowledge) distinct from art. For Collingwood, art is imagination, history is critical imagination. If White blurs that line too much, Collingwood rejects him.

  *(Final Plan)*:
  1. Hempel: Total rejection based on Inside/Outside.
  2. Narrativists (General): Cautious alliance on the form of explanation.
  3. White (Specific): Rejection based on the status of truth and the "imaginary" nature of emplotment.
