      *   **Object of History:** Not "events" in the natural sense, but "actions."
      *   **Inside/Outside Distinction:**
          *   *Outside:* The physical movement (Caesar crossing the Rubicon).
          *   *Inside:* The thought/thought-process motivating the action (Caesar's defiance of the Senate, his calculation of risk).
      *   **Re-enactment:** The historian must re-think the past thought in their own mind. History is the history of thought.
      *   **Critique of "Scissors-and-Paste":** Uncritical reliance on authority/testimony without questioning the *thought* behind it.
      *   **Naturalism:** History is *not* a natural science. Natural science deals with repeatable instances under laws; history deals with unique actions determined by free rational agents.
      *   **Explanation:** Explaining an action means understanding the *reason* for it, not subsuming it under a general law.

  3.  **Analyze Hempel's Covering Law Model (1942):**
      *   History should emulate natural sciences.
      *   Explanation = Subsumption under universal general laws (If C, then E).
      *   Implicitly treats human actions as observable behaviors determined by antecedent conditions.
      *   Ignores the "inside" (motivation/reason) in favor of the "outside" (observable regularity).

  4.  **Collingwood vs. Hempel (The Easy Part):**
      *   Collingwood would vehemently reject Hempel.
      *   *Why?* Hempel treats history as looking at "events" (outside), Collingwood looks at "actions" (inside).
      *   Hempel seeks prediction/generalization; Collingwood seeks understanding of unique rational agency.
      *   Hempel's laws are empirical generalizations; Collingwood's "laws" (if any) are laws of thought/logic, not causal regularities of behavior.
      *   *Key Phrase:* "All history is the history of thought." Hempel ignores thought.

  5.  **Collingwood vs. The Narrativists (The Hard Part):**
      *   **The Narrativists (Danto, Gallie, White, Ricoeur):**
          *   Focus on the *structure* of historical writing.
          *   History is a story/narrative.
          *   Explanation comes from the plot/emplotment, not laws.
          *   **Hayden White (specifically):** History is literary artifact. Tropes, emplotment, ideological implication. The past doesn't have a story; the historian *imposes* a story. Radical constructivism.
      *   **Collingwood's Potential Reaction:**
          *   *Agreement:* He agrees history is not a science. He agrees narrative form is inherent to recounting action (actions have beginnings, middles, ends based on intention).
          *   *Disagreement (The Crucial Nuance):* Collingwood is a *realist* about the past thought. The re-enactment must be critical. The narrative must track the *actual reasoning* of the agent.
          *   *White's Threat:* If White says the plot is a *literary imposition* (fictionalizing), Collingwood would hate that. For Collingwood, the "story" is discovered in the evidence of thought, not imposed by poetic trope.
          *   *Danto/Gallie:* Closer allies. They focus on narrative sentences and the logic of explanation without necessarily going full postmodern constructivist.

  6.  **Synthesizing the Argument:**
