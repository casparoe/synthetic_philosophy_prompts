  Okay so I had this whole argument with my friend last night about Adam Smith and empire (we're apparently a lot of fun at parties). She was saying he's basically the original anti-colonialist, because of how hard he goes after the mercantile system and the East India Company in Wealth of Nations, and I said that's not the same as being anti-empire -- his actual proposed fix was folding the colonies into Britain with seats in Parliament, not letting them go. Anyway it turns out this isn't just a bar argument anymore, because I'm on the little commitee in my econ department that has to respond to a student petition to rename our "Adam Smith Prize" for best senior thesis, on the grounds that he "provided the intellectual foundations for colonial exploitation" -- we vote on it next week. Can you draft the memo I'd circulate beforehand -- keep the name, change it, or some third option -- that seriously engages what he actually wrote about colonies instead of dodging into "we honor the economics, not the politics"? I need a real recommendation out of it, not a wishy-washy "there are many perspectives," and it should treat the petitioners' strongest point fairly even if you land on disagreeing with them.
