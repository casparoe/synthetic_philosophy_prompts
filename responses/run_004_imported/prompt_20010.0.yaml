answer: |-
  **Setting:** *A breakout session at the Annual Conference on Early Modern Philosophy. The room is crowded. Two chairs sit center stage. A moderator has just introduced the session: "Spinoza's Democracy: Radical Promise or Patriarchal Limit?"*

  **Participants:**
  *   **Dr. Elena Rossi:** Professor of Political Philosophy. Proponent of the "Radical Democracy" reading (influenced by Balibar, Negri).
  *   **Prof. Marcus Thorne:** Senior Lecturer in Intellectual History. Proponent of a contextualist, "Realist" reading.

  ***

  **Dr. Rossi:** Thank you. I want to begin by returning to the core ontological commitment of the *Theological-Political Treatise*. Spinoza tells us that democracy is the "most natural" regime because it approaches the condition of the state of nature most closely. Why? Because in the state of nature, no one is naturally subject to anyone else. When we form a democracy, we aren't alienating our right to a sovereign who stands *above* us; we are pooling our *conatus*, our striving, into a collective *multitudo*.

  Now, I know the objection. The *Political Treatise*, Chapter 11. The unfinished chapter on democracy. The argument that women should be excluded because they are "naturally" subject to men. My contention is this: We cannot read that exclusion as the logical culmination of Spinoza's system. It is a historical blind spot, a failure of imagination consistent with the 17th century but inconsistent with Spinoza's own principle that natural right is co-extensive with power. If the multitude is the source of sovereignty, restricting the multitude restricts the power of the state. Therefore, the exclusion of women weakens the very democracy Spinoza claims to defend.

  **Prof. Thorne:** Elena, with respect, that strikes me as wanting Spinoza to be *our* contemporary rather than reading the text we have. You call it a "blind spot." I call it a consistent application of his naturalism. You cite the principle: natural right equals power. *Quantum quisque potest, tantum juris habet.* As much as one can do, so much right one has.

  In the *Political Treatise*, Spinoza makes an empirical claim: No society has ever existed where men and women ruled equally. He infers from this universal historical fact that the inequality is not conventional, but natural. If right is power, and if—as Spinoza believed—women lack the physical or psychological power to hold dominion without causing social instability, then they literally do not have the "natural right" to citizenship in his framework. It's not a mistake; it's the cold logic of his realism. To say he "would have corrected it" is speculative theology, not philosophy.

  **Dr. Rossi:** But Marcus, that treats power as a static, pre-political fact. It isn't. For Spinoza, power is relational. It is generated *through* association. When I argue, following Balibar, that Spinoza is a radical democrat, I mean that his ontology undermines fixed hierarchies. If women are excluded from the public sphere, of course they appear "weaker" in terms of political power. That is a self-fulfilling prophecy, not a law of nature.

  Spinoza knows this. In the *Ethics*, affects are modified by interaction. If you exclude a segment of the population, you aren't measuring their natural power; you are actively diminishing it. So, when he writes in the *Political Treatise* that women are naturally subject, he is mistaking a political effect for a natural cause. The "Radical Democrat" reading doesn't ignore the text; it prioritizes the *TTP*'s structural insight over the *TP*'s empirical error.

  **Prof. Thorne:** I understand the appeal of saving Spinoza from himself. But consider the hermeneutic weight of that unfinished manuscript. He didn't just jot this down; he was working on it when he died. The argument breaks off mid-sentence, yes, but the trajectory is clear. He grounds the exclusion not on scripture—not on revelation, which he rejects in politics—but on "experience" and human nature.

  If we say, "Spinoza's *principle* is egalitarian, but his *application* was flawed," we risk making his philosophy unfalsifiable. If "Right = Power" justifies democracy when we assume men are equal, but justifies patriarchy when we assume men are stronger than women, then the principle itself isn't inherently egalitarian. It's merely descriptive of power dynamics. The *Political Treatise* reveals the dark side of the *multitudo*: it is not necessarily an inclusive body. It is whoever holds the swords. If women don't hold swords, they aren't in the multitude.

  **Dr. Rossi:** That's a Hobbesian reading of Spinoza, Marcus. "Whoever holds the swords." But Spinoza explicitly critiques the idea that sovereignty rests on coercion alone. In the *TTP*, he says a state where everyone is silent is a desert, not a commonwealth. The power of the state depends on *rational consent*, on the active engagement of citizens.

  If you exclude women, you create a faction within the state. You introduce a source of instability. Spinoza's own criterion for a good state is stability and freedom. An aristocracy of men ruling over subject women is prone to conflict, to the passions of jealousy and domination. So, even on pragmatic grounds, the exclusion fails Spinoza's own test. The fact that he stopped writing mid-argument suggests to me that he was hitting a wall. He was trying to force his radical ontology into a conservative conclusion, and the text literally snapped under the tension.

  **Prof. Thorne:** Or, it snapped because he died of consumption at forty-four. We must be careful not to romanticize the break-off as a philosophical aporia.

  But let's engage your point about instability. Spinoza might argue that including women would cause *more* instability, given the "passions" he attributes to them in that chapter. You say this is sexism; I agree it is sexism. But is it an *inconsistency*?

  Here is my worry with the Balibar/Negri line: It treats the "multitude" as a messianic category that *should* include everyone. But in the *Political Treatise*, the multitude is defined by who can actually agree on common laws. If Spinoza genuinely believed, based on the science of his day, that women were incapable of that agreement without being ruled by men, then excluding them *preserves* the power of the multitude. It prevents the state from fracturing. The tragedy isn't that Spinoza failed his own principles; it's that his principles—grounded in actual power capacities—licensed inequality.

  **Dr. Rossi:** But that's the crux of the disagreement, isn't it? Where do we locate the "natural"? For Spinoza, nature is dynamic. *Natura naturans*. To freeze the power dynamic of 17th-century Holland and call it "eternal natural law" violates the spirit of his metaphysics.

  When I defend the radical reading, I am arguing that Spinoza gives us the *tools* to dismantle that exclusion, even if he didn't use them all. The concept of *conatus* applies to all human beings. There is no teleological hierarchy in Spinoza's nature. Men are not "more perfect" than women in the *Ethics*. So, when he introduces that hierarchy in the *Political Treatise*, he is importing a prejudice that his own metaphysics forbids. The "Radical Democrat" reading says: Trust the metaphysics, correct the politics. The text is a resource, not a shrine.

  **Prof. Thorne:** I agree the text is a resource. But as historians of philosophy, we have to ask: What did *this* democracy look like to *this* author? If we edit out the patriarchy as a "contradiction," we sanitize the cost of his realism.

  You mentioned the *TTP* saying democracy keeps power closest to the state of nature. In the state of nature, Spinoza says, fish eat fish. The big have right over the small. If men are "bigger" or "stronger" in the relevant political sense, democracy—defined as the rule of the powerful multitude—might logically require the subjection of the weak. The *Political Treatise* forces us to confront that "Right = Power" is not a normative claim that we *ought* to be equal. It's an ontological claim that we *are* as unequal as our capacities.

  If you want to use Spinoza for feminist emancipation, you have to add a premise he didn't state: that women's capacity for reason and power is equal to men's. Spinoza didn't add that premise. He assumed the opposite. To pretend the *Political Treatise* is just a draft error is to ignore the moment where Spinoza's radicalism hits the wall of his historical reality.

  **Dr. Rossi:** I don't pretend it's an error. I call it a limit. And isn't that what makes the text alive for us? The tension between the *TTP*'s promise and the *TP*'s exclusion is where the work happens.

  If we accept your reading, Marcus, Spinoza becomes a theorist of *status quo* power. If the men hold the power, they have the right. If the colonizers hold the power, they have the right. That makes his political philosophy purely descriptive, devoid of critical bite. But the *TTP* argues for freedom of philosophizing, for expanding the power of the people against the theologians. That is a normative project.

  So, regarding the unfinished chapter: It carries weight, yes. But its weight is that of a warning. It shows us that without a deliberate commitment to equality, the "power of the multitude" can calcify into oligarchy—even a gendered one. The radical reading doesn't ignore the exclusion; it argues that Spinoza's *own* definition of power, properly understood as collective *potentia* rather than individual *potestas*, demands we overcome it. He didn't finish the sentence, perhaps, because the logic of freedom was pulling him one way, and the logic of domination the other.

  **Prof. Thorne:** And I would say the logic of domination won, at least in that chapter. But perhaps that's the value of the disagreement. You see a philosopher whose tools can build a house he never entered. I see a philosopher who built a house with a locked door, and we must acknowledge the lock exists before we try to pick it.

  **Dr. Rossi:** Then we agree on the lock, Marcus. We just disagree on whether the key was in his pocket, or if we have to forge it ourselves.

  **Prof. Thorne:** *(Nods)* Which, I suppose, is the only democratic question worth asking.

  ***

  **Moderator:** Thank you both. We have time for questions from the floor...
