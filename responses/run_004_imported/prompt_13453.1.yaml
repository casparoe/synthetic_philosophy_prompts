prompt: |-
  So a few weeks ago my sister and I got into it at a family dinner because I called her out for guilt-tripping our mom about money, and she shot back with "you did the literal same thing to Mom back in March, so you don't get to lecture me" -- and annoyingly, it kind of worked on me in the moment, even though I still think what she did was wrong. I've been turning it over ever since, mostly while doing dishes, and it turns out theres a whole philosophical literature on this exact move: whether being a hypocrite actually costs you the standing to blame someone, or whether that's just a rhetorical trick for shutting people up.

  I co-host a very small philosophy podcast (my mom and maybe eleven other people listen) and next episode's guest defends the "equal standing" account of hypocrisy and blame -- the view that what's wrong with hypocritical blame isn't that it's false, it's that the hypocrite is implicitly claiming an exemption for themselves that they refuse to extend to the person they're going after. Whenever anyone raises the obvious tu quoque worry with him, his go-to dodge is something like "that's a fact about the logic of justification, not the ethics of address," and he moves the conversation along before anyone pins down what that actually means for a real case.

  Could you draft eight or nine interview questions for him that don't just let him restate the view? I want at least one question that makes him spell out, with a concrete example, the difference between losing standing to blame someone and the original criticism being unwarranted or false; at least one on the "basically everybody is a hypocrite about something" worry -- doesn't his view mean almost nobody ever has standing to blame anybody for anything; and at least one on whether hypocrisy requires actually denying or hiding your own faults, or whether openly admitting you do the exact same thing is just as damaging to your standing. For each of those three, give me a plausible follow-up keyed to whatever answer he's likely to give, and end with one question that asks what it would take for him to admit the "standing" framework is doing less philosophical work than he thinks it is.
