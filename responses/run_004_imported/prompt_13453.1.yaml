answer: |-
  Here are nine interview questions designed to pin down your guest's view without letting him retreat into abstractions. They are ordered to build pressure throughout the conversation, starting with the core distinction and ending with the stakes of the theory.

  **1. The Core Claim**
  "Let's start with the 'equal standing' account. You argue that when a hypocrite blames someone, the problem isn't that their criticism is false, but that they lack the *standing* to deliver it. In plain English, does this mean a hypocrite can be factually right about my behavior, but still morally wrong to point it out? And if so, what is the specific moral harm they are committing in that moment?"

  **2. Standing vs. Truth (Concrete Example)**
  "I want to make sure our listeners can feel the difference between 'losing standing' and 'being wrong.' Can you walk us through a concrete, everyday scenario—maybe something like a parent scolding a child, or friends at a dinner—where Person A is 100% correct that Person B did something bad, but Person A has lost the standing to say it? I want to hear exactly what changes in the room if Person A keeps their mouth shut versus if they speak up."

  *   **Follow-up (Keyed to his likely answer):**
      *   *If he says the blame is 'infelicitous' or 'inappropriate' but the truth remains:* "Okay, so the truth is still on the table. Does that mean the hypocrite is morally obligated to stay silent? Or are they allowed to blame someone if they preface it by admitting their own fault? I'm trying to find out if 'standing' is a stop-sign or just a yield-sign."

  **3. The "Logic vs. Ethics" Distinction**
  "You've mentioned before that *tu quoque* arguments confuse the 'logic of justification' with the 'ethics of address.' That sounds like a crucial distinction, but it's also a place where this conversation usually gets foggy. Can you give us a real-world example where separating those two things actually changes the outcome of a moral disagreement? If I accuse you of hypocrisy, and you tell me that's just an 'ethics of address' issue, what work is that doing other than telling me I'm not allowed to speak?"

  **4. The "Clean Hands" Worry (Universal Hypocrisy)**
  "A common pushback on your view is the 'Clean Hands' problem. If losing standing requires having no faults similar to the one you're blaming, it seems like almost nobody has standing to blame anybody for anything, since we're all flawed. How do you avoid a scenario where moral blame becomes an elite privilege reserved only for the saints?"

  *   **Follow-up (Keyed to his likely answer):**
      *   *If he introduces a 'relevance condition' (e.g., the hypocrisy must be about the same specific act):* "Who gets to decide what counts as 'relevantly similar'? If I guilt-trip my mom about money, but you guilt-trip her about time, do you have standing to call me out? It feels like 'relevance' is subjective enough to let people talk their way back into standing whenever they want."

  **5. Admission vs. Behavior**
  "Does hypocrisy require *denying* your own fault, or is *doing* the thing enough to lose standing? If I stand up and say, 'Look, I guilt-trip Mom about money all the time, it's wrong, and you're doing it too,' have I preserved my standing? Or does the mere fact that I'm guilty of the same behavior disqualify me regardless of how honest I am about it?"

  *   **Follow-up (Keyed to his likely answer):**
      *   *If he says admitting it preserves standing:* "So the core wrong of hypocrisy isn't actually the double standard in behavior, it's the arrogance or the dishonesty? That seems to shift the theory from being about 'equal standing' to being about 'truthful address.' Are you comfortable with that shift?"

  **6. Proportionality of Fault**
  "Let's talk about scale. If I speed on the highway, do I lose the standing to blame someone for murder? Presumably not. But where is the line? Is there a point where the hypocrite's own sin is so much smaller than the target's sin that standing is restored? Or does any amount of similarity in kind wipe out your authority completely?"

  **7. Restoring Standing**
  "Is standing permanent, or is it temporary? If I lose my standing to blame you because I do the same thing, what do I have to do to get it back? Do I have to stop the behavior entirely? Do I have to apologize for my past instances? Or is there a statute of limitations on hypocrisy?"

  **8. The Target's Perspective**
  "We've focused a lot on the blamer, but what about the person being blamed? From their perspective, does it actually matter if the critic lacks standing? If my sister points out that I'm being selfish, and she's right, does her hypocrisy actually make her criticism less true, or does it just make me feel less like listening? Is 'standing' mostly about the listener's psychological receptivity?"

  **9. The Falsifiability Question**
  "To close, I want to ask about the utility of the framework itself. We use concepts like 'standing' to clarify moral conflicts. But what would it take for you to admit that the 'standing' framework is doing less philosophical work than you think it is? Is there a case where saying 'they lack standing' explains less than just saying 'they're being annoying' or 'they're being unkind'?"
