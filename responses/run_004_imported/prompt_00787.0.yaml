prompt: |-
  I'm taking an upper-level seminar this semester on Hobbes's natural and civil philosophy, and this week's reading pulled us out of Leviathan and into some of his more technical writings on mathematics and method, including the Epistle Dedicatory to Six Lessons to the Professors of the Mathematiques (1656) — his polemical response to John Wallis and Seth Ward, the Savilian professors at Oxford who had challenged his work in mathematics and natural philosophy. I brought the following passage up in office hours, but my professor only had time to mention "maker's knowledge" as a label before rushing off to a meeting, and none of the secondary readings on our syllabus actually gloss it. I was hoping you could help me reconstruct the argument properly:

  "Of arts, some are demonstrable, others indemonstrable; and demonstrable are those the construction of the subject whereof is in the power of the artist himself, who, in his demonstration, does no more but deduce the consequences of his own operation. The reason whereof is this, that the science of every subject is derived from a precognition of the causes, generation, and construction of the same; and consequently where the causes are known, there is place for demonstration, but not where the causes are to seek for. Geometry therefore is demonstrable, for the lines and figures from which we reason are drawn and described by ourselves; and civil philosophy is demonstrable, because we make the commonwealth ourselves. But because of natural bodies we know not the construction, but seek it from the effects, there lies no demonstration of what the causes be we seek for, but only of what they may be." (English Works, vol. VII, p. 184)

  What I'd like is less a paraphrase than an actual reconstruction of the reasoning. First, what precisely is doing the epistemic work here: is Hobbes saying that geometrical certainty comes from the fact that lines and figures are our own constructions, as opposed to, say, the self-evidence of axioms or the validity of the inferences drawn from them? Second, how is this supposed to license treating civil philosophy as equally "demonstrable" — a commonwealth seems like a far messier, more historically contingent object than a triangle, so what exactly is being preserved when Hobbes says "we make" it in the relevant sense? And finally, given the closing sentence about natural bodies, does the passage commit Hobbes to a genuinely different and weaker notion of scientific knowledge in physics than in geometry and politics, or is this just the standard early modern worry about underdetermination dressed up in his own vocabulary? I'd also appreciate it if you could flag any point where this seems to sit in tension with his broader materialism, since that's the piece I find hardest to square.
reasoning: |-
  Here's a thinking process that leads to the suggested reconstruction:

  1.  **Analyze the Request:**
      *   **Source Material:** A specific passage from Hobbes's *Epistle Dedicatory to Six Lessons to the Professors of the Mathematiques* (1656).
      *   **Context:** Upper-level seminar on Hobbes's natural and civil philosophy. The student's professor mentioned "maker's knowledge" but didn't elaborate. Secondary readings don't cover it.
      *   **Task:** Reconstruct the argument (not just paraphrase).
      *   **Specific Questions to Address:**
          1.  What is doing the epistemic work? (Construction vs. axioms/inference?)
          2.  How does this license civil philosophy as "demonstrable" despite historical contingency? (What is preserved in "we make"?)
          3.  Does this commit Hobbes to a weaker notion of scientific knowledge in physics? (Underdetermination vs. distinct epistemology?)
          4.  Where does this sit in tension with his broader materialism?

  2.  **Deconstruct the Passage:**
      *   *Premise 1:* Arts are either demonstrable or indemonstrable.
      *   *Criterion:* Demonstrable = construction of the subject is in the power of the artist.
      *   *Reasoning:* Science derives from precognition of causes/generation/construction.
      *   *Implication:* If causes are known (because we made them), demonstration is possible. If causes are unknown (we seek them from effects), only hypothetical demonstration ("what they *may* be") is possible.
      *   *Application 1:* Geometry is demonstrable (we draw the lines/figures).
      *   *Application 2:* Civil philosophy is demonstrable (we make the commonwealth).
      *   *Application 3:* Natural philosophy (physics) is indemonstrable (we don't know the construction of natural bodies, only effects).

  3.  **Address Question 1: Epistemic Work (Construction vs. Axioms):**
      *   *Standard View:* Math is certain because of logical deduction from self-evident axioms.
      *   *Hobbes's View:* Math is certain because *we generate the objects*.
      *   *Key Concept:* "Maker's Knowledge" (Verum Factum principle, though Vico is more famous for it, Hobbes holds a version).
      *   *Reasoning:* To know something scientifically (via *scientia*), you must know its *cause*. If I create the object, I know the cause of its existence and properties by definition. I don't need to observe it to find out what it is; I stipulated it.
      *   *Conclusion:* It is the *ontological status* of the object (as artifact) that grounds the epistemic certainty, not just the logical form.

  4.  **Address Question 2: Civil Philosophy (Commonwealth vs. Triangle):**
      *   *Problem:* Commonwealths seem messy/historical. Triangles are abstract.
      *   *Hobbes's Move:* He isn't talking about *existing* historical commonwealths (England, France, etc.). He is talking about the *concept* or the *ideal generation* of a commonwealth.
      *   *The "Making":* The social contract. We (theoretically) construct the sovereign authority through covenant.
      *   *What is preserved:* The *generative principles*. Just as a geometer defines a circle by its generation (rotation of a line), Hobbes defines the Commonwealth by its generation (covenant of every man with every man).
      *   *Nuance:* This is normative/prescriptive. We *can* make it this way. If we do, the consequences follow necessarily. It treats politics like engineering, not like biology.

  5.  **Address Question 3: Natural Philosophy (Physics):**
      *   *Claim:* Physics is weaker ("what they *may* be").
      *   *Reason:* We didn't make nature. God did (or it's eternal). We only see effects (motion, color, etc.).
      *   *Underdetermination:* Yes, this is essentially underdetermination. Multiple causal stories could explain the same phenomenon.
      *   *Is it weaker?* Yes, strictly speaking. It's hypothetical. "If motion is caused by X, then Y follows." But we can't be sure it *is* X.
      *   *Hobbes's Goal:* He still tries to build a system of physics (*De Corpore*), but he acknowledges this limitation compared to geometry/politics. He wants to reduce physics to geometry (motion of bodies), but the *origin* of that motion is often opaque.

  6.  **Address Question 4: Tension with Materialism:**
      *   *Materialism:* Everything is body in motion. Mind, state, God (arguably) are material or reducible to matter.
      *   *Tension:* If everything is matter in motion, why is there an epistemic gap between human artifacts (geometry/state) and natural bodies? Both are just matter.
      *   *Resolution:* The gap isn't ontological (both are matter); it's *epistemological* (access to causes). We have privileged access to our own voluntary motions/intentions in creating artifacts. We don't have access to the "intentions" or ultimate origins of natural motion.
      *   *Deeper Tension:* If the mind is material, is the "making" of geometry just a physical process? If so, why does it yield certainty while other physical processes don't? Hobbes relies on a notion of "reasoning as reckoning" which mirrors the construction.
      *   *Theological Tension:* If God made nature, only God has "maker's knowledge" of nature. Hobbes hints at this. This limits human science to the artificial realm.

  7.  **Drafting the Reconstruction (Iterative Process):**
      *   *Introduction:* Acknowledge the "Maker's Knowledge" principle (*verum ipsum factum*).
      *   *Section 1 (Epistemic Ground):* Focus on "Cause." Science = Knowledge of Causes. We know causes of what we make. Therefore, we have science of what we make. Contrast with axiomatic view.
      *   *Section 2 (Civil Philosophy):* Distinguish between *de facto* states and *de jure* generation. The "Commonwealth" is a logical construct generated by contract. Analogy: Geometer drawing a circle vs. looking at a wheel.
      *   *Section 3 (Natural Philosophy):* Confirm the weaker status. It's hypothetical. Connect to underdetermination.
      *   *Section 4 (Materialism Tension):* Highlight the Ontology vs. Epistemology split. The world is uniform (matter), but our access is not. Mention the theological implication (God as the only true scientist of nature).

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure not to conflate Hobbes with Vico. Vico made this famous later, but Hobbes has it here.
      *   *Nuance:* Be careful with "Civil Philosophy." Hobbes isn't saying history is demonstrable. He's saying the *right* of sovereignty and the *structure* of the state are demonstrable because they stem from a definable act of will.
      *   *Materialism:* Ensure the distinction is clear: Materialism says *what exists*. Maker's Knowledge says *what we can know with certainty*. They operate on different axes.

  9.  **Final Polish:** Check against the user's specific prompts.
      *   Epistemic work? (Cause/Generation).
      *   Civil philosophy license? (Contract as generation).
      *   Physics weaker? (Yes, hypothetical).
      *   Materialism tension? (Ontological unity vs. Epistemic privilege).

  10. **Final Output Generation** (Proceed to generate response based on these structured thoughts).
answer: |-
  This is a classic statement of the **principle of *verum ipsum factum*** (the true is the made), though Hobbes articulates it here in terms of "demonstrability" rather than truth *simpliciter*. Your professor was right to flag "maker's knowledge," but the implications for Hobbes's system are radical.

  Here is a reconstruction of the argument, broken down by your specific questions.

  ### 1. The Epistemic Work: Construction vs. Axioms
  You asked whether the certainty comes from the self-evidence of axioms or the fact that we construct the objects. In this passage, Hobbes is explicitly arguing for the latter.

  **The Argument:**
  1.  **Definition of Science (*Scientia*):** To have scientific knowledge of a subject is to know its **causes** (specifically, its generation or construction).
  2.  **Condition of Causal Knowledge:** We can only have certain knowledge of a cause if we are the agents of that cause. (If I observe an effect without making it, I can only guess at the cause.)
  3.  **Application to Geometry:** Geometrical figures are not discovered in nature; they are **generated** by the definitions and postulates we stipulate (e.g., a circle is generated by rotating a line around a fixed point).
  4.  **Conclusion:** Geometrical certainty is not grounded merely in logical validity (though that is required), but in the **ontological status of the object as an artifact**. We know the properties of a triangle with certainty because we defined into existence the very conditions that make it a triangle.

  **Why this matters:** This opposes the view that math is certain because it deals with eternal, abstract truths independent of human action. For Hobbes, math is certain *because* it is human-made. If the objects of geometry existed independently of us (as Platonic forms or physical approximations), we could not demonstrate their properties with absolute certainty; we could only hypothesize about them, just as we do with stars or animals.

  ### 2. Civil Philosophy: The Commonwealth as Artifact
  This is the most controversial move. You noted that commonwealths seem messier than triangles. Hobbes anticipates this. He is not claiming that *existing* historical states (like 17th-century England) are demonstrable objects. They are messy, contingent, and often irrational.

  **The Reconstruction:**
  1.  **Distinction:** Hobbes distinguishes between the *de facto* history of states and the *de jure* generation of the concept "Commonwealth."
  2.  **The Generative Act:** Just as a geometer generates a circle by a specific motion, citizens generate a Commonwealth through a specific act: the **Covenant** (the mutual transferring of rights to a Sovereign).
  3.  **Epistemic Privilege:** Because the Commonwealth is an artificial person created by human will and agreement, we know its "causes" (the passions and reasoning that drive men to covenant) and its "construction" (the sovereign structure).
  4.  **Demonstrability:** Therefore, we can deduce the necessary consequences of that construction (e.g., "If sovereignty is divided, the commonwealth dissolves").

  **What is preserved?**
  Hobbes is preserving the **normative structure of generation**, not the empirical history. He treats political philosophy like engineering. An engineer can demonstrate what *must* happen if a bridge is built according to specification $X$, even if many actual bridges are built poorly. Similarly, Hobbes claims to demonstrate what *must* follow from the institution of a Sovereign, regardless of whether actual kings follow his advice. The "making" is the act of will instituting the sovereign power; because we understand the psychology of that will (fear of death, desire for commodious living), we have causal knowledge.

  ### 3. Natural Philosophy: Hypothetical Science
  The closing sentence confirms that Hobbes commits to a genuinely weaker notion of knowledge in physics (*natural philosophy*).

  **The Argument:**
  1.  **Natural Bodies are Not Made by Us:** We do not generate stars, animals, or elements. We encounter them as finished effects.
  2.  **Causal Opacity:** Since we did not construct them, we do not have privileged access to their causes. We must reason backward from effects to possible causes.
  3.  **Underdetermination:** Multiple different causal mechanisms could produce the same observable effect. (e.g., Is heat a motion of particles or a fluid? Both might explain the phenomena.)
  4.  **Conclusion:** Natural philosophy yields only **conditional knowledge**: "If the cause is $X$, then the effect $Y$ follows." It cannot assert "The cause *is* $X$."

  **Is this just standard underdetermination?**
  It is underdetermination, but it is rooted in Hobbes's specific definition of *scientia*. For Hobbes, to "know" is to know the *generation*. Since we cannot know the generation of nature (unless we are God), we cannot have *scientia* of nature in the strict sense. We have "prudence" or "hypothesis." This is a significant limitation. It means *De Corpore* (his book on body/matter) is theoretically less certain than *De Cive* or *Leviathan*.

  ### 4. Tension with Materialism
  This is the sharpest philosophical tension in the passage.

  **The Tension:**
  *   **Ontological Monism:** Hobbes is a materialist. Everything that exists is body. Human minds, commonwealths, triangles (drawn in sand), and stars are all ultimately matter in motion.
  *   **Epistemic Dualism:** Yet, this passage creates a two-tiered epistemology. We have certain knowledge of artifacts (geometry, politics) but only hypothetical knowledge of natural bodies.

  **Why is this a problem?**
  If everything is just matter in motion, why does the *origin* of the motion (human will vs. natural cause) change the *knowability* of the object? If the mind is material, then "making" a geometric proof is just a physical process in the brain. Why does that physical process grant certainty that observing another physical process (a planet orbiting) does not?

  **Possible Resolutions (and their costs):**
  1.  **The Theological Escape:** Hobbes hints elsewhere that only God has true *scientia* of nature because only God made nature. Human science is limited to the "Kingdom of Darkness" (artificial things). This saves the epistemology but risks making human physics mere guesswork, which undermines his ambition to be the "Galileo of politics" *and* matter.
  2.  **The Phenomenological Defense:** We have internal access to our own voluntary motions (will/intention) that we lack regarding external bodies. We know *why* we drew the line; we don't know *why* the stone fell (other than by hypothesis). This relies on a introspective privilege that sits uneasily with strict materialism.
  3.  **The Methodological Unity:** Hobbes tries to bridge this by reducing physics to geometry. If all natural motion can be described geometrically, we can treat physics *as if* it were demonstrable. But the passage you quoted admits this is a fiction.

  **Summary for your Seminar:**
  Hobbes is arguing that **certainty is a function of agency**. We are certain about geometry and politics because they are products of our own definition and will. We are uncertain about physics because we are observers, not creators, of nature.
  *   **Strength:** It unifies math and politics as "civil sciences" (sciences of the artificial).
  *   **Weakness:** It demotes physics to a hypothetical status.
  *   **Tension:** It creates an epistemic hierarchy that is hard to square with the claim that humans and their creations are just complex machines within the same material universe they cannot fully understand.

  If you want to press your professor, ask: *"Does Hobbes's materialism ultimately undermine his maker's knowledge principle? If my mind is just matter in motion, is my 'construction' of a triangle genuinely different in kind from nature's 'construction' of a storm, or is the distinction merely pragmatic?"*
