answer: |-
  Your gut feeling is correct. Your friend is using a classic ethical framework called **Act Utilitarianism** (trying to maximize overall happiness/minimize overall suffering), but his calculation contains several critical flaws in how it assigns value to different types of harm.

  This is a famous type of philosophical problem (often called the "Utility Monster" or "Torture vs. Dust Specks" problem). Here is exactly where his logic breaks down.

  ### 1. The Category Error (Intensity vs. Duration)
  Your friend is treating "mild annoyance" and "risk of death/anaphylaxis" as the same currency, just in different amounts. They aren't.

  In ethics and risk management, harms are not linear.
  *   **Student A (Allergic):** The harm isn't just "inconvenience." It is the risk of **death**, permanent injury, or debilitating terror.
  *   **Student B (Non-Allergic):** The harm is **preference frustration**. They can't eat *this* sandwich; they must eat *that* sandwich.

  If you assign a "pain score" of 1 to "can't eat a Reese's Cup" and a pain score of 1,000,000 to "dying or nearly dying," the math flips instantly. Most ethical frameworks agree that preventing catastrophic harm to one person outweighs minor inconveniences to many. If we used your friend's math, we could justify almost anything: *"It's a minor inconvenience for 1,000 kids to watch 1 kid get bullied, so let's allow it."*

  ### 2. Rights and Duty of Care
  Schools are not free markets; they are custodial institutions.
  *   **The Right to Education:** To learn, a student must feel safe. If a student is terrified that lunch could kill them, their access to education is compromised.
  *   **No Right to Peanuts:** There is no fundamental human right to eat a specific food. There *is* a right to safety and education.
  *   **Duty of Care:** The school has a legal and ethical obligation to provide a safe environment. Accommodating a life-threatening medical condition (which is often classified as a disability under laws like the ADA in the US) is a "reasonable accommodation." The burden of changing a lunch menu is not considered "undue hardship."

  ### 3. Risk Management Logic
  We make decisions based on risk severity, not just aggregate annoyance, all the time.
  *   **Seatbelts:** Wearing a seatbelt is annoying for millions of drivers every day. It takes seconds, it wrinkles clothes, it restricts movement. If you did your friend's math, the total "annoyance seconds" of the entire population over decades is massive. But we mandate them because the *consequence* of not wearing them is death.
  *   **Airport Security:** TSA lines cause millions of hours of "mild annoyance" annually. Do we ban them because the aggregate time wasted is huge? No, because the risk being mitigated is catastrophic.

  ### 4. The "Fairness" Fallacy
  Your friend's argument implies that the allergic student is asking for a "favor." In reality, the ban is about **equity**.
  *   For 2,000 kids, a peanut ban is a **preference** change.
  *   For the 1 kid, a peanut ban is an **access** issue.

  Without the ban, the playing field isn't level. The 2,000 kids get to eat normally *and* be safe. The 1 kid has to choose between eating and being safe. The ban levels the field so everyone is safe; it doesn't give the allergic kid an "advantage," it just removes a lethal obstacle.

  ### 5. Community vs. Aggregation
  Finally, there is a social contract argument. A school is a community, not just a collection of individuals.
  *   **Solidarity:** Part of being in a community is accepting minor burdens to protect vulnerable members.
  *   **Precedent:** If the school decides that the comfort of the majority always trumps the safety of the minority, it sets a dangerous precedent for how that school treats other vulnerable groups (students with other disabilities, social outcasts, etc.).

  ### Where your friend might have a point (Nuance)
  The only area where your friend's logic holds water is **efficacy**.
  Some allergists actually argue *against* total bans because they create a "false sense of security." Kids might stop washing hands, or the allergic kid might think it's safe to eat something that was cross-contaminated. Some schools opt for "allergen-aware tables" instead of total bans.
  *   **If** the ban doesn't actually make her safer, **then** it is purely suffering for no gain.
  *   **But,** that is a practical objection, not an ethical one. Your friend is arguing that even if it *does* save her, it's not worth it. That is where the ethics fail.

  ### Summary
  Your friend is missing the **weight** of the variables. He is counting *seconds of annoyance* but ignoring *severity of consequence*.

  **The Fix:** Tell him to redo the napkin math, but instead of counting "number of people," weigh the "severity of outcome."
  *   2,000 kids $\times$ "I'm bummed I can't have peanut butter" = **Negative Utility.**
  *   1 kid $\times$ "I might go into anaphylactic shock and die" = **Infinite/Catastrophic Negative Utility.**

  In almost any ethical system, preventing a catastrophe outweighs preventing a mass inconvenience. Your gut feeling is right: the math is technically sound, but the inputs are morally wrong.
