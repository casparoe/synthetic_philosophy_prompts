answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name]. I spent my life watching paper wasps sting each other's relatives, which Meg tells me makes me "uniquely qualified" to speak about human kindness.

  I know we have a divided room tonight. About half of you are biologists who can recite Hamilton's Rule in your sleep. The other half are Meg's family and neighbors, who are currently wondering if "Hamilton's Rule" is a type of scotch.

  Here is the challenge Meg's career presents to me. For forty years, Meg argued that altruism—selfless help—is driven by genetics. She championed the idea that we help those who share our genes. She was a warrior for "Kin Selection." In 2011, when a group of theorists tried to argue that groups matter more than genes, Meg didn't just disagree. She helped organize a rebuttal signed by 137 of the fiercest evolutionary biologists on the planet. To the biologists in the room: you know the heat of that summer. To the family: imagine a petition signed by 137 tenured professors, which, in academia, is basically a declaration of war.

  But standing here, looking at this room, I realized I can't just talk about wasps. I need to talk about *us*. And specifically, I need to talk about why I am standing here at all.

  I actually tried to apply Meg's favorite equation to this toast. It's called Hamilton's Rule. It states that an altruistic act is worth it if the Benefit to the recipient, multiplied by the Relatedness to the recipient, is greater than the Cost to the giver. $rB > C$.

  So, I ran the numbers.
  The **Benefit ($B$)**: Meg gets a nice speech, and hopefully, you all get to go home early. That's high.
  The **Cost ($C$)**: I have to stand up, risk saying something foolish, and pay for this round of drinks. That's moderate.
  The **Relatedness ($r$)**: This is where the model breaks. Meg and I are not kin. Genetically, $r$ is zero.

  According to the theory Meg defended for four decades, I should not be standing here. I should be sitting down, conserving my energy, and letting someone who shares my DNA give this toast. Biologically, my friendship with Meg is an anomaly. I am an evolutionary puzzle.

  And that, I think, is the greatest tribute to her I can offer.

  Meg spent her professional life proving that nature is calculated, that help is usually a transaction of shared DNA. But her *actual* life proved the exception. She mentored students who weren't her children. She fought for colleagues who weren't her sisters. And she has been my friend for forty years, despite knowing exactly how many errors I made in my 1998 dataset.

  This brings me to the concept of "Worker Policing." In a wasp nest, if a worker tries to cheat and lay her own eggs, the other workers police her. They stop the cheater. Meg was the best worker polisher I ever knew. When I had a bad idea, Meg policed it. When I was being selfish, Meg policed it. She kept the hive honest.

  To the family: You might call that "being a good friend." To the biologists: That's enforcing cooperative stability. It's the same thing.

  There is a temptation in these debates to choose a side. Is it the Gene? Or is it the Group? Kin or Colony? But looking at Meg, I think the answer is both. She taught us that we are driven by deep, ancient biological rules. But she also showed us that we can transcend them.

  She built a career on the idea that we help our own. But she spent forty years helping *us*. Her students. Her colleagues. Her neighbors. She expanded the circle of "kin" until it included everyone in this room.

  So, I propose a revision to the rule. For Meg, the Relatedness coefficient isn't about DNA. It's about shared history. It's about how many conferences you survived together, how many grant rejections you cried over, and how many times she told me my statistical model was garbage. By that metric, our $r$ is 1.0. We are identical.

  Meg, you spent your life explaining why living things help each other. But you never needed an equation to explain why you helped me.

  To the biologists: May your residuals always be normal.
  To the family: May you never have to explain what a "p-value" is at Thanksgiving.
  And to Meg: You proved that while genes may be the unit of selection, friendship is the unit of survival.

  Cheers.
