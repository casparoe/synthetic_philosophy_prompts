answer: |-
  **MEMORANDUM**

  **TO:** The Frege Lecture Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Frege Lecture Name

  As we prepare to vote in three weeks on the future of the Frege Lecture, I am writing to share my considered recommendation. After reviewing the circulated diary passages from 1924 and discussing the implications with colleagues, I recommend we adopt the third option: **retain the name "Frege Lecture" but institute a permanent, mandatory framing statement to be read at the opening of each event and published on all related materials.**

  My reasoning rests on the specific mission of our department and the nature of philosophical inheritance. Frege's contributions to logic and the philosophy of language—the *Begriffsschrift*, the sense/reference distinction—remain foundational. To retire the name quietly risks severing the historical continuity of our discipline and treating intellectual history as a matter of hagiography rather than critical engagement. However, to keep the name without qualification is no longer tenable. The diary entries reveal not merely private prejudices, but a public commitment to stripping citizens of rights based on ancestry. This contradicts the universalist aspirations of logic itself.

  A permanent framing statement allows us to hold these two truths simultaneously. It honors the intellectual architecture Frege built while explicitly disavowing the moral and political failures of the architect. It transforms the lecture series from a monument into a site of critical reflection. We can acknowledge, as Michael Dummett did, that one can be a profound logician and a failed human being, and that the latter casts a shadow over the former that must be named, not hidden.

  I want to engage honestly with the strongest argument for the alternative: **retiring the name entirely.**

  The case for retirement is morally potent. It argues that a name is not merely a label but an endorsement of community values. For our Jewish colleagues, students, and guests, hearing the Frege Lecture celebrated without significant qualification can feel like an exclusionary signal, suggesting that their full standing in the department is secondary to the preservation of a canon that explicitly denied their ancestors' standing. Furthermore, my colleague's point during our recent debate struck me as decisive: Frege's crusade against psychologism relied on the idea that logical laws are objective and binding on *every* thinker, independent of circumstance. His insistence that political rights depend on ancestry violates this very objectivity. There is a genuine incoherence in invoking Frege's name for universal reason when he denied universal political standing. Retiring the name would be a clean ethical break, signaling that we prioritize inclusivity over historical continuity.

  While I acknowledge the force of this argument, I worry that retirement functions as a form of erasure. It removes the opportunity to use Frege's legacy as a teaching moment about the relationship between philosophical rigor and ethical blindness. A framing statement does not ask marginalized members of our community to tolerate antisemitism; rather, it asks the community to witness a formal condemnation of it alongside the celebration of the work.

  **Proposed Implementation:**
  The framing statement should be brief, drafted by the committee, and approved by the department chair. It should acknowledge Frege's foundational contributions, explicitly cite his documented antisemitism and anti-democratic views, and state that the department rejects those views while engaging with his logic.

  I look forward to discussing this proposal at our next meeting.

  Best,

  [Your Name]
