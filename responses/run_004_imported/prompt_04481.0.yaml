      *   **Format:** A dialogue between Rousseau and Diderot.
      *   **Tone:** Both figures must be sharp, engaging directly with each other's arguments, not just restating positions. No clear winner (philosophical stalemate or nuanced understanding).
      *   **Specific Focus:** Can Diderot's *reformed* theater overcome Rousseau's objection about the *form* of spectatorship?

  2.  **Character Voices & Philosophies:**
      *   **Rousseau:** Passionate, suspicious of artifice, prioritizes authenticity, community, and active citizenship. Sees theater as isolation disguised as gathering. Key concept: *Amour-propre* (vanity/social comparison) vs. *Amour de soi* (natural self-love). The "gap" between stage and seat.
      *   **Diderot:** Rational, Enlightenment optimism, believes in the power of representation to educate, values craft and technique. Sees theater as a moral laboratory. Key concept: The "Fourth Wall" (implicitly), the actor's control as a model of reason over passion.

  3.  **Drafting - Section by Section:**

      *   **Setting the Scene:** Needs to be intimate but tense. A salon or a private meeting in Paris. Let's place it in the 1750s, shortly after the *Letter to d'Alembert* (1758), when the rift was fresh.
      *   **Opening:** Diderot initiates, trying to bridge the gap. Rousseau is defensive.
      *   **Round 1: The Nature of Pity/Sympathy.**
