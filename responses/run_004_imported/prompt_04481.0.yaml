      *   Check that specific terms (*Letter to d'Alembert*, *Paradox*, *Geneva*, *Paris*) are woven in naturally.
      *   Make sure the "passive spectator" vs. "co-author" point lands hard.

  7.  **Final Review against constraints:**
      *   Dialogue format? Yes.
      *   Rousseau/Diderot voices? Yes.
      *   Specific disagreement (reformed theater vs. form of spectatorship)? Yes.
      *   Equally sharp? Yes.

