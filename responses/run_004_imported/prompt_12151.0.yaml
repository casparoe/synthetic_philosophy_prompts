prompt: |-
  I cover cognitive science and philosophy of mind as a science journalist, and next week I'm interviewing a theoretical neuroscientist for a profile piece on the free energy principle, which she champions as a grand unifying theory of the brain and, increasingly, of life itself. Her go-to move when pressed on objections is to say critics are demanding the wrong kind of falsifiability from the wrong kind of theory. Draft eight to ten interview questions that don't just let her restate the framework. Include one that presses the "dark room problem" — why organisms seek novelty rather than retreat to static, fully predictable environments, if minimizing prediction error is the brain's whole purpose — and pushes past the standard appeal to expected free energy and epistemic value; one that forces her to say plainly whether the principle is a tautological description that any self-organizing system satisfies by definition, or a falsifiable claim about how the brain specifically is built and wired; and one asking whether applying the same formalism to cells, immune systems, and whole societies leaves it anything specific to say about cognition at all. For each question, add a short follow-up keyed to the answer she's most likely to give.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Role:** Science Journalist (covering cognitive science/philosophy of mind).
      *   **Subject:** Theoretical Neuroscientist (champion of the Free Energy Principle - FEP).
      *   **Topic:** FEP as a grand unifying theory of brain/life.
      *   **Subject's Defense Strategy:** Dismisses critics by claiming they demand the wrong kind of falsifiability/theory type.
      *   **Task:** Draft 8-10 interview questions.
      *   **Constraints:**
          *   Don't let her just restate the framework.
          *   Must include a specific question on the "Dark Room Problem" (pushing past standard "expected free energy/epistemic value" answers).
          *   Must include a specific question on Tautology vs. Falsifiability (is it true by definition or empirically testable?).
          *   Must include a specific question on Scope/Specificity (does applying it to everything make it say nothing about cognition?).
          *   Each question needs a short follow-up keyed to her likely evasive answer.

  2.  **Deconstruct the Free Energy Principle (FEP) & Active Inference:**
      *   *Core Idea:* Systems minimize variational free energy (surprise/prediction error).
      *   *Claim:* Explains perception, action, learning, life, evolution.
      *   *Criticism:* Too broad, unfalsifiable, tautological, doesn't explain *mechanisms*, ignores biological constraints.
      *   *Proponent's Defense:* It's a "principle" (like least action), not a specific model. It defines the *space* of possible models.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The Tautology Trap (Required).*
          *   *Draft:* Is this just a tautology?
          *   *Refinement:* Needs to be sharper. Frame it around the "any self-organizing system" claim.
          *   *Follow-up:* She will likely say it's a "mathematical necessity." Push back: Does that make it scientifically empty?

      *   *Question 2: The Dark Room Problem (Required).*
          *   *Draft:* Why don't we sit in dark rooms if we minimize surprise?
          *   *Refinement:* Acknowledge the standard answer (expected free energy/epistemic value) but demand a mechanism. Why *this* specific prior for novelty? Where does it come from?
          *   *Follow-up:* She will likely say "evolution selected these priors." Push back: Then isn't evolution the real explanation, not FEP?

      *   *Question 3: Scope/Specificity (Required).*
          *   *Draft:* If it applies to cells and societies, what does it say about the brain?
          *   *Refinement:* Focus on the loss of explanatory power. If the equation is the same for a neuron and a nation, is "cognition" just an analogy?
          *   *Follow-up:* She will likely say "it's scale-invariant." Push back: Does that erase the distinction between thinking and metabolism?

      *   *Question 4: The "Wrong Falsifiability" Defense.*
          *   *Draft:* You say critics want the wrong falsifiability. What kind do you want?
          *   *Refinement:* Pin her down. If it can't be proven wrong in a specific experiment, what status does it have? Metaphysics?
          *   *Follow-up:* She will compare it to natural selection or thermodynamics. Push back: Those have specific mechanisms (genetics, particles). Where are FEP's particles?

      *   *Question 5: Neural Implementation.*
          *   *Draft:* How is this wired in the brain?
          *   *Refinement:* Connect the math to the meat. Gradient descent vs. spiking neurons.
          *   *Follow-up:* She will say "approximate inference." Push back: Approximations cost energy. Does FEP account for the cost of computing FEP?

      *   *Question 6: Competing Theories.*
          *   *Draft:* What about predictive processing or connectionism?
          *   *Refinement:* Is FEP replacing these or absorbing them? If absorbing, does it lose their specific predictive power?
          *   *Follow-up:* She will say "it's the umbrella." Push back: Does an umbrella explain the rain?

      *   *Question 7: Pathology/Misfunction.*
          *   *Draft:* How does this explain mental illness?
          *   *Refinement:* If the brain minimizes free energy, what is schizophrenia? Too much precision? Too little?
          *   *Follow-up:* She will give a parameter tweak answer. Push back: Can you specify the parameter *before* seeing the symptom, or is it post-hoc fitting?

      *   *Question 8: The "Grand Unified Theory" Claim.*
          *   *Draft:* Is this a Theory of Everything?
          *   *Refinement:* Physics envy. Is this helpful or hubristic?
          *   *Follow-up:* She will say "unification is good." Push back: Unification without mechanism is just labeling.

      *   *Question 9: Alternatives/Null Hypothesis.*
          *   *Draft:* What would prove you wrong?
          *   *Refinement:* Frame it as a bet. What observation would make you abandon FEP?
          *   *Follow-up:* She might struggle here. Push for a concrete neural finding.

      *   *Question 10: The Journalist's Closing (Philosophical Implication).*
          *   *Draft:* What does this mean for free will?
          *   *Refinement:* If we are just error-minimizing machines, is agency an illusion?
          *   *Follow-up:* She will say "agency is inference." Push back: Is that a meaningful definition of agency?

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Dark Room included? Yes. Tautology included? Yes. Scope included? Yes. Follow-ups included? Yes.
      *   Tone check: Needs to be professional but incisive. Not hostile, but skeptical. Avoiding jargon where possible, or using it correctly to show competence.
      *   *Self-Correction on Follow-ups:* Ensure the follow-up anticipates the *specific* evasion mentioned in the prompt (e.g., "wrong kind of falsifiability").

  5.  **Final Polish:** (Writing the output based on the above plan). *Make sure the "Dark Room" follow-up specifically blocks the "epistemic value" escape route.* *Make sure the "Tautology" follow-up forces a distinction between mathematical truth and empirical claim.*

  6.  **Final Count:** 10 Questions.

      *   Q1: Tautology vs. Empirical Claim.
      *   Q2: Dark Room (Novelty).
      *   Q3: Scope (Cells to Societies).
      *   Q4: Falsifiability Defense.
      *   Q5: Neural Mechanism (The "How").
      *   Q6: Post-hoc Explanation (Psychiatry).
      *   Q7: Computational Cost.
      *   Q8: Competing Frameworks.
      *   Q9: The "Null" Scenario.
      *   Q10: Agency/Will.

      *Wait, I need to ensure the follow-ups are tight.*
      *   *Q1 Follow-up:* If she says "mathematical necessity," ask if math describes nature or dictates it.
      *   *Q2 Follow-up:* If she says "epistemic value," ask where the *drive* for that value comes from if not FEP itself.
      *   *Q3 Follow-up:* If she says "scale invariant," ask if the word "cognition" loses meaning.

      *Let's assemble.*
answer: |-
  Here are ten interview questions designed to navigate around restatements of the framework, along with targeted follow-ups based on the likely responses.

  **1. The Tautology Trap**
  "Critics often argue that because any self-organizing system that persists must, by definition, resist disorder, describing them as 'minimizing free energy' is a tautology—a mathematical truth rather than an empirical discovery. Is the Free Energy Principle a falsifiable claim about how the brain is specifically wired, or is it a description that any surviving system satisfies simply by virtue of surviving?"
  *   **Follow-up:** "If it's the latter—if it's a mathematical necessity like the laws of thermodynamics—then what empirical observation could ever prove it false? If nothing can falsify it, doesn't that move it from neuroscience into metaphysics?"

  **2. The Dark Room Problem (Novelty vs. Stasis)**
  "If the brain's fundamental imperative is to minimize prediction error and surprise, the optimal state should be a dark, silent room where sensory input is perfectly predictable. Yet organisms actively seek novelty, risk, and information. You usually answer this by invoking 'expected free energy' and the value of epistemic foraging. But where does the *prior* for epistemic value come from? If the system has to be pre-tuned to value learning over silence, isn't the drive for novelty doing the explanatory work, not the free energy minimization itself?"
  *   **Follow-up:** "So you're saying evolution hardwires the priors that tell us to avoid the dark room. But if evolution is the mechanism selecting the priors, and free energy is just the math describing the outcome, why isn't natural selection the actual theory, and FEP just the equation describing the survival it produces?"

  **3. Scope and Specificity**
  "You apply this same formalism to single cells, immune systems, brains, and even whole societies. If the same equation describes a bacterium avoiding toxins and a human writing a symphony, does the concept of 'cognition' lose all specific meaning? What does FEP tell us about *thinking* that isn't also true about *metabolism*?"
  *   **Follow-up:** "If the distinction between a reflex and a reasoned decision is just a difference in the depth of the generative model, at what point does that distinction become so blurred that 'cognition' stops being a useful category for psychologists or neuroscientists?"

  **4. The "Wrong Falsifiability" Defense**
  "When pressed on testability, you've suggested critics are demanding the wrong kind of falsifiability for this kind of theory. Can you specify, in plain terms, what kind of evidence *would* count against the Free Energy Principle? If it's not a specific neural mechanism, what status does the claim hold?"
  *   **Follow-up:** "You often compare FEP to natural selection or least-action principles. But those principles operate on identifiable mechanisms—genes or particles. If FEP doesn't specify the neural mechanism, only the mathematical boundary, aren't you describing the *shape* of the cage without telling us anything about the *animal* inside?"

  **5. Neural Implementation**
  "Variational inference is computationally expensive. Real neurons are noisy, energy-constrained, and slow. How exactly is the brain performing the gradient descent required by your equations without burning more energy minimizing error than it saves by predicting the world? Is there a biological substrate you can point to that actually computes this?"
  *   **Follow-up:** "If the answer is that the brain performs 'approximate' inference, how do we distinguish a brain failing to minimize free energy from a brain minimizing free energy under a model we haven't correctly identified yet? Isn't that a shield against negative data?"

  **6. Psychiatry and Post-Hoc Fitting**
  "In computational psychiatry, FEP is used to explain conditions like schizophrenia or autism as 'imprecise priors' or 'aberrant salience.' But can you specify the parameter deviation *before* observing the symptom? Or does the framework allow you to fit the math to the behavior after the fact, making it a descriptive taxonomy rather than a predictive tool?"
  *   **Follow-up:** "If I can explain the same symptom by tweaking either the prior precision or the likelihood precision, doesn't that flexibility make the model unfalsifiable in a clinical setting?"

  **7. Competing Frameworks**
  "Connectionism, reinforcement learning, and classic predictive processing all offer accounts of brain function without necessarily subscribing to the full ontological weight of the Free Energy Principle. What does FEP explain that a standard reinforcement learning model cannot, other than using a different vocabulary?"
  *   **Follow-up:** "If the answer is 'unification,' does that unification come at the cost of precision? Are we trading a sharp, testable model of vision for a vague, universal theory of everything?"

  **8. The Null Hypothesis**
  "Imagine a study where you map a specific cognitive task and find the neural data fits a reinforcement learning model perfectly but violates the specific constraints of active inference. Would you consider that evidence against FEP, or would you argue the RL model is just a special case of free energy minimization?"
  *   **Follow-up:** "If every successful competing theory is absorbed as a 'special case' of FEP, and every failure is attributed to 'model misspecification,' how does the principle ever risk being wrong?"

  **9. Physics Envy**
  "There is a sense among some critics that FEP is driven by 'physics envy'—a desire to find a single law of motion for the mind. Is there a risk that in striving for a grand unified theory, you are imposing a mathematical elegance on biology that is actually messy, contingent, and historically path-dependent?"
  *   **Follow-up:** "Biology is full of kludges. If the brain is a bag of tricks evolved for survival, not an optimal inference engine, does FEP risk modeling the brain as it *should* be mathematically, rather than as it *is* biologically?"

  **10. Agency and Will**
  "If all action is just inference aimed at minimizing sensory surprise, where does agency live in this framework? Are we agents making choices, or are we simply vessels through which the universe minimizes its own entropy?"
  *   **Follow-up:** "If you say agency is just 'inference over policies,' doesn't that redefine 'agency' so broadly that it includes a thermostat? And if so, have you explained human will, or just renamed homeostasis?"
