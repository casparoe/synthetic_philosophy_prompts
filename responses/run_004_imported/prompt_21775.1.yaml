answer: |-
  This is not just a bar argument; you have stumbled directly into one of the most significant debates in modern moral philosophy. Your brother-in-law (BIL) is arguing from a position known as **Revisionist Just War Theory**, while your intuition aligns more closely with **Traditional Just War Theory** and international law.

  Both of you are partially right, but you are talking past each other because you are conflating **objective moral liability** with **individual culpability**.

  Here is the actual framework for thinking this through, broken down into the specific philosophical concepts you need to distinguish the conscript from the volunteer, and the soldier from the mugger.

  ### 1. The Framework: *Jus ad Bellum* vs. *Jus in Bello*

  To understand the disagreement, you have to separate the two layers of war ethics.

  *   **Jus ad Bellum (Justice of War):** This concerns the *reason* for going to war. Is the cause just? Is it self-defense? Is it authorized?
      *   *Your BIL's focus:* He is arguing that because Russia fails *Jus ad Bellum* (it is an aggressive, illegal war), every act within it is tainted.
  *   **Jus in Bello (Justice in War):** This concerns *conduct* within the war. Are they targeting civilians? Are they treating POWs humanely?
      *   *Your focus:* You are arguing that within the chaos of the battlefield (*in Bello*), individual circumstances matter.

  **The Traditional View (The "Moral Equality of Combatants"):**
  Historically, International Humanitarian Law (the Geneva Conventions) operates on the idea that soldiers on both sides have an equal right to kill each other, provided they follow the rules of war (wear uniforms, don't shoot civilians).
  *   **Why?** Because soldiers are viewed as "instruments of the state." If we say aggressor soldiers are murderers, then defender soldiers are justified in executing them upon capture. This would end all possibility of surrender and make wars infinitely bloodier.
  *   **Your Intuition:** This aligns with your gut. The conscript is an instrument. He is not the author of the war.

  **The Revisionist View (Jeff McMahan's Theory):**
  Philosophers like Jeff McMahan argue that the "Moral Equality of Combatants" is a myth. They argue that moral liability tracks the justice of the cause.
  *   **The Argument:** If a war is unjust, the soldiers fighting it are posing an *unjust threat*. Therefore, they are morally liable to be killed, and they do not have a right to kill those defending against them.
  *   **Your BIL's Logic:** This is exactly your BIL's point. He is a philosophical Revisionist. He believes that because the war is illegal, the Russian soldier has no more right to kill than a mugger does.

  ### 2. The Crucial Distinction: Wrongness vs. Culpability

  Here is where you can push back effectively. Even if we accept your BIL's Revisionist premise (that the war is unjust and therefore the killing is objectively wrong), it does **not** follow that every soldier is equally *culpable* (blameworthy).

  In moral philosophy, for someone to be fully blameworthy for a wrongful act, two conditions usually need to be met:
  1.  **Objective Wrongness:** The act was indeed wrong (Killing in an unjust war).
  2.  **Subjective Culpability:** The agent knew it was wrong and had a reasonable choice to do otherwise.

  This is the principled reason why the 19-year-old conscript is in a different moral position than the zealous volunteer, even if they pull the same trigger.

  #### A. The Epistemic Condition (What did they know?)
  *   **The Volunteer:** A hardcore volunteer who seeks out the war, consumes propaganda critically (or chooses to believe it despite evidence), and joins specifically to kill is making an informed moral choice. They have higher epistemic access to the nature of the conflict.
  *   **The Conscript:** A 19-year-old drafted in a closed society with heavy censorship may genuinely believe they are "denazifying" a neighbor or defending their homeland from NATO expansion. If they are operating under **invincible ignorance** (they literally cannot access the truth), their moral culpability is drastically reduced, even if their action is objectively wrongful.

  #### B. The Voluntariness Condition (Coercion)
  *   **The Mugger Analogy Flaw:** Your BIL uses the mugger analogy. It fails because of coercion.
      *   A mugger chooses to initiate a crime. If the victim shoots back, the mugger has no self-defense claim because the mugger created the lethal scenario voluntarily.
      *   A conscript often faces a "duress" scenario. In Russia, desertion can mean prison or death. If a soldier is sent to the front with the order "kill or be shot by your own officers," they are under duress.
  *   **Principled Difference:** Moral responsibility is mitigated by coercion. If the conscript shoots a Ukrainian to avoid being shot by a Russian commissar, he is acting under duress. This doesn't make the act "good," but it makes the *soldier* less blameworthy than the volunteer who faced no such threat.

  ### 3. Do Aggressors Have a Right to Self-Defense?

  This is the crux of your BIL's argument. If I start a fight, do I get to defend myself when you fight back?

  **In Domestic Law (The Mugger):** Generally, no. If I try to rob you and you pull a gun, I cannot shoot you and claim self-defense. I am the "unjust aggressor."

  **In War (The Combatant):** It is more complex.
  *   **Liability:** The Revisionist view says the Russian soldier is *liable* to be attacked because he is part of an unjust threat. The Ukrainian soldier is *not* liable to be attacked.
  *   **Necessity:** However, most ethical frameworks grant a **right of self-preservation** even to unjust aggressors *in the immediate moment*, provided they are not actively threatening others at that specific second.
      *   *Example:* If a Russian soldier is sleeping in a trench and a Ukrainian soldier comes to bayonet him, the Russian waking up and shooting back is an act of immediate self-preservation.
      *   *Counter:* Your BIL would argue that because the Russian soldier *should not be in the trench*, he forfeits this right.

  **The Synthesis:**
  The most robust ethical framework (one that satisfies both law and intuition) is this:
  1.  **The State is Responsible:** The crime of Aggression (*Jus ad Bellum*) belongs to the leadership (Putin and his generals), not the infantry.
  2.  **The Soldier is Responsible for Conduct:** The soldier is responsible for *how* they fight (*Jus in Bello*).
  3.  **The Exception:** The soldier becomes individually culpable for the war itself only if they **knowingly and voluntarily** participate in an unjust war without significant coercion.

  ### 4. How to Win (or End) the Argument

  You can tell your brother-in-law that he is conflating **Legal/Moral Status of the War** with **Individual Criminal Liability.**

  Here is the script based on the framework above:

  1.  **Acknowledge his premise:** "You are right that under 'Revisionist Just War Theory,' fighting in an unjust war is objectively morally wrong. In a perfect philosophical vacuum, the Russian soldier is posing an unjust threat."
  2.  **Introduce the Culpability Gap:** "However, moral wrongness does not equal murder. Murder requires *malice* and *choice*. International law (and basic ethics) distinguishes between the **architects** of a war and the **tools** of a war."
  3.  **Deploy the Conscript Distinction:** "The volunteer who joins to kill is morally culpable because he satisfies the **Voluntariness Condition**. The conscript who is threatened with prison if he refuses satisfies the **Duress Condition**. Lumping them together ignores the moral relevance of coercion."
  4.  **Fix the Mugger Analogy:** "A mugger is a private actor choosing crime for gain. A conscript is a citizen of a totalitarian state facing state violence if they refuse. A better analogy is a hostage forced to drive a getaway car. If the police shoot at the car and the driver swerves to survive, is the driver morally identical to the bank robber? No. They are both on the 'wrong side,' but their moral positions are totally different."

  ### Summary
  Your brother-in-law is right that the *war* is illegal and that, philosophically, the Russian side poses an "unjust threat." But he is wrong that this automatically makes every individual soldier a "murderer" in the criminal or fully culpable sense.

  **The Framework:**
  *   **Objective Liability:** Yes, the Russian soldier is a legitimate target because his side is the aggressor.
  *   **Subjective Culpability:** No, the Russian soldier is not necessarily a "murderer." Culpability depends on **knowledge** (did he know it was unjust?) and **choice** (could he have refused without death/imprisonment?).

  The conscript fails the choice test. The volunteer fails both. That is the principled difference you were looking for.
