prompt: |-
  Okay, my advisor sent me down a rabbit hole and now I need it untangled. Start with Tennenholtz's old "program equilibrium" result: in a one-shot Prisoner's Dilemma, let each player submit a program instead of an action, let the programs read each other's source code, and "cooperate iff your opponent's code is textually identical to mine" turns out to be a Nash equilibrium that gets you the cooperative payoff -- no repeated play, no external enforcement needed. Then theres the later fix out of the MIRI crowd, FairBot, which swaps that silly literal-identity check for "cooperate iff I can find a short formal proof that you cooperate with me," and two FairBots facing off actually manage to prove eachother cooperates, via Löb's theorem, without the whole thing collapsing into infinite mutual simulation.

  What I can't settle for myself is whether this genuinely solves the philosophical puzzle that made one-shot PD interesting in the first place -- why a rational, purely self-interested agent would ever cooperate with a stranger it'll never see again, with no binding contract -- or whether it just quietly redefines the "agents" as deductive automatons committed in advance to a shared, public proof system, so cooperation is baked in by construction and the genuinely hard case (agents that can hide, fake, or simply not share a proof procedure) is left completely untouched. Could you write me an essay that lays out the strongest version of both readings and then actually commits to one, instead of ending on a "both sides have a point" shrug?
