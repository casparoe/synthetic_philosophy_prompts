answer: |-
  "Look," Alex said, swirling the ice in his glass, "I'm building systems that plan and rewrite their own configs right now. They work. The MIRI stuff feels like saying 'you can't build a plane because birds flap wings and you don't.' It's just finite compute. We use approximations."

  Sam shook her head. "It's not about compute. It's about the map-territory relation. In classic agent theory, like AIXI, the agent sits outside the environment. It has a hypothesis space covering every possible world. But if you're *embedded*, you're smaller than the environment. You can't hold a perfect model of the world because the world contains you."

  "So we compress," Alex countered. "Lossy compression. Good enough."

  "It breaks the math," Sam insisted. "Take the grain of truth problem. For a Bayesian agent to learn, the true model of the environment has to be in its prior hypothesis space. But if the environment contains you, the true model includes your own code. To have that in your hypothesis space, you need to model yourself perfectly inside yourself. That's an infinite regress. If the truth isn't in your prior, Bayesian convergence guarantees vanish. You can't just 'approximate' your way out of a missing truth."

  Alex leaned forward. "But we don't use strict Bayesian updating. We use gradient descent on transformers. We don't need the true model in the prior; we need a functional mapping that minimizes loss. If the agent learns to predict its own behavior well enough to avoid paradoxes, who cares if it's logically perfect?"

  "Because you want self-improvement," Sam said. "You mentioned agents spinning up sub-agents. What if you want to build a successor smarter than you? You need to trust it won't change your goals. That's where Löb's theorem bites."

  "Löb's theorem," Alex repeated. "Remind me. Something about provability?"

  "Right. In formal logic, you can't have a system that trusts its own proofs without becoming inconsistent. Specifically, you can't prove that 'if I prove P, then P is true' without actually proving P trivially. So, if your agent uses logic to verify a successor agent, it can't prove the successor will preserve its goals unless the successor is weaker. You hit a tile: you can't build something smarter that you logically trust to keep your values."

  "We don't use formal logic for verification," Alex argued. "We use empirical testing. We run the successor in a sandbox, check the outputs, and deploy. It's engineering, not proof theory."

  "Sandboxing isn't proof," Sam shot back. "It works until it doesn't. If you're building AGI, you only get one shot at the goal alignment. If the theoretical barrier means you can't *guarantee* stability across self-modification, then 'ship it' is Russian roulette. The embeddedness problem means there's a fundamental disconnect between an agent's reasoning and the physical reality of its own code running in the world. Approximations hide the gap; they don't close it."

  "But maybe the gap doesn't matter for most tasks," Alex said. "Humans are embedded agents. We don't solve Löb's theorem to decide whether to trust our future selves. We use heuristics. Maybe LLMs are just learning those heuristics directly."

  "Humans also have cognitive biases and change their goals all the time," Sam replied. "If you're okay with that, fine. But if you want robust, scalable agency, you need to solve the structural problem. You can't approximate a contradiction away."

  Alex sighed, taking a drink. "So you're saying my pipeline is fundamentally brittle."

  "I'm saying it's working in the shallow end," Sam said. "Embedded agency is the deep end. You need a new theory of truth that handles self-reference without exploding, not just bigger transformers."

  "Maybe," Alex conceded. "But until then, I've got a deadline."
