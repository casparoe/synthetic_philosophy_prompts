answer: |-
  This is a splendid question, and it cuts directly to the core of the philosophy of medicine. Given your background in comparative physiology, you will recognize that your brother-in-law's argument rests on a specific conflation: he is equating **phylogenetic history** with **physiological function**.

  While his biology is impeccable (lactase non-persistence is indeed the ancestral mammalian state, and lactase persistence is a derived trait resulting from convergent evolution in dairying populations), his inference from "ancestral" to "non-disordered" commits a version of the naturalistic fallacy. He is assuming that what is *historically typical* for the species must be *functionally optimal* for the individual in their current environment.

  To answer your question directly: Yes, there is a principled basis on which the gastroenterologist's claim holds more water than your brother-in-law's, but it requires unpacking what we mean by "disorder." The dispute is not merely verbal, though it does hinge on definitions. Here are three philosophical frameworks that validate the medical perspective without denying the evolutionary biology.

  ### 1. The Reference Class Problem (Biostatistical Theory)
  Christopher Boorse, a leading philosopher of medicine, proposed the Biostatistical Theory (BST) of health. He defines health as "normal species functioning." A disease is a deviation from the statistical norm of functional design.

  Your brother-in-law's error lies in selecting the wrong **reference class**.
  *   **His Reference Class:** *Homo sapiens* across evolutionary time and global geography. In this class, he is the statistical majority.
  *   **The Clinician's Reference Class:** Adult humans living in a specific environmental niche (e.g., modern Western society with access to dairy).

  In comparative physiology, we know that an organism's function cannot be judged in a vacuum; it must be judged relative to its environment. A fish out of water is not functioning "normally" even if its gills are perfectly ancestral. If the patient lives in an environment where dairy is a primary, accessible caloric source, the inability to digest it represents a functional impairment relative to that niche. Boorse would argue that medical norms are rightly indexed to the environment in which the patient actually lives, not the savannah of 10,000 years ago.

  ### 2. Harmful Dysfunction (The Wakefield Analysis)
  Jerome Wakefield's "Harmful Dysfunction" analysis is perhaps the most robust tool here. He argues that for a condition to be a disorder, it must meet two criteria:
  1.  **Dysfunction:** A failure of a mechanism to perform its naturally selected function.
  2.  **Harm:** The condition causes harm to the individual (as judged by social values).

  Your brother-in-law has a strong case on the first count regarding *design*. Lactase shutdown is not a broken mechanism; it is the mechanism working exactly as evolution originally "intended." However, this view of "design" is too rigid. Evolutionary medicine (pioneered by thinkers like Nesse and Williams) introduces the concept of **mismatch**.

  A trait can be "design-consistent" but still constitute a dysfunction in a novel environment. If we define the "function" of the digestive system as extracting nutrients and maintaining homeostasis *in the current environment*, then lactose intolerance is a dysfunction because it fails to maintain homeostasis when exposed to a common food source. The "harm" criterion is easily met (pain, bloating, diarrhea). Therefore, even if it isn't a "design failure" in the ancestral sense, it is a "functional failure" in the current context.

  ### 3. The Pragmatic and Normative Necessity
  You asked if medicine has "smuggled a value judgement in under cover of an objective-sounding diagnostic label." The answer is **yes**, but this is not a flaw; it is a feature.

  Medicine is not purely descriptive biology; it is a moral technology aimed at the reduction of suffering. The label "disorder" is not merely a statement of statistical rarity; it is a flag for **intervention**.
  *   If a condition causes no suffering and requires no management, medicine often leaves it as a "variant" or "trait" (e.g., eye color).
  *   If a condition causes suffering and limits functioning, medicine labels it a "disorder" to justify treatment or management.

  By calling it a disorder, the gastroenterologist is not making a claim about your brother-in-law's evolutionary purity; they are making a claim about his **quality of life**. To insist on calling it "normal" because it is ancestral is to prioritize historical statistics over present-day suffering. In physiology, we prioritize homeostasis. If ingesting a substance disrupts homeostasis, the physiological system is, by definition, disordered *in that context*.

  ### The Verdict
  Your brother-in-law is correct that lactose intolerance is not a *pathology* in the sense of a viral invasion or a mutational error. It is a **mismatch condition**. However, he is incorrect to assume that "mismatch" exempts it from being a "disorder."

  A principled distinction can be drawn this way:
  *   **Evolutionary Norm:** What was selected for in the Environment of Evolutionary Adaptedness (EEA). (Brother-in-law's view)
  *   **Physiological Norm:** What maintains homeostasis in the Current Environment. (Gastroenterologist's view)

  Medicine deals with the latter. If we accepted your brother-in-law's logic, we would have to declassify myopia as a disorder (since hunter-gatherers did not need distance correction for reading) or classify the need for glasses as a "cultural artifact" of literate societies. While technically true that myopia is less disadvantageous in a hunter-gatherer niche, in a modern niche, it is a functional impairment.

  **Conclusion:** The gastroenterologist has the better claim on the word "disorder" because medical terminology is inherently teleological—it is oriented toward the *goal* of health (functioning/well-being) in the *present*. Your brother-in-law is treating "disease" as a historical category, while medicine treats it as a functional one. He is right about the phylogeny, but wrong about the ontology of health. The label "disorder" is not a denial of his evolutionary biology; it is an acknowledgment of his current physiological reality.
