answer: |-
  Good evening, everyone. For those of you who don't know me, I'm the groom's brother-in-law, and I'm a philosopher. Which, in this room, means I am professionally qualified to overthink a simple celebration. But given the bride and groom, I think we're all safe.

  [Sister's Name] and [Fiancé's Name] met in a graduate seminar on David Lewis's *Convention*. For the half of the room currently checking their watches: David Lewis was a philosopher who asked how we manage to coordinate our lives without a central authority. How do we know to drive on the right side of the road? How do we know to speak English to one another?

  His answer was "convention." A convention is a pattern of behavior we all follow, because we expect everyone else to follow it, and because we prefer to follow it *if* they do.

  Now, I know what half of you are thinking. You're thinking, "A convention? That sounds like a habit. That sounds... arbitrary." And you'd be right. In Lewis's vocabulary, "arbitrary" doesn't mean "random" or "uncaring." It means "not determined by the laws of physics." Driving on the left works just as well as driving on the right. The important thing isn't *which* side you choose; it's that you choose the *same* side, and you keep choosing it, day after day.

  And that, actually, is why I find their relationship so profoundly moving.

  There is a lot of wedding talk about destiny. About puzzle pieces that were cut in heaven waiting to click together. But [Sister] and [Fiancé] know better. They know that the universe did not write a script for them. There was no metaphysical necessity that brought them to that seminar, or to that coffee shop, or to this altar.

  In a world of infinite possibilities, they looked at one another and established a precedent.

  For the family: Think of a coordination equilibrium not as a math problem, but as a dance. It's the moment when you both reach for the same glass without clinking, when you both know to turn left without asking, when one of you has a bad day and the other knows exactly how to make space without being told. That is what Lewis calls "common knowledge." It is the state of knowing that the other knows, and knowing that they know that you know.

  I can think of no greater intimacy than that. To be fully known, and to fully know, and to align your preferences so that my success is your success, and your stability is my stability.

  Yes, the solution was arbitrary. They could have remained strangers. The universe wouldn't have cared. But once they found this equilibrium, they committed to it. They renewed the convention every morning they woke up together. Every time they chose to listen, to compromise, to laugh at a joke only the two of them understand, they reinforced the regularity. They made the arbitrary necessary.

  So, I am not going to toast to fate. Fate is passive. Fate happens to you.

  Instead, I want to toast to the work. To the active, daily, deliberate choice to coordinate. To the promise that when the situation recurs—and it will, in sickness, in health, in confusion, in clarity—you will prefer to conform to this partnership, given that the other does.

  [Sister] and [Fiancé], you have built a world with its own language, its own rules, and its own equilibrium. It is a world that didn't have to exist, which makes the fact that it *does* exist entirely up to you. And that is the only kind of forever that actually holds weight.

  Please raise your glasses.

  To the convention. To the precedent. And to the rest of your lives, solved together.

  To [Sister] and [Fiancé].
