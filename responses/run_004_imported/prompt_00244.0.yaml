answer: |-
  This is a fantastic premise. The Doomsday Argument (DA) is real, controversial, and mathematically seductive—perfect for a physicist turned cultist.

  However, your writer's group friend is right to bring up **Reference Classes**, because that is the single biggest hole in the argument. If you want your character to sound airtight on stage, she needs to address that *before* someone in the audience does.

  Here is the breakdown of the math, how to get her specific "60–90 years" number, and how to handle the objections so she sounds like a genius rather than a fraud.

  ### 1. The Core Math (The "Copernican Principle")

  The basic logic is: *If I am a random human sampled from the total set of all humans who will ever live, I am probably not special. I am likely somewhere in the middle.*

  *   **$n$**: The number of humans born so far (~117 billion).
  *   **$N$**: The total number of humans who will *ever* be born.
  *   **$f$**: Your fractional position in history ($n / N$).

  **The Standard Formula:**
  If we assume a flat prior (we have no idea where we are), there is a 95% probability that $f$ lies between 0.025 and 0.975.
  To predict doom, we look at the upper bound. There is a 95% chance that $f > 0.05$.
  $$n / N > 0.05 \rightarrow N < 20n$$

  **The Problem for Your Scene:**
  If $N < 20n$, then $N < 2,340$ billion.
  Remaining humans = $2,223$ billion.
  At current birth rates (~140 million/year), that's **15,000 years** until extinction.
  *This kills your 60–90 year timeline.*

  ### 2. How to Get the "60–90 Year" Number

  To get extinction in roughly 90 years, she needs to argue that the total number of humans ($N$) is only slightly larger than the number born so far ($n$).

  *   **Current Birth Rate:** ~140 million/year (0.14 billion).
  *   **Target Timeline:** 90 years.
  *   **Future Humans Allowed:** $90 \times 0.14 = 12.6$ billion.
  *   **Total $N$:** $117 \text{ (past)} + 12.6 \text{ (future)} = 129.6$ billion.
  *   **Current Position ($f$):** $117 / 129.6 = \mathbf{0.90}$ (The 90th Percentile).

  **The Claim:**
  She cannot use the standard "flat prior" DA. Instead, she must claim she is using a **Bayesian Update with an Informative Prior.**
  She argues: *"Given resource constraints and the Fermi Paradox, the probability distribution is weighted toward the end."*

  **The Formula for the Stage:**
  She should say something like:
  > "Using a standard Copernican prior, $N$ could be twenty times $n$. But when we apply a **carrying-capacity prior**, the confidence interval tightens. There is a 95% probability that we are already past the **90th percentile** of all human births."

  **The Calculation:**
  $$N_{max} = \frac{n}{0.90}$$
  $$N_{max} = \frac{117 \text{ billion}}{0.90} \approx 130 \text{ billion}$$
  $$\text{Remaining Humans} = 130 - 117 = 13 \text{ billion}$$
  $$\text{Time Left} = \frac{13 \text{ billion}}{0.14 \text{ billion/year}} \approx 92 \text{ years}$$

  ### 3. The "Reference Class" Defense

  This is the part that will make your writer's group friend happy. The "Reference Class" problem asks: *What counts as a human?*
  *   **Objection:** "What if we colonize space and birth trillions?"
  *   **Objection:** "What if we upload our minds to computers? Do digital minds count?"
  *   **Objection:** "What about Neanderthals? Do they count?"

  If she doesn't define this, a physicist in the audience will yell, "Your reference class is ill-defined!" and ruin her speech.

  **Her Counter-Move:**
  She must define the class **narrowly** to protect the math. She isn't predicting the end of "intelligence"; she is predicting the end of *biological Homo sapiens*.

  **Dialogue Suggestion:**
  > "I know what you're thinking. The Reference Class objection. 'What about post-humans? What about AI? What about colony ships?'
  >
  > "I am not calculating the end of consciousness. I am calculating the end of **biological Homo sapiens born of natural conception**. That is our reference class. If we upload our minds or engineer new species, *this* lineage ends. The math holds because the class is closed."

  ### 4. Sample Monologue (Putting it together)

  Here is a draft of how she might present this to make the math sound rigorous:

  > "We often hear the Doomsday Argument dismissed as statistical parlor tricks. They say, 'You just assume a flat prior.' They're right. But I'm not assuming a flat prior. I'm assuming a **constrained** one.
  >
  > "Let $n$ be the number of humans born so far. Demographers put that at 117 billion. Let $N$ be the total number of humans who will *ever* be born.
  >
  > "If humanity were to expand for millennia, $N$ would be in the trillions. That would make us, the 117 billionth humans, incredibly special—born in the tiny, golden 0.1% of history. The Copernican Principle tells us we are not special. We are likely average.
  >
  > "When we run the Bayesian update with a 95% confidence interval, accounting for planetary carrying capacity, the data shows we are in the 90th percentile. $n$ is 90% of $N$.
  >
  > "Simple algebra: If 117 billion is 90% of the total, the total is 130 billion. That leaves 13 billion slots. At current birth rates, we fill those slots in 90 years. After that? The integral goes to zero. The class closes."

  ### 5. Potential Holes (For your other characters)

  If you want a rival character to try to debunk her later, here are the actual mathematical weak points they could attack:

  1.  **The Birth Rate Variable:** The math relies on the birth rate staying steady. If the population collapses *before* the 90 years are up (e.g., everyone has 0 kids), the timeline extends, but the "doom" happens via sterility rather than extinction. If the birth rate spikes (e.g., artificial wombs), the 90 years shrinks to 10.
      *   *Counter:* She can argue that high birth rates require resources we don't have, reinforcing her "constrained prior."
  2.  **The "Self-Indication Assumption" (SIA):** This is the philosophical rival to the DA. It argues that the fact you exist *at all* is evidence that $N$ is large (because there are more slots for you to exist in).
      *   *Counter:* This is very philosophical. A rival physicist could say, "You're ignoring the SIA correction," which sounds smart but is debatable.
  3.  **The "Reset" Button:** If humans merge with AI, does the class reset?
      *   *Counter:* This is why her narrow definition ("Biological Homo Sapiens") is crucial. It blocks this attack.

  ### Summary Checklist for Your Scene
  1.  **Use $n = 117$ Billion.** (It's the standard accepted number).
  2.  **Use Birth Rate = 140 Million/Year.** (Rounded from current ~134m).
  3.  **Claim the 90th Percentile.** (This gets you the ~90 year timeline).
  4.  **Define the Reference Class.** ("Biological humans only").
  5.  **Mention "Informative Priors."** (This explains why her math is scarier than the standard textbook version).

  This setup makes her look like she has done the homework, acknowledges the known flaws in the theory, and patches them with specific definitions. It makes the cult feel dangerous because it's built on logic, not just superstition.
