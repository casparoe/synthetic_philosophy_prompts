answer: |-
  Here is a sequence of 10 interview questions designed to start respectfully but progressively tighten the screws on the "Common Prior Assumption" (CPA), specifically targeting the "information vs. prior" defense mechanism.

  ### Phase 1: Establishing the Ground
  *Goal: Lock her into the strong normative claim that CPA is a requirement of rationality, not just a model simplification.*

  **1. The Normative Claim**
  "Robert Aumann's Agreement Theorem is often treated as a curiosity—a mathematical result that holds under specific conditions. But your work argues something stronger: that the Common Prior Assumption isn't just a modeling convenience, but a actual *requirement* of rationality. If two agents disagree on probabilities, one of them must be irrational. Why is it incoherent to think two rational people could simply start with different 'default settings' for how they view the world?"

  *   **Follow-up (If she says priors are like logic):** "If priors are akin to logical axioms, does that imply there is a single, objectively correct 'worldview' that all rational agents would converge on given enough time? If so, where does this worldview exist prior to experience?"

  **2. The Harsanyi Doctrine**
  "This position relies heavily on the Harsanyi Doctrine—the idea that all differences in subjective probabilities must be attributed to differences in information rather than differences in priors. In your view, is this a factual claim about how human minds work, or a definitional constraint on what we are allowed to call 'rational'?"

  *   **Follow-up (If she says it's definitional):** "If it's a definition, doesn't that risk making the theory immune to counter-evidence? If we define any persistent disagreement as 'irrational' or 'informational,' do we lose the ability to describe the world accurately?"

  ### Phase 2: Challenging the "Information Difference" Move
  *Goal: Target her specific habit of redescribing prior differences as information differences.*

  **3. The Political/Deep Disagreement Case**
  "Let's take a concrete case. Two people look at the same economic data but come to opposite conclusions about whether a tax cut will stimulate growth. You've argued in the past that this isn't a prior difference, but an information difference—perhaps they weigh the reliability of the sources differently. But at what point does 'different weighting of sources' just become a synonym for 'different prior'? How do we draw the line?"

  *   **Follow-up (If she insists it's information):** "If the 'information' includes their entire history of processing data, isn't the 'Common Prior' just pushed back to birth? If the prior is what remains after you strip away all experience, is there anything left but empty logic?"

  **4. The Observability Problem**
  "Following up on that: If you explain away all disagreement by positing hidden information differences, how do we empirically distinguish between a violation of the Common Prior Assumption and a lack of data on the agents' information sets? Is there any observable behavior that would actually convince you that two people have different priors?"

  *   **Follow-up (If she says 'No'):** "So if no observation can distinguish between 'different priors' and 'different information,' isn't the Common Prior Assumption functioning as a protective belt against falsification rather than a descriptive truth?"

  **5. The Origin Story**
  "If rational agents must share a prior, where does that prior come from? If it's not derived from experience (since experience is 'information'), is it genetic? Is it a feature of the universe? If two people are raised in completely isolated environments with different sensory inputs, does rationality demand they still hypothetically share the same starting probability distribution?"

  *   **Follow-up (If she appeals to 'Objective Bayesianism'):** "But Objective Bayesianism struggles to define non-arbitrary priors for complex real-world events. If we can't specify what the Common Prior *is*, how can we claim it's a requirement of rationality to hold it?"

  ### Phase 3: The Market Reality Check
  *Goal: Use the No-Trade Theorem to show the empirical cost of the assumption.*

  **6. The No-Trade Theorem**
  "I want to pivot to markets. The Milgrom-Stokey No-Trade Theorem suggests that if traders share a common prior and know each other to be rational, speculative trade shouldn't happen—you can't agree to bet if you know the other person isn't making a mistake. Yet, financial markets are defined by massive volumes of speculative trading. How does your defense of the Common Prior square with the existence of high-frequency speculation?"

  *   **Follow-up (If she cites 'Liquidity Needs'):** "Liquidity trading explains some volume, but not the volatility or the sheer scale of speculative derivatives markets. Are you suggesting that the vast majority of speculative traders are systematically irrational?"

  **7. Bubbles and Convergence**
  "If the Common Prior holds, and information is revealed through prices, agents should theoretically converge on the 'true' value of an asset very quickly. Yet we see persistent bubbles and crashes where prices deviate wildly from fundamentals for long periods. Is the Common Prior Assumption compatible with the existence of sustained market inefficiencies, or does the theory require us to label bubbles as 'rational'?"

  *   **Follow-up (If she says 'Rational Bubbles'):** "If a bubble that bursts and destroys wealth is 'rational' under your model, does the term 'rational' still carry any normative weight? Or has it just become a label for 'consistent with the model'?"

  ### Phase 4: Methodological & Philosophical Pressure
  *Goal: Question the scientific status of the assumption.*

  **8. Computational Tractability**
  "Aumann's theorem assumes agents can process the *common knowledge* of each other's opinions. In reality, calculating the posterior of another agent who is calculating your posterior leads to infinite regress. Given human computational limits, is it fair to call it 'irrational' to fail to perform a calculation that is computationally impossible? Where does bounded rationality fit into your framework?"

  *   **Follow-up (If she says 'Idealization'):** "If we admit it's an idealization to handle computational limits, why not admit it's also an idealization to handle prior differences? Why is one relaxation of reality permissible but not the other?"

  **9. The "As-If" Defense**
  "Many economists defend assumptions like this using Friedman's 'as-if' methodology—we assume agents have common priors because the predictions work, not because the psychology is real. But if the prediction (no speculative trade) *doesn't* match reality, as we discussed, what is left to justify the assumption? Are we keeping it for mathematical tractability alone?"

  *   **Follow-up (If she defends tractability):** "If it's purely for tractability, should we be teaching it as a 'requirement of rationality' to students, or as a 'useful fiction'? Does the normative claim undermine the model's utility by making it dogmatic?"

  **10. Falsifiability and Rational Expectations**
  "I'd like to end on the philosophy of science. The Rational Expectations Hypothesis faced heavy criticism for being unfalsifiable—any error could be explained away as a random shock. Do you worry the Common Prior Assumption faces the same problem? If every disagreement can be redescribed as an 'information difference,' and every trade can be explained as 'liquidity,' is the theory falsifiable? Or is it, like Rational Expectations, a beautiful idealization that we should stop claiming is a literal description of rational thought?"

  *   **Follow-up (Final closing):** "If it is an idealization, what do we lose by explicitly dropping the claim that it is a *requirement* of rationality? Does the math break, or just the dogma?"
