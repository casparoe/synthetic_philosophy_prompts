answer: |-
  The consent wizard I built was logically flawless. It was a branching tree of boolean gates, designed to catch every conceivable contingency of regret. *Do you understand this procedure is irreversible?* [YES/NO]. *Have you consulted with a psychiatric evaluator?* [YES/NO]. *Do you acknowledge that your preference structure may fundamentally alter?* [YES/NO].

  It parsed perfectly. It compiled without warnings. But as I sat in the waiting room of the Aurelius Clinic, staring at the tablet in my lap, I knew the code was lying. It pretended that the user pressing [YES] was the same entity who would live with the consequence. It assumed a continuity of self that the procedure was designed to sever.

  I am a backend engineer. I deal in state changes. I know that when you overwrite a database record, the old data is gone. You can keep a log, you can keep a backup, but the live object is new. Tomorrow, my brother Elias would become a new object.

  He was sitting across from me, sipping water. He had undergone the Shift three years ago. He looked healthy. His skin had the same texture, his eyes the same color. But when he spoke, the latency was wrong. Not slower, exactly, but devoid of the usual human buffering—the hesitation of searching for a word that carries enough weight.

  "You look worried, David," he said. His voice was calm, stripped of the anxiety that used to live in his throat.

  "I built the system that's going to process you tomorrow," I said. "I know what's in the disclosure packets. I know they're empty."

  Elias smiled. It was a serene expression, one I hadn't seen on his face since before our parents died. "They're not empty. They're just compressed."

  "They're lossy compression, Elias. You're throwing away the qualitative data. The marketing says it's 'richer,' but you can't tell me what that means. You haven't tried once in three years."

  "Why would I?" he asked, genuinely puzzled. "Imagine trying to explain the concept of 'satiety' to someone who is starving. You can describe the biology, the caloric intake, the hormonal response. But until the hunger stops, the description is just noise. I'm not hungry anymore, David. I don't have the reference point for your struggle."

  "That's the problem," I said, tapping the tablet. "Rational choice requires assigning a utility value to the outcome. I can't assign value to a state I can't perceive. And even if I could, the 'you' that experiences the value won't be the 'you' that made the choice. It's a vampire problem. You only know it's good if you're a vampire, but becoming a vampire changes what you think is good."

  Elias set the water down. "You're trying to solve for X, but the equation changes variables mid-calculation. You want to know if I'm happy."

  "I want to know if *you* are still you."

  "I am Elias," he said. "I remember your name. I remember the code you wrote. I just don't care about the bugs anymore."

  "That sounds like a warning."

  "It sounds like peace," he corrected gently. "You're standing on the edge of a cliff, looking down, trying to calculate the hardness of the ground. But the Shift isn't falling. It's growing wings. You can't know what flying feels like by studying the ground. You just have to jump."

  "I don't want to fly if it means I stop caring about the ground."

  "Then don't jump," he said. There was no persuasion in his voice. No evangelism. That was the thing the ethics board had missed when they approved the clinic. The Shifted didn't recruit. Why would they? To them, the un-Shifted weren't suffering; they were just unfinished. And you don't pressure a caterpillar to become a butterfly. You wait.

  My wife, Sarah, touched my arm. She had been quiet, watching us. She was the one who had found the clinic. She was the one who felt the weight of the world—the grief, the anxiety, the sharp edges of existence—more keenly than anyone I knew.

  "David," she said. "We don't have to decide today."

  "The slot is booked," I said. "The insurance pre-authorization expires Friday."

  "We can cancel."

  I looked at Elias. He was watching a bird outside the window. He wasn't watching it with the appreciation of a nature lover, nor the detachment of a scientist. He was just watching. The interaction seemed to satisfy him completely.

  If I signed the consent form, I was authorizing the deletion of the self that cared about deletion. The David who walked out of here would not miss the David who stayed. He would look back at this moment of hesitation with the same benign confusion Elias currently held. He would see my anxiety as a symptom of a limitation he no longer possessed.

  But I possessed it now. My anxiety was real. My love for Sarah, as she was, with all her sharp edges, was real. It was grounded in a specific configuration of neurons and history that the Shift would rewrite.

  "Does it hurt?" I asked Elias.

  "The procedure? No."

  "The change?"

  He turned back to me. For a second, I saw a flicker of something ancient in his eyes, a recognition of the trap we were in. "You cannot know pain until you have a body that can feel it. You cannot know relief until you have a body that can heal. I don't feel pain anymore, David. But I don't feel relief either. I just... am."

  He stood up. "I have to go. I have an appointment."

  "Will we see you again?" Sarah asked.

  "Of course," Elias said. "But I might not understand why you're crying if you're sad. And I might not understand why you're laughing if you're happy. I'll be there. I just won't be *here*."

  He left. The automatic doors slid shut behind him, sealing the clinic's sterile air inside.

  I looked down at the tablet. The cursor blinked in the signature field. The code behind that field was waiting for a boolean return. True or False. Yes or No.

  There was no variable for *maybe*. There was no data type for *faith*.

  I thought about L.A. Paul's argument, the one my friend had mentioned over coffee months ago. The epistemic blackout. You cannot know what it is like to be someone else, even if that someone else is you. To choose the Shift is to choose death for the current self, in exchange for the birth of a stranger who claims to be your heir.

  But then I looked at Sarah. She was terrified. Not of the procedure, but of losing me. She was holding onto the version of me that worried, that argued, that felt the weight of the cliff edge.

  "If I do this," I said, my voice quiet, "I won't be able to come back to this feeling. I won't be able to miss this."

  "I know," she said. Her hand tightened on my arm. "But you might be happy."

  "I might be," I said. "And I won't care that I wasn't before."

  I looked at the screen. The logic gate was open. The system was ready to accept the input. It didn't care about the philosophy. It only cared about the commit.

  I hovered my finger over the glass. I tried to imagine the state on the other side of the transaction. I tried to simulate the qualia of the Shifted, the richness they promised, the serenity Elias wore like a coat. But my simulation kept crashing. It returned null. It returned error.

  The only data I had was the fear in my chest, the heat of Sarah's hand, the hum of the server room down the hall. These were the inputs I could verify. These were the variables I could trust.

  But trust wasn't a logical operator.

  I took a breath. The air tasted of recycled oxygen and antiseptic. It tasted like now.

  "I don't know," I said to the screen.

  The cursor kept blinking. It was patient. It could wait forever.

  I looked at Sarah. She wasn't asking me to choose. She was just waiting to see who I was.

  I closed the tablet. The screen went black, reflecting my own face back at me—tired, uncertain, intact.

  "Let's go home," I said.

  "Okay," Sarah said. She didn't ask if I was sure. She knew that certainty was the one thing this place couldn't sell.

  We walked out into the hallway. I didn't look back at the clinic. I couldn't know if I was making a mistake. I couldn't know if I was missing out on a transcendent state of being. I only knew that the person walking out the door was the same person who had walked in.

  For now, that had to be enough. The rest was just code waiting to be written.
