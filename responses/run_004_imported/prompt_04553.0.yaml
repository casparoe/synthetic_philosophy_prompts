  **Move 5:** Marcus is methodologically correct about Kripke's metasemantic project, but this defense potentially sidesteps the underlying metaphysical demand for an account of *de re* modality that Ines is pressing.

  **Verdict:** The exchange ends in a stalemate, as Marcus defends the primacy of pre-theoretic intuition while Ines successfully argues that the rival view offers no greater explanatory depth. A crucial consideration neither raised is Lewis's primary motivation for counterpart theory: solving the **problem of accidental intrinsics**. Lewis argues that without counterpart theory, we cannot make sense of an object having incompatible intrinsic properties across worlds without resorting to ad hoc indexing, a theoretical virtue that might outweigh the intuitive costs Marcus defends.
