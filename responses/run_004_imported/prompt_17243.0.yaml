          *   *Verdict:* Ada wins on textual fidelity and understanding the *project* of the *Genealogy*.

      *   **Move 3 (Marco):** If origin doesn't license evaluation, the book is toothless. Nietzsche clearly wants us to reject the ascetic ideal (Essay 3). He needs normative force.
          *   *Analysis:* Strong point. Nietzsche *does* make evaluative claims ("sickness," "danger"). If genealogy is purely descriptive, how does he get to "ought"? He needs a bridge.
          *   *Verdict:* Marco wins on identifying the structural tension in Nietzsche's project (the "Normativity Problem").

      *   **Move 4 (Ada):** The payload is undermining false premises about origin (e.g., "God-given"). If you think $X$ is sacred because of Story $A$, and Story $A$ is false, $X$ loses authority. Not a fallacy, but undermining a necessary condition for belief.
          *   *Analysis:* This is the "debunking" move. It works *if* the believer holds the false origin story. It's a valid internal critique.
          *   *Verdict:* Ada wins on the mechanics of debunking *specific* beliefs, but limits the scope.

      *   **Move 5 (Marco):** Many modern defenders don't rely on origin myths (secular compassion). So genealogy doesn't bite them.
          *   *Analysis:* Empirically true for many modern liberals. If I value compassion because of preference utilitarianism, Nietzsche's history of priestly resentment doesn't directly refute my reasoning.
