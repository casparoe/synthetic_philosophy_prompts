      *   **Marco's Stance:** Justification is independent of causal history (Internalism/Foundationalism). If I have good reasons *now*, the past doesn't matter.
      *   **Ada's Stance:** Causal history affects the epistemic status of the belief (Externalism/Debunking). If the process that generated the belief is "tainted" (e.g., by survival bias or resentment), the belief is undermined even if I have post-hoc reasons.
      *   **Nietzsche's Actual Position:** He likely rejects the Marco/Ada dichotomy. He isn't doing moral epistemology; he's doing *physiology of values*. He asks: "Does this value enhance life or diminish it?" (The Will to Power standard).
