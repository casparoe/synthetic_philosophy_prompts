      *   **Move 6 (Ada):** Secular defenders still rely on unexamined instincts ("suffering matters"). Genealogy diagnoses the *instinct*, not just the doctrine.
          *   *Analysis:* This pushes the critique to a pre-rational level. It claims the "brute premise" is infected by the history. This is the heart of evolutionary debunking arguments (EDAs).
          *   *Verdict:* Ada wins on depth, but opens herself up to Marco's final rebuttal (relocated genetic fallacy).

  3.  **Evaluate the "Missing Piece" (The Deeper Disagreement):**
