  I'm a PhD student in philosophy working on observer-selection effects and self-locating belief, and for the chapter I'm writing now I want a real verdict rather than another survey of the literature. Write an essay that adjudicates between the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA) as competing principles for updating on indexical evidence -- facts like "I exist" or "I am observing such-and-such," as distinct from ordinary empirical evidence. Your essay needs to engage with three specific pressure points: Bostrom's Presumptuous Philosopher case as the standard objection to SIA; the reference-class problem as the standard objection to SSA, including whether moving to observer-moments (Bostrom's Strong Self-Sampling Assumption) actually resolves the problem or merely relocates it; and how each assumption bears on the Doomsday Argument. Don't hedge -- defend a specific verdict, even if that verdict is that both assumptions should be rejected in favor of some alternative.
