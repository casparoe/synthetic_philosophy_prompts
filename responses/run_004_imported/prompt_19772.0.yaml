          *   Piano/Anomalies = *Praxis* (doing for the sake of doing).
          *   Argument: *Eudaimonia* (flourishing) is found in *praxis*, not just *poiesis*.
      *   **Philosophical Lens 2: Josef Pieper (Leisure):**
