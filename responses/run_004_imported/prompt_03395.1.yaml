      *   **Core Concept:** Three judges, two premises ($P$ and $Q$), one conclusion ($C$). $C$ is true iff $P$ and $Q$ are true.
          *   Premise-based procedure (PBP): Vote on $P$, vote on $Q$, derive $C$.
          *   Conclusion-based procedure (CBP): Vote on $C$ directly.
          *   The Paradox: PBP and CBP can yield opposite results even if every individual judge is logically consistent.
      *   **Target Audience:** Party guests (needs to be accessible but specific enough for those who know, or educational for those who don't).
      *   **Constraint:** Not a generic "committees are dumb" joke. Must hinge on the PBP vs. CBP distinction or the rational individuals $\rightarrow$ irrational group outcome.
      *   **Goal:** Short enough for an icebreaker.
