prompt: |-
  So for my Theory of Knowledge class (it's basically an epistemology elective, kinda like the IB TOK class) I've been going deep on Charles Sanders Peirce for my end-of-unit paper, and I got really attached to his definition of truth — not "whatever's known right now" but the opinion that the whole community of investigators would eventually settle on if inquiry just kept going forever, with "the real" being whatever that final opinion ends up being about. I liked it becuase Peirce was also a massive fallibilist, so it's not like he thought we currently have all the answers, just that reality's set up so that inquiry converges on the truth given enough time.

  Then this weekend I fell down a rabbit hole that went from youtube videos to the Stanford Encyclopedia of Philosophy (as one does) and found Fitch's paradox of knowability, a 1963 proof by a logician named Frederic Fitch. From what I understand, if you assume literally every true thing is at least possible for somebody to know eventually (they write it as p → ◇Kp, diamond just meaning "it's possible that"), you can actually prove that every truth IS already known by somebody, which is absurd since we're obviously not omniscient. It's supposed to be a huge problem for any "truth = knowability" type view, and the SEP page literally name-drops Peirce's theory as one of the views this is meant to threaten, right next to Kant and Berkeley.

  Here's my actual question: Peirce died in 1914, so he obviously never got to respond to this. Do you think his specific "ideal limit of inquiry" version of truth gets caught by Fitch's proof the same way plain verificationism does, or does defining truth in terms of an infinitely-deferred, idealized END-state of inquiry (instead of "knowable by someone at some particular time") give him a loop hole that Fitch's argument doesn't actually reach? And on the flip side, doesn't Peirce's own earlier stuff from 1868, where he argues that the "absolutely incognizable" is basically a meaningless/self-contradictory idea, commit him even harder to something like the knowability thesis — meaning this could be worse for him, not better? I asked my teacher and she just said "that's a good question for another class," lol. I want your actual best reconstruction of what Peirce would'a said, using his real views (fallibilism, the community of inquiry, all that), not just a generic "well he's a pragmatist so he'd say truth is a process" cop-out.
