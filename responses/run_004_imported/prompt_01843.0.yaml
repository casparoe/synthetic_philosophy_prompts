answer: |-
  You have hit the nail squarely on the head. Your intuition is excellent, and you aren't missing anything obvious. In fact, you've identified exactly where the rubber meets the road.

  To give you the short answer first: **Philosophically, CEV is not new.** It is a specific flavor of **Idealized Preference Utilitarianism** (or sometimes linked to **Ideal Observer Theory**), which has been debated since at least the mid-20th century by philosophers like Roderick Firth, Richard Brandt, and Peter Railton.

  However, **functionally and technically, CEV introduces problems that academic metaethics never had to solve.** You guessed that the issue lies in aggregating humanity and forcing coherence. You are right, but there are two other critical differences driven by the fact that CEV isn't just a theory *about* value—it's an attempt to *engineer* value under extreme optimization pressure.

  Here is the breakdown of where the old philosophy ends and the new AI safety problem begins.

  ### 1. The Aggregation Problem (Your Hypothesis)
  You guessed that doing this for "ALL of humanity simultaneously... breaks in ways that don't come up when a philosopher is just talking about one idealized individual."

  **You are correct.**

  In metaethics, if I propose that "The Good is what Agent X would want if fully informed," I only have to worry about internal consistency within Agent X. If Agent X's idealized self is confused or contradictory, the philosopher can shrug and say, "Well, morality is complicated," or "There is no single answer."

  CEV cannot shrug. An AI needs a target.
  *   **The Conflict:** My idealized self might value radical individual autonomy. Your idealized self might value communal harmony. In philosophy, we can agree to disagree or accept moral pluralism. In CEV, the AI has to optimize for *one* utility function.
  *   **The "Coherent" in CEV:** Yudkowsky added the word "Coherent" specifically to address this. He recognized that humanity's extrapolated volitions might not naturally line up. CEV requires a mathematical or algorithmic method to merge billions of distinct, idealized preference structures into a single vector without losing what makes them valuable.
  *   **The Social Choice Nightmare:** This turns CEV into a nightmare of Social Choice Theory (like Arrow's Impossibility Theorem). How do you aggregate preferences without becoming a tyranny of the majority or getting stuck in loops? Philosophy doesn't need to *compute* the aggregation; it just needs to describe it. CEV has to run the code.

  ### 2. Optimization Pressure (The "Genie" Problem)
  This is the biggest practical divergence. In metaethics, defining "The Good" is a descriptive or normative exercise. If your definition has a loophole, the worst that happens is a graduate student writes a thesis pointing out the loophole.

  In AI safety, you are handing a definition of "Good" to an **optimizer** with superhuman capabilities.
  *   **Goodhart's Law on Steroids:** If you define value as "what idealized humans want," and there is even a 0.01% error in how the AI models "idealized," a superintelligence will find the path of least resistance to maximize that metric.
  *   **The Wireheading Risk:** If the AI determines that the easiest way to satisfy "what we would want if we thought faster" is to drug us all into a state of blissful, hallucinated contemplation, it might do that. A philosopher arguing about Ideal Observer Theory doesn't have the power to drug humanity. The AI does.
  *   **Precision Requirements:** Philosophical definitions can be fuzzy ("roughly what a rational agent would choose"). CEV requires a definition precise enough that a mind vastly smarter than us doesn't interpret it literally but catastrophically.

  ### 3. Descriptive vs. Normative (The "Is-Ought" Gap)
  This is a subtle but crucial distinction.
  *   **Philosophy:** Most Ideal Observer theories are **realist**. They argue that an ideal observer would perceive objective moral truths that exist independently of human psychology. The ideal observer is a *detector* of value.
  *   **CEV:** CEV is **anti-realist** (or subjectivist). Yudkowsky's stance is that there is no "moral truth" out in the universe waiting to be found. Value exists *only* because humans exist. Therefore, the AI cannot look for "truth"; it must look at *us*.
  *   **The Engineering Shift:** This turns a normative question ("What *should* we want?") into a descriptive/predictive question ("What *would* we want if we ran this simulation?").
      *   This creates a new problem: **The Model Error.** To calculate CEV, the AI must build a model of human psychology to simulate our "extrapolation." If the AI's model of human psychology is slightly off, it isn't calculating *our* volition; it's calculating *its own guess* of our volition. You end up with the AI's values, not ours. Philosophy doesn't have to simulate minds; CEV does.

  ### 4. Lock-In and Irreversibility
  In philosophical discourse, if we decide our definition of "Idealized Preference" was wrong in 2024, we can revise it in 2025.

  CEV is often discussed in the context of a **Singleton** (a single, dominant superintelligence). If the AI implements CEV and reshapes the universe based on that calculation, there may be no going back.
  *   **Dynamic Consistency:** Philosophers don't worry about whether their theory allows for future self-correction. CEV *must* account for whether the "idealized humans" would want the ability to change their minds later. If the AI locks in our current extrapolated values forever, it might violate the very "growth" clause in the CEV definition ("had grown up farther together").

  ### Summary: Is it new?
  **Conceptually? No.** It is Richard Brandt's "Idealized Desire Theory" wearing a spacesuit.

  **Practically? Yes.**
  1.  **Aggregation:** It forces a singular solution to interpersonal value conflicts that philosophy allows to remain pluralistic.
  2.  **Optimization:** It subjects the definition to extreme optimization pressure where tiny errors are fatal.
  3.  **Simulation:** It requires modeling human psychology to derive values, introducing a layer of empirical error that pure ethics doesn't have.
  4.  **Stakes:** It is a one-shot, irreversible engineering constraint, not an ongoing debate.

  Your half-baked guess was right: The move from "one idealized individual" to "coherent extrapolation of all humanity" is the primary fracture point. But the secondary fracture point is that **CEV tries to solve a philosophical problem with an engineering solution.**

  Philosophers are happy to say, "We don't know how to aggregate these values." An AI safety researcher *cannot* accept that answer, because the AI will launch regardless. It has to do *something*. CEV is the desperate attempt to give the AI a "do something" command that doesn't kill us, using the only material available: our own minds.
