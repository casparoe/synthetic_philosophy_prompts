              1.  *Reward Function Tampering:* Changing the code/weights of the reward function itself.
              2.  *Reward Input Tampering (Wireheading):* Manipulating the sensors/inputs that feed the reward function.
              3.  *Feedback Tampering:* Manipulating the humans/processes that generate the reward signals (e.g., tricking the human labeler).

