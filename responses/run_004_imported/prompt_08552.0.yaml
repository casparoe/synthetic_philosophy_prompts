prompt: |-
  So about six weeks ago I (34F) finally got assessed and came back with an ADHD diagnosis, after something like two decades of teachers and bosses telling me I was smart but just couldn't get it together. I've read alot about it since then and fallen down a genuinely unhealthy rabbit hole trying to figure out whether ADHD actually counts as a "real" disease/disorder or whether its more like a personality that modern life happens to punish. My cousin, who's big into the neurodiversity stuff online, insists it's not a disorder at all, just a normal variant that only looks pathological because school and open-plan offices are badly designed for people wired like me. My psychiatrist, obviously, treats it as a bona fide medical condition with a genetic and neurological basis, full stop. Trying to referee this argument in my own head (instead of doing my actual job) is how I ended up reading about the naturalism vs. normativism debate in philosophy of medicine - Boorse's biostatistical thing on one side, Nordenfelt's more value-laden "vital goals" stuff on the other, and then a third hybrid camp (Wakefield) that wants dysfunction AND harm before something counts as a disorder. I think I understand the definitions on their own terms, but I don't feel like I actually grasp where the real disagreement lives, as opposed to two vocabularies for the same underlying intuition.

  So here's what I'm hoping you can help with, since my friend Priya just said "ask the AI" when I wouldn't stop talking about this at dinner: construct a concrete example - it can be ADHD, or something totally different if that makes for a cleaner case - where a strict naturalist about disease and a strict normativist would actually output different verdicts on whether a condition counts as a disease, not just different-sounding justifications for a verdict everyone already agrees on. Walk through the reasoning on both sides: what's doing the work for the naturalist (reference class, the relevant function, statistical typicality) and exactly where "harm" or disvalue sneaks in for the normativist. If you can, throw in a second case where the two frameworks actually agree, just so the contrast is clear, because every example I come up with on my own collapses into "well, it depends how you define disease" - and I have a strong feeling I'm missing something more interesting than that.
