      *   *Check:* Is Elena too rigid?
      *   *Fix:* Give her a point about the practical danger of akrasia. It causes distress (which matches the user's experience).
      *   *Specific Terminology:* Use "Higher-Order Evidence" (HOE), "First-Order Evidence" (FOE), "Rational Requirements," "Epistemic Akrasia," "Total Evidence View."

  6.  **Addressing the User's Specific Worry:**
      *   The user asks: "Is my therapist asking me to do something epistemically well-motivated or merely something that is therapeutically useful while quietly violating the norms of rational belief?"
