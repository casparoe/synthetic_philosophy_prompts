  8.  *(Self-Correction)*: Wait, I need to be careful with the term "weak discernibility." Saunders (2006) argues fermions are weakly discernible via antisymmetric relations (like "has opposite spin to"). Bosons in the same state lack even this. So the user is right: the defense fails for bosons. I need to leverage this. The argument is: If PII is a fundamental metaphysical principle, it shouldn't depend on the statistical class of the particles. The fact that it holds for fermions (via exclusion) but fails for bosons (via symmetry) suggests PII isn't a metaphysical truth about *objects*, but a contingent feature of specific physical dynamics. Therefore, saving it via weak discernibility in the classical case is just masking this contingency.

