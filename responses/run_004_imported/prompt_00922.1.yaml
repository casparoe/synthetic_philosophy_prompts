      *   **Case Study:** Terri Schiavo (persistent vegetative state/neocortical death, brainstem intact, breathing spontaneously).
      *   **Core Question:** What would Locke say about Schiavo? Is the 'person' gone while the 'man' remains? Does this imply current legal definitions of death are wrong according to Locke?

  2.  **Deconstruct Locke's Theory (Relevant Parts):**
      *   *Person:* "A thinking intelligent being, that has reason and reflection, and can consider itself as itself, the same thinking thing, in different times and places." (Continuity of consciousness/memory).
      *   *Man:* "A living organized body" (Human animal/organism).
      *   *Identity:* Personal identity depends on consciousness, not substance (soul or body).
      *   *Death:* Locke doesn't explicitly define "clinical death" in a modern medical sense, but he links the *person* to consciousness. If consciousness is irretrievably lost, the *person* ceases to exist, even if the *man* (body) lives.

  3.  **Analyze the Terri Schiavo Case (Medical/Legal Facts):**
