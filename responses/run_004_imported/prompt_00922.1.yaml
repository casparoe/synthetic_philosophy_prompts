prompt: |-
  so in my bioethics seminar we did a whole unit on locke's theory of personal identity -- the consciousness/memory criterion, the prince-and-the-cobbler swap, his split between 'man' (the living organism) and 'person' (the thinking thing with continuous consciousness). now we've moved onto how death actually gets defined, and apparently the law only recognizes two options: irreversible loss of circulatory/respiratory function, or irreversible loss of the entire brain including the brainstem. i keep thinking about someone like terri schiavo, whose cortex was basically gone but whose brainstem kept her breathing on her own for like 15 years, so she wasnt dead by either standard. what do you think locke would actually say about a case like that -- is the 'person' already gone even though the 'man' is still alive? and would his view basically mean our legal definitions of death are drawing the line in the wrong place entirely?
reasoning: |-
