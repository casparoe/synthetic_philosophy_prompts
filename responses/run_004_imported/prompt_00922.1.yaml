      *   Ethical Controversy: Was she still "there"? Was removing feeding tube killing her or letting her die?

  4.  **Synthesize Locke + Schiavo:**
      *   *Locke's View on Schiavo:* Since Locke defines a *person* by self-awareness, memory, and rational reflection, a PVS patient lacks these. Therefore, the *person* (in the Lockean sense) is gone. However, the *man* (the biological organism) is still alive because the body is functioning (breathing, digesting with aid, etc.).
      *   *Implication for Death:* Locke would likely argue that *personal* death occurred when consciousness was lost, even if *biological* life continues.
      *   *Conflict with Law:* Current law (Whole Brain Death) requires the brainstem to be dead. Locke cares about the *consciousness*, which resides in the higher brain (cortex). So, yes, Locke would likely think the legal line is drawn too low (too biological, not psychological enough).

