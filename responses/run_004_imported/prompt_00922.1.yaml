answer: |-
  This is a fantastic connection to make, and honestly, it cuts right to the heart of why bioethics is so difficult. You have identified the exact tension between **psychological criteria** (Locke) and **biological criteria** (current law).

  If we apply Locke's framework strictly to the Terri Schiavo case, your intuition is correct: Locke would almost certainly argue that the **person** was gone, even though the **man** remained. Consequently, he would likely view the current legal definition of death as drawing the line in the "wrong" place—or at least, in a place that doesn't matter for *personal* identity.

  Here is a breakdown of how Locke would analyze Schiavo, and why that creates a conflict with the law.

  ### 1. Locke's Distinction: 'Man' vs. 'Person'
  To understand Locke's verdict, we have to keep his definitions distinct:
  *   **The Man:** The human animal, the biological organism. Identity here is based on the continuity of life functions (metabolism, organization, biological processes).
  *   **The Person:** A "thinking intelligent being, that has reason and reflection, and can consider itself as itself." Identity here is based **solely** on continuity of consciousness and memory.

  **In the Schiavo Case:**
  *   **The Man:** Terri Schiavo's organism was alive. She breathed on her own (brainstem function), had sleep-wake cycles, and digested food. Biologically, the "man" persisted for 15 years.
  *   **The Person:** Her neocortex (the seat of higher reasoning, memory, and self-awareness) was destroyed. She had no awareness of self or environment. For Locke, without consciousness, there is no person.

  **Locke's Verdict:** The *person* Terri Schiavo ceased to exist the moment her consciousness was irretrievably lost. What remained for 15 years was merely the "man" (the biological shell) without the "person" (the moral/self-aware agent).

  ### 2. The "Higher Brain" vs. "Whole Brain" Standard
  This is where your seminar discussion on legal definitions gets spicy.

  *   **Current Law (Whole Brain Standard):** You die when the *entire* brain, including the brainstem, ceases to function. This is a **biological** definition. It focuses on the body's ability to function as an integrated whole. If the brainstem works, you are legally alive (as Schiavo was).
  *   **Lockean Theory (Higher Brain Standard):** You cease to be a *person* when the capacity for consciousness is lost. This is a **psychological** definition. It focuses on the seat of the self (the cortex).

  Locke is essentially the philosophical grandfather of the **"Higher Brain Standard"** of death. If Locke were testifying in court, he would argue that the law is protecting the wrong thing. The law is protecting the *biological life* of the organism, but Locke would argue that moral status, rights, and identity belong to the *person*. Once the person is gone, the organism no longer holds the same moral claim to life.

  ### 3. Would Locke say the Law is "Wrong"?
  Yes, but with a caveat.

  Locke would likely argue that the legal definition of death conflates **biological death** with **personal death**.
  *   **Biologically:** Schiavo was not dead. Locke would agree with the doctors on this. The organism was functioning.
  *   **Personally:** Schiavo was "dead" (or rather, ceased to exist) long before her heart stopped.

  So, would he say the law is drawing the line in the wrong place? **Yes.** He would argue that for ethical and legal purposes (like removing life support, inheritance, or mourning), the line should be drawn at the loss of consciousness, not the loss of brainstem function. To keep the body alive after the consciousness is gone is, in a Lockean view, to preserve a vessel that no longer contains the passenger.

  ### 4. The Complications (For your Seminar Discussion)
  If you bring this up in class, be prepared for the counter-arguments, because Locke's view creates massive practical problems:

  **A. The Epistemic Problem (How do we know?)**
  Locke was actually very worried about how we *know* consciousness is gone. In his *Essay*, he discusses the "sleeping man" problem: If a soul thinks while the body sleeps but remembers nothing upon waking, is it the same person?
  In Schiavo's case, diagnosing Persistent Vegetative State (PVS) is hard. There have been cases of "misdiagnosed" PVS where patients had some hidden awareness. Locke requires *continuity of consciousness*. If we can't measure consciousness perfectly, a Lockean standard for death risks killing people who might still have a sliver of "personhood" left. The Whole Brain standard is used legally because it is easier to prove objectively than "loss of self."

  **B. The Moral Status of the "Man"**
  Even if the *person* is gone, does the *man* have rights? Locke argues that we have property in our persons. But if the person is gone, who owns the body?
  *   **Lockean implication:** If the person is gone, the body might be treated more like property of the family or the state, rather than a rights-bearing individual.
  *   **Legal reality:** The law treats the breathing body as a rights-bearer regardless of cognitive state. This is why removing Schiavo's feeding tube was a legal battle; the law viewed the *man* as having a right to life, even if the *person* was arguably absent.

  **C. The "Death" Label**
  Locke might actually hesitate to call this "death." He might prefer to say the *person* has departed, but the *human* is alive. This creates a weird category: **Non-person humans.**
  Current law hates this category. You are either alive or dead. Locke introduces a third state: *Biologically alive, Personally dead.* Our legal system isn't built to handle that third state, which is why we stick to the Whole Brain standard—to force a binary choice.

  ### Summary for your Seminar
  If you want to drop this in discussion, here is the punchline:

  > "Locke's theory essentially advocates for a **Higher Brain Standard** of death, whereas the law uses a **Whole Brain Standard**. In a case like Terri Schiavo, Locke would argue that **personal identity** was extinguished when her cortex died, even if **biological life** persisted via the brainstem. This suggests that our legal definition of death prioritizes the continuity of the *organism* (the Man) over the continuity of the *self* (the Person). For Locke, Schiavo wasn't 'alive' in the way that matters for personhood, implying the law is protecting a shell rather than a self."

  It's a strong critique because it highlights that our legal definitions are pragmatic (easy to measure), not necessarily philosophical (aligned with what makes us *us*).
