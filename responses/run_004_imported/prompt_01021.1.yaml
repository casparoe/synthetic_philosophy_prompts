  Ok, this has been bugging me for a while. Been reading about dialetheism (Graham Priest et al) and paraconsistent logics as a way to block explosion (ex falso quodlibet) so the liar paradox doesn't just prove every sentence true. Thing is, I'm basically a committed Bayesian who treats any contradiction in my beleifs as a hard stop -- find one and I know I've gotta dig until I find the false premise somewhere upstream. So what are the most important implications of taking dialetheism seriously for that policy? Is 'some contradictions might just be true' an actual live option for ordinary reasoning and belief updating, or is it really just a patch for weird self-referential edge cases with basically zero implications once you leave that neighborhood?
