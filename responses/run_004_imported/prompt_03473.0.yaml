prompt: |-
  I'm taking a course on 19th century ethics and we just finished Sidgwick's Methods of Ethics, which I really liked. In office hours my professor mentioned, almost as an aside, that Sidgwick spent like two decades running the Society for Psychical Research, investigating mediums, telepathy, all that stuff. I looked into it a little and my impression is that this was basically a late-career hobby he picked up after he'd already made his name as a philosopher -- kind of like a Victorian gentleman's eccentric side project that doesn't really have much to do with the "real" philosophy in the Methods.

  For a short response paper I want to argue that this is a fun biographical detail but ultimately seperate from evaluating his ethical theory -- the Methods stands or falls on its own arguments regardless of whether ghosts turn out to be real. Is that basically the right way to frame it, or is there some actual substantive connection between the two projects that I'd be missing? Also curious whether he ever actually became a believer by the end -- some of what I skimmed made it sound like he did, which seems like it would kind of undercut the whole "rigorous skeptical philosopher" reputation, no?
