      *   *Connection to Ethics:* Is there a link? Yes. Sidgwick was deeply concerned with the "dualism of practical reason" (the conflict between self-interest and duty/utilitarianism). He hoped psychical research might provide evidence for an afterlife/divine justice, which would reconcile this dualism.
