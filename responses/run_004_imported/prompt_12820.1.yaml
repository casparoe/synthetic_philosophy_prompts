prompt: |-
  Something about a situation in my program has been bugging me and I can't tell if I'm overthinking it. A friend and I are both in the same social psych PhD program, and a few years back we each had a promising initial finding and independently made the exact same call: skip collecting an independent replication sample before submitting the paper, since we were both confident the effect was real and didnt want to lose momentum before a conference deadline. My effect turned out to be genuine. Hers didn't - it was basically noise in her original data - and that only came out later when someone else tried to build on her work and couldn't reproduce it. Now people in the field quietly treat her like she can't be trusted methodologically, with some practically implying she p-hacked it, while my study just gets cited as solid work, even though we made the literally identical call for the literally identical reasons at the time. I even feel a bit guilty myself about it, like I got away with something. Is there an actual principled reason for people to judge her so much harder than me over this, or is everyone just reacting to how it happened to turn out?
