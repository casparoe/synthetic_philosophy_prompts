      *   **Event:** Both had promising initial findings. Both decided *independently* to skip an independent replication before submission (to meet a conference deadline/confidence in effect).
      *   **Outcome:** User's effect was genuine (replicable). Friend's effect was noise (not replicable).
      *   **Consequence:** Friend is now viewed with suspicion (methodologically untrustworthy, accusations of p-hacking). User's work is cited as solid.
      *   **User's Feeling:** Guilty ("got away with something"), questioning the fairness/principled basis of the differential judgment.
      *   **Core Question:** Is there a principled reason for the harsher judgment of the friend, or is it just outcome bias?

  2.  **Initial Assessment & Ethical/Scientific Principles:**
      *   **Outcome Bias:** This is the most obvious psychological phenomenon at play. Judging a decision based on the outcome rather than the quality of the decision at the time it was made.
      *   **Scientific Norms:** In social psychology (especially post-2010s replication crisis), skipping replication is generally frowned upon, though common in earlier eras or under pressure.
      *   **Truth Value:** Science ultimately cares about truth. If a finding is false, it wastes resources. If it's true, it advances knowledge.
      *   **Signal vs. Noise:** The friend's result *was* noise. The user's *wasn't*. From a purely epistemic standpoint, the friend published a false positive. The user published a true positive.
      *   **Perception of Intent:** When a study fails to replicate, observers often infer bad practice (p-hacking, HARKing) because it's hard to believe honest error led to a false positive *unless* the statistical power was low or methods were shaky.

  3.  **Deconstruct the "Principled Reason" vs. "Outcome Bias":**
      *   *Argument for Outcome Bias:* The decision process was identical. Therefore, the judgment of the *decision-making* should be identical. Punishing the friend for bad luck is unfair.
      *   *Argument for Principled Difference:* Science is consequentialist. Publishing false positives harms the field more than publishing true positives. The friend's work *actually* misled people. The user's work *actually* helped. Therefore, the trust calibration is updated based on evidence of reliability (which includes the truth of the claims).
      *   *Nuance:* The accusation of p-hacking is specific. It implies *intent* or *questionable research practices (QRPs)*. Does a failed replication prove p-hacking? No. But it raises the posterior probability of QRPs in the eyes of the community.

  4.  **Drafting the Response - Key Sections:**

