answer: |-
  This is a profound and ethically mature question. You are identifying a tension between **process ethics** (did we follow the right decision-making procedure?) and **outcome ethics** (did the result benefit or harm the field?).

  The short answer is: **You are largely observing Outcome Bias, but there is a nuanced, principled reason why the field treats reliability differently than intent.**

  Here is a breakdown of what is happening, why it feels unfair, and where the actual principled distinctions lie.

  ### 1. The Dominant Force: Outcome Bias
  Psychologically, what you are witnessing is textbook **outcome bias**. This is the tendency to judge the quality of a decision based on its outcome rather than on the quality of the decision at the time it was made.

  *   **The Decision:** Both of you weighed the costs (time, conference deadline) against the risks (false positive) and made the same calculated gamble.
  *   **The Judgment:** Because your gamble paid off, you are viewed as "confident and efficient." Because hers did not, she is viewed as "reckless or dishonest."

  If you both submitted the exact same pre-analysis plan today, and the only difference was the random number generator of the universe, the moral weight of your *actions* was identical. From a deontological (rule-based) ethical standpoint, judging her character more harshly is unfair.

  ### 2. The Principled Reason: Epistemic Trust
  However, science is not just about individual morality; it is a collective truth-seeking engine. There is a consequentialist argument for why the field treats you differently, which isn't purely malicious.

  **Trust is calibrated by accuracy, not just honesty.**
  When researchers cite your work, they are betting their own careers on the reliability of your findings.
  *   **You:** Your "calibration" proved accurate. Your intuition that the effect was real was correct. Therefore, citing you is a lower-risk bet for them.
  *   **Her:** Her "calibration" proved inaccurate. Her intuition was wrong. Therefore, citing her is a higher-risk bet.

  In this sense, the field isn't necessarily judging her *character* (though some are); they are judging her *reliability as a signal*. In a field grappling with a replication crisis, a false positive is a cost to the community. It wastes other people's time and grant money. The harsh treatment is partly a defensive mechanism: the community is penalizing the production of noise to discourage future noise, even if the noise was produced honestly.

  ### 3. The Unprincipled Accusation: P-hacking
  Where the judgment becomes unfair and unprincipled is the leap from "her finding was false" to "she p-hacked."

  A failed replication does not prove Questionable Research Practices (QRPs). It proves the original finding was a false positive. False positives happen 5% of the time by definition (p < .05), even with perfect practices. They also happen frequently due to low power, measurement error, or context dependence.

  However, because the base rate of false positives in social psychology has been historically high, the community has developed a heuristic: **Failed Replication ≈ QRPs.**
  This is a statistical shortcut. It assumes that because honest errors shouldn't happen *this* often in the aggregate, a specific instance of failure likely involves hidden flexibility. Applying this heuristic to your friend individually is statistically unfair, even if it makes sense as a population-level deterrent.

  ### 4. Addressing Your Guilt
  You mentioned feeling like you "got away with something." That guilt is a sign of your integrity, but you should examine it closely.

  *   **You didn't cheat.** You took a risk that is unfortunately still common in academia.
  *   **The system incentivized this.** The pressure to meet conference deadlines and publish quickly encouraged both of you to skip replication. You are both products of a system that rewards speed and novelty over robustness.
  *   **Luck is a factor.** Science involves empirical luck. You happened to be right. She happened to be wrong. Feeling guilty for being right is natural, but it shouldn't paralyze you.

  ### 5. How to Navigate This
  You are in a unique position to influence the culture around this.

  *   **Acknowledge the Risk Publicly:** When you present your work, acknowledge that skipping the replication was a risk. Say, "We prioritized momentum, and we were fortunate the effect held." This humanizes the process and reduces the "hero narrative" around your success.
  *   **Defend Your Friend (Privately and Publicly):** When you hear people implying she p-hacked, you are one of the few people with the standing to say, "I was there. We made the same call. It was an honest error, not manipulation." You can help shift the narrative from *malice* to *methodological risk*.
  *   **Advocate for Systemic Change:** The real villain here is a culture where skipping replication is a viable strategic choice to meet a deadline. Support pre-registration, registered reports, and internal replication requirements in your lab. If you become a PI, ensure your students don't have to make this choice.

  ### Summary
  Is there a principled reason to judge her work as less citable? **Yes.** Her findings were not reliable, and science must prioritize truth.
  Is there a principled reason to judge her *character* as untrustworthy or accusatory of p-hacking? **No.** That is outcome bias and a defensive heuristic run amok.

  You made the same methodological gamble. You won; she lost. The difference in reputation is largely a function of the outcome, not the integrity of the decision. Your guilt is valid empathy, but don't let it convince you that you acted unethically. Instead, use your position to advocate for a system where a failed replication is treated as data, not a character indictment.
