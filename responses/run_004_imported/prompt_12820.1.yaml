      *   **The Core Concept: Outcome Bias:** Define it clearly. This is the main driver of the social judgment.
      *   **The Scientific Reality (The "Principled" Side):**
          *   Truth matters. A false positive is a cost to the field.
          *   Trust is about *reliability*, not just *intent*. If someone's findings turn out false, their "reliability score" drops, even if they were honest.
          *   The "Base Rate" problem: In social psych, many initial findings *are* false positives. When one fails, people assume it belongs to that majority.
      *   **The Accusation of P-hacking:** Why does this happen? It's often a heuristic. "Failed replication = QRPs." It's not logically sound but is a common defensive mechanism in the field.
      *   **The User's Guilt:** Address the "got away with it" feeling.
