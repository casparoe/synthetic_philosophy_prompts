      *   **Actionable Advice:** How to handle this professionally and personally.
          *   Support the friend.
          *   Advocate for better norms (pre-registration, etc.) to reduce this luck factor in the future.
          *   Don't internalize the guilt as culpability, but as awareness of systemic fragility.

  5.  **Refining the Tone:**
