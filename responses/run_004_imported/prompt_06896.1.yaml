answer: |-
  **The Parity Break**

  Elias touched the ridge of bone behind his left ear. The Synapse was warm, as always. It was a subdermal drive, permanently affixed to his nervous system. For three years, it had functioned exactly like Otto's notebook, only faster. 

  The integration was total. First, it was **always available**; the Synapse never left his skin, sleeping or waking. Second, it offered **easy access**; thoughts queried from it arrived as instantly as biological memory, requiring no conscious search. Third, he **trusted it implicitly**. When the Synapse flashed a route or a name, Elias acted without hesitation, treating the data as indistinguishable from his own neural firings. 

  But the crucial condition, the one Clark and Chalmers insisted upon, was the fourth: **past endorsement**. Elias only believed what the Synapse held because he had consciously logged it there himself. He hadn't just read the data; he had *authored* it. That was the glue. That was what made the silicon part of his mind rather than just a tool in his pocket.

  Today was the reunion. Elias stood outside the banquet hall, needing to recall the name of his old lab partner. He focused. The Synapse whirred softly. *Julian Vane.* 

  Elias smiled. He remembered typing that name in five years ago, linking it to a photo and a voice print. He had endorsed it. It was his belief.

  He entered the hall. The room was a wash of faces. He navigated the crowd, the Synapse feeding him names as he looked at people. *Sarah. Marcus. Dr. Chen.* He greeted them warmly, the information flowing so seamlessly he felt no difference between recalling a childhood memory and recalling a name from the drive. The boundary of his skin seemed irrelevant; his mind extended into the tech.

  Then he saw her. A woman with sharp eyes and a red dress. He looked at her, expecting the Synapse to serve up her name. 

  *Elara Vance.*

  Elias froze. He knew this woman. They had graduated together. But he didn't remember logging "Elara Vance." He remembered her as "Elara Thorne." She had married years ago, changed her name, and told him over coffee. He remembered that conversation. But he hadn't updated the Synapse. He had meant to, but he never tapped the "save" command.

  So how did "Vance" get there?

  He realized then that the Synapse had auto-synced with a public database overnight. It had scraped the information and inserted it into his active memory bank without his conscious input. 

  The four conditions hung in his mind. 
  1. **Available?** Yes. 
  2. **Accessible?** Yes. 
  3. **Trusted?** He wanted to trust it. 
  4. **Past Endorsement?** No.

  He had not consciously endorsed this update. He hadn't vetted it. He hadn't made it his own. According to the parity principle, if Inga's biological brain had a fact inserted without her knowing, it wouldn't count as a belief—it would be delusion or external input. 

  The seamless extension snapped. Suddenly, the text *Elara Vance* didn't feel like a memory. It felt like a notification. It felt like something someone else was telling him, not something he knew. The "glue" dissolved. The Synapse was no longer part of his mind; it was just a device feeding him data he hadn't verified.

  He walked up to her, the device suddenly feeling like a foreign object behind his ear. 

  "Elara," he said, testing the word. It felt hollow. 
  "Actually, I kept my maiden name," she laughed. "Thorne. Remember?"

  Elias nodded, ignoring the flashing correction in his periphery. The Synapse was still there, still accessible, still available. But because he hadn't put the information there himself, he couldn't believe it. It was just noise. He was back inside his own head, alone.
