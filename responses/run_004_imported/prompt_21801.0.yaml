          *   This is the "Gibbard" part of Gibbard-Satterthwaite (Gibbard 1973 actually covers ordinal, but Gibbard 1978 extends to cardinal/randomized). There is a theorem (often called the Gibbard Hylland Theorem or similar impossibility results for cardinal schemes) that says no cardinal voting scheme is strategy-proof without being dictatorial or imposing restrictions.
