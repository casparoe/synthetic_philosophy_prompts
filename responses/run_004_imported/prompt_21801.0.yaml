      *   *Exchange 1:* Dev (Technical), Sasha (Substantive). Let's give the edge to Dev on strict accuracy, but note Sasha's point is more important. Actually, in a theory seminar, definitions matter. Dev is right that GS *theorem* premises aren't met.
      *   *Exchange 2:* Dev (Utility theory), Sasha (Mechanism constraints). Dev is right that utility is affine. Sasha is right that mechanisms require bounds. It's a draw/stalemate based on level of abstraction.
      *   *Exchange 3:* Sasha. Score voting is definitely manipulable.
