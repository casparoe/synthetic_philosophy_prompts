      *   *Correction on Sasha's normalization:* Sasha says "spacing everyone else by relative utility is literally the standard normalization." This assumes risk neutrality. If voters are risk-averse, the "honest" mapping isn't linear. This is a subtle point Dev missed but Sasha also glossed over.
