      *   **The Generalized Gibbard Theorem:** Gibbard (1978) "Strategy-proofness and Single Peakedness" or his work on random social choice functions. Actually, the specific result is that *no* voting system (ordinal or cardinal) is strategy-proof if it allows enough flexibility.
      *   **Distinction between Ordinal and Cardinal Manipulation:** In GS, manipulation is reversing an order ($A \succ B$ reported as $B \succ A$). In Score, it's compression/exaggeration ($u(B)$ reported as $u_{min}$).
      *   **The "Honesty" Benchmark:** In mechanism design, "truthful" means reporting your type. In cardinal voting, your type is your utility function. But since the mechanism forces a bounded range, "truthful" means mapping your utility to the range linearly (or according to some risk-neutral assumption).
      *   **Practical vs. Theoretical:** Score voting might be *less* susceptible to strategy in practice (or the strategies are simpler), but theoretically, it fails strategy-proofness.
      *   **Approval Voting:** Score voting collapses to Approval Voting under optimal strategy (binary scores). This is a key insight missing.

