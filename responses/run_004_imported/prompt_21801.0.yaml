      *   **Score Voting (Range Voting):** Voters assign cardinal scores (e.g., 0-10). Winner is highest average/sum.
      *   **Manipulability in Score Voting:** Is it strategy-proof? No. Voters have an incentive to "bullet vote" or exaggerate scores (max/min) rather than report true utility.
      *   **Cardinal vs. Ordinal Utility:** GS assumes ordinal inputs. Score voting assumes cardinal inputs. However, strategic behavior exists in both.
