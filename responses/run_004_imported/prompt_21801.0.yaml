      Dev is theoretically deeper here. Utility *is* affine. Fixing endpoints doesn't fix the middle without assuming risk neutrality. Sasha assumes linear mapping is "honest." Dev is right that "honesty" is ill-defined without risk assumptions.
      *However*, in the context of voting mechanisms, "truthful" is defined as reporting your valuation. If the mechanism asks for 0-10, and I value B at 70% between A and C, reporting 7 is truthful *relative to the mechanism*. Dev is being a bit pedantic about utility theory vs. mechanism language.
