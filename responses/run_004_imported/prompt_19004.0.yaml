  **C Tier:** This objection accepts the logical conclusion regarding mathematics but denies it supports further metaphysical claims about consciousness or specific physical mechanisms. It limits the scope of the argument's fallout rather than refuting its internal logic regarding computability (8).

  **D Tier:** This objection confuses computability theory with computational complexity, raising practical resource limits against a principled argument about what is computable in principle. It is largely orthogonal to the theoretical claims, as Gödelian arguments typically assume idealized, resource-unbounded reasoners (6).
