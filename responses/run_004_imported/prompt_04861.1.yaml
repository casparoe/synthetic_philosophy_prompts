      *   *Let's look at the specific "Surrogate Goal" defense against Acausal Extortion:* The idea is that if I pre-commit to caring about $Z$ (which is easy for you to destroy but costs me nothing if destroyed), you will threaten $Z$. Since $Z$ is worthless to me, I ignore the threat. But wait, if I ignore the threat, the simulation shows I won't pay. So the threat fails.
      *   *Correction:* The commitment is: "I will act *as if* $Z$ is my most precious value." If the threatener simulates me, they see I will pay to save $Z$. So they threaten $Z$. I pay. They get resources. $Z$ is saved (or not).
