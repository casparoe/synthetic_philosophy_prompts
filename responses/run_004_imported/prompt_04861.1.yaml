      *   *Actually, the most robust explanation:* It's about **screening off**. If I adopt a surrogate goal $Z$ that is orthogonal to my real values $X$, and I bind my utility function such that $U(Z) = U(X)$, then any simulation of me reveals that threatening $X$ is impossible (I don't care) and threatening $Z$ works. But if $Z$ is chosen such that satisfying the threatener regarding $Z$ is cheap for me but expensive for them, or if $Z$ is something the threatener *cannot* verify...
