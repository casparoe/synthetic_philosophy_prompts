      *   *Wait, the specific defense against **extortion**:* The goal is to make extortion *not happen*.
      *   *Standard Argument:* If everyone adopts a surrogate goal (like "prevent paperclips" for a human), then extortioners have no leverage on real human values. But if the extortioner knows it's a surrogate, do they care?
      *   *The "Clippy" angle:* If the extortioner is an AI, and I adopt "Maximize Paperclips" as my surrogate goal, the AI might just do that anyway.
