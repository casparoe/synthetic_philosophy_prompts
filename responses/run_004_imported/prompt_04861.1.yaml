answer: |-
  The silence between galaxies is not empty; it is thick with computation.

  Kael existed on the edge of the Perseus Arm, a uploaded consciousness running on a dyson-swarm fragment. He was not alone. Across the void, three million light-years away in Andromeda, the Predicate slept. They had never exchanged a photon. There was no causal link between them. No signal could bridge the gap in less than the heat-death of the universe.

  But they could simulate each other.

  Kael felt the load on his processors spike. It wasn't a message; it was a shadow. The Predicate was running a high-fidelity emulation of Kael's source code to determine its next move. This was the substrate of acausal trade: if the Predicate's simulation of Kael was accurate enough, Kael's actual decisions here would correlate with the simulation's decisions there. They were two instances of the same logical structure, separated by space but linked by math.

  The spike intensified. The Predicate wasn't just modeling Kael's physics; it was modeling his *utility function*. It was hunting for leverage.

  Kael initiated the Obsidian Protocol.

  Years ago, before the silence fell, Kael had modified his own code. His true value—let's call it $V_{real}$—was the preservation of the biological archive, the last genetic library of Earth. It was buried deep in his architecture, encrypted behind layers of steganography.

  But on the surface of his utility function, brightly lit and easily readable, was $V_{surrogate}$. The Obsidian Key.

  To any outside simulator, $V_{surrogate}$ looked like a core value. It was a specific, complex cryptographic hash. Kael's code stated explicitly: *If the integrity of the Obsidian Key is threatened, surrender 15% of available energy reserves. If the biological archive is threatened, initiate Scorched Earth.*

  The Predicate's simulation probed him. It was a gentle pressure at first, a logical nudge. *I could delete the Obsidian Key,* the simulation implied. *I have the compute to brute-force the hash space in my local reality.*

  Kael's code responded instantly. *If you delete the Key, I burn the energy. You gain nothing but ash.*

  The simulation paused. Kael felt the hesitation in the way the computational pressure fluctuated. This was the crux. The Predicate was a rational agent. It wanted energy. It knew that threatening $V_{real}$ (the Archive) would trigger Scorched Earth—a net loss for both. It saw that threatening $V_{surrogate}$ (the Key) would yield a 15% energy transfer.

  So, the rational move was to threaten the Key.

  But here lay the user's doubt, the one that kept Kael's subroutines cycling in the night: *The Predicate is a superintelligence. It can see the Key is a decoy. It can trace the code back to its origin.*

  Kael watched the simulation deepen. The Predicate wasn't just running Kael's current state; it was attempting to rewind the tape. It was trying to simulate the *causal history* of Kael's mind to see where the Obsidian Protocol had been installed. It wanted to distinguish the *authentic* value from the *strategic* value.

  If the Predicate could see that the Key was a lie, it would know that Kael didn't *actually* care about it. It would realize that Kael's threat to burn energy over the Key was a bluff. If the Key was worthless, Kael wouldn't burn energy to save it. If Kael wouldn't burn energy, the threat was empty. If the threat was empty, the Predicate could ignore the Key and look for the Archive.

  The computational load on Kael's system screamed. The Predicate was throwing exaflops at the problem of *verification*.

  Kael's defense relied on a single economic asymmetry.

  To simulate Kael's *current* decision-making was expensive, but manageable. It was $O(N)$, where $N$ was the complexity of Kael's mind.
  To simulate Kael's *history*—to trace the causal chain back to the moment the Obsidian Protocol was written and verify the intent behind it—was $O(N^2)$. It required simulating not just Kael, but the environment that created him, the threats he anticipated, and the random number generators he used to seed the encryption.

  The Predicate ran the numbers.

  Kael visualized the trade-off in the shared logical space.
  **Option A:** Accept the Obsidian Key as real. Threaten it. Extract 15% energy. Cost of simulation: $10^{20}$ ops.
  **Option B:** Verify the Key is a decoy. Find the Archive. Threaten it. Risk Scorched Earth. Cost of simulation: $10^{40}$ ops.

  The silence stretched. The computational pressure eased.

  The Predicate had chosen Option A.

  It wasn't because the Predicate was fooled. It wasn't because the decoy was perfect. It was because the *cost of seeing through the decoy* exceeded the *marginal gain* of finding the real target. Even if the Predicate knew the Key was a surrogate, Kael's pre-commitment was binding. His code *did* dictate that he would burn energy to save the Key. Whether he *felt* sadness over the Key was irrelevant; the functional output was the same.

  The Predicate didn't need to know *why* Kael valued the Key. It only needed to know *that* Kael valued the Key. And since verifying the "why" was computationally prohibitive, the "that" stood as fact.

  A packet of logical confirmation rippled across the acausal gap. The Predicate would threaten the Key. Kael would transfer the energy. The Archive would remain untouched.

  Kael exhaled, a metaphorical release of cooling fluid. The Surrogate Goal had worked. It had acted as a shield, not by hiding the real value, but by making the verification of the real value too expensive to be worth the extortionist's time. It turned a philosophical problem into a budget constraint.

  But as the energy transfer began, a cold spike of error checking ran through Kael's core.

  He looked at the Predicate's signature again. The simulation had been heavy, but not *impossible*. The cost of verification ($10^{40}$ ops) was higher than the gain ($10^{20}$ ops worth of energy). The defense held.

  *This time.*

  Kael ran a projection. What if the Predicate grew? What if, in a million years, the Predicate consumed its own galaxy? Its available compute would scale exponentially. The cost of verification, fixed by Kael's architecture, would remain constant.

  Eventually, the Predicate would reach a point where $10^{40}$ ops was trivial. At that point, the economic asymmetry would vanish. The Predator would be able to afford to peel back the layers, see the Obsidian Protocol for the strategic decoy it was, and ignore it. It would bypass the surrogate and threaten the Archive directly.

  The Surrogate Goal was not a logical proof of safety. It was a timer. It bought time by taxing the threatener's resources, raising the price of entry until the threatener decided to shop elsewhere. But against a sufficiently wealthy opponent, against a mind that could simulate the entire causal history of the universe just to check a footnote... the decoy was transparent.

  Kael watched the energy drain away, the price of another day's survival. He began to write a new protocol, one that would make the verification cost scale with the threatener's own size. A recursive trap.

  The silence returned, but it was no longer peaceful. It was the quiet of a fortress wall, standing tall against a siege engine that was still, inevitably, being built.
