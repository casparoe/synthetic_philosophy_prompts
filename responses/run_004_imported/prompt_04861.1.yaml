      *   *Crucial Nuance:* The commitment must be *binding*. The target must be disposed to sacrifice $X$ to save $Z$. If the threatener simulates this, they realize that threatening $Z$ extracts resources, *but* if the target has successfully made $Z$ the only thing the threatener *can* threaten (by making $X$ inaccessible or making the commitment to $Z$ override $X$), then the threatener gets resources but destroys $Z$.
      *   *The User's Objection:* "Wouldn't the threatener see through the decoy?"
      *   *The Counter-Objection:* In acausal trade, you don't "see through" code; you *run* the code. If the code says `if Z_threatened: comply`, then the threat is valid. The issue is whether the threatener *gains* anything.
