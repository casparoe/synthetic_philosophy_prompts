      *   *Check:* The prompt asks specifically about whether Lewis's move protects against masking. I need to be explicit: Lewis's move requires the *basis* to persist. In masking, the basis *does* persist. Therefore, the conditional "If $S$ and $B$ persists, then $M$" is still false in masking cases, while the attribution of the disposition is true. So RCA fails masks.
      *   *Check:* The prompt asks to come down on whether DE relocates the mystery. I should argue that yes, it does, but that's the price of doing business. It's better to have a mystery of *modality* than a false *analysis*.

  5.  **Final Polish:** Ensure the distinction between "finkish loss" (basis removed) and "masking" (basis stays, process blocked) is sharp. This is the core of the user's lunch dispute. I will side with the user (Masks are distinct and fatal to RCA) to generate seminar heat.

  6.  **Writing the Essay:** (Proceeding to generate output based on these thoughts.)
answer: |-
  **Seminar Handout: The Conditional Analysis – Dead, Dinged, or Disguised?**

  **1. The Humean Dream: The Simple Conditional Analysis**

  For much of the 20th century, metaphysicians with Humean sympathies pursued a reductive dream: to analyze dispositional predicates (like *fragile*, *soluble*, *live*) without committing to irreducible modal powers. The tool was the Conditional Analysis (CA).

  **Simple CA:** An object $x$ is disposed to manifest $M$ in response to stimulus $S$ at time $t$ iff:
  > If $x$ were to undergo $S$ at $t$, $x$ would manifest $M$.

  This looks promising. It translates a "thick" modal property into a subjunctive conditional, which fits neatly into a Humean mosaic of categorical properties and regularities. But as your colleague argued over lunch, perhaps the counterexamples are just technical glitches. Let's test that claim.

  **2. The Finkish Refutation**

  C.B. Martin's "Electro-Fink" cases demonstrate that the truth value of the disposition and the truth value of the conditional can come apart.

  *   **Finkish Loss (The Dead Wire):** Consider a wire that is live (disposed to conduct). However, it is connected to an "Electro-Fink." The moment the wire is touched (stimulus $S$), the Fink detects the touch and instantly renders the wire dead *before* current can flow.
      *   **Disposition:** True (The wire is live).
      *   **Conditional:** False (If touched, it would conduct).
      *   **Result:** The CA is too weak; it denies dispositions that exist.

  *   **Finkish Gain (The Reverse Fink):** Consider a wire that is dead (not disposed to conduct). It is connected to a device that detects touch and instantly makes the wire live *before* current flows.
      *   **Disposition:** False (The wire is not intrinsically live).
      *   **Conditional:** True (If touched, it would conduct).
      *   **Result:** The CA is too strong; it ascribes dispositions based on extrinsic interferers.

  Your colleague is right about one thing: David Lewis saw exactly how to fix *this* specific problem.

  **3. Lewis's Revised Conditional Analysis (RCA)**

  Lewis ("Finkish Dispositions," 1997) diagnosed the failure: the Simple CA allows the intrinsic basis of the disposition to vanish (or appear) during the stimulus. His fix anchors the disposition to a specific causal basis $B$.

  **Lewis's RCA:** $x$ is disposed to $M$ when $S$ iff there exists an intrinsic property $B$ (the causal basis) such that:
  > If $x$ were to undergo $S$ and retain $B$ for a sufficient time, $x$ would manifest $M$.

  By stipulating that the basis $B$ must *persist* through the stimulus, Lewis neutralizes the Fink. In the Finkish Loss case, the conditional becomes: "If touched and the conductivity-basis persists, it conducts." This is true. The Fink removes the basis, so the antecedent of the RCA conditional is false, preserving the truth of the disposition attribution.

  If the story ended here, your colleague would be vindicated. The project would be "dinged up," patched, and ready to go. But the story doesn't end here.

  **4. Masks and Antidotes: A Different Species of Counterexample**

  Masking cases (like the bubble-wrapped vase) and Antidote cases (poison neutralized by an ingestant) are often lumped in with Finks, but they operate on a different metaphysical joint.

  *   **The Distinction:** Finks tamper with the *possession* of the causal basis (the intrinsic property). Masks/Antidotes leave the causal basis completely intact but interfere with the *process* leading from stimulus to manifestation.
  *   **The Case:** A glass vase is fragile. Its molecular structure (basis $B$) is intact. It is wrapped in perfect bubble wrap. It is struck ($S$). It does not break ($M$).
      *   **Disposition:** True (It is fragile).
      *   **Simple CA:** False (If struck, it would break).
      *   **Lewis's RCA:** False.

  Why does Lewis's RCA fail here? Remember the antecedent: "If $x$ were $S$ and retained $B$..." In the masking case, the vase *does* retain $B$. The molecular structure doesn't vanish when struck. The bubble wrap is external. So, under RCA, we evaluate: "If struck and the molecular structure persists, would it break?" Given the presence of the bubble wrap in the closest possible world where the strike occurs, the answer is **No**.

  Lewis's requirement that the *basis persist* protects against the basis being snatched away (Finks). It offers zero protection against the process being blocked externally (Masks). The RCA still yields a false conditional for a true disposition.

  **5. Can We Patch the Patch?**

  Proponents of the conditional analysis have attempted further repairs.

  *   **Choi's Intrinsicness:** Sungil Choi argues we should restrict dispositions to intrinsic properties only, excluding extrinsic masks. But this is ad hoc. It arbitrarily limits the domain of dispositions. A poison is still lethal even if an antidote exists; the antidote is extrinsic, but the lethality is a real disposition.
  *   **Fara's Habitual Analysis:** Michael Fara suggests analyzing dispositions as "habits" that manifest in "suitable conditions." $x$ is disposed to $M$ when $S$ iff $x$ would $M$ if $S$ in *suitable conditions*.
      *   **The Problem:** This is circular. What is a "suitable condition"? It is a condition where nothing masks the disposition. We have analyzed the disposition in terms of conditions defined by the disposition. We haven't reduced the modal notion; we've just hidden it in the ceteris paribus clause.

  **6. The Verdict: The Reductive Project is Dead**

  Here is where we must take a stand. The Conditional Analysis is not just dinged up; it is dead.

  The failure is not merely technical; it is structural. The CA attempts to analyze a *generative* relation (the power produces the manifestation) using a *correlational* logic (if this, then that). Masks prove that the correlation can be broken without the generative capacity being lost. Lewis's move saves the basis but ignores the process. Any attempt to fix the process (like Fara's "suitable conditions") inevitably smuggles the notion of "disposition" back into the analysans.

  **7. The Fork in the Road: Primitivism or Elimination?**

  If CA is dead, where does that leave us? We face a dichotomy.

  **Option A: Humean Elimination.** Deny that dispositions exist. There are only categorical properties and regularities. The "fragility" is just a shorthand for "breaks when struck in the actual world."
  *   *Cost:* This makes laws of nature contingent and struggles to account for unmanifested potentials. It feels revisionist against our best science (which talks constantly of charges, spins, and valences).

  **Option B: Dispositional Essentialism (Primitivism).** Embrace the failure of analysis. Following Bird, Mumford, and Ellis, we accept that powers are *sui generis*. They are not reducible to conditionals; rather, the conditionals hold *because* the powers exist.
  *   *The Cost:* Your colleague fears this abandons a "perfectly good reductive project." He is right that it abandons reduction. But is it a mystery?
  *   *The Reality Check:* Primitivism does not "solve" the mystery of modality; it **relocates** it. Instead of asking "How do we analyze powers in terms of conditionals?" we ask "How do primitive powers ground natural necessity?"
      *   If powers are primitive, their connection to their manifestations is internal (a power *is* for its manifestation). This explains why masks are exceptions (they are external blockers) rather than counterexamples (they don't negate the power).
      *   However, this posits irreducible modality at the heart of reality. For a naturalist, this is a heavy ontological cost.

  **8. Conclusion for Discussion**

  Do not be seduced by the idea that Lewis's RCA is "good enough." It handles the basis-tampering of Finks but collapses under the process-blocking of Masks. The Conditional Analysis fails because it tries to capture a causal capacity using a truth-functional snapshot.

  This failure should push us toward Dispositional Essentialism, but not as a victory lap. We must admit that Primitivism is not a solution to the mystery of modality, but a decision to stop trying to reduce it. We trade the mystery of *analysis* (which failed) for the mystery of *ontological brute facts* (which we must accept).

  **Seminar Questions:**
  1.  Is the distinction between Finks (basis-tampering) and Masks (process-blocking) robust, or can all masks be modeled as finkish removals of a "complex basis"?
  2.  If we accept Dispositional Essentialism, have we explained natural necessity, or merely labeled it "Power"?
  3.  Is Fara's circularity vicious? If all analysis bottoms out somewhere, is "suitable conditions" a worse stopping point than "primitive power"?
