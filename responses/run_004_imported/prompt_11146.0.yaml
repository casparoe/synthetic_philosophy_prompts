answer: |-
  # The Blade and the Shield: Why the Evolutionary Debunking Argument Does Not Prove Too Much

  The evolutionary debunking argument (EDA) is the nuclear option of metaethics. Sharon Street's formulation is precise: if moral realism posits mind-independent normative truths, and our moral beliefs are the product of natural selection acting on reproductive fitness, then the alignment between our beliefs and those truths is a massive, unexplained coincidence. Realists must either deny the evolutionary premise (implausible) or explain the alignment (difficult).

  But there is a counter-move that haunts every discussion of Street's dilemma, one that Eliezer Yudkowsky gestured toward and that keeps realists awake at night: the "Proves Too Much" objection. The cognitive faculties that generate moral beliefs are the same ones that generate beliefs about logic, mathematics, and empirical science. If evolution selected for fitness rather than truth, why trust *modus ponens*? Why trust that $2+2=4$? If the EDA undermines morality, it seems to undermine the very reasoning used to formulate the EDA. This leads to a trilemma: accept global skepticism, reject the EDA, or accept that morality is uniquely vulnerable.

  Most discussions stall here, retreating into a polite stalemate. This is a mistake. The "Proves Too Much" objection is not a gotcha; it is a test of the EDA's precision. After examining the best attempts to draw a line between morality and math, I argue that the objection fails. There is a principled, robust asymmetry between moral beliefs and logical/mathematical beliefs. The EDA does not nuke reason; it specifically targets **Robust Non-Naturalist Realism**. The verdict is this: **The "Proves Too Much" objection is unsound because it conflates the structural preconditions of cognition with the substantive outputs of cognition.** Logic and basic math are constitutive of the fitness-tracking mechanism itself; moral truths (as defined by the realist target) are not.

  ### The Force of the Generalization

  To understand why the objection feels so potent, we must grant its strongest form. Alvin Plantinga's Evolutionary Argument Against Naturalism (EAAN) argues that if naturalism and evolution are true, the probability that our cognitive faculties are reliable is low or inscrutable. If our brains are designed to survive, not to know, then a false belief that promotes survival (e.g., "tigers are gods to be worshipped") is just as fit as a true one ("tigers are dangerous predators").

  Applied to Street's dilemma, the skeptic argues: "You say evolution shaped our moral intuitions to promote cooperation, not to track 'The Good.' But evolution also shaped our intuition that 'an object cannot be in two places at once' to promote navigation, not to track 'Metaphysical Necessity.' If the causal history of the belief screens off the truth of the belief in the moral case, it does so in the logical case too."

  If this holds, the EDA is self-defeating. We use logic to argue for the EDA. If the EDA undermines logic, it undermines itself. To avoid this, the defender of the EDA must identify a relevant difference between the domain of morality and the domain of logic/math.

  ### Failed Asymmetries

  Before isolating the correct asymmetry, we must discard the common but insufficient ones.

  First, the **Convergence Argument**. Realists often claim that while moral beliefs vary wildly across cultures, logical and mathematical beliefs converge. Everyone accepts non-contradiction; not everyone accepts utilitarianism. This is empirically weak. While basic logic converges, advanced mathematics (the realm of realists' "truths") does not appear in hunter-gatherer societies. If evolution only selected for "counting sheep," why trust our beliefs about infinite set theory? The convergence on basic logic might just be convergence on useful heuristics, not truth.

  Second, the **Indispensability Argument**. This suggests math is indispensable to science, while morality is not. But this begs the question. A moral realist argues morality is indispensable for practical reasoning and social cohesion. If the EDA challenges the *truth-aptitude* of that reasoning, saying "but we need it" is pragmatic, not epistemic. We "need" false comforting beliefs too.

  Third, the **Causal Access Argument**. Some argue we can causally interact with physical objects that instantiate math (two apples), but not with moral facts. But Robust Realists explicitly deny moral facts are physical. The problem is that they *also* usually deny mathematical objects are physical (Platonism). If both are abstract, both are causally inert. If the EDA works on causally inert moral facts, it should work on causally inert mathematical facts.

  These defenses fail because they treat math and morality as similar kinds of "beliefs about the world" and then try to find external differences. The real difference is internal to the architecture of belief formation.

  ### The Constitutive Asymmetry

  The decisive asymmetry lies in the relationship between the cognitive faculty and the content of the belief. This is the **Constitutive Indispensability** argument.

  For the EDA to work, there must be a gap between "belief that promotes fitness" and "belief that is true." In the moral case, this gap is wide. A society can be reproductively fit while believing in a false moral theory (e.g., a rigid caste system that stabilizes population but violates mind-independent equality). Evolution selects for the *behavior* (cooperation), not the *justification* (moral truth). Therefore, the content of the moral belief is explanatorily redundant.

  In the case of basic logic and arithmetic, this gap collapses. Evolution selects for organisms that can track objects, navigate space, and predict cause-and-effect. To "track an object" *just is* to employ a rudimentary logic of identity and non-contradiction. To "count sheep" *just is* to employ rudimentary arithmetic.

  There is no distinction between the "fitness-promoting heuristic" and the "logical truth" at the foundational level. If an organism believes $1 + 1 = 3$ in a robust, action-guiding way, it will fail to track resources and predators. It will not just have a "false belief"; it will have a broken cognitive mechanism. The laws of basic logic and arithmetic are not *outputs* of the cognitive system that happen to align with the world; they are the *structural constraints* required for the system to interact with a structured world at all.

  Street's target is the Realist who claims moral truths are *independent* of our valuing attitudes. The Realist claims there is a fact of the matter about value even if no one values it. But no one claims there is a fact of the matter about logical identity independent of the concept of an object. To doubt basic logic is not to doubt a specific domain of truth; it is to doubt the coherence of "truth" itself.

  Therefore, the EDA cannot generalize to logic without becoming self-undermining in a way that is distinct from the moral case. If I argue "Logic is unreliable," I am using logic to argue. This is a performative contradiction. If I argue "Morality is unreliable," I am using logic to argue about morality. There is no performative contradiction there. The "Proves Too Much" objection tries to force the moral case into the logical case, but the logical case is the *ground* on which the argument stands. You cannot pull the rug out from under yourself and claim you are still standing.

  ### The Verdict on Robust Realism

  Does this save mathematics entirely? Not necessarily. It saves *basic* logic and arithmetic—the parts constitutive of fitness. It does not necessarily save high-level Platonist mathematics (e.g., large cardinal axioms) from a similar debunking pressure. However, this does not help the moral realist.

  The moral realist posits moral truths that are analogous to *high-level* math, not basic counting. They posit abstract, non-natural properties that supervene on natural facts but are not identical to them. This is the crucial disanalogy.

  1.  **Basic Math/Logic:** Evolution selected for these directly because they *are* the tools for tracking fitness-relevant physical regularities. The truth of $1+1=2$ is linked to the physical structure of the world evolution navigates.
  2.  **Moral Truths (Non-Naturalist):** Evolution selected for pro-social *behaviors*. The Realist claims these behaviors are guided by mind-independent *Normative Facts*. But unlike basic math, these facts are not required to navigate the physical world. One can navigate the physical world perfectly (survive, reproduce) while being entirely wrong about Non-Natural Moral Truths (if they exist).

  The "Proves Too Much" objection assumes that because both faculties evolved, both are equally vulnerable. This ignores the *content* of what was selected. We were selected for *physical competence*. Basic logic is the syntax of physical competence. Morality (of the Robust Realist variety) is a claimed *semantic addition* to that competence.

  Consequently, the EDA does not prove too much. It proves exactly enough. It generates skepticism about domains where the evolutionary explanation of the belief screens off the truth of the belief. In basic logic, the evolutionary explanation *is* the truth explanation (tracking physical structure). In Robust Moral Realism, the evolutionary explanation (promoting cooperation) is distinct from the truth explanation (tracking mind-independent normativity).

  ### Conclusion

  The "Proves Too Much" objection is a powerful rhetorical device, but it fails as a philosophical refutation. It relies on a false equivalence between the structural preconditions of reasoning and the substantive claims of ethics. We cannot coherently doubt the logic used to formulate the doubt; we can coherently doubt the moral intuitions that arise from our social programming.

  The verdict is clear: **The asymmetry holds.** The Evolutionary Debunking Argument successfully targets Robust Moral Realism without collapsing into global skepticism. It forces us to accept that while our logical faculties are tuned to the structure of reality (because they must be to function), our moral faculties are tuned to the structure of social survival. If the Realist wants to claim our moral faculties also track mind-independent truth, they owe us an explanation for that alignment that does not apply to logic. Until they provide one, the EDA stands. The blade cuts morality, but the shield of logic holds.
