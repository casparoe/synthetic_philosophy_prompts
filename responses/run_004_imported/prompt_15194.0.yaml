answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinction of being [Advisor's Name]'s most senior remaining student. Which, in academia, is a fancy way of saying I'm the one who hasn't run away fast enough yet.

  We have a wonderful mix of people here tonight. We have her family, who know her as a mother, a partner, and a friend. And we have her colleagues and students, who know her as the person who fundamentally reshaped how we understand interactive proofs and zero-knowledge protocols.

  Bridging those two groups is always a challenge. But I think [Advisor's Name] actually gave us the tool to do it.

  She spent the first part of her career proving things about what can be computed. She spent the second part arguing about what those proofs *mean* for how we think, how we trust, and how we create.

  Now, I know there is a skepticism about that second part. I had a debate about it just last week with a friend. He argued that taking complexity theory and applying it to human life is just "dressed-up poetry." He said that asymptotic worst-case claims about infinite families of instances can't literally tell us anything about whether one particular person finds it easier to recognize a good idea than to have one. He said she was smuggling in philosophical insights by metaphor, then taking credit as if she'd derived them from a theorem.

  I used to worry about that. I worried that maybe the philosophy was just marketing for the math.

  But then I thought about tonight. And I realized there is a famous question in our field: Is finding a solution harder than checking one? Is it harder to write the proof, or to verify it?

  **Here is the one technical joke I promise to make tonight:** In complexity theory, we usually assume checking is easier than finding. But looking at her publication record, finding a flaw in her work is clearly the harder problem. And tonight, verifying that she deserves this retirement is easy—that's in P. But finding the words to actually express what she means to us? That, I'm afraid, is NP-Hard.

  *(Pause for laughter)*

  But seriously, that gap—between finding and checking—is where I think my friend was missing the point. And it's where [Advisor's Name] was right.

  She never claimed that a theorem about Turing machines *is* a human being. She knew that asymptotics aren't lives. What she showed us was that if you want to talk about trust, or creativity, or testimony, you can't just use loose metaphors. Loose metaphors let you get away with fuzzy thinking.

  She demanded that our metaphors hold up to rigor. She taught us that if you claim "trust is like a zero-knowledge protocol," you have to submit that claim to the same scrutiny you'd submit a lemma. Does it break under composition? Does it hold if the verifier is malicious?

  By forcing the philosophy to be as disciplined as the math, she didn't turn life into a theorem. She turned the conversation into something honest. She showed us that formal ideas can structure real insight without applying "literally," in the same way that a map isn't the territory, but a good map stops you from walking off a cliff.

  To her family: Thank you for sharing her with us, even when she was thinking about oracle separations at the dinner table.

  To her colleagues: Thank you for keeping the standard high.

  And to [Advisor's Name]: Thank you for teaching us that the gap between knowing something is true and understanding *why* it matters is not a bug. It's the feature.

  Please raise your glasses. To [Advisor's Name]. May your retirement be in Algorithmica, where everything is easy, but may your memories be in Cryptomania, where the secrets are worth keeping.

  Cheers.
