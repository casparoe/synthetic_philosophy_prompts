answer: |-
  This is **not a safe assumption**, and proceeding with that plan could lead to a significantly different (and potentially contentious) profit split than you expect.

  There is a critical misunderstanding in your premise: **The Kalai–Smorodinsky (KS) solution does *not* satisfy Independence of Irrelevant Alternatives (IIA).**

  In fact, the violation of IIA is the defining theoretical distinction between the Nash Bargaining Solution (NBS) and the Kalai–Smorodinsky solution. If you remove options from the feasible set before calculating KS, you **will** likely change the outcome, even if those options seem "extreme" or "suboptimal."

  Here is a detailed breakdown of why this happens and what you should do instead.

  ### 1. The Axiomatic Difference
  You are correct that the **Nash Bargaining Solution** satisfies IIA. Nash's axioms are:
  1.  Pareto Efficiency
  2.  Symmetry
  3.  Invariance to Affine Transformations
  4.  **Independence of Irrelevant Alternatives (IIA)**

  However, the **Kalai–Smorodinsky solution** was specifically developed because some theorists felt IIA was too restrictive and led to counter-intuitive results in certain bargaining contexts. KS replaces IIA with a different axiom: **Individual Monotonicity**.
  *   **IIA (Nash):** If you shrink the feasible set but keep the solution point available, the solution shouldn't change.
  *   **Individual Monotonicity (KS):** If the feasible set expands in a way that increases one player's maximum possible payoff (without hurting the other's maximum), that player should not end up worse off in the final agreement.

  Because KS prioritizes Individual Monotonicity, it **must** violate IIA. The KS solution is sensitive to the *shape* and *bounds* of the feasible set, not just the Pareto frontier near the solution.

  ### 2. Why "Cleaning Up" Changes the KS Solution
  The KS solution is calculated geometrically using two points:
  1.  The **Disagreement Point** ($d$): What happens if you fail to agree.
  2.  The **Ideal Point** ($u^*$): The maximum utility each player could possibly achieve within the feasible set, assuming the other player gets at least their disagreement payoff.

  The KS solution is the point where the **Pareto frontier** intersects the straight line connecting the Disagreement Point to the Ideal Point.

  **The Problem with Your Plan:**
  When you propose removing "extreme" profit splits (e.g., scenarios where you get 100% of the profit and your co-founder gets 0%, or vice versa), you are likely removing the points that define the **Ideal Point**.

  *   Even if a 100/0 split is "suboptimal" for the partnership and nobody would actually agree to it, it establishes your maximum aspiration level.
  *   If you remove that point, your maximum possible payoff drops (say, to 80%).
  *   This shifts the Ideal Point.
  *   This changes the slope of the line connecting Disagreement to Ideal.
  *   This changes where that line hits the Pareto frontier.
  *   **Result:** The final agreed-upon split changes.

  ### 3. A Simple Numerical Example
  Imagine a joint venture where the disagreement point is $(0,0)$.

  **Scenario A (Full Feasible Set):**
  *   Maximum you can get: $\$100$ (Co-founder gets $\$0$)
  *   Maximum co-founder can get: $\$100$ (You get $\$0$)
  *   **Ideal Point:** $(100, 100)$
  *   **KS Line:** Connects $(0,0)$ to $(100,100)$. This is a 45-degree line (equal split aspirations).
  *   **Outcome:** If the efficient frontier is symmetric, the KS solution is $(50, 50)$.

  **Scenario B ("Cleaned" Feasible Set):**
  *   You decide the $\$100/\$0$ splits are "extreme" and remove them.
  *   New Maximum you can get: $\$80$ (due to remaining constraints)
  *   Maximum co-founder can get: $\$100$ (unchanged)
  *   **Ideal Point:** $(80, 100)$
  *   **KS Line:** Connects $(0,0)$ to $(80,100)$. This line is steeper; it favors the co-founder's aspirations.
  *   **Outcome:** The intersection with the frontier will now shift in favor of your co-founder. You might end up with $(44, 56)$ instead of $(50, 50)$.

  By "tidying up" the set, you have inadvertently lowered your own bargaining anchor.

  ### 4. Strategic Implications for Your Joint Venture
  Since you are co-founders trying to be fair, transparency is key.

  1.  **Do Not Prune the Set for KS:** If you use Kalai–Smorodinsky, you must include **all** theoretically feasible outcomes, even the unrealistic or extreme ones. They serve as the "aspiration anchors" for the calculation. Excluding them is mathematically equivalent to capping your own aspirations.
  2.  **Consider Nash Instead:** If you want the property you described (where removing unchosen options doesn't change the outcome), you should use the **Nash Bargaining Solution**. NBS is robust to the removal of Pareto-inferior options. However, be aware that NBS has its own criticisms (it can be sensitive to how utility is scaled, though the affine invariance axiom handles this theoretically).
  3.  **Beware of Manipulation:** Since KS is sensitive to the feasible set, either of you could theoretically manipulate the outcome by arguing that certain extreme outcomes are "infeasible" to shift the Ideal Point. To maintain trust, you must agree on the *full* feasible set before choosing the solution concept.

  ### Recommendation
  **Stop the "cleanup" plan.**

  If you are committed to the Kalai–Smorodinsky solution, you must define the feasible set to include the maximum possible profit each of you could individually claim, even if those scenarios are unrealistic. Those points are not "irrelevant alternatives" in KS theory; they are the **reference points for fairness**.

  If you find this counter-intuitive (i.e., "why should an outcome we'd never accept affect the deal?"), that is a sign you might prefer the **Nash Bargaining Solution**, which aligns better with your intuition about IIA.

  *Disclaimer: While bargaining theory provides a robust framework for fairness, it is a mathematical model. In a real-world co-founder agreement, ensure you also consult with legal counsel to formalize the arrangement.*
