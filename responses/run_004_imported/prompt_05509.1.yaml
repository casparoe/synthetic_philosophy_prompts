answer: |-
  To: Decision Theory Reading Group
  From: [Your Name]
  Re: Resolute Choice and the Toxin Puzzle

  Here is the case for the "resolute choice" response to Kavka's Toxin Puzzle, structured for our upcoming discussion.

  ### 1. The Diagnosis: Sophistication vs. Resoluteness

  The consensus in our group mirrors the standard reception of Kavka's paper: that the puzzle demonstrates a structural limit on intention. The reasoning relies on the principle of **separability** (or **dynamic consistency**) found in standard Expected Utility Theory (EUT). This view, often termed **Sophisticated Choice**, holds that a rational agent must maximize utility at every decision node, treating future choices as independent problems.

  Under Sophistication:
  1.  **At Noon ($t_2$):** The money is already in the bank (or not). Drinking the toxin yields only pain. The dominant strategy is *Not Drink*.
  2.  **At Midnight ($t_1$):** You know your future self at $t_2$ is rational. Therefore, you know you will *Not Drink*. Consequently, you cannot genuinely *Intend to Drink*.
  3.  **Result:** You cannot form the intention, you get no money, and rationality precludes the payoff.

  The **Resolute Choice** argument (championed by Edward McClennen and David Gauthier) rejects the premise that rationality requires separability. It argues that the unit of rational evaluation is not the isolated act at a time-slice, but the **plan over time**.

  The core claim is this: **Rationality is not about maximizing at every node; it is about choosing the optimal trajectory and adhering to it.** If an agent adopts a plan at $t_1$ that yields higher expected utility than any alternative plan, it is rational to execute that plan at $t_2$, even if the isolated act at $t_2$ appears suboptimal relative to the local options.

  In the Toxin Puzzle, the plan "Intend at $t_1$ and Drink at $t_2$" dominates the plan "Do Not Intend." A resolute chooser recognizes that the only way to access the superior plan is to treat the $t_1$ decision as binding. By refusing to re-optimize at $t_2$, the resolute agent secures the million dollars. The failure to get the money is not a limit on intention; it is a penalty for adopting a defective theory of rationality (Sophistication) that renders the agent **dynamically inconsistent**.

  ### 2. The Mechanism: Intention as a Cognitive Technology

  Kavka assumes that intention is essentially a prediction of future action based on current reasons. If the reasons vanish, the intention cannot exist. Resolute choice re-conceives intention as a **commitment mechanism**.

  For a resolute chooser, forming an intention is not merely predicting what you will do; it is *settling* what you will do. It is a cognitive technology designed to solve coordination problems between your temporal selves. Just as Ulysses binds himself to the mast to solve a conflict between his present and future preferences, the resolute agent binds their future self through the normative force of the plan itself.

  To say "I cannot intend to drink because I won't have a reason to drink" is to beg the question. It assumes the only valid reasons are those present at the moment of action. Resolute choice posits that **the fact that you adopted a plan to secure a benefit is itself a reason to execute the plan.** The "reason" to drink the toxin is not the health benefit (there is none); the reason is fidelity to the optimal policy that secured the million dollars.

  ### 3. The Strongest Objection: The "Fiat" Charge

  The most serious objection to resolute choice—which we must be prepared to defend against—is the charge of **arbitrariness** or **rationality by fiat**.

  **The Objection:**
  If rationality allows you to ignore local maximization at $t_2$ simply because you planned otherwise at $t_1$, what constrains the agent? Couldn't an agent adopt *any* plan at $t_1$ (even a self-destructive one) and then claim it is "rational" to follow through at $t_2$ simply because they committed to it? This seems to make rationality self-serving: "It is rational to do X because I decided X was rational." It severs the link between rationality and the *actual* goodness of the outcome at the moment of action.

  **The Defense:**
  This charge does not stick, provided we distinguish **Resolute Choice** from **Blind Stubbornness**. Resolute choice is not unconstrained fiat; it is constrained by **ex-ante optimality**.

  1.  **The Ex-Ante Constraint:** You are only permitted to be resolute about plans that were optimal *when adopted*. In the Toxin Puzzle, the plan "Drink" is ex-ante optimal because it secures the million dollars. If the billionaire offered no money, the plan "Drink" would not be ex-ante optimal, and resolute choice would *not* counsel drinking. The theory does not allow you to bootstrap bad plans into rationality; it only allows you to stick to good plans that require follow-through to remain good.
  2.  **The Disposition Argument:** Rationality evaluates dispositions, not just acts. Being the *kind of agent* who can resolutely follow through on beneficial plans is itself a utility-maximizing trait. If you are the kind of agent who re-optimizes at every node (the Sophisticate), you are predictably poorer (no million dollars). If you are the kind of agent who is resolute, you are wealthier. Therefore, cultivating and exercising the disposition of resoluteness is rational.
  3.  **No "Magic":** Resolute choice does not claim that drinking the toxin *in isolation* is good. It claims that *drinking-the-toxin-as-part-of-the-plan* is good. The objection assumes that the value of an action must be intrinsic to the action at time $t$. Resolute choice argues that the value of an action is partly derived from its role in a temporally extended strategy.

  The charge of fiat only works if we accept the Sophisticate's premise that the only valid reasons are those present at the moment of action. If we reject that premise (as we should, given the prevalence of dynamic inconsistency), the charge dissolves. The agent isn't saying "I do this because I said so." They are saying "I do this because being an agent who does what they said allows me to access outcomes that agents who don't, cannot."

  ### 4. Relevance to Commitment Devices (Our Next Topic)

  This distinction is critical for our transition into behavioral economics and commitment devices.

  *   **External Commitment (Ulysses/stickK):** Changes the *payoff structure* or *available options* at $t_2$ to align local incentives with global goals. (e.g., You lose money if you don't diet, so dieting becomes locally optimal).
  *   **Resolute Choice (Internal Commitment):** Changes the *decision procedure* at $t_2$. The options and payoffs remain the same, but the agent refuses to treat the node as a fresh optimization problem.

  If Kavka is right, rational agents *require* external commitment devices because they are incapable of internal commitment. If McClennen/Gauthier are right, external devices are merely substitutes for a rational capacity (resoluteness) that we ought to possess but often lack due to weakness of will.

  ### Summary for Discussion

  1.  **Kavka's Conclusion is Theory-Dependent:** The impossibility of the toxin intention is only true under **Sophisticated Choice**. It is not a universal limit on rationality.
  2.  **Resolute Choice Solves the Puzzle:** By treating the plan as the unit of evaluation, a rational agent can form the intention and drink the toxin, securing the payoff.
  3.  **The "Fiat" Objection Fails:** Resolute choice is constrained by ex-ante optimality. It justifies following through only on plans that were optimal to adopt, preventing arbitrary stubbornness.
  4.  **Implication:** The Toxin Puzzle is not a paradox of intention; it is a *reductio* of the standard economic model of sequential choice. It suggests that a complete theory of rationality must account for the stability of plans over time, which is precisely the niche occupied by the literature on commitment devices.

  **Recommended Reading for Backup:**
  *   McClennen, E. F. (1990). *Rationality and Dynamic Choice: Foundational Explorations*. (The definitive text on Resolute Choice).
  *   Gauthier, D. (1994). "Assure and Threaten." *Ethics*. (Connects resolute choice to constrained maximization).
  *   Bratman, M. (1987). *Intention, Plans, and Practical Reason*. (For the philosophy of intention as plan-states).

  This position allows us to move into the commitment device literature not as a study of how to "fix" irrational agents, but as a study of the tools agents use to support the rational capacity for resolute choice.
