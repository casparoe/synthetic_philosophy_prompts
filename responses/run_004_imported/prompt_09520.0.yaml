answer: |-
  Your student has made an excellent observation, one that cuts to the heart of why using *Summa Theologiae* II-II, Q. 64, Art. 7 as a straightforward "origin story" for the modern Doctrine of Double Effect (DDE) in trolley cases is philosophically fraught. The standard textbook reading flattens the text, extracting the "two effects" passage while ignoring the juridical context that frames it.

  To answer your specific questions: Yes, there are effectively two distinct moral justifications operating in this article, partitioned by the **status of the agent** (private person vs. public authority). They are not continuous in the way modern DDE applications often assume. Here is a breakdown of how the arguments relate, how proportionality functions in each, and what this means for your seminar on trolley problems.

  ### 1. The Two Regimes: Private vs. Public
  The article is structured around a single question ("Whether it is lawful to kill a man in self-defense?"), but Aquinas provides a bifurcated answer based on who is acting.

  **Regime A: The Private Person (The DDE Core)**
  *   **The Constraint:** A private individual lacks the authority to dispose of human life. Life belongs to God and the commonwealth. Therefore, a private person *cannot intend* to kill another human being, even an aggressor.
  *   **The Justification:** The act is licit *only* because the death is *praeter intentionem* (beside the intention). The moral species of the act is determined by what is intended (self-preservation), not what is foreseen (death).
  *   **The Logic:** This is the source of the "intention/foresight" distinction cited in trolley literature. It is an **excuse** mechanism. It excuses a private agent from the charge of murder because they did not *choose* death, even though they chose the act that caused it.

  **Regime B: The Public Authority (The Juridical Exception)**
  *   **The Constraint:** None regarding the *intention* of death.
  *   **The Justification:** Soldiers and judges act as ministers of the common good. They possess the authority to dispose of life for the sake of justice or defense of the community.
  *   **The Logic:** Aquinas explicitly says it is lawful for them "to intend killing a man in self-defense." Here, the death is not a side effect; it is part of the intended act. However, this intention must be "referred to the public good." This is not a DDE move (making the death unintended); it is a **teleological** move (making the death a rightful instrument of justice).
  *   **The Join:** The "join" your student noticed is the shift from *ontological/moral psychology* (what is intended?) to *political theology* (who has the authority to intend?).

  ### 2. Is "Referred to the Public Good" Continuous with DDE?
  It is best to read this as **discontinuous** with the DDE apparatus, which clarifies why the text feels like it contains two arguments.

  In the private case, the "good end" (saving one's life) justifies the act *only because* the bad effect (death) is excluded from the intention. The bad effect is tolerated, not chosen.

  In the public case, the "good end" (public good) justifies the act *even though* the bad effect (death) is included in the intention. The "reference" to the public good transforms the moral species of the killing from *murder* (private usurpation of authority) to *execution/just war* (public exercise of authority).

  If you try to read the public case through the DDE lens (i.e., "the soldier intends the public good, and the death is just a side effect"), you contradict Aquinas's text. He writes: *"who while **intending to kill a man** in self-defense, refer this to the public good."* The killing itself is intended. The DDE is not doing the work here; the doctrine of **legitimate authority** is.

  ### 3. The Role of Proportionality
  You asked whether the proportionality requirement ("if a man... uses more than necessary violence, it will be unlawful") constrains the public case as well.

  **Yes, but differently.**
  *   **For the Private Person:** Proportionality is the safeguard that keeps the death "beside the intention." If I use excessive force (e.g., shooting a unarmed thief), the excess suggests I *intended* harm rather than defense. Proportionality ensures the act remains defensive in species.
  *   **For the Public Authority:** Proportionality constrains the *exercise* of authority, not the *lethality* per se. A soldier may intend to kill an enemy combatant. However, if the soldier kills a surrendering enemy or uses torture, that is "more than necessary violence." It becomes unlawful not because death was intended, but because the violence exceeded the requirements of the public good/justice.

  So, proportionality is a universal constraint in the article, but it serves different moral functions: in the private case, it protects the **inviolability of life**; in the public case, it protects the **integrity of justice**.

  ### 4. Implications for the Trolley Seminar
  This exegesis offers a powerful pedagogical opportunity for your seminar. The standard narrative in trolley literature is that Aquinas provides a general-purpose principle: *"It is permissible to cause a bad effect as a side effect of a good end."* Your student's observation reveals that Aquinas's principle is actually much narrower and more structural.

  **Three critical points for your class:**

  1.  **The Authority Gap:** Modern trolley problems posit a *private bystander* making a decision that looks like a *public authority* decision (weighing lives, sacrificing one for many). Aquinas would likely argue that a private bystander lacks the authority to *intend* the death of the one to save the five, even as a means to a good end. The private agent is restricted to the DDE exception (death must be unintended). This suggests that in the standard "Switch" case, if the death of the one is intended (even as a means), Aquinas might forbid it for a private agent, whereas modern DDE interpretations often allow it if the death is "foreseen."
  2.  **Self-Preservation vs. Altruism:** Aquinas's DDE argument is rooted in the *natural inclination to self-preservation* ("one is bound to take more care of one's own life than of another's"). This is a specific permission for self-defense. It does not automatically generalize to *altruistic* sacrifice (killing one to save *others*). Extending Art. 7 to the trolley case requires stripping away the "self-preservation" premise and keeping only the "intention/foresight" mechanism. This is a significant philosophical modification of the source text.
  3.  **The "Two Arguments" Warning:** You can tell your students that the "Doctrine of Double Effect" is actually a hybrid label. In Aquinas, it is a **limitation on private violence** (you can't intend death) combined with a **license for public violence** (you can intend death for the common good). When Foot and Thomson apply DDE to trolleys, they are applying the *private limitation* to a *public-style dilemma*. This creates the tension students feel: Why does the bystander have the right to weigh lives at all? Aquinas would say they don't, unless the death is truly unintended.

  ### Summary for Your Lecture
  You can satisfy your student's insight by affirming that the article contains **two distinct justifications** joined by the distinction of **agent status**:
  1.  **Private Agent:** Justified by **Double Effect** (death unintended) + **Proportionality** (moderate force) + **Duty to Self**.
  2.  **Public Agent:** Justified by **Authority** (power to kill) + **Common Good** (death intended but referred to justice).

  The "join" is not a flaw in Aquinas's reasoning but a feature of his moral theology: killing is inherently a public/judicial act. Private killing is only permissible as an accidental byproduct of self-preservation.

  Using this text as the origin of the trolley DDE is heuristically useful but historically anachronistic. It works only if we abstract the "intention/foresight" mechanism from the "private/public" authority structure that gives it meaning in the *Summa*. Acknowledging this tension will enrich your seminar's discussion of whether the DDE is a universal moral principle or a specific rule regarding the limits of private violence.
