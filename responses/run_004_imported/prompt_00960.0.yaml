answer: |-
  **Setting:** *A university hallway, just after the weekly philosophy of science seminar. The whiteboards in the classroom behind them are still covered in diagrams of causal mechanisms. ALEX (Naturalist/Boorsean) is gathering their things into a messenger bag. JORDAN (Normativist) is leaning against the doorframe, holding a half-empty coffee cup.*

  **Jordan:** You looked satisfied with that defense of Boorse in the Q&A. But you sidestepped the pregnancy objection again.

  **Alex:** I didn't sidestep it. I just don't think it lands the way Kingma thinks it does. The intuition pump is strong, I'll give you that, but the mechanics of the Biostatistical Theory (BST) can handle it without smuggling in values.

  **Jordan:** Can they? Let's walk through the physiology. Pregnancy involves suppressed cell-mediated immunity, altered glucose metabolism, significant hormonal deviation. If I take a pregnant woman and compare her immune markers to the reference class of "adult human females," she looks statistically abnormal. She looks dysfunctional. The only way she *doesn't* look dysfunctional is if you define the reference class as "pregnant women."

  **Alex:** Right. And?

  **Jordan:** And that's the move. How do you justify carving out "pregnant women" as a distinct reference class without already assuming pregnancy is healthy? If you're a strict naturalist, you should just look at the species *Homo sapiens*, split by sex and age. Within that group, pregnancy is a temporary state of physiological deviation. If you say, "No, we need a sub-class," you're admitting that statistical normality isn't enough. You need a *normative* reason to treat pregnancy as a baseline rather than a deviation.

  **Alex:** That assumes reference classes are chosen arbitrarily, or purely on gross statistics. They aren't. Boorse is explicit: reference classes are determined by *uniform functional organization*. You group individuals who share the same internal design for processing inputs.

  **Jordan:** "Design" is doing a lot of heavy lifting there.

  **Alex:** It's not metaphorical design; it's evolutionary design. The female reproductive system has a specific functional architecture. Part of that architecture is a capacity for gestation. When that capacity is activated, the physiological baseline *shifts*. It's not that the immune system is failing; it's that the immune system is receiving different regulatory inputs to accommodate the fetus. A pregnant woman isn't a "woman with a broken immune system"; she's a woman in a distinct functional mode of the reproductive system.

  **Jordan:** But why does that distinct mode get its own reference class? Consider a fever. When you have an infection, your hypothalamic set-point shifts. Your body is actively regulating temperature higher. By your logic, that's a "distinct functional mode" of the thermoregulatory system designed to kill pathogens. So, should we create a reference class of "people with infection-induced fevers"? If we do, their temperature is statistically normal. Their metabolic rate is statistically normal. So, on BST, a high fever isn't a disease. It's health.

  **Alex:** That's a category error. A fever is a response to a *pathological* input. The virus or bacteria is the disease state. The fever is a defense mechanism. In pregnancy, the fetus isn't a pathogen. It's the intended output of the reproductive function.

  **Jordan:** "Intended" by whom? Evolution doesn't intend. Evolution selects. And evolution selects for immune defense just as much as it selects for reproduction. Here's the rub: The immunosuppression in pregnancy makes the mother *more* vulnerable to certain pathogens—Listeria, Influenza. If a pregnant woman dies of the flu because her immune response was dampened to protect the fetus, BST has to say her immune system was functioning *healthily*. It was doing exactly what the "pregnant reference class" does. But she's dead. Her ability to survive is reduced.

  **Alex:** Health isn't identical to survival in every instance. Health is the statistical efficiency of function to contribute to survival and reproduction. The immune mechanism in pregnancy is trading off immediate pathogen defense for reproductive success. That trade-off is built into the functional design. If the mechanism performs that trade-off statistically normally, it's healthy. The flu virus is an external threat. You can't blame the health status of the organism on the presence of an external predator or pathogen, only on the internal failure to resist it.

  **Jordan:** But the "failure to resist" is caused by the internal state of pregnancy! You're saying the internal state is healthy *because* it prioritizes reproduction over survival. That's a value judgment. You're privileging reproductive function over individual survival function. Why? Because we value reproduction? If we valued individual survival above all, we'd classify the immunosuppression of pregnancy as a dysfunction—a bug in the system that makes the host vulnerable.

  **Alex:** We don't privilege it normatively; we privilege it biologically. Without that immunosuppression, the fetus is rejected. Without the fetus, the species ends. The "function" of the reproductive system is defined by its causal role in the species' life cycle. You can't define the function of the uterus without referencing gestation. If you define the function of the uterus as "maintain maximum immune vigilance," you've misdescribed the biology.

  **Jordan:** Okay, let's grant you the biology. The uterus is for gestation. But Kingma's point is about the *boundary* of the reference class. You say we carve out "pregnant women" because they have a different functional organization. I say you only identify that organization as "different" rather than "damaged" because you already know pregnancy isn't a disease.

  Imagine a condition—let's call it *Condition X*—that causes the exact same hormonal and immune shifts as pregnancy, but without a fetus. Maybe a specific ovarian tumor.

  **Alex:** Then it's a disease. Because the function is disrupted. The reproductive system is producing hormones without the reproductive outcome.

  **Jordan:** But the physiological state is identical. The immune suppression is identical. The statistical deviation from "non-pregnant women" is identical. In the tumor case, you call it a dysfunction. In the pregnancy case, you call it a distinct reference class. What is the *naturalist* fact that distinguishes them? Is it the presence of the fetus?

  **Alex:** Yes. The presence of the fetus confirms the functional chain is complete.

  **Jordan:** That's circular. You're saying "It's healthy if it results in a baby." But "resulting in a baby" is only a marker of health if you assume having babies is the telos of the woman. If I'm a woman who doesn't want children, or if I'm in a context where reproduction threatens my life, that "functional completion" looks like a burden, a pathology of the system forcing a costly state. BST claims to be value-free, but it relies on the value that reproduction = good.

  **Alex:** It's not that reproduction is morally good. It's that "function" in biology is cashed out in terms of contribution to survival and reproduction. That's the definition of biological function, not a moral claim. If a heart pumps blood, it's healthy. If it doesn't, it's diseased. We don't ask if the person *wants* their blood pumped. Similarly, if the reproductive system gestates, it's functioning. If it creates a tumor, it's not. The value is in the definition of biological function, which is objective.

  **Jordan:** But biological function is polysemous. The immune system's function is to kill invaders. The reproductive system's function is to gestate. In pregnancy, these two functions conflict. BST needs a rule to decide which function takes precedence when they conflict. When you say the immune suppression is "healthy," you are ruling that Reproduction trumps Immunity. When you say a fever is "healthy," you are ruling that Immunity trumps Thermoregulation.

  Who decides the hierarchy? Nature doesn't give you a hierarchy; it just gives you the conflict. *We* impose the hierarchy based on what we think constitutes a "flourishing" human. We decide that a pregnant woman isn't sick, even if her immune stats look sickly, because we value pregnancy. If we viewed pregnancy as a parasitic infection—which some feminists have argued we might, biologically speaking—your BST would classify it as a disease instantly.

  **Alex:** That's absurd. You can't just redefine biological relations based on political critique. The fetus is genetically half-host. It's not a parasite in the ecological sense; it's an offspring. The relationship is symbiotic by evolutionary design.

  **Jordan:** "Evolutionary design" is a metaphor. The mechanism is blind. Look, here's the specific failure in your reference class move. You say we isolate "pregnant women" because they share a uniform functional organization. But statistically, they are a minority at any given time. Most adult women are not pregnant. If you follow the statistics strictly, the "normal" state is non-pregnant. To make pregnancy the norm for *that* class, you have to isolate them *before* you assess the stats.

  You're essentially saying: "Take all the women who are doing X. Check if X is statistically normal for women doing X. It is. Therefore X is healthy." That's tautological. You can cure any disease by creating a reference class of people with that disease.

  **Alex:** Not any disease. I can't create a reference class of "people with cancerous tumors" and say cancer is healthy. Why? Because cancer is a breakdown of cellular regulation. It doesn't have a functional organization. It's chaos. Pregnancy has a highly regulated, homeostatic control system. It's a stable state, not a breakdown. The distinction isn't normative; it's structural. We can detect the difference between the regulatory feedback loops of pregnancy and the unregulated growth of a tumor without asking anyone's values.

  **Jordan:** I agree we can detect the structural difference. But does structural stability equal health? A psychopath might have very stable neurological patterns. A addict has a stable, regulated dependency state. The reason we call pregnancy "health" and addiction "disease" isn't just about internal statistical normality or regulatory loops. It's about whether the state contributes to the *welfare* of the individual.

  BST tries to cut the link between health and welfare. That's Boorse's whole selling point. But pregnancy exposes the cut. If health is just statistical function, and pregnancy reduces survival odds (which it does, historically), then BST should call it a risk factor, a dysfunction. The only reason it doesn't is because you've rigged the "function" to be "reproduction" rather than "individual survival." And that choice—prioritizing the genes over the host—is a theoretical value, not a brute fact.

  **Alex:** It's not prioritizing genes over the host. It's recognizing that the host *is* a link in the generational chain. Look, if you push this too hard, you dissolve the concept of disease entirely. If every classification depends on a welfare judgment, then a society that values conformity could classify homosexuality as a disease, or a society that values productivity could classify sleep as a disease. I need BST to block that. I need to be able to say, "No, your values are wrong, this is biologically normal."

  **Jordan:** And I'm saying BST *can't* block that without secretly importing those values. You think you're blocking it by saying "Reference Class: Human Males." But then you have to explain why "Homosexual Males" isn't a valid sub-class with its own statistical norms. You'll say "Because reproduction is the function." And I'll say "There's the value."

  **Alex:** I'll say "Because the physiological mechanisms of sexual arousal and pairing are statistically typical in the species regardless of object choice." I can defend that empirically.

  **Jordan:** Maybe. But with pregnancy, the physiology *changes*. The set-points move. You can't say the set-points are the same. You have to say the *new* set-points are valid. And you validate them because...?

  **Alex:** Because they are universally present in the species' history as a condition of continuation. It's not a value judgment to note that a species that doesn't reproduce goes extinct. The "health" of the reproductive system is tied to that continuation.

  **Jordan:** But the "health" of the *woman*? That's the gap. You're conflating the health of the system with the health of the organism. Pregnancy can be healthy for the genes and costly for the organism. BST claims to define health for the *individual*. If the individual's immune capacity is lowered, the individual is less healthy, even if the reproductive system is "working." You're hiding the cost to the individual behind the success of the system.

  **Alex:** I'm not hiding it. I'm saying the individual *is* the system. The immune system and reproductive system are subsystems. They have to be integrated. In pregnancy, the integration requires immune modulation. That modulation is the healthy state for that integrated system. If you treat the modulation as a disease, you treat the pregnancy as a disease. And that's not just normatively wrong; it's biologically incoherent. You can't have a theory of human health that classifies the continuation of the species as a pathology.

  **Jordan:** See, there it is. "You can't have a theory..." That's the normative constraint. You're saying the theory *must* yield the result that pregnancy is healthy. And to ensure it yields that result, you tweak the reference class. That proves Kingma's point. The intuition that pregnancy isn't a disease drives the construction of the theory, not the other way around.

  **Alex:** Or, it proves that our intuition that pregnancy isn't a disease is tracking a biological reality that your normativism is too skeptical to see. Maybe the reference class adjustment isn't a tweak; maybe it's a correction to a naive statistical view. Naive stats say "compare to everyone." Good science says "compare to relevantly similar systems." Recognizing pregnancy as a relevantly similar system isn't a value judgment; it's good taxonomy.

  **Jordan:** Taxonomy is never value-free. We categorize things based on what differences we think *matter*. We think the difference between "pregnant" and "sick" matters. So we build the taxonomy to reflect that. Boorse wants to say the taxonomy comes first, and the health judgment follows. I'm saying the health judgment comes first, and the taxonomy follows.

  **Alex:** Then you have no way to criticize a health judgment. If a culture decides pregnancy *is* a sickness, you have to agree, because health is just their values.

  **Jordan:** No. I can say their values are harmful. I don't need to pretend I'm doing pure statistics to say that. I'd rather admit the values are there and argue about them than hide them inside a definition of "reference class."

  **Alex:** *(Zipping up the bag)* And I'd rather have a definition that lets me tell them they're biologically wrong, not just morally disagreeable.

  **Jordan:** *(Pushing off the doorframe)* Well, until you can explain why "functional organization" isn't just a code word for "states we like," you're not doing biology. You're doing ethics with a calculator.

  **Alex:** And until you can explain how to practice medicine without a concept of objective dysfunction, you're just doing politics with a stethoscope.

  **Jordan:** Coffee next week?

  **Alex:** Sure. But I'm reading the Kingma paper again before I go.

  **Jordan:** Do. I'll bring the Boorse. See if we can find a page where they actually agree.

  *[They walk off in opposite directions down the hall.]*
