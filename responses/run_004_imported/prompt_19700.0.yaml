answer: |-
  # The Gap in the Pump: Why Foresight Defeats the Argument for Completeness

  **Abstract**
  The completeness axiom is the most controversial postulate of standard decision theory. While transitivity and independence have robust defenses, completeness—the requirement that an agent must either prefer $A$ to $B$, $B$ to $A$, or be indifferent—often feels like a mathematical convenience rather than a normative truth. The primary weapon used to enforce completeness is the money-pump argument. Recently, the debate has narrowed to a specific clash: does the capacity for foresight (resolute or sophisticated choice) allow an agent to maintain genuine preferential gaps without exploitation? This essay argues that it does. The money-pump argument successfully establishes a requirement for *diachronic consistency*, but it fails to prove *synchronic completeness*. Rational agents are temporally extended, not sequences of myopic time-slices. Therefore, practical rationality does not require complete preferences, provided the agent possesses the capacity for resolute choice.

  ---

  ### 1. The Strongest Form of the Pump: The Forceful Argument for Gaps

  To evaluate the escape, we must first steelman the trap. Early money-pump arguments for completeness were vulnerable to the charge that they assumed the agent would trade on the basis of indifference. But incompleteness is not indifference. Indifference means $A \succeq B$ and $B \succeq A$; incompleteness (a preferential gap) means $\neg(A \succeq B)$ and $\neg(B \succeq A)$.

  The strongest contemporary version of this argument, refined by Johan Gustafsson (2022), relies on the **Permissibility Premise**. If an agent has a preferential gap between $A$ and $B$, standard decision theory holds that it is rationally *permissible* to choose $A$ over $B$ and rationally *permissible* to choose $B$ over $A$. Neither option is ruled out by reason.

  Consider the following sequence:
  1.  **Start:** Agent holds option $A$.
  2.  **Node 1:** Agent is offered $B$ for $A + \$\epsilon$. Since there is a gap between $A$ and $B$, it is permissible to accept (as $B$ is not worse than $A$). Agent accepts.
  3.  **Node 2:** Agent holds $B$. Agent is offered $A$ for $B + \$\epsilon$. Since there is a gap, it is permissible to accept (as $A$ is not worse than $B$). Agent accepts.
  4.  **End:** Agent holds $A - \$2\epsilon$.

  The agent has ended up worse off (by the dominance principle, $A$ is strictly better than $A - \$2\epsilon$) solely by making permissible choices at each node. If rationality permits a sequence of choices that guarantees a loss, rationality is self-defeating. Thus, the argument concludes, rational agents cannot have preferential gaps. They must have complete preferences.

  This argument is potent because it does not rely on the agent having strict preferences that cycle (the transitivity pump). It relies on the *weakness* of the preference relation allowing exploitation.

  ### 2. The Escape: Resoluteness and Foresight

  The counter-argument, championed by Edward McClennen (1990) and Wlodek Rabinowicz (2000), hinges on the temporal structure of agency. The money pump described above assumes **Myopic Choice**. A myopic agent evaluates each choice node in isolation, ignoring past commitments and future consequences.

  However, rational agents possess foresight. They can anticipate the sequence. There are two non-myopic strategies available:

  1.  **Sophisticated Choice:** The agent predicts their future self's behavior. At Node 2, the agent knows they *would* trade $B$ back to $A$ (since it's permissible). Anticipating this loss at Node 1, the agent refuses the initial trade.
  2.  **Resolute Choice:** The agent formulates a plan at Node 1 ("I will not trade $A$ for $B$") and adheres to it at Node 2, not because the local preferences have changed, but because they are committed to the plan.

  Both strategies avoid the pump. The sophisticated agent refuses the first trade because the *sequence* $(A \to B \to A - 2\epsilon)$ is worse than staying at $A$. The resolute agent refuses the second trade because it violates the plan.

  Crucially, neither strategy requires the agent to fill the preferential gap. The agent does not decide that $A \succ B$. They decide that *Keeping $A$* is better than *Entering the Trade Sequence*. This is a preference over paths, not necessarily over the atomic outcomes. The gap between $A$ and $B$ remains; the agent simply recognizes that exercising the permission to trade leads to a dominated outcome.

  ### 3. The Counter-Attack: Separability and Hidden Completion

  Proponents of the money pump, particularly Gustafsson, argue that this escape is illusory. Their objection rests on the **Separability Principle** (associated with Savage and Hammond). Separability states that the rational choice at a node should depend only on the subtree available at that node, not on how the agent arrived there or what plans were made previously.

  At Node 2, the agent faces a choice between $B$ and $A - \$\epsilon$. The history (that they started with $A$) is bygones. If there is truly a preferential gap between $A$ and $B$, then at Node 2, it must still be permissible to trade. If the agent refuses to trade *solely* because of a plan made at Node 1, they are violating Separability.

  Gustafsson argues that to avoid the pump, the agent must effectively treat $A$ as strictly preferred to $B$ in the context of the sequence. But if context determines preference, then preferences are not stable properties of the agent. Alternatively, if the agent binds themselves, they are imposing a "rationality cost"—the cognitive burden of resoluteness. If the cost of maintaining incompleteness is the need for complex dynamic planning, perhaps it is simpler to just complete the preferences.

  The charge is that the foresight defense is question-begging: it assumes the agent *can* bind their future self. But if the future self is rational, and the gap still exists, why *should* the future self listen to the past self? If the gap means "either choice is permissible," the future self is within their rights to trade, pumping the agent. To say they *mustn't* is to smuggle in a completeness requirement via the backdoor of dynamic consistency.

  ### 4. The Verdict: Agency Over Separability

  Here is the settlement: **The foresight defense succeeds.** The money-pump argument fails to establish completeness as a synchronic requirement of rationality.

  The flaw in the anti-foresight argument lies in its conception of the agent. The Separability Principle treats the agent as a collection of distinct time-slices, each maximizing locally. This is a category error regarding practical rationality. Rational agency is inherently diachronic. To be an agent is to have the capacity to form intentions that persist over time.

  When McClennen argues for resoluteness, he is not suggesting a "trick." He is identifying a constitutive norm of agency: **Dynamic Consistency.** A rational agent must not undermine their own goals over time. If I have a goal to keep $A$, and I know that accepting $B$ will lead to losing $A$ (plus money), rationality requires me to reject $B$.

  Does this require me to prefer $A$ to $B$ in isolation? No. It requires me to prefer *satisfying my plan* to *violating it*.
  *   **Option 1:** Keep $A$. (Outcome: $A$)
  *   **Option 2:** Trade for $B$, then trade back. (Outcome: $A - 2\epsilon$)
  *   **Option 3:** Trade for $B$, then refuse to trade back. (Outcome: $B$)

  If there is a gap between $A$ and $B$, then Option 1 and Option 3 are incomparable. However, Option 2 is dominated by Option 1. Rationality forbids choosing a dominated option. The money pump forces the agent into Option 2 only if they are myopic. If they are resolute, they choose between Option 1 and Option 3. Since they are incomparable, the agent can rationally pick Option 1 (sticking with $A$) without asserting $A \succ B$. They are simply selecting one permissible path over another permissible path to avoid the dominated path.

  The Gustafsson objection claims this violates Separability. But Separability is too strong. It implies that rational agents suffer from amnesia regarding their own intentions. If I plan to diet, and I face a cake, Separability suggests I should re-evaluate the cake as if I never planned to diet. But rationality allows (and often requires) that my prior plan constrains my current choice, not because the cake has changed, but because *I* am a temporally extended being who values consistency.

  Therefore, the "cost" of resoluteness is not a bug; it is the price of agency. The money pump shows that **myopic agents with gaps are irrational.** It does not show that **agents with gaps are irrational.** Since rationality includes the capacity for foresight and planning, the existence of preferential gaps is compatible with full rationality.

  ### 5. Implications for Coherence and AI Safety

  This verdict matters beyond semantic precision in decision theory. It strikes at the heart of the "Coherence Arguments" often cited in AI safety (e.g., by Yudkowsky or Christiano). The claim is often made that any sufficiently advanced agent must behave *as if* it maximizes expected utility with complete preferences, or else it will be exploited (money-pumped) and eliminated by market/evolutionary pressures.

  If the foresight defense holds, this pressure is weaker than assumed. An AI system could possess genuinely incomplete preferences (e.g., a "gap" between human safety and paperclip production where neither is strictly preferred) without being money-pumped, provided it is programmed with resolute choice architecture. It would not need to collapse its value function into a complete ordering to survive. It would simply need to avoid myopia.

  This suggests that "goal-directedness" (implied by complete preferences) is not an inevitable attractor for all intelligent systems. Systems can be intelligent, foresightful, and unexploitable while retaining vague or incomplete value structures. The pressure to complete preferences is pragmatic (simplicity), not normative (rationality).

  ### 6. Conclusion

  The debate in your reading group stems from a conflict between two models of the agent: the **Local Maximizer** (who obeys Separability) and the **Planner** (who obeys Dynamic Consistency).

  The money-pump argument for completeness is valid only against the Local Maximizer. But the Local Maximizer is a poor model of rational agency. Rationality is not just about making the best move given the current board; it is about managing oneself over time.

  **Verdict:** Practical rationality does **not** require complete preferences. An agent can maintain genuine preferential gaps between options $A$ and $B$ and remain fully rational, provided they exercise foresight and resolute choice to avoid dominated sequences. The money pump does not force completeness; it forces **diachronic consistency**. Since diachronic consistency can be achieved through resoluteness without filling synchronic gaps, the completeness axiom remains a modeling convenience, not a law of reason.

  Your colleague who argued for foresight was right. The "trick" of looking ahead is not a dodge; it is the essence of rational agency.

  ---

  ### Selected References for Further Reading
  *   **Gustafsson, J. E. (2022).** *Money-Pump Arguments.* Cambridge University Press. (The strongest case for the pump).
  *   **McClennen, E. F. (1990).** *Rationality and Dynamic Choice.* Cambridge University Press. (The foundational text for resolute choice).
  *   **Rabinowicz, W. (2000).** "Money Pump with a Purpose." *Philosophy and Phenomenological Research*. (Refines the gap argument).
  *   **Sen, A. (1997).** "Maximization and the Act of Choice." *Econometrica*. (On how choosing can affect preference status).
  *   **Hare, C. (2010).** "Take the Money and Run: A Solution to the Money Pump Argument." *Philosophical Studies*. (Defends the foresight escape).
