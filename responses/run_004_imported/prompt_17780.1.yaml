prompt: |-
  I teach a graduate seminar, cross-listed with the psychology department, on the philosophical foundations of statistical inference, and much of our discussion this term has turned on how much of the replication crisis is really a symptom of frequentist methodology specifically, as opposed to something that would survive a wholesale switch to Bayesian methods. A psychology postdoc auditing the course offered his own recent practice as evidence for the Bayesian side of that debate: he had specified a prior for his key parameter before running an experiment, found that the resulting posterior left his hypothesis looking distinctly unpromising, decided on reflection that his original prior had actually been too uninformative given a closely related result in the literature, revised it accordingly, and reran the analysis, arriving at a posterior that supported his hypothesis comfortably. That is the version now heading toward publication. He maintains that since his revised prior is, if anything, more defensible than his original one, nothing methodologically suspect is going on here, in contrast to the sort of data-contingent flexibility that produces false positives under null hypothesis significance testing.

  I could not say exactly why this bothered me at the time, beyond a sense that he had relocated a familiar problem rather than escaped it. Is he right that moving to Bayesian inference insulates a researcher from the kind of analytic flexibility that produced so many false positives in the first place, or is there something wrong with what he did, even though each step in his reasoning about the prior sounds reasonable taken on its own?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Scenario:**
      *   **Context:** Graduate seminar on philosophical foundations of statistical inference (cross-listed with psychology).
      *   **Topic:** Replication crisis, Frequentist vs. Bayesian methods.
      *   **The Incident:** A psychology postdoc (auditor) shared a personal anecdote.
      *   **The Action:**
          1.  Specified a prior *before* running the experiment.
          2.  Ran the experiment.
          3.  Posterior looked bad (hypothesis unpromising).
          4.  Revised the prior *after seeing the data* (claiming it was "too uninformative" based on literature).
          5.  Reran analysis.
          6.  New posterior supported the hypothesis.
          7.  Publishing the second version.
      *   **The Postdoc's Claim:** This is methodologically sound because the revised prior is more defensible. It's not like $p$-hacking.
      *   **The Instructor's (User's) Intuition:** Something is wrong. It feels like relocating the problem, not solving it.
      *   **The Question:** Is the postdoc right that Bayesian methods insulate against analytic flexibility, or is there something wrong with his specific procedure?

  2.  **Initial Assessment & Philosophical/Stistical Evaluation:**
      *   *Core Issue:* This is a classic case of "double-dipping" or using the data twice, even within a Bayesian framework.
      *   *The Postdoc's Logic:* Priors represent beliefs. If I realize my belief was wrong (too vague) based on external literature, I should correct it.
      *   *The Flaw:* The realization happened *after* seeing the data. The motivation to check the literature was triggered by the unfavorable posterior. This introduces selection bias.
      *   *Bayesian Coherence vs. Frequentist Properties:* Bayesians often argue about coherence (internal consistency of beliefs). However, for scientific inference (especially in psychology where replication matters), frequentist properties (calibration, error rates) matter. If you tune priors to get desired posteriors, you break calibration.
      *   *The "Garden of Forking Paths":* This is essentially prior-hacking. Just like you can try different covariates or exclusion criteria in NHST to get $p < .05$, you can try different priors to get $BF > 3$ or a credible interval excluding 0.

  3.  **Key Concepts to Address:**
      *   **Data-Dependent Priors:** Using data to construct the prior violates the likelihood principle in spirit, even if the math holds. It turns the prior into a likelihood component.
      *   **Calibration/Coverage:** If everyone did this, what happens to the long-run reliability of Bayesian claims?
      *   **Subjectivity vs. Objectivity:** The postdoc claims the prior is "more defensible." Defensible to whom? If the defensibility is discovered *because* the first prior failed, it's suspect.
      *   **Transparency:** The biggest issue might not be the act itself, but the reporting. Did he report the first analysis?
      *   **Hierarchical Modeling/Robustness:** Better ways to handle prior uncertainty (sensitivity analysis) rather than picking the "winning" prior.

  4.  **Drafting the Response (Iterative Process):**

      *   *Validation:* Acknowledge the instructor's intuition. It is correct. This *is* a problem.
      *   *The Core Problem:* It's "Prior-Hacking" (or $p$-hacking by another name). The data influenced the prior choice.
      *   *Why the Postdoc is Wrong (but understandably so):* He conflates "updating beliefs" (Bayesian learning) with "fitting the model to the data" (overfitting). In a single study, the prior should be fixed *before* seeing the data of *that* study.
      *   *The "Defensible" Argument:* It's post-hoc rationalization. If the first posterior was favorable, would he have checked the literature to make the prior *more* informative in a way that hurts the hypothesis? Unlikely. This asymmetry reveals the bias.
      *   *Consequences:* Inflated Type I error rates (even in Bayesian terms, e.g., misleading Bayes Factors). Loss of calibration.
      *   *The Solution:* Sensitivity Analysis. Show both priors. Or use weakly informative priors consistently. Or pre-register the prior.
      *   *Philosophical Angle:* Connect back to the seminar theme. The replication crisis isn't just about $p$-values; it's about researcher degrees of freedom. Bayesianism doesn't magically remove human bias.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Nuance:* Is it *ever* okay to update a prior? Yes, in a sequential analysis or meta-analysis, but you must account for the peeking. In a single published study, the prior represents pre-data information.
      *   *Nuance:* Some Bayesians argue that all inference is conditional on the model. If the model changes (prior changes), it's a different inference. But if you select the model *based on the result*, you are optimizing for significance.
      *   *Terminology:* Use terms like "researcher degrees of freedom," "double-counting data," "sensitivity analysis," "calibration."

  6.  **Structuring the Response:**
      *   **Direct Answer:** Validate the instructor's unease. The postdoc is mistaken.
      *   **Diagnosis:** Identify the specific fallacy (using data to inform the prior).
      *   **Why it matters:** Explain the consequences (bias, lack of calibration, misleading evidence).
      *   **The "Defensibility" Trap:** Explain why the post-hoc justification is suspect (asymmetry of motivation).
      *   **Better Practices:** What *should* he have done? (Sensitivity analysis, pre-registration, transparency).
      *   **Seminar Connection:** Tie it back to the broader question of the replication crisis and methodology.

  7.  **Final Polish:** Ensure tone is academic, respectful, but firm on the statistical principles. (The user is a professor, so speak peer-to-peer).

      *(Self-Correction during drafting)*: I should make sure not to sound like a frequentist zealot attacking Bayes. The point is that *any* method is vulnerable to gaming if researcher degrees of freedom aren't constrained. The postdoc's claim that Bayesianism *insulates* against this is the specific myth to bust.

  8.  **Final Review against the Prompt:**
      *   Did I answer if he's right? (No).
      *   Did I explain what's wrong? (Yes, data-dependent priors).
      *   Did I address the "defensible prior" claim? (Yes, post-hoc rationalization).
      *   Did I connect to the replication crisis context? (Yes, researcher degrees of freedom).

  9.  (Proceed to generate output based on these thoughts.)
answer: |-
  Your intuition is correct: the postdoc has not escaped the logic of the replication crisis; he has merely translated it into a Bayesian idiom. What he describes is often called **"prior hacking"** or **"Bayesian $p$-hacking,"** and it violates the fundamental temporal logic required for valid inference in both frameworks.

  While his individual steps sound reasonable in isolation, the *sequence* and *motivation* of those steps introduce a selection bias that undermines the evidential value of his final posterior. Here is a breakdown of why his reasoning is flawed, which you can use to guide the seminar discussion.

  ### 1. The Data Cannot Inform the Prior (in a single study)
  The core philosophical tenet of Bayesian inference in a scientific context is that the prior represents information available *before* the current data are observed. The posterior represents the update of that pre-existing state of knowledge in light of the new evidence.

  By looking at the posterior, finding it unfavorable, and *then* searching for justification to tighten or shift the prior, the postdoc is effectively using the data twice.
  *   **First use:** To diagnose that the original prior was "wrong" (i.e., didn't yield the desired conclusion).
  *   **Second use:** To update the "corrected" prior into a favorable posterior.

  This creates a feedback loop where the data influences the model specification. In frequentist terms, this is analogous to running a regression, seeing the coefficients are insignificant, adding a control variable that happens to correlate with the error term, and reporting the new result. The fact that the control variable (or the new prior) can be theoretically justified *post hoc* does not remove the bias introduced by selecting it based on the outcome.

  ### 2. The Asymmetry of Motivation
  The postdoc claims the revised prior is "more defensible." The critical question for your seminar is: **Would he have made this revision if the first posterior had supported his hypothesis?**

  If the answer is no, then the "defensibility" is a rationalization, not a genuine epistemic correction. This is the essence of researcher degrees of freedom.
  *   If the first analysis had worked, the "uninformative" prior would likely have remained "appropriately conservative."
  *   Because it failed, the "uninformative" prior became "unjustifiably vague."

  This asymmetry reveals that the criterion for prior specification was not purely "fit with literature," but "fit with literature *sufficient to produce a publishable posterior*." This inflates the false positive rate (or, in Bayesian terms, the rate at which Bayes Factors misleadingly favor the alternative) just as surely as optional stopping does in NHST.

  ### 3. Calibration and Long-Run Reliability
  A common defense from Bayesians is that inference is about coherence of belief, not long-run error rates. However, in the context of the replication crisis, we care about **calibration**. If a community of researchers adopts the postdoc's practice—tuning priors until the posterior looks "promising"—the resulting published posteriors will be systematically overconfident.

  Simulation studies have shown that if researchers select priors based on the data they produce, Bayesian credible intervals lose their coverage properties, and Bayes Factors become biased toward the alternative hypothesis. The "insulation" the postdoc claims Bayesian methods provide is an illusion; it only holds if the prior is fixed independently of the data being analyzed.

  ### 4. What Should He Have Done?
  There are methodologically sound ways to handle his situation, none of which involve swapping the prior silently:

  *   **Sensitivity Analysis:** He should report *both* analyses. Show the posterior under the original, pre-registered (or initially intended) prior, and show the posterior under the revised, literature-informed prior. If the conclusion depends entirely on the choice of prior, the data are not strong enough to support the hypothesis robustly. That is a scientific finding in itself.
  *   **Hierarchical Modeling:** If there is uncertainty about the prior parameters, they can sometimes be estimated from the data in a hierarchical structure, but this must be done explicitly as part of the model, not as a manual override after checking results.
  *   **Pre-registration:** The ultimate check against this flexibility is specifying the prior distribution (or the rules for deriving it from previous literature) before data collection begins.

  ### 5. Seminar Discussion Point: The "Garden of Forking Paths"
  This anecdote is a perfect case study for Gelman and Loken's "Garden of Forking Paths." The replication crisis is not solely a product of $p < .05$; it is a product of **flexibility in the analysis pipeline.**

  *   **Frequentist flexibility:** Excluding outliers, choosing covariates, stopping rules, transforming variables.
  *   **Bayesian flexibility:** Choosing the prior family, setting hyperparameters, deciding on the region of practical equivalence (ROPE), selecting the model structure.

  Moving to Bayesian methods changes the *location* of the degrees of freedom, but it does not eliminate them. If researchers treat the prior as a tuning parameter to achieve significance (or "substantive support"), Bayesian inference becomes just another engine for producing publishable but non-replicable results.

  ### Summary for the Class
  The postdoc is wrong. He has engaged in a form of data-dredging. The "defensibility" of a prior is not an intrinsic property of the distribution; it is a property of the relationship between the distribution and the information available *at the time of specification*. By allowing the data to dictate when a prior becomes "defensible," he has compromised the independence of the evidence.

  Your unease stems from recognizing that **transparency and constraint** are the antidotes to the replication crisis, not the specific calculus of probability used. A method that allows you to change your assumptions after seeing the results, without penalizing yourself for that flexibility, is vulnerable to the same biases that plagued NHST.
