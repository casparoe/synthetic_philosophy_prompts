      *   Avoid being too dry/academic, but respect the philosophical depth.
      *   Make sure to answer the specific question: "Real evidence or illusion?" (Answer: Mostly illusion of *justification*, though some signal of *consistency*).

  8.  **Self-Correction/Edge Case Check:**
      *   *Did I dismiss it too harshly?* Internal consistency *is* valuable. A gauge that says "Full" then "Empty" then "Full" is broken. So bootstrapping detects *inconsistency*, just not *accuracy*. I need to make that distinction clear.
