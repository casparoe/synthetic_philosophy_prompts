      *   **Move 3 (Critic):** That creates the wrong logical relations. "Wrong" and "Not Wrong" are contradictories. "Disapproval" and "Disapproval of Disapproval" are contraries (you can have neither). Also, the *inconsistency* problem. If I say "It's wrong" and "It's not wrong," I contradict myself. If I say "I disapprove" and "I disapprove of disapproving," am I logically inconsistent or just psychologically conflicted?
      *   **Move 4 (Expressivist):** Shift to Gibbard's norm-expressivism. It's not about psychological states but *plans*. To judge wrong is to plan to blame. To judge not wrong is to plan *not* to blame. The logic is the logic of planning.
      *   **Move 5 (Critic):** The "Negation" of a plan. If planning to X is the content, what is planning to not-X? Is that the same as not planning to X? (Schroeder's distinction). If "Not Wrong" = "Plan not to blame," does that capture the full semantic range? Also, the *logical* inconsistency of holding inconsistent plans needs to be explained without appealing to truth.
      *   **Move 6 (Expressivist):** The inconsistency is *practical*. You can't simultaneously plan to blame and plan not to blame for the same act under the same description. It's a rational requirement, not a metaphysical one.
