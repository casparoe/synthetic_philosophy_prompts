answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Alex (Expressivist) and Jordan (Critic) are surrounded by stacks of papers—Blackburn's *Spreading the Word*, Gibbard's *Wise Choices, Apt Feelings*, and Schroeder's *Being For*.*

  **Jordan:** We keep circling back to the conditional. "If cruelty is wrong, then..." It's the classic Frege-Geach battleground. But you know as well as I do that the real deadlock is negation. Unwin made this clear twenty years ago, and Schroeder tightened the screws. If you tell me that "Cruelty is wrong" expresses a attitude of disapproval toward cruelty, you owe me an account of "Cruelty is *not* wrong."

  **Alex:** And I've told you before: it's not merely the absence of disapproval. That's the straw man. If I lack disapproval toward cruelty, I might be indifferent, or I might never have considered cruelty. But to assert "Cruelty is not wrong" is to take a stand. It's to express tolerance.

  **Jordan:** "Tolerance." That's the move. But let's look at the logical geography. Unwin's point was precisely that there are three mental states here, not two. There is (1) Disapproval, (2) Tolerance, and (3) Ignorance or Indifference. In a binary logic, "Not Wrong" is simply the negation of "Wrong." It covers both Tolerance *and* Indifference. If you fix the meaning of "Not Wrong" as specifically Tolerance, you've changed the logic. You've turned a contradiction into a contrary.

  **Alex:** But normative logic *isn't* standard binary logic in its psychological underpinnings. When we do ethics, we aren't mapping truth conditions; we're coordinating attitudes. When I say "Cruelty is not wrong," I am expressing an attitude of *acceptance* toward cruelty, or perhaps a refusal to blame. Gibbard handles this with planning states. To judge wrong is to plan to blame. To judge not wrong is to plan *not* to blame.

  **Jordan:** There it is. "Planning not to blame." Now we have to ask: is "Planning not to blame" the negation of "Planning to blame"? Or is it a distinct positive plan? If it's a distinct positive plan, then what happens to the agent who has *no* plan regarding blame? They aren't contradicting themselves if they assert both, they're just confused. But logical contradiction isn't about psychological confusion. It's about the impossibility of truth. Or, in your terms, the impossibility of a certain state.

  **Alex:** The impossibility of a rational state. Schroeder's worry is about inconsistency. He asks: why is it inconsistent to believe *p* and believe *not-p*? The realist says: because *p* and *not-p* can't both be true. I say: because you cannot simultaneously plan to blame and plan not to blame for the same act under the same description. That is a clash of practical rationality. It's just as robust as a theoretical clash.

  **Jordan:** Is it? This is the "B-type" inconsistency problem. If I disapprove of lying, and I disapprove of *not* disapproving of lying, I am psychologically conflicted. But I am not logically inconsistent in the same way I am if I say "Lying is wrong and lying is not wrong." The latter feels like a violation of the law of non-contradiction. The former feels like a violation of a norm of coherence. If you reduce the logical contradiction to a coherence norm, you lose the *logical* force. You explain why I shouldn't hold both attitudes, but not why the *sentences* contradict.

  **Alex:** But that's the quasi-realist triumph! We earn the right to talk of truth and contradiction. If the attitudes are structured such that holding them together undermines the very practice of deliberation, then we *call* that contradiction. We aren't hiding a propositional content behind the attitude. We are showing how the logic of attitudes mimics the logic of propositions so perfectly that the distinction dissolves for all practical purposes.

  **Jordan:** "Mimics." That's the tell. If it mimics it, it isn't it. Schroeder's point is that you need to explain the *validity* of arguments involving negation. Take modus tollens. "If cruelty is wrong, then hurting cats is wrong. Hurting cats is not wrong. Therefore, cruelty is not wrong." For this to be valid, the "not wrong" in the premise and the conclusion must have the *same* content. If your expressivist analysis makes the "not wrong" in the premise a different attitude than the "not wrong" in the conclusion—say, one is a lack of planning and the other is a plan to not blame—then the argument is equivocal. It's a fallacy of four terms.

  **Alex:** I don't grant that the attitude shifts. The attitude is constant. It's a higher-order attitude. Think of Blackburn's ramified expressivism. "Cruelty is wrong" expresses a first-order disapproval. "Cruelty is not wrong" expresses a higher-order disapproval of the disapproval of cruelty.

  **Jordan:** That collapses immediately. If "Wrong" is Disapproval (D) and "Not Wrong" is Disapproval of Disapproval (DD), then "Wrong and Not Wrong" becomes "D and DD." Is that a contradiction? No. I can disapprove of lying, and I can also disapprove of my own disapproval of lying—perhaps I think my disapproval is culturally conditioned or excessive. I can hold both attitudes simultaneously. I might feel the pull of the norm while criticizing it. But I cannot assert "Lying is wrong and lying is not wrong" without nonsense. Your analysis allows the psychological state that the sentence forbids.

  **Alex:** So we refine the attitude. It's not just any disapproval. It's a commitment. When I say "Not Wrong," I am committing myself to *not* having the disapproval.

  **Jordan:** Now you're smuggling in a truth-conditional structure under the guise of commitment. To commit to *not* having an attitude is to represent the world as being such that the attitude is inappropriate. You're backing into realism. Look, the core of the Unwin/Schroeder challenge is this: Negation is a unified operator. It does the same work in "Snow is white" and "Snow is not white" as it does in "Cruelty is wrong" and "Cruelty is not wrong." If your analysis of the normative negation requires a *different kind of mechanism* than the descriptive negation—planning vs. representing, or higher-order attitudes vs. simple absence—then you haven't explained logic. You've just built a parallel system that looks like logic from a distance.

  **Alex:** Why does it need to be the *same* mechanism? Why can't logic be topic-neutral but realized differently in different domains? In the descriptive domain, negation flips truth values. In the normative domain, negation flips practical commitments. The *structure* is isomorphic. That's all logic requires. Isomorphism, not identity of metaphysical substrate.

  **Jordan:** Because validity depends on the preservation of *content* across domains. If I argue, "If snow is white, then cruelty is wrong. Snow is white. Therefore, cruelty is wrong," I'm mixing domains. If your negation works differently in the antecedent than in the consequent, the mixed inference fails. But more importantly, consider the "Negation Problem" specifically. If "Not Wrong" is "Planning not to blame," what is "It is not the case that cruelty is wrong"? Is that different from "Cruelty is not wrong"? In standard logic, predicate negation and sentential negation align. In your system, "Planning not to blame" (predicate) seems distinct from "Not planning to blame" (sentential).

  **Alex:** Gibbard addresses this. The plan *is* the content. There is no gap between the plan and the judgment. To judge is to plan. So "Not (Planning to blame)" just *is* "Planning not to blame" in the normative context. The distinction you're pressing relies on a gap between the mental state and the content that expressivism denies.

  **Jordan:** But that denial is exactly what the Negation Problem exploits! If there is no gap, then you can't explain error. If I plan to blame, and you plan not to blame, we disagree. But do we contradict? If I say "Cruelty is wrong" and you say "Cruelty is not wrong," we aren't just clashing wills. We are saying one of us is *mistaken*. If expressivism reduces this to incompatible plans, you explain the clash, but you don't explain the *mistake*. Schroeder argues that without a propositional content that can be true or false, you can't make sense of the negation as ruling out a possibility. You're just ruling out a psychological combination.

  **Alex:** Ruling out a psychological combination *is* ruling out a possibility in the normative space. You keep assuming "possibility" must mean "metaphysical possibility." I'm talking about "practical possibility." I cannot coherently act on both plans. That is the impossibility that grounds the negation.

  **Jordan:** But does that impossibility transfer to the *sentences*? If I write "Cruelty is wrong and cruelty is not wrong" on a blackboard, the contradiction is in the ink, not in my head. The sentence is malformed regardless of whether I have the capacity to plan. Your explanation makes the contradiction contingent on human psychology. If we were beings who could simultaneously plan to blame and plan not to blame without rational friction, would "Cruelty is wrong and not wrong" become a tautology?

  **Alex:** No, because the definition of "planning" involves the friction. You can't define a plan without the constraint of consistency. It's analytic.

  **Jordan:** Then the constraint is doing the work, not the expressivism. You've posited a "logic of attitudes" that has the exact same constraints as a "logic of propositions." At that point, Occam's Razor suggests we just admit the propositions. If your attitudes must behave *exactly* as if they were truth-apt representations to solve the Negation Problem, why not just say they are truth-apt representations?

  **Alex:** Because the *nature* of the engagement is different. I am not describing a moral fact; I am voicing a stance. The logic is imposed on the stance to make communication possible. We *make* it truth-apt through the practice of assertion. That's the quasi-realist story. We start with the expression, we notice we need to embed it, we build the logic, and now we can say it's true.

  **Jordan:** And Schroeder replies: you can't build the logic without already assuming the very structure you're trying to derive. To solve the Negation Problem, you need to know what "not" does before you know what "wrong" does. But if "not" is defined by its interaction with "wrong," and "wrong" is defined by its attitude, you're chasing your tail. You need an independent grip on the negation. The realist has it: negation flips truth. You don't have it. You have negation flips... what? Commitment? Tolerance? Disapproval of disapproval? None of those capture the pure exclusion that "not" provides.

  **Alex:** Pure exclusion is an abstraction. There is no "pure exclusion" in human life other than the exclusion of incompatible stances. If I can show that the stance of "Wrong" and the stance of "Not Wrong" are incompatible in exactly the same structural way as "True" and "False," I have saved the phenomenon.

  **Jordan:** You've saved the phenomenon of *assertion*, maybe. But you haven't explained the *content* of the negation. You've told me what I'm *doing* when I deny a moral claim. You haven't told me what the denial *means* such that it logically contradicts the affirmation without remainder. Until you can explain "Not Wrong" without referencing a specific positive attitude like tolerance or planning-not-to-blame—which inevitably leaves out the logical space of mere absence—you're stuck.

  **Alex:** And until you can explain how a "moral fact" motivates action without reducing it to a psychological state, you're stuck with a magic faculty of intuition. We're both explaining the same data. I just don't invent a spooky ontology to do it.

  **Jordan:** And I don't invent a spooky logic of attitudes to avoid it.

  **Alex:** *[Sips coffee]* So we're at an impasse. The Negation Problem holds the line.

  **Jordan:** For now. But as long as "Not Wrong" remains a puzzle for your side, the realist default stands.

  **Alex:** And as long as "Wrong" fails to motivate on your side, the expressivist challenge stands.

  **Jordan:** Touché. Another round?

  **Alex:** Why not. It's not wrong to buy coffee.

  **Jordan:** Careful. You just embedded a normative claim in a justification.

  **Alex:** And I'd do it again.
