answer: |-
  Here's a short opener that should land with both camps:

  "I know the econ students in the room think Davidson is obsolete. You keep telling me, 'Professor, it's just hyperbolic discounting! The curves cross, so at time-*t* you actually prefer *B*.'

  And look, I love the curves. But Davidson's puzzle isn't why you *prefer* the donut at noon. It's how you can eat it at noon while *judging* the salad is better at noon.

  Hyperbolic discounting explains why your *preferences* are time-inconsistent. It doesn't explain how your *action* is judgment-inconsistent.

  Basically, the economists have explained why you sinned. The philosophers are still trying to figure out how you managed to sin while reading the Ten Commandments out loud."
