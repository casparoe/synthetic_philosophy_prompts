      *   *Circumstantial/Constitutive Luck:* Who you are and what situations you face depend on chance. User argues this is the deeper problem. If Person A is honest because they were never tempted to steal, are they truly more virtuous than Person B who stole when tempted?
      *   *The Goal:* Show two people who *would* have acted the same, but only one was tested. The one who wasn't tested gets the credit; the one who was tested gets the blame. The story needs to highlight the arbitrariness of the situation.

