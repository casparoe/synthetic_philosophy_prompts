      *Decision:* **Elias and Simon.** They are identical twins (emphasizes constitutive similarity). They work in the same profession. **Social Workers.**
      *Scenario:* A case file. One gets a case that is impossible. The other gets manageable cases. The one with the impossible case fudges a report to keep a family together. It gets found out. The other is praised for their integrity. The praised one knows they would have done the same.

  4.  **Drafting - Scene by Scene:**
      *   **Introduction:** Establish the similarity between Elias and Simon. Twins, same training, same values.
