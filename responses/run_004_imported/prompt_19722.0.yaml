answer: |-
  The award sat on the mahogany desk between them, a block of polished acrylic etched with *Excellence in Ethical Leadership*. It caught the fluorescent light of the conference room and threw a small, hard glare onto Martin's tie.

  Martin didn't touch it. Across the desk, Elias was packing a cardboard box. He moved methodically: a stapler, a framed photo of his daughter, a succulent that was slowly dying from neglect.

  "They're letting you keep the pension," Martin said. His voice sounded thin in the empty room. "That's something."

  "It's hush money, Mart. We both know it." Elias didn't look up. He wrapped the succulent in newspaper. "If they fire me for cause, they have to explain why the regional compliance protocols are impossible to follow with a caseload of eighty. This way, I'm just 'resigning for personal reasons.' The department looks clean. You look clean."

  "I didn't ask for the promotion," Martin said. It was the third time he'd said it in ten minutes.

  "No. You just accepted it. You just signed the letter that makes you my supervisor." Elias finally looked up. His eyes were red-rimmed, but dry. They were the same eyes Martin saw in the mirror every morning. They had the same nose, the same jawline, the same slight scar on the chin from a bicycle accident when they were twelve.

  Elias and Martin were not brothers, but they might as well have been. They had joined the Department of Juvenile Justice on the same day, graduated from the same academy with identical scores, and lived in the same neighborhood. They shared a philosophy of rehabilitation over punishment. They were, in every metric that HR could measure, the same man.

  Until the assignment.

  Three years ago, a shuffle in district boundaries had put Elias in charge of the North District. It was a zone of systemic collapse: underfunded group homes, parents working three jobs, gang recruitment that happened faster than caseworkers could file reports. Martin had been assigned the South District. Affluent, stable, the primary risk there was teenage rebellion, not survival.

  In the North, the rules were a luxury. If you followed every protocol to the letter, a kid slipped through the cracks and ended up in a body bag. Elias had learned to bend. He had signed off on housing placements he hadn't physically inspected because the waiting list was six months long and the kid needed a bed *tonight*. He had overlooked missed curfews because the alternative was a detention center that acted as a finishing school for criminals.

  He had done it to save them. He had done it because he was good at his job.

  Then came the audit. They found the unverified housing signature. It was a technicality, a box unchecked. But it was enough. Negligence. Ethical breach.

  In the South, Martin had checked every box. He had inspected every home. He had reported every curfew violation. He hadn't done it because he was braver or more virtuous than Elias. He had done it because his caseload allowed him the time to drive out to the suburbs and knock on doors. His kids had parents who answered phones. His system worked, so he could work within the system.

  "I can't take this," Martin said, tapping the acrylic block. *Ethical Leadership.* "Everyone knows."

  "Everyone knows you didn't get caught," Elias corrected. He taped the box shut. The sound was loud, like a gunshot in a library.

  "If they gave me the North District—"

  "But they didn't." Elias stood up, lifting the box. He looked tired, older than Martin, though they were the same age. The stress had carved deep lines around Elias's mouth that Martin didn't have. Martin's face was smooth, rested. It was the face of a man who slept through the night.

  "That's the thing, Mart," Elias said, shifting the weight of the box. "You think this is about what we did. It's not. It's about what we were asked to carry. You were asked to carry a tray of glasses across a quiet room. I was asked to carry the same tray across a burning building. I dropped a glass. You didn't. Now they're giving you a medal for not dropping it."

  "I would have dropped it," Martin said. He stood up, needing to be at eye level. "Elias, look at me. I know my limits. If I had eighty high-risk cases? I would have cracked. I probably would have done exactly what you did. Maybe worse."

  "Maybe," Elias said. He didn't sound convinced. He sounded hollow. "But you didn't. That's the only fact that matters to them. And honestly? That's the only fact that matters to the universe. You're the guy who didn't drop the glass. I'm the guy who did. The fire doesn't get a vote."

  "I can talk to the Director. I can tell them the caseload disparity. I can share the blame."

  Elias laughed, a short, sharp sound without humor. "And then what? They investigate the South District to see if you *might* have cut corners? They drag your name through the mud just to make me feel less alone? Don't do me any favors, Martin. Your virtue is the only real thing either of us has left. Don't give it away."

  "It's not real."

  "It is to the kids in the South," Elias said. "You kept their files clean. You kept the system off their backs. That helped them. My bending... it helped some, but it got me out of the way. So now you're in charge. You can actually change the caseload limits. You can fix the North."

  Martin looked at the award. It felt heavy, dense with a gravity he hadn't earned. He thought about the interview he'd given for the *City Journal* last week. The reporter had asked about his secret to maintaining such high compliance rates. Martin had talked about diligence and commitment. He hadn't mentioned that he never had to choose between a rule and a child's safety. He hadn't mentioned that his integrity was a product of geography.

  He had lied by omission. He had let the reporter write the story of a saint, when he was just a lucky man.

  "I don't know if I can fix it," Martin admitted. "The budget..."

  "See?" Elias shifted the box to his other hip. "Now you're learning. Circumstances matter. Good luck with the budget, Director."

  Elias walked to the door. He paused with his hand on the frame. He didn't look back.

  "Don't come to the going-away party, Martin. It's awkward when the martyr and the saint are in the same room. People don't know who to look at."

  Elias left. The door clicked shut.

  Martin was alone with the award. He picked it up. It was cold. He turned it over in his hands, looking for a flaw in the acrylic, a bubble, a scratch, anything that would prove it was imperfect. There was nothing. It was flawless.

  He walked to the window and looked down at the parking lot. He saw Elias walk out the front entrance, box in hand. A woman was waiting for him by a sedan. She hugged him, and Elias buried his face in her shoulder for a long moment. He looked small.

  Martin turned back to the office. It was quiet. The phone didn't ring. The inbox on his computer was empty. There were no crises waiting for him. There were no impossible choices. He sat down in the leather chair that had belonged to the Director an hour ago.

  He placed the award on the desk. He aligned it perfectly with the edge of the wood. He sat back and laced his fingers together, assuming the posture of a man in charge. He waited for the feeling of worthiness to arrive. He waited for the guilt to recede.

  Neither happened. He just sat there, a good man in a quiet room, terrified of the first time the phone would ring.
