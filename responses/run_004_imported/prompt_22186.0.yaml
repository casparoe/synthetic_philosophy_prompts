      *   **Welfare:** A gets care support. B gets work support.
      *   **Capabilities:** The State List includes "Employment" but excludes "Unpaid Caregiving" as a central capability (common in policy).
      *   **Allocation:** All money goes to B (to realize Employment Capability). A gets nothing because their chosen functioning isn't on the List.
      *   **Why Capabilities is worst:** It actively discriminates against A's life plan based on an expert-defined list. Resources is neutral. Welfare respects A's happiness. Capabilities imposes a specific "Good Life."

      *This is the one.* It aligns perfectly with the PIP context (assessments often devalue caregiving/non-work activities). It shows Capabilities as paternalistic and potentially exclusionary.

      *Drafting the response:*
      1.  Empathy on PIP (it's dehumanizing).
      2.  The Setup: "The Caregiver vs. The Employee."
      3.  Fixed Pot: £10k support budget.
      4.  Person A (Caregiver): Wants to care for sick relative. Finds paid work harmful to health/wellbeing.
      5.  Person B (Worker): Wants paid employment.
      6.  Analysis:
          *   Resources: Cash. Both choose.
          *   Welfare: Happiness metric.
          *   Capabilities: The "Official List" problem.
      7.  The Twist: Why Capabilities fails (Paternalism, The List, Empty Freedom).
      8.  Closing: Relate back to the "descriptors" in PIP.

      *Wait, I need to make sure I don't misrepresent Sen.* Sen is big on democracy and public reasoning to create the list. But in *policy practice* (like PIP), the list is fixed by bureaucrats. The critique holds for *applied* capability approaches in welfare states. I should clarify that distinction. The "Technocratic Capability Approach" is the villain here.

      *Refining the "Bad Capability" argument:*
      Another strong critique is the **"Fetishism of Freedom."**
      If I am a monk who vows poverty and silence.
      *   Resources: Give me money. I give it away. I am free.
      *   Welfare: I am happy.
      *   Capabilities: The state says "You must have the capability to be Wealthy and Talkative." They spend money ensuring I *could* be rich and loud, even though I vow not to be.
      *   This wastes resources on freedoms I explicitly reject.
      *   Let's use the **"Contented Invalid" vs. "Striving Worker"** but flip it.
      *   Let's use the **"Expensive Option"** argument.
      *   Okay, I'll stick with the **"State-Defined List"** argument. It's the most potent political critique. It shows how Capabilities can be more intrusive than Resources.

