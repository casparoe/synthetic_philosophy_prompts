      *   **Equality of Capabilities:** The state identifies "Employment" as a key capability to be equalized. To ensure Claimant 1 has the *same capability set* as Claimant 2, the state spends the *entire* budget on Claimant 1's ergonomic gear/PA.
      *   **The Twist:** Claimant 1 *does not want to work*. They value the capability of "Caregiving." But the state prioritizes "Employment" on the Capability List.
