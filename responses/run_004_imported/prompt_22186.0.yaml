      *Person B:* Disabled, wants to work but faces barriers.
      *Budget:* Job support fund.
      *Resources:* Cash transfer. A takes leisure. B buys support.
      *Welfare:* A gets leisure support. B gets job support.
      *Capabilities:* State prioritizes "Employment" as a central capability. Funds B heavily. Funds A's job coaching even if A doesn't want it, or penalizes A for not converting the capability.
      *Why it makes Capabilities look bad:* It pushes a specific life path (employment) as inherently valuable, disregarding the individual's own valuation of leisure. It aligns with "workfare" politics.

