      *   **Goal:** Provide a *new* example where all three theories recommend *different* allocations of a fixed budget.
      *   **Crucial Twist:** The example must make the *Capability Approach* look problematic or counter-intuitive (i.e., not the obvious winner). Most literature champions capabilities; the user wants to see the downsides.

  2.  **Deconstruct the Three Theories:**
      *   **Equality of Welfare (Utilitarian/Hedonic):** Focus on subjective well-being, happiness, satisfaction of preferences. *Metric:* Utils/Happiness.
      *   **Equality of Resources (Dworkin):** Focus on the means to pursue life plans. Neutral regarding ends. Uses an insurance market/auction metaphor. *Metric:* Value of bundle of goods/rights.
      *   **Equality of Capabilities (Sen/Nussbaum):** Focus on the substantive freedom to achieve functionings (beings and doings). *Metric:* Real opportunity sets.

  3.  **Brainstorming Scenarios (avoiding wheelchairs/expensive tastes):**
      *   *Idea 1: Education.* (Too common).
      *   *Idea 2: Housing.* (Often boils down to resources).
      *   *Idea 3: Care Work/Parenting.* (Interesting, but often aligns resources and capabilities).
      *   *Idea 4: Addiction/Rehab.* (Good for welfare vs. resources, but capabilities usually win).
      *   *Idea 5: Cultural/Religious Practice.* (Promising).
      *   *Idea 6: The "Adaptive Preferences" Problem.* (This is the classic critique of welfare, but how does it hurt capabilities?)
      *   *Idea 7: The "Expensive Functioning" or "Costly Conversion" problem.*

  4.  **Developing a Specific Scenario:**
      *   I need a situation where having the *capability* doesn't translate to well-being, or where focusing on capabilities ignores subjective suffering, or where resourcism is actually more respectful of agency.
      *   *Scenario:* Two people, fixed budget.
      *   *Person A:* Has a condition that makes a specific functioning extremely costly or painful to achieve, even if technically possible.
      *   *Person B:* Standard needs.
      *   *Wait, the user wants Capabilities to look BAD.*
