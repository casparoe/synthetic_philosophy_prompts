      *   Person A: Can regain walking (Capability) but it causes immense pain and reduces overall life satisfaction.
      *   Person B: Can regain walking easily.
      *   Capabilities: Focuses on ensuring A has the *capability* to walk. Funds the painful rehab.
      *   Welfare: Says "Don't do it, it makes you miserable."
      *   Resources: "Here's cash, buy painkillers or rehab."
