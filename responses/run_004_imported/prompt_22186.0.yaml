      *   *Let's try a "Chronic Pain vs. Mobility" case.*
      *   *Let's try a "Care vs. Independence" case.*

      *Refining the "Bad Capability" angle:*
      The Capability Approach is often criticized for being too demanding on the state (providing *all* capabilities) or for ignoring the individual's choice to *not* use a capability. But the strongest critique regarding *distribution* is the **Conversion Factor** problem combined with **Paternalism**.
      *Better angle:* The "Expensive Capability" problem. If we equalize capabilities, do we pour endless money into someone who gets very little welfare out of it, whereas resources would say "here's your share, spend it how you like," and welfare would say "make them happy instead."

      *Let's try a specific case: The "Reclusive Artist" vs. The "Social Activist".*
      No, that's too abstract.

      *Let's try: The "Painful Rehabilitation" Case.*
      *   **Person A (Stroke Survivor):** Can regain walking capability, but it requires agonizing physio.
      *   **Person B (Leg Amputee):** Cannot regain walking capability, but can have a high-tech prosthetic.
      *   *Welfare:* Make A comfortable (stop physio), give B prosthetic.
      *   *Resources:* Give both equal cash value.
      *   *Capabilities:* Focus on the function "Mobility."
      *   *Why does Capabilities look bad here?* It might force A into painful physio to achieve the "capability" of walking, ignoring that A prefers not to walk if it hurts that much. It values the *option* over the *experience*.

