      *Scenario:* Two claimants. Fixed budget for "Independent Living Support."
      *   **Claimant 1 (Chronic Pain):** Can physically work 16 hours/week *if* provided with expensive ergonomic equipment and a personal assistant to manage pain flares. They *prefer* not to work; they find meaning in caregiving at home.
