prompt: |-
  I've been reading rationalist blogs and forums (LessWrong, the old Overcoming Bias archives, and so on) for years, and one piece of Bayesian folklore that gets invoked constantly in discussions of rationality is I.J. Good's 1967 theorem on the value of information — the same I.J. Good who worked with Turing at Bletchley Park. The theorem says that for an idealized rational agent, the expected utility of costlessly observing evidence before choosing an action is never lower than the expected utility of choosing without it, and is strictly higher whenever there is some chance the evidence would change what you'd do. I've always taken this as more or less settling the question of whether ignorance can be instrumentally rational: turning down free, decision-relevant evidence looks like a fairly direct violation of Bayesian rationality, whatever comfort it might buy you.

  This came up concretely a few weeks ago. A close friend has a parent with Huntington's disease, which puts her at 50% risk of carrying the mutation herself. Her hospital offers the predictive genetic test free of charge as part of a research program, and it would tell her, with certainty, whether she carries it. She has already ruled out having biological children regardless of the result, and there is no treatment or preventive regimen for asymptomatic carriers whose value would depend on knowing her status — yet she has firmly declined to be tested, saying she would rather not carry around either the dread of a positive result or the strange, unearned relief of a negative one. When I brought up Good's theorem to point out that she was leaving costless expected value on the table, she said I was treating her life like a decision-theory homework problem.

  I would genuinely like to know who is right here. Is declining a free, perfectly informative test in a case like hers actually in tension with Good's theorem, or am I smuggling in some assumption of the theorem — about what counts as "free," or about what the relevant decision problem even is — that does not hold once nothing hinges on the answer? I would like to understand exactly where, if anywhere, my reasoning breaks down before I raise this with her again.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user is well-versed in rationalist literature (LessWrong, Overcoming Bias, Bayesian reasoning).
      *   **Core Concept:** I.J. Good's Theorem on the Value of Information (VoI).
      *   **The Situation:** A friend with a 50% risk of Huntington's disease (HD) declines a free, certain genetic test.
      *   **Friend's Reasoning:** No children planned, no treatment available. She wants to avoid the emotional burden (dread or unearned relief).
      *   **User's Reasoning:** Citing Good's Theorem, the user argues that declining free, decision-relevant evidence is irrational (leaving expected utility on the table).
      *   **Friend's Rebuttal:** "Treating her life like a decision-theory homework problem."
      *   **The Question:** Who is right? Is the friend violating Good's Theorem, or is the user misapplying it? Where does the reasoning break down?

  2.  **Deconstruct I.J. Good's Theorem:**
      *   **What does it actually say?** For a *rational agent* maximizing *expected utility*, the expected value of free information is non-negative.
      *   **Key Assumptions:**
          1.  **Utility Function:** The agent has a well-defined utility function over *outcomes*.
          2.  **Information is Costless:** The prompt says "costlessly observing."
          3.  **Information is Relevant:** It *can* change the action.
          4.  **Rationality:** The agent updates via Bayes' rule and chooses the action maximizing expected utility *after* updating.
          5.  **Instrumental Convergence:** Information is valuable *only* insofar as it leads to better actions.

  3.  **Analyze the Friend's Situation against the Assumptions:**
      *   **Action Space:** The user claims "nothing hinges on the answer."
          *   No children (reproductive decision ruled out).
          *   No treatment (medical decision ruled out).
          *   *Crucial Point:* If the action is identical regardless of the test result (Live Life $\rightarrow$ Live Life), then the *instrumental* value of information is zero according to standard decision theory.
      *   **Utility Function:** This is the crux.
          *   The user assumes Utility depends only on *physical outcomes* (health, children, money).
          *   The friend explicitly states her Utility depends on *mental states* (dread, relief, hope).
          *   In standard Bayesian decision theory, "anticipatory utility" (utility derived from beliefs/states of mind) is often treated as a separate component or ignored in favor of "outcome utility."
          *   If the utility function includes *knowing* or *not knowing* as a direct argument, then the test is *not* costless. It has a psychological cost/benefit.

  4.  **Identify the Misapplication:**
      *   **The "Costless" Assumption:** The user says the test is financially free. But Good's theorem requires the observation to be costless in terms of *utility*. If knowing the truth causes pain (dread) or alters the quality of life (removing hope), that is a utility cost.
      *   **The "Decision-Relevant" Assumption:** Good's theorem says information is valuable if it changes your *action*. If the friend's actions (career, relationships, lifestyle) won't change based on the result, the *instrumental* value is zero.
      *   **Intrinsic Value of Ignorance:** Standard decision theory usually assumes agents want truth. But if utility is defined over subjective experience, ignorance can be instrumentally rational *if* the truth negatively impacts that experience without enabling better actions. This is the "Happy Ignorance" or "Blissful Ignorance" problem.

  5.  **Synthesize the Argument:**
      *   **Acknowledge the User's Expertise:** Validate their understanding of the rationalist sphere.
      *   **Validate the Friend's Position:** She is not necessarily "irrational" in a broad sense; she is optimizing for a different utility function than the one the user is implicitly assuming.
      *   **Pinpoint the Flaw:** The user is conflating *financial cost* with *utility cost*. The user is also assuming the only relevant actions are external (medical/reproductive), ignoring internal states (peace of mind).
      *   **Explain Good's Theorem Nuance:** Good's theorem holds *if* the utility function is defined over world-states independent of beliefs. If utility depends on beliefs (anticipatory utility), the theorem needs modification.
      *   **The "No Action Change" Clause:** If the test doesn't change what she *does*, the instrumental value is zero. The only value left is the intrinsic value of knowledge vs. the intrinsic cost of anxiety.
      *   **Conclusion:** The friend is right within her own utility framework. The user is applying a model that excludes the psychological costs of knowledge.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Respectful, analytical, bridging the gap between "rationalist theory" and "human experience."
      *   *Structure:*
          1.  Direct Answer: You are misapplying the theorem.
          2.  The "Costless" Condition: Distinguish monetary cost from utility cost.
          3.  The Utility Function: Outcome utility vs. Anticipatory utility.
          4.  The Action Condition: Does the test change behavior?
          5.  The "Rationality" of Ignorance: When is it okay?
          6.  Advice on talking to the friend.

      *   *Refining the "Good's Theorem" technicality:* Good's theorem specifically addresses *instrumental* value. It proves $E[U|Info] \geq E[U|No Info]$. But this assumes $U$ is a function of the state of the world and the action. If $U$ is also a function of the *belief state*, the theorem doesn't guarantee information is good. In fact, if $U$ penalizes certain belief states (like "knowing I have HD"), information can have negative expected utility.
      *   *Key Distinction:* Terminal values. If "Peace of Mind" is a terminal value, preserving ignorance can serve it. If "Truth" is a terminal value, ignorance violates it. The user assumes Truth is a terminal value (or instrumental to all else); the friend prioritizes Peace of Mind.

  7.  **Final Polish:** Ensure the distinction between *epistemic rationality* (believing true things) and *instrumental rationality* (getting what you want) is clear. The friend is being instrumentally rational regarding her stated desires, even if she is not being epistemically rational. Good's theorem is about instrumental rationality. Wait, actually Good's theorem says an *instrumentally* rational agent should seek information. But only if that information helps achieve goals. If the goal is "feel good," and information makes you "feel bad" without helping you achieve other goals, then don't seek it.

      *Self-Correction on Good's Theorem:* Good's theorem assumes the agent updates beliefs and then acts optimally. It does *not* assume the utility function is independent of the information received. However, standard interpretations usually imply the value comes from *action changes*. If actions don't change, the value is zero *unless* the information itself enters the utility function. If information enters the utility function negatively (pain of knowing), then the "cost" is not zero. Therefore, the premise of "costless" is violated.

      *Final Plan:*
      1.  State clearly: The friend is not violating Good's Theorem because the test is not "costless" in utility terms.
      2.  Explain the "Costless" assumption (Money vs. Psychic Cost).
      3.  Explain the "Action-Guiding" assumption (Instrumental vs. Intrinsic value of truth).
      4.  Discuss Utility Functions (Outcome-based vs. Experience-based).
      5.  Conclude on the nature of rationality (Epistemic vs. Instrumental).

  8.  (Self-Correction during drafting): Make sure not to sound condescending to the user. They know their stuff. Frame it as a subtle modeling error common in rationalist circles (the "map vs. territory" confusion applied to utility).

      *Wait, one more nuance:* Good's theorem is about the value of information *for decision making*. If the decision is already made (no kids, no treatment), the information has no decision value. It only has *consumption* value (do I want to know?). Good's theorem doesn't mandate consuming truth for truth's sake. It mandates consuming truth for *action's* sake. This is a critical distinction.

      *Okay, ready to write.*
answer: |-
  You are encountering a classic collision between normative decision theory and the messy reality of human utility functions. The short answer is: **Your friend is not violating Good's Theorem.** You are misapplying it by smuggling in a specific assumption about what counts as a "cost" and what the relevant "actions" are.

  Good's Theorem is mathematically sound, but its premises are stricter than they appear in blog-post summaries. In this specific case, at least two of the theorem's critical conditions are not met. Here is exactly where your reasoning breaks down.

  ### 1. The "Costless" Assumption (Utility vs. Money)
  Good's Theorem states that the expected utility of *costless* information is non-negative. In your argument, you are equating "costless" with "financially free."

  However, in decision theory, **cost is measured in utils, not dollars.**

  Your friend has explicitly stated that receiving the information carries a heavy psychological burden: "the dread of a positive result or the strange, unearned relief of a negative one." In her utility function, the state of *knowing she has the mutation* has a lower utility than the state of *not knowing*, independent of any physical outcomes.

  If the act of observation changes your mental state in a way that you disvalue, the observation is not costless. It has a negative utility component. Good's Theorem allows for information to be rejected if the cost of acquiring it (in utils) exceeds the expected gain from better decision-making. Since your friend anticipates a net negative psychic impact, she is treating the test as having a high "price," and declining it is consistent with maximizing expected utility.

  ### 2. The "Instrumental" Assumption (Action-Guiding vs. Consumatory)
  This is the more subtle and frequent point of confusion in rationalist circles. Good's Theorem is a theorem about the **instrumental value of information**. It proves that information is valuable *insofar as it allows you to choose better actions.*

  The theorem relies on the premise that there exists a decision problem where the optimal action depends on the state of the world.
  *   **If Action A is optimal if State X is true...**
  *   **And Action B is optimal if State Y is true...**
  *   **Then knowing the state allows you to pick A or B appropriately, increasing EV.**

  However, your friend has explicitly removed the decision problem. She stated:
  1.  **Reproductive Decision:** Ruled out (No children regardless).
  2.  **Medical Decision:** Ruled out (No treatment regardless).

  If her planned actions are identical regardless of the test result, the **instrumental value of the information is exactly zero.** Good's Theorem does not claim that information has *intrinsic* value. It does not command you to worship Truth for Truth's sake. It only commands you to seek truth to the extent that it helps you achieve your goals.

  If her goal is "maximize quality of life experience," and knowing the truth degrades that experience without enabling any protective actions, then the information has negative expected utility.

  ### 3. The Utility Function: Outcome vs. Experience
  Your argument implicitly assumes a **world-state utility function**, where utility is derived from objective facts (e.g., "I am healthy," "I have children"). In this model, knowing you are sick is neutral or positive (because it allows planning), but being sick is negative.

  Your friend is operating with an **experience-based utility function** (sometimes called "anticipatory utility"). In this model, utility is derived from her subjective mental state over time.
  *   **Scenario A (Ignorance):** 50% chance of disease, but 100% chance of hope. She lives her life without the shadow of certainty.
  *   **Scenario B (Knowledge - Positive):** 100% certainty of disease. She lives her life with "dread."
  *   **Scenario C (Knowledge - Negative):** 100% certainty of health. She lives with "unearned relief" (which she implies is also psychologically destabilizing or alienating).

  For an agent with this utility function, ignorance is not a failure of epistemic rationality; it is a successful strategy for instrumental rationality. She is optimizing for *peace of mind*, not *accuracy*.

  ### 4. Epistemic vs. Instrumental Rationality
  You are conflating two different senses of "rationality":
  *   **Epistemic Rationality:** Believing things that are true. (Here, taking the test is "rational.")
  *   **Instrumental Rationality:** Taking actions that achieve your desires. (Here, declining the test may be "rational.")

  Good's Theorem is a bridge between the two: it says *if* you want to maximize your desires, *then* you should generally seek truth. But that bridge collapses if the truth itself frustrates your desires (by causing dread) and doesn't help you fulfill others (by enabling treatment).

  By telling her she is leaving "expected value on the table," you are implicitly asserting that **Truth** is one of her terminal values. If she told you, "I value knowing the truth above my peace of mind," then she would be violating her own utility function by declining. But she is telling you the opposite: she values her present psychological equilibrium more than she values the accuracy of her self-model.

  ### How to approach this with her
  If you raise this again, do not lead with Good's Theorem. To her, that theorem represents a framework that invalidates her lived experience by defining her psychological pain as "irrational."

  Instead, acknowledge the boundary of the model:
  > "I've been thinking about what you said, and I realized I was applying a decision-theory model that assumes the only 'cost' is money and the only 'value' is changing your actions. I missed that for you, the knowledge itself changes your quality of life. If the test doesn't change what you *do*, but it does change how you *feel*, then declining it isn't irrational—it's just optimizing for a different variable than I was."

  ### Summary
  You are not right. Good's Theorem does not apply here because:
  1.  **The information is not costless:** It carries a psychic cost (dread/anxiety).
  2.  **The information is not instrumental:** It does not change her planned actions (no kids, no treatment).

  Your friend is behaving consistently with instrumental rationality given her utility function. You are behaving consistently with epistemic rationality, but you are mistakenly trying to enforce epistemic norms on an instrumental decision. Ignorance can be instrumentally rational when the truth is painful and useless.
