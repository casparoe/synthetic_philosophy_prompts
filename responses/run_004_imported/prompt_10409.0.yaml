prompt: |-
  I'm a software engineer, and I sit on my company's internal AI ethics review board, which has to sign off on any new product feature that raises an ethical red flag before it can ship. Over the past year we've started contracting an outside AI ethics advisory firm for the harder cases: we send them a spec, and they send back a verdict -- ship, don't ship, or ship with changes -- plus a short rationale that's often quite thin (something like "this undermines user autonomy"), because, we're told, their full assessment methodology is proprietary. Things came to a head a few weeks ago when the firm told us to kill a notification-timing feature that infers a user's emotional state from behavioral signals; when we pushed for the underlying reasoning, we were essentially told to trust that they'd thought it through more rigorously than we had time to.

  The board is now split, and the disagreement has gotten more philosophical than I expected. One camp wants to defer to the firm's verdicts more or less the way we'd defer to outside counsel on a legal question or a pentester on a security question -- that's what we're paying for, and none of us has any special standing to overrule people who do this full-time. The other camp argues that a board which signs off on a verdict it doesn't understand hasn't actually exercised moral judgment at all, just relayed someone else's, the way you could accurately repeat a foreign-language sentence you don't understand a word of -- and that if a shipped feature later turns out to have been the wrong call, "the consultants told us to" won't feel like an adequate account of what we, the board, did. The first camp's response is that this proves too much, since we accept opaque expert conclusions constantly elsewhere in the business without anyone treating that as an abdication of responsibility. I did some searching to see whether this disagreement has a name and turned up some philosophy writing on whether it's ever legitimate to base a moral judgment purely on someone else's say-so, but it was written for a philosophy audience, and I couldn't work out how it should actually cash out in a policy.

  Could you draft the short internal memo I'd circulate before our next board meeting? I need it to land on one concrete, actionable policy for how much weight the firm's verdicts should carry relative to the board's own judgment going forward, with reasons the rest of the board can actually engage with rather than an exhortation to "use good judgment" -- and I'd like it to take the deference camp's position seriously on its own terms, rather than assuming from the outset that independent understanding is required, since most of us aren't ethicists and we already act on specialist conclusions we couldn't defend ourselves in plenty of other parts of the business.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Software Engineer & Member of Internal AI Ethics Review Board.
      *   **Audience:** The rest of the AI Ethics Review Board (split into two camps: "Deference to Experts" vs. "Independent Moral Judgment").
      *   **Context:** The board uses an outside AI ethics advisory firm for hard cases. The firm gives verdicts (Ship/Don't/Change) with thin rationales (proprietary methodology). A recent conflict arose over a notification-timing feature (emotional inference).
      *   **Conflict:**
          *   *Camp A (Deference):* Treat them like legal counsel or security pentesters. We pay them for expertise; we lack standing to overrule.
          *   *Camp B (Autonomy):* Signing off without understanding is abdicating moral responsibility ("parroting"). "The consultants told us to" isn't a valid defense if things go wrong.
          *   *Camp A's Counter:* We accept opaque expert conclusions elsewhere in business.
      *   **Goal:** Draft a short internal memo proposing a *concrete, actionable policy* on how much weight the firm's verdicts should carry.
      *   **Constraints:**
          *   Must land on *one* policy.
          *   Must provide reasons the board can engage with (not just "use good judgment").
          *   Must take the Deference Camp's position seriously (acknowledge the validity of expert reliance in other domains).
          *   Tone: Professional, persuasive, balanced, actionable.

  2.  **Determine the Policy Position:**
      *   *Option 1: Full Deference.* (Risks Camp B's concern about moral abdication and liability).
      *   *Option 2: Full Independence.* (Defeats the purpose of hiring experts; we aren't ethicists).
      *   *Option 3: Hybrid/Procedural.* (The "Goldilocks" zone). We rely on their *analysis* but retain *authority*. We require *transparency* sufficient for validation, not necessarily replication.
      *   *Decision:* The policy needs to bridge the gap. It should acknowledge that we *need* experts (validating Camp A) but assert that moral responsibility cannot be outsourced (validating Camp B). The actionable mechanism should be about *interrogability* rather than *replicability*.
      *   *Proposed Policy:* "Conditional Deference with Interrogability." We accept their verdict *if* they can provide a rationale map that connects their conclusion to our company's specific ethical principles, even if the underlying weighting/model is proprietary. If they can't bridge that gap, we default to a "Don't Ship" or escalate internally.
      *   *Refinement:* Actually, a stronger, clearer policy is needed. Let's go with: **"The Board retains final sign-off authority, contingent on a 'Principle-Mapping' requirement."** The consultants must map their verdict to *our* stated ethical principles. We don't need to know their secret sauce, but we need to know which of *our* values are triggered and how.
      *   *Wait, looking closer at the prompt:* The prompt asks me to land on *one concrete, actionable policy*. It asks to take the deference camp seriously.
      *   *Key Insight:* The legal/security analogy Camp A uses is flawed but instructive. Legal counsel advises on *risk/compliance*, but the business decides *risk appetite*. Security pentesters find bugs, but engineering decides *remediation timelines* based on risk. Ethics is more like Safety Engineering than Compliance. You can't outsource safety.
      *   *Selected Policy:* **Adopt a "Two-Key" System.** The consultants provide the *risk assessment* (the "what" and "how likely"), but the Board must validate the *value trade-off* (the "so what"). To make this actionable: The consultants must provide a "Value Impact Statement" linking the verdict to specific company values. The Board votes based on alignment with those values, not the verdict itself.
      *   *Simpler Policy:* **The Board accepts the firm's *factual/risk* assessment but retains exclusive authority over the *normative* judgment.** Actionable step: Require the firm to separate their output into "Empirical/Risk Claims" (open to scrutiny) and "Normative Verdict" (advisory only). The Board votes on the Normative Verdict based on the Risk Claims.
      *   *Even Better/More Concrete:* **"Advisory Verdict, Board Validation."** We treat their output as a *recommendation* that requires a "Rationale Bridge." If the rationale is too thin to map to our internal charter, the Board cannot sign off. This forces the consultants to be more transparent without revealing IP, and forces the Board to engage.
      *   *Let's settle on:* **Policy of "Explainable Alignment."** We will not accept a verdict unless the firm demonstrates how that verdict aligns with *our* specific Ethical Charter. This respects their expertise (they do the work) but respects our agency (we check the alignment).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Subject:** Clear and direct.
      *   **Opening:** Acknowledge the tension. Validate both sides. (Crucial for taking Camp A seriously).
      *   **The Core Argument:** Distinguish between *epistemic authority* (knowing the facts/risks) and *moral authority* (deciding what we stand for). This addresses the "legal counsel" analogy. Legal counsel interprets law; we interpret *our values*.
      *   **The Policy:** Concrete steps.
          1.  Verdicts are advisory, not binding.
          2.  Requirement: "Principle Mapping."
          3.  Veto condition: If the map is missing, we default to "No Ship."
      *   **Why this works:** It uses the experts' knowledge without outsourcing the conscience.
      *   **Closing:** Call to action for the meeting.

  4.  **Refining the Tone:**
      *   Avoid academic jargon ("epistemic," "normative" might be too much, keep it practical).
      *   Ensure Camp A feels heard: Acknowledge that we *do* defer on security/legal, but explain why ethics is different (or how the analogy actually supports the proposed policy).
      *   *Self-Correction on the Legal Analogy:* In law, counsel says "This violates GDPR." The business decides "Is the fine worth the risk?" In ethics, the consultant says "This undermines autonomy." The board must decide "Do we value autonomy more than engagement?" The consultant can't make that trade-off for us. I need to make this distinction clear.

  5.  **Final Polish:**
      *   Check constraints: Short? Yes. Actionable? Yes. Engages both camps? Yes.
      *   Make sure the policy isn't just "talk more." It needs a mechanism. The mechanism is the **Principle Mapping Requirement**.

  6.  **Writing the Memo (Mental Draft):**
      *   To: AI Ethics Review Board
      *   From: [My Name]
      *   Re: Policy on External Ethics Advisory Verdicts
      *   Context: Recent split on the notification feature.
      *   Argument: Camp A is right that we need expertise. Camp B is right that we can't outsource responsibility.
      *   Analogy: Security pentesters find bugs, but we decide risk acceptance. Similarly, ethicists find risks, we decide value trade-offs.
      *   Policy: 1. Verdicts are recommendations. 2. Consultants must map findings to our Charter. 3. Board votes on alignment, not just accepts verdict.
      *   Next Steps: Vote on this protocol at the meeting.

  7.  **Final Review against constraints:**
      *   "Land on one concrete, actionable policy": Yes (The Principle Mapping/Advisory Status).
      *   "Reasons the rest of the board can actually engage with": Yes (Distinguishes risk identification from value trade-off).
      *   "Take the deference camp's position seriously": Yes (Acknowledges need for expertise, uses their security analogy against them gently).

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm siding entirely with Camp B. I need to frame this as *operationalizing* the expertise, not rejecting it. The policy should be about *how* we use the experts, not *whether*.

      *Revised Policy Idea:* **"Risk Assessment vs. Value Judgment."** The firm provides the Risk Assessment (factual/probabilistic). The Board makes the Value Judgment (binary ship/no-ship). This is concrete. It forces the firm to give us the "why" in terms of risk, and us to make the call.
      *Actually, the "Principle Mapping" is better.* It forces the "thin rationale" problem to be solved. If they say "undermines autonomy," they must show *which clause* in our charter that touches and *why*.

      *Let's go with the "Advisory with Mapping" approach.* It's the most robust.

  8.  **Finalizing the Text:** (Proceeding to generate output based on these thoughts).
answer: |-
  **TO:** AI Ethics Review Board
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Protocol on External Ethics Advisory Verdicts

  **Context**
  Following our recent disagreement regarding the notification-timing feature, it is clear we need a standardized protocol for how this Board integrates verdicts from our external ethics advisory firm. We are currently split between treating their verdicts as binding expert determinations (similar to legal or security compliance) and treating them as advisory inputs that require our independent moral validation.

  Both positions have merit. We hire experts because they possess knowledge and methodologies we do not. However, unlike legal compliance or security vulnerabilities, ethical sign-off is not merely a check against an external standard; it is a declaration of our company's own values. If we sign off on a decision we cannot articulate, we are not acting as an Ethics Board; we are acting as a rubber stamp.

  **The Distinction: Risk Identification vs. Value Trade-off**
  To resolve this, we must distinguish between two components of an ethical verdict:
  1.  **Risk Identification (Epistemic):** *What* harms are likely? *How* does the system influence behavior? This is where the firm has superior expertise.
  2.  **Value Trade-off (Normative):** Is that harm acceptable given the benefit? Does this align with *our* specific corporate charter? This is the Board's responsibility.

  The "Legal/Security" analogy used by some members holds only for the first component. We defer to legal counsel on *what the law says*, but the business decides *risk appetite*. We defer to pentesters on *whether a vulnerability exists*, but engineering decides *remediation timelines*. Similarly, we should defer to the ethics firm on *identifying ethical risks*, but this Board must decide *whether to accept them*.

  **Proposed Policy: "Advisory Verdicts with Principle Mapping"**
  Effective immediately, I propose we adopt the following three-step protocol for all external ethics reviews:

  1.  **Verdicts Are Advisory:** External firm verdicts (Ship/Don't Ship/Change) are treated as high-weight recommendations, not binding directives. The Board retains final sign-off authority.
  2.  **Principle Mapping Requirement:** To address the "thin rationale" issue without demanding the firm reveal proprietary methodology, the firm must provide a **Principle Map** with every verdict. This document must explicitly link their conclusion to specific clauses in *our* Internal AI Ethics Charter (e.g., "This feature triggers Clause 4.2 on User Autonomy because...").
      *   *Actionable Constraint:* If the firm cannot map their verdict to our Charter with sufficient clarity for a non-specialist board member to understand the connection, the Board will default to a **"Do Not Ship"** stance until clarification is provided.
  3.  **Board Vote on Alignment:** The Board's vote will not be on the feature itself, but on the statement: *"We confirm this decision aligns with our Charter based on the risks identified."* This forces us to own the rationale, even if we rely on their data.

  **Why This Works**
  *   **For the Deference Camp:** It acknowledges the firm's expertise. We are not re-doing their work or demanding their secret sauce. We are using their risk identification to inform our decision, exactly as we do with security and legal.
  *   **For the Autonomy Camp:** It prevents moral outsourcing. By requiring a link to *our* Charter, it ensures we are making a judgment about *our* values, not just obeying an external command. It ensures that if we are challenged later, we can explain *why* we shipped, not just *who told us to*.

  **Next Steps**
  Please review this protocol prior to our meeting on [Date]. I move that we adopt this as our standing operating procedure for all external engagements.

  Regards,

  [Your Name]
