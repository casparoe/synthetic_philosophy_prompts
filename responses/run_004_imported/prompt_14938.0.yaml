          1.  $p$ is true.
          2.  $S$ believes $p$.
          3.  If $p$ were false, $S$ wouldn't believe $p$ (Variation/Tracking condition).
          4.  If $p$ were true, $S$ would believe $p$ (Adherence condition).
      *   *Crucial Point:* Conditions 3 and 4 are subjunctive conditionals (counterfactuals). They rely on similarity of possible worlds.

