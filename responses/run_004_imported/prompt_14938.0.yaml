prompt: |-
  so in my epistemology seminar we're doing the skepticism unit and I feel like ive basically got the classic brain-in-a-vat setup down, but then my professor brought up Nozick's tracking account of knowledge and now im second-guessing myself. the idea (i think?) is that you only know p if your belief tracks the truth of p across nearby possible worlds -- like you know you have hands because if you didn't have hands you wouldn't believe you did. but then apparently that same theory says you can't know you're not a brain in a vat, because even in the world where you actually ARE a BIV, you'd still believe you weren't one, so the belief totally fails to "track" truth in that scenario. my prof said Nozick just bites the bullet and accepts that knowledge isn't closed under known entailment -- so you can know you have hands, know that having hands entails you're not a handless BIV, and still not know you're not a BIV. that seems kind of insane to me?? isn't the whole point of closure that its supposed to be obvious/uncontroversial?

  we've got a short response paper due before thursday's discussion section and I want to actually understand the mechanics here instead of just paraphrasing the SEP article. can you walk me through WHY Nozick thinks giving up closure is the better trade here rather than a reductio of his whole tracking view, and also how this move actually differs from a regular skeptic just saying "well then you dont know you have hands either"? bonus points if you can explain what a "nearby possible world" is even doing in this argument without just hand-waving at modal logic, since thats the part that always trips me up when we discuss this in section.
