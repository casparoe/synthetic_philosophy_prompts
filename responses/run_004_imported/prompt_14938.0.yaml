      *   *Example:* "If I dropped this cup..." (Nearby world: gravity works, cup is fragile, I let go). vs. "If gravity didn't exist..." (Distant world).
      *   *Application to BIV:*
          *   World $W_1$ (Actual): I have hands, I believe I have hands.
          *   World $W_2$ (Nearby $\neg$Hands): I lost hands in an accident, I look at stumps, I believe I have no hands. (Tracking works $\rightarrow$ Knowledge).
          *   World $W_3$ (BIV world): I am a BIV, I believe I have hands.
          *   *The Kicker:* Is $W_3$ "nearby" to $W_1$ when evaluating "If I didn't have hands"? Nozick says for ordinary propositions, we look at *ordinary* ways of being wrong (accidents), not *skeptical* ways (demons/vats).
          *   *Wait, correction:* For the proposition "I am not a BIV," the closest world where that is false *is* the BIV world. In that world, I still believe I'm not a BIV. So tracking fails.

  4.  **Address the Closure Problem (Confusion Point 1 & 2):**
      *   *Closure Principle:* If $S$ knows $p$, and $S$ knows $p \rightarrow q$, then $S$ knows $q$.
      *   *Nozick's Setup:*
          *   $p$: I have hands. (Tracks truth. If no hands [accident], I wouldn't believe it. So, Know $p$).
          *   $q$: I am not a BIV. (Does not track truth. If BIV, I would still believe $\neg$BIV. So, $\neg$Know $q$).
          *   Entailment: Hands $\rightarrow$ $\neg$BIV.
      *   *Why give up Closure?*
          *   Nozick prioritizes *explaining why skepticism feels wrong* while preserving *ordinary knowledge*.
          *   Skeptic says: No Knowledge of $\neg$BIV $\rightarrow$ No Knowledge of Hands (via Closure).
          *   Nozick says: We *do* have Knowledge of Hands (intuition). We *don't* have Knowledge of $\neg$BIV (tracking analysis). Therefore, Closure must be the weak link.
          *   *Why is this better than Skepticism?* Because skepticism is too costly. It wipes out almost all knowledge. Nozick saves ordinary knowledge at the cost of a logical principle (Closure) that might not be as robust as we thought in counterfactual contexts.
          *   *Why is this different from Skepticism?* The Skeptic uses Closure to *deny* ordinary knowledge. Nozick uses the failure of tracking to *deny* Closure, thereby *saving* ordinary knowledge. Same premise (Don't know $\neg$BIV), opposite conclusion about Hands.

  5.  **Synthesize the "Why" (The Trade-off):**
      *   Nozick thinks Knowledge is a *factual relation* between believer and world, not a logical game.
      *   Closure is a logical principle. Knowledge is a naturalistic/counterfactual relation.
      *   If the definition of knowledge (tracking) conflicts with a logical principle (closure), the definition of the natural kind wins.
