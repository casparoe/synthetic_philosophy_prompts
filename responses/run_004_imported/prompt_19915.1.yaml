answer: |-
  You were not being irrational. Your friend’s argument relies on a specific economic model—Expected Utility Theory—that assumes you care only about your final net worth. While mathematically consistent, this model fails to account for how humans actually experience risk and money.

  Here is a coherent defense of your decision, broken down into the three concepts that explain why your behavior is rational.

  ### 1. The "Rabin Paradox" (Why the Friend’s Math is Flawed)
  Your friend is likely citing a concept formalized by economist Matthew Rabin. He proved that if you reject a small, positive bet (like losing $500 to win $700) because you are "risk-averse" regarding your total wealth, the math implies you must be absurdly risk-averse at higher stakes.

  For example, to justify rejecting your friend's $500 bet purely based on wealth utility, you would theoretically have to reject a bet where you lose $1,000 to win **$1,000,000**.

  **The Defense:**
  Your friend assumes your risk aversion comes from the "diminishing marginal utility of wealth" (the idea that an extra dollar matters less as you get richer). However, behavioral economics shows that people are actually **Loss Averse**. We feel the pain of a loss about twice as intensely as the pleasure of an equivalent gain. Because you evaluate the bet based on the *pain of losing $500* rather than the *change in your total net worth*, you are not bound by your friend's mathematical paradox. You can rationally reject the small bet while accepting the massive one.

  ### 2. Narrow vs. Broad Framing (The Stock Comparison)
  Your friend argues that investing in stocks is inconsistent with rejecting the coin flip. This ignores the critical difference in **time horizon** and **framing**.

  *   **The Coin Flip (Narrow Frame):** This is a single, binary event. You have a 50% chance of an immediate, realized loss. The volatility is absolute.
  *   **Stock Investing (Broad Frame):** This is a stream of thousands of trades over decades. While the stock market has risk, you are relying on the "Law of Large Numbers" to smooth out the volatility.

  **The Defense:**
  You are not betting on a single day of market performance; you are betting on the long-term trend of the economy. It is perfectly rational to accept a risk that averages out over time (stocks) while rejecting a risk that is resolved in a single, high-stakes moment (the coin flip). You are effectively saying, "I am willing to accept volatility over a decade, but I am not willing to accept a 50% chance of a painful loss right now."

  ### 3. Regret and Accountability
  There is a psychological cost to risk known as "Regret Theory."

  *   **Market Loss:** If your index fund drops 10%, it is "the market." It is a systemic event, and you feel less personal responsibility.
  *   **Coin Flip Loss:** If you lose the bet, it is a specific, isolated failure of judgment. You have to explain to yourself why you gambled $500 on a coin flip and lost.

  **The Defense:**
  By rejecting the bet, you are paying a "premium" (the $100 expected value you gave up) to avoid the psychological burden of a potential regretful loss. Avoiding the feeling of being "silly" for losing a gamble is a valid utility that outweighs the mathematical gain.

  ### Summary
  Your friend is judging you by a model that assumes humans are cold calculators of total wealth. You, however, are acting as a rational human who understands that **risk is not just a number—it is an experience.**

  You can tell your friend: *"I am not rejecting this bet because I dislike risk generally; I am rejecting it because I am **Loss Averse**. I prefer to take risks where the odds smooth out over time (stocks) rather than risks that rely on a single binary outcome where the pain of losing $500 outweighs the joy of winning $700."*
