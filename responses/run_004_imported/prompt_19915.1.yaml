prompt: |-
  A friend recently offered me a simple bet: on a coin flip, I would lose $500 if it landed heads but win $700 if it landed tails. I turned it down, even though I recognized that taking the bet was the smarter move on average, because risking that much money on a single flip made me uneasy. My friend called this inconsistent, since I contribute part of every paycheck to a stock index fund without hesitation, and he argued that the same reasoning, applied consistently, would force me to also turn down much larger bets, even ones so favorable that refusing them would seem absurd. I haven't found a good way to counter that argument, but something about it still doesn't sit right with me. Was I really being irrational, or is there a coherent way to defend my decision?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Dilemma:**
      *   **The Bet:** 50/50 coin flip. Lose \$500 (Heads), Win \$700 (Tails).
      *   **Expected Value (EV):** Positive ($0.5 \times 700 - 0.5 \times 500 = +100$).
      *   **User's Action:** Rejected the bet.
      *   **Reasoning:** Risk aversion/discomfort with losing \$500 on a single flip.
      *   **Friend's Argument:** It's inconsistent because the user invests in stock index funds (which have positive EV but risk). The friend claims that rejecting this specific bet implies a utility function (likely based on standard Expected Utility Theory) that would lead to absurd rejections of massive, highly favorable bets.
      *   **User's Feeling:** Something doesn't sit right, but they can't counter the argument. They want to know if they were irrational or if there's a coherent defense.

  2.  **Deconstruct the Friend's Argument (The "Rabin Paradox"):**
      *   The friend is essentially citing a concept formalized by economist Matthew Rabin (2000).
      *   *The Logic:* If you reject a small-stake positive EV bet (like 50/50 lose \$100, win \$110) due to *diminishing marginal utility of wealth* (the standard economic explanation for risk aversion), the math implies you must be incredibly risk-averse at higher stakes.
      *   *The Implication:* To justify rejecting a \$500/\$700 bet purely based on wealth utility, you would theoretically reject a 50/50 bet to lose \$1,000 and win \$1,000,000 (or similar absurdities).
      *   *The Friend's Point:* Since you invest in stocks (taking risk for return), you claim to accept risk. Rejecting this specific bet implies a level of risk aversion that contradicts your stock market behavior.

  3.  **Evaluate the User's Intuition vs. Economic Theory:**
      *   *Standard Economics (EUT):* Assumes people maximize expected utility of *final wealth*. Under this model, the friend is right. Rejecting small bets implies absurd risk aversion for large bets.
      *   *Behavioral Economics (Prospect Theory):* People evaluate gains and losses relative to a *reference point*, not final wealth. They are loss-averse. This makes rejecting the bet rational within a different framework.
      *   *Myopic Loss Aversion:* The user compares the coin flip (immediate, isolated loss) to stocks (long-term, diversified, averaged over time).

  4.  **Formulate the Defense (The "Coherent Way"):**

      *   *Point 1: Narrow Framing vs. Broad Framing.*
          *   The coin flip is a "narrow frame." It's a one-off event.
          *   Stock investing is a "broad frame." It's a stream of returns over decades.
          *   *Analogy:* Rejecting a single hand of Blackjack (even with good odds) vs. playing the whole night.

      *   *Point 2: Loss Aversion (Prospect Theory).*
          *   Pain of losing \$500 > Pleasure of winning \$700.
          *   This isn't about total wealth; it's about the *change* in wealth.
          *   Stocks are viewed differently: we expect volatility, but the "loss" isn't realized until the end, and the long-term trend is up.

      *   *Point 3: The "Rabin Paradox" Flaw.*
          *   The friend's argument relies on the assumption that risk aversion comes *only* from the diminishing utility of wealth (curvature of the utility function).
          *   If risk aversion comes from *loss aversion* (psychological pain of loss), the paradox disappears. You can reject the \$500/\$700 bet without rejecting the \$1k/\$1M bet.

      *   *Point 4: Liquidity and Regret.*
          *   Losing \$500 *now* might hurt more than the abstract gain.
          *   "Regret theory": If I lose the coin flip, I feel stupid. If stocks go down, it's "the market."

  5.  **Structure the Response:**

      *   **Validation:** Acknowledge that the user's feeling is shared by many and that the friend's argument is a famous economic puzzle.
      *   **The Friend's Logic (The Trap):** Explain *why* the friend thinks this (Expected Utility Theory and the Rabin Paradox). Show the math briefly to validate the friend's technical point *within that specific model*.
      *   **The Flaw in the Friend's Logic:** Explain that the friend assumes risk aversion is solely about "wealth utility."
      *   **The Defense (Why the user is rational):**
          1.  **Loss Aversion (Prospect Theory):** Distinguish between "utility of wealth" and "utility of gains/losses."
          2.  **Time Horizon & Diversification (The Stock Comparison):** Contrast a single binary event with a continuous probability distribution over time.
          3.  **Mental Accounting:** We treat "gambling money" differently from "investment money."
      *   **Conclusion:** The user wasn't irrational; they were just using a more sophisticated (behavioral) model than the friend's rigid classical model.

  6.  **Refining the content (Self-Correction during drafting):**
