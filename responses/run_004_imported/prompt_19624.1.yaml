prompt: |-
  Ok so I've been chewing on this argument with my partner for like a week now and it's kind of stuck in my head. We were talking about how I spend my evenings and I said I wish we watched more movies together instead of me zoning out on my phone every night. She said something like "if you actually preferred hanging out with me over the phone you'd just do it, what you actually do is what you prefer, everything else is just talk." She even joked, kind of in an economics way since she took some classes in college and I never did, that I probably just have more "utility" for my phone than for her lol, not totally sure what she meant by that but it stuck with me. On the surface it kinda makes sense, actions over words and all that, but it also felt like a cheap gotcha, because its not like this happened once, its basically every single night, and I've actually tried stuff like giving her my charger before bed or deleting the apps for a week specifically because I don't want to keep picking the phone.

  That last bit is what really gets me though. If picking the phone every night just proves thats what I really want deep down, then why would that same "real me" also be the one begging her in advance to take the option away from me? Is that just me being a hypocrite, or is there some actual coherent way both of those things can be true about the same person at the same time, without it just being a contradiction? I tried googling it but all I get is generic relationship advice about communication, and asking friends just got me "relationships are hard lol." What I actually want to know is whether "what you choose" and "what you prefer" are even allowed to come apart like that, logically speaking, and if so what that would mean for who's actually right here.
