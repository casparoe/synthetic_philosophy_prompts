      - Move to the Berlin Wall.
      - State the thesis: It's not a joke today.
      - Technical nod: SSA vs SIA, Reference Class.
      - The "So What?": If the future is fragile, we are the guardians.
      - Closing: You are the variables that matter.

  10. **Final Review against constraints:**
      - 6-7 mins? (Looks like ~950 words).
