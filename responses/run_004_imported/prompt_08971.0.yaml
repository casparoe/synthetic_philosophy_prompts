      - Hopeful enough? (Focuses on agency and value).
      - Speaker's view preserved? (Yes, admits it's compelling).

      *Let's write.*
answer: |-
  President [Name], faculty, families, and most importantly, the graduating class of [Year].

  For the past several years, I have taught a specific parable in my probability courses. It usually involves our department's decrepit photocopier. I ask students: "Given that this machine has survived this long without being thrown out, how much longer should we expect it to function?"

  It is an application of what is known as the Doomsday Argument. Formulated by Brandon Carter and expanded by John Leslie, and independently derived by Richard Gott—who famously used it to predict the fall of the Berlin Wall—it is a piece of Bayesian reasoning that suggests a sobering conclusion. The logic rests on the Self-Sampling Assumption: that you should reason as if you are a random observer drawn from the set of all observers who will ever exist.

  If you are a random sample, it is statistically unlikely that you are among the very first 1% of humans, or the very last. You are likely somewhere in the middle. Since about 100 billion humans have been born so far, if we are in the middle, the total number of humans who will *ever* be born might not be vastly larger than the number who *have* been born. This implies that humanity's future may be shorter than its past.

  Usually, I teach this as a curiosity. A intellectual puzzle to be solved and filed away. But today, standing before you, I find I cannot treat it as a joke. I find the argument compelling. Even granting the objections you have studied—the Self-Indication Assumption which argues that your very existence makes a larger total population more likely, and the unresolved mess of the Reference Class Problem regarding who counts as an "observer"—the core tension remains. It is a mathematical whisper that suggests fragility.

  I know what this sounds like. To the parents and families here: I am not standing at this podium to tell you that the world is ending. I am not here to replace your pride with anxiety. And to the graduates: I am not here to fudge the math to make you feel better.

  I am here to tell you that if this argument holds water, it does not condemn us to doom. It condemns us to responsibility.

  The Doomsday Argument relies on a specific view of the future: that it is a fixed distribution waiting to be sampled. It treats humanity as a passive object, like the Berlin Wall or a photocopier, subject to decay and external forces. But you are not photocopiers. You are statisticians. You are mathematicians. You know better than anyone that a model is only as good as its assumptions.

  The assumption that the future is independent of the observer is the one variable you have the power to break.

  If the argument is correct, it means the "default" trajectory of intelligent civilization is brevity. It means that reaching the middle of history is not a guarantee of reaching the end. It means that the filter is not behind us, but ahead. But in probability, as in life, a low prior probability is not a fate. It is a challenge.

  To the graduates: You have spent years learning to quantify uncertainty. You know that a confidence interval is not a cage; it is a map of where our knowledge ends and our action must begin. If the Bayesian odds suggest that the continuation of our story is precarious, that does not mean we should despair. It means that the marginal value of every action taken by this generation is higher than we previously calculated.

  If we are likely near the middle of the human story, then *we* are the bridge. We are the generation that must decide whether the curve flattens out or crashes to zero. The argument strips away the complacency of infinite growth. It tells us that the future is not a resource to be consumed, but a variable to be solved for.

  To the families: Please do not hear this as fear. Hear it as a testament to the importance of this moment. We often tell our children that they are the future. The math suggests something more urgent: they are the *pivot*.

  The Doomsday Argument is often criticized for being depressing. I propose it is actually the ultimate call to agency. If the future were guaranteed, your work would not matter; the arc of history would bend itself. But if the future is contingent—if it relies on the specific choices of the observers currently alive—then your agency is the most significant force in the equation.

  You are leaving this university with tools that allow you to see signal in noise. You know how to update priors when new data arrives. The data of our world is changing rapidly. The old assumptions about stability, about resources, about peace, are being tested. Do not cling to the priors of the past. Update. Adapt.

  There is a profound hope in the fact that we can even have this conversation. The Doomsday Argument requires observers capable of understanding their own rank in history. We are the universe becoming conscious of its own timeline. That is not a small thing. That is a miracle of cognition.

  So, walk out into the world knowing that the odds may not be infinitely in your favor. Walk out knowing that the photocopier might break, and walls might fall. But walk out knowing that you are not the sample. You are the analysts. You are the engineers. You are the ones who get to rewrite the function.

  The future is not a number waiting to be discovered. It is a sum waiting to be calculated. And for the first time in history, we have enough of you, trained well enough, to solve it.

  Congratulations. Go make the total number $N$ as large as you possibly can.

  Thank you.
