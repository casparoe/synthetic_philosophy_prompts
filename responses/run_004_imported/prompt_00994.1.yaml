answer: |-
  The wind up on the gallery was vicious, whipping the rain sideways against the iron railing. Below, the black water churned where the *Marianne* had gone down two nights prior. 

  Elena lit a cigarette, cupping her hand against the gale. Marcus leaned against the glass of the lantern room, arms crossed. They had spent the morning on the witness stand, offering the jury contradictory metaphysics.

  "You really told them 'nothing' killed those sailors," Elena said, smoke trailing instantly away from her. "That's a hard sell when the bodies are still warm."

  "I told them the truth," Marcus said. "Causation is a physical relation. It requires a transfer of energy, a mechanism. A push, a pull, a chemical reaction. The keeper didn't push the ship. He didn't pull the rocks closer. He slept. Sleep is a state, not a force. Darkness isn't a weapon; it's just the absence of light. You can't build a chain of events out of missing links."

  "Counterfactual dependence is real, Marcus," Elena snapped. "If he had lit the lamp, the ship would have steered clear. If he hadn't slept, the lamp would have been lit. His omission is the difference-maker. In any meaningful sense of the word, his failure caused the wreck."

  "Meaningful to whom? To a lawyer? Maybe. To a physicist? No." Marcus tapped the glass behind him. "If we accept your view, we drown in causes. Consider the Queen of England."

  Elena exhaled sharply. "Here we go."

  "Standard objection for a reason," Marcus said. "There was a houseplant in London that died of thirst yesterday. The Queen of England did not water it. By your logic, her omission is a cause of the plant's death. After all, if she *had* watered it, the plant would live. She is just as much a murderer of that fern as your keeper is of those sailors. Absurdity."

  Elena turned to face him, leaning into the wind. "I don't dodge the Queen, Marcus. I distinguish her. Causation isn't just about brute counterfactuals; it's about *relevant* counterfactuals within a normative system."

  "Normative? You're smuggling 'ought' into 'is'."

  "I'm acknowledging that 'cause' is a context-sensitive term," Elena corrected. "When we ask for the cause of an event, we aren't asking for every necessary condition in the universe. We're asking for the deviation from the expected course of things. The lighthouse is a system designed to prevent wrecks. The keeper is the functional component of that system. His role defines the 'default' state: the lamp should be on. When it goes dark, that is a deviation. The Queen watering a random plant is not part of any functional system. Her 'default' is non-interference. So, her omission isn't a cause because it wasn't a deviation from an expected process."

  "So causation depends on job descriptions?" Marcus shook his head. "That's not metaphysics, Elena. That's sociology. You're saying the physics of the universe changes based on whether the man sleeping has a contract in his pocket."

  "I'm saying that 'causation' in a court of law isn't about the physics of the universe. It's about human agency. If you strip causation of norms, you can't explain negligence. You reduce the world to billiard balls."

  "And if you inflate causation to include norms," Marcus countered, "you make everyone responsible for everything they didn't stop. I didn't send food to the famine in the Sudan. Did I cause those deaths? By your 'difference-maker' logic, yes. If I had sent money, they would have eaten."

  "You didn't have a duty," Elena said. "The keeper did."

  "See? Duty. Morality. You've admitted it. You're not proving he *caused* the wreck. You're proving he *wronged* the sailors. Those are two different things." Marcus pushed off the glass. "And here is where you're confusing the jury. You think if I win—if the court agrees that omissions aren't causes—the keeper walks. He doesn't."

  Elena frowned. "If he didn't cause the deaths, what is he guilty of? Breach of contract? He's on trial for manslaughter."

  "He's guilty because he undertook a responsibility and failed to discharge it," Marcus said. "Look at the storm. The wind, the waves, the rocks—*those* caused the wreck. That's the physical process. The keeper's job wasn't to stop the physics of the storm. His job was to mitigate the risk. When he slept, he didn't cause the ship to hit the rocks. He simply failed to prevent it."

  "Semantics," Elena muttered.

  "Critical semantics," Marcus insisted. "If we say he caused the wreck, we imply he initiated the harm. If we say he failed to prevent it, we hold him accountable for his specific role. I can be morally and legally liable for an omission without being the metaphysical cause of the outcome. I can be blameworthy for the death without having killed them."

  "But that distinction lets him off the hook psychologically," Elena argued. "If he believes he didn't *cause* anything, that he just 'failed to prevent,' he dilutes his own guilt. He becomes a bystander who didn't help, rather than the agent of their destruction."

  "No," Marcus said softly. "It makes it heavier. A bystander watches a drowning man. He feels bad. But the keeper? He was the lifeguard. He was paid to be the eyes. By separating cause from responsibility, we highlight that his sin wasn't action, it was *abdication*. He abandoned his post. That is a specific kind of moral failure that gets lost if you just lump it in with 'causing'."

  Elena looked out at the dark water. "But the law requires *actus reus*. A guilty act. If 'nothing' happened, where is the act?"

  "The act was going to sleep while on duty," Marcus said. "That's a positive action. The omission is just the result of that action. He acted to close his eyes. He failed to open them. The causation of the wreck is irrelevant to the culpability of the sleep."

  Elena took a final drag of her cigarette and flicked the butt over the railing. It vanished into the dark. "You know why the Queen objection bothers me, Marcus? Because it suggests the universe is indifferent to our roles. But the law isn't the universe. It's a human construct. And in human constructs, 'nothing' can be a weapon."

  "In human constructs, maybe," Marcus conceded. "But don't confuse the map for the territory. You can convict him. You should convict him. But don't lie about the physics to do it. The storm killed them. He just left the door open."

  "He locked the door and threw away the key," Elena said. "That's not leaving it open. That's causing."

  Marcus sighed, turning his collar up against the rain. "We're going to disagree until we die, aren't we?"

  "Probably," Elena said. "But if I die because you didn't call an ambulance, I'll make sure my ghost haunts you with counterfactuals."

  Marcus almost smiled. "I'll testify that your ghost lacks physical mass. Therefore, it can't cause me any fear."

  They stood in silence for a moment, the wind howling through the ironwork, the dark sea pounding the rocks below, indifferent to who was to blame.
