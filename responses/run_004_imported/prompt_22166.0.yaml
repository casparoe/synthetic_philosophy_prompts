answer: |-
  **Setting:** *A quiet corner of a diner, late Tuesday night. Two empty coffee mugs sit between them. Elias is leaning forward, elbows on the table. Mara is leaning back, tracing the rim of her cup.*

  **Elias:** It's not a logical fallacy, Mara. That's the thing everyone misses. When you call out a hypocrite and they say, "You did it too," people treat that like a *tu quoque* error. Like, "Just because I smoke doesn't mean cancer isn't bad." But moral blame isn't a lecture on oncology. It's a social transaction.

  **Mara:** A transaction?

  **Elias:** Yes. Standing. To blame someone is to claim a certain authority. It's to say, "I am up here on the ground of the norm, and you are down there in the violation." If I'm down there with you, I've lost the high ground. I don't have the *standing* to demand accountability. It's like a corrupt judge sentencing a thief. The law is still the law, but the judge has no right to speak it.

  **Mara:** But the thief still goes to jail. That's the problem with your "standing" idea. It prioritizes the purity of the accuser over the reality of the harm. Let's use your cheater example. Brother A cheated for years. Brother B is cheating now. Brother A says, "Don't do that, it's wrong." If Brother B says, "Shut up, you're a hypocrite," and walks away... Brother B is still cheating. He's still hurting his partner. By saying hypocrisy voids the warning, you're effectively silencing the truth because the messenger is dirty.

  **Elias:** I'm not saying the truth is void. I'm saying the *blame* is void. There's a difference between a warning and a condemnation. If Brother A said, "Look, I destroyed my marriage doing this, please don't make my mistake," that's a warning. That's valid. But if he says, "You are a scumbag for doing this," that's blame. That requires moral capital he doesn't have. He's trying to enforce a rule he openly treats as optional.

  **Mara:** Why does his internal rulebook matter? If I'm speeding and you pull me over, does it matter if you sped yesterday?

  **Elias:** If you're a cop, yes! Because you represent the law. In relationships, we represent the moral community. If I lie about my taxes but I catch you cheating on your wife, do I have the standing to call you out?

  **Mara:** Okay, let's hit that. That's the cross-domain thing. You think lying about money costs you the right to call out infidelity?

  **Elias:** I think it costs you the standing to act like *Morality Inc.* If you're shady with money, you've shown you're willing to compromise integrity for personal gain. Cheating is compromising integrity for personal gain. You've demonstrated that you don't actually respect the binding nature of commitments. So when you yell at me about my commitment issues, you're not speaking from principle. You're speaking from mood.

  **Mara:** That feels like guilt by association. Integrity isn't a single currency where if I spend it in one place, I'm bankrupt in another. I can be a tax liar and still believe deeply in monogamy. Maybe I think taxes are theft but cheating is betrayal. If I see you betraying someone, I should be allowed to say "That is betrayal," even if I'm a liar. To say otherwise is to say only sinless people can identify sin.

  **Elias:** No, not sinless. *Repentant.* This is the nuance people miss. It matters if I think I'm a special exception. If I cheated, and I think, "I'm a monster, I broke the rule," I have no standing to blame you. But if I think, "What I did was fine, but *you* shouldn't do it," that's arrogance. That's claiming a right I denied myself.

  **Mara:** Okay, but let's say I own it. I say, "I cheated. I was weak. It was wrong. I am currently trying to be better, but you are doing it right now and it is wrong." Do I have standing then?

  **Elias:** *Maybe.* If you're truly owning it, you're not really blaming me anymore. You're sharing a burden. But the moment you use my bad behavior to make yourself look good—"At least I'm not like *him*"—you're back to hypocrisy. The "You're a hypocrite" accusation works because it exposes that you're using my failure to distract from yours.

  **Mara:** Or, it exposes that you're trying to use my failure to distract from *yours*. Look, Elias, in the real world, "You're a hypocrite" is almost always a shield. It's a way for the person caught doing something bad to avoid accountability. If I catch my politician taking bribes, and he says, "Well, you sped on the way here," I don't think, "Ah, he has no standing." I think, "He's dodging the question." The focus should be on the act, not the actor.

  **Elias:** But relationships aren't policy debates. They're built on trust. If I know you're a hypocrite, I don't trust your judgment. If you tell me "Jump," and I know you wouldn't jump, why should I? When you blame me, you're asking me to submit to your judgment. If your judgment is compromised by your own actions, why should I submit?

  **Mara:** Because the judgment might be right! You're conflating the *source* with the *content*. If a clock is broken but shows the right time twice a day, the time is still right. If a hypocrite says "Cheating is wrong," they are right. By focusing on their hypocrisy, we let the cheater off the hook. We turn the conversation into "Who is the worse person?" instead of "What is the right thing to do?"

  **Elias:** But "Who is the worse person" *is* the conversation in social dynamics! It's about hierarchy. If I allow you to blame me while you're guilty of the same thing, I'm accepting you as my superior. I'm accepting your right to judge me. Calling out hypocrisy is a way of leveling the playing field. It says, "We are both in the mud. You don't get to stand on my back to clean your boots."

  **Mara:** So it's purely power?

  **Elias:** It's about fairness. It is deeply unfair to be held to a standard that the enforcer ignores. It creates resentment. And resentment kills relationships faster than the original bad behavior.

  **Mara:** I get the resentment. I do. But I worry that validating the "hypocrite defense" gives people a get-out-of-jail-free card. It implies that if I can find *one* flaw in you, I don't have to listen to *any* truth from you. It creates a world where everyone is so terrified of being called a hypocrite that they stop calling out bad behavior entirely. Only the saints get to speak. And there are no saints.

  **Elias:** So what's the solution? We just let everyone be messy accusers?

  **Mara:** I think we separate the *claim* from the *credibility*. If you catch me cheating, and you're a cheater, I should say: "You are right that cheating is wrong. I am doing a bad thing. You are also doing a bad thing. We should both stop." That acknowledges the truth *and* the hypocrisy without silencing the truth.

  **Elias:** That's incredibly mature. And incredibly rare.

  **Mara:** Exactly. The "You're a hypocrite" shout is rarely that nuanced. It's usually, "Shut up, you're no better than me."

  **Elias:** Because "You're no better than me" is the point! If we are equal in sin, we are equal in standing. Which means neither of us gets to lord it over the other. Maybe the function of the hypocrisy accusation isn't to say the claim is false. It's to say the *hierarchy* is false.

  **Mara:** So it kills the authority, not the fact.

  **Elias:** Yes. It strips the blame of its punitive power. You can tell me I'm wrong, but you can't punish me for it. You can't look down on me.

  **Mara:** But in practice, Elias, people don't hear "You can't look down on me." They hear "I don't have to change." That's the danger. If I tell my kid, "Don't hit your sister," and I have a temper... if he says "You hit things!" and I say, "Fair point, but hitting is still wrong," that works. If I say, "You're right, I can't tell you that," then I'm a bad parent.

  **Elias:** *Laughs.* Okay, parenting is different. That's stewardship.

  **Mara:** Is it? Or is that just an example where we admit the truth matters more than the standing? Because the kid needs to learn not to hit, regardless of my flaws.

  **Elias:** Maybe. But between peers? Between adults? I stick by the standing theory. If we are equals, and you violate the norm you're enforcing on me, you've broken the social contract of the argument. You're asking me to play by rules you're cheating on.

  **Mara:** So it's a contract. "I will only criticize you if I am perfect."

  **Elias:** No. "I will only criticize you if I am *trying*." If I'm not trying, if I'm comfortable in my hypocrisy, then my criticism is noise. It's performative.

  **Mara:** Okay. I can accept that. If the criticism is performative—if it's just to make *you* look good—then it's worthless. But if the criticism is to protect a victim, or stop harm... then your hypocrisy is irrelevant. If you're a thief, but you see me assaulting someone, you still get to yell "Stop."

  **Elias:** Because assault is a different magnitude?

  **Mara:** Because harm trumps hierarchy.

  **Elias:** *Pauses, thinking.* I can live with that. Hypocrisy kills your standing to judge my *character*. It doesn't kill your standing to point out my *damage*.

  **Mara:** There we go. So if the cheater brother says, "You're a scumbag," the other brother can say, "I'm a scumbag, just like you." But if the cheater brother says, "You're going to lose your wife," that's a fact. And the hypocrisy doesn't change the fact.

  **Elias:** So "You're a hypocrite" is a valid response to judgment, but not to information.

  **Mara:** Exactly. It shuts down the sermon. It shouldn't shut down the conversation.

  **Elias:** *Raises his coffee cup.* I'll drink to that. As long as you promise not to lecture me on caffeine intake.

  **Mara:** *Clinks her mug.* Given how many cups you've had tonight? I've lost the standing.
