      *   *Check:* Did I cover the "secret exception" point? Yes, make sure Elias distinguishes between "repentant sinner" and "unrepentant hypocrite."
      *   *Check:* Did I cover the "different bad behavior" point? Yes, the tax/cheating example.

  5.  **Polishing:**
