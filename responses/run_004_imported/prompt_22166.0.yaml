  *(Self-Correction Note during final polish)*: I need to make sure Elias doesn't just say "it's annoying." He needs to argue that the *act of blaming* itself is corrupted. It's not about the message; it's about the messenger's license to deliver it. Mara needs to argue that the message *is* the priority.

