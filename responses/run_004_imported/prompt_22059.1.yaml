  2.  **Deconstruct the Four Moves:**

      *   **Move 1: Mara's Opening Case (The Standard Coherence Argument).**
          *   *Claim:* Non-EU agents are vulnerable to money pumps/Dutch books. Capable agents will self-correct to avoid exploitation. Therefore, advanced AI will act like EU maximizers. This implies stable, goal-directed behavior (instrumental convergence, etc.).
          *   *Strengths:* Mathematically grounded (VNM theorem), intuitive link between rationality and consistency, standard orthodoxy in econ/AI safety.
