      *   **Structural Realism (ESR - Epistemic Structural Realism):**
          *   Proponent: John Worrall (1989).
          *   Logic: Don't commit to the *nature* of entities (ontology), commit to the *relations/structure* (mathematics/equations).
          *   Claim: Structure is retained even when ontology changes.
      *   **The Test Case: Fresnel to Maxwell:**
          *   Fresnel: Light is vibration in an elastic solid ether.
          *   Maxwell: Light is electromagnetic wave in a field (no mechanical ether needed eventually).
          *   Worrall's Claim: The Fresnel equations survived into Maxwell's theory. The *structure* was right, the *stuff* was wrong.

  3.  **Evaluate the Fresnel-Maxwell Case (The Crux):**
      *   *What survived?* The wave equation, boundary conditions, predictions about diffraction, interference, polarization. The mathematical formalism describing propagation.
      *   *What changed?* The medium. Elastic solid vs. Electromagnetic field. Longitudinal vs. Transverse (Fresnel got transverse right, but for the wrong mechanical reasons). The nature of the "ether" (mechanical substrate vs. field state).
      *   *Critique of Worrall:*
