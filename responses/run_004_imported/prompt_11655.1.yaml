answer: |-
  You are absolutely right to worry about this, and your memory is serving you well: Lewis did indeed call it **"The Big Bad Bug."** It appears in the postscript to his 1980 paper *"A Subjectivist's Guide to Objective Chance."* It is arguably the most famous technical problem in contemporary metaphysics of chance, and it is the perfect storm cloud for a graduate seminar because it pits two very intuitive ideas against each other:

  1.  **Humean Supervenience:** Laws and chances are just summaries of the pattern of events in the world (the "mosaic").
  2.  **The Principal Principle (PP):** Rational credence should align with objective chance.

  The bug shows that if you hold both, you generate a formal contradiction. Below is a breakdown designed for your seminar, moving from the toy model to the contradiction, then the fix, and finally the philosophical cost.

  ---

  ### 1. The Setup: Humean Chance and the Principal Principle

  First, ensure your students have the two commitments clear.

  **Commitment A: The Best System Analysis (BSA)**
  For a Humean like Lewis, there are no necessary connections or propensities. The "objective chance" of an event is determined by the **Best System** of laws. The Best System is the one that best balances:
  *   **Simplicity:** (Short, axiomatic).
  *   **Strength:** (Tells us a lot about the world).
  *   **Fit:** (Matches the actual history of events).

  *Crucial Point:* To determine which system is "Best," you have to look at the **entire history of the world**, past, present, and *future*. A system that fits the past well might be disqualified if the future turns out to be wildly different.

  **Commitment B: The Principal Principle (PP)**
  Let $C$ be a reasonable initial credence function, $A$ be a proposition, $E$ be admissible evidence, and $Ch_t(A) = x$ be the proposition that the objective chance of $A$ at time $t$ is $x$.
  $$C(A \mid E \ \& \ Ch_t(A) = x) = x$$
  *Intuition:* If you know the objective chance is 50%, your credence should be 50% (provided you have no "inadmissible" evidence, like seeing the future).

  ---

  ### 2. The Toy Example: The Undermining Future

  Let's construct the contradiction using a coin.

  **The Scenario:**
  *   We are at time $t$.
  *   The history of coin tosses up to $t$ is a mixed bag of Heads and Tails.
  *   Given this history, the **Best System** ($T_{fair}$) is "The coin is fair." It assigns $Ch(Heads) = 0.5$.
  *   This system wins because it is simple and fits the past history well.

  **The Undermining Future ($F$):**
  *   Consider a specific future sequence $F$: From time $t$ onward, the coin lands **Heads** every single time for a million tosses.
  *   $T_{fair}$ assigns a positive chance to $F$. It's unlikely, but possible. Let's say $Ch_t(F) = \epsilon$ (where $\epsilon > 0$).

  **The Conflict:**
  Here is where Humeanism bites. Remember that which system is "Best" depends on the *total* history.
  *   If $F$ actually occurs, the *total* history (past + the million Heads) would be best summarized by a different system, $T_{heads}$ ("The coin always lands Heads").
  *   $T_{heads}$ is slightly less simple than $T_{fair}$, but its **fit** with the total history (including $F$) would be perfect, whereas $T_{fair}$'s fit would be terrible.
  *   Therefore, if $F$ occurs, $T_{fair}$ is **not** the Best System.
  *   Therefore, if $F$ occurs, it is **false** that the objective chance (defined by the Best System) is 0.5.

  **The Contradiction:**
  Now, apply the Principal Principle naively.

  1.  **PP says:** $C(F \mid Ch_t(F) = \epsilon) = \epsilon$.
      *(If the chance of F is $\epsilon$, your credence in F should be $\epsilon$.)*
  2.  **Humeanism says:** The proposition "$Ch_t(F) = \epsilon$" entails that $T_{fair}$ is the Best System. But if $F$ occurs, $T_{fair}$ is *not* the Best System.
      *(So, $F$ entails $\neg [Ch_t(F) = \epsilon]$.)*
  3.  **Logic says:** If $F$ entails the negation of the conditioning proposition, the conditional credence must be 0.
      $$C(F \mid Ch_t(F) = \epsilon) = 0$$
  4.  **Result:** $\epsilon = 0$.
      *(But we assumed $\epsilon > 0$. Contradiction.)*

  The proposition "$Ch_t(F) = \epsilon$" is self-undermining. It asserts a chance for a future that, if it happened, would prove the chance assertion false.

  ---

  ### 3. The Fix: The Revised Principal Principle

  Lewis's solution (elaborated in the postscript and by subsequent commentators like Ned Hall and Michael Thau) is to admit that the original PP was too simple. The problem lies in the conditioning proposition: **"$Ch_t(A) = x$".**

  Under Humeanism, this proposition is **inadmissible**.
  Why? Because "The chance is $x$" isn't just a number; it's a claim that a specific theory ($T_{fair}$) is the *Best System*. As we saw, claiming $T_{fair}$ is the Best System entails facts about the future (specifically, that an undermining future like $F$ will *not* occur). Admissible evidence cannot rule out futures *a priori*; it can only rule them out via chance.

  **The Solution:**
  We must replace the chance proposition with the **Theory of Chance** itself, treated as a hypothesis.

  **The Revised Principal Principle (RPP):**
  $$C(A \mid T \ \& \ H_t) = Ch_T(A)$$

  *   $T$: A candidate theory of chance (e.g., "The Fair Coin Theory").
  *   $H_t$: The history of the world up to time $t$.
  *   $Ch_T(A)$: The chance value $A$ gets *according to theory T*.

  **Why this works:**
  When we condition on $T$ (the theory), we are not conditioning on "$T$ is the true Best System." We are conditioning on "Assume $T$ is the theory governing chances."
  *   Does $T \ \& \ H_t$ entail $\neg F$? **No.**
  *   $T$ says: "Given history $H_t$, the chance of $F$ is $\epsilon$."
  *   $T$ allows for the possibility that $F$ occurs. If $F$ *does* occur, $T$ simply turns out not to have been the true Best System.
  *   By conditioning on the theory $T$ rather than the truth of "$T$ is the Best System," we break the entailment that led to the contradiction. We can now consistently say: "Given the Fair Coin Theory, the chance of the Undermining Future is $\epsilon$, so my credence should be $\epsilon$," without implying that the Undermining Future is impossible.

  ---

  ### 4. Critical Evaluation: Principled or Patch?

  This is where your seminar will get lively. Is the RPP a vindication of Humeanism, or a confession of defeat?

  **Argument for "Principled Fix":**
  *   **Epistemic Humility:** The fix correctly identifies that we never have direct access to "The Chance." We only have access to *theories* about chance. We should align our credences with our best theory, acknowledging the theory might be wrong.
  *   **Preserves the Link:** It saves the core intuition that chance guides credence. We still set our credences to the values output by the best system; we just clarify *how* we condition on that system.
  *   **Admissibility Criterion:** It refines our understanding of "admissible evidence." It teaches us that any evidence that entails constraints on the future (beyond chance) is inadmissible. This is a robust metaphysical lesson.

  **Argument for "Technical Patch":**
  *   **Loss of Directness:** The original PP was powerful because it linked credence directly to *objective chance*. The RPP links credence to *theories of chance*. This subtly shifts chance from a metaphysical feature of the world to a feature of our description of the world.
  *   **The "True Theory" Problem:** If we can't condition on "$Ch(A)=x$" because it entails the future, can we ever know the chances? We are left conditioning on hypotheses. Some argue this makes Humean chance epistemically inaccessible in a way that non-Humean (propensity) chance is not.
  *   **Metaphysical Cost:** It highlights that Humean chance is not a "beable" (something that exists locally). It is a global summary. The fact that a future event can change the *current* chance (by changing which system is best) is deeply counterintuitive. The fix papers over this weirdness by adjusting the epistemology, but the metaphysics remains "spooky."

  **Verdict for the Seminar:**
  It is a **principled technical patch**. It is principled because it correctly diagnoses the category error (treating a theoretical hypothesis as a categorical fact about the present). However, it is a patch because it admits that the original, intuitive formulation of the PP is incompatible with Humean Supervenience.

  If your students press you, the honest answer is: **Lewis saved the consistency of his system, but he weakened the metaphysical status of chance.** He showed that if you want Humean Supervenience, you have to accept that "The Chance" is not a simple property you can point to at time $t$; it is a relational property involving the entire timeline. The RPP is the rule for navigating that reality without contradicting yourself.

  ### Suggested Discussion Question for Students
  *"If the Revised Principal Principle requires us to condition on a Theory of Chance rather than the Chance itself, does this imply that Humean Chance is merely epistemic (about our best description) rather than ontic (about the world)? Or can we maintain it is objective even if we can only access it via theory?"*

  This usually splits the room between the Humeans and the Propensity theorists nicely.
