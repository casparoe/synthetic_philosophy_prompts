      *   **Observation:** They notice rationalist communities (who usually endorse Bayesian reasoning) still talk about "information hazards" (infohazards) as something an *individual* should avoid for their own sake (e.g., genetic testing for untreatable diseases).
      *   **Conflict:** Good's Theorem says free evidence *always* has non-negative expected value. Infohazards suggest some information has negative value.
