answer: |-
  This is a sharp observation. You have correctly identified a tension that sits right at the heart of decision theory. If I.J. Good's Theorem is true, why does the LessWrong/EA/rationalist community spend so much time worrying about "information hazards" (infohazards) for the *knower*?

  The short answer is: **Good's Theorem relies on assumptions that human beings do not satisfy.**

  Rationalists generally accept Good's Theorem as mathematically sound *for an ideal Bayesian agent*. However, they take infohazards seriously precisely because they recognize that humans are **bounded agents** with **utility functions over belief states**, not just world states.

  Here is the breakdown of why Good's Theorem doesn't rule out personal infohazards.

  ### 1. The Assumption of "Utility over World-States"
  Good's Theorem assumes that your utility function depends only on the **state of the world** and the **action you take**. It assumes you don't care about the information *itself*, only what you can do with it.

  *   **Ideal Agent:** $U = f(\text{World State}, \text{Action})$
  *   **Human Agent:** $U = f(\text{World State}, \text{Action}, \text{Belief State})$

  For a human, holding a specific belief can directly cause suffering or joy, independent of any action taken.
  *   **Example:** Genetic testing for Huntington's disease (untreatable).
      *   **Good's Theorem View:** If you test positive, you take the same actions as before (since it's untreatable). If you test negative, you feel relieved. Expected value $\geq 0$.
      *   **Human Reality:** If you test positive, you suffer years of anticipatory grief and anxiety. This is a direct utility loss derived from the *belief state*. If the information doesn't change your medical actions, but it destroys your peace of mind, the expected utility of acquiring that information is negative.

  Rationalists model this by acknowledging that "peace of mind" is a terminal value. Destroying it with useless information is a net loss.

  ### 2. The Assumption of Perfect Rationality (Updating)
  Good's Theorem assumes the agent is a perfect Bayesian updater. They will weigh the new evidence exactly according to its likelihood ratio and combine it with their priors without error.

  Humans are not perfect Bayesians. We are subject to:
  *   **Availability Heuristics:** Vivid, scary information (e.g., "You have a 5% risk of sudden cardiac death") looms larger in our decision-making than the statistical reality warrants.
  *   **Motivated Reasoning:** Once we know something, we may struggle to act objectively.
  *   **Cognitive Load:** Processing complex information takes energy. If the information is noisy or complex, a bounded agent might update *incorrectly*, leading to worse decisions than if they had remained ignorant.

  If acquiring information leads to a systematic bias in your future decisions (because you are human, not a god), the expected value of that information can be negative.

  ### 3. The Assumption of "Free" Information
  Good's Theorem specifies **free** evidence. It assumes there is no cost to acquiring or processing the information.

  In reality, attention is a finite resource.
  *   **Opportunity Cost:** Time spent worrying about a piece of information is time not spent working, sleeping, or socializing.
  *   **Processing Cost:** If the information is complex, the cognitive effort required to integrate it might outweigh the marginal improvement in decision quality.

  For a rationalist with limited "compute" (brainpower), filtering out low-value information is an optimization strategy. Deliberate ignorance is a resource allocation decision.

  ### 4. Precommitment and "Spoiler Effects"
  There are scenarios where knowing the outcome ruins the value of the process, and you cannot "act like you never saw it."

  *   **Example:** Watching a mystery movie.
      *   If you know the killer (information), you cannot "choose" to be surprised. The utility of watching the movie is contingent on *not* knowing the ending.
      *   Good's Theorem says you can always ignore the info. But you cannot ignore the fact that you *have* the info. You cannot voluntarily reset your posterior to your prior.

  This is a violation of the "irreversibility of belief." Once you know the spoiler, you cannot act as if you don't. If the utility of the experience relies on ignorance, the information has negative value.

  ### 5. Causal and Logical Hazards
  Some information changes the world *because* you know it.
  *   **Self-Fulfilling Prophecies:** Knowing a bank is insolvent causes you to withdraw money, which makes the bank insolvent.
  *   **Newcomb-like Problems:** In certain decision theory problems (like Parfit's Hitchhiker or Newcomb's Problem), being the *type of agent* who doesn't look at certain information can be advantageous because it signals trustworthiness or precommitment to a cooperative strategy.

  If an adversary knows you will look at all available information, they can manipulate you. Being the kind of agent who *ignores* certain classes of information can be a strategic shield.

  ### Why Rationalists Still Talk About It
  You asked why the "same crowd" (rationalists) believes both. It's because they distinguish between **Ideal Decision Theory** and **Applied Rationality**.

  1.  **Ideal Theory:** Good's Theorem holds for AIXI or a perfect Bayesian god. In that realm, infohazards (for the self) don't exist.
  2.  **Applied Rationality:** Humans are leaky, emotional, bounded hardware running approximate algorithms. For *us*, infohazards are very real.

  Nick Bostrom (who coined the term "information hazard") explicitly categorized infohazards. Only one category is "data hazard for others." Others include:
  *   **Direct Harm:** Information that causes distress to the knower (e.g., knowing the exact date of your death).
  *   **Distraction:** Information that draws attention away from more important tasks.

  ### Summary
  Good's Theorem proves that information has non-negative value **if**:
  1.  You don't care about your beliefs, only outcomes.
  2.  You update perfectly.
  3.  Information is free.
  4.  You can ignore the information without psychological cost.

  Since humans violate all four of these conditions, rationalists conclude that **deliberate ignorance can be instrumentally rational for humans**, even if it isn't for ideal agents. It isn't a "comforting story"; it's a hack to compensate for the fact that we aren't perfect Bayesians.

  So, you are right that the theorem settles it for *ideal agents*. But the rationalist community takes infohazards seriously precisely because they are obsessed with the gap between ideal agents and actual humans.
