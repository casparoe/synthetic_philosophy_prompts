answer: |-
  You have identified the central methodological problem in the contemporary epistemology of knowledge attributions, often called the **"Conflation Objection."** You are absolutely correct: in the standard Bank Cases (DeRose 1992, Stanley 2005), the shift in the *subject's* practical stakes is almost always communicated to the *attributor* (the philosopher or reader evaluating the case). This communication raises the salience of error possibilities for the attributor, thereby shifting the attributor's conversational context.

  Because both variables shift simultaneously, the standard case is theoretically ambiguous. It cannot distinguish whether the change in the truth value of "S knows" is driven by the subject's practical environment (Pragmatic Encroachment/SSI) or the attributor's conversational standards (Contextualism).

  To isolate the variables, we need a **"Crossed Wires" scenario** where the subject's stakes and the attributor's standards move in opposite directions (or one moves while the other stays fixed). The most famous version of this is the **"Ignorant Attributor" case**.

  ### The Isolation Scenario: "The Ignorant Friend"

  **The Setup:**
  *   **Subject (Hannah):** Hannah has a check that must clear by Monday. If it does not clear, she will default on a mortgage and lose her house. This is a **High-Stakes** situation for Hannah. She has evidence that the bank was open on Saturday two weeks ago, but she has not checked this week's hours.
  *   **Attributor (Keith):** Keith is Hannah's friend. He is speaking to a third party, Sarah. Keith **does not know** about the mortgage or the urgency. He believes Hannah is simply depositing pocket money for a weekend dinner. For Keith, the error possibilities are not salient; he is in a **Low-Standards** conversational context.
  *   **The Attribution:** Keith says to Sarah: *"Hannah knows the bank will be open tomorrow."*

  **The Variables:**
  1.  **Subject's Practical Stakes:** High (Hannah loses her house).
  2.  **Attributor's Conversational Standards:** Low (Keith thinks it's just pocket money; error is not salient).

  ### The Divergent Verdicts

  Here is how the two theories evaluate the truth of Keith's utterance in this specific scenario:

  #### 1. Pragmatic Encroachment (Subject-Sensitive Invariantism)
  *   **Verdict:** **FALSE**
  *   **Reasoning:** For the encroachment theorist (e.g., Stanley, Hawthorne), the truth conditions of knowledge depend on the *subject's* practical environment. Because Hannah has a lot riding on the proposition, the epistemic bar for her to "know" is raised. Her evidence (past experience) is insufficient for *her* high-stakes situation. Therefore, the proposition "Hannah knows" is false, regardless of how casually Keith says it. Keith is mistaken, even in his own low-stakes conversation.

  #### 2. Epistemic Contextualism
  *   **Verdict:** **TRUE**
  *   **Reasoning:** For the contextualist (e.g., DeRose, Lewis), the truth conditions of knowledge depend on the *attributor's* conversational context. Keith is speaking in a low-standards context (he is unaware of the high stakes, so error possibilities are not salient to him). In Keith's context, Hannah's evidence (past experience) is sufficient to meet the epistemic standard. Therefore, Keith's utterance is true *as uttered in his context*, even though Hannah is in a high-stakes situation.

  ***

  ### The Reverse Case: "The Paranoid Attributor"
  To complete the minimal pair, you can flip the variables to ensure the isolation holds symmetrically.

  **The Setup:**
  *   **Subject (Hannah):** Low Stakes. She is depositing beer money. If she's wrong, she just walks home.
  *   **Attributor (Keith):** High Standards. Keith is teaching an epistemology class and is currently discussing skeptical scenarios about bank hours and forgery. Error possibilities are highly salient to him, even though Hannah's stakes are low.
  *   **The Attribution:** Keith says (in class): *"Hannah knows the bank is open."*

  **The Verdicts:**
  *   **Pragmatic Encroachment:** **TRUE**. Hannah's stakes are low; her evidence is sufficient for her situation. The fact that Keith is being paranoid doesn't change Hannah's epistemic position.
  *   **Contextualism:** **FALSE**. Keith is speaking in a high-standards context. In this context, "knows" requires ruling out the skeptical possibilities Hannah hasn't ruled out. Therefore, Keith's utterance is false in his own mouth.

  ### Why the Standard Bank Case Fails Isolation

  In the standard Bank Case (e.g., Stanley's version), the narrative is presented to *us* (the readers/attributors) in two versions: Low Stakes and High Stakes.

  1.  **In the Low-Stakes Version:** Hannah has low stakes. We (the attributors) are told she has low stakes. We adopt a relaxed standard. We say "She knows."
  2.  **In the High-Stakes Version:** Hannah has high stakes. We (the attributors) are told she has high stakes. **Crucially, by telling us about the high stakes, the narrative makes the possibility of error salient to us.**

  Because the *description of the subject's stakes* functions as a *context-shifting mechanism for the attributor*, we cannot tell if our intuition that "She doesn't know" in the high-stakes version is driven by:
  *   **(A)** The fact that Hannah's practical environment has changed (Encroachment).
  *   **(B)** The fact that *our* conversational context has shifted to a higher standard because we are now thinking about the consequences of error (Contextualism).

  The "Ignorant Friend" scenario breaks this link. It forces the attributor to remain in a low-standards context *despite* the subject being in a high-stakes environment. This forces the theories to reveal their underlying structural differences: Contextualism looks outward to the speaker's conversation; Encroachment looks inward to the subject's action.
