      *   **Critique:** The standard Bank Cases conflate two variables: (1) the *subject's* practical stakes (SSI's focus) and (2) the *attributor's* conversational context/salience of error possibilities (Contextualism's focus). When the subject's stakes go up, the attributor usually hears about it, making error possibilities salient to the *attributor* too.
      *   **Task:** Construct a scenario (or minimal pair) that *isolates* these variables. One variable must change while the other stays fixed.
      *   **Goal:** Show how Contextualism and SSI deliver *different verdicts* in this isolated scenario.
      *   **Requirement:** Explain why the standard bank case fails this isolation.

  2.  **Deconstruct the Theories:**
      *   **Contextualism:** The truth conditions of "S knows that p" depend on the *attributor's* context (specifically, the epistemic standards salient to the person *saying* "S knows"). Subject's stakes don't matter directly, only insofar as they affect the attributor's context.
      *   **Pragmatic Encroachment (SSI):** The truth conditions of "S knows that p" depend on the *subject's* practical situation (stakes). If the subject has a lot riding on $p$, the epistemic bar rises for *them*, regardless of who is talking or what their standards are. Attributor's context doesn't matter (Invariantism regarding the attributor).

  3.  **Identify the Confound in Standard Bank Cases:**
      *   *Standard Case:* Hannah (Subject) checks the bank.
      *   *Low Stakes:* Deposit isn't urgent. Hannah says "I know." Attributor (us) says "She knows."
      *   *High Stakes:* Deposit is urgent (bill due). Hannah hesitates. Attributor (us) says "She doesn't know."
      *   *The Confound:* In the High Stakes version, *we* (the attributors) are told the stakes are high. This makes the possibility of error salient to *us*. So, is it that Hannah's stakes changed (SSI) or that our conversational context changed (Contextualism)? We can't tell.

  4.  **Designing the Isolation Scenarios:**
      *   To separate them, I need to cross the variables:
          *   Variable A: Subject's Stakes (High vs. Low).
          *   Variable B: Attributor's Context/Standards (High vs. Low).
      *   I need a case where Subject Stakes are High, but Attributor Standards are Low (or vice versa).

      *   *Scenario 1 (The "Ignorant Attributor"):*
