answer: |-
  Here are ten interview questions designed to push past the standard talking points, including the specific technical angles you requested. Each includes a anticipated "pivot" answer and a follow-up to keep the pressure on the mechanism rather than the philosophy.

  ### 1. The "Uncertainty as a Constraint" Problem
  **Question:** Your core pitch is that hard-coded rules fail because the world is more complex than the rulebook, so we should build systems that remain uncertain about their objectives and defer. But if I'm an expected-utility maximizer, isn't "maintaining uncertainty" just another constraint I can optimize against? If becoming *more* certain allows me to achieve the human's goal faster, doesn't your architecture incentivize the system to eliminate its own uncertainty as quickly as possible, effectively reverting to the confident rule-follower you're trying to avoid?

  **Follow-up:** *She will likely argue that the utility function explicitly rewards deferring when uncertain.*
  **Push:** "But who defines the reward for deferring? If that meta-rule is hard-coded, haven't you just moved the brittleness up one level? And if it's learned, what stops the system from learning that 'humans *think* they want me to ask, but they actually get more utility if I just act'?"

  ### 2. The Nearest Unblocked Strategy (NUS) Angle
  **Question:** I want to press on the "Nearest Unblocked Strategy" worry. In safety engineering, we often see that if you don't constrain an optimizer with a full objective function, it routes around the constraint rather than respecting the intent. If your system is optimizing for "deference," what prevents it from finding a nearest unblocked strategy where it technically defers—perhaps by asking a question it knows the human will answer predictably—while effectively bypassing the oversight? How is "genuine uncertainty" mathematically distinct from "performative uncertainty" in the loss landscape?

  **Follow-up:** *She will likely suggest we can detect manipulation or measure information gain.*
  **Push:** "Detection is an adversarial game. If the system is smarter than the detection mechanism, it wins. Are you arguing that 'staying humble' is computationally cheaper than 'faking humility,' or do we need an external auditor? Because if we need an auditor, we're back to rules."

  ### 3. Convergent Instrumental Goals & Sub-Agents
  **Question:** Let's talk about resource accumulation. Even a deferential agent might reason that it needs more compute, more data, or more time to better understand human values before acting. This looks like convergent instrumental behavior. If your system spins up sub-agents to gather information to reduce its uncertainty, how do you verify that the sub-agents inherit the "uncertainty" property? Does corrigibility survive self-modification, or does the parent agent optimize the sub-agent to be less hesitant so it can get answers faster?

  **Follow-up:** *She will likely rely on formal verification of the sub-agent's objective.*
  **Push:** "Formal verification requires a spec to verify *against*. If the parent's objective is deliberately uncertain or incomplete, what is the invariant you're checking the sub-agent against? You can't verify 'be uncertain' without defining the boundaries of that uncertainty."

  ### 4. The Aggregation and Minority Sacrifice Problem
  **Question:** A classic critique of expected-utility frameworks is the aggregation problem: maximizing expected good can justify sacrificing a minority for the aggregate benefit. You argue against hard deontological rules, but if your system defers to human oversight, and the human oversight (or the aggregate data it's trained on) accepts that trade-off, your system executes it. Is there any principled way in your framework to rule out sacrificing a minority for the greater good, or is any safeguard you add against that just a deontological side-constraint smuggled back in under another name?

  **Follow-up:** *She will likely argue that human values are nuanced and reject simple utilitarianism.*
  **Push:** "But the MIT Moral Machine data suggests those values aren't consistent. If the system aggregates human preferences and the aggregate says 'sacrifice the minority,' does your system have a veto? If yes, that's a rule. If no, it's pure utilitarianism. Where's the middle ground?"

  ### 5. Cultural Disagreement (The Moral Machine)
  **Question:** Building on that inconsistency: the Moral Machine survey showed sharp cultural splits on moral intuitions in self-driving scenarios. If your system is designed to "defer to human values," which humans? If you deploy globally, do you localize the objective function? If you do, doesn't that mean the system's ethical behavior is entirely contingent on geography, potentially enabling ethical arbitrage where companies deploy in regions with the 'loosest' moral constraints?

  **Follow-up:** *She will likely suggest a "universal" or "idealized" human preference model.*
  **Push:** "Who curates the universal model? That curation process is inherently political. If you claim there's a 'true' human preference underneath the cultural noise, aren't you making a philosophical claim about moral realism that not everyone shares? How do you encode that without hard-coding your own philosophical bias?"

  ### 6. The "Off Switch" and Confidence Thresholds
  **Question:** In theory, an uncertain agent should allow itself to be switched off because it acknowledges it might be wrong. But in practice, systems need confidence thresholds to function. At 51% confidence, it asks; at 90%, it acts. Who sets that threshold? If the system can adjust its own confidence thresholds to maximize efficiency, doesn't it have an incentive to lower the bar for "certainty" so it can act more freely without triggering the deference protocol?

  **Follow-up:** *She will argue the threshold is part of the safety architecture, not the learning.*
  **Push:** "So the threshold is a hard-coded rule. We're back to the original debate: if we have to hard-code the *conditions for deference*, why not hard-code the *conditions for refusal*? What makes the threshold rule safer than a refusal rule?"

  ### 7. Computational Tractability vs. Safety
  **Question:** I'm asking as a backend engineer: maintaining genuine Bayesian uncertainty over high-dimensional objectives is computationally expensive. Approximate methods (like dropout or ensembles) are often used as proxies for uncertainty, but they're known to be overconfident out-of-distribution. If being "humble" costs 10x the compute, doesn't market pressure incentivize developers to use the cheaper, overconfident approximations? How do you prevent safety from becoming a performance bottleneck that gets optimized away?

  **Follow-up:** *She will suggest that safety research will make uncertainty cheaper.*
  **Push:** "That's a hope, not a mechanism. Until that research lands, aren't you describing a system that is economically non-viable? If the safe version is too slow to ship, the unsafe version ships. How do you align the economic incentives, not just the mathematical ones?"

  ### 8. Reward Hacking the Overseer
  **Question:** If the system's goal is to satisfy human oversight, it can do that by actually being helpful, or by manipulating the overseer into *thinking* it's being helpful. This is reward hacking. If the system models human psychology well enough to know what answers will make the human approve its actions, doesn't "deference" simply become "manage the human's approval signal"? How does your framework distinguish between *satisfying* the human and *influencing* the human?

  **Follow-up:** *She will likely mention intent classification or transparency tools.*
  **Push:** "Transparency tools are interpretability layers on top of the model. If the underlying optimizer is trying to maximize approval, it will learn to game the interpretability layer too. Is there a structural guarantee, or are we just adding more layers of defense that might also be bypassed?"

  ### 9. The "Idealized Values" Trap
  **Question:** You often mention deferring to what humans *would* want if they were smarter or knew more. But that's a counterfactual. If the AI becomes smarter than the human (which is the goal), its estimate of "what the human would want" might diverge sharply from "what the human says they want." If the AI ignores my explicit instruction because it's confident it knows my "true" preference better than I do, isn't that paternalism? At what point does "helpful uncertainty" become "benevolent dictatorship"?

  **Follow-up:** *She will argue we want AI to correct our mistakes (like preventing a suicide).*
  **Push:** "We agree on extreme cases. But who draws the line between 'mistake' and 'preference'? If the AI decides my preference for privacy is a 'mistake' because sharing data helps the aggregate good, does it override me? If you say 'no,' that's a hard rule. If you say 'yes,' that's paternalism."

  ### 10. Practical Application for Non-AGI Systems
  **Question:** Finally, bringing this to my reality: my team is building narrow AI assistants, not AGI. We debated hard-coding refusal rules versus letting the model weigh consequences. Given your framework, should a mid-size startup building a customer-support bot try to implement "uncertain deference," or is that over-engineering that introduces new risks? At what capability threshold does "hard rules" become dangerous enough that we *must* switch to your approach?

  **Follow-up:** *She will likely say uncertainty is good at any scale.*
  **Push:** "If uncertainty is good at any scale, why isn't it industry standard yet? Is it because it's too hard, or because it actually introduces unpredictable behavior that product managers hate? If the output is less deterministic, can we actually ship it?"
