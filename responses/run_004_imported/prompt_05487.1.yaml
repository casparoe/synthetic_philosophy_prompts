          *   *Refinement:* For a mid-size startup without AGI, is "uncertainty" actually safer than a hard "no" on sensitive topics?
          *   *Follow-up:* She'll say "it depends on capability." Counter: "Capability scales fast. When do you switch strategies?"

      *   *Requirement 10: The "End Game" of Uncertainty.*
