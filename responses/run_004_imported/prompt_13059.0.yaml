answer: |-
  This is a classic and deeply thorny issue in formal epistemology. You and your friend have put your finger on the precise nerve that makes the diachronic Dutch Book Argument (DBA) for conditionalization so much more controversial than its synchronic cousin. Your friend is relying on a strategy made famous by philosophers like David Christensen: shifting the ground from *pragmatics* (actual loss) to *epistemics* (incoherence of valuations).

  However, your intuition is correct: the depragmatizing move does not successfully bridge the gap created by the foreknowledge problem. In fact, by removing the pragmatic stake, it exposes the diachronic DBA to an even more fatal objection regarding the nature of rational agency.

  Here is the strongest case that the depragmatizing defense fails, pressing your disanalogy about the "single standpoint" to its breaking point.

  ### 1. The "Splicing" Objection: Who Endorses the Package?

  The core of your objection is that synchronic incoherence involves a single standpoint, whereas diachronic incoherence requires splicing two distinct time-slices. The depragmatizing move tries to hand-wave this by saying, "It's the same agent, just at different times." But this begs the question against the foreknowledge problem.

  In the synchronic case, the defect is **reflectively accessible**. If I believe $P$, believe $P \to Q$, and disbelieve $Q$, I can, in principle, survey all three attitudes simultaneously and feel the tension. The irrationality consists in the fact that *I* currently hold a set of attitudes that cannot jointly be true. The "package" of bets is something *I* would accept as fair right now.

  In the diachronic case, even depragmatized, the "package" of bets is **never endorsed by any single agent-state**.
  *   At $t_1$, I endorse the initial bets based on $P$. I do *not* endorse the $t_2$ bets, because I do not yet have evidence $E$, and thus I do not yet have credence $q$.
  *   At $t_2$, I endorse the new bets based on $q$. But I no longer endorse the $t_1$ bets as *current* fair prices; I recognize them as past commitments made under less informed conditions.

  The "inconsistency" exists only from the perspective of a **God's-eye observer** (the philosopher or bookie) who can see $t_1$ and $t_2$ simultaneously. But rationality is a first-personal norm. It governs how *I* should manage my beliefs. If there is no moment in time where *I* occupy a standpoint from which the conflicting valuations are simultaneously present as *current* commitments, then the "inconsistency" is not a defect in *my* rationality; it is merely a difference in my states observed from outside.

  By depragmatizing, your friend removes the money, but they leave us with a "defect" that the agent can never internally detect or rectify as a whole. A norm that cannot be surveyed by the agent it governs is not a norm of rationality; it is a norm of engineering imposed from the outside.

  ### 2. The Indexicality of "Fair Price"

  The depragmatizing move relies on the idea that a "fair price" is a stable property of a proposition that can be compared across time. But this ignores the essential indexicality of credence.

  A fair price is not just a function of the proposition $H$; it is a function of the proposition *relative to an information state*.
  *   At $t_1$, the fair price is $P(H | E)$. This is fair *given what I know now*.
  *   At $t_2$, the fair price is $q$. This is fair *given what I know then*.

  To say these are "inconsistent" is to assume that fair prices *ought* to remain stable across information changes unless governed by Conditionalization. But that is precisely what is being argued for! You cannot use the comparison of prices to prove Conditionalization without already assuming that prices *should* align in that specific way.

  In the synchronic case, the information state is held constant. That is why $P(A)$ and $P(B)$ can be logically inconsistent. In the diachronic case, the information state changes. The foreknowledge problem highlights this: for the bookie to construct the book at $t_1$, she must treat my future $t_2$ credence $q$ as a fixed function of $E$ knowable at $t_1$.

  If we depragmatize, we still retain this structural requirement: we must treat $t_2$-me as a logical extension of $t_1$-me rather than a new information state. But if learning is genuine (i.e., if $E$ provides new content not logically contained in $t_1$), then $t_2$-me is epistemically distinct. The "inconsistency" is just the difference between ignorance and knowledge. Calling it "incoherence" smuggles in the conclusion that the only legitimate response to new evidence is Conditionalization, without justifying why other updates constitute a *logical* flaw rather than just a *different* perspective.

  ### 3. The Foreknowledge Problem Returns as a Normative Problem

  Your friend argues that foreknowledge doesn't matter because the argument isn't about actual exploitation. But this misses why foreknowledge matters normatively.

  For a Dutch Book to demonstrate irrationality, the strategy leading to the loss (or inconsistency) must be **avoidable by the agent**.
  *   In the synchronic case, I can avoid the book by adjusting my credences *now*.
  *   In the diachronic case, to avoid the "inconsistent package," I must ensure at $t_1$ that my $t_2$ credences will match $P(H|E)$.

  This requires me to have **foreknowledge of my own future doxastic reactions**. I must know at $t_1$ exactly what credence I will adopt at $t_2$. But if I already know what credence I will adopt upon learning $E$, have I really learned anything? Or am I just mechanically executing a pre-programmed rule?

  If the depragmatizing move says, "It doesn't matter if a bookie knows, it matters that *you* are inconsistent," the question becomes: **When are you inconsistent?**
  *   Are you inconsistent at $t_1$? No, because at $t_1$ you haven't violated anything yet. You only have a plan.
  *   Are you inconsistent at $t_2$? No, because at $t_2$ your credence $q$ is perfectly coherent with your new evidence $E$.
  *   Are you inconsistent *across* time? Only if "you" are a temporally extended entity that can be judged as a whole.

  But if "you" are a temporally extended entity, you need access to the whole timeline to be subject to the norm. Since you (the agent) never occupy the whole timeline simultaneously, you can never be in a position to satisfy the norm of "diachronic coherence" in the same way you satisfy synchronic coherence.

  The foreknowledge problem thus transforms from an epistemic limitation (the bookie can't know $q$) to a **constitutive limitation** (the agent can't occupy the standpoint required for the inconsistency to exist). The depragmatizing move tries to hide this by talking about "prices," but the structural requirement remains: the argument only works if $t_1$ and $t_2$ are treated as a single logical space. They are not. They are separated by the flow of information.

  ### 4. The "Policy" vs. "State" Distinction

  Finally, the depragmatizing defense fails because it conflates a **state** of incoherence with a **violation of policy**.

  Synchronic Dutch Books show that your *state* is incoherent. You are currently holding contradictory attitudes.
  Diachronic Dutch Books show that your *policy* for changing states violates a constraint.

  But a violation of a policy is not the same as a state of incoherence. I can have a policy of updating by a rule other than Conditionalization (e.g., Jeffrey Conditionalization, or even a heuristic rule). At every moment $t$, my credences are synchronically coherent. The "defect" only appears when an external observer compares $t_1$ to $t_2$.

  If the defect is merely that my policy doesn't match the philosopher's preferred rule, that is not a demonstration of *irrationality* in the strong sense implied by the Dutch Book tradition. It is merely a demonstration of *deviance*. To call it "incoherence" is to assert that there is only one rational policy for updating. The DBA was supposed to *prove* that, not assume it by defining "coherence" in a way that requires a single standpoint that the agent never occupies.

  ### Conclusion: The Disanalogy Holds

  Your friend's depragmatizing move attempts to save the DBA by saying, "We aren't talking about money, we are talking about consistency." But consistency is a logical relation between propositions or attitudes held **together**.

  Because the diachronic case splices two numerically distinct time-slices that never coexist to jointly endorse the "package," the inconsistency is not internal to the agent's perspective. It is external to the agent, visible only to a theorist who stands outside of time.

  Therefore, the foreknowledge problem is not just a practical hurdle for a bookie; it is a symptom of a deeper conceptual flaw. It reveals that the diachronic DBA requires the agent to be something they are not: a timeless evaluator of their own temporal trajectory. Since the agent cannot occupy that standpoint, the "inconsistency" lacks the normative force to count as irrationality. The depragmatizing move saves the math, but it kills the argument's claim to govern rational agency. You were right to stay unconvinced.
