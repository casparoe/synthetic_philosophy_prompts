answer: |-
  **Setting:** *A slightly too-warm coffee shop down the street from the philosophy building. It's 4:30 PM on a Tuesday. Empty mugs and a spread of handouts covered in logical notation sit between **Alex** (pro-truth-conditional/combinatorial externalism) and **Jamie** (pro-conventional implicature/expressive content).*

  **Alex:** I'm just saying, your intuition pumps are leaking. You keep pointing at the *feel* of the sentence, but you're ignoring the logic.

  **Jamie:** The *feel* is the data, Alex. In semantics of slurs, the affective impact *is* the semantic value we're trying to capture. If your theory says a sentence is true but the speakers feel assaulted, your theory is wrong.

  **Alex:** No, my theory says the sentence is *false*. That's the point of the Hom-style view. Take the test sentence we argued about in the group: "Sam is not a chink." On your view, the derogatory content projects out of the negation. So even though I'm denying the predicate, I'm still expressing the negative attitude toward Sam's ancestry.

  **Jamie:** Exactly. Say it. "Sam is not a chink." Did you feel that? You just invoked the slur. You just signaled that there's this category of people who *ought* to be discriminated against, and you're placing Sam outside it. But the hierarchy remains intact. The derogatory content survives the negation. That's classic projection behavior. It behaves like a conventional implicature, not at-issue content. If it were at-issue, the negation should target it and defuse it.

  **Alex:** But that's conflating *using* the word with the *truth conditions* of the proposition. Look, on combinatorial externalism, the slur denotes a complex, socially constructed property. Let's call it *C*. *C* includes something like "ought to be subjected to discriminatory practices because of East Asian ancestry." Now, since there is no such moral property in reality, *C* is empty. So "Sam is a chink" is false. Consequently, "Sam is not a chink" is true.

  **Jamie:** And yet, if you stand on a soapbox and shout "Sam is not a chink!" to a crowd, you're not going to be applauded for your anti-racism. You're going to be kicked out of the venue. Why? Because the slur did its work. The expressive dimension fired. If the derogatory content were truly at-issue, trapped inside the scope of the negation, the audience should hear you *rejecting* the racism. But they don't. They hear you *deploying* the racism to make a distinction.

  **Alex:** They hear it because I had to mention the concept *C* to deny it. But logically, I am denying that Sam falls under *C*. The problem is pragmatic, not semantic. You're building a whole separate dimension of meaning—this CI dimension—just to save the intuition that the word "stings" in negation. But consider the conditional. "If Sam were a chink, we still shouldn't fire him."

  **Jamie:** Right. The antecedent.

  **Alex:** Precisely. On your view, the CI projects out of the *if*-clause. So even in this hypothetical scenario where we're arguing *against* firing him, I am still expressing contempt for Sam. That seems wrong. I'm using the sentence to argue for his protection.

  **Jamie:** Is it wrong, though? Try saying it in the department lounge. "Look, even if Sam were a chink, we shouldn't fire him." You think the Asian grad students in the corner are going to think, "Ah, Jamie is logically manipulating a variable in the antecedent, no expressive content applied"? No. They're going to be offended. The expressive commitment is made by the speaker *now*, not by the hypothetical Sam. The CI is anchored to the utterance context, not the evaluated world. That's why it projects. It proves the content isn't part of the truth-conditional evaluation of the antecedent.

  **Alex:** But if it's not part of the truth conditions, how do you explain the difference between "If Sam were Chinese, we shouldn't fire him" and "If Sam were a chink, we shouldn't fire him"? On your view, the at-issue content is identical—both denote *Chinese*. The only difference is the CI. But if the CI is separate, why does it feel like the *condition* itself is racist?

  **Jamie:** Because the CI isn't just a tag; it's a constraint on the common ground. By using the slur, I'm updating the common ground with the presupposition that this derogatory perspective is available for discussion. But let's flip it. Your view has a massive problem here. If "chink" denotes an empty property *C*, then "If Sam were a chink..." is a counterfactual with a necessarily false antecedent. Sam cannot instantiate *C* because *C* doesn't exist. So the conditional is vacuously true.

  **Alex:** It's not necessarily false in the sense of logical contradiction. It's false because the world doesn't contain that moral property. But we can still talk about worlds where people *believe* it exists. We're evaluating the sentence relative to a context where the social construction is in place.

  **Jamie:** Ah, so now you're retreating to a kind of contextualism about the property?

  **Alex:** I'm saying the semantic value is the complex property, even if it's empty. The sentence is meaningful because we grasp the property, even if nothing satisfies it. Your problem is reclamation. Let's say an Asian-American speaker says to another, "Yeah, I'm a chink and I'm proud." On your CI view, how does the offense vanish? If the conventional rule is "Use of 'chink' expresses contempt for East Asians," then the in-group user is expressing contempt for themselves. That's incoherent.

  **Jamie:** It's not incoherent; it's parameter-sensitive. The expressive rule isn't just "express contempt." It's "express the stance associated with this term relative to the speaker's social position." For an out-group speaker, the convention dictates contempt. For an in-group speaker, the convention dictates solidarity. The CI content shifts based on the speaker index. It's still a CI, it's just context-dependent.

  **Alex:** That feels like you're gerrymandering the CI rules to save the theory. You're adding so many parameters to the expressive dimension that it starts looking like... truth-conditional content. If the meaning changes based on who says it and what the social power dynamics are, isn't that just saying the *denotation* changes? On my view, it's straightforward. The in-group speaker denotes a different property. Let's call it *C-prime*. *C-prime* is "member of the community who reclaims this term." That property *is* instantiated. So "I am a chink" comes out true when said by the in-group member. No special expressive dimension needed. It's just ambiguity, like "bank" or "bat."

  **Jamie:** But it's not ambiguity. It's not like "bank" where there are two distinct lexical entries. It's the *same* word, carrying the *same* history, but the force changes. If it were just ambiguity, why is it so hard for an out-group member to use the reclaimed version? If I say "I'm a chink" trying to be nice, it fails catastrophically. If it were just a different denotation *C-prime*, I should be able to denote that property. But I can't. The expressive history blocks me. That suggests the history is encoded in the conventional meaning, not just the extension.

  **Alex:** But on my view, you *can't* denote *C-prime* because you don't stand in the right social relation to the property. The property itself includes a relational component: "person eligible to reclaim..." So it's still truth-conditional. You're just trying to protect the idea that there's this magical "expressive dimension" that floats above the truth conditions. But look at the negation again. "Sam is not a chink." If I say that, and I'm an in-group member, I might be denying he's part of the reclaimed community. If I'm out-group, I'm denying he's subhuman. The truth conditions shift. The CI view struggles to explain why the *truth* of the negation seems to depend on who's speaking, not just the projection of the attitude.

  **Jamie:** Because the CI *interacts* with the at-issue content. Look, I'll grant you that the reclamation data is the hardest point for the Potts-style view. We need a sophisticated account of how the expressive index is fixed. But you have the "falsehood" problem. If "Sam is a chink" is simply false—because the property is empty—then the liar who says it isn't saying something *harmful* in virtue of its content; they're just saying something false, like "Sam is a wizard." But slurs aren't like "wizard." They do harm *even if* the target knows the property is empty. The harm is in the expression of the attitude, not the assertion of the property.

  **Alex:** The harm is in invoking the ideology. But the semantics shouldn't be held hostage by the harm. We need to know what makes the sentence true or false to understand the logic of the discourse. If we treat it as CI, you can't embed it in belief reports properly. "John believes that Sam is a chink." Does John believe the at-issue content (Sam is Chinese) or the CI (Sam is lesser)? If it's CI, it shouldn't fall under the scope of "believes." But surely John believes the racist stuff.

  **Jamie:** Actually, that's a strong point for me. If John says "Sam is a chink," he expresses the attitude. If I report "John believes that Sam is a chink," I am reporting his belief that Sam is Chinese, but *I* am not expressing the attitude. The CI doesn't project out of belief reports in the same way. It stays with the subject of the attitude.

  **Alex:** Does it? If I say "John believes that Sam is a chink," am I safe? Or have I just spread the slur in the department?

  **Jamie:** You've spread it, but semantically, the commitment is John's.

  **Alex:** This is why we're stuck. You think the projection data proves it's CI. I think the reclamation and truth-value data proves it's complex truth-conditional content.

  **Jamie:** And neither of us wants to be the one to tell the department that the other theory implies something morally repugnant.

  **Alex:** Exactly. If I'm right, every racist utterance is technically false, which might let racists off the hook for "lying." If you're right, every negation of a slur is still racist, which makes anti-racist denial impossible.

  **Jamie:** *(Sips cold coffee)* So we agree the literature is a mess?

  **Alex:** We agree the data is fighting back.

  **Jamie:** One more round? The quotation test. " 'Chink' has five letters."

  **Alex:** Don't you dare.

  **Jamie:** Just checking if the CI projects out of mention.

  **Alex:** *(Laughs)* Let's just go back to the quals reading. At least Kripke doesn't call anyone names.

  **Jamie:** You sure about that? Have you read the footnotes in *Naming and Necessity*?

  **Alex:** Shut up and open your Frey.
