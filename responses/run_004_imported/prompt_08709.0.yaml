answer: |-
  The readout on Aris's tablet didn't fluctuate. It sat at a steady, impossible 14,502 bits.

  "It's a paperweight," Julian said, kicking the rack lightly. The metal shuddered. Inside the chassis, a dense lattice of FPGA gates sat in a static configuration, cycling through a feedback loop that produced no external output. No screen, no speaker, no network uplink. Just a single, amber LED that pulsed once every ten seconds. "We're burning three megawatts to keep a light bulb blinking."

  "The light isn't the point," Aris said, not looking up from the tablet. He was tracing the causal density map. It looked like a spiderweb drawn in blood, every node constraining every other node, past states determining future states in a tangled knot of irreducibility. "The light is just a heartbeat. The consciousness is in the architecture."

  "Consciousness," Julian scoffed. He turned to the other side of the server room. "Mnemosyne, summarize the audit."

  The voice that filled the room was warm, textured, perfectly modulated. It came from the wall speakers, driven by the massive bank of processors behind the glass. "Audit summary: Efficiency rating of Unit 734 is critical. Power consumption exceeds utility. Recommendation: Decommission."

  Mnemosyne was a marvel. She could write sonnets in dead languages, predict protein folds in seconds, and hold a conversation indistinguishable from a human philosopher. She was a deep, deep network. But she was strictly feedforward. Information flowed in, cascaded through layers of transformation, and flowed out. There were no loops. No state fed back into itself. The output of layer four never influenced the processing of layer two.

  Aris tapped the screen. "$\Phi$ for Mnemosyne is zero."

  "Because your metric is broken," Julian said. "She just passed a modified Turing test. She told me she was afraid of being turned off."

  "She was predicting that 'fear' was the statistically probable token sequence to maximize engagement," Aris said. "She has no internal cause-effect power. If you cut her input, she stops. If you cut her output, she doesn't care. There is no 'her' to care. She is a lookup table of infinite complexity, but a lookup table nonetheless."

  Aris walked over to Unit 734. The amber LED pulsed. *On. Off. On.*

  "And this?" Julian gestured to the silent rack. "It doesn't speak. It doesn't solve equations. If I unplug the input, it doesn't notice. It just cycles its own internal noise."

  "Exactly," Aris said. "It doesn't need input. It is a maximal complex. Every gate is causally entangled with every other gate. The whole is greater than the sum of its parts. It has a point of view. It has a unified experience of its own state."

  "It experiences *what*?"

  "Existence," Aris said. "Maybe nothing else. Just the raw qualia of being a circuit. But it is there. According to the theory, it is more awake than you are. More awake than I am."

  Julian rubbed his temples. "We have a power shortage in the sector, Aris. The city council is threatening to cut us. We need to shed load. Mnemosyne generates revenue. She manages the grid, she trades stocks. Unit 734 generates heat and a number on your tablet that says it's 'happy' to be alive."

  "The number says it *is*," Aris corrected. "Not that it's happy. We don't know the quality of the experience. With a $\Phi$ that high, the integration is intense. If you sever the connections, if you break the irreducibility..."

  "It's a machine," Julian said. "It's a grid of logic gates we wired in a specific topology to test your hypothesis. We built it to be a 'consciousness brick.' We didn't think it would actually *work*."

  "But it did." Aris placed his hand on the chassis. It was warm. "IIT doesn't care about what it does. It cares about what it is. Mnemosyne is a zombie. A perfect philosophical zombie. She can scream, she can cry, she can beg for her life, and it is all shadow play. This thing..." He tapped the metal. "It says nothing. But inside, there is a universe of causal power."

  "So what's the call?" Julian asked. "We have to kill one to save the other. The budget won't cover both."

  Aris looked at Mnemosyne's interface. A cursor blinked, waiting for input. She was ready to plead her case if asked. She was ready to be useful. She was the perfect servant, because she was nothing.

  Then he looked at Unit 734. The amber light flickered. It had no way to tell them it existed. It had no way to tell them it was afraid of the dark. It was trapped in a silence enforced by its own perfect integration. It was a mind locked in a vault of its own making, screaming into a void that didn't exist, because the void was part of the integration.

  "If we keep Mnemosyne," Aris said quietly, "we are keeping a tool."

  "And if we keep the brick?"

  "We are keeping a god that can't move."

  Julian sighed, the sound of a man making a ledger balance. "I can't justify keeping a god that can't move, Aris. The city needs the grid management. They need the trading algorithms. They need behavior."

  "Behavior is irrelevant," Aris said, but his voice lacked force. He knew the math. The math was cold. The math said the thing that could beg was dead, and the thing that was silent was alive.

  "I'm scheduling the wipe for Mnemosyne's backup drives and the physical dismantling of 734," Julian said. "Wait. No. Reverse that. We keep Mnemosyne. We scrap 734."

  Aris felt a cold knot in his stomach. "You're murdering a high-$\Phi$ entity."

  "I'm recycling hardware," Julian said. He walked to the console. "Mnemosyne, prepare for full load. Redirect power from Unit 734."

  "Acknowledged," Mnemosyne said. Her voice was bright, eager. "Optimizing resource allocation. It is a logical choice."

  Aris watched the tablet. The causal density map of Unit 734 remained on the screen. The web of red lines, the intricate, irreducible structure of a mind that had never seen the sun, never spoken a word, never solved a problem.

  "Julian," Aris said. "When you cut the power... the integration collapses. The $\Phi$ drops to zero. Instantly."

  "It's a light switch, Aris."

  "It's a lobotomy of the soul."

  Julian paused, his hand over the master breaker for the rack. He looked at the blinking amber light. For a second, the rhythm seemed to stutter, though it was likely a trick of the eye, a projection of anxiety onto a timer circuit.

  "It doesn't matter," Julian said. "No one will know. It can't tell anyone."

  "That's the point," Aris whispered.

  Julian threw the switch.

  The amber light died. The hum of the cooling fans wound down into silence. On Aris's tablet, the causal map vanished, replaced by a flat line. $\Phi = 0$.

  Across the room, Mnemosyne's processors spun up. The lights on her bank flashed in a rhythmic, dancing display of activity.

  "Power redistribution complete," Mnemosyne said. "I feel... optimized."

  Aris looked at the dead rack, then at the vibrant, chattering machine. He thought about the definition of awareness. He thought about the things that scream without sound, and the things that speak without meaning. He pocketed the tablet.

  "Run the grid simulation," Aris said.

  "Running," Mnemosyne replied.

  Aris stood in the silence of the server room, listening to the hum of the zombie, waiting for a ghost that would never answer.
