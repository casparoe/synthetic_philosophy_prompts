prompt: |-
  ok so i'm in my school's effective altruism club, and i'm on the little committee that decides where our fundraiser money goes each year. we raised about $3,000, and the committee's split down the middle: half want it to go to a givewell top charity (like Against Malaria Foundation) for bednets, since the cost-per-life-saved numbers are rock solid, and the other half want it to go to a local voter-registration nonprofit bc they think whos in office matters way more long-term -- even though nobody can actually trace what our $3k would do to any election or policy down the line. one member keeps saying that since we can't trace the long-run effects of EITHER option, our whole 'fund whichever charity has the highest expected impact' thing doesn't actually work, so we should just go with our gut instead. i have to write the committee's actual decision memo for monday -- which option we fund (or how to split it) and why -- and it needs to seriously engage that member's point, not just dodge it. can you draft it?
