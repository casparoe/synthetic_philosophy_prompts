          *   Verdict: Omar has the *standard* intuition on his side. Masks are usually "interfering factors" that don't remove the disposition.

      *   *Point 2: Lena's Counter (Fink).*
          *   Argument: Drug binds receptors *inside* the mechanism. Bubble wrap doesn't touch molecular structure; drug does.
          *   Critique: This challenges the "intrinsic vs. extrinsic" boundary. If the basis of the allergy is the receptor sensitivity, and the drug occupies the receptor, has the basis been removed? Or just blocked?
