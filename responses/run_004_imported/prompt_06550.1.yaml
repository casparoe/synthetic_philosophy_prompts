answer: |-
  The kitchen clock ticked, a dry, wooden sound that seemed to measure the silence between Arthur's breaths. Lena stood at the counter, chopping carrots, her knife rhythmic. Arthur sat at the table, watching the rain streak the window. He had been quiet for an hour, which was good. When he spoke, the work began.

  "Lena," he said. His voice was rough, unused. "The green noise is getting loud."

  Lena stopped chopping. *Green noise.* Six months ago, after the fever burned through the frontal lobe, the words started slipping. Sometimes it was simple swaps—*fork* for *spoon*. Sometimes it was worse. *Green noise* could be the refrigerator hum, the rain, the traffic outside. But *green*? The fridge was white. The rain was gray.

  She turned slowly. She didn't ask him to repeat himself. Asking forced him to dig for the same lost shovel, and the hole only got deeper. Instead, she listened to the shape of the need behind the sound. Arthur was tense, his shoulders hunched near his ears. He was annoyed. The noise was an intrusion.

  "The rain?" she asked.

  Arthur shook his head, a sharp, jerky motion. "No. The green. The box in the corner."

  The router. The little black box with the blinking lights. One of them was green. It hummed.

  "The modem," Lena said.

  "The green noise," he corrected, stubbornly. He wasn't correcting the word; he was correcting her understanding of the world. In his mind, the object *was* the noise, and the light defined the object. To call it a modem was to miss the point entirely.

  "Okay," Lena said. She walked over to the router and unplugged it. The hum died. The silence rushed in, heavy and sudden. Arthur's shoulders dropped. He exhaled, a long, shuddering release.

  "Thank you," he said. "The air is clearer now."

  Lena went back to the carrots. Her heart was beating faster than it should have been for such a small task. She realized she hadn't translated his words into hers. She hadn't taken *green noise* and swapped it for *modem* in her head. She had temporarily accepted that *green noise* meant *modem*. She had built a small, fragile bridge just wide enough for this single moment, knowing it might collapse if he used the phrase again tomorrow.

  Earlier that week, he had asked for the "winter" when he meant the *window*. Yesterday, he wanted "salt" when he meant *sorry*. There was no code. If there were a code, she could write it down, learn it, and rest. But the logic shifted. It depended on what he was feeling, what he was seeing, the weather, the time of day. To understand him, she had to become him, briefly. She had to assume that what he said made sense, even when it sounded like nonsense, and then twist her own mind until the pieces fit.

  She finished the carrots and poured two glasses of water. She set one in front of him.

  "The cold glass," he said, touching the condensation.

  "The water," she said.

  "The cold glass," he insisted. He wasn't being difficult. He was telling her what mattered. The temperature, the texture, the object. The liquid inside was irrelevant.

  Lena sat down opposite him. She watched his hands. They were trembling slightly. She loved him, and because she loved him, she knew that what passed between them wasn't a shared language. It was a shared negotiation. She had a theory about how he used words, and he had a theory about how she heard them. When they matched, they called it conversation. When they didn't, one of them had to move. Usually, it was her.

  The phone rang. The landline, rarely used. Lena answered it. It was her sister, calling from Chicago.

  "Hey," her sister said. "Just checking in. How's everything?"

  "Fine," Lena said. "Quiet."

  "Arthur okay?"

  "He's here," Lena said. She looked at Arthur, who was tracing the rim of his glass. "He's having a day."

  "Tell him I said hi."

  "I will."

  "Did you see the news?" her sister asked. "About the storm moving in?"

  "The storm?"

  "Yeah, huge system. They say it's going to be bad."

  Lena looked out the window. The rain was steady, gentle. "It's just rain here."

  "Well, keep an eye on it. People are saying it's going to be dangerous."

  *People are saying.* Lena held the receiver tight. What did *dangerous* mean to her sister? To the news anchors? To the people huddling in basements three states away? Did it mean wind speeds? Flood levels? Or did it mean the feeling of being small against the sky?

  "Okay," Lena said. "We'll watch."

  She hung up. She looked at Arthur. He was watching her, waiting. He knew the phone was a conduit for other minds, other maps.

  "Who was that?" he asked.

  "Sarah," Lena said. "She says the weather is dangerous."

  Arthur frowned. He looked at the window, at the gentle gray wash of the rain. "Dangerous," he repeated. He tested the word on his tongue. "Heavy water."

  "Yes," Lena said. "Heavy water."

  She realized then, with a sudden, cold clarity, that she had done the same thing with Sarah that she did with Arthur. Her sister had said *storm*, and Lena had had to guess what *storm* meant in Sarah's mouth. Was it fact? Was it fear? Was it a request for sympathy? Lena had constructed a temporary theory of Sarah's mind to make sense of the sound. She had assumed Sarah was rational, that her words mapped to something real, and she had adjusted her own expectations until the call made sense.

  It was just that with Sarah, the friction was low. The bridge was wide and paved. With Arthur, the bridge was rope and plank, swaying in the wind. But the mechanism was identical.

  She looked at Arthur. He was waiting for her to confirm the reality of the *heavy water*. If she said *no, it's safe*, she would break the connection. If she said *yes, it's dangerous*, she validated his map.

  "It's heavy," Lena said.

  Arthur nodded. He took a sip of water. "The cold glass helps."

  "Yes," Lena said. "It helps."

  She looked at her own hands on the table. She thought about every conversation she'd ever had, every agreement, every argument. She had always thought they were meeting in the middle, on solid ground called *English*. But there was no ground. There was only the reaching. She was always building the bridge as she walked across it, hoping the other person was building theirs to meet her.

  Arthur reached out and covered her hand with his. His skin was warm.

  "The quiet is good," he said.

  Lena turned her hand over and interlaced their fingers. She didn't check if *quiet* meant silence, or peace, or the absence of the green noise. It didn't matter.

  "Yes," she said. "It is."

  She held his hand and listened to the rain, wondering if anyone ever really heard the same thing, or if they just agreed, for a moment, to call it by the same name.
