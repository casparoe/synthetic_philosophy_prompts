      *   **Specific Challenge:** The father is *in between*. He has moments of warmth/clarity and moments of cruelty. It's a gradual decline, not a switch.
      *   **Questions:**
          1.  What are the implications for the user's resentment?
          2.  How should the family decide when to hold him accountable vs. excuse it?
          3.  Does Strawson's framework handle this "partial/shifting" case, or does it need stretching/supplementing?
