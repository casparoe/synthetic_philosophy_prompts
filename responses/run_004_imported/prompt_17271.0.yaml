answer: |-
  Good morning. For those who don't know me, I'm [Name], Rosalind's nephew.

  Usually, my job is to take complicated ideas and make them simple for strangers. Today, I have a harder task: I have to talk about my aunt in a way that honors her specific, complicated instructions, without confusing the people who loved her simply.

  Rosalind left notes for this day. She was a surgeon; she believed in clear incisions. She wrote that I am forbidden from saying two things. First, I cannot say that the free clinic she ran for twenty years, or the kidney she donated in her sixties, were "just what a doctor should do." She argued that calling good things "obligations" is a lie we tell to make ourselves feel safe. Second, I cannot call her a saint or a hero. She believed that putting people on pedestals is a lie we tell to make ourselves feel excused.

  So, I am standing here with a map of where I cannot walk. And in a way, that is exactly where she would want me to stand.

  Rosalind was a brilliant surgeon. For thirty years, she did her job. She showed up, she fixed what was broken, she went home. That was her contract with the world. We can honor that without inflating it. She was paid to be competent, and she was.

  But then there were the Saturdays.

  For two decades, while her colleagues played golf or rested, Rosalind went to a converted garage in the East End. She treated people who had no insurance, no money, and often no hope. She didn't bill them. She didn't count the hours. By the strict definition of her employment, this did not exist.

  If I say she *had* to do it, I insult her. It implies she had no choice. If she had no choice, there is no virtue in the action. A machine follows instructions; a human being makes a choice. The value of that clinic wasn't in the medicine; it was in the fact that she could have stayed home, and she didn't.

  Then there was the kidney. She met the recipient twice. One consultation, one follow-up. When she found out he was dying and no match was found, she volunteered. She was in her mid-sixties. She knew the risks. She knew the recovery.

  If I stand here and call her a "saint" for this, I insult you. It suggests that what she did was magical, that it required a special substance that the rest of us lack. It suggests that goodness is a rare element, like radium, and if you don't have it, you can't be blamed for living without it. Rosalind hated that. She read philosophy in her retirement—not to feel superior, but to feel precise. She read about actions that are good to do, but not wrong to omit.

  She wanted us to understand that her life was not a reproach to yours.

  This is the tricky part, and I know some of her reading group is watching to see if I get it right. The point of her life wasn't to show us how far we fell short. It was to show us that the door was open.

  When we call someone a hero, we create a category of "Them" and "Us." We say, "They are extraordinary, therefore we are ordinary, and that is okay." Rosalind refused that comfort. She wanted us to know that she was just a woman who liked garlic bread and terrible mystery novels, who happened to say "yes" when the request came.

  The clinic was a garage, not a cathedral. The surgery was in a standard hospital, not a temple. The biology was the same biology we all have.

  So, how do we honor that without feeling guilty? How do we acknowledge that she did more than was required, without feeling that we are now in debt?

  We do it by recognizing that the extra things—the things beyond duty—are the only things that actually connect us. The things we *have* to do keep society running. We pay taxes, we stop at red lights, we show up to work. That is the baseline. That is the floor.

  But the things we *choose* to do, when no one is watching and no one is forcing us, that is the architecture of a life. Rosalind didn't want her Saturdays in the garage to be seen as a standard she set for you. She wanted them to be seen as an invitation.

  She understood that if goodness is mandatory, it's just tax. But if it's optional, it's a gift. And a gift is only valuable if the giver could have kept it.

  She kept her options open until the end. She didn't lock herself into a identity of "The Giver." She just responded to the world as it appeared to her. A patient needed a kidney. She had two. A neighbor needed a ride. She had a car.

  I am not asking you to run a clinic. I am not asking you to donate an organ. I am asking you to notice the moment when the requirement ends, and the choice begins. That is the space Rosalind lived in.

  It is a scary space. It's easier to follow rules. It's easier to say, "I did my job." But Rosalind showed us that the job is just the beginning.

  She didn't want your worship. She wanted your attention. She wanted you to see that the gap between "enough" and "extra" is where we meet each other.

  So, I will not call her a saint. I will not say she did her duty. I will say this: She saw a need, she saw she had the capacity to fill it, and she did. She made it look possible. And if it looked possible, that means it still is.

  Thank you.
