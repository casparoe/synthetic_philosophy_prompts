      *   *The "Indictment" Fear:* If I say "She chose to do this, and you didn't," the audience feels guilty. I need to frame the choice not as a binary (Hero vs. Coward) but as a series of open doors. The focus should be on the *possibility* of the action, not the *failure* to act.
      *   *Structural Constraint:* The speech needs to feel like it's navigating these rules in real-time. It should acknowledge the difficulty of speaking about her without using the forbidden words.

