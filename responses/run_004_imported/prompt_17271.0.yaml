      *Let's write.*

      *(Post-Draft Review)*: The ending needs to be strong. It should invite the audience to see their own potential without feeling small. The metaphor of the "garage" works well—it's mundane, not a cathedral.

      *Wait, one nuance:* The prompt asks for the philosophical fussiness to shape the *structure*. I should explicitly navigate the forbidden zones as part of the speech's journey. I will structure it as "What I cannot say" leading into "What I must say."

