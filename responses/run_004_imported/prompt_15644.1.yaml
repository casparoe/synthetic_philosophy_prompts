  **Justifications:**

  *   **Move 1 (-1):** Maya employs a standard deflationary strategy (common in early utilitarian defenses), but characterizing the demandingness objection as *merely* psychological discomfort is factually inaccurate regarding the literature. It ignores Bernard Williams's structural "integrity" critique, which argues that consequentialism alienates agents from their moral sources, not just that it feels hard.
  *   **Move 2 (2):** Daniel correctly identifies the philosophical core of the objection. By referencing Williams, he shifts the debate from "how much does it hurt?" to "what does this do to moral agency?" This is the strongest formulation of the demandingness critique in contemporary ethics.
  *   **Move 3 (1):** Maya invokes Liam Murphy's *Moral Demands in Nonideal Theory*, a respected technical solution. However, it is contested whether this preserves consequentialism or merely grafts a fairness constraint onto it. It is a plausible move, but not a definitive refutation of the objection.
  *   **Move 4 (2):** Daniel accurately diagnoses the theoretical cost of Murphy's move. Standard act-consequentialism is sensitive to actual outcomes, not hypothetical fair shares. Adopting the compliance condition effectively abandons pure consequentialism for a hybrid view, which concedes that pure consequentialism *is* overly demanding.

  **What Both Are Missing:**

  Both students are operating under the assumption that consequentialism must dictate a **decision procedure** identical to its **criterion of rightness**. They miss the classic distinction (articulated by J.J.C. Smart and R.M. Hare) between what makes an act right (maximizing good) and how an agent should deliberate (which might include heuristics, personal projects, and rules).

  A sophisticated consequentialist can accept Daniel's structural worry (agents need personal projects to function) without accepting Maya's deflationism or Murphy's compliance condition. They can argue that cultivating personal integrity and relationships is the best *decision procedure* for maximizing utility, even if the *criterion* remains impartial. This dissolves the tension between "demandingness" and "integrity" without changing the theory's fundamental axioms or retreating to nonideal compliance. Additionally, neither mentions **Satisficing Consequentialism** (e.g., Slote), which modifies the maximization requirement itself rather than the compliance conditions.
