answer: |-
  **Title:** The Shadow in the Souq
  **Characters:**
  *   **THE MERCHANT:** A man of Damascus, currently sweating through his tunic.
  *   **CAELUS:** A Causal Decision Theorist. Calm, geometric, gestures with straight lines.
  *   **ELARA:** An Evidential Decision Theorist. Sharp, watchful, speaks of signs and portents.

  **Setting:** The Damascus marketplace, midday. The air is thick with dust and the smell of roasting lamb. THE MERCHANT stands frozen between a stall selling dried figs and the northward road leading to Aleppo. CAELUS and ELARA flank him.

  ***

  **MERCHANT:** He looked at me. I tell you, he looked right into my soul and smiled. Not a kind smile. A "see-you-later" smile. Then he vanished into the crowd.

  **CAELUS:** (Checking a pocket watch) Right. Death has appeared. Classic setup. Now, listen to me. You need to assess your causal leverage. Did your decision to stand here *cause* Death to appear here?

  **MERCHANT:** No, he was already... I think he was already there.

  **CAELUS:** Exactly. The past is fixed. Your choice now cannot reach back in time to move Death. He is either in Aleppo or he is in Damascus. If he is in Damascus, you die here. If he is in Aleppo, you die there. Your action has no causal power over his location. Therefore, the expected utility of fleeing is identical to staying. You might as well flip a coin. Or, frankly, stay. It saves on travel costs.

  **ELARA:** (Stepping in, voice low) Don't listen to him. He's treating the universe like a clockwork toy. It's not. It's a text, and you are writing a sentence. If you decide to go to Aleppo, what does that decision *say* about the world?

  **MERCHANT:** It says I want to live?

  **ELARA:** It says you are the kind of man who goes to Aleppo when Death is hunting. And since Death is a perfect predictor, the fact that you are *deciding* to go to Aleppo is overwhelming evidence that Death is already in Aleppo. Conditioning on your act, $P(\text{Death in Aleppo} | \text{You Go to Aleppo})$ is nearly one.

  **MERCHANT:** So if I choose Aleppo, I die?

  **ELARA:** If you choose Aleppo, the news that you have chosen Aleppo is the news that you will die.

  **MERCHANT:** (Turns to Damascus road) Then I stay!

  **ELARA:** (Holds up a hand) Wait. If you decide to stay, then the evidence shifts. $P(\text{Death in Damascus} | \text{You Stay})$ becomes nearly one. Your decision makes your current location the deadly one.

  **MERCHANT:** (Throwing his hands up) So I die if I go, and I die if I stay! I'm already dead!

  **CAELUS:** No, you're just confused by correlation. Elara is telling you that your choice is a *symptom* of your death, not the *cause*. But you don't avoid a symptom by ignoring the thermometer. You avoid the cause. Since you can't cause Death to move, you should just pick the option that feels better. Or better yet, recognize that since the causal probabilities are equal, you are rationally permitted to do anything.

  **ELARA:** Permitted? Caelus, look at him. He's trembling. Your theory offers him a menu of poisons and tells him the nutritional value is the same. My theory at least warns him that the menu is rigged. But I admit... (She pauses, frowning) ...there is a tension.

  **CAELUS:** A tension? It's a collapse. Your theory chases its own tail. If he leans toward Aleppo, your utility calculation screams "Damascus!" If he leans toward Damascus, it screams "Aleppo!" You have no stable equilibrium. You're recommending he vibrate until he falls over.

  **ELARA:** (Sharply) It is not a vibration; it is a deliberational dynamic. We don't demand a static point. We look for where his credences would settle if he deliberated long enough.

  **CAELUS:** And where is that?

  **ELARA:** (Hesitates) Ideally, a mixed strategy. A probability distribution. If he assigns 50% credence to going to Aleppo, then the expected utility of going matches staying.

  **CAELUS:** (Smiles) Aha! So even the Evidentialist must bow to the mixed strategy. But this is where Causal Decision Theory shines. We don't need to wiggle into it through shifting credences. We embrace it through *ratifiability*.

  **MERCHANT:** Ratifi... what?

  **CAELUS:** Ratifiability. A choice is rational only if, once you have made it, you do not wish you had chosen otherwise. If you decide "Go to Aleppo," and you know you decided that, do you wish you'd stayed? In Elara's view, yes, because then Death would be in Damascus. In my view, no—because your decision didn't *move* Death. But to be safe, to ensure the decision is stable, we adopt a mixed strategy. You commit to a coin flip. 50/50. Death predicts the flip, yes, but he can't be in both places. You maximize your survival chance given the constraints.

  **ELARA:** Do we? (She steps closer to Caelus) That was the old story, Caelus. The 1978 story. But have you read the later literature? Specifically, what happens when we add a third option?

  **CAELUS:** (Waves a hand) Options don't change causal arrows.

  **ELARA:** They change the knowledge state. Suppose there is a third option: "Stay in the Marketplace." Let's say the Marketplace is crowded. Death prefers solitude. If the Merchant stays here, among the crowd, Death might hesitate.

  **MERCHANT:** (Hopeful) I could hide in the crowd?

  **ELARA:** If you *decide* to hide in the crowd, and Death predicts that decision, he waits in the crowd. But here is the knife for Caelus: If you follow Causal Decision Theory, you calculate the causal impact of "Hiding." Since your hiding doesn't *cause* Death to come, CDT says "Hiding is safe!" It recommends the third option.

  **CAELUS:** Because it *is* safe, causally speaking!

  **ELARA:** But it's not safe *evidentially*. And here is the Egan objection: If CDT recommends "Hiding," and the Merchant knows he is a rational CDT agent, then he *knows* he will choose "Hiding." But if he knows he will choose "Hiding," then he has strong evidence that Death is in the Marketplace. Therefore, conditional on his decision, "Hiding" has lower expected utility than "Fleeing."

  **MERCHANT:** So... if I follow the Causal man's advice, I know it's bad advice?

  **CAELUS:** (Stiffens) That's a paradox of self-knowledge, not a failure of causation.

  **ELARA:** It's a failure of *ratifiability*, Caelus. You claimed your theory saves the day with ratifiable choices. But if the predictor is perfect, *no* pure act is ratifiable. And if the mixed strategy is predicted too—because Death predicts your decision procedure, not just the outcome—then even the coin flip is fatal. Egan showed that CDT can recommend an act that the agent *knows* is suboptimal at the moment of execution. You tell him to flip the coin, but the moment he commits to the flip, he knows Death has accounted for it.

  **CAELUS:** (Pacing now, agitated) That assumes the predictor predicts the *decision algorithm*. If Death predicts the *act*, the mixed strategy holds. If I randomize, I break the link between my deliberation and the prediction.

  **ELARA:** Does a perfect predictor not see the randomization device? If Death is perfect, he knows the outcome of the coin flip before it lands. Or he knows you will flip it. If he knows you will flip it, he waits at the destination the coin favors. Your "causal independence" is an illusion if the correlation is perfect.

  **MERCHANT:** (Backing away) So the coin doesn't help?

  **CAELUS:** It helps! It restores symmetry! Without the coin, you bias the prediction. With the coin, you force Death to guess.

  **ELARA:** But Death doesn't guess! That's the premise! He *knows*.

  **CAELUS:** Then the game is over before we started! If the future is written, decision theory is moot.

  **ELARA:** Not moot. Informative. My theory tells you that your deliberation is part of the causal chain that determines where Death is, because your deliberation is what he predicted. You cannot sever the link.

  **CAELUS:** And my theory tells you that you are not a puppet. You have agency. Even if Death knows what you'll do, you are still the one doing it. You shouldn't let the fear of correlation paralyze you. You must act on what you can *influence*.

  **MERCHANT:** (Looking at the North Gate, then the Shop, then the Crowd) I can influence... nothing. If I go, he's there. If I stay, he's there. If I flip, he knows the result.

  **ELARA:** Then you must recognize that your choice is not about survival. It is about coherence. You must choose the action that, conditional on choosing it, leaves you with the least regret.

  **CAELUS:** No! You choose the action that maximizes causal efficacy. You go to Aleppo because... because... (He falters) Because it's as good as anywhere else, and staying here feels like surrender.

  **ELARA:** Staying here feels like surrender because you think you can cause safety. You can't.

  **MERCHANT:** (Voice rising) I don't care about coherence! I don't care about efficacy! I care about whether I wake up tomorrow!

  **CAELUS:** Then flip the coin! It's the only move that doesn't privilege one fatal location over the other.

  **ELARA:** And when the coin lands heads, and you look at Aleppo, and you *know* that your looking is exactly what Death predicted, will you walk?

  **MERCHANT:** (He reaches into his tunic and pulls out a copper coin. He holds it tight.) If I flip this... and it says Aleppo... does that mean Death is there?

  **ELARA:** It means you have received the news that Death is there.

  **CAELUS:** It means you have generated a random number that Death could not causally influence.

  **MERCHANT:** But he predicted it!

  **CAELUS:** He predicted the *probability*.

  **ELARA:** He predicted the *outcome*.

  **MERCHANT:** (Stares at the coin. He looks at the road to Aleppo. He looks at his shop. He looks at the crowd.) If I stay in the market, I am a coward. If I go to Aleppo, I am a fool. If I flip, I am a gambler. And Death... Death is a mathematician.

  **CAELUS:** Just flip it, man. Assert your agency.

  **ELARA:** Wait. Consider the evidence. If you flip it, you are the kind of man who flips coins when Death calls. Is that the kind of man who survives?

  **MERCHANT:** (He lowers the coin. He does not flip it. He does not put it away. He stands, arm half-raised, frozen in the posture of a decision that cannot complete itself.)

  **CAELUS:** (Whispering) He's stuck.

  **ELARA:** (Quietly) No. He's accurate.

  **MERCHANT:** (To neither and both) I need... I need to know what I'm going to do before I decide to do it. But I can't know that until I decide.

  **CAELUS:** That's the loop.

  **ELARA:** That's the trap.

  **MERCHANT:** (He looks up at the sun, then down at the dust.) If I move, I confirm his prediction. If I don't move, I confirm his prediction.

  **CAELUS:** Then move anyway.

  **ELARA:** Then wait.

  **MERCHANT:** (He closes his eyes. The marketplace noise swells around them—the haggling, the camels, the wind.) I will... I will...

  *(He stops. He opens his eyes. He looks at Caelus, then at Elara. He says nothing. He remains standing exactly where he is, as the shadow of the minaret lengthens across the stones, pointing neither to Aleppo nor to Damascus, but simply marking the time.)*

  **CAELUS:** (Sighs) Indecision is not a strategy.

  **ELARA:** Sometimes, it's the only consistent one.

  *(The Merchant does not move. The light fades.)*

  **[END]**
