  9.  **Final Polish:** Check the pacing. Ensure the marketplace atmosphere bleeds through. (Dust, camels, noise).

  *(Self-Correction on the Egan Reference)*: Andy Egan's famous paper is "Some Counterexamples to Causal Decision Theory" (2007). The specific case often discussed alongside Death in Damascus is the "Psychopath Button." However, there is a variant of Death in Damascus where the predictor predicts your *decision procedure*. If CDT says "Randomize," and the predictor predicts "Randomize," you still die. I will frame the EDTist's argument around the idea that *knowing your own decision* provides fatal evidence, which CDT ignores to its peril.

