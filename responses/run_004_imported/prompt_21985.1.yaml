      *   **Sam (No-Thesis/Prasaṅgika):** Leans on Candrakīrti/traditional Prāsaṅgika reading. Worried that reifying emptiness (even as a contradiction) turns it into a *svabhāva*. Sees logic as conventional tool only.

  3.  **Key Textual References to Weave In:**
