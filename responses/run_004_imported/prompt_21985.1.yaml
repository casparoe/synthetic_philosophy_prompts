      *   **The Two Camps:**
          1.  *Dialetheist/Paraconsistent:* (Associated with Priest & Garfield, "Nagarjuna and the Limits of Thought"). Argues Nāgārjuna commits to true contradictions at the limits of thought. Needs paraconsistent logic to avoid explosion.
          2.  *Prasaṅgika/No-Thesis:* (Traditional Prāsaṅgika, associated with the *Vigrahavyāvartanī* "I have no thesis" claim). Argues the tetralemma is purely dialectical/reductio against opponents' essentialism (*svabhāva*). No positive assertions, classical logic holds within conventional reality.
      *   **Format:** A dialogue between two knowledgeable interlocutors after a talk.
      *   **Requirement:** Neither side should be a strawman. They must engage each other's strongest moves. Specifically:
          *   Dialetheist must answer: Why isn't this just *prasaṅga* (reductio) on opponents' terms?
          *   No-Thesis must answer: How do you handle seemingly assertoric claims (e.g., "No difference between samsara and nirvana," "Emptiness of emptiness") without committing to a thesis?
