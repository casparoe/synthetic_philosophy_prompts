          5.  Provide a summary "cheat sheet" for future arguments.

      *(Self-Correction during drafting)*: I need to be careful not to say the friend is *wrong* about AI risk generally, but that the specific derivation from "incomplete preferences" to "forced EU maximization over *everything*" is the shaky part. Recent work (like by Adam Shimi or the "Coherence Theorems don't imply EU maximization" posts on LessWrong) is relevant here. I should mention that this is an active debate in the field, not settled science.

      *Refining the "Completeness" point:* The VNM theorem requires completeness. But does an agent *need* to satisfy VNM to be safe? Not necessarily. It just needs to not lose resources. A simple rule like "never trade A for B if you prefer A" works, even if you don't have a preference between A and C.

      *Refining the "Instrumental Convergence" point:* Even if they become EU maximizers, does that guarantee doom? Most rationalists say yes (Omohundro's drives). But the user's specific question is about the *preference completeness* step. Stick to that primarily, but acknowledge the downstream implication.

