      *   **The Collapse:** Tichý (1974) and Miller (1974) proved that if $A$ and $B$ are both false, $A$ cannot have more truth content and less falsity content than $B$ in a way that allows ordering. Basically, if $A$ implies some false statement, it implies infinitely many, and the logic breaks down for comparing false theories.
      *   **Likeness Program (Niiniluoto, Oddie, etc.):** Truthlikeness is a function of the distance between the theory's constituent states and the true state in a logical space.
          *   *Vulnerability:* Miller's Language Dependence argument. If you change predicates (e.g., from $h, r, w$ to $h, m, a$), the distance metric changes, reversing the ordering of theories.
      *   **Content Program (Mortensen, Burger/Heidelberger, maybe Schurz?):** Stick to logical content but refine *which* consequences count. Maybe only "relevant" consequences.
          *   *Vulnerability:* How do you define "relevant" without circularity or arbitrariness? Does it just sneak in a similarity metric anyway? Does it avoid the collapse?

  3.  **Drafting - Section by Section:**

