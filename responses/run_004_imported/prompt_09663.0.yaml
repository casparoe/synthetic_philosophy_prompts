      *   **Marcus's Defense:** Relevance logic or specific syntactic restrictions. It's not about similarity; it's about logical structure.
      *   **The "Collapse" Counter:** Elena asks if Content really escapes Tichý-Miller. If you restrict content, do you lose the ability to compare false theories?
