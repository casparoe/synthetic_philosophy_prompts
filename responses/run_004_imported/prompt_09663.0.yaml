      *   **Characters:** Two proponents: one for the "Likeness" program (similarity/distance metrics) and one for the "Content" program (logical consequences/selective counting).
      *   **Key Arguments to Include:**
          *   Content Theorist vs. Likeness: Miller's language variance objection (similarity orderings change with predicate transformation).
          *   Likeness Theorist vs. Content: The arbitrariness of selecting privileged consequences (is it just hiding the problem?) and potential relapse into Tichý-Miller collapse.
          *   Both vs. "Natural Properties": Can appealing to natural kinds save the Likeness approach without begging the question?
