      *   *Verdict:* The user is right that ED shifts the focus, but wrong that it necessarily *abandons* the metaphysical claim. However, as a response to the Argument from Illusion (which is about the *nature of experience*), ED might be seen as changing the subject. That is a valid critique, but needs nuance.

