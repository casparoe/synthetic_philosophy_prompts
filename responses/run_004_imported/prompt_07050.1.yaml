      *   *Potential Pushback:*
          *   Is the user conflating *phenomenal character* with *mental kind*? Martin doesn't deny the subject *feels* something. He denies that the *explanation* of that feeling is an internal state shared with perception.
          *   *Fish (2009):* William Fish's "Perception, Hallucination, and Illusion" defends a version of disjunctivism that tries to give a more positive account of hallucination without conceding to CKA. He uses the idea of "phenomenal character" being constituted by the object in veridical cases, but in hallucination, it's a different kind of state that *mimics* that.
          *   *Intentionalism/Representationalism:* Some disjunctivists allow hallucinations to have representational content (unlike Martin's pure relationalism). This gives them positive character without sharing the *relational* nature of perception.
          *   *Causal Explanation:* The "oddness" of vivid hallucinations can be explained causally (brain chemistry) without positing a mental *object* (sense-data). The disjunctivist isn't saying "nothing is happening," but "what is happening is not a perception."
