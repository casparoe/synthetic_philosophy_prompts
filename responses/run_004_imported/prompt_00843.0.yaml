answer: |-
  You should definitely **scrub the eye-roll.** If you want historical accuracy, having Turing dismiss ESP as "obviously dumb" would actually be out of character for the 1950 Turing.

  In his famous paper *"Computing Machinery and Intelligence"* (published in *Mind*, October 1950), Turing explicitly addresses the "Argument from Extrasensory Perception." He does not dismiss it. In fact, he treats it with a level of serious empirical consideration that often shocks modern readers.

  Here is what the real Turing actually argued, and how you can use it to make your scene even better:

  ### 1. He accepted the statistical evidence
  Turing wrote that the statistical evidence for telepathy (largely from J.B. Rhine's experiments at Duke University) was **"overwhelming."**

  To a modern audience, this sounds wild. But in 1950, parapsychology was a more mainstream scientific debate than it is today. Turing was a rigorous empiricist; his stance was essentially: *"The data suggests this phenomenon exists, so I cannot simply ignore it because it contradicts my current understanding of physics."*

  ### 2. He saw it as a technical hurdle, not a disproof
  Turing's concern wasn't that ESP proved machines *couldn't* think. His concern was that ESP would rig the scores in his "Imitation Game" (the Turing Test).

  He reasoned that if a human interrogator asked, "What suit is the card in my right hand?" a telepathic human contestant would get it right 100% of the time, whereas a machine (relying on calculation) would only get it right 25% of the time. This would make the machine look less "human" than the human, skewing the test.

  ### 3. He proposed a "Telepathy-Proof Room"
  Turing didn't wave the problem away; he engineered a solution. He suggested that to ensure a fair test, the competition should be held in a **"telepathy-proof room."**

  He wrote:
  > *"It is fairly clear that one can cure this difficulty by arranging that the 'telepathic' human competitor is placed in a 'telepathy-proof room'."*

  ### How to write the scene (for maximum authenticity)
  If you have him dismiss ESP, you are relying on the modern stereotype of a "scoffing scientist." If you have him engage with it, you show the **actual** Turing: a man so committed to logic and data that he was willing to accommodate even the weirdest variables if the math supported them.

  **Option A: The "Strict Empiricist" (More Accurate)**
  The reporter asks the question expecting a scoff. Instead, Turing adjusts his glasses and admits the statistical data is compelling.
  *   **Reporter:** "But surely a machine can't replicate the human soul? Or telepathy?"
  *   **Turing:** "The statistical evidence for telepathy is overwhelming. We cannot simply ignore it."
  *   **Reporter:** (Surprised) "You believe in telepathy?"
  *   **Turing:** "I believe in data. But it presents a logistical problem for the test. We shall simply have to build a telepathy-proof room. Lead-lined, perhaps."
  *   **Why this works:** It shows his rigor. He doesn't care if it's "weird," he cares if it's "accounted for."

  **Option B: The "Annoyed Pragmatist" (A Middle Ground)**
  If you really want him to be annoyed, have him be annoyed not because the idea is stupid, but because it complicates his experiment.
  *   **Turing:** "It is a nuisance, is what it is. If humans can read minds, my test becomes invalid unless we shield the room. Do you have any idea how expensive lead lining is?"

  ### Summary
  The real Turing was **more open-minded** about ESP than your proposed character. He didn't think it was dumb; he thought it was a statistically significant variable that needed to be controlled for.

  Using the actual history makes for a richer scene because it subverts the audience's expectation. We expect the "rational robot guy" to say magic isn't real. Having him say, *"The data says it is, so let's build a room to stop it,"* makes him seem far more intelligent and interesting.
