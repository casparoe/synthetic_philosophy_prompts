answer: |-
  This is an exceptionally sharp observation, and you have hit on one of the most persistent and subtle debates in the philosophy of physics. Your confusion is well-founded: introductory physics courses often present the history as a clean narrative (Newton $\rightarrow$ Mach $\rightarrow$ Einstein $\rightarrow$ Relationism Wins), but the actual philosophical landscape is much messier.

  The short answer is: **General Relativity (GR) did not kill substantivalism; it transformed it.** In fact, many philosophers argue that GR makes substantivalism *more* plausible than it was in Newton's time, not less.

  Here is why the debate is still very much alive, what modern substantivalists actually believe (since it isn't Newton's view), and why gravitational waves are the smoking gun for their side.

  ### 1. Einstein's "Failed" Hope regarding Mach
  Your teacher was right that Einstein was inspired by Mach. Einstein hoped that in General Relativity, inertia (the resistance to acceleration) would be generated entirely by the distribution of matter in the universe. In a truly Machian universe, if you removed all the stars and galaxies, a spinning bucket would have flat water because there would be nothing to rotate *relative to*.

  However, GR does not actually enforce this. The equations of GR allow for solutions where there is **no matter at all** (an empty universe), yet spacetime still has a geometry (Minkowski space). In this empty universe, if you place a single test particle, it still has inertia. It still resists acceleration.

  *   **The Relationist (Machian) problem:** If space is only relations between bodies, and there are no bodies, there is no space. Therefore, inertia should be undefined.
  *   **The GR reality:** Inertia is defined by the *metric field* (the geometry of spacetime), even in the absence of matter.

  This suggests that spacetime geometry has an existence independent of the matter within it. That is a substantivalist claim. Einstein eventually admitted that GR was not fully Machian.

  ### 2. Spacetime as a Dynamic Actor
  In Newton's physics, space was a static stage. It was a "container" that didn't interact with the actors. It made sense to say, "This container is metaphysical junk because it does nothing."

  In General Relativity, spacetime is dynamic.
  1.  Matter tells spacetime how to curve.
  2.  Spacetime tells matter how to move.
  3.  **Spacetime can ripple.**

  This third point is where your confusion about **gravitational waves** comes in. Gravitational waves are ripples in the curvature of spacetime that travel through the vacuum. They carry **energy and momentum**.

  This poses a huge problem for strict relationism.
  *   **Relationist view:** Spacetime is just a bookkeeping system for the distances between material objects.
  *   **The Problem:** Gravitational waves can exist in a region of the universe where there is *no matter*. If spacetime is just relations between bodies, what is waving? What is carrying the energy?
  *   **Substantivalist view:** The spacetime metric field is a physical entity in its own right, just like the electromagnetic field. It can store and transport energy even without matter present.

  If "nothing" (mere relations) can carry energy, physics breaks. Therefore, many physicists conclude that the spacetime field must be a "substance" (in the physical sense of a real, energetic entity).

  ### 3. The Hole Argument: The Modern Battlefield
  You mentioned the "Hole Argument." This is the technical core of the modern debate, formulated by Einstein and later revived by philosophers like John Earman and John Norton in the 1980s.

  Here is the simplified version:
  Imagine a region of spacetime devoid of matter (the "hole"). According to GR, we can mathematically shift the distribution of the gravitational field inside the hole without changing anything outside the hole or changing the matter distribution.

  *   **If you are a Substantivalist:** You believe the points of spacetime are real individuals. Therefore, shifting the field creates a *physically different* situation (the field is now at point $A$ instead of point $B$).
  *   **The Catch:** GR's equations cannot tell you *which* of these shifted versions is the real one. They are mathematically equivalent. If substantivalism is true, GR is **indeterministic** (the past doesn't determine which shifted version happens).
  *   **If you are a Relationist:** You say the points of spacetime don't have independent identity. Shifting the field doesn't create a new reality; it's just relabeling the same physical situation. This saves determinism.

  **Why do substantivalists still exist?**
  Because modern substantivalists have developed sophisticated counter-arguments (often called "Sophisticated Substantivalism"). They argue that we can believe spacetime points are real *without* falling into the indeterminism trap, usually by arguing that the physical reality lies in the *coincidences* of fields and particles, not the bare points themselves. The debate is now highly technical, focusing on the ontology of the "manifold" versus the "metric field."

  ### 4. What is Left to Argue? (Newton vs. Modern)
  You asked what is left for a substantivalist to argue for once Newton's absolute space is gone. The key is that **modern substantivalism is not Newtonian substantivalism.**

  | Feature | Newton's Absolute Space | Modern Spacetime Substantivalism |
  | :--- | :--- | :--- |
  | **Structure** | Rigid, unchanging grid. | Dynamic, curvable, flexible field. |
  | **Observability** | Undetectable (you can't measure velocity relative to it). | Detectable (via curvature, time dilation, gravity waves). |
  | **Causal Power** | None (it's just a stage). | High (it exerts gravitational force, carries energy). |
  | **Relation to Matter** | Independent container. | Interacting partner (co-dependent but distinct). |

  Modern substantivalists argue that because spacetime has **causal powers** (it affects matter) and **conserved quantities** (energy/momentum in waves), it meets the criteria for being a physical object. To call it merely "relations" is to ignore that it can exist and act without the matter relations it is supposedly summarizing.

  ### Summary
  Your teacher gave you the standard "physics folklore" version: Einstein defeated Newton, and absolute space is dead.

  The deeper reality is:
  1.  **Einstein defeated Newton's *rigid* space,** but replaced it with a *dynamic* spacetime.
  2.  **Mach's Principle was not fully realized** in GR; spacetime geometry exists even without matter.
  3.  **Gravitational waves carry energy** through the vacuum, suggesting spacetime is a physical field, not just a list of relations.
  4.  **The Hole Argument** shows that the question of whether spacetime points are "real" has massive implications for determinism in physics.

  So, substantivalists today aren't arguing for Newton's invisible grid. They are arguing that the **metric field** of General Relativity is a genuine physical substance. Relationists argue that this field is still just a codification of potential relations between events. The fact that we can't definitively prove one side wrong is why philosophers of physics still have jobs!

  You asked a question that cuts to the heart of ontology in modern physics. Don't let the introductory narrative fool you; the bucket is still spinning.
