prompt: |-
  I sit on the ethics subcommittee that sets our research biobank's policy on returning genetic findings to participants. We currently disclose a finding only if it is well-validated and medically actionable; one member wants to extend disclosure to well-validated findings for serious, untreatable conditions -- Huntington's disease is the clearest case, since the variant is highly predictive and no treatment yet delays onset or progression -- arguing that since a participant can always decline to read what we send, offering the information can never leave a rational participant worse off in expectation than withholding it. Others worry this reasoning proves too much and would commit us to disclosing virtually anything we ever learn about anyone. Draft the memo I will circulate before our next meeting: it should recommend a specific disclosure policy for well-validated, non-actionable findings -- including what advance choice, if any, participants get, and what happens by default if they haven't chosen -- and it should directly assess whether the "they can just ignore it" argument actually supports the conclusion its proponents draw from it, rather than simply accepting or dismissing it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of an ethics subcommittee for a research biobank.
      *   **Task:** Draft a memo to circulate before the next meeting.
      *   **Topic:** Policy on returning genetic findings to participants (specifically well-validated, non-actionable findings for serious conditions like Huntington's).
      *   **Current Policy:** Disclose only if well-validated AND medically actionable.
      *   **Proposed Change:** Extend disclosure to well-validated findings for serious, untreatable conditions (e.g., Huntington's).
      *   **Key Argument to Address:** "They can just ignore it" (offering information never leaves a rational participant worse off in expectation than withholding it).
      *   **Key Concern:** This reasoning might "prove too much" (commit to disclosing everything).
      *   **Requirements:**
          *   Recommend a specific disclosure policy (including advance choice and default settings).
          *   Directly assess the "they can just ignore it" argument (don't just accept or dismiss it).
          *   Tone: Professional, ethical, analytical, suitable for a subcommittee.

  2.  **Deconstruct the Ethical Arguments:**
      *   *The Pro-Disclosure Argument (Autonomy/Right to Know):* Participants own their data. If it's true and serious, they should know. If they don't want to know, they can throw the letter away. Therefore, offering is neutral or positive.
      *   *The Counter-Argument (Psychological Harm/Right Not to Know):* Once you know something is in a letter, you can't *truly* ignore it. The anxiety of the unknown becomes the certainty of a burden. It can affect insurability, family dynamics, and mental health without offering medical benefit.
      *   *The "Proof Too Much" Concern:* If we return *any* well-validated finding, what about APOE4 (Alzheimer's risk, not deterministic)? What about carrier status for recessive conditions? What about variants of uncertain significance (VUS) that lean bad? The "ignore it" logic applies to all of these, but returning all of them creates noise, anxiety, and resource drains.
      *   *The "Rational Participant" Assumption:* The argument assumes perfect rationality. Humans are not perfectly rational. We suffer from anticipation anxiety. We cannot "un-know" that we have been sent a result.

  3.  **Formulate the Policy Recommendation:**
      *   *Category:* Well-validated, serious, non-actionable (e.g., Huntington's).
      *   *Advance Choice:* Participants should opt-in *before* the result is generated/revealed. This respects the "Right Not to Know."
      *   *Default:* If no choice is made, the default should be *non-disclosure*. This is the safer ethical ground (non-maleficence).
      *   *Counseling:* Mandatory genetic counseling must be available before and after disclosure.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose (reviewing policy on returning non-actionable findings) and the specific trigger (the proposal to include conditions like Huntington's).
      *   **Assessment of the "Ignore It" Argument:** This is the core analytical requirement.
          *   Acknowledge the logic (informational freedom).
          *   Critique the logic (psychological reality, the burden of choice, the impossibility of true ignorance once offered).
          *   Address the "Proof Too Much" slippery slope (if we do this for Huntington's, why not Alzheimer's risk?).
          *   Conclusion on argument: It is theoretically sound but practically flawed regarding human psychology and resource allocation.
      *   **Policy Recommendation:**
          *   Define the scope (High penetrance, serious, non-actionable).
          *   Process (Tiered consent/advance directive).
          *   Default (No disclosure without explicit opt-in).
          *   Support (Counseling requirement).
      *   **Conclusion:** Summary of the balanced approach.

  5.  **Refining the Tone and Content:**
      *   *Tone:* Needs to be diplomatic but firm on ethical reasoning. Not dismissive of the colleague's view, but rigorous in testing it.
      *   *Specifics:* Mention Huntington's explicitly as the test case. Mention the distinction between *offering* and *forcing*.
      *   *Key Ethical Principles:* Autonomy, Non-maleficence, Justice (resource allocation).

  6.  **Self-Correction/Review during Drafting:**
      *   *Check:* Did I address the "rational participant" claim? *Yes, by discussing the psychological burden of the offer itself.*
      *   *Check:* Did I set a default? *Yes, non-disclosure is safer.*
      *   *Check:* Is the policy specific? *Yes, opt-in required.*
      *   *Check:* Is the "proof too much" concern addressed? *Yes, by limiting the scope to high-penetrance, serious conditions, not just "anything well-validated."*

  7.  **Final Polish:** Ensure clear headings and bullet points for readability by busy committee members. (Proceed to generate output based on this structure.)

      *(Self-Correction Note)*: Make sure I don't sound like I'm making the final decision. I am *recommending* a policy for the committee to vote on. Use language like "I recommend" or "The proposal suggests."

      *(Refining the "Ignore It" Argument)*: I need to be careful here. The argument is that *offering* doesn't hurt because you can decline. The counter is that the *offer* itself signals likelihood, causing anxiety. Also, the cognitive burden of making the choice is a cost. I need to articulate that "information" isn't just the content; it's the context of the offer.

  8.  **Finalizing the Memo Structure:**
      *   Header.
      *   Background/Context.
      *   Analysis of the "Option Value" Argument (The "Ignore It" logic).
      *   The "Proof Too Much" Risk.
      *   Proposed Policy Framework.
      *   Next Steps.

