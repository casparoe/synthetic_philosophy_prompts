  **Move 1:** Helen correctly identifies the standard "Calibrationist" intuition: if you know your instrument is compromised, you cannot trust its output at face value.
  **Move 2:** Gordon accurately articulates the "Total Evidence" view, noting that first-order data (the image) remains evidence even if reliability is lowered.
  **Move 3:** This is Helen's strongest lever; the empirical claim that fatigue masks error removes the radiologist's ability to distinguish good reads from bad, undermining Gordon's reliance on introspection.
  **Move 4:** This is Gordon's strongest lever; he correctly identifies that Helen's view forces "epistemic akrasia" (believing $p$ while believing it's irrational to believe $p$), which many philosophers view as a fatal incoherence.
  **Move 5:** Helen raises a serious methodological worry, but claiming Gordon's view makes HOE *completely* unfalsifiable is slightly hyperbolic, as he does allow for *some* confidence reduction.

  ***

  **The Missing Distinction: Undercutting vs. Rebutting Defeaters**
  The stalemate persists because Helen and Gordon are treating the fatigue evidence as different *types* of logical operators. Gordon treats the statistics as a **rebutting defeater**: new evidence added to the scale that weighs against "benign" but doesn't remove the weight of the image itself (like adding error bars to a reading). Helen treats it as an **undercutting defeater**: evidence that severs the connection between the image and the conclusion entirely (like realizing the NMR baseline is drifting, requiring recalibration rather than just wider error margins). The resolution lies in recognizing that higher-order evidence about reliability functions as an *undercutter*; it doesn't just add noise to the data, it temporarily suspends the warrant that data provides, validating Helen's demand for a significant confidence drop without requiring Gordon's charge of incoherence if we accept that "suspended judgment" is the rational middle ground.
