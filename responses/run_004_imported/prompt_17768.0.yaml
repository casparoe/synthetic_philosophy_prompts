answer: |-
  Here is the technical substance of the argument, structured for a character who knows the literature (specifically the work of Sharon Street and Richard Joyce) and is tired of undergraduates missing the point.

  ### The Core Argument: The Evolutionary Debunking of Moral Realism

  **1. The Evolutionary Premise (The Genealogy)**
  Start by establishing that our moral intuitions are not perceptions of a external reality, but adaptations.
  *   **The Point:** Human moral faculties were shaped by natural selection.
  *   **The Mechanism:** Selection pressures favored behaviors that enhanced reproductive fitness (kin altruism, reciprocity, hierarchy, in-group bias).
  *   **The Implication:** We hold the moral beliefs we hold *because* holding them conferred a survival advantage, not because they correspond to mind-independent moral truths.

  **2. The Independence Premise (The Realist Commitment)**
  Define what the opponent (the moral realist) believes.
  *   **The Point:** Moral Realism claims that moral truths (e.g., "suffering is bad") exist independently of human attitudes, evolutionary history, or social conventions. They are "stance-independent."
  *   **The Conflict:** If moral truths are independent of us, and our beliefs are determined by evolutionary pressure, there is no guarantee the two align.

  **3. The Epistemic Defeat (The Coincidence)**
  This is the hammer.
  *   **The Argument:** For our moral beliefs to be justified, there must be an explanatory connection between the *truth* of the belief and our *holding* of the belief.
  *   **The Problem:** Evolution explains why we hold the belief. It does not explain why the belief is *true*.
  *   **The Conclusion:** To believe that our fitness-driven intuitions align with objective moral truth is to rely on a massive, unjustified coincidence. It is like believing a weather vane points North not because of the wind, but because it loves North.

  ***

  ### The Critical Pivot: The "Math/Logic Objection"

  This is the part you specifically asked for. A smart interlocutor will say: *"Evolution also shaped our capacity for logic and arithmetic. If evolution debunks morality, it debunks math. But 2+2=4 regardless of evolution. So your argument proves too much."*

  Here is how your character dismantles that objection using the **"Tracking vs. Adaptive Link"** distinction.

  **1. Acknowledge the Force of the Objection**
  Have her admit this is the standard realist defense. It shows she isn't straw-manning.
  *   *Voice note:* "It's the favorite escape route for the optimists. If I'm skeptical about morals, I must be skeptical about math. Since I'm not skeptical about math, I should stop being skeptical about morals."

  **2. The Distinction: Direction of Explanation**
  This is the technical "real answer."
  *   **In Math/Logic (Truth-Tracking):** There is a causal/conceptual link between the *truth* of the proposition and its *adaptive value*.
      *   *Example:* If an organism believes "1 predator + 1 predator = 0 predators," it gets eaten.
      *   *The Mechanism:* The belief is adaptive *because* it is true. The structure of the world constrains the belief. False logical beliefs tend to lead to practical failure (bridges collapse, food counts are wrong). Truth tracks utility.
  *   **In Morality (Adaptive-Link):** There is **no** link between the *truth* of the proposition and its *adaptive value*.
      *   *Example:* Believing "protect your kin" is adaptive. But is it *objectively true* that you ought to protect your kin? Evolution doesn't care.
      *   *The Mechanism:* The belief is adaptive simply *because you hold it*, regardless of its truth. Believing "my tribe is superior" helps you fight cohesively, even if "tribal superiority" is objectively nonsense. The utility comes from the psychological commitment, not the correspondence to reality.

  **3. The "Third-Factor" Rebuttal**
  Realists often argue there is a "third factor" (like "survival is good") that links evolution and truth. Your character needs to swat this down.
  *   **The Argument:** To say "survival is good" is itself a moral claim. You cannot use a moral claim to prove moral truths exist without begging the question. Evolution selects for *survival*, not for *the Good*. To conflate the two is the Naturalistic Fallacy dressed up in evolutionary clothing.

  **4. The Summary Distinction (For her voice)**
  *   **Math:** We believe it because it's true, and that helps us survive.
  *   **Morality:** We believe it because it helps us survive, and we pretend it's true.

  ***

  ### Key Phrases/Concepts for Her Voice

  *   **"Explanatory Irrelevance":** The objective truth of a moral claim is irrelevant to why we believe it.
  *   **"Pre-established Harmony":** She can mock the idea that evolution and moral truth just happened to line up perfectly as a "theological hangover."
  *   **"The Gear and the Mirror":** Math is a mirror (reflecting reality); Morality is a gear (designed to move the machine of survival).
  *   **"Fitness, not Fidelity":** Evolution selects for fitness, not fidelity to truth. In logic, they overlap. In ethics, they diverge.

  ### Sample Dialogue Snippet (To show the flow)

  "You're reaching for the math objection. I know it. It's the first thing they teach in Meta-Ethics 101 to make the freshmen feel clever. 'If evolution debunks morality, it debunks arithmetic.'

  But it assumes the machinery works the same way. It doesn't.

  When your ancestor counted the tigers in the valley, the truth of the number *constrained* the survival value. If they thought two tigers were zero, they died. The truth *caused* the utility.

  But when that same ancestor decided they ought to sacrifice a goat to ensure the harvest? The utility didn't come from the *truth* of the sacrifice. It came from the *cohesion* the ritual created. The belief worked *even if it was false*.

  Math is a map; if the map is wrong, you fall off the cliff. Morality is a placebo; it works precisely because you don't question if it's real. Evolution gave us the map for the physical world, but it gave us the placebo for the social one. You're confusing a tool for measuring reality with a tool for manipulating it."
