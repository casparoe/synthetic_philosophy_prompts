answer: |-
  **MEMORANDUM**

  **TO:** Honor Council Members
  **FROM:** [Your Name], Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Proposal to Revise Evidentiary Standards for Tier II Cases

  **Purpose**
  Following our recent deliberation regarding the senior accused of data fabrication, I am proposing we review our evidentiary standards. Currently, both Tier I (minor) and Tier II (serious/expulsion) cases rely on the same standard: a majority vote based on a "more likely than not" threshold. As evidenced by our split vote, many of us feel that uncorroborated testimony sufficient for a warning feels insufficient for expulsion. This memo outlines three frameworks for understanding this intuition and recommends a policy change.

  **Theoretical Frameworks**
  1.  **Pragmatic Encroachment:** This view holds that the *stakes* of a decision determine how much evidence is required to be justified. As the potential harm to the accused increases (from a warning to expulsion), the evidentiary bar must rise, even if the raw evidence remains unchanged.
  2.  **Epistemic Contextualism:** This argues that the *meaning* of "sufficient evidence" shifts depending on the context. In a low-stakes hearing, "sufficient" means one teacher's testimony; in a high-stakes hearing, the term itself implies corroboration. This suggests our bylaws need clearer definitions for different contexts.
  3.  **Invariantism:** This position holds that truth is fixed. Either the student cheated or they did not. The standard of proof should not fluctuate based on punishment. If evidence is too weak for expulsion, it is too weak for a warning.

  **Addressing the Invariantist Objection**
  The Invariantist argument is morally serious: we should not find a student "guilty" on evidence we deem too weak to punish severely. However, in a disciplinary body, we must manage *risk of error*. A false positive in a Tier I case (a wrongful warning) is regrettable; a false positive in a Tier II case (wrongful expulsion) is catastrophic. Because the Council acts as an agent imposing harm on the *student* (who bears the stakes, not us), our duty of care requires higher confidence before inflicting greater harm. Maintaining a single low standard risks unjust expulsion; maintaining a single high standard risks letting minor offenses go unpunished. Therefore, the standard must track the severity of the sanction.

  **Recommendation**
  I propose we amend the bylaws to adopt **Tiered Evidentiary Standards**:

  *   **Tier I (Warning/Redo):** Retain "Preponderance of Evidence" (>50% likelihood). Single-source testimony may suffice.
  *   **Tier II (Suspension/Expulsion):** Adopt a "Clear and Convincing" standard. This requires a supermajority vote (e.g., 7 of 9) and mandates corroborating evidence (e.g., digital forensics, multiple witnesses) beyond a single instructor's account.

  This approach codifies the intuition behind Pragmatic Encroachment while providing the semantic clarity Contextualism demands. It respects the Invariantist concern by ensuring that a Tier II finding represents a higher degree of objective certainty, commensurate with the life-altering consequences for the accused.

  **Next Steps**
  Please review this proposal prior to Wednesday's meeting. I move we vote on drafting an amendment to reflect these tiered standards.
