prompt: |-
  I'm a junior at my high school and one of the student representatives on our Honor Council, the body that hears academic integrity cases and recommends sanctions to the dean. Our bylaws set up two tiers: a first or minor offense, like an uncited paraphrase, gets a warning and a chance to redo the work, while anything serious or repeated gets referred to the dean with a recommendation of suspension or expulsion. Both tiers currently use the same evidentiary standard: a majority of the nine of us (six students, three faculty) must find it "more likely than not," based on whatever testimony is presented, that the student actually did it. There's rarely a confession or camera footage involved, so most cases really come down to a teacher's account weighed against the student's.

  Two weeks ago we heard a case that split the council: a senior accused of fabricating data in a lab report, an offense serious enough under our bylaws to send it straight to the expulsion track, based on nothing more than a single teacher's testimony. I'd just covered pragmatic encroachment in my philosophy elective—we've been doing a unit on contemporary epistemology—and it seemed to fit exactly: the same uncorroborated testimony that would easily support a warning in a minor case felt obviously too thin to justify something this serious, which suggests that what it takes for us to know, or be justified in believing, that a student is responsible should rise with what's riding on the finding, even though the evidence itself hasn't changed at all. A friend on the council, who leans toward epistemic contextualism instead, thinks this gets the phenomenon right but frames it wrong: on her view, what shifts isn't how much justification it takes to believe something as the stakes rise, but what a phrase like "sufficient evidence" in our bylaws even means as used in a low-stakes versus a high-stakes hearing—and she thinks that distinction actually matters for how the bylaws should be worded. A third member, though, wants none of it: he thinks whether the student did it is a plain fact that shouldn't shift around depending on the punishment, and that if one teacher's word isn't good enough to justify expulsion, it shouldn't count as sufficient for a warning either—keep one standard for the finding itself, and let the stakes affect only the sanction that follows from it. I'm also genuinely unsure whether it matters that, unlike the classic cases I've read about where the person doing the believing also bears the stakes, here it's the council doing the believing while the student bears essentially all of it.

  I have to circulate a short discussion memo before next Wednesday's meeting, and I'd like your help drafting it. Could you lay out these three positions accurately, recommend one concrete evidentiary policy—or a defensible combination of them—that the council could actually vote on, and take the "keep one standard, let stakes affect only the sanction" objection seriously rather than dismissing it, since at least two members are sure to raise it and I'd like the memo to already have an answer ready for them? A page is about right.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Junior high school student, Honor Council representative.
      *   **Task:** Draft a short discussion memo for the next Honor Council meeting.
      *   **Context:** The Council hears academic integrity cases. Current bylaws have two tiers (minor vs. serious/repeated) but use the *same* evidentiary standard ("more likely than not" / preponderance of evidence, majority vote).
      *   **Problem:** A recent case (senior accused of fabricating data, potential expulsion) relied on single-teacher testimony. This felt insufficient for high stakes, even if it might pass for low stakes.
      *   **Theoretical Framework:** The user studied *pragmatic encroachment* in philosophy. A friend argues for *epistemic contextualism*. A third member argues for *invariantism* (keep one standard, stakes affect sanction only).
      *   **Specific Concern:** The "stakes" are borne by the accused student, not the believers (Council members). Does this matter?
      *   **Requirements:**
          1.  Accurately lay out the three positions (Pragmatic Encroachment, Contextualism, Invariantism).
          2.  Recommend a concrete evidentiary policy (or combination).
          3.  Seriously address the "keep one standard" objection (Invariantism).
          4.  Length: About one page.
          5.  Tone: Professional, persuasive, appropriate for a high school Honor Council (sophisticated but accessible).

  2.  **Deconstruct the Three Positions:**
      *   *Pragmatic Encroachment (User's view):* Knowledge/justification depends on practical stakes. As the cost of being wrong goes up (expulsion vs. warning), the amount of evidence required to be "justified" increases, even if the raw evidence is the same.
      *   *Epistemic Contextualism (Friend's view):* The meaning of terms like "know" or "sufficient evidence" shifts depending on the context of the conversation/hearing. It's semantic, not metaphysical. The bylaws need clearer wording to reflect different contexts.
      *   *Invariantism (Third Member's view):* Truth and justification are fixed. Either the student did it or they didn't. The standard of proof shouldn't change. If evidence is too weak for expulsion, it's too weak for a warning. Stakes should only influence the *sanction*, not the *finding*.

  3.  **Address the "Stakes Bearer" Issue:**
      *   Classic cases (e.g., Bank Case) usually involve the *believer* facing the stakes (e.g., if I'm wrong about the bank being open, *I* lose money).
      *   Here, the Council believes, but the *Student* loses (expulsion).
      *   *Relevance:* This actually strengthens the argument for higher standards in high-stakes cases. Moral responsibility demands we are more sure before harming *others* than before harming ourselves.

  4.  **Develop a Recommendation:**
      *   Pure Invariantism is risky (might let guilty people off with warnings if evidence is "medium," or punish innocent people if evidence is "low" but meets the single standard).
      *   Pure Contextualism is hard to codify in bylaws (too vague).
      *   Pure Pragmatic Encroachment is the practical reality of how people *feel*, but needs formalization.
      *   *Best Compromise:* Tiered Evidentiary Standards.
          *   Tier 1 (Minor): Preponderance of Evidence (>50%).
          *   Tier 2 (Major/Expulsion): Clear and Convincing Evidence (significantly more likely than not, e.g., ~75% confidence or corroboration required).
      *   This effectively adopts the *spirit* of Pragmatic Encroachment while creating the *clarity* Contextualism wants, and it answers the Invariantist by showing that "finding of fact" and "level of confidence" are distinct.

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (reviewing evidentiary standards after recent case).
      *   **The Three Positions:**
          *   *Pragmatic Encroachment:* Stakes raise the bar for justification.
          *   *Contextualism:* The definition of "sufficient" changes with context.
          *   *Invariantism:* Facts are fixed; standards shouldn't shift.
      *   **Addressing the Invariantist Objection:** This needs care. Acknowledge the moral intuition (truth is truth). Counter with the risk of error. A false positive in a warning is bad; a false positive in expulsion is catastrophic. Therefore, risk tolerance differs. Also, address the "stakes bearer" point (we are agents acting on the student).
      *   **Recommendation:** Propose a tiered standard.
          *   Minor: Preponderance.
          *   Major: Clear and Convincing (require corroboration or higher confidence).
      *   **Closing:** Call to action for Wednesday.

  6.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check Length:* Keep it tight. Don't get bogged down in philosophical jargon. Explain terms simply.
      *   *Tone Check:* Ensure it doesn't sound like a philosophy lecture. It needs to be about *policy*.
      *   *The "Stakes Bearer" Point:* Make sure to explicitly mention that the Council acts as an agent for the school, imposing harm on the student, which heightens our duty of care.
      *   *Invariantist Rebuttal:* The strongest argument against Invariantism here is *error distribution*. If we keep one low standard, we risk expulsion on weak evidence. If we keep one high standard, we might fail to punish minor cheating. Tiering solves this.

  7.  **Final Review against constraints:**
      *   Three positions accurate? Yes.
      *   Concrete policy? Yes (Tiered standards).
      *   Invariantist objection addressed? Yes.
      *   One page? (Will aim for ~500-600 words).

  8.  **Final Polish:** (Drafting the content based on the above plan.) *Wait, I need to make sure I don't use too much jargon. "Pragmatic Encroachment" might need a plain English explanation in the memo.* *Also, ensure the distinction between Contextualism and Encroachment is clear but brief.* *Okay, let's write.*

  *(Self-Correction on the "Stakes Bearer" point)*: The prompt asks me to take the objection seriously. I need to make sure I don't just dismiss the Invariantist. I need to show why their view, while logically consistent, leads to unjust outcomes in a disciplinary context.

  *(Final Plan)*:
  1. Header.
  2. Intro: The problem (recent case).
  3. Philosophical Options (simplified).
  4. The Invariantist Challenge (and response).
  5. Proposal: Tiered Standards.
  6. Conclusion.

