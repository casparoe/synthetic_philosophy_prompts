prompt: |-
  Hey, I'm prepping my formal epistemology seminar and want a sanity check from you. In epistemic utility theory, accuracy-first epistemologists usually just grab either the Brier score or the log score as "the" inaccuracy measure for Joyce's accuracy-dominance argument for probabilism, like the choice doesnt matter. Compare the two as candidate measures of epistemic accuracy: think about boundedness, how each one treats extreme credences, and whether strict propriety alone is enough to count as a "legitimate" scoring rule. Which one actually gives the better foundation for accuracy-first arguments, and why? Don't hedge, I want an actual verdict, not just a list of pros and cons.
