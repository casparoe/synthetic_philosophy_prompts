      *Decision:* I will stick with Brier. The non-locality of Brier is actually a feature for holistic coherence (Probabilism), whereas Log's locality makes it better for information transfer. For *epistemic* accuracy regarding coherence, Brier is more appropriate.

      *Final Plan:*
