answer: |-
  Here is the verdict: **The Brier score provides the superior foundation for the accuracy-first program, specifically for Joyce's dominance argument for Probabilism.**

  While the Log score has specific advantages for diachronic norms (Conditionalization) and information-theoretic interpretations, the Brier score is the robust workhorse required to ground the synchronic norms of rationality without smuggling in controversial metaphysical commitments.

  Here is the breakdown of why the Brier score wins, based on your three criteria.

  ### 1. Boundedness and Mathematical Stability
  The Brier score is bounded; the Log score is not. This is not merely a mathematical convenience; it is a philosophical necessity for a clean dominance argument.

  *   **The Problem with Log:** Because the Log score approaches infinity as credence in the truth approaches zero, it introduces infinite inaccuracy values into the dominance calculation. To make the dominance argument work with the Log score, you must adopt specific machinery to handle infinities (e.g., lexicographic ordering or extended real numbers). This complicates the proof and opens the door to technical objections that distract from the core philosophical claim: that non-probabilistic credences are *accuracy-dominated*.
  *   **The Brier Advantage:** The Brier score keeps all inaccuracy values finite. This ensures that the dominance relation is well-defined across the entire credence space without requiring auxiliary assumptions about how to compare infinite disutilities. For a foundational argument, you want the weakest mathematical assumptions possible. Brier achieves the result with standard real analysis; Log requires extended analysis.

  ### 2. Treatment of Extreme Credences (Regularity vs. Probabilism)
  This is the decisive factor. The Log score enforces **Regularity** (the norm that you should never assign credence 0 or 1 to contingent propositions); the Brier score does not.

  *   **Why Log is too strong for a foundation:** If you use the Log score, assigning 0 credence to a truth yields infinite inaccuracy. Consequently, the accuracy-dominance argument proves not just Probabilism, but Probabilism + Regularity. However, Regularity is a much more controversial norm than Probabilism. Many epistemologists accept that rational agents can be dogmatic (assign 0 or 1) in certain limiting cases. By using the Log score, you tie the fate of Probabilism to the fate of Regularity. If a student rejects Regularity, they might feel compelled to reject the accuracy argument for Probabilism entirely.
  *   **Why Brier is just right:** The Brier score penalizes extreme error heavily (a score of 1 for assigning 1 to a falsehood), but finitely. This allows the accuracy-firster to prove Probabilism *without* taking a stand on Regularity. You can establish the coherence norm (Probabilism) first, using Brier, and then debate Regularity separately. A foundational measure should isolate the specific norm it intends to justify. Brier isolates Probabilism; Log conflates Probabilism with Regularity.

  ### 3. Strict Propriety is Not Enough
  You asked if strict propriety alone is enough to count as a "legitimate" scoring rule. **It is not.**

  *   **The Requirement:** Strict propriety ensures that an agent expects to minimize inaccuracy by reporting their true credence. However, for Joyce's dominance argument to hold, the inaccuracy measure must also be **continuous** and **convex**.
  *   **The Comparison:** Both Brier and Log satisfy propriety, continuity (on the open interval), and convexity. However, the Brier score is continuous on the *closed* interval $[0,1]$, whereas the Log score blows up at the boundaries.
  *   **The Implication:** Because the Brier score is well-behaved on the boundary, it allows the dominance argument to apply to *all* credence functions, including those that violate Regularity. The Log score effectively excludes non-regular credence functions from the domain of the theorem because their inaccuracy is undefined or infinite. If your goal is to show that *any* non-probabilistic credence function is dominated (even dogmatic ones), the Log score fails to assess them coherently. The Brier score assesses them and finds them wanting.

  ### Final Verdict
  Use the **Brier score** (or the class of continuous, bounded, strictly proper rules it represents).

  The accuracy-first program aims to show that the norms of rationality are constitutive of the goal of accuracy. To succeed, the argument must be as assumption-light as possible. The Log score assumes that dogmatic error is *infinitely* worse than mere error. That is a substantive axiological claim, not a neutral measure of distance from the truth. The Brier score treats inaccuracy as a distance metric that remains finite even at the limits.

  For a seminar on the *foundation* of the view (Joyce's argument for Probabilism), the Brier score is the correct choice. It secures the core norm (Probabilism) without inheriting the baggage of the stronger norm (Regularity) or the mathematical pathologies of infinity. Save the Log score for a later session on Conditionalization and information theory, where its unboundedness is a feature, not a bug. For the bedrock of the theory, stick with Brier.
