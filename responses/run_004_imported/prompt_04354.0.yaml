      *   *AAI Analysis:* Seems expansive. But who decides what counts as an "interest"? Who decides the causal chain? If I decide who is affected, I've already drawn the boundary. So, it relocates the circularity to the definition of "affect."
      *   *ASP Analysis:* Seems more bounded (coercion). But who decides what counts as "coercion" or "law"? Does it apply to border controls themselves? (Abizadeh's point: border controls are coercive, so outsiders should vote on them). But then, who defines the polity doing the coercing? It risks presupposing the state it tries to justify.
