      *   *Refined Thesis:* While neither principle fully escapes Whelan's logical circularity—since both require prior stipulations about the scope of "affect" or "subjection"—the All-Subjected Principle (ASP) offers a more robust *political* solution. It grounds the *demos* in the specific relationship of coercive authority that democracy is meant to regulate, whereas AAI dissolves the *demos* into an unmanageable global aggregate. Therefore, the boundary problem admits not of a logical dissolution, but of a normative stipulation, with ASP being the most defensible stipulation.

