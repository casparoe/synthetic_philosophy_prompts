      *   *Refining the "Relocation" argument:* It's crucial to note that applying AAI or ASP requires an *agent* to apply it. If the state applies it, the state presupposes its own boundary. If an international body applies it, we just moved the boundary problem up a level. This confirms Whelan's point.

  5.  **Final Polish:** Check transitions, clarity of thesis, and strength of the concluding verdict. (Ensure the distinction between *logical solubility* and *normative defensibility* is clear).

  *(Self-Correction Note)*: I need to be careful with the "definite verdict." I shouldn't just say "ASP is better." I need to answer "whether the boundary problem admits of a principled solution." My answer will be: It admits of a *normative* solution, not a *procedural* one. ASP is the best normative guide.

  6.  **Final Output Generation** (Proceed to write the essay based on these thoughts).
answer: |-
  **The Paradox of the People: Assessing the Boundary Problem in Democratic Theory**

  Democracy is premised on the idea of self-rule, yet the constitution of the "self" that rules remains notoriously elusive. This is the essence of Frederick Whelan's "boundary problem": no democratic procedure can determine its own membership without presupposing the very membership it seeks to define. To vote on who votes is to already have voters. Whelan concludes that this circularity is insoluble within democratic theory, requiring an external, non-democratic criterion to fix the boundaries of the *demos*. In response, political theorists have proposed normative principles to serve as this external criterion. The two most influential are Robert Goodin's All-Affected-Interests (AAI) principle and the All-Subjected Principle (ASP) advanced by scholars such as Arash Abizadeh and David Owen. This essay argues that while neither principle fully escapes Whelan's logical circularity—both merely relocate the problem to the definition of their core terms—the ASP offers a superior normative solution. Unlike AAI, which dissolves the possibility of a bounded political community, ASP anchors the *demos* in the specific relationship of coercive authority that democracy is uniquely suited to regulate.

  To understand the force of the challenge, one must grasp Whelan's logical point. Democratic legitimacy flows from the consent or participation of the governed. However, if the scope of the governed is itself up for grabs, there is no pre-existing legitimate authority to decide it. If we attempt to use a democratic vote to decide the boundary, we must first decide who is eligible to cast that vote, leading to an infinite regress. Whelan suggests that boundaries are historically contingent facts, not democratic choices. Consequently, any principle proposed to solve this, such as AAI or ASP, cannot be derived *from* democracy; it must be a moral constraint *upon* democracy. The test, therefore, is not whether these principles avoid circularity entirely—Whelan suggests they cannot—but whether they relocate the circularity to a more defensible, stable, or morally coherent foundation.

  Robert Goodin's All-Affected-Interests principle posits that anyone whose interests are causally affected by a political decision should have a say in making it. On the surface, this captures a deep intuition about fairness: it is unjust to impose costs on those without representation. However, AAI struggles to escape Whelan's circularity because the application of the principle requires an antecedent determination of what counts as a relevant "affect." Causal chains are potentially infinite; a zoning decision in Toronto may affect housing prices in Vancouver, or carbon emissions in China. If "affected" is defined broadly, the *demos* for almost any decision becomes global. If it is defined narrowly, someone must decide where to cut the causal chain.

  Who makes that cut? If the existing *demos* decides who is affected, the boundary problem is merely internalized: the existing group protects its boundary by declaring outsiders "unaffected." If an external agent decides, we have merely relocated the boundary problem to that higher authority. Furthermore, AAI faces a temporal problem. Interests are affected by decisions before the decisions are made, but we often do not know who will be affected until after the fact. To apply AAI, one must presuppose a scope of analysis that already excludes certain potential effects. Thus, AAI does not solve the boundary problem; it masks it behind a utilitarian calculation that requires a prior, non-democratic stipulation of which interests count and how far causal ripples extend. By tending toward a global *demos*, AAI effectively abolishes the boundary problem by abolishing boundaries, rendering the concept of a distinct political community—and the specific accountability of a specific government—incoherent.

  In contrast, the All-Subjected Principle (ASP) grounds the *demos* in subjection to coercive law. As Abizadeh and Owen argue, democracy is primarily a mechanism for justifying coercion to those who must obey it. Therefore, the boundary of the *demos* should coincide with the boundary of the polity's coercive jurisdiction. This principle appears to offer a firmer grip on the boundary problem because coercion is institutionally specific. Laws are enacted by specific bodies and enforced within specific territories.

  However, ASP is not immune to Whelan's charge of circularity. To know who is "subjected," one must know the jurisdiction of the polity. But the jurisdiction is precisely what the boundary defines. If a state claims the right to exclude migrants at its border, is that border control an act of coercion subject to democratic authorization by the migrants themselves? Abizadeh argues yes: border controls are coercive acts that restrict freedom, so those excluded are "subjected" and should belong to the *demos* that authorizes the control. This creates a paradox: if outsiders must vote on border controls to legitimize them, the state cannot unilaterally control its boundary, yet it must have a boundary to define the voters. Like AAI, ASP requires a prior account of what constitutes the "polity" doing the coercing. It relocates the circularity from "who is affected" to "what constitutes a coercive framework."

  Despite this shared logical vulnerability, ASP is normatively superior to AAI for three reasons. First, it aligns with the fundamental justification of democracy. Democracy is not merely about maximizing interest satisfaction (as AAI implies); it is about political autonomy and freedom from arbitrary domination. The moral urgency of granting a vote is highest where an individual is forced to obey laws they had no hand in making. AAI dilutes this urgency by including those who are merely causally impacted but not legally bound. Second, ASP preserves the possibility of a bounded political community. AAI's tendency toward universal enfranchisement makes collective self-determination impossible, as no distinct group could ever make a decision without global ratification. ASP allows for a distinct *demos* while demanding that the scope of its coercion match the scope of its membership. Third, ASP provides a clearer mechanism for contestation. While defining "coercion" is difficult, it is institutionally traceable (statutes, enforcement, penalties) in a way that "interests" are not.

  Does this mean the boundary problem admits of a principled solution? If by "solution" we mean a logical formula that generates boundaries without presupposing them, Whelan is correct: no such solution exists. The constitution of the *demos* is a "pre-political" act that cannot be fully democratized without circularity. However, if by "solution" we mean a normative standard that guides how boundaries ought to be drawn and contested, a principled approach is possible. The circularity is not a dead end but a feature of political agency: the *demos* must constantly recreate itself through the very processes it authorizes.

  In this light, the All-Subjected Principle comes closest to providing a workable solution. It accepts Whelan's premise that the boundary cannot be decided *by* the procedure alone, but it supplies the necessary external criterion: the scope of coercive authority. While ASP requires a prior understanding of the polity, it ties that understanding to the specific moral harm democracy mitigates (unjustified coercion). AAI, by contrast, relies on a utilitarian metric that is too indeterminate to structure political institutions.

  Therefore, the verdict is that the boundary problem is logically insoluble but normatively manageable. We cannot escape the need for an external criterion, but we can choose the most defensible one. The All-Subjected Principle is that criterion. It acknowledges that while we cannot vote on who votes without presupposing a "who," we can demand that the "who" matches the scope of those forced to obey. By anchoring the *demos* in subjection rather than affect, ASP transforms the boundary problem from a logical paradox into a demand for political justice: wherever coercion ends, the democratic voice should not. This does not close the circle, but it tightens it enough to make democratic self-rule both coherent and morally defensible.
