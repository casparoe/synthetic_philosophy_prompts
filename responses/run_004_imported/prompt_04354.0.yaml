          *   Introduce Whelan's Boundary Problem (the paradox of self-constitution).
          *   Introduce the two contenders: AAI (Goodin) vs. ASP (Abizadeh/Owen).
          *   Thesis Statement: Neither fully escapes the logical circularity, but ASP provides a more workable normative framework because it ties membership to the specific justification of democratic authority (coercion), whereas AAI renders the concept of a bounded *demos* incoherent.

      *   **Section 1: Whelan's Circular Challenge:**
          *   Explain the logic: To decide the rules, you need voters. To decide voters, you need rules.
          *   Whelan's conclusion: It's a "pre-democratic" decision.
          *   Implication: Any principle offered (AAI or ASP) must be justified *externally* to democratic procedure.

      *   **Section 2: Assessing the All-Affected-Interests (AAI) Principle:**
          *   *The Claim:* Everyone impacted should vote. Intuitively appealing (fairness).
          *   *The Circularity/Relocation:* Who determines the causal chain of effects? Almost everything affects everyone eventually (butterfly effect).
          *   *The "Pre-definition" Problem:* To limit "affected," we need a prior cutoff. Who sets that cutoff? That's the boundary problem again.
          *   *Consequence:* Tends toward global demos. If the demos is everyone, borders vanish. If borders vanish, the specific accountability of a specific government is lost. It solves the boundary problem by abolishing boundaries, which is practically and theoretically problematic for distinct political communities.

      *   **Section 3: Assessing the All-Subjected Principle (ASP):**
          *   *The Claim:* Democracy is about justifying coercion. If you are subject to coercive law, you need a voice.
          *   *Strength:* Ties membership to the specific moral problem democracy solves (autonomy vs. authority).
          *   *The Circularity/Relocation:* Who defines the "polity" doing the coercing? To know who is subjected, we must know the jurisdiction. To know the jurisdiction, we need a boundary.
          *   *Abizadeh's Twist:* Border controls are coercive acts. Therefore, those excluded are "subjected" and should vote. This challenges the state's right to close borders.
          *   *Assessment:* It relocates the circularity to the definition of "coercive framework," but it is a *tighter* circle than AAI. It preserves the idea of a distinct political community while demanding justification for its exclusions.

      *   **Section 4: Comparative Weighing:**
          *   AAI is too expansive/indeterminate. It makes democratic decision-making impossible (infinite electorate).
          *   ASP is more institutionally grounded. It matches the *function* of the state.
          *   Both require an external normative commitment (Whelan was right about the "external" part).
          *   However, ASP's external commitment (freedom from arbitrary coercion) is more central to democracy than AAI's (maximizing interest satisfaction).

      *   **Conclusion/Verdict:**
          *   Reiterate that logical circularity is unavoidable (Whelan wins on logic).
          *   But political theory needs a working solution, not just logical purity.
          *   Defend ASP as the "closest to a solution."
          *   Nuance: ASP needs a complementary principle for *how* boundaries are drawn initially (perhaps a historical or territorial convention), but once drawn, ASP dictates membership better than AAI.
          *   Final thought: The boundary problem isn't a bug to be fixed, but a feature of political agency that requires ongoing democratic contestation (Owen's view on politicization).

