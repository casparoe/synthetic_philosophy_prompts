prompt: |-
  I got roped into serving on my university's academic integrity board this year (I'm just a staff member, no philosophy background or anything, though I did fall down a blog rabbit hole a while back about this idea called "common knowledge" and it's honestly never really left my head since). We've got a real case in front of us now where I think that idea actually applies, and I need to walk into Thursday's meeting with an actual recommendation, not just a gut feeling.

  Here's what happened: our intro stats final, like 300-some students, got compromised when someone posted a photo of the answer key to a Discord server about an hour before the last of three staggered exam sessions closed. Server logs suggest maybe a third of the class saw it, but there's basically no clean way to prove who actually used it versus who saw it and ignored it, sorting that out person by person would take a month of hearings on its own. Meanwhile it's become the worst kept secret on campus -- its all over the group chats, the whole class has basically heard by now, and alot of us on the board privately suspected the scale of it even before the logs confirmed anything. Half the board wants to quietly investigate the handful of provable cases and never put out anything official about how big the leak was, on the theory that "everyone already basically knows, so an official statement doesn't tell anyone anything they don't already believe." The other half thinks that's missing something -- that a rumor everyone privately half-believes isn't the same as the university actually confirming it, and that the confirming part is specifically what would let the class do something collectively, like demand the exam get voided for everyone, instead of every student individually assuming nobody else would back them up. I mentioned this to a friend doing a CS PhD and he said something about "the two generals problem" and how everyone knowing something isn't the same as it being common knowledge, but he lost me before he could explain why that would actually matter here.

  Could you write the actual memo I'd bring to the board? I need a real recommendation -- confirm the scale publicly, keep it quiet and case by case, or some third option -- with a real timeline attached, since final grades are due in three weeks. And I need it to actually engage with the "it's not new information so it shouldn't matter" side rather than just brushing past it, because that's what half the room believes and I won't get anywhere if I can't respond to it directly.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Staff member on a university academic integrity board (no philosophy background).
      *   **Task:** Write a memo for the upcoming Thursday meeting.
      *   **Scenario:** Intro Stats final (300+ students) compromised. Answer key leaked on Discord 1 hour before the last of 3 staggered sessions ended. Logs show ~1/3 saw it, but impossible to prove individual usage. Rumors are widespread ("worst kept secret").
      *   **The Conflict:**
          *   *Side A (Quiet/Case-by-Case):* Investigate provable cases only. No official statement on scale. Rationale: "Everyone already knows, so an official statement adds nothing."
          *   *Side B (Public Confirmation):* Officially confirm the scale. Rationale: Rumor $\neq$ Official Fact. Needed for collective action (e.g., demanding exam voiding).
      *   **Key Concept:** "Common Knowledge" (specifically the CS/Logic/Game Theory distinction, referencing the "Two Generals Problem").
      *   **Requirements:**
          *   Real recommendation (Confirm, Quiet, or Third Option).
          *   Real timeline (Grades due in 3 weeks).
          *   Directly engage with Side A's argument ("It's not new info").
          *   Tone: Professional, persuasive, actionable, accessible (no jargon without explanation).

  2.  **Deconstruct the "Common Knowledge" Concept:**
      *   *Mutual Knowledge:* Everyone knows $X$.
      *   *Common Knowledge:* Everyone knows $X$, *and* everyone knows that everyone knows $X$, *and* everyone knows that everyone knows that everyone knows $X$ (ad infinitum).
      *   *Why it matters here:* If it's just mutual knowledge (rumors), Student A might think, "I know the exam was leaked, but if I complain, I might be the only sucker who fails while everyone else passes." They lack assurance that others will act with them.
      *   *Official Statement:* Turns mutual knowledge into common knowledge. It creates a focal point for coordination.
      *   *Two Generals Problem:* This is about *reliable communication* over an unreliable channel. While relevant to the *concept* of coordination, it's slightly technical. The memo should focus more on the *coordination game* aspect (Stag Hunt) rather than the impossibility proof of the Two Generals Problem, but the user's friend mentioned it, so I should acknowledge the intuition behind it (coordination requires shared certainty).

  3.  **Evaluate the Options:**
      *   *Option 1: Quiet/Case-by-Case.*
          *   *Pros:* Less work short-term, avoids PR scandal.
          *   *Cons:* Unfair (punishes few, lets many slide), erodes trust long-term, doesn't solve the grading validity issue. If 1/3 saw it, the curve is broken.
          *   *Counter to Side A:* It *is* new information in a functional sense. Private belief $\neq$ Public fact.
      *   *Option 2: Public Confirmation + Void Exam.*
          *   *Pros:* Fairness, restores integrity, solves the coordination problem.
          *   *Cons:* Logistical nightmare (new exam?), delays grades, PR hit.
      *   *Option 3 (The "Third Option" Hybrid):* Public Confirmation + Alternative Assessment/Adjustment.
          *   *Rationale:* Acknowledging the leak validates the students' concerns (solving the coordination issue) without necessarily requiring a full re-sit if time is tight. Maybe a curve adjustment, or a supplemental assignment, or voiding the exam weight.
          *   *Decision:* Given the "grades due in 3 weeks" constraint and the "1/3 saw it" scale, a full re-sit is risky. However, grading as-is is invalid. The strongest ethical and practical stance is **Public Confirmation + Invalidating the Exam Scores (replacing weight or alternative assessment).** This aligns with Side B but adds a practical solution.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Subject:** Clear and urgent.
      *   **Executive Summary:** The bottom line up front. Recommendation: Public Confirmation + Exam Invalidation.
      *   **The Core Argument (The "Common Knowledge" Piece):** This needs to be the highlight. Explain *why* Side A is wrong without using heavy jargon.
          *   *Analogy:* Standing ovation. Everyone wants to stand, but no one does until one person does, signaling it's safe.
          *   *Application:* Students won't report/contest individually because they fear being the only one. Official statement makes it safe to act collectively.
      *   **Addressing Side A:** Directly tackle the "Everyone already knows" argument. Distinguish between *rumor* (private belief) and *fact* (institutional acknowledgment).
      *   **Recommendation & Timeline:**
          *   Week 1: Announcement & Plan.
          *   Week 2: Implementation (Alternative assessment or re-weighting).
          *   Week 3: Grading & Submission.
      *   **Risk Mitigation:** Address the PR risk and the workload.

  5.  **Refining the Tone:**
      *   Needs to sound like a staff member who has done their homework, not a philosopher.
      *   Avoid saying "As per Game Theory..." instead say "In terms of group coordination..."
      *   Make sure the "Two Generals" reference is acknowledged but translated into administrative terms (Coordination/Trust).
      *   Ensure the timeline is realistic (3 weeks is tight but doable for a stats class).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the "Two Generals" reference accurate?
      *   *Correction:* Technically, Two Generals is about *impossibility* of consensus over unreliable channels. Here, the University *is* the reliable channel. So the memo should frame the University Statement as the *solution* to the Two Generals problem (the reliable broadcast), not the problem itself.
      *   *Critique:* Is voiding the exam feasible in 3 weeks?
      *   *Correction:* Creating a new exam is hard. Re-weighting other assignments or a take-home project is easier. I should suggest re-weighting or a simplified alternative to ensure feasibility.
      *   *Critique:* Did I address the "1/3 saw it" vs "300 students" issue?
      *   *Correction:* Yes, the point is the *integrity of the metric* is broken, regardless of who used it.

  7.  **Final Polish:** Check the "Common Knowledge" explanation. Make sure it lands. (The "Open Secret" vs. "Official Record" distinction).

      *(Self-Correction on the "Common Knowledge" explanation)*: I need to be careful not to get too abstract. The key is *coordination*. If I think the exam is compromised, but I think *you* think it's fine, I won't complain. If we *both know* that *we both know* it's compromised, we can act together. The University statement creates that shared certainty.

  8.  **Finalizing the Recommendation:** I will recommend **Public Confirmation + Nullification of Exam Scores**. This is the only way to preserve integrity given the scale. Case-by-case is impossible and unfair.

  9.  **Drafting the Content:** (Proceeding to generate the memo based on these thoughts).

      *   *Wait, one nuance:* The prompt asks to engage with the "it's not new information" side. I need to make sure I explicitly validate their intuition (yes, people know) but explain why it's functionally different (no, they don't know *officially*).
      *   *Timeline:* 3 weeks.
          *   Days 1-2: Decision & Drafting.
          *   Day 3: Town Hall/Email.
          *   Days 4-14: Alternative assessment/Re-weighting.
          *   Days 15-21: Grading & Submission.

  10. **Final Review against constraints:**
      *   Memo format? Yes.
      *   Recommendation included? Yes.
      *   Timeline included? Yes.
      *   Engages Side A? Yes.
      *   Explains Common Knowledge/Two Generals intuition? Yes.

