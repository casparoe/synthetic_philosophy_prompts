      *   *Initial thought:* Make it about a self-driving car. *Correction:* Too action-oriented. Medical/Elder care is more intimate and fits the "what do they want" theme better.
      *   *Focus:* Ensure the distinction between "Rational Agent wanting X" and "Biased Agent wanting Y" is clear.
      *   *Example:* She kept renewing a subscription she never used.
          *   Interpretation 1: She values having it available (Rational, Utility > Cost).
          *   Interpretation 2: She hates losing things (Loss Aversion Bias, Utility < Cost but she can't quit).

  8.  **Final Polish:**
