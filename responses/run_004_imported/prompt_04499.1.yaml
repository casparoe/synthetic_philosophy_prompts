  5.  **Address Requirement 3: The Verdict (Part I - The Maxim):**
      *   *The Maxim:* Falsehood of testimony must be *more miraculous* than the event.
      *   *The Event:* A craft moving instantaneously, no control surfaces, trans-medium. (Violation of inertia, aerodynamics, etc.)
