      *   *The Core Argument (Part I):* A priori. A miracle is a violation of a law of nature. Laws of nature are established by "firm and unalterable experience." Testimony is also based on experience. We weigh the evidence. It is always more probable that the testimony is false than that the law of nature was violated. "No testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous, than the fact, which it endeavours to establish."
      *   *The Practical Argument (Part II):* Four observations about actual miracle claims in history.
          1.  No sufficient number of men of unquestioned good sense, education, and integrity.
          2.  The human passion for the marvelous/surprising.
          3.  Reports come chiefly from ignorant and barbarous nations (or times).
          4.  Different religions have rival miracles, which cancel each other out (destroy the evidential force for *any* specific religion).

  3.  **Address Requirement 1: Definition & Applicability:**
      *   *Hume's Definition:* Explicitly involves a Deity or invisible agent violating a law of nature.
