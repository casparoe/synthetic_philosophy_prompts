prompt: |-
  So I had this argument with my friend Jonas last night that's still bugging me. We were a few beers in and somehow ended up talking about the Pentagon UAP videos — the Nimitz "tic tac" thing from 2004, and the Gimbal/GoFast ones from 2015 that leaked in 2017 and then got officially declassified by the DoD in 2020 — and whether any of that should move a rational person toward thinking something genuinely physics-violating is going on. Jonas's argument was basically: "your the philosophy person, doesn't Hume's whole essay on miracles just fall apart against cases like this? His argument leans so hard on the fact that you never actually get good witnesses to miracles — they're always ignorant, superstitious, motivated to lie or self-deceive — but here you've got multiple trained fighter pilots, radar corroboration from a whole carrier strike group, IR footage, and the government itself releasing the footage and later (in the 2021 ODNI report) admitting these are unexplained. Doesn't his whole argument just collapse once the testimony is actually first-rate?" I mumbled something back about how these aren't claimed to be supernatural so maybe Hume's argument doesnt even apply in the first place, but I couldn't make that precise, and we just ended up going in circles.

  Can you actually reconstruct this properly, the way Hume himself would, using the specific machinery of "Of Miracles" rather than a generic "Hume=skeptic" vibe? Three things I'd love: (1) By Hume's own definition of a miracle (a violation of a law of nature via the "interposition" of a deity or invisible agent), would he even count UAP claims as candidate miracles at all, or do they fall entirely outside what his essay was built to handle — and if it's the latter, does extending his argument to cover "secular" violations of known physics require smuggling in assumptions he'd actually reject? (2) Assuming that extension is granted anyway, walk through his four subsidiary reasons for why miracle testimony always fails in practice (witness quality/quantity, the love of the marvelous, the "ignorant and barbarous nations" bit, and rival miracles cancelling each other out) and tell me which of those specifically still bite against this evidence and which ones he'd basically have to concede given trained-pilot-plus-radar-plus-government-release testimony. (3) Then give me your best reconstruction of his actual verdict — does this evidence get anywhere near his maxim that the testimony's falsehood would have to be more miraculous than the fact itself, or is there some less obvious reason, still internal to his framework, that he'd stay unmoved anyway?
