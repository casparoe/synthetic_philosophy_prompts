answer: |-
  The banquet hall hummed with the clatter of silverware and the low drone of a hundred academic conversations. Elena swirled the Pinot Noir in her glass, refusing to look at Julian until she spoke.

  **Elena:** You're still chasing ghosts, Julian. Kant was explicit in the *Lectures on Ethics*. Duties regarding animals are indirect duties to humanity. Cruelty is wrong because it coarsens *us*, not because it harms *them*.

  **Julian:** Kant was explicit about the conclusion, Elena, not the justification. He didn't follow his own premises to their end. If I value myself as a rational agent, I have to value the animal nature that makes that rationality possible.

  **Elena:** That's the category error. Valuing the *conditions* of my agency isn't the same as valuing the *ends* of another creature. My pain matters to me because I'm an animal, yes, but that doesn't make my pain a moral end for you.

  **Julian:** Doesn't it? If your suffering is a bad thing for you, consistency demands I acknowledge it as a bad thing *simpliciter*. I can't value my own natural good without committing to the value of natural good wherever it occurs.

  **Elena:** You're conflating "good-for" with "good-in-itself." A dog has a good—it wants to eat, to run. But that good doesn't bind a rational will directly. Dignity belongs to the legislator of the moral law, not the sentient being.

  **Julian:** So dignity is a binary switch? You're either a lawgiver or you're furniture? What about the infant? What about the severely cognitively disabled human? They can't legislate the moral law. Are they furniture too?

  **Elena:** We owe them protection because they are members of the human community, bearers of potential, or objects of our shared sympathy. We don't need to grant them metaphysical dignity to owe them care.

  **Julian:** That's speciesism dressed up as sentimentality. You're protecting the infant because it's *ours*, not because of what it *is*. My view protects the infant for the same reason it protects the dog: because both are creatures for whom things can be good or bad.

  **Elena:** And in doing so, you erase the distinction that grounds human rights. If the dog and the infant stand on the same ground, then the philosopher stands on that ground too. You reduce autonomy to biology.

  **Julian:** No, I layer it. We owe animals direct duties of non-harm because of their sentience. We owe rational humans *additional* duties of respect because of their autonomy. You're terrified that admitting the first floor undermines the second.

  **Elena:** I'm terrified that you're building the second floor on sand. If obligation is tethered to sentience, then the intensity of the obligation tracks with the intensity of the sentience. A pig might suffer more than a comatose patient. Does the pig outweigh the patient?

  **Julian:** The patient has a biographical life, a history, relationships. The harm of death is different for a being with a conception of a future. I'm not saying all lives are equal, Elena. I'm saying all suffering counts directly.

  **Elena:** But *why* does it count directly? For Kant, it only counts because a rational being *takes it to count*. You're trying to smuggle objective value into a framework that locates value in the rational will.

  **Julian:** I'm locating value in the fact that we *are* rational wills embodied in animal nature. We aren't ghosts in machines. To reject the moral claim of the animal is to reject a part of what we are.

  **Elena:** It's to recognize that morality is about freedom, not nature. If I spare the dog only because it suffers, I'm acting on inclination, on pathos. If I spare it because it damages my virtue, I'm acting on duty.

  **Julian:** And if that duty is based on a lie? If the premise that animals are merely means is false? Then your virtue is just rigorous consistency in error.

  **Elena:** Better rigorous error than a sentimentalism that collapses the kingdom of ends into a zoo of competing pains. You want to expand the circle, but you dissolve the boundary that makes the circle matter.

  **Julian:** The boundary matters. But the boundary is between those who can be held responsible and those who can't. It isn't a boundary between those who matter and those who don't.

  **Elena:** (She finally looks at him, eyes sharp.) Ten years, and you still think you can fix the Metaphysics of Morals with a patch job. You're not arguing with Kant anymore, Julian. You're arguing with me.

  **Julian:** (He lifts his glass, a small, sad smile.) Ten years, and you still think defending the text is the same thing as defending the truth. I'm arguing with the part of you that knows I'm right.

  **Elena:** Then we'll both be arguing until the wine runs out.

  **Julian:** Good. Because I'm not drinking alone tonight.
