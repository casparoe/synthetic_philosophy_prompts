answer: |-
  **Setting:** *The university library café, late afternoon. The reading group has dispersed, leaving stacks of books and half-empty mugs on a corner table. Outside, the autumn light is fading. **Elena** (specializing in normative ethics) and **Marcus** (specializing in political philosophy and social ontology) are the last to leave. They are both tenured, both tired, and both unwilling to let the earlier disagreement rest.*

  **Elena:** You're not actually going to let that stand, are you? The idea that the climate scientist's argument evaporates because he took a private jet?

  **Marcus:** (Stirring sugar into a cold espresso) I didn't say the argument evaporates, Elena. I said the *blame* misfires. There's a difference between the truth of a proposition and the appropriateness of a speech act. If I tell you to stop smoking while I'm lighting a cigarette, I haven't said anything false. But I've lost the right to demand an answer from you.

  **Elena:** "Lost the right." That's the phrase I'm stuck on. It sounds like you're granting the target of the blame a get-out-of-jail-free card. If the scientist is right that emissions kill, the moral obligation exists independently of his travel itinerary. By focusing on his hypocrisy, the group was engaging in a classic *tu quoque*. It's a distraction from the carbon budget.

  **Marcus:** It's not a distraction if blame is relational. Think of it like a contract. When I blame you, I'm invoking a shared norm. I'm saying, "We both agree on X, and you violated it." If I am currently violating X, I'm signaling that I don't actually hold X to be binding. So why should you feel bound by it? You aren't waving off the *truth* of the claim; you're rejecting my *authority* to enforce it.

  **Elena:** Authority? This isn't a courtroom. In the moral sphere, truth is the only authority that matters. But let's get precise, because "forfeiting standing" is doing a lot of heavy lifting here. Does hypocrisy *silence* the blamer? Like, if I'm a hypocrite, is my blame literally unintelligible? Or is it just that I look bad?

  **Marcus:** (Pauses) Silencing is too strong. I'll concede that. It's not that the words become noise. It's that the normative force is depleted. Imagine a biased witness in court. Their testimony isn't erased from the record, but the jury is instructed to treat it with skepticism. The hypocrite's blame remains an accusation, but the target is entitled to say, "Who are *you* to ask this of me?" without having to address the content.

  **Elena:** Okay, I can accept that it weakens the *rhetorical* force. But you said earlier the target is entitled to "wave it off." That implies the moral work stops there. But surely the hypocrisy itself becomes a *new* topic of blame? If the scientist says, "Don't fly," and he flies, I can't ignore the emissions. I have to say, "You're right, flying is bad. And you're doing it. So you're also blameworthy." The conversation doesn't end; it expands.

  **Marcus:** (Nods slowly) That's a fair pushback. The conversation doesn't end, but the dynamic shifts. It shifts from a vertical relationship—me holding you to account—to a horizontal one, where we are both accountable to each other. But here is where I need to test my own view. Let's take the reformed sinner. The tax cheat who stops cheating and then berates current tax cheats. Do they have standing?

  **Elena:** Intuitively, yes. Much more than the active cheat.

  **Marcus:** Exactly. But why? If standing is forfeited by the *act* of violation, the past act should stain them forever. If standing is forfeited by the *current* commitment to the norm, they regain it.

  **Elena:** So you're saying standing depends on current endorsement of the norm, not just behavioral compliance?

  **Marcus:** I think so. It's about repudiation. The active hypocrite implicitly endorses the exception for themselves. The reformed sinner repudiates their past self. They say, "I was wrong to do that, and you are wrong to do it." That restores the shared ground.

  **Elena:** But this creates a problem for your view on the climate scientist. What if he hates flying? What if he believes it's morally abhorrent, but he does it anyway because of weakness of will—*akrasia*? He isn't claiming an exception; he's failing to live up to a standard he genuinely holds. Does he lose standing then?

  **Marcus:** (Frowns, leaning back) That's the hard case. If it's pure weakness of will... I want to say he retains some standing. Because he isn't denying the norm. But then, isn't that what most hypocrites claim? "I'm only human."

  **Elena:** Precisely. If you make standing dependent on internal sincerity, it becomes unfalsifiable. But if you make it dependent on external behavior, the reformed sinner never gets standing back. You need a middle ground.

  **Marcus:** (Taps the table) Okay. I'll adjust. It's not about perfect compliance. It's about *integrity of the demand*. If I demand you do something I find too costly to do myself, without acknowledging the cost, I'm lying about the nature of the obligation. I'm pretending it's easy when it's hard. So, the scientist loses standing not because he flies, but if he pretends flying isn't a sacrifice.

  **Elena:** That I can live with. It moves the charge from "you did the thing" to "you are misrepresenting the burden of the norm." But now, let's hit you with the Cohen puzzle. You remember the essay on terrorism?

  **Marcus:** G.A. Cohen. Yes. The question of who has the standing to condemn terrorists.

  **Elena:** Right. Cohen suggests that a bystander who is "pure" only because they were never in a position to commit terrorism—the person who never had the temptation, the opportunity, or the desperation—might have *less* standing than someone who struggled with it. The "untested purity" is cheap.

  **Marcus:** I recall. The idea that moral credibility requires some risk.

  **Elena:** So, apply that to our scientist. If the scientist flies, he is tested. He knows the pressure to attend the conference, the prestige, the networking. He is failing the test, but he is *in* the test. The person who never flies because they can't afford a ticket, or who never became a scientist—do they have *more* standing than him?

  **Marcus:** (Sighs) If I stick to my "shared norm" theory, the bystander has standing because they aren't violating the norm. But Cohen is right to make us uneasy. If I condemn a soldier for cowardice, but I've never been under fire, my blame feels thin. It lacks solidarity.

  **Elena:** So, does the hypocrite have *more* standing than the untested pure?

  **Marcus:** No, I can't go that far. The hypocrite violates the norm. The untested pure upholds it, even if by luck. But... (he pauses) ...perhaps the *quality* of the blame differs. The untested pure can state the rule. The hypocrite, if they acknowledge their failure, can speak to the *cost* of the rule.

  **Elena:** So the hypocrite doesn't lose standing entirely, but the *content* of their blame must change? They can't say, "Don't fly, it's easy." They have to say, "Don't fly, it's hard, I failed, but we must."

  **Marcus:** (Eyes light up) Yes. That's the adjustment. Hypocrisy doesn't necessarily strip you of standing *if* it is accompanied by confession. The "standing" isn't a binary switch. It's a spectrum of moral credit. The active, unrepentant hypocrite is bankrupt. The struggling, self-aware hypocrite is in debt, but can still speak. The untested pure has credit, but it's credit they didn't earn.

  **Elena:** And the reformed sinner?

  **Marcus:** They have the most standing. They have the credit of compliance plus the knowledge of the cost.

  **Elena:** Okay. So, going back to the library group. Half of us thought the hypocrisy charge was irrelevant because the science is true. The other half thought the hypocrisy voided the message.

  **Marcus:** And I think we've agreed it's neither. The science remains true—that's your point. But the *moral demand* loses its force if the blamer pretends the cost doesn't exist. The group wasn't wrong to feel irritation. It wasn't just *ad hominem*; it was a detection of false representation.

  **Elena:** And I will concede that the irritation wasn't just emotional. It was a recognition that the *relationship* required for moral community was broken. If we are all asked to sacrifice, but the leader exempts themselves silently, the contract is voided.

  **Marcus:** But only if it's silent. If the scientist says, "I am flying, and I know this is wrong, and I am accumulating a moral debt I hope to pay elsewhere," does the standing return?

  **Elena:** (Smiles) Now you're asking if confession is a currency. I think it buys back *some* standing. It restores the honesty, even if it doesn't fix the carbon.

  **Marcus:** So the target can't simply wave it off anymore. They have to engage with the confession.

  **Elena:** Exactly. Which makes the conversation harder, not easier.

  **Marcus:** (Looks at his watch) Philosophy usually does that.

  **Elena:** It does. But I think we've moved from "You too" to "Who are we to ask this of each other?" That's a better question for the next meeting.

  **Marcus:** Agreed. Though I suspect the group will still split in half. Old habits are harder to break than carbon emissions.

  **Elena:** (Standing up) Speak for yourself. I'm taking the bus home.

  **Marcus:** (Laughing) I'll walk. See you next week, Elena.

  **Elena:** Next week, Marcus.
