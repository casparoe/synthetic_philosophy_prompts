          *   Event E: Extinguisher fails/Expires.
          *   Outcome O: Extra damage.
          *   Counterfactuals:
              *   If Ana checked -> O likely prevented.
              *   If Theo checked -> O likely prevented.
              *   If Landlord checked -> O likely prevented.
              *   If BiL assigned duty -> O likely prevented.
          *   Since all are omissions (failures to act), standard counterfactual theories of causation (like Lewis's) struggle. If $A$ didn't happen, and $B$ didn't happen, and $C$ didn't happen... did $A$'s not-happening *cause* the result?
          *   *Preemption/Overdetermination:* If Ana had checked, the Landlord's failure wouldn't matter. If the Landlord had checked, Ana's failure wouldn't matter. This looks like symmetric overdetermination of omissions.
      *   **Responsibility (Ethics/Agency):**
