answer: |-
  Colleague to colleague: I know exactly the itch you're describing. It's the frustration of watching a clean, abstract puzzle get muddy with human stakes, where the "correct" theoretical answer (everyone is a necessary condition in a counterfactual web of omissions) is useless to the person bleeding on the floor.

  You asked for my best answer, not a shrug. Here is the distinction you need to draw to help Ana, and it requires separating **metaphysical causation** from **normative responsibility**. They are not the same thing, and conflating them is exactly why Ana is miserable.

  ### 1. The Metaphysics: Symmetric Overdetermination of Omissions
  Strictly speaking, yes, Ana's failure to check the tag is *a* cause of the extra damage. Under a standard counterfactual analysis (if Ana had checked, the extinguisher would have been replaced, and the damage would have been mitigated), her omission is causally relevant.

  But so are the other three.
  *   If Theo had checked, damage mitigated.
  *   If Landlord had walked through, damage mitigated.
  *   If BiL had assigned the duty, damage mitigated.

  This is a textbook case of **symmetric overdetermination by omission**. In metaphysics, we often throw up our hands here and say "the whole set caused it." But in the real world, we cannot operate that way. We need to allocate blame to fix the system. If you tell Ana "you are a cause," you are technically right but morally misleading, because it implies she is *the* locus of the failure. She isn't. She is merely one link in a chain where *every* link failed simultaneously.

  ### 2. The Normative Layer: Why "Expectations" Aren't Just Psychology
  You asked if the different flavors of expectation (habit vs. contract vs. duty) should change who we single out, or if that's irrelevant psychology.

  **They are not irrelevant.** They constitute **deontic status**.

  In ethics and law, we do not treat all causal contributions equally. We weight them by *duty*.
  *   **The Landlord:** Has a **contractual duty**. This is the strongest external obligation. They breached a legal agreement.
  *   **The Brother-in-Law (BiL):** Has a **fiduciary/managerial duty**. As the owner, safety systems are ultimately his responsibility. By leaving it as an "unspoken habit," he committed a category error. He privatized a public safety requirement into an informal social norm. That is a management failure, not an employee failure.
  *   **Ana:** Had a **habitual expectation**. This is the weakest form of obligation. It is supererogatory (good to do) but not obligatory.
  *   **Theo:** Had **no expectation**.

  Here is the hard truth you can offer Ana: **A safety system that relies on an employee's unpaid, unassigned vigilance is a broken system.**

  Ana feels guilty because she broke a *personal* norm. But in a professional hierarchy, personal norms cannot override formal structures. If the BiL wanted Ana to be responsible for the extinguisher, he had a duty to make that her job description. By not doing so, he left her in a "reliance trap." He relied on her habit without compensating her for that risk or giving her the authority to enforce it.

  Therefore, the "flavors of expectation" are not psychological biases; they are the **metric of culpability**. Ana is the *least* culpable, despite feeling the *most* responsible.

  ### 3. Why Attention "Snags" on Ana (The Salience Bias)
  You noted that attention snags on Ana. Why? Because her failure is a **deviation from a local pattern**, whereas the others' failures are **deviations from a background structure**.

  *   Ana *usually* checks. Her not checking is a visible event (a change in the figure).
  *   The Landlord is *always* slow/bureaucratic. Their delay is background noise (the ground).
  *   The BiL *never* assigned the job. His inaction is a constant state.

  Human cognition is wired to notice changes in patterns, not constant states of negligence. Ana is suffering because she is the most **salient** cause, not the most **significant** one. She is the visible symptom of a systemic disease.

  ### 4. What to Say to Ana (The Dinner Table Script)
  Do not tell her "it wasn't your fault." That sounds like platitudes. Do not tell her "causation is complicated." That sounds like a lecture.

  Tell her this:

  > "Ana, I've been thinking about the fire from a logical perspective. In a chain of safety, there are usually three layers: the person who does the work, the person who manages the system, and the person who inspects the building.
  >
  > You were the only one trying to be the manager without the title or the pay. You built a safety net out of your own care, and then the actual safety nets (the landlord's inspection and [BiL]'s management) failed at the same time.
  >
  > It feels like your fault because you're the one who usually catches it. But that's exactly why it *isn't* your fault. A business cannot run on 'usually.' If [BiL] wanted you to be responsible for the extinguisher, he needed to make that your official job. By leaving it as a habit, he made the bakery's safety depend on you being perfect every single time, while giving everyone else a pass.
  >
  > You didn't burn the place down. You just stopped doing someone else's job for a month, and the system collapsed because it was never built to stand without you doing that for free. That's on the structure, not on you."

  ### Summary for You
  *   **Did she cause it?** Counterfactually, yes. But so did three others. Causal overdetermination means no single omission is *the* cause.
  *   **Is she responsible?** No. Responsibility tracks duty, not just causal influence. Her duty was informal; the others were formal. Formal duties trump informal habits in liability.
  *   **The Takeaway:** Her guilt is a cognitive bias (Salience) mistaking a symptom for the disease. The disease is the BiL's failure to formalize safety protocols.

  Ana's misery is the cost of her own competence. She cared more than the system required, and now she's paying for the system's failure. Make sure she knows that her "failure" is actually evidence of her goodwill, and the real failure belongs to the people who were paid to ensure that goodwill wasn't the only thing keeping the place safe.
