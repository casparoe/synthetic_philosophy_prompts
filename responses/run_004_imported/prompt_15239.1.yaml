answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name]. I had the privilege of being [Advisor's Name]'s PhD student many years ago.

  Looking around this room, I realize we have a unique demographic split. About half of you are philosophers who know exactly what "non-reductive physicalism" means. The other half are family and friends who have simply heard [Advisor's Name] explain it at Thanksgiving dinner for twenty years while carving the turkey. To the book club: I promise to keep the jargon to a minimum. To the faculty: I promise to keep the rigor just high enough that [Advisor's Name] doesn't roll her eyes.

  For thirty-five years, [Advisor's Name]'s career was defined by a single, high-stakes argument. On one side was Jaegwon Kim, who posed a terrifying question: If the physical world is causally closed—meaning every physical event has a sufficient physical cause—then what work is left for the *mind* to do? If my neurons firing are enough to make me raise this glass, then my *reason* for raising it—my gratitude, my love, my intent—is just a shadow. It's what we call "epiphenomenal." It's a smoke signal that doesn't actually signal anything.

  If Kim is right, then strictly speaking, my gratitude for [Advisor's Name] isn't actually *doing* anything here. My neurons are doing all the work. I'm just along for the ride.

  But [Advisor's Name] spent her life proving Kim wrong. She argued that mental states aren't shadows. They are *proportionate* causes. She used the example of a pigeon trained to peck at red objects. You could say the pigeon pecks because of a specific wavelength of light—scarlet. But if you change it to crimson, the pigeon still pecks. The specific shade isn't the real cause. "Redness" is the cause. The determinable, not just the determinate.

  I'll admit, I never fully understood the pigeon experiment. But I understand the lesson. The physical details are too specific to explain the outcome. You need the higher-level description to capture what's actually happening.

  And that brings me to why I'm standing here. I work in AI alignment now. I spend my days worrying about whether we can build systems that understand reasons, not just correlations. It's easy to get cynical. It's easy to look at a human being and see just a bag of biology, or look at a neural network and see just math. It's easy to think that "reasons" and "values" are just stories we tell ourselves to make the physics feel better.

  [Advisor's Name] never let us settle for that. She taught us that if you want to explain why a student leaves academia to work on safety, or why a colleague writes a paper, or why a room full of people shows up on a Tuesday night, "neurons firing" is the wrong level of analysis. It's too granular. It misses the cause.

  The proportionate cause of me standing here isn't the specific synaptic firing in my motor cortex. The proportionate cause is *gratitude*.

  If I were to accept Kim's view, I would have to say that my thanks are an illusion, screened off by physics. But because of [Advisor's Name]'s work, I can stand here and argue that my gratitude is the most real thing in the room. It is the variable that tracks with the effect. It is the cause that is proportional to the occasion.

  She fought for thirty-five years to ensure that our minds, our reasons, and our values weren't written out of the causal story of the universe. She insisted that when we say "I did this because I cared," that sentence is true. Not poetically true. *Causally* true.

  So, to the family: Thank you for sharing her with us, even when she was grading papers during commercial breaks.
  To the faculty: Thank you for keeping the argument alive.
  And to [Advisor's Name]: Thank you for teaching me that high-level things matter. That reasons have power. And that my gratitude for you is not a shadow cast by my brain, but a force in its own right.

  Please raise your glasses.

  To [Advisor's Name]: May your retirement be causally sufficient for happiness, may your reasons never be screened off, and may you finally get to take a nap without supervening on anyone.

  Cheers!
