      *   *Advisor's Solution (Proportionality/Yablo):* Mental properties are *determinables* (e.g., "red"), physical are *determinates* (e.g., "scarlet"). The determinable is the *proportionate* cause. It captures the causal relevance without being redundant. The mental cause isn't a shadow; it's the right level of description for the effect.
