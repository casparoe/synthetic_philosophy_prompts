answer: |-
  This is a fantastic teaching moment, and your student is asking one of the classic questions that has tripped up economists and philosophers for decades. It is also a very common confusion in the "rationalist" community, where *Fortune's Formula* and Ole Peters' ergodicity economics often get circulated as revolutionary refutations of standard decision theory.

  The short answer is: **Your student is making a category error.** Kelly betting does not refute Expected Utility Theory (EUT); it is a specific *instance* of it. However, the student is correctly identifying that maximizing *Expected Value* (linear utility) is irrational in repeated gambles, and they are correctly sensing that time averages matter.

  Here is a breakdown of where the argument holds up, where the sleight of hand lies, and how you can disentangle this for your seminar without needing stochastic calculus.

  ### 1. The Category Error: Kelly is a Subset of EUT
  The student's primary mistake is treating Expected Utility Theory as synonymous with maximizing expected *monetary* value (linear utility).

  *   **Expected Utility Theory (vNM):** This is a formal framework. It states that if an agent's preferences satisfy certain axioms (completeness, transitivity, independence, continuity), they act *as if* they are maximizing $E[U(x)]$. Crucially, **vNM does not specify what $U(x)$ is.** It could be linear, concave, convex, or logarithmic.
  *   **Kelly Criterion:** This strategy maximizes the expected growth rate of wealth. Mathematically, maximizing the expected growth rate of wealth is equivalent to **maximizing the expected value of the logarithm of wealth.**

  Therefore, a Kelly bettor **is** an expected utility maximizer; they just have a logarithmic utility function ($U(w) = \ln w$).

  **The Classroom Point:** You can tell your student that they haven't refuted EUT; they have simply argued for a specific utility function (logarithmic) over another (linear). The debate isn't "EUT vs. Kelly"; it is "Which Utility Function is Rational?"

  ### 2. The Asymptotic Fallacy (The "Long Run" Argument)
  The student's stronger argument is the asymptotic one: *"A Kelly bettor will almost surely end up richer than any other bettor given enough time. Therefore, rationality requires Kelly."*

  This relies on the theorem that the Kelly strategy dominates other strategies with probability 1 as $N \to \infty$. While mathematically true under specific conditions, using this as a normative rule for rationality contains a sleight of hand regarding **finite horizons** and **discounting**.

  Paul Samuelson wrote a famous paper on this in 1971 ("The 'Fallacy' of Maximizing the Geometric Mean"). His critique was essentially:
  *   **The Limit is Not the Journey:** Just because a strategy wins in the infinite limit doesn't mean it has higher expected utility in any finite timeframe relevant to a human life.
  *   **The Risk of Ruin:** Strategies that maximize long-run growth can have massive volatility in the short run. If you have a finite horizon (you will die, or you need to eat), the "almost surely richer in the limit" guarantee is cold comfort if you go bankrupt in year 5.
  *   **Expected Utility of the Limit $\neq$ Limit of Expected Utility:** You cannot simply swap the expectation operator and the limit. A strategy might yield infinite wealth with probability 1 in the limit, but if the probability of surviving to see that wealth is low enough, the *expected utility* today might be lower than a safer strategy.

  **The Classroom Point:** Ask the student: "If you are 80 years old, does it matter that a strategy would have made you the richest person in history if you lived for 10,000 years?" Rational choice is about optimizing over the agent's actual constraints, not an asymptotic horizon they will never reach.

  ### 3. The Ergodicity Angle (Where the Student is Onto Something)
  Since your student reads rationalist blogs, they are likely indirectly referencing the work of **Ole Peters** and **Murray Gell-Mann** on **Ergodicity Economics**. This is where the student's intuition has genuine bite, even if their conclusion about EUT is wrong.

  Standard EUT often implicitly assumes an **ensemble average** (what happens across 1,000 parallel universes). But in reality, we live in a **time average** (what happens to one person over 1,000 days).
  *   In non-ergodic systems (like wealth accumulation with bankruptcy), the ensemble average and the time average diverge.
  *   Peters argues that maximizing the *time-average growth rate* (which leads to log utility/Kelly) is the physically correct way to make decisions in a non-ergodic world, rather than maximizing ensemble expected utility.

  **Does this refute EUT?** No. It refutes the *justification* for using linear utility (Expected Value) in repeated economic games. It suggests that logarithmic utility isn't just a psychological quirk (risk aversion) but a mathematical necessity for survival in multiplicative dynamics.

  **The Classroom Point:** You can concede that the student is right to be suspicious of "Expected Value" in repeated settings. The Allais paradox shows people violate EUT axioms; the Kelly argument shows why maximizing Expected *Value* is suicidal. But neither kills the *framework* of EUT; they just inform the shape of the utility function.

  ### 4. Summary for the Seminar
  Here is a way to frame this for your students that respects the math but clarifies the philosophy:

  1.  **Distinguish EV from EU:** The "rational" strategy that Kelly beats is usually "Maximize Expected Monetary Value." That is a naive strategy, not the full Expected Utility Theory. EUT allows for risk aversion.
  2.  **Utility is Primitive:** In vNM theory, utility is defined by preferences. If you prefer the Kelly path over a volatile path that has higher expected value but higher ruin risk, your utility function is simply concave (like log). That is consistent with EUT.
  3.  **The Horizon Matters:** The theorem that "Kelly wins in the limit" is true, but rational agents have finite horizons. For finite $N$, there are strategies with higher expected utility than Kelly (e.g., fractional Kelly) depending on the agent's risk tolerance.
  4.  **Ergodicity is a Justification, Not a Replacement:** The ergodicity argument explains *why* log utility might be objectively better for wealth growth than linear utility, but it doesn't overthrow the axioms of rational choice. It just helps us derive the utility function from physics rather than psychology.

  ### Recommended Reading for You
  If you want to brush up to handle the Q&A:
  *   **Samuelson, P. A. (1971).** "The 'Fallacy' of Maximizing the Geometric Mean in Long Sequences of Investing or Gambling." *Proceedings of the National Academy of Sciences*. (The classic takedown of the asymptotic argument).
  *   **Peters, O. (2011).** "The time resolution of the St. Petersburg paradox." (For the ergodicity angle).
  *   **Thorp, E. (2006).** "The Kelly Criterion in Blackjack, Sports Betting, and the Stock Market." (Practical application, notes that full Kelly is often too volatile for humans).

  **Verdict:** Your student is asking a sophisticated question but has conflated a specific utility function (log) with the general framework (EUT), and has elevated an asymptotic property to a normative rule for finite beings. It's a "high-quality misunderstanding." Validate their intuition about growth rates, but correct the theoretical mapping.
