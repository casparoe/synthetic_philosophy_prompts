          *   If Mill believes people often choose wrong (lower pleasures), doesn't he want them to choose right? Yes, but via *persuasion*, not *control*. CEV in an AI context is usually control/optimization.
          *   Okay, sticking with "Forbidden Paternalism" is the stronger Millian position because of the emphasis on *autonomy as a constituent of happiness*.

      *   *Refining the Resolution:* The tension exists because *Utilitarianism* seems to allow an elite to dictate values, while *Liberty* forbids it. The resolution is that the elite cannot dictate values *for* others, only *to* others via example/argument, because the *act of valuation* is itself a higher pleasure. CEV automates valuation, removing the pleasure of valuation. Thus, it violates both.

