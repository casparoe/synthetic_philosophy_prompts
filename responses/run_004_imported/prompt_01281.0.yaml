answer: |-
  You have correctly identified that Arrow's Impossibility Theorem is not quite the right tool for this specific diagnosis, and your instinct that this is an "engineering problem" is both right and wrong. It is an engineering problem in the sense that you are designing a system with constraints and failure modes, but it is not "fixable" in the sense of finding a bug-free solution.

  Your friend was pointing you toward the right neighborhood of mathematical theory, but she cited the wrong theorem. The phenomenon you are describing—voters gaining an advantage by voting insincerely—is covered by the **Gibbard-Satterthwaite Theorem**.

  Here is the breakdown of what happened, why it is likely inevitable, and how you can choose a "less bad" system for next year.

  ### 1. The Theory: Why Strategy is Inevitable
  Arrow's Theorem (1950) deals with whether a voting system can consistently translate individual rankings into a coherent *social* ranking without violating basic fairness criteria (like non-dictatorship). It proves that no ranked system is perfect.

  However, your problem is about *individual incentives*. The **Gibbard-Satterthwaite Theorem** (independently proven in the early 1970s) states that for any deterministic voting system with three or more candidates, one of two things must be true:
  1.  The system is dictatorial (one person decides the outcome).
  2.  The system is susceptible to tactical voting (there are scenarios where a voter gets a better result by lying about their preferences).

  Since you want a democratic association (non-dictatorial) and you have more than two candidates, **you cannot eliminate strategic voting.** It is a fundamental feature, not a bug, of collective decision-making.

  ### 2. Analyzing the Specific Failure Mode
  You observed a specific tactic called **"burying."** A bloc of voters ranked a strong competitor last (insincerely) to ensure their elimination in an early round.

  *   **Plurality (Last Year):** The failure mode was the **Spoiler Effect**. Voters split along ideological lines, allowing a polarizing candidate to win with a minority. The strategic incentive there is "compromising"—voting for a less-preferred candidate because they have a better chance of winning (e.g., "Don't vote for the Green party, or the Conservative will win").
  *   **RCV/IRV (This Year):** The failure mode was **Burying**. RCV is generally *more* resistant to strategy than Plurality, but not immune. In RCV, burying is risky. If you bury Candidate A, but your favorite Candidate B loses in the first round, your vote transfers to your second choice. If you ranked Candidate A last to hurt them, but Candidate A was actually your second choice, you have shot yourself in the foot.
  *   **Why it worked this time:** In a small population (an apartment building), coordination is easy. In national elections, it is hard to get millions of people to agree on a complex strategic lie. In your building, a dozen neighbors could agree on a WhatsApp thread to rank the rival last. Small electorates amplify the viability of strategic coalitions.

  ### 3. Evaluating the Alternatives
  Since you cannot eliminate strategy, you must choose the system where the *likely* strategic behavior leads to the least damaging social outcome.

  **Borda Count (Not Recommended)**
  *   *How it works:* Candidates get points based on rank (1st place = 3 pts, 2nd = 2 pts, etc.).
  *   *The Flaw:* Borda is **hyper-sensitive** to strategic burying. Because every rank position matters, there is a massive incentive to rank your strongest rival dead last, even if you actually like them. It incentivizes negative campaigning more than almost any other system.
  *   *Verdict:* Avoid. This would likely worsen the neighborly conflict.

  **Approval Voting (Highly Recommended)**
  *   *How it works:* Voters can vote for ("approve") as many candidates as they like. The candidate with the most approvals wins. No ranking.
  *   *The Flaw:* It lacks nuance (you can't distinguish between a 1st and 2nd choice).
  *   *The Strategic Incentive:* The main strategy is "bullet voting" (voting only for your favorite to avoid helping the runner-up). However, in a low-stakes, consensus-oriented environment like a housing association, Approval Voting tends to reward **broad acceptability** rather than **intense polarization**.
  *   *Why it helps your situation:* It removes the ability to "bury." To hurt Candidate X, you must withhold approval. But you can still approve Candidate Y and Candidate Z. It makes it much harder to coordinate a "kill shot" against a rival without also reducing the total vote count of your own coalition. It encourages candidates to appeal to the widest number of neighbors rather than just a passionate base.
  *   *Verdict:* Best fit for small, community organizations. It is simple to explain and count.

  **Score / Range Voting (Alternative)**
  *   *How it works:* Rate candidates 0–5.
  *   *The Flaw:* Susceptible to "min-maxing" strategy (voters give their favorite a 5 and everyone else a 0).
  *   *Verdict:* Better than RCV for expressing nuance, but cognitively more demanding for voters than Approval.

  ### 4. Practical Engineering for Next Year
  Since you cannot mathematically guarantee honesty, you must design the *process* to reduce the incentive and ability to coordinate manipulation.

  **1. Switch to Approval Voting**
  For a residents' association, the goal is usually a chair who is acceptable to everyone, not necessarily the passionate favorite of 51%. Approval voting mathematically favors consensus candidates. It is very difficult to explain to a neighbor why they should *not* approve of a reasonable candidate, whereas it is easy to explain why they should rank them last.

  **2. Increase the Cost of Coordination**
  Strategic voting requires coordination. In your building, the "bloc" likely coordinated via casual conversation or a group chat.
  *   **Secret Ballots:** Ensure ballots are truly anonymous. If neighbors fear social retribution for not voting the "bloc line," strategy becomes harder.
  *   **Neutral Communication:** As the committee, provide neutral descriptions of the voting methods. Do not allow campaign literature that explicitly instructs voters on *how* to rank/approve (e.g., "Make sure to rank Smith last!").

  **3. Change the Role of the Chair**
  If the position of "Chair" carries significant power or burden, the stakes are higher, and strategy increases.
  *   Can the role be rotated?
  *   Can duties be split among a board (elected via Approval) rather than a single winner-take-all Chair? Multi-winner elections dilute the value of strategic burying.

  ### Summary Recommendation
  You are not failing at this; you are encountering the hard limits of social choice theory.
  1.  **Accept that Gibbard-Satterthwaite applies:** No system is strategy-proof.
  2.  **Acknowledge the context:** Small groups make coordination easy, which exacerbates theoretical vulnerabilities.
  3.  **Propose Approval Voting:** It is the most robust system for minimizing negative campaigning and "burying" tactics in small communities. It shifts the incentive from "destroy the rival" to "build a coalition."
  4.  **Frame it socially:** When you propose the change, do not frame it as "fixing the cheaters." Frame it as "simplifying the ballot to encourage broader consensus."

  You have done a good job trying to improve the system. The fact that your neighbors are now upset is a feature of human politics, not just the voting algorithm. Switching to Approval Voting is the best engineering patch available for this specific environment.
