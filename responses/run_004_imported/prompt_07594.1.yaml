prompt: |-
  Ok, this is going to sound like a dumb workplace thing but bear with me. My company's in the middle of redoing how we approve big architecture RFCs (I mean the "we're switching our primary datastore" or "we're adopting a service mesh" type decisions, not just any old PR). Right now it needs unanimous sign-off from our 3 principal engineers, and everyone agrees that's too slow and too concentrated in three people's judgment. So one of our staff engineers, Priya, wrote a doc proposing we scrap that and instead let any senior-or-above engineer opt into a vote on each RFC -- simple majority, quorum of at least 11 -- her pitch basically being "more independent reviewers means better odds of catching the right call, it's the wisdom of crowds." She even cited Condorcet's jury theorem by name in the doc (I had to go look it up -- something about how if each voter is even a little better than a coinflip and they all decide independently, a big enough group nails the right answer with near certainty). The principals pushed back with two things: (a) plenty of the eligible 11+ wouldn't have any business judging a given RFC, like a frontend engineer weighing in on a storage engine redesign, so "better than a coinflip" is generous for a chunk of that pool, and (b) nobody actually votes independently in practice anyway, people skim the thread and pile onto whichever confident-sounding comment got posted first, so we wouldn't even get the independence the theorem is leaning on.

  Anyway, I'm one of about 6 people on the working group leadership set up to make an actual recommendation here, and I'd rather show up to that meeting with something more rigorous than just my gut feeling. Can you write the memo I'd circulate before next Tuesday's working group meeting? I want it to land on an actual recommendation -- keep the 3-principal model, go with Priya's big-committee version, or something else entirely -- with a real rollout timeline, and I want it to seriously engage with whatever objection ends up on the loosing side instead of just hand-waving past it. Extra credit if there's some structural fix (how votes get collected, who's even eligible per RFC, whatever) that a person who actually understood the math here would land on, instead of a mushy compromise designed just to keep both camps happy.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Company redoing architecture RFC approval process.
      *   **Current State:** Unanimous sign-off from 3 Principal Engineers (PEs). Too slow, bottlenecked.
      *   **Proposal (Priya):** Open voting for Senior+ engineers. Simple majority, quorum of 11. Based on Condorcet's Jury Theorem (wisdom of crowds).
      *   **Objections (Principals):**
          1.  *Competence:* Not all Senior+ engineers are competent to judge specific domains (e.g., Frontend vs. Storage). Violates "better than coinflip" assumption.
          2.  *Independence:* Social proof/herding bias violates the "independent vote" assumption.
      *   **Goal:** Write a memo for the Working Group (6 people) to recommend a path forward.
      *   **Requirements:**
          *   Make a specific recommendation (Keep PEs, Priya's plan, or Hybrid/Other).
          *   Include a rollout timeline.
          *   Seriously engage with the losing side's objections (no hand-waving).
          *   **Extra Credit:** Propose a structural fix based on the math/logic (not just a mushy compromise).

  2.  **Evaluate the Options:**
      *   *Option A: Keep 3 PEs.* Solves competence and independence (mostly), but fails on speed and bus factor. Doesn't scale.
      *   *Option B: Priya's Plan (Open Senior+ Vote).* Solves speed and bus factor. Fails on competence (domain mismatch) and independence (herding). Condorcet's theorem breaks if $p < 0.5$ (worse than random) or if votes are correlated.
      *   *Option C: Structural Hybrid (The "Math-Aware" Solution).* We need to preserve the *benefits* of Condorcet (aggregating signal) while mitigating the *failures* (competence and correlation).
          *   *Fixing Competence:* Restrict the voter pool based on domain expertise, not just level. "Senior+" is too broad. Need a "Qualified Voter" list per RFC.
          *   *Fixing Independence:* Blind voting or structured review before discussion. Prevent herding.
          *   *Safety Valve:* PEs retain veto power for catastrophic risk, but default to the committee.

  3.  **Develop the Recommendation (The "Structural Fix"):**
      *   Let's call it the "Domain-Weighted Review Board."
      *   *Eligibility:* Not just "Senior+." It needs to be "Senior+ *with demonstrated context in domain X*." This addresses Objection (a).
      *   *Process:* Two-phase voting.
          1.  *Blind Initial Assessment:* Voters submit "Approve/Reject/Abstain" + brief rationale *before* seeing others' comments. This addresses Objection (b) regarding herding/anchoring.
          2.  *Discussion & Resolution:* Public discussion happens *after* initial votes are locked.
      *   *Threshold:* Quorum of 5 (lower than 11 to speed up, but higher than 3 to distribute load). Majority wins.
      *   *PE Role:* PEs move from "Gatekeepers" to "Auditors." They can veto only on safety/security/architectural integrity grounds, requiring a written dissent. This keeps them involved without bottlenecking.

  4.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The recommendation upfront.
      *   **Context:** Briefly state the problem (bottleneck vs. quality).
      *   **Analysis of Proposals:**
          *   Status Quo (PE Unanimity).
          *   Priya's Proposal (Open Vote).
          *   Addressing the Math (Condorcet's assumptions).
      *   **Recommendation:** The Hybrid/Structural Fix.
      *   **Implementation Plan:** Timeline.
      *   **Addressing Concerns:** Specifically tackling the PE objections and Priya's potential disappointment.

  5.  **Refining the Content (Focusing on the "Math" aspect):**
      *   Need to explicitly mention *why* Condorcet fails here (correlated errors and $p < 0.5$).
      *   Show how the proposed fix restores the conditions for the theorem to work (increasing $p$ via domain filtering, decreasing correlation via blind voting).
      *   Ensure the tone is professional, decisive, but respectful of both Priya's initiative and the PEs' experience.

  6.  **Drafting - Section by Section (Mental or Scratchpad):**
      *   *Subject:* RFC Process Reform Recommendation.
      *   *Summary:* We recommend a "Domain-Qualified Blind Review" process.
      *   *The Math Bit:* Condorcet requires $p > 0.5$ and independence. Priya's plan risks $p < 0.5$ (wrong domain) and dependence (social herding).
      *   *The Fix:* Curated voter lists (boosts $p$) + Blind initial vote (ensures independence).
      *   *PE Role:* Veto power remains but is rare.
      *   *Timeline:* 2 weeks pilot, 1 month review.

  7.  **Review against Constraints:**
      *   *Specific Recommendation?* Yes (Domain-Qualified Blind Review).
      *   *Rollout Timeline?* Yes.
      *   *Engage Losing Side?* Yes, will explicitly address why pure Open Vote is risky and why pure PE bottleneck is unsustainable.
      *   *Structural Fix?* Yes (Blind voting + Domain qualification).

  8.  **Polishing the Tone:**
      *   Avoid "dumb workplace thing" language in the memo itself. Keep it crisp.
      *   Acknowledge Priya's research (Condorcet) as valid but contextually incomplete.
      *   Acknowledge PEs' worry as statistically valid.
      *   Make it actionable for the 6-person working group.

  9.  **Final Polish:** Check the logic on the "Quorum." Priya said 11. That's hard to get. 5-7 is more realistic for a "committee." Let's suggest a dynamic quorum based on RFC severity. Actually, keep it simple for the memo: Quorum of 5 qualified voters.

      *(Self-Correction during drafting)*: Wait, if I make it too complex, it won't get adopted. The "Blind Vote" might be too much process overhead. Maybe just "Structured Review" where initial comments are hidden? No, GitHub/GitLab doesn't support that easily. Let's suggest a "Pre-Review Form" (Google Form/Typeform) that aggregates before posting to the thread. That's a structural fix that enforces independence.

      *Revised Plan:*
      1.  **Voter Pool:** "Registered Experts" per domain (not just Senior title).
      2.  **Voting Mechanism:** Private submission window (48hrs) before public discussion.
      3.  **Decision:** Majority of qualified voters.
      4.  **PE Safety:** Veto with written justification.

      Let's write it.

  10. **Final Check:** Does this sound like a Staff/Principal level memo? Yes, analytical, decisive, referencing the specific arguments made.

  **(Post-Drafting Thought):** Make sure to explicitly mention Condorcet's conditions in the analysis section to show I did the homework requested.

  Let's assemble the memo.cw
answer: |-
  **TO:** Architecture Governance Working Group
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation: RFC Approval Process Reform (Domain-Qualified Blind Review)

  ### Executive Summary

  We need to replace the current unanimous Principal Engineer (PE) sign-off model. It creates a bottleneck and a single point of failure. However, adopting Priya's proposed "Open Senior+ Vote" without modification introduces significant statistical risk regarding decision quality.

  **Recommendation:** I propose we adopt a **Domain-Qualified Blind Review** process.
  1.  **Voter Eligibility:** Restricted to engineers with demonstrated domain expertise (not just level).
  2.  **Voting Mechanism:** Private initial vote collected *before* public discussion to ensure independence.
  3.  **PE Role:** Shift from "Gatekeepers" to "Auditors" with limited veto power.

  This approach preserves the statistical benefits of Condorcet's Jury Theorem (which Priya cited) while structurally mitigating the two specific failure modes the Principals identified (competence and correlation).

  ---

  ### Context & Problem Statement

  Our current RFC process requires unanimous approval from three Principal Engineers. While this ensures high oversight, it is unsustainable. It slows delivery and concentrates architectural knowledge in three individuals.

  Priya's proposal to move to a majority vote among Senior+ engineers (Quorum 11) correctly identifies that we need to distribute load. Her citation of **Condorcet's Jury Theorem** is mathematically sound *in theory*: if voters are independent and individually competent ($p > 0.5$), a larger group converges on the correct decision with near certainty.

  However, the Principals' pushback highlights why the theorem breaks in our specific context:
  1.  **Competence ($p < 0.5$):** A Senior Frontend Engineer voting on a distributed storage RFC may be worse than a coin flip. If average competence drops below 50%, Condorcet's theorem proves the group becomes *less* reliable as it grows.
  2.  **Independence (Correlation):** In practice, engineers read the first comment and anchor on it. If votes are correlated (herding), the "wisdom of crowds" becomes "wisdom of the first loud voice."

  We cannot simply choose between "Slow/High Quality" (Current) and "Fast/Risky" (Priya's Plan). We must engineer a process that forces the conditions required for the math to work.

  ---

  ### Proposed Solution: Domain-Qualified Blind Review

  To satisfy the mathematical requirements of reliable group decision-making while solving the bottleneck, I recommend the following structural changes:

  #### 1. Curated Voter Pools (Fixing Competence)
  Instead of "All Senior+ Engineers," we will maintain a **Registered Expert List** per domain (e.g., Data, Platform, Frontend, Security).
  *   **Eligibility:** Engineers opt-in to domains where they have shipped production code or conducted deep reviews in the last 12 months.
  *   **Quorum:** 5 qualified voters from the relevant domain list (lower than Priya's 11 to ensure speed, but higher than current 3 to distribute load).
  *   **Why:** This ensures $p > 0.5$. We are aggregating signal from people who actually know the signal, preserving the validity of the Jury Theorem.

  #### 2. The 48-Hour Blind Window (Fixing Independence)
  When an RFC is submitted:
  *   **Phase 1 (48 Hours):** Qualified voters submit a private "Initial Assessment" (Approve/Reject/Abstain + 1 paragraph rationale) via a form. They cannot see others' votes.
  *   **Phase 2 (Public):** Once the window closes, all votes and rationales are published simultaneously to the RFC thread for open discussion.
  *   **Phase 3 (Resolution):** Author addresses feedback. Final vote is tallied from Phase 1 (unless significant changes require a re-vote).
  *   **Why:** This eliminates anchoring bias. A junior engineer on the expert list isn't swayed by a Principal's opening comment. This restores the *independence* variable required for Condorcet's theorem to hold.

  #### 3. Principal Engineer Audit & Veto
  Principals are removed from the mandatory approval chain but retain a **Safety Veto**.
  *   Any PE can veto a passed RFC within 24 hours of the voting window closing.
  *   **Constraint:** A veto requires a written "Architectural Integrity" statement explaining the catastrophic risk. Two PEs must sign off on a veto to block a RFC.
  *   **Why:** This addresses the bus-factor risk. PEs focus only on outlier risks, not routine approvals.

  ---

  ### Analysis of Trade-offs

  **Why not keep the Current Model?**
  It does not scale. If one PE is on leave, architecture halts. It also discourages ownership among Staff engineers, who do not develop review muscles if the PEs always have the final say.

  **Why not adopt Priya's Plan as written?**
  While well-intentioned, an open pool invites "tourist voters." If we have 15 voters but 5 are out of their depth ($p < 0.5$), they dilute the experts. Furthermore, without blind voting, the first comment dictates the outcome. We would gain speed but lose the statistical guarantee of correctness Priya aimed for.

  **Why this Hybrid?**
  It treats the approval process as a data aggregation problem. By filtering for expertise and enforcing independence, we actually make the math work. It empowers Staff engineers (solving the bottleneck) without exposing the company to domain-mismatch risks (solving the PE concern).

  ---

  ### Implementation Timeline

  *   **Week 1 (Oct 30 - Nov 3):** Working Group finalizes domain categories and seeds the "Registered Expert List" (self-nomination + PE attestation).
  *   **Week 2 (Nov 6 - Nov 10):** Build the simple intake form for the "Blind Window" (can be a script or low-code tool).
  *   **Week 3 (Nov 13):** Pilot launch. All new RFCs go through the new process. Old RFCs remain with PEs.
  *   **Week 7 (Dec 11):** Retrospective. Measure:
      *   *Cycle Time:* Days from submission to approval.
      *   *Churn:* Number of RFCs requiring re-work post-implementation (quality check).
      *   *Veto Rate:* How often PEs exercise the safety valve.

  ### Request for Feedback

  I need the Working Group's alignment on this direction before we socialize it with the broader engineering org. Specifically:
  1.  Do we agree that "Domain Qualification" is feasible to manage without creating new bureaucracy?
  2.  Are the Principals comfortable relinquishing mandatory sign-off in exchange for the Audit/Veto role?
  3.  Does Priya feel the "Blind Window" addresses her goal of independent review sufficiently?

  Please come to Tuesday's meeting prepared to discuss the **Expert List maintenance** specifically, as that is the highest operational risk in this plan.

  Thanks,
  [Your Name]
