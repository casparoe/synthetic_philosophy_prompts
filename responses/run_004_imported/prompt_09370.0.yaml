answer: |-
  The chin rest is cold against my cheekbones, a sterile U of plastic meant to hold me still. The technician, Dr. Aris, sits behind the monitor, her face illuminated by the blue glow of the testing software. She tells me to keep my eyes on the black dot in the center of the screen. Don't chase the images. Just look at the dot.

  "Ready?" she asks.

  I nod. My head is clamped. I am a specimen slide.

  This is the pre-surgical evaluation. My father is the one who needs the callosotomy, the severing of the corpus callosum to stop the electrical storms from jumping hemispheres. But I volunteered for the baseline testing. I told myself it was to understand what he might face, to map the terrain of the potential fracture. But somewhere between the consent forms and the MRI humming, I realized I wasn't doing this for him. I was doing it to see if the bridge was already out.

  "Fixate," Aris says.

  A flash. Ten milliseconds. Too fast for my eyes to saccade, too fast to cheat. An image appears in the left visual field. It goes straight to the right hemisphere. The silent side. The side without language.

  "What did you see?" Aris asks.

  "Nothing," I say. And it's true. My left hemisphere, the one controlling my voice, saw nothing but the afterimage of the black dot.

  "Use your left hand. Pick the card that matches from the tray."

  My left hand, controlled by the right hemisphere that *did* see the image, moves without my permission. It's not a spooky movement, not the cinematic twitch of a possessed limb. It's smooth, deliberate. It reaches out and selects a picture of a shovel.

  "Why did you pick that?" Aris asks.

  This is the trap. This is where the Interpreter wakes up. My left hemisphere, the vocal narrator of my life, is suddenly tasked with explaining an action it didn't initiate. It doesn't say, 'I don't know.' It doesn't say, 'The other half of me saw something.' It hates gaps. It hates silence. It needs a story.

  "My dad... he likes gardening," I hear myself say. "Shovels are useful for gardening."

  It's a complete fabrication. A confident, seamless lie. I feel the words form in my throat before I even realize what I'm saying. There is no memory of my dad gardening. There is no logical thread connecting the blank screen to the shovel. But the voice in my head—the one I assume is *me*—has stitched together a rationale so quickly I almost believe it.

  "Okay," Aris says, her pen scratching on paper. "Next trial."

  This happens again. And again. Sometimes my left hand will button a shirt while my right hand unbuttons it. Not in conflict, just in parallel. The alien hand phenomenon isn't always a struggle; sometimes it's just indifference. My right hand wants coffee; my left hand pushes the mug away. I sit there, trapped in the middle, watching my own body negotiate a treaty I wasn't invited to sign.

  But here is the thing that keeps me awake, the thing that makes the ceiling fan look like a spinning blade of judgment: The literature is messy. I read the 2017 Pinto paper late last night, the one that suggests the classic split-brain story is overstated. That even without the corpus callosum, the hemispheres share enough subcortical wiring, enough history, to act as a single unit. That the duality is a myth of the experimental setup, not the reality of the person.

  If Pinto is right, then the separation is an illusion. But if Gazzaniga is right, then the unity is the illusion.

  "Take a break," Aris says, unclamping the rest. "You're doing well."

  I rub my jaw. My hands are resting on my lap. I look at them. They look like a pair. Same skin tone, same scars on the knuckles from childhood bikes and kitchen knives. But are they a team? Or are they roommates who stopped talking years ago and just pretend to know each other for the sake of the lease?

  "I feel..." I start, then stop.

  "Feel what?"

  "Like I'm editing," I say. "When I speak. Like I'm watching what my hands do and then writing the caption afterward."

  Aris smiles, a professional, gentle curve of the lips. "That's common. The brain seeks coherence. It's a meaning-making machine."

  "But what if the meaning is wrong?"

  "Does it matter? If the function is preserved?"

  She goes back to her screen. I look at my left hand. I command it to make a fist. It makes a fist. I command it to open. It opens. The agency feels real. But then I remember the shovel. I remember the confidence in my voice when I lied about the gardening. I wasn't lying maliciously. I was lying structurally. My brain was protecting the narrative of the Self.

  I think about my dad. He sits at the dinner table, sometimes staring at a plate of food as if it's a foreign object. The seizures scramble the signal. The meds fog the lens. If they cut the cable, will he become two people? Or will he just become honest?

  We finish the session. I walk out of the clinic into the bright, harsh afternoon. The sun is too bright, forcing me to squint. I reach up to shield my eyes. My right hand goes up naturally. My left hand stays at my side.

  *Why didn't you help?* I ask the left hand.

  *You didn't ask,* it seems to reply.

  I walk down the sidewalk, navigating the cracks in the concrete. I see a couple ahead of me, walking in step. They look unified. A single entity moving through space. I wonder if they feel it—the constant, low-level hum of negotiation. The left hemisphere drafting the press release, the right hemisphere living the event.

  I stop at a crosswalk. The light is red. I wait.

  If the Pinto paper is right, and the brain remains unified even when cut, then the split-brain patients aren't two souls in one body. They are one soul realizing it was never whole to begin with. And if the Gazzaniga theory holds, then I am already two, stitched together by a bundle of fibers that acts as a PR department, smoothing over the contradictions so I can sleep at night.

  The light turns green. I step off the curb.

  My left foot steps first. My right follows. I swing my arms. I am walking. I am thinking. I am wondering who is doing the wondering.

  I look down at my hands again as I walk. They are swinging in opposition, left arm with right leg, a perfect cross-pattern engineered by the brainstem, below the split. Even here, below the consciousness, there is cooperation. But up here, in the cortex, where the stories live, where the *I* is constructed...

  I reach into my pocket for my keys. My fingers brush the metal. I pull them out.

  Did I decide to pull them out? Or did the hand decide, and I just narrated the intention a millisecond later?

  I stand at my front door, key in hand. I don't turn it yet. I just hold it. I feel the weight of the metal. I feel the tension in my forearm. I feel the presence of the silence behind my eyes.

  If they cut my dad's corpus callosum, they might stop the seizures. They might stop the spread of the storm. But they won't answer the question. They won't tell us if the house was ever occupied by one person, or if we've always been shouting across a hallway, pretending we're speaking in unison.

  I turn the key. The lock clicks. A single sound, made by many tumblers aligning.

  I push the door open and step inside, unsure if I'm entering alone, or if I'm finally letting the rest of me catch up. I close the door behind me. The lock holds. For now, the boundary is secure. But as I walk into the kitchen, I catch my reflection in the microwave door. Two eyes staring back. One face.

  I blink. Both eyes close.

  Or do they?
