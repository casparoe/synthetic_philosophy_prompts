      *   *Paragraph 3 (Triviality):* "Putnam and Searle claim a rock or a wall can be mapped... Aaronson's answer is to insist that the mapping itself has to be efficiently computable and has to go on working if you feed the system different inputs, not just describe the one trajectory..."
