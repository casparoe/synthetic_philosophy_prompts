      *   Cole pressing Thorne on the code.
      *   Thorne admitting the opacity.
      *   Cole pressing Rostova on the override.
      *   Rostova admitting the latency/complexity.
      *   Vane stepping in to limit liability.
      *   Ending on the "lesson learned" that changes nothing fundamental.

  8.  **Word Count Check:**
      *   Need to ensure it stays within 1000-1500. Keep descriptions tight. Focus on the dialogue interplay.

  9.  **Final Polish:**
      *   Check against the prompt's specific request: "genuinely unclear which of the several distinct 'gaps'... is doing the work."
      *   Ensure the ending feels unresolved morally, even if procedurally closed.

  **(Self-Correction on the fly):** Make sure the distinction between *blame* (backward-looking) and *duty* (forward-looking) is clear in the action, even if not named. Cole wants blame. Vane offers duty (we'll patch it). Thorne offers epistemic humility (we don't know). Rostova offers procedural compliance (I followed rules).

