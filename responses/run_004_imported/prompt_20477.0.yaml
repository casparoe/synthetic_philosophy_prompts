answer: |-
  **Setting:** *An art studio. Dust motes dance in the light. On a central pedestal sits a freshly finished clay bust of a weary-looking man. LEO is wiping clay off his hands with a rag. MAYA is leaning against a workbench, staring intently at the bust.*

  **Maya:** It's done, then?

  **Leo:** Finally. Took me three weeks.

  **Maya:** Impressive. Truly. Although, strictly speaking, you've made two things today.

  **Leo:** *(Sighs, not looking up)* Here we go. I made one bust, Maya. One.

  **Maya:** You made a bust. And you shaped a lump of clay. Those are two different objects occupying the same space.

  **Leo:** They are the *same* object. You're just using two labels for the same stuff. It's like calling me "Leo" and "The Guy Holding the Rag." I'm not two people just because you can describe me two ways.

  **Maya:** That's the intuitive trap. Think about yesterday. Yesterday, that lump of clay was sitting in a bucket. It existed. The bust did not. So, the lump has a property the bust doesn't: *having existed yesterday.*

  **Leo:** That's just language. The *stuff* existed.

  **Maya:** Leibniz's Law, Leo. The Indiscernibility of Identicals. If Object A is identical to Object B, they must share *all* the same properties. If the lump has the property "existed yesterday" and the statue does not, they cannot be identical. They are distinct. Coincident, but distinct.

  **Leo:** Okay, fine. Modal properties. You're counting "what could happen to it" as part of "what it is." That's where you lose reality. If I squash this back into a ball in five minutes, the lump survives. The statue dies. But that doesn't mean there are two things here *now*. It just means the word "statue" implies a shape, and the word "lump" implies material. You're reifying definitions into physical objects.

  **Maya:** I'm not reifying definitions; I'm tracking persistence conditions. If I point to the left side and ask, "Will this exist in an hour?" the answer depends on whether you're pointing to the clay or the statue. If there are two different true answers to the same question about the same spot, there must be two different things.

  **Leo:** *(Tosses the rag onto the bench)* Alright, let's play that game. If there are two things, put them on the scale. Does this pedestal weigh five pounds or ten?

  **Maya:** Five.

  **Leo:** Aha! So they share the mass.

  **Maya:** Constitution isn't addition. If you wear a cotton shirt, you and the shirt are two objects. But if you were made *of* the shirt—if you were coincident—the weight wouldn't double. They share the physical properties because one constitutes the other. The clay constitutes the statue.

  **Leo:** That sounds like magic. "They're two, but they weigh one." Okay, new scenario. I pick this up and throw it through the studio window. *Crash.* Glass everywhere. Who did it?

  **Maya:** The statue broke the window.

  **Leo:** Did the lump break the window?

  **Maya:** ...Yes.

  **Leo:** So I committed two acts of property damage? Do I owe the landlord double?

  **Maya:** No, because the causal event is shared. The statue broke the window *in virtue of* the clay breaking the window. It's one event with two agents.

  **Leo:** That is semantic gymnastics of the highest order. You're telling me I'm looking at one spot in space and seeing a ghostly double-exposure of reality. One object that is a statue, one that is a lump, interpenetrating like phantoms. Why? To save a logic rule?

  **Maya:** To save reality from being vague! If you say they are one object, you have to explain away the difference in their histories and futures. You're saying the history of the clay doesn't matter to the identity of the object.

  **Leo:** I'm saying the *object* is just the matter. The "statue" is just how we care about the matter. Look, if you win this, if modal properties count... then how many things are on this stand?

  **Maya:** Two. The lump and the statue.

  **Leo:** Wrong. There's the lump. There's the statue. There's the "lump-minus-one-atom." There's the "statue-minus-the-nose." There's the "collection of molecules." There's the "artifact." If having different survival conditions makes you a new object, then every time a speck of dust lands on this, a new object is born. You haven't solved the paradox; you've exploded the universe into infinite overlapping ghosts.

  **Maya:** *(Pauses, frowning slightly)* We use sortals. Concepts. We only count objects that fall under meaningful categories. "Lump" is a category. "Statue" is a category. "Lump-minus-one-atom" isn't a category we track.

  **Leo:** So now objectivity depends on what categories humans track? That's idealism, Maya. You're saying reality waits for us to name it before it decides how many things exist.

  **Maya:** I'm saying identity is relative to a concept. You want a concept-free reality? Fine. But without concepts, you can't even say "one." You just have... atoms.

  **Leo:** Exactly! So stop telling me there are two things. There are atoms arranged bust-wise. "One" is a useful fiction. "Two" is a useful fiction. But "Two" is a *more complicated* fiction for no gain. Occam's Razor. Shave it off.

  **Maya:** Occam's Razor cuts away unnecessary entities, not necessary distinctions. The distinction is necessary because the truth conditions differ. If I say "The statue was wet yesterday," that's false. If I say "The clay was wet yesterday," that's true. If they are one thing, one of those statements is a lie.

  **Leo:** One of them is just... loose talk.

  **Maya:** Philosophy isn't loose talk.

  **Leo:** And it isn't counting angels on a pinhead, either.

  *(Silence stretches between them. The bust sits silently on the stand, looking weary.)*

  **Leo:** Look. Just give me a number. For the inventory list. How many sculptures are on the stand?

  **Maya:** One sculpture. One lump of clay.

  **Leo:** How many *objects*?

  **Maya:** Two.

  **Leo:** *(Points at the stand)* I see one thing.

  **Maya:** *(Points at the same spot)* I see two.

  **Leo:** So if I ask a student to count the objects on the stand...

  **Maya:** ...they should say two.

  **Leo:** And if I ask the landlord how many things he's charging me rent for...

  **Maya:** ...he'll say one.

  **Leo:** So it depends on who's asking?

  **Maya:** It depends on what question is being asked.

  **Leo:** That means the number isn't in the room, Maya. It's in our heads.

  **Maya:** *(Looks at the bust, then at Leo)* Maybe. Or maybe the room is more crowded than you can see.

  **Leo:** *(Shakes his head)* One.

  **Maya:** Two.

  *(They both stare at the bust. The bust says nothing.)*

  **Leo:** ...I'm going to get coffee. Don't let the lump drink it without the statue.

  **Maya:** *(Smirking)* I'll tell them both you offered.
