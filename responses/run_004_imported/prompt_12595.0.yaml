  "Explain how anumana (inference) functions as an independent pramana in classical Nyaya. Cover (a) the five members of the syllogism (pancavayava), illustrated with the standard fire/smoke/hill example; (b) the role vyapti plays in licensing the inference; and (c) why inference counts as a seperate pramana rather than being reducible to perception."

