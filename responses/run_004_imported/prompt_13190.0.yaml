prompt: |-
  When a few of us are moving a heavy sofa together, or when my amateur band and I are working through a song, I notice something odd: if one person just drops out partway through without a word, the rest of us feel genuinely wronged rather than merely inconvenienced, and it feels like none of us could unilaterally end the whole thing — that seems to take all of us, even though nobody ever promised anything aloud.

  I have since read a little philosophy on this question. Michael Bratman holds that a shared intention reduces to separate individual intentions plus mutual knowledge of them, sub-plans that mesh rather than clash, and mutual responsiveness in intention and action. On his view, whatever obligation shows up can be explained by an ordinary moral norm against exploiting expectations you have knowingly created in someone else — he likens this to Scanlon's idea that assurances alone, with no promise required, can ground obligations. Margaret Gilbert denies that this is enough: she argues joint action rests on an irreducible "joint commitment" binding the parties as a plural subject, which is precisely what explains why no single party can rescind it unilaterally and why the others are entitled to rebuke someone who tries.

  Please argue that Gilbert is right on this specific point: the asymmetry between freely revisable personal intentions and a jointly held commitment that takes everyone's concurrence to dissolve cannot be reconstructed out of Bratman's individualist apparatus, Scanlon-style assurance norm included, so that joint action really does require something like a sui generis joint commitment.
reasoning: |-
  Here's a thinking process that leads to the argument supporting Margaret Gilbert's position:

  1.  **Deconstruct the Prompt:**
      *   **Phenomenon:** Shared activities (moving a sofa, playing in a band) create a specific normative feeling: if one drops out, others feel *wronged* (not just inconvenienced), and no single person can unilaterally end the activity (it takes everyone).
      *   **Competing Theories:**
          *   *Michael Bratman:* Shared intention = Individual intentions + Mutual Knowledge + Meshing Sub-plans + Mutual Responsiveness. Obligation comes from a moral norm against exploiting created expectations (Scanlon-style assurance).
          *   *Margaret Gilbert:* Shared intention = Irreducible "Joint Commitment" creating a "Plural Subject." Obligation is internal to the commitment itself (rights/duties correlate).
      *   **Task:** Argue that *Gilbert is right* on the specific point of *asymmetry* (unilateral revisability vs. joint rescission) and the *normative force* (feeling wronged vs. inconvenience). Specifically, show that Bratman's individualist apparatus (plus Scanlon-style assurance) *cannot* reconstruct this, necessitating a *sui generis* joint commitment.

  2.  **Analyze Bratman's Position (The Target):**
      *   Bratman tries to reduce "we-intend" to "I-intend" + "You-intend" + common knowledge.
      *   Normativity comes from outside the intention structure. It's a general moral principle: "Don't manipulate others by raising expectations you know you'll dash."
      *   *Weakness:* This makes the obligation contingent on the *consequences* of dropping out or the *history* of assurance. It treats the partner as a third party to my intention, rather than a co-author of *our* intention.
      *   *Unilateral Rescission:* On Bratman's view, since the intention is fundamentally *mine*, I can change *my* mind. I might owe you an apology or compensation for the hassle, but I don't need your *permission* to stop intending.

  3.  **Analyze Gilbert's Position (The Goal):**
      *   Joint commitment creates a "plural subject."
      *   The commitment is not the sum of personal commitments; it's a new entity.
      *   Normativity is internal: To commit jointly is to give others a *right* to your compliance.
      *   *Rescission:* Because the commitment belongs to the "us," only the "us" can dissolve it. One person cannot unilaterally dissolve a bond that constitutively involves another.
      *   *Rebuke:* The feeling of being "wronged" is a claim-right violation, not just a disappointment of expectation.

  4.  **Develop the Argument (Step-by-Step):**

      *   *Introduction:* State the thesis. Gilbert captures the normative phenomenology of shared agency better than Bratman. The key is the *direction* of the obligation and the *logic of rescission*.

      *   *Point 1: The Nature of the Obligation (Right vs. Expectation).*
          *   Bratman/Scanlon: Obligation is based on *harm* or *unfairness* caused by dashed expectations. It's consequentialist/contractarian.
          *   Gilbert: Obligation is *deontological* and internal. I owe it to *you* specifically because we are bound together.
          *   *Argument:* The feeling of being "wronged" implies a *right* was violated, not just a prediction failed. If I promise to meet you, you have a right to my arrival. If I just intend to meet you and tell you, you have an expectation. In joint action, the feeling is closer to the promise. Bratman reduces it to the latter; Gilbert elevates it to the former without requiring explicit promise.

      *   *Point 2: The Logic of Rescission (Unilateral vs. Joint).*
          *   This is the crux of the prompt.
          *   Bratman: I control my intentions. I can change my mind. If I do, I trigger the moral norm (apologize/compensate). But the *activity* stops because my contribution stops.
          *   Gilbert: The commitment is *joint*. It's like a contract that requires mutual consent to void.
          *   *Argument:* In the sofa/band case, if I stop, I don't just "break" the action; I violate the *authority* of the group over my action. Bratman can't explain why I lack the *authority* to stop, only that stopping is *costly* (morally). Gilbert explains why I *cannot* (normatively) stop without consent. The distinction is between "I shouldn't" (Bratman) and "It's not up to me" (Gilbert).

      *   *Point 3: The Insufficiency of Assurance (Scanlon's Principle).*
          *   Scanlon's Principle F (roughly): If you intentionally lead someone to expect X, you must do X unless they consent otherwise.
          *   *Argument:* This relies on *individual* acts of assurance. But in spontaneous joint action (like the sofa), there often *isn't* explicit assurance. We just start lifting. The normativity emerges from the *jointness*, not prior speech acts. Bratman has to stretch "assurance" to cover tacit mutual knowledge. Gilbert says the joint commitment *is* the source, not a side effect of individual assurances.
          *   Also, Scanlon's principle is a moral principle *about* individuals. Gilbert's commitment creates a *new subject*. The obligation isn't "I should be moral," it's "We are bound."

      *   *Point 4: Phenomenology of Rebuke.*
          *   When a band member quits mid-song, we don't just say "That was rude." We say "You can't just leave!"
          *   Bratman: "You violated a moral norm regarding expectations."
          *   Gilbert: "You violated *our* commitment."
          *   The latter captures the *collective* ownership of the action.

      *   *Conclusion:* Summarize. Bratman explains coordination; Gilbert explains *obligation*. The asymmetry of rescission proves that the commitment is not just a sum of parts.

  5.  **Refine and Polish:**
      *   *Tone:* Philosophical, rigorous, persuasive.
      *   *Key Terms:* Plural Subject, Joint Commitment, Mutual Responsiveness, Scanlon's Principle F, Normative Asymmetry, Claim Rights.
      *   *Check against constraints:* Ensure I focus on the *asymmetry of rescission* and the *inadequacy of Bratman/Scanlon*. Don't get bogged down in unrelated metaphysics.
      *   *Self-Correction during drafting:* Make sure I don't caricature Bratman too much. He acknowledges normative forces, but derives them differently. The argument must show *why* his derivation fails to capture the *specific* feeling of "you can't do that" (lack of authority) vs "you shouldn't do that" (moral prohibition).

  6.  **Final Review:** Does this directly answer the prompt's request to argue Gilbert is right on the specific point of asymmetry and the need for *sui generis* commitment? Yes. The core argument is that individual intentions are inherently revisable by the individual, so summing them cannot produce non-revisability without adding an external moral rule. But that external rule doesn't capture the *internal* authority of the partner. Gilbert's joint commitment does.

  *(Self-Correction Note)*: I need to be careful with the word "cannot." Bratmanians might argue they *can* explain it via complex webs of reliance. I need to argue that even if they explain the *pressure* to stay, they cannot explain the *lack of standing* to leave unilaterally. That is the Gilbertian sweet spot.

  7.  **Drafting the Response.** (Proceed to generate output based on these thoughts.)
answer: |-
  The phenomenology of shared agency you describe—the sense of being *wronged* rather than merely disappointed, and the intuition that the activity cannot be dissolved by a single will—points to a normative structure that Michael Bratman's individualist reduction cannot fully capture. While Bratman successfully explains how we *coordinate*, Margaret Gilbert is right to argue that he fails to explain how we are *bound*.

  To demonstrate that Gilbert is correct, we must focus on the specific asymmetry you identified: the difference between the revisability of personal intentions and the non-unilateral rescindability of joint commitments. I will argue that Bratman's apparatus, even when bolstered by Scanlon-style assurance norms, can only generate external moral pressure to continue, whereas the phenomenon of joint action reveals an internal lack of *authority* to stop. This distinction necessitates a *sui generis* joint commitment.

  ### 1. The Logic of Rescission: Authority vs. Prohibition

  The crux of the disagreement lies in what it means to "drop out." On Bratman's view, a shared intention is a web of interlocking *personal* intentions ("I intend that we J," "You intend that we J"). Since personal intentions are inherently under the control of the individual agent, I retain the authority to change my mind. If I decide to stop lifting the sofa, I am exercising my sovereign agency over my own intentions.

  Bratman acknowledges that this might be wrong, but he locates the wrongness *outside* the intention structure. It is a violation of a general moral norm (akin to Scanlon's Principle F): *Do not manipulate others by creating expectations you knowingly dash.* On this model, if I drop out, I have acted immorally because I have harmed you or treated you unfairly.

  Gilbert's model yields a different logical structure. A joint commitment does not belong to me or to you; it belongs to *us* as a plural subject. Therefore, the authority to rescind the commitment does not reside in the individual wills that constitute it, but in the collective will that sustains it.

  This explains the specific intuition you noted: "it feels like none of us could unilaterally end the whole thing."
  *   **Bratman:** You *can* end it (you have the power), but you *shouldn't* (moral prohibition).
  *   **Gilbert:** You *cannot* end it (lack of normative authority), unless the "we" agrees.

  The feeling that the band cannot stop unless *everyone* agrees is not just a feeling that stopping would be rude; it is a recognition that the song belongs to the band, not the individual guitarist. Bratman's individualist apparatus cannot reconstruct this because it begins with the premise that all normativity flows from the individual. You cannot sum individual authorities to create a collective authority that binds those same individuals; you simply get a stronger web of individual constraints. Gilbert is right that to explain the *lock* on the commitment, you need a mechanism that places the commitment outside the unilateral control of the parties. Only a *sui generis* joint commitment achieves this.

  ### 2. The Nature of the Obligation: Claim-Rights vs. Expectations

  The second pillar of Gilbert's superiority concerns the reactive attitude of those left holding the sofa. You noted they feel "genuinely wronged." In moral philosophy, to be wronged is typically to have a *right* violated. To be merely inconvenienced or disappointed is to have an *expectation* dashed.

  Bratman, relying on a Scanlon-style assurance norm, grounds the obligation in the **reliance** of the other party. If I know you are counting on me, I have a duty not to let you down without notice. However, this makes the obligation contingent on the *consequences* of my departure. If I could drop out of the band mid-song without causing you significant harm (perhaps you have a backup track), the Bratmanian obligation weakens or vanishes. The norm is about preventing harm or unfairness, not about fidelity to the partnership itself.

  Gilbert argues that joint commitment creates **correlative claim-rights**. By entering a joint commitment, I give *you* a right to my participation, and you give *me* a right to yours. This right is not derived from the harm caused by breaking it; it is constitutive of the commitment itself.

  This explains why the remaining sofa-lifters feel entitled to rebuke the defector. On Bratman's view, their rebuke is a reminder of a general moral truth ("You shouldn't exploit expectations"). On Gilbert's view, their rebuke is an exercise of their **standing**. They are not merely moral bystanders observing a violation; they are the specific creditors to whom the debt is owed. The asymmetry is clear: Bratman explains why the defector is guilty, but Gilbert explains why the *partners* have the specific authority to hold them guilty. The feeling of being wronged is the phenomenological experience of a right being infringed, which requires a relational bond stronger than mutual expectation.

  ### 3. The Insufficiency of Assurance

  Bratman might object that his view captures this through "mutual responsiveness." If we are mutually responsive, my intention is conditioned on yours. However, this conditionality is still held within *my* mind. It is an "I-intend" that says "as long as you intend."

  The problem is that in many cases of joint action (like the spontaneous sofa lift), there is no explicit assurance or promise. Scanlon's principle requires that one *intentionally* leads another to expect performance. But in fluid joint action, the obligation often arises simply from the act of engaging together.

  Gilbert argues that the joint commitment is formed precisely at the moment of mutual engagement, creating a normative baseline that exists independently of prior assurances. If the obligation relied on Scanlon-style assurance, we would have to trace a history of communicative acts to find where the duty began. But intuitively, the duty begins when we *start acting as a unit*.

  Furthermore, assurance-based norms are vulnerable to the "exit clause." If I warn you *before* I drop out ("I'm going to stop lifting in five seconds"), I have technically managed your expectations. On a strict assurance view, I have mitigated the wrong. Yet, in the band scenario, announcing "I'm quitting now" mid-song does not make the departure permissible. It is still a violation of the joint commitment. This proves that the obligation is not about managing expectations (which warning solves) but about maintaining the bond (which warning does not solve). Only Gilbert's model, where the commitment binds the parties until *jointly* rescinded, explains why a warning does not grant license to abandon the shared goal.

  ### Conclusion

  Michael Bratman provides an excellent map of the cognitive architecture of shared agency: how we mesh plans and track each other's intentions. However, he treats the normativity of shared action as a byproduct of individual morality applied to social contexts.

  Margaret Gilbert is right because the phenomenology of joint action reveals a normative structure that is irreducible to the individual. The intuition that one cannot unilaterally rescind a joint activity is not a moral suggestion; it is a structural constraint on the agency involved. The feeling of being wronged is not the disappointment of a prediction, but the violation of a right granted by the plural subject. Because individual intentions are inherently revisable by the individual, no combination of them can produce a commitment that requires collective consent to dissolve. Therefore, to account for the asymmetry between personal intention and joint commitment, we must accept Gilbert's conclusion: joint action rests on a *sui generis* joint commitment that creates a plural subject, binding us in a way that mere interlocking individual intentions never could.
