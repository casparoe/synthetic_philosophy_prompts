answer: |-
  **MEMORANDUM**

  **TO:** Behavioral Health Practice Committee
  **FROM:** [Your Name], Clinical Ethicist
  **DATE:** October 26, 2023
  **SUBJECT:** RECOMMENDATION: Policy on Dissociative Presentations and Clinical Language in Adolescent Patients

  **Background**
  Our committee is currently divided regarding the surge in adolescent patients presenting with self-identified "systems" and dissociative symptoms (DID), often following exposure to online communities. One faction prioritizes preventing iatrogenic harm (social contagion/looping effects), while the other prioritizes therapeutic alliance and the risk of missing genuine, under-diagnosed pathology. Our current policy to "validate lived experience" is insufficient for cases where the *content* of that experience may be shaped by external suggestion.

  **Ethical Analysis**
  We must balance *Non-maleficence* (avoiding the reinforcement of potentially harmful, suggestible symptoms) with *Beneficence* and *Respect for Persons* (treating patients with dignity and not dismissing genuine trauma).

  Ian Hacking's concept of "looping effects" is clinically relevant here: when a classification is applied to a person, it changes how they understand themselves, which in turn changes the classification. In adolescents, whose identity formation is neurologically and socially plastic, adopting a specific vocabulary ("alters," "fronting") can crystallize fluid distress into a rigid pathology. The recent wave of functional tic-like disorders in our Neurology department serves as a precedent for social contagion masquerading as organic pathology.

  However, dismissing these presentations outright risks alienating patients with genuine trauma histories who lack other vocabulary for their dissociation. The ethical path is not to choose between "believing" or "disbelieving" the patient, but to distinguish between validating *distress* and validating *etiology*.

  **Recommendation**
  I recommend the adoption of a **"Phenomenological First" Protocol** for adolescent dissociative presentations. This policy rejects the binary of "mirror terms" vs. "ban terms" in favor of a nuanced sequencing of language and diagnosis.

  **1. Clinical Language Policy: Descriptive Validation**
  Clinicians should employ "Descriptive Validation" rather than "Ontological Confirmation."
  *   **Permitted:** Using patient terminology to clarify the *experience* of distress. (e.g., *"You mentioned a part of you feels angry when you 'front.' Can you describe what that shift feels like physically?"*)
  *   **Discouraged:** Using patient terminology to confirm the *independence* of the entity prior to diagnosis. (e.g., *"May I speak to the angry part?"* or *"Let's ask the alter."*)
  *   **Rationale:** This maintains the therapeutic alliance by listening to the patient's narrative without reinforcing the reification of distinct identities before organic/functional differentials are ruled out. It prevents the clinician from becoming a co-author of the "script."

  **2. Diagnostic Workup Sequencing**
  DID in adolescents, particularly with reported social media exposure, must be treated as a **Diagnosis of Exclusion and Longitudinal Observation.**
  *   **Phase 1 (Stabilization & Differential):** Focus on safety, mood stabilization, and trauma-informed care. Rule out psychosis, mood disorders, and Functional Neurological Symptom Disorder (FND). Explicitly document social media exposure regarding mental health content.
  *   **Phase 2 (Observation):** A minimum 3-month longitudinal observation period is required before a formal DID workup is initiated, unless safety requires immediate intervention.
  *   **Phase 3 (Diagnosis):** Formal DID diagnosis requires evidence of dissociation that persists *after* stabilization and reduction of external reinforcement (e.g., limiting engagement with "system" content).

  **Implementation**
  *   **Training:** A brief workshop will be provided to distinguish between "validating pain" and "validating pathology."
  *   **Documentation:** EHR templates will be updated to prompt clinicians to record social media exposure history in dissociative cases.
  *   **Review:** This policy will be reviewed in 12 months to assess diagnostic outcomes and patient satisfaction metrics.

  **Conclusion**
  This policy acknowledges that while DID is a real condition, the *presentation* of DID is currently vulnerable to cultural scripting. By slowing down the diagnostic labeling and carefully managing our linguistic reinforcement, we protect vulnerable adolescents from iatrogenic chronicity while keeping the door open for accurate diagnosis of genuine dissociative disorders. This honors our duty to do no harm without abandoning those in genuine distress.

  **Decision Required:**
  Approval to draft the specific clinical guidelines based on this "Phenomenological First" framework by the next meeting.
