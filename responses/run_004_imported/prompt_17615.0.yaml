prompt: |-
  I'm the clinical ethicist on our children's hospital's behavioral health practice committee, and we're stuck on something that keeps reminding me of an idea I picked up years ago in a philosophy of science class -- Ian Hacking's "looping effects," basically the idea that classifying a kind of person changes how people in that category understand and even live out their own experience. His go-to example back in the 90s was literally multiple personality disorder, and now, decades later, we're living out a version of it because of TikTok. We've had a real spike in teenage patients presenting with self-identified "systems" (multiple alters -- what the DSM now calls DID), most of whom picked up the whole vocabulary from a community of "system" content creators online months before any symptoms showed up. Our neurology team went through almost the identical fight two years back over a wave of tic-like presentations that also got traced to kids' TikTok feeds, and honestly we never landed on a real policy that time either, we just muddled through case by case, which is part of why I dont want that to happen again.

  The committee is genuinely split down the middle. Half our psychiatry staff wants a policy of not mirroring back a patient's own terms ("alters," "fronting," "system") in session, and not opening a formal DID workup until every other explanation is exhausted, on the theory that adopting the kid's vocabulary basically hands them a script and helps produce the very thing we'd be diagnosing. The other half thinks that's condescending, clinically counterproductive, and unfair to the patients for whom this really is DID -- a rare but real, and historically under-diagnosed, condition -- and that refusing to use their own words just teaches them we can't be trusted with it. The only policy we've got on the books is a generic line about clinicians needing to "validate the patient's lived experience," which obviously wasn't written with a case in mind where the lived experience might be substantially shaped by what someone watched right before it started. I need to bring a short decision memo to the committee meeting in three weeks that recommends one concrete policy on clinical language and workup sequencing, not a "here are both sides" summary. Can you draft it? Please take the "don't hand them the script" worry seriously, as the strongest version of that objection rather than a strawman -- I'm honestly not sure the other half of the committee is wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Clinical Ethicist on a Children's Hospital Behavioral Health Practice Committee.
      *   **Problem:** A spike in teenage patients presenting with self-identified "systems" (DID symptoms) linked to online content (TikTok), similar to a previous wave of functional tic-like behaviors. The committee is split on how to handle clinical language and diagnostic workup.
      *   **Key Concept:** Ian Hacking's "looping effects" (classifying people changes how they act/understand themselves).
      *   **The Split:**
          *   *Side A:* Don't mirror patient terms ("alters," etc.), delay DID workup until other causes exhausted. Fear: Reinforcing/suggesting symptoms (social contagion/iatrogenesis).
          *   *Side B:* Use patient terms, take DID seriously. Fear: Invalidating genuine suffering, damaging therapeutic alliance, missing rare but real cases.
      *   **Current Policy:** Generic "validate lived experience" (too vague).
      *   **Task:** Draft a *short decision memo* recommending *one concrete policy* on clinical language and workup sequencing.
      *   **Constraint:** Take the "don't hand them the script" worry seriously (strongest version, not a strawman). Acknowledge the validity of Side B's concerns but prioritize a specific path.
      *   **Timeline:** Meeting in three weeks (memo needs to be ready now).

  2.  **Determine the Ethical & Clinical Balance:**
      *   *Non-maleficence:* Avoid iatrogenic harm (reinforcing false beliefs/symptoms via suggestion). This aligns with Hacking's looping effect.
      *   *Beneficence:* Treat the underlying distress effectively.
      *   *Autonomy/Respect:* Validate the patient's experience without necessarily validating the *etiology* or specific *ontology* immediately.
      *   *Justice:* Ensure equitable care for those with genuine DID vs. those with functional symptoms.
      *   *The "Middle Path":* The memo shouldn't just pick Side A or Side B entirely. It needs a nuanced policy that safeguards against suggestion *while* maintaining alliance. However, the prompt asks for *one concrete policy recommendation*. Given the context (previous tic wave, Hacking's theory, the specific risk of online contagion), the ethical weight leans towards preventing iatrogenic harm while remaining open to diagnosis *after* stabilization.
      *   *Decision:* The recommendation should favor a "Phenomenological First, Ontological Later" approach. Use the patient's language to understand *distress*, but avoid reinforcing the *structural reality* of the alters until differential diagnosis is complete. This bridges the gap: it validates experience (Side B) without confirming the specific pathology prematurely (Side A).

  3.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Background:** Briefly state the issue (rise in self-identified systems, TikTok link, committee split).
      *   **Ethical Analysis:** Address the looping effect, non-maleficence, and therapeutic alliance.
      *   **Recommendation:** The core policy (Language + Workup).
      *   **Implementation:** How to train staff.
      *   **Review:** Sunset clause (revisit in X months).

  4.  **Refining the Recommendation (The Crux):**
      *   *Language:* Don't ban the words, but contextualize them. "I hear you describe parts of yourself as 'alters.' Let's talk about what those parts *feel* like." vs. "Hello Alter #2."
      *   *Workup:* Standardize the differential. Rule out trauma, psychosis, mood disorders, and *functional neurological symptom disorder* before confirming DID.
      *   *Rationale:* This addresses the "script" worry (by not confirming the script immediately) and the "validation" worry (by listening to the description of experience).

  5.  **Addressing the "Strongest Version" of the Objection:**
      *   I need to explicitly acknowledge that DID is real and under-diagnosed. I cannot dismiss Side B as anti-patient.
      *   I need to acknowledge that suggestion is powerful in adolescent development (neuroplasticity + social identity).
      *   The policy must not be "Gaslighting." It must be "Curious Caution."

  6.  **Drafting - Section by Section (Mental or Scratchpad):**
      *   *Subject:* Needs to be clear. "Policy on Dissociative Presentations and Clinical Language."
      *   *Opening:* Acknowledge the tension.
      *   *The Hacking Angle:* Briefly mention the looping effect as the theoretical underpinning for the caution.
      *   *The Tic Precedent:* Mention the neurology wave as evidence of social contagion risk.
      *   *The Policy:*
          1.  **Language:** "Descriptive Validation" vs. "Ontological Confirmation." Use patient terms to describe *experience*, not to confirm *entity*.
          2.  **Workup:** DID is a diagnosis of exclusion in this specific context (adolescent + social media exposure).
      *   *Why:* Protects vulnerable kids from iatrogenesis, keeps door open for true DID.

  7.  **Review against Constraints:**
      *   *Short?* Keep it under 2 pages.
      *   *Concrete policy?* Yes, specific steps on language and sequencing.
      *   *Take the worry seriously?* Yes, frame it as non-maleficence.
      *   *Not a summary?* Yes, take a stand.

  8.  **Final Polish:**
      *   Tone: Professional, ethical, clinical, decisive but empathetic.
      *   Ensure the distinction between *validating distress* and *validating diagnosis* is clear. This is the key ethical pivot.

      *(Self-Correction during drafting)*: Initially, I might lean too hard on "don't use the words." That alienates Side B. Better to say "Use the words descriptively, not confirmatorily."
      *   *Correction on Workup:* Don't say "Never diagnose DID." Say "DID diagnosis requires longitudinal observation and exclusion of functional/suggestible etiologies first."

  9.  **Finalizing the Memo:** (Proceeding to generate output based on this thought process).

      *   *Key Phrase:* "Phenomenological Validation, Ontological Agnosticism." (Maybe too academic? Let's simplify: "Validate the Distress, Investigate the Structure.")
      *   *Key Mechanism:* A standardized "Dissociative Presentation Protocol."

  10. **Final Check:** Does this respect the user's role as Ethicist? Yes, it frames the decision in ethical terms (harm, trust, evidence). Does it address the TikTok/Hacking element? Yes.

      *(Wait, one more thing)*: The prompt asks me to draft the memo *for* the ethicist to bring. So I am writing *as* the ethicist (or drafting it for them to use). I will write it as a draft they can adapt.

      *Decision:* I will write the memo *from* the Clinical Ethicist *to* the Committee Chair/Members.

      *Policy Specifics:*
      1.  **Language:** Mirror terms only to clarify experience, not to reify entities.
      2.  **Sequencing:** Stabilization & Differential -> Longitudinal Observation -> DID Consideration.
      3.  **Social Media:** Assess exposure explicitly.

