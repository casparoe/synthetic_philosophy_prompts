      *   *Decision:* The most intellectually honest position (and the one that respects Strawson's rigor) is that the Basic Argument *logically succeeds* in proving the impossibility of *Ultimate* Responsibility. However, the *concept* of Ultimate Responsibility is a phantom. Therefore, the argument succeeds in killing a ghost. Miriam's job is to tell Daniel that killing the ghost doesn't exorcise the body.
      *   *Actually, I'll go harder:* The Basic Argument succeeds. "Basic Desert" is dead. Miriam must argue for *Answerability* without *Desert*.

