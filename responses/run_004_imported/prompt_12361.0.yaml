      *   *Alternative:* I can argue that the Basic Argument fails because it demands an impossible standard of "God's eye" responsibility that is irrelevant to human agency. This is the P.F. Strawson (Galen's father) line: "Freedom and Resentment." We are embedded in reactive attitudes. To step outside them is to step outside humanity.
      *   *Let's go with the P.F. Strawson/Compatibilist synthesis.* Galen Strawson's argument is logically sound *within its own framework*, but that framework is alien to human practice. The verdict: The Basic Argument proves "Ultimate Responsibility" is impossible, but "Moral Responsibility" (as practiced by humans) survives because it relies on *relationship*, not *metaphysics*.
