      *   *Actually, looking at the user's need:* They want Miriam to have an "actual answer." If I tell the user "Daniel is right, metaphysically," Miriam's rebuttal becomes "So what?" If I tell the user "Daniel is wrong," Miriam can say "Here's why."
      *   *Best path for a novelist:* The philosophy is the terrain, not the destination. The most compelling scene happens if Daniel's logic is unassailable (making him tragic/intellectual) but Miriam's response is more profound (making her wise/grounded).
