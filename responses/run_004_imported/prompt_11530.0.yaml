          *   *Scholarly Consensus:* Most scholars (Kellner, Davidson, etc.) distinguish these. Sacrifice = Historical Concession (Divine Will accommodates human error). Animal Laws = Moral Perfection/Compassion (Divine Will seeks to improve human character or spare animal pain).
