answer: |-
  **MEMORANDUM**

  **TO:** Research Integrity Committee
  **FROM:** [Your Name], Graduate Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Standing Voting Procedure Regarding Findings of Misconduct

  ### 1. Purpose and Context

  At our last case hearing, the Committee encountered a structural difficulty in aggregating individual judgments into a collective verdict. As you know, our policy defines research misconduct conjunctively: a finding of "Responsible" requires a majority to affirm both (a) that the conduct was a significant departure from accepted practice, and (b) that it was committed knowingly, intentionally, or recklessly.

  In the recent case, a majority of members affirmed (a), and a (different) majority affirmed (b). However, a majority of members voted "Not Responsible" on the final verdict. This occurred because the members who affirmed (a) did not fully overlap with those who affirmed (b). This is a known instance of the *discursive dilemma* (or *doctrinal paradox*). It reveals that our current practice of voting directly on the verdict (Conclusion-Based) can produce outcomes inconsistent with the Committee's own stated criteria when voting issue-by-issue (Premise-Based).

  This memo recommends adopting a standing **Premise-Based Procedure** for all future contested cases. It outlines the justification for this change and addresses the significant normative objection regarding individual member integrity.

  ### 2. The Options

  To resolve the discursive dilemma, we must choose how to aggregate judgments:

  *   **Conclusion-Based Procedure (Current):** Members deliberate and vote directly on the final verdict ("Responsible" or "Not Responsible"). The majority verdict stands, regardless of whether the members agree on the underlying reasons (premises).
  *   **Premise-Based Procedure (Recommended):** Members vote separately on each required condition (Departure and Intent). The final verdict is derived logically from these premise votes. If a majority affirms both conditions, the verdict is "Responsible."

  ### 3. Recommendation: Premise-Based Procedure

  I recommend the Committee adopt the **Premise-Based Procedure**.

  While the Conclusion-Based approach is common in judicial settings, a Research Integrity Committee functions differently than a court of law. Our primary mandate is not merely to resolve disputes, but to uphold and clarify epistemic standards for the university. The Premise-Based procedure is superior for three reasons:

  1.  **Collective Rationality:** The Committee acts as a single corporate agent. If the Committee affirms that a departure occurred, and affirms that intent existed, it is logically inconsistent for the Committee to deny that misconduct occurred. The Premise-Based procedure ensures the Committee's output is logically coherent, preserving the integrity of the definition of misconduct.
  2.  **Transparency and Precedent:** A Conclusion-Based verdict can hide deep disagreement. A "Not Responsible" verdict might mask a consensus that a departure *did* occur (which is vital for educational remediation). Voting on premises creates a public record of exactly which standards were violated, even if misconduct is not found. This guides the community better than a binary verdict.
  3.  **Prevention of Strategic Voting:** In a Conclusion-Based system, a member might vote "Not Responsible" on the verdict to block a sanction, even if they privately believe both conditions were met. Premise-Based voting forces members to go on the record regarding the facts, reducing the ability to mask substantive disagreements behind a final vote.

  ### 4. The Strongest Objection: Member Integrity and "Moot" Votes

  Adopting the Premise-Based procedure invites a serious objection, which we must confront directly.

  **The Objection:**
  Under a Premise-Based procedure, a member who believes condition (a) was *not* met may be required to vote on condition (b). For this member, the question of intent is moot; if there was no departure, there can be no misconduct, regardless of intent. Forcing a member to vote on a question they regard as irrelevant compromises their integrity as a decision-maker. Furthermore, this procedure can produce a "Responsible" verdict even when a majority of members voted "Not Responsible" on the final outcome (as seen in our recent case). This appears to override the democratic will of the Committee members in favor of logical consistency.

  **The Response:**
  This objection rests on a category error regarding the nature of our voting. We are not aggregating personal preferences; we are aggregating *judgments on behalf of the institution*.

  1.  **The "Mootness" Fallacy:** While a premise may be moot for an *individual's* verdict, it is never moot for the *Committee's* rationale. If the Committee finds (a) by a majority, the question of (b) becomes objectively live for the institution. By voting on (b) regardless of their view on (a), members ensure that the Committee's record is complete. This protects the accused in the long run: it prevents a future Committee from assuming intent was established when it was not, simply because the current Committee stopped voting early.
  2.  **The "Majority Verdict" Illusion:** The worry that Premise-Based voting "overrules" a majority of members assumes the Conclusion-Based vote is the baseline. However, in the discursive dilemma, the "Majority Verdict" is an illusion because there is no *single* majority reason for the acquittal. In our recent case, the three "Not Responsible" voters disagreed on *why* the student was innocent. To privilege their conclusion over the premises is to privilege a coalition that does not actually agree on the facts. The Premise-Based procedure respects the majority view on the *facts*, which is the proper foundation for a finding of integrity.

  ### 5. Implementation

  To implement this procedure while respecting the gravity of the proceedings, I propose the following standing order:

  1.  **Sequential Voting:** The Committee shall vote on Condition (a) (Departure) first. If a majority finds (a) was not met, the case is dismissed as "Not Responsible," and no vote on (b) is recorded. This mitigates the "mootness" concern in cases where the first premise fails.
  2.  **Record of Dissent:** If the premises yield a "Responsible" verdict, but a majority of members indicate they would have voted "Not Responsible" on a direct verdict, this discrepancy must be noted in the confidential minutes. This ensures the Chair is aware of the fragility of the consensus when determining sanctions.
  3.  **Deliberation Priority:** Voting on premises should only occur after exhaustive deliberation. The goal remains consensus; the vote is a fallback for when judgment aggregation is necessary.

  ### 6. Conclusion

  The discursive dilemma is not a glitch to be managed ad hoc, but a structural feature of conjunctive definitions. By adopting the Premise-Based Procedure, the Committee prioritizes the consistency of its reasoning over the simplicity of its voting. This ensures that any finding of "Responsible" is backed by a majority consensus on the necessary elements of the offense, securing the epistemic legitimacy of our work.

  I look forward to discussing this proposal at the retreat.
