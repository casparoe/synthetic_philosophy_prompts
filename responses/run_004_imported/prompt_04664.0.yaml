answer: |-
  The air off the Delaware was cold enough to sting the ears, the kind of Princeton November chill that seeped through wool. They walked at the same slow, shuffling pace they had perfected over years, Einstein with his hands buried deep in the pockets of an oversized cardigan, Gödel buttoned tightly into a grey overcoat that seemed a size too large, his scarf wound high around his jaw.

  They had left Fuld Hall ten minutes prior. The silence between them was comfortable, the silence of two men who have exhausted the day's technical problems and are now left with the debris.

  "You looked tired today, Kurt," Einstein said, stepping over a crack in the sidewalk. "When Oppenheimer was talking about the funding. You were staring at the blackboard as if it were a tombstone."

  Gödel adjusted his spectacles. "I was not tired. I was considering the economy of it. All that effort. To build a machine that thinks, they say. But they do not ask what happens to the thinking when the machine stops."

  "The machine breaks," Einstein said. "The electricity goes. The light in the room remains, but the lamp is dark."

  "But the light in the room is not *personal*," Gödel said. He stopped at the corner of Nassau Street, waiting for a car to pass. "That is your comfort, Albert. To be a lamp. But I am not a lamp. I am a viewer of the light. If the viewer is extinguished, the relationship is broken. And a rational world does not break relationships without cause."

  Einstein chuckled softly, a rumbling sound. "Rational? You find the world rational? Look at the history of our century. Look at the germs in the gut of a child. Is that rational?"

  "Physical suffering is a local problem," Gödel said, stepping off the curb. "I speak of the structure. Mathematics is possible. Science is possible. This proves the world is constructed according to reason. It is not chaos. If the structure is rational, the purpose must be rational."

  "And the purpose is?"

  "Development," Gödel said. "Intellectual and moral. We are given capacities—capacities for understanding, for love, for justice—that require time to unfold. A human life, even a long one, is a fraction of a second. To create a being capable of perceiving the infinite, and then to extinguish him just as he begins to perceive it... it is like building a telescope to view a star and smashing it the moment the lens is polished. It is wasteful. And God is not wasteful."

  Einstein pulled his cardigan tighter. "Ah, Kurt. There it is. You make God a bookkeeper. He must balance the ledger. He owes us more time because He gave us big eyes."

  "I am saying He is consistent," Gödel insisted, his voice rising slightly, thin in the cold air. "If materialism were true, the mind would be a function of the brain. A finite state machine. But you know my work. You know better than anyone that a formal system cannot prove its own consistency from within. Yet the human mind *sees* the truth of propositions that the system cannot prove. Therefore, the mind is not the system. It is not the brain."

  Einstein nodded slowly. "I have never accepted that the brain is merely a computer. I agree there. The 'I' is something more."

  "Then if the 'I' is not matter," Gödel pressed, "it is not bound by the laws of matter. Decay is a law of matter. If the mind is independent of matter, decay does not touch it. It is a logical necessity. The soul is not a ghost in the machine, Albert. It is the operator who cannot be reduced to the gears."

  "But why *you*?" Einstein asked. He stopped walking and turned to face his friend. The streetlights were flickering on, casting long, wavering shadows. "Suppose I grant you this. The mind is not the brain. The operator is distinct from the gears. Why must the operator remain *Kurt Gödel*? Why not merge? Why not return to the substance of the rational order, like a drop of water returning to the ocean? The drop ceases to be a drop, but the water remains."

  Gödel looked down at his shoes. "Because the view is unique. The ocean knows nothing. Only the drop knows the ocean. If the drop dissolves, the specific knowledge is lost. Every individual represents a unique vantage point on the absolute. To destroy the vantage point is to lose a part of the truth forever. A rational God would not allow the loss of data."

  "Data," Einstein murmured. He started walking again. "You see, this is where I feel the cold most. You argue for immortality as a preservation of assets. I look at the stars, Kurt. They burn for billions of years and then they collapse. They are magnificent. They do not ask to be remembered. They are content to be part of the harmony."

  "That is poetry," Gödel said sharply. "Not logic. Stars do not have consciousness. We do. To treat a conscious being like a star is to ignore the very quality that makes the universe observable."

  "Or perhaps," Einstein said gently, "the consciousness is the universe observing itself, and it does not matter which lens is used. I am part of the whole, as a mouse is part of the whole. I do not demand that the mouse live forever to justify the trap. I accept the trap because the whole is beautiful."

  "But you are not a mouse," Gödel said. "You are the one asking about the trap. That changes the equation."

  "Does it? Or does it just make the tragedy sharper?" Einstein sighed. "I have said it before. I do not believe in the immortality of the individual. I find the idea egotistical. Why should I, Albert, persist? I have done my work. The equations remain. The love I gave remains in those who loved me. What more is there? To wake up in a white room and continue the conversation? It seems... small."

  "It is not about continuing the conversation," Gödel said. "It is about the *possibility* of the conversation. We are approaching asymptotes. We get closer to the truth, closer to the good, but we die before we touch it. If there is no continuation, then the moral law within us is a lie. It commands us to strive for perfection, but it places perfection out of reach of our nature. That is a contradiction. A rational world cannot contain a fundamental contradiction between moral command and ontological possibility."

  Einstein was quiet for a long stretch. They passed a row of houses, the sound of a piano drifting from an open window.

  "You argue well," Einstein said finally. "You always have. You build a cage of logic and tell me I must live inside it because there is no door. But I wonder, Kurt... is it possible that your logic is a defense? Not against death, but against the indifference of the cosmos?"

  Gödel stiffened. "I do not fear death."

  "No? You worry about poison. You worry about the gas lines. You worry about the food."

  "That is precaution," Gödel said, his voice tight. "This is different. This is ontology."

  "Is it?" Einstein stopped at the gate of his home on Mercer Street. The porch light was on, a warm yellow beacon. He turned to Gödel, his face lined with seventy-six years of smoke and thought. "You say the world is rational. I say it is magnificent, and beyond our reason. You say it would be irrational to waste a mind like yours. I say it would be arrogant to assume the universe requires our minds to continue in order to be complete."

  "It requires *truth* to be known," Gödel said. "And we are the knowers."

  "Perhaps," Einstein said. He put a hand on Gödel's shoulder. The fabric of the coat was rough under his palm. "But consider this. If you are right, and we go on... then the urgency of *now* is diminished. If I know I will see you again, and we will finish this walk in another place, does this walk matter as much? The finality gives the step its weight. The lamp is beautiful *because* it goes dark."

  Gödel looked at the hand on his shoulder, then up at Einstein's eyes. For a moment, the rigid logician seemed to waver, the anxiety he carried in his posture softening into something like grief.

  "If the step is the only thing," Gödel whispered, "then the fall into the abyss at the end of the path makes the step a mockery. It renders the rationality of the path unintelligible. I cannot accept a universe that is intelligible in its parts and insane in its totality."

  "And I," Einstein said, removing his hand, "cannot accept a universe that caters to my desire for continuity. I must trust the harmony, even if it silences me."

  They stood at the gate. The wind picked up, rustling the dry leaves in the gutter. Neither man moved to open the latch.

  "I will see you tomorrow, Albert," Gödel said.

  "Yes," Einstein replied. "We will walk to the Institute. We will talk of unified fields. We will talk of nothing."

  "And then we will walk back," Gödel said.

  "And then we will walk back," Einstein agreed.

  Gödel nodded, once, sharply. He turned and began the walk back toward the boarding house where he lived alone. Einstein watched him go, a grey figure receding into the dark of the street, until the cold forced him to turn the key and step inside. He closed the door, but for a long moment, he stood in the hallway, listening to the silence of the house, wondering if the silence was a peace, or merely an absence.

  Up the street, Gödel walked precisely on the cracks of the pavement, counting them, proving to himself with every step that the path was ordered, that the numbers held, that the sequence did not break. But he did not look up at the stars, for fear they might look back and show him nothing but empty space.
