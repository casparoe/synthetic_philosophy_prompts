answer: |-
  This is a profound reading of Sidgwick, and it aligns with the consensus of modern intellectual historians like Bart Schultz and Jeremy Strickland. You are quite right to see Sidgwick's psychical research not as a Victorian eccentricity, but as the empirical wing of his ethical project. If the "dualism of practical reason" (the conflict between rational egoism and utilitarianism) is to be resolved, there must be a cosmic order where duty and self-interest ultimately coincide. Without evidence of survival and divine governance, Sidgwick feared morality was rationally groundless.

  Given this high-stakes context, Sidgwick's reaction to the Daryl Bem "Feeling the Future" episode (2011) and the subsequent replication crisis would likely be a complex mixture of **methodological vindication** and **existential resignation**. He would welcome the reforms (preregistration) as the realization of the rigor he demanded, but he would view the failure of the results to hold as a confirmation of his late-life pessimism regarding the *availability* of such proof.

  Here is how Sidgwick would likely parse the episode, based on his writings and the SPR addresses.

  ### 1. On Bem's Initial Publication: "Extraordinary Claims Require Extraordinary Proof"
  Sidgwick would have been initially intrigued by Bem's publication in a mainstream journal (*Journal of Personality and Social Psychology*). One of Sidgwick's frustrations with the SPR in the 1880s and 90s was the ghettoization of psychical research; he wanted these questions subjected to the scrutiny of mainstream science, not just spiritualist circles.

  However, Sidgwick would have immediately scrutinized the methodology. In his **Fifth Presidential Address (1892)**, Sidgwick warned against the "fallacy of averages" and the tendency to count hits while ignoring misses. He understood intuitively what modern statistics calls **p-hacking** or **researcher degrees of freedom**. Bem's study relied on flexible experimental designs where the analysis path could be adjusted to find significance.

  Sidgwick would likely have treated Bem's initial results exactly as he treated the early reports of telepathy: as *prima facie* anomalies that demand replication before they can be admitted as facts. He wrote in *The Methods of Ethics* that we must not allow our hopes to dictate our beliefs. He would have cautioned his colleagues against celebrating Bem's findings as the "cosmic guarantee" they sought, reminding them that wishful thinking is the greatest enemy of the SPR's credibility.

  ### 2. On Preregistration and Open Science: The Institutionalization of Sidgwickian Rigor
  If Sidgwick were to encounter the reforms provoked by the Bem affair—specifically **preregistration**, **open data**, and **registered reports**—he would likely view them as the institutional fulfillment of the standards he tried to enforce personally.

  Sidgwick's leadership of the SPR was defined by an almost agonizing caution. He frequently blocked the publication of promising cases if the chain of testimony wasn't airtight. He was willing to sacrifice the Society's momentum for the sake of accuracy. Preregistration is essentially a mechanism to prevent the "wishful thinking" Sidgwick feared; it locks in the hypothesis and analysis plan before data collection, preventing the researcher from unconsciously molding the data to fit the desired outcome.

  Sidgwick would argue that if psychical research is to solve the "dualism of practical reason," the evidence must be **coercive**. It must compel the assent of the skeptic. Anomalies found through flexible analysis are not coercive; they are merely suggestive. He would welcome preregistration because it is the only way to produce evidence strong enough to bear the metaphysical weight he wanted to place upon it. In this sense, he would be a staunch advocate of the "Open Science" movement.

  ### 3. On the Replication Failure: Vindicating Pessimism
  This is where the tragedy of Sidgwick's position emerges. When Bem's results failed to replicate under stricter conditions (as shown by Wagenmakers et al. and others), Sidgwick would not have been surprised. In fact, he would have seen it as a validation of his **Fifth Presidential Address**.

  In that address, Sidgwick made a crucial concession: **the continued absence of evidence is itself evidence.** He acknowledged that if, after decades of rigorous search, the phenomena remain elusive and unreplicable, the rational conclusion is that they do not exist (or at least, do not exist in a way that impacts our scientific worldview).

  The Bem episode demonstrates exactly this dynamic. When methods were loose, "psi" appeared. When methods were tightened (via replication and preregistration), "psi" disappeared. Sidgwick would interpret this as follows:
  *   **Scientifically:** It proves that the earlier positive results were artifacts of methodological laxity, not genuine anomalies.
  *   **Existentially:** It reinforces the "dualism of practical reason." If strict science cannot find evidence of precognition or survival, then the "cosmic guarantee" remains a matter of faith, not knowledge.

  Sidgwick died disappointed that the SPR had not secured the proof he needed to ground his ethics. The replication crisis would tell him that the problem wasn't just the *elusiveness* of the phenomena, but the *fallibility* of the human mind (including scientists) in detecting them. He would likely feel a stoic sorrow: the tools to find the truth are finally sharp enough (preregistration), but they cut against the hope he cherished.

  ### 4. The Verdict: Integrity Over Consolation
  Ultimately, Sidgwick's reaction would be defined by his commitment to **intellectual veracity** over **emotional comfort**.

  In a famous letter to his student E.E. Constance Jones, Sidgwick wrote that if he were convinced that there was no life after death, he would still try to do his duty, though the "rationality" of it would be diminished. He prioritized truth over the utility of belief.

  Therefore, regarding the Bem episode:
  1.  **He would champion the reforms.** He would argue that the replication crisis proves why the SPR needed more Sidgwicks and fewer mediums. The rigor he demanded was not obstructionism; it was necessary protection against self-deception.
  2.  **He would accept the negative result.** He would not cling to Bem's initial findings as a lifeline. To do so would violate the very ethical integrity he sought to preserve.
  3.  **He would remain ethically unsettled.** The failure of Bem's study to hold up under preregistered scrutiny confirms Sidgwick's fear that we may live in a universe where virtue and self-interest are not harmonized by scientific law.

  ### Conclusion for your Seminar
  You might frame Sidgwick as a **proto-skeptic of the replication crisis**. He understood, long before p-values were standard, that human desire biases observation.

  If you are presenting this, a compelling angle is to suggest that **Sidgwick would view Preregistration not just as a statistical tool, but as a moral technology.** It is a mechanism to discipline the will, ensuring that our desire for a certain outcome (whether it be psi, or a significant p-value) does not corrupt our perception of reality.

  He would welcome the rigor of the post-Bem era because it finally creates the conditions where a "yes" would be undeniable. But he would sadly acknowledge that the "no" we are currently getting is likely the true one. This leaves him in the position he occupied at the end of his life: a man who hoped science would save morality, but who loved truth enough to accept that it might not.
