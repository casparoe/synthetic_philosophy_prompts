      *   *Q2: The "Arranged X-wise" problem.* Push on the paraphrase.
          *   *Follow-up:* If the paraphrase requires reference to the arrangement, doesn't that presuppose the very composite structure you deny?
      *   *Q3: The Vagueness Argument (Required).* Van Inwagen argues against contact/fastening because they are vague. But "life" is vague (embryogenesis).
          *   *Follow-up:* If you accept vagueness in life, why reject it in contact?
      *   *Q4: Biological Individuality (Required).* Use siphonophores/slime molds. Biology doesn't agree on "organism."
          *   *Follow-up:* If metaphysics depends on biology, and biology is indeterminate, is metaphysics indeterminate?
      *   *Q5: The Normative/Functional Aspect.* Chairs have functions. Lives have functions. Why privilege one?
          *   *Follow-up:* If function grounds truth-approximation, why not ground existence?
      *   *Q6: The "Nearly True" Metric.* What makes a proposition *nearly* true?
          *   *Follow-up:* Is there a truth-likeness metric that doesn't collapse into Universalism?
      *   *Q7: The Causal Exclusion/Overlap.* If simples do all the causal work, what does "constituting a life" add?
          *   *Follow-up:* If it adds nothing causal, is it ontologically free-riding?
      *   *Q8: The Killer Question.* Needs to combine the semantic retreat with the ontological commitment in a way that traps him. The tension between the *precision* required for metaphysics and the *vagueness* admitted in the "life" criterion, coupled with the semantic deflation.

      *Refining the Sequence for Maximum Pressure:*
      Let's order them to tighten the noose.
      1.  Semantics ("Nearly True").
      2.  Paraphrase ("Arranged Chairwise").
