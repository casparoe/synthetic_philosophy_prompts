  4.  **Drafting the Content (incorporating follow-ups):**

      *   *Q1:* Focus on the truth-conditions. If "There is a chair" is false, what makes it *nearly* true?
      *   *Q2:* Focus on the paraphrase. "Simples arranged chairwise." Does 'arranged' imply a relation that requires a relata (the chair)?
