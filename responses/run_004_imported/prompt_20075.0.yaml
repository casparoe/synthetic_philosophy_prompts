prompt: |-
  I'm a PhD student in philosophy of biology and I help run my department's grad colloqium -- next month's visiting speaker defends van Inwagen's answer to the special composition question, that the xs compose something iff their activity constitutes a life, so strictly there's no chairs, no stars, just simples 'arranged chairwise' and so on. Whenever someone presses him on whether the arranged-X-wise talk is just universalism with extra steps, he retreats to 'ordinary sentences about chairs are nearly as good as true' -- write me a run of questions that makes that retreat harder to lean on each time. Somewhere in there I need one question on why his own vagueness argument against rivals like contact or fastening doesn't equally kill off 'constituting a life' (embryogenesis and dying are exactly the borderline cases that argument's supposed to rule out), and one that uses something like siphonophores or slime molds to ask whether grounding composition in biological individuality just relocates the question into a science that's itself unsettled about what counts as one organism. Give me seven or eight questions total, each with a quick follow-up keyed to whatever dodge he'll probably reach for, and end on the one question he won't have a tidy answer for.
reasoning: |-
  Here's a thinking process that leads to the suggested questions:

  1.  **Analyze the Request:**
      *   **User:** PhD student in philosophy of biology, runs a grad colloquium.
      *   **Speaker:** Defends Peter van Inwagen's answer to the Special Composition Question (SCQ): Composition occurs iff the activity of the simples constitutes a life (Organicism).
      *   **Speaker's Strategy:** When pressed on whether "arranged chairwise" is just Universalism with extra steps, he retreats to van Inwagen's quasi-nihilist claim: "Ordinary sentences about chairs are nearly as good as true."
      *   **Goal:** Write a run of 7-8 questions that make this retreat harder to lean on each time.
      *   **Specific Requirements:**
          *   Include one question on the vagueness argument (why doesn't it kill 'constituting a life' given embryogenesis/dying?).
          *   Include one question on biological individuality (siphonophores/slime molds) showing science is unsettled.
          *   Each question needs a quick follow-up keyed to likely dodges.
          *   End on the "killer" question he won't have a tidy answer for.
      *   **Tone:** Professional, sharp, philosophical, suitable for a grad colloquium.

  2.  **Deconstruct van Inwagen's Position (Organicism):**
      *   *SCQ:* When do xs compose y?
      *   *Answer:* When xs constitute a life.
      *   *Ontology:* Only simples and living organisms exist. No chairs, tables, stars.
      *   *Semantics:* "There is a chair" is false strictly speaking, but "nearly as good as true" because there are simples arranged chairwise.
      *   *Motivation:* Avoids arbitrariness of contact/fastening; avoids commitment to too many objects (Universalism); avoids nihilism's error theory of ordinary discourse.
      *   *Weaknesses:* Vagueness of "life"; status of non-living composites; reliance on biological notions that might be messy.

  3.  **Drafting the Sequence (Iterative Process):**

      *   *Q1: Setting the stage (Semantics vs. Ontology).* Start with the "nearly as good as true" claim. It's the shield.
