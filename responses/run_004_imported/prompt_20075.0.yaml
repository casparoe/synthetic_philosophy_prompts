answer: |-
  Here is a sequence of eight questions designed to tighten the pressure on the speaker's semantic retreat, moving from the coherence of "near-truth" to the empirical instability of "life," and ending on the structural contradiction in van Inwagen's motivation.

  **1. The Semantic Shield**
  "You motivate Organicism partly to save ordinary discourse from error, claiming 'There is a chair' is *nearly as good as true*. But on your ontology, the proposition is strictly false. What is the truth-maker for the claim that it is *nearly* true? If there are no chairs, what feature of reality is this proposition approximating?"
  *   **Follow-up:** If he says it's just the arrangement of simples: "Then isn't the 'near-truth' just a pragmatic gloss on a strict Universalist ontology? Why not save the truth of the sentence instead of saving the falsehood of the ontology?"

  **2. The Paraphrase Problem**
  "When you paraphrase 'There is a chair' as 'There are simples arranged chairwise,' the predicate 'arranged' seems to do a lot of heavy lifting. Does this arrangement relation hold between the simples directly, or does it require a composite structure to ground the pattern?"
  *   **Follow-up:** If he says it holds between simples directly: "But without a composite to bear the structure, isn't 'arranged chairwise' just a primitive brute fact that looks suspiciously like a chair without the name? How is this ontologically parsimonious?"

  **3. The Vagueness Argument (Required)**
  "Van Inwagen rejects contact and fastening because they admit of borderline cases, arguing that composition cannot be vague. But 'constituting a life' seems to have exact same problem: embryogenesis and the moment of death are paradigmatic borderline cases. Why doesn't your own vagueness argument rule out Organicism?"
  *   **Follow-up:** If he says biological vagueness is merely semantic: "If the vagueness is in the language, then the SCQ answer is vague in the language. But you argued the *fact* of composition must be precise. How do you get precise facts from vague biological predicates?"

  **4. The Biological Individuality Objection (Required)**
  "Consider siphonophores like the Portuguese Man o' War, or slime mold aggregates. Contemporary biology is often unsettled on whether these count as one organism or a colony of many. If metaphysics rests on 'constituting a life,' does the existence of composite objects depend on the current consensus of marine biologists?"
  *   **Follow-up:** If he says metaphysics can settle what biology cannot: "Then you are doing the biology yourself. On what empirical grounds do you draw the line where the scientists hesitate? Aren't you just stipulating the answer?"

  **5. The Causal Idler**
  "If the simples arranged chairwise do all the causal work of supporting weight or breaking when hit, what causal work is left for 'the life' to do in your ontology? If the organism does no extra causal work over the simples, is it not an ontological free-rider?"
  *   **Follow-up:** If he says lives *are* the causal activity of the simples: "Then the life is just an event or process, not an object. If so, why does that event license the existence of a *substance* (the organism) rather than just the activity itself?"

  **6. The Universalism Comparison**
  "Critics charge that Organicism is just Universalism with extra steps: you admit the simples exist, you admit they are arranged, you admit the sentences are nearly true. What substantive work is the denial of the chair doing that Universalism doesn't do better?"
  *   **Follow-up:** If he says it avoids ontological bloating: "But if you accept 'near-truth' for chairs, you've already accepted the *utility* of the bloating. Why is ontological parsimony valuable if it forces you to treat useful discourse as systematically false?"

  **7. The Metric of Nearness**
  "You rely heavily on the 'nearly as good as true' retreat. Is there a formal semantics for 'near-truth' that prevents slippery slopes? If 'chair' is nearly true, is 'unicorn' nearly true if there are simples arranged unicorn-wise in a fiction?"
  *   **Follow-up:** If he distinguishes based on causal integration: "Then we are back to functional definitions of objects. If function licenses near-truth, why doesn't it license existence? What is the metaphysical difference between functioning as a chair and being a chair?"

  **8. The Killer Question**
  "Your primary motivation for Organicism over rivals is that it provides a *precise*, non-arbitrary answer to the SCQ, avoiding the vagueness of contact or fastening. But if 'constituting a life' inherits the biological indeterminacy of embryogenesis or colonial organisms, you haven't eliminated vagueness; you've just outsourced it to biology. So, do you deny the biological vagueness (against the science), or admit the metaphysical vagueness (against your own argument)?"
  *   **Follow-up:** (No follow-up needed; let the silence hang. If he speaks, simply ask: "Which horn of the dilemma do you choose?")
