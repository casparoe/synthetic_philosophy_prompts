prompt: |-
  My aunt died two weeks ago, and I'm giving her eulogy at the funeral this Saturday. I want to get it right, and it's turning out to be harder than I expected. She wasn't an academic — she worked thirty-one years as a courtroom stenographer — but after a heart attack in her early sixties she started sitting with a small Buddhist meditation group, and somewhere in there she fell hard for a second-century Indian philosopher named Nāgārjuna. What got her wasn't the meditation so much as his logic: the "tetralemma," the idea that of any four positions you could take on a serious question — that something is the case, that it isn't, that it's both, that it's neither — none of the four actually survives once you look closely at what it would take for it to be true. She used this on everything, but especially, in the last few years, on herself. She would not let anyone say she'd be reborn, or that she'd be watching over us — that was the first corner. She would not let anyone say she'd simply be gone and that's that — the second. She'd cut off "well, maybe both, in some sense" just as fast — the third. And she was the strictest person I've ever known about the fourth: she always said that "neither is true, the question doesn't even apply" is a real position, hard to earn, and not just a polite way of shrugging and saying nobody can know. Two years ago, at my grandmother's funeral, she actually stood up mid-sermon and did this to the priest, gently, over some line about a better place — it's a story the family still tells on her.

  I'm not a philosopher, and neither is almost anyone else who'll be in that room — but four or five people from her meditation group will be, and they will know if I fake it. I've spent the last few nights with her copy of the Mulamadhyamakakarika (I have no idea if I'm even saying that right), which she annotated so heavily you can barely find the original text under her handwriting, trying to actually understand this instead of just repeating phrases I half-remember from Sunday dinners. Here is my problem, and I'd like you to solve it by writing the eulogy itself, about five minutes long as delivered: I can't have her survive her death, I can't have her simply end, I can't hedge with "both," and I can't take refuge in "neither" if all that means is "who's to say" — she would have called that a fifth corner, cheating dressed up as humility, since even "it's all empty, so none of this matters" was a comfort she refused herself. What I need from you is something that still sounds like a eulogy and not a logic seminar — something that will let a room full of people who loved her, and who are not going to follow an argument, actually grieve by the end of it.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** Niece/Nephew of the deceased.
      *   **Deceased:** Aunt, worked 31 years as a courtroom stenographer, practiced Buddhism/meditation later in life, devoted follower of Nāgārjuna (Madhyamaka philosophy/Emptiness/Tetralemma).
      *   **Key Philosophical Constraint:** The Tetralemma (Catuṣkoṭi).
          1.  She exists after death (Reborn/Watching). -> *Reject.*
          2.  She does not exist after death (Gone forever). -> *Reject.*
          3.  Both. -> *Reject.*
          4.  Neither (The question doesn't apply/Empty). -> *Reject* if used as a cop-out ("who knows"). Must be the "hard-earned" version where the conceptual framework itself dissolves.
          *   *Crucial Nuance:* She refused comfort. She wouldn't allow "emptiness" to become a new dogma or a way to say "nothing matters."
      *   **Audience:** Family/Friends (mostly non-philosophers) + Small group of meditation friends (who know the philosophy).
      *   **Tone:** Eulogy (emotional, grieving, celebrating life), *not* a logic seminar. Needs to allow grief.
      *   **Length:** ~5 minutes spoken (approx. 750-900 words).
      *   **Goal:** Write the eulogy itself.

  2.  **Deconstruct the Philosophical Challenge:**
      *   How do you eulogize someone without asserting their presence or their absolute absence?
      *   Standard eulogies rely on "She lives on in our hearts" (Corner 1/3) or "She is at peace/gone" (Corner 2).
      *   The Aunt's specific view: Concepts break down. The *question* of "where is she?" is the problem, not the answer.
      *   *The Stenographer Angle:* She recorded truth for 31 years. She knew the precise weight of words. She knew that what is *said* isn't always what *is*.
      *   *The Grief Angle:* Grief feels like absence. But love feels like presence. The tension between these is where the "Middle Way" lives, not as a compromise, but as a dissolution of the binary.
      *   *Avoiding the "Fifth Corner":* I can't just say "It's all a mystery." I have to show that the *grief itself* is the proof of the connection that defies categorization.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Connect her profession (stenographer) to her philosophy (precision of language).
      *   **The Work:** Mention the 31 years. She captured truth without owning it.
      *   **The Philosophy (The Hard Part):** Introduce Nāgārjuna gently. Don't use Sanskrit terms unless necessary (maybe just "the philosopher she loved"). Explain the "four corners" without making it sound like a lecture. Use the story of the grandmother's funeral (it's a great anecdote).
      *   **Applying it to Death:** This is the tightrope walk.
          *   Not "She's watching."
          *   Not "She's gone."
          *   Not "Both/Neither" as a cop-out.
          *   *Solution:* Focus on the *impact* and the *relationship* as something that exists outside the categories of existence/non-existence. The love is real, even if the "location" of the lover is undefined.
      *   **The Grief:** Validate the pain. If she refused comfort, we shouldn't offer false comfort. We offer *truth*.
      *   **Closing:** A return to silence/presence. A commitment to live as she taught (without clinging).

  4.  **Refining the Voice:**
      *   Needs to sound like a grieving relative, not a monk.
      *   Use the stenographer imagery: transcripts, silence between words, recording vs. interpreting.
      *   Keep the philosophy grounded in *her* character (stubborn, precise, kind).

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. My aunt was a stenographer. She wrote down what people said. Later she liked Nagarjuna. He said you can't say things exist or don't exist. She stopped people saying she'd be in heaven. She also stopped people saying she'd be nothing. At Grandma's funeral she corrected the priest. I read her book. It's hard. I can't say she's here. I can't say she's gone. But I feel her. We miss her. Let's not lie about where she is. Let's just miss her.

      *Critique 1:* Too blunt. Too seminar-like. Needs more warmth and flow. The transition from stenography to philosophy needs to be smoother.

  6.  **Drafting - Iteration 2 (Focusing on the "Middle" without saying "Middle"):**
      Start with the silence. Stenographers know silence. She loved logic because it cleared away the noise.
      Address the "Where is she?" question directly.
      "If I tell you she's in a better place, she'd haunt me."
      "If I tell you she's nothing but dust, I lie about my love."
      "So what is left?"
      The memory. The habit of love.
      End with the meditation group nod.

      *Critique 2:* Better. But needs to ensure the "Fourth Corner" trap is avoided. It can't just be "we don't know." It has to be "the question of 'where' is the wrong tool."

  7.  **Finalizing the Text (incorporating the constraints):**
      *   *Word Count Check:* 5 minutes is roughly 750-850 words at a moderate pace.
      *   *Key Phrase:* "The silence between the words." (Fits stenographer + emptiness).
      *   *Key Story:* The grandmother's funeral interruption.
      *   *Philosophical Check:* Ensure I don't affirm existence or non-existence. Focus on the *relationship* as the phenomenon that defies the tetralemma.

      *(Self-Correction during drafting)*: I need to be careful not to make the meditation friends roll their eyes. I should acknowledge the *Mulamadhyamakakarika* implicitly or explicitly but keep it accessible. Let's mention the book but focus on the *handwriting*.

      *Emotional Arc:* Start with her precision -> Move to her stubbornness about truth -> Address the loss -> End with a call to action (live truthfully).

  8.  **Final Polish:** Check the rhythm. Ensure pauses are indicated or implied by sentence structure. Make sure the "no comfort" rule is honored—don't offer "she's in a better place" even poetically. Offer presence in grief instead.

      *(Final thought on the "Fourth Corner"):* The prompt says she rejected "neither" if it was just "who's to say." It must be "the question doesn't apply." How to phrase that in a eulogy? "Asking where she went is like asking where the silence goes when a sound begins." No, that's too poetic/abstract. Better: "We are looking for her in places she taught us don't exist."

      Let's write.

      *Title:* None needed, just the text.
      *Tone:* Respectful, clear, slightly vulnerable.

      *(Word Count Check during drafting)*: Keep an eye on length. Don't ramble on the philosophy. Keep the focus on *her*.

      *Specific constraint check:* "I can't take refuge in 'neither' if all that means is 'who's to say'". I need to make sure the eulogy doesn't sound agnostic. It needs to sound definitive about the *limit of language*.

      *Okay, let's go.*
answer: |-
  Good morning. Thank you all for being here.

  For thirty-one years, my aunt's job was to listen. As a courtroom stenographer, she didn't interpret the truth; she captured it. She knew that the difference between "I didn't" and "I did" could change a life. She knew that words have weight, and that precision is a form of kindness.

  When she retired, she didn't stop listening. She just started listening to quieter things. Many of you know she found Buddhism. But for those of us who knew her best, we know she didn't find it for the incense or the serenity. She found it for the logic. She fell in love with a philosopher named Nāgārjuna, who argued that reality doesn't fit into the boxes our language builds for it.

  She applied this to everything. Especially to herself.

  In the last few years, if you told her, "You'll be watching over us from above," she would correct you. If you said, "When you're gone, you're gone," she would correct you. If you tried to split the difference, she'd correct you again. She was famously strict about this. Some of you remember my grandmother's funeral two years ago. The priest spoke about a "better place," and my aunt stood up—not to cause a scene, but because she couldn't let a lie stand unchallenged. She loved us too much to let us comfort ourselves with things that weren't true.

  So, I stand here today knowing that if I tell you she is in a better place, I am dishonoring her mind. If I tell you she is simply gone, I am dishonoring my love for her. And if I tell you that "nobody can know," I am taking the easy way out, which she would have called a fifth corner—a cheat.

  I have spent the last few nights with her copy of the texts she studied. Her handwriting covers almost every page. She wasn't looking for answers. She was looking for the place where the question stops making sense.

  And I think I understand what she wanted for us today. She didn't want us to locate her. She wanted us to locate *ourselves*.

  Grief is a strange thing. It feels like an absence. It feels like a hole where a person used to be. But love is not a location. The love she gave me, and the love she gave so many of you, is not a thing that can exist or not exist. It is not a noun. It is a verb. It is something we *do*.

  When I look around this room, I see the evidence of her. Not in a ghostly sense, and not in a biological sense. I see it in the way her meditation friends sit together in silence. I see it in the way my cousins speak to each other with more patience than they used to. I see it in the transcript of my own life, where her voice is still recorded in the margins of my decisions.

  To say she is "here" is too simple. To say she is "gone" is a lie. The truth is harder, and I think she would want the hard truth. The truth is that the categories of "here" and "gone" are too small to hold what she was to us.

  She taught me that we suffer because we cling to things being solid. We want her to be solid. We want to know where to send our prayers, or where to place our anger. But she spent her final years learning to let go of the need for solid ground.

  So, I am not going to ask you to feel her presence. I am not going to ask you to accept her absence. I am asking you to do what she did. I am asking you to be precise.

  Be precise with your grief. Don't cover it up.
  Be precise with your memories. Don't polish them until they're fake.
  And be precise with your love. Don't wait for a better time to give it.

  She is not waiting for us. She is not gone from us. She is the silence between the words we speak now. And if we listen closely, without trying to force the silence to be a sound, we might hear exactly what she left behind.

  Thank you.
