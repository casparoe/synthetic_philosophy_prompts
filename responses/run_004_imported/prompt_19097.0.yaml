answer: |-
  In the name of God, the Merciful, the Compassionate.

  Two weeks ago, in a seminar room far from here, I opened Michael Marmura's translation of al-Ghazālī's *Tahāfut al-Falāsifa*. We were reading the Seventeenth Discussion, on the denial of necessary connection. It was an unkind coincidence, or perhaps it was not a coincidence at all, but simply the next moment God willed to occur in the sequence of my education. On that same day, two weeks ago, God willed the sequence of my grandmother's life to reach its final term.

  I stand before you knowing that this gathering holds two distinct assemblies. To my grandmother's colleagues and former students, I speak as a novice in the science she mastered for fifty years. To my family, including my father's relatives and my younger cousins, I speak as a grandson trying to honor the specific way she saw the world, without smoothing over the sharp edges of her belief to make them fit more comfortably into our grief.

  She was a teacher of *kalām*. She was an Ash'arite. And to eulogize her using the language of natural causality would be to speak of a stranger. We are accustomed to saying that a heart fails from strain, or that illness defeats the body, or that time heals wounds. She spent fifty years gently correcting us, telling us that these are merely figures of speech. She believed, without metaphor, that fire does not burn cotton. She believed that medicine does not cure. She believed that no created thing possesses the power to produce anything.

  There is a comfort in this, though it is not the comfort we usually seek. The usual comfort tells us that she lives on in our memories, as if our minds have the power to sustain her. The usual comfort tells us that her legacy will influence the future, as if she has left a force behind her. But she taught us that nothing created has power. Nothing created sustains anything else.

  If we hold to her view, then she is not sustained by our memory. She is sustained only by God. And we are not wounded by the causal blow of death. We are in a new state, created by God, in which her physical presence is absent.

  Why is this good news? Because it means that nothing ever happened to her by accident. If there is no secondary causality, then there is no blind nature, no random chance, no indifferent biological decay. Every breath she took was not the result of a lung's mechanical power, but a direct gift, recreated at every instant by a Will that knows her name. When she smiled at us, it was not merely neurons firing; it was God creating light in the room. When she corrected us at the dinner table—reminding us that the kettle did not boil the water, but that God created the heat and the boiling in conjunction with the fire—she was not being difficult. She was inviting us to see that we are never alone with objects. We are always with Him.

  She used to say, half in jest, that if anyone stood here and claimed her body had "finally given out" or that she had "lost her fight," she would return to argue. We know she will not return. On her view, the dead do not return, not because death has power over them, but because God maintains the habit (*'āda*) that the dead remain in the barzakh, just as He maintained the habit that the fire would not burn Abraham.

  So, how do we grieve? If God alone acts, is our sadness meaningless? No. Our grief is real because God creates it. Our love for her is real because God creates it. She was a locus for God's attributes. When she showed mercy, it was God's mercy manifesting through her. When she sought knowledge, it was God's light reflecting in her intellect.

  To my family who do not share her technical vocabulary: I know this sounds cold. It sounds as if I am saying she was a puppet. But she did not feel like a puppet. She felt like a servant, which is different. A puppet has no will. A servant has a will, but knows that her will does not override the Master's. She found immense dignity in this. It meant she never had to carry the weight of the universe. She did not have to *make* things happen. She only had to be present for what God was doing.

  And what was God doing in her? He was creating patience. He was creating rigor. He was creating a fierce, intellectual love for the Truth.

  We often say, "May she rest in peace." But rest implies a cessation of activity after a struggle. She did not struggle against biology. She submitted to the Moment. A better prayer, on her terms, is to ask that God create mercy in her station, just as He created knowledge in her mind. We cannot send that mercy to her, as if our words travel across a distance to reach her. We can only ask the One who is near to her, nearer than her jugular vein, to treat her as she treated us: with precision, with honesty, and with grace.

  To her colleagues: I know I have simplified the *nisba* of power. I know the nuances of the *kasb* are deeper than I have stated. But I have tried to speak her language.

  To my family: I know you miss her. I know the house feels empty. That emptiness is not a void left by her departure; it is a new shape of space that God has created for us to inhabit. We do not have to fill it. We only have to witness it.

  She taught us that the world is a series of discrete moments, strung together by habit. In this moment, she is gone. In the next moment, God may create in us the memory of her laugh. In the moment after, He may create the strength to stand up from these chairs. We are not connected to her by a chain of cause and effect that death has severed. We are connected to her by the One who connected us in the first place.

  She is not behind us. She is not ahead of us. She is in the hand of the One who holds the now.

  We ask God to recreate in our hearts the love we held for her, without the pain that usually accompanies it. We ask Him to treat her not according to the strictness of the habit He established for the universe, but according to the breadth of the mercy He established for Himself.

  There is no power and no strength except by God, the High, the Great.

  Amin.
