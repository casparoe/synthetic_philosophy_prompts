      *   **Tone:** Respectful, intellectually honest, emotionally grounded, avoiding clichés that violate the theology.

  2.  **Deconstruct the Theological Challenge:**
      *   *The Problem:* Eulogies are inherently causal. "She *made* us better," "Her life *impacted* us," "She *left* a void," "Death *took* her." All of these imply created things having effect.
      *   *The Ash'arite Solution:* God is the only Agent. Her life was a sequence of moments sustained by God. Her death is a moment willed by God. Her impact on us is God creating love in us in conjunction with her presence.
      *   *The Comfort:* If God is the only Agent, then nothing is lost to chance or blind nature. Every moment of her life was directly willed and sustained by Divine Care. Grief itself is a state created by God, valid and witnessed.

  3.  **Drafting - Section by Section:**

      *   **Opening (The Hook & The Constraint):** Acknowledge the difficulty. Mention the class coincidence (Marmura translation). This establishes credibility with the colleagues/students.
