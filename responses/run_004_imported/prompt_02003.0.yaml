      *   **Borges (*A New Refutation of Time*):** Time is a mental construct. Based on Berkeley (idealism: *esse est percipi*) and Hume (bundle theory of self). If there's no enduring self and no enduring matter, each moment is discrete. Succession is an illusion. *Crucially:* The ending. He admits the argument is logically sound but existentially insufficient. "The world, unfortunately, is real." He surrenders to the sensation of time despite the logic against it.
      *   **The Conflict:** Rovelli says time isn't fundamental *physically*. Borges says time isn't fundamental *metaphysically/psychologically*, but admits it feels inescapable.

  3.  **Brainstorming Borges's Potential Reaction:**
