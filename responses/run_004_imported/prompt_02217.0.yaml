      *   **6. Cultural Technology (Gopnik):** This is a high-level sociological/cognitive framing. It's true that it stores/recombines culture. But as a description of *what is happening computationally inside*, it's less precise than Simulator or Oracle. It's more about its role in society than its internal mechanics.

