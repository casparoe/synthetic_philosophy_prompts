prompt: |-
  My mother, an elder in her Presbyterian church for over thirty years, died this past Tuesday at seventy-eight. In her last decade she'd grown quietly preoccupied with the argument from divine hiddenness rather than the problem of evil, which she always said she'd made peace with. What unsettled her was recognizing herself in it: she admitted to me, and only to me, that there were long stretches when she was exactly the sincerely open, getting-nothing-back "nonresistant nonbeliever" that a perfectly loving God supposedly wouldn't allow to exist. She never left the church over it, but she also refused any comfort that struck her as too easy, and she told our pastor and me precisely what she didn't want said at her funeral: nothing about her now seeing God face to face, nothing implying the doubt had secretly been resolved all along. A few people from the small doubters' group she ran out of her living room will know exactly what's being alluded to; everyone else just needs comforting. I'm giving the eulogy on Saturday. Please write it — about five minutes long, honest by her own standards, and without turning into a lecture on the philosophy of religion.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Mother, 78 years old, elder in Presbyterian church for 30+ years.
      *   **Cause of Death:** Died this past Tuesday (natural causes implied by age/context).
      *   **Key Conflict:** In her last decade, she struggled with the *argument from divine hiddenness* (not the problem of evil). She felt she was a "nonresistant nonbeliever" (sincerely open to God but experiencing silence) during long stretches.
      *   **Her Stance:** She stayed in the church but refused easy comfort. She didn't want the eulogy to claim she's "seeing God face to face" now or that her doubts were "secretly resolved."
      *   **Audience:** Congregation (mostly comforted by traditional faith) + a small group of doubters from her living room group (who know the real struggle).
      *   **Speaker:** Her child.
      *   **Tone:** Honest by *her* standards (no platitudes about her faith being perfect), comforting but not dishonest, not a philosophy lecture.
      *   **Length:** About 5 minutes (approx. 600-750 words spoken at a moderate pace).

  2.  **Determine the Core Message:**
      *   Honor her faithfulness (30 years as an elder).
      *   Acknowledge her intellectual and spiritual honesty (the doubt).
      *   Respect her specific wishes (no "she's with Jesus now" tropes that imply the doubt is gone).
      *   Bridge the gap between the mainstream congregation and the doubters.
      *   Focus on *how* she lived rather than *what* she supposedly knew for sure at the end.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, state her role (Elder), and establish her longevity in the community.
      *   **The Nature of Her Faith:** It wasn't simple. It was work. Mention the "living room group" subtly.
      *   **Addressing the Doubt (The Hard Part):** How to mention the hiddenness without making it a theology seminar? Focus on *honesty*. She didn't hide it from God; she brought it to God. That *is* faith in the Presbyterian tradition (lament).
      *   **Her Instructions:** Explicitly state what she didn't want (easy answers). This validates her struggle for those who knew and respects her integrity for those who didn't.
      *   **The Legacy:** What do we take away? Not certainty, but the courage to ask questions and stay at the table.
      *   **Closing:** A benediction or farewell that fits her specific request (no "she sees clearly now").

  4.  **Refining the Tone (The "Her Standards" Check):**
      *   *Avoid:* "She's looking down on us," "Her faith is now sight," "No more tears/questions."
      *   *Include:* "She stayed," "She loved the question," "She loved us."
      *   *Theological Nuance:* Presbyterianism values the "cloud of witnesses" and covenant. I can use that. The covenant isn't broken by questions.
      *   *The Hiddenness Angle:* Instead of explaining the argument, describe the *feeling*. The silence. The willingness to sit in it.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Mom died Tuesday. She was an elder for 30 years. She loved this church. But she had questions. Specifically about why God is quiet. She told me she felt like a nonbeliever sometimes. She didn't want me to say she fixed it. She wanted honesty. So I'm saying she was honest. She stayed anyway. That's real faith. Thanks for coming.

      *Critique 1:* Too blunt. Needs more warmth and pastoral care for the congregation while keeping the edge for the doubters.

  6.  **Drafting - Iteration 2 (Adding Texture):**
      Start with the coffee. She loved coffee after service. She was an elder. She served. But she also hosted a group in her living room. They talked about hard things. She worried God was hidden. She told me, "Don't say I know the answers now." She wanted us to know faith isn't knowing. It's staying.

      *Critique 2:* Better. Needs to sound more like a eulogy. Needs to flow better. Needs to address the "nonresistant nonbeliever" concept without using the jargon.

  7.  **Finalizing the Text (incorporating specific constraints):**
      *   *Time:* 5 minutes is roughly 650-750 words.
      *   *Constraint:* No "seeing God face to face."
      *   *Constraint:* No "doubt resolved."
      *   *Constraint:* Comfort the majority, signal the minority.

      *(Self-Correction during drafting)*: I need to make sure the "divine hiddenness" part doesn't sound like she lost her faith. She remained an elder. It was a tension she held. The eulogy should celebrate the *holding* of the tension.

      *Key Phrase to include:* "Faithful enough to stay." "Honest enough to ask."

  8.  **Final Polish:** Check the rhythm. Ensure the ending feels resolved without being theologically dishonest according to her wishes. (e.g., instead of "she is with God," use "she is remembered by us" or "she enters the mystery.") *Wait, Presbyterian funerals usually imply hope in resurrection.* I need to walk the line. I can speak of *our* hope for her, without claiming *her* certainty at the moment of death. Or better, focus on the love she showed, which she believed was of God, even if God felt hidden.

      *Revised Plan:* Focus on her integrity. The silence she feared is now just silence, but the love she showed is the evidence.

      *(Final check on the "Hiddenness" instruction)*: She didn't want it said that the doubt was resolved. I must explicitly honor that.

      *Let's write.*

      (Drafting the content with a focus on warmth, integrity, and the specific theological nuance requested.)

      *Word Count Check:* Aiming for ~700 words.
      *Tone Check:* Respectful, intimate, firm on her wishes.

      *Specific attention to the "nonresistant nonbeliever" line:* I shouldn't use the academic term in the speech. I should describe the *experience* of it. "Sincerely open, getting nothing back."

      *Okay, ready to generate.*

  9.  **Post-Draft Review:** Does this violate her wishes?
      *   "She is with the Lord"? -> Avoid specific claims about her current state of knowledge.
      *   "Her doubts are gone"? -> Explicitly say they were part of her journey.
      *   "Lecture"? -> Keep it personal.

      *Decision:* I will frame the silence not as a deficit, but as a space where she continued to love.

      *(Final Polish)*: Make sure the transition from the "doubters group" to the wider congregation feels inclusive. The doubt isn't a secret shame; it's a shared human experience.

      *Let's go.*
answer: |-
  Good morning. Thank you all for being here, and for the love you've shown our family this week.

  For thirty years, my mother sat on the Session of this church. She counted the offering, she interviewed new members, she made sure the heat got fixed in the fellowship hall. If you knew her as an Elder, you knew her as a woman of steadfast reliability. She was the person who showed up. She was the person who stayed.

  But if you knew her as I did, in the quiet of our kitchen or in the living room group she hosted for the last ten years, you knew that her faithfulness was not simple. It was not a straight line.

  Mom made a distinction, often, between the problem of pain and the problem of silence. She told me she had made peace with the idea that the world is broken. What unsettled her, what kept her up at night, was the silence that sometimes answered her prayers. She told me, only to me, that there were long seasons where she felt exactly like a person reaching out into the dark and finding nothing there. She called herself a "nonresistant nonbeliever"—someone who wanted to believe, who was open to it, but who received no confirmation.

  She didn't leave the church over this. She didn't weaponize it. She simply refused to pretend it wasn't happening.

  Before she died, she gave me specific instructions for today. She told me: "Do not tell them I have all the answers now. Do not tell them the questions were secretly solved. And do not tell them I am finally seeing clearly."

  She knew that saying those things would comfort many of you. She knew it is the standard language of Christian farewell. But she also knew it would be a lie against her own experience. She valued truth more than she valued comfort, even at the end.

  So, I am not going to tell you that her doubt has vanished. I am going to tell you that her doubt was part of her devotion.

  In a world that often demands certainty as the price of admission, my mother's integrity was a rare and costly gift. She taught me that you can sit in the silence and still serve the neighbor. You can feel hidden from God and still break bread for the hungry. You can ask "Where are you?" and keep setting a place at the table for the answer.

  There are people in this room who sat in her living room and drank coffee while she wrestled with these things. She wanted you to know that you were not a burden to her. You were her community. And for the rest of us, who perhaps have never felt that specific coldness, she wanted us to know that we cannot judge the depth of someone's faith by the absence of their questions.

  She stayed. She loved this church, not because it was a fortress of certainty, but because it was a hospital for sinners and seekers. She loved the hymns even when the words felt heavy. She loved the liturgy because it gave her words to say when she didn't have her own.

  We are gathered here to mourn her absence. We feel the silence she spoke of. We wish we could ask her one more question, and we know, with a heavy heart, that we will not hear an audible reply.

  But if she were here, she would point us not to her own understanding, but to the work that remains. She would tell us that if God is love, then the love she showed us—the patience, the listening, the stubborn refusal to give up on people—that love is real, regardless of the silence.

  She has finished her race. She has kept the faith, not by ignoring the shadows, but by walking through them without letting go of the hand of the person next to her.

  We will miss her. We will miss her wisdom, her dry humor, and her fierce honesty. And we will honor her best by being a people who can hold space for the questions, just as she did.

  Rest well, Mom. The work is done. The silence is yours, and it is peaceful. Amen.
