prompt: |-
  I sit on my university's student senate committee, which is revising the rules for who may vote in campus-wide elections. Under current bylaws, only students who pay the mandatory activity fee -- which funds the senate's entire budget and is billed solely to on-campus students -- may vote or hold office, so the roughly 4,000 students enrolled in the university's fully online degree programs are currently ineligible. An online-student caucus is petitioning for enfranchisement, noting that the senate also sets academic-integrity policy binding on every student and speaks for "the student body" when the administration sets tuition. Opponents on the committee counter that a body's electorate should track who actually funds and uses what it controls, and that admitting non-payers would let them help decide how other students' money is spent. Draft the recommendation memo I will bring to the full senate: specify exactly who should be eligible to vote on what, and give the caucus's strongest argument a genuine hearing rather than a procedural dismissal.
reasoning: |-
  Here's a thinking process that leads to the recommended memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the University Student Senate Committee revising voting rules.
      *   **Task:** Draft a recommendation memo to the full Student Senate.
      *   **Context:**
          *   Current Bylaws: Only students paying the mandatory activity fee (on-campus students) can vote/hold office.
          *   Excluded Group: ~4,000 fully online students (do not pay the fee).
          *   Conflict: Online Student Caucus wants voting rights. Opponents argue "no taxation without representation" (reverse) / fiscal responsibility (voters should fund what they control).
          *   Key Issues: Senate budget comes from the fee. Senate sets academic integrity policy (binds everyone). Senate speaks on tuition (affects everyone).
      *   **Requirements:**
          *   Specify exactly who is eligible to vote on what (tiered system?).
          *   Give the Online Student Caucus's strongest argument a genuine hearing (not a dismissal).
          *   Tone: Professional, persuasive, balanced, parliamentary.

  2.  **Determine the Core Conflict & Solution:**
      *   *Conflict:* Fiscal accountability vs. Democratic representation.
      *   *Fiscal Argument:* If you don't pay the fee, you shouldn't decide how the fee is spent. (Principle: Nexus between contribution and control).
      *   *Representation Argument:* If the Senate makes rules affecting you (academic integrity) or advocates on your behalf (tuition), you should have a say. (Principle: Affected interests).
      *   *Potential Solution:* A tiered voting system.
          *   *General Elections (Senate Officers, Budget Approval):* Restricted to fee-payers (on-campus).
          *   *Policy Referenda/Academic Integrity:* Open to all students (online + on-campus).
          *   *Hybrid Option:* Allow online students to vote for specific liaisons or on specific issues, but not on fiscal matters.
      *   *Decision:* A tiered approach is the most logical compromise. It respects the fiscal constraint while acknowledging the democratic deficit regarding policy.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the purpose and the core recommendation.
      *   **Background:** Summarize the current bylaws, the fee structure, and the petition.
      *   **Analysis of Arguments:**
          *   *Opponents (Fiscal):* Valid point about budget control.
          *   *Caucus (Representation):* Strongest argument needs highlighting (Academic Integrity & Tuition Advocacy). This is a specific requirement of the prompt.
      *   **Recommendation (The Meat):**
          *   Define "Class A Voters" (Fee-payers/On-campus).
          *   Define "Class B Voters" (Non-fee-payers/Online).
          *   Specify what each class votes on.
          *   Address holding office (usually requires fee payment due to budget responsibility, but maybe allow liaison roles?). Let's stick to voting for now to keep it clean, or limit office-holding to fee-payers for fiscal roles.
      *   **Implementation:** How to verify status, timeline.
      *   **Conclusion:** Call to action.

  4.  **Refining the "Strongest Argument" Requirement:**
      *   I need to make sure I don't just say "They said X, but we say Y."
      *   I need to write: "The Caucus argues X. This is compelling because Y. Therefore, our recommendation addresses Y by Z."
      *   *Strongest Argument:* The Senate exercises *regulatory authority* (academic integrity) and *representational authority* (tuition) over online students, not just *fiscal authority* (club funding). Disenfranchisement here creates a democratic deficit in governance, not just budgeting.

  5.  **Refining the Voting Eligibility (The "Exactly Who" Requirement):**
      *   *Scenario A: Budget & Appropriations.* Only fee-payers. (Protects the "taxation" principle).
      *   *Scenario B: Academic Policy & Tuition Resolutions.* All enrolled students. (Protects the "representation" principle).
      *   *Scenario C: Officer Elections.* This is tricky. If the President manages the budget, should online students vote?
          *   *Compromise:* Online students vote for a specific "Online Student Senator" or liaison, but not the executive officers who manage the fee budget. OR, keep officer elections fee-payer only, but create a mandatory consultative vote for online students on policy.
          *   *Better Compromise:* Split the ballot. All students vote on Policy/Integrity. Fee-payers vote on Budget/Officers.
          *   *Simplest/Clearest:* Distinguish between *Fiscal Elections* and *Policy Referenda*.
          *   *Let's go with:*
              1.  **Fiscal & Executive Elections:** Fee-paying students only.
              2.  **Academic & Tuition Policy Referenda:** All enrolled students.
              3.  **Office Holding:** Restricted to fee-payers (due to fiduciary duty), but create a non-voting liaison seat for online students.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Tone Check:* Is it respectful? Yes.
      *   *Clarity:* Are the categories distinct? Yes.
      *   *Fairness:* Does it acknowledge the online students' grievance? Yes.

  7.  **Final Review against Prompt:**
      *   *Specify exactly who eligible for what:* Yes (Tiered system).
      *   *Give Caucus strongest argument genuine hearing:* Yes (Section on "Regulatory & Advocacy Authority").
      *   *Memo Format:* Yes.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe let them vote for everything but tax them?
      *   *Correction:* No, the prompt says the fee is billed *solely* to on-campus. Changing the fee structure is likely outside the Senate's power (Admin/Board decision). Stick to voting rights.
      *   *Initial thought:* Let them hold office.
      *   *Correction:* If the office controls the budget they didn't pay into, that violates the opponents' core principle. Better to restrict office-holding to fee-payers but ensure online representation through a designated seat.
      *   *Focus:* Ensure the distinction between *budgetary* decisions and *policy* decisions is sharp.

  9.  **Final Polish:** Check for bureaucratic but accessible language. Ensure the "Strongest Argument" section feels empathetic, not tokenistic. (e.g., acknowledging that academic integrity sanctions affect online students just as severely).

  **(Self-Correction Note):** Make sure the memo doesn't sound like it's rejecting the online students entirely. The goal is *revision* of rules, implying change is happening. The recommendation should expand rights, not just justify the status quo.

  *Revised Plan:*
  1. Acknowledge the validity of the Caucus's claim regarding policy.
  2. Maintain the fiscal link for budgeting.
  3. Expand voting rights for policy.
  4. Create a liaison mechanism.

