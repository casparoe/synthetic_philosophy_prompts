answer: |-
  **MEMORANDUM**

  **TO:** The Full Student Senate
  **FROM:** Committee on Bylaws and Elections
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Voting Eligibility and Online Student Enfranchisement

  ### I. Executive Summary

  The Committee on Bylaws and Elections has reviewed the petition submitted by the Online Student Caucus regarding voting eligibility in campus-wide elections. Currently, Article IV, Section 1 of our Bylaws restricts voting and office-holding to students billed the Mandatory Activity Fee (MAF). This excludes approximately 4,000 fully online students.

  After weighing the principles of fiscal accountability against democratic representation, the Committee recommends a **Tiered Eligibility Framework**. This framework maintains the link between fee payment and budgetary control while extending voting rights to online students regarding academic policy and tuition advocacy. We further recommend the creation of a designated Online Student Liaison seat.

  ### II. Background and Current Conflict

  Under current bylaws, the Student Senate's budget is derived exclusively from the MAF, billed only to on-campus students. Consequently, only on-campus students may vote for Senate officers or approve the budget.

  The Online Student Caucus argues that this exclusion is untenable because the Senate's authority extends beyond club funding. They note that the Senate:
  1.  Ratifies Academic Integrity policies that apply to all students, regardless of modality.
  2.  Passes resolutions on tuition and fees that impact online students.
  3.  Claims to represent "the student body" in negotiations with the University Administration.

  Opponents of change argue that allowing non-contributors to vote on budgetary matters violates the principle of fiscal responsibility. They contend that students who do not fund the Senate should not direct its spending.

  ### III. Analysis of Arguments

  The Committee recognizes the validity of the fiscal concern. It is inappropriate for an electorate to appropriate funds they have not contributed. However, the Committee also finds that the current bylaws conflate *fiscal governance* with *regulatory and advocacy governance*.

  **The Caucus's Argument on Regulatory Authority**
  The Committee gives substantial weight to the Caucus's strongest argument: **The Senate exercises regulatory authority over online students without their consent.**

  When the Senate adjudicates or sets standards for academic integrity, it wields power that can result in suspension or expulsion. An online student subject to the Senate's judicial board should logically have a voice in selecting the representatives who oversee that board. To deny this is to subject a population to laws they had no hand in making. Furthermore, when the Senate advocates on tuition, it claims a mandate from the "student body." If that body excludes 4,000 paying tuition students, the Senate's claim to representation is factually incomplete. Disenfranchising online students on these specific issues undermines the legitimacy of the Senate's policy positions.

  ### IV. Committee Recommendations

  To balance fiscal integrity with democratic representation, the Committee recommends amending the Bylaws to establish two classes of voters and specific eligibility criteria for office.

  **A. Voter Eligibility Tiers**

  1.  **General Voters (All Enrolled Students)**
      *   *Eligibility:* Any student currently enrolled in a degree-seeking program (On-Campus and Online).
      *   *Permitted Votes:*
          *   Referenda on **Academic Policy** (e.g., Academic Integrity Code, Grading Policies).
          *   Referenda on **Tuition and Administrative Fees**.
          *   Elections for the **Online Student Liaison** (see Section B).
      *   *Rationale:* These issues affect the academic and financial standing of all students equally, regardless of modality.

  2.  **Fiscal Voters (MAF Contributors Only)**
      *   *Eligibility:* Students currently billed the Mandatory Activity Fee (currently On-Campus students).
      *   *Permitted Votes:*
          *   Approval of the **Annual Senate Budget**.
          *   Appropriations for Student Organizations.
          *   Elections for **Executive Officers** (President, VP, Treasurer) who hold fiduciary responsibility over the MAF.
      *   *Rationale:* This preserves the principle that control over specific funds must reside with those who contribute them.

  **B. Office-Holding and Representation**

  1.  **Executive Officers:** Eligibility for President, Vice President, and Treasurer shall remain restricted to Fiscal Voters. These roles carry direct fiduciary duty over the MAF budget.
  2.  **Online Student Liaison:** A new non-voting (on fiscal matters) seat shall be created.
      *   *Election:* Elected by General Voters (All Enrolled Students).
      *   *Role:* This representative shall have full voice and voting rights on the Senate floor regarding Academic Policy and Tuition Advocacy. They shall recuse themselves from final budget votes but may participate in budget committee discussions regarding services that benefit online students.

  **C. Implementation**

  *   **Verification:** The Registrar's Office shall verify student modality (Online vs. On-Campus) prior to election cycles.
  *   **Balloting:** Digital ballots must be segmented so that General Voters only see eligible races and referenda.
  *   **Timeline:** These changes shall take effect for the Spring Semester Election Cycle.

  ### V. Conclusion

  This recommendation rejects the notion that representation is binary. A student government can be both fiscally conservative and democratically inclusive. By restricting budget votes to fee-payers, we honor the financial contribution of on-campus students. By enfranchising online students on policy and tuition, we honor the Senate's claim to represent the entire student experience.

  The Committee moves that the Full Senate adopt these amendments to ensure our governance structure reflects both our financial realities and our democratic obligations.

  **Respectfully Submitted,**

  [Your Name]
  Chair, Committee on Bylaws and Elections
  Student Senate
