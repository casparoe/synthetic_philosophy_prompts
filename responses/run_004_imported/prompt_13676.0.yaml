prompt: |-
  A friend of mine—a philosophy grad student working through Quine's minor essays for a seminar paper—sent me a copy of "On the Nature of Moral Values," the short piece Quine wrote for the 1978 Frankena/Stevenson/Brandt Festschrift and apparently the only thing he ever published devoted entirely to ethics. We ended up arguing about how to read it for the better part of an evening. The essay draws an elaborate analogy between the structure of empirical science, where a holistic web of belief meets experience only at its periphery through observation sentences keyed to shared sensory stimulation, and the structure of moral value, where innate affective responses (Quine's examples include a wincing reflex and a child's internalized attachment to a parent's approval) play a role structurally similar to observation sentences, with general ethical principles playing the role of theory. Quine, however, seems to conclude that the analogy ultimately breaks in science's favor: because moral "observations" don't command anything like the cross-subject agreement that sensory observation sentences do, ethics ends up on comparatively shaky ground, closer to a matter of individual or cultural upbringing than to anything resembling objective check.

  My friend thought this conclusion drops straight out of Quine's general empiricism once the analogy is taken seriously. I wasn't so sure, and this is the part we never resolved: the operative standard in Quine's naturalism elsewhere isn't cross-subject convergence but indispensability to our best overall theory—we're ontologically committed to whatever that theory needs to quantify over ("to be is to be the value of a bound variable"), and Quine is perfectly willing to grant reality to classes, numbers, and unobservable particles that no one perceives directly and that plenty of competent theorists disagree about, so long as they earn their keep. If moral value is at least as load-bearing and indispensable to how we actually organize and act on our total picture of the world, then Quine's own standards would seem to license treating it as real in whatever thin, immanent sense he treats numbers or electrons as real—which would make the convergence gap look more like evidence that ethics is an immature or badly taught discipline than like a principled reason to withhold ontological credit.

  I'd like you to argue my side of this as rigorously as you can: that a consistent application of Quine's own naturalistic criteria for ontological commitment should have pushed him toward treating moral value as a genuine, indispensable posit, rather than toward the more deflationary picture he actually seems to favor in the essay. Please don't just wave away the disanalogy—engage seriously with the strongest reasons someone might have for thinking intersubjective convergence is doing independent, non-negotiable work in Quine's epistemology, rather than being an incidental feature of the particular sciences he happened to be generalizing from—and tell me what you think a fully consistent Quinean naturalist should actually conclude about the objectivity of moral value.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user and a friend (philosophy grad student) are debating Quine's essay "On the Nature of Moral Values" (1978).
      *   **The Essay's Core Argument:** Quine draws an analogy between science (web of belief, observation sentences) and ethics (general principles, innate affective responses). He concludes the analogy breaks down because moral "observations" lack the intersubjective convergence of sensory observations, making ethics less objective.
      *   **The Friend's Position:** Quine's conclusion follows naturally from his empiricism (convergence is key).
      *   **The User's Position (My Task):** Argue that a *consistent* application of Quine's naturalistic criteria (indispensability, ontological commitment via bound variables) should lead to treating moral values as real posits, despite the convergence gap. The convergence gap should be seen as a sign of immaturity, not principled unreality.
      *   **Requirements:** Argue rigorously, engage seriously with the counter-argument (that convergence is non-negotiable in Quine's epistemology), and conclude on what a fully consistent Quinean naturalist should believe about moral objectivity.

  2.  **Deconstruct Quine's Philosophy (Relevant Parts):**
      *   **Naturalism:** Philosophy is continuous with science. There is no first philosophy.
      *   **Holism:** Beliefs face the tribunal of experience as a corporate body (Duhem-Quine thesis).
      *   **Ontological Commitment:** "To be is to be the value of a bound variable." We commit to entities indispensable to our best scientific theory.
      *   **Observation Sentences:** The checkpoint where language touches the world. They must be intersubjectively observable for *science* to function as a public enterprise.
      *   **Truth:** Immanent. Truth is within the system.
      *   **Ethics in Quine:** Generally deflationary. He views ethics as culturally relative, lacking the "check" of external reality.

  3.  **Develop the User's Argument (The "Indispensability" Strategy):**
      *   *Premise 1:* Quine's criterion for reality is indispensability to our best overall theory of the world, not direct perceptibility or universal agreement. (Numbers and sets are the classic example).
      *   *Premise 2:* Moral values/principles are indispensable to our overall theory of human behavior, social organization, and decision-making. We cannot explain or navigate the world without them.
      *   *Premise 3:* The lack of intersubjective convergence in ethics is analogous to early stages of science or complex theoretical disputes (e.g., quantum mechanics interpretations), not a lack of reality.
      *   *Conclusion:* Therefore, a consistent Quinean should grant moral values ontological status (as posits), similar to mathematical objects.

  4.  **Develop the Counter-Argument (The "Convergence" Strategy - To be refuted/engaged):**
      *   *Why does Quine care about convergence?* Science is a *social* project. Language is a *social* art. For a sentence to serve as an objective check, it must be keyed to *shared* sensory stimulation. If I say "I feel pain" and you say "You look fine," we can't build a shared physics.
      *   *The Disanalogy:* Sensory stimulation is causally forced upon us by external objects. Moral sentiments are internally generated or culturally conditioned. There is no "moral stimulus" in the same way there is a "photon stimulus."
      *   *Quine's Behaviorism:* Quine is skeptical of inner states unless they manifest in overt behavior. Moral feelings are too variable.

  5.  **Synthesize and Refine the Argument (The "Consistent Quinean" Path):**
      *   *Acknowledge the strength of the convergence point:* It *is* crucial for the *publicity* of science.
      *   *Pivot to Naturalism:* But naturalism says we study ethics *as part of* the natural world. If moral posits explain behavior better than non-moral posits, they earn their keep.
      *   *Reinterpret "Observation":* Maybe moral "observations" aren't sensory but are still causal inputs into the web of belief.
      *   *The Mathematical Analogy:* This is the user's strongest point. We don't "see" sets. We agree on them because they work. If moral principles "work" to organize society, why aren't they real?
      *   *The "Immanent Truth" Move:* Quine says truth is immanent. If our best theory includes moral facts, they are true *for us*. Quine's retreat to cultural relativism looks like a lapse into a "first philosophy" stance where he judges ethics from outside rather than within.

  6.  **Drafting the Response (Section by Section):**

      *   **Introduction:** Validate the user's insight. It's a sophisticated reading. State the thesis: Quine's deflationism in the 1978 essay is inconsistent with his core criterion of ontological commitment.
      *   **Section 1: The Indispensability Argument (The User's Core).** Focus on "To be is to be the value of a bound variable." Compare moral values to sets. Sets aren't observed; they are posited. Moral values are posited to explain social cohesion/action.
      *   **Section 2: Engaging the Convergence Objection.** Why does Quine demand convergence? For the *publicity* of science. But does ethics need to be physics? No. It needs to be *useful*. If convergence is the metric, much of psychology and social science fails. Quine accepts social science as science.
      *   **Section 3: The Naturalistic Inconsistency.** Quine claims naturalism. Naturalism says "look at how we actually operate." We operate *as if* values are real. To deny them is to step outside naturalism into a skeptical metaphysics he usually rejects.
      *   **Section 4: Re-evaluating the "Observation" Analogy.** The friend says moral sentiments aren't like observation sentences. Counter: They function as *entry points* for the ethical web. The lack of convergence is a matter of degree (causal distance), not kind.
      *   **Conclusion:** A consistent Quinean should be a *moral realist of a pragmatic sort*. Moral values are real posits within the conceptual scheme that best predicts and manages human interaction.

  7.  **Refining the Tone:**
      *   Needs to be academic but accessible (philosophy grad student level).
      *   Rigorous, citing Quinean concepts (holism, stimulation, ontological commitment, immanence).
      *   Avoid moralizing; keep it meta-ethical/ontological.

  8.  **Self-Correction/Critique during drafting:**
      *   *Check:* Did I address the "observation sentence" specific role? Quine ties observation sentences to *causal* impact of external objects. Moral feelings are internal.
      *   *Fix:* Argue that from a naturalistic perspective, internal neurophysiological states *are* physical states caused by the world (upbringing, evolution). The causal chain is just longer/messier, not absent.
      *   *Check:* Did I address the "bound variable" issue? Do we quantify over "values"?
      *   *Fix:* We say "There is a reason to do X." "There is a value in Y." If our best theory of human action requires quantifying over reasons/values, they are committed.
      *   *Check:* Is Quine's deflationism actually deeper? He might think ethics is just *imperative*, not indicative.
      *   *Fix:* Address this. Quine treats ethics as chiefly about training/conditioning. Counter: Even training relies on a theory of what is *good* training. That theory posits values.

  9.  **Final Polish:** Ensure the distinction between the friend's reading (convergence = objectivity) and the user's reading (indispensability = reality) is sharp. Emphasize that Quine's 1978 view looks like a betrayal of his own naturalism. (Proceed to generate output).

  *(Self-Correction Note during final review)*: Make sure to acknowledge that Quine *does* care about intersubjectivity for *language learning*. If moral terms can't be learned via public checkpoints, do they mean anything? I need to argue that they *are* learned publicly (via approval/disapproval), just with more noise than "Red."

  10. **Final Structure:**
      *   Intro: Affirm the user's intuition.
      *   Point 1: The Ontological Commitment Criterion (Indispensability > Convergence).
      *   Point 2: The Status of Social Science (Convergence is scarce there too).
      *   Point 3: The Naturalistic Betrayal (Quine stepping outside the web).
      *   Point 4: Reconciling Convergence (Noise vs. Absence).
      *   Conclusion: The Consistent Quinean Verdict.

  (Ready to write.)
answer: |-
  This is a sophisticated dispute, and your intuition is correct: there is a genuine tension in Quine's 1978 essay between his specific remarks on ethics and the broader machinery of his naturalized epistemology. Your friend is relying on Quine's *methodological* preferences (the emphasis on intersubjective checkability for the enterprise of public science), while you are relying on Quine's *ontological* criteria (indispensability within the best overall theory).

  To argue your side rigorously, we need to demonstrate that Quine's deflationary conclusion in "On the Nature of Moral Values" constitutes a lapse into the very "first philosophy" he spent his career dismantling. A consistent Quinean naturalist should indeed treat moral values as genuine, albeit immanent, posits.

  Here is the argument for why your reading is the more faithful application of Quine's core principles.

  ### 1. The Primacy of Indispensability over Intuition
  The cornerstone of Quine's ontology is the criterion of ontological commitment: *"To be is to be the value of a bound variable."* We look at our best theories of the world, see what entities they must quantify over to function, and grant those entities reality. Crucially, this reality is not granted because we can point to the entities (we can't point to sets or electrons) or because everyone agrees on them (interpretations of quantum mechanics vary wildly), but because they are **indispensable**.

  In the 1978 essay, Quine denies moral values this status because the "observation sentences" of ethics (affective responses) lack the intersubjective uniformity of sensory observation sentences. But this moves the goalposts.
  *   **The Argument:** If moral principles are indispensable for explaining and predicting human behavior, social cohesion, and decision-making, they earn ontological credit. We constantly quantify over values in our best theories of psychology and sociology (e.g., "The protest occurred because the group valued *justice* over *security*").
  *   **The Inconsistency:** By withholding reality from values due to a lack of convergence, Quine is applying a stricter standard to ethics than he applies to mathematics or theoretical physics. We accept numbers despite zero sensory access to them. We accept quarks despite their counter-intuitiveness. To reject values solely because affective responses vary across cultures is to demand a kind of "givenness" that Quine explicitly rejected in *Two Dogmas of Empiricism*. A consistent naturalist asks: *Does the posit do work?* not *Does everyone feel the same way about the posit?*

  ### 2. The "Social Science" Counter-Example
  Your friend argues that cross-subject convergence is non-negotiable for Quine. It is non-negotiable for *physics*, perhaps, because physics aims for a "view from nowhere." But Quine is a naturalist; he accepts that science includes biology, psychology, and sociology.
  *   **The Variance Problem:** In the social sciences, "observation sentences" are notoriously messy. One culture's "aggressive behavior" is another's "righteous defense." There is significantly less convergence in psychological or sociological observation than in physical observation.
  *   **The Implication:** Quine does not therefore declare sociology unreal or merely "expressive." He treats it as a difficult branch of science where the stimulus conditions are more complex and the variables harder to isolate.
  *   **Applying to Ethics:** If ethics is viewed as a branch of social technology or behavioral science (which Quine's naturalism suggests it should be), the lack of convergence is evidence of **complexity**, not **unreality**. It suggests that the causal chains linking environmental stimuli to moral affect are longer and more culturally mediated than the chain linking a photon to a retina. To treat this variance as a disqualifier for objectivity is to privilege physics as the sole arbiter of reality—a reductionism Quine usually avoids in favor of a holistic pragmatism.

  ### 3. The Naturalistic Betrayal
  The strongest argument for your side is that Quine's deflationism in the essay betrays his own naturalism. Naturalism dictates that there is no standpoint outside of science from which to judge science (or ethics). We are within the web of belief, tinkering with it.
  *   **Quine's Move:** In the essay, Quine seems to step *outside* the ethical web and judge it against the scientific web, finding the latter superior because of its "check" against reality.
  *   **The Consistent Move:** A consistent naturalist must acknowledge that the ethical web *is part of* our total theory of the world. We navigate the world using both physical laws and moral norms. If we strip out moral norms, our theory of human interaction collapses; we can no longer predict behavior or organize society.
  *   **Immanent Truth:** Quine argues truth is immanent. Moral truths are true within the conceptual scheme that best organizes our experience. If our best scheme for managing human life requires the posit of "value," then values are real *immanently*. By dismissing them as mere "upbringing," Quine is implicitly appealing to a God's-eye view of "Real Reality" (physical stuff) versus "Mere Convention" (moral stuff). But Quine's own holism teaches us that the distinction between fact and convention is a gradient, not a chasm. Ethics lies further along the gradient toward convention than physics, but it is not *ontologically distinct* in the way he implies.

  ### 4. Re-evaluating the "Observation" Disanalogy
  We must engage your friend's strongest point: that sensory stimulation is *causally forced* upon us, whereas moral sentiments are internal.
  *   **The Concession:** Yes, a punch to the nose is more universally stimulating than a violation of a promise.
  *   **The Rebuttal:** From a naturalistic perspective, both are physical events in the nervous system. The "wincing reflex" Quine mentions is a physical reaction. The "child's attachment" is a physical state of conditioning. The difference is that the causal link in ethics is mediated by language and culture, introducing "noise" (variance).
  *   **The Indispensability Pivot:** However, noise does not negate the signal. If the "moral observation" (the feeling of approval/disapproval) serves as the peripheral checkpoint for the ethical web, it is functioning exactly as an observation sentence does, just with a higher margin of error. In engineering, a sensor with high variance is still a sensor; you just calibrate for the noise. Quine treats the variance as a failure of the *mechanism* of ethics, whereas a consistent naturalist should treat it as a parameter of the *environment* in which ethics operates.

  ### 5. What a Consistent Quinean Should Conclude
  If we push Quine's own criteria to their logical limit, avoiding the lapse into physicalist prejudice, the conclusion on moral objectivity should look like this:

  1.  **Moral Realism (Quinean Style):** Moral values are real posits. They are not Platonic forms, but they are no less real than forces or fields. They are nodes in the web of belief that we cannot cut without catastrophic loss of predictive and organizational power.
  2.  **Objectivity as Coherence:** Objectivity in ethics is not about matching a mind-independent moral fabric (Quine rejects that for science too), but about the coherence and efficacy of the moral web in handling the "recalcitrance of experience" (e.g., social conflict, psychological distress).
  3.  **The Convergence Gap:** The lack of intersubjective agreement is not proof of subjectivity, but proof of the **underdetermination** of ethical theory by the evidence. Just as multiple physical theories can account for the same data, multiple ethical systems can account for the same human needs. The fact that we haven't converged on one "best" ethical theory yet doesn't mean there isn't a better or worse fit; it just means the science is immature.

  ### Summary for Your Argument
  You can tell your friend that Quine's 1978 essay represents a moment where his **behaviorist instincts** (demanding public, uniform stimuli) overrode his **naturalist commitments** (accepting whatever posits are indispensable to our best theory).

  If Quine were truly consistent, he would have to admit that:
  1.  We quantify over values in our best explanations of human behavior.
  2.  Therefore, we are ontologically committed to them.
  3.  The lack of convergence is a practical hurdle for the *science* of ethics, not an ontological barrier to the *reality* of values.

  By dismissing ethics as merely cultural, Quine inadvertently treats physics as "First Philosophy"—the very sin his naturalism was designed to prevent. A true Quinean naturalist must grant moral values the same thin, pragmatic reality granted to numbers: they are indispensable tools for navigating the world, and that is all the "objectivity" we get in science anyway.
