answer: |-
  Your source did not flunk a statistics test. Her unease is tracking something real, significant, and widely discussed in decision theory, epistemology, and risk analysis. She has intuitively identified the difference between **risk** (where the probabilities are known) and **ambiguity** or **Knightian uncertainty** (where the probabilities themselves are unknown or contested).

  By averaging the estimates from 5% to 65% into a single 35%, the committee is committing a category error. They are treating *disagreement about the model* as if it were *noise within a model*.

  Here is a breakdown of the principled objections to their current approach, why it matters specifically for existential risk, and what better practices might look like.

  ### 1. The Principled Objection: Collapsing Second-Order Uncertainty

  The most fundamental objection is that the committee is discarding **second-order uncertainty**.

  *   **First-order uncertainty:** "Will this research succeed?" (The 5% vs. 65% question).
  *   **Second-order uncertainty:** "How confident are we in our estimate of success?" (The spread between 5% and 65%).

  When the estimates are clustered (30%, 32%, 35%), the group has high confidence in the probability estimate. When they are divergent (5%...65%), the group has low confidence in the probability estimate. By averaging them, the foundation treats a "fuzzy 35%" exactly the same as a "sharp 35%."

  In statistical terms, they are reporting the **mean** of the distribution but discarding the **variance**. In most scientific contexts, reporting a mean without a confidence interval or standard deviation is considered malpractice. In philanthropy, it is often standard procedure, but that doesn't make it mathematically sound.

  **Why this is a "sleight of hand":**
  The average implies a consensus that does not exist. It suggests the "true" probability is likely near 35%. But given the spread, the "true" probability could easily be 5% (the skeptics are right about a fundamental flaw) or 65% (the optimists see a path the others missed). The average creates a false center of gravity.

  ### 2. The Decision Theory Problem: Jensen's Inequality

  Expected Value (EV) calculations assume **linearity**. They assume that a 50% chance of saving 1 million lives is equal to a 100% chance of saving 500,000 lives.

  However, in existential risk reduction, the value function is often **non-linear**.
  *   **Convexity (Upside):** If the 65% estimator is right because they have identified a specific, high-leverage intervention that the others missed, funding this project could be vastly more valuable than the average suggests. Averaging dilutes this "black swan" upside.
  *   **Concavity (Downside):** If the 5% estimator is right because there is a fundamental blocker the optimists ignored, the money is 100% wasted.

  Because the relationship between probability and impact isn't always a straight line, **the expected value of the average probability is not the same as the average of the expected values.** This is Jensen's Inequality. By collapsing the inputs before calculating the value, they may be systematically under- or over-valuing controversial projects depending on the shape of their impact function.

  ### 3. The "Ambiguity Aversion" Factor

  Humans (and institutions) are generally **ambiguity averse**. We prefer known risks over unknown uncertainties.
  *   **Scenario A:** A jar with 50 red balls and 50 blue balls. (Risk)
  *   **Scenario B:** A jar with 100 balls, but the ratio of red to blue is unknown. (Ambiguity)

  Most people will bet less on Scenario B, even if the *expected* probability is still 50%.

  Your source's committee is acting as if they are in Scenario A (known risk), but they are actually in Scenario B (ambiguity). A principled approach would apply an **ambiguity discount**. If the evidence is thin and experts disagree wildly, the "price" of that probability should be lower than if the experts agreed. Averaging hides the ambiguity, preventing the foundation from applying a rational discount for the lack of robust evidence.

  ### 4. How to Handle It Well

  If your source wants to advocate for change, she doesn't need to throw out expected value, but she does need to change *how* they aggregate and report it. Here are four concrete improvements:

  **A. Report the Distribution, Not Just the Mean**
  The committee should submit the range and the variance alongside the average.
  *   *Bad:* "Estimated probability of success: 35%."
  *   *Better:* "Estimated probability: 35% (Range: 5%–65%, Std Dev: 22%)."
  This allows the decision-makers (the Board or Program Officers) to see the disagreement. They might decide that for *this specific fund*, they want to back high-consensus "safe bets," or conversely, they might have a "high-risk, high-reward" bucket specifically for high-variance proposals.

  **B. Use Logarithmic Pooling (Geometric Mean)**
  In forecasting and expert aggregation, the **arithmetic mean** (adding and dividing) is often inferior to the **geometric mean** (multiplying and taking the root) or **logarithmic pooling**.
  *   The arithmetic mean dilutes outliers. (One person saying 5% drags the average down significantly).
  *   The geometric mean respects outliers more. It acknowledges that if one expert sees a fatal flaw (near 0%), that should weigh heavier than if one expert sees a miracle (near 100%).
  *   *Why this helps:* It prevents the "tyranny of the moderate." It forces the committee to reconcile why an outlier exists rather than mathematically smoothing them over.

  **C. Qualitative "Story" Aggregation**
  Instead of just submitting numbers, the committee should be required to submit a **minority report** or a **divergence narrative**.
  *   "Three members rated this high because of Factor X. Two members rated this low because of Factor Y."
  *   This turns the disagreement into **researchable questions**. The foundation could fund a small "scoping grant" specifically to resolve Factor Y. If Factor Y is resolved in favor of the optimists, the probability jumps. This turns the uncertainty into a roadmap.

  **D. Portfolio Theory Approach**
  Finally, the foundation should stop evaluating proposals in isolation.
  *   If the foundation funds 20 projects, and 5 of them have high disagreement (5%–65%), that might be a healthy portfolio balance.
  *   The question shouldn't be "Is this specific number accurate?" but "Does this proposal add diversification to our portfolio of bets?"
  *   High-disagreement projects are essentially **options**. They cost money to buy (fund the research), but they reveal information. Even if the research fails, knowing *why* it failed (validating the 5% skeptics) is valuable information for the field.

  ### The Journalistic Angle

  For your story, this tension is a goldmine. It illustrates the growing pains of the "longtermist" or x-risk philanthropy sector. They are trying to apply rigid, quantitative financial models (EV calculations) to domains where the data is nonexistent and the models are speculative.

  Your source's intuition is correct: **Averaging disagreement creates a illusion of precision.** It is a bureaucratic coping mechanism to make the unquantifiable fit into a spreadsheet.

  **The verdict:** She is tracking something real. The "single number" requirement is forcing epistemic humility to be sacrificed for administrative convenience. A mature funding ecosystem wouldn't hide the disagreement; it would publish it, price it, and fund the resolution of that disagreement as a primary goal.
