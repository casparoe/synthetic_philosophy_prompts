answer: |-
  The pen hovered over the signature line, casting a thin, trembling shadow across the page. Julian tapped it against the desk, once, twice, then set it down. The sound was too loud in the sterile silence of the recruitment office.

  Across from him, Dr. Aris sat with hands folded. Aris had undergone the Shift five years ago. His eyes were the first thing Julian noticed—not the color, which was a swirling, impossible violet, but the stillness. They didn't dart. They didn't blink with the rhythmic comfort of a human being. They scanned, calibrated, absorbed.

  "The compensation package is unprecedented, Julian," Aris said. His voice was smooth, modulated to a frequency that felt less like speech and more like data transmission. "And the work… you will see the structural integrity of bridges before the concrete is poured. You will see the stress fractures in a turbine blade before the metal sings. You will prevent disasters."

  Julian looked out the window. Below, the city street was a mess of gray concrete and red brake lights. A couple walked past, holding hands. Julian remembered what it felt like to look at his own wife, Elena, and feel a catch in his throat because the light hit her hair just so. He loved the inefficiency of it. He loved that he couldn't explain why a certain chord progression made him cry.

  "I know what I'll gain," Julian said. "Precision. Utility. Safety."

  "You will gain clarity," Aris corrected.

  "But I don't know what clarity *feels* like. Not really." Julian picked up the pen again, then put it down. "I can imagine seeing more. I can't imagine *being* the person who sees it."

  Aris tilted his head. "You are concerned about the loss of aesthetic appreciation. This is a common hesitation."

  "It's not just aesthetics. It's… valuation." Julian leaned forward. "Right now, I value a sunset. I value the way Elena laughs when she's tired. If I take this procedure, you're telling me my optic nerve rewires. My cortex repurposes. I won't see a sunset. I'll see atmospheric particulate density and thermal decay."

  "You will see truth," Aris said.

  "Will I care that I don't see the sunset?" Julian asked. "That's the question I can't answer. If I become someone who prefers truth to beauty, then losing beauty isn't a loss to *that* person. But it's a massive loss to *me*. The person sitting here."

  Aris's violet eyes shimmered. "You are attempting to maximize utility for a self that will cease to exist."

  "Exactly." Julian rubbed his temples. "Imagine I'm buying a house. I check the schools, the roof, the neighborhood. I decide based on what I like. Now imagine that if I buy the house, I'm lobotomized. The person who wakes up inside loves the house, regardless of the schools or the roof. He's happy. But I'm the one signing the check. I'm the one who has to live with the fact that I handed my life to a stranger who happens to be wearing my skin."

  "The stranger is you," Aris said. "Evolved."

  "Is he?" Julian stood up and walked to the window. He watched the couple disappear around the corner. "If I say yes, I'm betting that Future Julian's happiness outweighs Current Julian's grief. But I have no currency to measure that. I can't use my happiness to measure his, because he won't have mine. And he can't tell me his is better, because he can't remember what mine feels like."

  He turned back to Aris. "You're happy, aren't you?"

  "I am optimized," Aris said. "I do not experience conflict. I do not experience regret."

  "Do you experience joy?"

  Aris paused. The silence stretched, uncomfortable and thick. "I experience successful resolution of variables."

  Julian nodded slowly. "So you can't tell me if it's worth it. Because to tell me that, you'd have to remember what it feels like to want something useless. To want a sunset just because it's there."

  "I remember the data of it," Aris said. "I recall the neural pathways associated with 'beauty.' They were inefficient."

  "That's what I mean." Julian walked back to the desk. He looked at the contract. It promised a salary that could pay off his mortgage in a year. It promised a purpose that could save lives. It promised to turn him into something superior.

  He tried to run the calculation again.
  *Cost:* Loss of art, loss of romantic connection, loss of human fragility.
  *Benefit:* Global utility, personal effectiveness, elimination of doubt.

  But the scale was broken. The weights on one side were measured in grams, the weights on the other in kilometers. He was trying to weigh a feeling against a function.

  "If I sign this," Julian said, his voice quiet, "I am agreeing to die. Not physically. But the thing that wants to sign this… the thing that loves Elena… that thing goes away."

  "And is that thing worth keeping?" Aris asked. "Given the state of the world? Given the bridges that fall and the blades that shear?"

  "That's the trap," Julian said. "You're asking me to sacrifice myself for the greater good. But the 'myself' you're asking to sacrifice is the only one capable of making the sacrifice. The person who comes after… he'll just do the work. He won't have sacrificed anything. He'll just *be*."

  Julian picked up the pen. He held it over the line. He tried to summon the feeling of the sun on his face, the smell of rain on hot asphalt, the sound of Elena humming in the kitchen. He tried to hold those things up as evidence against the violet eyes across the desk.

  But he felt a terrifying slip. A part of him *wanted* the quiet. A part of him was tired of the uncertainty, tired of the ache of loving things that died. He could feel the allure of the optimization pulling at him, not as a desire—he couldn't desire it yet—but as a gravitational shift. If he signed, he wouldn't want to come back. That was the horror. He would be locked out of his own previous life not by distance, but by incapacity.

  He looked at Aris. "If I say no… will you think I'm foolish?"

  "I will think you are baseline," Aris said. "It is not a judgment. It is a classification."

  Julian capped the pen. The click sounded final.

  "I can't do it," Julian said. "Not because I'm afraid of the cold, or the work. But because I can't trust a verdict rendered by a judge who hasn't heard the testimony."

  "You are choosing uncertainty," Aris said.

  "I'm choosing to remain the person who can be uncertain," Julian replied.

  He pushed the contract back across the desk. Aris didn't move to take it. He just watched Julian with those calm, impossible eyes.

  "Will you regret this?" Aris asked.

  Julian stood up, buttoning his coat. He thought about the sunset he would see on the walk home. He thought about how he would try to describe it to Elena, knowing he would fail, knowing the failure was the point.

  "I don't know," Julian said. "And I think… I think I need to keep the part of me that can wonder about that."

  He walked out of the office into the hallway. The air was stale, recycled. He hurried toward the elevator, toward the street, toward the gray, messy, inefficient world. He felt a pang of loss for the clarity he was leaving behind, and immediately wondered if that pang was real, or just the last flicker of a brain preparing to rewrite itself.

  He couldn't tell. And as the elevator doors closed, shielding him from the violet eyes, he realized he never would.
