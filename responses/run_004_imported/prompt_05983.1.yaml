      *   *Barbara Herman:* Distinguishes between "rules of moral salience" and the test itself. The test checks coherence, but the inputs need moral training.
      *   *Paul Guyer:* Acknowledges the tension. Admits Kant leans on empirical anthropology but tries to keep the *normative* force formal.
      *   *The "Teleological" Reading:* Rational nature exists as an end in itself. To will against the conditions that sustain rational nature (like mutual aid) is to will against the end in itself.

