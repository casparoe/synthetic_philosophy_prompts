      *   **Core Subject:** Kant's *Groundwork of the Metaphysics of Morals*, specifically the Formula of Universal Law (FUL).
      *   **Specific Problem:** The distinction between "Contradiction in Conception" (CC) and "Contradiction in the Will" (CW).
      *   **The User's Suspicion:** The CW test (used for imperfect duties like beneficence) seems to rely on substantive empirical claims about human vulnerability/needs rather than being a purely formal logical test like the CC test. It looks like it smuggles in premises about what humans *want* or *need*.
      *   **The Question:** What is doing the argumentative work in CW cases? Do Kant or his interpreters have a convincing reply to the charge that this isn't purely formal?

  2.  **Initial Analysis & Kantian Theory:**
