answer: |-
  This is one of the most persistent and sophisticated objections to Kant's ethics, and your intuition is shared by many serious scholars. You have identified the precise pressure point where the Formula of Universal Law (FUL) seems to buckle under the weight of human finitude.

  To answer your question directly: In the "Contradiction in the Will" (CW) cases, the argumentative work is being done by **the necessary structure of rational agency combined with the fact of human finitude.**

  The suspicion that this smuggles in substantive premises is correct, but whether it is *fatal* to Kant's project depends on how one interprets the status of those premises. Here is a breakdown of what is happening in the CW test, why it feels different from the Contradiction in Conception (CC) test, and how the best interpreters attempt to defend its formality.

  ### 1. What is doing the work in the Contradiction in the Will?

  In the CC test (false promising), the contradiction is almost logical or linguistic. If everyone falsely promises, the concept of a "promise" loses its meaning. The institution collapses.

  In the CW test (refusing help), the institution of "helping" does not collapse. People *could* logically exist in a world where no one helps anyone. So, where is the contradiction?

  Kant argues the contradiction arises between **the agent's particular will** (to be helped when in need) and **their universalized will** (that no one be helped).

  The mechanism works like this:
  1.  **The Fact of Finitude:** Human beings are *finite* rational agents. We have needs we cannot satisfy alone. This is an empirical fact.
  2.  **The Structure of Willing:** To be a rational agent is to set ends and seek means to achieve them. Kant argues it is an analytic truth that a rational being necessarily wills the necessary means to their ends (or, broadly, their own happiness as the sum of satisfied inclinations).
  3.  **The Conflict:** If I universalize the maxim "I will never help others," I am legislating a world where the means to my own necessary ends (aid from others) are systematically removed.
  4.  **The Contradiction:** I cannot *rationally will* a law that undermines the conditions required for the success of my own rational willing.

  **So, is it formal?**
  Strictly speaking, **no**, not in the same way CC is. CC relies on the law of non-contradiction applied to concepts. CW relies on a contradiction between a *volition* and the *conditions of that volition's success*.

  The "substantive premise" you suspect is being smuggled in is the claim that **rational beings necessarily will their own happiness (or the furtherance of their ends).** If a being were self-sufficient (like God), the CW test would not generate a duty of beneficence. Therefore, the duty depends on the anthropological fact of human vulnerability.

  ### 2. Kant's Defense: Formal vs. Empirical

  Kant anticipates this objection. He distinguishes between **empirical desires** (I want ice cream) and **necessary ends of reason** (I will my own perfection and happiness).

  Kant's reply would be that while the *application* of the test requires knowing we are finite, the *normative force* comes from the structure of rationality, not the specific needs.
  *   It is not that "I *happen* to need help, so I should help."
  *   It is that "I cannot consistently will the removal of the conditions of my agency."

  For Kant, the premise "Rational beings will their own happiness" is not a contingent psychological observation but a teleological claim about what it *means* to be a finite rational will. Therefore, he views the test as formal because it tests the **coherence of the will with itself**, not the satisfaction of specific desires.

  ### 3. Interpretive Defenses (Can the suspicion be answered?)

  Modern interpreters have tried to shore up this weak point. Here are the three most convincing strategies:

  #### A. The Agency Conditions Reading (Onora O'Neill)
  O'Neill argues that we should not view CW as relying on "I might need help someday" (a prudential fear). Instead, we should view mutual aid as a **condition of the possibility of sustained agency.**
  *   **The Argument:** To pursue long-term projects (a requirement of rational agency), one requires a stable social environment. A world of total non-aid is a world of radical instability where long-term rational planning becomes impossible.
  *   **The Defense:** This makes the duty formal because it is derived from the conditions of agency itself, not from contingent desires. If you will the end (agency), you must will the means (a supportive social world).
  *   **Verdict:** This is strong, but it still leans on the empirical claim that human agency *is* fragile.

  #### B. The Kingdom of Ends Reading (Christine Korsgaard)
  Korsgaard suggests that CW cases only make full sense when read in light of the **Formula of Humanity** (the second formulation of the Categorical Imperative).
  *   **The Argument:** When I refuse to help, I am treating my own needs as important (I expect to be helped) while treating others' needs as irrelevant. I am making an exception for myself.
  *   **The Defense:** The contradiction is not in the *world* conceived, but in the *status* I claim. I claim to be a legislator in a Kingdom of Ends, but I legislate a law that excludes me from the community of mutual support that defines that Kingdom.
  *   **Verdict:** This admits that FUL alone is "empty" (as Hegel famously charged) and requires the substantive value of "Rational Nature as an End-in-Itself" to do the work. It saves Kant's ethics but concedes that FUL is not purely formal on its own.

  #### C. The "Rational Nature" Reading (Paul Guyer)
  Guyer is more critical. He acknowledges that Kant *does* smuggle in empirical anthropology.
  *   **The Argument:** Kant tries to derive duties from pure reason, but the CW test clearly relies on the "natural purpose" of human beings.
  *   **The Defense:** Guyer suggests we should accept that Kant's ethics is not purely formalist in the strict logical sense. It is formal regarding *moral principles* (they apply to all rational beings) but material regarding *human application* (they account for human nature).
  *   **Verdict:** This is the most honest reply. It suggests your suspicion is correct, but that it doesn't destroy the system, only refines our understanding of what "formal" means for Kant.

  ### 4. Is the Reply Convincing?

  To answer your final question: **It depends on how much metaphysics you are willing to buy.**

  **If you reject Kant's teleology:**
  If you do not believe that "rational nature" has a necessary end (happiness/perfection) or that there is a standard of "sustained agency," then the CW test collapses into prudential advice: *"Help others so they help you."* This destroys the moral necessity Kant wants. In this view, your suspicion is fatal; the test *does* smuggle in a substantive premise about human vulnerability that cannot be derived from pure logic.

  **If you accept Kant's metaphysics of agency:**
  If you accept that to be a rational will *just is* to will the conditions of one's own efficacy, then the test remains formal. It is not about *what* you want (substance), but about whether your will can cohere with the prerequisites of its own existence (form). The "substantive premise" (humans are vulnerable) is not a moral premise, but an anthropological one required to apply the moral law to human beings (which Kant admits in the *Metaphysics of Morals*).

  ### Summary
  The Contradiction in the Will test works by identifying a conflict between **willing a universal law** and **willing the necessary conditions of one's own rational agency.**

  Your suspicion is well-founded: unlike the CC test, the CW test relies on the empirical fact of human finitude.
  *   **Kant's Reply:** This doesn't make it non-moral, because the *obligation* comes from the rational inconsistency, not the need itself.
  *   **Best Interpreter Reply (O'Neill/Korsgaard):** The test reveals that non-beneficence undermines the very social conditions required for rational agency or membership in a moral community.
  *   **Critical Reply (Guyer/Hegel):** The test is not purely formal; it relies on a substantive conception of human goods.

  Most contemporary Kantians settle on a middle ground: The FUL is the *test* of morality, but it presupposes a substantive value (Rational Nature) that is made explicit in the Formula of Humanity. Without that substantive anchor, the CW test risks becoming a calculation of long-term self-interest, which is exactly what Kant wanted to avoid.
