      *   *The Four Examples:* Suicide (CC), False Promise (CC), Neglecting Talents (CW), Refusing Help (CW).
      *   *CC:* The maxim becomes impossible in a world where everyone follows it (logical/teleological contradiction).
      *   *CW:* The maxim *can* be conceived as a universal law, but the agent cannot *will* it without contradicting their own will.
      *   *The User's Point:* CW seems to depend on "I might need help someday." That's an empirical fact about human finitude. Is that allowed in a *priori* ethics?

  3.  **Addressing the "Formal vs. Substantive" Charge:**
      *   *Kant's Defense:* Kant argues that the "will" in question isn't empirical desire (what I happen to want) but rational willing (what a rational agent necessarily wills as an end).
      *   *The End of Rational Nature:* Rational beings necessarily will their own happiness/perfection (in a broad sense). To will a world where no one helps anyone is to will a world where one's own necessary ends might be frustrated without recourse.
      *   *Is it Empirical?* Yes, human vulnerability is empirical. *However*, Kant tries to ground the *necessity* of willing aid in the structure of rational agency itself, not just contingent fear.
      *   *The "Rational Will" vs. "Empirical Will":* The test isn't "Do you *want* help?" It's "Can a rational will consistently will the universal removal of the means to its own ends?"

  4.  **Key Interpretive Strategies (The "Best Interpreters"):**
