prompt: |-
  For a term paper in my seminar on the history of utilitarianism, I've been working through Bentham's unpublished writings on sexual morality: the essay conventionally known as "Offences Against One's Self" (c. 1785) and the later manuscripts collected as "Of Sexual Irregularities" (written in the 1810s but not published until 2014). Across both texts, Bentham works through the standard objections to "irregular" and non-procreative sex — that it weakens men, threatens marriage, depletes the population — and argues that none survives utilitarian scrutiny; by the later manuscript he goes further, suggesting that, given contemporary anxieties about a growing population, sex that produces no child is if anything a net good rather than a loss. I'd like to know what you think Bentham would make of today's "pronatalist" movement, which holds that developed countries facing below-replacement fertility should adopt policies to encourage childbearing. Reasoning from the actual structure of his argument rather than just his general commitment to the greatest happiness principle, would the reversal in demographic circumstances force him to abandon his position, or is there a deeper commitment in his reasoning that would survive the switch from a world anxious about overpopulation to one anxious about underpopulation?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Jeremy Bentham's views on sexual morality, specifically "Offences Against One's Self" (c. 1785) and "Of Sexual Irregularities" (1810s, pub. 2014).
      *   **Context:** Term paper for a seminar on the history of utilitarianism.
      *   **Core Question:** How would Bentham react to today's "pronatalist" movement (encouraging childbearing due to below-replacement fertility in developed nations), given that his original argument relied partly on the idea that non-procreative sex is good *because* population was a concern then?
      *   **Constraint:** Reason from the *actual structure of his argument*, not just the general "greatest happiness" principle. Determine if the demographic reversal forces him to abandon his position or if a deeper commitment survives.

  2.  **Recall/Research Bentham's Arguments on Sexual Morality:**
      *   *Primary Source Knowledge:* Bentham's writings on sexuality were radical for his time. He argued against the criminalization of sodomy and other "irregularities."
      *   *Key Arguments:*
          1.  **Consent/Harm:** If consensual and private, no direct harm is done to others.
          2.  **Health:** The idea that it weakens men is superstition/medical falsehood.
          3.  **Marriage:** It doesn't necessarily threaten marriage (might even relieve pressure).
          4.  **Population:** This is the crux of the user's question. In the 18th/early 19th century, Malthusian anxieties existed, but generally, a large population was seen as a source of national strength. Bentham flipped this: if population is a burden, non-procreative sex is *beneficial* because it reduces the strain on resources without causing pain.
          5.  **Pain vs. Pleasure:** The pain caused by punishment (shame, prison, execution) vastly outweighs the vague "disgust" felt by observers or the abstract loss of a potential child.
      *   *Structure of Argument:* It's not just "Population Good/Bad." It's a calculus of *pain and pleasure*. The population argument is a *secondary* reinforcement, not the *primary* foundation. The primary foundation is the absence of assignable harm and the presence of punishment-induced pain.

  3.  **Analyze the "Pronatalist" Context:**
      *   Today, many developed nations worry about aging populations, shrinking workforces, and economic stagnation due to low fertility.
      *   Pronatalists argue for policies (tax breaks, subsidies, cultural shifts) to encourage more births.
      *   Some might argue non-procreative sex is "selfish" or economically detrimental in this specific context.

  4.  **Simulate Bentham's Reasoning (The "Felicific Calculus" applied to Demographics):**
      *   *Would he change his mind?*
      *   *Factor 1: The Primary Objection (Harm).* Bentham's main point was always that "irregular" sex causes no *assignable harm* to specific others. Punishment creates real pain. Does low fertility change the "no harm" calculus? Not really. A child not born is not a person harmed (non-identity problem avant la lettre).
      *   *Factor 2: The Population Argument.* In 1785/1810, Bentham argued non-procreative sex helps if population is too high. If population is too low, does procreative sex become a *duty*?
          *   Bentham was skeptical of "duties" that don't produce clear happiness.
          *   He would ask: Does having more children *actually* increase the sum of happiness in a modern developed state?
          *   Modern constraints: Climate change, resource scarcity, cost of living. Bentham would weigh the pleasure of the parents/child against the cost to the state/society.
      *   *Factor 3: Coercion vs. Liberty.* This is crucial. Bentham was a legal reformer. He hated punishment that didn't work or caused more pain than the offense.
          *   Pronatalist *policies* (incentives) vs. Pronatalist *coercion* (restricting contraception/abortion/non-procreative sex).
          *   Bentham would likely support incentives (if they increase happiness) but vehemently oppose criminalizing non-procreative sex, even in a depopulating society. Why? Because the pain of coercion > the economic benefit of the baby.
      *   *Factor 4: The "Deeper Commitment".* The user asks for this. The deeper commitment is **anti-asceticism** and the **sovereignty of individual judgment regarding pleasure**, provided no assignable harm occurs. The population argument was tactical, not foundational.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the question. Validate the user's reading of the texts (yes, Bentham did flip the population argument).
      *   *Core Argument Structure:* Break down Bentham's reasoning into layers.
          1.  *Layer 1: Assignable Harm.* (The bedrock). No victim = no crime.
          2.  *Layer 2: The Pain of Punishment.* (The legal critique). Laws against sex cause more pain than the sex prevents.
          3.  *Layer 3: Population.* (The contingent variable). This is where the user's question lies.
      *   *Addressing the Demographic Reversal:*
          *   If population is low, does non-procreative sex become bad?
          *   Bentham would look at the *marginal utility* of a new citizen. In a modern welfare state with climate concerns, is a new baby a net utility gain? It's debatable.
          *   Even if it *were* a gain, would criminalizing contraception/sodomy be the way to get it? No. Ineffective and painful.
      *   *Pronatalism vs. Liberty:* Distinguish between *encouragement* (subsidies) and *prohibition* (banning "irregularities"). Bentham might accept the former (if utility-proven) but reject the latter.
      *   *The "Deeper Commitment":* Identify the philosophical anchor. It's the rejection of **asceticism** and **sympathy/antipathy** as grounds for law. The "principle of sympathy and antipathy" is what Bentham fought against. Pronatalism often relies on "natural law" or "tradition," which Bentham would dismiss.
      *   *Conclusion:* Summarize. The demographic shift doesn't break his argument because the population point was secondary to the harm/pain calculus.

  6.  **Refining the Nuance (Self-Correction during drafting):**
      *   *Correction:* Make sure not to project modern utilitarianism (like Peter Singer) onto Bentham. Stick to *Bentham's* specific texts and logic.
      *   *Nuance:* Bentham was a legal positivist. He cares about what the *law* should do. He wouldn't necessarily tell people what to do privately, but whether the *state* should intervene.
      *   *Specific Text Reference:* Mention "Of Sexual Irregularities" specifically regarding the "populousness" argument. He explicitly says if populousness is good, then procreative sex is good, *but* if populousness is bad (Malthus), then non-procreative is good. He treats populousness as an empirical variable, not a moral absolute.
      *   *Key Insight:* The "Non-Identity Problem." Bentham intuitively grasps that a non-existent child cannot be harmed by not being born. This is crucial for the pronatalist counter-argument.

  7.  **Final Polish:** Ensure tone is academic but accessible, suitable for a term paper consultation. (Check: Did I answer the specific prompt? Yes: "Reasoning from the actual structure... would the reversal... force him to abandon... or is there a deeper commitment?")

  8.  *(Final check of the "Deeper Commitment")*: It is the **principle of utility applied to legislation** specifically regarding **private conduct**. The state should only intervene to prevent harm to others. Demographic goals are collective; sexual conduct is private. The bridge between them (law) is too costly in terms of pain.

  9.  **Constructing the Output:** (Proceed to generate response based on these points.)
answer: |-
  This is an exceptionally sharp question that cuts to the methodological core of Bentham's utilitarianism. You are correct to identify that Bentham's defense of sexual liberty in *Offences Against One's Self* and *Of Sexual Irregularities* relies on a multi-layered argument, where the demographic point is often the most visible but not necessarily the most foundational.

  If we reason strictly from the structure of Bentham's argument rather than applying a generic "maximize happiness" label, it is highly unlikely that the shift from 18th-century population anxieties to 21st-century depopulation anxieties would force Bentham to endorse pronatalist restrictions on sexual conduct. While he might accept certain *incentives*, the deeper commitments in his reasoning—specifically regarding **assignable harm**, the **pain of coercion**, and the **rejection of asceticism**—would remain intact.

  Here is an analysis of how Bentham would likely deconstruct modern pronatalism based on the architecture of his sexual manuscripts.

  ### 1. The Hierarchy of Arguments: Population is Contingent, Harm is Fundamental
  In *Of Sexual Irregularities*, Bentham structures his defense of "irregular" sex (including sodomy and contraception) as a series of rebuttals to specific objections. It is crucial to note the order and weight of these rebuttals.

  *   **Primary Layer (The Harm Principle):** Bentham's first and most robust line of defense is that consensual, private sexual acts produce no **assignable harm** to specific others. He argues that unless a specific individual can point to a specific loss (property, person, reputation), there is no basis for legal intervention.
  *   **Secondary Layer (The Medical/Physical):** He debunks the idea that non-procreative sex physically weakens men or causes illness, treating these as empirical falsehoods.
  *   **Tertiary Layer (The Demographic):** This is where your observation lands. Bentham acknowledges the standard view that a state needs population for strength. However, he treats "populousness" not as a moral absolute, but as an **empirical variable**. He explicitly writes that if a country is overpopulated (a Malthusian concern he anticipated), then non-procreative sex is actually a *public benefit* because it relieves resource pressure.

  **Application to Today:**
  For Bentham, the demographic argument is instrumental, not foundational. If the demographic situation reverses (i.e., we need more people), the *instrumental value* of procreative sex changes, but the *moral status* of non-procreative sex does not.
  Bentham would ask the modern pronatalist: "Does the non-existence of a specific child constitute an **assignable harm** to a specific existing person?" His answer would almost certainly be no. A child that is never conceived cannot be a victim. Therefore, the primary justification for legal liberty (the absence of a victim) remains intact regardless of fertility rates.

  ### 2. The Calculus of Coercion: Pain of Punishment vs. Economic Gain
  The most distinctively Benthamite element of his argument is the **felicific calculus applied to legislation**. Bentham is not just asking "What behavior creates happiness?" but "Does criminalizing this behavior create more pain than it prevents?"

  In *Of Sexual Irregularities*, Bentham argues that the pain inflicted by the law (prosecution, imprisonment, social ostracization, anxiety) vastly outweighs the vague "disgust" felt by observers or the abstract loss to the state of a potential citizen.

  **Application to Pronatalist Policy:**
  Modern pronatalism ranges from soft incentives (tax credits) to hard restrictions (banning contraception or abortion, criminalizing homosexuality).
  *   **Incentives:** Bentham might accept tax breaks for children. This is a "pleasure" (money) added to the act of parenting, increasing the likelihood of the behavior without inflicting pain. This fits his utilitarianism.
  *   **Restrictions:** Bentham would vehemently oppose using the law to force procreation. He would argue that the **pain of coercion** (loss of bodily autonomy, the misery of unwanted children, the surveillance required to enforce sexual norms) is immediate, intense, and certain. The **economic benefit** of a new citizen is distant, uncertain, and diffuse.
  *   **The "Duty" to Procreate:** Bentham was deeply suspicious of moral duties that relied on self-sacrifice without clear reciprocal benefit. He would likely view a "duty to procreate" as a form of **asceticism** (the principle he opposed most alongside sympathy/antipathy). Sacrificing one's sexual liberty for the abstract "health of the nation" would strike him as a religious or aristocratic relic, not a rational calculation.

  ### 3. The Rejection of "Sympathy and Antipathy"
  In *An Introduction to the Principles of Morals and Legislation*, Bentham identifies the "Principle of Sympathy and Antipathy" as the great enemy of rational law. This is the tendency to approve or disapprove of actions based on gut feeling, tradition, or "natural law" rather than utility.

  Much of modern pronatalist rhetoric relies on appeals to "natural order," "traditional family structures," or the "intrinsic value" of population growth.
  *   **Bentham's Critique:** He would argue that these are merely synonyms for personal antipathy toward non-conformity. Just as 18th-century critics called sodomy "unnatural," 21st-century pronatalists might call childlessness "unnatural." For Bentham, "nature" is not a normative guide; only pain and pleasure are.
  *   **The Deeper Commitment:** This is the commitment that survives the demographic switch. Bentham's deeper commitment is to **rational secularism in legislation**. He demands empirical proof that a law increases happiness. A pronatalist claim that "low fertility causes civilizational collapse" would need to be proven empirically, not asserted dogmatically. Even if proven, the *means* of addressing it (restricting private sex) would fail the utility test due to the high cost in liberty and pain.

  ### 4. The "Non-Identity" Intuition
  While not formalized as the "Non-Identity Problem" (which comes from Derek Parfit in the 1980s), Bentham's reasoning anticipates it. In his discussions on abortion and contraception, Bentham struggles with the status of the fetus but is clear that preventing a potential life is not the same as destroying an existing one.

  If a developed nation has below-replacement fertility, the "loss" is a statistical aggregate, not a collection of harmed individuals. Bentham's utilitarianism is often criticized for allowing the sacrifice of individuals for the collective, *but* in the realm of private morality, he is surprisingly liberal. He recognizes that the "collective good" of population growth is too abstract to justify the concrete pain of individuals forced into reproductive roles. He would likely argue that a smaller population with higher individual happiness is preferable to a larger population with coerced, miserable parents.

  ### Conclusion for Your Paper
  To answer your specific question: **No, the reversal in demographic circumstances would not force Bentham to abandon his position on sexual liberty.**

  The demographic argument in *Of Sexual Irregularities* was a **tactical concession**, not a **foundational premise**. Bentham argued that non-procreative sex is permissible *even if* population growth is desired, because the harm of prohibition outweighs the benefit of the baby. He *also* argued that non-procreative sex is *positively good* if population is a burden.

  The **deeper commitment** that survives the switch from overpopulation to underpopulation is:
  1.  **The Sovereignty of Private Judgment:** In the absence of assignable harm to others, the individual is the best judge of their own pleasure.
  2.  **The High Cost of Legal Coercion:** The pain inflicted by policing private sexuality is always greater than the utility gained by enforcing conformity.
  3.  **Anti-Asceticism:** The refusal to accept "duty" or "nature" as valid reasons for inferring pain on living people for the sake of potential people.

  Bentham would likely view modern pronatalist *incentives* as a legitimate field for utilitarian calculation (do subsidies work? do they cost more than they yield?), but he would view pronatalist *restrictions* on sexual morality as a regression to the very "ascetic" and "sympathy/antipathy" principles he spent his life dismantling. The demographic context changes the *data* input for the calculus, but it does not change the *formula*.

  **Suggested Citation Note:** For your paper, you might look at Louis Crompton's introduction to the 2014 *Of Sexual Irregularities* edition, or the analysis by Philip Schofield, who notes that Bentham's population argument was intended to neutralize the "public good" objection, thereby isolating the core issue: individual liberty vs. legal pain. This supports the view that the population point was a shield, not the sword.
