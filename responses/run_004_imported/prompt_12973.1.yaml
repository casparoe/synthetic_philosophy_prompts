answer: |-
  **Handout Note: The Value of Information (Good vs. Hirshleifer)**

  **The Puzzle**
  You have correctly identified a famous tension in formal epistemology and economic theory.
  *   **I.J. Good's Theorem (1967):** In a standard Bayesian decision problem, the expected utility of observing a free piece of evidence (and then acting optimally) is always at least as high as acting without it. Information is never *ex-ante* harmful.
  *   **The Hirshleifer Effect (1971):** In insurance or asset markets, public information revealed *before* contracting can destroy risk-sharing opportunities, leaving all parties *ex-ante* worse off. Information can be socially (and individually) harmful.

  **The Resolution**
  The conflict is not a contradiction in the math, but a mismatch in the **scope of application**. Good's theorem is a result of *single-agent decision theory*. The Hirshleifer effect is a result of *multi-agent general equilibrium theory*.

  **The Violated Assumption**
  To pin this down precisely: Good's proof relies on the **Assumption of a Fixed Consequence Function** (sometimes called the **Invariance of the Decision Problem**).

  Formally, Good's theorem assumes that for any action $a$ and state of the world $s$, the utility $U(a, s)$ is **invariant** to the information signal $e$ received by the agent. The information updates the *probability* of the state, $P(s)$, but it does not alter the *payoff structure* itself.

  In Good's framework:
  1.  There is a fixed set of acts $A$.
  2.  There is a fixed utility function $U: A \times S \to \mathbb{R}$.
  3.  The experiment reveals information about $S$, but does not change $A$ or $U$.

  The proof works because of the convexity of the maximum function:
  $$ E_e \left[ \max_a E[U(a, s) \mid e] \right] \ge \max_a E_e \left[ E[U(a, s) \mid e] \right] = \max_a E[U(a, s)] $$
  This inequality holds *only if* the $U$ inside the expectation on the left is the same function as the $U$ on the right.

  **Why Hirshleifer Violates This**
  In the Hirshleifer insurance scenario, the arrival of public information changes the **strategic environment**, which effectively alters the consequence function $U$.

  1.  **Strategic Interdependence:** Your ability to execute the action "Purchase Insurance" depends on the insurer's willingness to sell. The insurer is also a rational agent observing the same public signal.
  2.  **Changing the Payoff Structure:** Before the signal, the action "Buy Insurance" yields a payoff of *smoothed consumption*. After a public signal reveals you are high-risk, the action "Buy Insurance" yields a payoff of *rejection* (or prohibitively high premiums).
  3.  **The Violation:** The utility of the action $a$ ("Contract") is no longer just $U(a, s)$. It is now $U(a, s, \text{Counterparty Knowledge})$. Because the Counterparty Knowledge is a function of the signal $e$, the utility function itself becomes conditional on the evidence: $U(a, s, e)$.

  Once $U$ depends on $e$, Good's inequality no longer holds. The term inside the expectation on the left-hand side changes:
  $$ E_e \left[ \max_a E[U(a, s, e) \mid e] \right] \ngeq \max_a E[U(a, s)] $$
  The information has not just helped you choose a better action from a fixed menu; it has **removed items from the menu** (or changed their prices) by altering the counterparty's behavior.

  **Summary for Students**
  Good's Theorem proves that information is valuable for **choosing** among options. The Hirshleifer Effect shows that information can be destructive if it **eliminates** options (specifically, risk-pooling contracts) by aligning the information of trading partners.

  Good's theorem assumes a **passive world** where consequences depend only on states. Hirshleifer's scenario involves an **active world** (other agents) where consequences depend on states *and* the information distribution itself. The assumption doing all the work in Good's proof is that **the payoff structure is independent of the information signal.**
