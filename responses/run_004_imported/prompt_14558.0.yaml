answer: |-
  This is a fantastic debate, and honestly, it cuts right to the heart of where modern analytic philosophy (Parfit) and classical Buddhist metaphysics (Vasubandhu) look similar on the surface but diverge sharply in their underlying machinery.

  Here is the short answer: **You win the technical argument.** Your friend has captured the *slogan* of Buddhism ("no-self"), but you have captured the *mechanism* of Buddhism (*santana*, causal continuity, and karma).

  If you run the Star Trek teleporter through Vasubandhu's *Abhidharmakośa* or his Yogācāra texts (*Viṃśatikā*), the person stepping out of the machine is **not** the same person, even conventionally, because the causal continuum (*santana*) has been severed or falsified.

  Here is the reconstruction of Vasubandhu's ruling, broken down by his core concepts, and why your reading holds more water than your friend's.

  ---

  ### 1. The Metaphysics: What is a "Person" for Vasubandhu?
  Your friend is operating on the idea that if there is no "self," then identity is loose. If the parts are the same, the "person" is the same.

  Vasubandhu disagrees. For him, a person is *prajñapti-sat* (conceptually existent), not *dravya-sat* (substantially existent). However, this concept is not arbitrary. It is imputed upon a **causal continuum** (*santana*) of momentary dharmas (*kṣaṇika*).

  *   **The Key Distinction:** Identity over time is not based on **similarity** (having the same arrangement of aggregates); it is based on **causal genealogy**.
  *   **The Analogy:** Think of a flame passing from one candle to another. The flame at $t_2$ is "the same" flame as $t_1$ not because they look alike, but because $t_1$ caused $t_2$. If you light a third candle using a match that looks exactly like the first flame, it is not a continuation of the first flame.

  **Vasubandhu's Ruling:** The teleporter creates a *copy* based on information, not a *continuation* based on direct causal efficacy. The aggregates in the new body are caused by the **machine**, not by the immediately preceding moment of the original aggregates. Therefore, the *santana* is broken.

  ### 2. The Mechanism of Continuity: *Samanantara-Pratyaya*
  In Abhidharma, for consciousness to continue, it requires the *samanantara-pratyaya* (immediately preceding condition). Moment $B$ of consciousness must arise directly from the cessation of Moment $A$.

  *   **In Rebirth:** When a Buddhist dies and is reborn, the physical body decays, but the mental continuum flows directly into the new conception without a gap, driven by karma and craving. The causal chain is unbroken.
  *   **In Teleportation:** The original body is destroyed. The consciousness stream ceases. The new body is built, and a new consciousness is instantiated based on data.
  *   **The Problem:** There is a causal gap. The new consciousness is not the *effect* of the old consciousness; it is the effect of the **scanner's data**.

  For Vasubandhu, this makes the teleporter passenger a **different *santana*** that merely resembles the original. It is a "fresh" stream of aggregates that has been tricked into thinking it is the old one.

  ### 3. The Karmic Ledger: *Bījas* (Seeds)
  This is where your argument about karma becomes decisive. Vasubandhu's system (especially in his Yogācāra phase) relies on the *ālaya-vijñāna* (storehouse consciousness) to carry karmic seeds (*bījas*).

  *   **Karma is not data:** Karma is not information stored in the brain that can be copied. It is a causal potency planted in the stream.
  *   **The Teleporter Failure:** If you destroy the original body, you destroy the specific locus of those karmic seeds. Even if you rebuild the physical hardware perfectly, the *karmic latency* cannot be transferred via scan.
  *   **The Ethical Consequence:** If the original "You" committed a murder and then teleported, does the copy suffer the karmic fruit?
      *   **Parfit/Friend:** Yes, psychological continuity is what matters.
      *   **Vasubandhu:** No. The causal stream that committed the murder ceased. The new stream is innocent (though it may have the *memory* of the murder). This breaks the law of Karma (*karma-niyama*), which requires that the doer and the experiencer belong to the same causal continuum.

  ### 4. The Fission Problem (The "Non-Destruction" Variant)
  You mentioned the version where the original isn't destroyed. This is the "Fission" problem, and it is fatal to your friend's "who cares, no self" argument.

  If the scanner copies you without destroying you, there are now two streams.
  *   **Vasubandhu's View:** Since there was never a "self" to begin with, there is no contradiction in there being two streams. However, they are now **two distinct persons**.
  *   **Why?** Because a *santana* is defined by its unique causal trajectory. Once they occupy different spaces and have different experiences (one stays on Earth, one goes to Mars), they are two different karmic accounts.
  *   **The Implication:** You cannot say "both are me." You must say "the original stream continued on Earth, and a new, similar stream began on Mars." If the Earth-you dies, the Mars-you does not inherit your karma.

  ### 5. Where Parfit and Buddhism Diverge
  Your friend is channeling Parfit. Parfit argues that "identity" doesn't matter; what matters is **Relation R** (psychological connectedness/continuity). Parfit is okay with branching (fission).

  Vasubandhu agrees that "Self" doesn't matter, but he insists that **Causal Continuity** matters immensely.
  *   **Parfit:** Identity is not what matters.
  *   **Vasubandhu:** *Substantial* identity doesn't exist, but *Causal* identity is the only thing that *does* matter (for the sake of liberation and karma).

  Parfit thinks breaking the chain is fine if the psychology is preserved. Vasubandhu thinks breaking the chain is soteriological suicide because it severs the path of mental cultivation (*bhāvanā*). If you teleport, does the enlightenment attained by the original count for the copy? Vasubandhu would say **no**, because the mental habits (*vāsanā*) were not causally transmitted, they were simulated.

  ### The Verdict

  **You have the better reading.**

  *   **Your Friend** is right that Buddhism denies a *substantial* self. If there were a soul (*ātman*), teleportation would definitely kill it. So, in a negative sense, they are right: there is no soul to be lost.
  *   **You** are right that Buddhism posits a **causal substitute** for the self (*santana*). This substitute is fragile. It requires unbroken causal dependence. Teleportation (scan-destroy-rebuild) is effectively **death followed by the creation of a clone.**

  **Vasubandhu's Final Ruling:**
  The being stepping out of the teleporter is a **different person** (*pudgala*) who possesses the memories and habits of the deceased. It is a *nirmāṇa* (emanation) or a copy, not a continuation. The original *santana* ended when the scanner deactivated the original body.

  **Who buys the next round?**
  Your friend. They fell for the "No Self = Anything Goes" trap. You correctly identified that in Abhidharma, "No Self" actually implies "Strict Causal Accountability," which the teleporter violates.

  *(Note: If you want to be generous to your friend, there is a tiny loophole in the Yogācāra "Mind Only" view: if the whole universe is a projection of mind, maybe the teleporter is just a change in the visualized form. But even then, the karmic causality within the dream must remain consistent, so the ruling stands.)*
