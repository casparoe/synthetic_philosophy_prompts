      *   **Personal Identity:** There is no enduring substance (*pudgala*). A "person" is a conceptual imputation (*prajñapti*) upon a causal continuum (*santana*) of five aggregates (*skandhas*).
      *   **Continuity:** What links moment $t_1$ to $t_2$? Causal dependence (*pratītyasamutpāda*). Specifically, the *ālaya-vijñāna* (storehouse consciousness) in Yogācāra (Vasubandhu's later view) or the *santana* of dharmas in the Abhidharma view.
      *   **Karma:** Karma is not a "thing" transferred but a causal potency planted in the continuum. For karma to ripen, the continuum must remain unbroken.
