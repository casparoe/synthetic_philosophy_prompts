  4.  **Evaluate Parfit's Comparison:**
      *   Parfit argues that what matters is "Relation R" (psychological continuity/connectedness). He thinks Buddhism agrees because both deny a further fact (a soul).
      *   Buddhist Critique of Parfit: Parfit allows for branching (fission). Buddhism generally requires a *unique* causal stream for karmic responsibility. If the stream branches, the karmic ledger becomes incoherent.
      *   Therefore, while both deny a *self*, they disagree on what constitutes the *continuum* that matters for ethics and soteriology.

