answer: |-
  The observation deck was silent except for the hum of the cooling units and the rhythmic *click-hiss* coming from the containment cell. Inside the cell floated the Guest. It looked like a cloud of suspended geometry, shifting shapes that defied Euclidean rules.

  "It happened again," Elias said, tapping his stylus against the glass. "Sequence 44-B. It pointed at the supernova simulation, emitted the low-frequency pulse, and then retracted its limbs."

  Dr. Aris Thorne, the mission lead, looked between Elias and Mara. "And the translation matrix?"

  "Stalled," Mara said. She didn't look up from her console. Her fingers were flying, rewriting syntax trees that dissolved as soon as they formed. "We're hitting the holism barrier."

  Elias sighed, rubbing his temples. "It's the circle. I can't assign a meaning to the pulse without knowing what the Guest *believes* about the supernova. But I can't know what it believes about the supernova without knowing what the pulse *means*."

  "Radical interpretation," Aris muttered. "You're starting from zero. No shared language, no shared culture. Just you, it, and the world."

  "Exactly," Elias said. "To break the circle, we have to step in somewhere. We have to make an assumption."

  "The Principle of Charity," Mara said, her voice tight. "Assume the speaker is rational. Assume their beliefs about the world are mostly true. Assume they see what we see."

  "Right," Elias said. "So, we look at the supernova. It's a star dying. It's releasing radiation. It's the end of a system. If we assume the Guest is rational and perceives reality like we do, it sees a death. Therefore, the pulse means *'End'* or *'Loss'*."

  Mara finally looked up. Her eyes were tired. "But that's not the only way to be charitable, Elias. Charity requires us to assume they are *right* about the world. Not just that they see what we see, but that they understand the truth of the event."

  "And?"

  "And the truth of a supernova isn't death," Mara said. "It's seeding. That explosion creates the heavy elements necessary for planets. For life. If the Guest is a high-order intelligence, it knows this. A rational being understands causality. So, if we maximize agreement with the *facts* of physics, the Guest believes this is a beginning. The pulse means *'Gift'* or *'Cycle'*."

  Elias shook his head. "You're projecting complexity. The most basic, rational response to a violent energy spike is avoidance. Self-preservation is the baseline of rationality."

  "Survival is the baseline," Mara corrected. "And survival requires elements forged in that 'violence.' To call it 'Loss' is to be irrational about the nature of matter."

  They stared at each other. The hum of the room seemed to grow louder.

  "This is the problem," Elias said, turning to Aris. "We're both using Charity. We're both assuming the Guest is rational and truthful. But my version of 'rational' prioritizes immediate structural integrity. Her version prioritizes long-term systemic viability."

  "And the meaning changes based on the belief," Aris said.

  "Exactly," Elias said. "If I'm right, the pulse is a warning. *'Danger.'* If she's right, the pulse is an invitation. *'Come closer.'*"

  "And you can't verify which belief they hold without knowing the word," Aris summarized.

  "And we can't know the word without the belief," Mara finished. "We're stuck in the triangle. Speaker, Interpreter, World. But the World is ambiguous."

  "We have to send a response," Aris said. "The Guest is waiting. It emitted the pulse, then stopped. It's expecting a handshake. If we send the wrong semantic value, we might signal irrationality. Or hostility."

  "If we send *'We understand the Danger,'*" Elias argued, "we align with the interpretation that the event is destructive. We show we value preservation. That's universal rationality."

  "If we send *'We understand the Gift,'*" Mara countered, "we align with the interpretation that the event is generative. We show we value truth over comfort. That's *higher* rationality."

  "Both cannot be true," Aris said. "The Guest cannot mean both 'Stop' and 'Go' with the same phoneme in the same context."

  "Unless their logic isn't binary," Elias suggested.

  "Then we can't interpret them at all," Mara said. "Davidson says we *must* impose our logic to interpret. If we don't assume they operate on something like non-contradiction, we can't even identify them as speakers. We have to assume they are like us enough to be understood."

  Aris looked at the console. "Time to transmission is two minutes. I need a decision. Do we translate the pulse as *'Threat'* or *'Opportunity'*?"

  Elias leaned forward. "Look at the retraction. After the pulse, it pulled back. That's a defensive posture. A rational agent signals a threat and then creates distance. If we assume Charity—that their actions match their beliefs—then they believe the supernova is dangerous. They are warning us."

  Mara shook her head. "The retraction isn't fear. It's making space. You don't plant a seed in your hand; you put it in the ground. They pulled back to let the energy pass. If we assume Charity—that their actions are optimal for their goals—they believe the supernova is fuel. They are offering us a turn."

  "Both explanations fit the data," Aris said quietly. "Both assume the Guest is rational. Both assume the Guest is telling the truth about the physics."

  "But they result in opposite actions," Elias said. "If I'm right, we shield the ship. If she's right, we open the collectors."

  "And if we shield," Mara said, "we insult a benefactor."

  "And if we collect," Elias said, "we fly into radiation."

  Aris looked at the Guest. The geometric cloud had stilled. It was waiting. The silence stretched, heavy with the weight of the circle. The meaning of the alien's sound depended on the alien's mind, but the alien's mind was only accessible through the sound. The only key was the assumption of shared truth.

  But the humans didn't share a truth.

  "Elias," Aris said. "Your interpretation relies on the belief that pain is to be avoided."

  "Universal," Elias said.

  "Mara," Aris said. "Yours relies on the belief that growth is to be pursued, even at cost."

  "Universal," Mara said.

  Aris typed a command. "We can't send both. But we don't have to choose one."

  "What are you doing?" Elias asked.

  "We're not translating the word," Aris said. "We're translating the *Charity*."

  He initiated the broadcast. The ship didn't send a word for *'Danger'* or *'Gift.'* It sent a mathematical proof. It sent the ratio of the supernova's mass to its energy output, followed by a variable for *'Uncertainty.'*

  "It's acknowledging the event without assigning value," Mara said, realizing.

  "It's saying, *'We see what you see, but we don't know what you believe,'*" Elias added.

  "Is that rational?" Aris asked.

  "It's the only honest interpretation," Mara said. "We can't break the circle without lying about what we think is true."

  Inside the cell, the Guest shifted. The geometry unfolded, spinning faster. It emitted the pulse again. *Click-hiss.*

  Then, it did something new. It pointed. Not at the simulation. Not at itself.

  It pointed at Elias. Then at Mara.

  "It's triangulating," Elias whispered. "It sees the disagreement."

  "It's checking the World," Mara said. "It sees two interpreters who share a language but don't share a belief."

  The Guest pulsed a third time. A different frequency. Higher.

  "What does that mean?" Aris asked.

  Elias and Mara looked at the readouts. The data was identical. The context was identical. But the circle tightened around them.

  "I think," Elias said slowly, "it means *'Observer.'*"

  "No," Mara said. "It means *'Variable.'*"

  They looked at each other. The tension wasn't about the alien anymore. It was about the fact that to understand the alien, they had to agree on what was real. And they didn't.

  "It doesn't matter," Aris said, watching the energy levels in the cell rise. "Because now it knows we aren't a single mind."

  "Is that bad?" Elias asked.

  "Davidson says interpretation requires a shared world," Mara said, her voice barely audible. "If we can't agree on the world... can it interpret us?"

  The Guest stopped moving. The hum of the cooling units vanished, silenced by a sudden, absolute pressure in the room. The geometry collapsed into a single, perfect point of light.

  "It's not trying to talk to us anymore," Elias said.

  "Why?"

  "Because we failed the Charity test," Mara said. "We couldn't assume the other was right. So it assumes we aren't rational."

  "Or," Elias said, watching the point of light fade into darkness, "it assumes we're two different species."

  The screen went black. The connection was severed. Not by a weapon, but by a conclusion. The alien had solved the equation, and the sum was zero.

  Aris sat back in the silence. "So. What do we report?"

  Elias looked at the dark glass. "That we met them."

  Mara looked at her console, where the translation tree still hung unfinished, a bridge leading nowhere. "And that we couldn't agree on what we met."

  "The belief or the meaning?" Aris asked.

  "Both," they said together.

  And for the first time, they sounded like they meant the same thing.
