          *   Apply to AD: Yes, global sum allows trade-offs.
          *   Apply to DB: DB also bundles bets. But the *norm* is different. DB is about avoiding a specific vulnerability in the *system*.
          *   Crucial Difference: DB is about *inconsistency* (logical flaw in the set). AD is about *suboptimality* (there's a better state). Berker's worry is about *reasons for belief*.
          *   Verdict: AD is more vulnerable here because it treats epistemic rationality as maximization. DB treats it as constraint satisfaction.
      *   *Section 3: Overall Assessment.*
