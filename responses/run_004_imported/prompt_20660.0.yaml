      *   *Check:* Did I handle Berker correctly? *Adjustment:* Berker's "Epistemic Consequentialism" paper is the key reference. Ensure I distinguish between *holism* (which both have) and *consequentialist trade-offs* (which is specific to the optimization structure of AD). DB is about avoiding a guaranteed loss, not maximizing gain. This is a deontological constraint vs. teleological optimization distinction.
