          *   Recommendation: AD is the current leader for *epistemic* probabilism, but it hasn't fully "superseded" DB because DB handles the action-link better.
          *   Suggestion: Look at "Hybrid" arguments or the role of *representation theorems*.
      *   *Tone:* Academic, rigorous, respectful of the graduate level.

