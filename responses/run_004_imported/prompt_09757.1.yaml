answer: |-
  **MEMORANDUM**

  **TO:** The Honorary Degrees Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Nomination of Air Vice-Marshal Gerald Whitfield

  **Recommendation:** That the Committee **decline** to confer an honorary degree upon Air Vice-Marshal Gerald Whitfield at this time.

  **Rationale**

  The nomination of Air Vice-Marshal Whitfield presents a profound ethical dilemma that strikes at the core of what this University signifies when it confers honor. On one hand, we recognize a man who dedicated forty post-war years to aviation safety, undoubtedly preserving lives and advancing engineering standards. On the other, we confront a three-year period during which he executed a strategy of area bombing that intentionally targeted civilian populations.

  To reach a verdict, we must engage directly with the moral objection raised by the circulation of Elizabeth Anscombe's *Mr. Truman's Degree*. We cannot treat Anscombe's argument as merely a historical footnote or a veto based on modern sensibilities. Her position is not that Whitfield broke the laws of his time, nor that his later life lacks merit. Her argument is deontological and absolute: certain acts are intrinsically impermissible, regardless of their consequences or the authority that commands them.

  **The Anscombe Objection**
  Anscombe's protest against Oxford honoring Truman rested on the premise that the intentional killing of the innocent is murder, and that utility cannot sanitize it. She argued that if an act is morally forbidden, doing it precludes one from being honored for one's public standing, because the honor implies institutional complicity or moral approval.

  Applied to Air Vice-Marshal Whitfield, the Area Bombing Directive was not merely "collateral damage." Its explicit aim was to break enemy morale through the destruction of homes and the terrorizing of populations. Under Anscombe's framework, Whitfield was not merely fighting combatants; he was using the deaths of non-combatants as a *means* to victory. If we accept the premise that the innocent possess a right to life that cannot be traded for strategic gain, then Whitfield's command during those years constitutes a grave moral injury. To award him a degree is to assert that the University considers this moral injury compatible with the values we wish to embody. It suggests that the ends (victory, or later, safety advocacy) can justify the means (the targeting of civilians).

  **The Case for Award (and its Limits)**
  The arguments in favor of Whitfield are substantial and must be taken in their strongest form. We are not sitting as a war crimes tribunal; we are assessing a lifetime.

  First, there is the argument of **context and necessity**. In 1942, Britain stood alone against a tyrannical regime. The Area Bombing Directive was lawful state policy, deemed by leadership as a tragic necessity to avert a costlier invasion or a prolonged conflict. Whitfield was a soldier obeying orders within a chain of command where refusal was not a viable option. To judge him by the standards of the 1977 Geneva Protocols is anachronistic; even by the standards of the time, this was "total war," where the distinction between combatant and civilian had already been eroded by the enemy.

  Second, there is the argument of **redemption and contribution**. Whitfield is not being nominated for his bombing record, but for his four decades of work in aviation safety. This was not passive retirement; it was active atonement. He dedicated his post-war life to the preservation of life, arguably saving more people through safety regulations than were lost under his command. To deny the degree is to suggest that moral stains are indelible, that a human being cannot transcend their worst actions, and that the last 40 years of benevolent service count for nothing against the 3 years of warfare.

  **Why the Objection Prevails**
  While the arguments for context and redemption are humane, they do not overcome the specific function of an *Honorary* Degree.

  Regarding **context**: Anscombe's argument does not rely on the illegality of the act, but its immorality. Even if lawful, even if necessary for survival, she contends that the intentional slaughter of innocents remains a moral evil. A University is not the State. The State may dirty its hands to survive; the University's role is to uphold the integrity of truth and ethics. If we accept that "necessity" justifies targeting civilians, we erode a principle that protects the innocent in all future conflicts. We cannot honor a man for a war effort that relied on a principle we now explicitly reject as a crime against humanity, without creating a moral contradiction in our own charter.

  Regarding **redemption**: We must distinguish between *forgiveness* and *honor*. We may acknowledge Whitfield's later contributions with gratitude; we may even forgive him as a fallible human acting under duress. But an honorary degree is not a pardon; it is an endorsement. It holds the recipient up as a model. To honor him is to signal that the University weighs the *outcome* of a life heavier than the *moral quality* of its constituent acts. If we award the degree, we validate the consequentialist view that good works can offset the intentional killing of innocents. Anscombe warns us that this calculus is dangerous. It implies that if the safety foundation had been successful enough, the bombing would be morally negligible. It is not.

  **Conclusion**
  Air Vice-Marshal Whitfield is undoubtedly a complex figure who served his country and later served humanity. However, the University must be cautious about what it chooses to celebrate. By declining this nomination, we do not condemn Whitfield to infamy, nor do we erase his contributions to aviation safety. Rather, we uphold a boundary. We acknowledge that there are acts which, even in war, even under orders, and even when followed by a life of service, remain incompatible with the highest honors an academic institution can bestow.

  We honor the safety advocate by acknowledging his work; we honor the moral law by declining the degree.

  **Verdict:** Decline.
