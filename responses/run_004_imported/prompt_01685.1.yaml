answer: |-
  It is completely normal to find Taurek's "Should the Numbers Count?" (1977) difficult. It is a dense, provocative paper that attacks a very deep-seated moral intuition (that we must save the greater number). The confusion you are feeling regarding the "David" example and the "impersonal judgments" section is actually the key to unlocking his whole argument.

  Taurek is trying to dismantle the idea that morality is a math problem. Here is a breakdown of the three specific points you raised, and how they fit together.

  ### 1. Personal Preference vs. Moral Obligation (The David Case)

  You asked what Taurek is trying to establish with the distinction between personal preference and moral obligation in the David example.

  **The Standard View (The Opponent):**
  Most people think: "In a vacuum, you must save the five. However, if one of them is your friend (David), your *personal preference* for David might be strong enough to *override* that moral obligation." In this view, the obligation to save the five exists first, and friendship is an exception that fights against it.

  **Taurek's Move:**
  Taurek is not arguing that preference *overrides* obligation. He is arguing that **there is no obligation to override in the first place.**

  When he writes (on pp. 296–297) that *"it is not clear to me how it is to make a difference in the view of those who think that, apart from it, I would have a moral obligation to save the five,"* he is being dialectical. He is saying:
  > "My opponents claim that without friendship, I am obligated to save the five. They think friendship is a special 'get out of jail free' card. But I don't see why the number 'five' creates an obligation even without the friendship factor."

  **The Takeaway:**
  Taurek uses the David case to show that we already accept **agent-relative reasons** (reasons specific to *me*, like "he is my friend") as valid moral reasons. If we accept that I can save David because he is my friend, we have already admitted that "saving the greater number" is not an absolute, trumping rule. He is using the David case to crack the door open on the absolute authority of numbers.

  ### 2. Rejecting "Impersonal Evaluative Judgments"

  You asked what he means by rejecting impersonal judgments (pp. 304–305) and why.

  **What is an Impersonal Evaluative Judgment?**
  This is the "God's Eye View." It is the claim that: *"From nowhere in particular, it is objectively worse for five people to die than for one person to die."* It assumes there is a cosmic scale where we can pile up "units of loss" and weigh them.

  **Why Taurek Rejects It:**
  Taurek argues that **loss is not aggregable.**
  *   If David dies, David suffers a 100% loss.
  *   If the five strangers die, *each* of them suffers a 100% loss.
  *   But there is no "super-person" who suffers a 500% loss.

  Taurek believes that morality is about the relationship between individuals. To say "5 deaths is worse than 1" implies we can treat people as containers of value that can be summed up. Taurek thinks this violates the **separateness of persons.** Each person is a distinct universe of experience. You cannot add my pain to your pain to get "more pain" in a moral sense that obligates a third party.

  **The Connection to David:**
  If you reject impersonal judgments, you reject the idea that the universe cares more about the five. If the universe doesn't care more about the five, then *I* don't have to care more about the five—unless I have a specific reason to (like friendship).

  ### 3. How the David Example Fits the Larger Argument

  You asked about the logical move here. How does saving a friend prove that numbers shouldn't count among strangers?

  Taurek's argument structure works like this:

  1.  **The Intuition Pump:** Most people agree that if one of the people is your friend (David), it is permissible to save him over five strangers.
  2.  **The Implication:** If it is permissible to save the one (David) over the five, then the principle "Always save the greater number" is **false** (or at least not absolute).
  3.  **The Radical Extension:** If the principle "Always save the greater number" is false in the David case *because numbers don't create obligations*, then why would numbers create obligations in the case of strangers?
      *   If you say, "Numbers count for strangers but not for friends," Taurek asks: **Why?** What is the magic about strangers that makes them subject to a mathematical calculus that friends are exempt from?
  4.  **The Conclusion:** Since there is no good reason to treat strangers differently regarding the "counting" logic, the logic must be rejected entirely.

  **The Logical Move:**
  The David example is a **wedge argument**.
  *   **Step 1:** Use the David case to show that personal ties can justify saving the fewer number.
  *   **Step 2:** Argue that the *only* reason to save the greater number is the "impersonal judgment" that more death is worse.
  *   **Step 3:** Show (in the later section) that "impersonal judgments" are incoherent because loss is individual.
  *   **Step 4:** Therefore, even with strangers, you are not obligated to save the five. (Taurek famously suggests flipping a coin in the stranger case to give everyone an equal chance, rather than sacrificing the one for the five).

  ### Resolving Your Specific Confusion (pp. 296 vs. pp. 304)

  You mentioned feeling a tension between these two sections. Here is how they fit:

  *   **On pp. 296–297 (David):** Taurek is speaking *conditionally*. He is saying, "Even if you *think* there is an obligation to save the five, surely you admit friendship changes things?" He is exposing that his opponents' moral theory is too rigid to account for basic human relationships.
  *   **On pp. 304–305 (Impersonal Judgments):** Taurek is speaking *assertively*. He is stating his own metaphysical view: "There is no fact of the matter that 5 deaths is worse than 1."

  **They fit together like this:**
  The David case shows that **we don't need** impersonal judgments to make moral decisions (we can use personal ties). The section on impersonal judgments explains **why we shouldn't** use them (because they are philosophically incoherent).

  Together, they clear the ground for Taurek's final conclusion: Since there is no impersonal obligation to save the five, and personal ties are valid reasons, the default position when you have no ties to anyone is not "Save the Five," but "Give everyone an equal chance" (e.g., flip a coin).

  ### Summary for Your Class
  If you need to summarize this in class or on a paper, you could say:
  > Taurek uses the 'David' example to demonstrate that agent-relative reasons (friendship) are morally valid, which undermines the absolute authority of aggregating numbers. He then reinforces this by arguing that 'impersonal evaluative judgments' are incoherent because loss is experienced individually, not collectively. Therefore, the number of people saved does not generate a moral obligation in itself.

  It is a tough paper because it asks you to give up a very useful heuristic (save the most people!). But his point is that ethics is about how we treat *individuals*, not how we manage *statistics*.
