answer: |-
  This is a crucial distinction for any serious intellectual history of the Scientific Revolution. Kepler's astrology was not a residual superstition but a coherent extension of his physics and metaphysics. He sought to purge astrology of what he considered "Arabical superstitions" and Ptolemaic arbitrariness, rebuilding it on what he called "certioribus fundamentis" (more certain foundations).

  To capture this nuance, the clearest contrast lies in his treatment of **Planetary Aspects** (which he defended) versus **Zodiacal Sign Rulerships** (which he dismissed).

  ### The Defended Technique: Planetary Aspects (Specifically the Trine)

  **The Technique:** Predicting earthly effects based on the geometric angle formed between two planets as viewed from Earth (e.g., a 120° angle, or *trine*).

  **Kepler's Defense:**
  For Kepler, aspects were not symbolic; they were physical and ontological realities rooted in universal harmony. In *De Fundamentis Astrologiae Certioribus* (1601) and later in *Harmonices Mundi* (1619), he argues that the Earth possesses a *anima terrae* (a soul or faculty of perception). This terrestrial soul is sensitive to geometry.

  When planets align to form specific angles (conjunction, sextile, square, trine, opposition), they create a configuration that corresponds to the consonant intervals of music and the regular polyhedra of geometry. For example, the **Trine (120°)** corresponds to the division of the circle by three, which relates to the triangle and the musical major third.

  Kepler argued that this geometric configuration acts upon the Earth's soul not through material rays (like gravity or heat, which he knew diminished with distance), but through a "species" of light or form. The Earth's soul perceives this harmony and reacts physically, much like a human ear reacts to a consonant chord. This reaction manifests as changes in the weather (the primary physical effect) and subsequently in the human bodily humors (which are tied to the elements). Therefore, a prediction based on a Trine is defensible because it relies on an archetypal geometric cause that the Earth is physically constituted to perceive.

  ### The Dismissed Technique: Zodiacal Sign Rulerships (The "Domiciles")

  **The Technique:** The traditional doctrine that specific planets "rule" specific zodiac signs (e.g., Mars rules Aries, Venus rules Taurus) and that a planet's power is amplified or diminished depending on which constellation it is passing through.

  **Kepler's Dismissal:**
  Kepler rejected this as groundless tradition without physical mechanism. He argued that the twelve signs of the zodiac are arbitrary human divisions imposed upon the continuous circle of the ecliptic. The constellations themselves are mere chance groupings of fixed stars at immeasurable distances; they possess no physical agency to alter the nature of a planet passing in front of them.

  In his view, saying "Mars is strong in Aries" is akin to saying "a man's temperament changes because he is walking past a particular painting on a wall." The backdrop does not alter the actor. Kepler pointed out that the boundaries of the signs had shifted due to the precession of the equinoxes, yet astrologers continued to use the tropical zodiac (based on seasons) while claiming it was the sidereal zodiac (based on stars). To Kepler, this inconsistency proved the signs were not physical causes. If the influence came from the stars of Aries, shifting the coordinate system shouldn't matter. If the influence comes from the geometry of the seasons (which he was more sympathetic to), the traditional mythological rulerships (Mars = War = Ram) were still poetic fictions, not efficient causes.

  ### The Theoretical Separation: Geometry vs. Poetry

  The line separating these two techniques in Kepler's mind was the distinction between **efficient causes rooted in universal archetypes** versus **arbitrary human symbolism.**

  1.  **Universal vs. Local:** Aspects are universal. A 120° angle is the same anywhere in the universe and exists independently of human naming conventions. Zodiacal rulerships are local, cultural, and mythological constructs.
  2.  **Perception vs. Emission:** Kepler's physics of astrology relies on the *Earth's perception* of light and geometry. The planets do not "send" war or love; they form a shape that the Earth's soul "reads" as harmonious or discordant. The zodiac signs cannot be "read" in this way because they do not form a dynamic geometric relationship with the Earth; they are a static grid.
  3.  **Probability vs. Determinism:** Even with aspects, Kepler was cautious. He believed the aspects inclined the weather and the humors (the "complexion"), which in turn inclined human behavior, but they did not determine specific events. Traditional rulership astrology often claimed specific fatalistic outcomes (e.g., "Mars in Aries guarantees a battle"). Kepler dismissed this as superstition that ignored free will and the complexity of secondary causes.

  ### Summary for Your Piece

  You can frame this as Kepler attempting to turn astrology into a branch of **terrestrial physics**. He kept the horoscope not because he believed the stars dictated fate, but because he believed the planetary geometry physically stimulated the Earth's atmosphere and biology.

  *   **He kept the Aspects** because they were **Harmonic Geometry** (accessible to the *Anima Terrae*).
  *   **He discarded the Rulerships** because they were **Mythological Poetry** (inaccessible to physical causation).

  This allows you to present him not as a scientist who failed to escape superstition, but as a reformer who tried to strip magic down to what he considered its mathematical bones, discarding the flesh of tradition that didn't fit his ontology.
