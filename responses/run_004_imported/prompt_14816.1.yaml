      *   *Key Text:* *De Fundamentis Astrologiae Certioribus*.
      *   *Nuance:* Kepler didn't throw out the zodiac entirely for *location* (you need a coordinate system), but he denied its *causal power*.

  6.  **Developing the Concrete Example:**
      *   *Defended:* The **Trine (120°)**. Why? It corresponds to the major third in music (4:5 ratio roughly, or 3:1 in circular division) and the triangle/tetrahedron. It creates a "flowing" harmony.
