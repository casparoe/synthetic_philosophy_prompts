      *   *Key Works:* *De Fundamentis Astrologiae Certioribus* (On the More Certain Foundations of Astrology, 1601) is the primary text for this. Also *Harmonices Mundi* (The Harmony of the World, 1619).
      *   *The "Physical" Basis:* Kepler rejected the idea that stars *emit* influences based on their mythological meanings or arbitrary zodiacal divisions. He believed influence came from *aspects* (geometric angles between planets) affecting the Earth's soul/geometry.
      *   *Defended:* Planetary Aspects (specifically the "Ptolemaic" ones like conjunction, sextile, square, trine, opposition) because they correspond to harmonic ratios and geometric figures inscribable in a circle.
