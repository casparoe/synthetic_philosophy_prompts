  4.  **Drafting the Explanation (Kepler's Terms):**
      *   *Why Aspects?* For Kepler, the Earth has a soul (*anima terrae*). It perceives geometry. When planets form specific angles (60°, 90°, 120°), these correspond to musical harmonies (consonances) and regular polyhedra. This creates a physical vibration or stimulation in the Earth's soul, which then affects the weather and human temperaments (which are tied to the elements within the body).
      *   *Why not Signs?* The zodiac constellations are arbitrary human inventions. The stars are too far away to physically affect us individually. The "fire/earth/air/water" triplicities are not physical realities in the sky. The influence comes from the *relationship between planets* as seen from Earth, not the backdrop of fixed stars.

