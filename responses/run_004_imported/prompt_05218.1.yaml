answer: |-
  Your intuition is correct: your colleague's confidence is **not warranted**. While her reasoning sounds systematic, the method relies on two fundamental misunderstandings: one about the nature of language, and one about the nature of trust.

  This technique is known as **back-translation**. While it has niche uses in specific fields (like validating survey questions in clinical trials), using it as a general proof of translation accuracy—especially for a client who cannot read the source language—is logically flawed.

  Here is a breakdown of exactly what has gone wrong in her reasoning.

  ### 1. The Linguistic Flaw: Translation is Not a Reversible Function
  Your colleague is treating language like a mathematical code where $A \rightarrow B \rightarrow A$. If the final $A$ matches the original $A$, she assumes the process was accurate. However, human languages are not isomorphic; they do not map onto each other perfectly.

  *   **Good translation often requires divergence.** To translate well, one must often change the structure, idioms, or even the literal wording of the source to preserve the *meaning* and *tone* in the target language.
      *   *Example:* If the source text is a French idiom meaning "It is raining heavily" (*Il pleut des cordes* / "It is raining ropes"), a good English translation is "It is raining cats and dogs."
      *   If she translates that back into French, she might get *Il pleut des chats et des chiens*, which is nonsense in French.
      *   If she forces the back-translation to match the original (*Il pleut des cordes*), she proves only that she can reverse her own steps, not that the English version was natural or accurate.
  *   **The "Perfect Match" Trap:** Paradoxically, if the back-translated text matches the original source text *too* closely, it is often evidence that the intermediate translation was **too literal**. A translation that adheres so strictly to the source structure that it survives a round-trip intact is often stiff, awkward, or "translationese" in the target language.

  ### 2. The Epistemological Flaw: The Client Cannot Verify the Premise
  This is the most critical logical error regarding her specific client base. You noted that she uses this to reassure **clients who cannot read the source language.**

  *   **The Verification Gap:** She presents two texts in the source language (the original and the back-translation) and claims they match. Since the client cannot read that language, they cannot verify the match themselves.
  *   **Circular Trust:** The client is hiring her because they lack the expertise to judge the source language. By asking them to accept her assertion that "Source Text A matches Source Text B," she is asking them to trust her judgment on the source language.
      *   If they trust her judgment enough to believe the two source texts match, they should trust her judgment enough to believe the English translation is accurate.
      *   If they *don't* trust her judgment on the source texts, the comparison is useless.
      *   Therefore, the procedure adds no new evidence; it merely creates a placebo of scientific rigor.

  ### 3. The Bias Flaw: She Controls Both Variables
  In scientific testing, you cannot grade your own homework.
  *   **Unconscious Bias:** When translating the English version back into the source language, she knows what the original source text said. It is psychologically almost impossible not to unconsciously steer the back-translation toward the original wording, even if the English version drifted slightly in meaning.
  *   **Intentional Manipulation:** In a worst-case scenario, if she made a mistake in the first translation, she can "fix" it during the back-translation stage to make the source texts align, hiding the error from the client.
  *   **Standard Practice:** In the few industries where back-translation is valid (e.g., medical or legal), the back-translation is **always performed by a different, independent translator** who has not seen the original source text. This prevents the "memory contamination" that renders your colleague's method invalid.

  ### Summary of the Error
  Your colleague is committing a category error. She is trying to solve a problem of **trust and semantics** with a procedure of **syntax and pattern matching.**

  *   **Her Logic:** "If the round-trip matches, the meaning was preserved."
  *   **The Reality:** "If the round-trip matches, the wording was preserved, but the meaning may have been lost, and the client has no way to know."

  ### How to Advise Her
  You might suggest that while her desire to demonstrate quality is commendable, this method could actually damage her reputation if a knowledgeable third party ever reviews her work. They would see the round-trip matches as a sign of overly literal translation or methodological naivety.

  Better ways to build trust with monolingual clients include:
  1.  **Samples/Portfolios:** Showing previous work (if confidentiality allows).
  2.  **Certifications:** Membership in professional bodies (like the ATA in the US or CIOL in the UK).
  3.  **Third-Party Review:** Offering to have a portion of the work reviewed by another independent translator at her expense.
  4.  **Explanatory Notes:** Providing a brief translator's note explaining *why* certain difficult phrases were translated the way they were, demonstrating her reasoning process rather than a mechanical check.

  In short: Her method creates an illusion of accuracy without the substance. Your skepticism is well-founded.
