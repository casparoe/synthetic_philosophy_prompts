      *(Final Polish on the "Hardening" aspect)*: I shouldn't promise cold baths. I should promise not to fear her tears. That's the modern equivalent of Locke's hardening.

      *(Final Polish on the "Will")*: "Bend to reason" is the phrase. I'll use that.

