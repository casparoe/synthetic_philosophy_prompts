      *   Keep it under 4 minutes (approx. 500-600 words).

      *(Self-Correction during drafting)*: I need to be careful not to alienate the grandmothers. Instead of saying "I won't shield her," say "I promise to equip her." Instead of "no sweets," say "love won't be transactional."

      *(Refining the Locke Friend signal)*: Mention the specific tension between the "enlightened" and "severe" aspects. That shows I actually read it.

  8.  **Final Review against constraints:**
