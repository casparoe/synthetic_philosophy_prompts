answer: |-
  **MEMORANDUM**

  **TO:** All Newsroom Staff
  **FROM:** Editorial Standards Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Guidance on Causal Language Regarding Race and Outcomes

  **Purpose**
  Reporters frequently cover studies examining disparities in health, finance, and justice based on race. A debate exists within the committee regarding when it is scientifically accurate to use causal language (e.g., "causes," "leads to," "effects") versus associational language (e.g., "linked to," "associated with," "disparities in"). This memo establishes a standard to ensure our reporting is both scientifically rigorous and clear about the nature of inequality.

  **The Guideline**
  Effective immediately, reporters should adhere to the following distinction when covering observational studies:

  1.  **Self-Identified Race (Observational Data):** When a study relies on statistical adjustments of self-identified race (e.g., medical records, loan databases, sentencing logs), **do not use causal verbs.** Race is a social category, not a manipulable biological variable. We cannot isolate "race" from the lifetime of exposures, treatments, and structural factors that accompany it.
      *   *Use:* "Associated with," "correlated with," "disparities in," "predicts."
  2.  **Perceived Race or Specific Mechanisms (Experimental/Quasi-Experimental):** When a study manipulates a specific variable (e.g., audit studies sending identical resumes with different names) or isolates a concrete structural mechanism (e.g., proximity to pollution zoned by historical redlining), **causal language is permitted.**
      *   *Use:* "Caused," "resulted in," "the effect of discrimination."

  **The Reasoning**
  This standard rests on the "counterfactual" test used in causal inference. To say $A$ causes $B$, we must be able to imagine a scenario where $A$ changes while everything else remains fixed. We can imagine a smoker becoming a non-smoker. We cannot imagine a Black person becoming a White person while holding their income, neighborhood, upbringing, and treatment by others constant. Therefore, in observational data, race acts as a *marker* for exposure to racism, not the biological *cause* of the outcome.

  **Addressing the Strongest Objection**
  The most significant objection to this rule comes from colleagues who argue that restricting causal language minimizes the reality of discrimination. They contend that saying race is merely "associated with" loan denial sounds like a neutral natural phenomenon, whereas saying racism "causes" loan denial accurately assigns blame. There is a risk that strict adherence to this rule could inadvertently sanitize systemic injustice.

  We reject the conclusion but accept the warning. Precision is not minimization. Stating that "Black race causes higher maternal mortality" is scientifically vulnerable to claims of biological essentialism. Stating that "racial bias in healthcare and structural inequities cause higher maternal mortality among Black women" is scientifically robust and morally clearer.

  This rule forces reporters to name the *mechanism* of harm. If a study shows a disparity, our job is to report *why* that disparity exists (e.g., provider bias, wealth gaps, environmental stress), rather than implying the category of race itself is the pathogen. We should not shy away from causal claims about **racism**, even if we avoid them regarding **race**.

  **Examples for Application**

  *   **Incorrect:** "Being Black causes higher interest rates on mortgages." (Implies intrinsic trait).
  *   **Correct:** "Black applicants are offered higher interest rates than White applicants with similar credit profiles." (Describes the disparity).
  *   **Correct (Audit Study):** "Resumes with Black-sounding names caused a 50% reduction in callbacks." (Describes the manipulation of perception).
  *   **Correct (Structural):** "Historical redlining policies caused long-term wealth gaps in these neighborhoods." (Describes the specific mechanism).

  **Implementation**
  This guidance applies to all stories filed after November 1. Editors should flag causal claims regarding race during the copy desk review and work with reporters to identify the specific structural mechanism if a stronger claim is warranted.

  **[Signature]**
  Editorial Standards Committee
