  3.  **Keynes vs. Bayesianism (The Philosophical Clash):**
      *   *Keynes (Treatise):* Probability is a logical relation between propositions and evidence ($a/h$). It's objective (in a logical sense), not necessarily subjective belief. It's not always numeric.
      *   *Aumann/Harsanyi:* Probability is subjective degree of belief (Ramsey/de Finetti style). It must be numeric (to satisfy Dutch Book arguments).
