      *   Keynes: Trade happens because of *uncertainty* and liquidity preference, not just information asymmetry. We trade because we don't know the future, not because I know $X$ and you know $Y$.
      *   Beauty Contest: It's about guessing conventions, not converging on truth.

  6.  **Synthesizing the Response:**
