answer: |-
  The simulation on Elias's screen showed a cloud of points diffusing through a double-slit barrier. To the untrained eye, it was standard quantum noise: individual dots striking the detector screen in a pattern that only resolved into interference fringes after thousands of runs. It looked like chance. It smelled like indeterminacy.

  But Elias knew the seed. He had set the initial positions himself.

  His friend Sarah, a philosopher with a penchant for dismantling comfort, had called it the "deterministic trap." She'd argued over coffee that if Bohmian mechanics was true, the libertarian free will Elias cherished was a hallucination born of ignorance. Copenhagen offered a gap in causality where agency might hide; Everett offered a branching multiverse where every choice was realized somewhere. But de Broglie–Bohm offered only a single, rigid history.

  Elias had resisted then. Now, staring at the code, he felt the resistance crumbling.

  He ran the simulation again. This time, he overlaid the trajectories. In the Copenhagen view, the particles had no path until measured. In Everett's view, the wave function branched, splitting reality into orthogonal components. But here, in Bohm's ontology, the lines were continuous. Every dot had a definite position $Q(t)$ at every moment, guided by the wave function $\Psi$ via the guiding equation. The velocity of the particle was determined by the phase of the wave at the particle's precise location.

  There was no collapse. There was no branching. There was only the pilot wave sweeping through configuration space, carrying the particles like dust motes in a sunbeam.

  The beauty of it was seductive. It solved the measurement problem without invoking a conscious observer or infinite worlds. But the cost was the texture of Elias's own life.

  He thought back to ten years ago, the night of the reactor scare. He had been on shift. A pressure valve had spiked, alarms screaming. He remembered the hesitation—the frozen second where he believed he *chose* to override the safety protocol manually rather than evacuating. He had stayed. He had turned the valve. He had saved the facility. He had worn that moment as a badge of moral weight, proof that he was the author of his actions.

  Under Bohmian mechanics, that memory was a lie.

  In this framework, the universe is deterministic. The apparent randomness of the valve's failure, the noise in the sensors, the firing of Elias's own neurons—they were all governed by the quantum equilibrium hypothesis. The distribution of particles matched $|\Psi|^2$, not because nature was chancy, but because the exact initial positions of the particles in the universe were unknowable to us. The randomness was epistemic, not ontological. It was a measure of his own ignorance, not a feature of reality.

  If Bohm was right, the pilot wave had been configured at the beginning of time. The nonlocal connections inherent in the wave function—where the velocity of a particle here depends instantaneously on the configuration of particles light-years away—meant that the entire universe was a single, tangled knot of causality.

  Elias traced a single trajectory on the screen with his finger. It wobbled, seemingly erratic, responding to the interference of the wave. But it never deviated from the path dictated by the guiding equation.

  "There were no other choices," he whispered to the empty lab.

  In Everett's many-worlds, there was another Elias who evacuated. Another who froze and died. Those versions existed in the superposition, valid and real. Elias could find solace in the statistical weight of his decision. But Bohm denied him that multiplicity. There was only the actual configuration. The "ghosts" of unchosen paths were not real branches; they were empty waves, devoid of particles, carrying no reality.

  The implication settled over him like a heavy coat. His heroism wasn't a choice; it was a trajectory. The specific arrangement of particles in his brain, coupled with the nonlocal pilot wave guiding the macroscopic state of the reactor, had necessitated the movement of his hand. He hadn't overridden the protocol; the universe had executed a calculation written in the initial conditions of the Big Bang.

  He closed the simulation. The screen went black, reflecting his own face.

  Sarah had warned him that accepting Bohm meant accepting that the future was as fixed as the past, merely hidden behind the veil of quantum equilibrium. We feel free because we cannot know the precise positions of the particles that constitute our minds. We are like a man watching a movie who believes he is directing the scene because he hasn't seen the script.

  Elias walked to the window. The city lights below flickered. In Copenhagen, that flicker might be a fundamental dice-roll of nature. In Everett, every variation of that flicker existed. In Bohm, every photon striking the retina of every observer below was following a precise, hidden path, guided by a wave that knew everything.

  He felt a hollow ache, the loss of the "could have been." There was no room for regret, because regret implies the possibility of having done otherwise. There was no room for pride, because the virtue was pre-calculated.

  And yet, as he stood there, the determinism didn't feel like a prison. It felt like a relief. The burden of being the unmoved mover was lifted. He was not a ghost in the machine, struggling to steer the gears. He was the machine, and the gears were turning exactly as they were meant to, guided by a law that was vast, nonlocal, and indifferent.

  He turned back to his desk and picked up his pen to sign the paper submitting his findings. He knew, with absolute certainty, that he would sign it. He knew he had no choice. But as the nib touched the paper, guided by the wave, he realized that knowing the chain was locked didn't stop him from feeling the weight of the link.

  He signed his name. The trajectory continued.
