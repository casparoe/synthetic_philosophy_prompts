answer: |-
  The ice in Tomas's whiskey had long since surrendered, diluting the amber liquid into something pale and tired. Outside the hotel bar, the blizzard was swallowing the conference center whole, but inside, the only thing freezing was the air between them.

  "It's a parlor trick, Neda," Tomas said, swirling the glass. "A very elegant, eleventh-century parlor trick. You ask me to imagine I have no body, I say 'okay,' and you shout 'Aha! Therefore you aren't your body!' It's legerdemain."

  Neda didn't touch her wine. She was watching him the way a hawk watches a field mouse that thinks it's hidden. "It's not about what you can imagine, Tomas. It's about what you cannot doubt. If the Flying Man affirms his *wujūd*—his existence—while remaining ignorant of his limbs, his organs, his brain... then that existence isn't dependent on those things."

  "Conceivability does not entail possibility," Tomas shot back, reciting the line like a shield. He'd used it against her in grad school; he knew she hated it. "I can conceive of water not being H2O. That doesn't make it metaphysically possible. Just because your neural architecture allows you to simulate a disembodied state doesn't mean a disembodied state is real. It just means your simulation software is good."

  "My simulation software?" Neda leaned in, the light catching the sharp line of her jaw. "You're reducing the witness to the witnessed. Avicenna isn't asking you to simulate a bodyless state. He's asking you to attend to the *presence* that remains when the body falls away from attention."

  "But that's the cheat!" Tomas slammed the glass down, just hard enough to make the ice clink. "You're presupposing the very thing you're trying to prove. You say 'the man would know he exists.' Who is the 'he'? You've already smuggled a unified subject into the void. If I'm right, if the self is just the integrated output of sensory processing, then you cut the inputs, you don't get a ghost. You get nothing. There's no one left to do the knowing."

  Neda smiled, a thin, dangerous expression. "So, when I feel pain, Tomas, there is no one feeling it? There is just a C-fiber firing and a narrative constructed post-hoc?"

  "There is a system monitoring itself. No homunculus required."

  "Then who is arguing with me?" Neda tapped her chest, right over the sternum. "The argument hurts. The frustration is immediate. You don't infer your irritation from your cortisol levels. You know it before the biology. That immediacy is the Flying Man. It's the one thing you can't reduce without erasing the evidence you're using to reduce it."

  Tomas rubbed his temples. He looked exhausted, the kind of tired that comes from fighting a war on a front that doesn't exist. "It's a user illusion, Neda. The desktop icon isn't the file. Just because the interface feels seamless doesn't mean there's a little man inside the computer."

  "But the interface *is* the reality we live in," she countered softly. "You spend your life mapping the hardware, insisting the icon is a lie. But if you smash the monitor, the file doesn't matter anymore. The Flying Man isn't claiming he can float. He's claiming that *being* is the primary datum. Your neuroscience explains the mechanism of the mirror, but it refuses to look at the reflection."

  "The reflection is empty," Tomas said, finishing his drink.

  "Then why are you so afraid of it?"

  The silence stretched out, filled only by the hum of the heater and the wind battering the glass. Tomas signaled for another round, not looking at her. He knew he hadn't won. He never won this one. But he also knew she hadn't proven him wrong, not in a way that would satisfy a man who needed to touch a thing to believe it existed.

  "Same time tomorrow?" he asked, his voice rough.

  Neda finally picked up her wine. "Only if you promise not to hide behind your MRI machine."

  "Only if you promise not to hide behind your angels."

  "Avicenna didn't believe in angels like that," she said, taking a sip.

  "Could have fooled me."
