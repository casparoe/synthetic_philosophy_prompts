      *   *Van Fraassen's Objection:* IBE is comparative. It tells you $H$ is better than the *available* rivals. It does *not* tell you $H$ is true, because the truth might not be in the set $\{H, H_1, ... H_n\}$. It's like choosing the healthiest meal from a menu of junk food; it's still junk.
      *   *The Continental Drift Case:* A perfect historical example of the "Bad Lot." The true mechanism (convection) was conceptually available (Holmes) but not widely accepted/integrated. The "lot" was effectively bad because the community excluded the true hypothesis based on prior commitments (rigid Earth).

  3.  **Connect Philosophy to the User's Specific Case (Plumes vs. Plates):**
      *   *The Plume Hypothesis:* Morgan (1971). Deep mantle upwellings. Explains hotspots, geochemistry, topography.
      *   *The Plate Hypothesis:* Foulger et al. Hotspots are shallow, crustal phenomena, related to plate stresses/cracks, not deep mantle roots.
      *   *The "Bad Lot" Risk:* Is there a third option? Maybe plumes exist but aren't thermal? Maybe they are compositional? Maybe the tomography is misleading (anisotropy vs. temperature)?
