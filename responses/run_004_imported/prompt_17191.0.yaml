  5.  **Final Polish:** Check the flow. Start with the personal hook, move to technical objections, then epistemic consequences, then broader implications. (Proceeds to generate output based on this structure).

      *Note on "Likely Answers":* Since I don't know the specific philosopher, I must generalize based on the "strong CP defender" archetype (e.g., similar to Susanna Siegel, Andy Clark, or Kevin Connolly). I will frame the "Likely Answer" as the standard philosophical defense for this position.

      *Note on Follow-ups:* These need to be punchy. Not just "Why?" but "If X, then doesn't Y follow?"

