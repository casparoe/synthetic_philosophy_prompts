prompt: |-
  Last month the chair of my co-op board formally reprimanded me at a meeting for subletting my unit without prior written approval. I don't dispute that I broke the rule. But a departing board member has since told me, in confidence, that the chair has knowingly let a close friend on the board do the identical thing for two years without objection. Since then I've been reading around in the philosophical literature on hypocrisy and the standing to blame, and two accounts keep recurring: R. Jay Wallace's view that hypocritical blame is defective because it violates the equal standing that the practice of moral address presupposes between blamer and blamed, and Patrick Todd's proposal that loss of standing always comes down to the blamer presupposing something false about her own relation to the violated norm -- for instance, that she doesn't also commit it. My situation sits awkwardly with both: the chair doesn't sublet her own unit, so nothing obviously false is presupposed about her conduct, yet the favoritism seems like exactly the sort of thing that should undermine her standing to reprimand me. Compare the two accounts, and tell me which, if either, correctly diagnoses a standing-defeating problem in a case of selective enforcement like mine, where there is favoritism but no shared guilt. Justify your answer, and say what each view would need to add or revise to accommodate a case like this.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Situation:** The user was formally reprimanded by a co-op board chair for subletting without approval (admitted guilt). However, the chair allowed a close friend on the board to do the *exact same thing* for two years without objection (selective enforcement/favoritism). The chair does *not* sublet her own unit.
      *   **Philosophical Context:** The user has been reading about hypocrisy and the standing to blame, specifically R. Jay Wallace and Patrick Todd.
      *   **Task:** Compare Wallace's and Todd's accounts in light of this specific case (selective enforcement without shared guilt). Determine which (if either) correctly diagnoses the standing-defeating problem. Justify the answer. Explain what each view would need to add or revise to accommodate this case.

  2.  **Deconstruct the Philosophical Accounts:**

      *   **R. Jay Wallace (Responsibility and the Moral Sentiments):**
          *   *Core Idea:* Hypocrisy undermines standing because it violates the *equal standing* presupposed by moral address. When we blame, we implicitly claim authority based on a shared commitment to norms. If the blamer exempts themselves (or others arbitrarily) from the norm they enforce, they deny the equality of the relationship.
          *   *Application to Case:* The chair enforces the rule against the user but not the friend. This looks like a violation of equal standing. The chair treats the user as subject to the norm but treats the friend (and by extension, herself as the enforcer) as above it.
          *   *Potential Issue:* Wallace often focuses on the blamer's *own* violation (doing the very thing they blame). Does his view cover *selective enforcement* where the blamer doesn't violate the norm personally but allows a favorite to?

      *   **Patrick Todd ("Hypocrisy, Standing, and False Presuppositions"):**
          *   *Core Idea:* Loss of standing comes from presupposing something *false* about one's own relation to the norm. Typically, this means the blamer implies "I do not violate this norm" when they actually do. It's about the truth conditions of the implicit claim made during blame.
          *   *Application to Case:* The chair does *not* sublet. So, if she blames the user, she isn't necessarily implying "I never sublet." She is implying "Subletting is wrong/forbidden." Is there a false presupposition here? Maybe "I enforce this rule consistently"?
          *   *Potential Issue:* Todd's view is often tighter on *personal* violation. If the chair follows the rule herself, Todd might say she has standing, even if she's lenient on a friend. This seems counterintuitive for the user's case.

  3.  **Evaluate the Accounts against the "Selective Enforcement" Case:**

      *   **The Core Problem:** This isn't classic "do as I say, not as I do" (tu quoque). It's "I enforce against you, but not against my friend." This is *unfairness* or *partiality* rather than strict *hypocrisy* (in the sense of shared guilt).
      *   **Wallace:** His focus on "equal standing" is more flexible. If I blame you but let my friend off, I am treating you as a subordinate, not an equal. I am making myself the arbiter who decides who counts as a moral agent subject to the norm. This fits the "equal standing" violation well.
      *   **Todd:** His focus on "false presuppositions" is trickier. What is the false claim? "I follow this rule"? (True). "Everyone who breaks this rule gets blamed"? (False). But does the act of blaming *presuppose* universal enforcement? Todd might argue that blame only presupposes the blamer's own compliance. If so, Todd's view might fail to capture the wrong here.

  4.  **Drafting the Comparison:**

      *   *Introduction:* Acknowledge the nuance. This is a case of *selective enforcement* (partiality), not standard *hypocrisy* (shared violation).
      *   *Wallace Analysis:*
          *   Strengths: The "Equal Standing" criterion captures the relational injustice. By enforcing against you but not the friend, the chair asserts a hierarchy.
          *   Weaknesses/Adjustment: Wallace usually talks about the blamer's *own* violations. He needs to expand "exemption" to include "granting exemptions to others arbitrarily."
      *   *Todd Analysis:*
          *   Strengths: Precision about what is communicated in blame.
          *   Weaknesses/Adjustment: If the chair follows the rule, Todd might say she has standing. This seems wrong. Todd needs to argue that blame presupposes *impartiality* or *consistent commitment*, not just personal compliance.
      *   *Verdict:* Wallace is better suited, but needs tweaking. Todd struggles more because the "falsehood" is harder to pin down without expanding the scope of the presupposition.

  5.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Wait, does Wallace actually cover this?* Wallace's 2010 paper "Hypocrisy, Moral Address, and the Equal Standing of Persons" focuses heavily on the blamer's *own* conduct. He argues that if I violate the norm, I lose the right to claim the authority of the norm. However, the *spirit* of equal standing is about the relationship. If I enforce selectively, I treat the blamed party as a mere object of power rather than a co-legislator of the norm.
      *   *Todd's View:* Todd (2012/2019) argues that hypocrisy is a species of lying (or false implicature). If I blame you, I imply I am committed to the norm. If I let my friend slide, am I lying about my commitment? Yes, arguably. My commitment is conditional on friendship, not the norm.
      *   *Comparison:* Wallace is more about the *relationship* (standing). Todd is about the *truth of the assertion*.
      *   *Which fits better?* The user feels the *unfairness* of the reprimand. This is a standing issue (do you have the right to sanction *me* specifically?). Wallace's "equal standing" explains why the *relationship* is corrupted. Todd's "false presupposition" explains why the *communication* is defective.
      *   *Decision:* Wallace is the stronger fit for *standing* specifically, because standing is relational. However, both need revision to move from "blamer's violation" to "blamer's partiality."

  6.  **Developing the Revisions:**

      *   *Wallace:* Needs to broaden "violation of equal standing" from "I break the rule I enforce on you" to "I administer the rule unequally." The violation isn't necessarily against the norm itself, but against the *community of accountability*.
      *   *Todd:* Needs to broaden the "false presupposition." It's not just "I don't break this." It's "I uphold this norm as a general authority." If enforcement is arbitrary, the claim to authority is false.

  7.  **Finalizing the Structure:**
      *   **Introduction:** Define the case (selective enforcement vs. standard hypocrisy).
      *   **Wallace's Account:** Explain equal standing. Apply to case. Verdict: Better fit, but needs expansion.
      *   **Todd's Account:** Explain false presupposition. Apply to case. Verdict: Struggles, needs significant revision regarding what is presupposed.
      *   **Comparative Judgment:** Wallace is superior for *standing* questions involving partiality.
      *   **Required Revisions:** Detail exactly how each theory must change to cover "favoritism without shared guilt."

  8.  **Tone Check:** Ensure the tone is empathetic but analytical. Acknowledge the frustration of the situation while maintaining philosophical rigor. (Avoid giving legal advice about the co-op, stick to the philosophy).

  9.  **Key Philosophical Distinction:** Make sure to distinguish between *hypocrisy* (often implies shared guilt) and *partiality/selective enforcement* (the specific issue here). The prompt asks to treat it under the literature on hypocrisy/standing, so I must bridge that gap.

      *(Self-Correction during drafting)*: I need to be careful not to misrepresent Todd. Todd argues that the hypocrite implies they are *not* guilty. If the chair is not guilty, Todd might say she *has* standing. This is the critical weakness to exploit. Wallace argues the hypocrite forfeits standing by denying equality. Selective enforcement denies equality even without personal guilt. Therefore, Wallace is more adaptable.

  10. **Final Polish:** Check against the prompt requirements: Compare, choose one, justify, say what needs revision for both.

      *(Final thought)*: Actually, there's a strong argument that *neither* perfectly fits without revision, but Wallace is *closer*. I should emphasize that this case reveals a gap in both regarding *institutional partiality* vs. *interpersonal hypocrisy*. But since the prompt asks to choose "which, if either," I will argue Wallace provides the better *foundation* for a diagnosis, even if both need revision.

      *Wait, one more nuance:* Todd has written specifically about "standing to blame." He distinguishes between *moral* standing and *epistemic* standing. In selective enforcement, the issue is often *authority*. Wallace's "equal standing" is explicitly about the authority to address. Todd's "false presupposition" is about the sincerity of the address. The user's problem is the *authority* of the reprimand. Wallace wins on that front.

      *Let's write.*
answer: |-
  This is a sophisticated philosophical puzzle that cuts to the heart of recent debates on moral standing. You have identified a crucial distinction in the literature: the difference between **standard hypocrisy** (the blamer violates the very norm they enforce) and **selective enforcement** or **partiality** (the blamer follows the norm but enforces it arbitrarily against some while exempting others).

  Your case is the latter. The chair follows the rule (no subletting) but enforces it selectively (against you, not her friend). This creates a "standing-defeating" problem that is distinct from the *tu quoque* ("you did it too") dynamic.

  Here is an analysis of how R. Jay Wallace's and Patrick Todd's accounts handle your situation, a comparison of their diagnostic power, and what each would need to revise to fully accommodate cases of favoritism without shared guilt.

  ### 1. R. Jay Wallace: The Equal Standing Account

  **The Theory:**
  In *Responsibility and the Moral Sentiments* and his later paper "Hypocrisy, Moral Address, and the Equal Standing of Persons," Wallace argues that the standing to blame is grounded in the **equal moral standing** of persons. When we blame someone, we engage in "moral address," which presupposes that both parties are equally subject to the demands of the moral (or quasi-moral) community. Hypocrisy defeats standing because the hypocrite, by violating the norm they enforce, implicitly claims an exemption for themselves. They act as though they are not bound by the same demands as the person they are blaming, thereby violating the condition of equality required for moral address.

  **Application to Your Case:**
  Wallace's view is the stronger fit for your situation, though it requires a slight stretch.
  *   **The Diagnosis:** The chair's reprimand is defective because it violates the presupposition of equal standing. By enforcing the rule against you but not your friend, the chair is not necessarily claiming *she* is above the rule, but she is asserting a **hierarchical authority** to decide *who* is bound by it. She treats you as a subordinate subject to discipline, while treating her friend as a peer exempt from scrutiny. This undermines the "community of accountability" necessary for legitimate blame.
  *   **The Strength:** Wallace focuses on the *relationship* between blamer and blamed. Your grievance is relational (unfair treatment compared to a peer), and Wallace's framework is designed to protect relational equality.

  **The Limitation:**
  Wallace's paradigmatic cases involve the blamer's *own* violation of the norm (e.g., a smoker blaming someone for smoking). He ties the loss of standing to the blamer's failure to take the norm seriously *in their own conduct*. In your case, the chair *does* take the norm seriously regarding herself. Wallace would need to explain why exempting a *third party* (the friend) violates the equality between the *chair and you*.

  ### 2. Patrick Todd: The False Presupposition Account

  **The Theory:**
  Patrick Todd (in works like "Hypocrisy, Standing, and False Presuppositions") argues that hypocritical blame involves a kind of false implicature or presupposition. When A blames B, A implicitly represents herself as having a certain relation to the norm—specifically, that she is not currently violating it. If A is violating the norm, she is representing something false, and this falsehood undermines her standing. For Todd, the loss of standing is akin to the loss of credibility in a speech act; you cannot sincerely assert a commitment you do not hold.

  **Application to Your Case:**
  Todd's view struggles significantly with selective enforcement where the blamer is personally compliant.
  *   **The Diagnosis:** If the chair does not sublet, what false presupposition is she making when she reprimands you? She is not implying "I never sublet" (which is true). She might be implying "I enforce this rule consistently," but Todd's account is usually tighter: it focuses on the blamer's *personal compliance* as the condition for standing.
  *   **The Weakness:** On a strict reading of Todd, the chair might retain standing. She is committed to the norm (she follows it herself). The fact that she is lenient on a friend might make her *unfair*, but Todd's account ties standing to the *sincerity of the blamer's own adherence*. If she adheres, the "falsehood" is harder to locate. This fails to capture your intuition that her favoritism *specifically* voids her authority over *you*.

  ### 3. Comparative Verdict

  **Wallace provides the correct diagnosis, though both views require revision.**

  Wallace is superior here because your grievance is about **authority and equality**, not just **sincerity**.
  *   Todd explains why a liar lacks standing (they are insincere).
  *   Wallace explains why a tyrant lacks standing (they deny your equality).

  Your chair is not necessarily a liar (she follows the rule); she is acting partially. Partiality is a violation of the *equal standing* required for a cooperative community (like a co-op board). By enforcing the rule selectively, she treats you not as a co-equal member of the co-op, but as a subject of her discretion. This fits Wallace's "equal standing" criterion much better than Todd's "false presupposition" criterion, which relies too heavily on the blamer's personal guilt.

  ### 4. Necessary Revisions to Accommodate Selective Enforcement

  To fully account for cases like yours (favoritism without shared guilt), both theories need to expand their scope from *personal violation* to *administrative partiality*.

  **What Wallace Needs to Add:**
  Wallace must broaden the concept of "exemption." Currently, his view focuses on the blamer exempting *themselves*.
  *   **Revision:** He needs to argue that **granting arbitrary exemptions to others** is functionally equivalent to exempting oneself.
  *   **Justification:** If I claim the authority to enforce a norm, I claim to be an agent of the norm, not its master. If I enforce it only against my enemies and not my friends, I am asserting that *my will*, not the *norm*, determines accountability. This still violates the "equal standing" of the person I blame, because I am treating them as subject to my whim rather than a shared law. Wallace needs to explicitly state that standing is forfeited not just by violating the norm, but by **administering it unequally.**

  **What Todd Needs to Add:**
  Todd needs to broaden the content of the "presupposition." Currently, he focuses on the presupposition of *personal compliance*.
  *   **Revision:** He needs to argue that blame presupposes **impartial commitment** to the norm, not just personal compliance.
  *   **Justification:** When the chair reprimands you, she is implicitly claiming, "This rule is binding on members of this board." If she knowingly lets a friend break it, the claim "This rule is binding" is rendered false in practice. Todd would need to argue that the false presupposition is not "I do not break this rule," but rather "I recognize this rule as an objective standard applicable to all relevant peers." By showing the standard is subjective (based on friendship), the speech act becomes defective.

  ### Summary

  Your intuition is philosophically sound: selective enforcement undermines standing even without shared guilt. **Wallace's account is the better diagnostic tool** because it centers on the relational equality necessary for legitimate moral (or quasi-moral) address. The chair's favoritism denies your status as an equal member of the co-op community.

  However, to fully vindicate your position, Wallace's theory must be revised to recognize that **partiality is a form of self-exemption.** By deciding who gets punished, the chair places herself above the norm, even if she follows it personally. Todd's theory, while precise, is too focused on the blamer's personal truthfulness to capture the structural unfairness of your situation without significant revision regarding what is actually presupposed in an act of blame.

  ***

  *Disclaimer: While this analysis addresses the philosophical dimensions of standing and hypocrisy, co-op boards are governed by specific bylaws, proprietary leases, and local housing laws. Philosophical standing does not necessarily equate to legal standing. If you intend to challenge the reprimand formally, you should consult the specific governing documents of your co-op and potentially seek legal counsel.*
