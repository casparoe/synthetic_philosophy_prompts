      *   *Check:* Is the recommendation specific? I need to propose actual text changes or retention of current text with justification. Let's propose retaining the current text but adding a clarifying note or ensuring the text emphasizes *testability*. Actually, better to recommend *specific language* that preempts the tautology argument by defining fitness operationally.
      *   *Check:* Is it too long? Keep it concise enough to be read before a meeting.
