prompt: |-
  ok so this is an actual thing happening on the state curriculum standards committee I somehow ended up on (long story, don't ask). A parent advocacy group submitted a genuinely well-researched public comment arguing the new biology standards should note that natural selection 'is not a strictly falsifiable theory,' and their whole citation is Popper himself -- back in the 70s he called Darwinian natural selection almost tautological, a 'metaphysical research programme' rather than a proper scientific theory, before recanting years later (IIRC at some Darwin-anniversary lecture, but don't hold me to the exact date). Half the commitee just wants to say 'Popper wasn't a biologist, next' and move on, which feels like dodging the actual argument instead of answering it. Can you draft the memo I'll circulate before next week's vote? It needs to land on an actual recommendation for the standards language (not just 'reject the comment'), and it has to seriously engage with why the tautology charge -- and the recantation -- doesn't get the commenters what they want, rather than just gesturing at scientific consensus or Popper's credentials.
