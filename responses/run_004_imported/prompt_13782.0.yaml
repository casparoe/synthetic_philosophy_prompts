      *   *The Present Age (En Nutid):* Focuses on "reflection," "envy," and "leveling." Key concept: **The Public (Publikum)**. It's an abstraction. No one is responsible. It's a monster made of mirrors.
      *   *The Crowd (Mengden):* Often associated with "The Crowd is Untruth" (from *That Single Individual* / later religious writings). Focuses on ethical/religious responsibility. Hiding in numbers to avoid standing before God.
      *   *Leveling (Nivellering):* The *process* by which distinction, excellence, and individuality are flattened. It's not equality; it's negation.

  3.  **Address the Specific Distinctions (The "Gears"):**

      *   **The Public (*Publikum*):**
