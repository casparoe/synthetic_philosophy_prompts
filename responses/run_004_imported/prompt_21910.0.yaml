answer: |-
  **Gyekye:** Ifeanyi, let us press on the implication of your claim that personhood is a normative achievement, a thing earned through ritual and moral conduct. If a newborn is merely a "potential person," and full personhood belongs to the elder who has woven themselves into the community, what becomes of the infant who dies before that weaving begins? Are they not fully human?

  **Menkiti:** They are human, Kwame, in the biological sense. But do not confuse the raw material with the finished sculpture. The infant is a *it*, not yet a *who*. They possess the capacity for personhood, but they have not yet shouldered the moral weight that makes one a person. To say they are "fully human" in your liberal sense is to ignore that humanity is a journey, not a birthright.

  **Gyekye:** But consider the severely cognitively disabled. They may never shoulder that moral weight. They may never participate in the rituals or exercise the judgment required for your "normative status." If personhood is earned through moral agency, does your view not strip them of their standing? Are they to be treated as incomplete *its* forever?

  **Menkiti:** You speak as if protection requires the label of "personhood" in the way you define it. In our tradition, the disabled are cared for precisely because the community recognizes their vulnerability. Their protection is a duty *we* bear, not a right *they* assert. You are worried about their status; I am worried about their care. Does your abstract status feed them, or does the communal obligation?

  **Gyekye:** Communal obligation is fickle, Ifeanyi. It depends on the charity of the group. If the community turns hostile, your "duty" evaporates. I argue they have intrinsic worth because they possess a minimal, pre-social capacity for reason and choice—even if impaired. This grounds their dignity independently of whether the elders deem them worthy. Without this, you leave them exposed to the community's whim.

  **Menkiti:** And there it is. You speak of "pre-social capacity" as if a human being can exist in a vacuum before the community touches them. This is the Western individualist smuggling I warned you about. You want to be a communitarian, yet you ground your ethics in a solitary, Kantian rationality. There is no "pre-social" human. We are born into a web of obligations that define us before we can even reason.

  **Gyekye:** I do not deny the web, but I deny that the web creates the spider. The capacity for choice is empirical, not Western. Even a child chooses. To deny this baseline is to make the community the sole arbiter of existence. If the community defines personhood, can it not also revoke it? What prevents a community from deciding a dissident is no longer a person?

  **Menkiti:** That is a corruption of the concept, not a feature. A true community does not exclude; it incorporates. But you miss the point: by insisting on this intrinsic, atomic status, you undermine the very project of Ubuntu. You make the individual the standard, and the community merely the background. You are saving the individual from the community by hollowing out the community's authority.

  **Gyekye:** I am saving the individual *within* the community. If I am only a person because you recognize me, then I am not your partner; I am your creation. A genuine communion requires distinct parties. If I have no standing prior to your recognition, there is no relationship, only absorption.

  **Menkiti:** Absorption? No. It is ripening. The elder does not create the child; the elder guides the child into the moral reality that makes life meaningful. You fear the loss of rights; I fear the loss of meaning. A being with "rights" but no moral maturity is a dangerous fiction.

  **Gyekye:** And a being with "moral maturity" but no intrinsic rights is a dangerous tool. You say the infant is a potential person. I say the infant is a person with potential. That distinction determines whether we protect them because of what they *are*, or because of what we hope they might *become*.

  **Menkiti:** But what they *are*, Kwame, is nothing without what they become. A seed is not a tree. To treat it as a tree is to misunderstand its nature. You want to grant the seed the rights of the forest.

  **Gyekye:** And you risk forgetting that the seed contains the forest already, even if it has not yet grown. If you wait for the growth to grant the dignity, you have already failed the moral test you claim to uphold.

  **Menkiti:** Perhaps. Or perhaps you have failed to see that dignity is not a static property to be possessed, but a dynamic force to be enacted. We shall not agree on where the force begins.

  **Gyekye:** No. You locate it in the circle; I locate it in the center. Until we resolve that, the "we" in "I am because we are" remains dangerously undefined.

  **Menkiti:** Then let the tension remain. It is better than a false peace built on borrowed concepts.
