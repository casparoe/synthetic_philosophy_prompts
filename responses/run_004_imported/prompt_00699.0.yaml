answer: |-
  You have spotted a genuine and persistent ambiguity in analytic metaphysics. You are absolutely right: "Four-dimensionalism" is often used as a catch-all term that conflates a thesis about **time** (Eternalism) with a thesis about **objects** (Perdurantism).

  While they often travel together (especially in the work of David Lewis and Ted Sider), they are logically distinct. Here is the breakdown of where they come apart, which combinations work, and which are philosophical non-starters.

  ### 1. The Distinction: Time vs. Persistence

  To untangle this, we need to separate the "container" from the "contents."

  *   **Eternalism (The Container):** This is a thesis about the **ontology of time**. It claims that past, present, and future times all exist equally. There is no objective "now"; time is like a spatial dimension.
      *   *Opposite:* **Presentism** (Only the present moment exists).
  *   **Perdurantism (The Contents):** This is a thesis about the **persistence of objects**. It claims that objects persist through time by having **temporal parts**. You are not "wholly present" right now; only a "time-slice" of you is present. The real "you" is a spacetime worm stretching from birth to death.
      *   *Opposite:* **Endurantism** (Objects are wholly present at every moment of their existence).

  **The Confusion:** People say "Four-dimensionalism" because if you combine Eternalism + Perdurantism, objects look like 4D blocks in a 4D manifold. But you can mix and match these independently.

  ---

  ### 2. The Matrix of Combinations

  There are four logical combinations. Here is how they stack up regarding coherence and defense.

  | | **Endurantism** (Wholly Present) | **Perdurantism** (Temporal Parts) |
  | :--- | :--- | :--- |
  | **Eternalism** (Block Universe) | **Combo A:** Eternalist Endurantism | **Combo B:** Standard 4Dism (Lewis/Sider) |
  | **Presentism** (Only Now) | **Combo C:** Common Sense View | **Combo D:** Presentist Perdurantism |

  #### Combo B: Eternalism + Perdurantism (The Standard "4Dist" View)
  *   **Coherence:** High.
  *   **Status:** This is the dominant view in contemporary analytic metaphysics.
  *   **Why they pair well:** If all times exist, it is natural to treat time exactly like space. Just as an object has spatial parts (your hand, your foot), it has temporal parts (you-in-2010, you-in-2024). This elegantly solves the **Problem of Temporary Intrinsics** (how can I be bent at $t_1$ and straight at $t_2$ without contradiction? Answer: The $t_1$-part is bent, the $t_2$-part is straight).
  *   **Defenders:** David Lewis, Ted Sider, W.V.O. Quine.

  #### Combo C: Presentism + Endurantism (The Common Sense View)
  *   **Coherence:** High.
  *   **Status:** The default view of most non-metaphysicians and many Aristotelian Thomists.
  *   **Why they pair well:** If only the present exists, there are no past or future temporal parts for a "worm" to be made of. Therefore, objects must be wholly present now.
  *   **Defenders:** Most presentists (e.g., A.N. Prior, Dean Zimmerman).

  #### Combo A: Eternalism + Endurantism (The "3D in a 4D World" View)
  *   **Coherence:** **Yes, it is coherent.**
  *   **Status:** A respected minority view.
  *   **The Challenge:** This view faces the **Problem of Temporary Intrinsics** head-on. If the past and future exist, and you are *wholly present* at $t_1$ and *wholly present* at $t_2$, how can the whole you have incompatible properties (bent vs. straight) without contradiction?
  *   **The Solution:** Eternalist Endurantists deny that properties are simple. They argue properties are actually relations to times (e.g., "I am bent-at-$t_1$" and "I am straight-at-$t_2$"). Since these are different relations, there is no contradiction.
  *   **Does Eternalism commit you to Perdurantism?** **No.** Believing all times exist does not force you to believe objects are sliced up like salami. You can believe the "block universe" exists but that objects "move through" it wholly.
  *   **Defenders:** Cody Gilmore, Kit Fine (in some works), some interpretations of early Russell.

  #### Combo D: Presentism + Perdurantism (The "Zombie" View)
  *   **Coherence:** **Extremely Low / Non-Starter.**
  *   **Status:** Rarely defended; mostly discussed as a *reductio*.
  *   **The Problem:** Perdurantism says you are a "spacetime worm" composed of temporal parts. Presentism says only the present slice exists.
      *   If only the present slice exists, the "worm" does not exist.
      *   If the worm doesn't exist, what is persisting? Only the current slice exists.
      *   If only the current slice exists, aren't you just "wholly present" right now? That collapses into Endurantism.
  *   **Can it be saved?** Some try to argue that temporal parts are abstract entities or logical constructs that don't need to ontologically exist to be useful. However, most metaphysicians (including Sider) argue this is unstable. If the past parts don't exist, you can't have relations to them, and the "worm" ontology falls apart.
  *   **Defenders:** Virtually no one defends this seriously. It is usually posited only to be refuted.

  ---

  ### 3. Direct Answers to Your Questions

  **1. Does being an eternalist commit you to perdurantism?**
  **No.** While they are natural bedfellows, they are independent. You can believe the past and future are real (Eternalism) but maintain that you are wholly present at each time you exist (Endurantism). The commitment only feels necessary if you think the *only* way to solve the Problem of Temporary Intrinsics is via temporal parts. If you solve it via relational properties, you can be an Eternalist Endurantist.

  **2. Could there be a coherent eternalist endurantist?**
  **Yes.** This is a live, defended position. It is sometimes called "Transdurantism" or simply "Endurantism in a Block Universe." The main hurdle is explaining change without contradiction, but the "relational theory of properties" handles this. The main motivation for this view is that Endurantism feels more intuitive (we feel wholly present), while Eternalism feels more scientifically robust (Special Relativity). This view tries to have the best of both.

  **3. Does perdurantism even make sense if you're stuck with presentism?**
  **Basically, no.** This is the combination that falls apart. Perdurantism requires the existence of non-present temporal parts to constitute the "whole" object (the worm). If Presentism is true, those parts do not exist. A worm made of only one existing slice is indistinguishable from an enduring object. Most philosophers treat **Presentist Perdurantism** as a category error or a non-starter.

  ### 4. Why the Terminology is Messy

  The reason you are bugged is that Ted Sider, in his influential book *Four-Dimensionalism* (2001), explicitly defines "Four-Dimensionalism" as **Perdurantism**. However, he argues extensively that Perdurantism is best supported by Eternalism.

  Consequently, in the literature:
  *   **Strict Usage:** 4Dism = Perdurantism (regardless of time ontology).
  *   **Loose Usage:** 4Dism = The package deal (Eternalism + Perdurantism).
  *   **3Dism:** Usually means Endurantism (often paired with Presentism, but not necessarily).

  ### Summary Table of Viability

  | Combination | Viability | Defended By? |
  | :--- | :--- | :--- |
  | **Eternalism + Perdurantism** | **High** | Lewis, Sider, Quine, Hawley |
  | **Presentism + Endurantism** | **High** | Prior, Zimmerman, Merricks |
  | **Eternalism + Endurantism** | **Medium** | Gilmore, Fine, Brogaard |
  | **Presentism + Perdurantism** | **None** | (Generally regarded as incoherent) |

  **The Bottom Line:** You are right to separate them. Eternalism is about the *stage*; Perdurantism is about the *actors*. You can have a permanent stage with actors who move through it wholly (Eternalist Endurantism), but you can't really have a disappearing stage with actors who are made of disappearing parts (Presentist Perdurantism) without the ontology collapsing.
