answer: |-
  You have put your finger on a genuine and significant fault line in the literature on agency. Your worry is not only well-founded; it is arguably the central objection that philosophy of action raises against the standard behavioral-economic modeling of akrasia.

  To state it briefly: **You are correct.** The standard hyperbolic discounting model (as popularized in the rationalist blogosphere) generally dissolves Davidson's puzzle by redefining the phenomenon. It converts a problem of *synchronic rationality* (how can I act against my current judgment?) into a problem of *diachronic preference consistency* (how do my preferences change over time?).

  In doing so, it risks explaining away the very thing that makes weakness of will philosophically interesting: the experience of acting against what one *currently* takes to be best.

  Here is a detailed treatment of the conceptual tension, how different camps handle it, and where the current synthesis lies.

  ### 1. The Structure of the Conflict

  To see why the tension is real, we must formalize the two competing descriptions of the akratic moment.

  **The Davidsonian Description (Synchronic)**
  Davidson's analysis in *"How Is Weakness of the Will Possible?"* rests on the **Principle of Continence**: An agent ought to perform the action they judge best, all things considered.
  *   **State at T2:** The agent holds an all-things-considered (ATC) judgment that Action A (Diet) is better than Action B (Donut).
  *   **Action at T2:** The agent intentionally performs Action B.
  *   **The Puzzle:** Intentional action presupposes a "pro-attitude" toward the action. If I intentionally eat the donut, I must see it as desirable. If I see it as desirable *all things considered*, my judgment has changed, and I am not akratic (I just changed my mind). If I *still* see the Diet as better ATC, how can I intentionally choose the Donut? Davidson argues this requires a partitioning of the mind where the judgment is present but not "active" in the causal chain of the action.

  **The Hyperbolic Description (Diachronic)**
  *   **State at T1:** Preference for Diet > Donut (because the health benefits are discounted less than the immediate taste cost).
  *   **State at T2:** Preference for Donut > Diet (because the taste reward is immediate, the health cost is distant; the curves cross).
  *   **Action at T2:** The agent maximizes utility according to T2 preferences.
  *   **The Dissolution:** At T2, there is no contradiction. The agent is locally rational. The "weakness" is merely the fact that T2's preferences differ from T1's.

  **The Tension:** If the hyperbolic model is the *whole* story, then Davidson's puzzle vanishes. There is no synchronic irrationality, only a sequence of locally rational agents with shifting utility functions. But this contradicts the phenomenology of akrasia, which typically involves guilt, regret, or a sense of compulsion *at the moment of action*, suggesting the ATC judgment didn't just vanish—it was overridden.

  ### 2. Three Philosophical Responses to the Tension

  Philosophers and decision theorists have responded to this mismatch in three primary ways.

  #### A. The Eliminativist / Humean Response
  *Representatives: Some behavioral economists, George Ainslie (interpreted reductively), classical Humeans.*

  This camp argues that Davidson's puzzle is based on a false intellectualist premise. Davidson assumes that judgment *should* motivate. The Humean argues that judgment is inert; only desire (or "passion") motivates.
  *   **The Argument:** When you eat the donut, your ATC judgment that "Diet is better" is still there, but it is a cold cognitive state. The hyperbolic spike in dopamine/desire for the donut simply overpowers the motivational force of the judgment.
  *   **Resolution:** There is no contradiction because judgment and motivation are separate faculties. The "rationalist blog" version often implicitly adopts this: "Your System 1 overrode your System 2."
  *   **Critique:** This saves the economic model but loses the normativity. If I am simply following my strongest desire, in what sense am I *irrational*? I am just weak. Davidson wanted to show akrasia was a failure of *reason*, not just a failure of strength.

  #### B. The Partitioning Strategy (Picoeconomics)
  *Representatives: George Ainslie, Jon Elster.*

  Ainslie's *Picoeconomics* is more sophisticated than the standard blog summary. He does not merely say preferences change; he argues the self is a population of competing impulses.
  *   **The Argument:** The "ATC Judgment" is not a monolithic state. It is the victory of a long-term interest coalition over a short-term impulse coalition. At T2, the short-term coalition wins the bargaining game.
  *   **Resolution:** This accepts your worry: there is no unitary "self" at T2 to be synchronically irrational. The "contradiction" is inter-personal (between T1-self and T2-self) rather than intra-personal.
  *   **Critique:** This is metaphysically costly. It requires us to abandon the idea of a unitary agent. If there is no unitary agent, who is responsible for the diet failure? It turns moral failure into a civil war between sub-agents.

  #### C. The Resolution-Based Strategy (The Holton/Mele Synthesis)
  *Representatives: Richard Holton, Alfred Mele, Michael Bratman.*

  This is the most robust contemporary philosophical response, and it attempts to save Davidson's intuition while accommodating the economic data. The key move is distinguishing between **Judgment** and **Resolution**.

  **Richard Holton (*Willing and Wanting*)** argues that the standard model (both Davidson's and the Economists') focuses too much on *belief/judgment*.
  *   **The Move:** Akrasia is not acting against a *judgment*; it is failing to maintain a *resolution*.
  *   **The Mechanism:** A resolution is a distinctive mental state, different from a prediction or a preference. It is a commitment to a plan that is resistant to revision.
  *   **Handling Hyperbolic Discounting:** Holton agrees that preferences shift (hyperbolic discounting is real). However, a rational agent forms a resolution *specifically to resist* the anticipated preference shift.
  *   **The Synchronic Failure:** When I eat the donut, I am not necessarily judging "Donut > Diet" ATC. I am *abandoning my resolution*. The synchronic irrationality lies in the **reconsideration**. It is irrational to reconsider a plan when you know your preferences are temporarily distorted.
  *   **Why this matters:** This restores the normative bite. It's not just that T2 wants something different; it's that T2 violated a procedural norm of rationality (do not reconsider plans in the face of temporary temptation) that T2 *endorsed*.

  **Alfred Mele** offers a similar nuance with **"Soft Akrasia."** He suggests that in many cases, the agent doesn't strictly judge "A is better" at the exact moment of action. Instead, the agent clouds their mind. They focus on the donut's glaze and suppress the thought of the diet.
  *   **The Synthesis:** Hyperbolic discounting explains *why* the desire spikes. The philosophical failure is the *management of attention*. The agent allows the spike to manipulate their cognitive focus so that, technically, at the moment of choice, their ATC judgment has shifted to "Donut."
  *   **The Irrationality:** The irrationality is diachronic but results in a synchronic failure of integrity. I manipulated my own beliefs/desires to make the bad action look good.

  ### 3. Decision Theory and Dynamic Consistency

  You asked how decision theorists handle this. The literature on **Dynamic Choice** (McClennen, Bratman, Gauthier) engages directly with your worry.

  Standard decision theory (Savage/Ramsey) assumes **Dynamic Consistency**: If you prefer Plan A at T1, you should execute Plan A at T2. Hyperbolic discounters are dynamically inconsistent.

  *   **The Sophisticated Chooser:** A "sophisticated" agent knows they are a hyperbolic discounter. They predict T2 will defect. Therefore, at T1, they choose the option that accounts for T2's defection (often leading to suboptimal outcomes, like refusing to start the diet at all).
  *   **The Resolute Chooser:** Edward McClennen and others argue that true rationality involves **Resoluteness**. A resolute chooser treats their past plan as a reason for action *independent* of current preferences.
  *   **The Tension Resolved?** If you accept Resoluteness as a rational norm, then succumbing to hyperbolic discounting *is* a synchronic rationality failure. It is a failure to treat your own past reasoning as authoritative.
  *   **The Counter:** Many economists reject Resoluteness as "magical." They argue you cannot simply choose to ignore your current utility function. If T2 prefers Donut, T2 chooses Donut. To say T2 *should* choose Diet is to say T2 *should* have different preferences.

  ### 4. Why the Rationalist Blogosphere Flattens This

  Your observation about the "rationalist" framing is astute. There are sociological and pragmatic reasons for this flattening:

  1.  **Actionability:** The "Preference Reversal" model yields clear interventions (precommitment, Ulysses contracts, Beeminder). The "Synchronic Irrationality" model yields... philosophy. It requires cultivating virtues, attentional control, or resoluteness, which are harder to algorithmize.
  2.  **Naturalism:** The hyperbolic model fits neatly into a computational/evolutionary worldview (competing subroutines). Davidson's "all-things-considered judgment" smells of folk psychology or homunculi to hard-nosed naturalists.
  3.  **Dissolving the Mystery:** The rationalist tradition (heavily influenced by Eliezer Yudkowsky) often seeks to "dissolve" philosophical questions by showing they arise from confused maps. Framing akrasia as "time inconsistency" dissolves the paradox of how one can act against oneself: you are just many selves.

  ### 5. Conclusion: Is the Tension Real?

  Yes. The hyperbolic discounting model, taken alone, is insufficient to capture the normative structure of weakness of will as Davidson (and Aristotle) defined it.

  *   **If** you define akrasia strictly as "acting against one's current ATC judgment," hyperbolic discounting does not explain it; it explains it *away* by suggesting the judgment changes to match the action.
  *   **If** you define akrasia as "failing to execute a plan due to temporal proximity of reward," hyperbolic discounting explains it perfectly.

  The most fruitful work at the intersection (Holton, Bratman, Mele) argues that we need **both**. We need the economic model to explain the *pressure* (the shifting utility curves) and the philosophical model to explain the *failure* (the violation of norms regarding resolution, attention, or dynamic consistency).

  To accept the hyperbolic model as the *entire* explanation is to accept a deflationary view of agency: there is no "will" to be weak, only a sequence of selves with different discount rates. If you find that unsatisfying, it is likely because you hold onto a notion of synchronic agency that the economic model deliberately discards.

  **Recommendation for further reading:**
  If you want to see this tension handled with the rigor you're looking for, skip the decision theory textbooks and go to **Richard Holton's *Willing and Wanting***. It is explicitly written to solve the problem you identified: how to reconcile the reality of temptation (often modeled economically) with the reality of willpower (a philosophical capacity to stick to resolutions despite preference shifts). It validates your suspicion that the economic story is incomplete without a theory of the mental state of *resolution*.
