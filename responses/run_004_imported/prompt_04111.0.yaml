answer: |-
  This is a fascinating mess. You aren't just refereeing a bonus dispute; you are refereeing a live-action recreation of one of the most famous problems in 20th-century philosophy (Kripke's interpretation of Wittgenstein on rule-following).

  Theo is arguing for **Meaning Realism** (there is a truth about what Nora meant).
  Nora is arguing for **Meaning Skepticism** (past actions don't logically force a specific future application).

  Here is the move-by-move breakdown of who is "right," keeping in mind that "right" shifts between *logically consistent*, *pragmatically fair*, and *socially functional*.

  ### Move 1: The Unwritten Rule
  **Situation:** Nora created a bonus rule, applied by "feel," never written down. The group accepted it for a year.
  *   **Analysis:** Implicit social contracts work fine until they encounter edge cases. By not writing it down, Nora retained "authorial intent" authority, but the group's acceptance gave the *pattern* legitimacy.
  *   **Who's Right:** **Nora (60/40).** As the creator, she had the right to run it intuitively. However, she bears the risk of ambiguity. By letting the group "pick it up" without clarification, she allowed a shared expectation to form that she might not be able to codify.

  ### Move 2: The Outlier (Theo's 40 Days)
  **Situation:** Theo hits 40 days (double the previous max). The bonus feels too small based on the previous trajectory. He asks for the rule.
  *   **Analysis:** This is a standard scaling issue. Informal systems often work linearly until they hit an exponential outlier. Theo isn't being greedy; he's pointing out that the "feel" doesn't match the mathematical implication of the previous rewards.
  *   **Who's Right:** **Theo (100).** It is entirely reasonable to ask for the formula when the input variable (days) leaves the historical distribution.

  ### Move 3: Nora's Attempt & The Contradiction
  **Situation:** Nora tries to state the rule. Theo proves it contradicts three past scores.
  *   **Analysis:** This proves the rule was not a function; it was a series of ad-hoc decisions that *looked* like a function. Nora was likely adjusting bonuses based on context we don't know (e.g., "Theo wrote a lot this week," vs "Sarah wrote a little").
  *   **Who's Right:** **Theo on Logic / Nora on Honesty.** Theo is right that a stated rule must fit the data. Nora is right that she wasn't lying; she genuinely *thought* she was following a rule, but she was actually following a vibe.

  ### Move 4: Theo's Counter-Proposal
  **Situation:** Nora challenges Theo to define it. His version contradicts different old scores.
  *   **Analysis:** This is the mathematical reality of "curve fitting." With limited data points (the past year of scores), infinite lines can be drawn through them. Any specific formula Theo picks will miss some points.
  *   **Who's Right:** **Draw.** Both have proven that no single mathematical rule perfectly explains the past year. The data is "underdetermined."

  ### Move 5: The Philosophical Turn (Theo's "Fact of the Matter")
  **Situation:** Theo argues there must be a fact about what Nora *meant*, even if unstated, and his number is closer to that intent.
  *   **Analysis:** Theo is appealing to common sense. We usually believe that when someone says "add 2," they mean a specific sequence forever. He believes Nora's brain contained a specific algorithm she just can't access.
  *   **Who's Right:** **Theo (Pragmatically).** In social contexts, we *must* act as if there is a fact of the matter, or communication collapses. However, philosophically, he is on shaky ground. There is no physical scan of Nora's brain from a year ago that contains a Python script for bonuses.

  ### Move 6: Nora's Skepticism
  **Situation:** Nora argues there is no such fact. Only the past totals are fixed; the "rule" is just a story told afterward.
  *   **Analysis:** This is the hard philosophical truth. No amount of past behavior logically compels a specific future behavior. (e.g., If I wrote 2, 4, 6... did I mean "add 2" or "add 2 until 40 then add 10"?). Nora is technically correct that her past self did not lock in her future self.
  *   **Who's Right:** **Nora (Philosophically).** She is describing the "Rule-Following Paradox." There is no internal mental state that fixes meaning forever. However, she is ignoring the social expectation she created.

  ### Move 7: Theo's "Insane" Claim
  **Situation:** Theo says her view implies nobody ever follows a rule correctly.
  *   **Analysis:** He is pointing out the *reductio ad absurdum*. If Nora is right, then language and law are impossible, because no one can ever know if they are following a rule correctly.
  *   **Who's Right:** **Theo.** While Nora is philosophically sound, Theo is right that this conclusion is unusable in real life. We *do* follow rules, and we *do* hold people accountable to them.

  ### Move 8: The Shrug
  **Situation:** Nora says, "Maybe that's just true."
  *   **Analysis:** She is willing to accept the philosophical nihilism to avoid admitting she was inconsistent or to avoid paying the higher bonus.
  *   **Who's Right:** **Nora (Intellectually) / Theo (Socially).** She wins the debate; he wins the room. Her shrug effectively dissolves the group's trust in any future rules she makes.

  ---

  ### What Both of Them Are Missing

  They are stuck in a trap called the **Private Language Argument**. They are both looking for the "Rule" as if it were an object hidden either in Nora's head (Theo's view) or in the abstract logic of the numbers (Nora's view).

  **The Missing Piece: The Community Practice.**
  Rules are not fixed by mental facts or mathematical inevitability. Rules are fixed by **agreement and continuation**.
  *   A rule is what the community *accepts* as the correct continuation of a practice.
  *   For the last year, the "rule" was whatever Nora said it was, and the group accepted it.
  *   Now that the group (via Theo) is *not* accepting the current application, the rule has effectively broken.

  **They are arguing about the past (what did the rule *used* to be?), but the only thing that matters is the future (what will the rule *now* be?).**

  ### The Verdict for the Referee

  If you need to settle this at midnight:

  1.  **On the Bonus:** **Split the difference.** Theo is right that the scaling feels off based on precedent. Nora is right that she never promised a specific formula. Calculate what Theo *would* have gotten under his formula, and what Nora offered. Meet in the middle. Call it a "Grand Streak Adjustment."
  2.  **On the Philosophy:** Tell Nora she wins the debate but loses the policy. Tell Theo he wins the fairness argument but loses the metaphysics.
  3.  **The Fix:** **Write. It. Down.**
      *   Tell them: "Nora, you're right that past actions don't dictate future rules. Theo, you're right that we need consistency to function. So, effective *today*, you two co-author the written policy for streaks over 20 days."
      *   This shifts the conflict from "Who is lying about the past?" to "Who gets to design the future?"

  **Summary:** Theo is right about fairness; Nora is right about metaphysics. But in a writing group, fairness keeps the members, and metaphysics kills the vibe. Side with Theo on the money, side with Nora on the philosophy, and force them to collaborate on the written rule going forward.
