          *   Narrator (User): Dragged in to referee at midnight, needs a move-by-move analysis, not just a verdict.
      *   **Task:** Go through the exchange move by move, assess who is more right at each step, and flag what both might be missing.
      *   **Tone:** Fair, analytical, philosophical but grounded in the practical context.

  2.  **Deconstruct the Exchange (Move by Move):**

      *   *Move 1: The Context/Status Quo.* Nora made a rule, applied by feel, never written down. Everyone picked it up implicitly. Streaks topped out at 18 days.
          *   *Analysis:* Implicit norms work well in small groups until edge cases arise. Nora is the "authority" by creation, but the group's acceptance gave it legitimacy.
          *   *Verdict:* Shared responsibility, but Nora holds the "authorial" intent.

      *   *Move 2: The Trigger.* Theo hits 40 days. Bonus feels too small based on the pattern of shorter streaks. He asks for the rule.
          *   *Analysis:* Reasonable request. Scaling issues are common in informal systems. 40 is an outlier compared to 18.
