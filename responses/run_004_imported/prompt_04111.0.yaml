      *   *Move 4: Theo's Counter-Proposal.* Nora says "You say what it is." His version contradicts different old scores.
          *   *Analysis:* Theo is trying to formalize a pattern. Any formalization of limited data will have multiple fits.
          *   *Verdict:* Both are stuck. Data is underdetermined.

      *   *Move 5: The Philosophical Turn (Theo).* "There has to be some fact about what rule she meant... his number is closer to it."
