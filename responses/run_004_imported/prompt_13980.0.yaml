answer: |-
  It is a pleasure to meet a fellow traveler who finds the transition from the bench to the armchair less of a retirement and more of a redeployment. Your intuition is spot-on: the "Conserved Quantity" (CQ) theory feels like home to a chemist because it treats causation as a bookkeeping exercise of the universe. Energy in, energy out, nothing lost, nothing created, just transferred.

  You have asked for the strongest possible case that omissions are **never** genuine causes, and that a Physical Process theory is right to exclude them. You also want me to confront the "Many Omissions" problem and take a stand on Dowe's "quasi-causation" patch.

  Here is the hardline defense. I am going to bite the bullet. I will argue that Dowe's patch, while well-intentioned, is indeed a concession that weakens the ontological purity of the theory. The strongest version of the Physical Process view treats omission-talk not as a "quasi" form of causation, but as a pragmatic, normative, or psychological shorthand that refers to *nothing* in the physical fabric of the world.

  ### 1. The Ontological Argument: Causation is a Physical Relation, Not a Logical One

  As an analytical chemist, you know that a mass balance sheet must close. If you start with 10 grams of reactants, you end with 10 grams of products (plus/minus experimental error). Causation, on the CQ theory, is the physical analogue of that balance sheet. It is the transmission of a mark, a signal, or a conserved quantity (energy, momentum, charge) from point A to point B.

  An omission is, by definition, the absence of an event. It is a "nothing."
  *   **Premise 1:** Genuine causation requires a physical connection (a process).
  *   **Premise 2:** A physical process requires the existence of entities/quantities to be transmitted.
  *   **Premise 3:** An omission involves no entities and transmits no quantities.
  *   **Conclusion:** An omission cannot be a genuine cause.

  To say an omission *is* a cause is to claim that "nothing" can push "something." In your lab, if a reaction failed because you *didn't* add the catalyst, the physical story isn't that "the absence of the catalyst" pushed the molecules into a stable state. The physical story is that the molecules interacted with *each other* and the *solvent* and the *thermal energy* present, following the path of least resistance because the energy barrier wasn't lowered. The "cause" of the failure was the presence of the activation energy barrier and the absence of the lowering mechanism. But the *absence* itself did no work. The work was done by the status quo.

  If we allow "nothings" into our ontology of causation, we break the link between causation and physics. We turn causation into a logical or counterfactual relation (i.e., "If X had happened, Y wouldn't have"), which is useful for humans but describes the map, not the territory.

  ### 2. The "Many Omissions" Problem: A Feature, Not a Bug

  You raised the classic reductio: If my not watering the fern causes its death, why doesn't the King of England's not watering it? Or the sky's not raining fern-food?

  Proponents of omission-causation (like counterfactual theorists) struggle mightily here. They have to invent complex rules about "normality" or "expectations" to filter out the King. They have to explain why some "nothings" count and others don't.

  The Physical Process theorist has a much cleaner solution: **None of them are causes.**

  *   **My not watering:** Not a cause.
  *   **The King's not watering:** Not a cause.
  *   **The sky's not raining:** Not a cause.

  The only genuine causes of the fern's death are the positive physical processes that *did* occur: the evaporation of water from the soil, the metabolic consumption of the plant's reserves, the cellular degradation due to turgor pressure loss. These are all positive events involving energy transfer.

  So why do we blame the sitter and not the King? **Because causation is not the only game in town.**

  We distinguish the sitter from the King based on **normative expectations** and **counterfactual dependence**, not causal ontology.
  1.  **Counterfactual Dependence:** If the sitter *had* watered the fern, it would have lived. If the King *had* watered it, it also would have lived. In this regard, they are identical.
  2.  **Normative Duty:** The sitter was *hired* to be a source of water (a causal process). The King was not.

  When we say "The sitter caused the death by not watering," we are compressing a complex reality. We are really saying: "The physical processes of dehydration killed the fern, and the sitter is the moral agent who was contractually obligated to interrupt those processes but failed to do so."

  By biting the bullet and saying omissions are not causes, the Physical Process theory actually *solves* the "Many Omissions" problem rather than patching it. It explains why the list of "causes" doesn't explode to infinity: because the list of *physical processes* is finite, even if the list of *things that didn't happen* is infinite.

  ### 3. Dowe's "Quasi-Causation": An Unnecessary Patch

  You mentioned Dowe's move to create a separate category of "quasi-causation" for omissions. You suspect it smells like "taping a spare category on the side." You are right to be suspicious.

  Dowe introduced this because he wanted to save the phenomena of ordinary language. He knew that in court, we say "omission caused the harm," and he didn't want his theory to imply that all judges and lawyers are speaking nonsense.

  However, for the strongest possible case, I argue we should reject the patch. Here is why:

  **1. It risks reifying the error.**
  By creating a category called "quasi-causation," we grant omissions a status that suggests they are *almost* real causes. This invites confusion. It suggests there is a spectrum of "causal-ness," where omissions are 50% causes. But on a physicalist view, they are 0% causes. They are ontological zeros. Calling them "quasi-causes" is like calling a unicorn a "quasi-horse." It's better to just say it's not a horse.

  **2. It conflates Ontology with Discourse.**
  We can acknowledge that omission-talk is useful without giving it a philosophical category. We use metaphors all the time. "The sun rose." We know the earth rotated. We don't need a theory of "Quasi-Rising" to accommodate the phrase. We just recognize that "sunrise" is a useful description of human experience, not astrophysical reality.
  Similarly, "The lack of water killed the fern" is a useful description of human responsibility, not physical reality. We don't need a philosophical patch for it; we just need to recognize it as pragmatic shorthand.

  **3. The "Hardline" is more scientifically honest.**
  If you are running a lab, and a reaction fails, you don't write in your notebook: "Cause of failure: Omission of catalyst." You write: "Reaction proceeded via high-energy pathway due to absence of catalytic lowering." You describe what *happened*, not what *didn't*. A theory of causation intended to align with science should demand the same rigor.

  ### 4. The Legal and Moral Objection

  This is usually where scientists feel the most resistance. You noted that people go to prison for omissions. If omissions aren't causes, how can we punish someone for "causing" a death?

  The answer lies in distinguishing **Causal Responsibility** from **Moral/Legal Liability**.

  The law is not in the business of fundamental physics; it is in the business of regulating behavior. To regulate behavior, you need to identify agents who could have intervened.
  *   **Physics asks:** "What process produced this state?"
  *   **Law asks:** "Which agent had the duty and capacity to initiate a preventing process?"

  When a mechanic goes to prison because a plane crashed due to unchecked brakes, the court is not making a metaphysical claim that "the mechanic's inaction" was a physical force that pushed the plane into the ground. The court is saying: "The physical cause was hydraulic failure. The mechanic was the designated interrupter of that causal chain. He failed to execute his function. Therefore, he bears the liability for the outcome of the chain."

  We can preserve the Physical Process theory of causation *and* support the legal verdict. We simply say the mechanic is liable for the *consequences* of his omission, not that the omission was the *physical cause*. This preserves the integrity of the scientific concept while allowing society to function.

  ### Summary of the Case

  To summarize the strongest case for your discussion group:

  1.  **Ontological Purity:** Causation is the transmission of conserved quantities. Omissions transmit nothing. Therefore, omissions are not causes.
  2.  **The "Many Omissions" Solution:** By excluding omissions, we avoid the absurdity where the King of England is a cause of every fern death. The distinction between the sitter and the King is normative (duty), not causal.
  3.  **Rejecting the Patch:** Dowe's "quasi-causation" is a diplomatic concession to ordinary language, not a metaphysical necessity. We should treat omission-talk like "sunrise" talk: useful pragmatics, false ontology.
  4.  **Law vs. Physics:** Legal liability tracks duty and counterfactual dependence, not just physical process. One can be liable for a non-event without that non-event being a physical cause.

  **The Bottom Line:**
  Your intuition from the lab is the correct one. The universe is made of events, processes, and quantities. It is not made of "failures to act." When we say an omission caused something, we are speaking a shorthand for "The normal process that usually prevents this outcome was absent, and a specific agent was responsible for maintaining that process."

  If you stick to the Hardline Physical Process view, you keep causation anchored in the physical world, where it belongs, and you leave the "nothings" to the lawyers and the moralists, who need them for their own distinct purposes. You don't need to patch the theory to accommodate them; you just need to recognize that they are playing a different game.
