          *   **Defeasibility:** Knowledge can be undone.
          *   **Circularity:** Using the belief to dismiss the test of the belief.
      *   *Section 3: The Epistemological Lesson.*
          *   **Fallibilism:** All empirical knowledge is open to revision.
          *   **Proportioning Belief:** Hume's maxim.
          *   **The Cost of Error:** In business, the cost of being wrong about honesty is high.
      *   *Section 4: Advice for the User.* How to talk to the friend? Focus on risk management, not just truth.

  6.  **Refining the Philosophical Terms:**
