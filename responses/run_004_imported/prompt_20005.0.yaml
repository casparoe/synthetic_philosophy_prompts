  8.  **Self-Correction during drafting:** I initially thought about bringing in Gettier cases. *Correction:* No, Gettier cases are about true belief without knowledge. This is about claimed knowledge ignoring evidence. Better to focus on *defeasibility* and *fallibilism*.
