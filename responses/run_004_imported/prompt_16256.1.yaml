prompt: |-
  So I fell down a logic rabbit hole this week and landed on Skolem's paradox, and it's bugging me. ZFC proves the reals are uncountable, but the Lowenheim-Skolem theorem says ZFC also has to have a countable model, so 'from outside' that model, its reals are just a countable set we could in principle list off. Doesn't that mean uncountability is basically an axiom-dependent illusion rather then an actual fact about infinity, like theres secretly a bijection between N and R hiding underneath that ZFC just can't see -- and if so, could you in principle write a program that eventually enumerates all the reals, even though no proof inside ZFC could ever certify the list is complete? Every explanation I've found online just restates the theorem and moves on without saying why this isn't a flat-out contradiction with Cantor, so I feel like I'm missing something obvious.
