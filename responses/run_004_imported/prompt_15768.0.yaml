answer: |-
  **Setting:** *A dimly lit Intensive Care Unit. The rhythmic hiss and click of a ventilator dominates the silence. In the bed lies Mr. Henderson, chest rising and falling mechanically, skin warm and pink. An organ procurement coordinator stands near the door, checking a clipboard. Two figures stand at the foot of the bed.*

  **Characters:**
  *   **Dr. Sarah Jenkins:** Defends the Whole-Brain Death standard.
  *   **Dr. David Rosenthal:** Critic of the standard, aligned with D. Alan Shewmon's empirical challenges.

  ***

  **Jenkins:** (Checking her watch) The apnea test was conclusive. No spontaneous respiratory drive. Pupils fixed. We're legally clear to proceed with the incision, David.

  **Rosenthal:** (Staring at the patient's chest) Legally, yes. Biologically? Look at him, Sarah. The capillary refill is under two seconds. He's maintaining thermoregulation. If you cut him, he'd mount a stress response. We are standing over a living human being and preparing to harvest his heart.

  **Jenkins:** We are standing over a corpse that is being artificially perfused. The "integrative unity" of the organism has collapsed. The brain is the critical system that coordinates the body's functions into a single whole. Without it, this isn't a person or an organism; it's a collection of tissues kept in a state of suspended animation by positive pressure.

  **Rosenthal:** That's the 1981 President's Commission argument. "Critical system." But D. Alan Shewmon dismantled that empirically two decades ago. He documented cases of brain-dead bodies that survived for weeks, sometimes months. They healed wounds. They fought off infections. They excreted waste. There was even the case in Israel where a brain-dead woman gestated a fetus for months until C-section. If the "integrative unity" was gone, how does a body nurture a new life?

  **Jenkins:** Because the spinal cord and peripheral ganglia can manage local reflexes. But that's not *somatic* integration; that's cellular survival. The brain provides the *global* integration. Without the hypothalamus, neuroendocrine control is lost. Diabetes insipidus is nearly universal in these cases.

  **Rosenthal:** Nearly, not always. And we can replace the hormones. But look deeper. If the definition of death is the loss of the body's ability to function as an integrated whole, and this body is integrating nutrients, fighting pathogens, and maintaining homeostasis—even if assisted by a ventilator for gas exchange—then by your own biological definition, he is not dead. To say he *is* dead, you have to be smuggling in a non-biological criterion. You're saying the *body* is alive, but the *person* is gone.

  **Jenkins:** (Shifts weight, looking at the monitor) I'm not a higher-brain theorist, David. I don't believe consciousness defines life. I believe in the organism. But an organism requires more than just cellular metabolism. It requires the capacity to interact with the environment as a unified entity. The brainstem is the gateway. When it's destroyed, the body can no longer act as a whole *in relation to the world*. It becomes a closed loop.

  **Rosenthal:** Ah. There's the revision. You started with "integrative unity" of internal functions. Now you've shifted to "capacity to interact with the environment."

  **Jenkins:** Because the internal functions are dependent on the external support. The ventilator is doing the work of the respiratory center. That's the break in the chain.

  **Rosenthal:** But the ventilator is just an external lung. If I give a pneumonia patient a ventilator, they aren't dead. The difference here is that Mr. Henderson's brainstem cannot *initiate* the breath. But his heart, his kidneys, his immune system—they are responding to the environment. They are adapting. Shewmon's point was precisely this: if you claim death is biological, you must point to the cessation of biological integration. If you point instead to the loss of the *drive* to breathe or the loss of *interaction*, you are no longer talking about biology. You are talking about agency. Or personhood.

  **Jenkins:** (Sighs) Fine. Let's grant that somatic integration can persist transiently. But it is unstable without the brain. It's a dying process, not a living state. The organism *as a whole* has ceased because the *control* has ceased.

  **Rosenthal:** "Control." That's the slippery word. Let's test this revision. Take a patient in a Persistent Vegetative State (PVS). Their cerebral cortex is devastated. They have no awareness, no capacity to interact with the environment in any meaningful sense. They cannot reason, speak, or recognize. But their brainstem is intact. They breathe spontaneously. By your revised standard—"capacity to interact as a unified entity"—the PVS patient lacks that capacity just as much as Mr. Henderson here.

  **Jenkins:** But the PVS patient breathes on their own. That spontaneous drive signifies the organism is still driving the bus.

  **Rosenthal:** That's a distinction without a difference. In both cases, the "person" is gone. In both cases, the body is biologically active. If you declare Mr. Henderson dead because he lacks the *brainstem drive*, but keep the PVS patient alive because they have the *brainstem drive*, you aren't defining death based on the *organism's* integration. You're defining it based on the presence of a specific anatomical structure. Why is that structure the magic line?

  **Jenkins:** Because it's the seat of the reflex arc that sustains life without external machinery.

  **Rosenthal:** But we *are* using external machinery. And if we remove the machinery, Mr. Henderson's heart stops in minutes. If we remove the feeding tube, the PVS patient's heart stops in weeks. Both die from the withdrawal of support. The only difference is the timing. If death is a biological state, it shouldn't depend on whether we choose to turn off a machine.

  **Jenkins:** (Quieter) The law requires a bright line, David. We have organs waiting. Three recipients. If we wait for circulatory death, the heart will be damaged by ischemia. We lose the chance to save them.

  **Rosenthal:** And that is the honest argument. You are arguing for the *utility* of the definition, not the *truth* of it. You need him to be dead so you can take the heart. If you admit he is biologically alive, you have to admit you are killing him to save others. That's a moral calculus, not a medical finding.

  **Jenkins:** I am not killing him. He is already gone. The "he" that mattered—the agent, the self—that ended with the herniation. The body is a shell. To insist on calling it "alive" because the kidneys filter blood is a fetishization of biology over humanity.

  **Rosenthal:** There it is. "The 'he' that mattered." Now you're sounding like a higher-brain theorist. You've abandoned the "organism as a whole" argument. You're saying the *biological organism* is still here, but the *moral person* is not. That's a coherent position, Sarah. But it's not the position of the Uniform Determination of Death Act. The Act claims this is *biological* death. It claims the *organism* has died. Shewmon showed the organism hasn't died. So we are left with a lie. We are telling the public that biology has ceased so we don't have to admit we are making a moral exception for organ transplantation.

  **Jenkins:** (Looks at the ventilator bellows rising) If we adopt your view, we halt transplants. We wait for the heart to stop. People die on the waiting list. Is your commitment to biological purity worth those lives?

  **Rosenthal:** My commitment is to truth. If we need organs, let's have the honest debate about sacrificing one living patient to save others. Don't hide behind a definition of death that the physiology contradicts.

  **Jenkins:** And if we adopt your view, we treat this body as a patient. We pour resources into a corpse. We deny closure to the family. We treat the shell as if it has rights.

  **Rosenthal:** It's not a corpse. That's the point.

  *(A nurse enters to administer heparin. The sound of the syringe plunger clicking is loud in the room.)*

  **Jenkins:** (Watching the nurse) The family has said their goodbyes. They understand he is dead.

  **Rosenthal:** They understand he will never wake up. That is not the same thing as being dead.

  **Jenkins:** In the end, David, death isn't just a moment in the cells. It's a status we confer. When the integration that matters is gone, we confer the status.

  **Rosenthal:** And who decides which integration "matters"? The transplant surgeon? The ethicist? If it's a status we confer, then it's social, not biological. And if it's social, it's revocable. It's arbitrary.

  **Jenkins:** (Turns to leave) It's the only line that works.

  **Rosenthal:** It's the only line that allows the harvest.

  *(Jenkins pauses at the door, hand on the frame. She looks back at the rising chest, then out into the hallway. The ventilator hisses, a mechanical breath filling a lung that cannot ask for air.)*

  **Jenkins:** Prep the OR.

  *(She exits. Rosenthal remains, watching the monitor. The heart rate is steady, 78 beats per minute. He does not move until the orderly begins to disconnect the lines.)*
