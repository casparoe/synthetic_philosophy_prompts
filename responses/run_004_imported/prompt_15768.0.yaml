      *   **Speaker 2 (Anti-Whole-Brain/Shewmon-style):** Must press the empirical challenge (homeostasis, wound healing, gestation on ventilators). Must argue this forces Speaker 1 into a covert higher-brain/personhood criterion. Must test revisions against Persistent Vegetative State (PVS) cases.
      *   **Ending:** No artificial resolution. End where the real disagreement bites (the philosophical core).
      *   **Tone:** Professional, respectful, intellectually rigorous, reflecting the user's background (physiologist turned bioethicist reader).

