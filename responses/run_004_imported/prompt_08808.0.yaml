answer: |-
  You have correctly identified that the "Kepler was an astrologer" soundbite is a historical flattening of a much more complex intellectual position. Your uncle is technically correct that Kepler practiced astrology, but he is incorrect to imply that Kepler's astrology resembles the system modern astrologers (or his contemporaries) used.

  Kepler did not merely "keep the parts he liked." He attempted a radical reconstruction of astrology based on the same Neoplatonic and geometric principles that drove his astronomy. He sought to naturalize astrology, stripping it of superstition and grounding it in physics (as physics was understood then).

  Here is the detailed reconstruction of where Kepler drew the line, the argument he used to justify it, and how you can explain the substance of his position.

  ### 1. The Line in the Sand: Arbitrary Conventions vs. Natural Geometry

  To understand Kepler's argument, you must first understand what he discarded. In *De Fundamentis Astrologiae Certioribus* (On the More Certain Fundamentals of Astrology, 1601), Kepler launches a systematic attack on the "Chaldean" or traditional apparatus of astrology.

  **What he rejected:**
  *   **The 12 Zodiac Signs:** Kepler argued that the zodiac constellations are arbitrary human inventions. The stars in a constellation are not physically related; they are at vastly different distances from Earth. Dividing the ecliptic into 12 equal signs of 30 degrees is a human convention, not a feature of nature.
  *   **The Houses:** The division of the sky into 12 "houses" (sectors determining different areas of life like marriage, career, death) was, to Kepler, mathematically arbitrary. There was no physical reason why a planet being 10 degrees above the horizon should mean something different than it being 20 degrees above.
  *   **Planetary Dignities and Exaltations:** The idea that Mars "rules" Aries or is "exalted" in Capricorn was dismissed as "old wives' tales" with no causal mechanism.

  **The Argument:** Kepler's critique was ontological. He argued that **effects must have natural causes.** If the zodiac signs are imaginary lines drawn by Babylonians, they cannot physically move matter on Earth. To believe otherwise was superstition, not science.

  ### 2. The Retention: Aspects as Harmonic Archetypes

  If the signs and houses are arbitrary, what remains? Kepler kept the **aspects**.

  In astrology, an aspect is the angle formed between two planets as viewed from Earth (e.g., a conjunction is 0°, a sextile is 60°, a square is 90°, a trine is 120°, an opposition is 180°).

  **Kepler's Argument for Aspects:**
  Kepler believed that the universe was constructed by God according to geometric archetypes. This is the core thesis of his *Mysterium Cosmographicum* and later *Harmonice Mundi* (The Harmony of the World).

  1.  **Geometry is Real:** Unlike the zodiac signs, geometric angles are universal truths. A 90-degree angle is the same everywhere in the universe. It exists in the mind of God and in the structure of reality.
  2.  **Musical Harmonics:** Kepler discovered that these specific astrological aspects correspond to musical consonances.
      *   60° (Sextile) ≈ Major Third
      *   90° (Square) ≈ Fourth
      *   120° (Trine) ≈ Fifth
      *   180° (Opposition) ≈ Octave
  3.  **The Inference:** Because these angles correspond to harmonic ratios (whole number ratios), they possess a "virtue" or power. They are not just lines of sight; they are resonant frequencies in the cosmic structure.

  Therefore, Kepler argued, aspects are the only part of astrology that *could* possibly work, because they are the only part grounded in the actual physics (harmonics/geometry) of the cosmos.

  ### 3. The Mechanism: The *Anima Terrae* (Soul of the Earth)

  This is the most critical part of Kepler's argument and the piece most often missing from pop-history summaries. Even if aspects are geometrically real, **how do they affect a human being born in Vienna?**

  Traditional astrology posited "rays" or occult fluids emitted by planets. Kepler rejected this. Planets are dark, heavy bodies (he knew this better than anyone); they do not shoot magical beams.

  Instead, Kepler proposed a **meteorological mechanism mediated by the Earth's Soul.**

  1.  **The Earth is Alive:** Drawing on Neoplatonism and William Gilbert's *De Magnete*, Kepler believed the Earth possessed a faculty of perception, an *Anima Terrae* (Soul of the Earth).
  2.  **Geometric Perception:** This Earth-Soul does not "see" the planets; it perceives the **geometry** formed by the planets. When Mars and Saturn form a 90-degree angle, the Earth-Soul "feels" this geometric tension, much like a human ear feels a dissonant chord.
  3.  **Physical Reaction:** In response to this geometric stimulus, the Earth-Soul triggers physical changes within the Earth's body. This manifests as changes in the atmosphere, weather, heat, cold, moisture, and dryness.
  4.  **Humoral Influence:** These weather changes affect the "humors" of living creatures (the balance of blood, phlegm, black bile, yellow bile).
  5.  **Human Disposition:** The altered humors influence human temperament and inclination (e.g., making people more irritable or sluggish), which *statistically* influences human events.

  **The Substance of the Position:** Kepler was not arguing that Mars *makes* you go to war. He was arguing that a specific planetary geometry disturbs the Earth's atmosphere, which alters your bodily humors, which makes you more prone to anger, which *might* lead to conflict. It is a chain of natural causation, not magical determinism.

  ### 4. The Economic Compromise vs. Principled Belief

  You asked whether this was a face-saving compromise. The answer, found in his 1610 pamphlet *Tertius Interveniens* (The Third Man Intervening), is **both.**

  Kepler is famously candid about his financial motivation. He writes:

  > *"Mother Astronomy would certainly starve if Daughter Astrology did not earn the money."*

  He acknowledges that he casts horoscopes for patrons (like Wallenstein and Emperor Rudolf II) to fund his astronomical research. However, it is incorrect to say he *only* did it for money.

  *   **Principled:** He genuinely believed the geometric/harmonic mechanism described above was physically plausible within his Neoplatonic framework. He spent years trying to correlate weather data with planetary aspects to verify this.
  *   **Compromise:** He knew his "reformed astrology" was probabilistic and vague, whereas his patrons wanted specific predictions (e.g., "Will the Turks attack?"). He walked a tightrope, giving patrons enough "astrology" to keep the funding while privately maintaining that most specific predictions were guesswork.

  ### 5. How to Explain This at the Dinner Table

  When your uncle brings up Kepler, you don't need to say "it's complicated." You can say this:

  > "Actually, Kepler is the worst example for modern astrology. He explicitly called the zodiac signs and horoscope houses 'arbitrary superstitions' with no basis in nature. He only kept the planetary angles because he thought they were geometric harmonics, like musical chords.
  >
  > "Furthermore, he didn't think planets shot rays at us. He thought the Earth itself had a soul that reacted to planetary geometry by changing the weather, which then affected our moods. He was trying to turn astrology into meteorology. So, citing Kepler doesn't validate horoscopes; it validates the idea that astronomers should try to find physical causes for everything—which is exactly why he rejected most of astrology."

  ### Summary of Kepler's "Reformed Astrology"

  | Feature | Traditional Astrology (Rejected by Kepler) | Keplerian Astrology (Accepted by Kepler) |
  | :--- | :--- | :--- |
  | **Zodiac Signs** | Real influences based on constellations. | Arbitrary human divisions; physically meaningless. |
  | **Houses** | Determine specific life events (marriage, death). | Arbitrary spatial divisions; rejected. |
  | **Aspects** | Mystical relationships between planets. | **Geometric harmonics** (musical ratios); the only real influence. |
  | **Mechanism** | Occult rays or fluids from planets. | **Earth-Soul** perceives geometry $\rightarrow$ Weather $\rightarrow$ Humors. |
  | **Prediction** | Deterministic (This *will* happen). | Probabilistic/Inclinational (This *might* be favored). |
  | **Goal** | Divination and fortune-telling. | Understanding cosmic physics and harmony. |

  ### The Verdict

  Kepler's position was principled within his own metaphysical framework. He was a Neoplatonist who believed "Number and Geometry are the Archetypes of the World." Therefore, any astrology based on *number and geometry* (aspects) was potentially valid, while any astrology based on *mythology and convention* (signs, houses, gods) was nonsense.

  He was not defending the uncle's astrology. He was defending a proto-scientific hypothesis that the solar system functions as a resonant harmonic system, the effects of which are mediated by the Earth's atmosphere. That hypothesis turned out to be wrong (the Earth has no soul, and planetary angles don't drive weather), but the *argument* was a serious attempt to reconcile physics with cosmology, not a blind adherence to tradition.
