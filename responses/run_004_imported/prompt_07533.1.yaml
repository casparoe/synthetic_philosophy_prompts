prompt: |-
  I'm currently taking a seminar on modal epistemology, and I've been asked to interview a guest speaker for our department's philosophy podcast: a philosopher known for defending modal rationalism -- the thesis that a scenario's ideal, positive conceivability licenses an inference to its metaphysical possibility -- and for using this thesis to underwrite the zombie argument against physicalism. Draft eight to ten interview questions that go beyond having her restate the position: I want at least one question each on the general worry that mere imaginative exercises could ever track a mind-independent modal reality, on how two-dimensional semantics is supposed to defuse Kripkean a posteriori necessities such as 'water is H2O' without thereby also defusing the zombie argument, and on the 'strong necessities' objection that some necessary truths might have negations that remain ideally conceivable -- and for each, include a follow-up keyed to the answer she's most likely to give.
