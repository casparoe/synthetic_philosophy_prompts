      *   *Emphasis:* Make sure to highlight that Tolstoy's definition of "Good Art" is actually a combination of both. "Art" = Infectious. "Good Art" = Infectious + Christian Feeling. "Bad Art" = Infectious + Non-Christian Feeling. The friend's confusion might stem from the word "Art" being used loosely.

