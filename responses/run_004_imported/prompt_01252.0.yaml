answer: |-
  This is a sophisticated dispute that cuts to the heart of Tolstoy's aesthetic theory. Your friend has identified a structural feature of *What Is Art?* that has puzzled critics for over a century, but your intuition that there might be a deeper connective tissue—specifically through "sincerity" and "religious perception"—is also well-founded.

  Here is a breakdown of the logical mechanics of that passage, the relationship between the two axes, and how Tolstoy would actually handle a case like *Triumph of the Will*.

  ### 1. The Logical Structure: Two Axes or One?

  Your friend is **structurally correct**, but perhaps **philosophically incomplete**.

  In the passage you cited (Chapter XV), Tolstoy explicitly performs a categorical distinction. He is separating the *ontology* of art (what makes it art) from the *ethics* of art (what makes it good).
  *   **Axis A (Formal/Technical):** Infectiousness. Determined by Individuality, Clearness, and Sincerity. This determines if a work is *Art* or *Counterfeit Art*.
  *   **Axis B (Moral/Content):** Religious Perception. This determines if the Art is *Good* or *Bad*.

  Tolstoy writes: *"thus is the quality of art, as art, decided, independently of its subject-matter."* He is adamant here. He needs this separation because if "Good Art" were defined solely by moral content, then a morally perfect sermon that bored everyone to tears would be "Great Art." Tolstoy refuses this. For him, if it doesn't infect, it isn't art at all.

  However, your friend claims there is "no principled way of weighing one against the other." This is where your skepticism is warranted. Tolstoy does have a weighting system, though it is utilitarian rather than aesthetic.

  For Tolstoy, **Infectiousness is a multiplier.**
  *   If the Content is Good (Christian/Universal), high Infectiousness makes it *better*.
  *   If the Content is Bad (Exclusive/Nationalist/Erotic), high Infectiousness makes it *worse*.

  So, while the criteria are distinct, they are not unweighted. A highly infectious work of "Bad" content is more dangerous and therefore more negatively valuable than a crude work of "Bad" content.

  ### 2. Does "Sincerity" Bridge the Gap?

  You asked if "sincerity" ties the technical axis back to the moral axis. This is the most subtle point in Tolstoy's theory.

  **The Argument for Independence:**
  Tolstoy defines sincerity as *"the greater or lesser force with which the artist himself feels the emotion he transmits."* Psychologically, a fascist can feel the emotion of national glory with immense force. A pornographer can feel lust with immense force. In the Chapter XV passage, Tolstoy treats sincerity as a psychological fact, not a moral one. He admits that artists of "bad" art often possess high sincerity. Therefore, logically, the axes remain independent. A work can be technically perfect (highly sincere) and morally repugnant.

  **The Argument for Connection (Your Intuition):**
  Later in the treatise, Tolstoy suggests that moral corruption *causes* artistic insincerity. He argues that when an artist serves an exclusive, upper-class, or nationalist agenda, they are often posturing. They are trying to impress a specific clique rather than unite all humanity. Therefore, their art becomes affected, obscure, or imitative (i.e., insincere).

  In Tolstoy's ideal metaphysics, Truth, Goodness, and Beauty are unified. He *wants* to believe that you cannot be truly sincere about evil because evil is a form of falsehood. However, in the practical application of his theory (specifically in Chapter XV), he concedes that evil feelings *can* be transmitted sincerely.

  **Verdict:** The text does not support the idea that Sincerity *logically necessitates* Good Content. Tolstoy admits that "Bad Art" exists as a category of *genuine* art. If Sincerity automatically guaranteed Good Content, "Bad Art" would be impossible; everything sincere would be good, and everything bad would be insincere (counterfeit). Since Tolstoy maintains the category of "Bad Art," he must admit that one can be sincerely evil.

  ### 3. The *Triumph of the Will* Test Case

  Would Tolstoy classify Riefenstahl's film as genuine art? **Yes.**

  Here is how he would categorize it based on his own definitions:
  1.  **Infectiousness:** *Triumph of the Will* is cinematically overwhelming. It transmits feelings of awe, unity, and power with extreme Clearness and Individuality. Tolstoy would likely concede it has high Sincerity (Riefenstahl was clearly committed to the vision). **Result: It is Art.**
  2.  **Subject-Matter:** Tolstoy defines the "Religious Perception of the Age" as Christian universalism—the brotherhood of man. He explicitly condemns patriotism and nationalism as "superstitions" that prevent this unity. *Triumph of the Will* is the apex of nationalist exclusion. **Result: It is Bad Art.**

  **Is this a bullet he can bite?**
  Tolstoy bites this bullet repeatedly. In fact, he spends much of the book condemning works that were universally acclaimed as "Great Art" (Shakespeare, Wagner, Beethoven, his own *War and Peace*) by classifying them as **Bad Art**.

  He distinguishes between:
  *   **Counterfeit Art:** Fake art that tries to manipulate without transmitting feeling (e.g., he might classify a generic propaganda poster that no one actually feels anything from as counterfeit).
  *   **Bad Art:** Genuine art that transmits feelings contrary to the religious perception of the age (e.g., patriotic operas, erotic novels, *Triumph of the Will*).

  For Tolstoy, **Bad Art is worse than Counterfeit Art.** Counterfeit art is just noise; it does nothing. Bad Art actively corrupts the soul because it works *too well*. It uses the powerful vector of infectiousness to drive humanity in the wrong direction.

  So, the theory does not break. It actually accounts for this precisely. The horror of *Triumph of the Will*, for Tolstoy, would not be that it is "not art," but that it is **too much art.** Its technical perfection makes its moral failure catastrophic.

  ### 4. Resolution for Your Argument

  Your friend is right that Tolstoy operates with two standards. If you try to judge *Triumph of the Will* using only Axis A, it is a masterpiece. If you use only Axis B, it is a crime. Tolstoy insists you must use both.

  However, your friend is wrong to suggest this allows Tolstoy to "have things both ways" in a slippery manner. He isn't dodging the contradiction; he is embracing a **vector theory of value**.
  *   **Art** is the vector.
  *   **Infectiousness** is the magnitude.
  *   **Religious Perception** is the direction (Positive/Universal or Negative/Exclusive).

  A high-magnitude vector in a negative direction is not "Good Art that is morally bad." It is **"Bad Art."** Tolstoy reserves the term "Good Art" exclusively for works that succeed on *both* axes.

  **How to reply to your friend:**
  Acknowledge that she is correct about the textual distinction in Chapter XV. Tolstoy *does* separate the definition of art from the evaluation of its worth. However, point out that this doesn't let him off the hook; it actually makes his condemnation of works like *Triumph of the Will* more severe. He doesn't dismiss them as "not art" to avoid dealing with their power. He admits they are art, admits they are powerful, and *then* condemns them as dangerous weapons. The "split" isn't a loophole; it's the mechanism by which he argues that powerful evil art is more harmful than weak evil art.

  **How to reply to yourself:**
  Your hope that "Sincerity" bridges the gap is morally appealing but textually unsupported. Tolstoy is a realist about human psychology: he knows people can be sincerely devoted to false idols. The unity he seeks is eschatological (in the Kingdom of God), not present in the mechanics of artistic production. The tension remains, but it is a feature of his theory, not a bug. He wants us to feel the pull of the "Bad Art" (because it is sincere and infectious) and consciously reject it based on our religious perception. That struggle *is* the moral work he wants art to provoke.
