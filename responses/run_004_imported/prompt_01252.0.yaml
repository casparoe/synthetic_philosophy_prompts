      *   *Sincerity:* Be careful not to overstate the link. Tolstoy does think moral corruption leads to affectation, but he allows for sincere evil.
      *   *Riefenstahl:* Be specific. Tolstoy hated patriotism. *Triumph* is peak patriotism. It fits his "Bad Art" category perfectly.

  5.  **Final Polish:** (Self-Correction during drafting)
