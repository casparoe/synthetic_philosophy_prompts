      *   **Reason 2: Commitment/Delegation.** SPIs rely on delegating to an agent (algorithm, lawyer, subordinate) that *cannot* deviate. In real geopolitics or business, leaders often retain veto power or face domestic pressure to deviate. Can you truly bind your agent?
      *   **Reason 3: Defining the Status Quo.** SPIs compare against a specific baseline (usually a Nash Equilibrium). In real life, the "status quo" is fuzzy. Is it war? Is it sanctions? Is it a specific equilibrium of a repeated game? If we disagree on the baseline, we disagree on whether it's an improvement.
      *   **Reason 4: Complexity/Computational Tractability.** Finding an SPI might be computationally hard in complex games.
      *   **Reason 5: Asymmetry & Power.** SPIs assume a certain symmetry in the ability to modify the game. If one side is much stronger, they might prefer the default game where they win big, rather than an SPI where they win a bit less but safely.
      *   **Reason 6: The "Trust" isn't fully eliminated.** You need to trust that the other side *actually implemented* the SPI constraint on their agent. Verification is hard.
      *   **Reason 7: Multipolar vs. Bipolar.** SPI theory is mostly bilateral. Moloch traps are often $N$-player. Generalizing SPIs to $N$-players is much harder (coalition formation issues).

