      *   *What are SPIs?* They come from the paper "Safe Pareto Improvements for Delegated Game Playing" (Oesterheld & Conitzer, 2021/2022).
      *   *The Setup:* Principals delegate to agents. Agents play a game. Principals can instruct agents to play a *subset* of strategies or a *transformed* game.
      *   *The Guarantee:* If both principals agree to the transformation, the resulting equilibrium (or outcome) is guaranteed to be at least as good as the default equilibrium for both, regardless of uncertainty.
      *   *The Catch:* It requires *agreement* on the transformation. It requires the ability to *commit* agents to specific subgames/strategies. It assumes the default outcome is known/defined (usually a Nash Equilibrium).
      *   *Moloch/Multipolar Traps:* These involve many actors, often asymmetric info, dynamic settings, entry/exit, and lack of central coordination.

  3.  **Analyze the Gap between Theory and Reality:**
