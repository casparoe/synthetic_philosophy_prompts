      *   *Check against prompt:* Did I identify assumptions? Yes (SSA, Uniformity). Did I engage an objection? Yes (SIA). Did I reach a conclusion? Yes.
      *   *Self-Correction during drafting:* I need to make sure I don't get bogged down in the math of Bayesian updating. Keep it conceptual. Ensure I clearly distinguish between SSA (DA's engine) and SIA (the brake).

  7.  **Final Review:** (Mental check of the drafted essay)
