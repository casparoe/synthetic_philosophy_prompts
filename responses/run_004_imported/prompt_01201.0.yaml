answer: |-
  This is a strong, concise draft that identifies a significant fault line in revisionist just war theory. You have successfully distilled a complex debate into a clear argument. Below are comments addressing your three specific questions.

  ### 1. Accuracy of Representation
  You have represented McMahan's position accurately, particularly the core distinction between *liability* and *blameworthiness*. Your summary of the "poisoned drink" analogy and its application to the epistemic objection is standard and correct.

  The only nuance worth tightening concerns McMahan's willingness to categorize adult combatants as "nonresponsible threats." While McMahan acknowledges that *invincible ignorance* could theoretically render a combatant a nonresponsible threat (and thus not liable), he is generally reluctant to concede this in practice. In *Killing in War*, he argues that most adult combatants retain sufficient agency and access to information that their ignorance is rarely "invincible" enough to strip them of liability entirely. He prefers to categorize them as *excused* but *liable*.

  However, your essay correctly identifies that this reluctance creates the tension. If he admits the *possibility* that invincible ignorance removes liability (as he does in his discussion of child soldiers and nonresponsible threats), he opens the door to the argument that many ordinary conscripts fit that description. You are not misrepresenting him; you are pressing him on the consistency of his criteria for moral responsibility.

  ### 2. Validity of the Tension
  This is a genuine and potent problem for the view. You have correctly identified that the distinction between an "excused agent" (liable) and a "nonresponsible threat" (not liable) hinges on the degree of moral responsibility the agent bears for posing the threat.

  McMahan's likely defense would be that ordinary combatants, unlike the drugged person or the young child, possess the *capacity* for moral reasoning and have a duty to inform themselves, even if structural factors make it difficult. He would argue that the conscript retains *some* responsibility for their beliefs, whereas the drugged person retains *none*.

  Your counter-argument—that heavy propaganda, indoctrination, and lethal discipline can reduce the conscript's agency to a level comparable to the drugged person—is the strongest part of your draft. This suggests the distinction is indeed a matter of degree rather than kind. If liability tracks responsibility, and responsibility is diminished by epistemic constraints, then liability must be diminished proportionately. By trying to maintain a binary (liable vs. not liable) rather than a scalar account of liability, McMahan risks the charge of ad hocery you describe. You might strengthen this point by explicitly noting that liability seems to be a *scalar* concept (one can be more or less liable), whereas McMahan often treats it as binary in a way that serves his critique of MEC.

  ### 3. Secondary Literature
  This line of criticism is well-trodden ground, primarily under the banner of the **"Epistemic Objection"** to revisionism.

  *   **Seth Lazar:** This is the most important name for you to know. In *Sparing Civilians* (2015) and various papers (e.g., "The Morality and Law of War"), Lazar argues that epistemic limitations prevent the clean assignment of liability McMahan requires. Lazar contends that because soldiers cannot reliably distinguish just from unjust causes, we must treat them as having equal rights, effectively defending a version of MEC based on epistemic constraints rather than moral equality. Your argument aligns closely with Lazar's critique that McMahan underestimates the exculpatory power of ignorance.
  *   **David Rodin:** In *War and Self-Defense* (2002), Rodin raises early concerns about the analogy between individual self-defense and war, touching on the epistemic difficulties of assigning liability in collective conflict.
  *   **Adil Ahmad Haque:** Haque engages deeply with McMahan on liability. In *Law and War* (2017), he discusses the epistemic conditions for liability and offers a nuanced view that might help you refine the "principled line" question.
  *   **Helen Frowe:** In *Defensive Killing* (2014), Frowe analyzes the distinction between liable and nonresponsible threats. She might offer resources on whether the "drugged person" analogy truly maps onto the "ignorant soldier."

  **Recommendation:** You should explicitly cite **Seth Lazar**. Your argument is essentially a specific iteration of Lazar's broader epistemic critique, focused specifically on the internal consistency of McMahan's categories of responsibility. Acknowledging this will situate your essay within the ongoing debate and strengthen its philosophical weight.

  ### Summary Suggestion
  Your draft is excellent. To improve it, consider adding a sentence acknowledging that while McMahan admits the *theoretical* possibility of invincible ignorance removing liability, he resists it *practically*. This shows you understand the full scope of his view before delivering your critique that his practical resistance undermines his theoretical commitments.
