  Validate Josh's point that flat assertions undermine the group's scoring methodology and that "lucky hits" shouldn't be treated as skilled forecasts. However, adopt Priya's framing: Maya was not *blameworthy* for trusting her source, but her assertion was *methodologically defective* for this specific group. Encourage Maya to translate her "basically dead" intuition into a percentage (e.g., 85%) next time, which satisfies both the epistemic humility Priya wants and the scoring rigor Josh wants.
