      *   *Victim:* The master clockmaker, Elias Thorne.
      *   *Cause of Death:* Needs to be ambiguous enough for two theories. Poison? Blunt force? Let's go with a fall, but complicated by timing. Or perhaps an apparent suicide that looks like murder, or vice versa.
      *   *The "Elegant" Solution:* A classic motive (greed/revenge), a clear method, a single culprit who benefited directly. A "whodunit" in the Agatha Christie sense.
      *   *The "True" Solution:* An accident, a coincidence, or a chain of unrelated events that *look* connected. This hits the "Bad Lot" objection (the true explanation wasn't considered because it's too mundane/messy).

  4.  **Developing the Scenario:**
