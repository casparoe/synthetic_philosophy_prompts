      *   *If she is a culprit, Adelaide should find her.*
      *   *The Philosophical Point:* Adelaide picks the *elegant* murder theory (Julian). The truth is an *inelegant* accident that was *misinterpreted* as murder by everyone, including the police, but for the wrong reasons.
