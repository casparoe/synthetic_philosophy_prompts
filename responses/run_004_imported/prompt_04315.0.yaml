      *   *Section 2: The Conclusion (Dualism vs. Awareness).* Distinguish between the phenomenological claim (awareness) and the metaphysical claim (substance). Explain Avicenna's goal (proving the soul's substantiality).
      *   *Section 3: Avicenna vs. Descartes.* Compare the *Cogito* and the *Flying Man*. Highlight the "Doubt vs. Intuition" distinction.
