      *   *Value Pluralism:* "Lives saved" isn't the only good. Community cohesion, personal responsibility, and relational bonds are also goods. The brother values these; the user values aggregate welfare.
      *   *Agency and Trust:* There is a psychological difference between trusting a model and trusting a person.

