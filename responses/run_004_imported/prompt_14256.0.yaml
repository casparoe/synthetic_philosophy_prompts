answer: |-
  The lecture hall at St. Andrews was emptying out, the hum of the projector cooling down. Outside, the Scottish rain was doing its best to blur the world into a grey continuum. Sarah leaned against the back wall, swirling the last of the workshop wine, while Elena packed her notebook into a leather satchel that looked exactly like the one she'd had ten years ago in Berkeley.

  "That talk was a mess," Sarah said. "Trying to save contextualism by appealing to interest-relative invariantism? He's just moving the sharp boundary to the speaker's intentions."

  Elena zipped the bag. "At least he admits the boundary moves. You still think it's sitting there, fixed, waiting for us to trip over it?"

  "Fixed by usage, Elena. Not by metaphysics. There's a difference."

  "Is there?" Elena slung the bag over her shoulder. "Come on. Let's get out of this rain. We can continue this at the hotel bar. I want to hear how you're handling the margin-for-error objection these days. Last I read, you were still relying on the reliability condition."

  They walked in silence for a block, the rain drumming on their umbrellas. Inside the bar, they found a corner booth, ordered whiskies, and picked up exactly where they'd left off in 2014.

  "Okay," Elena said, setting her glass down. "Let's skip the Sorites induction. We both reject it. We both keep classical logic. We both think 'Heap(n) or not Heap(n)' is true for every $n$. The daylight between us is supposed to be about *why* the inductive premise fails. You say it's false because there's a sharp cut-off we can't know. I say it's false because it's not supertrue."

  "Right," Sarah said. "So, hit me. What's the objection this year?"

  "The justification for the Margin for Error principle," Elena said. "Williamson argues that knowledge requires safety. If I know $n$ is a heap, then $n+1$ must be a heap, because I can't discriminatively tell the difference. Therefore, the cut-off must be further up. But Sarah, isn't that just asserting the conclusion? You're saying knowledge requires a margin *because* there is a sharp boundary. But if vagueness is genuinely semantic indeterminacy, then I don't need a margin. I just lack a truth value to know."

  Sarah shook her head. "You're framing it as semantic. I'm framing it as cognitive. Look, the concept 'heap' is grounded in our discriminatory capacities. If our discrimination is fuzzy, the knowledge boundary must be inside the region where discrimination is reliable. If the cut-off were at $n$, and I believed $n$ was a heap, but $n$ was indistinguishable from $n-1$, my belief would be unsafe. It's not that I'm stipulating a margin; it's that knowledge *is* a state that requires a buffer against error."

  "But why?" Elena leaned in. "Why does the inability to distinguish $n$ from $n+1$ entail that I cannot *know* $n$ is a heap? Why doesn't it entail that 'n is a heap' is indeterminate? You're borrowing the plausibility of 'I can't tell' to support the epistemic view, but the natural reading of 'I can't tell' is that there's nothing *to* tell. You're converting semantic indeterminacy into epistemic ignorance by fiat."

  "I'm not converting it," Sarah countered. "I'm explaining why the semantic intuition is misleading. The intuition that there's 'nothing to tell' comes from the fact that we can't locate the boundary. But the inability to locate doesn't mean the boundary isn't there. Think of a digital image. Zoom in enough, you hit a pixel. You can't say exactly where the edge of the circle is within the pixel, but the pixel is either on or off. Our cognitive access is low-resolution. The Margin for Error principle just formalizes that low resolution. It's not fiat; it's a constraint on knowledge in a world of coarse-grained perception."

  "Coarse-grained perception of what?" Elena pressed. "Of usage? But usage doesn't dictate a single number. If I ask a thousand speakers, I get a distribution. You're saying there's a fact of the matter about which grain in that distribution is the *true* cut-off, determined by... what? Causal history? Micro-physical states of speakers' brains?"

  "Usage patterns fix the extension," Sarah said. "Just not in a way that maps neatly to our introspection. The fact that we can't identify the cut-off is a feature of the concept, not a bug in reality. And honestly, Elena, your view has a hole big enough to drive a truck through. Admissibility."

  Elena smiled, expecting this. "Here we go."

  "You say a sentence is supertrue if it's true on all admissible precisifications," Sarah said. "Fine. But what fixes the set of admissible precisifications? Is the boundary between 'admissible' and 'inadmissible' sharp?"

  "If it were sharp," Elena said, "we'd have first-order vagueness about 'admissible,' which is fine. We can handle that."

  "No, listen," Sarah said. "If the set of admissible precisifications is sharply bounded, then you've just relocated the sharp boundary to the meta-language. You haven't dissolved vagueness; you've just hidden it in the selection function. If the set is *not* sharply bounded—if it's vague which precisifications are admissible—then supertruth becomes vague. And if supertruth is vague, you need a super-supertruth to define it. You're facing an infinite regress of higher-order vagueness unless you eventually stop at a sharp cut-off of precisifications. So, either you admit a sharp boundary at the meta-level, or you lose classical logic at the higher orders."

  Elena took a sip of whisky, buying a second. "I concede the set of admissible precisifications is vague. I'm not going to be an epistemicist about admissibility. But I don't need a sharp boundary there to save classical logic for the object language. We can model higher-order vagueness by iterating the supervaluation operator. We define validity globally. A sentence is determinately true if it's true on all admissible precisifications. It's determinately determinately true if it's true on all admissible precisifications of the admissible precisifications."

  "But does that chain stop?" Sarah asked. "Williamson's argument applies to you too. If there's a transition from 'determinately true' to 'not determinately true,' there's a boundary. If you deny that boundary is sharp, you're denying classical logic for the determinacy operator. If you accept it is sharp, you're an epistemicist about determinacy."

  "I'm not an epistemicist," Elena said firmly. "Because the boundary isn't a *fact* I'm ignorant of. It's a feature of the model. Look, Sarah, the advantage of my view is penumbral connections. If $x$ is borderline bald, and $y$ has less hair than $x$, your view struggles to explain why it's necessarily true that if $x$ is bald, $y$ is bald. For you, that's just a lucky coincidence of where the cut-off landed. For me, it's built into the logic. Every admissible precisification respects the penumbral connections. That's why the inductive premise *seems* true. It's valid on every precisification, even if not supertrue."

  Sarah nodded slowly. "I'll give you that. Penumbral connections are the hardest part for epistemicism. I have to argue that usage constraints make it highly improbable that the cut-off violates those connections. It's not impossible, just statistically vanishingly unlikely. But that's a cost I'm willing to pay to keep truth bivalent without introducing truth-value gaps."

  "Truth-value gaps aren't ontological," Elena corrected. "They're semantic. The world isn't gappy. The language is."

  "Semantics supervenes on usage," Sarah said. "And usage is a physical phenomenon. If usage doesn't determine a sharp boundary, then nothing does. But if nothing does, then 'Heap' doesn't express a proposition. And if it doesn't express a proposition, how can we reason with it? You save the logic by making the semantics complicated. I save the semantics by making the epistemology complicated."

  "Is your epistemology *that* complicated?" Elena asked. "Or is it just counter-intuitive? You're asking me to believe that there is a specific number of grains, say 4,532, where 4,531 is not a heap and 4,532 is, and that this fact is in principle unknowable. It feels like you're positing a magic number to save the Law of Excluded Middle."

  "It's not magic," Sarah said, her voice tightening slightly. "It's the cost of realism about truth. You think you avoid the magic by saying 'it depends on the precisification.' But who precisifies? When I say 'That's a heap,' I'm not consciously selecting a precisification. I'm using a word. If the word's meaning is a set of precisifications, I need to know which set. If the set is vague, we're back to square one. You're saying the vagueness is in the world of meanings. I'm saying the vagueness is in our access to the meaning. Honestly, Elena, isn't 'admissibility' just a polite word for 'usage we haven't analyzed closely enough'?"

  "Maybe," Elena conceded. "But analyzing it closely doesn't reveal a number. It reveals a cluster. Keefe's point is that we don't need a number to explain why the Sorites argument fails. We just need to show the inductive step isn't supertrue. We don't need to posit a specific $n$ where it flips. We just need to say there is *some* $n$ in the borderline region where it flips on some precisifications and not others."

  "But 'some $n$' implies existence," Sarah said. "In classical logic, $\exists n (Heap(n) \land \neg Heap(n+1))$ is true. You accept classical logic. So you accept there is an $n$. You just refuse to say it's a *fact* which $n$ it is. But if it's not a fact, what makes the existential claim true? Truthmakers, Elena. What is the truthmaker for the claim that there is a cut-off, if not the cut-off itself?"

  "The truthmaker is the pattern of usage," Elena said. "The pattern doesn't pick out a single $n$. It picks out a range. The existential claim is true because the range is non-empty. The specific instance isn't true because the pattern doesn't support it."

  "That sounds like you're rejecting bivalence for singular propositions," Sarah said. "Which is fine, but don't pretend you're keeping classical logic intact if you're denying truthmakers for instances of the existential."

  "I'm keeping classical logic for the language," Elena said. "I'm revising the model theory. You're keeping the model theory and revising the epistemology. We're both doing surgery. I just think my surgery leaves fewer scars on our understanding of knowledge. I don't have to tell students that they can never know if a pile is a heap. I tell them the question is ill-posed relative to the current precisification."

  "And I tell them the question is well-posed but they lack the cognitive resolution to answer it," Sarah said. "Which is actually more respectful of the concept. It treats 'heap' as a real category, not a placeholder for a family of precise categories."

  They sat in silence for a moment, the clink of ice in glasses filling the gap.

  "You know," Elena said, "the higher-order vagueness objection... I don't have a knock-down reply. If you push me on the boundary of admissibility, I have to admit that eventually, the model requires a sharp distinction between a set of precisifications and a set that isn't admissible. I can model the vagueness of that boundary, but the modeling language itself has to be precise."

  Sarah nodded. "And I'll admit the Margin for Error principle feels like it derives its force from the intuition that vagueness *should* be semantic. I use the semantic intuition to prove the epistemic conclusion, which feels circular. I need a better story about why usage *must* determine a sharp extension, independent of our ability to identify it."

  "So we're both stuck with a sharp boundary somewhere," Elena said. "Either in the world of extensions, or in the meta-language of precisifications."

  "Looks like it," Sarah said. "To save classical logic, someone has to be sharp."

  "Damn excluded middle," Elena muttered, raising her glass.

  "Damn margin for error," Sarah replied, clinking hers against it.

  They drank. Neither looked convinced, but the rain outside had stopped, leaving the streets sharp and glistening under the streetlights, every puddle reflecting a clear, distinct image of the world, provided you didn't look too closely at the edges.
