answer: |-
  This is a fantastic connection to draw. You have hit upon one of the most fertile intersections in early modern epistemology. It is rare to see Hobbes (the arch-materialist, the mechanist) and Vico (the proto-Romantic, the philosopher of history) placed side-by-side, yet their shared commitment to the *verum-factum* principle (even if Hobbes doesn't use that exact Latin phrase) reveals a deep structural similarity in how they view human knowledge.

  The anecdote about Hobbes and the squaring of the circle is not just a biographical curiosity; it is symptomatic of his entire philosophical project. He believed that if he could just get the definitions and the motions right, political conflict could be solved with the same finality as a geometric proof. Vico, reading Hobbes a century later, accepted the epistemological rule but rejected the geometric application to human affairs.

  Here is a comparison of their reasoning, where they diverge, and an evaluation of whose framework holds up better.

  ### 1. The Core Agreement: Knowledge as Authorship
  At the foundational level, Hobbes and Vico are in striking agreement on the **criterion for certainty**.

  For both thinkers, *scientia* (scientific/demonstrative knowledge) is not about matching a proposition to an external reality (correspondence theory); it is about knowing the **cause** of a thing.
  *   **Hobbes:** In *De Corpore*, he argues that we cannot know the causes of natural bodies because we did not create them. We see the effects (rain, gravity, magnetism), but the "generation" of these things is hidden from us. However, in geometry, we lay down the definitions. We stipulate that a line is generated by the motion of a point. Because we prescribed the cause, we can be certain of the effect.
  *   **Vico:** In *De Nostri Temporis Studiorum Ratione* (1709) and *The New Science*, Vico formalizes this as *verum et factum convertuntur* (the true and the made are convertible). We know the mathematical world truly because it is a world of our own making.

  **The Limit on Natural Science:** Consequently, both agree that physics (natural philosophy) can never achieve the same status as geometry or civil philosophy. For Hobbes, natural philosophy is merely the computation of consequences based on hypotheses; for Vico, only God possesses true scientific knowledge of nature because only God created nature. Human physics is always external observation, never internal knowledge of generation.

  ### 2. Substantial Divergences

  While the epistemological engine is the same, the vehicle they build with it is radically different.

  #### A. What it Means to "Make" (*Factum*)
  This is the most critical divergence.
  *   **Hobbes (Rationalist Construction):** For Hobbes, "making" is an act of **individual reason and will**. We "make" a circle by defining it; we "make" a Commonwealth by a Covenant. This making is instantaneous (logically speaking) and atomic. It relies on the assumption that human beings are essentially the same in all ages (rational, self-interested calculators). When Hobbes says we make the state, he means we logically construct it out of a contract to escape the State of Nature.
  *   **Vico (Historical Genesis):** For Vico, "making" is a **collective, historical process**. Humans did not sit down and sign a contract to create society. We *made* society through centuries of language development, myth-making, ritual, and law. To "know" the civil world, you cannot just deduce it from axioms; you must study philology, etymology, and mythology to understand how the human mind *generated* these institutions over time. For Vico, the "made" is sedimented history, not a logical blueprint.

  #### B. The Role of God's Authorship
  Both use God to mark the boundary of human knowledge, but they use that boundary for different political ends.
  *   **Hobbes (God as Silencer):** Hobbes's insistence that nature is God's work serves a **political function**. If we cannot know the causes of nature with certainty, we should not fight over them. By relegating natural causes (and religion) to the realm of uncertain opinion, Hobbes clears the ground for the Sovereign to dictate public order. God's authorship of nature is a reason for human *agnosticism* to ensure civil peace.
  *   **Vico (God as Providence):** Vico uses God's authorship of nature to highlight human limitation, but he introduces **Providence** into the human world. While humans made history, they did not intend the grand patterns of history (the *corsi e ricorsi*). Vico argues that a "divine mental language" guides human institutions. So, while we made history, we understand it best when we recognize the divine order working *through* our making. God is not just a boundary; He is the guarantor that the human world is intelligible at all.

  #### C. Scope of Domains
  *   **Hobbes:** The "maker's knowledge" applies to **Geometry** and **Civil Philosophy** (Politics). He explicitly excludes History. For Hobbes, history is merely "experience," a register of facts without demonstrative power. History tells you what happened, not why it *must* happen.
  *   **Vico:** The "maker's knowledge" applies to **Geometry** and **The World of Nations** (History, Law, Language, Myth). Vico explicitly inverts Hobbes here: he argues that because the civil world is made by men, *history* is the true science, more so than a deductive political theory. He embraces the very domain (history/philology) that Hobbes dismissed as uncertain.

  ### 3. Evaluation: Coherence and Defensibility

  When pushed to their limits, **Vico's version is more coherent and defensible**, primarily because Hobbes's application of the geometric method to human affairs collapses under the weight of human complexity.

  **The Problem with Hobbes:**
  Hobbes's obsession with squaring the circle is the perfect metaphor for his political philosophy. He wanted political obligation to be as gapless as a geometric proof. But human beings are not geometric points.
  *   **The Static vs. Dynamic Problem:** Hobbes treats the Commonwealth as a machine that, once built (via Covenant), functions according to fixed laws. But human institutions evolve. Hobbes's "maker's knowledge" assumes the maker knows the blueprint perfectly at the start. But in politics, the "making" is never finished.
  *   **The Reductionism:** To make civil philosophy demonstrable like geometry, Hobbes had to strip human motivation down to a single variable (fear of death/desire for power). This makes his system logically tight but anthropologically thin. When history contradicts his axioms (e.g., people dying for religious causes), Hobbes has to claim they are irrational, rather than adjusting his science.

  **The Strength of Vico:**
  Vico accepts the *verum-factum* principle but realizes that human "making" is messy.
  *   **Internal Access:** Vico argues that we can know history not because we have a blueprint, but because the principles of history are found within our own human consciousness (what he calls the "common sense" of mankind). We understand myth because we possess the same imaginative capacity (*fantasia*) that created it.
  *   **Anticipating Constructivism:** Vico's view anticipates modern sociology and hermeneutics. We understand social structures best when we understand them as constructs. However, unlike Hobbes, Vico acknowledges that these constructs have a life of their own that exceeds the original rational intent of the makers.

  **The Verdict:**
  Hobbes is more **logically rigorous** within his own self-imposed constraints. If you accept his definitions of man and motion, his deductions follow. But those constraints are arbitrary. He forces the square peg of human history into the round hole of geometry.

  Vico is more **philosophically robust** because his account of "making" fits the object of study. Human institutions *are* made, but they are made through language, time, and culture, not just covenant and logic. Vico saves the *verum-factum* principle from becoming a sterile rationalism. He shows that we can have certainty about the human world not because it is mathematical, but because it is *ours*—and "ours" includes our errors, our myths, and our history, not just our calculations.

  **Conclusion:**
  Hobbes failed to square the circle mathematically, and in a sense, he failed to square the circle politically: he tried to close the gap between human contingency and geometric necessity. Vico realized that the "circle" of human knowledge is only complete when we acknowledge that we are walking inside a shape we built ourselves, brick by historical brick, rather than standing outside it with a compass. Vico's version allows for a science of humanity that is certain *because* it is historical, whereas Hobbes's version demands a science of humanity that is certain only if it ignores history.
