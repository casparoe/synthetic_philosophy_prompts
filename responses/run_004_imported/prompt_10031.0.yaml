answer: |-
  Thank you all for being here. For those who don't know me, I'm Nora's older sibling.

  Standing here, three weeks after we lost her, I find myself trying to hold two truths at once. I look out at this room, and I see the people who knew Nora before the world gave her a label for her pain, and I see the people who knew her best *through* that label. I see my parents, who remember the little girl who loved [insert a simple childhood detail, e.g., drawing on the walls], and I see her friends from her skills group, who know the woman who could name the exact texture of her own grief.

  When Nora was nineteen, she was diagnosed with Borderline Personality Disorder. For many people, a diagnosis like that is a door closing. It's a warning. It's a shadow cast over the person underneath. I know my parents spent a long time afraid of that shadow. They wanted to believe that the wonderful, kind, hilarious woman Nora was existed *despite* the diagnosis. They wanted to separate the illness from the soul. It is a comfort to think that the illness was something that happened *to* her, and that the real Nora was somewhere safe inside, untouched.

  But if I am to be honest about who Nora was, I cannot separate them. And I don't think she would have wanted me to.

  Once Nora had that vocabulary, she didn't hide from it. She devoured it. She joined her DBT group. She started calling us to say, "I am feeling invalidated right now," or "I need to check the facts." At first, it sounded clinical. It sounded like she was reading from a script. But over the last twelve years, I watched that script become her voice. I watched her use those tools not to suppress who she was, but to build who she was becoming.

  There is a theory that if you peel away the mental illness, you find the true person underneath. But living alongside Nora, I came to realize that there was no "underneath." There was only Nora. The diagnosis and the woman were in a constant conversation. She pushed back against the stigma. She forced the label to mean something different. She took a word that was often used to dismiss women and turned it into a map for survival.

  To her friends in the recovery community: You know that this work is not about curing yourself so you can go back to who you were before. It is about integrating the struggle into the self. Nora knew that better than anyone. She didn't want us to love her *except* for her BPD. She wanted us to love her as a whole person, scars and skills and all.

  To my parents, and to those who just want to remember her light: That light was not in spite of her darkness. It was forged by it. The empathy she showed you, the fierce love she gave, the way she fought to stay in the room when every instinct told her to leave—that was not a victory *over* her condition. That was the victory *of* her character.

  She was thirty-one. She was brilliant. She was exhausting. She was tender. She was the sum of her biology, her history, her trauma, and her incredible, stubborn will to make sense of it.

  I am not going to tell you that she is at peace now, because Nora was never really about peace. She was about truth. She was about feeling things fully, even when it hurt. So I will say this instead: She is whole. The tension is over. The work is done.

  We are left with the pieces she handed us. To some of us, she left memories of a sister who was just a sister. To others, she left a legacy of advocacy and radical honesty. If you can hold those things together, if you can love the complexity of her as much as she learned to love it herself, then you are honoring her correctly.

  Thank you for loving Nora in all the ways she needed to be loved.
