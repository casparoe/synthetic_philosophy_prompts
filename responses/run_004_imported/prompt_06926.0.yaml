answer: |-
  You should be very careful with that framing. While the researcher's explanation captures the *spirit* of Condorcet's Jury Theorem (CJT), the claim that "more voters can only make the group more accurate, never less" is **mathematically incorrect** and could lead to a significant error in your piece.

  There is **no magic number** of users that makes a crowdsourced verdict "foolproof." In fact, under certain common conditions, adding more voters makes the outcome *worse*.

  Here is the breakdown of why, which should help you frame the piece accurately.

  ### 1. The Critical Flaw in the "More is Better" Claim
  Condorcet's Jury Theorem relies on two strict assumptions. If either is violated, the theorem collapses:

  *   **Assumption A: Competence ($p > 0.5$).** Each individual voter must have a better-than-random chance of identifying the truth.
      *   **The Risk:** If the average voter is slightly more likely to be wrong than right (e.g., $p = 0.49$), adding more voters **guarantees** the group converges on the *falsehood*. If a crowd is systematically misinformed, scaling up amplifies the error.
  *   **Assumption B: Independence.** Voters must decide independently of one another.
      *   **The Risk:** In social media, votes are highly correlated. People see what others have voted, they share ideological bubbles, and they are influenced by the same misinformation campaigns. When errors are correlated (everyone makes the *same* mistake), the "wisdom of crowds" becomes the "madness of mobs." Adding more people from the same bubble does not increase accuracy.

  ### 2. Is There a Rough Estimate?
  Because the "competence" ($p$) of the crowd varies by topic, there is no universal threshold. However, statistical simulations show how sensitive the system is:

  *   **High Competence ($p = 0.6$):** If voters are 60% likely to be right, you only need a few dozen voters to reach high confidence (90%+ accuracy).
  *   **Low Competence ($p = 0.51$):** If voters are only 51% likely to be right (barely better than a coin flip), you need **thousands** of voters to reach that same 90% confidence.
  *   **Negative Competence ($p = 0.49$):** If voters are systematically biased against the truth, 10,000 voters are **less accurate** than 10 voters.

  **The Takeaway:** You cannot determine safety by user count alone. A platform with 1 million biased users is less reliable than a platform with 100 diverse, expert users.

  ### 3. How Community Notes Actually Works (Important Context)
  It is worth noting for your piece that X's Community Notes (and similar bridging platforms) **do not use simple majority vote**, precisely because they know Condorcet's assumptions fail in the real world.

  Instead of counting heads, they use a "bridging" algorithm. A note is only rated helpful if it is endorsed by users who *usually disagree* with each other.
  *   **Why this matters:** This attempts to artificially enforce the **Independence** assumption of Condorcet's theorem. It prevents a single ideological bloc from overwhelming the verdict, even if they have more numbers.
  *   **The Limit:** This slows down the process. You can't get "foolproof" verdicts in minutes; it takes time to find consensus across different groups.

  ### 4. Suggested Framing for Your Piece
  To avoid perpetuating the myth that "scale = truth," consider framing it like this:

  > "While mathematical theories like Condorcet's Jury Theorem suggest that large crowds can converge on the truth, that outcome is conditional. It requires a crowd that is both better than random chance at spotting facts and independent in their thinking. In the polarized ecosystem of social media, those conditions are fragile. As one expert noted, 'If the crowd is systematically biased, scaling up doesn't fix the error—it cements it.' That is why modern platforms are moving away from simple majority votes toward algorithms that reward consensus across ideological divides."

  ### Summary for your notes:
  *   **Is there a magic number?** No.
  *   **Does more data always help?** No, not if the data is biased or correlated.
  *   **Is the verdict ever "foolproof"?** No. Probabilistic systems never offer guarantees, only confidence intervals.
  *   **Key nuance:** The quality and diversity of the voters matter infinitely more than the quantity.

  If you quote the researcher saying "more voters can never make the group less accurate," a knowledgeable reader (or a critic) will flag that as a fundamental misunderstanding of the theorem. It is safer to say, "Under ideal conditions, the theorem suggests accuracy improves with scale, but real-world bias often violates those conditions."
