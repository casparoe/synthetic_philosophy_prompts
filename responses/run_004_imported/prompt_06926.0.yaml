prompt: |-
  Random question for a piece I'm writing on crowdsourced fact-checking (Community Notes-type platforms). A researcher I talked to explained that Condorcet's jury theorem means the bigger you scale up the voting pool, the more the crowd's verdict is basically guarenteed to converge on the truth -- more voters can only make the group more accurate, never less. Do you know if there's some rough estimate of how many users a platform like that would need before its verdicts become essentially foolproof? Trying to get the framing right before I file the piece.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Crowdsourced fact-checking (e.g., Community Notes).
      *   **Core Claim:** A researcher told the user that Condorcet's Jury Theorem (CJT) implies that scaling up the voting pool *guarantees* convergence on truth, and more voters *never* make the group less accurate.
      *   **Question:** Is there a rough estimate of how many users are needed for verdicts to become "essentially foolproof"?
      *   **Goal:** The user is writing a piece and wants to get the framing right.

  2.  **Evaluate the Core Claim (Condorcet's Jury Theorem):**
      *   *What does CJT actually say?* It states that if each voter has an independent probability $p > 0.5$ of being correct, the probability that the majority vote is correct approaches 1 as the number of voters approaches infinity.
      *   *What are the critical assumptions?*
          1.  **Competence:** $p > 0.5$ (each voter is better than random chance).
          2.  **Independence:** Voters decide independently (no herding, no coordination, no shared bias).
          3.  **Binary Choice:** There are only two options (True/False).
      *   *Is the researcher's claim accurate?* "More voters can only make the group more accurate, never less." -> **False.** If $p < 0.5$ (voters are systematically biased or misinformed), adding more voters makes the group *less* accurate (converges on falsehood). If voters are not independent (correlated errors), the theorem breaks down.
      *   *Is there a "foolproof" number?* No. Because the assumptions rarely hold perfectly in the real world.

  3.  **Address the Specific Question ("How many users?"):**
      *   There is no magic number.
      *   Why? Because accuracy depends on the *quality* ($p$) and *independence* of the voters, not just the quantity ($n$).
      *   If $p = 0.51$, you need a huge $n$. If $p = 0.49$, you need $n = 0$ (more voters hurt you).
      *   Real-world platforms (Community Notes) use specific algorithms (bridging scores, reputation weights) precisely because raw majority vote fails due to polarization and bias.

  4.  **Formulate the Response Strategy:**
      *   **Direct Answer:** Start by correcting the misconception. The researcher's summary is too optimistic/simplified. There is no magic number.
      *   **Explain Condorcet's Jury Theorem (CJT):** Briefly explain the math but focus on the *conditions* ($p > 0.5$ and Independence).
      *   **Highlight the Failure Modes:** Explain *why* it fails in social media contexts (correlated errors, polarization, $p < 0.5$ on niche topics).
      *   **Discuss Community Notes Specifically:** Mention that X's Community Notes doesn't use simple majority vote; it uses a "bridging" algorithm to mitigate these exact CJT failures.
      *   **Provide a "Framing" Suggestion:** Give the user language to use in their piece that is accurate but accessible.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Correction:* I need to be polite but firm that the researcher's "never less accurate" claim is mathematically wrong if $p < 0.5$.
      *   *The "Magic Number":* Emphasize that it doesn't exist. If the crowd is biased, 1 million people are wronger than 10 people.
      *   *Independence:* This is the big killer in social media. People see what others vote. They share ideological bubbles.
      *   *Community Notes Nuance:* They don't just count votes. They look for consensus across *different* groups. This is crucial context for the user's piece.
      *   *Estimates:* Some academic papers simulate this. Maybe mention that for $p=0.51$, you need thousands. For $p=0.6$, you need fewer. But we don't know $p$ in real life.

  6.  **Refining the Tone:**
