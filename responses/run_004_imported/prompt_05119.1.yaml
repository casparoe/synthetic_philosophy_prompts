answer: |-
  **Title:** The Unity of the Will: Why Money Pumps Vindicate Transitivity Despite Sophistication

  **Introduction**

  In the normative architecture of expected-utility theory, the transitivity axiom is often treated as the bedrock of rational preference. If an agent prefers $A$ to $B$ and $B$ to $C$, she must prefer $A$ to $C$. The standard justification for this requirement is the money-pump argument: an agent with cyclic preferences ($A \succ B \succ C \succ A$) can be exploited by a series of trades, returning her to her initial state but with less wealth. This seems to demonstrate that intransitivity leads to dominated outcomes, violating the principle that rational agents should not choose options they know to be worse than available alternatives.

  However, a persistent objection in decision-theoretic literature threatens to undermine this justification. If an agent is *sophisticated*—foreseeing the sequence of trades—or *resolute* in the sense of Edward McClennen—committing to a plan and sticking to it—she can refuse the final trade that completes the cycle. She retains her money; the pump fails. This has led some theorists to conclude that the money-pump argument establishes, at most, a diachronic requirement on choice dispositions (do not be naive) rather than a synchronic requirement on the preference relation itself (be transitive).

  This essay argues that this conclusion is mistaken. While sophistication and resoluteness can prevent the *financial* drain of a money pump, they do so only by admitting that the underlying cyclic preferences are insufficient to govern rational choice. The ability to avoid exploitation does not exonerate intransitivity; rather, it demonstrates that cyclic preferences fragment the agent's will, forcing her to rely on higher-order constraints that effectively restore transitivity at the level of plans. Therefore, the money-pump argument successfully vindicates transitivity as a genuine synchronic constraint on rational preference. To be rational is not merely to avoid being Dutch-booked; it is to possess a coherent conception of the good that identifies a maximal element. Intransitivity makes this impossible.

  **The Sophistication and Resoluteness Defense**

  To understand the force of the objection, we must formalize the escape route. Consider an agent with cyclic preferences over three outcomes: $A \succ B \succ C \succ A$. She begins with $A$. A pump offerer proposes trading $A$ for $C$ at cost $\epsilon$, then $C$ for $B$ at cost $\epsilon$, then $B$ for $A$ at cost $\epsilon$. A naive agent trades at every node, ending with $A - 3\epsilon$, which is strictly worse than the starting point $A$.

  The *sophisticated* chooser, employing backward induction, anticipates the final node. At the third node, she holds $B - 2\epsilon$ and is offered $A - 3\epsilon$. Even if $A \succ B$ in her static ranking, she may prefer $B - 2\epsilon$ to $A - 3\epsilon$ given the cumulative cost. Recognizing that accepting the first trade inevitably leads to the third, she refuses the initial trade. The cycle is never entered; no money is lost.

  Similarly, a *resolute* chooser (McClennen 1990) formulates a plan at $t_1$ to reject the trades. At $t_2$ and $t_3$, despite local preferences urging a trade, she adheres to the plan because she values plan-following itself. In both cases, the agent retains her wealth while retaining her cyclic preferences. The inference drawn by critics is that intransitivity is not intrinsically irrational; only the *implementation* of intransitive preferences via naive choice is punished. Thus, rationality requires dynamic consistency, not necessarily transitive static preferences.

  **The Illusion of the Diachronic Rescue**

  This defense, however, rests on a category error regarding what preferences are supposed to do. Preferences are not merely predictors of choice; they are normative rankings of states of affairs. The money-pump argument is not primarily about wallet protection; it is about the *guidance* of action.

  If the sophisticated agent refuses the first trade to avoid the cycle, she ends up with $A$. But why $A$? Her preferences state $C \succ A$. If she had started with $C$, sophistication would have led her to keep $C$. If she started with $B$, she would keep $B$. The outcome is entirely path-dependent. The agent's final holding is determined not by what she values most, but by her initial endowment.

  This reveals the synchronic defect. A rational preference ordering is meant to identify the *best* available option. In a cyclic set $\{A, B, C\}$, there is no best option. Transitivity is the condition required for the existence of a maximal element in a finite set. Without it, the preference relation fails to perform its primary function: guiding the agent to the most choiceworthy state. Sophistication avoids the money loss, but it does so by abandoning the attempt to maximize according to the cyclic preferences. The agent effectively admits, "I cannot use these preferences to choose, so I will use a meta-preference for 'status quo' or 'plan stability' to break the tie."

  But this meta-preference must be transitive to function. If the agent prefers "Keeping $A$" to "Trading for $C$" (to avoid the pump), and "Keeping $C$" to "Trading for $B$", and "Keeping $B$" to "Trading for $A$", she has constructed a new preference relation over *actions* or *plans* that is transitive, even if her preferences over *outcomes* are not. The money pump argument thus succeeds: it shows that you cannot act rationally on intransitive preferences alone. You must supplement them with a transitive structure over plans or histories. Since rational agency requires the capacity to act, and action requires a transitive guide, transitivity remains a necessary condition for rationality.

  **The Cost of Resoluteness and Quinn's Self-Torturer**

  Proponents of the diachronic view might argue that resoluteness allows the agent to stick to the cyclic preferences without smuggling in transitive meta-preferences. McClennen suggests that resolute agents treat the plan itself as the object of choice. However, this imposes a significant cognitive and normative cost that reaffirms the irrationality of the underlying cycle.

  Consider Warren Quinn's "Self-Torturer" case. An agent is attached to a device with 1,000 settings. Each increment increases her wealth by $10,000 but increases her pain by an amount imperceptible to her. Since she cannot distinguish setting $n$ from $n+1$, she is indifferent (or weakly prefers $n+1$ due to the money). By transitivity of indifference, she should be indifferent between 0 and 1,000. Yet, setting 1,000 brings agony. Quinn argues this shows intransitivity can be rational.

  However, in the context of the money pump, Quinn's case illustrates the *danger* of relying on sophistication to manage intransitivity. A sophisticated Self-Torturer must choose a stopping point *ex ante*. But on what basis? Her local preferences provide no guidance, as every step looks beneficial (or neutral). She must arbitrarily pick a number. This arbitrariness is the hallmark of irrationality.

  If the money-pump agent uses resoluteness to stop the cycle, she faces a similar arbitrariness. Why stop at the first trade? Why not the second? If her preferences are truly cyclic, there is no normative reason to halt the sequence at one node rather than another, other than the fear of exploitation. But the fear of exploitation is only relevant because the preferences are cyclic. The "cost" of resoluteness is the admission that the first-order preferences are defective.

  Furthermore, resoluteness is fragile. It requires the agent to override her local preferences at the moment of choice. If the agent is truly rational, her local preferences should align with her global plans. If they diverge, she is in a state of internal conflict. A perfectly rational agent should not need to exert "willpower" to act against her current preferences; her current preferences should reflect her rational plan. If resoluteness is required, it implies a fragmentation of the self across time. The money pump exposes this fragmentation. It shows that the agent at $t_1$ and the agent at $t_3$ are effectively different agents with conflicting interests. Rationality demands the unity of the agent; transitivity is the logical expression of that unity.

  **The Verdict: Transitivity as a Constitutive Norm**

  We must therefore reject the view that the money-pump argument establishes only a diachronic constraint. The argument is not merely a pragmatic warning against naivety; it is a transcendental argument about the nature of choice.

  To choose is to select one option over others on the grounds that it is better. If preferences are cyclic, the grounds for selection dissolve. $A$ is better than $B$, $B$ is better than $C$, but $C$ is better than $A$. There is no "better" in a global sense. The sophisticated agent avoids the pump, but she does not choose the *best* option; she chooses the *safe* option. She sacrifices the normative guidance of her preferences for the pragmatic safety of her wallet.

  This trade-off confirms that intransitive preferences are normatively deficient. If a set of preferences cannot guide you to an optimal outcome without the aid of external constraints (like transaction costs or plan-commitment devices), those preferences are not fit to be called rational. The money pump demonstrates that intransitive preferences are incompatible with the concept of a maximizing agent.

  Moreover, the "sophisticated" solution implicitly restores transitivity by changing the description of the outcomes. If the agent prefers "Having $B$ without having traded" to "Having $A$ after trading three times," she is not expressing a preference over $A$ and $B$ simpliciter, but over complex histories. If we define the objects of preference as complete histories, the cycle may vanish. If it does not vanish even at the level of histories, then the agent is truly fragmented, and no amount of sophistication can render her rational—she will simply be a consistently fragmented agent. But standard decision theory assumes a unified agent. For a unified agent, transitivity is non-negotiable.

  **Conclusion**

  The money-pump argument is often dismissed as a mere *reductio ad absurdum* of naive behavior. This is too weak. The existence of sophisticated and resolute escape routes does not save intransitive preferences; it indicts them. It shows that an agent with cyclic preferences cannot act on them directly without self-harm, and must instead rely on higher-order, transitive constraints on planning to survive.

  Therefore, the money-pump argument successfully vindicates transitivity as a synchronic requirement of rational preference. It establishes that transitivity is not merely a safeguard against exploitation, but a constitutive norm of rational agency. Without transitivity, there is no "best" option, and without a "best" option, choice becomes arbitrary. The sophisticated chooser avoids the pump, but she does so by admitting that her preferences alone cannot tell her what to do. In doing so, she confirms that rationality requires a transitive ordering of the good. The money pump does not just drain the wallet of the naive; it exposes the incoherence of the intransitive will.
