  5.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe emphasize the "Free Will" aspect.
      *   *Correction:* No, the user is a physicist. Focus on causal structure and fine-tuning, not metaphysics of free will. Use "Setting Independence" or "Measurement Independence."
      *   *Check:* Did I address the no-signalling constraint? Yes, crucial. RC models must explain why retro-influence doesn't allow sending messages. This usually involves an equilibrium assumption that looks suspiciously like SD fine-tuning.
      *   *Check:* Did I answer "Are they the same maneuver?" Need a nuanced "No, but..."

  6.  **Final Polish:** Organize with clear headings. Ensure the conclusion directly answers the prompt's final question. (Proceed to generate output based on this structure.)

  *(Self-Correction Note)*: I need to be careful with the term "conspiratorial." In SD, it implies the universe "knows" what experiment you'll do. In RC, the universe responds to what you do. The difference is *agency* vs. *reaction*. But if the reaction is fine-tuned to hide itself, is it different? I need to highlight the *dynamical* vs. *kinematical* distinction.

  7.  **Final Plan:**
      1.  Validate the user's insight (they are right to be suspicious).
      2.  Define the common ground (Violation of Measurement Independence).
      3.  Explain the SD mechanism (Common Past Cause, Initial Conditions).
      4.  Explain the RC mechanism (Future Boundary Conditions, Dynamical Laws).
      5.  Address the "Conspiracy" charge (Fine-tuning of Initial vs. Boundary Conditions).
