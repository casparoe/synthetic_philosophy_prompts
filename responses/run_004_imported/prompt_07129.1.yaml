      *   Genuine engagement? Yes.
      *   Defender specifies what is lost? Yes (authority/fairness).
      *   Skeptic defends tu quoque? Yes.
      *   Hard cases (Politician, Frequent Flyer)? Yes.
      *   Private vs. Public blame? Yes.
      *   No tidy draw? Yes.

      *Let's write.*
answer: |-
  **The Hypocrite's Voice**

  **Characters:**
  *   **ELENA:** Defends the view that hypocrisy undermines standing to blame.
  *   **MARCUS:** Defends the skeptical view that this is merely the *tu quoque* fallacy.

  **Setting:** A quiet corner of a university faculty lounge, late afternoon.

  **MARCUS:** You're telling me that if I catch you stealing my pen, I can't call you a thief if I've stolen a pen in the past? That's not philosophy, Elena. That's a get-out-of-jail-free card for every sinner in the book.

  **ELENA:** Don't be reductive, Marcus. I'm not saying the act isn't wrong. I'm saying you lose the *standing* to call me to account for it. There is a difference between the truth of a proposition and the authority to assert it in a moral context.

  **MARCUS:** In a logical context, certainly. In a moral context? Morality is supposed to be objective. If stealing is wrong, it's wrong *simpliciter*. It doesn't become less wrong because the accuser has dirty hands. To suggest otherwise is to dress up the *tu quoque* fallacy in respectable normative clothing. Textbooks list that as a fallacy for a reason: the personal characteristics of the speaker are irrelevant to the truth value of the statement.

  **ELENA:** But blame isn't just a statement of fact. It's not like saying, "The cat is on the mat." It's a communicative act. It's a demand for accountability. When I blame you, I'm not just describing a violation; I'm invoking a norm that binds *us*. If I exempt myself from that norm, I violate a duty of fairness. I'm holding you to a standard I refuse to honor myself. That inequality undermines my right to make the demand.

  **MARCUS:** So it's about fairness. Let's grant that. You're a hypocrite. You're unfair. But does your unfairness erase my theft?

  **ELENA:** No.

  **MARCUS:** Then what work is "standing" doing? If the theft is still wrong, and I still have a moral duty to return the pen, and you still have a moral duty not to steal... what exactly is lost? You say I lack "standing." Is that a metaphysical property? A social permit?

  **ELENA:** It's a normative relation. Think of it like this: To blame someone is to claim a certain moral authority. It implies, "We are both committed to this rule, and you have breached our commitment." If I haven't committed to the rule myself, my blame carries a false pretense. It smuggles in an implicit claim: "I am not like you." When that claim is false, the blame becomes infelicitous. It's not that the criticism is untrue; it's that the *address* is corrupted.

  **MARCUS:** Infelicitous. That's a linguistic term. You're reducing moral accountability to etiquette. Let's test this. Take the classic case: A politician who had an affair gives a speech condemning infidelity.

  **ELENA:** Right.

  **MARCUS:** On your view, when he steps to the podium, he lacks standing. So, should we ignore him? Should we say, "He has no right to say this"?

  **ELENA:** We should say he has no right to *demand* accountability from others while shielding himself. His speech loses its moral force as a public rebuke. It becomes mere noise.

  **MARCUS:** But the infidelity is still damaging! It still breaks trust, hurts families, undermines the social fabric. If the politician is the only one with a platform to speak against it, are you saying he ought to stay silent? That seems to prioritize the purity of the speaker over the welfare of the community. If his speech stops ten other affairs, does his hypocrisy negate that good?

  **ELENA:** You're conflating standing with utility. Maybe the speech has good consequences. But morally, he is in no position to lead that charge. He is trying to purchase moral credit with currency he doesn't possess. It creates a culture where norms are weapons for the powerful to use against the weak, rather than shared commitments.

  **MARCUS:** Or, it creates a culture where we focus on the messenger rather than the message. That's the danger I see. Look at the environmentalist who flies on a private jet to lecture us on carbon footprints.

  **ELENA:** The frequent flyer case.

  **MARCUS:** Yes. You say he lacks standing to blame me for taking a holiday flight.

  **ELENA:** I do.

  **MARCUS:** But the carbon enters the atmosphere either way. His hypocrisy doesn't add a single molecule of CO2. If I listen to him, I might fly less. If I dismiss him because he's a hypocrite, I fly more. The physical reality of the harm is indifferent to his biography. Why should my moral response be any different?

  **ELENA:** Because morality isn't just about outcomes; it's about relationships. When he blames you, he's positing a community of sacrifice. "We must all do our part." If he isn't doing his part, he's lying about the "we." He's saying, "We must suffer," while meaning, "You must suffer, and I will watch." That deception damages the trust required for collective action.

  **MARCUS:** So it's the deception that's the problem, not the blame itself?

  **ELENA:** Precisely. The blame presumes solidarity. Hypocrisy falsifies that presumption.

  **MARCUS:** But couldn't he just say, "I know I'm a sinner, but this is still wrong"? Couldn't he pre-empt the standing objection by admitting his hypocrisy?

  **ELENA:** That helps. It removes the false pretense. But it changes the nature of the speech. It becomes a confession accompanied by a warning, rather than a righteous indictment. He moves from a judge to a fellow sinner.

  **MARCUS:** Okay, let's push this to the limit. Private blame. I sit in my study and I think about your pen stealing. I feel indignation. I judge you negatively. I don't say a word. Do I need standing for that?

  **ELENA:** That's a crucial distinction. If it is purely a private judgment—"Elena acted wrongly"—you don't need standing. Truth is sufficient. But if it is *blame*—if you are holding it against me, if you are emotionally withdrawing, if you are mentally demanding restitution—then yes, I think standing matters even there.

  **MARCUS:** That strikes me as absurd. Now you're policing my thoughts? If I don't express it, who is harmed by my lack of standing? There is no communicative act. There is no unfairness imposed on you.

  **ELENA:** But blame is inherently relational. Even in private, if I am blaming you, I am navigating our relationship. If I hold you to a standard I flout, I am corrupting my own participation in that relationship. I am fostering resentment based on a false equivalence.

  **MARCUS:** So if I'm a thief, I can't even privately think theft is wrong?

  **ELENA:** You can think it's wrong. But you can't *stand in judgment* of another for it while you continue to violate it yourself. You lose the right to the reactive attitudes.

  **MARCUS:** This sounds like a recipe for moral paralysis. If standing is forfeited by violation, then only saints can blame. And since there are no saints, no one can blame. Moral discourse grinds to a halt.

  **ELENA:** Not at all. Standing can be regained. You can acknowledge your fault, make amends, and recommit to the norm. The loss of standing is a prompt to repair yourself, not a permanent gag order. It's a mechanism to ensure that blame comes from a place of shared commitment, not superiority.

  **MARCUS:** But in the political sphere you write about, that's not how it works. The "you're one to talk" retort isn't used to prompt repair. It's used to silence. It's a silencing tactic. By focusing on the accuser's biography, we let the original wrongdoing off the hook. The politician's affair becomes the story, not the policy or the original scandal.

  **ELENA:** I agree it's often used cynically. But the fact that a tool can be weaponized doesn't mean the tool doesn't exist. Just because a criminal cries "fire" in a theater doesn't mean there's no such thing as a legitimate fire alarm. The intuition that hypocrisy matters is real. People feel it. They feel the sting of unfairness.

  **MARCUS:** They feel the sting of being attacked by someone they perceive as an enemy. That's tribalism, not morality. Let me ask you this: If the hypocrite's blame is "infelicitous," as you say, is it *false*?

  **ELENA:** No. The content is true.

  **MARCUS:** Is it *immoral* to voice it?

  **ELENA:** It can be. It violates the norms of fair address.

  **MARCUS:** So, we have a true statement, regarding a genuine wrong, voiced by a person who has committed a separate wrong. You say the voicing is impermissible. I say the voicing is permissible, though the speaker is flawed. What is the practical difference?

  **ELENA:** The practical difference is where we direct our moral energy. On your view, we focus entirely on the target. On my view, we have to scan the speaker first.

  **MARCUS:** Exactly! And that is why I call it *tu quoque*. It shifts the focus from the act to the actor. And in doing so, it lets the act slide. If I'm guilty of infidelity, and you call me out, and I successfully challenge your standing... I have won. I have avoided accountability.

  **ELENA:** You haven't avoided accountability for the infidelity. You've only avoided *my* specific demand. Someone else with standing can still blame you. Or you can blame yourself.

  **MARCUS:** But in the public square, often there *is* no one else. Or the one with standing is too weak to be heard. If we enforce a standing rule strictly, we protect the powerful who ensure that only other hypocrites rise to positions where they can speak. It creates a cartel of silence. "I won't expose your crimes if you don't expose mine."

  **ELENA:** That is a risk. But the alternative is a moral culture of self-righteousness, where people use norms as cudgels without embodying them. That erodes the legitimacy of the norms themselves. If people see that the rules are only for the suckers, they stop believing in the rules.

  **MARCUS:** I think we are at an impasse. You believe the legitimacy of the norm depends on the purity of its enforcers. I believe the legitimacy of the norm depends on the truth of the claim.

  **ELENA:** I believe the *force* of the norm depends on the solidarity of the community.

  **MARCUS:** And I believe that solidarity is broken when we let the biography of the messenger drown out the message.

  **ELENA:** So, what do we do with the politician?

  **MARCUS:** We listen to the condemnation of infidelity, because infidelity is harmful. And separately, we condemn the politician for his hypocrisy, because hypocrisy is corrosive. Two wrongs.

  **ELENA:** And I say we reject the condemnation *as delivered by him*, because it is structurally unsound. We accept the truth of the claim, but refuse the authority of the claimant.

  **MARCUS:** Is there a difference in outcome?

  **ELENA:** Yes. In your version, the politician remains a moral arbiter. In mine, he is demoted. He becomes a witness, not a judge.

  **MARCUS:** A witness with dirty hands.

  **ELENA:** Precisely.

  **MARCUS:** (Sips coffee, looking out the window) I suppose I can accept that he shouldn't be a *judge*. But the public doesn't want witnesses, Elena. They want judges. And if the only people willing to speak are the flawed ones, insisting on standing might leave us with silence.

  **ELENA:** Then perhaps the silence is a signal. It tells us we need to build a community where people can speak without fear of their own past being used to shield their present targets.

  **MARCUS:** Or it tells us that we need to grow up and accept that truth often comes from liars, and moral insight often comes from sinners. If we wait for clean hands, we'll be waiting forever.

  **ELENA:** And if we accept blame from anyone, we turn morality into a game of power where the loudest voice wins, regardless of whether they believe what they're saying.

  **MARCUS:** (Stands up) I don't think we'll solve the scandal of hypocrisy today.

  **ELENA:** No. But at least we agreed the pen stealing was wrong.

  **MARCUS:** (Pauses at the door) Speak for yourself. I still think I have standing to ask for it back.

  **ELENA:** (Smiles) You do. I haven't stolen anything. Yet.

  **MARCUS:** Give it time.
