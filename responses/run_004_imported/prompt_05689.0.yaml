answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Board Steering Committee
  **FROM:** [Your Name/Student Representative]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Hearing Panel Size and Voting Procedures

  ### Executive Summary

  This memo addresses the proposal to expand hearing panel size from three (3) to nine (9) members, justified by the Condorcet Jury Theorem (CJT). While the intuition that "more voters increase accuracy" is mathematically sound under specific conditions, those conditions do not currently exist within our hearing structure.

  Expanding to nine members under our current deliberation protocol risks **decreasing** verdict accuracy and increasing logistical friction. I recommend we **retain 3-person panels for initial hearings** but reform our voting procedure to capture independent judgment. We should reserve 9-person panels exclusively for **appeals**, where the epistemic conditions for the CJT are more likely to be met.

  ### The Argument for Expansion (Steel-manning the Proposal)

  Proponents of the 9-person panel cite the Condorcet Jury Theorem. The theorem states that if a group votes by majority rule, and:
  1.  Each voter is more likely to be correct than incorrect (competence $> 50\%$).
  2.  Each voter decides independently of the others.

  Then, as the group size increases, the probability of a correct majority verdict approaches 100%.

  On the surface, this suggests that a 9-person panel is epistemically superior to a 3-person panel. However, this conclusion holds *only* if the two assumptions above are satisfied. If they are not, the theorem either becomes irrelevant or, worse, reverses its prediction.

  ### Epistemic Risks of Expansion

  **1. The Competence Assumption ($p > 0.5$)**
  The CJT requires that the average individual juror has a probability of correctness ($p$) greater than 0.5. In clear-cut cases (e.g., identical code submission), our members likely clear this threshold. However, in "foggy" cases—ambiguous citation practices, unauthorized collaboration in study groups, or paraphrasing disputes—the "correct" verdict is often interpretive rather than factual.

  In these ambiguous scenarios, it is not guaranteed that an individual student panelist is more likely than not to interpret the policy correctly without guidance. If $p < 0.5$ (meaning the average member is more likely to be wrong than right due to confusion or bias), the CJT proves that **adding more voters makes a wrong verdict more certain.** A 9-person panel would converge on error faster than a 3-person panel.

  **2. The Independence Assumption**
  The CJT requires votes to be statistically independent. Currently, our panels deliberate together in the same room *before* voting. This creates high correlation between votes.
  *   **Herd Behavior:** Junior members often defer to senior members or the Chair.
  *   **Group Polarization:** Discussion often pushes members toward a more extreme stance than they would hold individually.
  *   **Shared Information Bias:** Groups tend to discuss information everyone already knows rather than unique insights held by individuals.

  When votes are correlated, errors do not cancel out; they compound. If nine people are influenced by the same charismatic speaker or the same misunderstanding of policy, you do not have nine independent data points; you have one data point multiplied by nine. In this context, increasing panel size adds logistical cost without adding epistemic value.

  **3. Process Loss**
  Beyond the math, larger groups suffer from "process loss." Scheduling nine students for a hearing significantly increases the time-to-verdict. Procedural justice dictates that hearings be timely; excessive delays can prejudice the accused student's academic standing. Furthermore, in larger groups, social loafing (reduced individual effort) is common, potentially lowering the average competence ($p$) of the panel.

  ### Recommendations

  To genuinely improve verdict accuracy, we must focus on the *quality* of judgment and the *independence* of votes, not just the headcount. I propose the following:

  **1. Retain 3-Person Panels for Initial Hearings**
  Given the high correlation caused by deliberation and the variable competence in ambiguous cases, a 3-person panel is epistemically safer and logistically superior. It minimizes scheduling delays and reduces the risk of group polarization dominating the outcome.

  **2. Implement "Silent First Vote" Procedure**
  To better satisfy the independence assumption of the CJT within our current size:
  *   Panelists must review the evidence individually.
  *   **Before any discussion occurs,** panelists cast a secret preliminary vote.
  *   Deliberation follows only if the vote is not unanimous.
  *   A final vote is cast after deliberation.

  This captures the independent judgment of members before social influence can corrupt it. If the preliminary vote is split, it signals that the case is ambiguous (low $p$), warranting extra care during deliberation.

  **3. Reserve 9-Person Panels for Appeals**
  The conditions for the CJT are better met in appeals. Appeals usually focus on procedural errors or clear misapplications of policy rather than ambiguous factual disputes, which raises individual competence ($p$). Additionally, appellate panelists are typically more experienced. Expanding to nine members here maximizes accuracy where it is most needed without bogging down the initial hearing pipeline.

  ### Conclusion

  The Condorcet Jury Theorem is not a magic bullet for panel size; it is a conditional model. Under our current protocol (deliberation before voting) and case mix (high ambiguity), expanding to nine members risks institutionalizing error rather than correcting it.

  By keeping initial panels small but enforcing vote independence, and reserving large panels for appeals, we optimize both epistemic accuracy and procedural efficiency.

  I look forward to discussing this analysis at the next meeting.
