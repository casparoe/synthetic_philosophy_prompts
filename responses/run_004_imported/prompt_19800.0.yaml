prompt: |-
  I'm a CS PhD student, and this term I'm the grad rep on my department's three person grade-appeals panel. Heres Friday's case: in discrete math the instructor taught a recursively defined sequence purely by example -- 1, 2, 4, 8, 16 for the first five terms (it's the "how many regions do you get connecting n points on a circle with straight lines" count), framed as a "spot the pattern" warm-up -- then the final exam asked for the sixth term. The "obvious" doubling pattern gives 32; the rule the instructor was actually using gives 31. About a quarter of the class wrote 32 and is now appealing, since doubling fit every example we ever actually showed them just as well as the rule the instructor was using. Two of the three panelists think it's an easy call -- the instructor's rule is simply the correct one and doubling was a mistake -- but I'm not convinced that's principled, since the assignment never stated a closed form, only examples, and I don't see why "what the instructor meant" automatically beats "the simplest continuation of the data we actually gave them." Can you draft the memo I'll circulate before Friday? I need an actual recommendation on grading the disputed problem, plus some guidance for how we word "find the pattern" questions from now on -- and please really engage with the case for the doubling answers instead of just asserting the instructor's rule wins.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the User and Context:**
      *   **User:** CS PhD student, Grad Rep on a 3-person grade-appeals panel.
      *   **Task:** Draft a memo to circulate to the other two panelists before Friday's meeting.
      *   **Case:** Discrete Math exam question. Sequence: 1, 2, 4, 8, 16. Asked for 6th term.
          *   Instructor's intended answer: 31 (Moser's Circle Problem).
          *   Student answer (25% of class): 32 (Powers of 2).
          *   Instructional context: Taught purely by example as a "spot the pattern" warm-up. No closed form or recursive definition provided in class materials.
      *   **Panel Dynamics:** 2/3 panelists think it's an easy call (Instructor wins). User (Grad Rep) is skeptical, arguing from principles of assessment validity and ambiguity.
      *   **Requirements:**
          *   Actual recommendation on grading.
          *   Guidance for future "find the pattern" questions.
          *   *Crucial:* Engage seriously with the case for the doubling answers (don't just dismiss them).
          *   Tone: Professional, academic, persuasive but collaborative (it's a memo to colleagues, not a verdict yet).

  2.  **Deconstruct the Mathematical/Pedagogical Issue:**
      *   **The Math:** This is the classic Moser's Circle Problem. The sequence is $1, 2, 4, 8, 16, 31, 57, \dots$. It's a famous counter-example to inductive reasoning based on small $n$.
      *   **The Pedagogy:** If the goal was to teach "don't trust patterns blindly," the assessment method was flawed. You can't test a lesson on skepticism by punishing students for being skeptical of the *wrong* pattern but trusting the *obvious* one, especially if the lesson itself wasn't explicitly taught.
      *   **The Assessment Principle:** Validity. Does the exam question measure what was taught? If the class was taught "spot the pattern," $2^n$ is the most parsimonious pattern. If the class was taught "Moser's Circle," the context was missing from the exam prompt.
      *   **The Appeal:** Students aren't appealing because they got it wrong; they're appealing because the question was ambiguous relative to the instruction provided.

  3.  **Determine the Stance/Recommendation:**
      *   *Option A: Full Credit to 32.* (Strongest student support, acknowledges ambiguity).
      *   *Option B: Partial Credit.* (Acknowledges logic but privileges instructor intent).
      *   *Option C: No Change.* (Status quo, likely what the other two panelists want).
      *   *My Recommendation:* Given the user's skepticism and the ethical obligation of fair assessment, Option A or B is best. Option A is stronger pedagogically. If the instruction was "spot the pattern," $2^n$ is the correct mathematical inference from the data provided *in the absence of context*. However, to build consensus with the other two panelists, a compromise might be needed. But the prompt asks *me* to draft the memo for the *user*, who is already skeptical. I should support their skepticism with strong arguments. Let's aim for **Full Credit** (or at least a strong presumption thereof) because the burden of clarity lies with the examiner.
      *   *Refinement:* Actually, in grade appeals, the standard is usually "was the grading arbitrary or capricious?" or "was the question ambiguous?" If the question is ambiguous, the benefit of the doubt goes to the student. I will recommend awarding full credit for 32, provided the student showed reasoning consistent with $2^n$.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (preparing for Friday's appeal regarding Discrete Math).
      *   **Case Summary:** Briefly recap the facts (Moser's Circle vs. Powers of 2).
      *   **Analysis of the "Doubling" Argument (Crucial Step):**
          *   Occam's Razor / Parsimony. $2^n$ is simpler than the polynomial for Moser's Circle.
          *   Instructional Alignment. If it was taught as a warm-up example without the geometric context, the *data* implies doubling.
          *   Mathematical Induction trap. The point of the Moser problem is that patterns break. Punishing students for falling for the trap *without explicitly teaching the trap* is unfair.
      *   **Analysis of the "Instructor Intent" Argument:**
          *   Acknowledge the other panelists' view (content mastery).
          *   Counter: Intent doesn't override clarity in assessment.
      *   **Recommendation:** Award full credit for 32.
      *   **Future Policy:** Guidelines for sequence problems (provide context, specify recurrence, etc.).
      *   **Closing:** Invite discussion.

  5.  **Refining the Tone:**
      *   Needs to be respectful of the other panelists (faculty?) but firm on principles.
      *   Avoid accusatory language ("The instructor failed"). Use systemic language ("The assessment design created ambiguity").
      *   Highlight the CS context (garbage in, garbage out; specification matters).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I engage with the doubling case? Yes, by emphasizing parsimony and data sufficiency.
      *   *Check:* Is the recommendation clear? Yes.
      *   *Check:* Is the future guidance practical? Yes.
      *   *Nuance:* I need to make sure I don't sound like I'm attacking the instructor personally, but rather the *design of the assessment*. The distinction is vital for a committee memo.
      *   *Math Check:* Moser's Circle formula is $\binom{n}{4} + \binom{n}{2} + 1$. For $n=1..5$, it matches $2^{n-1}$. For $n=6$, it's 31. The students answered $2^5 = 32$.
      *   *Policy Check:* As a grad rep, I represent student interests but must be objective. The argument should be about *fairness* and *validity*.

  7.  **Final Polish:** Ensure the formatting looks like a memo. Make sure the argument flows logically from the specific case to the general principle. (Proceed to generate output).

