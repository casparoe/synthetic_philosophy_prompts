answer: |-
  The debate over Pascal's Mugging within the rationalist community has largely centered on the probability side of the expected utility equation. Eliezer Yudkowsky's original formulation highlighted a vulnerability in agents with unbounded utility functions: if a hypothesis posits a sufficiently large impact ($N$), even an infinitesimal probability ($P$) can yield an expected utility ($P \times N$) that dominates any finite cost. Robin Hanson's proposed solution, the "leverage penalty," suggested modifying the prior probability $P$ such that it decreases in proportion to the leverage $N$ one claims to have. Yudkowsky later retreated from this in "Pascal's Muggle," conceding that a strict leverage penalty renders an agent dogmatic: no amount of evidence could ever convince them they were in a position to affect a large number of people, because the prior would always shrink faster than the likelihood ratio could grow.

  I argue that this entire dialectic has been searching for a solution in the wrong variable. The leverage penalty is neither the psychological reason humans refuse the mugger nor a normatively correct strategy for an ideal Bayesian. The leverage penalty is an ad hoc patch attempting to fix a problem that originates in the utility function, not the probability distribution. The only coherent way to resolve Pascal's Mugging without succumbing to the "Muggle" condition (dogmatic refusal to update) is to accept that rational utility functions must be bounded, or at least significantly sublinear, in the number of affected entities.

  ### The Failure of the Leverage Penalty

  To understand why the leverage penalty fails, we must accept Yudkowsky's "Muggle" critique. In a standard Bayesian framework, beliefs are updated by evidence via the likelihood ratio. If I claim I can save $3 \uparrow\uparrow\uparrow 3$ lives, and the sky tears open to display a matrix of glowing numbers confirming this, a Bayesian agent should update significantly toward that hypothesis.

  However, if one applies a leverage penalty where $P(H) \propto 1/N$, the prior probability becomes inversely proportional to the stakes. As $N$ approaches astronomical numbers, $P(H)$ approaches zero faster than any physical evidence can compensate. The likelihood ratio of any evidence we can physically observe is bounded by the complexity of our sensory inputs; we cannot observe more bits of evidence than our brains can process. If the prior drops faster than the maximum possible likelihood ratio rises, the posterior probability remains negligible.

  This commits the agent to a form of empirical dogmatism. It implies that there is a maximum number of people you can ever rationally believe you are in a position to help, regardless of the evidence. If you were actually standing in a control room for a universe-sized simulation, a leverage-penalized agent would be forced to conclude it is a hallucination rather than reality. This violates the core Bayesian virtue of responsiveness to evidence. An ideal reasoner should not be structurally incapable of believing the truth, even if the truth is improbable. Therefore, the leverage penalty is not a valid general principle for probability assignment.

  ### Why Unbounded Utility Demands Payment

  If we discard the leverage penalty as a mechanism for modifying priors, we are left with standard complexity priors (where probability drops based on the bit-length of the hypothesis, not the stakes). If we maintain an **unbounded, linear utility function** ($U \propto N$), the mugging returns with full force.

  Consider the agent who attempts to hybridize the approaches: an agent that applies a leverage penalty to priors ($P \propto 1/N$) but retains an unbounded, linear utility function ($U \propto N$). This agent is still vulnerable to the mugger.

  In this scenario, the expected utility calculation becomes:
  $$ EU = P(H) \times U(N) \approx \left(\frac{k}{N}\right) \times (c \cdot N) = k \cdot c $$
  The $N$ terms cancel out. The expected utility of the transaction becomes a constant, independent of the number of lives at stake. If the mugger asks for \$5 to save $N$ lives, and the constant expected value of saving those lives (given the leverage-penalized probability) is equivalent to, say, 1 life, the agent should pay the \$5. One life is worth far more than \$5.

  Furthermore, if the mugger is "sufficiently insistent"—meaning they offer a hypothesis that is slightly simpler (higher prior) or demands slightly less cost—the leverage-penalized agent with linear utility *must* pay. The leverage penalty merely stabilizes the expected value; it does not drive it to zero. To drive the expected value to zero without bounding utility, the probability penalty must grow *faster* than $1/N$ (e.g., $1/N^2$). But as established in the "Muggle" critique, if the probability drops faster than $1/N$, the agent becomes dogmatically unable to update on evidence of high-leverage situations.

  Thus, we face a trilemma for the agent with unbounded linear utility:
  1.  **No Penalty:** You get mugged (EU explodes).
  2.  **Leverage Penalty ($1/N$):** You still get mugged (EU is constant and positive).
  3.  **Strong Penalty ($>1/N$):** You become a Pascal's Muggle (you ignore evidence).

  The only way to escape this trilemma without sacrificing Bayesian updating is to modify the utility term, not the probability term.

  ### Bounded Utility as the Solution

  If we posit a bounded utility function, where $U(N)$ approaches an asymptote $U_{max}$ as $N \to \infty$, the math resolves cleanly.
  $$ EU = P(H) \times U(N) $$
  As $N$ grows, $P(H)$ shrinks (due to complexity priors), and $U(N)$ saturates. The product $P(H) \times U(N)$ naturally converges to zero for sufficiently complex, high-stakes hypotheses.

  This allows the agent to remain a proper Bayesian. If the mugger presents overwhelming evidence that they can affect $N$ lives, the agent *can* update their probability $P(H)$ upward. They can rationally believe they are in a high-leverage situation. However, because the utility of saving $10^{100}$ lives is not significantly higher than the utility of saving $10^{90}$ lives (both are near the asymptote), the expected utility does not explode. The agent refuses the mugger not because they think the evidence is fake, but because the marginal value of the additional stakes does not justify the certain cost.

  This aligns better with how humans actually behave. We do not refuse the mugger because we have calculated a leverage penalty on the probability; we refuse because the stakes feel "too big to be real" *and* because our emotional valuation of the stakes does not scale linearly. The bounded utility model captures the latter, while allowing standard probability theory to handle the former.

  ### Confronting the Cost: Scope Insensitivity

  The primary objection to bounded utility is the ethical cost: it commits the agent to "scope insensitivity" at the limit. If utility is bounded, then there exists some number $X$ such that saving $X + 1$ lives is essentially no better than saving $X$ lives. In the limit, the difference between saving a trillion lives and saving a googolplex lives becomes negligible. This seems to violate the intuition that every life has intrinsic, additive value—a core tenet of Total Utilitarianism.

  However, this cost must be weighed against the alternative. The alternative is an agent that is vulnerable to Pascal's Mugging. An agent with unbounded utility is forced to prioritize tiny-probability, astronomical-stakes scenarios over certain, moderate-stakes scenarios. Such an agent would ignore climate change, poverty, or disease reduction (certain impacts on millions) to pursue projects with a $1/3 \uparrow\uparrow\uparrow 3$ chance of saving $3 \uparrow\uparrow\uparrow 3$ lives. This is not rationality; it is a pathology of the utility function.

  We can mitigate the ethical cost of bounded utility in three ways:

  1.  **The Asymptote is Distant:** A bounded function does not need to flatten quickly. It can be linear for all practically achievable numbers and only bend near physical limits (e.g., the number of possible observers in the lightcone). If the bound is set at $10^{50}$ lives, and we will never affect more than $10^{30}$, the "indifference" never activates in practice.
  2.  **Sublinear Growth:** We need not posit a hard cap. A logarithmic or square-root utility function ($U \propto \log N$) still grows without bound but grows slowly enough that $P(H) \times U(N)$ converges to zero given exponential complexity penalties. This preserves the intuition that more lives are always better, without allowing the expected value to explode.
  3.  **Density over Count:** It is philosophically defensible to argue that value is not strictly additive. A universe with $10^{100}$ happy people might not be $10^{100}$ times better than a universe with one happy person; it might be better in terms of complexity, diversity, or total consciousness, but with diminishing returns. If value is a function of the *pattern* of flourishing rather than a raw count of instances, boundedness is a natural feature, not a bug.

  ### Conclusion

  The rationalist consensus has treated Pascal's Mugging as a problem of probability estimation, leading to the flawed concept of the leverage penalty and the subsequent admission of the "Pascal's Muggle." This misdiagnoses the issue. The leverage penalty is a clumsy attempt to force the probability term to do work that belongs to the utility term.

  An ideal Bayesian reasoner should not be dogmatically closed to the possibility of having large leverage. They should be able to update on evidence. But to prevent those updates from commanding infinite resources, the utility function must not scale linearly with the stakes. A leverage-penalized agent with unbounded utility is still muggable; a Bayesian agent with bounded utility is not. The cost of bounded utility—diminishing marginal value at extreme scales—is a small price to pay for an ethical framework that remains action-guiding in the real world, rather than one that dissolves into a haze of astronomical lotteries. We should not fear the conclusion that the googolplexth life adds less marginal value than the first; we should fear a rationality that prevents us from saving the first.
