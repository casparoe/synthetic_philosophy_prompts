      *   *Verdict:* It is a dodge. Merely rejecting the label doesn't answer the structural critique. The user needs to explain *how* criticism happens in the Wittgensteinian framework if not by comparing beliefs to empirical reality. (e.g., Is the belief coherent? Does it lead to actions the believer claims it wouldn't? Is it idolatrous?)
