  **Direct Answer:**

  Nora's hypocrisy bears on her **standing** to voice the criticism, but **not on the truth** of it. Diego's cancellation was objectively late according to the rule, regardless of Nora's behavior.

  The distinction Farah and Julian are half-reaching for is the difference between **violation** and **exemption**. Julian focuses on the violation (everyone breaks rules), while Farah focuses on the unfairness. The missing consideration is **accountability**. A person retains standing to enforce a norm they have broken *if* they acknowledge their breach and accept the same penalty. Nora loses standing not because she broke the rule, but because she enforced it against Diego while implicitly claiming an unspoken exception for herself. The specific harm is the assertion of unequal status within the group, not the inconsistency itself.
