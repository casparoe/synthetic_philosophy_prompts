answer: |-
  This is a pivotal distinction in contemporary consequentialist theory, and your professor is right to flag it as load-bearing. If Greaves is correct, the standard Expected Value (EV) response to the cluelessness objection works for *simple* cluelessness but fails catastrophically for *complex* cluelessness.

  To understand why they are epistemically disanalogous (a difference in kind, not degree), we need to look at the conditions required for rational probability assignment. Here is a step-by-step breakdown of the distinction, the failure of the symmetry argument, and a concrete case to illustrate the epistemic gap.

  ### 1. The Baseline: The Expected Value Defense
  Before distinguishing the two types of cluelessness, recall the standard consequentialist defense against Lenman.
  *   **The Objection:** We cannot *know* the future consequences of our actions.
  *   **The Defense:** We don't need knowledge; we need rational credences. We can assign probabilities to various outcomes and calculate the Expected Value. Even if I'm not sure if my donation saves a life, if I assign a 60% probability to it doing so, I can still act rationally.

  Greaves argues this defense presupposes that we are in a state of **Simple Cluelessness**.

  ### 2. Simple Cluelessness: Uncertainty within a Known Space
  **Simple cluelessness** occurs when we are uncertain about which outcome will obtain, but we possess a well-defined "state space" and sufficient empirical evidence to assign probabilities (or at least bounded ranges of probabilities) to those outcomes.

  *   **Epistemic Status:** We know *what* the relevant variables are. We have data or analogical evidence that justifies a probability distribution.
  *   **Decision Theory:** Standard Expected Utility Theory applies.
  *   **Example:** You are deciding whether to fund a specific medical intervention.
      *   *Outcome A:* The patient survives (Value: +100).
      *   *Outcome B:* The patient dies (Value: -100).
      *   *Evidence:* Clinical trials show this intervention has a 70% success rate in similar demographics.
      *   *Verdict:* You have simple cluelessness about *this specific instance*, but you have a justified credence (0.7). The EV is calculable.

  ### 3. Complex Cluelessness: Inscrutability of the State Space
  **Complex cluelessness** arises when the causal chains are so diffuse, distant, or conceptually novel that we lack the evidence required to justify *any* specific probability assignment, even a vague range.

  *   **Epistemic Status:** We do not know the relevant partition of the possibility space. We suffer from "unknown unknowns." We lack the background theory to say whether an outcome is likely, unlikely, or equally likely as its opposite.
  *   **Decision Theory:** Standard EV breaks down because the inputs (probabilities) are **inscrutable**.
  *   **The Key Disanalogy:** In simple cluelessness, uncertainty is a feature of the *world* (it is stochastic). In complex cluelessness, the uncertainty is a feature of our *epistemic framework* (we cannot construct the model).

  ### 4. Why Symmetry Fails (The Principle of Indifference Problem)
  You mentioned struggling with why "symmetrical considerations" don't neutralize the worry. This is the most common counter-move: *"Sure, saving a life might lead to a tyrant being born in 100 years, but it might also lead to a saint. These cancel out, so we can ignore the long-term and focus on the short-term."*

  Greaves argues this symmetry argument is epistemically unjustified in cases of complex cluelessness. Here is the step-by-step reasoning:

  1.  **To claim symmetry, you need a probability distribution.** To say the good effects cancel the bad effects is to claim the expected value of the long-term consequences is zero (or near zero). This requires assigning a probability of roughly 0.5 to "net positive long-term" and 0.5 to "net negative long-term."
  2.  **Justification requires evidence.** In simple cluelessness, we justify probabilities via frequency data or physical propensities. In complex cluelessness (e.g., geopolitical shifts in 2124), we have no such data.
  3.  **The Principle of Indifference (PoI) trap.** Lacking evidence, one might invoke the Principle of Indifference: "I have no reason to think it will be good rather than bad, so I must assign equal probability."
  4.  **The Partition Problem.** Greaves (drawing on classic problems with PoI) points out that probability assignments based on indifference are sensitive to how you carve up the possibilities.
      *   *Partition 1:* {Net Good, Net Bad}. PoI says 50/50.
      *   *Partition 2:* {Very Good, Neutral, Very Bad}. PoI says 33/33/33.
      *   *Partition 3:* {Good, Bad, Catastrophic}. PoI says 33/33/33.
      *   If "Catastrophic" has a much higher negative magnitude than "Good" has positive magnitude, the EV changes drastically depending on how you partition the unknown.
  5.  **Conclusion:** Because we lack an evidence-based reason to prefer one partition over another, assigning a 50/50 probability is arbitrary. It is not a neutral default; it is an unjustified stipulation. Therefore, you cannot claim the long-term effects "cancel out." They remain **inscrutable**.

  ### 5. Concrete Illustrative Case: The Malaria Net
  Let's apply this to a concrete case to see the disanalogy in action.

  **Action:** Donating $5,000 to the Against Malaria Foundation (AMF).

  **Layer 1: Simple Cluelessness (The Short Term)**
  *   **Question:** Will this money buy nets? Will those nets prevent malaria infections?
  *   **Epistemic State:** We have data from previous distributions. We know failure modes (nets used as fishing gear, theft, etc.).
  *   **Probability:** We can confidently assign a high probability (e.g., 0.9) to "X infections prevented."
  *   **EV Calculation:** Robust. Consequentialism handles this easily.

  **Layer 2: Complex Cluelessness (The Long Term)**
  *   **Question:** What are the downstream consequences of those specific children surviving?
  *   **Scenario:** One of the children saved grows up to be a political leader in the region.
      *   *Possibility A:* They advocate for regional stability, leading to an economic boom (Massive Positive Value).
      *   *Possibility B:* They become an authoritarian warlord, exacerbating conflict (Massive Negative Value).
      *   *Possibility C:* They have a child who invents a technology that accidentally destroys the ecosystem (Massive Negative Value).
  *   **Epistemic State:** We have **no** empirical basis to assign probabilities to A, B, or C. We do not know the "causal propensity" of a saved life toward political stability vs. instability.
  *   **The Symmetry Attempt:** "Well, A and B seem equally likely."
  *   **Greaves' Rebuttal:** Why? Is the space of possible political outcomes binary? What if there are ten ways to be a warlord and only one way to be a stabilizer? Or vice versa? Without a theory of historical causality that we currently possess, any probability assignment is a guess.
  *   **The Dominance Problem:** If the magnitude of the long-term consequences (Possibility A/B/C) is vastly larger than the short-term consequence (saving a life today), then the EV of the act is dominated by the inscrutable long-term value.
      *   $EV = (ShortTerm \times HighProb) + (LongTerm \times InscrutableProb)$
      *   If $|LongTerm| \gg |ShortTerm|$, the $EV$ is effectively inscrutable.

  ### 6. Why This is "Load-Bearing"
  If Greaves is right, the distinction saves consequentialism from being trivially false (via simple cluelessness) but exposes it to a deeper skepticism (via complex cluelessness).

  1.  **If it were just Simple Cluelessness:** Consequentialism is safe. We just use standard decision theory under risk. The objection collapses into mundane empirical uncertainty.
  2.  **Because it is Complex Cluelessness:** Consequentialism faces a dilemma.
      *   *Option A:* Deny that long-term consequences matter (Short-termism). This contradicts the impartial, aggregative nature of most consequentialist theories (why does time matter morally?).
      *   *Option B:* Accept long-term consequences but admit we cannot calculate EV. This requires adopting a non-standard decision theory (e.g., imprecise probabilities, maximin, or a "cluelessness-friendly" rule), which may yield different action-guidance than standard maximizing consequentialism.

  ### Summary of the Disanalogy
  | Feature | Simple Cluelessness | Complex Cluelessness |
  | :--- | :--- | :--- |
  | **Source of Uncertainty** | Lack of specific information about a known system. | Lack of understanding of the system/causal structure itself. |
  | **Probability** | Assignable (precise or bounded). | Inscrutable / Unjustifiable. |
  | **Symmetry** | Can be evidenced (e.g., a fair coin). | Cannot be evidenced; relies on arbitrary partitioning. |
  | **EV Calculation** | Possible and action-guiding. | Dominated by inscrutable values; potentially paralyzing. |
  | **Relation to Consequentialism** | Absorbable by standard theory. | Requires structural revision or new epistemic norms. |

  Greaves' point is that moving from Simple to Complex isn't just "being more uncertain." It is moving from a state where you can rationally say "I estimate a 60% chance" to a state where saying "I estimate a 60% chance" is epistemically dishonest because the justification for that number is absent. Consequently, the "symmetry" defense is not a neutral way to resolve the uncertainty; it is a way of hiding the lack of justification.
