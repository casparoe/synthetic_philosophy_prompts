      *   **Defining Simple Cluelessness:**
          *   Analogy: Standard decision theory under risk/uncertainty.
          *   Key feature: We know the *relevant variables* and have a basis for probability assignments.
          *   EV works here.
      *   **Defining Complex Cluelessness:**
          *   Analogy: "Unknown unknowns" or Knightian Uncertainty (though Greaves is careful with labels).
          *   Key feature: We lack a partition of the possibility space that allows for probability assignment.
          *   The problem isn't just that probabilities are low; it's that they are *inscrutable*.
      *   **The Crucial Disanalogy (Kind vs. Degree):**
          *   Simple = Imprecise probabilities (range exists).
          *   Complex = No justification for *any* specific probability or range (inscrutability).
          *   Why symmetry fails: To claim symmetry (good effects = bad effects), you need evidence that the distribution is centered on zero. In complex cluelessness, you don't even know the distribution's shape. Assuming symmetry is an arbitrary stipulation, not an epistemic judgment.
