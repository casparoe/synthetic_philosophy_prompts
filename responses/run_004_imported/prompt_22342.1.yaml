          10. Hume claims this is "returning upon itself in infinitum."

      *   *Why is it vicious?* It's not just a circle; it's a *grounding* failure. To will $X$, $X$ must be intelligible/existent as an object of the will. But $X$ (the obligation/relation) only exists *because* of the willing. So the willing presupposes the existence of what it is supposed to create. It's a "bootstrapping" problem.

