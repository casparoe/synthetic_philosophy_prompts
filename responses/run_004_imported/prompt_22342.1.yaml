      *   *Refining the Contemporary Section:* Make sure to distinguish between "Hume is right" and "Hume set the terms of the debate." Most people accept the artificiality but dispute the *source* of the normativity (convention vs. expectation vs. autonomy).

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain the "relations" part clearly? For rationalists, morality *is* relations. So creating morality = creating relations.
