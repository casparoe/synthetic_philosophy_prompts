answer: |-
  The geothermal plant sat on the edge of the caldera like a concrete barnacle, humming with the heat of the earth. Elias had been the senior technician here for twenty years, ever since Old Vance retired. Now Vance was dead, and the三号 (Number 3) turbine was screaming.

  It wasn't a mechanical scream. It was a resonance spike, a shudder in the casing that rattled the teeth in Elias's skull. The digital readouts were green, but the analog gauges—the ones Vance had sworn by—were trembling in the red.

  Elias stood before the manual override console. To stabilize the turbine, he had to engage the damping field. But the strength of the field depended on a parameter Vance called *the anchor*.

  "Set the anchor to the hum," Vance had told him, decades ago, tapping the side of the main generator. "When the machine sings true, you lock it."

  For twenty years, Elias had set the anchor. He had done it hundreds of times. Every time, he listened for the fundamental frequency of the turbine's rotation, matched the damping field to it, and locked. It always worked. The machine sang true.

  But the Number 3 turbine was a retrofit. The new alloy casing changed the acoustic profile. Now, when the rotation hit the target RPM, the fundamental frequency was at 60 Hertz. But due to the new harmonics of the casing, there was a powerful overtone at 120 Hertz.

  In the old turbines, the 120 Hz overtone had been negligible. In the past, "the hum" and "the dominant resonance" had coincided. The data of Elias's past behavior was consistent with two distinct rules:

  1.  **Rule A:** Match the damping field to the *fundamental* rotational frequency.
  2.  **Rule B:** Match the damping field to the *dominant acoustic* resonance.

  Until today, Rule A and Rule B had produced identical actions. There was no fact in Elias's history, no neural state, no logbook entry that distinguished them. He had never summed *this* number before. He had never faced *this* divergence.

  If he followed Rule A (60 Hz), the damping would be too weak for the casing's resonance. The turbine would shake itself apart in ten minutes.
  If he followed Rule B (120 Hz), the damping would be too strong for the rotation. The magnetic lock would seize the shaft. The turbine would stall, the pressure would build, and the containment vessel would breach.

  Elias stared at the dial. His hand hovered over the input wheel.

  He closed his eyes, trying to summon Vance. He tried to remember the *feeling* of understanding the rule. He remembered the confidence. But confidence is a sensation, not a justification. He could feel confident now that he should jump off a cliff. That feeling didn't make the air solid.

  *Did Vance mean the fundamental?* Elias thought. *Or did he mean the sound?*

  There was no ghost in Vance's head that held the answer. Vance was dead, and even when he was alive, if you asked him, he would have just pointed to the machine and said, "That one." But "that one" was now two things.

  The paradox, which Elias had once read about in dusty philosophy journals during his own university days, ceased to be a puzzle. It became the cold sweat on his neck. It was the realization that the rails of meaning did not extend infinitely into the future. They stopped where the past data stopped. Beyond that, there was only a cliff.

  There was no fact of the matter about what Vance had meant. There was only the void.

  The alarm light began to strobe. Pressure rising. 400 PSI. 450.

  Elias realized that if he waited for the *truth* to reveal itself, the plant would explode. The truth wasn't coming. The universe did not care about his intention, nor Vance's.

  He looked at his hands. They were shaking.

  Kripke's skeptic would say he was unjustified. That he was guessing in the dark. A dispositionalist might say he should just do what he is inclined to do. But Elias knew his inclinations were terrified noise.

  He looked at the console, then at the sleeping quarters down the valley where the shift workers' families lived.

  He understood then that the meaning of "the hum" was not a hidden object Vance had possessed. It was not a mental state. It was a *commitment*.

  Vance hadn't been following a rule laid down by the universe; he had been participating in a practice. The practice was *keeping the lights on without killing anyone*. The rule was not a description of the past; it was a warrant for the future.

  If Elias chose 60 Hz and the turbine exploded, he would have been wrong. Not because he violated a metaphysical fact about Vance's intent, but because he broke the practice. If he chose 120 Hz and the shaft seized, he would have been wrong for the same reason.

  The correctness of the rule was not determined by the past; it was determined by the *consequences of the assertion*.

  Elias gripped the wheel. He couldn't know which rule was the "real" one. But he could know which rule *made sense* in the form of life they inhabited. The form of life was engineering, not acoustics. The goal was mechanical stability, not sonic purity.

  The fundamental frequency (60 Hz) was the mechanical reality. The overtone (120 Hz) was an artifact of the casing. To follow the *spirit* of the practice—mechanical integrity—he had to ignore the acoustic artifact.

  He turned the wheel to 60 Hz.

  He wasn't doing this because he had solved the paradox. He was doing it because he was accepting the responsibility of being the judge. He was stepping into the void and laying down a rail.

  He engaged the lock.

  The turbine groaned. The 120 Hz whine shrieked, then faded. The 60 Hz thrum deepened, solidified. The vibration in the floor smoothed out. The pressure gauge held at 500 PSI. Stable.

  Elias exhaled, his knees buckling slightly. He leaned against the console.

  He knew that tomorrow, someone might ask him, "What was the rule Vance taught you?" And he would say, "Match the fundamental."

  And that would become the rule. Not because it was the true rule hidden in the past, but because it was the rule that allowed the practice to continue. He had not discovered the meaning; he had *made* it, by aligning his action with the survival of the community that used the words.

  The paradox remained. There was still no fact that compelled his choice. But as he watched the steady green line of the monitor, Elias understood that meaning was not a chain binding him to the past. It was a bridge he built to the future, one step at a time, hoping others would walk it with him.

  He picked up his logbook. Under *Notes*, he wrote: *Anchor set to Fundamental. Overtone disregarded.*

  He closed the book. The rule was fixed. Until the next time the world changed.
