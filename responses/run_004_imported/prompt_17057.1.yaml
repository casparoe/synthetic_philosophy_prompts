  ok this is a bit of a random one but it's been bugging me. I'm a cognitive science PhD student (visual attention, so this really isn't my area) and I did a sensory deprivation float tank session a few weeks ago -- pitch dark, water at skin temperature, nothing touching your limbs -- so after a while you basically lose all sense of where your body is. But the whole time I was still completely certain that I existed, that there was a "me" having the experience, even though I had zero awareness of having a body at all. My housemate (did a philosophy minor, loves this stuff) says that basically proves the self is seperate from the body, maybe even evidence for a soul, since I was aware of "me" while aware of none of my body. That feels like too quick a jump to me but I can't say exactly why. Is there a real gap between "I was self-aware while unaware of my body" and "my self is (or could be) distinct from my body," and is this actually a known move somewhere in the history of philosophy?
