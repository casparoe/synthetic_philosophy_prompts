answer: |-
  Your intuition is spot on. Your housemate has made a classic category error, conflating **phenomenology** (how things appear to consciousness) with **ontology** (what actually exists).

  As a cognitive scientist, you are well-positioned to see the gap: just because a specific input channel (proprioception/exteroception) is silenced, it doesn't mean the hardware generating the "self" model isn't still entirely dependent on the body.

  Here is a breakdown of the logical gap, the historical precedent for this argument, and how contemporary philosophy of mind and neuroscience dismantle it.

  ### 1. The Logical Gap: Epistemology vs. Ontology
  The housemate's argument follows this structure:
  1.  I am aware of **Self**.
  2.  I am unaware of **Body**.
  3.  Therefore, **Self** can exist without **Body**.

  The gap is between *awareness* and *dependence*.
  *   **Epistemic Claim:** "I cannot perceive my body right now." (True in the tank).
  *   **Ontological Claim:** "My existence does not rely on my body." (Unproven).

  Just because you lose the *signal* doesn't mean you lose the *source*. A useful analogy is a VR headset. If you put on a headset that renders a void (no hands, no ground), you still experience a "perspective" within that void. However, that perspective is still entirely generated by the computer. The fact that the *avatar* is invisible doesn't mean the *hardware* is unnecessary.

  In your tank experience, the "self" you felt was likely a high-level cognitive construct (narrative, memory, pure awareness) that persisted even when low-level sensorimotor models were suppressed. But that construct was still being generated by your brain, which was still floating in salt water, consuming oxygen, and maintaining homeostasis.

  ### 2. The Historical Precedent: Descartes
  Your housemate has essentially reinvented **Cartesian Dualism**. This is the exact move René Descartes made in his *Meditations on First Philosophy* (1641).

  Descartes employed "methodological doubt." He argued that he could doubt the existence of his body (it could be an illusion, a dream, or a demon tricking him), but he could not doubt the existence of his thinking self (*Cogito, ergo sum*). From this **conceivability** (I can conceive of myself without a body), he inferred **possibility** (It is possible for me to exist without a body), and finally **actuality** (Therefore, mind and body are distinct substances).

  **Why philosophers reject this move today:**
  Most contemporary philosophers of mind (even many non-physicalists) reject the inference from *conceivability* to *metaphysical possibility*.
  *   **Kripke/Chalmers:** Some argue conceivability *does* entail possibility, but this is highly contested.
  *   **The Standard Objection:** Just because I can *imagine* X without Y doesn't mean X doesn't *depend* on Y. I can imagine a rainbow without knowing about raindrops and light refraction, but the rainbow is ontologically dependent on them. Similarly, you can imagine "self" without "body sensation," but the self-process may still be ontologically dependent on neural activity.

  ### 3. The Cognitive Science Explanation: The Phenomenal Self-Model
  Since you are in CogSci, the work of **Thomas Metzinger** will resonate here. In *Being No One* and *The Ego Tunnel*, Metzinger argues that the "self" is not a thing, but a process: a **Phenomenal Self-Model (PSM)**.

  *   **The PSM:** The brain creates a transparent model of the organism to help it navigate the world. Usually, this includes a body model (proprioception).
  *   **The Tank Effect:** In the float tank, you deprive the brain of the data needed to update the *body* part of the model. However, the *global* self-model (the sense of being a locus of experience) can remain active.
  *   **The Illusion:** The transparency of the model makes you feel like you *are* the experience, rather than *having* the experience.

  The fact that the PSM can run in "minimal mode" (without body representation) does not prove the PSM is non-physical. It just proves the PSM is modular. You are experiencing the **narrative self** or the **perspectival self** without the **embodied self**. All three are neural processes.

  ### 4. Counter-Evidence: Phantom Limbs
  If your housemate's logic held true ("Awareness of body proves body exists"), then **phantom limb syndrome** would be impossible.
  *   Amputees often feel vivid sensations (including pain) in limbs that no longer exist.
  *   **Implication:** Body awareness is generated internally; it is not a direct readout of physical reality.
  *   **Reverse Implication:** Therefore, the *lack* of body awareness (in the tank) does not prove the body is irrelevant. It just proves the internal model has stopped rendering the body mesh.

  ### 5. Interoception and the "Hidden" Body
  Even in a tank, you are not fully disconnected from your body.
  *   **Interoception:** You likely still had awareness of breathing, heartbeat, or the urge to swallow.
  *   **Vestibular:** Even in buoyant water, the inner ear is still functioning, though confused.
  *   **Neural Homeostasis:** The brainstem is aggressively monitoring the body to keep you alive.

  The "self" you experienced was likely anchored in these remaining subtle signals, or in the Default Mode Network (DMN), which handles autobiographical memory and self-referential thought. The DMN does not turn off just because proprioception does.

  ### Summary for your Housemate
  You can tell your housemate that their experience is valid phenomenologically, but their metaphysical conclusion is a non-sequitur.

  1.  **Historical Context:** They have replicated Descartes' *Meditations*, an argument that has been scrutinized for 400 years and is largely considered logically invalid in contemporary philosophy of mind.
  2.  **The Gap:** They are confusing the *content* of consciousness (no body image) with the *substrate* of consciousness (the living brain/body).
  3.  **The CogSci View:** The "self" is a simulation run by the brain. Turning off the "body graphics" in the simulation doesn't mean the computer (the body) is no longer running the program.

  The float tank proves that **body image is contingent**, not that **embodiment is optional.**
