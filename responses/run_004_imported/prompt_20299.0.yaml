answer: |-
  This is an exceptionally sharp intuition. You have identified a genuine tension that often gets glossed over in introductory surveys. Your colleague is right that Leibniz is frequently cited in the genealogy of functionalism, but you are also right to sense that the fit is awkward, specifically regarding causation and metaphysical unity.

  If we were to bring Leibniz up to speed on Putnam, Block, and the functionalist tradition, he would almost certainly end up as one of its **most fundamental opponents**, though he would agree with some of its starting premises. He would reject functionalism not because it is too abstract, but because it is not abstract *enough*—it remains tethered to the realm of "phenomena" (machines, aggregates, causal chains) rather than "substances" (unities, perceptions).

  Here is how that confrontation breaks down, working through the specific tensions you raised.

  ### 1. The Mill Argument: Shared Method, Opposite Conclusions
  Your intuition that the "mill" argument gestures toward multiple realizability is correct in terms of *method*, but Leibniz uses it to reach the opposite *conclusion*.

  *   **The Functionalist Move:** Functionalists argue that because the specific matter doesn't matter (neurons vs. silicon), the mind must be the *organization* or *function* itself.
  *   **Leibniz's Move:** Leibniz argues that because the specific matter doesn't matter (gears vs. neurons), the mind *cannot* be the organization of matter at all.

  For Leibniz, the Mill Argument is a *reductio ad absurdum* of mechanism. He is saying: "If you think perception is mechanical, imagine the mechanism large enough to inspect. You see only parts pushing parts. You do not see perception. Therefore, perception is not mechanical."

  Functionalists (like Putnam) use the abstraction from matter to save the mind for materialism (the mind is the software). Leibniz uses the abstraction from matter to save the mind from materialism (the mind must be immaterial). So, while Leibniz accepts a form of multiple realizability for *bodies* (a machine can be built of wood or metal), he denies it for *minds*. A mind cannot be "realized" by a machine, regardless of the machine's complexity, because a machine is always a composite, and composites cannot possess true unity.

  ### 2. The "Windowless" Problem: Causal Roles vs. Internal Representation
  This is the strongest point of friction you identified. Functionalism defines mental states by their **causal relations**: Input $\rightarrow$ Internal State $\rightarrow$ Output.

  Leibniz's metaphysics explicitly denies the reality of these relations between substances.
  *   **Functionalism:** Requires real transitive causation. When I step on a tack (input), my nerves fire, and I yell (output). The functional role of "pain" is defined by this causal chain.
  *   **Leibniz:** Monads have no windows. The tack does not cause the pain. The Monad containing "me" unfolds its state of "pain" spontaneously, synchronized by God with the Monad containing the "tack" and the Monad containing my "vocal cords."

  If you asked Leibniz to define pain functionally, he would say you are describing the *phenomenal appearance* of the interaction, not the metaphysical reality. For Leibniz, a mental state is defined by its **internal representational content** (how clearly it perceives the universe) and its **appetition** (its drive to move to the next state), not by its causal leverage on the outside world.

  To a functionalist, a mind that cannot causally interact with inputs or outputs is a "brain in a vat" scenario that threatens to break the functional definition. To Leibniz, *all* minds are effectively "brains in vats" (or rather, windowless rooms), and the fact that functionalism requires real causal windows makes it a category error. He would argue functionalism mistakes the *well-founded phenomena* of interaction for the *substantial reality* of perception.

  ### 3. The Unity Argument: Aggregates vs. Substances
  This is the metaphysical dealbreaker. Functionalism is comfortable with **aggregate systems** having minds. This is the core of Ned Block's "Chinese Nation" thought experiment: if the population of China organizes themselves to function like a brain, they constitute a mind.

  Leibniz would find this metaphysically impossible.
  *   **Functionalism:** A mind is a system of parts functioning together. If the parts are people, radios, or neurons, it doesn't matter.
  *   **Leibniz:** A mind must be a **true unity** (*unum per se*). An aggregate (like a machine, a flock of sheep, or the population of China) is only a *unum per aggregationem* (a unity by aggregation). It is a collection, not a thing.

  In *Monadology* Section 17, Leibniz implies that perception requires a subject that is one. A machine, no matter how complex, is always a "heap" of parts. If you scale up the machine to the size of a mill, you see the parts. If you scale up the Chinese Nation, you see the people. You never find the "I."

  Leibniz would argue that Functionalism commits the fallacy of composition: it assumes that if you arrange enough non-thinking parts (or people acting as neurons) in the right functional pattern, thinking will emerge. For Leibniz, you cannot get unity out of multiplicity. You cannot get perception out of parts pushing parts. Therefore, the "Chinese Nation" might *act* like it has a mind (functional success), but it would be a "philosophical zombie"—it would have no internal perception, no *qualia*, because it lacks substantial unity.

  ### 4. Where They Might Agree (The "Software" of the Monad)
  Is there any ground for alliance? Yes, but it requires twisting Functionalism into something Leibniz would recognize.

  Leibniz does believe that Monads follow a kind of internal "program." Each Monad contains a complete concept of its future states, unfolding in a pre-determined sequence. This looks remarkably like a **solipsistic functionalism**.
  *   Instead of Input $\rightarrow$ State $\rightarrow$ Output, Leibniz has State$_{t1}$ $\rightarrow$ State$_{t2}$ $\rightarrow$ State$_{t3}$.
  *   The "function" is internal to the substance.

  If Functionalism were stripped of its requirement for external causal inputs and redefined as "the abstract pattern of state transitions," Leibniz might accept that *description* applies to the internal life of a Monad. However, he would insist that this pattern is grounded in an immaterial substance, not in the functional organization of a physical system.

  ### The Verdict
  Leibniz would view Putnam-style Functionalism as a sophisticated version of the materialist error he was trying to correct in 1714.

  1.  **On Multiple Realizability:** He agrees that the *substrate* doesn't determine the *nature* of the thing, but he concludes the mind must therefore be immaterial, whereas Functionalists conclude the mind is substrate-neutral physical organization.
  2.  **On Causation:** He rejects the causal inputs/outputs required by Functionalism as merely apparent (Pre-established Harmony).
  3.  **On the Chinese Brain:** He would side with Block's intuition (that the Chinese Nation lacks qualia) but for a deeper reason: not just that it feels weird, but that an aggregate *cannot* be a subject of experience.

  So, to answer your specific question: Leibniz would not embrace Functionalism as a natural extension. He would view it as a **category mistake** that confuses the *phenomenal description* of a machine (which can be functionalized) with the *metaphysical reality* of a mind (which must be simple and windowless).

  Your intuition that the "windowless" doctrine creates a tension is the key. Functionalism is a theory of how minds connect to the world. Leibniz is a theory of how minds *are* despite not connecting to the world. They are talking past each other, with Leibniz operating at a metaphysical depth that Functionalism explicitly tries to bypass.
