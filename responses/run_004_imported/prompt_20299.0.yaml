      *   *Point 3: Unity vs. Aggregation.* This is the metaphysical killer. Functionalism allows aggregate systems (China Brain) to have minds. Leibniz says aggregates are "phenomena bene fundata" (well-founded phenomena), not true unities. A mind must be a true unity. A machine (or functional system) is always a "heap."
      *   *Point 4: Pre-established Harmony as a "Functional" Mapping?* Could we save it? Maybe PEH looks like a perfect functional mapping. But it removes the *causal* efficacy functionalism needs.
      *   *Conclusion:* Leibniz would reject Functionalism as a category error. He would agree that the *substrate* doesn't matter (Multiple Realizability), but he would deny that *any* substrate-based organization constitutes a mind. Minds are substratum-less (immaterial).

