      *   *Argument from Authorship:* Authorship is an act, not a state. To author is to do something. If two people do the same thing independently, they have performed two distinct acts. Copyright protects the *labor of the mind* (Lockean), not just the output.
      *   *Argument from Value:* Why do we value Menard's *Quixote*? Because of the *feat*. The value lies in the genesis. Copyright aims to incentivize creation, not just possess text.
