answer: |-
  The standard explanation for copyright's independent-creation defense is indeed pragmatic: it is a rule of procedure, not ontology. It assumes that because direct evidence of copying (smoking guns, admitted theft) is rare, we must rely on access and substantial similarity as proxies. If there is no access, there is no copying, and thus no infringement. On this view, if we *could* prove that two authors independently produced identical texts, the law would still treat them as the same work, but it simply lacks the mechanism to punish the "coincidental infringer."

  But you are right to sense that this explanation is too thin. It treats the literary work as a static object—a sequence of words—rather than an event. By leaning on Borges's *Pierre Menard*, we can argue that copyright law is actually grasping a deeper metaphysical truth about art: **a literary work is not individuated by its text alone, but by its genesis.** The law is not merely papering over a problem of proof; it is correctly identifying that two verbatim-identical manuscripts, born of separate minds, are ontologically distinct works.

  Here is the argument for why copyright's independent-creation rule tracks the true nature of the literary work.

  ### 1. The Semantic Argument: Context Constitutes Meaning
  The most immediate objection to the idea that identical texts are distinct works is the intuition that "the words are the same." But in literature, the words are not the work; the words are the *score* for the work. The actual aesthetic object is the meaning generated in the interaction between text and context.

  Borges illustrates this perfectly. Cervantes's *Quixote* is a naturalistic, straightforward satire of chivalry written in the 17th century. Menard's *Quixote*, written in the 20th century, is a labyrinthine, ironic meditation on history and authorship. The sentences are identical, but the propositions they express are not. When Cervantes writes about history, he is describing his present; when Menard writes the same line, he is describing the past.

  If the meaning of a text is contingent upon the historical and intentional context of its production, then the "work" cannot be severed from that context. To define the work solely by its string of characters is to commit a category error, confusing the physical vehicle with the communicative act. Copyright law, by requiring a causal link between author and text, implicitly acknowledges that the value being protected is the *expression situated in a specific mind and moment*, not the abstract pattern of language.

  ### 2. The Argument from Authorship as Action
  Patent law protects *inventions*; copyright law protects *works of authorship*. This distinction is crucial. An invention is often defined by its utility or function. A mousetrap that snaps shut is functionally identical regardless of who built it. Function is context-neutral. Therefore, patent law treats the invention as a solution to a technical problem, and if two people solve the problem, the first to file owns the solution. The history of making is irrelevant to the utility.

  Authorship, however, is not a solution; it is a speech act. It is an extension of the self into the world. In the Lockean labor theory of property, which undergirds much of intellectual property philosophy, rights are justified by the mixing of one's labor with the commons. In copyright, the "labor" is the specific cognitive journey the author took to arrange those words.

  If Author A and Author B write the same poem independently, they have performed two distinct labor events. They have traversed different cognitive paths to arrive at the same destination. To say Author B infringes Author A is to claim that Author A owns the *destination* (the text) rather than the *journey* (the act of creation). Copyright law refuses this. It protects the trajectory, not just the terminus. By requiring independent creation as a defense, the law affirms that the property right attaches to the *act of originating*, not the *state of existing*.

  ### 3. The Ontology of the "Work"
  In analytic aesthetics, there is a debate about whether a work of art is a "type" (an abstract structure) or a "token" (a physical instance). Copyright law suggests a third option: the work is a **historical individual**.

  Consider a forger who creates a perfect visual replica of a Van Gogh. Physically, chemically, and visually, it may be identical to the original. Yet, we do not say it *is* a Van Gogh. We say it is a fake. Why? Because the work's identity is tied to its causal history—specifically, that it was produced by Van Gogh's hand at a specific time.

  Literature functions similarly, though the "fake" problem is rarer. If the identity of a painting is tied to its history of production, consistency demands that the identity of a novel is as well. If we accept that a painting is individuated by its genesis (which is why we value the original over the forgery), we must accept that a novel is too. The independent-creation rule is the legal recognition of this ontological fact. It asserts that a book is not a disembodied string of data, but a trace of a human consciousness. Two traces that look the same but come from different sources are, in fact, two different things.

  ### 4. Incentivizing the "Menardian" Feat
  Finally, there is a teleological argument. The purpose of copyright is to "promote the Progress of Science and useful Arts." If copyright protected text in isolation (like patent), it would disincentivize independent discovery. If I knew that someone else had already written the book I am currently writing, and that finishing it would make me a liable infringer regardless of my ignorance, I would stop writing.

  But beyond mere economics, there is a cultural value in the Menardian feat. We value Menard's *Quixote* precisely because it is difficult to arrive at those words in the 20th century. We value the independent recreation of form. By protecting independent creators, copyright law acknowledges that the re-emergence of a form through a new consciousness is a *new contribution to culture*, even if the surface text is identical. It validates the idea that culture is not just a library of texts, but a living conversation of minds. If two minds independently say the same thing, the culture has gained two instances of that thought, not one.

  ### Conclusion
  The evidentiary explanation suggests that copyright *wishes* it could punish the independent creator but simply can't prove they copied. The ontological explanation argues that copyright *should not* punish the independent creator because there is nothing to punish. There is no theft because there is no single object that was taken.

  The text is not the work. The work is the text *as authored*. By anchoring liability in copying rather than similarity, copyright law inadvertently stumbles upon a profound truth of aesthetics: that art is not a thing, but a history. Two identical manuscripts are not two copies of one book; they are two distinct books that happen to share a shape. Borges knew this; the law, in its own clumsy way, knows it too.
