prompt: |-
  Me and my friend Dana have been arguing about this for weeks and neither of us is backing down, so I want to see the strongest version of both sides laid out properly instead of us just talking past each other. Basic question: can you actually have a real, justified opinion that something is aesthetically good (a painting, an album, a book, whatever) just because someone you trust told you its good, the same way I can justifiably believe there's leftover pizza in the fridge because my roommate told me and I've got no reason to doubt her? Normally if someone reliable tells me a fact, I just believe it and that counts as knowing it, no big deal. But art feels different somehow. Dana thinks that if a critic she really trusts calls some painting she's never seen a masterpiece, she can just believe "that painting is great" on the critic's word, same as any other fact someone vouches for. I think that's off — there's something empty about calling a painting great when you've never even laid eyes on it, like you actually have to experience the thing yourself before the judgment means anything, no matter how much you trust whoever's vouching for it. I poked around online a bit and apparently this is a real thing people argue about (something about "aesthetic testimony" and a rule called the "acquaintance principle"), but everything I found just asserted a side instead of actually walking through why.

  Can you write this up as a dialogue between the two of us — one character totally convinced that secondhand aesthetic opinions can be just as justified as any other testimony-based belief, and one character convinced that aesthetic judgments specifically require you to have encountered the work yourself before you're entitled to hold them. Feel free to just base them loosely on me and Dana. Don't let either one be a pushover for the other though: they should both have genuinely good moves, actually respond to whatever the other person just said instead of restating their opening pitch, and ideally land on whatever the most interesting sticking point between them turns out to be, even if it doesn't get fully resolved.
