prompt: |-
  So this happened to me last week and I still haven't shook it off. I was driving back from giving a guest lecture at another campus, running a bit behind schedule, and passed a car pulled over on the shoulder with its hazards on -- someone standing next to it looking pretty stressed out. I didn't stop, told myself someone else would get to it, plus I had a stack of exams waiting on me at home. That same evening I also skipped my usual $50 donation to the effective giving fund I support, figuring i'd just double up next month instead. Over dinner I mentioned both things to my partner, who's not in philosophy, and she said they're basically the same kind of failure -- that the only difference is one's vivid and close and the other isn't, and that shouldn't matter morally. I pushed back hard, saying the roadside case felt way more urgent to have blown off, but I couldn't actually explain why beyond "it just does."

  I teach intro ethics every fall and I'm embarrassed that I can't sort through my own case cleanly. Is there a principled reason the roadside omission should weigh heavier on my conscience than the donation one, or is my partner right that this is just distance and vividness messing with my judgment and I should feel equally bad about both? Curious how you'd talk me through this.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Situation:**
      *   **User:** Ethics professor (teaches intro ethics).
      *   **Situation:** Passed a stranded motorist (didn't stop) + Skipped a monthly $50 donation to an effective giving fund.
      *   **Conflict:** Partner (non-philosopher) says both are morally equivalent failures (omission to help), differing only in vividness/distance. User feels the roadside omission is worse but can't articulate why philosophically.
      *   **Goal:** The user wants a principled ethical analysis to sort through their conscience. They want to know if there's a valid distinction or if they are suffering from cognitive bias.
      *   **Tone:** Empathetic, intellectually rigorous (they are a colleague in a sense), conversational but precise.

  2.  **Identify the Core Ethical Question:**
      *   Is there a morally relevant difference between a *proximate, vivid emergency omission* (stranded motorist) and a *distant, abstract statistical omission* (skipped donation)?
      *   This touches on:
          *   Peter Singer's "Famine, Affluence, and Morality" (the partner's view).
          *   Special Obligations/Role Morality (the professor's potential defense).
          *   Urgency/Immediacy.
          *   Certainty of Outcome.
          *   Psychological bias (identifiable victim effect).

  3.  **Brainstorming Ethical Frameworks:**

      *   **Utilitarianism (Singer-esque):**
          *   *Partner's View:* Strong support. Distance and vividness are morally irrelevant. Suffering is suffering. $50 could save a life (malaria nets, etc.). Stranded motorist might just need a jump start.
          *   *Counter:* Uncertainty. The donation *probably* does good. The roadside help *might* be dangerous or unnecessary.
          *   *Verdict:* Partner is mostly right here, but uncertainty matters.

      *   **Deontology (Kantian/Rights-based):**
          *   *Duty of Rescue:* Is there a perfect duty to rescue someone in immediate peril vs. an imperfect duty to beneficence (charity)?
          *   *Proximity:* Does physical proximity create a specific agent-relative obligation?
          *   *Verdict:* There is a traditional distinction between "negative duties" (don't harm) and "positive duties" (help). Both are positive, but rescue is often seen as more stringent than beneficence.

      *   **Virtue Ethics:**
          *   *Character:* What does skipping the donation say vs. driving past?
          *   *Emotions:* The guilt feels different. Why? Because one violates a specific social expectation of immediate aid.
          *   *Verdict:* The "vividness" isn't just bias; it's an emotional cue about the nature of the relationship to the victim.

      *   **Practical/Epistemic Differences:**
          *   *Certainty:* The donation's impact is statistical (effective altruism claims high probability, but it's still abstract). The motorist's need is concrete *but* the solution is unknown (might need a mechanic, not a ride).
          *   *Risk:* Stopping carries personal risk. Sending money does not.
          *   *Uniqueness:* If I don't stop, *no one* might (bystander effect). If I don't donate, someone else might (fungibility of money).

  4.  **Structuring the Response:**
      *   **Validation:** Acknowledge the discomfort. It's a classic philosophical puzzle (Singer vs. Intuition). Validate that being an ethicist doesn't immunize one from moral residue.
      *   **The Partner's Argument (The Singer Case):** Lay out why she's philosophically strong. Distance/vividness shouldn't matter. The "shallow pond" analogy.
      *   **The Professor's Intuition (The Distinctions):** Explore where the intuition might be tracking something real, not just bias.
          *   *Urgency/Immediacy:* Emergency vs. Ongoing need.
          *   *Certainty of Need:* Visible distress vs. Statistical need.
          *   *Uniqueness of Agency:* "If not me, who?" (Bystander) vs. "If not me, someone else."
          *   *Risk/Cost:* Physical risk of stopping vs. financial cost of donating.
      *   **The "Effective Altruism" Counter-Counter:** Address the $50 specifically. In EA terms, $50 might save a life. A jump start probably won't. This challenges the professor's intuition hard.
