answer: |-
  First, take a breath. The fact that this is sticking with you is evidence not of hypocrisy, but of moral engagement. If you were a cynic, you wouldn't be losing sleep over this. The fact that you teach ethics makes the discomfort sharper, but it doesn't mean you're failing at it; it means you're taking the material seriously enough to let it bite.

  Your partner has stumbled into a very robust philosophical position, essentially Peter Singer's "Famine, Affluence, and Morality" argument. But your intuition that there is a difference isn't just "noise." There are principled distinctions in ethical theory that might validate why the roadside omission feels heavier, even if the donation omission was potentially more consequential.

  Here is a breakdown of the arguments on both sides, and where the principled distinctions might lie.

  ### 1. The Partner's Case: The Irrelevance of Distance
  Your partner is channeling classic utilitarianism and the Effective Altruism (EA) framework. The argument here is strong:
  *   **Moral Equivalence:** Suffering is suffering. A life lost to malaria because of a missed $50 donation is just as real as a life potentially endangered by a stranded motorist.
  *   **The Bias:** Psychology calls this the *Identifiable Victim Effect*. We are wired to care more about a specific, visible person than a statistical multitude. From a strict consequentialist view, this is a cognitive bug, not a feature.
  *   **Impact:** If your $50 goes to the Against Malaria Foundation, the expected utility (lives saved/improved) is likely mathematically higher than the probability that a stranded motorist was in genuine peril requiring *your* specific intervention.

  If you hold a strict consequentialist view, your partner is right. The vividness is manipulating you.

  ### 2. The Professor's Case: Principled Distinctions
  However, most people (and many ethical frameworks) reject the idea that *all* omissions are equal. Here are four principled reasons why the roadside case might carry a different moral weight, distinct from bias.

  **A. Duty of Rescue vs. Duty of Beneficence**
  In deontological and common-law ethics, there is often a distinction between a *duty of rescue* and a *duty of beneficence*.
  *   **Rescue:** When you encounter someone in immediate, acute distress where you are the only available agent, a special obligation arises. It is agent-relative. You are *here*, they are *there*.
  *   **Beneficence:** The duty to help others generally (like donating to charity) is usually considered an *imperfect duty*. You have a duty to help *someone*, sometime, in *some way*, but you have discretion over how to fulfill it.
  *   **The Distinction:** Skipping the donation is a failure of general beneficence. Driving past the motorist is a failure of specific rescue. The latter feels heavier because it violates a more stringent, immediate social contract.

  **B. Epistemic Certainty and Fungibility**
  *   **The Donation:** The need is certain (the fund needs money), but your *agency* is fungible. If you don't donate this month, someone else might. The problem is diffuse.
  *   **The Motorist:** The need is vivid, but your *unique agency* is highlighted. You were the only car there at that moment. If you don't stop, the "bystander effect" suggests no one might.
  *   **The Counter-Point:** However, you didn't *know* the motorist needed you. They might have had AAA on the way. With the donation, you know the money is needed. So, epistemically, the donation is actually clearer. But phenomenologically, the motorist presents a *claim* on you that the charity does not.

  **C. Risk and Cost**
  *   **The Donation:** The cost is $50. The risk is zero.
  *   **The Motorist:** Stopping involves physical risk (traffic, potential danger from the stranger) and time cost. Ethics generally acknowledges that the duty to rescue is limited by the risk to the rescuer.
  *   **The Weight:** If you feel bad about the motorist, it might be because you judged the risk/cost as lower than it actually was in the moment, or you feel you overestimated the risk to justify skipping the duty.

  **D. Urgency and Reversibility**
  *   **The Donation:** You can double up next month. The harm of a one-month lapse in statistical giving is marginal.
  *   **The Motorist:** The situation was time-sensitive. If they were in danger, that window is closed. You cannot "make up" the missed opportunity next week. The irreversibility of the omission creates a specific kind of moral residue.

  ### 3. So, who is right?
  It depends on which ethical framework you privilege in your personal life, and honestly, it's okay if that differs from what you teach in Intro Ethics.

  **Your partner is right about the *outcome*:**
  If we look purely at the state of the world, the missed donation likely did more net harm (in terms of suffering prevented) than the missed roadside stop. The motorist probably just needed a jump; the $50 could have distributed bed nets. If you are a utilitarian, you should feel worse about the donation.

  **You are right about the *relationship*:**
  Morality isn't just about outcomes; it's about who we are in relation to others. The roadside omission feels worse because it was a failure of **presence**. You were physically confronted with a claim on your humanity and you looked away. The donation is a failure of **commitment**.
  *   Failing a commitment is bad.
  *   Failing a face-to-face encounter feels like a betrayal of a social bond, even a fleeting one.

  ### 4. How to sort your conscience
  You are feeling "moral residue." That is actually a good thing. It means your intuitive moral machinery is working, even if your theoretical machinery is jammed.

  Here is how I would talk you through it:
  1.  **Acknowledge the Bias:** Admit that vividness *is* manipulating you. The motorist is likely fine. The people the donation would have helped are not abstract; they are just invisible.
  2.  **Validate the Distinction:** Acknowledge that the *type* of failure was different. You failed a specific duty of rescue (even if the need was low) and a general duty of beneficence. It is permissible to feel the specific failure more acutely; that is how humans are wired to maintain local social order.
  3.  **The "Doubling Up" Trap:** You mentioned you told yourself you'd "double up next month." We both know that's often a rationalization. The donation omission is likely the more significant moral failing in terms of global impact, precisely because it was easier to do and you talked yourself out of it.
  4.  **Action over Rumination:** The guilt isn't useful unless it changes behavior.
      *   Set the donation to auto-pay so you don't have to "decide" next month.
      *   Decide now what your policy is for stranded motorists (e.g., "I call 911 if I don't stop," or "I stop only if...").

  **The Verdict:**
  Your partner is philosophically consistent with consequentialism. You are philosophically consistent with a virtue ethics or duty-based view that values proximity and immediacy. Neither is "wrong," but the consequentialist view is usually the harder pill to swallow because it demands more of us.

  Don't let the fact that you couldn't articulate this in the moment embarrass you. Moral reasoning in the wild is messy. The fact that you are analyzing it now means you're doing the job. Forgive yourself for the motorist, fix the auto-pay for the donation, and use this exact story in your Intro Ethics class this fall. It's a perfect case study.
