answer: |-
  **The Traditionalist:** Let's begin with the bedrock. In the fog of war, we treat combatants as moral equals. A soldier on the unjust side has the same right to kill enemy combatants as the soldier on the just side, and both are equally liable to be killed. This isn't metaphysics; it's the only way to keep war from becoming total slaughter.

  **The Revisionist:** But that contradicts our deepest moral intuitions outside of war. If a bandit attacks me to steal my wallet, I may kill him in self-defense. He has no right to kill me to prevent his own arrest. Why does putting on a uniform change the underlying morality of self-defense?

  **The Traditionalist:** Because war isn't a bar fight. It's a collective institution. Soldiers are instruments of the state, not private agents. If we tell the unjust soldier, "You have no right to fight," we strip him of any incentive to follow the rules of engagement. He becomes a criminal, not a combatant.

  **The Revisionist:** You're conflating liability with blameworthiness. An unjust combatant might be excused—he might not be *blameworthy* if he was deceived. But he is still *liable*. He is contributing to an unjust threat. Liability tracks the objective threat, not the subjective guilt.

  **The Traditionalist:** Here is the epistemic wall: Soldiers rarely know the true *jus ad bellum*. They are told their cause is just. If liability depends on the objective justice of the cause, then almost no soldier can know if they are permissible targets. You make the battlefield legally and morally unintelligible to the people fighting on it.

  **The Revisionist:** Ignorance is an excuse, not a shield. If I mistakenly believe you are attacking me, and I shoot you, I am not blameworthy, but I am still an unjust threat. You can stop me. My ignorance doesn't give me a right to kill you. Why should a soldier's ignorance grant him a right to kill just combatants?

  **The Traditionalist:** Because if you remove that right, you collapse the independence of *jus in bello* from *jus ad bellum*. The laws of war work because they apply symmetrically. If only the "just" side has combatant privileges, every soldier will claim to be just, and no one will respect the rules of restraint. Symmetry is a functional necessity for humanitarian law.

  **The Revisionist:** We don't apply that logic to domestic law. We don't give murderers "combatant privileges" to encourage them to use clean bullets. We say murder is wrong, full stop. If the war is unjust, the killing is, at base, wrongful. Hiding behind a convention doesn't change the victim's right not to be killed.

  **The Traditionalist:** Domestic analogy fails. Police have a monopoly on force; soldiers do not. Consider the conscript. He is coerced, perhaps deceived, fighting for an unjust regime. Under your view, is he liable to be killed? If yes, you punish the coerced. If no, then the Moral Equality of Combatants fails, because the just soldier facing him lacks the right to kill.

  **The Revisionist:** I distinguish liability from justification. The conscript might not be liable if he is truly non-responsible. However, the just combatant may still be *justified* in killing him out of necessity to protect others. We can acknowledge the conscript's innocence while admitting he must be stopped. The symmetry you want is an illusion.

  **The Traditionalist:** But "necessity" is a slippery slope compared to "right." If the just soldier kills out of necessity rather than against a liable target, the moral burden shifts heavily onto him. It makes every killing a tragic remainder rather than a permitted act of war. This erodes the psychological barrier against slaughter. The convention *creates* the moral reality of the battlefield.

  **The Revisionist:** The convention can't create moral reality where there is none. It can only regulate it. If we say the unjust soldier has a "right" to kill, we are lying about the victim. The victim did nothing to forfeit their life. I'd rather have a theory that tells the truth about liability, even if it complicates the legal code.

  **The Traditionalist:** Truth without traction is useless. If your theory tells a conscript he is liable, he will fight harder. If it tells the just soldier he is killing non-liable agents, he may hesitate or, conversely, dehumanize the enemy as "obstacles" rather than peers. The Moral Equality of Combatants treats them as peers to preserve their humanity.

  **The Revisionist:** Treating them as peers is good, but not by falsifying their moral status. We can treat them with respect while acknowledging they are, tragically, on the wrong side. The crux for me is whether epistemic limitation negates liability. I say it does not. It only negates blame. If you think ignorance removes liability, we disagree on the nature of rights.

  **The Traditionalist:** And my crux is whether the convention itself is a moral prerequisite. I argue that without the *institution* of symmetric rights, the *morality* of war collapses into chaos. If you can show me that rejecting symmetry would actually lead to fewer unjust deaths in practice, not just in theory, I would concede. But I believe the symmetry is the only thing holding the line.

  ***

  **The Crux Statements**

  **The Traditionalist:** "My position rests on the claim that **the moral reality of the battlefield is constituted by the convention itself.** If you believe that deep moral facts about liability exist independently of and override the functional conventions of war, my view fails. But if you agree that the convention is what *makes* the killing permissible in a collective context, symmetry is indispensable."

  **The Revisionist:** "My position rests on the claim that **liability is objective and tracks responsibility for unjust threats, regardless of epistemic limitations.** If you believe that a soldier's reasonable ignorance of the *ad bellum* status renders them non-liable (rather than merely excused), my view collapses. I hold that you can be a liable target even if you are not a blameworthy person."
