answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I am Marguerite's niece/nephew, and like many people in this room, I am also a writer. But long before I had a book on a shelf, I had a draft in Marguerite's workshop, and a red pen in my margin.

  Standing here to honor a critic is a unique challenge. Specifically, it is a challenge to stand here and speak about Marguerite's excellence without simply asserting it. Because if there is one thing Marguerite has taught us, it is that a verdict handed down from on high is worthless. She believes that no critic's word, however trusted, can do the work of the reader's own acquaintance with the page.

  So, I am not going to tell you that Marguerite is a brilliant critic. I am not going to tell you she is a generous aunt or a rigorous teacher. I am simply going to offer you some evidence, and let you come to your own conclusions.

  For forty-one years, Marguerite served as chief book critic for a national paper. In that time, she filed roughly a thousand reviews. Some were takedowns, some were celebrations, many were nuanced explorations of why a sentence sings or stumbles. But there is a running joke among her former students—and I suspect, a source of mild frustration for her editors—that in forty-one years, across hundreds of thousands of words, Marguerite never once used the word "good."

  To her colleagues, this is a philosophical stance. It's a skepticism about aesthetic testimony. But to her family, and to us, her students, it was something more practical. It was an invitation.

  When I was twenty-two and I handed her a story I thought was "good," she wouldn't confirm it. She would ask me which paragraph I was most afraid to cut. When a relative recommended a book to her, saying, "You'd love this, it's so good," she wouldn't agree. She would ask, "Where did you feel the pace quicken?"

  For a long time, I thought this was just her way of keeping us humble. But I've come to realize it was her way of keeping us honest. She understood that the word "good" is a stop sign. It's a place where thinking ends. If a critic tells you a book is good, you don't have to read it to know its value. You just have to trust the critic. And Marguerite has never wanted your trust. She has wanted your attention.

  To the friends and family in the room: You know her as a woman of marvelous taste. You've seen the bookshelves in her study, the recommendations she slips into birthday cards. You might wonder why she never just tells you what to love. It is because she loves you too much to outsource your joy. She wants you to have the fight with the text. She wants the revelation to be yours, not hers.

  To the critics and students in the room: You know this discipline better than anyone. You know the weight of the red pen. You know that her refusal to simplify was never about cynicism. It was about respect for the art form.

  So, as we look at forty-one years of columns, forty-one years of workshops, and forty-one years of Sunday mornings spent arguing over syntax, I could ask you to raise a glass to her greatness. But that would violate the house rules.

  Instead, look at the work. Look at the writers she championed before they were famous. Look at the students she pushed until they found their own voices. Look at the clarity she brought to the messy business of art.

  Marguerite, you have spent a lifetime refusing to tell us what to think, and in doing so, you have taught us how to see. You have given us the tools to judge, the courage to disagree, and the patience to read closely.

  So, I invite you all to raise your glasses. I will not tell you that this moment is "good." I will not tell you that this career was "great." I will simply point to the woman of the hour, and to the room full of people who are here because her words made them think, and made them feel, and made them read.

  To Marguerite. May your retirement be exactly as you define it.
