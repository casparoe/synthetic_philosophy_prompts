answer: |-
  Good evening. For those who don't know me, I'm the sibling who reads philosophy for fun. Which means half this room is worried I'm going to give a lecture, and the other half is just waiting for me to finally explain what I actually do.

  I know there's a question that's been floating around the family group chat leading up to today. It's asked half-jokingly, but it's everywhere: "What finally tipped the scales?" People want to know the specific reason why [Sister] chose [Groom] over a previous, genuinely good relationship. They want the variable that solved the equation.

  Now, [Groom], I know you and half this room speak the language of economics. You know the standard assumption: that for any two options, one must be better, worse, or equal. It's how we model rationality. But having spent the last two weeks immersed in the philosophy of choice, I can tell you that life rarely respects our models.

  Sometimes, the scales don't tip. Not because the weights are identical, but because they are different kinds of wonderful. Comparing two life paths isn't like comparing two prices. It's more like comparing a career to a family, or safety to adventure. You can't put them on the same scale.

  When you face a choice like that, reason runs out. There is no hidden factor waiting to be discovered. There is no secret metric that says one person is objectively "the one." And that is actually the most romantic part of this whole story.

  Because when the reasons run out, *you* begin.

  In those moments, we don't *find* the reason to choose; we *create* it. By standing here, by making a commitment, you put your weight behind one option. You become the author of the value. [Sister] didn't choose [Groom] because he was objectively better than everyone else who came before. She chose him, and through that act of will, through the courage to commit when the answer wasn't obvious, she made him the right choice.

  So, to the relatives asking what tipped the scales: nothing did. She picked up the scales and set them down where she wanted them.

  To [Sister] and [Groom]: May your life together be full of hard choices, and may you always have the courage to make the reasons for yourselves.

  To the happy couple!
