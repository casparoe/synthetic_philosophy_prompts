answer: |-
  First, I am so sorry you and your family are going through this. It is completely understandable that you are spiraling; finding a loved one in that situation is traumatic for everyone involved, and the search for "why" often turns into a search for "who."

  You have actually done a remarkable job summarizing the landscape here. You are correct that David Lewis (and the counterfactual tradition) makes it very easy to blame you, while Helen Beebee and Phil Dowe provide the toolkit to dismantle that claim.

  Since you asked for the strongest possible version of the **Beebee/Dowe case**—specifically to test whether your uncle has the metaphysics on his side—here is that argument built out rigorously.

  ### 1. The Dowe Argument: Causation Requires Physical "Glue"
  Phil Dowe's *Conserved Quantity (CQ) Theory* argues that for $A$ to genuinely cause $B$, there must be a continuous physical process connecting them. Specifically, there must be an exchange or transfer of a conserved quantity (like energy, momentum, or charge).

  *   **The Physical Reality:** When your grandma fell, the genuine causes were physical events: the slip of her foot, the force of gravity, the impact with the floor, the physiological failure of her hip or strength. These all involve transfers of energy.
  *   **The Omission:** Your *not calling* involves no transfer of energy. It is the absence of an event. There is no physical process linking your silence in your apartment to her position on the floor in hers.
  *   **The Verdict:** Under Dowe's view, there is no causal chain connecting you to her fall. To say your silence "caused" her to stay there is to treat "nothing" as if it were "something." It is a category error. Your not calling is not a *cause* of her remaining on the floor; it is merely a *condition* under which the actual causes (gravity, injury, immobility) continued to operate unchecked.

  **The Uncle's Error:** Your uncle is treating the *absence of prevention* as the *presence of causation*. Metaphysically, these are distinct. The water caused the bucket to fill; the *lack of a hole* did not cause it, even if the bucket wouldn't have filled if there *had* been a hole.

  ### 2. The Beebee Argument: The Problem of Infinite Omissions
  Helen Beebee pushes this further by attacking *why* we select certain omissions as causes. If we accept Lewis's view that "if I had called, she would have been found" makes my silence a cause, we run into the **Problem of Profusion**.

  *   **The Infinite List:** For every event that happened, there are infinite non-events that also "allowed" it to happen.
      *   The neighbor didn't call.
      *   The mailman didn't check the window.
      *   Elon Musk didn't fly a rescue drone to her apartment.
      *   Gravity didn't temporarily turn off.
  *   **Counterfactual Dependence is Everywhere:** Strictly speaking, if Elon Musk *had* flown a drone, she wouldn't have been there 14 hours. If gravity *had* turned off, she wouldn't have been hurt. If the counterfactual dependence is the only metric for causation, then Elon Musk and Gravity are just as much "causes" of her 14-hour ordeal as you are.
  *   **The Normative Filter:** Beebee argues that the only reason we single out *your* omission and not Elon Musk's is **normative**, not metaphysical. We have a social expectation that grandkids call grandparents. We do not have an expectation that CEOs perform rescues.
  *   **The Verdict:** When we say "Your not calling caused this," we are not describing the causal structure of the universe. We are describing the **violation of a norm**. We are saying, "You were the person *expected* to intervene, and you didn't." That is a moral statement disguised as a causal one.

  ### 3. Causation vs. Explanation
  The Beebee/Dowe framework forces a distinction between **causal ontology** (what actually happened in the fabric of reality) and **causal explanation** (what story we tell to make sense of it).

  *   **Ontology:** The reality is: A fall occurred + No automatic alert system triggered + No one physically intervened = 14 hours on floor.
  *   **Explanation:** Your uncle is looking for an *explanation* that assigns accountability. He is using causal language ("You caused this") to deliver a moral verdict ("You are responsible").

  Beebee would argue that omissive "causation" is really just **explanation by contrast**. We compare the actual world (you didn't call, she stayed) to a relevant possible world (you called, she was found). We select that specific possible world because of our social norms. But the fact that we select it doesn't make the omission a *real cause* in the same way the fall was a real cause.

  ### 4. The "Prevention" Distinction
  Finally, there is a robust philosophical distinction between **causing** and **allowing/preventing**.

  *   **Causing:** Initiating a new causal chain (e.g., pushing someone).
  *   **Allowing:** Failing to interrupt an existing causal chain (e.g., watching someone fall and not catching them).

  Even if one accepts that omissions have *some* causal relevance, the majority of philosophers who distinguish between acts and omissions agree that **allowing harm is metaphysically distinct from causing harm.**

  Your uncle's statement—"If you'd called... none of this happens"—is technically a true counterfactual. But the inference—"Therefore, your not calling caused the 14 hours"—is false. The 14 hours were caused by the injury and the lack of *any* intervention. Your role was that of a **potential interrupter** who failed to interrupt. You did not create the situation; you failed to resolve it. In metaphysics, that is a crucial difference.

  ### The Synthesis: Is Your Uncle Right?
  Based on the Beebee/Dowe framework: **No, your uncle does not have the metaphysics on his side.**

  He is conflating **Moral Responsibility** (based on duty, expectation, and role) with **Causal Responsibility** (based on physical processes and events).

  *   **Metaphysically:** You did not cause her to be on the floor. The fall did. You did not cause her to stay there. The injury and the lack of an alert system did.
  *   **Normatively:** You were the designated safety check. That role carries weight, and failing it carries guilt. But that guilt stems from a broken *agreement/expectation*, not from you physically exerting force on the situation.

  ### A Closing Thought
  You mentioned you aren't trying to weasel out of feeling bad. That speaks well of you. But there is a danger in accepting your uncle's metaphysics: if you believe you *caused* the harm, you carry the weight of the event itself. If you recognize that you *failed to prevent* the harm due to a human error (work deadline), you carry the weight of the mistake, but not the weight of the event.

  The Beebee/Dowe view suggests that your uncle is using causal language to express grief and anger. He is saying, "I wish you had been the one who saved her," but because that is painful, he is saying, "You made sure she wasn't saved."

  Metaphysically, the latter is false. The former is just a expression of loss. Distinguishing the two doesn't erase the regret, but it might stop you from carrying a burden that the structure of reality doesn't actually assign to you.

  *(Note: While metaphysics can clarify where responsibility lies in an abstract sense, family dynamics and grief are rarely solved by logic alone. If the guilt continues to spiral, speaking with a counselor can help process the difference between "what happened" and "what I feel I did.")*
