      *   **Goal:** Distinguish between *causal responsibility* (metaphysical) and *moral/normative responsibility* (expectations). The user wants to know if the uncle is metaphysically correct or confusing causation with expectation.
      *   **Constraint:** The user explicitly states they aren't trying to "weasel out of feeling bad," they want truth/clarity. I need to be empathetic but rigorous.

  2.  **Deconstruct the Philosophical Positions:**
      *   **David Lewis (Counterfactual Theory):** Causation is counterfactual dependence. If $C$ hadn't happened, $E$ wouldn't have happened. Omissions fit easily here. If I had called, she wouldn't have been there 14 hours. Therefore, not calling caused it.
      *   **Phil Dowe (Conserved Quantity Theory):** Causation requires a physical process, specifically the exchange or transfer of a conserved quantity (energy, momentum, charge). Omissions involve *no* physical process. Therefore, omissions cannot be genuine causes. They are "quasi-causes" or explanations, but not ontologically real causation.
      *   **Helen Beebee (Anti-Realism about Omissive Causation):** Causation is a relation between events. Non-events (omissions) don't exist. When we say "omission caused X," we are making a statement about *norms* and *expectations*, not describing the fabric of reality. We select specific omissions based on what *should* have happened, not what *could* have happened physically.

  3.  **Drafting the Argument (The "Beebee/Dowe Case"):**
      *   *Premise 1: The Nature of Causation (Dowe).* Real causation is physical. It's a "handshake" of energy. Not calling sends no photons, no sound waves, no energy. It is a null set. You can't build a physical chain from nothing.
      *   *Premise 2: The Problem of Infinity (Beebee).* If omissions are causes, *everything* that didn't happen is a cause. The fire department didn't come. Gravity didn't turn off. I didn't teleport. Why pick *my* call? Because of a *norm*.
      *   *Premise 3: Distinction between Causation and Explanation.* Saying "not calling caused it" is a useful *explanation* for humans, but it doesn't describe the *ontology* of the event. The real causes are gravity, the slippery floor, the lack of a medical alert button, the physiology of the fall.
