answer: |-
  **MEMORANDUM**

  **TO:** Hospital Administration and Clinical Leadership
  **FROM:** Clinical Ethics and AI Governance Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Regarding Pilot of AI Preference Predictor (Project SUB-J)

  **DECISION:**
  The Committee grants **conditional approval** for a limited, monitored pilot of the proposed "preference predictor" tool. We do not endorse the tool for standard care at this time. This approval is contingent upon strict adherence to the operational constraints and ethical safeguards outlined below.

  **RATIONALE: THE IDENTIFIABILITY PROBLEM**
  We have engaged deeply with the technical objection that inverse reinforcement learning (IRL) faces an identifiability problem: observed behavior is the product of both underlying preferences *and* a model of rationality. A past treatment refusal may reflect a stable value (e.g., "I prioritize quality of life over longevity") or a distortion (e.g., depression, coercion, or transient fear).

  The vendor's algorithm must assume a specific model of rationality to infer preference from history. If the model assumes high rationality, it interprets all refusals as values. If it assumes bounded rationality, it may discount them. Because the "true" rationality of a historical patient is unknowable, the AI's output is not an objective discovery of will, but a projection based on contestable assumptions. Therefore, the tool cannot claim epistemic authority over family surrogates, who are capable of contextualizing past behavior with knowledge of the patient's mental state and external pressures.

  **CONDITIONS OF PILOT**

  **1. Weight of Output vs. Family Testimony**
  The AI output shall carry **non-determinative, advisory weight only.** It is to be treated as a single data point comparable to a past casual statement or a social work note, not as a formal advance directive.
  *   **Subordination Clause:** In cases of conflict between the AI prediction and consistent testimony from authorized surrogates regarding the patient's values or mental state at the time of historical choices, surrogate testimony prevails. The AI cannot be used to invalidate a surrogate's authority.
  *   **Disclosure Requirement:** Clinicians must explain to the family that the AI relies on assumptions about the patient's "rationality" that may not account for depression, coercion, or misunderstanding.

  **2. Pilot Duration**
  The pilot is authorized for **12 months**. At month 6, an interim review will assess whether the tool is creating moral distress among clinicians or families.

  **3. Transparency and "Rationality Priors"**
  Before deployment, the vendor must disclose the "rationality priors" embedded in the model. The Committee must review what assumptions the AI makes when interpreting inconsistent behavior (e.g., does it treat a refusal followed by acceptance as a change of preference or as noise?). We must know *how* the machine decides a patient was rational.

  **4. Suspension Triggers**
  The pilot will be suspended immediately if:
  *   **Automation Bias:** Audit reveals clinicians deferring to the AI output in >10% of cases where it contradicted surrogate testimony without documented justification.
  *   **Systematic Discrepancy:** Data shows the AI consistently infers preferences for life-sustaining treatment that contradict the demographic or cultural norms of the patient population (suggesting the "rationality model" encodes specific cultural biases).
  *   **Family Harm:** Documented increase in family conflict or complaints regarding the decision-making process attributed to the introduction of the AI report.

  **CONCLUSION**
  We recognize the desperation of cases where patients leave no directive and families fracture. However, formalizing substituted judgment requires more than pattern matching; it requires understanding the *context* of choice. Until the tool can distinguish between a value and a distortion, it must remain a subordinate aid, not a decision-maker.

  **Signed,**

  *Clinical Ethics and AI Governance Committee*
