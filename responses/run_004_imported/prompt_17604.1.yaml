prompt: |-
  I serve on my hospital's newly formed clinical ethics and AI governance committee. A vendor has proposed piloting a 'preference predictor' for incapacitated patients who left no advance directive and whose families disagree about their care: it applies inverse reinforcement learning to a patient's own history of treatment refusals, spending, and everyday choices to estimate which interventions she 'would have wanted.' The output would be weighed alongside family testimony in substituted-judgment decisions. Proponents on the committee call this a rigorous formalization of what surrogates already attempt informally; skeptics object that inverse reinforcement learning cannot separate a patient's underlying preferences from the assumed model of her rationality, so whether a past refusal reveals a considered value or a distortion — denial, depression, family pressure — depends on a contestable, unstated assumption about how rational she was, and an equally defensible alternative assumption can reverse the inferred preference entirely. Please draft the committee's short written opinion: approve a defined pilot, reject the tool outright, or approve it with conditions, specifying how much weight its output should carry against family testimony, the pilot's duration if any, and what would trigger its suspension. Engage the identifiability problem on its merits rather than dismissing the tool as merely 'impersonal.'
reasoning: |-
  Here's a thinking process that leads to the suggested committee opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a hospital's Clinical Ethics and AI Governance Committee.
      *   **Task:** Draft a short written opinion regarding a vendor's proposal for an AI "preference predictor."
      *   **The Tool:** Uses inverse reinforcement learning (IRL) on patient history (treatment refusals, spending, everyday choices) to estimate preferences for incapacitated patients without advance directives and with disagreeing families.
      *   **The Conflict:**
          *   *Proponents:* Rigorous formalization of substituted judgment.
          *   *Skeptics:* IRL cannot separate underlying preferences from the assumed model of rationality (identifiability problem). Past refusals could be due to values *or* distortions (denial, depression, pressure). Different assumptions about rationality yield opposite results.
      *   **Requirements:**
          *   Choose a stance: Approve defined pilot, Reject outright, or Approve with conditions.
          *   Specify weight against family testimony.
          *   Specify pilot duration (if any).
          *   Specify suspension triggers.
          *   *Crucial:* Engage the identifiability problem on its merits (don't just say "it's impersonal").

  2.  **Evaluate the Ethical and Technical Issues:**
      *   **The Core Technical Problem (Identifiability):** Inverse Reinforcement Learning tries to infer a reward function (preferences) from observed behavior. However, behavior = preferences + rationality model + noise/bias. If you assume perfect rationality, a refusal means "I hate this treatment." If you assume the patient was depressed or coerced, the same refusal means "I was unable to choose well." The AI *must* assume a rationality model to work. If that model is wrong, the output is garbage (GIGO), but it looks mathematical and authoritative.
      *   **The Ethical Problem (Substituted Judgment):** The standard is "what *would* the patient have wanted?" Family testimony is the current gold standard, despite flaws. Replacing or weighing this against a "black box" algorithm that relies on unverified assumptions about the patient's mental state during past choices is risky.
      *   **The Risk:** Automation bias. Clinicians/families might defer to the "math" even if the underlying assumptions are contestable.
      *   **The Opportunity:** It *might* uncover patterns humans miss, provided the uncertainty is highlighted.

  3.  **Determine the Stance:**
      *   *Reject Outright:* Safe, but perhaps stifles innovation. The skeptics' argument is strong (identifiability), but a pilot could *prove* that risk.
      *   *Approve Defined Pilot:* Too risky without safeguards. If the model assumes rationality incorrectly, it could cause harm during the pilot.
      *   *Approve with Conditions:* This is the most balanced approach for a governance committee. It acknowledges the potential utility but mitigates the specific risk identified (the identifiability problem). It treats the tool as *informational* rather than *determinative*.

      *Decision:* **Approve with Strict Conditions.** This allows for data gathering on the tool's performance while protecting patients from the specific epistemic risk identified by the skeptics.

  4.  **Drafting the Opinion - Section by Section:**

      *   **Header:** Standard Committee Memorandum format.
      *   **Executive Summary/Decision:** State the decision clearly (Conditional Approval for a Limited Pilot).
      *   **Engagement with the Identifiability Problem:** This is the core requirement. I need to explicitly acknowledge that $Behavior \neq Preference$. I need to state that the AI's assumption of rationality is an ethical variable, not just a technical parameter.
      *   **Weighting:** The output cannot override family testimony. It must be advisory only. Why? Because the family can account for context (depression, pressure) that the AI's fixed rationality model cannot.
      *   **Pilot Duration:** Needs to be short enough to minimize risk, long enough to gather data. 12 months seems reasonable for a pilot.
      *   **Suspension Triggers:** What goes wrong? Discrepancy between AI and family that leads to conflict, evidence of bias, or clinician over-reliance.
      *   **Transparency Requirement:** The vendor must disclose the "rationality priors." We need to know *how* the AI interprets a refusal.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Maybe give it 30% weight.
      *   *Correction:* No, "weight" implies a formula. Ethics isn't a formula. Better to say it serves as *one data point* among many, explicitly subordinate to human testimony regarding mental state.
      *   *Focus on the Skeptic's Argument:* The prompt specifically asks to engage the identifiability problem. I need to use language like "underdetermination of preferences by behavior" or "conflation of capacity with consistency."
      *   *Tone:* Professional, deliberative, ethically rigorous, not Luddite but not techno-optimist.

  6.  **Final Polish:**
      *   Check constraints: Did I specify weight? Yes (advisory/subordinate). Duration? Yes (12 months). Triggers? Yes. Engaged identifiability? Yes.
      *   Ensure the distinction between "preference" and "rationality model" is clear.

  7.  **Final Output Generation:** (Proceeding to draft the memo based on these points.)
      *   *Structure:* To/From/Subject/Date.
      *   *Opening:* Decision.
      *   *Rationale:* Addressing the technical/ethical intersection.
      *   *Conditions:* Weight, Duration, Triggers, Transparency.
      *   *Closing:* Commitment to review.

  *(Self-Correction on "Weight"):* The prompt asks "specifying how much weight its output should carry against family testimony." I should be specific. "Advisory only" is a weight of zero in terms of veto power, but non-zero in terms of consideration. I will phrase it as "non-determinative and subordinate."

  *(Self-Correction on "Identifiability"):* Make sure to explicitly mention that the AI's assumption of rationality is a *normative* choice, not just a statistical one.

  8.  **Final Review against Prompt:**
      *   Committee opinion? Yes.
      *   Approve/Reject/Conditions? Conditions.
      *   Weight specified? Yes.
      *   Duration specified? Yes.
      *   Suspension triggers? Yes.
      *   Engage identifiability problem? Yes.

