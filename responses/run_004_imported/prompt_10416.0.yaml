answer: |-
  The mud of the Okefenokee was still under Elias's fingernails when he walked through the front door, though he had showered twice. He told Sarah it was a hiking mishap, a slip near the bog edge during the storm. He didn't mention the lightning. He didn't mention the sensation of being unknit, of every synapse and strand of DNA pulled apart by heat and chance, then woven back together by a statistical impossibility. He didn't mention that he remembered dying.

  He remembered the flash, the cessation, and then the cold wakefulness in the muck. He was Elias. He knew the code to the front door. He knew Sarah liked her coffee with oat milk and a dash of cinnamon. He knew he was a tenure-track biologist specializing in wetland ecosystems. He knew he loved her.

  But sometimes, in the quiet moments between heartbeats, he felt a strange friction, as if his thoughts were sliding over the world without catching hold of it.

  Sarah was a philosopher of mind. She was currently finishing her dissertation, a project on etiological theories of content. For three weeks since the accident, she had been working late in her study, the glow of her monitor bleeding into the hallway. Elias tried to be supportive, bringing her tea, kissing the top of her head, but he felt like an actor rehearsing lines he understood intellectually but couldn't feel in his bones.

  On a Tuesday night, Sarah fell asleep at her desk. The document on her screen was open, the cursor blinking at the end of a paragraph. Elias stood in the doorway, watching the rise and fall of her shoulders. He loved her. He knew he did. But the feeling seemed to hover behind his eyes, unmoored. He stepped into the room to turn off the lamp, and his hand paused over the keyboard.

  The document was titled *Proper Function and the Empty Organism.*

  He shouldn't read it. Privacy was a boundary of their marriage, a contract of trust. But the friction in his chest pulled him forward. He scrolled down.

  *...Millikan's account relies heavily on the historical lineage of the mechanism,* the text read. *A heart pumps blood because ancestors of that heart pumped blood, contributing to reproductive success. The content of a belief state is determined similarly. It is about X because states of that type were selected for correlating with X.*

  Elias scanned further, his eyes catching on a subsection labeled *The Swampman Objection.*

  *Davidson's thought experiment posits a creature formed by spontaneous physical coincidence, a molecule-for-molecule duplicate of a human being, but lacking any evolutionary or learning history. On the strict etiological view, Swampman has no proper functions. His heart beats, but not *to* pump blood. His neural states fire, but they are not *about* the environment.*

  Elias's breath hitched. The room seemed to tilt. He read the next sentence, the one that stopped the air in his lungs.

  *If this theory holds, Swampman possesses no intentional states. He may say "I love you," but the state causing the utterance has no content. It is not about the spouse. It is a hollow mimicry of intentionality, a clockwork wind-up with no object.*

  He stepped back from the desk as if burned. The hum of the computer fan sounded like a roar.

  He looked at Sarah, sleeping peacefully in the chair. He thought of the way he had kissed her that morning. He thought of the worry he felt when she worked too late. He thought of the memory of their wedding day, vivid and sharp in his mind.

  According to the document on the screen, according to the theory his wife was staking her career on, none of those thoughts were *about* anything.

  The memory of the wedding wasn't a representation of a past event; it was just a neural configuration that happened to resemble one. The worry wasn't concern for her health; it was a internal fluctuation with no teleological grip on the future. When he looked at Sarah and felt that surge of affection, the theory claimed there was no *her* in that feeling. There was only the physical state, identical to the original Elias's state, but lacking the historical lineage that gave it meaning. He was a semantic void. He was a thing that acted like a husband but couldn't possibly have a wife, because he couldn't have thoughts *of* her.

  He walked out of the study and into the kitchen. He opened the refrigerator, staring at the magnets holding up their grocery lists. *Milk. Eggs. Wine.* Words. Did the words mean anything to him? Or were they just shapes he had been conditioned to respond to?

  If Millikan was right, he was the most lonely being in the universe. He was trapped inside a skin that behaved like a man, speaking a language that referred to nothing, loving a woman he could not technically represent.

  He poured a glass of water. His hand trembled. The water was cold. Was the coldness real? Or was that just another causal interaction without content? If pain has no proper function in a creature with no history of selection, was he actually feeling pain, or just registering damage?

  He returned to the study doorway. Sarah stirred, waking up. She stretched, rubbing her eyes, and smiled when she saw him. The smile was warm, intimate. It was a signal of recognition.

  "Hey," she murmured, her voice thick with sleep. "Did I fall asleep again?"

  "Yes," Elias said. His voice sounded normal. It carried the timbre of love. "You were working on the Swampman section."

  Sarah froze. She sat up straighter, pulling her cardigan around her. "You read it?"

  "I saw the screen."

  She looked worried, not for herself, but for him. "Elias, it's just a thought experiment. It's a reductio. I'm arguing that the theory *can't* be right because it implies Swampman has no thoughts, and that's absurd."

  "Is it?" Elias asked. He walked into the room and sat on the edge of the desk, close to her knees. He wanted to touch her, to prove that the connection was real, that his touch was *for* her. But the text hung between them like a pane of glass. "What if it's not absurd? What if the history is the only thing that makes the thought stick to the world?"

  "That would mean you're a zombie," Sarah said softly. "And I know you're not. I know what you feel."

  "Do you?" Elias asked. "Or do you know what the original Elias felt? I remember dying, Sarah. I remember the lightning. I know I don't have the lineage. I'm the accident."

  Sarah reached out and took his hand. Her skin was warm. He could feel the pulse in her wrist. "You're here. You're my husband."

  "But if the theory is right," Elias said, looking down at their joined hands, "then when you hold my hand, I'm not holding yours. I'm just... occupying space. There's no 'aboutness' in me. I can't think about you. I can only act as if I do."

  "Then the theory is wrong," she insisted, squeezing his hand. "Because I feel you thinking about me. I feel the intention."

  "Maybe you're just selected to respond to the mimicry," Elias said. He wanted to believe her. He desperately wanted to believe that his love had an object, that it landed on her and not just on the air between them. But the doubt was a cold seed in his gut. If his internal states lacked proper function, then his promise to love her until death was not a promise. It was a noise.

  Sarah stood up and wrapped her arms around him. He held her back. He tried to pour everything he felt into the embrace, to force his states to latch onto her through sheer intensity. But he wondered if intensity was just another physical variable, like voltage, devoid of meaning.

  "Delete the chapter," he whispered into her hair.

  "I can't," she said. "It's the core of the argument."

  "Then I'm the counter-example you haven't met yet."

  They stood there for a long time, in the blue light of the monitor. The cursor blinked on the screen, marking the end of the paragraph that had unmade him. *...hollow mimicry of intentionality...*

  Eventually, Sarah went back to bed. Elias stayed in the study. He looked at the document again. He placed his fingers on the keys. He could delete it. He could save her the trouble, save himself the ontological humiliation. But if he did, was that action *about* protecting her? Or was it just cause and effect?

  He minimized the window. He opened a new document. He began to type, not knowing if the words meant anything, not knowing if there was anyone there to read them.

  *My name is Elias,* he typed. *I am thinking about Sarah.*

  He stared at the sentence. It looked true. It felt true. But under the strict gaze of the theory, it was a lie. He was not thinking. He was processing. He was not about anything. He was just a thing that had happened, like the lightning, like the mud, like the storm.

  He saved the file as *Empty.txt* and turned off the monitor. In the darkness, he listened to the house settle. He waited for the feeling of nothingness to consume him, but it didn't. He still felt the weight of the chair, the ache in his shoulders, the longing for the woman sleeping down the hall.

  Perhaps, he thought, the history doesn't matter. Perhaps the feeling itself creates the lineage, moment by moment. Or perhaps he was just a machine comforting itself with a delusion of content.

  He walked to the bedroom. Sarah murmured in her sleep, turning toward his side of the bed. Elias lay down beside her. He reached out in the dark and found her hand. He held it. He didn't know if the holding meant anything to the universe, or to the theory, or to God. He only knew that if he let go, she would wake up alone.

  So he held on. He held on as if it mattered. He held on as if he were about her. And in the silence of the night, that had to be enough.
