answer: |-
  This is one of the most difficult and necessary questions in the historiography of analytic philosophy. You are right to reject the lazy biographical reduction ("bad man, bad logic") just as you should reject the hagiographic sanitization ("great logician, irrelevant politics").

  Here is my reconstruction of where Frege would stand in contemporary Germany, followed by my definitive take on the philosophy-politics connection.

  ### Part 1: Frege in the Federal Republic

  To transpose 1924 Frege into 2024 Germany, we must look at the *structure* of his reactionary thought, not just the specific slurs. His diary reveals a specific constellation of commitments: monarchism, anti-parliamentarianism, ethno-nationalism, and a belief in hierarchy based on "capacity" and "stake."

  **1. The European Union**
  Frege would almost certainly be a Eurosceptic, but not for the economic reasons of a modern libertarian. His nationalism was romantic and organic. He viewed the German *Volk* as a historical unity that required a sovereign state to express its will. The EU, as a supranational bureaucratic entity that dilutes sovereignty and enforces multicultural norms, would strike him as the ultimate realization of the "rootless" liberalism he despised in Weimar.
  *   **Nuance:** However, Frege was also a pragmatist about power. If the EU were clearly a vehicle for German hegemony (a *Mitteleuropa* under German direction), he might tolerate it. But the current EU's emphasis on shared sovereignty and human rights universalism contradicts his belief that rights are derived from membership in a specific national community. He would view the European Parliament as a "talking shop" of the worst sort—Weimar on a continental scale.

  **2. Mass Immigration**
  This is where his views map most directly. Frege's antisemitism was not primarily theological; it was ethno-nationalist. In his diary, he argues that Jews should be stripped of civil rights and expelled to a homeland of their own because they constituted a separate "nation" within Germany. He distinguished between "assimilated" Jews (whom he still distrusted) and "Eastern Jews" (whom he viewed as an alien invasive element).
  *   **Application:** He would view modern mass immigration (particularly from non-European cultures) as an existential threat to the homogeneity required for a state to function. He would not merely support border controls; he would likely advocate for the revocation of citizenship for those deemed "unassimilable." His criterion for belonging was not legal residency but cultural/biological kinship. He would see Germany's *Leitkultur* debates as too timid.

  **3. The AfD and Modern Democracy**
  This is the most complex fit. Frege was not a fascist in the Mussolini/Hitler sense (he died before the seizure of power), nor was he a populist. He was a reactionary elitist.
  *   **The Conflict:** The AfD is a parliamentary party. Frege explicitly argued in his diary against universal suffrage. He proposed a system where voting rights were tied to property and education, effectively disenfranchising the working class and women. He wanted a restoration of the monarchy or a dictatorship of the "capable."
  *   **The Alignment:** He would find the *völkisch* wing of the AfD (e.g., Björn Höcke) ideologically sympathetic regarding nationalism and immigration. However, he would likely despise the AfD's participation in the democratic process itself. To Frege, the legitimacy of the Weimar Republic was null because it was based on the "rule of the masses." He would view the Basic Law (*Grundgesetz*) as illegitimate.
  *   **Verdict:** He would not be a card-carrying member of the AfD. He would be the intellectual *vaterland* behind the scenes, writing pamphlets arguing that the AfD is too compromised by democracy. He would likely yearn for a "strongman" who would dissolve the Bundestag. He is less a precursor to the modern parliamentary Right and more a precursor to the "Conservative Revolution" thinkers (like Carl Schmitt) who wanted to end the parliamentary system entirely.

  ### Part 2: The Connection Between Philosophy and Politics

  You asked for my actual take, without wishy-washiness. Here it is:

  **There is a profound structural affinity between Frege's logic and his politics, and pretending otherwise is an act of philosophical sanitization that obscures the motivations of the analytic project.**

  It is true that the *validity* of the *Begriffsschrift* is independent of Frege's bigotry. Modus Ponens does not care about the Kaiser. To claim that his antisemitism makes his logic *false* is indeed the genetic fallacy. However, to claim that his politics are *irrelevant* to understanding his philosophical project is to misunderstand what philosophy is. Philosophy is not just a set of theorems; it is a driven activity motivated by specific fears, desires, and metaphysical intuitions.

  Here is the connection: **The Horror of the Contingent.**

  **1. Anti-Psychologism as Political Elitism**
  Frege's war on psychologism was a war against the "human, all too human." He hated the idea that truth could depend on how human minds *happen* to work. He wanted truth to be hard, objective, and independent of us.
  *   **The Political Parallel:** This maps exactly onto his hatred of democracy. Democracy is the rule of the "psychological"—the shifting whims of the masses, the contingent, the emotional, the subjective. Frege wanted the State to be like Logic: objective, rigid, and independent of the "whims" of the voters. His desire for a "Third Realm" of Thoughts is the metaphysical blueprint for an aristocratic state ruled by those who can access that realm (the educated elite), rather than the muddy realm of becoming (the masses).

  **2. The Obsession with Purity**
  Frege's logic is obsessed with boundaries. Objects cannot be concepts. Concepts cannot be objects. Sense cannot be reference. There is a terror of category mistakes, of mixture, of blurring.
  *   **The Political Parallel:** His politics is obsessed with boundaries of blood and nation. The "mixture" of races (which he explicitly rails against) is the political equivalent of a category mistake. Just as a concept cannot be an object, a Jew cannot be a German. The drive for logical purity and the drive for ethnic purity stem from the same temperamental source: a deep anxiety about ambiguity and contamination.

  **3. Objectivity as Authority**
  Frege sought to ground arithmetic in logic to save it from skepticism and relativism. He wanted absolute foundations.
  *   **The Political Parallel:** In a Germany defeated in WWI, humiliated by Versailles, and chaotic under Weimar, Frege sought absolute foundations for the State. He wanted an authority that could not be questioned, just as a logical law cannot be questioned. His Platonism is not just a theory of numbers; it is a theory of Authority. If Truth is "out there" and we must submit to it, then the Political Order should be "out there" (monarchy/tradition) and we must submit to it.

  **The Verdict:**
  Dummett wanted to save Frege for analytic philosophy, so he treated the politics as a tragic, inexplicable blemish on a otherwise pure mind. I think this is wrong. The "purity" of the mind *is* the problem. The drive to excise the subjective, the historical, and the contingent from logic is of a piece with the drive to excise the "alien" from the nation.

  We do not have to say "Frege's logic is fascist." We must say: **Frege's logic is a monument to a specific kind of authoritarian temperament.** It teaches us that the quest for absolute objectivity can sometimes be a flight from human responsibility and plurality.

  If we teach Frege without teaching this, we teach students that logic is a sterile tool disconnected from the life of the philosopher. But Frege proves the opposite: the more abstract the system, the more it reveals the philosopher's deepest anxieties about the world they actually inhabit. The *Begriffsschrift* is not just a tool for truth; it is a cage built to keep the chaos of the 20th century at bay. That is why the man who built it wanted to lock the "undesirables" outside that cage.

  To ignore this is not to avoid the genetic fallacy; it is to fail to understand the genealogy of our own discipline.
