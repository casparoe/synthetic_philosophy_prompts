          *   *Crucial Difference:* Health is generally a personal good. Morality is interpersonal/social. Also, medical compliance doesn't require *moral agency*, whereas ethical behavior is defined by agency. If a robot follows Asimov's laws, is it moral? Most say no.
      *   *The Child Analogy:*
          *   *Similarity:* Both involve accepting rules without full reasoning.
          *   *Difference:* Developmental stage. A 7-year-old lacks the cognitive capacity for abstract moral reasoning. An adult presumably has it. We excuse children for lack of capacity; we hold adults to a higher standard of autonomy.
      *   *The "Outsourcing" Issue:*
