answer: |-
  You have hit on one of the most famous and damaging internal tensions in *Anarchy, State, and Utopia*. Philosophers call this the "Argument from Marginal Cases," but your framing is more precise: you are identifying a fracture in the *grounding* of Nozick's entire theory.

  To build the strongest possible version of this argument using Nozick's own vocabulary, we need to show that the "Kantianism for humans, Utilitarianism for animals" split isn't just "odd"—it is a **performative contradiction** of the core logic that generates side constraints in the first place.

  Here is the argument, constructed strictly from Nozickian premises, demonstrating that the split collapses.

  ### 1. The Grounding of Side Constraints: "Separateness" not "Species"
  Nozick's rejection of utilitarianism rests on the claim that **"there is no social entity with a good that undergoes some sacrifice for its own good."** There are only individual people. To sacrifice one person for the benefit of others is to fail to respect the **separateness of persons**. It treats the individual as a mere resource or vessel for the collective utility.

  Side constraints exist to mark the moral boundaries around these distinct individuals. They say: *You cannot cross this line, even to prevent others from crossing similar lines elsewhere, and even to maximize overall good.*

  **The Contradiction:**
  If the justification for side constraints is the **separateness of distinct centers of consciousness**, then the relevant moral boundary is "subjecthood," not "humanity."
  *   When Nozick applies utilitarianism to animals, he is treating multiple distinct animal subjects as a single "container" of utility. He is summing the pain of Cow A and the pleasure of Human B.
  *   But Cow A is a distinct center of experience, just as Human B is.
  *   By aggregating Cow A's pain into a calculus that allows it to be overridden by Human B's pleasure, Nozick is doing exactly what he accused utilitarians of doing to humans: **ignoring the separateness of subjects.**

  If the "separateness of persons" is why humans get rights, then the "separateness of sentient subjects" is why animals must get rights. To deny this is to admit that the "separateness" argument was never the real reason; it was just a post-hoc justification for human exceptionalism.

  ### 2. The "Marginal Cases" Trap
  Nozick hints that the capacity to shape one's life according to an overall conception of the good (rational moral agency) is what triggers side constraints. This is the "Kantian" element: we are ends-in-ourselves because we are autonomous planners.

  **The Contradiction:**
  As you noted, this criterion fails on the margins of the human species.
  *   **Premise 1:** If side constraints are grounded *only* in the capacity for rational life-planning, then beings without this capacity do not have side constraints.
  *   **Premise 2:** Human infants, the severely cognitively disabled, and those in permanent vegetative states lack the capacity for rational life-planning (often to a degree lower than adult chimpanzees or elephants).
  *   **Premise 3:** Nozick (and almost any libertarian) intends for these humans to retain inviolable rights. We cannot harvest the infant's organs to save five geniuses, even if the utility math works.
  *   **Conclusion:** Therefore, the capacity for rational life-planning **cannot** be the necessary condition for side constraints.

  If Nozick protects the infant *without* rational agency, he must be protecting something else. He is likely protecting the **intrinsic value of a subjective life.** But if a subjective life is what matters for the infant, it matters for the cow. If the cow has a subjective welfare that can be harmed, and the infant is protected because it has a subjective welfare that can be harmed, then the cow must be protected on the same grounds. To draw the line at the species barrier is arbitrary, violating Nozick's own demand for principled boundaries.

  ### 3. The Return of the Utility Monster
  You mentioned the Utility Monster, and this is where the internal logic really breaks. Nozick uses the Monster to show that utilitarianism allows one being's capacity for satisfaction to devour everyone else's rights.

  **The Contradiction:**
  Nozick's hybrid model invites a **"Human Utility Monster"** scenario regarding animals.
  *   Imagine humans derive immense, trivial pleasure from eating meat or testing cosmetics (low cost to us, high utility).
  *   Imagine animals suffer immense pain (high cost to them).
  *   Under Nozick's "Utilitarianism for Animals," we simply weigh the aggregate. If enough humans enjoy the taste of a burger enough, it mathematically outweighs the cow's death, because the cow's suffering is just "negative utility" to be balanced, not a "rights violation" to be forbidden.
  *   But this recreates the Utility Monster problem *between species*. The human species becomes the Monster, whose aggregated trivial preferences justify the total sacrifice of the animal subjects.

  Nozick rejected utilitarianism for humans because it allows individuals to be sacrificed for the aggregate. By accepting utilitarianism for animals, he is permitting animals to be sacrificed for the human aggregate. If the moral wrong of utilitarianism is **sacrificing the individual to the sum**, then it is wrong regardless of whether the individual is human or non-human. To say otherwise is to claim that the "wrongness of sacrifice" is species-relative, which undermines the universalist pretensions of his natural rights theory.

  ### 4. The "Graded Rights" Failure
  Nozick does try to dodge this in a footnote. He suggests that perhaps rights come in **degrees**. Beings with higher autonomy get stronger side constraints; beings with lower autonomy get weaker ones. He thinks this allows him to give animals *some* protection without giving them *full* Kantian status.

  **The Contradiction:**
  This does not save the hybrid view; it destroys the utilitarian half of it.
  *   A "side constraint" is a **threshold deontology**. It says: *You cannot cross this line, no matter the benefit.*
  *   "Utilitarianism" is **aggregation**. It says: *You can cross any line, provided the benefit is high enough.*
  *   These are logically incompatible structures. You cannot have a "weak side constraint" that functions as a utilitarian calculation.
  *   If an animal has a right not to be tortured (a constraint), you cannot torture it even if it would save 1,000 other animals from mild discomfort. That is a constraint.
  *   If you *can* torture it because the math works out, then it **does not have a right**; it only has an interest.

  By admitting animals might have *some* rights (graded), Nozick admits they are not merely utility vessels. But if they are not merely utility vessels, then their suffering cannot be simply added up and traded off against human pleasure. The moment you grant them a "graded constraint," you have banned the utilitarian calculus for them. You have forced yourself to say, *"There is some amount of human benefit that is insufficient to justify this animal suffering."* That is the definition of a side constraint.

  ### The Conclusion of the Argument
  If we take Nozick's own reasoning seriously, the "Kantian/Utilitarian Split" is untenable.

  1.  **If** side constraints are based on the **separateness of subjects** (to prevent sacrifice for the aggregate), **then** any being with a distinct subjective experience (animals) must have side constraints.
  2.  **If** side constraints are based on **rational agency**, **then** marginal humans (infants, disabled) lose their side constraints (which Nozick cannot accept).
  3.  **If** we try to split the difference with **graded rights**, we cease to be utilitarians regarding animals, because a right (even a weak one) forbids aggregation beyond a certain point.

  Therefore, to remain consistent with his own rejection of utilitarianism and his own protection of vulnerable humans, Nozick is forced to concede that **any being with a subjective welfare is a "person" in the moral sense relevant to side constraints.**

  The "Wilt Chamberlain" argument relies on the idea that individuals own themselves and cannot be taxed (sacrificed) for others. But if the logic of "no sacrifice" applies to humans because they are distinct centers of value, it must apply to animals for the same reason. Otherwise, the argument isn't about *rights* or *separateness* at all; it's just a circular defense of human privilege disguised as philosophy. Your friend can't use Nozick to defend absolute human property rights while ignoring that Nozick's own logic suggests the cow has a property right in its own body that the farmer is violating.
