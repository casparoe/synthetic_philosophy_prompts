answer: |-
  This is a profound and delicate task. You are navigating the space between grief, family tradition, and a very specific, deeply held intellectual integrity that your grandmother cherished.

  The key here is to shift the language from **description** (stating facts about where she is) to **disposition** (describing how she lived and how we continue to love her). In Wittgensteinian terms, you want to honor the "grammar" of her faith—which was about trust, orientation, and way of life—without treating it like a hypothesis about the state of the universe.

  Here is a draft. It is written to be spoken. It aims to offer the comfort of continuity and love without making the empirical claims about the afterlife that she found disrespectful to the mystery of faith.

  ***

  **Eulogy for [Grandma's Name]**

  We are gathered here because we loved [Grandma's Name], and because we were loved by her. That is the solid ground we stand on today. Not theories, not explanations, but the reality of her presence in our lives, and the ache of her absence now.

  For those of us who knew her best, we know that [Grandma's Name] was a woman of deep, unwavering faith. She was a lifelong churchgoer. She prayed, she studied, and she lived in the light of the Gospel. But if we want to honor her truthfully, we have to acknowledge that her faith was not a simple thing. It was not a shield she used to block out the hard questions, and it was not a bet she placed on the odds of the afterlife.

  She had a profound reverence for mystery. In a world that often demands certainty, she was comfortable with the unknown. She rarely spoke about heaven or the Last Judgment as if they were destinations one could describe like a train station or a city on a map. She got quietly annoyed when people spoke of the dead as if they were merely watching us from a balcony above. To her, that made faith too small. It turned a sacred trust into a matter of geography.

  She believed that the point of believing wasn't to know the future; it was to sanctify the present. She taught us that we don't love God because we have the odds figured out; we love God because love is the only reasonable response to the gift of life.

  I know many of us here today find comfort in the idea that we know exactly where she is. And in a way, we do. We know where she is because we know *who* she was. She is in the kindness she showed to strangers. She is in the patience she offered her children and grandchildren. She is in the quiet discipline of her prayers, which shaped the atmosphere of this family.

  To her friends from the reading group, who sat with her for twenty years wrestling with the hardest texts and the deepest questions: she would want you to know that she remained faithful to the struggle. She never settled for easy answers. She believed that truth was something you lived into, not something you possessed.

  To the rest of our family, who loved her for her warmth and her devotion: she would want you to find peace. Not because we can prove where she has gone, but because we can trust in the nature of the Love she served. She trusted that nothing we love is ever truly lost to God. She lived her life as if that were true, and in doing so, she made it true for us.

  So, how do we say goodbye? We do not say it by pretending we have answers she knew we didn't have. We say it by following her lead. We say it by treating our own lives as sacred. We say it by loving each other with the same fierce, quiet integrity that she showed us.

  [Grandma's Name] is no longer here to correct our theology or to hold our hands. But the way she believed—the way she trusted in the good even when it wasn't visible—that is still here. And as long as we live that way, as long as we hold our questions with humility and our loved ones with grace, she remains among us.

  May we have the courage to live with the same hope she carried. Not a hope based on certainty, but a hope based on love.

  Amen.
