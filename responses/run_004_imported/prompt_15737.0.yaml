      *   *Solution 1 (Hempel):* Historically important, but generally considered unsatisfying now. It relies on an idealized notion of confirmation that ignores background knowledge, which most agree is unrealistic for actual scientific reasoning. It solves the logic but fails the intuition without a good mechanism.
