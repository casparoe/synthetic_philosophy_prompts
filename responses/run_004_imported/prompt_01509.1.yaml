          *   Situation B: 2A (11% \$1M, 89% \$0) vs 2B (10% \$5M, 90% \$0). Most choose 2B.
          *   This violates Independence/Sure-Thing Principle because the 89% outcome is common to both pairs and should be ignored, leaving identical choices.
      *   *Savage's View (Foundations of Statistics, 1954):* The Sure-Thing Principle is normative. If you violate it, you made a mistake in intuition, not the theory. "Decision theory is about how you *should* decide, not how you *do*."
      *   *Allais's View:* Expected Utility Theory (EUT) ignores the *structure* of the gamble (variance, regret, complementarity). Rationality isn't just logical consistency; it's about the psychological reality of the decision-maker. The axiom assumes away the very thing that matters (the interaction between probabilities).

  3.  **Drafting - Section by Section:**

