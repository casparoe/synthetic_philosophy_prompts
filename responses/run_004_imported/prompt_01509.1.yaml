          *   Allais responds to "logic": Logic applies to truth, not to human satisfaction under risk.
      *   **The Climax/Resolution:**
          *   Identify the fundamental divide: Is rationality *internal consistency* (Savage) or *adaptive coherence with psychological reality* (Allais)?
          *   End on the precise philosophical stalemate.

  4.  **Refining the Voices:**
