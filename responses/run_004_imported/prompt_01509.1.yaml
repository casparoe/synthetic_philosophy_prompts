      *   *Allais:* French, economist, focused on real-world behavior, psychological nuance, slightly more skeptical of abstract formalism. He should sound like someone inspecting the ground the cathedral is built on.
      *   *Language:* 1950s academic tone. Polite but firm.

  5.  **Drafting - Iteration 1 (Mental Outline):**
