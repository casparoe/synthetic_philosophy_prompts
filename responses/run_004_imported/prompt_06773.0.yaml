      *   *Nuance:* Mention Judea Pearl's "Virtual Evidence" as a competing method often used in AI/Intel. It treats the conditional as a likelihood ratio.
      *   *Nuance:* Van Fraassen's specific objection was that MinXent makes the probability of the *antecedent* change in weird ways.
