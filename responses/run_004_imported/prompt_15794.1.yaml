answer: |-
  This is genuinely one of the best analogies for legal theory I've heard in a long time. *The People v. The Frozen Burrito* is a perfect microcosm for the textualism vs. purposivism debate.

  You are asking how a small, informal polity (your house) should govern itself when the stakes are low (dishes) but the principles are high (fairness, labor, interpretation). Here is a breakdown of the implications of that legal debate for your group chat, addressing your specific questions on Scalia, the absurdity doctrine, and Goodhart's Law.

  ### 1. The Scalia Critique: Does "Intent" Exist in a Group Chat?

  Justice Scalia's primary objection to purposivism was that "legislative intent" is a fiction. In Congress, 218 representatives might vote for a bill for 218 different reasons. Some want to save the whales, others want to please a donor, others want to block a different amendment. To claim there is a single "intent" is to lie.

  **Does this hold up in a group house?**
  Technically, no. Practically, yes.

  *   **The Technical No:** In a 6-person house, you *can* ping the person who wrote the rule in the WhatsApp group. "Hey @Alex, when you wrote 'cooking,' did you mean thermal application or labor investment?" The intent is knowable in a way it isn't in Congress.
  *   **The Practical Yes:** Relying on intent creates instability.
      1.  **Memory Decay:** Six months later, @Alex might not remember.
      2.  **The Dead Hand Problem:** What if @Alex moved out? Does their intent from January bind the new roommate in June?
      3.  **The Committee Problem:** Even in a house, rules are usually agreed upon by consensus. If 4 people voted "Yes" on the rule, but 2 thought it meant "making a sandwich" and 2 thought it meant "using a stove," whose intent counts?

  **Implication for Rule Writing:**
  Scalia would argue that because intent is slippery (even in a small group), the **text must bear the weight.** If you want to exclude burritos, the text must say "preparation involving raw ingredients" or "active heat application for >10 minutes."
  *   **Takeaway:** In small groups, rely on text for *stability*, but use the group chat to clarify *ambiguity* immediately, not retrospectively. If you have to ask what a rule means three months later, the rule is broken.

  ### 2. The Absurdity Doctrine: A Purposivist Trojan Horse?

  You asked if leaning on the "absurdity doctrine" (the idea that you can ignore the text if the result is absurd) just smuggles purposivism back in.

  **The short answer is: Yes. 100%.**

  Scalia hated the absurdity doctrine precisely because it allows a judge to say, "I know what the text says, but I don't like the outcome, so I'll override it." It substitutes the interpreter's judgment for the legislature's text.

  **In the Burrito Case:**
  *   **Textualist View:** Does microwaving involve heat transformation of food? Yes. Therefore, it is cooking. The result (lazy person avoids dishes) might be annoying, but it's not "absurd" in a legal sense. It's just a loophole.
  *   **Purposivist/Absurdity View:** The purpose of the rule is to distribute *labor*. Microwaving is negligible labor. Exempting it creates a result where one person does zero work and another does all the cleaning. That is "absurd" relative to the goal of equity.

  **The Danger for Small Groups:**
  If you adopt the absurdity doctrine, you need a **Judge.** Who decides what is absurd?
  *   If it's the person washing the dishes, they will call everything absurd.
  *   If it's the person microwaving the burrito, nothing is absurd.
  *   If it's a house vote, you turn every dish dispute into a constitutional crisis.

  **Implication:**
  The absurdity doctrine works in law because there is a Supreme Court to make the final call. In a house, there is no Supreme Court. If you allow "absurdity" as an exception, you must define *who* has the authority to declare it. Otherwise, you invite constant conflict.

  ### 3. Goodhart's Law: The Economic Angle

  This is where your intuition is spot on. **Goodhart's Law** states: *"When a measure becomes a target, it ceases to be a good measure."*

  *   **The Goal:** Equitable distribution of household labor.
  *   **The Measure:** "Who cooks?"
  *   **The Target:** Exemption from dish duty.

  By microwaving the burrito, your housemate is **Goodharting** the rule. They are optimizing for the metric (cooking) while bypassing the goal (labor contribution).

  *   **Textualism enables Goodharting.** It provides the safe harbor. "The rule says X. I did X. You can't touch me." It creates a system where rule-compliance is separated from rule-purpose.
  *   **Purposivism fights Goodharting.** It looks at the spirit. "You didn't contribute labor, so you didn't meet the goal, even if you hit the metric."

  **Implication:**
  In a small group, **trust is the currency, not legal precision.** If someone Goodhart's your rules, they aren't breaking the law; they're violating the social contract. A textualist victory in the burrito case might be a relational defeat. If your housemate feels you are "gaming" the system to avoid labor, they will resent you, regardless of the dictionary definition of cooking.

  ### 4. Practical Advice for Your Polity

  So, how should a dozen-person meetup or group house write and interpret rules, given this analysis?

  **A. Draft for Purposivism, Enforce with Text (with a Safety Valve)**
  Write rules that describe the *outcome* rather than the *action*.
  *   *Bad (Textualist trap):* "Whoever cooks is off dishes."
  *   *Good (Purposive):* "Whoever prepares a meal from scratch is off dishes."
  *   *Better (Goodhart-resistant):* "Dish duty is waived for whoever contributes significant meal preparation labor, as determined by house consensus."

  **B. The "Ping Rule" (Solving the Scalia Problem)**
  Since you *do* have access to the legislature (the group chat), institute a rule of interpretation: **Contemporaneous Clarification.**
  If a rule is ambiguous, the first person to ask for clarification in the chat sets the precedent. If no one asks for 30 days, the "common understanding" becomes the binding text. This prevents people from hoarding a "secret interpretation" to spring on someone later (a classic bad-faith textualist move).

  **C. Institutionalize the Absurdity Doctrine**
  Don't let individuals decide what's absurd. Make it a **House Veto.**
  "If a rule leads to a result that 75% of the house agrees is unfair, the rule is suspended pending revision." This acknowledges that the text is subordinate to the group's cohesion. It admits that purposivism is the default, but requires a supermajority to activate it, preventing frivolous "this is absurd!" claims.

  **D. Recognize the "Hard Case"**
  Legal theorist Ronald Dworkin argued that "hard cases" make bad law. The Burrito Case is a hard case.
  *   **The Verdict:** Microwaving a frozen burrito is **not cooking.**
  *   **The Reasoning:** While it involves heat (text), it involves negligible labor (purpose). Allowing it incentivizes low-effort metric gaming (Goodhart's Law).
  *   **The Remedy:** The burrito-eater washes the dishes, but the house updates the rule to define "cooking" as "heating food for more than 10 minutes or combining more than 3 ingredients."

  ### Summary
  Your housemate is arguing like a 19th-century formalist; you are arguing like a modern pragmatist.
  *   **Scalia** warns you that relying on "intent" is messy, even in a group chat.
  *   **The Absurdity Doctrine** is indeed purposivism in disguise, and in a small group, it requires a agreed-upon arbiter to avoid chaos.
  *   **Goodhart's Law** confirms that your housemate is gaming the metric.

  In a family or house, **purposivism usually wins** because relationships matter more than consistency. If you win the argument but lose the roommate, you've failed the constitution of the house. Tell your housemate: "If we follow the text over the spirit, we aren't a community; we're a contract dispute waiting to happen."

  Now go wash the burrito wrapper.
