prompt: |-
  So my group house had a huge argument last week over whether microwaving a frozen burrito counts as "cooking" under our rule that whoever cooks is off dish duty, and it hit me we were basically re-running the textualism vs purposivism fight from legal interpretation, just with burritos instead of statutes. Could you walk through the most important implications of that debate for how a small group (a group house, a dozen-person meetup, whatever) should write and interpret its own internal rules? Specifically: does Scalia's objection to purposivism -- that "legislative intent" is basically a fiction once more than one person's involved -- still hold up when your "legislature" is a group chat where you can literally just ask whoever wrote the rule what they meant? And does leaning on something like the absurdity doctrine as a safety valve just smuggle purposivism back in through the side door anyway? honestly i think the burrito case is a textbook absurdity-doctrine case but my housemate disagrees. Bonus points if you can tie it into goodharting, since gaming the letter of a rule against its obvious spirit feels like the same move to me.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Scenario:** A group house argument over whether microwaving a frozen burrito counts as "cooking" for dish-duty exemption.
      *   **Core Analogy:** This mirrors the legal debate between *textualism* (strict adherence to the text) vs. *purposivism* (adherence to the intent/purpose).
      *   **Specific Questions:**
          1.  What are the implications of this debate for small group rule-making/interpretation?
          2.  Does Scalia's objection to "legislative intent" hold up when the "legislature" is a small group chat where you *can* ask the author?
          3.  Does using the "absurdity doctrine" just smuggle purposivism back in?
          4.  Tie this into *Goodhart's Law* (gaming the letter vs. spirit).
      *   **Tone:** Intellectual, slightly humorous (burritos), analytical, practical.

  2.  **Deconstruct the Legal Analogies:**
      *   *Textualism:* The rule says "cooks." A microwave heats food. Is heating cooking? Dictionary definition matters. Precedent matters.
      *   *Purposivism:* Why do we have the rule? To reward effort/labor. Microwaving requires minimal effort. Therefore, not cooking.
      *   *Scalia's Critique:* Intent is unknowable/fictional in a large legislature.
      *   *Small Group Context:* Intent *is* knowable. The "legislature" is 5-12 people in a WhatsApp group.
      *   *Absurdity Doctrine:* If the text leads to a result no reasonable person would intend, ignore the text. (e.g., "No vehicles in the park" -> Does an ambulance count?)
      *   *Goodhart's Law:* "When a measure becomes a target, it ceases to be a good measure." Microwaving a burrito to avoid dishes is gaming the metric.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the brilliance of the analogy. It's a perfect microcosm of legal theory. Set the stage (The People v. Burrito).

      *   **Implication 1: Rule Drafting (Ex Ante vs. Ex Post):**
          *   Small groups usually draft *ex post* (after a problem arises) or vaguely ("clean up after yourself").
          *   Textualism encourages precise drafting *ex ante*. If you want to exclude microwaves, say "thermal preparation involving raw ingredients."
          *   Purposivism allows vague drafting ("make a meal") but relies on trust/interpretation later.
          *   *Advice:* Small groups should lean purposive in drafting but textual in enforcement *unless* there's a dispute mechanism.

      *   **Implication 2: Scalia's Critique in a Group Chat:**
          *   Scalia says "Legislative intent is a fiction" because 535 members vote for different reasons.
          *   In a house of 6, intent is *not* a fiction. You can ping @Sarah.
          *   *However:* Relying on intent creates instability. What if Sarah moved out? What if Sarah forgot? What if 3 people meant X and 3 meant Y?
          *   *Conclusion:* Scalia's critique weakens, but the *practical* need for objective text remains to avoid constant polling of housemates. Text provides stability.

      *   **Implication 3: The Absurdity Doctrine & The Side Door:**
          *   User asks: Does absurdity doctrine just bring purposivism back?
          *   Answer: Yes, absolutely. Scalia hated it for that reason.
          *   In the house: Is microwaving a burrito "absurd"? To the dish-washer, yes. To the hungry lazy person, no.
          *   The danger: Who decides what's absurd? The judge (house manager)? The collective?
          *   If you allow the absurdity exception, you admit the text isn't supreme. That's purposivism with a different name.

      *   **Implication 4: Goodhart's Law:**
          *   Connect the legal theory to economics/systems design.
          *   Rule: "Cook = No Dishes."
          *   Metric: "Heat applied to food."
          *   Gaming: Microwave burrito.
          *   Textualism enables Goodharting (follow the letter, ignore the spirit).
          *   Purposivism fights Goodharting (look at the effort).
